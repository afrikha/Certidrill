# Local development: PostgreSQL only (the app runs with `npm run dev`).
#   npm run db:up      # start (data kept in the certidrill-dev volume)
#   npm run db:down    # stop
# Credentials match DATABASE_URL in .env.example.
name: certidrill-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: certidrill
      POSTGRES_USER: certidrill
      POSTGRES_PASSWORD: certidrill
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certidrill -d certidrill"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
    name: certidrill-dev
