# SonarQube Cloud (https://sonarcloud.io) — or a self-hosted SonarQube server.
# The organization and project key can be overridden by the CI repository
# variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY.
sonar.organization=afrikha
sonar.projectKey=afrikha_Certidrill
sonar.projectName=Certidrill

sonar.sources=app,components,lib,i18n,tools,auth.ts
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/.next/**,coverage/**,content/**,prisma/migrations/**,**/*.d.ts
sonar.test.inclusions=tests/**
sonar.sourceEncoding=UTF-8

# Coverage: Vitest (unit + integration + components), lcov report.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Next.js pages and layouts are server-rendered wiring covered by the Playwright
# end-to-end suite (not by lcov); CLI tools and configuration have no unit tests.
sonar.coverage.exclusions=app/*.tsx,app/(app)/**,app/(exam)/**,app/(marketing)/**,app/admin/**,app/login/**,tools/**,i18n/**,auth.ts,lib/db.ts
# Duplication: test fixtures are allowed to repeat themselves.
sonar.cpd.exclusions=tests/**

# The scan fails when the quality gate fails (coverage on new code ≥ 80 %, etc.).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
