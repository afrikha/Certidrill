- article /A virtual network named VNet1 contains a subnet named Workload and a network virtual appliance \(NVA\) with the private IP address \d+\.\d+\.9\.4\. IP forwarding is already enabled on the NVA's network interface\. You need all the internet-bound traffic from the Workload subnet to go through the NVA\. Which three actions should you perform in sequence\? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order\./:
  - paragraph:
    - text: A virtual network named
    - strong: VNet1
    - text: contains a subnet named
    - strong: Workload
    - text: /and a network virtual appliance \(NVA\) with the private IP address \d+\.\d+\.9\.4\. IP forwarding is already enabled on the NVA's network interface\./
  - paragraph: You need all the internet-bound traffic from the Workload subnet to go through the NVA.
  - paragraph: Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  - region "Actions":
    - heading "Actions" [level=3]
    - list:
      - listitem:
        - text: Create a route table.
        - button "Add →"
      - listitem:
        - text: Add a route for 0.0.0.0/0 with the next hop type
        - strong: Virtual appliance
        - text: /and the address \d+\.\d+\.9\.4\./
        - button "Add →"
      - listitem:
        - text: Associate the route table with the Workload subnet.
        - button "Add →"
      - listitem:
        - text: Create a NAT gateway and associate it with the Workload subnet.
        - button "Add →"
      - listitem:
        - text: Create a network security group with an outbound rule allowing the internet.
        - button "Add →"
      - listitem:
        - text: Associate the route table with GatewaySubnet.
        - button "Add →"
  - region "Answer area (0 of 3)":
    - heading "Answer area (0 of 3)" [level=3]
    - list
    - status