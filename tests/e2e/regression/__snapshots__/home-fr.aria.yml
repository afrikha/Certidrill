- main:
  - paragraph: /Examens blancs AZ-\d+/
  - heading "Des examens blancs au plus près de l'examen réel" [level=1]
  - paragraph: "/Chronomètre, sections verrouillées, études de cas, écran de révision et score sur \\d+ : entraînez-vous dans les conditions du jour J, puis comprenez chaque erreur\\./"
  - link "Se connecter":
    - /url: /login
  - paragraph: "Les inscriptions sont fermées pour le moment : les comptes sont créés par l'administrateur."
  - region "Le format de l'examen":
    - term: comme le jour J
    - definition: /\d+ min/
    - term: questions par examen
    - definition: /\d+ à \d+/
    - term: pour réussir
    - definition: /\d+\/\d+/
    - term: de questions, plus les études de cas
    - definition: 8 types
  - heading "Comment ça marche" [level=2]
  - list:
    - listitem:
      - heading "Passez un examen blanc complet" [level=3]
      - paragraph: "Sections chronométrées, questions à marquer pour révision, études de cas : le déroulé de l'examen réel."
    - listitem:
      - heading "Obtenez votre score" [level=3]
      - paragraph: Un score global sur la même échelle que l'examen, et le détail domaine par domaine.
    - listitem:
      - heading "Comprenez chaque erreur" [level=3]
      - paragraph: Chaque question est corrigée et expliquée, avec un lien vers la documentation Microsoft Learn.
  - heading "Pensé pour vous préparer, pas pour réciter" [level=2]
  - list:
    - listitem:
      - heading "Conditions réelles" [level=3]
      - paragraph: Même durée, même nombre de questions, mêmes formats et mêmes règles de navigation que l'examen.
    - listitem:
      - heading "Des examens tous différents" [level=3]
      - paragraph: Chaque examen blanc est assemblé à partir de la banque, sans répéter une question tant qu'elle le permet.
    - listitem:
      - heading "Une correction qui explique" [level=3]
      - paragraph: Pourquoi la bonne réponse est juste, pourquoi les autres sont fausses, et où réviser.
    - listitem:
      - heading "Votre progression" [level=3]
      - paragraph: Un indice de préparation et l'historique de vos scores pour savoir quand vous êtes prêt.
  - heading "Tous les formats de l'examen" [level=3]
  - list:
    - listitem: Choix unique
    - listitem: Choix multiple
    - listitem: Oui / Non par affirmation
    - listitem: Listes déroulantes
    - listitem: Glisser-déposer
    - listitem: Mise en ordre
    - listitem: Zone active
    - listitem: Séries de scénarios
    - listitem: Études de cas
  - heading "Commencez gratuitement" [level=2]
  - paragraph: Passez un examen blanc complet sans payer. Prenez l'accès complet quand vous voulez aller plus loin.
  - list:
    - listitem:
      - heading "Découverte" [level=3]
      - paragraph: 0 €
      - paragraph: Sans carte bancaire
      - list:
        - listitem: 1 examen blanc complet par certification
        - listitem: La correction des questions ratées
        - listitem: Score par domaine et progression
      - link "Se connecter":
        - /url: /login
    - listitem:
      - text: Accès complet
      - heading "Pass Certification" [level=3]
      - paragraph: /\d+,\d+ €/
      - paragraph: /TTC, paiement unique, \d+ jours/
      - list:
        - listitem: Des examens blancs complets illimités
        - listitem: "La correction complète : toutes les questions, avec pourquoi chaque option est juste ou fausse"
        - listitem: Indice de préparation, progression et historique, comme avec l'accès gratuit
      - paragraph: Le paiement en ligne ouvre prochainement.
  - heading "Questions fréquentes" [level=2]
  - group: Les questions viennent-elles de l'examen réel ?
  - group: Le score est-il comparable à celui de l'examen ?
  - group: Que se passe-t-il si je ferme la page pendant un examen ?
  - group: Que comprend l'accès gratuit ?
  - heading "Prêt à vous mesurer à l'examen ?" [level=2]
  - paragraph: Un examen blanc complet, un score, et la liste précise de ce qu'il vous reste à réviser.
  - link "Se connecter":
    - /url: /login
  - heading "Certifications disponibles" [level=2]
  - list:
    - listitem: /az-\d+ — Microsoft Azure Administrator/