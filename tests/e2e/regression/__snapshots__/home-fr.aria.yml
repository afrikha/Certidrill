- main:
  - paragraph: 1 certification · Microsoft
  - heading "Préparez votre certification comme le jour de l'examen" [level=1]
  - paragraph: Des examens blancs fidèles à l'examen réel, une correction qui explique chaque option, un cours avec quiz de fin de chapitre et un indice qui vous dit quand vous êtes prêt.
  - link "Se connecter":
    - /url: /login
  - link "Voir les certifications":
    - /url: "#certifications"
  - paragraph: "Les inscriptions sont fermées pour le moment : les comptes sont créés par l'administrateur."
  - region "Certidrill en chiffres":
    - term: certifications à préparer
    - definition: "1"
    - term: "éditeur : Microsoft"
    - definition: "1"
    - term: formats de questions, études de cas comprises
    - definition: "9"
    - term: interface et contenus en français et en anglais
    - definition: FR · EN
  - region "Tout pour réussir, au même endroit":
    - paragraph: Fonctionnalités
    - heading "Tout pour réussir, au même endroit" [level=2]
    - paragraph: "Apprendre, s'entraîner, comprendre ses erreurs et savoir quand réserver l'examen : chaque étape a son outil."
    - list:
      - listitem:
        - heading "Des examens blancs fidèles" [level=3]
        - paragraph: "Même durée, même nombre de questions et mêmes règles que l'examen réel : chronomètre, sections verrouillées, études de cas, séries Oui / Non et écran de révision. Chaque examen est différent."
        - heading "Tous les formats de l'examen" [level=4]
        - list:
          - listitem: Choix unique
          - listitem: Choix multiple
          - listitem: Oui / Non par affirmation
          - listitem: Listes déroulantes
          - listitem: Glisser-déposer
          - listitem: Mise en ordre
          - listitem: Zone active
          - listitem: Séries de scénarios
          - listitem: Études de cas
      - listitem:
        - heading "Une correction qui explique" [level=3]
        - paragraph: Pourquoi la bonne réponse est juste, pourquoi chaque autre option est fausse, et où approfondir dans la documentation Microsoft Learn.
      - listitem:
        - heading "Un cours structuré" [level=3]
        - paragraph: Des chapitres découpés en sections, alignés sur les domaines de l'examen. Votre lecture est suivie, et des chapitres sont gratuits.
      - listitem:
        - heading "Un quiz par chapitre" [level=3]
        - paragraph: Quelques questions pour valider un chapitre avant de passer au suivant, corrigées dès la validation.
      - listitem:
        - heading "Un indice de préparation" [level=3]
        - paragraph: Score par domaine, maîtrise bronze, argent ou or, et un indice qui vous dit quand réserver l'examen.
      - listitem:
        - heading "XP, niveaux et badges" [level=3]
        - paragraph: Examens et quiz rapportent de l'expérience ; les badges récompensent la régularité et les progrès.
      - listitem:
        - heading "Toutes vos certifications" [level=3]
        - paragraph: "Préparez-en plusieurs à la fois : une vue d'ensemble les réunit, et un seul paiement suffit pour plusieurs Pass."
  - region "De la première lecture à l'examen réel":
    - paragraph: Le parcours
    - heading "De la première lecture à l'examen réel" [level=2]
    - list:
      - listitem:
        - heading "Apprenez" [level=3]
        - paragraph: Lisez le cours chapitre par chapitre et validez chacun avec son quiz.
      - listitem:
        - heading "Entraînez-vous" [level=3]
        - paragraph: Passez des examens blancs complets, chronométrés comme le jour J.
      - listitem:
        - heading "Comprenez vos erreurs" [level=3]
        - paragraph: La correction détaille chaque option, et vos domaines faibles vous renvoient au bon chapitre.
      - listitem:
        - heading "Réussissez l'examen" [level=3]
        - paragraph: "Quand l'indice dit « Prêt », réservez l'examen, puis déclarez votre résultat : il rend l'indice plus fiable pour tous."
  - region "1 certification à préparer":
    - paragraph: Catalogue
    - heading "1 certification à préparer" [level=2]
    - paragraph: Les certifications Microsoft, du niveau fondamental à l'expert.
    - list:
      - listitem: /AZ-\d+ Microsoft Azure Administrator/
  - region "Commencez gratuitement":
    - paragraph: Tarifs
    - heading "Commencez gratuitement" [level=2]
    - paragraph: Passez un examen blanc complet sans payer. Prenez l'accès complet quand vous voulez aller plus loin.
    - list:
      - listitem:
        - heading "Découverte" [level=3]
        - paragraph: 0 €
        - paragraph: Sans carte bancaire
        - list:
          - listitem: 1 examen blanc complet par certification
          - listitem: La correction des questions ratées
          - listitem: Les chapitres gratuits du cours et leurs quiz
          - listitem: Score par domaine et progression
        - link "Se connecter":
          - /url: /login
      - listitem:
        - text: Accès complet
        - heading "Pass Certification" [level=3]
        - paragraph: /\d+,\d+ €/
        - paragraph: /TVA non applicable, art\. \d+ B du CGI, paiement unique, \d+ jours/
        - list:
          - listitem: Des examens blancs complets illimités
          - listitem: "La correction complète : toutes les questions, avec pourquoi chaque option est juste ou fausse"
          - listitem: Tous les chapitres du cours, reliés aux questions ratées
          - listitem: Indice de préparation, progression et historique, comme avec l'accès gratuit
        - paragraph: Le paiement en ligne ouvre prochainement.
        - paragraph: Plusieurs certifications ? Un seul paiement pour tous vos Pass.
    - paragraph:
      - link "Voir tous les tarifs":
        - /url: /fr/pricing
  - region "Questions fréquentes":
    - heading "Questions fréquentes" [level=2]
    - group: Les questions viennent-elles de l'examen réel ?
    - group: Le score est-il comparable à celui de l'examen ?
    - group: Le contenu est-il en français ?
    - group: Que se passe-t-il si je ferme la page pendant un examen ?
    - group: Que comprend l'accès gratuit ?
    - group: Puis-je préparer plusieurs certifications ?
  - heading "Prêt à vous mesurer à l'examen ?" [level=2]
  - paragraph: Créez votre compte, passez un premier examen blanc et découvrez précisément ce qu'il vous reste à réviser.
  - link "Se connecter":
    - /url: /login