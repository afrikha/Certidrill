  - region "Everything you need to pass, in one place":
    - paragraph: Features
    - heading "Everything you need to pass, in one place" [level=2]
    - paragraph: "Learning, practising, understanding your mistakes and knowing when to book the exam: every step has its tool."
    - list:
      - listitem:
        - heading "Mock exams true to the real one" [level=3]
        - paragraph: "Same duration, same number of questions and same rules as the real exam: timer, locked sections, case studies, Yes / No series and review screen. Every exam is different."
        - heading "Every format of the exam" [level=4]
        - list:
          - listitem: Single choice
          - listitem: Multiple choice
          - listitem: Yes / No statements
          - listitem: Drop-down lists
          - listitem: Drag and drop
          - listitem: Ordering
          - listitem: Hot area
          - listitem: Scenario series
          - listitem: Case studies
      - listitem:
        - heading "A correction that explains" [level=3]
        - paragraph: Why the right answer is right, why every other option is wrong, and where to read more in Microsoft Learn.
      - listitem:
        - heading "A structured course" [level=3]
        - paragraph: Chapters split into sections, following the domains of the exam. Your reading is tracked, and some chapters are free.
      - listitem:
        - heading "A quiz per chapter" [level=3]
        - paragraph: A few questions to check a chapter before moving on, corrected as soon as you submit.
      - listitem:
        - heading "A readiness index" [level=3]
        - paragraph: Score per domain, bronze, silver or gold mastery, and an index that tells you when to book the exam.
      - listitem:
        - heading "XP, levels and badges" [level=3]
        - paragraph: Exams and quizzes earn experience; badges reward regular practice and progress.
      - listitem:
        - heading "All your certifications" [level=3]
        - paragraph: "Prepare several at once: an overview brings them together, and one payment is enough for several Passes."
