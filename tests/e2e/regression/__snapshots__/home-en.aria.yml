        - paragraph: Take full mock exams, timed as on exam day.
      - listitem:
        - heading "Understand your mistakes" [level=3]
        - paragraph: The correction details every option, and your weak domains lead you to the right chapter.
      - listitem:
        - heading "Pass the exam" [level=3]
        - paragraph: "When the index says “Ready”, book the exam, then report your result: it makes the index more reliable for everyone."
