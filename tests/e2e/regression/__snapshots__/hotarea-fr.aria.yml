- 'article "Une machine virtuelle nommée VM1 possède une adresse IP publique et est connectée à un sous-réseau associé au groupe de sécurité réseau NSG1. Aucun autre NSG ne s''applique à VM1. Les règles de sécurité entrantes de NSG1 figurent dans le tableau suivant. Répondez à chaque consigne en sélectionnant la règle qui traite le trafic. Remarque : chaque sélection correcte vaut un point."':
  - paragraph:
    - text: Une machine virtuelle nommée
    - strong: VM1
    - text: possède une adresse IP publique et est connectée à un sous-réseau associé au groupe de sécurité réseau
    - strong: NSG1
    - text: . Aucun autre NSG ne s'applique à VM1. Les règles de sécurité entrantes de NSG1 figurent dans le tableau suivant.
  - paragraph: Répondez à chaque consigne en sélectionnant la règle qui traite le trafic.
  - paragraph: "Remarque : chaque sélection correcte vaut un point."
  - group "Select a prompt, then click the matching area.":
    - text: ""
    - radio /RDP \(TCP \d+\) depuis un ordinateur sur Internet vers VM1/ [checked]
    - text: /RDP \(TCP \d+\) depuis un ordinateur sur Internet vers VM1/
    - radio /RDP \(TCP \d+\) depuis une machine virtuelle du même réseau virtuel vers VM1/
    - text: /RDP \(TCP \d+\) depuis une machine virtuelle du même réseau virtuel vers VM1/
  - table:
    - rowgroup:
      - row "Priorité Nom Port Source Action":
        - columnheader "Priorité"
        - columnheader "Nom"
        - columnheader "Port"
        - columnheader "Source"
        - columnheader "Action"
    - rowgroup:
      - row /\d+ Allow-HTTPS \d+ Any Allow/:
        - cell /\d+/
        - cell "Allow-HTTPS":
          - button "Allow-HTTPS"
        - cell /\d+/
        - cell "Any"
        - cell "Allow"
      - row /\d+ Deny-RDP-Internet \d+ Internet Deny/:
        - cell /\d+/
        - cell "Deny-RDP-Internet":
          - button "Deny-RDP-Internet"
        - cell /\d+/
        - cell "Internet"
        - cell "Deny"
      - row /\d+ Allow-RDP-Any \d+ Any Allow/:
        - cell /\d+/
        - cell "Allow-RDP-Any":
          - button "Allow-RDP-Any"
        - cell /\d+/
        - cell "Any"
        - cell "Allow"
      - row /\d+ AllowVnetInBound Any VirtualNetwork Allow/:
        - cell /\d+/
        - cell "AllowVnetInBound":
          - button "AllowVnetInBound"
        - cell "Any"
        - cell "VirtualNetwork"
        - cell "Allow"
      - row /\d+ AllowAzureLoadBalancerInBound Any AzureLoadBalancer Allow/:
        - cell /\d+/
        - cell "AllowAzureLoadBalancerInBound":
          - button "AllowAzureLoadBalancerInBound"
        - cell "Any"
        - cell "AzureLoadBalancer"
        - cell "Allow"
      - row /\d+ DenyAllInBound Any Any Deny/:
        - cell /\d+/
        - cell "DenyAllInBound":
          - button "DenyAllInBound"
        - cell "Any"
        - cell "Any"
        - cell "Deny"