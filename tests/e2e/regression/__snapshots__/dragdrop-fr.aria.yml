- article "Vous devez accorder des autorisations sur un groupe de ressources nommé RG1 à trois équipes. Chaque équipe ne doit recevoir que les autorisations dont elle a besoin (principe du moindre privilège). Quel rôle intégré devez-vous attribuer à chaque équipe ? Pour répondre, faites glisser les rôles appropriés vers les équipes correspondantes. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.":
