- article /Un réseau virtuel nommé VNet1 contient un sous-réseau nommé Workload et une appliance virtuelle réseau \(NVA\) d'adresse IP privée \d+\.\d+\.9\.4\. Le transfert IP est déjà activé sur l'interface réseau de la NVA\. Tout le trafic à destination d'Internet issu du sous-réseau Workload doit passer par la NVA\. Quelles sont les trois actions à effectuer dans l'ordre \? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre\./:
  - paragraph:
    - text: Un réseau virtuel nommé
    - strong: VNet1
    - text: contient un sous-réseau nommé
    - strong: Workload
    - text: /et une appliance virtuelle réseau \(NVA\) d'adresse IP privée \d+\.\d+\.9\.4\. Le transfert IP est déjà activé sur l'interface réseau de la NVA\./
  - paragraph: Tout le trafic à destination d'Internet issu du sous-réseau Workload doit passer par la NVA.
  - paragraph: Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
  - region "Actions":
    - heading "Actions" [level=3]
    - list:
      - listitem:
        - text: Créer une table de routage.
        - button "Add →"
      - listitem:
        - text: Ajouter un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant
        - strong: Appliance virtuelle
        - text: /et l'adresse \d+\.\d+\.9\.4\./
        - button "Add →"
      - listitem:
        - text: Associer la table de routage au sous-réseau Workload.
        - button "Add →"
      - listitem:
        - text: Créer une passerelle NAT et l'associer au sous-réseau Workload.
        - button "Add →"
      - listitem:
        - text: Créer un groupe de sécurité réseau avec une règle sortante autorisant Internet.
        - button "Add →"
      - listitem:
        - text: Associer la table de routage à GatewaySubnet.
        - button "Add →"
  - region "Answer area (0 of 3)":
    - heading "Answer area (0 of 3)" [level=3]
    - list
    - status