- article "A virtual machine named VM1 has a public IP address and is connected to a subnet that has the network security group NSG1. No other NSG applies to VM1. The inbound security rules of NSG1 are shown in the following table. Answer each prompt by selecting the rule that processes the traffic.":
  - paragraph:
    - text: A virtual machine named
    - strong: VM1
    - text: has a public IP address and is connected to a subnet that has the network security group
    - strong: NSG1
    - text: . No other NSG applies to VM1. The inbound security rules of NSG1 are shown in the following table.
  - paragraph: Answer each prompt by selecting the rule that processes the traffic.
  - group "Select a prompt, then click the matching area.":
    - text: ""
    - radio /RDP \(TCP \d+\) from a computer on the internet to VM1/ [checked]
    - text: /RDP \(TCP \d+\) from a computer on the internet to VM1/
    - radio /RDP \(TCP \d+\) from a VM in the same virtual network to VM1/
    - text: /RDP \(TCP \d+\) from a VM in the same virtual network to VM1/
  - table:
    - rowgroup:
      - row "Priority Name Port Source Action":
        - columnheader "Priority"
        - columnheader "Name"
        - columnheader "Port"
        - columnheader "Source"
        - columnheader "Action"
    - rowgroup:
      - row /\d+ Allow-HTTPS \d+ Any Allow/:
        - cell /\d+/
        - cell "Allow-HTTPS":
          - button "Allow-HTTPS"
        - cell /\d+/
        - cell "Any"
        - cell "Allow"
      - row /\d+ Deny-RDP-Internet \d+ Internet Deny/:
        - cell /\d+/
        - cell "Deny-RDP-Internet":
          - button "Deny-RDP-Internet"
        - cell /\d+/
        - cell "Internet"
        - cell "Deny"
      - row /\d+ Allow-RDP-Any \d+ Any Allow/:
        - cell /\d+/
        - cell "Allow-RDP-Any":
          - button "Allow-RDP-Any"
        - cell /\d+/
        - cell "Any"
        - cell "Allow"
      - row /\d+ AllowVnetInBound Any VirtualNetwork Allow/:
        - cell /\d+/
        - cell "AllowVnetInBound":
          - button "AllowVnetInBound"
        - cell "Any"
        - cell "VirtualNetwork"
        - cell "Allow"
      - row /\d+ AllowAzureLoadBalancerInBound Any AzureLoadBalancer Allow/:
        - cell /\d+/
        - cell "AllowAzureLoadBalancerInBound":
          - button "AllowAzureLoadBalancerInBound"
        - cell "Any"
        - cell "AzureLoadBalancer"
        - cell "Allow"
      - row /\d+ DenyAllInBound Any Any Deny/:
        - cell /\d+/
        - cell "DenyAllInBound":
          - button "DenyAllInBound"
        - cell "Any"
        - cell "Any"
        - cell "Deny"