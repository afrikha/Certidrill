- article /You have an Azure Storage account named stcontoso01 \(general-purpose v2\) that stores application logs as block blobs\. You need to automatically move blobs that have not been modified for \d+ days to the Cool tier, and delete blobs that have not been modified for \d+ days\. The solution must minimize administrative effort\. What should you configure\?/:
  - paragraph:
    - text: You have an Azure Storage account named
    - strong: stcontoso01
    - text: (general-purpose v2) that stores application logs as block blobs.
  - paragraph: /You need to automatically move blobs that have not been modified for \d+ days to the Cool tier, and delete blobs that have not been modified for \d+ days\. The solution must minimize administrative effort\./
  - paragraph: What should you configure?
  - group "Choose one answer.":
    - text: ""
    - list:
      - listitem:
        - radio "A. A lifecycle management policy"
        - text: A. A lifecycle management policy
      - listitem:
        - radio "B. An Azure Automation runbook that runs daily"
        - text: B. An Azure Automation runbook that runs daily
      - listitem:
        - radio "C. Blob versioning"
        - text: C. Blob versioning
      - listitem:
        - radio "D. A stored access policy on the container"
        - text: D. A stored access policy on the container