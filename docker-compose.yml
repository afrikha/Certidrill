# Production stack on a single VPS (spec §9): app + PostgreSQL + Caddy (HTTPS).
# Cloudflare sits in front for DNS and caching.
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
#   docker compose run --rm migrate npm run user:create -- --email you@example.com --admin
#   docker compose run --rm migrate npm run email:test -- --to you@example.com
name: certidrill

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: certidrill
      POSTGRES_USER: certidrill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certidrill -d certidrill"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrator }
    environment:
      DATABASE_URL: postgresql://certidrill:${POSTGRES_PASSWORD}@db:5432/certidrill
      # Only for `npm run email:test` and `npm run stripe:sync-prices` run in this
      # container; no other secret from .env.
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://certidrill:${POSTGRES_PASSWORD}@db:5432/certidrill
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      SITE_ALIASES: ${SITE_ALIASES:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  # Daily logical backup of the database; dumps older than 14 days are pruned.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
