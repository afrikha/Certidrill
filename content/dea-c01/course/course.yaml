# 1.1, with exactly 12 objectives, so no split). Objective assignment: factory/plans/dea-c01.json.
# Course code fences: bash, json, yaml, python, text (sql is not accepted by the course checker:
# SQL snippets go in `text` fences; PySpark in `python`).
