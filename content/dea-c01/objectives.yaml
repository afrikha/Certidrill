# DEA-C01 objectives — AWS Certified Data Engineer - Associate (DEA-C01) Exam Guide, version 1.1
# (December 12, 2025), English HTML/Markdown domain pages, checked on 2026-11-19 (bullet counts per
# task statement cross-checked against the PDF: 12/10/4/11, 8/6/6/6, 9/6/8/5, 7/6/4/5/7 = 120).
# One group per task statement (title without the "Task n.n:" prefix).
# Version 1.1 consolidated the former "Knowledge of" / "Skills in" lists into a single "Skill n.n.n"
# list per task: objectives = every skill bullet, in the guide's order, codes <domain>.<task>.<n> =
# the guide's skill numbers. `code` is the stable key referenced by question files and course sections.
# English: verbatim, "Skill n.n.n:" prefix and final period removed; guide wording kept as published
# (2.1.7 "for example Apache Iceberg" without comma, 4.5.4 "Viewing ...", 3.1.2 "Amazon managed
# workflows", 3.2.1 "Amazon QuickSight").
# French: NO French guide exists (the fr_fr HTML pages serve the English text, the fr_fr PDF fails),
# so ALL French group titles and objectives are our translation, following BRIEF-AWS §6 and AWS
# fr_fr documentation terminology: AWS service and feature names in English (S3 Event Notifications,
# S3 Lifecycle, S3 Access Points, Glue Data Catalog, Parameter Store, Redshift Spectrum, SageMaker
# Catalog, DMS Schema Conversion...); English term in brackets where the French is not settled
# (jobs, crawlers = « robots d'analyse », allowlists, throttling, fan-in, fan-out, replayability,
# stateful, stateless, AWS Glue workflows, S3 Versioning, data lineage = « lignage des données »,
# data skew, Amazon Bedrock knowledge base); policy = « politique »; PII = « informations
# d'identification personnelle (PII) » as in Amazon Macie fr_fr; scalability = « évolutivité ».
ingestion:
- group:
    en: Perform data ingestion
    fr: Effectuer l'ingestion des données
  objectives:
  - code: 1.1.1
    en: Read data from streaming sources (for example, Amazon Kinesis, Amazon Managed Streaming for Apache Kafka [Amazon MSK], Amazon DynamoDB Streams, AWS DMS, AWS Glue, Amazon Redshift)
    fr: Lire des données à partir de sources de streaming (par exemple, Amazon Kinesis, Amazon Managed Streaming for Apache Kafka [Amazon MSK], Amazon DynamoDB Streams, AWS DMS, AWS Glue, Amazon Redshift)
  - code: 1.1.2
    en: Read data from batch sources (for example, Amazon S3, AWS Glue, Amazon EMR, AWS DMS, Amazon Redshift, AWS Lambda, Amazon AppFlow)
    fr: Lire des données à partir de sources par lots (par exemple, Amazon S3, AWS Glue, Amazon EMR, AWS DMS, Amazon Redshift, AWS Lambda, Amazon AppFlow)
  - code: 1.1.3
    en: Implement appropriate configuration options for batch ingestion
    fr: Mettre en œuvre les options de configuration appropriées pour l'ingestion par lots
  - code: 1.1.4
    en: Consume data APIs
    fr: Consommer des API de données
  - code: 1.1.5
    en: Set up schedulers by using Amazon EventBridge, Apache Airflow, or time-based schedules for jobs and crawlers
    fr: Configurer des planificateurs à l'aide d'Amazon EventBridge, d'Apache Airflow ou de planifications temporelles pour les tâches [jobs] et les robots d'analyse [crawlers]
  - code: 1.1.6
    en: Set up event triggers (for example, Amazon S3 Event Notifications, EventBridge)
    fr: Configurer des déclencheurs d'événements (par exemple, Amazon S3 Event Notifications, EventBridge)
  - code: 1.1.7
    en: Call a Lambda function from Kinesis
    fr: Appeler une fonction Lambda à partir de Kinesis
  - code: 1.1.8
    en: Create allowlists for IP addresses to allow connections to data sources
    fr: Créer des listes d'adresses IP autorisées [allowlists] pour permettre les connexions aux sources de données
  - code: 1.1.9
    en: Implement throttling and overcoming rate limits (for example, DynamoDB, Amazon RDS, Kinesis)
    fr: Mettre en œuvre la limitation [throttling] et le contournement des limites de débit (par exemple, DynamoDB, Amazon RDS, Kinesis)
  - code: 1.1.10
    en: Manage fan-in and fan-out for streaming data distribution
    fr: Gérer la convergence [fan-in] et la diffusion [fan-out] pour la distribution de données de streaming
  - code: 1.1.11
    en: Describe replayability of data ingestion pipelines
    fr: Décrire la capacité de relecture [replayability] des pipelines d'ingestion de données
  - code: 1.1.12
    en: Define stateful and stateless data transactions
    fr: Définir les transactions de données avec état [stateful] et sans état [stateless]
- group:
    en: Transform and process data
    fr: Transformer et traiter les données
  objectives:
  - code: 1.2.1
    en: Optimize container usage for performance needs (for example, Amazon EKS, Amazon ECS)
    fr: Optimiser l'utilisation des conteneurs en fonction des besoins de performance (par exemple, Amazon EKS, Amazon ECS)
  - code: 1.2.2
    en: Connect to different data sources (for example, Java Database Connectivity [JDBC], Open Database Connectivity [ODBC])
    fr: Se connecter à différentes sources de données (par exemple, Java Database Connectivity [JDBC], Open Database Connectivity [ODBC])
  - code: 1.2.3
    en: Integrate data from multiple sources
    fr: Intégrer des données provenant de plusieurs sources
  - code: 1.2.4
    en: Optimize costs while processing data
    fr: Optimiser les coûts lors du traitement des données
  - code: 1.2.5
    en: Implement data transformation services based on requirements (for example, Amazon EMR, AWS Glue, Lambda, Amazon Redshift)
    fr: Mettre en œuvre des services de transformation des données en fonction des exigences (par exemple, Amazon EMR, AWS Glue, Lambda, Amazon Redshift)
  - code: 1.2.6
    en: Transform data between formats (for example, from .csv to Apache Parquet)
    fr: Transformer des données d'un format à un autre (par exemple, de .csv vers Apache Parquet)
  - code: 1.2.7
    en: Troubleshoot and debug common transformation failures and performance issues
    fr: Dépanner et déboguer les échecs de transformation courants et les problèmes de performance
  - code: 1.2.8
    en: Create data APIs to make data available to other systems by using AWS services
    fr: Créer des API de données pour mettre les données à la disposition d'autres systèmes à l'aide des services AWS
  - code: 1.2.9
    en: Define volume, velocity, and variety of data (for example, structured data, unstructured data)
    fr: Définir le volume, la vélocité et la variété des données (par exemple, données structurées, données non structurées)
  - code: 1.2.10
    en: Integrate large language models (LLMs) for data processing
    fr: Intégrer des grands modèles de langage (LLM) pour le traitement des données
- group:
    en: Orchestrate data pipelines
    fr: Orchestrer des pipelines de données
  objectives:
  - code: 1.3.1
    en: Use orchestration services to build workflows for data ETL pipelines (for example, Lambda, EventBridge, Amazon Managed Workflows for Apache Airflow [Amazon MWAA], AWS Step Functions, AWS Glue workflows)
    fr: Utiliser des services d'orchestration pour créer des flux de travail pour les pipelines ETL de données (par exemple, Lambda, EventBridge, Amazon Managed Workflows for Apache Airflow [Amazon MWAA], AWS Step Functions, flux de travail AWS Glue [AWS Glue workflows])
  - code: 1.3.2
    en: Build data pipelines for performance, availability, scalability, resiliency, and fault tolerance
    fr: Créer des pipelines de données axés sur la performance, la disponibilité, l'évolutivité, la résilience et la tolérance aux pannes
  - code: 1.3.3
    en: Implement and maintain serverless workflows
    fr: Mettre en œuvre et maintenir des flux de travail sans serveur
  - code: 1.3.4
    en: Use notification services to send alerts (for example, Amazon SNS, Amazon SQS)
    fr: Utiliser des services de notification pour envoyer des alertes (par exemple, Amazon SNS, Amazon SQS)
- group:
    en: Apply programming concepts
    fr: Appliquer des concepts de programmation
  objectives:
  - code: 1.4.1
    en: Optimize code to reduce runtime for data ingestion and transformation
    fr: Optimiser le code pour réduire le temps d'exécution de l'ingestion et de la transformation des données
  - code: 1.4.2
    en: Configure Lambda functions to meet concurrency and performance needs
    fr: Configurer les fonctions Lambda pour répondre aux besoins de simultanéité et de performance
  - code: 1.4.3
    en: Use programming languages and frameworks for data engineering (for example, Python, SQL, Scala, R, Java, Bash, PowerShell)
    fr: Utiliser des langages et des frameworks de programmation pour l'ingénierie des données (par exemple, Python, SQL, Scala, R, Java, Bash, PowerShell)
  - code: 1.4.4
    en: Use software engineering best practices for data engineering (for example, version control, testing, logging, monitoring)
    fr: Utiliser les bonnes pratiques du génie logiciel pour l'ingénierie des données (par exemple, contrôle de version, tests, journalisation, surveillance)
  - code: 1.4.5
    en: Use Infrastructure as Code (IaC) to deploy data engineering solutions
    fr: Utiliser l'infrastructure en tant que code (IaC) pour déployer des solutions d'ingénierie des données
  - code: 1.4.6
    en: Use AWS SAM to package and deploy serverless data pipelines (for example, Lambda functions, Step Functions, DynamoDB tables)
    fr: Utiliser AWS SAM pour empaqueter et déployer des pipelines de données sans serveur (par exemple, fonctions Lambda, Step Functions, tables DynamoDB)
  - code: 1.4.7
    en: Use and mount storage volumes from within Lambda functions
    fr: Utiliser et monter des volumes de stockage depuis des fonctions Lambda
  - code: 1.4.8
    en: Use infrastructure as code (IaC) for repeatable resource deployment (for example, AWS CloudFormation and AWS CDK)
    fr: Utiliser l'infrastructure en tant que code (IaC) pour un déploiement reproductible des ressources (par exemple, AWS CloudFormation et AWS CDK)
  - code: 1.4.9
    en: Describe continuous integration and continuous delivery (CI/CD) (implementation, testing, and deployment of data pipelines)
    fr: Décrire l'intégration continue et la livraison continue (CI/CD) (mise en œuvre, test et déploiement de pipelines de données)
  - code: 1.4.10
    en: Define distributed computing
    fr: Définir l'informatique distribuée
  - code: 1.4.11
    en: Describe data structures and algorithms (for example, graph data structures and tree data structures)
    fr: Décrire les structures de données et les algorithmes (par exemple, structures de données en graphe et structures de données en arbre)
datastore:
- group:
    en: Choose a data store
    fr: Choisir un magasin de données
  objectives:
  - code: 2.1.1
    en: Implement the appropriate storage services for specific cost and performance requirements (for example, Amazon Redshift, Amazon EMR, AWS Lake Formation, Amazon RDS, Amazon DynamoDB, Amazon Kinesis Data Streams, Amazon Managed Streaming for Apache Kafka [Amazon MSK])
    fr: Mettre en œuvre les services de stockage appropriés pour des exigences spécifiques de coût et de performance (par exemple, Amazon Redshift, Amazon EMR, AWS Lake Formation, Amazon RDS, Amazon DynamoDB, Amazon Kinesis Data Streams, Amazon Managed Streaming for Apache Kafka [Amazon MSK])
  - code: 2.1.2
    en: Configure the appropriate storage services for specific access patterns and requirements (for example, Amazon Redshift, Amazon EMR, Lake Formation, Amazon RDS, DynamoDB)
    fr: Configurer les services de stockage appropriés pour des modèles d'accès et des exigences spécifiques (par exemple, Amazon Redshift, Amazon EMR, Lake Formation, Amazon RDS, DynamoDB)
  - code: 2.1.3
    en: Apply storage services to appropriate use cases (for example, using indexing algorithms like Hierarchical Navigable Small Worlds [HNSW] with Amazon Aurora PostgreSQL and using Amazon MemoryDB for fast key/value pair access)
    fr: Appliquer les services de stockage aux cas d'utilisation appropriés (par exemple, utilisation d'algorithmes d'indexation comme Hierarchical Navigable Small Worlds [HNSW] avec Amazon Aurora PostgreSQL et utilisation d'Amazon MemoryDB pour un accès rapide à des paires clé/valeur)
  - code: 2.1.4
    en: Integrate migration tools into data processing systems (for example, AWS Transfer Family)
    fr: Intégrer des outils de migration dans les systèmes de traitement des données (par exemple, AWS Transfer Family)
  - code: 2.1.5
    en: Implement data migration or remote access methods (for example, Amazon Redshift federated queries, Amazon Redshift materialized views, Amazon Redshift Spectrum)
    fr: Mettre en œuvre des méthodes de migration des données ou d'accès à distance (par exemple, requêtes fédérées Amazon Redshift, vues matérialisées Amazon Redshift, Amazon Redshift Spectrum)
  - code: 2.1.6
    en: Manage locks to prevent access to data (for example, Amazon Redshift, Amazon RDS)
    fr: Gérer les verrous pour empêcher l'accès aux données (par exemple, Amazon Redshift, Amazon RDS)
  - code: 2.1.7
    en: Manage open table formats (for example Apache Iceberg)
    fr: Gérer les formats de table ouverts (par exemple, Apache Iceberg)
  - code: 2.1.8
    en: Describe vector index types (for example, HNSW, IVF)
    fr: Décrire les types d'index vectoriels (par exemple, HNSW, IVF)
- group:
    en: Understand data cataloging systems
    fr: Comprendre les systèmes de catalogage des données
  objectives:
  - code: 2.2.1
    en: Use data catalogs to consume data from the data's source
    fr: Utiliser des catalogues de données pour consommer les données à partir de leur source
  - code: 2.2.2
    en: Build and reference a technical data catalog (for example, AWS Glue Data Catalog, Apache Hive metastore)
    fr: Créer et référencer un catalogue de données technique (par exemple, AWS Glue Data Catalog, metastore Apache Hive)
  - code: 2.2.3
    en: Discover schemas and use AWS Glue crawlers to populate data catalogs
    fr: Découvrir des schémas et utiliser des robots d'analyse AWS Glue [AWS Glue crawlers] pour alimenter des catalogues de données
  - code: 2.2.4
    en: Synchronize partitions with a data catalog
    fr: Synchroniser des partitions avec un catalogue de données
  - code: 2.2.5
    en: Create new source or target connections for cataloging (for example, AWS Glue)
    fr: Créer de nouvelles connexions source ou cible pour le catalogage (par exemple, AWS Glue)
  - code: 2.2.6
    en: Create and manage business data catalogs (for example, Amazon SageMaker Catalog)
    fr: Créer et gérer des catalogues de données métier (par exemple, Amazon SageMaker Catalog)
- group:
    en: Manage the lifecycle of data
    fr: Gérer le cycle de vie des données
  objectives:
  - code: 2.3.1
    en: Perform load and unload operations to move data between Amazon S3 and Amazon Redshift
    fr: Effectuer des opérations de chargement et de déchargement pour déplacer des données entre Amazon S3 et Amazon Redshift
  - code: 2.3.2
    en: Manage S3 Lifecycle policies to change the storage tier of S3 data
    fr: Gérer les politiques S3 Lifecycle pour changer le niveau de stockage des données S3
  - code: 2.3.3
    en: Expire data when it reaches a specific age by using S3 Lifecycle policies
    fr: Faire expirer les données lorsqu'elles atteignent un âge donné à l'aide des politiques S3 Lifecycle
  - code: 2.3.4
    en: Manage S3 versioning and DynamoDB TTL
    fr: Gérer la gestion des versions S3 [S3 Versioning] et la durée de vie (TTL) DynamoDB
  - code: 2.3.5
    en: Delete data to meet business and legal requirements
    fr: Supprimer des données pour répondre aux exigences métier et légales
  - code: 2.3.6
    en: Protect data with appropriate resiliency and availability
    fr: Protéger les données avec une résilience et une disponibilité appropriées
- group:
    en: Design data models and schema evolution
    fr: Concevoir des modèles de données et l'évolution des schémas
  objectives:
  - code: 2.4.1
    en: Design schemas for Amazon Redshift, DynamoDB, and Lake Formation
    fr: Concevoir des schémas pour Amazon Redshift, DynamoDB et Lake Formation
  - code: 2.4.2
    en: Address changes to the characteristics of data
    fr: Prendre en charge les changements des caractéristiques des données
  - code: 2.4.3
    en: Perform schema conversion (for example, by using AWS SCT and AWS DMS Schema Conversion)
    fr: Effectuer une conversion de schéma (par exemple, à l'aide d'AWS SCT et d'AWS DMS Schema Conversion)
  - code: 2.4.4
    en: Establish data lineage by using AWS tools (for example, Amazon SageMaker ML Lineage Tracking and Amazon SageMaker Catalog)
    fr: Établir le lignage des données [data lineage] à l'aide des outils AWS (par exemple, Amazon SageMaker ML Lineage Tracking et Amazon SageMaker Catalog)
  - code: 2.4.5
    en: Describe best practices for indexing, partitioning strategies, compression, and other data optimization techniques
    fr: Décrire les bonnes pratiques en matière d'indexation, de stratégies de partitionnement, de compression et d'autres techniques d'optimisation des données
  - code: 2.4.6
    en: Describe vectorization concepts (for example, Amazon Bedrock knowledge base)
    fr: Décrire les concepts de vectorisation (par exemple, base de connaissances Amazon Bedrock [Amazon Bedrock knowledge base])
operations:
- group:
    en: Automate data processing by using AWS services
    fr: Automatiser le traitement des données à l'aide des services AWS
  objectives:
  - code: 3.1.1
    en: Orchestrate data pipelines (for example, Amazon Managed Workflows for Apache Airflow [Amazon MWAA], AWS Step Functions)
    fr: Orchestrer des pipelines de données (par exemple, Amazon Managed Workflows for Apache Airflow [Amazon MWAA], AWS Step Functions)
  - code: 3.1.2
    en: Troubleshoot Amazon managed workflows
    fr: Dépanner les flux de travail gérés par Amazon
  - code: 3.1.3
    en: Call SDKs to access Amazon features from code
    fr: Appeler des kits SDK pour accéder aux fonctionnalités d'Amazon à partir du code
  - code: 3.1.4
    en: Use the features of AWS services to process data (for example, Amazon EMR, Amazon Redshift, AWS Glue)
    fr: Utiliser les fonctionnalités des services AWS pour traiter les données (par exemple, Amazon EMR, Amazon Redshift, AWS Glue)
  - code: 3.1.5
    en: Consume and maintain data APIs
    fr: Consommer et maintenir des API de données
  - code: 3.1.6
    en: Prepare data for transformation (for example, AWS Glue DataBrew and Amazon SageMaker Unified Studio)
    fr: Préparer les données pour la transformation (par exemple, AWS Glue DataBrew et Amazon SageMaker Unified Studio)
  - code: 3.1.7
    en: Query data (for example, Amazon Athena)
    fr: Interroger des données (par exemple, Amazon Athena)
  - code: 3.1.8
    en: Use AWS Lambda to automate data processing
    fr: Utiliser AWS Lambda pour automatiser le traitement des données
  - code: 3.1.9
    en: Manage events and schedulers (for example, Amazon EventBridge)
    fr: Gérer les événements et les planificateurs (par exemple, Amazon EventBridge)
- group:
    en: Analyze data by using AWS services
    fr: Analyser les données à l'aide des services AWS
  objectives:
  - code: 3.2.1
    en: Visualize data by using AWS services and tools (for example, DataBrew, Amazon QuickSight)
    fr: Visualiser les données à l'aide des services et outils AWS (par exemple, DataBrew, Amazon QuickSight)
  - code: 3.2.2
    en: Verify and clean data (for example, Lambda, Athena, QuickSight, Jupyter Notebooks, Amazon SageMaker Data Wrangler)
    fr: Vérifier et nettoyer les données (par exemple, Lambda, Athena, QuickSight, blocs-notes Jupyter, Amazon SageMaker Data Wrangler)
  - code: 3.2.3
    en: Use SQL in Amazon Redshift and Athena to query data or to create views
    fr: Utiliser SQL dans Amazon Redshift et Athena pour interroger des données ou créer des vues
  - code: 3.2.4
    en: Use Athena notebooks that use Apache Spark to explore data
    fr: Utiliser des blocs-notes Athena basés sur Apache Spark pour explorer les données
  - code: 3.2.5
    en: Describe tradeoffs between provisioned services and serverless services
    fr: Décrire les compromis entre les services provisionnés et les services sans serveur
  - code: 3.2.6
    en: Define data aggregation, rolling average, grouping, and pivoting
    fr: Définir l'agrégation de données, la moyenne mobile, le regroupement et le pivotement
- group:
    en: Maintain and monitor data pipelines
    fr: Maintenir et surveiller les pipelines de données
  objectives:
  - code: 3.3.1
    en: Extract logs for audits
    fr: Extraire des journaux pour les audits
  - code: 3.3.2
    en: Deploy logging and monitoring solutions to facilitate auditing and traceability
    fr: Déployer des solutions de journalisation et de surveillance pour faciliter l'audit et la traçabilité
  - code: 3.3.3
    en: Use notifications during monitoring to send alerts
    fr: Utiliser des notifications pendant la surveillance pour envoyer des alertes
  - code: 3.3.4
    en: Troubleshoot performance issues
    fr: Dépanner les problèmes de performance
  - code: 3.3.5
    en: Use AWS CloudTrail to track API calls
    fr: Utiliser AWS CloudTrail pour suivre les appels d'API
  - code: 3.3.6
    en: Troubleshoot and maintain pipelines (for example, AWS Glue, Amazon EMR)
    fr: Dépanner et maintenir des pipelines (par exemple, AWS Glue, Amazon EMR)
  - code: 3.3.7
    en: Use Amazon CloudWatch Logs to log application data (with a focus on configuration and automation)
    fr: Utiliser Amazon CloudWatch Logs pour journaliser les données d'application (en mettant l'accent sur la configuration et l'automatisation)
  - code: 3.3.8
    en: Analyze logs with AWS services (for example, Athena, Amazon EMR, Amazon OpenSearch Service, CloudWatch Logs Insights, big data application logs)
    fr: Analyser les journaux à l'aide des services AWS (par exemple, Athena, Amazon EMR, Amazon OpenSearch Service, CloudWatch Logs Insights, journaux d'applications big data)
- group:
    en: Ensure data quality
    fr: Garantir la qualité des données
  objectives:
  - code: 3.4.1
    en: Run data quality checks while processing the data (for example, checking for empty fields)
    fr: Exécuter des contrôles de qualité des données pendant leur traitement (par exemple, vérification des champs vides)
  - code: 3.4.2
    en: Define data quality rules (for example, DataBrew)
    fr: Définir des règles de qualité des données (par exemple, DataBrew)
  - code: 3.4.3
    en: Investigate data consistency (for example, DataBrew)
    fr: Examiner la cohérence des données (par exemple, DataBrew)
  - code: 3.4.4
    en: Describe data sampling techniques
    fr: Décrire les techniques d'échantillonnage des données
  - code: 3.4.5
    en: Implement data skew mechanisms
    fr: Mettre en œuvre des mécanismes de gestion de l'asymétrie des données [data skew]
governance:
- group:
    en: Apply authentication mechanisms
    fr: Appliquer des mécanismes d'authentification
  objectives:
  - code: 4.1.1
    en: Update VPC security groups
    fr: Mettre à jour les groupes de sécurité VPC
  - code: 4.1.2
    en: Create and update IAM groups, roles, endpoints, and services
    fr: Créer et mettre à jour des groupes IAM, des rôles, des points de terminaison et des services
  - code: 4.1.3
    en: Create and rotate credentials for password management (for example, AWS Secrets Manager)
    fr: Créer des informations d'identification et en assurer la rotation pour la gestion des mots de passe (par exemple, AWS Secrets Manager)
  - code: 4.1.4
    en: Set up IAM roles for access (for example, AWS Lambda, Amazon API Gateway, AWS CLI, AWS CloudFormation)
    fr: Configurer des rôles IAM pour l'accès (par exemple, AWS Lambda, Amazon API Gateway, AWS CLI, AWS CloudFormation)
  - code: 4.1.5
    en: Apply IAM policies to roles, endpoints, and services (for example, S3 Access Points, AWS PrivateLink)
    fr: Appliquer des politiques IAM aux rôles, aux points de terminaison et aux services (par exemple, S3 Access Points, AWS PrivateLink)
  - code: 4.1.6
    en: Describe the differences between managed services and unmanaged services
    fr: Décrire les différences entre les services gérés et les services non gérés
  - code: 4.1.7
    en: Use domain, domain units, and projects for SageMaker Unified Studio
    fr: Utiliser les domaines, les unités de domaine et les projets pour SageMaker Unified Studio
- group:
    en: Apply authorization mechanisms
    fr: Appliquer des mécanismes d'autorisation
  objectives:
  - code: 4.2.1
    en: Create custom IAM policies when a managed policy does not meet the needs
    fr: Créer des politiques IAM personnalisées lorsqu'une politique gérée ne répond pas aux besoins
  - code: 4.2.2
    en: Store application and database credentials (for example, Secrets Manager, AWS Systems Manager Parameter Store)
    fr: Stocker les informations d'identification des applications et des bases de données (par exemple, Secrets Manager, AWS Systems Manager Parameter Store)
  - code: 4.2.3
    en: Provide database users, groups, and roles access and authority in a database (for example, for Amazon Redshift)
    fr: Accorder aux utilisateurs, groupes et rôles de base de données l'accès et les droits dans une base de données (par exemple, pour Amazon Redshift)
  - code: 4.2.4
    en: Manage permissions through AWS Lake Formation (for Amazon Redshift, Amazon EMR, Amazon Athena, and Amazon S3)
    fr: Gérer les autorisations via AWS Lake Formation (pour Amazon Redshift, Amazon EMR, Amazon Athena et Amazon S3)
  - code: 4.2.5
    en: Apply authorization methods that address business needs (role-based, tag-based, and attribute-based)
    fr: Appliquer des méthodes d'autorisation qui répondent aux besoins métier (basées sur les rôles, sur les balises et sur les attributs)
  - code: 4.2.6
    en: Construct custom policies that meet the principle of least privilege
    fr: Élaborer des politiques personnalisées qui respectent le principe du moindre privilège
- group:
    en: Ensure data encryption and masking
    fr: Garantir le chiffrement et le masquage des données
  objectives:
  - code: 4.3.1
    en: Apply data masking and anonymization according to compliance laws or company policies
    fr: Appliquer le masquage et l'anonymisation des données conformément aux lois sur la conformité ou aux politiques de l'entreprise
  - code: 4.3.2
    en: Use encryption keys to encrypt or decrypt data (for example, AWS KMS)
    fr: Utiliser des clés de chiffrement pour chiffrer ou déchiffrer des données (par exemple, AWS KMS)
  - code: 4.3.3
    en: Configure encryption across AWS account boundaries
    fr: Configurer le chiffrement au-delà des limites des comptes AWS
  - code: 4.3.4
    en: Enable encryption in transit or before transit for data
    fr: Activer le chiffrement des données en transit ou avant leur transit
- group:
    en: Prepare logs for audit
    fr: Préparer les journaux pour l'audit
  objectives:
  - code: 4.4.1
    en: Use AWS CloudTrail to track API calls
    fr: Utiliser AWS CloudTrail pour suivre les appels d'API
  - code: 4.4.2
    en: Use Amazon CloudWatch Logs to store application logs
    fr: Utiliser Amazon CloudWatch Logs pour stocker les journaux d'application
  - code: 4.4.3
    en: Use AWS CloudTrail Lake for centralized logging queries
    fr: Utiliser AWS CloudTrail Lake pour des requêtes de journalisation centralisées
  - code: 4.4.4
    en: Analyze logs by using AWS services (for example, Athena, CloudWatch Logs Insights, Amazon OpenSearch Service)
    fr: Analyser les journaux à l'aide des services AWS (par exemple, Athena, CloudWatch Logs Insights, Amazon OpenSearch Service)
  - code: 4.4.5
    en: Integrate various AWS services to perform logging (for example, Amazon EMR in cases of large volumes of log data)
    fr: Intégrer différents services AWS pour assurer la journalisation (par exemple, Amazon EMR en cas de grands volumes de données de journaux)
- group:
    en: Understand data privacy and governance
    fr: Comprendre la confidentialité et la gouvernance des données
  objectives:
  - code: 4.5.1
    en: Grant permissions for data sharing (for example, data sharing for Amazon Redshift)
    fr: Accorder des autorisations pour le partage de données (par exemple, partage de données pour Amazon Redshift)
  - code: 4.5.2
    en: Implement PII identification (for example, Amazon Macie with Lake Formation)
    fr: Mettre en œuvre l'identification des informations d'identification personnelle (PII) (par exemple, Amazon Macie avec Lake Formation)
  - code: 4.5.3
    en: Implement data privacy strategies to prevent backups or replications of data to disallowed AWS Regions
    fr: Mettre en œuvre des stratégies de confidentialité des données pour empêcher les sauvegardes ou les réplications de données vers des Régions AWS non autorisées
  - code: 4.5.4
    en: Viewing configuration changes that have occurred in an account (for example, AWS Config)
    fr: Consulter les modifications de configuration survenues dans un compte (par exemple, AWS Config)
  - code: 4.5.5
    en: Maintain data sovereignty
    fr: Maintenir la souveraineté des données
  - code: 4.5.6
    en: Manage data access through Amazon SageMaker Catalog projects
    fr: Gérer l'accès aux données via les projets Amazon SageMaker Catalog
  - code: 4.5.7
    en: Describe governance data framework and data sharing patterns
    fr: Décrire le cadre de gouvernance des données et les modèles de partage de données
