id: deac01-2b-part-projection-spectrum
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer enabled partition projection on a daily-partitioned AWS Glue Data Catalog table and stopped the job that used to register new partitions. Amazon Athena queries return the new days correctly. However, Amazon Redshift Spectrum queries on the same table, through an external schema, return no rows for any day added since the change. Both services must return the same data.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur de données a activé la projection de partitions sur une table AWS Glue Data Catalog partitionnée par jour et a arrêté la tâche qui enregistrait les nouvelles partitions. Les requêtes Amazon Athena renvoient correctement les nouveaux jours. En revanche, les requêtes Amazon Redshift Spectrum sur la même table, au moyen d'un schéma externe, ne renvoient aucune ligne pour les jours ajoutés depuis la modification. Les deux services doivent renvoyer les mêmes données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the same projection properties to the external table in Redshift with ALTER TABLE ... SET TABLE PROPERTIES.", fr: "Ajouter les mêmes propriétés de projection à la table externe dans Redshift avec ALTER TABLE ... SET TABLE PROPERTIES." } }
    - { id: b, text: { en: "Restart the job that registers each new partition in the Data Catalog, and keep projection enabled for Athena.", fr: "Redémarrer la tâche qui enregistre chaque nouvelle partition dans le Data Catalog, et conserver la projection activée pour Athena." } }
    - { id: c, text: { en: "Recreate the external schema with FROM HIVE METASTORE so that Redshift Spectrum reads the projection settings.", fr: "Recréer le schéma externe avec FROM HIVE METASTORE afin que Redshift Spectrum lise les paramètres de projection." } }
    - { id: d, text: { en: "Add glue:GetPartitions to the IAM role of the external schema so that Spectrum can compute projected partitions.", fr: "Ajouter glue:GetPartitions au rôle IAM du schéma externe afin que Spectrum puisse calculer les partitions projetées." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Partition projection is used only when the table is queried through Athena; Redshift Spectrum, Amazon EMR and Athena for Spark use the partition metadata registered in the catalog. Registering partitions again serves Spectrum, while Athena keeps using projection and ignores the registered partitions."
    fr: "La projection de partitions n'est utilisée que lorsque la table est interrogée au moyen d'Athena ; Redshift Spectrum, Amazon EMR et Athena pour Spark utilisent les métadonnées de partitions enregistrées dans le catalogue. Enregistrer de nouveau les partitions sert Spectrum, tandis qu'Athena continue d'utiliser la projection et ignore les partitions enregistrées."
  options:
    a:
      en: "Redshift Spectrum does not compute projected partitions, whatever table properties the external table has."
      fr: "Redshift Spectrum ne calcule pas de partitions projetées, quelles que soient les propriétés de la table externe."
    c:
      en: "The table is in the Glue Data Catalog, not in a Hive metastore, and no engine other than Athena uses projection settings."
      fr: "La table se trouve dans le Glue Data Catalog, pas dans un metastore Hive, et aucun moteur autre qu'Athena n'utilise les paramètres de projection."
    d:
      en: "GetPartitions returns only registered partitions; the permission cannot make Spectrum see partitions that were never registered."
      fr: "GetPartitions ne renvoie que les partitions enregistrées ; l'autorisation ne peut pas faire voir à Spectrum des partitions qui n'ont jamais été enregistrées."
references:
  - title: Use partition projection with Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html
