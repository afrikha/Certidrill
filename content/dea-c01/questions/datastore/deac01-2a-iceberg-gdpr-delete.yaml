id: deac01-2a-iceberg-gdpr-delete
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's data lake stores customer events as Parquet files in Amazon S3, in Hive-style tables in the AWS Glue Data Catalog that analysts query with Amazon Athena. To meet privacy requests, the company must delete all rows of a given customer. Today, engineers rewrite whole partitions with custom Spark jobs. The company wants to delete rows with SQL in Athena with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Le lac de données d'une entreprise stocke des événements clients sous forme de fichiers Parquet dans Amazon S3, dans des tables de type Hive de l'AWS Glue Data Catalog que les analystes interrogent avec Amazon Athena. Pour répondre aux demandes de confidentialité, l'entreprise doit supprimer toutes les lignes d'un client donné. Aujourd'hui, les ingénieurs réécrivent des partitions entières avec des tâches Spark personnalisées. L'entreprise veut supprimer des lignes en SQL dans Athena avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run DELETE FROM statements in Athena directly against the existing Hive tables.", fr: "Exécuter des instructions DELETE FROM dans Athena directement sur les tables Hive existantes." } }
    - { id: b, text: { en: "Tag the objects that contain the customer and expire them with an S3 Lifecycle rule.", fr: "Baliser les objets qui contiennent le client et les faire expirer avec une règle S3 Lifecycle." } }
    - { id: c, text: { en: "Create an AWS Lake Formation data filter that hides the customer's rows from analysts.", fr: "Créer un filtre de données AWS Lake Formation qui masque aux analystes les lignes du client." } }
    - { id: d, text: { en: "Convert the tables to Apache Iceberg tables and run DELETE FROM statements in Athena.", fr: "Convertir les tables en tables Apache Iceberg et exécuter des instructions DELETE FROM dans Athena." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Athena supports INSERT INTO, DELETE, UPDATE and MERGE INTO on Apache Iceberg tables, which provide record-level changes on S3 data. Deletes are written as position delete files with snapshot isolation; running OPTIMIZE and VACUUM afterward rewrites the data files and removes the old ones."
    fr: "Athena prend en charge INSERT INTO, DELETE, UPDATE et MERGE INTO sur les tables Apache Iceberg, qui permettent des modifications au niveau de l'enregistrement sur des données S3. Les suppressions sont écrites sous forme de fichiers de suppression positionnelle avec isolation par instantané ; exécuter ensuite OPTIMIZE et VACUUM réécrit les fichiers de données et supprime les anciens."
  options:
    a:
      en: "Athena row-level DELETE works on Iceberg tables; Hive-style tables do not support row-level deletes."
      fr: "Le DELETE au niveau des lignes d'Athena fonctionne sur les tables Iceberg ; les tables de type Hive ne prennent pas en charge les suppressions au niveau des lignes."
    b:
      en: "Lifecycle rules delete whole objects, which would also remove the rows of other customers in the same files."
      fr: "Les règles de cycle de vie suppriment des objets entiers, ce qui retirerait aussi les lignes des autres clients des mêmes fichiers."
    c:
      en: "A data filter only hides rows from some principals; the data is still stored, so it is not deleted."
      fr: "Un filtre de données ne fait que masquer des lignes à certains principaux ; les données restent stockées : elles ne sont pas supprimées."
references:
  - title: Update Iceberg table data
    url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-updating-iceberg-table-data.html
