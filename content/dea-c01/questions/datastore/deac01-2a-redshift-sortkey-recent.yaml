id: deac01-2a-redshift-sortkey-recent
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon Redshift table named clickstream holds 5 years of data and receives new rows every hour. Almost every query filters on the last 7 days with a predicate on event_date, and some queries also filter on page_id. The data engineer wants Amazon Redshift to skip as many blocks as possible during these scans.

    Which sort key should the data engineer define?
  fr: |
    Une table Amazon Redshift nommée clickstream contient 5 ans de données et reçoit de nouvelles lignes toutes les heures. Presque toutes les requêtes filtrent sur les 7 derniers jours avec un prédicat sur event_date, et certaines filtrent aussi sur page_id. L'ingénieur data veut qu'Amazon Redshift ignore le plus de blocs possible lors de ces analyses.

    Quelle clé de tri l'ingénieur data doit-il définir ?
body:
  options:
    - { id: a, text: "COMPOUND SORTKEY (page_id, event_date)" }
    - { id: b, text: "COMPOUND SORTKEY (event_date, page_id)" }
    - { id: c, text: "INTERLEAVED SORTKEY (page_id, event_date)" }
    - { id: d, text: { en: "DISTKEY (event_date) and no sort key", fr: "DISTKEY (event_date) sans clé de tri" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Redshift keeps the minimum and maximum values of each 1 MB block (zone maps) and skips blocks outside a range predicate. A compound sort key works best when predicates use a prefix of its columns, so event_date must lead; compound is also recommended for tables that receive regular inserts."
    fr: "Redshift conserve les valeurs minimale et maximale de chaque bloc de 1 Mo (zone maps) et ignore les blocs hors d'un prédicat de plage. Une clé de tri composée est la plus efficace lorsque les prédicats utilisent un préfixe de ses colonnes : event_date doit être en tête ; la clé composée est aussi recommandée pour les tables qui reçoivent des insertions régulières."
  options:
    a:
      en: "With page_id first, a filter on event_date alone does not use the prefix of the sort key, so far fewer blocks are skipped."
      fr: "Avec page_id en tête, un filtre sur event_date seul n'utilise pas le préfixe de la clé de tri : beaucoup moins de blocs sont ignorés."
    c:
      en: "Interleaved keys suit predicates on any subset of columns, but they add costly VACUUM REINDEX maintenance on a table that is loaded every hour, and every query here filters on event_date."
      fr: "Les clés entrelacées conviennent aux prédicats sur n'importe quel sous-ensemble de colonnes, mais elles ajoutent une maintenance VACUUM REINDEX coûteuse sur une table chargée toutes les heures, alors que chaque requête filtre ici sur event_date."
    d:
      en: "A distribution key decides which slice stores a row; without a sort key, the rows are not ordered by date and block skipping is poor."
      fr: "Une clé de distribution décide de la tranche qui stocke une ligne ; sans clé de tri, les lignes ne sont pas ordonnées par date et peu de blocs sont ignorés."
references:
  - title: Sort keys
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_Sorting_data.html
