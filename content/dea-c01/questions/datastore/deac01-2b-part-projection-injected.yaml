id: deac01-2b-part-projection-injected
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS company stores usage events in Amazon S3 under prefixes such as s3://example-usage/events/t-8f3a2c/2026-11-21/, where the first level is the tenant_id string and the second level is the dt date. New tenants sign up every day, and tens of thousands of partitions already exist. Only Amazon Athena queries the table, and every query filters on one tenant_id and a range of dates. The company wants faster query planning and no partition maintenance.

    Which table configuration will meet these requirements?
  fr: |
    Une entreprise SaaS stocke des événements d'utilisation dans Amazon S3 sous des préfixes tels que s3://example-usage/events/t-8f3a2c/2026-11-21/, où le premier niveau est la chaîne tenant_id et le second niveau la date dt. De nouveaux locataires s'inscrivent chaque jour, et des dizaines de milliers de partitions existent déjà. Seul Amazon Athena interroge la table, et chaque requête filtre sur un tenant_id et une plage de dates. L'entreprise veut une planification des requêtes plus rapide et aucune maintenance des partitions.

    Quelle configuration de table répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable partition projection with tenant_id of type enum that lists the current tenant IDs, dt of type date, and a storage.location.template.", fr: "Activer la projection de partitions avec tenant_id de type enum qui liste les ID de locataires actuels, dt de type date, et un storage.location.template." } }
    - { id: b, text: { en: "Enable partition projection with tenant_id of type integer and a range that covers all tenant numbers, dt of type date, and a storage.location.template.", fr: "Activer la projection de partitions avec tenant_id de type integer et une plage qui couvre tous les numéros de locataires, dt de type date, et un storage.location.template." } }
    - { id: c, text: { en: "Enable partition projection with tenant_id of type injected, dt of type date with a range that ends at NOW, and a storage.location.template.", fr: "Activer la projection de partitions avec tenant_id de type injected, dt de type date avec une plage qui se termine à NOW, et un storage.location.template." } }
    - { id: d, text: { en: "Keep the partitions in the Data Catalog, and schedule an AWS Glue crawler every hour to register the partitions of new tenants and days.", fr: "Conserver les partitions dans le Data Catalog, et planifier toutes les heures un robot d'analyse AWS Glue pour enregistrer les partitions des nouveaux locataires et jours." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With partition projection, Athena computes partition values and locations from table properties instead of calling GetPartitions, which speeds up planning on highly partitioned tables and removes partition management. The injected type suits string values that cannot be generated from a range and that every query supplies in its WHERE clause, and a date range ending at NOW covers new days automatically."
    fr: "Avec la projection de partitions, Athena calcule les valeurs et les emplacements des partitions à partir des propriétés de la table au lieu d'appeler GetPartitions, ce qui accélère la planification sur les tables très partitionnées et supprime la gestion des partitions. Le type injected convient aux valeurs de chaîne qui ne peuvent pas être générées à partir d'une plage et que chaque requête fournit dans sa clause WHERE, et une plage de dates qui se termine à NOW couvre automatiquement les nouveaux jours."
  options:
    a:
      en: "An enum lists fixed values, so every new tenant requires a table change, and enum projections should stay small to keep the table metadata under its size limit."
      fr: "Un enum liste des valeurs fixes : chaque nouveau locataire exige une modification de la table, et les projections enum doivent rester petites pour que les métadonnées de la table restent sous leur limite de taille."
    b:
      en: "The integer type generates numeric values from a range, but the tenant IDs are strings such as t-8f3a2c."
      fr: "Le type integer génère des valeurs numériques à partir d'une plage, mais les ID de locataires sont des chaînes telles que t-8f3a2c."
    d:
      en: "An hourly crawler is ongoing partition maintenance, and Athena still calls GetPartitions on a very large number of partitions."
      fr: "Un robot d'analyse horaire constitue une maintenance continue des partitions, et Athena appelle toujours GetPartitions sur un très grand nombre de partitions."
references:
  - title: Supported types for partition projection
    url: https://docs.aws.amazon.com/athena/latest/ug/partition-projection-supported-types.html
  - title: Use partition projection with Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html
