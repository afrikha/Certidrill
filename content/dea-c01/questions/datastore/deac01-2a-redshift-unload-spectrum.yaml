id: deac01-2a-redshift-unload-spectrum
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Redshift provisioned cluster is close to its storage capacity. Seventy percent of the data is sales older than 2 years, which analysts query a few times each quarter, often joined with recent sales. The company does not want to add nodes or change the node type, and the old data must remain queryable from Amazon Redshift with SQL.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Un cluster provisionné Amazon Redshift approche de sa capacité de stockage. Soixante-dix pour cent des données sont des ventes de plus de 2 ans, que les analystes interrogent quelques fois par trimestre, souvent en les joignant aux ventes récentes. L'entreprise ne veut ni ajouter de nœuds ni changer de type de nœud, et les anciennes données doivent rester interrogeables en SQL depuis Amazon Redshift.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "UNLOAD the old sales to Amazon S3 as Parquet and query them through a Redshift Spectrum external schema.", fr: "Décharger (UNLOAD) les anciennes ventes dans Amazon S3 en Parquet et les interroger via un schéma externe Redshift Spectrum." } }
    - { id: b, text: { en: "Take a manual snapshot of the cluster, delete the old sales and restore the snapshot to a new cluster when analysts need them.", fr: "Prendre un instantané manuel du cluster, supprimer les anciennes ventes et restaurer l'instantané dans un nouveau cluster quand les analystes en ont besoin." } }
    - { id: c, text: { en: "Move the old sales to an Amazon Aurora PostgreSQL database and join them through a Redshift federated query.", fr: "Déplacer les anciennes ventes dans une base Amazon Aurora PostgreSQL et les joindre via une requête fédérée Redshift." } }
    - { id: d, text: { en: "Run an elastic resize that adds two nodes and keep all the sales in the local tables of the cluster.", fr: "Effectuer un redimensionnement élastique qui ajoute deux nœuds et garder toutes les ventes dans les tables locales du cluster." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Redshift Spectrum queries files in Amazon S3 without loading them, and an external schema from the AWS Glue Data Catalog lets SQL join them with local tables. Unloading the cold data as partitioned Parquet frees cluster storage, keeps S3 storage cheap and limits the data scanned by each query."
    fr: "Redshift Spectrum interroge des fichiers dans Amazon S3 sans les charger, et un schéma externe issu de l'AWS Glue Data Catalog permet de les joindre en SQL aux tables locales. Décharger les données froides en Parquet partitionné libère le stockage du cluster, garde un stockage S3 peu coûteux et limite les données analysées par chaque requête."
  options:
    b:
      en: "Data in a snapshot cannot be queried; analysts would wait for a restore and pay for a second cluster each time."
      fr: "Les données d'un instantané ne sont pas interrogeables ; les analystes attendraient une restauration et paieraient un second cluster à chaque fois."
    c:
      en: "Aurora is an operational database priced for transactional workloads, and storing large analytical history there costs more than S3."
      fr: "Aurora est une base opérationnelle tarifée pour des charges transactionnelles, et y stocker un volumineux historique analytique coûte plus cher que S3."
    d:
      en: "The company does not want to add nodes, and keeping rarely queried data on cluster storage is the costly design to avoid."
      fr: "L'entreprise ne veut pas ajouter de nœuds, et garder des données rarement interrogées sur le stockage du cluster est la conception coûteuse à éviter."
references:
  - title: Amazon Redshift Spectrum
    url: https://docs.aws.amazon.com/redshift/latest/dg/c-using-spectrum.html
  - title: External schemas in Amazon Redshift Spectrum
    url: https://docs.aws.amazon.com/redshift/latest/dg/c-spectrum-external-schemas.html
