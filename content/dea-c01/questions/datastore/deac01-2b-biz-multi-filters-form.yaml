id: deac01-2b-biz-multi-filters-form
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A customer data team publishes a customers table, a managed AWS Glue asset, in Amazon SageMaker Catalog. The marketing project must get access only to the rows of EU customers and must not see the email column. In addition, the governance team requires every consumer that requests access to any asset of the domain unit to fill in a form with the intended use and the retention period.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une équipe chargée des données clients publie une table customers, ressource AWS Glue gérée, dans Amazon SageMaker Catalog. Le projet marketing ne doit obtenir l'accès qu'aux lignes des clients de l'UE et ne doit pas voir la colonne email. En outre, l'équipe de gouvernance exige que chaque consommateur qui demande l'accès à une ressource de l'unité de domaine remplisse un formulaire indiquant l'utilisation prévue et la durée de conservation.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Approve the marketing project's subscription request with row and column filters that keep EU rows and exclude the email column.", fr: "Approuver la demande d'abonnement du projet marketing avec des filtres de lignes et de colonnes qui conservent les lignes de l'UE et excluent la colonne email." } }
    - { id: b, text: { en: "Add a metadata enforcement rule for subscription requests on the domain unit that requires the usage form.", fr: "Ajouter à l'unité de domaine une règle d'application des métadonnées pour les demandes d'abonnement qui exige le formulaire d'utilisation." } }
    - { id: c, text: { en: "Approve the marketing project's subscription request with full access, and ask the marketers not to query the email column.", fr: "Approuver la demande d'abonnement du projet marketing avec un accès complet, et demander aux équipes marketing de ne pas interroger la colonne email." } }
    - { id: d, text: { en: "Add a metadata enforcement rule for publishing on the domain unit that requires the usage form on every asset.", fr: "Ajouter à l'unité de domaine une règle d'application des métadonnées pour la publication qui exige le formulaire d'utilisation sur chaque ressource." } }
    - { id: e, text: { en: "Publish the customers asset with subscription approval disabled so that the form is collected automatically.", fr: "Publier la ressource customers avec l'approbation des abonnements désactivée afin que le formulaire soit collecté automatiquement." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "A member of the owning project can approve a subscription with filtered access, choosing row and column filters, so the subscriber gets only the allowed rows and columns. Metadata enforcement rules for subscription requests let domain unit owners require consumers to complete specific forms whenever they request access to an asset or data product."
    fr: "Un membre du projet propriétaire peut approuver un abonnement avec un accès filtré, en choisissant des filtres de lignes et de colonnes : l'abonné n'obtient que les lignes et colonnes autorisées. Les règles d'application des métadonnées pour les demandes d'abonnement permettent aux propriétaires d'unités de domaine d'exiger que les consommateurs remplissent des formulaires précis chaque fois qu'ils demandent l'accès à une ressource ou à un produit de données."
  options:
    c:
      en: "Full access gives the subscriber every row and column, so the email column and non-EU rows remain readable."
      fr: "Un accès complet donne à l'abonné toutes les lignes et colonnes : la colonne email et les lignes hors UE restent lisibles."
    d:
      en: "Publishing rules apply to producers when they publish; they do not make consumers fill in a form when they request access."
      fr: "Les règles de publication s'appliquent aux producteurs lorsqu'ils publient ; elles ne font pas remplir de formulaire aux consommateurs lorsqu'ils demandent un accès."
    e:
      en: "Disabling approval approves every request automatically without review, so the owner never chooses row and column filters, and this setting does not create any form."
      fr: "Désactiver l'approbation approuve automatiquement chaque demande sans examen : le propriétaire ne choisit jamais de filtres de lignes et de colonnes, et ce paramètre ne crée aucun formulaire."
references:
  - title: Approve or reject a subscription request in Amazon SageMaker Unified Studio
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/approve-reject-subscription-request.html
  - title: Metadata enforcement rules for subscription requests
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/metadata-rules-subscription.html
