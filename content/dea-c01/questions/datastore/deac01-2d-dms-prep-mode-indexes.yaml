id: deac01-2d-dms-prep-mode-indexes
objective: "2.4.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company replicates a Microsoft SQL Server database to Amazon Aurora PostgreSQL-Compatible Edition with an AWS DMS full-load and CDC task. The task created the target tables itself. After the full load, the target has the tables and primary keys, but no secondary indexes, foreign keys or stored procedures. The company must rebuild the migration so that the target has the complete converted schema while AWS DMS still moves the data.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise réplique une base de données Microsoft SQL Server vers Amazon Aurora PostgreSQL-Compatible Edition avec une tâche AWS DMS de chargement complet et de CDC. La tâche a créé elle-même les tables cibles. Après le chargement complet, la cible contient les tables et les clés primaires, mais aucun index secondaire, aucune clé étrangère et aucune procédure stockée. L'entreprise doit refaire la migration afin que la cible dispose du schéma converti complet, tandis qu'AWS DMS continue de déplacer les données.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Convert the source schema with DMS Schema Conversion and apply it to the target before the task starts.", fr: "Convertir le schéma source avec DMS Schema Conversion et l'appliquer à la cible avant le démarrage de la tâche." } }
    - { id: b, text: { en: "Set the task's TargetTablePrepMode to DO_NOTHING so that the task keeps the existing target tables.", fr: "Définir TargetTablePrepMode de la tâche sur DO_NOTHING afin que la tâche conserve les tables cibles existantes." } }
    - { id: c, text: { en: "Set the task's TargetTablePrepMode to DROP_AND_CREATE so that the task rebuilds each target table.", fr: "Définir TargetTablePrepMode de la tâche sur DROP_AND_CREATE afin que la tâche recrée chaque table cible." } }
    - { id: d, text: { en: "Set HandleSourceTableAltered to true in the task's change processing DDL handling policy.", fr: "Définir HandleSourceTableAltered sur true dans la politique de gestion du DDL du traitement des modifications de la tâche." } }
    - { id: e, text: { en: "Enable full LOB mode in the task settings so that the task migrates all object definitions.", fr: "Activer le mode LOB complet dans les paramètres de la tâche afin qu'elle migre toutes les définitions d'objets." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "AWS DMS creates only basic schema objects such as tables and primary keys, so the full schema, including secondary indexes, foreign keys and procedures, must come from DMS Schema Conversion. The task must then leave those tables in place: DO_NOTHING does not affect the data or metadata of existing target tables."
    fr: "AWS DMS ne crée que des objets de schéma de base comme les tables et les clés primaires : le schéma complet, avec les index secondaires, les clés étrangères et les procédures, doit venir de DMS Schema Conversion. La tâche doit ensuite laisser ces tables en place : DO_NOTHING n'affecte ni les données ni les métadonnées des tables cibles existantes."
  options:
    c:
      en: "DROP_AND_CREATE drops the existing tables and creates new ones, which would remove the converted indexes and constraints again."
      fr: "DROP_AND_CREATE supprime les tables existantes et en crée de nouvelles, ce qui retirerait de nouveau les index et contraintes convertis."
    d:
      en: "HandleSourceTableAltered replicates ALTER statements made on the source during CDC; it does not create missing objects on the target."
      fr: "HandleSourceTableAltered réplique les instructions ALTER exécutées sur la source pendant la CDC ; il ne crée pas les objets manquants sur la cible."
    e:
      en: "LOB mode controls how large object columns are copied; it has no effect on indexes, constraints or procedures."
      fr: "Le mode LOB détermine la copie des colonnes de grands objets ; il n'a aucun effet sur les index, les contraintes ou les procédures."
references:
  - title: Best practices for AWS Database Migration Service
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_BestPractices.html
  - title: Full-load task settings
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.CustomizingTasks.TaskSettings.FullLoad.html
