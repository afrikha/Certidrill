id: deac01-2c-copy-iam-role
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer schedules SQL scripts that run COPY commands to load data from an Amazon S3 bucket into a provisioned Amazon Redshift cluster. The company's security policy forbids long-term access keys in SQL scripts, job parameters, or secrets stores. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur des données planifie des scripts SQL qui exécutent des commandes COPY pour charger des données d'un compartiment Amazon S3 dans un cluster Amazon Redshift provisionné. La politique de sécurité de l'entreprise interdit les clés d'accès à long terme dans les scripts SQL, les paramètres de tâche ou les magasins de secrets. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM user with read access to the bucket, and pass its keys with ACCESS_KEY_ID and SECRET_ACCESS_KEY.", fr: "Créer un utilisateur IAM avec un accès en lecture au compartiment, et transmettre ses clés avec ACCESS_KEY_ID et SECRET_ACCESS_KEY." }
    - id: b
      text: { en: "Store the keys of an IAM user in AWS Secrets Manager, and build a CREDENTIALS string from them at run time.", fr: "Stocker les clés d'un utilisateur IAM dans AWS Secrets Manager, et construire une chaîne CREDENTIALS à partir de celles-ci à l'exécution." }
    - id: c
      text: { en: "Create an IAM role with read access to the bucket, associate it with the cluster, and reference it with IAM_ROLE in COPY.", fr: "Créer un rôle IAM avec un accès en lecture au compartiment, l'associer au cluster et le référencer avec IAM_ROLE dans COPY." }
    - id: d
      text: { en: "Add a bucket policy that allows s3:GetObject from the cluster's VPC, and run COPY with no authorization parameter.", fr: "Ajouter une politique de compartiment qui autorise s3:GetObject depuis le VPC du cluster, et exécuter COPY sans paramètre d'autorisation." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Role-based access control is the recommended way to authorize COPY: the role is associated with the cluster, and Redshift obtains temporary credentials for it in each session. No access key appears anywhere, and IAM_ROLE default can even reference the cluster's default role.
    fr: |
      Le contrôle d'accès basé sur les rôles est la méthode recommandée pour autoriser COPY : le rôle est associé au cluster et Redshift obtient pour lui des informations d'identification temporaires à chaque session. Aucune clé d'accès n'apparaît, et IAM_ROLE default peut même référencer le rôle par défaut du cluster.
  options:
    a: { en: "This puts long-term access keys in plain text in the SQL scripts, which the policy forbids.", fr: "Cela place des clés d'accès à long terme en clair dans les scripts SQL, ce que la politique interdit." }
    b: { en: "The secrets store still holds long-term keys, which the policy forbids, and the script must manage their retrieval and rotation.", fr: "Le magasin de secrets contient toujours des clés à long terme, ce que la politique interdit, et le script doit gérer leur récupération et leur rotation." }
    d: { en: "COPY needs an authorization parameter to access Amazon S3; a bucket policy alone does not provide credentials to the command.", fr: "COPY a besoin d'un paramètre d'autorisation pour accéder à Amazon S3 ; une politique de compartiment seule ne fournit pas d'informations d'identification à la commande." }
references:
  - title: Authorization parameters
    url: https://docs.aws.amazon.com/redshift/latest/dg/copy-parameters-authorization.html
