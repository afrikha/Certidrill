id: deac01-2c-copy-noload-maxerror
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer receives a new feed of GZIP-compressed CSV files from a partner and will load it into Amazon Redshift with COPY. Before the first production load, the engineer must check that COPY can parse the files, without loading any row into the table. In production, the load must continue when fewer than 50 rows are rejected and must fail when 50 or more rows are rejected.

    Which COPY options will meet these requirements? (Choose two.)
  fr: |
    Un ingénieur des données reçoit d'un partenaire un nouveau flux de fichiers CSV compressés en GZIP et va le charger dans Amazon Redshift avec COPY. Avant le premier chargement en production, l'ingénieur doit vérifier que COPY peut analyser les fichiers, sans charger aucune ligne dans la table. En production, le chargement doit continuer quand moins de 50 lignes sont rejetées et doit échouer quand 50 lignes ou plus sont rejetées.

    Quelles options de COPY permettent de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "IGNOREALLERRORS for the production load", fr: "IGNOREALLERRORS pour le chargement en production" } }
    - { id: b, text: { en: "NOLOAD for the validation run", fr: "NOLOAD pour l'exécution de validation" } }
    - { id: c, text: { en: "STATUPDATE OFF for the validation run", fr: "STATUPDATE OFF pour l'exécution de validation" } }
    - { id: d, text: { en: "COMPUPDATE PRESET for the production load", fr: "COMPUPDATE PRESET pour le chargement en production" } }
    - { id: e, text: { en: "MAXERROR 50 for the production load", fr: "MAXERROR 50 pour le chargement en production" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      NOLOAD only parses the data files and loads nothing, so it checks the files quickly before the real load. MAXERROR 50 makes the load fail when it produces 50 or more errors and lets it continue, with an INFO message, when there are fewer.
    fr: |
      NOLOAD se contente d'analyser les fichiers de données et ne charge rien : il vérifie rapidement les fichiers avant le vrai chargement. MAXERROR 50 fait échouer le chargement quand il produit 50 erreurs ou plus et le laisse continuer, avec un message INFO, quand il y en a moins.
  options:
    a: { en: "IGNOREALLERRORS ignores every error, so the load would never fail, even with thousands of rejected rows.", fr: "IGNOREALLERRORS ignore toutes les erreurs : le chargement n'échouerait jamais, même avec des milliers de lignes rejetées." }
    c: { en: "STATUPDATE controls the refresh of optimizer statistics; the run would still load the rows.", fr: "STATUPDATE contrôle l'actualisation des statistiques de l'optimiseur ; l'exécution chargerait toujours les lignes." }
    d: { en: "COMPUPDATE PRESET chooses compression encodings for an empty table; it does not control how many errors are tolerated.", fr: "COMPUPDATE PRESET choisit les encodages de compression d'une table vide ; il ne contrôle pas le nombre d'erreurs tolérées." }
references:
  - title: Data load operations
    url: https://docs.aws.amazon.com/redshift/latest/dg/copy-parameters-data-load.html
