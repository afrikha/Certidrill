id: deac01-2a-dms-s3-parquet-cdc
objective: "2.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company replicates an on-premises PostgreSQL database into an Amazon S3 data lake with an AWS DMS task that performs a full load and ongoing change data capture (CDC). The data lake requires Parquet files, and the CDC files must be stored in folders based on the transaction commit date. Inserts, updates and deletes must all be written so that a downstream job can apply them to Apache Iceberg tables.

    Which combination of S3 target endpoint settings will meet these requirements? (Choose two.)
  fr: |
    Une entreprise réplique une base de données PostgreSQL locale vers un lac de données Amazon S3 avec une tâche AWS DMS qui effectue un chargement complet et une capture des données modifiées (CDC) continue. Le lac de données exige des fichiers Parquet, et les fichiers CDC doivent être rangés dans des dossiers selon la date de validation des transactions. Les insertions, mises à jour et suppressions doivent toutes être écrites pour qu'une tâche en aval les applique à des tables Apache Iceberg.

    Quelle combinaison de paramètres du point de terminaison cible S3 répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "DataFormat=parquet" }
    - { id: b, text: "CdcInsertsOnly=true" }
    - { id: c, text: "DatePartitionEnabled=true" }
    - { id: d, text: "AddColumnName=true" }
    - { id: e, text: "CdcInsertsAndUpdates=true" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "DataFormat accepts csv (the default) or parquet, so parquet produces the required files. DatePartitionEnabled partitions the S3 folders by transaction commit date. With neither CDC filter set, DMS writes inserts, updates and deletes, and the first column of each CDC record marks the operation (I, U or D)."
    fr: "DataFormat accepte csv (par défaut) ou parquet : parquet produit les fichiers exigés. DatePartitionEnabled partitionne les dossiers S3 par date de validation des transactions. Sans aucun des filtres CDC, DMS écrit les insertions, mises à jour et suppressions, et la première colonne de chaque enregistrement CDC indique l'opération (I, U ou D)."
  options:
    b:
      en: "CdcInsertsOnly writes only inserts, so the updates and deletes would be lost."
      fr: "CdcInsertsOnly n'écrit que les insertions : les mises à jour et suppressions seraient perdues."
    d:
      en: "AddColumnName adds column names to .csv output; it neither produces Parquet nor creates date folders."
      fr: "AddColumnName ajoute les noms de colonnes à la sortie .csv ; il ne produit pas de Parquet et ne crée pas de dossiers par date."
    e:
      en: "CdcInsertsAndUpdates writes inserts and updates only, so the deletes would be lost."
      fr: "CdcInsertsAndUpdates n'écrit que les insertions et les mises à jour : les suppressions seraient perdues."
references:
  - title: Using Amazon S3 as a target for AWS Database Migration Service
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.S3.html
