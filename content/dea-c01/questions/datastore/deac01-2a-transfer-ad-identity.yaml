id: deac01-2a-transfer-ad-identity
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's finance department has 200 users who must upload files over SFTP to an Amazon S3 bucket by using their existing on-premises Microsoft Active Directory credentials. Only members of the FinanceUploaders group may connect, and they must land in the finance prefix of the bucket. The company does not want to synchronize passwords or write custom authentication code.

    Which solution will meet these requirements?
  fr: |
    Le service financier d'une entreprise compte 200 utilisateurs qui doivent charger des fichiers par SFTP dans un compartiment Amazon S3 avec leurs informations d'identification Microsoft Active Directory locales existantes. Seuls les membres du groupe FinanceUploaders peuvent se connecter, et ils doivent arriver dans le préfixe finance du compartiment. L'entreprise ne veut ni synchroniser les mots de passe ni écrire de code d'authentification personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a service-managed user with an SSH public key for each employee on a Transfer Family SFTP server.", fr: "Créer sur un serveur SFTP Transfer Family un utilisateur géré par le service avec une clé publique SSH pour chaque employé." } }
    - { id: b, text: { en: "Use a custom identity provider whose Lambda function checks each user's password against Active Directory over LDAP.", fr: "Utiliser un fournisseur d'identité personnalisé dont la fonction Lambda vérifie le mot de passe de chaque utilisateur auprès d'Active Directory par LDAP." } }
    - { id: c, text: { en: "Use AWS Directory Service with an AD Connector as the server's identity provider and grant access to the FinanceUploaders group.", fr: "Utiliser AWS Directory Service avec un AD Connector comme fournisseur d'identité du serveur et accorder l'accès au groupe FinanceUploaders." } }
    - { id: d, text: { en: "Create a Transfer Family web app that authenticates users through IAM Identity Center and S3 Access Grants.", fr: "Créer une application web Transfer Family qui authentifie les utilisateurs via IAM Identity Center et S3 Access Grants." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Transfer Family can use AWS Directory Service as its identity provider, and an AD Connector points it to the on-premises Active Directory, so users sign in with their existing credentials. An access granted to the group's SID defines the IAM role and the home directory in the finance prefix."
    fr: "Transfer Family peut utiliser AWS Directory Service comme fournisseur d'identité, et un AD Connector le relie à l'Active Directory local : les utilisateurs se connectent avec leurs informations d'identification existantes. Un accès accordé au SID du groupe définit le rôle IAM et le répertoire de base dans le préfixe finance."
  options:
    a:
      en: "Service-managed users authenticate with SSH keys stored in Transfer Family, not with Active Directory credentials, and each must be managed separately."
      fr: "Les utilisateurs gérés par le service s'authentifient avec des clés SSH stockées dans Transfer Family, pas avec les informations d'identification Active Directory, et chacun doit être géré séparément."
    b:
      en: "This works but is the custom authentication code that the company does not want to write."
      fr: "Cela fonctionne, mais c'est le code d'authentification personnalisé que l'entreprise ne veut pas écrire."
    d:
      en: "A web app gives browser access; the users must upload over SFTP."
      fr: "Une application web donne un accès par navigateur ; les utilisateurs doivent charger par SFTP."
references:
  - title: Using AWS Directory Service for Microsoft Active Directory
    url: https://docs.aws.amazon.com/transfer/latest/userguide/directory-services-users.html
