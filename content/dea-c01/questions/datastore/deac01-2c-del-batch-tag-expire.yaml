id: deac01-2c-del-batch-tag-expire
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The legal team gives a data engineer a CSV file that lists 2 million object keys to delete from an Amazon S3 bucket that does not use versioning. The keys are spread across many prefixes that also contain objects that must be kept. The company does not want to write custom code. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    L'équipe juridique remet à un ingénieur des données un fichier CSV qui liste 2 millions de clés d'objet à supprimer d'un compartiment Amazon S3 sans gestion des versions. Les clés sont réparties dans de nombreux préfixes qui contiennent aussi des objets à conserver. L'entreprise ne veut pas écrire de code personnalisé. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Tag the listed objects with delete=true by using an S3 Batch Operations job, and expire tagged objects with a lifecycle rule.", fr: "Baliser les objets listés avec delete=true à l'aide d'une tâche S3 Batch Operations, et faire expirer les objets balisés par une règle de cycle de vie." }
    - id: b
      text: { en: "Run an S3 Batch Operations job that invokes an AWS Lambda function, which deletes each object listed in the CSV file.", fr: "Exécuter une tâche S3 Batch Operations qui appelle une fonction AWS Lambda, laquelle supprime chaque objet listé dans le fichier CSV." }
    - id: c
      text: { en: "Create one S3 Lifecycle rule for each prefix that appears in the CSV file, with an Expiration action of 1 day.", fr: "Créer une règle S3 Lifecycle pour chaque préfixe qui figure dans le fichier CSV, avec une action Expiration de 1 jour." }
    - id: d
      text: { en: "Run an S3 Batch Operations job that places an S3 Object Lock legal hold on every object listed in the CSV file.", fr: "Exécuter une tâche S3 Batch Operations qui place une conservation légale (legal hold) S3 Object Lock sur chaque objet listé dans le fichier CSV." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      S3 Batch Operations has no delete operation, but its Replace all object tags operation can tag exactly the objects listed in a CSV manifest. A lifecycle rule with a tag filter then expires those objects, so S3 performs the deletions with no code.
    fr: |
      S3 Batch Operations n'a pas d'opération de suppression, mais son opération Replace all object tags peut baliser exactement les objets listés dans un manifeste CSV. Une règle de cycle de vie avec un filtre de balise fait ensuite expirer ces objets : S3 effectue les suppressions sans code.
  options:
    b: { en: "The Lambda function is custom code that the company must write and maintain, which the company does not want.", fr: "La fonction Lambda est du code personnalisé que l'entreprise doit écrire et maintenir, ce qu'elle ne veut pas." }
    c: { en: "Prefix rules would also delete the objects under those prefixes that must be kept.", fr: "Des règles de préfixe supprimeraient aussi les objets de ces préfixes qui doivent être conservés." }
    d: { en: "A legal hold prevents the objects from being deleted; it does the opposite of what the legal team asked.", fr: "Une conservation légale empêche la suppression des objets ; elle fait l'inverse de ce que demande l'équipe juridique." }
references:
  - title: Operations supported by S3 Batch Operations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops-operations.html
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
