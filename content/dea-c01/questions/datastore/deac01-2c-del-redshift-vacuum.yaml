id: deac01-2c-del-redshift-vacuum
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To apply a data retention policy, a data engineer deletes 40 % of the rows of a large events table in a provisioned Amazon Redshift cluster. Disk usage does not drop, because sustained load on the cluster delays the automatic vacuum. The engineer must reclaim the disk space soon and keep the remaining rows. The table is already well sorted, so re-sorting is not needed.

    Which action will meet these requirements?
  fr: |
    Pour appliquer une politique de conservation des données, un ingénieur des données supprime 40 % des lignes d'une grande table d'événements dans un cluster Amazon Redshift provisionné. L'utilisation du disque ne baisse pas, car la charge continue du cluster retarde le vacuum automatique. L'ingénieur doit récupérer rapidement l'espace disque et conserver les lignes restantes. La table est déjà bien triée : un nouveau tri n'est pas nécessaire.

    Quelle action permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run VACUUM DELETE ONLY on the events table.", fr: "Exécuter VACUUM DELETE ONLY sur la table des événements." }
    - id: b
      text: { en: "Run ANALYZE on the events table.", fr: "Exécuter ANALYZE sur la table des événements." }
    - id: c
      text: { en: "Run TRUNCATE on the events table.", fr: "Exécuter TRUNCATE sur la table des événements." }
    - id: d
      text: { en: "Run VACUUM SORT ONLY on the events table.", fr: "Exécuter VACUUM SORT ONLY sur la table des événements." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Redshift only marks deleted rows for deletion; the space is reclaimed by a vacuum. VACUUM DELETE ONLY reclaims the space held by those rows and compacts the table without sorting it, which is the fastest way to free disk when the sort order is already acceptable.
    fr: |
      Redshift se contente de marquer les lignes supprimées ; l'espace est récupéré par un vacuum. VACUUM DELETE ONLY récupère l'espace occupé par ces lignes et compacte la table sans la trier, ce qui est le moyen le plus rapide de libérer le disque quand l'ordre de tri est déjà acceptable.
  options:
    b: { en: "ANALYZE updates the optimizer statistics; it does not reclaim the space of deleted rows.", fr: "ANALYZE met à jour les statistiques de l'optimiseur ; il ne récupère pas l'espace des lignes supprimées." }
    c: { en: "TRUNCATE deletes every row of the table, including the rows that must be kept.", fr: "TRUNCATE supprime toutes les lignes de la table, y compris celles qui doivent être conservées." }
    d: { en: "SORT ONLY re-sorts the table without reclaiming the space of deleted rows.", fr: "SORT ONLY trie de nouveau la table sans récupérer l'espace des lignes supprimées." }
references:
  - title: VACUUM
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_VACUUM_command.html
