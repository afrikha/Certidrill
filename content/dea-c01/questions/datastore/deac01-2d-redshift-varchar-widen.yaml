id: deac01-2d-redshift-varchar-widen
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company loads product data into an Amazon Redshift table every night with the COPY command. The product_description column is defined as VARCHAR(256) with ZSTD encoding. The supplier now sends descriptions of up to 1,000 characters, and the nightly COPY fails. The full descriptions must be kept, and the fix must take the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution charge chaque nuit des données de produits dans une table Amazon Redshift avec la commande COPY. La colonne product_description est définie en VARCHAR(256) avec l'encodage ZSTD. Le fournisseur envoie désormais des descriptions de 1 000 caractères au maximum, et le COPY nocturne échoue. Les descriptions complètes doivent être conservées, et la correction doit demander le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the TRUNCATECOLUMNS parameter to the COPY command.", fr: "Ajouter le paramètre TRUNCATECOLUMNS à la commande COPY." } }
    - { id: b, text: { en: "Run ALTER TABLE ALTER COLUMN product_description TYPE VARCHAR(1000).", fr: "Exécuter ALTER TABLE ALTER COLUMN product_description TYPE VARCHAR(1000)." } }
    - { id: c, text: { en: "Add the ACCEPTINVCHARS parameter to the COPY command.", fr: "Ajouter le paramètre ACCEPTINVCHARS à la commande COPY." } }
    - { id: d, text: { en: "Create a new table with a VARCHAR(1000) column, deep copy the data into it, and swap the table names.", fr: "Créer une nouvelle table avec une colonne VARCHAR(1000), y copier intégralement les données (deep copy), puis permuter les noms des tables." } }
answer: { optionId: b }
explanation:
  correct:
    en: "ALTER COLUMN TYPE supports increasing the size of a VARCHAR column in place. The restrictions do not apply here: the column uses ZSTD, not BYTEDICT, RUNLENGTH, TEXT255 or TEXT32K, and the new size is larger than the existing data."
    fr: "ALTER COLUMN TYPE permet d'augmenter sur place la taille d'une colonne VARCHAR. Les restrictions ne s'appliquent pas ici : la colonne utilise ZSTD et non BYTEDICT, RUNLENGTH, TEXT255 ou TEXT32K, et la nouvelle taille est supérieure aux données existantes."
  options:
    a:
      en: "TRUNCATECOLUMNS makes the load succeed by cutting values to the column size, so the full descriptions would be lost."
      fr: "TRUNCATECOLUMNS fait réussir le chargement en coupant les valeurs à la taille de la colonne : les descriptions complètes seraient perdues."
    c:
      en: "ACCEPTINVCHARS replaces invalid UTF-8 characters; it does not let longer values fit in the column."
      fr: "ACCEPTINVCHARS remplace les caractères UTF-8 non valides ; il ne permet pas à des valeurs plus longues de tenir dans la colonne."
    d:
      en: "A deep copy also works but rebuilds the whole table, which is more effort than altering the column size."
      fr: "Une copie intégrale fonctionne aussi, mais reconstruit toute la table, ce qui demande plus d'effort que de modifier la taille de la colonne."
references:
  - title: ALTER TABLE
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_ALTER_TABLE.html
  - title: Data conversion parameters
    url: https://docs.aws.amazon.com/redshift/latest/dg/copy-parameters-data-conversion.html
