id: deac01-2a-iceberg-athena-maintenance
objective: "2.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company updates an Apache Iceberg table named orders several times each hour with MERGE INTO statements in Amazon Athena. Queries are slowing down because of the many small data files and delete files. The S3 storage of the table keeps growing because old snapshots are kept, but the company needs time travel for only the last 7 days.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise met à jour plusieurs fois par heure une table Apache Iceberg nommée orders avec des instructions MERGE INTO dans Amazon Athena. Les requêtes ralentissent à cause des nombreux petits fichiers de données et fichiers de suppression. Le stockage S3 de la table ne cesse de croître, car les anciens instantanés sont conservés, alors que l'entreprise n'a besoin du voyage dans le temps que pour les 7 derniers jours.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run MSCK REPAIR TABLE orders after each MERGE INTO statement.", fr: "Exécuter MSCK REPAIR TABLE orders après chaque instruction MERGE INTO." } }
    - { id: b, text: { en: "Run OPTIMIZE orders REWRITE DATA USING BIN_PACK on a regular basis.", fr: "Exécuter régulièrement OPTIMIZE orders REWRITE DATA USING BIN_PACK." } }
    - { id: c, text: { en: "Add an S3 Lifecycle rule that expires objects older than 7 days under the table location.", fr: "Ajouter une règle S3 Lifecycle qui fait expirer les objets de plus de 7 jours sous l'emplacement de la table." } }
    - { id: d, text: { en: "Set vacuum_max_snapshot_age_seconds to 604800 on the table and run VACUUM orders regularly.", fr: "Définir vacuum_max_snapshot_age_seconds à 604800 sur la table et exécuter régulièrement VACUUM orders." } }
    - { id: e, text: { en: "Set the write.merge.mode table property to copy-on-write so that Athena rewrites files instead of adding delete files.", fr: "Définir la propriété de table write.merge.mode à copy-on-write pour qu'Athena réécrive les fichiers au lieu d'ajouter des fichiers de suppression." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "OPTIMIZE ... REWRITE DATA USING BIN_PACK compacts small data files and merges delete files into the data files, which speeds up queries. VACUUM expires snapshots older than the table's retention and removes orphan files; vacuum_max_snapshot_age_seconds = 604800 keeps 7 days of time travel."
    fr: "OPTIMIZE ... REWRITE DATA USING BIN_PACK compacte les petits fichiers de données et fusionne les fichiers de suppression dans les fichiers de données, ce qui accélère les requêtes. VACUUM fait expirer les instantanés plus anciens que la conservation de la table et supprime les fichiers orphelins ; vacuum_max_snapshot_age_seconds = 604800 garde 7 jours de voyage dans le temps."
  options:
    a:
      en: "MSCK REPAIR TABLE adds Hive-style partitions to the catalog; Iceberg tracks its files in its own metadata, so this does nothing for compaction or snapshots."
      fr: "MSCK REPAIR TABLE ajoute des partitions de type Hive au catalogue ; Iceberg suit ses fichiers dans ses propres métadonnées : cela n'agit ni sur le compactage ni sur les instantanés."
    c:
      en: "Old files can still belong to the current table state, so expiring them by age would corrupt the table."
      fr: "Des fichiers anciens peuvent encore appartenir à l'état actuel de la table : les faire expirer selon leur âge corromprait la table."
    e:
      en: "Athena always uses merge-on-read with position deletes for UPDATE, MERGE INTO and DELETE and ignores copy-on-write settings."
      fr: "Athena utilise toujours la fusion à la lecture (merge-on-read) avec suppressions positionnelles pour UPDATE, MERGE INTO et DELETE, et ignore les paramètres copy-on-write."
references:
  - title: Optimize Iceberg tables
    url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-data-optimization.html
  - title: Update Iceberg table data
    url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-updating-iceberg-table-data.html
