id: deac01-2b-part-add-partition-non-hive
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A load balancer writes its access logs to Amazon S3 under prefixes such as s3://example-logs/elb/2026/11/21/. An Amazon Athena table named elb_logs is partitioned by a dt string column. A daily job must make the logs of the previous day queryable. The S3 layout cannot be changed, and the job must not fail if it runs twice for the same day.

    Which statement should the daily job run?
  fr: |
    Un équilibreur de charge écrit ses journaux d'accès dans Amazon S3 sous des préfixes tels que s3://example-logs/elb/2026/11/21/. Une table Amazon Athena nommée elb_logs est partitionnée par une colonne de type chaîne dt. Une tâche quotidienne doit rendre interrogeables les journaux de la veille. La structure S3 ne peut pas être modifiée, et la tâche ne doit pas échouer si elle s'exécute deux fois pour le même jour.

    Quelle instruction la tâche quotidienne doit-elle exécuter ?
body:
  options:
    - { id: a, text: "MSCK REPAIR TABLE elb_logs" }
    - { id: b, text: "ALTER TABLE elb_logs ADD PARTITION (dt='2026-11-21')" }
    - { id: c, text: "ALTER TABLE elb_logs SET LOCATION 's3://example-logs/elb/2026/11/21/'" }
    - { id: d, text: "ALTER TABLE elb_logs ADD IF NOT EXISTS PARTITION (dt='2026-11-21') LOCATION 's3://example-logs/elb/2026/11/21/'" }
answer: { optionId: d }
explanation:
  correct:
    en: "The prefixes are not in Hive format, so each partition must be added with ALTER TABLE ADD PARTITION and an explicit LOCATION; the partition key value can differ from the S3 key. IF NOT EXISTS avoids the Partition already exists error when the job runs again."
    fr: "Les préfixes ne sont pas au format Hive : chaque partition doit être ajoutée avec ALTER TABLE ADD PARTITION et un LOCATION explicite ; la valeur de la clé de partition peut différer de la clé S3. IF NOT EXISTS évite l'erreur Partition already exists lorsque la tâche s'exécute à nouveau."
  options:
    a:
      en: "MSCK REPAIR TABLE works only with Hive-style key=value prefixes, so it finds no partition in this layout."
      fr: "MSCK REPAIR TABLE ne fonctionne qu'avec des préfixes de style Hive clé=valeur : il ne trouve aucune partition dans cette structure."
    b:
      en: "Without LOCATION, Athena expects the partition under a dt=2026-11-21/ prefix of the table location, and a second run fails because the partition already exists."
      fr: "Sans LOCATION, Athena s'attend à trouver la partition sous un préfixe dt=2026-11-21/ de l'emplacement de la table, et une seconde exécution échoue, car la partition existe déjà."
    c:
      en: "Changing the table location points the whole table to one day and drops access to the other days instead of adding a partition."
      fr: "Modifier l'emplacement de la table fait pointer toute la table vers un seul jour et supprime l'accès aux autres jours au lieu d'ajouter une partition."
references:
  - title: Partition your data
    url: https://docs.aws.amazon.com/athena/latest/ug/partitions.html
