id: deac01-2c-res-ddb-global-table
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An order status API reads and writes an Amazon DynamoDB table in eu-west-1. If eu-west-1 becomes unavailable, the API must keep reading and writing the data from eu-central-1 with a recovery point objective close to zero. The application code must not change, except for its Region configuration. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une API d'état des commandes lit et écrit dans une table Amazon DynamoDB dans eu-west-1. Si eu-west-1 devient indisponible, l'API doit continuer de lire et d'écrire les données depuis eu-central-1 avec un objectif de point de récupération proche de zéro. Le code de l'application ne doit pas changer, hormis sa configuration de Région. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a replica in eu-central-1 to turn the table into a DynamoDB global table.", fr: "Ajouter un réplica dans eu-central-1 pour transformer la table en table globale DynamoDB." }
    - id: b
      text: { en: "Enable point-in-time recovery, and restore the table in eu-central-1 when eu-west-1 is unavailable.", fr: "Activer la récupération à un instant dans le passé (point-in-time recovery), et restaurer la table dans eu-central-1 quand eu-west-1 est indisponible." }
    - id: c
      text: { en: "Create a daily AWS Backup plan that copies the table's backups to eu-central-1.", fr: "Créer un plan AWS Backup quotidien qui copie les sauvegardes de la table vers eu-central-1." }
    - id: d
      text: { en: "Enable DynamoDB Streams, and have an AWS Lambda function write each change to a table in eu-central-1.", fr: "Activer DynamoDB Streams, et faire écrire chaque modification dans une table de eu-central-1 par une fonction AWS Lambda." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Global tables replicate the table across Regions, and every replica serves reads and writes through the existing DynamoDB APIs. Shifting traffic to the eu-central-1 replica gives a low or zero recovery point objective with no application change beyond the Region.
    fr: |
      Les tables globales répliquent la table entre Régions, et chaque réplica sert les lectures et les écritures via les API DynamoDB existantes. Basculer le trafic vers le réplica de eu-central-1 donne un objectif de point de récupération faible ou nul, sans autre modification de l'application que la Région.
  options:
    b: { en: "A restore happens only after the outage starts, creates a new table and takes time, so the API cannot keep writing during the failure.", fr: "Une restauration n'a lieu qu'après le début de la panne, crée une nouvelle table et prend du temps : l'API ne peut pas continuer d'écrire pendant la panne." }
    c: { en: "Daily backups can lose up to a day of changes and must be restored before the API can use them.", fr: "Des sauvegardes quotidiennes peuvent perdre jusqu'à une journée de modifications et doivent être restaurées avant que l'API puisse les utiliser." }
    d: { en: "This custom replication must be built and operated by the company, which is far more overhead than a managed global table.", fr: "Cette réplication personnalisée doit être construite et exploitée par l'entreprise, ce qui demande bien plus d'efforts qu'une table globale gérée." }
references:
  - title: Global tables - multi-active, multi-Region replication
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
