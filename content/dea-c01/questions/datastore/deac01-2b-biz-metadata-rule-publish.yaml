id: deac01-2b-biz-metadata-rule-publish
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank uses Amazon SageMaker Catalog with a Finance domain unit that contains a dozen producer projects. The governance team requires every data asset and data product published from any project in the Finance domain unit, including projects created later in child domain units, to carry a Data ownership metadata form. Producers must not be able to publish without it.

    Which solution will meet these requirements?
  fr: |
    Une banque utilise Amazon SageMaker Catalog avec une unité de domaine Finance qui contient une douzaine de projets producteurs. L'équipe de gouvernance exige que chaque ressource de données et chaque produit de données publiés depuis un projet de l'unité de domaine Finance, y compris les projets créés plus tard dans des unités de domaine enfants, portent un formulaire de métadonnées Data ownership. Les producteurs ne doivent pas pouvoir publier sans lui.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the metadata form to each data source of the current projects so that the form is applied to the assets that the data sources create.", fr: "Ajouter le formulaire de métadonnées à chaque source de données des projets actuels afin que le formulaire soit appliqué aux ressources créées par les sources de données." } }
    - { id: b, text: { en: "Create a business glossary named Data ownership, and ask the producers to attach one of its terms before each publication.", fr: "Créer un glossaire métier nommé Data ownership, et demander aux producteurs d'associer l'un de ses termes avant chaque publication." } }
    - { id: c, text: { en: "Add a metadata enforcement rule for subscription requests that requires the form on the Finance domain unit.", fr: "Ajouter à l'unité de domaine Finance une règle d'application des métadonnées pour les demandes d'abonnement qui exige le formulaire." } }
    - { id: d, text: { en: "Add a metadata enforcement rule for publishing on the Finance domain unit that requires the form and cascades to child domain units.", fr: "Ajouter à l'unité de domaine Finance une règle d'application des métadonnées pour la publication qui exige le formulaire et s'applique en cascade aux unités de domaine enfants." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Domain unit owners create metadata enforcement rules for data asset and product publishing that require specific metadata forms or glossary terms. A rule can apply to all projects of the domain unit and cascade to child domain units, so assets and products in scope must include the form."
    fr: "Les propriétaires d'unités de domaine créent des règles d'application des métadonnées pour la publication de ressources et de produits de données, qui exigent des formulaires de métadonnées ou des termes de glossaire précis. Une règle peut s'appliquer à tous les projets de l'unité de domaine et en cascade aux unités de domaine enfants : les ressources et produits concernés doivent inclure le formulaire."
  options:
    a:
      en: "A form added to a data source is applied only to the assets that this data source creates; it enforces nothing for other publications or future projects."
      fr: "Un formulaire ajouté à une source de données ne s'applique qu'aux ressources créées par cette source ; il n'impose rien pour les autres publications ni pour les projets futurs."
    b:
      en: "A request to attach a term is not enforced, and a glossary term is not the required metadata form."
      fr: "Une demande d'association de terme n'est pas imposée, et un terme de glossaire n'est pas le formulaire de métadonnées exigé."
    c:
      en: "Subscription request rules make consumers fill in forms when they request access; they do not control what producers publish."
      fr: "Les règles relatives aux demandes d'abonnement font remplir des formulaires aux consommateurs lorsqu'ils demandent un accès ; elles ne contrôlent pas ce que publient les producteurs."
references:
  - title: Metadata enforcement rules for publishing
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/metadata-rules-publishing.html
