id: deac01-2b-part-glue-job-update-catalog
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue ETL job writes JSON output to Amazon S3, partitioned by region, year, month and day. The target table events already exists in the Data Catalog database analytics, with the same partition keys in the same order. Data stewards maintain the table schema by hand. At the end of each run, the new partitions must be added to the Data Catalog without running a crawler, and the table schema must never be overwritten by the job. The job ends with the following code.

    ```python
    sink = glueContext.getSink(
        connection_type="s3",
        path="s3://example-analytics/events/",
        ARGUMENTS)
    sink.setFormat("json")
    sink.setCatalogInfo(catalogDatabase="analytics", catalogTableName="events")
    sink.writeFrame(events_dyf)
    ```

    Which arguments should replace ARGUMENTS in the code?
  fr: |
    Une tâche ETL AWS Glue écrit une sortie JSON dans Amazon S3, partitionnée par region, year, month et day. La table cible events existe déjà dans la base de données analytics du Data Catalog, avec les mêmes clés de partition dans le même ordre. Des responsables des données maintiennent manuellement le schéma de la table. À la fin de chaque exécution, les nouvelles partitions doivent être ajoutées au Data Catalog sans exécuter de robot d'analyse (crawler), et le schéma de la table ne doit jamais être écrasé par la tâche. La tâche se termine par le code suivant.

    ```python
    sink = glueContext.getSink(
        connection_type="s3",
        path="s3://example-analytics/events/",
        ARGUMENTS)
    sink.setFormat("json")
    sink.setCatalogInfo(catalogDatabase="analytics", catalogTableName="events")
    sink.writeFrame(events_dyf)
    ```

    Quels arguments doivent remplacer ARGUMENTS dans le code ?
body:
  options:
    - { id: a, text: "enableUpdateCatalog=True, updateBehavior=\"LOG\", partitionKeys=[\"region\", \"year\", \"month\", \"day\"]" }
    - { id: b, text: "enableUpdateCatalog=False, updateBehavior=\"UPDATE_IN_DATABASE\", partitionKeys=[\"region\", \"year\", \"month\", \"day\"]" }
    - { id: c, text: "enableUpdateCatalog=True, partitionKeys=[\"region\", \"year\", \"month\", \"day\"]" }
    - { id: d, text: "enableUpdateCatalog=True, updateBehavior=\"LOG\"" }
answer: { optionId: a }
explanation:
  correct:
    en: "enableUpdateCatalog=True makes the job update the Data Catalog, and partitionKeys, which must match the table's keys in the same order, tells it which partitions to add. updateBehavior=\"LOG\" prevents the table schema from being overwritten while new partitions are still added."
    fr: "enableUpdateCatalog=True fait mettre à jour le Data Catalog par la tâche, et partitionKeys, qui doit correspondre aux clés de la table dans le même ordre, indique les partitions à ajouter. updateBehavior=\"LOG\" empêche l'écrasement du schéma de la table tout en continuant d'ajouter les nouvelles partitions."
  options:
    b:
      en: "When enableUpdateCatalog is not true, the job does not update the Data Catalog at all, whatever updateBehavior is set to."
      fr: "Lorsque enableUpdateCatalog n'est pas à true, la tâche ne met pas du tout à jour le Data Catalog, quelle que soit la valeur d'updateBehavior."
    c:
      en: "Without updateBehavior, the default UPDATE_IN_DATABASE overwrites the table schema during the run."
      fr: "Sans updateBehavior, la valeur par défaut UPDATE_IN_DATABASE écrase le schéma de la table pendant l'exécution."
    d:
      en: "Without partitionKeys, the output is not partitioned and no partitions are added to the partitioned table."
      fr: "Sans partitionKeys, la sortie n'est pas partitionnée et aucune partition n'est ajoutée à la table partitionnée."
references:
  - title: Updating the schema, and adding new partitions in the Data Catalog using AWS Glue ETL jobs
    url: https://docs.aws.amazon.com/glue/latest/dg/update-from-job.html
