id: deac01-2c-del-truncate-staging
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every hour, an ELT process loads data into a staging table in Amazon Redshift, merges it into a target table, and then removes all rows from the staging table. The current DELETE FROM staging statement is slow and leaves deleted rows that must be vacuumed. The data engineer needs the fastest way to empty the staging table that does not require a vacuum.

    Which solution will meet these requirements?
  fr: |
    Chaque heure, un processus ELT charge des données dans une table intermédiaire Amazon Redshift, les fusionne dans une table cible, puis retire toutes les lignes de la table intermédiaire. L'instruction actuelle DELETE FROM staging est lente et laisse des lignes supprimées qui doivent être nettoyées par un vacuum. L'ingénieur des données a besoin du moyen le plus rapide de vider la table intermédiaire sans exiger de vacuum.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run DELETE FROM staging, followed by VACUUM DELETE ONLY on the staging table.", fr: "Exécuter DELETE FROM staging, suivi de VACUUM DELETE ONLY sur la table intermédiaire." }
    - id: b
      text: { en: "Run DELETE FROM staging, followed by ANALYZE on the staging table.", fr: "Exécuter DELETE FROM staging, suivi d'ANALYZE sur la table intermédiaire." }
    - id: c
      text: { en: "Run UNLOAD of the staging table to Amazon S3 with the CLEANPATH option.", fr: "Exécuter un UNLOAD de la table intermédiaire vers Amazon S3 avec l'option CLEANPATH." }
    - id: d
      text: { en: "Run TRUNCATE on the staging table after the merge transaction commits.", fr: "Exécuter TRUNCATE sur la table intermédiaire après la validation de la transaction de fusion." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      TRUNCATE deletes all rows without scanning the table, is much more efficient than DELETE, and does not require a VACUUM or ANALYZE afterward. It commits the transaction in which it runs, so it is run after the merge has committed.
    fr: |
      TRUNCATE supprime toutes les lignes sans analyser la table, est bien plus efficace que DELETE et n'exige ni VACUUM ni ANALYZE ensuite. Il valide la transaction dans laquelle il s'exécute : on l'exécute donc après la validation de la fusion.
  options:
    a: { en: "The DELETE stays slow, and the vacuum adds more work to every run instead of avoiding it.", fr: "Le DELETE reste lent, et le vacuum ajoute du travail à chaque exécution au lieu de l'éviter." }
    b: { en: "ANALYZE refreshes statistics; the deleted rows still occupy space until a vacuum runs.", fr: "ANALYZE actualise les statistiques ; les lignes supprimées occupent toujours de l'espace jusqu'à un vacuum." }
    c: { en: "CLEANPATH deletes existing files in the S3 target path; it removes no rows from the Redshift table.", fr: "CLEANPATH supprime les fichiers existants dans le chemin S3 cible ; il ne retire aucune ligne de la table Redshift." }
references:
  - title: TRUNCATE
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_TRUNCATE.html
