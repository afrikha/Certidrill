id: deac01-2b-tech-catalog-encryption-cmk
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company uses the AWS Glue Data Catalog as the technical catalog of its data lake. A new security policy requires the catalog metadata, including databases, tables and partitions, to be encrypted at rest with a key whose key policy the security team controls. The data in Amazon S3 is already encrypted with SSE-KMS.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers utilise l'AWS Glue Data Catalog comme catalogue technique de son lac de données. Une nouvelle politique de sécurité exige que les métadonnées du catalogue, y compris les bases de données, les tables et les partitions, soient chiffrées au repos avec une clé dont l'équipe de sécurité contrôle la politique de clé. Les données dans Amazon S3 sont déjà chiffrées avec SSE-KMS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable Data Catalog encryption at rest with the AWS managed key aws/glue, and audit its use in AWS CloudTrail.", fr: "Activer le chiffrement au repos du Data Catalog avec la clé gérée par AWS aws/glue, et auditer son utilisation dans AWS CloudTrail." } }
    - { id: b, text: { en: "Enable Data Catalog encryption at rest with an asymmetric customer managed key, and give the analytics roles kms:Decrypt on it.", fr: "Activer le chiffrement au repos du Data Catalog avec une clé asymétrique gérée par le client, et accorder kms:Decrypt sur celle-ci aux rôles d'analyse." } }
    - { id: c, text: { en: "Enable Data Catalog encryption at rest with a symmetric customer managed key, and give the catalog users the required KMS permissions.", fr: "Activer le chiffrement au repos du Data Catalog avec une clé symétrique gérée par le client, et accorder aux utilisateurs du catalogue les autorisations KMS nécessaires." } }
    - { id: d, text: { en: "Change the default encryption of the data bucket to SSE-KMS with a customer managed key so that table metadata inherits it.", fr: "Modifier le chiffrement par défaut du compartiment des données en SSE-KMS avec une clé gérée par le client afin que les métadonnées des tables en héritent." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Data Catalog encryption at rest protects databases, tables, partitions, table versions and other catalog objects with a KMS key. Only a customer managed key lets the security team control the key policy, and AWS Glue supports only symmetric customer managed keys; principals that use the catalog need permissions such as kms:Decrypt, kms:Encrypt and kms:GenerateDataKey on it."
    fr: "Le chiffrement au repos du Data Catalog protège les bases de données, les tables, les partitions, les versions de tables et d'autres objets du catalogue avec une clé KMS. Seule une clé gérée par le client permet à l'équipe de sécurité de contrôler la politique de clé, et AWS Glue ne prend en charge que les clés symétriques gérées par le client ; les principaux qui utilisent le catalogue ont besoin d'autorisations telles que kms:Decrypt, kms:Encrypt et kms:GenerateDataKey sur celle-ci."
  options:
    a:
      en: "The permissions of the AWS managed key aws/glue cannot be changed, so the security team does not control its key policy."
      fr: "Les autorisations de la clé gérée par AWS aws/glue ne peuvent pas être modifiées : l'équipe de sécurité ne contrôle pas sa politique de clé."
    b:
      en: "AWS Glue supports only symmetric customer managed keys for Data Catalog encryption."
      fr: "AWS Glue ne prend en charge que les clés symétriques gérées par le client pour le chiffrement du Data Catalog."
    d:
      en: "Bucket encryption applies to the S3 objects only; the Data Catalog metadata is stored and encrypted separately by AWS Glue."
      fr: "Le chiffrement du compartiment s'applique uniquement aux objets S3 ; les métadonnées du Data Catalog sont stockées et chiffrées séparément par AWS Glue."
references:
  - title: Encrypting your Data Catalog
    url: https://docs.aws.amazon.com/glue/latest/dg/encrypt-glue-data-catalog.html
