id: deac01-2d-columnar-compaction
objective: "2.4.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A travel company stores booking data in Amazon S3 as gzip-compressed JSON files of about 100 KB each, with thousands of files in every daily partition. Amazon Athena queries usually select 4 of the 80 fields. The company wants to reduce both the query run time and the amount of data scanned.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de voyages stocke des données de réservation dans Amazon S3 sous forme de fichiers JSON compressés avec gzip d'environ 100 Ko chacun, avec des milliers de fichiers dans chaque partition journalière. Les requêtes Amazon Athena sélectionnent généralement 4 des 80 champs. L'entreprise veut réduire à la fois la durée des requêtes et la quantité de données analysées.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the JSON files uncompressed so that Athena does not spend time decompressing them.", fr: "Stocker les fichiers JSON sans compression afin qu'Athena ne passe pas de temps à les décompresser." } }
    - { id: b, text: { en: "Convert the data to compressed Apache Parquet files.", fr: "Convertir les données en fichiers Apache Parquet compressés." } }
    - { id: c, text: { en: "Spread the files of each partition across nested subfolders by hour.", fr: "Répartir les fichiers de chaque partition dans des sous-dossiers imbriqués par heure." } }
    - { id: d, text: { en: "Set a per-query data usage control limit on the Athena workgroup.", fr: "Définir une limite de contrôle d'utilisation des données par requête sur le groupe de travail Athena." } }
    - { id: e, text: { en: "Combine the small files of each partition into fewer, larger files.", fr: "Regrouper les petits fichiers de chaque partition en fichiers moins nombreux et plus volumineux." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Parquet is columnar, so Athena reads only the selected columns and can skip data with the stored min/max statistics, and compression lowers the bytes scanned further. Each small file adds listing and request overhead, so merging them, for example with an AWS Glue ETL job, shortens query run time."
    fr: "Parquet est un format en colonnes : Athena ne lit que les colonnes sélectionnées et peut ignorer des données grâce aux statistiques min/max stockées, et la compression réduit encore les octets analysés. Chaque petit fichier ajoute une charge de listage et de requêtes : les regrouper, par exemple avec une tâche ETL AWS Glue, raccourcit la durée des requêtes."
  options:
    a:
      en: "Athena bills the bytes scanned before decompression, so uncompressed files increase both cost and read time."
      fr: "Athena facture les octets analysés avant décompression : des fichiers non compressés augmentent à la fois le coût et le temps de lecture."
    c:
      en: "Nested directories inside a partition add extra rounds of recursive listing and slow queries down."
      fr: "Des répertoires imbriqués dans une partition ajoutent des cycles de listage récursif et ralentissent les requêtes."
    d:
      en: "A data usage limit cancels queries that exceed a threshold; it does not make queries scan less or run faster."
      fr: "Une limite d'utilisation des données annule les requêtes qui dépassent un seuil ; elle ne réduit pas les données analysées et n'accélère pas les requêtes."
references:
  - title: Optimize data
    url: https://docs.aws.amazon.com/athena/latest/ug/performance-tuning-data-optimization-techniques.html
