id: deac01-2d-kb-hierarchical-chunking
objective: "2.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An industrial equipment company is building an Amazon Bedrock knowledge base from long maintenance manuals stored in Amazon S3. User questions usually target one specific procedure step, so retrieval must match small, precise passages. The answers must still include the surrounding section of the manual so that the model has enough context.

    Which chunking strategy should the company configure for the data source?
  fr: |
    Une entreprise d'équipements industriels crée une base de connaissances Amazon Bedrock à partir de longs manuels de maintenance stockés dans Amazon S3. Les questions des utilisateurs visent généralement une étape précise d'une procédure : la récupération doit donc correspondre à de petits passages précis. Les réponses doivent toutefois inclure la section environnante du manuel afin que le modèle dispose d'assez de contexte.

    Quelle stratégie de découpage en segments (chunking) l'entreprise doit-elle configurer pour la source de données ?
body:
  options:
    - { id: a, text: { en: "Hierarchical chunking with a small child chunk size and a larger parent chunk size", fr: "Un découpage hiérarchique avec une petite taille de segment enfant et une taille de segment parent plus grande" } }
    - { id: b, text: { en: "Fixed-size chunking with small chunks and no overlap between consecutive chunks", fr: "Un découpage de taille fixe avec de petits segments et aucun chevauchement entre segments consécutifs" } }
    - { id: c, text: { en: "No chunking, so that each manual is stored as a single chunk", fr: "Aucun découpage, afin que chaque manuel soit stocké comme un seul segment" } }
    - { id: d, text: { en: "Default chunking, which splits content into chunks of about 300 tokens", fr: "Le découpage par défaut, qui divise le contenu en segments d'environ 300 jetons" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Hierarchical chunking creates small child chunks inside larger parent chunks. Retrieval matches the precise child chunks, then replaces them with their parent chunks, so the model receives the broader section as context."
    fr: "Le découpage hiérarchique crée de petits segments enfants à l'intérieur de segments parents plus grands. La récupération établit la correspondance avec les segments enfants précis, puis les remplace par leurs segments parents : le modèle reçoit la section plus large comme contexte."
  options:
    b:
      en: "Small fixed-size chunks give precise matches but return only the small passage, without the surrounding section."
      fr: "De petits segments de taille fixe donnent des correspondances précises, mais ne renvoient que le petit passage, sans la section environnante."
    c:
      en: "One chunk per manual gives broad context but cannot match a specific step precisely, and page numbers are not available in citations."
      fr: "Un segment par manuel donne un contexte large, mais ne peut pas correspondre précisément à une étape, et les numéros de page ne sont pas disponibles dans les citations."
    d:
      en: "Default chunking produces one level of medium-sized chunks and returns the matched chunk only, not its larger section."
      fr: "Le découpage par défaut produit un seul niveau de segments de taille moyenne et ne renvoie que le segment trouvé, pas sa section plus large."
references:
  - title: How content chunking works for knowledge bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
