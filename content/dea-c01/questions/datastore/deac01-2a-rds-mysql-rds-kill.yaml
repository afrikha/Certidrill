id: deac01-2a-rds-mysql-rds-kill
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    On an Amazon RDS for MySQL DB instance, a forgotten session holds an open transaction whose row locks block the nightly ETL loads. The database administrator identified the session's thread ID as 4821. The administrator must end the whole session so that its transaction is rolled back and its locks are released, without affecting other sessions.

    What should the administrator run?
  fr: |
    Sur une instance de base de données Amazon RDS for MySQL, une session oubliée détient une transaction ouverte dont les verrous de ligne bloquent les chargements ETL nocturnes. L'administrateur de bases de données a identifié l'ID de thread de la session : 4821. Il doit mettre fin à toute la session pour que sa transaction soit annulée et ses verrous libérés, sans affecter les autres sessions.

    Que doit exécuter l'administrateur ?
body:
  options:
    - { id: a, text: "CALL mysql.rds_kill(4821);" }
    - { id: b, text: "CALL mysql.rds_kill_query(4821);" }
    - { id: c, text: { en: "A reboot of the DB instance from the RDS console", fr: "Un redémarrage de l'instance de base de données depuis la console RDS" } }
    - { id: d, text: { en: "A change of innodb_lock_wait_timeout to 1 in the DB parameter group", fr: "Une modification d'innodb_lock_wait_timeout à 1 dans le groupe de paramètres de base de données" } }
answer: { optionId: a }
explanation:
  correct:
    en: "On RDS for MySQL, sessions and queries are ended with the stored procedures mysql.rds_kill and mysql.rds_kill_query. mysql.rds_kill ends the session on the given thread, which rolls back its open transaction and releases its locks."
    fr: "Sur RDS for MySQL, on met fin aux sessions et aux requêtes avec les procédures stockées mysql.rds_kill et mysql.rds_kill_query. mysql.rds_kill met fin à la session du thread indiqué, ce qui annule sa transaction ouverte et libère ses verrous."
  options:
    b:
      en: "rds_kill_query ends only the query running on the thread; the session and its open transaction, with its locks, remain."
      fr: "rds_kill_query ne met fin qu'à la requête en cours sur le thread ; la session et sa transaction ouverte, avec ses verrous, demeurent."
    c:
      en: "A reboot ends every session on the instance, not only the one that holds the locks."
      fr: "Un redémarrage met fin à toutes les sessions de l'instance, pas seulement à celle qui détient les verrous."
    d:
      en: "This timeout makes waiting statements fail sooner; it does not end the session that holds the locks."
      fr: "Ce délai fait échouer plus tôt les instructions en attente ; il ne met pas fin à la session qui détient les verrous."
references:
  - title: Ending a session or query for RDS for MySQL
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Appendix.MySQL.CommonDBATasks.End.html
