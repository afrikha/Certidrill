id: deac01-2d-catalog-import-lineage
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company uses Amazon SageMaker Unified Studio. Data sources in a project publish AWS Glue Data Catalog tables and Amazon Redshift tables to Amazon SageMaker Catalog. Data stewards want the lineage of these assets to be captured automatically, including lineage derived from the queries that run in Redshift.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de distribution utilise Amazon SageMaker Unified Studio. Des sources de données d'un projet publient des tables du AWS Glue Data Catalog et des tables Amazon Redshift dans Amazon SageMaker Catalog. Les responsables des données veulent que le lignage de ces ressources soit capturé automatiquement, y compris le lignage déduit des requêtes exécutées dans Redshift.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Log CloudTrail data events for the tables, and build a lineage graph from them in Amazon Neptune.", fr: "Journaliser les événements de données CloudTrail des tables, puis construire un graphe de lignage à partir de ceux-ci dans Amazon Neptune." } }
    - { id: b, text: { en: "Select the Import data lineage option on the Glue and Redshift data sources of the project.", fr: "Sélectionner l'option Import data lineage sur les sources de données Glue et Redshift du projet." } }
    - { id: c, text: { en: "Create SageMaker ML Lineage Tracking artifacts for the tables, and query them with QueryLineage.", fr: "Créer des artefacts SageMaker ML Lineage Tracking pour les tables, puis les interroger avec QueryLineage." } }
    - { id: d, text: { en: "Enable Redshift audit logging, and parse the user activity logs with Amazon Athena to map table dependencies.", fr: "Activer la journalisation d'audit Redshift, puis analyser les journaux d'activité des utilisateurs avec Amazon Athena pour cartographier les dépendances entre tables." } }
answer: { optionId: b }
explanation:
  correct:
    en: "SageMaker Catalog captures lineage automatically from data connections once Import data lineage is selected on the data source. For Glue sources, lineage is extracted during data source runs; for Redshift sources, a scheduled lineage run reads Redshift system tables and derives lineage from the executed queries."
    fr: "SageMaker Catalog capture automatiquement le lignage depuis les connexions de données dès que l'option Import data lineage est sélectionnée sur la source de données. Pour les sources Glue, le lignage est extrait pendant les exécutions de la source de données ; pour les sources Redshift, une exécution de lignage planifiée lit les tables système Redshift et déduit le lignage des requêtes exécutées."
  options:
    a:
      en: "A custom graph built from CloudTrail events is a separate system to develop and run, and it does not appear in SageMaker Catalog."
      fr: "Un graphe personnalisé construit à partir des événements CloudTrail est un système distinct à développer et à exploiter, et il n'apparaît pas dans SageMaker Catalog."
    c:
      en: "ML Lineage Tracking records machine learning workflow entities in SageMaker AI; it does not capture lineage of catalog assets from Redshift queries."
      fr: "ML Lineage Tracking enregistre les entités de flux de travail de machine learning dans SageMaker AI ; il ne capture pas le lignage des ressources du catalogue à partir des requêtes Redshift."
    d:
      en: "Parsing audit logs means building and maintaining custom lineage logic, which fails the LEAST operational overhead requirement."
      fr: "Analyser les journaux d'audit revient à créer et maintenir une logique de lignage personnalisée, ce qui ne respecte pas l'exigence du MOINS de charge opérationnelle."
references:
  - title: Automate lineage capture from data connections
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/datazone-data-lineage-automate-capture-from-data-connections.html
