id: deac01-2c-ver-enable-recover
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AWS Glue ETL jobs write curated files to an Amazon S3 bucket. Last month, a faulty job overwrote and deleted files, and the previous content could not be recovered. The company must be able to recover any earlier state of an object after a future overwrite or delete, without changing the jobs. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Des tâches ETL AWS Glue écrivent des fichiers préparés dans un compartiment Amazon S3. Le mois dernier, une tâche défectueuse a écrasé et supprimé des fichiers, et le contenu précédent n'a pas pu être récupéré. L'entreprise doit pouvoir récupérer n'importe quel état antérieur d'un objet après un futur écrasement ou une future suppression, sans modifier les tâches. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure S3 Replication from the bucket to a backup bucket in another AWS Region.", fr: "Configurer S3 Replication du compartiment vers un compartiment de sauvegarde dans une autre Région AWS." }
    - id: b
      text: { en: "Create an AWS Backup plan that takes a backup of the bucket once a day and keeps it for 35 days.", fr: "Créer un plan AWS Backup qui sauvegarde le compartiment une fois par jour et conserve la sauvegarde 35 jours." }
    - id: c
      text: { en: "Enable S3 Versioning on the bucket so that overwrites and deletes keep the previous versions.", fr: "Activer S3 Versioning sur le compartiment afin que les écrasements et les suppressions conservent les versions précédentes." }
    - id: d
      text: { en: "Configure a daily S3 Inventory report for the bucket that lists every object and its metadata.", fr: "Configurer un rapport S3 Inventory quotidien pour le compartiment qui liste chaque objet et ses métadonnées." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With versioning enabled, an overwrite stores a new version and a simple delete inserts a delete marker, so every earlier version stays in the bucket and can be restored. It is a bucket setting, so the Glue jobs do not change.
    fr: |
      Avec la gestion des versions activée, un écrasement stocke une nouvelle version et une suppression simple insère un marqueur de suppression : chaque version antérieure reste dans le compartiment et peut être restaurée. C'est un paramètre du compartiment : les tâches Glue ne changent pas.
  options:
    a: { en: "Replication requires versioning on both buckets anyway, and it copies the faulty overwrites to the destination as well.", fr: "La réplication exige de toute façon la gestion des versions sur les deux compartiments, et elle copie aussi les écrasements défectueux vers la destination." }
    b: { en: "A daily backup can restore only the state of the last backup; changes made between two backups would be lost.", fr: "Une sauvegarde quotidienne ne peut restaurer que l'état de la dernière sauvegarde ; les changements faits entre deux sauvegardes seraient perdus." }
    d: { en: "An inventory report lists objects but keeps no copy of their content, so nothing can be recovered from it.", fr: "Un rapport d'inventaire liste les objets, mais ne conserve aucune copie de leur contenu : rien ne peut être récupéré à partir de celui-ci." }
references:
  - title: Retaining multiple versions of objects with S3 Versioning
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html
