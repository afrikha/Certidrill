id: deac01-2d-sct-teradata-redshift
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank is moving its on-premises Teradata data warehouse to Amazon Redshift. The data engineering team must convert the Teradata schemas to Redshift and extract the historical data from the on-premises warehouse so that it can be loaded into Redshift.

    Which solution will meet these requirements?
  fr: |
    Une banque déplace son entrepôt de données Teradata sur site vers Amazon Redshift. L'équipe d'ingénierie des données doit convertir les schémas Teradata pour Redshift et extraire les données historiques de l'entrepôt sur site afin de pouvoir les charger dans Redshift.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS DMS Schema Conversion migration project with Teradata as the source data provider and Redshift as the target.", fr: "Créer un projet de migration AWS DMS Schema Conversion avec Teradata comme fournisseur de données source et Redshift comme cible." } }
    - { id: b, text: { en: "Use the AWS Schema Conversion Tool to convert the schemas, and use AWS SCT data extraction agents to extract the data.", fr: "Utiliser AWS Schema Conversion Tool pour convertir les schémas, et des agents d'extraction de données AWS SCT pour extraire les données." } }
    - { id: c, text: { en: "Create a Redshift federated query connection to Teradata, and copy each table with CREATE TABLE AS SELECT.", fr: "Créer une connexion de requête fédérée Redshift vers Teradata, puis copier chaque table avec CREATE TABLE AS SELECT." } }
    - { id: d, text: { en: "Use AWS DMS homogeneous data migrations, which rely on native database tools to copy the schemas and data.", fr: "Utiliser les migrations de données homogènes AWS DMS, qui s'appuient sur les outils de base de données natifs pour copier les schémas et les données." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS SCT converts data warehouse schemas from sources such as Teradata, Netezza, Greenplum, Vertica and Snowflake to Amazon Redshift. Its data extraction agents pull data from the on-premises warehouse to prepare it for loading into Redshift."
    fr: "AWS SCT convertit des schémas d'entrepôt de données depuis des sources comme Teradata, Netezza, Greenplum, Vertica et Snowflake vers Amazon Redshift. Ses agents d'extraction de données récupèrent les données de l'entrepôt sur site pour préparer leur chargement dans Redshift."
  options:
    a:
      en: "DMS Schema Conversion supports Oracle as its only source for an Amazon Redshift target; Teradata is not a supported source."
      fr: "DMS Schema Conversion ne prend en charge qu'Oracle comme source pour une cible Amazon Redshift ; Teradata n'est pas une source prise en charge."
    c:
      en: "Redshift federated queries reach Amazon RDS and Aurora PostgreSQL or MySQL databases, not a Teradata warehouse, and they do not convert schemas."
      fr: "Les requêtes fédérées Redshift accèdent à des bases Amazon RDS et Aurora PostgreSQL ou MySQL, pas à un entrepôt Teradata, et elles ne convertissent pas les schémas."
    d:
      en: "Homogeneous migrations move data between databases of the same engine; Teradata to Redshift is a heterogeneous migration."
      fr: "Les migrations homogènes déplacent des données entre bases du même moteur ; Teradata vers Redshift est une migration hétérogène."
references:
  - title: What is the AWS Schema Conversion Tool?
    url: https://docs.aws.amazon.com/SchemaConversionTool/latest/userguide/CHAP_Welcome.html
  - title: Converting database schemas using DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html
