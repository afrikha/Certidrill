id: deac01-2b-vec-hnsw-overwrites-reindex
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A recommendation service stores 30 million item embeddings in an HNSW vector index on an Amazon MemoryDB cluster. Every night, a batch job overwrites the embeddings of about 20 % of the items. Over several weeks, the memory used by the index has grown and the recall ratio has dropped. Queries must keep their current low latency.

    Which solution will meet these requirements?
  fr: |
    Un service de recommandation stocke 30 millions de vectorisations d'articles dans un index vectoriel HNSW d'un cluster Amazon MemoryDB. Chaque nuit, une tâche par lots remplace les vectorisations d'environ 20 % des articles. En quelques semaines, la mémoire utilisée par l'index a augmenté et le taux de rappel a baissé. Les requêtes doivent conserver leur faible latence actuelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Override EF_RUNTIME with a higher value in each KNN query.", fr: "Remplacer EF_RUNTIME par une valeur plus élevée dans chaque requête KNN." } }
    - { id: b, text: { en: "Set a higher INITIAL_CAP value on the existing index.", fr: "Définir une valeur INITIAL_CAP plus élevée sur l'index existant." } }
    - { id: c, text: { en: "Reindex the embeddings into a new HNSW index, and switch the queries to it.", fr: "Réindexer les vectorisations dans un nouvel index HNSW, puis basculer les requêtes vers celui-ci." } }
    - { id: d, text: { en: "Replace the HNSW index with a FLAT index on the same embeddings.", fr: "Remplacer l'index HNSW par un index FLAT sur les mêmes vectorisations." } }
answer: { optionId: c }
explanation:
  correct:
    en: "HNSW may not handle the deletion or overwriting of previously inserted vectors efficiently, which leads to excess index memory and degraded recall. Reindexing restores optimal memory usage and recall while keeping the low latency of an HNSW index."
    fr: "HNSW peut ne pas gérer efficacement la suppression ou le remplacement de vecteurs déjà insérés, ce qui entraîne une consommation mémoire excessive de l'index et une dégradation du rappel. La réindexation rétablit une utilisation optimale de la mémoire et du rappel tout en conservant la faible latence d'un index HNSW."
  options:
    a:
      en: "A higher EF_RUNTIME can raise recall, but it increases query latency and does not release the excess memory of the index."
      fr: "Une valeur EF_RUNTIME plus élevée peut augmenter le rappel, mais elle accroît la latence des requêtes et ne libère pas la mémoire excédentaire de l'index."
    b:
      en: "INITIAL_CAP pre-allocates memory to speed up ingestion; it fixes neither the memory growth nor the recall loss."
      fr: "INITIAL_CAP préalloue de la mémoire pour accélérer l'ingestion ; il ne corrige ni la croissance de la mémoire ni la perte de rappel."
    d:
      en: "FLAT gives exact answers, but its linear scan over 30 million vectors makes query run times very high."
      fr: "FLAT donne des réponses exactes, mais son parcours linéaire de 30 millions de vecteurs rend les durées d'exécution des requêtes très élevées."
references:
  - title: Vector search overview
    url: https://docs.aws.amazon.com/memorydb/latest/devguide/vector-search-overview.html
