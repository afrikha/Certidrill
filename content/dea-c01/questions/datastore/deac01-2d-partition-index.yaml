id: deac01-2d-partition-index
objective: "2.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A marketplace company has an AWS Glue Data Catalog table with about 400,000 partitions, partitioned by country, category, year, month and day. Every Amazon Athena query filters on country and category with equality predicates, and some also filter on year. Query planning takes most of the run time because Athena loads a large number of partitions. The company must keep the partitions in the Data Catalog.

    Which solution will reduce the planning time?
  fr: |
    Une entreprise de place de marché possède une table du AWS Glue Data Catalog d'environ 400 000 partitions, partitionnée par country, category, year, month et day. Toutes les requêtes Amazon Athena filtrent sur country et category avec des prédicats d'égalité, et certaines filtrent aussi sur year. La planification des requêtes occupe l'essentiel de la durée d'exécution car Athena charge un grand nombre de partitions. L'entreprise doit conserver les partitions dans le Data Catalog.

    Quelle solution réduira la durée de planification ?
body:
  options:
    - { id: a, text: { en: "Create a partition index on (year, month, day), and set the partition_filtering.enabled table property to true.", fr: "Créer un index de partition sur (year, month, day), et définir la propriété de table partition_filtering.enabled sur true." } }
    - { id: b, text: { en: "Run MSCK REPAIR TABLE on the table before each batch of queries.", fr: "Exécuter MSCK REPAIR TABLE sur la table avant chaque lot de requêtes." } }
    - { id: c, text: { en: "Create a partition index on (country, category, year), and set the partition_filtering.enabled table property to true.", fr: "Créer un index de partition sur (country, category, year), et définir la propriété de table partition_filtering.enabled sur true." } }
    - { id: d, text: { en: "Create a partition index on (country, category, year), and leave the table properties unchanged.", fr: "Créer un index de partition sur (country, category, year), et laisser les propriétés de la table inchangées." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A Glue partition index lets GetPartitions fetch only the matching subset instead of loading all partitions, but the first key of the index must appear in the filter for the index to be used. Athena uses the index only after partition_filtering.enabled is set to true on the table."
    fr: "Un index de partition Glue permet à GetPartitions de ne récupérer que le sous-ensemble correspondant au lieu de charger toutes les partitions, mais la première clé de l'index doit figurer dans le filtre pour que l'index soit utilisé. Athena n'utilise l'index qu'une fois partition_filtering.enabled défini sur true sur la table."
  options:
    a:
      en: "Queries do not always filter on year, the first key of this index, so the index cannot be used for them and all partitions are loaded."
      fr: "Les requêtes ne filtrent pas toujours sur year, la première clé de cet index : l'index ne peut pas servir pour elles et toutes les partitions sont chargées."
    b:
      en: "MSCK REPAIR TABLE adds partitions found in Amazon S3 to the catalog; it does not speed up partition lookup."
      fr: "MSCK REPAIR TABLE ajoute au catalogue les partitions trouvées dans Amazon S3 ; il n'accélère pas la recherche des partitions."
    d:
      en: "Redshift Spectrum and Amazon EMR use an active index automatically, but Athena requires the partition_filtering.enabled property."
      fr: "Redshift Spectrum et Amazon EMR utilisent automatiquement un index actif, mais Athena exige la propriété partition_filtering.enabled."
references:
  - title: Creating partition indexes
    url: https://docs.aws.amazon.com/glue/latest/dg/partition-indexes.html
