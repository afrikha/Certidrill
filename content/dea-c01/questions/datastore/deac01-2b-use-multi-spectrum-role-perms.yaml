id: deac01-2b-use-multi-spectrum-role-perms
objective: "2.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A data engineer creates an external schema in an Amazon Redshift cluster with CREATE EXTERNAL SCHEMA ... FROM DATA CATALOG and an IAM role that is attached to the cluster. The role allows s3:GetObject and s3:ListBucket on the data bucket. The AWS Glue Data Catalog of the account is encrypted at rest with a customer managed AWS KMS key. Queries on the external tables fail with access errors. AWS Lake Formation is not used.

    Which additional permissions must the role have? (Choose two.)
  fr: |
    Un ingénieur de données crée un schéma externe dans un cluster Amazon Redshift avec CREATE EXTERNAL SCHEMA ... FROM DATA CATALOG et un rôle IAM associé au cluster. Le rôle autorise s3:GetObject et s3:ListBucket sur le compartiment des données. L'AWS Glue Data Catalog du compte est chiffré au repos avec une clé AWS KMS gérée par le client. Les requêtes sur les tables externes échouent avec des erreurs d'accès. AWS Lake Formation n'est pas utilisé.

    De quelles autorisations supplémentaires le rôle a-t-il besoin ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "AWS Glue actions such as glue:GetDatabase, glue:GetTable and glue:GetPartitions on the Data Catalog", fr: "Des actions AWS Glue telles que glue:GetDatabase, glue:GetTable et glue:GetPartitions sur le Data Catalog" } }
    - { id: b, text: { en: "s3:PutObject and s3:DeleteObject on the data bucket", fr: "s3:PutObject et s3:DeleteObject sur le compartiment des données" } }
    - { id: c, text: { en: "Permissions to use the KMS key that encrypts the Data Catalog", fr: "Des autorisations d'utilisation de la clé KMS qui chiffre le Data Catalog" } }
    - { id: d, text: { en: "redshift:GetClusterCredentials on the cluster", fr: "redshift:GetClusterCredentials sur le cluster" } }
    - { id: e, text: { en: "glue:StartCrawler on the crawler that created the tables", fr: "glue:StartCrawler sur le robot d'analyse qui a créé les tables" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Redshift Spectrum reads table and partition definitions from the Data Catalog with the role, so the role needs Glue read actions such as GetDatabase, GetTable and GetPartitions. Because the catalog is encrypted, the role also needs to use the KMS key that AWS Glue uses to protect the catalog."
    fr: "Redshift Spectrum lit les définitions de tables et de partitions dans le Data Catalog avec le rôle : celui-ci a besoin d'actions Glue de lecture telles que GetDatabase, GetTable et GetPartitions. Comme le catalogue est chiffré, le rôle doit aussi pouvoir utiliser la clé KMS avec laquelle AWS Glue protège le catalogue."
  options:
    b:
      en: "Spectrum queries only read the S3 objects; write and delete permissions are not needed."
      fr: "Les requêtes Spectrum ne font que lire les objets S3 ; les autorisations d'écriture et de suppression ne sont pas nécessaires."
    d:
      en: "GetClusterCredentials issues temporary database credentials to users; Spectrum does not use it to read external data."
      fr: "GetClusterCredentials délivre des informations d'identification de base de données temporaires aux utilisateurs ; Spectrum ne l'utilise pas pour lire les données externes."
    e:
      en: "Queries read the existing catalog; running a crawler is not part of querying external tables."
      fr: "Les requêtes lisent le catalogue existant ; exécuter un robot d'analyse ne fait pas partie de l'interrogation des tables externes."
references:
  - title: IAM policies for Amazon Redshift Spectrum
    url: https://docs.aws.amazon.com/redshift/latest/dg/c-spectrum-iam-policies.html
