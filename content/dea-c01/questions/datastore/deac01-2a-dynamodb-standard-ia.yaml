id: deac01-2a-dynamodb-standard-ia
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company keeps 5 years of order history in an Amazon DynamoDB table that uses on-demand capacity. The table holds 40 TB, and most items are rarely read after their first month, but the application must still be able to read any order through the same table and API. A cost analysis shows that storage is most of the table's bill.

    Which solution will reduce the cost of the table without changing the application code?
  fr: |
    Une entreprise de commerce en ligne conserve 5 ans d'historique de commandes dans une table Amazon DynamoDB en capacité à la demande. La table contient 40 To, et la plupart des éléments sont rarement lus après leur premier mois, mais l'application doit toujours pouvoir lire n'importe quelle commande via la même table et la même API. Une analyse des coûts montre que le stockage représente la majeure partie de la facture de la table.

    Quelle solution réduit le coût de la table sans modifier le code de l'application ?
body:
  options:
    - { id: a, text: { en: "Switch the table to provisioned capacity mode with auto scaling for reads and writes.", fr: "Passer la table en mode de capacité provisionnée avec Auto Scaling pour les lectures et les écritures." } }
    - { id: b, text: { en: "Enable Time to Live (TTL) so that DynamoDB deletes orders that are older than one year.", fr: "Activer la durée de vie (TTL) pour que DynamoDB supprime les commandes de plus d'un an." } }
    - { id: c, text: { en: "Export the old orders to Amazon S3 and query them with Amazon Athena when they are needed.", fr: "Exporter les anciennes commandes dans Amazon S3 et les interroger avec Amazon Athena si nécessaire." } }
    - { id: d, text: { en: "Change the table class of the table from DynamoDB Standard to DynamoDB Standard-IA.", fr: "Changer la classe de table de DynamoDB Standard à DynamoDB Standard-IA." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The DynamoDB Standard-IA table class is designed for tables where storage is the dominant cost, such as order history. It has lower storage pricing and higher request pricing, and changing the class keeps the same table and API, so the application is unchanged."
    fr: "La classe de table DynamoDB Standard-IA est conçue pour les tables dont le stockage est le coût principal, comme un historique de commandes. Son stockage est moins cher et ses requêtes plus chères, et le changement de classe conserve la même table et la même API : l'application ne change pas."
  options:
    a:
      en: "The capacity mode changes how reads and writes are billed; the storage that dominates the bill is unchanged."
      fr: "Le mode de capacité change la facturation des lectures et des écritures ; le stockage, qui domine la facture, est inchangé."
    b:
      en: "TTL deletes the old orders, but the application must still be able to read any order."
      fr: "La TTL supprime les anciennes commandes, alors que l'application doit toujours pouvoir lire n'importe quelle commande."
    c:
      en: "Orders moved to S3 are no longer readable through the same table and API, so the application code would have to change."
      fr: "Les commandes déplacées dans S3 ne sont plus lisibles via la même table et la même API : le code de l'application devrait changer."
references:
  - title: DynamoDB table classes
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.TableClasses.html
