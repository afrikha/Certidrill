id: deac01-2b-biz-subscription-lf-grantable
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A producer project in Amazon SageMaker Unified Studio published an AWS Glue table that is managed by AWS Lake Formation. A consumer project requested a subscription, and a member of the producer project approved it. The subscription stays unfulfilled, and the consumer project cannot query the table. AWS Lake Formation tag-based access control is not used.

    What should the data engineer do so that approved subscriptions are fulfilled automatically?
  fr: |
    Un projet producteur dans Amazon SageMaker Unified Studio a publié une table AWS Glue gérée par AWS Lake Formation. Un projet consommateur a demandé un abonnement, et un membre du projet producteur l'a approuvé. L'abonnement n'est pas exécuté et le projet consommateur ne peut pas interroger la table. Le contrôle d'accès basé sur les LF-tags d'AWS Lake Formation (LF-TBAC) n'est pas utilisé.

    Que doit faire l'ingénieur de données pour que les abonnements approuvés soient exécutés automatiquement ?
body:
  options:
    - { id: a, text: { en: "Add a bucket policy that allows the consumer project's IAM role to read the S3 location of the table.", fr: "Ajouter une politique de compartiment qui autorise le rôle IAM du projet consommateur à lire l'emplacement S3 de la table." } }
    - { id: b, text: { en: "Create an Amazon EventBridge rule that grants Lake Formation permissions when a subscription is approved.", fr: "Créer une règle Amazon EventBridge qui accorde des autorisations Lake Formation lorsqu'un abonnement est approuvé." } }
    - { id: c, text: { en: "Give the producer project's IAM role DESCRIBE GRANTABLE on the database and SELECT GRANTABLE and DESCRIBE GRANTABLE on the table.", fr: "Accorder au rôle IAM du projet producteur DESCRIBE GRANTABLE sur la base de données, ainsi que SELECT GRANTABLE et DESCRIBE GRANTABLE sur la table." } }
    - { id: d, text: { en: "Assign LF-tags to the table, and grant the consumer project's IAM role SELECT on the matching tag expression.", fr: "Attribuer des LF-tags à la table, et accorder au rôle IAM du projet consommateur SELECT sur l'expression de LF-tags correspondante." } }
answer: { optionId: c }
explanation:
  correct:
    en: "For managed AWS Glue assets, SageMaker Unified Studio fulfills approved subscriptions by granting Lake Formation permissions on the consumer's behalf. To do so, the publishing project's IAM role needs DESCRIBE and DESCRIBE GRANTABLE on the database, and DESCRIBE, SELECT, DESCRIBE GRANTABLE and SELECT GRANTABLE on the table."
    fr: "Pour les ressources AWS Glue gérées, SageMaker Unified Studio exécute les abonnements approuvés en accordant des autorisations Lake Formation pour le compte du consommateur. Pour cela, le rôle IAM du projet producteur a besoin de DESCRIBE et DESCRIBE GRANTABLE sur la base de données, ainsi que de DESCRIBE, SELECT, DESCRIBE GRANTABLE et SELECT GRANTABLE sur la table."
  options:
    a:
      en: "The table is managed by Lake Formation, so access comes from Lake Formation grants; a bucket policy does not make the service fulfill the subscription."
      fr: "La table est gérée par Lake Formation : l'accès provient des autorisations Lake Formation ; une politique de compartiment ne fait pas exécuter l'abonnement par le service."
    b:
      en: "EventBridge integrations are for unmanaged assets; for managed Glue assets, the service grants access itself once it has grantable permissions."
      fr: "Les intégrations EventBridge concernent les ressources non gérées ; pour les ressources Glue gérées, le service accorde lui-même l'accès dès qu'il dispose d'autorisations délégables."
    d:
      en: "Access management with Lake Formation tag-based access control is not supported for these subscriptions, and manual grants bypass the subscription workflow."
      fr: "La gestion des accès avec le contrôle d'accès basé sur les LF-tags de Lake Formation n'est pas prise en charge pour ces abonnements, et des autorisations manuelles contournent le processus d'abonnement."
references:
  - title: Grant access to managed AWS Glue Data Catalog assets in Amazon SageMaker Unified Studio
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/grant-access-to-glue-asset.html
