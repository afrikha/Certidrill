id: deac01-2b-crawl-single-schema-path
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application writes gzip-compressed JSON order files to s3://example-orders/orders/year=2025/ and s3://example-orders/orders/year=2026/. In 2026, the application started to add two optional fields to each record. An AWS Glue crawler on s3://example-orders/orders/ now creates two tables, year_2025 and year_2026, instead of one orders table partitioned by year. Analysts need a single table that contains all the fields.

    Which crawler change will meet these requirements?
  fr: |
    Une application écrit des fichiers de commandes JSON compressés avec gzip dans s3://example-orders/orders/year=2025/ et s3://example-orders/orders/year=2026/. En 2026, l'application a commencé à ajouter deux champs facultatifs à chaque enregistrement. Un robot d'analyse (crawler) AWS Glue sur s3://example-orders/orders/ crée désormais deux tables, year_2025 et year_2026, au lieu d'une table orders partitionnée par année. Les analystes ont besoin d'une table unique qui contient tous les champs.

    Quelle modification du robot d'analyse répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the table grouping policy to CombineCompatibleSchemas by selecting the option to create a single schema for each S3 path.", fr: "Définir la politique de regroupement des tables sur CombineCompatibleSchemas en sélectionnant l'option de création d'un schéma unique pour chaque chemin S3." } }
    - { id: b, text: { en: "Add an exclude pattern for year=2025/** so that the crawler builds the table only from the files that contain all the fields.", fr: "Ajouter un modèle d'exclusion pour year=2025/** afin que le robot d'analyse construise la table uniquement à partir des fichiers qui contiennent tous les champs." } }
    - { id: c, text: { en: "Set the recrawl policy to crawl new sub-folders only so that the existing year_2025 table is no longer updated by the crawler.", fr: "Définir la politique de réanalyse sur l'analyse des nouveaux sous-dossiers uniquement afin que le robot d'analyse ne mette plus à jour la table year_2025 existante." } }
    - { id: d, text: { en: "Set the UpdateBehavior of the schema change policy to LOG so that the crawler stops changing the schemas of the existing tables.", fr: "Définir l'UpdateBehavior de la politique de modification de schéma sur LOG afin que le robot d'analyse cesse de modifier les schémas des tables existantes." } }
answer: { optionId: a }
explanation:
  correct:
    en: "By default, a crawler weighs both data compatibility and schema similarity, so files whose schemas differ enough become separate tables. With CombineCompatibleSchemas, the crawler still requires compatible data (same format and compression) but ignores schema similarity, and it creates one table with all the columns and year as the partition key."
    fr: "Par défaut, un robot d'analyse tient compte à la fois de la compatibilité des données et de la similarité des schémas : des fichiers dont les schémas diffèrent suffisamment deviennent des tables distinctes. Avec CombineCompatibleSchemas, le robot d'analyse exige toujours des données compatibles (même format et même compression), mais ignore la similarité des schémas, et il crée une table avec toutes les colonnes et year comme clé de partition."
  options:
    b:
      en: "Excluding the 2025 prefix removes a year of data from the table, while analysts need all the orders."
      fr: "Exclure le préfixe 2025 retire une année de données de la table, alors que les analystes ont besoin de toutes les commandes."
    c:
      en: "Incremental crawls only add new partitions to existing tables; they do not merge the two tables already created."
      fr: "Les analyses incrémentielles ne font qu'ajouter de nouvelles partitions aux tables existantes ; elles ne fusionnent pas les deux tables déjà créées."
    d:
      en: "LOG prevents schema updates to existing tables, but the crawler still groups the files into two separate tables."
      fr: "LOG empêche les mises à jour de schéma des tables existantes, mais le robot d'analyse regroupe toujours les fichiers en deux tables distinctes."
references:
  - title: Creating a single schema for each Amazon S3 include path
    url: https://docs.aws.amazon.com/glue/latest/dg/crawler-grouping-policy.html
