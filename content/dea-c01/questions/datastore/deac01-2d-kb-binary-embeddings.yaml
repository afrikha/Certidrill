id: deac01-2d-kb-binary-embeddings
objective: "2.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research company is creating a new Amazon Bedrock knowledge base that will hold about 200 million chunks. Storing float32 vectors would make the vector store too expensive. The company must use Amazon Titan Text Embeddings V2 with 1,024 dimensions and accepts a small loss of retrieval precision in exchange for much smaller vectors.

    Which configuration will meet these requirements?
  fr: |
    Une entreprise de recherche crée une nouvelle base de connaissances Amazon Bedrock qui contiendra environ 200 millions de segments. Stocker des vecteurs float32 rendrait le magasin de vecteurs (vector store) trop coûteux. L'entreprise doit utiliser Amazon Titan Text Embeddings V2 avec 1 024 dimensions et accepte une légère perte de précision de la récupération en échange de vecteurs beaucoup plus petits.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Binary embeddings with Titan Text Embeddings V2, stored in Amazon Aurora PostgreSQL with pgvector", fr: "Des vectorisations (embeddings) binaires avec Titan Text Embeddings V2, stockées dans Amazon Aurora PostgreSQL avec pgvector" } }
    - { id: b, text: { en: "Binary embeddings with Titan Text Embeddings V2, stored in an Amazon S3 Vectors index", fr: "Des vectorisations (embeddings) binaires avec Titan Text Embeddings V2, stockées dans un index Amazon S3 Vectors" } }
    - { id: c, text: { en: "Floating-point embeddings with Titan Embeddings G1 - Text, stored in an Amazon OpenSearch Serverless collection", fr: "Des vectorisations (embeddings) à virgule flottante avec Titan Embeddings G1 - Text, stockées dans une collection Amazon OpenSearch Serverless" } }
    - { id: d, text: { en: "Binary embeddings with Titan Text Embeddings V2, stored in an Amazon OpenSearch Serverless vector index", fr: "Des vectorisations (embeddings) binaires avec Titan Text Embeddings V2, stockées dans un index vectoriel Amazon OpenSearch Serverless" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Binary vectors use 1 bit per dimension instead of 32 bits for float32, which greatly reduces storage at the cost of some precision, and Titan Text Embeddings V2 supports binary output. A binary embedding model must be paired with a vector store that supports binary vectors, and for knowledge bases only OpenSearch Serverless and OpenSearch Managed Clusters do."
    fr: "Les vecteurs binaires utilisent 1 bit par dimension au lieu de 32 bits en float32, ce qui réduit fortement le stockage au prix d'une certaine précision, et Titan Text Embeddings V2 prend en charge la sortie binaire. Un modèle de vectorisation binaire doit être associé à un magasin de vecteurs qui prend en charge les vecteurs binaires, et pour les bases de connaissances, seuls OpenSearch Serverless et OpenSearch Managed Clusters le font."
  options:
    a:
      en: "Aurora PostgreSQL is a supported vector store, but not for binary vectors in a knowledge base."
      fr: "Aurora PostgreSQL est un magasin de vecteurs pris en charge, mais pas pour des vecteurs binaires dans une base de connaissances."
    b:
      en: "S3 Vectors stores float32 vectors only, so it cannot hold binary embeddings."
      fr: "S3 Vectors ne stocke que des vecteurs float32 : il ne peut pas contenir de vectorisations binaires."
    c:
      en: "Titan Embeddings G1 - Text produces 1,536-dimension float vectors, which are larger, and the company must use Titan Text Embeddings V2."
      fr: "Titan Embeddings G1 - Text produit des vecteurs à virgule flottante de 1 536 dimensions, plus volumineux, et l'entreprise doit utiliser Titan Text Embeddings V2."
references:
  - title: How Amazon Bedrock knowledge bases work
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
  - title: Prerequisites for using a vector store you created for a knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
