id: deac01-2a-transfer-workflow-decrypt
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank receives PGP-encrypted files from partners over SFTP on an AWS Transfer Family server that stores files in Amazon S3. After each upload, the file must be decrypted, copied to a processing prefix and tagged with the partner name so that AWS Glue jobs can pick it up. Compliance requires a log of each processing step for every file.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une banque reçoit de ses partenaires des fichiers chiffrés en PGP par SFTP sur un serveur AWS Transfer Family qui stocke les fichiers dans Amazon S3. Après chaque chargement, le fichier doit être déchiffré, copié vers un préfixe de traitement et balisé avec le nom du partenaire pour que des tâches AWS Glue le prennent en charge. La conformité exige un journal de chaque étape de traitement pour chaque fichier.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Configure an S3 Event Notification that invokes a Lambda function that decrypts, copies and tags each file with a PGP library.", fr: "Configurer une notification d'événement S3 qui appelle une fonction Lambda chargée de déchiffrer, copier et baliser chaque fichier avec une bibliothèque PGP." } }
    - { id: b, text: { en: "Attach a Transfer Family managed workflow with decrypt, copy and tag steps that runs when an upload completes.", fr: "Associer au serveur un flux de travail géré Transfer Family avec des étapes de déchiffrement, de copie et de balisage, exécuté à la fin de chaque chargement." } }
    - { id: c, text: { en: "Create an EventBridge rule for completed uploads that starts an AWS Glue Python shell job that decrypts and tags the file.", fr: "Créer une règle EventBridge pour les chargements terminés qui démarre une tâche AWS Glue Python shell chargée de déchiffrer et baliser le fichier." } }
    - { id: d, text: { en: "Enable SSE-KMS with an S3 Bucket Key on the bucket so that objects are decrypted automatically when they are read.", fr: "Activer SSE-KMS avec une clé de compartiment S3 (S3 Bucket Key) sur le compartiment pour que les objets soient déchiffrés automatiquement à la lecture." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Transfer Family managed workflows run automatically after a file transfer completes and provide predefined steps such as decrypt, copy and tag, so no code is needed. Each step produces detailed logs, which gives the per-file audit trail that compliance requires."
    fr: "Les flux de travail gérés Transfer Family s'exécutent automatiquement à la fin d'un transfert et proposent des étapes prédéfinies comme le déchiffrement, la copie et le balisage : aucun code n'est nécessaire. Chaque étape produit des journaux détaillés, ce qui fournit la piste d'audit par fichier exigée par la conformité."
  options:
    a:
      en: "This works but requires custom decryption code, key handling and logging to build and maintain."
      fr: "Cela fonctionne, mais exige du code de déchiffrement personnalisé, une gestion des clés et une journalisation à créer et à maintenir."
    c:
      en: "This also requires a custom script for decryption and logging, which is more overhead than the predefined workflow steps."
      fr: "Cela exige aussi un script personnalisé pour le déchiffrement et la journalisation, soit plus de charge que les étapes prédéfinies du flux de travail."
    d:
      en: "Server-side encryption protects objects at rest in S3; it cannot remove the PGP encryption that partners applied to the file content."
      fr: "Le chiffrement côté serveur protège les objets au repos dans S3 ; il ne peut pas retirer le chiffrement PGP que les partenaires ont appliqué au contenu du fichier."
references:
  - title: AWS Transfer Family managed workflows
    url: https://docs.aws.amazon.com/transfer/latest/userguide/transfer-workflows.html
