id: deac01-2b-crawl-s3-event-mode
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue crawler runs every hour on an Amazon S3 folder that holds millions of objects. Each hour, producers add a few hundred objects, both in new partition folders and in existing ones, and a cleanup process deletes some objects. Each crawl lists the whole folder, takes a long time and costs more every month. The Data Catalog must reflect added and deleted objects after each run, and crawl cost must depend on the number of changes.

    Which solution will meet these requirements?
  fr: |
    Un robot d'analyse (crawler) AWS Glue s'exécute toutes les heures sur un dossier Amazon S3 qui contient des millions d'objets. Chaque heure, des producteurs ajoutent quelques centaines d'objets, dans de nouveaux dossiers de partition comme dans des dossiers existants, et un processus de nettoyage supprime certains objets. Chaque analyse liste tout le dossier, dure longtemps et coûte plus cher chaque mois. Le Data Catalog doit refléter les objets ajoutés et supprimés après chaque exécution, et le coût des analyses doit dépendre du nombre de modifications.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the recrawl policy to CRAWL_NEW_FOLDERS_ONLY so that each run lists only the partition folders added since the previous crawl.", fr: "Définir la politique de réanalyse sur CRAWL_NEW_FOLDERS_ONLY afin que chaque exécution ne liste que les dossiers de partition ajoutés depuis l'analyse précédente." } }
    - { id: b, text: { en: "Set the sample size of the crawler to 1 file so that each run reads a single file in each leaf folder of the target.", fr: "Définir la taille d'échantillon du robot d'analyse à 1 fichier afin que chaque exécution lise un seul fichier dans chaque dossier feuille de la cible." } }
    - { id: c, text: { en: "Split the crawler into one crawler per top-level prefix, and run the new crawlers in parallel at the same hourly schedule.", fr: "Diviser le robot d'analyse en un robot par préfixe de premier niveau, et exécuter les nouveaux robots en parallèle selon le même planning horaire." } }
    - { id: d, text: { en: "Send the bucket's S3 event notifications for the folder to an Amazon SQS queue, and configure the crawler to crawl by using these events.", fr: "Envoyer les notifications d'événements S3 du compartiment pour le dossier vers une file d'attente Amazon SQS, et configurer le robot d'analyse pour qu'il analyse à l'aide de ces événements." } }
answer: { optionId: d }
explanation:
  correct:
    en: "In S3 event mode, after a first full crawl, the crawler consumes the S3 events from the SQS queue and lists only the subfolders where objects were added or deleted. Recrawls become faster and cheaper, and there is no cost when the queue holds no events."
    fr: "En mode événements S3, après une première analyse complète, le robot d'analyse consomme les événements S3 de la file d'attente SQS et ne liste que les sous-dossiers où des objets ont été ajoutés ou supprimés. Les réanalyses deviennent plus rapides et moins coûteuses, et il n'y a aucun coût lorsque la file d'attente ne contient aucun événement."
  options:
    a:
      en: "Incremental crawls add only new partitions; they do not detect objects added to existing partitions or deleted objects."
      fr: "Les analyses incrémentielles n'ajoutent que de nouvelles partitions ; elles ne détectent ni les objets ajoutés aux partitions existantes ni les objets supprimés."
    b:
      en: "Sampling reduces the files read in each folder, but the crawler still lists the whole target on every run."
      fr: "L'échantillonnage réduit le nombre de fichiers lus dans chaque dossier, mais le robot d'analyse liste toujours toute la cible à chaque exécution."
    c:
      en: "Parallel crawlers shorten the elapsed time, but together they still list every object each hour, so the cost does not depend on the changes."
      fr: "Des robots d'analyse en parallèle réduisent la durée écoulée, mais ensemble ils listent toujours chaque objet toutes les heures : le coût ne dépend pas des modifications."
references:
  - title: Accelerating crawls using Amazon S3 event notifications
    url: https://docs.aws.amazon.com/glue/latest/dg/crawler-s3-event-notifications.html
  - title: Scheduling incremental crawls for adding new partitions
    url: https://docs.aws.amazon.com/glue/latest/dg/incremental-crawls.html
