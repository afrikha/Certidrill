id: deac01-2a-iceberg-time-travel
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An analyst ran a faulty MERGE INTO statement on an Apache Iceberg table named sales one hour ago in Amazon Athena engine version 3. To measure the damage, the analyst must read the table as it was 24 hours ago. The table still keeps its snapshots for 5 days.

    Which query should the analyst run?
  fr: |
    Un analyste a exécuté il y a une heure une instruction MERGE INTO erronée sur une table Apache Iceberg nommée sales dans le moteur Amazon Athena version 3. Pour mesurer les dégâts, l'analyste doit lire la table telle qu'elle était il y a 24 heures. La table conserve encore ses instantanés pendant 5 jours.

    Quelle requête l'analyste doit-il exécuter ?
body:
  options:
    - { id: a, text: "SELECT * FROM sales FOR SYSTEM_TIME AS OF (current_timestamp - interval '1' day)" }
    - { id: b, text: "SELECT * FROM sales FOR TIMESTAMP AS OF (current_timestamp - interval '1' day)" }
    - { id: c, text: "SELECT * FROM \"sales$snapshots\" WHERE committed_at < current_timestamp - interval '1' day" }
    - { id: d, text: "SELECT * FROM sales FOR VERSION AS OF (current_timestamp - interval '1' day)" }
answer: { optionId: b }
explanation:
  correct:
    en: "In Athena engine version 3, FOR TIMESTAMP AS OF reads an Iceberg table as of a timestamp, here one day ago, as long as the matching snapshot still exists. A timestamp without a time zone is treated as UTC."
    fr: "Dans le moteur Athena version 3, FOR TIMESTAMP AS OF lit une table Iceberg telle qu'elle était à un horodatage donné, ici il y a un jour, tant que l'instantané correspondant existe encore. Un horodatage sans fuseau horaire est interprété en UTC."
  options:
    a:
      en: "FOR SYSTEM_TIME AS OF is the engine version 2 syntax; engine version 3 replaced it with FOR TIMESTAMP AS OF."
      fr: "FOR SYSTEM_TIME AS OF est la syntaxe du moteur version 2 ; le moteur version 3 l'a remplacée par FOR TIMESTAMP AS OF."
    c:
      en: "The $snapshots metadata table lists the table's snapshots; it does not return the rows of the table at that time."
      fr: "La table de métadonnées $snapshots liste les instantanés de la table ; elle ne renvoie pas les lignes de la table à ce moment."
    d:
      en: "FOR VERSION AS OF expects a bigint snapshot ID, not a timestamp expression."
      fr: "FOR VERSION AS OF attend un ID d'instantané de type bigint, pas une expression d'horodatage."
references:
  - title: Perform time travel and version travel queries
    url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-time-travel-and-version-travel-queries.html
