id: deac01-2d-partition-granularity
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An energy company stores sensor readings in Amazon S3 as Parquet files and queries them with Amazon Athena. The table is partitioned by year, month, day and hour, and each hourly partition holds many small files. Most queries cover the last 7 to 30 days and filter only on the year, month and day columns. Query planning and execution are slow. The company wants faster queries without rewriting the queries.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'énergie stocke des relevés de capteurs dans Amazon S3 sous forme de fichiers Parquet et les interroge avec Amazon Athena. La table est partitionnée par année, mois, jour et heure, et chaque partition horaire contient de nombreux petits fichiers. La plupart des requêtes couvrent les 7 à 30 derniers jours et filtrent uniquement sur les colonnes year, month et day. La planification et l'exécution des requêtes sont lentes. L'entreprise veut des requêtes plus rapides sans réécrire les requêtes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Remove the hour partition level, and sort the records by timestamp within each daily partition.", fr: "Supprimer le niveau de partition horaire, et trier les enregistrements par horodatage dans chaque partition journalière." } }
    - { id: b, text: { en: "Add a sensor_id partition key below the hour level so that each partition holds less data.", fr: "Ajouter une clé de partition sensor_id sous le niveau de l'heure afin que chaque partition contienne moins de données." } }
    - { id: c, text: { en: "Keep the hourly partitions, and configure partition projection with an hour range on the table.", fr: "Conserver les partitions horaires, et configurer la projection de partitions avec une plage horaire sur la table." } }
    - { id: d, text: { en: "Rewrite the data as gzip-compressed CSV files so that each partition holds fewer bytes.", fr: "Réécrire les données en fichiers CSV compressés avec gzip afin que chaque partition contienne moins d'octets." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Partitioning should match the common queries: when queries span days, hourly partitions only fragment the data into many small files that add listing and request overhead. Daily partitions with records sorted by timestamp produce fewer, larger files, and the Parquet min/max statistics still let Athena skip data for shorter time windows."
    fr: "Le partitionnement doit correspondre aux requêtes courantes : quand les requêtes couvrent plusieurs jours, des partitions horaires ne font que fragmenter les données en nombreux petits fichiers qui ajoutent une charge de listage et de requêtes. Des partitions journalières avec des enregistrements triés par horodatage produisent moins de fichiers, plus gros, et les statistiques min/max de Parquet permettent toujours à Athena d'ignorer des données pour des fenêtres plus courtes."
  options:
    b:
      en: "Another partition level fragments the dataset further and creates even more small files."
      fr: "Un niveau de partition supplémentaire fragmente davantage le jeu de données et crée encore plus de petits fichiers."
    c:
      en: "Projection removes catalog lookups, but the queries still read many small hourly files, which remains the main cost."
      fr: "La projection supprime les recherches dans le catalogue, mais les requêtes lisent toujours de nombreux petits fichiers horaires, ce qui reste le coût principal."
    d:
      en: "CSV is a row format that forces Athena to read every column, and compressed text files cannot be split for parallel reads."
      fr: "CSV est un format en lignes qui oblige Athena à lire toutes les colonnes, et les fichiers texte compressés ne peuvent pas être divisés pour une lecture parallèle."
references:
  - title: Optimize data
    url: https://docs.aws.amazon.com/athena/latest/ug/performance-tuning-data-optimization-techniques.html
