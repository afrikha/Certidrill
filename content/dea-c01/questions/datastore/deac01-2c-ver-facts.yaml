id: deac01-2c-ver-facts
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer plans to enable S3 Versioning on an existing Amazon S3 bucket that already holds millions of objects of a data lake. Before making the change, the engineer reviews how versioning affects existing objects, deletes and storage costs.

    Which statements are true? (Choose two.)
  fr: |
    Un ingénieur des données prévoit d'activer S3 Versioning sur un compartiment Amazon S3 existant qui contient déjà des millions d'objets d'un lac de données. Avant le changement, l'ingénieur vérifie l'effet de la gestion des versions sur les objets existants, les suppressions et les coûts de stockage.

    Quelles affirmations sont vraies ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Objects stored before versioning is enabled have a version ID of null.", fr: "Les objets stockés avant l'activation de la gestion des versions ont un ID de version null." } }
    - { id: b, text: { en: "After versioning is enabled, the bucket can be returned to the unversioned state.", fr: "Une fois la gestion des versions activée, le compartiment peut revenir à l'état sans gestion des versions." } }
    - { id: c, text: { en: "Each stored version of an object is billed as a full object.", fr: "Chaque version stockée d'un objet est facturée comme un objet complet." } }
    - { id: d, text: { en: "A DELETE request without a version ID permanently removes the current version.", fr: "Une requête DELETE sans ID de version supprime définitivement la version actuelle." } }
    - { id: e, text: { en: "An S3 Lifecycle Expiration action permanently deletes the noncurrent versions.", fr: "Une action Expiration S3 Lifecycle supprime définitivement les versions non actuelles." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Enabling versioning does not change existing objects, which keep the null version ID. Every version is a complete object, not a difference, so three stored versions are billed as three objects.
    fr: |
      Activer la gestion des versions ne modifie pas les objets existants, qui conservent l'ID de version null. Chaque version est un objet complet, et non une différence : trois versions stockées sont facturées comme trois objets.
  options:
    b: { en: "A bucket that has been versioning-enabled can never return to the unversioned state; it can only be suspended.", fr: "Un compartiment dont la gestion des versions a été activée ne peut jamais revenir à l'état sans gestion des versions ; elle peut seulement être suspendue." }
    d: { en: "A simple DELETE inserts a delete marker, and the previous version can be restored; only a DELETE with a version ID removes a version permanently.", fr: "Une suppression simple insère un marqueur de suppression, et la version précédente peut être restaurée ; seule une requête DELETE avec ID de version supprime définitivement une version." }
    e: { en: "Expiration affects only the current version; noncurrent versions are deleted by a NoncurrentVersionExpiration action.", fr: "Expiration ne concerne que la version actuelle ; les versions non actuelles sont supprimées par une action NoncurrentVersionExpiration." }
references:
  - title: Retaining multiple versions of objects with S3 Versioning
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html
