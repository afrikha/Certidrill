id: deac01-2c-lc-one-zone-recreatable
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Amazon EMR jobs write intermediate Parquet outputs of 500 MB each to an intermediate/ prefix in Amazon S3. The outputs are read heavily for 3 days. After that, a backfill job reads them about once a month and needs millisecond access, and another rule deletes them after 1 year. The outputs can be re-created from the raw data if they are lost. The company wants the MOST cost-effective storage for the outputs after 3 days.

    Which solution will meet these requirements?
  fr: |
    Des tâches Amazon EMR écrivent des sorties Parquet intermédiaires de 500 Mo chacune dans un préfixe intermediate/ d'Amazon S3. Les sorties sont lues intensivement pendant 3 jours. Ensuite, une tâche de rattrapage les lit environ une fois par mois et a besoin d'un accès en quelques millisecondes, et une autre règle les supprime après 1 an. Les sorties peuvent être recréées à partir des données brutes si elles sont perdues. L'entreprise veut le stockage le plus rentable pour les sorties après 3 jours.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an S3 Lifecycle rule for the intermediate/ prefix that transitions objects to S3 One Zone-IA 3 days after creation.", fr: "Créer une règle S3 Lifecycle pour le préfixe intermediate/ qui fait passer les objets à S3 One Zone-IA 3 jours après leur création." }
    - id: b
      text: { en: "Create an S3 Lifecycle rule for the intermediate/ prefix that transitions objects to S3 Standard-IA 3 days after creation.", fr: "Créer une règle S3 Lifecycle pour le préfixe intermediate/ qui fait passer les objets à S3 Standard-IA 3 jours après leur création." }
    - id: c
      text: { en: "Create an S3 Lifecycle rule for the intermediate/ prefix that transitions objects to S3 Glacier Flexible Retrieval 3 days after creation.", fr: "Créer une règle S3 Lifecycle pour le préfixe intermediate/ qui fait passer les objets à S3 Glacier Flexible Retrieval 3 jours après leur création." }
    - id: d
      text: { en: "Create an S3 Lifecycle rule for the intermediate/ prefix that transitions objects to S3 Glacier Instant Retrieval 3 days after creation.", fr: "Créer une règle S3 Lifecycle pour le préfixe intermediate/ qui fait passer les objets à S3 Glacier Instant Retrieval 3 jours après leur création." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      S3 One Zone-IA is intended for re-creatable, infrequently accessed data: it serves reads in milliseconds and costs less than S3 Standard-IA because it stores the data in a single Availability Zone. Losing that zone is acceptable here because the outputs can be rebuilt from the raw data.
    fr: |
      S3 One Zone-IA est destiné aux données recréables et rarement consultées : il répond aux lectures en quelques millisecondes et coûte moins cher que S3 Standard-IA, car il stocke les données dans une seule zone de disponibilité. La perte de cette zone est acceptable ici, car les sorties peuvent être reconstruites à partir des données brutes.
  options:
    b: { en: "S3 Standard-IA stores the data across at least three Availability Zones, a resilience that re-creatable outputs do not need, at a higher price.", fr: "S3 Standard-IA stocke les données dans au moins trois zones de disponibilité, une résilience inutile pour des sorties recréables, à un prix plus élevé." }
    c: { en: "S3 Glacier Flexible Retrieval objects must be restored before they are read, so the backfill job would not get millisecond access.", fr: "Les objets S3 Glacier Flexible Retrieval doivent être restaurés avant d'être lus : la tâche de rattrapage n'aurait pas d'accès en quelques millisecondes." }
    d: { en: "S3 Glacier Instant Retrieval is designed for data read about once a quarter; monthly reads would add its higher retrieval charges.", fr: "S3 Glacier Instant Retrieval est conçu pour des données lues environ une fois par trimestre ; des lectures mensuelles ajouteraient ses frais de récupération plus élevés." }
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
