id: deac01-2c-ttl-no-wcu
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company stores player session events in an Amazon DynamoDB table that uses provisioned capacity. Each item must be removed about 30 days after it is written, and a delay of a few days is acceptable. The deletions must not consume the table's write capacity. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo stocke les événements de session des joueurs dans une table Amazon DynamoDB en capacité provisionnée. Chaque élément doit être supprimé environ 30 jours après son écriture, et un délai de quelques jours est acceptable. Les suppressions ne doivent pas consommer la capacité d'écriture de la table. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Schedule an AWS Lambda function that scans the table every day and deletes old items with BatchWriteItem.", fr: "Planifier une fonction AWS Lambda qui analyse la table chaque jour et supprime les anciens éléments avec BatchWriteItem." }
    - id: b
      text: { en: "Enable DynamoDB Streams, and have an AWS Lambda function delete each item 30 days after it receives the insert record.", fr: "Activer DynamoDB Streams, et faire supprimer chaque élément par une fonction AWS Lambda 30 jours après réception de l'enregistrement d'insertion." }
    - id: c
      text: { en: "Export the table to Amazon S3 every month, then delete the table and create it again empty.", fr: "Exporter la table vers Amazon S3 chaque mois, puis supprimer la table et la recréer vide." }
    - id: d
      text: { en: "Write an expiry attribute as a Number in epoch seconds on each item, and enable TTL on that attribute.", fr: "Écrire sur chaque élément un attribut d'expiration de type Number en secondes epoch, et activer la durée de vie (TTL) sur cet attribut." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      DynamoDB TTL deletes items after the timestamp in their TTL attribute, a Number in Unix epoch seconds, typically within a few days of expiry. TTL deletions do not consume write capacity, and no code or schedule is needed.
    fr: |
      La durée de vie (TTL) DynamoDB supprime les éléments après l'horodatage de leur attribut TTL, un Number en secondes epoch Unix, généralement dans les quelques jours qui suivent l'expiration. Les suppressions TTL ne consomment pas de capacité d'écriture, et aucun code ni aucune planification n'est nécessaire.
  options:
    a: { en: "Scans consume read capacity, and each delete consumes write capacity, which the requirement forbids; the function must also be maintained.", fr: "Les analyses consomment de la capacité de lecture, et chaque suppression consomme de la capacité d'écriture, ce que l'exigence interdit ; la fonction doit aussi être maintenue." }
    b: { en: "The deletes that the function sends still consume write capacity, and holding records for 30 days requires custom state handling.", fr: "Les suppressions envoyées par la fonction consomment toujours de la capacité d'écriture, et conserver les enregistrements 30 jours exige une gestion d'état personnalisée." }
    c: { en: "Deleting the table removes recent items too and makes the table unavailable while it is created again.", fr: "Supprimer la table retire aussi les éléments récents et rend la table indisponible pendant sa recréation." }
references:
  - title: Using time to live (TTL) in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
