id: deac01-2a-redshift-streaming-ingestion
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company sends clickstream events to an Amazon Kinesis data stream. The operations team must be able to query the events in an Amazon Redshift Serverless workgroup within seconds of their arrival. The data must not be staged in Amazon S3, and the company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias envoie des événements de parcours de navigation vers un flux de données Amazon Kinesis. L'équipe des opérations doit pouvoir interroger les événements dans un groupe de travail Amazon Redshift Serverless quelques secondes après leur arrivée. Les données ne doivent pas transiter par Amazon S3, et l'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Data Firehose stream that reads the data stream and delivers the events to the workgroup.", fr: "Créer un flux Amazon Data Firehose qui lit le flux de données et livre les événements au groupe de travail." } }
    - { id: b, text: { en: "Write a Lambda consumer that inserts each event into a table through the Amazon Redshift Data API.", fr: "Écrire une fonction Lambda consommatrice qui insère chaque événement dans une table via l'API de données Amazon Redshift." } }
    - { id: c, text: { en: "Create an external schema FROM KINESIS and a materialized view on the stream with AUTO REFRESH YES.", fr: "Créer un schéma externe FROM KINESIS et une vue matérialisée sur le flux avec AUTO REFRESH YES." } }
    - { id: d, text: { en: "Create a Redshift Spectrum external table whose location is the ARN of the data stream.", fr: "Créer une table externe Redshift Spectrum dont l'emplacement est l'ARN du flux de données." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Redshift streaming ingestion reads Kinesis Data Streams or Amazon MSK directly into a materialized view, with no temporary landing area such as an S3 bucket. The external schema maps the stream through an IAM role, and AUTO REFRESH YES refreshes the view as data arrives for low-latency queries."
    fr: "L'ingestion en streaming de Redshift lit Kinesis Data Streams ou Amazon MSK directement dans une vue matérialisée, sans zone de transit temporaire comme un compartiment S3. Le schéma externe associe le flux via un rôle IAM, et AUTO REFRESH YES actualise la vue à mesure que les données arrivent pour des requêtes à faible latence."
  options:
    a:
      en: "Firehose buffers the records and stages them in an S3 bucket before it issues a COPY into Redshift, which the requirements forbid."
      fr: "Firehose met les enregistrements en mémoire tampon et les dépose dans un compartiment S3 avant d'émettre un COPY dans Redshift, ce que les exigences interdisent."
    b:
      en: "Row-by-row inserts from custom code are slow in a columnar warehouse and add code to build and maintain."
      fr: "Les insertions ligne par ligne depuis du code personnalisé sont lentes dans un entrepôt en colonnes et ajoutent du code à créer et à maintenir."
    d:
      en: "Redshift Spectrum reads files in Amazon S3; it cannot use a Kinesis data stream as a table location."
      fr: "Redshift Spectrum lit des fichiers dans Amazon S3 ; il ne peut pas utiliser un flux de données Kinesis comme emplacement de table."
references:
  - title: Streaming ingestion to a materialized view
    url: https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-streaming-ingestion.html
  - title: Getting started with streaming ingestion from Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-streaming-ingestion-getting-started.html
