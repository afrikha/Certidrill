id: deac01-2c-lc-noncurrent-transition
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores curated datasets in a versioning-enabled Amazon S3 bucket. Current versions of objects outside the archive/ prefix must stay in S3 Standard. Noncurrent versions of all objects are rarely needed and must move to S3 Glacier Flexible Retrieval 7 days after they become noncurrent. Current versions of objects under archive/ must move to S3 Glacier Deep Archive 180 days after creation.

    Which S3 Lifecycle rules will meet these requirements? (Choose two.)
  fr: |
    Une entreprise stocke des jeux de données préparés dans un compartiment Amazon S3 avec gestion des versions activée. Les versions actuelles des objets hors du préfixe archive/ doivent rester dans S3 Standard. Les versions non actuelles de tous les objets sont rarement utiles et doivent passer à S3 Glacier Flexible Retrieval 7 jours après être devenues non actuelles. Les versions actuelles des objets sous archive/ doivent passer à S3 Glacier Deep Archive 180 jours après leur création.

    Quelles règles S3 Lifecycle permettent de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A rule with no filter and a Transition action to GLACIER 7 days after creation", fr: "Une règle sans filtre avec une action Transition vers GLACIER 7 jours après la création" } }
    - { id: b, text: { en: "A rule with no filter and a NoncurrentVersionTransition action to GLACIER with NoncurrentDays set to 7", fr: "Une règle sans filtre avec une action NoncurrentVersionTransition vers GLACIER et NoncurrentDays défini à 7" } }
    - { id: c, text: { en: "A rule with no filter and a NoncurrentVersionExpiration action with NoncurrentDays set to 7", fr: "Une règle sans filtre avec une action NoncurrentVersionExpiration et NoncurrentDays défini à 7" } }
    - { id: d, text: { en: "A rule with no filter and a Transition action to DEEP_ARCHIVE 180 days after creation", fr: "Une règle sans filtre avec une action Transition vers DEEP_ARCHIVE 180 jours après la création" } }
    - { id: e, text: { en: "A rule with an archive/ prefix filter and a Transition action to DEEP_ARCHIVE 180 days after creation", fr: "Une règle avec un filtre de préfixe archive/ et une action Transition vers DEEP_ARCHIVE 180 jours après la création" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      NoncurrentVersionTransition moves only noncurrent versions, counted from the day they become noncurrent, so current versions stay in S3 Standard. A Transition action applies to current versions, and the archive/ prefix filter limits the Deep Archive move to those objects.
    fr: |
      NoncurrentVersionTransition ne déplace que les versions non actuelles, en comptant à partir du jour où elles le deviennent : les versions actuelles restent dans S3 Standard. Une action Transition s'applique aux versions actuelles, et le filtre de préfixe archive/ limite le passage à Deep Archive à ces objets.
  options:
    a: { en: "Transition applies to current versions, so every current object would leave S3 Standard after 7 days.", fr: "Transition s'applique aux versions actuelles : tous les objets actuels quitteraient S3 Standard après 7 jours." }
    c: { en: "NoncurrentVersionExpiration permanently deletes the noncurrent versions instead of moving them to S3 Glacier Flexible Retrieval.", fr: "NoncurrentVersionExpiration supprime définitivement les versions non actuelles au lieu de les déplacer vers S3 Glacier Flexible Retrieval." }
    d: { en: "Without a prefix filter, current versions outside archive/ would also move to S3 Glacier Deep Archive.", fr: "Sans filtre de préfixe, les versions actuelles hors de archive/ passeraient aussi à S3 Glacier Deep Archive." }
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
