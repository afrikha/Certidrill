id: deac01-2c-del-crypto-shred
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS analytics company stores each tenant's data in Amazon S3 under many prefixes and buckets. Every copy of a tenant's data, including replicas, is encrypted with SSE-KMS under a customer managed key dedicated to that tenant. The contract states that when a tenant leaves, all of its data must become permanently unreadable within 30 days. The solution must require the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise SaaS d'analyse stocke les données de chaque locataire dans Amazon S3 sous de nombreux préfixes et compartiments. Chaque copie des données d'un locataire, réplicas compris, est chiffrée en SSE-KMS avec une clé gérée par le client dédiée à ce locataire. Le contrat stipule que, quand un locataire part, toutes ses données doivent devenir définitivement illisibles sous 30 jours. La solution doit demander le MOINS d'efforts.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Disable the tenant's KMS key so that no request can decrypt the tenant's objects.", fr: "Désactiver la clé KMS du locataire afin qu'aucune requête ne puisse déchiffrer les objets du locataire." }
    - id: b
      text: { en: "Schedule the deletion of the tenant's KMS key with a waiting period of 7 days.", fr: "Planifier la suppression de la clé KMS du locataire avec une période d'attente de 7 jours." }
    - id: c
      text: { en: "Turn on rotation of the tenant's KMS key so that new key material replaces the old one.", fr: "Activer la rotation de la clé KMS du locataire afin qu'un nouveau matériel de clé remplace l'ancien." }
    - id: d
      text: { en: "Create an S3 Lifecycle rule that expires the tenant's objects in the primary bucket after 1 day.", fr: "Créer une règle S3 Lifecycle qui fait expirer les objets du locataire dans le compartiment principal après 1 jour." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Deleting a KMS key is irreversible: once the waiting period of 7 to 30 days ends, the key material is removed and data encrypted under the key can no longer be decrypted, wherever the copies are stored. The key can still be recovered by cancelling the deletion during the waiting period.
    fr: |
      La suppression d'une clé KMS est irréversible : à la fin de la période d'attente de 7 à 30 jours, le matériel de clé est supprimé et les données chiffrées avec cette clé ne peuvent plus être déchiffrées, où que se trouvent les copies. La clé peut encore être récupérée en annulant la suppression pendant la période d'attente.
  options:
    a: { en: "A disabled key can be enabled again, so the data is not permanently unreadable.", fr: "Une clé désactivée peut être réactivée : les données ne sont pas définitivement illisibles." }
    c: { en: "Rotation keeps the earlier key material so that existing data can still be decrypted.", fr: "La rotation conserve le matériel de clé précédent afin que les données existantes puissent toujours être déchiffrées." }
    d: { en: "The rule removes objects in one bucket only; the copies in the other buckets and the replicas remain readable.", fr: "La règle ne supprime les objets que dans un compartiment ; les copies des autres compartiments et les réplicas restent lisibles." }
references:
  - title: Delete an AWS KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
