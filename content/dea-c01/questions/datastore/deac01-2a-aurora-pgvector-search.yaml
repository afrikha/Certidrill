id: deac01-2a-aurora-pgvector-search
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company stores 20 million support tickets in an Amazon Aurora PostgreSQL-Compatible Edition 16 cluster. It wants semantic similarity search over 1,024-dimension ticket embeddings generated with Amazon Bedrock. Search results must be filtered and joined with ticket metadata in the same SQL query, and the company does not want to operate an additional database.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels stocke 20 millions de tickets de support dans un cluster Amazon Aurora PostgreSQL-Compatible Edition 16. Il veut une recherche par similarité sémantique sur des plongements (embeddings) de tickets de 1 024 dimensions générés avec Amazon Bedrock. Les résultats doivent être filtrés et joints aux métadonnées des tickets dans la même requête SQL, et l'entreprise ne veut pas exploiter de base de données supplémentaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Index the embeddings in an Amazon OpenSearch Service domain and join the results with the ticket data in the application.", fr: "Indexer les plongements dans un domaine Amazon OpenSearch Service et joindre les résultats aux tickets dans l'application." } }
    - { id: b, text: { en: "Install the pgvector extension in the cluster, store the embeddings in a vector(1024) column and create an HNSW index.", fr: "Installer l'extension pgvector dans le cluster, stocker les plongements dans une colonne vector(1024) et créer un index HNSW." } }
    - { id: c, text: { en: "Store the embeddings in an Amazon MemoryDB cluster with vector search and look up the tickets by ID afterward.", fr: "Stocker les plongements dans un cluster Amazon MemoryDB avec recherche vectorielle, puis rechercher les tickets par ID." } }
    - { id: d, text: { en: "Load the embeddings into a SUPER column in Amazon Redshift and join them with the tickets through a federated query.", fr: "Charger les plongements dans une colonne SUPER d'Amazon Redshift et les joindre aux tickets par une requête fédérée." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Aurora PostgreSQL supports the pgvector extension (CREATE EXTENSION vector), which adds a vector column type and similarity operators, and pgvector 0.5.0 and later adds HNSW indexes. The embeddings live next to the ticket rows, so one SQL query can search, filter and join without another database."
    fr: "Aurora PostgreSQL prend en charge l'extension pgvector (CREATE EXTENSION vector), qui ajoute un type de colonne vector et des opérateurs de similarité, et pgvector 0.5.0 et ultérieur ajoute les index HNSW. Les plongements sont stockés à côté des tickets : une seule requête SQL peut rechercher, filtrer et joindre sans autre base de données."
  options:
    a:
      en: "OpenSearch Service can run vector search, but it is an additional data store to operate and the join moves into application code."
      fr: "OpenSearch Service sait faire de la recherche vectorielle, mais c'est un magasin de données supplémentaire à exploiter, et la jointure passe dans le code de l'application."
    c:
      en: "MemoryDB is another database to operate, and its results cannot be joined with the Aurora tables in the same SQL query."
      fr: "MemoryDB est une autre base de données à exploiter, et ses résultats ne peuvent pas être joints aux tables Aurora dans la même requête SQL."
    d:
      en: "SUPER stores semi-structured data and offers no vector index; Redshift is also an additional data store to operate."
      fr: "SUPER stocke des données semi-structurées et n'offre aucun index vectoriel ; Redshift est en outre un magasin de données supplémentaire à exploiter."
references:
  - title: Using Aurora PostgreSQL as a Knowledge Base for Amazon Bedrock
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
