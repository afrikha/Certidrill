id: deac01-2c-exp-rules-facts
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer is designing S3 Lifecycle rules that expire raw data in several Amazon S3 buckets of a data lake. Some buckets use versioning, and some rules use tag-based filters. Before deploying the rules, the engineer reviews how S3 Lifecycle expiration behaves.

    Which statements are true? (Choose two.)
  fr: |
    Un ingénieur des données conçoit des règles S3 Lifecycle qui font expirer les données brutes de plusieurs compartiments Amazon S3 d'un lac de données. Certains compartiments utilisent la gestion des versions, et certaines règles utilisent des filtres de balises. Avant de déployer les règles, l'ingénieur vérifie le comportement de l'expiration S3 Lifecycle.

    Quelles affirmations sont vraies ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A bucket policy cannot block the deletions that S3 Lifecycle performs.", fr: "Une politique de compartiment ne peut pas bloquer les suppressions effectuées par S3 Lifecycle." } }
    - { id: b, text: { en: "Expiration rules apply only to objects created after the rule is added.", fr: "Les règles d'expiration ne s'appliquent qu'aux objets créés après l'ajout de la règle." } }
    - { id: c, text: { en: "In a versioning-enabled bucket, an Expiration action permanently deletes the current version.", fr: "Dans un compartiment avec gestion des versions activée, une action Expiration supprime définitivement la version actuelle." } }
    - { id: d, text: { en: "When an object is eligible for both a permanent deletion and a transition, S3 performs the deletion.", fr: "Quand un objet est éligible à la fois à une suppression définitive et à une transition, S3 effectue la suppression." } }
    - { id: e, text: { en: "The ExpiredObjectDeleteMarker element can be used in a rule that has a tag-based filter.", fr: "L'élément ExpiredObjectDeleteMarker peut être utilisé dans une règle qui a un filtre de balises." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Bucket policies cannot prevent S3 Lifecycle deletions or transitions. When several actions apply to the same object, S3 applies the least costly one, and permanent deletion takes precedence over transition.
    fr: |
      Les politiques de compartiment ne peuvent pas empêcher les suppressions ou les transitions S3 Lifecycle. Quand plusieurs actions s'appliquent au même objet, S3 applique la moins coûteuse, et la suppression définitive l'emporte sur la transition.
  options:
    b: { en: "Lifecycle rules apply to existing objects as well as to objects created later.", fr: "Les règles de cycle de vie s'appliquent aux objets existants comme aux objets créés plus tard." }
    c: { en: "In a versioned bucket, Expiration adds a delete marker and the previous current version becomes noncurrent; it is not deleted.", fr: "Dans un compartiment versionné, Expiration ajoute un marqueur de suppression et l'ancienne version actuelle devient non actuelle ; elle n'est pas supprimée." }
    e: { en: "ExpiredObjectDeleteMarker is not allowed in rules that use tag-based filters.", fr: "ExpiredObjectDeleteMarker n'est pas autorisé dans les règles qui utilisent des filtres de balises." }
references:
  - title: Expiring objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-expire-general-considerations.html
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
