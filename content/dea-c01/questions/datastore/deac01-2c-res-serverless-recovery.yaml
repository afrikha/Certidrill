id: deac01-2c-res-serverless-recovery
objective: "2.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon Redshift Serverless namespace for its data warehouse. If an engineer drops a table by mistake, the company must be able to recover the data as it was less than an hour before the mistake, on the same day. The company must also keep a backup of each month-end state for 1 year.

    Which actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise un espace de noms Amazon Redshift Serverless pour son entrepôt des données. Si un ingénieur supprime une table par erreur, l'entreprise doit pouvoir récupérer les données telles qu'elles étaient moins d'une heure avant l'erreur, le jour même. L'entreprise doit aussi conserver une sauvegarde de chaque état de fin de mois pendant 1 an.

    Quelles actions permettent de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Restore from the automatic recovery point taken just before the mistake.", fr: "Restaurer à partir du point de récupération automatique pris juste avant l'erreur." } }
    - { id: b, text: { en: "Rely on the automatic recovery points to keep the month-end states for 1 year.", fr: "S'appuyer sur les points de récupération automatiques pour conserver les états de fin de mois pendant 1 an." } }
    - { id: c, text: { en: "Share the namespace's data with another workgroup by using Redshift data sharing.", fr: "Partager les données de l'espace de noms avec un autre groupe de travail à l'aide du partage de données Redshift." } }
    - { id: d, text: { en: "Create a manual snapshot at each month end with a retention period of 365 days.", fr: "Créer un instantané manuel à chaque fin de mois avec une période de conservation de 365 jours." } }
    - { id: e, text: { en: "Create a materialized view of each table at each month end.", fr: "Créer une vue matérialisée de chaque table à chaque fin de mois." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Redshift Serverless creates a recovery point every 30 minutes or after every 5 GB of data changes per node, and keeps each one for 24 hours, which covers a same-day mistake. Longer retention needs manual snapshots, which are created on demand and kept for the retention period that you set.
    fr: |
      Redshift Serverless crée un point de récupération toutes les 30 minutes ou après chaque 5 Go de modifications par nœud, et conserve chacun 24 heures, ce qui couvre une erreur du jour même. Une conservation plus longue exige des instantanés manuels, créés à la demande et conservés pendant la période de conservation définie.
  options:
    b: { en: "Recovery points are kept for 24 hours only, so they cannot hold month-end states for a year.", fr: "Les points de récupération ne sont conservés que 24 heures : ils ne peuvent pas garder les états de fin de mois pendant un an." }
    c: { en: "Data sharing gives live read access to the same data; a dropped table is gone for consumers too, so it is not a backup.", fr: "Le partage de données donne un accès en lecture en direct aux mêmes données ; une table supprimée disparaît aussi pour les consommateurs : ce n'est pas une sauvegarde." }
    e: { en: "Materialized views live in the same namespace and depend on their base tables, so they are not a backup that can be restored.", fr: "Les vues matérialisées résident dans le même espace de noms et dépendent de leurs tables de base : ce ne sont pas des sauvegardes restaurables." }
references:
  - title: Snapshots and recovery points
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-snapshots-recovery-points.html
