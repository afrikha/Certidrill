id: deac01-2b-use-spectrum-external-schema
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company stores sales data as Parquet files in Amazon S3. The tables are defined in the AWS Glue Data Catalog database sales_db. Existing Amazon Redshift reports must join these tables with local Redshift tables by using two-part names such as lake.orders. The data must stay in Amazon S3.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution stocke ses données de ventes sous forme de fichiers Parquet dans Amazon S3. Les tables sont définies dans la base de données sales_db d'AWS Glue Data Catalog. Des rapports Amazon Redshift existants doivent joindre ces tables à des tables Redshift locales en utilisant des noms en deux parties tels que lake.orders. Les données doivent rester dans Amazon S3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run a COPY command for each table every night to load the Parquet files into tables of a local schema named lake.", fr: "Exécuter chaque nuit une commande COPY pour chaque table afin de charger les fichiers Parquet dans les tables d'un schéma local nommé lake." } }
    - { id: b, text: { en: "Run CREATE EXTERNAL SCHEMA lake FROM DATA CATALOG with DATABASE 'sales_db' and an IAM role that is attached to the cluster.", fr: "Exécuter CREATE EXTERNAL SCHEMA lake FROM DATA CATALOG avec DATABASE 'sales_db' et un rôle IAM associé au cluster." } }
    - { id: c, text: { en: "Run CREATE EXTERNAL SCHEMA lake FROM POSTGRES that points to the AWS Glue endpoint of the Region and uses a Secrets Manager secret.", fr: "Exécuter CREATE EXTERNAL SCHEMA lake FROM POSTGRES qui pointe vers le point de terminaison AWS Glue de la Région et utilise un secret Secrets Manager." } }
    - { id: d, text: { en: "Create a datashare named lake in the cluster, and add the sales_db tables of the Data Catalog to the datashare.", fr: "Créer dans le cluster une unité de partage des données (datashare) nommée lake, et y ajouter les tables sales_db du Data Catalog." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An external schema created FROM DATA CATALOG maps a Redshift schema to a Data Catalog database, so Redshift Spectrum queries the S3 files in place through two-part names. The IAM role named in the statement authorizes Redshift to read the Data Catalog and the S3 objects."
    fr: "Un schéma externe créé avec FROM DATA CATALOG associe un schéma Redshift à une base de données du Data Catalog : Redshift Spectrum interroge les fichiers S3 sur place avec des noms en deux parties. Le rôle IAM indiqué dans l'instruction autorise Redshift à lire le Data Catalog et les objets S3."
  options:
    a:
      en: "COPY loads the data into Redshift managed storage, so the data no longer stays only in Amazon S3."
      fr: "COPY charge les données dans le stockage géré de Redshift : les données ne restent plus uniquement dans Amazon S3."
    c:
      en: "FROM POSTGRES creates a federated query schema for an RDS or Aurora PostgreSQL database, not for the Data Catalog."
      fr: "FROM POSTGRES crée un schéma de requêtes fédérées pour une base de données RDS ou Aurora PostgreSQL, pas pour le Data Catalog."
    d:
      en: "Datashares share Redshift objects with other Redshift consumers; they do not expose Data Catalog tables to the producer cluster."
      fr: "Les unités de partage des données partagent des objets Redshift avec d'autres consommateurs Redshift ; elles n'exposent pas les tables du Data Catalog au cluster producteur."
references:
  - title: External schemas in Amazon Redshift Spectrum
    url: https://docs.aws.amazon.com/redshift/latest/dg/c-spectrum-external-schemas.html
