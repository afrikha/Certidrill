id: deac01-2d-dynamodb-sparse-gsi
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company stores 500 million orders in an Amazon DynamoDB table with CustomerId as the partition key and OrderId as the sort key. A dashboard must list the open orders of a customer, which are about 1% of all items. The company wants to avoid scans and to keep the write cost of any index as low as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique stocke 500 millions de commandes dans une table Amazon DynamoDB avec CustomerId comme clé de partition et OrderId comme clé de tri. Un tableau de bord doit lister les commandes ouvertes d'un client, qui représentent environ 1 % des éléments. L'entreprise veut éviter les analyses (scans) et réduire au minimum le coût d'écriture de tout index.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Scan the table with a filter expression that keeps only the open orders of the customer.", fr: "Analyser la table avec une expression de filtre qui ne garde que les commandes ouvertes du client." } }
    - { id: b, text: { en: "Add a local secondary index on an OrderStatus attribute that every order item contains.", fr: "Ajouter un index secondaire local sur un attribut OrderStatus que contient chaque élément de commande." } }
    - { id: c, text: { en: "Create a global secondary index on CustomerId and an OrderStatus attribute that every order item contains.", fr: "Créer un index secondaire global sur CustomerId et un attribut OrderStatus que contient chaque élément de commande." } }
    - { id: d, text: { en: "Write an IsOpen attribute only on open orders, delete it at shipment, and create a global secondary index on CustomerId and IsOpen.", fr: "Écrire un attribut IsOpen uniquement sur les commandes ouvertes, le supprimer à l'expédition, et créer un index secondaire global sur CustomerId et IsOpen." } }
answer: { optionId: d }
explanation:
  correct:
    en: "DynamoDB writes an index entry only when the item contains the index key attributes, so a global secondary index keyed on an attribute that exists only on open orders is sparse. It holds about 1% of the items, which keeps its writes and storage low while the dashboard queries it directly."
    fr: "DynamoDB n'écrit une entrée d'index que si l'élément contient les attributs de clé de l'index : un index secondaire global dont la clé est un attribut présent uniquement sur les commandes ouvertes est creux (sparse). Il contient environ 1 % des éléments, ce qui limite ses écritures et son stockage tandis que le tableau de bord l'interroge directement."
  options:
    a:
      en: "A scan reads the whole table and the filter applies afterward, which the company wants to avoid."
      fr: "Une analyse lit toute la table et le filtre s'applique ensuite, ce que l'entreprise veut éviter."
    b:
      en: "A local secondary index can be created only when the table is created, and an attribute present on every item indexes all orders."
      fr: "Un index secondaire local ne peut être créé qu'à la création de la table, et un attribut présent sur chaque élément indexe toutes les commandes."
    c:
      en: "Because every item has OrderStatus, the index contains all 500 million orders and every write to the table also writes to the index."
      fr: "Comme chaque élément possède OrderStatus, l'index contient les 500 millions de commandes et chaque écriture dans la table écrit aussi dans l'index."
references:
  - title: Take advantage of sparse indexes
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-indexes-general-sparse-indexes.html
