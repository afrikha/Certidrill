id: deac01-2a-s3-express-one-zone-spark
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data science team runs Apache Spark jobs on an Amazon EMR cluster in one Availability Zone. The jobs repeatedly read and write millions of small intermediate files through the Amazon S3 API, and the intermediate data can be regenerated from the source data. Request latency to S3 Standard is now the bottleneck, and request costs are significant.

    Which storage option will provide the lowest latency for the intermediate data?
  fr: |
    Une équipe de science des données exécute des tâches Apache Spark sur un cluster Amazon EMR situé dans une zone de disponibilité. Les tâches lisent et écrivent sans cesse des millions de petits fichiers intermédiaires via l'API Amazon S3, et ces données intermédiaires peuvent être régénérées à partir des données sources. La latence des requêtes vers S3 Standard est désormais le goulot d'étranglement, et le coût des requêtes est important.

    Quelle option de stockage offre la latence la plus faible pour les données intermédiaires ?
body:
  options:
    - { id: a, text: { en: "S3 Standard in a general purpose bucket with S3 Transfer Acceleration enabled", fr: "S3 Standard dans un compartiment à usage général avec S3 Transfer Acceleration activé" } }
    - { id: b, text: { en: "S3 Intelligent-Tiering in a general purpose bucket in the same Region", fr: "S3 Intelligent-Tiering dans un compartiment à usage général de la même Région" } }
    - { id: c, text: { en: "S3 Express One Zone in a directory bucket in the cluster's Availability Zone", fr: "S3 Express One Zone dans un compartiment de répertoire de la zone de disponibilité du cluster" } }
    - { id: d, text: { en: "S3 One Zone-IA in a general purpose bucket in the same Region", fr: "S3 One Zone-IA dans un compartiment à usage général de la même Région" } }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 Express One Zone stores objects in directory buckets in one chosen Availability Zone and gives consistent single-digit millisecond access, up to 10 times faster than S3 Standard, with request costs 80 percent lower. Data is not replicated across zones, which is acceptable for intermediate data that can be regenerated."
    fr: "S3 Express One Zone stocke les objets dans des compartiments de répertoire d'une zone de disponibilité choisie et offre un accès constant de l'ordre de quelques millisecondes, jusqu'à 10 fois plus rapide que S3 Standard, avec des requêtes 80 % moins chères. Les données ne sont pas répliquées entre zones, ce qui est acceptable pour des données intermédiaires régénérables."
  options:
    a:
      en: "Transfer Acceleration speeds up long-distance transfers through edge locations; it does not lower request latency inside the Region."
      fr: "Transfer Acceleration accélère les transferts longue distance via les emplacements périphériques ; il ne réduit pas la latence des requêtes dans la Région."
    b:
      en: "Intelligent-Tiering optimizes storage cost by moving objects between access tiers; it does not lower request latency."
      fr: "Intelligent-Tiering optimise le coût de stockage en déplaçant les objets entre niveaux d'accès ; il ne réduit pas la latence des requêtes."
    d:
      en: "One Zone-IA lowers storage cost for infrequently accessed data and adds retrieval charges; it is not faster than S3 Standard."
      fr: "One Zone-IA réduit le coût de stockage des données peu consultées et ajoute des frais d'extraction ; il n'est pas plus rapide que S3 Standard."
references:
  - title: High performance workloads
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/directory-bucket-high-performance.html
