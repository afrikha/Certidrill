id: deac01-2c-sch-distkey-join
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A provisioned Amazon Redshift cluster stores a sales fact table with 5 billion rows and a customers dimension table with 80 million rows that is updated every day. Most queries join the two tables on customer_id. Query plans show that rows of both tables are redistributed across the nodes for each join.

    Which table design will improve the join performance the MOST?
  fr: |
    Un cluster Amazon Redshift provisionné stocke une table de faits des ventes de 5 milliards de lignes et une table de dimension des clients de 80 millions de lignes mise à jour chaque jour. La plupart des requêtes joignent les deux tables sur customer_id. Les plans de requête montrent que les lignes des deux tables sont redistribuées entre les nœuds à chaque jointure.

    Quelle conception de table améliore le plus les performances de la jointure ?
body:
  options:
    - id: a
      text: { en: "Use DISTSTYLE KEY with customer_id as the distribution key on both the sales table and the customers table.", fr: "Utiliser DISTSTYLE KEY avec customer_id comme clé de distribution sur la table des ventes et sur la table des clients." }
    - id: b
      text: { en: "Use DISTSTYLE ALL on the customers table so that a full copy of it is stored on every node.", fr: "Utiliser DISTSTYLE ALL sur la table des clients afin qu'une copie complète en soit stockée sur chaque nœud." }
    - id: c
      text: { en: "Use DISTSTYLE EVEN on both tables so that their rows are spread evenly across the slices.", fr: "Utiliser DISTSTYLE EVEN sur les deux tables afin que leurs lignes soient réparties uniformément entre les tranches." }
    - id: d
      text: { en: "Define an interleaved sort key on customer_id in the sales table and keep the current distribution styles.", fr: "Définir une clé de tri entrelacée sur customer_id dans la table des ventes et conserver les styles de distribution actuels." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With KEY distribution on the joining column, rows with the same customer_id are stored on the same slice in both tables, so the join runs locally without moving data. Using customer_id also as the sort key can further let the optimizer use a sort merge join.
    fr: |
      Avec une distribution KEY sur la colonne de jointure, les lignes de même customer_id sont stockées sur la même tranche dans les deux tables : la jointure s'exécute localement, sans déplacement de données. Utiliser aussi customer_id comme clé de tri peut en outre permettre à l'optimiseur d'utiliser une jointure par fusion triée.
  options:
    b: { en: "ALL suits small, slow-changing tables; copying an 80-million-row table that changes daily to every node multiplies storage and slows every update.", fr: "ALL convient aux petites tables qui changent peu ; copier sur chaque nœud une table de 80 millions de lignes modifiée chaque jour multiplie le stockage et ralentit chaque mise à jour." }
    c: { en: "EVEN places rows round-robin without regard to customer_id, so matching rows are still on different slices and must be redistributed.", fr: "EVEN place les lignes à tour de rôle sans tenir compte de customer_id : les lignes correspondantes restent sur des tranches différentes et doivent être redistribuées." }
    d: { en: "A sort key orders rows within each slice; it does not place matching rows of the two tables on the same slice.", fr: "Une clé de tri ordonne les lignes au sein de chaque tranche ; elle ne place pas les lignes correspondantes des deux tables sur la même tranche." }
references:
  - title: Distribution styles
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_choosing_dist_sort.html
