id: deac01-2c-lc-unknown-access
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An analytics company stores 400 TB of datasets in S3 Standard. Most objects are larger than 10 MB. Some datasets are queried every day for a few weeks and then not at all, and others are untouched for months and then queried again without warning. Queries need millisecond access. The company wants to lower storage costs without paying retrieval charges and without analyzing access patterns.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'analyse stocke 400 To de jeux de données dans S3 Standard. La plupart des objets dépassent 10 Mo. Certains jeux de données sont interrogés tous les jours pendant quelques semaines puis plus du tout, et d'autres restent inutilisés pendant des mois puis sont de nouveau interrogés sans prévenir. Les requêtes ont besoin d'un accès en quelques millisecondes. L'entreprise veut réduire les coûts de stockage sans payer de frais de récupération et sans analyser les modèles d'accès.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an S3 Lifecycle rule that transitions the objects to S3 Intelligent-Tiering.", fr: "Créer une règle S3 Lifecycle qui fait passer les objets à S3 Intelligent-Tiering." }
    - id: b
      text: { en: "Create an S3 Lifecycle rule that transitions the objects to S3 Standard-IA 30 days after creation.", fr: "Créer une règle S3 Lifecycle qui fait passer les objets à S3 Standard-IA 30 jours après leur création." }
    - id: c
      text: { en: "Create an S3 Lifecycle rule that transitions the objects to S3 Glacier Instant Retrieval 90 days after creation.", fr: "Créer une règle S3 Lifecycle qui fait passer les objets à S3 Glacier Instant Retrieval 90 jours après leur création." }
    - id: d
      text: { en: "Configure S3 Storage Class Analysis on the bucket, and adjust the S3 Lifecycle rules every month from its results.", fr: "Configurer S3 Storage Class Analysis sur le compartiment, et ajuster chaque mois les règles S3 Lifecycle d'après ses résultats." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      S3 Intelligent-Tiering is designed for unknown or changing access patterns: it moves each object between access tiers according to its own access, keeps millisecond access in its automatic tiers, and has no retrieval fees. Objects larger than 128 KB, as here, are monitored and tiered automatically.
    fr: |
      S3 Intelligent-Tiering est conçu pour les modèles d'accès inconnus ou changeants : il déplace chaque objet entre les niveaux d'accès selon ses propres accès, conserve un accès en quelques millisecondes dans ses niveaux automatiques et n'a pas de frais de récupération. Les objets de plus de 128 Ko, comme ici, sont surveillés et déplacés automatiquement.
  options:
    b: { en: "S3 Standard-IA charges a per-GB retrieval fee, which the company would pay each time a dataset becomes active again.", fr: "S3 Standard-IA facture des frais de récupération par Go, que l'entreprise paierait chaque fois qu'un jeu de données redevient actif." }
    c: { en: "S3 Glacier Instant Retrieval also charges per-GB retrieval fees, and datasets queried daily after 90 days would be expensive to read.", fr: "S3 Glacier Instant Retrieval facture aussi des frais de récupération par Go, et les jeux de données interrogés chaque jour après 90 jours coûteraient cher à lire." }
    d: { en: "This requires the access-pattern analysis that the company wants to avoid, and the resulting rules still move objects to classes with retrieval fees.", fr: "Cela demande l'analyse des modèles d'accès que l'entreprise veut éviter, et les règles obtenues déplacent toujours les objets vers des classes avec frais de récupération." }
references:
  - title: How S3 Intelligent-Tiering works
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering-overview.html
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
