id: deac01-2a-redshift-serverless-sporadic
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketing analytics team runs SQL queries on 3 TB of campaign data in Amazon Redshift for a few hours each week, at unpredictable times. The provisioned cluster that hosts the data is idle most of the time. The company wants to keep using Amazon Redshift SQL and its existing tables, stop paying for idle compute, and stop managing nodes and clusters.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une équipe d'analyse marketing exécute des requêtes SQL sur 3 To de données de campagnes dans Amazon Redshift quelques heures par semaine, à des moments imprévisibles. Le cluster provisionné qui héberge les données est inactif la plupart du temps. L'entreprise veut continuer à utiliser le SQL d'Amazon Redshift et ses tables existantes, cesser de payer le calcul inactif et ne plus gérer de nœuds ni de clusters.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Move the data to an Amazon Redshift Serverless workgroup and run the queries there.", fr: "Déplacer les données vers un groupe de travail Amazon Redshift Serverless et y exécuter les requêtes." } }
    - { id: b, text: { en: "Purchase Reserved nodes for the provisioned cluster for a one-year term to lower its rate.", fr: "Acheter des nœuds réservés pour le cluster provisionné sur un an pour baisser son tarif." } }
    - { id: c, text: { en: "Use elastic resize to move the provisioned cluster to a smaller node type.", fr: "Utiliser le redimensionnement élastique pour passer le cluster provisionné à un type de nœud plus petit." } }
    - { id: d, text: { en: "Unload the tables to Amazon S3 and query them from a long-running Amazon EMR cluster with Trino.", fr: "Décharger les tables dans Amazon S3 et les interroger depuis un cluster Amazon EMR permanent avec Trino." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Redshift Serverless keeps the Redshift SQL experience without node management. Compute is measured in RPUs and metered per second with a 60-second minimum, so a workload that runs a few hours a week stops paying for an idle cluster; storage is billed separately."
    fr: "Redshift Serverless conserve l'expérience SQL de Redshift sans gestion de nœuds. Le calcul est mesuré en RPU et facturé à la seconde avec un minimum de 60 secondes : une charge de travail de quelques heures par semaine ne paie plus un cluster inactif ; le stockage est facturé à part."
  options:
    b:
      en: "Reserved nodes lower the hourly rate, but the company still pays for the cluster 24 hours a day and still manages it."
      fr: "Les nœuds réservés baissent le tarif horaire, mais l'entreprise paie toujours le cluster 24 heures sur 24 et continue de le gérer."
    c:
      en: "A smaller cluster still bills for every idle hour and still requires node and cluster management."
      fr: "Un cluster plus petit est toujours facturé à chaque heure d'inactivité et exige toujours la gestion des nœuds et du cluster."
    d:
      en: "This replaces Redshift and its tables with another engine and adds a permanent cluster to manage and pay for."
      fr: "Cela remplace Redshift et ses tables par un autre moteur et ajoute un cluster permanent à gérer et à payer."
references:
  - title: Billing for Amazon Redshift Serverless
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-billing.html
