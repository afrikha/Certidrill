id: deac01-2a-redshift-super-json
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company loads JSON clickstream events into Amazon Redshift. Product teams add new nested attributes every few weeks, and each change currently requires an ALTER TABLE statement and an ETL change; loads fail until both are done. Analysts need SQL access to all attributes, including unnesting the array of products in each event.

    Which solution will meet these requirements with the LEAST maintenance effort?
  fr: |
    Une entreprise charge des événements de parcours de navigation (clickstream) JSON dans Amazon Redshift. Les équipes produit ajoutent de nouveaux attributs imbriqués toutes les quelques semaines, et chaque modification exige aujourd'hui une instruction ALTER TABLE et une modification de l'ETL ; les chargements échouent tant que les deux ne sont pas faites. Les analystes ont besoin d'un accès SQL à tous les attributs, y compris la désimbrication (unnest) du tableau de produits de chaque événement.

    Quelle solution répond à ces exigences avec le MOINS d'effort de maintenance ?
body:
  options:
    - { id: a, text: { en: "Store each event in a VARCHAR(65535) column and extract attributes with JSON_EXTRACT_PATH_TEXT.", fr: "Stocker chaque événement dans une colonne VARCHAR(65535) et extraire les attributs avec JSON_EXTRACT_PATH_TEXT." } }
    - { id: b, text: { en: "Run an AWS Glue crawler on the raw files every day so that it adds the new columns to the Redshift table.", fr: "Exécuter chaque jour un robot d'analyse AWS Glue sur les fichiers bruts pour qu'il ajoute les nouvelles colonnes à la table Redshift." } }
    - { id: c, text: { en: "Flatten every event into a wide table with an AWS Glue job before each load into Redshift.", fr: "Aplatir chaque événement dans une table large avec une tâche AWS Glue avant chaque chargement dans Redshift." } }
    - { id: d, text: { en: "Load each event into a SUPER column with COPY or JSON_PARSE and query it with PartiQL.", fr: "Charger chaque événement dans une colonne SUPER avec COPY ou JSON_PARSE et l'interroger avec PartiQL." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The SUPER data type stores schemaless JSON, including nested arrays and structures, so new attributes need no schema change. PartiQL lets analysts navigate objects and unnest arrays in SQL, and frequently queried attributes can later be shredded into materialized views."
    fr: "Le type de données SUPER stocke du JSON sans schéma, y compris des tableaux et structures imbriqués : les nouveaux attributs n'exigent aucune modification de schéma. PartiQL permet aux analystes de naviguer dans les objets et de désimbriquer les tableaux en SQL, et les attributs souvent interrogés peuvent ensuite être extraits dans des vues matérialisées."
  options:
    a:
      en: "JSON functions re-parse the text on every query and do not unnest arrays of products into rows the way PartiQL does."
      fr: "Les fonctions JSON réanalysent le texte à chaque requête et ne désimbriquent pas les tableaux de produits en lignes comme le fait PartiQL."
    b:
      en: "A crawler updates tables in the AWS Glue Data Catalog; it does not alter local Redshift tables, so the ALTER TABLE and ETL changes remain."
      fr: "Un robot d'analyse met à jour les tables de l'AWS Glue Data Catalog ; il ne modifie pas les tables locales Redshift : les modifications ALTER TABLE et ETL demeurent."
    c:
      en: "A flattening job must be changed each time a new attribute appears, which is the maintenance the company wants to remove."
      fr: "Une tâche d'aplatissement doit être modifiée à chaque nouvel attribut, ce qui est la maintenance que l'entreprise veut supprimer."
references:
  - title: Semi-structured data in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/super-overview.html
