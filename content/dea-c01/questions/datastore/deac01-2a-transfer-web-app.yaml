id: deac01-2a-transfer-web-app
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing agency stores campaign assets and reports in Amazon S3. Its non-technical staff must upload large assets and download reports from a web browser, without installing any file transfer client. The agency already uses IAM Identity Center federated with its external identity provider, and each team may access only its own prefixes. The agency does not want to build or host an application.

    Which solution will meet these requirements?
  fr: |
    Une agence marketing stocke ses ressources de campagne et ses rapports dans Amazon S3. Son personnel non technique doit charger des ressources volumineuses et télécharger des rapports depuis un navigateur web, sans installer de client de transfert de fichiers. L'agence utilise déjà IAM Identity Center fédéré avec son fournisseur d'identité externe, et chaque équipe ne peut accéder qu'à ses propres préfixes. L'agence ne veut ni créer ni héberger d'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Transfer Family SFTP server with service-managed users and give each team a logical home directory.", fr: "Créer un serveur SFTP Transfer Family avec des utilisateurs gérés par le service et donner à chaque équipe un répertoire de base logique." } }
    - { id: b, text: { en: "Create a Transfer Family web app that uses IAM Identity Center and S3 Access Grants for each team's prefixes.", fr: "Créer une application web Transfer Family qui utilise IAM Identity Center et S3 Access Grants pour les préfixes de chaque équipe." } }
    - { id: c, text: { en: "Host a static website on S3 behind CloudFront that requests presigned URLs from an API Gateway and Lambda backend.", fr: "Héberger un site web statique sur S3 derrière CloudFront qui demande des URL présignées à un backend API Gateway et Lambda." } }
    - { id: d, text: { en: "Create an IAM user with console access for each employee and attach a policy that limits the user to the team prefix.", fr: "Créer pour chaque employé un utilisateur IAM avec accès à la console et attacher une politique qui le limite au préfixe de son équipe." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Transfer Family web apps give users a branded browser portal to browse, upload and download S3 data without a client and without servers or code to host. They authenticate through IAM Identity Center, which can be federated with a third-party provider, and S3 Access Grants limits each user to the data granted to them."
    fr: "Les applications web Transfer Family offrent aux utilisateurs un portail personnalisé dans le navigateur pour parcourir, charger et télécharger des données S3 sans client, sans serveur ni code à héberger. Elles authentifient via IAM Identity Center, qui peut être fédéré avec un fournisseur tiers, et S3 Access Grants limite chaque utilisateur aux données qui lui sont accordées."
  options:
    a:
      en: "An SFTP server requires each user to install and operate an SFTP client, and it does not use the IAM Identity Center identities."
      fr: "Un serveur SFTP exige que chaque utilisateur installe et utilise un client SFTP, et il n'utilise pas les identités IAM Identity Center."
    c:
      en: "This works but is a custom application that the agency would have to build, host and maintain."
      fr: "Cela fonctionne, mais c'est une application personnalisée que l'agence devrait créer, héberger et maintenir."
    d:
      en: "IAM users duplicate the federated identities and expose the S3 console to non-technical staff instead of a simple portal."
      fr: "Des utilisateurs IAM dupliquent les identités fédérées et exposent la console S3 au personnel non technique au lieu d'un portail simple."
references:
  - title: Transfer Family web apps
    url: https://docs.aws.amazon.com/transfer/latest/userguide/web-app.html
