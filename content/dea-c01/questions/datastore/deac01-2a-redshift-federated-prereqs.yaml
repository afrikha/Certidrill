id: deac01-2a-redshift-federated-prereqs
objective: "2.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A data engineer is setting up an Amazon Redshift federated query to an Amazon RDS for MySQL database. Network connectivity between the provisioned cluster and the database is already in place, and the database uses user name and password authentication. The engineer will run the following statement:

    ```sql
    CREATE EXTERNAL SCHEMA mysql_orders
    FROM MYSQL
    DATABASE 'orders'
    URI 'orders-db.abc123xyz.us-east-1.rds.amazonaws.com' PORT 3306
    IAM_ROLE 'arn:aws:iam::111122223333:role/RedshiftFederatedRole'
    SECRET_ARN 'arn:aws:secretsmanager:us-east-1:111122223333:secret:orders-db-AbCdEf';
    ```

    Which combination of actions must the engineer complete for the statement and the queries to succeed? (Choose two.)
  fr: |
    Un ingénieur data configure une requête fédérée Amazon Redshift vers une base de données Amazon RDS for MySQL. La connectivité réseau entre le cluster provisionné et la base de données est déjà en place, et la base utilise l'authentification par nom d'utilisateur et mot de passe. L'ingénieur va exécuter l'instruction suivante :

    ```sql
    CREATE EXTERNAL SCHEMA mysql_orders
    FROM MYSQL
    DATABASE 'orders'
    URI 'orders-db.abc123xyz.us-east-1.rds.amazonaws.com' PORT 3306
    IAM_ROLE 'arn:aws:iam::111122223333:role/RedshiftFederatedRole'
    SECRET_ARN 'arn:aws:secretsmanager:us-east-1:111122223333:secret:orders-db-AbCdEf';
    ```

    Quelle combinaison d'actions l'ingénieur doit-il réaliser pour que l'instruction et les requêtes réussissent ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable IAM database authentication on the DB instance and create a database user mapped to the IAM role.", fr: "Activer l'authentification de base de données IAM sur l'instance et créer un utilisateur de base de données pour le rôle IAM." } }
    - { id: b, text: { en: "Store the database user name and password in the AWS Secrets Manager secret that SECRET_ARN references.", fr: "Stocker le nom d'utilisateur et le mot de passe de la base de données dans le secret AWS Secrets Manager référencé par SECRET_ARN." } }
    - { id: c, text: { en: "Install a foreign data wrapper on the RDS for MySQL instance that points to the Redshift cluster.", fr: "Installer sur l'instance RDS for MySQL un wrapper de données externes (foreign data wrapper) qui pointe vers le cluster Redshift." } }
    - { id: d, text: { en: "Associate the role with the cluster, with a trust for redshift.amazonaws.com and a policy that reads the secret.", fr: "Associer le rôle au cluster, avec une approbation de redshift.amazonaws.com et une politique qui lit le secret." } }
    - { id: e, text: { en: "Turn on concurrency scaling for the WLM queue that will run the federated queries.", fr: "Activer la mise à l'échelle de la simultanéité (concurrency scaling) pour la file WLM qui exécute les requêtes fédérées." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Federated queries read the database credentials from an AWS Secrets Manager secret. Redshift accesses that secret through an IAM role whose trust relationship includes redshift.amazonaws.com, whose policy allows reading the secret, and which is associated with the cluster; both ARNs are then given in CREATE EXTERNAL SCHEMA."
    fr: "Les requêtes fédérées lisent les informations d'identification de la base dans un secret AWS Secrets Manager. Redshift accède à ce secret via un rôle IAM dont la relation d'approbation inclut redshift.amazonaws.com, dont la politique autorise la lecture du secret et qui est associé au cluster ; les deux ARN sont ensuite fournis dans CREATE EXTERNAL SCHEMA."
  options:
    a:
      en: "Federated queries require a database that uses user name and password authentication through a secret, not IAM database authentication."
      fr: "Les requêtes fédérées exigent une base qui utilise l'authentification par nom d'utilisateur et mot de passe via un secret, pas l'authentification de base de données IAM."
    c:
      en: "Redshift connects to the database itself; foreign data wrapper access is not supported, and federated queries do not give RDS access to Redshift."
      fr: "Redshift se connecte lui-même à la base ; l'accès par foreign data wrapper n'est pas pris en charge, et les requêtes fédérées ne donnent pas à RDS l'accès à Redshift."
    e:
      en: "Federated queries do not work with concurrency scaling, so this does not help them run."
      fr: "Les requêtes fédérées ne fonctionnent pas avec la mise à l'échelle de la simultanéité : cela ne les aide pas à s'exécuter."
references:
  - title: Creating a secret and an IAM role to use federated queries
    url: https://docs.aws.amazon.com/redshift/latest/dg/federated-create-secret-iam-role.html
  - title: Considerations when accessing federated data with Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/federated-limitations.html
