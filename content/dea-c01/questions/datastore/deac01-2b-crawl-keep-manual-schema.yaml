id: deac01-2b-crawl-keep-manual-schema
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue crawler created a partitioned table for CSV sensor data. Data engineers then edited the table in the Data Catalog to set precise column types and comments. The next crawler run overwrote these edits. The crawler must keep registering new partitions, but it must never change the table schema or add columns, and new partitions must use the table's schema.

    Which crawler configuration will meet these requirements?
  fr: |
    Un robot d'analyse (crawler) AWS Glue a créé une table partitionnée pour des données de capteurs au format CSV. Les ingénieurs de données ont ensuite modifié la table dans le Data Catalog pour définir des types de colonnes précis et des commentaires. L'exécution suivante du robot d'analyse a écrasé ces modifications. Le robot d'analyse doit continuer à enregistrer les nouvelles partitions, mais il ne doit jamais modifier le schéma de la table ni ajouter de colonnes, et les nouvelles partitions doivent utiliser le schéma de la table.

    Quelle configuration du robot d'analyse répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set AddOrUpdateBehavior to MergeNewColumns in the table output configuration of the crawler.", fr: "Définir AddOrUpdateBehavior sur MergeNewColumns dans la configuration de sortie des tables du robot d'analyse." } }
    - { id: b, text: { en: "Set UpdateBehavior to LOG, and set the partitions output AddOrUpdateBehavior to InheritFromTable.", fr: "Définir UpdateBehavior sur LOG, et définir l'AddOrUpdateBehavior de sortie des partitions sur InheritFromTable." } }
    - { id: c, text: { en: "Set DeleteBehavior to DEPRECATE_IN_DATABASE, and keep UpdateBehavior set to UPDATE_IN_DATABASE.", fr: "Définir DeleteBehavior sur DEPRECATE_IN_DATABASE, et conserver UpdateBehavior défini sur UPDATE_IN_DATABASE." } }
    - { id: d, text: { en: "Remove the crawler schedule, and run the crawler on demand only after the engineers approve each run.", fr: "Supprimer la planification du robot d'analyse, et ne l'exécuter à la demande qu'après approbation de chaque exécution par les ingénieurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Setting UpdateBehavior to LOG in the schema change policy keeps the crawler from changing the existing schema and from adding new columns. With InheritFromTable, new and existing partitions take their metadata from the table, while new partitions are still added."
    fr: "Définir UpdateBehavior sur LOG dans la politique de modification de schéma empêche le robot d'analyse de modifier le schéma existant et d'ajouter de nouvelles colonnes. Avec InheritFromTable, les partitions nouvelles et existantes reprennent les métadonnées de la table, tandis que les nouvelles partitions continuent d'être ajoutées."
  options:
    a:
      en: "MergeNewColumns keeps existing columns unchanged but still adds new columns, which the requirements forbid."
      fr: "MergeNewColumns conserve les colonnes existantes mais ajoute toujours de nouvelles colonnes, ce que les exigences interdisent."
    c:
      en: "DeleteBehavior controls what happens to deleted objects; UPDATE_IN_DATABASE still lets the crawler overwrite the schema."
      fr: "DeleteBehavior contrôle ce qui arrive aux objets supprimés ; UPDATE_IN_DATABASE laisse toujours le robot d'analyse écraser le schéma."
    d:
      en: "Each approved run would still overwrite the edited schema, and manual approval adds operational work."
      fr: "Chaque exécution approuvée écraserait toujours le schéma modifié, et l'approbation manuelle ajoute du travail opérationnel."
references:
  - title: Preventing a crawler from changing an existing schema
    url: https://docs.aws.amazon.com/glue/latest/dg/crawler-schema-changes-prevent.html
