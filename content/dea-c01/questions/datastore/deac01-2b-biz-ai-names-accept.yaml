id: deac01-2b-biz-ai-names-accept
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer turned on automated business name generation for an AWS Glue data source in Amazon SageMaker Unified Studio, in a supported AWS Region. After the next data source run, the generated names appear on the assets in the project inventory with a sparkle icon. The engineer then publishes the assets, but consumers searching the catalog see only the technical table and column names.

    What should the data engineer do so that consumers see the generated business names?
  fr: |
    Un ingénieur de données a activé la génération automatisée de noms métier pour une source de données AWS Glue dans Amazon SageMaker Unified Studio, dans une Région AWS prise en charge. Après l'exécution suivante de la source de données, les noms générés apparaissent sur les ressources de l'inventaire du projet avec une icône d'étincelle. L'ingénieur publie ensuite les ressources, mais les consommateurs qui recherchent dans le catalogue ne voient que les noms techniques des tables et des colonnes.

    Que doit faire l'ingénieur de données pour que les consommateurs voient les noms métier générés ?
body:
  options:
    - { id: a, text: { en: "Enable model access to the foundation model in Amazon Bedrock, and run the data source again.", fr: "Activer l'accès au modèle de fondation dans Amazon Bedrock, puis exécuter à nouveau la source de données." } }
    - { id: b, text: { en: "Accept or edit the generated metadata on the assets, and then publish the assets again.", fr: "Accepter ou modifier les métadonnées générées sur les ressources, puis publier à nouveau les ressources." } }
    - { id: c, text: { en: "Rename the columns of the Glue tables with the generated names, and run a crawler.", fr: "Renommer les colonnes des tables Glue avec les noms générés, puis exécuter un robot d'analyse." } }
    - { id: d, text: { en: "Attach a metadata form that contains the generated names to each asset of the data source.", fr: "Associer à chaque ressource de la source de données un formulaire de métadonnées qui contient les noms générés." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Generated metadata is marked with an icon and must be accepted, edited or rejected by a publisher. If an asset is published while its generated metadata is still unreviewed, that metadata is not included in the published asset, so the engineer must accept it and publish again."
    fr: "Les métadonnées générées sont signalées par une icône et doivent être acceptées, modifiées ou rejetées par un éditeur. Si une ressource est publiée alors que ses métadonnées générées n'ont pas été examinées, ces métadonnées ne sont pas incluses dans la ressource publiée : l'ingénieur doit les accepter puis republier."
  options:
    a:
      en: "The names were already generated, as the sparkle icons show; the issue is the review step, not model access."
      fr: "Les noms ont déjà été générés, comme le montrent les icônes d'étincelle ; le problème est l'étape d'examen, pas l'accès au modèle."
    c:
      en: "Renaming technical columns changes the source tables and their consumers; business names are catalog metadata, not column names."
      fr: "Renommer des colonnes techniques modifie les tables sources et leurs consommateurs ; les noms métier sont des métadonnées du catalogue, pas des noms de colonnes."
    d:
      en: "Copying the names into a form duplicates work and does not publish the generated business names, which remain unreviewed."
      fr: "Recopier les noms dans un formulaire duplique le travail et ne publie pas les noms métier générés, qui restent non examinés."
references:
  - title: Using machine learning and generative AI in Amazon SageMaker Unified Studio
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/autodoc.html
