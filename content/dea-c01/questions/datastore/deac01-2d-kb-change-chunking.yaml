id: deac01-2d-kb-change-chunking
objective: "2.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal services company has an Amazon Bedrock knowledge base with one Amazon S3 data source that was created with default chunking. Retrieval quality is poor because chunks often cut through the middle of a legal argument. The company wants the existing documents to be chunked with semantic chunking and wants to keep the same knowledge base, embeddings model and vector store.

    Which solution will meet these requirements?
  fr: |
    Un cabinet de services juridiques dispose d'une base de connaissances Amazon Bedrock avec une source de données Amazon S3 créée avec le découpage par défaut. La qualité de la récupération est médiocre car les segments coupent souvent un argumentaire juridique en son milieu. L'entreprise veut que les documents existants soient découpés avec le découpage sémantique et veut conserver la même base de connaissances, le même modèle de vectorisation (embeddings) et le même magasin de vecteurs (vector store).

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Edit the existing data source to select semantic chunking, and then sync the data source.", fr: "Modifier la source de données existante pour sélectionner le découpage sémantique, puis synchroniser la source de données." } }
    - { id: b, text: { en: "Call UpdateKnowledgeBase with a semantic chunking configuration, and then sync the data source.", fr: "Appeler UpdateKnowledgeBase avec une configuration de découpage sémantique, puis synchroniser la source de données." } }
    - { id: c, text: { en: "Create a new data source for the same S3 location with semantic chunking, sync it, and remove the original data source.", fr: "Créer une nouvelle source de données pour le même emplacement S3 avec le découpage sémantique, la synchroniser, puis retirer la source de données d'origine." } }
    - { id: d, text: { en: "Create a new knowledge base with a different embeddings model that supports semantic chunking, and sync it.", fr: "Créer une nouvelle base de connaissances avec un autre modèle de vectorisation qui prend en charge le découpage sémantique, puis la synchroniser." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The chunking strategy is set on the data source and cannot be changed after the data source is connected. A new data source in the same knowledge base can use semantic chunking for the same S3 location; syncing it re-chunks and re-embeds the documents with the existing embeddings model and vector store."
    fr: "La stratégie de découpage est définie sur la source de données et ne peut plus être modifiée une fois la source connectée. Une nouvelle source de données dans la même base de connaissances peut utiliser le découpage sémantique pour le même emplacement S3 ; sa synchronisation découpe de nouveau les documents et génère de nouveau leurs vectorisations (embeddings) avec le modèle de vectorisation et le magasin de vecteurs existants."
  options:
    a:
      en: "The chunking strategy of a data source cannot be edited once the data source is connected."
      fr: "La stratégie de découpage d'une source de données ne peut pas être modifiée une fois la source connectée."
    b:
      en: "UpdateKnowledgeBase can change only the name, description and role, and chunking is a data source setting, not a knowledge base setting."
      fr: "UpdateKnowledgeBase ne peut modifier que le nom, la description et le rôle, et le découpage est un paramètre de la source de données, pas de la base de connaissances."
    d:
      en: "Semantic chunking does not depend on a different embeddings model, and the company wants to keep the same knowledge base and model."
      fr: "Le découpage sémantique ne dépend pas d'un autre modèle de vectorisation, et l'entreprise veut conserver la même base de connaissances et le même modèle."
references:
  - title: Connect to Amazon S3 for your knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
  - title: UpdateKnowledgeBase
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_UpdateKnowledgeBase.html
