id: deac01-2c-sch-sortkey-time
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores clickstream events in an Amazon Redshift table. Most queries filter on the event_time column to read the last 7 days of data, but they scan almost all of the table's blocks. The data engineer must reduce the number of blocks that these queries read.

    Which table design change will meet this requirement?
  fr: |
    Une entreprise stocke des événements de parcours de navigation (clickstream) dans une table Amazon Redshift. La plupart des requêtes filtrent sur la colonne event_time pour lire les 7 derniers jours de données, mais elles analysent presque tous les blocs de la table. L'ingénieur des données doit réduire le nombre de blocs lus par ces requêtes.

    Quelle modification de la conception de la table permet de répondre à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Define event_time as the distribution key of the table.", fr: "Définir event_time comme clé de distribution de la table." }
    - id: b
      text: { en: "Apply the BYTEDICT compression encoding to the event_time column.", fr: "Appliquer l'encodage de compression BYTEDICT à la colonne event_time." }
    - id: c
      text: { en: "Define a compound sort key with event_time as its leading column.", fr: "Définir une clé de tri composée avec event_time comme première colonne." }
    - id: d
      text: { en: "Change the distribution style of the table to DISTSTYLE ALL.", fr: "Changer le style de distribution de la table en DISTSTYLE ALL." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Redshift stores data in sort key order and keeps the minimum and maximum values of each block (zone maps). With the timestamp as the leading sort key column, a filter on recent event_time values skips every block outside the time range.
    fr: |
      Redshift stocke les données dans l'ordre de la clé de tri et conserve les valeurs minimale et maximale de chaque bloc (zone maps). Avec l'horodatage comme première colonne de la clé de tri, un filtre sur des valeurs récentes d'event_time ignore tous les blocs hors de la plage de temps.
  options:
    a: { en: "The distribution key decides on which slice rows are stored; it does not let a range filter skip blocks, and recent data would concentrate on few slices.", fr: "La clé de distribution décide sur quelle tranche les lignes sont stockées ; elle ne permet pas à un filtre de plage d'ignorer des blocs, et les données récentes se concentreraient sur peu de tranches." }
    b: { en: "Encoding reduces storage; BYTEDICT suits low-cardinality columns and does not let queries skip blocks.", fr: "L'encodage réduit le stockage ; BYTEDICT convient aux colonnes à faible cardinalité et ne permet pas aux requêtes d'ignorer des blocs." }
    d: { en: "ALL copies the whole table to every node, which increases storage and does not reduce the blocks scanned by a filter.", fr: "ALL copie toute la table sur chaque nœud, ce qui augmente le stockage sans réduire les blocs analysés par un filtre." }
references:
  - title: Choose the best sort key
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_best-practices-sort-key.html
