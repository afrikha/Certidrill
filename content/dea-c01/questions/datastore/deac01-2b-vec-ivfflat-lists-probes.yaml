id: deac01-2b-vec-ivfflat-lists-probes
objective: "2.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company has loaded 400,000 article embeddings into an Amazon DocumentDB collection. Because the data is already loaded and index build time matters, the data engineer chooses an IVFFlat vector index. The engineer wants to start from the values that AWS recommends for the index and for the query, and then fine-tune them. Queries must use the index.

    Which settings should the data engineer start with?
  fr: |
    Une entreprise de médias a chargé 400 000 vectorisations d'articles dans une collection Amazon DocumentDB. Comme les données sont déjà chargées et que la durée de construction de l'index compte, l'ingénieur de données choisit un index vectoriel IVFFlat. Il veut partir des valeurs recommandées par AWS pour l'index et pour la requête, puis les affiner. Les requêtes doivent utiliser l'index.

    Avec quels paramètres l'ingénieur de données doit-il commencer ?
body:
  options:
    - { id: a, text: { en: "lists set to 632 when creating the index, and probes set to 25 in the queries", fr: "lists défini à 632 lors de la création de l'index, et probes défini à 25 dans les requêtes" } }
    - { id: b, text: { en: "lists set to 400 when creating the index, and probes set to 400 in the queries", fr: "lists défini à 400 lors de la création de l'index, et probes défini à 400 dans les requêtes" } }
    - { id: c, text: { en: "lists set to 20 when creating the index, and probes set to 1 in the queries", fr: "lists défini à 20 lors de la création de l'index, et probes défini à 1 dans les requêtes" } }
    - { id: d, text: { en: "lists set to 400 when creating the index, and probes set to 20 in the queries", fr: "lists défini à 400 lors de la création de l'index, et probes défini à 20 dans les requêtes" } }
answer: { optionId: d }
explanation:
  correct:
    en: "For up to 1 million documents, the recommended lists value is the number of documents divided by 1,000, which is 400 here. The recommended starting point for probes is the square root of the number of lists, which is 20. Higher probes values then trade speed for recall."
    fr: "Jusqu'à 1 million de documents, la valeur recommandée de lists est le nombre de documents divisé par 1 000, soit 400 ici. Le point de départ recommandé pour probes est la racine carrée du nombre de listes, soit 20. Des valeurs de probes plus élevées échangent ensuite de la vitesse contre du rappel."
  options:
    a:
      en: "The square root of the document count is the recommendation for collections of more than 1 million documents, not for 400,000."
      fr: "La racine carrée du nombre de documents est la recommandation pour les collections de plus de 1 million de documents, pas pour 400 000."
    b:
      en: "Setting probes to the number of lists makes the search exact, and the planner then no longer uses the index."
      fr: "Définir probes au nombre de listes rend la recherche exacte, et le planificateur n'utilise alors plus l'index."
    c:
      en: "Twenty lists is far below the recommendation for 400,000 documents, so each list holds too many vectors and queries stay slow."
      fr: "Vingt listes est très en dessous de la recommandation pour 400 000 documents : chaque liste contient trop de vecteurs et les requêtes restent lentes."
references:
  - title: Vector search for Amazon DocumentDB
    url: https://docs.aws.amazon.com/documentdb/latest/developerguide/vector-search.html
