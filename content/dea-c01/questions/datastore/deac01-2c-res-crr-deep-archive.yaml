id: deac01-2c-res-crr-deep-archive
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company keeps its data lake in a versioning-enabled Amazon S3 bucket in us-east-1. A regulator requires a second copy of every new object in another AWS Region. The copy will be used only if the primary Region is lost, and restoring the data within 48 hours is acceptable. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conserve son lac de données dans un compartiment Amazon S3 avec gestion des versions activée dans us-east-1. Un régulateur exige une deuxième copie de chaque nouvel objet dans une autre Région AWS. La copie ne servira qu'en cas de perte de la Région principale, et une restauration des données en 48 heures est acceptable. L'entreprise veut la solution la plus rentable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure S3 Same-Region Replication to another bucket in us-east-1 with S3 Glacier Deep Archive as the replica storage class.", fr: "Configurer S3 Same-Region Replication vers un autre compartiment de us-east-1 avec S3 Glacier Deep Archive comme classe de stockage des réplicas." }
    - id: b
      text: { en: "Configure S3 Cross-Region Replication to a bucket in us-west-2 with S3 Standard as the replica storage class.", fr: "Configurer S3 Cross-Region Replication vers un compartiment de us-west-2 avec S3 Standard comme classe de stockage des réplicas." }
    - id: c
      text: { en: "Configure S3 Cross-Region Replication to a bucket in us-west-2 with S3 Glacier Deep Archive as the replica storage class.", fr: "Configurer S3 Cross-Region Replication vers un compartiment de us-west-2 avec S3 Glacier Deep Archive comme classe de stockage des réplicas." }
    - id: d
      text: { en: "Configure S3 Cross-Region Replication to a bucket in us-west-2 with S3 One Zone-IA as the replica storage class.", fr: "Configurer S3 Cross-Region Replication vers un compartiment de us-west-2 avec S3 One Zone-IA comme classe de stockage des réplicas." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A replication rule can set the storage class of the replicas, so new objects are copied to the other Region directly in S3 Glacier Deep Archive, the lowest-cost class. Bulk restores from Deep Archive typically finish within 48 hours, which the recovery requirement allows.
    fr: |
      Une règle de réplication peut définir la classe de stockage des réplicas : les nouveaux objets sont copiés dans l'autre Région directement en S3 Glacier Deep Archive, la classe la moins chère. Les restaurations en bloc (Bulk) depuis Deep Archive se terminent généralement en 48 heures, ce que permet l'exigence de récupération.
  options:
    a: { en: "Same-Region Replication keeps the copy in us-east-1, so it does not survive the loss of the primary Region.", fr: "Same-Region Replication conserve la copie dans us-east-1 : elle ne survit pas à la perte de la Région principale." }
    b: { en: "S3 Standard gives immediate access that the company does not need, at a much higher storage price than an archive class.", fr: "S3 Standard offre un accès immédiat dont l'entreprise n'a pas besoin, à un prix de stockage bien plus élevé qu'une classe d'archivage." }
    d: { en: "One Zone-IA costs more than Deep Archive for data that is almost never read, and it stores the copy in a single Availability Zone.", fr: "One Zone-IA coûte plus cher que Deep Archive pour des données presque jamais lues, et stocke la copie dans une seule zone de disponibilité." }
references:
  - title: Replication configuration file elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-add-config.html
  - title: Understanding archive retrieval options
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html
