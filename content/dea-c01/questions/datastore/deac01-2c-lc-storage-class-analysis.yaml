id: deac01-2c-lc-storage-class-analysis
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps reporting extracts in S3 Standard under a reports/ prefix. The data team believes that the extracts are rarely read after a few weeks but does not know after how many days. The team wants an S3 Lifecycle rule that transitions the extracts to S3 Standard-IA at the age that the observed access data supports. The team does not want per-object monitoring charges after the transition or a custom log-processing pipeline.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conserve des extraits de rapports dans S3 Standard sous un préfixe reports/. L'équipe des données pense que les extraits sont rarement lus après quelques semaines, mais ne sait pas au bout de combien de jours. L'équipe veut une règle S3 Lifecycle qui fait passer les extraits à S3 Standard-IA à l'âge que justifient les accès observés. L'équipe ne veut ni frais de surveillance par objet après la transition ni pipeline personnalisé de traitement des journaux.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure a daily S3 Inventory report for the prefix, and set the transition age from the last modified dates that it lists.", fr: "Configurer un rapport S3 Inventory quotidien pour le préfixe, et fixer l'âge de transition d'après les dates de dernière modification qu'il liste." }
    - id: b
      text: { en: "Turn on AWS CloudTrail data events for the prefix, and query the logs with Amazon Athena to find when reads stop.", fr: "Activer les événements de données AWS CloudTrail pour le préfixe, et interroger les journaux avec Amazon Athena pour savoir quand les lectures s'arrêtent." }
    - id: c
      text: { en: "Create an S3 Lifecycle rule that transitions the extracts to S3 Intelligent-Tiering, and let it choose the tier of each object.", fr: "Créer une règle S3 Lifecycle qui fait passer les extraits à S3 Intelligent-Tiering, et le laisser choisir le niveau de chaque objet." }
    - id: d
      text: { en: "Configure S3 Storage Class Analysis with a filter on the prefix, and use its recommended object age once the analysis completes.", fr: "Configurer S3 Storage Class Analysis avec un filtre sur le préfixe, et utiliser l'âge d'objet recommandé une fois l'analyse terminée." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Storage Class Analysis observes the access patterns of a filtered group of objects, usually for about 30 days, and recommends the object age at which to transition from S3 Standard to S3 Standard-IA. The team then writes that age in the lifecycle rule, with no pipeline to build.
    fr: |
      Storage Class Analysis observe les modèles d'accès d'un groupe d'objets filtré, généralement pendant environ 30 jours, et recommande l'âge d'objet auquel passer de S3 Standard à S3 Standard-IA. L'équipe inscrit ensuite cet âge dans la règle de cycle de vie, sans pipeline à construire.
  options:
    a: { en: "S3 Inventory lists objects and their metadata, such as last modified dates, but does not record how often objects are read.", fr: "S3 Inventory liste les objets et leurs métadonnées, comme les dates de dernière modification, mais n'enregistre pas la fréquence de lecture des objets." }
    b: { en: "This is the custom log-processing pipeline that the team wants to avoid, and data events add charges for every request.", fr: "C'est le pipeline personnalisé de traitement des journaux que l'équipe veut éviter, et les événements de données ajoutent des frais pour chaque requête." }
    c: { en: "Intelligent-Tiering charges a monthly monitoring and automation fee per object and does not keep the data in S3 Standard-IA.", fr: "Intelligent-Tiering facture des frais mensuels de surveillance et d'automatisation par objet et ne conserve pas les données dans S3 Standard-IA." }
references:
  - title: Amazon S3 analytics – Storage Class Analysis
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/analytics-storage-class.html
