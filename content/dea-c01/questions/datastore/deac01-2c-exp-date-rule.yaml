id: deac01-2c-exp-date-rule
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data engineer wants to delete, one time, all objects that were written under the legacy/ prefix of an Amazon S3 bucket before a migration. The engineer creates an S3 Lifecycle rule with a legacy/ prefix filter and an Expiration action with the Date element set to 2026-12-31. A partner application still writes new objects to legacy/, and those new objects must be kept.

    Which statement describes the result of this rule?
  fr: |
    Un ingénieur des données veut supprimer, une seule fois, tous les objets écrits sous le préfixe legacy/ d'un compartiment Amazon S3 avant une migration. L'ingénieur crée une règle S3 Lifecycle avec un filtre de préfixe legacy/ et une action Expiration dont l'élément Date est défini au 2026-12-31. Une application partenaire écrit toujours de nouveaux objets dans legacy/, et ces nouveaux objets doivent être conservés.

    Quelle affirmation décrit le résultat de cette règle ?
body:
  options:
    - id: a
      text: { en: "Only objects created before 2026-12-31 expire, and objects that the partner writes after that date are kept.", fr: "Seuls les objets créés avant le 2026-12-31 expirent, et les objets que le partenaire écrit après cette date sont conservés." }
    - id: b
      text: { en: "From 2026-12-31, all objects under legacy/ expire, including those written later, for as long as the rule stays enabled.", fr: "À partir du 2026-12-31, tous les objets sous legacy/ expirent, y compris ceux écrits plus tard, tant que la règle reste activée." }
    - id: c
      text: { en: "The rule runs once on 2026-12-31 and is then disabled automatically, so later objects are kept.", fr: "La règle s'exécute une fois le 2026-12-31, puis est désactivée automatiquement : les objets ultérieurs sont conservés." }
    - id: d
      text: { en: "S3 rejects the rule, because an Expiration action with a Date element cannot be combined with a prefix filter.", fr: "S3 rejette la règle, car une action Expiration avec un élément Date ne peut pas être combinée à un filtre de préfixe." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A date-based rule is not a one-time action: on and after the date, it keeps applying to every object that matches the filter while the rule is enabled, including new objects. To keep the partner's new objects, the engineer must disable or delete the rule once the cleanup is done.
    fr: |
      Une règle basée sur une date n'est pas une action ponctuelle : à partir de cette date, elle continue de s'appliquer à tous les objets correspondant au filtre tant que la règle est activée, y compris aux nouveaux objets. Pour conserver les nouveaux objets du partenaire, l'ingénieur doit désactiver ou supprimer la règle une fois le nettoyage terminé.
  options:
    a: { en: "The Date element does not compare object creation dates with the date; objects written later also match the rule.", fr: "L'élément Date ne compare pas les dates de création des objets à la date ; les objets écrits plus tard correspondent aussi à la règle." }
    c: { en: "Lifecycle rules do not disable themselves; the rule keeps applying until someone disables or deletes it.", fr: "Les règles de cycle de vie ne se désactivent pas d'elles-mêmes ; la règle continue de s'appliquer jusqu'à ce que quelqu'un la désactive ou la supprime." }
    d: { en: "A Date-based Expiration action can be used with any filter, including a prefix filter.", fr: "Une action Expiration basée sur une date peut être utilisée avec n'importe quel filtre, y compris un filtre de préfixe." }
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
