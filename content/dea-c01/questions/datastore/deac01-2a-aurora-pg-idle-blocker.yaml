id: deac01-2a-aurora-pg-idle-blocker
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nightly batch UPDATE on an Amazon Aurora PostgreSQL-Compatible Edition cluster is waiting on the Lock:transactionid wait event. The pg_stat_activity view shows that a reporting user's session has been in the idle in transaction state for 3 hours and holds row locks on the same rows. A database administrator must release the locks immediately without restarting or failing over the cluster.

    What should the administrator do?
  fr: |
    Une mise à jour (UPDATE) par lots nocturne sur un cluster Amazon Aurora PostgreSQL-Compatible Edition attend sur l'événement d'attente Lock:transactionid. La vue pg_stat_activity montre que la session d'un utilisateur de reporting est dans l'état idle in transaction depuis 3 heures et détient des verrous de ligne sur les mêmes lignes. Un administrateur de bases de données doit libérer les verrous immédiatement sans redémarrer le cluster ni effectuer de basculement.

    Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Reboot the writer instance of the cluster.", fr: "Redémarrer l'instance d'écriture du cluster." } }
    - { id: b, text: { en: "Run pg_cancel_backend on the pid of the idle session.", fr: "Exécuter pg_cancel_backend sur le pid de la session inactive." } }
    - { id: c, text: { en: "Run pg_terminate_backend on the pid of the idle session.", fr: "Exécuter pg_terminate_backend sur le pid de la session inactive." } }
    - { id: d, text: { en: "Set lock_timeout to 5s in the batch job's session.", fr: "Définir lock_timeout à 5s dans la session de la tâche par lots." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Lock:transactionid means that a session waits for a row lock held by another transaction, and the wait ends only when that transaction commits or rolls back. pg_terminate_backend ends the idle session, which rolls back its open transaction and releases the row locks; the lasting fix is to make the reporting client end its transactions."
    fr: "Lock:transactionid signifie qu'une session attend un verrou de ligne détenu par une autre transaction, et l'attente ne cesse que lorsque cette transaction est validée ou annulée. pg_terminate_backend met fin à la session inactive, ce qui annule sa transaction ouverte et libère les verrous de ligne ; la correction durable consiste à faire terminer ses transactions par le client de reporting."
  options:
    a:
      en: "A reboot releases the locks but restarts the database for every user, which the administrator must avoid."
      fr: "Un redémarrage libère les verrous, mais relance la base de données pour tous les utilisateurs, ce que l'administrateur doit éviter."
    b:
      en: "pg_cancel_backend cancels the query that a session is running; an idle session runs no query, so its transaction and locks remain."
      fr: "pg_cancel_backend annule la requête qu'une session exécute ; une session inactive n'exécute aucune requête : sa transaction et ses verrous demeurent."
    d:
      en: "lock_timeout makes the batch statement give up waiting with an error; it does not release the locks of the idle session."
      fr: "lock_timeout fait abandonner l'attente de l'instruction par lots avec une erreur ; il ne libère pas les verrous de la session inactive."
references:
  - title: Lock:transactionid
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/apg-waits.locktransactionid.html
