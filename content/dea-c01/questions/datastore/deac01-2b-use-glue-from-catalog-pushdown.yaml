id: deac01-2b-use-glue-from-catalog-pushdown
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue ETL job processes one day of clickstream data at a time. The data is stored in Amazon S3 under Hive-style prefixes such as dt=2026-11-20/ and is cataloged as the table clicks in the Data Catalog database web, partitioned by dt. The job must use the schema defined in the Data Catalog and must not list or read the files of the other partitions.

    Which code should the job use to read the data?
  fr: |
    Une tâche ETL AWS Glue traite une journée de données de parcours de navigation (clickstream) à la fois. Les données sont stockées dans Amazon S3 sous des préfixes de style Hive tels que dt=2026-11-20/ et sont cataloguées comme table clicks dans la base de données web du Data Catalog, partitionnée par dt. La tâche doit utiliser le schéma défini dans le Data Catalog et ne doit ni lister ni lire les fichiers des autres partitions.

    Quel code la tâche doit-elle utiliser pour lire les données ?
body:
  options:
    - { id: a, text: "glueContext.create_dynamic_frame.from_catalog(database=\"web\", table_name=\"clicks\", push_down_predicate=\"dt = '2026-11-20'\")" }
    - { id: b, text: "glueContext.create_dynamic_frame.from_catalog(database=\"web\", table_name=\"clicks\").filter(lambda r: r[\"dt\"] == \"2026-11-20\")" }
    - { id: c, text: "glueContext.create_dynamic_frame.from_options(connection_type=\"s3\", connection_options={\"paths\": [\"s3://example-clicks/\"]}, format=\"parquet\")" }
    - { id: d, text: "spark.read.parquet(\"s3://example-clicks/\").where(\"dt = '2026-11-20'\")" }
answer: { optionId: a }
explanation:
  correct:
    en: "from_catalog reads the table through its Data Catalog definition, and push_down_predicate filters the partitions from the catalog metadata before any file is listed or read. Only the files under dt=2026-11-20/ are processed."
    fr: "from_catalog lit la table au moyen de sa définition dans le Data Catalog, et push_down_predicate filtre les partitions à partir des métadonnées du catalogue avant de lister ou de lire le moindre fichier. Seuls les fichiers sous dt=2026-11-20/ sont traités."
  options:
    b:
      en: "The filter runs after the DynamicFrame is created, so the job first lists and reads the files of every partition."
      fr: "Le filtre s'exécute après la création du DynamicFrame : la tâche commence par lister et lire les fichiers de toutes les partitions."
    c:
      en: "from_options reads the S3 path directly and ignores the Data Catalog schema, and it reads the whole prefix."
      fr: "from_options lit directement le chemin S3 et ignore le schéma du Data Catalog, et il lit tout le préfixe."
    d:
      en: "Reading the path with Spark bypasses the Data Catalog definition and infers the schema from the files instead."
      fr: "Lire le chemin avec Spark contourne la définition du Data Catalog et déduit plutôt le schéma des fichiers."
references:
  - title: GlueContext class
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-crawler-pyspark-extensions-glue-context.html
