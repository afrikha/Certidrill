id: deac01-2c-del-lock-then-expire
objective: "2.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A financial services company will store trade confirmations in a new Amazon S3 bucket. A regulation requires that each object stay immutable for 7 years and that no user, including the root user, can delete or overwrite it during that time. After 7 years, the objects must be permanently deleted automatically so that the company stops paying for their storage.

    Which combination of actions will meet these requirements? (Choose three.)
  fr: |
    Une entreprise de services financiers va stocker des confirmations de transactions dans un nouveau compartiment Amazon S3. Une réglementation exige que chaque objet reste immuable pendant 7 ans et qu'aucun utilisateur, y compris l'utilisateur racine, ne puisse le supprimer ou l'écraser pendant cette période. Après 7 ans, les objets doivent être supprimés définitivement et automatiquement afin que l'entreprise cesse de payer leur stockage.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create the bucket with S3 Object Lock and a default retention of 7 years in compliance mode.", fr: "Créer le compartiment avec S3 Object Lock et une conservation par défaut de 7 ans en mode conformité (compliance)." } }
    - { id: b, text: { en: "Create the bucket with S3 Object Lock and a default retention of 7 years in governance mode.", fr: "Créer le compartiment avec S3 Object Lock et une conservation par défaut de 7 ans en mode gouvernance (governance)." } }
    - { id: c, text: { en: "Add an S3 Lifecycle rule with an Expiration action for current versions 7 years after creation.", fr: "Ajouter une règle S3 Lifecycle avec une action Expiration pour les versions actuelles 7 ans après leur création." } }
    - { id: d, text: { en: "Place an S3 Object Lock legal hold on each object when it is uploaded.", fr: "Placer une conservation légale (legal hold) S3 Object Lock sur chaque objet lors de son chargement." } }
    - { id: e, text: { en: "Add an S3 Lifecycle rule that transitions objects to S3 Glacier Deep Archive 7 years after creation.", fr: "Ajouter une règle S3 Lifecycle qui fait passer les objets à S3 Glacier Deep Archive 7 ans après leur création." } }
    - { id: f, text: { en: "Add an S3 Lifecycle rule with a NoncurrentVersionExpiration action 1 day after objects become noncurrent.", fr: "Ajouter une règle S3 Lifecycle avec une action NoncurrentVersionExpiration 1 jour après que les objets deviennent non actuels." } }
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: |
      Compliance mode prevents every user, including the root user, from deleting or overwriting a locked version or shortening its retention. Object Lock requires versioning, so the Expiration action only adds a delete marker and makes the version noncurrent; NoncurrentVersionExpiration then permanently deletes it, which S3 does only once the version is no longer locked.
    fr: |
      Le mode conformité empêche tout utilisateur, y compris l'utilisateur racine, de supprimer ou d'écraser une version verrouillée ou de raccourcir sa conservation. Object Lock exige la gestion des versions : l'action Expiration ajoute seulement un marqueur de suppression et rend la version non actuelle ; NoncurrentVersionExpiration la supprime ensuite définitivement, ce que S3 ne fait qu'une fois la version déverrouillée.
  options:
    b: { en: "In governance mode, users with the s3:BypassGovernanceRetention permission can delete objects early, which the regulation forbids.", fr: "En mode gouvernance, les utilisateurs disposant de l'autorisation s3:BypassGovernanceRetention peuvent supprimer des objets plus tôt, ce que la réglementation interdit." }
    d: { en: "A legal hold has no expiration date, so it would block the automatic deletion after 7 years until someone removes it.", fr: "Une conservation légale n'a pas de date d'expiration : elle bloquerait la suppression automatique après 7 ans jusqu'à ce que quelqu'un la retire." }
    e: { en: "A transition keeps the objects and their storage charges instead of deleting them.", fr: "Une transition conserve les objets et leurs frais de stockage au lieu de les supprimer." }
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
  - title: Expiring objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-expire-general-considerations.html
