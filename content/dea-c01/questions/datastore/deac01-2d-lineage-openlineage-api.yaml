id: deac01-2d-lineage-openlineage-api
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company catalogs its data lake assets in Amazon SageMaker Catalog. Part of the data is produced by an in-house ETL tool that runs on premises and writes to Amazon S3. Lineage for AWS Glue jobs already appears in the catalog. The company wants each run of the in-house tool to appear in the same lineage graph, with its input and output datasets and column-level mappings.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle catalogue les ressources de son lac de données dans Amazon SageMaker Catalog. Une partie des données est produite par un outil ETL interne qui s'exécute sur site et écrit dans Amazon S3. Le lignage des tâches AWS Glue apparaît déjà dans le catalogue. L'entreprise veut que chaque exécution de l'outil interne apparaisse dans le même graphe de lignage, avec ses jeux de données d'entrée et de sortie et les correspondances au niveau des colonnes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach a custom metadata form to each output asset that lists its upstream datasets and columns.", fr: "Attacher à chaque ressource de sortie un formulaire de métadonnées personnalisé qui liste ses jeux de données et colonnes en amont." } }
    - { id: b, text: { en: "Create SageMaker ML Lineage Tracking artifacts for the datasets, and link them with AddAssociation calls.", fr: "Créer des artefacts SageMaker ML Lineage Tracking pour les jeux de données, puis les relier avec des appels AddAssociation." } }
    - { id: c, text: { en: "Send an OpenLineage run event for each tool run, with a columnLineage facet, by calling the PostLineageEvent API.", fr: "Envoyer un événement d'exécution OpenLineage pour chaque exécution de l'outil, avec une facette columnLineage, en appelant l'API PostLineageEvent." } }
    - { id: d, text: { en: "Add S3 object tags that name the source system and the job to every file the tool writes.", fr: "Ajouter à chaque fichier écrit par l'outil des balises d'objet S3 qui nomment le système source et la tâche." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Data lineage in SageMaker Unified Studio is OpenLineage-compatible and accepts lineage from systems outside AWS through APIs. PostLineageEvent takes an OpenLineage RunEvent with the job, its inputs and outputs, and a columnLineage facet that maps output fields to input fields, so the runs join the graph next to the Glue lineage."
    fr: "Le lignage des données de SageMaker Unified Studio est compatible OpenLineage et accepte le lignage de systèmes extérieurs à AWS via des API. PostLineageEvent reçoit un RunEvent OpenLineage avec la tâche, ses entrées et sorties, et une facette columnLineage qui associe les champs de sortie aux champs d'entrée : les exécutions rejoignent le graphe à côté du lignage Glue."
  options:
    a:
      en: "Metadata forms add descriptive fields to assets, but they do not create nodes and edges in the lineage graph."
      fr: "Les formulaires de métadonnées ajoutent des champs descriptifs aux ressources, mais ils ne créent ni nœuds ni arêtes dans le graphe de lignage."
    b:
      en: "ML Lineage Tracking keeps its own graph of SageMaker AI entities, separate from the lineage graph of SageMaker Catalog."
      fr: "ML Lineage Tracking tient son propre graphe d'entités SageMaker AI, distinct du graphe de lignage de SageMaker Catalog."
    d:
      en: "Object tags are stored on S3 objects only; the catalog does not build lineage from them, and they carry no column mappings."
      fr: "Les balises d'objet sont stockées uniquement sur les objets S3 ; le catalogue n'en déduit pas de lignage, et elles ne contiennent aucune correspondance de colonnes."
references:
