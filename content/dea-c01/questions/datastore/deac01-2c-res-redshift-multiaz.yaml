id: deac01-2c-res-redshift-multiaz
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs operational dashboards on a provisioned Amazon Redshift cluster with RA3 nodes in a single Availability Zone. The dashboards must keep running if an entire Availability Zone fails, with no data loss. Applications must keep using the same endpoint, and recovery time must be as short as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des tableaux de bord opérationnels sur un cluster Amazon Redshift provisionné à nœuds RA3 dans une seule zone de disponibilité. Les tableaux de bord doivent continuer de fonctionner en cas de panne d'une zone de disponibilité entière, sans perte de données. Les applications doivent continuer d'utiliser le même point de terminaison, et le temps de récupération doit être le plus court possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable cross-Region snapshot copy, and restore the cluster in another AWS Region if the Availability Zone fails.", fr: "Activer la copie d'instantanés entre Régions, et restaurer le cluster dans une autre Région AWS si la zone de disponibilité tombe en panne." }
    - id: b
      text: { en: "Enable concurrency scaling on the cluster so that extra capacity can serve the dashboards during a failure.", fr: "Activer la mise à l'échelle de la simultanéité (concurrency scaling) sur le cluster afin qu'une capacité supplémentaire serve les tableaux de bord pendant une panne." }
    - id: c
      text: { en: "Convert the cluster to a Multi-AZ deployment so that compute runs in two Availability Zones behind one endpoint.", fr: "Convertir le cluster en déploiement Multi-AZ afin que le calcul s'exécute dans deux zones de disponibilité derrière un seul point de terminaison." }
    - id: d
      text: { en: "Take a manual snapshot every hour, and restore the latest snapshot to a new cluster in another Availability Zone after a failure.", fr: "Prendre un instantané manuel toutes les heures, et restaurer le dernier instantané dans un nouveau cluster d'une autre zone de disponibilité après une panne." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Redshift Multi-AZ deployment, available for provisioned RA3 and RG clusters, places compute in two Availability Zones reached through a single endpoint. If a whole zone fails, the compute in the other zone keeps processing, with a zero recovery point objective and a shorter recovery time than a restore.
    fr: |
      Un déploiement Redshift Multi-AZ, disponible pour les clusters provisionnés RA3 et RG, place le calcul dans deux zones de disponibilité accessibles par un seul point de terminaison. Si une zone entière tombe en panne, le calcul de l'autre zone poursuit le traitement, avec un objectif de point de récupération nul et un temps de récupération plus court qu'une restauration.
  options:
    a: { en: "A restore from a copied snapshot loses the changes made after the snapshot and creates a new cluster with a different endpoint.", fr: "Une restauration à partir d'un instantané copié perd les modifications postérieures à l'instantané et crée un nouveau cluster avec un autre point de terminaison." }
    b: { en: "Concurrency scaling adds capacity for bursts of queries; it does not protect the main cluster against the loss of its Availability Zone.", fr: "La mise à l'échelle de la simultanéité ajoute de la capacité pour les pics de requêtes ; elle ne protège pas le cluster principal contre la perte de sa zone de disponibilité." }
    d: { en: "Hourly snapshots can lose up to an hour of data, and the restored cluster has a new endpoint and a long recovery time.", fr: "Des instantanés horaires peuvent perdre jusqu'à une heure de données, et le cluster restauré a un nouveau point de terminaison et un long temps de récupération." }
references:
  - title: Multi-AZ deployment
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/managing-cluster-multi-az.html
