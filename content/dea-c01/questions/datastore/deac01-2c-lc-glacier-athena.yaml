id: deac01-2c-lc-glacier-athena
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company queries a Hive table partitioned by year with Amazon Athena engine version 3. An S3 Lifecycle rule transitions the table's objects to S3 Glacier Flexible Retrieval 2 years after creation. Queries on older years now return no rows and no error. Once a year, an auditor must query one past year and can wait several hours for the data. The company wants to keep the lifecycle rule.

    Which solution will meet these requirements?
  fr: |
    Une entreprise interroge une table Hive partitionnée par année avec le moteur Amazon Athena version 3. Une règle S3 Lifecycle fait passer les objets de la table à S3 Glacier Flexible Retrieval 2 ans après leur création. Les requêtes sur les années anciennes ne renvoient désormais aucune ligne et aucune erreur. Une fois par an, un auditeur doit interroger une année passée et peut attendre plusieurs heures les données. L'entreprise veut conserver la règle de cycle de vie.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run MSCK REPAIR TABLE on the table so that Athena reloads the partitions of the archived years before the audit.", fr: "Exécuter MSCK REPAIR TABLE sur la table afin qu'Athena recharge les partitions des années archivées avant l'audit." }
    - id: b
      text: { en: "Add a second S3 Lifecycle rule that transitions the objects of the audited year back to S3 Standard before the audit.", fr: "Ajouter une deuxième règle S3 Lifecycle qui fait repasser les objets de l'année auditée à S3 Standard avant l'audit." }
    - id: c
      text: { en: "Restore the objects of the audited year, then set the read_restored_glacier_objects table property to true and run the query.", fr: "Restaurer les objets de l'année auditée, puis définir la propriété de table read_restored_glacier_objects à true et exécuter la requête." }
    - id: d
      text: { en: "Configure partition projection on the table so that Athena computes the partitions of the archived years.", fr: "Configurer la projection de partitions sur la table afin qu'Athena calcule les partitions des années archivées." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Athena skips S3 Glacier Flexible Retrieval and S3 Glacier Deep Archive objects, and it does not restore them. After the objects are restored, setting read_restored_glacier_objects to true on the Hive table (engine version 3) lets Athena read the restored copies while the lifecycle rule stays in place.
    fr: |
      Athena ignore les objets S3 Glacier Flexible Retrieval et S3 Glacier Deep Archive, et ne les restaure pas. Une fois les objets restaurés, définir read_restored_glacier_objects à true sur la table Hive (moteur version 3) permet à Athena de lire les copies restaurées, tandis que la règle de cycle de vie reste en place.
  options:
    a: { en: "The partitions are already registered; the rows are missing because Athena skips archived objects, not because partitions are unknown.", fr: "Les partitions sont déjà enregistrées ; les lignes manquent parce qu'Athena ignore les objets archivés, et non parce que les partitions sont inconnues." }
    b: { en: "S3 Lifecycle cannot transition objects out of S3 Glacier Flexible Retrieval to S3 Standard; only a restore followed by a copy can change the class.", fr: "S3 Lifecycle ne peut pas faire repasser des objets de S3 Glacier Flexible Retrieval à S3 Standard ; seule une restauration suivie d'une copie peut changer la classe." }
    d: { en: "Partition projection changes how partitions are found, but Athena still skips the archived objects inside them.", fr: "La projection de partitions change la façon de trouver les partitions, mais Athena ignore toujours les objets archivés qu'elles contiennent." }
references:
  - title: Query restored Amazon Glacier objects
    url: https://docs.aws.amazon.com/athena/latest/ug/querying-glacier.html
  - title: Transitioning objects using Amazon S3 Lifecycle
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
