id: deac01-2c-lc-small-objects
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores clickstream events in Amazon S3 as individual JSON objects of 10–60 KB under an events/ prefix. In 2026, a data engineer created an S3 Lifecycle rule that transitions objects in events/ to S3 Glacier Flexible Retrieval 180 days after creation. Months later, the objects are still in S3 Standard. The events must be kept for 7 years and are rarely read. The company wants to minimize total storage and request costs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des événements de parcours de navigation (clickstream) dans Amazon S3 sous forme d'objets JSON individuels de 10 à 60 Ko sous un préfixe events/. En 2026, un ingénieur des données a créé une règle S3 Lifecycle qui fait passer les objets de events/ à S3 Glacier Flexible Retrieval 180 jours après leur création. Des mois plus tard, les objets sont toujours dans S3 Standard. Les événements doivent être conservés 7 ans et sont rarement lus. L'entreprise veut réduire au minimum le coût total du stockage et des requêtes.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an object size filter to the rule so that objects smaller than 128 KB are also transitioned to S3 Glacier Flexible Retrieval.", fr: "Ajouter un filtre de taille d'objet à la règle afin que les objets de moins de 128 Ko passent aussi à S3 Glacier Flexible Retrieval." }
    - id: b
      text: { en: "Use a scheduled AWS Glue job to combine each day's events into large Parquet objects, transition those objects, and expire the small originals.", fr: "Utiliser une tâche AWS Glue planifiée pour regrouper les événements de chaque jour en gros objets Parquet, faire passer ces objets et faire expirer les petits originaux." }
    - id: c
      text: { en: "Change the rule to transition the objects to S3 Intelligent-Tiering, and activate its Deep Archive Access tier.", fr: "Modifier la règle pour faire passer les objets à S3 Intelligent-Tiering, et activer son niveau Deep Archive Access." }
    - id: d
      text: { en: "Change the rule to transition the objects to S3 Standard-IA 30 days after creation instead.", fr: "Modifier plutôt la règle pour faire passer les objets à S3 Standard-IA 30 jours après leur création." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Since September 2024, S3 Lifecycle does not transition objects smaller than 128 KB by default. Each object moved to S3 Glacier Flexible Retrieval also adds 40 KB of metadata and a billable transition request, so aggregating the small events into a few large objects is what makes archiving them cheap.
    fr: |
      Depuis septembre 2024, S3 Lifecycle ne fait pas passer par défaut les objets de moins de 128 Ko. Chaque objet déplacé vers S3 Glacier Flexible Retrieval ajoute aussi 40 Ko de métadonnées et une requête de transition facturée : regrouper les petits événements en quelques gros objets est ce qui rend leur archivage peu coûteux.
  options:
    a: { en: "The filter overrides the default, but every 10–60 KB object then carries 40 KB of extra metadata and its own transition request, which can cost more than it saves.", fr: "Le filtre remplace le comportement par défaut, mais chaque objet de 10 à 60 Ko porte alors 40 Ko de métadonnées supplémentaires et sa propre requête de transition, ce qui peut coûter plus qu'il ne fait économiser." }
    c: { en: "S3 Intelligent-Tiering does not monitor objects smaller than 128 KB; they always stay in the Frequent Access tier.", fr: "S3 Intelligent-Tiering ne surveille pas les objets de moins de 128 Ko ; ils restent toujours dans le niveau Frequent Access." }
    d: { en: "Objects smaller than 128 KB are not transitioned by default either, and S3 Standard-IA bills each object as at least 128 KB.", fr: "Les objets de moins de 128 Ko ne sont pas non plus déplacés par défaut, et S3 Standard-IA facture chaque objet comme s'il faisait au moins 128 Ko." }
references:
  - title: Transitioning objects using Amazon S3 Lifecycle
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
