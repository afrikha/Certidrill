id: deac01-2b-conn-multi-private-endpoints
objective: "2.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue ETL job uses a JDBC connection to an Amazon RDS for PostgreSQL database in an isolated private subnet. The subnet has no NAT gateway and no internet access, and a gateway VPC endpoint for Amazon S3 is already in its route table. The job writes its output to a Data Catalog table, and the Data Catalog is encrypted at rest with a customer managed AWS KMS key. The job now fails when it calls the AWS Glue and AWS KMS APIs.

    Which combination of actions will resolve the issue without giving the subnet internet access? (Choose two.)
  fr: |
    Une tâche ETL AWS Glue utilise une connexion JDBC vers une base de données Amazon RDS for PostgreSQL située dans un sous-réseau privé isolé. Le sous-réseau n'a ni passerelle NAT ni accès à Internet, et un point de terminaison de VPC de type passerelle pour Amazon S3 figure déjà dans sa table de routage. La tâche écrit sa sortie dans une table du Data Catalog, et le Data Catalog est chiffré au repos avec une clé AWS KMS gérée par le client. La tâche échoue désormais lorsqu'elle appelle les API AWS Glue et AWS KMS.

    Quelle combinaison d'actions résout le problème sans donner d'accès Internet au sous-réseau ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an interface VPC endpoint for AWS KMS in the VPC.", fr: "Créer un point de terminaison de VPC d'interface pour AWS KMS dans le VPC." } }
    - { id: b, text: { en: "Create an interface VPC endpoint for AWS Glue with private DNS enabled.", fr: "Créer un point de terminaison de VPC d'interface pour AWS Glue avec le DNS privé activé." } }
    - { id: c, text: { en: "Assign public IP addresses to the network interfaces that AWS Glue creates.", fr: "Attribuer des adresses IP publiques aux interfaces réseau créées par AWS Glue." } }
    - { id: d, text: { en: "Create a gateway VPC endpoint for Amazon DynamoDB in the route table.", fr: "Créer un point de terminaison de VPC de type passerelle pour Amazon DynamoDB dans la table de routage." } }
    - { id: e, text: { en: "Add a second gateway VPC endpoint for Amazon S3 to the route table.", fr: "Ajouter un second point de terminaison de VPC de type passerelle pour Amazon S3 à la table de routage." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Without internet access, AWS Glue needs VPC endpoints to reach AWS services from the connection's subnet. When the Data Catalog is encrypted, AWS recommends creating the KMS interface endpoint, and the AWS Glue interface endpoint lets resources in the VPC call all AWS Glue API actions privately."
    fr: "Sans accès Internet, AWS Glue a besoin de points de terminaison de VPC pour atteindre les services AWS depuis le sous-réseau de la connexion. Lorsque le Data Catalog est chiffré, AWS recommande de créer le point de terminaison d'interface KMS, et le point de terminaison d'interface AWS Glue permet aux ressources du VPC d'appeler en privé toutes les actions de l'API AWS Glue."
  options:
    c:
      en: "Glue network interfaces are not assigned public IP addresses, and public addresses would require internet access, which is not allowed."
      fr: "Les interfaces réseau Glue ne reçoivent pas d'adresse IP publique, et des adresses publiques exigeraient un accès Internet, ce qui n'est pas autorisé."
    d:
      en: "The job does not use DynamoDB; a DynamoDB endpoint does not carry Glue or KMS API calls."
      fr: "La tâche n'utilise pas DynamoDB ; un point de terminaison DynamoDB ne transporte pas les appels aux API Glue ou KMS."
    e:
      en: "S3 access already works through the existing gateway endpoint; a second one changes nothing for the Glue and KMS APIs."
      fr: "L'accès à S3 fonctionne déjà au moyen du point de terminaison de type passerelle existant ; un second ne change rien pour les API Glue et KMS."
references:
  - title: Connecting to a JDBC data store in a VPC
    url: https://docs.aws.amazon.com/glue/latest/dg/connection-JDBC-VPC.html
  - title: Configuring interface VPC endpoints (AWS PrivateLink) for AWS Glue (AWS PrivateLink)
    url: https://docs.aws.amazon.com/glue/latest/dg/vpc-interface-endpoints.html
