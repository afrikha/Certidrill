id: deac01-2b-crawl-multi-exclude-sample
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Spark jobs write CSV files to s3://example-metrics/daily/ in thousands of leaf folders. Each folder also contains a _SUCCESS marker file and .crc checksum files. An AWS Glue crawler on the prefix creates extra tables and wrong columns from these files, and it reads every CSV file although the schema has not changed for two years. The data engineer must keep the marker and checksum files out of the catalog and reduce the crawler run time.

    Which combination of crawler settings will meet these requirements? (Choose two.)
  fr: |
    Des tâches Spark écrivent des fichiers CSV dans s3://example-metrics/daily/ répartis dans des milliers de dossiers feuilles. Chaque dossier contient aussi un fichier marqueur _SUCCESS et des fichiers de somme de contrôle .crc. Un robot d'analyse (crawler) AWS Glue sur le préfixe crée des tables supplémentaires et des colonnes erronées à partir de ces fichiers, et il lit chaque fichier CSV alors que le schéma n'a pas changé depuis deux ans. L'ingénieur de données doit tenir les fichiers marqueurs et de somme de contrôle à l'écart du catalogue et réduire la durée d'exécution du robot d'analyse.

    Quelle combinaison de paramètres du robot d'analyse répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the exclude patterns **_SUCCESS and **.crc to the S3 data source.", fr: "Ajouter les modèles d'exclusion **_SUCCESS et **.crc à la source de données S3." } }
    - { id: b, text: { en: "Set the sample size of the S3 data source to 10 files.", fr: "Définir la taille d'échantillon de la source de données S3 à 10 fichiers." } }
    - { id: c, text: { en: "Set the DeleteBehavior of the schema change policy to DELETE_FROM_DATABASE.", fr: "Définir le DeleteBehavior de la politique de modification de schéma sur DELETE_FROM_DATABASE." } }
    - { id: d, text: { en: "Add a custom grok classifier that matches the _SUCCESS and .crc files.", fr: "Ajouter un classificateur grok personnalisé qui correspond aux fichiers _SUCCESS et .crc." } }
    - { id: e, text: { en: "Set the table threshold of the crawler to 1 table.", fr: "Définir le seuil de tables du robot d'analyse à 1 table." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Exclude patterns use glob syntax relative to the include path, and ** crosses folder boundaries, so these patterns skip the marker and checksum files in every folder. A sample size limits the number of files crawled in each leaf folder, which significantly reduces run time for data whose schema does not change."
    fr: "Les modèles d'exclusion utilisent la syntaxe glob relative au chemin d'inclusion, et ** traverse les limites de dossiers : ces modèles ignorent les fichiers marqueurs et de somme de contrôle de tous les dossiers. Une taille d'échantillon limite le nombre de fichiers analysés dans chaque dossier feuille, ce qui réduit fortement la durée d'exécution pour des données dont le schéma ne change pas."
  options:
    c:
      en: "DeleteBehavior acts on tables and partitions whose objects were deleted; it does not stop the crawler from reading these files."
      fr: "DeleteBehavior agit sur les tables et partitions dont les objets ont été supprimés ; il n'empêche pas le robot d'analyse de lire ces fichiers."
    d:
      en: "A classifier that matches these files would classify them and still produce tables, instead of keeping them out of the catalog."
      fr: "Un classificateur qui correspond à ces fichiers les classerait et produirait toujours des tables, au lieu de les tenir à l'écart du catalogue."
    e:
      en: "A table threshold makes the crawler fail when it would create more tables; it neither filters the files nor shortens the crawl."
      fr: "Un seuil de tables fait échouer le robot d'analyse lorsqu'il créerait davantage de tables ; il ne filtre pas les fichiers et ne raccourcit pas l'analyse."
references:
  - title: "Step 2: Choose data sources and classifiers"
    url: https://docs.aws.amazon.com/glue/latest/dg/define-crawler-choose-data-sources.html
