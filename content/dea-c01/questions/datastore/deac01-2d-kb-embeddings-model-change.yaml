id: deac01-2d-kb-embeddings-model-change
objective: "2.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company has an Amazon Bedrock knowledge base that uses Amazon Titan Embeddings G1 - Text, which produces 1,536-dimension vectors, with an Amazon OpenSearch Serverless vector index. The company wants to move to Amazon Titan Text Embeddings V2 with 1,024 dimensions for all of its documents.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels dispose d'une base de connaissances Amazon Bedrock qui utilise Amazon Titan Embeddings G1 - Text, qui produit des vecteurs de 1 536 dimensions, avec un index vectoriel Amazon OpenSearch Serverless. L'entreprise veut passer à Amazon Titan Text Embeddings V2 avec 1 024 dimensions pour tous ses documents.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a new knowledge base with Titan Text Embeddings V2 and a new vector index with 1,024 dimensions, and sync its data sources.", fr: "Créer une nouvelle base de connaissances avec Titan Text Embeddings V2 et un nouvel index vectoriel de 1 024 dimensions, puis synchroniser ses sources de données." } }
    - { id: b, text: { en: "Call UpdateKnowledgeBase with the Titan Text Embeddings V2 model ARN, and then sync the data sources.", fr: "Appeler UpdateKnowledgeBase avec l'ARN du modèle Titan Text Embeddings V2, puis synchroniser les sources de données." } }
    - { id: c, text: { en: "Delete and re-upload all documents in the S3 data sources, and then sync the data sources.", fr: "Supprimer puis charger de nouveau tous les documents des sources de données S3, puis synchroniser les sources de données." } }
    - { id: d, text: { en: "Change the dimension of the existing vector field to 1,024 in the OpenSearch Serverless index mapping.", fr: "Changer la dimension du champ vectoriel existant en 1 024 dans le mappage de l'index OpenSearch Serverless." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The embeddings model is part of the knowledge base configuration, which UpdateKnowledgeBase cannot change. A new knowledge base with the new model and a vector index whose dimension matches it re-embeds every document when its data sources are synced, because queries and chunks must be embedded with the same model."
    fr: "Le modèle de vectorisation (embeddings) fait partie de la configuration de la base de connaissances, qu'UpdateKnowledgeBase ne peut pas modifier. Une nouvelle base de connaissances avec le nouveau modèle et un index vectoriel de dimension correspondante génère de nouveau les vectorisations de chaque document lors de la synchronisation de ses sources de données, car les requêtes et les segments doivent être convertis en vectorisations avec le même modèle."
  options:
    b:
      en: "UpdateKnowledgeBase can change only the name, description and role; the knowledgeBaseConfiguration must stay the same as at creation."
      fr: "UpdateKnowledgeBase ne peut modifier que le nom, la description et le rôle ; knowledgeBaseConfiguration doit rester identique à celle de la création."
    c:
      en: "A sync re-ingests the changed documents with the embeddings model configured on the knowledge base, which is still Titan Embeddings G1 - Text."
      fr: "Une synchronisation ingère de nouveau les documents modifiés avec le modèle de vectorisation configuré sur la base de connaissances, qui reste Titan Embeddings G1 - Text."
    d:
      en: "The knowledge base would still generate 1,536-dimension vectors with its configured model, which no longer match the index."
      fr: "La base de connaissances générerait toujours des vecteurs de 1 536 dimensions avec son modèle configuré, qui ne correspondraient plus à l'index."
references:
  - title: UpdateKnowledgeBase
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_UpdateKnowledgeBase.html
  - title: Supported models and Regions for Amazon Bedrock knowledge bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-supported.html
