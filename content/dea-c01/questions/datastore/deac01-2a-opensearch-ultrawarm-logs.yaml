id: deac01-2a-opensearch-ultrawarm-logs
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores application logs in daily indexes on an Amazon OpenSearch Service domain that runs OpenSearch 2.x with dedicated master nodes. Logs are written once and never updated. Engineers often query the last 7 days, and they must still search and visualize logs up to 180 days old in OpenSearch Dashboards, but less often. Hot storage for 180 days is too expensive.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise stocke ses journaux d'application dans des index quotidiens d'un domaine Amazon OpenSearch Service qui exécute OpenSearch 2.x avec des nœuds maîtres dédiés. Les journaux sont écrits une fois et jamais modifiés. Les ingénieurs interrogent souvent les 7 derniers jours, et ils doivent encore pouvoir rechercher et visualiser dans OpenSearch Dashboards les journaux de 180 jours au plus, mais moins souvent. Le stockage à chaud sur 180 jours est trop coûteux.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Add hot data nodes with larger EBS volumes so the domain can hold 180 days of indexes.", fr: "Ajouter des nœuds de données chauds avec des volumes EBS plus grands pour que le domaine contienne 180 jours d'index." } }
    - { id: b, text: { en: "Use an Index State Management policy that moves indexes older than 7 days to cold storage.", fr: "Utiliser une politique Index State Management qui déplace les index de plus de 7 jours vers le stockage à froid." } }
    - { id: c, text: { en: "Use an Index State Management policy that moves indexes older than 7 days to UltraWarm storage.", fr: "Utiliser une politique Index State Management qui déplace les index de plus de 7 jours vers le stockage UltraWarm." } }
    - { id: d, text: { en: "Take snapshots of indexes older than 7 days to Amazon S3, delete them and restore them when needed.", fr: "Prendre des instantanés des index de plus de 7 jours dans Amazon S3, les supprimer et les restaurer au besoin." } }
answer: { optionId: c }
explanation:
  correct:
    en: "UltraWarm stores read-only indexes on Amazon S3 with a caching layer, charges only for the data stored and has no replica overhead. Warm indexes stay searchable with the same APIs and visible in OpenSearch Dashboards, and Index State Management moves them automatically by age. The domain meets the requirements: version 6.8 or later and dedicated master nodes."
    fr: "UltraWarm stocke des index en lecture seule sur Amazon S3 avec une couche de cache, ne facture que les données stockées et n'ajoute pas de surcoût de réplicas. Les index tièdes restent interrogeables avec les mêmes API et visibles dans OpenSearch Dashboards, et Index State Management les déplace automatiquement selon leur âge. Le domaine remplit les conditions : version 6.8 ou ultérieure et nœuds maîtres dédiés."
  options:
    a:
      en: "Keeping 180 days on hot nodes is the expensive design the company wants to leave."
      fr: "Conserver 180 jours sur des nœuds chauds est la conception coûteuse que l'entreprise veut abandonner."
    b:
      en: "Cold indexes cannot be searched until they are migrated back to warm storage, so engineers could not query them directly."
      fr: "Les index froids ne peuvent pas être interrogés avant d'être replacés en stockage tiède : les ingénieurs ne pourraient pas les interroger directement."
    d:
      en: "Deleted indexes are not searchable until a restore, which adds manual steps every time older logs are needed."
      fr: "Les index supprimés ne sont pas interrogeables avant une restauration, ce qui ajoute des étapes manuelles chaque fois que des journaux plus anciens sont nécessaires."
references:
  - title: UltraWarm storage for Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ultrawarm.html
