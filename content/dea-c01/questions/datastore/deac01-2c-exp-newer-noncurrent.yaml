id: deac01-2c-exp-newer-noncurrent
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores reference data files under the reference/ prefix of a versioning-enabled Amazon S3 bucket. Data pipelines overwrite each file several times a day. Compliance rules require the company to keep the current version and the three most recent previous versions of each file. Older versions must be deleted 1 day after they become noncurrent.

    Which S3 Lifecycle configuration will meet these requirements?
  fr: |
    Une entreprise stocke des fichiers de données de référence sous le préfixe reference/ d'un compartiment Amazon S3 avec gestion des versions activée. Des pipelines de données écrasent chaque fichier plusieurs fois par jour. Les règles de conformité exigent de conserver la version actuelle et les trois versions précédentes les plus récentes de chaque fichier. Les versions plus anciennes doivent être supprimées 1 jour après être devenues non actuelles.

    Quelle configuration S3 Lifecycle permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "A rule with a reference/ prefix filter and an Expiration action that expires objects 1 day after creation", fr: "Une règle avec un filtre de préfixe reference/ et une action Expiration qui fait expirer les objets 1 jour après leur création" }
    - id: b
      text: { en: "A rule with a reference/ prefix filter and a NoncurrentVersionExpiration action with NoncurrentDays set to 3", fr: "Une règle avec un filtre de préfixe reference/ et une action NoncurrentVersionExpiration avec NoncurrentDays défini à 3" }
    - id: c
      text: { en: "Versioning suspended on the bucket, and a rule with an Expiration action that sets ExpiredObjectDeleteMarker to true", fr: "La gestion des versions suspendue sur le compartiment, et une règle avec une action Expiration qui définit ExpiredObjectDeleteMarker à true" }
    - id: d
      text: { en: "A rule with a reference/ prefix filter and a NoncurrentVersionExpiration action with NoncurrentDays 1 and NewerNoncurrentVersions 3", fr: "Une règle avec un filtre de préfixe reference/ et une action NoncurrentVersionExpiration avec NoncurrentDays à 1 et NewerNoncurrentVersions à 3" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      NewerNoncurrentVersions keeps the stated number of most recent noncurrent versions, and NoncurrentDays sets how long a version must have been noncurrent before it is deleted; both conditions must be exceeded. The rule needs a Filter element when NewerNoncurrentVersions is set, which the prefix filter provides.
    fr: |
      NewerNoncurrentVersions conserve le nombre indiqué de versions non actuelles les plus récentes, et NoncurrentDays fixe depuis combien de temps une version doit être non actuelle avant d'être supprimée ; les deux conditions doivent être dépassées. La règle exige un élément Filter quand NewerNoncurrentVersions est défini, ce que fournit le filtre de préfixe.
  options:
    a: { en: "In a versioned bucket, Expiration only adds a delete marker to the current version, which hides the current file and deletes no old version.", fr: "Dans un compartiment versionné, Expiration ajoute seulement un marqueur de suppression à la version actuelle, ce qui masque le fichier actuel sans supprimer d'ancienne version." }
    b: { en: "Age alone does not keep a fixed number of versions: with several overwrites a day, versions among the three most recent would be deleted after 3 days.", fr: "L'âge seul ne conserve pas un nombre fixe de versions : avec plusieurs écrasements par jour, des versions parmi les trois plus récentes seraient supprimées après 3 jours." }
    c: { en: "With versioning suspended, each overwrite replaces the null version, so the previous versions required by compliance are no longer kept.", fr: "Avec la gestion des versions suspendue, chaque écrasement remplace la version null : les versions précédentes exigées par la conformité ne sont plus conservées." }
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
  - title: Expiring objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-expire-general-considerations.html
