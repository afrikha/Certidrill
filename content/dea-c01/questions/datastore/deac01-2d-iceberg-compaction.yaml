id: deac01-2d-iceberg-compaction
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company writes streaming micro-batches every minute into Apache Iceberg tables that are registered in the AWS Glue Data Catalog. The tables now contain hundreds of thousands of small data files, and Amazon Athena queries are slowing down. The company wants the small files to be merged automatically, without building or scheduling any jobs.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de médias écrit chaque minute des micro-lots de streaming dans des tables Apache Iceberg enregistrées dans le AWS Glue Data Catalog. Les tables contiennent désormais des centaines de milliers de petits fichiers de données, et les requêtes Amazon Athena ralentissent. L'entreprise veut que les petits fichiers soient fusionnés automatiquement, sans créer ni planifier de tâches.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Enable the compaction table optimizer of the AWS Glue Data Catalog on the Iceberg tables.", fr: "Activer l'optimiseur de table de compactage du AWS Glue Data Catalog sur les tables Iceberg." } }
    - { id: b, text: { en: "Run the Athena VACUUM statement on each table every hour with an Amazon EventBridge schedule.", fr: "Exécuter l'instruction Athena VACUUM sur chaque table toutes les heures avec une planification Amazon EventBridge." } }
    - { id: c, text: { en: "Run OPTIMIZE REWRITE DATA USING BIN_PACK on each table from an AWS Step Functions workflow on a schedule.", fr: "Exécuter OPTIMIZE REWRITE DATA USING BIN_PACK sur chaque table depuis un flux de travail AWS Step Functions planifié." } }
    - { id: d, text: { en: "Apply an S3 Lifecycle rule that transitions the table's data files to S3 Intelligent-Tiering.", fr: "Appliquer une règle S3 Lifecycle qui fait passer les fichiers de données de la table vers S3 Intelligent-Tiering." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Glue Data Catalog provides managed table optimizers for Iceberg tables. Compaction merges small data files into larger ones, with the binpack, sort or z-order strategy, and can run automatically once it is enabled on the table, so no job has to be built or scheduled."
    fr: "Le Glue Data Catalog fournit des optimiseurs de table gérés pour les tables Iceberg. Le compactage fusionne les petits fichiers de données en fichiers plus gros, avec la stratégie binpack, sort ou z-order, et peut s'exécuter automatiquement une fois activé sur la table : aucune tâche n'est à créer ni à planifier."
  options:
    b:
      en: "VACUUM expires old snapshots and removes orphan files; it does not merge small data files, and it still needs a schedule."
      fr: "VACUUM fait expirer les anciens instantanés et supprime les fichiers orphelins ; il ne fusionne pas les petits fichiers de données, et il exige toujours une planification."
    c:
      en: "OPTIMIZE with BIN_PACK does compact the files, but a scheduled workflow is extra infrastructure to build and run, which fails the LEAST operational overhead requirement."
      fr: "OPTIMIZE avec BIN_PACK compacte bien les fichiers, mais un flux de travail planifié est une infrastructure supplémentaire à créer et à exploiter, ce qui ne respecte pas l'exigence du MOINS de charge opérationnelle."
    d:
      en: "A storage class change can lower storage cost but leaves the number and size of files unchanged."
      fr: "Un changement de classe de stockage peut réduire le coût de stockage, mais laisse inchangés le nombre et la taille des fichiers."
references:
  - title: Optimizing Iceberg tables
    url: https://docs.aws.amazon.com/glue/latest/dg/table-optimizers.html
  - title: OPTIMIZE
    url: https://docs.aws.amazon.com/athena/latest/ug/optimize-statement.html
