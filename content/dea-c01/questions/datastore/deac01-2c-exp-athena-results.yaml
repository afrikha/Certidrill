id: deac01-2c-exp-athena-results
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon Athena workgroup writes its query results to s3://example-athena-results/workgroup-a/. The bucket keeps growing. Analysts download results for up to 7 days after a query runs, and then the results can be deleted. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un groupe de travail Amazon Athena écrit ses résultats de requête dans s3://example-athena-results/workgroup-a/. Le compartiment ne cesse de grossir. Les analystes téléchargent les résultats jusqu'à 7 jours après l'exécution d'une requête, puis les résultats peuvent être supprimés. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an S3 Lifecycle rule for the workgroup-a/ prefix that expires objects 7 days after creation.", fr: "Créer une règle S3 Lifecycle pour le préfixe workgroup-a/ qui fait expirer les objets 7 jours après leur création." }
    - id: b
      text: { en: "Turn on query result reuse for the workgroup's queries with a maximum age of 7 days.", fr: "Activer la réutilisation des résultats de requête pour les requêtes du groupe de travail avec un âge maximal de 7 jours." }
    - id: c
      text: { en: "Create an S3 Lifecycle rule for the workgroup-a/ prefix that transitions objects to S3 Intelligent-Tiering.", fr: "Créer une règle S3 Lifecycle pour le préfixe workgroup-a/ qui fait passer les objets à S3 Intelligent-Tiering." }
    - id: d
      text: { en: "Schedule an AWS Lambda function that lists the prefix every day and deletes objects older than 7 days.", fr: "Planifier une fonction AWS Lambda qui liste chaque jour le préfixe et supprime les objets de plus de 7 jours." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Athena query results are ordinary S3 objects, so an Expiration action on the results prefix deletes them 7 days after they are written. S3 applies the rule every day with nothing to deploy or maintain.
    fr: |
      Les résultats de requête Athena sont des objets S3 ordinaires : une action Expiration sur le préfixe des résultats les supprime 7 jours après leur écriture. S3 applique la règle chaque jour, sans rien à déployer ni à maintenir.
  options:
    b: { en: "Query result reuse lets Athena return earlier results instead of running a query again; it deletes nothing.", fr: "La réutilisation des résultats de requête permet à Athena de renvoyer des résultats antérieurs au lieu de réexécuter une requête ; elle ne supprime rien." }
    c: { en: "Intelligent-Tiering can lower the storage price, but the results are kept and the bucket keeps growing.", fr: "Intelligent-Tiering peut réduire le prix du stockage, mais les résultats sont conservés et le compartiment continue de grossir." }
    d: { en: "The function works but adds code, scheduling and list costs that a lifecycle rule avoids.", fr: "La fonction fonctionne, mais ajoute du code, une planification et des coûts de listage qu'une règle de cycle de vie évite." }
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
