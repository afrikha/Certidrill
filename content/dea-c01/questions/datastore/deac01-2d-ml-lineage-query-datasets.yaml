id: deac01-2d-ml-lineage-query-datasets
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company serves a credit model from an Amazon SageMaker AI endpoint. The model was trained 8 months ago with a SageMaker training job, and no lineage entities were created manually. An auditor asks which Amazon S3 datasets were used to train the model behind the endpoint.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Une entreprise de services financiers sert un modèle de crédit à partir d'un point de terminaison Amazon SageMaker AI. Le modèle a été entraîné il y a 8 mois avec une tâche d'entraînement SageMaker, et aucune entité de lignage n'a été créée manuellement. Un auditeur demande quels jeux de données Amazon S3 ont servi à entraîner le modèle utilisé par le point de terminaison.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Call QueryLineage from the model artifact with the direction set to Ascendants and a filter on dataset artifacts.", fr: "Appeler QueryLineage depuis l'artefact du modèle avec la direction Ascendants et un filtre sur les artefacts de jeux de données." } }
    - { id: b, text: { en: "Call QueryLineage from the model artifact with the direction set to Descendants and a filter on dataset artifacts.", fr: "Appeler QueryLineage depuis l'artefact du modèle avec la direction Descendants et un filtre sur les artefacts de jeux de données." } }
    - { id: c, text: { en: "Search the AWS CloudTrail event history for the CreateTrainingJob call, and read the input channels of the request.", fr: "Rechercher l'appel CreateTrainingJob dans l'historique des événements AWS CloudTrail, puis lire les canaux d'entrée de la requête." } }
    - { id: d, text: { en: "Query the S3 server access logs of the data buckets with Amazon Athena to find the reads made by the training role.", fr: "Interroger avec Amazon Athena les journaux d'accès au serveur S3 des compartiments de données pour trouver les lectures du rôle d'entraînement." } }
answer: { optionId: a }
explanation:
  correct:
    en: "SageMaker AI creates lineage entities automatically for training jobs, including an artifact for each input channel's S3 URI, and links them to the model and endpoint. A QueryLineage call that starts at the model and walks Ascendants, filtered on dataset artifacts, returns the upstream datasets."
    fr: "SageMaker AI crée automatiquement des entités de lignage pour les tâches d'entraînement, dont un artefact pour l'URI S3 de chaque canal d'entrée, et les relie au modèle et au point de terminaison. Un appel QueryLineage qui part du modèle et parcourt les Ascendants, filtré sur les artefacts de jeux de données, renvoie les jeux de données en amont."
  options:
    b:
      en: "Descendants walks downstream from the model, toward endpoints, so it does not return the training data."
      fr: "Descendants parcourt le graphe en aval du modèle, vers les points de terminaison : il ne renvoie pas les données d'entraînement."
    c:
      en: "CloudTrail event history keeps only the last 90 days of management events, so a call made 8 months ago is no longer there."
      fr: "L'historique des événements CloudTrail ne conserve que les 90 derniers jours d'événements de gestion : un appel effectué il y a 8 mois n'y figure plus."
    d:
      en: "Server access logging must have been enabled beforehand, and matching reads to one model is manual analysis, which is more effort than a lineage query."
      fr: "La journalisation des accès au serveur doit avoir été activée au préalable, et rattacher des lectures à un modèle est une analyse manuelle, plus coûteuse en effort qu'une requête de lignage."
references:
  - title: Querying Lineage Entities
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/querying-lineage-entities.html
  - title: Amazon SageMaker AI–Created Tracking Entities
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking-auto-creation.html
