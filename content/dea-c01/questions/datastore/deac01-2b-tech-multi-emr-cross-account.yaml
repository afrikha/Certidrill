id: deac01-2b-tech-multi-emr-cross-account
objective: "2.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A central data account (111122223333) owns the AWS Glue Data Catalog of a company's data lake. A team in account 444455556666 runs Amazon EMR 7.x clusters with Spark and must use that catalog as its Hive metastore, without copying any metadata. The EC2 instance profile of the clusters already allows the required AWS Glue actions on all resources, and access to the S3 data is already granted. AWS Lake Formation is not used.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un compte de données central (111122223333) possède l'AWS Glue Data Catalog du lac de données d'une entreprise. Une équipe du compte 444455556666 exécute des clusters Amazon EMR 7.x avec Spark et doit utiliser ce catalogue comme metastore Hive, sans copier de métadonnées. Le profil d'instance EC2 des clusters autorise déjà les actions AWS Glue nécessaires sur toutes les ressources, et l'accès aux données S3 est déjà accordé. AWS Lake Formation n'est pas utilisé.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In account 111122223333, add a Data Catalog resource policy that allows the instance profile role of account 444455556666 the required Glue actions.", fr: "Dans le compte 111122223333, ajouter une politique de ressources du Data Catalog qui autorise le rôle du profil d'instance du compte 444455556666 à effectuer les actions Glue nécessaires." } }
    - { id: b, text: { en: "In account 444455556666, add hive.metastore.glue.catalogid set to 111122223333 to the spark-hive-site classification with the Glue client factory class.", fr: "Dans le compte 444455556666, ajouter hive.metastore.glue.catalogid défini à 111122223333 à la classification spark-hive-site avec la classe de fabrique de clients Glue." } }
    - { id: c, text: { en: "In account 444455556666, schedule an AWS Glue crawler on the S3 data of the central account to rebuild the tables in the local Data Catalog.", fr: "Dans le compte 444455556666, planifier un robot d'analyse AWS Glue sur les données S3 du compte central afin de recréer les tables dans le Data Catalog local." } }
    - { id: d, text: { en: "In account 444455556666, set hive.metastore.uris in the hive-site classification to the AWS Glue endpoint of account 111122223333 on port 9083.", fr: "Dans le compte 444455556666, définir hive.metastore.uris dans la classification hive-site sur le point de terminaison AWS Glue du compte 111122223333, sur le port 9083." } }
    - { id: e, text: { en: "In account 111122223333, share the Data Catalog databases with account 444455556666 by adding the account to the ACL of the data bucket.", fr: "Dans le compte 111122223333, partager les bases de données du Data Catalog avec le compte 444455556666 en ajoutant le compte à l'ACL du compartiment des données." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Cross-account access to a Data Catalog without Lake Formation needs a Data Catalog resource policy in the owning account that names the consumer role as principal, in addition to the consumer's IAM permissions. On EMR 5.16.0 and later, hive.metastore.glue.catalogid in spark-hive-site makes Spark call the catalog of the given account ID instead of its own."
    fr: "L'accès entre comptes à un Data Catalog sans Lake Formation nécessite, dans le compte propriétaire, une politique de ressources du Data Catalog qui désigne le rôle consommateur comme principal, en plus des autorisations IAM du consommateur. Sur EMR 5.16.0 et versions ultérieures, hive.metastore.glue.catalogid dans spark-hive-site fait appeler par Spark le catalogue de l'ID de compte indiqué au lieu du sien."
  options:
    c:
      en: "A crawler in the consumer account creates a copy of the metadata, which the requirements forbid."
      fr: "Un robot d'analyse dans le compte consommateur crée une copie des métadonnées, ce que les exigences interdisent."
    d:
      en: "hive.metastore.uris points to a Thrift Hive metastore service; the Data Catalog is reached through the Glue client factory and the catalog ID, not a Thrift URI."
      fr: "hive.metastore.uris pointe vers un service de metastore Hive Thrift ; le Data Catalog est accessible au moyen de la fabrique de clients Glue et de l'ID de catalogue, pas d'une URI Thrift."
    e:
      en: "Bucket ACLs control access to S3 objects, which is already granted; they do not grant access to Data Catalog resources."
      fr: "Les ACL de compartiment contrôlent l'accès aux objets S3, déjà accordé ; elles n'accordent pas l'accès aux ressources du Data Catalog."
references:
  - title: Use AWS Glue Data Catalog with Spark on Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-spark-glue.html
  - title: Granting cross-account access
    url: https://docs.aws.amazon.com/glue/latest/dg/cross-account-access.html
