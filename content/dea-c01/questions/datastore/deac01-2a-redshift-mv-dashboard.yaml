id: deac01-2a-redshift-mv-dashboard
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail dashboard queries Amazon Redshift every minute. Each query joins three large tables and aggregates sales by store and day, and each user filters on different stores, so the query text changes from user to user. The base tables receive new data once an hour through COPY. The queries take 40 seconds, and the company wants much faster dashboards with the least maintenance.

    Which solution will meet these requirements?
  fr: |
    Un tableau de bord de distribution interroge Amazon Redshift toutes les minutes. Chaque requête joint trois grandes tables et agrège les ventes par magasin et par jour, et chaque utilisateur filtre sur des magasins différents : le texte des requêtes change d'un utilisateur à l'autre. Les tables de base reçoivent de nouvelles données une fois par heure par COPY. Les requêtes durent 40 secondes, et l'entreprise veut des tableaux de bord beaucoup plus rapides avec le moins de maintenance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Rely on the Redshift result cache so that repeated dashboard queries are answered from cached results.", fr: "S'appuyer sur le cache de résultats de Redshift pour que les requêtes répétées du tableau de bord soient servies depuis le cache." } }
    - { id: b, text: { en: "Turn on concurrency scaling for the WLM queue that runs the dashboard queries.", fr: "Activer la mise à l'échelle de la simultanéité pour la file WLM qui exécute les requêtes du tableau de bord." } }
    - { id: c, text: { en: "Create a standard view that contains the joins and the aggregation, and query the view from the dashboard.", fr: "Créer une vue standard qui contient les jointures et l'agrégation, et interroger cette vue depuis le tableau de bord." } }
    - { id: d, text: { en: "Create a materialized view with AUTO REFRESH YES that holds the joins and the aggregation.", fr: "Créer une vue matérialisée avec AUTO REFRESH YES qui contient les jointures et l'agrégation." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A materialized view stores the precomputed join and aggregation, so each dashboard query only filters a small result. With AUTO REFRESH YES, Redshift refreshes the view when it is stale, incrementally when the definition allows it, and no compute is used while the base tables do not change."
    fr: "Une vue matérialisée stocke la jointure et l'agrégation précalculées : chaque requête du tableau de bord ne filtre qu'un petit résultat. Avec AUTO REFRESH YES, Redshift actualise la vue lorsqu'elle est obsolète, de façon incrémentielle quand la définition le permet, et aucun calcul n'est consommé tant que les tables de base ne changent pas."
  options:
    a:
      en: "The result cache serves only identical query text on unchanged data; the filters differ per user, so most queries miss the cache."
      fr: "Le cache de résultats ne sert qu'un texte de requête identique sur des données inchangées ; les filtres diffèrent selon l'utilisateur : la plupart des requêtes manquent le cache."
    b:
      en: "Concurrency scaling adds capacity for queued queries; each query still recomputes the 40-second join and aggregation."
      fr: "La mise à l'échelle de la simultanéité ajoute de la capacité pour les requêtes en file d'attente ; chaque requête recalcule toujours la jointure et l'agrégation de 40 secondes."
    c:
      en: "A standard view stores only the query definition, so every dashboard query still runs the full join and aggregation."
      fr: "Une vue standard ne stocke que la définition de la requête : chaque requête du tableau de bord exécute toujours la jointure et l'agrégation complètes."
references:
  - title: Refreshing a materialized view
    url: https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-refresh.html
