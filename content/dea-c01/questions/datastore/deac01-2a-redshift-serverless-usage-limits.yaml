id: deac01-2a-redshift-serverless-usage-limits
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs its reporting workload on an Amazon Redshift Serverless workgroup. The finance team requires that the data team receive an Amazon SNS notification when the workgroup has consumed 800 RPU-hours in a calendar month. User queries must also stop automatically if consumption reaches 1,000 RPU-hours in that month.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute sa charge de travail de reporting sur un groupe de travail Amazon Redshift Serverless. L'équipe financière exige que l'équipe data reçoive une notification Amazon SNS lorsque le groupe de travail a consommé 800 heures RPU dans un mois civil. Les requêtes des utilisateurs doivent aussi s'arrêter automatiquement si la consommation atteint 1 000 heures RPU dans ce mois.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Lower the base capacity of the workgroup to the smallest supported value.", fr: "Abaisser la capacité de base du groupe de travail à la plus petite valeur prise en charge." } }
    - { id: b, text: { en: "Create a monthly usage limit of 800 RPU-hours on the workgroup with the Alert action.", fr: "Créer sur le groupe de travail une limite d'utilisation mensuelle de 800 heures RPU avec l'action Alert." } }
    - { id: c, text: { en: "Lower the maximum capacity of the workgroup so that it cannot scale beyond fewer RPUs.", fr: "Abaisser la capacité maximale du groupe de travail pour qu'il ne puisse pas dépasser un nombre plus faible de RPU." } }
    - { id: d, text: { en: "Set a query limit on the workgroup that stops any query that runs longer than one hour.", fr: "Définir sur le groupe de travail une limite de requête qui arrête toute requête de plus d'une heure." } }
    - { id: e, text: { en: "Create a monthly usage limit of 1,000 RPU-hours on the workgroup with the Turn off user queries action.", fr: "Créer sur le groupe de travail une limite d'utilisation mensuelle de 1 000 heures RPU avec l'action Turn off user queries." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Redshift Serverless usage limits cap the RPU-hours a workgroup consumes per day, week or month, with up to four limits per workgroup. Each limit takes an action: log to a system table, send an alert through Amazon SNS, or turn off user queries. One 800 RPU-hour limit with Alert and one 1,000 RPU-hour limit with Turn off user queries meet both requirements."
    fr: "Les limites d'utilisation de Redshift Serverless plafonnent les heures RPU qu'un groupe de travail consomme par jour, semaine ou mois, avec jusqu'à quatre limites par groupe de travail. Chaque limite déclenche une action : journaliser dans une table système, envoyer une alerte via Amazon SNS ou désactiver les requêtes des utilisateurs. Une limite de 800 heures RPU avec Alert et une limite de 1 000 heures RPU avec Turn off user queries répondent aux deux exigences."
  options:
    a:
      en: "Base capacity sets the starting compute; it neither counts monthly RPU-hours nor sends notifications or stops queries."
      fr: "La capacité de base définit le calcul de départ ; elle ne compte pas les heures RPU mensuelles et n'envoie ni notification ni arrêt de requêtes."
    c:
      en: "A lower maximum capacity limits how far the workgroup scales at a time, not the total RPU-hours consumed in the month."
      fr: "Une capacité maximale plus faible limite la mise à l'échelle à un instant donné, pas le total d'heures RPU consommées dans le mois."
    d:
      en: "A per-query time limit stops long queries but does not track monthly consumption or notify the data team."
      fr: "Une limite de durée par requête arrête les longues requêtes, mais ne suit pas la consommation mensuelle et ne prévient pas l'équipe data."
references:
  - title: Setting usage limits, including setting RPU limits
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-workgroup-max-rpu.html
