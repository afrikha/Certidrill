id: deac01-2d-dms-sc-assessment
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company plans to migrate a Microsoft SQL Server database to Amazon Aurora PostgreSQL-Compatible Edition. Before management approves the project, the data engineering team must show which database objects can be converted automatically and estimate the manual work needed for the others.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé prévoit de migrer une base de données Microsoft SQL Server vers Amazon Aurora PostgreSQL-Compatible Edition. Avant que la direction n'approuve le projet, l'équipe d'ingénierie des données doit montrer quels objets de base de données peuvent être convertis automatiquement et estimer le travail manuel nécessaire pour les autres.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an AWS DMS premigration assessment on a replication task that targets the Aurora cluster.", fr: "Exécuter une évaluation préalable à la migration AWS DMS sur une tâche de réplication qui cible le cluster Aurora." } }
    - { id: b, text: { en: "Turn on AWS DMS data validation on a full-load task and review the validation results.", fr: "Activer la validation des données AWS DMS sur une tâche de chargement complet et examiner les résultats de validation." } }
    - { id: c, text: { en: "Create a conversion assessment report in a DMS Schema Conversion migration project and export it.", fr: "Créer un rapport d'évaluation de la conversion dans un projet de migration DMS Schema Conversion et l'exporter." } }
    - { id: d, text: { en: "Catalog the SQL Server database with an AWS Glue crawler over a JDBC connection and review the tables.", fr: "Cataloguer la base SQL Server avec un robot d'analyse (crawler) AWS Glue via une connexion JDBC et examiner les tables." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A DMS Schema Conversion assessment report places each source object in a complexity category, from automatically converted to complex actions, and lists action items with recommended actions and effort estimates. It can be exported as PDF or CSV to the project's S3 bucket before any conversion is applied."
    fr: "Un rapport d'évaluation DMS Schema Conversion classe chaque objet source dans une catégorie de complexité, de la conversion automatique aux actions complexes, et liste les éléments d'action avec les actions recommandées et des estimations d'effort. Il peut être exporté en PDF ou en CSV dans le compartiment S3 du projet avant toute application de la conversion."
  options:
    a:
      en: "A premigration assessment checks a replication task's settings and data before data migration; it does not evaluate the conversion of code objects."
      fr: "Une évaluation préalable à la migration vérifie les paramètres et les données d'une tâche de réplication avant la migration des données ; elle n'évalue pas la conversion des objets de code."
    b:
      en: "Data validation compares source and target rows after data is migrated, so it cannot estimate schema conversion work in advance."
      fr: "La validation des données compare les lignes source et cible après la migration des données : elle ne peut pas estimer à l'avance le travail de conversion du schéma."
    d:
      en: "A crawler records table metadata in the Data Catalog; it does not assess procedures, functions or triggers for conversion."
      fr: "Un crawler enregistre les métadonnées des tables dans le Data Catalog ; il n'évalue pas la conversion des procédures, fonctions ou déclencheurs."
references:
  - title: Conversion assessment reports with DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/assessment-reports.html
