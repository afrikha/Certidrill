id: deac01-2b-conn-s3-gateway-endpoint
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue ETL job uses a JDBC connection to read from an Amazon Aurora MySQL cluster in a private subnet, and it writes Parquet files to Amazon S3. The subnet has no NAT gateway and no route to the internet. The job connects to the database but times out when it writes to Amazon S3. Company policy forbids traffic to Amazon S3 over the internet.

    Which solution will meet these requirements?
  fr: |
    Une tâche ETL AWS Glue utilise une connexion JDBC pour lire un cluster Amazon Aurora MySQL situé dans un sous-réseau privé, et elle écrit des fichiers Parquet dans Amazon S3. Le sous-réseau n'a ni passerelle NAT ni itinéraire vers Internet. La tâche se connecte à la base de données mais expire lorsqu'elle écrit dans Amazon S3. La politique de l'entreprise interdit le trafic vers Amazon S3 par Internet.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a gateway VPC endpoint for Amazon S3, and associate it with the route table of the connection's subnet.", fr: "Créer un point de terminaison de VPC de type passerelle pour Amazon S3, et l'associer à la table de routage du sous-réseau de la connexion." } }
    - { id: b, text: { en: "Add a route to an internet gateway in the route table of the connection's subnet, and allow HTTPS outbound.", fr: "Ajouter un itinéraire vers une passerelle Internet dans la table de routage du sous-réseau de la connexion, et autoriser le HTTPS sortant." } }
    - { id: c, text: { en: "Create an interface VPC endpoint for AWS Glue in the connection's subnet, and enable private DNS on it.", fr: "Créer un point de terminaison de VPC d'interface pour AWS Glue dans le sous-réseau de la connexion, et y activer le DNS privé." } }
    - { id: d, text: { en: "Add a second Network connection to the job that uses a public subnet of the same VPC for S3 traffic.", fr: "Ajouter à la tâche une seconde connexion Network qui utilise un sous-réseau public du même VPC pour le trafic S3." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A VPC endpoint for Amazon S3 lets AWS Glue reach Amazon S3 with private IP addresses, without an internet gateway or a NAT device, and the traffic stays on the Amazon network. A gateway endpoint takes effect through the route table of the subnet that the connection uses."
    fr: "Un point de terminaison de VPC pour Amazon S3 permet à AWS Glue d'atteindre Amazon S3 avec des adresses IP privées, sans passerelle Internet ni périphérique NAT, et le trafic reste sur le réseau Amazon. Un point de terminaison de type passerelle prend effet au moyen de la table de routage du sous-réseau utilisé par la connexion."
  options:
    b:
      en: "The Glue network interfaces have no public IP addresses, so an internet gateway route does not work, and the policy forbids internet traffic."
      fr: "Les interfaces réseau Glue n'ont pas d'adresse IP publique : un itinéraire vers une passerelle Internet ne fonctionne pas, et la politique interdit le trafic Internet."
    c:
      en: "An AWS Glue endpoint gives private access to the Glue APIs; it does not carry the job's traffic to Amazon S3."
      fr: "Un point de terminaison AWS Glue donne un accès privé aux API Glue ; il ne transporte pas le trafic de la tâche vers Amazon S3."
    d:
      en: "A public subnet does not help interfaces that have only private IP addresses, and the traffic to Amazon S3 would use the internet."
      fr: "Un sous-réseau public n'aide pas des interfaces qui n'ont que des adresses IP privées, et le trafic vers Amazon S3 passerait par Internet."
references:
  - title: Amazon VPC endpoints for Amazon S3
    url: https://docs.aws.amazon.com/glue/latest/dg/vpc-endpoints-s3.html
  - title: Connecting to a JDBC data store in a VPC
    url: https://docs.aws.amazon.com/glue/latest/dg/connection-JDBC-VPC.html
