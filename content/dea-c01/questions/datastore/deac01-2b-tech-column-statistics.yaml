id: deac01-2b-tech-column-statistics
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data platform team catalogs hundreds of Parquet tables in the AWS Glue Data Catalog. Amazon Athena and Amazon Redshift queries that join these tables often get poor execution plans because the optimizers lack statistics such as distinct values and null counts. New tables are added every week. The team wants the statistics to be available for new tables automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe de plateforme de données catalogue des centaines de tables Parquet dans l'AWS Glue Data Catalog. Les requêtes Amazon Athena et Amazon Redshift qui joignent ces tables obtiennent souvent de mauvais plans d'exécution, car les optimiseurs manquent de statistiques telles que le nombre de valeurs distinctes et de valeurs nulles. De nouvelles tables sont ajoutées chaque semaine. L'équipe veut que les statistiques soient disponibles automatiquement pour les nouvelles tables.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Set the numRows table property by hand on each new table after the weekly load.", fr: "Définir manuellement la propriété de table numRows sur chaque nouvelle table après le chargement hebdomadaire." } }
    - { id: b, text: { en: "Create partition indexes on the partition keys of every table in the Data Catalog.", fr: "Créer des index de partition sur les clés de partition de chaque table du Data Catalog." } }
    - { id: c, text: { en: "Attach an AWS Glue Data Quality ruleset that checks completeness and uniqueness on each table.", fr: "Associer à chaque table un ensemble de règles AWS Glue Data Quality qui vérifie la complétude et l'unicité." } }
    - { id: d, text: { en: "Turn on automatic column statistics generation at the catalog level in the Data Catalog.", fr: "Activer la génération automatique des statistiques de colonnes au niveau du catalogue dans le Data Catalog." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The Data Catalog generates column statistics such as minimum, maximum, null count, distinct values and average length, which Athena and Redshift use to choose better query plans. Catalog-level automatic generation computes them for new tables without any per-table setup."
    fr: "Le Data Catalog génère des statistiques de colonnes telles que le minimum, le maximum, le nombre de valeurs nulles, le nombre de valeurs distinctes et la longueur moyenne, qu'Athena et Redshift utilisent pour choisir de meilleurs plans de requête. La génération automatique au niveau du catalogue les calcule pour les nouvelles tables sans configuration table par table."
  options:
    a:
      en: "numRows gives only a row count and must be maintained by hand for every table, which is the opposite of automatic."
      fr: "numRows ne fournit qu'un nombre de lignes et doit être maintenu manuellement pour chaque table, ce qui est le contraire d'une solution automatique."
    b:
      en: "Partition indexes speed up the retrieval of partitions; they provide no column statistics to the optimizers."
      fr: "Les index de partition accélèrent la récupération des partitions ; ils ne fournissent aucune statistique de colonnes aux optimiseurs."
    c:
      en: "Data Quality rules evaluate the data against rules; their results are not used by the query optimizers as column statistics."
      fr: "Les règles Data Quality évaluent les données par rapport à des règles ; leurs résultats ne sont pas utilisés par les optimiseurs de requêtes comme statistiques de colonnes."
references:
  - title: Optimizing query performance using column statistics
    url: https://docs.aws.amazon.com/glue/latest/dg/column-statistics.html
