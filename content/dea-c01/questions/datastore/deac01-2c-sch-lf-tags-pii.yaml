id: deac01-2c-sch-lf-tags-pii
objective: "2.4.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's data lake has 300 tables in the AWS Glue Data Catalog, with permissions managed by AWS Lake Formation. New tables are added every week, and some columns in many tables contain PII. Analysts must be able to query every non-PII column of every table, including future tables, but never the PII columns. The solution must require the LEAST administrative effort.

    Which actions will meet these requirements? (Choose two.)
  fr: |
    Le lac de données d'une entreprise compte 300 tables dans AWS Glue Data Catalog, avec des autorisations gérées par AWS Lake Formation. De nouvelles tables sont ajoutées chaque semaine, et certaines colonnes de nombreuses tables contiennent des informations personnelles (PII). Les analystes doivent pouvoir interroger toutes les colonnes non PII de toutes les tables, y compris les futures, mais jamais les colonnes PII. La solution doit demander le MOINS d'efforts d'administration.

    Quelles actions permettent de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a data cells filter on each table that excludes its PII columns, and grant SELECT on each filter.", fr: "Créer sur chaque table un filtre de cellules de données qui exclut ses colonnes PII, et accorder SELECT sur chaque filtre." } }
    - { id: b, text: { en: "Create an LF-tag classification, assign classification=public to the databases, and override it with classification=pii on PII columns.", fr: "Créer une LF-tag classification, attribuer classification=public aux bases de données, et la remplacer par classification=pii sur les colonnes PII." } }
    - { id: c, text: { en: "Grant the analysts IAM policies that allow glue:GetTable and s3:GetObject on the locations of the tables.", fr: "Accorder aux analystes des politiques IAM qui autorisent glue:GetTable et s3:GetObject sur les emplacements des tables." } }
    - { id: d, text: { en: "Grant SELECT on each table with the named resource method, listing only the non-PII columns.", fr: "Accorder SELECT sur chaque table avec la méthode des ressources nommées, en ne listant que les colonnes non PII." } }
    - { id: e, text: { en: "Grant the analysts SELECT and DESCRIBE on the LF-tag expression classification=public.", fr: "Accorder aux analystes SELECT et DESCRIBE sur l'expression de LF-tag classification=public." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      LF-tags can be assigned to databases, tables and columns; tables and columns inherit the tags of their database, and an inherited value can be overridden on specific columns. Granting permissions on the tag expression classification=public then covers every matching column, including those of new tables, with one grant instead of one per table.
    fr: |
      Les LF-tags peuvent être attribuées aux bases de données, aux tables et aux colonnes ; les tables et les colonnes héritent des balises de leur base de données, et une valeur héritée peut être remplacée sur des colonnes précises. Accorder des autorisations sur l'expression de balise classification=public couvre alors toutes les colonnes correspondantes, y compris celles des nouvelles tables, avec une seule attribution au lieu d'une par table.
  options:
    a: { en: "Data cells filters are defined per table, so 300 filters are needed and every new table needs a new filter and grant.", fr: "Les filtres de cellules de données sont définis par table : il en faut 300, et chaque nouvelle table exige un nouveau filtre et une nouvelle attribution." }
    c: { en: "IAM policies on Glue and S3 cannot hide individual columns; analysts could read the PII stored in the same files.", fr: "Les politiques IAM sur Glue et S3 ne peuvent pas masquer des colonnes individuelles ; les analystes pourraient lire les PII stockées dans les mêmes fichiers." }
    d: { en: "Named resource grants must be repeated for every table and every new table, which grows with the number of resources.", fr: "Les attributions sur ressources nommées doivent être répétées pour chaque table et chaque nouvelle table, ce qui croît avec le nombre de ressources." }
references:
  - title: Lake Formation tag-based access control
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/tag-based-access-control.html
