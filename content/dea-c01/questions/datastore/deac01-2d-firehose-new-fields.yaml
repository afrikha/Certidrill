id: deac01-2d-firehose-new-fields
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IoT company uses Amazon Data Firehose to convert JSON telemetry records to Apache Parquet before delivery to Amazon S3. The stream uses an AWS Glue Data Catalog table for the schema, with the table version set to LATEST. Devices started sending two new fields last week, but the Parquet files in Amazon S3 do not contain them. The new fields must appear in future files with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise IoT utilise Amazon Data Firehose pour convertir des enregistrements de télémétrie JSON au format Apache Parquet avant leur livraison dans Amazon S3. Le flux utilise une table du AWS Glue Data Catalog pour le schéma, avec la version de table définie sur LATEST. Les appareils envoient deux nouveaux champs depuis la semaine dernière, mais les fichiers Parquet d'Amazon S3 ne les contiennent pas. Les nouveaux champs doivent apparaître dans les prochains fichiers avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable dynamic partitioning on the Firehose stream and partition the output by device type.", fr: "Activer le partitionnement dynamique sur le flux Firehose et partitionner la sortie par type d'appareil." } }
    - { id: b, text: { en: "Run an AWS Glue crawler on the Parquet output prefix in Amazon S3 after each delivery.", fr: "Exécuter un robot d'analyse (crawler) AWS Glue sur le préfixe de sortie Parquet d'Amazon S3 après chaque livraison." } }
    - { id: c, text: { en: "Add the two new columns to the AWS Glue table that the Firehose stream references for the schema.", fr: "Ajouter les deux nouvelles colonnes à la table AWS Glue que le flux Firehose référence pour le schéma." } }
    - { id: d, text: { en: "Change the deserializer of the stream from the OpenX JSON SerDe to the Apache Hive JSON SerDe.", fr: "Remplacer le désérialiseur du flux, OpenX JSON SerDe, par Apache Hive JSON SerDe." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Firehose interprets input records with the schema of the referenced Glue table, and attributes that the schema does not define are left out of the converted data. With the version set to LATEST, Firehose uses the most recent table version, so adding the columns to the table is picked up automatically."
    fr: "Firehose interprète les enregistrements d'entrée avec le schéma de la table Glue référencée, et les attributs que le schéma ne définit pas sont absents des données converties. Avec la version définie sur LATEST, Firehose utilise la version la plus récente de la table : l'ajout des colonnes à la table est pris en compte automatiquement."
  options:
    a:
      en: "Dynamic partitioning changes the S3 prefixes of the delivered data; it does not change which fields are written to the Parquet files."
      fr: "Le partitionnement dynamique change les préfixes S3 des données livrées ; il ne change pas les champs écrits dans les fichiers Parquet."
    b:
      en: "A crawler on the output infers the schema from Parquet files that already lack the fields, so the conversion schema would not gain them."
      fr: "Un crawler sur la sortie déduit le schéma de fichiers Parquet auxquels les champs manquent déjà : le schéma de conversion ne les gagnerait pas."
    d:
      en: "The deserializer only reads the JSON input; with either SerDe, fields missing from the Glue schema are still dropped."
      fr: "Le désérialiseur lit seulement l'entrée JSON ; avec l'un ou l'autre SerDe, les champs absents du schéma Glue sont toujours ignorés."
references:
  - title: Convert input data format in Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html
  - title: SchemaConfiguration
    url: https://docs.aws.amazon.com/firehose/latest/APIReference/API_SchemaConfiguration.html
