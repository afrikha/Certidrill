id: deac01-2c-unload-sse-kms
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company exports data from Amazon Redshift to an Amazon S3 bucket that another team owns. The bucket's default encryption is SSE-S3, and the company cannot change it. Compliance rules require the exported files to be encrypted with a specific AWS KMS customer managed key that the company controls. The data engineer uses this command:

    ```sql
    UNLOAD ('SELECT * FROM finance.ledger')
    TO 's3://example-exports/ledger/'
    IAM_ROLE 'arn:aws:iam::111122223333:role/RedshiftUnloadRole'
    FORMAT AS PARQUET;
    ```

    Which change will meet these requirements?
  fr: |
    Une entreprise exporte des données d'Amazon Redshift vers un compartiment Amazon S3 qui appartient à une autre équipe. Le chiffrement par défaut du compartiment est SSE-S3 et l'entreprise ne peut pas le modifier. Les règles de conformité exigent que les fichiers exportés soient chiffrés avec une clé gérée par le client AWS KMS précise que l'entreprise contrôle. L'ingénieur des données utilise cette commande :

    ```sql
    UNLOAD ('SELECT * FROM finance.ledger')
    TO 's3://example-exports/ledger/'
    IAM_ROLE 'arn:aws:iam::111122223333:role/RedshiftUnloadRole'
    FORMAT AS PARQUET;
    ```

    Quelle modification permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add ENCRYPTED AUTO to the command so that UNLOAD selects the encryption settings automatically.", fr: "Ajouter ENCRYPTED AUTO à la commande afin qu'UNLOAD sélectionne automatiquement les paramètres de chiffrement." }
    - id: b
      text: { en: "Add KMS_KEY_ID with the key ARN and ENCRYPTED to the command, and allow the role to use the key.", fr: "Ajouter KMS_KEY_ID avec l'ARN de la clé et ENCRYPTED à la commande, et autoriser le rôle à utiliser la clé." }
    - id: c
      text: { en: "Add MASTER_SYMMETRIC_KEY with a root key stored in AWS Secrets Manager, and add ENCRYPTED to the command.", fr: "Ajouter MASTER_SYMMETRIC_KEY avec une clé racine stockée dans AWS Secrets Manager, et ajouter ENCRYPTED à la commande." }
    - id: d
      text: { en: "Keep the command unchanged, because UNLOAD encrypts every output file by default.", fr: "Conserver la commande telle quelle, car UNLOAD chiffre par défaut chaque fichier de sortie." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      KMS_KEY_ID with ENCRYPTED makes UNLOAD write the files with SSE-KMS under the key that you name, whatever the bucket's default encryption. The IAM role that UNLOAD uses must be allowed to use that key.
    fr: |
      KMS_KEY_ID avec ENCRYPTED fait écrire les fichiers par UNLOAD en SSE-KMS avec la clé indiquée, quel que soit le chiffrement par défaut du compartiment. Le rôle IAM utilisé par UNLOAD doit être autorisé à utiliser cette clé.
  options:
    a: { en: "ENCRYPTED AUTO uses the bucket's default KMS key and falls back to SSE-S3; this bucket uses SSE-S3, so the company's key is not used.", fr: "ENCRYPTED AUTO utilise la clé KMS par défaut du compartiment, sinon SSE-S3 ; ce compartiment utilise SSE-S3, donc la clé de l'entreprise n'est pas utilisée." }
    c: { en: "MASTER_SYMMETRIC_KEY is client-side encryption, which is being retired and is not open to new customers; it does not use the KMS key.", fr: "MASTER_SYMMETRIC_KEY correspond au chiffrement côté client, en cours de retrait et fermé aux nouveaux clients ; il n'utilise pas la clé KMS." }
    d: { en: "By default UNLOAD encrypts with SSE-S3, not with the company's customer managed key.", fr: "Par défaut, UNLOAD chiffre en SSE-S3, et non avec la clé gérée par le client de l'entreprise." }
references:
  - title: UNLOAD
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_UNLOAD.html
