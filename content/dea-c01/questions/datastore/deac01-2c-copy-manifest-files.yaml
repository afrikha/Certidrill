id: deac01-2c-copy-manifest-files
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company loads daily sales files into an Amazon Redshift table. Each night, upstream systems write the files of a batch to two Amazon S3 buckets, under prefixes that also contain files from other batches and partially written files. The data engineer receives the exact list of object keys that make up each batch. The load must include every listed file and no other file, and it must fail if a listed file is missing.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution charge chaque jour des fichiers de ventes dans une table Amazon Redshift. Chaque nuit, des systèmes amont écrivent les fichiers d'un lot dans deux compartiments Amazon S3, sous des préfixes qui contiennent aussi des fichiers d'autres lots et des fichiers partiellement écrits. L'ingénieur des données reçoit la liste exacte des clés d'objet qui composent chaque lot. Le chargement doit inclure chaque fichier listé et aucun autre, et il doit échouer si un fichier listé est absent.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run one COPY command for each bucket with the batch prefix as the source, and set MAXERROR to 0.", fr: "Exécuter une commande COPY par compartiment avec le préfixe du lot comme source, et définir MAXERROR à 0." }
    - id: b
      text: { en: "Write a JSON manifest that lists the URL of each file with mandatory set to true, and run COPY with the MANIFEST option.", fr: "Écrire un manifeste JSON qui liste l'URL de chaque fichier avec mandatory à true, et exécuter COPY avec l'option MANIFEST." }
    - id: c
      text: { en: "Create a Redshift Spectrum external table over both prefixes, and insert all of its rows into the target table.", fr: "Créer une table externe Redshift Spectrum sur les deux préfixes, et insérer toutes ses lignes dans la table cible." }
    - id: d
      text: { en: "Copy the listed files to a single prefix with S3 Batch Operations, and run COPY with the NOLOAD option on that prefix.", fr: "Copier les fichiers listés dans un seul préfixe avec S3 Batch Operations, et exécuter COPY avec l'option NOLOAD sur ce préfixe." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A manifest lists the full S3 URL of each file to load, so COPY loads exactly those files, even when they are in different buckets or do not share a prefix. Setting mandatory to true on each entry makes COPY return an error when a listed file is not found.
    fr: |
      Un manifeste liste l'URL S3 complète de chaque fichier à charger : COPY charge exactement ces fichiers, même s'ils se trouvent dans des compartiments différents ou ne partagent pas de préfixe. Définir mandatory à true sur chaque entrée fait renvoyer une erreur à COPY quand un fichier listé est introuvable.
  options:
    a: { en: "A prefix loads every object that matches it, including files from other batches and partial files; MAXERROR controls rejected rows, not which files are read.", fr: "Un préfixe charge tous les objets qui lui correspondent, y compris les fichiers d'autres lots et les fichiers partiels ; MAXERROR contrôle les lignes rejetées, pas les fichiers lus." }
    c: { en: "The external table reads every file under both prefixes, so the other batches and the partial files would be inserted too.", fr: "La table externe lit tous les fichiers sous les deux préfixes : les autres lots et les fichiers partiels seraient aussi insérés." }
    d: { en: "NOLOAD only checks that the files can be parsed; it loads no rows into the table.", fr: "NOLOAD vérifie seulement que les fichiers peuvent être analysés ; il ne charge aucune ligne dans la table." }
references:
  - title: Using a manifest to specify data files
    url: https://docs.aws.amazon.com/redshift/latest/dg/loading-data-files-using-manifest.html
