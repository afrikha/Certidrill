id: deac01-2c-res-emr-s3-output
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs nightly Spark jobs on transient Amazon EMR clusters that terminate when the jobs finish. The jobs write their curated output to HDFS. The next morning, Amazon Athena queries find no data. The output must persist after the clusters terminate and must be available to other AWS services at the lowest cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute chaque nuit des tâches Spark sur des clusters Amazon EMR temporaires qui s'arrêtent à la fin des tâches. Les tâches écrivent leur sortie préparée dans HDFS. Le lendemain matin, les requêtes Amazon Athena ne trouvent aucune donnée. La sortie doit persister après l'arrêt des clusters et être disponible pour d'autres services AWS au coût le plus bas.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the HDFS replication factor on the cluster so that each block is stored on more core nodes.", fr: "Augmenter le facteur de réplication HDFS du cluster afin que chaque bloc soit stocké sur davantage de nœuds principaux." }
    - id: b
      text: { en: "Change the jobs to write their output to Amazon S3 by using s3:// URIs.", fr: "Modifier les tâches pour qu'elles écrivent leur sortie dans Amazon S3 à l'aide d'URI s3://." }
    - id: c
      text: { en: "Attach larger Amazon EBS volumes to the core nodes so that HDFS has more capacity.", fr: "Attacher des volumes Amazon EBS plus grands aux nœuds principaux afin que HDFS dispose de plus de capacité." }
    - id: d
      text: { en: "Keep one EMR cluster running at all times so that its HDFS output stays available.", fr: "Laisser un cluster EMR fonctionner en permanence afin que sa sortie HDFS reste disponible." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      HDFS on EMR is ephemeral storage that is reclaimed when the cluster ends. Data written to Amazon S3 through s3:// URIs is not tied to the cluster lifetime, so it outlives the transient clusters and can be read by Athena and other services.
    fr: |
      HDFS sur EMR est un stockage éphémère récupéré à la fin du cluster. Les données écrites dans Amazon S3 via des URI s3:// ne dépendent pas de la durée de vie du cluster : elles survivent aux clusters temporaires et peuvent être lues par Athena et d'autres services.
  options:
    a: { en: "More replicas protect against the loss of a node, but all of them are deleted when the cluster terminates.", fr: "Davantage de réplicas protègent contre la perte d'un nœud, mais ils sont tous supprimés à l'arrêt du cluster." }
    c: { en: "The EBS volumes of the cluster nodes are removed with the cluster, so the data is still lost.", fr: "Les volumes EBS des nœuds du cluster sont supprimés avec le cluster : les données sont toujours perdues." }
    d: { en: "A permanent cluster keeps the data but costs far more than storing the output in Amazon S3, and other services still cannot query HDFS directly.", fr: "Un cluster permanent conserve les données, mais coûte bien plus cher que de stocker la sortie dans Amazon S3, et les autres services ne peuvent toujours pas interroger HDFS directement." }
references:
  - title: Working with storage and file systems with Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-file-systems.html
