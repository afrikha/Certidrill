id: deac01-2a-rds-read-replica-reporting
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its order processing database on an Amazon RDS for PostgreSQL Multi-AZ DB instance deployment. Nightly and ad hoc reporting queries from a BI tool slow down the order transactions. The reports can use data that is a few minutes old.

    Which solution will offload the reporting queries with the fewest changes?
  fr: |
    Une entreprise exécute sa base de données de traitement des commandes sur un déploiement d'instance de base de données Multi-AZ Amazon RDS for PostgreSQL. Les requêtes de reporting nocturnes et ponctuelles d'un outil de BI ralentissent les transactions de commande. Les rapports peuvent utiliser des données vieilles de quelques minutes.

    Quelle solution décharge les requêtes de reporting avec le moins de modifications ?
body:
  options:
    - { id: a, text: { en: "Point the BI tool at the standby instance of the Multi-AZ deployment.", fr: "Diriger l'outil de BI vers l'instance de secours du déploiement Multi-AZ." } }
    - { id: b, text: { en: "Scale the primary DB instance to a larger instance class.", fr: "Faire passer l'instance de base de données principale à une classe d'instance supérieure." } }
    - { id: c, text: { en: "Create an Amazon RDS Proxy and point the BI tool at the proxy endpoint.", fr: "Créer un Amazon RDS Proxy et diriger l'outil de BI vers le point de terminaison du proxy." } }
    - { id: d, text: { en: "Create a read replica and point the BI tool at the replica endpoint.", fr: "Créer un réplica en lecture et diriger l'outil de BI vers le point de terminaison du réplica." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A read replica receives changes asynchronously from the primary and serves read-only queries, which is a documented use for business reporting. The replica can lag slightly, which the reports accept, and the primary no longer runs the reporting load."
    fr: "Un réplica en lecture reçoit les modifications de façon asynchrone depuis l'instance principale et sert des requêtes en lecture seule, un usage documenté pour le reporting. Le réplica peut avoir un léger retard, ce que les rapports acceptent, et l'instance principale n'exécute plus la charge de reporting."
  options:
    a:
      en: "The standby of a Multi-AZ DB instance deployment provides high availability and cannot serve read traffic."
      fr: "L'instance de secours d'un déploiement d'instance Multi-AZ assure la haute disponibilité et ne peut pas servir de trafic en lecture."
    b:
      en: "A larger instance adds cost, and the reports still compete with the order transactions on the same instance."
      fr: "Une instance plus grande coûte plus cher, et les rapports concurrencent toujours les transactions de commande sur la même instance."
    c:
      en: "RDS Proxy pools connections; the queries still run on the primary instance."
      fr: "RDS Proxy mutualise les connexions ; les requêtes s'exécutent toujours sur l'instance principale."
references:
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
