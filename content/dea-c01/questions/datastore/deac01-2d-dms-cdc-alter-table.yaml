id: deac01-2d-dms-cdc-alter-table
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company replicates an operational database to an analytics database with an AWS DMS task that runs full load and ongoing replication (CDC). Developers regularly add columns to source tables with ALTER TABLE statements, and both endpoints support replicating these statements. Today the new columns do not appear in the target tables. The target must follow these schema changes without manual intervention and without reloading the tables.

    Which solution will meet these requirements?
  fr: |
    Une entreprise réplique une base de données opérationnelle vers une base de données analytique avec une tâche AWS DMS qui exécute un chargement complet et une réplication continue (CDC). Les développeurs ajoutent régulièrement des colonnes aux tables source avec des instructions ALTER TABLE, et les deux points de terminaison prennent en charge la réplication de ces instructions. Aujourd'hui, les nouvelles colonnes n'apparaissent pas dans les tables cibles. La cible doit suivre ces changements de schéma sans intervention manuelle et sans recharger les tables.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set HandleSourceTableAltered to true in the task's ChangeProcessingDdlHandlingPolicy settings.", fr: "Définir HandleSourceTableAltered sur true dans les paramètres ChangeProcessingDdlHandlingPolicy de la tâche." } }
    - { id: b, text: { en: "Set TargetTablePrepMode to DROP_AND_CREATE in the task's full-load settings.", fr: "Définir TargetTablePrepMode sur DROP_AND_CREATE dans les paramètres de chargement complet de la tâche." } }
    - { id: c, text: { en: "Set HandleSourceTableTruncated to true in the task's ChangeProcessingDdlHandlingPolicy settings.", fr: "Définir HandleSourceTableTruncated sur true dans les paramètres ChangeProcessingDdlHandlingPolicy de la tâche." } }
    - { id: d, text: { en: "Reload the affected tables from the AWS DMS console each time developers add a column.", fr: "Recharger les tables concernées depuis la console AWS DMS chaque fois que les développeurs ajoutent une colonne." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The change processing DDL handling policy controls how DDL captured during CDC is applied. HandleSourceTableAltered set to true alters the target table when the source table is altered, so added columns reach the target during ongoing replication, as long as the endpoints support that DDL."
    fr: "La politique de gestion du DDL du traitement des modifications détermine comment le DDL capturé pendant la CDC est appliqué. HandleSourceTableAltered défini sur true modifie la table cible lorsque la table source est modifiée : les colonnes ajoutées atteignent la cible pendant la réplication continue, à condition que les points de terminaison prennent en charge ce DDL."
  options:
    b:
      en: "TargetTablePrepMode applies only when a full load starts; it does not propagate ALTER statements made during CDC."
      fr: "TargetTablePrepMode ne s'applique qu'au démarrage d'un chargement complet ; il ne propage pas les instructions ALTER exécutées pendant la CDC."
    c:
      en: "HandleSourceTableTruncated replicates TRUNCATE statements, not ALTER statements that add columns."
      fr: "HandleSourceTableTruncated réplique les instructions TRUNCATE, pas les instructions ALTER qui ajoutent des colonnes."
    d:
      en: "Reloading tables is manual and reloads the data, which the requirements rule out."
      fr: "Recharger les tables est une opération manuelle qui recharge les données, ce que les exigences excluent."
references:
  - title: Task settings for change processing DDL handling
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.CustomizingTasks.TaskSettings.DDLHandling.html
