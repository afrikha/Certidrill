id: deac01-2b-conn-onprem-vpn
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants an AWS Glue crawler and ETL jobs to read an on-premises Oracle database that has only a private IP address. The data center is connected to a VPC by an AWS Site-to-Site VPN that terminates on a virtual private gateway. The VPC has private subnets with a NAT gateway for internet access. The database must not be exposed to the internet.

    How should the data engineer configure the AWS Glue connection?
  fr: |
    Une entreprise veut qu'un robot d'analyse (crawler) et des tâches ETL AWS Glue lisent une base de données Oracle sur site qui n'a qu'une adresse IP privée. Le centre de données est relié à un VPC par un AWS Site-to-Site VPN qui aboutit sur une passerelle réseau privée virtuelle. Le VPC a des sous-réseaux privés dotés d'une passerelle NAT pour l'accès à Internet. La base de données ne doit pas être exposée à Internet.

    Comment l'ingénieur de données doit-il configurer la connexion AWS Glue ?
body:
  options:
    - { id: a, text: { en: "Create a JDBC connection in a public subnet whose route table sends all traffic to the internet gateway, and use the database's private IP address in the JDBC URL.", fr: "Créer une connexion JDBC dans un sous-réseau public dont la table de routage envoie tout le trafic vers la passerelle Internet, et utiliser l'adresse IP privée de la base de données dans l'URL JDBC." } }
    - { id: b, text: { en: "Create a JDBC connection without any VPC settings, and publish the database through a public IP address that allows only the AWS Glue IP ranges.", fr: "Créer une connexion JDBC sans paramètres de VPC, et publier la base de données au moyen d'une adresse IP publique qui n'autorise que les plages d'adresses IP d'AWS Glue." } }
    - { id: c, text: { en: "Create a JDBC connection in a private subnet whose route table sends the on-premises CIDR to the virtual private gateway, with a self-referencing security group rule.", fr: "Créer une connexion JDBC dans un sous-réseau privé dont la table de routage envoie le CIDR sur site vers la passerelle réseau privée virtuelle, avec une règle de groupe de sécurité autoréférencée." } }
    - { id: d, text: { en: "Create a JDBC connection in a private subnet whose route table sends all traffic to the NAT gateway, and allow the NAT gateway's public IP address on the on-premises firewall.", fr: "Créer une connexion JDBC dans un sous-réseau privé dont la table de routage envoie tout le trafic vers la passerelle NAT, et autoriser l'adresse IP publique de la passerelle NAT sur le pare-feu sur site." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Glue creates network interfaces with private IP addresses in the connection's subnet, so the subnet's route table must send the on-premises range through the VPN, and a security group with a self-referencing inbound rule for all TCP ports lets the Glue components communicate. A private subnet with NAT access also gives Glue the internet access it needs for AWS services without endpoints."
    fr: "AWS Glue crée des interfaces réseau dotées d'adresses IP privées dans le sous-réseau de la connexion : la table de routage du sous-réseau doit envoyer la plage sur site par le VPN, et un groupe de sécurité doté d'une règle entrante autoréférencée pour tous les ports TCP permet aux composants Glue de communiquer. Un sous-réseau privé avec accès NAT donne aussi à Glue l'accès Internet dont il a besoin pour les services AWS sans point de terminaison."
  options:
    a:
      en: "The Glue network interfaces have no public IP addresses, so a route to an internet gateway does not work, and a private on-premises address is not reachable through it."
      fr: "Les interfaces réseau Glue n'ont pas d'adresse IP publique : un itinéraire vers une passerelle Internet ne fonctionne pas, et une adresse privée sur site n'est pas accessible par ce biais."
    b:
      en: "Publishing the database on a public IP address exposes it to the internet, which the requirements forbid."
      fr: "Publier la base de données sur une adresse IP publique l'expose à Internet, ce que les exigences interdisent."
    d:
      en: "A NAT gateway sends traffic to the internet, not over the VPN, so the database's private address is not reached and it would have to be exposed publicly."
      fr: "Une passerelle NAT envoie le trafic vers Internet, pas par le VPN : l'adresse privée de la base de données n'est pas atteinte, et la base devrait être exposée publiquement."
references:
  - title: Connecting to a JDBC data store in a VPC
    url: https://docs.aws.amazon.com/glue/latest/dg/connection-JDBC-VPC.html
