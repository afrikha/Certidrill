id: deac01-2c-exp-staging-prefix
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AWS Glue jobs write temporary files to the staging/ prefix of an Amazon S3 bucket that does not use versioning. The files must be deleted 14 days after they are created. Objects under the other prefixes of the bucket must be kept indefinitely. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Des tâches AWS Glue écrivent des fichiers temporaires dans le préfixe staging/ d'un compartiment Amazon S3 qui n'utilise pas la gestion des versions. Les fichiers doivent être supprimés 14 jours après leur création. Les objets des autres préfixes du compartiment doivent être conservés indéfiniment. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an S3 Lifecycle rule with no filter and an Expiration action that expires objects 14 days after creation.", fr: "Créer une règle S3 Lifecycle sans filtre avec une action Expiration qui fait expirer les objets 14 jours après leur création." }
    - id: b
      text: { en: "Create an S3 Lifecycle rule with a staging/ prefix filter and an Expiration action that expires objects 14 days after creation.", fr: "Créer une règle S3 Lifecycle avec un filtre de préfixe staging/ et une action Expiration qui fait expirer les objets 14 jours après leur création." }
    - id: c
      text: { en: "Create an S3 Lifecycle rule with a staging/ prefix filter and a NoncurrentVersionExpiration action with NoncurrentDays set to 14.", fr: "Créer une règle S3 Lifecycle avec un filtre de préfixe staging/ et une action NoncurrentVersionExpiration avec NoncurrentDays défini à 14." }
    - id: d
      text: { en: "Schedule an AWS Glue Python shell job that deletes the objects under staging/ that are older than 14 days every day.", fr: "Planifier une tâche AWS Glue Python shell qui supprime chaque jour les objets de staging/ datant de plus de 14 jours." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Expiration action with Days set to 14 removes objects 14 days after creation, and the prefix filter limits the rule to staging/. In a bucket without versioning, expired objects are deleted permanently, and S3 does the work with no code to run.
    fr: |
      Une action Expiration avec Days défini à 14 supprime les objets 14 jours après leur création, et le filtre de préfixe limite la règle à staging/. Dans un compartiment sans gestion des versions, les objets expirés sont supprimés définitivement, et S3 fait le travail sans code à exécuter.
  options:
    a: { en: "Without a filter, the rule would also delete the objects under the other prefixes, which must be kept.", fr: "Sans filtre, la règle supprimerait aussi les objets des autres préfixes, qui doivent être conservés." }
    c: { en: "Noncurrent versions exist only in versioned buckets, so this action deletes nothing in this bucket.", fr: "Les versions non actuelles n'existent que dans les compartiments versionnés : cette action ne supprime rien dans ce compartiment." }
    d: { en: "The job works but must be written, scheduled and maintained, which is more overhead than a lifecycle rule.", fr: "La tâche fonctionne, mais doit être écrite, planifiée et maintenue, ce qui demande plus d'efforts qu'une règle de cycle de vie." }
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
