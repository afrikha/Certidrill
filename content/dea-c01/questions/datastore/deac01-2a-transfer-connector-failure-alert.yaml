id: deac01-2a-transfer-connector-failure-alert
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Transfer Family SFTP connectors to retrieve files from partner SFTP servers into Amazon S3. An AWS Glue workflow processes the files. The operations team must receive an email whenever a file retrieval from a partner server fails, without any custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise des connecteurs SFTP AWS Transfer Family pour récupérer dans Amazon S3 des fichiers depuis les serveurs SFTP de ses partenaires. Un flux de travail AWS Glue traite les fichiers. L'équipe des opérations doit recevoir un e-mail chaque fois qu'une récupération de fichier depuis un serveur partenaire échoue, sans code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge rule for SFTP Connector File Retrieve Failed events from aws.transfer that targets an SNS topic with an email subscription.", fr: "Créer une règle EventBridge pour les événements SFTP Connector File Retrieve Failed de la source aws.transfer, avec pour cible une rubrique SNS dotée d'un abonnement e-mail." } }
    - { id: b, text: { en: "Configure an S3 Event Notification for ObjectCreated events on the landing prefix that publishes to an SNS topic with an email subscription.", fr: "Configurer une notification d'événement S3 pour les événements ObjectCreated sur le préfixe de dépôt, publiée sur une rubrique SNS dotée d'un abonnement e-mail." } }
    - { id: c, text: { en: "Create a CloudTrail trail and a CloudWatch Logs metric filter that alarms when a StartFileTransfer API call returns an error.", fr: "Créer un journal d'activité CloudTrail et un filtre de métriques CloudWatch Logs qui déclenche une alarme lorsqu'un appel d'API StartFileTransfer renvoie une erreur." } }
    - { id: d, text: { en: "Add a step to the AWS Glue workflow that checks whether the expected files exist and sends an email when one is missing.", fr: "Ajouter au flux de travail AWS Glue une étape qui vérifie la présence des fichiers attendus et envoie un e-mail s'il en manque un." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Transfer Family publishes SFTP connector events, including SFTP Connector File Retrieve Failed, to the default EventBridge event bus with the source aws.transfer, and connector events have durable delivery. A rule that matches this detail-type and targets an SNS topic emails the team with no code."
    fr: "Transfer Family publie les événements des connecteurs SFTP, dont SFTP Connector File Retrieve Failed, sur le bus d'événements EventBridge par défaut avec la source aws.transfer, et les événements de connecteurs ont une livraison durable. Une règle qui correspond à ce detail-type et cible une rubrique SNS envoie un e-mail à l'équipe sans code."
  options:
    b:
      en: "ObjectCreated fires when a file arrives, which is a success; a failed retrieval creates no object and sends no notification."
      fr: "ObjectCreated se déclenche à l'arrivée d'un fichier, donc en cas de réussite ; une récupération échouée ne crée aucun objet et n'envoie aucune notification."
    c:
      en: "StartFileTransfer starts the transfer asynchronously, so the API call succeeds even when the retrieval fails later."
      fr: "StartFileTransfer démarre le transfert de façon asynchrone : l'appel d'API réussit même si la récupération échoue ensuite."
    d:
      en: "A check step is custom logic to write and maintain, and it detects only missing files at the time the workflow runs."
      fr: "Une étape de vérification est une logique personnalisée à écrire et à maintenir, et elle ne détecte les fichiers manquants qu'au moment où le flux de travail s'exécute."
references:
  - title: Managing Transfer Family events using Amazon EventBridge
    url: https://docs.aws.amazon.com/transfer/latest/userguide/eventbridge.html
