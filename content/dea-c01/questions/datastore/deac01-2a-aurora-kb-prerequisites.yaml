id: deac01-2a-aurora-kb-prerequisites
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company wants to use its existing Amazon Aurora PostgreSQL-Compatible Edition 16 cluster as the vector store of an Amazon Bedrock knowledge base. A database administrator has already created the following table and index:

    ```sql
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE TABLE bedrock_integration.bedrock_kb (
      id uuid PRIMARY KEY,
      embedding vector(1024),
      chunks text,
      metadata json
    );
    CREATE INDEX ON bedrock_integration.bedrock_kb USING hnsw (embedding vector_cosine_ops);
    ```

    Which combination of additional actions is required so that the knowledge base can use the cluster? (Choose two.)
  fr: |
    Une entreprise veut utiliser son cluster Amazon Aurora PostgreSQL-Compatible Edition 16 existant comme magasin de vecteurs d'une base de connaissances Amazon Bedrock. Un administrateur de bases de données a déjà créé la table et l'index suivants :

    ```sql
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE TABLE bedrock_integration.bedrock_kb (
      id uuid PRIMARY KEY,
      embedding vector(1024),
      chunks text,
      metadata json
    );
    CREATE INDEX ON bedrock_integration.bedrock_kb USING hnsw (embedding vector_cosine_ops);
    ```

    Quelle combinaison d'actions supplémentaires est nécessaire pour que la base de connaissances puisse utiliser le cluster ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable IAM database authentication and grant the knowledge base role the rds-db:connect permission.", fr: "Activer l'authentification de base de données IAM et accorder au rôle de la base de connaissances l'autorisation rds-db:connect." } }
    - { id: b, text: { en: "Create an Amazon RDS Proxy for the cluster and give its endpoint to the knowledge base.", fr: "Créer un Amazon RDS Proxy pour le cluster et fournir son point de terminaison à la base de connaissances." } }
    - { id: c, text: { en: "Enable the RDS Data API on the Aurora cluster.", fr: "Activer l'API de données RDS (RDS Data API) sur le cluster Aurora." } }
    - { id: d, text: { en: "Install the pg_trgm extension and create a trigram index on the chunks column.", fr: "Installer l'extension pg_trgm et créer un index trigramme sur la colonne chunks." } }
    - { id: e, text: { en: "Store the credentials of a database user in AWS Secrets Manager and give the secret to the knowledge base.", fr: "Stocker les informations d'identification d'un utilisateur de base de données dans AWS Secrets Manager et fournir le secret à la base de connaissances." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Amazon Bedrock reaches an Aurora PostgreSQL vector store through the RDS Data API, so the Data API must be enabled on the cluster. The knowledge base authenticates with a database user whose credentials are stored in AWS Secrets Manager. Aurora PostgreSQL 16 already includes a pgvector version with HNSW support."
    fr: "Amazon Bedrock accède à un magasin de vecteurs Aurora PostgreSQL par l'API de données RDS : celle-ci doit être activée sur le cluster. La base de connaissances s'authentifie avec un utilisateur de base de données dont les informations d'identification sont stockées dans AWS Secrets Manager. Aurora PostgreSQL 16 inclut déjà une version de pgvector qui prend en charge HNSW."
  options:
    a:
      en: "The knowledge base uses a Secrets Manager secret through the Data API, not IAM database authentication tokens."
      fr: "La base de connaissances utilise un secret Secrets Manager via l'API de données, pas des jetons d'authentification de base de données IAM."
    b:
      en: "The knowledge base connects through the Data API; an RDS Proxy endpoint is not part of the configuration."
      fr: "La base de connaissances se connecte via l'API de données ; un point de terminaison RDS Proxy ne fait pas partie de la configuration."
    d:
      en: "A trigram index is not required; the documented text index for the chunks column is a GIN index on to_tsvector, and it is optional for the connection."
      fr: "Un index trigramme n'est pas nécessaire ; l'index de texte documenté pour la colonne chunks est un index GIN sur to_tsvector, et il n'est pas requis pour la connexion."
references:
  - title: Using Aurora PostgreSQL as a Knowledge Base for Amazon Bedrock
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
