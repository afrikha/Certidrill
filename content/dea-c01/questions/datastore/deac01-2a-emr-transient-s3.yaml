id: deac01-2a-emr-transient-s3
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs nightly Apache Spark jobs on a long-running Amazon EMR cluster. To reduce cost, the company wants to launch a cluster each night and terminate it when the jobs finish. The input data and the job results must remain available after the cluster terminates and must be readable by Amazon Athena.

    Which storage design will meet these requirements?
  fr: |
    Une entreprise exécute chaque nuit des tâches Apache Spark sur un cluster Amazon EMR permanent. Pour réduire les coûts, elle veut lancer un cluster chaque nuit et le résilier à la fin des tâches. Les données d'entrée et les résultats des tâches doivent rester disponibles après la résiliation du cluster et être lisibles par Amazon Athena.

    Quelle conception du stockage répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the input data and results in HDFS on the core nodes of each cluster.", fr: "Stocker les données d'entrée et les résultats dans HDFS sur les nœuds principaux de chaque cluster." } }
    - { id: b, text: { en: "Store the input data and results in Amazon S3, and use HDFS only for intermediate data.", fr: "Stocker les données d'entrée et les résultats dans Amazon S3, et utiliser HDFS uniquement pour les données intermédiaires." } }
    - { id: c, text: { en: "Store the input data and results on the instance store volumes of the core nodes.", fr: "Stocker les données d'entrée et les résultats sur les volumes de stockage d'instance des nœuds principaux." } }
    - { id: d, text: { en: "Store the input data and results on the EBS volumes that Amazon EMR attaches to the core nodes.", fr: "Stocker les données d'entrée et les résultats sur les volumes EBS qu'Amazon EMR attache aux nœuds principaux." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon S3, accessed with s3:// paths, is the durable storage for the inputs and outputs of EMR jobs: it outlives the cluster and Athena can query it. HDFS is ephemeral and is reclaimed when the cluster ends, so it fits only intermediate step results."
    fr: "Amazon S3, accessible par des chemins s3://, est le stockage durable des entrées et sorties des tâches EMR : il survit au cluster et Athena peut l'interroger. HDFS est éphémère et récupéré à la fin du cluster : il ne convient qu'aux résultats intermédiaires des étapes."
  options:
    a:
      en: "HDFS is reclaimed when the cluster terminates, so the data and results would be lost every night."
      fr: "HDFS est récupéré à la résiliation du cluster : les données et les résultats seraient perdus chaque nuit."
    c:
      en: "Instance store data lasts only as long as the EC2 instance, so it is lost when the cluster terminates."
      fr: "Les données du stockage d'instance ne durent que le temps de l'instance EC2 : elles sont perdues à la résiliation du cluster."
    d:
      en: "The EBS volumes of the cluster nodes back HDFS and are not a data lake that Athena can query after the cluster ends."
      fr: "Les volumes EBS des nœuds du cluster servent à HDFS et ne constituent pas un lac de données qu'Athena peut interroger après la fin du cluster."
references:
  - title: Working with storage and file systems with Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-file-systems.html
