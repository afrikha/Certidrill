id: deac01-2c-sch-ddb-composite-sk
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company designs a single Amazon DynamoDB table for customer data: profiles, orders and support tickets. The access patterns are to get a customer's profile, to list a customer's orders within a date range, and to list a customer's tickets. Each customer can have thousands of orders.

    Which key design will support these access patterns MOST efficiently?
  fr: |
    Une entreprise conçoit une table Amazon DynamoDB unique pour les données clients : profils, commandes et tickets de support. Les modèles d'accès consistent à obtenir le profil d'un client, à lister les commandes d'un client sur une plage de dates et à lister les tickets d'un client. Chaque client peut avoir des milliers de commandes.

    Quelle conception de clés prend en charge ces modèles d'accès le plus efficacement ?
body:
  options:
    - id: a
      text: { en: "Partition key set to the entity type (PROFILE, ORDER or TICKET), and sort key set to the customer ID.", fr: "Clé de partition définie au type d'entité (PROFILE, ORDER ou TICKET), et clé de tri définie à l'ID client." }
    - id: b
      text: { en: "Partition key set to the order date, and sort key set to the customer ID followed by the item ID.", fr: "Clé de partition définie à la date de commande, et clé de tri définie à l'ID client suivi de l'ID de l'élément." }
    - id: c
      text: { en: "Partition key set to the customer ID with no sort key, and orders and tickets stored as lists in the profile item.", fr: "Clé de partition définie à l'ID client sans clé de tri, et commandes et tickets stockés sous forme de listes dans l'élément du profil." }
    - id: d
      text: { en: "Partition key set to the customer ID, and sort key values such as PROFILE, ORDER#2026-11-02#1234 and TICKET#5678.", fr: "Clé de partition définie à l'ID client, et valeurs de clé de tri comme PROFILE, ORDER#2026-11-02#1234 et TICKET#5678." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With the customer ID as partition key, all of a customer's items are grouped together, and prefixed sort keys model the item types. A Query with begins_with on TICKET# lists the tickets, and a between condition on ORDER# keys with dates returns the orders in a date range.
    fr: |
      Avec l'ID client comme clé de partition, tous les éléments d'un client sont regroupés, et des clés de tri préfixées modélisent les types d'éléments. Une requête Query avec begins_with sur TICKET# liste les tickets, et une condition between sur les clés ORDER# avec dates renvoie les commandes d'une plage de dates.
  options:
    a: { en: "Three partition key values concentrate all traffic on a few hot keys, and a customer's items are spread across them.", fr: "Trois valeurs de clé de partition concentrent tout le trafic sur quelques clés chaudes, et les éléments d'un client y sont dispersés." }
    b: { en: "Getting a profile or a customer's orders would require querying many date partitions or scanning the table.", fr: "Obtenir un profil ou les commandes d'un client exigerait d'interroger de nombreuses partitions de dates ou d'analyser la table." }
    c: { en: "Thousands of orders in one item would exceed the item size limit, and lists cannot be queried by date range.", fr: "Des milliers de commandes dans un seul élément dépasseraient la taille maximale d'un élément, et les listes ne peuvent pas être interrogées par plage de dates." }
references:
  - title: Best practices for using sort keys to organize data in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-sort-keys.html
