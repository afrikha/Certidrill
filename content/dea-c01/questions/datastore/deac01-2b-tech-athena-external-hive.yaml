id: deac01-2b-tech-athena-external-hive
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's Spark platform on Amazon EMR uses an Apache Hive metastore that runs in a private VPC. Hundreds of tables describe data in Amazon S3. Analysts now want to query these tables with Amazon Athena. Other teams depend on the metastore, so the metadata must stay in the Hive metastore and must not be migrated to the AWS Glue Data Catalog.

    Which solution will meet these requirements?
  fr: |
    La plateforme Spark d'une entreprise sur Amazon EMR utilise un metastore Apache Hive qui s'exécute dans un VPC privé. Des centaines de tables décrivent des données dans Amazon S3. Les analystes veulent désormais interroger ces tables avec Amazon Athena. D'autres équipes dépendent du metastore : les métadonnées doivent rester dans le metastore Hive et ne doivent pas être migrées vers l'AWS Glue Data Catalog.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an AWS Glue crawler on the S3 data every night so that Athena can use the tables that the crawler creates.", fr: "Exécuter chaque nuit un robot d'analyse AWS Glue sur les données S3 afin qu'Athena puisse utiliser les tables créées par le robot." } }
    - { id: b, text: { en: "Register the Hive metastore in Athena as a catalog through a Lambda function that connects to the metastore in the VPC.", fr: "Enregistrer le metastore Hive dans Athena comme catalogue au moyen d'une fonction Lambda qui se connecte au metastore dans le VPC." } }
    - { id: c, text: { en: "Create a Redshift Spectrum external schema FROM HIVE METASTORE, and give the analysts the Redshift query editor instead of Athena.", fr: "Créer un schéma externe Redshift Spectrum FROM HIVE METASTORE, et donner aux analystes l'éditeur de requêtes Redshift au lieu d'Athena." } }
    - { id: d, text: { en: "Enable partition projection on each table so that Athena computes the table locations without reading any catalog.", fr: "Activer la projection de partitions sur chaque table afin qu'Athena calcule les emplacements des tables sans lire aucun catalogue." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Athena data connector for external Hive metastore lets Athena query data sets described in a Hive metastore without migrating the metadata. A Lambda function in the VPC communicates with the metastore and is registered under a catalog name that analysts use in their queries."
    fr: "Le connecteur de données Athena pour metastore Hive externe permet à Athena d'interroger des jeux de données décrits dans un metastore Hive sans migrer les métadonnées. Une fonction Lambda dans le VPC communique avec le metastore et est enregistrée sous un nom de catalogue que les analystes utilisent dans leurs requêtes."
  options:
    a:
      en: "The crawler writes new table definitions to the Data Catalog, which duplicates the metadata outside the Hive metastore."
      fr: "Le robot d'analyse écrit de nouvelles définitions de tables dans le Data Catalog, ce qui duplique les métadonnées hors du metastore Hive."
    c:
      en: "Redshift Spectrum can read a Hive metastore, but the analysts must query with Athena."
      fr: "Redshift Spectrum peut lire un metastore Hive, mais les analystes doivent interroger avec Athena."
    d:
      en: "Partition projection computes partitions of a table that is already defined in a catalog; it does not replace the table definitions."
      fr: "La projection de partitions calcule les partitions d'une table déjà définie dans un catalogue ; elle ne remplace pas les définitions de tables."
references:
  - title: Use an external Hive metastore
    url: https://docs.aws.amazon.com/athena/latest/ug/connect-to-data-source-hive.html
