id: deac01-2c-unload-parquet-partition
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to move 3 years of order history from an Amazon Redshift table to Amazon S3 and query it with Amazon Athena. Almost every analyst query filters on the order_date column. The data must be stored in a columnar format, and Athena queries must scan as little data as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise veut déplacer 3 ans d'historique de commandes d'une table Amazon Redshift vers Amazon S3 et l'interroger avec Amazon Athena. Presque toutes les requêtes des analystes filtrent sur la colonne order_date. Les données doivent être stockées dans un format en colonnes, et les requêtes Athena doivent analyser le moins de données possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run UNLOAD with FORMAT AS PARQUET and PARTITION BY (order_date), then register the partitions in the AWS Glue Data Catalog.", fr: "Exécuter UNLOAD avec FORMAT AS PARQUET et PARTITION BY (order_date), puis enregistrer les partitions dans AWS Glue Data Catalog." }
    - id: b
      text: { en: "Run UNLOAD with FORMAT AS CSV and PARALLEL OFF, then create an Athena table over the output prefix.", fr: "Exécuter UNLOAD avec FORMAT AS CSV et PARALLEL OFF, puis créer une table Athena sur le préfixe de sortie." }
    - id: c
      text: { en: "Run UNLOAD with FORMAT AS JSON and MANIFEST VERBOSE, then create an Athena table from the manifest.", fr: "Exécuter UNLOAD avec FORMAT AS JSON et MANIFEST VERBOSE, puis créer une table Athena à partir du manifeste." }
    - id: d
      text: { en: "Run UNLOAD with FORMAT AS PARQUET and MAXFILESIZE 6.2 GB into one prefix, then create an Athena table over it.", fr: "Exécuter UNLOAD avec FORMAT AS PARQUET et MAXFILESIZE 6.2 GB dans un seul préfixe, puis créer une table Athena dessus." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      FORMAT AS PARQUET writes columnar, Snappy-compressed files, and PARTITION BY writes Hive-style folders such as order_date=2025-01-31/, so Athena reads only the partitions that a query filters on. UNLOAD does not update any catalog, so the new partitions must be registered (for example with a crawler or ALTER TABLE ADD PARTITION).
    fr: |
      FORMAT AS PARQUET écrit des fichiers en colonnes compressés en Snappy, et PARTITION BY écrit des dossiers de style Hive comme order_date=2025-01-31/ : Athena ne lit que les partitions sur lesquelles une requête filtre. UNLOAD ne met à jour aucun catalogue : les nouvelles partitions doivent être enregistrées (par exemple avec un robot d'analyse ou ALTER TABLE ADD PARTITION).
  options:
    b: { en: "CSV is a row format, and without partitions every query scans the whole dataset.", fr: "CSV est un format en lignes et, sans partitions, chaque requête analyse tout le jeu de données." }
    c: { en: "JSON is a row format; a verbose manifest adds metadata about the files but does not let Athena skip data.", fr: "JSON est un format en lignes ; un manifeste détaillé ajoute des métadonnées sur les fichiers, mais ne permet pas à Athena d'ignorer des données." }
    d: { en: "The files are columnar, but with no partitions a filter on order_date still reads every file of the table.", fr: "Les fichiers sont en colonnes, mais sans partitions un filtre sur order_date lit toujours tous les fichiers de la table." }
references:
  - title: UNLOAD
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_UNLOAD.html
