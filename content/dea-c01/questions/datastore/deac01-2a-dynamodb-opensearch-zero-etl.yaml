id: deac01-2a-dynamodb-opensearch-zero-etl
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer keeps its product catalog in an Amazon DynamoDB table. The website needs full-text search with relevance ranking and tolerance for misspellings on product names and descriptions. The search data must stay in sync with the table in near real time, and the company does not want to write or maintain custom synchronization code.

    Which solution will meet these requirements?
  fr: |
    Un distributeur conserve son catalogue de produits dans une table Amazon DynamoDB. Le site web a besoin d'une recherche en texte intégral avec classement par pertinence et tolérance aux fautes de frappe sur les noms et descriptions de produits. Les données de recherche doivent rester synchronisées avec la table en temps quasi réel, et l'entreprise ne veut ni écrire ni maintenir de code de synchronisation personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set up the DynamoDB zero-ETL integration with Amazon OpenSearch Service through an OpenSearch Ingestion pipeline.", fr: "Configurer l'intégration zéro ETL de DynamoDB avec Amazon OpenSearch Service au moyen d'un pipeline OpenSearch Ingestion." } }
    - { id: b, text: { en: "Add global secondary indexes on the name and description attributes and use Query with begins_with.", fr: "Ajouter des index secondaires globaux sur les attributs name et description et utiliser Query avec begins_with." } }
    - { id: c, text: { en: "Query the table from Amazon Athena with the DynamoDB connector and use LIKE predicates on the attributes.", fr: "Interroger la table depuis Amazon Athena avec le connecteur DynamoDB et utiliser des prédicats LIKE sur les attributs." } }
    - { id: d, text: { en: "Enable DynamoDB Streams and write a Lambda function that indexes each change into OpenSearch Service.", fr: "Activer DynamoDB Streams et écrire une fonction Lambda qui indexe chaque modification dans OpenSearch Service." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The zero-ETL integration uses the DynamoDB plugin of OpenSearch Ingestion: an export to Amazon S3 loads the initial snapshot, then DynamoDB Streams replicates changes in near real time, with no code to write. It requires point-in-time recovery and a stream with new and old images. OpenSearch Service then provides relevance-ranked full-text and fuzzy search."
    fr: "L'intégration zéro ETL utilise le plugin DynamoDB d'OpenSearch Ingestion : une exportation vers Amazon S3 charge l'instantané initial, puis DynamoDB Streams réplique les modifications en temps quasi réel, sans code à écrire. Elle exige la restauration à un instant dans le passé (PITR) et un flux avec les nouvelles et anciennes images. OpenSearch Service fournit ensuite la recherche en texte intégral classée par pertinence et la recherche approximative."
  options:
    b:
      en: "begins_with matches only key prefixes; DynamoDB indexes provide no full-text relevance ranking or misspelling tolerance."
      fr: "begins_with ne correspond qu'à des préfixes de clé ; les index DynamoDB n'offrent ni classement par pertinence en texte intégral ni tolérance aux fautes."
    c:
      en: "Athena federated queries scan the table and LIKE gives no relevance ranking; this does not suit low-latency website search."
      fr: "Les requêtes fédérées Athena analysent la table et LIKE n'offre aucun classement par pertinence ; cela ne convient pas à une recherche de site web à faible latence."
    d:
      en: "This works but is the custom synchronization code that the company does not want to write or maintain."
      fr: "Cela fonctionne, mais c'est le code de synchronisation personnalisé que l'entreprise ne veut ni écrire ni maintenir."
references:
  - title: DynamoDB zero-ETL integration with Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/OpenSearchIngestionForDynamoDB.html
