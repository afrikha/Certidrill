id: deac01-2a-aurora-zero-etl-redshift
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its order application on Amazon Aurora MySQL-Compatible Edition. The analytics team needs the order data in Amazon Redshift, refreshed continuously, for reporting. The company does not want to build or maintain any ETL pipeline, and the analytical queries must not run on the Aurora database.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute son application de commandes sur Amazon Aurora MySQL-Compatible Edition. L'équipe d'analyse a besoin des données de commandes dans Amazon Redshift, actualisées en continu, pour le reporting. L'entreprise ne veut ni créer ni maintenir de pipeline ETL, et les requêtes analytiques ne doivent pas s'exécuter sur la base Aurora.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an external schema FROM MYSQL in Redshift and run the reports as federated queries.", fr: "Créer dans Redshift un schéma externe FROM MYSQL et exécuter les rapports sous forme de requêtes fédérées." } }
    - { id: b, text: { en: "Create an Aurora zero-ETL integration with the Redshift warehouse as the target.", fr: "Créer une intégration zéro ETL Aurora avec l'entrepôt Redshift comme cible." } }
    - { id: c, text: { en: "Create an AWS DMS replication instance and a full-load and CDC task to Redshift.", fr: "Créer une instance de réplication AWS DMS et une tâche de chargement complet et CDC vers Redshift." } }
    - { id: d, text: { en: "Schedule a nightly AWS Glue job that reads the tables over JDBC and loads Redshift.", fr: "Planifier une tâche AWS Glue nocturne qui lit les tables en JDBC et charge Redshift." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A zero-ETL integration performs an initial load and then replicates data from Aurora MySQL into a Redshift cluster or Serverless workgroup. AWS creates and manages the replication and monitors its health, so there is no pipeline to maintain, and the reports run on Redshift while the application keeps using Aurora."
    fr: "Une intégration zéro ETL effectue un chargement initial, puis réplique les données d'Aurora MySQL vers un cluster ou un groupe de travail Serverless Redshift. AWS crée et gère la réplication et en surveille l'état : aucun pipeline n'est à maintenir, et les rapports s'exécutent sur Redshift pendant que l'application continue d'utiliser Aurora."
  options:
    a:
      en: "Federated queries read the live data on the Aurora database at query time, which puts the analytical load on Aurora."
      fr: "Les requêtes fédérées lisent les données en direct dans la base Aurora au moment de la requête, ce qui fait porter la charge analytique sur Aurora."
    c:
      en: "This replicates continuously but leaves a replication instance and tasks for the company to manage."
      fr: "Cela réplique en continu, mais laisse à l'entreprise une instance de réplication et des tâches à gérer."
    d:
      en: "A nightly job is an ETL pipeline to maintain, and the data would be refreshed only once a day."
      fr: "Une tâche nocturne est un pipeline ETL à maintenir, et les données ne seraient actualisées qu'une fois par jour."
references:
  - title: Zero-ETL integrations
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/zero-etl-using.html
