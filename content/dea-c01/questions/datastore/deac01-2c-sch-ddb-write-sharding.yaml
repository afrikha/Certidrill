id: deac01-2c-sch-ddb-write-sharding
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IoT company writes sensor readings to an Amazon DynamoDB table with reading_date (YYYY-MM-DD) as the partition key and sensor_id#timestamp as the sort key. All writes of a day go to the same partition key value, and writes are throttled although the table's total capacity is sufficient. A daily report reads all readings of one day, and lookups of a single reading are rare.

    Which solution will resolve the throttling?
  fr: |
    Une entreprise IoT écrit des relevés de capteurs dans une table Amazon DynamoDB avec reading_date (YYYY-MM-DD) comme clé de partition et sensor_id#timestamp comme clé de tri. Toutes les écritures d'une journée vont vers la même valeur de clé de partition, et les écritures sont limitées alors que la capacité totale de la table est suffisante. Un rapport quotidien lit tous les relevés d'une journée, et les recherches d'un seul relevé sont rares.

    Quelle solution permet de résoudre la limitation ?
body:
  options:
    - id: a
      text: { en: "Switch the table to on-demand capacity mode so that it scales to the write rate automatically.", fr: "Passer la table en mode de capacité à la demande afin qu'elle s'adapte automatiquement au débit d'écriture." }
    - id: b
      text: { en: "Add a global secondary index with reading_date as its partition key to spread the write load.", fr: "Ajouter un index secondaire global avec reading_date comme clé de partition pour répartir la charge d'écriture." }
    - id: c
      text: { en: "Append a random suffix from 1 to N to the partition key value, and query each suffix to read a day.", fr: "Ajouter un suffixe aléatoire de 1 à N à la valeur de la clé de partition, et interroger chaque suffixe pour lire une journée." }
    - id: d
      text: { en: "Increase the provisioned write capacity of the table until the throttling stops.", fr: "Augmenter la capacité d'écriture provisionnée de la table jusqu'à l'arrêt de la limitation." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Write sharding spreads the writes of one logical key over many partition key values, such as 2026-11-23.1 to 2026-11-23.200, so they land on different partitions. Because single-item lookups are rare, random suffixes are suitable: the daily report queries each suffix and merges the results.
    fr: |
      Le partitionnement des écritures (write sharding) répartit les écritures d'une clé logique sur de nombreuses valeurs de clé de partition, comme 2026-11-23.1 à 2026-11-23.200, qui tombent sur des partitions différentes. Les recherches d'un seul élément étant rares, des suffixes aléatoires conviennent : le rapport quotidien interroge chaque suffixe et fusionne les résultats.
  options:
    a: { en: "On-demand mode removes capacity planning, but all the day's writes still target one partition key value, which remains a hot partition.", fr: "Le mode à la demande supprime la planification de la capacité, mais toutes les écritures de la journée visent toujours une seule valeur de clé de partition, qui reste une partition chaude." }
    b: { en: "The index would have the same hot key, and an index that cannot keep up with writes throttles writes to the base table.", fr: "L'index aurait la même clé chaude, et un index qui ne suit pas les écritures limite les écritures dans la table de base." }
    d: { en: "The table already has enough total capacity; the throttling comes from one hot key, not from the table total.", fr: "La table dispose déjà d'une capacité totale suffisante ; la limitation vient d'une clé chaude, pas du total de la table." }
references:
  - title: Using write sharding to distribute workloads evenly in your DynamoDB table
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html
