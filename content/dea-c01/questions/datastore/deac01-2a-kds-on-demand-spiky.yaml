id: deac01-2a-kds-on-demand-spiky
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A ride-sharing company streams trip telemetry into an Amazon Kinesis data stream that three consumer applications read. Traffic varies from a few hundred KB per second at night to bursts several times higher during public events, and the bursts cannot be predicted. The data engineering team does not want to plan, monitor or adjust shard counts.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de VTC diffuse la télémétrie de ses trajets dans un flux de données Amazon Kinesis que trois applications consommatrices lisent. Le trafic varie de quelques centaines de Ko par seconde la nuit à des pics plusieurs fois plus élevés lors d'événements publics, et ces pics sont imprévisibles. L'équipe d'ingénierie des données ne veut ni planifier, ni surveiller, ni ajuster le nombre de partitions (shards).

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Keep the stream in provisioned mode and set the shard count for the highest peak ever observed.", fr: "Conserver le flux en mode provisionné et définir le nombre de partitions pour le pic le plus élevé jamais observé." } }
    - { id: b, text: { en: "Switch the stream to on-demand capacity mode so that Kinesis manages the shards automatically.", fr: "Passer le flux en mode de capacité à la demande pour que Kinesis gère automatiquement les partitions." } }
    - { id: c, text: { en: "Keep provisioned mode and add a Lambda function that calls UpdateShardCount from a CloudWatch alarm.", fr: "Conserver le mode provisionné et ajouter une fonction Lambda qui appelle UpdateShardCount depuis une alarme CloudWatch." } }
    - { id: d, text: { en: "Replace the stream with an Amazon Data Firehose stream that uses Direct PUT as its source.", fr: "Remplacer le flux par un flux Amazon Data Firehose qui utilise Direct PUT comme source." } }
answer: { optionId: b }
explanation:
  correct:
    en: "On-demand mode suits unpredictable traffic: the stream adapts to up to double its previous peak and splits shards automatically as new peaks occur. The team pays per GB written and read and never sets a shard count."
    fr: "Le mode à la demande convient à un trafic imprévisible : le flux s'adapte jusqu'au double de son pic précédent et divise automatiquement les partitions lorsque de nouveaux pics surviennent. L'équipe paie par Go écrit et lu et ne définit jamais de nombre de partitions."
  options:
    a:
      en: "Sizing for the peak still requires capacity planning and makes the company pay for unused shards most of the day."
      fr: "Dimensionner pour le pic exige toujours une planification de capacité et fait payer des partitions inutilisées la majeure partie de la journée."
    c:
      en: "This works but adds a scaling function and alarms to build and maintain, which is more overhead than on-demand mode."
      fr: "Cela fonctionne, mais ajoute une fonction de mise à l'échelle et des alarmes à créer et à maintenir, soit plus de charge que le mode à la demande."
    d:
      en: "Firehose delivers records to destinations; it is not a stream that three custom consumer applications can read."
      fr: "Firehose livre les enregistrements à des destinations ; ce n'est pas un flux que trois applications consommatrices personnalisées peuvent lire."
references:
  - title: Choose the right mode to stream in
    url: https://docs.aws.amazon.com/streams/latest/dev/how-do-i-size-a-stream.html
