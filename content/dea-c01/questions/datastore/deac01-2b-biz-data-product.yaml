id: deac01-2b-biz-data-product
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A supply chain team publishes six related AWS Glue tables (orders, shipments, returns, carriers, warehouses and inventory snapshots) in Amazon SageMaker Catalog. Consumers often miss some of the tables and must submit six subscription requests to get all of them. The team wants consumers to find the tables as one unit and get access to all of them with a single request, while every request still requires the team's approval.

    Which solution will meet these requirements?
  fr: |
    Une équipe de la chaîne logistique publie six tables AWS Glue liées (commandes, expéditions, retours, transporteurs, entrepôts et instantanés de stock) dans Amazon SageMaker Catalog. Les consommateurs oublient souvent certaines tables et doivent soumettre six demandes d'abonnement pour les obtenir toutes. L'équipe veut que les consommateurs trouvent les tables comme un seul ensemble et obtiennent l'accès à toutes avec une seule demande, tout en exigeant toujours l'approbation de l'équipe pour chaque demande.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach the same glossary term to the six assets so that consumers can find them together with one search.", fr: "Associer le même terme de glossaire aux six ressources afin que les consommateurs puissent les trouver ensemble avec une seule recherche." } }
    - { id: b, text: { en: "Publish the six assets again with subscription approval disabled so that consumers get access immediately.", fr: "Republier les six ressources avec l'approbation des abonnements désactivée afin que les consommateurs obtiennent l'accès immédiatement." } }
    - { id: c, text: { en: "Group the six assets into a data product, and publish the data product with subscription approval required.", fr: "Regrouper les six ressources dans un produit de données, et publier le produit de données avec approbation des abonnements requise." } }
    - { id: d, text: { en: "Create an AWS Glue view that joins the six tables, and publish only the view as a new asset.", fr: "Créer une vue AWS Glue qui joint les six tables, et publier uniquement la vue comme nouvelle ressource." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A data product packages related data assets for a business use case, so consumers find them as a single unit. Consumers subscribe to the data product with one request, which the owning project reviews and approves, and access to the data is granted through a unified access model."
    fr: "Un produit de données regroupe des ressources de données liées pour un cas d'usage métier : les consommateurs les trouvent comme un seul ensemble. Ils s'abonnent au produit de données avec une seule demande, que le projet propriétaire examine et approuve, et l'accès aux données est accordé selon un modèle d'accès unifié."
  options:
    a:
      en: "A shared term helps search, but each table is still a separate asset that needs its own subscription request."
      fr: "Un terme commun facilite la recherche, mais chaque table reste une ressource distincte qui nécessite sa propre demande d'abonnement."
    b:
      en: "Disabling approval auto-approves every request, which removes the team's approval, and consumers still subscribe to each asset separately."
      fr: "Désactiver l'approbation approuve automatiquement chaque demande, ce qui supprime l'approbation de l'équipe, et les consommateurs s'abonnent toujours à chaque ressource séparément."
    d:
      en: "A single joined view changes the shape of the data and hides the six tables that consumers need individually."
      fr: "Une vue jointe unique modifie la forme des données et masque les six tables dont les consommateurs ont besoin individuellement."
references:
  - title: Data products
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/data-products.html
