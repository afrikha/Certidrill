id: deac01-2b-tech-schema-registry-backward
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Producers write Avro records to topics in an Amazon MSK cluster, and several consumer applications read them. Schemas are currently shared as files by email, and an incompatible change recently broke a consumer. The company wants a central, serverless catalog of the stream schemas that rejects a new schema version unless consumers can read data written with both the new and the previous version.

    Which solution will meet these requirements?
  fr: |
    Des producteurs écrivent des enregistrements Avro dans les rubriques d'un cluster Amazon MSK, et plusieurs applications consommatrices les lisent. Les schémas sont actuellement partagés sous forme de fichiers par e-mail, et une modification incompatible a récemment cassé un consommateur. L'entreprise veut un catalogue central et sans serveur des schémas de flux qui refuse une nouvelle version de schéma à moins que les consommateurs puissent lire les données écrites avec la nouvelle version et avec la précédente.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Register the schemas in the AWS Glue Schema Registry with the BACKWARD compatibility mode, and use the Schema Registry serializers and deserializers in the applications.", fr: "Enregistrer les schémas dans AWS Glue Schema Registry avec le mode de compatibilité BACKWARD, et utiliser les sérialiseurs et désérialiseurs de Schema Registry dans les applications." } }
    - { id: b, text: { en: "Register the schemas in the AWS Glue Schema Registry with the NONE compatibility mode, and use the Schema Registry serializers and deserializers in the applications.", fr: "Enregistrer les schémas dans AWS Glue Schema Registry avec le mode de compatibilité NONE, et utiliser les sérialiseurs et désérialiseurs de Schema Registry dans les applications." } }
    - { id: c, text: { en: "Store the .avsc schema files in an S3 bucket with versioning, and run an AWS Glue crawler on the bucket to create one table for each schema version.", fr: "Stocker les fichiers de schéma .avsc dans un compartiment S3 avec gestion des versions, et exécuter un robot d'analyse AWS Glue sur le compartiment pour créer une table par version de schéma." } }
    - { id: d, text: { en: "Create one AWS Glue Data Catalog table for each topic, and set the schema change policy of the table to LOG so that schema updates are rejected.", fr: "Créer une table AWS Glue Data Catalog par rubrique, et définir la politique de modification de schéma de la table sur LOG afin que les mises à jour de schéma soient refusées." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Glue Schema Registry is a serverless, free registry for Avro, JSON Schema and Protobuf schemas that integrates with Amazon MSK through open-source serializers and deserializers. The BACKWARD mode checks each new version against the previous one so that consumers can read both, and it is the recommended mode."
    fr: "AWS Glue Schema Registry est un registre sans serveur et gratuit pour les schémas Avro, JSON Schema et Protobuf, qui s'intègre à Amazon MSK au moyen de sérialiseurs et désérialiseurs open source. Le mode BACKWARD vérifie chaque nouvelle version par rapport à la précédente afin que les consommateurs puissent lire les deux, et c'est le mode recommandé."
  options:
    b:
      en: "NONE performs no compatibility check and accepts any new version, so an incompatible change could break consumers again."
      fr: "NONE n'effectue aucune vérification de compatibilité et accepte toute nouvelle version : une modification incompatible pourrait de nouveau casser les consommateurs."
    c:
      en: "A crawler infers tables from data files; it neither checks compatibility between versions nor serves schemas to producers and consumers."
      fr: "Un robot d'analyse déduit des tables à partir de fichiers de données ; il ne vérifie pas la compatibilité entre les versions et ne fournit pas les schémas aux producteurs et aux consommateurs."
    d:
      en: "Schema change policies control how a crawler updates Data Catalog tables; they do not validate the records that producers write to Kafka topics."
      fr: "Les politiques de modification de schéma contrôlent la façon dont un robot d'analyse met à jour les tables du Data Catalog ; elles ne valident pas les enregistrements que les producteurs écrivent dans les rubriques Kafka."
references:
  - title: AWS Glue Schema registry
    url: https://docs.aws.amazon.com/glue/latest/dg/schema-registry.html
