id: deac01-2a-transfer-sftp-connector-pull
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company must copy files every night from a carrier's SFTP server into Amazon S3 for processing. The carrier owns the server, only allows its customers to download files from it, and accepts connections only from IP addresses on its allowlist. The company does not want to run servers or maintain SFTP client code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique doit copier chaque nuit des fichiers depuis le serveur SFTP d'un transporteur vers Amazon S3 pour les traiter. Le transporteur possède le serveur, permet seulement à ses clients d'y télécharger des fichiers et n'accepte que les connexions provenant d'adresses IP de sa liste d'autorisation. L'entreprise ne veut ni exécuter de serveurs ni maintenir de code client SFTP.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Transfer Family SFTP server and ask the carrier to upload the files to it every night.", fr: "Créer un serveur SFTP Transfer Family et demander au transporteur d'y charger les fichiers chaque nuit." } }
    - { id: b, text: { en: "Run a cron job on an EC2 instance with an Elastic IP address that downloads with sftp and copies to S3.", fr: "Exécuter une tâche cron sur une instance EC2 dotée d'une adresse IP Elastic qui télécharge par sftp et copie dans S3." } }
    - { id: c, text: { en: "Schedule a Lambda function that uses an SFTP library to download the files through a NAT gateway.", fr: "Planifier une fonction Lambda qui utilise une bibliothèque SFTP pour télécharger les fichiers via une passerelle NAT." } }
    - { id: d, text: { en: "Create a Transfer Family SFTP connector, allowlist its static IP addresses and start a nightly file retrieval to S3.", fr: "Créer un connecteur SFTP Transfer Family, faire autoriser ses adresses IP statiques et lancer chaque nuit une récupération de fichiers vers S3." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An SFTP connector connects to a partner-owned SFTP server and retrieves files into Amazon S3 (or sends files from S3) without any server to manage. Its credentials are stored in AWS Secrets Manager, and with service-managed egress Transfer Family provides static IP addresses that the carrier can allowlist. A schedule then starts the nightly StartFileTransfer retrieval."
    fr: "Un connecteur SFTP se connecte au serveur SFTP d'un partenaire et récupère des fichiers dans Amazon S3 (ou y envoie des fichiers depuis S3) sans serveur à gérer. Ses informations d'identification sont stockées dans AWS Secrets Manager et, avec la sortie gérée par le service, Transfer Family fournit des adresses IP statiques que le transporteur peut autoriser. Une planification lance ensuite chaque nuit la récupération StartFileTransfer."
  options:
    a:
      en: "The carrier only lets customers download from its own server and will not push files to a server that the company hosts."
      fr: "Le transporteur permet seulement aux clients de télécharger depuis son propre serveur et n'enverra pas de fichiers vers un serveur hébergé par l'entreprise."
    b:
      en: "This works but adds an EC2 instance and a script to run, patch and maintain."
      fr: "Cela fonctionne, mais ajoute une instance EC2 et un script à exécuter, corriger et maintenir."
    c:
      en: "This avoids servers but is SFTP client code that the company would have to write and maintain."
      fr: "Cela évite les serveurs, mais c'est du code client SFTP que l'entreprise devrait écrire et maintenir."
references:
  - title: Creating SFTP connectors
    url: https://docs.aws.amazon.com/transfer/latest/userguide/configure-sftp-connector.html
  - title: AWS Transfer Family SFTP connectors
    url: https://docs.aws.amazon.com/transfer/latest/userguide/creating-connectors.html
