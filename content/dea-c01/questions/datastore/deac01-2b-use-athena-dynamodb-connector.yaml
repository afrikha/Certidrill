id: deac01-2b-use-athena-dynamodb-connector
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company keeps the current status of its shipments in an Amazon DynamoDB table. Historical shipment events are stored in Amazon S3 and cataloged in the AWS Glue Data Catalog. Analysts must join the live DynamoDB data with the historical events in Amazon Athena. Queries must return the current DynamoDB data, and the company does not want to build or schedule any export or replication pipeline.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique conserve l'état actuel de ses expéditions dans une table Amazon DynamoDB. Les événements historiques des expéditions sont stockés dans Amazon S3 et catalogués dans l'AWS Glue Data Catalog. Les analystes doivent joindre les données DynamoDB en temps réel aux événements historiques dans Amazon Athena. Les requêtes doivent renvoyer les données DynamoDB actuelles, et l'entreprise ne veut créer ni planifier aucun pipeline d'exportation ou de réplication.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy the Athena DynamoDB connector, register it as a data source named ddb, and join ddb tables with the Data Catalog tables in Athena.", fr: "Déployer le connecteur Athena DynamoDB, l'enregistrer comme source de données nommée ddb, et joindre les tables ddb aux tables du Data Catalog dans Athena." } }
    - { id: b, text: { en: "Schedule the DynamoDB export to S3 feature every hour, and define an Athena table over the exported files.", fr: "Planifier toutes les heures la fonctionnalité d'exportation DynamoDB vers S3, et définir une table Athena sur les fichiers exportés." } }
    - { id: c, text: { en: "Enable DynamoDB Streams, and use an AWS Lambda function to write each change to an S3 prefix that Athena queries.", fr: "Activer DynamoDB Streams, et utiliser une fonction AWS Lambda pour écrire chaque modification dans un préfixe S3 interrogé par Athena." } }
    - { id: d, text: { en: "Create an Amazon Redshift external schema FROM DYNAMODB, and run the joins from Redshift Spectrum instead of Athena.", fr: "Créer un schéma externe Amazon Redshift FROM DYNAMODB, et exécuter les jointures depuis Redshift Spectrum au lieu d'Athena." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Athena Federated Query uses data source connectors that run as Lambda functions in the account. The DynamoDB connector reads the table at query time, so analysts join current data with Data Catalog tables without any export pipeline; the connector only needs an S3 spill bucket for results that exceed Lambda limits."
    fr: "Athena Federated Query utilise des connecteurs de sources de données qui s'exécutent comme fonctions Lambda dans le compte. Le connecteur DynamoDB lit la table au moment de la requête : les analystes joignent les données actuelles aux tables du Data Catalog sans pipeline d'exportation ; le connecteur n'a besoin que d'un compartiment de débordement S3 pour les résultats qui dépassent les limites de Lambda."
  options:
    b:
      en: "A scheduled export is the pipeline the company wants to avoid, and the exported data can be up to an hour old."
      fr: "Une exportation planifiée est le pipeline que l'entreprise veut éviter, et les données exportées peuvent avoir jusqu'à une heure de retard."
    c:
      en: "Writing the stream records to S3 is a replication pipeline to build and operate, which the company does not want."
      fr: "Écrire les enregistrements du flux dans S3 constitue un pipeline de réplication à construire et à exploiter, ce que l'entreprise ne veut pas."
    d:
      en: "Redshift external schemas do not support FROM DYNAMODB, and the analysts must use Athena."
      fr: "Les schémas externes Redshift ne prennent pas en charge FROM DYNAMODB, et les analystes doivent utiliser Athena."
references:
  - title: Amazon Athena DynamoDB connector
    url: https://docs.aws.amazon.com/athena/latest/ug/connectors-dynamodb.html
