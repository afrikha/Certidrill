id: deac01-2c-res-delete-marker-repl
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company replicates an analytics bucket to a disaster recovery bucket with S3 Cross-Region Replication. The replication configuration has one rule with a prefix filter and default settings. When ETL jobs delete objects in the source without specifying a version ID, the objects must also disappear from the current view of the destination. If someone permanently deletes specific object versions in the source, the copies in the destination must be preserved.

    Which solution will meet these requirements?
  fr: |
    Une entreprise réplique un compartiment d'analyse vers un compartiment de reprise après sinistre avec S3 Cross-Region Replication. La configuration de réplication comporte une règle avec un filtre de préfixe et les paramètres par défaut. Quand des tâches ETL suppriment des objets dans la source sans indiquer d'ID de version, les objets doivent aussi disparaître de la vue actuelle de la destination. Si quelqu'un supprime définitivement des versions d'objet précises dans la source, les copies de la destination doivent être préservées.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Replace the prefix filter with a tag-based filter, and enable delete marker replication on the new rule.", fr: "Remplacer le filtre de préfixe par un filtre de balises, et activer la réplication des marqueurs de suppression sur la nouvelle règle." }
    - id: b
      text: { en: "Enable delete marker replication on the existing rule; deletes that specify a version ID are not replicated.", fr: "Activer la réplication des marqueurs de suppression sur la règle existante ; les suppressions qui indiquent un ID de version ne sont pas répliquées." }
    - id: c
      text: { en: "Enable S3 Replication Time Control on the rule so that deletes reach the destination within 15 minutes.", fr: "Activer S3 Replication Time Control sur la règle afin que les suppressions atteignent la destination en 15 minutes." }
    - id: d
      text: { en: "Keep the rule unchanged, because rules with a Filter element replicate delete markers by default.", fr: "Conserver la règle telle quelle, car les règles avec un élément Filter répliquent les marqueurs de suppression par défaut." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Rules with a Filter element do not replicate delete markers by default, but delete marker replication can be enabled on rules that are not tag-based, so simple deletes also hide the objects in the destination. A DELETE with a version ID is never replicated, which protects the destination copies from permanent deletes in the source.
    fr: |
      Les règles avec un élément Filter ne répliquent pas les marqueurs de suppression par défaut, mais la réplication des marqueurs de suppression peut être activée sur les règles qui ne sont pas basées sur des balises : les suppressions simples masquent alors aussi les objets dans la destination. Une requête DELETE avec ID de version n'est jamais répliquée, ce qui protège les copies de la destination contre les suppressions définitives dans la source.
  options:
    a: { en: "Delete marker replication is not supported on tag-based rules.", fr: "La réplication des marqueurs de suppression n'est pas prise en charge sur les règles basées sur des balises." }
    c: { en: "Replication Time Control sets a replication time target; it does not decide which deletes are replicated.", fr: "Replication Time Control fixe un objectif de délai de réplication ; il ne décide pas quelles suppressions sont répliquées." }
    d: { en: "Rules with a Filter element do not replicate delete markers unless delete marker replication is enabled.", fr: "Les règles avec un élément Filter ne répliquent pas les marqueurs de suppression tant que la réplication des marqueurs de suppression n'est pas activée." }
references:
  - title: What does Amazon S3 replicate?
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-what-is-isnot-replicated.html
