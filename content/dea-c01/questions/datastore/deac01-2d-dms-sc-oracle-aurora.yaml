id: deac01-2d-dms-sc-oracle-aurora
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company is migrating an on-premises Oracle database to Amazon Aurora PostgreSQL-Compatible Edition. The on-premises network is connected to a VPC through AWS Site-to-Site VPN. The company must convert the tables, views, stored procedures and functions to PostgreSQL. The team does not want to install or maintain any conversion software.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance migre une base de données Oracle sur site vers Amazon Aurora PostgreSQL-Compatible Edition. Le réseau sur site est connecté à un VPC par AWS Site-to-Site VPN. L'entreprise doit convertir les tables, vues, procédures stockées et fonctions en PostgreSQL. L'équipe ne veut installer ni maintenir aucun logiciel de conversion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS DMS Schema Conversion migration project with data providers for Oracle and Aurora PostgreSQL, convert the schema and apply it.", fr: "Créer un projet de migration AWS DMS Schema Conversion avec des fournisseurs de données pour Oracle et Aurora PostgreSQL, convertir le schéma et l'appliquer." } }
    - { id: b, text: { en: "Install the AWS Schema Conversion Tool on an Amazon EC2 instance in the VPC, convert the schema and apply it.", fr: "Installer AWS Schema Conversion Tool sur une instance Amazon EC2 du VPC, convertir le schéma et l'appliquer." } }
    - { id: c, text: { en: "Run an AWS DMS full-load task with the target table preparation mode set to DROP_AND_CREATE.", fr: "Exécuter une tâche de chargement complet AWS DMS avec le mode de préparation des tables cibles défini sur DROP_AND_CREATE." } }
    - { id: d, text: { en: "Catalog the Oracle schema with an AWS Glue crawler, and create the Aurora tables from the catalog with an AWS Glue job.", fr: "Cataloguer le schéma Oracle avec un robot d'analyse (crawler) AWS Glue, puis créer les tables Aurora à partir du catalogue avec une tâche AWS Glue." } }
answer: { optionId: a }
explanation:
  correct:
    en: "DMS Schema Conversion is a fully managed, web-based feature of AWS DMS that converts source schemas and code objects such as views, procedures and functions for an Aurora, Amazon RDS or Amazon Redshift target. A migration project combines the source and target data providers, an instance profile and the credentials, and Oracle to Aurora PostgreSQL is a supported pair."
    fr: "DMS Schema Conversion est une fonctionnalité entièrement gérée et web d'AWS DMS qui convertit les schémas source et les objets de code comme les vues, procédures et fonctions pour une cible Aurora, Amazon RDS ou Amazon Redshift. Un projet de migration combine les fournisseurs de données source et cible, un profil d'instance et les informations d'identification, et Oracle vers Aurora PostgreSQL est une paire prise en charge."
  options:
    b:
      en: "AWS SCT can convert this schema, but it is software that the team must install and maintain, which the scenario rules out."
      fr: "AWS SCT peut convertir ce schéma, mais c'est un logiciel que l'équipe doit installer et maintenir, ce que le scénario exclut."
    c:
      en: "A DMS task creates only basic objects such as tables and primary keys; it does not convert views, stored procedures or functions."
      fr: "Une tâche DMS ne crée que des objets de base comme les tables et les clés primaires ; elle ne convertit ni les vues, ni les procédures stockées, ni les fonctions."
    d:
      en: "A crawler records table metadata only, and a Glue job does not translate Oracle code objects into PostgreSQL."
      fr: "Un crawler n'enregistre que les métadonnées des tables, et une tâche Glue ne traduit pas les objets de code Oracle en PostgreSQL."
references:
  - title: Converting database schemas using DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html
