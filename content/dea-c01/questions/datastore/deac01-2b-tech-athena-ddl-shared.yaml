id: deac01-2b-tech-athena-ddl-shared
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Data engineers at AnyCompany define tables over Amazon S3 data by running the following statement in Amazon Athena. AWS Glue ETL jobs and Amazon Redshift Spectrum must use the same table definitions.

    ```sql
    CREATE EXTERNAL TABLE sales.orders (
      order_id string,
      amount decimal(10,2)
    )
    PARTITIONED BY (dt string)
    STORED AS PARQUET
    LOCATION 's3://example-sales/orders/';
    ```

    What should the data engineers do to make the definitions available to the other services with the LEAST effort?
  fr: |
    Les ingénieurs de données d'AnyCompany définissent des tables sur des données Amazon S3 en exécutant l'instruction suivante dans Amazon Athena. Les tâches ETL AWS Glue et Amazon Redshift Spectrum doivent utiliser les mêmes définitions de tables.

    ```sql
    CREATE EXTERNAL TABLE sales.orders (
      order_id string,
      amount decimal(10,2)
    )
    PARTITIONED BY (dt string)
    STORED AS PARQUET
    LOCATION 's3://example-sales/orders/';
    ```

    Que doivent faire les ingénieurs de données pour rendre les définitions disponibles pour les autres services avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Reference the sales database of the AWS Glue Data Catalog, where Athena registered the table, from the Glue jobs and a Spectrum external schema.", fr: "Référencer la base de données sales de l'AWS Glue Data Catalog, où Athena a enregistré la table, depuis les tâches Glue et un schéma externe Spectrum." } }
    - { id: b, text: { en: "Run an AWS Glue crawler on the S3 location so that the table is copied from the Athena catalog to the Glue Data Catalog.", fr: "Exécuter un robot d'analyse AWS Glue sur l'emplacement S3 afin que la table soit copiée du catalogue Athena vers le Glue Data Catalog." } }
    - { id: c, text: { en: "Export the DDL statement to Amazon S3, and run it again in an Apache Hive metastore that the Glue jobs and Redshift use.", fr: "Exporter l'instruction DDL vers Amazon S3, puis l'exécuter à nouveau dans un metastore Apache Hive utilisé par les tâches Glue et Redshift." } }
    - { id: d, text: { en: "Run the same CREATE EXTERNAL TABLE statement in Redshift and in each Glue job script so that each service has its own definition.", fr: "Exécuter la même instruction CREATE EXTERNAL TABLE dans Redshift et dans le script de chaque tâche Glue afin que chaque service ait sa propre définition." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Athena stores and reads its table metadata in the AWS Glue Data Catalog, which other AWS services share across the account. Glue jobs read the table with from_catalog, and Redshift Spectrum maps an external schema to the sales database."
    fr: "Athena stocke et lit les métadonnées de ses tables dans l'AWS Glue Data Catalog, que les autres services AWS partagent dans tout le compte. Les tâches Glue lisent la table avec from_catalog, et Redshift Spectrum associe un schéma externe à la base de données sales."
  options:
    b:
      en: "There is no separate Athena catalog to copy from: the table is already in the Glue Data Catalog, and a crawler would only add work."
      fr: "Il n'existe pas de catalogue Athena distinct à copier : la table se trouve déjà dans le Glue Data Catalog, et un robot d'analyse ne ferait qu'ajouter du travail."
    c:
      en: "A separate Hive metastore duplicates the definitions and must be operated, while the Data Catalog already serves all three services."
      fr: "Un metastore Hive distinct duplique les définitions et doit être exploité, alors que le Data Catalog dessert déjà les trois services."
    d:
      en: "Separate definitions drift apart over time; the requirement is to use the same table definitions."
      fr: "Des définitions séparées divergent avec le temps ; l'exigence est d'utiliser les mêmes définitions de tables."
references:
  - title: Understanding tables, databases, and data catalogs in Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/understanding-tables-databases-and-the-data-catalog.html
