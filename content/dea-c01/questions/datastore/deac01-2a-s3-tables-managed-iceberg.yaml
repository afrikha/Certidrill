id: deac01-2a-s3-tables-managed-iceberg
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company is building a new analytics platform that stores high-volume transaction records as Apache Iceberg tables queried by Amazon Athena, Amazon Redshift and Apache Spark on Amazon EMR. The platform team wants AWS to run compaction, snapshot management and unreferenced file removal continuously. It also wants higher transactions per second than self-managed Iceberg tables in general purpose S3 buckets.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de paiement crée une nouvelle plateforme d'analyse qui stocke de gros volumes d'enregistrements de transactions sous forme de tables Apache Iceberg interrogées par Amazon Athena, Amazon Redshift et Apache Spark sur Amazon EMR. L'équipe de la plateforme veut qu'AWS exécute en continu le compactage, la gestion des instantanés et la suppression des fichiers non référencés. Elle veut aussi plus de transactions par seconde qu'avec des tables Iceberg autogérées dans des compartiments S3 à usage général.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Store the tables in a general purpose bucket and schedule Athena OPTIMIZE and VACUUM statements for each table.", fr: "Stocker les tables dans un compartiment à usage général et planifier des instructions Athena OPTIMIZE et VACUUM pour chaque table." } }
    - { id: b, text: { en: "Store the data as AWS Lake Formation governed tables and let Lake Formation compact the files.", fr: "Stocker les données sous forme de tables gouvernées (governed tables) AWS Lake Formation et laisser Lake Formation compacter les fichiers." } }
    - { id: c, text: { en: "Create the tables in an S3 table bucket and integrate the table bucket with the AWS Glue Data Catalog.", fr: "Créer les tables dans un compartiment de tables S3 et intégrer le compartiment de tables à l'AWS Glue Data Catalog." } }
    - { id: d, text: { en: "Load the records into local tables in Amazon Redshift managed storage and share them with the other engines.", fr: "Charger les enregistrements dans des tables locales du stockage géré Amazon Redshift et les partager avec les autres moteurs." } }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 Tables store Iceberg tables in table buckets, where S3 continuously runs compaction, snapshot management and unreferenced file removal. Table buckets deliver higher transactions per second than self-managed tables in general purpose buckets, and the Glue Data Catalog integration lets Athena, Redshift and EMR discover the tables."
    fr: "S3 Tables stocke des tables Iceberg dans des compartiments de tables, où S3 exécute en continu le compactage, la gestion des instantanés et la suppression des fichiers non référencés. Les compartiments de tables offrent plus de transactions par seconde que les tables autogérées des compartiments à usage général, et l'intégration à l'AWS Glue Data Catalog permet à Athena, Redshift et EMR de découvrir les tables."
  options:
    a:
      en: "This is the self-managed design: the team must schedule and monitor maintenance for every table, and it does not raise transactions per second."
      fr: "C'est la conception autogérée : l'équipe doit planifier et surveiller la maintenance de chaque table, et cela n'augmente pas les transactions par seconde."
    b:
      en: "Lake Formation governed tables have been shut down, so they cannot be used for a new platform."
      fr: "Les tables gouvernées Lake Formation ont été arrêtées : elles ne peuvent pas servir à une nouvelle plateforme."
    d:
      en: "Local Redshift tables are not Iceberg tables in S3, so Spark on EMR could not use them as Iceberg tables."
      fr: "Les tables locales Redshift ne sont pas des tables Iceberg dans S3 : Spark sur EMR ne pourrait pas les utiliser comme tables Iceberg."
references:
  - title: Working with Amazon S3 Tables and table buckets
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables.html
