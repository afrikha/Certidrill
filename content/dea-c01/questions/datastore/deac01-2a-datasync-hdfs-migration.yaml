id: deac01-2a-datasync-hdfs-migration
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is retiring its on-premises Apache Hadoop cluster. It must copy 400 TB from HDFS, which is secured with Kerberos, to Amazon S3 so that Amazon EMR and Amazon Athena can process the data, and then copy the daily changes until the cutover. The company has a 10 Gbps AWS Direct Connect connection and wants a managed transfer service.

    Which solution will meet these requirements?
  fr: |
    Une entreprise met hors service son cluster Apache Hadoop local. Elle doit copier 400 To depuis HDFS, sécurisé par Kerberos, vers Amazon S3 pour qu'Amazon EMR et Amazon Athena traitent les données, puis copier les modifications quotidiennes jusqu'à la bascule. L'entreprise dispose d'une connexion AWS Direct Connect de 10 Gbit/s et veut un service de transfert géré.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy an S3 File Gateway on premises and copy the files from HDFS to its NFS share with hadoop distcp.", fr: "Déployer une S3 File Gateway sur site et copier les fichiers de HDFS vers son partage NFS avec hadoop distcp." } }
    - { id: b, text: { en: "Create an AWS DMS task with an HDFS source endpoint, an S3 target endpoint and ongoing replication.", fr: "Créer une tâche AWS DMS avec un point de terminaison source HDFS et un point de terminaison cible S3 avec réplication continue." } }
    - { id: c, text: { en: "Create a Transfer Family SFTP server and push the HDFS files to it from an edge node with an SFTP client.", fr: "Créer un serveur SFTP Transfer Family et y pousser les fichiers HDFS depuis un nœud périphérique avec un client SFTP." } }
    - { id: d, text: { en: "Deploy an AWS DataSync agent, create an HDFS location that uses Kerberos and schedule a task to S3.", fr: "Déployer un agent AWS DataSync, créer un emplacement HDFS qui utilise Kerberos et planifier une tâche vers S3." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS DataSync supports HDFS as a location through an agent deployed close to the cluster, which talks to the NameNodes and DataNodes as an HDFS client. The location supports simple or Kerberos authentication, and a scheduled task copies the data to S3 and then the daily changes until the cutover."
    fr: "AWS DataSync prend en charge HDFS comme emplacement grâce à un agent déployé près du cluster, qui communique avec les NameNodes et DataNodes en tant que client HDFS. L'emplacement prend en charge l'authentification simple ou Kerberos, et une tâche planifiée copie les données vers S3, puis les modifications quotidiennes jusqu'à la bascule."
  options:
    a:
      en: "This needs a gateway and copy jobs to run and monitor yourself, so it is not a managed transfer from HDFS."
      fr: "Cela exige une passerelle et des tâches de copie à exécuter et surveiller soi-même : ce n'est pas un transfert géré depuis HDFS."
    b:
      en: "AWS DMS migrates databases; HDFS is not a DMS source endpoint."
      fr: "AWS DMS migre des bases de données ; HDFS n'est pas un point de terminaison source DMS."
    c:
      en: "Transfer Family serves SFTP users; pushing 400 TB with a client is a manual process without managed scheduling or incremental copies."
      fr: "Transfer Family sert des utilisateurs SFTP ; pousser 400 To avec un client est un processus manuel, sans planification gérée ni copies incrémentielles."
references:
  - title: Configuring AWS DataSync transfers with an HDFS cluster
    url: https://docs.aws.amazon.com/datasync/latest/userguide/create-hdfs-location.html
