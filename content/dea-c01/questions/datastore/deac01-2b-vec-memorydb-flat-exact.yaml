id: deac01-2b-vec-memorydb-flat-exact
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A fraud detection team stores 50,000 reference transaction embeddings in an Amazon MemoryDB cluster that has vector search enabled. For audit reasons, every similarity query must return the exact nearest neighbors, not an approximation. The index is small, so longer query run times are acceptable.

    Which vector index algorithm should the team use?
  fr: |
    Une équipe de détection des fraudes stocke 50 000 vectorisations de transactions de référence dans un cluster Amazon MemoryDB dont la recherche vectorielle est activée. Pour des raisons d'audit, chaque requête de similarité doit renvoyer les plus proches voisins exacts, et non une approximation. L'index est petit : des durées d'exécution de requête plus longues sont acceptables.

    Quel algorithme d'index vectoriel l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "FLAT", fr: "FLAT" } }
    - { id: b, text: { en: "HNSW with a high EF_RUNTIME value", fr: "HNSW avec une valeur EF_RUNTIME élevée" } }
    - { id: c, text: { en: "HNSW with high M and EF_CONSTRUCTION values", fr: "HNSW avec des valeurs M et EF_CONSTRUCTION élevées" } }
    - { id: d, text: { en: "HNSW with a high INITIAL_CAP value", fr: "HNSW avec une valeur INITIAL_CAP élevée" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The FLAT algorithm processes every vector of the index linearly, so it returns exact answers within the precision of the distance computations. Its run time grows with the index size, which is acceptable for a small index."
    fr: "L'algorithme FLAT traite linéairement chaque vecteur de l'index : il renvoie des réponses exactes dans les limites de précision des calculs de distance. Sa durée d'exécution croît avec la taille de l'index, ce qui est acceptable pour un petit index."
  options:
    b:
      en: "A higher EF_RUNTIME improves the recall ratio of HNSW, but HNSW still returns an approximation of the exact k-NN result."
      fr: "Une valeur EF_RUNTIME plus élevée améliore le taux de rappel d'HNSW, mais HNSW renvoie toujours une approximation du résultat k-NN exact."
    c:
      en: "M and EF_CONSTRUCTION improve the quality of the HNSW graph, but the search remains approximate."
      fr: "M et EF_CONSTRUCTION améliorent la qualité du graphe HNSW, mais la recherche reste approximative."
    d:
      en: "INITIAL_CAP only pre-allocates memory to speed up ingestion; it does not change the accuracy of the search."
      fr: "INITIAL_CAP ne fait que préallouer de la mémoire pour accélérer l'ingestion ; il ne change pas la précision de la recherche."
references:
  - title: Vector search overview
    url: https://docs.aws.amazon.com/memorydb/latest/devguide/vector-search-overview.html
