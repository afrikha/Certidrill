id: deac01-2c-ver-suspend-behavior
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data pipeline overwrites the same object keys many times a day in a versioning-enabled Amazon S3 staging bucket, and storage costs keep rising. The team decides to suspend versioning on the bucket and does not add any S3 Lifecycle rule.

    Which statement describes the bucket after versioning is suspended?
  fr: |
    Un pipeline de données écrase plusieurs fois par jour les mêmes clés d'objet dans un compartiment Amazon S3 de préparation avec gestion des versions activée, et les coûts de stockage ne cessent d'augmenter. L'équipe décide de suspendre la gestion des versions sur le compartiment et n'ajoute aucune règle S3 Lifecycle.

    Quelle affirmation décrit le compartiment une fois la gestion des versions suspendue ?
body:
  options:
    - id: a
      text: { en: "The bucket returns to the unversioned state, and S3 deletes all the existing noncurrent versions of objects.", fr: "Le compartiment revient à l'état sans gestion des versions, et S3 supprime toutes les versions non actuelles existantes des objets." }
    - id: b
      text: { en: "Existing versions stay and are billed, and new writes get a null version ID that replaces any existing null version.", fr: "Les versions existantes restent et sont facturées, et les nouvelles écritures reçoivent un ID de version null qui remplace toute version null existante." }
    - id: c
      text: { en: "Existing noncurrent versions are moved to S3 Glacier Flexible Retrieval, and new writes create no new versions.", fr: "Les versions non actuelles existantes passent à S3 Glacier Flexible Retrieval, et les nouvelles écritures ne créent pas de nouvelles versions." }
    - id: d
      text: { en: "New writes keep creating new versions until an S3 Lifecycle rule for noncurrent versions is added to the bucket.", fr: "Les nouvelles écritures continuent de créer de nouvelles versions jusqu'à ce qu'une règle S3 Lifecycle pour les versions non actuelles soit ajoutée au compartiment." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Suspending versioning stops new versions from accruing but does not change the objects already stored, so existing versions remain and are billed until they are deleted. While versioning is suspended, a write uses the null version ID and replaces the existing null version, if any.
    fr: |
      Suspendre la gestion des versions arrête l'accumulation de nouvelles versions, mais ne modifie pas les objets déjà stockés : les versions existantes restent et sont facturées jusqu'à leur suppression. Tant que la gestion des versions est suspendue, une écriture utilise l'ID de version null et remplace la version null existante, s'il y en a une.
  options:
    a: { en: "A bucket that has been versioning-enabled can never return to the unversioned state, and suspending deletes no version.", fr: "Un compartiment dont la gestion des versions a été activée ne peut jamais revenir à l'état sans gestion des versions, et la suspension ne supprime aucune version." }
    c: { en: "Suspension changes no storage class; only an S3 Lifecycle rule can transition noncurrent versions.", fr: "La suspension ne change aucune classe de stockage ; seule une règle S3 Lifecycle peut faire passer des versions non actuelles." }
    d: { en: "Suspension takes effect for new writes at once; lifecycle rules manage existing versions, not the versioning state.", fr: "La suspension prend effet immédiatement pour les nouvelles écritures ; les règles de cycle de vie gèrent les versions existantes, pas l'état de la gestion des versions." }
references:
  - title: Retaining multiple versions of objects with S3 Versioning
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
