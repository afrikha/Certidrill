id: deac01-2b-vec-ivf-pq-domain
objective: "2.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany plans to index 1 billion 128-dimension image embeddings for a similarity search feature. A prototype that uses an Amazon OpenSearch Serverless vector search collection with an HNSW index needs far more memory than the budget allows. The product team accepts lower recall and higher latency in exchange for a much smaller memory footprint, and the data engineers are willing to train the index on a sample of the vectors.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany prévoit d'indexer 1 milliard de vectorisations d'images de 128 dimensions pour une fonctionnalité de recherche de similarité. Un prototype qui utilise une collection de recherche vectorielle Amazon OpenSearch Serverless avec un index HNSW nécessite beaucoup plus de mémoire que le budget ne le permet. L'équipe produit accepte un rappel plus faible et une latence plus élevée en échange d'une empreinte mémoire bien plus réduite, et les ingénieurs de données sont prêts à entraîner l'index sur un échantillon des vecteurs.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Keep the serverless vector search collection, and change the index mapping to the IVF method with product quantization after training it with the training API.", fr: "Conserver la collection de recherche vectorielle sans serveur, et passer le mappage de l'index à la méthode IVF avec quantification de produit après l'avoir entraînée avec l'API d'entraînement." } }
    - { id: b, text: { en: "Keep the serverless vector search collection, and raise the ef_search value of the HNSW index so that fewer graph nodes are kept in memory.", fr: "Conserver la collection de recherche vectorielle sans serveur, et augmenter la valeur ef_search de l'index HNSW afin de garder moins de nœuds du graphe en mémoire." } }
    - { id: c, text: { en: "Move to an OpenSearch Service domain, and create a Faiss HNSW index with a higher m value so that each vector stores more graph edges.", fr: "Passer à un domaine OpenSearch Service, et créer un index HNSW Faiss avec une valeur m plus élevée afin que chaque vecteur stocke davantage d'arêtes du graphe." } }
    - { id: d, text: { en: "Move to an OpenSearch Service domain, train a Faiss IVF model with product quantization on a sample of vectors, and create the index from that model.", fr: "Passer à un domaine OpenSearch Service, entraîner un modèle IVF Faiss avec quantification de produit sur un échantillon de vecteurs, et créer l'index à partir de ce modèle." } }
answer: { optionId: d }
explanation:
  correct:
    en: "IVF does not store a set of graph edges for each vector, and product quantization compresses the vectors further, so IVF with PQ uses far less memory than HNSW at the cost of recall and latency. IVF and PQ need a training step, and the k-NN plugin of an OpenSearch Service domain supports training a model and building the index from it."
    fr: "IVF ne stocke pas d'ensemble d'arêtes de graphe pour chaque vecteur, et la quantification de produit compresse encore les vecteurs : IVF avec PQ utilise beaucoup moins de mémoire qu'HNSW, au prix du rappel et de la latence. IVF et PQ nécessitent une étape d'entraînement, et le plugin k-NN d'un domaine OpenSearch Service permet d'entraîner un modèle et de construire l'index à partir de celui-ci."
  options:
    a:
      en: "Vector search collections support only the HNSW algorithm with Faiss; they support neither IVF nor the model training API operations."
      fr: "Les collections de recherche vectorielle ne prennent en charge que l'algorithme HNSW avec Faiss ; elles ne prennent en charge ni IVF ni les opérations de l'API d'entraînement de modèles."
    b:
      en: "ef_search is a query-time parameter that trades latency for recall; it does not reduce the memory that the HNSW graph needs."
      fr: "ef_search est un paramètre de requête qui échange de la latence contre du rappel ; il ne réduit pas la mémoire nécessaire au graphe HNSW."
    c:
      en: "A higher m adds edges per vector, which increases the memory footprint instead of reducing it."
      fr: "Une valeur m plus élevée ajoute des arêtes par vecteur, ce qui augmente l'empreinte mémoire au lieu de la réduire."
references:
  - title: Working with vector search collections
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vector-search.html
  - title: k-Nearest Neighbor (k-NN) search in Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html
