id: deac01-2d-kb-metadata-filter
objective: "2.4.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company stores policy documents from several departments in one Amazon S3 bucket and indexes them in one Amazon Bedrock knowledge base. The department that owns each file is known. When an employee asks a question, the application must retrieve only chunks from documents of that employee's department.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise stocke les documents de politique interne de plusieurs services dans un seul compartiment Amazon S3 et les indexe dans une seule base de connaissances Amazon Bedrock. Le service propriétaire de chaque fichier est connu. Lorsqu'un employé pose une question, l'application doit récupérer uniquement des segments de documents du service de cet employé.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a .metadata.json file next to each document with a department attribute, and sync the data source.", fr: "Ajouter à côté de chaque document un fichier .metadata.json avec un attribut department, puis synchroniser la source de données." } }
    - { id: b, text: { en: "Increase numberOfResults in the retrieval configuration so that more chunks from each department are returned.", fr: "Augmenter numberOfResults dans la configuration de récupération afin que davantage de segments de chaque service soient renvoyés." } }
    - { id: c, text: { en: "Switch the data source to hierarchical chunking so that chunks keep their department context.", fr: "Passer la source de données au découpage hiérarchique afin que les segments conservent le contexte de leur service." } }
    - { id: d, text: { en: "Pass a filter that uses equals on the department key in the vector search configuration of each Retrieve request.", fr: "Passer un filtre qui utilise equals sur la clé department dans la configuration de recherche vectorielle de chaque requête Retrieve." } }
    - { id: e, text: { en: "Put the list of department names in the knowledge base description so that the model restricts its answers.", fr: "Mettre la liste des noms de services dans la description de la base de connaissances afin que le modèle restreigne ses réponses." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "For an S3 data source, metadata is supplied in a file named after the document with .metadata.json appended, stored in the same folder and up to 10 KB, and it is indexed at the next sync. At query time, a metadata filter such as equals on the department key in vectorSearchConfiguration limits retrieval to the matching chunks."
    fr: "Pour une source de données S3, les métadonnées sont fournies dans un fichier portant le nom du document suivi de .metadata.json, stocké dans le même dossier et de 10 Ko au maximum, et elles sont indexées à la synchronisation suivante. Au moment de la requête, un filtre de métadonnées comme equals sur la clé department dans vectorSearchConfiguration limite la récupération aux segments correspondants."
  options:
    b:
      en: "Returning more results does not exclude chunks from other departments."
      fr: "Renvoyer plus de résultats n'exclut pas les segments des autres services."
    c:
      en: "Chunking changes how documents are split; it does not restrict which documents a query may retrieve."
      fr: "Le découpage change la façon dont les documents sont divisés ; il ne restreint pas les documents qu'une requête peut récupérer."
    e:
      en: "The knowledge base description is not used to filter retrieval results."
      fr: "La description de la base de connaissances ne sert pas à filtrer les résultats de récupération."
references:
  - title: Connect to Amazon S3 for your knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/s3-data-source-connector.html
  - title: Configure and customize queries and response generation
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
