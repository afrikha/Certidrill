id: deac01-2b-conn-custom-jdbc-driver
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue ETL job must read tables from a MySQL database that runs on Amazon EC2 in a private subnet. The database vendor supports only a specific MySQL Connector/J driver version, which is not the driver that AWS Glue provides by default. The data engineer has downloaded the driver .jar file. The job must keep using an AWS Glue connection.

    Which solution will meet these requirements?
  fr: |
    Une tâche ETL AWS Glue doit lire des tables d'une base de données MySQL qui s'exécute sur Amazon EC2 dans un sous-réseau privé. L'éditeur de la base de données ne prend en charge qu'une version précise du pilote MySQL Connector/J, qui n'est pas le pilote fourni par défaut par AWS Glue. L'ingénieur de données a téléchargé le fichier .jar du pilote. La tâche doit continuer à utiliser une connexion AWS Glue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Network connection in the subnet, and let the job download the driver from the vendor's website at run time.", fr: "Créer une connexion Network dans le sous-réseau, et laisser la tâche télécharger le pilote sur le site web de l'éditeur à l'exécution." } }
    - { id: b, text: { en: "Upload the .jar file to Amazon S3, and set the JDBC driver S3 path and the class name com.mysql.cj.jdbc.Driver in the JDBC connection.", fr: "Charger le fichier .jar dans Amazon S3, et définir le chemin S3 du pilote JDBC et le nom de classe com.mysql.cj.jdbc.Driver dans la connexion JDBC." } }
    - { id: c, text: { en: "Add the driver to the job with the --additional-python-modules parameter, and keep the default JDBC connection settings.", fr: "Ajouter le pilote à la tâche avec le paramètre --additional-python-modules, et conserver les paramètres par défaut de la connexion JDBC." } }
    - { id: d, text: { en: "Deploy the Athena MySQL data source connector with the driver, and have the Glue job query the database through Athena.", fr: "Déployer le connecteur de source de données Athena pour MySQL avec le pilote, et faire interroger la base de données par la tâche Glue au moyen d'Athena." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A JDBC connection accepts an optional JDBC driver S3 path, the absolute S3 path of the driver .jar file, and a driver class name such as com.mysql.cj.jdbc.Driver for MySQL. The job then connects through the same connection with the driver that the vendor supports."
    fr: "Une connexion JDBC accepte un chemin S3 facultatif du pilote JDBC, le chemin S3 absolu du fichier .jar du pilote, et un nom de classe de pilote tel que com.mysql.cj.jdbc.Driver pour MySQL. La tâche se connecte alors au moyen de la même connexion avec le pilote pris en charge par l'éditeur."
  options:
    a:
      en: "A Network connection provides only VPC access and no JDBC driver, and the private subnet may have no internet access to download one."
      fr: "Une connexion Network ne fournit qu'un accès au VPC et aucun pilote JDBC, et le sous-réseau privé peut ne pas avoir d'accès Internet pour en télécharger un."
    c:
      en: "--additional-python-modules installs Python packages with pip; it does not make a Java JDBC driver available to the connection."
      fr: "--additional-python-modules installe des packages Python avec pip ; il ne rend pas un pilote JDBC Java disponible pour la connexion."
    d:
      en: "Routing the job through an Athena connector adds a service and a Lambda function, and the job would no longer read through an AWS Glue connection."
      fr: "Faire passer la tâche par un connecteur Athena ajoute un service et une fonction Lambda, et la tâche ne lirait plus au moyen d'une connexion AWS Glue."
references:
  - title: AWS Glue connection properties
    url: https://docs.aws.amazon.com/glue/latest/dg/connection-properties.html
