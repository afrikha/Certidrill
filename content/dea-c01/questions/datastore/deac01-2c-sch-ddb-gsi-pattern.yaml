id: deac01-2c-sch-ddb-gsi-pattern
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An existing Amazon DynamoDB table named Orders has order_id as its partition key and holds millions of items. A new feature must retrieve all orders of one customer within a date range, sorted by order date, by using the customer_id and order_date attributes. The table must stay online, and the queries must be efficient.

    Which solution will meet these requirements?
  fr: |
    Une table Amazon DynamoDB existante nommée Orders a order_id comme clé de partition et contient des millions d'éléments. Une nouvelle fonctionnalité doit récupérer toutes les commandes d'un client sur une plage de dates, triées par date de commande, à l'aide des attributs customer_id et order_date. La table doit rester en ligne et les requêtes doivent être efficaces.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a local secondary index to the table with customer_id as its key and order_date as its sort key.", fr: "Ajouter à la table un index secondaire local avec customer_id comme clé et order_date comme clé de tri." }
    - id: b
      text: { en: "Run a Scan with a filter expression on customer_id and order_date, and sort the results in the application.", fr: "Exécuter un Scan avec une expression de filtre sur customer_id et order_date, et trier les résultats dans l'application." }
    - id: c
      text: { en: "Change the partition key of the table to customer_id and add order_date as the sort key of the table.", fr: "Changer la clé de partition de la table en customer_id et ajouter order_date comme clé de tri de la table." }
    - id: d
      text: { en: "Add a global secondary index with customer_id as its partition key and order_date as its sort key.", fr: "Ajouter un index secondaire global avec customer_id comme clé de partition et order_date comme clé de tri." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A global secondary index can have a different partition key from the base table and can be added to an existing table. A Query on customer_id with a range condition on order_date then returns the orders sorted by date without reading the rest of the table.
    fr: |
      Un index secondaire global peut avoir une clé de partition différente de celle de la table de base et peut être ajouté à une table existante. Une requête Query sur customer_id avec une condition de plage sur order_date renvoie alors les commandes triées par date sans lire le reste de la table.
  options:
    a: { en: "A local secondary index keeps the table's partition key and can be created only when the table is created.", fr: "Un index secondaire local conserve la clé de partition de la table et ne peut être créé qu'à la création de la table." }
    b: { en: "A Scan reads every item of the table before filtering, which is slow and consumes read capacity for millions of items.", fr: "Un Scan lit chaque élément de la table avant de filtrer, ce qui est lent et consomme de la capacité de lecture pour des millions d'éléments." }
    c: { en: "The key schema of an existing table cannot be changed; a new table and a full data migration would be needed.", fr: "Le schéma de clé d'une table existante ne peut pas être modifié ; il faudrait une nouvelle table et une migration complète des données." }
references:
  - title: Using Global Secondary Indexes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
  - title: Local secondary indexes
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/LSI.html
