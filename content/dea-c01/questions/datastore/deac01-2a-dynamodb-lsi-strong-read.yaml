id: deac01-2a-dynamodb-lsi-strong-read
objective: "2.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A data engineer is designing a new Amazon DynamoDB table for sensor readings. The application must get all readings of one device ordered by reading time. It must also get the readings of one device ordered by temperature, and these reads must be strongly consistent. The readings of a single device will always stay under 1 GB.

    Which combination of design choices will meet these requirements? (Choose two.)
  fr: |
    Un ingénieur data conçoit une nouvelle table Amazon DynamoDB pour des relevés de capteurs. L'application doit obtenir tous les relevés d'un appareil triés par heure de relevé. Elle doit aussi obtenir les relevés d'un appareil triés par température, et ces lectures doivent être fortement cohérentes. Les relevés d'un même appareil resteront toujours inférieurs à 1 Go.

    Quelle combinaison de choix de conception répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Use device_id as the partition key and reading_time as the sort key of the table.", fr: "Utiliser device_id comme clé de partition et reading_time comme clé de tri de la table." } }
    - { id: b, text: { en: "Use reading_time as the partition key and device_id as the sort key of the table.", fr: "Utiliser reading_time comme clé de partition et device_id comme clé de tri de la table." } }
    - { id: c, text: { en: "After the table is created, add a global secondary index on device_id and temperature.", fr: "Après la création de la table, ajouter un index secondaire global sur device_id et temperature." } }
    - { id: d, text: { en: "In the CreateTable request, define a local secondary index with temperature as its sort key.", fr: "Dans la requête CreateTable, définir un index secondaire local avec temperature comme clé de tri." } }
    - { id: e, text: { en: "Enable DynamoDB Streams and keep a copy sorted by temperature in a second table with Lambda.", fr: "Activer DynamoDB Streams et tenir une copie triée par température dans une seconde table avec Lambda." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A table keyed on device_id and reading_time returns a device's readings in time order with Query. A local secondary index keeps the same partition key with temperature as an alternate sort key and supports strongly consistent reads; it must be defined when the table is created. The 10 GB item collection limit of LSIs is not a problem at under 1 GB per device."
    fr: "Une table dont les clés sont device_id et reading_time renvoie les relevés d'un appareil par ordre chronologique avec Query. Un index secondaire local garde la même clé de partition avec temperature comme clé de tri alternative et prend en charge les lectures fortement cohérentes ; il doit être défini à la création de la table. La limite de 10 Go par collection d'éléments des LSI ne pose pas de problème avec moins de 1 Go par appareil."
  options:
    b:
      en: "With reading_time as the partition key, the readings of one device are spread across many partition key values and cannot be queried together in order."
      fr: "Avec reading_time comme clé de partition, les relevés d'un appareil sont répartis sur de nombreuses valeurs de clé de partition et ne peuvent pas être interrogés ensemble dans l'ordre."
    c:
      en: "A global secondary index supports only eventually consistent reads, so it fails the strong consistency requirement."
      fr: "Un index secondaire global ne prend en charge que les lectures à cohérence éventuelle : il ne respecte pas l'exigence de cohérence forte."
    e:
      en: "A copy written asynchronously by Lambda can lag behind the table, so its reads are not strongly consistent with the latest writes, and it adds code to maintain."
      fr: "Une copie écrite de façon asynchrone par Lambda peut être en retard sur la table : ses lectures ne sont pas fortement cohérentes avec les dernières écritures, et elle ajoute du code à maintenir."
references:
  - title: Local secondary indexes
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/LSI.html
  - title: Using Global Secondary Indexes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
