id: deac01-2d-bucketing-customer-id
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company stores order events in Amazon S3 as Parquet files in a table partitioned by event_date. The table contains tens of millions of distinct customer_id values. Most Amazon Athena queries look up the events of a single customer_id within a date range, and they still read every file in each selected partition.

    Which solution will reduce the data that these queries read?
  fr: |
    Une entreprise de commerce en ligne stocke des événements de commande dans Amazon S3 sous forme de fichiers Parquet, dans une table partitionnée par event_date. La table contient des dizaines de millions de valeurs distinctes de customer_id. La plupart des requêtes Amazon Athena recherchent les événements d'un seul customer_id sur une plage de dates, et elles lisent toujours tous les fichiers de chaque partition sélectionnée.

    Quelle solution réduira les données lues par ces requêtes ?
body:
  options:
    - { id: a, text: { en: "Add customer_id as a second partition key below event_date.", fr: "Ajouter customer_id comme deuxième clé de partition sous event_date." } }
    - { id: b, text: { en: "Create an AWS Glue partition index on the event_date partition key.", fr: "Créer un index de partition AWS Glue sur la clé de partition event_date." } }
    - { id: c, text: { en: "Turn on query result reuse for the queries in the Athena workgroup.", fr: "Activer la réutilisation des résultats de requête pour les requêtes du groupe de travail Athena." } }
    - { id: d, text: { en: "Rewrite the table with CTAS, using bucketed_by on customer_id and a fixed bucket_count.", fr: "Réécrire la table avec CTAS, en utilisant bucketed_by sur customer_id et un bucket_count fixe." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Bucketing writes all records with the same key value to the same file, so a lookup on one high-cardinality value such as a customer ID lets Athena skip the other files of the partition. Partitioning by date and bucketing by customer are complementary."
    fr: "Le compartimentage (bucketing) écrit tous les enregistrements ayant la même valeur de clé dans le même fichier : une recherche sur une seule valeur à forte cardinalité, comme un ID client, permet à Athena d'ignorer les autres fichiers de la partition. Le partitionnement par date et le compartimentage par client sont complémentaires."
  options:
    a:
      en: "Tens of millions of customer values would create a huge number of partitions with tiny files, which slows queries."
      fr: "Des dizaines de millions de valeurs de client créeraient un nombre énorme de partitions aux fichiers minuscules, ce qui ralentit les requêtes."
    b:
      en: "A partition index speeds up finding partitions in the catalog; it does not reduce the files read inside a partition."
      fr: "Un index de partition accélère la recherche des partitions dans le catalogue ; il ne réduit pas les fichiers lus dans une partition."
    c:
      en: "Result reuse returns cached results only for repeated identical queries; lookups for different customers still scan the data."
      fr: "La réutilisation des résultats ne renvoie des résultats en cache que pour des requêtes identiques répétées ; les recherches sur d'autres clients analysent toujours les données."
references:
  - title: Optimize data
    url: https://docs.aws.amazon.com/athena/latest/ug/performance-tuning-data-optimization-techniques.html
