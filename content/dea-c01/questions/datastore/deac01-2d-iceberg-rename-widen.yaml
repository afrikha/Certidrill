id: deac01-2d-iceberg-rename-widen
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ride-sharing company stores 40 TB of trip data in an Apache Iceberg table that it queries and updates with Amazon Athena. The source now sends trip identifiers that exceed the int range, and the business wants the fare column renamed to fare_amount. Downstream ETL jobs will write to the table with the new column name. The company wants to make these changes at the lowest cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de VTC stocke 40 To de données de trajets dans une table Apache Iceberg qu'elle interroge et met à jour avec Amazon Athena. La source envoie désormais des identifiants de trajet qui dépassent la plage du type int, et le métier veut renommer la colonne fare en fare_amount. Des tâches ETL en aval écriront dans la table avec le nouveau nom de colonne. L'entreprise veut effectuer ces changements au coût le plus bas.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a view over the table that casts trip_id to bigint and exposes fare as fare_amount.", fr: "Créer sur la table une vue qui convertit trip_id en bigint et expose fare sous le nom fare_amount." } }
    - { id: b, text: { en: "Run a CTAS statement that writes a new Iceberg table with the cast and renamed columns, and then drop the old table.", fr: "Exécuter une instruction CTAS qui écrit une nouvelle table Iceberg avec les colonnes converties et renommées, puis supprimer l'ancienne table." } }
    - { id: c, text: { en: "Run ALTER TABLE REPLACE COLUMNS with the complete column list that contains the new name and type.", fr: "Exécuter ALTER TABLE REPLACE COLUMNS avec la liste complète des colonnes qui contient le nouveau nom et le nouveau type." } }
    - { id: d, text: { en: "Run ALTER TABLE CHANGE COLUMN statements that promote trip_id from int to bigint and rename fare to fare_amount.", fr: "Exécuter des instructions ALTER TABLE CHANGE COLUMN qui promeuvent trip_id de int en bigint et renomment fare en fare_amount." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Iceberg supports renaming columns and widening types such as int to bigint, and these schema updates are metadata-only: no data file is rewritten. In Athena, ALTER TABLE CHANGE COLUMN changes the name, type, order or comment of an Iceberg column, so both changes cost almost nothing."
    fr: "Iceberg prend en charge le renommage de colonnes et l'élargissement de types comme int vers bigint, et ces mises à jour de schéma ne touchent que les métadonnées : aucun fichier de données n'est réécrit. Dans Athena, ALTER TABLE CHANGE COLUMN modifie le nom, le type, l'ordre ou le commentaire d'une colonne Iceberg : les deux changements ne coûtent presque rien."
  options:
    a:
      en: "A view changes only what readers see; the ETL jobs cannot write to the table through the new column name, and the stored column still cannot hold bigint values."
      fr: "Une vue ne change que ce que voient les lecteurs ; les tâches ETL ne peuvent pas écrire dans la table via le nouveau nom de colonne, et la colonne stockée ne peut toujours pas contenir de valeurs bigint."
    b:
      en: "CTAS rewrites all 40 TB of data, and Athena bills the data scanned, which is far more expensive than a metadata change."
      fr: "CTAS réécrit les 40 To de données, et Athena facture les données analysées, ce qui coûte bien plus cher qu'un changement de métadonnées."
    c:
      en: "Athena does not support REPLACE COLUMNS for Iceberg tables because it removes all columns before adding new ones."
      fr: "Athena ne prend pas en charge REPLACE COLUMNS pour les tables Iceberg, car cette instruction supprime toutes les colonnes avant d'en ajouter de nouvelles."
references:
  - title: Evolve Iceberg table schema
    url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-evolving-table-schema.html
  - title: ALTER TABLE CHANGE COLUMN
    url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-alter-table-change-column.html
