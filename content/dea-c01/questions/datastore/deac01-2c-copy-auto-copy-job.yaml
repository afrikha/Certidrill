id: deac01-2c-copy-auto-copy-job
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IoT company receives CSV files in an Amazon S3 prefix every few minutes throughout the day. The bucket is in the same AWS Region as an Amazon Redshift Serverless workgroup. Each file must be loaded into a local Redshift table within minutes of its arrival, and each file must be loaded only once. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise IoT reçoit des fichiers CSV dans un préfixe Amazon S3 à intervalles de quelques minutes tout au long de la journée. Le compartiment se trouve dans la même Région AWS qu'un groupe de travail Amazon Redshift Serverless. Chaque fichier doit être chargé dans une table Redshift locale quelques minutes après son arrivée, et chaque fichier ne doit être chargé qu'une seule fois. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure an S3 event notification that invokes an AWS Lambda function, which runs a COPY for each new object through the Redshift Data API.", fr: "Configurer une notification d'événement S3 qui appelle une fonction AWS Lambda, laquelle exécute un COPY par nouvel objet via l'API de données Redshift." }
    - id: b
      text: { en: "Create a Redshift Spectrum external table over the prefix, and have the reports query the external table directly.", fr: "Créer une table externe Redshift Spectrum sur le préfixe, et faire interroger directement la table externe par les rapports." }
    - id: c
      text: { en: "Create an Amazon EventBridge Scheduler schedule that runs a COPY of the whole prefix every 5 minutes through the Redshift Data API.", fr: "Créer une planification Amazon EventBridge Scheduler qui exécute toutes les 5 minutes un COPY de tout le préfixe via l'API de données Redshift." }
    - id: d
      text: { en: "Create an S3 event integration for the bucket, and create a COPY JOB with AUTO ON that loads the prefix into the table.", fr: "Créer une intégration d'événements S3 pour le compartiment, et créer un COPY JOB avec AUTO ON qui charge le préfixe dans la table." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With an S3 event integration, Redshift detects new objects under the COPY JOB path and runs COPY automatically, batching files as it sees fit and keeping track of the files already loaded. It works with provisioned clusters and Redshift Serverless when the bucket and the target are in the same Region, and no code or scheduler is needed.
    fr: |
      Avec une intégration d'événements S3, Redshift détecte les nouveaux objets sous le chemin du COPY JOB et exécute COPY automatiquement, en regroupant les fichiers comme il l'entend et en suivant les fichiers déjà chargés. Cela fonctionne avec les clusters provisionnés et Redshift Serverless quand le compartiment et la cible sont dans la même Région, sans code ni planificateur.
  options:
    a: { en: "It works, but the company must write, deploy and maintain the function and handle retries and duplicate events itself.", fr: "Cela fonctionne, mais l'entreprise doit écrire, déployer et maintenir la fonction, et gérer elle-même les nouvelles tentatives et les événements en double." }
    b: { en: "Spectrum queries the files in place; the data is never loaded into a local Redshift table as required.", fr: "Spectrum interroge les fichiers sur place ; les données ne sont jamais chargées dans une table Redshift locale comme exigé." }
    c: { en: "A COPY of the whole prefix reloads files that were already loaded, so rows are duplicated at every run.", fr: "Un COPY de tout le préfixe recharge les fichiers déjà chargés : les lignes sont dupliquées à chaque exécution." }
references:
  - title: Create an S3 event integration to automatically copy files from Amazon S3 buckets
    url: https://docs.aws.amazon.com/redshift/latest/dg/loading-data-copy-job.html
