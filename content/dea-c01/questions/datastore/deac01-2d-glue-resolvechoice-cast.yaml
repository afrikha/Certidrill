id: deac01-2d-glue-resolvechoice-cast
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue ETL job reads JSON order files from several partner systems into a DynamicFrame named orders_dyf. Some partners send the price field as a number, such as 19.99, and others send it as a string, such as "19.99", so AWS Glue infers price as a choice type. The target table needs a single numeric price column, and every record must keep its price value.

    Which transformation should the data engineer add to the job?
  fr: |
    Une tâche ETL AWS Glue lit dans un DynamicFrame nommé orders_dyf des fichiers de commandes JSON provenant de plusieurs systèmes partenaires. Certains partenaires envoient le champ price sous forme de nombre, comme 19.99, et d'autres sous forme de chaîne, comme « 19.99 » : AWS Glue déduit donc pour price un type choice. La table cible a besoin d'une seule colonne price numérique, et chaque enregistrement doit conserver sa valeur de prix.

    Quelle transformation l'ingénieur de données doit-il ajouter à la tâche ?
body:
  options:
    - { id: a, text: "orders_dyf.resolveChoice(specs=[(\"price\", \"make_cols\")])" }
    - { id: b, text: "orders_dyf.resolveChoice(specs=[(\"price\", \"project:double\")])" }
    - { id: c, text: "orders_dyf.resolveChoice(specs=[(\"price\", \"cast:double\")])" }
    - { id: d, text: "orders_dyf.resolveChoice(specs=[(\"price\", \"make_struct\")])" }
answer: { optionId: c }
explanation:
  correct:
    en: "A choice type means that a field holds values of more than one type across records. The cast:double action converts every value of the field, numbers and numeric strings alike, to one double column, so no price is lost."
    fr: "Un type choice signifie qu'un champ contient des valeurs de plusieurs types selon les enregistrements. L'action cast:double convertit toutes les valeurs du champ, nombres comme chaînes numériques, en une seule colonne double : aucun prix n'est perdu."
  options:
    a:
      en: "make_cols splits the field into two columns, price_double and price_string, instead of one numeric column."
      fr: "make_cols divise le champ en deux colonnes, price_double et price_string, au lieu d'une seule colonne numérique."
    b:
      en: "project:double keeps only the values that are already doubles and drops the string values, so those records lose their price."
      fr: "project:double ne garde que les valeurs déjà de type double et supprime les valeurs de type chaîne : ces enregistrements perdent leur prix."
    d:
      en: "make_struct turns the field into a structure that holds both a double and a string, not a single numeric column."
      fr: "make_struct transforme le champ en une structure qui contient à la fois un double et une chaîne, et non une seule colonne numérique."
references:
  - title: ResolveChoice class
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-crawler-pyspark-transforms-ResolveChoice.html
