id: deac01-2c-ttl-global-replica-cost
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon DynamoDB global table (version 2019.11.21) with provisioned capacity and replicas in three AWS Regions. TTL deletes millions of expired items every day. The finance team sees write capacity consumed by these deletions in the two replica Regions, but not in the Region where the items expire.

    Which statement explains this behavior?
  fr: |
    Une entreprise utilise une table globale Amazon DynamoDB (version 2019.11.21) en capacité provisionnée, avec des réplicas dans trois Régions AWS. La durée de vie (TTL) supprime chaque jour des millions d'éléments expirés. L'équipe financière constate une consommation de capacité d'écriture due à ces suppressions dans les deux Régions de réplica, mais pas dans la Région où les éléments expirent.

    Quelle affirmation explique ce comportement ?
body:
  options:
    - id: a
      text: { en: "TTL is not supported on global tables, so the application deletes the items itself in each replica Region.", fr: "TTL n'est pas pris en charge sur les tables globales : l'application supprime donc elle-même les éléments dans chaque Région de réplica." }
    - id: b
      text: { en: "Each replica runs its own TTL process, which consumes write capacity because the replica is not the source of the items.", fr: "Chaque réplica exécute son propre processus TTL, qui consomme de la capacité d'écriture parce que le réplica n'est pas la source des éléments." }
    - id: c
      text: { en: "TTL deletes are free in their Region, but each replicated delete consumes replicated write capacity in the other Regions.", fr: "Les suppressions TTL sont gratuites dans leur Région, mais chaque suppression répliquée consomme de la capacité d'écriture répliquée ailleurs." }
    - id: d
      text: { en: "The replica Regions use on-demand capacity for replication, and DynamoDB bills TTL deletes only in on-demand mode.", fr: "Les Régions de réplica utilisent la capacité à la demande pour la réplication, et DynamoDB ne facture les suppressions TTL qu'en mode à la demande." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In global tables version 2019.11.21, the TTL delete is free in the Region where it occurs. The delete is then replicated, and each replicated delete consumes a replicated write capacity unit (provisioned) or a replicated write unit (on-demand) in every replica Region.
    fr: |
      Dans les tables globales version 2019.11.21, la suppression TTL est gratuite dans la Région où elle se produit. La suppression est ensuite répliquée, et chaque suppression répliquée consomme une unité de capacité d'écriture répliquée (provisionné) ou une unité d'écriture répliquée (à la demande) dans chaque Région de réplica.
  options:
    a: { en: "TTL works on global tables; the deletes are made by TTL in one Region and replicated to the others.", fr: "TTL fonctionne sur les tables globales ; les suppressions sont faites par TTL dans une Région et répliquées dans les autres." }
    b: { en: "The deletes in the replica Regions are replicated from the Region where TTL ran; they are not separate TTL deletions.", fr: "Les suppressions des Régions de réplica sont répliquées depuis la Région où TTL s'est exécuté ; ce ne sont pas des suppressions TTL distinctes." }
    d: { en: "The table uses provisioned capacity in every Region, and the charge comes from replication, not from the capacity mode.", fr: "La table utilise la capacité provisionnée dans chaque Région, et le coût vient de la réplication, pas du mode de capacité." }
references:
  - title: Using time to live (TTL) in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
