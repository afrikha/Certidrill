id: deac01-2b-conn-secrets-manager
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Several AWS Glue crawlers and ETL jobs share one AWS Glue connection to an Amazon Redshift cluster. The connection currently stores the database user name and password directly. A new security standard requires database passwords to be rotated automatically and never stored in connection properties. The crawlers and jobs must keep using the connection without code changes.

    Which solution will meet these requirements?
  fr: |
    Plusieurs robots d'analyse (crawlers) et tâches ETL AWS Glue partagent une même connexion AWS Glue vers un cluster Amazon Redshift. La connexion stocke actuellement directement le nom d'utilisateur et le mot de passe de la base de données. Une nouvelle norme de sécurité exige que les mots de passe des bases de données fassent l'objet d'une rotation automatique et ne soient jamais stockés dans les propriétés des connexions. Les robots d'analyse et les tâches doivent continuer à utiliser la connexion sans modification du code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Pass the password to each job as a job parameter, and change the parameter value when the password is rotated.", fr: "Passer le mot de passe à chaque tâche comme paramètre de tâche, et modifier la valeur du paramètre lors de la rotation du mot de passe." } }
    - { id: b, text: { en: "Turn on the Data Catalog setting that encrypts connection passwords with an AWS KMS key.", fr: "Activer le paramètre du Data Catalog qui chiffre les mots de passe des connexions avec une clé AWS KMS." } }
    - { id: c, text: { en: "Store the password as a SecureString in AWS Systems Manager Parameter Store, and read it in each job script.", fr: "Stocker le mot de passe en tant que SecureString dans AWS Systems Manager Parameter Store, et le lire dans le script de chaque tâche." } }
    - { id: d, text: { en: "Store the credentials in an AWS Secrets Manager secret with rotation, and reference the secret in the connection.", fr: "Stocker les informations d'identification dans un secret AWS Secrets Manager avec rotation, et référencer le secret dans la connexion." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Glue connections can take their credentials from an AWS Secrets Manager secret instead of a user name and password, which AWS recommends. Secrets Manager rotates the secret, and every crawler and job that uses the connection gets the current credentials with no code change."
    fr: "Les connexions AWS Glue peuvent obtenir leurs informations d'identification d'un secret AWS Secrets Manager au lieu d'un nom d'utilisateur et d'un mot de passe, ce qu'AWS recommande. Secrets Manager effectue la rotation du secret, et chaque robot d'analyse et chaque tâche qui utilise la connexion obtient les informations d'identification actuelles sans modification du code."
  options:
    a:
      en: "Job parameters expose the password in the job definition, require a manual update at each rotation, and do not apply to crawlers."
      fr: "Les paramètres de tâche exposent le mot de passe dans la définition de la tâche, exigent une mise à jour manuelle à chaque rotation et ne s'appliquent pas aux robots d'analyse."
    b:
      en: "Encryption protects the stored password, but the password is still stored in the connection and is not rotated."
      fr: "Le chiffrement protège le mot de passe stocké, mais celui-ci reste stocké dans la connexion et ne fait l'objet d'aucune rotation."
    c:
      en: "Reading the parameter requires code changes in every script, does not serve the crawlers, and Parameter Store does not rotate the value."
      fr: "Lire le paramètre exige de modifier chaque script, ne sert pas les robots d'analyse, et Parameter Store n'effectue pas la rotation de la valeur."
references:
  - title: AWS Glue connection properties
    url: https://docs.aws.amazon.com/glue/latest/dg/connection-properties.html
