id: deac01-2b-use-redshift-automount
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Analysts use Amazon Redshift query editor v2 with an Amazon Redshift Serverless workgroup. They want to explore any table of the AWS Glue Data Catalog of the account and run ad hoc read-only queries on it. The data engineers do not want to create or maintain an external schema for each Glue database.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Des analystes utilisent l'éditeur de requêtes v2 d'Amazon Redshift avec un groupe de travail Amazon Redshift Serverless. Ils veulent explorer n'importe quelle table de l'AWS Glue Data Catalog du compte et y exécuter des requêtes ad hoc en lecture seule. Les ingénieurs de données ne veulent pas créer ni maintenir un schéma externe pour chaque base de données Glue.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Schedule an AWS Glue job that runs CREATE EXTERNAL SCHEMA in the workgroup for every new database of the Data Catalog.", fr: "Planifier une tâche AWS Glue qui exécute CREATE EXTERNAL SCHEMA dans le groupe de travail pour chaque nouvelle base de données du Data Catalog." } }
    - { id: b, text: { en: "Load each Data Catalog table into the workgroup with a scheduled COPY command, and grant the analysts SELECT on the loaded tables.", fr: "Charger chaque table du Data Catalog dans le groupe de travail avec une commande COPY planifiée, et accorder SELECT aux analystes sur les tables chargées." } }
    - { id: c, text: { en: "Create one Redshift datashare per Glue database, and associate each datashare with the analysts' workgroup.", fr: "Créer une unité de partage des données (datashare) Redshift par base de données Glue, et associer chaque unité au groupe de travail des analystes." } }
    - { id: d, text: { en: "Grant USAGE on the auto-mounted awsdatacatalog database, and query the tables with names such as awsdatacatalog.glue_db.table.", fr: "Accorder USAGE sur la base de données awsdatacatalog montée automatiquement, et interroger les tables avec des noms tels que awsdatacatalog.glue_db.table." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Redshift Serverless and RA3 clusters mount the Data Catalog as a database named awsdatacatalog, whose schemas are the Glue databases. After USAGE is granted on it to the analysts' IAM identity, they query any table with a three-part name, read-only, without any external schema."
    fr: "Redshift Serverless et les clusters RA3 montent le Data Catalog comme une base de données nommée awsdatacatalog, dont les schémas sont les bases de données Glue. Une fois USAGE accordé sur celle-ci à l'identité IAM des analystes, ils interrogent n'importe quelle table avec un nom en trois parties, en lecture seule, sans schéma externe."
  options:
    a:
      en: "A job that creates external schemas is exactly the per-database maintenance that the engineers want to avoid."
      fr: "Une tâche qui crée des schémas externes correspond justement à la maintenance par base de données que les ingénieurs veulent éviter."
    b:
      en: "Loading every table copies the data and adds scheduled loads to maintain, which is more overhead than querying the catalog in place."
      fr: "Charger chaque table copie les données et ajoute des chargements planifiés à maintenir, ce qui représente plus de charge que d'interroger le catalogue sur place."
    c:
      en: "Datashares share objects of a Redshift producer; they cannot contain the databases of the Glue Data Catalog."
      fr: "Les unités de partage des données partagent les objets d'un producteur Redshift ; elles ne peuvent pas contenir les bases de données de Glue Data Catalog."
references:
  - title: Querying the AWS Glue Data Catalog
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/query-editor-v2-glue.html
