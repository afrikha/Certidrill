id: deac01-2b-crawl-multi-role-kms
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A data engineer creates an AWS Glue crawler for an Amazon S3 prefix whose objects are encrypted with SSE-KMS and a customer managed key. The crawler's IAM role trusts AWS Glue and has the AWSGlueServiceRole managed policy attached. The crawler fails with access denied errors when it reads the objects.

    Which permissions must be added to the role? (Choose two.)
  fr: |
    Un ingénieur de données crée un robot d'analyse (crawler) AWS Glue pour un préfixe Amazon S3 dont les objets sont chiffrés avec SSE-KMS et une clé gérée par le client. Le rôle IAM du robot d'analyse approuve AWS Glue et la politique gérée AWSGlueServiceRole lui est attachée. Le robot d'analyse échoue avec des erreurs d'accès refusé lorsqu'il lit les objets.

    Quelles autorisations faut-il ajouter au rôle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "s3:GetObject on the objects of the crawled prefix", fr: "s3:GetObject sur les objets du préfixe analysé" } }
    - { id: b, text: { en: "s3:PutObject on the objects of the crawled prefix", fr: "s3:PutObject sur les objets du préfixe analysé" } }
    - { id: c, text: { en: "kms:Decrypt on the customer managed key", fr: "kms:Decrypt sur la clé gérée par le client" } }
    - { id: d, text: { en: "kms:CreateKey in the account", fr: "kms:CreateKey dans le compte" } }
    - { id: e, text: { en: "glue:CreateJob in the account", fr: "glue:CreateJob dans le compte" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AWSGlueServiceRole grants the Data Catalog permissions, and the role also needs an inline policy on the data source, at minimum s3:GetObject on the crawled objects. Because the objects are encrypted with a KMS key, the role must also have decrypt permission on that key."
    fr: "AWSGlueServiceRole accorde les autorisations sur le Data Catalog, et le rôle a aussi besoin d'une politique en ligne sur la source de données, au minimum s3:GetObject sur les objets analysés. Comme les objets sont chiffrés avec une clé KMS, le rôle doit aussi avoir l'autorisation de déchiffrement sur cette clé."
  options:
    b:
      en: "A crawler of an S3 data store only reads the objects; write access is not needed."
      fr: "Un robot d'analyse d'un magasin de données S3 ne fait que lire les objets ; l'accès en écriture n'est pas nécessaire."
    d:
      en: "The key already exists; the crawler only needs to decrypt with it, not to create keys."
      fr: "La clé existe déjà ; le robot d'analyse doit seulement déchiffrer avec elle, pas créer de clés."
    e:
      en: "Creating jobs is unrelated to crawling; the crawler writes tables to the Data Catalog, which AWSGlueServiceRole already allows."
      fr: "Créer des tâches n'a aucun rapport avec l'analyse ; le robot d'analyse écrit des tables dans le Data Catalog, ce qu'AWSGlueServiceRole autorise déjà."
references:
  - title: Crawler prerequisites
    url: https://docs.aws.amazon.com/glue/latest/dg/crawler-prereqs.html
