id: deac01-2b-part-msck-hive-style
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores web impressions in Amazon S3 under Hive-style prefixes such as s3://example-ads/impressions/dt=2026-11-21/. An Amazon Athena table named impressions is partitioned by dt and was created a month ago. Queries return no rows for the days that were added after the table was created.

    Which statement should the data engineer run to make the new days queryable?
  fr: |
    Une entreprise stocke des impressions web dans Amazon S3 sous des préfixes de style Hive tels que s3://example-ads/impressions/dt=2026-11-21/. Une table Amazon Athena nommée impressions est partitionnée par dt et a été créée il y a un mois. Les requêtes ne renvoient aucune ligne pour les jours ajoutés après la création de la table.

    Quelle instruction l'ingénieur de données doit-il exécuter pour rendre les nouveaux jours interrogeables ?
body:
  options:
    - { id: a, text: "SHOW PARTITIONS impressions" }
    - { id: b, text: "MSCK REPAIR TABLE impressions" }
    - { id: c, text: "ALTER TABLE impressions ADD COLUMNS (dt string)" }
    - { id: d, text: "DESCRIBE FORMATTED impressions" }
answer: { optionId: b }
explanation:
  correct:
    en: "MSCK REPAIR TABLE scans the table location for Hive-compatible partitions that were added after the table was created and adds them to the metadata. The new dt=... prefixes then become partitions that Athena can query."
    fr: "MSCK REPAIR TABLE parcourt l'emplacement de la table à la recherche de partitions compatibles Hive ajoutées après la création de la table et les ajoute aux métadonnées. Les nouveaux préfixes dt=... deviennent alors des partitions qu'Athena peut interroger."
  options:
    a:
      en: "SHOW PARTITIONS lists only the partitions already in the metadata; it does not add the new ones."
      fr: "SHOW PARTITIONS ne liste que les partitions déjà présentes dans les métadonnées ; il n'ajoute pas les nouvelles."
    c:
      en: "dt is already the partition column; adding columns changes the schema and registers no partition."
      fr: "dt est déjà la colonne de partition ; ajouter des colonnes modifie le schéma et n'enregistre aucune partition."
    d:
      en: "DESCRIBE FORMATTED shows the table definition; it does not change the partition metadata."
      fr: "DESCRIBE FORMATTED affiche la définition de la table ; il ne modifie pas les métadonnées des partitions."
references:
  - title: MSCK REPAIR TABLE
    url: https://docs.aws.amazon.com/athena/latest/ug/msck-repair-table.html
