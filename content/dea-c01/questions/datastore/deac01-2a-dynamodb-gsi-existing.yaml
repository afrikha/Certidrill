id: deac01-2a-dynamodb-gsi-existing
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has used an Amazon DynamoDB table named Customers in production for 2 years. The partition key is customer_id. A new feature must look up a customer by email address with a Query operation, and eventually consistent reads are acceptable. The table must not be recreated.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise en production depuis 2 ans une table Amazon DynamoDB nommée Customers. La clé de partition est customer_id. Une nouvelle fonctionnalité doit rechercher un client par adresse e-mail avec une opération Query, et des lectures à cohérence éventuelle sont acceptables. La table ne doit pas être recréée.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Add a local secondary index that uses email as its sort key.", fr: "Ajouter un index secondaire local qui utilise email comme clé de tri." } }
    - { id: b, text: { en: "Run a Scan operation with a filter expression on the email attribute.", fr: "Exécuter une opération Scan avec une expression de filtre sur l'attribut email." } }
    - { id: c, text: { en: "Add a global secondary index that uses email as its partition key.", fr: "Ajouter un index secondaire global qui utilise email comme clé de partition." } }
    - { id: d, text: { en: "Copy each item to a second table keyed on email with DynamoDB Streams and Lambda.", fr: "Copier chaque élément dans une seconde table indexée sur email avec DynamoDB Streams et Lambda." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A global secondary index can have a different partition key from the base table and can be added to an existing table, after which Query on email returns the customer. GSI reads are eventually consistent, which the feature accepts."
    fr: "Un index secondaire global peut avoir une clé de partition différente de celle de la table de base et peut être ajouté à une table existante ; une opération Query sur email renvoie alors le client. Les lectures d'un GSI sont à cohérence éventuelle, ce que la fonctionnalité accepte."
  options:
    a:
      en: "A local secondary index keeps the table's partition key and can only be created with the table, so it cannot be added now or query by email alone."
      fr: "Un index secondaire local garde la clé de partition de la table et ne peut être créé qu'avec la table : il ne peut ni être ajouté maintenant ni interroger par e-mail seul."
    b:
      en: "Scan reads the whole table for every lookup and is not a Query; it is slow and costly on a large table."
      fr: "Scan lit toute la table à chaque recherche et n'est pas une opération Query ; il est lent et coûteux sur une grande table."
    d:
      en: "This works but adds a function and a second table to build and maintain, which a GSI does natively."
      fr: "Cela fonctionne, mais ajoute une fonction et une seconde table à créer et à maintenir, ce qu'un GSI fait nativement."
references:
  - title: Using Global Secondary Indexes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
