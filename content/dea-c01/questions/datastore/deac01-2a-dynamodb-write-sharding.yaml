id: deac01-2a-dynamodb-write-sharding
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IoT company writes every event to an Amazon DynamoDB table whose partition key is event_date (YYYY-MM-DD) and whose sort key is event_id. All the writes of a day go to the same partition key value, and the table throttles writes even though the consumed capacity is far below the table's capacity. A nightly job must still read all the events of a given day.

    Which solution will fix the throttling and keep the nightly job possible?
  fr: |
    Une entreprise IoT écrit chaque événement dans une table Amazon DynamoDB dont la clé de partition est event_date (AAAA-MM-JJ) et la clé de tri event_id. Toutes les écritures d'une journée vont vers la même valeur de clé de partition, et la table limite les écritures alors que la capacité consommée est très inférieure à celle de la table. Une tâche nocturne doit toujours lire tous les événements d'une journée donnée.

    Quelle solution supprime la limitation et garde la tâche nocturne possible ?
body:
  options:
    - { id: a, text: { en: "Append a suffix (1–100) computed from event_id to event_date, and query every suffix in the nightly job.", fr: "Ajouter à event_date un suffixe (1 à 100) calculé à partir d'event_id, et interroger chaque suffixe dans la tâche nocturne." } }
    - { id: b, text: { en: "Switch the table to on-demand capacity mode and keep event_date as the partition key.", fr: "Passer la table en mode de capacité à la demande et garder event_date comme clé de partition." } }
    - { id: c, text: { en: "Add a global secondary index whose partition key is event_id, and keep the table keys unchanged.", fr: "Ajouter un index secondaire global dont la clé de partition est event_id, et garder les clés de la table inchangées." } }
    - { id: d, text: { en: "Double the provisioned write capacity units of the table and keep event_date as the partition key.", fr: "Doubler les unités de capacité d'écriture provisionnées de la table et garder event_date comme clé de partition." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Write sharding spreads the writes of one logical key across many partition key values, such as 2026-11-22.1 to 2026-11-22.100, so no single partition is hot. A suffix calculated from event_id still allows GetItem on one event, and the nightly job issues one Query per suffix and merges the results."
    fr: "Le partitionnement des écritures (write sharding) répartit les écritures d'une clé logique sur de nombreuses valeurs de clé de partition, par exemple 2026-11-22.1 à 2026-11-22.100, si bien qu'aucune partition n'est surchargée. Un suffixe calculé à partir d'event_id permet encore GetItem sur un événement, et la tâche nocturne émet une requête Query par suffixe puis fusionne les résultats."
  options:
    b:
      en: "On-demand mode removes table capacity planning, but one partition key value still receives all the writes and stays limited by per-partition throughput."
      fr: "Le mode à la demande supprime la planification de capacité de la table, mais une seule valeur de clé de partition reçoit toujours toutes les écritures et reste limitée par le débit par partition."
    c:
      en: "An index does not change where the base table writes go; the hot event_date value remains, and the index adds write traffic."
      fr: "Un index ne change pas la destination des écritures de la table de base ; la valeur event_date surchargée demeure, et l'index ajoute du trafic d'écriture."
    d:
      en: "The throttling comes from one hot partition key value, not from the table total, so more table capacity does not remove it."
      fr: "La limitation vient d'une valeur de clé de partition surchargée, pas du total de la table : plus de capacité de table ne la supprime pas."
references:
  - title: Using write sharding to distribute workloads evenly in your DynamoDB table
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html
