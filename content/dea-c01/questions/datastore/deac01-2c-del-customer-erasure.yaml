id: deac01-2c-del-customer-erasure
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores customer profiles in an Amazon DynamoDB table with customer_id as the partition key and record_type as the sort key. It also stores exports of each customer's data in a versioning-enabled Amazon S3 bucket under the `exports/customer_id=<id>/` prefix. A privacy regulation requires all of a customer's data to be permanently deleted within 24 hours of a request. Backups are handled by a separate process.

    Which actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise stocke les profils clients dans une table Amazon DynamoDB avec customer_id comme clé de partition et record_type comme clé de tri. Elle stocke aussi les exports des données de chaque client dans un compartiment Amazon S3 avec gestion des versions activée, sous le préfixe `exports/customer_id=<id>/`. Une réglementation sur la confidentialité exige que toutes les données d'un client soient supprimées définitivement dans les 24 heures qui suivent une demande. Les sauvegardes sont traitées par un processus distinct.

    Quelles actions permettent de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the TTL attribute of the customer's items to the current time so that DynamoDB deletes them.", fr: "Définir l'attribut TTL des éléments du client à l'heure actuelle afin que DynamoDB les supprime." } }
    - { id: b, text: { en: "Query the table on the customer's partition key and delete every returned item.", fr: "Interroger la table sur la clé de partition du client et supprimer chaque élément renvoyé." } }
    - { id: c, text: { en: "Send a DELETE request without a version ID for each object under the customer's prefix.", fr: "Envoyer une requête DELETE sans ID de version pour chaque objet sous le préfixe du client." } }
    - { id: d, text: { en: "List the object versions under the customer's prefix and delete each version by its version ID.", fr: "Lister les versions d'objet sous le préfixe du client et supprimer chaque version par son ID de version." } }
    - { id: e, text: { en: "Suspend versioning on the bucket, and then delete the objects under the customer's prefix.", fr: "Suspendre la gestion des versions sur le compartiment, puis supprimer les objets sous le préfixe du client." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      All of a customer's items share the partition key, so one Query returns them and explicit deletes remove them at once. In a versioned bucket, only a DELETE that specifies a version ID removes a version permanently, so every version under the prefix must be deleted that way.
    fr: |
      Tous les éléments d'un client partagent la clé de partition : une seule requête Query les renvoie, et des suppressions explicites les retirent immédiatement. Dans un compartiment versionné, seule une requête DELETE qui indique un ID de version supprime définitivement une version : chaque version sous le préfixe doit être supprimée ainsi.
  options:
    a: { en: "TTL typically deletes expired items within a few days, with no guaranteed time, so the 24-hour deadline could be missed.", fr: "TTL supprime généralement les éléments expirés en quelques jours, sans délai garanti : l'échéance de 24 heures pourrait être dépassée." }
    c: { en: "In a versioned bucket, a simple DELETE only adds a delete marker; the previous versions and their data remain.", fr: "Dans un compartiment versionné, une suppression simple ajoute seulement un marqueur de suppression ; les versions précédentes et leurs données restent." }
    e: { en: "Suspending versioning keeps the existing versions, so the customer's earlier versions would still be stored.", fr: "Suspendre la gestion des versions conserve les versions existantes : les versions antérieures du client seraient toujours stockées." }
references:
  - title: Retaining multiple versions of objects with S3 Versioning
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html
  - title: Using time to live (TTL) in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
