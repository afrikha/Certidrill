id: deac01-2b-use-athena-cross-account-catalog
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A producer account owns an AWS Glue Data Catalog that describes data in Amazon S3. Analysts in a separate analytics account must query these tables with Amazon Athena and refer to them by a catalog name in their SQL. The company does not use AWS Lake Formation: access is managed with a Glue resource policy, IAM policies and S3 bucket policies, which are already in place. The table metadata must not be duplicated in the analytics account.

    Which solution will meet these requirements?
  fr: |
    Un compte producteur possède un AWS Glue Data Catalog qui décrit des données dans Amazon S3. Des analystes d'un compte d'analyse distinct doivent interroger ces tables avec Amazon Athena et y faire référence par un nom de catalogue dans leur SQL. L'entreprise n'utilise pas AWS Lake Formation : l'accès est géré par une politique de ressources Glue, des politiques IAM et des politiques de compartiment S3, qui sont déjà en place. Les métadonnées des tables ne doivent pas être dupliquées dans le compte d'analyse.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an AWS Glue crawler in the analytics account on the producer's S3 bucket to create the same tables in the local Data Catalog.", fr: "Exécuter un robot d'analyse AWS Glue dans le compte d'analyse sur le compartiment S3 du producteur pour créer les mêmes tables dans le Data Catalog local." } }
    - { id: b, text: { en: "In the analytics account, create an Athena data catalog of type GLUE whose catalog-id parameter is the producer's account ID.", fr: "Dans le compte d'analyse, créer un catalogue de données Athena de type GLUE dont le paramètre catalog-id est l'ID du compte producteur." } }
    - { id: c, text: { en: "In the analytics account, deploy an Athena JDBC data source connector that points to the AWS Glue endpoint of the producer account.", fr: "Dans le compte d'analyse, déployer un connecteur de source de données JDBC Athena qui pointe vers le point de terminaison AWS Glue du compte producteur." } }
    - { id: d, text: { en: "Replicate the producer's bucket to the analytics account with S3 Replication, and define the tables again with Athena DDL.", fr: "Répliquer le compartiment du producteur vers le compte d'analyse avec S3 Replication, puis redéfinir les tables avec du DDL Athena." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Athena queries a Glue Data Catalog of another account after that catalog is registered as an Athena DataCatalog resource, for example with CreateDataCatalog, type GLUE and the owner's account ID as catalog-id. Analysts then use the registered catalog name in their queries, and the metadata stays in the producer account."
    fr: "Athena interroge le Glue Data Catalog d'un autre compte une fois ce catalogue enregistré comme ressource DataCatalog Athena, par exemple avec CreateDataCatalog, le type GLUE et l'ID du compte propriétaire comme catalog-id. Les analystes utilisent ensuite le nom du catalogue enregistré dans leurs requêtes, et les métadonnées restent dans le compte producteur."
  options:
    a:
      en: "The crawler creates a second copy of the table definitions in the analytics account, which the requirements forbid."
      fr: "Le robot d'analyse crée une seconde copie des définitions de tables dans le compte d'analyse, ce que les exigences interdisent."
    c:
      en: "Data source connectors query external databases through Lambda; the Data Catalog is not a JDBC data source."
      fr: "Les connecteurs de sources de données interrogent des bases de données externes au moyen de Lambda ; le Data Catalog n'est pas une source de données JDBC."
    d:
      en: "Replication copies the data and the new DDL duplicates the metadata, adding cost and a second set of tables to keep in sync."
      fr: "La réplication copie les données et le nouveau DDL duplique les métadonnées, ce qui ajoute des coûts et un second jeu de tables à synchroniser."
references:
  - title: Register a Data Catalog from another account
    url: https://docs.aws.amazon.com/athena/latest/ug/data-sources-glue-cross-account.html
  - title: Granting cross-account access
    url: https://docs.aws.amazon.com/glue/latest/dg/cross-account-access.html
