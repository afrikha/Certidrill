id: deac01-2c-lc-raw-prefix-tier
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's data lake bucket in Amazon S3 has a raw/ prefix and a curated/ prefix. Objects are Parquet files of 200 MB to 1 GB. AWS Glue jobs read each raw object during the first 7 days after it arrives. After that, auditors read raw objects about once a quarter and need millisecond access. Objects in curated/ are read every day. The company wants the MOST cost-effective storage.

    Which solution will meet these requirements?
  fr: |
    Le compartiment de lac de données d'une entreprise dans Amazon S3 comporte un préfixe raw/ et un préfixe curated/. Les objets sont des fichiers Parquet de 200 Mo à 1 Go. Des tâches AWS Glue lisent chaque objet brut pendant les 7 jours qui suivent son arrivée. Ensuite, des auditeurs lisent les objets bruts environ une fois par trimestre et ont besoin d'un accès en quelques millisecondes. Les objets de curated/ sont lus tous les jours. L'entreprise veut le stockage le plus rentable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an S3 Lifecycle rule with no filter that transitions objects to S3 Glacier Instant Retrieval 7 days after creation.", fr: "Créer une règle S3 Lifecycle sans filtre qui fait passer les objets à S3 Glacier Instant Retrieval 7 jours après leur création." }
    - id: b
      text: { en: "Create an S3 Lifecycle rule for the raw/ prefix that transitions objects to S3 Glacier Flexible Retrieval 7 days after creation.", fr: "Créer une règle S3 Lifecycle pour le préfixe raw/ qui fait passer les objets à S3 Glacier Flexible Retrieval 7 jours après leur création." }
    - id: c
      text: { en: "Create an S3 Lifecycle rule for the raw/ prefix that transitions objects to S3 Glacier Instant Retrieval 7 days after creation.", fr: "Créer une règle S3 Lifecycle pour le préfixe raw/ qui fait passer les objets à S3 Glacier Instant Retrieval 7 jours après leur création." }
    - id: d
      text: { en: "Create an S3 Lifecycle rule for the raw/ prefix that transitions objects to S3 Standard-IA 7 days after creation.", fr: "Créer une règle S3 Lifecycle pour le préfixe raw/ qui fait passer les objets à S3 Standard-IA 7 jours après leur création." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A prefix filter limits the transition to raw/, so the curated data that is read daily stays in S3 Standard. S3 Glacier Instant Retrieval is designed for long-lived data accessed about once a quarter and still serves reads in milliseconds.
    fr: |
      Un filtre de préfixe limite la transition à raw/ : les données de curated/, lues chaque jour, restent dans S3 Standard. S3 Glacier Instant Retrieval est conçu pour des données de longue durée consultées environ une fois par trimestre et répond toujours aux lectures en quelques millisecondes.
  options:
    a: { en: "A rule without a filter also moves the curated objects, which are read every day and would incur retrieval charges.", fr: "Une règle sans filtre déplace aussi les objets de curated/, lus chaque jour, qui entraîneraient des frais de récupération." }
    b: { en: "S3 Glacier Flexible Retrieval objects must be restored before they are read, which takes minutes to hours, not milliseconds.", fr: "Les objets S3 Glacier Flexible Retrieval doivent être restaurés avant d'être lus, ce qui prend de quelques minutes à quelques heures, pas quelques millisecondes." }
    d: { en: "S3 Standard-IA is designed for data read about once a month; for quarterly reads, S3 Glacier Instant Retrieval stores the data at a lower cost.", fr: "S3 Standard-IA est conçu pour des données lues environ une fois par mois ; pour des lectures trimestrielles, S3 Glacier Instant Retrieval stocke les données à moindre coût." }
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
