id: deac01-2d-lineage-emr-spark
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineering team runs Apache Spark jobs on Amazon EMR Serverless release 7.5 from an Amazon SageMaker Unified Studio project. The jobs read and write AWS Glue Data Catalog tables. Lineage for these jobs does not appear in Amazon SageMaker Catalog. The team wants every job run to send dataset and column-level lineage to the catalog automatically.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données exécute des tâches Apache Spark sur Amazon EMR Serverless version 7.5 depuis un projet Amazon SageMaker Unified Studio. Les tâches lisent et écrivent des tables du AWS Glue Data Catalog. Le lignage de ces tâches n'apparaît pas dans Amazon SageMaker Catalog. L'équipe veut que chaque exécution de tâche envoie automatiquement au catalogue le lignage au niveau des jeux de données et des colonnes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable AWS Glue job bookmarks for the tables that the Spark jobs read and write.", fr: "Activer les signets de tâche (job bookmarks) AWS Glue pour les tables que les tâches Spark lisent et écrivent." } }
    - { id: b, text: { en: "Select Import data lineage on the project's Amazon Redshift data source.", fr: "Sélectionner Import data lineage sur la source de données Amazon Redshift du projet." } }
    - { id: c, text: { en: "Write Spark event logs to Amazon S3, and review the job runs in the Spark history server.", fr: "Écrire les journaux d'événements Spark dans Amazon S3, puis examiner les exécutions dans le serveur d'historique Spark." } }
    - { id: d, text: { en: "Configure the jobs with the OpenLineage Spark listener and the amazon_datazone_api transport for the domain.", fr: "Configurer les tâches avec l'écouteur Spark OpenLineage et le transport amazon_datazone_api pour le domaine." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Lineage from EMR Spark is not captured by default: the job must register io.openlineage.spark.agent.OpenLineageSparkListener in spark.extraListeners and set the transport type to amazon_datazone_api with the domain ID, which sends events to the PostLineageEvent API. EMR Serverless 7.5 and later is supported, and column-level lineage is turned on with spark.openlineage.columnLineage.datasetLineageEnabled."
    fr: "Le lignage d'EMR Spark n'est pas capturé par défaut : la tâche doit enregistrer io.openlineage.spark.agent.OpenLineageSparkListener dans spark.extraListeners et définir le type de transport amazon_datazone_api avec l'ID du domaine, ce qui envoie les événements à l'API PostLineageEvent. EMR Serverless 7.5 et versions ultérieures est pris en charge, et le lignage au niveau des colonnes s'active avec spark.openlineage.columnLineage.datasetLineageEnabled."
  options:
    a:
      en: "Job bookmarks track which data a Glue job has already processed; they do not apply to EMR jobs and do not produce lineage."
      fr: "Les signets de tâche suivent les données qu'une tâche Glue a déjà traitées ; ils ne s'appliquent pas aux tâches EMR et ne produisent pas de lignage."
    b:
      en: "Import data lineage on a Redshift data source derives lineage from Redshift queries only, not from Spark jobs on EMR."
      fr: "Import data lineage sur une source Redshift déduit le lignage des requêtes Redshift uniquement, pas des tâches Spark sur EMR."
    c:
      en: "Spark event logs help debug job performance, but they are not sent to the catalog as lineage events."
      fr: "Les journaux d'événements Spark aident à déboguer les performances des tâches, mais ils ne sont pas envoyés au catalogue comme événements de lignage."
references:
  - title: Automate lineage capture from tools
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/datazone-data-lineage-automate-capture-from-tools.html
