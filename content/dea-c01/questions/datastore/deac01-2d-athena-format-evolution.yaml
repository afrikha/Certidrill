id: deac01-2d-athena-format-evolution
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company exports daily files from a subscription system to Amazon S3 and queries them with Amazon Athena. The upstream team announces that future exports will insert new columns in the middle of the record layout and will remove obsolete columns. Queries must keep returning correct results across old and new files without rewriting historical data. Columns will not be renamed.

    Which file format should the company use for the exports?
  fr: |
    Une entreprise de médias exporte chaque jour des fichiers d'un système d'abonnements vers Amazon S3 et les interroge avec Amazon Athena. L'équipe amont annonce que les prochains exports inséreront de nouvelles colonnes au milieu de la structure des enregistrements et supprimeront des colonnes obsolètes. Les requêtes doivent continuer à renvoyer des résultats corrects sur les anciens et les nouveaux fichiers sans réécrire les données historiques. Aucune colonne ne sera renommée.

    Quel format de fichier l'entreprise doit-elle utiliser pour les exports ?
body:
  options:
    - { id: a, text: { en: "CSV files with a header row, compressed with gzip", fr: "Des fichiers CSV avec une ligne d'en-tête, compressés avec gzip" } }
    - { id: b, text: { en: "Apache Parquet files read with the default column access by name", fr: "Des fichiers Apache Parquet lus avec l'accès par défaut aux colonnes par nom" } }
    - { id: c, text: { en: "Apache ORC files read with the default column access by index", fr: "Des fichiers Apache ORC lus avec l'accès par défaut aux colonnes par index" } }
    - { id: d, text: { en: "Apache Parquet files with parquet.column.index.access set to true", fr: "Des fichiers Apache Parquet avec parquet.column.index.access défini sur true" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Athena applies the schema at read time. Parquet maps columns by name by default, so columns can be added anywhere, removed or reordered without breaking queries on older files; only renaming is unsupported in this mode, and the scenario rules it out."
    fr: "Athena applique le schéma à la lecture. Parquet associe par défaut les colonnes par nom : on peut ajouter des colonnes n'importe où, en supprimer ou les réordonner sans casser les requêtes sur les anciens fichiers ; seul le renommage n'est pas pris en charge dans ce mode, et le scénario l'exclut."
  options:
    a:
      en: "CSV columns are mapped by position, so inserting a column in the middle or removing one shifts the values of the following columns."
      fr: "Les colonnes CSV sont associées par position : insérer une colonne au milieu ou en supprimer une décale les valeurs des colonnes suivantes."
    c:
      en: "ORC reads by index by default, which supports renaming and adding columns at the end, but not inserting or removing columns."
      fr: "ORC lit par index par défaut, ce qui permet de renommer et d'ajouter des colonnes à la fin, mais pas d'insérer ou de supprimer des colonnes."
    d:
      en: "Reading Parquet by index has the same limits as ORC by index: inserted or removed columns break the positional mapping."
      fr: "Lire Parquet par index présente les mêmes limites qu'ORC par index : les colonnes insérées ou supprimées cassent l'association par position."
references:
  - title: Handle schema updates
    url: https://docs.aws.amazon.com/athena/latest/ug/handling-schema-updates-chapter.html
