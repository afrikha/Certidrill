id: deac01-2a-iceberg-glue-compaction
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A streaming application commits small batches every minute to Apache Iceberg tables in Amazon S3 that are registered in the AWS Glue Data Catalog. Amazon Athena queries on these tables are getting slower because each partition now contains thousands of small data files. The company wants the small files to be combined automatically, without scheduling jobs or writing code.

    Which solution will meet these requirements?
  fr: |
    Une application de streaming valide chaque minute de petits lots dans des tables Apache Iceberg d'Amazon S3 enregistrées dans l'AWS Glue Data Catalog. Les requêtes Amazon Athena sur ces tables ralentissent, car chaque partition contient désormais des milliers de petits fichiers de données. L'entreprise veut que les petits fichiers soient combinés automatiquement, sans planifier de tâches ni écrire de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable the compaction optimizer on each table in the AWS Glue Data Catalog.", fr: "Activer l'optimiseur de compactage sur chaque table dans l'AWS Glue Data Catalog." } }
    - { id: b, text: { en: "Create an EventBridge Scheduler schedule that runs a Lambda function that starts Athena OPTIMIZE statements every hour.", fr: "Créer une planification EventBridge Scheduler qui exécute une fonction Lambda lançant des instructions Athena OPTIMIZE toutes les heures." } }
    - { id: c, text: { en: "Run an AWS Glue crawler on the table locations every hour to update the table metadata.", fr: "Exécuter toutes les heures un robot d'analyse AWS Glue sur les emplacements des tables pour mettre à jour leurs métadonnées." } }
    - { id: d, text: { en: "Move the table data to the S3 Intelligent-Tiering storage class with an S3 Lifecycle rule.", fr: "Déplacer les données des tables vers la classe de stockage S3 Intelligent-Tiering avec une règle S3 Lifecycle." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Glue Data Catalog provides table optimizers for Iceberg tables: compaction merges small data files into larger ones and can run automatically, with binpack, sort or Z-order strategies. Enabling it per table, or at the catalog level, needs no schedule or code and reduces the data that Athena scans."
    fr: "L'AWS Glue Data Catalog fournit des optimiseurs de table pour les tables Iceberg : le compactage fusionne les petits fichiers de données en fichiers plus grands et peut s'exécuter automatiquement, avec les stratégies binpack, sort ou Z-order. L'activer par table, ou au niveau du catalogue, ne demande ni planification ni code et réduit les données analysées par Athena."
  options:
    b:
      en: "OPTIMIZE compacts the files, but the schedule and the function are jobs and code that the company does not want to maintain."
      fr: "OPTIMIZE compacte les fichiers, mais la planification et la fonction sont des tâches et du code que l'entreprise ne veut pas maintenir."
    c:
      en: "A crawler updates schemas and metadata in the Data Catalog; it does not rewrite or combine data files."
      fr: "Un robot d'analyse met à jour les schémas et métadonnées du Data Catalog ; il ne réécrit ni ne combine les fichiers de données."
    d:
      en: "A storage class changes the storage price of objects; the number and size of files stay the same."
      fr: "Une classe de stockage change le prix de stockage des objets ; le nombre et la taille des fichiers restent identiques."
references:
  - title: Optimizing Iceberg tables
    url: https://docs.aws.amazon.com/glue/latest/dg/table-optimizers.html
