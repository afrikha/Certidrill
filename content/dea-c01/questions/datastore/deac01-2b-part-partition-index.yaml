id: deac01-2b-part-partition-index
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue Data Catalog table is partitioned by country, category and dt, and it has more than 1 million partitions that a crawler keeps up to date. Amazon EMR jobs and Amazon Athena both query the table, and most queries filter on country and a range of dt values. Query planning is slow because every query loads all the partitions before filtering them. The partitions must stay registered in the Data Catalog.

    Which solution will meet these requirements?
  fr: |
    Une table AWS Glue Data Catalog est partitionnée par country, category et dt, et elle compte plus de 1 million de partitions qu'un robot d'analyse (crawler) maintient à jour. Des tâches Amazon EMR et Amazon Athena interrogent toutes deux la table, et la plupart des requêtes filtrent sur country et sur une plage de valeurs dt. La planification des requêtes est lente, car chaque requête charge toutes les partitions avant de les filtrer. Les partitions doivent rester enregistrées dans le Data Catalog.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a partition index on category and dt, and set the partition_filtering.enabled table property to true for Athena.", fr: "Créer un index de partition sur category et dt, et définir la propriété de table partition_filtering.enabled sur true pour Athena." } }
    - { id: b, text: { en: "Enable partition projection with country of type enum and dt of type date, and stop the crawler that registers partitions.", fr: "Activer la projection de partitions avec country de type enum et dt de type date, et arrêter le robot d'analyse qui enregistre les partitions." } }
    - { id: c, text: { en: "Create a partition index on country and dt, and set the partition_filtering.enabled table property to true for Athena.", fr: "Créer un index de partition sur country et dt, et définir la propriété de table partition_filtering.enabled sur true pour Athena." } }
    - { id: d, text: { en: "Run MSCK REPAIR TABLE before each query so that only the partitions that match the filter are loaded.", fr: "Exécuter MSCK REPAIR TABLE avant chaque requête afin que seules les partitions qui correspondent au filtre soient chargées." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A partition index lets GetPartitions fetch only the partitions that match the filter instead of loading all of them. Amazon EMR uses an ACTIVE index automatically, while Athena uses it once partition_filtering.enabled is set to true. The first key of the index must appear in the filter, which country does."
    fr: "Un index de partition permet à GetPartitions de ne récupérer que les partitions qui correspondent au filtre au lieu de les charger toutes. Amazon EMR utilise automatiquement un index ACTIVE, tandis qu'Athena l'utilise une fois partition_filtering.enabled défini sur true. La première clé de l'index doit figurer dans le filtre, ce qui est le cas de country."
  options:
    a:
      en: "Queries filter on country and dt, not on category, so an index whose first key is category is not used and all partitions are still loaded."
      fr: "Les requêtes filtrent sur country et dt, pas sur category : un index dont la première clé est category n'est pas utilisé et toutes les partitions sont toujours chargées."
    b:
      en: "Projection is used only by Athena; EMR still needs registered partitions, which the requirements keep in the Data Catalog."
      fr: "La projection n'est utilisée que par Athena ; EMR a toujours besoin de partitions enregistrées, que les exigences conservent dans le Data Catalog."
    d:
      en: "MSCK REPAIR TABLE only adds missing partitions to the metadata; it does not filter which partitions a query loads."
      fr: "MSCK REPAIR TABLE ne fait qu'ajouter les partitions manquantes aux métadonnées ; il ne filtre pas les partitions chargées par une requête."
references:
  - title: Creating partition indexes
    url: https://docs.aws.amazon.com/glue/latest/dg/partition-indexes.html
