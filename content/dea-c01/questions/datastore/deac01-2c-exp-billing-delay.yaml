id: deac01-2c-exp-billing-delay
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer adds an S3 Lifecycle rule that expires objects under the tmp/ prefix of a bucket without versioning 1 day after creation. The next day, the engineer still sees objects in the listing whose expiration date has passed. The finance team asks whether the company still pays for storing these objects.

    Which statement is correct?
  fr: |
    Un ingénieur des données ajoute une règle S3 Lifecycle qui fait expirer les objets du préfixe tmp/ d'un compartiment sans gestion des versions 1 jour après leur création. Le lendemain, l'ingénieur voit toujours dans la liste des objets dont la date d'expiration est passée. L'équipe financière demande si l'entreprise paie toujours le stockage de ces objets.

    Quelle affirmation est correcte ?
body:
  options:
    - id: a
      text: { en: "The rule failed, so the engineer must delete the objects manually to stop the storage charges.", fr: "La règle a échoué : l'ingénieur doit supprimer les objets manuellement pour arrêter les frais de stockage." }
    - id: b
      text: { en: "The rule applies only to objects created after it was added, so the older objects are billed until they are deleted.", fr: "La règle ne s'applique qu'aux objets créés après son ajout : les objets plus anciens sont facturés jusqu'à leur suppression." }
    - id: c
      text: { en: "S3 removes expired objects asynchronously, and the company is not charged for storing objects after they have expired.", fr: "S3 supprime les objets expirés de façon asynchrone, et l'entreprise n'est pas facturée pour le stockage des objets après leur expiration." }
    - id: d
      text: { en: "S3 removes the objects only after the 30-day minimum storage duration of S3 Standard, and bills them until then.", fr: "S3 ne supprime les objets qu'après la durée de stockage minimale de 30 jours de S3 Standard, et les facture jusque-là." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      S3 queues expired objects and removes them asynchronously, so there can be a delay between the expiration date and the removal. The company is not charged for the storage time of objects that have expired, even while they still appear in the listing.
    fr: |
      S3 met les objets expirés en file d'attente et les supprime de façon asynchrone : il peut donc y avoir un délai entre la date d'expiration et la suppression. L'entreprise n'est pas facturée pour la durée de stockage des objets expirés, même s'ils apparaissent encore dans la liste.
  options:
    a: { en: "A delay before removal is expected behavior, not a failure, and the expired objects are not billed in the meantime.", fr: "Un délai avant la suppression est un comportement normal, pas un échec, et les objets expirés ne sont pas facturés entre-temps." }
    b: { en: "Lifecycle rules apply to existing objects as well as to new ones.", fr: "Les règles de cycle de vie s'appliquent aux objets existants comme aux nouveaux." }
    d: { en: "S3 Standard has no minimum storage duration; the 30-day minimum applies to S3 Standard-IA and S3 One Zone-IA.", fr: "S3 Standard n'a pas de durée de stockage minimale ; le minimum de 30 jours s'applique à S3 Standard-IA et S3 One Zone-IA." }
references:
  - title: Expiring objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-expire-general-considerations.html
