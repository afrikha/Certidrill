id: deac01-2c-ttl-restore-reconfigure
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company restored its Amazon DynamoDB orders table to a new table by using point-in-time recovery, and the application now uses the new table. On the source table, TTL deleted items after the time stored in their expiresAt attribute, a Number in epoch seconds. Weeks later, expired items are still present in the new table, although every item still has its expiresAt value.

    What should a data engineer do to resolve the issue?
  fr: |
    Une entreprise a restauré sa table de commandes Amazon DynamoDB dans une nouvelle table à l'aide de la récupération à un instant dans le passé (point-in-time recovery), et l'application utilise désormais la nouvelle table. Sur la table source, la durée de vie (TTL) supprimait les éléments après l'heure stockée dans leur attribut expiresAt, un Number en secondes epoch. Des semaines plus tard, des éléments expirés sont toujours présents dans la nouvelle table, bien que chaque élément ait toujours sa valeur expiresAt.

    Que doit faire un ingénieur des données pour résoudre le problème ?
body:
  options:
    - id: a
      text: { en: "Enable TTL on the restored table, and specify expiresAt as the TTL attribute.", fr: "Activer la durée de vie (TTL) sur la table restaurée, et indiquer expiresAt comme attribut TTL." }
    - id: b
      text: { en: "Enable DynamoDB Streams on the restored table so that TTL can record its deletions.", fr: "Activer DynamoDB Streams sur la table restaurée afin que TTL puisse enregistrer ses suppressions." }
    - id: c
      text: { en: "Rewrite the expiresAt attribute of every item as a String in ISO 8601 format.", fr: "Réécrire l'attribut expiresAt de chaque élément sous forme de String au format ISO 8601." }
    - id: d
      text: { en: "Switch the restored table to on-demand capacity so that TTL has write capacity for its deletions.", fr: "Passer la table restaurée en capacité à la demande afin que TTL dispose de capacité d'écriture pour ses suppressions." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      TTL settings are not carried over to a restored table: TTL must be configured again on it. Once TTL is enabled with the expiresAt attribute, which takes about an hour to apply across partitions, DynamoDB deletes the expired items again.
    fr: |
      Les paramètres TTL ne sont pas reportés sur une table restaurée : TTL doit y être configuré de nouveau. Une fois TTL activé avec l'attribut expiresAt, ce qui prend environ une heure sur toutes les partitions, DynamoDB supprime de nouveau les éléments expirés.
  options:
    b: { en: "TTL does not need a stream; streams only expose the deletions that TTL makes.", fr: "TTL n'a pas besoin de flux ; les flux exposent seulement les suppressions que fait TTL." }
    c: { en: "The TTL attribute must be a Number in epoch seconds; DynamoDB ignores items whose TTL attribute is a String.", fr: "L'attribut TTL doit être un Number en secondes epoch ; DynamoDB ignore les éléments dont l'attribut TTL est une String." }
    d: { en: "TTL deletions do not consume write capacity, so the capacity mode is not the cause.", fr: "Les suppressions TTL ne consomment pas de capacité d'écriture : le mode de capacité n'est pas en cause." }
references:
  - title: Enable time to live (TTL) in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/time-to-live-ttl-how-to.html
  - title: Using time to live (TTL) in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
