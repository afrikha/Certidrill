id: deac01-2d-kb-s3-vectors-cost
objective: "2.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A publishing company is building an internal retrieval-augmented generation (RAG) assistant with an Amazon Bedrock knowledge base. The knowledge base will hold about 50 million chunks, and employees will send a few hundred queries each day. Sub-second query latency is acceptable. The company wants the MOST cost-effective vector store and does not want to provision or manage any infrastructure.

    Which vector store should the company choose?
  fr: |
    Une maison d'édition crée un assistant interne de génération augmentée par récupération (RAG) avec une base de connaissances Amazon Bedrock. La base de connaissances contiendra environ 50 millions de segments, et les employés enverront quelques centaines de requêtes par jour. Une latence de requête inférieure à la seconde est acceptable. L'entreprise veut le magasin de vecteurs (vector store) le plus économique et ne veut provisionner ni gérer aucune infrastructure.

    Quel magasin de vecteurs l'entreprise doit-elle choisir ?
body:
  options:
    - { id: a, text: { en: "An Amazon OpenSearch Service managed cluster on memory-optimized instances", fr: "Un cluster géré Amazon OpenSearch Service sur des instances à mémoire optimisée" } }
    - { id: b, text: { en: "A provisioned Amazon Aurora PostgreSQL cluster with the pgvector extension", fr: "Un cluster Amazon Aurora PostgreSQL provisionné avec l'extension pgvector" } }
    - { id: c, text: { en: "An Amazon S3 Vectors vector bucket with a vector index", fr: "Un compartiment vectoriel Amazon S3 Vectors avec un index vectoriel" } }
    - { id: d, text: { en: "An Amazon Neptune Analytics graph with a vector index", fr: "Un graphe Amazon Neptune Analytics avec un index vectoriel" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon S3 Vectors stores and queries embeddings in vector buckets without any infrastructure to provision, and you pay only for what you use. It is designed for workloads with less frequent queries and gives sub-second latency, and a vector index can be selected directly as the vector store of a Bedrock knowledge base."
    fr: "Amazon S3 Vectors stocke et interroge des embeddings dans des compartiments vectoriels sans infrastructure à provisionner, et seule l'utilisation réelle est facturée. Il est conçu pour des charges de travail aux requêtes moins fréquentes, avec une latence inférieure à la seconde, et un index vectoriel peut être sélectionné directement comme magasin de vecteurs d'une base de connaissances Bedrock."
  options:
    a:
      en: "A managed cluster requires choosing and running instances that are paid for continuously, which is costlier and needs more management."
      fr: "Un cluster géré exige de choisir et d'exploiter des instances payées en continu, ce qui coûte plus cher et demande plus de gestion."
    b:
      en: "A provisioned Aurora cluster bills its instances around the clock and must be sized and managed by the company."
      fr: "Un cluster Aurora provisionné facture ses instances en permanence et doit être dimensionné et géré par l'entreprise."
    d:
      en: "Neptune Analytics targets GraphRAG over a graph that the company must size; it is not the lowest-cost store for plain vector retrieval."
      fr: "Neptune Analytics vise le GraphRAG sur un graphe que l'entreprise doit dimensionner ; ce n'est pas le magasin le moins coûteux pour une simple récupération vectorielle."
references:
  - title: Working with S3 Vectors and vector buckets
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html
