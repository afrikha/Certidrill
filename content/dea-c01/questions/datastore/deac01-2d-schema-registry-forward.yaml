id: deac01-2d-schema-registry-forward
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company publishes Avro records to Amazon Kinesis Data Streams. Producers and consumers use the AWS Glue Schema Registry. The producer team always registers and deploys a new schema version before the consumer team updates its applications. Consumers that still use the previous schema version must be able to read records written with the new version. Each new version needs to be checked only against the version registered just before it.

    Which compatibility mode should the company set on the schema?
  fr: |
    Une entreprise de paiement publie des enregistrements Avro dans Amazon Kinesis Data Streams. Les producteurs et les consommateurs utilisent AWS Glue Schema Registry. L'équipe des producteurs enregistre et déploie toujours une nouvelle version de schéma avant que l'équipe des consommateurs ne mette à jour ses applications. Les consommateurs qui utilisent encore la version précédente du schéma doivent pouvoir lire les enregistrements écrits avec la nouvelle version. Chaque nouvelle version doit être vérifiée uniquement par rapport à la version enregistrée juste avant elle.

    Quel mode de compatibilité l'entreprise doit-elle définir sur le schéma ?
body:
  options:
    - { id: a, text: BACKWARD }
    - { id: b, text: NONE }
    - { id: c, text: BACKWARD_ALL }
    - { id: d, text: FORWARD }
answer: { optionId: d }
explanation:
  correct:
    en: "FORWARD compatibility lets consumers read data written with the current version and the next one, so consumers on the previous version can read records from upgraded producers. It checks each new version against the last version only, which matches the stated scope."
    fr: "La compatibilité FORWARD permet aux consommateurs de lire les données écrites avec la version actuelle et la suivante : les consommateurs restés sur la version précédente peuvent lire les enregistrements des producteurs mis à niveau. Elle vérifie chaque nouvelle version uniquement par rapport à la dernière version, ce qui correspond à la portée demandée."
  options:
    a:
      en: "BACKWARD guarantees that consumers using the new version can read data written with the previous version, which is the opposite upgrade order."
      fr: "BACKWARD garantit que les consommateurs utilisant la nouvelle version peuvent lire les données écrites avec la version précédente, ce qui correspond à l'ordre de mise à niveau inverse."
    b:
      en: "NONE accepts any new version without a compatibility check, so nothing guarantees that old consumers can read the new records."
      fr: "NONE accepte toute nouvelle version sans vérification de compatibilité : rien ne garantit que les anciens consommateurs pourront lire les nouveaux enregistrements."
    c:
      en: "BACKWARD_ALL checks against all previous versions and protects new consumers reading old data, not old consumers reading new data."
      fr: "BACKWARD_ALL vérifie par rapport à toutes les versions précédentes et protège les nouveaux consommateurs qui lisent d'anciennes données, pas les anciens consommateurs qui lisent de nouvelles données."
references:
  - title: AWS Glue Schema registry
    url: https://docs.aws.amazon.com/glue/latest/dg/schema-registry.html
