id: deac01-2b-conn-self-referencing-sg
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer creates an AWS Glue JDBC connection to an Amazon RDS for PostgreSQL DB instance in a private subnet, so that a crawler and ETL jobs can use the database as a source. The connection uses the subnet and the security group of the DB instance. AWS Glue reports that the security group does not allow its components to communicate. The VPC must not be opened to other networks.

    Which change will resolve the issue?
  fr: |
    Un ingénieur de données crée une connexion JDBC AWS Glue vers une instance de base de données Amazon RDS for PostgreSQL située dans un sous-réseau privé, afin qu'un robot d'analyse (crawler) et des tâches ETL puissent utiliser la base de données comme source. La connexion utilise le sous-réseau et le groupe de sécurité de l'instance. AWS Glue signale que le groupe de sécurité ne permet pas à ses composants de communiquer. Le VPC ne doit pas être ouvert à d'autres réseaux.

    Quelle modification résout le problème ?
body:
  options:
    - { id: a, text: { en: "Add an inbound rule that allows TCP port 5432 from 0.0.0.0/0 to the security group.", fr: "Ajouter au groupe de sécurité une règle entrante qui autorise le port TCP 5432 depuis 0.0.0.0/0." } }
    - { id: b, text: { en: "Move the connection to a public subnet with a route to an internet gateway.", fr: "Déplacer la connexion vers un sous-réseau public doté d'un itinéraire vers une passerelle Internet." } }
    - { id: c, text: { en: "Add an inbound rule for all TCP ports whose source is the security group itself.", fr: "Ajouter une règle entrante pour tous les ports TCP dont la source est le groupe de sécurité lui-même." } }
    - { id: d, text: { en: "Add an inbound rule that allows all TCP ports from the VPC CIDR of AWS Glue.", fr: "Ajouter une règle entrante qui autorise tous les ports TCP depuis le CIDR du VPC d'AWS Glue." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Glue creates elastic network interfaces in the subnet, and its components must reach each other through them. At least one security group of the connection needs a self-referencing inbound rule for all TCP ports, which restricts the source to the same security group instead of opening the VPC to all networks."
    fr: "AWS Glue crée des interfaces réseau Elastic dans le sous-réseau, et ses composants doivent communiquer entre eux par leur intermédiaire. Au moins un groupe de sécurité de la connexion a besoin d'une règle entrante autoréférencée pour tous les ports TCP, qui limite la source au même groupe de sécurité au lieu d'ouvrir le VPC à tous les réseaux."
  options:
    a:
      en: "Opening the database port to 0.0.0.0/0 exposes it to all networks, and it does not let the Glue components communicate on all TCP ports."
      fr: "Ouvrir le port de la base de données à 0.0.0.0/0 l'expose à tous les réseaux, et ne permet pas aux composants Glue de communiquer sur tous les ports TCP."
    b:
      en: "The Glue network interfaces get only private IP addresses, so a route to an internet gateway does not work, and the security group rule would still be missing."
      fr: "Les interfaces réseau Glue n'obtiennent que des adresses IP privées : un itinéraire vers une passerelle Internet ne fonctionne pas, et la règle du groupe de sécurité manquerait toujours."
    d:
      en: "AWS Glue has no VPC CIDR of its own to allow; its network interfaces are created in your subnet with the connection's security groups."
      fr: "AWS Glue n'a pas de CIDR de VPC propre à autoriser ; ses interfaces réseau sont créées dans votre sous-réseau avec les groupes de sécurité de la connexion."
references:
  - title: Setting up Amazon VPC for JDBC connections to Amazon RDS data stores from AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/setup-vpc-for-glue-access.html
