id: deac01-2a-glue-iceberg-job-config
objective: "2.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A data engineer writes an AWS Glue 5.0 Spark job that creates and appends to Apache Iceberg tables registered in the AWS Glue Data Catalog. The job must use the Iceberg version that AWS Glue provides. The script contains the following code, and the first run fails because the glue_catalog catalog is not found:

    ```python
    df.writeTo("glue_catalog.sales_db.orders") \
        .tableProperty("format-version", "2") \
        .append()
    ```

    Which combination of job settings will fix the failure? (Choose two.)
  fr: |
    Un ingénieur data écrit une tâche Spark AWS Glue 5.0 qui crée des tables Apache Iceberg enregistrées dans l'AWS Glue Data Catalog et y ajoute des données. La tâche doit utiliser la version d'Iceberg fournie par AWS Glue. Le script contient le code suivant, et la première exécution échoue, car le catalogue glue_catalog est introuvable :

    ```python
    df.writeTo("glue_catalog.sales_db.orders") \
        .tableProperty("format-version", "2") \
        .append()
    ```

    Quelle combinaison de paramètres de la tâche corrige l'échec ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the --datalake-formats job parameter to iceberg.", fr: "Définir le paramètre de tâche --datalake-formats à iceberg." } }
    - { id: b, text: { en: "Set the --job-bookmark-option job parameter to job-bookmark-enable.", fr: "Définir le paramètre de tâche --job-bookmark-option à job-bookmark-enable." } }
    - { id: c, text: { en: "Configure the DynamoDB lock manager with lock-impl and a lock table for the catalog.", fr: "Configurer le gestionnaire de verrous DynamoDB avec lock-impl et une table de verrous pour le catalogue." } }
    - { id: d, text: { en: "Set --conf with the Iceberg Spark session extensions and the glue_catalog SparkCatalog that uses GlueCatalog, S3FileIO and a warehouse path.", fr: "Définir --conf avec les extensions de session Spark Iceberg et le catalogue glue_catalog de type SparkCatalog qui utilise GlueCatalog, S3FileIO et un chemin d'entrepôt." } }
    - { id: e, text: { en: "Add the Iceberg runtime JAR with --extra-jars and set --user-jars-first to true.", fr: "Ajouter le JAR d'exécution Iceberg avec --extra-jars et définir --user-jars-first à true." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "To use the Iceberg framework that AWS Glue provides, the job sets --datalake-formats to iceberg and defines the catalog through --conf (or SparkConf): spark.sql.extensions with IcebergSparkSessionExtensions, and spark.sql.catalog.glue_catalog as a SparkCatalog with the GlueCatalog implementation, S3FileIO and a warehouse location."
    fr: "Pour utiliser le framework Iceberg fourni par AWS Glue, la tâche définit --datalake-formats à iceberg et déclare le catalogue via --conf (ou SparkConf) : spark.sql.extensions avec IcebergSparkSessionExtensions, et spark.sql.catalog.glue_catalog en tant que SparkCatalog avec l'implémentation GlueCatalog, S3FileIO et un emplacement d'entrepôt."
  options:
    b:
      en: "Job bookmarks track already processed data between runs; they do not register an Iceberg catalog."
      fr: "Les signets de tâche (job bookmarks) suivent les données déjà traitées entre les exécutions ; ils n'enregistrent pas de catalogue Iceberg."
    c:
      en: "AWS Glue 4.0 and later use optimistic locking by default; the DynamoDB lock manager was needed with AWS Glue 3.0 and does not define the catalog."
      fr: "AWS Glue 4.0 et ultérieur utilisent par défaut le verrouillage optimiste ; le gestionnaire de verrous DynamoDB était nécessaire avec AWS Glue 3.0 et ne définit pas le catalogue."
    e:
      en: "Custom JARs are for using a different Iceberg version than the one AWS Glue provides, which the requirements exclude."
      fr: "Les JAR personnalisés servent à utiliser une autre version d'Iceberg que celle fournie par AWS Glue, ce que les exigences excluent."
references:
  - title: Using the Iceberg framework in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-format-iceberg.html
