id: deac01-2b-biz-datasource-publish
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A sales data team uses Amazon SageMaker Unified Studio. A data source in the team's project imports the tables of an AWS Glue database every night. Users from other projects in the domain cannot find the new tables when they search Amazon SageMaker Catalog. The team wants every table that the data source imports to become discoverable by the domain users without manual steps.

    Which solution will meet these requirements?
  fr: |
    Une équipe de données commerciales utilise Amazon SageMaker Unified Studio. Une source de données du projet de l'équipe importe chaque nuit les tables d'une base de données AWS Glue. Les utilisateurs des autres projets du domaine ne trouvent pas les nouvelles tables lorsqu'ils effectuent une recherche dans Amazon SageMaker Catalog. L'équipe veut que chaque table importée par la source de données devienne détectable par les utilisateurs du domaine sans étape manuelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Grant DESCRIBE on the Glue database to all the domain users in AWS Lake Formation.", fr: "Accorder DESCRIBE sur la base de données Glue à tous les utilisateurs du domaine dans AWS Lake Formation." } }
    - { id: b, text: { en: "Set the publishing option of the data source to Yes so that its assets are published to the catalog.", fr: "Définir l'option de publication de la source de données sur Yes afin que ses ressources soient publiées dans le catalogue." } }
    - { id: c, text: { en: "Schedule an AWS Glue crawler on the S3 data so that the Glue tables are updated more often.", fr: "Planifier un robot d'analyse AWS Glue sur les données S3 afin que les tables Glue soient mises à jour plus souvent." } }
    - { id: d, text: { en: "Attach a business glossary term to each table in the inventory of the team's project.", fr: "Associer un terme de glossaire métier à chaque table de l'inventaire du projet de l'équipe." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Assets that a data source imports go to the project's inventory, which only the project's members can discover. With the publishing option set to Yes, each run also publishes the assets to Amazon SageMaker Catalog, where users of the domain can search and find them."
    fr: "Les ressources qu'une source de données importe sont placées dans l'inventaire du projet, que seuls les membres du projet peuvent découvrir. Avec l'option de publication définie sur Yes, chaque exécution publie aussi les ressources dans Amazon SageMaker Catalog, où les utilisateurs du domaine peuvent les rechercher et les trouver."
  options:
    a:
      en: "Lake Formation permissions control access to the Glue resources; they do not publish assets to the business catalog."
      fr: "Les autorisations Lake Formation contrôlent l'accès aux ressources Glue ; elles ne publient pas de ressources dans le catalogue métier."
    c:
      en: "The data source already imports the tables; the problem is that the assets stay in the inventory and are never published."
      fr: "La source de données importe déjà les tables ; le problème est que les ressources restent dans l'inventaire et ne sont jamais publiées."
    d:
      en: "Glossary terms enrich the metadata, but inventory assets stay visible only to the project's members until they are published."
      fr: "Les termes de glossaire enrichissent les métadonnées, mais les ressources de l'inventaire restent visibles uniquement par les membres du projet tant qu'elles ne sont pas publiées."
references:
  - title: Create a data source in the project catalog
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/create-data-source.html
