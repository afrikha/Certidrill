id: deac01-2b-biz-glossary-terms
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Business users of a retailer search Amazon SageMaker Catalog for data about active customers, but different teams describe the same idea with different words. A governance team wants one centrally managed definition of terms such as Active customer and Net revenue, and wants data owners to attach these terms to the tables and columns they publish.

    Which solution will meet these requirements?
  fr: |
    Les utilisateurs métier d'un distributeur recherchent dans Amazon SageMaker Catalog des données sur les clients actifs, mais différentes équipes décrivent la même notion avec des mots différents. Une équipe de gouvernance veut une définition gérée de manière centralisée de termes tels que Client actif et Chiffre d'affaires net, et veut que les propriétaires de données associent ces termes aux tables et colonnes qu'ils publient.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a business glossary with these terms in a governance project, and have data owners attach the terms during curation.", fr: "Créer un glossaire métier avec ces termes dans un projet de gouvernance, et faire associer les termes par les propriétaires de données lors de la curation." } }
    - { id: b, text: { en: "Add table properties with these terms to each AWS Glue table, and ask the users to search the properties.", fr: "Ajouter des propriétés de table avec ces termes à chaque table AWS Glue, et demander aux utilisateurs de rechercher dans ces propriétés." } }
    - { id: c, text: { en: "Register an Avro schema for each term in the AWS Glue Schema Registry, and link the schemas to the tables.", fr: "Enregistrer un schéma Avro pour chaque terme dans AWS Glue Schema Registry, et lier les schémas aux tables." } }
    - { id: d, text: { en: "Tag each S3 bucket with the terms, and grant access to the tables through Lake Formation tag expressions.", fr: "Baliser chaque compartiment S3 avec les termes, et accorder l'accès aux tables au moyen d'expressions de LF-tags Lake Formation." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A business glossary is a centralized collection of business terms and their definitions. It is owned and edited by the project that creates it but visible to the whole domain, and data owners attach its terms to assets and columns during metadata curation."
    fr: "Un glossaire métier est un ensemble centralisé de termes métier et de leurs définitions. Il appartient au projet qui le crée, qui seul peut le modifier, mais il est visible dans tout le domaine, et les propriétaires de données associent ses termes aux ressources et aux colonnes lors de la curation des métadonnées."
  options:
    b:
      en: "Free-form table properties are technical metadata with no shared definitions, so each team could still use different words."
      fr: "Des propriétés de table libres sont des métadonnées techniques sans définitions partagées : chaque équipe pourrait toujours utiliser des mots différents."
    c:
      en: "The Schema Registry governs the structure of stream records; it does not hold business definitions."
      fr: "Schema Registry gouverne la structure des enregistrements de flux ; il ne contient pas de définitions métier."
    d:
      en: "Tags and LF-tags organize resources and permissions; they do not provide a catalog of business definitions."
      fr: "Les balises et les LF-tags organisent les ressources et les autorisations ; elles ne fournissent pas de catalogue de définitions métier."
references:
  - title: Data governance and metadata
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/data-governance.html
  - title: Create and manage business glossaries
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/manage-business-glossaries.html
