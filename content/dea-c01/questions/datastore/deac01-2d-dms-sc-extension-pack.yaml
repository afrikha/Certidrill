id: deac01-2d-dms-sc-extension-pack
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company converted an Oracle schema to Amazon Aurora PostgreSQL-Compatible Edition with DMS Schema Conversion. The team exported the converted code as SQL scripts and ran only the scripts for tables, views and procedures on the target. Several converted procedures now fail because they call functions in a schema named aws_oracle_ext that does not exist on the target. The procedures must behave like the Oracle originals without being rewritten.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a converti un schéma Oracle pour Amazon Aurora PostgreSQL-Compatible Edition avec DMS Schema Conversion. L'équipe a exporté le code converti sous forme de scripts SQL et n'a exécuté sur la cible que les scripts des tables, vues et procédures. Plusieurs procédures converties échouent désormais car elles appellent des fonctions d'un schéma nommé aws_oracle_ext qui n'existe pas sur la cible. Les procédures doivent se comporter comme les originaux Oracle sans être réécrites.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Recreate the target as Babelfish for Aurora PostgreSQL so that it understands the Oracle functions.", fr: "Recréer la cible avec Babelfish for Aurora PostgreSQL afin qu'elle comprenne les fonctions Oracle." } }
    - { id: b, text: { en: "Add an AWS DMS transformation rule that renames the aws_oracle_ext schema to public.", fr: "Ajouter une règle de transformation AWS DMS qui renomme le schéma aws_oracle_ext en public." } }
    - { id: c, text: { en: "Generate a new assessment report in the migration project and resolve the action items it lists.", fr: "Générer un nouveau rapport d'évaluation dans le projet de migration et résoudre les éléments d'action qu'il liste." } }
    - { id: d, text: { en: "Apply the extension pack from the DMS Schema Conversion migration project to the target database.", fr: "Appliquer le pack d'extension (extension pack) depuis le projet de migration DMS Schema Conversion sur la base cible." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An extension pack is a schema of SQL functions, procedures, tables and views that emulates source functions the target lacks; for Oracle it is named aws_oracle_ext. DMS Schema Conversion applies it automatically before other objects when it applies converted code, and it can be applied manually with Apply extension pack when the code was deployed another way."
    fr: "Un pack d'extension est un schéma de fonctions, procédures, tables et vues SQL qui émule les fonctions source absentes de la cible ; pour Oracle, il s'appelle aws_oracle_ext. DMS Schema Conversion l'applique automatiquement avant les autres objets lorsqu'il applique le code converti, et on peut l'appliquer manuellement avec Apply extension pack quand le code a été déployé autrement."
  options:
    a:
      en: "Babelfish adds compatibility with Microsoft SQL Server T-SQL, not with Oracle functions."
      fr: "Babelfish ajoute la compatibilité avec le T-SQL de Microsoft SQL Server, pas avec les fonctions Oracle."
    b:
      en: "Renaming a schema does not create the missing emulation functions; the calls would still fail."
      fr: "Renommer un schéma ne crée pas les fonctions d'émulation manquantes : les appels échoueraient toujours."
    c:
      en: "An assessment report describes conversion issues; it does not install anything on the target, and resolving items manually means rewriting code."
      fr: "Un rapport d'évaluation décrit les problèmes de conversion ; il n'installe rien sur la cible, et résoudre les éléments manuellement revient à réécrire le code."
references:
  - title: Using extension packs in DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/extension-pack.html
