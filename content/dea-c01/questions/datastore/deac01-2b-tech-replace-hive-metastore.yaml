id: deac01-2b-tech-replace-hive-metastore
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs several transient Amazon EMR clusters with Apache Hive and Apache Spark. The clusters share a self-managed Apache Hive metastore whose database runs on an Amazon RDS for MySQL instance that the team patches, scales and backs up. The company wants to stop managing the metastore database and also make the same table definitions available to Amazon Athena.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute plusieurs clusters Amazon EMR éphémères avec Apache Hive et Apache Spark. Les clusters partagent un metastore Apache Hive autogéré dont la base de données s'exécute sur une instance Amazon RDS for MySQL que l'équipe corrige, met à l'échelle et sauvegarde. L'entreprise veut cesser de gérer la base de données du metastore et rendre aussi les mêmes définitions de tables disponibles pour Amazon Athena.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Convert the RDS for MySQL instance to a Multi-AZ deployment, and connect Athena to it with the external Hive metastore connector.", fr: "Convertir l'instance RDS for MySQL en déploiement Multi-AZ, et y connecter Athena avec le connecteur de metastore Hive externe." } }
    - { id: b, text: { en: "Run a long-running EMR cluster that hosts the Hive metastore service, and point the transient clusters and Athena to it.", fr: "Exécuter un cluster EMR permanent qui héberge le service de metastore Hive, et y faire pointer les clusters éphémères et Athena." } }
    - { id: c, text: { en: "Move the metastore database to Amazon Aurora MySQL, and schedule an AWS Glue crawler on the Aurora database every hour.", fr: "Déplacer la base de données du metastore vers Amazon Aurora MySQL, et planifier un robot d'analyse AWS Glue sur la base Aurora toutes les heures." } }
    - { id: d, text: { en: "Migrate the metadata to the AWS Glue Data Catalog, and configure the EMR clusters to use the Data Catalog as their metastore.", fr: "Migrer les métadonnées vers l'AWS Glue Data Catalog, et configurer les clusters EMR pour qu'ils utilisent le Data Catalog comme metastore." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The AWS Glue Data Catalog is a managed, Hive-compatible metastore: EMR clusters use it through the spark-hive-site and hive-site classifications, and Athena uses it natively. There is no metastore database left to patch, scale or back up."
    fr: "L'AWS Glue Data Catalog est un metastore géré compatible avec Hive : les clusters EMR l'utilisent au moyen des classifications spark-hive-site et hive-site, et Athena l'utilise nativement. Il ne reste aucune base de données de metastore à corriger, mettre à l'échelle ou sauvegarder."
  options:
    a:
      en: "Multi-AZ improves availability but the team still manages the metastore database, plus a connector for Athena."
      fr: "Multi-AZ améliore la disponibilité, mais l'équipe gère toujours la base de données du metastore, ainsi qu'un connecteur pour Athena."
    b:
      en: "A permanent cluster replaces one component to manage with another and still needs a backing database for the metastore."
      fr: "Un cluster permanent remplace un composant à gérer par un autre et nécessite toujours une base de données pour le metastore."
    c:
      en: "Crawling the metastore database catalogs its internal tables, not the Hive tables, and the team still manages a database."
      fr: "Analyser la base de données du metastore catalogue ses tables internes, pas les tables Hive, et l'équipe gère toujours une base de données."
references:
  - title: Use AWS Glue Data Catalog with Spark on Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-spark-glue.html
