id: deac01-2a-redshift-distkey-join
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's Amazon Redshift cluster has a sales table with 4 billion rows and a customers table with 300 million rows that is updated every hour. Both tables use EVEN distribution. The most frequent dashboard query joins the two tables on customer_id, and EXPLAIN shows a DS_DIST_BOTH step that moves large amounts of data between nodes.

    Which change will reduce the data movement for this join?
  fr: |
    Le cluster Amazon Redshift d'une entreprise contient une table sales de 4 milliards de lignes et une table customers de 300 millions de lignes mise à jour toutes les heures. Les deux tables utilisent la distribution EVEN. La requête de tableau de bord la plus fréquente joint les deux tables sur customer_id, et EXPLAIN montre une étape DS_DIST_BOTH qui déplace de gros volumes de données entre les nœuds.

    Quelle modification réduit le déplacement de données pour cette jointure ?
body:
  options:
    - { id: a, text: { en: "Recreate both tables with DISTKEY (customer_id) and reload them with a deep copy.", fr: "Recréer les deux tables avec DISTKEY (customer_id) et les recharger par une copie complète (deep copy)." } }
    - { id: b, text: { en: "Change the customers table to DISTSTYLE ALL and keep the sales table with EVEN distribution.", fr: "Passer la table customers en DISTSTYLE ALL et garder la distribution EVEN pour la table sales." } }
    - { id: c, text: { en: "Add an interleaved sort key on customer_id to both tables and run VACUUM REINDEX.", fr: "Ajouter une clé de tri entrelacée sur customer_id aux deux tables et exécuter VACUUM REINDEX." } }
    - { id: d, text: { en: "Run VACUUM and ANALYZE on both tables after each hourly load.", fr: "Exécuter VACUUM et ANALYZE sur les deux tables après chaque chargement horaire." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With KEY distribution on the joining column of both tables, rows with the same customer_id are stored on the same slice, so the join runs locally without redistribution. When ALTER TABLE cannot change the style, the tables are recreated and repopulated with a deep copy."
    fr: "Avec une distribution KEY sur la colonne de jointure des deux tables, les lignes de même customer_id sont stockées sur la même tranche (slice) : la jointure s'exécute localement sans redistribution. Lorsque ALTER TABLE ne peut pas changer le style, on recrée les tables et on les recharge par une copie complète."
  options:
    b:
      en: "ALL copies the 300-million-row table to every node, which multiplies its storage and slows the hourly updates; ALL suits only slow-moving tables."
      fr: "ALL copie la table de 300 millions de lignes sur chaque nœud, ce qui multiplie son stockage et ralentit les mises à jour horaires ; ALL ne convient qu'aux tables qui changent peu."
    c:
      en: "A sort key helps skip blocks during scans; it does not place matching rows on the same slice, so the redistribution remains."
      fr: "Une clé de tri aide à ignorer des blocs lors des analyses ; elle ne place pas les lignes correspondantes sur la même tranche : la redistribution demeure."
    d:
      en: "VACUUM and ANALYZE reclaim space and refresh statistics; they do not change how the rows are distributed."
      fr: "VACUUM et ANALYZE récupèrent de l'espace et actualisent les statistiques ; ils ne changent pas la distribution des lignes."
references:
  - title: Distribution styles
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_choosing_dist_sort.html
