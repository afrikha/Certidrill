id: deac01-2a-redshift-federated-live
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company keeps 5 years of order history in Amazon Redshift. The orders of the current day are written to an Amazon Aurora PostgreSQL-Compatible Edition database. Analysts need one SQL query that joins today's live orders with the history, and the company does not want to build an ETL pipeline or copy the data.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conserve 5 ans d'historique de commandes dans Amazon Redshift. Les commandes du jour sont écrites dans une base de données Amazon Aurora PostgreSQL-Compatible Edition. Les analystes ont besoin d'une seule requête SQL qui joint les commandes du jour en direct à l'historique, et l'entreprise ne veut ni créer de pipeline ETL ni copier les données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replicate the Aurora tables to Redshift every night with an AWS DMS task.", fr: "Répliquer chaque nuit les tables Aurora vers Redshift avec une tâche AWS DMS." } }
    - { id: b, text: { en: "Export Aurora snapshots to Amazon S3 and query them with Redshift Spectrum.", fr: "Exporter des instantanés Aurora dans Amazon S3 et les interroger avec Redshift Spectrum." } }
    - { id: c, text: { en: "Create an external schema FROM POSTGRES in Redshift and use a federated query.", fr: "Créer dans Redshift un schéma externe FROM POSTGRES et utiliser une requête fédérée." } }
    - { id: d, text: { en: "Create a Redshift datashare on the Aurora database and consume it in Redshift.", fr: "Créer un partage de données (datashare) Redshift sur la base Aurora et le consommer dans Redshift." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Redshift federated queries read live data from Aurora PostgreSQL, RDS for PostgreSQL, Aurora MySQL and RDS for MySQL through an external schema, and can join it with Redshift tables in one query. Redshift pushes predicates down to the remote database and retrieves only the result rows, without an ETL pipeline."
    fr: "Les requêtes fédérées Redshift lisent des données en direct dans Aurora PostgreSQL, RDS for PostgreSQL, Aurora MySQL et RDS for MySQL via un schéma externe, et peuvent les joindre aux tables Redshift dans une seule requête. Redshift transmet les prédicats à la base distante et ne récupère que les lignes de résultat, sans pipeline ETL."
  options:
    a:
      en: "A nightly replication is an ETL pipeline that copies the data, and today's orders would not be live."
      fr: "Une réplication nocturne est un pipeline ETL qui copie les données, et les commandes du jour ne seraient pas en direct."
    b:
      en: "Snapshot exports copy the data to S3 and show it as of the snapshot, not live."
      fr: "Les exportations d'instantanés copient les données dans S3 et les montrent à la date de l'instantané, pas en direct."
    d:
      en: "Data sharing shares data between Redshift warehouses; an Aurora database cannot be a datashare producer."
      fr: "Le partage de données s'effectue entre entrepôts Redshift ; une base de données Aurora ne peut pas être productrice d'un datashare."
references:
  - title: Querying data with federated queries in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/federated-overview.html
