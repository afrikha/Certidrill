id: deac01-2b-vec-efsearch-recall
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer manages a retrieval pipeline that stores 2 million embeddings in an Amazon DocumentDB collection with an HNSW vector index built with m set to 16 and efConstruction set to 64. Evaluation shows that the top-10 results miss too many relevant documents. The application can accept slightly higher query latency, but the index must not be dropped or rebuilt.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur de données gère un pipeline de récupération qui stocke 2 millions de vectorisations dans une collection Amazon DocumentDB dotée d'un index vectoriel HNSW construit avec m défini à 16 et efConstruction défini à 64. L'évaluation montre que les 10 premiers résultats manquent trop de documents pertinents. L'application peut accepter une latence de requête légèrement plus élevée, mais l'index ne doit être ni supprimé ni reconstruit.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the efSearch value in the vector search queries.", fr: "Augmenter la valeur d'efSearch dans les requêtes de recherche vectorielle." } }
    - { id: b, text: { en: "Increase the m value of the index to 32.", fr: "Augmenter la valeur m de l'index à 32." } }
    - { id: c, text: { en: "Increase the probes value in the vector search queries.", fr: "Augmenter la valeur de probes dans les requêtes de recherche vectorielle." } }
    - { id: d, text: { en: "Increase the efConstruction value of the index to 256.", fr: "Augmenter la valeur efConstruction de l'index à 256." } }
answer: { optionId: a }
explanation:
  correct:
    en: "efSearch is a query-time parameter of HNSW that sets the size of the dynamic candidate list used during the search. A higher value returns better recall at the cost of speed, and it is passed with each query, so the existing index stays in place."
    fr: "efSearch est un paramètre HNSW appliqué au moment de la requête qui fixe la taille de la liste dynamique de candidats utilisée pendant la recherche. Une valeur plus élevée améliore le rappel au prix de la vitesse, et elle est passée avec chaque requête : l'index existant reste en place."
  options:
    b:
      en: "m is set when the index is built; raising it improves accuracy only through a new index build, which the requirements forbid."
      fr: "m est fixé lors de la construction de l'index ; l'augmenter n'améliore la précision qu'au moyen d'une nouvelle construction de l'index, ce que les exigences interdisent."
    c:
      en: "probes is the query parameter of IVFFlat indexes; it does not apply to an HNSW index."
      fr: "probes est le paramètre de requête des index IVFFlat ; il ne s'applique pas à un index HNSW."
    d:
      en: "efConstruction is a build parameter; a higher value requires building the index again."
      fr: "efConstruction est un paramètre de construction ; une valeur plus élevée exige de reconstruire l'index."
references:
  - title: Vector search for Amazon DocumentDB
    url: https://docs.aws.amazon.com/documentdb/latest/developerguide/vector-search.html
