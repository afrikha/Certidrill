id: deac01-2c-sch-super-json
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A mobile application sends JSON events whose structure changes often: new nested attributes are added almost every week. A data engineer must load the events into Amazon Redshift and let analysts query any attribute with SQL, including newly added ones, without altering the table for each change. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une application mobile envoie des événements JSON dont la structure change souvent : de nouveaux attributs imbriqués sont ajoutés presque chaque semaine. Un ingénieur des données doit charger les événements dans Amazon Redshift et permettre aux analystes d'interroger n'importe quel attribut en SQL, y compris les nouveaux, sans modifier la table à chaque changement. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Load the events into fixed columns with COPY and a JSONPaths file, and update the file and the table when attributes are added.", fr: "Charger les événements dans des colonnes fixes avec COPY et un fichier JSONPaths, et mettre à jour le fichier et la table quand des attributs sont ajoutés." }
    - id: b
      text: { en: "Load each event into a SUPER column, and query the attributes with PartiQL dot notation.", fr: "Charger chaque événement dans une colonne SUPER, et interroger les attributs avec la notation pointée PartiQL." }
    - id: c
      text: { en: "Create a Redshift Spectrum external table over the raw events with a struct column that describes the nested attributes.", fr: "Créer une table externe Redshift Spectrum sur les événements bruts avec une colonne struct qui décrit les attributs imbriqués." }
    - id: d
      text: { en: "Load the events with COPY and the JSON 'auto' option, which maps the new attributes to columns automatically.", fr: "Charger les événements avec COPY et l'option JSON 'auto', qui associe automatiquement les nouveaux attributs à des colonnes." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The SUPER data type stores schemaless semi-structured data next to regular columns, so new attributes need no schema change. Analysts navigate the nested values with PartiQL, and frequently used attributes can later be shredded into a materialized view for faster queries.
    fr: |
      Le type de données SUPER stocke des données semi-structurées sans schéma à côté des colonnes classiques : les nouveaux attributs n'exigent aucun changement de schéma. Les analystes parcourent les valeurs imbriquées avec PartiQL, et les attributs souvent utilisés peuvent ensuite être extraits dans une vue matérialisée pour accélérer les requêtes.
  options:
    a: { en: "Every new attribute requires changing the JSONPaths file and altering the table, which is the weekly work the company wants to avoid.", fr: "Chaque nouvel attribut exige de modifier le fichier JSONPaths et la table, ce qui est le travail hebdomadaire que l'entreprise veut éviter." }
    c: { en: "Redshift Spectrum supports nested data only with a declared schema, so the table definition must change with each new attribute.", fr: "Redshift Spectrum ne prend en charge les données imbriquées qu'avec un schéma déclaré : la définition de la table doit changer à chaque nouvel attribut." }
    d: { en: "JSON 'auto' maps attributes to existing columns with matching names; attributes without a column are not loaded.", fr: "JSON 'auto' associe les attributs aux colonnes existantes de même nom ; les attributs sans colonne ne sont pas chargés." }
references:
  - title: Semi-structured data in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/super-overview.html
