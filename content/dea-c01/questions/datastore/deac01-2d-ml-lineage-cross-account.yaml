id: deac01-2d-ml-lineage-cross-account
objective: "2.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company trains models with Amazon SageMaker AI in a training account and deploys them to endpoints in a separate production account. The governance team in the production account must use QueryLineage to trace each endpoint back to the training jobs and datasets recorded by SageMaker ML Lineage Tracking in the training account.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise entraîne des modèles avec Amazon SageMaker AI dans un compte d'entraînement et les déploie sur des points de terminaison d'un compte de production distinct. L'équipe de gouvernance du compte de production doit utiliser QueryLineage pour remonter de chaque point de terminaison jusqu'aux tâches d'entraînement et aux jeux de données enregistrés par SageMaker ML Lineage Tracking dans le compte d'entraînement.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the training account, add a bucket policy that grants the production account read access to the training data.", fr: "Dans le compte d'entraînement, ajouter une politique de compartiment qui accorde au compte de production l'accès en lecture aux données d'entraînement." } }
    - { id: b, text: { en: "In the training account, create a lineage group that contains only the production models, and share it.", fr: "Dans le compte d'entraînement, créer un groupe de lignage qui ne contient que les modèles de production, puis le partager." } }
    - { id: c, text: { en: "In the training account, create an AWS RAM resource share that includes the default lineage group and names the production account.", fr: "Dans le compte d'entraînement, créer un partage de ressources AWS RAM qui inclut le groupe de lignage par défaut et désigne le compte de production." } }
    - { id: d, text: { en: "In the training account, attach a resource policy directly to each lineage artifact that allows the production account.", fr: "Dans le compte d'entraînement, attacher directement à chaque artefact de lignage une politique de ressource qui autorise le compte de production." } }
    - { id: e, text: { en: "In the production account, accept the AWS RAM resource share invitation from the training account.", fr: "Dans le compte de production, accepter l'invitation de partage de ressources AWS RAM du compte d'entraînement." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Each account has one default lineage group that holds all of its lineage entities, and cross-account lineage works by sharing that group through AWS RAM with a SageMaker resource policy. The recipient account must accept the RAM invitation before QueryLineage can traverse from its own entities into the shared ones."
    fr: "Chaque compte possède un groupe de lignage par défaut qui contient toutes ses entités de lignage, et le lignage intercompte fonctionne en partageant ce groupe via AWS RAM avec une politique de ressource SageMaker. Le compte destinataire doit accepter l'invitation RAM avant que QueryLineage puisse passer de ses propres entités aux entités partagées."
  options:
    a:
      en: "Access to the data files does not give access to the lineage entities that describe them."
      fr: "L'accès aux fichiers de données ne donne pas accès aux entités de lignage qui les décrivent."
    b:
      en: "Lineage is shared as the whole default lineage group or not at all; a subset of entities cannot be shared."
      fr: "Le lignage se partage sous la forme du groupe de lignage par défaut complet ou pas du tout ; un sous-ensemble d'entités ne peut pas être partagé."
    d:
      en: "SageMaker AI supports only the resource policy that AWS RAM creates for the lineage group, not policies on individual entities."
      fr: "SageMaker AI ne prend en charge que la politique de ressource créée par AWS RAM pour le groupe de lignage, pas des politiques sur des entités individuelles."
references:
  - title: Tracking Cross-Account Lineage
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/xaccount-lineage-tracking.html
