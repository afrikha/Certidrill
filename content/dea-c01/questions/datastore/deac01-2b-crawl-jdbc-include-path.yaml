id: deac01-2b-crawl-jdbc-include-path
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon Aurora MySQL DB cluster in private subnets. The database salesdb contains about 40 tables. A data engineer must catalog the schemas of all the tables in salesdb in the AWS Glue Data Catalog by using a crawler, and must not catalog the other databases of the cluster. An AWS Glue JDBC connection to the cluster already works.

    How should the data engineer configure the crawler?
  fr: |
    Une entreprise exécute un cluster de bases de données Amazon Aurora MySQL dans des sous-réseaux privés. La base de données salesdb contient environ 40 tables. Un ingénieur de données doit cataloguer les schémas de toutes les tables de salesdb dans l'AWS Glue Data Catalog à l'aide d'un robot d'analyse (crawler), sans cataloguer les autres bases de données du cluster. Une connexion JDBC AWS Glue au cluster fonctionne déjà.

    Comment l'ingénieur de données doit-il configurer le robot d'analyse ?
body:
  options:
    - { id: a, text: { en: "Add a JDBC data source that uses the connection, with the include path %/salesdb.", fr: "Ajouter une source de données JDBC qui utilise la connexion, avec le chemin d'inclusion %/salesdb." } }
    - { id: b, text: { en: "Add a JDBC data source that uses the connection, with the include path salesdb/public/%.", fr: "Ajouter une source de données JDBC qui utilise la connexion, avec le chemin d'inclusion salesdb/public/%." } }
    - { id: c, text: { en: "Add an S3 data source on an Aurora snapshot export of salesdb, without the JDBC connection.", fr: "Ajouter une source de données S3 sur une exportation d'instantané Aurora de salesdb, sans la connexion JDBC." } }
    - { id: d, text: { en: "Add a JDBC data source that uses the connection, with the include path salesdb/%.", fr: "Ajouter une source de données JDBC qui utilise la connexion, avec le chemin d'inclusion salesdb/%." } }
answer: { optionId: d }
explanation:
  correct:
    en: "For a JDBC data store, the include path has the form database/schema/table or database/table depending on the engine. MySQL has no schema level, so salesdb/% catalogs every table of salesdb that the connection can access, and nothing from the other databases."
    fr: "Pour un magasin de données JDBC, le chemin d'inclusion a la forme base/schéma/table ou base/table selon le moteur. MySQL n'a pas de niveau schéma : salesdb/% catalogue toutes les tables de salesdb accessibles par la connexion, et rien des autres bases de données."
  options:
    a:
      en: "% can replace a schema or a table, but not a database, so this path is not valid."
      fr: "% peut remplacer un schéma ou une table, mais pas une base de données : ce chemin n'est pas valide."
    b:
      en: "A schema name is not specified for MySQL include paths; database/schema/table applies to engines such as PostgreSQL or Amazon Redshift."
      fr: "Aucun nom de schéma n'est indiqué dans les chemins d'inclusion MySQL ; base/schéma/table s'applique à des moteurs tels que PostgreSQL ou Amazon Redshift."
    c:
      en: "A snapshot export adds an export process and catalogs exported files instead of the live database through the existing connection."
      fr: "Une exportation d'instantané ajoute un processus d'exportation et catalogue des fichiers exportés au lieu de la base active au moyen de la connexion existante."
references:
  - title: "Step 2: Choose data sources and classifiers"
    url: https://docs.aws.amazon.com/glue/latest/dg/define-crawler-choose-data-sources.html
