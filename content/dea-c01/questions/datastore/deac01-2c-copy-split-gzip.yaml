id: deac01-2c-copy-split-gzip
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company loads one 60 GB GZIP-compressed CSV file from Amazon S3 into a provisioned Amazon Redshift cluster every night. The cluster has 16 slices in total. The COPY command takes several hours, and monitoring shows that most slices are idle during the load.

    Which solution will reduce the load time the MOST?
  fr: |
    Une entreprise charge chaque nuit un fichier CSV de 60 Go compressé en GZIP depuis Amazon S3 dans un cluster Amazon Redshift provisionné. Le cluster compte 16 tranches (slices) au total. La commande COPY dure plusieurs heures et la surveillance montre que la plupart des tranches sont inactives pendant le chargement.

    Quelle solution permet de réduire le plus le temps de chargement ?
body:
  options:
    - id: a
      text: { en: "Split the data into 16 parts and run 16 COPY commands concurrently, one for each part, into the same table.", fr: "Diviser les données en 16 parties et exécuter simultanément 16 commandes COPY, une par partie, dans la même table." }
    - id: b
      text: { en: "Keep the single file, and add COMPUPDATE OFF and STATUPDATE OFF to the COPY command to skip extra work.", fr: "Conserver le fichier unique, et ajouter COMPUPDATE OFF et STATUPDATE OFF à la commande COPY pour éviter du travail." }
    - id: c
      text: { en: "Convert the file to GZIP-compressed JSON Lines and load it with the FORMAT AS JSON 'auto' option.", fr: "Convertir le fichier en JSON Lines compressé en GZIP et le charger avec l'option FORMAT AS JSON 'auto'." }
    - id: d
      text: { en: "Split the data into similar-size GZIP files, a multiple of 16 in number, and load them with one COPY command.", fr: "Diviser les données en fichiers GZIP de taille similaire, en nombre multiple de 16, et les charger avec une seule commande COPY." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Redshift does not split GZIP-compressed CSV files, so one large file is read serially. Splitting the data into files of similar size (1 MB to 1 GB after compression), in a number that is a multiple of the slice count, lets every slice load in parallel with a single COPY command.
    fr: |
      Redshift ne divise pas les fichiers CSV compressés en GZIP : un gros fichier unique est lu en série. Diviser les données en fichiers de taille similaire (de 1 Mo à 1 Go après compression), en nombre multiple du nombre de tranches, permet à toutes les tranches de charger en parallèle avec une seule commande COPY.
  options:
    a: { en: "Concurrent COPY commands into one table force a serialized load, which is slower and needs a VACUUM afterward when the table has a sort key.", fr: "Des commandes COPY simultanées dans une même table imposent un chargement sérialisé, plus lent, qui exige ensuite un VACUUM si la table a une clé de tri." }
    b: { en: "These options skip encoding analysis and statistics updates, but the single compressed file is still read by one slice.", fr: "Ces options évitent l'analyse des encodages et la mise à jour des statistiques, mais le fichier compressé unique est toujours lu par une seule tranche." }
    c: { en: "JSON files are not split automatically either, so the load stays serialized.", fr: "Les fichiers JSON ne sont pas non plus divisés automatiquement : le chargement reste sérialisé." }
references:
  - title: Loading data files
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_best-practices-use-multiple-files.html
  - title: Use a single COPY command to load from multiple files
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_best-practices-single-copy-command.html
