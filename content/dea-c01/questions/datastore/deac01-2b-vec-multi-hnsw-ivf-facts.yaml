id: deac01-2b-vec-multi-hnsw-ivf-facts
objective: "2.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineering team must choose between HNSW and IVF-based vector indexes for a new retrieval-augmented generation (RAG) workload. The team lead asks for a short list of facts that are true for the vector stores that AWS offers, such as Amazon OpenSearch Service and Amazon DocumentDB.

    Which statements are correct? (Choose two.)
  fr: |
    Une équipe d'ingénierie des données doit choisir entre des index vectoriels HNSW et des index basés sur IVF pour une nouvelle charge de travail de génération à enrichissement contextuel (RAG). Le responsable de l'équipe demande une courte liste de faits exacts pour les magasins de vecteurs proposés par AWS, comme Amazon OpenSearch Service et Amazon DocumentDB.

    Quelles affirmations sont correctes ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "IVF indexes need a training or clustering step on representative vectors, whereas HNSW indexes need no training step.", fr: "Les index IVF nécessitent une étape d'entraînement ou de regroupement sur des vecteurs représentatifs, alors que les index HNSW n'en nécessitent aucune." } }
    - { id: b, text: { en: "HNSW indexes use less memory than IVF indexes because HNSW stores no links between the indexed vectors.", fr: "Les index HNSW utilisent moins de mémoire que les index IVF, car HNSW ne stocke aucun lien entre les vecteurs indexés." } }
    - { id: c, text: { en: "HNSW indexes take longer to build than IVFFlat indexes but give better query performance and recall.", fr: "Les index HNSW sont plus longs à construire que les index IVFFlat, mais offrent de meilleures performances de requête et un meilleur rappel." } }
    - { id: d, text: { en: "Increasing the number of lists probed by an IVF query lowers its latency and also improves its recall.", fr: "Augmenter le nombre de listes sondées par une requête IVF réduit sa latence et améliore aussi son rappel." } }
    - { id: e, text: { en: "HNSW indexes require a lists parameter that sets how many clusters the vectors are divided into.", fr: "Les index HNSW exigent un paramètre lists qui fixe le nombre de clusters entre lesquels les vecteurs sont répartis." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "IVF partitions the vectors into clusters whose centroids must be learned from data, while HNSW builds its multi-layer graph without any training. HNSW is slower to build than IVFFlat, but it delivers better query performance and recall, which is why AWS recommends it for most use cases."
    fr: "IVF répartit les vecteurs en clusters dont les centroïdes doivent être appris à partir des données, alors qu'HNSW construit son graphe à plusieurs couches sans entraînement. HNSW est plus lent à construire qu'IVFFlat, mais offre de meilleures performances de requête et un meilleur rappel, ce qui explique qu'AWS le recommande pour la plupart des cas d'usage."
  options:
    b:
      en: "It is the reverse: HNSW stores graph edges for each vector, so it needs more memory than IVF."
      fr: "C'est l'inverse : HNSW stocke des arêtes de graphe pour chaque vecteur, il nécessite donc plus de mémoire qu'IVF."
    d:
      en: "Probing more lists improves recall but makes the query slower, because more vectors are compared."
      fr: "Sonder davantage de listes améliore le rappel mais ralentit la requête, car davantage de vecteurs sont comparés."
    e:
      en: "lists is the IVFFlat parameter; HNSW is tuned with m and efConstruction at build time and efSearch at query time."
      fr: "lists est le paramètre d'IVFFlat ; HNSW se règle avec m et efConstruction à la construction, et efSearch à la requête."
references:
  - title: Vector search for Amazon DocumentDB
    url: https://docs.aws.amazon.com/documentdb/latest/developerguide/vector-search.html
