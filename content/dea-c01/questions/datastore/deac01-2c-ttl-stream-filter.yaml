id: deac01-2c-ttl-stream-filter
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon DynamoDB table uses TTL. DynamoDB Streams is enabled with the NEW_AND_OLD_IMAGES view type, and an AWS Lambda function writes expired items to Amazon S3 for archiving. The table receives millions of writes and application deletes every hour, and the function is invoked for every stream record, which is expensive. Only items deleted by TTL must be archived.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une table Amazon DynamoDB utilise la durée de vie (TTL). DynamoDB Streams est activé avec le type de vue NEW_AND_OLD_IMAGES, et une fonction AWS Lambda écrit les éléments expirés dans Amazon S3 pour archivage. La table reçoit des millions d'écritures et de suppressions applicatives chaque heure, et la fonction est appelée pour chaque enregistrement du flux, ce qui coûte cher. Seuls les éléments supprimés par TTL doivent être archivés.

    Quelle solution permet de répondre à ces exigences de la manière la plus rentable ?
body:
  options:
    - id: a
      text: { en: "Add filter criteria to the event source mapping that match a userIdentity type of Service and a principalId of dynamodb.amazonaws.com.", fr: "Ajouter au mappage de source d'événement des critères de filtre qui correspondent à un userIdentity de type Service et à un principalId dynamodb.amazonaws.com." }
    - id: b
      text: { en: "Add filter criteria to the event source mapping that match only records whose eventName is REMOVE.", fr: "Ajouter au mappage de source d'événement des critères de filtre qui ne correspondent qu'aux enregistrements dont l'eventName est REMOVE." }
    - id: c
      text: { en: "Change the stream view type to KEYS_ONLY so that each record is smaller and each invocation costs less.", fr: "Changer le type de vue du flux en KEYS_ONLY afin que chaque enregistrement soit plus petit et que chaque appel coûte moins cher." }
    - id: d
      text: { en: "Replace DynamoDB Streams with Kinesis Data Streams for DynamoDB, and deliver the records to Amazon S3 with Amazon Data Firehose.", fr: "Remplacer DynamoDB Streams par Kinesis Data Streams for DynamoDB, et livrer les enregistrements à Amazon S3 avec Amazon Data Firehose." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Deletes made by TTL appear in the stream as service deletions, with userIdentity.type set to Service and userIdentity.principalId set to dynamodb.amazonaws.com. Filtering on these fields in the event source mapping invokes the function only for TTL deletes, so the other records cost no invocation.
    fr: |
      Les suppressions faites par TTL apparaissent dans le flux comme des suppressions de service, avec userIdentity.type à Service et userIdentity.principalId à dynamodb.amazonaws.com. Filtrer sur ces champs dans le mappage de source d'événement n'appelle la fonction que pour les suppressions TTL : les autres enregistrements ne coûtent aucun appel.
  options:
    b: { en: "REMOVE records include the application deletes, which must not be archived, and they would still invoke the function.", fr: "Les enregistrements REMOVE incluent les suppressions applicatives, qui ne doivent pas être archivées, et ils appelleraient toujours la fonction." }
    c: { en: "KEYS_ONLY records do not contain the item attributes to archive, and the function is still invoked for every change.", fr: "Les enregistrements KEYS_ONLY ne contiennent pas les attributs de l'élément à archiver, et la fonction est toujours appelée pour chaque modification." }
    d: { en: "This pipeline delivers every change of the table to Amazon S3, not only the items deleted by TTL.", fr: "Ce pipeline livre à Amazon S3 chaque modification de la table, et pas seulement les éléments supprimés par TTL." }
references:
  - title: DynamoDB Streams and Time to Live
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/time-to-live-ttl-streams.html
