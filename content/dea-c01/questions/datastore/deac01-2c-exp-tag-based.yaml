id: deac01-2c-exp-tag-based
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AWS Glue jobs write the output of many datasets to the same Amazon S3 prefixes, which are organized by business date and not by dataset. Some datasets must be deleted 90 days after they are written, and the others must be kept for 7 years. Changing the prefix layout would break downstream jobs. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Des tâches AWS Glue écrivent la sortie de nombreux jeux de données dans les mêmes préfixes Amazon S3, organisés par date métier et non par jeu de données. Certains jeux de données doivent être supprimés 90 jours après leur écriture, et les autres doivent être conservés 7 ans. Modifier l'organisation des préfixes casserait les tâches en aval. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create one S3 Lifecycle rule for each short-lived dataset with a prefix filter, and expire its objects after 90 days.", fr: "Créer une règle S3 Lifecycle par jeu de données à courte durée avec un filtre de préfixe, et faire expirer ses objets après 90 jours." }
    - id: b
      text: { en: "Enable S3 Object Lock on the bucket with a default retention period of 90 days for the short-lived datasets.", fr: "Activer S3 Object Lock sur le compartiment avec une période de conservation par défaut de 90 jours pour les jeux de données à courte durée." }
    - id: c
      text: { en: "Create an S3 Lifecycle rule with an ObjectSizeLessThan filter that expires the smaller objects after 90 days.", fr: "Créer une règle S3 Lifecycle avec un filtre ObjectSizeLessThan qui fait expirer les plus petits objets après 90 jours." }
    - id: d
      text: { en: "Have the Glue jobs add a retention=90d object tag to short-lived datasets, and expire objects with that tag after 90 days.", fr: "Faire ajouter par les tâches Glue une balise d'objet retention=90d aux jeux de données à courte durée, et faire expirer après 90 jours les objets portant cette balise." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An S3 Lifecycle filter can match object tags, so the rule targets the short-lived datasets wherever they are stored, without changing the prefix layout. The Glue jobs only add the tag when they write the objects.
    fr: |
      Un filtre S3 Lifecycle peut cibler des balises d'objet : la règle vise les jeux de données à courte durée où qu'ils soient stockés, sans modifier l'organisation des préfixes. Les tâches Glue ajoutent seulement la balise lors de l'écriture des objets.
  options:
    a: { en: "The datasets share date-based prefixes, so a prefix filter cannot separate them without changing the layout.", fr: "Les jeux de données partagent des préfixes par date : un filtre de préfixe ne peut pas les séparer sans modifier l'organisation." }
    b: { en: "Object Lock prevents deletion during the retention period; it never deletes objects when the period ends.", fr: "Object Lock empêche la suppression pendant la période de conservation ; il ne supprime jamais les objets à la fin de cette période." }
    c: { en: "Object size does not identify the dataset, so long-lived small objects would be deleted and short-lived large ones kept.", fr: "La taille des objets n'identifie pas le jeu de données : de petits objets à longue durée seraient supprimés et de gros objets à courte durée conservés." }
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
  - title: Expiring objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-expire-general-considerations.html
