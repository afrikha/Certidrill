id: deac01-2a-msk-tiered-storage
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon MSK provisioned cluster with Apache Kafka version 3.6.0 and kafka.m7g.large brokers. Its topics use the delete cleanup policy and keep data for 3 days. A new requirement says that data must be kept for 30 days so that consumer applications can reprocess from any offset with their existing Kafka consumer code. Keeping 30 days on broker storage would require doubling the number of brokers.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise exploite un cluster Amazon MSK provisionné avec Apache Kafka version 3.6.0 et des brokers kafka.m7g.large. Ses rubriques (topics) utilisent la politique de nettoyage delete et conservent les données 3 jours. Une nouvelle exigence impose de conserver les données 30 jours pour que les applications consommatrices puissent retraiter à partir de n'importe quel décalage (offset) avec leur code consommateur Kafka actuel. Conserver 30 jours sur le stockage des brokers exigerait de doubler le nombre de brokers.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Add brokers to the cluster, increase their EBS storage and set retention.ms to 30 days on the topics.", fr: "Ajouter des brokers au cluster, augmenter leur stockage EBS et définir retention.ms à 30 jours sur les rubriques." } }
    - { id: b, text: { en: "Deliver the topics to Amazon S3 with Amazon Data Firehose and build a replay application that reads S3.", fr: "Livrer les rubriques dans Amazon S3 avec Amazon Data Firehose et créer une application de relecture qui lit S3." } }
    - { id: c, text: { en: "Enable tiered storage on the topics, keep a short local retention and set the total retention to 30 days.", fr: "Activer le stockage hiérarchisé sur les rubriques, garder une courte conservation locale et définir la conservation totale à 30 jours." } }
    - { id: d, text: { en: "Replicate the topics with MSK Replicator to a second cluster that has larger broker volumes.", fr: "Répliquer les rubriques avec MSK Replicator vers un second cluster dont les volumes de brokers sont plus grands." } }
answer: { optionId: c }
explanation:
  correct:
    en: "MSK tiered storage moves data from the broker storage to a low-cost tier once it passes the local retention, so topics keep 30 days without adding brokers and the company pays only for the data stored. Consumers read old offsets with the same Kafka APIs. The cluster qualifies: provisioned mode, version 3.6.0 or later, delete cleanup policy, and not t3.small brokers."
    fr: "Le stockage hiérarchisé MSK déplace les données du stockage des brokers vers un niveau peu coûteux une fois la conservation locale dépassée : les rubriques gardent 30 jours sans ajout de brokers et l'entreprise ne paie que les données stockées. Les applications lisent les anciens décalages avec les mêmes API Kafka. Le cluster remplit les conditions : mode provisionné, version 3.6.0 ou ultérieure, politique delete et brokers autres que t3.small."
  options:
    a:
      en: "This meets the retention requirement but keeps all 30 days on primary broker storage, which is the costly option the company wants to avoid."
      fr: "Cela respecte la conservation, mais garde les 30 jours sur le stockage principal des brokers, l'option coûteuse que l'entreprise veut éviter."
    b:
      en: "Replaying from S3 needs a new application; the consumers could not reprocess offsets with their existing Kafka consumer code."
      fr: "Relire depuis S3 exige une nouvelle application : les applications ne pourraient pas retraiter les décalages avec leur code consommateur Kafka actuel."
    d:
      en: "A second cluster with larger volumes doubles the broker and storage cost instead of reducing it."
      fr: "Un second cluster aux volumes plus grands double le coût des brokers et du stockage au lieu de le réduire."
references:
  - title: Tiered storage for Standard brokers
    url: https://docs.aws.amazon.com/msk/latest/developerguide/msk-tiered-storage.html
