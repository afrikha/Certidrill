id: deac01-2d-ml-lineage-uri-reuse
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company retrains a model every week with an Amazon SageMaker AI training job. Each week, a preparation job overwrites the files under s3://example-ml/train/ and the training job reads that same prefix. In SageMaker ML Lineage Tracking, all training jobs point to one dataset artifact, so auditors cannot tell which data trained which model. The company needs lineage to identify the exact dataset of each training run.

    Which solution will meet these requirements?
  fr: |
    Une entreprise réentraîne un modèle chaque semaine avec une tâche d'entraînement Amazon SageMaker AI. Chaque semaine, une tâche de préparation écrase les fichiers sous s3://example-ml/train/ et la tâche d'entraînement lit ce même préfixe. Dans SageMaker ML Lineage Tracking, toutes les tâches d'entraînement pointent vers un seul artefact de jeu de données : les auditeurs ne peuvent pas savoir quelles données ont entraîné quel modèle. L'entreprise a besoin que le lignage identifie le jeu de données exact de chaque exécution d'entraînement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable S3 Versioning on the bucket so that lineage records the object version used by each training job.", fr: "Activer la gestion des versions S3 sur le compartiment afin que le lignage enregistre la version d'objet utilisée par chaque tâche d'entraînement." } }
    - { id: b, text: { en: "Write each week's dataset to a new, unique S3 prefix, and pass that prefix as the training job's input URI.", fr: "Écrire le jeu de données de chaque semaine dans un nouveau préfixe S3 unique, puis passer ce préfixe comme URI d'entrée de la tâche d'entraînement." } }
    - { id: c, text: { en: "Add a DerivedFrom association from each new model artifact to the model artifact of the previous week.", fr: "Ajouter une association DerivedFrom de chaque nouvel artefact de modèle vers l'artefact de modèle de la semaine précédente." } }
    - { id: d, text: { en: "Share the account's default lineage group through AWS RAM so that auditors can query it from their own account.", fr: "Partager le groupe de lignage par défaut du compte via AWS RAM afin que les auditeurs puissent l'interroger depuis leur propre compte." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Lineage Tracking identifies an S3 artifact by the URI passed to the create API, not by object key, hash or ETag, and only one artifact can exist for a given source URI. Changes to the files behind a reused URI are not captured, so each dataset version needs its own URI to become a distinct artifact linked to its training job."
    fr: "Lineage Tracking identifie un artefact S3 par l'URI passée à l'API de création, et non par la clé d'objet, le hachage ou l'ETag, et un seul artefact peut exister pour une URI source donnée. Les modifications des fichiers derrière une URI réutilisée ne sont pas capturées : chaque version du jeu de données a besoin de sa propre URI pour devenir un artefact distinct relié à sa tâche d'entraînement."
  options:
    a:
      en: "The training job still receives the same prefix URI, and lineage does not track object versions, so all runs keep pointing to one artifact."
      fr: "La tâche d'entraînement reçoit toujours la même URI de préfixe, et le lignage ne suit pas les versions d'objet : toutes les exécutions continuent de pointer vers un seul artefact."
    c:
      en: "Linking models to each other records model history but still does not say which data each training job read."
      fr: "Relier les modèles entre eux enregistre l'historique des modèles, mais n'indique toujours pas quelles données chaque tâche d'entraînement a lues."
    d:
      en: "Sharing the lineage group gives other accounts access to the same graph; it does not separate the dataset versions."
      fr: "Partager le groupe de lignage donne à d'autres comptes l'accès au même graphe ; cela ne sépare pas les versions du jeu de données."
references:
  - title: Amazon SageMaker AI–Created Tracking Entities
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking-auto-creation.html
  - title: Amazon SageMaker ML Lineage Tracking
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html
