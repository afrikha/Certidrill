id: deac01-2a-kds-retention-replay
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company ingests order events into an Amazon Kinesis data stream that uses the default settings. Three consumer applications read the stream. After a defect was found in one consumer, the team tried to reprocess the events of the last five days from the stream, but the records were no longer available. Any consumer must now be able to reprocess the last 7 days of events from the stream, with the fewest changes to the consumer applications.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution ingère des événements de commande dans un flux de données Amazon Kinesis qui utilise les paramètres par défaut. Trois applications consommatrices lisent le flux. Après la découverte d'un défaut dans l'une d'elles, l'équipe a voulu retraiter depuis le flux les événements des cinq derniers jours, mais les enregistrements n'étaient plus disponibles. Chaque application consommatrice doit désormais pouvoir retraiter depuis le flux les événements des 7 derniers jours, avec le moins de modifications possible des applications.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Register each consumer application for enhanced fan-out on the stream.", fr: "Inscrire chaque application consommatrice à la diffusion améliorée (enhanced fan-out) du flux." } }
    - { id: b, text: { en: "Add a Firehose stream that copies the records to Amazon S3, and change the consumers to replay from S3.", fr: "Ajouter un flux Firehose qui copie les enregistrements dans Amazon S3 et modifier les applications pour relire depuis S3." } }
    - { id: c, text: { en: "Increase the retention period of the stream to 168 hours with IncreaseStreamRetentionPeriod.", fr: "Augmenter la période de conservation du flux à 168 heures avec IncreaseStreamRetentionPeriod." } }
    - { id: d, text: { en: "Switch the stream from provisioned mode to on-demand capacity mode.", fr: "Passer le flux du mode provisionné au mode de capacité à la demande." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A Kinesis data stream keeps records for 24 hours by default, and the retention period can be raised up to 8,760 hours (365 days). With 168 hours, consumers can read again from an earlier position in the stream with their existing code; retention above 24 hours adds charges."
    fr: "Un flux de données Kinesis conserve les enregistrements 24 heures par défaut, et la période de conservation peut être portée jusqu'à 8 760 heures (365 jours). Avec 168 heures, les applications peuvent relire à partir d'une position antérieure du flux avec leur code actuel ; une conservation supérieure à 24 heures entraîne des frais supplémentaires."
  options:
    a:
      en: "Enhanced fan-out gives each consumer dedicated read throughput; it does not keep records longer than the retention period."
      fr: "La diffusion améliorée donne à chaque application un débit de lecture dédié ; elle ne conserve pas les enregistrements au-delà de la période de conservation."
    b:
      en: "This keeps a copy of the data, but every consumer must be rewritten to read from S3, which fails the fewest-changes requirement."
      fr: "Cela conserve une copie des données, mais chaque application doit être réécrite pour lire depuis S3, ce qui ne respecte pas l'exigence de modifications minimales."
    d:
      en: "The capacity mode controls how shards scale; it does not change the 24-hour retention period."
      fr: "Le mode de capacité contrôle la mise à l'échelle des partitions ; il ne change pas la période de conservation de 24 heures."
references:
  - title: Change the data retention period
    url: https://docs.aws.amazon.com/streams/latest/dev/kinesis-extended-retention.html
