id: deac01-2d-dms-sc-prereqs
objective: "2.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer is preparing DMS Schema Conversion in the us-east-1 Region with the AWS CLI to convert a MySQL database to Amazon Aurora PostgreSQL-Compatible Edition. Because the console is not used, the engineer must create the prerequisite resources manually before creating the instance profile, the data providers and the migration project.

    Which combination of actions must the data engineer take? (Choose two.)
  fr: |
    Un ingénieur de données prépare DMS Schema Conversion dans la Région us-east-1 avec l'AWS CLI pour convertir une base de données MySQL vers Amazon Aurora PostgreSQL-Compatible Edition. Comme la console n'est pas utilisée, l'ingénieur doit créer manuellement les ressources prérequises avant de créer le profil d'instance, les fournisseurs de données et le projet de migration.

    Quelle combinaison d'actions l'ingénieur de données doit-il réaliser ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an S3 bucket encrypted with SSE-C to store the assessment reports and the converted code.", fr: "Créer un compartiment S3 chiffré avec SSE-C pour stocker les rapports d'évaluation et le code converti." } }
    - { id: b, text: { en: "Create an S3 bucket in us-east-1 with S3 Versioning enabled to store the assessment reports and the converted code.", fr: "Créer un compartiment S3 dans us-east-1 avec la gestion des versions S3 activée pour stocker les rapports d'évaluation et le code converti." } }
    - { id: c, text: { en: "Create a VPC whose subnets are all in one Availability Zone to keep the conversion traffic local.", fr: "Créer un VPC dont tous les sous-réseaux se trouvent dans une seule zone de disponibilité pour garder le trafic de conversion local." } }
    - { id: d, text: { en: "Store the source and target credentials as AWS Secrets Manager secrets in us-east-1 with username and password keys.", fr: "Stocker les informations d'identification source et cible sous forme de secrets AWS Secrets Manager dans us-east-1 avec les clés username et password." } }
    - { id: e, text: { en: "Create the IAM roles with a trust policy that allows glue.amazonaws.com to assume them.", fr: "Créer les rôles IAM avec une politique d'approbation qui autorise glue.amazonaws.com à les assumer." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "DMS Schema Conversion stores assessment reports, converted SQL code and schema metadata in an S3 bucket that must have versioning enabled and be in the same Region as the migration project. It reads database credentials from two Secrets Manager secrets, one for the source and one for the target, each with username and password keys and in the same Region."
    fr: "DMS Schema Conversion stocke les rapports d'évaluation, le code SQL converti et les métadonnées de schéma dans un compartiment S3 qui doit avoir la gestion des versions activée et se trouver dans la même Région que le projet de migration. Il lit les informations d'identification dans deux secrets Secrets Manager, un pour la source et un pour la cible, chacun avec les clés username et password et dans la même Région."
  options:
    a:
      en: "The bucket can use SSE-S3 or SSE-KMS; SSE-C and client-side encryption are not supported."
      fr: "Le compartiment peut utiliser SSE-S3 ou SSE-KMS ; SSE-C et le chiffrement côté client ne sont pas pris en charge."
    c:
      en: "The VPC used by DMS Schema Conversion needs subnets in at least two Availability Zones."
      fr: "Le VPC utilisé par DMS Schema Conversion a besoin de sous-réseaux dans au moins deux zones de disponibilité."
    e:
      en: "The roles are assumed by AWS DMS, so their trust policy must allow dms.amazonaws.com."
      fr: "Les rôles sont assumés par AWS DMS : leur politique d'approbation doit autoriser dms.amazonaws.com."
references:
  - title: Complete prerequisites for working with DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/set-up.html
