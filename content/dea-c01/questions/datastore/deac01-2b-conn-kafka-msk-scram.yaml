id: deac01-2b-conn-kafka-msk-scram
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue streaming ETL job must read records from an Amazon MSK cluster in private subnets of a VPC. The cluster authenticates clients with SASL/SCRAM. Security requires that the client user name and password never appear in job scripts or job parameters.

    Which AWS Glue connection configuration will meet these requirements?
  fr: |
    Une tâche ETL de streaming AWS Glue doit lire des enregistrements depuis un cluster Amazon MSK situé dans des sous-réseaux privés d'un VPC. Le cluster authentifie les clients avec SASL/SCRAM. La sécurité exige que le nom d'utilisateur et le mot de passe du client n'apparaissent jamais dans les scripts ni dans les paramètres des tâches.

    Quelle configuration de connexion AWS Glue répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A Kafka connection with the bootstrap servers, the VPC, subnet and security group of the cluster, and SASL/SCRAM-SHA-512 credentials from an AWS Secrets Manager secret", fr: "Une connexion Kafka avec les serveurs d'amorçage, le VPC, le sous-réseau et le groupe de sécurité du cluster, et des informations d'identification SASL/SCRAM-SHA-512 provenant d'un secret AWS Secrets Manager" } }
    - { id: b, text: { en: "A Kafka connection with the bootstrap servers, the VPC, subnet and security group of the cluster, and SASL/GSSAPI authentication with a keytab file stored in Amazon S3", fr: "Une connexion Kafka avec les serveurs d'amorçage, le VPC, le sous-réseau et le groupe de sécurité du cluster, et une authentification SASL/GSSAPI avec un fichier keytab stocké dans Amazon S3" } }
    - { id: c, text: { en: "A Network connection with the VPC, subnet and security group of the cluster, and the SASL/SCRAM user name and password set as job parameters", fr: "Une connexion Network avec le VPC, le sous-réseau et le groupe de sécurité du cluster, et le nom d'utilisateur et le mot de passe SASL/SCRAM définis comme paramètres de tâche" } }
    - { id: d, text: { en: "A JDBC connection with a jdbc:kafka:// URL that lists the bootstrap servers, and the SASL/SCRAM user name and password set in the connection", fr: "Une connexion JDBC avec une URL jdbc:kafka:// qui liste les serveurs d'amorçage, et le nom d'utilisateur et le mot de passe SASL/SCRAM définis dans la connexion" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A Kafka connection stores the comma-separated bootstrap servers with their ports and the VPC settings of the cluster. For SASL/SCRAM-SHA-512, AWS recommends taking the user name and password from an AWS Secrets Manager secret, so no credentials appear in the job."
    fr: "Une connexion Kafka stocke la liste des serveurs d'amorçage, séparés par des virgules, avec leurs ports, ainsi que les paramètres de VPC du cluster. Pour SASL/SCRAM-SHA-512, AWS recommande d'obtenir le nom d'utilisateur et le mot de passe d'un secret AWS Secrets Manager : aucune information d'identification n'apparaît dans la tâche."
  options:
    b:
      en: "SASL/GSSAPI (Kerberos) is available only for customer-managed Kafka clusters, not for Amazon MSK, and the cluster uses SASL/SCRAM."
      fr: "SASL/GSSAPI (Kerberos) n'est disponible que pour les clusters Kafka gérés par le client, pas pour Amazon MSK, et le cluster utilise SASL/SCRAM."
    c:
      en: "Job parameters expose the credentials in the job definition, which the security requirement forbids."
      fr: "Les paramètres de tâche exposent les informations d'identification dans la définition de la tâche, ce que l'exigence de sécurité interdit."
    d:
      en: "Kafka is not a JDBC data store; streaming sources from Kafka or MSK use the Kafka connection type."
      fr: "Kafka n'est pas un magasin de données JDBC ; les sources de streaming Kafka ou MSK utilisent le type de connexion Kafka."
references:
  - title: AWS Glue connection properties
    url: https://docs.aws.amazon.com/glue/latest/dg/connection-properties.html
