id: deac01-2b-vec-hnsw-empty-collection
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is adding semantic product search to an application that stores its catalog in an Amazon DocumentDB 5.0 instance-based cluster. The collection that will hold the product embeddings is empty today and will be loaded continuously after launch. The vector index must be created before the first load and must give the best query performance and recall.

    Which solution will meet these requirements?
  fr: |
    AnyCompany ajoute une recherche sémantique de produits à une application qui stocke son catalogue dans un cluster Amazon DocumentDB 5.0 basé sur des instances. La collection qui contiendra les vectorisations (embeddings) des produits est vide aujourd'hui et sera chargée en continu après le lancement. L'index vectoriel doit être créé avant le premier chargement et doit offrir les meilleures performances de requête et le meilleur rappel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an IVFFlat vector index now, with lists set to the expected number of documents divided by 1,000.", fr: "Créer maintenant un index vectoriel IVFFlat, avec lists défini au nombre de documents attendu divisé par 1 000." } }
    - { id: b, text: { en: "Create an IVFFlat vector index now, with lists set to 1, and query it with probes set to 1.", fr: "Créer maintenant un index vectoriel IVFFlat, avec lists défini à 1, et l'interroger avec probes défini à 1." } }
    - { id: c, text: { en: "Create an HNSW vector index now, with the default m and efConstruction values.", fr: "Créer maintenant un index vectoriel HNSW, avec les valeurs par défaut de m et d'efConstruction." } }
    - { id: d, text: { en: "Create no vector index, and let every query run an exact nearest neighbor search.", fr: "Ne créer aucun index vectoriel et laisser chaque requête effectuer une recherche exacte des plus proches voisins." } }
answer: { optionId: c }
explanation:
  correct:
    en: "HNSW builds a multi-layer graph and has no training step, so the index can be created before any data is loaded. It builds more slowly than IVFFlat but delivers better query performance and recall, and AWS recommends it for most vector search use cases in Amazon DocumentDB."
    fr: "HNSW construit un graphe à plusieurs couches et n'a pas d'étape d'entraînement : l'index peut être créé avant tout chargement de données. Il se construit plus lentement qu'IVFFlat, mais offre de meilleures performances de requête et un meilleur rappel, et AWS le recommande pour la plupart des cas d'usage de recherche vectorielle dans Amazon DocumentDB."
  options:
    a:
      en: "IVFFlat clusters the existing vectors into lists, so it is effective only when data is loaded before the index is built; on an empty collection the clusters are meaningless."
      fr: "IVFFlat regroupe les vecteurs existants en listes : il n'est efficace que si des données sont chargées avant la création de l'index ; sur une collection vide, les clusters n'ont pas de sens."
    b:
      en: "A single list puts every vector in one cluster, so the index brings no speed gain, and IVFFlat still gives lower recall and query performance than HNSW."
      fr: "Une seule liste place tous les vecteurs dans un même cluster : l'index n'apporte aucun gain de vitesse, et IVFFlat reste moins performant qu'HNSW en rappel et en requêtes."
    d:
      en: "Exact search gives perfect recall but compares the query with every vector, so query performance degrades as the collection grows."
      fr: "La recherche exacte donne un rappel parfait mais compare la requête à chaque vecteur : les performances se dégradent à mesure que la collection grandit."
references:
  - title: Vector search for Amazon DocumentDB
    url: https://docs.aws.amazon.com/documentdb/latest/developerguide/vector-search.html
