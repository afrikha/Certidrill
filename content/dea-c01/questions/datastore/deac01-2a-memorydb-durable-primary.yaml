id: deac01-2a-memorydb-durable-primary
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company is building a leaderboard and player session microservice that uses Redis OSS data structures such as sorted sets. The service needs microsecond read latency. Data must survive node failures without loss and must be stored durably across multiple Availability Zones. The team does not want to operate a cache in front of a separate durable database.

    Which data store will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo crée un microservice de classement et de sessions de joueurs qui utilise des structures de données Redis OSS comme les ensembles triés. Le service exige une latence de lecture de l'ordre de la microseconde. Les données doivent survivre aux pannes de nœuds sans perte et être stockées durablement dans plusieurs zones de disponibilité. L'équipe ne veut pas exploiter un cache devant une base de données durable distincte.

    Quel magasin de données répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon MemoryDB" }
    - { id: b, text: { en: "Amazon DynamoDB with on-demand capacity", fr: "Amazon DynamoDB avec capacité à la demande" } }
    - { id: c, text: { en: "Amazon Aurora MySQL with Aurora Replicas", fr: "Amazon Aurora MySQL avec des réplicas Aurora" } }
    - { id: d, text: { en: "Amazon ElastiCache in front of an Amazon DynamoDB table", fr: "Amazon ElastiCache devant une table Amazon DynamoDB" } }
answer: { optionId: a }
explanation:
  correct:
    en: "MemoryDB keeps all data in memory for microsecond reads and stores it durably with a Multi-AZ transactional log. It is compatible with Valkey and Redis OSS data structures and APIs, so it can be the primary database without a separate cache."
    fr: "MemoryDB garde toutes les données en mémoire pour des lectures de l'ordre de la microseconde et les stocke durablement grâce à un journal transactionnel Multi-AZ. Il est compatible avec les structures de données et les API Valkey et Redis OSS : il peut servir de base de données principale sans cache distinct."
  options:
    b:
      en: "DynamoDB is durable but does not offer Redis OSS data structures and its reads are in milliseconds, not microseconds."
      fr: "DynamoDB est durable, mais n'offre pas les structures de données Redis OSS, et ses lectures se comptent en millisecondes, pas en microsecondes."
    c:
      en: "Aurora is a relational database with no Redis OSS API, and it does not give microsecond reads."
      fr: "Aurora est une base de données relationnelle sans API Redis OSS, et elle n'offre pas de lectures de l'ordre de la microseconde."
    d:
      en: "This is the cache plus separate durable database design that the team wants to avoid."
      fr: "C'est la conception cache plus base de données durable distincte que l'équipe veut éviter."
references:
  - title: What is MemoryDB
    url: https://docs.aws.amazon.com/memorydb/latest/devguide/what-is-memorydb.html
