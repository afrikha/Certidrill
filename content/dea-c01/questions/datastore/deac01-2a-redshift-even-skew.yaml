id: deac01-2a-redshift-even-skew
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Redshift table named web_events has 6 billion rows and uses DISTKEY (country_code). Ninety percent of the rows have one of three country codes. The table is never joined with other tables; queries scan it and aggregate the results. Queries are slow because a few slices do most of the work.

    Which distribution style should the data engineer use for the table?
  fr: |
    Une table Amazon Redshift nommée web_events compte 6 milliards de lignes et utilise DISTKEY (country_code). Quatre-vingt-dix pour cent des lignes ont l'un de trois codes pays. La table n'est jamais jointe à d'autres tables ; les requêtes l'analysent et agrègent les résultats. Les requêtes sont lentes, car quelques tranches (slices) font l'essentiel du travail.

    Quel style de distribution l'ingénieur data doit-il utiliser pour la table ?
body:
  options:
    - { id: a, text: { en: "DISTSTYLE ALL, so that every node holds a full copy of the table", fr: "DISTSTYLE ALL, pour que chaque nœud contienne une copie complète de la table" } }
    - { id: b, text: { en: "DISTKEY (country_code) with a compound sort key on country_code", fr: "DISTKEY (country_code) avec une clé de tri composée sur country_code" } }
    - { id: c, text: { en: "DISTKEY (event_type), a column that has 12 distinct values", fr: "DISTKEY (event_type), une colonne qui a 12 valeurs distinctes" } }
    - { id: d, text: { en: "DISTSTYLE EVEN, so that rows are spread in round-robin order", fr: "DISTSTYLE EVEN, pour que les lignes soient réparties à tour de rôle" } }
answer: { optionId: d }
explanation:
  correct:
    en: "EVEN distribution spreads rows across slices in round-robin order regardless of column values, which removes the skew. It is the recommended style for a table that does not take part in joins, where KEY distribution brings no collocation benefit."
    fr: "La distribution EVEN répartit les lignes entre les tranches à tour de rôle, quelles que soient les valeurs des colonnes, ce qui supprime le déséquilibre. C'est le style recommandé pour une table qui ne participe à aucune jointure, où la distribution KEY n'apporte aucun bénéfice de colocalisation."
  options:
    a:
      en: "ALL multiplies the storage of a 6-billion-row table by the number of nodes and does not help a table that is never joined."
      fr: "ALL multiplie le stockage d'une table de 6 milliards de lignes par le nombre de nœuds et n'aide pas une table jamais jointe."
    b:
      en: "A sort key orders rows within each slice; the rows stay concentrated on the same few slices, so the skew remains."
      fr: "Une clé de tri ordonne les lignes au sein de chaque tranche ; les lignes restent concentrées sur les mêmes tranches : le déséquilibre demeure."
    c:
      en: "A key with only 12 values spreads the rows over at most 12 slices and is still likely to be skewed."
      fr: "Une clé de seulement 12 valeurs répartit les lignes sur 12 tranches au plus et reste probablement déséquilibrée."
references:
  - title: Distribution styles
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_choosing_dist_sort.html
