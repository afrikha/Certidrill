id: deac01-2b-use-emr-glue-metastore
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team launches transient Amazon EMR clusters with Apache Spark from the AWS CLI. Spark SQL jobs on these clusters must query tables that are already defined in the AWS Glue Data Catalog of the account by using their database and table names. The clusters use the default EC2 instance profile.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données lance des clusters Amazon EMR éphémères avec Apache Spark depuis l'AWS CLI. Les tâches Spark SQL de ces clusters doivent interroger des tables déjà définies dans l'AWS Glue Data Catalog du compte en utilisant leurs noms de base de données et de table. Les clusters utilisent le profil d'instance EC2 par défaut.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Install a Hive metastore on the primary node of each cluster, and run an AWS Glue crawler that writes the table definitions to it.", fr: "Installer un metastore Hive sur le nœud primaire de chaque cluster, et exécuter un robot d'analyse AWS Glue qui y écrit les définitions de tables." } }
    - { id: b, text: { en: "Add a hive-site classification that sets javax.jdo.option.ConnectionURL to the AWS Glue endpoint of the Region.", fr: "Ajouter une classification hive-site qui définit javax.jdo.option.ConnectionURL sur le point de terminaison AWS Glue de la Région." } }
    - { id: c, text: { en: "Add a spark-hive-site classification that sets hive.metastore.client.factory.class to the AWS Glue Data Catalog client factory.", fr: "Ajouter une classification spark-hive-site qui définit hive.metastore.client.factory.class sur la fabrique de clients AWS Glue Data Catalog." } }
    - { id: d, text: { en: "Run an AWS Glue job before each Spark job to export the table definitions to HDFS on the cluster.", fr: "Exécuter une tâche AWS Glue avant chaque tâche Spark pour exporter les définitions de tables vers HDFS sur le cluster." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Setting hive.metastore.client.factory.class to com.amazonaws.glue.catalog.metastore.AWSGlueDataCatalogHiveClientFactory in the spark-hive-site classification makes Spark use the Data Catalog as its Hive metastore. The default instance profile already grants the AWS Glue actions that are needed."
    fr: "Définir hive.metastore.client.factory.class sur com.amazonaws.glue.catalog.metastore.AWSGlueDataCatalogHiveClientFactory dans la classification spark-hive-site fait utiliser le Data Catalog comme metastore Hive par Spark. Le profil d'instance par défaut accorde déjà les actions AWS Glue nécessaires."
  options:
    a:
      en: "Crawlers write only to the Data Catalog, and a metastore on each transient cluster disappears when the cluster terminates."
      fr: "Les robots d'analyse n'écrivent que dans le Data Catalog, et un metastore sur chaque cluster éphémère disparaît à la fin du cluster."
    b:
      en: "javax.jdo.option.ConnectionURL points Hive to a JDBC database used as an external metastore; the Data Catalog is not reached through a JDBC URL."
      fr: "javax.jdo.option.ConnectionURL fait pointer Hive vers une base de données JDBC utilisée comme metastore externe ; le Data Catalog n'est pas accessible par une URL JDBC."
    d:
      en: "Exporting definitions to HDFS duplicates the metadata on transient storage and adds a job before each run, instead of reading the catalog directly."
      fr: "Exporter les définitions vers HDFS duplique les métadonnées sur un stockage éphémère et ajoute une tâche avant chaque exécution, au lieu de lire directement le catalogue."
references:
  - title: Use AWS Glue Data Catalog with Spark on Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-spark-glue.html
