id: deac01-2c-res-redshift-xregion-kms
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A provisioned Amazon Redshift cluster in us-east-1 is encrypted with an AWS KMS customer managed key. For disaster recovery, the company needs restorable copies of the cluster's automated snapshots in us-west-2, kept for 14 days. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un cluster Amazon Redshift provisionné dans us-east-1 est chiffré avec une clé gérée par le client AWS KMS. Pour la reprise après sinistre, l'entreprise a besoin de copies restaurables des instantanés automatiques du cluster dans us-west-2, conservées 14 jours. La solution doit demander le MOINS d'efforts opérationnels.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Update the key policy of the us-east-1 key to allow us-west-2, and enable cross-Region snapshot copy that uses the key ARN.", fr: "Mettre à jour la politique de la clé de us-east-1 pour autoriser us-west-2, et activer une copie d'instantanés entre Régions qui utilise l'ARN de la clé." }
    - id: b
      text: { en: "Run a nightly UNLOAD of every table to an S3 bucket that replicates its objects to us-west-2 with S3 Cross-Region Replication.", fr: "Exécuter chaque nuit un UNLOAD de toutes les tables vers un compartiment S3 qui réplique ses objets vers us-west-2 avec S3 Cross-Region Replication." }
    - id: c
      text: { en: "Convert the cluster to a Multi-AZ deployment, and set the automated snapshot retention period to 14 days.", fr: "Convertir le cluster en déploiement Multi-AZ, et définir la période de conservation des instantanés automatiques à 14 jours." }
    - id: d
      text: { en: "Create a snapshot copy grant for a key in us-west-2, then enable cross-Region snapshot copy with it and a 14-day retention.", fr: "Créer un octroi de copie d'instantané (snapshot copy grant) pour une clé de us-west-2, puis activer la copie d'instantanés entre Régions avec cet octroi et 14 jours de conservation." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For a KMS-encrypted cluster, Redshift needs a snapshot copy grant for a customer managed key in the destination Region; the grant is then selected when cross-Region snapshot copy is enabled. Automated snapshots copied to the destination have their own retention period, here 14 days, and can be restored there with restore-from-cluster-snapshot.
    fr: |
      Pour un cluster chiffré avec KMS, Redshift a besoin d'un octroi de copie d'instantané pour une clé gérée par le client dans la Région de destination ; cet octroi est ensuite sélectionné lors de l'activation de la copie d'instantanés entre Régions. Les instantanés automatiques copiés dans la destination ont leur propre période de conservation, ici 14 jours, et peuvent y être restaurés avec restore-from-cluster-snapshot.
  options:
    a: { en: "KMS keys are Regional, so the us-east-1 key cannot encrypt the snapshot copies in us-west-2; Redshift requires a grant for a key in the destination Region.", fr: "Les clés KMS sont régionales : la clé de us-east-1 ne peut pas chiffrer les copies d'instantanés dans us-west-2 ; Redshift exige un octroi pour une clé de la Région de destination." }
    b: { en: "Exported files are not cluster snapshots; rebuilding the warehouse from them would require custom loads and much more effort.", fr: "Les fichiers exportés ne sont pas des instantanés de cluster ; reconstruire l'entrepôt à partir de ceux-ci exigerait des chargements personnalisés et bien plus d'efforts." }
    c: { en: "Multi-AZ protects against the loss of an Availability Zone within us-east-1; it creates no copy in us-west-2.", fr: "Multi-AZ protège contre la perte d'une zone de disponibilité dans us-east-1 ; il ne crée aucune copie dans us-west-2." }
references:
  - title: Copying a snapshot to another AWS Region
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/cross-region-snapshot-copy.html
