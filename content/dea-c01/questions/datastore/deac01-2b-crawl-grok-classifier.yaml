id: deac01-2b-crawl-grok-classifier
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores logs from a legacy application in Amazon S3. Each line has a proprietary text layout with a timestamp, a severity level in brackets and a free-text message. An AWS Glue crawler on the prefix creates a table with the classification UNKNOWN, so Amazon Athena cannot query the logs. The data engineer wants the crawler to create a table with one column for each field.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke dans Amazon S3 les journaux d'une ancienne application. Chaque ligne a une structure textuelle propriétaire avec un horodatage, un niveau de gravité entre crochets et un message en texte libre. Un robot d'analyse (crawler) AWS Glue exécuté sur le préfixe crée une table avec la classification UNKNOWN : Amazon Athena ne peut pas interroger les journaux. L'ingénieur de données veut que le robot d'analyse crée une table avec une colonne par champ.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a custom JSON classifier with a JSON path that selects the fields, and add it to the crawler.", fr: "Créer un classificateur JSON personnalisé avec un chemin JSON qui sélectionne les champs, et l'ajouter au robot d'analyse." } }
    - { id: b, text: { en: "Set the sample size of the crawler to 249 files so that it reads more lines before it classifies the data.", fr: "Définir la taille d'échantillon du robot d'analyse à 249 fichiers afin qu'il lise davantage de lignes avant de classer les données." } }
    - { id: c, text: { en: "Create a custom grok classifier with a pattern that matches the log lines, and add it to the crawler.", fr: "Créer un classificateur grok personnalisé avec un modèle qui correspond aux lignes de journal, et l'ajouter au robot d'analyse." } }
    - { id: d, text: { en: "Select the option to create a single schema for each S3 path, and run the crawler again.", fr: "Sélectionner l'option de création d'un schéma unique pour chaque chemin S3, puis exécuter à nouveau le robot d'analyse." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A grok classifier parses textual data line by line with a matching pattern such as %{TIMESTAMP_ISO8601:timestamp}, and each named pattern becomes a column. Crawlers run custom classifiers before the built-in ones, so the table gets the fields of the log format."
    fr: "Un classificateur grok analyse les données textuelles ligne par ligne avec un modèle correspondant tel que %{TIMESTAMP_ISO8601:timestamp}, et chaque modèle nommé devient une colonne. Les robots d'analyse exécutent les classificateurs personnalisés avant les classificateurs intégrés : la table obtient les champs du format de journal."
  options:
    a:
      en: "A JSON classifier applies to JSON documents; the log lines are a proprietary text format, not JSON."
      fr: "Un classificateur JSON s'applique aux documents JSON ; les lignes de journal sont un format texte propriétaire, pas du JSON."
    b:
      en: "Reading more files does not help: no built-in classifier recognizes the format, whatever the sample."
      fr: "Lire davantage de fichiers n'aide pas : aucun classificateur intégré ne reconnaît le format, quel que soit l'échantillon."
    d:
      en: "This option merges compatible schemas into one table; it does not let the crawler parse an unknown format."
      fr: "Cette option fusionne des schémas compatibles en une seule table ; elle ne permet pas au robot d'analyse d'interpréter un format inconnu."
references:
  - title: Writing custom classifiers for diverse data formats
    url: https://docs.aws.amazon.com/glue/latest/dg/custom-classifier.html
