id: deac01-2b-part-multi-add-drop
objective: "2.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An Amazon Athena table is partitioned by dt over Hive-style prefixes such as dt=2026-11-21/ in Amazon S3. A new prefix arrives every day, and an S3 Lifecycle rule expires the objects of each day after 90 days. The partition metadata must contain exactly the days that have data, so that SHOW PARTITIONS matches the data in Amazon S3.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une table Amazon Athena est partitionnée par dt sur des préfixes de style Hive tels que dt=2026-11-21/ dans Amazon S3. Un nouveau préfixe arrive chaque jour, et une règle de cycle de vie S3 fait expirer les objets de chaque jour au bout de 90 jours. Les métadonnées de partitions doivent contenir exactement les jours qui ont des données, afin que SHOW PARTITIONS corresponde aux données dans Amazon S3.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run MSCK REPAIR TABLE every day after the new prefix arrives.", fr: "Exécuter MSCK REPAIR TABLE chaque jour après l'arrivée du nouveau préfixe." } }
    - { id: b, text: { en: "Run SHOW PARTITIONS every day to refresh the partition metadata.", fr: "Exécuter SHOW PARTITIONS chaque jour pour actualiser les métadonnées de partitions." } }
    - { id: c, text: { en: "Run ALTER TABLE DROP PARTITION every day for the day that the Lifecycle rule expired.", fr: "Exécuter ALTER TABLE DROP PARTITION chaque jour pour le jour que la règle de cycle de vie a fait expirer." } }
    - { id: d, text: { en: "Add an Expiration action for partition metadata to the S3 Lifecycle rule.", fr: "Ajouter une action Expiration pour les métadonnées de partitions à la règle de cycle de vie S3." } }
    - { id: e, text: { en: "Configure an AWS Glue crawler to crawl new sub-folders only, so that it removes expired days.", fr: "Configurer un robot d'analyse AWS Glue pour qu'il analyse uniquement les nouveaux sous-dossiers, afin qu'il supprime les jours expirés." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "MSCK REPAIR TABLE adds the new Hive-style partitions to the metadata, but it only adds partitions and never removes stale ones. ALTER TABLE DROP PARTITION removes the partitions whose objects were expired, so the metadata matches the data."
    fr: "MSCK REPAIR TABLE ajoute les nouvelles partitions de style Hive aux métadonnées, mais il ne fait qu'ajouter des partitions et ne supprime jamais les partitions obsolètes. ALTER TABLE DROP PARTITION supprime les partitions dont les objets ont expiré : les métadonnées correspondent alors aux données."
  options:
    b:
      en: "SHOW PARTITIONS only lists the partitions that are in the metadata; it changes nothing."
      fr: "SHOW PARTITIONS ne fait que lister les partitions présentes dans les métadonnées ; il ne modifie rien."
    d:
      en: "S3 Lifecycle rules act on objects in the bucket; they cannot change the Data Catalog."
      fr: "Les règles de cycle de vie S3 agissent sur les objets du compartiment ; elles ne peuvent pas modifier le Data Catalog."
    e:
      en: "Incremental crawls add only new partitions and do not detect deletions of existing partitions."
      fr: "Les analyses incrémentielles n'ajoutent que de nouvelles partitions et ne détectent pas les suppressions de partitions existantes."
references:
  - title: MSCK REPAIR TABLE
    url: https://docs.aws.amazon.com/athena/latest/ug/msck-repair-table.html
