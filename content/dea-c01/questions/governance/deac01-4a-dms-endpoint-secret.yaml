id: deac01-4a-dms-endpoint-secret
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS DMS task replicates data from an on-premises Oracle database to Amazon S3. The source endpoint stores the database user name and password in clear text in its endpoint settings. The security team requires that the credentials be kept in AWS Secrets Manager with rotation turned on, and that AWS DMS read them directly from Secrets Manager.

    Which solution will meet these requirements?
  fr: |
    Une tâche AWS DMS réplique des données d'une base de données Oracle sur site vers Amazon S3. Le point de terminaison source stocke le nom d'utilisateur et le mot de passe de la base en texte clair dans ses paramètres. L'équipe de sécurité exige que les informations d'identification soient conservées dans AWS Secrets Manager avec la rotation activée, et qu'AWS DMS les lise directement dans Secrets Manager.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep UserName and Password in the endpoint settings and also set SecretsManagerSecretId, so that DMS switches to the secret after a rotation.", fr: "Conserver UserName et Password dans les paramètres du point de terminaison et définir aussi SecretsManagerSecretId, pour que DMS passe au secret après une rotation." } }
    - { id: b, text: { en: "Create a secret and an IAM role that trusts the Regional DMS service principal and can read it, then set SecretsManagerSecretId and SecretsManagerAccessRoleArn.", fr: "Créer un secret et un rôle IAM qui approuve le principal de service DMS régional et peut le lire, puis définir SecretsManagerSecretId et SecretsManagerAccessRoleArn." } }
    - { id: c, text: { en: "Create a secret with the credentials and reference its ARN in the table mappings of the replication task.", fr: "Créer un secret avec les informations d'identification et référencer son ARN dans les mappages de tables de la tâche de réplication." } }
    - { id: d, text: { en: "Create a secret with a resource policy that allows the DMS service principal to read it, and set only SecretsManagerSecretId.", fr: "Créer un secret avec une politique de ressource qui autorise le principal de service DMS à le lire, et définir uniquement SecretsManagerSecretId." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A DMS endpoint can authenticate with a secret: SecretsManagerSecretId names the secret, and SecretsManagerAccessRoleArn names an IAM role that trusts the Regional DMS service principal and allows secretsmanager:GetSecretValue (plus kms:Decrypt for a customer managed key). Automatic rotation of the secret is supported.
    fr: |
      Un point de terminaison DMS peut s'authentifier avec un secret : SecretsManagerSecretId désigne le secret, et SecretsManagerAccessRoleArn désigne un rôle IAM qui approuve le principal de service DMS régional et autorise secretsmanager:GetSecretValue (plus kms:Decrypt pour une clé gérée par le client). La rotation automatique du secret est prise en charge.
  options:
    a:
      en: |
        An endpoint uses either the secret settings or the clear-text credential settings, not both, and the clear-text password would stay in the endpoint.
      fr: |
        Un point de terminaison utilise soit les paramètres de secret, soit les paramètres d'informations d'identification en texte clair, pas les deux, et le mot de passe en clair resterait dans le point de terminaison.
    c:
      en: |
        Table mappings select and transform tables; they do not hold endpoint authentication settings.
      fr: |
        Les mappages de tables sélectionnent et transforment des tables ; ils ne contiennent pas les paramètres d'authentification des points de terminaison.
    d:
      en: |
        DMS reads the secret through the access role named in SecretsManagerAccessRoleArn, so the endpoint needs that role.
      fr: |
        DMS lit le secret par le rôle d'accès désigné dans SecretsManagerAccessRoleArn : le point de terminaison a besoin de ce rôle.
references:
  - title: Using secrets to access AWS Database Migration Service endpoints
    url: https://docs.aws.amazon.com/dms/latest/userguide/security_iam_secretsmanager.html
