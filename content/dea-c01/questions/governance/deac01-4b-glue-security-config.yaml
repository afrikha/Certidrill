id: deac01-4b-glue-security-config
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs AWS Glue ETL jobs that use job bookmarks and write output to Amazon S3. An audit requires that the S3 output, the Amazon CloudWatch logs of the jobs, and the job bookmarks all be encrypted with a customer managed AWS KMS key. The company wants to configure this once and reuse it for every job.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des tâches ETL AWS Glue qui utilisent des signets de tâche (job bookmarks) et écrivent leur sortie dans Amazon S3. Un audit exige que la sortie S3, les journaux Amazon CloudWatch des tâches et les signets de tâche soient tous chiffrés avec une clé AWS KMS gérée par le client. L'entreprise veut configurer cela une seule fois et le réutiliser pour toutes les tâches.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable SSE-KMS default encryption with the key on the output bucket, and keep the default encryption settings of the Glue jobs.", fr: "Activer le chiffrement par défaut SSE-KMS avec la clé sur le compartiment de sortie, et conserver les paramètres de chiffrement par défaut des tâches Glue." } }
    - { id: b, text: { en: "Enable encryption of the AWS Glue Data Catalog with the key in the Data Catalog settings of the account.", fr: "Activer le chiffrement du AWS Glue Data Catalog avec la clé dans les paramètres du Data Catalog du compte." } }
    - { id: c, text: { en: "Pass the --encryption-type sse-s3 job parameter to every job, and enable S3 Bucket Keys on the output bucket.", fr: "Transmettre le paramètre de tâche --encryption-type sse-s3 à chaque tâche, et activer les clés de compartiment S3 sur le compartiment de sortie." } }
    - { id: d, text: { en: "Create a Glue security configuration that uses the key for S3, CloudWatch logs, and job bookmarks; attach it to the jobs.", fr: "Créer une configuration de sécurité Glue qui utilise la clé pour S3, les journaux CloudWatch et les signets ; l'attacher aux tâches." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A Glue security configuration attached to an ETL job encrypts its S3 targets, its CloudWatch logs, and its job bookmarks. The key policy must allow the job roles and, for log encryption, the logs.region.amazonaws.com service principal."
    fr: "Une configuration de sécurité Glue attachée à une tâche ETL chiffre ses cibles S3, ses journaux CloudWatch et ses signets de tâche. La politique de clé doit autoriser les rôles des tâches et, pour le chiffrement des journaux, le principal de service logs.region.amazonaws.com."
  options:
    a:
      en: "Bucket default encryption covers the S3 output only, not the CloudWatch logs or the job bookmarks."
      fr: "Le chiffrement par défaut du compartiment ne couvre que la sortie S3, pas les journaux CloudWatch ni les signets de tâche."
    b:
      en: "Data Catalog encryption protects catalog metadata, not job output, logs, or bookmarks."
      fr: "Le chiffrement du Data Catalog protège les métadonnées du catalogue, pas la sortie, les journaux ni les signets des tâches."
    c:
      en: "SSE-S3 uses Amazon S3 managed keys, not the customer managed KMS key, and it covers only the S3 output."
      fr: "SSE-S3 utilise des clés gérées par Amazon S3, pas la clé KMS gérée par le client, et ne couvre que la sortie S3."
references:
  - title: Encrypting data written by AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/encryption-security-configuration.html
