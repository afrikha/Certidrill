id: deac01-4c-smus-subscribe-asset
objective: "4.5.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses Amazon SageMaker Unified Studio and Amazon SageMaker Catalog. The sales data project has published a Lake Formation-managed AWS Glue table named orders to the catalog. Analysts in the marketing project need to query the table with Amazon Athena. Governance rules require that every access be requested with a justification and approved by the data owners, and that the analysts get no other access to the sales data project.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise Amazon SageMaker Unified Studio et Amazon SageMaker Catalog. Le projet de données de ventes a publié dans le catalogue une table AWS Glue gérée par Lake Formation nommée orders. Les analystes du projet marketing doivent interroger cette table avec Amazon Athena. Les règles de gouvernance exigent que chaque accès soit demandé avec une justification et approuvé par les propriétaires des données, et que les analystes n'obtiennent aucun autre accès au projet de données de ventes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the marketing analysts to the sales data project as contributors so that they can query the orders table.", fr: "Ajouter les analystes marketing au projet de données de ventes en tant que contributeurs afin qu'ils puissent interroger la table orders." } }
    - { id: b, text: { en: "From the marketing project, request a subscription to the orders asset with a justification, for approval by the sales data project.", fr: "Depuis le projet marketing, demander un abonnement à la ressource (asset) orders avec une justification, soumise à l'approbation du projet de données de ventes." } }
    - { id: c, text: { en: "Have a data lake administrator grant SELECT on the orders table in Lake Formation directly to each analyst's IAM role.", fr: "Demander à un administrateur du lac de données d'accorder SELECT sur la table orders dans Lake Formation directement au rôle IAM de chaque analyste." } }
    - { id: d, text: { en: "Have the sales data project export the orders table every day to an S3 bucket that the marketing project can read.", fr: "Demander au projet de données de ventes d'exporter chaque jour la table orders vers un compartiment S3 que le projet marketing peut lire." } }
answer: { optionId: b }
explanation:
  correct:
    en: "In SageMaker Catalog, a member of a project searches the catalog and submits a subscription request with a justification; a member of the owning project approves or rejects it. For managed assets such as Lake Formation-managed Glue tables, the service then fulfills the grant, and the subscribing project gets access to that asset only."
    fr: "Dans SageMaker Catalog, un membre d'un projet recherche dans le catalogue et soumet une demande d'abonnement avec une justification ; un membre du projet propriétaire l'approuve ou la rejette. Pour les ressources gérées, comme les tables Glue gérées par Lake Formation, le service exécute ensuite l'octroi, et le projet abonné obtient l'accès à cette seule ressource."
  options:
    a:
      en: "Project membership gives access to the project's tools, data, and assets, far beyond the single table, and skips the request workflow."
      fr: "L'appartenance au projet donne accès aux outils, aux données et aux ressources du projet, bien au-delà de la seule table, et contourne le processus de demande."
    c:
      en: "Direct Lake Formation grants bypass the catalog, so there is no justification or owner approval for the access."
      fr: "Des autorisations Lake Formation directes contournent le catalogue : l'accès n'a ni justification ni approbation du propriétaire."
    d:
      en: "Exporting creates an ungoverned copy of the data with no request and no approval."
      fr: "L'exportation crée une copie non gouvernée des données, sans demande ni approbation."
references:
