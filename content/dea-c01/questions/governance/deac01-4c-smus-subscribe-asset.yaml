    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/subscribe-to-data-assets-managed.html
  - title: Data discovery, subscription, and consumption
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/discover-data.html
