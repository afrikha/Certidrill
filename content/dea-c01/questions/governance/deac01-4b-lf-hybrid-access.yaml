id: deac01-4b-lf-hybrid-access
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an Amazon S3 data lake cataloged in the AWS Glue Data Catalog. Forty AWS Glue ETL jobs access the tables through IAM policies, and the company cannot change or retest them this quarter. A new analyst team must start querying the same tables with Amazon Athena now, with column-level permissions managed in AWS Lake Formation.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'un lac de données Amazon S3 catalogué dans le AWS Glue Data Catalog. Quarante tâches ETL AWS Glue accèdent aux tables via des politiques IAM, et l'entreprise ne peut ni les modifier ni les retester ce trimestre. Une nouvelle équipe d'analystes doit commencer dès maintenant à interroger les mêmes tables avec Amazon Athena, avec des autorisations au niveau des colonnes gérées dans AWS Lake Formation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Register the S3 locations in Lake Formation mode, revoke IAMAllowedPrincipals, and grant Lake Formation permissions to the analysts.", fr: "Enregistrer les emplacements S3 en mode Lake Formation, révoquer IAMAllowedPrincipals, et accorder des autorisations Lake Formation aux analystes." } }
    - { id: b, text: { en: "Keep IAM-only access control and add S3 bucket policy statements that allow the analysts to read only some columns.", fr: "Conserver le contrôle d'accès IAM uniquement et ajouter des instructions de politique de compartiment S3 qui n'autorisent les analystes à lire que certaines colonnes." } }
    - { id: c, text: { en: "Copy the tables into a second database for the analysts, and register only the copy with Lake Formation.", fr: "Copier les tables dans une seconde base de données pour les analystes, et n'enregistrer que la copie auprès de Lake Formation." } }
    - { id: d, text: { en: "Register the S3 locations in hybrid access mode, grant Lake Formation permissions to the analysts, and opt them in for the tables.", fr: "Enregistrer les emplacements S3 en mode d'accès hybride, accorder des autorisations Lake Formation aux analystes, et les inscrire (opt in) pour les tables." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Hybrid access mode lets Lake Formation permissions apply only to the principals that are opted in for specific Data Catalog objects. The analysts get column-level control through Lake Formation, while the Glue jobs keep using their IAM policies for Amazon S3 and AWS Glue."
    fr: "Le mode d'accès hybride applique les autorisations Lake Formation uniquement aux principaux inscrits pour des objets précis du Data Catalog. Les analystes obtiennent un contrôle au niveau des colonnes via Lake Formation, tandis que les tâches Glue continuent d'utiliser leurs politiques IAM pour Amazon S3 et AWS Glue."
  options:
    a:
      en: "Full Lake Formation mode would cut off the Glue jobs until each one receives Lake Formation grants and is retested."
      fr: "Le mode Lake Formation complet couperait l'accès des tâches Glue jusqu'à ce que chacune reçoive des autorisations Lake Formation et soit retestée."
    b:
      en: "S3 bucket policies act on objects and prefixes; they cannot restrict the columns of a table."
      fr: "Les politiques de compartiment S3 portent sur des objets et des préfixes ; elles ne peuvent pas restreindre les colonnes d'une table."
    c:
      en: "A copy duplicates storage and needs a pipeline to stay current, while hybrid access mode governs the existing tables directly."
      fr: "Une copie duplique le stockage et exige un pipeline pour rester à jour, alors que le mode d'accès hybride gouverne directement les tables existantes."
references:
  - title: Hybrid access mode
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/hybrid-access-mode.html
