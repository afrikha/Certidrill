id: deac01-4c-macie-lf-tag-pii
objective: "4.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's data lake in Amazon S3 is cataloged in the AWS Glue Data Catalog and governed by AWS Lake Formation with LF-tag-based access control. Analysts are granted SELECT on tables that have the LF-tag classification=general. Producers add new tables every day, and some of them contain PII. The company wants the PII to be discovered automatically and each affected table to become inaccessible to the analysts, with the LEAST manual effort.

    Which solution will meet these requirements?
  fr: |
    Le lac de données Amazon S3 d'AnyCompany est catalogué dans AWS Glue Data Catalog et gouverné par AWS Lake Formation avec un contrôle d'accès basé sur les balises LF (LF-tags). Les analystes disposent de SELECT sur les tables qui portent la balise LF classification=general. Les producteurs ajoutent de nouvelles tables chaque jour, et certaines contiennent des PII. L'entreprise veut que les PII soient découvertes automatiquement et que chaque table concernée devienne inaccessible aux analystes, avec le MOINS d'effort manuel possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an AWS Glue crawler with a custom classifier on the new data, and let the crawler set the LF-tag of the tables that contain PII.", fr: "Exécuter un robot d'analyse AWS Glue avec un classifieur personnalisé sur les nouvelles données, et laisser le robot définir la balise LF des tables qui contiennent des PII." } }
    - { id: b, text: { en: "Use Amazon Macie to scan the buckets, and have a data steward review each finding and update the table's LF-tag by hand.", fr: "Utiliser Amazon Macie pour analyser les compartiments, et faire examiner chaque résultat par un responsable des données qui met à jour à la main la balise LF de la table." } }
    - { id: c, text: { en: "Turn on Amazon GuardDuty S3 Protection, and use its findings to remove the analysts' Lake Formation grants on the affected tables.", fr: "Activer Amazon GuardDuty S3 Protection, et utiliser ses résultats pour retirer les autorisations Lake Formation des analystes sur les tables concernées." } }
    - { id: d, text: { en: "Use Amazon Macie with an Amazon EventBridge rule that invokes an AWS Lambda function to set classification=pii on the affected table.", fr: "Utiliser Amazon Macie avec une règle Amazon EventBridge qui invoque une fonction AWS Lambda pour définir classification=pii sur la table concernée." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Macie discovers PII in S3 objects and publishes its findings to EventBridge, which can route them in near real time to a Lambda function. The function changes the LF-tag of the table that maps to the affected S3 location to classification=pii; because the analysts' grant is on classification=general, Lake Formation stops giving them access to that table."
    fr: "Macie découvre les PII dans les objets S3 et publie ses résultats dans EventBridge, qui peut les acheminer en temps quasi réel vers une fonction Lambda. La fonction remplace la balise LF de la table correspondant à l'emplacement S3 concerné par classification=pii ; comme l'autorisation des analystes porte sur classification=general, Lake Formation cesse de leur donner accès à cette table."
  options:
    a:
      en: "Crawler classifiers infer the schema and format of the data; they do not detect PII or assign LF-tags."
      fr: "Les classifieurs des robots d'analyse déduisent le schéma et le format des données ; ils ne détectent pas les PII et n'attribuent pas de balises LF."
    b:
      en: "Reviewing and retagging each table by hand is the manual effort that the company wants to avoid with daily new tables."
      fr: "Examiner et rebaliser chaque table à la main est l'effort manuel que l'entreprise veut éviter avec de nouvelles tables chaque jour."
    c:
      en: "GuardDuty S3 Protection detects threats and suspicious access, not PII in the content of objects."
      fr: "GuardDuty S3 Protection détecte les menaces et les accès suspects, pas les PII dans le contenu des objets."
references:
  - title: What is Amazon Macie?
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
  - title: Lake Formation tag-based access control
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/tag-based-access-control.html
