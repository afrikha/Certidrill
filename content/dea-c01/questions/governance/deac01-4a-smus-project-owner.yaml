id: deac01-4a-smus-project-owner
objective: "4.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer created a project in Amazon SageMaker Unified Studio and added a colleague to it as a Contributor. While the engineer is on leave, the colleague must be able to add analysts to the project and remove them. The colleague must not receive permissions outside this project.

    What should the engineer do?
  fr: |
    Un ingénieur des données a créé un projet dans Amazon SageMaker Unified Studio et y a ajouté un collègue comme Contributor. Pendant le congé de l'ingénieur, le collègue doit pouvoir ajouter des analystes au projet et les en retirer. Le collègue ne doit pas recevoir d'autorisations en dehors de ce projet.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Ask a domain administrator to add the colleague as an owner of the domain unit that contains the project.", fr: "Demander à un administrateur du domaine d'ajouter le collègue comme propriétaire de l'unité de domaine qui contient le projet." } }
    - { id: b, text: { en: "Ask a domain administrator to grant the colleague the project creation policy in the domain unit.", fr: "Demander à un administrateur du domaine d'accorder au collègue la politique de création de projets dans l'unité de domaine." } }
    - { id: c, text: { en: "Change the colleague's role in the project members list from Contributor to Owner.", fr: "Changer le rôle du collègue dans la liste des membres du projet de Contributor à Owner." } }
    - { id: d, text: { en: "Ask a domain administrator to make the colleague an administrator of the domain.", fr: "Demander à un administrateur du domaine de faire du collègue un administrateur du domaine." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Project owners can add and remove project members, edit the project, and delete it; contributors can only contribute to the project. Making the colleague an owner of this project grants member management for this project only.
    fr: |
      Les propriétaires d'un projet peuvent ajouter et retirer des membres, modifier le projet et le supprimer ; les contributeurs peuvent seulement contribuer au projet. Faire du collègue un propriétaire de ce projet lui donne la gestion des membres pour ce projet uniquement.
  options:
    a:
      en: |
        Domain unit ownership gives authority over the policies of the whole domain unit, which goes beyond this project.
      fr: |
        La propriété d'une unité de domaine donne autorité sur les politiques de toute l'unité, ce qui dépasse ce projet.
    b:
      en: |
        The project creation policy lets a user create new projects; it does not let the colleague manage members of this project.
      fr: |
        La politique de création de projets permet à un utilisateur de créer de nouveaux projets ; elle ne permet pas au collègue de gérer les membres de ce projet.
    d:
      en: |
        A domain administrator manages the whole domain, far more than the colleague needs.
      fr: |
        Un administrateur de domaine gère tout le domaine, bien plus que ce dont le collègue a besoin.
references:
  - title: Add project members
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/add-project-members.html
