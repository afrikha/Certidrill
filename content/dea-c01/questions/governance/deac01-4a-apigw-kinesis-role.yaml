id: deac01-4a-apigw-kinesis-role
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company exposes a REST API in Amazon API Gateway so that partners can send telemetry. Each POST request must write a record to an Amazon Kinesis data stream through an AWS service integration, without an AWS Lambda function.

    Which configuration will allow API Gateway to write to the stream?
  fr: |
    Une entreprise de logistique expose une API REST dans Amazon API Gateway pour que des partenaires envoient de la télémétrie. Chaque requête POST doit écrire un enregistrement dans un flux de données Amazon Kinesis au moyen d'une intégration de service AWS, sans fonction AWS Lambda.

    Quelle configuration permet à API Gateway d'écrire dans le flux ?
body:
  options:
    - { id: a, text: { en: "Add a resource policy to the API that allows the partners' accounts to call kinesis:PutRecord on the stream.", fr: "Ajouter à l'API une politique de ressource qui autorise les comptes des partenaires à appeler kinesis:PutRecord sur le flux." } }
    - { id: b, text: { en: "Create a usage plan with an API key for each partner and associate the usage plan with the stream.", fr: "Créer un plan d'utilisation avec une clé d'API par partenaire et associer le plan d'utilisation au flux." } }
    - { id: c, text: { en: "Create an IAM role that API Gateway can assume with kinesis:PutRecord on the stream, and set it as the integration's execution role.", fr: "Créer un rôle IAM qu'API Gateway peut assumer avec kinesis:PutRecord sur le flux, et le définir comme rôle d'exécution de l'intégration." } }
    - { id: d, text: { en: "Attach a Kinesis write policy to the CloudWatch Logs role that is set in the API Gateway account settings.", fr: "Attacher une politique d'écriture Kinesis au rôle CloudWatch Logs défini dans les paramètres de compte d'API Gateway." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An AWS service integration calls Kinesis with the credentials of the execution role that you enter in the integration request. The role must trust API Gateway and allow the Kinesis action, here kinesis:PutRecord on the stream, ideally in a least-privilege custom policy.
    fr: |
      Une intégration de service AWS appelle Kinesis avec les informations d'identification du rôle d'exécution indiqué dans la requête d'intégration. Le rôle doit approuver API Gateway et autoriser l'action Kinesis, ici kinesis:PutRecord sur le flux, de préférence dans une politique personnalisée de moindre privilège.
  options:
    a:
      en: |
        An API resource policy controls who can invoke the API; it gives API Gateway no permission to call Kinesis.
      fr: |
        Une politique de ressource d'API contrôle qui peut appeler l'API ; elle ne donne à API Gateway aucune autorisation d'appeler Kinesis.
    b:
      en: |
        Usage plans and API keys meter and throttle API clients; they cannot be associated with a Kinesis stream and grant no AWS permissions.
      fr: |
        Les plans d'utilisation et les clés d'API mesurent et limitent les clients de l'API ; ils ne peuvent pas être associés à un flux Kinesis et n'accordent aucune autorisation AWS.
    d:
      en: |
        The account-level CloudWatch Logs role only lets API Gateway write logs; integrations do not use it to call other services.
      fr: |
        Le rôle CloudWatch Logs de niveau compte permet seulement à API Gateway d'écrire des journaux ; les intégrations ne l'utilisent pas pour appeler d'autres services.
references:
  - title: "Tutorial: Create a REST API as an Amazon Kinesis proxy"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/integrating-api-with-aws-services-kinesis.html
