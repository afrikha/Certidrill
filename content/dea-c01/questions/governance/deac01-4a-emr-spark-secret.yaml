id: deac01-4a-emr-spark-secret
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A PySpark job on an Amazon EMR on EC2 cluster reads from an external PostgreSQL database. The credentials are hard-coded in the script:

    ```python
    jdbc_url = "jdbc:postgresql://db.example.com:5432/sales"
    props = {"user": "etl_reader", "password": "Example-Passw0rd"}
    df = spark.read.jdbc(jdbc_url, "public.orders", properties=props)
    ```

    The security team requires that the password be removed from the script and from the cluster configuration, stored encrypted, and rotated automatically.

    Which solution will meet these requirements?
  fr: |
    Une tâche PySpark sur un cluster Amazon EMR on EC2 lit une base de données PostgreSQL externe. Les informations d'identification sont codées en dur dans le script :

    ```python
    jdbc_url = "jdbc:postgresql://db.example.com:5432/sales"
    props = {"user": "etl_reader", "password": "Example-Passw0rd"}
    df = spark.read.jdbc(jdbc_url, "public.orders", properties=props)
    ```

    L'équipe de sécurité exige que le mot de passe soit retiré du script et de la configuration du cluster, stocké chiffré et soumis à une rotation automatique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the credentials in a Secrets Manager secret that the cluster's EC2 instance profile can read, and fetch it with the AWS SDK.", fr: "Stocker les informations d'identification dans un secret Secrets Manager lisible par le profil d'instance EC2 du cluster, et le récupérer avec le SDK AWS." } }
    - { id: b, text: { en: "Move the password to a spark-defaults configuration classification that is applied to every node when the cluster is created.", fr: "Déplacer le mot de passe dans une classification de configuration spark-defaults appliquée à chaque nœud à la création du cluster." } }
    - { id: c, text: { en: "Store the password in an Amazon EMR security configuration that turns on at-rest encryption, and attach it to the cluster.", fr: "Stocker le mot de passe dans une configuration de sécurité Amazon EMR qui active le chiffrement au repos, et l'attacher au cluster." } }
    - { id: d, text: { en: "Store the password in an S3 object encrypted with SSE-KMS and let the Amazon EMR service role read the object.", fr: "Stocker le mot de passe dans un objet S3 chiffré avec SSE-KMS et laisser le rôle de service Amazon EMR lire l'objet." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Secrets Manager stores the credentials encrypted and supports automatic rotation. Application processes on EMR cluster instances call other AWS services with the EC2 instance profile, so granting that role read access to the secret lets the script fetch the current password at run time.
    fr: |
      Secrets Manager stocke les informations d'identification chiffrées et prend en charge la rotation automatique. Les processus applicatifs des instances d'un cluster EMR appellent les autres services AWS avec le profil d'instance EC2 : accorder à ce rôle la lecture du secret permet au script de récupérer le mot de passe actuel à l'exécution.
  options:
    b:
      en: |
        A configuration classification keeps the password in the cluster configuration, which the requirement forbids, and offers no rotation.
      fr: |
        Une classification de configuration garde le mot de passe dans la configuration du cluster, ce que l'exigence interdit, et n'offre aucune rotation.
    c:
      en: |
        Security configurations set up data encryption, Kerberos authentication, and S3 authorization for EMRFS; they do not store application secrets.
      fr: |
        Les configurations de sécurité définissent le chiffrement des données, l'authentification Kerberos et l'autorisation S3 pour EMRFS ; elles ne stockent pas de secrets applicatifs.
    d:
      en: |
        An S3 object has no rotation, and the job code runs with the EC2 instance profile, not with the Amazon EMR service role.
      fr: |
        Un objet S3 n'a pas de rotation, et le code de la tâche s'exécute avec le profil d'instance EC2, pas avec le rôle de service Amazon EMR.
references:
  - title: Service role for cluster EC2 instances (EC2 instance profile)
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-iam-role-for-ec2.html
  - title: Use security configurations to set up Amazon EMR cluster security
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-security-configurations.html
