id: deac01-4a-custom-policy-glue-s3
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The IAM role of an AWS Glue job has the AmazonS3FullAccess managed policy. A security review finds that the job only needs to read objects under s3://anycompany-raw/sales/ and to write objects under s3://anycompany-curated/sales/. No AWS managed policy is limited to these locations.

    Which solution will meet these requirements?
  fr: |
    Le rôle IAM d'une tâche AWS Glue possède la politique gérée AmazonS3FullAccess. Un examen de sécurité constate que la tâche doit seulement lire des objets sous s3://anycompany-raw/sales/ et écrire des objets sous s3://anycompany-curated/sales/. Aucune politique gérée par AWS n'est limitée à ces emplacements.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace AmazonS3FullAccess with the AmazonS3ReadOnlyAccess managed policy on the job's role.", fr: "Remplacer AmazonS3FullAccess par la politique gérée AmazonS3ReadOnlyAccess sur le rôle de la tâche." } }
    - { id: b, text: { en: "Keep AmazonS3FullAccess and add bucket policies to both buckets that allow the job's role.", fr: "Conserver AmazonS3FullAccess et ajouter aux deux compartiments des politiques de compartiment qui autorisent le rôle de la tâche." } }
    - { id: c, text: { en: "Edit the AmazonS3FullAccess policy so that its Resource element lists only the two prefixes.", fr: "Modifier la politique AmazonS3FullAccess pour que son élément Resource ne liste que les deux préfixes." } }
    - { id: d, text: { en: "Replace AmazonS3FullAccess with a customer managed policy that allows only the needed actions on the two prefixes.", fr: "Remplacer AmazonS3FullAccess par une politique gérée par le client qui n'autorise que les actions nécessaires sur les deux préfixes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When no managed policy fits, you write a custom policy that lists only the needed actions (for example s3:GetObject on the raw prefix and s3:PutObject on the curated prefix) on the exact resources. A customer managed policy can also be reused and updated in one place.
    fr: |
      Quand aucune politique gérée ne convient, vous écrivez une politique personnalisée qui ne liste que les actions nécessaires (par exemple s3:GetObject sur le préfixe brut et s3:PutObject sur le préfixe organisé) sur les ressources exactes. Une politique gérée par le client peut aussi être réutilisée et mise à jour à un seul endroit.
  options:
    a:
      en: |
        Read-only access removes the write access that the job needs and still allows reading every bucket in the account.
      fr: |
        L'accès en lecture seule supprime l'accès en écriture dont la tâche a besoin et autorise toujours la lecture de tous les compartiments du compte.
    b:
      en: |
        Adding allow statements does not remove the broad permissions of AmazonS3FullAccess, so the role keeps access to every bucket.
      fr: |
        Ajouter des instructions d'autorisation ne retire pas les autorisations étendues d'AmazonS3FullAccess : le rôle garde l'accès à tous les compartiments.
    c:
      en: |
        You cannot change the permissions defined in AWS managed policies; AWS maintains them.
      fr: |
        Vous ne pouvez pas modifier les autorisations définies dans les politiques gérées par AWS ; c'est AWS qui les maintient.
references:
  - title: Managed policies and inline policies
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html
