id: deac01-4b-ctlake-new-customer-cw
objective: "4.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany opened its first AWS accounts in September 2026 and now has 40 accounts in AWS Organizations. The security team must run centralized queries, including SQL queries, over the AWS CloudTrail management events of every account and Region, and accounts added later must be covered automatically. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a ouvert ses premiers comptes AWS en septembre 2026 et compte désormais 40 comptes dans AWS Organizations. L'équipe de sécurité doit exécuter des requêtes centralisées, y compris des requêtes SQL, sur les événements de gestion AWS CloudTrail de tous les comptes et de toutes les Régions, et les comptes ajoutés plus tard doivent être couverts automatiquement. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an organization event data store in AWS CloudTrail Lake from the management account, and query it with SQL from the security account.", fr: "Créer un entrepôt de données d'événements d'organisation dans AWS CloudTrail Lake depuis le compte de gestion, et l'interroger en SQL depuis le compte de sécurité." } }
    - { id: b, text: { en: "Run a scheduled script in every account and Region that calls the CloudTrail LookupEvents API and merges the results centrally.", fr: "Exécuter dans chaque compte et Région un script planifié qui appelle l'API CloudTrail LookupEvents et fusionne les résultats de façon centrale." } }
    - { id: c, text: { en: "Create an organization CloudWatch telemetry enablement rule for CloudTrail events, centralize the logs, and query them with Logs Insights.", fr: "Créer une règle d'activation de télémétrie CloudWatch d'organisation pour les événements CloudTrail, centraliser les journaux, et les interroger avec Logs Insights." } }
    - { id: d, text: { en: "Create a trail in each account that sends events to a local CloudWatch Logs log group, and query each group in turn.", fr: "Créer dans chaque compte un journal de suivi qui envoie les événements vers un groupe de journaux CloudWatch Logs local, et interroger chaque groupe tour à tour." } }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudTrail Lake has been closed to new customers since May 31, 2026, and AWS recommends Amazon CloudWatch for similar capabilities. An organization-level telemetry enablement rule ingests CloudTrail events through a service-linked channel for matching accounts, centralization rules copy them to one account, and Logs Insights supports SQL as well as its own query language and PPL."
    fr: "CloudTrail Lake est fermé aux nouveaux clients depuis le 31 mai 2026, et AWS recommande Amazon CloudWatch pour des capacités similaires. Une règle d'activation de télémétrie au niveau de l'organisation ingère les événements CloudTrail via un canal lié à un service pour les comptes concernés, des règles de centralisation les copient dans un compte, et Logs Insights prend en charge SQL ainsi que son propre langage de requête et PPL."
  options:
    a:
      en: "A company that was not a CloudTrail Lake customer before May 31, 2026, cannot start using CloudTrail Lake."
      fr: "Une entreprise qui n'était pas cliente de CloudTrail Lake avant le 31 mai 2026 ne peut pas commencer à l'utiliser."
    b:
      en: "Event history covers only 90 days per Region and account, and a custom multi-account script adds heavy overhead."
      fr: "L'historique des événements ne couvre que 90 jours par Région et par compte, et un script multicompte personnalisé ajoute une lourde charge."
    d:
      en: "Per-account trails and log groups give no central query, and new accounts would need manual setup."
      fr: "Des journaux de suivi et des groupes de journaux par compte n'offrent aucune requête centrale, et les nouveaux comptes exigeraient une configuration manuelle."
references:
  - title: CloudTrail Lake availability change
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-lake-service-availability-change.html
  - title: Telemetry enablement rules
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/telemetry-config-rules.html
