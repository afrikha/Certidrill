id: deac01-4a-emr-bpa-web-ui
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany launches Amazon EMR clusters in a public subnet. Analysts in the office, whose public address range is 203.0.113.0/24, must open a web interface that listens on port 18080 on the primary node. An engineer adds an inbound rule for port 18080 from 0.0.0.0/0 to the primary node's security group, and the next cluster launch fails. The account uses the default Amazon EMR block public access settings, and the security team wants to keep that protection fully in place.

    Which solution will meet these requirements?
  fr: |
    AnyCompany lance des clusters Amazon EMR dans un sous-réseau public. Les analystes du bureau, dont la plage d'adresses publiques est 203.0.113.0/24, doivent ouvrir une interface web qui écoute sur le port 18080 du nœud primaire. Un ingénieur ajoute au groupe de sécurité du nœud primaire une règle entrante pour le port 18080 depuis 0.0.0.0/0, et le lancement de cluster suivant échoue. Le compte utilise les paramètres par défaut du blocage de l'accès public d'Amazon EMR, et l'équipe de sécurité veut conserver entièrement cette protection.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add port 18080 as a port range exception in the block public access configuration.", fr: "Ajouter le port 18080 comme exception de plage de ports dans la configuration du blocage de l'accès public." } }
    - { id: b, text: { en: "Turn off block public access for the account in the Region, then launch the cluster.", fr: "Désactiver le blocage de l'accès public pour le compte dans la Région, puis lancer le cluster." } }
    - { id: c, text: { en: "Move the 0.0.0.0/0 rule for port 18080 to the security group of the core nodes.", fr: "Déplacer la règle 0.0.0.0/0 du port 18080 vers le groupe de sécurité des nœuds principaux (core)." } }
    - { id: d, text: { en: "Replace the rule with an inbound rule for port 18080 whose source is 203.0.113.0/24.", fr: "Remplacer la règle par une règle entrante pour le port 18080 dont la source est 203.0.113.0/24." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Block public access, turned on by default, stops a cluster launch when a cluster security group allows inbound traffic from 0.0.0.0/0 or ::/0 on a port that is not an exception (port 22 is the default exception). A rule limited to the office range is not public, so the cluster launches and the analysts reach port 18080 while the protection stays unchanged.
    fr: |
      Le blocage de l'accès public, activé par défaut, empêche le lancement d'un cluster quand un groupe de sécurité du cluster autorise le trafic entrant depuis 0.0.0.0/0 ou ::/0 sur un port qui n'est pas une exception (le port 22 est l'exception par défaut). Une règle limitée à la plage du bureau n'est pas publique : le cluster se lance et les analystes atteignent le port 18080, sans modifier la protection.
  options:
    a:
      en: |
        An exception leaves port 18080 open to the whole internet on every cluster of the account, so the protection is weakened; AWS recommends a rule with specific source addresses instead.
      fr: |
        Une exception laisse le port 18080 ouvert à tout Internet sur chaque cluster du compte : la protection est affaiblie. AWS recommande plutôt une règle avec des adresses sources précises.
    b:
      en: |
        Turning the feature off removes the protection for all clusters in the Region, which the security team refuses.
      fr: |
        Désactiver la fonctionnalité supprime la protection pour tous les clusters de la Région, ce que l'équipe de sécurité refuse.
    c:
      en: |
        Block public access checks every security group of the cluster, so the public rule still blocks the launch, and the web interface runs on the primary node anyway.
      fr: |
        Le blocage de l'accès public vérifie chaque groupe de sécurité du cluster : la règle publique bloque toujours le lancement, et l'interface web s'exécute de toute façon sur le nœud primaire.
references:
  - title: Using Amazon EMR block public access
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-block-public-access.html
