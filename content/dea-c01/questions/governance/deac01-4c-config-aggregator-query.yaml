id: deac01-4c-config-aggregator-query
objective: "4.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 40 AWS accounts in AWS Organizations across three Regions, and AWS Config records resources in every account and Region. The data governance team needs to run SQL-like queries from one account against the current configuration of all Amazon Redshift clusters and Amazon S3 buckets, for example to list the clusters that are not encrypted. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 40 comptes AWS dans AWS Organizations, répartis sur trois Régions, et AWS Config enregistre les ressources dans chaque compte et chaque Région. L'équipe de gouvernance des données doit exécuter, depuis un seul compte, des requêtes de type SQL sur la configuration actuelle de tous les clusters Amazon Redshift et de tous les compartiments Amazon S3, par exemple pour lister les clusters non chiffrés. La solution doit avoir le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run AWS Config advanced queries separately in each account and Region, and combine the results in a spreadsheet.", fr: "Exécuter des requêtes avancées AWS Config séparément dans chaque compte et chaque Région, et combiner les résultats dans une feuille de calcul." } }
    - { id: b, text: { en: "Create an AWS Config organization aggregator in a central account, and run advanced queries against it.", fr: "Créer un agrégateur d'organisation AWS Config dans un compte central, et exécuter des requêtes avancées sur celui-ci." } }
    - { id: c, text: { en: "Create an organization trail in AWS CloudTrail, and query the management events of all accounts with Amazon Athena.", fr: "Créer un journal de suivi d'organisation AWS CloudTrail, et interroger les événements de gestion de tous les comptes avec Amazon Athena." } }
    - { id: d, text: { en: "Enable AWS Security Hub CSPM in every account and Region, and filter its findings by resource type.", fr: "Activer AWS Security Hub CSPM dans chaque compte et chaque Région, et filtrer ses résultats par type de ressource." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Advanced queries use a subset of SQL SELECT syntax on the current configuration items recorded by AWS Config. An organization aggregator collects configuration and compliance data from all accounts and Regions into one account, without authorization steps for organization members, and the same queries run against it."
    fr: "Les requêtes avancées utilisent un sous-ensemble de la syntaxe SQL SELECT sur les éléments de configuration actuels enregistrés par AWS Config. Un agrégateur d'organisation rassemble dans un seul compte les données de configuration et de conformité de tous les comptes et de toutes les Régions, sans étape d'autorisation pour les membres de l'organisation, et les mêmes requêtes s'exécutent sur cet agrégateur."
  options:
    a:
      en: "Querying 120 account and Region pairs one by one and merging the results by hand is the most operational overhead."
      fr: "Interroger une à une 120 paires compte-Région et fusionner les résultats à la main représente le plus de charge opérationnelle."
    c:
      en: "CloudTrail records API calls; it does not provide the current configuration state of each resource."
      fr: "CloudTrail enregistre les appels d'API ; il ne fournit pas l'état de configuration actuel de chaque ressource."
    d:
      en: "Security Hub CSPM reports findings from security checks, not a queryable inventory of resource configurations."
      fr: "Security Hub CSPM signale les résultats de contrôles de sécurité, pas un inventaire interrogeable des configurations de ressources."
references:
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
  - title: Querying the Current Configuration State of AWS Resources with AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/querying-AWS-resources.html
