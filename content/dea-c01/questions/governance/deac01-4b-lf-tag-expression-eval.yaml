id: deac01-4b-lf-tag-expression-eval
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS Lake Formation tag-based access control (LF-TBAC). A data lake administrator grants SELECT on tables to the `analysts` role with the LF-Tag expression `domain=sales` AND `classification=public,internal`. The Data Catalog contains the following resources:

    - Table `t1`: `domain=sales`, `classification=confidential`
    - Table `t2`: `domain=sales`, `classification=internal`
    - Table `t3`: `domain=marketing`, `classification=public`
    - Database `db4` tagged `domain=sales`, which contains table `t4` tagged `classification=public`

    No other LF-Tags are assigned. Which tables can the `analysts` role query?
  fr: |
    AnyCompany utilise le contrôle d'accès basé sur les balises d'AWS Lake Formation (LF-TBAC). Un administrateur du lac de données accorde SELECT sur les tables au rôle `analysts` avec l'expression de LF-Tags `domain=sales` AND `classification=public,internal`. Le Data Catalog contient les ressources suivantes :

    - Table `t1` : `domain=sales`, `classification=confidential`
    - Table `t2` : `domain=sales`, `classification=internal`
    - Table `t3` : `domain=marketing`, `classification=public`
    - Base de données `db4` balisée `domain=sales`, qui contient la table `t4` balisée `classification=public`

    Aucune autre LF-Tag n'est attribuée. Quelles tables le rôle `analysts` peut-il interroger ?
body:
  options:
    - { id: a, text: { en: "t2 and t4 only", fr: "t2 et t4 uniquement" } }
    - { id: b, text: { en: "t2 only", fr: "t2 uniquement" } }
    - { id: c, text: { en: "t1, t2, and t4", fr: "t1, t2 et t4" } }
    - { id: d, text: { en: "t2, t3, and t4", fr: "t2, t3 et t4" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Several values of one key form an OR, and several keys form an AND, so a table needs domain=sales and a classification of public or internal. Tables inherit LF-Tags from their database, so t4 gets domain=sales from db4 and matches, like t2."
    fr: "Plusieurs valeurs d'une même clé forment un OR, et plusieurs clés forment un AND : une table doit avoir domain=sales et une classification public ou internal. Les tables héritent des LF-Tags de leur base de données : t4 reçoit domain=sales de db4 et correspond, comme t2."
  options:
    b:
      en: "t4 also matches because it inherits domain=sales from database db4."
      fr: "t4 correspond aussi, car elle hérite de domain=sales de la base de données db4."
    c:
      en: "t1 is classified confidential, which is not one of the values in the expression."
      fr: "t1 est classée confidential, qui ne fait pas partie des valeurs de l'expression."
    d:
      en: "t3 has the domain marketing; both keys of the expression must match, not just one."
      fr: "t3 a le domaine marketing ; les deux clés de l'expression doivent correspondre, pas une seule."
references:
  - title: Granting data lake permissions using the LF-TBAC method
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/granting-catalog-perms-TBAC.html
  - title: Lake Formation tag-based access control
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/tag-based-access-control.html
