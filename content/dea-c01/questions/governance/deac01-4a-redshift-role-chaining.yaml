id: deac01-4a-redshift-role-chaining
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon Redshift provisioned cluster in account A (111111111111) must load data with the COPY command from an Amazon S3 bucket in account B (222222222222). The role RoleA is associated with the cluster. The security team of account B requires that the bucket be accessed only through RoleB, an IAM role in account B that it controls, and it forbids long-term credentials.

    Which solution will meet these requirements?
  fr: |
    Un cluster provisionné Amazon Redshift du compte A (111111111111) doit charger des données avec la commande COPY depuis un compartiment Amazon S3 du compte B (222222222222). Le rôle RoleA est associé au cluster. L'équipe de sécurité du compte B exige que le compartiment ne soit accessible que par RoleB, un rôle IAM du compte B qu'elle contrôle, et interdit les informations d'identification à long terme.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Associate RoleB directly with the cluster in account A, then run COPY with only the ARN of RoleB in IAM_ROLE.", fr: "Associer directement RoleB au cluster du compte A, puis exécuter COPY avec uniquement l'ARN de RoleB dans IAM_ROLE." } }
    - { id: b, text: { en: "Let RoleA assume RoleB, make RoleB trust RoleA, and run COPY with IAM_ROLE set to the ARNs of RoleA and RoleB, separated by a comma.", fr: "Permettre à RoleA d'assumer RoleB, faire approuver RoleA par RoleB, et exécuter COPY avec IAM_ROLE défini sur les ARN de RoleA et RoleB séparés par une virgule." } }
    - { id: c, text: { en: "Add a bucket policy in account B that grants RoleA read access, then run COPY with only the ARN of RoleA in IAM_ROLE.", fr: "Ajouter dans le compte B une politique de compartiment qui accorde à RoleA l'accès en lecture, puis exécuter COPY avec uniquement l'ARN de RoleA dans IAM_ROLE." } }
    - { id: d, text: { en: "Create an IAM user in account B with read access to the bucket, then run COPY with that user's access key ID and secret access key.", fr: "Créer un utilisateur IAM dans le compte B avec un accès en lecture au compartiment, puis exécuter COPY avec l'ID de clé d'accès et la clé d'accès secrète de cet utilisateur." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Amazon Redshift chains roles listed as comma-separated ARNs, with no spaces, in the IAM_ROLE parameter: the cluster assumes RoleA, which assumes RoleB for the duration of the command. RoleA needs permission to assume RoleB, and RoleB's trust policy must trust RoleA or account A.
    fr: |
      Amazon Redshift enchaîne les rôles indiqués sous forme d'ARN séparés par des virgules, sans espace, dans le paramètre IAM_ROLE : le cluster assume RoleA, qui assume RoleB pendant la durée de la commande. RoleA a besoin de l'autorisation d'assumer RoleB, et la politique d'approbation de RoleB doit approuver RoleA ou le compte A.
  options:
    a:
      en: |
        An IAM role can be associated with a Redshift cluster only when the role and the cluster belong to the same AWS account.
      fr: |
        Un rôle IAM ne peut être associé à un cluster Redshift que si le rôle et le cluster appartiennent au même compte AWS.
    c:
      en: |
        A bucket policy for RoleA would work technically, but it bypasses RoleB, which account B requires as the only access path.
      fr: |
        Une politique de compartiment pour RoleA fonctionnerait techniquement, mais elle contourne RoleB, que le compte B exige comme seul chemin d'accès.
    d:
      en: |
        Access keys of an IAM user are long-term credentials, which account B forbids.
      fr: |
        Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme, ce que le compte B interdit.
references:
  - title: Chaining IAM roles in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/authorizing-redshift-service-chaining-roles.html
  - title: Associating IAM roles with clusters
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/copy-unload-iam-role-associating-with-clusters.html
