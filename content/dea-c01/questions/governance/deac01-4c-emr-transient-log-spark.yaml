id: deac01-4c-emr-transient-log-spark
objective: "4.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company stores about 40 TB of new web server and CDN log files in Amazon S3 every day. Data engineers have existing Apache Spark code that sessionizes the logs with custom open-source libraries and writes aggregated Parquet files back to Amazon S3. The job runs once a day. The company wants to run it in the MOST cost-effective way without rewriting the code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias stocke chaque jour environ 40 To de nouveaux fichiers journaux de serveurs web et de CDN dans Amazon S3. Les ingénieurs des données disposent d'un code Apache Spark existant qui reconstitue les sessions à partir des journaux avec des bibliothèques open source personnalisées et réécrit des fichiers Parquet agrégés dans Amazon S3. La tâche s'exécute une fois par jour. L'entreprise veut l'exécuter de la manière la PLUS rentable possible, sans réécrire le code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Trigger an AWS Lambda function for each new log object that parses the file and writes partial aggregates to Amazon S3.", fr: "Déclencher pour chaque nouvel objet journal une fonction AWS Lambda qui analyse le fichier et écrit des agrégats partiels dans Amazon S3." } }
    - { id: b, text: { en: "Ingest the log files into Amazon CloudWatch Logs, and run CloudWatch Logs Insights queries that sessionize them each day.", fr: "Ingérer les fichiers journaux dans Amazon CloudWatch Logs, et exécuter chaque jour des requêtes CloudWatch Logs Insights qui reconstituent les sessions." } }
    - { id: c, text: { en: "Run the Spark job on a long-running Amazon EMR cluster that is sized for the daily run and kept running between runs.", fr: "Exécuter la tâche Spark sur un cluster Amazon EMR de longue durée, dimensionné pour l'exécution quotidienne et maintenu entre les exécutions." } }
    - { id: d, text: { en: "Run the Spark job as a step on a transient Amazon EMR cluster that terminates automatically after the last step completes.", fr: "Exécuter la tâche Spark comme étape d'un cluster Amazon EMR transitoire qui se résilie automatiquement à la fin de la dernière étape." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon EMR runs big data frameworks such as Apache Spark to process vast amounts of data, so the existing Spark code and its libraries run unchanged. A transient cluster starts, runs its steps, and terminates its EC2 instances when the last step completes, which suits a daily job because the company pays only for processing time."
    fr: "Amazon EMR exécute des frameworks big data comme Apache Spark pour traiter de très grands volumes de données : le code Spark existant et ses bibliothèques s'exécutent sans modification. Un cluster transitoire démarre, exécute ses étapes et résilie ses instances EC2 à la fin de la dernière étape, ce qui convient à une tâche quotidienne, car l'entreprise ne paie que le temps de traitement."
  options:
    a:
      en: "Per-object Lambda functions cannot run the Spark code or build sessions that span many files, so the logic would have to be rewritten."
      fr: "Des fonctions Lambda par objet ne peuvent ni exécuter le code Spark ni reconstituer des sessions qui couvrent de nombreux fichiers : la logique devrait être réécrite."
    b:
      en: "Ingesting 40 TB a day into CloudWatch Logs is costly, and the Spark logic would have to be rewritten as queries."
      fr: "Ingérer 40 To par jour dans CloudWatch Logs est coûteux, et la logique Spark devrait être réécrite sous forme de requêtes."
    c:
      en: "A long-running cluster accrues charges between the daily runs, so it is less cost-effective than a transient cluster."
      fr: "Un cluster de longue durée est facturé entre les exécutions quotidiennes : il est moins rentable qu'un cluster transitoire."
references:
  - title: Configuring an Amazon EMR cluster to continue or terminate after step execution
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-longrunning-transient.html
  - title: What is Amazon EMR?
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-what-is-emr.html
