id: deac01-4c-kms-cloudhsm-keystore
objective: "4.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A government agency is building a data lake in Amazon S3 and a data warehouse in Amazon Redshift, both encrypted with AWS KMS keys. Its sovereignty rules require that the key material be generated and used only in hardware security modules (HSMs) of a cluster that the agency owns and manages in its own AWS account. The keys are symmetric encryption keys.

    Which solution will meet these requirements?
  fr: |
    Une agence gouvernementale construit un lac de données dans Amazon S3 et un entrepôt de données dans Amazon Redshift, tous deux chiffrés avec des clés AWS KMS. Ses règles de souveraineté exigent que le matériel de clé soit généré et utilisé uniquement dans les modules de sécurité matériels (HSM) d'un cluster que l'agence possède et gère dans son propre compte AWS. Les clés sont des clés de chiffrement symétriques.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create the KMS keys in an AWS CloudHSM key store that is backed by an AWS CloudHSM cluster in the agency's account.", fr: "Créer les clés KMS dans un magasin de clés AWS CloudHSM adossé à un cluster AWS CloudHSM du compte de l'agence." } }
    - { id: b, text: { en: "Create the KMS keys in an external key store that connects to HSMs in the agency's on-premises data center.", fr: "Créer les clés KMS dans un magasin de clés externe connecté à des HSM du centre de données sur site de l'agence." } }
    - { id: c, text: { en: "Create the KMS keys with key material that is generated in the agency's on-premises HSMs and imported into AWS KMS.", fr: "Créer les clés KMS avec un matériel de clé généré dans les HSM sur site de l'agence et importé dans AWS KMS." } }
    - { id: d, text: { en: "Use the AWS managed keys of Amazon S3 and Amazon Redshift, which are created in the agency's account.", fr: "Utiliser les clés gérées par AWS d'Amazon S3 et d'Amazon Redshift, qui sont créées dans le compte de l'agence." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A CloudHSM key store is a custom key store backed by a CloudHSM cluster that you own and manage, in the same account and Region. AWS KMS generates non-extractable AES key material in that cluster and runs the cryptographic operations in its HSMs, while services such as S3 and Redshift use the keys like any other KMS key. Creating keys requires at least two active HSMs in different Availability Zones."
    fr: "Un magasin de clés CloudHSM est un magasin de clés personnalisé adossé à un cluster CloudHSM que vous possédez et gérez, dans le même compte et la même Région. AWS KMS génère dans ce cluster un matériel de clé AES non extractible et exécute les opérations cryptographiques dans ses HSM, tandis que des services comme S3 et Redshift utilisent ces clés comme n'importe quelle autre clé KMS. La création de clés exige au moins deux HSM actifs dans des zones de disponibilité différentes."
  options:
    b:
      en: "An external key store keeps the key material outside AWS, in HSMs on premises, not in a cluster in the agency's AWS account."
      fr: "Un magasin de clés externe conserve le matériel de clé hors d'AWS, dans des HSM sur site, et non dans un cluster du compte AWS de l'agence."
    c:
      en: "Imported key material is stored and used in the HSMs of AWS KMS, not in a cluster that the agency manages."
      fr: "Le matériel de clé importé est stocké et utilisé dans les HSM d'AWS KMS, pas dans un cluster géré par l'agence."
    d:
      en: "AWS managed keys are created and managed by AWS KMS in its own HSMs; the agency controls neither the HSMs nor the key material."
      fr: "Les clés gérées par AWS sont créées et gérées par AWS KMS dans ses propres HSM ; l'agence ne contrôle ni les HSM ni le matériel de clé."
references:
  - title: AWS CloudHSM key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-cloudhsm.html
  - title: External key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-external.html
