id: deac01-4c-cwlogs-central-firehose
objective: "4.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 60 AWS accounts in AWS Organizations. Applications and data pipelines in every account write logs to Amazon CloudWatch Logs in the same Region. The security team must copy these logs continuously, in near real time, to a central Amazon S3 bucket in a log archive account for long-term retention and Amazon Athena queries. The solution must not require custom code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 60 comptes AWS dans AWS Organizations. Les applications et les pipelines de données de chaque compte écrivent des journaux dans Amazon CloudWatch Logs dans la même Région. L'équipe de sécurité doit copier ces journaux en continu, en temps quasi réel, vers un compartiment Amazon S3 central d'un compte d'archivage des journaux, pour une conservation à long terme et des requêtes Amazon Athena. La solution ne doit pas nécessiter de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Schedule a CloudWatch Logs export task in each account every hour that exports the log groups to the central S3 bucket.", fr: "Planifier toutes les heures dans chaque compte une tâche d'exportation CloudWatch Logs qui exporte les groupes de journaux vers le compartiment S3 central." } }
    - { id: b, text: { en: "Create an organization trail in AWS CloudTrail that delivers the events of all member accounts to the central S3 bucket.", fr: "Créer dans AWS CloudTrail un journal de suivi d'organisation qui livre les événements de tous les comptes membres au compartiment S3 central." } }
    - { id: c, text: { en: "Create a CloudWatch Logs destination for a Firehose stream to the S3 bucket, and add subscription filters to the source log groups.", fr: "Créer une destination CloudWatch Logs pour un flux Firehose vers le compartiment S3, et ajouter des filtres d'abonnement aux groupes de journaux sources." } }
    - { id: d, text: { en: "Configure CloudWatch cross-account observability with the log archive account as the monitoring account, and query the source log groups from it.", fr: "Configurer l'observabilité intercompte CloudWatch avec le compte d'archivage comme compte de surveillance, et interroger les groupes de journaux sources depuis ce compte." } }
answer: { optionId: c }
explanation:
  correct:
    en: "For cross-account log sharing, the recipient account creates a Firehose stream that writes to Amazon S3 and a CloudWatch Logs destination that wraps it; the sender accounts then create subscription filters that send their log events to that destination. Subscriptions stream events continuously, and AWS recommends them, not export tasks, for continuous archiving."
    fr: "Pour le partage de journaux entre comptes, le compte destinataire crée un flux Firehose qui écrit dans Amazon S3 et une destination CloudWatch Logs qui l'encapsule ; les comptes émetteurs créent ensuite des filtres d'abonnement qui envoient leurs événements de journaux à cette destination. Les abonnements diffusent les événements en continu, et AWS les recommande, plutôt que les tâches d'exportation, pour l'archivage continu."
  options:
    a:
      en: "Export tasks are batch copies whose data can take up to 12 hours to become available; AWS recommends subscriptions, not regular exports, for continuous archiving."
      fr: "Les tâches d'exportation sont des copies par lots dont les données peuvent mettre jusqu'à 12 heures à être disponibles ; AWS recommande les abonnements, et non des exportations régulières, pour l'archivage continu."
    b:
      en: "CloudTrail records API activity, not the application and pipeline log events written to CloudWatch Logs."
      fr: "CloudTrail enregistre l'activité des API, pas les événements de journaux des applications et des pipelines écrits dans CloudWatch Logs."
    d:
      en: "Cross-account observability lets the monitoring account view and query the source logs, but it does not copy them to the central S3 bucket."
      fr: "L'observabilité intercompte permet au compte de surveillance de consulter et d'interroger les journaux sources, mais elle ne les copie pas dans le compartiment S3 central."
references:
  - title: Cross-account cross-Region log data sharing using Firehose
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CrossAccountSubscriptions-Firehose.html
  - title: Exporting log data to Amazon S3
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/S3Export.html
