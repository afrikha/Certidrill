id: deac01-4a-kinesis-endpoint-policy
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Producer applications on Amazon EC2 instances in a VPC write to Amazon Kinesis Data Streams through an interface VPC endpoint. The security team requires that the endpoint can be used to access only the stream orders-stream, even if an IAM role in the VPC has permissions on other streams.

    Which solution will meet these requirements?
  fr: |
    Des applications productrices sur des instances Amazon EC2 d'un VPC écrivent dans Amazon Kinesis Data Streams par un point de terminaison d'interface VPC. L'équipe de sécurité exige que le point de terminaison ne puisse servir qu'à accéder au flux orders-stream, même si un rôle IAM du VPC a des autorisations sur d'autres flux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Restrict the endpoint's security group to inbound HTTPS from the producers' security group.", fr: "Restreindre le groupe de sécurité du point de terminaison au trafic HTTPS entrant depuis le groupe de sécurité des producteurs." } }
    - { id: b, text: { en: "Attach a resource-based policy to orders-stream that allows the producers' IAM role to write records.", fr: "Attacher à orders-stream une politique basée sur les ressources qui autorise le rôle IAM des producteurs à écrire des enregistrements." } }
    - { id: c, text: { en: "Turn off private DNS on the endpoint and configure the producers to use the endpoint-specific DNS name.", fr: "Désactiver le DNS privé du point de terminaison et configurer les producteurs pour qu'ils utilisent le nom DNS propre au point de terminaison." } }
    - { id: d, text: { en: "Attach an endpoint policy to the interface endpoint that allows Kinesis actions only on the ARN of orders-stream.", fr: "Attacher au point de terminaison d'interface une politique de point de terminaison qui n'autorise les actions Kinesis que sur l'ARN d'orders-stream." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An endpoint policy is a resource-based policy on the VPC endpoint that limits what can be done through it; Kinesis Data Streams supports a policy that allows access only to a specific stream. It does not replace identity-based policies, so a request must be allowed by both, and requests for other streams through the endpoint are denied.
    fr: |
      Une politique de point de terminaison est une politique basée sur les ressources attachée au point de terminaison VPC qui limite ce qui peut être fait par son intermédiaire ; Kinesis Data Streams prend en charge une politique qui n'autorise l'accès qu'à un flux précis. Elle ne remplace pas les politiques basées sur l'identité : une requête doit être autorisée par les deux, et les requêtes vers d'autres flux par le point de terminaison sont refusées.
  options:
    a:
      en: |
        A security group filters network traffic by source and port; it cannot tell which stream a request targets.
      fr: |
        Un groupe de sécurité filtre le trafic réseau par source et par port ; il ne peut pas savoir quel flux une requête vise.
    b:
      en: |
        A stream policy controls access to orders-stream itself; it does not stop the endpoint from being used to reach other streams.
      fr: |
        Une politique de flux contrôle l'accès à orders-stream lui-même ; elle n'empêche pas d'utiliser le point de terminaison pour atteindre d'autres flux.
    c:
      en: |
        DNS settings change how producers reach the endpoint, not which streams the endpoint allows.
      fr: |
        Les paramètres DNS changent la façon dont les producteurs atteignent le point de terminaison, pas les flux que le point de terminaison autorise.
references:
  - title: Use Amazon Kinesis Data Streams with interface VPC endpoints
    url: https://docs.aws.amazon.com/streams/latest/dev/vpc.html
  - title: Control access to VPC endpoints using endpoint policies
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html
