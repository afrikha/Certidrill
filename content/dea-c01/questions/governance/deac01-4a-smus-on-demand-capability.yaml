id: deac01-4a-smus-on-demand-capability
objective: "4.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In an Amazon SageMaker Unified Studio domain, every project created from a widely used project profile deploys all of the profile's capabilities when the project is created, including resources that most projects never use. Costs are rising. The administrator wants these capabilities to stay available in every project but to be deployed only when project members decide to use them.

    Which change will meet these requirements?
  fr: |
    Dans un domaine Amazon SageMaker Unified Studio, chaque projet créé à partir d'un profil de projet très utilisé déploie toutes les capacités du profil à la création du projet, y compris des ressources que la plupart des projets n'utilisent jamais. Les coûts augmentent. L'administrateur veut que ces capacités restent disponibles dans chaque projet, mais qu'elles ne soient déployées que lorsque les membres du projet décident de les utiliser.

    Quelle modification répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Disable the project profile so that it is no longer available to users.", fr: "Désactiver le profil de projet pour qu'il ne soit plus disponible pour les utilisateurs." } }
    - { id: b, text: { en: "In the project profile, change those blueprints from on-create to on-demand deployment.", fr: "Dans le profil de projet, faire passer ces plans (blueprints) d'un déploiement à la création à un déploiement à la demande." } }
    - { id: c, text: { en: "Remove those blueprints from the project profile.", fr: "Retirer ces plans (blueprints) du profil de projet." } }
    - { id: d, text: { en: "Restrict the project creation policy of the domain unit to a small group of users.", fr: "Restreindre la politique de création de projets de l'unité de domaine à un petit groupe d'utilisateurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A project profile defines, for each blueprint, whether it is enabled when the project is created or available later for project users to enable on demand. On-demand capabilities are configured only when needed after project creation, which controls cost while keeping them available.
    fr: |
      Un profil de projet définit, pour chaque plan, s'il est activé à la création du projet ou disponible plus tard pour que les utilisateurs du projet l'activent à la demande. Les capacités à la demande ne sont configurées qu'en cas de besoin après la création du projet, ce qui maîtrise les coûts tout en les gardant disponibles.
  options:
    a:
      en: |
        A disabled profile cannot be used to create projects at all, which removes the capabilities instead of deferring them.
      fr: |
        Un profil désactivé ne peut plus du tout servir à créer des projets : cela supprime les capacités au lieu de les différer.
    c:
      en: |
        Without the blueprints, the capabilities are no longer available in the projects, which fails the requirement.
      fr: |
        Sans les plans, les capacités ne sont plus disponibles dans les projets, ce qui ne respecte pas l'exigence.
    d:
      en: |
        Fewer people could create projects, but each new project would still deploy every capability at creation.
      fr: |
        Moins de personnes pourraient créer des projets, mais chaque nouveau projet déploierait toujours toutes les capacités à sa création.
references:
  - title: Project profiles in Amazon SageMaker Unified Studio
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/project-profiles.html
  - title: All capabilities project profile
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/all-capabilities.html
