id: deac01-4a-glue-s3-gateway-endpoint
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs AWS Glue jobs that use a network connection in the private subnets of a VPC. The VPC has no internet gateway and no NAT gateway. The jobs must read and write objects in Amazon S3 buckets in the same Region, and the security team requires that this traffic does not travel over the internet. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des tâches AWS Glue qui utilisent une connexion réseau dans les sous-réseaux privés d'un VPC. Le VPC n'a ni passerelle Internet ni passerelle NAT. Les tâches doivent lire et écrire des objets dans des compartiments Amazon S3 de la même Région, et l'équipe de sécurité exige que ce trafic ne passe pas par Internet. L'entreprise veut la solution la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a NAT gateway in a new public subnet and add a default route to it in the private subnets' route tables.", fr: "Créer une passerelle NAT dans un nouveau sous-réseau public et ajouter une route par défaut vers celle-ci dans les tables de routage des sous-réseaux privés." } }
    - { id: b, text: { en: "Create an interface VPC endpoint for Amazon S3 in each private subnet and enable private DNS for it.", fr: "Créer un point de terminaison d'interface VPC pour Amazon S3 dans chaque sous-réseau privé et activer son DNS privé." } }
    - { id: c, text: { en: "Move the Glue connection to public subnets and attach an internet gateway to the VPC.", fr: "Déplacer la connexion Glue vers des sous-réseaux publics et attacher une passerelle Internet au VPC." } }
    - { id: d, text: { en: "Create a gateway VPC endpoint for Amazon S3 and associate it with the route tables of the private subnets.", fr: "Créer un point de terminaison de passerelle VPC pour Amazon S3 et l'associer aux tables de routage des sous-réseaux privés." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A gateway endpoint gives the subnets whose route tables are associated with it a route to Amazon S3 in the same Region without an internet gateway or NAT device. Gateway endpoints have no additional charge, which makes them the cheapest private path for the Glue jobs.
    fr: |
      Un point de terminaison de passerelle donne aux sous-réseaux dont les tables de routage lui sont associées une route vers Amazon S3 dans la même Région, sans passerelle Internet ni dispositif NAT. Les points de terminaison de passerelle n'entraînent aucun coût supplémentaire, ce qui en fait le chemin privé le moins cher pour les tâches Glue.
  options:
    a:
      en: |
        A NAT gateway sends the traffic to S3 through an internet gateway and adds hourly and per-GB processing charges.
      fr: |
        Une passerelle NAT envoie le trafic vers S3 par une passerelle Internet et ajoute des frais horaires et des frais de traitement par Go.
    b:
      en: |
        An interface endpoint for S3 keeps the traffic private but is billed per hour and per GB, so it costs more than a gateway endpoint.
      fr: |
        Un point de terminaison d'interface pour S3 garde le trafic privé, mais il est facturé à l'heure et au Go : il coûte plus cher qu'un point de terminaison de passerelle.
    c:
      en: |
        Public subnets route the S3 traffic through the internet gateway, which the security team forbids.
      fr: |
        Des sous-réseaux publics font passer le trafic S3 par la passerelle Internet, ce que l'équipe de sécurité interdit.
references:
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
