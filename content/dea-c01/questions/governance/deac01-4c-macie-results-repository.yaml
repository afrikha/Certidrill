id: deac01-4c-macie-results-repository
objective: "4.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses Amazon Macie sensitive data discovery jobs to scan its data lake. For privacy audits, the company must keep for 3 years a record of every S3 object that Macie analyzed, including objects in which no sensitive data was found and objects that Macie could not analyze. Auditors will query these records with Amazon Athena.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise des tâches de découverte de données sensibles Amazon Macie pour analyser son lac de données. Pour les audits de confidentialité, l'entreprise doit conserver pendant 3 ans un enregistrement de chaque objet S3 analysé par Macie, y compris les objets dans lesquels aucune donnée sensible n'a été trouvée et ceux que Macie n'a pas pu analyser. Les auditeurs interrogeront ces enregistrements avec Amazon Athena.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure Macie to publish its findings to AWS Security Hub CSPM, and aggregate the findings in one Region.", fr: "Configurer Macie pour publier ses résultats (findings) dans AWS Security Hub CSPM, et agréger les résultats dans une seule Région." } }
    - { id: b, text: { en: "Create an Amazon EventBridge rule that sends every Macie finding to an Amazon Data Firehose stream that writes to Amazon S3.", fr: "Créer une règle Amazon EventBridge qui envoie chaque résultat Macie à un flux Amazon Data Firehose qui écrit dans Amazon S3." } }
    - { id: c, text: { en: "Configure a repository for sensitive data discovery results in an S3 bucket, encrypted with a customer managed AWS KMS key.", fr: "Configurer un référentiel des résultats de découverte de données sensibles dans un compartiment S3, chiffré avec une clé AWS KMS gérée par le client." } }
    - { id: d, text: { en: "Rely on Macie, which keeps the sensitive data discovery results of each job for the lifetime of the job.", fr: "S'appuyer sur Macie, qui conserve les résultats de découverte de données sensibles de chaque tâche pendant toute la durée de vie de la tâche." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Sensitive data discovery results record the analysis of each object, including objects with no sensitive data and objects that Macie could not analyze. Macie keeps them for only 90 days, so you configure an S3 bucket and a customer managed symmetric KMS key as a long-term repository, where the results are stored as encrypted JSON Lines files that Athena can query."
    fr: "Les résultats de découverte de données sensibles enregistrent l'analyse de chaque objet, y compris les objets sans données sensibles et ceux que Macie n'a pas pu analyser. Macie ne les conserve que 90 jours : on configure donc un compartiment S3 et une clé KMS symétrique gérée par le client comme référentiel à long terme, où les résultats sont stockés sous forme de fichiers JSON Lines chiffrés qu'Athena peut interroger."
  options:
    a:
      en: "Findings report sensitive data and policy issues only; they do not record the objects without sensitive data or the objects that could not be analyzed."
      fr: "Les résultats (findings) ne signalent que les données sensibles et les problèmes de politique ; ils n'enregistrent pas les objets sans données sensibles ni ceux qui n'ont pas pu être analysés."
    b:
      en: "Archiving findings keeps only the objects in which sensitive data was found, not a record of every analyzed object."
      fr: "Archiver les résultats ne conserve que les objets dans lesquels des données sensibles ont été trouvées, pas un enregistrement de chaque objet analysé."
    d:
      en: "Macie stores sensitive data discovery results for only 90 days unless a repository is configured."
      fr: "Macie ne stocke les résultats de découverte de données sensibles que 90 jours si aucun référentiel n'est configuré."
references:
  - title: Storing and retaining sensitive data discovery results
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-results-repository-s3.html
