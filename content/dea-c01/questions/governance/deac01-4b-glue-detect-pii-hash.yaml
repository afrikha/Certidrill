id: deac01-4b-glue-detect-pii-hash
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses an AWS Glue Studio visual ETL job to load customer support transcripts from a landing bucket into a curated Amazon S3 zone. The free-text transcripts sometimes contain email addresses and phone numbers. Company policy requires that these values be replaced with a SHA-256 hash before the data is written to the curated zone. The company wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise une tâche ETL visuelle AWS Glue Studio pour charger des transcriptions du support client depuis un compartiment d'atterrissage vers une zone Amazon S3 organisée (curated). Les transcriptions en texte libre contiennent parfois des adresses e-mail et des numéros de téléphone. La politique de l'entreprise exige que ces valeurs soient remplacées par un hachage SHA-256 avant l'écriture des données dans la zone curated. L'entreprise veut le MOINS d'effort de développement possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run Amazon Macie sensitive data discovery jobs on the curated zone every day to find the email addresses and phone numbers.", fr: "Exécuter chaque jour des tâches de découverte de données sensibles Amazon Macie sur la zone curated pour trouver les adresses e-mail et les numéros de téléphone." } }
    - { id: b, text: { en: "Register the curated zone with AWS Lake Formation and exclude the transcript column with a data filter.", fr: "Enregistrer la zone curated auprès d'AWS Lake Formation et exclure la colonne des transcriptions avec un filtre de données." } }
    - { id: c, text: { en: "Add the Detect Sensitive Data transform to the job, detect PII in each cell, and apply the cryptographic hash action.", fr: "Ajouter la transformation Detect Sensitive Data à la tâche, détecter les PII dans chaque cellule et appliquer l'action de hachage cryptographique." } }
    - { id: d, text: { en: "Add AWS Glue Data Quality rules to the job that fail the run when a transcript contains an email address.", fr: "Ajouter à la tâche des règles AWS Glue Data Quality qui font échouer l'exécution lorsqu'une transcription contient une adresse e-mail." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS Glue Studio sensitive data transform detects predefined entities such as email addresses and phone numbers, including inside free text when it scans each cell. Its Apply cryptographic hash action replaces each detected value with its SHA-256 hash before the job writes the data."
    fr: "La transformation de données sensibles d'AWS Glue Studio détecte des entités prédéfinies comme les adresses e-mail et les numéros de téléphone, y compris dans du texte libre lorsqu'elle analyse chaque cellule. Son action Apply cryptographic hash remplace chaque valeur détectée par son hachage SHA-256 avant que la tâche n'écrive les données."
  options:
    a:
      en: "Macie finds sensitive data in objects already stored in S3; it does not transform the data before it lands."
      fr: "Macie trouve des données sensibles dans des objets déjà stockés dans S3 ; il ne transforme pas les données avant leur arrivée."
    b:
      en: "A data filter hides the whole column at query time, and the raw values would still be stored in the curated zone."
      fr: "Un filtre de données masque toute la colonne au moment de la requête, et les valeurs brutes resteraient stockées dans la zone curated."
    d:
      en: "Data Quality rules validate data; they do not replace values, and failing runs would block the pipeline."
      fr: "Les règles Data Quality valident les données ; elles ne remplacent pas les valeurs, et des exécutions en échec bloqueraient le pipeline."
references:
  - title: Detect and process sensitive data
    url: https://docs.aws.amazon.com/glue/latest/dg/detect-PII.html
