id: deac01-4b-cwl-essentials-class
objective: "4.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's AWS Glue jobs write about 2 TB of debug logs each day to log groups in the Standard log class of Amazon CloudWatch Logs. The logs must be kept for 30 days and are only queried ad hoc with CloudWatch Logs Insights during incident investigations. No metric filters, subscription filters, or Live Tail sessions use these log groups. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Les tâches AWS Glue d'AnyCompany écrivent environ 2 To de journaux de débogage par jour dans des groupes de journaux de la classe de journaux Standard d'Amazon CloudWatch Logs. Les journaux doivent être conservés 30 jours et ne sont interrogés que ponctuellement avec CloudWatch Logs Insights lors d'enquêtes sur des incidents. Aucun filtre de métrique, filtre d'abonnement ni session Live Tail n'utilise ces groupes de journaux. L'entreprise veut la solution la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the log class of the existing log groups from Standard to Essentials (formerly Infrequent Access), and keep 30-day retention.", fr: "Changer la classe des groupes de journaux existants de Standard à Essentials (anciennement Infrequent Access), et garder 30 jours de conservation." } }
    - { id: b, text: { en: "Create new log groups in the Essentials (formerly Infrequent Access) log class with 30-day retention, and send the debug logs there.", fr: "Créer de nouveaux groupes de journaux de classe Essentials (anciennement Infrequent Access) avec 30 jours de conservation, et y envoyer les journaux de débogage." } }
    - { id: c, text: { en: "Keep the Standard log groups, and set their retention to 1 day to reduce the storage charges.", fr: "Conserver les groupes de journaux Standard, et définir leur conservation à 1 jour pour réduire les frais de stockage." } }
    - { id: d, text: { en: "Keep the Standard log groups, and add a subscription filter that copies the logs to Amazon S3 through Amazon Data Firehose.", fr: "Conserver les groupes de journaux Standard, et ajouter un filtre d'abonnement qui copie les journaux vers Amazon S3 via Amazon Data Firehose." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Essentials log class (formerly Infrequent Access) has a lower ingestion price per GB and supports Logs Insights queries, which fits ad hoc forensic analysis. It lacks features such as metric filters, subscription filters, and Live Tail, which these logs do not use, and a log group's class is set when the group is created."
    fr: "La classe de journaux Essentials (anciennement Infrequent Access) a un prix d'ingestion par Go plus bas et prend en charge les requêtes Logs Insights, ce qui convient à une analyse ponctuelle après incident. Elle ne propose pas certaines fonctionnalités comme les filtres de métrique, les filtres d'abonnement et Live Tail, que ces journaux n'utilisent pas, et la classe d'un groupe de journaux se fixe à sa création."
  options:
    a:
      en: "The log class of a log group cannot be changed after the group is created."
      fr: "La classe d'un groupe de journaux ne peut pas être modifiée après sa création."
    c:
      en: "One day of retention breaks the 30-day requirement, and ingestion, the main cost here, stays at the Standard price."
      fr: "Une conservation d'un jour enfreint l'exigence de 30 jours, et l'ingestion, principal coût ici, reste au prix Standard."
    d:
      en: "The logs are still ingested at the Standard price, and Firehose and S3 add charges on top."
      fr: "Les journaux sont toujours ingérés au prix Standard, et Firehose et S3 ajoutent des frais supplémentaires."
references:
  - title: Log classes
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatch_Logs_Log_Classes.html
