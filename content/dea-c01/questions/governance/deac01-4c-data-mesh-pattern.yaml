id: deac01-4c-data-mesh-pattern
objective: "4.5.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A large company is redesigning its analytics platform. Each business domain will own, process, and publish its data products in its own AWS account. A central team must provide a single catalog for discovery, manage access permissions centrally, and keep an audit history. Consumers must query the data where it is stored, without copying it into their own accounts.

    Which data architecture pattern meets these requirements?
  fr: |
    Une grande entreprise repense sa plateforme d'analyse. Chaque domaine métier possédera, traitera et publiera ses produits de données dans son propre compte AWS. Une équipe centrale doit fournir un catalogue unique pour la découverte, gérer les autorisations d'accès de manière centralisée et conserver un historique d'audit. Les consommateurs doivent interroger les données là où elles sont stockées, sans les copier dans leurs propres comptes.

    Quel modèle d'architecture de données répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A centralized data lake, in which every domain copies its data into one shared account that the central team owns, operates, and governs.", fr: "Un lac de données centralisé, dans lequel chaque domaine copie ses données dans un compte partagé unique que l'équipe centrale possède, exploite et gouverne." } }
    - { id: b, text: { en: "Point-to-point sharing, in which each producer domain grants S3 bucket policy access directly to each consumer account that asks for it.", fr: "Un partage point à point, dans lequel chaque domaine producteur accorde directement un accès par politique de compartiment S3 à chaque compte consommateur qui le demande." } }
    - { id: c, text: { en: "A data mesh, in which producers keep their data, a central governance account manages the catalog and Lake Formation permissions, and consumers query in place.", fr: "Un maillage de données (data mesh), dans lequel les producteurs conservent leurs données, un compte de gouvernance central gère le catalogue et les autorisations Lake Formation, et les consommateurs interrogent sur place." } }
    - { id: d, text: { en: "Copy-based distribution, in which each consumer account runs AWS Glue jobs every night that copy the producer data into its own data lake.", fr: "Une distribution par copie, dans laquelle chaque compte consommateur exécute chaque nuit des tâches AWS Glue qui copient les données des producteurs dans son propre lac de données." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In a data mesh, domain accounts are grouped into producers and consumers, and producers publish data products to a business catalog. The catalog is hosted in a central governance account, which provides discovery, permission management, and an audit log; Lake Formation manages access to the entities of the central Data Catalog, so consumers query shared data without copies."
    fr: "Dans un maillage de données, les comptes des domaines sont regroupés en producteurs et en consommateurs, et les producteurs publient des produits de données dans un catalogue métier. Ce catalogue est hébergé dans un compte de gouvernance central, qui assure la découverte, la gestion des autorisations et un journal d'audit ; Lake Formation gère l'accès aux entités du catalogue de données central : les consommateurs interrogent les données partagées sans copie."
  options:
    a:
      en: "Copying everything into a central account removes domain ownership and duplicates the data."
      fr: "Tout copier dans un compte central supprime la propriété des domaines et duplique les données."
    b:
      en: "Direct bucket policies between accounts provide no central catalog, no central permission management, and no single audit history."
      fr: "Des politiques de compartiment directes entre comptes n'offrent ni catalogue central, ni gestion centrale des autorisations, ni historique d'audit unique."
    d:
      en: "Consumers copy the data into their own accounts, which the company wants to avoid."
      fr: "Les consommateurs copient les données dans leurs propres comptes, ce que l'entreprise veut éviter."
references:
