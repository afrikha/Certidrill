id: deac01-4c-emr-log-uri-retention
objective: "4.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team runs transient Amazon EMR clusters that process data every night and terminate when their steps finish. The clusters are created with the AWS CLI. The team must keep the step, application, and YARN container logs of every run for 1 year for troubleshooting and audits, at the lowest cost.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données exécute des clusters Amazon EMR transitoires qui traitent des données chaque nuit et se résilient à la fin de leurs étapes. Les clusters sont créés avec l'AWS CLI. L'équipe doit conserver pendant 1 an les journaux des étapes, des applications et des conteneurs YARN de chaque exécution pour le dépannage et les audits, au coût le plus bas.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Rely on the persistent application user interfaces of Amazon EMR to view the logs of the terminated clusters.", fr: "S'appuyer sur les interfaces utilisateur d'application persistantes d'Amazon EMR pour consulter les journaux des clusters résiliés." } }
    - { id: b, text: { en: "Specify an Amazon S3 log location with the --log-uri option, and add an S3 Lifecycle rule that expires the logs after 1 year.", fr: "Indiquer un emplacement de journaux Amazon S3 avec l'option --log-uri, et ajouter une règle S3 Lifecycle qui fait expirer les journaux après 1 an." } }
    - { id: c, text: { en: "Enable termination protection on the clusters so that the log files remain available in /mnt/var/log on the nodes.", fr: "Activer la protection contre la résiliation sur les clusters afin que les fichiers journaux restent disponibles dans /mnt/var/log sur les nœuds." } }
    - { id: d, text: { en: "Increase the size of the Amazon EBS volumes of the cluster nodes so that they can hold 1 year of log files.", fr: "Augmenter la taille des volumes Amazon EBS des nœuds du cluster afin qu'ils puissent contenir 1 an de fichiers journaux." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EMR writes logs to /mnt/var/log on each node and can archive them to the Amazon S3 location given in --log-uri, so they persist after the cluster terminates. Clusters created with the CLI or API must enable this archiving explicitly. An S3 Lifecycle rule then deletes the logs after the 1-year retention period."
    fr: "Amazon EMR écrit les journaux dans /mnt/var/log sur chaque nœud et peut les archiver dans l'emplacement Amazon S3 indiqué par --log-uri : ils persistent après la résiliation du cluster. Les clusters créés avec la CLI ou l'API doivent activer cet archivage explicitement. Une règle S3 Lifecycle supprime ensuite les journaux après la durée de conservation de 1 an."
  options:
    a:
      en: "Persistent application user interfaces keep application history and logs for only 30 days after the application ends."
      fr: "Les interfaces utilisateur d'application persistantes ne conservent l'historique et les journaux des applications que 30 jours après la fin de l'application."
    c:
      en: "Keeping the clusters running to preserve local logs defeats transient clusters and is far more expensive than storing the logs in S3."
      fr: "Maintenir les clusters en marche pour conserver les journaux locaux va à l'encontre des clusters transitoires et coûte bien plus cher que de stocker les journaux dans S3."
    d:
      en: "Node volumes are deleted when the transient cluster terminates, so the logs would be lost after each run."
      fr: "Les volumes des nœuds sont supprimés lorsque le cluster transitoire se résilie : les journaux seraient perdus après chaque exécution."
references:
  - title: Configure Amazon EMR cluster logging and debugging
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-debugging.html
  - title: View persistent application user interfaces in Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/app-history-spark-UI.html
