id: deac01-4c-kms-external-key-store
objective: "4.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A European bank encrypts regulated data in Amazon S3 and Amazon Redshift with SSE-KMS. A new sovereignty requirement states that the key material must remain outside AWS, in HSMs that the bank operates in its own data centers, so that the bank can make the data undecryptable by cutting AWS access to its keys. The bank accepts responsibility for the availability and latency of the key operations.

    Which solution will meet these requirements?
  fr: |
    Une banque européenne chiffre des données réglementées dans Amazon S3 et Amazon Redshift avec SSE-KMS. Une nouvelle exigence de souveraineté impose que le matériel de clé reste hors d'AWS, dans des HSM que la banque exploite dans ses propres centres de données, afin que la banque puisse rendre les données indéchiffrables en coupant l'accès d'AWS à ses clés. La banque accepte d'être responsable de la disponibilité et de la latence des opérations sur les clés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Import key material from the bank's HSMs into KMS keys, and delete the imported material when access must be cut.", fr: "Importer dans des clés KMS un matériel de clé issu des HSM de la banque, et supprimer le matériel importé lorsque l'accès doit être coupé." } }
    - { id: b, text: { en: "Create the KMS keys in an AWS CloudHSM key store that is backed by a cluster in the bank's AWS account.", fr: "Créer les clés KMS dans un magasin de clés AWS CloudHSM adossé à un cluster du compte AWS de la banque." } }
    - { id: c, text: { en: "Create multi-Region customer managed keys with the primary key in the bank's main Region and replicas in other EU Regions.", fr: "Créer des clés multi-Régions gérées par le client, avec la clé primaire dans la Région principale de la banque et des réplicas dans d'autres Régions de l'UE." } }
    - { id: d, text: { en: "Create the KMS keys in an external key store that reaches the bank's HSMs through an external key store proxy.", fr: "Créer les clés KMS dans un magasin de clés externe qui accède aux HSM de la banque via un proxy de magasin de clés externe." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With an external key store, the key material stays in an external key manager that the customer owns and operates outside AWS, and AWS KMS reaches it only through an external key store proxy. Each encrypt and decrypt operation needs the external key, so disconnecting the key store makes the keys unusable; the customer takes on the availability, latency, and durability of the key manager."
    fr: "Avec un magasin de clés externe, le matériel de clé reste dans un gestionnaire de clés externe que le client possède et exploite hors d'AWS, et AWS KMS n'y accède que via un proxy de magasin de clés externe. Chaque opération de chiffrement et de déchiffrement nécessite la clé externe : déconnecter le magasin de clés rend les clés inutilisables ; le client assume la disponibilité, la latence et la durabilité du gestionnaire de clés."
  options:
    a:
      en: "Imported key material is held inside AWS KMS while it is in use, so the key material does not remain outside AWS."
      fr: "Le matériel de clé importé est conservé dans AWS KMS tant qu'il est utilisé : il ne reste donc pas hors d'AWS."
    b:
      en: "A CloudHSM cluster runs in AWS, so the key material would not remain outside AWS in the bank's data centers."
      fr: "Un cluster CloudHSM s'exécute dans AWS : le matériel de clé ne resterait pas hors d'AWS, dans les centres de données de la banque."
    c:
      en: "Multi-Region keys keep their key material in AWS KMS in several Regions, and external key stores do not support them."
      fr: "Les clés multi-Régions conservent leur matériel de clé dans AWS KMS dans plusieurs Régions, et les magasins de clés externes ne les prennent pas en charge."
references:
  - title: External key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-external.html
