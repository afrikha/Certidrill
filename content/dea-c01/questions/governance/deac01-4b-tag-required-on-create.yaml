id: deac01-4b-tag-required-on-create
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's data engineers create AWS Glue jobs in a shared account. The finance team charges costs back by using a `cost-center` tag, and many new jobs are created without it. The company must prevent any Glue job from being created without a `cost-center` tag, and it does not want to rely on cleanup after creation.

    Which solution will meet these requirements?
  fr: |
    Les ingénieurs des données d'AnyCompany créent des tâches AWS Glue dans un compte partagé. L'équipe financière refacture les coûts à l'aide d'une balise `cost-center`, et de nombreuses nouvelles tâches sont créées sans elle. L'entreprise doit empêcher toute création de tâche Glue sans balise `cost-center`, et elle ne veut pas dépendre d'un nettoyage après la création.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy the required-tags AWS Config managed rule for Glue jobs, and notify the owners of noncompliant jobs by email.", fr: "Déployer la règle gérée AWS Config required-tags pour les tâches Glue, et avertir par e-mail les propriétaires des tâches non conformes." } }
    - { id: b, text: { en: "Add an IAM policy statement that denies glue:CreateJob when the aws:RequestTag/cost-center condition key is null.", fr: "Ajouter une instruction de politique IAM qui refuse glue:CreateJob lorsque la clé de condition aws:RequestTag/cost-center est nulle (Null)." } }
    - { id: c, text: { en: "Allow glue:CreateJob only when the aws:ResourceTag/cost-center condition key exists on the job resource.", fr: "Autoriser glue:CreateJob uniquement lorsque la clé de condition aws:ResourceTag/cost-center existe sur la ressource de tâche." } }
    - { id: d, text: { en: "Run a weekly Lambda function that adds a default cost-center tag to every untagged Glue job.", fr: "Exécuter chaque semaine une fonction Lambda qui ajoute une balise cost-center par défaut à chaque tâche Glue non balisée." } }
answer: { optionId: b }
explanation:
  correct:
    en: "glue:CreateJob supports the aws:RequestTag and aws:TagKeys condition keys, which describe the tags sent in the creation request. Denying the action when aws:RequestTag/cost-center is null blocks every creation request that does not carry the tag."
    fr: "glue:CreateJob prend en charge les clés de condition aws:RequestTag et aws:TagKeys, qui décrivent les balises envoyées dans la requête de création. Refuser l'action lorsque aws:RequestTag/cost-center est nulle bloque toute requête de création qui ne porte pas la balise."
  options:
    a:
      en: "AWS Config evaluates resources after they exist; it reports untagged jobs but does not stop their creation."
      fr: "AWS Config évalue les ressources après leur création ; il signale les tâches non balisées mais n'empêche pas leur création."
    c:
      en: "aws:ResourceTag checks tags already attached to an existing resource; it does not test the tags passed in a creation request."
      fr: "aws:ResourceTag vérifie les balises déjà attachées à une ressource existante ; elle ne teste pas les balises transmises dans une requête de création."
    d:
      en: "A scheduled fix runs after creation and assigns a guessed value, which is the cleanup the company wants to avoid."
      fr: "Une correction planifiée s'exécute après la création et attribue une valeur devinée : c'est le nettoyage que l'entreprise veut éviter."
references:
  - title: Controlling access to AWS resources using tags
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_tags.html
