id: deac01-4b-databrew-deterministic
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's analysts use AWS Glue DataBrew to prepare two datasets that share a `customer_email` column. A privacy policy requires that analysts never see the real email addresses. The analysts must still be able to join the two prepared datasets on the protected column, and a privacy team must be able to recover the original values later in DataBrew for legal requests.

    Which DataBrew recipe step should the analysts apply to the column in both datasets?
  fr: |
    Les analystes d'AnyCompany utilisent AWS Glue DataBrew pour préparer deux jeux de données qui partagent une colonne `customer_email`. Une politique de confidentialité exige que les analystes ne voient jamais les vraies adresses e-mail. Les analystes doivent pourtant pouvoir joindre les deux jeux de données préparés sur la colonne protégée, et une équipe chargée de la confidentialité doit pouvoir retrouver plus tard les valeurs d'origine dans DataBrew pour des demandes juridiques.

    Quelle étape de recette DataBrew les analystes doivent-ils appliquer à la colonne dans les deux jeux de données ?
body:
  options:
    - { id: a, text: { en: "DETERMINISTIC_ENCRYPT with the same AWS Secrets Manager secret for both datasets", fr: "DETERMINISTIC_ENCRYPT avec le même secret AWS Secrets Manager pour les deux jeux de données" } }
    - { id: b, text: { en: "CRYPTOGRAPHIC_HASH with the HMAC_SHA256 algorithm and the same secret for both datasets", fr: "CRYPTOGRAPHIC_HASH avec l'algorithme HMAC_SHA256 et le même secret pour les deux jeux de données" } }
    - { id: c, text: { en: "MASK_CUSTOM that replaces every character of the email address with a fixed character", fr: "MASK_CUSTOM qui remplace chaque caractère de l'adresse e-mail par un caractère fixe" } }
    - { id: d, text: { en: "SHUFFLE_ROWS that shuffles the email values across the rows of each dataset", fr: "SHUFFLE_ROWS qui mélange les valeurs d'e-mail entre les lignes de chaque jeu de données" } }
answer: { optionId: a }
explanation:
  correct:
    en: "DETERMINISTIC_ENCRYPT uses AES-GCM-SIV with a key from a Secrets Manager secret, so the same email always produces the same ciphertext and the datasets can be joined. The values can be recovered later with the DETERMINISTIC_DECRYPT step in DataBrew."
    fr: "DETERMINISTIC_ENCRYPT utilise AES-GCM-SIV avec une clé issue d'un secret Secrets Manager : le même e-mail produit toujours le même texte chiffré, et les jeux de données peuvent être joints. Les valeurs peuvent être retrouvées plus tard avec l'étape DETERMINISTIC_DECRYPT de DataBrew."
  options:
    b:
      en: "A keyed hash keeps values joinable, but a hash is one-way, so the privacy team could not recover the original emails."
      fr: "Un hachage avec clé conserve des valeurs joignables, mais un hachage est à sens unique : l'équipe de confidentialité ne pourrait pas retrouver les e-mails d'origine."
    c:
      en: "Masking every character makes all values identical, so joins return wrong matches and the originals are lost."
      fr: "Masquer chaque caractère rend toutes les valeurs identiques : les jointures donnent de fausses correspondances et les valeurs d'origine sont perdues."
    d:
      en: "Shuffling keeps real emails visible to analysts and breaks the link between each email and its row."
      fr: "Le mélange laisse les vrais e-mails visibles pour les analystes et rompt le lien entre chaque e-mail et sa ligne."
references:
  - title: DETERMINISTIC_ENCRYPT
    url: https://docs.aws.amazon.com/databrew/latest/dg/recipe-actions.DETERMINISTIC_ENCRYPT.html
  - title: Identifying and handling personally identifiable information (PII)
    url: https://docs.aws.amazon.com/databrew/latest/dg/personal-information-protection.html
