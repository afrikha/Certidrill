id: deac01-4c-datashare-includenew
objective: "4.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Redshift producer cluster shares the curated schema with several consumer workgroups through a datashare named curated_share. Data engineers add new tables to the curated schema every week. Consumers must see each new table automatically, without an administrator updating the datashare after each release, and the tables that are already shared must stay shared.

    Which solution will meet these requirements?
  fr: |
    Un cluster producteur Amazon Redshift partage le schéma curated avec plusieurs groupes de travail consommateurs via une unité de partage des données (datashare) nommée curated_share. Les ingénieurs des données ajoutent chaque semaine de nouvelles tables au schéma curated. Les consommateurs doivent voir automatiquement chaque nouvelle table, sans qu'un administrateur mette à jour l'unité de partage des données après chaque livraison, et les tables déjà partagées doivent le rester.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run `ALTER DATASHARE curated_share ADD ALL TABLES IN SCHEMA curated` once on the producer cluster.", fr: "Exécuter une fois `ALTER DATASHARE curated_share ADD ALL TABLES IN SCHEMA curated` sur le cluster producteur." } }
    - { id: b, text: { en: "Have each consumer recreate its database from the datashare with the `WITH PERMISSIONS` clause after each release.", fr: "Demander à chaque consommateur de recréer sa base de données à partir de l'unité de partage des données avec la clause `WITH PERMISSIONS` après chaque livraison." } }
    - { id: c, text: { en: "Run `ALTER DATASHARE curated_share ADD SCHEMA curated` again on the producer cluster after each release.", fr: "Exécuter de nouveau `ALTER DATASHARE curated_share ADD SCHEMA curated` sur le cluster producteur après chaque livraison." } }
    - { id: d, text: { en: "Run `ALTER DATASHARE curated_share SET INCLUDENEW = TRUE FOR SCHEMA curated` once as a superuser on the producer cluster.", fr: "Exécuter une fois `ALTER DATASHARE curated_share SET INCLUDENEW = TRUE FOR SCHEMA curated` en tant que superutilisateur sur le cluster producteur." } }
answer: { optionId: d }
explanation:
  correct:
    en: "SET INCLUDENEW = TRUE FOR SCHEMA adds future tables, views, and SQL UDFs created in that schema to the datashare; it is false by default and only a superuser can change it for each datashare-schema pair. The tables already in the datashare remain shared."
    fr: "SET INCLUDENEW = TRUE FOR SCHEMA ajoute à l'unité de partage des données les futures tables, vues et UDF SQL créées dans ce schéma ; la valeur par défaut est false et seul un superutilisateur peut la modifier, pour chaque paire unité de partage-schéma. Les tables déjà présentes dans l'unité de partage des données restent partagées."
  options:
    a:
      en: "ADD ALL TABLES IN SCHEMA adds only the tables that exist when the statement runs, so it would have to be repeated after each release."
      fr: "ADD ALL TABLES IN SCHEMA n'ajoute que les tables qui existent au moment de l'instruction : il faudrait la répéter après chaque livraison."
    b:
      en: "WITH PERMISSIONS controls object-level permissions in the consumer database; it cannot add tables to the producer's datashare."
      fr: "WITH PERMISSIONS contrôle les autorisations au niveau des objets dans la base de données consommatrice ; cette clause ne peut pas ajouter de tables à l'unité de partage du producteur."
    c:
      en: "ADD SCHEMA adds the schema but not the objects in it, and repeating it after each release is the manual work to avoid."
      fr: "ADD SCHEMA ajoute le schéma mais pas les objets qu'il contient, et le répéter après chaque livraison est justement le travail manuel à éviter."
references:
  - title: ALTER DATASHARE
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_ALTER_DATASHARE.html
