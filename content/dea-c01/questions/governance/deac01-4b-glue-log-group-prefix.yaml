id: deac01-4b-glue-log-group-prefix
objective: "4.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two data engineering teams at AnyCompany run AWS Glue 5.0 jobs in the same account, and all job logs go to the default `/aws-glue/jobs/output` and `/aws-glue/jobs/error` log groups in Amazon CloudWatch Logs. Each team must be able to read only its own job logs, and the finance team's logs must be kept for 1 year while the other team's logs are kept for 30 days.

    Which solution will meet these requirements?
  fr: |
    Deux équipes d'ingénierie des données d'AnyCompany exécutent des tâches AWS Glue 5.0 dans le même compte, et tous les journaux des tâches vont dans les groupes de journaux par défaut `/aws-glue/jobs/output` et `/aws-glue/jobs/error` d'Amazon CloudWatch Logs. Chaque équipe doit pouvoir lire uniquement les journaux de ses propres tâches, et les journaux de l'équipe financière doivent être conservés 1 an tandis que ceux de l'autre équipe sont conservés 30 jours.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the --custom-logStream-prefix job parameter for each team, and set the retention per log stream.", fr: "Définir le paramètre de tâche --custom-logStream-prefix pour chaque équipe, et définir la conservation par flux de journaux." } }
    - { id: b, text: { en: "Create a metric filter for each team on the default log groups, and grant each team access to its own metric and alarms.", fr: "Créer un filtre de métrique par équipe sur les groupes de journaux par défaut, et accorder à chaque équipe l'accès à sa propre métrique et à ses alarmes." } }
    - { id: c, text: { en: "Add a subscription filter per team on the default log groups that copies matching events to a team log group.", fr: "Ajouter sur les groupes de journaux par défaut un filtre d'abonnement par équipe qui copie les événements correspondants vers un groupe de journaux d'équipe." } }
    - { id: d, text: { en: "Set a different --custom-logGroup-prefix job parameter per team, and set retention and access on each team's log groups.", fr: "Définir un paramètre de tâche --custom-logGroup-prefix différent par équipe, et définir conservation et accès sur les groupes de journaux de chaque équipe." } }
answer: { optionId: d }
explanation:
  correct:
    en: "In AWS Glue 5.0, the --custom-logGroup-prefix job parameter sends a job's logs to <prefix>/output and <prefix>/error log groups. Retention and IAM resource permissions are set per log group, so each team gets its own groups with its own retention and access."
    fr: "Dans AWS Glue 5.0, le paramètre de tâche --custom-logGroup-prefix envoie les journaux d'une tâche vers les groupes de journaux <prefix>/output et <prefix>/error. La conservation et les autorisations IAM sur les ressources se définissent par groupe de journaux : chaque équipe obtient ses propres groupes, avec sa conservation et ses accès."
  options:
    a:
      en: "A stream prefix only renames the log streams inside the same log groups, and retention is a log group setting, not a stream setting."
      fr: "Un préfixe de flux renomme seulement les flux de journaux dans les mêmes groupes, et la conservation est un paramètre de groupe de journaux, pas de flux."
    b:
      en: "Metric filters turn log events into metrics; they do not separate the logs or their retention."
      fr: "Les filtres de métrique transforment des événements de journal en métriques ; ils ne séparent ni les journaux ni leur conservation."
    c:
      en: "Subscription filters deliver to Kinesis, Firehose, Lambda, or OpenSearch destinations, and the original logs would stay readable in the shared groups."
      fr: "Les filtres d'abonnement livrent vers des destinations Kinesis, Firehose, Lambda ou OpenSearch, et les journaux d'origine resteraient lisibles dans les groupes partagés."
references:
  - title: Logging for AWS Glue jobs
    url: https://docs.aws.amazon.com/glue/latest/dg/monitor-continuous-logging.html
