id: deac01-4c-scp-deny-s3-replication
objective: "4.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's data lake buckets are in eu-central-1, in member accounts of AWS Organizations. An SCP already denies all actions outside eu-central-1 based on aws:RequestedRegion. An audit found that an engineer had configured S3 replication from a data lake bucket to a bucket that an external AWS account owns in another Region. The company must prevent every principal in the member accounts, except a central platform role, from creating replication rules on any bucket.

    Which solution will meet these requirements?
  fr: |
    Les compartiments du lac de données d'AnyCompany se trouvent dans eu-central-1, dans des comptes membres d'AWS Organizations. Une SCP refuse déjà toutes les actions en dehors d'eu-central-1 en fonction d'aws:RequestedRegion. Un audit a révélé qu'un ingénieur avait configuré la réplication S3 d'un compartiment du lac de données vers un compartiment appartenant à un compte AWS externe dans une autre Région. L'entreprise doit empêcher tous les principaux des comptes membres, à l'exception d'un rôle de plateforme central, de créer des règles de réplication sur un compartiment.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the S3 replication actions to the NotAction element of the existing Region-deny SCP of the organization.", fr: "Ajouter les actions de réplication S3 à l'élément NotAction de la SCP existante de refus de Région de l'organisation." } }
    - { id: b, text: { en: "Attach an SCP that denies s3:PutReplicationConfiguration to every principal except the central platform role.", fr: "Attacher une SCP qui refuse s3:PutReplicationConfiguration à tous les principaux sauf au rôle de plateforme central." } }
    - { id: c, text: { en: "Turn on S3 Block Public Access at the account level in every member account of the organization.", fr: "Activer S3 Block Public Access au niveau du compte dans chaque compte membre de l'organisation." } }
    - { id: d, text: { en: "Turn on S3 Object Lock in compliance mode on every data lake bucket in the member accounts.", fr: "Activer S3 Object Lock en mode conformité sur chaque compartiment du lac de données des comptes membres." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Creating replication rules requires the s3:PutReplicationConfiguration permission on the source bucket. The request targets the source bucket in eu-central-1, so the Region-deny SCP allows it even when the destination is elsewhere; a separate SCP statement that denies this action, with an aws:PrincipalArn exception for the platform role, blocks every other principal, including administrators."
    fr: "Créer des règles de réplication exige l'autorisation s3:PutReplicationConfiguration sur le compartiment source. La requête vise le compartiment source dans eu-central-1 : la SCP de refus de Région l'autorise même si la destination est ailleurs. Une instruction de SCP distincte qui refuse cette action, avec une exception aws:PrincipalArn pour le rôle de plateforme, bloque tous les autres principaux, administrateurs compris."
  options:
    a:
      en: "NotAction exempts the listed actions from the Region restriction, which would make replication easier to configure, not harder."
      fr: "NotAction exempte les actions listées de la restriction de Région, ce qui faciliterait la configuration de la réplication au lieu de l'empêcher."
    c:
      en: "Block Public Access blocks public access through ACLs and policies; replication to an authenticated external account is not public access."
      fr: "Block Public Access bloque l'accès public via les ACL et les politiques ; la réplication vers un compte externe authentifié n'est pas un accès public."
    d:
      en: "Object Lock prevents object versions from being deleted or overwritten; it does not stop them from being replicated."
      fr: "Object Lock empêche la suppression ou le remplacement des versions d'objets ; il n'empêche pas leur réplication."
references:
  - title: Setting up permissions for live replication
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/setting-repl-config-perm-overview.html
  - title: Service control policy examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_general.html
