id: deac01-4b-abac-vs-rbac-facts
objective: "4.2.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's data platform team is choosing between role-based access control (RBAC) and attribute-based access control (ABAC) in IAM for hundreds of datasets that teams add every week. The team wants to understand how each model behaves before designing the policies.

    Which statements are true? (Choose two.)
  fr: |
    L'équipe de la plateforme de données d'AnyCompany choisit entre le contrôle d'accès basé sur les rôles (RBAC) et le contrôle d'accès basé sur les attributs (ABAC) dans IAM pour des centaines de jeux de données que les équipes ajoutent chaque semaine. L'équipe veut comprendre le fonctionnement de chaque modèle avant de concevoir les politiques.

    Quelles affirmations sont vraies ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "ABAC needs a separate policy for each job function, so it uses more policies than RBAC.", fr: "ABAC exige une politique distincte par fonction, il utilise donc plus de politiques que RBAC." } }
    - { id: b, text: { en: "With ABAC, a new resource that carries the matching tag is accessible without updating any policy.", fr: "Avec ABAC, une nouvelle ressource qui porte la balise correspondante est accessible sans modifier aucune politique." } }
    - { id: c, text: { en: "LF-Tags assigned in AWS Lake Formation can be used as aws:ResourceTag values in IAM policy conditions.", fr: "Les LF-Tags attribuées dans AWS Lake Formation peuvent servir de valeurs aws:ResourceTag dans les conditions des politiques IAM." } }
    - { id: d, text: { en: "Employee attributes from a SAML or OIDC identity provider can be passed as session tags and used in ABAC policies.", fr: "Les attributs des employés issus d'un fournisseur d'identité SAML ou OIDC peuvent être transmis sous forme de balises de session et utilisés dans des politiques ABAC." } }
    - { id: e, text: { en: "RBAC grants access by comparing a tag on the principal with a tag on the resource.", fr: "RBAC accorde l'accès en comparant une balise du principal à une balise de la ressource." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "ABAC permissions scale with new resources: a policy that compares principal and resource tags covers any new resource with the right tag. Attributes from a corporate directory can reach IAM as session tags through SAML or OIDC federation."
    fr: "Les autorisations ABAC suivent la croissance des ressources : une politique qui compare les balises du principal et de la ressource couvre toute nouvelle ressource correctement balisée. Les attributs d'un annuaire d'entreprise peuvent parvenir à IAM sous forme de balises de session via une fédération SAML ou OIDC."
  options:
    a:
      en: "It is the opposite: ABAC needs fewer policies because one policy serves many job functions through attributes."
      fr: "C'est l'inverse : ABAC exige moins de politiques, car une seule politique sert de nombreuses fonctions grâce aux attributs."
    c:
      en: "LF-Tags and IAM tags are not interchangeable: LF-Tags grant Lake Formation permissions, IAM tags are used in IAM policies."
      fr: "Les LF-Tags et les balises IAM ne sont pas interchangeables : les LF-Tags accordent des autorisations Lake Formation, les balises IAM servent dans les politiques IAM."
    e:
      en: "Comparing principal and resource tags is ABAC; RBAC grants permissions to a role for each job function and its listed resources."
      fr: "Comparer les balises du principal et de la ressource relève d'ABAC ; RBAC accorde des autorisations à un rôle par fonction et pour les ressources qu'il liste."
references:
  - title: Define permissions based on attributes with ABAC authorization
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html
