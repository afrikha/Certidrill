id: deac01-4b-rs-sys-monitor
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's operations team must query the catalog and system tables of an Amazon Redshift data warehouse to follow the workload. Team members must not be able to cancel queries, run VACUUM or ANALYZE, create objects, or read user tables. The company wants to follow the principle of least privilege and use a built-in role.

    Which role should the database administrator grant to the team's database role?
  fr: |
    L'équipe des opérations d'AnyCompany doit interroger les tables de catalogue et les tables système d'un entrepôt de données Amazon Redshift pour suivre la charge de travail. Les membres de l'équipe ne doivent pas pouvoir annuler des requêtes, exécuter VACUUM ou ANALYZE, créer des objets ni lire les tables utilisateur. L'entreprise veut respecter le principe du moindre privilège et utiliser un rôle intégré.

    Quel rôle l'administrateur de base de données doit-il accorder au rôle de base de données de l'équipe ?
body:
  options:
    - { id: a, text: "sys:monitor" }
    - { id: b, text: "sys:operator" }
    - { id: c, text: "sys:dba" }
    - { id: d, text: "sys:secadmin" }
answer: { optionId: a }
explanation:
  correct:
    en: "sys:monitor is the system-defined role that can access catalog and system tables. It does not include the maintenance, query cancellation, or object creation permissions of the other system roles."
    fr: "sys:monitor est le rôle défini par le système qui peut accéder aux tables de catalogue et aux tables système. Il n'inclut pas les autorisations de maintenance, d'annulation de requêtes ou de création d'objets des autres rôles système."
  options:
    b:
      en: "sys:operator can also analyze, vacuum, and cancel queries, which the team must not do."
      fr: "sys:operator peut aussi exécuter ANALYZE et VACUUM et annuler des requêtes, ce que l'équipe ne doit pas faire."
    c:
      en: "sys:dba creates and drops schemas, tables, views, and procedures, and inherits sys:operator."
      fr: "sys:dba crée et supprime des schémas, des tables, des vues et des procédures, et hérite de sys:operator."
    d:
      en: "sys:secadmin manages users, roles, and RLS and DDM policies, which is not monitoring access."
      fr: "sys:secadmin gère les utilisateurs, les rôles et les politiques RLS et DDM, ce qui n'est pas un accès de surveillance."
references:
  - title: Amazon Redshift system-defined roles
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_roles-default.html
