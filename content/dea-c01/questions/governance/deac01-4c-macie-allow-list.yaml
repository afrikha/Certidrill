id: deac01-4c-macie-allow-list
objective: "4.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank uses Amazon Macie automated sensitive data discovery on its data lake buckets. Many findings report phone numbers that are in fact the bank's public customer service numbers, which follow a fixed pattern and appear in every exported account statement. The data governance team wants Macie to stop reporting these values while it continues to report all other phone numbers in the same objects.

    Which solution will meet these requirements?
  fr: |
    Une banque utilise la découverte automatique des données sensibles d'Amazon Macie sur les compartiments de son lac de données. De nombreux résultats signalent des numéros de téléphone qui sont en fait les numéros publics du service client de la banque ; ils suivent un modèle fixe et figurent dans chaque relevé de compte exporté. L'équipe de gouvernance des données veut que Macie cesse de signaler ces valeurs tout en continuant à signaler tous les autres numéros de téléphone des mêmes objets.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Macie allow list with a regular expression that matches the public service numbers, and add it to the automated discovery settings.", fr: "Créer une liste d'autorisation Macie avec une expression régulière qui correspond aux numéros publics du service client, et l'ajouter aux paramètres de la découverte automatique." } }
    - { id: b, text: { en: "Create a Macie custom data identifier with a regular expression that matches the public service numbers, and add it to the automated discovery settings.", fr: "Créer un identifiant de données personnalisé Macie avec une expression régulière qui correspond aux numéros publics du service client, et l'ajouter aux paramètres de la découverte automatique." } }
    - { id: c, text: { en: "Exclude the buckets that contain the exported account statements from automated sensitive data discovery.", fr: "Exclure de la découverte automatique des données sensibles les compartiments qui contiennent les relevés de compte exportés." } }
    - { id: d, text: { en: "Create a suppression rule that automatically archives every finding that reports phone numbers.", fr: "Créer une règle de suppression qui archive automatiquement chaque résultat signalant des numéros de téléphone." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A Macie allow list defines text or text patterns that Macie ignores, even when they match a managed or custom data identifier. A regular expression list suits values that vary but follow a common pattern, and it can be added to automated sensitive data discovery or to discovery jobs; other phone numbers are still reported."
    fr: "Une liste d'autorisation Macie définit du texte ou des modèles de texte que Macie ignore, même s'ils correspondent à un identifiant de données géré ou personnalisé. Une liste par expression régulière convient aux valeurs qui varient mais suivent un modèle commun, et elle peut être ajoutée à la découverte automatique des données sensibles ou aux tâches de découverte ; les autres numéros de téléphone restent signalés."
  options:
    b:
      en: "A custom data identifier makes Macie detect additional text as sensitive; it does not stop the managed identifiers from reporting these numbers."
      fr: "Un identifiant de données personnalisé fait détecter à Macie du texte supplémentaire comme sensible ; il n'empêche pas les identifiants gérés de signaler ces numéros."
    c:
      en: "Excluding the buckets stops all analysis of them, so the other phone numbers and PII in the statements would no longer be reported."
      fr: "Exclure les compartiments arrête toute analyse de ceux-ci : les autres numéros de téléphone et PII des relevés ne seraient plus signalés."
    d:
      en: "Archiving every phone number finding hides the real phone numbers too, which the team still needs to see."
      fr: "Archiver tous les résultats de numéros de téléphone masque aussi les vrais numéros, que l'équipe doit toujours voir."
references:
  - title: Defining sensitive data exceptions with allow lists
    url: https://docs.aws.amazon.com/macie/latest/user/allow-lists.html
