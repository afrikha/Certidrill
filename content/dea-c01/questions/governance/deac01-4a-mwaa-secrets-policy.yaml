id: deac01-4a-mwaa-secrets-policy
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon MWAA environment uses AWS Secrets Manager as its Apache Airflow secrets backend, with connections and variables stored under the airflow/ prefix. The execution role has the SecretsManagerReadWrite managed policy. The security team requires a custom policy that lets the role read the values of secrets under airflow/ only, while the Airflow provider must still be able to list secrets. The role must not be able to change or delete secrets.

    Which policy will meet these requirements?
  fr: |
    Un environnement Amazon MWAA utilise AWS Secrets Manager comme backend de secrets d'Apache Airflow, avec les connexions et les variables stockées sous le préfixe airflow/. Le rôle d'exécution possède la politique gérée SecretsManagerReadWrite. L'équipe de sécurité exige une politique personnalisée qui permet au rôle de lire les valeurs des seuls secrets sous airflow/, tandis que le fournisseur Airflow doit toujours pouvoir lister les secrets. Le rôle ne doit pas pouvoir modifier ni supprimer de secrets.

    Quelle politique répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Allow secretsmanager:GetSecretValue and secretsmanager:ListSecrets, both with Resource set to the ARN pattern of the secrets under airflow/.", fr: "Autoriser secretsmanager:GetSecretValue et secretsmanager:ListSecrets, toutes deux avec Resource défini sur le modèle d'ARN des secrets sous airflow/." } }
    - { id: b, text: { en: "Allow secretsmanager:GetSecretValue on the ARN pattern of the secrets under airflow/, and secretsmanager:ListSecrets with Resource set to *.", fr: "Autoriser secretsmanager:GetSecretValue sur le modèle d'ARN des secrets sous airflow/, et secretsmanager:ListSecrets avec Resource défini sur *." } }
    - { id: c, text: { en: "Allow secretsmanager:GetSecretValue and secretsmanager:ListSecrets, both with Resource set to *.", fr: "Autoriser secretsmanager:GetSecretValue et secretsmanager:ListSecrets, toutes deux avec Resource défini sur *." } }
    - { id: d, text: { en: "Allow secretsmanager:* with Resource set to the ARN pattern of the secrets under airflow/.", fr: "Autoriser secretsmanager:* avec Resource défini sur le modèle d'ARN des secrets sous airflow/." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The documented least-privilege policy for the MWAA secrets backend allows secretsmanager:GetSecretValue on the secret ARNs and secretsmanager:ListSecrets on *. ListSecrets does not support resource-level permissions, so it must use Resource set to *, while GetSecretValue stays limited to the airflow/ secrets.
    fr: |
      La politique de moindre privilège documentée pour le backend de secrets de MWAA autorise secretsmanager:GetSecretValue sur les ARN des secrets et secretsmanager:ListSecrets sur *. ListSecrets ne prend pas en charge les autorisations au niveau des ressources : il doit utiliser Resource défini sur *, tandis que GetSecretValue reste limité aux secrets airflow/.
  options:
    a:
      en: |
        ListSecrets does not support resource-level permissions, so a statement that limits it to secret ARNs never allows the call.
      fr: |
        ListSecrets ne prend pas en charge les autorisations au niveau des ressources : une instruction qui le limite à des ARN de secrets n'autorise jamais l'appel.
    c:
      en: |
        GetSecretValue on * lets the role read every secret in the account, not only those under airflow/.
      fr: |
        GetSecretValue sur * permet au rôle de lire tous les secrets du compte, pas seulement ceux sous airflow/.
    d:
      en: |
        secretsmanager:* includes actions such as PutSecretValue and DeleteSecret, which the role must not have.
      fr: |
        secretsmanager:* comprend des actions comme PutSecretValue et DeleteSecret, que le rôle ne doit pas avoir.
references:
  - title: Configuring an Apache Airflow connection using a AWS Secrets Manager secret
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/connections-secrets-manager.html
