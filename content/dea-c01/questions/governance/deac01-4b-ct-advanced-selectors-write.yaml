id: deac01-4b-ct-advanced-selectors-write
objective: "4.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's data lake bucket `example-lake` receives millions of GetObject requests every day from analytics jobs. Auditors require the existing AWS CloudTrail trail to record who writes or deletes objects under the `finance/` prefix only. The company wants the MOST cost-effective configuration.

    Which solution will meet these requirements?
  fr: |
    Le compartiment de lac de données `example-lake` d'AnyCompany reçoit chaque jour des millions de requêtes GetObject de tâches d'analytique. Les auditeurs exigent que le journal de suivi AWS CloudTrail existant enregistre qui écrit ou supprime des objets sous le seul préfixe `finance/`. L'entreprise veut la configuration la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an advanced event selector for data events with resources.type AWS::S3::Object, resources.ARN StartsWith the finance/ prefix ARN, and readOnly false.", fr: "Ajouter un sélecteur d'événements avancé pour les événements de données avec resources.type AWS::S3::Object, resources.ARN StartsWith l'ARN du préfixe finance/, et readOnly false." } }
    - { id: b, text: { en: "Add a basic event selector that logs all read and write data events for the example-lake bucket, and filter them later in Athena.", fr: "Ajouter un sélecteur d'événements de base qui enregistre tous les événements de données en lecture et en écriture du compartiment example-lake, et les filtrer plus tard dans Athena." } }
    - { id: c, text: { en: "Configure the trail to log write-only management events, and filter on the finance/ prefix when the auditors query the delivered log files.", fr: "Configurer le journal de suivi pour enregistrer uniquement les événements de gestion en écriture, et filtrer sur le préfixe finance/ lorsque les auditeurs interrogent les fichiers journaux livrés." } }
    - { id: d, text: { en: "Add an advanced event selector for data events with resources.type AWS::S3::Object and resources.ARN StartsWith the finance/ prefix ARN.", fr: "Ajouter un sélecteur d'événements avancé pour les événements de données avec resources.type AWS::S3::Object et resources.ARN StartsWith l'ARN du préfixe finance/." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Object-level operations are data events, which trails do not log by default and which cost extra. An advanced event selector can limit them to one prefix with StartsWith on resources.ARN, and readOnly false keeps only write operations such as PutObject and DeleteObject."
    fr: "Les opérations au niveau des objets sont des événements de données, que les journaux de suivi n'enregistrent pas par défaut et qui sont facturés en supplément. Un sélecteur d'événements avancé peut les limiter à un préfixe avec StartsWith sur resources.ARN, et readOnly false ne garde que les opérations d'écriture comme PutObject et DeleteObject."
  options:
    b:
      en: "Logging every read and write event of the bucket records the millions of GetObject calls, which is the most expensive option."
      fr: "Enregistrer tous les événements de lecture et d'écriture du compartiment capture les millions d'appels GetObject : c'est l'option la plus coûteuse."
    c:
      en: "Object writes and deletes are data events, so management events never contain them."
      fr: "Les écritures et suppressions d'objets sont des événements de données : les événements de gestion ne les contiennent jamais."
    d:
      en: "Without readOnly false, the selector also logs every GetObject call under finance/, which adds cost the auditors do not need."
      fr: "Sans readOnly false, le sélecteur enregistre aussi chaque appel GetObject sous finance/, ce qui ajoute un coût inutile pour les auditeurs."
references:
  - title: Logging data events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
