id: deac01-4a-emr-ec2-node-access
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineering team needs a managed Apache Spark platform for a batch workload. A vendor's support contract requires that engineers log in to the cluster nodes with SSH to run a diagnostic tool, and the team must choose the exact Amazon EC2 instance types that run the workload.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données a besoin d'une plateforme Apache Spark gérée pour une charge de travail par lots. Le contrat de support d'un éditeur exige que les ingénieurs se connectent aux nœuds du cluster en SSH pour exécuter un outil de diagnostic, et l'équipe doit choisir les types d'instances Amazon EC2 exacts qui exécutent la charge de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the workload as an Amazon EMR Serverless application with pre-initialized capacity and custom worker sizes.", fr: "Exécuter la charge de travail dans une application Amazon EMR Serverless avec une capacité pré-initialisée et des tailles de worker personnalisées." } }
    - { id: b, text: { en: "Run the workload as AWS Glue ETL jobs with G.2X workers and auto scaling turned on.", fr: "Exécuter la charge de travail sous forme de tâches ETL AWS Glue avec des workers G.2X et la mise à l'échelle automatique activée." } }
    - { id: c, text: { en: "Run the workload in AWS Glue interactive sessions that engineers start from a notebook.", fr: "Exécuter la charge de travail dans des sessions interactives AWS Glue que les ingénieurs démarrent depuis un bloc-notes." } }
    - { id: d, text: { en: "Run the workload on an Amazon EMR on EC2 cluster launched with an EC2 key pair and the chosen instance types.", fr: "Exécuter la charge de travail sur un cluster Amazon EMR on EC2 lancé avec une paire de clés EC2 et les types d'instances choisis." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon EMR on EC2 runs the cluster on EC2 instances that you choose, and you can connect to the primary node with SSH by using the EC2 key pair specified at launch and a security group rule for port 22. AWS still installs and configures Spark, which keeps the platform managed.
    fr: |
      Amazon EMR on EC2 exécute le cluster sur des instances EC2 que vous choisissez, et vous pouvez vous connecter au nœud primaire en SSH avec la paire de clés EC2 indiquée au lancement et une règle de groupe de sécurité pour le port 22. AWS installe et configure toujours Spark, ce qui garde la plateforme gérée.
  options:
    a:
      en: |
        EMR Serverless determines and provisions the workers itself, with no cluster to configure, so engineers cannot pick instance types or log in to nodes.
      fr: |
        EMR Serverless détermine et provisionne lui-même les workers, sans cluster à configurer : les ingénieurs ne peuvent ni choisir les types d'instances ni se connecter aux nœuds.
    b:
      en: |
        AWS Glue is serverless: you choose a worker type, not EC2 instances, and there are no nodes to log in to.
      fr: |
        AWS Glue est sans serveur : vous choisissez un type de worker, pas des instances EC2, et il n'y a aucun nœud auquel se connecter.
    c:
      en: |
        Interactive sessions run on serverless AWS Glue capacity, which gives no SSH access and no choice of instance types.
      fr: |
        Les sessions interactives s'exécutent sur une capacité AWS Glue sans serveur, qui n'offre ni accès SSH ni choix des types d'instances.
references:
  - title: Connect to the Amazon EMR cluster primary node using SSH
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-connect-master-node-ssh.html
  - title: What is Amazon EMR Serverless?
    url: https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/emr-serverless.html
