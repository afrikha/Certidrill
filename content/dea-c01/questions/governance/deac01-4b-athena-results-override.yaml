id: deac01-4b-athena-results-override
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's analysts query data with Amazon Athena from the console and from several JDBC and ODBC clients. Some clients do not set any encryption option for query results, and others use SSE-S3. A security policy requires that every query result be encrypted with SSE-KMS by using the company's customer managed key, whatever the client settings are.

    Which solution will meet these requirements?
  fr: |
    Les analystes d'AnyCompany interrogent des données avec Amazon Athena depuis la console et depuis plusieurs clients JDBC et ODBC. Certains clients ne définissent aucune option de chiffrement pour les résultats des requêtes, et d'autres utilisent SSE-S3. Une politique de sécurité exige que chaque résultat de requête soit chiffré avec SSE-KMS à l'aide de la clé gérée par le client de l'entreprise, quels que soient les paramètres des clients.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable SSE-KMS default encryption with the key on the S3 bucket that stores the query results of all the workgroups.", fr: "Activer le chiffrement par défaut SSE-KMS avec la clé sur le compartiment S3 qui stocke les résultats des requêtes de tous les groupes de travail." } }
    - { id: b, text: { en: "Ask each analyst to select Encrypt query results with SSE-KMS and the key on the Settings tab of the console.", fr: "Demander à chaque analyste de sélectionner Encrypt query results avec SSE-KMS et la clé dans l'onglet Settings de la console." } }
    - { id: c, text: { en: "Configure SSE-KMS with the key in a workgroup, select Override client-side settings, and require the analysts to use it.", fr: "Configurer SSE-KMS avec la clé dans un groupe de travail, sélectionner Override client-side settings, et imposer ce groupe aux analystes." } }
    - { id: d, text: { en: "Configure CSE-KMS with the key in the connection properties of each JDBC and ODBC client.", fr: "Configurer CSE-KMS avec la clé dans les propriétés de connexion de chaque client JDBC et ODBC." } }
answer: { optionId: c }
explanation:
  correct:
    en: "When a workgroup has Override client-side settings selected, all its queries use the workgroup encryption and result location, and the settings of the console, API, JDBC, and ODBC clients are ignored. Every result is then encrypted with SSE-KMS and the company key."
    fr: "Lorsqu'un groupe de travail a l'option Override client-side settings sélectionnée, toutes ses requêtes utilisent le chiffrement et l'emplacement des résultats du groupe, et les paramètres de la console, de l'API et des clients JDBC et ODBC sont ignorés. Chaque résultat est alors chiffré avec SSE-KMS et la clé de l'entreprise."
  options:
    a:
      en: "Bucket default encryption applies only when a request sets no encryption; clients that request SSE-S3 would still write SSE-S3 results."
      fr: "Le chiffrement par défaut du compartiment ne s'applique que si la requête ne définit aucun chiffrement ; les clients qui demandent SSE-S3 écriraient toujours des résultats SSE-S3."
    b:
      en: "Console settings are client-side choices per user, and they do not apply to the JDBC and ODBC clients."
      fr: "Les paramètres de la console sont des choix côté client propres à chaque utilisateur, et ils ne s'appliquent pas aux clients JDBC et ODBC."
    d:
      en: "Client settings can be changed or omitted by each user, and CSE-KMS is not the SSE-KMS encryption that the policy requires."
      fr: "Les paramètres des clients peuvent être modifiés ou omis par chaque utilisateur, et CSE-KMS n'est pas le chiffrement SSE-KMS exigé par la politique."
references:
  - title: Encrypt Athena query results stored in Amazon S3
    url: https://docs.aws.amazon.com/athena/latest/ug/encrypting-query-results-stored-in-s3.html
