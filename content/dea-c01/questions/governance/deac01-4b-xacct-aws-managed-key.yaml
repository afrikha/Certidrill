id: deac01-4b-xacct-aws-managed-key
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany shares an Amazon S3 bucket of daily extracts with a partner account. The bucket policy allows the partner's IAM role to read the objects, and the role's IAM policy allows s3:GetObject and kms:Decrypt. The objects are encrypted with SSE-KMS by using the AWS managed key `aws/s3`, and every partner download fails with an access denied error.

    Which solution will meet these requirements?
  fr: |
    AnyCompany partage un compartiment Amazon S3 d'extractions quotidiennes avec le compte d'un partenaire. La politique de compartiment autorise le rôle IAM du partenaire à lire les objets, et la politique IAM du rôle autorise s3:GetObject et kms:Decrypt. Les objets sont chiffrés avec SSE-KMS à l'aide de la clé gérée par AWS `aws/s3`, et chaque téléchargement du partenaire échoue avec une erreur d'accès refusé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Re-encrypt the objects with a customer managed key whose policy allows the partner, and set it as the bucket default.", fr: "Rechiffrer les objets avec une clé gérée par le client dont la politique autorise le partenaire, et en faire la clé par défaut du compartiment." } }
    - { id: b, text: { en: "Edit the key policy of the AWS managed key aws/s3 to allow the partner role to call kms:Decrypt.", fr: "Modifier la politique de clé de la clé gérée par AWS aws/s3 pour autoriser le rôle du partenaire à appeler kms:Decrypt." } }
    - { id: c, text: { en: "Add the partner role as a grantee with READ permission in the access control list (ACL) of each object in the bucket.", fr: "Ajouter le rôle du partenaire comme bénéficiaire avec l'autorisation READ dans la liste de contrôle d'accès (ACL) de chaque objet du compartiment." } }
    - { id: d, text: { en: "Add the ARN of the aws/s3 key to the kms:Decrypt statement in the IAM policy of the partner role.", fr: "Ajouter l'ARN de la clé aws/s3 à l'instruction kms:Decrypt de la politique IAM du rôle du partenaire." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Objects encrypted with an AWS managed key cannot be shared cross-account; cross-account SSE-KMS access needs a customer managed key whose key policy allows the other account. Existing objects keep their old key, so they must be re-encrypted, for example by copying them in place with the new key."
    fr: "Les objets chiffrés avec une clé gérée par AWS ne peuvent pas être partagés entre comptes ; un accès SSE-KMS intercompte exige une clé gérée par le client dont la politique de clé autorise l'autre compte. Les objets existants gardent leur ancienne clé : ils doivent être rechiffrés, par exemple en les copiant sur place avec la nouvelle clé."
  options:
    b:
      en: "The key policies of AWS managed keys are controlled by AWS and cannot be edited."
      fr: "Les politiques de clé des clés gérées par AWS sont contrôlées par AWS et ne peuvent pas être modifiées."
    c:
      en: "ACLs concern S3 access, which the bucket policy already grants; the failure comes from the KMS key."
      fr: "Les ACL concernent l'accès S3, que la politique de compartiment accorde déjà ; l'échec vient de la clé KMS."
    d:
      en: "An IAM policy alone is not enough: the key policy must also allow the external account, which is impossible for aws/s3."
      fr: "Une politique IAM seule ne suffit pas : la politique de clé doit aussi autoriser le compte externe, ce qui est impossible pour aws/s3."
references:
  - title: Using server-side encryption with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
