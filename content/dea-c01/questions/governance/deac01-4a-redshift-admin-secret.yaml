id: deac01-4a-redshift-admin-secret
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is creating a new Amazon Redshift Serverless namespace for its analytics platform. The admin user's password must be generated, stored encrypted, and rotated automatically. No one on the team should have to write or maintain rotation code.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise crée un nouvel espace de noms Amazon Redshift Serverless pour sa plateforme d'analyse. Le mot de passe de l'utilisateur administrateur doit être généré, stocké chiffré et faire l'objet d'une rotation automatique. Personne dans l'équipe ne doit avoir à écrire ni à maintenir de code de rotation.

    Quelle solution répond à ces exigences avec la charge opérationnelle la PLUS FAIBLE ?
body:
  options:
    - { id: a, text: { en: "Store the password as a SecureString parameter in Parameter Store and change it with a scheduled Lambda function.", fr: "Stocker le mot de passe comme paramètre SecureString dans Parameter Store et le changer avec une fonction Lambda planifiée." } }
    - { id: b, text: { en: "When creating the namespace, choose to have Amazon Redshift manage the admin password in AWS Secrets Manager.", fr: "Lors de la création de l'espace de noms, choisir de laisser Amazon Redshift gérer le mot de passe administrateur dans AWS Secrets Manager." } }
    - { id: c, text: { en: "Store the password in a Secrets Manager secret and write a custom rotation Lambda function for the secret.", fr: "Stocker le mot de passe dans un secret Secrets Manager et écrire une fonction Lambda de rotation personnalisée pour ce secret." } }
    - { id: d, text: { en: "Store the password in an S3 object encrypted with SSE-KMS and change it with an AWS Step Functions workflow.", fr: "Stocker le mot de passe dans un objet S3 chiffré avec SSE-KMS et le changer avec un flux de travail AWS Step Functions." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When Amazon Redshift manages the admin password, it generates the password, stores it in Secrets Manager, and rotates it every 30 days by default, updating the namespace to match. The team writes no rotation code and can still rotate the secret manually at any time.
    fr: |
      Quand Amazon Redshift gère le mot de passe administrateur, il génère le mot de passe, le stocke dans Secrets Manager et en assure la rotation tous les 30 jours par défaut, en mettant à jour l'espace de noms en conséquence. L'équipe n'écrit aucun code de rotation et peut toujours effectuer une rotation manuelle du secret à tout moment.
  options:
    a:
      en: |
        Parameter Store has no built-in rotation, so the team must write and maintain the Lambda function that changes the password.
      fr: |
        Parameter Store n'a pas de rotation intégrée : l'équipe doit écrire et maintenir la fonction Lambda qui change le mot de passe.
    c:
      en: |
        A custom rotation function works, but the team must write and maintain its code, which the requirement rules out.
      fr: |
        Une fonction de rotation personnalisée fonctionne, mais l'équipe doit écrire et maintenir son code, ce que l'exigence exclut.
    d:
      en: |
        Amazon S3 is not a credential store, and the workflow that changes the password is custom code to maintain.
      fr: |
        Amazon S3 n'est pas un magasin d'informations d'identification, et le flux de travail qui change le mot de passe est du code personnalisé à maintenir.
references:
  - title: Managing Amazon Redshift admin passwords using AWS Secrets Manager
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/redshift-secrets-manager-integration.html
