id: deac01-4b-ct-event-history-90d
objective: "4.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany must keep a record of every API call that creates, changes, or deletes AWS Glue Data Catalog databases, tables, and jobs for 3 years. Today the data team uses only the AWS CloudTrail Event history in the console, and no trail exists. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany doit conserver pendant 3 ans un enregistrement de chaque appel d'API qui crée, modifie ou supprime des bases de données, des tables et des tâches du AWS Glue Data Catalog. Aujourd'hui, l'équipe des données utilise uniquement l'historique des événements AWS CloudTrail dans la console, et aucun journal de suivi (trail) n'existe. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Download the Event history to Amazon S3 every 60 days with a scheduled script that calls the LookupEvents API in every Region.", fr: "Télécharger l'historique des événements vers Amazon S3 tous les 60 jours avec un script planifié qui appelle l'API LookupEvents dans chaque Région." } }
    - { id: b, text: { en: "Enable CloudTrail Insights on the account so that the unusual Glue API activity is recorded in an S3 bucket.", fr: "Activer CloudTrail Insights sur le compte afin que l'activité inhabituelle des API Glue soit enregistrée dans un compartiment S3." } }
    - { id: c, text: { en: "Enable AWS Config recording for all supported resource types, and keep the configuration history for 3 years.", fr: "Activer l'enregistrement AWS Config pour tous les types de ressources pris en charge, et conserver l'historique de configuration pendant 3 ans." } }
    - { id: d, text: { en: "Create a multi-Region trail that delivers management events to S3, with a Lifecycle rule that expires objects after 3 years.", fr: "Créer un journal de suivi multirégion qui livre les événements de gestion dans S3, avec une règle Lifecycle qui fait expirer les objets après 3 ans." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Event history keeps only the last 90 days of management events in each Region; an ongoing record needs a trail or an event data store. Glue Data Catalog and job changes are management events, so a trail that delivers them to S3, with a Lifecycle rule for the 3-year retention, meets the need with no custom code."
    fr: "L'historique des événements ne conserve que les 90 derniers jours d'événements de gestion par Région ; un enregistrement continu exige un journal de suivi ou un entrepôt de données d'événements. Les modifications du Glue Data Catalog et des tâches sont des événements de gestion : un journal de suivi qui les livre dans S3, avec une règle Lifecycle pour la conservation de 3 ans, répond au besoin sans code personnalisé."
  options:
    a:
      en: "A custom export script must be scheduled, maintained, and run in every Region, which is more overhead than a trail."
      fr: "Un script d'export personnalisé doit être planifié, maintenu et exécuté dans chaque Région, ce qui représente plus de charge qu'un journal de suivi."
    b:
      en: "Insights events flag unusual API call rates or error rates; they do not keep a record of every call."
      fr: "Les événements Insights signalent des taux d'appels ou d'erreurs inhabituels ; ils ne conservent pas un enregistrement de chaque appel."
    c:
      en: "AWS Config records resource configuration states, not every API call with its caller."
      fr: "AWS Config enregistre l'état de configuration des ressources, pas chaque appel d'API avec son auteur."
references:
  - title: Working with CloudTrail event history
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
