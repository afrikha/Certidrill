id: deac01-4b-cwl-kms-log-group
objective: "4.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's ingestion application writes its logs to the Amazon CloudWatch Logs log group `/app/ingest` in the us-east-1 Region. A security policy requires that the log data be encrypted with a customer managed AWS KMS key. A data engineer creates a symmetric KMS key in us-east-1 and runs `aws logs associate-kms-key` for the log group, but the command fails because CloudWatch Logs cannot use the key.

    Which change to the key policy will meet these requirements with the LEAST privilege?
  fr: |
    L'application d'ingestion d'AnyCompany écrit ses journaux dans le groupe de journaux Amazon CloudWatch Logs `/app/ingest` de la Région us-east-1. Une politique de sécurité exige que les données des journaux soient chiffrées avec une clé AWS KMS gérée par le client. Un ingénieur des données crée une clé KMS symétrique dans us-east-1 et exécute `aws logs associate-kms-key` pour le groupe de journaux, mais la commande échoue car CloudWatch Logs ne peut pas utiliser la clé.

    Quelle modification de la politique de clé répond à ces exigences avec le MOINDRE privilège ?
body:
  options:
    - { id: a, text: { en: "Allow the application's IAM role, which writes the log events, to use kms:Encrypt and kms:GenerateDataKey* on the key.", fr: "Autoriser le rôle IAM de l'application, qui écrit les événements de journal, à utiliser kms:Encrypt et kms:GenerateDataKey* sur la clé." } }
    - { id: b, text: { en: "Allow the principal * to use kms:* on the key so that any service in the account can encrypt logs.", fr: "Autoriser le principal * à utiliser kms:* sur la clé afin que tout service du compte puisse chiffrer des journaux." } }
    - { id: c, text: { en: "Allow the logs.us-east-1.amazonaws.com service principal, with kms:EncryptionContext:aws:logs:arn set to the log group ARN.", fr: "Autoriser le principal de service logs.us-east-1.amazonaws.com, avec kms:EncryptionContext:aws:logs:arn défini sur l'ARN du groupe de journaux." } }
    - { id: d, text: { en: "Allow the logs.amazonaws.com global service principal to use the key for every log group in every Region, without any condition.", fr: "Autoriser le principal de service global logs.amazonaws.com à utiliser la clé pour tous les groupes de journaux de toutes les Régions, sans aucune condition." } }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudWatch Logs encrypts the data itself, so the key policy must allow the Regional logs service principal of the key's Region. A condition on kms:EncryptionContext:aws:logs:arn limits the key to the one log group; after the association, newly ingested data is encrypted with the key."
    fr: "CloudWatch Logs chiffre lui-même les données : la politique de clé doit autoriser le principal de service logs régional de la Région de la clé. Une condition sur kms:EncryptionContext:aws:logs:arn limite la clé au seul groupe de journaux ; après l'association, les données nouvellement ingérées sont chiffrées avec la clé."
  options:
    a:
      en: "The application sends plaintext log events to CloudWatch Logs, which performs the encryption; the role's KMS permissions are not used."
      fr: "L'application envoie des événements de journal en clair à CloudWatch Logs, qui effectue le chiffrement ; les autorisations KMS du rôle ne sont pas utilisées."
    b:
      en: "Principal * with kms:* lets anyone with IAM access manage and use the key, the opposite of least privilege."
      fr: "Le principal * avec kms:* permet à quiconque dispose d'un accès IAM de gérer et d'utiliser la clé : c'est l'inverse du moindre privilège."
    d:
      en: "The service principal must be the Regional one of the key's Region, and no condition would let every log group use the key."
      fr: "Le principal de service doit être le principal régional de la Région de la clé, et l'absence de condition laisserait tous les groupes de journaux utiliser la clé."
references:
  - title: Encrypt log data in CloudWatch Logs using AWS Key Management Service
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html
