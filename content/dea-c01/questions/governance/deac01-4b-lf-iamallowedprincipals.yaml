id: deac01-4b-lf-iamallowedprincipals
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 300 tables in the AWS Glue Data Catalog that were created two years ago with IAM-only access control. The company registered the Amazon S3 locations of the tables with AWS Lake Formation and granted SELECT on two tables to the analyst role in Lake Formation. However, an engineering role that has no Lake Formation grants but has broad AWS Glue and Amazon S3 IAM permissions can still query every table with Amazon Athena. The company wants Lake Formation grants to control access to these tables and to all tables created in the future.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 300 tables dans le AWS Glue Data Catalog, créées il y a deux ans avec un contrôle d'accès IAM uniquement. L'entreprise a enregistré les emplacements Amazon S3 des tables auprès d'AWS Lake Formation et a accordé SELECT sur deux tables au rôle des analystes dans Lake Formation. Pourtant, un rôle d'ingénierie qui n'a aucune autorisation Lake Formation mais dispose de larges autorisations IAM sur AWS Glue et Amazon S3 peut toujours interroger toutes les tables avec Amazon Athena. L'entreprise veut que les autorisations Lake Formation contrôlent l'accès à ces tables et à toutes les tables créées à l'avenir.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Register the S3 locations again with the Lake Formation service-linked role instead of a custom IAM role.", fr: "Enregistrer de nouveau les emplacements S3 avec le rôle lié à un service de Lake Formation au lieu d'un rôle IAM personnalisé." } }
    - { id: b, text: { en: "Grant the DESCRIBE permission only to the engineering role on the 300 tables in Lake Formation.", fr: "Accorder uniquement l'autorisation DESCRIBE au rôle d'ingénierie sur les 300 tables dans Lake Formation." } }
    - { id: c, text: { en: "Revoke Super from IAMAllowedPrincipals on the existing tables, and clear the Use only IAM access control defaults.", fr: "Révoquer Super d'IAMAllowedPrincipals sur les tables existantes, et désactiver les paramètres par défaut Use only IAM access control." } }
    - { id: d, text: { en: "Change the registration of the S3 locations to hybrid access mode, and opt in the analyst role for the two tables.", fr: "Passer l'enregistrement des emplacements S3 en mode d'accès hybride, et inscrire (opt in) le rôle des analystes pour les deux tables." } }
answer: { optionId: c }
explanation:
  correct:
    en: "For backward compatibility, Lake Formation grants Super to the IAMAllowedPrincipals group on existing Data Catalog resources and enables Use only IAM access control for new ones, so IAM policies alone decide access. Revoking that grant on the existing tables and clearing the defaults makes Lake Formation permissions effective now and for future tables."
    fr: "Par compatibilité ascendante, Lake Formation accorde Super au groupe IAMAllowedPrincipals sur les ressources existantes du Data Catalog et active Use only IAM access control pour les nouvelles : seules les politiques IAM décident de l'accès. Révoquer cette autorisation sur les tables existantes et désactiver ces paramètres par défaut rend les autorisations Lake Formation effectives dès maintenant et pour les futures tables."
  options:
    a:
      en: "The registration role only supplies the credentials that Lake Formation vends; it does not remove the Super grant that keeps IAM-only access."
      fr: "Le rôle d'enregistrement fournit seulement les informations d'identification que Lake Formation distribue ; il ne supprime pas l'autorisation Super qui maintient l'accès IAM seul."
    b:
      en: "While IAMAllowedPrincipals holds Super, the engineering role keeps full access through IAM, so an extra DESCRIBE grant changes nothing."
      fr: "Tant qu'IAMAllowedPrincipals détient Super, le rôle d'ingénierie garde un accès complet via IAM : une autorisation DESCRIBE supplémentaire ne change rien."
    d:
      en: "In hybrid access mode, principals that are not opted in keep their IAM-based access, so the engineering role could still query every table."
      fr: "En mode d'accès hybride, les principaux non inscrits conservent leur accès basé sur IAM : le rôle d'ingénierie pourrait toujours interroger toutes les tables."
references:
  - title: Changing the default settings for your data lake
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/change-settings.html
