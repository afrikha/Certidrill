id: deac01-4a-smus-domain-unit-cascade
objective: "4.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's Amazon SageMaker Unified Studio domain has a Marketing domain unit with child domain units for its sub-teams. Today, the project creation policy of the Marketing domain unit is granted to all users. The company requires that the marketing leads manage the authorization policies of Marketing themselves, that only the marketing-engineers group can create projects in Marketing and in all of its child domain units, and that the domain keeps its single shared catalog.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Le domaine Amazon SageMaker Unified Studio d'une entreprise comporte une unité de domaine Marketing avec des unités de domaine enfants pour ses sous-équipes. Aujourd'hui, la politique de création de projets de l'unité de domaine Marketing est accordée à tous les utilisateurs. L'entreprise exige que les responsables marketing gèrent eux-mêmes les politiques d'autorisation de Marketing, que seul le groupe marketing-engineers puisse créer des projets dans Marketing et dans toutes ses unités de domaine enfants, et que le domaine conserve son catalogue partagé unique.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a separate domain for Marketing and its sub-teams, and make the marketing leads its administrators.", fr: "Créer un domaine distinct pour Marketing et ses sous-équipes, et faire des responsables marketing ses administrateurs." } }
    - { id: b, text: { en: "Add the marketing leads as owners of the Marketing domain unit.", fr: "Ajouter les responsables marketing comme propriétaires de l'unité de domaine Marketing." } }
    - { id: c, text: { en: "Grant the project membership policy of the Marketing domain unit to the marketing-engineers group.", fr: "Accorder la politique d'appartenance aux projets de l'unité de domaine Marketing au groupe marketing-engineers." } }
    - { id: d, text: { en: "In the Marketing project creation policy, remove the all-users grant and grant marketing-engineers with Apply to child domain units selected.", fr: "Dans la politique de création de projets de Marketing, retirer l'octroi à tous les utilisateurs et accorder la politique à marketing-engineers avec Apply to child domain units coché." } }
    - { id: e, text: { en: "Create a project profile for Marketing and authorize all users and groups to use it.", fr: "Créer un profil de projet pour Marketing et autoriser tous les utilisateurs et groupes à l'utiliser." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Domain units delegate authority to their owners, so the marketing leads can manage Marketing's authorization policies once they own the domain unit. The project creation policy decides who can create projects; with Apply to child domain units (cascade) selected, the marketing-engineers grant also applies in every child domain unit, and removing the all-users grant stops everyone else.
    fr: |
      Les unités de domaine délèguent l'autorité à leurs propriétaires : les responsables marketing peuvent gérer les politiques d'autorisation de Marketing dès qu'ils sont propriétaires de l'unité. La politique de création de projets décide qui peut créer des projets ; avec Apply to child domain units (propagation) coché, l'octroi à marketing-engineers s'applique aussi dans chaque unité de domaine enfant, et le retrait de l'octroi à tous les utilisateurs bloque tous les autres.
  options:
    a:
      en: |
        A separate domain has its own catalog, which breaks the single shared catalog that the company requires.
      fr: |
        Un domaine distinct a son propre catalogue, ce qui rompt le catalogue partagé unique exigé par l'entreprise.
    c:
      en: |
        The project membership policy concerns membership in projects; it does not decide who can create projects.
      fr: |
        La politique d'appartenance aux projets concerne l'appartenance aux projets ; elle ne décide pas qui peut créer des projets.
    e:
      en: |
        A profile open to all users and groups does not restrict project creation; it makes a template available to everyone.
      fr: |
        Un profil ouvert à tous les utilisateurs et groupes ne restreint pas la création de projets ; il met un modèle à la disposition de tous.
references:
