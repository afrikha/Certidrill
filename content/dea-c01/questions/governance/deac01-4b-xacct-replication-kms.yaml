id: deac01-4b-xacct-replication-kms
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany replicates a data lake bucket in account A to a backup bucket in account B in the same Region by using S3 Replication. The IAM policy of the replication role already allows kms:Decrypt on the source key and kms:Encrypt on the keys of account B. Objects encrypted with SSE-S3 replicate correctly, but objects encrypted with SSE-KMS by using a customer managed key in account A are never replicated. In account B, the replicas must be encrypted with a key that account B controls.

    Which solution will meet these requirements?
  fr: |
    AnyCompany réplique un compartiment de lac de données du compte A vers un compartiment de sauvegarde du compte B, dans la même Région, avec S3 Replication. La politique IAM du rôle de réplication autorise déjà kms:Decrypt sur la clé source et kms:Encrypt sur les clés du compte B. Les objets chiffrés avec SSE-S3 sont répliqués correctement, mais les objets chiffrés avec SSE-KMS à l'aide d'une clé gérée par le client du compte A ne sont jamais répliqués. Dans le compte B, les réplicas doivent être chiffrés avec une clé que le compte B contrôle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set ReplicaKmsKeyID to the AWS managed key aws/s3 of account B, and enable S3 Bucket Keys on the source bucket.", fr: "Définir ReplicaKmsKeyID sur la clé gérée par AWS aws/s3 du compte B, et activer les clés de compartiment S3 sur le compartiment source." } }
    - { id: b, text: { en: "Enable SseKmsEncryptedObjects in the rule, and set ReplicaKmsKeyID to a customer managed key of account B that allows the replication role.", fr: "Activer SseKmsEncryptedObjects dans la règle, et définir ReplicaKmsKeyID sur une clé gérée par le client du compte B qui autorise le rôle de réplication." } }
    - { id: c, text: { en: "Set the default encryption of the destination bucket to SSE-KMS with a customer managed key of account B, and keep the replication rule unchanged.", fr: "Définir le chiffrement par défaut du compartiment de destination sur SSE-KMS avec une clé gérée par le client du compte B, et laisser la règle de réplication inchangée." } }
    - { id: d, text: { en: "Add the account B replication role to the key policy of the account A key, and keep the replication rule unchanged.", fr: "Ajouter le rôle de réplication du compte B à la politique de clé de la clé du compte A, et laisser la règle de réplication inchangée." } }
answer: { optionId: b }
explanation:
  correct:
    en: "S3 does not replicate SSE-KMS objects by default: the rule must opt in with SourceSelectionCriteria SseKmsEncryptedObjects and name a destination key in ReplicaKmsKeyID. The replication role needs kms:Decrypt on the source key and kms:Encrypt on the destination key, which its IAM policy already allows, and for cross-account replication the destination must be a customer managed key whose owner allows that role's account."
    fr: "S3 ne réplique pas les objets SSE-KMS par défaut : la règle doit les inclure avec SourceSelectionCriteria SseKmsEncryptedObjects et indiquer une clé de destination dans ReplicaKmsKeyID. Le rôle de réplication a besoin de kms:Decrypt sur la clé source et de kms:Encrypt sur la clé de destination, ce que sa politique IAM autorise déjà, et pour une réplication intercompte la destination doit être une clé gérée par le client dont le propriétaire autorise le compte de ce rôle."
  options:
    a:
      en: "AWS managed keys do not allow cross-account use, and Bucket Keys do not make SSE-KMS objects eligible for replication."
      fr: "Les clés gérées par AWS ne permettent pas d'usage intercompte, et les clés de compartiment ne rendent pas les objets SSE-KMS éligibles à la réplication."
    c:
      en: "Destination default encryption does not change the rule, which still excludes SSE-KMS source objects."
      fr: "Le chiffrement par défaut de la destination ne modifie pas la règle, qui exclut toujours les objets source SSE-KMS."
    d:
      en: "Key permissions alone do not help while the rule does not opt in to replicating SSE-KMS objects and names no destination key."
      fr: "Des autorisations de clé seules n'aident pas tant que la règle n'inclut pas la réplication des objets SSE-KMS et n'indique aucune clé de destination."
references:
  - title: Replicating encrypted objects (SSE-S3, SSE-KMS, DSSE-KMS, SSE-C)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-config-for-kms-objects.html
