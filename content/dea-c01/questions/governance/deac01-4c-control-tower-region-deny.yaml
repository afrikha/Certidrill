id: deac01-4c-control-tower-region-deny
objective: "4.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany manages 80 accounts with AWS Control Tower, and the home Region of its landing zone is eu-west-1. A privacy regulation requires that no data, including backups, snapshot copies, and replicas, be created in Regions other than eu-west-1 and eu-central-1 in any governed account. The company wants a preventive control with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany gère 80 comptes avec AWS Control Tower, et la Région d'origine de sa zone de destination (landing zone) est eu-west-1. Une réglementation sur la confidentialité exige qu'aucune donnée, y compris les sauvegardes, les copies d'instantanés et les réplicas, ne soit créée dans d'autres Régions qu'eu-west-1 et eu-central-1 dans un compte gouverné. L'entreprise veut un contrôle préventif avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy an AWS Config rule in every account and Region that reports resources created outside the two approved Regions.", fr: "Déployer dans chaque compte et chaque Région une règle AWS Config qui signale les ressources créées en dehors des deux Régions approuvées." } }
    - { id: b, text: { en: "Attach a permissions boundary that denies actions outside the two approved Regions to every IAM role in the accounts.", fr: "Attacher à chaque rôle IAM des comptes une limite d'autorisations qui refuse les actions en dehors des deux Régions approuvées." } }
    - { id: c, text: { en: "Enable the landing zone Region deny control in Control Tower, and allow only eu-west-1 and eu-central-1.", fr: "Activer le contrôle de refus de Région (Region deny) de la zone de destination Control Tower, et n'autoriser qu'eu-west-1 et eu-central-1." } }
    - { id: d, text: { en: "Enable AWS Backup Vault Lock in compliance mode on every backup vault in the two approved Regions.", fr: "Activer AWS Backup Vault Lock en mode conformité sur chaque coffre de sauvegarde des deux Régions approuvées." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The landing zone Region deny control is a preventive control, implemented as an SCP, that denies access to services in Regions that are not allowed, with exemptions for some global services such as IAM. It applies to every OU with the Control Tower baseline and is inherited by lower-level OUs, so resources cannot be deployed in denied Regions."
    fr: "Le contrôle de refus de Région de la zone de destination est un contrôle préventif, mis en œuvre sous forme de SCP, qui refuse l'accès aux services dans les Régions non autorisées, avec des exemptions pour certains services globaux comme IAM. Il s'applique à toutes les OU dotées de la base de référence Control Tower et est hérité par les OU de niveau inférieur : aucune ressource ne peut être déployée dans les Régions refusées."
  options:
    a:
      en: "AWS Config rules are detective: they report noncompliant resources after they are created instead of preventing them."
      fr: "Les règles AWS Config sont des contrôles de détection : elles signalent les ressources non conformes après leur création au lieu de les empêcher."
    b:
      en: "Boundaries on every role must be maintained as roles are added and do not cover principals without them, which is far more overhead."
      fr: "Des limites sur chaque rôle doivent être tenues à jour à mesure que des rôles sont ajoutés et ne couvrent pas les principaux qui n'en ont pas, ce qui représente bien plus de charge."
    d:
      en: "Vault Lock protects recovery points against deletion and retention changes; it does not restrict the Regions where data is created."
      fr: "Vault Lock protège les points de récupération contre la suppression et les modifications de conservation ; il ne limite pas les Régions où des données sont créées."
references:
  - title: Configure the Region deny control
    url: https://docs.aws.amazon.com/controltower/latest/userguide/region-deny.html
