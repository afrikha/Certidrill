id: deac01-4b-ctlake-export-cw
objective: "4.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has used an AWS CloudTrail Lake event data store since 2024 for centralized audit queries. The company decides to move these queries to Amazon CloudWatch, which AWS recommends now that CloudTrail Lake receives only critical bug fixes and security updates. The events from 2024 onward must be queryable in CloudWatch, and the company wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise depuis 2024 un entrepôt de données d'événements AWS CloudTrail Lake pour ses requêtes d'audit centralisées. L'entreprise décide de déplacer ces requêtes vers Amazon CloudWatch, ce qu'AWS recommande maintenant que CloudTrail Lake ne reçoit plus que des correctifs de bogues critiques et des mises à jour de sécurité. Les événements depuis 2024 doivent être interrogeables dans CloudWatch, et l'entreprise veut le MOINS d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use the Export to CloudWatch action on the event data store, and then turn on live CloudTrail ingestion in CloudWatch.", fr: "Utiliser l'action Export to CloudWatch sur l'entrepôt de données d'événements, puis activer l'ingestion CloudTrail en direct dans CloudWatch." } }
    - { id: b, text: { en: "Create a trail that delivers to CloudWatch Logs, and wait for it to backfill the events recorded since 2024.", fr: "Créer un journal de suivi qui livre vers CloudWatch Logs, et attendre qu'il réintègre les événements enregistrés depuis 2024." } }
    - { id: c, text: { en: "Call the LookupEvents API in every Region, and write the results to a CloudWatch Logs log group with a script.", fr: "Appeler l'API LookupEvents dans chaque Région, et écrire les résultats dans un groupe de journaux CloudWatch Logs avec un script." } }
    - { id: d, text: { en: "Run CloudTrail Lake queries that return all events, save the results as CSV, and upload them with the CloudWatch agent.", fr: "Exécuter des requêtes CloudTrail Lake qui renvoient tous les événements, enregistrer les résultats en CSV, et les téléverser avec l'agent CloudWatch." } }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudTrail offers an Export to CloudWatch action on an event data store, which creates a CloudWatch Logs import task for a chosen time range and destination log group. After the history is imported, the company enables live ingestion of CloudTrail events into CloudWatch; AWS suggests a small pilot first."
    fr: "CloudTrail propose une action Export to CloudWatch sur un entrepôt de données d'événements, qui crée une tâche d'importation CloudWatch Logs pour une plage de temps et un groupe de journaux de destination choisis. Une fois l'historique importé, l'entreprise active l'ingestion en direct des événements CloudTrail dans CloudWatch ; AWS conseille d'abord un pilote restreint."
  options:
    b:
      en: "A new trail delivers only events that occur after it is created; it does not backfill history."
      fr: "Un nouveau journal de suivi ne livre que les événements postérieurs à sa création ; il ne réintègre pas l'historique."
    c:
      en: "Event history returns only the last 90 days of management events, far short of the events since 2024."
      fr: "L'historique des événements ne renvoie que les 90 derniers jours d'événements de gestion, bien moins que les événements depuis 2024."
    d:
      en: "Exporting query results to CSV and loading them by agent is manual work, which the built-in export avoids."
      fr: "Exporter des résultats de requêtes en CSV et les charger avec un agent est un travail manuel que l'export intégré évite."
references:
  - title: CloudTrail Lake availability change
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-lake-service-availability-change.html
