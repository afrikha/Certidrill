id: deac01-4b-emrfs-cse-kms
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's Amazon EMR jobs write results to Amazon S3 through EMRFS. A new security rule states that Amazon S3 must never receive the plaintext of these objects: each object must be encrypted on the cluster with a key from AWS KMS before it is sent. The applications must not be rewritten.

    Which solution will meet these requirements?
  fr: |
    Les tâches Amazon EMR d'AnyCompany écrivent leurs résultats dans Amazon S3 via EMRFS. Une nouvelle règle de sécurité indique qu'Amazon S3 ne doit jamais recevoir le texte en clair de ces objets : chaque objet doit être chiffré sur le cluster avec une clé d'AWS KMS avant son envoi. Les applications ne doivent pas être réécrites.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure an EMR security configuration with SSE-KMS for EMRFS, and launch the clusters with it.", fr: "Configurer une configuration de sécurité EMR avec SSE-KMS pour EMRFS, et lancer les clusters avec elle." } }
    - { id: b, text: { en: "Configure an EMR security configuration with CSE-KMS for EMRFS, and launch the clusters with it.", fr: "Configurer une configuration de sécurité EMR avec CSE-KMS pour EMRFS, et lancer les clusters avec elle." } }
    - { id: c, text: { en: "Add a bucket policy that denies s3:PutObject requests that do not include SSE-KMS headers.", fr: "Ajouter une politique de compartiment qui refuse les requêtes s3:PutObject sans en-têtes SSE-KMS." } }
    - { id: d, text: { en: "Configure an EMR security configuration with local disk encryption, and launch the clusters with it.", fr: "Configurer une configuration de sécurité EMR avec chiffrement des disques locaux, et lancer les clusters avec elle." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With CSE-KMS, the EMRFS client on the cluster encrypts each object with a KMS key before uploading it, so S3 only receives ciphertext. It is set in the security configuration, so the Spark applications do not change."
    fr: "Avec CSE-KMS, le client EMRFS du cluster chiffre chaque objet avec une clé KMS avant de le téléverser : S3 ne reçoit que du texte chiffré. Il se définit dans la configuration de sécurité, donc les applications Spark ne changent pas."
  options:
    a:
      en: "With SSE-KMS, S3 receives the object over TLS and encrypts it on the server side, so S3 handles the plaintext."
      fr: "Avec SSE-KMS, S3 reçoit l'objet via TLS et le chiffre côté serveur : S3 manipule donc le texte en clair."
    c:
      en: "Requiring SSE-KMS headers enforces server-side encryption, which still sends plaintext to S3."
      fr: "Exiger des en-têtes SSE-KMS impose un chiffrement côté serveur, qui envoie toujours du texte en clair à S3."
    d:
      en: "Local disk encryption protects instance volumes, not the objects that EMRFS writes to S3."
      fr: "Le chiffrement des disques locaux protège les volumes des instances, pas les objets qu'EMRFS écrit dans S3."
references:
  - title: Encryption options for Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-data-encryption-options.html
