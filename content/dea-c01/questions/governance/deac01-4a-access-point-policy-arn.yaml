id: deac01-4a-access-point-policy-arn
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company created the S3 access point finance-ap in us-east-1 for the bucket amzn-s3-demo-bucket in account 111122223333. The bucket policy delegates access control to the account's access points. The AWS Glue role of the finance team must be able to read the objects under the reports/ prefix through finance-ap.

    Which Resource value should the statement of the access point policy that allows s3:GetObject use?
  fr: |
    Une entreprise a créé le point d'accès S3 finance-ap dans us-east-1 pour le compartiment amzn-s3-demo-bucket du compte 111122223333. La politique de compartiment délègue le contrôle d'accès aux points d'accès du compte. Le rôle AWS Glue de l'équipe finance doit pouvoir lire les objets du préfixe reports/ par finance-ap.

    Quelle valeur Resource l'instruction de la politique de point d'accès qui autorise s3:GetObject doit-elle utiliser ?
body:
  options:
    - { id: a, text: "arn:aws:s3:::amzn-s3-demo-bucket/reports/*" }
    - { id: b, text: "arn:aws:s3:us-east-1:111122223333:accesspoint/finance-ap/reports/*" }
    - { id: c, text: "arn:aws:s3:us-east-1:111122223333:accesspoint/finance-ap/object/reports/*" }
    - { id: d, text: "arn:aws:s3:us-east-1:111122223333:accesspoint/finance-ap" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In an access point policy, objects are named with the access point ARN followed by /object/ and the key prefix. The bucket policy uses the bucket ARN instead, so the Resource entry differs between the two policies even for the same objects.
    fr: |
      Dans une politique de point d'accès, les objets sont désignés par l'ARN du point d'accès suivi de /object/ et du préfixe de clé. La politique de compartiment utilise plutôt l'ARN du compartiment : l'entrée Resource diffère entre les deux politiques, même pour les mêmes objets.
  options:
    a:
      en: |
        This is the bucket ARN form, used in the bucket policy; an access point policy must reference resources through the access point ARN.
      fr: |
        C'est la forme d'ARN du compartiment, utilisée dans la politique de compartiment ; une politique de point d'accès doit désigner les ressources par l'ARN du point d'accès.
    b:
      en: |
        Object resources of an access point need the /object/ segment after the access point name; without it, the ARN does not match the objects.
      fr: |
        Les ressources objet d'un point d'accès ont besoin du segment /object/ après le nom du point d'accès ; sans lui, l'ARN ne correspond pas aux objets.
    d:
      en: |
        This ARN names the access point itself, which suits actions such as s3:ListBucket; it does not match the objects that s3:GetObject reads.
      fr: |
        Cet ARN désigne le point d'accès lui-même, adapté à des actions comme s3:ListBucket ; il ne correspond pas aux objets que lit s3:GetObject.
references:
  - title: Configuring IAM policies for using access points
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points-policies.html
