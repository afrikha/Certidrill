id: deac01-4a-lambda-data-api-endpoints
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function runs in the private subnets of a VPC that has no internet access. The function must run SQL statements on an Amazon Redshift Serverless workgroup by calling the Amazon Redshift Data API. At startup, the function also reads a partner API key directly from AWS Secrets Manager. All traffic must stay on the AWS network, and the function code must not change.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une fonction AWS Lambda s'exécute dans les sous-réseaux privés d'un VPC sans accès à Internet. La fonction doit exécuter des instructions SQL sur un groupe de travail Amazon Redshift Serverless en appelant l'API de données Amazon Redshift (Data API). Au démarrage, la fonction lit aussi directement une clé d'API de partenaire dans AWS Secrets Manager. Tout le trafic doit rester sur le réseau AWS, et le code de la fonction ne doit pas changer.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a gateway VPC endpoint for Amazon Redshift and associate it with the subnets' route tables.", fr: "Créer un point de terminaison de passerelle VPC pour Amazon Redshift et l'associer aux tables de routage des sous-réseaux." } }
    - { id: b, text: { en: "Create an interface VPC endpoint for the Redshift Data API (redshift-data) with private DNS enabled.", fr: "Créer un point de terminaison d'interface VPC pour la Data API Redshift (redshift-data) avec le DNS privé activé." } }
    - { id: c, text: { en: "Create a Redshift-managed VPC endpoint for the workgroup in the function's VPC.", fr: "Créer un point de terminaison VPC géré par Redshift pour le groupe de travail dans le VPC de la fonction." } }
    - { id: d, text: { en: "Create an interface VPC endpoint for Secrets Manager with private DNS enabled.", fr: "Créer un point de terminaison d'interface VPC pour Secrets Manager avec le DNS privé activé." } }
    - { id: e, text: { en: "Create a NAT gateway in the private subnets and add a default route to it.", fr: "Créer une passerelle NAT dans les sous-réseaux privés et ajouter une route par défaut vers celle-ci." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The Data API supports interface VPC endpoints (com.amazonaws.region.redshift-data); with private DNS, the standard Data API host name resolves to the endpoint, so the SDK calls work without code changes. The direct Secrets Manager call needs its own interface endpoint, also with private DNS, to stay in the AWS network.
    fr: |
      La Data API prend en charge les points de terminaison d'interface VPC (com.amazonaws.region.redshift-data) ; avec le DNS privé, le nom d'hôte standard de la Data API se résout vers le point de terminaison, et les appels du SDK fonctionnent sans modifier le code. L'appel direct à Secrets Manager a besoin de son propre point de terminaison d'interface, lui aussi avec le DNS privé, pour rester sur le réseau AWS.
  options:
    a:
      en: |
        Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB.
      fr: |
        Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB.
    c:
      en: |
        A Redshift-managed VPC endpoint gives SQL clients a private connection to the database endpoint; it does not serve the Data API, which is a separate HTTPS service.
      fr: |
        Un point de terminaison VPC géré par Redshift donne aux clients SQL une connexion privée au point de terminaison de la base de données ; il ne sert pas la Data API, qui est un service HTTPS distinct.
    e:
      en: |
        A NAT gateway sends the traffic to the public endpoints through the internet, which the requirement forbids, and it would need a public subnet and an internet gateway.
      fr: |
        Une passerelle NAT envoie le trafic vers les points de terminaison publics par Internet, ce que l'exigence interdit, et elle aurait besoin d'un sous-réseau public et d'une passerelle Internet.
references:
  - title: Creating an Amazon VPC endpoint (AWS PrivateLink) for the Data API
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/data-api-vpc-endpoint.html
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
