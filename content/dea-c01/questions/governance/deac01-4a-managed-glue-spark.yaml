id: deac01-4a-managed-glue-spark
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs nightly PySpark ETL scripts on a self-managed Apache Spark cluster on Amazon EC2 instances. The team spends much of its time patching, sizing, and repairing the nodes. The company wants to run the same scripts on a service that has no infrastructure to manage and that is billed only while the jobs run.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute chaque nuit des scripts ETL PySpark sur un cluster Apache Spark autogéré sur des instances Amazon EC2. L'équipe passe beaucoup de temps à appliquer des correctifs aux nœuds, à les dimensionner et à les réparer. L'entreprise veut exécuter les mêmes scripts sur un service sans infrastructure à gérer et facturé uniquement pendant l'exécution des tâches.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the scripts on an Amazon EMR on EC2 cluster with managed scaling turned on.", fr: "Exécuter les scripts sur un cluster Amazon EMR on EC2 avec la mise à l'échelle gérée activée." } }
    - { id: b, text: { en: "Run the scripts on Spark nodes in an EC2 Auto Scaling group that uses Spot Instances.", fr: "Exécuter les scripts sur des nœuds Spark d'un groupe Auto Scaling EC2 qui utilise des instances Spot." } }
    - { id: c, text: { en: "Run the scripts as AWS Glue ETL jobs.", fr: "Exécuter les scripts sous forme de tâches ETL AWS Glue." } }
    - { id: d, text: { en: "Run the scripts on Amazon EMR on EKS in a new Amazon EKS cluster with managed node groups.", fr: "Exécuter les scripts sur Amazon EMR on EKS dans un nouveau cluster Amazon EKS avec des groupes de nœuds gérés." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AWS Glue is a serverless data integration service that runs Spark ETL scripts with no infrastructure to manage, and it bills pay-as-you-go for the time the jobs run. AWS handles the provisioning, patching, and replacement of the underlying capacity.
    fr: |
      AWS Glue est un service d'intégration de données sans serveur qui exécute des scripts ETL Spark sans infrastructure à gérer, avec une facturation à l'utilisation pour la durée d'exécution des tâches. AWS se charge du provisionnement, des correctifs et du remplacement de la capacité sous-jacente.
  options:
    a:
      en: |
        EMR on EC2 is a managed cluster, but the company still provisions cluster instances that it sizes and pays for while they run.
      fr: |
        EMR on EC2 est un cluster géré, mais l'entreprise provisionne toujours des instances de cluster qu'elle dimensionne et paie tant qu'elles tournent.
    b:
      en: |
        Spark on an Auto Scaling group remains self-managed: the team still installs, patches, and repairs Spark and the instances.
      fr: |
        Spark sur un groupe Auto Scaling reste autogéré : l'équipe installe, corrige et répare toujours Spark et les instances.
    d:
      en: |
        EMR on EKS needs an Amazon EKS cluster and its nodes, which the company must operate.
      fr: |
        EMR on EKS a besoin d'un cluster Amazon EKS et de ses nœuds, que l'entreprise doit exploiter.
references:
  - title: What is AWS Glue?
    url: https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html
