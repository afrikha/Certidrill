id: deac01-4a-rds-vs-ec2-responsibility
objective: "4.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company plans to move the PostgreSQL metadata database of its data pipelines from a self-managed Amazon EC2 instance to Amazon RDS for PostgreSQL.

    Which two tasks will AWS take over after the migration? (Choose two.)
  fr: |
    Une entreprise prévoit de déplacer la base de données PostgreSQL de métadonnées de ses pipelines de données d'une instance Amazon EC2 autogérée vers Amazon RDS for PostgreSQL.

    Quelles sont les deux tâches qu'AWS prendra en charge après la migration ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Patching the operating system of the database host", fr: "L'application des correctifs au système d'exploitation de l'hôte de la base de données" } }
    - { id: b, text: { en: "Tuning slow queries and creating indexes", fr: "L'optimisation des requêtes lentes et la création d'index" } }
    - { id: c, text: { en: "Granting database privileges to the pipeline users", fr: "L'octroi de privilèges de base de données aux utilisateurs des pipelines" } }
    - { id: d, text: { en: "Taking the database backups", fr: "La réalisation des sauvegardes de la base de données" } }
    - { id: e, text: { en: "Choosing the sources that the security group allows", fr: "Le choix des sources que le groupe de sécurité autorise" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      On Amazon EC2, the customer patches the operating system and the database software and takes the backups. On Amazon RDS, AWS takes over OS installation and patching, database software patching, backups, scaling, and high availability.
    fr: |
      Sur Amazon EC2, le client applique les correctifs au système d'exploitation et au logiciel de base de données et réalise les sauvegardes. Sur Amazon RDS, AWS prend en charge l'installation et les correctifs du système d'exploitation, les correctifs du logiciel de base de données, les sauvegardes, la mise à l'échelle et la haute disponibilité.
  options:
    b:
      en: |
        Application optimization, including query tuning, stays with the customer on Amazon RDS.
      fr: |
        L'optimisation de l'application, dont l'optimisation des requêtes, reste à la charge du client sur Amazon RDS.
    c:
      en: |
        Database users, roles, and privileges are defined by the customer inside the database.
      fr: |
        Les utilisateurs, les rôles et les privilèges de base de données sont définis par le client dans la base.
    e:
      en: |
        Network access control, such as security group rules, remains the customer's configuration.
      fr: |
        Le contrôle de l'accès réseau, comme les règles des groupes de sécurité, reste une configuration du client.
references:
  - title: What is Amazon Relational Database Service (Amazon RDS)?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html
