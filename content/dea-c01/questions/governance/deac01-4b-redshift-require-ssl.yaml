id: deac01-4b-redshift-require-ssl
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's BI tools and ETL scripts connect to an Amazon Redshift provisioned cluster over JDBC and ODBC. An audit finds that some clients connect without SSL. The company must make the cluster reject every connection that is not encrypted in transit.

    Which solution will meet these requirements?
  fr: |
    Les outils de BI et les scripts ETL d'AnyCompany se connectent à un cluster provisionné Amazon Redshift via JDBC et ODBC. Un audit constate que certains clients se connectent sans SSL. L'entreprise doit faire en sorte que le cluster rejette toute connexion non chiffrée en transit.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Restrict the inbound rules of the cluster's security group to port 5439 from the client subnets only.", fr: "Limiter les règles entrantes du groupe de sécurité du cluster au port 5439 depuis les seuls sous-réseaux des clients." } }
    - { id: b, text: { en: "Turn on enhanced VPC routing for the cluster so that all traffic stays inside the VPC.", fr: "Activer le routage VPC amélioré pour le cluster afin que tout le trafic reste dans le VPC." } }
    - { id: c, text: { en: "Set the require_SSL parameter to true in the parameter group that is associated with the cluster.", fr: "Définir le paramètre require_SSL à true dans le groupe de paramètres associé au cluster." } }
    - { id: d, text: { en: "Modify the cluster to enable encryption with a customer managed AWS KMS key.", fr: "Modifier le cluster pour activer le chiffrement avec une clé AWS KMS gérée par le client." } }
answer: { optionId: c }
explanation:
  correct:
    en: "By default, a Redshift cluster accepts connections with or without SSL. Setting require_SSL to true in the cluster's parameter group makes the server refuse clients that disable SSL, so every accepted connection is encrypted."
    fr: "Par défaut, un cluster Redshift accepte les connexions avec ou sans SSL. Définir require_SSL à true dans le groupe de paramètres du cluster fait refuser par le serveur les clients qui désactivent SSL : chaque connexion acceptée est chiffrée."
  options:
    a:
      en: "Security group rules filter network sources and ports; they do not require encryption."
      fr: "Les règles de groupe de sécurité filtrent les sources réseau et les ports ; elles n'exigent pas de chiffrement."
    b:
      en: "Enhanced VPC routing controls the path of COPY and UNLOAD traffic; it does not encrypt client connections."
      fr: "Le routage VPC amélioré contrôle le chemin du trafic COPY et UNLOAD ; il ne chiffre pas les connexions des clients."
    d:
      en: "Cluster encryption protects data at rest, not the connections of the clients."
      fr: "Le chiffrement du cluster protège les données au repos, pas les connexions des clients."
references:
  - title: Configuring security options for connections
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/connecting-ssl-support.html
