id: deac01-4c-datashare-cross-account
objective: "4.5.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's data platform account runs an Amazon Redshift producer cluster. A superuser created a datashare named orders_share, added the orders schema and its tables, and ran GRANT USAGE ON DATASHARE orders_share TO ACCOUNT for the company's analytics account. Both clusters are encrypted and are not publicly accessible. The datashare status is pending_authorization, and analysts in the analytics account cannot create a database from it.

    Which combination of actions must be completed before a consumer database can be created? (Choose two.)
  fr: |
    Le compte de plateforme de données d'une entreprise exploite un cluster producteur Amazon Redshift. Un superutilisateur a créé une unité de partage des données (datashare) nommée orders_share, y a ajouté le schéma orders et ses tables, puis a exécuté GRANT USAGE ON DATASHARE orders_share TO ACCOUNT pour le compte d'analyse de l'entreprise. Les deux clusters sont chiffrés et ne sont pas accessibles publiquement. Le statut de l'unité de partage des données est pending_authorization, et les analystes du compte d'analyse ne peuvent pas créer de base de données à partir de celle-ci.

    Quelle combinaison d'actions doit être réalisée avant de pouvoir créer une base de données consommatrice ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A producer superuser runs ALTER DATASHARE orders_share SET PUBLICACCESSIBLE TRUE on the producer cluster.", fr: "Un superutilisateur du producteur exécute ALTER DATASHARE orders_share SET PUBLICACCESSIBLE TRUE sur le cluster producteur." } }
    - { id: b, text: { en: "A producer account administrator authorizes the analytics account as a consumer of the datashare.", fr: "Un administrateur du compte producteur autorise le compte d'analyse en tant que consommateur de l'unité de partage des données." } }
    - { id: c, text: { en: "A producer account administrator copies a manual snapshot of the producer cluster to the analytics account.", fr: "Un administrateur du compte producteur copie un instantané manuel du cluster producteur dans le compte d'analyse." } }
    - { id: d, text: { en: "A consumer account administrator associates the datashare with the analytics account or some of its namespaces.", fr: "Un administrateur du compte consommateur associe l'unité de partage des données au compte d'analyse ou à certains de ses espaces de noms." } }
    - { id: e, text: { en: "A consumer account administrator creates an IAM role that the producer account is allowed to assume.", fr: "Un administrateur du compte consommateur crée un rôle IAM que le compte producteur est autorisé à endosser." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Cross-account data sharing uses a two-way handshake. After usage is granted to an account, the datashare is pending_authorization until a producer account administrator authorizes the consumer; then a consumer account administrator associates the datashare with the entire account or with specific namespaces, and only then can a consumer database be created."
    fr: "Le partage de données entre comptes repose sur une négociation en deux temps. Après l'octroi de l'utilisation à un compte, l'unité de partage des données reste pending_authorization jusqu'à ce qu'un administrateur du compte producteur autorise le consommateur ; un administrateur du compte consommateur associe ensuite l'unité de partage des données à tout le compte ou à des espaces de noms précis, et ce n'est qu'alors qu'une base de données consommatrice peut être créée."
  options:
    a:
      en: "PUBLICACCESSIBLE only allows sharing with publicly accessible clusters; the consumer cluster here is not publicly accessible."
      fr: "PUBLICACCESSIBLE autorise seulement le partage avec des clusters accessibles publiquement ; ici, le cluster consommateur ne l'est pas."
    c:
      en: "A snapshot copy creates a separate copy of the data; it plays no part in the datashare authorization workflow."
      fr: "La copie d'un instantané crée une copie distincte des données ; elle ne joue aucun rôle dans le processus d'autorisation de l'unité de partage des données."
    e:
      en: "Data sharing does not rely on cross-account role assumption; access comes from the producer authorization and the consumer association."
      fr: "Le partage de données ne repose pas sur l'endossement de rôle entre comptes ; l'accès vient de l'autorisation du producteur et de l'association du consommateur."
references:
  - title: Sharing data across AWS accounts
    url: https://docs.aws.amazon.com/redshift/latest/dg/across-account.html
  - title: Consumer account administrator actions
    url: https://docs.aws.amazon.com/redshift/latest/dg/consumer-account-admin.html
