id: deac01-4a-customer-managed-reuse
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 12 IAM roles for AWS Glue jobs and AWS Step Functions state machines in different pipelines. All of them need the same set of Amazon Athena and Amazon S3 permissions, which is narrower than the AmazonAthenaFullAccess managed policy. The security team will adjust these permissions over time and wants each change to apply to all 12 roles at once.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a 12 rôles IAM pour des tâches AWS Glue et des machines d'état AWS Step Functions dans différents pipelines. Tous ont besoin du même ensemble d'autorisations Amazon Athena et Amazon S3, plus restreint que la politique gérée AmazonAthenaFullAccess. L'équipe de sécurité ajustera ces autorisations au fil du temps et veut que chaque modification s'applique aux 12 rôles en une seule fois.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create one customer managed policy with the permissions and attach it to the 12 roles.", fr: "Créer une politique gérée par le client avec les autorisations et l'attacher aux 12 rôles." } }
    - { id: b, text: { en: "Add an identical inline policy with the permissions to each of the 12 roles.", fr: "Ajouter une politique en ligne identique avec les autorisations à chacun des 12 rôles." } }
    - { id: c, text: { en: "Edit the AmazonAthenaFullAccess policy to remove the actions that the roles do not need.", fr: "Modifier la politique AmazonAthenaFullAccess pour retirer les actions dont les rôles n'ont pas besoin." } }
    - { id: d, text: { en: "Create an IAM user group with the permissions and add the 12 roles to the group.", fr: "Créer un groupe d'utilisateurs IAM avec les autorisations et ajouter les 12 rôles au groupe." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A customer managed policy is a standalone policy that you can attach to many roles; when you update it, the change applies to every principal it is attached to. It is the recommended choice when a policy applies to more than one entity, and you can start from a copy of an AWS managed policy.
    fr: |
      Une politique gérée par le client est une politique autonome que vous pouvez attacher à de nombreux rôles ; quand vous la mettez à jour, la modification s'applique à chaque principal auquel elle est attachée. C'est le choix recommandé quand une politique concerne plusieurs entités, et vous pouvez partir d'une copie d'une politique gérée par AWS.
  options:
    b:
      en: |
        Inline policies have a one-to-one relationship with an identity, so every change must be repeated on 12 roles.
      fr: |
        Les politiques en ligne ont une relation un-à-un avec une identité : chaque modification doit être répétée sur 12 rôles.
    c:
      en: |
        You cannot change the permissions defined in AWS managed policies.
      fr: |
        Vous ne pouvez pas modifier les autorisations définies dans les politiques gérées par AWS.
    d:
      en: |
        IAM user groups contain only IAM users; roles cannot be members of a group.
      fr: |
        Les groupes d'utilisateurs IAM ne contiennent que des utilisateurs IAM ; les rôles ne peuvent pas être membres d'un groupe.
references:
  - title: Managed policies and inline policies
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html
  - title: IAM user groups
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_groups.html
