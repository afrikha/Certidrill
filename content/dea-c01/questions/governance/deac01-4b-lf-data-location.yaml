id: deac01-4b-lf-data-location
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany governs its data lake with AWS Lake Formation. A data engineering role has the CREATE_TABLE permission on the `sales_db` database, whose location is `s3://example-lake/sales/`. The engineer tries to create a table in `sales_db` whose location is `s3://example-lake/landing/events/`, which is registered with Lake Formation, and the request fails with an access denied error. The company follows the principle of least privilege.

    Which solution will meet these requirements?
  fr: |
    AnyCompany gouverne son lac de données avec AWS Lake Formation. Un rôle d'ingénierie des données dispose de l'autorisation CREATE_TABLE sur la base de données `sales_db`, dont l'emplacement est `s3://example-lake/sales/`. L'ingénieur tente de créer dans `sales_db` une table dont l'emplacement est `s3://example-lake/landing/events/`, enregistré auprès de Lake Formation, et la requête échoue avec une erreur d'accès refusé. L'entreprise applique le principe du moindre privilège.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Grant the role the data location permission on s3://example-lake/landing/events/ in Lake Formation.", fr: "Accorder au rôle l'autorisation d'emplacement de données sur s3://example-lake/landing/events/ dans Lake Formation." } }
    - { id: b, text: { en: "Add s3:PutObject and s3:GetObject on s3://example-lake/landing/* to the IAM policy of the role.", fr: "Ajouter s3:PutObject et s3:GetObject sur s3://example-lake/landing/* à la politique IAM du rôle." } }
    - { id: c, text: { en: "Grant the role the Super permission on the sales_db database in Lake Formation.", fr: "Accorder au rôle l'autorisation Super sur la base de données sales_db dans Lake Formation." } }
    - { id: d, text: { en: "Add the role to the list of data lake administrators in the Lake Formation settings.", fr: "Ajouter le rôle à la liste des administrateurs du lac de données dans les paramètres de Lake Formation." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A principal needs data location permissions to create or update a Data Catalog table that points to a registered S3 location. CREATE_TABLE gives an implicit permission only for the database location and its children, so the landing path needs an explicit data location grant."
    fr: "Un principal a besoin d'autorisations d'emplacement de données pour créer ou modifier une table du Data Catalog qui pointe vers un emplacement S3 enregistré. CREATE_TABLE ne donne une autorisation implicite que pour l'emplacement de la base de données et ses sous-emplacements : le chemin landing exige une autorisation d'emplacement de données explicite."
  options:
    b:
      en: "S3 object permissions do not authorize creating catalog metadata that points to a registered location."
      fr: "Des autorisations sur les objets S3 n'autorisent pas la création de métadonnées de catalogue pointant vers un emplacement enregistré."
    c:
      en: "Super on the database grants every operation on it and still does not cover a location outside the database path; it breaks least privilege."
      fr: "Super sur la base de données accorde toutes les opérations sur celle-ci sans couvrir un emplacement hors du chemin de la base : cela enfreint le moindre privilège."
    d:
      en: "Data lake administrators get broad control of the whole Data Catalog, far more than one table location."
      fr: "Les administrateurs du lac de données obtiennent un large contrôle de tout le Data Catalog, bien plus qu'un emplacement de table."
references:
  - title: Underlying data access control
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/access-control-underlying-data.html
