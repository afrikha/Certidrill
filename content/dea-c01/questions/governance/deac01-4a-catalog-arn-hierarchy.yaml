id: deac01-4a-catalog-arn-hierarchy
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data engineer writes a custom IAM policy for an analytics role that must read the metadata of only the table orders in the AWS Glue database sales (account 111122223333, us-east-1). AWS Lake Formation is not used to manage permissions in this Data Catalog. With the following policy attached, glue:GetTable calls for the table fail with an AccessDenied error.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["glue:GetTable"],
          "Resource": "arn:aws:glue:us-east-1:111122223333:table/sales/orders"
        }
      ]
    }
    ```

    Which change will fix the policy while following the principle of least privilege?
  fr: |
    Un ingénieur des données écrit une politique IAM personnalisée pour un rôle d'analyse qui doit lire les métadonnées de la seule table orders de la base de données AWS Glue sales (compte 111122223333, us-east-1). AWS Lake Formation n'est pas utilisé pour gérer les autorisations de ce catalogue de données. Avec la politique suivante attachée, les appels glue:GetTable sur la table échouent avec une erreur AccessDenied.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["glue:GetTable"],
          "Resource": "arn:aws:glue:us-east-1:111122223333:table/sales/orders"
        }
      ]
    }
    ```

    Quelle modification corrige la politique tout en respectant le principe du moindre privilège ?
body:
  options:
    - { id: a, text: { en: "Change Resource to arn:aws:glue:us-east-1:111122223333:* so that it covers every Glue resource of the account.", fr: "Remplacer Resource par arn:aws:glue:us-east-1:111122223333:* pour couvrir toutes les ressources Glue du compte." } }
    - { id: b, text: { en: "Add the glue:GetDatabase and glue:GetTables actions to the statement, on the same table ARN.", fr: "Ajouter les actions glue:GetDatabase et glue:GetTables à l'instruction, sur le même ARN de table." } }
    - { id: c, text: { en: "Add the ARNs of the catalog (...:catalog) and of the database (...:database/sales) to the Resource element.", fr: "Ajouter les ARN du catalogue (...:catalog) et de la base de données (...:database/sales) à l'élément Resource." } }
    - { id: d, text: { en: "Change Resource to arn:aws:glue:us-east-1:111122223333:table/sales/* so that it covers every table of the database.", fr: "Remplacer Resource par arn:aws:glue:us-east-1:111122223333:table/sales/* pour couvrir toutes les tables de la base de données." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An operation on a Data Catalog resource requires permission on the resource and on all of its ancestors: actions on a table need the table, database, and catalog ARNs. Adding only the catalog and sales database ARNs lets GetTable succeed for orders without granting access to other tables.
    fr: |
      Une opération sur une ressource du catalogue de données exige une autorisation sur la ressource et sur tous ses ancêtres : les actions sur une table nécessitent les ARN de la table, de la base de données et du catalogue. Ajouter uniquement les ARN du catalogue et de la base sales permet à GetTable de réussir pour orders sans donner accès à d'autres tables.
  options:
    a:
      en: |
        A wildcard on the whole account would work but grants GetTable on every database and table, which breaks least privilege.
      fr: |
        Un caractère générique sur tout le compte fonctionnerait, mais accorde GetTable sur toutes les bases et tables, ce qui contredit le moindre privilège.
    b:
      en: |
        More actions on the table ARN do not help: GetTable still lacks permission on the parent database and catalog.
      fr: |
        Ajouter des actions sur l'ARN de la table n'aide pas : GetTable n'a toujours pas d'autorisation sur la base de données et le catalogue parents.
    d:
      en: |
        Widening the table ARN still omits the database and catalog ARNs, so the call keeps failing, and it covers other tables.
      fr: |
        Élargir l'ARN de table omet toujours les ARN de la base et du catalogue : l'appel échoue encore, et la politique couvre d'autres tables.
references:
  - title: Specifying AWS Glue resource ARNs
    url: https://docs.aws.amazon.com/glue/latest/dg/glue-specifying-resource-arns.html
