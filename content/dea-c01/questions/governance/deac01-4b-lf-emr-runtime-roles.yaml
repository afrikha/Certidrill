id: deac01-4b-lf-emr-runtime-roles
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs one shared Amazon EMR 7.x cluster for three teams. The teams submit Apache Spark jobs as EMR steps that read tables of the AWS Glue Data Catalog, governed by AWS Lake Formation. Each team must see only the columns and rows that its own Lake Formation grants allow, and the company does not want a cluster per team.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un cluster Amazon EMR 7.x partagé par trois équipes. Les équipes soumettent des tâches Apache Spark sous forme d'étapes EMR qui lisent des tables du AWS Glue Data Catalog gouvernées par AWS Lake Formation. Chaque équipe ne doit voir que les colonnes et les lignes que ses propres autorisations Lake Formation permettent, et l'entreprise ne veut pas de cluster par équipe.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Grant the Lake Formation permissions of all three teams to the EC2 instance profile of the cluster, and give each team its own S3 prefix for results.", fr: "Accorder les autorisations Lake Formation des trois équipes au profil d'instance EC2 du cluster, et donner à chaque équipe son propre préfixe S3 pour les résultats." } }
    - { id: b, text: { en: "Turn on runtime role authorization for the cluster, and submit each team's steps with a runtime role that has that team's Lake Formation grants.", fr: "Activer l'autorisation par rôle d'exécution (runtime role) sur le cluster, et soumettre les étapes de chaque équipe avec un rôle d'exécution qui détient les autorisations Lake Formation de cette équipe." } }
    - { id: c, text: { en: "Add S3 bucket policy statements that allow each team to read only the prefixes of the tables it may use.", fr: "Ajouter des instructions de politique de compartiment S3 qui autorisent chaque équipe à lire uniquement les préfixes des tables qu'elle peut utiliser." } }
    - { id: d, text: { en: "Use an Apache Hive metastore on the primary node, and grant each team SELECT on its tables in Hive.", fr: "Utiliser un metastore Apache Hive sur le nœud primaire, et accorder à chaque équipe SELECT sur ses tables dans Hive." } }
answer: { optionId: b }
explanation:
  correct:
    en: "From EMR 6.7.0, Lake Formation access control applies to Spark, Hive, and Presto jobs when the cluster has runtime role authorization and uses the Glue Data Catalog. Lake Formation vends temporary credentials for the runtime role of each step, and EMR filters the data according to that role's column, row, or cell permissions."
    fr: "Depuis EMR 6.7.0, le contrôle d'accès Lake Formation s'applique aux tâches Spark, Hive et Presto lorsque le cluster utilise l'autorisation par rôle d'exécution et le Glue Data Catalog. Lake Formation distribue des informations d'identification temporaires pour le rôle d'exécution de chaque étape, et EMR filtre les données selon les autorisations de colonne, de ligne ou de cellule de ce rôle."
  options:
    a:
      en: "The instance profile is shared by every job on the cluster, so all teams would get the same permissions."
      fr: "Le profil d'instance est partagé par toutes les tâches du cluster : toutes les équipes obtiendraient les mêmes autorisations."
    c:
      en: "Bucket policies work at object and prefix level; they cannot enforce column or row permissions."
      fr: "Les politiques de compartiment agissent au niveau des objets et des préfixes ; elles ne peuvent pas appliquer d'autorisations de colonne ou de ligne."
    d:
      en: "A local Hive metastore bypasses the Glue Data Catalog, so the Lake Formation grants would not apply at all."
      fr: "Un metastore Hive local contourne le Glue Data Catalog : les autorisations Lake Formation ne s'appliqueraient pas du tout."
references:
  - title: Integrate Amazon EMR with AWS Lake Formation
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-lake-formation.html
