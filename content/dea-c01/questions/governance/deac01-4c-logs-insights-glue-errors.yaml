id: deac01-4c-logs-insights-glue-errors
objective: "4.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team runs AWS Glue ETL jobs and AWS Lambda functions that write their logs to Amazon CloudWatch Logs. After a failed nightly run, an engineer must interactively search the log groups for the last 24 hours, filter the error messages, and count them by job. The engineer wants to start immediately, without moving the logs or deploying any resources.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données exécute des tâches ETL AWS Glue et des fonctions AWS Lambda qui écrivent leurs journaux dans Amazon CloudWatch Logs. Après l'échec d'une exécution nocturne, un ingénieur doit rechercher de manière interactive dans les groupes de journaux des dernières 24 heures, filtrer les messages d'erreur et les compter par tâche. L'ingénieur veut commencer immédiatement, sans déplacer les journaux ni déployer de ressources.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Export the log groups to Amazon S3 with an export task, and query the exported files with Amazon Athena.", fr: "Exporter les groupes de journaux vers Amazon S3 avec une tâche d'exportation, et interroger les fichiers exportés avec Amazon Athena." } }
    - { id: b, text: { en: "Create a subscription filter that streams the log groups to an Amazon OpenSearch Service domain, and search them in OpenSearch Dashboards.", fr: "Créer un filtre d'abonnement qui diffuse les groupes de journaux vers un domaine Amazon OpenSearch Service, et y effectuer les recherches dans OpenSearch Dashboards." } }
    - { id: c, text: { en: "Run a CloudWatch Logs Insights query across the log groups for the last 24 hours that filters and aggregates the error messages.", fr: "Exécuter sur les groupes de journaux une requête CloudWatch Logs Insights portant sur les dernières 24 heures, qui filtre et agrège les messages d'erreur." } }
    - { id: d, text: { en: "Create a metric filter on each log group that counts the error messages, and graph the metrics in a CloudWatch dashboard.", fr: "Créer sur chaque groupe de journaux un filtre de métriques qui compte les messages d'erreur, et afficher les métriques dans un tableau de bord CloudWatch." } }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudWatch Logs Insights searches and analyzes log data where it already is, interactively, with filter and aggregation commands (Logs Insights QL, or OpenSearch PPL or SQL). A query can cover several log groups and a chosen time range, and it is charged by the data scanned, with nothing to deploy."
    fr: "CloudWatch Logs Insights recherche et analyse les données de journaux là où elles se trouvent, de manière interactive, avec des commandes de filtrage et d'agrégation (Logs Insights QL, ou PPL et SQL OpenSearch). Une requête peut couvrir plusieurs groupes de journaux et une plage de temps choisie, et elle est facturée selon les données analysées, sans rien à déployer."
  options:
    a:
      en: "An export moves the logs, and exported data can take up to 12 hours to become available, so the engineer cannot start immediately."
      fr: "Une exportation déplace les journaux, et les données exportées peuvent mettre jusqu'à 12 heures à être disponibles : l'ingénieur ne peut pas commencer immédiatement."
    b:
      en: "This deploys a domain and streams only the events that arrive after the filter is created, so the last 24 hours are not searchable."
      fr: "Cette solution déploie un domaine et ne diffuse que les événements qui arrivent après la création du filtre : les dernières 24 heures ne sont pas consultables."
    d:
      en: "Metric filters evaluate only log events that arrive after they are created and produce counts, not the error messages to investigate."
      fr: "Les filtres de métriques n'évaluent que les événements de journaux arrivés après leur création et produisent des nombres, pas les messages d'erreur à examiner."
references:
  - title: Analyzing log data with CloudWatch Logs Insights
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/AnalyzingLogData.html
  - title: Exporting log data to Amazon S3
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/S3Export.html
