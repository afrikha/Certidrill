id: deac01-4c-opensearch-near-real-time
objective: "4.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company collects application logs from a fleet of Amazon EC2 instances with the Amazon Kinesis Agent. Support engineers need to run full-text searches on the logs within about a minute of each event and use interactive dashboards that update continuously. The company wants a managed solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce en ligne collecte les journaux d'application d'un parc d'instances Amazon EC2 avec Amazon Kinesis Agent. Les ingénieurs du support doivent effectuer des recherches en texte intégral dans les journaux environ une minute après chaque événement et utiliser des tableaux de bord interactifs mis à jour en continu. L'entreprise veut une solution gérée avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the logs to an Amazon Data Firehose stream that delivers them to an Amazon OpenSearch Service domain, and build the dashboards in OpenSearch Dashboards.", fr: "Envoyer les journaux vers un flux Amazon Data Firehose qui les livre à un domaine Amazon OpenSearch Service, et créer les tableaux de bord dans OpenSearch Dashboards." } }
    - { id: b, text: { en: "Send the logs to an Amazon Data Firehose stream that delivers them to Amazon S3 every 15 minutes, and query them with Amazon Athena from Quick Sight dashboards.", fr: "Envoyer les journaux vers un flux Amazon Data Firehose qui les livre à Amazon S3 toutes les 15 minutes, et les interroger avec Amazon Athena depuis des tableaux de bord Quick Sight." } }
    - { id: c, text: { en: "Send the logs to an Amazon Kinesis Data Streams stream, and have a consumer application on Amazon EC2 index them into a self-managed search cluster.", fr: "Envoyer les journaux vers un flux Amazon Kinesis Data Streams, et faire indexer les journaux par une application consommatrice sur Amazon EC2 dans un cluster de recherche autogéré." } }
    - { id: d, text: { en: "Write the logs to an Amazon S3 bucket every hour, and load them into an Amazon Redshift cluster with the COPY command for SQL analysis.", fr: "Écrire les journaux dans un compartiment Amazon S3 toutes les heures, et les charger dans un cluster Amazon Redshift avec la commande COPY pour une analyse SQL." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon OpenSearch Service is a managed search and analytics engine for log analytics and real-time application monitoring, with visualizations in OpenSearch Dashboards. Amazon Data Firehose delivers directly to an OpenSearch Service domain (failed records go to an S3 error bucket), so no ingestion code or servers are needed."
    fr: "Amazon OpenSearch Service est un moteur de recherche et d'analyse géré destiné à l'analyse des journaux et à la surveillance des applications en temps réel, avec des visualisations dans OpenSearch Dashboards. Amazon Data Firehose livre directement à un domaine OpenSearch Service (les enregistrements en échec vont dans un compartiment S3 d'erreurs) : aucun code d'ingestion ni serveur n'est nécessaire."
  options:
    b:
      en: "A 15-minute delivery interval misses the one-minute target, and Athena runs SQL scans on files rather than full-text searches on an index."
      fr: "Un intervalle de livraison de 15 minutes manque l'objectif d'une minute, et Athena exécute des analyses SQL sur des fichiers plutôt que des recherches en texte intégral dans un index."
    c:
      en: "A custom consumer and a self-managed search cluster on EC2 add the most operational overhead."
      fr: "Un consommateur personnalisé et un cluster de recherche autogéré sur EC2 ajoutent le plus de charge opérationnelle."
    d:
      en: "Hourly batches do not provide searches within a minute, and Redshift is a SQL warehouse, not a full-text search engine."
      fr: "Des lots horaires ne permettent pas de recherches en une minute, et Redshift est un entrepôt SQL, pas un moteur de recherche en texte intégral."
references:
  - title: What is Amazon OpenSearch Service?
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html
  - title: Configure destination settings
    url: https://docs.aws.amazon.com/firehose/latest/dev/create-destination.html
