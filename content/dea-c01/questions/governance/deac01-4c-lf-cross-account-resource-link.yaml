id: deac01-4c-lf-cross-account-resource-link
objective: "4.5.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A central governance account shares the sales.orders table of its AWS Glue Data Catalog with a consumer account in the same organization. The share uses AWS Lake Formation LF-tag-based grants to the consumer account, with the grant option. In the consumer account, analysts use Amazon Athena with an IAM role named AnalystRole. The shared table is visible to the consumer data lake administrator, but AnalystRole cannot query it.

    Which combination of actions should the consumer data lake administrator take? (Choose two.)
  fr: |
    Un compte de gouvernance central partage la table sales.orders de son AWS Glue Data Catalog avec un compte consommateur de la même organisation. Le partage repose sur des autorisations AWS Lake Formation basées sur les balises LF (LF-tags) accordées au compte consommateur, avec l'option d'octroi. Dans le compte consommateur, les analystes utilisent Amazon Athena avec un rôle IAM nommé AnalystRole. La table partagée est visible par l'administrateur du lac de données du compte consommateur, mais AnalystRole ne peut pas l'interroger.

    Quelle combinaison d'actions l'administrateur du lac de données du compte consommateur doit-il effectuer ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a resource link to the shared table in a local database, and grant DESCRIBE on the resource link to AnalystRole.", fr: "Créer un lien de ressource vers la table partagée dans une base de données locale, et accorder DESCRIBE sur ce lien de ressource à AnalystRole." } }
    - { id: b, text: { en: "Accept the AWS RAM resource share invitation that the central governance account sent.", fr: "Accepter l'invitation de partage de ressources AWS RAM envoyée par le compte de gouvernance central." } }
    - { id: c, text: { en: "Add a statement to the bucket policy of the producer's S3 bucket that allows AnalystRole to read the table data.", fr: "Ajouter à la politique du compartiment S3 du producteur une instruction qui autorise AnalystRole à lire les données de la table." } }
    - { id: d, text: { en: "In Lake Formation, grant SELECT on the shared target table, not on the resource link, to AnalystRole.", fr: "Dans Lake Formation, accorder SELECT à AnalystRole sur la table cible partagée, et non sur le lien de ressource." } }
    - { id: e, text: { en: "Run an AWS Glue crawler in the consumer account on the producer's S3 location to create a local table definition.", fr: "Exécuter dans le compte consommateur un robot d'analyse AWS Glue sur l'emplacement S3 du producteur pour créer une définition de table locale." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Athena queries shared tables through resource links, which are Data Catalog objects in the consumer account that point to the shared table; other principals need DESCRIBE on the link to see it. Permissions on a resource link do not grant access to its target, so the data lake administrator, who can regrant the shared permissions to principals of the account, must also grant SELECT on the shared table."
    fr: "Athena interroge les tables partagées via des liens de ressource, objets du Data Catalog du compte consommateur qui pointent vers la table partagée ; les autres principaux ont besoin de DESCRIBE sur le lien pour le voir. Les autorisations sur un lien de ressource ne donnent pas accès à sa cible : l'administrateur du lac de données, qui peut accorder à son tour les autorisations partagées aux principaux du compte, doit aussi accorder SELECT sur la table partagée."
  options:
    b:
      en: "Within the same organization, the shared resource is available immediately; a RAM invitation is sent only to accounts outside the organization."
      fr: "Au sein d'une même organisation, la ressource partagée est disponible immédiatement ; une invitation RAM n'est envoyée qu'aux comptes extérieurs à l'organisation."
    c:
      en: "Lake Formation vends temporary credentials to integrated services for the registered location, so a bucket policy for the role is not needed, and the consumer administrator cannot change the producer's bucket policy."
      fr: "Lake Formation fournit des informations d'identification temporaires aux services intégrés pour l'emplacement enregistré : une politique de compartiment pour le rôle n'est pas nécessaire, et l'administrateur du compte consommateur ne peut pas modifier la politique de compartiment du producteur."
    e:
      en: "A crawled local table bypasses the governed share and its Lake Formation permissions."
      fr: "Une table locale créée par un robot d'analyse contourne le partage gouverné et ses autorisations Lake Formation."
references:
  - title: How resource links work in Lake Formation
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/resource-links-about.html
  - title: Granting permissions on a database or table shared with your account
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/regranting-shared-resources.html
