id: deac01-4b-redshift-enable-kms
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an unencrypted Amazon Redshift provisioned cluster that stores 20 TB of data. A new regulation requires the data to be encrypted at rest with a customer managed AWS KMS key. The cluster can be read-only for a few hours, but the company wants the LEAST operational effort. Cross-Region snapshot copy is not configured.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un cluster provisionné Amazon Redshift non chiffré qui stocke 20 To de données. Une nouvelle réglementation exige que les données soient chiffrées au repos avec une clé AWS KMS gérée par le client. Le cluster peut être en lecture seule pendant quelques heures, mais l'entreprise veut le MOINS d'effort opérationnel possible. La copie d'instantanés entre Régions n'est pas configurée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "UNLOAD all tables to Amazon S3, create a new cluster encrypted with the key, and COPY the data into it.", fr: "Exécuter UNLOAD de toutes les tables vers Amazon S3, créer un nouveau cluster chiffré avec la clé, et y charger les données avec COPY." } }
    - { id: b, text: { en: "Modify the cluster with the --encrypted option and the --kms-key-id option set to the customer managed key.", fr: "Modifier le cluster avec l'option --encrypted et l'option --kms-key-id définie sur la clé gérée par le client." } }
    - { id: c, text: { en: "Enable SSE-KMS with the key on the Amazon S3 bucket that receives the audit logs of the cluster.", fr: "Activer SSE-KMS avec la clé sur le compartiment Amazon S3 qui reçoit les journaux d'audit du cluster." } }
    - { id: d, text: { en: "Modify the cluster to use hardware security module (HSM) encryption with the customer managed key.", fr: "Modifier le cluster pour utiliser le chiffrement par module de sécurité matériel (HSM) avec la clé gérée par le client." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Modifying a provisioned cluster to enable AWS KMS encryption makes Amazon Redshift migrate the data automatically to a new encrypted cluster, and --kms-key-id selects the customer managed key. The cluster stays available in read-only mode during the migration."
    fr: "Modifier un cluster provisionné pour activer le chiffrement AWS KMS amène Amazon Redshift à migrer automatiquement les données vers un nouveau cluster chiffré, et --kms-key-id sélectionne la clé gérée par le client. Le cluster reste disponible en lecture seule pendant la migration."
  options:
    a:
      en: "Unloading and reloading 20 TB works but takes much more effort than the built-in encryption change."
      fr: "Décharger puis recharger 20 To fonctionne, mais demande beaucoup plus d'effort que la modification de chiffrement intégrée."
    c:
      en: "Encrypting the audit log bucket protects log files, not the data stored in the cluster."
      fr: "Chiffrer le compartiment des journaux d'audit protège des fichiers journaux, pas les données stockées dans le cluster."
    d:
      en: "HSM encryption cannot be enabled by modifying a cluster, and it uses an HSM rather than a KMS key."
      fr: "Le chiffrement HSM ne peut pas être activé en modifiant un cluster, et il utilise un HSM plutôt qu'une clé KMS."
references:
  - title: Changing cluster encryption
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/changing-cluster-encryption.html
