id: deac01-4c-redshift-audit-activity
objective: "4.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an Amazon Redshift provisioned cluster. Auditors require a record of every SQL query that users run, in addition to connection attempts and changes to database users. The records must be searchable in Amazon CloudWatch Logs together with other application logs. Audit logging is currently turned off.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exploite un cluster provisionné Amazon Redshift. Les auditeurs exigent un enregistrement de chaque requête SQL exécutée par les utilisateurs, en plus des tentatives de connexion et des modifications des utilisateurs de base de données. Ces enregistrements doivent pouvoir être recherchés dans Amazon CloudWatch Logs avec les autres journaux d'application. La journalisation d'audit est actuellement désactivée.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on audit logging for the cluster, and export the connection, user, and user activity logs to CloudWatch Logs.", fr: "Activer la journalisation d'audit du cluster, et exporter les journaux de connexion, d'utilisateurs et d'activité des utilisateurs vers CloudWatch Logs." } }
    - { id: b, text: { en: "Create an AWS CloudTrail trail that sends the Amazon Redshift management events of the account to CloudWatch Logs.", fr: "Créer un journal de suivi AWS CloudTrail qui envoie les événements de gestion Amazon Redshift du compte à CloudWatch Logs." } }
    - { id: c, text: { en: "Turn on enhanced VPC routing for the cluster so that query traffic is captured in the VPC flow logs of the cluster's VPC.", fr: "Activer le routage VPC amélioré du cluster afin que le trafic des requêtes soit capturé dans les journaux de flux VPC du VPC du cluster." } }
    - { id: d, text: { en: "Set the enable_user_activity_logging parameter to true in the parameter group that is associated with the cluster.", fr: "Définir le paramètre enable_user_activity_logging sur true dans le groupe de paramètres associé au cluster." } }
    - { id: e, text: { en: "Create an Amazon Redshift event subscription for the security category, and send the events to an Amazon SNS topic.", fr: "Créer un abonnement aux événements Amazon Redshift pour la catégorie de sécurité, et envoyer les événements à une rubrique Amazon SNS." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Redshift audit logging produces a connection log, a user log, and a user activity log that records each query, and it can export them to CloudWatch Logs log groups. The user activity log is written only when the enable_user_activity_logging database parameter is true; it defaults to false, in which case only the connection and user logs are recorded."
    fr: "La journalisation d'audit Redshift produit un journal de connexion, un journal d'utilisateurs et un journal d'activité des utilisateurs qui enregistre chaque requête, et elle peut les exporter vers des groupes de journaux CloudWatch Logs. Le journal d'activité des utilisateurs n'est écrit que si le paramètre de base de données enable_user_activity_logging vaut true ; sa valeur par défaut est false, auquel cas seuls les journaux de connexion et d'utilisateurs sont enregistrés."
  options:
    b:
      en: "CloudTrail management events record calls to the Redshift API, such as cluster changes, not the SQL queries that users run in the database."
      fr: "Les événements de gestion CloudTrail enregistrent les appels à l'API Redshift, comme les modifications du cluster, pas les requêtes SQL exécutées par les utilisateurs dans la base de données."
    c:
      en: "Flow logs record IP traffic metadata, not SQL statements, connections at the database level, or user changes."
      fr: "Les journaux de flux enregistrent des métadonnées de trafic IP, pas des instructions SQL, des connexions au niveau de la base de données ni des modifications d'utilisateurs."
    e:
      en: "Event subscriptions notify about cluster-level events; they do not record the queries that users run."
      fr: "Les abonnements aux événements signalent des événements au niveau du cluster ; ils n'enregistrent pas les requêtes exécutées par les utilisateurs."
references:
  - title: Database audit logging
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/db-auditing.html
