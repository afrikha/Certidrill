id: deac01-4b-ctlake-pre2023
objective: "4.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is an existing AWS CloudTrail Lake customer. Its event data store holds events from January 2021 onward, and a regulation requires every event to remain queryable for 7 years. The company is migrating its centralized audit queries to Amazon CloudWatch and wants to stop sending new events to CloudTrail Lake.

    Which solution will meet these requirements?
  fr: |
    AnyCompany est déjà cliente d'AWS CloudTrail Lake. Son entrepôt de données d'événements contient des événements depuis janvier 2021, et une réglementation exige que chaque événement reste interrogeable pendant 7 ans. L'entreprise migre ses requêtes d'audit centralisées vers Amazon CloudWatch et veut cesser d'envoyer de nouveaux événements à CloudTrail Lake.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Import all the events since January 2021 into CloudWatch with one import task, and then delete the event data store to stop its charges.", fr: "Importer tous les événements depuis janvier 2021 dans CloudWatch avec une seule tâche d'importation, puis supprimer l'entrepôt de données d'événements pour arrêter ses frais." } }
    - { id: b, text: { en: "Import the events from 2023 onward into CloudWatch, and delete the event data store once the import succeeds.", fr: "Importer les événements à partir de 2023 dans CloudWatch, et supprimer l'entrepôt de données d'événements une fois l'importation réussie." } }
    - { id: c, text: { en: "Keep querying all events in CloudTrail Lake, and send every new event to both CloudTrail Lake and CloudWatch from now on.", fr: "Continuer à interroger tous les événements dans CloudTrail Lake, et envoyer désormais chaque nouvel événement à la fois à CloudTrail Lake et à CloudWatch." } }
    - { id: d, text: { en: "Import the events from 2023 onward into CloudWatch, and keep querying the older events in CloudTrail Lake or in Amazon S3.", fr: "Importer les événements à partir de 2023 dans CloudWatch, et continuer à interroger les plus anciens dans CloudTrail Lake ou dans Amazon S3." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Data prior to 2023 is not migrated from CloudTrail Lake to CloudWatch. Those events must stay queryable in CloudTrail Lake or be moved to Amazon S3, while events from 2023 onward are imported into CloudWatch, which then receives the new events."
    fr: "Les données antérieures à 2023 ne sont pas migrées de CloudTrail Lake vers CloudWatch. Ces événements doivent rester interrogeables dans CloudTrail Lake ou être déplacés vers Amazon S3, tandis que les événements à partir de 2023 sont importés dans CloudWatch, qui reçoit ensuite les nouveaux événements."
  options:
    a:
      en: "The 2021 and 2022 events would not be imported, so deleting the event data store would lose them."
      fr: "Les événements de 2021 et 2022 ne seraient pas importés : supprimer l'entrepôt de données d'événements les ferait perdre."
    b:
      en: "Deleting the event data store loses the 2021 and 2022 events that must remain queryable for 7 years."
      fr: "Supprimer l'entrepôt de données d'événements fait perdre les événements de 2021 et 2022, qui doivent rester interrogeables pendant 7 ans."
    c:
      en: "The company wants to stop sending new events to CloudTrail Lake, and dual ingestion keeps paying for both services."
      fr: "L'entreprise veut cesser d'envoyer de nouveaux événements à CloudTrail Lake, et une double ingestion fait payer les deux services."
references:
  - title: CloudTrail Lake availability change
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-lake-service-availability-change.html
