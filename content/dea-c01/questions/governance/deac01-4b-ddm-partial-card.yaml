id: deac01-4b-ddm-partial-card
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores payment data in an Amazon Redshift table that has a `card_number` column. A company policy requires that members of the database role `support` see only the last four digits of each card number, while members of the `fraud` role see the full value. Both roles query the same table, and the company does not want to store additional copies of the data.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke des données de paiement dans une table Amazon Redshift qui comporte une colonne `card_number`. Une politique de l'entreprise exige que les membres du rôle de base de données `support` ne voient que les quatre derniers chiffres de chaque numéro de carte, tandis que les membres du rôle `fraud` voient la valeur complète. Les deux rôles interrogent la même table, et l'entreprise ne veut pas stocker de copies supplémentaires des données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Revoke SELECT on the card_number column from the support role by using column-level privileges on the table.", fr: "Révoquer SELECT sur la colonne card_number pour le rôle support à l'aide des privilèges au niveau des colonnes de la table." } }
    - { id: b, text: { en: "Attach a dynamic data masking policy that shows only the last four digits to the card_number column for the support role.", fr: "Attacher à la colonne card_number, pour le rôle support, une politique de masquage dynamique des données qui n'affiche que les quatre derniers chiffres." } }
    - { id: c, text: { en: "Create a row-level security policy on the table that filters the card_number values that the support role can see.", fr: "Créer sur la table une politique de sécurité au niveau des lignes qui filtre les valeurs de card_number visibles par le rôle support." } }
    - { id: d, text: { en: "Create a nightly job that writes a masked copy of the table to a new schema, and grant SELECT on the copy to the support role.", fr: "Créer une tâche nocturne qui écrit une copie masquée de la table dans un nouveau schéma, et accorder SELECT sur la copie au rôle support." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Dynamic data masking applies an obfuscation expression to a column at query time for the user or role that the policy is attached to, without transforming the stored data. A partial-redaction expression attached for the support role shows four digits to support and leaves the fraud role unaffected."
    fr: "Le masquage dynamique des données applique une expression d'obscurcissement à une colonne au moment de la requête, pour l'utilisateur ou le rôle auquel la politique est attachée, sans transformer les données stockées. Une expression de masquage partiel attachée pour le rôle support affiche quatre chiffres au support sans affecter le rôle fraud."
  options:
    a:
      en: "Revoking the column hides it completely, so support could not see the last four digits."
      fr: "Révoquer la colonne la masque complètement : le support ne pourrait pas voir les quatre derniers chiffres."
    c:
      en: "Row-level security decides which rows a user can see; it does not change the values of a column."
      fr: "La sécurité au niveau des lignes décide des lignes visibles ; elle ne modifie pas les valeurs d'une colonne."
    d:
      en: "A masked copy is an additional copy of the data, which the company does not want, and it is stale between runs."
      fr: "Une copie masquée est une copie supplémentaire des données, ce que l'entreprise refuse, et elle est obsolète entre deux exécutions."
references:
  - title: Dynamic data masking
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_ddm.html
