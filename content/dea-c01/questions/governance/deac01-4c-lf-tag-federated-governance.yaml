id: deac01-4c-lf-tag-federated-governance
objective: "4.5.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is adopting a federated data governance model with AWS Lake Formation. A central governance team must define one consistent classification vocabulary and control which consumers can access each classification. The data stewards of each domain know their own data best and must classify their tables themselves. The number of tables is expected to grow to several thousand.

    Which approach will meet these requirements with the LEAST ongoing administration?
  fr: |
    Une entreprise adopte un modèle de gouvernance des données fédérée avec AWS Lake Formation. Une équipe de gouvernance centrale doit définir un vocabulaire de classification unique et cohérent et contrôler quels consommateurs peuvent accéder à chaque classification. Les responsables des données de chaque domaine connaissent le mieux leurs propres données et doivent classer eux-mêmes leurs tables. Le nombre de tables devrait atteindre plusieurs milliers.

    Quelle approche répond à ces exigences avec le MOINS d'administration récurrente possible ?
body:
  options:
    - { id: a, text: { en: "The central team grants named-resource permissions on each new table to each consumer that needs it.", fr: "L'équipe centrale accorde des autorisations par ressource nommée sur chaque nouvelle table à chaque consommateur qui en a besoin." } }
    - { id: b, text: { en: "Each domain team defines its own LF-tags for its tables and grants them to the consumers that it chooses.", fr: "Chaque équipe de domaine définit ses propres balises LF pour ses tables et les accorde aux consommateurs de son choix." } }
    - { id: c, text: { en: "The central team writes IAM policies with S3 prefix conditions for each consumer role and each new dataset.", fr: "L'équipe centrale rédige des politiques IAM avec des conditions sur les préfixes S3 pour chaque rôle consommateur et chaque nouveau jeu de données." } }
    - { id: d, text: { en: "The central team creates the LF-tags and grants tag expressions to consumers; domain stewards assign the tags to their tables.", fr: "L'équipe centrale crée les balises LF et accorde des expressions de balises aux consommateurs ; les responsables des domaines attribuent les balises à leurs tables." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With LF-tag-based access control, administrators create the LF-tags, grant principals permission to assign tag values to resources, and grant LF-tag expressions to consumers. Tables inherit tags from their databases, and the number of grants grows with principals plus resources instead of principals times resources, which suits thousands of tables."
    fr: "Avec le contrôle d'accès basé sur les balises LF, les administrateurs créent les balises LF, autorisent des principaux à attribuer des valeurs de balises aux ressources et accordent des expressions de balises LF aux consommateurs. Les tables héritent des balises de leurs bases de données, et le nombre d'octrois croît comme la somme des principaux et des ressources au lieu de leur produit, ce qui convient à des milliers de tables."
  options:
    a:
      en: "Named-resource grants grow with the number of principals times the number of tables, and the central team would also classify data it does not know."
      fr: "Les autorisations par ressource nommée croissent comme le produit du nombre de principaux par le nombre de tables, et l'équipe centrale classerait en outre des données qu'elle ne connaît pas."
    b:
      en: "Separate tag vocabularies per domain break the consistent classification and remove central control over consumer access."
      fr: "Des vocabulaires de balises distincts par domaine rompent la cohérence de la classification et suppriment le contrôle central de l'accès des consommateurs."
    c:
      en: "Per-dataset IAM policies bypass Lake Formation governance and must be rewritten for every new dataset."
      fr: "Des politiques IAM par jeu de données contournent la gouvernance Lake Formation et doivent être réécrites pour chaque nouveau jeu de données."
references:
  - title: Lake Formation tag-based access control
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/tag-based-access-control.html
