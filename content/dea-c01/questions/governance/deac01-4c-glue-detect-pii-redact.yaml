id: deac01-4c-glue-detect-pii-redact
objective: "4.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare analytics company runs an AWS Glue ETL job that loads patient survey files into its data lake in Amazon S3. Some free-text columns occasionally contain email addresses and phone numbers. Compliance requires that these values be detected and masked during the ETL job, before the data is written to the data lake. The company wants a managed capability that requires the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'analyse de données de santé exécute une tâche ETL AWS Glue qui charge des fichiers d'enquêtes de patients dans son lac de données Amazon S3. Certaines colonnes de texte libre contiennent parfois des adresses e-mail et des numéros de téléphone. La conformité exige que ces valeurs soient détectées et masquées pendant la tâche ETL, avant l'écriture des données dans le lac de données. L'entreprise veut une fonctionnalité gérée qui demande le MOINS d'effort de développement possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an Amazon Macie sensitive data discovery job on the data lake bucket after each load, and review the findings.", fr: "Exécuter une tâche de découverte de données sensibles Amazon Macie sur le compartiment du lac de données après chaque chargement, et examiner les résultats." } }
    - { id: b, text: { en: "Add the Detect PII transform to the AWS Glue job, and configure it to redact the detected entities in each cell.", fr: "Ajouter la transformation Detect PII à la tâche AWS Glue, et la configurer pour masquer les entités détectées dans chaque cellule." } }
    - { id: c, text: { en: "Create AWS Lake Formation data filters that hide the free-text columns from the analysts who query the data lake.", fr: "Créer des filtres de données AWS Lake Formation qui masquent les colonnes de texte libre aux analystes qui interrogent le lac de données." } }
    - { id: d, text: { en: "Attach a CloudWatch Logs data protection policy to the log group of the job to mask the detected values.", fr: "Associer une politique de protection des données CloudWatch Logs au groupe de journaux de la tâche pour masquer les valeurs détectées." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The AWS Glue sensitive data detection (Detect PII) transform identifies entities such as email addresses and phone numbers in the data that the job processes, and it can redact, partially redact, or hash them. The job then writes masked data, so the PII never lands in the data lake, with no custom detection code."
    fr: "La transformation de détection des données sensibles d'AWS Glue (Detect PII) identifie des entités comme les adresses e-mail et les numéros de téléphone dans les données traitées par la tâche, et peut les masquer, les masquer partiellement ou les hacher. La tâche écrit alors des données masquées : les PII n'arrivent jamais dans le lac de données, sans code de détection personnalisé."
  options:
    a:
      en: "Macie inspects objects after they are stored in S3 and reports findings; it does not mask values during the ETL job."
      fr: "Macie inspecte les objets une fois stockés dans S3 et signale des résultats ; il ne masque pas les valeurs pendant la tâche ETL."
    c:
      en: "Data filters hide whole columns at query time, but the unmasked PII is still written to the data lake."
      fr: "Les filtres de données masquent des colonnes entières au moment des requêtes, mais les PII non masquées sont tout de même écrites dans le lac de données."
    d:
      en: "A data protection policy masks sensitive data in log events, not in the data that the job writes to S3."
      fr: "Une politique de protection des données masque les données sensibles des événements de journaux, pas des données que la tâche écrit dans S3."
references:
  - title: Detect and process sensitive data
    url: https://docs.aws.amazon.com/glue/latest/dg/detect-PII.html
