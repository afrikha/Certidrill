id: deac01-4a-redshift-managed-endpoint
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon Redshift provisioned cluster with cluster relocation turned on in a VPC of account A. A BI application in a VPC of account B must connect to the cluster with JDBC over private IP addresses. The company does not want to peer the VPCs, and the cluster must not be publicly accessible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster provisionné Amazon Redshift, avec la relocalisation du cluster activée, dans un VPC du compte A. Une application BI d'un VPC du compte B doit se connecter au cluster en JDBC par des adresses IP privées. L'entreprise ne veut pas créer de peering entre les VPC, et le cluster ne doit pas être accessible publiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Grant account B access to the cluster from account A, then create a Redshift-managed VPC endpoint in the BI application's VPC.", fr: "Accorder au compte B l'accès au cluster depuis le compte A, puis créer un point de terminaison VPC géré par Redshift dans le VPC de l'application BI." } }
    - { id: b, text: { en: "Turn on enhanced VPC routing for the cluster and create an S3 gateway endpoint in the BI application's VPC.", fr: "Activer le routage VPC amélioré du cluster et créer un point de terminaison de passerelle S3 dans le VPC de l'application BI." } }
    - { id: c, text: { en: "Create an interface VPC endpoint for the Redshift Data API in account B and point the JDBC URL to that endpoint.", fr: "Créer un point de terminaison d'interface VPC pour la Data API Redshift dans le compte B et faire pointer l'URL JDBC vers ce point de terminaison." } }
    - { id: d, text: { en: "Make the cluster publicly accessible and allow only the NAT gateway address of account B in its security group.", fr: "Rendre le cluster accessible publiquement et n'autoriser que l'adresse de la passerelle NAT du compte B dans son groupe de sécurité." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Redshift-managed VPC endpoints use AWS PrivateLink to give a client VPC a private connection to the cluster without a public IP address or VPC peering. For another account, the cluster owner first grants access to that account, then the grantee creates the endpoint; a provisioned cluster must have cluster relocation or Multi-AZ turned on.
    fr: |
      Les points de terminaison VPC gérés par Redshift utilisent AWS PrivateLink pour donner à un VPC client une connexion privée au cluster, sans adresse IP publique ni peering de VPC. Pour un autre compte, le propriétaire du cluster accorde d'abord l'accès à ce compte, puis le bénéficiaire crée le point de terminaison ; un cluster provisionné doit avoir la relocalisation du cluster ou Multi-AZ activé.
  options:
    b:
      en: |
        Enhanced VPC routing controls the path of COPY and UNLOAD traffic between the cluster and data repositories; it does not give a remote VPC access to the cluster.
      fr: |
        Le routage VPC amélioré contrôle le chemin du trafic COPY et UNLOAD entre le cluster et les référentiels de données ; il ne donne pas à un VPC distant l'accès au cluster.
    c:
      en: |
        The Data API is an HTTPS API for running statements, not a JDBC endpoint, so a JDBC driver cannot connect through it.
      fr: |
        La Data API est une API HTTPS d'exécution d'instructions, pas un point de terminaison JDBC : un pilote JDBC ne peut pas se connecter par elle.
    d:
      en: |
        The cluster must not be publicly accessible, and this path uses public IP addresses.
      fr: |
        Le cluster ne doit pas être accessible publiquement, et ce chemin utilise des adresses IP publiques.
references:
  - title: Redshift-managed VPC endpoints
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/managing-cluster-cross-vpc.html
