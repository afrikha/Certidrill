id: deac01-4a-lambda-kinesis-exec-role
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer creates an AWS Lambda function that must process records from an Amazon Kinesis data stream in the same account through an event source mapping. Creating the event source mapping fails with an error that says the function's role is not allowed to call GetRecords on the stream.

    Which solution will fix the problem?
  fr: |
    Un ingénieur des données crée une fonction AWS Lambda qui doit traiter les enregistrements d'un flux de données Amazon Kinesis du même compte au moyen d'un mappage de source d'événement. La création du mappage échoue avec une erreur qui indique que le rôle de la fonction n'est pas autorisé à appeler GetRecords sur le flux.

    Quelle solution corrige le problème ?
body:
  options:
    - { id: a, text: { en: "Attach the AWSLambdaKinesisExecutionRole managed policy to the function's execution role.", fr: "Attacher la politique gérée AWSLambdaKinesisExecutionRole au rôle d'exécution de la fonction." } }
    - { id: b, text: { en: "Add a resource-based policy to the function that allows Kinesis Data Streams to invoke it.", fr: "Ajouter à la fonction une politique basée sur les ressources qui autorise Kinesis Data Streams à l'appeler." } }
    - { id: c, text: { en: "Create an IAM user with Kinesis permissions and store its access keys in the function's environment variables.", fr: "Créer un utilisateur IAM avec des autorisations Kinesis et stocker ses clés d'accès dans les variables d'environnement de la fonction." } }
    - { id: d, text: { en: "Add the Lambda service principal to the key policy of the AWS KMS key that the account uses for Kinesis.", fr: "Ajouter le principal de service Lambda à la politique de clé de la clé AWS KMS que le compte utilise pour Kinesis." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For a Kinesis event source mapping, Lambda reads the stream on the function's behalf with the execution role. The role needs permissions such as kinesis:DescribeStream, DescribeStreamSummary, GetRecords, GetShardIterator, ListShards, and SubscribeToShard, which the AWSLambdaKinesisExecutionRole managed policy includes.
    fr: |
      Pour un mappage de source d'événement Kinesis, Lambda lit le flux pour le compte de la fonction avec le rôle d'exécution. Le rôle a besoin d'autorisations comme kinesis:DescribeStream, DescribeStreamSummary, GetRecords, GetShardIterator, ListShards et SubscribeToShard, que comprend la politique gérée AWSLambdaKinesisExecutionRole.
  options:
    b:
      en: |
        Kinesis does not push records to the function; Lambda polls the stream, so a resource-based policy on the function does not grant the missing read permissions.
      fr: |
        Kinesis ne pousse pas les enregistrements vers la fonction : Lambda interroge le flux, donc une politique basée sur les ressources sur la fonction n'accorde pas les autorisations de lecture manquantes.
    c:
      en: |
        The event source mapping uses the execution role, not keys in environment variables, and long-term access keys are a security risk.
      fr: |
        Le mappage de source d'événement utilise le rôle d'exécution, pas des clés dans les variables d'environnement, et les clés d'accès à long terme sont un risque de sécurité.
    d:
      en: |
        The error is about the Kinesis GetRecords permission of the role, not about decryption with a KMS key.
      fr: |
        L'erreur concerne l'autorisation Kinesis GetRecords du rôle, pas le déchiffrement avec une clé KMS.
references:
  - title: Process Amazon Kinesis Data Streams records with Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-create.html
