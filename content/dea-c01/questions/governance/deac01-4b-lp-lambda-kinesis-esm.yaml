id: deac01-4b-lp-lambda-kinesis-esm
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's account contains 25 Amazon Kinesis data streams. A new AWS Lambda function must process records from the `orders` stream only, through an event source mapping. Another policy already grants the function's execution role its Amazon CloudWatch Logs permissions. The security team requires least privilege for the stream permissions.

    Which policy should the data engineer attach to the execution role?
  fr: |
    Le compte d'AnyCompany contient 25 flux de données Amazon Kinesis. Une nouvelle fonction AWS Lambda doit traiter les enregistrements du seul flux `orders`, via un mappage de source d'événements. Une autre politique accorde déjà au rôle d'exécution de la fonction ses autorisations Amazon CloudWatch Logs. L'équipe de sécurité exige le moindre privilège pour les autorisations sur le flux.

    Quelle politique l'ingénieur des données doit-il attacher au rôle d'exécution ?
body:
  options:
    - { id: a, text: { en: "Allow DescribeStream, DescribeStreamSummary, GetRecords, GetShardIterator, ListShards, and SubscribeToShard on the orders stream ARN.", fr: "Autoriser DescribeStream, DescribeStreamSummary, GetRecords, GetShardIterator, ListShards et SubscribeToShard sur l'ARN du flux orders." } }
    - { id: b, text: { en: "Attach the AWSLambdaKinesisExecutionRole AWS managed policy, which includes the Kinesis read actions that event source mappings use.", fr: "Attacher la politique gérée par AWS AWSLambdaKinesisExecutionRole, qui inclut les actions de lecture Kinesis qu'utilisent les mappages de source d'événements." } }
    - { id: c, text: { en: "Allow kinesis:GetRecords and kinesis:GetShardIterator on the orders stream ARN, and no other Kinesis action.", fr: "Autoriser kinesis:GetRecords et kinesis:GetShardIterator sur l'ARN du flux orders, et aucune autre action Kinesis." } }
    - { id: d, text: { en: "Allow kinesis:* on the orders stream ARN so that the event source mapping never lacks a Kinesis action.", fr: "Autoriser kinesis:* sur l'ARN du flux orders afin que le mappage de source d'événements ne manque jamais d'une action Kinesis." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Lambda needs kinesis:DescribeStream, DescribeStreamSummary, GetRecords, GetShardIterator, ListShards, and SubscribeToShard to manage a Kinesis event source mapping. Scoping these actions to the orders stream ARN gives the function exactly what the mapping needs on the one stream it reads."
    fr: "Lambda a besoin de kinesis:DescribeStream, DescribeStreamSummary, GetRecords, GetShardIterator, ListShards et SubscribeToShard pour gérer un mappage de source d'événements Kinesis. Limiter ces actions à l'ARN du flux orders donne à la fonction exactement ce dont le mappage a besoin sur le seul flux qu'elle lit."
  options:
    b:
      en: "The managed policy grants these actions, plus ListStreams and log actions, on Resource *, so the role could read all 25 streams."
      fr: "La politique gérée accorde ces actions, ainsi que ListStreams et des actions de journalisation, sur Resource * : le rôle pourrait lire les 25 flux."
    c:
      en: "GetRecords and GetShardIterator are not enough: the mapping must also describe the stream and list its shards."
      fr: "GetRecords et GetShardIterator ne suffisent pas : le mappage doit aussi décrire le flux et lister ses partitions (shards)."
    d:
      en: "kinesis:* includes write and management actions such as PutRecord and DeleteStream that the function does not need."
      fr: "kinesis:* inclut des actions d'écriture et de gestion comme PutRecord et DeleteStream dont la fonction n'a pas besoin."
references:
  - title: Process Amazon Kinesis Data Streams records with Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-create.html
  - title: AWSLambdaKinesisExecutionRole
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaKinesisExecutionRole.html
