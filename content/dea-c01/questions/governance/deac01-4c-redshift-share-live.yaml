id: deac01-4c-redshift-share-live
objective: "4.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company's central data team loads sales data into an Amazon Redshift provisioned cluster. The marketing team, in the same AWS account, has its own Amazon Redshift Serverless workgroup. Marketing analysts must query the sales tables from their workgroup and see changes as soon as they are committed on the cluster. The data must not be copied.

    Which solution will meet these requirements?
  fr: |
    L'équipe de données centrale d'une entreprise de vente au détail charge les données de ventes dans un cluster provisionné Amazon Redshift. L'équipe marketing, dans le même compte AWS, dispose de son propre groupe de travail Amazon Redshift Serverless. Les analystes marketing doivent interroger les tables de ventes depuis leur groupe de travail et voir les modifications dès qu'elles sont validées sur le cluster. Les données ne doivent pas être copiées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a datashare with the sales tables on the cluster, and grant usage on it to the marketing workgroup's namespace.", fr: "Créer sur le cluster une unité de partage des données (datashare) contenant les tables de ventes, et en accorder l'utilisation à l'espace de noms du groupe de travail marketing." } }
    - { id: b, text: { en: "Unload the sales tables to Amazon S3 every hour, and query the files from the marketing workgroup with Amazon Redshift Spectrum.", fr: "Décharger les tables de ventes dans Amazon S3 toutes les heures, et interroger les fichiers depuis le groupe de travail marketing avec Amazon Redshift Spectrum." } }
    - { id: c, text: { en: "Restore the latest snapshot of the provisioned cluster into the marketing workgroup every night.", fr: "Restaurer chaque nuit le dernier instantané du cluster provisionné dans le groupe de travail marketing." } }
    - { id: d, text: { en: "Create a federated query external schema in the marketing workgroup that points to the provisioned cluster.", fr: "Créer dans le groupe de travail marketing un schéma externe de requête fédérée qui pointe vers le cluster provisionné." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Redshift data sharing gives live access to data across provisioned clusters and serverless workgroups without moving or copying it, and committed changes are visible to new consumer transactions immediately. Within one account, the producer grants usage on the datashare to the consumer namespace, and the consumer creates a database from it."
    fr: "Le partage de données Redshift donne un accès en direct aux données entre clusters provisionnés et groupes de travail sans serveur, sans les déplacer ni les copier, et les modifications validées sont immédiatement visibles par les nouvelles transactions du consommateur. Dans un même compte, le producteur accorde l'utilisation de l'unité de partage des données à l'espace de noms consommateur, qui crée une base de données à partir de celle-ci."
  options:
    b:
      en: "Unloading copies the data to S3, and the files are up to an hour old."
      fr: "Le déchargement copie les données dans S3, et les fichiers ont jusqu'à une heure de retard."
    c:
      en: "A snapshot restore creates a copy that is up to a day old."
      fr: "La restauration d'un instantané crée une copie qui a jusqu'à un jour de retard."
    d:
      en: "Redshift federated queries reach Amazon RDS and Aurora PostgreSQL and MySQL databases, not another Redshift data warehouse."
      fr: "Les requêtes fédérées Redshift accèdent aux bases de données Amazon RDS et Aurora PostgreSQL et MySQL, pas à un autre entrepôt de données Redshift."
references:
  - title: Data sharing in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/datashare-overview.html
  - title: Querying data with federated queries in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/federated-overview.html
