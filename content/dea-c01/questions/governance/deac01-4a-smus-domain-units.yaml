id: deac01-4a-smus-domain-units
objective: "4.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses one Amazon SageMaker Unified Studio domain for the whole enterprise, with a single catalog of published assets. The retail, finance, and logistics business units each want to organize their own projects and assets. The lead of each business unit must manage authorization for that business unit without becoming a domain administrator.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un seul domaine Amazon SageMaker Unified Studio pour toute l'organisation, avec un catalogue unique de ressources publiées. Les unités commerciales distribution, finance et logistique veulent chacune organiser leurs propres projets et ressources. Le responsable de chaque unité commerciale doit gérer les autorisations de son unité sans devenir administrateur du domaine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a separate SageMaker Unified Studio domain for each business unit and make each lead its administrator.", fr: "Créer un domaine SageMaker Unified Studio distinct pour chaque unité commerciale et faire de chaque responsable son administrateur." } }
    - { id: b, text: { en: "Create one project for each business unit and add each lead to that project as a contributor.", fr: "Créer un projet par unité commerciale et ajouter chaque responsable à ce projet comme contributeur." } }
    - { id: c, text: { en: "Create one project profile for each business unit and allow only its lead to use the profile.", fr: "Créer un profil de projet par unité commerciale et autoriser uniquement son responsable à utiliser le profil." } }
    - { id: d, text: { en: "Create a domain unit for each business unit in the domain and add each lead as an owner of that domain unit.", fr: "Créer une unité de domaine par unité commerciale dans le domaine et ajouter chaque responsable comme propriétaire de cette unité de domaine." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Domain units organize assets and other domain entities under business units and teams inside one domain. They delegate authority to domain unit owners, who set up authorization policies, such as who can create projects, for their unit without being domain administrators.
    fr: |
      Les unités de domaine organisent les ressources et les autres entités du domaine par unité commerciale et par équipe au sein d'un seul domaine. Elles délèguent l'autorité aux propriétaires d'unité de domaine, qui définissent les politiques d'autorisation de leur unité, comme qui peut créer des projets, sans être administrateurs du domaine.
  options:
    a:
      en: |
        The catalog is scoped to a domain, so separate domains would split the single catalog that the company wants to keep.
      fr: |
        Le catalogue a pour étendue un domaine : des domaines distincts fragmenteraient le catalogue unique que l'entreprise veut conserver.
    b:
      en: |
        A project is a container for a team's work, not a business unit with its own policies, and a contributor cannot even manage project members.
      fr: |
        Un projet est un conteneur pour le travail d'une équipe, pas une unité commerciale dotée de ses propres politiques, et un contributeur ne peut même pas gérer les membres du projet.
    c:
      en: |
        A project profile is a template of blueprints for new projects; it does not organize assets or delegate authorization.
      fr: |
        Un profil de projet est un modèle de plans (blueprints) pour de nouveaux projets ; il n'organise pas les ressources et ne délègue pas les autorisations.
references:
  - title: Amazon SageMaker Unified Studio terminology and concepts
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/concepts.html
  - title: Domain units and authorization policies in Amazon SageMaker Unified Studio
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/domain-units.html
