id: deac01-4c-config-eventbridge-change
objective: "4.5.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany wants its data platform team to receive an email within minutes whenever the configuration of any Amazon Redshift cluster in its account changes, for example when encryption or public accessibility is modified. AWS Config is enabled, but its recorder currently records only Amazon EC2 resource types. The solution must not require custom code.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany veut que son équipe de plateforme de données reçoive un e-mail en quelques minutes chaque fois que la configuration d'un cluster Amazon Redshift de son compte change, par exemple lorsque le chiffrement ou l'accessibilité publique est modifié. AWS Config est activé, mais son enregistreur n'enregistre actuellement que les types de ressources Amazon EC2. La solution ne doit pas nécessiter de code personnalisé.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Update the AWS Config configuration recorder so that it also records the AWS::Redshift::Cluster resource type.", fr: "Mettre à jour l'enregistreur de configuration AWS Config afin qu'il enregistre aussi le type de ressource AWS::Redshift::Cluster." } }
    - { id: b, text: { en: "Create an AWS Config managed rule that checks whether the Redshift clusters are encrypted, and notify an SNS email topic of its results.", fr: "Créer une règle gérée AWS Config qui vérifie si les clusters Redshift sont chiffrés, et notifier ses résultats à une rubrique SNS par e-mail." } }
    - { id: c, text: { en: "Create a CloudWatch Logs metric filter on the Redshift audit logs that matches cluster configuration changes.", fr: "Créer un filtre de métriques CloudWatch Logs sur les journaux d'audit Redshift qui détecte les modifications de configuration du cluster." } }
    - { id: d, text: { en: "Turn on Redshift audit logging to Amazon S3, and configure S3 Event Notifications to an Amazon SNS topic.", fr: "Activer la journalisation d'audit Redshift vers Amazon S3, et configurer des notifications d'événements S3 vers une rubrique Amazon SNS." } }
    - { id: e, text: { en: "Create an EventBridge rule that matches Config Configuration Item Change events for Redshift clusters and notifies an SNS email topic.", fr: "Créer une règle EventBridge qui détecte les événements Config Configuration Item Change des clusters Redshift et notifie une rubrique SNS par e-mail." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "AWS Config sends a near real-time stream of events to Amazon EventBridge, including Config Configuration Item Change events when a recorded resource changes, and a rule can filter them by resource type and target an SNS topic. These events exist only for resource types that the recorder records, so Redshift clusters must be added to the recorder."
    fr: "AWS Config envoie à Amazon EventBridge un flux d'événements en temps quasi réel, notamment des événements Config Configuration Item Change lorsqu'une ressource enregistrée change, et une règle peut les filtrer par type de ressource et cibler une rubrique SNS. Ces événements n'existent que pour les types de ressources enregistrés par l'enregistreur : il faut donc ajouter les clusters Redshift à l'enregistreur."
  options:
    b:
      en: "A rule evaluates compliance with one check; it does not notify about every configuration change, and it needs the resource type to be recorded anyway."
      fr: "Une règle évalue la conformité à un seul contrôle ; elle ne signale pas chaque modification de configuration et exige de toute façon que le type de ressource soit enregistré."
    c:
      en: "Redshift audit logs record connections, user changes, and queries in the database, not changes to the cluster configuration."
      fr: "Les journaux d'audit Redshift enregistrent les connexions, les modifications d'utilisateurs et les requêtes dans la base de données, pas les modifications de la configuration du cluster."
    d:
      en: "Audit log files describe database activity, not cluster configuration changes, so their arrival in S3 says nothing about such changes."
      fr: "Les fichiers journaux d'audit décrivent l'activité de la base de données, pas les modifications de configuration du cluster : leur arrivée dans S3 n'indique rien sur ces modifications."
references:
  - title: Monitoring AWS Config with Amazon EventBridge
    url: https://docs.aws.amazon.com/config/latest/developerguide/monitor-config-with-cloudwatchevents.html
