id: deac01-4c-athena-cloudtrail-projection
objective: "4.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany delivers the AWS CloudTrail logs of one account and Region to an Amazon S3 bucket. The security team must run ad hoc SQL queries on the last 2 years of logs to investigate API activity. New log files arrive every few minutes, and the team does not want to maintain partitions or run any infrastructure. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany livre les journaux AWS CloudTrail d'un compte et d'une Région dans un compartiment Amazon S3. L'équipe de sécurité doit exécuter des requêtes SQL ad hoc sur les 2 dernières années de journaux pour enquêter sur l'activité des API. De nouveaux fichiers journaux arrivent toutes les quelques minutes, et l'équipe ne veut ni gérer de partitions ni exploiter d'infrastructure. La solution doit avoir le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Load the log files into an Amazon Redshift provisioned cluster every night with the COPY command, and query them with SQL.", fr: "Charger chaque nuit les fichiers journaux dans un cluster provisionné Amazon Redshift avec la commande COPY, et les interroger en SQL." } }
    - { id: b, text: { en: "Create an Amazon Athena table over the CloudTrail prefix that uses partition projection on the date, and query the logs with SQL.", fr: "Créer sur le préfixe CloudTrail une table Amazon Athena qui utilise la projection de partitions sur la date, et interroger les journaux en SQL." } }
    - { id: c, text: { en: "Create an Amazon Athena table partitioned by date, and schedule an AWS Lambda function that runs ALTER TABLE ADD PARTITION every day.", fr: "Créer une table Amazon Athena partitionnée par date, et planifier une fonction AWS Lambda qui exécute ALTER TABLE ADD PARTITION chaque jour." } }
    - { id: d, text: { en: "Stream the log files into an Amazon OpenSearch Service domain, and query them with SQL in OpenSearch Dashboards.", fr: "Diffuser les fichiers journaux dans un domaine Amazon OpenSearch Service, et les interroger en SQL dans OpenSearch Dashboards." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Athena queries the CloudTrail files in place with serverless SQL. With partition projection, Athena computes the date partitions from table properties (type date, range up to NOW, storage location template), so new days are queryable without ALTER TABLE ADD PARTITION, crawlers or metastore lookups."
    fr: "Athena interroge les fichiers CloudTrail sur place en SQL sans serveur. Avec la projection de partitions, Athena calcule les partitions de date à partir des propriétés de la table (type date, plage jusqu'à NOW, modèle d'emplacement de stockage) : les nouveaux jours sont interrogeables sans ALTER TABLE ADD PARTITION, sans robot d'analyse et sans recherche dans le métastore."
  options:
    a:
      en: "A provisioned Redshift cluster and a nightly load job are infrastructure to run and pay for, which the team wants to avoid."
      fr: "Un cluster Redshift provisionné et une tâche de chargement nocturne sont une infrastructure à exploiter et à payer, ce que l'équipe veut éviter."
    c:
      en: "The scheduled function is extra code to maintain, and partitions are queryable only after it runs; partition projection removes this work."
      fr: "La fonction planifiée est du code supplémentaire à maintenir, et les partitions ne sont interrogeables qu'après son exécution ; la projection de partitions supprime ce travail."
    d:
      en: "An OpenSearch Service domain and an ingestion pipeline must be sized and operated, which adds overhead for occasional SQL investigations."
      fr: "Un domaine OpenSearch Service et un pipeline d'ingestion doivent être dimensionnés et exploités, ce qui ajoute une charge pour des enquêtes SQL occasionnelles."
references:
  - title: Create the table for CloudTrail logs in Athena using partition projection
    url: https://docs.aws.amazon.com/athena/latest/ug/create-cloudtrail-table-partition-projection.html
