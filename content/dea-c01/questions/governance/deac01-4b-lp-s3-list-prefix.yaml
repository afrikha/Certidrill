id: deac01-4b-lp-s3-list-prefix
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany gives a partner role access to its files under `s3://example-exchange/partner-a/`. The role has the following policy. The partner can download objects, but every attempt to list the objects in its prefix fails with an access denied error.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:ListBucket"],
          "Resource": "arn:aws:s3:::example-exchange/partner-a/*"
        }
      ]
    }
    ```

    The partner must be able to list and read only the objects under `partner-a/`. Which change will meet these requirements with the LEAST privilege?
  fr: |
    AnyCompany donne à un rôle de partenaire l'accès à ses fichiers situés sous `s3://example-exchange/partner-a/`. Le rôle a la politique suivante. Le partenaire peut télécharger les objets, mais toute tentative de lister les objets de son préfixe échoue avec une erreur d'accès refusé.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:ListBucket"],
          "Resource": "arn:aws:s3:::example-exchange/partner-a/*"
        }
      ]
    }
    ```

    Le partenaire doit pouvoir lister et lire uniquement les objets situés sous `partner-a/`. Quelle modification répond à ces exigences avec le MOINDRE privilège ?
body:
  options:
    - { id: a, text: { en: "Add a statement that allows s3:ListBucket on arn:aws:s3:::example-exchange without any condition on the requested prefix.", fr: "Ajouter une instruction qui autorise s3:ListBucket sur arn:aws:s3:::example-exchange sans aucune condition sur le préfixe demandé." } }
    - { id: b, text: { en: "Add a statement that allows s3:ListAllMyBuckets and s3:GetBucketLocation on all resources.", fr: "Ajouter une instruction qui autorise s3:ListAllMyBuckets et s3:GetBucketLocation sur toutes les ressources." } }
    - { id: c, text: { en: "Move s3:ListBucket to a statement on the bucket ARN with a StringLike condition on s3:prefix of partner-a/*.", fr: "Déplacer s3:ListBucket dans une instruction sur l'ARN du compartiment avec une condition StringLike sur s3:prefix de partner-a/*." } }
    - { id: d, text: { en: "Replace s3:ListBucket with s3:ListObjectsV2 on the arn:aws:s3:::example-exchange/partner-a/* resource.", fr: "Remplacer s3:ListBucket par s3:ListObjectsV2 sur la ressource arn:aws:s3:::example-exchange/partner-a/*." } }
answer: { optionId: c }
explanation:
  correct:
    en: "s3:ListBucket is a bucket-level action, so it never matches an object ARN such as example-exchange/partner-a/*. Granting it on the bucket ARN with an s3:prefix condition lets the partner list only keys under partner-a/, while s3:GetObject stays on the object ARN."
    fr: "s3:ListBucket est une action de niveau compartiment : elle ne correspond jamais à un ARN d'objet comme example-exchange/partner-a/*. L'accorder sur l'ARN du compartiment avec une condition s3:prefix permet au partenaire de lister uniquement les clés sous partner-a/, tandis que s3:GetObject reste sur l'ARN d'objet."
  options:
    a:
      en: "Without the s3:prefix condition, the partner could list the keys of every other partner in the bucket."
      fr: "Sans la condition s3:prefix, le partenaire pourrait lister les clés de tous les autres partenaires du compartiment."
    b:
      en: "s3:ListAllMyBuckets and s3:GetBucketLocation concern buckets; neither authorizes listing the objects inside a bucket."
      fr: "s3:ListAllMyBuckets et s3:GetBucketLocation portent sur les compartiments ; aucune n'autorise à lister les objets d'un compartiment."
    d:
      en: "ListObjectsV2 is an API operation authorized by the s3:ListBucket action; it is not an IAM action that can be granted."
      fr: "ListObjectsV2 est une opération d'API autorisée par l'action s3:ListBucket ; ce n'est pas une action IAM que l'on peut accorder."
references:
  - title: "Amazon S3: Allows IAM users access to their S3 home directory, programmatically and in the console"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_examples_s3_home-directory-console.html
