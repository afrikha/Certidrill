id: deac01-4c-smus-approve-row-filter
objective: "4.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Amazon SageMaker Catalog, the EMEA sales project has requested a subscription to the customer_orders asset, an AWS Glue table published by the data platform project. The EMEA team may see only the rows where region is EMEA and must not see the customer_email column. The data platform team does not want to maintain copies of the table.

    What should a member of the data platform project do?
  fr: |
    Dans Amazon SageMaker Catalog, le projet de ventes EMEA a demandé un abonnement à la ressource customer_orders, une table AWS Glue publiée par le projet de plateforme de données. L'équipe EMEA ne peut voir que les lignes dont la région est EMEA et ne doit pas voir la colonne customer_email. L'équipe de plateforme de données ne veut pas maintenir de copies de la table.

    Que doit faire un membre du projet de plateforme de données ?
body:
  options:
    - { id: a, text: { en: "Approve the request with full access, and ask the EMEA team to filter the rows and columns in its queries.", fr: "Approuver la demande avec un accès complet, et demander à l'équipe EMEA de filtrer les lignes et les colonnes dans ses requêtes." } }
    - { id: b, text: { en: "Reject the request, build an EMEA-only table with an AWS Glue job, and publish that table as a new asset.", fr: "Rejeter la demande, créer une table limitée à EMEA avec une tâche AWS Glue, et publier cette table comme nouvelle ressource." } }
    - { id: c, text: { en: "Republish the asset with subscription approval turned off so that the EMEA project gets access automatically.", fr: "Republier la ressource avec l'approbation des abonnements désactivée afin que le projet EMEA obtienne l'accès automatiquement." } }
    - { id: d, text: { en: "Approve the request with filtered access, using asset filters that keep only EMEA rows and remove customer_email.", fr: "Approuver la demande avec un accès filtré, à l'aide de filtres de ressource qui ne conservent que les lignes EMEA et retirent customer_email." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A member of the owning project can approve a subscription request with full access or with filtered access. With filtered access, the approver selects or creates row and column filters for the asset, which is supported for AWS Glue tables and Amazon Redshift tables and views, so the subscriber sees only the allowed rows and columns of the original table."
    fr: "Un membre du projet propriétaire peut approuver une demande d'abonnement avec un accès complet ou avec un accès filtré. Avec un accès filtré, l'approbateur sélectionne ou crée des filtres de lignes et de colonnes pour la ressource, ce qui est pris en charge pour les tables AWS Glue et les tables et vues Amazon Redshift : l'abonné ne voit que les lignes et les colonnes autorisées de la table d'origine."
  options:
    a:
      en: "Full access exposes all rows and the customer_email column; relying on the subscriber's queries does not enforce the restriction."
      fr: "Un accès complet expose toutes les lignes et la colonne customer_email ; compter sur les requêtes de l'abonné n'applique pas la restriction."
    b:
      en: "A separate EMEA table is a copy that the data platform team would have to maintain."
      fr: "Une table EMEA distincte est une copie que l'équipe de plateforme de données devrait maintenir."
    c:
      en: "Automatic approval grants full access to every row and column, and to every other project that subscribes."
      fr: "L'approbation automatique accorde un accès complet à toutes les lignes et colonnes, ainsi qu'à tout autre projet qui s'abonne."
references:
  - title: Approve or reject a subscription request in Amazon SageMaker Unified Studio
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/approve-reject-subscription-request.html
