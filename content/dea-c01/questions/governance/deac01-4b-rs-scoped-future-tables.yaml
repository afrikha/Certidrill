id: deac01-4b-rs-scoped-future-tables
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany loads data into the `curated` schema of an Amazon Redshift database. Each pipeline runs as its own database user, and the team adds new pipeline users every month. Members of the database role `analyst` must be able to query every table in the `curated` schema, including tables that new pipeline users create later. The company wants the LEAST ongoing administration.

    Which solution will meet these requirements?
  fr: |
    AnyCompany charge des données dans le schéma `curated` d'une base de données Amazon Redshift. Chaque pipeline s'exécute sous son propre utilisateur de base de données, et l'équipe ajoute de nouveaux utilisateurs de pipeline chaque mois. Les membres du rôle de base de données `analyst` doivent pouvoir interroger toutes les tables du schéma `curated`, y compris les tables que de nouveaux utilisateurs de pipeline créeront plus tard. L'entreprise veut le MOINS d'administration récurrente possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "As a superuser, run GRANT SELECT ON ALL TABLES IN SCHEMA curated TO ROLE analyst after each pipeline run.", fr: "En tant que superutilisateur, exécuter GRANT SELECT ON ALL TABLES IN SCHEMA curated TO ROLE analyst après chaque exécution de pipeline." } }
    - { id: b, text: { en: "As a superuser, run ALTER DEFAULT PRIVILEGES IN SCHEMA curated GRANT SELECT ON TABLES TO ROLE analyst once.", fr: "En tant que superutilisateur, exécuter une fois ALTER DEFAULT PRIVILEGES IN SCHEMA curated GRANT SELECT ON TABLES TO ROLE analyst." } }
    - { id: c, text: { en: "As a superuser, run GRANT USAGE ON SCHEMA curated TO ROLE analyst once.", fr: "En tant que superutilisateur, exécuter une fois GRANT USAGE ON SCHEMA curated TO ROLE analyst." } }
    - { id: d, text: { en: "As a superuser, run GRANT SELECT FOR TABLES IN SCHEMA curated TO ROLE analyst once.", fr: "En tant que superutilisateur, exécuter une fois GRANT SELECT FOR TABLES IN SCHEMA curated TO ROLE analyst." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A scoped permission (GRANT ... FOR TABLES IN SCHEMA) gives the role the privilege on all current and future tables of the schema, whoever creates them. One statement covers the tables of pipeline users that do not exist yet."
    fr: "Une autorisation étendue (GRANT ... FOR TABLES IN SCHEMA) donne au rôle le privilège sur toutes les tables actuelles et futures du schéma, quel que soit leur créateur. Une seule instruction couvre les tables des utilisateurs de pipeline qui n'existent pas encore."
  options:
    a:
      en: "ON ALL TABLES IN SCHEMA applies to the tables that exist when the statement runs, so it must be repeated after every pipeline run."
      fr: "ON ALL TABLES IN SCHEMA s'applique aux tables qui existent au moment de l'instruction : il faudrait la répéter après chaque exécution de pipeline."
    b:
      en: "Default privileges apply only to objects created by the user named in FOR USER, or by the user who runs the statement; each new pipeline user would need another statement."
      fr: "Les privilèges par défaut ne s'appliquent qu'aux objets créés par l'utilisateur indiqué dans FOR USER, ou par celui qui exécute l'instruction : chaque nouvel utilisateur de pipeline exigerait une autre instruction."
    c:
      en: "USAGE on a local schema makes its objects reachable, but SELECT on the tables must still be granted separately."
      fr: "USAGE sur un schéma local rend ses objets accessibles, mais SELECT sur les tables doit toujours être accordé séparément."
references:
  - title: Scoped permissions
    url: https://docs.aws.amazon.com/redshift/latest/dg/t_scoped-permissions.html
  - title: ALTER DEFAULT PRIVILEGES
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_ALTER_DEFAULT_PRIVILEGES.html
