id: deac01-4b-ddm-priority-public
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security administrator at AnyCompany attached two dynamic data masking policies to the `ssn` column of an Amazon Redshift table:

    ```sql
    ATTACH MASKING POLICY mask_ssn_full ON hr.employees (ssn) TO PUBLIC PRIORITY 20;
    ATTACH MASKING POLICY ssn_clear ON hr.employees (ssn) TO ROLE payroll PRIORITY 10;
    ```

    Members of the `payroll` role must see the real values, and every other user must see masked values. Payroll users report that they still see masked values.

    Which solution will meet these requirements?
  fr: |
    Un administrateur de la sécurité d'AnyCompany a attaché deux politiques de masquage dynamique des données à la colonne `ssn` d'une table Amazon Redshift :

    ```sql
    ATTACH MASKING POLICY mask_ssn_full ON hr.employees (ssn) TO PUBLIC PRIORITY 20;
    ATTACH MASKING POLICY ssn_clear ON hr.employees (ssn) TO ROLE payroll PRIORITY 10;
    ```

    Les membres du rôle `payroll` doivent voir les valeurs réelles, et tous les autres utilisateurs doivent voir des valeurs masquées. Les utilisateurs de la paie signalent qu'ils voient toujours des valeurs masquées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Detach mask_ssn_full from PUBLIC so that only the ssn_clear policy applies to the column.", fr: "Détacher mask_ssn_full de PUBLIC afin que seule la politique ssn_clear s'applique à la colonne." } }
    - { id: b, text: { en: "Grant SELECT (ssn) ON hr.employees to the payroll role by using a column-level privilege.", fr: "Accorder SELECT (ssn) ON hr.employees au rôle payroll à l'aide d'un privilège au niveau des colonnes." } }
    - { id: c, text: { en: "Grant the sys:secadmin role to the payroll role so that its members bypass masking policies.", fr: "Accorder le rôle sys:secadmin au rôle payroll afin que ses membres contournent les politiques de masquage." } }
    - { id: d, text: { en: "Detach ssn_clear from the payroll role and attach it again with PRIORITY 30.", fr: "Détacher ssn_clear du rôle payroll et l'attacher de nouveau avec PRIORITY 30." } }
answer: { optionId: d }
explanation:
  correct:
    en: "When several masking policies apply to a user's query, the policy with the highest priority applies. A role-specific policy must have a higher priority than the PUBLIC policy on the same column; otherwise the PUBLIC policy takes effect, as it does here with 20 over 10."
    fr: "Lorsque plusieurs politiques de masquage s'appliquent à la requête d'un utilisateur, la politique de priorité la plus élevée s'applique. Une politique propre à un rôle doit avoir une priorité supérieure à celle de la politique PUBLIC sur la même colonne ; sinon la politique PUBLIC l'emporte, comme ici avec 20 contre 10."
  options:
    a:
      en: "Without the PUBLIC policy, users outside payroll would see the real values."
      fr: "Sans la politique PUBLIC, les utilisateurs hors paie verraient les valeurs réelles."
    b:
      en: "Payroll users can already select the column; masking is applied to the results regardless of column privileges."
      fr: "Les utilisateurs de la paie peuvent déjà sélectionner la colonne ; le masquage s'applique aux résultats quels que soient les privilèges de colonne."
    c:
      en: "sys:secadmin manages users, roles, and masking policies; it is far beyond the need, and the priority conflict would remain for queries."
      fr: "sys:secadmin gère les utilisateurs, les rôles et les politiques de masquage ; c'est bien au-delà du besoin, et le conflit de priorité subsisterait pour les requêtes."
references:
  - title: ATTACH MASKING POLICY
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_ATTACH_MASKING_POLICY.html
