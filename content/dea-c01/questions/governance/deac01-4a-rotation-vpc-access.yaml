id: deac01-4a-rotation-vpc-access
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company turned on rotation for an AWS Secrets Manager secret that holds credentials for an Amazon Aurora PostgreSQL DB cluster used by AWS Glue jobs. The rotation Lambda function runs in the private subnets of the cluster's VPC, which have no NAT gateway and no internet gateway. The function's security group allows all outbound traffic. The cluster's security group allows inbound PostgreSQL traffic only from the security group of the Glue connection. Rotation fails because the function cannot reach Secrets Manager and cannot connect to the database.

    Which combination of actions will fix the rotation? (Choose two.)
  fr: |
    Une entreprise a activé la rotation d'un secret AWS Secrets Manager qui contient les informations d'identification d'un cluster de bases de données Amazon Aurora PostgreSQL utilisé par des tâches AWS Glue. La fonction Lambda de rotation s'exécute dans les sous-réseaux privés du VPC du cluster, qui n'ont ni passerelle NAT ni passerelle Internet. Le groupe de sécurité de la fonction autorise tout le trafic sortant. Le groupe de sécurité du cluster n'autorise le trafic PostgreSQL entrant que depuis le groupe de sécurité de la connexion Glue. La rotation échoue parce que la fonction ne peut ni joindre Secrets Manager ni se connecter à la base de données.

    Quelle combinaison d'actions corrige la rotation ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an interface VPC endpoint for Secrets Manager in the function's subnets.", fr: "Créer un point de terminaison d'interface VPC pour Secrets Manager dans les sous-réseaux de la fonction." } }
    - { id: b, text: { en: "Create a gateway VPC endpoint for Secrets Manager in the cluster's VPC.", fr: "Créer un point de terminaison de passerelle VPC pour Secrets Manager dans le VPC du cluster." } }
    - { id: c, text: { en: "Make the Aurora DB cluster publicly accessible so that the function can reach it.", fr: "Rendre le cluster de bases de données Aurora accessible publiquement pour que la fonction puisse le joindre." } }
    - { id: d, text: { en: "Change the rotation strategy of the secret from single user to alternating users.", fr: "Faire passer la stratégie de rotation du secret d'utilisateur unique à utilisateurs alternés." } }
    - { id: e, text: { en: "Add an inbound PostgreSQL rule to the cluster's security group from the function's security group.", fr: "Ajouter au groupe de sécurité du cluster une règle PostgreSQL entrante depuis le groupe de sécurité de la fonction." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      A rotation function in a VPC without internet access reaches Secrets Manager through a Secrets Manager interface endpoint, which receives the requests addressed to the public Regional endpoint. The database's security group must also allow inbound connections from the function's security group, because the function changes the password in the database.
    fr: |
      Une fonction de rotation dans un VPC sans accès à Internet joint Secrets Manager par un point de terminaison d'interface Secrets Manager, qui reçoit les requêtes adressées au point de terminaison régional public. Le groupe de sécurité de la base de données doit aussi autoriser les connexions entrantes depuis le groupe de sécurité de la fonction, car la fonction change le mot de passe dans la base.
  options:
    b:
      en: |
        Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; Secrets Manager uses interface endpoints.
      fr: |
        Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB ; Secrets Manager utilise des points de terminaison d'interface.
    c:
      en: |
        The function connects from inside the VPC, so public access does not help, and the security group still refuses it while the database becomes exposed.
      fr: |
        La fonction se connecte depuis le VPC : l'accès public n'aide pas, le groupe de sécurité la refuse toujours, et la base de données se retrouve exposée.
    d:
      en: |
        The strategy changes how credentials are rotated, not the network paths, so the function still reaches neither Secrets Manager nor the database.
      fr: |
        La stratégie change la façon dont les informations d'identification tournent, pas les chemins réseau : la fonction ne joint toujours ni Secrets Manager ni la base.
references:
  - title: Troubleshoot AWS Secrets Manager rotation
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/troubleshoot_rotation.html
