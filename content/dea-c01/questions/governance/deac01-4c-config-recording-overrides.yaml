id: deac01-4c-config-recording-overrides
objective: "4.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Config with continuous recording for all resource types. Costs are rising because frequently changing resources generate many configuration items. The governance team needs every change to Amazon Redshift clusters and Amazon S3 buckets recorded as it happens, but one record per day of the latest state is enough for all other resource types, which must still be recorded.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    AnyCompany utilise AWS Config avec un enregistrement continu pour tous les types de ressources. Les coûts augmentent, car les ressources qui changent souvent génèrent de nombreux éléments de configuration. L'équipe de gouvernance a besoin que chaque modification des clusters Amazon Redshift et des compartiments Amazon S3 soit enregistrée au moment où elle se produit, mais un enregistrement par jour du dernier état suffit pour tous les autres types de ressources, qui doivent rester enregistrés.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Stop the configuration recorder every night, and start it again every morning before the business day begins.", fr: "Arrêter l'enregistreur de configuration chaque soir, et le redémarrer chaque matin avant le début de la journée de travail." } }
    - { id: b, text: { en: "Record only Redshift clusters and S3 buckets with continuous recording, and exclude all other resource types from recording.", fr: "N'enregistrer en continu que les clusters Redshift et les compartiments S3, et exclure de l'enregistrement tous les autres types de ressources." } }
    - { id: c, text: { en: "Set the default recording frequency to daily, and add a recording mode override with continuous recording for Redshift clusters and S3 buckets.", fr: "Définir la fréquence d'enregistrement par défaut sur quotidienne, et ajouter une substitution du mode d'enregistrement avec un enregistrement continu pour les clusters Redshift et les compartiments S3." } }
    - { id: d, text: { en: "Keep the default recording frequency continuous, and add a recording mode override with daily recording for Redshift clusters and S3 buckets.", fr: "Conserver la fréquence d'enregistrement par défaut continue, et ajouter une substitution du mode d'enregistrement avec un enregistrement quotidien pour les clusters Redshift et les compartiments S3." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The configuration recorder has a default recording frequency (recordingMode) and recordingModeOverrides for specific resource types. Daily recording delivers at most one configuration item per 24 hours with the latest state, which lowers costs, while the continuous override records every change to the two critical resource types as it happens."
    fr: "L'enregistreur de configuration possède une fréquence d'enregistrement par défaut (recordingMode) et des substitutions (recordingModeOverrides) pour des types de ressources précis. L'enregistrement quotidien fournit au plus un élément de configuration par période de 24 heures avec le dernier état, ce qui réduit les coûts, tandis que la substitution continue enregistre chaque modification des deux types de ressources critiques au moment où elle se produit."
  options:
    a:
      en: "Stopping the recorder loses the changes made while it is stopped, including changes to Redshift clusters and S3 buckets."
      fr: "Arrêter l'enregistreur fait perdre les modifications effectuées pendant l'arrêt, y compris celles des clusters Redshift et des compartiments S3."
    b:
      en: "The other resource types must still be recorded daily, so excluding them does not meet the requirement."
      fr: "Les autres types de ressources doivent rester enregistrés quotidiennement : les exclure ne répond pas à l'exigence."
    d:
      en: "This inverts the requirement: the critical resources would be recorded daily and all others continuously, at a higher cost."
      fr: "Cette solution inverse l'exigence : les ressources critiques seraient enregistrées quotidiennement et toutes les autres en continu, pour un coût plus élevé."
references:
  - title: Changing the recording frequency for the customer managed configuration recorder
    url: https://docs.aws.amazon.com/config/latest/developerguide/managing-recorder_console-change-recording-frequency.html
  - title: Recording AWS Resources with AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/select-resources.html
