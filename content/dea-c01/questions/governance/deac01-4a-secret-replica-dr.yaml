id: deac01-4a-secret-replica-dr
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs its data pipelines in us-east-1 and keeps a warm standby copy in eu-west-1. AWS Glue jobs in both Regions use the same database credentials, which are stored in an AWS Secrets Manager secret in us-east-1 and rotated every 30 days. The standby jobs must read the credentials from a secret in their own Region, and the two Regions must never hold different passwords after a rotation. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute ses pipelines de données dans us-east-1 et garde une copie de secours à chaud dans eu-west-1. Les tâches AWS Glue des deux Régions utilisent les mêmes informations d'identification de base de données, stockées dans un secret AWS Secrets Manager dans us-east-1 et soumises à une rotation tous les 30 jours. Les tâches de secours doivent lire les informations d'identification dans un secret de leur propre Région, et les deux Régions ne doivent jamais détenir des mots de passe différents après une rotation. L'entreprise veut la charge opérationnelle la PLUS FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a second secret in eu-west-1 and turn on rotation for both secrets with the same schedule.", fr: "Créer un second secret dans eu-west-1 et activer la rotation des deux secrets avec la même planification." } }
    - { id: b, text: { en: "Copy the value into a SecureString parameter in eu-west-1 with a Lambda function after each rotation.", fr: "Copier la valeur dans un paramètre SecureString dans eu-west-1 avec une fonction Lambda après chaque rotation." } }
    - { id: c, text: { en: "Replicate the secret to eu-west-1 and keep rotation turned on for the primary secret only.", fr: "Répliquer le secret dans eu-west-1 et laisser la rotation activée uniquement pour le secret principal." } }
    - { id: d, text: { en: "Create an EventBridge rule that writes each new value to a secret in eu-west-1 with PutSecretValue.", fr: "Créer une règle EventBridge qui écrit chaque nouvelle valeur dans un secret de eu-west-1 avec PutSecretValue." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Secrets Manager replicates the encrypted secret data and its metadata to the Regions that you choose. With rotation turned on for the primary secret, the new value propagates to every replica, so you do not manage rotation for each replica.
    fr: |
      Secrets Manager réplique les données chiffrées du secret et ses métadonnées dans les Régions que vous choisissez. Avec la rotation activée pour le secret principal, la nouvelle valeur se propage à chaque réplica : vous ne gérez pas la rotation de chaque réplica.
  options:
    a:
      en: |
        Two independent rotations generate two different passwords, while the database accepts only one, so the Regions would diverge.
      fr: |
        Deux rotations indépendantes génèrent deux mots de passe différents alors que la base n'en accepte qu'un : les Régions divergeraient.
    b:
      en: |
        The copy depends on custom code to maintain, and the jobs would read a parameter instead of a secret.
      fr: |
        La copie dépend de code personnalisé à maintenir, et les tâches liraient un paramètre au lieu d'un secret.
    d:
      en: |
        This builds a custom synchronization that native replication already provides, with more components to operate.
      fr: |
        Cela construit une synchronisation personnalisée que la réplication native fournit déjà, avec davantage de composants à exploiter.
references:
  - title: Replicate AWS Secrets Manager secrets across Regions
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/create-manage-multi-region-secrets.html
