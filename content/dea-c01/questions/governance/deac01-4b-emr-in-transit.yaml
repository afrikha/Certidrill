id: deac01-4b-emr-in-transit
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs Apache Spark jobs on Amazon EMR clusters that process health data. A compliance review requires that the data exchanged between the nodes of each cluster, such as shuffle traffic, be encrypted in transit with TLS. The company wants the LEAST operational overhead for certificate management.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des tâches Apache Spark sur des clusters Amazon EMR qui traitent des données de santé. Une revue de conformité exige que les données échangées entre les nœuds de chaque cluster, comme le trafic de shuffle, soient chiffrées en transit avec TLS. L'entreprise veut le MOINS de charge opérationnelle possible pour la gestion des certificats.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a security configuration that enables local disk encryption with an AWS KMS key for all instance volumes, and launch the clusters with it.", fr: "Créer une configuration de sécurité qui active le chiffrement des disques locaux avec une clé AWS KMS pour tous les volumes d'instance, et lancer les clusters avec elle." } }
    - { id: b, text: { en: "Create a security configuration that enables SSE-KMS for EMRFS data in Amazon S3, and launch the clusters with it.", fr: "Créer une configuration de sécurité qui active SSE-KMS pour les données EMRFS dans Amazon S3, et lancer les clusters avec elle." } }
    - { id: c, text: { en: "Launch the clusters in private subnets, and allow traffic between the nodes only through the security groups of the cluster.", fr: "Lancer les clusters dans des sous-réseaux privés, et n'autoriser le trafic entre les nœuds que par les groupes de sécurité du cluster." } }
    - { id: d, text: { en: "Create a security configuration that enables in-transit encryption with EMR-managed certificates, and launch the clusters with it.", fr: "Créer une configuration de sécurité qui active le chiffrement en transit avec des certificats gérés par EMR, et lancer les clusters avec elle." } }
answer: { optionId: d }
explanation:
  correct:
    en: "In-transit encryption is enabled through an EMR security configuration, and EMR then configures TLS for the open-source application endpoints that support it. Letting Amazon EMR create and manage the certificates avoids providing and rotating certificate files yourself."
    fr: "Le chiffrement en transit s'active via une configuration de sécurité EMR, puis EMR configure TLS pour les points de terminaison des applications open source qui le prennent en charge. Laisser Amazon EMR créer et gérer les certificats évite de fournir et de renouveler soi-même des fichiers de certificats."
  options:
    a:
      en: "Local disk encryption protects data at rest on instance volumes, not traffic between nodes."
      fr: "Le chiffrement des disques locaux protège les données au repos sur les volumes des instances, pas le trafic entre nœuds."
    b:
      en: "SSE-KMS encrypts EMRFS objects at rest in S3; it does not cover traffic between cluster nodes."
      fr: "SSE-KMS chiffre au repos les objets EMRFS dans S3 ; il ne couvre pas le trafic entre les nœuds du cluster."
    c:
      en: "Network isolation limits who can reach the nodes but leaves the traffic unencrypted."
      fr: "L'isolement réseau limite qui peut joindre les nœuds mais laisse le trafic non chiffré."
references:
  - title: Encryption options for Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-data-encryption-options.html
