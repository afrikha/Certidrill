id: deac01-4a-firehose-cross-account
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Data Firehose stream in account A (111111111111) must deliver records directly to an Amazon S3 bucket owned by account B (222222222222), the company's central data lake account. Account B must not need to copy or move the data after delivery.

    Which configuration will meet these requirements?
  fr: |
    Un flux Amazon Data Firehose du compte A (111111111111) doit livrer des enregistrements directement dans un compartiment Amazon S3 appartenant au compte B (222222222222), le compte central du lac de données de l'entreprise. Le compte B ne doit pas avoir à copier ni à déplacer les données après la livraison.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "In account A, give the stream's IAM role S3 permissions on the bucket. Make no change in account B.", fr: "Dans le compte A, donner au rôle IAM du flux des autorisations S3 sur le compartiment. Ne rien modifier dans le compte B." } }
    - { id: b, text: { en: "In account A, give the stream's IAM role S3 permissions on the bucket. In account B, add a bucket policy that allows that role.", fr: "Dans le compte A, donner au rôle IAM du flux des autorisations S3 sur le compartiment. Dans le compte B, ajouter une politique de compartiment qui autorise ce rôle." } }
    - { id: c, text: { en: "In account B, add a bucket policy that allows the Firehose service principal to write objects, and configure the stream without a role.", fr: "Dans le compte B, ajouter une politique de compartiment qui autorise le principal de service Firehose à écrire des objets, et configurer le flux sans rôle." } }
    - { id: d, text: { en: "Deliver to a bucket in account A, and add an S3 Replication rule that copies the objects to the bucket in account B.", fr: "Livrer dans un compartiment du compte A et ajouter une règle S3 Replication qui copie les objets dans le compartiment du compte B." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For cross-account delivery, account A creates the IAM role that Firehose uses, with S3 actions on the bucket (including s3:PutObjectAcl so that account B gets full control of the objects). Account B then adds a bucket policy that allows that role, because cross-account access needs both the identity policy and the resource policy.
    fr: |
      Pour une livraison entre comptes, le compte A crée le rôle IAM que Firehose utilise, avec les actions S3 sur le compartiment (dont s3:PutObjectAcl pour que le compte B ait le contrôle total des objets). Le compte B ajoute ensuite une politique de compartiment qui autorise ce rôle, car un accès entre comptes exige à la fois la politique basée sur l'identité et la politique de ressource.
  options:
    a:
      en: |
        Permissions in account A alone are not enough to write to a bucket of account B; the bucket policy must also allow the role.
      fr: |
        Les autorisations du compte A seules ne suffisent pas pour écrire dans un compartiment du compte B ; la politique de compartiment doit aussi autoriser le rôle.
    c:
      en: |
        Firehose accesses the destination with the IAM role specified for the stream, so a stream without a role cannot deliver.
      fr: |
        Firehose accède à la destination avec le rôle IAM indiqué pour le flux : un flux sans rôle ne peut pas livrer.
    d:
      en: |
        Replication copies the data after delivery instead of delivering it directly, and doubles the storage.
      fr: |
        La réplication copie les données après la livraison au lieu de les livrer directement, et double le stockage.
references:
  - title: Controlling access with Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/controlling-access.html
