id: deac01-4a-custom-rotation-function
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AWS Glue jobs at a media company call a third-party data provider's REST API with an API key stored in an AWS Secrets Manager secret. The provider offers an API to issue a new key and to revoke an old one. The company wants Secrets Manager to rotate the key every 30 days on its schedule and to test the new key before the jobs start using it.

    Which solution will meet these requirements?
  fr: |
    Des tâches AWS Glue d'une entreprise de médias appellent l'API REST d'un fournisseur de données tiers avec une clé d'API stockée dans un secret AWS Secrets Manager. Le fournisseur propose une API pour émettre une nouvelle clé et révoquer une ancienne clé. L'entreprise veut que Secrets Manager assure la rotation de la clé tous les 30 jours selon sa planification et teste la nouvelle clé avant que les tâches ne commencent à l'utiliser.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on rotation for the secret with the rotation function template for Amazon RDS PostgreSQL single user.", fr: "Activer la rotation du secret avec le modèle de fonction de rotation pour Amazon RDS PostgreSQL à utilisateur unique." } }
    - { id: b, text: { en: "Write a rotation Lambda function whose createSecret, setSecret, testSecret, and finishSecret steps call the provider's API, and set a 30-day schedule.", fr: "Écrire une fonction Lambda de rotation dont les étapes createSecret, setSecret, testSecret et finishSecret appellent l'API du fournisseur, et définir une planification de 30 jours." } }
    - { id: c, text: { en: "Store the key in a SecureString parameter and have an EventBridge schedule invoke a function that replaces it every 30 days.", fr: "Stocker la clé dans un paramètre SecureString et faire appeler par une planification EventBridge une fonction qui la remplace tous les 30 jours." } }
    - { id: d, text: { en: "Add a resource policy to the secret that denies secretsmanager:GetSecretValue to the jobs 30 days after each update of the key.", fr: "Ajouter au secret une politique de ressource qui refuse secretsmanager:GetSecretValue aux tâches 30 jours après chaque mise à jour de la clé." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For a credential of a service that Secrets Manager does not know, you write a rotation function. createSecret stores a new value with the AWSPENDING label, setSecret activates it at the provider, testSecret checks the pending version, and finishSecret moves AWSCURRENT to it, so jobs only see a tested key.
    fr: |
      Pour l'information d'identification d'un service que Secrets Manager ne connaît pas, vous écrivez une fonction de rotation. createSecret stocke une nouvelle valeur avec l'étiquette AWSPENDING, setSecret l'active chez le fournisseur, testSecret vérifie la version en attente et finishSecret y déplace AWSCURRENT : les tâches ne voient qu'une clé testée.
  options:
    a:
      en: |
        The RDS template changes a database user's password; it cannot call the provider's API to issue a new key.
      fr: |
        Le modèle RDS change le mot de passe d'un utilisateur de base de données ; il ne peut pas appeler l'API du fournisseur pour émettre une nouvelle clé.
    c:
      en: |
        The rotation runs outside Secrets Manager, and the replacement does not test the new key before the jobs use it.
      fr: |
        La rotation s'exécute en dehors de Secrets Manager, et le remplacement ne teste pas la nouvelle clé avant que les tâches ne l'utilisent.
    d:
      en: |
        A deny statement only blocks access to the secret; it never creates a new key.
      fr: |
        Une instruction de refus bloque seulement l'accès au secret ; elle ne crée jamais de nouvelle clé.
references:
  - title: Lambda rotation functions
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_lambda-functions.html
