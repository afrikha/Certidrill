id: deac01-4c-kms-replica-region
objective: "4.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany encrypts its data lake and its database backups with AWS KMS multi-Region keys whose primary keys are in eu-west-1. A data privacy policy states that encrypted copies must never be decryptable outside Europe, so key administrators may create replica keys only in Regions whose names start with eu-. The restriction must be enforced in the key policy of each primary key.

    Which condition should the key policy statement that allows kms:ReplicateKey include?
  fr: |
    AnyCompany chiffre son lac de données et les sauvegardes de ses bases de données avec des clés multi-Régions AWS KMS dont les clés primaires se trouvent dans eu-west-1. Une politique de confidentialité des données stipule que les copies chiffrées ne doivent jamais pouvoir être déchiffrées hors d'Europe : les administrateurs de clés ne peuvent donc créer des clés de réplica que dans les Régions dont le nom commence par eu-. La restriction doit être appliquée dans la politique de clé de chaque clé primaire.

    Quelle condition l'instruction de la politique de clé qui autorise kms:ReplicateKey doit-elle inclure ?
body:
  options:
    - { id: a, text: { en: "A StringLike condition on the kms:ReplicaRegion key with the value eu-*.", fr: "Une condition StringLike sur la clé kms:ReplicaRegion avec la valeur eu-*." } }
    - { id: b, text: { en: "A StringLike condition on the kms:PrimaryRegion key with the value eu-*.", fr: "Une condition StringLike sur la clé kms:PrimaryRegion avec la valeur eu-*." } }
    - { id: c, text: { en: "A StringLike condition on the aws:RequestedRegion key with the value eu-*.", fr: "Une condition StringLike sur la clé aws:RequestedRegion avec la valeur eu-*." } }
    - { id: d, text: { en: "A StringEquals condition on the kms:MultiRegionKeyType key with the value PRIMARY.", fr: "Une condition StringEquals sur la clé kms:MultiRegionKeyType avec la valeur PRIMARY." } }
answer: { optionId: a }
explanation:
  correct:
    en: "kms:ReplicaRegion applies to the ReplicateKey operation and checks the ReplicaRegion parameter, which names the Region of the new replica key. Its value can be Region names or patterns such as eu-*, so a StringLike condition allows replicas only in European Regions."
    fr: "kms:ReplicaRegion s'applique à l'opération ReplicateKey et vérifie le paramètre ReplicaRegion, qui indique la Région de la nouvelle clé de réplica. Sa valeur peut être des noms de Régions ou des modèles comme eu-* : une condition StringLike n'autorise donc les réplicas que dans les Régions européennes."
  options:
    b:
      en: "kms:PrimaryRegion controls UpdatePrimaryRegion, which promotes a replica to primary; it does not limit where replicas are created."
      fr: "kms:PrimaryRegion contrôle UpdatePrimaryRegion, qui promeut un réplica en clé primaire ; elle ne limite pas l'emplacement de création des réplicas."
    c:
      en: "ReplicateKey is called on the primary key in eu-west-1, so aws:RequestedRegion always matches eu-* whatever replica Region is requested."
      fr: "ReplicateKey est appelée sur la clé primaire dans eu-west-1 : aws:RequestedRegion correspond donc toujours à eu-*, quelle que soit la Région de réplica demandée."
    d:
      en: "kms:MultiRegionKeyType only checks whether the key is a primary or a replica key; it says nothing about the target Region."
      fr: "kms:MultiRegionKeyType vérifie seulement si la clé est une clé primaire ou une clé de réplica ; elle ne dit rien de la Région cible."
references:
  - title: AWS KMS condition keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html
  - title: ReplicateKey
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_ReplicateKey.html
