id: deac01-4a-redshift-serverless-intermittent
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Analysts at a company run reports on a 2 TB data warehouse for a few hours each week, at times that nobody can predict. The rest of the time, the warehouse is idle. Today, an Amazon Redshift provisioned cluster runs around the clock, and the team resizes it before each month-end close. The company wants to stop managing capacity and to pay only when the warehouse is in use.

    Which solution will meet these requirements?
  fr: |
    Les analystes d'une entreprise exécutent des rapports sur un entrepôt de données de 2 To quelques heures par semaine, à des moments que personne ne peut prévoir. Le reste du temps, l'entrepôt est inactif. Aujourd'hui, un cluster provisionné Amazon Redshift tourne en permanence, et l'équipe le redimensionne avant chaque clôture mensuelle. L'entreprise veut cesser de gérer la capacité et ne payer que lorsque l'entrepôt est utilisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the provisioned cluster and purchase reserved nodes for it.", fr: "Conserver le cluster provisionné et acheter des nœuds réservés pour celui-ci." } }
    - { id: b, text: { en: "Migrate the data warehouse to Amazon Redshift Serverless.", fr: "Migrer l'entrepôt de données vers Amazon Redshift Serverless." } }
    - { id: c, text: { en: "Keep the provisioned cluster and pause and resume it with a fixed schedule.", fr: "Conserver le cluster provisionné et le suspendre et le reprendre selon une planification fixe." } }
    - { id: d, text: { en: "Move the data to PostgreSQL on an Amazon EC2 instance that is stopped when idle.", fr: "Déplacer les données vers PostgreSQL sur une instance Amazon EC2 arrêtée quand elle est inactive." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Redshift Serverless automatically provisions data warehouse capacity and scales it, so there is no cluster to set up, tune, or resize. You pay only when the data warehouse is in use, which fits short, unpredictable workloads.
    fr: |
      Redshift Serverless provisionne automatiquement la capacité de l'entrepôt de données et la met à l'échelle : il n'y a aucun cluster à configurer, ajuster ni redimensionner. Vous ne payez que lorsque l'entrepôt de données est utilisé, ce qui convient aux charges de travail courtes et imprévisibles.
  options:
    a:
      en: |
        Reserved nodes lower the price of an always-on cluster, but the company still pays for idle time and still manages capacity.
      fr: |
        Les nœuds réservés baissent le prix d'un cluster toujours actif, mais l'entreprise paie toujours le temps d'inactivité et gère toujours la capacité.
    c:
      en: |
        A fixed schedule cannot match unpredictable usage, and the team still sizes and resizes the cluster.
      fr: |
        Une planification fixe ne peut pas suivre une utilisation imprévisible, et l'équipe dimensionne et redimensionne toujours le cluster.
    d:
      en: |
        A database on EC2 is self-managed, which adds patching and backups instead of removing capacity management.
      fr: |
        Une base de données sur EC2 est autogérée, ce qui ajoute les correctifs et les sauvegardes au lieu de supprimer la gestion de la capacité.
references:
  - title: What is Amazon Redshift Serverless?
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-whatis.html
