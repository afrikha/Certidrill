id: deac01-4b-ctlake-existing-facts
objective: "4.4.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany signed up for AWS CloudTrail Lake in 2025. It uses an organization event data store for its production organization and an account event data store in a sandbox account. A data engineer is reviewing what the availability change of May 31, 2026, means for the company.

    Which statements are true? (Choose two.)
  fr: |
    AnyCompany s'est inscrite à AWS CloudTrail Lake en 2025. Elle utilise un entrepôt de données d'événements d'organisation pour son organisation de production et un entrepôt de données d'événements de compte dans un compte de bac à sable (sandbox). Un ingénieur des données examine ce que le changement de disponibilité du 31 mai 2026 signifie pour l'entreprise.

    Quelles affirmations sont vraies ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Existing event data stores stopped ingesting new events on May 31, 2026.", fr: "Les entrepôts de données d'événements existants ont cessé d'ingérer de nouveaux événements le 31 mai 2026." } }
    - { id: b, text: { en: "The organization event data store keeps covering member accounts that are added to the organization later.", fr: "L'entrepôt de données d'événements d'organisation continue de couvrir les comptes membres ajoutés plus tard à l'organisation." } }
    - { id: c, text: { en: "An account event data store does not ingest events from accounts that are added to the organization later.", fr: "Un entrepôt de données d'événements de compte n'ingère pas les événements des comptes ajoutés plus tard à l'organisation." } }
    - { id: d, text: { en: "CloudTrail trails and CloudTrail Insights are no longer supported for the company's accounts.", fr: "Les journaux de suivi CloudTrail et CloudTrail Insights ne sont plus pris en charge pour les comptes de l'entreprise." } }
    - { id: e, text: { en: "CloudTrail Lake continues to receive new features for customers that signed up before the change.", fr: "CloudTrail Lake continue de recevoir de nouvelles fonctionnalités pour les clients inscrits avant le changement." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "Existing customers can keep using CloudTrail Lake: organization event data stores continue to function, including for new member accounts and new Regions. Account event data stores keep supporting their existing accounts but do not ingest data for accounts added to the organization later."
    fr: "Les clients existants peuvent continuer à utiliser CloudTrail Lake : les entrepôts de données d'événements d'organisation continuent de fonctionner, y compris pour les nouveaux comptes membres et les nouvelles Régions. Les entrepôts de données d'événements de compte continuent de prendre en charge leurs comptes existants mais n'ingèrent pas les données des comptes ajoutés plus tard à l'organisation."
  options:
    a:
      en: "The change closes sign-ups to new customers; existing customers continue to use the service as normal."
      fr: "Le changement ferme les inscriptions aux nouveaux clients ; les clients existants continuent d'utiliser le service normalement."
    d:
      en: "CloudTrail itself remains fully supported; trails, Insights, and aggregated events are not affected."
      fr: "CloudTrail reste entièrement pris en charge ; les journaux de suivi, Insights et les événements agrégés ne sont pas concernés."
    e:
      en: "CloudTrail Lake now receives only critical bug fixes and security updates."
      fr: "CloudTrail Lake ne reçoit plus que des correctifs de bogues critiques et des mises à jour de sécurité."
references:
  - title: CloudTrail Lake availability change
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-lake-service-availability-change.html
