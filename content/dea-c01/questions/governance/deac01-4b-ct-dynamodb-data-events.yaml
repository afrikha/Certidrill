id: deac01-4b-ct-dynamodb-data-events
objective: "4.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores payment records in an Amazon DynamoDB table named `payments`. After a reconciliation error, auditors must be able to identify which IAM principal updated or deleted each item from now on. The company already has an AWS CloudTrail trail that logs management events only.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke des enregistrements de paiement dans une table Amazon DynamoDB nommée `payments`. Après une erreur de rapprochement, les auditeurs doivent pouvoir identifier désormais quel principal IAM a modifié ou supprimé chaque élément. L'entreprise dispose déjà d'un journal de suivi AWS CloudTrail qui n'enregistre que les événements de gestion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable DynamoDB Streams on the table, and have an AWS Lambda function write each stream record to Amazon CloudWatch Logs.", fr: "Activer DynamoDB Streams sur la table, et faire écrire chaque enregistrement du flux dans Amazon CloudWatch Logs par une fonction AWS Lambda." } }
    - { id: b, text: { en: "Enable point-in-time recovery on the table, and compare restored copies to find the changed items.", fr: "Activer la restauration à un instant dans le passé sur la table, et comparer des copies restaurées pour trouver les éléments modifiés." } }
    - { id: c, text: { en: "Add a data event selector to the trail for resources.type AWS::DynamoDB::Table with the ARN of the payments table.", fr: "Ajouter au journal de suivi un sélecteur d'événements de données pour resources.type AWS::DynamoDB::Table avec l'ARN de la table payments." } }
    - { id: d, text: { en: "Enable CloudTrail Insights on the trail so that it records unusual write activity on the table.", fr: "Activer CloudTrail Insights sur le journal de suivi afin qu'il enregistre l'activité d'écriture inhabituelle sur la table." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Item-level DynamoDB APIs such as PutItem, UpdateItem, and DeleteItem are data events, which a trail logs only when a data event selector includes the table. Each event then records the principal that made the call."
    fr: "Les API DynamoDB au niveau des éléments comme PutItem, UpdateItem et DeleteItem sont des événements de données, qu'un journal de suivi n'enregistre que si un sélecteur d'événements de données inclut la table. Chaque événement enregistre alors le principal à l'origine de l'appel."
  options:
    a:
      en: "Stream records describe the item changes, but they do not identify the IAM principal that made each request."
      fr: "Les enregistrements du flux décrivent les modifications des éléments, mais ils n'identifient pas le principal IAM à l'origine de chaque requête."
    b:
      en: "Point-in-time recovery restores table data; it records no caller identity."
      fr: "La restauration à un instant dans le passé restaure les données de la table ; elle n'enregistre aucune identité d'appelant."
    d:
      en: "Insights events flag unusual API rates; they do not record each item-level call with its caller."
      fr: "Les événements Insights signalent des taux d'API inhabituels ; ils n'enregistrent pas chaque appel au niveau des éléments avec son auteur."
references:
  - title: Logging data events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
