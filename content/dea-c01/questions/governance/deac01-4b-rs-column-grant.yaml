id: deac01-4b-rs-column-grant
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany stores customer orders in an Amazon Redshift table named `sales.orders`. The table contains the columns `order_id`, `order_date`, `amount`, `customer_email`, and `customer_phone`. Members of the database role `marketing` must be able to query only `order_id`, `order_date`, and `amount`. The company does not want to create copies of the data or maintain additional objects.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke les commandes de ses clients dans une table Amazon Redshift nommée `sales.orders`. La table contient les colonnes `order_id`, `order_date`, `amount`, `customer_email` et `customer_phone`. Les membres du rôle de base de données `marketing` doivent pouvoir interroger uniquement `order_id`, `order_date` et `amount`. L'entreprise ne veut ni créer de copies des données ni maintenir d'objets supplémentaires.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Grant SELECT on the whole table to the role, and attach a row-level security policy that hides the email and phone columns.", fr: "Accorder SELECT sur toute la table au rôle, et attacher une politique de sécurité au niveau des lignes qui masque les colonnes d'e-mail et de téléphone." } }
    - { id: b, text: { en: "Run GRANT SELECT (order_id, order_date, amount) ON sales.orders TO ROLE marketing.", fr: "Exécuter GRANT SELECT (order_id, order_date, amount) ON sales.orders TO ROLE marketing." } }
    - { id: c, text: { en: "Create a nightly job that copies the three columns into a new table, and grant SELECT on that table to the role.", fr: "Créer une tâche nocturne qui copie les trois colonnes dans une nouvelle table, et accorder SELECT sur cette table au rôle." } }
    - { id: d, text: { en: "Grant the sys:monitor role to the members of the marketing role so that they can read the table metadata only.", fr: "Accorder le rôle sys:monitor aux membres du rôle marketing afin qu'ils ne puissent lire que les métadonnées de la table." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Redshift supports column-level privileges for SELECT and UPDATE on tables and views. Granting SELECT on a list of columns to a role lets its members query only those columns, without copies or extra objects."
    fr: "Amazon Redshift prend en charge les privilèges au niveau des colonnes pour SELECT et UPDATE sur les tables et les vues. Accorder SELECT sur une liste de colonnes à un rôle permet à ses membres d'interroger uniquement ces colonnes, sans copie ni objet supplémentaire."
  options:
    a:
      en: "Row-level security filters rows, not columns, so the email and phone columns would stay visible."
      fr: "La sécurité au niveau des lignes filtre des lignes, pas des colonnes : les colonnes d'e-mail et de téléphone resteraient visibles."
    c:
      en: "A copied table duplicates the data and adds a job to maintain, which the company wants to avoid."
      fr: "Une table copiée duplique les données et ajoute une tâche à maintenir, ce que l'entreprise veut éviter."
    d:
      en: "sys:monitor gives access to catalog and system tables, not to the three columns of a user table."
      fr: "sys:monitor donne accès aux tables de catalogue et aux tables système, pas aux trois colonnes d'une table utilisateur."
references:
  - title: GRANT
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_GRANT.html
