id: deac01-4c-data-exchange-redshift
objective: "4.5.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A market data company stores curated financial datasets in an Amazon Redshift cluster. It wants to license this data to external customers who use their own AWS accounts. Customers must get read-only query access to the live data without extracting, transforming, or loading it. The company wants offers, pricing, and entitlements to be handled for it.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une société de données de marché stocke des jeux de données financières préparés dans un cluster Amazon Redshift. Elle veut concéder sous licence ces données à des clients externes qui utilisent leurs propres comptes AWS. Les clients doivent obtenir un accès en lecture seule, par requêtes, aux données en direct, sans les extraire, les transformer ni les charger. L'entreprise veut que les offres, la tarification et les droits d'accès soient gérés pour elle.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Create a datashare for each customer, grant usage to each customer account, and track licenses and invoices in an internal system.", fr: "Créer une unité de partage des données (datashare) par client, accorder l'utilisation à chaque compte client, et suivre les licences et les factures dans un système interne." } }
    - { id: b, text: { en: "Publish an AWS Data Exchange product with an Amazon Redshift data set based on a datashare, and offer it through AWS Marketplace.", fr: "Publier un produit AWS Data Exchange avec un jeu de données Amazon Redshift fondé sur une unité de partage des données, et le proposer via AWS Marketplace." } }
    - { id: c, text: { en: "Unload the tables to Amazon S3 every night, and send customers presigned URLs to download the files.", fr: "Décharger les tables dans Amazon S3 chaque nuit, et envoyer aux clients des URL présignées pour télécharger les fichiers." } }
    - { id: d, text: { en: "Copy a snapshot of the cluster to each customer account every day so that customers can restore it.", fr: "Copier chaque jour un instantané du cluster dans chaque compte client afin que les clients puissent le restaurer." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Data Exchange lets data senders share and license data without building delivery and entitlement infrastructure. Its Amazon Redshift data sets give receivers read-only query access to live data without ETL, and AWS Marketplace offers define the prices, durations, and subscription terms."
    fr: "AWS Data Exchange permet aux fournisseurs de données de partager des données et d'en concéder des licences sans créer d'infrastructure de livraison et de gestion des droits. Ses jeux de données Amazon Redshift donnent aux destinataires un accès en lecture seule, par requêtes, aux données en direct, sans ETL, et les offres AWS Marketplace définissent les prix, les durées et les conditions d'abonnement."
  options:
    a:
      en: "Datashares give live access, but managing licenses, entitlements, and invoices for every customer is operational work that Data Exchange removes."
      fr: "Les unités de partage des données donnent un accès en direct, mais gérer les licences, les droits et les factures de chaque client représente une charge que Data Exchange supprime."
    c:
      en: "Nightly file exports are not live query access and require customers to load the data themselves."
      fr: "Des exportations de fichiers nocturnes ne constituent pas un accès en direct par requêtes et obligent les clients à charger eux-mêmes les données."
    d:
      en: "Snapshot copies give customers full copies that are up to a day old, with no licensing or entitlement management."
      fr: "Des copies d'instantanés donnent aux clients des copies complètes ayant jusqu'à un jour de retard, sans gestion des licences ni des droits."
references:
  - title: What is AWS Data Exchange?
    url: https://docs.aws.amazon.com/data-exchange/latest/userguide/what-is.html
  - title: Data sharing in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/datashare-overview.html
