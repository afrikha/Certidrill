id: deac01-4a-data-api-secret-tag
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The execution role of an AWS Lambda function has the AmazonRedshiftDataFullAccess managed policy and no other policy. The function calls ExecuteStatement on an Amazon Redshift Serverless workgroup and passes the ARN of a new AWS Secrets Manager secret that stores a database user name and password. The calls fail with an access error when the secret is retrieved. The company wants to keep using the managed policy without adding other permissions.

    Which solution will meet these requirements?
  fr: |
    Le rôle d'exécution d'une fonction AWS Lambda possède la politique gérée AmazonRedshiftDataFullAccess et aucune autre politique. La fonction appelle ExecuteStatement sur un groupe de travail Amazon Redshift Serverless et transmet l'ARN d'un nouveau secret AWS Secrets Manager qui stocke un nom d'utilisateur et un mot de passe de base de données. Les appels échouent avec une erreur d'accès lors de la récupération du secret. L'entreprise veut continuer à utiliser la politique gérée sans ajouter d'autres autorisations.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on automatic rotation for the secret so that the Data API reads its AWSCURRENT version.", fr: "Activer la rotation automatique du secret pour que la Data API lise sa version AWSCURRENT." } }
    - { id: b, text: { en: "Replace the managed policy with SecretsManagerReadWrite on the function's execution role.", fr: "Remplacer la politique gérée par SecretsManagerReadWrite sur le rôle d'exécution de la fonction." } }
    - { id: c, text: { en: "Add a tag with the key RedshiftDataFullAccess to the secret.", fr: "Ajouter au secret une balise dont la clé est RedshiftDataFullAccess." } }
    - { id: d, text: { en: "Store the credentials in a SecureString parameter and pass the parameter's ARN in the SecretArn field.", fr: "Stocker les informations d'identification dans un paramètre SecureString et transmettre l'ARN du paramètre dans le champ SecretArn." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The AmazonRedshiftDataFullAccess managed policy allows secretsmanager:GetSecretValue only on secrets tagged with the key RedshiftDataFullAccess. Tagging the new secret with that key lets the Data API retrieve the credentials under the existing policy.
    fr: |
      La politique gérée AmazonRedshiftDataFullAccess n'autorise secretsmanager:GetSecretValue que sur les secrets dotés d'une balise de clé RedshiftDataFullAccess. Baliser le nouveau secret avec cette clé permet à la Data API de récupérer les informations d'identification avec la politique existante.
  options:
    a:
      en: |
        Rotation changes the secret's value, not who can read it, so the managed policy still denies access to an untagged secret.
      fr: |
        La rotation change la valeur du secret, pas qui peut le lire : la politique gérée refuse toujours l'accès à un secret sans balise.
    b:
      en: |
        This removes the Data API permissions that the function needs and grants broad write access to every secret, against the company's choice.
      fr: |
        Cela retire les autorisations de la Data API dont la fonction a besoin et accorde un large accès en écriture à tous les secrets, contre le choix de l'entreprise.
    d:
      en: |
        The SecretArn parameter takes a Secrets Manager secret; the Data API does not read Parameter Store parameters.
      fr: |
        Le paramètre SecretArn attend un secret Secrets Manager ; la Data API ne lit pas les paramètres de Parameter Store.
references:
  - title: Storing database credentials in AWS Secrets Manager
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/data-api-secrets.html
  - title: Configuring IAM permissions
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/data-api-iam.html
