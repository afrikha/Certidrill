id: deac01-4b-msk-tls-defaults
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is creating an Amazon MSK provisioned cluster to ingest clickstream events. The security policy requires TLS for all traffic between clients and brokers and for all traffic between brokers, and data at rest must be encrypted with a customer managed AWS KMS key.

    Which cluster configuration will meet these requirements?
  fr: |
    AnyCompany crée un cluster provisionné Amazon MSK pour ingérer des événements de parcours de navigation (clickstream). La politique de sécurité exige TLS pour tout le trafic entre les clients et les agents (brokers) et pour tout le trafic entre agents, et les données au repos doivent être chiffrées avec une clé AWS KMS gérée par le client.

    Quelle configuration de cluster répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Client-broker encryption set to TLS encrypted data only, in-cluster encryption enabled, and the customer managed key for encryption at rest.", fr: "Chiffrement client-agent défini sur les seules données chiffrées TLS, chiffrement dans le cluster activé, et la clé gérée par le client pour le chiffrement au repos." } }
    - { id: b, text: { en: "Client-broker encryption set to both plaintext and TLS, in-cluster encryption enabled, and the customer managed key for encryption at rest.", fr: "Chiffrement client-agent défini sur le texte en clair et TLS, chiffrement dans le cluster activé, et la clé gérée par le client pour le chiffrement au repos." } }
    - { id: c, text: { en: "Client-broker encryption set to TLS encrypted data only, in-cluster encryption disabled, and the customer managed key for encryption at rest.", fr: "Chiffrement client-agent défini sur les seules données chiffrées TLS, chiffrement dans le cluster désactivé, et la clé gérée par le client pour le chiffrement au repos." } }
    - { id: d, text: { en: "Client-broker encryption set to plaintext only in private subnets, in-cluster encryption enabled, and the customer managed key for encryption at rest.", fr: "Chiffrement client-agent défini sur le texte en clair uniquement dans des sous-réseaux privés, chiffrement dans le cluster activé, et la clé gérée par le client pour le chiffrement au repos." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Accepting only TLS encrypted data between clients and brokers, which is the default, and keeping the default in-cluster encryption between brokers protect all traffic in transit. Amazon MSK always encrypts data at rest and lets you choose a customer managed KMS key when you create the cluster."
    fr: "N'accepter que des données chiffrées TLS entre clients et agents, ce qui est la valeur par défaut, et conserver le chiffrement par défaut entre agents dans le cluster protègent tout le trafic en transit. Amazon MSK chiffre toujours les données au repos et permet de choisir une clé KMS gérée par le client lors de la création du cluster."
  options:
    b:
      en: "Allowing plaintext lets clients connect without TLS, which the policy forbids."
      fr: "Autoriser le texte en clair permet aux clients de se connecter sans TLS, ce que la politique interdit."
    c:
      en: "Disabling in-cluster encryption leaves the traffic between brokers unencrypted."
      fr: "Désactiver le chiffrement dans le cluster laisse le trafic entre agents non chiffré."
    d:
      en: "Private subnets limit network exposure but do not encrypt the client traffic."
      fr: "Des sous-réseaux privés limitent l'exposition réseau mais ne chiffrent pas le trafic des clients."
references:
  - title: Amazon MSK encryption
    url: https://docs.aws.amazon.com/msk/latest/developerguide/msk-encryption.html
