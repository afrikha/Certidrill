id: deac01-4a-rotation-alternating-users
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's ETL jobs connect to an Amazon RDS for PostgreSQL database with the user etl_app, whose credentials are in an AWS Secrets Manager secret. The jobs run continuously and read the secret each time they open a connection. During each single user rotation, some connection attempts are denied for a short time. The company needs a rotation that always gives a valid set of credentials to a job that reads the secret during rotation. A second user with the same permissions as etl_app is acceptable.

    Which solution will meet these requirements?
  fr: |
    Les tâches ETL d'AnyCompany se connectent à une base de données Amazon RDS for PostgreSQL avec l'utilisateur etl_app, dont les informations d'identification sont dans un secret AWS Secrets Manager. Les tâches s'exécutent en continu et lisent le secret chaque fois qu'elles ouvrent une connexion. Pendant chaque rotation à utilisateur unique, des tentatives de connexion sont refusées pendant un court instant. L'entreprise a besoin d'une rotation qui donne toujours un jeu d'informations d'identification valide à une tâche qui lit le secret pendant la rotation. Un second utilisateur ayant les mêmes autorisations qu'etl_app est acceptable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the single user strategy and shorten the rotation window of the secret to one hour.", fr: "Conserver la stratégie à utilisateur unique et réduire la fenêtre de rotation du secret à une heure." } }
    - { id: b, text: { en: "Switch to the alternating users strategy and let the etl_app credentials create the cloned user.", fr: "Passer à la stratégie à utilisateurs alternés et laisser les informations d'identification d'etl_app créer l'utilisateur cloné." } }
    - { id: c, text: { en: "Replicate the secret to a second Region and point half of the jobs to the replica secret.", fr: "Répliquer le secret dans une deuxième Région et faire pointer la moitié des tâches vers le secret réplica." } }
    - { id: d, text: { en: "Switch to the alternating users strategy and store the credentials of a superuser in a separate secret.", fr: "Passer à la stratégie à utilisateurs alternés et stocker les informations d'identification d'un superutilisateur dans un secret distinct." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The alternating users strategy clones etl_app on the first rotation, then alternates between the two users, so a job that reads the secret during rotation still gets valid credentials and both users stay valid after it. Because most users cannot clone themselves, the strategy needs the credentials of a superuser in another secret.
    fr: |
      La stratégie à utilisateurs alternés clone etl_app à la première rotation, puis alterne entre les deux utilisateurs : une tâche qui lit le secret pendant la rotation obtient toujours des informations d'identification valides, et les deux utilisateurs restent valides ensuite. Comme la plupart des utilisateurs ne peuvent pas se cloner eux-mêmes, la stratégie a besoin des informations d'identification d'un superutilisateur dans un autre secret.
  options:
    a:
      en: |
        With a single user, there is always a short gap between the password change in the database and the secret update, whatever the window length.
      fr: |
        Avec un utilisateur unique, il y a toujours un court intervalle entre le changement de mot de passe dans la base et la mise à jour du secret, quelle que soit la durée de la fenêtre.
    b:
      en: |
        Most database users lack permission to create a clone of themselves, which is why the strategy requires a separate superuser secret.
      fr: |
        La plupart des utilisateurs de base de données n'ont pas l'autorisation de créer un clone d'eux-mêmes ; c'est pourquoi la stratégie exige un secret de superutilisateur distinct.
    c:
      en: |
        Replicas receive the same value as the primary after rotation, so both halves of the jobs see the same brief gap.
      fr: |
        Les réplicas reçoivent la même valeur que le secret principal après la rotation : les deux moitiés des tâches subissent le même bref intervalle.
references:
  - title: Lambda function rotation strategies
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotation-strategy.html
