id: deac01-4c-smus-metadata-rules
objective: "4.5.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    The finance domain unit of a company's Amazon SageMaker Unified Studio domain contains several producer projects and child domain units. As owner of the finance domain unit, the governance lead must ensure that every data asset published in the domain unit or its child units includes a completed data classification metadata form. Every subscription request to these assets must also include a completed business justification metadata form.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    L'unité de domaine finance du domaine Amazon SageMaker Unified Studio d'une entreprise contient plusieurs projets producteurs et des unités de domaine enfants. En tant que propriétaire de l'unité de domaine finance, le responsable de la gouvernance doit garantir que chaque ressource de données publiée dans l'unité de domaine ou ses unités enfants comporte un formulaire de métadonnées de classification des données rempli. Chaque demande d'abonnement à ces ressources doit aussi comporter un formulaire de métadonnées de justification métier rempli.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grant the metadata forms creation policy of the finance domain unit to every producer project.", fr: "Accorder à chaque projet producteur la politique de création de formulaires de métadonnées de l'unité de domaine finance." } }
    - { id: b, text: { en: "Create a metadata enforcement rule for data asset publishing that requires a data classification glossary term, and cascade it to child domain units.", fr: "Créer une règle d'application des métadonnées pour la publication des ressources de données qui exige un terme de glossaire de classification, et l'appliquer en cascade aux unités de domaine enfants." } }
    - { id: c, text: { en: "Create a metadata enforcement rule for data asset publishing that requires the data classification form, and cascade it to child domain units.", fr: "Créer une règle d'application des métadonnées pour la publication des ressources de données qui exige le formulaire de classification des données, et l'appliquer en cascade aux unités de domaine enfants." } }
    - { id: d, text: { en: "Assign an LF-tag named classification to the AWS Glue tables in AWS Lake Formation before the producers publish them.", fr: "Attribuer une balise LF nommée classification aux tables AWS Glue dans AWS Lake Formation avant que les producteurs ne les publient." } }
    - { id: e, text: { en: "Create a metadata enforcement rule for subscription requests that requires the business justification form, and cascade it to child domain units.", fr: "Créer une règle d'application des métadonnées pour les demandes d'abonnement qui exige le formulaire de justification métier, et l'appliquer en cascade aux unités de domaine enfants." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Domain unit owners create metadata enforcement rules on the Rules tab of a domain or domain unit. A rule applies either to data asset and product publishing, with required metadata forms or glossary terms, or to subscription requests, with required metadata forms; the cascade option makes child domain units inherit the rule."
    fr: "Les propriétaires d'unités de domaine créent des règles d'application des métadonnées dans l'onglet Rules d'un domaine ou d'une unité de domaine. Une règle s'applique soit à la publication des ressources et des produits de données, avec des formulaires de métadonnées ou des termes de glossaire obligatoires, soit aux demandes d'abonnement, avec des formulaires de métadonnées obligatoires ; l'option de cascade fait hériter la règle aux unités de domaine enfants."
  options:
    a:
      en: "This authorization policy lets projects create metadata forms; it does not require any form when assets are published."
      fr: "Cette politique d'autorisation permet aux projets de créer des formulaires de métadonnées ; elle n'exige aucun formulaire lors de la publication des ressources."
    b:
      en: "A glossary term association is a different requirement; the governance lead needs a completed metadata form."
      fr: "L'association d'un terme de glossaire est une exigence différente ; le responsable de la gouvernance a besoin d'un formulaire de métadonnées rempli."
    d:
      en: "LF-tags control Lake Formation permissions; they do not enforce catalog metadata at publishing or in subscription requests."
      fr: "Les balises LF contrôlent les autorisations Lake Formation ; elles n'imposent pas de métadonnées du catalogue lors de la publication ni dans les demandes d'abonnement."
references:
  - title: Metadata enforcement rules for publishing
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/metadata-rules-publishing.html
