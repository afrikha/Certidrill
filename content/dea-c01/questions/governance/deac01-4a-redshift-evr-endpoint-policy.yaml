id: deac01-4a-redshift-evr-endpoint-policy
objective: "4.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A financial company runs an Amazon Redshift provisioned cluster in private subnets. The VPC has no S3 endpoint, and enhanced VPC routing is off. New rules require that COPY and UNLOAD traffic between the cluster and Amazon S3 stay inside the company's VPC, and that the cluster can reach only three approved S3 buckets in the same Region, whatever IAM role a COPY command uses.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise financière exécute un cluster provisionné Amazon Redshift dans des sous-réseaux privés. Le VPC n'a pas de point de terminaison S3, et le routage VPC amélioré est désactivé. De nouvelles règles exigent que le trafic COPY et UNLOAD entre le cluster et Amazon S3 reste dans le VPC de l'entreprise, et que le cluster ne puisse atteindre que trois compartiments S3 approuvés de la même Région, quel que soit le rôle IAM utilisé par une commande COPY.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on enhanced VPC routing for the cluster.", fr: "Activer le routage VPC amélioré pour le cluster." } }
    - { id: b, text: { en: "Create a Redshift-managed VPC endpoint for the cluster in the same VPC.", fr: "Créer un point de terminaison VPC géré par Redshift pour le cluster dans le même VPC." } }
    - { id: c, text: { en: "Create an S3 gateway endpoint for the cluster subnets' route tables with an endpoint policy that allows only the three buckets.", fr: "Créer un point de terminaison de passerelle S3 pour les tables de routage des sous-réseaux du cluster avec une politique de point de terminaison qui n'autorise que les trois compartiments." } }
    - { id: d, text: { en: "Add an outbound rule to the cluster's security group that allows HTTPS only to the S3 managed prefix list.", fr: "Ajouter au groupe de sécurité du cluster une règle sortante qui n'autorise HTTPS que vers la liste de préfixes gérée de S3." } }
    - { id: e, text: { en: "Add a bucket policy to each approved bucket that denies requests that do not come through the company's VPC.", fr: "Ajouter à chaque compartiment approuvé une politique de compartiment qui refuse les requêtes qui ne passent pas par le VPC de l'entreprise." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Without enhanced VPC routing, Amazon Redshift sends COPY and UNLOAD traffic through the internet, outside your VPC controls. With it turned on, the traffic follows the VPC routes, so an S3 gateway endpoint carries it to buckets in the same Region, and the endpoint policy limits which buckets the cluster can reach, independently of the IAM role.
    fr: |
      Sans routage VPC amélioré, Amazon Redshift envoie le trafic COPY et UNLOAD par Internet, hors des contrôles de votre VPC. Une fois activé, le trafic suit les routes du VPC : un point de terminaison de passerelle S3 le transporte vers les compartiments de la même Région, et la politique de point de terminaison limite les compartiments que le cluster peut atteindre, indépendamment du rôle IAM.
  options:
    b:
      en: |
        A Redshift-managed VPC endpoint gives SQL clients private access to the cluster; it does not carry the cluster's traffic to Amazon S3.
      fr: |
        Un point de terminaison VPC géré par Redshift donne aux clients SQL un accès privé au cluster ; il ne transporte pas le trafic du cluster vers Amazon S3.
    d:
      en: |
        The prefix list covers all of Amazon S3 in the Region, so the rule cannot restrict the cluster to three buckets.
      fr: |
        La liste de préfixes couvre tout Amazon S3 dans la Région : la règle ne peut pas limiter le cluster à trois compartiments.
    e:
      en: |
        Policies on the approved buckets restrict who reaches those buckets; they do not stop the cluster from reaching other buckets.
      fr: |
        Des politiques sur les compartiments approuvés limitent qui atteint ces compartiments ; elles n'empêchent pas le cluster d'atteindre d'autres compartiments.
references:
  - title: Controlling network traffic with Redshift enhanced VPC routing
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/enhanced-vpc-routing.html
  - title: Control access to VPC endpoints using endpoint policies
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html
