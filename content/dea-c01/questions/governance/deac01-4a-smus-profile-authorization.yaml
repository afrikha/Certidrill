id: deac01-4a-smus-profile-authorization
objective: "4.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator of an Amazon SageMaker Unified Studio domain created a project profile whose blueprints deploy costly generative AI and compute resources. Only members of the IAM Identity Center group ml-platform may create projects from this profile. All other users must keep creating projects from the existing SQL analytics project profile.

    Which solution will meet these requirements?
  fr: |
    Un administrateur d'un domaine Amazon SageMaker Unified Studio a créé un profil de projet dont les plans (blueprints) déploient des ressources d'IA générative et de calcul coûteuses. Seuls les membres du groupe IAM Identity Center ml-platform peuvent créer des projets à partir de ce profil. Tous les autres utilisateurs doivent continuer à créer des projets à partir du profil de projet SQL analytics existant.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "In the authorization settings of the new project profile, choose Selected users and groups and add the ml-platform group.", fr: "Dans les paramètres d'autorisation du nouveau profil de projet, choisir Selected users and groups et ajouter le groupe ml-platform." } }
    - { id: b, text: { en: "Add the ml-platform group as an owner of every existing project in the domain and of each new project.", fr: "Ajouter le groupe ml-platform comme propriétaire de chaque projet existant du domaine et de chaque nouveau projet." } }
    - { id: c, text: { en: "Grant the project membership policy to the ml-platform group in each domain unit of the domain.", fr: "Accorder la politique d'appartenance aux projets au groupe ml-platform dans chaque unité de domaine du domaine." } }
    - { id: d, text: { en: "Create AWS Lake Formation permissions that limit the blueprints' databases to the ml-platform group.", fr: "Créer des autorisations AWS Lake Formation qui limitent les bases de données des plans au groupe ml-platform." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A project profile has an authorization setting that specifies who can use it to create projects: Selected users and groups, or Allow all users and groups. Limiting the new profile to ml-platform leaves the SQL analytics profile available to everyone else.
    fr: |
      Un profil de projet possède un paramètre d'autorisation qui indique qui peut l'utiliser pour créer des projets : Selected users and groups ou Allow all users and groups. Limiter le nouveau profil à ml-platform laisse le profil SQL analytics disponible pour tous les autres.
  options:
    b:
      en: |
        Ownership of existing projects lets the group manage those projects; it does not control who can create projects from the profile.
      fr: |
        La propriété des projets existants permet au groupe de gérer ces projets ; elle ne contrôle pas qui peut créer des projets à partir du profil.
    c:
      en: |
        The project membership policy concerns who can be a member of projects in a domain unit, not which project profile a user may use.
      fr: |
        La politique d'appartenance aux projets concerne qui peut être membre des projets d'une unité de domaine, pas le profil de projet qu'un utilisateur peut utiliser.
    d:
      en: |
        Lake Formation governs access to data in the catalog; it does not decide who can create projects from a SageMaker Unified Studio project profile.
      fr: |
        Lake Formation régit l'accès aux données du catalogue ; il ne décide pas qui peut créer des projets à partir d'un profil de projet SageMaker Unified Studio.
references:
