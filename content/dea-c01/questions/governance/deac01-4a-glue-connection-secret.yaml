id: deac01-4a-glue-connection-secret
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS Glue JDBC connections to an Oracle source store the user name and password directly in the connection properties. The security team requires that the credentials be stored encrypted in a service that supports automatic rotation. The jobs must use the current password at run time, without anyone editing the connections after each rotation.

    Which solution will meet these requirements?
  fr: |
    Les connexions JDBC AWS Glue d'une entreprise vers une source Oracle stockent le nom d'utilisateur et le mot de passe directement dans les propriétés de connexion. L'équipe de sécurité exige que les informations d'identification soient stockées chiffrées dans un service qui prend en charge la rotation automatique. Les tâches doivent utiliser le mot de passe actuel au moment de l'exécution, sans que personne ne modifie les connexions après chaque rotation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the credentials in a Secrets Manager secret and copy the new values into each connection with a Lambda function after each rotation.", fr: "Stocker les informations d'identification dans un secret Secrets Manager et copier les nouvelles valeurs dans chaque connexion avec une fonction Lambda après chaque rotation." } }
    - { id: b, text: { en: "Pass the credentials to the jobs as job arguments and attach a Glue security configuration that encrypts job bookmarks.", fr: "Transmettre les informations d'identification aux tâches comme arguments de tâche et attacher une configuration de sécurité Glue qui chiffre les signets de tâche." } }
    - { id: c, text: { en: "Store the credentials in a Secrets Manager secret, select the secret in the connections, and allow the job role to read the secret.", fr: "Stocker les informations d'identification dans un secret Secrets Manager, sélectionner le secret dans les connexions et autoriser le rôle de la tâche à lire le secret." } }
    - { id: d, text: { en: "Store the password in a SecureString parameter in Parameter Store and enter the parameter name in the connections' password field.", fr: "Stocker le mot de passe dans un paramètre SecureString de Parameter Store et saisir le nom du paramètre dans le champ de mot de passe des connexions." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AWS Glue recommends storing connection credentials in a Secrets Manager secret instead of entering the user name and password, and Glue reads the secret at run time for jobs and crawlers. The AWSGlueServiceRole managed policy does not include Secrets Manager permissions, so the job role needs permission to retrieve the secret value.
    fr: |
      AWS Glue recommande de stocker les informations d'identification de connexion dans un secret Secrets Manager plutôt que de saisir le nom d'utilisateur et le mot de passe, et Glue lit le secret au moment de l'exécution des tâches et des crawlers. La politique gérée AWSGlueServiceRole ne comprend pas d'autorisations Secrets Manager : le rôle de la tâche a besoin de l'autorisation de récupérer la valeur du secret.
  options:
    a:
      en: |
        Copying values into the connections is the editing after each rotation that the requirement forbids, done by custom code.
      fr: |
        Copier les valeurs dans les connexions revient à modifier les connexions après chaque rotation, ce que l'exigence interdit, au moyen de code personnalisé.
    b:
      en: |
        Job arguments are not a credential store with rotation, and encrypting job bookmarks does not protect the arguments.
      fr: |
        Les arguments de tâche ne sont pas un magasin d'informations d'identification avec rotation, et le chiffrement des signets de tâche ne protège pas les arguments.
    d:
      en: |
        Parameter Store has no built-in rotation, and the password field of a connection takes the password itself, not a parameter name.
      fr: |
        Parameter Store n'a pas de rotation intégrée, et le champ de mot de passe d'une connexion attend le mot de passe lui-même, pas un nom de paramètre.
references:
  - title: Storing connection credentials in AWS Secrets Manager
    url: https://docs.aws.amazon.com/glue/latest/dg/connection-properties-secrets-manager.html
  - title: AWS Glue connection properties
    url: https://docs.aws.amazon.com/glue/latest/dg/connection-properties.html
