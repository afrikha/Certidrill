id: deac01-4b-xacct-rds-snapshot
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's operational Amazon RDS for PostgreSQL database is encrypted with the default AWS KMS key for Amazon RDS. The analytics team works in another AWS account and must restore a copy of the database from a snapshot in that account every month. The data must stay encrypted at every step.

    Which solution will meet these requirements?
  fr: |
    La base de données opérationnelle Amazon RDS for PostgreSQL d'AnyCompany est chiffrée avec la clé AWS KMS par défaut d'Amazon RDS. L'équipe d'analytique travaille dans un autre compte AWS et doit restaurer chaque mois une copie de la base de données à partir d'un instantané dans ce compte. Les données doivent rester chiffrées à chaque étape.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Share the encrypted snapshot directly with the analytics account, and restore it there by using the default RDS key of that account.", fr: "Partager directement l'instantané chiffré avec le compte d'analytique, et l'y restaurer à l'aide de la clé RDS par défaut de ce compte." } }
    - { id: b, text: { en: "Mark the encrypted snapshot as public, and restore it from the analytics account with a key that belongs to that account.", fr: "Rendre l'instantané chiffré public, et le restaurer depuis le compte d'analytique avec une clé qui appartient à ce compte." } }
    - { id: c, text: { en: "Add the analytics account to the key policy of the default RDS key, and then share the encrypted snapshot with it.", fr: "Ajouter le compte d'analytique à la politique de clé de la clé RDS par défaut, puis lui partager l'instantané chiffré." } }
    - { id: d, text: { en: "Copy the snapshot with a customer managed key shared with the analytics account, share the copy, and copy it there with a local key.", fr: "Copier l'instantané avec une clé gérée par le client partagée avec le compte d'analytique, partager la copie, et la recopier là-bas avec une clé locale." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A snapshot encrypted with the default KMS key of the sharing account cannot be shared. Copying it with a customer managed key that grants access to the target account makes it shareable, and the target account then copies the shared snapshot with a key that it owns."
    fr: "Un instantané chiffré avec la clé KMS par défaut du compte qui partage ne peut pas être partagé. Le copier avec une clé gérée par le client qui accorde l'accès au compte cible le rend partageable, puis le compte cible copie l'instantané partagé avec une clé qui lui appartient."
  options:
    a:
      en: "RDS does not allow sharing a snapshot encrypted with the default KMS key of the source account."
      fr: "RDS ne permet pas de partager un instantané chiffré avec la clé KMS par défaut du compte source."
    b:
      en: "Encrypted snapshots cannot be made public, and public sharing would expose the data to every account."
      fr: "Les instantanés chiffrés ne peuvent pas être rendus publics, et un partage public exposerait les données à tous les comptes."
    c:
      en: "The default RDS key is an AWS managed key whose key policy cannot be changed."
      fr: "La clé RDS par défaut est une clé gérée par AWS dont la politique de clé ne peut pas être modifiée."
references:
  - title: Sharing encrypted snapshots for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/share-encrypted-snapshot.html
