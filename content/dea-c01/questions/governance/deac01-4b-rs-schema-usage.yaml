id: deac01-4b-rs-schema-usage
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer at AnyCompany creates a new schema named `finance` in an Amazon Redshift database and loads 12 tables into it. Members of the database role `fin_readers` run the following query and receive the error `permission denied for schema finance`.

    ```sql
    SELECT * FROM finance.ledger LIMIT 10;
    ```

    The members must be able to read all 12 tables and must not be able to create or drop objects in the schema.

    Which combination of statements will meet these requirements? (Choose two.)
  fr: |
    Un ingénieur des données d'AnyCompany crée un nouveau schéma nommé `finance` dans une base de données Amazon Redshift et y charge 12 tables. Les membres du rôle de base de données `fin_readers` exécutent la requête suivante et reçoivent l'erreur `permission denied for schema finance`.

    ```sql
    SELECT * FROM finance.ledger LIMIT 10;
    ```

    Les membres doivent pouvoir lire les 12 tables et ne doivent pas pouvoir créer ni supprimer d'objets dans le schéma.

    Quelle combinaison d'instructions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "GRANT USAGE ON SCHEMA finance TO ROLE fin_readers;" }
    - { id: b, text: "GRANT CREATE ON SCHEMA finance TO ROLE fin_readers;" }
    - { id: c, text: "GRANT ROLE sys:dba TO ROLE fin_readers;" }
    - { id: d, text: "ALTER DEFAULT PRIVILEGES GRANT SELECT ON TABLES TO ROLE fin_readers;" }
    - { id: e, text: "GRANT SELECT ON ALL TABLES IN SCHEMA finance TO ROLE fin_readers;" }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "For a local Redshift schema, USAGE makes the objects of the schema accessible, and the actions on those objects must be granted separately. USAGE on the schema plus SELECT on all of its existing tables gives read-only access to the 12 tables."
    fr: "Pour un schéma Redshift local, USAGE rend les objets du schéma accessibles, et les actions sur ces objets doivent être accordées séparément. USAGE sur le schéma et SELECT sur toutes ses tables existantes donnent un accès en lecture seule aux 12 tables."
  options:
    b:
      en: "CREATE on the schema lets the members create objects, which the requirements forbid, and does not grant SELECT."
      fr: "CREATE sur le schéma permet aux membres de créer des objets, ce que les exigences interdisent, et n'accorde pas SELECT."
    c:
      en: "sys:dba can create and drop schemas and tables, far beyond read access."
      fr: "sys:dba peut créer et supprimer des schémas et des tables, bien au-delà d'un accès en lecture."
    d:
      en: "Default privileges apply only to tables created later by the user who runs the statement, not to the 12 existing tables, and they do not grant USAGE."
      fr: "Les privilèges par défaut ne s'appliquent qu'aux tables créées plus tard par l'utilisateur qui exécute l'instruction, pas aux 12 tables existantes, et ils n'accordent pas USAGE."
references:
  - title: GRANT
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_GRANT.html
