id: deac01-4c-smus-auto-approval
objective: "4.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data platform project in Amazon SageMaker Catalog publishes dozens of reference data assets, such as country code and currency tables, that contain no sensitive data. Every subscription request to these assets currently waits for manual approval, which delays consumer projects. The sensitive assets that the same project publishes must keep the manual approval step.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un projet de plateforme de données d'Amazon SageMaker Catalog publie des dizaines de ressources de données de référence, comme des tables de codes pays et de devises, qui ne contiennent aucune donnée sensible. Chaque demande d'abonnement à ces ressources attend actuellement une approbation manuelle, ce qui retarde les projets consommateurs. Les ressources sensibles publiées par le même projet doivent conserver l'étape d'approbation manuelle.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Edit the subscription approval setting of the reference data assets so that no approval is required, and republish them.", fr: "Modifier le paramètre d'approbation des abonnements des ressources de données de référence pour qu'aucune approbation ne soit requise, et les republier." } }
    - { id: b, text: { en: "Add the members of every consumer project to the data platform project as owners so that their requests are approved automatically.", fr: "Ajouter les membres de chaque projet consommateur au projet de plateforme de données en tant que propriétaires afin que leurs demandes soient approuvées automatiquement." } }
    - { id: c, text: { en: "Create a metadata enforcement rule that requires a business use metadata form in every subscription request to the domain unit.", fr: "Créer une règle d'application des métadonnées qui exige un formulaire de métadonnées d'usage métier dans chaque demande d'abonnement de l'unité de domaine." } }
    - { id: d, text: { en: "Create an Amazon EventBridge rule that invokes an AWS Lambda function to approve requests for the reference data assets.", fr: "Créer une règle Amazon EventBridge qui invoque une fonction AWS Lambda pour approuver les demandes portant sur les ressources de données de référence." } }
answer: { optionId: a }
explanation:
  correct:
    en: "By default, every published asset requires subscription approval. The setting is defined per asset: turning it off and republishing makes requests to those assets approved automatically, while the sensitive assets keep the default approval step."
    fr: "Par défaut, chaque ressource publiée exige une approbation des abonnements. Ce paramètre se définit par ressource : le désactiver et republier les ressources fait approuver automatiquement les demandes qui les concernent, tandis que les ressources sensibles conservent l'étape d'approbation par défaut."
  options:
    b:
      en: "Owners of the producing project get access to all of its data and tools, every new consumer would have to be added, and their requests to the sensitive assets would be approved automatically too."
      fr: "Les propriétaires du projet producteur accèdent à toutes ses données et à tous ses outils, chaque nouveau consommateur devrait être ajouté, et leurs demandes portant sur les ressources sensibles seraient elles aussi approuvées automatiquement."
    c:
      en: "A subscription request rule adds a metadata requirement to requests; it does not remove the approval step."
      fr: "Une règle de demande d'abonnement ajoute une exigence de métadonnées aux demandes ; elle ne supprime pas l'étape d'approbation."
    d:
      en: "Custom approval code must be built and maintained, which is more overhead than a built-in asset setting."
      fr: "Un code d'approbation personnalisé doit être développé et maintenu, ce qui représente plus de charge qu'un paramètre intégré de la ressource."
references:
