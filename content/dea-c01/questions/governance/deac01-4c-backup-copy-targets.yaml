id: deac01-4c-backup-copy-targets
objective: "4.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Backup in its AWS Organizations member accounts to protect Amazon RDS and Amazon DynamoDB data. A regulation requires that recovery points be copied only to backup vaults in EU Regions. Account administrators create their own backup plans and on-demand copy jobs. The company wants to block every copy to a vault outside the EU, while copies between EU vaults keep working.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS Backup dans ses comptes membres AWS Organizations pour protéger des données Amazon RDS et Amazon DynamoDB. Une réglementation exige que les points de récupération ne soient copiés que vers des coffres de sauvegarde situés dans des Régions de l'UE. Les administrateurs des comptes créent leurs propres plans de sauvegarde et leurs propres tâches de copie à la demande. L'entreprise veut bloquer toute copie vers un coffre situé hors de l'UE, tout en laissant fonctionner les copies entre coffres de l'UE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable AWS Backup Vault Lock in compliance mode on every backup vault in the EU Regions of every member account.", fr: "Activer AWS Backup Vault Lock en mode conformité sur chaque coffre de sauvegarde des Régions de l'UE de chaque compte membre." } }
    - { id: b, text: { en: "Create an AWS Config rule that flags backup plans whose copy actions target vaults outside the EU.", fr: "Créer une règle AWS Config qui signale les plans de sauvegarde dont les actions de copie visent des coffres situés hors de l'UE." } }
    - { id: c, text: { en: "Attach an AWS Organizations backup policy that defines backup plans with copy actions to EU vaults only.", fr: "Attacher une politique de sauvegarde AWS Organizations qui définit des plans de sauvegarde avec des actions de copie vers des coffres de l'UE uniquement." } }
    - { id: d, text: { en: "Attach an SCP that denies backup:CopyFromBackupVault unless backup:CopyTargets matches the ARNs of EU vaults.", fr: "Attacher une SCP qui refuse backup:CopyFromBackupVault sauf si backup:CopyTargets correspond aux ARN de coffres de l'UE." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Backup authorizes copies with the CopyFromBackupVault permission, which supports the backup:CopyTargets condition key (the ARNs of the destination vaults). An SCP that denies this permission when a target vault is not in an EU Region blocks such copies for every principal in the member accounts, whatever plan or on-demand job starts them."
    fr: "AWS Backup autorise les copies avec l'autorisation CopyFromBackupVault, qui prend en charge la clé de condition backup:CopyTargets (les ARN des coffres de destination). Une SCP qui refuse cette autorisation lorsqu'un coffre cible n'est pas dans une Région de l'UE bloque ces copies pour tous les principaux des comptes membres, quel que soit le plan ou la tâche à la demande qui les lance."
  options:
    a:
      en: "Vault Lock protects recovery points against deletion and retention changes; it does not control where copies are sent."
      fr: "Vault Lock protège les points de récupération contre la suppression et les modifications de conservation ; il ne contrôle pas la destination des copies."
    b:
      en: "A Config rule only detects noncompliant plans after the fact and does not cover on-demand copy jobs."
      fr: "Une règle Config détecte seulement les plans non conformes a posteriori et ne couvre pas les tâches de copie à la demande."
    c:
      en: "A backup policy deploys central plans but does not stop administrators from creating their own plans or on-demand copies to other Regions."
      fr: "Une politique de sauvegarde déploie des plans centraux mais n'empêche pas les administrateurs de créer leurs propres plans ou des copies à la demande vers d'autres Régions."
references:
  - title: Actions, resources, and condition keys for AWS Backup
    url: https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsbackup.html
  - title: Creating backup copies across AWS Regions
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html
