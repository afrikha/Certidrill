id: deac01-4c-bedrock-eu-inference
objective: "4.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company in the EU runs a data pipeline in eu-west-3 that sends customer support transcripts to a foundation model in Amazon Bedrock to extract structured fields. A data sovereignty policy requires that inference requests be processed only in EU Regions. During peak hours, the pipeline needs more throughput than a single Region provides.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de l'UE exécute dans eu-west-3 un pipeline de données qui envoie des transcriptions du support client à un modèle de fondation Amazon Bedrock pour en extraire des champs structurés. Une politique de souveraineté des données exige que les requêtes d'inférence ne soient traitées que dans des Régions de l'UE. Aux heures de pointe, le pipeline a besoin de plus de débit qu'une seule Région n'en fournit.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Invoke the model through a global cross-Region inference profile to use capacity in all commercial Regions.", fr: "Invoquer le modèle via un profil d'inférence interrégional global pour utiliser la capacité de toutes les Régions commerciales." } }
    - { id: b, text: { en: "Invoke the model only in eu-west-3, and retry throttled requests with exponential backoff.", fr: "Invoquer le modèle uniquement dans eu-west-3, et relancer les requêtes limitées avec un backoff exponentiel." } }
    - { id: c, text: { en: "Invoke the model through an EU geographic cross-Region inference profile from eu-west-3.", fr: "Invoquer le modèle via un profil d'inférence interrégional géographique EU depuis eu-west-3." } }
    - { id: d, text: { en: "Invoke the model through a US geographic cross-Region inference profile, and store the results in eu-west-3.", fr: "Invoquer le modèle via un profil d'inférence interrégional géographique US, et stocker les résultats dans eu-west-3." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Cross-Region inference spreads requests across Regions to provide more throughput. A geographic inference profile, such as EU, routes requests only within that geography, while a global profile routes them worldwide. CloudTrail logs the requests in the source Region, with the Region that processed each one."
    fr: "L'inférence interrégionale répartit les requêtes entre plusieurs Régions pour offrir plus de débit. Un profil d'inférence géographique, comme EU, n'achemine les requêtes qu'à l'intérieur de cette zone géographique, tandis qu'un profil global les achemine dans le monde entier. CloudTrail journalise les requêtes dans la Région source, avec la Région qui a traité chacune d'elles."
  options:
    a:
      en: "A global profile can route requests to any supported commercial Region worldwide, outside the EU."
      fr: "Un profil global peut acheminer les requêtes vers n'importe quelle Région commerciale prise en charge dans le monde, hors de l'UE."
    b:
      en: "Retrying in one Region keeps the data in the EU but does not add the throughput that the pipeline needs at peak."
      fr: "Relancer dans une seule Région garde les données dans l'UE mais n'apporte pas le débit dont le pipeline a besoin en période de pointe."
    d:
      en: "A US profile processes the transcripts in US Regions, which violates the policy even if the results are stored in the EU."
      fr: "Un profil US traite les transcriptions dans des Régions des États-Unis, ce qui enfreint la politique même si les résultats sont stockés dans l'UE."
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
