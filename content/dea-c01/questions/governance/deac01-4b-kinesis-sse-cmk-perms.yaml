id: deac01-4b-kinesis-sse-cmk-perms
objective: "4.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A security policy requires AnyCompany to encrypt an Amazon Kinesis data stream with a customer managed AWS KMS key, so the company enables server-side encryption with that key. A producer application that runs on Amazon ECS writes records with PutRecords, and an AWS Lambda function reads the stream through an event source mapping. After the change, both the producer and the consumer fail with KMS access errors. The key policy delegates access to IAM policies in the account.

    Which combination of changes will fix the errors with the LEAST privilege? (Choose two.)
  fr: |
    Une politique de sécurité impose à AnyCompany de chiffrer un flux de données Amazon Kinesis avec une clé AWS KMS gérée par le client : l'entreprise active donc le chiffrement côté serveur avec cette clé. Une application productrice qui s'exécute sur Amazon ECS écrit des enregistrements avec PutRecords, et une fonction AWS Lambda lit le flux via un mappage de source d'événements. Après la modification, le producteur et le consommateur échouent tous deux avec des erreurs d'accès KMS. La politique de clé délègue l'accès aux politiques IAM du compte.

    Quelle combinaison de modifications corrige les erreurs avec le MOINDRE privilège ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Allow kms:Encrypt on the key in the IAM role of the ECS task.", fr: "Autoriser kms:Encrypt sur la clé dans le rôle IAM de la tâche ECS." } }
    - { id: b, text: { en: "Allow kms:GenerateDataKey on the key in the IAM role of the ECS task.", fr: "Autoriser kms:GenerateDataKey sur la clé dans le rôle IAM de la tâche ECS." } }
    - { id: c, text: { en: "Allow kms:GenerateDataKey on the key in the execution role of the Lambda function.", fr: "Autoriser kms:GenerateDataKey sur la clé dans le rôle d'exécution de la fonction Lambda." } }
    - { id: d, text: { en: "Switch the stream to the AWS managed key for Kinesis so that no KMS permission is needed.", fr: "Basculer le flux vers la clé gérée par AWS pour Kinesis afin qu'aucune autorisation KMS ne soit nécessaire." } }
    - { id: e, text: { en: "Allow kms:Decrypt on the key in the execution role of the Lambda function.", fr: "Autoriser kms:Decrypt sur la clé dans le rôle d'exécution de la fonction Lambda." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "With a customer managed key, Kinesis stream producers need kms:GenerateDataKey and consumers need kms:Decrypt on the key. Lambda reads the stream with its execution role, so that role needs kms:Decrypt."
    fr: "Avec une clé gérée par le client, les producteurs d'un flux Kinesis ont besoin de kms:GenerateDataKey et les consommateurs de kms:Decrypt sur la clé. Lambda lit le flux avec son rôle d'exécution : ce rôle a besoin de kms:Decrypt."
  options:
    a:
      en: "Kinesis producers need kms:GenerateDataKey, not kms:Encrypt."
      fr: "Les producteurs Kinesis ont besoin de kms:GenerateDataKey, pas de kms:Encrypt."
    c:
      en: "The consumer only decrypts records; GenerateDataKey is the producer's permission."
      fr: "Le consommateur ne fait que déchiffrer les enregistrements ; GenerateDataKey est l'autorisation du producteur."
    d:
      en: "The requirement is a customer managed key; the AWS managed key would not meet it."
      fr: "L'exigence porte sur une clé gérée par le client ; la clé gérée par AWS n'y répondrait pas."
references:
  - title: Permissions to use user-generated KMS keys
    url: https://docs.aws.amazon.com/streams/latest/dev/permissions-user-key-KMS.html
