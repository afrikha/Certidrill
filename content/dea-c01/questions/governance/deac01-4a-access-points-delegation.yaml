id: deac01-4a-access-points-delegation
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's shared Amazon S3 data lake bucket is used by finance, marketing, and data science teams, each with its own prefixes and IAM roles. The single bucket policy has grown to hundreds of statements and is hard to review. The company wants each team's access to be managed in a separate policy without copying data, and the bucket owner wants all access to the bucket to be controlled by those per-team policies.

    Which solution will meet these requirements?
  fr: |
    Le compartiment Amazon S3 partagé du lac de données d'une entreprise est utilisé par les équipes finance, marketing et science des données, chacune avec ses propres préfixes et rôles IAM. L'unique politique de compartiment compte désormais des centaines d'instructions et est difficile à vérifier. L'entreprise veut que l'accès de chaque équipe soit géré dans une politique distincte sans copier les données, et le propriétaire du compartiment veut que tout accès au compartiment soit contrôlé par ces politiques par équipe.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an S3 access point with its own policy for each team, and make the bucket policy delegate access control to access points.", fr: "Créer pour chaque équipe un point d'accès S3 doté de sa propre politique, et faire déléguer le contrôle d'accès aux points d'accès par la politique de compartiment." } }
    - { id: b, text: { en: "Create a bucket for each team with its own bucket policy, and copy each team's prefixes to its bucket with S3 Replication rules.", fr: "Créer un compartiment par équipe avec sa propre politique de compartiment, et copier les préfixes de chaque équipe dans son compartiment avec des règles S3 Replication." } }
    - { id: c, text: { en: "Split the bucket policy into three bucket policies, one for each team's role and prefixes, and attach all three policies to the bucket.", fr: "Scinder la politique de compartiment en trois politiques de compartiment, une pour le rôle et les préfixes de chaque équipe, et attacher les trois politiques au compartiment." } }
    - { id: d, text: { en: "Replace the bucket policy with object ACLs that grant each team's IAM role access to the objects in its prefixes.", fr: "Remplacer la politique de compartiment par des ACL d'objet qui accordent au rôle IAM de chaque équipe l'accès aux objets de ses préfixes." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each access point has its own policy, so each team's permissions are written and reviewed separately on the same data. AWS recommends a bucket policy that allows access through access points owned by the bucket owner's account (s3:DataAccessPointAccount condition), so that all access is controlled by the access point policies.
    fr: |
      Chaque point d'accès a sa propre politique : les autorisations de chaque équipe sont écrites et vérifiées séparément, sur les mêmes données. AWS recommande une politique de compartiment qui autorise l'accès par les points d'accès appartenant au compte du propriétaire du compartiment (condition s3:DataAccessPointAccount), afin que tout accès soit contrôlé par les politiques des points d'accès.
  options:
    b:
      en: |
        Separate buckets require copying the data, which the company wants to avoid, and add storage and replication costs.
      fr: |
        Des compartiments distincts imposent de copier les données, ce que l'entreprise veut éviter, et ajoutent des coûts de stockage et de réplication.
    c:
      en: |
        A bucket has only one bucket policy, so the statements cannot be split into several policies on the same bucket.
      fr: |
        Un compartiment n'a qu'une seule politique de compartiment : les instructions ne peuvent pas être réparties en plusieurs politiques sur le même compartiment.
    d:
      en: |
        ACLs grant access to AWS accounts or predefined groups, not to IAM roles, and AWS recommends keeping ACLs disabled.
      fr: |
        Les ACL accordent l'accès à des comptes AWS ou à des groupes prédéfinis, pas à des rôles IAM, et AWS recommande de laisser les ACL désactivées.
references:
  - title: Configuring IAM policies for using access points
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points-policies.html
