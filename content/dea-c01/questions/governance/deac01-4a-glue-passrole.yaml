id: deac01-4a-glue-passrole
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer has the AWSGlueConsoleFullAccess managed policy and no other permissions. The engineer runs the AWS CLI command aws glue create-job with the --role parameter set to an existing role named etl-sales-job, whose trust policy allows AWS Glue. The call fails with an AccessDenied error for iam:PassRole. The company follows the principle of least privilege.

    Which two actions will each resolve the error? (Choose two.)
  fr: |
    Un ingénieur des données dispose de la politique gérée AWSGlueConsoleFullAccess et d'aucune autre autorisation. Il exécute la commande AWS CLI aws glue create-job avec le paramètre --role défini sur un rôle existant nommé etl-sales-job, dont la politique d'approbation autorise AWS Glue. L'appel échoue avec une erreur AccessDenied pour iam:PassRole. L'entreprise applique le principe du moindre privilège.

    Quelles sont les deux actions qui résolvent chacune l'erreur ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach a policy to the engineer that allows iam:PassRole on all resources, with no condition.", fr: "Attacher à l'ingénieur une politique qui autorise iam:PassRole sur toutes les ressources, sans condition." } }
    - { id: b, text: { en: "Attach a policy to the engineer that allows iam:PassRole on the etl-sales-job role ARN, limited to AWS Glue.", fr: "Attacher à l'ingénieur une politique qui autorise iam:PassRole sur l'ARN du rôle etl-sales-job, limitée à AWS Glue." } }
    - { id: c, text: { en: "Attach a policy to the engineer that allows sts:AssumeRole on the ARN of the etl-sales-job role.", fr: "Attacher à l'ingénieur une politique qui autorise sts:AssumeRole sur l'ARN du rôle etl-sales-job." } }
    - { id: d, text: { en: "Have an administrator create a copy of the job role whose name starts with AWSGlueServiceRole, and use the copy for the job.", fr: "Faire créer par un administrateur une copie du rôle de la tâche dont le nom commence par AWSGlueServiceRole, et utiliser cette copie pour la tâche." } }
    - { id: e, text: { en: "Add the engineer's IAM principal to the trust policy of the etl-sales-job role, next to AWS Glue.", fr: "Ajouter le principal IAM de l'ingénieur à la politique d'approbation du rôle etl-sales-job, à côté d'AWS Glue." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Giving a role to a service requires iam:PassRole on that role. AWSGlueConsoleFullAccess already allows iam:PassRole to glue.amazonaws.com for roles whose names start with AWSGlueServiceRole, so a copy of the role with such a name works; otherwise, a policy allowing iam:PassRole on the exact role ARN, limited to AWS Glue, grants only what is needed.
    fr: |
      Confier un rôle à un service exige iam:PassRole sur ce rôle. AWSGlueConsoleFullAccess autorise déjà iam:PassRole vers glue.amazonaws.com pour les rôles dont le nom commence par AWSGlueServiceRole : une copie du rôle portant un tel nom fonctionne. Sinon, une politique qui autorise iam:PassRole sur l'ARN exact du rôle, limitée à AWS Glue, n'accorde que le nécessaire.
  options:
    a:
      en: |
        iam:PassRole on every resource lets the engineer pass any role, including privileged ones, which breaks least privilege.
      fr: |
        iam:PassRole sur toutes les ressources permet à l'ingénieur de transmettre n'importe quel rôle, y compris des rôles privilégiés, ce qui contredit le moindre privilège.
    c:
      en: |
        Assuming the role is a different action; creating the job checks iam:PassRole, which remains denied.
      fr: |
        Assumer le rôle est une autre action ; la création de la tâche vérifie iam:PassRole, qui reste refusé.
    e:
      en: |
        The trust policy controls who can assume the role; it does not grant the engineer permission to pass it to AWS Glue.
      fr: |
        La politique d'approbation contrôle qui peut assumer le rôle ; elle n'accorde pas à l'ingénieur l'autorisation de le transmettre à AWS Glue.
references:
  - title: AWSGlueConsoleFullAccess
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSGlueConsoleFullAccess.html
  - title: "Step 2: Create an IAM role for AWS Glue"
    url: https://docs.aws.amazon.com/glue/latest/dg/create-an-iam-role.html
