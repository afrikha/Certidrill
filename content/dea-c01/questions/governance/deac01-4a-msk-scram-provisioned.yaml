id: deac01-4a-msk-scram-provisioned
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs self-managed Apache Kafka on Amazon EC2 instances. About 200 producer and consumer applications authenticate to Kafka with SASL/SCRAM user names and passwords, and the company cannot change the authentication settings of these clients during the migration. The company wants AWS to manage the Kafka brokers and wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute Apache Kafka en mode autogéré sur des instances Amazon EC2. Environ 200 applications productrices et consommatrices s'authentifient auprès de Kafka avec des noms d'utilisateur et mots de passe SASL/SCRAM, et l'entreprise ne peut pas modifier les paramètres d'authentification de ces clients pendant la migration. L'entreprise veut qu'AWS gère les brokers Kafka et veut la charge opérationnelle la PLUS FAIBLE.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Migrate to an Amazon MSK provisioned cluster with SASL/SCRAM authentication and credentials in AWS Secrets Manager secrets.", fr: "Migrer vers un cluster provisionné Amazon MSK avec l'authentification SASL/SCRAM et des informations d'identification dans des secrets AWS Secrets Manager." } }
    - { id: b, text: { en: "Migrate to an Amazon MSK Serverless cluster and map each SCRAM user to an IAM role.", fr: "Migrer vers un cluster Amazon MSK Serverless et associer chaque utilisateur SCRAM à un rôle IAM." } }
    - { id: c, text: { en: "Migrate to Amazon Kinesis Data Streams in on-demand mode and use the Kinesis Producer Library in the producers.", fr: "Migrer vers Amazon Kinesis Data Streams en mode à la demande et utiliser la Kinesis Producer Library dans les producteurs." } }
    - { id: d, text: { en: "Keep Kafka on EC2 and move the brokers into an Auto Scaling group of larger instances across three Availability Zones.", fr: "Conserver Kafka sur EC2 et placer les brokers dans un groupe Auto Scaling d'instances plus grandes réparties sur trois zones de disponibilité." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Amazon MSK provisioned clusters support sign-in credentials authentication (SASL/SCRAM) with the user credentials stored in Secrets Manager, so the clients keep their current authentication while AWS manages the brokers. MSK syncs the credentials from the associated secrets.
    fr: |
      Les clusters provisionnés Amazon MSK prennent en charge l'authentification par informations de connexion (SASL/SCRAM) avec des informations d'identification stockées dans Secrets Manager : les clients conservent leur authentification actuelle pendant qu'AWS gère les brokers. MSK synchronise les informations d'identification depuis les secrets associés.
  options:
    b:
      en: |
        MSK Serverless requires IAM access control for all clusters, so every client would have to change its authentication settings.
      fr: |
        MSK Serverless exige le contrôle d'accès IAM pour tous les clusters : chaque client devrait modifier ses paramètres d'authentification.
    c:
      en: |
        Kinesis Data Streams does not speak the Kafka protocol, so every application would need code and authentication changes.
      fr: |
        Kinesis Data Streams ne parle pas le protocole Kafka : chaque application aurait besoin de modifications de code et d'authentification.
    d:
      en: |
        The brokers would remain self-managed, so AWS would not manage them.
      fr: |
        Les brokers resteraient autogérés : AWS ne les gérerait pas.
references:
  - title: What is MSK Serverless?
    url: https://docs.aws.amazon.com/msk/latest/developerguide/serverless.html
  - title: Sign-in credentials authentication with AWS Secrets Manager
    url: https://docs.aws.amazon.com/msk/latest/developerguide/msk-password.html
