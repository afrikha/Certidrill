id: deac01-4b-lp-athena-analyst
objective: "4.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's analysts must run SELECT queries with Amazon Athena on the `web_logs` table of the `logs_db` database in the AWS Glue Data Catalog. They must use the `analytics` workgroup, which stores query results in `s3://example-athena-results/analytics/`. The tables are not governed by AWS Lake Formation. The security team requires a custom policy that follows the principle of least privilege.

    Which combination of permissions should the policy grant? (Choose three.)
  fr: |
    Les analystes d'AnyCompany doivent exécuter des requêtes SELECT avec Amazon Athena sur la table `web_logs` de la base de données `logs_db` du AWS Glue Data Catalog. Ils doivent utiliser le groupe de travail `analytics`, qui stocke les résultats des requêtes dans `s3://example-athena-results/analytics/`. Les tables ne sont pas gouvernées par AWS Lake Formation. L'équipe de sécurité exige une politique personnalisée qui respecte le principe du moindre privilège.

    Quelle combinaison d'autorisations la politique doit-elle accorder ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "athena:StartQueryExecution, athena:GetQueryExecution, and athena:GetQueryResults on the ARN of the analytics workgroup", fr: "athena:StartQueryExecution, athena:GetQueryExecution et athena:GetQueryResults sur l'ARN du groupe de travail analytics" } }
    - { id: b, text: { en: "athena:* on all workgroups so that the analysts can choose any workgroup", fr: "athena:* sur tous les groupes de travail afin que les analystes puissent choisir n'importe quel groupe" } }
    - { id: c, text: { en: "glue:GetDatabase, glue:GetTable, and glue:GetPartitions on the Data Catalog, logs_db database, and web_logs table ARNs", fr: "glue:GetDatabase, glue:GetTable et glue:GetPartitions sur les ARN du Data Catalog, de la base logs_db et de la table web_logs" } }
    - { id: d, text: { en: "glue:GetTable on the web_logs table ARN only, without the catalog or database ARNs", fr: "glue:GetTable sur l'ARN de la table web_logs uniquement, sans les ARN du catalogue ni de la base de données" } }
    - { id: e, text: { en: "Read access to the S3 objects of web_logs, and read and write access to the analytics query result prefix", fr: "Accès en lecture aux objets S3 de web_logs, et accès en lecture et en écriture au préfixe de résultats de requêtes analytics" } }
    - { id: f, text: { en: "s3:PutObject and s3:DeleteObject on the S3 prefix that stores the web_logs data", fr: "s3:PutObject et s3:DeleteObject sur le préfixe S3 qui stocke les données de web_logs" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "Running a query needs the Athena query actions on the workgroup resource, Glue read actions on the table and on all its ancestors (catalog and database), and S3 access: read on the table data and write on the result location. Each permission is scoped to the one workgroup, table, and prefixes in use."
    fr: "Exécuter une requête exige les actions de requête Athena sur la ressource du groupe de travail, les actions de lecture Glue sur la table et tous ses ancêtres (catalogue et base de données), et un accès S3 : lecture sur les données de la table et écriture sur l'emplacement des résultats. Chaque autorisation est limitée au groupe de travail, à la table et aux préfixes utilisés."
  options:
    b:
      en: "athena:* on all workgroups allows creating, changing, and deleting workgroups and using other teams' workgroups."
      fr: "athena:* sur tous les groupes de travail permet de créer, modifier et supprimer des groupes de travail et d'utiliser ceux d'autres équipes."
    d:
      en: "Athena needs the Glue permission on the table and on all its ancestors in the Data Catalog, so the table ARN alone fails."
      fr: "Athena a besoin de l'autorisation Glue sur la table et sur tous ses ancêtres du Data Catalog : l'ARN de la table seul échoue."
    f:
      en: "SELECT queries never write to or delete the source data, so these actions exceed what the analysts need."
      fr: "Les requêtes SELECT n'écrivent ni ne suppriment jamais les données sources : ces actions dépassent les besoins des analystes."
references:
  - title: Configure access to databases and tables in the AWS Glue Data Catalog
    url: https://docs.aws.amazon.com/athena/latest/ug/fine-grained-access-to-glue-resources.html
  - title: Use IAM policies to control workgroup access
    url: https://docs.aws.amazon.com/athena/latest/ug/workgroups-iam-policy.html
