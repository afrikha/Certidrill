id: deac01-4a-firehose-redshift-cidr
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company delivers clickstream records to an Amazon Redshift provisioned cluster through an Amazon Data Firehose stream. The cluster is in a VPC and is publicly accessible. Its security group allows inbound traffic only from the company's VPN address range. Firehose reports that it cannot connect to the cluster. The company must allow only the traffic that the delivery needs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution livre des enregistrements de parcours de navigation à un cluster provisionné Amazon Redshift au moyen d'un flux Amazon Data Firehose. Le cluster se trouve dans un VPC et est accessible publiquement. Son groupe de sécurité n'autorise le trafic entrant que depuis la plage d'adresses du VPN de l'entreprise. Firehose signale qu'il ne peut pas se connecter au cluster. L'entreprise ne doit autoriser que le trafic dont la livraison a besoin.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an inbound rule to the cluster's security group for the cluster port from the Firehose CIDR block of the Region.", fr: "Ajouter au groupe de sécurité du cluster une règle entrante pour le port du cluster depuis le bloc CIDR de Firehose pour la Région." } }
    - { id: b, text: { en: "Add an outbound rule to the cluster's security group for the cluster port to the Firehose CIDR block of the Region.", fr: "Ajouter au groupe de sécurité du cluster une règle sortante pour le port du cluster vers le bloc CIDR de Firehose pour la Région." } }
    - { id: c, text: { en: "Create an interface VPC endpoint for Amazon Data Firehose in the cluster's VPC.", fr: "Créer un point de terminaison d'interface VPC pour Amazon Data Firehose dans le VPC du cluster." } }
    - { id: d, text: { en: "Add an inbound rule to the cluster's security group for the cluster port from 0.0.0.0/0.", fr: "Ajouter au groupe de sécurité du cluster une règle entrante pour le port du cluster depuis 0.0.0.0/0." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When the Redshift cluster is in a VPC, it must be publicly accessible, and you must unblock the Firehose IP addresses, which form one CIDR block for each Region. An inbound rule for that block on the cluster port lets Firehose connect without opening the cluster to anyone else.
    fr: |
      Quand le cluster Redshift se trouve dans un VPC, il doit être accessible publiquement, et il faut débloquer les adresses IP de Firehose, qui forment un bloc CIDR par Région. Une règle entrante pour ce bloc sur le port du cluster permet à Firehose de se connecter sans ouvrir le cluster à quiconque d'autre.
  options:
    b:
      en: |
        Firehose opens the connection to the cluster, so the traffic is inbound for the cluster's security group; an outbound rule does not admit it.
      fr: |
        C'est Firehose qui ouvre la connexion vers le cluster : le trafic est entrant pour le groupe de sécurité du cluster, et une règle sortante ne l'admet pas.
    c:
      en: |
        An interface endpoint lets clients in the VPC call the Firehose API privately; it does not carry Firehose's delivery connections to the cluster.
      fr: |
        Un point de terminaison d'interface permet aux clients du VPC d'appeler l'API Firehose en privé ; il ne transporte pas les connexions de livraison de Firehose vers le cluster.
    d:
      en: |
        A rule from 0.0.0.0/0 opens the cluster port to the whole internet, far more than the delivery needs.
      fr: |
        Une règle depuis 0.0.0.0/0 ouvre le port du cluster à tout Internet, bien plus que ce dont la livraison a besoin.
references:
  - title: Controlling access with Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/controlling-access.html
