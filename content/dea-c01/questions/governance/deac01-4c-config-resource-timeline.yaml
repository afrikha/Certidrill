id: deac01-4c-config-resource-timeline
objective: "4.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The configuration of a data lake bucket was changed several times during the last month, and a dataset briefly became readable by another account. AWS Config records all resource types in the account. The data governance team must see each version of the bucket's complete configuration over time, including its policy, encryption, versioning, and public access settings, and identify the API calls that made each change.

    Which solution will meet these requirements?
  fr: |
    La configuration d'un compartiment du lac de données a été modifiée plusieurs fois au cours du dernier mois, et un jeu de données est brièvement devenu lisible par un autre compte. AWS Config enregistre tous les types de ressources du compte. L'équipe de gouvernance des données doit voir chaque version de la configuration complète du compartiment au fil du temps, y compris sa politique, son chiffrement, sa gestion des versions et ses paramètres d'accès public, et identifier les appels d'API à l'origine de chaque modification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run IAM Access Analyzer on the bucket to list the external accounts and principals that have access to it.", fr: "Exécuter IAM Access Analyzer sur le compartiment pour lister les comptes et principaux externes qui y ont accès." } }
    - { id: b, text: { en: "Use the S3 Storage Lens dashboard to view the configuration metrics of the bucket for the last month.", fr: "Utiliser le tableau de bord S3 Storage Lens pour consulter les métriques de configuration du compartiment sur le dernier mois." } }
    - { id: c, text: { en: "Search the CloudTrail event history for the PutBucketPolicy events of the bucket during the last month.", fr: "Rechercher dans l'historique des événements CloudTrail les événements PutBucketPolicy du compartiment au cours du dernier mois." } }
    - { id: d, text: { en: "Open the AWS Config resource timeline of the bucket to view its configuration items and related CloudTrail events.", fr: "Ouvrir la chronologie de ressource AWS Config du compartiment pour consulter ses éléments de configuration et les événements CloudTrail associés." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Config captures each change to a recorded resource as a configuration item. The resource timeline shows these items over time, with the full configuration and relationships at each point, and can also display the related CloudTrail events and compliance changes; the same history is available with get-resource-config-history."
    fr: "AWS Config capture chaque modification d'une ressource enregistrée sous forme d'élément de configuration. La chronologie de ressource affiche ces éléments au fil du temps, avec la configuration complète et les relations à chaque instant, et peut aussi afficher les événements CloudTrail associés et les changements de conformité ; le même historique est disponible avec get-resource-config-history."
  options:
    a:
      en: "Access Analyzer reports the access that the current policies grant; it does not show past versions of the bucket configuration."
      fr: "Access Analyzer signale l'accès accordé par les politiques actuelles ; il ne montre pas les versions passées de la configuration du compartiment."
    b:
      en: "Storage Lens provides aggregated usage and activity metrics, not the configuration history of a bucket."
      fr: "Storage Lens fournit des métriques agrégées d'utilisation et d'activité, pas l'historique de configuration d'un compartiment."
    c:
      en: "CloudTrail shows individual API calls, such as policy updates, but not the complete configuration of the bucket at each point in time."
      fr: "CloudTrail montre des appels d'API individuels, comme les mises à jour de politique, mais pas la configuration complète du compartiment à chaque instant."
references:
  - title: Viewing Compliance History for your AWS Resources with AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/view-manage-resource-console.html
