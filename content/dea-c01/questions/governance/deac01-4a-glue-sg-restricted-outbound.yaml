id: deac01-4a-glue-sg-restricted-outbound
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue ETL job uses a JDBC connection to an Amazon RDS for MySQL DB instance. The connection and the DB instance share the security group sg-db, which has a self-referencing inbound rule for all TCP ports. The job reads Amazon S3 through an S3 gateway endpoint. To meet a new security standard, an administrator removed the outbound rule of sg-db that allowed all traffic, and the job now fails. The company wants the most restrictive outbound rules that let the job run.

    Which combination of outbound rules should the company add to sg-db? (Choose two.)
  fr: |
    Une tâche ETL AWS Glue utilise une connexion JDBC vers une instance de base de données Amazon RDS for MySQL. La connexion et l'instance partagent le groupe de sécurité sg-db, qui a une règle entrante autoréférencée pour tous les ports TCP. La tâche lit Amazon S3 par un point de terminaison de passerelle S3. Pour respecter une nouvelle norme de sécurité, un administrateur a supprimé la règle sortante de sg-db qui autorisait tout le trafic, et la tâche échoue désormais. L'entreprise veut les règles sortantes les plus restrictives qui permettent à la tâche de s'exécuter.

    Quelle combinaison de règles sortantes l'entreprise doit-elle ajouter à sg-db ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "All TCP, ports 0-65535, with sg-db as the destination", fr: "Tout le TCP, ports 0-65535, avec sg-db comme destination" } }
    - { id: b, text: { en: "All traffic, with 0.0.0.0/0 as the destination", fr: "Tout le trafic, avec 0.0.0.0/0 comme destination" } }
    - { id: c, text: { en: "HTTPS, port 443, with the CIDR block of the VPC as the destination", fr: "HTTPS, port 443, avec le bloc CIDR du VPC comme destination" } }
    - { id: d, text: { en: "HTTPS, port 443, with the managed prefix list of the S3 gateway endpoint as the destination", fr: "HTTPS, port 443, avec la liste de préfixes gérée du point de terminaison de passerelle S3 comme destination" } }
    - { id: e, text: { en: "MySQL, port 3306, with 0.0.0.0/0 as the destination", fr: "MySQL, port 3306, avec 0.0.0.0/0 comme destination" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      When outbound traffic is restricted, AWS Glue needs a self-referencing outbound rule for all TCP ports so that its components and the DB instance in sg-db can communicate. For S3 through a gateway endpoint, an HTTPS rule whose destination is the endpoint's managed prefix list lets the job reach Amazon S3 and nothing else.
    fr: |
      Quand le trafic sortant est restreint, AWS Glue a besoin d'une règle sortante autoréférencée pour tous les ports TCP afin que ses composants et l'instance de base de données de sg-db communiquent. Pour S3 par un point de terminaison de passerelle, une règle HTTPS dont la destination est la liste de préfixes gérée du point de terminaison permet à la tâche d'atteindre Amazon S3 et rien d'autre.
  options:
    b:
      en: |
        This rule restores the original unrestricted outbound access, which is not the most restrictive set of rules.
      fr: |
        Cette règle rétablit l'accès sortant sans restriction d'origine, ce qui n'est pas l'ensemble de règles le plus restrictif.
    c:
      en: |
        Traffic to Amazon S3 through a gateway endpoint goes to S3 addresses, which the prefix list represents, not to addresses of the VPC CIDR block.
      fr: |
        Le trafic vers Amazon S3 par un point de terminaison de passerelle va vers des adresses S3, que représente la liste de préfixes, et non vers des adresses du bloc CIDR du VPC.
    e:
      en: |
        This rule opens MySQL to every destination and still does not cover the communication between Glue components or the access to S3.
      fr: |
        Cette règle ouvre MySQL vers toutes les destinations et ne couvre toujours ni la communication entre les composants Glue ni l'accès à S3.
references:
  - title: Setting up Amazon VPC for JDBC connections to Amazon RDS data stores from AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/setup-vpc-for-glue-access.html
