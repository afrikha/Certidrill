id: deac01-4a-redshift-sg-lambda-source
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an Amazon Redshift provisioned cluster in private subnets. A new AWS Lambda function that is attached to the same VPC with the security group sg-lambda must load data into the cluster through the cluster port. The cluster's security group, sg-redshift, has a single inbound rule for a BI server. Only the function must gain access, and the rule must keep working when the function's network interfaces receive new IP addresses.

    Which change will meet these requirements?
  fr: |
    Une entreprise exécute un cluster provisionné Amazon Redshift dans des sous-réseaux privés. Une nouvelle fonction AWS Lambda attachée au même VPC avec le groupe de sécurité sg-lambda doit charger des données dans le cluster par le port du cluster. Le groupe de sécurité du cluster, sg-redshift, a une seule règle entrante, pour un serveur BI. Seule la fonction doit obtenir l'accès, et la règle doit continuer à fonctionner quand les interfaces réseau de la fonction reçoivent de nouvelles adresses IP.

    Quelle modification répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an outbound rule to sg-redshift that allows the ephemeral ports to sg-lambda.", fr: "Ajouter à sg-redshift une règle sortante qui autorise les ports éphémères vers sg-lambda." } }
    - { id: b, text: { en: "Add an inbound rule to sg-redshift for the cluster port whose source is the CIDR blocks of the function's subnets.", fr: "Ajouter à sg-redshift une règle entrante pour le port du cluster dont la source est les blocs CIDR des sous-réseaux de la fonction." } }
    - { id: c, text: { en: "Add an inbound rule to sg-redshift for the cluster port whose source is the security group sg-lambda.", fr: "Ajouter à sg-redshift une règle entrante pour le port du cluster dont la source est le groupe de sécurité sg-lambda." } }
    - { id: d, text: { en: "Add an inbound rule to sg-lambda for the cluster port whose source is the security group sg-redshift.", fr: "Ajouter à sg-lambda une règle entrante pour le port du cluster dont la source est le groupe de sécurité sg-redshift." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A rule whose source is a security group applies to every network interface associated with that group, whatever its private IP address, so only resources in sg-lambda reach the cluster port. Security groups are stateful: the responses from the cluster are allowed back without any extra rule.
    fr: |
      Une règle dont la source est un groupe de sécurité s'applique à chaque interface réseau associée à ce groupe, quelle que soit son adresse IP privée : seules les ressources de sg-lambda atteignent le port du cluster. Les groupes de sécurité sont avec état : les réponses du cluster sont autorisées en retour sans règle supplémentaire.
  options:
    a:
      en: |
        Security groups are stateful, so response traffic needs no outbound rule; without an inbound rule, the function's connections are still refused.
      fr: |
        Les groupes de sécurité sont avec état : le trafic de réponse n'a pas besoin de règle sortante, et sans règle entrante, les connexions de la fonction sont toujours refusées.
    b:
      en: |
        Subnet CIDR blocks allow every resource in those subnets, not only the function, which fails the requirement.
      fr: |
        Les blocs CIDR des sous-réseaux autorisent toutes les ressources de ces sous-réseaux, pas seulement la fonction, ce qui ne respecte pas l'exigence.
    d:
      en: |
        This rule allows traffic from the cluster to the function, which is the wrong direction; the cluster's security group still blocks the function's connections.
      fr: |
        Cette règle autorise le trafic du cluster vers la fonction, soit le mauvais sens ; le groupe de sécurité du cluster bloque toujours les connexions de la fonction.
references:
  - title: Security group rules
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html
  - title: Control traffic to your AWS resources using security groups
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
