id: deac01-4c-datashare-grant-namespace
objective: "4.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer ran the following statements as a superuser on an Amazon Redshift producer cluster. A consumer Amazon Redshift Serverless workgroup in the same AWS account must be able to create a database from the datashare and read the finance tables.

    ```sql
    CREATE DATASHARE finance_share;
    ALTER DATASHARE finance_share ADD SCHEMA finance;
    ALTER DATASHARE finance_share ADD ALL TABLES IN SCHEMA finance;
    ```

    Which statement should the data engineer run next on the producer cluster?
  fr: |
    Un ingénieur des données a exécuté les instructions suivantes en tant que superutilisateur sur un cluster producteur Amazon Redshift. Un groupe de travail consommateur Amazon Redshift Serverless du même compte AWS doit pouvoir créer une base de données à partir de l'unité de partage des données (datashare) et lire les tables financières.

    ```sql
    CREATE DATASHARE finance_share;
    ALTER DATASHARE finance_share ADD SCHEMA finance;
    ALTER DATASHARE finance_share ADD ALL TABLES IN SCHEMA finance;
    ```

    Quelle instruction l'ingénieur des données doit-il exécuter ensuite sur le cluster producteur ?
body:
  options:
    - { id: a, text: "`GRANT SELECT ON ALL TABLES IN SCHEMA finance TO ROLE consumer_role;`" }
    - { id: b, text: "`GRANT USAGE ON SCHEMA finance TO PUBLIC;`" }
    - { id: c, text: "`GRANT USAGE ON DATASHARE finance_share TO NAMESPACE 'a1b2c3d4-5678-90ab-cdef-111122223333';`" }
    - { id: d, text: "`CREATE DATABASE finance_db FROM DATASHARE finance_share OF NAMESPACE 'a1b2c3d4-5678-90ab-cdef-111122223333';`" }
answer: { optionId: c }
explanation:
  correct:
    en: "After the objects are added, the producer grants usage on the datashare to the consumer namespace, one namespace per GRANT statement. A namespace consumer in the same account needs no authorization step, so a consumer superuser can then run CREATE DATABASE ... FROM DATASHARE ... OF NAMESPACE with the producer namespace."
    fr: "Une fois les objets ajoutés, le producteur accorde l'utilisation de l'unité de partage des données à l'espace de noms consommateur, un espace de noms par instruction GRANT. Un consommateur de type espace de noms dans le même compte ne nécessite pas d'étape d'autorisation : un superutilisateur du consommateur peut ensuite exécuter CREATE DATABASE ... FROM DATASHARE ... OF NAMESPACE avec l'espace de noms du producteur."
  options:
    a:
      en: "This grants a privilege to a role of the producer database only; it gives the consumer workgroup no access to the datashare."
      fr: "Cette instruction accorde un privilège à un rôle de la base de données du producteur uniquement ; elle ne donne au groupe de travail consommateur aucun accès à l'unité de partage des données."
    b:
      en: "This grants schema usage to the users of the producer database, not to another namespace."
      fr: "Cette instruction accorde l'utilisation du schéma aux utilisateurs de la base de données du producteur, pas à un autre espace de noms."
    d:
      en: "A consumer database is created on the consumer, with the producer namespace in the OF NAMESPACE clause, and only after usage has been granted."
      fr: "Une base de données consommatrice se crée sur le consommateur, avec l'espace de noms du producteur dans la clause OF NAMESPACE, et seulement après l'octroi de l'utilisation."
references:
  - title: Sharing read access to data within an AWS account
    url: https://docs.aws.amazon.com/redshift/latest/dg/within-account.html
