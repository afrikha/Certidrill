id: deac01-4c-flow-logs-parquet-hourly
objective: "4.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A network analytics team publishes the VPC flow logs of a large VPC to Amazon S3 in the default plain-text format with daily prefixes. Analysts query the logs with Amazon Athena, and most queries target a single hour of traffic. Each query scans a full day of text files, so the queries have become slow and expensive. The team wants to reduce query time and the amount of data scanned without building an ETL pipeline.

    Which combination of changes will meet these requirements? (Choose two.)
  fr: |
    Une équipe d'analyse réseau publie les journaux de flux VPC d'un grand VPC dans Amazon S3, au format texte brut par défaut avec des préfixes quotidiens. Les analystes interrogent les journaux avec Amazon Athena, et la plupart des requêtes portent sur une seule heure de trafic. Chaque requête analyse une journée entière de fichiers texte : les requêtes sont devenues lentes et coûteuses. L'équipe veut réduire la durée des requêtes et la quantité de données analysées sans créer de pipeline ETL.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the maximum aggregation interval of the flow logs from 10 minutes to 1 minute to produce smaller files.", fr: "Faire passer l'intervalle d'agrégation maximal des journaux de flux de 10 minutes à 1 minute pour produire des fichiers plus petits." } }
    - { id: b, text: { en: "Replace the flow logs with new flow logs that use the Apache Parquet log file format.", fr: "Remplacer les journaux de flux par de nouveaux journaux de flux qui utilisent le format de fichier Apache Parquet." } }
    - { id: c, text: { en: "Enable S3 Transfer Acceleration on the destination bucket that receives the flow log files.", fr: "Activer S3 Transfer Acceleration sur le compartiment de destination qui reçoit les fichiers des journaux de flux." } }
    - { id: d, text: { en: "Replace the flow logs with new flow logs that use a custom format with every available field.", fr: "Remplacer les journaux de flux par de nouveaux journaux de flux qui utilisent un format personnalisé avec tous les champs disponibles." } }
    - { id: e, text: { en: "Replace the flow logs with new flow logs that use hourly partitions, and partition the Athena table by hour.", fr: "Remplacer les journaux de flux par de nouveaux journaux de flux qui utilisent des partitions horaires, et partitionner la table Athena par heure." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Flow logs can be delivered to S3 in Apache Parquet, a columnar format that AWS documents as 10 to 100 times faster to query than plain text and smaller once compressed. They can also be partitioned by hour, which speeds up and lowers the cost of queries that target a specific hour, because Athena then reads only that hour's prefix."
    fr: "Les journaux de flux peuvent être livrés dans S3 au format Apache Parquet, un format en colonnes qu'AWS présente comme 10 à 100 fois plus rapide à interroger que le texte brut et plus compact une fois compressé. Ils peuvent aussi être partitionnés par heure, ce qui accélère les requêtes portant sur une heure précise et en réduit le coût, car Athena ne lit alors que le préfixe de cette heure."
  options:
    a:
      en: "A shorter aggregation interval produces more flow log records, which increases the data that each query scans."
      fr: "Un intervalle d'agrégation plus court produit davantage d'enregistrements de journaux de flux, ce qui augmente les données analysées par chaque requête."
    c:
      en: "Transfer Acceleration speeds up uploads over long distances; it does not change how much data Athena scans."
      fr: "Transfer Acceleration accélère les chargements sur de longues distances ; il ne change pas la quantité de données analysées par Athena."
    d:
      en: "Adding every field makes each record larger, so text queries scan even more data."
      fr: "Ajouter tous les champs agrandit chaque enregistrement : les requêtes sur le texte analysent encore plus de données."
references:
  - title: Flow log files
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-s3-path.html
