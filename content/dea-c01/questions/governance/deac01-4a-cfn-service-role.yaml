id: deac01-4a-cfn-service-role
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Data engineers at AnyCompany deploy AWS CloudFormation stacks that create AWS Glue jobs, Glue crawlers, and Amazon Redshift Serverless workgroups. The security team does not want the engineers' own IAM roles to have permissions to create those resources directly. The engineers must only be able to create and update the stacks.

    Which solution will meet these requirements?
  fr: |
    Les ingénieurs des données d'AnyCompany déploient des piles AWS CloudFormation qui créent des tâches AWS Glue, des crawlers Glue et des groupes de travail Amazon Redshift Serverless. L'équipe de sécurité ne veut pas que les rôles IAM des ingénieurs aient eux-mêmes les autorisations de créer ces ressources directement. Les ingénieurs doivent seulement pouvoir créer et mettre à jour les piles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a stack policy to each stack that allows Update:* on the Glue and Redshift resources.", fr: "Ajouter à chaque pile une politique de pile qui autorise Update:* sur les ressources Glue et Redshift." } }
    - { id: b, text: { en: "Grant the engineers cloudformation:* only, so that CloudFormation creates the resources with its own permissions.", fr: "Accorder aux ingénieurs uniquement cloudformation:*, afin que CloudFormation crée les ressources avec ses propres autorisations." } }
    - { id: c, text: { en: "Grant the engineers cloudformation:* and have them acknowledge the CAPABILITY_IAM capability on each deployment.", fr: "Accorder aux ingénieurs cloudformation:* et leur faire reconnaître la capacité CAPABILITY_IAM à chaque déploiement." } }
    - { id: d, text: { en: "Create a CloudFormation service role with the resource permissions, and allow the engineers to pass it with iam:PassRole.", fr: "Créer un rôle de service CloudFormation avec les autorisations sur les ressources, et autoriser les ingénieurs à le transmettre avec iam:PassRole." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A service role is an IAM role that cloudformation.amazonaws.com assumes to call the services in a stack, so the resource permissions live in the role, not in the engineers' policies. The engineers need iam:PassRole for that role, and CloudFormation then uses the role for every operation on the stack.
    fr: |
      Un rôle de service est un rôle IAM que cloudformation.amazonaws.com assume pour appeler les services d'une pile : les autorisations sur les ressources sont dans le rôle, pas dans les politiques des ingénieurs. Les ingénieurs ont besoin d'iam:PassRole pour ce rôle, et CloudFormation utilise ensuite le rôle pour toutes les opérations sur la pile.
  options:
    a:
      en: |
        A stack policy only protects existing stack resources from unintended updates; it grants no permission to create resources.
      fr: |
        Une politique de pile protège seulement les ressources existantes de la pile contre des mises à jour involontaires ; elle n'accorde aucune autorisation de créer des ressources.
    b:
      en: |
        Without a service role, CloudFormation uses a temporary session generated from the caller's credentials, so the stacks fail without the resource permissions.
      fr: |
        Sans rôle de service, CloudFormation utilise une session temporaire générée à partir des informations d'identification de l'appelant : les piles échouent sans les autorisations sur les ressources.
    c:
      en: |
        CAPABILITY_IAM only acknowledges that a template creates IAM resources; it does not give CloudFormation any permissions.
      fr: |
        CAPABILITY_IAM reconnaît seulement qu'un modèle crée des ressources IAM ; cela ne donne aucune autorisation à CloudFormation.
references:
  - title: CloudFormation service role
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-iam-servicerole.html
