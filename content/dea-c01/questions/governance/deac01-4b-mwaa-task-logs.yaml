id: deac01-4b-mwaa-task-logs
objective: "4.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany orchestrates its pipelines with Amazon Managed Workflows for Apache Airflow (Amazon MWAA). When a DAG task fails, engineers cannot find the task's output in Amazon CloudWatch Logs. The company wants CloudWatch Logs to receive the task logs at the WARNING level and above only, to limit cost.

    Which solution will meet these requirements?
  fr: |
    AnyCompany orchestre ses pipelines avec Amazon Managed Workflows for Apache Airflow (Amazon MWAA). Lorsqu'une tâche d'un DAG échoue, les ingénieurs ne trouvent pas sa sortie dans Amazon CloudWatch Logs. L'entreprise veut que CloudWatch Logs reçoive les journaux des tâches au niveau WARNING et au-dessus uniquement, pour limiter les coûts.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Edit the environment's monitoring configuration to enable the Airflow task logs with the WARNING log level.", fr: "Modifier la configuration de surveillance de l'environnement pour activer les journaux de tâches Airflow avec le niveau de journalisation WARNING." } }
    - { id: b, text: { en: "Edit the environment's monitoring configuration to enable the Airflow worker logs with the ERROR log level.", fr: "Modifier la configuration de surveillance de l'environnement pour activer les journaux des workers Airflow avec le niveau de journalisation ERROR." } }
    - { id: c, text: { en: "Edit the environment's monitoring configuration to enable the Airflow task logs with the CRITICAL log level.", fr: "Modifier la configuration de surveillance de l'environnement pour activer les journaux de tâches Airflow avec le niveau de journalisation CRITICAL." } }
    - { id: d, text: { en: "Install the CloudWatch agent on the environment's workers with a plugin, and point it at the Airflow log folder.", fr: "Installer l'agent CloudWatch sur les workers de l'environnement avec un plugin, et le diriger vers le dossier des journaux Airflow." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon MWAA sends each Airflow log type, including task logs, to CloudWatch Logs once it is enabled in the environment's monitoring settings. The chosen log level is a threshold: WARNING sends WARNING, ERROR, and CRITICAL events."
    fr: "Amazon MWAA envoie chaque type de journal Airflow, y compris les journaux de tâches, vers CloudWatch Logs dès qu'il est activé dans les paramètres de surveillance de l'environnement. Le niveau choisi est un seuil : WARNING envoie les événements WARNING, ERROR et CRITICAL."
  options:
    b:
      en: "Worker logs are a different log type from the task logs that the DAG generates, and ERROR would drop WARNING events."
      fr: "Les journaux des workers sont un autre type que les journaux de tâches générés par le DAG, et ERROR écarterait les événements WARNING."
    c:
      en: "CRITICAL sends only critical events, so WARNING and ERROR task output would be missing."
      fr: "CRITICAL n'envoie que les événements critiques : la sortie WARNING et ERROR des tâches manquerait."
    d:
      en: "MWAA is a managed service with built-in CloudWatch integration; adding an agent is unnecessary overhead."
      fr: "MWAA est un service géré avec une intégration CloudWatch intégrée ; ajouter un agent est une charge inutile."
references:
  - title: Accessing Airflow logs in Amazon CloudWatch
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/monitoring-airflow.html
