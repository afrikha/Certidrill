id: deac01-4b-redshift-audit-sql
objective: "4.4.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Analysts at AnyCompany connect to an Amazon Redshift provisioned cluster with JDBC clients. After an unexpected DELETE statement, the security team searches AWS CloudTrail and finds only API calls such as GetClusterCredentials and ModifyCluster. The team must record the text of every SQL statement that runs on the cluster from now on.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Les analystes d'AnyCompany se connectent à un cluster provisionné Amazon Redshift avec des clients JDBC. Après une instruction DELETE inattendue, l'équipe de sécurité recherche dans AWS CloudTrail et ne trouve que des appels d'API comme GetClusterCredentials et ModifyCluster. L'équipe doit désormais enregistrer le texte de chaque instruction SQL exécutée sur le cluster.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on audit logging for the cluster with Amazon CloudWatch Logs or Amazon S3 as the destination.", fr: "Activer la journalisation d'audit du cluster avec Amazon CloudWatch Logs ou Amazon S3 comme destination." } }
    - { id: b, text: { en: "Enable CloudTrail Insights on the trail that records the Redshift API calls.", fr: "Activer CloudTrail Insights sur le journal de suivi qui enregistre les appels d'API Redshift." } }
    - { id: c, text: { en: "Enable log file integrity validation on the trail.", fr: "Activer la validation de l'intégrité des fichiers journaux sur le journal de suivi." } }
    - { id: d, text: { en: "Set the enable_user_activity_logging parameter to true in the cluster's parameter group.", fr: "Définir le paramètre enable_user_activity_logging à true dans le groupe de paramètres du cluster." } }
    - { id: e, text: { en: "Turn on enhanced VPC routing so that the JDBC traffic is captured in VPC flow logs.", fr: "Activer le routage VPC amélioré afin que le trafic JDBC soit capturé dans les journaux de flux VPC." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "CloudTrail records the Redshift API calls, while database audit logging records what happens inside the database. The user activity log, which logs each query before it runs, is written only when audit logging is on and the enable_user_activity_logging parameter is true; that parameter is false by default."
    fr: "CloudTrail enregistre les appels d'API Redshift, alors que la journalisation d'audit de la base enregistre ce qui se passe dans la base de données. Le journal d'activité des utilisateurs, qui consigne chaque requête avant son exécution, n'est écrit que si la journalisation d'audit est activée et que le paramètre enable_user_activity_logging vaut true ; ce paramètre vaut false par défaut."
  options:
    b:
      en: "Insights flags unusual API call volumes; SQL statements are not API calls that CloudTrail records."
      fr: "Insights signale des volumes d'appels d'API inhabituels ; les instructions SQL ne sont pas des appels d'API enregistrés par CloudTrail."
    c:
      en: "Integrity validation proves that log files were not changed; it does not add SQL text to the logs."
      fr: "La validation de l'intégrité prouve que les fichiers journaux n'ont pas été modifiés ; elle n'ajoute pas le texte SQL aux journaux."
    e:
      en: "Enhanced VPC routing concerns COPY and UNLOAD traffic, and flow logs record network metadata, not SQL text."
      fr: "Le routage VPC amélioré concerne le trafic COPY et UNLOAD, et les journaux de flux enregistrent des métadonnées réseau, pas du texte SQL."
references:
  - title: Database audit logging
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/db-auditing.html
