id: deac01-4a-iam-group-analysts
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 35 IAM users who work as data analysts. All of them need the same read-only access to the curated zone of an Amazon S3 data lake and to Amazon Athena. About five analysts join or leave the team each month. The company wants the LEAST operational overhead to grant and remove these permissions.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a 35 utilisateurs IAM qui travaillent comme analystes de données. Tous ont besoin du même accès en lecture seule à la zone organisée (curated) d'un lac de données Amazon S3 et à Amazon Athena. Environ cinq analystes rejoignent ou quittent l'équipe chaque mois. L'entreprise veut la charge opérationnelle la PLUS FAIBLE pour accorder et retirer ces autorisations.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an analysts IAM group and add an S3 bucket policy that names the group as the Principal.", fr: "Créer un groupe IAM d'analystes et ajouter une politique de compartiment S3 qui désigne le groupe comme Principal." } }
    - { id: b, text: { en: "Create an analysts IAM user group, attach a managed policy with the permissions, and add or remove users.", fr: "Créer un groupe d'utilisateurs IAM d'analystes, y attacher une politique gérée avec les autorisations, puis ajouter ou retirer des utilisateurs." } }
    - { id: c, text: { en: "Attach an inline policy with the permissions to each analyst's IAM user when the analyst joins.", fr: "Attacher une politique en ligne avec les autorisations à l'utilisateur IAM de chaque analyste à son arrivée." } }
    - { id: d, text: { en: "Create an analysts IAM group with the permissions and nest it inside an existing all-employees group.", fr: "Créer un groupe IAM d'analystes avec les autorisations et l'imbriquer dans un groupe existant de tous les employés." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An IAM user group lets you attach permissions once and give them to every member: adding or removing a user from the group grants or removes the access. The managed policy is maintained in one place for all 35 analysts.
    fr: |
      Un groupe d'utilisateurs IAM permet d'attacher les autorisations une seule fois et de les donner à chaque membre : ajouter ou retirer un utilisateur du groupe accorde ou retire l'accès. La politique gérée est maintenue à un seul endroit pour les 35 analystes.
  options:
    a:
      en: |
        A user group cannot be the Principal of a resource-based policy, because groups relate to permissions, not to authentication.
      fr: |
        Un groupe d'utilisateurs ne peut pas être le Principal d'une politique basée sur les ressources, car les groupes concernent les autorisations, pas l'authentification.
    c:
      en: |
        Inline policies are bound to a single user, so every arrival, departure and permission change means editing users one by one.
      fr: |
        Les politiques en ligne sont liées à un seul utilisateur : chaque arrivée, départ et changement d'autorisation impose de modifier les utilisateurs un par un.
    d:
      en: |
        IAM user groups cannot be nested; a group contains only users.
      fr: |
        Les groupes d'utilisateurs IAM ne peuvent pas être imbriqués : un groupe ne contient que des utilisateurs.
references:
  - title: IAM user groups
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_groups.html
