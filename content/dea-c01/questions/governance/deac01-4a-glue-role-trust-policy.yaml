id: deac01-4a-glue-role-trust-policy
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer creates an IAM role for a new AWS Glue crawler. In the IAM console, the engineer chooses Amazon EC2 as the trusted service by mistake, then attaches the AWSGlueServiceRole managed policy and a policy that allows reading the source bucket. When the crawler runs, it fails because AWS Glue cannot assume the role.

    Which change will fix the problem?
  fr: |
    Un ingénieur des données crée un rôle IAM pour un nouveau crawler AWS Glue. Dans la console IAM, il choisit par erreur Amazon EC2 comme service approuvé, puis attache la politique gérée AWSGlueServiceRole et une politique qui autorise la lecture du compartiment source. Quand le crawler s'exécute, il échoue parce qu'AWS Glue ne peut pas assumer le rôle.

    Quelle modification corrige le problème ?
body:
  options:
    - { id: a, text: { en: "Attach the AWSGlueConsoleFullAccess managed policy to the role next to AWSGlueServiceRole.", fr: "Attacher la politique gérée AWSGlueConsoleFullAccess au rôle, en plus d'AWSGlueServiceRole." } }
    - { id: b, text: { en: "Add the sts:AssumeRole action to the role's permissions policy.", fr: "Ajouter l'action sts:AssumeRole à la politique d'autorisations du rôle." } }
    - { id: c, text: { en: "Update the role's trust policy so that the AWS Glue service principal can assume the role.", fr: "Mettre à jour la politique d'approbation du rôle pour que le principal de service AWS Glue puisse assumer le rôle." } }
    - { id: d, text: { en: "Create an instance profile for the role and select it in the crawler settings.", fr: "Créer un profil d'instance pour le rôle et le sélectionner dans les paramètres du crawler." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The trust policy of a role defines who can assume it. A Glue service role must trust AWS Glue as the AWS service (glue.amazonaws.com); the permissions policies, such as AWSGlueServiceRole, only define what the role can do once assumed.
    fr: |
      La politique d'approbation d'un rôle définit qui peut l'assumer. Un rôle de service Glue doit approuver AWS Glue comme service AWS (glue.amazonaws.com) ; les politiques d'autorisations, comme AWSGlueServiceRole, ne définissent que ce que le rôle peut faire une fois assumé.
  options:
    a:
      en: |
        Another permissions policy does not change who is trusted to assume the role, so Glue still cannot use it.
      fr: |
        Une autre politique d'autorisations ne change pas qui est approuvé pour assumer le rôle : Glue ne peut toujours pas l'utiliser.
    b:
      en: |
        sts:AssumeRole in the role's own permissions lets the role assume other roles; it does not let the Glue service assume this role.
      fr: |
        sts:AssumeRole dans les autorisations du rôle lui-même permet au rôle d'assumer d'autres rôles ; cela ne permet pas au service Glue d'assumer ce rôle.
    d:
      en: |
        Instance profiles pass roles to EC2 instances; Glue crawlers take an IAM role directly and need it to trust AWS Glue.
      fr: |
        Les profils d'instance transmettent des rôles aux instances EC2 ; les crawlers Glue prennent directement un rôle IAM, qui doit approuver AWS Glue.
references:
  - title: "Step 2: Create an IAM role for AWS Glue"
    url: https://docs.aws.amazon.com/glue/latest/dg/create-an-iam-role.html
