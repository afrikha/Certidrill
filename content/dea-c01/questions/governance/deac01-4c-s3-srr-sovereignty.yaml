id: deac01-4c-s3-srr-sovereignty
objective: "4.5.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial company stores regulated customer data in an Amazon S3 bucket in the eu-central-1 Region. A data sovereignty rule requires that the data never leave eu-central-1. The company also needs a second copy of every new object in a separate AWS account that its security team manages, to protect the data against accidental deletion by the production team.

    Which solution will meet these requirements?
  fr: |
    Une société financière stocke des données client réglementées dans un compartiment Amazon S3 de la Région eu-central-1. Une règle de souveraineté des données exige que ces données ne quittent jamais eu-central-1. L'entreprise a aussi besoin d'une seconde copie de chaque nouvel objet dans un compte AWS distinct géré par son équipe de sécurité, afin de protéger les données contre une suppression accidentelle par l'équipe de production.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure S3 Cross-Region Replication to a bucket in the security account in the eu-west-1 Region.", fr: "Configurer S3 Cross-Region Replication vers un compartiment du compte de sécurité dans la Région eu-west-1." } }
    - { id: b, text: { en: "Configure S3 Same-Region Replication to a bucket in the security account in the eu-central-1 Region.", fr: "Configurer S3 Same-Region Replication vers un compartiment du compte de sécurité dans la Région eu-central-1." } }
    - { id: c, text: { en: "Create an S3 Multi-Region Access Point over the bucket and a bucket in the security account in another EU Region.", fr: "Créer un point d'accès multi-Régions S3 couvrant le compartiment et un compartiment du compte de sécurité dans une autre Région de l'UE." } }
    - { id: d, text: { en: "Turn on S3 Versioning on the bucket, and grant the security account read access to the previous object versions.", fr: "Activer S3 Versioning sur le compartiment, et accorder au compte de sécurité un accès en lecture aux versions précédentes des objets." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Objects in a bucket never leave its Region unless you explicitly transfer them. Same-Region Replication copies new objects to another bucket in the same Region, and the destination can be owned by another account; AWS cites keeping copies in separate accounts within one Region as a data sovereignty use case."
    fr: "Les objets d'un compartiment ne quittent jamais sa Région, sauf si vous les transférez explicitement. Same-Region Replication copie les nouveaux objets vers un autre compartiment de la même Région, et la destination peut appartenir à un autre compte ; AWS cite la conservation de copies dans des comptes distincts d'une même Région comme cas d'usage de souveraineté des données."
  options:
    a:
      en: "Cross-Region Replication copies the data to eu-west-1, so it leaves eu-central-1."
      fr: "Cross-Region Replication copie les données dans eu-west-1 : elles quittent eu-central-1."
    c:
      en: "A Multi-Region Access Point spans buckets in several Regions, so a bucket in another Region would hold the data."
      fr: "Un point d'accès multi-Régions couvre des compartiments de plusieurs Régions : un compartiment d'une autre Région contiendrait les données."
    d:
      en: "Versions stay in the production bucket, where the production team can still delete them; no copy exists in the security account."
      fr: "Les versions restent dans le compartiment de production, où l'équipe de production peut toujours les supprimer ; aucune copie n'existe dans le compte de sécurité."
references:
  - title: Replicating objects within and across Regions
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html
  - title: General purpose buckets overview
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingBucket.html
