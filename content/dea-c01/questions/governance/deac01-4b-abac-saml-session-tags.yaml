id: deac01-4b-abac-saml-session-tags
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's employees sign in to AWS through a SAML 2.0 identity provider (IdP) and assume one IAM role named `DataAnalyst`. Each department has its own prefix in an Amazon S3 bucket, such as `s3://example-reports/finance/`. The IdP already stores the department of each employee. Employees must be able to read only their own department's prefix, and the company does not want to create or update any IAM role or policy when a department is added.

    Which solution will meet these requirements?
  fr: |
    Les employés d'AnyCompany se connectent à AWS via un fournisseur d'identité (IdP) SAML 2.0 et endossent un seul rôle IAM nommé `DataAnalyst`. Chaque service a son propre préfixe dans un compartiment (bucket) Amazon S3, par exemple `s3://example-reports/finance/`. L'IdP stocke déjà le service de chaque employé. Les employés doivent pouvoir lire uniquement le préfixe de leur service, et l'entreprise ne veut créer ni modifier aucun rôle ou politique IAM lorsqu'un service est ajouté.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create one IAM role per department with a policy for its prefix, and map each IdP group to the matching role in the SAML assertion.", fr: "Créer un rôle IAM par service avec une politique pour son préfixe, et associer chaque groupe de l'IdP au rôle correspondant dans l'assertion SAML." } }
    - { id: b, text: { en: "Create one S3 access point per department whose access point policy allows the department prefix to the DataAnalyst role.", fr: "Créer un point d'accès S3 par service dont la politique de point d'accès autorise le préfixe du service au rôle DataAnalyst." } }
    - { id: c, text: { en: "Send the department as a SAML session tag, allow sts:TagSession, and use ${aws:PrincipalTag/department} in the S3 resource ARN.", fr: "Envoyer le service comme balise de session SAML, autoriser sts:TagSession, et utiliser ${aws:PrincipalTag/department} dans l'ARN de ressource S3." } }
    - { id: d, text: { en: "Create an IAM user for each employee tagged with the department, and use ${aws:username} in the S3 resource ARN.", fr: "Créer un utilisateur IAM pour chaque employé balisé avec le service, et utiliser ${aws:username} dans l'ARN de ressource S3." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The IdP can send the PrincipalTag:department SAML attribute, which becomes a session tag available as aws:PrincipalTag in the role session; the trust policy must allow sts:TagSession. One policy that inserts ${aws:PrincipalTag/department} into the resource ARN covers every current and future department."
    fr: "L'IdP peut envoyer l'attribut SAML PrincipalTag:department, qui devient une balise de session disponible sous la forme aws:PrincipalTag dans la session du rôle ; la politique d'approbation doit autoriser sts:TagSession. Une seule politique qui insère ${aws:PrincipalTag/department} dans l'ARN de ressource couvre tous les services actuels et futurs."
  options:
    a:
      en: "One role and policy per department must be created whenever a department is added, which the company wants to avoid."
      fr: "Un rôle et une politique par service doivent être créés à chaque ajout de service, ce que l'entreprise veut éviter."
    b:
      en: "Each new department would need a new access point and access point policy, and the single role could not be limited to its own department."
      fr: "Chaque nouveau service exigerait un nouveau point d'accès et une nouvelle politique, et le rôle unique ne pourrait pas être limité à son propre service."
    d:
      en: "IAM users replace federation with long-term identities to manage per employee, and ${aws:username} matches a user name, not a department."
      fr: "Les utilisateurs IAM remplacent la fédération par des identités à long terme à gérer pour chaque employé, et ${aws:username} correspond à un nom d'utilisateur, pas à un service."
references:
  - title: Pass session tags in AWS STS
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_session-tags.html
  - title: Define permissions based on attributes with ABAC authorization
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html
