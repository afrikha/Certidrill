id: deac01-4b-lp-glue-job-prefixes
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Glue ETL job at AnyCompany reads raw files from `s3://example-lake/raw/` and writes Parquet files to `s3://example-lake/curated/`. The same bucket also holds an `hr/` prefix that the job must not access. A data engineer must write the Amazon S3 part of the job's IAM role policy by following the principle of least privilege.

    Which policy should the data engineer use?
  fr: |
    Une tâche ETL AWS Glue d'AnyCompany lit des fichiers bruts dans `s3://example-lake/raw/` et écrit des fichiers Parquet dans `s3://example-lake/curated/`. Le même compartiment contient aussi un préfixe `hr/` auquel la tâche ne doit pas accéder. Un ingénieur des données doit rédiger la partie Amazon S3 de la politique du rôle IAM de la tâche en respectant le principe du moindre privilège.

    Quelle politique l'ingénieur des données doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Allow s3:* on example-lake/* and s3:ListBucket on the bucket so that the job can manage its own files.", fr: "Autoriser s3:* sur example-lake/* et s3:ListBucket sur le compartiment afin que la tâche gère ses propres fichiers." } }
    - { id: b, text: { en: "Attach the AmazonS3ReadOnlyAccess AWS managed policy, and allow s3:PutObject on example-lake/curated/*.", fr: "Attacher la politique gérée par AWS AmazonS3ReadOnlyAccess, et autoriser s3:PutObject sur example-lake/curated/*." } }
    - { id: c, text: { en: "Allow s3:GetObject and s3:PutObject on example-lake/* and s3:ListBucket on the bucket for the job role.", fr: "Autoriser s3:GetObject et s3:PutObject sur example-lake/* et s3:ListBucket sur le compartiment pour le rôle de la tâche." } }
    - { id: d, text: { en: "Allow s3:GetObject on example-lake/raw/*, s3:PutObject on example-lake/curated/*, and s3:ListBucket on the bucket.", fr: "Autoriser s3:GetObject sur example-lake/raw/*, s3:PutObject sur example-lake/curated/*, et s3:ListBucket sur le compartiment." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Least privilege gives only the actions the job performs on only the resources it uses: read on the raw prefix, write on the curated prefix, and listing on the bucket ARN, because s3:ListBucket is a bucket-level action. The hr/ objects cannot be read or written."
    fr: "Le moindre privilège ne donne que les actions effectuées par la tâche sur les seules ressources qu'elle utilise : lecture sur le préfixe raw, écriture sur le préfixe curated, et liste sur l'ARN du compartiment, car s3:ListBucket est une action de niveau compartiment. Les objets hr/ ne peuvent être ni lus ni écrits."
  options:
    a:
      en: "s3:* on every object allows deletes and access to the hr/ prefix."
      fr: "s3:* sur tous les objets autorise les suppressions et l'accès au préfixe hr/."
    b:
      en: "AmazonS3ReadOnlyAccess allows reading every bucket in the account, including the hr/ prefix."
      fr: "AmazonS3ReadOnlyAccess autorise la lecture de tous les compartiments du compte, y compris le préfixe hr/."
    c:
      en: "Read and write on the whole bucket lets the job read and overwrite hr/ objects and write into raw/."
      fr: "La lecture et l'écriture sur tout le compartiment permettent à la tâche de lire et d'écraser les objets hr/ et d'écrire dans raw/."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
