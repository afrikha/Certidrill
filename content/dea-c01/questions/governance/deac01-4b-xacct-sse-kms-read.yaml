id: deac01-4b-xacct-sse-kms-read
objective: "4.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's producer account (account A) stores curated data in an Amazon S3 bucket. Default encryption uses SSE-KMS with a customer managed key in account A. An AWS Glue job in a consumer account (account B) runs with the IAM role `ConsumerEtlRole` and must read the objects directly, without assuming a role in account A.

    Which combination of steps will meet these requirements? (Choose three.)
  fr: |
    Le compte producteur d'AnyCompany (compte A) stocke des données organisées dans un compartiment Amazon S3. Le chiffrement par défaut utilise SSE-KMS avec une clé gérée par le client du compte A. Une tâche AWS Glue d'un compte consommateur (compte B) s'exécute avec le rôle IAM `ConsumerEtlRole` et doit lire les objets directement, sans endosser de rôle dans le compte A.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Add a statement to the bucket policy in account A that allows ConsumerEtlRole to call s3:GetObject and s3:ListBucket.", fr: "Ajouter à la politique de compartiment du compte A une instruction qui autorise ConsumerEtlRole à appeler s3:GetObject et s3:ListBucket." } }
    - { id: b, text: { en: "Share the bucket with account B through a resource share in AWS Resource Access Manager (AWS RAM).", fr: "Partager le compartiment avec le compte B via un partage de ressources AWS Resource Access Manager (AWS RAM)." } }
    - { id: c, text: { en: "Add a statement to the key policy in account A that allows account B or ConsumerEtlRole to use kms:Decrypt.", fr: "Ajouter à la politique de clé du compte A une instruction qui autorise le compte B ou ConsumerEtlRole à utiliser kms:Decrypt." } }
    - { id: d, text: { en: "Allow ConsumerEtlRole to use kms:Decrypt on the AWS managed key aws/s3 of account A.", fr: "Autoriser ConsumerEtlRole à utiliser kms:Decrypt sur la clé gérée par AWS aws/s3 du compte A." } }
    - { id: e, text: { en: "Create a customer managed key in account B and set it as the default encryption key of the bucket in account A.", fr: "Créer une clé gérée par le client dans le compte B et la définir comme clé de chiffrement par défaut du compartiment du compte A." } }
    - { id: f, text: { en: "Allow s3:GetObject and s3:ListBucket on the bucket, and kms:Decrypt on the key ARN in account A, in the policy of ConsumerEtlRole.", fr: "Autoriser s3:GetObject et s3:ListBucket sur le compartiment, et kms:Decrypt sur l'ARN de la clé du compte A, dans la politique de ConsumerEtlRole." } }
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: "Cross-account access needs both sides: the bucket policy and the key policy in account A must allow the consumer, and the IAM policy of the role in account B must allow the S3 actions and kms:Decrypt on the key ARN. Reading an SSE-KMS object requires kms:Decrypt on its key."
    fr: "Un accès intercompte exige l'accord des deux côtés : la politique de compartiment et la politique de clé du compte A doivent autoriser le consommateur, et la politique IAM du rôle du compte B doit autoriser les actions S3 et kms:Decrypt sur l'ARN de la clé. Lire un objet SSE-KMS exige kms:Decrypt sur sa clé."
  options:
    b:
      en: "Cross-account access to an S3 bucket is granted with the bucket policy, not by sharing the bucket through AWS RAM."
      fr: "L'accès intercompte à un compartiment S3 s'accorde avec la politique de compartiment, pas en partageant le compartiment via AWS RAM."
    d:
      en: "The objects use the customer managed key, and objects encrypted with an AWS managed key cannot be shared cross-account anyway."
      fr: "Les objets utilisent la clé gérée par le client, et des objets chiffrés avec une clé gérée par AWS ne peuvent de toute façon pas être partagés entre comptes."
    e:
      en: "Changing the default key affects only new objects and moves key control to the consumer; the existing objects still need the account A key."
      fr: "Changer la clé par défaut n'affecte que les nouveaux objets et transfère le contrôle de la clé au consommateur ; les objets existants exigent toujours la clé du compte A."
references:
  - title: Allowing users in other accounts to use a KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html
  - title: Using server-side encryption with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
