id: deac01-4a-glue-sg-self-reference
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer at AnyCompany creates an AWS Glue JDBC connection to an Amazon RDS for PostgreSQL DB instance in a private subnet. The connection uses the same security group as the DB instance. That security group has one inbound rule that allows PostgreSQL traffic from the application subnets and the default outbound rule that allows all traffic. The subnets use the default network ACL. The connection test fails, and the Glue job cannot start. The fix must not open the security group to other networks.

    Which change will meet these requirements?
  fr: |
    Un ingénieur des données d'AnyCompany crée une connexion JDBC AWS Glue vers une instance de base de données Amazon RDS for PostgreSQL dans un sous-réseau privé. La connexion utilise le même groupe de sécurité que l'instance de base de données. Ce groupe de sécurité a une règle entrante qui autorise le trafic PostgreSQL depuis les sous-réseaux applicatifs et la règle sortante par défaut qui autorise tout le trafic. Les sous-réseaux utilisent la liste ACL réseau par défaut. Le test de la connexion échoue et la tâche Glue ne peut pas démarrer. La correction ne doit pas ouvrir le groupe de sécurité à d'autres réseaux.

    Quelle modification répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an inbound rule for all TCP ports whose source is 0.0.0.0/0 to the security group.", fr: "Ajouter au groupe de sécurité une règle entrante pour tous les ports TCP dont la source est 0.0.0.0/0." } }
    - { id: b, text: { en: "Add an inbound rule for all TCP ports whose source is the security group itself.", fr: "Ajouter une règle entrante pour tous les ports TCP dont la source est le groupe de sécurité lui-même." } }
    - { id: c, text: { en: "Add an outbound rule for the PostgreSQL port whose destination is the CIDR block of the private subnet.", fr: "Ajouter une règle sortante pour le port PostgreSQL dont la destination est le bloc CIDR du sous-réseau privé." } }
    - { id: d, text: { en: "Add a network ACL rule that allows inbound ephemeral ports to the private subnet.", fr: "Ajouter une règle de liste ACL réseau qui autorise les ports éphémères entrants vers le sous-réseau privé." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS Glue components communicate with each other through the elastic network interfaces that Glue creates in your subnet, so the security group of the connection needs a self-referencing inbound rule for all TCP ports. Because the source is the same security group, the rule does not open the VPC to other networks.
    fr: |
      Les composants d'AWS Glue communiquent entre eux par les interfaces réseau Elastic que Glue crée dans votre sous-réseau : le groupe de sécurité de la connexion a donc besoin d'une règle entrante autoréférencée pour tous les ports TCP. Comme la source est le même groupe de sécurité, la règle n'ouvre pas le VPC à d'autres réseaux.
  options:
    a:
      en: |
        A source of 0.0.0.0/0 opens every TCP port to all networks, which the requirement forbids.
      fr: |
        Une source 0.0.0.0/0 ouvre tous les ports TCP à tous les réseaux, ce que l'exigence interdit.
    c:
      en: |
        The default outbound rule already allows all traffic, so another outbound rule changes nothing; the missing piece is the self-referencing inbound rule.
      fr: |
        La règle sortante par défaut autorise déjà tout le trafic : une autre règle sortante ne change rien. Il manque la règle entrante autoréférencée.
    d:
      en: |
        The default network ACL already allows all inbound and outbound traffic, so the security group is what blocks the Glue components.
      fr: |
        La liste ACL réseau par défaut autorise déjà tout le trafic entrant et sortant : c'est le groupe de sécurité qui bloque les composants Glue.
references:
  - title: Setting up Amazon VPC for JDBC connections to Amazon RDS data stores from AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/setup-vpc-for-glue-access.html
