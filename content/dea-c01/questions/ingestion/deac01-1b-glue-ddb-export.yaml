id: deac01-1b-glue-ddb-export
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a nightly AWS Glue job that reads a 400 GB Amazon DynamoDB table in provisioned capacity mode with the DynamoDB ETL connector. While the job runs, the order application that uses the table receives throttling errors. Point-in-time recovery is enabled on the table. The job must read a full, consistent copy of the table without consuming the table's read capacity.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute chaque nuit une tâche AWS Glue qui lit avec le connecteur ETL DynamoDB une table Amazon DynamoDB de 400 Go en mode de capacité provisionnée. Pendant l'exécution de la tâche, l'application de commandes qui utilise la table reçoit des erreurs de limitation. La restauration à un instant dans le passé (PITR) est activée sur la table. La tâche doit lire une copie complète et cohérente de la table sans consommer la capacité de lecture de la table.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set `dynamodb.throughput.read.percent` to 0.1 in the connection options of the ETL connector that the job uses.", fr: "Définir `dynamodb.throughput.read.percent` à 0.1 dans les options de connexion du connecteur ETL que la tâche utilise." }
    - id: b
      text: { en: "Increase dynamodb.splits in the connection options so that the job reads the table with more parallel segments.", fr: "Augmenter dynamodb.splits dans les options de connexion pour que la tâche lise la table avec davantage de segments parallèles." }
    - id: c
      text: { en: "Add a global secondary index that projects all attributes of the table and point the job at the index.", fr: "Ajouter un index secondaire global qui projette tous les attributs de la table et diriger la tâche vers l'index." }
    - id: d
      text: { en: "Switch the job to the DynamoDB export connector by setting dynamodb.export to ddb with an S3 bucket and prefix.", fr: "Faire passer la tâche au connecteur d'exportation DynamoDB en définissant dynamodb.export sur ddb avec un compartiment et un préfixe S3." }
answer: { optionId: d }
explanation:
  correct:
    en: "With dynamodb.export set to ddb, Glue starts a DynamoDB export to Amazon S3 from the point-in-time recovery data and reads the exported files. DynamoDB exports do not consume read capacity units and do not affect table performance, and AWS documents better performance than the ETL connector for tables larger than 80 GB."
    fr: "Avec dynamodb.export défini sur ddb, Glue lance une exportation DynamoDB vers Amazon S3 à partir des données de restauration à un instant dans le passé et lit les fichiers exportés. Les exportations DynamoDB ne consomment pas d'unités de capacité de lecture et n'affectent pas les performances de la table, et AWS indique de meilleures performances qu'avec le connecteur ETL pour les tables de plus de 80 Go."
  options:
    a:
      en: "A lower read percentage reduces the impact, but the ETL connector still consumes the table's read capacity and the job becomes much slower."
      fr: "Un pourcentage de lecture plus faible réduit l'impact, mais le connecteur ETL consomme toujours la capacité de lecture de la table et la tâche devient beaucoup plus lente."
    b:
      en: "More splits increase the parallelism of the scan, which consumes read capacity faster and worsens the throttling."
      fr: "Davantage de segments augmentent le parallélisme de l'analyse, ce qui consomme la capacité de lecture plus vite et aggrave la limitation."
    c:
      en: "A global secondary index has its own capacity to pay for and adds write work to every table update, and the scan still consumes read capacity."
      fr: "Un index secondaire global a sa propre capacité à payer et ajoute des écritures à chaque mise à jour de la table, et l'analyse consomme toujours de la capacité de lecture."
references:
  - title: DynamoDB connections
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-connect-dynamodb-home.html
  - title: "DynamoDB data export to Amazon S3: how it works"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/S3DataExport.HowItWorks.html
