id: deac01-1c-rds-data-api-aurora
objective: "1.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores reference data in an Amazon Aurora PostgreSQL-Compatible Edition cluster that runs version 16.4. A new data API built with Amazon API Gateway and AWS Lambda must run SQL statements on the cluster. The functions must not bundle a PostgreSQL driver or open and manage database connections, and database credentials must come from AWS Secrets Manager.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des données de référence dans un cluster Amazon Aurora édition compatible avec PostgreSQL en version 16.4. Une nouvelle API de données créée avec Amazon API Gateway et AWS Lambda doit exécuter des instructions SQL sur le cluster. Les fonctions ne doivent ni embarquer de pilote PostgreSQL ni ouvrir et gérer de connexions à la base de données, et les informations d'identification de la base doivent provenir d'AWS Secrets Manager.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon RDS Proxy for the cluster and connect to it from the functions with the PostgreSQL driver.", fr: "Créer un Amazon RDS Proxy pour le cluster et s'y connecter depuis les fonctions avec le pilote PostgreSQL." } }
    - { id: b, text: { en: "Create an Aurora PostgreSQL zero-ETL integration with Amazon Redshift and query Redshift over JDBC.", fr: "Créer une intégration zéro ETL d'Aurora PostgreSQL avec Amazon Redshift et interroger Redshift via JDBC." } }
    - { id: c, text: { en: "Add a reader instance to the cluster and connect the functions to the reader endpoint.", fr: "Ajouter une instance de lecteur au cluster et connecter les fonctions au point de terminaison du lecteur." } }
    - { id: d, text: { en: "Enable the RDS Data API on the cluster and call ExecuteStatement with the cluster ARN and the secret ARN.", fr: "Activer l'API de données RDS sur le cluster et appeler ExecuteStatement avec l'ARN du cluster et l'ARN du secret." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The RDS Data API gives an Aurora cluster a secure HTTP endpoint, integrated with the AWS SDKs, to run SQL without a persistent connection. It uses the database credentials stored in Secrets Manager, and Aurora PostgreSQL 16.1 and higher supports it on provisioned and serverless clusters."
    fr: "L'API de données RDS donne à un cluster Aurora un point de terminaison HTTP sécurisé, intégré aux SDK AWS, pour exécuter du SQL sans connexion persistante. Elle utilise les informations d'identification de base de données stockées dans Secrets Manager, et Aurora PostgreSQL 16.1 et versions ultérieures la prend en charge sur les clusters provisionnés et sans serveur."
  options:
    a:
      en: "RDS Proxy pools connections, but the functions still bundle a driver and open connections to the proxy."
      fr: "RDS Proxy mutualise les connexions, mais les fonctions embarquent toujours un pilote et ouvrent des connexions vers le proxy."
    b:
      en: "This replicates the data to another database that the functions would still reach through a driver and connections."
      fr: "Cette solution réplique les données vers une autre base que les fonctions atteindraient toujours au moyen d'un pilote et de connexions."
    c:
      en: "A reader instance adds read capacity, but the functions still need a driver and must manage connections."
      fr: "Une instance de lecteur ajoute de la capacité de lecture, mais les fonctions ont toujours besoin d'un pilote et doivent gérer des connexions."
references:
  - title: Using the Amazon RDS Data API
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/data-api.html
  - title: Supported Regions and Aurora DB engines for RDS Data API
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.Aurora_Fea_Regions_DB-eng.Feature.Data_API.html
