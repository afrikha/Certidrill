id: deac01-1d-cfn-drift-detection
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company deploys its ingestion resources, including Amazon Data Firehose streams, AWS Glue jobs, and S3 buckets, with an AWS CloudFormation stack. An audit suspects that engineers changed the buffering settings of a Firehose stream and the number of workers of a Glue job in the console. The company must find which resources and properties no longer match the template, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie ses ressources d'ingestion, dont des flux Amazon Data Firehose, des tâches AWS Glue et des compartiments S3, avec une pile AWS CloudFormation. Un audit soupçonne des ingénieurs d'avoir modifié dans la console les paramètres de mise en mémoire tampon d'un flux Firehose et le nombre de nœuds de travail d'une tâche Glue. L'entreprise doit trouver quelles ressources et quelles propriétés ne correspondent plus au modèle, avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Review the events of the stack in the CloudFormation console.", fr: "Examiner les événements de la pile dans la console CloudFormation." } }
    - { id: b, text: { en: "Enable termination protection on the stack.", fr: "Activer la protection contre la résiliation sur la pile." } }
    - { id: c, text: { en: "Run drift detection on the stack and review the drift details of each resource.", fr: "Lancer la détection de dérive sur la pile et examiner les détails de dérive de chaque ressource." } }
    - { id: d, text: { en: "Update the stack with the same template so that CloudFormation lists the differences.", fr: "Mettre à jour la pile avec le même modèle pour que CloudFormation liste les différences." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Drift detection compares the actual configuration of the stack resources with the template and parameter values. Each resource gets a status such as IN_SYNC, MODIFIED, or DELETED, and the details show each property difference with its expected and actual values. Drift detection reports drift but does not fix it."
    fr: "La détection de dérive compare la configuration réelle des ressources de la pile au modèle et aux valeurs de paramètres. Chaque ressource reçoit un statut comme IN_SYNC, MODIFIED ou DELETED, et les détails montrent chaque différence de propriété avec sa valeur attendue et sa valeur réelle. La détection de dérive signale la dérive mais ne la corrige pas."
  options:
    a: { en: "Stack events record CloudFormation operations only; changes made in the service consoles do not appear there.", fr: "Les événements de pile n'enregistrent que les opérations CloudFormation ; les modifications faites dans les consoles des services n'y figurent pas." }
    b: { en: "Termination protection prevents the stack from being deleted; it does not compare resources with the template.", fr: "La protection contre la résiliation empêche la suppression de la pile ; elle ne compare pas les ressources au modèle." }
    d: { en: "An update with an unchanged template compares the template with the previous template, not with the actual resources, so it lists no differences.", fr: "Une mise à jour avec un modèle inchangé compare le modèle au modèle précédent, pas aux ressources réelles : elle ne liste aucune différence." }
references:
  - title: Detect unmanaged configuration changes to stacks and resources with drift detection
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-drift.html
