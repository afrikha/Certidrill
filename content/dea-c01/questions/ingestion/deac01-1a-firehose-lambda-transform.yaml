    url: https://docs.aws.amazon.com/firehose/latest/dev/data-transformation.html
  - title: Handle failure in data transformation - Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/data-transformation-failure-handling.html
