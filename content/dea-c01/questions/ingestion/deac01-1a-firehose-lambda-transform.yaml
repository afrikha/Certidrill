id: deac01-1a-firehose-lambda-transform
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company sends application events to an Amazon Data Firehose stream that delivers them to Amazon S3. Before delivery, heartbeat events must be removed and the `email` field of the other events must be masked. Events that cannot be parsed must be kept in Amazon S3 for investigation instead of being delivered with the clean data. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise envoie des événements d'application à un flux Amazon Data Firehose qui les livre dans Amazon S3. Avant la livraison, les événements de pulsation (heartbeat) doivent être supprimés et le champ `email` des autres événements doit être masqué. Les événements impossibles à analyser doivent être conservés dans Amazon S3 pour investigation au lieu d'être livrés avec les données nettoyées. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS Lambda event source mapping on the Firehose stream with a function that filters and masks the records.", fr: "Créer un mappage de source d'événement AWS Lambda sur le flux Firehose avec une fonction qui filtre et masque les enregistrements." } }
    - { id: b, text: { en: "Configure an S3 Event Notification that invokes a Lambda function to rewrite each delivered object without the heartbeat events.", fr: "Configurer une notification d'événement S3 qui appelle une fonction Lambda pour réécrire chaque objet livré sans les événements de pulsation." } }
    - { id: c, text: { en: "Turn on data transformation with a Lambda function that returns Dropped for heartbeats, Ok with masked data, and ProcessingFailed for unparsable events.", fr: "Activer la transformation des données avec une fonction Lambda qui renvoie Dropped pour les pulsations, Ok avec les données masquées et ProcessingFailed pour les événements non analysables." } }
    - { id: d, text: { en: "Turn on record format conversion to Apache Parquet with a schema from the AWS Glue Data Catalog that omits the `email` column.", fr: "Activer la conversion du format des enregistrements en Apache Parquet avec un schéma d'AWS Glue Data Catalog qui omet la colonne `email`." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Firehose data transformation invokes a Lambda function on buffered records before delivery. Each returned record carries a result: Ok for a transformed record, Dropped for a record intentionally removed, and ProcessingFailed for a record that could not be transformed. Firehose writes the failed records to the processing-failed folder in the S3 bucket."
    fr: "La transformation des données de Firehose appelle une fonction Lambda sur les enregistrements mis en mémoire tampon avant la livraison. Chaque enregistrement renvoyé porte un résultat : Ok pour un enregistrement transformé, Dropped pour un enregistrement volontairement supprimé et ProcessingFailed pour un enregistrement impossible à transformer. Firehose écrit les enregistrements en échec dans le dossier processing-failed du compartiment S3."
  options:
    a:
      en: "Lambda event source mappings do not support Firehose streams as a source; Firehose invokes the function itself through data transformation."
      fr: "Les mappages de source d'événement Lambda ne prennent pas en charge les flux Firehose comme source ; Firehose appelle lui-même la fonction via la transformation des données."
    b:
      en: "The unmasked data would be written to Amazon S3 first, and rewriting every object adds processing after delivery."
      fr: "Les données non masquées seraient d'abord écrites dans Amazon S3, et la réécriture de chaque objet ajoute un traitement après la livraison."
    d:
      en: "Format conversion changes the file format; it does not drop heartbeat events or route unparsable events separately for investigation."
      fr: "La conversion de format change le format des fichiers ; elle ne supprime pas les événements de pulsation et n'isole pas les événements non analysables pour investigation."
references:
