id: deac01-1d-cfn-change-set-preview
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data platform team manages a production AWS CloudFormation stack that contains an Amazon Redshift provisioned cluster, AWS Glue jobs, and Step Functions state machines. Before applying an edited template, the team must see which resources will be added, modified, or deleted and whether the Redshift cluster will be replaced. Nothing must change until the team approves.

    Which solution will meet these requirements?
  fr: |
    Une équipe de plateforme de données gère une pile AWS CloudFormation de production qui contient un cluster provisionné Amazon Redshift, des tâches AWS Glue et des machines d'état Step Functions. Avant d'appliquer un modèle modifié, l'équipe doit voir quelles ressources seront ajoutées, modifiées ou supprimées et si le cluster Redshift sera remplacé. Rien ne doit changer tant que l'équipe n'a pas donné son accord.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the validate-template command on the edited template and review its output before the update.", fr: "Exécuter la commande validate-template sur le modèle modifié et examiner sa sortie avant la mise à jour." } }
    - { id: b, text: { en: "Run drift detection on the stack before the update and review the differences that it reports.", fr: "Lancer la détection de dérive sur la pile avant la mise à jour et examiner les différences signalées." } }
    - { id: c, text: { en: "Update the stack directly with rollback triggers based on CloudWatch alarms.", fr: "Mettre à jour la pile directement avec des déclencheurs de restauration fondés sur des alarmes CloudWatch." } }
    - { id: d, text: { en: "Create a change set from the edited template, review it, and execute it after approval.", fr: "Créer un jeu de modifications à partir du modèle modifié, l'examiner et l'exécuter après accord." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A change set compares the submitted template with the stack and lists the resources that will be added, modified, or deleted, including whether a modified resource will be replaced. CloudFormation changes nothing until the change set is executed."
    fr: "Un jeu de modifications compare le modèle soumis à la pile et liste les ressources qui seront ajoutées, modifiées ou supprimées, en indiquant si une ressource modifiée sera remplacée. CloudFormation ne change rien tant que le jeu de modifications n'est pas exécuté."
  options:
    a: { en: "validate-template checks the syntax of the template; it does not compare it with the resources of the stack.", fr: "validate-template vérifie la syntaxe du modèle ; il ne le compare pas aux ressources de la pile." }
    b: { en: "Drift detection compares the resources with the current template, not with the proposed one.", fr: "La détection de dérive compare les ressources au modèle actuel, pas au modèle proposé." }
    c: { en: "Rollback triggers act after the update has started, so changes, including a replacement, would begin without a preview or approval.", fr: "Les déclencheurs de restauration agissent après le début de la mise à jour : les modifications, y compris un remplacement, commenceraient sans aperçu ni accord." }
references:
  - title: Update CloudFormation stacks using change sets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-changesets.html
