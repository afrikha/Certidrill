id: deac01-1b-cwl-cross-account-fanin
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 40 member accounts in AWS Organizations. Applications in each account write logs to Amazon CloudWatch Logs log groups in the same Region. A central security account must receive the log events of all accounts in near real time in a single Amazon Kinesis data stream for analysis.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise compte 40 comptes membres dans AWS Organizations. Les applications de chaque compte écrivent des journaux dans des groupes de journaux Amazon CloudWatch Logs de la même Région. Un compte de sécurité central doit recevoir quasiment en temps réel les événements de journaux de tous les comptes dans un seul flux de données Amazon Kinesis pour les analyser.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "In the central account, create a CloudWatch Logs destination for the stream that the organization may use, and subscribe the log groups of each account to it.", fr: "Dans le compte central, créer pour le flux une destination CloudWatch Logs que l'organisation peut utiliser, et y abonner les groupes de journaux de chaque compte." }
    - id: b
      text: { en: "In each member account, run a scheduled Lambda function that reads new events with FilterLogEvents and writes them to the central stream.", fr: "Dans chaque compte membre, exécuter une fonction Lambda planifiée qui lit les nouveaux événements avec FilterLogEvents et les écrit dans le flux central." }
    - id: c
      text: { en: "In each member account, export the log groups to an S3 bucket of the central account every hour and load the files into the stream.", fr: "Dans chaque compte membre, exporter toutes les heures les groupes de journaux vers un compartiment S3 du compte central et charger les fichiers dans le flux." }
    - id: d
      text: { en: "In each member account, create a CloudWatch metric stream that sends the data of the log groups to the central data stream.", fr: "Dans chaque compte membre, créer un flux de métriques CloudWatch qui envoie les données des groupes de journaux vers le flux de données central." }
answer: { optionId: a }
explanation:
  correct:
    en: "Cross-account subscriptions deliver log events from other accounts to a Kinesis data stream or a Firehose stream of the recipient. The recipient creates a destination that points to its stream, with an access policy that can name the organization ID, and each sender creates a subscription filter that references the destination ARN, so CloudWatch Logs pushes events continuously without code."
    fr: "Les abonnements entre comptes livrent les événements de journaux d'autres comptes vers un flux de données Kinesis ou un flux Firehose du destinataire. Le destinataire crée une destination qui pointe vers son flux, avec une politique d'accès qui peut nommer l'ID de l'organisation, et chaque expéditeur crée un filtre d'abonnement qui référence l'ARN de la destination : CloudWatch Logs pousse les événements en continu, sans code."
  options:
    b:
      en: "Polling functions in 40 accounts are custom code to deploy and maintain, and polling adds delay and gaps compared with subscriptions."
      fr: "Des fonctions d'interrogation dans 40 comptes sont du code personnalisé à déployer et maintenir, et l'interrogation ajoute du délai et des trous par rapport aux abonnements."
    c:
      en: "Hourly exports are batch transfers, not near real time, and they need a loader to put the files into the stream."
      fr: "Des exportations horaires sont des transferts par lots, pas du quasi temps réel, et il faut un chargeur pour mettre les fichiers dans le flux."
    d:
      en: "Metric streams send CloudWatch metrics, not log events."
      fr: "Les flux de métriques envoient des métriques CloudWatch, pas des événements de journaux."
references:
  - title: Cross-account cross-Region subscriptions
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CrossAccountSubscriptions.html
  - title: "Step 1: Create a destination"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CreateDestination.html
