id: deac01-1e-cicd-codebuild-test-reports
objective: "1.4.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CodeBuild project in a data pipeline's CI process runs pytest unit tests for Python transformation code. The team wants to see the passed and failed test cases of each build in the CodeBuild console and to follow the pass rate across builds. The solution must require the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Un projet AWS CodeBuild du processus de CI d'un pipeline de données exécute les tests unitaires pytest du code de transformation Python. L'équipe veut voir dans la console CodeBuild les cas de test réussis et échoués de chaque génération, et suivre le taux de réussite d'une génération à l'autre. La solution doit demander le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the pytest output to Amazon CloudWatch Logs, and create a metric filter that counts failed tests.", fr: "Envoyer la sortie de pytest à Amazon CloudWatch Logs, et créer un filtre de métrique qui compte les tests échoués." } }
    - { id: b, text: { en: "Run pytest with --junitxml, and add a reports section with file-format JUNITXML to the buildspec file.", fr: "Exécuter pytest avec --junitxml, et ajouter au fichier buildspec une section reports avec file-format JUNITXML." } }
    - { id: c, text: { en: "Upload the pytest output as a build artifact to Amazon S3, and query it with Amazon Athena.", fr: "Charger la sortie de pytest comme artefact de génération dans Amazon S3, et l'interroger avec Amazon Athena." } }
    - { id: d, text: { en: "Add a manual approval action after the build so that reviewers read the build log before each deployment.", fr: "Ajouter une action d'approbation manuelle après la génération afin que des relecteurs lisent le journal de génération avant chaque déploiement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CodeBuild test reports show the details of the tests run in each build and the trends and failure rates across builds. pytest writes a JUnit XML file with --junitxml, and a report group declared in the reports section of the buildspec, with the JUNITXML format, collects it; CodeBuild creates the report group if it does not exist."
    fr: "Les rapports de test CodeBuild montrent le détail des tests exécutés à chaque génération ainsi que les tendances et taux d'échec d'une génération à l'autre. pytest écrit un fichier JUnit XML avec --junitxml, et un groupe de rapports déclaré dans la section reports du buildspec, au format JUNITXML, le collecte ; CodeBuild crée le groupe de rapports s'il n'existe pas."
  options:
    a:
      en: "A metric filter gives a count but not the test case details in the CodeBuild console, and it takes more work."
      fr: "Un filtre de métrique donne un compte, mais pas le détail des cas de test dans la console CodeBuild, et demande plus de travail."
    c:
      en: "This builds a custom reporting solution outside the CodeBuild console."
      fr: "Cette solution crée un rapport personnalisé en dehors de la console CodeBuild."
    d:
      en: "A manual review neither structures the test results nor shows trends across builds."
      fr: "Une relecture manuelle ne structure pas les résultats de test et ne montre pas de tendances d'une génération à l'autre."
references:
  - title: Set up test reporting with pytest
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/test-report-pytest.html
  - title: Test reports in AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/test-reporting.html
