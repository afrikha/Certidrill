id: deac01-1c-mwaa-existing-dags
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company orchestrates its data pipelines with 60 Apache Airflow DAGs written in Python on self-managed servers in its data center. The company is moving the pipelines to AWS and wants to reuse the DAGs with minimal changes. The company no longer wants to manage the Airflow infrastructure.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias orchestre ses pipelines de données avec 60 DAG Apache Airflow écrits en Python sur des serveurs autogérés de son centre de données. L'entreprise migre les pipelines vers AWS et veut réutiliser les DAG avec un minimum de modifications. L'entreprise ne veut plus gérer l'infrastructure Airflow.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Install Apache Airflow on Amazon EC2 instances in an Auto Scaling group and copy the DAGs to them.", fr: "Installer Apache Airflow sur des instances Amazon EC2 d'un groupe Auto Scaling et y copier les DAG." } }
    - { id: b, text: { en: "Rewrite each DAG as an AWS Step Functions state machine.", fr: "Réécrire chaque DAG sous forme de machine d'état AWS Step Functions." } }
    - { id: c, text: { en: "Rewrite each DAG as an AWS Glue workflow with triggers.", fr: "Réécrire chaque DAG sous forme de flux de travail AWS Glue avec des déclencheurs." } }
    - { id: d, text: { en: "Create an Amazon MWAA environment and upload the DAGs to the dags folder of its S3 bucket.", fr: "Créer un environnement Amazon MWAA et charger les DAG dans le dossier dags de son compartiment S3." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon MWAA is a managed service for Apache Airflow: workflows are written in Python as Airflow DAGs, and AWS manages the scalability, availability and security of the infrastructure. DAG files are uploaded to the dags folder of the environment's S3 bucket, so existing DAGs move with minimal changes."
    fr: "Amazon MWAA est un service géré pour Apache Airflow : les flux de travail sont écrits en Python sous forme de DAG Airflow, et AWS gère l'évolutivité, la disponibilité et la sécurité de l'infrastructure. Les fichiers DAG sont chargés dans le dossier dags du compartiment S3 de l'environnement : les DAG existants migrent avec un minimum de modifications."
  options:
    a:
      en: "Self-managed Airflow on EC2 keeps the company responsible for the Airflow infrastructure."
      fr: "Un Airflow autogéré sur EC2 laisse l'entreprise responsable de l'infrastructure Airflow."
    b:
      en: "Rewriting 60 DAGs in the Amazon States Language is far from minimal change."
      fr: "Réécrire 60 DAG en Amazon States Language est loin d'un minimum de modifications."
    c:
      en: "Glue workflows orchestrate Glue crawlers and jobs; rewriting the DAGs as workflows is a full redesign."
      fr: "Les flux de travail Glue orchestrent des robots d'analyse et des tâches Glue ; réécrire les DAG sous forme de flux de travail est une refonte complète."
references:
  - title: What Is Amazon Managed Workflows for Apache Airflow?
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html
