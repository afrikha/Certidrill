id: deac01-1b-rds-public-vendor-cidr
objective: "1.1.8"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company stores order data in an Amazon RDS for MySQL DB instance in private subnets. A SaaS analytics vendor must extract the data over the internet from two published IP address ranges. The vendor cannot use a VPN or AWS PrivateLink. No other internet source may connect to the database.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise stocke des données de commandes dans une instance de base de données Amazon RDS for MySQL située dans des sous-réseaux privés. Un éditeur SaaS d'analyse doit extraire les données par Internet depuis deux plages d'adresses IP publiées. L'éditeur ne peut pas utiliser de VPN ni AWS PrivateLink. Aucune autre source Internet ne doit pouvoir se connecter à la base de données.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a NAT gateway in a public subnet and route the DB subnets to it.", fr: "Créer une passerelle NAT dans un sous-réseau public et router vers elle les sous-réseaux de la base de données." } }
    - { id: b, text: { en: "Turn on public access for the DB instance and use a DB subnet group whose subnets all route to an internet gateway.", fr: "Activer l'accès public de l'instance de base de données et utiliser un groupe de sous-réseaux de base de données dont tous les sous-réseaux sont routés vers une passerelle Internet." } }
    - { id: c, text: { en: "Attach an IAM policy with an aws:SourceIp condition for the vendor ranges to the database user of the vendor.", fr: "Attacher à l'utilisateur de base de données de l'éditeur une politique IAM avec une condition aws:SourceIp pour les plages de l'éditeur." } }
    - { id: d, text: { en: "Add the vendor ranges to an outbound network ACL rule of the DB subnets.", fr: "Ajouter les plages de l'éditeur à une règle sortante de la liste ACL réseau des sous-réseaux de la base de données." } }
    - { id: e, text: { en: "Add inbound rules on port 3306 for the two vendor ranges to the DB instance's security group.", fr: "Ajouter au groupe de sécurité de l'instance de base de données des règles entrantes sur le port 3306 pour les deux plages de l'éditeur." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A publicly accessible DB instance gets a public IP address, and every subnet of its DB subnet group must be public with an internet gateway. Public access is still controlled by the security group, so inbound rules that allow only the two vendor ranges on the MySQL port keep every other source out."
    fr: "Une instance de base de données accessible publiquement obtient une adresse IP publique, et tous les sous-réseaux de son groupe de sous-réseaux doivent être publics avec une passerelle Internet. L'accès public reste contrôlé par le groupe de sécurité : des règles entrantes qui n'autorisent que les deux plages de l'éditeur sur le port MySQL bloquent toutes les autres sources."
  options:
    a:
      en: "A NAT gateway only lets resources in private subnets start outbound connections; it does not accept connections from the internet."
      fr: "Une passerelle NAT permet seulement aux ressources des sous-réseaux privés d'ouvrir des connexions sortantes ; elle n'accepte pas de connexions depuis Internet."
    c:
      en: "IAM policies do not control network connections to a MySQL listener; the security group decides which addresses can connect."
      fr: "Les politiques IAM ne contrôlent pas les connexions réseau vers un écouteur MySQL ; c'est le groupe de sécurité qui décide des adresses qui peuvent se connecter."
    d:
      en: "An outbound network ACL rule does not admit inbound connections, and the database would still have no public address."
      fr: "Une règle sortante de liste ACL réseau n'admet pas les connexions entrantes, et la base de données n'aurait toujours pas d'adresse publique."
references:
  - title: Working with a DB instance in a VPC
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html
  - title: Controlling access with security groups
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.RDSSecurityGroups.html
