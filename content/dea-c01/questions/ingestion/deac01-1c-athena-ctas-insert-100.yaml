id: deac01-1c-athena-ctas-insert-100
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data engineer must convert an Amazon Athena table of CSV files into a new Parquet table partitioned by day. The source holds about 3 years of data, which is more than 1,000 daily partitions. A single CREATE TABLE AS SELECT (CTAS) statement with `partitioned_by = ARRAY['day']` over the whole source fails with `HIVE_TOO_MANY_OPEN_PARTITIONS`. The engineer must complete the conversion by using only Athena SQL.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur de données doit convertir une table Amazon Athena de fichiers CSV en une nouvelle table Parquet partitionnée par jour. La source contient environ 3 ans de données, soit plus de 1 000 partitions quotidiennes. Une seule instruction CREATE TABLE AS SELECT (CTAS) avec `partitioned_by = ARRAY['day']` sur toute la source échoue avec `HIVE_TOO_MANY_OPEN_PARTITIONS`. L'ingénieur doit terminer la conversion en utilisant uniquement le SQL d'Athena.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Request an increase of the Athena DML query quota in Service Quotas, then run the CTAS statement again.", fr: "Demander une augmentation du quota de requêtes DML d'Athena dans Service Quotas, puis réexécuter l'instruction CTAS." } }
    - { id: b, text: { en: "Run CTAS for up to 100 days, then run INSERT INTO statements that each add up to 100 more days with non-overlapping filters.", fr: "Exécuter CTAS sur 100 jours au plus, puis des instructions INSERT INTO qui ajoutent chacune 100 jours au plus avec des filtres sans chevauchement." } }
    - { id: c, text: { en: "Enable partition projection on the source table, then run the CTAS statement again.", fr: "Activer la projection de partitions sur la table source, puis réexécuter l'instruction CTAS." } }
    - { id: d, text: { en: "Run CTAS without partitioned_by, then run MSCK REPAIR TABLE on the new table to create the daily partitions.", fr: "Exécuter CTAS sans partitioned_by, puis exécuter MSCK REPAIR TABLE sur la nouvelle table pour créer les partitions quotidiennes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "One CTAS query can create at most 100 partitions, and one INSERT INTO statement can add at most 100 partitions. The documented workaround is a CTAS over a subset of 100 partitions or fewer, followed by INSERT INTO statements with non-overlapping WHERE conditions, each covering 100 partitions or fewer."
    fr: "Une requête CTAS peut créer au plus 100 partitions, et une instruction INSERT INTO peut en ajouter au plus 100. La solution de contournement documentée est un CTAS sur un sous-ensemble de 100 partitions au plus, suivi d'instructions INSERT INTO avec des conditions WHERE sans chevauchement, couvrant chacune 100 partitions au plus."
  options:
    a:
      en: "The query quota limits how many queries run at the same time; the limit of 100 open partition writers per query is not raised this way."
      fr: "Le quota de requêtes limite le nombre de requêtes exécutées en même temps ; la limite de 100 écritures de partitions ouvertes par requête ne s'augmente pas de cette façon."
    c:
      en: "Partition projection helps Athena find partitions when it reads a table; it does not change how many partitions a CTAS query can write."
      fr: "La projection de partitions aide Athena à trouver les partitions lorsqu'il lit une table ; elle ne change pas le nombre de partitions qu'une requête CTAS peut écrire."
    d:
      en: "Without partitioned_by, the files are not written into per-day folders, so MSCK REPAIR TABLE has no Hive-style partitions to add."
      fr: "Sans partitioned_by, les fichiers ne sont pas écrits dans des dossiers par jour : MSCK REPAIR TABLE n'a aucune partition de style Hive à ajouter."
references:
  - title: Use CTAS and INSERT INTO to work around the 100 partition limit
    url: https://docs.aws.amazon.com/athena/latest/ug/ctas-insert-into.html
