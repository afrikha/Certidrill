id: deac01-1a-redshift-streaming-setup
objective: "1.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A logistics company wants to ingest records from an Amazon Kinesis data stream named `parcel_events` into an Amazon Redshift provisioned cluster. An IAM role that allows the Kinesis read actions is already associated with the cluster as its default role. Records must be loaded continuously as they arrive, without a scheduled job that refreshes the data, and without staging the data in Amazon S3.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de logistique veut ingérer les enregistrements d'un flux de données Amazon Kinesis nommé `parcel_events` dans un cluster provisionné Amazon Redshift. Un rôle IAM qui autorise les actions de lecture Kinesis est déjà associé au cluster comme rôle par défaut. Les enregistrements doivent être chargés en continu à leur arrivée, sans tâche planifiée qui actualise les données et sans transit des données par Amazon S3.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run `CREATE EXTERNAL SCHEMA kds FROM KINESIS IAM_ROLE default;` in the cluster.", fr: "Exécuter `CREATE EXTERNAL SCHEMA kds FROM KINESIS IAM_ROLE default;` dans le cluster." } }
    - { id: b, text: { en: "Create an Amazon Data Firehose stream that reads from `parcel_events` and delivers to the cluster.", fr: "Créer un flux Amazon Data Firehose qui lit `parcel_events` et livre vers le cluster." } }
    - { id: c, text: { en: "Schedule `REFRESH MATERIALIZED VIEW parcel_mv;` every minute in Amazon Redshift query editor v2.", fr: "Planifier `REFRESH MATERIALIZED VIEW parcel_mv;` toutes les minutes dans l'éditeur de requêtes Amazon Redshift v2." } }
    - { id: d, text: { en: "Run `CREATE MATERIALIZED VIEW parcel_mv AUTO REFRESH YES AS SELECT * FROM kds.parcel_events;`.", fr: "Exécuter `CREATE MATERIALIZED VIEW parcel_mv AUTO REFRESH YES AS SELECT * FROM kds.parcel_events;`." } }
    - { id: e, text: { en: "Create a table for the stream in the AWS Glue Data Catalog and query it through Redshift Spectrum.", fr: "Créer une table pour le flux dans AWS Glue Data Catalog et l'interroger via Redshift Spectrum." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Streaming ingestion needs an external schema created FROM KINESIS that uses the IAM role, then a materialized view that selects from the stream through that schema. AUTO REFRESH YES makes Redshift load new records as they arrive; without it, the view refreshes only when someone runs REFRESH MATERIALIZED VIEW."
    fr: "L'ingestion en streaming nécessite un schéma externe créé FROM KINESIS qui utilise le rôle IAM, puis une vue matérialisée qui lit le flux via ce schéma. AUTO REFRESH YES fait charger par Redshift les nouveaux enregistrements à leur arrivée ; sans cette option, la vue n'est actualisée que lorsque quelqu'un exécute REFRESH MATERIALIZED VIEW."
  options:
    b:
      en: "Firehose stages the records in an S3 bucket and loads them with COPY, which the requirements forbid."
      fr: "Firehose fait transiter les enregistrements par un compartiment S3 et les charge avec COPY, ce que les exigences interdisent."
    c:
      en: "A scheduled refresh is exactly the job the requirements exclude; auto refresh on the view replaces it."
      fr: "Une actualisation planifiée est précisément la tâche que les exigences excluent ; l'actualisation automatique de la vue la remplace."
    e:
      en: "Redshift Spectrum queries files in Amazon S3, not Kinesis data streams, so this does not read the stream."
      fr: "Redshift Spectrum interroge des fichiers dans Amazon S3, pas des flux de données Kinesis : cette solution ne lit pas le flux."
references:
  - title: Getting started with streaming ingestion from Amazon Kinesis Data Streams - Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-streaming-ingestion-getting-started.html
