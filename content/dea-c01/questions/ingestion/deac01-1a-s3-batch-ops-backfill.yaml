id: deac01-1a-s3-batch-ops-backfill
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores 80 million existing documents in an Amazon S3 bucket. A data engineer wrote an AWS Lambda function that extracts metadata from one object and writes it to a catalog table, and S3 Event Notifications will run it for new objects. The function must now be run once on every existing object. The run must retry transient failures and produce a report that lists the objects that failed, with the LEAST custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke 80 millions de documents existants dans un compartiment Amazon S3. Un ingénieur données a écrit une fonction AWS Lambda qui extrait les métadonnées d'un objet et les écrit dans une table de catalogue, et les notifications d'événements S3 l'exécuteront pour les nouveaux objets. La fonction doit maintenant être exécutée une fois sur chaque objet existant. L'exécution doit retenter les échecs temporaires et produire un rapport listant les objets en échec, avec le MOINS de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Copy every object onto itself with the AWS CLI so that the bucket's event notifications invoke the function for each object.", fr: "Copier chaque objet sur lui-même avec l'AWS CLI afin que les notifications d'événements du compartiment appellent la fonction pour chaque objet." } }
    - { id: b, text: { en: "Write a script that lists the bucket with ListObjectsV2 and invokes the function for each key, logging failures to a file.", fr: "Écrire un script qui liste le compartiment avec ListObjectsV2 et appelle la fonction pour chaque clé, en consignant les échecs dans un fichier." } }
    - { id: c, text: { en: "Create an S3 Batch Operations job with a manifest of the object keys, the Invoke AWS Lambda function operation, and a completion report.", fr: "Créer une tâche S3 Batch Operations avec un manifeste des clés d'objet, l'opération Invoke AWS Lambda function et un rapport d'achèvement." } }
    - { id: d, text: { en: "Run an AWS Glue Python shell job that pages through the bucket listing and calls the function for each key.", fr: "Exécuter une tâche AWS Glue Python shell qui parcourt la liste du compartiment et appelle la fonction pour chaque clé." } }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 Batch Operations runs one Lambda function on every object listed in a manifest, at a scale of billions of objects. Tasks that return TemporaryFailure are retried before the job completes, and the completion report lists each task's result. The function must accept and return the Batch Operations message format, which is a small change compared with an event function."
    fr: "S3 Batch Operations exécute une même fonction Lambda sur chaque objet listé dans un manifeste, à l'échelle de milliards d'objets. Les tâches qui renvoient TemporaryFailure sont retentées avant la fin de la tâche, et le rapport d'achèvement liste le résultat de chaque tâche. La fonction doit accepter et renvoyer le format de message de Batch Operations, une petite adaptation par rapport à une fonction événementielle."
  options:
    a:
      en: "Rewriting 80 million objects adds request costs and produces no report of failed objects."
      fr: "Réécrire 80 millions d'objets ajoute des frais de requêtes et ne produit aucun rapport des objets en échec."
    b:
      en: "The listing, invocation, retry and reporting logic is custom code to write and run."
      fr: "La logique de listage, d'appel, de nouvelle tentative et de rapport est du code personnalisé à écrire et à exécuter."
    d:
      en: "This is custom code as well, and the retry and reporting logic would still have to be written."
      fr: "Il s'agit aussi de code personnalisé, et la logique de nouvelle tentative et de rapport resterait à écrire."
references:
  - title: Invoke AWS Lambda function - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops-invoke-lambda.html
