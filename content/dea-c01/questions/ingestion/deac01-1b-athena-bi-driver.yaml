id: deac01-1b-athena-bi-driver
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Analysts at a company use a desktop business intelligence tool that connects to data sources through JDBC or ODBC. They must explore Amazon Athena tables that are defined in the AWS Glue Data Catalog directly from the tool, without exporting files.

    Which solution will meet these requirements?
  fr: |
    Les analystes d'une entreprise utilisent un outil décisionnel de bureau qui se connecte aux sources de données par JDBC ou ODBC. Ils doivent explorer directement depuis l'outil des tables Amazon Athena définies dans AWS Glue Data Catalog, sans exporter de fichiers.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Install and configure the Athena JDBC or ODBC driver in the tool and connect it to Athena.", fr: "Installer et configurer le pilote JDBC ou ODBC d'Athena dans l'outil et le connecter à Athena." }
    - id: b
      text: { en: "Install the Amazon Redshift JDBC driver in the tool and point it at the Athena endpoint.", fr: "Installer le pilote JDBC Amazon Redshift dans l'outil et le diriger vers le point de terminaison Athena." }
    - id: c
      text: { en: "Create an AWS Glue JDBC connection to the tool and run a Glue job that pushes the tables to it.", fr: "Créer une connexion JDBC AWS Glue vers l'outil et exécuter une tâche Glue qui lui envoie les tables." }
    - id: d
      text: { en: "Run a scheduled Athena query that writes CSV results to Amazon S3 and open the files in the tool.", fr: "Exécuter une requête Athena planifiée qui écrit les résultats CSV dans Amazon S3 et ouvrir les fichiers dans l'outil." }
answer: { optionId: a }
explanation:
  correct:
    en: "To explore and visualize Athena data with business intelligence tools, you download, install, and configure the Athena ODBC or JDBC driver. The tool then sends SQL queries to Athena, which reads the tables of the Data Catalog in place."
    fr: "Pour explorer et visualiser des données Athena avec des outils décisionnels, on télécharge, installe et configure le pilote ODBC ou JDBC d'Athena. L'outil envoie alors des requêtes SQL à Athena, qui lit sur place les tables du Data Catalog."
  options:
    b:
      en: "The Redshift driver speaks to Amazon Redshift endpoints, not to the Athena service."
      fr: "Le pilote Redshift communique avec des points de terminaison Amazon Redshift, pas avec le service Athena."
    c:
      en: "A Glue connection is for jobs and crawlers to reach data stores; a desktop tool is not a Glue target, and data would be copied."
      fr: "Une connexion Glue sert aux tâches et aux robots d'analyse pour atteindre des magasins de données ; un outil de bureau n'est pas une cible Glue, et les données seraient copiées."
    d:
      en: "CSV exports are the file exports that the analysts want to avoid, and they are not interactive exploration."
      fr: "Des exportations CSV sont justement les exportations de fichiers que les analystes veulent éviter, et ce n'est pas une exploration interactive."
references:
  - title: Connect to Amazon Athena with ODBC and JDBC drivers
    url: https://docs.aws.amazon.com/athena/latest/ug/athena-bi-tools-jdbc-odbc.html
