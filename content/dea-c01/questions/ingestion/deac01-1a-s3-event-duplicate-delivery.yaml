id: deac01-1a-s3-event-duplicate-delivery
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An S3 Event Notification invokes an AWS Lambda function for every new file in an Amazon S3 bucket. The function adds the rows of each file to daily totals in an Amazon DynamoDB table. Occasionally, the totals for a file are added twice, although the file was uploaded once and the function logged no errors.

    Which solution will prevent the duplicated totals?
  fr: |
    Une notification d'événement S3 appelle une fonction AWS Lambda pour chaque nouveau fichier d'un compartiment Amazon S3. La fonction ajoute les lignes de chaque fichier à des totaux quotidiens dans une table Amazon DynamoDB. Il arrive que les totaux d'un fichier soient ajoutés deux fois, alors que le fichier n'a été chargé qu'une fois et que la fonction n'a consigné aucune erreur.

    Quelle solution empêche les totaux en double ?
body:
  options:
    - { id: a, text: { en: "Send the notifications to an Amazon SQS FIFO queue with content-based deduplication and trigger the function from the queue.", fr: "Envoyer les notifications à une file d'attente Amazon SQS FIFO avec déduplication basée sur le contenu et déclencher la fonction à partir de la file." } }
    - { id: b, text: { en: "Record each processed object key and version with a conditional write, and skip objects that are already recorded.", fr: "Enregistrer chaque clé et version d'objet traitée par une écriture conditionnelle, et ignorer les objets déjà enregistrés." } }
    - { id: c, text: { en: "Set the reserved concurrency of the function to 1 so that only one notification is processed at a time.", fr: "Définir la simultanéité réservée de la fonction à 1 afin qu'une seule notification soit traitée à la fois." } }
    - { id: d, text: { en: "Turn on S3 Versioning for the bucket so that each upload creates only one notification.", fr: "Activer S3 Versioning sur le compartiment afin que chaque chargement ne crée qu'une seule notification." } }
answer: { optionId: b }
explanation:
  correct:
    en: "S3 Event Notifications are designed to be delivered at least once, so the same event can occasionally arrive twice. The consumer must be idempotent: recording each processed object with a conditional write, and skipping objects already recorded, makes a repeated notification harmless."
    fr: "Les notifications d'événements S3 sont conçues pour être livrées au moins une fois : un même événement peut donc parfois arriver deux fois. Le consommateur doit être idempotent : enregistrer chaque objet traité par une écriture conditionnelle, et ignorer les objets déjà enregistrés, rend inoffensive une notification répétée."
  options:
    a:
      en: "SQS FIFO queues are not supported as S3 event notification destinations."
      fr: "Les files d'attente SQS FIFO ne sont pas prises en charge comme destinations de notification d'événement S3."
    c:
      en: "Processing one event at a time does not stop a duplicated event from being processed again."
      fr: "Traiter un événement à la fois n'empêche pas un événement en double d'être traité à nouveau."
    d:
      en: "Versioning keeps object versions; it does not change the at-least-once delivery of notifications."
      fr: "La gestion des versions conserve les versions des objets ; elle ne change pas la livraison au moins une fois des notifications."
references:
  - title: Amazon S3 Event Notifications - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html
