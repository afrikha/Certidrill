id: deac01-1c-glue-python-shell-small
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company receives one 20 MB CSV file from a supplier each day. An AWS Glue Spark job with 10 G.1X workers cleans the file with pandas code that does not use Spark and writes the result to Amazon S3. The job runs for 3 minutes, and the file size is not expected to grow. The company wants the MOST cost-effective way to keep running this transformation in AWS Glue.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution reçoit chaque jour un fichier CSV de 20 Mo d'un fournisseur. Une tâche Spark AWS Glue avec 10 workers G.1X nettoie le fichier avec du code pandas qui n'utilise pas Spark, puis écrit le résultat dans Amazon S3. La tâche s'exécute en 3 minutes et la taille du fichier ne devrait pas augmenter. L'entreprise veut la solution la PLUS rentable pour continuer à exécuter cette transformation dans AWS Glue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable auto scaling on the Spark job and keep 10 workers as the maximum.", fr: "Activer la mise à l'échelle automatique de la tâche Spark et conserver 10 workers comme maximum." } }
    - { id: b, text: { en: "Reduce the Spark job to 2 G.1X workers and use the Flex execution class.", fr: "Réduire la tâche Spark à 2 workers G.1X et utiliser la classe d'exécution Flex." } }
    - { id: c, text: { en: "Run the script as an AWS Glue Python shell job with a capacity of 0.0625 DPU.", fr: "Exécuter le script comme tâche AWS Glue Python shell avec une capacité de 0,0625 DPU." } }
    - { id: d, text: { en: "Run the script on an Amazon EMR Serverless application with pre-initialized capacity.", fr: "Exécuter le script sur une application Amazon EMR Serverless avec une capacité pré-initialisée." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Python shell jobs run plain Python scripts, including pandas code, with a capacity of 0.0625 DPU (the default) or 1 DPU. A 20 MB file does not need distributed Spark workers, so a 1/16 DPU Python shell job is far cheaper than any Spark job."
    fr: "Les tâches Python shell exécutent des scripts Python simples, y compris du code pandas, avec une capacité de 0,0625 DPU (valeur par défaut) ou 1 DPU. Un fichier de 20 Mo n'a pas besoin de workers Spark distribués : une tâche Python shell à 1/16 de DPU coûte bien moins que n'importe quelle tâche Spark."
  options:
    a:
      en: "Auto scaling removes idle executors, but a Spark job still bills whole G.1X workers of 1 DPU each, far more than 0.0625 DPU."
      fr: "La mise à l'échelle automatique supprime les exécuteurs inactifs, mais une tâche Spark facture toujours des workers G.1X entiers de 1 DPU chacun, bien plus que 0,0625 DPU."
    b:
      en: "Flex lowers the price per DPU-hour, but two G.1X workers still use 2 DPUs, 32 times the capacity of the smallest Python shell job."
      fr: "Flex réduit le prix par DPU-heure, mais deux workers G.1X utilisent toujours 2 DPU, soit 32 fois la capacité de la plus petite tâche Python shell."
    d:
      en: "EMR Serverless runs Spark or Hive outside AWS Glue, and pre-initialized capacity keeps warm workers that add cost for a 3-minute daily job."
      fr: "EMR Serverless exécute Spark ou Hive en dehors d'AWS Glue, et la capacité pré-initialisée garde des workers prêts qui ajoutent un coût pour une tâche quotidienne de 3 minutes."
references:
  - title: Configuring job properties for Python shell jobs in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/add-job-python.html
