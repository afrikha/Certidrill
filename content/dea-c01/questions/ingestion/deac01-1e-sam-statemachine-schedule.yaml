id: deac01-1e-sam-statemachine-schedule
objective: "1.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company orchestrates a nightly batch ingestion with an AWS Step Functions state machine. The state machine is defined as an AWS::Serverless::StateMachine resource in an AWS SAM template. It must start every day at 02:00 UTC. The schedule must be deployed with the same template and require the LEAST additional code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise orchestre une ingestion par lots nocturne avec une machine d'état AWS Step Functions. La machine d'état est définie comme une ressource AWS::Serverless::StateMachine dans un modèle AWS SAM. Elle doit démarrer chaque jour à 02:00 UTC. La planification doit être déployée avec le même modèle et demander le MOINS de code supplémentaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an AWS Lambda function with a Schedule event that calls the StartExecution API of the state machine.", fr: "Ajouter une fonction AWS Lambda avec un événement Schedule qui appelle l'API StartExecution de la machine d'état." } }
    - { id: b, text: { en: "Create an Amazon EventBridge Scheduler schedule in the console that targets the state machine.", fr: "Créer une planification Amazon EventBridge Scheduler dans la console qui cible la machine d'état." } }
    - { id: c, text: { en: "Add a Wait state at the start of the definition that waits until 02:00 UTC before the first task.", fr: "Ajouter un état Wait au début de la définition qui attend 02:00 UTC avant la première tâche." } }
    - { id: d, text: { en: "Add an event of type ScheduleV2 with the expression cron(0 2 * * ? *) to the Events property of the state machine.", fr: "Ajouter un événement de type ScheduleV2 avec l'expression cron(0 2 * * ? *) à la propriété Events de la machine d'état." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS::Serverless::StateMachine has an Events property whose event sources include Schedule and ScheduleV2. A ScheduleV2 event creates an EventBridge Scheduler schedule that starts the state machine, in the same template and without any function code."
    fr: "AWS::Serverless::StateMachine possède une propriété Events dont les sources d'événements incluent Schedule et ScheduleV2. Un événement ScheduleV2 crée une planification EventBridge Scheduler qui démarre la machine d'état, dans le même modèle et sans aucun code de fonction."
  options:
    a:
      en: "This works but adds a function and code that the state machine event source makes unnecessary."
      fr: "Cela fonctionne, mais ajoute une fonction et du code que la source d'événements de la machine d'état rend inutiles."
    b:
      en: "A schedule created in the console is not deployed with the template."
      fr: "Une planification créée dans la console n'est pas déployée avec le modèle."
    c:
      en: "A Wait state only delays an execution that has already started; something must still start the state machine every day."
      fr: "Un état Wait ne fait que retarder une exécution déjà démarrée : il faut toujours démarrer la machine d'état chaque jour."
references:
  - title: EventSource
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-property-statemachine-statemachineeventsource.html
