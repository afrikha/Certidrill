id: deac01-1b-replayable-sources
objective: "1.1.11"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A data engineer is choosing the event sources of a new ingestion pipeline. A consumer that is deployed later must be able to read events that were produced up to 5 days earlier, without asking the producers to send them again.

    Which sources will meet this requirement? (Choose two.)
  fr: |
    Un ingénieur de données choisit les sources d'événements d'un nouveau pipeline d'ingestion. Un consommateur déployé plus tard doit pouvoir lire des événements produits jusqu'à 5 jours plus tôt, sans demander aux producteurs de les renvoyer.

    Quelles sources répondent à cette exigence ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A DynamoDB stream on the source table", fr: "Un flux DynamoDB sur la table source" } }
    - { id: b, text: { en: "A Kinesis data stream with a retention period of 168 hours", fr: "Un flux de données Kinesis avec une période de conservation de 168 heures" } }
    - { id: c, text: { en: "An Amazon MSK topic with a retention period of 7 days", fr: "Une rubrique Amazon MSK avec une période de conservation de 7 jours" } }
    - { id: d, text: { en: "An SNS standard topic that the producers publish to", fr: "Une rubrique SNS standard dans laquelle publient les producteurs" } }
    - { id: e, text: { en: "An SQS queue whose current consumer deletes each message after processing", fr: "Une file d'attente SQS dont le consommateur actuel supprime chaque message après traitement" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "Kinesis Data Streams and Kafka topics keep records for their retention period whether or not they were read, and a new consumer can start from an earlier position. A Kinesis stream can keep data for up to 365 days, and an MSK topic keeps it for its configured retention."
    fr: "Kinesis Data Streams et les rubriques Kafka conservent les enregistrements pendant leur période de conservation, qu'ils aient été lus ou non, et un nouveau consommateur peut démarrer à une position antérieure. Un flux Kinesis peut conserver les données jusqu'à 365 jours, et une rubrique MSK pendant la conservation configurée."
  options:
    a:
      en: "DynamoDB Streams keeps stream records for up to 24 hours only."
      fr: "DynamoDB Streams ne conserve les enregistrements de flux que jusqu'à 24 heures."
    d:
      en: "SNS pushes each message to the current subscribers and does not keep a history that a later subscriber can read."
      fr: "SNS pousse chaque message vers les abonnés actuels et ne conserve pas d'historique qu'un abonné ultérieur pourrait lire."
    e:
      en: "A message deleted by the existing consumer is gone from the queue, so a later consumer cannot read it."
      fr: "Un message supprimé par le consommateur existant a disparu de la file : un consommateur ultérieur ne peut pas le lire."
references:
  - title: Change the data retention period
    url: https://docs.aws.amazon.com/streams/latest/dev/kinesis-extended-retention.html
  - title: Change data capture for DynamoDB Streams
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html
