id: deac01-1b-sns-fifo-fanout
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company publishes order status changes from its order service. A billing application and a shipping application must each receive every change, in order for each order, and without duplicates. An analytics application must also receive every change to aggregate it in Amazon S3, but it does not need ordering.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce électronique publie les changements de statut des commandes depuis son service de commandes. Une application de facturation et une application d'expédition doivent chacune recevoir chaque changement, dans l'ordre pour chaque commande et sans doublon. Une application d'analyse doit aussi recevoir chaque changement pour l'agréger dans Amazon S3, mais elle n'a pas besoin d'ordre.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send the changes to one SQS FIFO queue with the order ID as the message group ID, and let the three applications poll that queue.", fr: "Envoyer les changements dans une file d'attente SQS FIFO avec l'ID de commande comme ID de groupe de messages, et laisser les trois applications interroger cette file." }
    - id: b
      text: { en: "Publish the changes to an SNS standard topic with three SQS standard queues subscribed, and remove duplicates in each application.", fr: "Publier les changements dans une rubrique SNS standard à laquelle trois files d'attente SQS standard sont abonnées, et supprimer les doublons dans chaque application." }
    - id: c
      text: { en: "Use an SNS FIFO topic grouped by order ID, with SQS FIFO queues for billing and shipping and an SQS standard queue for analytics.", fr: "Utiliser une rubrique SNS FIFO groupée par ID de commande, avec des files SQS FIFO pour la facturation et l'expédition et une file SQS standard pour l'analyse." }
    - id: d
      text: { en: "Publish the changes to an SNS FIFO topic and subscribe one SQS FIFO queue that the three applications share and poll.", fr: "Publier les changements dans une rubrique SNS FIFO et abonner une seule file SQS FIFO que les trois applications partagent et interrogent." }
answer: { optionId: c }
explanation:
  correct:
    en: "An SNS FIFO topic fans out each message to all its subscriptions, and SQS FIFO subscribers receive the messages in order within a message group and without duplication. A FIFO topic can also deliver to an SQS standard queue, which suits the analytics application that does not need ordering."
    fr: "Une rubrique SNS FIFO diffuse chaque message vers tous ses abonnements, et les abonnés SQS FIFO reçoivent les messages dans l'ordre au sein d'un groupe de messages et sans doublon. Une rubrique FIFO peut aussi livrer à une file SQS standard, ce qui convient à l'application d'analyse qui n'a pas besoin d'ordre."
  options:
    a:
      en: "Each message of a queue is processed by one consumer, so the three applications would split the changes instead of each receiving all of them."
      fr: "Chaque message d'une file est traité par un seul consommateur : les trois applications se partageraient les changements au lieu de les recevoir tous."
    b:
      en: "Standard topics and queues do not preserve order, so billing and shipping could process the changes of an order in the wrong order."
      fr: "Les rubriques et files standard ne préservent pas l'ordre : la facturation et l'expédition pourraient traiter les changements d'une commande dans le mauvais ordre."
    d:
      en: "A single shared queue gives each change to only one of the applications, so the fan-out to three consumers is lost."
      fr: "Une seule file partagée ne donne chaque changement qu'à une des applications : la diffusion vers trois consommateurs est perdue."
references:
  - title: Amazon SNS FIFO topic example use case
    url: https://docs.aws.amazon.com/sns/latest/dg/fifo-example-use-case.html
