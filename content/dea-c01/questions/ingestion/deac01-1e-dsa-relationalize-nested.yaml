id: deac01-1e-dsa-relationalize-nested
objective: "1.4.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A partner sends order documents in JSON. Each order contains a nested customer structure and an array of line items, and each line item contains its own array of discounts, so every document is a tree of varying depth and size. Analysts need flat relational tables in Amazon Redshift that they can join by keys. The data engineer uses an AWS Glue ETL job and wants to write the LEAST code.

    Which solution will meet these requirements?
  fr: |
    Un partenaire envoie des documents de commande en JSON. Chaque commande contient une structure client imbriquée et un tableau de lignes de commande, et chaque ligne contient son propre tableau de remises : chaque document est donc un arbre de profondeur et de taille variables. Les analystes ont besoin de tables relationnelles plates dans Amazon Redshift qu'ils peuvent joindre par des clés. L'ingénieur de données utilise une tâche ETL AWS Glue et veut écrire le MOINS de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use the ApplyMapping transform to map each nested field and each array element to its own top-level column.", fr: "Utiliser la transformation ApplyMapping pour associer chaque champ imbriqué et chaque élément de tableau à sa propre colonne de premier niveau." } }
    - { id: b, text: { en: "Call relationalize on the DynamicFrame, and write each frame of the returned collection to its own Redshift table.", fr: "Appeler relationalize sur le DynamicFrame, et écrire chaque frame de la collection renvoyée dans sa propre table Redshift." } }
    - { id: c, text: { en: "Run a crawler with a custom JSON classifier so that the Data Catalog table is created with a flat schema.", fr: "Exécuter un crawler avec un classifieur JSON personnalisé afin que la table du catalogue de données soit créée avec un schéma plat." } }
    - { id: d, text: { en: "Write a recursive Python function that walks each document and builds the rows of every table by hand.", fr: "Écrire une fonction Python récursive qui parcourt chaque document et construit à la main les lignes de chaque table." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Relationalize flattens the nested structures of a DynamicFrame and pivots each array column out into a separate table. Each pivoted table can be joined back to the root table with the join key generated during the unnest phase, which turns the tree into relational tables with one call."
    fr: "Relationalize aplatit les structures imbriquées d'un DynamicFrame et extrait chaque colonne de tableau dans une table distincte. Chaque table extraite peut être jointe à la table racine avec la clé de jointure générée pendant la phase de désimbrication, ce qui transforme l'arbre en tables relationnelles en un seul appel."
  options:
    a:
      en: "Arrays have a variable number of elements, so they cannot be mapped to a fixed set of columns."
      fr: "Les tableaux ont un nombre variable d'éléments : ils ne peuvent pas être associés à un ensemble fixe de colonnes."
    c:
      en: "A classifier recognizes the format and schema of the data; it does not split arrays into separate tables."
      fr: "Un classifieur reconnaît le format et le schéma des données ; il ne sépare pas les tableaux en tables distinctes."
    d:
      en: "Custom recursive code works but is far more code than the built-in transform."
      fr: "Du code récursif personnalisé fonctionne, mais représente beaucoup plus de code que la transformation intégrée."
references:
  - title: Relationalize class
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-crawler-pyspark-transforms-Relationalize.html
