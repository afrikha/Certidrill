id: deac01-1b-glue-onprem-jdbc
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company must read tables from an on-premises Oracle database with an AWS Glue ETL job over JDBC. The data center connects to a VPC through an AWS Site-to-Site VPN connection, and all traffic to the database must use the VPN. The VPC already has an S3 gateway endpoint, and the on-premises firewall blocks every source that is not explicitly allowed.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise industrielle doit lire des tables d'une base de données Oracle sur site avec une tâche ETL AWS Glue par JDBC. Le centre de données est connecté à un VPC par une connexion AWS Site-to-Site VPN, et tout le trafic vers la base de données doit passer par le VPN. Le VPC dispose déjà d'un point de terminaison de passerelle S3, et le pare-feu sur site bloque toute source qui n'est pas explicitement autorisée.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the Glue connection in a private subnet whose route table sends the on-premises CIDR range to the VPN gateway.", fr: "Créer la connexion Glue dans un sous-réseau privé dont la table de routage envoie la plage CIDR sur site vers la passerelle VPN." } }
    - { id: b, text: { en: "Allow the Elastic IP address of a NAT gateway of the VPC in the on-premises firewall.", fr: "Autoriser l'adresse IP Elastic d'une passerelle NAT du VPC dans le pare-feu sur site." } }
    - { id: c, text: { en: "Associate Elastic IP addresses with the network interfaces of the Glue job and allow them in the firewall.", fr: "Associer des adresses IP Elastic aux interfaces réseau de la tâche Glue et les autoriser dans le pare-feu." } }
    - { id: d, text: { en: "Allow the private CIDR range of the Glue connection's subnet on the Oracle port in the on-premises firewall.", fr: "Autoriser la plage CIDR privée du sous-réseau de la connexion Glue sur le port Oracle dans le pare-feu sur site." } }
    - { id: e, text: { en: "Make the Oracle listener reachable from the internet and run the job without a connection.", fr: "Rendre l'écouteur Oracle accessible depuis Internet et exécuter la tâche sans connexion." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The JDBC data store must be reachable from the subnet of the Glue connection, so that subnet needs a route to the data center through the VPN. Glue gives the job's network interfaces private IP addresses from that subnet only, so the on-premises firewall must allow the subnet's private range."
    fr: "Le magasin de données JDBC doit être accessible depuis le sous-réseau de la connexion Glue : ce sous-réseau a donc besoin d'un itinéraire vers le centre de données par le VPN. Glue n'attribue aux interfaces réseau de la tâche que des adresses IP privées de ce sous-réseau : le pare-feu sur site doit donc autoriser la plage privée du sous-réseau."
  options:
    b:
      en: "Traffic over the VPN keeps the private source addresses of the subnet and does not go through a NAT gateway to the internet."
      fr: "Le trafic par le VPN conserve les adresses source privées du sous-réseau et ne passe pas par une passerelle NAT vers Internet."
    c:
      en: "Glue manages the network interfaces of a job and assigns no public IP addresses to them."
      fr: "Glue gère les interfaces réseau d'une tâche et ne leur attribue aucune adresse IP publique."
    e:
      en: "Exposing the database on the internet breaks the requirement that all traffic to it uses the VPN."
      fr: "Exposer la base de données sur Internet enfreint l'exigence selon laquelle tout le trafic vers elle passe par le VPN."
references:
  - title: Setting up network access to data stores
    url: https://docs.aws.amazon.com/glue/latest/dg/start-connecting.html
