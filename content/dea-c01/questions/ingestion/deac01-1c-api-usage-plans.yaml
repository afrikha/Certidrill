id: deac01-1c-api-usage-plans
objective: "1.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A market data company exposes curated datasets to 30 partner companies through an Amazon API Gateway REST API backed by AWS Lambda. Each partner must be identified on every request and must be limited to its own request rate and monthly number of requests, which differ by contract tier.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de données de marché expose des jeux de données organisés à 30 entreprises partenaires au moyen d'une API REST Amazon API Gateway reposant sur AWS Lambda. Chaque partenaire doit être identifié à chaque requête et limité à son propre débit de requêtes et à son propre nombre mensuel de requêtes, qui diffèrent selon le niveau de contrat.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create usage plans with throttling and quota limits for each tier, associate them with the API stage, and add each partner's API key.", fr: "Créer des plans d'utilisation avec des limites de débit (throttling) et de quota pour chaque niveau, les associer à l'étape de l'API et y ajouter la clé d'API de chaque partenaire." } }
    - { id: b, text: { en: "Configure the API methods to require an API key.", fr: "Configurer les méthodes de l'API pour qu'elles exigent une clé d'API." } }
    - { id: c, text: { en: "Set default method throttling on the API stage to the rate of the smallest tier.", fr: "Définir la limitation par défaut des méthodes de l'étape de l'API au débit du plus petit niveau." } }
    - { id: d, text: { en: "Set reserved concurrency on the Lambda function to the sum of the partner rates.", fr: "Définir la simultanéité réservée de la fonction Lambda à la somme des débits des partenaires." } }
    - { id: e, text: { en: "Enable API caching on the stage with a time to live of 1 hour.", fr: "Activer la mise en cache de l'API sur l'étape avec une durée de vie de 1 heure." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "A usage plan uses API keys to identify clients and applies throttling and quota limits to each key, so each tier can have its own limits. The methods must require an API key so that every request carries a valid key associated with a usage plan of the stage. API keys identify callers for metering; they should not replace an authorizer for authentication."
    fr: "Un plan d'utilisation identifie les clients par des clés d'API et applique des limites de débit et de quota à chaque clé : chaque niveau peut avoir ses propres limites. Les méthodes doivent exiger une clé d'API pour que chaque requête comporte une clé valide associée à un plan d'utilisation de l'étape. Les clés d'API identifient les appelants pour le comptage ; elles ne doivent pas remplacer un mécanisme d'autorisation pour l'authentification."
  options:
    c:
      en: "Stage throttling applies to all callers together and cannot set a monthly quota per partner."
      fr: "La limitation de l'étape s'applique à tous les appelants ensemble et ne peut pas définir de quota mensuel par partenaire."
    d:
      en: "Reserved concurrency caps the function as a whole; it neither identifies partners nor limits each one."
      fr: "La simultanéité réservée plafonne la fonction dans son ensemble ; elle n'identifie pas les partenaires et ne limite pas chacun d'eux."
    e:
      en: "Caching reduces calls to the backend but enforces no per-partner rate or quota."
      fr: "La mise en cache réduit les appels au backend, mais n'impose aucun débit ni quota par partenaire."
references:
  - title: Usage plans and API keys for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
