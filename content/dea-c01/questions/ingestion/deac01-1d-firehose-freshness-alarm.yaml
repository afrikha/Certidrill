id: deac01-1d-firehose-freshness-alarm
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon Data Firehose stream with Direct PUT to deliver application logs to Amazon S3 with a 5-minute buffer interval. Last week a change to the IAM role of the stream blocked delivery for several hours before anyone noticed. The operations team must receive an SNS notification when records that Firehose has received are not delivered to S3 within 15 minutes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un flux Amazon Data Firehose en Direct PUT pour livrer des journaux d'application dans Amazon S3 avec un intervalle de mise en mémoire tampon de 5 minutes. La semaine dernière, une modification du rôle IAM du flux a bloqué la livraison pendant plusieurs heures avant que quiconque ne s'en aperçoive. L'équipe d'exploitation doit recevoir une notification SNS lorsque des enregistrements reçus par Firehose ne sont pas livrés dans S3 dans un délai de 15 minutes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch alarm on the IncomingBytes metric of the stream that fires when the value drops below the usual volume, with an SNS action.", fr: "Créer une alarme CloudWatch sur la métrique IncomingBytes du flux qui se déclenche lorsque la valeur passe sous le volume habituel, avec une action SNS." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the ThrottledRecords metric of the stream that fires when the value is greater than 0, with an SNS action.", fr: "Créer une alarme CloudWatch sur la métrique ThrottledRecords du flux qui se déclenche lorsque la valeur est supérieure à 0, avec une action SNS." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the DeliveryToS3.DataFreshness metric that fires when the Maximum statistic exceeds 900 seconds, with an SNS action.", fr: "Créer une alarme CloudWatch sur la métrique DeliveryToS3.DataFreshness qui se déclenche lorsque la statistique Maximum dépasse 900 secondes, avec une action SNS." } }
    - { id: d, text: { en: "Configure an S3 event notification on the destination bucket that publishes each new object to the SNS topic.", fr: "Configurer une notification d'événement S3 sur le compartiment de destination qui publie chaque nouvel objet dans la rubrique SNS." } }
answer: { optionId: c }
explanation:
  correct:
    en: "DeliveryToS3.DataFreshness is the age of the oldest record in Firehose that is not yet delivered to S3. When delivery stops, for example because of a permission error, the value keeps growing, so an alarm on its Maximum above 900 seconds detects records that wait longer than 15 minutes."
    fr: "DeliveryToS3.DataFreshness indique l'âge du plus ancien enregistrement de Firehose qui n'est pas encore livré dans S3. Lorsque la livraison s'arrête, par exemple à cause d'une erreur d'autorisation, la valeur ne cesse d'augmenter : une alarme sur son Maximum au-delà de 900 secondes détecte les enregistrements qui attendent plus de 15 minutes."
  options:
    a: { en: "IncomingBytes measures what producers send to the stream; it stays normal when delivery to S3 fails.", fr: "IncomingBytes mesure ce que les producteurs envoient au flux ; la valeur reste normale lorsque la livraison dans S3 échoue." }
    b: { en: "ThrottledRecords counts records rejected at ingestion because a stream limit was exceeded, not records waiting for delivery.", fr: "ThrottledRecords compte les enregistrements rejetés à l'ingestion parce qu'une limite du flux a été dépassée, pas les enregistrements en attente de livraison." }
    d: { en: "An event per delivered object reports successful deliveries; it sends nothing when delivery stops, which is the case to detect.", fr: "Un événement par objet livré signale les livraisons réussies ; il n'envoie rien lorsque la livraison s'arrête, ce qui est précisément le cas à détecter." }
references:
  - title: Monitor Amazon Data Firehose with CloudWatch metrics
    url: https://docs.aws.amazon.com/firehose/latest/dev/monitoring-with-cloudwatch-metrics.html
