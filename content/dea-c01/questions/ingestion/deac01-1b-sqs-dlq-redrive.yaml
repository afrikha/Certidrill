id: deac01-1b-sqs-dlq-redrive
objective: "1.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company ingests order files through an Amazon SQS queue that an AWS Lambda function processes. After a producer changed its message format, the function failed and the redrive policy moved 5,000 messages to a dead-letter queue. The function is now fixed. The messages must be processed again with the least effort and without changes to the producers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise ingère des fichiers de commandes par une file d'attente Amazon SQS qu'une fonction AWS Lambda traite. Après qu'un producteur a modifié le format de ses messages, la fonction a échoué et la politique de redirection a déplacé 5 000 messages vers une file d'attente de lettres mortes. La fonction est maintenant corrigée. Les messages doivent être traités à nouveau avec le moins d'effort possible et sans modifier les producteurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the maxReceiveCount value of the redrive policy on the source queue.", fr: "Augmenter la valeur maxReceiveCount de la politique de redirection de la file source." }
    - id: b
      text: { en: "Start a dead-letter queue redrive that moves the messages back to the source queue.", fr: "Démarrer une redirection de la file d'attente de lettres mortes qui renvoie les messages vers la file source." }
    - id: c
      text: { en: "Increase the message retention period of the source queue to 14 days.", fr: "Augmenter la période de conservation des messages de la file source à 14 jours." }
    - id: d
      text: { en: "Purge the dead-letter queue and ask the producer to send the 5,000 orders again.", fr: "Purger la file d'attente de lettres mortes et demander au producteur de renvoyer les 5 000 commandes." }
answer: { optionId: b }
explanation:
  correct:
    en: "A dead-letter queue redrive moves unconsumed messages from the dead-letter queue back to their source queue, or to another queue of the same type, at a system-optimized or custom rate. The fixed function then processes them, with no script and no producer change."
    fr: "Une redirection de file d'attente de lettres mortes déplace les messages non consommés de la file de lettres mortes vers leur file source, ou vers une autre file du même type, à un débit optimisé par le système ou personnalisé. La fonction corrigée les traite ensuite, sans script ni modification des producteurs."
  options:
    a:
      en: "maxReceiveCount affects future failures only; it does not bring back messages already in the dead-letter queue."
      fr: "maxReceiveCount ne concerne que les échecs futurs ; il ne ramène pas les messages déjà présents dans la file de lettres mortes."
    c:
      en: "The messages are no longer in the source queue, so a longer retention period there does not reprocess them."
      fr: "Les messages ne sont plus dans la file source : une conservation plus longue dans cette file ne les fait pas retraiter."
    d:
      en: "Purging deletes the messages and makes the producer resend them, which is more effort and needs the producer to change its behavior."
      fr: "La purge supprime les messages et oblige le producteur à les renvoyer, ce qui demande plus d'effort et une intervention du producteur."
references:
  - title: Learn how to configure a dead-letter queue redrive in Amazon SQS
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-dead-letter-queue-redrive.html
