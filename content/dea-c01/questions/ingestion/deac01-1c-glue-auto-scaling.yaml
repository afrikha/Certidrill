id: deac01-1c-glue-auto-scaling
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs a time-sensitive AWS Glue 4.0 Spark job with 50 G.1X workers. It must start immediately when it is triggered. Job metrics show that all workers are busy during the first stage, but only a few workers are active during the later stages, and the company pays for the idle workers. The company wants to reduce cost without making the first stage slower.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers exécute une tâche Spark AWS Glue 4.0 critique en temps, avec 50 workers G.1X. Elle doit démarrer immédiatement lorsqu'elle est déclenchée. Les métriques de la tâche montrent que tous les workers sont occupés pendant la première étape, mais que seuls quelques workers sont actifs pendant les étapes suivantes, et l'entreprise paie pour les workers inactifs. L'entreprise veut réduire le coût sans ralentir la première étape.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Reduce the number of workers to 10 and keep the Standard execution class.", fr: "Réduire le nombre de workers à 10 et conserver la classe d'exécution Standard." } }
    - { id: b, text: { en: "Change the execution class of the job to Flex and keep 50 workers.", fr: "Remplacer la classe d'exécution de la tâche par Flex et conserver 50 workers." } }
    - { id: c, text: { en: "Enable auto scaling for the job and set the maximum number of workers to 50.", fr: "Activer la mise à l'échelle automatique de la tâche et définir le nombre maximal de workers à 50." } }
    - { id: d, text: { en: "Change the worker type to G.025X and increase the number of workers to 200.", fr: "Remplacer le type de worker par G.025X et augmenter le nombre de workers à 200." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With auto scaling (AWS Glue 3.0 and later), AWS Glue adds workers when Spark requests more executors and removes a worker when its executor is idle. The job still gets up to 50 workers for the first stage, and the run is billed on the DPU-seconds actually used."
    fr: "Avec la mise à l'échelle automatique (à partir d'AWS Glue 3.0), AWS Glue ajoute des workers lorsque Spark demande plus d'exécuteurs et supprime un worker lorsque son exécuteur est inactif. La tâche dispose toujours de 50 workers au maximum pour la première étape, et l'exécution est facturée sur les DPU-secondes réellement utilisées."
  options:
    a:
      en: "Ten workers would make the first stage, which uses all 50 workers, much slower."
      fr: "Dix workers ralentiraient fortement la première étape, qui utilise les 50 workers."
    b:
      en: "Flex is for non-urgent jobs whose start time can vary, which fails the requirement to start immediately."
      fr: "Flex est destiné aux tâches non urgentes dont l'heure de démarrage peut varier, ce qui ne respecte pas l'exigence de démarrage immédiat."
    d:
      en: "The G.025X worker type is available only for AWS Glue streaming jobs, not for batch Spark ETL jobs."
      fr: "Le type de worker G.025X n'est disponible que pour les tâches de streaming AWS Glue, pas pour les tâches ETL Spark par lots."
references:
  - title: Using auto scaling for AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/auto-scaling.html
  - title: Configuring job properties for Spark jobs in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/add-job.html
