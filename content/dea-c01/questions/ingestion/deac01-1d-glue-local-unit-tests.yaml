id: deac01-1d-glue-local-unit-tests
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team writes AWS Glue 5.0 Spark jobs in Python that use GlueContext and DynamicFrame transforms. The team wants to run pytest unit tests of the transforms on developer laptops and in the CI pipeline before every deployment, without starting job runs or sessions in AWS Glue.

    Which solution will meet these requirements?
  fr: |
    Une équipe écrit en Python des tâches Spark AWS Glue 5.0 qui utilisent GlueContext et des transformations DynamicFrame. L'équipe veut exécuter des tests unitaires pytest des transformations sur les postes des développeurs et dans le pipeline CI avant chaque déploiement, sans démarrer d'exécutions de tâches ni de sessions dans AWS Glue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run pytest inside the AWS Glue Docker image (aws-glue-libs) that matches Glue 5.0.", fr: "Exécuter pytest dans l'image Docker AWS Glue (aws-glue-libs) correspondant à Glue 5.0." } }
    - { id: b, text: { en: "Run each test in an AWS Glue interactive session started from the CI pipeline.", fr: "Exécuter chaque test dans une session interactive AWS Glue démarrée depuis le pipeline CI." } }
    - { id: c, text: { en: "Run the tests as an AWS Glue Python shell job that the CI pipeline starts.", fr: "Exécuter les tests sous forme de tâche Python shell AWS Glue démarrée par le pipeline CI." } }
    - { id: d, text: { en: "Install only the open source pyspark package from PyPI on the laptops and the build hosts.", fr: "Installer uniquement le paquet open source pyspark depuis PyPI sur les postes et les hôtes de build." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS publishes Docker images that contain the AWS Glue ETL libraries for each Glue version, and the documentation shows how to run pytest in the container against a local workspace. Tests run locally or on a build host, without any job run in AWS Glue."
    fr: "AWS publie des images Docker qui contiennent les bibliothèques ETL d'AWS Glue pour chaque version de Glue, et la documentation montre comment exécuter pytest dans le conteneur sur un espace de travail local. Les tests s'exécutent localement ou sur un hôte de build, sans aucune exécution de tâche dans AWS Glue."
  options:
    b: { en: "Interactive sessions run in AWS Glue and are billed, which the team wants to avoid.", fr: "Les sessions interactives s'exécutent dans AWS Glue et sont facturées, ce que l'équipe veut éviter." }
    c: { en: "A Python shell job runs in AWS Glue and has no Spark runtime to execute GlueContext and DynamicFrame code.", fr: "Une tâche Python shell s'exécute dans AWS Glue et ne dispose pas d'un environnement Spark pour exécuter du code GlueContext et DynamicFrame." }
    d: { en: "Open source PySpark does not include the awsglue libraries, so code that imports GlueContext cannot run.", fr: "PySpark open source n'inclut pas les bibliothèques awsglue : le code qui importe GlueContext ne peut pas s'exécuter." }
references:
  - title: Develop and test AWS Glue jobs locally using a Docker image
    url: https://docs.aws.amazon.com/glue/latest/dg/develop-local-docker-image.html
