id: deac01-1b-ecs-sqs-backlog-scaling
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon ECS service on AWS Fargate runs worker tasks that pull file-processing jobs from an Amazon SQS queue. The tasks spend most of their time waiting on network I/O, so a target tracking policy on average CPU utilization does not add tasks when the queue grows. Each task can process about 100 queued messages within the accepted delay.

    Which scaling configuration will keep the processing delay within the target as the backlog changes?
  fr: |
    Un service Amazon ECS sur AWS Fargate exécute des tâches de traitement qui récupèrent des travaux de traitement de fichiers dans une file d'attente Amazon SQS. Les tâches passent la plupart de leur temps à attendre des E/S réseau : une politique de suivi de cible sur l'utilisation moyenne du processeur n'ajoute pas de tâches quand la file grossit. Chaque tâche peut traiter environ 100 messages en attente dans le délai accepté.

    Quelle configuration de mise à l'échelle maintient le délai de traitement dans la cible quand l'arriéré varie ?
body:
  options:
    - id: a
      text: { en: "A target tracking policy on the ApproximateNumberOfMessagesVisible metric of the queue, with a target value of 100 messages for the service", fr: "Une politique de suivi de cible sur la métrique ApproximateNumberOfMessagesVisible de la file, avec une valeur cible de 100 messages pour le service" }
    - id: b
      text: { en: "A target tracking policy on a metric math expression of ApproximateNumberOfMessagesVisible divided by RunningTaskCount, with a target of 100", fr: "Une politique de suivi de cible sur une expression de calcul de métriques ApproximateNumberOfMessagesVisible divisé par RunningTaskCount, avec une cible de 100" }
    - id: c
      text: { en: "A step scaling policy on the average CPU utilization of the service, with smaller steps and a shorter cooldown period", fr: "Une politique de mise à l'échelle par étapes sur l'utilisation moyenne du processeur du service, avec des étapes plus petites et un temps de stabilisation plus court" }
    - id: d
      text: { en: "Scheduled scaling actions that raise the desired task count of the service during business hours and lower it at night", fr: "Des actions de mise à l'échelle planifiées qui augmentent le nombre souhaité de tâches du service pendant les heures ouvrées et le réduisent la nuit" }
answer: { optionId: b }
explanation:
  correct:
    en: "The backlog per task is the number of visible messages divided by the number of running tasks, which metric math can compute for a target tracking policy. With a target of 100, Application Auto Scaling adds tasks when each task has more than 100 messages waiting and removes them when the backlog per task falls."
    fr: "L'arriéré par tâche est le nombre de messages visibles divisé par le nombre de tâches en cours d'exécution, que le calcul de métriques peut produire pour une politique de suivi de cible. Avec une cible de 100, Application Auto Scaling ajoute des tâches quand chaque tâche a plus de 100 messages en attente et en retire quand l'arriéré par tâche diminue."
  options:
    a:
      en: "The queue depth alone does not say how much work each task has, so a target of 100 messages for the whole queue does not match the capacity of the tasks."
      fr: "La profondeur de la file seule n'indique pas la quantité de travail par tâche : une cible de 100 messages pour toute la file ne correspond pas à la capacité des tâches."
    c:
      en: "The tasks are I/O bound, so CPU utilization stays low as the backlog grows, whatever the steps."
      fr: "Les tâches sont limitées par les E/S : l'utilisation du processeur reste faible quand l'arriéré grossit, quelles que soient les étapes."
    d:
      en: "A schedule does not follow the actual backlog, which changes with file arrivals."
      fr: "Une planification ne suit pas l'arriéré réel, qui varie avec l'arrivée des fichiers."
references:
  - title: Create a target tracking scaling policy for Application Auto Scaling using metric math
    url: https://docs.aws.amazon.com/autoscaling/application/userguide/application-auto-scaling-target-tracking-metric-math.html
