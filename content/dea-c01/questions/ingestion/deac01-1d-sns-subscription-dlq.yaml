id: deac01-1d-sns-subscription-dlq
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data platform publishes a dataset published notification to a standard Amazon SNS topic in us-east-1 each time a new dataset is available. The topic has two subscriptions: an HTTPS endpoint of a partner data catalog and an Amazon SQS queue. Last week the partner endpoint was unavailable for two days, and SNS discarded the notifications after its delivery retries were exhausted. The company must keep the notifications that cannot be delivered to the partner endpoint so that they can be reprocessed later, without changing how the SQS subscription works.

    Which solution will meet these requirements?
  fr: |
    Une plateforme de données publie une notification de publication de jeu de données dans une rubrique Amazon SNS standard de us-east-1 chaque fois qu'un nouveau jeu de données est disponible. La rubrique a deux abonnements : un point de terminaison HTTPS du catalogue de données d'un partenaire et une file d'attente Amazon SQS. La semaine dernière, le point de terminaison du partenaire a été indisponible pendant deux jours, et SNS a écarté les notifications une fois ses nouvelles tentatives de livraison épuisées. L'entreprise doit conserver les notifications qui ne peuvent pas être livrées au point de terminaison du partenaire afin de les retraiter plus tard, sans modifier le fonctionnement de l'abonnement SQS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an SQS dead-letter queue to the SNS topic so that undelivered messages of every subscription are kept.", fr: "Associer une file d'attente de lettres mortes SQS à la rubrique SNS pour conserver les messages non livrés de tous les abonnements." } }
    - { id: b, text: { en: "Set a redrive policy on the HTTPS subscription that targets a standard SQS queue in us-east-1 in the same account, with a 14-day retention period.", fr: "Définir sur l'abonnement HTTPS une politique de redirection (redrive policy) qui cible une file d'attente SQS standard de us-east-1 dans le même compte, avec une période de conservation de 14 jours." } }
    - { id: c, text: { en: "Set a redrive policy on the HTTPS subscription that targets a standard SQS queue in us-west-2 so that the messages survive a Regional outage.", fr: "Définir sur l'abonnement HTTPS une politique de redirection qui cible une file d'attente SQS standard de us-west-2 pour que les messages survivent à une panne régionale." } }
    - { id: d, text: { en: "Increase the visibility timeout of the existing subscribed SQS queue so that the partner can read the messages later.", fr: "Augmenter le délai de visibilité de la file d'attente SQS déjà abonnée pour que le partenaire puisse lire les messages plus tard." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An SNS dead-letter queue is attached to a subscription through its redrive policy, so only the messages that fail for the partner endpoint are moved there after the delivery retry policy is exhausted. The queue must be in the same account and Region as the subscription and of the same type as the topic, and AWS recommends the maximum retention of 14 days.
    fr: |
      Une file d'attente de lettres mortes SNS est associée à un abonnement par sa politique de redirection : seuls les messages en échec pour le point de terminaison du partenaire y sont déplacés une fois la politique de nouvelles tentatives de livraison épuisée. La file doit se trouver dans le même compte et la même Région que l'abonnement et être du même type que la rubrique, et AWS recommande la conservation maximale de 14 jours.
  options:
    a: { en: "SNS dead-letter queues are attached to subscriptions, not to topics.", fr: "Les files d'attente de lettres mortes SNS sont associées aux abonnements, pas aux rubriques." }
    c: { en: "The dead-letter queue must be in the same AWS account and Region as the subscription.", fr: "La file d'attente de lettres mortes doit se trouver dans le même compte AWS et la même Région que l'abonnement." }
    d: { en: "The visibility timeout only hides received messages from other consumers; the partner endpoint does not read that queue, and the failed HTTPS deliveries are still discarded.", fr: "Le délai de visibilité ne fait que masquer les messages reçus aux autres consommateurs ; le point de terminaison du partenaire ne lit pas cette file, et les livraisons HTTPS en échec sont toujours écartées." }
references:
  - title: Amazon SNS dead-letter queues
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-dead-letter-queues.html
