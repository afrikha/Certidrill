id: deac01-1e-dist-gzip-single-task
objective: "1.4.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue for Apache Spark job with 20 G.1X workers processes one 40 GB gzip-compressed CSV file that a partner delivers to Amazon S3 every day. The read stage, which decompresses and parses the file, takes most of the run time. The Spark UI shows that this stage has a single task while the other executors stay idle. The partner can change how it delivers the data.

    Which change will reduce the run time of the job the MOST?
  fr: |
    Une tâche AWS Glue pour Apache Spark avec 20 nœuds de travail (workers) G.1X traite un fichier CSV de 40 Go compressé avec gzip qu'un partenaire dépose chaque jour dans Amazon S3. L'étape de lecture, qui décompresse et analyse le fichier, occupe la plus grande partie du temps d'exécution. L'interface Spark montre que cette étape n'a qu'une seule tâche pendant que les autres exécuteurs restent inactifs. Le partenaire peut modifier sa façon de livrer les données.

    Quelle modification réduira le PLUS le temps d'exécution de la tâche ?
body:
  options:
    - { id: a, text: { en: "Ask the partner to deliver hundreds of smaller gzip files instead of one file.", fr: "Demander au partenaire de livrer des centaines de fichiers gzip plus petits au lieu d'un seul fichier." } }
    - { id: b, text: { en: "Increase the number of G.1X workers of the job from 20 to 60.", fr: "Faire passer le nombre de workers G.1X de la tâche de 20 à 60." } }
    - { id: c, text: { en: "Change the worker type of the job from G.1X to G.8X, with 20 workers.", fr: "Changer le type de worker de la tâche de G.1X à G.8X, avec 20 workers." } }
    - { id: d, text: { en: "Call repartition(200) on the DataFrame immediately after reading the file.", fr: "Appeler repartition(200) sur le DataFrame immédiatement après la lecture du fichier." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Spark runs one task per partition, and a gzip file cannot be split, so each gzip object becomes exactly one partition read by one task. Many smaller files give many partitions, so the decompression and parsing run in parallel on all the executors."
    fr: "Spark exécute une tâche par partition, et un fichier gzip ne peut pas être fractionné : chaque objet gzip devient donc exactement une partition lue par une seule tâche. De nombreux fichiers plus petits donnent de nombreuses partitions, de sorte que la décompression et l'analyse s'exécutent en parallèle sur tous les exécuteurs."
  options:
    b:
      en: "More workers add idle executors; the single unsplittable file is still read by one task."
      fr: "Plus de workers ajoutent des exécuteurs inactifs ; le fichier unique non fractionnable est toujours lu par une seule tâche."
    c:
      en: "Larger workers add cores and memory, but one task still uses one core to read the file."
      fr: "Des workers plus grands ajoutent des cœurs et de la mémoire, mais une seule tâche utilise toujours un seul cœur pour lire le fichier."
    d:
      en: "Repartitioning spreads the later stages, but the read stage that takes most of the time still runs as one task, and the shuffle adds cost."
      fr: "Le repartitionnement répartit les étapes suivantes, mais l'étape de lecture, qui prend le plus de temps, s'exécute toujours en une seule tâche, et la redistribution ajoute un coût."
references:
  - title: Parallelize tasks
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/tuning-aws-glue-for-apache-spark/parallelize-tasks.html
