id: deac01-1e-cicd-continuous-delivery
objective: "1.4.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team stores its AWS Glue ETL scripts in a Git repository. Every change merged into the main branch is built, unit tested, and deployed automatically to a staging account, where integration tests run on sample data. A change reaches production only after a data steward approves it, and the production deployment itself is then automated.

    Which practice does this release process implement?
  fr: |
    Une équipe d'ingénierie des données stocke ses scripts ETL AWS Glue dans un dépôt Git. Chaque modification fusionnée dans la branche main est générée, soumise aux tests unitaires et déployée automatiquement dans un compte de préproduction, où des tests d'intégration s'exécutent sur des données d'exemple. Une modification n'atteint la production qu'après l'approbation d'un responsable des données (data steward), puis le déploiement en production lui-même est automatisé.

    Quelle pratique ce processus de publication met-il en œuvre ?
body:
  options:
    - { id: a, text: { en: "Continuous integration only, because the process stops after the build and the unit tests.", fr: "L'intégration continue seule, car le processus s'arrête après la génération et les tests unitaires." } }
    - { id: b, text: { en: "Continuous deployment, because every change flows to production without an explicit approval.", fr: "Le déploiement continu, car chaque modification va jusqu'en production sans approbation explicite." } }
    - { id: c, text: { en: "Blue/green deployment, because traffic is switched between two identical production environments.", fr: "Le déploiement bleu/vert, car le trafic est basculé entre deux environnements de production identiques." } }
    - { id: d, text: { en: "Continuous delivery, because a manual approval gates the automated production release.", fr: "La livraison continue, car une approbation manuelle conditionne la mise en production automatisée." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Continuous integration merges changes into the main branch and builds and tests them automatically. Continuous delivery then promotes them through isolated environments and requires a manual approval before production. Continuous deployment differs only at the production release, which it performs with no explicit approval."
    fr: "L'intégration continue fusionne les modifications dans la branche principale, puis les génère et les teste automatiquement. La livraison continue les fait ensuite passer par des environnements isolés et exige une approbation manuelle avant la production. Le déploiement continu ne diffère qu'à la mise en production, qu'il effectue sans approbation explicite."
  options:
    a:
      en: "The process goes beyond the build and the tests: it deploys automatically to staging and then to production."
      fr: "Le processus va au-delà de la génération et des tests : il déploie automatiquement en préproduction puis en production."
    b:
      en: "The data steward's approval before production is exactly what continuous deployment removes."
      fr: "L'approbation du responsable des données avant la production est précisément ce que le déploiement continu supprime."
    c:
      en: "Blue/green is a deployment strategy for switching traffic between two environments; nothing in the scenario describes it."
      fr: "Le bleu/vert est une stratégie de déploiement qui bascule le trafic entre deux environnements ; rien dans le scénario ne la décrit."
references:
  - title: Understanding CI/CD
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-cicd-litmus/understanding-cicd.html
