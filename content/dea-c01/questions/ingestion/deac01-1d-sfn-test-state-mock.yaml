id: deac01-1d-sfn-test-state-mock
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team changes the input and output processing of the state that starts an AWS Glue job in a large production state machine. Before deploying the change, the team wants to check, for several sample inputs, what the state produces after each processing step and which state comes next. The test must not update the state machine or start any Glue job.

    Which solution will meet these requirements?
  fr: |
    Une équipe modifie le traitement des entrées et des sorties de l'état qui démarre une tâche AWS Glue dans une grande machine d'état de production. Avant de déployer la modification, l'équipe veut vérifier, pour plusieurs entrées d'exemple, ce que l'état produit après chaque étape de traitement et quel état vient ensuite. Le test ne doit ni mettre à jour la machine d'état ni démarrer de tâche Glue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the log level of the state machine to ALL and review the CloudWatch Logs entries of the next executions.", fr: "Définir le niveau de journalisation de la machine d'état sur ALL et examiner les entrées CloudWatch Logs des prochaines exécutions." } }
    - { id: b, text: { en: "Call the TestState API with the state definition, each sample input, a mock of the Glue task, and DEBUG level.", fr: "Appeler l'API TestState avec la définition de l'état, chaque entrée d'exemple, un mock de la tâche Glue et le niveau DEBUG." } }
    - { id: c, text: { en: "Publish a new version of the state machine and route 10% of the executions to it through an alias.", fr: "Publier une nouvelle version de la machine d'état et lui acheminer 10 % des exécutions via un alias." } }
    - { id: d, text: { en: "Start executions of the production state machine with the sample inputs and compare the outputs.", fr: "Démarrer des exécutions de la machine d'état de production avec les entrées d'exemple et comparer les sorties." } }
answer: { optionId: b }
explanation:
  correct:
    en: "TestState tests a single state without creating or updating a state machine. At the DEBUG inspection level it returns the intermediate results of the input and output processing and the next state. With a mock, the service integration is simulated, so no Glue job starts and no IAM role is required."
    fr: "TestState teste un seul état sans créer ni mettre à jour de machine d'état. Au niveau d'inspection DEBUG, il renvoie les résultats intermédiaires du traitement des entrées et des sorties ainsi que l'état suivant. Avec un mock, l'intégration de service est simulée : aucune tâche Glue ne démarre et aucun rôle IAM n'est nécessaire."
  options:
    a: { en: "Logging requires executions of a deployed definition, which run the real Glue job.", fr: "La journalisation exige des exécutions d'une définition déployée, qui démarrent la vraie tâche Glue." }
    c: { en: "A new version deploys the change and runs real executions that start Glue jobs.", fr: "Une nouvelle version déploie la modification et lance de vraies exécutions qui démarrent des tâches Glue." }
    d: { en: "The production state machine does not contain the change yet, and its executions start real Glue jobs.", fr: "La machine d'état de production ne contient pas encore la modification, et ses exécutions démarrent de vraies tâches Glue." }
references:
  - title: Testing state machines with TestState API
    url: https://docs.aws.amazon.com/step-functions/latest/dg/test-state-isolation.html
