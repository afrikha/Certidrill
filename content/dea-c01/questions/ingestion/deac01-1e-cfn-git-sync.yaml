id: deac01-1e-cfn-git-sync
objective: "1.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data team keeps the AWS CloudFormation template of its AWS Glue ingestion stack and the stack parameters in a GitHub repository. The stack must be updated automatically whenever either file changes on the main branch. Reviewers want a comment on each pull request that describes the stack changes before they are merged. The solution must have the LEAST operational overhead, with no pipeline or workflow to maintain.

    Which solution will meet these requirements?
  fr: |
    Une équipe de données conserve dans un dépôt GitHub le modèle AWS CloudFormation de sa pile d'ingestion AWS Glue et les paramètres de la pile. La pile doit être mise à jour automatiquement chaque fois que l'un de ces fichiers change sur la branche main. Les relecteurs veulent sur chaque pull request un commentaire qui décrit les modifications de la pile avant leur fusion. La solution doit avoir le MOINS de charge opérationnelle, sans pipeline ni flux de travail à maintenir.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS CodePipeline pipeline with a GitHub source action and a CloudFormation deploy action.", fr: "Créer un pipeline AWS CodePipeline avec une action source GitHub et une action de déploiement CloudFormation." } }
    - { id: b, text: { en: "Turn on CloudFormation Git sync for the stack, with pull request comments enabled.", fr: "Activer Git sync de CloudFormation pour la pile, avec les commentaires de pull request activés." } }
    - { id: c, text: { en: "Add a GitHub Actions workflow that runs aws cloudformation deploy with access keys stored as repository secrets.", fr: "Ajouter un flux de travail GitHub Actions qui exécute aws cloudformation deploy avec des clés d'accès stockées comme secrets du dépôt." } }
    - { id: d, text: { en: "Send GitHub push webhooks to an Amazon API Gateway endpoint that invokes an AWS Lambda function to update the stack.", fr: "Envoyer les webhooks de push GitHub à un point de terminaison Amazon API Gateway qui appelle une fonction AWS Lambda pour mettre à jour la pile." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Git sync monitors a repository for changes to the template file and to the stack deployment file that holds the parameters, and updates the stack automatically when either is committed. It can also comment on a pull request to describe the stack changes before they are applied, with no pipeline to build or run."
    fr: "Git sync surveille un dépôt pour détecter les modifications du fichier de modèle et du fichier de déploiement de pile qui contient les paramètres, et met à jour la pile automatiquement quand l'un d'eux est validé. Il peut aussi commenter une pull request pour décrire les modifications de la pile avant leur application, sans pipeline à créer ni à exécuter."
  options:
    a:
      en: "A pipeline works but is an additional resource to maintain, and it does not comment on pull requests by itself."
      fr: "Un pipeline fonctionne, mais c'est une ressource de plus à maintenir, et il ne commente pas les pull requests de lui-même."
    c:
      en: "The workflow must be maintained, the access keys must be rotated, and nothing describes the changes on the pull request."
      fr: "Le flux de travail doit être maintenu, les clés d'accès doivent être renouvelées, et rien ne décrit les modifications sur la pull request."
    d:
      en: "This is custom code to build and operate, which is the opposite of the LEAST operational overhead."
      fr: "C'est du code personnalisé à créer et à exploiter, à l'opposé du MOINS de charge opérationnelle."
references:
  - title: Syncing stacks with source code stored in a Git repository with Git sync
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/git-sync.html
