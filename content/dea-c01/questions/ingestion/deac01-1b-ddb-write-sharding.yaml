id: deac01-1b-ddb-write-sharding
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A utility company stores smart-meter readings in an Amazon DynamoDB table whose partition key is the reading date and whose sort key is the meter ID. All writes of a day go to the same partition key value, and writes are throttled although consumed capacity is far below the table's provisioned write capacity. An application must still read the reading of one meter for one day with a single GetItem call.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services publics stocke les relevés de compteurs intelligents dans une table Amazon DynamoDB dont la clé de partition est la date du relevé et la clé de tri l'ID du compteur. Toutes les écritures d'une journée portent sur la même valeur de clé de partition, et les écritures sont limitées alors que la capacité consommée est très inférieure à la capacité d'écriture provisionnée de la table. Une application doit toujours lire le relevé d'un compteur pour une journée avec un seul appel GetItem.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Append a random number from 1 to 200 to the date in the partition key of each item.", fr: "Ajouter un nombre aléatoire de 1 à 200 à la date dans la clé de partition de chaque élément." }
    - id: b
      text: { en: "Append a suffix calculated from a hash of the meter ID to the date in the partition key of each item.", fr: "Ajouter à la date, dans la clé de partition de chaque élément, un suffixe calculé à partir d'un hachage de l'ID du compteur." }
    - id: c
      text: { en: "Switch the table to on-demand capacity mode and keep the date as the partition key.", fr: "Passer la table en mode de capacité à la demande et conserver la date comme clé de partition." }
    - id: d
      text: { en: "Add a global secondary index whose partition key is the meter ID and write through the index.", fr: "Ajouter un index secondaire global dont la clé de partition est l'ID du compteur et écrire par l'index." }
answer: { optionId: b }
explanation:
  correct:
    en: "Throttling while the table has unused capacity points to a hot partition key. A calculated suffix spreads the writes of a day over many partition key values, and because the suffix is derived from the meter ID, the application can compute the full key and read one item with GetItem."
    fr: "Une limitation alors que la table dispose de capacité inutilisée indique une clé de partition chaude. Un suffixe calculé répartit les écritures d'une journée sur de nombreuses valeurs de clé de partition et, comme le suffixe est dérivé de l'ID du compteur, l'application peut calculer la clé complète et lire un élément avec GetItem."
  options:
    a:
      en: "Random suffixes spread writes, but the reader cannot know which suffix a meter got, so a single GetItem is no longer possible."
      fr: "Des suffixes aléatoires répartissent les écritures, mais le lecteur ne peut pas savoir quel suffixe un compteur a reçu : un seul GetItem n'est plus possible."
    c:
      en: "On-demand mode removes table-level capacity planning, but requests that exceed the throughput of a single key range are still throttled."
      fr: "Le mode à la demande supprime la planification de capacité au niveau de la table, mais les requêtes qui dépassent le débit d'une seule plage de clés sont toujours limitées."
    d:
      en: "Applications cannot write to a global secondary index directly, and an extra index adds write work to the base table instead of removing the hot key."
      fr: "Une application ne peut pas écrire directement dans un index secondaire global, et un index supplémentaire ajoute des écritures à la table de base au lieu de supprimer la clé chaude."
references:
  - title: Using write sharding to distribute workloads evenly in your DynamoDB table
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html
  - title: Troubleshooting throttling in Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TroubleshootingThrottling.html
