id: deac01-1a-redshift-data-api-batch
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Step Functions workflow uses the Amazon Redshift Data API to load a daily batch on a Redshift Serverless workgroup. Three SQL statements must run in order: delete the day's rows from the target table, insert the rows from a staging table, and record the load date in a control table. If any statement fails, none of the changes may be kept.

    Which solution will meet these requirements?
  fr: |
    Un flux de travail AWS Step Functions utilise l'API de données Amazon Redshift pour charger un lot quotidien sur un groupe de travail Redshift Serverless. Trois instructions SQL doivent s'exécuter dans l'ordre : supprimer les lignes du jour de la table cible, insérer les lignes d'une table intermédiaire, puis enregistrer la date de chargement dans une table de contrôle. Si une instruction échoue, aucune des modifications ne doit être conservée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Call ExecuteStatement three times in parallel states and wait for all three statements to finish.", fr: "Appeler ExecuteStatement trois fois dans des états parallèles et attendre la fin des trois instructions." } }
    - { id: b, text: { en: "Call ExecuteStatement three times in sequence and call GetStatementResult after each call.", fr: "Appeler ExecuteStatement trois fois en séquence et appeler GetStatementResult après chaque appel." } }
    - { id: c, text: { en: "Call BatchExecuteStatement once with the three statements in its Sqls list, in the default run mode.", fr: "Appeler BatchExecuteStatement une seule fois avec les trois instructions dans sa liste Sqls, dans le mode d'exécution par défaut." } }
    - { id: d, text: { en: "Call BatchExecuteStatement once with the three statements and the AUTO_COMMIT run mode.", fr: "Appeler BatchExecuteStatement une seule fois avec les trois instructions et le mode d'exécution AUTO_COMMIT." } }
answer: { optionId: c }
explanation:
  correct:
    en: "BatchExecuteStatement runs a list of SQL statements, and its default TRANSACTION mode runs them in order as one transaction: if a statement fails, the whole batch is rolled back."
    fr: "BatchExecuteStatement exécute une liste d'instructions SQL, et son mode par défaut TRANSACTION les exécute dans l'ordre comme une seule transaction : si une instruction échoue, tout le lot est annulé."
  options:
    a:
      en: "Parallel statements neither run in order nor share a transaction, so a failure would leave partial changes."
      fr: "Des instructions parallèles ne s'exécutent ni dans l'ordre ni dans une même transaction : un échec laisserait des modifications partielles."
    b:
      en: "Separate ExecuteStatement calls are separate transactions, so earlier statements stay committed if a later one fails."
      fr: "Des appels ExecuteStatement distincts sont des transactions distinctes : les instructions précédentes restent validées si une instruction suivante échoue."
    d:
      en: "AUTO_COMMIT commits each statement individually, so a failure would not roll back the earlier statements."
      fr: "AUTO_COMMIT valide chaque instruction individuellement : un échec n'annulerait pas les instructions précédentes."
references:
  - title: Using the Amazon Redshift Data API - Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/data-api.html
