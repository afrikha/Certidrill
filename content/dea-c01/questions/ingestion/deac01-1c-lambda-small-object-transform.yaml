id: deac01-1c-lambda-small-object-transform
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company receives a few hundred JSON files per day from partners at irregular times. Each file is smaller than 1 MB and is uploaded to an Amazon S3 bucket. Each file must be validated and reformatted within seconds of its arrival and written to another S3 prefix. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages reçoit de ses partenaires quelques centaines de fichiers JSON par jour, à des moments irréguliers. Chaque fichier fait moins de 1 Mo et est chargé dans un compartiment Amazon S3. Chaque fichier doit être validé et reformaté dans les secondes qui suivent son arrivée, puis écrit sous un autre préfixe S3. L'entreprise veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Schedule an AWS Glue Spark job to run every hour and process the new files.", fr: "Planifier une tâche Spark AWS Glue toutes les heures pour traiter les nouveaux fichiers." } }
    - { id: b, text: { en: "Run a persistent Amazon EMR cluster that polls the bucket for new files.", fr: "Exécuter un cluster Amazon EMR permanent qui interroge le compartiment pour détecter les nouveaux fichiers." } }
    - { id: c, text: { en: "Load each file into Amazon Redshift with COPY and transform it with a stored procedure.", fr: "Charger chaque fichier dans Amazon Redshift avec COPY et le transformer avec une procédure stockée." } }
    - { id: d, text: { en: "Invoke an AWS Lambda function from an S3 event notification for each new object.", fr: "Appeler une fonction AWS Lambda à partir d'une notification d'événement S3 pour chaque nouvel objet." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon S3 can invoke a Lambda function asynchronously when an object is created. Lambda runs only when a file arrives, scales without servers to manage, and easily handles the small files within seconds."
    fr: "Amazon S3 peut appeler une fonction Lambda de manière asynchrone lorsqu'un objet est créé. Lambda ne s'exécute qu'à l'arrivée d'un fichier, se met à l'échelle sans serveur à gérer et traite sans difficulté les petits fichiers en quelques secondes."
  options:
    a:
      en: "An hourly schedule cannot process each file within seconds of its arrival."
      fr: "Une planification horaire ne peut pas traiter chaque fichier dans les secondes qui suivent son arrivée."
    b:
      en: "A persistent cluster must be managed and paid for all day for a few hundred small files."
      fr: "Un cluster permanent doit être géré et payé toute la journée pour quelques centaines de petits fichiers."
    c:
      en: "Loading each file into a data warehouse and transforming it there adds a cluster and steps that the file-to-file transformation does not need."
      fr: "Charger chaque fichier dans un entrepôt de données pour l'y transformer ajoute un cluster et des étapes inutiles pour une transformation de fichier à fichier."
references:
  - title: Process Amazon S3 event notifications with Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html
