id: deac01-1c-glue-flex-nightly
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs an AWS Glue 4.0 Spark ETL job every night on 20 G.1X workers to rebuild reporting tables in Amazon S3. The job uses the Standard execution class. The reports are read the next morning, so the start time of the job can vary by several hours. The company wants to reduce the cost of the job without changing the script.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute chaque nuit une tâche ETL Spark AWS Glue 4.0 sur 20 workers G.1X pour reconstruire des tables de rapports dans Amazon S3. La tâche utilise la classe d'exécution Standard. Les rapports sont lus le lendemain matin : l'heure de démarrage de la tâche peut donc varier de plusieurs heures. L'entreprise veut réduire le coût de la tâche sans modifier le script.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the worker type to G.2X and reduce the number of workers to 10.", fr: "Remplacer le type de worker par G.2X et réduire le nombre de workers à 10." } }
    - { id: b, text: { en: "Change the execution class of the job to Flex.", fr: "Remplacer la classe d'exécution de la tâche par Flex." } }
    - { id: c, text: { en: "Convert the job to an AWS Glue Python shell job with a capacity of 1 DPU.", fr: "Convertir la tâche en tâche AWS Glue Python shell avec une capacité de 1 DPU." } }
    - { id: d, text: { en: "Move the job to an Amazon EMR on EC2 cluster with On-Demand Instances that runs all day.", fr: "Déplacer la tâche vers un cluster Amazon EMR on EC2 avec des instances à la demande qui fonctionne toute la journée." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Flex execution class runs Spark jobs on spare capacity at a lower price, and it is meant for non-urgent jobs whose start and run time can vary. It is supported for AWS Glue 3.0 and later with G.1X and G.2X workers, so the nightly job can switch to Flex without any script change."
    fr: "La classe d'exécution Flex exécute les tâches Spark sur de la capacité disponible à un prix inférieur, et elle est prévue pour les tâches non urgentes dont l'heure de démarrage et la durée peuvent varier. Elle est prise en charge à partir d'AWS Glue 3.0 avec les workers G.1X et G.2X : la tâche nocturne peut passer en Flex sans modification du script."
  options:
    a:
      en: "10 G.2X workers provide the same 20 DPUs as 20 G.1X workers, so the DPU-hours billed do not decrease."
      fr: "10 workers G.2X fournissent les mêmes 20 DPU que 20 workers G.1X : les DPU-heures facturées ne diminuent pas."
    c:
      en: "A Python shell job does not run Spark, so the script would have to be rewritten, and one DPU cannot process data sized for 20 Spark workers."
      fr: "Une tâche Python shell n'exécute pas Spark : le script devrait être réécrit, et un seul DPU ne peut pas traiter des données dimensionnées pour 20 workers Spark."
    d:
      en: "A cluster that runs all day bills for idle instances outside the nightly run and adds cluster management."
      fr: "Un cluster qui fonctionne toute la journée facture des instances inactives en dehors de l'exécution nocturne et ajoute la gestion d'un cluster."
references:
  - title: Configuring job properties for Spark jobs in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/add-job.html
