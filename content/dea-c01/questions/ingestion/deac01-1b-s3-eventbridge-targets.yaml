id: deac01-1b-s3-eventbridge-targets
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company receives partner files in the incoming/ prefix of an Amazon S3 bucket. An S3 event notification for all object-created events on that prefix already invokes a validation AWS Lambda function. An AWS Step Functions workflow and an Amazon SQS queue must now also receive an event for every new object in the same prefix. When the team tries to add event notification configurations for the same prefix and event types, the configuration is rejected.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise reçoit des fichiers de partenaires dans le préfixe incoming/ d'un compartiment Amazon S3. Une notification d'événement S3 pour tous les événements de création d'objet sur ce préfixe appelle déjà une fonction AWS Lambda de validation. Un flux de travail AWS Step Functions et une file d'attente Amazon SQS doivent désormais recevoir eux aussi un événement pour chaque nouvel objet du même préfixe. Lorsque l'équipe essaie d'ajouter des configurations de notification d'événement pour le même préfixe et les mêmes types d'événements, la configuration est refusée.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Replicate the bucket to a second bucket with S3 Replication and configure the extra event notifications on the second bucket.", fr: "Répliquer le compartiment vers un second compartiment avec S3 Replication et configurer les notifications d'événement supplémentaires sur le second compartiment." }
    - id: b
      text: { en: "Change the validation function so that it starts the workflow and sends a message to the queue after each validation.", fr: "Modifier la fonction de validation pour qu'elle démarre le flux de travail et envoie un message à la file d'attente après chaque validation." }
    - id: c
      text: { en: "Add the extra event notification configurations with the prefix incoming and suffixes that cover each file extension.", fr: "Ajouter les configurations de notification d'événement supplémentaires avec le préfixe incoming et des suffixes qui couvrent chaque extension de fichier." }
    - id: d
      text: { en: "Turn on Amazon EventBridge for the bucket, and create a rule for Object Created events in the prefix with the three consumers as targets.", fr: "Activer Amazon EventBridge pour le compartiment, et créer une règle pour les événements Object Created du préfixe avec les trois consommateurs comme cibles." }
answer: { optionId: d }
explanation:
  correct:
    en: "S3 event notification configurations cannot use overlapping prefixes or suffixes for the same event types. Once EventBridge is turned on for the bucket, S3 sends its events to EventBridge, and one rule can route them to up to five targets, so the three consumers get every event without custom code."
    fr: "Les configurations de notification d'événement S3 ne peuvent pas utiliser de préfixes ou de suffixes qui se chevauchent pour les mêmes types d'événements. Une fois EventBridge activé pour le compartiment, S3 envoie ses événements à EventBridge, et une règle peut les acheminer vers jusqu'à cinq cibles : les trois consommateurs reçoivent chaque événement sans code personnalisé."
  options:
    a:
      en: "A replica bucket doubles storage and adds a replication configuration to operate, only to work around a notification limit."
      fr: "Un compartiment de réplique double le stockage et ajoute une configuration de réplication à exploiter, uniquement pour contourner une limite de notification."
    b:
      en: "Custom fan-out code couples the consumers to the validation function and must be maintained and retried by the team."
      fr: "Un code de diffusion personnalisé couple les consommateurs à la fonction de validation et doit être maintenu et réessayé par l'équipe."
    c:
      en: "The existing configuration has no suffix filter, so any new configuration on the same prefix and event types still overlaps with it."
      fr: "La configuration existante n'a pas de filtre de suffixe : toute nouvelle configuration sur le même préfixe et les mêmes types d'événements la chevauche toujours."
references:
  - title: Configuring event notifications using object key name filtering
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-filtering.html
  - title: Using EventBridge
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
