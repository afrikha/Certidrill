id: deac01-1b-dms-sg-reference
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer creates an AWS DMS task to replicate an Amazon RDS for PostgreSQL database to Amazon S3. The DB instance and the private DMS replication instance run in private subnets of the same VPC, and each has its own security group. The source endpoint connection test times out. Access to the database must follow least privilege and must keep working if the replication instance gets a new IP address.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur de données crée une tâche AWS DMS pour répliquer une base de données Amazon RDS for PostgreSQL vers Amazon S3. L'instance de base de données et l'instance de réplication DMS privée s'exécutent dans des sous-réseaux privés du même VPC, et chacune a son propre groupe de sécurité. Le test de connexion du point de terminaison source expire. L'accès à la base de données doit respecter le principe du moindre privilège et continuer à fonctionner si l'instance de réplication obtient une nouvelle adresse IP.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an inbound rule on port 5432 to the DB security group with the CIDR range of the whole VPC as the source.", fr: "Ajouter au groupe de sécurité de la base de données une règle entrante sur le port 5432 avec la plage CIDR de tout le VPC comme source." }
    - id: b
      text: { en: "Turn on public access for the DB instance and allow the public IP address of the replication instance on port 5432.", fr: "Activer l'accès public de l'instance de base de données et autoriser l'adresse IP publique de l'instance de réplication sur le port 5432." }
    - id: c
      text: { en: "Add an inbound rule on port 5432 to the DB security group with the security group of the replication instance as the source.", fr: "Ajouter au groupe de sécurité de la base de données une règle entrante sur le port 5432 avec le groupe de sécurité de l'instance de réplication comme source." }
    - id: d
      text: { en: "Add an inbound rule on port 5432 to the DB security group with the current private IP address of the replication instance as the source.", fr: "Ajouter au groupe de sécurité de la base de données une règle entrante sur le port 5432 avec l'adresse IP privée actuelle de l'instance de réplication comme source." }
answer: { optionId: c }
explanation:
  correct:
    en: "An RDS security group rule can use another VPC security group as its source instead of an address range. Referencing the replication instance's security group admits only the members of that group on the PostgreSQL port, whatever IP address they have."
    fr: "Une règle de groupe de sécurité RDS peut utiliser un autre groupe de sécurité de VPC comme source au lieu d'une plage d'adresses. Référencer le groupe de sécurité de l'instance de réplication n'admet que les membres de ce groupe sur le port PostgreSQL, quelle que soit leur adresse IP."
  options:
    a:
      en: "The whole VPC range admits every resource in the VPC, which is broader than least privilege requires."
      fr: "La plage de tout le VPC admet toutes les ressources du VPC, ce qui est plus large que ne l'exige le moindre privilège."
    b:
      en: "Public access exposes the database outside the VPC without need, and the replication instance is private and has no public IP address."
      fr: "L'accès public expose inutilement la base de données hors du VPC, et l'instance de réplication est privée et n'a pas d'adresse IP publique."
    d:
      en: "A rule on a single IP address stops matching when the replication instance gets a new address, which breaks a stated requirement."
      fr: "Une règle sur une seule adresse IP ne correspond plus lorsque l'instance de réplication obtient une nouvelle adresse, ce qui enfreint une exigence énoncée."
references:
  - title: Controlling access with security groups
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.RDSSecurityGroups.html
  - title: Public and private replication instances
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_ReplicationInstance.PublicPrivate.html
