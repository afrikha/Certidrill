id: deac01-1b-karpenter-spiky
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs batch data processing pods on an Amazon EKS cluster. Demand is spiky, and the pods request very different amounts of CPU and memory. The cluster uses the Kubernetes Cluster Autoscaler with more than 20 managed node groups to cover the instance types, and pods often stay pending for many minutes. The company wants nodes sized to the pending pods, wide use of Spot Instances across many instance types, and fewer node groups to manage.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des pods de traitement de données par lots sur un cluster Amazon EKS. La demande est irrégulière, et les pods demandent des quantités de processeur et de mémoire très différentes. Le cluster utilise Kubernetes Cluster Autoscaler avec plus de 20 groupes de nœuds gérés pour couvrir les types d'instances, et les pods restent souvent en attente pendant de longues minutes. L'entreprise veut des nœuds dimensionnés selon les pods en attente, une large utilisation des instances Spot sur de nombreux types d'instances, et moins de groupes de nœuds à gérer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add more managed node groups so that every instance type and Availability Zone has a node group of its own.", fr: "Ajouter des groupes de nœuds gérés pour que chaque type d'instance et chaque zone de disponibilité ait son propre groupe de nœuds." }
    - id: b
      text: { en: "Configure the Kubernetes Horizontal Pod Autoscaler on the batch workloads to add pods as demand grows.", fr: "Configurer Kubernetes Horizontal Pod Autoscaler sur les charges de travail par lots pour ajouter des pods quand la demande augmente." }
    - id: c
      text: { en: "Add scheduled scaling actions to the Auto Scaling groups of the node groups before the usual daily peaks.", fr: "Ajouter des actions de mise à l'échelle planifiées aux groupes Auto Scaling des groupes de nœuds avant les pics quotidiens habituels." }
    - id: d
      text: { en: "Replace the Cluster Autoscaler with Karpenter and define a NodePool that allows many instance types and Spot capacity.", fr: "Remplacer Cluster Autoscaler par Karpenter et définir un NodePool qui autorise de nombreux types d'instances et la capacité Spot." }
answer: { optionId: d }
explanation:
  correct:
    en: "Karpenter watches unschedulable pods, evaluates their resource requests and constraints, and provisions right-sized nodes directly, without node groups. One flexible NodePool can cover many instance types, and the more types Karpenter may use, the better EC2 can place Spot capacity; Karpenter suits spiky demand and diverse compute needs."
    fr: "Karpenter surveille les pods non planifiables, évalue leurs demandes de ressources et leurs contraintes, et provisionne directement des nœuds dimensionnés, sans groupes de nœuds. Un seul NodePool flexible peut couvrir de nombreux types d'instances, et plus Karpenter a de types disponibles, mieux EC2 peut placer la capacité Spot ; Karpenter convient à une demande irrégulière et à des besoins de calcul variés."
  options:
    a:
      en: "More node groups increase the management burden that the company wants to reduce, and nodes still come from predefined sizes."
      fr: "Davantage de groupes de nœuds augmente la charge de gestion que l'entreprise veut réduire, et les nœuds restent de tailles prédéfinies."
    b:
      en: "The Horizontal Pod Autoscaler changes the number of pods, not the number or size of nodes, so pending pods still wait for capacity."
      fr: "Horizontal Pod Autoscaler modifie le nombre de pods, pas le nombre ni la taille des nœuds : les pods en attente attendent toujours de la capacité."
    c:
      en: "Scheduled scaling follows a calendar, while the demand is spiky, and it keeps all the node groups."
      fr: "La mise à l'échelle planifiée suit un calendrier, alors que la demande est irrégulière, et elle conserve tous les groupes de nœuds."
references:
  - title: Karpenter
    url: https://docs.aws.amazon.com/eks/latest/best-practices/karpenter.html
