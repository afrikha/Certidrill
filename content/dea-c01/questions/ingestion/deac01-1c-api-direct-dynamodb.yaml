id: deac01-1c-api-direct-dynamodb
objective: "1.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must let an internal reporting tool read product items from an Amazon DynamoDB table through an Amazon API Gateway REST API. Each request returns one item by its partition key, and no transformation is needed beyond reshaping the request and the response. The company wants the LEAST operational overhead and no application code to maintain.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit permettre à un outil de rapports interne de lire des éléments produit dans une table Amazon DynamoDB au moyen d'une API REST Amazon API Gateway. Chaque requête renvoie un élément à partir de sa clé de partition, et aucune transformation n'est nécessaire au-delà de la mise en forme de la requête et de la réponse. L'entreprise veut le MOINS de charge opérationnelle et aucun code applicatif à maintenir.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use a Lambda proxy integration with a function that calls GetItem on the table.", fr: "Utiliser une intégration de proxy Lambda avec une fonction qui appelle GetItem sur la table." } }
    - { id: b, text: { en: "Use an AWS service integration with DynamoDB GetItem, an execution role, and mapping templates.", fr: "Utiliser une intégration de service AWS avec GetItem de DynamoDB, un rôle d'exécution et des modèles de mappage." } }
    - { id: c, text: { en: "Use an HTTP proxy integration to a container on Amazon ECS that queries the table.", fr: "Utiliser une intégration de proxy HTTP vers un conteneur sur Amazon ECS qui interroge la table." } }
    - { id: d, text: { en: "Use a mock integration that returns the items stored in the integration response.", fr: "Utiliser une intégration fictive qui renvoie les éléments stockés dans la réponse d'intégration." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An AWS service integration lets API Gateway call a service API such as DynamoDB GetItem directly, with an IAM execution role that allows the action. Mapping templates turn the HTTP request into the GetItem request and shape the response, so there is no function or container to maintain."
    fr: "Une intégration de service AWS permet à API Gateway d'appeler directement une API de service comme GetItem de DynamoDB, avec un rôle d'exécution IAM qui autorise l'action. Des modèles de mappage transforment la requête HTTP en requête GetItem et mettent en forme la réponse : il n'y a ni fonction ni conteneur à maintenir."
  options:
    a:
      en: "This works, but it adds a Lambda function whose code must be maintained, which the requirements exclude."
      fr: "Cela fonctionne, mais ajoute une fonction Lambda dont le code doit être maintenu, ce que les exigences excluent."
    c:
      en: "A container service adds application code and infrastructure to run and patch."
      fr: "Un service de conteneurs ajoute du code applicatif et une infrastructure à exécuter et à corriger."
    d:
      en: "A mock integration returns static responses from API Gateway and never reads the table."
      fr: "Une intégration fictive renvoie des réponses statiques depuis API Gateway et ne lit jamais la table."
references:
  - title: "Tutorial: Create a REST API with an AWS integration"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/getting-started-aws-proxy.html
