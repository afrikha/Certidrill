id: deac01-1c-athena-new-partitions-missing
objective: "1.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external process writes new data to Amazon S3 every day in Hive-style folders such as `s3://example-logs/events/dt=2026-11-20/`. The Amazon Athena table `events` is partitioned by `dt` and was created several months ago. Queries return rows for the old dates but no rows for the dates added since then, although the files are present in Amazon S3.

    What should a data engineer do to make the new data queryable?
  fr: |
    Un processus externe écrit chaque jour de nouvelles données dans Amazon S3 dans des dossiers de style Hive comme `s3://example-logs/events/dt=2026-11-20/`. La table Amazon Athena `events` est partitionnée par `dt` et a été créée il y a plusieurs mois. Les requêtes renvoient des lignes pour les anciennes dates, mais aucune ligne pour les dates ajoutées depuis, bien que les fichiers soient présents dans Amazon S3.

    Que doit faire un ingénieur de données pour rendre les nouvelles données interrogeables ?
body:
  options:
    - { id: a, text: { en: "Run ALTER TABLE events SET LOCATION with the path of the newest folder.", fr: "Exécuter ALTER TABLE events SET LOCATION avec le chemin du dossier le plus récent." } }
    - { id: b, text: { en: "Run MSCK REPAIR TABLE events to add the missing partitions to the catalog.", fr: "Exécuter MSCK REPAIR TABLE events pour ajouter les partitions manquantes au catalogue." } }
    - { id: c, text: { en: "Drop the table and run the same CREATE EXTERNAL TABLE statement again.", fr: "Supprimer la table et exécuter de nouveau la même instruction CREATE EXTERNAL TABLE." } }
    - { id: d, text: { en: "Convert the new files to Apache Parquet so that Athena detects them.", fr: "Convertir les nouveaux fichiers au format Apache Parquet pour qu'Athena les détecte." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Athena reads only the partitions registered in the catalog. MSCK REPAIR TABLE scans the table location for Hive-compatible partitions added after the table was created and adds the missing ones to the metadata. ALTER TABLE ADD PARTITION or partition projection avoids the scan for frequent additions."
    fr: "Athena ne lit que les partitions enregistrées dans le catalogue. MSCK REPAIR TABLE analyse l'emplacement de la table à la recherche de partitions compatibles Hive ajoutées après la création de la table et ajoute les partitions manquantes aux métadonnées. ALTER TABLE ADD PARTITION ou la projection de partitions évitent cette analyse pour des ajouts fréquents."
  options:
    a:
      en: "Changing the table location to one folder would break the other partitions and still register no new partition."
      fr: "Remplacer l'emplacement de la table par un seul dossier casserait les autres partitions sans enregistrer de nouvelle partition."
    c:
      en: "A new CREATE EXTERNAL TABLE statement defines the table without any partitions, so even the old dates would return no rows until partitions are added."
      fr: "Une nouvelle instruction CREATE EXTERNAL TABLE définit la table sans aucune partition : même les anciennes dates ne renverraient aucune ligne avant l'ajout des partitions."
    d:
      en: "The file format is not the cause; the new partitions are missing from the catalog whatever the format."
      fr: "Le format des fichiers n'est pas en cause ; les nouvelles partitions sont absentes du catalogue quel que soit le format."
references:
  - title: MSCK REPAIR TABLE
    url: https://docs.aws.amazon.com/athena/latest/ug/msck-repair-table.html
