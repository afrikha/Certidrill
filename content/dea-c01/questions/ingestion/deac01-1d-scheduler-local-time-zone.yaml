id: deac01-1d-scheduler-local-time-zone
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A European retailer must start an AWS Step Functions state machine every day at 06:00 Paris local time, before the stores open. The start time must stay at 06:00 local time after each daylight saving time change. The company does not want to manage servers or write code for the schedule.

    Which solution will meet these requirements?
  fr: |
    Un distributeur européen doit démarrer une machine d'état AWS Step Functions tous les jours à 06h00, heure locale de Paris, avant l'ouverture des magasins. L'heure de démarrage doit rester 06h00 heure locale après chaque changement d'heure. L'entreprise ne veut ni gérer de serveurs ni écrire de code pour la planification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge scheduled rule with the expression cron(0 5 * * ? *) and the state machine as the target.", fr: "Créer une règle planifiée EventBridge avec l'expression cron(0 5 * * ? *) et la machine d'état comme cible." } }
    - { id: b, text: { en: "Create an EventBridge Scheduler schedule with a cron expression in the Europe/Paris time zone and the Step Functions StartExecution target.", fr: "Créer une planification EventBridge Scheduler avec une expression cron dans le fuseau horaire Europe/Paris et la cible Step Functions StartExecution." } }
    - { id: c, text: { en: "Configure a cron job on an Amazon EC2 instance set to the Paris time zone that runs the AWS CLI start-execution command.", fr: "Configurer une tâche cron sur une instance Amazon EC2 réglée sur le fuseau horaire de Paris qui exécute la commande AWS CLI start-execution." } }
    - { id: d, text: { en: "Start one long-running Standard execution that loops through a Wait state of 86,400 seconds and then calls the processing states.", fr: "Démarrer une exécution Standard de longue durée qui boucle sur un état Wait de 86 400 secondes puis appelle les états de traitement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "EventBridge Scheduler evaluates cron schedules in the IANA time zone that you specify and adjusts for daylight saving time. Step Functions StartExecution is one of its templated targets, so no code or server is needed."
    fr: "EventBridge Scheduler évalue les planifications cron dans le fuseau horaire IANA que vous indiquez et s'adapte aux changements d'heure. Step Functions StartExecution fait partie de ses cibles modélisées : aucun code ni serveur n'est nécessaire."
  options:
    a: { en: "The cron expression of an EventBridge scheduled rule is evaluated in UTC, so the local start time moves by one hour at each daylight saving time change.", fr: "L'expression cron d'une règle planifiée EventBridge est évaluée en UTC : l'heure locale de démarrage se décale d'une heure à chaque changement d'heure." }
    c: { en: "An EC2 instance is a server to patch and keep running, which the company wants to avoid.", fr: "Une instance EC2 est un serveur à corriger et à maintenir en fonctionnement, ce que l'entreprise veut éviter." }
    d: { en: "A fixed 24-hour wait drifts with processing time and ignores daylight saving time, and a Standard execution cannot run for more than one year.", fr: "Une attente fixe de 24 heures dérive avec la durée de traitement et ignore les changements d'heure, et une exécution Standard ne peut pas durer plus d'un an." }
references:
  - title: Schedule types in EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html
  - title: Using templated targets in EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-templated.html
