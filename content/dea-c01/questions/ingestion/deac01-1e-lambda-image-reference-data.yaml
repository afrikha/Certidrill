id: deac01-1e-lambda-image-reference-data
objective: "1.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function validates incoming records against a 2 GB read-only reference dataset. The dataset changes only with the monthly application release. The function must not be connected to a VPC and must not download the dataset at runtime. Its code dependencies total 150 MB.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda valide les enregistrements entrants par rapport à un jeu de données de référence de 2 Go en lecture seule. Le jeu de données ne change qu'avec la version mensuelle de l'application. La fonction ne doit pas être connectée à un VPC et ne doit pas télécharger le jeu de données à l'exécution. Ses dépendances de code totalisent 150 Mo.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Package the function as a container image that includes the dataset, and store the image in Amazon ECR.", fr: "Empaqueter la fonction sous forme d'image de conteneur qui inclut le jeu de données, et stocker l'image dans Amazon ECR." } }
    - { id: b, text: { en: "Split the dataset across five Lambda layers, and add all the layers to the function.", fr: "Répartir le jeu de données sur cinq couches Lambda, et ajouter toutes les couches à la fonction." } }
    - { id: c, text: { en: "Store the dataset on an Amazon EFS file system, and mount it on a local path under /mnt/.", fr: "Stocker le jeu de données sur un système de fichiers Amazon EFS, et le monter sur un chemin local sous /mnt/." } }
    - { id: d, text: { en: "Add the dataset to the .zip deployment package, and upload the package through Amazon S3.", fr: "Ajouter le jeu de données au package de déploiement .zip, et charger le package par Amazon S3." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A container image can be up to 10 GB uncompressed, including all its layers, so it holds the code, the 150 MB of dependencies, and the 2 GB dataset. The data ships with each release and is available locally without a VPC or a download."
    fr: "Une image de conteneur peut atteindre 10 Go décompressée, toutes ses couches comprises : elle contient donc le code, les 150 Mo de dépendances et le jeu de données de 2 Go. Les données sont livrées avec chaque version et disponibles localement, sans VPC ni téléchargement."
  options:
    b:
      en: "The 250 MB unzipped limit applies to the deployment package including all layers, so five layers cannot hold 2 GB."
      fr: "La limite de 250 Mo décompressés s'applique au package de déploiement couches comprises : cinq couches ne peuvent pas contenir 2 Go."
    c:
      en: "Mounting an EFS file system requires the function to be connected to a VPC."
      fr: "Le montage d'un système de fichiers EFS exige que la fonction soit connectée à un VPC."
    d:
      en: "Uploading through S3 raises the 50 MB zipped limit, but the content is still limited to 250 MB unzipped."
      fr: "Le chargement par S3 lève la limite de 50 Mo compressés, mais le contenu reste limité à 250 Mo décompressés."
references:
  - title: Lambda quotas
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
