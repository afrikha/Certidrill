id: deac01-1a-kcl-shards-workers
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company processes payment events from an Amazon Kinesis data stream in provisioned mode with 4 shards. The consumer is a Kinesis Client Library (KCL) application that runs on 8 Amazon EC2 instances. Monitoring shows that 4 instances are CPU-bound while the other 4 are idle, and consumer lag keeps growing. GetRecords calls are not throttled.

    Which solution will increase the processing parallelism of the consumer?
  fr: |
    Une entreprise de technologie financière traite des événements de paiement à partir d'un flux de données Amazon Kinesis en mode provisionné avec 4 partitions (shards). Le consommateur est une application Kinesis Client Library (KCL) qui s'exécute sur 8 instances Amazon EC2. La surveillance montre que 4 instances sont saturées en processeur tandis que les 4 autres sont inactives, et le retard du consommateur ne cesse d'augmenter. Les appels GetRecords ne sont pas limités.

    Quelle solution augmente le parallélisme de traitement du consommateur ?
body:
  options:
    - { id: a, text: { en: "Add 8 more EC2 instances to the Auto Scaling group that runs the KCL workers.", fr: "Ajouter 8 instances EC2 supplémentaires au groupe Auto Scaling qui exécute les workers KCL." } }
    - { id: b, text: { en: "Register the KCL application as an enhanced fan-out consumer of the stream.", fr: "Enregistrer l'application KCL comme consommateur à diffusion améliorée (enhanced fan-out) du flux." } }
    - { id: c, text: { en: "Increase the number of shards in the stream to 8 by using the UpdateShardCount API.", fr: "Porter le nombre de partitions du flux à 8 à l'aide de l'API UpdateShardCount." } }
    - { id: d, text: { en: "Increase the provisioned throughput of the DynamoDB lease table of the KCL application.", fr: "Augmenter le débit provisionné de la table de baux DynamoDB de l'application KCL." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In KCL, each shard is held by only one worker through a lease, and each lease gets one record processor. With 4 shards, at most 4 record processors run, so the extra instances stay idle. Resharding to 8 shards gives the application 8 leases to spread across the 8 workers."
    fr: "Dans KCL, chaque partition n'est détenue que par un seul worker au moyen d'un bail, et chaque bail reçoit un processeur d'enregistrements. Avec 4 partitions, au plus 4 processeurs d'enregistrements s'exécutent : les instances supplémentaires restent inactives. Repartitionner le flux en 8 partitions donne à l'application 8 baux à répartir entre les 8 workers."
  options:
    a:
      en: "More workers than shards receive no lease, so the new instances would also stay idle."
      fr: "Les workers en surnombre par rapport aux partitions ne reçoivent aucun bail : les nouvelles instances resteraient elles aussi inactives."
    b:
      en: "Enhanced fan-out gives dedicated read throughput per shard, but reads are not throttled; the limit is one record processor per shard."
      fr: "La diffusion améliorée fournit un débit de lecture dédié par partition, mais les lectures ne sont pas limitées ; la contrainte est d'un processeur d'enregistrements par partition."
    d:
      en: "The lease table stores leases and checkpoints; more table capacity does not create more leases."
      fr: "La table de baux stocke les baux et les points de contrôle ; plus de capacité sur la table ne crée pas de baux supplémentaires."
references:
  - title: KCL concepts - Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/streams/latest/dev/kcl-concepts.html
