id: deac01-1e-sam-statemachine-gradual
objective: "1.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Standard AWS Step Functions state machine processes partner files. It is defined in an AWS SAM template and is started by an Amazon EventBridge rule declared in the Events property of the same resource. A new release changes the transformation steps. Each deployment must publish a new state machine version, keep the previous versions, and shift the executions that the rule starts to the new version gradually instead of all at once.

    Which solution will meet these requirements?
  fr: |
    Une machine d'état AWS Step Functions de type Standard traite les fichiers des partenaires. Elle est définie dans un modèle AWS SAM et démarrée par une règle Amazon EventBridge déclarée dans la propriété Events de la même ressource. Une nouvelle version modifie les étapes de transformation. Chaque déploiement doit publier une nouvelle version de la machine d'état, conserver les versions précédentes et basculer progressivement, et non en une seule fois, les exécutions démarrées par la règle vers la nouvelle version.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a DeploymentPreference property to the state machine, and leave the rule targeting the state machine ARN.", fr: "Ajouter une propriété DeploymentPreference à la machine d'état, et laisser la règle cibler l'ARN de la machine d'état." } }
    - { id: b, text: { en: "Add AutoPublishAlias to the state machine, and set UseAliasAsEventTarget to true.", fr: "Ajouter AutoPublishAlias à la machine d'état, et définir UseAliasAsEventTarget sur true." } }
    - { id: c, text: { en: "Add AutoPublishAlias and DeploymentPreference to the state machine, and set UseAliasAsEventTarget to true.", fr: "Ajouter AutoPublishAlias et DeploymentPreference à la machine d'état, et définir UseAliasAsEventTarget sur true." } }
    - { id: d, text: { en: "Add AutoPublishAlias and DeploymentPreference to each AWS Lambda function that the state machine invokes.", fr: "Ajouter AutoPublishAlias et DeploymentPreference à chaque fonction AWS Lambda appelée par la machine d'état." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AutoPublishAlias publishes a new state machine version and alias on each deployment and keeps the previous versions. DeploymentPreference adds gradual traffic shifting and requires AutoPublishAlias. UseAliasAsEventTarget makes the event sources of the resource, here the EventBridge rule, target the alias, so the rule's executions follow the shift."
    fr: "AutoPublishAlias publie une nouvelle version et un alias de la machine d'état à chaque déploiement et conserve les versions précédentes. DeploymentPreference ajoute le basculement progressif du trafic et exige AutoPublishAlias. UseAliasAsEventTarget fait cibler l'alias par les sources d'événements de la ressource, ici la règle EventBridge : les exécutions de la règle suivent ainsi le basculement."
  options:
    a:
      en: "DeploymentPreference requires AutoPublishAlias, and a rule that targets the state machine ARN does not go through an alias."
      fr: "DeploymentPreference exige AutoPublishAlias, et une règle qui cible l'ARN de la machine d'état ne passe pas par un alias."
    b:
      en: "Without DeploymentPreference, the alias moves to the new version all at once."
      fr: "Sans DeploymentPreference, l'alias passe à la nouvelle version en une seule fois."
    d:
      en: "This shifts traffic between function versions, not between versions of the state machine definition, where the transformation steps changed."
      fr: "Cela bascule le trafic entre des versions de fonction, et non entre des versions de la définition de la machine d'état, où les étapes de transformation ont changé."
references:
  - title: AWS::Serverless::StateMachine
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-statemachine.html
