id: deac01-1a-crawler-incremental-crawl
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue crawler runs every hour on an Amazon S3 dataset that is partitioned by date and hour and already has about 20,000 partitions. Each hour, one new hour folder is added, and existing partitions are never modified or deleted. Each crawl now takes 40 minutes and keeps getting longer. The company must keep the hourly schedule and wants to reduce the crawl time without adding other AWS resources.

    Which solution will meet these requirements?
  fr: |
    Un robot d'analyse AWS Glue s'exécute toutes les heures sur un jeu de données Amazon S3 partitionné par date et par heure qui compte déjà environ 20 000 partitions. Chaque heure, un nouveau dossier horaire est ajouté, et les partitions existantes ne sont jamais modifiées ni supprimées. Chaque analyse dure désormais 40 minutes et s'allonge sans cesse. L'entreprise doit conserver la planification horaire et veut réduire la durée d'analyse sans ajouter d'autres ressources AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the recrawl policy of the crawler to crawl new sub-folders only (CRAWL_NEW_FOLDERS_ONLY).", fr: "Définir la politique de nouvelle analyse du robot sur l'analyse des nouveaux sous-dossiers uniquement (CRAWL_NEW_FOLDERS_ONLY)." } }
    - { id: b, text: { en: "Configure the crawler to use S3 event notifications delivered to a new Amazon SQS queue.", fr: "Configurer le robot pour qu'il utilise des notifications d'événements S3 livrées à une nouvelle file d'attente Amazon SQS." } }
    - { id: c, text: { en: "Change the crawler schedule to run every 6 hours so that each crawl has more time to complete.", fr: "Modifier la planification du robot pour qu'il s'exécute toutes les 6 heures afin que chaque analyse ait plus de temps pour se terminer." } }
    - { id: d, text: { en: "Turn on the crawler option that creates a single schema for each S3 path.", fr: "Activer l'option du robot qui crée un seul schéma pour chaque chemin S3." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With incremental crawls, the first run is a full crawl and later runs add only the partitions introduced since the previous crawl. This fits a dataset whose existing partitions never change, and it needs only a crawler setting."
    fr: "Avec les analyses incrémentielles, la première exécution est une analyse complète et les suivantes n'ajoutent que les partitions apparues depuis l'analyse précédente. Cela convient à un jeu de données dont les partitions existantes ne changent jamais, et ne nécessite qu'un paramètre du robot."
  options:
    b:
      en: "Event mode also shortens recrawls, but it requires an SQS queue and bucket notifications, which the requirements exclude."
      fr: "Le mode événementiel raccourcit aussi les nouvelles analyses, mais il exige une file d'attente SQS et des notifications de compartiment, ce que les exigences excluent."
    c:
      en: "This breaks the hourly schedule requirement and does not shorten each crawl."
      fr: "Cette solution ne respecte pas l'exigence de planification horaire et ne raccourcit pas chaque analyse."
    d:
      en: "This option controls how tables are grouped; the crawler still lists every partition on each run."
      fr: "Cette option contrôle le regroupement des tables ; le robot liste toujours chaque partition à chaque exécution."
references:
  - title: Scheduling incremental crawls for adding new partitions - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/incremental-crawls.html
