id: deac01-1d-sfn-glue-run-job-sync
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team orchestrates a nightly pipeline with an AWS Step Functions Standard workflow. Today, a Lambda function starts an AWS Glue job, and the workflow then loops through a Wait state and a second Lambda function that calls GetJobRun until the job finishes. The team wants the workflow to wait for the Glue job to complete before the next state, with the least custom code.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données orchestre un pipeline nocturne avec un flux de travail Standard AWS Step Functions. Aujourd'hui, une fonction Lambda démarre une tâche AWS Glue, puis le flux de travail boucle sur un état Wait et une deuxième fonction Lambda qui appelle GetJobRun jusqu'à la fin de la tâche. L'équipe veut que le flux de travail attende la fin de la tâche Glue avant l'état suivant, avec le moins de code personnalisé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace the Lambda functions with a Task state whose resource is arn:aws:states:::glue:startJobRun.", fr: "Remplacer les fonctions Lambda par un état Task dont la ressource est arn:aws:states:::glue:startJobRun." } }
    - { id: b, text: { en: "Use a Task state with the .waitForTaskToken pattern and make the Glue script call SendTaskSuccess at the end of the job.", fr: "Utiliser un état Task avec le modèle .waitForTaskToken et faire appeler SendTaskSuccess par le script Glue à la fin de la tâche." } }
    - { id: c, text: { en: "End the workflow after starting the job, and create an EventBridge rule on Glue Job State Change events that starts a second state machine.", fr: "Terminer le flux de travail après le démarrage de la tâche et créer une règle EventBridge sur les événements Glue Job State Change qui démarre une deuxième machine d'état." } }
    - { id: d, text: { en: "Replace the Lambda functions with a Task state whose resource is arn:aws:states:::glue:startJobRun.sync.", fr: "Remplacer les fonctions Lambda par un état Task dont la ressource est arn:aws:states:::glue:startJobRun.sync." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The optimized AWS Glue integration supports the Run a Job (.sync) pattern: Step Functions starts the job run and waits for it to complete before moving to the next state. The polling loop and both Lambda functions are no longer needed."
    fr: "L'intégration optimisée AWS Glue prend en charge le modèle Run a Job (.sync) : Step Functions démarre l'exécution de la tâche et attend qu'elle se termine avant de passer à l'état suivant. La boucle d'interrogation et les deux fonctions Lambda deviennent inutiles."
  options:
    a: { en: "Without .sync, the integration uses the Request Response pattern: the state ends as soon as the job run is started, not when it finishes.", fr: "Sans .sync, l'intégration utilise le modèle Request Response : l'état se termine dès que l'exécution de la tâche est démarrée, pas lorsqu'elle se termine." }
    b: { en: "The callback pattern works but requires code in the Glue script to pass the token back, which is more custom code than .sync.", fr: "Le modèle de rappel fonctionne, mais exige du code dans le script Glue pour renvoyer le jeton, soit plus de code personnalisé que .sync." }
    c: { en: "Splitting the pipeline into two state machines linked by an event rule adds resources and loses the single end-to-end execution history.", fr: "Découper le pipeline en deux machines d'état reliées par une règle d'événement ajoute des ressources et fait perdre l'historique d'exécution unique de bout en bout." }
references:
  - title: Start an AWS Glue job with Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-glue.html
