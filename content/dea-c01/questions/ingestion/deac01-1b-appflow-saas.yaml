id: deac01-1b-appflow-saas
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A sales operations team must combine account data from Salesforce with support tickets from Zendesk in an Amazon S3 data lake. The data must be transferred every day. The team has no developers and wants a fully managed service that needs no code.

    Which solution will meet these requirements?
  fr: |
    Une équipe des opérations commerciales doit combiner des données de comptes de Salesforce avec des tickets de support de Zendesk dans un lac de données Amazon S3. Les données doivent être transférées chaque jour. L'équipe n'a pas de développeurs et veut un service entièrement géré qui ne demande pas de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Write AWS Lambda functions that call the Salesforce and Zendesk APIs and schedule them with Amazon EventBridge Scheduler.", fr: "Écrire des fonctions AWS Lambda qui appellent les API Salesforce et Zendesk et les planifier avec Amazon EventBridge Scheduler." }
    - id: b
      text: { en: "Create AWS DMS tasks with Salesforce and Zendesk as source endpoints and Amazon S3 as the target endpoint.", fr: "Créer des tâches AWS DMS avec Salesforce et Zendesk comme points de terminaison source et Amazon S3 comme point de terminaison cible." }
    - id: c
      text: { en: "Create scheduled Amazon AppFlow flows from Salesforce and from Zendesk to the S3 bucket.", fr: "Créer des flux Amazon AppFlow planifiés de Salesforce et de Zendesk vers le compartiment S3." }
    - id: d
      text: { en: "Write AWS Glue Python shell jobs that page through the two APIs and run them on a daily trigger.", fr: "Écrire des tâches AWS Glue Python shell qui parcourent les deux API page par page et les exécuter avec un déclencheur quotidien." }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon AppFlow is a fully managed integration service that transfers data between SaaS applications such as Salesforce and Zendesk and AWS services such as Amazon S3, without code. Flows can run on demand, on a schedule, or on events, so a daily scheduled flow for each source meets the requirement."
    fr: "Amazon AppFlow est un service d'intégration entièrement géré qui transfère des données entre des applications SaaS comme Salesforce et Zendesk et des services AWS comme Amazon S3, sans code. Les flux peuvent s'exécuter à la demande, selon une planification ou sur événement : un flux planifié quotidien par source répond à l'exigence."
  options:
    a:
      en: "Lambda functions are code to write and maintain, including API authentication and paging, which the team cannot do."
      fr: "Des fonctions Lambda sont du code à écrire et maintenir, authentification et pagination des API comprises, ce que l'équipe ne peut pas faire."
    b:
      en: "AWS DMS migrates data from databases; Salesforce and Zendesk are not DMS source endpoints."
      fr: "AWS DMS migre des données depuis des bases de données ; Salesforce et Zendesk ne sont pas des points de terminaison source DMS."
    d:
      en: "Python shell jobs are custom code that the team would have to develop and maintain."
      fr: "Les tâches Python shell sont du code personnalisé que l'équipe devrait développer et maintenir."
references:
  - title: What is Amazon AppFlow?
    url: https://docs.aws.amazon.com/appflow/latest/userguide/what-is-appflow.html
