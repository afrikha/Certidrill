id: deac01-1a-glue-rest-connection
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data team builds its pipelines as AWS Glue ETL jobs. The team must ingest records from a partner's REST API that uses OAuth 2.0 client credentials and cursor-based pagination. The team wants AWS Glue to handle authentication and pagination, without writing or packaging custom connector code or HTTP client libraries.

    Which solution will meet these requirements?
  fr: |
    Une équipe données construit ses pipelines sous forme de tâches ETL AWS Glue. L'équipe doit ingérer des enregistrements de l'API REST d'un partenaire qui utilise les informations d'identification client OAuth 2.0 et une pagination par curseur. L'équipe veut qu'AWS Glue gère l'authentification et la pagination, sans écrire ni empaqueter de code de connecteur personnalisé ou de bibliothèques de client HTTP.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Register an AWS Glue REST connection type that defines the base URL, OAuth 2.0 client credentials and cursor-based pagination, and use it in the jobs.", fr: "Enregistrer un type de connexion REST AWS Glue qui définit l'URL de base, les informations d'identification client OAuth 2.0 et la pagination par curseur, et l'utiliser dans les tâches." } }
    - { id: b, text: { en: "Build an Amazon AppFlow custom connector with the AppFlow Custom Connector SDK, register it, and run flows that write to Amazon S3 for the jobs to read.", fr: "Développer un connecteur personnalisé Amazon AppFlow avec le SDK Custom Connector d'AppFlow, l'enregistrer et exécuter des flux qui écrivent dans Amazon S3 pour que les tâches les lisent." } }
    - { id: c, text: { en: "Create an AWS Glue crawler with the API base URL as its data store so that the crawler loads the API records into Data Catalog tables.", fr: "Créer un robot d'analyse AWS Glue avec l'URL de base de l'API comme magasin de données afin que le robot charge les enregistrements de l'API dans des tables du Data Catalog." } }
    - { id: d, text: { en: "Add an HTTP client library to the jobs with `--additional-python-modules` and write the token and pagination logic in the job scripts.", fr: "Ajouter une bibliothèque de client HTTP aux tâches avec `--additional-python-modules` et écrire la logique de jeton et de pagination dans les scripts des tâches." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS Glue REST connector connects to REST-based APIs without custom libraries. A registered connection type stores the connection properties, the authentication configuration (OAuth 2.0 client credentials is supported), the pagination configuration (cursor-based or offset-based) and the entities, and Glue jobs then use connections of that type."
    fr: "Le connecteur REST d'AWS Glue se connecte à des API REST sans bibliothèques personnalisées. Un type de connexion enregistré stocke les propriétés de connexion, la configuration d'authentification (les informations d'identification client OAuth 2.0 sont prises en charge), la configuration de pagination (par curseur ou par décalage) et les entités, puis les tâches Glue utilisent des connexions de ce type."
  options:
    b:
      en: "An AppFlow custom connector is code that the team must write with the SDK, package and maintain."
      fr: "Un connecteur personnalisé AppFlow est du code que l'équipe doit écrire avec le SDK, empaqueter et maintenir."
    c:
      en: "Crawlers infer schemas and write metadata; they do not call REST APIs or load records into tables."
      fr: "Les robots d'analyse déduisent des schémas et écrivent des métadonnées ; ils n'appellent pas d'API REST et ne chargent pas d'enregistrements dans des tables."
    d:
      en: "Writing the token handling and pagination in the scripts is the custom code the team wants to avoid."
      fr: "Écrire la gestion des jetons et la pagination dans les scripts est précisément le code personnalisé que l'équipe veut éviter."
references:
  - title: REST API Connections - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/rest-api-connections.html
