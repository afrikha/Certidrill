id: deac01-1a-kinesis-esm-filtering
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Producers write JSON events of many types to an Amazon Kinesis data stream. An AWS Lambda function that reads the stream through an event source mapping processes only events whose `eventType` field is `refund`; it ignores all other records, which are 95 % of the traffic. The company wants to reduce the number of invocations without changing the producers.

    Which solution will meet these requirements?
  fr: |
    Des producteurs écrivent des événements JSON de nombreux types dans un flux de données Amazon Kinesis. Une fonction AWS Lambda qui lit le flux via un mappage de source d'événement ne traite que les événements dont le champ `eventType` vaut `refund` ; elle ignore tous les autres enregistrements, qui représentent 95 % du trafic. L'entreprise veut réduire le nombre d'appels sans modifier les producteurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add filter criteria with the pattern `{ \"data\" : { \"eventType\" : [ \"refund\" ] } }` to the event source mapping.", fr: "Ajouter au mappage de source d'événement des critères de filtre avec le modèle `{ \"data\" : { \"eventType\" : [ \"refund\" ] } }`." } }
    - { id: b, text: { en: "Create a second data stream for refund events and point the event source mapping to the new stream.", fr: "Créer un second flux de données pour les événements de remboursement et faire pointer le mappage de source d'événement vers ce nouveau flux." } }
    - { id: c, text: { en: "Return early in the function code when `eventType` is not `refund` and reduce the function memory.", fr: "Quitter la fonction plus tôt dans le code lorsque `eventType` ne vaut pas `refund` et réduire la mémoire de la fonction." } }
    - { id: d, text: { en: "Insert an Amazon Data Firehose stream with a Lambda transformation that drops the other events before the function.", fr: "Insérer un flux Amazon Data Firehose avec une transformation Lambda qui supprime les autres événements avant la fonction." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Event source mappings support event filtering. For Kinesis, a pattern on the `data` key filters on fields of JSON record data, and Lambda does not send records that do not match to the function, which removes the useless invocations."
    fr: "Les mappages de source d'événement prennent en charge le filtrage d'événements. Pour Kinesis, un modèle sur la clé `data` filtre sur les champs des données JSON des enregistrements, et Lambda n'envoie pas à la fonction les enregistrements qui ne correspondent pas, ce qui supprime les appels inutiles."
  options:
    b:
      en: "Separating refund events into another stream requires the producers to write to it, which the requirements exclude."
      fr: "Séparer les événements de remboursement dans un autre flux exige que les producteurs y écrivent, ce que les exigences excluent."
    c:
      en: "The function is still invoked for every batch, so the number of invocations does not change."
      fr: "La fonction est toujours appelée pour chaque lot : le nombre d'appels ne change pas."
    d:
      en: "Firehose delivers to storage and analytics destinations, not to the function, and the transformation function adds invocations of its own."
      fr: "Firehose livre vers des destinations de stockage et d'analyse, pas vers la fonction, et la fonction de transformation ajoute ses propres appels."
references:
  - title: Using event filtering with a Kinesis event source - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis-filtering.html
