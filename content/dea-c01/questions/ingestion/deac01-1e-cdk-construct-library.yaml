id: deac01-1e-cdk-construct-library
objective: "1.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team defines a standard raw data zone: an Amazon S3 bucket with encryption and lifecycle rules, an AWS Glue database, a Glue crawler, and the IAM role of the crawler. Ten product teams build their stacks with the AWS CDK in TypeScript. Each team must add the raw zone to its own CDK application with the same defaults, set only the data prefix, and get fixes by upgrading a version.

    Which solution will meet these requirements?
  fr: |
    Une équipe plateforme définit une zone de données brutes standard : un compartiment Amazon S3 avec chiffrement et règles de cycle de vie, une base de données AWS Glue, un crawler AWS Glue et le rôle IAM du crawler. Dix équipes produit créent leurs piles avec l'AWS CDK en TypeScript. Chaque équipe doit ajouter la zone brute à sa propre application CDK avec les mêmes valeurs par défaut, ne définir que le préfixe des données, et obtenir les correctifs en passant à une nouvelle version.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Share a CloudFormation template in an S3 bucket, and ask each team to copy its resources into their stacks as L1 constructs.", fr: "Partager un modèle CloudFormation dans un compartiment S3, et demander à chaque équipe d'en copier les ressources dans ses piles sous forme de constructions L1." } }
    - { id: b, text: { en: "Deploy the raw zone to every team account with a CloudFormation StackSet that the platform team updates.", fr: "Déployer la zone brute dans le compte de chaque équipe avec un StackSet CloudFormation que l'équipe plateforme met à jour." } }
    - { id: c, text: { en: "Create a CloudFormation macro that adds the raw zone resources to every template that declares it.", fr: "Créer une macro CloudFormation qui ajoute les ressources de la zone brute à chaque modèle qui la déclare." } }
    - { id: d, text: { en: "Write a construct class that composes the L2 constructs, and publish it as a versioned package to an internal repository.", fr: "Écrire une classe de construction qui compose les constructions L2, et la publier comme package versionné dans un référentiel interne." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A CDK construct is a class, so a composed construct that bundles several resources with opinionated defaults can be packaged and shared like any code library. Teams instantiate it in their own applications with their prefix, and they receive improvements and fixes by upgrading the package version."
    fr: "Une construction CDK est une classe : une construction composée qui regroupe plusieurs ressources avec des valeurs par défaut prédéfinies peut donc être empaquetée et partagée comme n'importe quelle bibliothèque de code. Les équipes l'instancient dans leurs propres applications avec leur préfixe, et reçoivent améliorations et correctifs en passant à une nouvelle version du package."
  options:
    a:
      en: "Copied L1 resources have no shared defaults or versioning; each copy must be fixed by hand."
      fr: "Des ressources L1 copiées n'ont ni valeurs par défaut partagées ni gestion de versions : chaque copie doit être corrigée à la main."
    b:
      en: "A StackSet deploys separate stacks that the platform team owns; the raw zone is not part of each team's CDK application."
      fr: "Un StackSet déploie des piles distinctes détenues par l'équipe plateforme : la zone brute ne fait pas partie de l'application CDK de chaque équipe."
    c:
      en: "A macro requires a Lambda function to write and operate, and it is not a versioned dependency of the CDK applications."
      fr: "Une macro exige une fonction Lambda à écrire et à exploiter, et ce n'est pas une dépendance versionnée des applications CDK."
references:
  - title: AWS CDK Constructs
    url: https://docs.aws.amazon.com/cdk/v2/guide/constructs.html
