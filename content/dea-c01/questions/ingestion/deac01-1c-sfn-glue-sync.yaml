id: deac01-1c-sfn-glue-sync
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Step Functions state machine starts an AWS Glue job and then runs a validation step on the job output. The validation step often fails because it runs while the Glue job is still writing. The job run time varies from 10 to 50 minutes. The task state is the following:

    ```json
    "RunCurationJob": {
      "Type": "Task",
      "Resource": "arn:aws:states:::glue:startJobRun",
      "Parameters": {
        "JobName": "curate-orders"
      },
      "Next": "ValidateOutput"
    }
    ```

    Which change will make the validation step run only after the job run completes, with the LEAST operational overhead?
  fr: |
    Une machine d'état AWS Step Functions démarre une tâche AWS Glue, puis exécute une étape de validation sur la sortie de la tâche. L'étape de validation échoue souvent parce qu'elle s'exécute alors que la tâche Glue est encore en train d'écrire. La durée d'exécution de la tâche varie de 10 à 50 minutes. L'état Task est le suivant :

    ```json
    "RunCurationJob": {
      "Type": "Task",
      "Resource": "arn:aws:states:::glue:startJobRun",
      "Parameters": {
        "JobName": "curate-orders"
      },
      "Next": "ValidateOutput"
    }
    ```

    Quelle modification fera exécuter l'étape de validation uniquement après la fin de l'exécution de la tâche, avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Add a Wait state of 50 minutes between RunCurationJob and ValidateOutput.", fr: "Ajouter un état Wait de 50 minutes entre RunCurationJob et ValidateOutput." } }
    - { id: b, text: { en: "Change the resource to `arn:aws:states:::glue:startJobRun.waitForTaskToken`.", fr: "Remplacer la ressource par `arn:aws:states:::glue:startJobRun.waitForTaskToken`." } }
    - { id: c, text: { en: "Change the resource to `arn:aws:states:::glue:startJobRun.sync`.", fr: "Remplacer la ressource par `arn:aws:states:::glue:startJobRun.sync`." } }
    - { id: d, text: { en: "Add a Retry field to ValidateOutput that retries the validation every 5 minutes.", fr: "Ajouter un champ Retry à ValidateOutput qui réessaie la validation toutes les 5 minutes." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Without a suffix, the Glue integration uses the Request Response pattern: Step Functions moves to the next state as soon as StartJobRun returns a JobRunId. The .sync suffix uses the Run a Job pattern, so Step Functions waits until the job run finishes before it continues."
    fr: "Sans suffixe, l'intégration Glue utilise le modèle Request Response : Step Functions passe à l'état suivant dès que StartJobRun renvoie un JobRunId. Le suffixe .sync utilise le modèle Run a Job : Step Functions attend la fin de l'exécution de la tâche avant de continuer."
  options:
    a:
      en: "A fixed wait wastes time on short runs and still fails if a run exceeds 50 minutes."
      fr: "Une attente fixe fait perdre du temps sur les exécutions courtes et échoue tout de même si une exécution dépasse 50 minutes."
    b:
      en: "The callback pattern waits until something calls SendTaskSuccess with the token, so the Glue script or another component would have to send it."
      fr: "Le modèle de rappel attend qu'un composant appelle SendTaskSuccess avec le jeton : le script Glue ou un autre composant devrait l'envoyer."
    d:
      en: "Retrying the validation does not tie it to the end of the job and can validate partly written output."
      fr: "Réessayer la validation ne la lie pas à la fin de la tâche et peut valider une sortie partiellement écrite."
references:
  - title: Start an AWS Glue job with Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-glue.html
