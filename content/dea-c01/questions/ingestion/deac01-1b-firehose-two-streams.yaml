id: deac01-1b-firehose-two-streams
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company collects search events from its websites. The events must be delivered in near real time to an Amazon OpenSearch Service domain for troubleshooting and to the HTTP endpoint of a marketing partner. The company wants a fully managed delivery path without custom delivery code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages collecte les événements de recherche de ses sites web. Les événements doivent être livrés quasiment en temps réel à un domaine Amazon OpenSearch Service pour le dépannage et au point de terminaison HTTP d'un partenaire marketing. L'entreprise veut un chemin de livraison entièrement géré, sans code de livraison personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create one Firehose stream with Direct PUT as the source, and select OpenSearch Service and the HTTP endpoint as its two destinations.", fr: "Créer un flux Firehose avec Direct PUT comme source, et sélectionner OpenSearch Service et le point de terminaison HTTP comme ses deux destinations." }
    - id: b
      text: { en: "Write the events to a Kinesis data stream, and create two Firehose streams that use the data stream as their source, one for each destination.", fr: "Écrire les événements dans un flux de données Kinesis, et créer deux flux Firehose qui utilisent ce flux de données comme source, un par destination." }
    - id: c
      text: { en: "Deliver the events with one Firehose stream to OpenSearch Service with backup of all records to S3, and post the S3 objects to the partner with a Lambda function.", fr: "Livrer les événements avec un flux Firehose vers OpenSearch Service avec sauvegarde de tous les enregistrements dans S3, et envoyer les objets S3 au partenaire avec une fonction Lambda." }
    - id: d
      text: { en: "Write the events to a Kinesis data stream and process it with a Lambda function that indexes the events and calls the partner endpoint.", fr: "Écrire les événements dans un flux de données Kinesis et le traiter avec une fonction Lambda qui indexe les événements et appelle le point de terminaison du partenaire." }
answer: { optionId: b }
explanation:
  correct:
    en: "A Firehose stream has one source and one destination. Writing the events once to a Kinesis data stream and attaching two Firehose streams to it fans the same data out to OpenSearch Service and to the HTTP endpoint, each with managed buffering, retries, and backup."
    fr: "Un flux Firehose a une source et une destination. Écrire les événements une fois dans un flux de données Kinesis et y attacher deux flux Firehose diffuse les mêmes données vers OpenSearch Service et vers le point de terminaison HTTP, chacun avec mise en mémoire tampon, nouvelles tentatives et sauvegarde gérées."
  options:
    a:
      en: "You choose a single destination when you create a Firehose stream, so one stream cannot deliver to both."
      fr: "On choisit une seule destination lors de la création d'un flux Firehose : un flux ne peut pas livrer aux deux."
    c:
      en: "The partner delivery would depend on a custom Lambda function and on S3 batches, which is neither managed delivery nor near real time."
      fr: "La livraison au partenaire dépendrait d'une fonction Lambda personnalisée et de lots S3, ce qui n'est ni une livraison gérée ni du quasi temps réel."
    d:
      en: "The Lambda function is custom delivery code that must handle batching, retries, and failures for both destinations."
      fr: "La fonction Lambda est un code de livraison personnalisé qui doit gérer les lots, les nouvelles tentatives et les échecs pour les deux destinations."
references:
  - title: Choose source and destination for your Firehose stream
    url: https://docs.aws.amazon.com/firehose/latest/dev/create-name.html
