id: deac01-1e-cdk-bootstrap-environment
objective: "1.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer deploys an AWS CDK application to a new AWS account in the eu-west-1 Region for the first time. The application contains AWS Lambda functions whose code is packaged as CDK assets. The cdk deploy command fails and reports that the environment has not been bootstrapped.

    What should the data engineer do before running cdk deploy again?
  fr: |
    Un ingénieur de données déploie pour la première fois une application AWS CDK dans un nouveau compte AWS, dans la Région eu-west-1. L'application contient des fonctions AWS Lambda dont le code est empaqueté sous forme de ressources (assets) CDK. La commande cdk deploy échoue et indique que l'environnement n'a pas été amorcé (bootstrapped).

    Que doit faire l'ingénieur de données avant d'exécuter de nouveau cdk deploy ?
body:
  options:
    - { id: a, text: { en: "Run cdk synth, and create the stack from the synthesized template in the CloudFormation console.", fr: "Exécuter cdk synth, et créer la pile à partir du modèle synthétisé dans la console CloudFormation." } }
    - { id: b, text: { en: "Run cdk bootstrap aws://ACCOUNT-ID/eu-west-1 to deploy the CDKToolkit stack in that account and Region.", fr: "Exécuter cdk bootstrap aws://ACCOUNT-ID/eu-west-1 pour déployer la pile CDKToolkit dans ce compte et cette Région." } }
    - { id: c, text: { en: "Run cdk diff to compare the application with the resources that already exist in the account.", fr: "Exécuter cdk diff pour comparer l'application aux ressources qui existent déjà dans le compte." } }
    - { id: d, text: { en: "Create an S3 bucket by hand, and add its name to the cdk.json file of the application.", fr: "Créer un compartiment S3 à la main, et ajouter son nom au fichier cdk.json de l'application." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Each environment must be bootstrapped before the CDK can deploy to it. cdk bootstrap deploys the bootstrap stack, named CDKToolkit by default, which creates the S3 bucket for assets such as Lambda code, an Amazon ECR repository, and the IAM roles used for deployments."
    fr: "Chaque environnement doit être amorcé avant que le CDK puisse y déployer. cdk bootstrap déploie la pile d'amorçage, nommée CDKToolkit par défaut, qui crée le compartiment S3 des ressources comme le code Lambda, un référentiel Amazon ECR et les rôles IAM utilisés pour les déploiements."
  options:
    a:
      en: "A template created in the console does not upload the assets that the CDK CLI publishes, and it gives up the repeatable cdk deploy workflow."
      fr: "Un modèle créé dans la console ne charge pas les ressources que publie l'interface de ligne de commande CDK, et abandonne le flux reproductible de cdk deploy."
    c:
      en: "cdk diff only shows the differences between the application and the deployed stack; it does not prepare the environment."
      fr: "cdk diff montre seulement les différences entre l'application et la pile déployée ; il ne prépare pas l'environnement."
    d:
      en: "A bucket alone does not provide the roles and the other resources of the bootstrap stack that deployments use."
      fr: "Un compartiment seul ne fournit pas les rôles ni les autres ressources de la pile d'amorçage qu'utilisent les déploiements."
references:
  - title: AWS CDK bootstrapping
    url: https://docs.aws.amazon.com/cdk/v2/guide/bootstrapping.html
