id: deac01-1b-firehose-redshift-cidr
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company streams point-of-sale events through an Amazon Data Firehose stream to an Amazon Redshift provisioned cluster. The cluster runs in private subnets of a VPC and is not publicly accessible. Every delivery attempt fails with connection errors. The security team accepts a public endpoint for the cluster on the condition that only Firehose can open connections to it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution diffuse des événements de point de vente par un flux Amazon Data Firehose vers un cluster provisionné Amazon Redshift. Le cluster s'exécute dans des sous-réseaux privés d'un VPC et n'est pas accessible publiquement. Chaque tentative de livraison échoue avec des erreurs de connexion. L'équipe de sécurité accepte un point de terminaison public pour le cluster, à condition que seul Firehose puisse ouvrir des connexions vers lui.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an interface VPC endpoint for Firehose in the cluster's VPC and select it in the Firehose stream.", fr: "Créer un point de terminaison d'un VPC d'interface pour Firehose dans le VPC du cluster et le sélectionner dans le flux Firehose." }
    - id: b
      text: { en: "Add an inbound rule to the cluster's security group that references the security group of the Firehose stream.", fr: "Ajouter au groupe de sécurité du cluster une règle entrante qui référence le groupe de sécurité du flux Firehose." }
    - id: c
      text: { en: "Make the cluster publicly accessible and allow the Firehose CIDR block of the Region on the cluster port in its security group.", fr: "Rendre le cluster accessible publiquement et autoriser le bloc CIDR Firehose de la Région sur le port du cluster dans son groupe de sécurité." }
    - id: d
      text: { en: "Add a NAT gateway to the cluster's VPC and allow the Elastic IP address of the NAT gateway in the cluster's security group.", fr: "Ajouter une passerelle NAT au VPC du cluster et autoriser l'adresse IP Elastic de la passerelle NAT dans le groupe de sécurité du cluster." }
answer: { optionId: c }
explanation:
  correct:
    en: "For a Redshift provisioned cluster or Serverless workgroup in a VPC, Firehose requires the destination to be publicly accessible with a public IP address. Firehose uses one published CIDR block per Region, so an inbound rule that allows only that block on the Redshift port lets Firehose connect while other internet sources stay blocked."
    fr: "Pour un cluster provisionné ou un groupe de travail Serverless Redshift dans un VPC, Firehose exige que la destination soit accessible publiquement avec une adresse IP publique. Firehose utilise un bloc CIDR publié par Région : une règle entrante qui n'autorise que ce bloc sur le port Redshift permet à Firehose de se connecter tout en bloquant les autres sources Internet."
  options:
    a:
      en: "An interface endpoint lets clients in the VPC call the Firehose API; it does not give Firehose a private path to deliver into a Redshift cluster."
      fr: "Un point de terminaison d'interface permet aux clients du VPC d'appeler l'API Firehose ; il ne donne pas à Firehose un chemin privé pour livrer dans un cluster Redshift."
    b:
      en: "Firehose does not place network interfaces with a security group in the VPC for a Redshift destination, so there is no Firehose security group to reference."
      fr: "Firehose ne place pas d'interfaces réseau avec un groupe de sécurité dans le VPC pour une destination Redshift : il n'existe aucun groupe de sécurité Firehose à référencer."
    d:
      en: "A NAT gateway handles outbound connections from the VPC; the connections here are inbound from Firehose, which does not use that Elastic IP address."
      fr: "Une passerelle NAT gère les connexions sortantes du VPC ; ici, les connexions sont entrantes depuis Firehose, qui n'utilise pas cette adresse IP Elastic."
references:
  - title: Controlling access with Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/controlling-access.html
