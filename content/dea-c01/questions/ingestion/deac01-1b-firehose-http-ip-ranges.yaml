id: deac01-1b-firehose-http-ip-ranges
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company delivers clickstream records with an Amazon Data Firehose stream to an HTTP endpoint that runs in its own data center. The data center firewall drops traffic from any source address that is not explicitly allowed. The network team must update the firewall ingress rules so that Firehose can deliver to the endpoint.

    Which source addresses must the network team allow?
  fr: |
    Une entreprise livre des enregistrements de parcours de navigation (clickstream) avec un flux Amazon Data Firehose vers un point de terminaison HTTP qui s'exécute dans son propre centre de données. Le pare-feu du centre de données rejette le trafic de toute adresse source qui n'est pas explicitement autorisée. L'équipe réseau doit mettre à jour les règles d'entrée du pare-feu pour que Firehose puisse livrer au point de terminaison.

    Quelles adresses source l'équipe réseau doit-elle autoriser ?
body:
  options:
    - id: a
      text: { en: "All current AWS IP address ranges, including the ranges of every Region", fr: "Toutes les plages d'adresses IP AWS actuelles, y compris les plages de toutes les Régions" }
    - id: b
      text: { en: "Only the Firehose CIDR block that AWS documents for the Region of the stream", fr: "Uniquement le bloc CIDR Firehose qu'AWS documente pour la Région du flux" }
    - id: c
      text: { en: "The Elastic IP address of a NAT gateway in the VPC that hosts the Firehose stream", fr: "L'adresse IP Elastic d'une passerelle NAT dans le VPC qui héberge le flux Firehose" }
    - id: d
      text: { en: "The private CIDR range of an interface VPC endpoint for Firehose", fr: "La plage CIDR privée d'un point de terminaison d'un VPC d'interface pour Firehose" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS publishes no subset of IP address ranges specific to Firehose when the destination is an HTTP endpoint. The documentation tells you to add all current AWS IP address ranges, for all Regions, to the ingress rules."
    fr: "AWS ne publie aucun sous-ensemble de plages d'adresses IP propre à Firehose lorsque la destination est un point de terminaison HTTP. La documentation indique d'ajouter aux règles d'entrée toutes les plages d'adresses IP AWS actuelles, pour toutes les Régions."
  options:
    b:
      en: "Per-Region Firehose CIDR blocks are documented for destinations such as Amazon Redshift and Splunk, not for HTTP endpoints."
      fr: "Les blocs CIDR Firehose par Région sont documentés pour des destinations comme Amazon Redshift et Splunk, pas pour les points de terminaison HTTP."
    c:
      en: "A Firehose stream is a managed service resource that does not run in a customer VPC, so it does not send traffic through a NAT gateway of the company."
      fr: "Un flux Firehose est une ressource de service géré qui ne s'exécute pas dans un VPC client : il n'envoie pas son trafic par une passerelle NAT de l'entreprise."
    d:
      en: "An interface endpoint carries API calls from the VPC to Firehose; deliveries to the HTTP endpoint do not come from it, and Firehose does not deliver to HTTP endpoints in a VPC."
      fr: "Un point de terminaison d'interface transporte les appels d'API du VPC vers Firehose ; les livraisons au point de terminaison HTTP n'en proviennent pas, et Firehose ne livre pas à des points de terminaison HTTP situés dans un VPC."
references:
  - title: Controlling access with Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/controlling-access.html
