id: deac01-1b-lambda-tumbling-window
objective: "1.1.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company streams checkout events from 40 stores into an Amazon Kinesis data stream. An AWS Lambda function already reads the stream through an event source mapping. The company must write the number of checkouts per store for each 1-minute period to an Amazon DynamoDB table. The counts are small, and the company does not want to add another service or a database to hold intermediate counts.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution diffuse les événements de passage en caisse de 40 magasins dans un flux de données Amazon Kinesis. Une fonction AWS Lambda lit déjà le flux par un mappage de source d'événement. L'entreprise doit écrire dans une table Amazon DynamoDB le nombre de passages en caisse par magasin pour chaque période d'une minute. Les compteurs sont petits, et l'entreprise ne veut ajouter ni autre service ni base de données pour conserver les compteurs intermédiaires.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep the counts in a global variable of the function code and write them to DynamoDB when the minute changes.", fr: "Conserver les compteurs dans une variable globale du code de la fonction et les écrire dans DynamoDB au changement de minute." }
    - id: b
      text: { en: "Set the parallelization factor of the event source mapping to 10 and count the events in each batch that the function receives.", fr: "Définir le facteur de parallélisation du mappage de source d'événement à 10 et compter les événements de chaque lot que reçoit la fonction." }
    - id: c
      text: { en: "Set a 60-second tumbling window on the event source mapping, return the counts as state, and write them in the final invocation.", fr: "Définir une fenêtre bascule de 60 secondes sur le mappage de source d'événement, renvoyer les compteurs comme état, et les écrire lors de l'appel final." }
    - id: d
      text: { en: "Add an Amazon Data Firehose stream with a Lambda data transformation function that counts the records of each buffer.", fr: "Ajouter un flux Amazon Data Firehose avec une fonction Lambda de transformation des données qui compte les enregistrements de chaque tampon." }
answer: { optionId: c }
explanation:
  correct:
    en: "Lambda invocations are stateless by default, but a tumbling window, up to 900 seconds, makes Lambda pass a state object from one invocation to the next for each shard. The function adds each batch to the state, and the final invocation of the window, flagged by isFinalInvokeForWindow, writes the totals; the state can be up to 1 MB per shard, which fits small counts."
    fr: "Les appels Lambda sont sans état par défaut, mais une fenêtre bascule (tumbling window), jusqu'à 900 secondes, fait transmettre par Lambda un objet d'état d'un appel au suivant pour chaque partition. La fonction ajoute chaque lot à l'état, et l'appel final de la fenêtre, signalé par isFinalInvokeForWindow, écrit les totaux ; l'état peut atteindre 1 Mo par partition, ce qui suffit pour de petits compteurs."
  options:
    a:
      en: "Global variables live in one execution environment only; concurrent and recycled environments lose or split the counts."
      fr: "Les variables globales ne vivent que dans un environnement d'exécution ; des environnements simultanés ou recyclés perdent ou fragmentent les compteurs."
    b:
      en: "A parallelization factor raises throughput per shard; it keeps no state between invocations, so counts per minute cannot be built."
      fr: "Un facteur de parallélisation augmente le débit par partition ; il ne conserve aucun état entre les appels, et on ne peut pas construire de compteurs par minute."
    d:
      en: "A Firehose transformation processes each buffer independently, which is stateless, and it adds another service."
      fr: "Une transformation Firehose traite chaque tampon indépendamment, sans état, et ajoute un autre service."
references:
  - title: Implementing stateful Kinesis Data Streams processing in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-windows.html
