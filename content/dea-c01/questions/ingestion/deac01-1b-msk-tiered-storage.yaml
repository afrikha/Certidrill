id: deac01-1b-msk-tiered-storage
objective: "1.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company streams clickstream events through a topic in an Amazon MSK Provisioned cluster that runs Apache Kafka 3.6 on Standard brokers. The topic keeps 7 days of data on broker storage and uses the delete cleanup policy. A new requirement states that existing Kafka consumer applications must be able to reprocess up to 90 days of events, in production order, for backfills. The company wants to minimize storage cost and does not want to add brokers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise diffuse des événements de parcours de navigation par une rubrique (topic) d'un cluster Amazon MSK Provisioned qui exécute Apache Kafka 3.6 sur des brokers Standard. La rubrique conserve 7 jours de données sur le stockage des brokers et utilise la politique de nettoyage delete. Une nouvelle exigence impose que les applications consommatrices Kafka existantes puissent retraiter jusqu'à 90 jours d'événements, dans l'ordre de production, pour des remplissages rétroactifs. L'entreprise veut réduire le coût de stockage et ne veut pas ajouter de brokers.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on tiered storage for the topic and set the topic retention to 90 days with a short local retention.", fr: "Activer le stockage hiérarchisé pour la rubrique et définir la conservation de la rubrique à 90 jours avec une courte conservation locale." }
    - id: b
      text: { en: "Increase the EBS storage of every broker and set the retention of the topic to 90 days.", fr: "Augmenter le stockage EBS de chaque broker et définir la conservation de la rubrique à 90 jours." }
    - id: c
      text: { en: "Deliver the topic to Amazon S3 with Amazon Data Firehose and write a producer that republishes the S3 objects for each backfill.", fr: "Livrer la rubrique dans Amazon S3 avec Amazon Data Firehose et écrire un producteur qui republie les objets S3 pour chaque remplissage." }
    - id: d
      text: { en: "Change the cleanup policy of the topic to compact and set the retention of the topic to 90 days.", fr: "Passer la politique de nettoyage de la rubrique à compact et définir la conservation de la rubrique à 90 jours." }
answer: { optionId: a }
explanation:
  correct:
    en: "MSK tiered storage moves data that passes the local retention limit to a low-cost tier that scales to virtually unlimited storage, without adding brokers. Consumers read the older data with the same Kafka APIs and can reprocess it in its exact production order; clusters must run version 3.6.0 or later, and tiered topics must use the delete cleanup policy."
    fr: "Le stockage hiérarchisé MSK déplace les données qui dépassent la limite de conservation locale vers un niveau à faible coût qui offre un stockage quasiment illimité, sans ajouter de brokers. Les consommateurs lisent les données anciennes avec les mêmes API Kafka et peuvent les retraiter dans leur ordre exact de production ; le cluster doit exécuter la version 3.6.0 ou ultérieure, et les rubriques hiérarchisées doivent utiliser la politique de nettoyage delete."
  options:
    b:
      en: "Keeping 90 days on provisioned broker storage costs far more than the low-cost tier and must be resized as traffic grows."
      fr: "Conserver 90 jours sur le stockage provisionné des brokers coûte bien plus que le niveau à faible coût, et doit être redimensionné quand le trafic augmente."
    c:
      en: "Republishing from S3 is custom code, and the consumers would no longer read the original topic in its production order."
      fr: "Republier depuis S3 est du code personnalisé, et les consommateurs ne liraient plus la rubrique d'origine dans son ordre de production."
    d:
      en: "Compaction keeps only the latest record for each key, so most events would be lost, and compacted topics cannot use tiered storage."
      fr: "Le compactage ne conserve que le dernier enregistrement de chaque clé : la plupart des événements seraient perdus, et les rubriques compactées ne peuvent pas utiliser le stockage hiérarchisé."
references:
  - title: Tiered storage for Standard brokers
    url: https://docs.aws.amazon.com/msk/latest/developerguide/msk-tiered-storage.html
