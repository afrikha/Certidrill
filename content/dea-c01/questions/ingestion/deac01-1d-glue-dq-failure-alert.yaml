id: deac01-1d-glue-dq-failure-alert
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company evaluates an AWS Glue Data Quality ruleset every morning against several tables of the AWS Glue Data Catalog. The evaluation runs keep the default setting that publishes metrics to Amazon CloudWatch. The data stewards of the orders table want an SNS notification only when an evaluation of that table fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise évalue chaque matin un ensemble de règles (ruleset) AWS Glue Data Quality sur plusieurs tables de l'AWS Glue Data Catalog. Les exécutions d'évaluation conservent le paramètre par défaut qui publie les métriques dans Amazon CloudWatch. Les responsables des données (data stewards) de la table orders veulent une notification SNS uniquement lorsqu'une évaluation de cette table échoue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge rule that matches Glue Job State Change events with a state of FAILED, and target the SNS topic.", fr: "Créer une règle EventBridge qui correspond aux événements Glue Job State Change dont l'état est FAILED, avec la rubrique SNS comme cible." } }
    - { id: b, text: { en: "Configure an S3 event notification on the location where the evaluation results are stored, with the SNS topic as the destination.", fr: "Configurer une notification d'événement S3 sur l'emplacement où sont stockés les résultats d'évaluation, avec la rubrique SNS comme destination." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the glue.error.ALL metric of the evaluation runs, with the SNS topic as the alarm action.", fr: "Créer une alarme CloudWatch sur la métrique glue.error.ALL des exécutions d'évaluation, avec la rubrique SNS comme action d'alarme." } }
    - { id: d, text: { en: "Create an EventBridge rule for Data Quality Evaluation Results Available events in the FAILED state for the orders table, targeting the SNS topic.", fr: "Créer une règle EventBridge pour les événements Data Quality Evaluation Results Available à l'état FAILED pour la table orders, avec la rubrique SNS comme cible." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Glue Data Quality emits a Data Quality Evaluation Results Available event (source aws.glue-dataquality) when an evaluation completes. The event pattern can filter on detail.state FAILED and on the context fields such as databaseName and tableName, so only failed evaluations of the orders table reach the SNS topic. Publishing metrics to CloudWatch must stay enabled for these events to be sent."
    fr: "AWS Glue Data Quality émet un événement Data Quality Evaluation Results Available (source aws.glue-dataquality) à la fin d'une évaluation. Le modèle d'événement peut filtrer sur detail.state FAILED et sur les champs de contexte comme databaseName et tableName : seules les évaluations en échec de la table orders atteignent la rubrique SNS. La publication des métriques dans CloudWatch doit rester activée pour que ces événements soient envoyés."
  options:
    a: { en: "Data Catalog evaluation runs are not Glue job runs, and a failed ruleset does not produce a Glue Job State Change event.", fr: "Les exécutions d'évaluation du Data Catalog ne sont pas des exécutions de tâches Glue, et un ensemble de règles en échec ne produit pas d'événement Glue Job State Change." }
    b: { en: "Results are written for every evaluation, so the notification would fire for passing runs too and could not tell success from failure.", fr: "Des résultats sont écrits pour chaque évaluation : la notification se déclencherait aussi pour les exécutions réussies et ne distinguerait pas un succès d'un échec." }
    c: { en: "glue.error.ALL is a job observability metric that counts failed Spark job runs; it does not report rule outcomes of a Data Catalog evaluation.", fr: "glue.error.ALL est une métrique d'observabilité des tâches qui compte les exécutions Spark en échec ; elle ne rend pas compte du résultat des règles d'une évaluation du Data Catalog." }
references:
  - title: Setting up alerts, deployments, and scheduling
    url: https://docs.aws.amazon.com/glue/latest/dg/data-quality-alerts.html
