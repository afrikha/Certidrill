id: deac01-1e-cfn-redshift-snapshot-policies
objective: "1.4.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany manages an Amazon Redshift provisioned cluster as an AWS::Redshift::Cluster resource in an AWS CloudFormation stack. Engineers must be able to delete the stack and to apply any template change. Whenever CloudFormation would delete the cluster, because the stack is deleted or because an update replaces the cluster, a final snapshot must be kept. No cluster may be left running outside the stack.

    Which combination of template settings will meet these requirements? (Choose two.)
  fr: |
    AnyCompany gère un cluster provisionné Amazon Redshift comme ressource AWS::Redshift::Cluster dans une pile AWS CloudFormation. Les ingénieurs doivent pouvoir supprimer la pile et appliquer toute modification du modèle. Chaque fois que CloudFormation supprimerait le cluster, parce que la pile est supprimée ou parce qu'une mise à jour remplace le cluster, un instantané final doit être conservé. Aucun cluster ne doit rester en fonctionnement en dehors de la pile.

    Quelle combinaison de paramètres du modèle répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set DeletionPolicy to Snapshot on the cluster resource.", fr: "Définir DeletionPolicy sur Snapshot sur la ressource de cluster." } }
    - { id: b, text: { en: "Enable termination protection on the stack.", fr: "Activer la protection contre la résiliation sur la pile." } }
    - { id: c, text: { en: "Add a stack policy that denies Update:Replace on the cluster resource.", fr: "Ajouter une politique de pile qui refuse Update:Replace sur la ressource de cluster." } }
    - { id: d, text: { en: "Set UpdateReplacePolicy to Snapshot on the cluster resource.", fr: "Définir UpdateReplacePolicy sur Snapshot sur la ressource de cluster." } }
    - { id: e, text: { en: "Set DeletionPolicy to Retain on the cluster resource.", fr: "Définir DeletionPolicy sur Retain sur la ressource de cluster." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "DeletionPolicy applies when the stack is deleted or the resource is removed from the template, and Snapshot creates a snapshot before deleting a supported resource such as AWS::Redshift::Cluster. DeletionPolicy does not apply when an update replaces the resource; UpdateReplacePolicy covers that case, and its Snapshot value keeps a snapshot of the replaced cluster."
    fr: "DeletionPolicy s'applique quand la pile est supprimée ou que la ressource est retirée du modèle, et Snapshot crée un instantané avant de supprimer une ressource prise en charge comme AWS::Redshift::Cluster. DeletionPolicy ne s'applique pas quand une mise à jour remplace la ressource : UpdateReplacePolicy couvre ce cas, et sa valeur Snapshot conserve un instantané du cluster remplacé."
  options:
    b:
      en: "Termination protection prevents the stack from being deleted, which the engineers must be able to do, and it takes no snapshot."
      fr: "La protection contre la résiliation empêche la suppression de la pile, que les ingénieurs doivent pouvoir effectuer, et ne prend aucun instantané."
    c:
      en: "The stack policy blocks updates that replace the cluster, which breaks the requirement to apply any template change."
      fr: "La politique de pile bloque les mises à jour qui remplacent le cluster, ce qui contredit l'exigence d'appliquer toute modification du modèle."
    e:
      en: "Retain leaves the cluster running and billed outside the stack instead of keeping a snapshot."
      fr: "Retain laisse le cluster en fonctionnement et facturé en dehors de la pile au lieu de conserver un instantané."
references:
  - title: DeletionPolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html
  - title: UpdateReplacePolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatereplacepolicy.html
