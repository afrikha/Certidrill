id: deac01-1a-glue-group-small-files
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue ETL job reads about 40,000 JSON files of 5 KB each from one Amazon S3 prefix every hour with the following code. The job spends most of its run time scheduling thousands of tiny tasks. The data engineer must reduce the run time without adding workers.

    ```python
    dyf = glueContext.create_dynamic_frame.from_options(
        connection_type="s3",
        connection_options={"paths": ["s3://example-raw/events/"]},
        format="json",
    )
    ```

    Which change will meet these requirements?
  fr: |
    Une tâche ETL AWS Glue lit toutes les heures environ 40 000 fichiers JSON de 5 Ko chacun sous un même préfixe Amazon S3 avec le code suivant. La tâche passe la majeure partie de son temps d'exécution à planifier des milliers de toutes petites tâches. L'ingénieur données doit réduire la durée d'exécution sans ajouter de workers.

    ```python
    dyf = glueContext.create_dynamic_frame.from_options(
        connection_type="s3",
        connection_options={"paths": ["s3://example-raw/events/"]},
        format="json",
    )
    ```

    Quelle modification répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable job bookmarks for the job and add a `transformation_ctx` to the read.", fr: "Activer les signets de tâche pour la tâche et ajouter un `transformation_ctx` à la lecture." } }
    - { id: b, text: { en: "Change the worker type of the job from G.1X to G.2X.", fr: "Changer le type de worker de la tâche de G.1X à G.2X." } }
    - { id: c, text: { en: "Change `format=\"json\"` to `format=\"parquet\"` in the read.", fr: "Remplacer `format=\"json\"` par `format=\"parquet\"` dans la lecture." } }
    - { id: d, text: { en: "Add `\"groupFiles\": \"inPartition\"` and `\"groupSize\": \"134217728\"` to `connection_options`.", fr: "Ajouter `\"groupFiles\": \"inPartition\"` et `\"groupSize\": \"134217728\"` à `connection_options`." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With groupFiles set to inPartition, AWS Glue groups the small files of an S3 partition into larger in-memory partitions, here about 128 MB each, which cuts the number of tasks. Glue enables grouping automatically only above 50,000 input files, so this job needs the option."
    fr: "Avec groupFiles défini à inPartition, AWS Glue regroupe les petits fichiers d'une partition S3 dans des partitions en mémoire plus grandes, ici d'environ 128 Mo chacune, ce qui réduit le nombre de tâches. Glue n'active le regroupement automatiquement qu'au-delà de 50 000 fichiers d'entrée : cette tâche a donc besoin de l'option."
  options:
    a:
      en: "Bookmarks skip files already processed in earlier runs, but each run still reads every new small file as a separate task."
      fr: "Les signets ignorent les fichiers déjà traités lors des exécutions précédentes, mais chaque exécution lit toujours chaque nouveau petit fichier comme une tâche distincte."
    b:
      en: "Larger workers cost more per DPU-hour and do not reduce the number of tiny tasks."
      fr: "Des workers plus grands coûtent plus cher par DPU-heure et ne réduisent pas le nombre de toutes petites tâches."
    c:
      en: "The files are JSON; declaring another format does not convert them and the read would fail."
      fr: "Les fichiers sont en JSON ; déclarer un autre format ne les convertit pas et la lecture échouerait."
references:
  - title: Reading input files in larger groups - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/grouping-input-files.html
