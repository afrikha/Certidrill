id: deac01-1a-flink-existing-app
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a Java Apache Flink application on a self-managed Flink cluster on Amazon EC2. The application reads shipment events from an Amazon MSK cluster, keeps per-shipment state, and computes event-time windows. The company wants to keep the application code unchanged and stop managing the cluster, while getting automatic scaling and state backups through checkpoints and snapshots.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute une application Apache Flink en Java sur un cluster Flink autogéré sur Amazon EC2. L'application lit des événements d'expédition depuis un cluster Amazon MSK, conserve un état par expédition et calcule des fenêtres en temps d'événement. L'entreprise veut conserver le code de l'application sans modification et ne plus gérer le cluster, tout en bénéficiant de la mise à l'échelle automatique et de sauvegardes de l'état par points de contrôle et instantanés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Rewrite the logic as an AWS Glue streaming ETL job that reads the MSK topic through a Glue connection.", fr: "Réécrire la logique sous forme de tâche ETL AWS Glue de streaming qui lit la rubrique MSK via une connexion Glue." } }
    - { id: b, text: { en: "Deploy the application JAR as an Amazon Managed Service for Apache Flink application that reads from the MSK cluster.", fr: "Déployer le JAR de l'application comme application Amazon Managed Service for Apache Flink qui lit le cluster MSK." } }
    - { id: c, text: { en: "Run the application on an Amazon EMR on EC2 cluster with the Flink application installed and managed scaling turned on.", fr: "Exécuter l'application sur un cluster Amazon EMR on EC2 avec l'application Flink installée et la mise à l'échelle gérée activée." } }
    - { id: d, text: { en: "Create an Amazon Data Firehose stream with the MSK topic as its source and a Lambda function that holds the windows.", fr: "Créer un flux Amazon Data Firehose avec la rubrique MSK comme source et une fonction Lambda qui gère les fenêtres." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Managed Service for Apache Flink runs Flink applications written in Java, Scala, Python or SQL with the same operators, sources and sinks as self-hosted Flink. AWS provisions the compute, scales the application, handles Availability Zone failover, and backs up application state with checkpoints and snapshots."
    fr: "Managed Service for Apache Flink exécute des applications Flink écrites en Java, Scala, Python ou SQL avec les mêmes opérateurs, sources et récepteurs que Flink autohébergé. AWS provisionne le calcul, met l'application à l'échelle, gère le basculement entre zones de disponibilité et sauvegarde l'état de l'application par points de contrôle et instantanés."
  options:
    a:
      en: "Glue streaming jobs run Apache Spark, so the Flink application would have to be rewritten."
      fr: "Les tâches Glue de streaming exécutent Apache Spark : l'application Flink devrait être réécrite."
    c:
      en: "EMR on EC2 can run Flink, but the company would still manage a cluster."
      fr: "EMR on EC2 peut exécuter Flink, mais l'entreprise gérerait toujours un cluster."
    d:
      en: "A Firehose transformation function processes buffered batches independently and cannot keep Flink state or event-time windows; the logic would be rewritten."
      fr: "Une fonction de transformation Firehose traite indépendamment des lots mis en mémoire tampon et ne peut pas conserver d'état Flink ni de fenêtres en temps d'événement ; la logique serait réécrite."
references:
  - title: What is Amazon Managed Service for Apache Flink? - Managed Service for Apache Flink
    url: https://docs.aws.amazon.com/managed-flink/latest/java/what-is.html
