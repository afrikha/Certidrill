id: deac01-1c-athena-per-query-limit
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Analysts at a media company run ad hoc Amazon Athena queries in a dedicated workgroup. Several queries recently scanned an entire multi-terabyte table because the analysts forgot a filter on the partition column, which caused large charges. The company must stop any single query in this workgroup automatically as soon as it scans more than 1 TB.

    Which solution will meet these requirements?
  fr: |
    Les analystes d'une entreprise de médias exécutent des requêtes Amazon Athena ad hoc dans un groupe de travail dédié. Plusieurs requêtes ont récemment analysé une table entière de plusieurs téraoctets parce que les analystes avaient oublié un filtre sur la colonne de partition, ce qui a entraîné des frais importants. L'entreprise doit arrêter automatiquement toute requête de ce groupe de travail dès qu'elle analyse plus de 1 To.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure a per-workgroup data usage control of 1 TB per hour that sends an Amazon SNS notification.", fr: "Configurer un contrôle d'utilisation des données par groupe de travail de 1 To par heure qui envoie une notification Amazon SNS." } }
    - { id: b, text: { en: "Create an AWS Budgets cost budget for Athena with an alert at the amount that matches 1 TB scanned.", fr: "Créer un budget de coûts AWS Budgets pour Athena avec une alerte au montant qui correspond à 1 To analysé." } }
    - { id: c, text: { en: "Create an Amazon CloudWatch alarm on the ProcessedBytes metric of the workgroup that notifies the analysts.", fr: "Créer une alarme Amazon CloudWatch sur la métrique ProcessedBytes du groupe de travail qui avertit les analystes." } }
    - { id: d, text: { en: "Configure a per-query data usage control of 1 TB on the workgroup.", fr: "Configurer un contrôle d'utilisation des données par requête de 1 To sur le groupe de travail." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A per-query data usage control sets the maximum data that one query in the workgroup can scan. Athena cancels any query that exceeds the limit, and this action cannot be changed, so no query can scan more than 1 TB."
    fr: "Un contrôle d'utilisation des données par requête définit la quantité maximale de données qu'une requête du groupe de travail peut analyser. Athena annule toute requête qui dépasse la limite, et cette action ne peut pas être modifiée : aucune requête ne peut analyser plus de 1 To."
  options:
    a:
      en: "Per-workgroup controls aggregate the data scanned by all queries over a period and trigger an alarm; they do not cancel the running query."
      fr: "Les contrôles par groupe de travail cumulent les données analysées par toutes les requêtes sur une période et déclenchent une alarme ; ils n'annulent pas la requête en cours."
    b:
      en: "A budget alert only notifies after the spend is recorded; it does not stop an Athena query."
      fr: "Une alerte de budget ne fait que notifier une fois la dépense enregistrée ; elle n'arrête pas une requête Athena."
    c:
      en: "An alarm that notifies people does not stop the query; it keeps scanning until it finishes."
      fr: "Une alarme qui avertit des personnes n'arrête pas la requête : elle continue l'analyse jusqu'à la fin."
references:
  - title: Configure per-query and per-workgroup data usage controls
    url: https://docs.aws.amazon.com/athena/latest/ug/workgroups-setting-control-limits-cloudwatch.html
