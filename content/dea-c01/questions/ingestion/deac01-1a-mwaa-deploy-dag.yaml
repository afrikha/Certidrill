id: deac01-1a-mwaa-deploy-dag
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer wrote the following Apache Airflow DAG to start an AWS Glue job every day at 03:00. The company already runs an Amazon MWAA environment whose image includes the Amazon provider package.

    ```python
    from datetime import datetime
    from airflow import DAG
    from airflow.providers.amazon.aws.operators.glue import GlueJobOperator

    with DAG(
        dag_id="daily_orders_etl",
        start_date=datetime(2026, 11, 1),
        schedule="0 3 * * *",
        catchup=False,
    ) as dag:
        GlueJobOperator(task_id="run_orders_job", job_name="orders-etl")
    ```

    What should the data engineer do so that the DAG runs on its schedule with the LEAST effort?
  fr: |
    Un ingénieur données a écrit le DAG Apache Airflow suivant pour démarrer une tâche AWS Glue chaque jour à 03 h 00. L'entreprise exploite déjà un environnement Amazon MWAA dont l'image inclut le package de fournisseur Amazon.

    ```python
    from datetime import datetime
    from airflow import DAG
    from airflow.providers.amazon.aws.operators.glue import GlueJobOperator

    with DAG(
        dag_id="daily_orders_etl",
        start_date=datetime(2026, 11, 1),
        schedule="0 3 * * *",
        catchup=False,
    ) as dag:
        GlueJobOperator(task_id="run_orders_job", job_name="orders-etl")
    ```

    Que doit faire l'ingénieur données pour que le DAG s'exécute selon sa planification avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon EventBridge Scheduler schedule with `cron(0 3 * * ? *)` that triggers the DAG every day.", fr: "Créer une planification Amazon EventBridge Scheduler avec `cron(0 3 * * ? *)` qui déclenche le DAG chaque jour." } }
    - { id: b, text: { en: "Copy the DAG file to the `dags` folder of the environment's S3 bucket.", fr: "Copier le fichier du DAG dans le dossier `dags` du compartiment S3 de l'environnement." } }
    - { id: c, text: { en: "Add the DAG file name to the environment's `requirements.txt` file and update the environment.", fr: "Ajouter le nom du fichier du DAG au fichier `requirements.txt` de l'environnement et mettre à jour l'environnement." } }
    - { id: d, text: { en: "Package the DAG file in `plugins.zip`, upload the archive, and update the environment.", fr: "Empaqueter le fichier du DAG dans `plugins.zip`, charger l'archive et mettre à jour l'environnement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon MWAA syncs new and changed objects from the `dags` folder of its S3 bucket to the scheduler and workers every 30 seconds. Once the file is there, the Airflow scheduler parses the DAG and runs it on the schedule defined in the code."
    fr: "Amazon MWAA synchronise toutes les 30 secondes les objets nouveaux et modifiés du dossier `dags` de son compartiment S3 vers le planificateur et les workers. Une fois le fichier en place, le planificateur Airflow analyse le DAG et l'exécute selon la planification définie dans le code."
  options:
    a:
      en: "The schedule is already in the DAG, which the Airflow scheduler runs; an external schedule adds a second scheduler for nothing."
      fr: "La planification figure déjà dans le DAG, que le planificateur Airflow exécute ; une planification externe ajoute inutilement un second planificateur."
    c:
      en: "`requirements.txt` lists Python packages to install, not DAG files."
      fr: "`requirements.txt` liste des packages Python à installer, pas des fichiers de DAG."
    d:
      en: "`plugins.zip` holds custom plugins, and updating the environment takes longer than copying the DAG file."
      fr: "`plugins.zip` contient des plug-ins personnalisés, et la mise à jour de l'environnement prend plus de temps que la copie du fichier du DAG."
references:
  - title: Adding or updating DAGs - Amazon Managed Workflows for Apache Airflow
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/configuring-dag-folder.html
