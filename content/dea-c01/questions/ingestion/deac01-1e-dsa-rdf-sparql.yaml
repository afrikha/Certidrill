id: deac01-1e-dsa-rdf-sparql
objective: "1.4.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A pharmaceutical company is building a knowledge graph that links drugs, genes, and diseases. It must integrate public ontologies that are published as RDF triples according to W3C standards, and its scientists write their queries in SPARQL. The company wants a managed graph database.

    Which solution will meet these requirements?
  fr: |
    Une entreprise pharmaceutique crée un graphe de connaissances qui relie médicaments, gènes et maladies. Elle doit intégrer des ontologies publiques publiées sous forme de triplets RDF selon les normes du W3C, et ses scientifiques écrivent leurs requêtes en SPARQL. L'entreprise veut une base de données de graphes gérée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Load the triples into Amazon Neptune as an RDF graph, and query it with SPARQL.", fr: "Charger les triplets dans Amazon Neptune sous forme de graphe RDF, et l'interroger avec SPARQL." } }
    - { id: b, text: { en: "Load the data into Amazon Neptune as a property graph, and query it with openCypher.", fr: "Charger les données dans Amazon Neptune sous forme de graphe de propriétés, et l'interroger avec openCypher." } }
    - { id: c, text: { en: "Store each edge as an item of an Amazon DynamoDB adjacency list, and query it with PartiQL.", fr: "Stocker chaque arête comme élément d'une liste d'adjacence Amazon DynamoDB, et l'interroger avec PartiQL." } }
    - { id: d, text: { en: "Index the triples as nested documents in Amazon OpenSearch Service, and query them with SQL.", fr: "Indexer les triplets sous forme de documents imbriqués dans Amazon OpenSearch Service, et les interroger avec SQL." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A graph stores entities as vertices and their relationships as edges. Amazon Neptune supports two graph models: the property graph, queried with Gremlin or openCypher, and RDF, queried with the W3C SPARQL language. RDF triples and SPARQL queries therefore require the RDF model."
    fr: "Un graphe stocke les entités sous forme de sommets et leurs relations sous forme d'arêtes. Amazon Neptune prend en charge deux modèles de graphe : le graphe de propriétés, interrogé avec Gremlin ou openCypher, et RDF, interrogé avec le langage SPARQL du W3C. Des triplets RDF et des requêtes SPARQL exigent donc le modèle RDF."
  options:
    b:
      en: "A property graph is queried with Gremlin or openCypher, not SPARQL, and does not keep the RDF triples as published."
      fr: "Un graphe de propriétés s'interroge avec Gremlin ou openCypher, et non SPARQL, et ne conserve pas les triplets RDF tels que publiés."
    c:
      en: "An adjacency list in DynamoDB is not a graph database and offers no SPARQL support."
      fr: "Une liste d'adjacence dans DynamoDB n'est pas une base de données de graphes et ne prend pas en charge SPARQL."
    d:
      en: "OpenSearch Service is a search engine; it does not store RDF graphs or run SPARQL."
      fr: "OpenSearch Service est un moteur de recherche ; il ne stocke pas de graphes RDF et n'exécute pas SPARQL."
references:
  - title: What Is Amazon Neptune?
    url: https://docs.aws.amazon.com/neptune/latest/userguide/intro.html
