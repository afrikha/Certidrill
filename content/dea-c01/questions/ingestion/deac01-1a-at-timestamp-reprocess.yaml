id: deac01-1a-at-timestamp-reprocess
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company reads an Amazon Kinesis data stream with a custom consumer that calls the GetShardIterator and GetRecords APIs. The stream retention period is 7 days. A bug in the consumer corrupted every record processed since yesterday at 10:00 UTC, and the bug is now fixed. The company must reprocess only the records that arrived since that time.

    Which shard iterator type should the consumer use?
  fr: |
    Une entreprise lit un flux de données Amazon Kinesis avec un consommateur personnalisé qui appelle les API GetShardIterator et GetRecords. La période de conservation du flux est de 7 jours. Un bogue du consommateur a corrompu chaque enregistrement traité depuis hier à 10 h 00 UTC, et le bogue est maintenant corrigé. L'entreprise doit retraiter uniquement les enregistrements arrivés depuis ce moment.

    Quel type d'itérateur de partition le consommateur doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "TRIM_HORIZON", fr: "TRIM_HORIZON" } }
    - { id: b, text: { en: "AT_TIMESTAMP, with the Timestamp parameter set to yesterday at 10:00 UTC", fr: "AT_TIMESTAMP, avec le paramètre Timestamp défini à hier 10 h 00 UTC" } }
    - { id: c, text: { en: "LATEST", fr: "LATEST" } }
    - { id: d, text: { en: "AFTER_SEQUENCE_NUMBER, with the last sequence number that the consumer checkpointed", fr: "AFTER_SEQUENCE_NUMBER, avec le dernier numéro de séquence enregistré par le consommateur" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AT_TIMESTAMP starts reading at the record that matches the given timestamp, or at the next later record. The consumer therefore rereads exactly the records that arrived since 10:00 UTC yesterday, which are still within the 7-day retention period."
    fr: "AT_TIMESTAMP commence la lecture à l'enregistrement correspondant à l'horodatage indiqué, ou à l'enregistrement suivant. Le consommateur relit donc exactement les enregistrements arrivés depuis hier 10 h 00 UTC, qui sont toujours dans la période de conservation de 7 jours."
  options:
    a:
      en: "TRIM_HORIZON starts at the oldest untrimmed record, so the consumer would reprocess up to 7 days of data instead of only the affected records."
      fr: "TRIM_HORIZON commence au plus ancien enregistrement non supprimé : le consommateur retraiterait jusqu'à 7 jours de données au lieu des seuls enregistrements concernés."
    c:
      en: "LATEST starts after the most recent record, so none of the affected records would be reprocessed."
      fr: "LATEST commence après l'enregistrement le plus récent : aucun des enregistrements concernés ne serait retraité."
    d:
      en: "The last checkpoint is at the current position, after the corrupted records, so reading after it skips them."
      fr: "Le dernier point de contrôle se trouve à la position actuelle, après les enregistrements corrompus : lire après lui les ignore."
references:
  - title: GetShardIterator - Amazon Kinesis Data Streams Service
    url: https://docs.aws.amazon.com/kinesis/latest/APIReference/API_GetShardIterator.html
