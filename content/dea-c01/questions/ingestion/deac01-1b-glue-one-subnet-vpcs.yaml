id: deac01-1b-glue-one-subnet-vpcs
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue ETL job joins a table from an Amazon RDS for PostgreSQL database in VPC A with a table from an Amazon RDS for MySQL database in VPC B. The CIDR ranges of the two VPCs do not overlap. The engineer attaches one Glue JDBC connection for each database to the job, but the job runs in the subnet of the PostgreSQL connection in VPC A and cannot reach the MySQL database. Both databases must stay private.

    Which solution will let the job read both tables?
  fr: |
    Une tâche ETL AWS Glue joint une table d'une base de données Amazon RDS for PostgreSQL du VPC A avec une table d'une base de données Amazon RDS for MySQL du VPC B. Les plages CIDR des deux VPC ne se chevauchent pas. L'ingénieur attache à la tâche une connexion JDBC Glue par base de données, mais la tâche s'exécute dans le sous-réseau de la connexion PostgreSQL du VPC A et ne peut pas atteindre la base MySQL. Les deux bases de données doivent rester privées.

    Quelle solution permet à la tâche de lire les deux tables ?
body:
  options:
    - id: a
      text: { en: "Turn on public access for both DB instances and remove the JDBC connections so that the job uses public endpoints.", fr: "Activer l'accès public des deux instances de base de données et retirer les connexions JDBC pour que la tâche utilise des points de terminaison publics." }
    - id: b
      text: { en: "Create an interface VPC endpoint for AWS Glue in VPC B so that the job can reach the MySQL database.", fr: "Créer un point de terminaison d'un VPC d'interface pour AWS Glue dans le VPC B afin que la tâche puisse atteindre la base MySQL." }
    - id: c
      text: { en: "Increase the number of workers of the job so that Glue creates network interfaces in both VPCs.", fr: "Augmenter le nombre de workers de la tâche pour que Glue crée des interfaces réseau dans les deux VPC." }
    - id: d
      text: { en: "Peer VPC A with VPC B, and update routes and security groups so that the job's subnet in VPC A reaches the MySQL database.", fr: "Créer un peering entre le VPC A et le VPC B, et mettre à jour les itinéraires et les groupes de sécurité pour que le sous-réseau de la tâche dans le VPC A atteigne la base MySQL." }
answer: { optionId: d }
explanation:
  correct:
    en: "A Glue job can access only one VPC and subnet at a time, and its JDBC connections must use data stores on that subnet or reachable from it. Peering the VPCs, with routes and security group rules, makes the MySQL database reachable from the job's subnet in VPC A while both databases stay private."
    fr: "Une tâche Glue ne peut accéder qu'à un seul VPC et un seul sous-réseau à la fois, et ses connexions JDBC doivent utiliser des magasins de données situés sur ce sous-réseau ou accessibles depuis lui. Le peering des VPC, avec les itinéraires et les règles de groupes de sécurité, rend la base MySQL accessible depuis le sous-réseau de la tâche dans le VPC A, tandis que les deux bases restent privées."
  options:
    a:
      en: "Public access exposes both databases outside their VPCs, which breaks the requirement that they stay private."
      fr: "L'accès public expose les deux bases hors de leurs VPC, ce qui enfreint l'exigence selon laquelle elles restent privées."
    b:
      en: "An interface endpoint lets clients in VPC B call the AWS Glue API; it does not give the job, which runs in one subnet of VPC A, a path to the database."
      fr: "Un point de terminaison d'interface permet aux clients du VPC B d'appeler l'API AWS Glue ; il ne donne pas à la tâche, qui s'exécute dans un sous-réseau du VPC A, de chemin vers la base de données."
    c:
      en: "More workers add capacity in the same subnet; they do not place the job in a second VPC."
      fr: "Davantage de workers ajoutent de la capacité dans le même sous-réseau ; ils ne placent pas la tâche dans un second VPC."
references:
  - title: Setting up network access to data stores
    url: https://docs.aws.amazon.com/glue/latest/dg/start-connecting.html
  - title: AWS Glue connection properties
    url: https://docs.aws.amazon.com/glue/latest/dg/connection-properties.html
