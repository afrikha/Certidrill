id: deac01-1b-flink-snapshot-update
objective: "1.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon Managed Service for Apache Flink application that keeps running totals of purchases for each customer in application state. The team must deploy a new version of the application code. The accumulated totals must not be lost, and processing must stay exactly once across the update.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application Amazon Managed Service for Apache Flink qui conserve dans l'état de l'application des totaux cumulés d'achats pour chaque client. L'équipe doit déployer une nouvelle version du code de l'application. Les totaux accumulés ne doivent pas être perdus, et le traitement doit rester exactement une fois (exactly once) pendant la mise à jour.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Delete the application and create a new application from the new code with the same input stream.", fr: "Supprimer l'application et créer une nouvelle application à partir du nouveau code avec le même flux d'entrée." }
    - id: b
      text: { en: "Turn on snapshots for the application and update it with a restore configuration that restores from the latest snapshot.", fr: "Activer les instantanés pour l'application et la mettre à jour avec une configuration de restauration qui restaure à partir du dernier instantané." }
    - id: c
      text: { en: "Turn off snapshots and reduce the checkpoint interval before the application is updated.", fr: "Désactiver les instantanés et réduire l'intervalle des points de contrôle avant de mettre à jour l'application." }
    - id: d
      text: { en: "Change the code so that it writes the totals to files in Amazon S3 at shutdown and reads them again at startup.", fr: "Modifier le code pour qu'il écrive les totaux dans des fichiers Amazon S3 à l'arrêt et les relise au démarrage." }
answer: { optionId: b }
explanation:
  correct:
    en: "A snapshot is a backup of the application state, implemented as an Apache Flink savepoint. With snapshots turned on, the service creates a system snapshot when the application is updated, and a restore configuration that loads the latest snapshot keeps the state and exactly-once processing across the update."
    fr: "Un instantané est une sauvegarde de l'état de l'application, implémentée comme un savepoint Apache Flink. Avec les instantanés activés, le service crée un instantané système lors de la mise à jour de l'application, et une configuration de restauration qui charge le dernier instantané conserve l'état et le traitement exactement une fois pendant la mise à jour."
  options:
    a:
      en: "A new application starts with empty state, so the accumulated totals are lost."
      fr: "Une nouvelle application démarre avec un état vide : les totaux accumulés sont perdus."
    c:
      en: "Checkpoints recover a running application from failures; with snapshots turned off, an application update discards the state data."
      fr: "Les points de contrôle rétablissent une application en cours d'exécution après une défaillance ; avec les instantanés désactivés, une mise à jour de l'application supprime les données d'état."
    d:
      en: "Custom state files are code to maintain and are not coordinated with the stream positions, so exactly-once processing is not guaranteed."
      fr: "Des fichiers d'état personnalisés sont du code à maintenir et ne sont pas coordonnés avec les positions dans le flux : le traitement exactement une fois n'est pas garanti."
references:
  - title: Manage application backups using snapshots
    url: https://docs.aws.amazon.com/managed-flink/latest/java/how-snapshots.html
  - title: Implement fault tolerance in Managed Service for Apache Flink
    url: https://docs.aws.amazon.com/managed-flink/latest/java/how-fault.html
