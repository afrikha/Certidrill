id: deac01-1b-emr-on-eks-shared
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its microservices on an Amazon EKS cluster that has spare capacity at night. The data team wants to run its Apache Spark ETL jobs on the same cluster instead of operating a separate cluster, and two teams need different versions of the open-source frameworks. The company wants AWS to build and manage the Spark containers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute ses microservices sur un cluster Amazon EKS qui dispose de capacité libre la nuit. L'équipe de données veut exécuter ses tâches ETL Apache Spark sur le même cluster au lieu d'exploiter un cluster distinct, et deux équipes ont besoin de versions différentes des frameworks open source. L'entreprise veut qu'AWS construise et gère les conteneurs Spark.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon EMR cluster on EC2 for each team and schedule the jobs at night.", fr: "Créer un cluster Amazon EMR sur EC2 pour chaque équipe et planifier les tâches la nuit." }
    - id: b
      text: { en: "Rewrite the jobs as AWS Glue ETL jobs that run in the EKS cluster's VPC.", fr: "Réécrire les tâches sous forme de tâches ETL AWS Glue qui s'exécutent dans le VPC du cluster EKS." }
    - id: c
      text: { en: "Use Amazon EMR on EKS and submit the jobs to virtual clusters that map to namespaces of the EKS cluster.", fr: "Utiliser Amazon EMR on EKS et soumettre les tâches à des clusters virtuels associés à des espaces de noms du cluster EKS." }
    - id: d
      text: { en: "Install an open-source Spark operator on the EKS cluster and maintain custom Spark images for each team.", fr: "Installer un opérateur Spark open source sur le cluster EKS et maintenir des images Spark personnalisées pour chaque équipe." }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon EMR on EKS runs open-source big data frameworks such as Apache Spark on an existing EKS cluster, so EMR workloads share the cluster with other containerized applications. EMR on EKS builds, configures, and manages the containers, and a shared cluster can run workloads that need different framework versions."
    fr: "Amazon EMR on EKS exécute des frameworks big data open source comme Apache Spark sur un cluster EKS existant : les charges de travail EMR partagent le cluster avec d'autres applications conteneurisées. EMR on EKS construit, configure et gère les conteneurs, et un cluster partagé peut exécuter des charges qui demandent des versions de frameworks différentes."
  options:
    a:
      en: "Separate EMR clusters on EC2 do not use the spare capacity of the EKS cluster and add clusters to operate."
      fr: "Des clusters EMR distincts sur EC2 n'utilisent pas la capacité libre du cluster EKS et ajoutent des clusters à exploiter."
    b:
      en: "AWS Glue runs jobs on its own serverless capacity, not on the nodes of the company's EKS cluster, and the jobs would have to be rewritten."
      fr: "AWS Glue exécute les tâches sur sa propre capacité sans serveur, pas sur les nœuds du cluster EKS de l'entreprise, et les tâches devraient être réécrites."
    d:
      en: "A self-managed operator and custom images leave container building and upgrades to the team, which breaks the managed-container requirement."
      fr: "Un opérateur autogéré et des images personnalisées laissent à l'équipe la construction et les mises à jour des conteneurs, ce qui enfreint l'exigence de conteneurs gérés."
references:
  - title: What is Amazon EMR on EKS?
    url: https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/emr-eks.html
