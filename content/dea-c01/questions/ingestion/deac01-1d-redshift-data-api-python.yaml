id: deac01-1d-redshift-data-api-python
objective: "1.4.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    After each load, a Python Lambda function must run a reconciliation SQL query against an Amazon Redshift Serverless workgroup and read the result. The team does not want to package database drivers, manage database connections, or store database passwords in the function configuration.

    Which combination of steps should the function code perform? (Choose two.)
  fr: |
    Après chaque chargement, une fonction Lambda Python doit exécuter une requête SQL de rapprochement sur un groupe de travail Amazon Redshift Serverless et en lire le résultat. L'équipe ne veut ni empaqueter de pilotes de base de données, ni gérer de connexions à la base, ni stocker de mots de passe de base de données dans la configuration de la fonction.

    Quelle combinaison d'étapes le code de la fonction doit-il effectuer ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Call describe_statement with the returned Id until the status is FINISHED, and then call get_statement_result.", fr: "Appeler describe_statement avec l'Id renvoyé jusqu'à ce que le statut soit FINISHED, puis appeler get_statement_result." } }
    - { id: b, text: { en: "Open a connection with the redshift_connector driver from a Lambda layer in the initialization code and reuse it across invocations.", fr: "Ouvrir une connexion avec le pilote redshift_connector fourni par une couche Lambda dans le code d'initialisation et la réutiliser entre les appels." } }
    - { id: c, text: { en: "Call execute_statement of the redshift-data client with the WorkgroupName, the Database, and the SQL text, using the execution role for temporary credentials.", fr: "Appeler execute_statement du client redshift-data avec WorkgroupName, Database et le texte SQL, en utilisant le rôle d'exécution pour obtenir des informations d'identification temporaires." } }
    - { id: d, text: { en: "Read the rows of the result from the response of the execute_statement call.", fr: "Lire les lignes du résultat dans la réponse de l'appel execute_statement." } }
    - { id: e, text: { en: "Store the database user name and password in environment variables and pass them to execute_statement.", fr: "Stocker le nom d'utilisateur et le mot de passe de la base dans des variables d'environnement et les passer à execute_statement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The Redshift Data API runs SQL over a secure HTTP endpoint without drivers or persistent connections and supports Serverless workgroups through WorkgroupName, with temporary credentials based on the IAM identity. It is asynchronous: execute_statement returns a statement Id, describe_statement reports its status, and get_statement_result returns the rows once the statement has finished.
    fr: |
      L'API Redshift Data exécute du SQL via un point de terminaison HTTP sécurisé, sans pilotes ni connexions persistantes, et prend en charge les groupes de travail Serverless via WorkgroupName, avec des informations d'identification temporaires fondées sur l'identité IAM. Elle est asynchrone : execute_statement renvoie l'Id de l'instruction, describe_statement indique son statut et get_statement_result renvoie les lignes une fois l'instruction terminée.
  options:
    b: { en: "A driver in a layer and a persistent connection are exactly what the team wants to avoid.", fr: "Un pilote dans une couche et une connexion persistante sont précisément ce que l'équipe veut éviter." }
    d: { en: "execute_statement returns only the statement Id and metadata; the rows are read later with get_statement_result.", fr: "execute_statement ne renvoie que l'Id de l'instruction et des métadonnées ; les lignes sont lues ensuite avec get_statement_result." }
    e: { en: "This stores a database password in the function configuration; the Data API accepts temporary credentials or a Secrets Manager secret instead.", fr: "Cela stocke un mot de passe de base de données dans la configuration de la fonction ; l'API Data accepte à la place des informations d'identification temporaires ou un secret Secrets Manager." }
references:
  - title: Using the Amazon Redshift Data API
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/data-api.html
