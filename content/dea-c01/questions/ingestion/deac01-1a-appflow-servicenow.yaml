id: deac01-1a-appflow-servicenow
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An IT operations team wants incident records from its ServiceNow instance copied every day to an Amazon S3 bucket in Apache Parquet format so that it can query them with Amazon Athena. The team has no developers and does not want to manage any infrastructure.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'exploitation informatique veut que les enregistrements d'incidents de son instance ServiceNow soient copiés chaque jour dans un compartiment Amazon S3 au format Apache Parquet afin de les interroger avec Amazon Athena. L'équipe n'a pas de développeurs et ne veut gérer aucune infrastructure.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS DMS task with a ServiceNow source endpoint and an S3 target endpoint that writes Parquet files.", fr: "Créer une tâche AWS DMS avec un point de terminaison source ServiceNow et un point de terminaison cible S3 qui écrit des fichiers Parquet." } }
    - { id: b, text: { en: "Create an AWS DataSync task that copies the ServiceNow incident table to the bucket on a daily schedule.", fr: "Créer une tâche AWS DataSync qui copie la table des incidents ServiceNow dans le compartiment selon une planification quotidienne." } }
    - { id: c, text: { en: "Create an Amazon API Gateway REST API that ServiceNow calls daily, with an AWS Lambda integration that writes Parquet files.", fr: "Créer une API REST Amazon API Gateway que ServiceNow appelle chaque jour, avec une intégration AWS Lambda qui écrit des fichiers Parquet." } }
    - { id: d, text: { en: "Create an Amazon AppFlow flow with ServiceNow as the source, a daily schedule, and the bucket as a Parquet destination.", fr: "Créer un flux Amazon AppFlow avec ServiceNow comme source, une planification quotidienne et le compartiment comme destination Parquet." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon AppFlow has a ServiceNow source connector, runs flows on a schedule, and can write records to Amazon S3 as JSONL, CSV or Apache Parquet. It is fully managed and needs no code."
    fr: "Amazon AppFlow dispose d'un connecteur source ServiceNow, exécute les flux selon une planification et peut écrire les enregistrements dans Amazon S3 au format JSONL, CSV ou Apache Parquet. Il est entièrement géré et ne nécessite aucun code."
  options:
    a:
      en: "AWS DMS migrates databases and does not offer ServiceNow as a source endpoint."
      fr: "AWS DMS migre des bases de données et ne propose pas ServiceNow comme point de terminaison source."
    b:
      en: "DataSync transfers files and objects between storage systems, not records from a SaaS application."
      fr: "DataSync transfère des fichiers et des objets entre systèmes de stockage, pas des enregistrements d'une application SaaS."
    c:
      en: "This requires writing a Lambda function and configuring an outbound integration in ServiceNow, which a team without developers cannot do."
      fr: "Cette solution exige d'écrire une fonction Lambda et de configurer une intégration sortante dans ServiceNow, ce qu'une équipe sans développeurs ne peut pas faire."
references:
  - title: ServiceNow - Amazon AppFlow
    url: https://docs.aws.amazon.com/appflow/latest/userguide/servicenow.html
  - title: Amazon S3 - Amazon AppFlow
    url: https://docs.aws.amazon.com/appflow/latest/userguide/s3.html
