id: deac01-1d-redshift-merge-upsert
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every day, a COPY command loads the new and changed customer rows into a staging table named stg_customers in Amazon Redshift. The staging table has the same columns as the customers table, in the same order, and contains at most one row per customer_id. The customers table must be updated with the changed rows and receive the new rows in a single SQL statement, and customers that are not in the daily file must be kept.

    Which statement will meet these requirements?
  fr: |
    Chaque jour, une commande COPY charge les lignes de clients nouvelles et modifiées dans une table intermédiaire nommée stg_customers dans Amazon Redshift. La table intermédiaire a les mêmes colonnes que la table customers, dans le même ordre, et contient au plus une ligne par customer_id. La table customers doit être mise à jour avec les lignes modifiées et recevoir les nouvelles lignes en une seule instruction SQL, et les clients absents du fichier quotidien doivent être conservés.

    Quelle instruction répond à ces exigences ?
body:
  options:
    - { id: a, text: "`INSERT INTO customers SELECT s.* FROM stg_customers s LEFT JOIN customers c ON c.customer_id = s.customer_id WHERE c.customer_id IS NULL;`" }
    - { id: b, text: "`DELETE FROM customers USING stg_customers s WHERE customers.customer_id = s.customer_id; INSERT INTO customers SELECT * FROM stg_customers;`" }
    - { id: c, text: "`UPDATE customers SET email = s.email, tier = s.tier FROM stg_customers s WHERE customers.customer_id = s.customer_id;`" }
    - { id: d, text: "`MERGE INTO customers USING stg_customers s ON customers.customer_id = s.customer_id WHEN MATCHED THEN UPDATE SET email = s.email, tier = s.tier WHEN NOT MATCHED THEN INSERT VALUES (s.customer_id, s.email, s.tier);`" }
answer: { optionId: d }
explanation:
  correct:
    en: "MERGE conditionally merges the rows of a source table into a target table: matched rows run the WHEN MATCHED action (UPDATE SET) and unmatched source rows run the WHEN NOT MATCHED action (INSERT). It replaces separate UPDATE and INSERT statements, and target rows without a match are left unchanged."
    fr: "MERGE fusionne conditionnellement les lignes d'une table source dans une table cible : les lignes correspondantes exécutent l'action WHEN MATCHED (UPDATE SET) et les lignes source sans correspondance exécutent l'action WHEN NOT MATCHED (INSERT). Elle remplace des instructions UPDATE et INSERT distinctes, et les lignes cibles sans correspondance restent inchangées."
  options:
    a: { en: "The INSERT adds only the new customers; the changed customers are never updated.", fr: "L'INSERT n'ajoute que les nouveaux clients ; les clients modifiés ne sont jamais mis à jour." }
    b: { en: "DELETE followed by INSERT gives the right result, but it uses two statements instead of one.", fr: "Un DELETE suivi d'un INSERT donne le bon résultat, mais utilise deux instructions au lieu d'une." }
    c: { en: "The UPDATE changes existing customers but never inserts the new ones.", fr: "L'UPDATE modifie les clients existants mais n'insère jamais les nouveaux." }
references:
  - title: MERGE
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_MERGE.html
