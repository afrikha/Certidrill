id: deac01-1c-redshift-elt-in-warehouse
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company loads raw policy and claims data every night into staging tables in an Amazon Redshift provisioned cluster. The transformations are multi-step SQL joins, aggregations and conditional updates that write to reporting tables in the same cluster. The company wants to avoid moving the data out of Redshift and wants to add as few new services as possible.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance charge chaque nuit des données brutes de contrats et de sinistres dans des tables intermédiaires d'un cluster provisionné Amazon Redshift. Les transformations sont des jointures SQL en plusieurs étapes, des agrégations et des mises à jour conditionnelles qui écrivent dans des tables de rapports du même cluster. L'entreprise veut éviter de sortir les données de Redshift et veut ajouter le moins de nouveaux services possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Write the transformations as a Redshift stored procedure and call it after the nightly load.", fr: "Écrire les transformations dans une procédure stockée Redshift et l'appeler après le chargement nocturne." } }
    - { id: b, text: { en: "UNLOAD the staging tables to Amazon S3, transform them with an AWS Glue job, and COPY the results back.", fr: "Exporter les tables intermédiaires vers Amazon S3 avec UNLOAD, les transformer avec une tâche AWS Glue, puis recharger les résultats avec COPY." } }
    - { id: c, text: { en: "Read the staging tables over JDBC from an Amazon EMR Spark job and write the results back over JDBC.", fr: "Lire les tables intermédiaires via JDBC depuis une tâche Spark Amazon EMR et réécrire les résultats via JDBC." } }
    - { id: d, text: { en: "Invoke an AWS Lambda function for each staging row to compute the reporting values.", fr: "Appeler une fonction AWS Lambda pour chaque ligne intermédiaire afin de calculer les valeurs des rapports." } }
answer: { optionId: a }
explanation:
  correct:
    en: "When the data is already in Redshift and the logic is SQL, an ELT approach inside the warehouse avoids any data movement. A stored procedure can run DDL and DML with loops and conditions, is stored in the database, and runs on the cluster's own compute."
    fr: "Lorsque les données sont déjà dans Redshift et que la logique est en SQL, une approche ELT dans l'entrepôt évite tout déplacement de données. Une procédure stockée peut exécuter du DDL et du DML avec des boucles et des conditions, est stockée dans la base de données et s'exécute sur la capacité de calcul du cluster."
  options:
    b:
      en: "This moves the data out of Redshift and back, and adds AWS Glue to the pipeline."
      fr: "Cette solution sort les données de Redshift puis les y renvoie, et ajoute AWS Glue au pipeline."
    c:
      en: "This moves the data to an EMR cluster and back over JDBC, and adds a cluster to manage."
      fr: "Cette solution déplace les données vers un cluster EMR puis les renvoie via JDBC, et ajoute un cluster à gérer."
    d:
      en: "Per-row Lambda invocations move every row out of the warehouse and are far slower than set-based SQL in Redshift."
      fr: "Des appels Lambda par ligne sortent chaque ligne de l'entrepôt et sont bien plus lents que du SQL ensembliste dans Redshift."
references:
  - title: Creating stored procedures in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/stored-procedure-overview.html
