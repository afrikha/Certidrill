id: deac01-1b-stateless-steps
objective: "1.1.12"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is designing a streaming pipeline for click events. The team wants to implement as many steps as possible as stateless transformations, for example in the Lambda data transformation function of an Amazon Data Firehose stream, which processes each record on its own.

    Which steps can be implemented as stateless transformations? (Choose two.)
  fr: |
    Une entreprise conçoit un pipeline de streaming pour des événements de clic. L'équipe veut mettre en œuvre le plus d'étapes possible sous forme de transformations sans état, par exemple dans la fonction Lambda de transformation des données d'un flux Amazon Data Firehose, qui traite chaque enregistrement isolément.

    Quelles étapes peuvent être mises en œuvre sous forme de transformations sans état ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Mask the email address field in each event", fr: "Masquer le champ d'adresse e-mail de chaque événement" } }
    - { id: b, text: { en: "Remove events whose ID was already seen in the last 10 minutes", fr: "Supprimer les événements dont l'ID a déjà été vu au cours des 10 dernières minutes" } }
    - { id: c, text: { en: "Count the events of each user for every hour", fr: "Compter les événements de chaque utilisateur pour chaque heure" } }
    - { id: d, text: { en: "Close a user session after 30 minutes without events", fr: "Clore une session utilisateur après 30 minutes sans événement" } }
    - { id: e, text: { en: "Convert the timestamp of each event to UTC in ISO 8601 format", fr: "Convertir l'horodatage de chaque événement en UTC au format ISO 8601" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Masking a field and converting a timestamp depend only on the record being processed, so they need no memory of other records. Deduplication, hourly counts, and session timeouts must remember earlier records, which needs state, for example in Managed Service for Apache Flink or an external store."
    fr: "Masquer un champ et convertir un horodatage ne dépendent que de l'enregistrement traité : ils ne demandent aucune mémoire des autres enregistrements. La déduplication, les comptages horaires et l'expiration des sessions doivent se souvenir d'enregistrements antérieurs, ce qui demande un état, par exemple dans Managed Service for Apache Flink ou un stockage externe."
  options:
    b:
      en: "Deduplication must keep the IDs seen over the last 10 minutes, which is state across records."
      fr: "La déduplication doit conserver les ID vus au cours des 10 dernières minutes, ce qui est un état entre enregistrements."
    c:
      en: "An hourly count accumulates values across many records, which is state."
      fr: "Un comptage horaire accumule des valeurs sur de nombreux enregistrements, ce qui est un état."
    d:
      en: "Detecting inactivity requires remembering the time of each user's last event."
      fr: "Détecter l'inactivité exige de mémoriser l'heure du dernier événement de chaque utilisateur."
references:
  - title: Implementing stateful Kinesis Data Streams processing in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-windows.html
