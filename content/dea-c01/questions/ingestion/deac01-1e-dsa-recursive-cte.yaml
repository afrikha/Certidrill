id: deac01-1e-dsa-recursive-cte
objective: "1.4.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Redshift table stores the organization chart of a company. Each row has an employee id, a name, and the manager_id of the employee's single manager, so the data forms a tree. An HR report must return every direct and indirect report of a given manager in a single SQL query. The depth of the hierarchy varies between departments and changes over time.

    Which solution will meet these requirements?
  fr: |
    Une table Amazon Redshift stocke l'organigramme d'une entreprise. Chaque ligne contient un id d'employé, un nom et le manager_id de l'unique responsable de l'employé : les données forment donc un arbre. Un rapport RH doit renvoyer en une seule requête SQL tous les subordonnés directs et indirects d'un responsable donné. La profondeur de la hiérarchie varie selon les services et change au fil du temps.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Join the table to itself four times, once for each level that the hierarchy has today.", fr: "Joindre la table à elle-même quatre fois, une fois pour chaque niveau que compte la hiérarchie aujourd'hui." } }
    - { id: b, text: { en: "Use a recursive CTE (WITH RECURSIVE) that repeatedly joins the table to the reports already found.", fr: "Utiliser une CTE récursive (WITH RECURSIVE) qui joint de façon répétée la table aux subordonnés déjà trouvés." } }
    - { id: c, text: { en: "Use the LAG window function over manager_id, ordered by employee id, to reach each previous level.", fr: "Utiliser la fonction de fenêtre LAG sur manager_id, triée par id d'employé, pour atteindre chaque niveau précédent." } }
    - { id: d, text: { en: "Group the rows by manager_id with LISTAGG to return the reports of the manager as one list.", fr: "Regrouper les lignes par manager_id avec LISTAGG pour renvoyer les subordonnés du responsable en une seule liste." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A recursive common table expression is a UNION ALL of a seed member and a recursive member that references the CTE itself, so each iteration descends one level of the tree until no new rows are found or a termination condition stops it. Redshift documents this pattern for hierarchical data such as organization charts."
    fr: "Une expression de table commune récursive est une UNION ALL d'un membre initial et d'un membre récursif qui référence la CTE elle-même : chaque itération descend d'un niveau de l'arbre jusqu'à ce qu'aucune nouvelle ligne ne soit trouvée ou qu'une condition de fin l'arrête. Redshift documente ce modèle pour les données hiérarchiques comme les organigrammes."
  options:
    a:
      en: "A fixed number of self-joins covers a fixed depth and breaks when the hierarchy grows deeper."
      fr: "Un nombre fixe d'auto-jointures couvre une profondeur fixe et échoue quand la hiérarchie s'approfondit."
    c:
      en: "LAG reads the previous row in a sort order; it does not follow parent-child links."
      fr: "LAG lit la ligne précédente dans un ordre de tri ; elle ne suit pas les liens parent-enfant."
    d:
      en: "Grouping by manager_id returns only the direct reports, one level of the tree."
      fr: "Le regroupement par manager_id ne renvoie que les subordonnés directs, soit un seul niveau de l'arbre."
references:
  - title: WITH clause
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_WITH_clause.html
