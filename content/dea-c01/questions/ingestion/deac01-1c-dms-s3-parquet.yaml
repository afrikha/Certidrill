id: deac01-1c-dms-s3-parquet
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS Database Migration Service (AWS DMS) to perform a full load of tables from an Amazon RDS for PostgreSQL database into an Amazon S3 data lake. The analytics team wants the files to arrive in Apache Parquet format. The company does not want to add a separate conversion job after the migration.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Database Migration Service (AWS DMS) pour effectuer un chargement complet de tables d'une base de données Amazon RDS for PostgreSQL vers un lac de données Amazon S3. L'équipe d'analyse veut que les fichiers arrivent au format Apache Parquet. L'entreprise ne veut pas ajouter de tâche de conversion distincte après la migration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the default CSV output and add an S3 Lifecycle rule that converts the objects to Parquet.", fr: "Conserver la sortie CSV par défaut et ajouter une règle de cycle de vie S3 qui convertit les objets en Parquet." } }
    - { id: b, text: { en: "Keep the default CSV output and run an AWS Glue crawler that converts the files to Parquet.", fr: "Conserver la sortie CSV par défaut et exécuter un robot d'analyse AWS Glue qui convertit les fichiers en Parquet." } }
    - { id: c, text: { en: "Set the CompressionType setting of the S3 target endpoint to GZIP.", fr: "Définir le paramètre CompressionType du point de terminaison cible S3 sur GZIP." } }
    - { id: d, text: { en: "Set the DataFormat setting of the S3 target endpoint to parquet.", fr: "Définir le paramètre DataFormat du point de terminaison cible S3 sur parquet." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An AWS DMS S3 target endpoint writes .csv files by default. Setting DataFormat to parquet makes DMS write Parquet files directly, with options such as ParquetVersion, so no conversion step is needed."
    fr: "Un point de terminaison cible S3 d'AWS DMS écrit des fichiers .csv par défaut. Définir DataFormat sur parquet fait écrire directement des fichiers Parquet par DMS, avec des options comme ParquetVersion : aucune étape de conversion n'est nécessaire."
  options:
    a:
      en: "S3 Lifecycle rules transition or expire objects; they never change the file format."
      fr: "Les règles de cycle de vie S3 font passer des objets à une autre classe de stockage ou les font expirer ; elles ne modifient jamais le format des fichiers."
    b:
      en: "A crawler infers schemas and creates tables in the Data Catalog; it does not rewrite files."
      fr: "Un robot d'analyse déduit des schémas et crée des tables dans le catalogue de données ; il ne réécrit pas les fichiers."
    c:
      en: "CompressionType compresses the .csv files; the output is still CSV, not Parquet."
      fr: "CompressionType compresse les fichiers .csv ; la sortie reste du CSV, pas du Parquet."
references:
  - title: Using Amazon S3 as a target for AWS Database Migration Service
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.S3.html
