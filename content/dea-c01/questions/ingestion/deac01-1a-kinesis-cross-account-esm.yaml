id: deac01-1a-kinesis-cross-account-esm
objective: "1.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A data platform team owns an Amazon Kinesis data stream in account 111122223333. An analytics team must process the stream with an AWS Lambda function in account 444455556666 through an event source mapping, without copying the data to another stream. The stream is encrypted with a customer managed AWS KMS key whose key policy already allows the analytics team's execution role to decrypt.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une équipe de plateforme de données possède un flux de données Amazon Kinesis dans le compte 111122223333. Une équipe d'analyse doit traiter le flux avec une fonction AWS Lambda du compte 444455556666 via un mappage de source d'événement, sans copier les données dans un autre flux. Le flux est chiffré avec une clé AWS KMS gérée par le client dont la politique de clé autorise déjà le rôle d'exécution de l'équipe d'analyse à déchiffrer.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In 111122223333, attach a resource-based policy to the stream that allows the function's execution role to read the stream, including `kinesis:DescribeStream`.", fr: "Dans 111122223333, attacher au flux une politique basée sur les ressources qui autorise le rôle d'exécution de la fonction à lire le flux, y compris `kinesis:DescribeStream`." } }
    - { id: b, text: { en: "In 444455556666, add a resource-based policy to the function that allows account 111122223333 to invoke it.", fr: "Dans 444455556666, ajouter à la fonction une politique basée sur les ressources qui autorise le compte 111122223333 à l'appeler." } }
    - { id: c, text: { en: "In 111122223333, create an IAM role that trusts account 444455556666 and set it as the role of the event source mapping.", fr: "Dans 111122223333, créer un rôle IAM qui approuve le compte 444455556666 et le définir comme rôle du mappage de source d'événement." } }
    - { id: d, text: { en: "In 444455556666, attach the AWSLambdaKinesisExecutionRole managed policy to the function's execution role.", fr: "Dans 444455556666, attacher la politique gérée AWSLambdaKinesisExecutionRole au rôle d'exécution de la fonction." } }
    - { id: e, text: { en: "In 444455556666, create a data stream and copy the records into it with a Lambda function in 111122223333.", fr: "Dans 444455556666, créer un flux de données et y copier les enregistrements avec une fonction Lambda de 111122223333." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Cross-account access needs both sides. The consumer account gives the execution role the Kinesis read permissions, for example with the AWSLambdaKinesisExecutionRole managed policy. The stream owner adds a resource-based policy to the stream with that execution role as principal and the shared read actions, including kinesis:DescribeStream; the mapping is then created in the consumer account with the stream ARN."
    fr: "L'accès entre comptes nécessite les deux côtés. Le compte consommateur accorde au rôle d'exécution les autorisations de lecture Kinesis, par exemple avec la politique gérée AWSLambdaKinesisExecutionRole. Le propriétaire du flux ajoute au flux une politique basée sur les ressources avec ce rôle d'exécution comme principal et les actions de lecture partagées, y compris kinesis:DescribeStream ; le mappage est ensuite créé dans le compte consommateur avec l'ARN du flux."
  options:
    b:
      en: "Lambda polls the stream with the execution role; the stream owner's account never invokes the function."
      fr: "Lambda interroge le flux avec le rôle d'exécution ; le compte propriétaire du flux n'appelle jamais la fonction."
    c:
      en: "An event source mapping reads the stream with the function's execution role; it does not assume a separate cross-account role."
      fr: "Un mappage de source d'événement lit le flux avec le rôle d'exécution de la fonction ; il n'endosse pas de rôle distinct entre comptes."
    e:
      en: "This copies the data to another stream, which the requirements forbid."
      fr: "Cette solution copie les données dans un autre flux, ce que les exigences interdisent."
references:
  - title: Share access using resource-based policies - Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/streams/latest/dev/resource-based-policy-examples.html
  - title: Process Amazon Kinesis Data Streams records with Lambda - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-create.html
