id: deac01-1a-appflow-salesforce-bulk
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon AppFlow flow copies a Salesforce object to Amazon S3 every night with the Salesforce API preference set to Automatic. Most runs transfer several million records, but some runs transfer fewer than one million. The downstream parser fails on some nights because date formats and null handling differ from one run to the next. The company needs consistent output for these large transfers.

    Which change will meet this requirement?
  fr: |
    Un flux Amazon AppFlow copie chaque nuit un objet Salesforce vers Amazon S3 avec la préférence d'API Salesforce définie sur Automatic. La plupart des exécutions transfèrent plusieurs millions d'enregistrements, mais certaines en transfèrent moins d'un million. L'analyseur en aval échoue certaines nuits, car les formats de date et la gestion des valeurs nulles diffèrent d'une exécution à l'autre. L'entreprise a besoin d'une sortie cohérente pour ces transferts volumineux.

    Quelle modification répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Change the destination file format from JSONL to Apache Parquet.", fr: "Remplacer le format de fichier de destination JSONL par Apache Parquet." } }
    - { id: b, text: { en: "Change the flow from full transfer to incremental transfer.", fr: "Faire passer le flux du transfert complet au transfert incrémentiel." } }
    - { id: c, text: { en: "Turn on aggregation so that each run writes a single output file.", fr: "Activer l'agrégation afin que chaque exécution écrive un seul fichier de sortie." } }
    - { id: d, text: { en: "Change the Salesforce API preference from Automatic to Bulk.", fr: "Remplacer la préférence d'API Salesforce Automatic par Bulk." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With the Automatic preference, AppFlow uses the REST API for runs of fewer than one million source records and Bulk API 2.0 for larger runs, which can produce inconsistent formatting between runs. Choosing Bulk makes every run use Bulk API 2.0, which is designed for large asynchronous transfers and gives consistent output."
    fr: "Avec la préférence Automatic, AppFlow utilise l'API REST pour les exécutions de moins d'un million d'enregistrements sources et Bulk API 2.0 pour les exécutions plus volumineuses, ce qui peut produire une mise en forme incohérente d'une exécution à l'autre. Choisir Bulk fait utiliser Bulk API 2.0 à chaque exécution ; cette API est conçue pour les transferts asynchrones volumineux et donne une sortie cohérente."
  options:
    a:
      en: "AppFlow writes Parquet values as strings; the API switch between runs, which causes the differences, would remain."
      fr: "AppFlow écrit les valeurs Parquet sous forme de chaînes ; le changement d'API entre exécutions, cause des différences, demeurerait."
    b:
      en: "Incremental transfer changes which records are sent, and the Automatic preference would still switch APIs with the record count."
      fr: "Le transfert incrémentiel change les enregistrements envoyés, et la préférence Automatic changerait toujours d'API selon le nombre d'enregistrements."
    c:
      en: "Aggregation changes the number of output files, not the API that formats the records."
      fr: "L'agrégation change le nombre de fichiers de sortie, pas l'API qui met en forme les enregistrements."
references:
  - title: Salesforce connector for Amazon AppFlow - Amazon AppFlow
    url: https://docs.aws.amazon.com/appflow/latest/userguide/salesforce.html
