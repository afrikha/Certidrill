id: deac01-1a-glue-bigquery-connection
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company's marketing data is in Google BigQuery. Every night, the data team must copy several BigQuery tables to its Amazon S3 data lake and transform them with Apache Spark. The team does not want to manage clusters or package third-party connector JAR files, and the Google service account key must be stored securely.

    Which solution will meet these requirements?
  fr: |
    Les données marketing d'une entreprise de distribution se trouvent dans Google BigQuery. Chaque nuit, l'équipe données doit copier plusieurs tables BigQuery dans son lac de données Amazon S3 et les transformer avec Apache Spark. L'équipe ne veut ni gérer de clusters ni empaqueter de fichiers JAR de connecteurs tiers, et la clé du compte de service Google doit être stockée de manière sécurisée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the key in AWS Secrets Manager, create a Google BigQuery connection in AWS Glue, and read the tables in a Glue 4.0 or later Spark job.", fr: "Stocker la clé dans AWS Secrets Manager, créer une connexion Google BigQuery dans AWS Glue et lire les tables dans une tâche Spark Glue 4.0 ou ultérieure." } }
    - { id: b, text: { en: "Create an AWS DMS task with a BigQuery source endpoint and an S3 target endpoint, then run a Glue job on the files.", fr: "Créer une tâche AWS DMS avec un point de terminaison source BigQuery et un point de terminaison cible S3, puis exécuter une tâche Glue sur les fichiers." } }
    - { id: c, text: { en: "Create an AWS DataSync task that copies the BigQuery tables directly to the bucket every night.", fr: "Créer une tâche AWS DataSync qui copie directement les tables BigQuery dans le compartiment chaque nuit." } }
    - { id: d, text: { en: "Run Spark on an Amazon EMR cluster with the open-source BigQuery connector JAR and the key file stored on the primary node.", fr: "Exécuter Spark sur un cluster Amazon EMR avec le JAR du connecteur BigQuery open source et le fichier de clé stocké sur le nœud primaire." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Glue for Spark can read from Google BigQuery in Glue 4.0 and later through a Google BigQuery connection. The service account credentials are kept in a Secrets Manager secret that the connection references, and the serverless job reads the tables with connection_type bigquery, without a custom connector."
    fr: "AWS Glue for Spark peut lire Google BigQuery à partir de Glue 4.0 via une connexion Google BigQuery. Les informations d'identification du compte de service sont conservées dans un secret Secrets Manager référencé par la connexion, et la tâche sans serveur lit les tables avec connection_type bigquery, sans connecteur personnalisé."
  options:
    b:
      en: "BigQuery is not an AWS DMS source endpoint."
      fr: "BigQuery n'est pas un point de terminaison source AWS DMS."
    c:
      en: "DataSync copies files and objects between storage systems; it does not read BigQuery tables."
      fr: "DataSync copie des fichiers et des objets entre systèmes de stockage ; il ne lit pas les tables BigQuery."
    d:
      en: "This means managing a cluster and a third-party JAR, and a key file on a node is not stored securely."
      fr: "Cette solution implique de gérer un cluster et un JAR tiers, et un fichier de clé sur un nœud n'est pas stocké de manière sécurisée."
references:
  - title: BigQuery connections - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-connect-bigquery-home.html
