id: deac01-1d-glue-skewness-alarm
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue 4.0 Spark job usually runs in 20 minutes, but some runs take more than 2 hours and still succeed. The team suspects that a few join keys sometimes hold most of the rows, so a few tasks of one stage run much longer than the others. The team wants a CloudWatch alarm that fires when the task durations within a stage become highly uneven, without adding code to the job.

    Which solution will meet these requirements?
  fr: |
    Une tâche Spark AWS Glue 4.0 s'exécute habituellement en 20 minutes, mais certaines exécutions durent plus de 2 heures et réussissent quand même. L'équipe soupçonne que quelques clés de jointure concentrent parfois la plupart des lignes, si bien que quelques tâches Spark d'une étape durent beaucoup plus longtemps que les autres. L'équipe veut une alarme CloudWatch qui se déclenche lorsque les durées des tâches Spark au sein d'une étape deviennent très inégales, sans ajouter de code à la tâche.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable auto scaling on the job so that AWS Glue adds workers when the tasks of a stage are uneven.", fr: "Activer la mise à l'échelle automatique sur la tâche pour qu'AWS Glue ajoute des nœuds de travail lorsque les tâches Spark d'une étape sont inégales." } }
    - { id: b, text: { en: "Enable job run insights and create an alarm on the log streams that it writes.", fr: "Activer les informations sur l'exécution des tâches (job run insights) et créer une alarme sur les flux de journaux qu'elles écrivent." } }
    - { id: c, text: { en: "Create a CloudWatch Logs metric filter that counts the word skew in the driver log, and create an alarm on the filter metric.", fr: "Créer un filtre de métriques CloudWatch Logs qui compte le mot skew dans le journal du pilote, et créer une alarme sur la métrique du filtre." } }
    - { id: d, text: { en: "Enable job observability metrics and create an alarm on the glue.driver.skewness.stage metric of the job.", fr: "Activer les métriques d'observabilité de la tâche et créer une alarme sur la métrique glue.driver.skewness.stage de la tâche." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Glue observability metrics (Glue 4.0 and later) are published to CloudWatch every 30 seconds. glue.driver.skewness.stage is the ratio of the maximum to the median task duration in a Spark stage, so an alarm on it detects data skew without any code change."
    fr: "Les métriques d'observabilité d'AWS Glue (Glue 4.0 et versions ultérieures) sont publiées dans CloudWatch toutes les 30 secondes. glue.driver.skewness.stage est le rapport entre la durée maximale et la durée médiane des tâches Spark d'une étape : une alarme sur cette métrique détecte l'asymétrie des données sans modifier le code."
  options:
    a: { en: "Auto scaling adjusts the number of workers to the executors that Spark requests; it does not detect skew or raise an alarm, and long tasks stay long.", fr: "La mise à l'échelle automatique ajuste le nombre de nœuds de travail aux exécuteurs demandés par Spark ; elle ne détecte pas l'asymétrie, ne déclenche pas d'alarme, et les tâches longues restent longues." }
    b: { en: "Job run insights produces its analysis only when a run fails, and these slow runs succeed.", fr: "Les informations sur l'exécution des tâches ne produisent leur analyse qu'en cas d'échec d'une exécution, et ces exécutions lentes réussissent." }
    c: { en: "Spark does not write such a word reliably in the driver log, so the metric would not measure task duration differences.", fr: "Spark n'écrit pas un tel mot de manière fiable dans le journal du pilote : la métrique ne mesurerait pas les écarts de durée des tâches." }
references:
  - title: Monitoring with AWS Glue Observability metrics
    url: https://docs.aws.amazon.com/glue/latest/dg/monitor-observability.html
