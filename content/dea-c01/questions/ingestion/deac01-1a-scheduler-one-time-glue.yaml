id: deac01-1a-scheduler-one-time-glue
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must run an AWS Glue backfill job exactly once, at 01:00 on January 4, 2027, in the Europe/Paris time zone. The team wants to define the run time in Paris time, start the job directly without writing code, and leave no recurring schedule behind. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit exécuter une tâche de rattrapage AWS Glue une seule fois, le 4 janvier 2027 à 01 h 00, dans le fuseau horaire Europe/Paris. L'équipe veut définir l'heure d'exécution en heure de Paris, démarrer directement la tâche sans écrire de code et ne laisser aucune planification récurrente. L'équipe veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge Scheduler schedule `at(2027-01-04T01:00:00)` in the Europe/Paris time zone with a `glue:startJobRun` universal target.", fr: "Créer une planification EventBridge Scheduler `at(2027-01-04T01:00:00)` dans le fuseau horaire Europe/Paris avec une cible universelle `glue:startJobRun`." } }
    - { id: b, text: { en: "Create an Amazon EventBridge rule with the schedule expression `cron(0 1 4 1 ? 2027)` and the Glue job as its target.", fr: "Créer une règle Amazon EventBridge avec l'expression de planification `cron(0 1 4 1 ? 2027)` et la tâche Glue comme cible." } }
    - { id: c, text: { en: "Create an AWS Glue scheduled trigger with the expression `cron(0 1 4 1 ? 2027)` that starts the job.", fr: "Créer un déclencheur planifié AWS Glue avec l'expression `cron(0 1 4 1 ? 2027)` qui démarre la tâche." } }
    - { id: d, text: { en: "Create an Amazon MWAA environment with a DAG whose schedule is `@once` and whose start date is January 4, 2027 at 01:00.", fr: "Créer un environnement Amazon MWAA avec un DAG dont la planification est `@once` et dont la date de début est le 4 janvier 2027 à 01 h 00." } }
answer: { optionId: a }
explanation:
  correct:
    en: "EventBridge Scheduler one-time schedules use an `at()` expression and accept an IANA time zone, so the run time is set in Paris time. A universal target calls the Glue StartJobRun API directly with an execution role, so no code is needed, and the schedule does not recur."
    fr: "Les planifications ponctuelles d'EventBridge Scheduler utilisent une expression `at()` et acceptent un fuseau horaire IANA : l'heure d'exécution est donc définie en heure de Paris. Une cible universelle appelle directement l'API StartJobRun de Glue avec un rôle d'exécution, sans code, et la planification ne se répète pas."
  options:
    b:
      en: "Scheduled rules evaluate cron expressions in UTC, so 01:00 would be 02:00 in Paris, and a Glue job is not a target of EventBridge rules."
      fr: "Les règles planifiées évaluent les expressions cron en UTC : 01 h 00 correspondrait à 02 h 00 à Paris, et une tâche Glue n'est pas une cible des règles EventBridge."
    c:
      en: "Glue trigger schedules are in UTC, so this expression would start the job at 02:00 Paris time, and the time cannot be defined in Paris time."
      fr: "Les planifications des déclencheurs Glue sont en UTC : cette expression démarrerait la tâche à 02 h 00 heure de Paris, et l'heure ne peut pas être définie en heure de Paris."
    d:
      en: "An MWAA environment is a large service to create and pay for, just to start one job once."
      fr: "Un environnement MWAA est un service important à créer et à payer, simplement pour démarrer une tâche une seule fois."
references:
  - title: Schedule types in EventBridge Scheduler - EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html
  - title: Using universal targets in EventBridge Scheduler - EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-universal.html
