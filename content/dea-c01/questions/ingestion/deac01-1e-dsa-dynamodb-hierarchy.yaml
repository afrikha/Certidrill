id: deac01-1e-dsa-dynamodb-hierarchy
objective: "1.4.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company stores its store locations in an Amazon DynamoDB table. The locations form a hierarchy: country, region, city, and store. The application must list all the stores of a country, of a region, or of a city with efficient queries. The design must not use scans or secondary indexes.

    Which key design will meet these requirements?
  fr: |
    Une entreprise de distribution stocke l'emplacement de ses magasins dans une table Amazon DynamoDB. Les emplacements forment une hiérarchie : pays, région, ville et magasin. L'application doit lister tous les magasins d'un pays, d'une région ou d'une ville avec des requêtes efficaces. La conception ne doit utiliser ni analyses complètes (scans) ni index secondaires.

    Quelle conception de clés répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use store_id as the partition key, and filter the results on the country, region, and city attributes.", fr: "Utiliser store_id comme clé de partition, et filtrer les résultats sur les attributs pays, région et ville." } }
    - { id: b, text: { en: "Use city as the partition key and store_id as the sort key, and repeat the query for every city of the country or region.", fr: "Utiliser city comme clé de partition et store_id comme clé de tri, et répéter la requête pour chaque ville du pays ou de la région." } }
    - { id: c, text: { en: "Store the full hierarchy of each country as a nested map attribute in a single item per country.", fr: "Stocker la hiérarchie complète de chaque pays sous forme d'attribut de type map imbriqué dans un seul élément par pays." } }
    - { id: d, text: { en: "Use country as the partition key and a region#city#store_id sort key, and query with begins_with on the prefix of the level.", fr: "Utiliser country comme clé de partition et une clé de tri region#city#store_id, et interroger avec begins_with sur le préfixe du niveau." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A composite sort key that concatenates the levels of a one-to-many hierarchy keeps the items of each branch together and in order. A Query on the country with begins_with on region, or on region#city, returns every item below that level of the tree in one efficient range read."
    fr: "Une clé de tri composite qui concatène les niveaux d'une hiérarchie un-à-plusieurs garde les éléments de chaque branche regroupés et ordonnés. Une requête Query sur le pays avec begins_with sur la région, ou sur region#city, renvoie tous les éléments situés sous ce niveau de l'arbre en une seule lecture de plage efficace."
  options:
    a:
      en: "Without a partition key per country, listing stores requires a scan, and a filter only removes items after they are read."
      fr: "Sans clé de partition par pays, lister les magasins exige une analyse complète, et un filtre ne retire les éléments qu'après leur lecture."
    b:
      en: "Listing a country or a region needs one query per city, and the application must first know every city."
      fr: "Lister un pays ou une région exige une requête par ville, et l'application doit d'abord connaître toutes les villes."
    c:
      en: "One item per country hits the 400 KB item size limit and forces the whole item to be read and rewritten for each change."
      fr: "Un seul élément par pays atteint la limite de 400 Ko par élément et oblige à lire et réécrire tout l'élément à chaque modification."
references:
  - title: Best practices for using sort keys to organize data in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-sort-keys.html
