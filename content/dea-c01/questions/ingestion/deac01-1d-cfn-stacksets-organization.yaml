id: deac01-1d-cfn-stacksets-organization
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. Every account in the DataProducers organizational unit (OU) needs the same ingestion baseline in two Regions: an S3 landing bucket, an Amazon Data Firehose stream, and IAM roles, defined in one AWS CloudFormation template. New accounts are added to the OU every month and must receive the baseline without manual steps.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise AWS Organizations. Chaque compte de l'unité d'organisation (UO) DataProducers a besoin de la même base d'ingestion dans deux Régions : un compartiment S3 d'atterrissage, un flux Amazon Data Firehose et des rôles IAM, définis dans un modèle AWS CloudFormation. De nouveaux comptes sont ajoutés à l'UO chaque mois et doivent recevoir cette base sans étape manuelle.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create a service-managed StackSet that targets the OU in both Regions with automatic deployment enabled.", fr: "Créer un StackSet géré par le service qui cible l'UO dans les deux Régions avec le déploiement automatique activé." } }
    - { id: b, text: { en: "Create a StackSet with self-managed permissions and add each new account as a stack instance when it joins the OU.", fr: "Créer un StackSet avec des autorisations autogérées et ajouter chaque nouveau compte comme instance de pile lorsqu'il rejoint l'UO." } }
    - { id: c, text: { en: "Deploy the template as nested stacks of a parent stack in the management account of the organization.", fr: "Déployer le modèle sous forme de piles imbriquées d'une pile parente dans le compte de gestion de l'organisation." } }
    - { id: d, text: { en: "Ask the owner of each new account to create a stack from the template in both Regions after joining.", fr: "Demander au propriétaire de chaque nouveau compte de créer une pile à partir du modèle dans les deux Régions après son arrivée." } }
answer: { optionId: a }
explanation:
  correct:
    en: "StackSets create, update, or delete stacks across multiple accounts and Regions in a single operation. With service-managed permissions, StackSets works with AWS Organizations and can target an OU, and automatic deployment adds stacks to accounts that join the OU later."
    fr: "Les StackSets créent, mettent à jour ou suppriment des piles dans plusieurs comptes et Régions en une seule opération. Avec des autorisations gérées par le service, StackSets s'appuie sur AWS Organizations et peut cibler une UO, et le déploiement automatique ajoute des piles aux comptes qui rejoignent l'UO plus tard."
  options:
    b: { en: "Self-managed permissions require the IAM roles to be created in each account and each new account to be added manually.", fr: "Les autorisations autogérées exigent de créer les rôles IAM dans chaque compte et d'ajouter manuellement chaque nouveau compte." }
    c: { en: "Nested stacks are deployed in the account and Region of the parent stack, not in the member accounts.", fr: "Les piles imbriquées sont déployées dans le compte et la Région de la pile parente, pas dans les comptes membres." }
    d: { en: "Manual stack creation in each account and Region is the manual step that the company wants to avoid.", fr: "La création manuelle de piles dans chaque compte et chaque Région est précisément l'étape manuelle que l'entreprise veut éviter." }
references:
  - title: Managing stacks across accounts and Regions with StackSets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/what-is-cfnstacksets.html
