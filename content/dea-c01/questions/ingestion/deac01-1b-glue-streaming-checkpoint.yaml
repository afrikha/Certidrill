id: deac01-1b-glue-streaming-checkpoint
objective: "1.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer runs an AWS Glue streaming ETL job that reads an Amazon Kinesis data stream and writes to Amazon S3. The job must be stopped for a maintenance window. When it restarts, it must continue from the records it had already read instead of starting again.

    Which mechanism tracks the data that the streaming job has read?
  fr: |
    Un ingénieur de données exécute une tâche ETL de streaming AWS Glue qui lit un flux de données Amazon Kinesis et écrit dans Amazon S3. La tâche doit être arrêtée pendant une fenêtre de maintenance. À son redémarrage, elle doit reprendre à partir des enregistrements qu'elle avait déjà lus au lieu de tout recommencer.

    Quel mécanisme suit les données que la tâche de streaming a lues ?
body:
  options:
    - id: a
      text: { en: "The checkpoints that the job writes to the checkpoint folder referenced in its script", fr: "Les points de contrôle que la tâche écrit dans le dossier de points de contrôle référencé dans son script" }
    - id: b
      text: { en: "The job bookmark that AWS Glue saves when the script calls job.commit()", fr: "Le signet de tâche qu'AWS Glue enregistre lorsque le script appelle job.commit()" }
    - id: c
      text: { en: "The partitions that a crawler adds to the AWS Glue Data Catalog table of the stream", fr: "Les partitions qu'un robot d'analyse ajoute à la table AWS Glue Data Catalog du flux" }
    - id: d
      text: { en: "The retention period of the Kinesis data stream", fr: "La période de conservation du flux de données Kinesis" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Glue streaming jobs use checkpoints, not job bookmarks, to keep track of the data that has been read. A stopped and restarted job picks up where it left off, and deleting the checkpoint folder makes it reprocess the data."
    fr: "Les tâches de streaming AWS Glue utilisent des points de contrôle, et non des signets de tâche, pour suivre les données lues. Une tâche arrêtée puis redémarrée reprend là où elle s'était arrêtée, et supprimer le dossier des points de contrôle lui fait retraiter les données."
  options:
    b:
      en: "Job bookmarks track batch inputs such as S3 objects and JDBC rows; they are not supported for streaming ETL jobs."
      fr: "Les signets de tâche suivent des entrées par lots comme des objets S3 ou des lignes JDBC ; ils ne sont pas pris en charge pour les tâches ETL de streaming."
    c:
      en: "Data Catalog partitions describe data layout for queries; they do not store a read position in the stream."
      fr: "Les partitions du Data Catalog décrivent l'organisation des données pour les requêtes ; elles ne stockent pas de position de lecture dans le flux."
    d:
      en: "Retention decides how long records stay in the stream; it does not record which records the job has already read."
      fr: "La conservation détermine combien de temps les enregistrements restent dans le flux ; elle n'enregistre pas ceux que la tâche a déjà lus."
references:
  - title: Streaming ETL jobs in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/add-job-streaming.html
