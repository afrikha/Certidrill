id: deac01-1a-datasync-changed-mirror
objective: "1.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company uses an AWS DataSync task to copy a 40 TB NFS share to an Amazon S3 bucket every night. The task is configured to transfer all data, so every run copies the whole share again. Files that users delete from the share also remain in the bucket. The company wants each run to copy only what changed and wants the bucket to mirror deletions from the share.

    Which combination of task options will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise une tâche AWS DataSync pour copier chaque nuit un partage NFS de 40 To dans un compartiment Amazon S3. La tâche est configurée pour transférer toutes les données : chaque exécution recopie donc tout le partage. Les fichiers que les utilisateurs suppriment du partage restent aussi dans le compartiment. L'entreprise veut que chaque exécution ne copie que ce qui a changé et que le compartiment reflète les suppressions du partage.

    Quelle combinaison d'options de tâche répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set TransferMode to CHANGED (Transfer only data that has changed).", fr: "Définir TransferMode à CHANGED (Transfer only data that has changed)." } }
    - { id: b, text: { en: "Set VerifyMode to NONE so that the task skips data verification.", fr: "Définir VerifyMode à NONE afin que la tâche ignore la vérification des données." } }
    - { id: c, text: { en: "Set PreserveDeletedFiles to REMOVE so that files absent from the source are deleted.", fr: "Définir PreserveDeletedFiles à REMOVE afin que les fichiers absents de la source soient supprimés." } }
    - { id: d, text: { en: "Set OverwriteMode to NEVER so that existing objects are not copied again.", fr: "Définir OverwriteMode à NEVER afin que les objets existants ne soient pas recopiés." } }
    - { id: e, text: { en: "Turn on S3 Versioning for the destination bucket.", fr: "Activer S3 Versioning sur le compartiment de destination." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "With TransferMode CHANGED, DataSync copies only the data and metadata that differ between the source and the destination after the first full transfer. With PreserveDeletedFiles set to REMOVE, DataSync deletes destination objects that no longer exist in the source; this works only with CHANGED, because the ALL mode does not scan the destination."
    fr: "Avec TransferMode CHANGED, DataSync ne copie que les données et métadonnées qui diffèrent entre la source et la destination après le premier transfert complet. Avec PreserveDeletedFiles défini à REMOVE, DataSync supprime les objets de destination qui n'existent plus dans la source ; cela ne fonctionne qu'avec CHANGED, car le mode ALL n'analyse pas la destination."
  options:
    b:
      en: "Skipping verification removes an integrity check but does not reduce the data transferred or remove deleted files."
      fr: "Ignorer la vérification supprime un contrôle d'intégrité, mais ne réduit pas les données transférées et ne supprime pas les fichiers effacés."
    d:
      en: "NEVER stops DataSync from updating objects whose source files changed, so the bucket would contain stale data."
      fr: "NEVER empêche DataSync de mettre à jour les objets dont les fichiers sources ont changé : le compartiment contiendrait des données périmées."
    e:
      en: "Versioning keeps older versions of objects; it does not mirror deletions or reduce the transfer."
      fr: "La gestion des versions conserve les anciennes versions des objets ; elle ne reflète pas les suppressions et ne réduit pas le transfert."
references:
  - title: Configuring how to handle files, objects, and metadata - AWS DataSync
    url: https://docs.aws.amazon.com/datasync/latest/userguide/configure-metadata.html
