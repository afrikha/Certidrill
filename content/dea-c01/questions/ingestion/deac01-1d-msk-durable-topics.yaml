id: deac01-1d-msk-durable-topics
objective: "1.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A payments company is creating an Amazon MSK provisioned cluster with Standard brokers to ingest transaction events. No message that a producer has received an acknowledgment for can be lost if a broker fails. Producers must also be able to keep writing while one broker is offline during a rolling update.

    Which combination of configurations will meet these requirements? (Choose three.)
  fr: |
    Une entreprise de paiement crée un cluster Amazon MSK provisionné avec des brokers Standard pour ingérer des événements de transaction. Aucun message dont le producteur a reçu l'accusé de réception ne doit être perdu en cas de panne d'un broker. Les producteurs doivent aussi pouvoir continuer à écrire lorsqu'un broker est hors ligne pendant une mise à jour propagée (rolling update).

    Quelle combinaison de configurations répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create the topics with a replication factor of 2.", fr: "Créer les rubriques Kafka (topics) avec un facteur de réplication de 2." } }
    - { id: b, text: { en: "Distribute the brokers across three Availability Zones.", fr: "Répartir les brokers sur trois zones de disponibilité." } }
    - { id: c, text: { en: "Configure the producers with acks=1 so that the leader acknowledges each write.", fr: "Configurer les producteurs avec acks=1 pour que le leader accuse réception de chaque écriture." } }
    - { id: d, text: { en: "Create the topics with a replication factor of 3.", fr: "Créer les rubriques Kafka (topics) avec un facteur de réplication de 3." } }
    - { id: e, text: { en: "Set min.insync.replicas to 3 for the topics.", fr: "Définir min.insync.replicas sur 3 pour les rubriques Kafka." } }
    - { id: f, text: { en: "Set min.insync.replicas to 2 for the topics and configure the producers with acks=all.", fr: "Définir min.insync.replicas sur 2 pour les rubriques Kafka et configurer les producteurs avec acks=all." } }
answer: { optionIds: [ b, d, f ] }
explanation:
  correct:
    en: |
      Amazon MSK recommends a three-AZ cluster and a replication factor of at least 3. With min.insync.replicas set to 2 (RF minus 1) and producers using acks=all, every acknowledged write exists on at least two replicas, and a three-way replicated topic stays writable when one replica is offline, for example during a rolling update.
    fr: |
      Amazon MSK recommande un cluster sur trois zones de disponibilité et un facteur de réplication d'au moins 3. Avec min.insync.replicas défini sur 2 (RF moins 1) et des producteurs en acks=all, chaque écriture confirmée existe sur au moins deux réplicas, et une rubrique répliquée trois fois reste accessible en écriture lorsqu'un réplica est hors ligne, par exemple pendant une mise à jour propagée.
  options:
    a: { en: "AWS warns that a replication factor of 2 may lead to data loss.", fr: "AWS avertit qu'un facteur de réplication de 2 peut entraîner une perte de données." }
    c: { en: "With acks=1, only the leader has the record when it is acknowledged, so the record is lost if the leader fails before replication.", fr: "Avec acks=1, seul le leader possède l'enregistrement au moment de l'accusé de réception : il est perdu si le leader tombe en panne avant la réplication." }
    e: { en: "A min.insync.replicas value equal to the replication factor prevents producing to the cluster when one broker is offline during a rolling update.", fr: "Une valeur min.insync.replicas égale au facteur de réplication empêche de produire vers le cluster lorsqu'un broker est hors ligne pendant une mise à jour propagée." }
references:
  - title: Best practices for Standard brokers
    url: https://docs.aws.amazon.com/msk/latest/developerguide/bestpractices.html
  - title: Best practices for Apache Kafka clients
    url: https://docs.aws.amazon.com/msk/latest/developerguide/bestpractices-kafka-client.html
