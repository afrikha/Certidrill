id: deac01-1b-sqs-max-concurrency-rds
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company loads uploaded files into an Amazon RDS for PostgreSQL database. Amazon S3 sends an event for each file to an Amazon SQS queue, and an AWS Lambda function processes the queue through an event source mapping. During bulk uploads, Lambda scales to hundreds of concurrent invocations and the database becomes CPU bound. Tests show that the database can sustain at most 20 concurrent loaders, whatever the connection management. Messages can wait in the queue, and the other functions in the account must not be affected.

    Which solution will meet these requirements?
  fr: |
    Une entreprise charge des fichiers téléversés dans une base de données Amazon RDS for PostgreSQL. Amazon S3 envoie un événement par fichier à une file d'attente Amazon SQS, et une fonction AWS Lambda traite la file par un mappage de source d'événement. Pendant les chargements en masse, Lambda monte à des centaines d'appels simultanés et la base de données sature son processeur. Les tests montrent que la base de données supporte au plus 20 chargeurs simultanés, quelle que soit la gestion des connexions. Les messages peuvent attendre dans la file, et les autres fonctions du compte ne doivent pas être affectées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Place Amazon RDS Proxy between the function and the database to pool the connections.", fr: "Placer Amazon RDS Proxy entre la fonction et la base de données pour mutualiser les connexions." }
    - id: b
      text: { en: "Reduce the batch size of the event source mapping to one message.", fr: "Réduire la taille de lot du mappage de source d'événement à un message." }
    - id: c
      text: { en: "Set the maximum concurrency of the SQS event source mapping to 20.", fr: "Définir la simultanéité maximale du mappage de source d'événement SQS à 20." }
    - id: d
      text: { en: "Ask AWS Support to lower the concurrency quota of the account to 20.", fr: "Demander au Support AWS d'abaisser le quota de simultanéité du compte à 20." }
answer: { optionId: c }
explanation:
  correct:
    en: "Maximum concurrency on an SQS event source mapping caps the number of concurrent function instances that this queue can invoke. With a value of 20, extra messages stay in the queue until a loader is free, and the setting does not change the concurrency available to other functions."
    fr: "La simultanéité maximale d'un mappage de source d'événement SQS plafonne le nombre d'instances de fonction simultanées que cette file peut appeler. Avec la valeur 20, les messages en surplus restent dans la file jusqu'à ce qu'un chargeur se libère, et le paramètre ne modifie pas la simultanéité disponible pour les autres fonctions."
  options:
    a:
      en: "RDS Proxy pools connections, but the limit here is the CPU load of concurrent loaders, which pooling does not reduce."
      fr: "RDS Proxy mutualise les connexions, mais la limite ici est la charge processeur des chargeurs simultanés, que la mutualisation ne réduit pas."
    b:
      en: "Smaller batches create more invocations and do not cap how many run at the same time."
      fr: "Des lots plus petits créent davantage d'appels et ne plafonnent pas le nombre d'appels simultanés."
    d:
      en: "An account-wide quota limits every function in the account, which breaks the requirement that other functions are not affected."
      fr: "Un quota à l'échelle du compte limite toutes les fonctions du compte, ce qui enfreint l'exigence selon laquelle les autres fonctions ne doivent pas être affectées."
references:
  - title: Configuring scaling behavior for SQS event source mappings
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
