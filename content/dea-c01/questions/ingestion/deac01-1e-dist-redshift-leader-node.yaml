id: deac01-1e-dist-redshift-leader-node
objective: "1.4.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer explains to analysts how an Amazon Redshift provisioned cluster runs a query as a distributed system. One component parses the SQL, develops the execution plan, compiles code and distributes it with a portion of the data to the nodes that run it, and then performs the final aggregation of their intermediate results.

    Which component is the data engineer describing?
  fr: |
    Un ingénieur de données explique aux analystes comment un cluster provisionné Amazon Redshift exécute une requête en tant que système distribué. Un composant analyse le SQL, élabore le plan d'exécution, compile le code et le distribue avec une partie des données aux nœuds qui l'exécutent, puis effectue l'agrégation finale de leurs résultats intermédiaires.

    Quel composant l'ingénieur de données décrit-il ?
body:
  options:
    - { id: a, text: { en: "The node slices, which each process a portion of the data in parallel", fr: "Les tranches de nœud, qui traitent chacune une partie des données en parallèle" } }
    - { id: b, text: { en: "Redshift Managed Storage, which keeps the data in Amazon S3 with a local SSD cache", fr: "Redshift Managed Storage, qui conserve les données dans Amazon S3 avec un cache SSD local" } }
    - { id: c, text: { en: "The leader node, which coordinates the compute nodes and the client connections", fr: "Le nœud principal, qui coordonne les nœuds de calcul et les connexions des clients" } }
    - { id: d, text: { en: "The compute nodes, which run the compiled code and return intermediate results", fr: "Les nœuds de calcul, qui exécutent le code compilé et renvoient des résultats intermédiaires" } }
answer: { optionId: c }
explanation:
  correct:
    en: "In the Redshift architecture, the leader node manages client communication, parses queries, develops execution plans, compiles code, distributes it to the compute nodes with a portion of the data, and aggregates their intermediate results. The compute nodes and their slices do the parallel work."
    fr: "Dans l'architecture Redshift, le nœud principal gère la communication avec les clients, analyse les requêtes, élabore les plans d'exécution, compile le code, le distribue aux nœuds de calcul avec une partie des données et agrège leurs résultats intermédiaires. Les nœuds de calcul et leurs tranches effectuent le travail en parallèle."
  options:
    a:
      en: "Slices are partitions of a compute node that process their share of the work; they do not plan or aggregate the query."
      fr: "Les tranches sont des partitions d'un nœud de calcul qui traitent leur part du travail ; elles ne planifient ni n'agrègent la requête."
    b:
      en: "Managed storage holds the data; it does not plan or coordinate queries."
      fr: "Le stockage géré contient les données ; il ne planifie ni ne coordonne les requêtes."
    d:
      en: "Compute nodes run the compiled code and send intermediate results back to the component that distributes the work."
      fr: "Les nœuds de calcul exécutent le code compilé et renvoient les résultats intermédiaires au composant qui distribue le travail."
references:
  - title: Data warehouse system architecture
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html
