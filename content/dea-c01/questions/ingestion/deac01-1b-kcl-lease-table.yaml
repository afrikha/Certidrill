id: deac01-1b-kcl-lease-table
objective: "1.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a Kinesis Client Library (KCL) consumer application on Amazon EC2 instances to process an Amazon Kinesis data stream. The team will replace the instances with a new Auto Scaling group that runs the same code. The new workers must resume from the last records that the old workers checkpointed, without reprocessing or skipping records.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute sur des instances Amazon EC2 une application consommatrice basée sur la bibliothèque client Kinesis (KCL) pour traiter un flux de données Amazon Kinesis. L'équipe va remplacer les instances par un nouveau groupe Auto Scaling qui exécute le même code. Les nouveaux workers doivent reprendre à partir des derniers enregistrements pour lesquels les anciens workers ont créé un point de contrôle, sans retraiter ni sauter d'enregistrements.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the initial position in the stream of the new workers to TRIM_HORIZON.", fr: "Définir la position initiale dans le flux des nouveaux workers à TRIM_HORIZON." }
    - id: b
      text: { en: "Set the initial position in the stream of the new workers to LATEST.", fr: "Définir la position initiale dans le flux des nouveaux workers à LATEST." }
    - id: c
      text: { en: "Copy the last sequence numbers from the instance store of the old instances to the new instances.", fr: "Copier les derniers numéros de séquence depuis le stockage d'instance des anciennes instances vers les nouvelles." }
    - id: d
      text: { en: "Keep the same KCL application name so that the new workers use the existing DynamoDB lease table.", fr: "Conserver le même nom d'application KCL pour que les nouveaux workers utilisent la table de baux DynamoDB existante." }
answer: { optionId: d }
explanation:
  correct:
    en: "The KCL keeps its processing state in a DynamoDB lease table, which by default is named after the consumer application. Each row holds a shard lease and its latest checkpoint sequence number, so workers that start with the same application name take over the leases and resume from the checkpoints."
    fr: "La KCL conserve son état de traitement dans une table de baux DynamoDB, nommée par défaut d'après l'application consommatrice. Chaque ligne contient le bail d'une partition et son dernier numéro de séquence de point de contrôle : des workers qui démarrent avec le même nom d'application reprennent les baux et repartent des points de contrôle."
  options:
    a:
      en: "Starting from TRIM_HORIZON reads from the oldest record still in the stream, which reprocesses records that were already handled."
      fr: "Démarrer à TRIM_HORIZON lit à partir du plus ancien enregistrement encore présent dans le flux, ce qui retraite des enregistrements déjà traités."
    b:
      en: "Starting from LATEST skips the records written between the last checkpoint and the start of the new workers."
      fr: "Démarrer à LATEST saute les enregistrements écrits entre le dernier point de contrôle et le démarrage des nouveaux workers."
    c:
      en: "The KCL does not keep its checkpoints on the instances; they are in the lease table, and instance store data is lost when instances stop."
      fr: "La KCL ne conserve pas ses points de contrôle sur les instances ; ils sont dans la table de baux, et les données du stockage d'instance sont perdues à l'arrêt des instances."
references:
  - title: DynamoDB metadata tables and load balancing in KCL
    url: https://docs.aws.amazon.com/streams/latest/dev/kcl-dynamoDB.html
