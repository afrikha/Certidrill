id: deac01-1d-sfn-retry-glue-concurrency
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A state machine starts an AWS Glue job by using an AWS SDK service integration:

    ```json
    "StartEnrichJob": {
      "Type": "Task",
      "Resource": "arn:aws:states:::aws-sdk:glue:startJobRun",
      "Parameters": { "JobName": "enrich-orders" },
      "Next": "WaitForRun"
    }
    ```

    When several pipelines run at the same time, the state sometimes fails because the Glue API returns ConcurrentRunsExceededException. The state must retry only that error up to 5 times with increasing waits between attempts. Any other error must send the execution to a state named NotifyFailure.

    Which fields should be added to the StartEnrichJob state?
  fr: |
    Une machine d'état démarre une tâche AWS Glue au moyen d'une intégration de service AWS SDK :

    ```json
    "StartEnrichJob": {
      "Type": "Task",
      "Resource": "arn:aws:states:::aws-sdk:glue:startJobRun",
      "Parameters": { "JobName": "enrich-orders" },
      "Next": "WaitForRun"
    }
    ```

    Lorsque plusieurs pipelines s'exécutent en même temps, l'état échoue parfois parce que l'API Glue renvoie ConcurrentRunsExceededException. L'état doit retenter uniquement cette erreur, jusqu'à 5 fois, avec des attentes croissantes entre les tentatives. Toute autre erreur doit envoyer l'exécution vers un état nommé NotifyFailure.

    Quels champs faut-il ajouter à l'état StartEnrichJob ?
body:
  options:
    - { id: a, text: { en: "A Retry on [\"ConcurrentRunsExceededException\"] with IntervalSeconds 30, BackoffRate 2, and MaxAttempts 5, and a Catch on [\"States.ALL\"] with Next set to NotifyFailure.", fr: "Un Retry sur [\"ConcurrentRunsExceededException\"] avec IntervalSeconds 30, BackoffRate 2 et MaxAttempts 5, et un Catch sur [\"States.ALL\"] avec Next défini sur NotifyFailure." } }
    - { id: b, text: { en: "A Retry with a first retrier on [\"States.ALL\"] with MaxAttempts 0 and a second retrier on [\"Glue.ConcurrentRunsExceededException\"] with MaxAttempts 5, and a Catch on [\"States.ALL\"] with Next set to NotifyFailure.", fr: "Un Retry avec un premier réessayeur sur [\"States.ALL\"] avec MaxAttempts 0 et un second sur [\"Glue.ConcurrentRunsExceededException\"] avec MaxAttempts 5, et un Catch sur [\"States.ALL\"] avec Next défini sur NotifyFailure." } }
    - { id: c, text: { en: "A Retry on [\"Glue.ConcurrentRunsExceededException\"] with IntervalSeconds 30, BackoffRate 2, and MaxAttempts 5, and a Catch on [\"States.ALL\"] with Next set to NotifyFailure.", fr: "Un Retry sur [\"Glue.ConcurrentRunsExceededException\"] avec IntervalSeconds 30, BackoffRate 2 et MaxAttempts 5, et un Catch sur [\"States.ALL\"] avec Next défini sur NotifyFailure." } }
    - { id: d, text: { en: "A Catch on [\"Glue.ConcurrentRunsExceededException\"] with Next set to StartEnrichJob, and a second Catch on [\"States.ALL\"] with Next set to NotifyFailure.", fr: "Un Catch sur [\"Glue.ConcurrentRunsExceededException\"] avec Next défini sur StartEnrichJob, et un second Catch sur [\"States.ALL\"] avec Next défini sur NotifyFailure." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Errors of AWS SDK integrations are named ServiceName.ErrorName, so the retrier must match Glue.ConcurrentRunsExceededException. IntervalSeconds 30 with BackoffRate 2 doubles the wait after each attempt, and MaxAttempts 5 limits the retries. The Catch on States.ALL runs after the retries are exhausted or for any other error and routes the execution to NotifyFailure.
    fr: |
      Les erreurs des intégrations AWS SDK sont nommées ServiceName.ErrorName : le réessayeur doit donc correspondre à Glue.ConcurrentRunsExceededException. IntervalSeconds 30 avec BackoffRate 2 double l'attente après chaque tentative, et MaxAttempts 5 limite les nouvelles tentatives. Le Catch sur States.ALL s'applique une fois les tentatives épuisées ou pour toute autre erreur, et envoie l'exécution vers NotifyFailure.
  options:
    a: { en: "Without the Glue. service prefix, the error name does not match the error that Step Functions raises, so no retry happens.", fr: "Sans le préfixe de service Glue., le nom d'erreur ne correspond pas à l'erreur levée par Step Functions : aucune nouvelle tentative n'a lieu." }
    b: { en: "States.ALL must appear in the last retrier; a definition that places it first is not valid.", fr: "States.ALL doit figurer dans le dernier réessayeur ; une définition qui le place en premier n'est pas valide." }
    d: { en: "Looping through a Catch restarts the state immediately, with no increasing wait and no limit on the number of attempts.", fr: "Boucler par un Catch redémarre l'état immédiatement, sans attente croissante ni limite du nombre de tentatives." }
references:
  - title: Handling errors in Step Functions workflows
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
  - title: Learning to use AWS service SDK integrations in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/supported-services-awssdk.html
