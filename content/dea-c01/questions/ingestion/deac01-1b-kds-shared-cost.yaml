id: deac01-1b-kds-shared-cost
objective: "1.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has an Amazon Kinesis data stream in provisioned mode with 10 shards. Each shard receives about 0.4 MB of data per second. Two applications built with the Kinesis Client Library read the stream as shared-throughput consumers, and each calls GetRecords about once per second per shard. A third application must now read every record. A latency of a few seconds is acceptable for all three applications.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise dispose d'un flux de données Amazon Kinesis en mode provisionné avec 10 partitions. Chaque partition reçoit environ 0,4 Mo de données par seconde. Deux applications créées avec la bibliothèque client Kinesis (KCL) lisent le flux comme consommateurs à débit partagé, et chacune appelle GetRecords environ une fois par seconde et par partition. Une troisième application doit maintenant lire chaque enregistrement. Une latence de quelques secondes est acceptable pour les trois applications.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Register all three applications as enhanced fan-out consumers of the stream.", fr: "Enregistrer les trois applications comme consommateurs à diffusion améliorée du flux." }
    - id: b
      text: { en: "Add the third application as another shared-throughput consumer that uses the Kinesis Client Library.", fr: "Ajouter la troisième application comme nouveau consommateur à débit partagé qui utilise la KCL." }
    - id: c
      text: { en: "Double the number of shards and add the third application as a shared-throughput consumer.", fr: "Doubler le nombre de partitions et ajouter la troisième application comme consommateur à débit partagé." }
    - id: d
      text: { en: "Copy the stream into a second data stream with a Lambda function and point the third application at the copy.", fr: "Copier le flux dans un second flux de données avec une fonction Lambda et diriger la troisième application vers la copie." }
answer: { optionId: b }
explanation:
  correct:
    en: "Shared-throughput consumers share 2 MB per second and 5 GetRecords calls per second for each shard. Three consumers that each read 0.4 MB per second with one call per second use 1.2 MB and 3 calls per shard, which fits the limits, and the stated latency is acceptable, so no extra cost is needed."
    fr: "Les consommateurs à débit partagé se partagent 2 Mo par seconde et 5 appels GetRecords par seconde pour chaque partition. Trois consommateurs qui lisent chacun 0,4 Mo par seconde avec un appel par seconde utilisent 1,2 Mo et 3 appels par partition, ce qui respecte les limites, et la latence indiquée est acceptable : aucun coût supplémentaire n'est nécessaire."
  options:
    a:
      en: "Enhanced fan-out adds a consumer-shard hour charge and a data retrieval charge, which buys a latency that the applications do not need."
      fr: "La diffusion améliorée ajoute un coût par heure consommateur-partition et un coût de récupération des données, pour une latence dont les applications n'ont pas besoin."
    c:
      en: "The current shards already have enough read capacity for three consumers, so more shards only add cost."
      fr: "Les partitions actuelles ont déjà assez de capacité de lecture pour trois consommateurs : davantage de partitions ne fait qu'ajouter du coût."
    d:
      en: "A second stream and a copy function add stream, invocation, and maintenance costs without need."
      fr: "Un second flux et une fonction de copie ajoutent sans nécessité des coûts de flux, d'appels et de maintenance."
references:
  - title: Develop enhanced fan-out consumers with dedicated throughput
    url: https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html
  - title: Quotas and limits
    url: https://docs.aws.amazon.com/streams/latest/dev/service-sizes-and-limits.html
