id: deac01-1a-scheduler-flexible-window
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 200 Amazon EventBridge Scheduler schedules that each start an ingestion job at 00:00 UTC every day. All the jobs call the same source database, which throttles requests during the first minutes after midnight. The jobs can start at any time between 00:00 and 00:30 UTC. The company wants to spread the load with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de 200 planifications Amazon EventBridge Scheduler qui démarrent chacune une tâche d'ingestion chaque jour à 00 h 00 UTC. Toutes les tâches interrogent la même base de données source, qui limite les requêtes pendant les premières minutes après minuit. Les tâches peuvent démarrer à tout moment entre 00 h 00 et 00 h 30 UTC. L'entreprise veut étaler la charge avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a retry policy with more retry attempts to each schedule so that throttled jobs start again later.", fr: "Ajouter à chaque planification une politique de nouvelle tentative avec davantage de tentatives afin que les tâches limitées redémarrent plus tard." } }
    - { id: b, text: { en: "Edit each cron expression by hand so that the schedules start at different minutes between 00:00 and 00:30.", fr: "Modifier manuellement chaque expression cron afin que les planifications démarrent à des minutes différentes entre 00 h 00 et 00 h 30." } }
    - { id: c, text: { en: "Replace the schedules with a single schedule that starts all 200 jobs from one AWS Lambda function.", fr: "Remplacer les planifications par une planification unique qui démarre les 200 tâches à partir d'une seule fonction AWS Lambda." } }
    - { id: d, text: { en: "Set a flexible time window in FLEXIBLE mode with a maximum window of 30 minutes on each schedule.", fr: "Définir sur chaque planification une fenêtre de temps flexible en mode FLEXIBLE avec une fenêtre maximale de 30 minutes." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With a flexible time window, EventBridge Scheduler invokes the target at any point within the window after the scheduled time. Spreading the invocations across 30 minutes reduces the simultaneous load on the database, with one setting per schedule."
    fr: "Avec une fenêtre de temps flexible, EventBridge Scheduler appelle la cible à un moment quelconque de la fenêtre qui suit l'heure planifiée. Étaler les appels sur 30 minutes réduit la charge simultanée sur la base de données, avec un seul paramètre par planification."
  options:
    a:
      en: "All jobs still start at midnight and keep hitting the throttled database; retries only add more requests."
      fr: "Toutes les tâches démarrent toujours à minuit et continuent de solliciter la base limitée ; les nouvelles tentatives ne font qu'ajouter des requêtes."
    b:
      en: "Staggering 200 expressions by hand works but takes much more effort to set up and maintain."
      fr: "Échelonner manuellement 200 expressions fonctionne, mais demande bien plus d'effort à configurer et à maintenir."
    c:
      en: "Starting every job from one function concentrates the load at the same moment and adds code to maintain."
      fr: "Démarrer toutes les tâches depuis une seule fonction concentre la charge au même moment et ajoute du code à maintenir."
references:
  - title: Configuring flexible time windows in EventBridge Scheduler - EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-schedule-flexible-time-windows.html
