id: deac01-1e-sam-least-privilege-write
objective: "1.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS SAM template defines an AWS Lambda function named LoadFunction and an AWS::DynamoDB::Table resource named EventsTable. LoadFunction only writes items to EventsTable. The security team requires least-privilege permissions, and the data engineers do not want to write IAM policy statements by hand.

    Which solutions will meet these requirements? (Choose two.)
  fr: |
    Un modèle AWS SAM définit une fonction AWS Lambda nommée LoadFunction et une ressource AWS::DynamoDB::Table nommée EventsTable. LoadFunction ne fait qu'écrire des éléments dans EventsTable. L'équipe de sécurité exige des autorisations de moindre privilège, et les ingénieurs de données ne veulent pas écrire d'instructions de politique IAM à la main.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the AmazonDynamoDBFullAccess managed policy to the Policies property of LoadFunction.", fr: "Ajouter la politique gérée AmazonDynamoDBFullAccess à la propriété Policies de LoadFunction." } }
    - { id: b, text: { en: "Add a Connectors attribute to LoadFunction with EventsTable as the destination and Write as the permission.", fr: "Ajouter un attribut Connectors à LoadFunction avec EventsTable comme destination et Write comme autorisation." } }
    - { id: c, text: { en: "Add to the Policies property a statement that allows dynamodb:PutItem and dynamodb:BatchWriteItem on the ARN of EventsTable.", fr: "Ajouter à la propriété Policies une instruction qui autorise dynamodb:PutItem et dynamodb:BatchWriteItem sur l'ARN d'EventsTable." } }
    - { id: d, text: { en: "Add the DynamoDBCrudPolicy policy template with TableName set to !Ref EventsTable.", fr: "Ajouter le modèle de politique DynamoDBCrudPolicy avec TableName défini sur !Ref EventsTable." } }
    - { id: e, text: { en: "Add the DynamoDBWritePolicy policy template with TableName set to !Ref EventsTable.", fr: "Ajouter le modèle de politique DynamoDBWritePolicy avec TableName défini sur !Ref EventsTable." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "SAM connectors compose a well-scoped access policy between a source and a destination resource; a Write connector from the function to the table grants only write actions on that table. The DynamoDBWritePolicy policy template is a predefined policy scoped to one table that grants write access only. Neither requires an IAM statement written by hand."
    fr: "Les connecteurs SAM composent une politique d'accès bien délimitée entre une ressource source et une ressource de destination : un connecteur Write de la fonction vers la table n'accorde que des actions d'écriture sur cette table. Le modèle de politique DynamoDBWritePolicy est une politique prédéfinie limitée à une table, qui n'accorde que l'accès en écriture. Aucun des deux ne demande d'écrire une instruction IAM à la main."
  options:
    a:
      en: "The managed policy allows every DynamoDB action on every table, which is not least privilege."
      fr: "La politique gérée autorise toutes les actions DynamoDB sur toutes les tables, ce qui n'est pas le moindre privilège."
    c:
      en: "The statement is least privilege, but it is an IAM policy statement written by hand, which the team wants to avoid."
      fr: "L'instruction respecte le moindre privilège, mais c'est une instruction de politique IAM écrite à la main, ce que l'équipe veut éviter."
    d:
      en: "DynamoDBCrudPolicy also grants read and delete access, which the function does not need."
      fr: "DynamoDBCrudPolicy accorde aussi l'accès en lecture et en suppression, dont la fonction n'a pas besoin."
references:
  - title: Managing resource permissions with AWS SAM connectors
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/managing-permissions-connectors.html
  - title: AWS SAM policy templates
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-policy-templates.html
