id: deac01-1b-fargate-ephemeral-storage
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a nightly Amazon ECS task on AWS Fargate, Linux platform version 1.4.0. The task downloads a compressed archive from Amazon S3, extracts it, and transforms the files, which needs about 120 GiB of local scratch space. The task fails with "no space left on device" errors.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute chaque nuit une tâche Amazon ECS sur AWS Fargate, plateforme Linux version 1.4.0. La tâche télécharge une archive compressée depuis Amazon S3, l'extrait et transforme les fichiers, ce qui demande environ 120 Gio d'espace de travail local. La tâche échoue avec des erreurs « no space left on device ».

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Increase the ephemeralStorage size in the task definition to cover 120 GiB plus the container image.", fr: "Augmenter la taille ephemeralStorage de la définition de tâche pour couvrir 120 Gio plus l'image de conteneur." }
    - id: b
      text: { en: "Increase the memory in the task definition so that the extracted files are kept in memory during the run.", fr: "Augmenter la mémoire de la définition de tâche pour que les fichiers extraits soient conservés en mémoire pendant l'exécution." }
    - id: c
      text: { en: "Run the task on Fargate platform version 1.3.0 to get separate storage for volume mounts.", fr: "Exécuter la tâche sur la version de plateforme Fargate 1.3.0 pour obtenir un stockage distinct pour les montages de volumes." }
    - id: d
      text: { en: "Add a bind mount volume to the task definition and write the extracted files to that mounted path.", fr: "Ajouter un volume de montage lié (bind mount) à la définition de tâche et écrire les fichiers extraits dans ce chemin monté." }
answer: { optionId: a }
explanation:
  correct:
    en: "Fargate tasks on platform version 1.4.0 or later get at least 20 GiB of ephemeral storage by default, and the ephemeralStorage parameter raises it up to 200 GiB. The pulled container image is stored on the same ephemeral storage, so its size must be added to the scratch space the task needs."
    fr: "Les tâches Fargate sur la plateforme version 1.4.0 ou ultérieure reçoivent par défaut au moins 20 Gio de stockage éphémère, et le paramètre ephemeralStorage permet de l'augmenter jusqu'à 200 Gio. L'image de conteneur téléchargée est stockée sur ce même stockage éphémère : il faut donc ajouter sa taille à l'espace de travail nécessaire à la tâche."
  options:
    b:
      en: "The error is about disk space; more memory does not add local storage, and 120 GiB of files would not fit in task memory alongside the process."
      fr: "L'erreur concerne l'espace disque ; plus de mémoire n'ajoute pas de stockage local, et 120 Gio de fichiers ne tiendraient pas en mémoire avec le processus."
    c:
      en: "Platform version 1.3.0 gives only 10 GB of layer storage plus 4 GB for volume mounts, which is less space."
      fr: "La version de plateforme 1.3.0 ne donne que 10 Go de stockage de couches plus 4 Go pour les montages de volumes, soit moins d'espace."
    d:
      en: "Bind mounts on Fargate use the task's ephemeral storage, so they add no capacity unless the ephemeral storage is increased."
      fr: "Sur Fargate, les montages liés utilisent le stockage éphémère de la tâche : ils n'ajoutent aucune capacité si le stockage éphémère n'est pas augmenté."
references:
  - title: Fargate task ephemeral storage for Amazon ECS
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-task-storage.html
