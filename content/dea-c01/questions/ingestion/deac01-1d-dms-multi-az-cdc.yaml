id: deac01-1d-dms-multi-az-cdc
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company uses an AWS DMS task to replicate ongoing changes (CDC) from an on-premises Oracle database to Amazon S3. The task runs on a single-AZ replication instance. The company requires replication to continue automatically if the Availability Zone of the replication instance becomes unavailable.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de logistique utilise une tâche AWS DMS pour répliquer les modifications en continu (CDC) d'une base de données Oracle sur site vers Amazon S3. La tâche s'exécute sur une instance de réplication mono-AZ. L'entreprise exige que la réplication continue automatiquement si la zone de disponibilité de l'instance de réplication devient indisponible.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Move the task to a larger replication instance class with more allocated storage.", fr: "Déplacer la tâche vers une classe d'instance de réplication plus grande avec davantage de stockage alloué." } }
    - { id: b, text: { en: "Create a second replication instance in another Availability Zone and run a duplicate CDC task on it in parallel.", fr: "Créer une deuxième instance de réplication dans une autre zone de disponibilité et y exécuter en parallèle une tâche CDC en double." } }
    - { id: c, text: { en: "Create an EventBridge rule that invokes a Lambda function to recreate the replication instance and restart the task in another Availability Zone.", fr: "Créer une règle EventBridge qui appelle une fonction Lambda chargée de recréer l'instance de réplication et de redémarrer la tâche dans une autre zone de disponibilité." } }
    - { id: d, text: { en: "Modify the replication instance to use the Multi-AZ option.", fr: "Modifier l'instance de réplication pour utiliser l'option Multi-AZ." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With the Multi-AZ option, AWS DMS provisions and maintains a synchronous standby replica of the replication instance in a different Availability Zone and provides automatic failover. No custom automation or duplicate task is needed."
    fr: "Avec l'option Multi-AZ, AWS DMS provisionne et maintient un réplica de secours synchrone de l'instance de réplication dans une autre zone de disponibilité et assure le basculement automatique. Aucune automatisation personnalisée ni tâche en double n'est nécessaire."
  options:
    a: { en: "A larger instance improves capacity, but it still runs in a single Availability Zone.", fr: "Une instance plus grande améliore la capacité, mais elle s'exécute toujours dans une seule zone de disponibilité." }
    b: { en: "Two parallel tasks write every change twice to the target and must be deduplicated, which adds cost and work.", fr: "Deux tâches parallèles écrivent chaque modification deux fois dans la cible, qu'il faut ensuite dédupliquer, ce qui ajoute coût et travail." }
    c: { en: "Custom recovery automation must be built and tested, and recreating the instance takes longer than a managed failover.", fr: "Il faut créer et tester une automatisation de reprise personnalisée, et recréer l'instance prend plus de temps qu'un basculement géré." }
references:
  - title: Working with an AWS DMS replication instance
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_ReplicationInstance.html
