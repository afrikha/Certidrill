id: deac01-1a-hourly-glue-job-start
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer must start an AWS Glue ETL job at the beginning of every hour. The solution must not use servers that the company manages and must not require custom code.

    Which solutions will meet these requirements? (Choose two.)
  fr: |
    Un ingénieur données doit démarrer une tâche ETL AWS Glue au début de chaque heure. La solution ne doit pas utiliser de serveurs gérés par l'entreprise et ne doit pas nécessiter de code personnalisé.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an Amazon EventBridge rule whose event pattern matches the Glue Job State Change event of the job with the SUCCEEDED state.", fr: "Créer une règle Amazon EventBridge dont le modèle d'événement correspond à l'événement Glue Job State Change de la tâche avec l'état SUCCEEDED." } }
    - { id: b, text: { en: "Create an AWS Glue scheduled trigger with the expression `cron(0 * * * ? *)` that starts the job.", fr: "Créer un déclencheur planifié AWS Glue avec l'expression `cron(0 * * * ? *)` qui démarre la tâche." } }
    - { id: c, text: { en: "Create an AWS Glue crawler with an hourly schedule and add the job to the crawler as its target.", fr: "Créer un robot d'analyse AWS Glue avec une planification horaire et ajouter la tâche au robot comme cible." } }
    - { id: d, text: { en: "Configure an S3 Event Notification on the source bucket that sends object-created events to the Glue job.", fr: "Configurer sur le compartiment source une notification d'événement S3 qui envoie les événements de création d'objet à la tâche Glue." } }
    - { id: e, text: { en: "Create an Amazon EventBridge Scheduler schedule with `cron(0 * * * ? *)` and the `glue:startJobRun` universal target.", fr: "Créer une planification Amazon EventBridge Scheduler avec `cron(0 * * * ? *)` et la cible universelle `glue:startJobRun`." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A Glue scheduled trigger fires on a cron expression and starts the jobs it lists. An EventBridge Scheduler schedule can call the Glue StartJobRun API through a universal target with an execution role. Both are managed, time-based and need no code."
    fr: "Un déclencheur planifié Glue se déclenche selon une expression cron et démarre les tâches qu'il liste. Une planification EventBridge Scheduler peut appeler l'API StartJobRun de Glue via une cible universelle avec un rôle d'exécution. Les deux sont gérés, temporels et ne nécessitent aucun code."
  options:
    a:
      en: "This reacts to the end of a job run, not to the clock, and nothing would start the first run."
      fr: "Cette règle réagit à la fin d'une exécution de tâche, pas à l'horloge, et rien ne démarrerait la première exécution."
    c:
      en: "Crawlers populate the Data Catalog; they cannot have a job as a target or start a job."
      fr: "Les robots d'analyse alimentent le Data Catalog ; ils ne peuvent ni avoir une tâche comme cible ni démarrer une tâche."
    d:
      en: "S3 Event Notifications are event-based, not hourly, and a Glue job is not a supported notification destination."
      fr: "Les notifications d'événements S3 sont événementielles, pas horaires, et une tâche Glue n'est pas une destination de notification prise en charge."
references:
  - title: AWS Glue triggers - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/about-triggers.html
  - title: Using universal targets in EventBridge Scheduler - EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-universal.html
