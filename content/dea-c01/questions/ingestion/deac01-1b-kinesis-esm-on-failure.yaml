id: deac01-1b-kinesis-esm-on-failure
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon Kinesis data stream through an event source mapping with default settings. A few malformed records make the function fail, and processing of the affected shards stops while Lambda keeps retrying the same batch. The company wants the other records of the shard to keep flowing, and it wants enough information about the failed records to replay them from the stream after a fix.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda traite un flux de données Amazon Kinesis par un mappage de source d'événement aux paramètres par défaut. Quelques enregistrements mal formés font échouer la fonction, et le traitement des partitions concernées s'arrête pendant que Lambda réessaie sans fin le même lot. L'entreprise veut que les autres enregistrements de la partition continuent d'être traités, et veut assez d'informations sur les enregistrements en échec pour les rejouer depuis le flux après une correction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure a dead-letter queue on the function and set the maximum retry attempts of asynchronous invocation to 2.", fr: "Configurer une file d'attente de lettres mortes sur la fonction et définir à 2 le nombre maximal de tentatives des appels asynchrones." }
    - id: b
      text: { en: "Increase the batch size of the event source mapping so that the failed records are processed with more records.", fr: "Augmenter la taille de lot du mappage de source d'événement pour que les enregistrements en échec soient traités avec davantage d'enregistrements." }
    - id: c
      text: { en: "Set the parallelization factor of the event source mapping to 10 so that other batches run beside the failing one.", fr: "Définir le facteur de parallélisation du mappage de source d'événement à 10 pour que d'autres lots s'exécutent à côté du lot en échec." }
    - id: d
      text: { en: "Turn on batch bisection, limit the retry attempts, and add an SQS on-failure destination to the event source mapping.", fr: "Activer la bissection des lots, limiter les nouvelles tentatives et ajouter une destination en cas d'échec SQS au mappage de source d'événement." }
answer: { optionId: d }
explanation:
  correct:
    en: "With BisectBatchOnFunctionError, Lambda splits a failing batch in two and retries the halves, which isolates the bad records, and a retry limit stops endless retries. The on-failure destination of a stream event source mapping receives information about the discarded batch, such as the shard and sequence numbers, which identifies the records to replay from the stream while they are still retained."
    fr: "Avec BisectBatchOnFunctionError, Lambda divise un lot en échec en deux et réessaie les moitiés, ce qui isole les enregistrements défectueux, et une limite de tentatives arrête les nouvelles tentatives sans fin. La destination en cas d'échec d'un mappage de source d'événement de flux reçoit des informations sur le lot abandonné, comme la partition et les numéros de séquence, qui identifient les enregistrements à rejouer depuis le flux tant qu'ils sont conservés."
  options:
    a:
      en: "Function dead-letter queues and asynchronous retry settings apply to asynchronous invocations; an event source mapping reads the stream synchronously."
      fr: "Les files d'attente de lettres mortes de fonction et les paramètres de tentatives asynchrones s'appliquent aux appels asynchrones ; un mappage de source d'événement lit le flux de façon synchrone."
    b:
      en: "Larger batches put more good records in each failing batch, so more records are blocked by the bad ones."
      fr: "Des lots plus grands mettent davantage de bons enregistrements dans chaque lot en échec : plus d'enregistrements sont bloqués par les mauvais."
    c:
      en: "Lambda keeps in-order processing for each partition key, so records with the failing key stay blocked, and nothing records the failed batch for replay."
      fr: "Lambda garde un traitement ordonné par clé de partition : les enregistrements de la clé en échec restent bloqués, et rien n'enregistre le lot en échec pour le rejouer."
references:
  - title: Using Lambda to process records from Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
  - title: Retain discarded batch records for a Kinesis Data Streams event source in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/kinesis-on-failure-destination.html
