id: deac01-1a-appflow-incremental
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A sales operations team uses an Amazon AppFlow flow that runs every hour and copies the Salesforce Opportunity object to Amazon S3. Each run transfers all 2 million records, although only a few hundred are created or modified each hour. The team wants each run to transfer only the records that were created or modified since the previous successful run.

    Which solution will meet this requirement?
  fr: |
    Une équipe des opérations commerciales utilise un flux Amazon AppFlow qui s'exécute toutes les heures et copie l'objet Opportunity de Salesforce vers Amazon S3. Chaque exécution transfère les 2 millions d'enregistrements, alors que seules quelques centaines sont créées ou modifiées chaque heure. L'équipe veut que chaque exécution ne transfère que les enregistrements créés ou modifiés depuis la dernière exécution réussie.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Change the scheduled flow to incremental transfer and choose LastModifiedDate as the source timestamp field.", fr: "Passer le flux planifié en transfert incrémentiel et choisir LastModifiedDate comme champ d'horodatage source." } }
    - { id: b, text: { en: "Change the flow trigger to run on demand and start the flow manually when changes are expected.", fr: "Passer le déclencheur du flux en exécution à la demande et démarrer le flux manuellement lorsque des modifications sont attendues." } }
    - { id: c, text: { en: "Add an S3 Lifecycle rule that expires the objects written by earlier runs after one hour.", fr: "Ajouter une règle S3 Lifecycle qui fait expirer après une heure les objets écrits par les exécutions précédentes." } }
    - { id: d, text: { en: "Add a filter to the flow that keeps only records whose CreatedDate is within the last hour.", fr: "Ajouter au flux un filtre qui ne conserve que les enregistrements dont CreatedDate se situe dans la dernière heure." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A scheduled flow can use incremental transfer, which transfers only the records added or changed since the last successful run. The source timestamp field tells AppFlow how to find them; a last-modified field captures both new and updated records."
    fr: "Un flux planifié peut utiliser le transfert incrémentiel, qui ne transfère que les enregistrements ajoutés ou modifiés depuis la dernière exécution réussie. Le champ d'horodatage source indique à AppFlow comment les trouver ; un champ de dernière modification capture à la fois les nouveaux enregistrements et ceux mis à jour."
  options:
    b:
      en: "On-demand runs remove the hourly schedule, and each run would still be a full transfer."
      fr: "Les exécutions à la demande suppriment la planification horaire, et chaque exécution resterait un transfert complet."
    c:
      en: "Expiring old objects does not change what each run transfers from Salesforce."
      fr: "Faire expirer les anciens objets ne change pas ce que chaque exécution transfère depuis Salesforce."
    d:
      en: "Filtering on the creation date misses records that were modified but not created in the last hour, and a fixed window can skip records after a failed run."
      fr: "Filtrer sur la date de création manque les enregistrements modifiés mais non créés dans la dernière heure, et une fenêtre fixe peut sauter des enregistrements après une exécution en échec."
references:
  - title: Flow triggers - Amazon AppFlow
    url: https://docs.aws.amazon.com/appflow/latest/userguide/flow-triggers.html
