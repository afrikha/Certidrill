id: deac01-1a-dms-mysql-cdc-prereqs
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer creates an AWS DMS task of type full load and ongoing replication from an Amazon RDS for MySQL 8.0 DB instance to Amazon S3. The DB instance has automated backups turned off and uses a custom DB parameter group in which `binlog_format` is `MIXED` and `binlog_row_image` is `FULL`. The binary log retention setting has never been changed. The task must capture changes reliably.

    Which combination of actions must the data engineer take? (Choose three.)
  fr: |
    Un ingénieur données crée une tâche AWS DMS de type chargement complet et réplication continue d'une instance de base de données Amazon RDS for MySQL 8.0 vers Amazon S3. Les sauvegardes automatiques de l'instance sont désactivées et l'instance utilise un groupe de paramètres de base de données personnalisé dans lequel `binlog_format` vaut `MIXED` et `binlog_row_image` vaut `FULL`. Le paramètre de conservation des journaux binaires n'a jamais été modifié. La tâche doit capturer les modifications de manière fiable.

    Quelle combinaison d'actions l'ingénieur données doit-il effectuer ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Turn on automated backups for the DB instance.", fr: "Activer les sauvegardes automatiques de l'instance de base de données." } }
    - { id: b, text: { en: "Set `binlog_format` to `ROW` in the parameter group and restart the DB instance.", fr: "Définir `binlog_format` à `ROW` dans le groupe de paramètres et redémarrer l'instance de base de données." } }
    - { id: c, text: { en: "Turn on Multi-AZ for the DB instance so that DMS can read the standby logs.", fr: "Activer Multi-AZ pour l'instance de base de données afin que DMS puisse lire les journaux de l'instance de secours." } }
    - { id: d, text: { en: "Increase the binary log retention by calling `mysql.rds_set_configuration` with `binlog retention hours`.", fr: "Augmenter la conservation des journaux binaires en appelant `mysql.rds_set_configuration` avec `binlog retention hours`." } }
    - { id: e, text: { en: "Set `binlog_row_image` to `MINIMAL` in the parameter group to reduce the log volume.", fr: "Définir `binlog_row_image` à `MINIMAL` dans le groupe de paramètres pour réduire le volume des journaux." } }
    - { id: f, text: { en: "Turn on IAM database authentication and use it in the DMS source endpoint.", fr: "Activer l'authentification de base de données IAM et l'utiliser dans le point de terminaison source DMS." } }
answer: { optionIds: [ a, b, d ] }
explanation:
  correct:
    en: "On RDS for MySQL, binary logging is turned on by enabling automated backups. DMS CDC requires binlog_format set to ROW (restart so that existing sessions stop writing MIXED logs) and binlog_row_image set to FULL, which is already the case. RDS purges binary logs as soon as possible, so the retention must be increased so that DMS can read the logs it needs."
    fr: "Sur RDS for MySQL, la journalisation binaire s'active en activant les sauvegardes automatiques. La CDC DMS exige binlog_format défini à ROW (redémarrer pour que les sessions existantes cessent d'écrire des journaux MIXED) et binlog_row_image défini à FULL, ce qui est déjà le cas. RDS purge les journaux binaires dès que possible : il faut donc augmenter leur conservation pour que DMS puisse lire les journaux dont il a besoin."
  options:
    c:
      en: "Multi-AZ adds a standby for availability; it is not a CDC prerequisite and DMS does not read standby logs."
      fr: "Multi-AZ ajoute une instance de secours pour la disponibilité ; ce n'est pas un prérequis de la CDC et DMS ne lit pas les journaux de l'instance de secours."
    e:
      en: "DMS requires binlog_row_image set to FULL; MINIMAL would break change capture."
      fr: "DMS exige binlog_row_image défini à FULL ; MINIMAL empêcherait la capture des modifications."
    f:
      en: "The authentication method of the endpoint is unrelated to the binary log settings that CDC needs."
      fr: "La méthode d'authentification du point de terminaison est sans rapport avec les paramètres de journal binaire nécessaires à la CDC."
references:
  - title: Using a MySQL-compatible database as a source for AWS DMS - AWS Database Migration Service
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.MySQL.html
