id: deac01-1e-cicd-mwaa-dag-deploy
objective: "1.4.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs Apache Airflow DAGs on Amazon Managed Workflows for Apache Airflow (Amazon MWAA). The DAG files are stored in a GitHub repository. After each merge into the main branch, an AWS CodePipeline pipeline runs an AWS CodeBuild project that lints and tests the DAGs. The new DAG files must then reach the environment automatically, with the LEAST operational overhead and without interrupting the environment. The releases do not change requirements.txt or the plugins.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des DAG Apache Airflow sur Amazon Managed Workflows for Apache Airflow (Amazon MWAA). Les fichiers des DAG sont stockés dans un dépôt GitHub. Après chaque fusion dans la branche main, un pipeline AWS CodePipeline exécute un projet AWS CodeBuild qui analyse et teste les DAG. Les nouveaux fichiers de DAG doivent ensuite atteindre l'environnement automatiquement, avec le MOINS de charge opérationnelle et sans interrompre l'environnement. Les versions ne modifient ni requirements.txt ni les plugins.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a step that calls the MWAA UpdateEnvironment API with the new DAG files after each merge.", fr: "Ajouter une étape qui appelle l'API UpdateEnvironment de MWAA avec les nouveaux fichiers de DAG après chaque fusion." } }
    - { id: b, text: { en: "Package the DAG files into plugins.zip, upload it, and update the environment to the new plugins version.", fr: "Empaqueter les fichiers de DAG dans plugins.zip, le charger, et mettre à jour l'environnement vers la nouvelle version des plugins." } }
    - { id: c, text: { en: "Add a CodeBuild command that runs aws s3 sync to copy the DAG files to the dags folder of the environment's S3 bucket.", fr: "Ajouter une commande CodeBuild qui exécute aws s3 sync pour copier les fichiers de DAG dans le dossier dags du compartiment S3 de l'environnement." } }
    - { id: d, text: { en: "Create a new MWAA environment for each release, and delete the previous environment after the first successful run.", fr: "Créer un nouvel environnement MWAA pour chaque version, et supprimer l'environnement précédent après la première exécution réussie." } }
answer: { optionId: c }
explanation:
  correct:
    en: "DAGs are deployed by copying them to the dags folder of the environment's S3 bucket. Amazon MWAA syncs new and changed objects from that folder to the scheduler and worker containers every 30 seconds, so a copy step at the end of the build is enough and the environment keeps running."
    fr: "Les DAG se déploient en les copiant dans le dossier dags du compartiment S3 de l'environnement. Amazon MWAA synchronise les objets nouveaux et modifiés de ce dossier vers les conteneurs du planificateur et des workers toutes les 30 secondes : une étape de copie à la fin de la génération suffit, et l'environnement continue de fonctionner."
  options:
    a:
      en: "DAG files are not passed through UpdateEnvironment; an environment update is unnecessary for DAG changes and adds a long operation."
      fr: "Les fichiers de DAG ne passent pas par UpdateEnvironment ; une mise à jour de l'environnement est inutile pour des modifications de DAG et ajoute une opération longue."
    b:
      en: "plugins.zip is for custom plugins, and this adds an environment update for every DAG change, which is unnecessary overhead."
      fr: "plugins.zip sert aux plugins personnalisés, et cette solution ajoute une mise à jour de l'environnement à chaque modification de DAG, ce qui est une charge inutile."
    d:
      en: "Creating and deleting environments for each release adds a large overhead and loses the run history."
      fr: "Créer et supprimer des environnements à chaque version ajoute une charge importante et fait perdre l'historique des exécutions."
references:
  - title: Adding or updating DAGs
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/configuring-dag-folder.html
