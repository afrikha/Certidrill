id: deac01-1b-redshift-datashare
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The finance team of a company owns an Amazon Redshift provisioned cluster with revenue tables. The marketing team uses an Amazon Redshift Serverless workgroup in the same AWS account. Marketing analysts must join the finance revenue tables with their campaign tables, always on the latest committed data, without copying the revenue data.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    L'équipe financière d'une entreprise possède un cluster provisionné Amazon Redshift contenant des tables de revenus. L'équipe marketing utilise un groupe de travail Amazon Redshift Serverless dans le même compte AWS. Les analystes marketing doivent joindre les tables de revenus de la finance à leurs tables de campagnes, toujours sur les dernières données validées, sans copier les données de revenus.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "On the finance cluster, create a datashare, add the revenue tables, and grant usage to the namespace of the marketing workgroup.", fr: "Sur le cluster financier, créer une unité de partage des données (datashare), y ajouter les tables de revenus et accorder l'utilisation à l'espace de noms du groupe de travail marketing." } }
    - { id: b, text: { en: "In the marketing workgroup, create a federated query external schema FROM POSTGRES that points to the finance cluster.", fr: "Dans le groupe de travail marketing, créer un schéma externe de requête fédérée FROM POSTGRES qui pointe vers le cluster financier." } }
    - { id: c, text: { en: "Unload the revenue tables to Amazon S3 every night and query them from marketing with Redshift Spectrum.", fr: "Décharger chaque nuit les tables de revenus dans Amazon S3 et les interroger depuis le marketing avec Redshift Spectrum." } }
    - { id: d, text: { en: "In the marketing workgroup, create a database from the datashare and query the shared tables.", fr: "Dans le groupe de travail marketing, créer une base de données à partir de l'unité de partage des données et interroger les tables partagées." } }
    - { id: e, text: { en: "Restore a snapshot of the finance cluster into the marketing workgroup every morning.", fr: "Restaurer chaque matin un instantané du cluster financier dans le groupe de travail marketing." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Redshift data sharing shares live data across provisioned clusters and serverless workgroups without copying or moving it, and new consumer transactions see committed changes right away. The producer creates the datashare, adds objects, and grants it to the consumer namespace; the consumer creates a database from the datashare to query the shared tables."
    fr: "Le partage de données Redshift partage des données en direct entre clusters provisionnés et groupes de travail sans serveur, sans les copier ni les déplacer, et les nouvelles transactions du consommateur voient immédiatement les modifications validées. Le producteur crée l'unité de partage des données (datashare), y ajoute des objets et l'accorde à l'espace de noms consommateur ; le consommateur crée une base de données à partir de cette unité pour interroger les tables partagées."
  options:
    b:
      en: "Redshift federated queries support RDS and Aurora PostgreSQL and MySQL databases as sources, not another Redshift warehouse."
      fr: "Les requêtes fédérées Redshift prennent en charge comme sources des bases RDS et Aurora PostgreSQL et MySQL, pas un autre entrepôt Redshift."
    c:
      en: "Nightly unloads copy the data and are up to a day old instead of current."
      fr: "Des déchargements nocturnes copient les données et ont jusqu'à un jour de retard au lieu d'être à jour."
    e:
      en: "A restored snapshot is a copy of the data at the time of the snapshot, not the latest committed data."
      fr: "Un instantané restauré est une copie des données au moment de l'instantané, pas les dernières données validées."
references:
  - title: Data sharing in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/datashare-overview.html
