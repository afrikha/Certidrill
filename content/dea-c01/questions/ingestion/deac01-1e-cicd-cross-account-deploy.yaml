id: deac01-1e-cicd-cross-account-deploy
objective: "1.4.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an AWS CodePipeline pipeline in a tooling account. Its artifact store is an Amazon S3 bucket in the tooling account. A new stage must use an AWS CloudFormation deploy action to update a data ingestion stack in the prod account. The prod account already has a CloudFormation service role with the permissions to manage the stack resources.

    Which combination of steps will meet these requirements? (Choose three.)
  fr: |
    AnyCompany exécute un pipeline AWS CodePipeline dans un compte d'outillage. Son magasin d'artefacts est un compartiment Amazon S3 du compte d'outillage. Une nouvelle étape doit utiliser une action de déploiement AWS CloudFormation pour mettre à jour une pile d'ingestion de données dans le compte de production. Le compte de production possède déjà un rôle de service CloudFormation doté des autorisations pour gérer les ressources de la pile.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Keep the default AWS managed key of the artifact store, and grant the prod account access to it in its key policy.", fr: "Conserver la clé gérée par AWS par défaut du magasin d'artefacts, et en accorder l'accès au compte de production dans sa politique de clé." } }
    - { id: b, text: { en: "Encrypt the artifact store with a customer managed AWS KMS key whose key policy allows the pipeline service role and the prod account.", fr: "Chiffrer le magasin d'artefacts avec une clé AWS KMS gérée par le client dont la politique de clé autorise le rôle de service du pipeline et le compte de production." } }
    - { id: c, text: { en: "Add a bucket policy to the artifact bucket that grants the prod account access to the pipeline artifacts.", fr: "Ajouter au compartiment d'artefacts une politique de compartiment qui accorde au compte de production l'accès aux artefacts du pipeline." } }
    - { id: d, text: { en: "Replicate the artifact bucket to the prod account with S3 Replication, and point the deploy action to the replica.", fr: "Répliquer le compartiment d'artefacts vers le compte de production avec S3 Replication, et faire pointer l'action de déploiement vers la réplique." } }
    - { id: e, text: { en: "Create a second pipeline in the prod account, and start it from the tooling pipeline with an AWS Lambda invoke action.", fr: "Créer un second pipeline dans le compte de production, et le démarrer depuis le pipeline d'outillage avec une action d'appel AWS Lambda." } }
    - { id: f, text: { en: "Create a role in the prod account that trusts the pipeline service role, allow sts:AssumeRole on it, and set it as the roleArn of the deploy action.", fr: "Créer dans le compte de production un rôle qui approuve le rôle de service du pipeline, autoriser sts:AssumeRole sur ce rôle, et le définir comme roleArn de l'action de déploiement." } }
answer: { optionIds: [ b, c, f ] }
explanation:
  correct:
    en: "A cross-account action needs a customer managed KMS key for the artifact store, with a key policy that lets the pipeline role and the other account use it, because the default key cannot be used. The artifact bucket policy grants the other account access to the artifacts, and the action runs with a role in the prod account that trusts the pipeline service role, set as roleArn."
    fr: "Une action entre comptes exige une clé KMS gérée par le client pour le magasin d'artefacts, avec une politique de clé qui permet au rôle du pipeline et à l'autre compte de l'utiliser, car la clé par défaut ne peut pas être utilisée. La politique du compartiment d'artefacts accorde à l'autre compte l'accès aux artefacts, et l'action s'exécute avec un rôle du compte de production qui approuve le rôle de service du pipeline, défini comme roleArn."
  options:
    a:
      en: "The key policy of an AWS managed key cannot be changed, and CodePipeline requires a customer managed key for cross-account actions."
      fr: "La politique de clé d'une clé gérée par AWS ne peut pas être modifiée, et CodePipeline exige une clé gérée par le client pour les actions entre comptes."
    d:
      en: "The deploy action reads the artifacts from the pipeline's artifact store; a replica in another account is not used."
      fr: "L'action de déploiement lit les artefacts dans le magasin d'artefacts du pipeline ; une réplique dans un autre compte n'est pas utilisée."
    e:
      en: "A second pipeline and custom invoke code add overhead and still need cross-account access to the artifacts."
      fr: "Un second pipeline et du code d'appel personnalisé ajoutent de la charge et nécessitent toujours un accès entre comptes aux artefacts."
references:
  - title: Create a pipeline in CodePipeline that uses resources from another AWS account
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
