id: deac01-1d-emr-three-primary-nodes
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs a long-running Amazon EMR cluster that uses instance groups and HDFS. Spark jobs are submitted to the cluster around the clock. Last month the single primary node failed, and the whole cluster became unavailable until engineers rebuilt it. The company wants the cluster to keep running without interruption if a primary node fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers exécute un cluster Amazon EMR de longue durée qui utilise des groupes d'instances et HDFS. Des tâches Spark sont soumises au cluster en permanence. Le mois dernier, l'unique nœud primaire est tombé en panne et tout le cluster est resté indisponible jusqu'à ce que les ingénieurs le reconstruisent. L'entreprise veut que le cluster continue à fonctionner sans interruption en cas de panne d'un nœud primaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable termination protection on the cluster so that the primary node cannot be terminated.", fr: "Activer la protection contre la résiliation sur le cluster pour que le nœud primaire ne puisse pas être résilié." } }
    - { id: b, text: { en: "Launch the cluster with three primary nodes in its primary instance group.", fr: "Lancer le cluster avec trois nœuds primaires dans son groupe d'instances primaire." } }
    - { id: c, text: { en: "Add core nodes to the cluster and increase the HDFS replication factor.", fr: "Ajouter des nœuds principaux (core) au cluster et augmenter le facteur de réplication HDFS." } }
    - { id: d, text: { en: "Run the primary node on Spot Instances from several instance types by using an instance fleet.", fr: "Exécuter le nœud primaire sur des instances Spot de plusieurs types en utilisant un parc d'instances (instance fleet)." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An EMR cluster with three primary nodes keeps running on the two remaining primary nodes if one fails, and Amazon EMR replaces the failed node with the same configuration and bootstrap actions. HDFS NameNode and YARN ResourceManager run in high-availability mode across the primary nodes."
    fr: "Un cluster EMR à trois nœuds primaires continue à fonctionner sur les deux nœuds primaires restants si l'un d'eux tombe en panne, et Amazon EMR remplace le nœud défaillant avec la même configuration et les mêmes actions d'amorçage. Le NameNode HDFS et le ResourceManager YARN fonctionnent en haute disponibilité sur les nœuds primaires."
  options:
    a: { en: "Termination protection prevents accidental termination by a user or API call; it does not protect against a hardware or instance failure.", fr: "La protection contre la résiliation empêche une résiliation accidentelle par un utilisateur ou un appel d'API ; elle ne protège pas contre une panne matérielle ou d'instance." }
    c: { en: "More core nodes and replicas protect HDFS data blocks, but the cluster still depends on a single primary node.", fr: "Davantage de nœuds principaux et de réplicas protègent les blocs de données HDFS, mais le cluster dépend toujours d'un seul nœud primaire." }
    d: { en: "Primary nodes of a multi-primary cluster cannot use Spot, and Spot interruptions would make a single primary node less available, not more.", fr: "Les nœuds primaires d'un cluster multi-primaire ne peuvent pas utiliser Spot, et les interruptions Spot rendraient un nœud primaire unique moins disponible, pas plus." }
references:
  - title: Plan and configure primary nodes in your Amazon EMR cluster
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-ha.html
  - title: Launch an Amazon EMR Cluster with multiple primary nodes
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-ha-launch.html
