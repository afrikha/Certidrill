id: deac01-1a-dms-parallel-load-partitions
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS DMS full-load task migrates an Oracle database to Amazon S3. All tables finish within hours except `SALES.ORDERS`, a 4 TB table with 48 monthly partitions, which loads in a single thread and takes several days. The replication instance has spare CPU and memory. The company wants to shorten the load of this table with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une tâche AWS DMS de chargement complet migre une base de données Oracle vers Amazon S3. Toutes les tables se terminent en quelques heures, sauf `SALES.ORDERS`, une table de 4 To comportant 48 partitions mensuelles, qui se charge dans un seul thread et prend plusieurs jours. L'instance de réplication dispose de processeur et de mémoire disponibles. L'entreprise veut raccourcir le chargement de cette table avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a table-settings rule for `SALES.ORDERS` to the table mapping with `\"parallel-load\": {\"type\": \"partitions-auto\"}`.", fr: "Ajouter au mappage de tables une règle table-settings pour `SALES.ORDERS` avec `\"parallel-load\": {\"type\": \"partitions-auto\"}`." } }
    - { id: b, text: { en: "Increase the MaxFullLoadSubTasks task setting to 49 so that more work runs at the same time.", fr: "Porter le paramètre de tâche MaxFullLoadSubTasks à 49 afin que davantage de travail s'exécute en même temps." } }
    - { id: c, text: { en: "Create 48 separate DMS tasks, each with a selection filter on one month of `SALES.ORDERS`.", fr: "Créer 48 tâches DMS distinctes, chacune avec un filtre de sélection sur un mois de `SALES.ORDERS`." } }
    - { id: d, text: { en: "Increase the CommitRate task setting so that each batch transfers more records.", fr: "Augmenter le paramètre de tâche CommitRate afin que chaque lot transfère davantage d'enregistrements." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The parallel-load table setting splits one large table into segments that load in parallel, one thread per segment, and the source is read in parallel too. With the partitions-auto type, which Oracle supports, every existing partition is loaded by its own thread, within the limit set by MaxFullLoadSubTasks."
    fr: "Le paramètre de table parallel-load divise une grande table en segments chargés en parallèle, un thread par segment, et la source est elle aussi lue en parallèle. Avec le type partitions-auto, pris en charge par Oracle, chaque partition existante est chargée par son propre thread, dans la limite fixée par MaxFullLoadSubTasks."
  options:
    b:
      en: "MaxFullLoadSubTasks raises the number of tables or segments loaded at once, but without parallel-load this table is still one segment loaded by one thread."
      fr: "MaxFullLoadSubTasks augmente le nombre de tables ou de segments chargés simultanément, mais sans parallel-load cette table reste un seul segment chargé par un seul thread."
    c:
      en: "Separate filtered tasks can parallelize the load, but 48 tasks are far more to create and monitor than one table-settings rule."
      fr: "Des tâches filtrées distinctes peuvent paralléliser le chargement, mais 48 tâches sont bien plus lourdes à créer et à surveiller qu'une seule règle table-settings."
    d:
      en: "CommitRate changes the batch size of one thread; the table is still loaded by a single thread."
      fr: "CommitRate modifie la taille de lot d'un thread ; la table est toujours chargée par un seul thread."
references:
  - title: Table and collection settings rules and operations - AWS Database Migration Service
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.CustomizingTasks.TableMapping.SelectionTransformation.Tablesettings.html
