id: deac01-1a-datasync-nfs-nightly
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research laboratory writes instrument output as CSV files to an on-premises NFS file share. Every night, the files must be copied to an Amazon S3 bucket for analysis. The laboratory wants a managed service that verifies data integrity, uses encryption in transit, and requires no custom scripts.

    Which solution will meet these requirements?
  fr: |
    Un laboratoire de recherche écrit la sortie de ses instruments sous forme de fichiers CSV dans un partage de fichiers NFS sur site. Chaque nuit, les fichiers doivent être copiés dans un compartiment Amazon S3 pour analyse. Le laboratoire veut un service géré qui vérifie l'intégrité des données, chiffre les données en transit et ne nécessite aucun script personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy an AWS DataSync agent, create NFS and S3 locations, and create a task with a daily schedule.", fr: "Déployer un agent AWS DataSync, créer des emplacements NFS et S3, et créer une tâche avec une planification quotidienne." } }
    - { id: b, text: { en: "Create an AWS Transfer Family SFTP server with an S3 backend and have the laboratory upload the files every night.", fr: "Créer un serveur SFTP AWS Transfer Family adossé à S3 et faire charger les fichiers chaque nuit par le laboratoire." } }
    - { id: c, text: { en: "Create an AWS DMS task with the file share as the source endpoint and the bucket as the target endpoint.", fr: "Créer une tâche AWS DMS avec le partage de fichiers comme point de terminaison source et le compartiment comme point de terminaison cible." } }
    - { id: d, text: { en: "Schedule a cron job on an on-premises server that runs `aws s3 sync` from the mounted share to the bucket.", fr: "Planifier sur un serveur sur site une tâche cron qui exécute `aws s3 sync` du partage monté vers le compartiment." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS DataSync is a managed file transfer service that copies data from NFS, SMB, HDFS and object storage to Amazon S3, with encryption and data integrity validation. A task can run on an hourly, daily, weekly or custom cron schedule."
    fr: "AWS DataSync est un service géré de transfert de fichiers qui copie des données depuis NFS, SMB, HDFS et du stockage objet vers Amazon S3, avec chiffrement et validation de l'intégrité des données. Une tâche peut s'exécuter selon une planification horaire, quotidienne, hebdomadaire ou cron personnalisée."
  options:
    b:
      en: "Transfer Family receives files that clients upload, so the laboratory would need a script or client to push the files every night."
      fr: "Transfer Family reçoit des fichiers chargés par des clients : le laboratoire aurait besoin d'un script ou d'un client pour envoyer les fichiers chaque nuit."
    c:
      en: "AWS DMS migrates databases, and an NFS file share is not a DMS source endpoint."
      fr: "AWS DMS migre des bases de données, et un partage de fichiers NFS n'est pas un point de terminaison source DMS."
    d:
      en: "A cron job with the AWS CLI is a custom script that the laboratory would have to run and monitor itself."
      fr: "Une tâche cron avec l'AWS CLI est un script personnalisé que le laboratoire devrait exécuter et surveiller lui-même."
references:
  - title: What is AWS DataSync? - AWS DataSync
    url: https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
  - title: Scheduling when your AWS DataSync task runs - AWS DataSync
    url: https://docs.aws.amazon.com/datasync/latest/userguide/task-scheduling.html
