id: deac01-1b-batch-spot-retries
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs hundreds of containerized data transformation jobs each night with AWS Batch on Amazon EC2. The jobs are idempotent and can restart from the beginning if an instance is interrupted, and they must all finish by morning. The company wants the lowest compute cost with as few interruptions as possible, and no manual resubmission of interrupted jobs.

    Which combination of configurations will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute chaque nuit des centaines de tâches conteneurisées de transformation de données avec AWS Batch sur Amazon EC2. Les tâches sont idempotentes et peuvent redémarrer depuis le début si une instance est interrompue, et elles doivent toutes se terminer avant le matin. L'entreprise veut le coût de calcul le plus bas avec le moins d'interruptions possible, et aucune nouvelle soumission manuelle des tâches interrompues.

    Quelle combinaison de configurations répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A managed compute environment that uses Spot Instances with the SPOT_PRICE_CAPACITY_OPTIMIZED allocation strategy", fr: "Un environnement de calcul géré qui utilise des instances Spot avec la stratégie d'allocation SPOT_PRICE_CAPACITY_OPTIMIZED" } }
    - { id: b, text: { en: "A managed compute environment that uses On-Demand Instances with the BEST_FIT allocation strategy", fr: "Un environnement de calcul géré qui utilise des instances à la demande avec la stratégie d'allocation BEST_FIT" } }
    - { id: c, text: { en: "A job timeout in the job definition so that long-running jobs are stopped", fr: "Un délai d'expiration de tâche dans la définition de tâche pour arrêter les tâches trop longues" } }
    - { id: d, text: { en: "A retry strategy in the job definition with several attempts", fr: "Une stratégie de nouvelles tentatives dans la définition de tâche avec plusieurs tentatives" } }
    - { id: e, text: { en: "A higher priority for the job queue of the transformation jobs", fr: "Une priorité plus élevée pour la file d'attente des tâches de transformation" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Spot Instances lower the cost of interruption-tolerant jobs, and SPOT_PRICE_CAPACITY_OPTIMIZED chooses the Spot pools that are least likely to be interrupted at the lowest price; AWS recommends it over SPOT_CAPACITY_OPTIMIZED in most cases. A retry strategy of up to 10 attempts makes AWS Batch rerun a job automatically when its instance is terminated."
    fr: "Les instances Spot réduisent le coût des tâches qui tolèrent les interruptions, et SPOT_PRICE_CAPACITY_OPTIMIZED choisit les pools Spot les moins susceptibles d'être interrompus au prix le plus bas ; AWS la recommande plutôt que SPOT_CAPACITY_OPTIMIZED dans la plupart des cas. Une stratégie de nouvelles tentatives, jusqu'à 10 tentatives, fait relancer automatiquement une tâche par AWS Batch lorsque son instance est arrêtée."
  options:
    b:
      en: "On-Demand Instances avoid interruptions but cost more than Spot Instances for jobs that tolerate restarts."
      fr: "Les instances à la demande évitent les interruptions mais coûtent plus cher que les instances Spot pour des tâches qui tolèrent les redémarrages."
    c:
      en: "A timeout ends jobs that run too long; it does not rerun jobs that an interruption stopped."
      fr: "Un délai d'expiration termine les tâches trop longues ; il ne relance pas les tâches arrêtées par une interruption."
    e:
      en: "Queue priority orders jobs between queues that share compute environments; it neither lowers cost nor reruns interrupted jobs."
      fr: "La priorité de file ordonne les tâches entre files qui partagent des environnements de calcul ; elle ne réduit pas le coût et ne relance pas les tâches interrompues."
references:
  - title: Instance type allocation strategies for AWS Batch
    url: https://docs.aws.amazon.com/batch/latest/userguide/allocation-strategies.html
  - title: Automated job retries
    url: https://docs.aws.amazon.com/batch/latest/userguide/job_retries.html
