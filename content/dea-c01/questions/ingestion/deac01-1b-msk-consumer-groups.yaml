id: deac01-1b-msk-consumer-groups
objective: "1.1.10"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A bank publishes card transactions to a topic in an Amazon MSK cluster. A fraud application, which runs as one instance, must receive every transaction. A reporting application must also receive every transaction, and it runs as three instances that must share the work so that each transaction is processed only once by the reporting application.

    Which combination of configurations will meet these requirements with the LEAST operational overhead? (Choose two.)
  fr: |
    Une banque publie des transactions par carte dans une rubrique (topic) d'un cluster Amazon MSK. Une application de lutte contre la fraude, qui s'exécute sur une instance, doit recevoir chaque transaction. Une application de reporting doit aussi recevoir chaque transaction ; elle s'exécute sur trois instances qui doivent se partager le travail pour que chaque transaction ne soit traitée qu'une fois par l'application de reporting.

    Quelle combinaison de configurations répond à ces exigences avec le MOINS de charge opérationnelle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure the fraud application with its own consumer group ID.", fr: "Configurer l'application de lutte contre la fraude avec son propre ID de groupe de consommateurs." } }
    - { id: b, text: { en: "Configure each reporting instance with a different consumer group ID.", fr: "Configurer chaque instance de reporting avec un ID de groupe de consommateurs différent." } }
    - { id: c, text: { en: "Configure the fraud application and the reporting instances with the same consumer group ID.", fr: "Configurer l'application de lutte contre la fraude et les instances de reporting avec le même ID de groupe de consommateurs." } }
    - { id: d, text: { en: "Configure the three reporting instances with one shared consumer group ID that the fraud application does not use.", fr: "Configurer les trois instances de reporting avec un même ID de groupe de consommateurs que l'application de lutte contre la fraude n'utilise pas." } }
    - { id: e, text: { en: "Replicate the topic to a second MSK cluster with MSK Replicator and point the reporting application at the replica.", fr: "Répliquer la rubrique vers un second cluster MSK avec MSK Replicator et diriger l'application de reporting vers la réplique." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Kafka distributes the messages of a topic across the consumers of a consumer group, and each consumer group receives the whole topic. A dedicated group for the fraud application gives it every transaction, and one shared group for the three reporting instances splits the transactions among them while that application still sees each one."
    fr: "Kafka répartit les messages d'une rubrique entre les consommateurs d'un groupe de consommateurs, et chaque groupe reçoit toute la rubrique. Un groupe dédié à l'application de lutte contre la fraude lui donne chaque transaction, et un groupe partagé par les trois instances de reporting répartit les transactions entre elles tout en garantissant que cette application les voit toutes."
  options:
    b:
      en: "With three different groups, each reporting instance receives every transaction, so the reporting application processes each one three times."
      fr: "Avec trois groupes différents, chaque instance de reporting reçoit toutes les transactions : l'application de reporting traite chacune trois fois."
    c:
      en: "In one shared group, the fraud application receives only a portion of the transactions because the group splits them among all its members."
      fr: "Dans un groupe partagé, l'application de lutte contre la fraude ne reçoit qu'une partie des transactions, car le groupe les répartit entre tous ses membres."
    e:
      en: "Consumer groups already let several applications read the same topic, so a second cluster and a replicator only add cost and operations."
      fr: "Les groupes de consommateurs permettent déjà à plusieurs applications de lire la même rubrique : un second cluster et un réplicateur n'ajoutent que du coût et de l'exploitation."
references:
  - title: Customizable consumer group ID in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/kafka-consumer-group-id.html
