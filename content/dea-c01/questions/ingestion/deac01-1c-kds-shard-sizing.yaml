id: deac01-1c-kds-shard-sizing
objective: "1.2.9"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A gaming company sizes an Amazon Kinesis Data Streams stream in provisioned mode. Producers will write a steady 6,000 records per second with an average size of 0.5 KB. Each event is written as its own record with the PutRecords API, without record aggregation, and the partition keys spread the records evenly across the shards.

    What is the minimum number of shards that can handle this write traffic?
  fr: |
    Une entreprise de jeux vidéo dimensionne un flux Amazon Kinesis Data Streams en mode provisionné. Les producteurs écriront en continu 6 000 enregistrements par seconde d'une taille moyenne de 0,5 Ko. Chaque événement est écrit comme un enregistrement distinct avec l'API PutRecords, sans agrégation d'enregistrements, et les clés de partition répartissent uniformément les enregistrements entre les partitions (shards).

    Quel est le nombre minimal de partitions capable de gérer ce trafic d'écriture ?
body:
  options:
    - { id: a, text: "3" }
    - { id: b, text: "6" }
    - { id: c, text: "12" }
    - { id: d, text: "24" }
answer: { optionId: b }
explanation:
  correct:
    en: "In provisioned mode, each shard accepts writes of up to 1 MB per second or 1,000 records per second. The data rate is about 3 MB per second, which needs 3 shards, but 6,000 records per second needs 6 shards, so the record limit decides and the stream needs at least 6 shards."
    fr: "En mode provisionné, chaque partition accepte des écritures jusqu'à 1 Mo par seconde ou 1 000 enregistrements par seconde. Le débit de données est d'environ 3 Mo par seconde, ce qui demande 3 partitions, mais 6 000 enregistrements par seconde demandent 6 partitions : la limite d'enregistrements l'emporte et le flux a besoin d'au moins 6 partitions."
  options:
    a:
      en: "3 shards cover the 3 MB per second data rate but accept only 3,000 records per second."
      fr: "3 partitions couvrent le débit de données de 3 Mo par seconde, mais n'acceptent que 3 000 enregistrements par seconde."
    c:
      en: "12 shards would be needed only at 12,000 records per second; 6 shards already meet both write limits."
      fr: "12 partitions ne seraient nécessaires qu'à 12 000 enregistrements par seconde ; 6 partitions respectent déjà les deux limites d'écriture."
    d:
      en: "24 shards are four times the capacity that the traffic needs and add cost for unused shards."
      fr: "24 partitions représentent quatre fois la capacité nécessaire au trafic et ajoutent le coût de partitions inutilisées."
references:
  - title: Quotas and limits
    url: https://docs.aws.amazon.com/streams/latest/dev/service-sizes-and-limits.html
