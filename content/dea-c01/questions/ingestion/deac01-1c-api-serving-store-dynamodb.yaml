id: deac01-1c-api-serving-store-dynamodb
objective: "1.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Each night, an AWS Glue job computes product recommendations for 40 million customers and writes them as Parquet files in Amazon S3, where analysts query them with Amazon Athena. A new mobile backend must call an API that returns the recommendations of one customer, with single-digit millisecond database reads at up to 5,000 requests per second. The data can be up to 24 hours old.

    Which solution will meet these requirements?
  fr: |
    Chaque nuit, une tâche AWS Glue calcule des recommandations de produits pour 40 millions de clients et les écrit sous forme de fichiers Parquet dans Amazon S3, où des analystes les interrogent avec Amazon Athena. Un nouveau backend mobile doit appeler une API qui renvoie les recommandations d'un client, avec des lectures de base de données en quelques millisecondes et jusqu'à 5 000 requêtes par seconde. Les données peuvent dater de 24 heures au plus.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Have the Glue job also write the recommendations to a DynamoDB table keyed by customer ID, and serve them through API Gateway and a Lambda function that calls GetItem.", fr: "Faire aussi écrire les recommandations par la tâche Glue dans une table DynamoDB indexée par ID client, et les servir au moyen d'API Gateway et d'une fonction Lambda qui appelle GetItem." } }
    - { id: b, text: { en: "Serve the recommendations through API Gateway and a Lambda function that runs an Athena query filtered on the customer ID for each request.", fr: "Servir les recommandations au moyen d'API Gateway et d'une fonction Lambda qui exécute pour chaque requête une requête Athena filtrée sur l'ID client." } }
    - { id: c, text: { en: "Serve the recommendations through API Gateway and a Lambda function that downloads the Parquet files and searches them for the customer ID.", fr: "Servir les recommandations au moyen d'API Gateway et d'une fonction Lambda qui télécharge les fichiers Parquet et y recherche l'ID client." } }
    - { id: d, text: { en: "Load the recommendations into Amazon Redshift each night and serve them through a Lambda function that calls the Redshift Data API for each request.", fr: "Charger les recommandations dans Amazon Redshift chaque nuit et les servir au moyen d'une fonction Lambda qui appelle l'API de données Redshift pour chaque requête." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An analytics store is not a serving store: per-key lookups at high request rates need a database such as DynamoDB, which delivers single-digit millisecond performance at any scale. AWS Glue can write a DynamicFrame directly to a DynamoDB table, so the nightly job refreshes the serving table that the API reads with GetItem."
    fr: "Un magasin d'analyse n'est pas un magasin de service : les recherches par clé à fort débit de requêtes nécessitent une base comme DynamoDB, qui offre des performances de l'ordre de la milliseconde à n'importe quelle échelle. AWS Glue peut écrire un DynamicFrame directement dans une table DynamoDB : la tâche nocturne actualise la table de service que l'API lit avec GetItem."
  options:
    b:
      en: "Each Athena query is asynchronous and takes seconds, and running 5,000 queries per second exceeds Athena's design and adds per-query cost."
      fr: "Chaque requête Athena est asynchrone et prend plusieurs secondes, et exécuter 5 000 requêtes par seconde dépasse la conception d'Athena et ajoute un coût par requête."
    c:
      en: "Scanning Parquet files for each request takes far longer than a key lookup and repeats the same S3 reads thousands of times per second."
      fr: "Parcourir des fichiers Parquet à chaque requête prend bien plus de temps qu'une recherche par clé et répète les mêmes lectures S3 des milliers de fois par seconde."
    d:
      en: "The Data API is asynchronous, and a data warehouse is built for analytic queries, not for thousands of millisecond key lookups per second."
      fr: "L'API de données est asynchrone, et un entrepôt de données est conçu pour des requêtes analytiques, pas pour des milliers de recherches par clé en quelques millisecondes par seconde."
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
  - title: DynamoDB connections
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-connect-dynamodb-home.html
