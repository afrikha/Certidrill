id: deac01-1a-sfn-wait-export-api
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every day, a company must ingest a large export from a vendor's API. A POST request starts an export job and returns a job ID, a GET request returns the job status, and the export file can be downloaded when the status is COMPLETE. An export takes between 20 minutes and 3 hours. The company wants a serverless solution with the LEAST operational overhead that is not billed for compute while it waits for the export.

    Which solution will meet these requirements?
  fr: |
    Chaque jour, une entreprise doit ingérer une exportation volumineuse depuis l'API d'un fournisseur. Une requête POST démarre une tâche d'exportation et renvoie un identifiant de tâche, une requête GET renvoie l'état de la tâche, et le fichier exporté peut être téléchargé lorsque l'état est COMPLETE. Une exportation dure entre 20 minutes et 3 heures. L'entreprise veut une solution sans serveur avec le MOINS de charge opérationnelle, qui ne soit pas facturée en calcul pendant l'attente de l'exportation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Invoke one AWS Lambda function that starts the export, sleeps between status checks, and downloads the file when the export is complete.", fr: "Appeler une fonction AWS Lambda unique qui démarre l'exportation, attend entre les vérifications d'état et télécharge le fichier une fois l'exportation terminée." } }
    - { id: b, text: { en: "Run a script on an Amazon EC2 instance that starts the export, polls the status every 10 minutes, and downloads the file.", fr: "Exécuter sur une instance Amazon EC2 un script qui démarre l'exportation, interroge l'état toutes les 10 minutes et télécharge le fichier." } }
    - { id: c, text: { en: "Use a Step Functions Standard workflow: a Lambda function starts the export, a Wait state and a Choice state loop on a status check, then a Lambda function downloads the file.", fr: "Utiliser un flux de travail Step Functions Standard : une fonction Lambda démarre l'exportation, un état Wait et un état Choice bouclent sur une vérification d'état, puis une fonction Lambda télécharge le fichier." } }
    - { id: d, text: { en: "Run an AWS Glue Python shell job that starts the export, polls the status every 10 minutes, and downloads the file.", fr: "Exécuter une tâche AWS Glue Python shell qui démarre l'exportation, interroge l'état toutes les 10 minutes et télécharge le fichier." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A Standard workflow can wait for up to one year, and its Wait state pauses the execution without running any compute; Standard workflows are billed per state transition, not for waiting time. The Lambda functions run only for the short start, check and download steps."
    fr: "Un flux de travail Standard peut attendre jusqu'à un an, et son état Wait met l'exécution en pause sans exécuter de calcul ; les flux de travail Standard sont facturés par transition d'état, pas pour le temps d'attente. Les fonctions Lambda ne s'exécutent que pour les courtes étapes de démarrage, de vérification et de téléchargement."
  options:
    a:
      en: "A function that sleeps is billed for its whole duration, including the time spent waiting for the export."
      fr: "Une fonction qui attend est facturée pour toute sa durée, y compris le temps passé à attendre l'exportation."
    b:
      en: "An EC2 instance is not serverless and is billed while the script waits."
      fr: "Une instance EC2 n'est pas sans serveur et elle est facturée pendant que le script attend."
    d:
      en: "A Python shell job is billed for its run time, which includes all the waiting between status checks."
      fr: "Une tâche Python shell est facturée pour sa durée d'exécution, qui inclut toute l'attente entre les vérifications d'état."
references:
  - title: Wait workflow state - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-wait.html
