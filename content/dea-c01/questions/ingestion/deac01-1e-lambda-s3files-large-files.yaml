id: deac01-1e-lambda-s3files-large-files
objective: "1.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company runs an AWS Lambda function that is connected to a VPC. The function uses a Python library that accepts only local file paths. It must read genomics files of up to 20 GB from an existing Amazon S3 bucket and write its results back to the bucket as files. The data must not be copied to another storage service, and the solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de recherche exécute une fonction AWS Lambda connectée à un VPC. La fonction utilise une bibliothèque Python qui n'accepte que des chemins de fichiers locaux. Elle doit lire des fichiers génomiques d'au plus 20 Go dans un compartiment Amazon S3 existant et réécrire ses résultats dans le compartiment sous forme de fichiers. Les données ne doivent pas être copiées vers un autre service de stockage, et la solution doit avoir le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon S3 Files file system for the bucket, and mount it in the function under /mnt/.", fr: "Créer un système de fichiers Amazon S3 Files pour le compartiment, et le monter dans la fonction sous /mnt/." } }
    - { id: b, text: { en: "Set the ephemeral storage of the function to 10,240 MB, and download each file to /tmp before processing it.", fr: "Définir le stockage éphémère de la fonction à 10 240 Mo, et télécharger chaque fichier dans /tmp avant de le traiter." } }
    - { id: c, text: { en: "Create an Amazon EFS file system, copy the bucket data to it with AWS DataSync, and mount it in the function.", fr: "Créer un système de fichiers Amazon EFS, y copier les données du compartiment avec AWS DataSync, et le monter dans la fonction." } }
    - { id: d, text: { en: "Package the files in Lambda layers so that the library can read them from the /opt directory.", fr: "Empaqueter les fichiers dans des couches Lambda afin que la bibliothèque puisse les lire dans le répertoire /opt." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon S3 Files is a shared file system that gives access to the objects of an S3 bucket as files, with changes synchronized back to the bucket. Lambda can mount it on a local path that starts with /mnt/ when the function is in the same VPC as the mount targets, so the library reads and writes the bucket data through file paths without a copy."
    fr: "Amazon S3 Files est un système de fichiers partagé qui donne accès aux objets d'un compartiment S3 sous forme de fichiers, les modifications étant synchronisées vers le compartiment. Lambda peut le monter sur un chemin local qui commence par /mnt/ quand la fonction est dans le même VPC que les cibles de montage : la bibliothèque lit et écrit ainsi les données du compartiment par des chemins de fichiers, sans copie."
  options:
    b:
      en: "Ephemeral storage is at most 10,240 MB, which is smaller than a 20 GB file."
      fr: "Le stockage éphémère est d'au plus 10 240 Mo, ce qui est inférieur à un fichier de 20 Go."
    c:
      en: "This copies the data to another storage service and adds a synchronization task to operate."
      fr: "Cette solution copie les données vers un autre service de stockage et ajoute une tâche de synchronisation à exploiter."
    d:
      en: "Layers are .zip archives counted in the deployment package size limit, and their content is fixed when the layer version is published, so results cannot be written back."
      fr: "Les couches sont des archives .zip comptées dans la limite de taille du package de déploiement, et leur contenu est figé à la publication de la version de couche : les résultats ne peuvent pas y être réécrits."
references:
  - title: Configuring Amazon S3 Files access
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-filesystem-s3files.html
  - title: Working with Amazon S3 Files
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files.html
