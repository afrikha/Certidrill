id: deac01-1a-eventbridge-archive-replay
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon S3 bucket sends its events to Amazon EventBridge, and a rule on the default event bus starts an AWS Step Functions ingestion workflow for each Object Created event. Last week, a defect in the workflow corrupted the output for every file uploaded during 6 hours, and the files had to be uploaded again. The company wants to be able to run the workflow again for the events of any past time range, without uploading files again or writing code.

    Which solution will meet these requirements?
  fr: |
    Un compartiment Amazon S3 envoie ses événements à Amazon EventBridge, et une règle du bus d'événements par défaut démarre un flux de travail d'ingestion AWS Step Functions pour chaque événement Object Created. La semaine dernière, un défaut du flux de travail a corrompu la sortie de chaque fichier chargé pendant 6 heures, et les fichiers ont dû être chargés à nouveau. L'entreprise veut pouvoir réexécuter le flux de travail pour les événements de n'importe quelle période passée, sans charger à nouveau les fichiers ni écrire de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a dead-letter queue to the rule target and redrive its messages to the workflow when a defect is found.", fr: "Ajouter une file d'attente de lettres mortes à la cible de la règle et rediriger ses messages vers le flux de travail lorsqu'un défaut est détecté." } }
    - { id: b, text: { en: "Turn on CloudTrail data events for the bucket and restart the workflow from the PutObject events of the time range.", fr: "Activer les événements de données CloudTrail pour le compartiment et redémarrer le flux de travail à partir des événements PutObject de la période." } }
    - { id: c, text: { en: "Turn on S3 Versioning for the bucket and restore the previous versions of the files of the time range.", fr: "Activer S3 Versioning sur le compartiment et restaurer les versions précédentes des fichiers de la période." } }
    - { id: d, text: { en: "Archive the bucket's Object Created events on the default event bus, and replay the events of a time range when needed.", fr: "Archiver les événements Object Created du compartiment sur le bus d'événements par défaut, et relire les événements d'une période si nécessaire." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An EventBridge archive stores the events of an event bus that match its pattern, for a retention period that you set. A replay sends the archived events of a chosen time range back to the source bus, optionally to specific rules, so the workflow runs again for those objects. Replayed events carry a replay-name field, and events are archived only after the archive exists."
    fr: "Une archive EventBridge stocke les événements d'un bus d'événements qui correspondent à son modèle, pendant une durée de conservation que vous définissez. Une relecture renvoie les événements archivés d'une période choisie vers le bus source, éventuellement vers des règles précises : le flux de travail s'exécute à nouveau pour ces objets. Les événements relus portent un champ replay-name, et seuls les événements reçus après la création de l'archive sont archivés."
  options:
    a:
      en: "A dead-letter queue receives only events that EventBridge failed to deliver; the workflow received these events successfully."
      fr: "Une file d'attente de lettres mortes ne reçoit que les événements qu'EventBridge n'a pas réussi à livrer ; le flux de travail a bien reçu ces événements."
    b:
      en: "CloudTrail records API calls, but restarting the workflow from them requires custom code to rebuild and send the events."
      fr: "CloudTrail enregistre les appels d'API, mais redémarrer le flux de travail à partir de ceux-ci exige du code personnalisé pour reconstruire et envoyer les événements."
    c:
      en: "Restoring a previous version creates a new upload, which is what the company wants to avoid, and does not replay past events."
      fr: "Restaurer une version précédente crée un nouveau chargement, ce que l'entreprise veut éviter, et ne relit pas les événements passés."
references:
  - title: Archiving and replaying events in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-archive.html
