id: deac01-1e-dsa-graph-oltp-analytics
objective: "1.4.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A payments company models accounts, devices, and payments as a graph. During each payment authorization, the application must find within milliseconds whether the paying account is connected to a flagged account by a path of at most three hops. Every week, analysts must run community detection and PageRank across the full graph, which is exported to Amazon S3, without writing the algorithms themselves.

    Which combination of solutions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de paiement modélise les comptes, les appareils et les paiements sous forme de graphe. Pendant chaque autorisation de paiement, l'application doit déterminer en quelques millisecondes si le compte payeur est relié à un compte signalé par un chemin d'au plus trois sauts. Chaque semaine, les analystes doivent exécuter une détection de communautés et un PageRank sur le graphe complet, exporté vers Amazon S3, sans écrire eux-mêmes les algorithmes.

    Quelle combinaison de solutions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the graph in Amazon Redshift, and run a recursive common table expression during each authorization.", fr: "Stocker le graphe dans Amazon Redshift, et exécuter une expression de table commune récursive pendant chaque autorisation." } }
    - { id: b, text: { en: "Run a weekly Amazon EMR cluster with custom Spark code that implements community detection and PageRank.", fr: "Exécuter chaque semaine un cluster Amazon EMR avec du code Spark personnalisé qui implémente la détection de communautés et le PageRank." } }
    - { id: c, text: { en: "Store the graph in an Amazon Neptune database, and run an openCypher variable-length path query during each authorization.", fr: "Stocker le graphe dans une base de données Amazon Neptune, et exécuter une requête openCypher de chemin de longueur variable pendant chaque autorisation." } }
    - { id: d, text: { en: "Store one item per edge in Amazon DynamoDB, and create a global secondary index for each hop of the path.", fr: "Stocker un élément par arête dans Amazon DynamoDB, et créer un index secondaire global pour chaque saut du chemin." } }
    - { id: e, text: { en: "Load the weekly export into a Neptune Analytics graph, and call its built-in Louvain and PageRank algorithms with openCypher.", fr: "Charger l'export hebdomadaire dans un graphe Neptune Analytics, et appeler ses algorithmes intégrés Louvain et PageRank avec openCypher." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Graph traversals follow edges from vertex to vertex, which a graph database such as Neptune does with low latency for transactional queries like a bounded multi-hop path. Neptune Analytics is a memory-optimized engine for analytics on graphs loaded from S3 or Neptune, with built-in path finding, centrality such as PageRank, and community detection such as Louvain, called as openCypher procedures."
    fr: "Les parcours de graphe suivent les arêtes de sommet en sommet, ce qu'une base de données de graphes comme Neptune fait avec une faible latence pour des requêtes transactionnelles comme un chemin à nombre de sauts limité. Neptune Analytics est un moteur optimisé pour la mémoire destiné à l'analyse de graphes chargés depuis S3 ou Neptune, avec des algorithmes intégrés de recherche de chemin, de centralité comme PageRank et de détection de communautés comme Louvain, appelés comme procédures openCypher."
  options:
    a:
      en: "A recursive query in a data warehouse repeats joins at each level and is not designed for millisecond lookups during a transaction."
      fr: "Une requête récursive dans un entrepôt de données répète des jointures à chaque niveau et n'est pas conçue pour des recherches en quelques millisecondes pendant une transaction."
    b:
      en: "Custom Spark code means writing the algorithms, which the analysts want to avoid."
      fr: "Du code Spark personnalisé implique d'écrire les algorithmes, ce que les analystes veulent éviter."
    d:
      en: "Each hop becomes a separate round trip from the application, and indexes do not express graph paths; it also gives no graph algorithms."
      fr: "Chaque saut devient un aller-retour distinct depuis l'application, et les index n'expriment pas les chemins de graphe ; cela ne fournit pas non plus d'algorithmes de graphe."
references:
  - title: Neptune Analytics algorithms
    url: https://docs.aws.amazon.com/neptune-analytics/latest/userguide/algorithms.html
  - title: What is Neptune Analytics?
    url: https://docs.aws.amazon.com/neptune-analytics/latest/userguide/what-is-neptune-analytics.html
