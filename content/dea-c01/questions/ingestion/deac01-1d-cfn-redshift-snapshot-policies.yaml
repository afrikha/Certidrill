id: deac01-1d-cfn-redshift-snapshot-policies
objective: "1.4.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS CloudFormation template defines an AWS::Redshift::Cluster resource for an analytics pipeline. The company has two requirements. If the stack is deleted, a final snapshot of the cluster must be kept. If a template update changes a property that requires the cluster to be replaced, the data of the old cluster must be saved as a snapshot before the old cluster is deleted. The company does not want to keep old clusters running.

    Which combination of attributes should be added to the resource? (Choose two.)
  fr: |
    Un modèle AWS CloudFormation définit une ressource AWS::Redshift::Cluster pour un pipeline d'analyse. L'entreprise a deux exigences. Si la pile est supprimée, un instantané final du cluster doit être conservé. Si une mise à jour du modèle modifie une propriété qui impose le remplacement du cluster, les données de l'ancien cluster doivent être enregistrées dans un instantané avant la suppression de l'ancien cluster. L'entreprise ne veut pas conserver d'anciens clusters en fonctionnement.

    Quelle combinaison d'attributs faut-il ajouter à la ressource ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "`UpdateReplacePolicy: Snapshot`" }
    - { id: b, text: { en: "Termination protection enabled on the stack", fr: "La protection contre la résiliation activée sur la pile" } }
    - { id: c, text: "`DeletionPolicy: Retain`" }
    - { id: d, text: "`DeletionPolicy: RetainExceptOnCreate`" }
    - { id: e, text: "`DeletionPolicy: Snapshot`" }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      DeletionPolicy applies when the stack is deleted or the resource is removed from the template; with Snapshot, CloudFormation snapshots the Redshift cluster before deleting it. DeletionPolicy does not apply when an update replaces the resource: UpdateReplacePolicy controls the old physical resource, and Snapshot saves it before deletion. Both attributes support AWS::Redshift::Cluster.
    fr: |
      DeletionPolicy s'applique lorsque la pile est supprimée ou que la ressource est retirée du modèle ; avec Snapshot, CloudFormation crée un instantané du cluster Redshift avant de le supprimer. DeletionPolicy ne s'applique pas lorsqu'une mise à jour remplace la ressource : c'est UpdateReplacePolicy qui gère l'ancienne ressource physique, et Snapshot l'enregistre avant sa suppression. Les deux attributs prennent en charge AWS::Redshift::Cluster.
  options:
    b: { en: "Termination protection blocks the deletion of the stack instead of keeping a snapshot when it is deleted, and it has no effect on replacements.", fr: "La protection contre la résiliation bloque la suppression de la pile au lieu de conserver un instantané lors de cette suppression, et n'a aucun effet sur les remplacements." }
    c: { en: "Retain keeps the whole cluster running after stack deletion, and the old cluster is still deleted when an update replaces it.", fr: "Retain conserve tout le cluster en fonctionnement après la suppression de la pile, et l'ancien cluster est quand même supprimé lorsqu'une mise à jour le remplace." }
    d: { en: "RetainExceptOnCreate keeps the cluster itself instead of a snapshot and does not cover replacement during an update.", fr: "RetainExceptOnCreate conserve le cluster lui-même au lieu d'un instantané et ne couvre pas le remplacement lors d'une mise à jour." }
references:
  - title: DeletionPolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html
  - title: UpdateReplacePolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatereplacepolicy.html
