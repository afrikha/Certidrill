id: deac01-1c-unstructured-source
objective: "1.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank is listing the sources of a new data lake. Sources with no predefined data model will be stored as objects and processed separately from tabular data.

    Which source produces unstructured data?
  fr: |
    Une banque recense les sources d'un nouveau lac de données. Les sources sans modèle de données prédéfini seront stockées sous forme d'objets et traitées séparément des données tabulaires.

    Quelle source produit des données non structurées ?
body:
  options:
    - { id: a, text: { en: "Account rows exported from an Amazon Aurora MySQL table", fr: "Des lignes de comptes exportées d'une table Amazon Aurora MySQL" } }
    - { id: b, text: { en: "Payment events published as JSON documents", fr: "Des événements de paiement publiés sous forme de documents JSON" } }
    - { id: c, text: { en: "Recorded customer support calls stored as audio files", fr: "Des appels enregistrés du support client stockés sous forme de fichiers audio" } }
    - { id: d, text: { en: "Interbank messages exchanged in XML format", fr: "Des messages interbancaires échangés au format XML" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Audio, video, images and documents such as invoices have no predefined data model, so they are unstructured data. Tables of relational databases are structured, and JSON and XML documents carry their own tags and keys, which makes them semi-structured."
    fr: "Les fichiers audio, les vidéos, les images et les documents comme les factures n'ont pas de modèle de données prédéfini : ce sont des données non structurées. Les tables des bases de données relationnelles sont structurées, et les documents JSON et XML portent leurs propres balises et clés, ce qui en fait des données semi-structurées."
  options:
    a:
      en: "Rows of a relational table follow a fixed schema, which is structured data."
      fr: "Les lignes d'une table relationnelle suivent un schéma fixe : ce sont des données structurées."
    b:
      en: "JSON documents describe their fields with keys, which is semi-structured data."
      fr: "Les documents JSON décrivent leurs champs avec des clés : ce sont des données semi-structurées."
    d:
      en: "XML messages describe their content with tags, which is semi-structured data."
      fr: "Les messages XML décrivent leur contenu avec des balises : ce sont des données semi-structurées."
references:
  - title: Characteristics
    url: https://docs.aws.amazon.com/wellarchitected/latest/analytics-lens/characteristics.html
