id: deac01-1c-emr-auto-terminate
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Data engineers at a logistics company launch Amazon EMR on EC2 clusters with release 7.x to run Spark steps at irregular times. The engineers often forget to terminate the clusters, which then stay idle overnight. The company wants each cluster to shut down automatically after it has been idle for 1 hour, without writing or maintaining custom code.

    Which solution will meet these requirements?
  fr: |
    Les ingénieurs de données d'une entreprise de logistique lancent des clusters Amazon EMR on EC2 en version 7.x pour exécuter des étapes Spark à des moments irréguliers. Les ingénieurs oublient souvent de résilier les clusters, qui restent alors inactifs toute la nuit. L'entreprise veut que chaque cluster s'arrête automatiquement après 1 heure d'inactivité, sans écrire ni maintenir de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an auto-termination policy with an idle timeout of 3,600 seconds to each cluster.", fr: "Associer à chaque cluster une politique de résiliation automatique avec un délai d'inactivité de 3 600 secondes." } }
    - { id: b, text: { en: "Turn on EMR managed scaling with a minimum of one core node for each cluster.", fr: "Activer la mise à l'échelle gérée EMR avec un minimum d'un nœud principal (core) pour chaque cluster." } }
    - { id: c, text: { en: "Turn on termination protection for each cluster.", fr: "Activer la protection contre la résiliation pour chaque cluster." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the IsIdle metric that invokes a Lambda function to terminate the cluster.", fr: "Créer une alarme CloudWatch sur la métrique IsIdle qui appelle une fonction Lambda pour résilier le cluster." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An auto-termination policy terminates an EMR cluster after it has been idle for the specified timeout, from 1 minute to 7 days. With release 6.4.0 and later, EMR considers activity such as running YARN applications and pending steps, so no custom code is needed."
    fr: "Une politique de résiliation automatique résilie un cluster EMR après le délai d'inactivité défini, de 1 minute à 7 jours. À partir de la version 6.4.0, EMR tient compte d'activités comme les applications YARN en cours et les étapes en attente : aucun code personnalisé n'est nécessaire."
  options:
    b:
      en: "Managed scaling resizes a running cluster between limits; the cluster keeps running and billing while it is idle."
      fr: "La mise à l'échelle gérée redimensionne un cluster en cours d'exécution entre des limites ; le cluster continue de fonctionner et d'être facturé lorsqu'il est inactif."
    c:
      en: "Termination protection prevents the cluster from being terminated, which is the opposite of the requirement."
      fr: "La protection contre la résiliation empêche la résiliation du cluster, ce qui est l'inverse de l'exigence."
    d:
      en: "This works but requires writing and maintaining a Lambda function, which the requirements forbid."
      fr: "Cela fonctionne, mais exige d'écrire et de maintenir une fonction Lambda, ce que les exigences interdisent."
references:
  - title: Using an auto-termination policy for Amazon EMR cluster cleanup
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-auto-termination-policy.html
