id: deac01-1c-copy-load-errors-serverless
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A COPY command that loads CSV files from Amazon S3 into an Amazon Redshift Serverless workgroup fails with an error that says that the load into the table failed. A data engineer must find the file name, line number, column and reason of each rejected row.

    Which system view should the data engineer query?
  fr: |
    Une commande COPY qui charge des fichiers CSV d'Amazon S3 dans un groupe de travail Amazon Redshift Serverless échoue avec une erreur indiquant que le chargement dans la table a échoué. Un ingénieur de données doit trouver le nom de fichier, le numéro de ligne, la colonne et la raison de chaque ligne rejetée.

    Quelle vue système l'ingénieur de données doit-il interroger ?
body:
  options:
    - { id: a, text: "STL_LOAD_ERRORS" }
    - { id: b, text: "SVV_TABLE_INFO" }
    - { id: c, text: "SYS_SERVERLESS_USAGE" }
    - { id: d, text: "SYS_LOAD_ERROR_DETAIL" }
answer: { optionId: d }
explanation:
  correct:
    en: "SYS_LOAD_ERROR_DETAIL is the SYS monitoring view for load errors, and it covers provisioned clusters, concurrency scaling clusters and serverless namespaces. It shows the details of each rejected row, such as the file, the line, the column and the error."
    fr: "SYS_LOAD_ERROR_DETAIL est la vue de surveillance SYS des erreurs de chargement, et elle couvre les clusters provisionnés, les clusters de mise à l'échelle de la simultanéité et les espaces de noms sans serveur. Elle donne le détail de chaque ligne rejetée, comme le fichier, la ligne, la colonne et l'erreur."
  options:
    a:
      en: "STL_LOAD_ERRORS contains only queries run on main provisioned clusters, not on serverless namespaces."
      fr: "STL_LOAD_ERRORS ne contient que les requêtes exécutées sur les clusters provisionnés principaux, pas sur les espaces de noms sans serveur."
    b:
      en: "SVV_TABLE_INFO describes tables (size, distribution, sort keys); it does not record load errors."
      fr: "SVV_TABLE_INFO décrit les tables (taille, distribution, clés de tri) ; elle n'enregistre pas les erreurs de chargement."
    c:
      en: "SYS_SERVERLESS_USAGE reports the compute capacity used and charged; it has no row-level load errors."
      fr: "SYS_SERVERLESS_USAGE indique la capacité de calcul utilisée et facturée ; elle ne contient aucune erreur de chargement par ligne."
references:
  - title: STL_LOAD_ERRORS
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_STL_LOAD_ERRORS.html
