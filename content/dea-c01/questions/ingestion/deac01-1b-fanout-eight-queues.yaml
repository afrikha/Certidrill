id: deac01-1b-fanout-eight-queues
objective: "1.1.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A data platform team emits a batch-completed event each time an ingestion job finishes. Eight downstream teams each own an Amazon SQS queue, and every queue must receive a copy of every batch-completed event. The teams want a managed, serverless delivery mechanism.

    Which solutions will meet these requirements? (Choose two.)
  fr: |
    Une équipe de plateforme de données émet un événement batch-completed chaque fois qu'une tâche d'ingestion se termine. Huit équipes en aval possèdent chacune une file d'attente Amazon SQS, et chaque file doit recevoir une copie de chaque événement batch-completed. Les équipes veulent un mécanisme de livraison géré et sans serveur.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create one EventBridge rule for the event and add the eight queues as targets of that rule.", fr: "Créer une règle EventBridge pour l'événement et ajouter les huit files comme cibles de cette règle." } }
    - { id: b, text: { en: "Send the event to one SQS standard queue and give the eight teams permission to poll it.", fr: "Envoyer l'événement dans une file SQS standard et autoriser les huit équipes à l'interroger." } }
    - { id: c, text: { en: "Publish the event to an SNS standard topic and subscribe the eight queues to the topic.", fr: "Publier l'événement dans une rubrique SNS standard et abonner les huit files à la rubrique." } }
    - { id: d, text: { en: "Write the event to a DynamoDB table and attach eight Lambda functions to its stream, one per queue.", fr: "Écrire l'événement dans une table DynamoDB et attacher huit fonctions Lambda à son flux, une par file." } }
    - { id: e, text: { en: "Create two EventBridge rules with the same event pattern, and add four of the queues as targets of each rule.", fr: "Créer deux règles EventBridge avec le même modèle d'événement, et ajouter quatre des files comme cibles de chaque règle." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "An SNS topic delivers a copy of each message to every subscribed queue. EventBridge also fans out, but a rule can have at most 5 targets, a quota that cannot be raised; two rules that match the same pattern with four targets each deliver the event to all eight queues."
    fr: "Une rubrique SNS livre une copie de chaque message à chaque file abonnée. EventBridge diffuse aussi, mais une règle peut avoir au plus 5 cibles, un quota non ajustable ; deux règles qui correspondent au même modèle avec quatre cibles chacune livrent l'événement aux huit files."
  options:
    a:
      en: "An EventBridge rule accepts at most 5 targets, so it cannot target eight queues."
      fr: "Une règle EventBridge accepte au plus 5 cibles : elle ne peut pas cibler huit files."
    b:
      en: "A message in a queue is consumed by one reader and then deleted, so the teams would split the events instead of each getting a copy."
      fr: "Un message d'une file est consommé par un lecteur puis supprimé : les équipes se partageraient les événements au lieu d'en recevoir chacune une copie."
    d:
      en: "AWS advises no more than two processes reading the same DynamoDB stream shard at a time; eight readers can be throttled, and the design adds a table and eight functions."
      fr: "AWS recommande au plus deux processus lisant simultanément la même partition d'un flux DynamoDB ; huit lecteurs peuvent être limités, et la conception ajoute une table et huit fonctions."
references:
  - title: Amazon EventBridge quotas
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-quota.html
  - title: Change data capture for DynamoDB Streams
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html
