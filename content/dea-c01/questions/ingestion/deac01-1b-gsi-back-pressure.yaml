id: deac01-1b-gsi-back-pressure
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An ingestion service writes events to an Amazon DynamoDB table in provisioned capacity mode. The table has 5,000 write capacity units and consumes about 1,500. A global secondary index on the event status attribute has 200 write capacity units, and its consumed write capacity stays at that limit. Writes to the base table are throttled during every ingestion peak.

    Which solution will resolve the throttling?
  fr: |
    Un service d'ingestion écrit des événements dans une table Amazon DynamoDB en mode de capacité provisionnée. La table dispose de 5 000 unités de capacité d'écriture et en consomme environ 1 500. Un index secondaire global sur l'attribut de statut de l'événement dispose de 200 unités de capacité d'écriture, et sa capacité d'écriture consommée reste à cette limite. Les écritures dans la table de base sont limitées à chaque pic d'ingestion.

    Quelle solution résout la limitation ?
body:
  options:
    - id: a
      text: { en: "Increase the provisioned write capacity of the base table to 10,000 units.", fr: "Augmenter la capacité d'écriture provisionnée de la table de base à 10 000 unités." }
    - id: b
      text: { en: "Increase the provisioned write capacity of the global secondary index or turn on auto scaling for it.", fr: "Augmenter la capacité d'écriture provisionnée de l'index secondaire global ou activer la mise à l'échelle automatique pour celui-ci." }
    - id: c
      text: { en: "Turn on DynamoDB Streams on the table so that index updates are processed asynchronously.", fr: "Activer DynamoDB Streams sur la table pour que les mises à jour de l'index soient traitées de façon asynchrone." }
    - id: d
      text: { en: "Change the reads of the index to strongly consistent reads.", fr: "Passer les lectures de l'index en lectures fortement cohérentes." }
answer: { optionId: b }
explanation:
  correct:
    en: "Every base table write that changes an indexed attribute must also be written to the global secondary index. When the index does not have enough write capacity, DynamoDB throttles writes to the base table to keep the data consistent, which is called GSI back-pressure, so the index needs more write capacity."
    fr: "Chaque écriture dans la table de base qui modifie un attribut indexé doit aussi être écrite dans l'index secondaire global. Lorsque l'index n'a pas assez de capacité d'écriture, DynamoDB limite les écritures dans la table de base pour garder les données cohérentes (back-pressure de GSI) : l'index a donc besoin de plus de capacité d'écriture."
  options:
    a:
      en: "The base table already has unused capacity; the bottleneck is the capacity of the index."
      fr: "La table de base a déjà de la capacité inutilisée ; le goulot d'étranglement est la capacité de l'index."
    c:
      en: "DynamoDB Streams captures item changes for consumers; it does not change how DynamoDB maintains a global secondary index."
      fr: "DynamoDB Streams capture les modifications d'éléments pour des consommateurs ; il ne change pas la manière dont DynamoDB maintient un index secondaire global."
    d:
      en: "Global secondary indexes do not support strongly consistent reads, and reads do not cause write throttling."
      fr: "Les index secondaires globaux ne prennent pas en charge les lectures fortement cohérentes, et les lectures ne provoquent pas de limitation des écritures."
references:
  - title: Understanding Global Secondary Index (GSI) write throttling and back pressure in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/gsi-throttling.html
