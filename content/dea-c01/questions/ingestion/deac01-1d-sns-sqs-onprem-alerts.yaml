id: deac01-1d-sns-sqs-onprem-alerts
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's data pipeline must send failure alerts to two destinations: the on-call engineers by email, and an on-premises ticketing system. The ticketing system can make only outbound HTTPS calls and does not accept inbound connections. It is sometimes offline for maintenance for up to two days, and no alert can be lost during that time.

    Which solution will meet these requirements?
  fr: |
    Le pipeline de données d'une entreprise doit envoyer des alertes d'échec à deux destinations : les ingénieurs d'astreinte par e-mail, et un système de tickets sur site. Le système de tickets ne peut effectuer que des appels HTTPS sortants et n'accepte aucune connexion entrante. Il est parfois hors ligne pour maintenance pendant deux jours au plus, et aucune alerte ne doit être perdue pendant ce temps.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Publish the alerts to an SNS topic that has an email subscription and an SQS queue subscription, and make the ticketing system poll the queue.", fr: "Publier les alertes dans une rubrique SNS dotée d'un abonnement par e-mail et d'un abonnement de file d'attente SQS, et faire interroger la file par le système de tickets." } }
    - { id: b, text: { en: "Publish the alerts to an SNS topic that has an email subscription and an HTTPS subscription to the ticketing system.", fr: "Publier les alertes dans une rubrique SNS dotée d'un abonnement par e-mail et d'un abonnement HTTPS vers le système de tickets." } }
    - { id: c, text: { en: "Publish the alerts to an SNS topic that has an email subscription and a Lambda subscription that calls the ticketing system API.", fr: "Publier les alertes dans une rubrique SNS dotée d'un abonnement par e-mail et d'un abonnement Lambda qui appelle l'API du système de tickets." } }
    - { id: d, text: { en: "Send the alerts to an SQS queue that both the ticketing system and the on-call engineers poll.", fr: "Envoyer les alertes dans une file d'attente SQS que le système de tickets et les ingénieurs d'astreinte interrogent tous les deux." } }
answer: { optionId: a }
explanation:
  correct:
    en: "SNS pushes each alert to all subscribers, including email. The SQS subscription stores the alerts until the ticketing system polls the queue with outbound HTTPS calls, and the default retention of 4 days (configurable up to 14 days) covers a two-day maintenance window."
    fr: "SNS pousse chaque alerte vers tous les abonnés, y compris l'e-mail. L'abonnement SQS conserve les alertes jusqu'à ce que le système de tickets interroge la file par des appels HTTPS sortants, et la conservation par défaut de 4 jours (configurable jusqu'à 14 jours) couvre une maintenance de deux jours."
  options:
    b: { en: "An HTTPS subscription pushes messages to the endpoint, which requires inbound connections that the ticketing system does not accept.", fr: "Un abonnement HTTPS pousse les messages vers le point de terminaison, ce qui exige des connexions entrantes que le système de tickets n'accepte pas." }
    c: { en: "The Lambda function would also have to open an inbound connection to the on-premises system, and its calls fail while the system is offline.", fr: "La fonction Lambda devrait elle aussi ouvrir une connexion entrante vers le système sur site, et ses appels échouent tant que le système est hors ligne." }
    d: { en: "A message read and deleted by one consumer is not delivered to the other, and engineers would have to poll a queue instead of receiving an email.", fr: "Un message lu et supprimé par un consommateur n'est pas livré à l'autre, et les ingénieurs devraient interroger une file au lieu de recevoir un e-mail." }
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
  - title: Amazon SQS message quotas
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
