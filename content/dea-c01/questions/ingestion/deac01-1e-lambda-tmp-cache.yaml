id: deac01-1e-lambda-tmp-cache
objective: "1.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function that is not connected to a VPC enriches records with a 1.5 GB reference file. The handler downloads the file from Amazon S3 at the start of every invocation, and the function runs thousands of times each hour. The file is replaced once a week, and a copy up to one day old is acceptable. The company wants to reduce latency and S3 requests with the LEAST effort, without connecting the function to a VPC.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda qui n'est pas connectée à un VPC enrichit des enregistrements avec un fichier de référence de 1,5 Go. Le gestionnaire télécharge le fichier depuis Amazon S3 au début de chaque appel, et la fonction s'exécute des milliers de fois par heure. Le fichier est remplacé une fois par semaine, et une copie datant d'au plus un jour est acceptable. L'entreprise veut réduire la latence et les requêtes S3 avec le MOINS d'effort, sans connecter la fonction à un VPC.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Package the reference file in a Lambda layer, and publish a new layer version every week.", fr: "Empaqueter le fichier de référence dans une couche Lambda, et publier une nouvelle version de couche chaque semaine." } }
    - { id: b, text: { en: "Set ephemeral storage to 2,048 MB, and download the file to /tmp only when it is missing or older than one day.", fr: "Définir le stockage éphémère à 2 048 Mo, et télécharger le fichier dans /tmp uniquement s'il est absent ou date de plus d'un jour." } }
    - { id: c, text: { en: "Store the reference file on an Amazon EFS file system, and mount it in the function.", fr: "Stocker le fichier de référence sur un système de fichiers Amazon EFS, et le monter dans la fonction." } }
    - { id: d, text: { en: "Configure provisioned concurrency so that the download in the handler runs only during initialization.", fr: "Configurer la simultanéité provisionnée afin que le téléchargement dans le gestionnaire ne s'exécute qu'à l'initialisation." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The content of /tmp remains when an execution environment is frozen, so it serves as a transient cache for later invocations in the same environment; the code checks whether the cached copy exists before downloading. Ephemeral storage can be set from 512 MB to 10,240 MB, so 2,048 MB holds the file."
    fr: "Le contenu de /tmp est conservé quand un environnement d'exécution est figé : il sert donc de cache temporaire pour les appels suivants dans le même environnement, le code vérifiant si la copie en cache existe avant de télécharger. Le stockage éphémère se configure de 512 Mo à 10 240 Mo : 2 048 Mo suffisent pour le fichier."
  options:
    a:
      en: "The unzipped deployment package, layers included, is limited to 250 MB, far below 1.5 GB."
      fr: "Le package de déploiement décompressé, couches comprises, est limité à 250 Mo, bien en dessous de 1,5 Go."
    c:
      en: "A function must be connected to a VPC to mount an EFS file system, which the company does not allow."
      fr: "Une fonction doit être connectée à un VPC pour monter un système de fichiers EFS, ce que l'entreprise n'autorise pas."
    d:
      en: "Provisioned concurrency pre-initializes environments, but code inside the handler still runs on every invocation."
      fr: "La simultanéité provisionnée initialise les environnements à l'avance, mais le code du gestionnaire s'exécute toujours à chaque appel."
references:
  - title: Understanding the Lambda execution environment lifecycle
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html
  - title: Lambda quotas
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
