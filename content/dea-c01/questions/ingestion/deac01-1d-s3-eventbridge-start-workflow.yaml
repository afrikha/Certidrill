id: deac01-1d-s3-eventbridge-start-workflow
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A healthcare analytics company must start an AWS Step Functions workflow each time a partner uploads a file under the incoming/ prefix of an Amazon S3 bucket. The bucket already sends S3 Event Notifications for another prefix to a Lambda function, which must keep working. The company does not want to write or run code to start the workflow.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise d'analyse de données de santé doit démarrer un flux de travail AWS Step Functions chaque fois qu'un partenaire charge un fichier sous le préfixe incoming/ d'un compartiment Amazon S3. Le compartiment envoie déjà des notifications S3 Event Notifications pour un autre préfixe à une fonction Lambda, qui doit continuer à fonctionner. L'entreprise ne veut ni écrire ni exécuter de code pour démarrer le flux de travail.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on the bucket setting that sends notifications to Amazon EventBridge for all events in the bucket.", fr: "Activer le paramètre du compartiment qui envoie à Amazon EventBridge les notifications de tous les événements du compartiment." } }
    - { id: b, text: { en: "Add an S3 event notification for the incoming/ prefix with the state machine ARN as the destination.", fr: "Ajouter une notification d'événement S3 pour le préfixe incoming/ avec l'ARN de la machine d'état comme destination." } }
    - { id: c, text: { en: "Add an S3 event notification that sends the events to an SQS queue, and configure the state machine to poll the queue.", fr: "Ajouter une notification d'événement S3 qui envoie les événements à une file d'attente SQS, et configurer la machine d'état pour qu'elle interroge la file." } }
    - { id: d, text: { en: "Configure a daily S3 Inventory report on the bucket and start the workflow when the report is delivered.", fr: "Configurer un rapport S3 Inventory quotidien sur le compartiment et démarrer le flux de travail à la livraison du rapport." } }
    - { id: e, text: { en: "Create an EventBridge rule that matches Object Created events for the bucket with a key prefix of incoming/, with the state machine as the target and a role that allows states:StartExecution.", fr: "Créer une règle EventBridge qui correspond aux événements Object Created du compartiment avec le préfixe de clé incoming/, avec la machine d'état comme cible et un rôle qui autorise states:StartExecution." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Once EventBridge is enabled on the bucket, S3 sends all its events, such as Object Created, to the default event bus, in addition to the existing event notifications. An EventBridge rule can filter on the bucket name and the key prefix and start the state machine directly, using an IAM role that allows states:StartExecution.
    fr: |
      Une fois EventBridge activé sur le compartiment, S3 envoie tous ses événements, comme Object Created, au bus d'événements par défaut, en plus des notifications existantes. Une règle EventBridge peut filtrer sur le nom du compartiment et le préfixe de clé et démarrer directement la machine d'état, à l'aide d'un rôle IAM qui autorise states:StartExecution.
  options:
    b: { en: "S3 Event Notifications support SNS topics, SQS queues, Lambda functions, and EventBridge as destinations, not Step Functions state machines.", fr: "Les notifications S3 Event Notifications prennent en charge comme destinations les rubriques SNS, les files d'attente SQS, les fonctions Lambda et EventBridge, pas les machines d'état Step Functions." }
    c: { en: "A state machine cannot poll an SQS queue to start itself; a consumer would have to be written to read the queue and start executions.", fr: "Une machine d'état ne peut pas interroger une file d'attente SQS pour se démarrer elle-même ; il faudrait écrire un consommateur qui lise la file et démarre les exécutions." }
    d: { en: "An inventory report is produced daily or weekly, so the workflow would not start for each uploaded file.", fr: "Un rapport d'inventaire est produit chaque jour ou chaque semaine : le flux de travail ne démarrerait pas pour chaque fichier chargé." }
references:
  - title: Enabling Amazon EventBridge
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/enable-event-notifications-eventbridge.html
  - title: Using EventBridge
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
