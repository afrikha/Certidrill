id: deac01-1b-apigw-usage-plan
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company exposes an Amazon API Gateway REST API that partners call to push inventory records into an ingestion pipeline. Partners already authenticate with IAM. One partner recently sent a burst of requests that slowed the pipeline for all partners. Each partner must get its own request rate limit and its own monthly request quota.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose une API REST Amazon API Gateway que des partenaires appellent pour envoyer des enregistrements d'inventaire dans un pipeline d'ingestion. Les partenaires s'authentifient déjà avec IAM. Un partenaire a récemment envoyé une rafale de requêtes qui a ralenti le pipeline pour tous les partenaires. Chaque partenaire doit avoir sa propre limite de débit de requêtes et son propre quota mensuel de requêtes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set method-level throttling on the API stage to the rate allowed for one partner.", fr: "Définir une limitation au niveau des méthodes de l'étape de l'API au débit autorisé pour un partenaire." }
    - id: b
      text: { en: "Set reserved concurrency on the Lambda function behind the API to the rate allowed for one partner.", fr: "Définir une simultanéité réservée sur la fonction Lambda derrière l'API au débit autorisé pour un partenaire." }
    - id: c
      text: { en: "Add an AWS WAF rate-based rule to the stage that limits requests from each source IP address.", fr: "Ajouter à l'étape une règle AWS WAF basée sur le débit qui limite les requêtes de chaque adresse IP source." }
    - id: d
      text: { en: "Create usage plans with throttling and quota limits, and associate an API key for each partner with a plan.", fr: "Créer des plans d'utilisation avec des limites de limitation et de quota, et associer une clé d'API par partenaire à un plan." }
answer: { optionId: d }
explanation:
  correct:
    en: "A usage plan sets a throttling limit and a quota limit that apply to the requests of each API key. Giving each partner an API key in a usage plan gives each partner its own rate and monthly quota; the API keys identify the clients, while IAM still handles authentication."
    fr: "Un plan d'utilisation définit une limite de limitation et une limite de quota qui s'appliquent aux requêtes de chaque clé d'API. Donner à chaque partenaire une clé d'API dans un plan d'utilisation lui donne son propre débit et son propre quota mensuel ; les clés d'API identifient les clients, tandis qu'IAM gère toujours l'authentification."
  options:
    a:
      en: "Stage and method throttling applies to all callers together, so one partner can still use up the shared rate, and it sets no monthly quota."
      fr: "La limitation de l'étape et des méthodes s'applique à tous les appelants ensemble : un partenaire peut toujours épuiser le débit partagé, et aucun quota mensuel n'est défini."
    b:
      en: "Reserved concurrency limits the function for all partners at once and does not give each partner a rate or a quota."
      fr: "La simultanéité réservée limite la fonction pour tous les partenaires à la fois et ne donne à chaque partenaire ni débit ni quota."
    c:
      en: "A rate-based rule limits requests per IP address over a short window; it does not identify partners that share or change addresses and sets no monthly quota."
      fr: "Une règle basée sur le débit limite les requêtes par adresse IP sur une courte fenêtre ; elle n'identifie pas les partenaires qui partagent ou changent d'adresse et ne définit aucun quota mensuel."
references:
  - title: Usage plans and API keys for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
  - title: Throttle requests to your REST APIs for better throughput in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
