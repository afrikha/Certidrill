id: deac01-1e-dsa-hll-sketches
objective: "1.4.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon Redshift table contains billions of app events with a user_id column. A dashboard must show the number of distinct users for any date range that an analyst selects, from one day to one year. Running COUNT(DISTINCT user_id) on the raw events for each range is too slow. An average relative error below 1 % is acceptable, and a nightly job can precompute data for each day.

    Which solution will meet these requirements?
  fr: |
    Une table Amazon Redshift contient des milliards d'événements applicatifs avec une colonne user_id. Un tableau de bord doit afficher le nombre d'utilisateurs distincts pour toute plage de dates choisie par un analyste, d'un jour à un an. Exécuter COUNT(DISTINCT user_id) sur les événements bruts pour chaque plage est trop lent. Une erreur relative moyenne inférieure à 1 % est acceptable, et une tâche nocturne peut précalculer des données pour chaque jour.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store one HyperLogLog sketch of user_id per day in an HLLSKETCH column, and combine the sketches of the selected days to get the cardinality.", fr: "Stocker un sketch HyperLogLog de user_id par jour dans une colonne HLLSKETCH, et combiner les sketches des jours sélectionnés pour obtenir la cardinalité." } }
    - { id: b, text: { en: "Store the exact COUNT(DISTINCT user_id) of each day in a summary table, and sum the daily values of the selected days.", fr: "Stocker le COUNT(DISTINCT user_id) exact de chaque jour dans une table de synthèse, et additionner les valeurs quotidiennes des jours sélectionnés." } }
    - { id: c, text: { en: "Store the exact COUNT(DISTINCT user_id) of each day in a summary table, and return the largest daily value of the selected days.", fr: "Stocker le COUNT(DISTINCT user_id) exact de chaque jour dans une table de synthèse, et renvoyer la plus grande valeur quotidienne des jours sélectionnés." } }
    - { id: d, text: { en: "Add user_id as the sort key of the events table, and keep running COUNT(DISTINCT user_id) on the raw events for each range.", fr: "Ajouter user_id comme clé de tri de la table des événements, et continuer d'exécuter COUNT(DISTINCT user_id) sur les événements bruts pour chaque plage." } }
answer: { optionId: a }
explanation:
  correct:
    en: "HyperLogLog is an algorithm that estimates the number of distinct values, with an average relative error between 0.01 % and 0.6 % in Redshift. Sketches stored in HLLSKETCH columns can be combined, so the daily sketches of any range merge into one estimate without reading the raw events again."
    fr: "HyperLogLog est un algorithme qui estime le nombre de valeurs distinctes, avec une erreur relative moyenne comprise entre 0,01 % et 0,6 % dans Redshift. Les sketches stockés dans des colonnes HLLSKETCH peuvent être combinés : les sketches quotidiens de toute plage fusionnent en une seule estimation sans relire les événements bruts."
  options:
    b:
      en: "Distinct counts are not additive: a user who is active on several days is counted once per day."
      fr: "Les comptages distincts ne sont pas additifs : un utilisateur actif plusieurs jours est compté une fois par jour."
    c:
      en: "The largest daily value misses every user who was not active on that particular day."
      fr: "La plus grande valeur quotidienne omet tous les utilisateurs qui n'étaient pas actifs ce jour-là."
    d:
      en: "Sorting may help a little, but each range still reads the raw events, which is the slow part."
      fr: "Le tri peut aider un peu, mais chaque plage lit toujours les événements bruts, ce qui est la partie lente."
references:
  - title: HyperLogLog sketches
    url: https://docs.aws.amazon.com/redshift/latest/dg/hyperloglog-overview.html
