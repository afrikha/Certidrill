id: deac01-1d-spark-broadcast-small-table
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An advertising company runs a nightly Spark job that joins a 3 TB clicks DataFrame with a 20 MB campaigns DataFrame on campaign_id. The physical plan shows a sort-merge join, and the Spark UI shows that most of the runtime is spent shuffling the clicks data across the cluster. Each executor has enough memory to hold the campaigns data.

    Which code change will reduce the runtime of the join?
  fr: |
    Une entreprise publicitaire exécute chaque nuit une tâche Spark qui joint un DataFrame de clics de 3 To à un DataFrame de campagnes de 20 Mo sur campaign_id. Le plan physique montre une jointure sort-merge, et l'interface Spark UI montre que l'essentiel du temps d'exécution est passé à redistribuer (shuffle) les données de clics dans le cluster. Chaque exécuteur dispose de suffisamment de mémoire pour contenir les données de campagnes.

    Quelle modification du code réduira le temps d'exécution de la jointure ?
body:
  options:
    - { id: a, text: { en: "Call persist() on the clicks DataFrame before the join.", fr: "Appeler persist() sur le DataFrame de clics avant la jointure." } }
    - { id: b, text: { en: "Increase spark.sql.shuffle.partitions to 20000 before the join.", fr: "Porter spark.sql.shuffle.partitions à 20000 avant la jointure." } }
    - { id: c, text: { en: "Wrap the campaigns DataFrame in the broadcast() hint in the join.", fr: "Encapsuler le DataFrame de campagnes dans l'indication broadcast() de la jointure." } }
    - { id: d, text: { en: "Call repartition(1) on both DataFrames before the join so that matching keys are in the same partition.", fr: "Appeler repartition(1) sur les deux DataFrames avant la jointure pour que les clés correspondantes se trouvent dans la même partition." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A broadcast hash join copies the small table to every executor, so the large table is joined where it already is and is not shuffled. AWS recommends it when one side of the join fits in the memory of a single executor, as the 20 MB campaigns data does."
    fr: "Une jointure par hachage diffusée (broadcast hash join) copie la petite table sur chaque exécuteur : la grande table est jointe là où elle se trouve déjà et n'est pas redistribuée. AWS la recommande lorsqu'un côté de la jointure tient dans la mémoire d'un seul exécuteur, comme les 20 Mo de données de campagnes."
  options:
    a: { en: "Caching helps when a DataFrame is reused by several actions; the sort-merge join still shuffles all 3 TB.", fr: "La mise en cache aide lorsqu'un DataFrame est réutilisé par plusieurs actions ; la jointure sort-merge redistribue toujours les 3 To." }
    b: { en: "More shuffle partitions split the same shuffle into more tasks; the 3 TB still move across the network.", fr: "Davantage de partitions de shuffle découpent la même redistribution en plus de tâches ; les 3 To transitent toujours par le réseau." }
    d: { en: "A single partition forces all data through one task and still requires a full shuffle.", fr: "Une seule partition fait passer toutes les données par une seule tâche et exige toujours une redistribution complète." }
references:
  - title: Optimize shuffles
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/tuning-aws-glue-for-apache-spark/optimize-shuffles.html
