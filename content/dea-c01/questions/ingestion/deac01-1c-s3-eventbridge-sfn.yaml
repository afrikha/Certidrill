id: deac01-1c-s3-eventbridge-sfn
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company must start an AWS Step Functions state machine each time a file with the `.csv` suffix is uploaded under the `incoming/` prefix of an Amazon S3 bucket. Other objects in the bucket must not start the workflow. The company wants an event-driven solution without custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique doit démarrer une machine d'état AWS Step Functions chaque fois qu'un fichier avec le suffixe `.csv` est chargé sous le préfixe `incoming/` d'un compartiment Amazon S3. Les autres objets du compartiment ne doivent pas démarrer le flux de travail. L'entreprise veut une solution pilotée par les événements, sans code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on EventBridge notifications for the bucket and add a rule that matches Object Created events by key prefix and suffix and targets the state machine.", fr: "Activer les notifications EventBridge du compartiment et ajouter une règle qui filtre les événements Object Created par préfixe et suffixe de clé et cible la machine d'état." } }
    - { id: b, text: { en: "Create an S3 event notification for object creation events with prefix and suffix filters and the state machine ARN as the destination.", fr: "Créer une notification d'événement S3 pour la création d'objets avec des filtres de préfixe et de suffixe et l'ARN de la machine d'état comme destination." } }
    - { id: c, text: { en: "Create an EventBridge Scheduler schedule that starts the state machine every 5 minutes to look for new files.", fr: "Créer une planification EventBridge Scheduler qui démarre la machine d'état toutes les 5 minutes pour rechercher de nouveaux fichiers." } }
    - { id: d, text: { en: "Create a Lambda function that lists the prefix every minute and starts an execution for each new file.", fr: "Créer une fonction Lambda qui liste le préfixe chaque minute et démarre une exécution pour chaque nouveau fichier." } }
answer: { optionId: a }
explanation:
  correct:
    en: "When EventBridge is enabled on a bucket, Amazon S3 sends all its events, such as Object Created, to EventBridge. A rule with an event pattern on the bucket name and the object key prefix and suffix routes only the matching events to the state machine target, with no code."
    fr: "Lorsque EventBridge est activé sur un compartiment, Amazon S3 envoie tous ses événements, comme Object Created, à EventBridge. Une règle dont le modèle d'événement porte sur le nom du compartiment ainsi que sur le préfixe et le suffixe de la clé d'objet ne route que les événements correspondants vers la cible machine d'état, sans code."
  options:
    b:
      en: "S3 event notifications support only SNS topics, SQS queues, Lambda functions and EventBridge as destinations, not Step Functions."
      fr: "Les notifications d'événements S3 ne prennent en charge comme destinations que des rubriques SNS, des files d'attente SQS, des fonctions Lambda et EventBridge, pas Step Functions."
    c:
      en: "A schedule is not event-driven, starts executions even when no file arrives, and needs logic to find the new files."
      fr: "Une planification n'est pas pilotée par les événements, démarre des exécutions même sans nouveau fichier et exige une logique pour trouver les nouveaux fichiers."
    d:
      en: "A polling function is custom code and is not event-driven."
      fr: "Une fonction d'interrogation est du code personnalisé et n'est pas pilotée par les événements."
references:
  - title: Using EventBridge
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
  - title: Event notification types and destinations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-event-types-and-destinations.html
