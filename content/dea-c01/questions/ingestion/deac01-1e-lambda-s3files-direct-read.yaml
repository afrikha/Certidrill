id: deac01-1e-lambda-s3files-direct-read
objective: "1.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function with 256 MB of memory mounts an Amazon S3 Files file system and reads large Parquet files of several gigabytes sequentially. The file system configuration of the function uses the default settings. Read throughput is lower than expected, and all reads go through the high-performance storage of the file system. The team wants large reads to be streamed directly from the S3 bucket without increasing the memory of the function.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda dotée de 256 Mo de mémoire monte un système de fichiers Amazon S3 Files et lit séquentiellement de gros fichiers Parquet de plusieurs gigaoctets. La configuration du système de fichiers de la fonction utilise les paramètres par défaut. Le débit de lecture est plus faible que prévu, et toutes les lectures passent par le stockage haute performance du système de fichiers. L'équipe veut que les lectures volumineuses soient diffusées directement depuis le compartiment S3 sans augmenter la mémoire de la fonction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set DirectS3Read to AUTO in the file system configuration of the function.", fr: "Définir DirectS3Read sur AUTO dans la configuration du système de fichiers de la fonction." } }
    - { id: b, text: { en: "Set the ephemeral storage of the function to 10,240 MB.", fr: "Définir le stockage éphémère de la fonction à 10 240 Mo." } }
    - { id: c, text: { en: "Set DirectS3Read to ENABLED, and allow s3:GetObject and s3:GetObjectVersion on the bucket in the execution role.", fr: "Définir DirectS3Read sur ENABLED, et autoriser s3:GetObject et s3:GetObjectVersion sur le compartiment dans le rôle d'exécution." } }
    - { id: d, text: { en: "Copy the files to an Amazon EFS file system that uses the Max I/O performance mode, and mount it instead.", fr: "Copier les fichiers sur un système de fichiers Amazon EFS en mode de performance Max I/O, et le monter à la place." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Direct reads stream large reads straight from the bucket. The default value, AUTO, enables them only for functions with 512 MB of memory or more, so a 256 MB function needs ENABLED. The execution role must allow s3:GetObject and s3:GetObjectVersion for direct reads."
    fr: "Les lectures directes diffusent les lectures volumineuses directement depuis le compartiment. La valeur par défaut, AUTO, ne les active que pour les fonctions de 512 Mo de mémoire ou plus : une fonction de 256 Mo a donc besoin d'ENABLED. Le rôle d'exécution doit autoriser s3:GetObject et s3:GetObjectVersion pour les lectures directes."
  options:
    a:
      en: "AUTO is already the default and does not enable direct reads below 512 MB of memory."
      fr: "AUTO est déjà la valeur par défaut et n'active pas les lectures directes en dessous de 512 Mo de mémoire."
    b:
      en: "Ephemeral storage sizes /tmp; it does not change how the mounted file system serves reads."
      fr: "Le stockage éphémère dimensionne /tmp ; il ne change pas la façon dont le système de fichiers monté sert les lectures."
    d:
      en: "This copies the data out of S3 and still does not stream the reads from the bucket."
      fr: "Cette solution copie les données hors de S3 et ne diffuse toujours pas les lectures depuis le compartiment."
references:
  - title: Configuring Amazon S3 Files access
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-filesystem-s3files.html
