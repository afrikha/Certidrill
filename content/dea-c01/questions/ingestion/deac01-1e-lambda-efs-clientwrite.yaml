id: deac01-1e-lambda-efs-clientwrite
objective: "1.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function mounts an Amazon EFS file system through an access point to stage intermediate files of an ingestion job. The file system has a file system policy that requires IAM authorization. The function reads existing files successfully, but every write fails with an access denied error. The access point's POSIX user owns the directory, which has 755 permissions. The execution role has a policy that allows only elasticfilesystem:ClientMount.

    Which change will resolve the issue?
  fr: |
    Une fonction AWS Lambda monte un système de fichiers Amazon EFS par un point d'accès pour préparer les fichiers intermédiaires d'une tâche d'ingestion. Le système de fichiers a une politique de système de fichiers qui exige une autorisation IAM. La fonction lit sans problème les fichiers existants, mais chaque écriture échoue avec une erreur d'accès refusé. L'utilisateur POSIX du point d'accès est propriétaire du répertoire, dont les autorisations sont 755. Le rôle d'exécution a une politique qui autorise uniquement elasticfilesystem:ClientMount.

    Quelle modification résout le problème ?
body:
  options:
    - { id: a, text: { en: "Change the local mount path of the function from /mnt/efs to /tmp/efs.", fr: "Remplacer le chemin de montage local de la fonction /mnt/efs par /tmp/efs." } }
    - { id: b, text: { en: "Allow inbound TCP port 2049 on the security group of the mount targets from the function's security group.", fr: "Autoriser le port TCP 2049 en entrée sur le groupe de sécurité des cibles de montage depuis le groupe de sécurité de la fonction." } }
    - { id: c, text: { en: "Change the performance mode of the file system from General Purpose to Max I/O.", fr: "Passer le mode de performance du système de fichiers de General Purpose à Max I/O." } }
    - { id: d, text: { en: "Add the elasticfilesystem:ClientWrite action to the execution role of the function.", fr: "Ajouter l'action elasticfilesystem:ClientWrite au rôle d'exécution de la fonction." } }
answer: { optionId: d }
explanation:
  correct:
    en: "When a file system has a user-configured IAM policy, the execution role needs elasticfilesystem:ClientMount to mount and elasticfilesystem:ClientWrite to write; ClientMount alone gives a read-only connection. The AmazonElasticFileSystemClientReadWriteAccess managed policy includes both actions and can be attached instead."
    fr: "Quand un système de fichiers a une politique IAM configurée par l'utilisateur, le rôle d'exécution a besoin d'elasticfilesystem:ClientMount pour monter et d'elasticfilesystem:ClientWrite pour écrire ; ClientMount seul donne une connexion en lecture seule. La politique gérée AmazonElasticFileSystemClientReadWriteAccess contient les deux actions et peut être attachée à la place."
  options:
    a:
      en: "The local mount path must start with /mnt/, and the path does not decide write permissions."
      fr: "Le chemin de montage local doit commencer par /mnt/, et le chemin ne détermine pas les autorisations d'écriture."
    b:
      en: "Reads already succeed, so NFS traffic on port 2049 is already allowed."
      fr: "Les lectures réussissent déjà : le trafic NFS sur le port 2049 est donc déjà autorisé."
    c:
      en: "The performance mode affects latency and throughput, cannot be changed after creation, and does not grant write access."
      fr: "Le mode de performance influe sur la latence et le débit, ne peut pas être modifié après la création et n'accorde pas l'accès en écriture."
references:
  - title: Configuring Amazon EFS file system access
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-filesystem-efs.html
