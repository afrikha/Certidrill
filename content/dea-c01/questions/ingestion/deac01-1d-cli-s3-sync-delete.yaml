id: deac01-1d-cli-s3-sync-delete
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Bash script on an on-premises server uploads the /data/exports directory, which contains 50,000 files, to s3://example-landing/exports/ every night with the aws s3 cp --recursive command. Only a few hundred files change each day, but the script uploads all the files every night. The prefix must also stop containing files that were deleted from the local directory.

    Which command should the script run?
  fr: |
    Un script Bash sur un serveur sur site charge chaque nuit le répertoire /data/exports, qui contient 50 000 fichiers, dans s3://example-landing/exports/ avec la commande aws s3 cp --recursive. Seuls quelques centaines de fichiers changent chaque jour, mais le script charge tous les fichiers chaque nuit. Le préfixe ne doit pas non plus conserver les fichiers supprimés du répertoire local.

    Quelle commande le script doit-il exécuter ?
body:
  options:
    - { id: a, text: "`aws s3 cp /data/exports s3://example-landing/exports/ --recursive --exclude \"*.tmp\"`" }
    - { id: b, text: "`aws s3 mv /data/exports s3://example-landing/exports/ --recursive`" }
    - { id: c, text: "`aws s3 sync /data/exports s3://example-landing/exports/`" }
    - { id: d, text: "`aws s3 sync /data/exports s3://example-landing/exports/ --delete`" }
answer: { optionId: d }
explanation:
  correct:
    en: "aws s3 sync transfers only the files that are missing at the destination, that have a different size, or whose source is newer. The --delete option removes files that exist in the destination but no longer exist in the source."
    fr: "aws s3 sync ne transfère que les fichiers absents de la destination, de taille différente ou dont la source est plus récente. L'option --delete supprime les fichiers présents dans la destination qui n'existent plus dans la source."
  options:
    a: { en: "cp --recursive copies every matching file again without comparing it with the destination, and it never deletes objects.", fr: "cp --recursive recopie chaque fichier correspondant sans le comparer à la destination, et ne supprime jamais d'objets." }
    b: { en: "mv deletes the local files after the upload and still uploads every file.", fr: "mv supprime les fichiers locaux après le chargement et charge toujours tous les fichiers." }
    c: { en: "Without --delete, sync keeps the objects whose local files were deleted.", fr: "Sans --delete, sync conserve les objets dont les fichiers locaux ont été supprimés." }
references:
  - title: sync
    url: https://docs.aws.amazon.com/cli/latest/reference/s3/sync.html
