id: deac01-1d-lambda-s3-backfill-concurrency
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    S3 Event Notifications invoke a Lambda function for each new object in a bucket, and the function loads the object into an Amazon RDS database that accepts at most 50 connections. A backfill will copy 300,000 objects into the bucket in one hour. The function must never run more than 50 concurrent executions, and any event that Lambda finally cannot process must be kept for replay instead of being discarded.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Des notifications S3 Event Notifications appellent une fonction Lambda pour chaque nouvel objet d'un compartiment, et la fonction charge l'objet dans une base de données Amazon RDS qui accepte au plus 50 connexions. Un rattrapage (backfill) va copier 300 000 objets dans le compartiment en une heure. La fonction ne doit jamais dépasser 50 exécutions simultanées, et tout événement que Lambda ne parvient finalement pas à traiter doit être conservé pour être rejoué au lieu d'être écarté.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure provisioned concurrency of 50 on the function.", fr: "Configurer une simultanéité provisionnée de 50 sur la fonction." } }
    - { id: b, text: { en: "Configure reserved concurrency of 50 on the function.", fr: "Configurer une simultanéité réservée de 50 sur la fonction." } }
    - { id: c, text: { en: "Increase the memory of the function to the maximum value.", fr: "Porter la mémoire de la fonction à la valeur maximale." } }
    - { id: d, text: { en: "Set the maximum retry attempts to 0 and the maximum event age to 60 seconds.", fr: "Définir le nombre maximal de nouvelles tentatives sur 0 et l'âge maximal des événements sur 60 secondes." } }
    - { id: e, text: { en: "Configure an Amazon SQS dead-letter queue for the function.", fr: "Configurer une file d'attente de lettres mortes Amazon SQS pour la fonction." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Reserved concurrency caps the function at 50 concurrent executions. S3 invokes the function asynchronously, so throttled events go back to the queue and Lambda retries them for up to 6 hours with increasing intervals. Events that expire or fail all attempts are discarded unless a dead-letter queue (or an on-failure destination) is configured, which keeps them for replay.
    fr: |
      La simultanéité réservée plafonne la fonction à 50 exécutions simultanées. S3 appelle la fonction de manière asynchrone : les événements limités retournent dans la file d'attente et Lambda les retente pendant 6 heures au plus avec des intervalles croissants. Les événements qui expirent ou épuisent toutes leurs tentatives sont écartés, sauf si une file d'attente de lettres mortes (ou une destination en cas d'échec) est configurée, qui les conserve pour être rejoués.
  options:
    a: { en: "Provisioned concurrency pre-initializes environments but does not stop the function from scaling beyond 50.", fr: "La simultanéité provisionnée pré-initialise des environnements, mais n'empêche pas la fonction de dépasser 50 exécutions." }
    c: { en: "More memory can shorten each invocation, but it limits neither concurrency nor lost events.", fr: "Davantage de mémoire peut raccourcir chaque appel, mais ne limite ni la simultanéité ni la perte d'événements." }
    d: { en: "These settings make Lambda discard events sooner, which is the opposite of the requirement.", fr: "Ces paramètres font écarter les événements plus tôt par Lambda, ce qui est l'inverse de l'exigence." }
references:
  - title: Configuring reserved concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html
  - title: How Lambda handles errors and retries with asynchronous invocation
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-error-handling.html
