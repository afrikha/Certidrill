id: deac01-1c-velocity-subsecond
objective: "1.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An energy company collects readings from 20,000 smart meters. Each meter sends a small record every second. A fraud detection application must evaluate each reading within 1 second of its arrival, and a second application must later read the same records to build hourly aggregates.

    Which ingestion solution will meet these requirements?
  fr: |
    Une entreprise d'énergie collecte les mesures de 20 000 compteurs intelligents. Chaque compteur envoie un petit enregistrement chaque seconde. Une application de détection des fraudes doit évaluer chaque mesure dans la seconde qui suit son arrivée, et une seconde application doit ensuite lire les mêmes enregistrements pour calculer des agrégats horaires.

    Quelle solution d'ingestion répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the readings to Amazon Data Firehose with a 60-second buffer to Amazon S3, and query the files with Amazon Athena.", fr: "Envoyer les mesures à Amazon Data Firehose avec une mise en mémoire tampon de 60 secondes vers Amazon S3, et interroger les fichiers avec Amazon Athena." } }
    - { id: b, text: { en: "Write the readings to Amazon S3 and run an AWS Glue job every night to process the day's files.", fr: "Écrire les mesures dans Amazon S3 et exécuter chaque nuit une tâche AWS Glue pour traiter les fichiers de la journée." } }
    - { id: c, text: { en: "Load the readings into Amazon Redshift with a COPY command every 15 minutes.", fr: "Charger les mesures dans Amazon Redshift avec une commande COPY toutes les 15 minutes." } }
    - { id: d, text: { en: "Write the readings to an Amazon Kinesis Data Streams stream that both applications consume.", fr: "Écrire les mesures dans un flux Amazon Kinesis Data Streams que les deux applications consomment." } }
answer: { optionId: d }
explanation:
  correct:
    en: "This is high-velocity streaming data that needs per-record processing within a second. In Kinesis Data Streams, records are typically available to consumers less than 1 second after they are written, and several consumers can read the same stream independently."
    fr: "Il s'agit de données en streaming à forte vélocité qui exigent un traitement par enregistrement en moins d'une seconde. Dans Kinesis Data Streams, les enregistrements sont généralement disponibles pour les consommateurs moins d'une seconde après leur écriture, et plusieurs consommateurs peuvent lire le même flux indépendamment."
  options:
    a:
      en: "A 60-second buffer delivers files in near real time, which misses the 1-second detection requirement."
      fr: "Une mise en mémoire tampon de 60 secondes livre des fichiers en quasi temps réel, ce qui ne respecte pas l'exigence de détection en 1 seconde."
    b:
      en: "A nightly batch job processes the readings hours after they arrive."
      fr: "Une tâche par lots nocturne traite les mesures plusieurs heures après leur arrivée."
    c:
      en: "Loading every 15 minutes is micro-batch processing, far slower than 1 second."
      fr: "Un chargement toutes les 15 minutes est un traitement par micro-lots, bien plus lent qu'une seconde."
references:
  - title: What is Amazon Kinesis Data Streams?
    url: https://docs.aws.amazon.com/streams/latest/dev/introduction.html
