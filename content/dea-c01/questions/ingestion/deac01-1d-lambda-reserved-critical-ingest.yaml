id: deac01-1d-lambda-reserved-critical-ingest
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs dozens of Lambda functions in one account. At month end, ad hoc reporting functions use all the account concurrency, and the function that ingests partner files from Amazon S3 is throttled. The ingestion function must always be able to run 200 concurrent executions, the reporting functions must keep running, and the solution must not add cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des dizaines de fonctions Lambda dans un même compte. En fin de mois, des fonctions de reporting ponctuelles consomment toute la simultanéité du compte, et la fonction qui ingère les fichiers des partenaires depuis Amazon S3 est limitée (throttled). La fonction d'ingestion doit toujours pouvoir exécuter 200 exécutions simultanées, les fonctions de reporting doivent continuer à s'exécuter, et la solution ne doit pas engendrer de coût supplémentaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure reserved concurrency of 200 on the ingestion function.", fr: "Configurer une simultanéité réservée de 200 sur la fonction d'ingestion." } }
    - { id: b, text: { en: "Configure provisioned concurrency of 200 on an alias of the ingestion function.", fr: "Configurer une simultanéité provisionnée de 200 sur un alias de la fonction d'ingestion." } }
    - { id: c, text: { en: "Request an increase of the account concurrency quota and keep the current configuration.", fr: "Demander une augmentation du quota de simultanéité du compte et conserver la configuration actuelle." } }
    - { id: d, text: { en: "Set the reserved concurrency of each reporting function to 0 during month end.", fr: "Définir la simultanéité réservée de chaque fonction de reporting sur 0 pendant la fin de mois." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Reserved concurrency reserves capacity exclusively for one function, so other functions cannot use it, and it incurs no additional charge. The reporting functions keep sharing the remaining unreserved concurrency."
    fr: "La simultanéité réservée réserve une capacité exclusivement à une fonction, que les autres fonctions ne peuvent pas utiliser, et elle n'entraîne aucun frais supplémentaire. Les fonctions de reporting continuent à partager la simultanéité non réservée restante."
  options:
    b: { en: "Provisioned concurrency keeps pre-initialized environments ready to reduce latency, and it incurs additional charges.", fr: "La simultanéité provisionnée maintient des environnements pré-initialisés pour réduire la latence, et elle entraîne des frais supplémentaires." }
    c: { en: "A larger pool can still be consumed entirely by the reporting functions, so the ingestion function has no guarantee.", fr: "Un pool plus grand peut toujours être entièrement consommé par les fonctions de reporting : la fonction d'ingestion n'a aucune garantie." }
    d: { en: "A reserved concurrency of 0 stops the reporting functions from processing any events, which breaks the reporting requirement.", fr: "Une simultanéité réservée de 0 empêche les fonctions de reporting de traiter le moindre événement, ce qui enfreint l'exigence de reporting." }
references:
  - title: Configuring reserved concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html
