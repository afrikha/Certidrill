id: deac01-1b-zero-etl-aurora
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer runs its order system on an Amazon Aurora MySQL DB cluster. The analytics team uses Amazon Redshift Serverless and needs the order data there, kept continuously up to date, for dashboards. Analytic queries must not run against the Aurora cluster, and the company does not want to build or operate a replication pipeline.

    Which solution will meet these requirements?
  fr: |
    Un détaillant en ligne exécute son système de commandes sur un cluster de bases de données Amazon Aurora MySQL. L'équipe d'analyse utilise Amazon Redshift Serverless et a besoin des données de commandes dans ce service, tenues à jour en continu, pour ses tableaux de bord. Les requêtes analytiques ne doivent pas s'exécuter sur le cluster Aurora, et l'entreprise ne veut ni construire ni exploiter de pipeline de réplication.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Aurora zero-ETL integration with the Redshift Serverless namespace as the target.", fr: "Créer une intégration zéro ETL Aurora avec l'espace de noms Redshift Serverless comme cible." }
    - id: b
      text: { en: "Create an AWS DMS task with full load and ongoing replication from Aurora to Redshift Serverless.", fr: "Créer une tâche AWS DMS avec chargement complet et réplication continue d'Aurora vers Redshift Serverless." }
    - id: c
      text: { en: "Create a federated query external schema in Redshift Serverless that points to the Aurora cluster.", fr: "Créer dans Redshift Serverless un schéma externe de requête fédérée qui pointe vers le cluster Aurora." }
    - id: d
      text: { en: "Run an AWS Glue job every hour that reads the changed rows through JDBC and loads them into Redshift.", fr: "Exécuter toutes les heures une tâche AWS Glue qui lit les lignes modifiées par JDBC et les charge dans Redshift." }
answer: { optionId: a }
explanation:
  correct:
    en: "A zero-ETL integration is a fully managed solution that makes transactional data from sources such as Aurora MySQL available in Amazon Redshift. AWS automates the creation and management of the data replication, so there is no ETL pipeline to maintain, and analytics run in Redshift while the source keeps serving the application."
    fr: "Une intégration zéro ETL est une solution entièrement gérée qui rend disponibles dans Amazon Redshift les données transactionnelles de sources comme Aurora MySQL. AWS automatise la création et la gestion de la réplication des données : aucun pipeline ETL n'est à maintenir, et l'analyse s'exécute dans Redshift pendant que la source continue de servir l'application."
  options:
    b:
      en: "A DMS task replicates continuously, but it is a replication pipeline with instances, endpoints, and tasks that the company must operate."
      fr: "Une tâche DMS réplique en continu, mais c'est un pipeline de réplication avec des instances, des points de terminaison et des tâches que l'entreprise doit exploiter."
    c:
      en: "Federated queries run part of each query on the Aurora cluster, which puts the analytic load on the source."
      fr: "Les requêtes fédérées exécutent une partie de chaque requête sur le cluster Aurora, ce qui fait porter la charge analytique sur la source."
    d:
      en: "An hourly job is a pipeline to build and operate, it reads from Aurora, and the data is up to an hour old."
      fr: "Une tâche horaire est un pipeline à construire et exploiter, elle lit dans Aurora, et les données ont jusqu'à une heure de retard."
references:
  - title: Zero-ETL integrations
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/zero-etl-using.html
