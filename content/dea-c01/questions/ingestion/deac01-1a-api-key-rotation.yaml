id: deac01-1a-api-key-rotation
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AWS Lambda functions in a data pipeline call a third-party data API that authenticates requests with an API key. The security team requires that the key is not stored in the function code or the function configuration, is encrypted at rest, and is replaced automatically every 30 days by calling the provider's key management API.

    Which solution will meet these requirements?
  fr: |
    Des fonctions AWS Lambda d'un pipeline de données appellent une API de données tierce qui authentifie les requêtes par une clé d'API. L'équipe de sécurité exige que la clé ne soit stockée ni dans le code ni dans la configuration des fonctions, qu'elle soit chiffrée au repos et qu'elle soit remplacée automatiquement tous les 30 jours en appelant l'API de gestion des clés du fournisseur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the key in a Lambda environment variable encrypted with an AWS KMS customer managed key.", fr: "Stocker la clé dans une variable d'environnement Lambda chiffrée avec une clé gérée par le client AWS KMS." } }
    - { id: b, text: { en: "Store the key as a SecureString parameter in AWS Systems Manager Parameter Store and read it at runtime.", fr: "Stocker la clé dans un paramètre SecureString d'AWS Systems Manager Parameter Store et la lire à l'exécution." } }
    - { id: c, text: { en: "Store the key in AWS Secrets Manager with rotation by a Lambda function every 30 days, and read the secret at runtime.", fr: "Stocker la clé dans AWS Secrets Manager avec une rotation par fonction Lambda tous les 30 jours, et lire le secret à l'exécution." } }
    - { id: d, text: { en: "Store the key in an S3 object encrypted with SSE-KMS and read the object at the start of each invocation.", fr: "Stocker la clé dans un objet S3 chiffré avec SSE-KMS et lire l'objet au début de chaque appel." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Secrets Manager encrypts the secret at rest and lets the functions retrieve it at runtime, so the key is not in the code or configuration. For a third-party key, rotation is done by a Lambda function that Secrets Manager runs on the rotation schedule to obtain a new key from the provider and update the secret."
    fr: "Secrets Manager chiffre le secret au repos et permet aux fonctions de le récupérer à l'exécution : la clé n'est ni dans le code ni dans la configuration. Pour une clé tierce, la rotation est effectuée par une fonction Lambda que Secrets Manager exécute selon la planification de rotation pour obtenir une nouvelle clé auprès du fournisseur et mettre à jour le secret."
  options:
    a:
      en: "An environment variable is part of the function configuration, and it is not rotated automatically."
      fr: "Une variable d'environnement fait partie de la configuration de la fonction, et elle n'est pas renouvelée automatiquement."
    b:
      en: "Parameter Store encrypts the value but has no built-in rotation, so the 30-day replacement would need custom automation."
      fr: "Parameter Store chiffre la valeur mais n'a pas de rotation intégrée : le remplacement tous les 30 jours exigerait une automatisation personnalisée."
    d:
      en: "An encrypted S3 object protects the key at rest but provides no automatic rotation."
      fr: "Un objet S3 chiffré protège la clé au repos mais ne fournit aucune rotation automatique."
references:
  - title: Rotate AWS Secrets Manager secrets - AWS Secrets Manager
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
