id: deac01-1b-redshift-spectrum-join
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company keeps the last 2 years of sales in an Amazon Redshift provisioned cluster. Seven years of older sales history are stored in Amazon S3 as Apache Parquet files and are cataloged in the AWS Glue Data Catalog. Analysts must join the recent and historical data in single SQL queries in Amazon Redshift, without loading the historical data into the cluster.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conserve les 2 dernières années de ventes dans un cluster provisionné Amazon Redshift. Sept années d'historique de ventes plus anciennes sont stockées dans Amazon S3 sous forme de fichiers Apache Parquet et sont cataloguées dans AWS Glue Data Catalog. Les analystes doivent joindre les données récentes et historiques dans des requêtes SQL uniques dans Amazon Redshift, sans charger les données historiques dans le cluster.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Load the historical Parquet files into new tables of the cluster with the COPY command each night.", fr: "Charger chaque nuit les fichiers Parquet historiques dans de nouvelles tables du cluster avec la commande COPY." }
    - id: b
      text: { en: "Query the historical data with Amazon Athena and join the two result sets in the reporting tool.", fr: "Interroger les données historiques avec Amazon Athena et joindre les deux jeux de résultats dans l'outil de reporting." }
    - id: c
      text: { en: "Run the UNLOAD command to write the recent data of the cluster to Amazon S3 next to the historical data.", fr: "Exécuter la commande UNLOAD pour écrire les données récentes du cluster dans Amazon S3 à côté des données historiques." }
    - id: d
      text: { en: "Create an external schema from the Data Catalog database and query the historical tables with Redshift Spectrum.", fr: "Créer un schéma externe à partir de la base de données du Data Catalog et interroger les tables historiques avec Redshift Spectrum." }
answer: { optionId: d }
explanation:
  correct:
    en: "Redshift Spectrum queries structured and semi-structured files in Amazon S3 directly from Amazon Redshift, without loading them into Redshift tables. An external schema that references the Data Catalog database exposes the historical tables, which analysts can join with local tables in the same query."
    fr: "Redshift Spectrum interroge directement depuis Amazon Redshift des fichiers structurés et semi-structurés dans Amazon S3, sans les charger dans des tables Redshift. Un schéma externe qui référence la base de données du Data Catalog expose les tables historiques, que les analystes peuvent joindre aux tables locales dans la même requête."
  options:
    a:
      en: "COPY loads the data into the cluster, which the requirement excludes, and adds storage for seven years of history."
      fr: "COPY charge les données dans le cluster, ce que l'exigence exclut, et ajoute le stockage de sept années d'historique."
    b:
      en: "Joining in the reporting tool is not a single SQL query in Amazon Redshift and moves large result sets."
      fr: "Joindre dans l'outil de reporting n'est pas une requête SQL unique dans Amazon Redshift et déplace de gros jeux de résultats."
    c:
      en: "UNLOAD exports data out of Redshift; it does not let Redshift queries read the S3 history."
      fr: "UNLOAD exporte des données hors de Redshift ; il ne permet pas aux requêtes Redshift de lire l'historique dans S3."
references:
  - title: Amazon Redshift Spectrum
    url: https://docs.aws.amazon.com/redshift/latest/dg/c-using-spectrum.html
