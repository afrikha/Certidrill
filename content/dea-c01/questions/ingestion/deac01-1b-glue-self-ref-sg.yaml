id: deac01-1b-glue-self-ref-sg
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer creates an AWS Glue JDBC connection to an Amazon RDS for MySQL database in a private subnet. The connection uses the security group of the DB instance, which allows inbound MySQL traffic only from the application servers. When the engineer tests the connection, it fails with a message that the security group must allow communication between the AWS Glue components.

    Which change will fix the connection without opening the database to other networks?
  fr: |
    Un ingénieur de données crée une connexion JDBC AWS Glue vers une base de données Amazon RDS for MySQL située dans un sous-réseau privé. La connexion utilise le groupe de sécurité de l'instance de base de données, qui n'autorise le trafic MySQL entrant que depuis les serveurs d'application. Lorsque l'ingénieur teste la connexion, elle échoue avec un message indiquant que le groupe de sécurité doit autoriser la communication entre les composants AWS Glue.

    Quelle modification corrige la connexion sans ouvrir la base de données à d'autres réseaux ?
body:
  options:
    - id: a
      text: { en: "Add an inbound rule for port 3306 from 0.0.0.0/0 to the security group.", fr: "Ajouter au groupe de sécurité une règle entrante pour le port 3306 depuis 0.0.0.0/0." }
    - id: b
      text: { en: "Add a self-referencing inbound rule for all TCP ports to the security group.", fr: "Ajouter au groupe de sécurité une règle entrante autoréférencée pour tous les ports TCP." }
    - id: c
      text: { en: "Turn on public access for the DB instance and allow the AWS Glue IP address ranges.", fr: "Activer l'accès public de l'instance de base de données et autoriser les plages d'adresses IP d'AWS Glue." }
    - id: d
      text: { en: "Add a NAT gateway to the VPC and route the private subnet to it.", fr: "Ajouter une passerelle NAT au VPC et y router le sous-réseau privé." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Glue needs a security group with a self-referencing inbound rule for all TCP ports so that its components can communicate. The rule allows traffic only from resources that use the same security group, so it does not open the VPC to other networks."
    fr: "AWS Glue a besoin d'un groupe de sécurité avec une règle entrante autoréférencée pour tous les ports TCP afin que ses composants puissent communiquer. La règle n'autorise que le trafic des ressources qui utilisent le même groupe de sécurité : elle n'ouvre pas le VPC à d'autres réseaux."
  options:
    a:
      en: "Allowing 0.0.0.0/0 opens the database port to every address, and it still does not allow the Glue components to reach each other on other ports."
      fr: "Autoriser 0.0.0.0/0 ouvre le port de la base de données à toutes les adresses, et ne permet toujours pas aux composants Glue de communiquer entre eux sur les autres ports."
    c:
      en: "Glue reaches the database through network interfaces in the VPC, so public access is not needed and would expose the database."
      fr: "Glue atteint la base de données par des interfaces réseau dans le VPC : l'accès public n'est pas nécessaire et exposerait la base de données."
    d:
      en: "A NAT gateway provides outbound internet access; it does not satisfy the security group requirement between the Glue components."
      fr: "Une passerelle NAT fournit un accès Internet sortant ; elle ne satisfait pas l'exigence de groupe de sécurité entre les composants Glue."
references:
  - title: Setting up Amazon VPC for JDBC connections to Amazon RDS data stores from AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/setup-vpc-for-glue-access.html
