id: deac01-1c-glue-scan-less
objective: "1.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue Spark job reads a Data Catalog table of JSON clickstream data in Amazon S3. The table is partitioned by a `dt` column and holds 3 years of data, but each run needs only the previous day. Each daily partition contains about 40,000 JSON files of 2–50 KB. The job currently reads the whole table with `create_dynamic_frame.from_catalog` and then filters on `dt`. The company wants to reduce the DPU-hours that the job consumes.

    Which combination of changes will meet these requirements? (Choose two.)
  fr: |
    Une tâche Spark AWS Glue lit une table du catalogue de données contenant des données de parcours de navigation au format JSON dans Amazon S3. La table est partitionnée par une colonne `dt` et contient 3 ans de données, mais chaque exécution n'a besoin que de la veille. Chaque partition quotidienne contient environ 40 000 fichiers JSON de 2 à 50 Ko. La tâche lit actuellement toute la table avec `create_dynamic_frame.from_catalog`, puis filtre sur `dt`. L'entreprise veut réduire les DPU-heures consommées par la tâche.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Pass a push_down_predicate on dt to create_dynamic_frame.from_catalog.", fr: "Transmettre un push_down_predicate sur dt à create_dynamic_frame.from_catalog." } }
    - { id: b, text: { en: "Apply a Filter transform on dt immediately after the table is read.", fr: "Appliquer une transformation Filter sur dt immédiatement après la lecture de la table." } }
    - { id: c, text: { en: "Set groupFiles to inPartition so that each task reads a group of small files.", fr: "Définir groupFiles sur inPartition pour que chaque tâche Spark lise un groupe de petits fichiers." } }
    - { id: d, text: { en: "Change the worker type to G.2X and double the number of workers.", fr: "Remplacer le type de worker par G.2X et doubler le nombre de workers." } }
    - { id: e, text: { en: "Read the table root path with create_dynamic_frame.from_options and recurse set to True.", fr: "Lire le chemin racine de la table avec create_dynamic_frame.from_options et recurse défini sur True." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A push_down_predicate is applied to the partition metadata in the Data Catalog, so the job lists and reads only the matching partition instead of 3 years of files. Grouping small files with groupFiles set to inPartition makes each task read many files into one in-memory partition, which reduces the number of tasks and the overhead of 40,000 tiny files."
    fr: "Un push_down_predicate est appliqué aux métadonnées de partition du catalogue de données : la tâche ne liste et ne lit que la partition correspondante au lieu de 3 ans de fichiers. Le regroupement des petits fichiers avec groupFiles défini sur inPartition fait lire à chaque tâche Spark de nombreux fichiers dans une seule partition en mémoire, ce qui réduit le nombre de tâches Spark et la surcharge de 40 000 très petits fichiers."
  options:
    b:
      en: "A Filter transform runs after the data is loaded, so the job still reads every partition of the table."
      fr: "Une transformation Filter s'exécute après le chargement des données : la tâche lit toujours toutes les partitions de la table."
    d:
      en: "Larger and more workers increase the DPUs billed per hour without reducing the amount of data read."
      fr: "Des workers plus grands et plus nombreux augmentent les DPU facturés par heure sans réduire la quantité de données lues."
    e:
      en: "Reading the root path recursively loads every file of the 3 years and loses the partition pruning of the Data Catalog."
      fr: "La lecture récursive du chemin racine charge tous les fichiers des 3 ans et perd l'élagage des partitions du catalogue de données."
references:
  - title: Managing partitions for ETL output in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-partitions.html
  - title: Reading input files in larger groups
    url: https://docs.aws.amazon.com/glue/latest/dg/grouping-input-files.html
