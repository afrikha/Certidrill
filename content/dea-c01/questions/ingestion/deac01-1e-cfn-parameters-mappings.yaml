id: deac01-1e-cfn-parameters-mappings
objective: "1.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data team deploys an ingestion stack that contains an Amazon Data Firehose stream, an Amazon S3 bucket, and an AWS Glue database. The stack is deployed to dev, test, and prod environments in the same AWS account and Region. The buffering interval of the stream and the bucket name differ in each environment. The team wants repeatable deployments from a single AWS CloudFormation template, with no manual edits for each environment.

    Which solution will meet these requirements?
  fr: |
    Une équipe de données déploie une pile d'ingestion qui contient un flux Amazon Data Firehose, un compartiment Amazon S3 et une base de données AWS Glue. La pile est déployée dans les environnements dev, test et prod du même compte AWS et de la même Région. L'intervalle de mise en mémoire tampon du flux et le nom du compartiment diffèrent dans chaque environnement. L'équipe veut des déploiements reproductibles à partir d'un seul modèle AWS CloudFormation, sans modification manuelle pour chaque environnement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an Environment parameter, and read the per-environment values from a Mappings section with Fn::FindInMap.", fr: "Ajouter un paramètre Environment, et lire les valeurs propres à chaque environnement dans une section Mappings avec Fn::FindInMap." } }
    - { id: b, text: { en: "Keep one copy of the template for each environment, each with its own hard-coded buffering interval and bucket name.", fr: "Conserver une copie du modèle par environnement, chacune avec son propre intervalle de mise en mémoire tampon et son propre nom de compartiment codés en dur." } }
    - { id: c, text: { en: "Deploy the same template three times, and then change the buffering interval and the bucket name of each stack in the console.", fr: "Déployer trois fois le même modèle, puis modifier dans la console l'intervalle de mise en mémoire tampon et le nom du compartiment de chaque pile." } }
    - { id: d, text: { en: "Deploy the template once, and use drift detection to apply the values of the other two environments.", fr: "Déployer le modèle une seule fois, et utiliser la détection de dérive pour appliquer les valeurs des deux autres environnements." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A parameter selects the environment at deployment, and Fn::FindInMap reads the matching values from the Mappings section, which holds literal keys and values. One template then produces each environment the same way, which is the goal of repeatable infrastructure as code."
    fr: "Un paramètre sélectionne l'environnement au déploiement, et Fn::FindInMap lit les valeurs correspondantes dans la section Mappings, qui contient des clés et des valeurs littérales. Un seul modèle produit alors chaque environnement de la même façon, ce qui est l'objectif d'une infrastructure en tant que code reproductible."
  options:
    b:
      en: "Three copies drift apart over time and break the single-template requirement."
      fr: "Trois copies divergent avec le temps et ne respectent pas l'exigence d'un modèle unique."
    c:
      en: "Manual changes in the console are not repeatable and are overwritten or reported as drift."
      fr: "Les modifications manuelles dans la console ne sont pas reproductibles et sont écrasées ou signalées comme dérive."
    d:
      en: "Drift detection only reports differences between resources and their template; it changes nothing."
      fr: "La détection de dérive signale seulement les écarts entre les ressources et leur modèle ; elle ne modifie rien."
references:
  - title: CloudFormation template Mappings syntax
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/mappings-section-structure.html
