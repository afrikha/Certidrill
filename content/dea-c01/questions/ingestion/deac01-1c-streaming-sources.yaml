id: deac01-1c-streaming-sources
objective: "1.2.9"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A data engineer is classifying the sources of a new analytics platform by velocity to decide which ones need streaming ingestion.

    Which sources produce streaming data? (Choose two.)
  fr: |
    Un ingénieur de données classe les sources d'une nouvelle plateforme d'analyse selon leur vélocité afin de déterminer celles qui nécessitent une ingestion en streaming.

    Quelles sources produisent des données en streaming ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An ERP system that exports the day's invoices to a file every night", fr: "Un système ERP qui exporte chaque nuit les factures de la journée dans un fichier" } }
    - { id: b, text: { en: "Factory sensors that send a temperature reading every second", fr: "Des capteurs d'usine qui envoient une mesure de température chaque seconde" } }
    - { id: c, text: { en: "A partner that uploads a CSV price list at the start of each month", fr: "Un partenaire qui charge une liste de prix CSV au début de chaque mois" } }
    - { id: d, text: { en: "A weekly snapshot of a customer database", fr: "Un instantané hebdomadaire d'une base de données clients" } }
    - { id: e, text: { en: "A mobile app that emits a clickstream event for each user action", fr: "Une application mobile qui émet un événement de parcours de navigation pour chaque action d'un utilisateur" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Streaming data is generated continuously by sources such as sensors, IoT devices and mobile devices. Sensor readings every second and per-action clickstream events arrive as continuous streams, whereas the other sources deliver data on a fixed schedule, which is batch data."
    fr: "Les données en streaming sont générées en continu par des sources comme les capteurs, les appareils IoT et les appareils mobiles. Les mesures de capteurs chaque seconde et les événements de navigation par action arrivent sous forme de flux continus, alors que les autres sources livrent des données selon un calendrier fixe : ce sont des données par lots."
  options:
    a:
      en: "A nightly export is generated on a regular schedule, which is batch data."
      fr: "Une exportation nocturne est générée selon un calendrier régulier : ce sont des données par lots."
    c:
      en: "A monthly file upload is batch data with low velocity."
      fr: "Un chargement de fichier mensuel correspond à des données par lots de faible vélocité."
    d:
      en: "A weekly snapshot is a scheduled batch extract, not a continuous stream."
      fr: "Un instantané hebdomadaire est une extraction par lots planifiée, pas un flux continu."
references:
  - title: Characteristics
    url: https://docs.aws.amazon.com/wellarchitected/latest/analytics-lens/characteristics.html
