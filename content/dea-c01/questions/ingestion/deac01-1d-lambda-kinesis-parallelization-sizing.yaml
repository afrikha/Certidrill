id: deac01-1d-lambda-kinesis-parallelization-sizing
objective: "1.4.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A Lambda function processes an Amazon Kinesis data stream that has 10 shards through an event source mapping. Load tests show that the function must process 50 batches concurrently to keep up with peak traffic. The company does not want to change the number of shards, and records that share a partition key must be processed in order. The account has enough unreserved concurrency.

    What is the minimum ParallelizationFactor value that the event source mapping must use?
  fr: |
    Une fonction Lambda traite un flux de données Amazon Kinesis de 10 partitions (shards) via un mappage de source d'événements. Des tests de charge montrent que la fonction doit traiter 50 lots simultanément pour suivre le trafic de pointe. L'entreprise ne veut pas modifier le nombre de partitions, et les enregistrements qui partagent une clé de partition doivent être traités dans l'ordre. Le compte dispose de suffisamment de simultanéité non réservée.

    Quelle valeur minimale de ParallelizationFactor le mappage de source d'événements doit-il utiliser ?
body:
  options:
    - { id: a, text: "2" }
    - { id: b, text: "5" }
    - { id: c, text: "10" }
    - { id: d, text: "50" }
answer: { optionId: b }
explanation:
  correct:
    en: "ParallelizationFactor sets how many batches Lambda processes concurrently from each shard, from 1 to 10, so the maximum number of concurrent invocations is the number of shards multiplied by the factor. With 10 shards, a factor of 5 gives 50 concurrent batches, and Lambda still keeps in-order processing at the partition-key level."
    fr: "ParallelizationFactor définit le nombre de lots que Lambda traite simultanément pour chaque partition, de 1 à 10 : le nombre maximal d'appels simultanés est le nombre de partitions multiplié par ce facteur. Avec 10 partitions, un facteur de 5 donne 50 lots simultanés, et Lambda conserve le traitement dans l'ordre au niveau de la clé de partition."
  options:
    a: { en: "10 shards with a factor of 2 give only 20 concurrent batches.", fr: "10 partitions avec un facteur de 2 ne donnent que 20 lots simultanés." }
    c: { en: "A factor of 10 gives 100 concurrent batches; it works but is not the minimum value.", fr: "Un facteur de 10 donne 100 lots simultanés ; cela fonctionne, mais ce n'est pas la valeur minimale." }
    d: { en: "ParallelizationFactor accepts values from 1 to 10 only.", fr: "ParallelizationFactor n'accepte que des valeurs de 1 à 10." }
references:
  - title: Using Lambda to process records from Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
