id: deac01-1a-s3-notification-destinations
objective: "1.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A data engineer wants an Amazon S3 bucket to send object-created notifications directly to a messaging destination, without Amazon EventBridge, so that several downstream consumers can process the events.

    Which destinations can the data engineer specify in the bucket's event notification configuration? (Choose two.)
  fr: |
    Un ingénieur données veut qu'un compartiment Amazon S3 envoie les notifications de création d'objet directement à une destination de messagerie, sans Amazon EventBridge, afin que plusieurs consommateurs en aval puissent traiter les événements.

    Quelles destinations l'ingénieur données peut-il indiquer dans la configuration de notification d'événement du compartiment ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An Amazon SQS FIFO queue", fr: "Une file d'attente Amazon SQS FIFO" } }
    - { id: b, text: { en: "An Amazon SNS standard topic", fr: "Une rubrique standard Amazon SNS" } }
    - { id: c, text: { en: "An Amazon Kinesis data stream", fr: "Un flux de données Amazon Kinesis" } }
    - { id: d, text: { en: "An Amazon Data Firehose stream", fr: "Un flux Amazon Data Firehose" } }
    - { id: e, text: { en: "An Amazon SQS standard queue", fr: "Une file d'attente standard Amazon SQS" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "S3 Event Notifications can be sent to Amazon SNS topics, Amazon SQS queues, AWS Lambda functions and Amazon EventBridge. An SNS standard topic fans events out to several subscribers, and an SQS standard queue buffers them for consumers."
    fr: "Les notifications d'événements S3 peuvent être envoyées à des rubriques Amazon SNS, des files d'attente Amazon SQS, des fonctions AWS Lambda et Amazon EventBridge. Une rubrique SNS standard diffuse les événements à plusieurs abonnés, et une file d'attente SQS standard les met en mémoire tampon pour les consommateurs."
  options:
    a:
      en: "SQS FIFO queues are not supported as S3 event notification destinations; AWS recommends EventBridge to reach them."
      fr: "Les files d'attente SQS FIFO ne sont pas prises en charge comme destinations de notification d'événement S3 ; AWS recommande EventBridge pour les atteindre."
    c:
      en: "A Kinesis data stream is not an S3 event notification destination."
      fr: "Un flux de données Kinesis n'est pas une destination de notification d'événement S3."
    d:
      en: "A Firehose stream is not an S3 event notification destination."
      fr: "Un flux Firehose n'est pas une destination de notification d'événement S3."
references:
  - title: Amazon S3 Event Notifications - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html
