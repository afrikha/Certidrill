id: deac01-1c-redshift-ml-bedrock
objective: "1.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hotel chain stores millions of guest reviews in an Amazon Redshift table. Its analysts work only in SQL and want to add a short summary of each review to a reporting table with an Amazon Bedrock foundation model. The reviews must not be exported from Redshift, and the company does not want to write or maintain application code.

    Which solution will meet these requirements?
  fr: |
    Une chaîne hôtelière stocke des millions d'avis de clients dans une table Amazon Redshift. Ses analystes travaillent uniquement en SQL et veulent ajouter un court résumé de chaque avis à une table de rapports avec un modèle de fondation Amazon Bedrock. Les avis ne doivent pas être exportés de Redshift, et l'entreprise ne veut pas écrire ni maintenir de code applicatif.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an external model with CREATE EXTERNAL MODEL and MODEL_TYPE BEDROCK, then call its function in an INSERT INTO ... SELECT statement.", fr: "Créer un modèle externe avec CREATE EXTERNAL MODEL et MODEL_TYPE BEDROCK, puis appeler sa fonction dans une instruction INSERT INTO ... SELECT." } }
    - { id: b, text: { en: "UNLOAD the reviews to Amazon S3, run an Amazon Bedrock batch inference job on them, and COPY the summaries back.", fr: "Exporter les avis vers Amazon S3 avec UNLOAD, exécuter dessus une tâche d'inférence par lots Amazon Bedrock, puis recharger les résumés avec COPY." } }
    - { id: c, text: { en: "Create a Lambda user-defined function that calls the Amazon Bedrock InvokeModel API, and call it in the SELECT statement.", fr: "Créer une fonction Lambda définie par l'utilisateur qui appelle l'API InvokeModel d'Amazon Bedrock, et l'appeler dans l'instruction SELECT." } }
    - { id: d, text: { en: "Query the reviews through Amazon Redshift Spectrum and summarize them with an Amazon Bedrock knowledge base.", fr: "Interroger les avis au moyen d'Amazon Redshift Spectrum et les résumer avec une base de connaissances Amazon Bedrock." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Redshift ML integrates with Amazon Bedrock: CREATE EXTERNAL MODEL with MODEL_TYPE BEDROCK, a MODEL_ID and an optional PROMPT creates an inference function that SQL users call in queries. The data stays in Redshift, and the cluster's IAM role needs Bedrock permissions and access to the model."
    fr: "Redshift ML s'intègre à Amazon Bedrock : CREATE EXTERNAL MODEL avec MODEL_TYPE BEDROCK, un MODEL_ID et un PROMPT facultatif crée une fonction d'inférence que les utilisateurs SQL appellent dans leurs requêtes. Les données restent dans Redshift, et le rôle IAM du cluster a besoin d'autorisations Bedrock et de l'accès au modèle."
  options:
    b:
      en: "UNLOAD exports the reviews to Amazon S3, which the requirements forbid."
      fr: "UNLOAD exporte les avis vers Amazon S3, ce que les exigences interdisent."
    c:
      en: "A Lambda UDF works, but it is application code that the company must write and maintain."
      fr: "Une UDF Lambda fonctionne, mais c'est du code applicatif que l'entreprise doit écrire et maintenir."
    d:
      en: "Spectrum queries data in Amazon S3, not Redshift tables, and a knowledge base retrieves documents for RAG instead of summarizing table rows."
      fr: "Spectrum interroge des données dans Amazon S3, pas des tables Redshift, et une base de connaissances récupère des documents pour la RAG au lieu de résumer des lignes de table."
references:
  - title: Amazon Redshift ML integration with Amazon Bedrock
    url: https://docs.aws.amazon.com/redshift/latest/dg/machine-learning-br.html
