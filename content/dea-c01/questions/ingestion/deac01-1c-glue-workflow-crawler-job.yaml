id: deac01-1c-glue-workflow-crawler-job
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's nightly pipeline runs an AWS Glue crawler on raw data, then two AWS Glue ETL jobs in sequence, then a second crawler on the curated data. All the steps are AWS Glue components. The company wants to run the steps in order on a schedule and see the status of each step of every run in one place, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Le pipeline nocturne d'une entreprise exécute un robot d'analyse AWS Glue sur des données brutes, puis deux tâches ETL AWS Glue successives, puis un second robot sur les données organisées. Toutes les étapes sont des composants AWS Glue. L'entreprise veut exécuter les étapes dans l'ordre selon une planification et voir l'état de chaque étape de chaque exécution au même endroit, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon MWAA environment and write a DAG that starts each crawler and job.", fr: "Créer un environnement Amazon MWAA et écrire un DAG qui démarre chaque robot et chaque tâche." } }
    - { id: b, text: { en: "Create an EventBridge rule for each completion event that starts the next crawler or job.", fr: "Créer une règle EventBridge pour chaque événement de fin qui démarre le robot ou la tâche suivante." } }
    - { id: c, text: { en: "Create an AWS Glue workflow with a scheduled start trigger and conditional triggers between the steps.", fr: "Créer un flux de travail AWS Glue avec un déclencheur de démarrage planifié et des déclencheurs conditionnels entre les étapes." } }
    - { id: d, text: { en: "Schedule a Lambda function that starts each step and polls its status until it completes.", fr: "Planifier une fonction Lambda qui démarre chaque étape et interroge son état jusqu'à la fin." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Glue workflows chain crawlers, jobs and triggers into one ETL process. A schedule trigger starts the workflow, triggers inside it start each job or crawler when the previous one completes, and the workflow records the progress and status of every component for each run."
    fr: "Les flux de travail AWS Glue enchaînent des robots d'analyse, des tâches et des déclencheurs dans un même processus ETL. Un déclencheur planifié démarre le flux de travail, des déclencheurs internes démarrent chaque tâche ou robot à la fin du précédent, et le flux de travail enregistre la progression et l'état de chaque composant pour chaque exécution."
  options:
    a:
      en: "MWAA can orchestrate the steps, but an Airflow environment to run and pay for is more overhead for a pipeline made only of AWS Glue components."
      fr: "MWAA peut orchestrer les étapes, mais un environnement Airflow à exploiter et à payer représente plus de charge pour un pipeline composé uniquement de composants AWS Glue."
    b:
      en: "Separate rules chain the steps, but no single view shows the status of each step of a run."
      fr: "Des règles distinctes enchaînent les étapes, mais aucune vue unique ne montre l'état de chaque étape d'une exécution."
    d:
      en: "Custom code that starts and polls each step must be written and maintained, and it gives no built-in view of each run."
      fr: "Un code personnalisé qui démarre et interroge chaque étape doit être écrit et maintenu, et il n'offre aucune vue intégrée de chaque exécution."
references:
  - title: Overview of workflows in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/workflows_overview.html
