id: deac01-1d-glue-job-failure-email
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data team runs about 30 AWS Glue jobs every night. The team wants to receive an email whenever any run of these jobs fails or times out. The solution must not require custom code.

    Which solution will meet these requirements?
  fr: |
    Une équipe de données exécute une trentaine de tâches AWS Glue chaque nuit. L'équipe veut recevoir un e-mail chaque fois qu'une exécution de ces tâches échoue ou expire. La solution ne doit pas nécessiter de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set a job delay notification threshold on each job so that AWS Glue emails the team when a run fails or takes too long.", fr: "Définir un seuil de notification de retard sur chaque tâche pour qu'AWS Glue envoie un e-mail à l'équipe lorsqu'une exécution échoue ou dure trop longtemps." } }
    - { id: b, text: { en: "Create a CloudWatch Logs subscription filter on the error logs of the jobs, with an SNS topic that has an email subscription as the destination.", fr: "Créer un filtre d'abonnement CloudWatch Logs sur les journaux d'erreurs des tâches, avec comme destination une rubrique SNS dotée d'un abonnement par e-mail." } }
    - { id: c, text: { en: "Create an EventBridge rule for Glue Job State Change events in the FAILED or TIMEOUT state, with an SNS topic that has an email subscription as the target.", fr: "Créer une règle EventBridge pour les événements Glue Job State Change à l'état FAILED ou TIMEOUT, avec comme cible une rubrique SNS dotée d'un abonnement par e-mail." } }
    - { id: d, text: { en: "Configure an SQS dead-letter queue on each Glue job and subscribe the email address of the team to that queue.", fr: "Configurer une file d'attente de lettres mortes SQS sur chaque tâche Glue et abonner l'adresse e-mail de l'équipe à cette file." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Glue emits a Glue Job State Change event to EventBridge when a job run reaches SUCCEEDED, FAILED, TIMEOUT, or STOPPED. A rule that filters on FAILED and TIMEOUT can send the event to an SNS topic, which delivers it to the email subscribers."
    fr: "AWS Glue émet un événement Glue Job State Change vers EventBridge lorsqu'une exécution de tâche atteint l'état SUCCEEDED, FAILED, TIMEOUT ou STOPPED. Une règle qui filtre sur FAILED et TIMEOUT peut envoyer l'événement à une rubrique SNS, qui le transmet aux abonnés par e-mail."
  options:
    a: { en: "The delay notification threshold only produces Glue Job Run Status events for runs that exceed it; it sends no email and does not report failures.", fr: "Le seuil de notification de retard ne produit que des événements Glue Job Run Status pour les exécutions qui le dépassent ; il n'envoie pas d'e-mail et ne signale pas les échecs." }
    b: { en: "Subscription filters deliver to Kinesis Data Streams, Amazon Data Firehose, Lambda, or OpenSearch Service, not to an SNS topic, and they would need log parsing.", fr: "Les filtres d'abonnement livrent vers Kinesis Data Streams, Amazon Data Firehose, Lambda ou OpenSearch Service, pas vers une rubrique SNS, et ils exigeraient une analyse des journaux." }
    d: { en: "Glue jobs have no dead-letter queue setting, and SQS queues cannot deliver messages to email addresses.", fr: "Les tâches Glue n'ont pas de paramètre de file d'attente de lettres mortes, et les files SQS ne peuvent pas livrer de messages à des adresses e-mail." }
references:
  - title: Automating AWS Glue with EventBridge
    url: https://docs.aws.amazon.com/glue/latest/dg/automating-awsglue-with-cloudwatch-events.html
