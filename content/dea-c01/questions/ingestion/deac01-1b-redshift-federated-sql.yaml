id: deac01-1b-redshift-federated-sql
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores sales history in an Amazon Redshift provisioned cluster. Current stock levels are in an Amazon Aurora PostgreSQL database and change every few seconds. Analysts must run the following query, which joins the live stock levels with the sales history, without copying the stock data into Redshift. Database credentials must not appear in SQL text.

    ```sql
    SELECT s.sku, SUM(s.qty) AS sold_30d, i.on_hand
    FROM public.sales s
    JOIN inventory_live.stock i ON i.sku = s.sku
    WHERE s.sale_date >= DATEADD(day, -30, CURRENT_DATE)
    GROUP BY s.sku, i.on_hand;
    ```

    What must the team create in Redshift so that inventory_live resolves to the live Aurora tables?
  fr: |
    Une entreprise stocke l'historique des ventes dans un cluster provisionné Amazon Redshift. Les niveaux de stock actuels sont dans une base de données Amazon Aurora PostgreSQL et changent toutes les quelques secondes. Les analystes doivent exécuter la requête suivante, qui joint les niveaux de stock en direct avec l'historique des ventes, sans copier les données de stock dans Redshift. Les informations d'identification de la base de données ne doivent pas apparaître dans le texte SQL.

    ```sql
    SELECT s.sku, SUM(s.qty) AS sold_30d, i.on_hand
    FROM public.sales s
    JOIN inventory_live.stock i ON i.sku = s.sku
    WHERE s.sale_date >= DATEADD(day, -30, CURRENT_DATE)
    GROUP BY s.sku, i.on_hand;
    ```

    Que doit créer l'équipe dans Redshift pour que inventory_live corresponde aux tables Aurora en direct ?
body:
  options:
    - id: a
      text: { en: "An external schema named inventory_live FROM DATA CATALOG that points to a Glue database crawled from the Aurora database", fr: "Un schéma externe nommé inventory_live FROM DATA CATALOG qui pointe vers une base de données Glue analysée depuis la base Aurora" }
    - id: b
      text: { en: "A zero-ETL integration from the Aurora database into a Redshift database named inventory_live", fr: "Une intégration zéro ETL de la base Aurora vers une base de données Redshift nommée inventory_live" }
    - id: c
      text: { en: "A datashare named inventory_live that the Aurora database shares with the Redshift cluster", fr: "Une unité de partage des données (datashare) nommée inventory_live que la base Aurora partage avec le cluster Redshift" }
    - id: d
      text: { en: "An external schema named inventory_live FROM POSTGRES with the Aurora endpoint, an IAM role, and the ARN of a Secrets Manager secret", fr: "Un schéma externe nommé inventory_live FROM POSTGRES avec le point de terminaison Aurora, un rôle IAM et l'ARN d'un secret Secrets Manager" }
answer: { optionId: d }
explanation:
  correct:
    en: "Redshift federated queries read live data in RDS and Aurora PostgreSQL or MySQL databases and join it with Redshift tables. The external schema references the database endpoint, an IAM role that Redshift uses, and a Secrets Manager secret with the credentials, and Redshift pushes predicates down to the source to reduce data movement."
    fr: "Les requêtes fédérées Redshift lisent des données en direct dans des bases RDS et Aurora PostgreSQL ou MySQL et les joignent à des tables Redshift. Le schéma externe référence le point de terminaison de la base, un rôle IAM qu'utilise Redshift et un secret Secrets Manager contenant les informations d'identification, et Redshift pousse les prédicats vers la source pour réduire les mouvements de données."
  options:
    a:
      en: "A Data Catalog external schema queries data in Amazon S3 through Redshift Spectrum; it does not read a live PostgreSQL database."
      fr: "Un schéma externe Data Catalog interroge des données dans Amazon S3 par Redshift Spectrum ; il ne lit pas une base PostgreSQL en direct."
    b:
      en: "A zero-ETL integration replicates the Aurora data into Redshift, which copies the stock data."
      fr: "Une intégration zéro ETL réplique les données Aurora dans Redshift, ce qui copie les données de stock."
    c:
      en: "Datashares share data between Redshift warehouses; an Aurora database cannot create one."
      fr: "Les unités de partage des données partagent des données entre entrepôts Redshift ; une base Aurora ne peut pas en créer."
references:
  - title: Querying data with federated queries in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/federated-overview.html
