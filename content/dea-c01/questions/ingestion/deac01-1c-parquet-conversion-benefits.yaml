id: deac01-1c-parquet-conversion-benefits
objective: "1.2.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company stores uncompressed CSV log files in Amazon S3 and queries them with Amazon Athena. Most queries select 4 of the 60 columns. A data engineer proposes converting the files to Apache Parquet with Snappy compression.

    Which benefits will the conversion provide? (Choose two.)
  fr: |
    Une entreprise stocke des fichiers journaux CSV non compressés dans Amazon S3 et les interroge avec Amazon Athena. La plupart des requêtes sélectionnent 4 des 60 colonnes. Un ingénieur de données propose de convertir les fichiers au format Apache Parquet avec la compression Snappy.

    Quels avantages la conversion apportera-t-elle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Athena can read only the columns that a query uses instead of whole rows.", fr: "Athena peut lire uniquement les colonnes utilisées par une requête au lieu de lignes entières." } }
    - { id: b, text: { en: "Rows can be updated in place in the existing files.", fr: "Les lignes peuvent être mises à jour sur place dans les fichiers existants." } }
    - { id: c, text: { en: "The table no longer needs a definition in the AWS Glue Data Catalog.", fr: "La table n'a plus besoin de définition dans le catalogue de données AWS Glue." } }
    - { id: d, text: { en: "Compressed columnar data reduces the bytes scanned, which lowers the cost per query.", fr: "Les données en colonnes compressées réduisent les octets analysés, ce qui baisse le coût par requête." } }
    - { id: e, text: { en: "The files can be read in any text editor for troubleshooting.", fr: "Les fichiers peuvent être lus dans n'importe quel éditeur de texte pour le dépannage." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Parquet stores data by column, so a query that selects 4 columns reads only those columns. Columnar data compresses well, and because Athena charges for the data scanned, fewer bytes read means lower cost and faster queries."
    fr: "Parquet stocke les données par colonne : une requête qui sélectionne 4 colonnes ne lit que ces colonnes. Les données en colonnes se compressent bien et, comme Athena facture les données analysées, moins d'octets lus signifie un coût plus faible et des requêtes plus rapides."
  options:
    b:
      en: "Parquet files are immutable; changing rows means rewriting files or using a table format such as Apache Iceberg."
      fr: "Les fichiers Parquet sont immuables ; modifier des lignes implique de réécrire des fichiers ou d'utiliser un format de table comme Apache Iceberg."
    c:
      en: "Athena still needs a table definition in the Data Catalog to query Parquet files."
      fr: "Athena a toujours besoin d'une définition de table dans le catalogue de données pour interroger des fichiers Parquet."
    e:
      en: "Parquet is a compressed binary format; unlike CSV, it is not readable in a text editor."
      fr: "Parquet est un format binaire compressé ; contrairement au CSV, il n'est pas lisible dans un éditeur de texte."
references:
  - title: Using the Parquet format in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-format-parquet-home.html
  - title: What is Amazon Athena?
    url: https://docs.aws.amazon.com/athena/latest/ug/what-is.html
