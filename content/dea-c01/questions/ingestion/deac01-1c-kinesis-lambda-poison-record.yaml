id: deac01-1c-kinesis-lambda-poison-record
objective: "1.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function transforms records from an Amazon Kinesis Data Streams stream through an event source mapping with default error handling. A malformed record now makes the function return an error, and the IteratorAge metric of one shard keeps growing. The valid records of a failed batch must still be processed, processing must not stay blocked on a bad record, and the content of every discarded record must be kept after the stream retention period ends.

    Which combination of event source mapping settings will meet these requirements? (Choose three.)
  fr: |
    Une fonction AWS Lambda transforme les enregistrements d'un flux Amazon Kinesis Data Streams au moyen d'un mappage de source d'événement avec la gestion des erreurs par défaut. Un enregistrement mal formé fait maintenant renvoyer une erreur à la fonction, et la métrique IteratorAge d'une partition (shard) ne cesse d'augmenter. Les enregistrements valides d'un lot en échec doivent tout de même être traités, le traitement ne doit pas rester bloqué sur un enregistrement incorrect, et le contenu de chaque enregistrement abandonné doit être conservé après la fin de la période de rétention du flux.

    Quelle combinaison de paramètres du mappage de source d'événement répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Set BisectBatchOnFunctionError to true.", fr: "Définir BisectBatchOnFunctionError sur true." } }
    - { id: b, text: { en: "Set MaximumRetryAttempts to 2.", fr: "Définir MaximumRetryAttempts sur 2." } }
    - { id: c, text: { en: "Configure an Amazon SQS queue as the on-failure destination.", fr: "Configurer une file d'attente Amazon SQS comme destination en cas d'échec." } }
    - { id: d, text: { en: "Configure an Amazon S3 bucket as the on-failure destination.", fr: "Configurer un compartiment Amazon S3 comme destination en cas d'échec." } }
    - { id: e, text: { en: "Set ParallelizationFactor to 10.", fr: "Définir ParallelizationFactor sur 10." } }
    - { id: f, text: { en: "Increase the retention period of the stream to 7 days.", fr: "Augmenter la période de rétention du flux à 7 jours." } }
answer: { optionIds: [ a, b, d ] }
explanation:
  correct:
    en: "By default, Lambda retries a failed batch until the records expire, which blocks the shard. Bisecting splits a failed batch to isolate the bad record so that the valid halves succeed, and a retry limit makes Lambda discard the bad record and move on. An S3 on-failure destination receives the invocation metadata plus the original records in its payload field, so the content survives the stream retention."
    fr: "Par défaut, Lambda réessaie un lot en échec jusqu'à l'expiration des enregistrements, ce qui bloque la partition. La bissection divise un lot en échec pour isoler l'enregistrement incorrect afin que les moitiés valides réussissent, et une limite de nouvelles tentatives fait abandonner l'enregistrement incorrect par Lambda, qui passe à la suite. Une destination S3 en cas d'échec reçoit les métadonnées de l'appel ainsi que les enregistrements d'origine dans son champ payload : le contenu survit à la rétention du flux."
  options:
    c:
      en: "An SQS destination receives only metadata such as shard ID and sequence numbers; the records themselves are lost when they expire from the stream."
      fr: "Une destination SQS ne reçoit que des métadonnées comme l'ID de partition et les numéros de séquence ; les enregistrements eux-mêmes sont perdus lorsqu'ils expirent du flux."
    e:
      en: "More concurrent batches per shard do not stop the failing batch from being retried until its records expire."
      fr: "Davantage de lots simultanés par partition n'empêchent pas le lot en échec d'être réessayé jusqu'à l'expiration de ses enregistrements."
    f:
      en: "A longer retention keeps the shard blocked even longer, and the records are still deleted after 7 days."
      fr: "Une rétention plus longue bloque la partition encore plus longtemps, et les enregistrements sont tout de même supprimés au bout de 7 jours."
references:
  - title: Retain discarded batch records for a Kinesis Data Streams event source in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/kinesis-on-failure-destination.html
