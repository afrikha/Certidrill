id: deac01-1e-sam-definition-substitutions
objective: "1.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineering team deploys an AWS Step Functions workflow with AWS SAM. The Amazon States Language definition is kept in its own file, statemachine/ingest.asl.json, so that it can be reviewed separately. The workflow invokes an AWS Lambda function and writes to an Amazon DynamoDB table that are both created in the same template. The template is deployed as one stack per environment, so the function ARN and the table name differ in each stack and must not be hard-coded.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données déploie un flux de travail AWS Step Functions avec AWS SAM. La définition en Amazon States Language est conservée dans son propre fichier, statemachine/ingest.asl.json, afin d'être revue séparément. Le flux de travail appelle une fonction AWS Lambda et écrit dans une table Amazon DynamoDB, toutes deux créées dans le même modèle. Le modèle est déployé sous forme d'une pile par environnement : l'ARN de la fonction et le nom de la table diffèrent donc dans chaque pile et ne doivent pas être codés en dur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set DefinitionUri to the file, use placeholders such as ${ValidateFunctionArn} in it, and map them in DefinitionSubstitutions with !GetAtt and !Ref.", fr: "Définir DefinitionUri sur le fichier, y utiliser des espaces réservés tels que ${ValidateFunctionArn}, et les associer dans DefinitionSubstitutions avec !GetAtt et !Ref." } }
    - { id: b, text: { en: "Set DefinitionUri to the file, and write !GetAtt ValidateFunction.Arn and !Ref EventsTable directly in the JSON definition.", fr: "Définir DefinitionUri sur le fichier, et écrire !GetAtt ValidateFunction.Arn et !Ref EventsTable directement dans la définition JSON." } }
    - { id: c, text: { en: "Copy the content of the file into the Definition property of the state machine, and reference the resources with intrinsic functions.", fr: "Copier le contenu du fichier dans la propriété Definition de la machine d'état, et référencer les ressources avec des fonctions intrinsèques." } }
    - { id: d, text: { en: "Export the function ARN and the table name as stack outputs, and use Fn::ImportValue for them in the JSON definition.", fr: "Exporter l'ARN de la fonction et le nom de la table comme sorties de pile, et utiliser Fn::ImportValue pour eux dans la définition JSON." } }
answer: { optionId: a }
explanation:
  correct:
    en: "DefinitionUri accepts a local file path that sam deploy or sam package processes. DefinitionSubstitutions maps placeholder variables in the definition to values known at deployment, such as !GetAtt and !Ref results, so each stack gets its own ARN and table name while the definition stays in a separate file."
    fr: "DefinitionUri accepte un chemin de fichier local que sam deploy ou sam package traite. DefinitionSubstitutions associe les variables d'espace réservé de la définition à des valeurs connues au déploiement, comme les résultats de !GetAtt et !Ref : chaque pile obtient ainsi son propre ARN et son propre nom de table, et la définition reste dans un fichier séparé."
  options:
    b:
      en: "Intrinsic functions are not evaluated inside an external definition file; the text would be passed as is to Step Functions."
      fr: "Les fonctions intrinsèques ne sont pas évaluées dans un fichier de définition externe : le texte serait transmis tel quel à Step Functions."
    c:
      en: "An inline Definition works with intrinsic functions, but the requirement is to keep the definition in its own file."
      fr: "Une Definition intégrée fonctionne avec les fonctions intrinsèques, mais l'exigence est de conserver la définition dans son propre fichier."
    d:
      en: "Fn::ImportValue reads exports of other stacks and is not evaluated inside the JSON file either; the resources are in the same stack."
      fr: "Fn::ImportValue lit les exportations d'autres piles et n'est pas non plus évalué dans le fichier JSON ; les ressources sont dans la même pile."
references:
  - title: AWS::Serverless::StateMachine
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-statemachine.html
