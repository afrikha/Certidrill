id: deac01-1e-dist-spark-skew
objective: "1.4.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue for Apache Spark job joins a 5 TB transactions dataset with a 2 TB settlements dataset on merchant_id. A few merchants account for 40 % of the rows. In the Spark UI, the median task of the join stage runs for 2 minutes and the slowest task for 3 hours. The job sets spark.sql.adaptive.enabled=false. Both datasets also contain business_date, and every transaction matches its settlement on merchant_id and business_date.

    Which actions will reduce the duration of the join stage? (Choose two.)
  fr: |
    Une tâche AWS Glue pour Apache Spark joint un jeu de données de transactions de 5 To à un jeu de données de règlements de 2 To sur merchant_id. Quelques commerçants représentent 40 % des lignes. Dans l'interface Spark, la tâche médiane de l'étape de jointure dure 2 minutes et la plus lente 3 heures. La tâche définit spark.sql.adaptive.enabled=false. Les deux jeux de données contiennent aussi business_date, et chaque transaction correspond à son règlement sur merchant_id et business_date.

    Quelles actions réduiront la durée de l'étape de jointure ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn Adaptive Query Execution back on so that its skew join optimization splits the oversized partitions.", fr: "Réactiver l'exécution adaptative des requêtes (AQE) afin que son optimisation des jointures asymétriques fractionne les partitions surdimensionnées." } }
    - { id: b, text: { en: "Call coalesce(10) on both datasets before the join to reduce the number of partitions.", fr: "Appeler coalesce(10) sur les deux jeux de données avant la jointure pour réduire le nombre de partitions." } }
    - { id: c, text: { en: "Increase the memory of the Spark driver so that it can schedule the join tasks faster.", fr: "Augmenter la mémoire du pilote Spark afin qu'il planifie plus vite les tâches de jointure." } }
    - { id: d, text: { en: "Join on the composite key of merchant_id and business_date instead of merchant_id alone.", fr: "Joindre sur la clé composite merchant_id et business_date au lieu de merchant_id seul." } }
    - { id: e, text: { en: "Convert both datasets from Parquet to CSV so that each executor reads smaller rows.", fr: "Convertir les deux jeux de données de Parquet en CSV afin que chaque exécuteur lise des lignes plus petites." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A large gap between the median and the maximum task duration shows data skew: the rows of a few merchant_id values land in a few partitions. Adaptive Query Execution includes skew join handling that splits skewed partitions at runtime, and a higher-cardinality composite join key spreads the rows over more hash partitions."
    fr: "Un grand écart entre la durée médiane et la durée maximale des tâches révèle une asymétrie des données : les lignes de quelques valeurs de merchant_id tombent dans quelques partitions. L'exécution adaptative des requêtes comprend un traitement des jointures asymétriques qui fractionne les partitions déséquilibrées à l'exécution, et une clé de jointure composite de plus forte cardinalité répartit les lignes sur davantage de partitions de hachage."
  options:
    b:
      en: "Fewer partitions reduce parallelism and keep the skewed rows together, so the slowest task gets no faster."
      fr: "Moins de partitions réduisent le parallélisme et laissent les lignes asymétriques ensemble : la tâche la plus lente n'accélère pas."
    c:
      en: "The driver schedules tasks; the time is spent in a few executor tasks that process the skewed partitions."
      fr: "Le pilote planifie les tâches ; le temps est passé dans quelques tâches d'exécuteur qui traitent les partitions asymétriques."
    e:
      en: "CSV is a row format that Spark reads less efficiently than Parquet, and the format does not change how the join key distributes rows."
      fr: "CSV est un format en lignes que Spark lit moins efficacement que Parquet, et le format ne change pas la façon dont la clé de jointure répartit les lignes."
references:
  - title: Optimize shuffles
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/tuning-aws-glue-for-apache-spark/optimize-shuffles.html
  - title: Using Adaptive Query Execution
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/spark-tuning-glue-emr/using-adaptive-query-execution.html
