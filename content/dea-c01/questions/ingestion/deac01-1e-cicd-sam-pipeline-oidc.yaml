id: deac01-1e-cicd-sam-pipeline-oidc
objective: "1.4.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team builds a serverless data pipeline with AWS SAM. The code is in a GitHub repository, and the team wants a starter GitHub Actions pipeline with two deployment stages: a test account and a prod account. Security forbids long-term access keys in the CI/CD system. The solution must require the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une équipe crée un pipeline de données sans serveur avec AWS SAM. Le code se trouve dans un dépôt GitHub, et l'équipe veut un pipeline GitHub Actions de départ avec deux étapes de déploiement : un compte de test et un compte de production. La sécurité interdit les clés d'accès à long terme dans le système de CI/CD. La solution doit demander le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run sam pipeline init, create an IAM user in each account, and store the users' access keys as GitHub secrets.", fr: "Exécuter sam pipeline init, créer un utilisateur IAM dans chaque compte, et stocker les clés d'accès des utilisateurs comme secrets GitHub." } }
    - { id: b, text: { en: "Write a GitHub Actions workflow by hand that runs sam build and sam deploy for each account.", fr: "Écrire à la main un flux de travail GitHub Actions qui exécute sam build et sam deploy pour chaque compte." } }
    - { id: c, text: { en: "Run sam pipeline bootstrap for each stage with the default permissions provider, and then run sam pipeline init.", fr: "Exécuter sam pipeline bootstrap pour chaque étape avec le fournisseur d'autorisations par défaut, puis exécuter sam pipeline init." } }
    - { id: d, text: { en: "Run sam pipeline bootstrap for each stage with GitHub Actions OIDC permissions, then run sam pipeline init.", fr: "Exécuter sam pipeline bootstrap pour chaque étape avec des autorisations OIDC GitHub Actions, puis exécuter sam pipeline init." } }
answer: { optionId: d }
explanation:
  correct:
    en: "sam pipeline bootstrap creates, for one stage, the pipeline permissions, the CloudFormation execution role, and the artifact bucket; with the OIDC permissions provider for GitHub Actions, no access keys are created. sam pipeline init then generates a starter two-stage configuration in the syntax of GitHub Actions, which the team commits to the repository."
    fr: "sam pipeline bootstrap crée, pour une étape, les autorisations du pipeline, le rôle d'exécution CloudFormation et le compartiment d'artefacts ; avec le fournisseur d'autorisations OIDC pour GitHub Actions, aucune clé d'accès n'est créée. sam pipeline init génère ensuite une configuration de départ à deux étapes dans la syntaxe de GitHub Actions, que l'équipe valide dans le dépôt."
  options:
    a:
      en: "IAM user access keys are the long-term credentials that security forbids."
      fr: "Les clés d'accès d'utilisateurs IAM sont les informations d'identification à long terme que la sécurité interdit."
    b:
      en: "Writing the workflow and creating the roles and buckets by hand takes more effort than the generated starter pipeline."
      fr: "Écrire le flux de travail et créer à la main les rôles et les compartiments demande plus d'effort que le pipeline de départ généré."
    c:
      en: "The default permissions provider creates an IAM user with an access key ID and a secret key."
      fr: "Le fournisseur d'autorisations par défaut crée un utilisateur IAM avec un ID de clé d'accès et une clé secrète."
references:
  - title: sam pipeline bootstrap
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-cli-command-reference-sam-pipeline-bootstrap.html
  - title: Generate a starter CI/CD pipeline with AWS SAM
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-generating-example-ci-cd.html
