id: deac01-1c-glue-event-trigger-batch
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Store systems upload sales files to an Amazon S3 bucket throughout the day. An AWS CloudTrail trail logs the bucket's data events, and an Amazon EventBridge rule matches the PutObject events. An AWS Glue workflow must process the files in batches: a run must start when 100 files have arrived or 15 minutes after the first file of a batch, whichever comes first. No run must start when no file arrives. The company does not want to write custom code.

    Which solution will meet these requirements?
  fr: |
    Des systèmes de magasins chargent des fichiers de ventes dans un compartiment Amazon S3 tout au long de la journée. Un journal de suivi AWS CloudTrail consigne les événements de données du compartiment, et une règle Amazon EventBridge correspond aux événements PutObject. Un flux de travail AWS Glue doit traiter les fichiers par lots : une exécution doit démarrer lorsque 100 fichiers sont arrivés ou 15 minutes après le premier fichier d'un lot, selon la première éventualité. Aucune exécution ne doit démarrer en l'absence de fichier. L'entreprise ne veut pas écrire de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Give the workflow a schedule trigger that runs every 15 minutes, and target the workflow from the rule.", fr: "Doter le flux de travail d'un déclencheur planifié toutes les 15 minutes, et cibler le flux de travail depuis la règle." } }
    - { id: b, text: { en: "Give the workflow an on-demand trigger, and target a Lambda function from the rule that counts files and starts the workflow.", fr: "Doter le flux de travail d'un déclencheur à la demande, et cibler depuis la règle une fonction Lambda qui compte les fichiers et démarre le flux de travail." } }
    - { id: c, text: { en: "Give the workflow an EVENT trigger with a batch size of 100 and a batch window of 900 seconds, and target the workflow from the rule.", fr: "Doter le flux de travail d'un déclencheur EVENT avec une taille de lot de 100 et une fenêtre de lot de 900 secondes, et cibler le flux de travail depuis la règle." } }
    - { id: d, text: { en: "Give the workflow an EVENT trigger without a batching condition, and add a conditional trigger that waits for 100 job runs.", fr: "Doter le flux de travail d'un déclencheur EVENT sans condition de traitement par lots, et ajouter un déclencheur conditionnel qui attend 100 exécutions de tâche." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A Glue workflow can start from EventBridge events through an EVENT trigger, with the workflow as the rule target. The event batching condition starts a run when BatchSize events have arrived or when BatchWindow seconds have passed since the first event, whichever comes first; 900 seconds is both the default and the maximum window."
    fr: "Un flux de travail Glue peut démarrer à partir d'événements EventBridge au moyen d'un déclencheur EVENT, le flux de travail étant la cible de la règle. La condition de traitement par lots des événements démarre une exécution lorsque BatchSize événements sont arrivés ou lorsque BatchWindow secondes se sont écoulées depuis le premier événement, selon la première éventualité ; 900 secondes est à la fois la fenêtre par défaut et la fenêtre maximale."
  options:
    a:
      en: "A schedule trigger starts runs every 15 minutes even when no file has arrived, and a scheduled workflow does not consume the rule's events."
      fr: "Un déclencheur planifié démarre des exécutions toutes les 15 minutes même sans nouveau fichier, et un flux de travail planifié ne consomme pas les événements de la règle."
    b:
      en: "Counting files in a Lambda function is custom code that the company does not want to write."
      fr: "Compter les fichiers dans une fonction Lambda est du code personnalisé que l'entreprise ne veut pas écrire."
    d:
      en: "Without a batching condition, every file starts its own run, and conditional triggers watch job and crawler states, not file counts."
      fr: "Sans condition de traitement par lots, chaque fichier démarre sa propre exécution, et les déclencheurs conditionnels surveillent l'état des tâches et des robots, pas le nombre de fichiers."
references:
  - title: Starting an AWS Glue workflow with an Amazon EventBridge event
    url: https://docs.aws.amazon.com/glue/latest/dg/starting-workflow-eventbridge.html
