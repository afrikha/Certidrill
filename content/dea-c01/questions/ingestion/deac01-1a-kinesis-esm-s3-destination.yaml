id: deac01-1a-kinesis-esm-s3-destination
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon Kinesis data stream that has a 24-hour retention period. The event source mapping uses MaximumRetryAttempts set to 2 and an Amazon SQS queue as its on-failure destination. The operations team often investigates failures several days later and finds that it can no longer read the discarded records. The team needs the full content of every discarded batch without changing the stream retention.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda traite un flux de données Amazon Kinesis dont la période de conservation est de 24 heures. Le mappage de source d'événement utilise MaximumRetryAttempts défini à 2 et une file d'attente Amazon SQS comme destination en cas d'échec. L'équipe d'exploitation examine souvent les échecs plusieurs jours plus tard et constate qu'elle ne peut plus lire les enregistrements ignorés. L'équipe a besoin du contenu complet de chaque lot ignoré sans modifier la conservation du flux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the on-failure destination to an Amazon SNS topic that has an email subscription for the team.", fr: "Remplacer la destination en cas d'échec par une rubrique Amazon SNS avec un abonnement par e-mail pour l'équipe." } }
    - { id: b, text: { en: "Turn on BisectBatchOnFunctionError so that failed batches are split until the bad record is isolated.", fr: "Activer BisectBatchOnFunctionError afin que les lots en échec soient divisés jusqu'à isoler l'enregistrement défectueux." } }
    - { id: c, text: { en: "Increase the message retention period of the SQS queue to 14 days.", fr: "Porter la période de conservation des messages de la file d'attente SQS à 14 jours." } }
    - { id: d, text: { en: "Change the on-failure destination to an Amazon S3 bucket and grant the execution role the required S3 permissions.", fr: "Remplacer la destination en cas d'échec par un compartiment Amazon S3 et accorder au rôle d'exécution les autorisations S3 nécessaires." } }
answer: { optionId: d }
explanation:
  correct:
    en: "For a Kinesis event source mapping, records sent to an SQS queue or SNS topic contain only metadata, such as the shard ID and sequence numbers, which point back to the stream. Records sent to an S3 destination also include the full original event in a payload field, so the content survives after the stream retention expires."
    fr: "Pour un mappage de source d'événement Kinesis, les enregistrements envoyés à une file d'attente SQS ou à une rubrique SNS ne contiennent que des métadonnées, telles que l'identifiant de partition et les numéros de séquence, qui renvoient au flux. Les enregistrements envoyés à une destination S3 incluent aussi l'événement d'origine complet dans un champ payload : le contenu subsiste après l'expiration de la conservation du flux."
  options:
    a:
      en: "SNS records also contain only metadata, so the records would still be lost when the stream retention expires."
      fr: "Les enregistrements SNS ne contiennent eux aussi que des métadonnées : les enregistrements seraient toujours perdus à l'expiration de la conservation du flux."
    b:
      en: "Bisecting isolates bad records during retries but does not store their content anywhere."
      fr: "La division isole les enregistrements défectueux pendant les nouvelles tentatives, mais ne stocke leur contenu nulle part."
    c:
      en: "Keeping the SQS messages longer keeps only the metadata; the data in the stream still expires after 24 hours."
      fr: "Conserver plus longtemps les messages SQS ne conserve que les métadonnées ; les données du flux expirent toujours après 24 heures."
references:
  - title: Retain discarded batch records for a Kinesis Data Streams event source in Lambda - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/kinesis-on-failure-destination.html
