id: deac01-1d-cfn-iac-generator-existing
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Over two years, a company built its ingestion pipeline manually in the console: S3 buckets, AWS Glue jobs and crawlers, and Amazon Data Firehose streams. The company now wants to manage these resources as infrastructure as code with AWS CloudFormation, without recreating them, and then deploy a copy of the pipeline in a second Region.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    En deux ans, une entreprise a construit manuellement son pipeline d'ingestion dans la console : compartiments S3, tâches et robots d'analyse (crawlers) AWS Glue, et flux Amazon Data Firehose. L'entreprise veut maintenant gérer ces ressources en tant qu'infrastructure en tant que code avec AWS CloudFormation, sans les recréer, puis déployer une copie du pipeline dans une deuxième Région.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Write a new template by hand for all the resources and create a new stack from it in the current Region.", fr: "Écrire à la main un nouveau modèle pour toutes les ressources et créer une nouvelle pile à partir de ce modèle dans la Région actuelle." } }
    - { id: b, text: { en: "Run drift detection on the resources to generate a template that describes their current configuration.", fr: "Lancer la détection de dérive sur les ressources pour générer un modèle qui décrit leur configuration actuelle." } }
    - { id: c, text: { en: "Turn on AWS Config recording for the resources and deploy a conformance pack that tracks their configuration.", fr: "Activer l'enregistrement AWS Config pour les ressources et déployer un pack de conformité qui suit leur configuration." } }
    - { id: d, text: { en: "Use the CloudFormation IaC generator to scan the resources, generate a template, and import the resources into a stack.", fr: "Utiliser le générateur IaC de CloudFormation pour analyser les ressources, générer un modèle et importer les ressources dans une pile." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The IaC generator scans the resources of a Region that CloudFormation does not manage yet and builds a template from the selected resources and their related resources. The resources are then imported into a stack without being recreated, and the template can be used to replicate them in another account or Region."
    fr: "Le générateur IaC analyse les ressources d'une Région que CloudFormation ne gère pas encore et construit un modèle à partir des ressources choisies et de leurs ressources associées. Les ressources sont ensuite importées dans une pile sans être recréées, et le modèle peut servir à les répliquer dans un autre compte ou une autre Région."
  options:
    a: { en: "Writing every property by hand is a lot of effort, and creating a new stack would create duplicate resources instead of managing the existing ones.", fr: "Écrire chaque propriété à la main demande beaucoup d'effort, et créer une nouvelle pile créerait des ressources en double au lieu de gérer les ressources existantes." }
    b: { en: "Drift detection works only on resources that a stack already manages and does not generate templates.", fr: "La détection de dérive ne fonctionne que sur les ressources déjà gérées par une pile et ne génère pas de modèles." }
    c: { en: "A conformance pack evaluates resources against Config rules; it does not bring them under CloudFormation management.", fr: "Un pack de conformité évalue les ressources par rapport à des règles Config ; il ne les place pas sous la gestion de CloudFormation." }
references:
  - title: Generate templates from existing resources with IaC generator
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/generate-IaC.html
