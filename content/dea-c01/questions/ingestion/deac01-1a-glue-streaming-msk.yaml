id: deac01-1a-glue-streaming-msk
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company sends player events to an Amazon MSK cluster. The data team has Apache Spark code that cleans the events and joins them with a reference table. The team needs the results written continuously to an Amazon S3 data lake within a few minutes of each event, reusing the Spark code, without provisioning or managing clusters.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo envoie les événements des joueurs à un cluster Amazon MSK. L'équipe données dispose de code Apache Spark qui nettoie les événements et les joint à une table de référence. L'équipe a besoin que les résultats soient écrits en continu dans un lac de données Amazon S3 quelques minutes après chaque événement, en réutilisant le code Spark, sans provisionner ni gérer de clusters.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an AWS Glue batch ETL job every hour that reads the topic and uses job bookmarks to skip records already processed.", fr: "Exécuter toutes les heures une tâche ETL AWS Glue par lots qui lit la rubrique et utilise des signets de tâche pour ignorer les enregistrements déjà traités." } }
    - { id: b, text: { en: "Run an AWS Glue streaming ETL job that reads the topic through a Glue connection to the MSK cluster and writes to Amazon S3.", fr: "Exécuter une tâche ETL AWS Glue de streaming qui lit la rubrique via une connexion Glue au cluster MSK et écrit dans Amazon S3." } }
    - { id: c, text: { en: "Run Spark Structured Streaming on a long-running Amazon EMR on EC2 cluster that reads the topic and writes to Amazon S3.", fr: "Exécuter Spark Structured Streaming sur un cluster Amazon EMR on EC2 permanent qui lit la rubrique et écrit dans Amazon S3." } }
    - { id: d, text: { en: "Create an Amazon Data Firehose stream with the MSK topic as its source and an AWS Lambda transformation function.", fr: "Créer un flux Amazon Data Firehose avec la rubrique MSK comme source et une fonction de transformation AWS Lambda." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Glue streaming ETL jobs run Apache Spark continuously on serverless capacity, read from Amazon MSK through a Glue connection, and load the results into Amazon S3. By default they process data in 100-second windows, which meets the few-minutes latency."
    fr: "Les tâches ETL AWS Glue de streaming exécutent Apache Spark en continu sur une capacité sans serveur, lisent Amazon MSK via une connexion Glue et chargent les résultats dans Amazon S3. Par défaut, elles traitent les données par fenêtres de 100 secondes, ce qui respecte la latence de quelques minutes."
  options:
    a:
      en: "An hourly batch job cannot deliver results within a few minutes of each event."
      fr: "Une tâche par lots horaire ne peut pas fournir les résultats quelques minutes après chaque événement."
    c:
      en: "EMR on EC2 runs the Spark code, but the team must provision and manage the cluster."
      fr: "EMR on EC2 exécute le code Spark, mais l'équipe doit provisionner et gérer le cluster."
    d:
      en: "A Firehose transformation runs a Lambda function, not the team's Spark code, so the code would have to be rewritten."
      fr: "Une transformation Firehose exécute une fonction Lambda, pas le code Spark de l'équipe : il faudrait réécrire le code."
references:
  - title: Streaming ETL jobs in AWS Glue - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/add-job-streaming.html
