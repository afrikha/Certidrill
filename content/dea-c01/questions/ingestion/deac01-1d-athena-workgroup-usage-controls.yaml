id: deac01-1d-athena-workgroup-usage-controls
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A marketing analytics team queries a data lake with Amazon Athena in a dedicated workgroup. Any single query that scans more than 1 TB must be stopped automatically. The team lead must also receive an Amazon SNS notification when the queries of the workgroup scan more than 20 TB in total in one day.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une équipe d'analyse marketing interroge un lac de données avec Amazon Athena dans un groupe de travail dédié. Toute requête qui analyse plus de 1 To doit être arrêtée automatiquement. Le responsable de l'équipe doit aussi recevoir une notification Amazon SNS lorsque les requêtes du groupe de travail analysent plus de 20 To au total en une journée.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable query result reuse in the workgroup so that repeated queries do not scan the data again.", fr: "Activer la réutilisation des résultats de requête dans le groupe de travail pour que les requêtes répétées n'analysent pas à nouveau les données." } }
    - { id: b, text: { en: "Set a per-query data usage control of 1 TB on the workgroup.", fr: "Définir sur le groupe de travail un contrôle d'utilisation des données par requête de 1 To." } }
    - { id: c, text: { en: "Set a workgroup-wide data usage control of 1 TB per hour so that Athena cancels the queries that exceed it.", fr: "Définir un contrôle d'utilisation des données à l'échelle du groupe de travail de 1 To par heure pour qu'Athena annule les requêtes qui le dépassent." } }
    - { id: d, text: { en: "Set a per-query data usage control of 20 TB with an SNS topic as its action.", fr: "Définir un contrôle d'utilisation des données par requête de 20 To avec une rubrique SNS comme action." } }
    - { id: e, text: { en: "Set a workgroup-wide data usage control of 20 TB per day with an alarm that notifies the SNS topic.", fr: "Définir un contrôle d'utilisation des données à l'échelle du groupe de travail de 20 To par jour avec une alarme qui notifie la rubrique SNS." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A per-query data usage control cancels any query of the workgroup that scans more than its limit; cancel is its only action. A workgroup-wide data usage control aggregates the data scanned over an hourly or daily period and raises a CloudWatch alarm that can notify an SNS topic, without canceling queries.
    fr: |
      Un contrôle d'utilisation des données par requête annule toute requête du groupe de travail qui analyse plus que sa limite ; l'annulation est sa seule action. Un contrôle à l'échelle du groupe de travail agrège les données analysées sur une période horaire ou quotidienne et déclenche une alarme CloudWatch qui peut notifier une rubrique SNS, sans annuler de requêtes.
  options:
    a: { en: "Result reuse can lower the data scanned, but it neither stops a large query nor sends a notification.", fr: "La réutilisation des résultats peut réduire les données analysées, mais elle n'arrête aucune requête volumineuse et n'envoie aucune notification." }
    c: { en: "Workgroup-wide controls only raise alarms; they never cancel queries, and they measure the total of all queries, not each query.", fr: "Les contrôles à l'échelle du groupe de travail ne font que déclencher des alarmes ; ils n'annulent jamais de requêtes et mesurent le total de toutes les requêtes, pas chaque requête." }
    d: { en: "A per-query control can only cancel the query, and it evaluates each query separately, not the daily total of the workgroup.", fr: "Un contrôle par requête ne peut qu'annuler la requête, et il évalue chaque requête séparément, pas le total quotidien du groupe de travail." }
references:
  - title: Configure per-query and per-workgroup data usage controls
    url: https://docs.aws.amazon.com/athena/latest/ug/workgroups-setting-control-limits-cloudwatch.html
