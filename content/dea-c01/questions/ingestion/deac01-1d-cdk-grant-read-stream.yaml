id: deac01-1d-cdk-grant-read-stream
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer defines an ingestion stack with the AWS CDK in Python:

    ```python
    stream = kinesis.Stream(self, "Clicks", shard_count=4)
    consumer = _lambda.Function(self, "ClickConsumer",
        runtime=_lambda.Runtime.PYTHON_3_13,
        handler="app.handler",
        code=_lambda.Code.from_asset("consumer"))
    ```

    The function reads records from the stream with the AWS SDK. Its execution role must receive only the permissions needed to read this stream, with the least code.

    Which line should the engineer add to the stack?
  fr: |
    Un ingénieur de données définit une pile d'ingestion avec l'AWS CDK en Python :

    ```python
    stream = kinesis.Stream(self, "Clicks", shard_count=4)
    consumer = _lambda.Function(self, "ClickConsumer",
        runtime=_lambda.Runtime.PYTHON_3_13,
        handler="app.handler",
        code=_lambda.Code.from_asset("consumer"))
    ```

    La fonction lit les enregistrements du flux avec l'AWS SDK. Son rôle d'exécution ne doit recevoir que les autorisations nécessaires pour lire ce flux, avec le moins de code possible.

    Quelle ligne l'ingénieur doit-il ajouter à la pile ?
body:
  options:
    - { id: a, text: "`consumer.role.add_managed_policy(iam.ManagedPolicy.from_aws_managed_policy_name(\"AmazonKinesisFullAccess\"))`" }
    - { id: b, text: "`stream.grant_read(consumer)`" }
    - { id: c, text: "`consumer.add_to_role_policy(iam.PolicyStatement(actions=[\"kinesis:*\"], resources=[\"*\"]))`" }
    - { id: d, text: "`stream.grant_write(consumer)`" }
answer: { optionId: b }
explanation:
  correct:
    en: "CDK grant methods add the permissions needed for an access pattern to the principal that is passed, here the execution role of the function, without listing IAM actions by hand. grant_read gives read access to this stream only."
    fr: "Les méthodes grant du CDK ajoutent au principal passé en argument, ici le rôle d'exécution de la fonction, les autorisations nécessaires pour un mode d'accès, sans lister les actions IAM à la main. grant_read donne un accès en lecture à ce seul flux."
  options:
    a: { en: "The managed policy allows every Kinesis action on every stream, far beyond reading one stream.", fr: "La politique gérée autorise toutes les actions Kinesis sur tous les flux, bien au-delà de la lecture d'un flux." }
    c: { en: "kinesis:* on every resource grants all actions on all streams, which is not least privilege.", fr: "kinesis:* sur toutes les ressources accorde toutes les actions sur tous les flux, ce qui n'est pas le moindre privilège." }
    d: { en: "grant_write gives permissions to put records into the stream, not to read them.", fr: "grant_write donne les autorisations d'écrire des enregistrements dans le flux, pas de les lire." }
references:
  - title: Permissions and the AWS CDK
    url: https://docs.aws.amazon.com/cdk/v2/guide/permissions.html
