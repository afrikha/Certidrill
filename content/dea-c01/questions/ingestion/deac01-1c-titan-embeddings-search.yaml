id: deac01-1c-titan-embeddings-search
objective: "1.2.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retailer stores 2 million product descriptions in Amazon S3. The company wants shoppers to find products by meaning, so that a search for "warm winter jacket" also returns an "insulated parka". A data pipeline must prepare the descriptions for this semantic search.

    Which solution will meet these requirements?
  fr: |
    Un détaillant stocke 2 millions de descriptions de produits dans Amazon S3. L'entreprise veut que les clients trouvent les produits par leur sens, de sorte qu'une recherche « warm winter jacket » renvoie aussi une « insulated parka ». Un pipeline de données doit préparer les descriptions pour cette recherche sémantique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Load the descriptions into an Amazon Aurora PostgreSQL table with a B-tree index on the description column.", fr: "Charger les descriptions dans une table Amazon Aurora PostgreSQL avec un index B-tree sur la colonne de description." } }
    - { id: b, text: { en: "Catalog the descriptions with an AWS Glue crawler and run Amazon Athena queries with LIKE filters on keywords.", fr: "Cataloguer les descriptions avec un robot d'analyse AWS Glue et exécuter des requêtes Amazon Athena avec des filtres LIKE sur des mots clés." } }
    - { id: c, text: { en: "Generate embeddings with Amazon Titan Text Embeddings V2 in Amazon Bedrock, and store them in an Amazon OpenSearch Service vector index.", fr: "Générer des plongements avec Amazon Titan Text Embeddings V2 dans Amazon Bedrock, et les stocker dans un index vectoriel Amazon OpenSearch Service." } }
    - { id: d, text: { en: "Summarize each description with a text generation model in Amazon Bedrock, and store the summaries in an Amazon DynamoDB table.", fr: "Résumer chaque description avec un modèle de génération de texte dans Amazon Bedrock, et stocker les résumés dans une table Amazon DynamoDB." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An embeddings model turns text into a vector that captures its meaning, so similar descriptions get nearby vectors. Titan Text Embeddings V2 produces vectors of 1,024, 512 or 256 dimensions for retrieval and semantic similarity, and a vector index finds the nearest vectors to the embedding of the search text."
    fr: "Un modèle de plongement (embeddings) transforme un texte en vecteur qui en capture le sens : des descriptions proches obtiennent des vecteurs proches. Titan Text Embeddings V2 produit des vecteurs de 1 024, 512 ou 256 dimensions pour la recherche et la similarité sémantique, et un index vectoriel trouve les vecteurs les plus proches du plongement du texte recherché."
  options:
    a:
      en: "A B-tree index supports exact and range matches on the text, not similarity of meaning."
      fr: "Un index B-tree prend en charge les correspondances exactes et par plage sur le texte, pas la similarité de sens."
    b:
      en: "LIKE filters match keywords literally, so a parka without the word jacket is not found."
      fr: "Les filtres LIKE recherchent les mots clés littéralement : une parka sans le mot jacket n'est pas trouvée."
    d:
      en: "Summaries are still text, and a key-value table cannot search them by meaning."
      fr: "Les résumés restent du texte, et une table clé-valeur ne peut pas les rechercher par leur sens."
references:
  - title: Amazon Titan Text Embeddings models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
