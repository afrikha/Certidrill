id: deac01-1c-unload-parquet-partition
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to export its `sales` table from Amazon Redshift to an Amazon S3 data lake. Amazon Athena will query the files, so they must be Apache Parquet files in Hive-style folders by `year` and `month`. The Redshift cluster has a default IAM role that can write to the bucket.

    Which statement will meet these requirements?
  fr: |
    Une entreprise veut exporter sa table `sales` d'Amazon Redshift vers un lac de données Amazon S3. Amazon Athena interrogera les fichiers : il doit donc s'agir de fichiers Apache Parquet dans des dossiers de style Hive par `year` et `month`. Le cluster Redshift dispose d'un rôle IAM par défaut qui peut écrire dans le compartiment.

    Quelle instruction répond à ces exigences ?
body:
  options:
    - { id: a, text: "`UNLOAD ('select * from sales') TO 's3://example-lake/sales/' IAM_ROLE default FORMAT PARQUET GZIP PARTITION BY (year, month);`" }
    - { id: b, text: "`UNLOAD ('select * from sales') TO 's3://example-lake/sales/' IAM_ROLE default DELIMITER ',' HEADER PARTITION BY (year, month);`" }
    - { id: c, text: "`UNLOAD ('select * from sales') TO 's3://example-lake/sales/' IAM_ROLE default FORMAT PARQUET PARTITION BY (year, month);`" }
    - { id: d, text: "`UNLOAD ('select * from sales') TO 's3://example-lake/sales/' IAM_ROLE default FORMAT PARQUET PARALLEL OFF;`" }
answer: { optionId: c }
explanation:
  correct:
    en: "FORMAT PARQUET writes Parquet files whose row groups are Snappy-compressed by default, and PARTITION BY writes Hive-style folders such as year=2026/month=11. UNLOAD does not update a catalog, so the partitions must then be registered, for example with a crawler or ALTER TABLE ADD PARTITION."
    fr: "FORMAT PARQUET écrit des fichiers Parquet dont les groupes de lignes sont compressés en Snappy par défaut, et PARTITION BY écrit des dossiers de style Hive comme year=2026/month=11. UNLOAD ne met à jour aucun catalogue : les partitions doivent ensuite être enregistrées, par exemple avec un robot d'analyse ou ALTER TABLE ADD PARTITION."
  options:
    a:
      en: "PARQUET cannot be combined with GZIP, BZIP2 or ZSTD file compression, so the statement fails."
      fr: "PARQUET ne peut pas être combiné avec la compression de fichiers GZIP, BZIP2 ou ZSTD : l'instruction échoue."
    b:
      en: "DELIMITER and HEADER produce delimited text files, not Parquet."
      fr: "DELIMITER et HEADER produisent des fichiers texte délimités, pas du Parquet."
    d:
      en: "This writes Parquet serially without PARTITION BY, so there are no year and month folders."
      fr: "Cette instruction écrit du Parquet en série sans PARTITION BY : il n'y a pas de dossiers year et month."
references:
  - title: UNLOAD
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_UNLOAD.html
