id: deac01-1d-kds-on-demand-spikes
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany ingests gameplay events from a mobile game into an Amazon Kinesis data stream that uses provisioned capacity mode with four shards. When a new game level is released, write traffic roughly doubles for a few hours, and producers receive ProvisionedThroughputExceededException errors. The release dates are not known in advance, and the team does not want to forecast traffic or change the shard count.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany ingère les événements de jeu d'une application mobile dans un flux de données Amazon Kinesis qui utilise le mode de capacité provisionné avec quatre partitions (shards). Lorsqu'un nouveau niveau de jeu est publié, le trafic d'écriture double environ pendant quelques heures et les producteurs reçoivent des erreurs ProvisionedThroughputExceededException. Les dates de publication ne sont pas connues à l'avance, et l'équipe ne veut ni prévoir le trafic ni modifier le nombre de partitions.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Switch the data stream to on-demand capacity mode.", fr: "Passer le flux de données en mode de capacité à la demande (on-demand)." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on write throttling that invokes a Lambda function to call UpdateShardCount.", fr: "Créer une alarme CloudWatch sur la limitation des écritures qui appelle une fonction Lambda chargée d'exécuter UpdateShardCount." } }
    - { id: c, text: { en: "Register an enhanced fan-out consumer for each application that reads from the stream.", fr: "Enregistrer un consommateur à diffusion améliorée (enhanced fan-out) pour chaque application qui lit le flux." } }
    - { id: d, text: { en: "Increase the retention period of the data stream to 7 days.", fr: "Porter la période de conservation du flux de données à 7 jours." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In on-demand mode, Kinesis Data Streams manages capacity automatically and accommodates up to double the peak write throughput observed in the previous 30 days. No shard planning or scaling automation is needed, which suits unpredictable traffic."
    fr: "En mode à la demande, Kinesis Data Streams gère la capacité automatiquement et absorbe jusqu'au double du pic de débit d'écriture observé au cours des 30 jours précédents. Aucune planification des partitions ni automatisation de la mise à l'échelle n'est nécessaire, ce qui convient à un trafic imprévisible."
  options:
    b: { en: "This can work, but the team must build, test, and maintain the scaling automation, which is more overhead than letting the stream scale itself.", fr: "Cela peut fonctionner, mais l'équipe doit créer, tester et maintenir l'automatisation de la mise à l'échelle, ce qui demande plus d'effort que de laisser le flux s'adapter seul." }
    c: { en: "Enhanced fan-out gives each consumer dedicated read throughput; it does not add write capacity for the producers.", fr: "La diffusion améliorée donne à chaque consommateur un débit de lecture dédié ; elle n'ajoute aucune capacité d'écriture pour les producteurs." }
    d: { en: "Retention controls how long records stay readable; it has no effect on write throughput per shard.", fr: "La conservation détermine combien de temps les enregistrements restent lisibles ; elle n'a aucun effet sur le débit d'écriture par partition." }
references:
  - title: Choose the right mode to stream in
    url: https://docs.aws.amazon.com/streams/latest/dev/how-do-i-size-a-stream.html
