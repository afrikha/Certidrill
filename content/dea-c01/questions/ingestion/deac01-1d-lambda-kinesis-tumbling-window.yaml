id: deac01-1d-lambda-kinesis-tumbling-window
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company streams machine events to an Amazon Kinesis data stream. A Lambda function that reads the stream through an event source mapping must compute the number of events per machine for each 5-minute interval and write the totals to Amazon S3 at the end of each interval. The company does not want to add a database to keep the running counts.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle diffuse des événements de machines dans un flux de données Amazon Kinesis. Une fonction Lambda qui lit le flux via un mappage de source d'événements doit calculer le nombre d'événements par machine pour chaque intervalle de 5 minutes et écrire les totaux dans Amazon S3 à la fin de chaque intervalle. L'entreprise ne veut pas ajouter de base de données pour conserver les compteurs intermédiaires.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set a 300-second tumbling window on the mapping, return the counts as state, and write the totals on the final invocation of each window.", fr: "Définir une fenêtre bascule (tumbling window) de 300 secondes sur le mappage, renvoyer les compteurs comme état et écrire les totaux lors de l'appel final de chaque fenêtre." } }
    - { id: b, text: { en: "Keep the running counts in a global variable outside the handler, and write them to S3 when 5 minutes have passed since the last write.", fr: "Conserver les compteurs dans une variable globale hors du gestionnaire, et les écrire dans S3 lorsque 5 minutes se sont écoulées depuis la dernière écriture." } }
    - { id: c, text: { en: "Set the batching window of the mapping to 300 seconds, and compute and write the totals of each batch that the function receives.", fr: "Définir la fenêtre de traitement par lots du mappage sur 300 secondes, et calculer et écrire les totaux de chaque lot reçu par la fonction." } }
    - { id: d, text: { en: "Keep the running counts in a file in the /tmp directory, and write the file to S3 when 5 minutes have passed since the last write.", fr: "Conserver les compteurs dans un fichier du répertoire /tmp, et écrire le fichier dans S3 lorsque 5 minutes se sont écoulées depuis la dernière écriture." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A tumbling window lets Lambda keep state across invocations without an external store: each invocation receives the aggregated state of the current window and returns the updated state. At the end of the window, Lambda invokes the function with isFinalInvokeForWindow set to true, which is when the totals are written."
    fr: "Une fenêtre bascule permet à Lambda de conserver un état entre les appels sans stockage externe : chaque appel reçoit l'état agrégé de la fenêtre en cours et renvoie l'état mis à jour. À la fin de la fenêtre, Lambda appelle la fonction avec isFinalInvokeForWindow défini sur true, moment où les totaux sont écrits."
  options:
    b: { en: "Each execution environment has its own memory, and concurrent or recycled environments lose or split the counts.", fr: "Chaque environnement d'exécution a sa propre mémoire, et les environnements simultanés ou recyclés perdent ou fragmentent les compteurs." }
    c: { en: "A batch is sent early when it is full or reaches 6 MB, so batches are not aligned with fixed 5-minute intervals and no state is carried between them.", fr: "Un lot est envoyé plus tôt lorsqu'il est plein ou atteint 6 Mo : les lots ne sont pas alignés sur des intervalles fixes de 5 minutes, et aucun état n'est transmis de l'un à l'autre." }
    d: { en: "The /tmp directory belongs to one execution environment, so the counts are split across environments and lost when an environment is recycled.", fr: "Le répertoire /tmp appartient à un seul environnement d'exécution : les compteurs sont répartis entre environnements et perdus lorsqu'un environnement est recyclé." }
references:
  - title: Implementing stateful Kinesis Data Streams processing in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-windows.html
