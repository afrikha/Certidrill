id: deac01-1e-dist-redshift-collocation
objective: "1.4.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Redshift provisioned cluster stores an orders table with 3 billion rows and an order_items table with 12 billion rows. Both tables use DISTSTYLE EVEN and are loaded every hour. Most queries join the two tables on order_id, and the query plans show DS_DIST_BOTH for this join. The company wants to reduce the data that moves between the compute nodes during the join.

    Which solution will meet these requirements?
  fr: |
    Un cluster provisionné Amazon Redshift stocke une table orders de 3 milliards de lignes et une table order_items de 12 milliards de lignes. Les deux tables utilisent DISTSTYLE EVEN et sont chargées toutes les heures. La plupart des requêtes joignent les deux tables sur order_id, et les plans de requête affichent DS_DIST_BOTH pour cette jointure. L'entreprise veut réduire les données qui circulent entre les nœuds de calcul pendant la jointure.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change order_items to DISTSTYLE ALL so that a full copy of the table is stored on every node.", fr: "Passer order_items en DISTSTYLE ALL afin qu'une copie complète de la table soit stockée sur chaque nœud." } }
    - { id: b, text: { en: "Make order_id the first column of a compound sort key on both tables, and keep DISTSTYLE EVEN.", fr: "Faire d'order_id la première colonne d'une clé de tri composée sur les deux tables, et conserver DISTSTYLE EVEN." } }
    - { id: c, text: { en: "Add compute nodes to the cluster so that each slice processes fewer rows during the join.", fr: "Ajouter des nœuds de calcul au cluster afin que chaque tranche traite moins de lignes pendant la jointure." } }
    - { id: d, text: { en: "Set order_id as the distribution key of both tables so that matching rows are stored on the same slice.", fr: "Définir order_id comme clé de distribution des deux tables afin que les lignes correspondantes soient stockées sur la même tranche." } }
answer: { optionId: d }
explanation:
  correct:
    en: "DS_DIST_BOTH means that both tables are redistributed across the nodes for the join. When both tables are distributed on the join column, rows with the same order_id are on the same slice, so each slice joins its rows locally and the plan shows DS_DIST_NONE."
    fr: "DS_DIST_BOTH signifie que les deux tables sont redistribuées entre les nœuds pour la jointure. Quand les deux tables sont distribuées sur la colonne de jointure, les lignes de même order_id se trouvent sur la même tranche : chaque tranche joint ses lignes localement et le plan affiche DS_DIST_NONE."
  options:
    a:
      en: "ALL distribution copies a 12-billion-row table to every node, which multiplies storage and slows the hourly loads; it suits small tables that change rarely."
      fr: "La distribution ALL copie une table de 12 milliards de lignes sur chaque nœud, ce qui multiplie le stockage et ralentit les chargements horaires ; elle convient aux petites tables peu modifiées."
    b:
      en: "A sort key orders rows within each slice; it does not place matching rows on the same slice, so both tables are still redistributed."
      fr: "Une clé de tri ordonne les lignes dans chaque tranche ; elle ne place pas les lignes correspondantes sur la même tranche : les deux tables sont toujours redistribuées."
    c:
      en: "More nodes add capacity, but with EVEN distribution the join still redistributes both tables across the network."
      fr: "Plus de nœuds ajoutent de la capacité, mais avec la distribution EVEN la jointure redistribue toujours les deux tables sur le réseau."
references:
  - title: Evaluating the query plan
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_data_redistribution.html
