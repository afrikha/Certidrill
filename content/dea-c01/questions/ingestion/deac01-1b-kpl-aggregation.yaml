id: deac01-1b-kpl-aggregation
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company sends player events of about 200 bytes each to an Amazon Kinesis data stream in provisioned mode with 4 shards. At peak, producers send 6,000 events per second, about 1.2 MB per second in total, and they receive ProvisionedThroughputExceededException errors. The consumers use the Kinesis Client Library (KCL). The company does not want to add shards.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo envoie des événements de joueurs d'environ 200 octets chacun vers un flux de données Amazon Kinesis en mode provisionné avec 4 partitions. Au pic, les producteurs envoient 6 000 événements par seconde, soit environ 1,2 Mo par seconde au total, et reçoivent des erreurs ProvisionedThroughputExceededException. Les consommateurs utilisent la bibliothèque client Kinesis (KCL). L'entreprise ne veut pas ajouter de partitions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use the Kinesis Producer Library with aggregation so that many events are packed into each Kinesis record.", fr: "Utiliser la bibliothèque producteur Kinesis (KPL) avec l'agrégation pour regrouper de nombreux événements dans chaque enregistrement Kinesis." }
    - id: b
      text: { en: "Replace the PutRecords calls of the producers with one PutRecord call for each event.", fr: "Remplacer les appels PutRecords des producteurs par un appel PutRecord pour chaque événement." }
    - id: c
      text: { en: "Register the consumers as enhanced fan-out consumers to give each shard more throughput for writes.", fr: "Enregistrer les consommateurs comme consommateurs à diffusion améliorée pour donner à chaque partition plus de débit d'écriture." }
    - id: d
      text: { en: "Increase the retention period of the stream so that throttled events stay available longer.", fr: "Augmenter la période de conservation du flux pour que les événements limités restent disponibles plus longtemps." }
answer: { optionId: a }
explanation:
  correct:
    en: "Each shard accepts up to 1,000 records or 1 MB per second of writes. The 4 shards accept 4,000 records per second, so 6,000 small events hit the record limit long before the byte limit. KPL aggregation stores many user records in one Kinesis record, which cuts the record rate, and the KCL deaggregates the records for the consumers."
    fr: "Chaque partition accepte en écriture jusqu'à 1 000 enregistrements ou 1 Mo par seconde. Les 4 partitions acceptent 4 000 enregistrements par seconde : 6 000 petits événements atteignent la limite d'enregistrements bien avant la limite d'octets. L'agrégation KPL stocke de nombreux enregistrements utilisateur dans un seul enregistrement Kinesis, ce qui réduit le nombre d'enregistrements, et la KCL désagrège les enregistrements pour les consommateurs."
  options:
    b:
      en: "One call per event sends the same number of records and adds HTTP requests, so the record limit is still exceeded."
      fr: "Un appel par événement envoie le même nombre d'enregistrements et ajoute des requêtes HTTP : la limite d'enregistrements est toujours dépassée."
    c:
      en: "Enhanced fan-out gives each consumer dedicated read throughput; it does not change the write limits of the shards."
      fr: "La diffusion améliorée donne à chaque consommateur un débit de lecture dédié ; elle ne modifie pas les limites d'écriture des partitions."
    d:
      en: "Retention applies to records that were written; throttled events were never written to the stream."
      fr: "La conservation s'applique aux enregistrements écrits ; les événements limités n'ont jamais été écrits dans le flux."
references:
  - title: KPL key concepts
    url: https://docs.aws.amazon.com/streams/latest/dev/kinesis-kpl-concepts.html
  - title: Quotas and limits
    url: https://docs.aws.amazon.com/streams/latest/dev/service-sizes-and-limits.html
