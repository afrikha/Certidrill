id: deac01-1c-relationalize-nested
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer exports orders as nested JSON documents. Each order contains a customer structure and an array of line items. An AWS Glue job must turn the documents into flat tables that can be loaded into Amazon Redshift, with the line items in their own table that can be joined back to the orders.

    Which AWS Glue transform should the job use?
  fr: |
    Un détaillant en ligne exporte des commandes sous forme de documents JSON imbriqués. Chaque commande contient une structure client et un tableau de lignes de commande. Une tâche AWS Glue doit transformer les documents en tables plates pouvant être chargées dans Amazon Redshift, avec les lignes de commande dans leur propre table qui peut être jointe aux commandes.

    Quelle transformation AWS Glue la tâche doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Relationalize, which flattens nested fields and pivots arrays into separate tables", fr: "Relationalize, qui aplatit les champs imbriqués et extrait les tableaux dans des tables distinctes" } }
    - { id: b, text: { en: "ApplyMapping, which renames source fields and casts them to new data types", fr: "ApplyMapping, qui renomme les champs source et les convertit vers de nouveaux types de données" } }
    - { id: c, text: { en: "ResolveChoice, which resolves fields whose data type differs between records", fr: "ResolveChoice, qui résout les champs dont le type de données diffère d'un enregistrement à l'autre" } }
    - { id: d, text: { en: "DropNullFields, which removes fields whose values are all null", fr: "DropNullFields, qui supprime les champs dont toutes les valeurs sont nulles" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Relationalize flattens the nested schema of a DynamicFrame and pivots array columns out into separate tables. Each pivoted table can be joined back to the root table with the join key generated during unnesting, which gives relational tables for Redshift."
    fr: "Relationalize aplatit le schéma imbriqué d'un DynamicFrame et extrait les colonnes de type tableau dans des tables distinctes. Chaque table extraite peut être jointe à la table racine avec la clé de jointure générée lors de la désimbrication, ce qui donne des tables relationnelles pour Redshift."
  options:
    b:
      en: "ApplyMapping renames and casts fields; it does not pivot the line item array into its own table."
      fr: "ApplyMapping renomme et convertit des champs ; il ne transforme pas le tableau de lignes de commande en table distincte."
    c:
      en: "ResolveChoice handles ambiguous types; the nested structure and the array remain."
      fr: "ResolveChoice gère les types ambigus ; la structure imbriquée et le tableau demeurent."
    d:
      en: "DropNullFields removes empty fields; it does not flatten structures or arrays."
      fr: "DropNullFields supprime les champs vides ; il n'aplatit ni les structures ni les tableaux."
references:
  - title: Relationalize class
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-crawler-pyspark-transforms-Relationalize.html
