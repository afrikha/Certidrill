id: deac01-1a-secrets-lambda-extension
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function is invoked thousands of times per minute to call a partner's data API. On every invocation, the function calls the Secrets Manager GetSecretValue API to read the partner API key, which adds latency and Secrets Manager API costs. The key is rotated once a month, so a value up to 5 minutes old is acceptable. The company wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda est appelée des milliers de fois par minute pour interroger l'API de données d'un partenaire. À chaque appel, la fonction appelle l'API GetSecretValue de Secrets Manager pour lire la clé d'API du partenaire, ce qui ajoute de la latence et des frais d'API Secrets Manager. La clé est renouvelée une fois par mois : une valeur datant de 5 minutes au plus est acceptable. L'entreprise veut le MOINS d'effort de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the AWS Parameters and Secrets Lambda Extension to the function and read the key from its local endpoint.", fr: "Ajouter l'extension AWS Parameters and Secrets Lambda à la fonction et lire la clé depuis son point de terminaison local." } }
    - { id: b, text: { en: "Copy the key into a Lambda environment variable during each rotation and read the variable in the function.", fr: "Copier la clé dans une variable d'environnement Lambda à chaque rotation et lire la variable dans la fonction." } }
    - { id: c, text: { en: "Store the key in an Amazon DynamoDB table and read the item on every invocation.", fr: "Stocker la clé dans une table Amazon DynamoDB et lire l'élément à chaque appel." } }
    - { id: d, text: { en: "Deploy an Amazon ElastiCache cluster that caches the key and have the function read it from the cache.", fr: "Déployer un cluster Amazon ElastiCache qui met la clé en cache et faire lire la clé dans le cache par la fonction." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The extension keeps a local cache of secrets and serves them on a localhost endpoint. A cached secret is returned without calling Secrets Manager until it expires, 300 seconds by default, which cuts latency and API costs with only a small code change."
    fr: "L'extension conserve un cache local des secrets et les sert sur un point de terminaison localhost. Un secret en cache est renvoyé sans appel à Secrets Manager jusqu'à son expiration, 300 secondes par défaut, ce qui réduit la latence et les frais d'API avec une simple modification du code."
  options:
    b:
      en: "This puts the key in the function configuration and needs custom automation to update the variable after each rotation."
      fr: "Cette solution place la clé dans la configuration de la fonction et exige une automatisation personnalisée pour mettre à jour la variable après chaque rotation."
    c:
      en: "Reading DynamoDB on every invocation still adds a call per invocation and requires custom code to keep the copy in sync with the secret."
      fr: "Lire DynamoDB à chaque appel ajoute toujours un appel par invocation et exige du code personnalisé pour synchroniser la copie avec le secret."
    d:
      en: "A cache cluster is extra infrastructure to deploy, secure and pay for, which is far more effort than the extension."
      fr: "Un cluster de cache est une infrastructure supplémentaire à déployer, sécuriser et payer, bien plus coûteuse en effort que l'extension."
references:
  - title: Use Secrets Manager secrets in Lambda Event Functions - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-secrets-manager.html
