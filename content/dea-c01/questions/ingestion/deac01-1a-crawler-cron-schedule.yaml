id: deac01-1a-crawler-cron-schedule
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's source system finishes writing the previous day's files to Amazon S3 by 01:30 UTC. An AWS Glue crawler must then update the Data Catalog every day at 02:00 UTC. The company wants the LEAST operational overhead and does not want to add other AWS services.

    Which solution will meet these requirements?
  fr: |
    Le système source d'une entreprise termine d'écrire les fichiers de la veille dans Amazon S3 avant 01 h 30 UTC. Un robot d'analyse AWS Glue doit ensuite mettre à jour le Data Catalog chaque jour à 02 h 00 UTC. L'entreprise veut le MOINS de charge opérationnelle et ne veut pas ajouter d'autres services AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon EventBridge Scheduler schedule that invokes an AWS Lambda function that calls StartCrawler at 02:00 UTC.", fr: "Créer une planification Amazon EventBridge Scheduler qui appelle une fonction AWS Lambda qui exécute StartCrawler à 02 h 00 UTC." } }
    - { id: b, text: { en: "Create an Amazon MWAA environment with a DAG that starts the crawler every day at 02:00 UTC.", fr: "Créer un environnement Amazon MWAA avec un DAG qui démarre le robot d'analyse chaque jour à 02 h 00 UTC." } }
    - { id: c, text: { en: "Configure an S3 Event Notification that starts the crawler when the last file of the day is written.", fr: "Configurer une notification d'événement S3 qui démarre le robot d'analyse lorsque le dernier fichier de la journée est écrit." } }
    - { id: d, text: { en: "Set a custom schedule on the crawler with the expression `cron(0 2 * * ? *)`.", fr: "Définir une planification personnalisée sur le robot d'analyse avec l'expression `cron(0 2 * * ? *)`." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A crawler can run on a time-based schedule defined with a six-field cron expression, evaluated in UTC. `cron(0 2 * * ? *)` runs the crawler every day at 02:00 UTC with no other service to configure."
    fr: "Un robot d'analyse peut s'exécuter selon une planification temporelle définie par une expression cron à six champs, évaluée en UTC. `cron(0 2 * * ? *)` exécute le robot chaque jour à 02 h 00 UTC sans autre service à configurer."
  options:
    a:
      en: "This works but adds two services and a function to maintain, which the requirements exclude."
      fr: "Cette solution fonctionne, mais ajoute deux services et une fonction à maintenir, ce que les exigences excluent."
    b:
      en: "An MWAA environment is a large additional service for a single daily crawl."
      fr: "Un environnement MWAA est un service supplémentaire important pour une seule analyse quotidienne."
    c:
      en: "S3 Event Notifications cannot start a crawler directly, and the bucket cannot tell which file is the last one of the day."
      fr: "Les notifications d'événements S3 ne peuvent pas démarrer directement un robot d'analyse, et le compartiment ne peut pas savoir quel fichier est le dernier de la journée."
references:
  - title: Time-based schedules for jobs and crawlers - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/monitor-data-warehouse-schedule.html
