id: deac01-1b-firehose-source-backup
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company ingests JSON telemetry with an Amazon Data Firehose stream that uses Direct PUT. The stream transforms the records with an AWS Lambda function, converts them to Apache Parquet, and delivers them to an Amazon S3 data lake. Data scientists want to be able to replay the raw JSON records, exactly as they were received, into future pipelines.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise ingère de la télémétrie JSON avec un flux Amazon Data Firehose qui utilise Direct PUT. Le flux transforme les enregistrements avec une fonction AWS Lambda, les convertit en Apache Parquet et les livre dans un lac de données Amazon S3. Les data scientists veulent pouvoir rejouer les enregistrements JSON bruts, exactement tels qu'ils ont été reçus, dans de futurs pipelines.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Turn on source record backup in the Firehose stream and send the backup to an S3 bucket for raw data.", fr: "Activer la sauvegarde des enregistrements source dans le flux Firehose et envoyer la sauvegarde vers un compartiment S3 de données brutes." }
    - id: b
      text: { en: "Turn on S3 Versioning on the data lake bucket so that earlier versions of the delivered objects are kept.", fr: "Activer S3 Versioning sur le compartiment du lac de données pour conserver les versions antérieures des objets livrés." }
    - id: c
      text: { en: "Change the producers so that they also send every record to a second Firehose stream without transformation.", fr: "Modifier les producteurs pour qu'ils envoient aussi chaque enregistrement à un second flux Firehose sans transformation." }
    - id: d
      text: { en: "Make the Lambda transformation function also write each incoming record to an S3 bucket before transforming it.", fr: "Faire écrire aussi par la fonction Lambda de transformation chaque enregistrement entrant dans un compartiment S3 avant de le transformer." }
answer: { optionId: a }
explanation:
  correct:
    en: "For an S3 destination that uses Lambda transformation or record format conversion, Firehose can back up the source data to a separate S3 location. The untransformed records are kept as an immutable raw copy that can be replayed later, with no code and no change to the producers."
    fr: "Pour une destination S3 qui utilise une transformation Lambda ou une conversion de format des enregistrements, Firehose peut sauvegarder les données source dans un emplacement S3 distinct. Les enregistrements non transformés sont conservés comme copie brute immuable que l'on peut rejouer plus tard, sans code ni modification des producteurs."
  options:
    b:
      en: "Versioning keeps versions of the delivered Parquet objects only; the raw JSON was never written to that bucket."
      fr: "La gestion des versions ne conserve que des versions des objets Parquet livrés ; le JSON brut n'a jamais été écrit dans ce compartiment."
    c:
      en: "A second stream works but requires changing and redeploying every producer and doubles the ingestion cost."
      fr: "Un second flux fonctionne mais impose de modifier et redéployer chaque producteur, et double le coût d'ingestion."
    d:
      en: "Writing from the transformation function is custom code that adds latency and failure handling, while Firehose offers the backup natively."
      fr: "Écrire depuis la fonction de transformation est du code personnalisé qui ajoute de la latence et de la gestion d'échecs, alors que Firehose propose la sauvegarde nativement."
references:
  - title: Configure backup settings
    url: https://docs.aws.amazon.com/firehose/latest/dev/create-configure-backup.html
