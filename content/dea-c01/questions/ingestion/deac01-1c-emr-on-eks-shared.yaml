id: deac01-1c-emr-on-eks-shared
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs all its microservices on an Amazon EKS cluster, and its platform team manages capacity and monitoring with Kubernetes tools. The data team now needs to run Apache Spark transformations with an Amazon EMR runtime. The platform team requires the Spark jobs to run on the existing EKS cluster and share its nodes with the other workloads.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute tous ses microservices sur un cluster Amazon EKS, et son équipe plateforme gère la capacité et la surveillance avec les outils Kubernetes. L'équipe de données doit maintenant exécuter des transformations Apache Spark avec un environnement d'exécution Amazon EMR. L'équipe plateforme exige que les tâches Spark s'exécutent sur le cluster EKS existant et partagent ses nœuds avec les autres charges de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon EMR Serverless application and submit the Spark jobs to it.", fr: "Créer une application Amazon EMR Serverless et lui soumettre les tâches Spark." } }
    - { id: b, text: { en: "Register the EKS cluster with Amazon EMR on EKS as a virtual cluster and submit the Spark jobs to it.", fr: "Inscrire le cluster EKS auprès d'Amazon EMR on EKS comme cluster virtuel et lui soumettre les tâches Spark." } }
    - { id: c, text: { en: "Create an Amazon EMR on EC2 cluster in the same VPC and submit the Spark jobs as steps.", fr: "Créer un cluster Amazon EMR on EC2 dans le même VPC et soumettre les tâches Spark sous forme d'étapes." } }
    - { id: d, text: { en: "Run the Spark jobs as AWS Glue jobs in the same VPC as the EKS cluster.", fr: "Exécuter les tâches Spark comme tâches AWS Glue dans le même VPC que le cluster EKS." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EMR on EKS runs EMR-based Spark applications on an existing EKS cluster, next to other types of applications, through a virtual cluster. The platform team keeps one compute platform and its Kubernetes tooling, and EMR builds and manages the Spark containers."
    fr: "Amazon EMR on EKS exécute des applications Spark basées sur EMR sur un cluster EKS existant, à côté d'autres types d'applications, au moyen d'un cluster virtuel. L'équipe plateforme conserve une seule plateforme de calcul et ses outils Kubernetes, et EMR crée et gère les conteneurs Spark."
  options:
    a:
      en: "EMR Serverless runs jobs on capacity that AWS manages, not on the company's EKS nodes."
      fr: "EMR Serverless exécute les tâches sur une capacité gérée par AWS, pas sur les nœuds EKS de l'entreprise."
    c:
      en: "An EMR on EC2 cluster uses its own EC2 instances, so the Spark jobs do not share the EKS nodes."
      fr: "Un cluster EMR on EC2 utilise ses propres instances EC2 : les tâches Spark ne partagent pas les nœuds EKS."
    d:
      en: "AWS Glue runs jobs on serverless capacity that it manages; placing it in the VPC does not run it on the EKS cluster."
      fr: "AWS Glue exécute les tâches sur une capacité sans serveur qu'il gère ; le placer dans le VPC ne l'exécute pas sur le cluster EKS."
references:
  - title: What is Amazon EMR on EKS?
    url: https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/emr-eks.html
