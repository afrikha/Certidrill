id: deac01-1c-variety-raw-zone
objective: "1.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company collects CSV extracts from its scheduling system, JSON responses from partner APIs, scanned PDF referral letters and medical images. Future use cases are not yet known, so every dataset must be kept in its original format at low cost, and the tabular and semi-structured data must be discoverable for SQL queries.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé collecte des extractions CSV de son système de planification, des réponses JSON d'API partenaires, des lettres d'orientation numérisées au format PDF et des images médicales. Les futurs cas d'utilisation ne sont pas encore connus : chaque jeu de données doit donc être conservé dans son format d'origine à faible coût, et les données tabulaires et semi-structurées doivent pouvoir être découvertes pour des requêtes SQL.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store all the files in an Amazon S3 raw zone, and run AWS Glue crawlers on the CSV and JSON prefixes to catalog them.", fr: "Stocker tous les fichiers dans une zone brute Amazon S3, et exécuter des robots d'analyse AWS Glue sur les préfixes CSV et JSON pour les cataloguer." } }
    - { id: b, text: { en: "Load all the data into Amazon Redshift tables, with the PDF files and images stored in VARCHAR columns.", fr: "Charger toutes les données dans des tables Amazon Redshift, avec les fichiers PDF et les images stockés dans des colonnes VARCHAR." } }
    - { id: c, text: { en: "Store every file as an item in an Amazon DynamoDB table, with the file content in a binary attribute.", fr: "Stocker chaque fichier comme élément d'une table Amazon DynamoDB, avec le contenu du fichier dans un attribut binaire." } }
    - { id: d, text: { en: "Convert all the files to CSV with an AWS Glue job and store only the CSV output in Amazon S3.", fr: "Convertir tous les fichiers en CSV avec une tâche AWS Glue et ne stocker que la sortie CSV dans Amazon S3." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon S3 stores structured, semi-structured and unstructured objects of any format at low cost, so the raw zone keeps every dataset as it arrived. AWS Glue crawlers infer schemas for the CSV and JSON data and create Data Catalog tables that Athena and other engines can query."
    fr: "Amazon S3 stocke à faible coût des objets structurés, semi-structurés et non structurés de tout format : la zone brute conserve chaque jeu de données tel qu'il est arrivé. Les robots d'analyse AWS Glue déduisent les schémas des données CSV et JSON et créent des tables du catalogue de données qu'Athena et d'autres moteurs peuvent interroger."
  options:
    b:
      en: "A data warehouse needs a defined schema and is costly for binary files such as images, which do not belong in text columns."
      fr: "Un entrepôt de données exige un schéma défini et coûte cher pour des fichiers binaires comme les images, qui n'ont pas leur place dans des colonnes de texte."
    c:
      en: "DynamoDB items are limited to 400 KB, which many images and PDF files exceed, and DynamoDB is not built for SQL discovery of raw files."
      fr: "Les éléments DynamoDB sont limités à 400 Ko, ce que dépassent de nombreuses images et de nombreux fichiers PDF, et DynamoDB n'est pas conçu pour la découverte SQL de fichiers bruts."
    d:
      en: "Converting everything to CSV loses the original formats, and images and PDF files cannot be meaningfully converted to CSV."
      fr: "Tout convertir en CSV fait perdre les formats d'origine, et les images et les fichiers PDF ne peuvent pas être convertis en CSV de manière utile."
references:
  - title: Characteristics
    url: https://docs.aws.amazon.com/wellarchitected/latest/analytics-lens/characteristics.html
  - title: What is AWS Glue?
    url: https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html
