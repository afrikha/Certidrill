id: deac01-1a-s3-events-cross-account-bus
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An ingestion account, 111122223333, owns an Amazon S3 bucket that has Amazon EventBridge notifications turned on. An analytics account, 444455556666, owns an AWS Step Functions state machine that must start for every Object Created event under the bucket's `raw/` prefix. The data must not be copied to the analytics account.

    Which solution will meet these requirements?
  fr: |
    Un compte d'ingestion, 111122223333, possède un compartiment Amazon S3 dont les notifications Amazon EventBridge sont activées. Un compte d'analyse, 444455556666, possède une machine d'état AWS Step Functions qui doit démarrer pour chaque événement Object Created sous le préfixe `raw/` du compartiment. Les données ne doivent pas être copiées dans le compte d'analyse.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "In 444455556666, create a rule on the default event bus that matches Object Created events from the bucket and targets the state machine.", fr: "Dans 444455556666, créer sur le bus d'événements par défaut une règle qui correspond aux événements Object Created du compartiment et cible la machine d'état." } }
    - { id: b, text: { en: "In 111122223333, add an S3 event notification configuration that uses the state machine ARN of 444455556666 as its destination.", fr: "Dans 111122223333, ajouter une configuration de notification d'événement S3 qui utilise l'ARN de la machine d'état de 444455556666 comme destination." } }
    - { id: c, text: { en: "In 111122223333, create a rule that forwards the matching events to the event bus of 444455556666, and add a rule there that targets the state machine.", fr: "Dans 111122223333, créer une règle qui transmet les événements correspondants au bus d'événements de 444455556666, et y ajouter une règle qui cible la machine d'état." } }
    - { id: d, text: { en: "Configure S3 Replication of `raw/` to a bucket in 444455556666 with EventBridge notifications, and add a rule there that targets the state machine.", fr: "Configurer S3 Replication de `raw/` vers un compartiment de 444455556666 avec les notifications EventBridge, et y ajouter une règle qui cible la machine d'état." } }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 sends its events to the default event bus of the bucket's own account. To reach another account, a rule in the sender account targets the receiver's event bus, whose resource-based policy allows the sender account; a rule in the receiver account then matches the events, filtered on the prefix, and starts the state machine."
    fr: "S3 envoie ses événements au bus d'événements par défaut du compte propriétaire du compartiment. Pour atteindre un autre compte, une règle du compte émetteur cible le bus d'événements du destinataire, dont la politique basée sur les ressources autorise le compte émetteur ; une règle du compte destinataire correspond ensuite aux événements, filtrés sur le préfixe, et démarre la machine d'état."
  options:
    a:
      en: "The bucket's events are delivered only to the event bus of 111122223333, so a rule in 444455556666 never sees them without forwarding."
      fr: "Les événements du compartiment ne sont livrés qu'au bus d'événements de 111122223333 : une règle de 444455556666 ne les voit jamais sans transmission."
    b:
      en: "Step Functions state machines are not supported S3 event notification destinations."
      fr: "Les machines d'état Step Functions ne sont pas des destinations de notification d'événement S3 prises en charge."
    d:
      en: "Replication copies the data to the analytics account, which the requirements forbid."
      fr: "La réplication copie les données dans le compte d'analyse, ce que les exigences interdisent."
references:
  - title: Sending and receiving events between AWS accounts in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-account.html
