id: deac01-1c-redshift-data-api
objective: "1.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company builds a serverless API with AWS Lambda functions that run SQL queries on an Amazon Redshift Serverless workgroup and return the results to other systems. The developers do not want to package database drivers, manage database connections, or put database passwords in the function code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise crée une API sans serveur avec des fonctions AWS Lambda qui exécutent des requêtes SQL sur un groupe de travail Amazon Redshift Serverless et renvoient les résultats à d'autres systèmes. Les développeurs ne veulent pas empaqueter de pilotes de base de données, gérer de connexions à la base de données ni placer de mots de passe de base de données dans le code des fonctions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the Redshift JDBC driver in a Lambda layer and store the password in an environment variable.", fr: "Ajouter le pilote JDBC de Redshift dans une couche Lambda et stocker le mot de passe dans une variable d'environnement." } }
    - { id: b, text: { en: "Call the Amazon Redshift Data API from the functions with temporary credentials or an AWS Secrets Manager secret.", fr: "Appeler l'API de données Amazon Redshift depuis les fonctions avec des informations d'identification temporaires ou un secret AWS Secrets Manager." } }
    - { id: c, text: { en: "Place an Amazon RDS Proxy in front of the workgroup and connect to the proxy over JDBC.", fr: "Placer un Amazon RDS Proxy devant le groupe de travail et se connecter au proxy via JDBC." } }
    - { id: d, text: { en: "Share the data with another Redshift workgroup by using data sharing and query the consumer workgroup over ODBC.", fr: "Partager les données avec un autre groupe de travail Redshift au moyen du partage de données et interroger le groupe consommateur via ODBC." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Redshift Data API provides a secure HTTP endpoint and SDK integration, so no driver or persistent connection is needed. Calls are asynchronous (ExecuteStatement, DescribeStatement, GetStatementResult), and authentication uses Secrets Manager, temporary database credentials or IAM Identity Center, never a password in the call."
    fr: "L'API de données Redshift fournit un point de terminaison HTTP sécurisé et une intégration aux SDK : aucun pilote ni connexion persistante n'est nécessaire. Les appels sont asynchrones (ExecuteStatement, DescribeStatement, GetStatementResult), et l'authentification utilise Secrets Manager, des informations d'identification temporaires de base de données ou IAM Identity Center, jamais un mot de passe dans l'appel."
  options:
    a:
      en: "This packages a driver, manages connections, and keeps the password in the function configuration."
      fr: "Cette solution empaquette un pilote, gère des connexions et garde le mot de passe dans la configuration de la fonction."
    c:
      en: "RDS Proxy pools connections for Amazon RDS and Aurora databases, not for Redshift, and still needs a driver."
      fr: "RDS Proxy mutualise les connexions des bases de données Amazon RDS et Aurora, pas de Redshift, et exige toujours un pilote."
    d:
      en: "Data sharing gives another warehouse access to the data, but the functions still need drivers and connections."
      fr: "Le partage de données donne accès aux données à un autre entrepôt, mais les fonctions ont toujours besoin de pilotes et de connexions."
references:
  - title: Using the Amazon Redshift Data API
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/data-api.html
