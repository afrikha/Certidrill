id: deac01-1a-query-s3-in-place
objective: "1.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company stores application logs as CSV files in an Amazon S3 bucket. The company already runs an Amazon Redshift provisioned cluster. Analysts want to run SQL queries on the log files where they are, without loading the data into database tables.

    Which solutions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise stocke des journaux d'application sous forme de fichiers CSV dans un compartiment Amazon S3. L'entreprise exploite déjà un cluster provisionné Amazon Redshift. Les analystes veulent exécuter des requêtes SQL sur les fichiers journaux là où ils se trouvent, sans charger les données dans des tables de base de données.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Load the files into a Redshift table with the COPY command and query the table.", fr: "Charger les fichiers dans une table Redshift avec la commande COPY et interroger la table." } }
    - { id: b, text: { en: "Define a table for the files in the AWS Glue Data Catalog and query it with Amazon Athena.", fr: "Définir une table pour les fichiers dans AWS Glue Data Catalog et l'interroger avec Amazon Athena." } }
    - { id: c, text: { en: "Create an AWS DMS task with an S3 source endpoint and the Redshift cluster as the target endpoint.", fr: "Créer une tâche AWS DMS avec un point de terminaison source S3 et le cluster Redshift comme point de terminaison cible." } }
    - { id: d, text: { en: "Open the files in an AWS Glue DataBrew project and filter the log entries with recipe steps.", fr: "Ouvrir les fichiers dans un projet AWS Glue DataBrew et filtrer les entrées de journal avec des étapes de recette." } }
    - { id: e, text: { en: "Create an external schema and external table in Redshift and query the files through Redshift Spectrum.", fr: "Créer un schéma externe et une table externe dans Redshift et interroger les fichiers via Redshift Spectrum." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Amazon Athena runs SQL directly on files in Amazon S3 described by Data Catalog tables, with no data loaded. Redshift Spectrum lets the existing cluster query the same files through external tables while the data stays in Amazon S3."
    fr: "Amazon Athena exécute du SQL directement sur des fichiers Amazon S3 décrits par des tables du Data Catalog, sans chargement de données. Redshift Spectrum permet au cluster existant d'interroger les mêmes fichiers via des tables externes, les données restant dans Amazon S3."
  options:
    a:
      en: "COPY loads the data into a Redshift table, which the requirements exclude."
      fr: "COPY charge les données dans une table Redshift, ce que les exigences excluent."
    c:
      en: "A DMS task copies the data into Redshift tables instead of querying it in place."
      fr: "Une tâche DMS copie les données dans des tables Redshift au lieu de les interroger sur place."
    d:
      en: "DataBrew is a visual, no-code data preparation tool that applies recipe steps; it does not let analysts run SQL queries."
      fr: "DataBrew est un outil visuel de préparation des données sans code qui applique des étapes de recette ; il ne permet pas aux analystes d'exécuter des requêtes SQL."
references:
  - title: Amazon Redshift Spectrum - Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/c-using-spectrum.html
