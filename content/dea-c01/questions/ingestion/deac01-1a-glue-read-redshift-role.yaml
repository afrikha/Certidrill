id: deac01-1a-glue-read-redshift-role
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue 5.0 job reads a table from an Amazon Redshift provisioned cluster through a Glue connection of type Amazon Redshift, with `redshiftTmpDir` set to `s3://example-glue-temp/redshift/`. The job role can read and write that prefix, and the database user can select from the table. The job fails because the UNLOAD statement that Redshift runs cannot write to the temporary S3 location.

    Which change will fix the problem?
  fr: |
    Une tâche AWS Glue 5.0 lit une table d'un cluster provisionné Amazon Redshift via une connexion Glue de type Amazon Redshift, avec `redshiftTmpDir` défini à `s3://example-glue-temp/redshift/`. Le rôle de la tâche peut lire et écrire ce préfixe, et l'utilisateur de base de données peut lire la table. La tâche échoue, car l'instruction UNLOAD exécutée par Redshift ne peut pas écrire dans l'emplacement S3 temporaire.

    Quelle modification corrige le problème ?
body:
  options:
    - { id: a, text: { en: "Add the `redshift:GetClusterCredentials` permission to the Glue job role.", fr: "Ajouter l'autorisation `redshift:GetClusterCredentials` au rôle de la tâche Glue." } }
    - { id: b, text: { en: "Add an S3 gateway endpoint to the VPC and allow HTTPS to its prefix list in the security group.", fr: "Ajouter un point de terminaison de passerelle S3 au VPC et autoriser HTTPS vers sa liste de préfixes dans le groupe de sécurité." } }
    - { id: c, text: { en: "Grant the database user the USAGE privilege on the schema and SELECT on the table again.", fr: "Accorder à nouveau à l'utilisateur de base de données le privilège USAGE sur le schéma et SELECT sur la table." } }
    - { id: d, text: { en: "Associate an IAM role that can write the prefix with the cluster, and pass its ARN in `aws_iam_role`.", fr: "Associer au cluster un rôle IAM qui peut écrire le préfixe, et transmettre son ARN dans `aws_iam_role`." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Glue moves Redshift data through Amazon S3 by having Redshift run UNLOAD to the temporary directory. Redshift performs that write with an IAM role associated with the cluster, trusted by redshift.amazonaws.com and allowed to write the temporary location; Glue passes the role ARN in the aws_iam_role option. The Glue job role's own S3 permissions do not cover the UNLOAD."
    fr: "AWS Glue fait transiter les données Redshift par Amazon S3 en faisant exécuter par Redshift un UNLOAD vers le répertoire temporaire. Redshift effectue cette écriture avec un rôle IAM associé au cluster, approuvé par redshift.amazonaws.com et autorisé à écrire l'emplacement temporaire ; Glue transmet l'ARN du rôle dans l'option aws_iam_role. Les autorisations S3 du rôle de la tâche Glue ne couvrent pas l'UNLOAD."
  options:
    a:
      en: "This permission is needed only for the IAM-based JDBC URL; it does not let Redshift write to Amazon S3."
      fr: "Cette autorisation n'est nécessaire que pour l'URL JDBC basée sur IAM ; elle ne permet pas à Redshift d'écrire dans Amazon S3."
    b:
      en: "The failure is an authorization failure of the UNLOAD, not a network path problem of the Glue job."
      fr: "L'échec est un refus d'autorisation de l'UNLOAD, pas un problème de chemin réseau de la tâche Glue."
    c:
      en: "The database user can already read the table; database privileges do not give Redshift access to the S3 location."
      fr: "L'utilisateur de base de données peut déjà lire la table ; les privilèges de base de données ne donnent pas à Redshift l'accès à l'emplacement S3."
references:
  - title: Redshift connections - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-connect-redshift-home.html
