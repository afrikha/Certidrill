id: deac01-1a-lambda-vpc-external-api
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function is connected to two private subnets of a VPC so that it can read from an Amazon RDS database. The function must also call a partner's data API on the internet over HTTPS, using an API key stored in AWS Secrets Manager. The VPC has public subnets with a route to an internet gateway. The function currently times out when it calls the partner API.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une fonction AWS Lambda est connectée à deux sous-réseaux privés d'un VPC afin de lire une base de données Amazon RDS. La fonction doit aussi appeler l'API de données d'un partenaire sur Internet en HTTPS, avec une clé d'API stockée dans AWS Secrets Manager. Le VPC comporte des sous-réseaux publics avec une route vers une passerelle Internet. La fonction expire actuellement lorsqu'elle appelle l'API du partenaire.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a NAT gateway in a public subnet and add a 0.0.0.0/0 route to it in the route table of the private subnets.", fr: "Créer une passerelle NAT dans un sous-réseau public et ajouter une route 0.0.0.0/0 vers elle dans la table de routage des sous-réseaux privés." } }
    - { id: b, text: { en: "Move the function to the public subnets so that it reaches the internet through the internet gateway.", fr: "Déplacer la fonction dans les sous-réseaux publics afin qu'elle atteigne Internet via la passerelle Internet." } }
    - { id: c, text: { en: "Create a gateway VPC endpoint for the partner API and add it to the route table of the private subnets.", fr: "Créer un point de terminaison de VPC de passerelle pour l'API du partenaire et l'ajouter à la table de routage des sous-réseaux privés." } }
    - { id: d, text: { en: "Allow `secretsmanager:GetSecretValue` on the secret in the execution role and read the key at runtime.", fr: "Autoriser `secretsmanager:GetSecretValue` sur le secret dans le rôle d'exécution et lire la clé à l'exécution." } }
    - { id: e, text: { en: "Add an inbound rule for the partner API's IP addresses on port 443 to the function's security group.", fr: "Ajouter au groupe de sécurité de la fonction une règle entrante pour les adresses IP de l'API du partenaire sur le port 443." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A VPC-connected function reaches the internet through a NAT gateway in a public subnet, with the private subnets routing 0.0.0.0/0 to it; this path also reaches the Secrets Manager endpoint. The execution role must allow secretsmanager:GetSecretValue so that the function can read the API key at runtime."
    fr: "Une fonction connectée à un VPC atteint Internet via une passerelle NAT située dans un sous-réseau public, les sous-réseaux privés routant 0.0.0.0/0 vers elle ; ce chemin atteint aussi le point de terminaison de Secrets Manager. Le rôle d'exécution doit autoriser secretsmanager:GetSecretValue pour que la fonction puisse lire la clé d'API à l'exécution."
  options:
    b:
      en: "Connecting a function to a public subnet does not give it internet access, because its network interfaces have no public IP addresses."
      fr: "Connecter une fonction à un sous-réseau public ne lui donne pas accès à Internet, car ses interfaces réseau n'ont pas d'adresse IP publique."
    c:
      en: "Gateway endpoints exist only for Amazon S3 and DynamoDB; they cannot reach a partner API on the internet."
      fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et DynamoDB ; ils ne peuvent pas atteindre l'API d'un partenaire sur Internet."
    e:
      en: "Security groups are stateful and allow all outbound traffic by default, so return traffic needs no inbound rule; the missing piece is a route to the internet."
      fr: "Les groupes de sécurité sont avec état et autorisent par défaut tout le trafic sortant : le trafic de retour ne nécessite aucune règle entrante ; il manque une route vers Internet."
references:
  - title: Enable internet access for VPC-connected Lambda Event Functions - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc-internet.html
