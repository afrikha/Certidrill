id: deac01-1d-glue-git-integration
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Data engineers edit AWS Glue script jobs directly in AWS Glue Studio. After a faulty change, nobody could tell which version of a script was running or who changed it. The company already uses GitHub for application code and wants every job change to go through a branch and a pull request review, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Les ingénieurs de données modifient les tâches de script AWS Glue directement dans AWS Glue Studio. Après une modification défectueuse, personne n'a pu dire quelle version d'un script s'exécutait ni qui l'avait modifiée. L'entreprise utilise déjà GitHub pour le code applicatif et veut que chaque modification de tâche passe par une branche et une revue de pull request, avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable S3 Versioning on the bucket that stores the job scripts so that earlier versions are kept.", fr: "Activer S3 Versioning sur le compartiment qui stocke les scripts des tâches pour conserver les versions antérieures." } }
    - { id: b, text: { en: "Create a CloudTrail trail that records the UpdateJob API calls of AWS Glue.", fr: "Créer un journal de suivi CloudTrail qui enregistre les appels d'API UpdateJob d'AWS Glue." } }
    - { id: c, text: { en: "Schedule a Lambda function that exports each job definition with GetJob to an S3 bucket every night.", fr: "Planifier une fonction Lambda qui exporte chaque nuit la définition de chaque tâche avec GetJob vers un compartiment S3." } }
    - { id: d, text: { en: "Connect AWS Glue to a GitHub repository with its Git integration, and push and pull the jobs from a branch.", fr: "Connecter AWS Glue à un dépôt GitHub avec son intégration Git, et pousser et tirer les tâches depuis une branche." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Glue integrates with GitHub, GitLab, and Bitbucket repositories. For a script job, Glue pushes the job definition JSON file and the script to the selected branch, so changes can be reviewed with pull requests and pulled back into the job."
    fr: "AWS Glue s'intègre aux dépôts GitHub, GitLab et Bitbucket. Pour une tâche de script, Glue pousse le fichier JSON de définition de la tâche et le script vers la branche choisie : les modifications peuvent être revues par pull request puis tirées dans la tâche."
  options:
    a: { en: "Object versions keep earlier copies of the scripts, but they provide no branches or pull request reviews.", fr: "Les versions d'objets conservent les copies antérieures des scripts, mais n'offrent ni branches ni revues de pull request." }
    b: { en: "CloudTrail shows who called the API and when; it is an audit trail, not version control with reviews.", fr: "CloudTrail indique qui a appelé l'API et quand ; c'est une piste d'audit, pas un contrôle de version avec revues." }
    c: { en: "Nightly exports are custom code that captures snapshots after the fact, with no review before a change is applied.", fr: "Les exports nocturnes sont du code personnalisé qui capture des instantanés a posteriori, sans revue avant l'application d'une modification." }
references:
  - title: Using Git version control systems in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/edit-job-add-source-control-integration.html
