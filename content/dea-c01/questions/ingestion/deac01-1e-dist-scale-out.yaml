id: deac01-1e-dist-scale-out
objective: "1.4.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company transforms 3 TB of logs every night with a Python script that uses pandas on a single large Amazon EC2 instance. The data grows by 15 % each month, the script already uses most of the memory of the largest instance size in its family, and the job now misses its processing window. The company wants a solution that keeps scaling as the data grows, without managing servers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise transforme chaque nuit 3 To de journaux avec un script Python qui utilise pandas sur une seule grande instance Amazon EC2. Les données augmentent de 15 % par mois, le script utilise déjà la plus grande partie de la mémoire de la plus grande taille d'instance de sa famille, et la tâche dépasse désormais sa fenêtre de traitement. L'entreprise veut une solution qui continue de passer à l'échelle avec la croissance des données, sans gérer de serveurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the script in an AWS Lambda function configured with the maximum 10,240 MB of memory.", fr: "Exécuter le script dans une fonction AWS Lambda configurée avec le maximum de 10 240 Mo de mémoire." } }
    - { id: b, text: { en: "Move the script to the largest instance type of a memory optimized instance family.", fr: "Déplacer le script vers le plus grand type d'instance d'une famille d'instances à mémoire optimisée." } }
    - { id: c, text: { en: "Rewrite the job as an AWS Glue Spark job that processes partitions in parallel, and add workers as data grows.", fr: "Réécrire la tâche en tâche AWS Glue Spark qui traite des partitions en parallèle, et ajouter des workers avec la croissance des données." } }
    - { id: d, text: { en: "Run the same pandas script as an AWS Batch job on a compute environment with a larger instance type.", fr: "Exécuter le même script pandas comme tâche AWS Batch dans un environnement de calcul avec un type d'instance plus grand." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A distributed engine such as Spark splits the data into partitions and runs one task per partition on the cores of many workers, so capacity grows by adding workers (scaling out). AWS Glue runs Spark without servers to manage, so the job keeps up with the growth by raising the number of workers."
    fr: "Un moteur distribué comme Spark découpe les données en partitions et exécute une tâche par partition sur les cœurs de nombreux workers : la capacité augmente en ajoutant des workers (montée en charge horizontale). AWS Glue exécute Spark sans serveur à gérer : la tâche suit donc la croissance en augmentant le nombre de workers."
  options:
    a:
      en: "A single function with at most 10,240 MB of memory is smaller than the current instance and cannot hold a pandas job of this size."
      fr: "Une seule fonction d'au plus 10 240 Mo de mémoire est plus petite que l'instance actuelle et ne peut pas contenir une tâche pandas de cette taille."
    b:
      en: "Scaling up a single instance reaches a ceiling as the data keeps growing, and the company still manages a server."
      fr: "Agrandir une seule instance atteint un plafond à mesure que les données augmentent, et l'entreprise gère toujours un serveur."
    d:
      en: "The pandas script still runs on one node, so it hits the same single-machine memory limit."
      fr: "Le script pandas s'exécute toujours sur un seul nœud : il se heurte à la même limite de mémoire d'une machine unique."
references:
  - title: Parallelize tasks
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/tuning-aws-glue-for-apache-spark/parallelize-tasks.html
