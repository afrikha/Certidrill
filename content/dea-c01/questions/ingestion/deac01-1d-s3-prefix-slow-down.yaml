id: deac01-1d-s3-prefix-slow-down
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs an Apache Spark job on Amazon EMR every hour. Each run writes several hundred thousand objects to the same Amazon S3 prefix, s3://example-curated/events/. During the write stage, the job receives many HTTP 503 Slow Down responses from Amazon S3, and the retries make the job run much longer.

    Which solution will reduce the throttling?
  fr: |
    Une entreprise de médias exécute une tâche Apache Spark sur Amazon EMR toutes les heures. Chaque exécution écrit plusieurs centaines de milliers d'objets sous le même préfixe Amazon S3, s3://example-curated/events/. Pendant l'étape d'écriture, la tâche reçoit de nombreuses réponses HTTP 503 Slow Down d'Amazon S3, et les nouvelles tentatives allongent fortement la durée de la tâche.

    Quelle solution réduira la limitation (throttling) ?
body:
  options:
    - { id: a, text: { en: "Spread the output across several prefixes, for example by partitioning it by event type and hour.", fr: "Répartir la sortie sur plusieurs préfixes, par exemple en la partitionnant par type d'événement et par heure." } }
    - { id: b, text: { en: "Enable S3 Transfer Acceleration on the bucket and send the writes to the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment et envoyer les écritures au point de terminaison accéléré." } }
    - { id: c, text: { en: "Write the output objects to the S3 Standard-IA storage class instead of S3 Standard.", fr: "Écrire les objets de sortie dans la classe de stockage S3 Standard-IA au lieu de S3 Standard." } }
    - { id: d, text: { en: "Enable S3 Versioning on the bucket so that each write creates a new version of the object.", fr: "Activer S3 Versioning sur le compartiment pour que chaque écriture crée une nouvelle version de l'objet." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon S3 supports a request rate per partitioned prefix and scales by partitioning more prefixes. Spreading the writes across many prefixes lets S3 serve them in parallel; 503 Slow Down responses appear while traffic to a single prefix exceeds what S3 has scaled for."
    fr: "Amazon S3 prend en charge un débit de requêtes par préfixe partitionné et s'adapte en partitionnant davantage de préfixes. Répartir les écritures sur de nombreux préfixes permet à S3 de les traiter en parallèle ; les réponses 503 Slow Down apparaissent lorsque le trafic vers un seul préfixe dépasse ce pour quoi S3 s'est adapté."
  options:
    b: { en: "Transfer Acceleration speeds up long-distance transfers through edge locations; it does not raise the request rate per prefix.", fr: "Transfer Acceleration accélère les transferts longue distance via les emplacements périphériques ; il n'augmente pas le débit de requêtes par préfixe." }
    c: { en: "The storage class changes the price and the minimum storage duration, not the request rate a prefix supports.", fr: "La classe de stockage modifie le prix et la durée minimale de stockage, pas le débit de requêtes qu'un préfixe prend en charge." }
    d: { en: "Versioning keeps previous versions of objects; it does not spread requests and does nothing against 503 responses.", fr: "La gestion des versions conserve les versions précédentes des objets ; elle ne répartit pas les requêtes et ne change rien aux réponses 503." }
references:
  - title: "Best practices design patterns: optimizing Amazon S3 performance"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/optimizing-performance.html
