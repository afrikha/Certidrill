id: deac01-1c-serverless-spark-options
objective: "1.2.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A data team has written its transformations as PySpark scripts that process about 2 TB each day. The team does not want to provision, configure or manage any cluster or server to run the scripts.

    Which AWS services can run the scripts and meet these requirements? (Choose two.)
  fr: |
    Une équipe de données a écrit ses transformations sous forme de scripts PySpark qui traitent environ 2 To par jour. L'équipe ne veut provisionner, configurer ni gérer aucun cluster ou serveur pour exécuter les scripts.

    Quels services AWS peuvent exécuter les scripts tout en répondant à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "AWS Glue Spark ETL jobs", fr: "Tâches ETL Spark AWS Glue" } }
    - { id: b, text: { en: "Amazon EMR on EC2 with managed scaling", fr: "Amazon EMR on EC2 avec la mise à l'échelle gérée" } }
    - { id: c, text: { en: "Amazon EMR Serverless", fr: "Amazon EMR Serverless" } }
    - { id: d, text: { en: "AWS Lambda", fr: "AWS Lambda" } }
    - { id: e, text: { en: "Amazon Redshift provisioned clusters", fr: "Clusters provisionnés Amazon Redshift" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AWS Glue is a serverless data integration service that runs Spark ETL jobs on capacity it provisions for each run. EMR Serverless is a serverless runtime for Spark and Hive: it determines the resources a job needs, provisions them and releases them when the job ends, without clusters to operate."
    fr: "AWS Glue est un service d'intégration de données sans serveur qui exécute des tâches ETL Spark sur une capacité qu'il provisionne à chaque exécution. EMR Serverless est un environnement d'exécution sans serveur pour Spark et Hive : il détermine les ressources nécessaires à une tâche, les provisionne et les libère à la fin de la tâche, sans cluster à exploiter."
  options:
    b:
      en: "Managed scaling resizes the cluster, but the team still creates, configures and operates an EMR cluster on EC2 instances."
      fr: "La mise à l'échelle gérée redimensionne le cluster, mais l'équipe doit toujours créer, configurer et exploiter un cluster EMR sur des instances EC2."
    d:
      en: "Lambda runs functions, not distributed Spark applications, so it cannot run the PySpark scripts on 2 TB of data."
      fr: "Lambda exécute des fonctions, pas des applications Spark distribuées : il ne peut pas exécuter les scripts PySpark sur 2 To de données."
    e:
      en: "A provisioned Redshift cluster runs SQL, not PySpark scripts, and is a cluster that the team must size and manage."
      fr: "Un cluster Redshift provisionné exécute du SQL, pas des scripts PySpark, et c'est un cluster que l'équipe doit dimensionner et gérer."
references:
  - title: What is Amazon EMR Serverless?
    url: https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/emr-serverless.html
  - title: What is AWS Glue?
    url: https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html
