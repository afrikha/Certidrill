id: deac01-1c-athena-partition-schema-mismatch
objective: "1.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue crawler runs every night on a CSV dataset in Amazon S3 and updates a partitioned table that Amazon Athena queries. A producer recently wrote some partitions in which one column contains decimal values instead of strings. Since then, Athena queries fail with `HIVE_PARTITION_SCHEMA_MISMATCH`. The source files must stay in CSV format, and the problem must not come back after future crawler runs.

    Which solution will meet these requirements?
  fr: |
    Un robot d'analyse AWS Glue s'exécute chaque nuit sur un jeu de données CSV dans Amazon S3 et met à jour une table partitionnée qu'interroge Amazon Athena. Un producteur a récemment écrit des partitions dans lesquelles une colonne contient des valeurs décimales au lieu de chaînes. Depuis, les requêtes Athena échouent avec `HIVE_PARTITION_SCHEMA_MISMATCH`. Les fichiers source doivent rester au format CSV, et le problème ne doit pas réapparaître après les prochaines exécutions du robot.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run MSCK REPAIR TABLE on the table after each crawler run.", fr: "Exécuter MSCK REPAIR TABLE sur la table après chaque exécution du robot d'analyse." } }
    - { id: b, text: { en: "Turn on the crawler option to update all new and existing partitions with metadata from the table, then run the crawler.", fr: "Activer l'option du robot qui met à jour toutes les partitions nouvelles et existantes avec les métadonnées de la table, puis exécuter le robot." } }
    - { id: c, text: { en: "Drop the mismatched partitions and add them again with ALTER TABLE ADD PARTITION, without changing the crawler.", fr: "Supprimer les partitions incompatibles et les ajouter de nouveau avec ALTER TABLE ADD PARTITION, sans modifier le robot d'analyse." } }
    - { id: d, text: { en: "Turn on the crawler option to create a single schema for each Amazon S3 path, then run the crawler.", fr: "Activer l'option du robot qui crée un schéma unique pour chaque chemin Amazon S3, puis exécuter le robot." } }
answer: { optionId: b }
explanation:
  correct:
    en: "For CSV, JSON and Avro, Athena checks the column types of each partition against the table by column index, so a crawler that records a different type for some partitions causes HIVE_PARTITION_SCHEMA_MISMATCH. The crawler option to update all new and existing partitions with metadata from the table (AddOrUpdateBehavior set to InheritFromTable) makes every partition inherit the table schema on each run."
    fr: "Pour CSV, JSON et Avro, Athena vérifie les types de colonnes de chaque partition par rapport à la table selon l'index des colonnes : un robot qui enregistre un type différent pour certaines partitions provoque HIVE_PARTITION_SCHEMA_MISMATCH. L'option du robot qui met à jour toutes les partitions nouvelles et existantes avec les métadonnées de la table (AddOrUpdateBehavior défini sur InheritFromTable) fait hériter le schéma de la table à chaque partition à chaque exécution."
  options:
    a:
      en: "MSCK REPAIR TABLE only adds missing partitions; it does not change the schema stored for existing partitions."
      fr: "MSCK REPAIR TABLE ne fait qu'ajouter les partitions manquantes ; il ne modifie pas le schéma enregistré pour les partitions existantes."
    c:
      en: "Recreating the partitions fixes the current error, but the next crawler run can record the different schema again."
      fr: "Recréer les partitions corrige l'erreur actuelle, mais la prochaine exécution du robot peut de nouveau enregistrer le schéma différent."
    d:
      en: "This option groups compatible schemas into one table instead of several tables; it does not make the partition schemas match the table schema."
      fr: "Cette option regroupe des schémas compatibles dans une seule table au lieu de plusieurs ; elle n'aligne pas les schémas des partitions sur celui de la table."
references:
  - title: Update tables with partitions
    url: https://docs.aws.amazon.com/athena/latest/ug/updates-and-partitions.html
  - title: Preventing a crawler from changing an existing schema
    url: https://docs.aws.amazon.com/glue/latest/dg/crawler-schema-changes-prevent.html
