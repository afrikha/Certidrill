id: deac01-1c-sfn-bedrock-s3-input
objective: "1.2.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Step Functions state machine orchestrates a document pipeline. An AWS Glue job writes one JSON model request per document to Amazon S3; each request contains the full document text and is between 500 KB and 2 MB. The next step must send each request to an Amazon Bedrock text model and keep the model response for later steps. The company does not want to write or maintain Lambda functions.

    Which solution will meet these requirements?
  fr: |
    Une machine d'état AWS Step Functions orchestre un pipeline de documents. Une tâche AWS Glue écrit dans Amazon S3 une requête de modèle au format JSON par document ; chaque requête contient le texte complet du document et fait entre 500 Ko et 2 Mo. L'étape suivante doit envoyer chaque requête à un modèle de texte Amazon Bedrock et conserver la réponse du modèle pour les étapes ultérieures. L'entreprise ne veut pas écrire ni maintenir de fonctions Lambda.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use the `bedrock:invokeModel` optimized integration and pass the request text in the Body field from the state input.", fr: "Utiliser l'intégration optimisée `bedrock:invokeModel` et transmettre le texte de la requête dans le champ Body à partir de l'entrée de l'état." } }
    - { id: b, text: { en: "Use the `bedrock:invokeModel` optimized integration with Input.S3Uri set to the request object and Output.S3Uri set to a results prefix.", fr: "Utiliser l'intégration optimisée `bedrock:invokeModel` avec Input.S3Uri défini sur l'objet de la requête et Output.S3Uri défini sur un préfixe de résultats." } }
    - { id: c, text: { en: "Add a Lambda function that reads each request from Amazon S3 and calls the InvokeModel API.", fr: "Ajouter une fonction Lambda qui lit chaque requête dans Amazon S3 et appelle l'API InvokeModel." } }
    - { id: d, text: { en: "Use the `bedrock:createModelCustomizationJob.sync` integration with the request objects as training data.", fr: "Utiliser l'intégration `bedrock:createModelCustomizationJob.sync` avec les objets de requête comme données d'entraînement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Step Functions InvokeModel integration accepts a Body of up to 256 KiB; for larger payloads, the Input field reads the request from Amazon S3 instead. The Output field writes the model response to Amazon S3 and replaces it in the state output with a reference, which keeps the large response out of the state data."
    fr: "L'intégration InvokeModel de Step Functions accepte un champ Body de 256 Kio au plus ; pour des charges plus grandes, le champ Input lit plutôt la requête dans Amazon S3. Le champ Output écrit la réponse du modèle dans Amazon S3 et la remplace dans la sortie de l'état par une référence, ce qui garde la réponse volumineuse hors des données de l'état."
  options:
    a:
      en: "Requests of 500 KB to 2 MB exceed the 256 KiB limit of the Body field in the optimized integration."
      fr: "Des requêtes de 500 Ko à 2 Mo dépassent la limite de 256 Kio du champ Body dans l'intégration optimisée."
    c:
      en: "A Lambda function works, but the company does not want to write or maintain functions."
      fr: "Une fonction Lambda fonctionne, mais l'entreprise ne veut pas écrire ni maintenir de fonctions."
    d:
      en: "CreateModelCustomizationJob fine-tunes a model; it does not run inference on each request."
      fr: "CreateModelCustomizationJob affine un modèle ; il n'exécute pas d'inférence sur chaque requête."
references:
  - title: Invoke and customize Amazon Bedrock models with Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrock.html
