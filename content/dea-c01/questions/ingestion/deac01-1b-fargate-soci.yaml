id: deac01-1b-fargate-soci
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company starts an Amazon ECS task on AWS Fargate, Linux platform version 1.4.0, for each file that arrives in an Amazon S3 bucket. The container image is stored in Amazon ECR private, uses gzip compression, and is about 5 GB because it includes many Python data libraries. Most of the two-minute startup time is spent pulling the image. The company wants the tasks to start processing sooner without changing the application code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise démarre une tâche Amazon ECS sur AWS Fargate, plateforme Linux version 1.4.0, pour chaque fichier qui arrive dans un compartiment Amazon S3. L'image de conteneur est stockée dans Amazon ECR privé, utilise la compression gzip et fait environ 5 Go, car elle contient de nombreuses bibliothèques Python de traitement de données. La plus grande partie des deux minutes de démarrage est consacrée au téléchargement de l'image. L'entreprise veut que les tâches commencent le traitement plus tôt sans modifier le code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the ephemeral storage of the task definition to 200 GiB.", fr: "Augmenter le stockage éphémère de la définition de tâche à 200 Gio." }
    - id: b
      text: { en: "Rebuild the image with zstd compression and push it to the same repository.", fr: "Reconstruire l'image avec la compression zstd et la pousser dans le même référentiel." }
    - id: c
      text: { en: "Create a Seekable OCI (SOCI) index for the image and store it in the same ECR repository as the image.", fr: "Créer un index Seekable OCI (SOCI) pour l'image et le stocker dans le même référentiel ECR que l'image." }
    - id: d
      text: { en: "Double the vCPU and memory of the task definition so that the image layers are extracted faster.", fr: "Doubler les vCPU et la mémoire de la définition de tâche pour que les couches de l'image soient extraites plus vite." }
answer: { optionId: c }
explanation:
  correct:
    en: "Fargate tasks on Linux platform version 1.4.0 can use Seekable OCI to lazy load images: containers spend only a few seconds on the image pull before they start, while the rest of the image downloads in the background. The SOCI index must be stored as an artifact in the same ECR private repository, and gzip or uncompressed images are supported."
    fr: "Les tâches Fargate sur la plateforme Linux version 1.4.0 peuvent utiliser Seekable OCI pour charger les images à la demande : les conteneurs ne passent que quelques secondes sur le téléchargement de l'image avant de démarrer, pendant que le reste de l'image se télécharge en arrière-plan. L'index SOCI doit être stocké comme artefact dans le même référentiel privé ECR, et les images gzip ou non compressées sont prises en charge."
  options:
    a:
      en: "More ephemeral storage gives space for the image and data, but the full image must still be pulled before the container starts."
      fr: "Davantage de stockage éphémère donne de la place pour l'image et les données, mais l'image complète doit toujours être téléchargée avant le démarrage du conteneur."
    b:
      en: "Images that use zstd compression are not supported by SOCI on Fargate, and a different compression does not remove the full pull."
      fr: "Les images qui utilisent la compression zstd ne sont pas prises en charge par SOCI sur Fargate, et une autre compression ne supprime pas le téléchargement complet."
    d:
      en: "Larger tasks cost more, and the startup time is dominated by downloading the image, which is not removed by more CPU."
      fr: "Des tâches plus grandes coûtent plus cher, et le temps de démarrage est dominé par le téléchargement de l'image, que davantage de processeur ne supprime pas."
references:
  - title: Amazon ECS task definition differences for Fargate
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html
