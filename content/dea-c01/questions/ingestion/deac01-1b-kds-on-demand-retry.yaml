id: deac01-1b-kds-on-demand-retry
objective: "1.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A social media company ingests user activity into an Amazon Kinesis data stream in provisioned mode. Traffic is unpredictable and can grow several times within minutes during viral events. During those spikes, PutRecords responses report failed records with ProvisionedThroughputExceededException. The company wants no capacity planning for the stream and must not lose any record.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de réseau social ingère l'activité des utilisateurs dans un flux de données Amazon Kinesis en mode provisionné. Le trafic est imprévisible et peut être multiplié en quelques minutes lors d'événements viraux. Pendant ces pics, les réponses PutRecords signalent des enregistrements en échec avec ProvisionedThroughputExceededException. L'entreprise ne veut aucune planification de capacité pour le flux et ne doit perdre aucun enregistrement.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Switch the stream to on-demand capacity mode.", fr: "Passer le flux en mode de capacité à la demande." } }
    - { id: b, text: { en: "Register the consumers of the stream as enhanced fan-out consumers.", fr: "Enregistrer les consommateurs du flux comme consommateurs à diffusion améliorée." } }
    - { id: c, text: { en: "Increase the retention period of the stream to 7 days.", fr: "Augmenter la période de conservation du flux à 7 jours." } }
    - { id: d, text: { en: "Make producers resend the failed records of each PutRecords response with exponential backoff.", fr: "Faire renvoyer par les producteurs les enregistrements en échec de chaque réponse PutRecords avec un backoff exponentiel." } }
    - { id: e, text: { en: "Use one constant partition key for all records so that they stay in order.", fr: "Utiliser une seule clé de partition constante pour tous les enregistrements afin qu'ils restent dans l'ordre." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "On-demand mode needs no shard planning and suits highly variable, unpredictable traffic; it accommodates up to double the peak write throughput of the previous 30 days. Writes can still be throttled when traffic more than doubles within 15 minutes, so producers must retry the failed records that PutRecords reports, with backoff, to avoid losing them."
    fr: "Le mode à la demande ne demande aucune planification de partitions et convient à un trafic très variable et imprévisible ; il absorbe jusqu'au double du pic de débit d'écriture des 30 jours précédents. Les écritures peuvent encore être limitées si le trafic fait plus que doubler en 15 minutes : les producteurs doivent donc réessayer, avec backoff, les enregistrements en échec que signale PutRecords pour ne pas les perdre."
  options:
    b:
      en: "Enhanced fan-out gives consumers dedicated read throughput; the throttling happens on writes."
      fr: "La diffusion améliorée donne aux consommateurs un débit de lecture dédié ; la limitation se produit à l'écriture."
    c:
      en: "Retention keeps written records longer; it does not help records that were rejected at write time."
      fr: "La conservation garde plus longtemps les enregistrements écrits ; elle n'aide pas les enregistrements refusés à l'écriture."
    e:
      en: "A single partition key sends every record to one shard, which concentrates the load and increases throttling."
      fr: "Une seule clé de partition envoie tous les enregistrements vers une seule partition, ce qui concentre la charge et augmente la limitation."
references:
  - title: Choose the right mode to stream in
    url: https://docs.aws.amazon.com/streams/latest/dev/how-do-i-size-a-stream.html
