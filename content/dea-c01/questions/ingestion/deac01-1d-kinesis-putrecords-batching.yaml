id: deac01-1d-kinesis-putrecords-batching
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python application on Amazon EC2 sends about 2,000 small telemetry records per second to an Amazon Kinesis data stream that has 4 shards. The application calls PutRecord once for each record, and most of its runtime is spent waiting for HTTP responses. The order of the records does not matter.

    Which change will reduce the time the application spends sending records?
  fr: |
    Une application Python sur Amazon EC2 envoie environ 2 000 petits enregistrements de télémétrie par seconde à un flux de données Amazon Kinesis de 4 partitions (shards). L'application appelle PutRecord une fois par enregistrement, et l'essentiel de son temps d'exécution est passé à attendre les réponses HTTP. L'ordre des enregistrements n'a pas d'importance.

    Quelle modification réduira le temps que l'application passe à envoyer les enregistrements ?
body:
  options:
    - { id: a, text: { en: "Register an enhanced fan-out consumer on the stream to get dedicated throughput.", fr: "Enregistrer un consommateur à diffusion améliorée (enhanced fan-out) sur le flux pour obtenir un débit dédié." } }
    - { id: b, text: { en: "Use the same partition key for all records so that they go to a single shard.", fr: "Utiliser la même clé de partition pour tous les enregistrements afin qu'ils aillent dans une seule partition." } }
    - { id: c, text: { en: "Send the records with PutRecords in batches of up to 500 and resend only the failed entries.", fr: "Envoyer les enregistrements avec PutRecords par lots de 500 au plus et renvoyer uniquement les entrées en échec." } }
    - { id: d, text: { en: "Increase the retention period of the stream from 24 hours to 7 days.", fr: "Faire passer la période de conservation du flux de 24 heures à 7 jours." } }
answer: { optionId: c }
explanation:
  correct:
    en: "PutRecords writes up to 500 records in one request, so the application makes far fewer HTTP calls. Each record is processed independently: when FailedRecordCount is not zero, the application resends only the entries that have an ErrorCode."
    fr: "PutRecords écrit jusqu'à 500 enregistrements en une seule requête : l'application effectue beaucoup moins d'appels HTTP. Chaque enregistrement est traité indépendamment : lorsque FailedRecordCount n'est pas nul, l'application renvoie uniquement les entrées qui ont un ErrorCode."
  options:
    a: { en: "Enhanced fan-out improves the read throughput of consumers; it does nothing for producers.", fr: "La diffusion améliorée augmente le débit de lecture des consommateurs ; elle n'apporte rien aux producteurs." }
    b: { en: "A shard supports up to 1,000 records per second for writes, so 2,000 records per second on one shard would be throttled.", fr: "Une partition accepte jusqu'à 1 000 enregistrements par seconde en écriture : 2 000 enregistrements par seconde sur une seule partition seraient limités." }
    d: { en: "Retention controls how long records stay in the stream; it does not change how fast producers write.", fr: "La conservation détermine combien de temps les enregistrements restent dans le flux ; elle ne change pas la vitesse d'écriture des producteurs." }
references:
  - title: PutRecords
    url: https://docs.aws.amazon.com/kinesis/latest/APIReference/API_PutRecords.html
