id: deac01-1a-s3-notification-prefix-suffix
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Partners upload files to the `incoming/` prefix of an Amazon S3 bucket. Each upload contains a `.csv` data file and a `.done` marker file, and other prefixes of the bucket receive other objects. An AWS Lambda function must be invoked only when a `.csv` file is created under `incoming/`. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Des partenaires chargent des fichiers sous le préfixe `incoming/` d'un compartiment Amazon S3. Chaque chargement contient un fichier de données `.csv` et un fichier marqueur `.done`, et d'autres préfixes du compartiment reçoivent d'autres objets. Une fonction AWS Lambda ne doit être appelée que lorsqu'un fichier `.csv` est créé sous `incoming/`. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure an event notification for all object-created events in the bucket and make the function ignore other keys.", fr: "Configurer une notification d'événement pour tous les événements de création d'objet du compartiment et faire ignorer les autres clés par la fonction." } }
    - { id: b, text: { en: "Configure an event notification for object-created events with the prefix `incoming/` and the suffix `.csv`, with the function as destination.", fr: "Configurer une notification d'événement pour les événements de création d'objet avec le préfixe `incoming/` et le suffixe `.csv`, avec la fonction comme destination." } }
    - { id: c, text: { en: "Configure a daily S3 Inventory report for the `incoming/` prefix and invoke the function for each new `.csv` key in the report.", fr: "Configurer un rapport S3 Inventory quotidien pour le préfixe `incoming/` et appeler la fonction pour chaque nouvelle clé `.csv` du rapport." } }
    - { id: d, text: { en: "Create an AWS CloudTrail trail with S3 data events and an Amazon EventBridge rule that matches PutObject calls on `.csv` keys.", fr: "Créer un journal de suivi AWS CloudTrail avec des événements de données S3 et une règle Amazon EventBridge qui correspond aux appels PutObject sur des clés `.csv`." } }
answer: { optionId: b }
explanation:
  correct:
    en: "S3 Event Notifications can filter on the prefix and the suffix of the object key, so the bucket sends a notification only for `.csv` objects created under `incoming/`. The function is invoked only for those objects, with no other service to set up."
    fr: "Les notifications d'événements S3 peuvent filtrer sur le préfixe et le suffixe de la clé d'objet : le compartiment n'envoie une notification que pour les objets `.csv` créés sous `incoming/`. La fonction n'est appelée que pour ces objets, sans autre service à configurer."
  options:
    a:
      en: "The function would be invoked for every object in the bucket, which the requirement forbids, and it would pay for useless invocations."
      fr: "La fonction serait appelée pour chaque objet du compartiment, ce que l'exigence interdit, et paierait des appels inutiles."
    c:
      en: "An inventory report is produced daily or weekly, so the processing would not be event-driven, and the matching logic would be custom."
      fr: "Un rapport d'inventaire est produit chaque jour ou chaque semaine : le traitement ne serait pas piloté par les événements, et la logique de correspondance serait personnalisée."
    d:
      en: "This works but adds a trail with data events and a rule to manage, which is more overhead than a filtered notification."
      fr: "Cette solution fonctionne, mais ajoute un journal de suivi avec des événements de données et une règle à gérer, ce qui représente plus de charge qu'une notification filtrée."
references:
  - title: Configuring event notifications using object key name filtering - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-filtering.html
