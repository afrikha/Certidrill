id: deac01-1b-athena-federated-join
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company stores clickstream data in an Amazon S3 data lake cataloged in the AWS Glue Data Catalog. Subscriber profiles are in an Amazon DynamoDB table, and billing records are in an Amazon RDS for MySQL database. Analysts run a few ad hoc SQL queries each week that join the three sources. The company does not want to copy the data or manage servers or clusters.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias stocke des données de parcours de navigation dans un lac de données Amazon S3 catalogué dans AWS Glue Data Catalog. Les profils des abonnés sont dans une table Amazon DynamoDB, et les enregistrements de facturation dans une base de données Amazon RDS for MySQL. Les analystes exécutent chaque semaine quelques requêtes SQL ad hoc qui joignent les trois sources. L'entreprise ne veut ni copier les données ni gérer de serveurs ou de clusters.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create federated query external schemas in an Amazon Redshift provisioned cluster for DynamoDB and MySQL.", fr: "Créer dans un cluster provisionné Amazon Redshift des schémas externes de requête fédérée pour DynamoDB et MySQL." }
    - id: b
      text: { en: "Use Amazon Athena Federated Query with data source connectors for DynamoDB and MySQL, and join them with the data lake tables.", fr: "Utiliser Amazon Athena Federated Query avec des connecteurs de sources de données pour DynamoDB et MySQL, et les joindre aux tables du lac de données." }
    - id: c
      text: { en: "Run a nightly AWS Glue job that copies the DynamoDB and MySQL tables to the data lake, then query them with Athena.", fr: "Exécuter chaque nuit une tâche AWS Glue qui copie les tables DynamoDB et MySQL dans le lac de données, puis les interroger avec Athena." }
    - id: d
      text: { en: "Launch an Amazon EMR cluster with Trino and configure connectors for the three sources.", fr: "Lancer un cluster Amazon EMR avec Trino et configurer des connecteurs pour les trois sources." }
answer: { optionId: b }
explanation:
  correct:
    en: "Athena Federated Query runs SQL across relational, non-relational, object, and custom data sources by using data source connectors, which include DynamoDB and MySQL. Athena invokes the connectors, manages parallelism, and pushes down filters, so analysts query the sources in place with a serverless service."
    fr: "Athena Federated Query exécute du SQL sur des sources relationnelles, non relationnelles, objet et personnalisées grâce à des connecteurs de sources de données, dont DynamoDB et MySQL. Athena appelle les connecteurs, gère le parallélisme et pousse les filtres vers les sources : les analystes interrogent les sources sur place avec un service sans serveur."
  options:
    a:
      en: "Redshift federated queries support PostgreSQL and MySQL engines on RDS and Aurora, not DynamoDB, and a provisioned cluster must be managed."
      fr: "Les requêtes fédérées Redshift prennent en charge les moteurs PostgreSQL et MySQL sur RDS et Aurora, pas DynamoDB, et un cluster provisionné doit être géré."
    c:
      en: "A nightly copy duplicates the data, which the company does not want, and adds a job to maintain."
      fr: "Une copie nocturne duplique les données, ce que l'entreprise ne veut pas, et ajoute une tâche à maintenir."
    d:
      en: "An EMR cluster is a cluster to size and operate, which the company wants to avoid for a few weekly queries."
      fr: "Un cluster EMR est un cluster à dimensionner et exploiter, ce que l'entreprise veut éviter pour quelques requêtes hebdomadaires."
references:
  - title: Use Amazon Athena Federated Query
    url: https://docs.aws.amazon.com/athena/latest/ug/federated-queries.html
