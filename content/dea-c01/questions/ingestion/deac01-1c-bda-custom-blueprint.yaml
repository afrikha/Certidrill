id: deac01-1c-bda-custom-blueprint
objective: "1.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer receives thousands of supplier invoices each day as PDF files and scanned images, in many different layouts. A data pipeline must extract the invoice number, supplier name, total amount and due date of each invoice as structured JSON for downstream loading. The company has no labeled training data and wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Un fabricant reçoit chaque jour des milliers de factures de fournisseurs sous forme de fichiers PDF et d'images numérisées, avec de nombreuses mises en page différentes. Un pipeline de données doit extraire le numéro de facture, le nom du fournisseur, le montant total et la date d'échéance de chaque facture au format JSON structuré pour le chargement en aval. L'entreprise ne dispose d'aucune donnée d'entraînement étiquetée et veut le MOINS d'effort de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Process the files with an Amazon Bedrock Data Automation project that uses only the standard output for documents.", fr: "Traiter les fichiers avec un projet Amazon Bedrock Data Automation qui utilise uniquement la sortie standard pour les documents." } }
    - { id: b, text: { en: "Label a sample of invoices and train a custom extraction model in Amazon SageMaker AI.", fr: "Étiqueter un échantillon de factures et entraîner un modèle d'extraction personnalisé dans Amazon SageMaker AI." } }
    - { id: c, text: { en: "Run an AWS Glue crawler with a custom classifier on the invoice files.", fr: "Exécuter un robot d'analyse AWS Glue avec un classificateur personnalisé sur les fichiers de factures." } }
    - { id: d, text: { en: "Process the files with an Amazon Bedrock Data Automation project that has a custom output blueprint with the four fields.", fr: "Traiter les fichiers avec un projet Amazon Bedrock Data Automation doté d'un blueprint de sortie personnalisée avec les quatre champs." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Bedrock Data Automation uses generative AI to extract structured insights from unstructured content. Custom output, available for documents, images and audio, uses a blueprint that lists the exact fields to extract, and a project referenced in the InvokeDataAutomationAsync call applies it to each file without model training."
    fr: "Bedrock Data Automation utilise l'IA générative pour extraire des informations structurées de contenu non structuré. La sortie personnalisée, disponible pour les documents, les images et l'audio, utilise un blueprint qui liste les champs exacts à extraire, et un projet référencé dans l'appel InvokeDataAutomationAsync l'applique à chaque fichier sans entraînement de modèle."
  options:
    a:
      en: "Standard output returns commonly needed information such as a document summary; choosing the exact fields requires a custom output blueprint."
      fr: "La sortie standard renvoie des informations couramment nécessaires comme un résumé du document ; choisir les champs exacts exige un blueprint de sortie personnalisée."
    b:
      en: "Training a custom model needs labeled data, which the company does not have, and much more development effort."
      fr: "L'entraînement d'un modèle personnalisé exige des données étiquetées, dont l'entreprise ne dispose pas, et beaucoup plus d'effort de développement."
    c:
      en: "Crawlers infer table schemas of data files for the Data Catalog; they do not read fields from PDF files or images."
      fr: "Les robots d'analyse déduisent les schémas de table de fichiers de données pour le catalogue de données ; ils ne lisent pas de champs dans des fichiers PDF ou des images."
references:
  - title: How Bedrock Data Automation works
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/bda-how-it-works.html
