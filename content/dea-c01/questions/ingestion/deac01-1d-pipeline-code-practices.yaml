id: deac01-1d-pipeline-code-practices
objective: "1.4.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company runs AWS Glue jobs in a development account and a production account. The scripts are edited in the console of each account and contain hard-coded production bucket names. Last month a test run in development overwrote production data, and nobody knows which script version runs in production.

    Which combination of practices will prevent these problems? (Choose two.)
  fr: |
    Une entreprise exécute des tâches AWS Glue dans un compte de développement et un compte de production. Les scripts sont modifiés dans la console de chaque compte et contiennent des noms de compartiments de production codés en dur. Le mois dernier, une exécution de test en développement a écrasé des données de production, et personne ne sait quelle version de script s'exécute en production.

    Quelle combinaison de pratiques évitera ces problèmes ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Give the development jobs an IAM role that can write to the production buckets so that tests use realistic data.", fr: "Donner aux tâches de développement un rôle IAM capable d'écrire dans les compartiments de production pour que les tests utilisent des données réalistes." } }
    - { id: b, text: { en: "Turn off continuous logging for the jobs to reduce the noise in CloudWatch Logs.", fr: "Désactiver la journalisation continue des tâches pour réduire le bruit dans CloudWatch Logs." } }
    - { id: c, text: { en: "Store the scripts and job definitions in a Git repository and deploy them to each account through a CI/CD pipeline that runs tests.", fr: "Stocker les scripts et les définitions de tâches dans un dépôt Git et les déployer dans chaque compte via un pipeline CI/CD qui exécute des tests." } }
    - { id: d, text: { en: "Fix production issues directly in the production console and copy the change to development afterward.", fr: "Corriger les incidents directement dans la console de production et reporter ensuite la modification en développement." } }
    - { id: e, text: { en: "Pass the bucket names as job parameters that the script reads with getResolvedOptions, with different values in each account.", fr: "Passer les noms de compartiments en paramètres de tâche que le script lit avec getResolvedOptions, avec des valeurs différentes dans chaque compte." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Version control with automated deployment gives one reviewed source of truth for every script and shows exactly which version runs in each account. Job parameters, read in the script with getResolvedOptions, keep environment-specific values such as bucket names out of the code, so the same script writes to development buckets in development and to production buckets in production.
    fr: |
      Le contrôle de version associé à un déploiement automatisé fournit une source de vérité unique et revue pour chaque script et indique exactement quelle version s'exécute dans chaque compte. Les paramètres de tâche, lus dans le script avec getResolvedOptions, sortent du code les valeurs propres à chaque environnement, comme les noms de compartiments : le même script écrit dans les compartiments de développement en développement et dans ceux de production en production.
  options:
    a: { en: "Write access from development to production is what allowed the overwrite; environments must be isolated.", fr: "C'est l'accès en écriture du développement vers la production qui a permis l'écrasement ; les environnements doivent être isolés." }
    b: { en: "Less logging makes failures harder to investigate and does not address either problem.", fr: "Moins de journalisation rend les échecs plus difficiles à analyser et ne règle aucun des deux problèmes." }
    d: { en: "Console hotfixes in production are the cause of the unknown script versions.", fr: "Les correctifs faits dans la console de production sont la cause des versions de scripts inconnues." }
references:
  - title: Using Git version control systems in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/edit-job-add-source-control-integration.html
  - title: Using job parameters in AWS Glue jobs
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-glue-arguments.html
