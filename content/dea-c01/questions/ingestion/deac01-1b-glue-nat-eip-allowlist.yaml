id: deac01-1b-glue-nat-eip-allowlist
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs an AWS Glue ETL job that uses a JDBC connection to read shipment data from a partner's PostgreSQL database over the internet. The partner's firewall accepts connections only from public IP addresses that the company registers in advance, and the registered addresses must not change between job runs. The job also reads tables from an Amazon RDS database in the company's VPC.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute une tâche ETL AWS Glue qui utilise une connexion JDBC pour lire des données d'expédition dans la base de données PostgreSQL d'un partenaire, par Internet. Le pare-feu du partenaire n'accepte que les connexions provenant d'adresses IP publiques que l'entreprise enregistre à l'avance, et ces adresses ne doivent pas changer d'une exécution à l'autre. La tâche lit aussi des tables d'une base de données Amazon RDS située dans le VPC de l'entreprise.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use a private subnet for the Glue connection, route its internet traffic to a NAT gateway, and register the NAT gateway's Elastic IP address with the partner.", fr: "Utiliser un sous-réseau privé pour la connexion Glue, router son trafic Internet vers une passerelle NAT et enregistrer l'adresse IP Elastic de la passerelle NAT auprès du partenaire." }
    - id: b
      text: { en: "Allocate Elastic IP addresses, associate them with the network interfaces that Glue creates for the job, and register them with the partner.", fr: "Allouer des adresses IP Elastic, les associer aux interfaces réseau que Glue crée pour la tâche et les enregistrer auprès du partenaire." }
    - id: c
      text: { en: "Register the AWS IP address ranges of the Region, taken from the published ip-ranges.json file, with the partner.", fr: "Enregistrer auprès du partenaire les plages d'adresses IP AWS de la Région, extraites du fichier publié ip-ranges.json." }
    - id: d
      text: { en: "Use a public subnet with a route to an internet gateway for the Glue connection, and register the subnet's CIDR range with the partner.", fr: "Utiliser pour la connexion Glue un sous-réseau public avec un itinéraire vers une passerelle Internet, et enregistrer la plage CIDR du sous-réseau auprès du partenaire." }
answer: { optionId: a }
explanation:
  correct:
    en: "A Glue job with a connection runs on elastic network interfaces that receive only private IP addresses from the subnet. To reach the internet as well as VPC resources, the VPC needs a NAT gateway, whose fixed Elastic IP address is the source address that the partner sees and can allowlist."
    fr: "Une tâche Glue avec une connexion s'exécute sur des interfaces réseau Elastic qui ne reçoivent que des adresses IP privées du sous-réseau. Pour atteindre Internet en plus des ressources du VPC, le VPC a besoin d'une passerelle NAT, dont l'adresse IP Elastic fixe est l'adresse source que le partenaire voit et peut autoriser."
  options:
    b:
      en: "Glue manages the network interfaces of the job, creates them for each run, and assigns no public IP addresses to them, so fixed Elastic IP addresses cannot be attached."
      fr: "Glue gère les interfaces réseau de la tâche, les crée à chaque exécution et ne leur attribue aucune adresse IP publique : on ne peut pas y attacher d'adresses IP Elastic fixes."
    c:
      en: "Traffic of a job that uses a connection leaves from network interfaces in the company's VPC, and allowlisting the broad AWS ranges of a Region would also admit other AWS customers."
      fr: "Le trafic d'une tâche qui utilise une connexion sort d'interfaces réseau du VPC de l'entreprise, et autoriser les larges plages AWS d'une Région admettrait aussi d'autres clients AWS."
    d:
      en: "The Glue network interfaces have no public IP addresses, so an internet gateway route alone gives them no internet access, and private subnet addresses are not visible to the partner."
      fr: "Les interfaces réseau Glue n'ont pas d'adresse IP publique : un itinéraire vers une passerelle Internet ne leur donne pas accès à Internet, et le partenaire ne voit pas les adresses privées du sous-réseau."
references:
  - title: Setting up network access to data stores
    url: https://docs.aws.amazon.com/glue/latest/dg/start-connecting.html
  - title: NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
