id: deac01-1d-lambda-kafka-provisioned-pollers
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A trading company uses a Lambda function with an Amazon MSK event source mapping in the default scaling mode to process market data from a topic that has 60 partitions. At market open, traffic jumps within seconds from almost nothing to about 150 MB/s. Every morning the offset lag grows for several minutes before processing catches up. Records must stay in order within each partition, and the function is never throttled.

    Which solution will meet these requirements?
  fr: |
    Une société de courtage utilise une fonction Lambda avec un mappage de source d'événements Amazon MSK dans le mode de mise à l'échelle par défaut pour traiter des données de marché d'une rubrique Kafka (topic) de 60 partitions. À l'ouverture du marché, le trafic passe en quelques secondes de presque rien à environ 150 Mo/s. Chaque matin, le décalage d'offset (offset lag) augmente pendant plusieurs minutes avant que le traitement ne rattrape son retard. Les enregistrements doivent rester dans l'ordre au sein de chaque partition, et la fonction n'est jamais limitée (throttled).

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure provisioned concurrency of 60 on an alias of the function and point the event source mapping to the alias.", fr: "Configurer une simultanéité provisionnée de 60 sur un alias de la fonction et faire pointer le mappage de source d'événements vers l'alias." } }
    - { id: b, text: { en: "Switch the event source mapping to provisioned mode with a minimum of 30 event pollers and a maximum of 60 event pollers.", fr: "Passer le mappage de source d'événements en mode provisionné avec un minimum de 30 et un maximum de 60 pollers d'événements (event pollers)." } }
    - { id: c, text: { en: "Set the reserved concurrency of the function to 1,000.", fr: "Définir la simultanéité réservée de la fonction sur 1 000." } }
    - { id: d, text: { en: "Increase the number of partitions of the topic to 600 and keep the default scaling mode.", fr: "Porter le nombre de partitions de la rubrique à 600 et conserver le mode de mise à l'échelle par défaut." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In on-demand mode, Lambda evaluates the offset lag every minute and adds event pollers gradually, which causes the lag at each surge. Provisioned mode keeps a minimum number of dedicated pollers ready; each poller handles up to about 5 MB/s, so 30 pollers cover 150 MB/s. Lambda caps the maximum pollers at the number of partitions to keep ordering within each partition.
    fr: |
      En mode à la demande, Lambda évalue le décalage d'offset chaque minute et ajoute des pollers progressivement, ce qui crée le retard à chaque pic. Le mode provisionné maintient prêt un nombre minimal de pollers dédiés ; chaque poller traite jusqu'à environ 5 Mo/s, donc 30 pollers couvrent 150 Mo/s. Lambda plafonne le nombre maximal de pollers au nombre de partitions pour préserver l'ordre au sein de chaque partition.
  options:
    a: { en: "Provisioned concurrency pre-initializes execution environments, but the bottleneck is the number of event pollers that read the topic, not cold starts.", fr: "La simultanéité provisionnée pré-initialise des environnements d'exécution, mais le goulot d'étranglement est le nombre de pollers qui lisent la rubrique, pas les démarrages à froid." }
    c: { en: "The function is not throttled, so more reserved concurrency does not make the pollers scale faster.", fr: "La fonction n'est pas limitée : davantage de simultanéité réservée ne fait pas évoluer les pollers plus vite." }
    d: { en: "In on-demand mode, pollers still scale only after each lag evaluation, and repartitioning the topic changes which partition each key maps to.", fr: "En mode à la demande, les pollers n'évoluent toujours qu'après chaque évaluation du décalage, et repartitionner la rubrique change la partition associée à chaque clé." }
references:
  - title: Apache Kafka event poller scaling modes in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/kafka-scaling-modes.html
