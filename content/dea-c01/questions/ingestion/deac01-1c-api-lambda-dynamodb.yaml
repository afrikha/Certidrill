id: deac01-1c-api-lambda-dynamodb
objective: "1.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A shipping company keeps shipment status in two Amazon DynamoDB tables. Partner systems need an HTTPS REST endpoint that returns the status of one shipment by its ID. The response must combine items from both tables and mask the recipient's phone number. The company wants a serverless solution.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'expédition conserve l'état des expéditions dans deux tables Amazon DynamoDB. Des systèmes partenaires ont besoin d'un point de terminaison REST HTTPS qui renvoie l'état d'une expédition à partir de son ID. La réponse doit combiner des éléments des deux tables et masquer le numéro de téléphone du destinataire. L'entreprise veut une solution sans serveur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create IAM users for the partners and let them call the DynamoDB GetItem API on both tables.", fr: "Créer des utilisateurs IAM pour les partenaires et les laisser appeler l'API GetItem de DynamoDB sur les deux tables." } }
    - { id: b, text: { en: "Export the tables to Amazon S3 every hour and let the partners query the files with Amazon Athena.", fr: "Exporter les tables vers Amazon S3 toutes les heures et laisser les partenaires interroger les fichiers avec Amazon Athena." } }
    - { id: c, text: { en: "Create an Amazon API Gateway REST API with a Lambda integration that reads both tables and masks the field.", fr: "Créer une API REST Amazon API Gateway avec une intégration Lambda qui lit les deux tables et masque le champ." } }
    - { id: d, text: { en: "Stream the tables to Amazon Data Firehose and deliver the records to an HTTP endpoint for each partner.", fr: "Diffuser les tables vers Amazon Data Firehose et livrer les enregistrements à un point de terminaison HTTP pour chaque partenaire." } }
answer: { optionId: c }
explanation:
  correct:
    en: "API Gateway exposes a managed HTTPS REST endpoint, and a Lambda integration runs the custom logic: two reads, the merge and the masking. Both services are serverless and scale with the request volume."
    fr: "API Gateway expose un point de terminaison REST HTTPS géré, et une intégration Lambda exécute la logique personnalisée : deux lectures, la fusion et le masquage. Les deux services sont sans serveur et se mettent à l'échelle avec le volume de requêtes."
  options:
    a:
      en: "Direct table access exposes the unmasked phone numbers and gives no single endpoint that combines the two tables."
      fr: "L'accès direct aux tables expose les numéros de téléphone non masqués et ne fournit aucun point de terminaison unique qui combine les deux tables."
    b:
      en: "Hourly exports are not a REST endpoint, return stale data, and expose the unmasked field."
      fr: "Des exportations horaires ne constituent pas un point de terminaison REST, renvoient des données périmées et exposent le champ non masqué."
    d:
      en: "Firehose pushes a stream of records to destinations; partners cannot request one shipment on demand."
      fr: "Firehose envoie un flux d'enregistrements vers des destinations ; les partenaires ne peuvent pas demander une expédition à la demande."
references:
  - title: "Tutorial: Create a calculator REST API with two AWS service integrations and one Lambda non-proxy integration"
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/integrating-api-with-aws-services-lambda.html
