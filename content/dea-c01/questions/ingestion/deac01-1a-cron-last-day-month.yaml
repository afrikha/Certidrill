id: deac01-1a-cron-last-day-month
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A finance company uses an Amazon EventBridge Scheduler cron-based schedule in UTC to start an AWS Step Functions state machine that runs the month-end close pipeline. The pipeline must start at 23:30 UTC on the last day of every month, including months with 28, 29 or 30 days.

    Which schedule expression will meet this requirement?
  fr: |
    Une entreprise financière utilise une planification cron Amazon EventBridge Scheduler en UTC pour démarrer une machine d'état AWS Step Functions qui exécute le pipeline de clôture mensuelle. Le pipeline doit démarrer à 23 h 30 UTC le dernier jour de chaque mois, y compris les mois de 28, 29 ou 30 jours.

    Quelle expression de planification répond à cette exigence ?
body:
  options:
    - { id: a, text: "`cron(30 23 31 * ? *)`" }
    - { id: b, text: "`cron(30 23 L * * *)`" }
    - { id: c, text: "`cron(23 30 L * ? *)`" }
    - { id: d, text: "`cron(30 23 L * ? *)`" }
answer: { optionId: d }
explanation:
  correct:
    en: "The fields are minutes, hours, day-of-month, month, day-of-week and year. L in the day-of-month field means the last day of the month, whatever its length, and day-of-week must then be `?`. `cron(30 23 L * ? *)` therefore runs at 23:30 UTC on the last day of every month."
    fr: "Les champs sont les minutes, les heures, le jour du mois, le mois, le jour de la semaine et l'année. L dans le champ du jour du mois désigne le dernier jour du mois, quelle que soit sa longueur, et le jour de la semaine doit alors valoir `?`. `cron(30 23 L * ? *)` s'exécute donc à 23 h 30 UTC le dernier jour de chaque mois."
  options:
    a:
      en: "Day 31 does not exist in months with 28, 29 or 30 days, so the pipeline would not start in those months."
      fr: "Le jour 31 n'existe pas dans les mois de 28, 29 ou 30 jours : le pipeline ne démarrerait pas ces mois-là."
    b:
      en: "When day-of-month has a value, day-of-week must be `?`; this expression is not valid."
      fr: "Lorsque le jour du mois a une valeur, le jour de la semaine doit valoir `?` ; cette expression n'est pas valide."
    c:
      en: "Minutes come before hours, so this sets minute 23 and hour 30, which is not a valid hour."
      fr: "Les minutes précèdent les heures : cette expression définit la minute 23 et l'heure 30, qui n'est pas une heure valide."
references:
  - title: Schedule types in EventBridge Scheduler - EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html
