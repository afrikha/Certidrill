id: deac01-1a-s3-eventbridge-size-routing
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company ingests files into the `raw/` prefix of an Amazon S3 bucket. When a file larger than 100 MB is created, an AWS Step Functions state machine must start. When a smaller file is created, a message must be sent to an Amazon SQS queue. The company wants to route the events without writing code.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de médias ingère des fichiers sous le préfixe `raw/` d'un compartiment Amazon S3. Lorsqu'un fichier de plus de 100 Mo est créé, une machine d'état AWS Step Functions doit démarrer. Lorsqu'un fichier plus petit est créé, un message doit être envoyé à une file d'attente Amazon SQS. L'entreprise veut router les événements sans écrire de code.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on the bucket setting that sends event notifications to Amazon EventBridge.", fr: "Activer le paramètre du compartiment qui envoie les notifications d'événements à Amazon EventBridge." } }
    - { id: b, text: { en: "Add an S3 event notification configuration with the state machine as its destination and the prefix `raw/`.", fr: "Ajouter une configuration de notification d'événement S3 avec la machine d'état comme destination et le préfixe `raw/`." } }
    - { id: c, text: { en: "Create two EventBridge rules for Object Created events that filter on the `raw/` key prefix and on `object.size`, one per target.", fr: "Créer deux règles EventBridge pour les événements Object Created qui filtrent sur le préfixe de clé `raw/` et sur `object.size`, une par cible." } }
    - { id: d, text: { en: "Add a bucket policy that allows `events.amazonaws.com` to call `s3:GetObject` on the `raw/` prefix.", fr: "Ajouter une politique de compartiment qui autorise `events.amazonaws.com` à appeler `s3:GetObject` sur le préfixe `raw/`." } }
    - { id: e, text: { en: "Add two S3 event notification configurations for the `raw/` prefix that use key filter rules on the object size.", fr: "Ajouter deux configurations de notification d'événement S3 pour le préfixe `raw/` qui utilisent des règles de filtre de clé sur la taille de l'objet." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Once EventBridge is turned on for the bucket, S3 sends all its supported events, such as Object Created, to EventBridge. Rules can then match the key prefix and use numeric matching on the object size, and route each case to a different target, such as a state machine or a queue."
    fr: "Une fois EventBridge activé pour le compartiment, S3 envoie tous ses événements pris en charge, tels que Object Created, à EventBridge. Des règles peuvent alors correspondre au préfixe de clé, utiliser une correspondance numérique sur la taille de l'objet et router chaque cas vers une cible différente, telle qu'une machine d'état ou une file d'attente."
  options:
    b:
      en: "S3 Event Notifications support SNS topics, SQS queues, Lambda functions and EventBridge as destinations, not Step Functions state machines."
      fr: "Les notifications d'événements S3 prennent en charge comme destinations les rubriques SNS, les files d'attente SQS, les fonctions Lambda et EventBridge, pas les machines d'état Step Functions."
    d:
      en: "Delivery of S3 events to EventBridge needs no bucket policy, and reading the objects is not part of routing the events."
      fr: "La livraison des événements S3 à EventBridge ne nécessite aucune politique de compartiment, et la lecture des objets ne fait pas partie du routage des événements."
    e:
      en: "Notification filters work only on the prefix and suffix of the key name; they cannot filter on object size."
      fr: "Les filtres de notification ne portent que sur le préfixe et le suffixe du nom de clé ; ils ne peuvent pas filtrer sur la taille de l'objet."
references:
  - title: Using EventBridge - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
