id: deac01-1e-cicd-glue-local-limits
objective: "1.4.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A CI pipeline runs pytest for AWS Glue 5.0 PySpark scripts inside the public.ecr.aws/glue/aws-glue-libs:5 container in AWS CodeBuild. The unit tests of the transformations pass. The team adds tests that check the AWS Glue Data Quality ruleset of the job and the incremental processing that relies on job bookmarks, and these tests fail in the container. All tests must run automatically before a release is promoted to production.

    Which solution will meet these requirements?
  fr: |
    Un pipeline de CI exécute pytest pour des scripts PySpark AWS Glue 5.0 dans le conteneur public.ecr.aws/glue/aws-glue-libs:5 dans AWS CodeBuild. Les tests unitaires des transformations réussissent. L'équipe ajoute des tests qui vérifient l'ensemble de règles AWS Glue Data Quality de la tâche et le traitement incrémentiel qui repose sur les signets de tâche, et ces tests échouent dans le conteneur. Tous les tests doivent s'exécuter automatiquement avant qu'une version soit promue en production.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a pipeline stage that deploys the job to a test account and runs it there with sample data.", fr: "Ajouter une étape de pipeline qui déploie la tâche dans un compte de test et l'y exécute avec des données d'exemple." } }
    - { id: b, text: { en: "Mount the JAR files of Glue Data Quality and job bookmarks into /opt/spark/jars/ in the container before pytest runs.", fr: "Monter les fichiers JAR de Glue Data Quality et des signets de tâche dans /opt/spark/jars/ du conteneur avant l'exécution de pytest." } }
    - { id: c, text: { en: "Run the new tests against the production job after each production deployment, and roll back on failure.", fr: "Exécuter les nouveaux tests sur la tâche de production après chaque déploiement en production, et revenir en arrière en cas d'échec." } }
    - { id: d, text: { en: "Skip the new tests in CodeBuild, and ask a data steward to review the ruleset before approving each release.", fr: "Ignorer les nouveaux tests dans CodeBuild, et demander à un responsable des données de relire l'ensemble de règles avant d'approuver chaque version." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Glue container image supports local development and unit tests, but job bookmarks and AWS Glue Data Quality are among the features that it does not support. Those checks must run on a real Glue job, so an automated stage that deploys and runs the job in a test account covers them before promotion."
    fr: "L'image de conteneur Glue prend en charge le développement local et les tests unitaires, mais les signets de tâche et AWS Glue Data Quality font partie des fonctionnalités qu'elle ne prend pas en charge. Ces vérifications doivent s'exécuter sur une vraie tâche Glue : une étape automatisée qui déploie et exécute la tâche dans un compte de test les couvre donc avant la promotion."
  options:
    b:
      en: "Mounting JAR files adds JDBC drivers, but it does not make unsupported Glue features such as bookmarks or Data Quality available locally."
      fr: "Monter des fichiers JAR ajoute des pilotes JDBC, mais ne rend pas disponibles en local des fonctionnalités Glue non prises en charge comme les signets ou Data Quality."
    c:
      en: "Tests after the production deployment do not run before promotion, which the requirement demands."
      fr: "Des tests après le déploiement en production ne s'exécutent pas avant la promotion, comme l'exige le besoin."
    d:
      en: "A manual review is not an automated test, and the bookmark behavior would remain untested."
      fr: "Une relecture manuelle n'est pas un test automatisé, et le comportement des signets resterait non testé."
references:
  - title: Develop and test AWS Glue jobs locally using a Docker image
    url: https://docs.aws.amazon.com/glue/latest/dg/develop-local-docker-image.html
