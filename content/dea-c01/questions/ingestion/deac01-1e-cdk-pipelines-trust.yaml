id: deac01-1e-cdk-pipelines-trust
objective: "1.4.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses CDK Pipelines in a tooling account (111111111111) to deploy its data platform stacks to a test account and a prod account in eu-west-1. Deployments to the test account succeed. A new prod stage fails because the pipeline cannot assume the deployment roles in the prod account, which was bootstrapped with the command cdk bootstrap aws://333333333333/eu-west-1 and no other option. Security requires prod deployments to run under a restricted managed policy instead of AdministratorAccess.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise CDK Pipelines dans un compte d'outillage (111111111111) pour déployer les piles de sa plateforme de données dans un compte de test et un compte de production, dans eu-west-1. Les déploiements dans le compte de test réussissent. Une nouvelle étape de production échoue, car le pipeline ne peut pas endosser les rôles de déploiement du compte de production, amorcé avec la commande cdk bootstrap aws://333333333333/eu-west-1 sans autre option. La sécurité exige que les déploiements en production s'exécutent sous une politique gérée restreinte au lieu d'AdministratorAccess.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an IAM user in the prod account, store its access keys in AWS Secrets Manager, and use them in the prod stage.", fr: "Créer un utilisateur IAM dans le compte de production, stocker ses clés d'accès dans AWS Secrets Manager, et les utiliser dans l'étape de production." } }
    - { id: b, text: { en: "Bootstrap the tooling account again with --trust 333333333333 and --cloudformation-execution-policies set to the restricted policy.", fr: "Amorcer de nouveau le compte d'outillage avec --trust 333333333333 et --cloudformation-execution-policies défini sur la politique restreinte." } }
    - { id: c, text: { en: "Bootstrap the prod account again with --trust 111111111111 and --cloudformation-execution-policies set to the restricted policy.", fr: "Amorcer de nouveau le compte de production avec --trust 111111111111 et --cloudformation-execution-policies défini sur la politique restreinte." } }
    - { id: d, text: { en: "Delete the CDKToolkit stack in the prod account, and deploy the prod stacks with cdk deploy from an administrator workstation.", fr: "Supprimer la pile CDKToolkit du compte de production, et déployer les piles de production avec cdk deploy depuis un poste d'administrateur." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Each target environment of CDK Pipelines must be bootstrapped with --trust set to the pipeline account, so that the pipeline can deploy into it. The --cloudformation-execution-policies option sets the managed policy that future deployments run under, which replaces the default AdministratorAccess with the restricted policy."
    fr: "Chaque environnement cible de CDK Pipelines doit être amorcé avec --trust défini sur le compte du pipeline, afin que le pipeline puisse y déployer. L'option --cloudformation-execution-policies définit la politique gérée sous laquelle s'exécutent les déploiements suivants, ce qui remplace l'AdministratorAccess par défaut par la politique restreinte."
  options:
    a:
      en: "Long-term access keys bypass the bootstrap roles that CDK Pipelines uses and add credentials to rotate and protect."
      fr: "Des clés d'accès à long terme contournent les rôles d'amorçage qu'utilise CDK Pipelines et ajoutent des informations d'identification à faire tourner et à protéger."
    b:
      en: "The trust is set in the target environment toward the pipeline account, not in the pipeline account toward the target."
      fr: "La confiance se définit dans l'environnement cible envers le compte du pipeline, et non dans le compte du pipeline envers la cible."
    d:
      en: "Deleting and recreating a bootstrap stack breaks the pipeline, and manual deployments drop continuous delivery."
      fr: "Supprimer puis recréer une pile d'amorçage casse le pipeline, et les déploiements manuels abandonnent la livraison continue."
references:
  - title: Continuous integration and delivery (CI/CD) using CDK Pipelines
    url: https://docs.aws.amazon.com/cdk/v2/guide/cdk-pipeline.html
