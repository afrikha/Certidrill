id: deac01-1a-kinesis-lambda-behavior
objective: "1.1.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team is designing a pipeline in which an AWS Lambda function processes an Amazon Kinesis data stream through an event source mapping with the default error handling settings.

    Which statements about this integration are true? (Choose two.)
  fr: |
    Une équipe d'ingénierie des données conçoit un pipeline dans lequel une fonction AWS Lambda traite un flux de données Amazon Kinesis via un mappage de source d'événement avec les paramètres de gestion des erreurs par défaut.

    Quelles affirmations sur cette intégration sont vraies ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Lambda polls each shard and invokes the function synchronously with a batch of records from a single shard.", fr: "Lambda interroge chaque partition et appelle la fonction de manière synchrone avec un lot d'enregistrements provenant d'une seule partition." } }
    - { id: b, text: { en: "Kinesis pushes each record to the function asynchronously, and Lambda retries a failed invocation twice.", fr: "Kinesis pousse chaque enregistrement vers la fonction de manière asynchrone, et Lambda retente deux fois un appel en échec." } }
    - { id: c, text: { en: "After a successful invocation, Lambda deletes the processed records from the stream.", fr: "Après un appel réussi, Lambda supprime du flux les enregistrements traités." } }
    - { id: d, text: { en: "If the function returns an error, Lambda stops processing that shard and retries the batch until it succeeds or the records expire.", fr: "Si la fonction renvoie une erreur, Lambda interrompt le traitement de cette partition et retente le lot jusqu'à sa réussite ou l'expiration des enregistrements." } }
    - { id: e, text: { en: "One event source mapping can read from several data streams and merge their records into each batch.", fr: "Un même mappage de source d'événement peut lire plusieurs flux de données et fusionner leurs enregistrements dans chaque lot." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The event source mapping polls each shard and invokes the function synchronously; each batch contains records from one shard. With the default settings, an error stops further processing of the shard, and Lambda retries until the records expire, so one bad record can block a shard for the whole retention period unless retries and record age are limited."
    fr: "Le mappage de source d'événement interroge chaque partition et appelle la fonction de manière synchrone ; chaque lot contient des enregistrements d'une seule partition. Avec les paramètres par défaut, une erreur interrompt le traitement de la partition, et Lambda retente jusqu'à l'expiration des enregistrements : un seul enregistrement défectueux peut bloquer une partition pendant toute la période de conservation si les nouvelles tentatives et l'âge des enregistrements ne sont pas limités."
  options:
    b:
      en: "Kinesis does not invoke Lambda; the mapping polls the stream and invokes synchronously, without the two retries of asynchronous invocation."
      fr: "Kinesis n'appelle pas Lambda ; le mappage interroge le flux et appelle de manière synchrone, sans les deux nouvelles tentatives de l'appel asynchrone."
    c:
      en: "Records stay in the stream until the retention period ends; Lambda only checkpoints its position in the shard."
      fr: "Les enregistrements restent dans le flux jusqu'à la fin de la période de conservation ; Lambda ne fait qu'enregistrer sa position dans la partition."
    e:
      en: "Each mapping reads one stream; several streams need several mappings, which can invoke the same function."
      fr: "Chaque mappage lit un seul flux ; plusieurs flux nécessitent plusieurs mappages, qui peuvent appeler la même fonction."
references:
  - title: Using Lambda to process records from Amazon Kinesis Data Streams - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
  - title: Retain discarded batch records for a Kinesis Data Streams event source in Lambda - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/kinesis-on-failure-destination.html
