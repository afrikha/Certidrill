id: deac01-1a-emr-serverless-hive
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecom company is moving its on-premises Hadoop platform to AWS and has already copied its HDFS data to Amazon S3. Every night, the company runs dozens of existing HiveQL scripts on this data. The company wants to run the scripts without rewriting them, without provisioning or managing clusters, and pay only while the scripts run.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de télécommunications migre sa plateforme Hadoop sur site vers AWS et a déjà copié ses données HDFS dans Amazon S3. Chaque nuit, l'entreprise exécute des dizaines de scripts HiveQL existants sur ces données. L'entreprise veut exécuter les scripts sans les réécrire, sans provisionner ni gérer de clusters, et ne payer que pendant l'exécution des scripts.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Convert each script to an AWS Glue ETL job written in PySpark and start the jobs with a scheduled Glue trigger.", fr: "Convertir chaque script en tâche ETL AWS Glue écrite en PySpark et démarrer les tâches avec un déclencheur Glue planifié." } }
    - { id: b, text: { en: "Create an Amazon EMR Serverless application with the Hive runtime and submit the existing scripts as job runs.", fr: "Créer une application Amazon EMR Serverless avec l'environnement d'exécution Hive et soumettre les scripts existants comme exécutions de tâches." } }
    - { id: c, text: { en: "Create a long-running Amazon EMR on EC2 cluster with Hive installed and submit the scripts as steps every night.", fr: "Créer un cluster Amazon EMR on EC2 permanent avec Hive installé et soumettre les scripts comme étapes chaque nuit." } }
    - { id: d, text: { en: "Load the data into Amazon Redshift Serverless and run the scripts through the Redshift Data API every night.", fr: "Charger les données dans Amazon Redshift Serverless et exécuter les scripts via l'API de données Redshift chaque nuit." } }
answer: { optionId: b }
explanation:
  correct:
    en: "EMR Serverless runs open-source frameworks such as Apache Hive and Apache Spark without clusters to configure or operate. It provisions workers when a job runs, scales them, and releases them when the job ends, so the existing HiveQL scripts run unchanged and the company pays only for the job runs."
    fr: "EMR Serverless exécute des frameworks open source tels qu'Apache Hive et Apache Spark sans cluster à configurer ni à exploiter. Il provisionne des workers lors de l'exécution d'une tâche, les met à l'échelle et les libère à la fin de la tâche : les scripts HiveQL existants s'exécutent sans modification et l'entreprise ne paie que les exécutions."
  options:
    a:
      en: "Glue ETL jobs run Spark or Python code, so every HiveQL script would have to be rewritten."
      fr: "Les tâches ETL Glue exécutent du code Spark ou Python : chaque script HiveQL devrait être réécrit."
    c:
      en: "A long-running EMR on EC2 cluster must be managed and is billed while it is idle during the day."
      fr: "Un cluster EMR on EC2 permanent doit être géré et est facturé pendant ses périodes d'inactivité dans la journée."
    d:
      en: "Redshift runs its own SQL dialect, so the HiveQL scripts would have to be rewritten, and the data would have to be loaded first."
      fr: "Redshift exécute son propre dialecte SQL : les scripts HiveQL devraient être réécrits, et les données d'abord chargées."
references:
  - title: What is Amazon EMR Serverless? - Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/emr-serverless.html
