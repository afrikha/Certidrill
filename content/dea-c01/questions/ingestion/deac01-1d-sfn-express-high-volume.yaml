id: deac01-1d-sfn-express-high-volume
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IoT company uses an AWS Step Functions Standard workflow to process each sensor reading: a Lambda function validates the reading, a second function enriches it, and a DynamoDB PutItem task stores it. The workflow receives about 3,000 executions per second, and each execution finishes in less than 2 seconds. The writes are idempotent. State transition charges have become the largest cost of the pipeline.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise IoT utilise un flux de travail Standard AWS Step Functions pour traiter chaque mesure de capteur : une fonction Lambda valide la mesure, une deuxième fonction l'enrichit et une tâche DynamoDB PutItem la stocke. Le flux de travail reçoit environ 3 000 exécutions par seconde, et chaque exécution se termine en moins de 2 secondes. Les écritures sont idempotentes. Les frais de transitions d'état sont devenus le premier poste de coût du pipeline.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Call UpdateStateMachine to change the type of the existing state machine from Standard to Express.", fr: "Appeler UpdateStateMachine pour faire passer le type de la machine d'état existante de Standard à Express." } }
    - { id: b, text: { en: "Keep the Standard workflow and group the two Lambda tasks in a Parallel state.", fr: "Conserver le flux de travail Standard et regrouper les deux tâches Lambda dans un état Parallel." } }
    - { id: c, text: { en: "Create a new state machine of type Express with the same definition and start it asynchronously for each reading.", fr: "Créer une nouvelle machine d'état de type Express avec la même définition et la démarrer de manière asynchrone pour chaque mesure." } }
    - { id: d, text: { en: "Replace the Lambda tasks with activities that worker processes on Amazon EC2 poll.", fr: "Remplacer les tâches Lambda par des activités interrogées par des processus de travail sur Amazon EC2." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Express workflows suit high-volume, short (up to five minutes) event processing and are billed by number of executions, duration, and memory instead of state transitions. Asynchronous Express workflows have at-least-once semantics, which is acceptable because the DynamoDB writes are idempotent."
    fr: "Les flux de travail Express conviennent au traitement d'événements à fort volume et de courte durée (cinq minutes au plus) et sont facturés au nombre d'exécutions, à la durée et à la mémoire plutôt qu'aux transitions d'état. Les flux Express asynchrones offrent une sémantique au moins une fois, ce qui est acceptable puisque les écritures DynamoDB sont idempotentes."
  options:
    a: { en: "The workflow type cannot be changed after a state machine is created; a new Express state machine is needed.", fr: "Le type de flux de travail ne peut pas être modifié après la création d'une machine d'état : il faut une nouvelle machine d'état Express." }
    b: { en: "A Parallel state still generates state transitions that Standard pricing charges, so the main cost remains.", fr: "Un état Parallel génère toujours des transitions d'état facturées par la tarification Standard : le coût principal demeure." }
    d: { en: "Activities are not supported by Express workflows, and EC2 workers add servers to run and pay for without removing the transition charges.", fr: "Les activités ne sont pas prises en charge par les flux Express, et les processus sur EC2 ajoutent des serveurs à exploiter et à payer sans supprimer les frais de transitions." }
references:
  - title: Choosing workflow type in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
