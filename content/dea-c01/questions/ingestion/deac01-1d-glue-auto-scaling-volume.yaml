id: deac01-1d-glue-auto-scaling-volume
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs a daily AWS Glue 4.0 Spark ETL job with a fixed 50 G.1X workers. The daily input varies between 5 GB and 500 GB. On small days most workers are idle, and the company pays for them anyway. The company wants the number of workers to follow the needs of each run, up to 50 workers, without changing the job manually.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute une tâche ETL Spark AWS Glue 4.0 quotidienne avec 50 nœuds de travail (workers) G.1X fixes. Le volume d'entrée quotidien varie entre 5 Go et 500 Go. Les jours de faible volume, la plupart des nœuds de travail sont inactifs et l'entreprise les paie quand même. L'entreprise veut que le nombre de nœuds de travail suive les besoins de chaque exécution, jusqu'à 50, sans modifier la tâche manuellement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable job bookmarks so that each run processes only the data that arrived since the previous run.", fr: "Activer les signets de tâche (job bookmarks) pour que chaque exécution ne traite que les données arrivées depuis l'exécution précédente." } }
    - { id: b, text: { en: "Change the job to the Flex execution class so that it runs on spare capacity.", fr: "Passer la tâche à la classe d'exécution Flex pour qu'elle s'exécute sur de la capacité inutilisée." } }
    - { id: c, text: { en: "Enable auto scaling on the job and set the maximum number of workers to 50.", fr: "Activer la mise à l'échelle automatique (auto scaling) sur la tâche et définir le nombre maximal de nœuds de travail sur 50." } }
    - { id: d, text: { en: "Create two scheduled triggers that start the job with a different number of workers on weekdays and on weekends.", fr: "Créer deux déclencheurs planifiés qui démarrent la tâche avec un nombre différent de nœuds de travail en semaine et le week-end." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With auto scaling (AWS Glue 3.0 or later), Glue starts with the workers needed at startup, adds workers when Spark requests more executors, and removes idle ones, never exceeding the maximum number of workers. The company is billed for the capacity actually provisioned during the run."
    fr: "Avec la mise à l'échelle automatique (AWS Glue 3.0 ou version ultérieure), Glue démarre avec les nœuds de travail nécessaires, en ajoute lorsque Spark demande davantage d'exécuteurs et retire ceux qui sont inactifs, sans jamais dépasser le nombre maximal défini. L'entreprise est facturée pour la capacité réellement provisionnée pendant l'exécution."
  options:
    a: { en: "Bookmarks avoid reprocessing old data, but the job still runs with 50 workers whatever the volume of the day.", fr: "Les signets évitent de retraiter les anciennes données, mais la tâche s'exécute toujours avec 50 nœuds de travail quel que soit le volume du jour." }
    b: { en: "Flex lowers the price of time-insensitive runs, but the number of workers stays fixed at the configured value.", fr: "Flex réduit le prix des exécutions non urgentes, mais le nombre de nœuds de travail reste fixé à la valeur configurée." }
    d: { en: "The input volume does not depend on the day of the week, so a fixed size per trigger still over- or under-provisions many runs.", fr: "Le volume d'entrée ne dépend pas du jour de la semaine : une taille fixe par déclencheur surdimensionne ou sous-dimensionne encore de nombreuses exécutions." }
references:
  - title: Using auto scaling for AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/auto-scaling.html
