id: deac01-1d-lambda-kinesis-batching-window
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Lambda function reads an Amazon Kinesis data stream through an event source mapping and writes each batch that it receives to Amazon S3 as one object. Traffic is low, so the function is invoked many times per minute with only a few records per batch, and the bucket fills with very small objects. The analytics team accepts up to 5 minutes of delay before the data lands in S3.

    Which solution will produce fewer, larger objects with the LEAST effort?
  fr: |
    Une fonction Lambda lit un flux de données Amazon Kinesis via un mappage de source d'événements et écrit chaque lot reçu dans Amazon S3 sous la forme d'un objet. Le trafic est faible : la fonction est appelée de nombreuses fois par minute avec seulement quelques enregistrements par lot, et le compartiment se remplit de très petits objets. L'équipe d'analyse accepte jusqu'à 5 minutes de délai avant que les données n'arrivent dans S3.

    Quelle solution produira des objets moins nombreux et plus volumineux avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Increase the ParallelizationFactor of the event source mapping from 1 to 10.", fr: "Faire passer le ParallelizationFactor du mappage de source d'événements de 1 à 10." } }
    - { id: b, text: { en: "Register the function as an enhanced fan-out consumer of the data stream.", fr: "Enregistrer la fonction comme consommateur à diffusion améliorée (enhanced fan-out) du flux de données." } }
    - { id: c, text: { en: "Configure provisioned concurrency on an alias of the function.", fr: "Configurer une simultanéité provisionnée sur un alias de la fonction." } }
    - { id: d, text: { en: "Set the batching window of the mapping to 300 seconds and raise the batch size.", fr: "Définir la fenêtre de traitement par lots du mappage sur 300 secondes et augmenter la taille de lot." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With a batching window (MaximumBatchingWindowInSeconds), Lambda buffers records for up to 300 seconds and invokes the function when the batch is full, the window expires, or the payload reaches 6 MB. Fewer invocations with more records each produce fewer, larger objects within the accepted delay."
    fr: "Avec une fenêtre de traitement par lots (MaximumBatchingWindowInSeconds), Lambda met en mémoire tampon les enregistrements pendant 300 secondes au plus et appelle la fonction lorsque le lot est plein, que la fenêtre expire ou que la charge utile atteint 6 Mo. Des appels moins nombreux avec davantage d'enregistrements chacun produisent des objets moins nombreux et plus volumineux dans le délai accepté."
  options:
    a: { en: "A higher factor processes more batches concurrently from each shard, which creates even more small objects.", fr: "Un facteur plus élevé traite davantage de lots simultanés par partition, ce qui crée encore plus de petits objets." }
    b: { en: "Enhanced fan-out pushes records with lower latency; it does not make the batches larger.", fr: "La diffusion améliorée pousse les enregistrements avec une latence plus faible ; elle n'agrandit pas les lots." }
    c: { en: "Provisioned concurrency reduces cold starts; it does not change how many records each batch contains.", fr: "La simultanéité provisionnée réduit les démarrages à froid ; elle ne change pas le nombre d'enregistrements par lot." }
references:
  - title: Using Lambda to process records from Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
