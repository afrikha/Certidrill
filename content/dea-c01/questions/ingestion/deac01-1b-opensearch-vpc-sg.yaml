id: deac01-1b-opensearch-vpc-sg
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company ingests application logs into an Amazon OpenSearch Service domain that was created with VPC access. Log shippers in the company's data center send unsigned HTTPS requests to the domain over an AWS Site-to-Site VPN connection. The domain access policy already allows all principals because the domain is reachable only through the VPC. Only the data center range 10.20.0.0/16 must be able to reach the domain, and the domain must stay private.

    Which solution will meet these requirements?
  fr: |
    Une entreprise ingère des journaux d'application dans un domaine Amazon OpenSearch Service créé avec l'accès VPC. Des agents d'expédition de journaux de son centre de données envoient des requêtes HTTPS non signées au domaine par une connexion AWS Site-to-Site VPN. La politique d'accès du domaine autorise déjà tous les principaux, car le domaine n'est accessible que par le VPC. Seule la plage du centre de données 10.20.0.0/16 doit pouvoir atteindre le domaine, et le domaine doit rester privé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an aws:SourceIp condition with the range 10.20.0.0/16 to the domain access policy.", fr: "Ajouter à la politique d'accès du domaine une condition aws:SourceIp avec la plage 10.20.0.0/16." }
    - id: b
      text: { en: "Allow inbound HTTPS from 10.20.0.0/16 in the security group of the domain and remove broader inbound rules.", fr: "Autoriser le trafic HTTPS entrant depuis 10.20.0.0/16 dans le groupe de sécurité du domaine et supprimer les règles entrantes plus larges." }
    - id: c
      text: { en: "Recreate the domain with a public endpoint and add an IP-based access policy that allows 10.20.0.0/16.", fr: "Recréer le domaine avec un point de terminaison public et ajouter une politique d'accès basée sur l'IP qui autorise 10.20.0.0/16." }
    - id: d
      text: { en: "Route the VPN traffic through a NAT gateway and allow the NAT gateway's Elastic IP address in the domain access policy.", fr: "Faire passer le trafic VPN par une passerelle NAT et autoriser l'adresse IP Elastic de la passerelle NAT dans la politique d'accès du domaine." }
answer: { optionId: b }
explanation:
  correct:
    en: "A domain with VPC access cannot use an IP-based access policy; the security groups attached to the domain control which IP addresses can reach it. An inbound HTTPS rule for the data center range keeps the domain private and limits access to that range."
    fr: "Un domaine avec accès VPC ne peut pas utiliser de politique d'accès basée sur l'IP ; ce sont les groupes de sécurité attachés au domaine qui contrôlent les adresses IP qui peuvent l'atteindre. Une règle HTTPS entrante pour la plage du centre de données garde le domaine privé et limite l'accès à cette plage."
  options:
    a:
      en: "OpenSearch Service does not let you configure an IP-based policy on a domain that has VPC access."
      fr: "OpenSearch Service ne permet pas de configurer une politique basée sur l'IP sur un domaine qui dispose de l'accès VPC."
    c:
      en: "A public endpoint breaks the requirement that the domain stays private."
      fr: "Un point de terminaison public enfreint l'exigence selon laquelle le domaine doit rester privé."
    d:
      en: "A NAT gateway translates outbound traffic to the internet; it does not apply to VPN traffic into the VPC, and the domain still cannot use an IP-based policy."
      fr: "Une passerelle NAT traduit le trafic sortant vers Internet ; elle ne s'applique pas au trafic VPN entrant dans le VPC, et le domaine ne peut toujours pas utiliser de politique basée sur l'IP."
references:
  - title: Identity and Access Management in Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ac.html
