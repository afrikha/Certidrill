id: deac01-1d-glue-job-run-insights
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue 4.0 Spark job fails a few times each month. The driver log shows only a generic message such as "An error occurred while calling o85.pyWriteDynamicFrame", and engineers spend hours searching the executor logs to find the cause. For future failures, the team wants the failing line of the script and a root cause analysis with a recommended action, without writing custom code.

    Which solution will meet these requirements?
  fr: |
    Une tâche Spark AWS Glue 4.0 échoue quelques fois par mois. Le journal du pilote n'affiche qu'un message générique comme « An error occurred while calling o85.pyWriteDynamicFrame », et les ingénieurs passent des heures à fouiller les journaux des exécuteurs pour trouver la cause. Pour les prochains échecs, l'équipe veut obtenir la ligne du script en échec et une analyse des causes premières avec une action recommandée, sans écrire de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the --enable-metrics job parameter to publish job profiling metrics.", fr: "Ajouter le paramètre de tâche --enable-metrics pour publier les métriques de profilage de la tâche." } }
    - { id: b, text: { en: "Enable the Spark UI so that the event logs of each run are stored in Amazon S3.", fr: "Activer l'interface Spark UI pour que les journaux d'événements de chaque exécution soient stockés dans Amazon S3." } }
    - { id: c, text: { en: "Enable job run insights on the job with the --enable-job-insights parameter.", fr: "Activer les informations sur l'exécution des tâches (job run insights) avec le paramètre --enable-job-insights." } }
    - { id: d, text: { en: "Increase the retention period of the /aws-glue/jobs log groups to 10 years.", fr: "Porter à 10 ans la période de conservation des groupes de journaux /aws-glue/jobs." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Job run insights (AWS Glue 2.0 and later) analyzes failed runs and writes two log streams: one with the failing line number, the last Spark action, and the related exception events, and one with a root cause analysis and recommended actions. It is enabled with the --enable-job-insights parameter or the Generate job insights option."
    fr: "Les informations sur l'exécution des tâches (AWS Glue 2.0 et versions ultérieures) analysent les exécutions en échec et écrivent deux flux de journaux : l'un avec le numéro de la ligne en échec, la dernière action Spark et les événements d'exception associés, l'autre avec une analyse des causes premières et des actions recommandées. Elles s'activent avec le paramètre --enable-job-insights ou l'option Generate job insights."
  options:
    a: { en: "Profiling metrics show resource usage over time; they do not identify the failing line or give a recommendation.", fr: "Les métriques de profilage montrent l'utilisation des ressources dans le temps ; elles n'identifient pas la ligne en échec et ne donnent pas de recommandation." }
    b: { en: "The Spark UI helps to explore stages and tasks, but engineers must still analyze the failure themselves.", fr: "L'interface Spark UI aide à explorer les étapes et les tâches, mais les ingénieurs doivent toujours analyser l'échec eux-mêmes." }
    d: { en: "Longer retention keeps the same unhelpful logs longer; it adds no analysis.", fr: "Une conservation plus longue garde plus longtemps les mêmes journaux peu utiles ; elle n'ajoute aucune analyse." }
references:
  - title: Monitoring with AWS Glue job run insights
    url: https://docs.aws.amazon.com/glue/latest/dg/monitor-job-insights.html
