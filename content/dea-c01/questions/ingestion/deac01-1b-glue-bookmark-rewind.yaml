id: deac01-1b-glue-bookmark-rewind
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue Spark ETL job with job bookmarks enabled runs every hour and processes the new files of an Amazon S3 prefix. A code change deployed three runs ago wrote wrong values to the output. The code is now fixed. The company must reprocess only the files that the last three runs processed, without reprocessing older files and without leaving wrong records in the output.

    Which solution will meet these requirements?
  fr: |
    Une tâche ETL Spark AWS Glue avec les signets de tâche activés s'exécute toutes les heures et traite les nouveaux fichiers d'un préfixe Amazon S3. Une modification de code déployée il y a trois exécutions a écrit des valeurs erronées dans la sortie. Le code est maintenant corrigé. L'entreprise doit retraiter uniquement les fichiers traités par les trois dernières exécutions, sans retraiter les fichiers plus anciens et sans laisser d'enregistrements erronés dans la sortie.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Reset the job bookmark with the reset-job-bookmark command, then run the job again with bookmarks enabled.", fr: "Réinitialiser le signet de tâche avec la commande reset-job-bookmark, puis relancer la tâche avec les signets activés." }
    - id: b
      text: { en: "Run the job once with job bookmarks disabled so that it reads its input again, then enable the bookmarks again.", fr: "Exécuter la tâche une fois avec les signets désactivés pour qu'elle relise son entrée, puis réactiver les signets." }
    - id: c
      text: { en: "Delete the output of the faulty runs, rewind the job bookmark to the last run before the faulty code, and run the job.", fr: "Supprimer la sortie des exécutions erronées, rembobiner le signet de tâche jusqu'à la dernière exécution antérieure au code erroné, puis exécuter la tâche." }
    - id: d
      text: { en: "Rename the transformation_ctx of the source in the script so that the job starts a new bookmark state.", fr: "Renommer le transformation_ctx de la source dans le script pour que la tâche démarre un nouvel état de signet." }
answer: { optionId: c }
explanation:
  correct:
    en: "Glue lets you rewind the job bookmarks of a Spark ETL job to any previous run, so the next run reprocesses only the data after that run, which supports backfills. Glue does not clean the target when a bookmark is rewound or reset, so the faulty output must be removed first to avoid wrong and duplicate records."
    fr: "Glue permet de rembobiner les signets d'une tâche ETL Spark jusqu'à n'importe quelle exécution précédente : l'exécution suivante ne retraite que les données postérieures à cette exécution, ce qui permet les remplissages rétroactifs. Glue ne nettoie pas la cible lorsqu'un signet est rembobiné ou réinitialisé : la sortie erronée doit donc être supprimée d'abord pour éviter des enregistrements erronés et en double."
  options:
    a:
      en: "A reset makes the next run process the whole dataset, including the older files that must not be reprocessed."
      fr: "Une réinitialisation fait traiter tout le jeu de données à l'exécution suivante, y compris les fichiers plus anciens qui ne doivent pas être retraités."
    b:
      en: "With bookmarks disabled, the job processes the entire dataset, not only the last three runs."
      fr: "Avec les signets désactivés, la tâche traite tout le jeu de données, pas seulement les trois dernières exécutions."
    d:
      en: "A new transformation context has no bookmark state, so the job reads every file again, and the faulty output stays in place."
      fr: "Un nouveau contexte de transformation n'a pas d'état de signet : la tâche relit tous les fichiers, et la sortie erronée reste en place."
references:
  - title: Tracking processed data using job bookmarks
    url: https://docs.aws.amazon.com/glue/latest/dg/monitor-continuations.html
