id: deac01-1d-redshift-copy-split-files
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every night, a company loads a single 60 GB GZIP-compressed CSV file from Amazon S3 into an Amazon Redshift provisioned cluster that has 8 slices. The load uses one COPY command and takes much longer than the other steps of the pipeline. The company wants to reduce the load time.

    Which solution will meet this requirement?
  fr: |
    Chaque nuit, une entreprise charge un unique fichier CSV de 60 Go compressé en GZIP depuis Amazon S3 dans un cluster provisionné Amazon Redshift qui compte 8 tranches (slices). Le chargement utilise une seule commande COPY et dure beaucoup plus longtemps que les autres étapes du pipeline. L'entreprise veut réduire la durée du chargement.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Replace the COPY command with INSERT INTO ... VALUES statements that each insert 1,000 rows.", fr: "Remplacer la commande COPY par des instructions INSERT INTO ... VALUES qui insèrent chacune 1 000 lignes." } }
    - { id: b, text: { en: "Split the export into 64 GZIP files of similar size under one prefix and load the prefix with a single COPY command.", fr: "Découper l'export en 64 fichiers GZIP de taille similaire sous un même préfixe et charger le préfixe avec une seule commande COPY." } }
    - { id: c, text: { en: "Define a compound sort key on the target table before the load.", fr: "Définir une clé de tri composée sur la table cible avant le chargement." } }
    - { id: d, text: { en: "Split the export into 8 files and run 8 COPY commands into the table at the same time from separate sessions.", fr: "Découper l'export en 8 fichiers et exécuter en même temps 8 commandes COPY vers la table depuis des sessions distinctes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A GZIP-compressed CSV file cannot be split automatically, so a single file is loaded serially. Splitting the data into files of similar size, 1 MB to 1 GB after compression, in a number that is a multiple of the slice count lets one COPY command load them in parallel on all slices."
    fr: "Un fichier CSV compressé en GZIP ne peut pas être découpé automatiquement : un fichier unique est chargé en série. Découper les données en fichiers de taille similaire, de 1 Mo à 1 Go après compression, en un nombre multiple du nombre de tranches, permet à une seule commande COPY de les charger en parallèle sur toutes les tranches."
  options:
    a: { en: "COPY loads large amounts of data much more efficiently than INSERT statements.", fr: "COPY charge de grands volumes de données beaucoup plus efficacement que des instructions INSERT." }
    c: { en: "A sort key helps queries filter data; it does not let the load run in parallel and adds sorting work.", fr: "Une clé de tri aide les requêtes à filtrer les données ; elle ne parallélise pas le chargement et ajoute du travail de tri." }
    d: { en: "Concurrent COPY commands into the same table force a serialized load, which is much slower than one COPY of the prefix.", fr: "Des commandes COPY simultanées vers la même table imposent un chargement sérialisé, beaucoup plus lent qu'une seule commande COPY du préfixe." }
references:
  - title: Loading data files
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_best-practices-use-multiple-files.html
  - title: Use a single COPY command to load from multiple files
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_best-practices-single-copy-command.html
