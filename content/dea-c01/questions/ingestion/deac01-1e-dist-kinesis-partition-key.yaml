id: deac01-1e-dist-kinesis-partition-key
objective: "1.4.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IoT company ingests events from 50,000 devices into an Amazon Kinesis Data Streams stream in provisioned mode with 10 shards. The producers use the event type, which has three possible values, as the partition key. The total write rate is about 4 MB per second, but producers receive ProvisionedThroughputExceededException errors, and metrics show traffic on only three shards. Events from the same device must stay in order.

    Which solution will meet these requirements?
  fr: |
    Une entreprise IoT ingère les événements de 50 000 appareils dans un flux Amazon Kinesis Data Streams en mode provisionné avec 10 partitions (shards). Les producteurs utilisent comme clé de partition le type d'événement, qui a trois valeurs possibles. Le débit d'écriture total est d'environ 4 Mo par seconde, mais les producteurs reçoivent des erreurs ProvisionedThroughputExceededException, et les métriques montrent du trafic sur seulement trois partitions. Les événements d'un même appareil doivent rester dans l'ordre.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Reshard the stream from 10 to 20 shards, and keep the event type as the partition key.", fr: "Repartitionner le flux de 10 à 20 partitions, et conserver le type d'événement comme clé de partition." } }
    - { id: b, text: { en: "Use the device ID as the partition key so that records spread across the hash key ranges of all shards.", fr: "Utiliser l'ID de l'appareil comme clé de partition afin que les enregistrements se répartissent sur les plages de clés de hachage de toutes les partitions." } }
    - { id: c, text: { en: "Use a random value for each record as the partition key so that every shard receives the same share.", fr: "Utiliser une valeur aléatoire pour chaque enregistrement comme clé de partition afin que chaque partition reçoive la même part." } }
    - { id: d, text: { en: "Register the consumers with enhanced fan-out so that each consumer gets its own read throughput.", fr: "Inscrire les consommateurs avec la diffusion améliorée (enhanced fan-out) afin que chaque consommateur dispose de son propre débit de lecture." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Kinesis maps each partition key through an MD5 hash to a shard, and each shard accepts up to 1 MB or 1,000 records per second for writes. Three key values can reach at most three shards, which throttles them. The device ID has high cardinality, so the load spreads over all shards, and records with the same key stay ordered in one shard."
    fr: "Kinesis associe chaque clé de partition à une partition au moyen d'un hachage MD5, et chaque partition accepte en écriture jusqu'à 1 Mo ou 1 000 enregistrements par seconde. Trois valeurs de clé atteignent au plus trois partitions, qui sont alors limitées. L'ID de l'appareil a une forte cardinalité : la charge se répartit sur toutes les partitions, et les enregistrements de même clé restent ordonnés dans une partition."
  options:
    a:
      en: "With only three key values, the extra shards receive no data and the three hot shards stay throttled."
      fr: "Avec seulement trois valeurs de clé, les partitions supplémentaires ne reçoivent aucune donnée et les trois partitions chargées restent limitées."
    c:
      en: "Random keys spread the load, but events of one device land on different shards and lose their order."
      fr: "Des clés aléatoires répartissent la charge, mais les événements d'un appareil arrivent sur des partitions différentes et perdent leur ordre."
    d:
      en: "Enhanced fan-out improves read throughput for consumers; the errors come from the write limit of the hot shards."
      fr: "La diffusion améliorée augmente le débit de lecture des consommateurs ; les erreurs viennent de la limite d'écriture des partitions chargées."
references:
  - title: Amazon Kinesis Data Streams terminology and concepts
    url: https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html
