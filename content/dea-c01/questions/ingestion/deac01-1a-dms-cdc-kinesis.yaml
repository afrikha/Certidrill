id: deac01-1a-dms-cdc-kinesis
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs its order database on Oracle in its data center, connected to AWS through AWS Direct Connect. Several analytics teams need every committed insert, update and delete within seconds, as a stream that each team can read independently. The order application must not be changed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute sa base de données de commandes sur Oracle dans son centre de données, relié à AWS par AWS Direct Connect. Plusieurs équipes d'analyse ont besoin de chaque insertion, mise à jour et suppression validée en quelques secondes, sous la forme d'un flux que chaque équipe peut lire indépendamment. L'application de commandes ne doit pas être modifiée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run a nightly AWS DMS full-load task that writes the order tables to Amazon S3 for the teams to read.", fr: "Exécuter chaque nuit une tâche AWS DMS de chargement complet qui écrit les tables de commandes dans Amazon S3 pour que les équipes les lisent." } }
    - { id: b, text: { en: "Create an Amazon AppFlow flow that uses the Oracle database as its source and Amazon S3 as its destination.", fr: "Créer un flux Amazon AppFlow qui utilise la base de données Oracle comme source et Amazon S3 comme destination." } }
    - { id: c, text: { en: "Run an AWS Glue job every hour that reads the tables over JDBC with job bookmarks and writes the new rows to Amazon S3.", fr: "Exécuter toutes les heures une tâche AWS Glue qui lit les tables via JDBC avec des signets de tâche et écrit les nouvelles lignes dans Amazon S3." } }
    - { id: d, text: { en: "Run an AWS DMS task with change data capture that uses an Amazon Kinesis data stream as its target endpoint.", fr: "Exécuter une tâche AWS DMS avec capture des données modifiées qui utilise un flux de données Amazon Kinesis comme point de terminaison cible." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS DMS reads committed changes from the source database logs without application changes and can publish them as JSON records to a Kinesis data stream. Each analytics team can then consume the stream independently, within seconds of each change."
    fr: "AWS DMS lit les modifications validées dans les journaux de la base source sans modifier l'application et peut les publier sous forme d'enregistrements JSON dans un flux de données Kinesis. Chaque équipe d'analyse peut ensuite consommer le flux indépendamment, quelques secondes après chaque modification."
  options:
    a:
      en: "A nightly full load delivers a snapshot once a day, not each change within seconds."
      fr: "Un chargement complet nocturne fournit un instantané une fois par jour, pas chaque modification en quelques secondes."
    b:
      en: "Amazon AppFlow connects to SaaS applications, not to an on-premises Oracle database."
      fr: "Amazon AppFlow se connecte à des applications SaaS, pas à une base de données Oracle sur site."
    c:
      en: "An hourly job misses the seconds latency, and bookmarks pick up new rows but not updates and deletes."
      fr: "Une tâche horaire ne respecte pas la latence de quelques secondes, et les signets détectent les nouvelles lignes mais pas les mises à jour ni les suppressions."
references:
  - title: Using Amazon Kinesis Data Streams as a target for AWS Database Migration Service - AWS Database Migration Service
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.Kinesis.html
