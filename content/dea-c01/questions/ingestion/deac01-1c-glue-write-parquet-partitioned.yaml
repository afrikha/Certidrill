id: deac01-1c-glue-write-parquet-partitioned
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue job converts daily CSV sales extracts and ends with the following write call:

    ```python
    glueContext.write_dynamic_frame.from_options(
        frame=sales,
        connection_type="s3",
        connection_options={"path": "s3://example-curated/sales/"},
        format="csv",
    )
    ```

    Amazon Athena users need the output as Apache Parquet files in Hive-style folders by `sale_date` so that their queries read only the dates they filter on.

    Which change to the write call will meet these requirements?
  fr: |
    Une tâche AWS Glue convertit des extractions quotidiennes de ventes au format CSV et se termine par l'appel d'écriture suivant :

    ```python
    glueContext.write_dynamic_frame.from_options(
        frame=sales,
        connection_type="s3",
        connection_options={"path": "s3://example-curated/sales/"},
        format="csv",
    )
    ```

    Les utilisateurs d'Amazon Athena ont besoin de la sortie sous forme de fichiers Apache Parquet dans des dossiers de style Hive par `sale_date`, afin que leurs requêtes ne lisent que les dates sur lesquelles elles filtrent.

    Quelle modification de l'appel d'écriture répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set `format=\"parquet\"` and add `\"partitionKeys\": [\"sale_date\"]` to `format_options`.", fr: "Définir `format=\"parquet\"` et ajouter `\"partitionKeys\": [\"sale_date\"]` dans `format_options`." } }
    - { id: b, text: { en: "Keep `format=\"csv\"` and add `\"partitionKeys\": [\"sale_date\"]` to `connection_options`.", fr: "Conserver `format=\"csv\"` et ajouter `\"partitionKeys\": [\"sale_date\"]` dans `connection_options`." } }
    - { id: c, text: { en: "Set `format=\"parquet\"` and add `transformation_ctx=\"sale_date\"` to the call.", fr: "Définir `format=\"parquet\"` et ajouter `transformation_ctx=\"sale_date\"` à l'appel." } }
    - { id: d, text: { en: "Set `format=\"parquet\"` and add `\"partitionKeys\": [\"sale_date\"]` to `connection_options`.", fr: "Définir `format=\"parquet\"` et ajouter `\"partitionKeys\": [\"sale_date\"]` dans `connection_options`." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The format parameter selects the output format, and Parquet output is Snappy-compressed by default. A DynamicFrame is written without partitions unless connection_options contains partitionKeys, which creates one Hive-style folder per sale_date value that Athena can prune."
    fr: "Le paramètre format choisit le format de sortie, et la sortie Parquet est compressée en Snappy par défaut. Un DynamicFrame est écrit sans partitions sauf si connection_options contient partitionKeys, qui crée un dossier de style Hive par valeur de sale_date qu'Athena peut élaguer."
  options:
    a:
      en: "format_options controls how the files are written (compression, block size); partitionKeys belongs in connection_options."
      fr: "format_options contrôle la manière d'écrire les fichiers (compression, taille de bloc) ; partitionKeys se place dans connection_options."
    b:
      en: "This partitions the output, but the files stay in CSV instead of Parquet."
      fr: "Cela partitionne la sortie, mais les fichiers restent au format CSV au lieu de Parquet."
    c:
      en: "transformation_ctx identifies the job bookmark state of the call; it does not partition the output."
      fr: "transformation_ctx identifie l'état du signet de tâche de l'appel ; il ne partitionne pas la sortie."
references:
  - title: Managing partitions for ETL output in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-partitions.html
  - title: Using the Parquet format in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-format-parquet-home.html
