id: deac01-1b-redshift-iam-jdbc
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Analysts at a financial company connect a SQL client to an Amazon Redshift provisioned cluster through the Amazon Redshift JDBC driver. Today they share database user names and passwords. The security team requires that no database passwords are stored or shared, and that analysts sign in with their corporate identities, which are federated to IAM roles through a SAML 2.0 identity provider. The analysts must keep using the same SQL client.

    Which solution will meet these requirements?
  fr: |
    Les analystes d'une entreprise financière connectent un client SQL à un cluster provisionné Amazon Redshift par le pilote JDBC Amazon Redshift. Aujourd'hui, ils partagent des noms d'utilisateur et des mots de passe de base de données. L'équipe de sécurité exige qu'aucun mot de passe de base de données ne soit stocké ni partagé, et que les analystes se connectent avec leurs identités d'entreprise, fédérées vers des rôles IAM par un fournisseur d'identité SAML 2.0. Les analystes doivent continuer à utiliser le même client SQL.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the shared passwords in AWS Secrets Manager with automatic rotation and give the analysts read access to the secret.", fr: "Stocker les mots de passe partagés dans AWS Secrets Manager avec rotation automatique et donner aux analystes un accès en lecture au secret." }
    - id: b
      text: { en: "Have the analysts run their queries through the Amazon Redshift Data API from the AWS CLI instead of the SQL client.", fr: "Faire exécuter par les analystes leurs requêtes avec l'API Amazon Redshift Data depuis l'AWS CLI au lieu du client SQL." }
    - id: c
      text: { en: "Configure the JDBC driver to use IAM authentication through the identity provider, so that it gets temporary database credentials.", fr: "Configurer le pilote JDBC pour utiliser l'authentification IAM par le fournisseur d'identité, afin qu'il obtienne des informations d'identification temporaires." }
    - id: d
      text: { en: "Attach an IAM policy with an aws:SourceIp condition for the corporate network range to the IAM role of the cluster.", fr: "Attacher au rôle IAM du cluster une politique IAM avec une condition aws:SourceIp pour la plage du réseau d'entreprise." }
answer: { optionId: c }
explanation:
  correct:
    en: "With IAM authentication, users sign in with credentials generated from their IAM permissions, so no database user names and passwords need to be maintained. A SAML 2.0 identity provider grants access to an IAM role, and the Redshift JDBC or ODBC driver calls GetClusterCredentials to get temporary database credentials for the session."
    fr: "Avec l'authentification IAM, les utilisateurs se connectent avec des informations d'identification générées à partir de leurs autorisations IAM : aucun nom d'utilisateur ni mot de passe de base de données n'est à maintenir. Un fournisseur d'identité SAML 2.0 donne accès à un rôle IAM, et le pilote JDBC ou ODBC Redshift appelle GetClusterCredentials pour obtenir des informations d'identification de base de données temporaires pour la session."
  options:
    a:
      en: "Rotated passwords are still database passwords that are stored and shared among analysts."
      fr: "Des mots de passe renouvelés restent des mots de passe de base de données stockés et partagés entre analystes."
    b:
      en: "The Data API avoids passwords but replaces the SQL client, which breaks the requirement to keep the same client."
      fr: "L'API Data évite les mots de passe mais remplace le client SQL, ce qui enfreint l'exigence de conserver le même client."
    d:
      en: "An IP condition on the cluster's role does not authenticate the analysts and does not replace the shared database passwords."
      fr: "Une condition d'IP sur le rôle du cluster n'authentifie pas les analystes et ne remplace pas les mots de passe de base de données partagés."
references:
  - title: Using IAM authentication to generate database user credentials
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/generating-user-credentials.html
