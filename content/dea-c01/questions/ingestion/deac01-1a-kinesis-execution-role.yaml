id: deac01-1a-kinesis-execution-role
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer creates an event source mapping so that an AWS Lambda function processes records from an Amazon Kinesis data stream in the same account. The creation fails because the function's execution role cannot read the stream. The data engineer wants to grant only the permissions that the mapping needs by using an AWS managed policy.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur données crée un mappage de source d'événement afin qu'une fonction AWS Lambda traite les enregistrements d'un flux de données Amazon Kinesis du même compte. La création échoue, car le rôle d'exécution de la fonction ne peut pas lire le flux. L'ingénieur données veut n'accorder que les autorisations dont le mappage a besoin à l'aide d'une politique gérée par AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach the AWSLambdaBasicExecutionRole managed policy to the execution role.", fr: "Attacher la politique gérée AWSLambdaBasicExecutionRole au rôle d'exécution." } }
    - { id: b, text: { en: "Attach the AWSLambdaKinesisExecutionRole managed policy to the execution role.", fr: "Attacher la politique gérée AWSLambdaKinesisExecutionRole au rôle d'exécution." } }
    - { id: c, text: { en: "Add a resource-based policy to the function that allows `kinesis.amazonaws.com` to invoke it.", fr: "Ajouter à la fonction une politique basée sur les ressources qui autorise `kinesis.amazonaws.com` à l'appeler." } }
    - { id: d, text: { en: "Attach the AmazonKinesisFullAccess managed policy to the execution role.", fr: "Attacher la politique gérée AmazonKinesisFullAccess au rôle d'exécution." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Lambda reads the stream on behalf of the function by using the execution role, which needs actions such as kinesis:GetRecords, kinesis:GetShardIterator, kinesis:DescribeStream and kinesis:ListShards. The AWSLambdaKinesisExecutionRole managed policy contains these permissions."
    fr: "Lambda lit le flux pour le compte de la fonction à l'aide du rôle d'exécution, qui a besoin d'actions telles que kinesis:GetRecords, kinesis:GetShardIterator, kinesis:DescribeStream et kinesis:ListShards. La politique gérée AWSLambdaKinesisExecutionRole contient ces autorisations."
  options:
    a:
      en: "This policy allows writing logs to CloudWatch Logs only; it grants no Kinesis read permissions."
      fr: "Cette politique n'autorise que l'écriture de journaux dans CloudWatch Logs ; elle n'accorde aucune autorisation de lecture Kinesis."
    c:
      en: "Kinesis does not invoke the function; Lambda polls the stream with the execution role, so a resource-based policy on the function does not help."
      fr: "Kinesis n'appelle pas la fonction ; Lambda interroge le flux avec le rôle d'exécution : une politique basée sur les ressources sur la fonction n'aide pas."
    d:
      en: "Full access includes write and administration actions that the mapping does not need, which is not least privilege."
      fr: "L'accès complet inclut des actions d'écriture et d'administration dont le mappage n'a pas besoin, ce qui ne respecte pas le moindre privilège."
references:
  - title: Process Amazon Kinesis Data Streams records with Lambda - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-create.html
