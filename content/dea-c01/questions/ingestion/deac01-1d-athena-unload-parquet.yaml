id: deac01-1d-athena-unload-parquet
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A pricing team runs a daily Amazon Athena query and must deliver its results to a downstream application as Parquet files in an empty Amazon S3 prefix. The team does not want to create or maintain a table in the AWS Glue Data Catalog for this output.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Une équipe tarification exécute chaque jour une requête Amazon Athena et doit livrer ses résultats à une application en aval sous forme de fichiers Parquet dans un préfixe Amazon S3 vide. L'équipe ne veut ni créer ni maintenir de table dans l'AWS Glue Data Catalog pour cette sortie.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Run a CREATE TABLE AS SELECT (CTAS) query with format = 'PARQUET' and an external_location in the prefix.", fr: "Exécuter une requête CREATE TABLE AS SELECT (CTAS) avec format = 'PARQUET' et un external_location dans le préfixe." } }
    - { id: b, text: { en: "Keep the CSV query results that Athena writes and convert them to Parquet with a Lambda function triggered by S3.", fr: "Conserver les résultats CSV qu'Athena écrit et les convertir en Parquet avec une fonction Lambda déclenchée par S3." } }
    - { id: c, text: { en: "Wrap the query in an UNLOAD statement that writes to the prefix WITH (format = 'PARQUET').", fr: "Encapsuler la requête dans une instruction UNLOAD qui écrit dans le préfixe WITH (format = 'PARQUET')." } }
    - { id: d, text: { en: "Run an INSERT INTO query that writes the results into a Parquet table defined on the prefix.", fr: "Exécuter une requête INSERT INTO qui écrit les résultats dans une table Parquet définie sur le préfixe." } }
answer: { optionId: c }
explanation:
  correct:
    en: "UNLOAD writes the results of a SELECT query to Amazon S3 in Parquet, ORC, Avro, JSON, or text format and creates no table. The destination must be empty, which the scenario provides."
    fr: "UNLOAD écrit les résultats d'une requête SELECT dans Amazon S3 au format Parquet, ORC, Avro, JSON ou texte, sans créer de table. La destination doit être vide, ce que prévoit le scénario."
  options:
    a: { en: "CTAS also writes Parquet, but it creates a table in the Data Catalog, which the team wants to avoid.", fr: "CTAS écrit aussi du Parquet, mais crée une table dans le Data Catalog, ce que l'équipe veut éviter." }
    b: { en: "A conversion function is custom code to write and run, while UNLOAD produces Parquet directly.", fr: "Une fonction de conversion est du code personnalisé à écrire et à exécuter, alors qu'UNLOAD produit directement du Parquet." }
    d: { en: "INSERT INTO requires an existing table defined in the Data Catalog.", fr: "INSERT INTO exige une table existante définie dans le Data Catalog." }
references:
  - title: UNLOAD
    url: https://docs.aws.amazon.com/athena/latest/ug/unload.html
