id: deac01-1e-sam-deploy-local-paths
objective: "1.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer deploys an AWS SAM template with the aws cloudformation deploy command. The AWS Lambda functions in the template use `CodeUri: src/` and the state machine uses `DefinitionUri: statemachine/etl.asl.json`. The deployment fails because the local paths cannot be resolved. The function code and the definition must stay as local files in the Git repository.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur de données déploie un modèle AWS SAM avec la commande aws cloudformation deploy. Les fonctions AWS Lambda du modèle utilisent `CodeUri: src/` et la machine d'état utilise `DefinitionUri: statemachine/etl.asl.json`. Le déploiement échoue car les chemins locaux ne peuvent pas être résolus. Le code des fonctions et la définition doivent rester des fichiers locaux dans le dépôt Git.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Remove the Transform declaration from the template, and deploy it again with aws cloudformation deploy.", fr: "Supprimer la déclaration Transform du modèle, et le déployer à nouveau avec aws cloudformation deploy." } }
    - { id: b, text: { en: "Run sam build and then sam deploy, which uploads the local artifacts to Amazon S3 and deploys the stack through a change set.", fr: "Exécuter sam build puis sam deploy, qui charge les artefacts locaux dans Amazon S3 et déploie la pile au moyen d'un jeu de modifications." } }
    - { id: c, text: { en: "Run sam validate on the template, and then run aws cloudformation deploy again.", fr: "Exécuter sam validate sur le modèle, puis exécuter de nouveau aws cloudformation deploy." } }
    - { id: d, text: { en: "Run sam local invoke for each function, and then run aws cloudformation deploy again.", fr: "Exécuter sam local invoke pour chaque fonction, puis exécuter de nouveau aws cloudformation deploy." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A local DefinitionUri path works only when the template goes through sam deploy or sam package. sam build prepares the artifacts in .aws-sam, and sam deploy zips and uploads them to S3, updates CodeUri in the deployed template, and deploys the stack with a CloudFormation change set."
    fr: "Un chemin local dans DefinitionUri ne fonctionne que si le modèle passe par sam deploy ou sam package. sam build prépare les artefacts dans .aws-sam, puis sam deploy les compresse et les charge dans S3, met à jour CodeUri dans le modèle déployé et déploie la pile avec un jeu de modifications CloudFormation."
  options:
    a:
      en: "Without the transform, the AWS::Serverless resources are no longer valid, and the local paths are still not uploaded."
      fr: "Sans la transformation, les ressources AWS::Serverless ne sont plus valides, et les chemins locaux ne sont toujours pas chargés."
    c:
      en: "sam validate only checks the template; it does not upload the local files."
      fr: "sam validate vérifie seulement le modèle ; il ne charge pas les fichiers locaux."
    d:
      en: "sam local invoke tests functions locally and uploads nothing."
      fr: "sam local invoke teste les fonctions en local et ne charge rien."
references:
  - title: Introduction to deploying with AWS SAM
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-deploy.html
  - title: AWS::Serverless::StateMachine
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-statemachine.html
