id: deac01-1c-semi-structured-catalog
objective: "1.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketplace stores its product catalog as JSON documents. Each product category has different attributes, and new attributes are added every week without a schema migration. The catalog service reads and updates one product at a time by product ID and needs single-digit millisecond latency as traffic grows.

    Which data store will meet these requirements?
  fr: |
    Une place de marché stocke son catalogue de produits sous forme de documents JSON. Chaque catégorie de produits possède des attributs différents, et de nouveaux attributs sont ajoutés chaque semaine sans migration de schéma. Le service de catalogue lit et met à jour un produit à la fois à partir de son ID et a besoin d'une latence de l'ordre de la milliseconde à mesure que le trafic augmente.

    Quel magasin de données répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An Amazon RDS for MySQL table with one column for each possible attribute", fr: "Une table Amazon RDS for MySQL avec une colonne pour chaque attribut possible" } }
    - { id: b, text: { en: "An Amazon DynamoDB table with the product ID as the partition key", fr: "Une table Amazon DynamoDB avec l'ID produit comme clé de partition" } }
    - { id: c, text: { en: "An Amazon Redshift table that stores each document in a SUPER column", fr: "Une table Amazon Redshift qui stocke chaque document dans une colonne SUPER" } }
    - { id: d, text: { en: "JSON files in Amazon S3 that the service queries with Amazon Athena", fr: "Des fichiers JSON dans Amazon S3 que le service interroge avec Amazon Athena" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The catalog is semi-structured data with attributes that vary by item and an access pattern of single-item reads and writes by key. DynamoDB supports key-value and document data models, lets items in one table have different attributes, and delivers single-digit millisecond performance at any scale."
    fr: "Le catalogue est constitué de données semi-structurées dont les attributs varient d'un élément à l'autre, avec un modèle d'accès de lectures et d'écritures d'un seul élément par clé. DynamoDB prend en charge les modèles de données clé-valeur et document, permet aux éléments d'une même table d'avoir des attributs différents et offre des performances de l'ordre de la milliseconde à n'importe quelle échelle."
  options:
    a:
      en: "A fixed relational schema needs a migration each time a new attribute is added, which the requirements exclude."
      fr: "Un schéma relationnel fixe exige une migration à chaque ajout d'attribut, ce que les exigences excluent."
    c:
      en: "Redshift can store semi-structured data in SUPER columns, but a data warehouse is built for analytic queries, not for millisecond single-item reads and updates."
      fr: "Redshift peut stocker des données semi-structurées dans des colonnes SUPER, mais un entrepôt de données est conçu pour des requêtes analytiques, pas pour des lectures et mises à jour d'un seul élément en quelques millisecondes."
    d:
      en: "Athena queries run for seconds and S3 objects are not updated item by item, so this misses the latency and update requirements."
      fr: "Les requêtes Athena durent plusieurs secondes et les objets S3 ne se mettent pas à jour élément par élément : cette solution ne respecte pas les exigences de latence et de mise à jour."
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
