id: deac01-1e-lambda-efs-prereqs
objective: "1.4.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function that is not connected to a VPC must read and write files on an Amazon EFS file system. The file system has mount targets in two Availability Zones of a VPC. The execution role of the function already has the AmazonElasticFileSystemClientReadWriteAccess managed policy and the permissions that Lambda needs to connect to a VPC.

    Which combination of steps will meet these requirements? (Choose three.)
  fr: |
    Une fonction AWS Lambda qui n'est pas connectée à un VPC doit lire et écrire des fichiers sur un système de fichiers Amazon EFS. Le système de fichiers a des cibles de montage dans deux zones de disponibilité d'un VPC. Le rôle d'exécution de la fonction possède déjà la politique gérée AmazonElasticFileSystemClientReadWriteAccess et les autorisations dont Lambda a besoin pour se connecter à un VPC.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Configure the function with a local mount path of /tmp/shared.", fr: "Configurer la fonction avec le chemin de montage local /tmp/shared." } }
    - { id: b, text: { en: "Connect the function to subnets of the VPC in the Availability Zones that contain the mount targets.", fr: "Connecter la fonction à des sous-réseaux du VPC dans les zones de disponibilité qui contiennent les cibles de montage." } }
    - { id: c, text: { en: "Allow NFS traffic on TCP port 2049 between the security group of the function and the security group of the mount targets.", fr: "Autoriser le trafic NFS sur le port TCP 2049 entre le groupe de sécurité de la fonction et celui des cibles de montage." } }
    - { id: d, text: { en: "Create a gateway VPC endpoint for Amazon EFS, and add it to the route tables of the function's subnets.", fr: "Créer un point de terminaison de VPC de passerelle pour Amazon EFS, et l'ajouter aux tables de routage des sous-réseaux de la fonction." } }
    - { id: e, text: { en: "Add a Lambda layer that contains an NFS client to the function.", fr: "Ajouter à la fonction une couche Lambda qui contient un client NFS." } }
    - { id: f, text: { en: "Create an EFS access point, and add it to the function with a local mount path that starts with /mnt/.", fr: "Créer un point d'accès EFS, et l'ajouter à la fonction avec un chemin de montage local qui commence par /mnt/." } }
answer: { optionIds: [ b, c, f ] }
explanation:
  correct:
    en: "Lambda reaches EFS over the VPC network, so the function must connect to subnets that can route NFS traffic to a mount target in each of its Availability Zones, and the security groups must allow port 2049. The function connects through an EFS access point, mounted on a local path that must start with /mnt/."
    fr: "Lambda accède à EFS par le réseau du VPC : la fonction doit donc être connectée à des sous-réseaux qui peuvent acheminer le trafic NFS vers une cible de montage dans chacune de ses zones de disponibilité, et les groupes de sécurité doivent autoriser le port 2049. La fonction se connecte par un point d'accès EFS, monté sur un chemin local qui doit commencer par /mnt/."
  options:
    a:
      en: "The local mount path must start with /mnt/; /tmp is the ephemeral storage of the function."
      fr: "Le chemin de montage local doit commencer par /mnt/ ; /tmp est le stockage éphémère de la fonction."
    d:
      en: "Gateway endpoints exist only for Amazon S3 and DynamoDB; the function reaches the mount targets directly inside the VPC."
      fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et DynamoDB ; la fonction atteint directement les cibles de montage dans le VPC."
    e:
      en: "Lambda mounts the file system itself; the function code needs no NFS client."
      fr: "Lambda monte lui-même le système de fichiers ; le code de la fonction n'a besoin d'aucun client NFS."
references:
  - title: Configuring Amazon EFS file system access
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-filesystem-efs.html
