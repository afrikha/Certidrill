id: deac01-1c-kb-sync-pipeline
objective: "1.2.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A software company runs a support assistant on an Amazon Bedrock knowledge base whose data source is an Amazon S3 prefix of product manuals. A nightly AWS Glue job produces new and revised manuals and a list of withdrawn manuals. After each night, revised manuals must replace their old versions in the assistant's answers, and withdrawn manuals must stop appearing. The company wants the LEAST processing for each refresh.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un éditeur de logiciels exécute un assistant de support sur une base de connaissances Amazon Bedrock dont la source de données est un préfixe Amazon S3 de manuels de produits. Une tâche AWS Glue nocturne produit des manuels nouveaux et révisés ainsi qu'une liste de manuels retirés. Après chaque nuit, les manuels révisés doivent remplacer leurs anciennes versions dans les réponses de l'assistant, et les manuels retirés ne doivent plus apparaître. L'entreprise veut le MOINS de traitement possible à chaque actualisation.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Have the Glue job overwrite revised manuals at their existing S3 keys and delete the withdrawn manuals from the prefix.", fr: "Faire écraser par la tâche Glue les manuels révisés à leurs clés S3 existantes et supprimer les manuels retirés du préfixe." } }
    - { id: b, text: { en: "Delete and re-create the knowledge base every night so that all manuals are embedded again.", fr: "Supprimer et recréer la base de connaissances chaque nuit afin que tous les manuels soient de nouveau vectorisés." } }
    - { id: c, text: { en: "Call StartIngestionJob for the data source after the Glue job finishes.", fr: "Appeler StartIngestionJob pour la source de données une fois la tâche Glue terminée." } }
    - { id: d, text: { en: "Run an AWS Glue crawler on the prefix so that the knowledge base detects the changes.", fr: "Exécuter un robot d'analyse AWS Glue sur le préfixe pour que la base de connaissances détecte les modifications." } }
    - { id: e, text: { en: "Fine-tune the foundation model of the assistant on the revised manuals every night.", fr: "Affiner chaque nuit le modèle de fondation de l'assistant sur les manuels révisés." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A knowledge base re-indexes its data source only when the data source is synced with StartIngestionJob. The sync is incremental: added and modified documents are re-parsed, re-chunked and re-embedded, unchanged ones are skipped, and documents deleted from the source are removed from the vector store, so the S3 prefix must reflect the revisions and withdrawals."
    fr: "Une base de connaissances ne réindexe sa source de données que lorsque celle-ci est synchronisée avec StartIngestionJob. La synchronisation est incrémentielle : les documents ajoutés et modifiés sont de nouveau analysés, découpés et vectorisés, les documents inchangés sont ignorés, et les documents supprimés de la source sont retirés du magasin de vecteurs : le préfixe S3 doit donc refléter les révisions et les retraits."
  options:
    b:
      en: "Re-creating the knowledge base embeds every manual again, which is far more processing than an incremental sync."
      fr: "Recréer la base de connaissances vectorise de nouveau tous les manuels, ce qui représente bien plus de traitement qu'une synchronisation incrémentielle."
    d:
      en: "A crawler updates the AWS Glue Data Catalog; it does not sync a knowledge base."
      fr: "Un robot d'analyse met à jour le catalogue de données AWS Glue ; il ne synchronise pas une base de connaissances."
    e:
      en: "Fine-tuning is costly, does not remove withdrawn content, and is not how a knowledge base is refreshed."
      fr: "L'affinage est coûteux, ne retire pas le contenu retiré et n'est pas la manière d'actualiser une base de connaissances."
references:
  - title: Sync your data with your Amazon Bedrock knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-data-source-sync-ingest.html
