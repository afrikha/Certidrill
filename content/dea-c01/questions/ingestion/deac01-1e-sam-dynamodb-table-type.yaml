id: deac01-1e-sam-dynamodb-table-type
objective: "1.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany defines a serverless ingestion pipeline in an AWS SAM template. An AWS Lambda function writes sensor readings to an Amazon DynamoDB table. Queries must return the readings of one sensor for a time range, so the table needs sensor_id as the partition key and reading_time as the sort key. A second Lambda function must process every change to the table through DynamoDB Streams.

    Which table definition should the team add to the template?
  fr: |
    AnyCompany définit un pipeline d'ingestion sans serveur dans un modèle AWS SAM. Une fonction AWS Lambda écrit des relevés de capteurs dans une table Amazon DynamoDB. Les requêtes doivent renvoyer les relevés d'un capteur sur une plage de temps : la table a donc besoin de sensor_id comme clé de partition et de reading_time comme clé de tri. Une seconde fonction Lambda doit traiter chaque modification de la table par DynamoDB Streams.

    Quelle définition de table l'équipe doit-elle ajouter au modèle ?
body:
  options:
    - { id: a, text: { en: "An AWS::Serverless::SimpleTable resource with PrimaryKey set to sensor_id and a StreamSpecification property.", fr: "Une ressource AWS::Serverless::SimpleTable avec PrimaryKey défini sur sensor_id et une propriété StreamSpecification." } }
    - { id: b, text: { en: "Two AWS::Serverless::SimpleTable resources, one keyed on sensor_id and one keyed on reading_time.", fr: "Deux ressources AWS::Serverless::SimpleTable, l'une avec la clé sensor_id et l'autre avec la clé reading_time." } }
    - { id: c, text: { en: "An AWS::DynamoDB::Table resource with sensor_id (HASH) and reading_time (RANGE) in KeySchema and a StreamSpecification property.", fr: "Une ressource AWS::DynamoDB::Table avec sensor_id (HASH) et reading_time (RANGE) dans KeySchema et une propriété StreamSpecification." } }
    - { id: d, text: { en: "An AWS::Serverless::SimpleTable resource keyed on a sensor_id#reading_time string, and a scheduled function that scans the table for changes.", fr: "Une ressource AWS::Serverless::SimpleTable avec une clé de chaîne sensor_id#reading_time, et une fonction planifiée qui analyse la table pour trouver les modifications." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS::Serverless::SimpleTable creates a table with a single-attribute primary key only and has no property for a sort key or a stream. A SAM template can contain any CloudFormation resource, so AWS::DynamoDB::Table defines the composite key and enables DynamoDB Streams for the second function."
    fr: "AWS::Serverless::SimpleTable crée uniquement une table avec une clé primaire à un seul attribut et n'a aucune propriété pour une clé de tri ou un flux. Un modèle SAM peut contenir n'importe quelle ressource CloudFormation : AWS::DynamoDB::Table définit donc la clé composite et active DynamoDB Streams pour la seconde fonction."
  options:
    a:
      en: "SimpleTable has no StreamSpecification property and cannot define the reading_time sort key."
      fr: "SimpleTable n'a pas de propriété StreamSpecification et ne peut pas définir la clé de tri reading_time."
    b:
      en: "Two single-key tables cannot answer a query on one sensor for a time range, and neither has a stream."
      fr: "Deux tables à clé unique ne permettent pas d'interroger un capteur sur une plage de temps, et aucune n'a de flux."
    d:
      en: "A concatenated partition key does not support range queries on time, and scanning the table is costly and misses the change-by-change processing that the stream provides."
      fr: "Une clé de partition concaténée ne permet pas les requêtes par plage de temps, et l'analyse complète de la table est coûteuse et ne remplace pas le traitement modification par modification du flux."
references:
  - title: AWS::Serverless::SimpleTable
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-simpletable.html
