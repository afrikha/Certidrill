id: deac01-1c-spectrum-join-s3
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An ecommerce company stores 5 years of clickstream data as Parquet files in Amazon S3. The data is cataloged in the AWS Glue Data Catalog. Every day, the company must join the clickstream data with a customers table in its Amazon Redshift provisioned cluster and write daily aggregates into a Redshift table. The raw clickstream data must not be loaded into Redshift managed storage, and the company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce électronique stocke 5 ans de données de parcours de navigation sous forme de fichiers Parquet dans Amazon S3. Les données sont cataloguées dans le catalogue de données AWS Glue. Chaque jour, l'entreprise doit joindre ces données à une table de clients de son cluster provisionné Amazon Redshift et écrire des agrégats quotidiens dans une table Redshift. Les données brutes de navigation ne doivent pas être chargées dans le stockage géré Redshift, et l'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "COPY the previous day's clickstream files into a staging table each day, then run the join with INSERT INTO ... SELECT.", fr: "Charger chaque jour les fichiers de navigation de la veille dans une table intermédiaire avec COPY, puis exécuter la jointure avec INSERT INTO ... SELECT." } }
    - { id: b, text: { en: "Create an AWS Glue job that reads the clickstream files and the customers table over JDBC, joins them, and writes the aggregates over JDBC.", fr: "Créer une tâche AWS Glue qui lit les fichiers de navigation et la table de clients via JDBC, les joint et écrit les agrégats via JDBC." } }
    - { id: c, text: { en: "UNLOAD the customers table to Amazon S3, join it with the clickstream data in Amazon Athena, and COPY the result into Redshift.", fr: "Exporter la table de clients vers Amazon S3 avec UNLOAD, la joindre aux données de navigation dans Amazon Athena, puis charger le résultat dans Redshift avec COPY." } }
    - { id: d, text: { en: "Create an external schema from the Data Catalog and run INSERT INTO ... SELECT that joins the external table with the customers table.", fr: "Créer un schéma externe à partir du catalogue de données et exécuter un INSERT INTO ... SELECT qui joint la table externe à la table de clients." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Redshift Spectrum queries data in Amazon S3 through external tables without loading it into Redshift tables. An external schema that points to the Data Catalog exposes the existing clickstream table, and one SQL statement can join it with the local customers table and insert the aggregates into a local table."
    fr: "Redshift Spectrum interroge les données d'Amazon S3 au moyen de tables externes sans les charger dans des tables Redshift. Un schéma externe qui pointe vers le catalogue de données expose la table de navigation existante, et une seule instruction SQL peut la joindre à la table locale de clients et insérer les agrégats dans une table locale."
  options:
    a:
      en: "COPY loads the raw clickstream data into Redshift managed storage, which the requirements forbid."
      fr: "COPY charge les données brutes de navigation dans le stockage géré Redshift, ce que les exigences interdisent."
    b:
      en: "This works, but it adds a Spark job and JDBC connections to build and maintain, which is more overhead than one SQL statement in Redshift."
      fr: "Cela fonctionne, mais ajoute une tâche Spark et des connexions JDBC à créer et à maintenir, soit plus de charge qu'une seule instruction SQL dans Redshift."
    c:
      en: "This copies the customers table out of Redshift and chains three services every day, which adds operational overhead."
      fr: "Cette solution copie la table de clients hors de Redshift et enchaîne trois services chaque jour, ce qui ajoute de la charge opérationnelle."
references:
  - title: Amazon Redshift Spectrum
    url: https://docs.aws.amazon.com/redshift/latest/dg/c-using-spectrum.html
