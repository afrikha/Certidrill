id: deac01-1a-dms-max-full-load-subtasks
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an AWS DMS full-load task that migrates 300 tables from a Microsoft SQL Server database to Amazon S3. The task settings are at their defaults. Monitoring shows that only 8 tables load at the same time, while the CPU and memory of the replication instance and the source database are mostly idle. The company wants the full load to finish sooner.

    Which change will meet this requirement?
  fr: |
    Une entreprise exécute une tâche AWS DMS de chargement complet qui migre 300 tables d'une base de données Microsoft SQL Server vers Amazon S3. Les paramètres de la tâche sont à leurs valeurs par défaut. La surveillance montre que seules 8 tables se chargent en même temps, alors que le processeur et la mémoire de l'instance de réplication et de la base source sont en grande partie inactifs. L'entreprise veut que le chargement complet se termine plus tôt.

    Quelle modification répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Increase the CommitRate full-load setting from 10,000 to 50,000 records.", fr: "Porter le paramètre de chargement complet CommitRate de 10 000 à 50 000 enregistrements." } }
    - { id: b, text: { en: "Change the replication instance to a Multi-AZ deployment.", fr: "Passer l'instance de réplication à un déploiement Multi-AZ." } }
    - { id: c, text: { en: "Increase the MaxFullLoadSubTasks full-load setting from 8 to a higher value, such as 24.", fr: "Porter le paramètre de chargement complet MaxFullLoadSubTasks de 8 à une valeur plus élevée, par exemple 24." } }
    - { id: d, text: { en: "Set the TargetTablePrepMode full-load setting to DROP_AND_CREATE.", fr: "Définir le paramètre de chargement complet TargetTablePrepMode à DROP_AND_CREATE." } }
answer: { optionId: c }
explanation:
  correct:
    en: "MaxFullLoadSubTasks is the maximum number of tables or table segments that a full load processes in parallel; it defaults to 8 and can be raised to 49. With idle resources on both sides, loading more tables at a time shortens the full load."
    fr: "MaxFullLoadSubTasks est le nombre maximal de tables ou de segments de table qu'un chargement complet traite en parallèle ; sa valeur par défaut est 8 et elle peut être portée à 49. Avec des ressources inactives des deux côtés, charger davantage de tables à la fois raccourcit le chargement complet."
  options:
    a:
      en: "CommitRate sets how many records are transferred together in one batch; it does not change how many tables load in parallel."
      fr: "CommitRate définit le nombre d'enregistrements transférés ensemble dans un lot ; il ne change pas le nombre de tables chargées en parallèle."
    b:
      en: "Multi-AZ adds a standby replication instance for availability, not more parallel loading."
      fr: "Multi-AZ ajoute une instance de réplication de secours pour la disponibilité, pas davantage de chargement parallèle."
    d:
      en: "TargetTablePrepMode controls how target tables are prepared at startup; it does not speed up the load."
      fr: "TargetTablePrepMode contrôle la préparation des tables cibles au démarrage ; il n'accélère pas le chargement."
references:
  - title: Full-load task settings - AWS Database Migration Service
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.CustomizingTasks.TaskSettings.FullLoad.html
