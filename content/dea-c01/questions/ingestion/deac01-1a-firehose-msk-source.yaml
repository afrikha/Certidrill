id: deac01-1a-firehose-msk-source
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company publishes clickstream events to a topic in an Amazon MSK provisioned cluster. The company must archive the raw events in an Amazon S3 bucket. The team does not want to write consumer code, install connector plugins or manage consumer capacity.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de médias publie des événements de parcours de navigation (clickstream) dans une rubrique d'un cluster provisionné Amazon MSK. L'entreprise doit archiver les événements bruts dans un compartiment Amazon S3. L'équipe ne veut ni écrire de code consommateur, ni installer de plug-ins de connecteur, ni gérer la capacité des consommateurs.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Data Firehose stream with the MSK cluster and topic as its source and the S3 bucket as its destination.", fr: "Créer un flux Amazon Data Firehose avec le cluster MSK et la rubrique comme source et le compartiment S3 comme destination." } }
    - { id: b, text: { en: "Deploy an Amazon MSK Connect connector that uses an S3 sink connector plugin and size its workers for the topic throughput.", fr: "Déployer un connecteur Amazon MSK Connect qui utilise un plug-in de connecteur récepteur S3 et dimensionner ses workers selon le débit de la rubrique." } }
    - { id: c, text: { en: "Run a Kafka consumer application on Amazon EC2 instances in an Auto Scaling group that writes the events to the bucket.", fr: "Exécuter sur des instances Amazon EC2 d'un groupe Auto Scaling une application consommatrice Kafka qui écrit les événements dans le compartiment." } }
    - { id: d, text: { en: "Create an AWS Glue crawler that connects to the MSK cluster and writes the topic contents to the bucket every hour.", fr: "Créer un robot d'analyse AWS Glue qui se connecte au cluster MSK et écrit le contenu de la rubrique dans le compartiment toutes les heures." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Data Firehose can use an existing Amazon MSK cluster as its source and load the topic data into S3 buckets. Firehose is fully managed: there is no consumer code, plugin or capacity to manage."
    fr: "Amazon Data Firehose peut utiliser un cluster Amazon MSK existant comme source et charger les données de la rubrique dans des compartiments S3. Firehose est entièrement géré : il n'y a ni code consommateur, ni plug-in, ni capacité à gérer."
  options:
    b:
      en: "MSK Connect works, but the team must supply a connector plugin and choose the connector capacity, which the requirements exclude."
      fr: "MSK Connect fonctionne, mais l'équipe doit fournir un plug-in de connecteur et choisir la capacité du connecteur, ce que les exigences excluent."
    c:
      en: "This requires writing consumer code and operating EC2 capacity."
      fr: "Cette solution exige d'écrire du code consommateur et d'exploiter une capacité EC2."
    d:
      en: "A crawler infers schemas and writes metadata to the Data Catalog; it does not copy data from a Kafka topic to Amazon S3."
      fr: "Un robot d'analyse déduit des schémas et écrit des métadonnées dans le Data Catalog ; il ne copie pas les données d'une rubrique Kafka vers Amazon S3."
references:
  - title: Choose source and destination for your Firehose stream - Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/create-name.html
