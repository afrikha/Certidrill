id: deac01-1a-glue-conditional-trigger
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In an AWS Glue workflow, a crawler updates the Data Catalog tables of a dataset, and an ETL job then reads those tables. The ETL job must start as soon as the crawler run succeeds and must not start if the crawler fails. The company does not want to write custom code.

    Which solution will meet these requirements?
  fr: |
    Dans un flux de travail AWS Glue, un robot d'analyse met à jour les tables du Data Catalog d'un jeu de données, puis une tâche ETL lit ces tables. La tâche ETL doit démarrer dès que l'exécution du robot réussit et ne doit pas démarrer si le robot échoue. L'entreprise ne veut pas écrire de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Schedule the ETL job to start 30 minutes after the scheduled start time of the crawler.", fr: "Planifier le démarrage de la tâche ETL 30 minutes après l'heure de démarrage planifiée du robot d'analyse." } }
    - { id: b, text: { en: "Create an Amazon EventBridge rule that matches the Glue Crawler State Change event with the Succeeded state and targets the job.", fr: "Créer une règle Amazon EventBridge qui correspond à l'événement Glue Crawler State Change avec l'état Succeeded et cible la tâche." } }
    - { id: c, text: { en: "Create an AWS Lambda function that polls the crawler status every minute and starts the job when the crawler succeeds.", fr: "Créer une fonction AWS Lambda qui interroge l'état du robot d'analyse toutes les minutes et démarre la tâche lorsque le robot réussit." } }
    - { id: d, text: { en: "Add a conditional trigger to the workflow that watches the crawler for the SUCCEEDED state and starts the job.", fr: "Ajouter au flux de travail un déclencheur conditionnel qui surveille l'état SUCCEEDED du robot d'analyse et démarre la tâche." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A Glue conditional trigger fires when watched jobs or crawlers reach the states listed in its conditions, such as SUCCEEDED for a crawler. The job starts right after a successful crawl and never after a failed or cancelled one, with no code."
    fr: "Un déclencheur conditionnel Glue se déclenche lorsque les tâches ou robots surveillés atteignent les états indiqués dans ses conditions, par exemple SUCCEEDED pour un robot. La tâche démarre juste après une analyse réussie et jamais après une analyse en échec ou annulée, sans code."
  options:
    a:
      en: "A time offset does not check the crawler result, so the job would also start after a failed or still-running crawl."
      fr: "Un décalage horaire ne vérifie pas le résultat du robot : la tâche démarrerait aussi après une analyse en échec ou encore en cours."
    b:
      en: "A Glue job is not a supported target of EventBridge rules; only a Glue workflow is."
      fr: "Une tâche Glue n'est pas une cible prise en charge des règles EventBridge ; seul un flux de travail Glue l'est."
    c:
      en: "A polling function is custom code to write and maintain."
      fr: "Une fonction d'interrogation est du code personnalisé à écrire et à maintenir."
references:
  - title: AWS Glue triggers - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/about-triggers.html
