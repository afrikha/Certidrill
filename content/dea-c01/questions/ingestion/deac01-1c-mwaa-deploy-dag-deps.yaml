id: deac01-1c-mwaa-deploy-dag-deps
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer must add a new ETL DAG to an existing Amazon MWAA environment. The DAG imports a Python package from PyPI that is not installed in the environment. The S3 bucket of the environment has versioning enabled and public access blocked.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un ingénieur de données doit ajouter un nouveau DAG ETL à un environnement Amazon MWAA existant. Le DAG importe un package Python de PyPI qui n'est pas installé dans l'environnement. Le compartiment S3 de l'environnement a la gestion des versions activée et l'accès public bloqué.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Upload the DAG's Python file to the dags folder of the environment's S3 bucket.", fr: "Charger le fichier Python du DAG dans le dossier dags du compartiment S3 de l'environnement." } }
    - { id: b, text: { en: "Build a container image with the package, push it to Amazon ECR, and set it as the image of the environment.", fr: "Créer une image de conteneur avec le package, la transférer vers Amazon ECR et la définir comme image de l'environnement." } }
    - { id: c, text: { en: "Use AWS Systems Manager Run Command to run pip install on the scheduler and worker instances.", fr: "Utiliser AWS Systems Manager Run Command pour exécuter pip install sur les instances du planificateur et des workers." } }
    - { id: d, text: { en: "Add the package to requirements.txt, upload the file, and update the environment to use the new version of the file.", fr: "Ajouter le package à requirements.txt, charger le fichier, puis mettre à jour l'environnement pour qu'il utilise la nouvelle version du fichier." } }
    - { id: e, text: { en: "Package the DAG file inside plugins.zip and upload it to the bucket.", fr: "Empaqueter le fichier du DAG dans plugins.zip et le charger dans le compartiment." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Amazon MWAA syncs new and changed files from the dags folder of its S3 bucket to the scheduler and workers. Python dependencies are declared in requirements.txt in the same bucket; after a new version is uploaded, the environment is updated to that object version, and MWAA runs pip install on the scheduler and each worker."
    fr: "Amazon MWAA synchronise les fichiers nouveaux et modifiés du dossier dags de son compartiment S3 vers le planificateur et les workers. Les dépendances Python sont déclarées dans requirements.txt dans le même compartiment ; après le chargement d'une nouvelle version, l'environnement est mis à jour vers cette version d'objet, et MWAA exécute pip install sur le planificateur et sur chaque worker."
  options:
    b:
      en: "MWAA environments do not run a custom container image from Amazon ECR; dependencies are installed from requirements.txt."
      fr: "Les environnements MWAA n'exécutent pas d'image de conteneur personnalisée provenant d'Amazon ECR ; les dépendances s'installent à partir de requirements.txt."
    c:
      en: "The scheduler and workers are managed by MWAA and are not instances that you manage with Run Command."
      fr: "Le planificateur et les workers sont gérés par MWAA et ne sont pas des instances que l'on gère avec Run Command."
    e:
      en: "plugins.zip holds custom plugins such as operators; DAGs are read from the dags folder."
      fr: "plugins.zip contient des plug-ins personnalisés comme des opérateurs ; les DAG sont lus dans le dossier dags."
references:
  - title: Adding or updating DAGs
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/configuring-dag-folder.html
  - title: Installing Python dependencies
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/working-dags-dependencies.html
