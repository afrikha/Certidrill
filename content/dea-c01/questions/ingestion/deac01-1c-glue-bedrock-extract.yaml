id: deac01-1c-glue-bedrock-extract
objective: "1.2.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A furniture retailer imports product data from hundreds of suppliers. Each supplier writes a free-text description, and the company needs the color, material and dimensions of each product as separate columns. A nightly AWS Glue job already loads the descriptions. The company has no labeled examples and wants to avoid training a model.

    Which solution will meet these requirements?
  fr: |
    Un détaillant de meubles importe des données produit de centaines de fournisseurs. Chaque fournisseur rédige une description en texte libre, et l'entreprise a besoin de la couleur, du matériau et des dimensions de chaque produit dans des colonnes distinctes. Une tâche AWS Glue nocturne charge déjà les descriptions. L'entreprise ne dispose d'aucun exemple étiqueté et veut éviter d'entraîner un modèle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "From the Glue job, call a foundation model with the Amazon Bedrock Converse API and a prompt that returns the attributes as JSON.", fr: "Depuis la tâche Glue, appeler un modèle de fondation avec l'API Converse d'Amazon Bedrock et une invite qui renvoie les attributs au format JSON." } }
    - { id: b, text: { en: "Label sample descriptions, train a custom entity extraction model in Amazon SageMaker AI, and call its endpoint from the Glue job.", fr: "Étiqueter des exemples de descriptions, entraîner un modèle personnalisé d'extraction d'entités dans Amazon SageMaker AI et appeler son point de terminaison depuis la tâche Glue." } }
    - { id: c, text: { en: "Add regular expressions to the Glue job that extract the three attributes from fixed positions in each description.", fr: "Ajouter à la tâche Glue des expressions régulières qui extraient les trois attributs à des positions fixes de chaque description." } }
    - { id: d, text: { en: "Run an AWS Glue crawler on the description files so that it infers a separate column for each attribute.", fr: "Exécuter un robot d'analyse AWS Glue sur les fichiers de descriptions pour qu'il déduise une colonne distincte pour chaque attribut." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A foundation model can read free text written in many styles and return the requested attributes in a structured format, with instructions in the prompt and no training data. The Converse API on the bedrock-runtime endpoint gives one interface for the models that support messages and can be called from the Glue job with the AWS SDK."
    fr: "Un modèle de fondation peut lire du texte libre rédigé dans de nombreux styles et renvoyer les attributs demandés dans un format structuré, avec des instructions dans l'invite et sans données d'entraînement. L'API Converse du point de terminaison bedrock-runtime offre une interface unique pour les modèles qui prennent en charge les messages et peut être appelée depuis la tâche Glue avec le SDK AWS."
  options:
    b:
      en: "Training a custom model needs labeled examples, which the company does not have and wants to avoid."
      fr: "L'entraînement d'un modèle personnalisé exige des exemples étiquetés, dont l'entreprise ne dispose pas et qu'elle veut éviter."
    c:
      en: "Free-text descriptions from hundreds of suppliers have no fixed positions, so fixed patterns miss most attributes."
      fr: "Des descriptions en texte libre de centaines de fournisseurs n'ont pas de positions fixes : des motifs fixes manquent la plupart des attributs."
    d:
      en: "A crawler infers the schema of the files, so the description stays one text column."
      fr: "Un robot d'analyse déduit le schéma des fichiers : la description reste une seule colonne de texte."
references:
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
