id: deac01-1d-sfn-distributed-map-tolerance
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company receives a daily CSV file in Amazon S3 that contains 2 million product records. Each record must be sent to a Lambda function that calls a partner API, which fails for a small number of records every day. Today, one failed record makes the whole daily run fail. The company wants the run to succeed unless more than 1% of the records fail, and the results of all records to be written to Amazon S3 for review.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise reçoit chaque jour dans Amazon S3 un fichier CSV de 2 millions d'enregistrements de produits. Chaque enregistrement doit être envoyé à une fonction Lambda qui appelle l'API d'un partenaire, laquelle échoue chaque jour pour un petit nombre d'enregistrements. Aujourd'hui, un seul enregistrement en échec fait échouer toute l'exécution quotidienne. L'entreprise veut que l'exécution réussisse sauf si plus de 1 % des enregistrements échouent, et que les résultats de tous les enregistrements soient écrits dans Amazon S3 pour examen.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Use a Map state in Inline mode with MaxConcurrency set to 40 and a Catch on States.ALL inside the iteration.", fr: "Utiliser un état Map en mode Inline avec MaxConcurrency défini sur 40 et un Catch sur States.ALL dans l'itération." } }
    - { id: b, text: { en: "Use a Map state in Distributed mode that reads the CSV file with an ItemReader, sets ToleratedFailurePercentage to 1, and uses a ResultWriter to Amazon S3.", fr: "Utiliser un état Map en mode Distributed qui lit le fichier CSV avec un ItemReader, définit ToleratedFailurePercentage sur 1 et utilise un ResultWriter vers Amazon S3." } }
    - { id: c, text: { en: "Use a Map state in Distributed mode that reads the CSV file with an ItemReader, sets MaxConcurrency to 1000, and sets ToleratedFailureCount to 0.", fr: "Utiliser un état Map en mode Distributed qui lit le fichier CSV avec un ItemReader, définit MaxConcurrency sur 1000 et ToleratedFailureCount sur 0." } }
    - { id: d, text: { en: "Write a Lambda function that reads the CSV file, starts one Express workflow per record, and counts the failures in a DynamoDB table.", fr: "Écrire une fonction Lambda qui lit le fichier CSV, démarre un flux de travail Express par enregistrement et compte les échecs dans une table DynamoDB." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A Distributed Map reads large datasets such as a CSV file in S3 and runs each item as a child workflow execution. The Map Run fails only when the percentage of failed or timed-out items exceeds ToleratedFailurePercentage, and a ResultWriter exports the results of the child executions to S3, grouped by status."
    fr: "Un état Map en mode Distributed lit de grands jeux de données comme un fichier CSV dans S3 et exécute chaque élément comme une exécution de flux de travail enfant. Le Map Run échoue seulement lorsque le pourcentage d'éléments en échec ou expirés dépasse ToleratedFailurePercentage, et un ResultWriter exporte vers S3 les résultats des exécutions enfants, regroupés par statut."
  options:
    a: { en: "Inline mode is limited to 40 concurrent iterations and to the 25,000-event history of the parent execution, which 2 million items exceed.", fr: "Le mode Inline est limité à 40 itérations simultanées et à l'historique de 25 000 événements de l'exécution parente, que 2 millions d'éléments dépassent." }
    c: { en: "A tolerated failure count of 0 keeps the current behavior: the Map Run fails as soon as one item fails.", fr: "Un nombre d'échecs tolérés de 0 conserve le comportement actuel : le Map Run échoue dès qu'un élément échoue." }
    d: { en: "Custom code must handle reading, fan-out, failure counting, and result collection, which a Distributed Map provides natively.", fr: "Du code personnalisé doit gérer la lecture, la distribution, le comptage des échecs et la collecte des résultats, ce que fournit nativement un état Map en mode Distributed." }
references:
  - title: Using Map state in Distributed mode for large-scale parallel workloads in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-map-distributed.html
