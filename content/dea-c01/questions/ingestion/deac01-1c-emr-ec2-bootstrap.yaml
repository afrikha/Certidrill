id: deac01-1c-emr-ec2-bootstrap
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A genomics company runs Spark transformations that call a native library. The library must be installed with the operating system package manager on every node before the Spark applications start. Engineers also need SSH access to the nodes to inspect local files when a job fails. The company wants a managed big data service on AWS.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de génomique exécute des transformations Spark qui appellent une bibliothèque native. La bibliothèque doit être installée avec le gestionnaire de paquets du système d'exploitation sur chaque nœud avant le démarrage des applications Spark. Les ingénieurs ont aussi besoin d'un accès SSH aux nœuds pour examiner les fichiers locaux lorsqu'une tâche échoue. L'entreprise veut un service big data géré sur AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the transformations as AWS Glue Spark jobs and pass the library with the --additional-python-modules job parameter.", fr: "Exécuter les transformations comme tâches Spark AWS Glue et fournir la bibliothèque avec le paramètre de tâche --additional-python-modules." } }
    - { id: b, text: { en: "Run the transformations on an Amazon EMR Serverless application with the default release image.", fr: "Exécuter les transformations sur une application Amazon EMR Serverless avec l'image de version par défaut." } }
    - { id: c, text: { en: "Run the transformations on an Amazon EMR on EC2 cluster with a bootstrap action that installs the library.", fr: "Exécuter les transformations sur un cluster Amazon EMR on EC2 avec une action d'amorçage qui installe la bibliothèque." } }
    - { id: d, text: { en: "Run the transformations as SQL in Amazon Athena with a user-defined function that wraps the library.", fr: "Exécuter les transformations en SQL dans Amazon Athena avec une fonction définie par l'utilisateur qui encapsule la bibliothèque." } }
answer: { optionId: c }
explanation:
  correct:
    en: "EMR on EC2 clusters run on EC2 instances that you can reach over SSH. Bootstrap actions are scripts that run on every node, including nodes added later, before EMR installs the applications and before the nodes process data, so they can install OS packages."
    fr: "Les clusters EMR on EC2 s'exécutent sur des instances EC2 accessibles en SSH. Les actions d'amorçage sont des scripts qui s'exécutent sur chaque nœud, y compris les nœuds ajoutés ensuite, avant qu'EMR installe les applications et avant que les nœuds traitent des données : elles peuvent donc installer des paquets du système d'exploitation."
  options:
    a:
      en: "AWS Glue is serverless: it gives no SSH access to its workers and installs Python modules, not packages from the OS package manager."
      fr: "AWS Glue est sans serveur : il ne donne aucun accès SSH à ses workers et installe des modules Python, pas des paquets du gestionnaire de paquets du système d'exploitation."
    b:
      en: "EMR Serverless manages the workers for you and gives no SSH access to them, and the default image does not contain the library."
      fr: "EMR Serverless gère les workers à votre place et ne donne aucun accès SSH à ceux-ci, et l'image par défaut ne contient pas la bibliothèque."
    d:
      en: "Athena is a serverless SQL engine; it does not run the existing Spark transformations or give node access."
      fr: "Athena est un moteur SQL sans serveur ; il n'exécute pas les transformations Spark existantes et ne donne pas accès aux nœuds."
references:
  - title: Create bootstrap actions to install additional software with an Amazon EMR cluster
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-bootstrap.html
