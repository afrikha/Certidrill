id: deac01-1a-scheduled-api-pull
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company must call a partner's REST API every 15 minutes to download currency exchange rates. Each response is a JSON document smaller than 1 MB, and each call completes in a few seconds. The raw responses must be stored in an Amazon S3 bucket. The company wants a serverless solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages doit appeler l'API REST d'un partenaire toutes les 15 minutes pour télécharger des taux de change. Chaque réponse est un document JSON de moins de 1 Mo, et chaque appel se termine en quelques secondes. Les réponses brutes doivent être stockées dans un compartiment Amazon S3. L'entreprise veut une solution sans serveur avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon API Gateway REST API with an AWS service integration that writes the request body to the bucket.", fr: "Créer une API REST Amazon API Gateway avec une intégration de service AWS qui écrit le corps de la requête dans le compartiment." } }
    - { id: b, text: { en: "Create an Amazon EventBridge Scheduler schedule with `rate(15 minutes)` that invokes an AWS Lambda function that calls the API and writes to the bucket.", fr: "Créer une planification Amazon EventBridge Scheduler avec `rate(15 minutes)` qui appelle une fonction AWS Lambda qui interroge l'API et écrit dans le compartiment." } }
    - { id: c, text: { en: "Run a cron job on an Amazon EC2 instance that calls the API every 15 minutes and copies the responses to the bucket.", fr: "Exécuter une tâche cron sur une instance Amazon EC2 qui appelle l'API toutes les 15 minutes et copie les réponses dans le compartiment." } }
    - { id: d, text: { en: "Configure an S3 Event Notification on the bucket that invokes an AWS Lambda function that calls the API.", fr: "Configurer sur le compartiment une notification d'événement S3 qui appelle une fonction AWS Lambda qui interroge l'API." } }
answer: { optionId: b }
explanation:
  correct:
    en: "EventBridge Scheduler runs a rate-based schedule without servers and invokes the Lambda function every 15 minutes. The function calls the partner API, which takes a few seconds, and writes each response to Amazon S3."
    fr: "EventBridge Scheduler exécute une planification à fréquence fixe sans serveur et appelle la fonction Lambda toutes les 15 minutes. La fonction interroge l'API du partenaire, ce qui prend quelques secondes, et écrit chaque réponse dans Amazon S3."
  options:
    a:
      en: "API Gateway exposes an API for clients to call; it does not call the partner's API on a schedule."
      fr: "API Gateway expose une API que des clients appellent ; il n'appelle pas l'API du partenaire selon une planification."
    c:
      en: "An EC2 instance is a server that must be patched and monitored, which is not serverless."
      fr: "Une instance EC2 est un serveur à corriger et à surveiller, ce qui n'est pas sans serveur."
    d:
      en: "S3 Event Notifications react to changes in the bucket; nothing would start the first call every 15 minutes."
      fr: "Les notifications d'événements S3 réagissent aux modifications du compartiment ; rien ne déclencherait l'appel toutes les 15 minutes."
references:
  - title: Schedule types in EventBridge Scheduler - EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html
