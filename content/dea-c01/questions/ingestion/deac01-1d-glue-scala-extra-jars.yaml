id: deac01-1d-glue-scala-extra-jars
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is moving its on-premises Apache Spark jobs to AWS Glue. The jobs are written in Scala and call a validated JAR library of business rules that the risk team maintains. The company wants to reuse the existing code and library without rewriting them.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Une compagnie d'assurance migre ses tâches Apache Spark sur site vers AWS Glue. Les tâches sont écrites en Scala et appellent une bibliothèque JAR validée de règles métier que l'équipe des risques maintient. L'entreprise veut réutiliser le code et la bibliothèque existants sans les réécrire.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Rewrite the business rules as PySpark functions and run them in AWS Glue Spark jobs written in Python.", fr: "Réécrire les règles métier sous forme de fonctions PySpark et les exécuter dans des tâches Spark AWS Glue écrites en Python." } }
    - { id: b, text: { en: "Create Scala AWS Glue Spark jobs with the entry point in --class, and pass the S3 path of the JAR in --extra-jars.", fr: "Créer des tâches Spark AWS Glue en Scala avec le point d'entrée dans --class, et passer le chemin S3 du JAR dans --extra-jars." } }
    - { id: c, text: { en: "Create AWS Glue Spark jobs in Python, upload the JAR to Amazon S3, and pass its S3 path in --extra-py-files.", fr: "Créer des tâches Spark AWS Glue en Python, charger le JAR dans Amazon S3 et passer son chemin S3 dans --extra-py-files." } }
    - { id: d, text: { en: "Create AWS Glue Python shell jobs and load the JAR from Amazon S3 with the --additional-python-modules parameter.", fr: "Créer des tâches Python shell AWS Glue et charger le JAR depuis Amazon S3 avec le paramètre --additional-python-modules." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Glue Spark jobs can be written in Scala: --job-language scala selects the language and --class names the entry-point class. --extra-jars copies the listed S3 files to the driver and executors and adds them to the Java classpath, so the existing library is called unchanged."
    fr: "Les tâches Spark AWS Glue peuvent être écrites en Scala : --job-language scala choisit le langage et --class désigne la classe de point d'entrée. --extra-jars copie les fichiers S3 indiqués sur le pilote et les exécuteurs et les ajoute au classpath Java : la bibliothèque existante est appelée sans modification."
  options:
    a: { en: "Rewriting validated code is the effort the company wants to avoid, and it requires validating the rules again.", fr: "Réécrire du code validé est précisément l'effort que l'entreprise veut éviter, et il faudrait valider à nouveau les règles." }
    c: { en: "--extra-py-files adds Python modules to the Python path; it does not put a JAR on the Java classpath.", fr: "--extra-py-files ajoute des modules Python au chemin Python ; il ne place pas de JAR dans le classpath Java." }
    d: { en: "Python shell jobs do not run Spark or Scala code, and --additional-python-modules installs Python packages only.", fr: "Les tâches Python shell n'exécutent ni Spark ni du code Scala, et --additional-python-modules n'installe que des paquets Python." }
references:
  - title: Using job parameters in AWS Glue jobs
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-glue-arguments.html
