id: deac01-1a-firehose-transform-buffer
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon Data Firehose stream reads from an Amazon Kinesis data stream and invokes an AWS Lambda function for data transformation before delivering to Amazon S3. The function enriches each record, and its output is about three times the size of its input. The Lambda buffer size of the transformation is set to 3 MB. Many invocations fail because the response exceeds the payload limit, and the records are written to the processing-failed folder.

    Which change will fix the problem?
  fr: |
    Un flux Amazon Data Firehose lit un flux de données Amazon Kinesis et appelle une fonction AWS Lambda pour la transformation des données avant la livraison dans Amazon S3. La fonction enrichit chaque enregistrement, et sa sortie représente environ trois fois la taille de son entrée. La taille de tampon Lambda de la transformation est définie à 3 Mo. De nombreux appels échouent, car la réponse dépasse la limite de charge utile, et les enregistrements sont écrits dans le dossier processing-failed.

    Quelle modification corrige le problème ?
body:
  options:
    - { id: a, text: { en: "Increase the memory of the Lambda function so that it can return larger responses.", fr: "Augmenter la mémoire de la fonction Lambda afin qu'elle puisse renvoyer des réponses plus volumineuses." } }
    - { id: b, text: { en: "Lower the Lambda buffer size of the transformation (BufferSizeInMBs) to 1 MB.", fr: "Réduire la taille de tampon Lambda de la transformation (BufferSizeInMBs) à 1 Mo." } }
    - { id: c, text: { en: "Increase the buffer size of the S3 destination so that Firehose writes larger objects.", fr: "Augmenter la taille de tampon de la destination S3 afin que Firehose écrive des objets plus grands." } }
    - { id: d, text: { en: "Turn on record format conversion to Apache Parquet so that the transformed records are compressed.", fr: "Activer la conversion du format des enregistrements en Apache Parquet afin que les enregistrements transformés soient compressés." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Firehose invokes the transformation function synchronously, and synchronous invocations have a 6 MB limit for both the request and the response. A 3 MB input that triples in size exceeds that limit; a 1 MB Lambda buffer gives responses of about 3 MB. The Lambda buffer size can be set from 0.2 MB to 3 MB."
    fr: "Firehose appelle la fonction de transformation de manière synchrone, et les appels synchrones ont une limite de 6 Mo pour la requête comme pour la réponse. Une entrée de 3 Mo qui triple de taille dépasse cette limite ; un tampon Lambda de 1 Mo donne des réponses d'environ 3 Mo. La taille de tampon Lambda peut être définie de 0,2 Mo à 3 Mo."
  options:
    a:
      en: "Memory does not change the 6 MB payload limit of synchronous invocations."
      fr: "La mémoire ne change pas la limite de charge utile de 6 Mo des appels synchrones."
    c:
      en: "The destination buffer controls the size of the S3 objects, not the size of each Lambda invocation."
      fr: "Le tampon de destination contrôle la taille des objets S3, pas la taille de chaque appel Lambda."
    d:
      en: "Format conversion happens after the transformation, so the function response is still too large."
      fr: "La conversion de format a lieu après la transformation : la réponse de la fonction reste trop volumineuse."
references:
  - title: Transform source data in Amazon Data Firehose - Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/data-transformation.html
