id: deac01-3c-glue-job-run-queuing
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EventBridge rule starts an AWS Glue job each time a partner drops a file in Amazon S3. The job merges the file into an Apache Iceberg table, so two runs must never run at the same time, and the job keeps the default maximum concurrency of 1. When two files arrive close together, the second start request fails because the maximum number of concurrent runs is reached, and that file is never processed. The fix must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une règle Amazon EventBridge démarre une tâche AWS Glue chaque fois qu'un partenaire dépose un fichier dans Amazon S3. La tâche fusionne le fichier dans une table Apache Iceberg : deux exécutions ne doivent donc jamais avoir lieu en même temps, et la tâche conserve la concurrence maximale par défaut de 1. Lorsque deux fichiers arrivent à peu d'intervalle, la deuxième demande de démarrage échoue parce que le nombre maximal d'exécutions simultanées est atteint, et ce fichier n'est jamais traité. La correction doit présenter la plus FAIBLE charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the maximum concurrency of the job to 5 so that each file starts its own run.", fr: "Augmenter la concurrence maximale de la tâche à 5 pour que chaque fichier démarre sa propre exécution." } }
    - { id: b, text: { en: "Change the execution class of the job to Flex so that runs start when spare capacity is available.", fr: "Passer la classe d'exécution de la tâche à Flex pour que les exécutions démarrent lorsque de la capacité disponible existe." } }
    - { id: c, text: { en: "Send the events to an Amazon SQS queue and write an AWS Lambda function that starts the job only when no run is active.", fr: "Envoyer les événements vers une file d'attente Amazon SQS et écrire une fonction AWS Lambda qui ne démarre la tâche que lorsqu'aucune exécution n'est active." } }
    - { id: d, text: { en: "Enable job run queuing on the job and keep the maximum concurrency at 1.", fr: "Activer la mise en file d'attente des exécutions (job run queuing) sur la tâche et conserver la concurrence maximale à 1." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Maximum concurrency defaults to 1 and AWS Glue returns an error when the threshold is reached. With job run queuing enabled, a run that would exceed a limit such as the job's maximum concurrent runs waits in the queue instead of failing, so runs stay one at a time and no file is lost."
    fr: "La concurrence maximale vaut 1 par défaut et AWS Glue renvoie une erreur lorsque ce seuil est atteint. Avec la mise en file d'attente des exécutions activée, une exécution qui dépasserait une limite telle que le nombre maximal d'exécutions simultanées de la tâche attend dans la file au lieu d'échouer : les exécutions restent une par une et aucun fichier n'est perdu."
  options:
    a:
      en: "Several concurrent runs would merge into the same Iceberg table at once, which the requirements forbid."
      fr: "Plusieurs exécutions simultanées fusionneraient en même temps dans la même table Iceberg, ce que les exigences interdisent."
    b:
      en: "Flex changes how capacity is obtained and billed; it does not queue runs that exceed the maximum concurrency, and Flex jobs do not support queuing."
      fr: "Flex modifie l'obtention et la facturation de la capacité ; il ne met pas en file les exécutions qui dépassent la concurrence maximale, et les tâches Flex ne prennent pas en charge la mise en file d'attente."
    c:
      en: "This works but adds a queue, custom code and run-state checks to maintain, which is more overhead than a job setting."
      fr: "Cela fonctionne, mais ajoute une file d'attente, du code personnalisé et des vérifications d'état à maintenir, soit plus de charge qu'un paramètre de tâche."
references:
  - title: Configuring job properties for Spark jobs in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/add-job.html
