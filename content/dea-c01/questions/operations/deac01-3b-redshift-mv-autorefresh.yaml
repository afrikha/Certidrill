id: deac01-3b-redshift-mv-autorefresh
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Dashboards on an Amazon Redshift data warehouse run the same aggregation query over a 2-billion-row sales table hundreds of times per hour. New rows are loaded every few minutes. The dashboards must return results quickly and show data that is at most about 10 minutes old, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Des tableaux de bord sur un entrepôt de données Amazon Redshift exécutent la même requête d'agrégation sur une table de ventes de 2 milliards de lignes des centaines de fois par heure. De nouvelles lignes sont chargées toutes les quelques minutes. Les tableaux de bord doivent renvoyer les résultats rapidement et afficher des données datant d'environ 10 minutes au plus, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a materialized view that contains the aggregation with AUTO REFRESH YES, and point the dashboards to it.", fr: "Créer une vue matérialisée qui contient l'agrégation avec AUTO REFRESH YES, et faire pointer les tableaux de bord vers elle." } }
    - { id: b, text: { en: "Create a standard view that contains the aggregation query, and point the dashboards to it.", fr: "Créer une vue standard qui contient la requête d'agrégation, et faire pointer les tableaux de bord vers elle." } }
    - { id: c, text: { en: "Create a materialized view and run REFRESH MATERIALIZED VIEW every 10 minutes from a cron job on an Amazon EC2 instance.", fr: "Créer une vue matérialisée et exécuter REFRESH MATERIALIZED VIEW toutes les 10 minutes à partir d'une tâche cron sur une instance Amazon EC2." } }
    - { id: d, text: { en: "UNLOAD the aggregated results to Amazon S3 every 10 minutes and query them through Redshift Spectrum.", fr: "Exécuter UNLOAD des résultats agrégés vers Amazon S3 toutes les 10 minutes et les interroger via Redshift Spectrum." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A materialized view stores the precomputed result, so dashboards read it instead of aggregating 2 billion rows each time. With AUTO REFRESH YES, Amazon Redshift refreshes a stale view at the default interval of 300 seconds (or a chosen interval), incrementally when the query allows it, with no scheduler to run."
    fr: "Une vue matérialisée stocke le résultat précalculé : les tableaux de bord la lisent au lieu d'agréger 2 milliards de lignes à chaque fois. Avec AUTO REFRESH YES, Amazon Redshift actualise une vue obsolète à l'intervalle par défaut de 300 secondes (ou à l'intervalle choisi), de façon incrémentielle lorsque la requête le permet, sans planificateur à exploiter."
  options:
    b:
      en: "A standard view stores no results; every dashboard query still aggregates the full table."
      fr: "Une vue standard ne stocke aucun résultat : chaque requête du tableau de bord agrège toujours la table complète."
    c:
      en: "This meets the freshness goal but adds an EC2 instance and a cron job to run and monitor, which auto refresh avoids."
      fr: "Cette solution respecte la fraîcheur, mais ajoute une instance EC2 et une tâche cron à exploiter et surveiller, ce qu'évite l'actualisation automatique."
    d:
      en: "Scheduling unloads and maintaining external tables adds a pipeline, and Spectrum reads from S3 are slower than a local precomputed view."
      fr: "Planifier des déchargements et maintenir des tables externes ajoute un pipeline, et les lectures Spectrum depuis S3 sont plus lentes qu'une vue locale précalculée."
references:
  - title: Refreshing a materialized view
    url: https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-refresh.html
