id: deac01-3b-s3-prefix-data-events
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company keeps sensitive extracts under the finance/ prefix of an Amazon S3 data lake bucket that holds thousands of other prefixes. Auditors require a record of every object read and write under finance/ only, delivered within minutes, in log files that the company can prove were not modified or deleted after delivery.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise conserve des extraits sensibles sous le préfixe finance/ d'un compartiment de lac de données Amazon S3 qui contient des milliers d'autres préfixes. Les auditeurs exigent un enregistrement de chaque lecture et écriture d'objet sous finance/ uniquement, livré en quelques minutes, dans des fichiers journaux dont l'entreprise peut prouver qu'ils n'ont été ni modifiés ni supprimés après leur livraison.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on S3 server access logging for the bucket and deliver the access logs to a separate logging bucket.", fr: "Activer la journalisation des accès au serveur S3 pour le compartiment et livrer les journaux d'accès dans un compartiment de journalisation distinct." } }
    - { id: b, text: { en: "Create a trail that logs S3 data events with an advanced event selector whose resources.ARN field starts with the ARN of the finance/ prefix.", fr: "Créer un journal de suivi qui journalise les événements de données S3 avec un sélecteur d'événements avancé dont le champ resources.ARN commence par l'ARN du préfixe finance/." } }
    - { id: c, text: { en: "Create an S3 Inventory configuration that reports daily on the objects under the finance/ prefix.", fr: "Créer une configuration S3 Inventory qui produit chaque jour un rapport sur les objets du préfixe finance/." } }
    - { id: d, text: { en: "Turn on log file integrity validation for the trail.", fr: "Activer la validation de l'intégrité des fichiers journaux pour le journal de suivi." } }
    - { id: e, text: { en: "Turn on Amazon Macie automated sensitive data discovery for the bucket.", fr: "Activer la découverte automatisée des données sensibles Amazon Macie pour le compartiment." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Trails do not log data events by default; an advanced event selector on AWS::S3::Object with a StartsWith condition on resources.ARN limits them to the prefix, and CloudTrail delivers data events about every 5 minutes. Log file integrity validation adds signed hourly digest files that show whether a log file was modified or deleted after delivery."
    fr: "Les journaux de suivi ne journalisent pas les événements de données par défaut ; un sélecteur d'événements avancé sur AWS::S3::Object avec une condition StartsWith sur resources.ARN les limite au préfixe, et CloudTrail livre les événements de données environ toutes les 5 minutes. La validation de l'intégrité des fichiers journaux ajoute des fichiers de synthèse horaires signés qui montrent si un fichier journal a été modifié ou supprimé après sa livraison."
  options:
    a:
      en: "Server access logging covers the whole bucket, delivers within a few hours and offers no integrity validation of the log files."
      fr: "La journalisation des accès au serveur couvre tout le compartiment, livre en quelques heures et n'offre pas de validation d'intégrité des fichiers journaux."
    c:
      en: "S3 Inventory lists objects and their metadata; it does not record who read or wrote them."
      fr: "S3 Inventory liste les objets et leurs métadonnées ; il n'enregistre pas qui les a lus ou écrits."
    e:
      en: "Macie finds sensitive data in objects; it does not produce an access log of reads and writes."
      fr: "Macie détecte des données sensibles dans les objets ; il ne produit pas de journal d'accès des lectures et écritures."
references:
  - title: Logging data events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
  - title: Validating CloudTrail log file integrity
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
