id: deac01-3b-quick-incremental-refresh
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has an AWS Quick Sight dashboard (Enterprise edition) built on a SPICE dataset that imports a 400-million-row orders table from Amazon Redshift. The dataset must stay in SPICE to avoid query load on the cluster. New orders arrive continuously, and an order can be updated during the 3 days after it is created but never after that. Users want the dashboard to show data that is at most 30 minutes old, but a full refresh of the dataset takes more than an hour.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution dispose d'un tableau de bord AWS Quick Sight (édition Enterprise) basé sur un jeu de données SPICE qui importe une table de commandes de 400 millions de lignes depuis Amazon Redshift. Le jeu de données doit rester dans SPICE pour éviter de charger le cluster. De nouvelles commandes arrivent en continu, et une commande peut être modifiée pendant les 3 jours qui suivent sa création, mais jamais ensuite. Les utilisateurs veulent que le tableau de bord affiche des données datant d'au plus 30 minutes, mais une actualisation complète du jeu de données prend plus d'une heure.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Schedule a full refresh of the SPICE dataset every hour.", fr: "Planifier une actualisation complète du jeu de données SPICE toutes les heures." } }
    - { id: b, text: { en: "Schedule an incremental refresh every 15 minutes on the order date column with a look-back window of 1 hour.", fr: "Planifier une actualisation incrémentielle toutes les 15 minutes sur la colonne de date de commande avec une fenêtre de rétrospection d'une heure." } }
    - { id: c, text: { en: "Schedule an incremental refresh every 15 minutes on the order date column with a look-back window of 3 days.", fr: "Planifier une actualisation incrémentielle toutes les 15 minutes sur la colonne de date de commande avec une fenêtre de rétrospection de 3 jours." } }
    - { id: d, text: { en: "Create a Redshift materialized view with auto refresh and switch the dataset to direct query on that view.", fr: "Créer une vue matérialisée Redshift avec actualisation automatique et passer le jeu de données en requête directe sur cette vue." } }
answer: { optionId: c }
explanation:
  correct:
    en: "For SQL sources such as Amazon Redshift, Enterprise edition can schedule incremental refreshes as often as every 15 minutes. An incremental refresh reloads only the rows whose date column falls inside the look-back window, so a 3-day window picks up every order that can still change while keeping each refresh short."
    fr: "Pour les sources SQL comme Amazon Redshift, l'édition Enterprise peut planifier des actualisations incrémentielles jusqu'à toutes les 15 minutes. Une actualisation incrémentielle ne recharge que les lignes dont la colonne de date se situe dans la fenêtre de rétrospection : une fenêtre de 3 jours reprend toutes les commandes encore modifiables tout en gardant chaque actualisation courte."
  options:
    a:
      en: "A full refresh takes more than an hour, so an hourly schedule cannot keep the data within 30 minutes."
      fr: "Une actualisation complète dure plus d'une heure : une planification horaire ne peut pas garder des données de moins de 30 minutes."
    b:
      en: "A 1-hour look-back window misses updates to orders created more than an hour earlier, which can still change for 3 days."
      fr: "Une fenêtre de rétrospection d'une heure manque les modifications des commandes créées plus d'une heure avant, qui peuvent encore changer pendant 3 jours."
    d:
      en: "Direct query sends every dashboard query to the cluster, which breaks the requirement to keep the dataset in SPICE."
      fr: "La requête directe envoie chaque requête du tableau de bord au cluster, ce qui enfreint l'exigence de garder le jeu de données dans SPICE."
references:
  - title: Refreshing SPICE data
    url: https://docs.aws.amazon.com/quicksight/latest/user/refreshing-imported-data.html
