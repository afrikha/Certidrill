id: deac01-3c-dqdl-customsql-matches
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer defines an AWS Glue Data Quality ruleset for an orders dataset that is evaluated in an AWS Glue ETL job. The ruleset must enforce two business rules. First, no order can have a ship_date that is earlier than its order_date. Second, every value of the email column must match the pattern of an email address.

    Which two DQDL rules should the data engineer add to the ruleset? (Choose two.)
  fr: |
    Un ingénieur des données définit un ensemble de règles AWS Glue Data Quality pour un jeu de données de commandes évalué dans une tâche ETL AWS Glue. L'ensemble de règles doit appliquer deux règles métier. D'abord, aucune commande ne peut avoir une ship_date antérieure à son order_date. Ensuite, chaque valeur de la colonne email doit correspondre au modèle d'une adresse e-mail.

    Quelles sont les deux règles DQDL que l'ingénieur des données doit ajouter à l'ensemble de règles ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: '`ColumnValues "ship_date" > "order_date"`' }
    - { id: b, text: '`CustomSql "select count(*) from primary where ship_date < order_date" = 0`' }
    - { id: c, text: '`ColumnLength "email" > 5`' }
    - { id: d, text: '`ColumnValues "email" matches "[^@ ]+@[^@ ]+[.][a-zA-Z]+"`' }
    - { id: e, text: '`Completeness "email" = 1.0`' }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "CustomSql runs a SQL statement that returns a single numeric value against the primary alias, which stands for the evaluated dataset, so counting the orders whose ship_date is earlier than order_date and expecting 0 enforces a cross-column rule. ColumnValues with matches checks each value against a regular expression."
    fr: "CustomSql exécute une instruction SQL qui renvoie une seule valeur numérique sur l'alias primary, qui représente le jeu de données évalué : compter les commandes dont la ship_date est antérieure à l'order_date et attendre 0 applique une règle entre colonnes. ColumnValues avec matches vérifie chaque valeur par rapport à une expression régulière."
  options:
    a:
      en: "ColumnValues compares the values of one column with constant values or expressions, not with another column of the same row."
      fr: "ColumnValues compare les valeurs d'une colonne à des constantes ou à des expressions, pas à une autre colonne de la même ligne."
    c:
      en: "A minimum length does not check the format of an email address."
      fr: "Une longueur minimale ne vérifie pas le format d'une adresse e-mail."
    e:
      en: "Completeness checks that values are not null; it accepts any non-null text, valid or not."
      fr: "Completeness vérifie que les valeurs ne sont pas nulles ; elle accepte tout texte non nul, valide ou non."
references:
  - title: CustomSQL
    url: https://docs.aws.amazon.com/glue/latest/dg/dqdl-rule-types-CustomSql.html
  - title: Data Quality Definition Language (DQDL) reference
    url: https://docs.aws.amazon.com/glue/latest/dg/dqdl.html
