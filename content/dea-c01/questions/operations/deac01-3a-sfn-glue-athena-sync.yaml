id: deac01-3a-sfn-glue-athena-sync
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a nightly pipeline in which an AWS Glue ETL job writes curated data to Amazon S3, and then an Amazon Athena query builds a summary table from that data. Today, one AWS Lambda function starts the Glue job and a second function polls the job status every minute before it starts the query. The company wants to move the pipeline to AWS Step Functions. The Athena query must start only after the Glue job run has succeeded, and the solution must require the LEAST custom code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un pipeline nocturne dans lequel une tâche ETL AWS Glue écrit des données organisées dans Amazon S3, puis une requête Amazon Athena crée une table de synthèse à partir de ces données. Aujourd'hui, une fonction AWS Lambda démarre la tâche Glue et une seconde fonction interroge l'état de la tâche toutes les minutes avant de lancer la requête. L'entreprise veut déplacer le pipeline vers AWS Step Functions. La requête Athena ne doit démarrer qu'après la réussite de l'exécution de la tâche Glue, et la solution doit nécessiter le MOINS de code personnalisé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Standard workflow with a glue:startJobRun.sync task, followed by an athena:startQueryExecution.sync task.", fr: "Créer un flux de travail Standard avec une tâche glue:startJobRun.sync, suivie d'une tâche athena:startQueryExecution.sync." } }
    - { id: b, text: { en: "Create a Standard workflow with a Lambda task that starts the Glue job and loops on GetJobRun until the run ends, followed by an Athena task.", fr: "Créer un flux de travail Standard avec une tâche Lambda qui démarre la tâche Glue et boucle sur GetJobRun jusqu'à la fin de l'exécution, suivie d'une tâche Athena." } }
    - { id: c, text: { en: "Create a Standard workflow with a glue:startJobRun task that uses the Request Response pattern, followed by a 30-minute Wait state and an Athena task.", fr: "Créer un flux de travail Standard avec une tâche glue:startJobRun qui utilise le modèle Request Response, suivie d'un état Wait de 30 minutes et d'une tâche Athena." } }
    - { id: d, text: { en: "Create an Express workflow with a glue:startJobRun.sync task, followed by an athena:startQueryExecution.sync task.", fr: "Créer un flux de travail Express avec une tâche glue:startJobRun.sync, suivie d'une tâche athena:startQueryExecution.sync." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The optimized Glue integration supports the Run a Job (.sync) pattern: Step Functions starts the job run and waits for it to finish, and the task fails if the run fails. The Athena StartQueryExecution integration also supports .sync, so the whole pipeline needs no Lambda polling code."
    fr: "L'intégration optimisée Glue prend en charge le modèle Run a Job (.sync) : Step Functions démarre l'exécution de la tâche et attend sa fin, et l'état Task échoue si l'exécution échoue. L'intégration Athena StartQueryExecution prend aussi en charge .sync : le pipeline n'a plus besoin de code Lambda d'interrogation."
  options:
    b:
      en: "This keeps the custom polling code that the company wants to remove, while the .sync integration does the same work natively."
      fr: "Cette option conserve le code d'interrogation personnalisé que l'entreprise veut supprimer, alors que l'intégration .sync fait le même travail nativement."
    c:
      en: "Request Response returns as soon as the job run starts; a fixed wait does not guarantee that the run has finished or succeeded."
      fr: "Request Response rend la main dès le démarrage de l'exécution ; une attente fixe ne garantit pas que l'exécution est terminée ni qu'elle a réussi."
    d:
      en: "Express workflows do not support the Run a Job (.sync) integration pattern."
      fr: "Les flux de travail Express ne prennent pas en charge le modèle d'intégration Run a Job (.sync)."
references:
  - title: Start an AWS Glue job with Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-glue.html
  - title: Run Athena queries with Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-athena.html
