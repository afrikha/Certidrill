id: deac01-3b-kinesis-iterator-alarm
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A consumer application reads records from an Amazon Kinesis data stream that has a 24-hour retention period. To avoid losing data, the team wants to receive an email when the consumer falls more than 1 hour behind the newest records in the stream.

    Which solution will meet these requirements?
  fr: |
    Une application consommatrice lit des enregistrements dans un flux de données Amazon Kinesis dont la période de conservation est de 24 heures. Pour éviter de perdre des données, l'équipe veut recevoir un e-mail lorsque le consommateur accuse plus d'une heure de retard sur les enregistrements les plus récents du flux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch alarm on the WriteProvisionedThroughputExceeded metric of the stream with an Amazon SNS email notification.", fr: "Créer une alarme CloudWatch sur la métrique WriteProvisionedThroughputExceeded du flux avec une notification par e-mail Amazon SNS." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the IncomingBytes metric of the stream with an Amazon SNS email notification.", fr: "Créer une alarme CloudWatch sur la métrique IncomingBytes du flux avec une notification par e-mail Amazon SNS." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the GetRecords.Latency metric of the stream with an Amazon SNS email notification.", fr: "Créer une alarme CloudWatch sur la métrique GetRecords.Latency du flux avec une notification par e-mail Amazon SNS." } }
    - { id: d, text: { en: "Create a CloudWatch alarm when the Maximum of GetRecords.IteratorAgeMilliseconds exceeds 3,600,000, with an SNS email action.", fr: "Créer une alarme CloudWatch lorsque le maximum de GetRecords.IteratorAgeMilliseconds dépasse 3 600 000, avec une action d'e-mail SNS." } }
answer: { optionId: d }
explanation:
  correct:
    en: "GetRecords.IteratorAgeMilliseconds is the age of the last record returned by GetRecords calls, so it shows how far consumers are behind; zero means they are caught up. An alarm on its Maximum above 3,600,000 ms (1 hour) with an SNS action sends the email well before records reach the end of the 24-hour retention."
    fr: "GetRecords.IteratorAgeMilliseconds est l'âge du dernier enregistrement renvoyé par les appels GetRecords : il montre le retard des consommateurs, zéro signifiant qu'ils sont à jour. Une alarme sur son maximum au-dessus de 3 600 000 ms (1 heure) avec une action SNS envoie l'e-mail bien avant que les enregistrements n'atteignent la fin de la conservation de 24 heures."
  options:
    a:
      en: "WriteProvisionedThroughputExceeded counts producer records rejected by throttling, not consumer lag."
      fr: "WriteProvisionedThroughputExceeded compte les enregistrements de producteurs rejetés par limitation, et non le retard des consommateurs."
    b:
      en: "IncomingBytes measures the data written to the stream, not how far behind the consumer is."
      fr: "IncomingBytes mesure les données écrites dans le flux, et non le retard du consommateur."
    c:
      en: "GetRecords.Latency is the time each GetRecords call takes, not the age of the records being read."
      fr: "GetRecords.Latency est la durée de chaque appel GetRecords, et non l'âge des enregistrements lus."
references:
  - title: Monitor the Amazon Kinesis Data Streams service with Amazon CloudWatch
    url: https://docs.aws.amazon.com/streams/latest/dev/monitoring-with-cloudwatch.html
