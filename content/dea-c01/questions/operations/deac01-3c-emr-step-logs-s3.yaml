id: deac01-3c-emr-step-logs-s3
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nightly Amazon EMR cluster is created from the AWS CLI with --log-uri s3://anycompany-emr-logs/ and is configured to terminate after its last step. Last night, a Spark step failed and the cluster terminated. A data engineer must read the logs of the failed step to find the cause.

    Where can the data engineer find these logs?
  fr: |
    Un cluster Amazon EMR nocturne est créé depuis l'AWS CLI avec --log-uri s3://anycompany-emr-logs/ et est configuré pour se terminer après sa dernière étape. La nuit dernière, une étape Spark a échoué et le cluster s'est terminé. Un ingénieur des données doit lire les journaux de l'étape en échec pour en trouver la cause.

    Où l'ingénieur des données peut-il trouver ces journaux ?
body:
  options:
    - { id: a, text: { en: "In the /mnt/var/log/hadoop/steps/ directory, after connecting to the primary node with SSH", fr: "Dans le répertoire /mnt/var/log/hadoop/steps/, après s'être connecté au nœud primaire en SSH" } }
    - { id: b, text: { en: "In the steps/ folder under the cluster ID in the s3://anycompany-emr-logs/ bucket", fr: "Dans le dossier steps/ sous l'ID du cluster, dans le compartiment s3://anycompany-emr-logs/" } }
    - { id: c, text: { en: "In a CloudWatch Logs log group that Amazon EMR creates by default for each cluster", fr: "Dans un groupe de journaux CloudWatch Logs qu'Amazon EMR crée par défaut pour chaque cluster" } }
    - { id: d, text: { en: "In the CloudTrail Event history, filtered on the AddJobFlowSteps event name", fr: "Dans l'historique des événements CloudTrail, filtré sur le nom d'événement AddJobFlowSteps" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Each node writes logs under /mnt/var/log/, and when a log URI is set, Amazon EMR archives them to S3, with step logs under <cluster-id>/steps/<step-id>/. The archive in S3 remains available after the cluster terminates."
    fr: "Chaque nœud écrit ses journaux sous /mnt/var/log/ et, lorsqu'un URI de journal est défini, Amazon EMR les archive dans S3, les journaux d'étape se trouvant sous <cluster-id>/steps/<step-id>/. L'archive dans S3 reste disponible après la terminaison du cluster."
  options:
    a:
      en: "The cluster has terminated, so its primary node no longer exists and cannot be reached with SSH."
      fr: "Le cluster s'est terminé : son nœud primaire n'existe plus et ne peut pas être joint en SSH."
    c:
      en: "Amazon EMR does not send step logs to CloudWatch Logs by default; the archive location is the S3 log URI."
      fr: "Amazon EMR n'envoie pas les journaux d'étape vers CloudWatch Logs par défaut ; l'emplacement d'archivage est l'URI de journal S3."
    d:
      en: "CloudTrail records the API call that added the step, not the output or errors of the Spark application."
      fr: "CloudTrail enregistre l'appel d'API qui a ajouté l'étape, pas la sortie ni les erreurs de l'application Spark."
references:
  - title: Configure Amazon EMR cluster logging and debugging
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-debugging.html
