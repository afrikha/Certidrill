id: deac01-3b-athena-duplicate-check
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer loads daily order files into an Athena table named orders. Before the data is published, the engineer must verify that no order_id value appears more than once and must list every order_id value that does.

    Which query will meet this requirement?
  fr: |
    Un ingénieur des données charge des fichiers de commandes quotidiens dans une table Athena nommée orders. Avant la publication des données, il doit vérifier qu'aucune valeur order_id n'apparaît plus d'une fois et lister chaque valeur order_id qui apparaît plusieurs fois.

    Quelle requête répond à cette exigence ?
body:
  options:
    - { id: a, text: "`SELECT DISTINCT order_id FROM orders`" }
    - { id: b, text: "`SELECT order_id, COUNT(*) AS n FROM orders WHERE COUNT(*) > 1 GROUP BY order_id`" }
    - { id: c, text: "`SELECT COUNT(DISTINCT order_id) AS n FROM orders`" }
    - { id: d, text: "`SELECT order_id, COUNT(*) AS n FROM orders GROUP BY order_id HAVING COUNT(*) > 1`" }
answer: { optionId: d }
explanation:
  correct:
    en: "GROUP BY order_id produces one group per value, and HAVING filters the groups after the aggregates are computed. Only the order_id values that appear more than once are returned, with their number of occurrences, and an empty result proves that the column is unique."
    fr: "GROUP BY order_id produit un groupe par valeur, et HAVING filtre les groupes une fois les agrégats calculés. Seules les valeurs order_id qui apparaissent plus d'une fois sont renvoyées, avec leur nombre d'occurrences, et un résultat vide prouve que la colonne est unique."
  options:
    a:
      en: "DISTINCT lists every order_id once, whether or not it is duplicated, so it does not show which values repeat."
      fr: "DISTINCT liste chaque order_id une fois, qu'il soit en double ou non : la requête ne montre pas les valeurs répétées."
    b:
      en: "WHERE filters rows before grouping, so an aggregate such as COUNT(*) cannot be used there and the query fails."
      fr: "WHERE filtre les lignes avant le regroupement : un agrégat comme COUNT(*) ne peut pas y figurer et la requête échoue."
    c:
      en: "This returns only the number of distinct values; it does not list the duplicated order_id values."
      fr: "Cette requête ne renvoie que le nombre de valeurs distinctes ; elle ne liste pas les valeurs order_id en double."
references:
  - title: SELECT
    url: https://docs.aws.amazon.com/athena/latest/ug/select.html
