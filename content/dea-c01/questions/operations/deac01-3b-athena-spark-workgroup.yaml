id: deac01-3b-athena-spark-workgroup
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data analyst runs SQL in the Athena query editor in a workgroup that uses the Athena SQL engine. The analyst now wants to explore the same AWS Glue Data Catalog tables with PySpark in Athena in-console notebooks (PySpark engine version 3).

    Which solution will meet this requirement?
  fr: |
    Une analyste de données exécute du SQL dans l'éditeur de requêtes Athena, dans un groupe de travail qui utilise le moteur Athena SQL. Elle veut maintenant explorer les mêmes tables du AWS Glue Data Catalog avec PySpark dans les blocs-notes de la console Athena (PySpark engine version 3).

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Edit the existing workgroup and change its analytics engine to Apache Spark.", fr: "Modifier le groupe de travail existant et remplacer son moteur d'analyse par Apache Spark." } }
    - { id: b, text: { en: "Upgrade the existing workgroup to Athena engine version 3 and run the PySpark code in the query editor.", fr: "Mettre à niveau le groupe de travail existant vers la version 3 du moteur Athena et exécuter le code PySpark dans l'éditeur de requêtes." } }
    - { id: c, text: { en: "Create a workgroup with Apache Spark as its analytics engine and run the PySpark code in its query editor.", fr: "Créer un groupe de travail dont le moteur d'analyse est Apache Spark et exécuter le code PySpark dans son éditeur de requêtes." } }
    - { id: d, text: { en: "Create a workgroup with the Apache Spark engine, switch to it, and create a notebook in Notebook explorer.", fr: "Créer un groupe de travail avec le moteur Apache Spark, basculer vers celui-ci et créer un bloc-notes dans Notebook explorer." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Athena for Apache Spark requires a Spark-enabled workgroup. After switching to that workgroup, the analyst opens Notebook explorer and creates a notebook, which starts a session that can read the Data Catalog tables."
    fr: "Athena for Apache Spark exige un groupe de travail compatible Spark. Après avoir basculé vers ce groupe de travail, l'analyste ouvre l'explorateur de blocs-notes et crée un bloc-notes, ce qui démarre une session capable de lire les tables du Data Catalog."
  options:
    a:
      en: "The analytics engine of a workgroup cannot be changed after the workgroup is created."
      fr: "Le moteur d'analyse d'un groupe de travail ne peut pas être modifié après la création du groupe de travail."
    b:
      en: "Engine versions apply to Athena SQL; the query editor runs SQL, not PySpark."
      fr: "Les versions de moteur concernent Athena SQL ; l'éditeur de requêtes exécute du SQL, pas du PySpark."
    c:
      en: "Spark-enabled workgroups use the notebook editor; they cannot use the Athena query editor."
      fr: "Les groupes de travail Spark utilisent l'éditeur de blocs-notes ; ils ne peuvent pas utiliser l'éditeur de requêtes Athena."
references:
  - title: Get started with Apache Spark on Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/notebooks-spark-getting-started.html
