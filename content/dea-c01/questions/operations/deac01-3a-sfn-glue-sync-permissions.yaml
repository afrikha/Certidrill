id: deac01-3a-sfn-glue-sync-permissions
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Step Functions state machine starts an AWS Glue job by using the arn:aws:states:::glue:startJobRun.sync resource. The execution role of the state machine has the following policy. In each execution, the job run starts and completes successfully in the Glue console, but the Task state fails with a permissions error shortly after the run starts.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["glue:StartJobRun"],
          "Resource": "*"
        }
      ]
    }
    ```

    Which change will resolve the issue?
  fr: |
    Une machine d'état AWS Step Functions démarre une tâche AWS Glue avec la ressource arn:aws:states:::glue:startJobRun.sync. Le rôle d'exécution de la machine d'état possède la politique suivante. À chaque exécution, l'exécution de la tâche démarre et se termine correctement dans la console Glue, mais l'état Task échoue avec une erreur d'autorisation peu après le démarrage.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["glue:StartJobRun"],
          "Resource": "*"
        }
      ]
    }
    ```

    Quelle modification résout le problème ?
body:
  options:
    - { id: a, text: { en: "Add the glue:GetJobRun, glue:GetJobRuns, and glue:BatchStopJobRun actions to the policy of the execution role.", fr: "Ajouter les actions glue:GetJobRun, glue:GetJobRuns et glue:BatchStopJobRun à la politique du rôle d'exécution." } }
    - { id: b, text: { en: "Add a resource-based policy to the Glue job that allows the states.amazonaws.com service principal to start it.", fr: "Ajouter à la tâche Glue une politique basée sur les ressources qui autorise le principal de service states.amazonaws.com à la démarrer." } }
    - { id: c, text: { en: "Add the iam:PassRole action for the IAM role of the Glue job to the policy of the execution role.", fr: "Ajouter l'action iam:PassRole pour le rôle IAM de la tâche Glue à la politique du rôle d'exécution." } }
    - { id: d, text: { en: "Change the resource to arn:aws:states:::glue:startJobRun.waitForTaskToken so that only glue:StartJobRun is needed.", fr: "Remplacer la ressource par arn:aws:states:::glue:startJobRun.waitForTaskToken pour que seule l'action glue:StartJobRun soit nécessaire." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With the Run a Job (.sync) pattern, Step Functions polls the job run status and can stop the run, so the execution role needs glue:GetJobRun, glue:GetJobRuns, and glue:BatchStopJobRun in addition to glue:StartJobRun. The run starts because StartJobRun is allowed, and the task fails when Step Functions checks its status."
    fr: "Avec le modèle Run a Job (.sync), Step Functions interroge l'état de l'exécution et peut l'arrêter : le rôle d'exécution a besoin de glue:GetJobRun, glue:GetJobRuns et glue:BatchStopJobRun en plus de glue:StartJobRun. L'exécution démarre parce que StartJobRun est autorisé, et l'état Task échoue lorsque Step Functions vérifie son état."
  options:
    b:
      en: "Glue jobs do not support resource-based policies; access is granted through the identity-based policy of the execution role."
      fr: "Les tâches Glue ne prennent pas en charge les politiques basées sur les ressources ; l'accès est accordé par la politique basée sur l'identité du rôle d'exécution."
    c:
      en: "The job run already starts and completes, so passing the job role is not the failing step; the missing permissions are the status checks."
      fr: "L'exécution de la tâche démarre et se termine déjà : la transmission du rôle de la tâche n'est pas l'étape en échec ; ce sont les vérifications d'état qui manquent."
    d:
      en: "The callback pattern waits for a task token that the Glue job never sends back, so the task would not complete when the run ends."
      fr: "Le modèle de rappel attend un jeton de tâche que la tâche Glue ne renvoie jamais : l'état Task ne se terminerait pas à la fin de l'exécution."
references:
  - title: Start an AWS Glue job with Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-glue.html
