id: deac01-3a-sdk-ddb-unprocessed-items
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python job loads 2 million product records into an Amazon DynamoDB table by calling the batch_write_item operation of the low-level Boto3 client with chunks of 25 put requests. The job finishes without any exception, but a later count shows that several thousand items are missing. The table uses provisioned capacity and showed throttled write requests during the load.

    Which change will ensure that all items are written?
  fr: |
    Une tâche Python charge 2 millions d'enregistrements de produits dans une table Amazon DynamoDB en appelant l'opération batch_write_item du client Boto3 de bas niveau avec des lots de 25 requêtes put. La tâche se termine sans aucune exception, mais un comptage ultérieur montre que plusieurs milliers d'éléments manquent. La table utilise la capacité provisionnée et a présenté des requêtes d'écriture limitées pendant le chargement.

    Quelle modification garantit que tous les éléments sont écrits ?
body:
  options:
    - { id: a, text: { en: "Increase the chunk size to 100 put requests so that each call writes more items before throttling starts.", fr: "Porter la taille des lots à 100 requêtes put pour que chaque appel écrive plus d'éléments avant le début de la limitation." } }
    - { id: b, text: { en: "Read the UnprocessedItems map of each response and resubmit it with exponential backoff until the map is empty.", fr: "Lire la table UnprocessedItems de chaque réponse et la soumettre à nouveau avec un backoff exponentiel jusqu'à ce qu'elle soit vide." } }
    - { id: c, text: { en: "Add a ConditionExpression to each put request so that DynamoDB raises an exception for every item it does not write.", fr: "Ajouter une ConditionExpression à chaque requête put pour que DynamoDB lève une exception pour chaque élément non écrit." } }
    - { id: d, text: { en: "Enable DynamoDB Streams on the table so that rejected writes are replayed automatically from the stream.", fr: "Activer DynamoDB Streams sur la table pour que les écritures rejetées soient rejouées automatiquement depuis le flux." } }
answer: { optionId: b }
explanation:
  correct:
    en: "BatchWriteItem returns the puts and deletes that failed because of throughput limits or internal errors in UnprocessedItems, in the same format as RequestItems, without raising an error. The caller must resubmit them, and exponential backoff makes the retried requests much more likely to succeed."
    fr: "BatchWriteItem renvoie dans UnprocessedItems, au même format que RequestItems et sans lever d'erreur, les put et delete qui ont échoué à cause des limites de débit ou d'erreurs internes. L'appelant doit les soumettre à nouveau, et un backoff exponentiel rend les nouvelles tentatives beaucoup plus susceptibles de réussir."
  options:
    a:
      en: "BatchWriteItem accepts at most 25 put or delete requests per call; a request with 100 is rejected."
      fr: "BatchWriteItem accepte au plus 25 requêtes put ou delete par appel ; une requête de 100 est rejetée."
    c:
      en: "BatchWriteItem does not support conditions on individual put requests."
      fr: "BatchWriteItem ne prend pas en charge de conditions sur les requêtes put individuelles."
    d:
      en: "A stream records changes that were written; items that were never written do not appear in it."
      fr: "Un flux enregistre les modifications écrites ; les éléments jamais écrits n'y figurent pas."
references:
  - title: BatchWriteItem
    url: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_BatchWriteItem.html
