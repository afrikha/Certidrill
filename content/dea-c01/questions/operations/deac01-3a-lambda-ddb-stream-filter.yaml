id: deac01-3a-lambda-ddb-stream-filter
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lambda function reads the Amazon DynamoDB stream of an orders table through an event source mapping. The function must send an order to a billing system only when the status attribute of the new item image is SHIPPED. Today the function receives every change and discards about 95% of the records in its code. The company wants the function to be invoked only for the relevant records, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une fonction Lambda lit le flux Amazon DynamoDB d'une table orders par un mappage de source d'événement. La fonction ne doit envoyer une commande au système de facturation que lorsque l'attribut status de la nouvelle image de l'élément vaut SHIPPED. Aujourd'hui, la fonction reçoit chaque modification et écarte environ 95 % des enregistrements dans son code. L'entreprise veut que la fonction ne soit appelée que pour les enregistrements pertinents, avec le MOINS d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the stream view type of the table to KEYS_ONLY so that the records are smaller.", fr: "Passer le type de vue du flux de la table à KEYS_ONLY pour que les enregistrements soient plus petits." } }
    - { id: b, text: { en: "Increase the batch size of the event source mapping so that the function is invoked fewer times.", fr: "Augmenter la taille de lot du mappage de source d'événement pour que la fonction soit appelée moins souvent." } }
    - { id: c, text: { en: "Enable Time to Live on the table so that old orders are removed before they reach the stream.", fr: "Activer la durée de vie (TTL) sur la table pour que les anciennes commandes soient supprimées avant d'atteindre le flux." } }
    - { id: d, text: { en: "Add filter criteria to the event source mapping with a pattern on dynamodb.NewImage.status.S equal to SHIPPED.", fr: "Ajouter au mappage de source d'événement des critères de filtre avec un modèle sur dynamodb.NewImage.status.S égal à SHIPPED." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Event filtering on a DynamoDB event source mapping matches the dynamodb key of each stream record, including attributes of NewImage, and Lambda invokes the function only for matching records. Records that do not match are skipped as the iterator advances, so no code change is needed."
    fr: "Le filtrage d'événements sur un mappage de source d'événement DynamoDB compare la clé dynamodb de chaque enregistrement du flux, y compris les attributs de NewImage, et Lambda n'appelle la fonction que pour les enregistrements correspondants. Les enregistrements non correspondants sont ignorés quand l'itérateur avance : aucune modification du code n'est nécessaire."
  options:
    a:
      en: "KEYS_ONLY removes the item images, so the function could no longer see the status at all."
      fr: "KEYS_ONLY supprime les images des éléments : la fonction ne pourrait plus du tout voir le statut."
    b:
      en: "Larger batches reduce the number of invocations but still deliver every record to the function."
      fr: "Des lots plus grands réduisent le nombre d'appels mais livrent toujours chaque enregistrement à la fonction."
    c:
      en: "TTL deletes expired items, which creates more stream records, and does not filter changes."
      fr: "La TTL supprime les éléments expirés, ce qui crée davantage d'enregistrements de flux, et ne filtre pas les modifications."
references:
  - title: Using event filtering with a DynamoDB event source
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-ddb-filtering.html
  - title: Control which events Lambda sends to your Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventfiltering.html
