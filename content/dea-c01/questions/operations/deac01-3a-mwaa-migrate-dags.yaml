id: deac01-3a-mwaa-migrate-dags
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs Apache Airflow on self-managed Amazon EC2 instances. More than 300 Python DAGs orchestrate AWS Glue jobs, Amazon EMR steps, and Amazon Redshift loads. The data team spends too much time patching and scaling the Airflow servers. The team wants to keep the existing DAG code with minimal changes and to reduce operational overhead.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany exécute Apache Airflow sur des instances Amazon EC2 autogérées. Plus de 300 DAG Python orchestrent des tâches AWS Glue, des étapes Amazon EMR et des chargements Amazon Redshift. L'équipe data passe trop de temps à appliquer les correctifs et à dimensionner les serveurs Airflow. L'équipe veut conserver le code des DAG existants avec un minimum de modifications et réduire la charge opérationnelle.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon MWAA environment, copy the DAG files to the dags folder of its S3 bucket, and list the Python dependencies in requirements.txt.", fr: "Créer un environnement Amazon MWAA, copier les fichiers DAG dans le dossier dags de son compartiment S3 et lister les dépendances Python dans requirements.txt." } }
    - { id: b, text: { en: "Rewrite each DAG as an AWS Step Functions state machine in Amazon States Language and schedule the state machines.", fr: "Réécrire chaque DAG sous forme de machine d'état AWS Step Functions en Amazon States Language et planifier les machines d'état." } }
    - { id: c, text: { en: "Rebuild each DAG as an AWS Glue workflow with conditional triggers between the jobs and crawlers.", fr: "Reconstruire chaque DAG sous forme de flux de travail AWS Glue avec des déclencheurs conditionnels entre les tâches et les robots d'analyse." } }
    - { id: d, text: { en: "Run the Airflow scheduler and workers as containers on an Amazon ECS cluster of EC2 instances that the team manages.", fr: "Exécuter le planificateur et les workers Airflow comme conteneurs sur un cluster Amazon ECS d'instances EC2 géré par l'équipe." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon MWAA runs Apache Airflow as a managed service, with worker autoscaling and logs in CloudWatch. Existing DAGs are deployed by copying them to the dags folder of the environment's S3 bucket, and Python dependencies are installed from requirements.txt, so the DAG code barely changes."
    fr: "Amazon MWAA exécute Apache Airflow en tant que service géré, avec la mise à l'échelle automatique des workers et des journaux dans CloudWatch. Les DAG existants sont déployés en les copiant dans le dossier dags du compartiment S3 de l'environnement, et les dépendances Python sont installées depuis requirements.txt : le code des DAG change à peine."
  options:
    b:
      en: "Rewriting 300 DAGs in another language is a large migration and does not keep the existing DAG code."
      fr: "Réécrire 300 DAG dans un autre langage est une migration lourde qui ne conserve pas le code existant des DAG."
    c:
      en: "Glue workflows orchestrate only Glue jobs, crawlers, and triggers, and every DAG would have to be rebuilt."
      fr: "Les flux de travail Glue n'orchestrent que des tâches, des robots d'analyse et des déclencheurs Glue, et chaque DAG devrait être reconstruit."
    d:
      en: "The team would still manage the EC2 instances, the cluster capacity, and the Airflow components."
      fr: "L'équipe gérerait toujours les instances EC2, la capacité du cluster et les composants Airflow."
references:
  - title: What Is Amazon Managed Workflows for Apache Airflow?
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html
  - title: Adding or updating DAGs
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/configuring-dag-folder.html
