id: deac01-3c-canvas-stratified-sample
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data team uses an Amazon SageMaker Canvas data flow to explore 80 million insurance claims before building data quality checks. Claims come from 12 Regions, and three Regions together account for less than 1% of the rows. The team must work on a sample of limited size in which every Region is represented in the same proportion as in the full dataset.

    Which sampling method should the team configure in the data flow?
  fr: |
    Une équipe données utilise un flux de données Amazon SageMaker Canvas pour explorer 80 millions de sinistres d'assurance avant de concevoir des contrôles de qualité des données. Les sinistres proviennent de 12 Régions, et trois Régions représentent ensemble moins de 1 % des lignes. L'équipe doit travailler sur un échantillon de taille limitée dans lequel chaque Région est représentée dans la même proportion que dans le jeu de données complet.

    Quelle méthode d'échantillonnage l'équipe doit-elle configurer dans le flux de données ?
body:
  options:
    - { id: a, text: { en: "Stratified sampling on the region column", fr: "Un échantillonnage stratifié sur la colonne region" } }
    - { id: b, text: { en: "Random sampling with a larger maximum sample size", fr: "Un échantillonnage aléatoire avec une taille maximale d'échantillon plus grande" } }
    - { id: c, text: { en: "FirstK sampling after sorting the claims by region", fr: "Un échantillonnage FirstK après un tri des sinistres par région" } }
    - { id: d, text: { en: "FirstK sampling on the claims in their original order", fr: "Un échantillonnage FirstK sur les sinistres dans leur ordre d'origine" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Stratified sampling divides the dataset into groups based on one or more attributes and randomly selects a proportional number of items from each group. Stratifying on region guarantees that the small Regions are represented in their real proportion within a limited sample."
    fr: "L'échantillonnage stratifié divise le jeu de données en groupes selon un ou plusieurs attributs et sélectionne aléatoirement un nombre proportionnel d'éléments dans chaque groupe. Stratifier sur la colonne region garantit que les petites Régions sont représentées dans leur proportion réelle au sein d'un échantillon limité."
  options:
    b:
      en: "Random sampling is representative on average, but it does not guarantee the proportion of the rare Regions in each sample."
      fr: "L'échantillonnage aléatoire est représentatif en moyenne, mais il ne garantit pas la proportion des Régions rares dans chaque échantillon."
    c:
      en: "The first K rows of a sorted dataset contain only the first Regions in sort order, which leaves others out."
      fr: "Les K premières lignes d'un jeu de données trié ne contiennent que les premières Régions dans l'ordre de tri, ce qui en exclut d'autres."
    d:
      en: "FirstK can introduce bias when the dataset is not randomly ordered and gives no control over the Region proportions."
      fr: "FirstK peut introduire un biais lorsque le jeu de données n'est pas ordonné aléatoirement et ne donne aucun contrôle sur les proportions des Régions."
references:
  - title: Edit the data flow sampling configuration
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/canvas-data-flow-edit-sampling.html
