id: deac01-3b-quick-vpc-redshift
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a provisioned Amazon Redshift cluster in private subnets of a VPC. The cluster is not publicly accessible, and company policy forbids exposing it to the internet. Analysts must build AWS Quick Sight (Enterprise edition) dashboards that use direct query on the cluster so that they always show current data.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster Amazon Redshift provisionné dans des sous-réseaux privés d'un VPC. Le cluster n'est pas accessible publiquement et la politique de l'entreprise interdit de l'exposer à Internet. Les analystes doivent créer des tableaux de bord AWS Quick Sight (édition Enterprise) qui utilisent la requête directe sur le cluster afin d'afficher toujours des données à jour.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Quick Sight VPC connection in the cluster's VPC and allow its security group in the cluster's security group.", fr: "Créer une connexion VPC Quick Sight dans le VPC du cluster et autoriser son groupe de sécurité dans celui du cluster." } }
    - { id: b, text: { en: "Turn on the Publicly accessible setting of the cluster and allow the Quick Sight IP address range in its security group.", fr: "Activer le paramètre d'accès public du cluster et autoriser la plage d'adresses IP de Quick Sight dans son groupe de sécurité." } }
    - { id: c, text: { en: "Unload the tables to Amazon S3 every night and build the Quick Sight datasets on Athena tables over the unloaded files.", fr: "Décharger les tables dans Amazon S3 chaque nuit et créer les jeux de données Quick Sight sur des tables Athena définies sur les fichiers déchargés." } }
    - { id: d, text: { en: "Create an IAM role that allows Quick Sight to call redshift:GetClusterCredentials and keep the default network settings.", fr: "Créer un rôle IAM qui autorise Quick Sight à appeler redshift:GetClusterCredentials et conserver les paramètres réseau par défaut." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A Quick Sight VPC connection adds elastic network interfaces in the VPC, so Quick Sight can reach private data sources such as a cluster that is not publicly accessible. Security groups, route tables and network ACLs apply to that traffic as to any other traffic in the VPC, so the cluster's security group must allow the VPC connection."
    fr: "Une connexion VPC Quick Sight ajoute des interfaces réseau Elastic dans le VPC : Quick Sight peut alors atteindre des sources de données privées, comme un cluster non accessible publiquement. Les groupes de sécurité, les tables de routage et les ACL réseau s'appliquent à ce trafic comme à tout autre trafic du VPC : le groupe de sécurité du cluster doit donc autoriser la connexion VPC."
  options:
    b:
      en: "Making the cluster publicly accessible exposes it to the internet, which the policy forbids."
      fr: "Rendre le cluster accessible publiquement l'expose à Internet, ce que la politique interdit."
    c:
      en: "Nightly unloads show data that can be a day old, which fails the requirement for current data through direct query."
      fr: "Des déchargements nocturnes affichent des données qui peuvent dater d'un jour, ce qui ne respecte pas l'exigence de données à jour en requête directe."
    d:
      en: "IAM permissions authorize the connection but do not give Quick Sight a network path to private subnets."
      fr: "Des autorisations IAM autorisent la connexion mais ne donnent pas à Quick Sight de chemin réseau vers les sous-réseaux privés."
references:
  - title: Configuring VPC connections in AWS Quick Sight
    url: https://docs.aws.amazon.com/quicksight/latest/user/working-with-aws-vpc.html
