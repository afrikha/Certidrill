id: deac01-3b-redshift-qualify-latest
objective: "3.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    The Amazon Redshift table customer_updates stores every change to a customer profile, with the columns customer_id, email, tier and updated_at. A data engineer must create a view that returns, for each customer_id, only the most recent row with its email and tier.

    Which queries will meet this requirement? (Choose two.)
  fr: |
    La table Amazon Redshift customer_updates stocke chaque modification d'un profil client, avec les colonnes customer_id, email, tier et updated_at. Un ingénieur des données doit créer une vue qui renvoie, pour chaque customer_id, uniquement la ligne la plus récente avec son email et son tier.

    Quelles requêtes répondent à cette exigence ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "`SELECT t.customer_id, t.email, t.tier FROM (SELECT cu.*, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY updated_at DESC) AS rn FROM customer_updates cu) t WHERE t.rn = 1`" }
    - { id: b, text: "`SELECT customer_id, email, tier, MAX(updated_at) FROM customer_updates GROUP BY customer_id, email, tier`" }
    - { id: c, text: "`SELECT cu.customer_id, cu.email, cu.tier FROM customer_updates cu QUALIFY ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY updated_at DESC) = 1`" }
    - { id: d, text: "`SELECT DISTINCT customer_id, email, tier FROM customer_updates`" }
    - { id: e, text: "`SELECT customer_id, email, tier FROM customer_updates WHERE ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY updated_at DESC) = 1`" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "ROW_NUMBER numbers the rows of each customer from the newest update, so keeping the rows numbered 1 returns one latest row per customer. The filter can be applied in an outer query, or with the QUALIFY clause, which filters the results of a window function; when QUALIFY follows the FROM clause directly, the table needs an alias, as here."
    fr: "ROW_NUMBER numérote les lignes de chaque client à partir de la mise à jour la plus récente : conserver les lignes numérotées 1 renvoie une dernière ligne par client. Le filtre peut s'appliquer dans une requête externe, ou avec la clause QUALIFY, qui filtre les résultats d'une fonction de fenêtrage ; lorsque QUALIFY suit directement la clause FROM, la table doit avoir un alias, comme ici."
  options:
    b:
      en: "Grouping by email and tier returns one row for every distinct combination a customer ever had, not only the latest one."
      fr: "Regrouper par email et tier renvoie une ligne pour chaque combinaison distincte qu'un client a eue, pas seulement la plus récente."
    d:
      en: "DISTINCT also returns every past combination of email and tier, and it ignores updated_at."
      fr: "DISTINCT renvoie aussi chaque combinaison passée d'email et de tier, et ignore updated_at."
    e:
      en: "Window functions are computed after WHERE, so they cannot be used in a WHERE clause and the query fails."
      fr: "Les fonctions de fenêtrage sont calculées après WHERE : elles ne peuvent pas figurer dans une clause WHERE et la requête échoue."
references:
  - title: QUALIFY clause
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_QUALIFY_clause.html
  - title: Window functions
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_Window_functions.html
