id: deac01-3b-logs-export-task
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external auditor needs a one-time copy of all log events from the first quarter of the year that are stored in an Amazon CloudWatch Logs log group used by AWS Glue jobs. The copy must be delivered as files to an Amazon S3 bucket in the company's account. The log group retains its data for 1 year.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un auditeur externe a besoin d'une copie ponctuelle de tous les événements de journaux du premier trimestre de l'année stockés dans un groupe de journaux Amazon CloudWatch Logs utilisé par des tâches AWS Glue. La copie doit être livrée sous forme de fichiers dans un compartiment Amazon S3 du compte de l'entreprise. Le groupe de journaux conserve ses données pendant 1 an.

    Quelle solution répond à ces exigences avec le MOINS d'efforts possible ?
body:
  options:
    - { id: a, text: { en: "Create a subscription filter on the log group that sends the events to an Amazon Data Firehose stream that delivers to the bucket.", fr: "Créer un filtre d'abonnement sur le groupe de journaux qui envoie les événements à un flux Amazon Data Firehose qui les livre dans le compartiment." } }
    - { id: b, text: { en: "Run CloudWatch Logs Insights queries for each day of the quarter and download the results.", fr: "Exécuter des requêtes CloudWatch Logs Insights pour chaque jour du trimestre et télécharger les résultats." } }
    - { id: c, text: { en: "Create an export task for the log group with the first-quarter time range and the bucket as the destination.", fr: "Créer une tâche d'exportation pour le groupe de journaux avec la plage horaire du premier trimestre et le compartiment comme destination." } }
    - { id: d, text: { en: "Turn on S3 server access logging for the bucket that the Glue jobs read.", fr: "Activer la journalisation des accès au serveur S3 pour le compartiment que lisent les tâches Glue." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A CloudWatch Logs export task copies the log data of a log group for a chosen time range to an S3 bucket, in the same account or another one, with the bucket policy allowing the delivery. It suits a one-time extraction; AWS recommends subscriptions rather than repeated exports for continuous archiving."
    fr: "Une tâche d'exportation CloudWatch Logs copie les données d'un groupe de journaux pour une plage horaire choisie vers un compartiment S3, du même compte ou d'un autre, dont la politique de compartiment autorise la livraison. Elle convient à une extraction ponctuelle ; AWS recommande les abonnements plutôt que des exportations répétées pour l'archivage continu."
  options:
    a:
      en: "A subscription filter streams log events soon after they are ingested; it is for continuous delivery of new events, not a copy of a past quarter."
      fr: "Un filtre d'abonnement diffuse les événements de journaux peu après leur ingestion ; il sert à la livraison continue des nouveaux événements, pas à copier un trimestre passé."
    b:
      en: "Querying and downloading day by day is manual work, and the results are query output rather than the complete log events."
      fr: "Interroger et télécharger jour par jour est un travail manuel, et les résultats sont une sortie de requête plutôt que les événements de journaux complets."
    d:
      en: "Server access logs record requests made to a bucket from now on; they do not contain the Glue job logs."
      fr: "Les journaux d'accès au serveur enregistrent les requêtes faites à un compartiment à partir de maintenant ; ils ne contiennent pas les journaux des tâches Glue."
references:
  - title: Exporting log data to Amazon S3
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/S3Export.html
