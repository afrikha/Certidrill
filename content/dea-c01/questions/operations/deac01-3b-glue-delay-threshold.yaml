id: deac01-3b-glue-delay-threshold
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A nightly AWS Glue job usually finishes in 40 minutes and has a job timeout of 480 minutes. Operators want an email when a run is still running after 90 minutes, so that they can investigate before downstream deadlines are missed. The run must not be stopped.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une tâche AWS Glue nocturne se termine généralement en 40 minutes et a un délai d'expiration de 480 minutes. Les opérateurs veulent recevoir un e-mail lorsqu'une exécution est toujours en cours après 90 minutes, afin d'enquêter avant que les échéances en aval ne soient manquées. L'exécution ne doit pas être arrêtée.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Set the job timeout to 90 minutes and send TIMEOUT events from an Amazon EventBridge rule to an Amazon SNS topic.", fr: "Définir le délai d'expiration de la tâche à 90 minutes et envoyer les événements TIMEOUT d'une règle Amazon EventBridge vers une rubrique Amazon SNS." } }
    - { id: b, text: { en: "Set a job delay notification threshold of 90 minutes and route Glue Job Run Status events to an Amazon SNS topic with EventBridge.", fr: "Définir un seuil de notification de retard de 90 minutes et acheminer les événements Glue Job Run Status vers une rubrique Amazon SNS avec EventBridge." } }
    - { id: c, text: { en: "Schedule an AWS Lambda function 90 minutes after each start that calls GetJobRun and publishes to an Amazon SNS topic if the run is still running.", fr: "Planifier une fonction AWS Lambda 90 minutes après chaque démarrage qui appelle GetJobRun et publie dans une rubrique Amazon SNS si l'exécution est toujours en cours." } }
    - { id: d, text: { en: "Create an Amazon EventBridge rule that matches Glue Job State Change events with the RUNNING state and targets an Amazon SNS topic.", fr: "Créer une règle Amazon EventBridge qui correspond aux événements Glue Job State Change à l'état RUNNING et cible une rubrique Amazon SNS." } }
answer: { optionId: b }
explanation:
  correct:
    en: "When a job delay notification threshold is set, AWS Glue sends Glue Job Run Status events for RUNNING, STARTING and STOPPING runs that exceed the threshold. An EventBridge rule on these events delivers the alert through SNS while the run continues, with no code to maintain."
    fr: "Lorsqu'un seuil de notification de retard est défini, AWS Glue envoie des événements Glue Job Run Status pour les exécutions RUNNING, STARTING et STOPPING qui dépassent ce seuil. Une règle EventBridge sur ces événements transmet l'alerte via SNS pendant que l'exécution continue, sans code à maintenir."
  options:
    a:
      en: "A 90-minute timeout stops the run, which the requirement forbids."
      fr: "Un délai d'expiration de 90 minutes arrête l'exécution, ce que l'exigence interdit."
    d:
      en: "Glue Job State Change events are generated only for SUCCEEDED, FAILED, TIMEOUT and STOPPED, not for RUNNING."
      fr: "Les événements Glue Job State Change ne sont générés que pour SUCCEEDED, FAILED, TIMEOUT et STOPPED, et non pour RUNNING."
    c:
      en: "This works but adds scheduling and custom code to build and maintain, which the built-in threshold avoids."
      fr: "Cette solution fonctionne mais ajoute une planification et du code personnalisé à créer et maintenir, ce qu'évite le seuil intégré."
references:
  - title: Automating AWS Glue with EventBridge
    url: https://docs.aws.amazon.com/glue/latest/dg/automating-awsglue-with-cloudwatch-events.html
