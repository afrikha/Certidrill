id: deac01-3b-emr-serverless-preinit
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data team uses an Amazon EMR Serverless Spark application for interactive analyses that users submit from an internal web application. Users complain that each job waits for workers to be provisioned before it starts. The team wants jobs to start within seconds during business hours without moving to a cluster that it must manage.

    Which solution will meet these requirements?
  fr: |
    Une équipe de données utilise une application Spark Amazon EMR Serverless pour des analyses interactives que les utilisateurs soumettent depuis une application web interne. Les utilisateurs se plaignent que chaque tâche attend le provisionnement des nœuds de calcul (workers) avant de démarrer. L'équipe veut que les tâches démarrent en quelques secondes pendant les heures de bureau sans passer à un cluster qu'elle devrait gérer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the maximum capacity of the application so that it can request more workers.", fr: "Augmenter la capacité maximale de l'application afin qu'elle puisse demander davantage de nœuds de calcul." } }
    - { id: b, text: { en: "Move the analyses to a long-running Amazon EMR cluster on Amazon EC2 that stays up during business hours.", fr: "Déplacer les analyses vers un cluster Amazon EMR permanent sur Amazon EC2 qui reste actif pendant les heures de bureau." } }
    - { id: c, text: { en: "Configure pre-initialized capacity for the application with the initial-capacity parameter.", fr: "Configurer une capacité pré-initialisée pour l'application avec le paramètre initial-capacity." } }
    - { id: d, text: { en: "Rewrite the analyses as AWS Glue jobs that use the Flex execution class.", fr: "Réécrire les analyses sous forme de tâches AWS Glue qui utilisent la classe d'exécution Flex." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Pre-initialized capacity keeps workers initialized and ready to respond in seconds, so jobs start immediately, which suits interactive and time-sensitive work. The tradeoff is that the initialized workers are paid for while they are kept ready, but the team still manages no cluster."
    fr: "La capacité pré-initialisée garde des nœuds de calcul initialisés et prêts à répondre en quelques secondes : les tâches démarrent immédiatement, ce qui convient au travail interactif et urgent. La contrepartie est que les nœuds initialisés sont payés tant qu'ils restent prêts, mais l'équipe ne gère toujours aucun cluster."
  options:
    a:
      en: "Maximum capacity limits how far the application can scale; it does not remove the provisioning wait at job start."
      fr: "La capacité maximale limite la mise à l'échelle de l'application ; elle ne supprime pas l'attente de provisionnement au démarrage des tâches."
    b:
      en: "A long-running EMR cluster on EC2 is a cluster that the team must manage."
      fr: "Un cluster EMR permanent sur EC2 est un cluster que l'équipe doit gérer."
    d:
      en: "Flex runs on spare capacity for non-urgent jobs, so start times can be longer, not shorter."
      fr: "Flex s'exécute sur de la capacité inutilisée pour des tâches non urgentes : les délais de démarrage peuvent être plus longs, pas plus courts."
references:
  - title: What is Amazon EMR Serverless?
    url: https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/emr-serverless.html
