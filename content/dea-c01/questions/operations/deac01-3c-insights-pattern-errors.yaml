id: deac01-3c-insights-pattern-errors
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After a release, the log group of a data ingestion service in the Standard log class contains tens of thousands of ERROR events. Each message includes variable values such as file names, request IDs and row numbers, so almost no two messages are identical. During the incident, an engineer needs to see the few recurring kinds of error and how often each one occurs, without writing parsing rules.

    Which CloudWatch Logs Insights query will meet this requirement?
  fr: |
    Après une mise en production, le groupe de journaux d'un service d'ingestion de données, dans la classe Standard, contient des dizaines de milliers d'événements ERROR. Chaque message inclut des valeurs variables comme des noms de fichiers, des ID de requête et des numéros de ligne, si bien que presque aucun message n'est identique à un autre. Pendant l'incident, un ingénieur doit voir les quelques types d'erreur récurrents et la fréquence de chacun, sans écrire de règles d'analyse.

    Quelle requête CloudWatch Logs Insights répond à cette exigence ?
body:
  options:
    - { id: a, text: '`filter @message like /ERROR/ | stats count(*) by @message`' }
    - { id: b, text: '`filter @message like /ERROR/ | dedup @message`' }
    - { id: c, text: '`filter @message like /ERROR/ | sort @timestamp desc | limit 100`' }
    - { id: d, text: '`filter @message like /ERROR/ | pattern @message`' }
answer: { optionId: d }
explanation:
  correct:
    en: "The pattern command automatically clusters log events into recurring text structures and replaces variable parts such as request IDs with tokens. Its output includes @sampleCount and @ratio for each pattern, which shows how often each kind of error occurs."
    fr: "La commande pattern regroupe automatiquement les événements de journal en structures de texte récurrentes et remplace les parties variables, comme les ID de requête, par des jetons. Sa sortie inclut @sampleCount et @ratio pour chaque modèle, ce qui montre la fréquence de chaque type d'erreur."
  options:
    a:
      en: "Because each message contains different variable values, grouping by the full message returns almost one row per event."
      fr: "Comme chaque message contient des valeurs variables différentes, un regroupement sur le message complet renvoie presque une ligne par événement."
    b:
      en: "dedup removes only identical messages, which barely exist here, and gives no count per kind of error."
      fr: "dedup ne supprime que les messages identiques, presque inexistants ici, et ne donne aucun décompte par type d'erreur."
    c:
      en: "This shows the 100 latest events one by one, not the recurring kinds of error and their frequency."
      fr: "Cette requête affiche un par un les 100 derniers événements, pas les types d'erreur récurrents et leur fréquence."
references:
  - title: pattern
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-Pattern.html
