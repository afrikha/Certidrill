id: deac01-3a-sdk-athena-token-params
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An internal web service calls Amazon Athena through the AWS SDK to run a lookup query that filters on a customer ID typed by users. When a call times out on the network, the service repeats the StartQueryExecution request, and the repeated request must not start a second query. The security team also requires that the user input can never change the structure of the SQL statement.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Un service web interne appelle Amazon Athena par le kit AWS SDK pour exécuter une requête de recherche qui filtre sur un ID client saisi par les utilisateurs. Lorsqu'un appel expire sur le réseau, le service répète la requête StartQueryExecution, et la requête répétée ne doit pas démarrer une seconde requête. L'équipe de sécurité exige aussi que la saisie de l'utilisateur ne puisse jamais modifier la structure de l'instruction SQL.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Generate a ClientRequestToken for each lookup and send the same token when the service repeats the StartQueryExecution request.", fr: "Générer un ClientRequestToken pour chaque recherche et envoyer le même jeton lorsque le service répète la requête StartQueryExecution." } }
    - { id: b, text: { en: "Run each repeated request in a different Athena workgroup so that only one of the queries writes results.", fr: "Exécuter chaque requête répétée dans un groupe de travail Athena différent pour qu'une seule des requêtes écrive des résultats." } }
    - { id: c, text: { en: "Write the query with a ? placeholder for the customer ID and pass the value in the ExecutionParameters list.", fr: "Écrire la requête avec un espace réservé ? pour l'ID client et transmettre la valeur dans la liste ExecutionParameters." } }
    - { id: d, text: { en: "Insert the customer ID into the query string with Python string formatting after checking its length.", fr: "Insérer l'ID client dans la chaîne de requête par formatage de chaîne Python après avoir vérifié sa longueur." } }
    - { id: e, text: { en: "Call StopQueryExecution on every query that is still running before the service repeats a request.", fr: "Appeler StopQueryExecution sur chaque requête encore en cours avant que le service répète une requête." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "ClientRequestToken makes StartQueryExecution idempotent: a repeated request with the same token returns the same QueryExecutionId instead of creating a new query. ExecutionParameters fill the query's parameters in order, so the customer ID is passed as a value and cannot alter the SQL text."
    fr: "ClientRequestToken rend StartQueryExecution idempotent : une requête répétée avec le même jeton renvoie le même QueryExecutionId au lieu de créer une nouvelle requête. ExecutionParameters remplit les paramètres de la requête dans l'ordre : l'ID client est transmis comme une valeur et ne peut pas modifier le texte SQL."
  options:
    b:
      en: "Each workgroup would run its own query, so the repeated request still starts a second query."
      fr: "Chaque groupe de travail exécuterait sa propre requête : la requête répétée démarre quand même une seconde requête."
    d:
      en: "String formatting concatenates user input into the SQL text; a length check does not stop injected SQL."
      fr: "Le formatage de chaîne concatène la saisie utilisateur au texte SQL ; un contrôle de longueur n'empêche pas l'injection SQL."
    e:
      en: "Stopping queries cancels work and can cancel the lookup that the user is waiting for; it does not make the request idempotent."
      fr: "Arrêter les requêtes annule du travail, y compris éventuellement la recherche attendue par l'utilisateur ; cela ne rend pas la requête idempotente."
references:
  - title: StartQueryExecution
    url: https://docs.aws.amazon.com/athena/latest/APIReference/API_StartQueryExecution.html
