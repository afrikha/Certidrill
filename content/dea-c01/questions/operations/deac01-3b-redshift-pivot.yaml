id: deac01-3b-redshift-pivot
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Amazon Redshift table quarterly_sales has the columns region, quarter (values 'Q1' to 'Q4') and amount, with many rows for each region and quarter. A report needs one row per region and one column per quarter that contains the total amount.

    Which query will meet this requirement?
  fr: |
    La table Amazon Redshift quarterly_sales contient les colonnes region, quarter (valeurs 'Q1' à 'Q4') et amount, avec de nombreuses lignes pour chaque région et chaque trimestre. Un rapport a besoin d'une ligne par région et d'une colonne par trimestre contenant le montant total.

    Quelle requête répond à cette exigence ?
body:
  options:
    - { id: a, text: "`SELECT region, quarter, SUM(amount) FROM quarterly_sales GROUP BY region, quarter`" }
    - { id: b, text: "`SELECT * FROM (SELECT region, quarter, amount FROM quarterly_sales) PIVOT (SUM(amount) FOR quarter IN (SELECT DISTINCT quarter FROM quarterly_sales))`" }
    - { id: c, text: "`SELECT * FROM (SELECT region, quarter, amount FROM quarterly_sales) UNPIVOT (amount FOR quarter IN (Q1, Q2, Q3, Q4))`" }
    - { id: d, text: "`SELECT * FROM (SELECT region, quarter, amount FROM quarterly_sales) PIVOT (SUM(amount) FOR quarter IN ('Q1', 'Q2', 'Q3', 'Q4'))`" }
answer: { optionId: d }
explanation:
  correct:
    en: "PIVOT rotates rows into columns: it aggregates amount with SUM for each value listed in the IN list and groups by the remaining column, region. The result has one row per region with the columns Q1 to Q4."
    fr: "PIVOT fait pivoter les lignes en colonnes : il agrège amount avec SUM pour chaque valeur de la liste IN et regroupe selon la colonne restante, region. Le résultat comporte une ligne par région avec les colonnes Q1 à Q4."
  options:
    a:
      en: "GROUP BY returns one row per region and quarter, not one column per quarter."
      fr: "GROUP BY renvoie une ligne par région et par trimestre, et non une colonne par trimestre."
    b:
      en: "The values of a PIVOT IN list cannot be column references or subqueries, so this query fails."
      fr: "Les valeurs d'une liste IN de PIVOT ne peuvent être ni des références de colonnes ni des sous-requêtes : cette requête échoue."
    c:
      en: "UNPIVOT rotates columns into rows, the opposite of what the report needs."
      fr: "UNPIVOT fait pivoter des colonnes en lignes, l'inverse de ce dont le rapport a besoin."
references:
  - title: PIVOT and UNPIVOT examples
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_FROM_clause-pivot-unpivot-examples.html
