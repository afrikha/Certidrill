id: deac01-3c-emr-serverless-cwl-config
objective: "3.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs Apache Spark jobs on Amazon EMR Serverless. The operations team wants the stdout and stderr logs of both the Spark driver and the Spark executors of every job run in a CloudWatch Logs log group named /anycompany/emr-spark, so that it can use Logs Insights and Live Tail. The default EMR managed storage of logs must stay enabled so that the Spark UI keeps working from the console.

    Which monitoringConfiguration should the data engineer pass when starting the job runs?
  fr: |
    AnyCompany exécute des tâches Apache Spark sur Amazon EMR Serverless. L'équipe des opérations souhaite que les journaux stdout et stderr du pilote Spark et des exécuteurs Spark de chaque exécution de tâche se trouvent dans un groupe de journaux CloudWatch Logs nommé /anycompany/emr-spark, afin d'utiliser Logs Insights et Live Tail. Le stockage géré des journaux par défaut d'EMR doit rester activé pour que Spark UI continue de fonctionner depuis la console.

    Quelle monitoringConfiguration l'ingénieur des données doit-il transmettre au démarrage des exécutions de tâches ?
body:
  options:
    - { id: a, text: '`{"cloudWatchLoggingConfiguration": {"enabled": true, "logGroupName": "/anycompany/emr-spark"}}`' }
    - { id: b, text: '`{"cloudWatchLoggingConfiguration": {"enabled": true, "logGroupName": "/anycompany/emr-spark", "logTypes": {"SPARK_DRIVER": ["STDOUT", "STDERR"], "SPARK_EXECUTOR": ["STDOUT", "STDERR"]}}}`' }
    - { id: c, text: '`{"s3MonitoringConfiguration": {"logUri": "s3://anycompany-logs/emr-spark/"}, "managedPersistenceMonitoringConfiguration": {"enabled": false}}`' }
    - { id: d, text: '`{"cloudWatchLoggingConfiguration": {"enabled": true, "logGroupName": "/anycompany/emr-spark"}, "managedPersistenceMonitoringConfiguration": {"enabled": false}}`' }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch logging is disabled by default for EMR Serverless and is turned on with cloudWatchLoggingConfiguration. By default only the driver stdout and stderr logs are published, so logTypes must also list SPARK_EXECUTOR; managed storage stays enabled because it is not turned off."
    fr: "La journalisation CloudWatch est désactivée par défaut pour EMR Serverless et s'active avec cloudWatchLoggingConfiguration. Par défaut, seuls les journaux stdout et stderr du pilote sont publiés : logTypes doit donc aussi lister SPARK_EXECUTOR ; le stockage géré reste activé puisqu'il n'est pas désactivé."
  options:
    a:
      en: "Without logTypes, EMR Serverless publishes only the driver logs to CloudWatch, so the executor logs would be missing."
      fr: "Sans logTypes, EMR Serverless ne publie que les journaux du pilote dans CloudWatch : les journaux des exécuteurs manqueraient."
    c:
      en: "This sends logs to S3 instead of CloudWatch Logs and turns off managed storage, which disables the Spark UI in the console."
      fr: "Cette configuration envoie les journaux vers S3 au lieu de CloudWatch Logs et désactive le stockage géré, ce qui désactive Spark UI dans la console."
    d:
      en: "This publishes only driver logs and disables managed storage, which breaks the Spark UI requirement."
      fr: "Cette configuration ne publie que les journaux du pilote et désactive le stockage géré, ce qui enfreint l'exigence relative à Spark UI."
references:
  - title: Storing logs
    url: https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/logging.html
