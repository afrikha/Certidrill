id: deac01-3a-sfn-redrive-failed
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Step Functions Standard workflow runs six AWS Glue jobs in sequence. Two hours ago, an execution failed at the fifth job because the job role was missing a permission on an Amazon S3 prefix. The permission has been fixed. The first four jobs took 3 hours and must not run again, and the remaining jobs must use the same execution input.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un flux de travail Standard AWS Step Functions exécute six tâches AWS Glue en séquence. Il y a deux heures, une exécution a échoué à la cinquième tâche parce qu'il manquait au rôle de la tâche une autorisation sur un préfixe Amazon S3. L'autorisation a été corrigée. Les quatre premières tâches ont duré 3 heures et ne doivent pas être relancées, et les tâches restantes doivent utiliser la même entrée d'exécution.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Start a new execution of the state machine with the same input as the failed execution.", fr: "Démarrer une nouvelle exécution de la machine d'état avec la même entrée que l'exécution en échec." } }
    - { id: b, text: { en: "Edit the state machine definition so that StartAt points to the fifth job, and start a new execution with the same input.", fr: "Modifier la définition de la machine d'état pour que StartAt pointe vers la cinquième tâche, et démarrer une nouvelle exécution avec la même entrée." } }
    - { id: c, text: { en: "Copy the last two states into a new Express workflow and start it with the output of the fourth job.", fr: "Copier les deux derniers états dans un nouveau flux de travail Express et le démarrer avec la sortie de la quatrième tâche." } }
    - { id: d, text: { en: "Redrive the failed execution so that it restarts from the failed state.", fr: "Relancer (redrive) l'exécution en échec pour qu'elle redémarre à partir de l'état en échec." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Redrive restarts a failed, aborted, or timed-out Standard execution from the step that failed, with the same input and execution ARN. Successful steps are not run again, and the execution is eligible because it ended less than 14 days ago."
    fr: "Le redrive redémarre une exécution Standard en échec, abandonnée ou expirée à partir de l'étape qui a échoué, avec la même entrée et le même ARN d'exécution. Les étapes réussies ne sont pas réexécutées, et l'exécution est éligible car elle s'est terminée il y a moins de 14 jours."
  options:
    a:
      en: "A new execution runs all six jobs again, including the four 3-hour jobs that must not run again."
      fr: "Une nouvelle exécution relance les six tâches, y compris les quatre tâches de 3 heures qui ne doivent pas être relancées."
    b:
      en: "Changing the definition and restoring it afterward is error-prone manual work that redrive avoids."
      fr: "Modifier la définition puis la rétablir est un travail manuel source d'erreurs que le redrive évite."
    c:
      en: "Express workflows last at most five minutes and do not support .sync Glue tasks, and this requires building a new workflow."
      fr: "Les flux de travail Express durent cinq minutes au maximum et ne prennent pas en charge les tâches Glue .sync, et cette option impose de créer un nouveau flux de travail."
references:
  - title: Restarting state machine executions with redrive in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/redrive-executions.html
