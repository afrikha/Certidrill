id: deac01-3a-mwaa-enable-task-logs
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A task in an Amazon MWAA DAG fails intermittently. A data engineer opens Amazon CloudWatch Logs to read the task output, but no log group exists for the task logs of the environment. The engineer needs the task logs of future runs for troubleshooting.

    Which solution will meet this requirement?
  fr: |
    Une tâche d'un DAG Amazon MWAA échoue par intermittence. Un ingénieur data ouvre Amazon CloudWatch Logs pour lire la sortie de la tâche, mais aucun groupe de journaux n'existe pour les journaux de tâches de l'environnement. L'ingénieur a besoin des journaux de tâches des prochaines exécutions pour le dépannage.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Package the CloudWatch agent in plugins.zip so that it runs on the workers and sends the task logs.", fr: "Inclure l'agent CloudWatch dans plugins.zip pour qu'il s'exécute sur les workers et envoie les journaux de tâches." } }
    - { id: b, text: { en: "Edit the environment, enable the Airflow task logs in the Monitoring section, and choose a log level such as INFO.", fr: "Modifier l'environnement, activer les journaux de tâches Airflow dans la section Monitoring et choisir un niveau de journalisation tel que INFO." } }
    - { id: c, text: { en: "Create an AWS CloudTrail trail that logs data events for the S3 bucket of the environment.", fr: "Créer un journal de suivi AWS CloudTrail qui journalise les événements de données du compartiment S3 de l'environnement." } }
    - { id: d, text: { en: "Turn on VPC Flow Logs for the subnets of the environment and query them with Athena.", fr: "Activer les journaux de flux VPC pour les sous-réseaux de l'environnement et les interroger avec Athena." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon MWAA can publish five Airflow log types (DAG processing, scheduler, task, web server, worker) to CloudWatch Logs, but each type must be enabled on the environment with a log level. Task logs then go to a log group named `airflow-YourEnvironmentName-Task`."
    fr: "Amazon MWAA peut publier cinq types de journaux Airflow (traitement des DAG, planificateur, tâche, serveur web, worker) dans CloudWatch Logs, mais chaque type doit être activé sur l'environnement avec un niveau de journalisation. Les journaux de tâches sont alors envoyés dans un groupe de journaux nommé `airflow-YourEnvironmentName-Task`."
  options:
    a:
      en: "The MWAA log integration is a setting of the environment; no agent needs to be installed through plugins."
      fr: "L'intégration des journaux MWAA est un paramètre de l'environnement ; aucun agent n'a besoin d'être installé par des plugins."
    c:
      en: "CloudTrail data events record S3 API calls on the bucket, not the output of Airflow tasks."
      fr: "Les événements de données CloudTrail enregistrent les appels d'API S3 sur le compartiment, pas la sortie des tâches Airflow."
    d:
      en: "Flow logs describe IP traffic in the VPC and contain no application output."
      fr: "Les journaux de flux décrivent le trafic IP du VPC et ne contiennent aucune sortie d'application."
references:
  - title: Accessing Airflow logs in Amazon CloudWatch
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/monitoring-airflow.html
