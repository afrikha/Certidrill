id: deac01-3c-trail-selector-raw-prefix
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores its data lake in an Amazon S3 bucket named anycompany-lake with the prefixes raw/, curated/ and tmp/. A compliance rule requires an AWS CloudTrail record of every object upload and deletion under raw/. Read requests are very frequent across the bucket and must not be logged. The existing trail logs only management events, and data event charges must be kept as low as possible.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke son lac de données dans un compartiment Amazon S3 nommé anycompany-lake, avec les préfixes raw/, curated/ et tmp/. Une règle de conformité exige un enregistrement AWS CloudTrail de chaque chargement et de chaque suppression d'objet sous raw/. Les requêtes de lecture sont très fréquentes dans tout le compartiment et ne doivent pas être journalisées. Le journal de suivi existant ne consigne que les événements de gestion, et les frais liés aux événements de données doivent rester aussi bas que possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an advanced event selector with resources.type equal to AWS::S3::Object, resources.ARN starting with arn:aws:s3:::anycompany-lake/raw/, and readOnly equal to false.", fr: "Ajouter un sélecteur d'événements avancé avec resources.type égal à AWS::S3::Object, resources.ARN commençant par arn:aws:s3:::anycompany-lake/raw/ et readOnly égal à false." } }
    - { id: b, text: { en: "Add an advanced event selector with resources.type equal to AWS::S3::Object and resources.ARN starting with arn:aws:s3:::anycompany-lake/, without a readOnly field.", fr: "Ajouter un sélecteur d'événements avancé avec resources.type égal à AWS::S3::Object et resources.ARN commençant par arn:aws:s3:::anycompany-lake/, sans champ readOnly." } }
    - { id: c, text: { en: "Add an advanced event selector with resources.type equal to AWS::S3::Object, resources.ARN starting with arn:aws:s3:::anycompany-lake/raw/, and readOnly equal to true.", fr: "Ajouter un sélecteur d'événements avancé avec resources.type égal à AWS::S3::Object, resources.ARN commençant par arn:aws:s3:::anycompany-lake/raw/ et readOnly égal à true." } }
    - { id: d, text: { en: "Keep the management event selector, and enable CloudTrail Insights on the trail to capture the object-level write activity under raw/.", fr: "Conserver le sélecteur d'événements de gestion et activer CloudTrail Insights sur le journal de suivi pour capturer l'activité d'écriture au niveau des objets sous raw/." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Trails do not log data events by default, and data events are charged. An advanced event selector can match the object ARN prefix with StartsWith and keep only write events with readOnly set to false, so PutObject and DeleteObject calls under raw/ are logged while reads and the other prefixes are not."
    fr: "Les journaux de suivi ne consignent pas les événements de données par défaut, et ceux-ci sont facturés. Un sélecteur d'événements avancé peut faire correspondre le préfixe de l'ARN des objets avec StartsWith et ne garder que les événements d'écriture avec readOnly défini sur false : les appels PutObject et DeleteObject sous raw/ sont consignés, mais pas les lectures ni les autres préfixes."
  options:
    b:
      en: "Without a readOnly field, the selector logs both reads and writes for the whole bucket, which adds the frequent read requests to the bill."
      fr: "Sans champ readOnly, le sélecteur consigne les lectures et les écritures de tout le compartiment, ce qui ajoute les nombreuses requêtes de lecture à la facture."
    c:
      en: "readOnly equal to true keeps only read events such as GetObject, which is the opposite of the requirement."
      fr: "readOnly égal à true ne conserve que les événements de lecture comme GetObject, soit l'inverse de l'exigence."
    d:
      en: "Insights events flag unusual API call or error rates; they do not record each object upload or deletion."
      fr: "Les événements Insights signalent des taux inhabituels d'appels ou d'erreurs d'API ; ils n'enregistrent pas chaque chargement ou suppression d'objet."
references:
  - title: Logging data events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
