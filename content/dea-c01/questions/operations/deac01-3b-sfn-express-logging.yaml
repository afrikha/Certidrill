id: deac01-3b-sfn-express-logging
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a high-volume AWS Step Functions Express workflow that calls AWS Lambda functions to validate incoming data. For traceability, auditors need, for every execution, the sequence of state transitions and the input and output of each state. The state machine was created with AWS CloudFormation and has no logging configuration.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un flux de travail AWS Step Functions Express à fort volume qui appelle des fonctions AWS Lambda pour valider les données entrantes. Pour la traçabilité, les auditeurs ont besoin, pour chaque exécution, de la séquence des transitions d'état ainsi que de l'entrée et de la sortie de chaque état. La machine d'état a été créée avec AWS CloudFormation et n'a aucune configuration de journalisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Review each execution in the execution history of the Step Functions console.", fr: "Examiner chaque exécution dans l'historique des exécutions de la console Step Functions." } }
    - { id: b, text: { en: "Configure logging to a CloudWatch Logs log group with the log level set to ERROR and includeExecutionData set to true.", fr: "Configurer la journalisation vers un groupe de journaux CloudWatch Logs avec le niveau de journalisation ERROR et includeExecutionData défini sur true." } }
    - { id: c, text: { en: "Query the StartExecution events of the state machine in a CloudTrail trail.", fr: "Interroger les événements StartExecution de la machine d'état dans un journal de suivi CloudTrail." } }
    - { id: d, text: { en: "Configure logging to a CloudWatch Logs log group with the log level set to ALL and includeExecutionData set to true.", fr: "Configurer la journalisation vers un groupe de journaux CloudWatch Logs avec le niveau de journalisation ALL et includeExecutionData défini sur true." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Express workflows do not record execution history in Step Functions, so their history is available only through logging to CloudWatch Logs. The ALL level logs every event type, including each state transition, and includeExecutionData adds the input and output data to the log events."
    fr: "Les flux de travail Express n'enregistrent pas d'historique d'exécution dans Step Functions : leur historique n'est disponible que via la journalisation dans CloudWatch Logs. Le niveau ALL journalise tous les types d'événements, dont chaque transition d'état, et includeExecutionData ajoute les données d'entrée et de sortie aux événements de journaux."
  options:
    a:
      en: "Unlike Standard workflows, Express workflows keep no execution history in the Step Functions console."
      fr: "Contrairement aux flux de travail Standard, les flux de travail Express ne conservent aucun historique d'exécution dans la console Step Functions."
    b:
      en: "The ERROR level logs only failure events, so successful state transitions are missing."
      fr: "Le niveau ERROR ne journalise que les événements d'échec : les transitions d'état réussies manquent."
    c:
      en: "CloudTrail records the API call that starts an execution, not the state transitions and data inside it."
      fr: "CloudTrail enregistre l'appel d'API qui démarre une exécution, et non les transitions d'état et les données qu'elle contient."
references:
  - title: Using CloudWatch Logs to log execution history in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/cw-logs.html
