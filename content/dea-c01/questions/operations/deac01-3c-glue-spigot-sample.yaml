id: deac01-3c-glue-spigot-sample
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue ETL job processes 2 billion records each night. After an ApplyMapping step, the data engineer wants to verify the transformation in production by writing a random sample of about 0.1% of the intermediate records to Amazon S3, without writing the full intermediate dataset. The intermediate result is a DynamicFrame named mapped.

    Which code should the data engineer add to the job?
  fr: |
    Une tâche ETL AWS Glue traite 2 milliards d'enregistrements chaque nuit. Après une étape ApplyMapping, l'ingénieur des données veut vérifier la transformation en production en écrivant dans Amazon S3 un échantillon aléatoire d'environ 0,1 % des enregistrements intermédiaires, sans écrire l'ensemble des données intermédiaires. Le résultat intermédiaire est un DynamicFrame nommé mapped.

    Quel code l'ingénieur des données doit-il ajouter à la tâche ?
body:
  options:
    - { id: a, text: '`mapped.spigot("s3://anycompany-debug/mapped/", options={"topk": 0.001})`' }
    - { id: b, text: '`mapped.spigot("s3://anycompany-debug/mapped/", options={"prob": 0.001})`' }
    - { id: c, text: '`glueContext.write_dynamic_frame.from_options(frame=mapped, connection_type="s3", connection_options={"path": "s3://anycompany-debug/mapped/"}, format="json")`' }
    - { id: d, text: '`mapped.spigot("s3://anycompany-debug/mapped/", options={"topk": 2000000})`' }
answer: { optionId: b }
explanation:
  correct:
    en: "spigot writes sample records to a destination to help verify the transformations of a job. The prob option sets the probability of picking any given record, so 0.001 writes a random sample of about 0.1% of the records."
    fr: "spigot écrit des enregistrements d'échantillon vers une destination pour aider à vérifier les transformations d'une tâche. L'option prob fixe la probabilité de choisir chaque enregistrement : 0.001 écrit un échantillon aléatoire d'environ 0,1 % des enregistrements."
  options:
    a:
      en: "topk is the number of first records to write, not a fraction, so this value does not express 0.1%."
      fr: "topk est le nombre de premiers enregistrements à écrire, pas une fraction : cette valeur n'exprime pas 0,1 %."
    c:
      en: "This writes the full intermediate dataset, which the engineer wants to avoid."
      fr: "Ce code écrit l'ensemble des données intermédiaires, ce que l'ingénieur veut éviter."
    d:
      en: "topk writes the first k records, which is not a random sample and depends on the order of the data."
      fr: "topk écrit les k premiers enregistrements, ce qui n'est pas un échantillon aléatoire et dépend de l'ordre des données."
references:
  - title: DynamicFrame class
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-crawler-pyspark-extensions-dynamic-frame.html
  - title: Spigot class
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-crawler-pyspark-transforms-spigot.html
