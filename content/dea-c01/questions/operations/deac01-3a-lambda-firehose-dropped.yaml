id: deac01-3a-lambda-firehose-dropped
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Data Firehose stream delivers JSON device events to Amazon S3 and uses an AWS Lambda function for data transformation. Records whose type field is heartbeat must not be delivered to the destination, and they must not be counted as transformation failures. All other records are reformatted and delivered.

    How should the function return each heartbeat record?
  fr: |
    Un flux Amazon Data Firehose livre des événements JSON d'appareils dans Amazon S3 et utilise une fonction AWS Lambda pour la transformation des données. Les enregistrements dont le champ type vaut heartbeat ne doivent pas être livrés à la destination et ne doivent pas être comptés comme des échecs de transformation. Tous les autres enregistrements sont reformatés et livrés.

    Comment la fonction doit-elle renvoyer chaque enregistrement heartbeat ?
body:
  options:
    - { id: a, text: { en: "Return the original recordId with the result Dropped.", fr: "Renvoyer le recordId d'origine avec le résultat Dropped." } }
    - { id: b, text: { en: "Return the original recordId with the result ProcessingFailed.", fr: "Renvoyer le recordId d'origine avec le résultat ProcessingFailed." } }
    - { id: c, text: { en: "Leave the record out of the response so that Firehose ignores it.", fr: "Omettre l'enregistrement de la réponse pour que Firehose l'ignore." } }
    - { id: d, text: { en: "Return a new recordId with the result Ok and an empty data field.", fr: "Renvoyer un nouveau recordId avec le résultat Ok et un champ data vide." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Each returned record must contain the recordId that Firehose sent, a result, and the base64-encoded data. The result Dropped means the processing logic intentionally dropped the record, and Firehose treats Ok and Dropped records as successfully processed."
    fr: "Chaque enregistrement renvoyé doit contenir le recordId envoyé par Firehose, un result et les données encodées en base64. Le résultat Dropped signifie que la logique de traitement a volontairement écarté l'enregistrement, et Firehose considère les enregistrements Ok et Dropped comme traités avec succès."
  options:
    b:
      en: "ProcessingFailed marks the record as a transformation failure, which the requirement excludes."
      fr: "ProcessingFailed marque l'enregistrement comme un échec de transformation, ce que l'exigence exclut."
    c:
      en: "Firehose expects a result for each recordId it sent; only records returned as Ok or Dropped count as successfully processed."
      fr: "Firehose attend un résultat pour chaque recordId envoyé ; seuls les enregistrements renvoyés avec Ok ou Dropped sont considérés comme traités avec succès."
    d:
      en: "A recordId that does not match the input is treated as a transformation failure, and Ok means the record is delivered."
      fr: "Un recordId qui ne correspond pas à l'entrée est traité comme un échec de transformation, et Ok signifie que l'enregistrement est livré."
references:
  - title: Required parameters for data transformation
    url: https://docs.aws.amazon.com/firehose/latest/dev/data-transformation-status-model.html
  - title: Transform source data in Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/data-transformation.html
