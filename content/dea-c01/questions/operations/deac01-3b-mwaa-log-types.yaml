id: deac01-3b-mwaa-log-types
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company orchestrates its pipelines with Amazon Managed Workflows for Apache Airflow (Amazon MWAA). For traceability, the operations team must be able to review in CloudWatch Logs the logs that each DAG task writes during its runs and the errors raised when DAG files are parsed. To limit cost, no log events below the WARNING level may be sent.

    Which steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise orchestre ses pipelines avec Amazon Managed Workflows for Apache Airflow (Amazon MWAA). Pour la traçabilité, l'équipe d'exploitation doit pouvoir examiner dans CloudWatch Logs les journaux que chaque tâche de DAG écrit pendant ses exécutions et les erreurs levées lors de l'analyse des fichiers de DAG. Pour limiter les coûts, aucun événement de journal de niveau inférieur à WARNING ne doit être envoyé.

    Quelles étapes répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Airflow task logs at the WARNING level.", fr: "Activer les journaux de tâches Airflow au niveau WARNING." } }
    - { id: b, text: { en: "Enable Airflow web server logs at the INFO level.", fr: "Activer les journaux du serveur web Airflow au niveau INFO." } }
    - { id: c, text: { en: "Enable Airflow DAG processing logs at the WARNING level.", fr: "Activer les journaux de traitement des DAG Airflow au niveau WARNING." } }
    - { id: d, text: { en: "Enable Airflow worker logs at the DEBUG level.", fr: "Activer les journaux des workers Airflow au niveau DEBUG." } }
    - { id: e, text: { en: "Turn on CloudTrail data events for the S3 bucket that stores the DAG files.", fr: "Activer les événements de données CloudTrail pour le compartiment S3 qui stocke les fichiers de DAG." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Amazon MWAA creates a log group for each Airflow log type that is enabled: task logs hold what each DAG task writes, and DAG processing logs come from the part of the scheduler that processes DAG files. At the WARNING level, MWAA sends WARNING, ERROR and CRITICAL events only."
    fr: "Amazon MWAA crée un groupe de journaux pour chaque type de journal Airflow activé : les journaux de tâches contiennent ce qu'écrit chaque tâche de DAG, et les journaux de traitement des DAG proviennent de la partie du planificateur qui traite les fichiers de DAG. Au niveau WARNING, MWAA n'envoie que les événements WARNING, ERROR et CRITICAL."
  options:
    b:
      en: "Web server logs cover the Airflow web interface, and the INFO level sends events below WARNING."
      fr: "Les journaux du serveur web concernent l'interface web d'Airflow, et le niveau INFO envoie des événements inférieurs à WARNING."
    d:
      en: "MWAA log levels are INFO, WARNING, ERROR and CRITICAL; DEBUG is not one of them and would break the cost rule anyway."
      fr: "Les niveaux de journalisation MWAA sont INFO, WARNING, ERROR et CRITICAL ; DEBUG n'en fait pas partie et enfreindrait de toute façon la règle de coût."
    e:
      en: "Data events record access to the DAG files in Amazon S3, not task output or parsing errors."
      fr: "Les événements de données enregistrent les accès aux fichiers de DAG dans Amazon S3, et non la sortie des tâches ou les erreurs d'analyse."
references:
  - title: Accessing Airflow logs in Amazon CloudWatch
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/monitoring-airflow.html
