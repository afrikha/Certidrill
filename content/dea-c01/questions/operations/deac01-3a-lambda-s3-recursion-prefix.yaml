id: deac01-3a-lambda-s3-recursion-prefix
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lambda function is invoked by S3 event notifications for all object creations in the bucket example-ingest. The function parses each new file and writes the result to the same bucket under the processed/ prefix. After deployment, invocations and costs grow quickly until Lambda stops the invocation chain and sends a recursive loop notification. The company must keep a single bucket and continue to process every uploaded file.

    Which solution will meet these requirements?
  fr: |
    Une fonction Lambda est appelée par des notifications d'événement S3 pour toutes les créations d'objets dans le compartiment example-ingest. La fonction analyse chaque nouveau fichier et écrit le résultat dans le même compartiment sous le préfixe processed/. Après le déploiement, les appels et les coûts augmentent rapidement jusqu'à ce que Lambda arrête la chaîne d'appels et envoie une notification de boucle récursive. L'entreprise doit conserver un seul compartiment et continuer à traiter chaque fichier chargé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the reserved concurrency of the function to 0 so that Lambda cannot run the loop again.", fr: "Définir la simultanéité réservée de la fonction sur 0 pour que Lambda ne puisse plus exécuter la boucle." } }
    - { id: b, text: { en: "Turn on S3 Versioning on the bucket so that the processed objects are stored as new versions.", fr: "Activer S3 Versioning sur le compartiment pour que les objets traités soient stockés comme nouvelles versions." } }
    - { id: c, text: { en: "Have uploads use the incoming/ prefix, and limit the event notification to keys that begin with incoming/.", fr: "Faire utiliser le préfixe incoming/ aux chargements, et limiter la notification d'événement aux clés qui commencent par incoming/." } }
    - { id: d, text: { en: "Configure an on-failure destination for asynchronous invocations so that recursive events are sent to a queue.", fr: "Configurer une destination en cas d'échec pour les appels asynchrones afin que les événements récursifs soient envoyés vers une file." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The function writes its output to the bucket that triggers it, so every output object starts a new invocation. S3 event notifications can be filtered on a key prefix; with inputs under incoming/ and outputs under processed/, the objects written by the function no longer match the notification."
    fr: "La fonction écrit sa sortie dans le compartiment qui la déclenche : chaque objet de sortie lance un nouvel appel. Les notifications d'événement S3 peuvent être filtrées sur un préfixe de clé ; avec les entrées sous incoming/ et les sorties sous processed/, les objets écrits par la fonction ne correspondent plus à la notification."
  options:
    a:
      en: "Zero concurrency stops the loop but also stops the processing of every new file."
      fr: "Une simultanéité nulle arrête la boucle mais aussi le traitement de chaque nouveau fichier."
    b:
      en: "A new version is still an object creation, so the loop continues."
      fr: "Une nouvelle version reste une création d'objet : la boucle continue."
    d:
      en: "The recursive invocations succeed, so an on-failure destination does not stop them."
      fr: "Les appels récursifs réussissent : une destination en cas d'échec ne les arrête pas."
references:
  - title: Use Lambda recursive loop detection to prevent infinite loops
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-recursion.html
  - title: Configuring event notifications using object key name filtering
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-filtering.html
