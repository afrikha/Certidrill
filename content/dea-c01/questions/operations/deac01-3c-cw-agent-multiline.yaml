id: deac01-3c-cw-agent-multiline
objective: "3.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Java ingestion application on a fleet of Amazon EC2 instances writes to /opt/ingest/app.log. Each entry starts with a timestamp such as 2026-11-20 14:03:12,345, and error entries include a stack trace of many lines. The CloudWatch agent sends the file to CloudWatch Logs with a collect_list entry that sets file_path, log_group_name and timestamp_format. In CloudWatch Logs, every line of a stack trace appears as a separate log event, which breaks the metric filters on exceptions.

    Which change to the collect_list entry will make each entry, including its stack trace, arrive as one log event?
  fr: |
    Une application d'ingestion Java exécutée sur un parc d'instances Amazon EC2 écrit dans /opt/ingest/app.log. Chaque entrée commence par un horodatage tel que 2026-11-20 14:03:12,345, et les entrées d'erreur incluent une trace de pile de nombreuses lignes. L'agent CloudWatch envoie le fichier vers CloudWatch Logs avec une entrée collect_list qui définit file_path, log_group_name et timestamp_format. Dans CloudWatch Logs, chaque ligne d'une trace de pile apparaît comme un événement de journal distinct, ce qui casse les filtres de métrique sur les exceptions.

    Quelle modification de l'entrée collect_list fait arriver chaque entrée, trace de pile comprise, sous la forme d'un seul événement de journal ?
body:
  options:
    - { id: a, text: '`"multi_line_start_pattern": "{timestamp_format}"`' }
    - { id: b, text: '`"timestamp_format": "%Y-%m-%d %H:%M:%S,%f"`' }
    - { id: c, text: '`"log_stream_name": "{instance_id}-app"`' }
    - { id: d, text: '`"file_path": "/opt/ingest/**.log"`' }
answer: { optionId: a }
explanation:
  correct:
    en: "multi_line_start_pattern identifies the start of a log message: a line that matches the pattern and the following lines that do not match form one event. Setting it to {timestamp_format} reuses the timestamp format, so the stack trace lines, which do not start with a timestamp, join the entry that precedes them."
    fr: "multi_line_start_pattern identifie le début d'un message de journal : une ligne qui correspond au modèle et les lignes suivantes qui n'y correspondent pas forment un seul événement. Le définir sur {timestamp_format} réutilise le format d'horodatage : les lignes de la trace de pile, qui ne commencent pas par un horodatage, rejoignent l'entrée qui les précède."
  options:
    b:
      en: "timestamp_format tells the agent how to read the event time; without a multi-line start pattern, multi-line mode stays disabled."
      fr: "timestamp_format indique à l'agent comment lire l'heure de l'événement ; sans modèle de début multiligne, le mode multiligne reste désactivé."
    c:
      en: "log_stream_name only changes the name of the stream that receives the events, not how lines are grouped into events."
      fr: "log_stream_name ne change que le nom du flux qui reçoit les événements, pas la façon dont les lignes sont regroupées en événements."
    d:
      en: "A glob in file_path changes which files are collected, not how the lines of one file are split into events."
      fr: "Un modèle glob dans file_path change les fichiers collectés, pas la façon dont les lignes d'un fichier sont découpées en événements."
references:
  - title: Manually create or edit the CloudWatch agent configuration file
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
