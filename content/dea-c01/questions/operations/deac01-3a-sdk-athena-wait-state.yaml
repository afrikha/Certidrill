id: deac01-3a-sdk-athena-wait-state
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer at AnyCompany writes a Python script that runs a report query in Amazon Athena with the AWS SDK for Python (Boto3). The script often fails on the last line with an error that says the query has not finished, although the same query succeeds in the Athena console.

    ```python
    athena = boto3.client("athena")
    qid = athena.start_query_execution(
        QueryString="SELECT region, SUM(amount) FROM sales GROUP BY region",
        WorkGroup="analytics",
    )["QueryExecutionId"]
    rows = athena.get_query_results(QueryExecutionId=qid)["ResultSet"]["Rows"]
    ```

    Which change will fix the script?
  fr: |
    Un ingénieur data d'AnyCompany écrit un script Python qui exécute une requête de rapport dans Amazon Athena avec le kit AWS SDK pour Python (Boto3). Le script échoue souvent à la dernière ligne avec une erreur indiquant que la requête n'est pas terminée, alors que la même requête réussit dans la console Athena.

    ```python
    athena = boto3.client("athena")
    qid = athena.start_query_execution(
        QueryString="SELECT region, SUM(amount) FROM sales GROUP BY region",
        WorkGroup="analytics",
    )["QueryExecutionId"]
    rows = athena.get_query_results(QueryExecutionId=qid)["ResultSet"]["Rows"]
    ```

    Quelle modification corrige le script ?
body:
  options:
    - { id: a, text: { en: "Pass a ClientRequestToken to start_query_execution so that the query runs synchronously.", fr: "Transmettre un ClientRequestToken à start_query_execution pour que la requête s'exécute de façon synchrone." } }
    - { id: b, text: { en: "Call get_query_execution in a loop until Status.State is SUCCEEDED, FAILED, or CANCELLED, and then call get_query_results.", fr: "Appeler get_query_execution en boucle jusqu'à ce que Status.State soit SUCCEEDED, FAILED ou CANCELLED, puis appeler get_query_results." } }
    - { id: c, text: { en: "Call get_query_results with MaxResults set to 1000 so that Athena returns the rows that are already available.", fr: "Appeler get_query_results avec MaxResults défini sur 1000 pour qu'Athena renvoie les lignes déjà disponibles." } }
    - { id: d, text: { en: "Enable query result reuse in start_query_execution so that the results are returned in its response.", fr: "Activer la réutilisation des résultats de requête dans start_query_execution pour que les résultats soient renvoyés dans sa réponse." } }
answer: { optionId: b }
explanation:
  correct:
    en: "StartQueryExecution only submits the query and returns its QueryExecutionId; the query then goes through states such as QUEUED and RUNNING. The script must poll GetQueryExecution until the state is terminal and fetch the results only after SUCCEEDED, paging with NextToken for large results."
    fr: "StartQueryExecution ne fait que soumettre la requête et renvoie son QueryExecutionId ; la requête passe ensuite par des états comme QUEUED et RUNNING. Le script doit interroger GetQueryExecution jusqu'à un état final et ne lire les résultats qu'après SUCCEEDED, en paginant avec NextToken pour les résultats volumineux."
  options:
    a:
      en: "ClientRequestToken is an idempotency token: it prevents duplicate queries but does not make the call wait for the results."
      fr: "ClientRequestToken est un jeton d'idempotence : il évite les requêtes en double mais ne fait pas attendre l'appel jusqu'aux résultats."
    c:
      en: "MaxResults sets the page size of the results of a finished query; it does not wait for a running query."
      fr: "MaxResults définit la taille de page des résultats d'une requête terminée ; il n'attend pas une requête en cours."
    d:
      en: "Result reuse can avoid running the query again, but StartQueryExecution still returns only the query ID."
      fr: "La réutilisation des résultats peut éviter de réexécuter la requête, mais StartQueryExecution renvoie toujours uniquement l'ID de la requête."
references:
  - title: StartQueryExecution
    url: https://docs.aws.amazon.com/athena/latest/APIReference/API_StartQueryExecution.html
  - title: QueryExecutionStatus
    url: https://docs.aws.amazon.com/athena/latest/APIReference/API_QueryExecutionStatus.html
