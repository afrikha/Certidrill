id: deac01-3a-sfn-find-failed-state
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An execution of an AWS Step Functions Standard workflow that orchestrates several AWS Glue jobs and Amazon Athena queries failed last night. A data engineer must find which state failed and read the error name and cause that the state returned.

    Which solution will meet this requirement MOST quickly?
  fr: |
    Une exécution d'un flux de travail Standard AWS Step Functions qui orchestre plusieurs tâches AWS Glue et requêtes Amazon Athena a échoué la nuit dernière. Un ingénieur data doit trouver quel état a échoué et lire le nom de l'erreur et la cause renvoyés par cet état.

    Quelle solution répond à cette exigence le PLUS rapidement ?
body:
  options:
    - { id: a, text: { en: "Search AWS CloudTrail event history for the StartExecution event of the state machine.", fr: "Rechercher l'événement StartExecution de la machine d'état dans l'historique des événements AWS CloudTrail." } }
    - { id: b, text: { en: "Review the ExecutionsFailed metric of the state machine in Amazon CloudWatch.", fr: "Consulter la métrique ExecutionsFailed de la machine d'état dans Amazon CloudWatch." } }
    - { id: c, text: { en: "Create an EventBridge rule for Step Functions execution status changes and wait for the next failure.", fr: "Créer une règle EventBridge pour les changements d'état des exécutions Step Functions et attendre le prochain échec." } }
    - { id: d, text: { en: "Open the execution in the Step Functions console and review the failed step and its error and cause in the event history.", fr: "Ouvrir l'exécution dans la console Step Functions et examiner l'étape en échec ainsi que son erreur et sa cause dans l'historique des événements." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The execution details page shows the error message of a failed execution, a link to the step that caused it, the Cause, and the full event history with failed events highlighted. Standard workflow histories are kept for 90 days after the execution completes."
    fr: "La page des détails d'exécution affiche le message d'erreur d'une exécution en échec, un lien vers l'étape qui l'a causée, la cause (Cause) et l'historique complet des événements, avec les événements en échec mis en évidence. L'historique des flux de travail Standard est conservé 90 jours après la fin de l'exécution."
  options:
    a:
      en: "CloudTrail records the API call that started the execution, not the states that ran or their errors."
      fr: "CloudTrail enregistre l'appel d'API qui a démarré l'exécution, pas les états exécutés ni leurs erreurs."
    b:
      en: "The metric counts failed executions but does not say which state failed or why."
      fr: "La métrique compte les exécutions en échec mais n'indique pas quel état a échoué ni pourquoi."
    c:
      en: "A new rule only captures future failures and is not needed to inspect an execution that already failed."
      fr: "Une nouvelle règle ne capture que les échecs futurs et n'est pas nécessaire pour examiner une exécution déjà en échec."
references:
  - title: Viewing execution details in the Step Functions console
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-view-execution-details.html
