id: deac01-3b-athena-rollup-subtotals
objective: "3.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A data engineer must write one Athena query on the sales table that returns the total amount for each region and product, a subtotal for each region, and a grand total, and nothing else. The query must read the table only once.

    Which GROUP BY clauses will meet these requirements? (Choose two.)
  fr: |
    Un ingénieur des données doit écrire une seule requête Athena sur la table sales qui renvoie le montant total par région et par produit, un sous-total par région et un total général, et rien d'autre. La requête ne doit lire la table qu'une seule fois.

    Quelles clauses GROUP BY répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "`GROUP BY CUBE (region, product)`" }
    - { id: b, text: "`GROUP BY ROLLUP (region, product)`" }
    - { id: c, text: "`GROUP BY GROUPING SETS ((region, product), (product), ())`" }
    - { id: d, text: "`GROUP BY GROUPING SETS ((region, product), (region), ())`" }
    - { id: e, text: "`GROUP BY ROLLUP (product, region)`" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "ROLLUP (region, product) generates the subtotals of its column hierarchy: (region, product), (region) and the grand total (). GROUPING SETS lists the same three groupings explicitly; both are a single GROUP BY that reads the data once, unlike a UNION ALL of three queries."
    fr: "ROLLUP (region, product) génère les sous-totaux de sa hiérarchie de colonnes : (region, product), (region) et le total général (). GROUPING SETS liste explicitement les trois mêmes regroupements ; les deux forment un seul GROUP BY qui lit les données une fois, contrairement à une UNION ALL de trois requêtes."
  options:
    a:
      en: "CUBE generates all possible grouping sets, so it also returns a subtotal per product that the report does not want."
      fr: "CUBE génère tous les ensembles de regroupement possibles : il renvoie aussi un sous-total par produit dont le rapport ne veut pas."
    c:
      en: "This set produces a subtotal per product instead of the required subtotal per region."
      fr: "Cet ensemble produit un sous-total par produit au lieu du sous-total par région demandé."
    e:
      en: "With the columns in this order, ROLLUP produces (product, region), (product) and (): subtotals per product, not per region."
      fr: "Avec les colonnes dans cet ordre, ROLLUP produit (product, region), (product) et () : des sous-totaux par produit, et non par région."
references:
  - title: SELECT
    url: https://docs.aws.amazon.com/athena/latest/ug/select.html
