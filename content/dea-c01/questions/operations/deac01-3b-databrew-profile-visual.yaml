id: deac01-3b-databrew-profile-visual
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team receives a new partner dataset as CSV files in Amazon S3. Before it designs any transformation, the team wants to see visual summaries of every column, such as value distributions, missing values and outliers, and the correlations between numeric columns. The team does not want to write code.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe d'ingénierie des données reçoit un nouveau jeu de données d'un partenaire sous forme de fichiers CSV dans Amazon S3. Avant de concevoir la moindre transformation, l'équipe veut voir des synthèses visuelles de chaque colonne, comme la distribution des valeurs, les valeurs manquantes et les valeurs aberrantes, ainsi que les corrélations entre les colonnes numériques. L'équipe ne veut pas écrire de code.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Run an AWS Glue crawler on the files and review the column names and types it infers in the Data Catalog.", fr: "Exécuter un robot d'indexation AWS Glue sur les fichiers et examiner les noms et types de colonnes qu'il déduit dans le Data Catalog." } }
    - { id: b, text: { en: "Write Athena queries that compute statistics for each column and export the results to a spreadsheet.", fr: "Écrire des requêtes Athena qui calculent des statistiques pour chaque colonne et exporter les résultats dans un tableur." } }
    - { id: c, text: { en: "Run an Amazon Macie sensitive data discovery job on the bucket and review the findings it reports per object.", fr: "Exécuter une tâche de découverte de données sensibles Amazon Macie sur le compartiment et examiner les résultats signalés par objet." } }
    - { id: d, text: { en: "Create an AWS Glue DataBrew dataset, run a profile job on it, and review the profile in the DataBrew console.", fr: "Créer un jeu de données AWS Glue DataBrew, exécuter une tâche de profil dessus et examiner le profil dans la console DataBrew." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A DataBrew profile job evaluates a dataset and writes the results to Amazon S3, and the console displays them. Its statistics include missing value counts, value distributions, outlier detection and a correlation matrix between columns, all configured without code."
    fr: "Une tâche de profil DataBrew évalue un jeu de données et écrit les résultats dans Amazon S3, et la console les affiche. Ses statistiques comprennent le nombre de valeurs manquantes, la distribution des valeurs, la détection des valeurs aberrantes et une matrice de corrélation entre colonnes, le tout configuré sans code."
  options:
    a:
      en: "A crawler infers column names and types; it does not compute distributions, outliers or correlations."
      fr: "Un robot d'indexation déduit les noms et les types de colonnes ; il ne calcule ni distributions, ni valeurs aberrantes, ni corrélations."
    b:
      en: "Writing and maintaining SQL for every statistic is code, and it produces no built-in visuals."
      fr: "Écrire et maintenir du SQL pour chaque statistique revient à écrire du code, sans visuels intégrés."
    c:
      en: "Macie looks for sensitive data such as PII; it does not profile column statistics."
      fr: "Macie recherche des données sensibles comme des informations personnelles ; il ne profile pas les statistiques des colonnes."
references:
  - title: Creating and working with AWS Glue DataBrew profile jobs
    url: https://docs.aws.amazon.com/databrew/latest/dg/jobs.profile.html
  - title: Building a profile job configuration programmatically in AWS Glue DataBrew
    url: https://docs.aws.amazon.com/databrew/latest/dg/profile.configuration.html
