id: deac01-3a-sdk-kinesis-partial-failure
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Python producer sends sensor readings to an Amazon Kinesis Data Streams stream with the put_records operation of the AWS SDK, in batches of 500 records. The producer treats a batch as delivered when the call returns HTTP status 200. Consumers report missing readings, and the stream shows write throttling during peaks. The company needs every reading to be written once, without duplicates caused by the producer.

    Which change to the producer will meet these requirements?
  fr: |
    Un producteur Python envoie des relevés de capteurs à un flux Amazon Kinesis Data Streams avec l'opération put_records du kit AWS SDK, par lots de 500 enregistrements. Le producteur considère qu'un lot est livré lorsque l'appel renvoie le statut HTTP 200. Les consommateurs signalent des relevés manquants, et le flux présente une limitation des écritures (throttling) pendant les pics. L'entreprise a besoin que chaque relevé soit écrit une fois, sans doublons causés par le producteur.

    Quelle modification du producteur répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Resend the complete batch whenever the response contains a FailedRecordCount value greater than 0.", fr: "Renvoyer le lot complet chaque fois que la réponse contient une valeur FailedRecordCount supérieure à 0." } }
    - { id: b, text: { en: "Send batches of 1,000 records so that fewer requests are made and fewer of them are throttled.", fr: "Envoyer des lots de 1 000 enregistrements pour faire moins de requêtes et en voir moins limitées." } }
    - { id: c, text: { en: "Set the SDK retry mode to adaptive so that the SDK resends the rejected records of each batch.", fr: "Définir le mode de nouvelle tentative du SDK sur adaptive pour que le SDK renvoie les enregistrements rejetés de chaque lot." } }
    - { id: d, text: { en: "Check FailedRecordCount, and resend only the records whose result entry has an ErrorCode, with exponential backoff and jitter.", fr: "Vérifier FailedRecordCount et renvoyer uniquement les enregistrements dont l'entrée de résultat comporte un ErrorCode, avec un backoff exponentiel et une gigue (jitter)." } }
answer: { optionId: d }
explanation:
  correct:
    en: "PutRecords can return HTTP 200 while some records fail; FailedRecordCount gives the number of failures, and the Records array matches the request by position, with an ErrorCode such as ProvisionedThroughputExceededException for each rejected record. Resending only those records with backoff writes every record without rewriting the successful ones."
    fr: "PutRecords peut renvoyer HTTP 200 alors que certains enregistrements échouent ; FailedRecordCount donne le nombre d'échecs, et le tableau Records correspond à la requête par position, avec un ErrorCode tel que ProvisionedThroughputExceededException pour chaque enregistrement rejeté. Renvoyer seulement ces enregistrements avec un backoff écrit chaque enregistrement sans réécrire ceux qui ont réussi."
  options:
    a:
      en: "Resending the whole batch writes the successful records a second time, which creates duplicates."
      fr: "Renvoyer tout le lot écrit une seconde fois les enregistrements réussis, ce qui crée des doublons."
    b:
      en: "A PutRecords request accepts at most 500 records, so larger batches are rejected."
      fr: "Une requête PutRecords accepte au plus 500 enregistrements : les lots plus grands sont rejetés."
    c:
      en: "SDK retries apply to failed requests; a 200 response with failed records is a successful call that the SDK does not retry."
      fr: "Les nouvelles tentatives du SDK s'appliquent aux requêtes en échec ; une réponse 200 contenant des enregistrements en échec est un appel réussi que le SDK ne retente pas."
references:
  - title: PutRecords
    url: https://docs.aws.amazon.com/kinesis/latest/APIReference/API_PutRecords.html
