id: deac01-3a-emr-transient-managed-scaling
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a daily batch of Apache Spark steps on an Amazon EMR on EC2 cluster that stays up all day. The steps run for about 4 hours, and their resource needs change a lot from one step to the next. The company wants the cluster capacity to follow the YARN workload automatically during the run and wants to stop paying for the instances when the last step finishes.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exécute un lot quotidien d'étapes Apache Spark sur un cluster Amazon EMR sur EC2 qui reste actif toute la journée. Les étapes durent environ 4 heures, et leurs besoins en ressources varient beaucoup d'une étape à l'autre. L'entreprise veut que la capacité du cluster suive automatiquement la charge YARN pendant l'exécution, et ne plus payer les instances une fois la dernière étape terminée.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable EMR managed scaling on the cluster with minimum and maximum capacity limits for the core and task nodes.", fr: "Activer la mise à l'échelle gérée EMR sur le cluster avec des limites de capacité minimale et maximale pour les nœuds principaux (core) et de tâche (task)." } }
    - { id: b, text: { en: "Launch a new cluster each day with the steps and the --auto-terminate option so that it terminates after the last step.", fr: "Lancer chaque jour un nouveau cluster avec les étapes et l'option --auto-terminate pour qu'il se termine après la dernière étape." } }
    - { id: c, text: { en: "Disable Spark dynamic resource allocation so that each step requests a fixed number of executors.", fr: "Désactiver l'allocation dynamique des ressources Spark pour que chaque étape demande un nombre fixe d'exécuteurs." } }
    - { id: d, text: { en: "Add more primary nodes to the cluster so that it can schedule more YARN containers.", fr: "Ajouter des nœuds primaires au cluster pour qu'il puisse planifier davantage de conteneurs YARN." } }
    - { id: e, text: { en: "Enable termination protection on the cluster so that it is shut down safely after the steps.", fr: "Activer la protection contre la résiliation sur le cluster pour qu'il soit arrêté en toute sécurité après les étapes." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Managed scaling adds and removes core and task capacity between the limits you set, based on the metrics of YARN applications such as Spark. A cluster launched with steps and termination after step execution (--auto-terminate) terminates its instances as soon as the last step completes, so no instances run between batches."
    fr: "La mise à l'échelle gérée ajoute et retire de la capacité core et task entre les limites définies, selon les métriques des applications YARN comme Spark. Un cluster lancé avec des étapes et la résiliation après exécution des étapes (--auto-terminate) arrête ses instances dès que la dernière étape est terminée : aucune instance ne tourne entre deux lots."
  options:
    c:
      en: "AWS recommends keeping Spark dynamic resource allocation enabled with managed scaling; disabling it can cause over-scaling."
      fr: "AWS recommande de laisser l'allocation dynamique des ressources Spark activée avec la mise à l'échelle gérée ; la désactiver peut provoquer une surallocation."
    d:
      en: "Primary nodes manage the cluster and are not scaled; scaling applies only to core and task nodes."
      fr: "Les nœuds primaires gèrent le cluster et ne sont pas mis à l'échelle ; la mise à l'échelle ne s'applique qu'aux nœuds core et task."
    e:
      en: "Termination protection prevents the cluster from being terminated, which keeps the instances running."
      fr: "La protection contre la résiliation empêche l'arrêt du cluster, ce qui laisse les instances en marche."
references:
  - title: Using managed scaling in Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-managed-scaling.html
  - title: Configuring an Amazon EMR cluster to continue or terminate after step execution
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-longrunning-transient.html
