id: deac01-3b-redshift-audit-bucket-sse
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team creates a dedicated Amazon S3 bucket for the audit logs of a provisioned Amazon Redshift cluster. The logs must be encrypted at rest. The bucket uses default encryption with SSE-KMS and a customer managed key, S3 Object Lock is turned off, and the bucket policy allows the redshift.amazonaws.com service principal to call s3:PutObject and s3:GetBucketAcl. After audit logging is turned on with this bucket as the destination, no log files are delivered.

    Which change will allow the logs to be delivered?
  fr: |
    Une équipe de sécurité crée un compartiment Amazon S3 dédié aux journaux d'audit d'un cluster Amazon Redshift provisionné. Les journaux doivent être chiffrés au repos. Le compartiment utilise le chiffrement par défaut SSE-KMS avec une clé gérée par le client, S3 Object Lock est désactivé, et la politique de compartiment autorise le principal de service redshift.amazonaws.com à appeler s3:PutObject et s3:GetBucketAcl. Après l'activation de la journalisation d'audit avec ce compartiment comme destination, aucun fichier journal n'est livré.

    Quelle modification permet la livraison des journaux ?
body:
  options:
    - { id: a, text: { en: "Add a key policy statement that allows redshift.amazonaws.com to use kms:GenerateDataKey on the customer managed key.", fr: "Ajouter à la politique de clé une instruction qui autorise redshift.amazonaws.com à utiliser kms:GenerateDataKey sur la clé gérée par le client." } }
    - { id: b, text: { en: "Add s3:ListBucket for redshift.amazonaws.com to the bucket policy.", fr: "Ajouter s3:ListBucket pour redshift.amazonaws.com à la politique de compartiment." } }
    - { id: c, text: { en: "Change the default encryption of the bucket to SSE-S3.", fr: "Remplacer le chiffrement par défaut du compartiment par SSE-S3." } }
    - { id: d, text: { en: "Turn on S3 Object Lock in governance mode for the bucket.", fr: "Activer S3 Object Lock en mode gouvernance pour le compartiment." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Redshift audit logging to Amazon S3 supports only buckets encrypted with Amazon S3 managed keys (SSE-S3, AES-256), and it requires Object Lock to be off. SSE-S3 still encrypts the logs at rest, and the existing bucket policy already grants the two permissions that the service needs."
    fr: "La journalisation d'audit d'Amazon Redshift vers Amazon S3 ne prend en charge que les compartiments chiffrés avec des clés gérées par Amazon S3 (SSE-S3, AES-256) et exige qu'Object Lock soit désactivé. SSE-S3 chiffre toujours les journaux au repos, et la politique de compartiment existante accorde déjà les deux autorisations dont le service a besoin."
  options:
    a:
      en: "Key permissions do not help, because Redshift audit logging cannot use an SSE-KMS bucket at all."
      fr: "Des autorisations sur la clé n'aident pas, car la journalisation d'audit Redshift ne peut pas du tout utiliser un compartiment SSE-KMS."
    b:
      en: "The service needs only s3:GetBucketAcl and s3:PutObject, which the bucket policy already allows."
      fr: "Le service n'a besoin que de s3:GetBucketAcl et s3:PutObject, que la politique de compartiment autorise déjà."
    d:
      en: "The audit log bucket must have Object Lock turned off, so turning it on would also block delivery."
      fr: "Le compartiment des journaux d'audit doit avoir Object Lock désactivé : l'activer bloquerait aussi la livraison."
references:
  - title: Database audit logging
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/db-auditing.html
