id: deac01-3c-cwl-stream-opensearch
objective: "3.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security operations team already uses an Amazon OpenSearch Service domain and OpenSearch Dashboards to search and visualize logs. The team now needs the application logs of a data ingestion platform, which are written to a CloudWatch Logs log group in the Standard log class, to be searchable in the same dashboards in near real time. Only the events that contain WARN or ERROR must be sent.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    L'équipe des opérations de sécurité d'AnyCompany utilise déjà un domaine Amazon OpenSearch Service et OpenSearch Dashboards pour rechercher et visualiser des journaux. L'équipe a maintenant besoin que les journaux applicatifs d'une plateforme d'ingestion de données, écrits dans un groupe de journaux CloudWatch Logs de la classe Standard, soient consultables dans les mêmes tableaux de bord en temps quasi réel. Seuls les événements qui contiennent WARN ou ERROR doivent être envoyés.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Schedule a daily CloudWatch Logs export task to Amazon S3, and then load the exported files into the OpenSearch domain.", fr: "Planifier une tâche d'exportation CloudWatch Logs quotidienne vers Amazon S3, puis charger les fichiers exportés dans le domaine OpenSearch." } }
    - { id: b, text: { en: "Create a CloudWatch dashboard with Logs Insights query widgets that filter on WARN and ERROR, and share it with the team.", fr: "Créer un tableau de bord CloudWatch avec des widgets de requêtes Logs Insights qui filtrent sur WARN et ERROR, et le partager avec l'équipe." } }
    - { id: c, text: { en: "Write a scheduled AWS Lambda function that calls FilterLogEvents every minute and indexes the results in the OpenSearch domain.", fr: "Écrire une fonction AWS Lambda planifiée qui appelle FilterLogEvents chaque minute et indexe les résultats dans le domaine OpenSearch." } }
    - { id: d, text: { en: "Create an Amazon OpenSearch Service subscription filter on the log group with a filter pattern that matches WARN and ERROR events.", fr: "Créer sur le groupe de journaux un filtre d'abonnement Amazon OpenSearch Service avec un modèle de filtre qui correspond aux événements WARN et ERROR." } }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudWatch Logs can stream a log group to an OpenSearch Service domain in near real time through a subscription filter created from the console, and the filter pattern sends only the matching events. The streaming is supported for log groups in the Standard log class, which is the case here."
    fr: "CloudWatch Logs peut diffuser un groupe de journaux vers un domaine OpenSearch Service en temps quasi réel grâce à un filtre d'abonnement créé depuis la console, et le modèle de filtre n'envoie que les événements correspondants. Cette diffusion est prise en charge pour les groupes de journaux de la classe Standard, ce qui est le cas ici."
  options:
    a:
      en: "A daily export is not near real time and needs a separate process to load the files into the domain."
      fr: "Une exportation quotidienne n'est pas en temps quasi réel et nécessite un processus distinct pour charger les fichiers dans le domaine."
    b:
      en: "A CloudWatch dashboard does not make the logs searchable in the OpenSearch Dashboards that the team uses."
      fr: "Un tableau de bord CloudWatch ne rend pas les journaux consultables dans les OpenSearch Dashboards qu'utilise l'équipe."
    c:
      en: "Polling and indexing code must be written and maintained, which is more development effort than a subscription filter."
      fr: "Le code d'interrogation et d'indexation doit être écrit et maintenu, soit plus d'effort de développement qu'un filtre d'abonnement."
references:
  - title: Streaming CloudWatch Logs data to Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_OpenSearch_Stream.html
