id: deac01-3a-athena-iceberg-merge
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Every day, a change data capture (CDC) file lands in a staging table that contains customer_id, the new column values, and an op column whose value is I, U, or D. The customers table in Amazon S3 must apply these changes by using Amazon Athena engine version 3: update existing customers, insert new ones, and delete customers marked D, in one transactional statement. The customers table is currently a Hive table in Parquet format.

    Which solution will meet these requirements?
  fr: |
    Chaque jour, un fichier de capture des données modifiées (CDC) arrive dans une table intermédiaire qui contient customer_id, les nouvelles valeurs des colonnes et une colonne op dont la valeur est I, U ou D. La table customers dans Amazon S3 doit appliquer ces modifications avec Amazon Athena version 3 du moteur : mettre à jour les clients existants, insérer les nouveaux et supprimer ceux marqués D, en une seule instruction transactionnelle. La table customers est actuellement une table Hive au format Parquet.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Convert customers to an Apache Iceberg table, and run one MERGE INTO statement that deletes, updates, and inserts rows.", fr: "Convertir customers en table Apache Iceberg, et exécuter une instruction MERGE INTO qui supprime, met à jour et insère des lignes." } }
    - { id: b, text: { en: "Convert customers to an Apache Iceberg table, and run INSERT INTO customers SELECT * FROM the staging table every day.", fr: "Convertir customers en table Apache Iceberg, et exécuter chaque jour INSERT INTO customers SELECT * FROM la table intermédiaire." } }
    - { id: c, text: { en: "Keep the Hive table and run a MERGE INTO statement with WHEN MATCHED and WHEN NOT MATCHED clauses.", fr: "Conserver la table Hive et exécuter une instruction MERGE INTO avec des clauses WHEN MATCHED et WHEN NOT MATCHED." } }
    - { id: d, text: { en: "Keep the Hive table and rebuild it every day with a CREATE TABLE AS SELECT statement that joins it with the staging table.", fr: "Conserver la table Hive et la reconstruire chaque jour avec une instruction CREATE TABLE AS SELECT qui la joint à la table intermédiaire." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In Athena, MERGE INTO is supported only for Apache Iceberg tables in engine version 3. One transactional statement can delete, update, and insert rows; WHEN clauses are evaluated in order, so the DELETE clause for op = 'D' must come before the general UPDATE clause."
    fr: "Dans Athena, MERGE INTO n'est pris en charge que pour les tables Apache Iceberg avec la version 3 du moteur. Une seule instruction transactionnelle peut supprimer, mettre à jour et insérer des lignes ; les clauses WHEN sont évaluées dans l'ordre : la clause DELETE pour op = 'D' doit précéder la clause UPDATE générale."
  options:
    b:
      en: "INSERT INTO only appends rows, so updated customers are duplicated and deleted customers remain."
      fr: "INSERT INTO ne fait qu'ajouter des lignes : les clients mis à jour sont dupliqués et les clients supprimés restent."
    c:
      en: "Athena does not support MERGE INTO on Hive tables."
      fr: "Athena ne prend pas en charge MERGE INTO sur les tables Hive."
    d:
      en: "Rebuilding the table with CTAS creates a new table each day and does not change the existing table in one transactional statement."
      fr: "Reconstruire la table avec CTAS crée une nouvelle table chaque jour et ne modifie pas la table existante en une seule instruction transactionnelle."
references:
  - title: MERGE INTO
    url: https://docs.aws.amazon.com/athena/latest/ug/merge-into-statement.html
