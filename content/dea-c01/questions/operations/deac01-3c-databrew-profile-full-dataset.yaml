id: deac01-3c-databrew-profile-full-dataset
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer created an AWS Glue DataBrew profile job with the default settings on a customer dataset of 40 million rows, and enabled duplicate row detection. The profile reports no duplicate rows and almost no missing values in the postal_code column. However, a downstream Amazon Redshift load finds thousands of duplicate customers and many empty postal codes in the same data.

    What should the data engineer do to make the profile reflect the whole dataset?
  fr: |
    Un ingénieur des données a créé une tâche de profil AWS Glue DataBrew avec les paramètres par défaut sur un jeu de données clients de 40 millions de lignes, et a activé la détection des lignes en double. Le profil ne signale aucune ligne en double et presque aucune valeur manquante dans la colonne postal_code. Pourtant, un chargement en aval dans Amazon Redshift trouve des milliers de clients en double et de nombreux codes postaux vides dans les mêmes données.

    Que doit faire l'ingénieur des données pour que le profil reflète l'ensemble du jeu de données ?
body:
  options:
    - { id: a, text: { en: "Increase the maximum number of units of the profile job from 5 to 20.", fr: "Augmenter le nombre maximal d'unités de la tâche de profil de 5 à 20." } }
    - { id: b, text: { en: "Change the sample of the DataBrew project to 5,000 random rows.", fr: "Remplacer l'échantillon du projet DataBrew par 5 000 lignes aléatoires." } }
    - { id: c, text: { en: "Change the data sample of the profile job to Full dataset.", fr: "Remplacer l'échantillon de données de la tâche de profil par le jeu de données complet (Full dataset)." } }
    - { id: d, text: { en: "Enable the correlations matrix in the dataset-level configuration of the profile job.", fr: "Activer la matrice de corrélations dans la configuration au niveau du jeu de données de la tâche de profil." } }
answer: { optionId: c }
explanation:
  correct:
    en: "By default, a DataBrew profile job runs in the CUSTOM_ROWS mode on 20,000 rows, so statistics on a 40-million-row dataset describe only a small part of it. The FULL_DATASET mode runs the profile on the entire dataset, so duplicates and missing values elsewhere in the data are counted."
    fr: "Par défaut, une tâche de profil DataBrew s'exécute en mode CUSTOM_ROWS sur 20 000 lignes : sur un jeu de 40 millions de lignes, les statistiques n'en décrivent qu'une petite partie. Le mode FULL_DATASET exécute le profil sur tout le jeu de données, de sorte que les doublons et les valeurs manquantes situés ailleurs dans les données sont comptés."
  options:
    a:
      en: "More units add processing capacity but do not change how many rows the job profiles."
      fr: "Davantage d'unités ajoutent de la capacité de traitement, mais ne changent pas le nombre de lignes profilées par la tâche."
    b:
      en: "The project sample is used for interactive work in the project and is limited to 5,000 rows; it does not change the profile job."
      fr: "L'échantillon du projet sert au travail interactif dans le projet et est limité à 5 000 lignes ; il ne modifie pas la tâche de profil."
    d:
      en: "Correlations show how closely the values of columns are related; they do not extend the profile to more rows."
      fr: "Les corrélations montrent à quel point les valeurs des colonnes sont liées ; elles n'étendent pas le profil à davantage de lignes."
references:
  - title: JobSample
    url: https://docs.aws.amazon.com/databrew/latest/dg/API_JobSample.html
  - title: Creating and working with AWS Glue DataBrew profile jobs
    url: https://docs.aws.amazon.com/databrew/latest/dg/jobs.profile.html
