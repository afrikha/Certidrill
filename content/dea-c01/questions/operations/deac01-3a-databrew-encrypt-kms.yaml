id: deac01-3a-databrew-encrypt-kms
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue DataBrew recipe prepares a customer dataset before it is shared with an analytics team. The phone_number column must not be readable in the output. A separate support application that runs outside DataBrew must be able to recover the original phone numbers by using the AWS Encryption SDK and an AWS KMS key that the security team controls.

    Which recipe step will meet these requirements?
  fr: |
    Une recette AWS Glue DataBrew prépare un jeu de données clients avant son partage avec une équipe d'analyse. La colonne phone_number ne doit pas être lisible dans la sortie. Une application de support distincte, qui s'exécute en dehors de DataBrew, doit pouvoir retrouver les numéros de téléphone d'origine avec le kit AWS Encryption SDK et une clé AWS KMS contrôlée par l'équipe de sécurité.

    Quelle étape de recette répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "CRYPTOGRAPHIC_HASH with the HMAC_SHA256 algorithm and an AWS Secrets Manager secret as the key.", fr: "CRYPTOGRAPHIC_HASH avec l'algorithme HMAC_SHA256 et un secret AWS Secrets Manager comme clé." } }
    - { id: b, text: { en: "DETERMINISTIC_ENCRYPT with an AWS Secrets Manager secret that the security team manages.", fr: "DETERMINISTIC_ENCRYPT avec un secret AWS Secrets Manager géré par l'équipe de sécurité." } }
    - { id: c, text: { en: "MASK_CUSTOM that replaces every digit of the phone number with a fixed character.", fr: "MASK_CUSTOM qui remplace chaque chiffre du numéro de téléphone par un caractère fixe." } }
    - { id: d, text: { en: "ENCRYPT with the ARN of the AWS KMS key that the security team controls.", fr: "ENCRYPT avec l'ARN de la clé AWS KMS contrôlée par l'équipe de sécurité." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The ENCRYPT step encrypts the column values with the AWS Encryption SDK under the AWS KMS key given in kmsKeyArn. The values can be decrypted in DataBrew with DECRYPT or outside DataBrew with the AWS Encryption SDK, which is what the support application needs."
    fr: "L'étape ENCRYPT chiffre les valeurs de la colonne avec le kit AWS Encryption SDK sous la clé AWS KMS indiquée dans kmsKeyArn. Les valeurs peuvent être déchiffrées dans DataBrew avec DECRYPT ou en dehors de DataBrew avec le kit AWS Encryption SDK, ce dont l'application de support a besoin."
  options:
    a:
      en: "Hashing is one-way: the original phone numbers cannot be recovered from the hash."
      fr: "Le hachage est à sens unique : les numéros d'origine ne peuvent pas être retrouvés à partir du hachage."
    b:
      en: "DETERMINISTIC_ENCRYPT uses AES-GCM-SIV with a key from Secrets Manager, not KMS, and its values are decrypted only inside DataBrew with DETERMINISTIC_DECRYPT."
      fr: "DETERMINISTIC_ENCRYPT utilise AES-GCM-SIV avec une clé issue de Secrets Manager, pas de KMS, et ses valeurs ne sont déchiffrées que dans DataBrew avec DETERMINISTIC_DECRYPT."
    c:
      en: "Masking replaces the characters permanently, so no application can recover the original values."
      fr: "Le masquage remplace définitivement les caractères : aucune application ne peut retrouver les valeurs d'origine."
references:
  - title: ENCRYPT
    url: https://docs.aws.amazon.com/databrew/latest/dg/recipe-actions.ENCRYPT.html
  - title: DETERMINISTIC_ENCRYPT
    url: https://docs.aws.amazon.com/databrew/latest/dg/recipe-actions.DETERMINISTIC_ENCRYPT.html
