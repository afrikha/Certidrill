id: deac01-3c-dq-catalog-recommendations
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data steward at AnyCompany is responsible for 40 tables in the AWS Glue Data Catalog that are queried with Amazon Athena. No data quality rules exist yet, and the steward does not write code. The steward wants a first set of data quality rules for each table, based on the data, that can be reviewed and edited before the rules are evaluated on a schedule.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un responsable des données (data steward) d'AnyCompany est chargé de 40 tables d'AWS Glue Data Catalog interrogées avec Amazon Athena. Aucune règle de qualité des données n'existe encore, et le responsable n'écrit pas de code. Il souhaite obtenir pour chaque table un premier ensemble de règles de qualité des données, fondé sur les données, qu'il pourra examiner et modifier avant que les règles soient évaluées selon une planification.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Run AWS Glue Data Quality rule recommendations on each Data Catalog table, and then edit and save the recommended ruleset.", fr: "Exécuter les recommandations de règles AWS Glue Data Quality sur chaque table du Data Catalog, puis modifier et enregistrer l'ensemble de règles recommandé." } }
    - { id: b, text: { en: "Create an AWS Glue ETL job for each table with an Evaluate Data Quality transform, and write the DQDL rules by hand.", fr: "Créer une tâche ETL AWS Glue par table avec une transformation Evaluate Data Quality, et écrire les règles DQDL à la main." } }
    - { id: c, text: { en: "Run an AWS Glue crawler on each table so that it adds data quality rules to the table properties.", fr: "Exécuter un robot d'analyse AWS Glue sur chaque table pour qu'il ajoute des règles de qualité des données aux propriétés de la table." } }
    - { id: d, text: { en: "Write Athena queries that count nulls and duplicates for each table, and schedule them with Amazon EventBridge.", fr: "Écrire des requêtes Athena qui comptent les valeurs nulles et les doublons de chaque table, et les planifier avec Amazon EventBridge." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Glue Data Quality for the Data Catalog targets non-coders such as data stewards and can analyze a table and generate DQDL rules for it. Recommendations are supported for the Data Catalog, and the resulting ruleset can be edited and then evaluated on a schedule."
    fr: "AWS Glue Data Quality pour le Data Catalog s'adresse aux non-développeurs comme les responsables des données et peut analyser une table pour générer des règles DQDL. Les recommandations sont prises en charge pour le Data Catalog, et l'ensemble de règles obtenu peut être modifié puis évalué selon une planification."
  options:
    b:
      en: "Forty jobs with hand-written rules mean code and maintenance, and recommendations are not available in ETL jobs."
      fr: "Quarante tâches avec des règles écrites à la main impliquent du code et de la maintenance, et les recommandations ne sont pas disponibles dans les tâches ETL."
    c:
      en: "Crawlers infer schemas and partitions; they do not create data quality rules."
      fr: "Les robots d'analyse déduisent les schémas et les partitions ; ils ne créent pas de règles de qualité des données."
    d:
      en: "Hand-written SQL checks require code that the steward does not write, and they are not a reviewed DQDL ruleset."
      fr: "Des contrôles SQL écrits à la main nécessitent du code que le responsable n'écrit pas, et ne constituent pas un ensemble de règles DQDL examiné."
references:
  - title: AWS Glue Data Quality
    url: https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html
