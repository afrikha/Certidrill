id: deac01-3c-dqdl-dynamic-distinct
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue ETL job processes a daily sales file from a retail company's stores. The number of distinct store_id values in each file changes slightly over time as stores open and close, so a fixed range would soon be wrong. The data engineer needs a rule in the job's Evaluate Data Quality transform that fails when the distinct count falls outside the range of counts observed in the last 10 runs, the lowest and highest of these counts being accepted.

    Which DQDL rule will meet this requirement?
  fr: |
    Une tâche ETL AWS Glue traite un fichier de ventes quotidien provenant des magasins d'une entreprise de distribution. Le nombre de valeurs store_id distinctes de chaque fichier évolue légèrement au fil des ouvertures et fermetures de magasins : une plage fixe deviendrait vite fausse. L'ingénieur des données a besoin, dans la transformation Evaluate Data Quality de la tâche, d'une règle qui échoue lorsque le nombre de valeurs distinctes sort de la plage des nombres observés lors des 10 dernières exécutions, le plus bas et le plus élevé de ces nombres étant acceptés.

    Quelle règle DQDL répond à cette exigence ?
body:
  options:
    - { id: a, text: '`DistinctValuesCount "store_id" between min(last(10))-1 and max(last(10))+1`' }
    - { id: b, text: '`DistinctValuesCount "store_id" > last(10)`' }
    - { id: c, text: '`DistinctValuesCount "store_id" between 299 and 321`' }
    - { id: d, text: '`Uniqueness "store_id" between min(last(10))-1 and max(last(10))+1`' }
answer: { optionId: a }
explanation:
  correct:
    en: "Dynamic rules compare a metric with values of previous runs: last(10) returns the last 10 values of the metric, and aggregations such as min and max turn them into a number. Because between is exclusive, subtracting and adding 1 keeps the lowest and highest counts inside the passing range, and the range follows the data as stores change."
    fr: "Les règles dynamiques comparent une métrique aux valeurs des exécutions précédentes : last(10) renvoie les 10 dernières valeurs de la métrique, et des agrégations comme min et max les transforment en nombre. Comme between est exclusif, soustraire et ajouter 1 garde le nombre le plus bas et le plus élevé dans la plage acceptée, et la plage suit les données au fil des changements de magasins."
  options:
    b:
      en: "last(10) is a list, and comparing the current value with a list without an aggregation produces an error."
      fr: "last(10) est une liste, et comparer la valeur actuelle à une liste sans agrégation produit une erreur."
    c:
      en: "A static range does not adapt to the stores that open and close, which is the problem to avoid."
      fr: "Une plage statique ne s'adapte pas aux magasins qui ouvrent et ferment, ce qui est le problème à éviter."
    d:
      en: "Uniqueness measures a ratio of unique values, not the number of distinct stores, so it cannot be compared with the past distinct counts."
      fr: "Uniqueness mesure un ratio de valeurs uniques, pas le nombre de magasins distincts : elle ne peut pas être comparée aux nombres de valeurs distinctes passés."
references:
  - title: Data Quality Definition Language (DQDL) reference
    url: https://docs.aws.amazon.com/glue/latest/dg/dqdl.html
