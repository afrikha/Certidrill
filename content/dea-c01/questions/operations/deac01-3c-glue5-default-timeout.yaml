id: deac01-3c-glue5-default-timeout
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany upgraded a monthly AWS Glue Spark job from AWS Glue 4.0 to AWS Glue 5.0 without changing its other properties. The job has no timeout value configured and processes a full month of data in about 10 hours. Since the upgrade, every run ends in the TIMEOUT state after 8 hours and is not restarted. The job must complete without a code change.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a mis à niveau une tâche Spark AWS Glue mensuelle d'AWS Glue 4.0 vers AWS Glue 5.0 sans modifier ses autres propriétés. Aucune valeur de délai d'expiration n'est configurée pour la tâche, qui traite un mois complet de données en 10 heures environ. Depuis la mise à niveau, chaque exécution se termine dans l'état TIMEOUT au bout de 8 heures et n'est pas relancée. La tâche doit aller à son terme sans modification du code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the job timeout explicitly to 720 minutes.", fr: "Définir explicitement le délai d'expiration de la tâche à 720 minutes." } }
    - { id: b, text: { en: "Set the number of retries of the job to 2.", fr: "Définir le nombre de nouvelles tentatives de la tâche à 2." } }
    - { id: c, text: { en: "Enable job run queuing on the job.", fr: "Activer la mise en file d'attente des exécutions sur la tâche." } }
    - { id: d, text: { en: "Turn on job observability metrics for the job.", fr: "Activer les métriques d'observabilité de la tâche." } }
answer: { optionId: a }
explanation:
  correct:
    en: "When the timeout is left blank, AWS Glue applies 2,880 minutes to Glue 4.0 and earlier but 480 minutes (8 hours) to Glue 5.0 and later. Setting an explicit timeout above the job's duration, within the 7-day maximum, lets the run finish."
    fr: "Lorsque le délai d'expiration est laissé vide, AWS Glue applique 2 880 minutes à Glue 4.0 et versions antérieures, mais 480 minutes (8 heures) à Glue 5.0 et versions ultérieures. Définir un délai explicite supérieur à la durée de la tâche, dans la limite de 7 jours, permet à l'exécution d'aller à son terme."
  options:
    b:
      en: "Jobs that reach the timeout limit are not restarted, and a retry would hit the same 8-hour limit."
      fr: "Les tâches qui atteignent le délai d'expiration ne sont pas relancées, et une nouvelle tentative atteindrait la même limite de 8 heures."
    c:
      en: "Queuing delays runs that would exceed concurrency or capacity limits; it does not extend the time a run may consume."
      fr: "La mise en file d'attente retarde les exécutions qui dépasseraient des limites de concurrence ou de capacité ; elle n'allonge pas la durée qu'une exécution peut consommer."
    d:
      en: "Observability metrics help diagnose the run but do not change the timeout that stops it."
      fr: "Les métriques d'observabilité aident à diagnostiquer l'exécution, mais ne modifient pas le délai d'expiration qui l'arrête."
references:
  - title: Configuring job properties for Spark jobs in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/add-job.html
