id: deac01-3a-lambda-s3-small-files
objective: "3.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Partners upload a few hundred small JSON files (less than 1 MB each) per day to an Amazon S3 bucket, at unpredictable times. Each file must be validated and converted to CSV within one minute of its arrival. The company wants the solution with the LEAST operational overhead and cost.

    Which solution will meet these requirements?
  fr: |
    Des partenaires chargent chaque jour quelques centaines de petits fichiers JSON (moins de 1 Mo chacun) dans un compartiment Amazon S3, à des heures imprévisibles. Chaque fichier doit être validé et converti en CSV dans la minute qui suit son arrivée. L'entreprise veut la solution présentant le MOINS de charge opérationnelle et de coût.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an Amazon EMR cluster continuously with a Spark Structured Streaming job that watches the bucket.", fr: "Exécuter en continu un cluster Amazon EMR avec une tâche Spark Structured Streaming qui surveille le compartiment." } }
    - { id: b, text: { en: "Configure an S3 event notification for object creation that invokes a Lambda function, which validates the file and writes the CSV to another prefix.", fr: "Configurer une notification d'événement S3 sur la création d'objets qui appelle une fonction Lambda, laquelle valide le fichier et écrit le CSV dans un autre préfixe." } }
    - { id: c, text: { en: "Schedule an AWS Glue Spark job every hour that converts all files received since the previous run.", fr: "Planifier toutes les heures une tâche Spark AWS Glue qui convertit tous les fichiers reçus depuis l'exécution précédente." } }
    - { id: d, text: { en: "Run a cron script every minute on an Amazon EC2 instance that lists the bucket and converts new files.", fr: "Exécuter toutes les minutes un script cron sur une instance Amazon EC2 qui liste le compartiment et convertit les nouveaux fichiers." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An S3 event notification invokes the function as soon as each object is created, and Lambda bills only for the invocations. Small files are processed in seconds with no servers or clusters to manage, and writing the output to another prefix keeps the trigger from firing on its own output."
    fr: "Une notification d'événement S3 appelle la fonction dès la création de chaque objet, et Lambda ne facture que les appels. Les petits fichiers sont traités en quelques secondes sans serveur ni cluster à gérer, et écrire la sortie dans un autre préfixe évite que le déclencheur se déclenche sur sa propre sortie."
  options:
    a:
      en: "A permanent cluster costs far more than a few hundred small files justify and must be managed."
      fr: "Un cluster permanent coûte bien plus que ne le justifient quelques centaines de petits fichiers et doit être géré."
    c:
      en: "An hourly job does not meet the one-minute requirement."
      fr: "Une tâche horaire ne respecte pas l'exigence d'une minute."
    d:
      en: "The instance must be patched and runs all the time, and listing the bucket every minute adds requests."
      fr: "L'instance doit être maintenue à jour et fonctionne en permanence, et lister le compartiment chaque minute ajoute des requêtes."
references:
  - title: Configuring event notifications using object key name filtering
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-filtering.html
