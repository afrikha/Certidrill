id: deac01-3a-glue-job-failure-alert
objective: "3.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs about 80 AWS Glue jobs in one AWS account. The on-call data engineer must receive an email whenever any job run fails or times out. New jobs are added every week, and the company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute environ 80 tâches AWS Glue dans un compte AWS. L'ingénieur data d'astreinte doit recevoir un e-mail chaque fois qu'une exécution de tâche échoue ou expire. De nouvelles tâches sont ajoutées chaque semaine, et l'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch Logs metric filter on the error log group of each job, with an alarm that notifies an SNS topic.", fr: "Créer un filtre de métrique CloudWatch Logs sur le groupe de journaux d'erreurs de chaque tâche, avec une alarme qui notifie une rubrique SNS." } }
    - { id: b, text: { en: "Create a Lambda function that calls GetJobRuns for every job every 5 minutes and sends an email for failed runs.", fr: "Créer une fonction Lambda qui appelle GetJobRuns pour chaque tâche toutes les 5 minutes et envoie un e-mail pour les exécutions en échec." } }
    - { id: c, text: { en: "Create an EventBridge rule for Glue Job State Change events in the FAILED or TIMEOUT state that targets an SNS topic with an email subscription.", fr: "Créer une règle EventBridge pour les événements Glue Job State Change à l'état FAILED ou TIMEOUT qui cible une rubrique SNS avec un abonnement e-mail." } }
    - { id: d, text: { en: "Set a job run delay notification threshold on each job and create an EventBridge rule for Glue Job Run Status events.", fr: "Définir un seuil de notification de retard d'exécution sur chaque tâche et créer une règle EventBridge pour les événements Glue Job Run Status." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Glue sends a Glue Job State Change event to the default event bus when a job run reaches SUCCEEDED, FAILED, TIMEOUT, or STOPPED. One rule filtered on FAILED and TIMEOUT covers every job, including new ones, and an SNS email subscription delivers the alert."
    fr: "AWS Glue envoie un événement Glue Job State Change au bus d'événements par défaut lorsqu'une exécution atteint SUCCEEDED, FAILED, TIMEOUT ou STOPPED. Une seule règle filtrée sur FAILED et TIMEOUT couvre toutes les tâches, y compris les nouvelles, et un abonnement e-mail SNS livre l'alerte."
  options:
    a:
      en: "A filter and alarm per job must be created for every new job, and log text is a weaker signal than the run state."
      fr: "Un filtre et une alarme par tâche doivent être créés pour chaque nouvelle tâche, et le texte des journaux est un signal moins fiable que l'état d'exécution."
    b:
      en: "Polling is custom code and adds delay and API calls compared with the events that Glue already emits."
      fr: "L'interrogation est du code personnalisé et ajoute du délai et des appels d'API par rapport aux événements que Glue émet déjà."
    d:
      en: "Glue Job Run Status events report runs that exceed the delay threshold while RUNNING, STARTING, or STOPPING, not failures or timeouts."
      fr: "Les événements Glue Job Run Status signalent les exécutions qui dépassent le seuil de retard à l'état RUNNING, STARTING ou STOPPING, pas les échecs ni les expirations."
references:
  - title: Automating AWS Glue with EventBridge
    url: https://docs.aws.amazon.com/glue/latest/dg/automating-awsglue-with-cloudwatch-events.html
