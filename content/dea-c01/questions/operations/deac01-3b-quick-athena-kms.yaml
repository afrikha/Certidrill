id: deac01-3b-quick-athena-kms
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores Parquet files in an Amazon S3 bucket that uses SSE-KMS with a customer managed key. Athena tables in the AWS Glue Data Catalog point to the data, and analysts query them successfully in the Athena console. An administrator created an AWS Quick Sight dataset on these tables and already selected the data bucket and the Athena query results bucket in the Quick Sight permissions for AWS resources. The dataset still fails with an insufficient permissions error when it reads the data.

    Which action will resolve the issue?
  fr: |
    Une entreprise stocke des fichiers Parquet dans un compartiment Amazon S3 qui utilise SSE-KMS avec une clé gérée par le client. Des tables Athena du AWS Glue Data Catalog pointent vers les données, et les analystes les interrogent sans problème dans la console Athena. Un administrateur a créé un jeu de données AWS Quick Sight sur ces tables et a déjà sélectionné le compartiment de données et le compartiment des résultats de requêtes Athena dans les autorisations Quick Sight pour les ressources AWS. Le jeu de données échoue toujours avec une erreur d'autorisations insuffisantes lorsqu'il lit les données.

    Quelle action résout le problème ?
body:
  options:
    - { id: a, text: { en: "Grant kms:Decrypt on the key to the IAM identities of the analysts who open the dashboards.", fr: "Accorder kms:Decrypt sur la clé aux identités IAM des analystes qui ouvrent les tableaux de bord." } }
    - { id: b, text: { en: "Create a KMS grant that allows the Quick Sight service role to use the key for the Decrypt operation.", fr: "Créer un octroi KMS qui autorise le rôle de service Quick Sight à utiliser la clé pour l'opération Decrypt." } }
    - { id: c, text: { en: "Add a bucket policy statement that allows the Quick Sight service role to call s3:GetObject on the bucket.", fr: "Ajouter à la politique de compartiment une instruction qui autorise le rôle de service Quick Sight à appeler s3:GetObject sur le compartiment." } }
    - { id: d, text: { en: "Change the dataset from direct query to SPICE so that Quick Sight imports the data once.", fr: "Faire passer le jeu de données de la requête directe à SPICE afin que Quick Sight importe les données une seule fois." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Quick Sight reads Athena data with its own IAM service role. When the files are encrypted with a KMS key, that role also needs permission to decrypt with the key, which AWS documents as a KMS grant for the Decrypt operation to the Quick Sight role."
    fr: "Quick Sight lit les données Athena avec son propre rôle de service IAM. Lorsque les fichiers sont chiffrés avec une clé KMS, ce rôle doit aussi être autorisé à déchiffrer avec la clé, ce qu'AWS documente sous la forme d'un octroi KMS pour l'opération Decrypt au rôle Quick Sight."
  options:
    a:
      en: "Quick Sight does not use the dashboard viewers' IAM identities to read the data, so their key permissions do not matter."
      fr: "Quick Sight n'utilise pas les identités IAM des lecteurs des tableaux de bord pour lire les données : leurs autorisations sur la clé ne changent rien."
    c:
      en: "S3 access is already granted through the Quick Sight resource permissions; the missing permission is on the KMS key."
      fr: "L'accès à S3 est déjà accordé par les autorisations de ressources Quick Sight ; l'autorisation manquante porte sur la clé KMS."
    d:
      en: "A SPICE import also reads the encrypted files with the same role, so it fails for the same reason."
      fr: "Une importation SPICE lit aussi les fichiers chiffrés avec le même rôle : elle échoue pour la même raison."
references:
  - title: Insufficient permissions when using Athena with AWS Quick Sight
    url: https://docs.aws.amazon.com/quicksight/latest/user/troubleshoot-athena-insufficient-permissions.html
