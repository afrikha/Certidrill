id: deac01-3b-glue-timeout-pattern
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer created the following Amazon EventBridge rule on the default event bus. Its target is an Amazon SNS topic that emails the on-call team. The team must be notified when an AWS Glue job run fails or reaches its timeout. Emails arrive for failed runs, but not for runs that time out.

    ```json
    {
      "source": ["aws.glue"],
      "detail-type": ["Glue Job State Change"],
      "detail": {
        "state": ["FAILED"]
      }
    }
    ```

    Which change will meet the requirement?
  fr: |
    Un ingénieur des données a créé la règle Amazon EventBridge suivante sur le bus d'événements par défaut. Sa cible est une rubrique Amazon SNS qui envoie un e-mail à l'équipe d'astreinte. L'équipe doit être prévenue lorsqu'une exécution de tâche AWS Glue échoue ou atteint son délai d'expiration. Les e-mails arrivent pour les exécutions en échec, mais pas pour celles qui expirent.

    ```json
    {
      "source": ["aws.glue"],
      "detail-type": ["Glue Job State Change"],
      "detail": {
        "state": ["FAILED"]
      }
    }
    ```

    Quelle modification répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Replace Glue Job State Change with Glue Job Run Status in the detail-type list.", fr: "Remplacer Glue Job State Change par Glue Job Run Status dans la liste detail-type." } }
    - { id: b, text: { en: "Add TIMEOUT to the state list of the event pattern.", fr: "Ajouter TIMEOUT à la liste state du modèle d'événement." } }
    - { id: c, text: { en: "Set the number of retries of each Glue job to 1.", fr: "Définir le nombre de nouvelles tentatives de chaque tâche Glue à 1." } }
    - { id: d, text: { en: "Move the rule to a new custom event bus dedicated to AWS Glue.", fr: "Déplacer la règle vers un nouveau bus d'événements personnalisé dédié à AWS Glue." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Glue sends Glue Job State Change events for the SUCCEEDED, FAILED, TIMEOUT and STOPPED states. The pattern matches only FAILED, so adding TIMEOUT to detail.state makes the rule also match runs that reach their timeout."
    fr: "AWS Glue envoie des événements Glue Job State Change pour les états SUCCEEDED, FAILED, TIMEOUT et STOPPED. Le modèle ne correspond qu'à FAILED : ajouter TIMEOUT à detail.state permet à la règle de correspondre aussi aux exécutions qui atteignent leur délai d'expiration."
  options:
    a:
      en: "Glue Job Run Status events report runs that exceed the job delay notification threshold while still running; they do not report timeouts."
      fr: "Les événements Glue Job Run Status signalent les exécutions encore en cours qui dépassent le seuil de notification de retard ; ils ne signalent pas les expirations."
    c:
      en: "Retries rerun a failed job; they do not create notifications for timed-out runs."
      fr: "Les nouvelles tentatives relancent une tâche en échec ; elles ne créent pas de notification pour les exécutions expirées."
    d:
      en: "AWS service events such as Glue events arrive on the default event bus, which already receives the failed-run events."
      fr: "Les événements des services AWS comme ceux de Glue arrivent sur le bus d'événements par défaut, qui reçoit déjà les événements d'échec."
references:
  - title: Automating AWS Glue with EventBridge
    url: https://docs.aws.amazon.com/glue/latest/dg/automating-awsglue-with-cloudwatch-events.html
