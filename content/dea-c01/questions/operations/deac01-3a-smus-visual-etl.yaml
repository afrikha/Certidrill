id: deac01-3a-smus-visual-etl
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has adopted Amazon SageMaker Unified Studio. Data engineers in a project must prepare data by joining two AWS Glue Data Catalog tables, filtering the rows, and writing the result to Amazon S3. They want to build the flow in a drag-and-drop interface inside the project, track it in a Git repository, and avoid provisioning or managing clusters.

    Which solution will meet these requirements?
  fr: |
    AnyCompany a adopté Amazon SageMaker Unified Studio. Les ingénieurs data d'un projet doivent préparer des données en joignant deux tables du catalogue de données AWS Glue, en filtrant les lignes et en écrivant le résultat dans Amazon S3. Ils veulent créer le flux dans une interface glisser-déposer au sein du projet, le suivre dans un dépôt Git et éviter de provisionner ou de gérer des clusters.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Visual ETL flow in the project with source, join, filter, and target nodes, which runs on AWS Glue.", fr: "Créer dans le projet un flux Visual ETL avec des nœuds de source, de jointure, de filtre et de cible, qui s'exécute sur AWS Glue." } }
    - { id: b, text: { en: "Write CREATE TABLE AS SELECT statements in the query editor of the project and run them manually.", fr: "Écrire des instructions CREATE TABLE AS SELECT dans l'éditeur de requêtes du projet et les exécuter manuellement." } }
    - { id: c, text: { en: "Create an AWS Quick dataset with calculated fields that joins and filters the two tables.", fr: "Créer un jeu de données AWS Quick avec des champs calculés qui joint et filtre les deux tables." } }
    - { id: d, text: { en: "Create an Amazon EMR on EC2 cluster for the project and write the join and filter in a Spark notebook.", fr: "Créer un cluster Amazon EMR sur EC2 pour le projet et écrire la jointure et le filtre dans un bloc-notes Spark." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Visual ETL in SageMaker Unified Studio is a drag-and-drop interface to connect to data sources, apply transformations, and define targets without writing complex code. Flows are authored on AWS Glue interactive sessions, so no cluster is managed, and Visual ETL jobs can be tracked in a Git repository."
    fr: "Visual ETL dans SageMaker Unified Studio est une interface glisser-déposer pour se connecter à des sources de données, appliquer des transformations et définir des cibles sans écrire de code complexe. Les flux sont créés sur des sessions interactives AWS Glue : aucun cluster n'est à gérer, et les tâches Visual ETL peuvent être suivies dans un dépôt Git."
  options:
    b:
      en: "SQL statements in a query editor are written by hand and are not a drag-and-drop flow."
      fr: "Les instructions SQL d'un éditeur de requêtes sont écrites à la main et ne constituent pas un flux glisser-déposer."
    c:
      en: "AWS Quick is for business intelligence; a dataset for dashboards does not write prepared data to Amazon S3."
      fr: "AWS Quick sert à la Business Intelligence ; un jeu de données pour tableaux de bord n'écrit pas de données préparées dans Amazon S3."
    d:
      en: "An EMR on EC2 cluster must be provisioned and managed, and a notebook is code, not a drag-and-drop flow."
      fr: "Un cluster EMR sur EC2 doit être provisionné et géré, et un bloc-notes est du code, pas un flux glisser-déposer."
references:
  - title: Visual ETL
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/visual-etl.html
