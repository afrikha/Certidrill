id: deac01-3b-athena-spark-addpyfile
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer explores data in an Athena notebook (PySpark engine version 3). The analysis needs an internal package of pure-Python helper functions and a pure-Python library from PyPI. Running pip install in a notebook cell fails.

    Which solution will make both packages available in the notebook session?
  fr: |
    Un ingénieur des données explore des données dans un bloc-notes Athena (PySpark engine version 3). L'analyse a besoin d'un package interne de fonctions utilitaires en pur Python et d'une bibliothèque en pur Python issue de PyPI. L'exécution de pip install dans une cellule du bloc-notes échoue.

    Quelle solution rend les deux packages disponibles dans la session du bloc-notes ?
body:
  options:
    - { id: a, text: { en: "Upload each package as a .zip file to Amazon S3 and add it with sc.addPyFile before importing it.", fr: "Charger chaque package sous forme de fichier .zip dans Amazon S3 et l'ajouter avec sc.addPyFile avant de l'importer." } }
    - { id: b, text: { en: "Run the %pip install magic command in a notebook cell for each package, then restart the session.", fr: "Exécuter la commande magique %pip install dans une cellule pour chaque package, puis redémarrer la session." } }
    - { id: c, text: { en: "Add a bootstrap action to the workgroup that installs both packages when a session starts.", fr: "Ajouter au groupe de travail une action d'amorçage qui installe les deux packages au démarrage d'une session." } }
    - { id: d, text: { en: "Set the --additional-python-modules parameter to the two package names in the session properties.", fr: "Définir le paramètre --additional-python-modules avec le nom des deux packages dans les propriétés de la session." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Athena for Spark does not support pip install in sessions. Python files and libraries are packaged as .zip files, uploaded to Amazon S3 and added with sc.addPyFile, after which they can be imported; the packages must not depend on binary shared objects."
    fr: "Athena for Spark ne prend pas en charge pip install dans les sessions. Les fichiers et bibliothèques Python sont empaquetés en fichiers .zip, chargés dans Amazon S3 et ajoutés avec sc.addPyFile, après quoi ils peuvent être importés ; les packages ne doivent pas dépendre d'objets partagés binaires."
  options:
    b:
      en: "The %pip command currently fails in Athena notebooks, which is a documented known issue."
      fr: "La commande %pip échoue actuellement dans les blocs-notes Athena, ce qui est un problème connu et documenté."
    c:
      en: "Bootstrap actions are an Amazon EMR cluster feature; Athena workgroups do not run them."
      fr: "Les actions d'amorçage sont une fonctionnalité des clusters Amazon EMR ; les groupes de travail Athena ne les exécutent pas."
    d:
      en: "--additional-python-modules is an AWS Glue job parameter, not an Athena for Spark session setting."
      fr: "--additional-python-modules est un paramètre de tâche AWS Glue, pas un paramètre de session Athena for Spark."
references:
  - title: Import files and Python libraries to Athena for Spark
    url: https://docs.aws.amazon.com/athena/latest/ug/notebooks-import-files-libraries.html
  - title: Use magic commands
    url: https://docs.aws.amazon.com/athena/latest/ug/notebooks-spark-magics.html
