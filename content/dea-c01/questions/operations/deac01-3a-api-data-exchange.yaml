id: deac01-3a-api-data-exchange
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The analytics team of AnyCompany wants to enrich its sales data with a weather data API from a third-party provider. The provider offers the API as a product on AWS Data Exchange. The company wants the charges on its AWS bill and does not want to sign a separate contract or set up a separate billing account with the provider.

    Which solution will meet these requirements?
  fr: |
    L'équipe d'analyse d'AnyCompany veut enrichir ses données de ventes avec une API de données météorologiques d'un fournisseur tiers. Le fournisseur propose l'API comme produit sur AWS Data Exchange. L'entreprise veut que les frais figurent sur sa facture AWS et ne veut ni signer un contrat séparé ni ouvrir un compte de facturation distinct chez le fournisseur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon AppFlow flow that connects to the provider API with credentials obtained from the provider.", fr: "Créer un flux Amazon AppFlow qui se connecte à l'API du fournisseur avec des informations d'identification obtenues auprès du fournisseur." } }
    - { id: b, text: { en: "Create an Amazon API Gateway private API that proxies requests to the provider API by using a key bought from the provider.", fr: "Créer une API privée Amazon API Gateway qui relaie les requêtes vers l'API du fournisseur avec une clé achetée auprès du fournisseur." } }
    - { id: c, text: { en: "Subscribe to the API product in AWS Data Exchange and call the API through AWS Data Exchange, for example with the send-api-asset command.", fr: "S'abonner au produit d'API dans AWS Data Exchange et appeler l'API par AWS Data Exchange, par exemple avec la commande send-api-asset." } }
    - { id: d, text: { en: "Ask the provider to export the data to an Amazon S3 bucket every day, and pay the provider directly for the exports.", fr: "Demander au fournisseur d'exporter les données dans un compartiment Amazon S3 chaque jour, et payer directement le fournisseur pour les exports." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Data Exchange products can contain APIs. After subscribing, the subscriber calls the provider's API through AWS Data Exchange, for example with the AWS CLI send-api-asset command, and a paid subscription is billed on the AWS bill."
    fr: "Les produits AWS Data Exchange peuvent contenir des API. Après l'abonnement, l'abonné appelle l'API du fournisseur par AWS Data Exchange, par exemple avec la commande AWS CLI send-api-asset, et un abonnement payant est facturé sur la facture AWS."
  options:
    a:
      en: "Calling the provider directly requires credentials and a billing relationship with the provider."
      fr: "Appeler directement le fournisseur nécessite des informations d'identification et une relation de facturation avec lui."
    b:
      en: "A key bought from the provider means a separate contract and bill, and the proxy adds infrastructure."
      fr: "Une clé achetée auprès du fournisseur implique un contrat et une facture séparés, et le relais ajoute de l'infrastructure."
    d:
      en: "Paying the provider directly is the separate billing relationship that the company wants to avoid."
      fr: "Payer directement le fournisseur correspond à la relation de facturation distincte que l'entreprise veut éviter."
references:
  - title: Subscribing to and accessing an AWS Data Exchange product containing APIs
    url: https://docs.aws.amazon.com/data-exchange/latest/userguide/subscribing-to-API-product.html
