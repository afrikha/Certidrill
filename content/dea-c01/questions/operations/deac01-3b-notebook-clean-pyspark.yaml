id: deac01-3b-notebook-clean-pyspark
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Data engineers want to explore and clean a 2 TB dataset in Amazon S3 interactively by writing PySpark code in Jupyter-compatible notebooks. The tables are registered in the AWS Glue Data Catalog and are not managed by AWS Lake Formation permissions. The engineers do not want to create, size or manage any cluster.

    Which solutions will meet these requirements? (Choose two.)
  fr: |
    Des ingénieurs des données veulent explorer et nettoyer de façon interactive un jeu de données de 2 To dans Amazon S3 en écrivant du code PySpark dans des blocs-notes compatibles Jupyter. Les tables sont enregistrées dans le AWS Glue Data Catalog et ne sont pas gérées par des autorisations AWS Lake Formation. Les ingénieurs ne veulent créer, dimensionner ni gérer aucun cluster.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Launch an Amazon EMR cluster on EC2 with JupyterHub and run the notebooks on it.", fr: "Lancer un cluster Amazon EMR sur EC2 avec JupyterHub et y exécuter les blocs-notes." } }
    - { id: b, text: { en: "Run the code in AWS Glue interactive sessions from a Jupyter notebook.", fr: "Exécuter le code dans des sessions interactives AWS Glue depuis un bloc-notes Jupyter." } }
    - { id: c, text: { en: "Run the code in notebooks of the Amazon Redshift query editor v2.", fr: "Exécuter le code dans des blocs-notes de l'éditeur de requêtes Amazon Redshift v2." } }
    - { id: d, text: { en: "Run the code in an AWS Lambda function invoked from a notebook cell.", fr: "Exécuter le code dans une fonction AWS Lambda appelée depuis une cellule de bloc-notes." } }
    - { id: e, text: { en: "Run the code in an Athena notebook of a workgroup that uses the Apache Spark engine.", fr: "Exécuter le code dans un bloc-notes Athena d'un groupe de travail qui utilise le moteur Apache Spark." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "AWS Glue interactive sessions provide a Jupyter kernel backed by serverless Spark that AWS Glue manages. Athena for Apache Spark runs PySpark in notebooks of a Spark-enabled workgroup and scales the compute automatically; both read Data Catalog tables without any cluster to manage."
    fr: "Les sessions interactives AWS Glue fournissent un noyau Jupyter adossé à un Spark sans serveur géré par AWS Glue. Athena for Apache Spark exécute PySpark dans les blocs-notes d'un groupe de travail Spark et met à l'échelle le calcul automatiquement ; les deux lisent les tables du Data Catalog sans cluster à gérer."
  options:
    a:
      en: "An EMR cluster on EC2 must be created, sized and managed by the team."
      fr: "Un cluster EMR sur EC2 doit être créé, dimensionné et géré par l'équipe."
    c:
      en: "Query editor v2 notebooks run SQL against Redshift; they do not run PySpark."
      fr: "Les blocs-notes de l'éditeur de requêtes v2 exécutent du SQL sur Redshift ; ils n'exécutent pas PySpark."
    d:
      en: "A Lambda function is not an interactive Spark environment, and a single invocation does not distribute the processing of 2 TB across workers."
      fr: "Une fonction Lambda n'est pas un environnement Spark interactif, et une seule invocation ne répartit pas le traitement de 2 To entre des nœuds de calcul."
references:
  - title: Building AWS Glue jobs with interactive sessions
    url: https://docs.aws.amazon.com/glue/latest/dg/interactive-sessions-overview.html
  - title: Use Apache Spark in Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/notebooks-spark.html
