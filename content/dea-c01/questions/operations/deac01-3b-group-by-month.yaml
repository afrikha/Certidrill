id: deac01-3b-group-by-month
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Athena table orders has the columns order_id, region, order_date (type date) and amount. A report needs the total revenue for each region and calendar month, with one row per region and month.

    Which query will meet this requirement?
  fr: |
    La table Athena orders contient les colonnes order_id, region, order_date (type date) et amount. Un rapport a besoin du chiffre d'affaires total par région et par mois calendaire, avec une ligne par région et par mois.

    Quelle requête répond à cette exigence ?
body:
  options:
    - { id: a, text: "`SELECT region, date_trunc('month', order_date) AS month, SUM(amount) AS revenue FROM orders GROUP BY region, date_trunc('month', order_date)`" }
    - { id: b, text: "`SELECT region, order_date, SUM(amount) AS revenue FROM orders WHERE day(order_date) = 1 GROUP BY region, order_date`" }
    - { id: c, text: "`SELECT region, SUM(amount) AS revenue FROM orders GROUP BY region`" }
    - { id: d, text: "`SELECT DISTINCT region, date_trunc('month', order_date) AS month, SUM(amount) OVER (PARTITION BY region) AS revenue FROM orders`" }
answer: { optionId: a }
explanation:
  correct:
    en: "date_trunc('month', order_date) maps every date to the first day of its month, and grouping by region and that expression aggregates the amounts into one row per region and month."
    fr: "date_trunc('month', order_date) ramène chaque date au premier jour de son mois, et le regroupement par région et par cette expression agrège les montants en une ligne par région et par mois."
  options:
    b:
      en: "This keeps only the orders placed on the first day of each month instead of summing the whole month."
      fr: "Cette requête ne garde que les commandes passées le premier jour de chaque mois au lieu d'additionner tout le mois."
    c:
      en: "Grouping by region alone returns one total per region over all months."
      fr: "Regrouper uniquement par région renvoie un total par région, tous mois confondus."
    d:
      en: "DISTINCT removes duplicate rows, but the window function computes on each row the total of the region over all months, not per month."
      fr: "DISTINCT supprime les lignes en double, mais la fonction de fenêtrage calcule sur chaque ligne le total de la région tous mois confondus, et non par mois."
references:
  - title: SELECT
    url: https://docs.aws.amazon.com/athena/latest/ug/select.html
