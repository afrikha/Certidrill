id: deac01-3a-api-destination-rate
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany publishes order change events to a custom Amazon EventBridge event bus. A logistics partner must receive each event through its REST endpoint, which requires an API key header and accepts at most 20 requests per second. If the partner endpoint is unavailable for longer than EventBridge keeps retrying, the undelivered events must be kept for later processing. The company does not want to write or host any code for the delivery.

    Which solution will meet these requirements?
  fr: |
    AnyCompany publie des événements de modification de commande sur un bus d'événements personnalisé Amazon EventBridge. Un partenaire logistique doit recevoir chaque événement par son point de terminaison REST, qui exige un en-tête de clé d'API et accepte au plus 20 requêtes par seconde. Si le point de terminaison du partenaire est indisponible plus longtemps qu'EventBridge ne retente la livraison, les événements non livrés doivent être conservés pour un traitement ultérieur. L'entreprise ne veut écrire ni héberger aucun code pour la livraison.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a rule whose target is a Lambda function that calls the partner endpoint with the API key stored in an environment variable.", fr: "Créer une règle dont la cible est une fonction Lambda qui appelle le point de terminaison du partenaire avec la clé d'API stockée dans une variable d'environnement." } }
    - { id: b, text: { en: "Create a rule whose target is an API destination with an API key connection and no invocation rate limit, and rely on the endpoint to reject excess requests.", fr: "Créer une règle dont la cible est une destination d'API avec une connexion par clé d'API et sans limite de taux d'appel, et compter sur le point de terminaison pour rejeter les requêtes en trop." } }
    - { id: c, text: { en: "Create a rule whose target is an Amazon SQS queue, and give the partner credentials to poll the queue instead of calling its endpoint.", fr: "Créer une règle dont la cible est une file d'attente Amazon SQS, et donner au partenaire des informations d'identification pour interroger la file au lieu d'appeler son point de terminaison." } }
    - { id: d, text: { en: "Create a rule whose target is an API destination with an API key connection, an invocation rate of 20 per second, and an Amazon SQS dead-letter queue.", fr: "Créer une règle dont la cible est une destination d'API avec une connexion par clé d'API, un taux d'appel de 20 par seconde et une file d'attente de lettres mortes Amazon SQS." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An API destination sends matching events to an HTTPS endpoint, with the credentials held in a connection that EventBridge stores in Secrets Manager. Its invocation rate per second limits the calls, events above the rate wait in a backlog, and events that exhaust the retry policy go to the dead-letter queue instead of being dropped."
    fr: "Une destination d'API envoie les événements correspondants vers un point de terminaison HTTPS, avec les informations d'identification conservées dans une connexion qu'EventBridge stocke dans Secrets Manager. Son taux d'appel par seconde limite les appels, les événements au-delà du taux attendent dans un arriéré, et ceux qui épuisent la politique de nouvelles tentatives vont dans la file d'attente de lettres mortes au lieu d'être supprimés."
  options:
    a:
      en: "The Lambda function is custom code to write and maintain, and nothing limits its calls to 20 per second."
      fr: "La fonction Lambda est du code personnalisé à écrire et maintenir, et rien ne limite ses appels à 20 par seconde."
    b:
      en: "Without a rate limit the endpoint is flooded, and without a dead-letter queue events that exhaust retries are dropped."
      fr: "Sans limite de taux, le point de terminaison est submergé, et sans file d'attente de lettres mortes les événements qui épuisent les nouvelles tentatives sont supprimés."
    c:
      en: "The partner must receive events through its REST endpoint; polling a queue requires the partner to build a consumer."
      fr: "Le partenaire doit recevoir les événements par son point de terminaison REST ; interroger une file lui impose de développer un consommateur."
references:
  - title: API destinations as targets in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
