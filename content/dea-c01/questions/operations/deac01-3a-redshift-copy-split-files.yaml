id: deac01-3a-redshift-copy-split-files
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Each night, AnyCompany exports its orders as one 60 GB GZIP-compressed CSV file to Amazon S3 and loads it into an Amazon Redshift provisioned cluster that has 16 slices by running one COPY command. The load takes several hours, and the cluster is mostly idle during the load. The company can change how the export writes its files.

    Which solution will make the load faster?
  fr: |
    Chaque nuit, AnyCompany exporte ses commandes sous la forme d'un fichier CSV de 60 Go compressé en GZIP dans Amazon S3 et le charge dans un cluster provisionné Amazon Redshift de 16 tranches (slices) avec une commande COPY. Le chargement dure plusieurs heures, et le cluster est presque inactif pendant le chargement. L'entreprise peut modifier la façon dont l'export écrit ses fichiers.

    Quelle solution accélère le chargement ?
body:
  options:
    - { id: a, text: { en: "Keep the single file and run the COPY command with the PARALLEL ON option.", fr: "Conserver le fichier unique et exécuter la commande COPY avec l'option PARALLEL ON." } }
    - { id: b, text: { en: "Load the rows with batched INSERT statements sent through the Amazon Redshift Data API.", fr: "Charger les lignes avec des instructions INSERT par lots envoyées par l'API de données Amazon Redshift." } }
    - { id: c, text: { en: "Run VACUUM and ANALYZE on the target table before each COPY command.", fr: "Exécuter VACUUM et ANALYZE sur la table cible avant chaque commande COPY." } }
    - { id: d, text: { en: "Write the export as a multiple of 16 GZIP files of similar size under one prefix, and load them with one COPY command.", fr: "Écrire l'export sous forme d'un multiple de 16 fichiers GZIP de taille similaire sous un même préfixe, et les charger avec une commande COPY." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A compressed CSV file cannot be split, so COPY loads it serially on one slice. Splitting the data into similar-size compressed files (about 1 MB to 1 GB after compression), in a number that is a multiple of the slice count, lets one COPY over the prefix spread the work across all slices."
    fr: "Un fichier CSV compressé ne peut pas être fractionné : COPY le charge en série sur une seule tranche. Fractionner les données en fichiers compressés de taille similaire (environ 1 Mo à 1 Go après compression), en un nombre multiple du nombre de tranches, permet à une seule commande COPY sur le préfixe de répartir le travail sur toutes les tranches."
  options:
    a:
      en: "PARALLEL is an UNLOAD option, not a COPY option, and a single GZIP file still cannot be split."
      fr: "PARALLEL est une option d'UNLOAD, pas de COPY, et un fichier GZIP unique ne peut toujours pas être fractionné."
    b:
      en: "Row-by-row or batched INSERT statements are far slower than a parallel COPY for bulk loads."
      fr: "Des instructions INSERT ligne par ligne ou par lots sont bien plus lentes qu'un COPY parallèle pour les chargements en masse."
    c:
      en: "Table maintenance does not change the serialized read of a single compressed file."
      fr: "La maintenance de la table ne change pas la lecture en série d'un fichier compressé unique."
references:
  - title: Loading data files
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_best-practices-use-multiple-files.html
