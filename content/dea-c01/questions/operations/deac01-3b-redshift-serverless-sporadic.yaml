id: deac01-3b-redshift-serverless-sporadic
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing analytics team runs SQL reports on Amazon Redshift a few times per week at unpredictable times, and each session lasts less than an hour. The current provisioned cluster runs 24 hours a day and is idle most of the time. The team wants to stop paying for idle compute capacity and to stop choosing node types, resizing the cluster and planning pause schedules.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'analyse marketing exécute des rapports SQL sur Amazon Redshift quelques fois par semaine à des heures imprévisibles, et chaque session dure moins d'une heure. Le cluster provisionné actuel fonctionne 24 heures sur 24 et reste inactif la plupart du temps. L'équipe veut cesser de payer pour une capacité de calcul inactive et ne plus avoir à choisir des types de nœuds, redimensionner le cluster ou planifier des pauses.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Purchase reserved nodes for the provisioned cluster for a 1-year term.", fr: "Acheter des nœuds réservés pour le cluster provisionné pour une durée d'un an." } }
    - { id: b, text: { en: "Turn on concurrency scaling for the provisioned cluster.", fr: "Activer la mise à l'échelle de la simultanéité (concurrency scaling) pour le cluster provisionné." } }
    - { id: c, text: { en: "Create an Amazon EventBridge Scheduler schedule that pauses the cluster at night and resumes it in the morning.", fr: "Créer une planification Amazon EventBridge Scheduler qui met le cluster en pause la nuit et le réactive le matin." } }
    - { id: d, text: { en: "Migrate the data warehouse to Amazon Redshift Serverless.", fr: "Migrer l'entrepôt de données vers Amazon Redshift Serverless." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Redshift Serverless provisions and scales capacity automatically, has no node types or resizing, and needs no pause or resume. Compute is billed in RPU-hours per second, with a 60-second minimum, when queries run, which suits a sporadic workload; storage is billed separately."
    fr: "Redshift Serverless provisionne et met à l'échelle la capacité automatiquement, n'a ni types de nœuds ni redimensionnement, et ne nécessite ni pause ni reprise. Le calcul est facturé en RPU-heures à la seconde, avec un minimum de 60 secondes, lorsque des requêtes s'exécutent, ce qui convient à une charge sporadique ; le stockage est facturé séparément."
  options:
    a:
      en: "Reserved nodes lower the hourly rate but the cluster is still paid for 24 hours a day, and node management remains."
      fr: "Les nœuds réservés réduisent le tarif horaire, mais le cluster reste payé 24 heures sur 24 et la gestion des nœuds demeure."
    b:
      en: "Concurrency scaling adds capacity during peaks; it does not remove the cost of the idle main cluster."
      fr: "La mise à l'échelle de la simultanéité ajoute de la capacité lors des pics ; elle ne supprime pas le coût du cluster principal inactif."
    c:
      en: "Reports run at unpredictable times, so a fixed schedule does not match them, and the team would still manage pauses and nodes."
      fr: "Les rapports s'exécutent à des heures imprévisibles : une planification fixe ne leur correspond pas, et l'équipe gérerait encore les pauses et les nœuds."
references:
  - title: Comparing Amazon Redshift Serverless to an Amazon Redshift provisioned data warehouse
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-console-comparison.html
