id: deac01-3a-mwaa-missing-provider
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data engineer copies a new DAG file to the dags folder of an Amazon MWAA environment. The DAG imports an operator from an Apache Airflow provider package that is not installed in the environment. The DAG does not appear in the Airflow UI, and the DAG processing log group shows a ModuleNotFoundError for the provider package.

    Which combination of actions will resolve the issue? (Choose two.)
  fr: |
    Un ingénieur data copie un nouveau fichier DAG dans le dossier dags d'un environnement Amazon MWAA. Le DAG importe un opérateur d'un package de fournisseur Apache Airflow qui n'est pas installé dans l'environnement. Le DAG n'apparaît pas dans l'interface Airflow, et le groupe de journaux de traitement des DAG affiche une erreur ModuleNotFoundError pour le package de fournisseur.

    Quelle combinaison d'actions résout le problème ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the provider package with a pinned version to requirements.txt, after the constraint line, and upload the file to the environment's S3 bucket.", fr: "Ajouter le package de fournisseur avec une version épinglée dans requirements.txt, après la ligne de contrainte, et charger le fichier dans le compartiment S3 de l'environnement." } }
    - { id: b, text: { en: "Add a BashOperator task at the start of the DAG that runs pip install for the provider package.", fr: "Ajouter au début du DAG une tâche BashOperator qui exécute pip install pour le package de fournisseur." } }
    - { id: c, text: { en: "Raise the maximum number of workers of the environment so that the scheduler has more capacity to parse the DAG.", fr: "Augmenter le nombre maximal de workers de l'environnement pour que le planificateur ait plus de capacité pour analyser le DAG." } }
    - { id: d, text: { en: "Edit the environment, select the new version of requirements.txt, and update the environment.", fr: "Modifier l'environnement, sélectionner la nouvelle version de requirements.txt et mettre à jour l'environnement." } }
    - { id: e, text: { en: "Set the log level of the DAG processing logs to CRITICAL so that the import error no longer blocks the DAG.", fr: "Définir le niveau de journalisation des journaux de traitement des DAG sur CRITICAL pour que l'erreur d'importation ne bloque plus le DAG." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Amazon MWAA installs Python dependencies from requirements.txt on the scheduler and workers. After uploading the new file to the versioned S3 bucket, the engineer must select that file version on the environment and update the environment; the package is available when the update finishes, and the install log is in the scheduler log group."
    fr: "Amazon MWAA installe les dépendances Python depuis requirements.txt sur le planificateur et les workers. Après avoir chargé le nouveau fichier dans le compartiment S3 versionné, l'ingénieur doit sélectionner cette version du fichier dans l'environnement et mettre à jour l'environnement ; le package est disponible à la fin de la mise à jour, et le journal d'installation se trouve dans le groupe de journaux du planificateur."
  options:
    b:
      en: "The DAG cannot be parsed because of the import error, so none of its tasks, including the BashOperator task, can run."
      fr: "Le DAG ne peut pas être analysé à cause de l'erreur d'importation : aucune de ses tâches, y compris la tâche BashOperator, ne peut s'exécuter."
    c:
      en: "More workers do not install a missing package; the import fails on every component."
      fr: "Davantage de workers n'installent pas un package manquant ; l'importation échoue sur chaque composant."
    e:
      en: "The log level only filters which messages are sent to CloudWatch Logs; it does not fix the import."
      fr: "Le niveau de journalisation filtre seulement les messages envoyés à CloudWatch Logs ; il ne corrige pas l'importation."
references:
  - title: Installing Python dependencies
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/working-dags-dependencies.html
