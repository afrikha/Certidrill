id: deac01-3b-athena-query-text-audit
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Compliance rules require a company to keep, for 2 years, the SQL text, the workgroup and the final state of every query that runs in Athena. A CloudTrail trail already delivers management events to Amazon S3, but auditors found that the StartQueryExecution records in the trail do not contain the query text.

    Which solution will meet these requirements?
  fr: |
    Des règles de conformité imposent à une entreprise de conserver pendant 2 ans le texte SQL, le groupe de travail et l'état final de chaque requête exécutée dans Athena. Un journal de suivi CloudTrail livre déjà les événements de gestion dans Amazon S3, mais les auditeurs ont constaté que les enregistrements StartQueryExecution du journal de suivi ne contiennent pas le texte des requêtes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the query history retention of each Athena workgroup to 2 years and export the history to Amazon S3 every month.", fr: "Porter à 2 ans la conservation de l'historique des requêtes de chaque groupe de travail Athena et exporter cet historique dans Amazon S3 chaque mois." } }
    - { id: b, text: { en: "Use an EventBridge rule on Athena Query State Change events to invoke a Lambda function that saves the GetQueryExecution output to S3.", fr: "Utiliser une règle EventBridge sur les événements Athena Query State Change pour appeler une fonction Lambda qui enregistre la sortie de GetQueryExecution dans S3." } }
    - { id: c, text: { en: "Turn on S3 server access logging for the query results bucket and keep the access logs for 2 years with an S3 Lifecycle rule.", fr: "Activer la journalisation des accès au serveur S3 pour le compartiment des résultats de requêtes et conserver ces journaux 2 ans avec une règle S3 Lifecycle." } }
    - { id: d, text: { en: "Configure the trail to log both read and write management events for Athena, and keep the trail's log files in Amazon S3 for 2 years.", fr: "Configurer le journal de suivi pour journaliser les événements de gestion Athena en lecture et en écriture, et conserver ses fichiers journaux dans Amazon S3 pendant 2 ans." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudTrail records queryString as ***OMITTED*** by design, and Athena keeps its query history for only 45 days. Athena Query State Change events carry the queryExecutionId, workgroupName and currentState, so a function triggered by them can call GetQueryExecution right away and store the SQL text with the other details for 2 years."
    fr: "CloudTrail enregistre queryString sous la forme ***OMITTED***, par conception, et Athena ne conserve son historique de requêtes que 45 jours. Les événements Athena Query State Change portent queryExecutionId, workgroupName et currentState : une fonction déclenchée par ces événements peut appeler GetQueryExecution aussitôt et stocker le texte SQL avec les autres détails pendant 2 ans."
  options:
    a:
      en: "Athena keeps query history for 45 days; the retention is not a workgroup setting that can be raised."
      fr: "Athena conserve l'historique des requêtes 45 jours ; cette durée n'est pas un paramètre de groupe de travail que l'on peut augmenter."
    d:
      en: "Logging read events adds calls such as GetQueryResults, but every StartQueryExecution record still omits the query text."
      fr: "Journaliser les événements en lecture ajoute des appels comme GetQueryResults, mais chaque enregistrement StartQueryExecution omet toujours le texte de la requête."
    c:
      en: "Server access logs record requests to result objects, not the SQL text or the workgroup of each query."
      fr: "Les journaux d'accès au serveur enregistrent les requêtes sur les objets de résultats, et non le texte SQL ou le groupe de travail de chaque requête."
references:
  - title: Log Amazon Athena API calls with AWS CloudTrail
    url: https://docs.aws.amazon.com/athena/latest/ug/monitor-with-cloudtrail.html
  - title: Monitor Athena query events with EventBridge
    url: https://docs.aws.amazon.com/athena/latest/ug/athena-events.html
