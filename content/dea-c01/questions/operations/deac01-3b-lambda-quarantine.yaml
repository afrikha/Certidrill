id: deac01-3b-lambda-quarantine
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Suppliers upload small CSV files (under 1 MB) to the incoming/ prefix of an Amazon S3 bucket, a few hundred files per day at irregular times. Each file must be checked within a minute of its arrival: if its header row does not match the expected columns, the file must be moved to the quarantine/ prefix of the same bucket. The solution must not require managing servers and must be the MOST cost-effective.

    Which solution will meet these requirements?
  fr: |
    Des fournisseurs chargent de petits fichiers CSV (moins de 1 Mo) dans le préfixe incoming/ d'un compartiment Amazon S3, quelques centaines de fichiers par jour à des heures irrégulières. Chaque fichier doit être vérifié dans la minute qui suit son arrivée : si sa ligne d'en-tête ne correspond pas aux colonnes attendues, le fichier doit être déplacé vers le préfixe quarantine/ du même compartiment. La solution ne doit pas exiger de gérer des serveurs et doit être la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Invoke an AWS Lambda function from an S3 event notification on the incoming/ prefix to check each header and move invalid files.", fr: "Appeler une fonction AWS Lambda depuis une notification d'événement S3 sur le préfixe incoming/ pour vérifier chaque en-tête et déplacer les fichiers non valides." } }
    - { id: b, text: { en: "Run a long-running Amazon EMR cluster with a Spark Structured Streaming job that watches the incoming/ prefix and moves invalid files.", fr: "Exécuter un cluster Amazon EMR permanent avec une tâche Spark Structured Streaming qui surveille le préfixe incoming/ et déplace les fichiers non valides." } }
    - { id: c, text: { en: "Run an AWS Glue crawler on the incoming/ prefix every hour, review the schema changes it reports, and move the invalid files.", fr: "Exécuter toutes les heures un robot d'indexation AWS Glue sur le préfixe incoming/, examiner les changements de schéma signalés et déplacer les fichiers non valides." } }
    - { id: d, text: { en: "Schedule an AWS Glue Spark job every hour that checks all new files in incoming/ and moves the invalid ones to quarantine/.", fr: "Planifier toutes les heures une tâche AWS Glue Spark qui vérifie tous les nouveaux fichiers de incoming/ et déplace les fichiers non valides vers quarantine/." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon S3 invokes the Lambda function asynchronously as soon as each object is created, and the function is billed only for the few seconds it runs per file. Limiting the notification to the incoming/ prefix also prevents the function from triggering itself when it writes to quarantine/."
    fr: "Amazon S3 appelle la fonction Lambda de façon asynchrone dès la création de chaque objet, et la fonction n'est facturée que pour les quelques secondes d'exécution par fichier. Limiter la notification au préfixe incoming/ évite aussi que la fonction ne se déclenche elle-même lorsqu'elle écrit dans quarantine/."
  options:
    b:
      en: "A permanent EMR cluster means managing servers and paying for them all day for a few hundred small files."
      fr: "Un cluster EMR permanent implique de gérer des serveurs et de les payer toute la journée pour quelques centaines de petits fichiers."
    c:
      en: "A crawler only updates the Data Catalog schema, so files would be checked and moved by hand, and not within a minute."
      fr: "Un robot d'indexation ne fait que mettre à jour le schéma du Data Catalog : les fichiers seraient vérifiés et déplacés à la main, et pas en une minute."
    d:
      en: "An hourly schedule misses the one-minute requirement, and Spark is more costly than Lambda for files this small."
      fr: "Une planification horaire ne respecte pas l'exigence d'une minute, et Spark coûte plus cher que Lambda pour des fichiers aussi petits."
references:
  - title: Process Amazon S3 event notifications with Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html
