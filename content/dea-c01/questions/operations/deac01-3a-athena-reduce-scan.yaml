id: deac01-3a-athena-reduce-scan
objective: "3.1.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany stores 20 TB of clickstream data as uncompressed CSV files in one Amazon S3 prefix. Analysts use Amazon Athena, and most queries filter on event_date and read 4 of the 60 columns. The company wants to reduce the amount of data that each query scans.

    Which combination of actions will meet this requirement? (Choose two.)
  fr: |
    AnyCompany stocke 20 To de données de parcours de navigation sous forme de fichiers CSV non compressés dans un seul préfixe Amazon S3. Les analystes utilisent Amazon Athena, et la plupart des requêtes filtrent sur event_date et lisent 4 des 60 colonnes. L'entreprise veut réduire la quantité de données analysées par chaque requête.

    Quelle combinaison d'actions répond à cette exigence ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Convert the data to Apache Parquet with Snappy compression.", fr: "Convertir les données en Apache Parquet avec compression Snappy." } }
    - { id: b, text: { en: "Configure a per-query data usage control on the workgroup.", fr: "Configurer un contrôle de l'utilisation des données par requête sur le groupe de travail." } }
    - { id: c, text: { en: "Move the CSV files to the S3 Standard-IA storage class.", fr: "Déplacer les fichiers CSV vers la classe de stockage S3 Standard-IA." } }
    - { id: d, text: { en: "Partition the data by event_date and filter on the partition column in the queries.", fr: "Partitionner les données par event_date et filtrer sur la colonne de partition dans les requêtes." } }
    - { id: e, text: { en: "Split the CSV files into many files of a few kilobytes each.", fr: "Fractionner les fichiers CSV en de nombreux fichiers de quelques kilo-octets chacun." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "With a columnar format such as Parquet, Athena reads only the columns that a query needs and can skip data by using file metadata, and compression lowers the bytes scanned. Partitioning by event_date lets Athena read only the partitions that match the filter."
    fr: "Avec un format en colonnes comme Parquet, Athena ne lit que les colonnes nécessaires à la requête et peut ignorer des données grâce aux métadonnées des fichiers, et la compression réduit les octets analysés. Le partitionnement par event_date permet à Athena de ne lire que les partitions qui correspondent au filtre."
  options:
    b:
      en: "A per-query limit cancels queries that scan too much; it does not make queries scan less."
      fr: "Une limite par requête annule les requêtes qui analysent trop de données ; elle ne réduit pas les données analysées."
    c:
      en: "The storage class changes the storage price, not the bytes that a query reads."
      fr: "La classe de stockage change le prix du stockage, pas les octets lus par une requête."
    e:
      en: "Many small files add listing and request overhead and do not reduce the data read."
      fr: "De nombreux petits fichiers ajoutent une surcharge de listage et de requêtes et ne réduisent pas les données lues."
references:
  - title: Optimize data
    url: https://docs.aws.amazon.com/athena/latest/ug/performance-tuning-data-optimization-techniques.html
