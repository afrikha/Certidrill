id: deac01-3c-logs-insights-plus-athena
objective: "3.3.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's ingestion pipeline writes structured JSON logs to Amazon CloudWatch Logs, where they are kept for 30 days. A subscription filter also copies every event through Amazon Data Firehose to an Amazon S3 bucket, where the logs are kept for 3 years. During incidents, on-call engineers must query the events of the last few hours immediately, with no data movement. Each month, analysts must run SQL reports over 3 years of logs. The company does not want to manage servers or clusters.

    Which combination of services will meet these requirements? (Choose two.)
  fr: |
    Le pipeline d'ingestion d'AnyCompany écrit des journaux JSON structurés dans Amazon CloudWatch Logs, où ils sont conservés 30 jours. Un filtre d'abonnement copie aussi chaque événement, via Amazon Data Firehose, dans un compartiment Amazon S3 où les journaux sont conservés 3 ans. Pendant les incidents, les ingénieurs d'astreinte doivent interroger immédiatement les événements des dernières heures, sans déplacement de données. Chaque mois, les analystes doivent exécuter des rapports SQL sur 3 ans de journaux. L'entreprise ne veut pas gérer de serveurs ni de clusters.

    Quelle combinaison de services répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "CloudWatch Logs Insights queries on the log groups for the incident investigations", fr: "Des requêtes CloudWatch Logs Insights sur les groupes de journaux pour les investigations d'incident" } }
    - { id: b, text: { en: "A provisioned Amazon OpenSearch Service domain that indexes the 3 years of logs for the monthly reports", fr: "Un domaine Amazon OpenSearch Service provisionné qui indexe les 3 ans de journaux pour les rapports mensuels" } }
    - { id: c, text: { en: "Amazon Athena queries on a Data Catalog table over the S3 log files for the monthly reports", fr: "Des requêtes Amazon Athena sur une table du Data Catalog qui pointe vers les fichiers journaux S3 pour les rapports mensuels" } }
    - { id: d, text: { en: "A long-running Amazon EMR cluster with Apache Hive for the incident investigations", fr: "Un cluster Amazon EMR de longue durée avec Apache Hive pour les investigations d'incident" } }
    - { id: e, text: { en: "CloudWatch Logs export tasks to S3 followed by Athena queries for the incident investigations", fr: "Des tâches d'exportation CloudWatch Logs vers S3 suivies de requêtes Athena pour les investigations d'incident" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Logs Insights queries the events already in the log groups, discovers JSON fields automatically and needs no setup or data movement, which suits recent events during incidents. Athena runs serverless SQL directly on the S3 copy, which covers the 3-year history that CloudWatch Logs no longer keeps."
    fr: "Logs Insights interroge les événements déjà présents dans les groupes de journaux, découvre automatiquement les champs JSON et ne nécessite ni configuration ni déplacement de données, ce qui convient aux événements récents pendant les incidents. Athena exécute du SQL sans serveur directement sur la copie S3, ce qui couvre l'historique de 3 ans que CloudWatch Logs ne conserve plus."
  options:
    b:
      en: "A provisioned domain is a cluster to size and manage, and indexing 3 years of logs for a monthly report is costly."
      fr: "Un domaine provisionné est un cluster à dimensionner et à gérer, et indexer 3 ans de journaux pour un rapport mensuel est coûteux."
    d:
      en: "An EMR cluster is managed infrastructure, which the company excludes, and it adds data movement for recent events."
      fr: "Un cluster EMR est une infrastructure gérée, que l'entreprise exclut, et il ajoute un déplacement de données pour les événements récents."
    e:
      en: "Export tasks move data and take time to complete, so they do not give immediate answers during an incident."
      fr: "Les tâches d'exportation déplacent des données et prennent du temps : elles ne donnent pas de réponse immédiate pendant un incident."
references:
  - title: CloudWatch Logs Insights language query syntax
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax.html
