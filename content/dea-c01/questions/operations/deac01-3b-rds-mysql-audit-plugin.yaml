id: deac01-3b-rds-mysql-audit-plugin
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data pipeline extracts data from an Amazon RDS for MySQL 8.0 DB instance. Auditors require a record of every connection to the database and of every DDL and DCL statement that runs on it. The records must be searchable in Amazon CloudWatch Logs and kept for 1 year.

    Which solution will meet these requirements?
  fr: |
    Un pipeline de données extrait des données d'une instance de base de données Amazon RDS for MySQL 8.0. Les auditeurs exigent un enregistrement de chaque connexion à la base de données et de chaque instruction DDL et DCL qui y est exécutée. Les enregistrements doivent être consultables dans Amazon CloudWatch Logs et conservés pendant 1 an.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable the slow query log in the DB parameter group, publish the log to CloudWatch Logs, and set the retention of its log group to 1 year.", fr: "Activer le journal des requêtes lentes dans le groupe de paramètres de base de données, publier ce journal dans CloudWatch Logs et définir la conservation de son groupe de journaux à 1 an." } }
    - { id: b, text: { en: "Add the MARIADB_AUDIT_PLUGIN option to an option group, publish the audit log to CloudWatch Logs, and set a 1-year log group retention.", fr: "Ajouter l'option MARIADB_AUDIT_PLUGIN à un groupe d'options, publier le journal d'audit dans CloudWatch Logs et définir une conservation d'un an pour le groupe de journaux." } }
    - { id: c, text: { en: "Turn on Performance Insights for the DB instance with a 1-year retention period and review the top SQL statements that it records.", fr: "Activer Performance Insights pour l'instance de base de données avec une période de conservation d'un an et examiner les principales instructions SQL qu'il enregistre." } }
    - { id: d, text: { en: "Create a CloudTrail trail for Amazon RDS management events and send it to a CloudWatch Logs log group with 1-year retention.", fr: "Créer un journal de suivi CloudTrail pour les événements de gestion Amazon RDS et l'envoyer à un groupe de journaux CloudWatch Logs avec une conservation d'un an." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon RDS for MySQL provides an audit plugin based on the MariaDB Audit Plugin, added through an option group; its SERVER_AUDIT_EVENTS setting records connections and query text (CONNECT and QUERY by default) and can be narrowed to QUERY_DDL and QUERY_DCL. The audit log can then be published to CloudWatch Logs, where data is kept indefinitely unless a retention period, such as 1 year, is set on the log group."
    fr: "Amazon RDS for MySQL fournit un plugin d'audit basé sur le MariaDB Audit Plugin, ajouté via un groupe d'options ; son paramètre SERVER_AUDIT_EVENTS enregistre les connexions et le texte des requêtes (CONNECT et QUERY par défaut) et peut être limité à QUERY_DDL et QUERY_DCL. Le journal d'audit peut ensuite être publié dans CloudWatch Logs, où les données sont conservées indéfiniment sauf si une période de conservation, par exemple 1 an, est définie sur le groupe de journaux."
  options:
    a:
      en: "The slow query log records only queries that exceed a duration threshold, not every connection and DDL or DCL statement."
      fr: "Le journal des requêtes lentes n'enregistre que les requêtes qui dépassent un seuil de durée, et non chaque connexion et instruction DDL ou DCL."
    d:
      en: "CloudTrail records RDS API calls, such as instance modifications, not the SQL statements run inside the database."
      fr: "CloudTrail enregistre les appels d'API RDS, comme les modifications d'instance, et non les instructions SQL exécutées dans la base de données."
    c:
      en: "Performance Insights analyzes database load for tuning; it is not an audit record of connections and statements."
      fr: "Performance Insights analyse la charge de la base de données pour l'optimisation ; ce n'est pas un enregistrement d'audit des connexions et des instructions."
references:
  - title: MariaDB Audit Plugin support for MySQL
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Appendix.MySQL.Options.AuditPlugin.html
  - title: Publishing database logs to Amazon CloudWatch Logs
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_LogAccess.Procedural.UploadtoCloudWatch.html
