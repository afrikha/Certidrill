id: deac01-3c-dqdl-referential-orphans
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Analysts report that some sales in a curated dataset cannot be joined to any customer. The sales and customers datasets are processed in the same AWS Glue ETL job, and the customers dataset is added to the Evaluate Data Quality transform as a reference dataset with the alias customers. Both datasets have an integer column named customer_id. The data engineer needs a rule that fails whenever a customer_id value in the sales data does not exist in the customers data.

    Which DQDL rule will meet this requirement?
  fr: |
    Des analystes signalent que certaines ventes d'un jeu de données organisé ne peuvent être jointes à aucun client. Les jeux de données des ventes et des clients sont traités dans la même tâche ETL AWS Glue, et le jeu de données des clients est ajouté à la transformation Evaluate Data Quality comme jeu de données de référence avec l'alias customers. Les deux jeux de données ont une colonne d'entiers nommée customer_id. L'ingénieur des données a besoin d'une règle qui échoue chaque fois qu'une valeur customer_id des ventes n'existe pas dans les données des clients.

    Quelle règle DQDL répond à cette exigence ?
body:
  options:
    - { id: a, text: '`IsComplete "customer_id"`' }
    - { id: b, text: '`ReferentialIntegrity "customer_id" "customers.customer_id" = 1.0`' }
    - { id: c, text: '`ReferentialIntegrity "customer_id" "customers.customer_id" >= 0.9`' }
    - { id: d, text: '`IsUnique "customer_id"`' }
answer: { optionId: b }
explanation:
  correct:
    en: "ReferentialIntegrity measures to what extent the values of columns in the primary dataset are a subset of the values of columns in a reference dataset, named as alias.column. Requiring a result of 1.0 means that every customer_id of the sales exists in the customers data, so any orphan sale fails the rule."
    fr: "ReferentialIntegrity mesure dans quelle mesure les valeurs de colonnes du jeu de données principal sont un sous-ensemble des valeurs de colonnes d'un jeu de données de référence, désigné par alias.colonne. Exiger un résultat de 1.0 signifie que chaque customer_id des ventes existe dans les données des clients : toute vente orpheline fait échouer la règle."
  options:
    a:
      en: "IsComplete checks that customer_id is never null; an orphan sale has a value that simply does not exist in the reference data."
      fr: "IsComplete vérifie que customer_id n'est jamais nul ; une vente orpheline a une valeur qui n'existe simplement pas dans les données de référence."
    c:
      en: "This threshold accepts up to 10% of orphan sales, so the rule would pass while some sales still cannot be joined."
      fr: "Ce seuil accepte jusqu'à 10 % de ventes orphelines : la règle réussirait alors que certaines ventes ne peuvent toujours pas être jointes."
    d:
      en: "IsUnique checks for duplicates within the sales data; many sales can legitimately share a customer."
      fr: "IsUnique vérifie les doublons dans les données de ventes ; de nombreuses ventes peuvent légitimement partager un même client."
references:
  - title: ReferentialIntegrity
    url: https://docs.aws.amazon.com/glue/latest/dg/dqdl-rule-types-ReferentialIntegrity.html
