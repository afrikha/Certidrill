id: deac01-3a-athena-per-query-limit
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Analysts of AnyCompany run ad hoc queries in an Amazon Athena workgroup. Several times a month, a query without a partition filter scans more than 5 TB of data by mistake. The company wants Athena to cancel automatically any single query in the workgroup that scans more than 1 TB.

    Which solution will meet this requirement?
  fr: |
    Les analystes d'AnyCompany exécutent des requêtes ad hoc dans un groupe de travail Amazon Athena. Plusieurs fois par mois, une requête sans filtre de partition analyse par erreur plus de 5 To de données. L'entreprise veut qu'Athena annule automatiquement toute requête du groupe de travail qui analyse plus de 1 To.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Configure a per-query data usage control of 1 TB on the workgroup.", fr: "Configurer un contrôle de l'utilisation des données par requête de 1 To sur le groupe de travail." } }
    - { id: b, text: { en: "Configure a workgroup-wide data usage control of 1 TB per hour with an Amazon SNS alarm.", fr: "Configurer un contrôle de l'utilisation des données à l'échelle du groupe de travail de 1 To par heure avec une alarme Amazon SNS." } }
    - { id: c, text: { en: "Create an AWS Budgets cost budget for Athena that sends an alert at 90% of the monthly amount.", fr: "Créer un budget de coût AWS Budgets pour Athena qui envoie une alerte à 90 % du montant mensuel." } }
    - { id: d, text: { en: "Enable query result reuse on the workgroup so that large queries are not run again.", fr: "Activer la réutilisation des résultats de requête sur le groupe de travail pour que les grosses requêtes ne soient pas réexécutées." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A per-query data usage control sets the maximum data that each query in the workgroup may scan, and Athena cancels a query that exceeds it; canceling is the only action and cannot be changed. A workgroup can have one per-query limit."
    fr: "Un contrôle de l'utilisation des données par requête fixe la quantité maximale de données que chaque requête du groupe de travail peut analyser, et Athena annule une requête qui la dépasse ; l'annulation est la seule action et ne peut pas être modifiée. Un groupe de travail peut avoir une limite par requête."
  options:
    b:
      en: "Workgroup-wide limits measure the total of all queries over a period and send notifications or run actions; they do not cancel queries."
      fr: "Les limites à l'échelle du groupe de travail mesurent le total de toutes les requêtes sur une période et envoient des notifications ou déclenchent des actions ; elles n'annulent pas les requêtes."
    c:
      en: "A budget alert reports spending after it happens and does not stop a running query."
      fr: "Une alerte de budget signale les dépenses après coup et n'arrête pas une requête en cours."
    d:
      en: "Result reuse returns stored results for identical queries; a new large query still runs in full."
      fr: "La réutilisation des résultats renvoie des résultats stockés pour des requêtes identiques ; une nouvelle grosse requête s'exécute toujours entièrement."
references:
  - title: Configure per-query and per-workgroup data usage controls
    url: https://docs.aws.amazon.com/athena/latest/ug/workgroups-setting-control-limits-cloudwatch.html
