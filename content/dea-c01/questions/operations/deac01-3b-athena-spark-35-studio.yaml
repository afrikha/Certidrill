id: deac01-3b-athena-spark-35-studio
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company in the US East (N. Virginia) Region wants its data engineers to explore data interactively with Apache Spark 3.5 on Athena. The engineers need a live Spark UI for debugging and per-session cost tracking in AWS Cost Explorer. They already work in Amazon SageMaker Unified Studio. The company has an existing Athena workgroup that uses PySpark engine version 3.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de la Région USA Est (Virginie du Nord) veut que ses ingénieurs des données explorent les données de façon interactive avec Apache Spark 3.5 sur Athena. Les ingénieurs ont besoin d'une interface Spark UI en direct pour le débogage et d'un suivi des coûts par session dans AWS Cost Explorer. Ils travaillent déjà dans Amazon SageMaker Unified Studio. L'entreprise dispose d'un groupe de travail Athena existant qui utilise PySpark engine version 3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Upgrade the existing workgroup to Apache Spark version 3.5 and keep using the Athena in-console notebooks.", fr: "Mettre à niveau le groupe de travail existant vers Apache Spark version 3.5 et continuer d'utiliser les blocs-notes de la console Athena." } }
    - { id: b, text: { en: "Keep the existing workgroup and run the code through the StartCalculationExecution API from SageMaker Unified Studio.", fr: "Conserver le groupe de travail existant et exécuter le code via l'API StartCalculationExecution depuis SageMaker Unified Studio." } }
    - { id: c, text: { en: "Create a workgroup that uses Apache Spark version 3.5 and run the code from SageMaker Unified Studio notebooks.", fr: "Créer un groupe de travail qui utilise Apache Spark version 3.5 et exécuter le code depuis des blocs-notes SageMaker Unified Studio." } }
    - { id: d, text: { en: "Create a workgroup that uses Apache Spark version 3.5 and submit each cell with the StartCalculationExecution API.", fr: "Créer un groupe de travail qui utilise Apache Spark version 3.5 et soumettre chaque cellule avec l'API StartCalculationExecution." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Apache Spark version 3.5 release of Athena adds a live Spark UI, the Spark History Server and session-level cost attribution. It does not support in-console notebooks; it is used from SageMaker Unified Studio notebooks or compatible Spark Connect clients, in a new workgroup because existing PySpark engine version 3 workgroups cannot be upgraded."
    fr: "La version Apache Spark version 3.5 d'Athena ajoute une interface Spark UI en direct, le Spark History Server et l'attribution des coûts par session. Elle ne prend pas en charge les blocs-notes de la console ; elle s'utilise depuis des blocs-notes SageMaker Unified Studio ou des clients Spark Connect compatibles, dans un nouveau groupe de travail, car les groupes de travail PySpark engine version 3 existants ne peuvent pas être mis à niveau."
  options:
    a:
      en: "A PySpark engine version 3 workgroup cannot be upgraded to Spark 3.5, and Spark 3.5 does not support in-console notebooks."
      fr: "Un groupe de travail PySpark engine version 3 ne peut pas être mis à niveau vers Spark 3.5, et Spark 3.5 ne prend pas en charge les blocs-notes de la console."
    b:
      en: "The existing workgroup runs PySpark engine version 3, which is based on Spark 3.2.1 and lacks the Spark 3.5 debugging and cost features."
      fr: "Le groupe de travail existant exécute PySpark engine version 3, basé sur Spark 3.2.1, sans les fonctionnalités de débogage et de coûts de Spark 3.5."
    d:
      en: "The calculation APIs, including StartCalculationExecution, are not supported in the Spark 3.5 release."
      fr: "Les API de calcul, dont StartCalculationExecution, ne sont pas prises en charge dans la version Spark 3.5."
references:
  - title: Release versions
    url: https://docs.aws.amazon.com/athena/latest/ug/notebooks-spark-release-versions.html
  - title: Considerations and limitations
    url: https://docs.aws.amazon.com/athena/latest/ug/notebooks-spark-considerations-and-limitations.html
