id: deac01-3b-glue-group-files
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue Spark ETL job reads the JSON files of one day with the following code. Each day has about 40,000 files of 10 to 50 KB. The job spends most of its time scheduling work, and the Spark UI shows tens of thousands of very short tasks. Adding workers did not make the job faster.

    ```python
    dyf = glueContext.create_dynamic_frame.from_options(
        connection_type="s3",
        connection_options={"paths": ["s3://example-raw/events/2026/11/22/"]},
        format="json",
    )
    ```

    Which change will improve the performance of the job with the LEAST effort?
  fr: |
    Une tâche ETL AWS Glue Spark lit les fichiers JSON d'une journée avec le code suivant. Chaque journée compte environ 40 000 fichiers de 10 à 50 Ko. La tâche passe l'essentiel de son temps à planifier le travail, et l'interface Spark UI montre des dizaines de milliers de tâches très courtes. L'ajout de nœuds de calcul (workers) n'a pas accéléré la tâche.

    ```python
    dyf = glueContext.create_dynamic_frame.from_options(
        connection_type="s3",
        connection_options={"paths": ["s3://example-raw/events/2026/11/22/"]},
        format="json",
    )
    ```

    Quelle modification améliore les performances de la tâche avec le MOINS d'efforts possible ?
body:
  options:
    - { id: a, text: { en: "Change the worker type of the job to G.2X so that each executor has more memory and CPU.", fr: "Passer le type de nœud de calcul de la tâche à G.2X afin que chaque exécuteur dispose de plus de mémoire et de processeur." } }
    - { id: b, text: { en: "Turn on job bookmarks for the job so that each run processes only the files it has not read before.", fr: "Activer les signets de tâche (job bookmarks) afin que chaque exécution ne traite que les fichiers qu'elle n'a pas encore lus." } }
    - { id: c, text: { en: "Convert the job to an AWS Glue Python shell job that reads the files in a single process.", fr: "Convertir la tâche en tâche AWS Glue Python shell qui lit les fichiers dans un seul processus." } }
    - { id: d, text: { en: "Add `groupFiles` set to `inPartition` and a `groupSize` value to the connection options.", fr: "Ajouter `groupFiles` défini sur `inPartition` et une valeur `groupSize` aux options de connexion." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Setting groupFiles to inPartition makes AWS Glue read the small files of a partition in larger groups, which reduces the number of ETL tasks and in-memory partitions; groupSize sets the target group size in bytes. Glue turns grouping on automatically only above 50,000 input files, and the option is supported for JSON."
    fr: "Définir groupFiles sur inPartition fait lire à AWS Glue les petits fichiers d'une partition par groupes plus importants, ce qui réduit le nombre de tâches ETL et de partitions en mémoire ; groupSize définit la taille cible des groupes en octets. Glue n'active le regroupement automatiquement qu'au-delà de 50 000 fichiers d'entrée, et l'option est prise en charge pour JSON."
  options:
    a:
      en: "More memory per executor does not reduce the number of tiny tasks that dominate the run time."
      fr: "Plus de mémoire par exécuteur ne réduit pas le nombre de minuscules tâches qui dominent la durée d'exécution."
    b:
      en: "Bookmarks skip data processed by earlier runs; the job already reads only one day, so the number of files per run stays the same."
      fr: "Les signets ignorent les données traitées par les exécutions précédentes ; la tâche ne lit déjà qu'une journée, donc le nombre de fichiers par exécution reste le même."
    c:
      en: "A Python shell job runs on a single node without Spark, which is slower for 40,000 files and requires rewriting the job."
      fr: "Une tâche Python shell s'exécute sur un seul nœud sans Spark, ce qui est plus lent pour 40 000 fichiers et oblige à réécrire la tâche."
references:
  - title: Reading input files in larger groups
    url: https://docs.aws.amazon.com/glue/latest/dg/grouping-input-files.html
