id: deac01-3c-trail-insights-error-rate
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs hundreds of scheduled AWS Glue jobs. Last month, a misconfigured job called the Glue GetTable API thousands of times for a table that no longer existed, and every call returned an error. Nobody noticed for days. The company wants AWS to detect such unusual bursts of failing API calls automatically from its trail, without defining a fixed threshold for each API. The trail logs read and write management events.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des centaines de tâches AWS Glue planifiées. Le mois dernier, une tâche mal configurée a appelé l'API Glue GetTable des milliers de fois pour une table qui n'existait plus, et chaque appel a renvoyé une erreur. Personne ne s'en est aperçu pendant des jours. L'entreprise souhaite qu'AWS détecte automatiquement de telles rafales inhabituelles d'appels d'API en échec à partir de son journal de suivi, sans définir de seuil fixe pour chaque API. Le journal de suivi consigne les événements de gestion en lecture et en écriture.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable CloudTrail Insights on the trail with the API call rate Insights type.", fr: "Activer CloudTrail Insights sur le journal de suivi avec le type Insights « API call rate »." } }
    - { id: b, text: { en: "Send the trail to CloudWatch Logs and create a metric filter and an alarm with a static threshold for each Glue API.", fr: "Envoyer le journal de suivi vers CloudWatch Logs et créer un filtre de métrique et une alarme avec un seuil statique pour chaque API Glue." } }
    - { id: c, text: { en: "Enable CloudTrail Insights on the trail with the API error rate Insights type.", fr: "Activer CloudTrail Insights sur le journal de suivi avec le type Insights « API error rate »." } }
    - { id: d, text: { en: "Schedule a daily search of CloudTrail Event history on the event name GetTable and compare the results with the previous day.", fr: "Planifier une recherche quotidienne dans l'historique des événements CloudTrail sur le nom d'événement GetTable et comparer les résultats avec ceux de la veille." } }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudTrail Insights learns a baseline from past events and generates Insights events when the current API call rate or API error rate deviates from it, so no threshold has to be defined. The API error rate type works on read or write management events, which covers the failing GetTable calls."
    fr: "CloudTrail Insights apprend une base de référence à partir des événements passés et génère des événements Insights lorsque le taux d'appels ou le taux d'erreurs d'API actuel s'en écarte : aucun seuil n'est à définir. Le type « API error rate » fonctionne sur les événements de gestion en lecture ou en écriture, ce qui couvre les appels GetTable en échec."
  options:
    a:
      en: "The API call rate type for management events analyzes only write management API calls, and GetTable is a read call."
      fr: "Le type « API call rate » pour les événements de gestion n'analyse que les appels d'API de gestion en écriture, et GetTable est un appel en lecture."
    b:
      en: "Static thresholds per API are exactly what the company wants to avoid, and they must be maintained for every new pattern."
      fr: "Des seuils statiques par API sont précisément ce que l'entreprise veut éviter, et ils doivent être maintenus pour chaque nouveau comportement."
    d:
      en: "A daily manual comparison is not automatic detection and would still leave the problem unnoticed for up to a day."
      fr: "Une comparaison manuelle quotidienne n'est pas une détection automatique et laisserait encore le problème inaperçu pendant une journée."
references:
  - title: Working with CloudTrail Insights
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-insights-events-with-cloudtrail.html
