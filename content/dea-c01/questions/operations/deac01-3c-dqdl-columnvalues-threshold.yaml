id: deac01-3c-dqdl-columnvalues-threshold
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer writes an AWS Glue Data Quality ruleset for a shipments dataset. The status column must contain only the values NEW, SHIPPED or DELIVERED. Because a partner system sometimes sends test values, the rule must pass when more than 99% of the rows have one of these three values.

    Which DQDL rule will meet this requirement?
  fr: |
    Un ingénieur des données écrit un ensemble de règles AWS Glue Data Quality pour un jeu de données d'expéditions. La colonne status ne doit contenir que les valeurs NEW, SHIPPED ou DELIVERED. Comme un système partenaire envoie parfois des valeurs de test, la règle doit réussir lorsque plus de 99 % des lignes ont l'une de ces trois valeurs.

    Quelle règle DQDL répond à cette exigence ?
body:
  options:
    - { id: a, text: '`ColumnValues "status" in ["NEW", "SHIPPED", "DELIVERED"]`' }
    - { id: b, text: '`Completeness "status" > 0.99`' }
    - { id: c, text: '`DistinctValuesCount "status" = 3`' }
    - { id: d, text: '`ColumnValues "status" in ["NEW", "SHIPPED", "DELIVERED"] with threshold > 0.99`' }
answer: { optionId: d }
explanation:
  correct:
    en: "ColumnValues with an in list checks each value against the allowed set, and the with threshold clause sets the share of rows that must match, so the rule passes above 99%. The threshold clause works with the ColumnValues, ColumnDataType and CustomSql rule types."
    fr: "ColumnValues avec une liste in vérifie chaque valeur par rapport à l'ensemble autorisé, et la clause with threshold fixe la part des lignes qui doivent correspondre : la règle réussit au-delà de 99 %. La clause de seuil fonctionne avec les types de règles ColumnValues, ColumnDataType et CustomSql."
  options:
    a:
      en: "Without a threshold, every row must have an allowed value, so a single test value fails the rule."
      fr: "Sans seuil, chaque ligne doit avoir une valeur autorisée : une seule valeur de test fait échouer la règle."
    b:
      en: "Completeness measures the share of non-null values; a test value such as TEST still counts as complete."
      fr: "Completeness mesure la part des valeurs non nulles ; une valeur de test comme TEST compte quand même comme complète."
    c:
      en: "DistinctValuesCount checks only how many different values exist, not which ones, and one test value makes the count 4."
      fr: "DistinctValuesCount vérifie seulement le nombre de valeurs différentes, pas lesquelles, et une valeur de test porte ce nombre à 4."
references:
  - title: Data Quality Definition Language (DQDL) reference
    url: https://docs.aws.amazon.com/glue/latest/dg/dqdl.html
