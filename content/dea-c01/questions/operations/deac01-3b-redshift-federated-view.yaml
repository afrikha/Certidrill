id: deac01-3b-redshift-federated-view
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's Amazon Redshift data warehouse holds historical orders. The current status of each order is kept in an Amazon Aurora PostgreSQL database and changes every few seconds. Analysts need one SQL view in Redshift that joins the historical orders with the current status. The status must be read live from Aurora at query time, and no copy of the Aurora data may be stored in Redshift.

    Which solution will meet these requirements?
  fr: |
    L'entrepôt de données Amazon Redshift d'une entreprise contient l'historique des commandes. Le statut actuel de chaque commande est conservé dans une base de données Amazon Aurora PostgreSQL et change toutes les quelques secondes. Les analystes ont besoin d'une vue SQL unique dans Redshift qui joint l'historique des commandes au statut actuel. Le statut doit être lu en direct dans Aurora au moment de la requête, et aucune copie des données Aurora ne doit être stockée dans Redshift.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Aurora zero-ETL integration with Amazon Redshift and join the replicated status table in a view.", fr: "Créer une intégration zéro ETL Aurora avec Amazon Redshift et joindre la table de statuts répliquée dans une vue." } }
    - { id: b, text: { en: "Replicate the status table into Redshift with an AWS DMS task that uses change data capture, then join it in a view.", fr: "Répliquer la table des statuts dans Redshift avec une tâche AWS DMS qui utilise la capture des données modifiées, puis la joindre dans une vue." } }
    - { id: c, text: { en: "Create an external schema FROM POSTGRES for Aurora, then a late-binding view that joins the local and federated tables.", fr: "Créer un schéma externe FROM POSTGRES pour Aurora, puis une vue à liaison tardive qui joint la table locale et la table fédérée." } }
    - { id: d, text: { en: "Export the status table to Amazon S3 every night and join it to the orders through a Redshift Spectrum external table.", fr: "Exporter chaque nuit la table des statuts dans Amazon S3 et la joindre aux commandes via une table externe Redshift Spectrum." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A federated query uses an external schema that maps to an Aurora PostgreSQL or RDS for PostgreSQL database and reads live data at query time, pushing predicates down to the source. A late-binding view over the local table and the federated table gives the analysts one view without storing a copy of the Aurora data."
    fr: "Une requête fédérée utilise un schéma externe associé à une base Aurora PostgreSQL ou RDS for PostgreSQL et lit les données en direct au moment de la requête, en transmettant les prédicats à la source. Une vue à liaison tardive sur la table locale et la table fédérée donne aux analystes une vue unique sans stocker de copie des données Aurora."
  options:
    a:
      en: "Zero-ETL replicates the Aurora data into Redshift, which stores a copy and breaks the requirement."
      fr: "L'intégration zéro ETL réplique les données Aurora dans Redshift, ce qui stocke une copie et enfreint l'exigence."
    b:
      en: "DMS with CDC builds a replication pipeline and stores a copy of the table in Redshift."
      fr: "DMS avec CDC crée un pipeline de réplication et stocke une copie de la table dans Redshift."
    d:
      en: "A nightly export stores a copy in S3 and shows a status that can be a day old instead of the live value."
      fr: "Un export nocturne stocke une copie dans S3 et affiche un statut qui peut dater d'un jour au lieu de la valeur en direct."
references:
  - title: Querying data with federated queries in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/federated-overview.html
  - title: CREATE VIEW
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_VIEW.html
