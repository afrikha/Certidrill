id: deac01-3b-kinesis-shard-metrics
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A provisioned Amazon Kinesis data stream with 50 shards receives telemetry from thousands of devices. Producers report intermittent ProvisionedThroughputExceededException errors, while the stream-level IncomingBytes and IncomingRecords metrics stay at about 30 % of the total capacity. Before it redesigns the partition keys, the team must find out which shards receive too much traffic.

    Which solution will provide this information?
  fr: |
    Un flux de données Amazon Kinesis provisionné de 50 partitions (shards) reçoit la télémétrie de milliers d'appareils. Les producteurs signalent des erreurs ProvisionedThroughputExceededException intermittentes, alors que les métriques IncomingBytes et IncomingRecords au niveau du flux restent à environ 30 % de la capacité totale. Avant de repenser les clés de partition, l'équipe doit déterminer quelles partitions reçoivent trop de trafic.

    Quelle solution fournit cette information ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch alarm on the stream-level WriteProvisionedThroughputExceeded metric with the Average statistic.", fr: "Créer une alarme CloudWatch sur la métrique WriteProvisionedThroughputExceeded au niveau du flux avec la statistique Average." } }
    - { id: b, text: { en: "Register the consumers for enhanced fan-out and review the read throughput that each consumer gets per shard.", fr: "Inscrire les consommateurs à la distribution améliorée (enhanced fan-out) et examiner le débit de lecture obtenu par chaque consommateur et par partition." } }
    - { id: c, text: { en: "Turn on enhanced shard-level metrics for IncomingBytes and WriteProvisionedThroughputExceeded, and compare the values per ShardId.", fr: "Activer les métriques améliorées au niveau des partitions pour IncomingBytes et WriteProvisionedThroughputExceeded, et comparer les valeurs par ShardId." } }
    - { id: d, text: { en: "Increase the retention period of the stream, replay the records with a new consumer, and count them per partition key.", fr: "Augmenter la période de conservation du flux, relire les enregistrements avec un nouveau consommateur et les compter par clé de partition." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Basic stream-level metrics only have the StreamName dimension, so they hide an overloaded shard behind a low average. Enhanced shard-level metrics, turned on with EnableEnhancedMonitoring for a charge, add the ShardId dimension and show which shards reach the limit of 1 MB or 1,000 records per second of writes."
    fr: "Les métriques de base au niveau du flux n'ont que la dimension StreamName : elles masquent une partition surchargée derrière une moyenne faible. Les métriques améliorées au niveau des partitions, activées avec EnableEnhancedMonitoring et payantes, ajoutent la dimension ShardId et montrent quelles partitions atteignent la limite d'écriture de 1 Mo ou 1 000 enregistrements par seconde."
  options:
    a:
      en: "A stream-level alarm confirms that writes are throttled but cannot show which shards are affected."
      fr: "Une alarme au niveau du flux confirme que les écritures sont limitées, mais ne peut pas montrer quelles partitions sont concernées."
    b:
      en: "Enhanced fan-out concerns read throughput for consumers; the throttling happens on writes."
      fr: "La distribution améliorée concerne le débit de lecture des consommateurs ; la limitation se produit à l'écriture."
    d:
      en: "Replaying records takes custom code and shows key counts, not which shards were throttled and when."
      fr: "Relire les enregistrements exige du code personnalisé et montre des comptages par clé, et non quelles partitions ont été limitées ni à quel moment."
references:
  - title: Monitor the Amazon Kinesis Data Streams service with Amazon CloudWatch
    url: https://docs.aws.amazon.com/streams/latest/dev/monitoring-with-cloudwatch.html
  - title: Quotas and limits
    url: https://docs.aws.amazon.com/streams/latest/dev/service-sizes-and-limits.html
