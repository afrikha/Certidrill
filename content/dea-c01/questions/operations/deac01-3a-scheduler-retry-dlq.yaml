id: deac01-3a-scheduler-retry-dlq
objective: "3.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Amazon EventBridge Scheduler schedules start AWS Step Functions executions every hour for several data pipelines. Occasionally the target API is throttled and an invocation fails. Failed invocations must be retried for up to 2 hours. Any invocation that still fails after that must be kept, with the error code and message, so that the team can inspect it later.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Des planifications Amazon EventBridge Scheduler démarrent toutes les heures des exécutions AWS Step Functions pour plusieurs pipelines de données. Parfois, l'API cible est limitée et un appel échoue. Les appels en échec doivent être retentés pendant 2 heures au plus. Tout appel qui échoue encore après ce délai doit être conservé, avec le code et le message d'erreur, pour que l'équipe puisse l'examiner plus tard.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the retry policy of each schedule with a MaximumEventAgeInSeconds value of 7200.", fr: "Définir la politique de nouvelles tentatives de chaque planification avec une valeur MaximumEventAgeInSeconds de 7200." } }
    - { id: b, text: { en: "Set a flexible time window of 120 minutes on each schedule.", fr: "Définir une fenêtre de temps flexible de 120 minutes sur chaque planification." } }
    - { id: c, text: { en: "Configure an Amazon SQS FIFO queue as the dead-letter queue of each schedule.", fr: "Configurer une file d'attente Amazon SQS FIFO comme file d'attente de lettres mortes de chaque planification." } }
    - { id: d, text: { en: "Configure a standard Amazon SQS queue as the dead-letter queue of each schedule, and allow sqs:SendMessage in the execution role.", fr: "Configurer une file d'attente Amazon SQS standard comme file d'attente de lettres mortes de chaque planification, et autoriser sqs:SendMessage dans le rôle d'exécution." } }
    - { id: e, text: { en: "Create an archive on the default event bus so that failed schedule invocations can be replayed.", fr: "Créer une archive sur le bus d'événements par défaut pour pouvoir rejouer les appels de planification en échec." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The retry policy of a schedule limits retries by MaximumEventAgeInSeconds (60 to 86,400 seconds) and MaximumRetryAttempts. When retries are exhausted, Scheduler sends a dead-letter event to a standard SQS queue, with attributes such as ERROR_CODE and ERROR_MESSAGE; the execution role needs sqs:SendMessage on the queue."
    fr: "La politique de nouvelles tentatives d'une planification limite les nouvelles tentatives par MaximumEventAgeInSeconds (60 à 86 400 secondes) et MaximumRetryAttempts. Lorsqu'elles sont épuisées, Scheduler envoie un événement de lettre morte vers une file SQS standard, avec des attributs tels que ERROR_CODE et ERROR_MESSAGE ; le rôle d'exécution a besoin de sqs:SendMessage sur la file."
  options:
    b:
      en: "A flexible time window lets Scheduler invoke the target at any time within the window; it does not retry failed invocations."
      fr: "Une fenêtre de temps flexible permet à Scheduler d'appeler la cible à tout moment dans la fenêtre ; elle ne retente pas les appels en échec."
    c:
      en: "EventBridge Scheduler supports only standard SQS queues as dead-letter queues, not FIFO queues."
      fr: "EventBridge Scheduler ne prend en charge que des files SQS standard comme files d'attente de lettres mortes, pas des files FIFO."
    e:
      en: "Schedules invoke their targets directly, not through an event bus, so a bus archive does not capture them."
      fr: "Les planifications appellent directement leurs cibles, pas par un bus d'événements : une archive de bus ne les capture pas."
references:
  - title: Configuring a schedule's dead-letter queue in EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/configuring-schedule-dlq.html
  - title: RetryPolicy
    url: https://docs.aws.amazon.com/scheduler/latest/APIReference/API_RetryPolicy.html
