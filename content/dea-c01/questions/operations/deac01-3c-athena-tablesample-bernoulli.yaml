id: deac01-3c-athena-tablesample-bernoulli
objective: "3.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data engineer explores a 20 TB Amazon Athena table of clickstream events before designing aggregations. The engineer needs a sample of about 1% of the rows in which every row of the table has the same, independent probability of being selected, so that statistics computed on the sample are not biased by how the data is stored.

    Which query will meet this requirement?
  fr: |
    Un ingénieur des données explore une table Amazon Athena de 20 To d'événements de parcours de navigation (clickstream) avant de concevoir des agrégations. L'ingénieur a besoin d'un échantillon d'environ 1 % des lignes dans lequel chaque ligne de la table a la même probabilité, indépendante, d'être sélectionnée, afin que les statistiques calculées sur l'échantillon ne soient pas biaisées par la façon dont les données sont stockées.

    Quelle requête répond à cette exigence ?
body:
  options:
    - { id: a, text: '`SELECT * FROM clicks TABLESAMPLE SYSTEM (1)`' }
    - { id: b, text: "`SELECT * FROM clicks WHERE event_date = DATE '2026-11-01'`" }
    - { id: c, text: '`SELECT * FROM clicks TABLESAMPLE BERNOULLI (1)`' }
    - { id: d, text: '`SELECT * FROM clicks LIMIT 2000000`' }
answer: { optionId: c }
explanation:
  correct:
    en: "With BERNOULLI, each row is selected with a probability equal to the percentage: all physical blocks are scanned and rows are skipped based on a random value computed at run time. This gives every row the same independent chance of being in the sample."
    fr: "Avec BERNOULLI, chaque ligne est sélectionnée avec une probabilité égale au pourcentage : tous les blocs physiques sont lus et des lignes sont ignorées selon une valeur aléatoire calculée à l'exécution. Chaque ligne a ainsi la même chance indépendante de figurer dans l'échantillon."
  options:
    a:
      en: "SYSTEM keeps or skips whole logical segments of data, depends on the connector and does not guarantee independent sampling probabilities."
      fr: "SYSTEM conserve ou ignore des segments logiques entiers de données, dépend du connecteur et ne garantit pas des probabilités d'échantillonnage indépendantes."
    b:
      en: "One day of data is a sample biased by date, not a random selection across the table."
      fr: "Une seule journée de données est un échantillon biaisé par la date, pas une sélection aléatoire sur toute la table."
    d:
      en: "LIMIT returns the first rows that the engine reads, which depends on storage order and is not random."
      fr: "LIMIT renvoie les premières lignes lues par le moteur, ce qui dépend de l'ordre de stockage et n'est pas aléatoire."
references:
  - title: SELECT
    url: https://docs.aws.amazon.com/athena/latest/ug/select.html
