id: deac01-3a-databrew-output-parquet
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue DataBrew recipe job cleans order data every day. Analysts query the output with Amazon Athena, and most queries filter on the region column and read a few columns. The output must be stored in a compressed columnar format, organized in folders by region, and registered as a new table in the AWS Glue Data Catalog. The company does not want to add another job or crawler.

    Which output configuration will meet these requirements?
  fr: |
    Une tâche de recette AWS Glue DataBrew nettoie chaque jour des données de commandes. Les analystes interrogent la sortie avec Amazon Athena, et la plupart des requêtes filtrent sur la colonne region et lisent quelques colonnes. La sortie doit être stockée dans un format en colonnes compressé, organisée en dossiers par region et enregistrée comme nouvelle table dans le catalogue de données AWS Glue. L'entreprise ne veut ajouter ni tâche ni robot d'analyse.

    Quelle configuration de sortie répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon S3 output in Apache Parquet format with Snappy compression, with Data Catalog support for a new table and column partitioning on region.", fr: "Sortie Amazon S3 au format Apache Parquet avec compression Snappy, avec la prise en charge du catalogue de données pour une nouvelle table et un partitionnement par colonne sur region." } }
    - { id: b, text: { en: "Amazon S3 output in CSV format with GZIP compression, followed by an AWS Glue crawler that creates the table.", fr: "Sortie Amazon S3 au format CSV avec compression GZIP, suivie d'un robot d'analyse AWS Glue qui crée la table." } }
    - { id: c, text: { en: "Amazon S3 output in JSON Lines format with Snappy compression and column partitioning on region.", fr: "Sortie Amazon S3 au format JSON Lines avec compression Snappy et un partitionnement par colonne sur region." } }
    - { id: d, text: { en: "Amazon Redshift output to a new table with Data Catalog support, with the region column as the sort key.", fr: "Sortie Amazon Redshift vers une nouvelle table avec la prise en charge du catalogue de données, avec la colonne region comme clé de tri." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Recipe jobs can write Apache Parquet with Snappy compression to Amazon S3 with Data Catalog support, which registers the output as a table. Column partitioning splits the output into folders by column value and is supported for new Data Catalog S3 output, so Athena reads only the matching regions and columns."
    fr: "Les tâches de recette peuvent écrire de l'Apache Parquet compressé en Snappy dans Amazon S3 avec la prise en charge du catalogue de données, qui enregistre la sortie comme table. Le partitionnement par colonne répartit la sortie en dossiers par valeur de colonne et est pris en charge pour une nouvelle sortie S3 du catalogue de données : Athena ne lit que les régions et les colonnes concernées."
  options:
    b:
      en: "CSV is a row format, and the crawler is the extra component the company does not want."
      fr: "CSV est un format en lignes, et le robot d'analyse est le composant supplémentaire dont l'entreprise ne veut pas."
    c:
      en: "JSON Lines is a row format, and this output is not registered in the Data Catalog."
      fr: "JSON Lines est un format en lignes, et cette sortie n'est pas enregistrée dans le catalogue de données."
    d:
      en: "Analysts query the data with Athena on Amazon S3, not in a Redshift table."
      fr: "Les analystes interrogent les données avec Athena dans Amazon S3, pas dans une table Redshift."
references:
  - title: Creating and working with AWS Glue DataBrew recipe jobs
    url: https://docs.aws.amazon.com/databrew/latest/dg/jobs.recipe.html
