id: deac01-3a-databrew-dynamic-dataset
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every day, a source system writes one file per country to Amazon S3 with keys such as s3://example-raw/sales/FR/sales-2026-11-22.csv. The folder keeps all previous files. A daily AWS Glue DataBrew recipe job must process only the files written during the past 24 hours, and the output must include the country code as a column. The company wants no custom code.

    Which solution will meet these requirements?
  fr: |
    Chaque jour, un système source écrit un fichier par pays dans Amazon S3 avec des clés telles que s3://example-raw/sales/FR/sales-2026-11-22.csv. Le dossier conserve tous les fichiers précédents. Une tâche de recette AWS Glue DataBrew quotidienne doit traiter uniquement les fichiers écrits au cours des dernières 24 heures, et la sortie doit inclure le code pays dans une colonne. L'entreprise ne veut aucun code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a dataset on the s3://example-raw/sales/ folder so that the job reads every file in the folder at each run.", fr: "Créer un jeu de données sur le dossier s3://example-raw/sales/ pour que la tâche lise tous les fichiers du dossier à chaque exécution." } }
    - { id: b, text: { en: "Create a dataset with the path s3://example-raw/sales/{country}/sales-{report_date}.csv, add country as a column, and give report_date a Date type with a past 24 hours condition.", fr: "Créer un jeu de données avec le chemin s3://example-raw/sales/{country}/sales-{report_date}.csv, ajouter country comme colonne, et donner à report_date un type Date avec une condition sur les dernières 24 heures." } }
    - { id: c, text: { en: "Write a Lambda function that copies the new files to a staging prefix each day, and create the dataset on that prefix.", fr: "Écrire une fonction Lambda qui copie chaque jour les nouveaux fichiers vers un préfixe intermédiaire, et créer le jeu de données sur ce préfixe." } }
    - { id: d, text: { en: "Create a new dataset every morning that points to the files of the day, and update the job to use it.", fr: "Créer chaque matin un nouveau jeu de données qui pointe vers les fichiers du jour, et mettre à jour la tâche pour l'utiliser." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A DataBrew dataset can use a parameterized S3 path with {parameter} names. A String parameter can be added as a column, and a Date parameter with a format such as yyyy-MM-dd can have a relative condition; relative dates are evaluated when the job starts, so each daily run picks up only the matching new files."
    fr: "Un jeu de données DataBrew peut utiliser un chemin S3 paramétré avec des noms {paramètre}. Un paramètre String peut être ajouté comme colonne, et un paramètre Date au format tel que yyyy-MM-dd peut avoir une condition relative ; les dates relatives sont évaluées au démarrage de la tâche, si bien que chaque exécution quotidienne ne prend que les nouveaux fichiers correspondants."
  options:
    a:
      en: "The folder keeps all previous files, so each run would reprocess the whole history, and the country would not become a column."
      fr: "Le dossier conserve tous les fichiers précédents : chaque exécution retraiterait tout l'historique, et le pays ne deviendrait pas une colonne."
    c:
      en: "The copy function is custom code that a parameterized dataset makes unnecessary."
      fr: "La fonction de copie est du code personnalisé qu'un jeu de données paramétré rend inutile."
    d:
      en: "Recreating the dataset and editing the job every day is manual work and does not add the country column."
      fr: "Recréer le jeu de données et modifier la tâche chaque jour est un travail manuel et n'ajoute pas la colonne pays."
references:
  - title: Connecting data in multiple files in Amazon S3
    url: https://docs.aws.amazon.com/databrew/latest/dg/datasets.multiple-files.html
