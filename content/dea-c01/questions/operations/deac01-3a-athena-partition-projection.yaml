id: deac01-3a-athena-partition-projection
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Application logs are written to Amazon S3 under s3://example-logs/app/dt=YYYY-MM-DD/hour=HH/, with a new hourly partition, and 3 years of data are kept. Analysts query the logs only with Amazon Athena, always filtering on dt and hour. A scheduled MSCK REPAIR TABLE statement now takes a long time, and queries spend much of their time retrieving partition metadata. The company wants to stop managing partitions.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Des journaux d'application sont écrits dans Amazon S3 sous s3://example-logs/app/dt=YYYY-MM-DD/hour=HH/, avec une nouvelle partition par heure, et 3 ans de données sont conservés. Les analystes interrogent les journaux uniquement avec Amazon Athena, toujours avec un filtre sur dt et hour. Une instruction MSCK REPAIR TABLE planifiée prend désormais beaucoup de temps, et les requêtes passent une grande partie de leur temps à récupérer les métadonnées de partition. L'entreprise veut ne plus gérer les partitions.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Run MSCK REPAIR TABLE every hour from an EventBridge Scheduler schedule instead of once a day.", fr: "Exécuter MSCK REPAIR TABLE toutes les heures depuis une planification EventBridge Scheduler au lieu d'une fois par jour." } }
    - { id: b, text: { en: "Enable partition projection on the table with a date type for dt and an integer type from 0 to 23 for hour.", fr: "Activer la projection de partitions sur la table avec un type date pour dt et un type integer de 0 à 23 pour hour." } }
    - { id: c, text: { en: "Run an AWS Glue crawler on the log prefix every hour so that it adds the new partitions to the table.", fr: "Exécuter toutes les heures un robot d'analyse AWS Glue sur le préfixe des journaux pour qu'il ajoute les nouvelles partitions à la table." } }
    - { id: d, text: { en: "Convert the logs to Apache Parquet with a CTAS statement and keep the scheduled MSCK REPAIR TABLE statement.", fr: "Convertir les journaux en Apache Parquet avec une instruction CTAS et conserver l'instruction MSCK REPAIR TABLE planifiée." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With partition projection, Athena computes partition values and locations from table properties instead of calling the Data Catalog, which speeds up queries on highly partitioned tables and removes the need to add partitions. It suits known, continuous ranges such as dates and integers, and it works here because only Athena queries the table."
    fr: "Avec la projection de partitions, Athena calcule les valeurs et les emplacements des partitions à partir des propriétés de la table au lieu d'interroger le catalogue de données, ce qui accélère les requêtes sur les tables très partitionnées et évite d'ajouter des partitions. Elle convient aux plages connues et continues comme les dates et les entiers, et fonctionne ici car seul Athena interroge la table."
  options:
    a:
      en: "Running the repair more often still scans the prefix and keeps a partition-management job, and queries still read partition metadata."
      fr: "Lancer la réparation plus souvent analyse toujours le préfixe et conserve une tâche de gestion des partitions, et les requêtes lisent toujours les métadonnées de partition."
    c:
      en: "A crawler is another component to run, and query planning still retrieves the partitions from the catalog."
      fr: "Un robot d'analyse est un composant de plus à exécuter, et la planification des requêtes récupère toujours les partitions dans le catalogue."
    d:
      en: "Parquet reduces the data scanned but does not change how partitions are managed or looked up."
      fr: "Parquet réduit les données analysées mais ne change pas la gestion ni la recherche des partitions."
references:
  - title: Use partition projection with Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html
