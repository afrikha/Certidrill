id: deac01-3b-msk-serverless-limits
objective: "3.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company plans to move its self-managed Apache Kafka cluster to Amazon MSK and is considering MSK Serverless to avoid capacity planning.

    Which two of the following workload requirements rule out MSK Serverless and call for a provisioned MSK cluster? (Choose two.)
  fr: |
    Une entreprise prévoit de migrer son cluster Apache Kafka autogéré vers Amazon MSK et envisage MSK Serverless pour éviter la planification de capacité.

    Parmi les exigences suivantes de la charge de travail, quelles sont les deux qui excluent MSK Serverless et imposent un cluster MSK provisionné ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Existing clients authenticate with SASL/SCRAM, are authorized by Kafka ACLs, and must keep working without changes.", fr: "Les clients existants s'authentifient avec SASL/SCRAM, sont autorisés par des ACL Kafka et doivent continuer à fonctionner sans modification." } }
    - { id: b, text: { en: "Peak producer traffic reaches 300 MBps for the whole cluster.", fr: "Le trafic des producteurs atteint 300 Mo/s en pointe pour l'ensemble du cluster." } }
    - { id: c, text: { en: "Topics must retain data for 30 days.", fr: "Les rubriques Kafka (topics) doivent conserver les données pendant 30 jours." } }
    - { id: d, text: { en: "Some messages are up to 4 MiB in size.", fr: "Certains messages atteignent 4 Mio." } }
    - { id: e, text: { en: "Capacity must scale automatically as partition load changes.", fr: "La capacité doit s'adapter automatiquement à l'évolution de la charge des partitions." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "MSK Serverless requires IAM access control for all clusters and does not support Apache Kafka ACLs, so the SASL/SCRAM clients would have to change. Its quota for maximum ingress throughput is 200 MBps per cluster, below the 300 MBps peak."
    fr: "MSK Serverless exige le contrôle d'accès IAM pour tous les clusters et ne prend pas en charge les ACL Apache Kafka : les clients SASL/SCRAM devraient donc changer. Son quota de débit entrant maximal est de 200 Mo/s par cluster, en dessous de la pointe de 300 Mo/s."
  options:
    c:
      en: "The MSK Serverless quota lists an unlimited maximum retention duration."
      fr: "Le quota MSK Serverless indique une durée de conservation maximale illimitée."
    d:
      en: "MSK Serverless accepts messages up to 8 MiB."
      fr: "MSK Serverless accepte des messages jusqu'à 8 Mio."
    e:
      en: "Automatic scaling of capacity while managing partitions is what MSK Serverless provides."
      fr: "La mise à l'échelle automatique de la capacité avec gestion des partitions est précisément ce que fournit MSK Serverless."
references:
  - title: What is MSK Serverless?
    url: https://docs.aws.amazon.com/msk/latest/developerguide/serverless.html
  - title: Amazon MSK quota
    url: https://docs.aws.amazon.com/msk/latest/developerguide/limits.html
