id: deac01-3c-insights-sum-rejected
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Several AWS Glue jobs write one JSON log event per processed batch to a CloudWatch Logs log group, as in the following event.

    ```json
    {"pipeline": "orders", "batchId": "b-20261120-07", "rowsRead": 120000, "rowsRejected": 42}
    ```

    A data engineer needs the total number of rejected rows for each pipeline over the selected time range, with the pipeline that rejects the most rows first.

    Which CloudWatch Logs Insights query will meet this requirement?
  fr: |
    Plusieurs tâches AWS Glue écrivent un événement de journal JSON par lot traité dans un groupe de journaux CloudWatch Logs, comme dans l'événement suivant.

    ```json
    {"pipeline": "orders", "batchId": "b-20261120-07", "rowsRead": 120000, "rowsRejected": 42}
    ```

    Un ingénieur des données a besoin du nombre total de lignes rejetées pour chaque pipeline sur la plage de temps sélectionnée, en commençant par le pipeline qui rejette le plus de lignes.

    Quelle requête CloudWatch Logs Insights répond à cette exigence ?
body:
  options:
    - { id: a, text: '`stats count(rowsRejected) as rejected by pipeline | sort rejected desc`' }
    - { id: b, text: '`filter rowsRejected > 0 | sort rowsRejected desc | limit 10`' }
    - { id: c, text: '`stats sum(rowsRejected) as rejected by pipeline | sort rejected desc`' }
    - { id: d, text: '`fields pipeline, rowsRejected | dedup pipeline | sort rowsRejected desc`' }
answer: { optionId: c }
explanation:
  correct:
    en: "Logs Insights discovers the fields of JSON events automatically. stats sum() by pipeline adds the rowsRejected values of all the events of each pipeline, and sort on the aggregated field puts the largest total first."
    fr: "Logs Insights découvre automatiquement les champs des événements JSON. stats sum() by pipeline additionne les valeurs rowsRejected de tous les événements de chaque pipeline, et le tri sur le champ agrégé place le total le plus élevé en premier."
  options:
    a:
      en: "count() returns the number of events that have the field, not the sum of the rejected rows."
      fr: "count() renvoie le nombre d'événements qui possèdent le champ, pas la somme des lignes rejetées."
    b:
      en: "This lists individual batches with the most rejections; it does not total them per pipeline."
      fr: "Cette requête liste les lots individuels qui ont le plus de rejets ; elle ne les totalise pas par pipeline."
    d:
      en: "dedup keeps one event per pipeline, so the result shows the value of a single batch instead of the total."
      fr: "dedup ne garde qu'un événement par pipeline : le résultat montre la valeur d'un seul lot au lieu du total."
references:
  - title: CloudWatch Logs Insights language query syntax
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax.html
