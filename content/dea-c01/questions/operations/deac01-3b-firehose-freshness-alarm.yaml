id: deac01-3b-firehose-freshness-alarm
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon Data Firehose stream receives events through Direct PUT and delivers them to an Amazon S3 bucket with a 300-second buffering interval. Last week, a change to the bucket policy blocked delivery for several hours; Firehose kept retrying, and the problem was found only when analysts noticed missing data. The team wants an email whenever records wait in Firehose for more than 15 minutes before they are delivered.

    Which solution will meet these requirements?
  fr: |
    Un flux Amazon Data Firehose reçoit des événements via Direct PUT et les livre dans un compartiment Amazon S3 avec un intervalle de mise en mémoire tampon de 300 secondes. La semaine dernière, une modification de la politique de compartiment a bloqué la livraison pendant plusieurs heures ; Firehose a continué de réessayer, et le problème n'a été découvert que lorsque des analystes ont remarqué des données manquantes. L'équipe veut recevoir un e-mail chaque fois que des enregistrements attendent plus de 15 minutes dans Firehose avant leur livraison.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch alarm on the Sum of IncomingBytes equal to 0 over 15 minutes, with an Amazon SNS email action.", fr: "Créer une alarme CloudWatch sur la somme de IncomingBytes égale à 0 sur 15 minutes, avec une action d'e-mail Amazon SNS." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the Maximum of DeliveryToS3.DataFreshness above 900 seconds, with an Amazon SNS email action.", fr: "Créer une alarme CloudWatch sur le maximum de DeliveryToS3.DataFreshness au-dessus de 900 secondes, avec une action d'e-mail Amazon SNS." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the Sum of ThrottledRecords above 0 over 15 minutes, with an Amazon SNS email action.", fr: "Créer une alarme CloudWatch sur la somme de ThrottledRecords supérieure à 0 sur 15 minutes, avec une action d'e-mail Amazon SNS." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the Average of DeliveryToS3.Success below 1 over 15 minutes, with an Amazon SNS email action.", fr: "Créer une alarme CloudWatch sur la moyenne de DeliveryToS3.Success inférieure à 1 sur 15 minutes, avec une action d'e-mail Amazon SNS." } }
answer: { optionId: b }
explanation:
  correct:
    en: "DeliveryToS3.DataFreshness is the age, in seconds, of the oldest record in Firehose that is not yet delivered to the bucket. While delivery is blocked and Firehose retries, this age keeps growing, so an alarm on its Maximum above 900 seconds sends the email after 15 minutes of waiting."
    fr: "DeliveryToS3.DataFreshness est l'âge, en secondes, du plus ancien enregistrement présent dans Firehose et pas encore livré dans le compartiment. Tant que la livraison est bloquée et que Firehose réessaie, cet âge augmente : une alarme sur son maximum au-dessus de 900 secondes envoie l'e-mail après 15 minutes d'attente."
  options:
    a:
      en: "IncomingBytes measures ingestion into the stream, which continued normally while delivery was blocked."
      fr: "IncomingBytes mesure l'ingestion dans le flux, qui a continué normalement pendant le blocage de la livraison."
    c:
      en: "ThrottledRecords counts records rejected at ingestion because of stream limits, not records waiting for delivery."
      fr: "ThrottledRecords compte les enregistrements rejetés à l'ingestion en raison des limites du flux, et non les enregistrements en attente de livraison."
    d:
      en: "Small drops in the average of DeliveryToS3.Success are expected during retries, and the metric does not measure how long records have waited."
      fr: "De petites baisses de la moyenne de DeliveryToS3.Success sont normales pendant les nouvelles tentatives, et la métrique ne mesure pas la durée d'attente des enregistrements."
references:
  - title: Monitor Amazon Data Firehose with CloudWatch metrics
    url: https://docs.aws.amazon.com/firehose/latest/dev/monitoring-with-cloudwatch-metrics.html
