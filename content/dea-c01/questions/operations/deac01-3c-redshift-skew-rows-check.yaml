id: deac01-3c-redshift-skew-rows-check
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon Redshift provisioned cluster has about 400 tables with KEY distribution. Some queries are slow because a few slices do most of the work. Before changing any distribution key, a data engineer must find the tables whose rows are unevenly distributed across slices.

    Which column of the SVV_TABLE_INFO system view should the data engineer check?
  fr: |
    Un cluster provisionné Amazon Redshift compte environ 400 tables à distribution KEY. Certaines requêtes sont lentes parce que quelques tranches (slices) font l'essentiel du travail. Avant de modifier une clé de distribution, un ingénieur des données doit trouver les tables dont les lignes sont réparties de façon inégale entre les tranches.

    Quelle colonne de la vue système SVV_TABLE_INFO l'ingénieur des données doit-il examiner ?
body:
  options:
    - { id: a, text: "skew_rows" }
    - { id: b, text: "skew_sortkey1" }
    - { id: c, text: "stats_off" }
    - { id: d, text: "unsorted" }
answer: { optionId: a }
explanation:
  correct:
    en: "skew_rows is the ratio of the number of rows in the slice with the most rows to the number of rows in the slice with the fewest rows. A high value shows that the distribution key places rows unevenly across slices, which concentrates the work of queries on a few slices."
    fr: "skew_rows est le ratio entre le nombre de lignes de la tranche qui en contient le plus et celui de la tranche qui en contient le moins. Une valeur élevée montre que la clé de distribution répartit les lignes de façon inégale entre les tranches, ce qui concentre le travail des requêtes sur quelques tranches."
  options:
    b:
      en: "skew_sortkey1 compares the size of the largest non-sort key column with the first sort key column to evaluate the sort key, not the distribution."
      fr: "skew_sortkey1 compare la taille de la plus grande colonne hors clé de tri à celle de la première colonne de la clé de tri pour évaluer la clé de tri, pas la distribution."
    c:
      en: "stats_off shows how stale the table statistics are, from 0 (current) to 100 (out of date)."
      fr: "stats_off indique à quel point les statistiques de la table sont obsolètes, de 0 (à jour) à 100 (périmées)."
    d:
      en: "unsorted is the percentage of unsorted rows in the table, which VACUUM addresses; it says nothing about slices."
      fr: "unsorted est le pourcentage de lignes non triées de la table, que VACUUM traite ; il ne dit rien des tranches."
references:
  - title: SVV_TABLE_INFO
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_SVV_TABLE_INFO.html
