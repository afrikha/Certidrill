id: deac01-3a-lambda-tmp-memory
objective: "3.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Lambda function downloads a 3 GB ZIP archive from Amazon S3 to /tmp, extracts about 5 GB of CSV files into /tmp, and uploads the CSV files to another S3 prefix. The function is configured with 512 MB of memory and the default ephemeral storage. It fails with a "No space left on device" error, and the extraction, which is CPU-bound, runs slowly.

    Which combination of changes will resolve these issues? (Choose two.)
  fr: |
    Une fonction Lambda télécharge une archive ZIP de 3 Go depuis Amazon S3 dans /tmp, extrait environ 5 Go de fichiers CSV dans /tmp et charge les fichiers CSV dans un autre préfixe S3. La fonction est configurée avec 512 Mo de mémoire et le stockage éphémère par défaut. Elle échoue avec une erreur « No space left on device », et l'extraction, limitée par le processeur, est lente.

    Quelle combinaison de modifications résout ces problèmes ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the ephemeral storage of the function to 10,240 MB.", fr: "Porter le stockage éphémère de la fonction à 10 240 Mo." } }
    - { id: b, text: { en: "Attach an Amazon EBS volume to the function and extract the files to it.", fr: "Attacher un volume Amazon EBS à la fonction et y extraire les fichiers." } }
    - { id: c, text: { en: "Increase the memory of the function, for example to 4,096 MB.", fr: "Augmenter la mémoire de la fonction, par exemple à 4 096 Mo." } }
    - { id: d, text: { en: "Configure provisioned concurrency for the function.", fr: "Configurer une simultanéité provisionnée pour la fonction." } }
    - { id: e, text: { en: "Increase the reserved concurrency of the function.", fr: "Augmenter la simultanéité réservée de la fonction." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Ephemeral storage (/tmp) can be configured from 512 MB to 10,240 MB, which holds the archive and the extracted files. Lambda allocates CPU power in proportion to the configured memory (1,769 MB equals one vCPU), so more memory speeds up the CPU-bound extraction."
    fr: "Le stockage éphémère (/tmp) se configure de 512 Mo à 10 240 Mo, ce qui suffit pour l'archive et les fichiers extraits. Lambda alloue la puissance de processeur en proportion de la mémoire configurée (1 769 Mo équivalent à un vCPU) : plus de mémoire accélère l'extraction limitée par le processeur."
  options:
    b:
      en: "Lambda functions cannot attach EBS volumes."
      fr: "Les fonctions Lambda ne peuvent pas attacher de volumes EBS."
    d:
      en: "Provisioned concurrency keeps environments initialized; it adds neither disk space nor CPU to an invocation."
      fr: "La simultanéité provisionnée garde des environnements initialisés ; elle n'ajoute ni espace disque ni processeur à un appel."
    e:
      en: "Reserved concurrency controls how many instances can run at once, not the resources of each one."
      fr: "La simultanéité réservée contrôle le nombre d'instances simultanées, pas les ressources de chacune."
references:
  - title: Configure ephemeral storage for Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-ephemeral-storage.html
  - title: Configure Lambda Event Function memory
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html
