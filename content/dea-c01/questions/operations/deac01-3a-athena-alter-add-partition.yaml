id: deac01-3a-athena-alter-add-partition
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon Data Firehose stream writes events to Amazon S3 under keys such as s3://example-stream/events/2026/11/22/. An AWS Glue Data Catalog table named events is partitioned by a dt column. After each day, running MSCK REPAIR TABLE events in Amazon Athena adds no partition. Apache Spark jobs on Amazon EMR also read the table and get its partitions from the Data Catalog.

    Which solution will make each new day queryable from both Athena and Amazon EMR?
  fr: |
    Un flux Amazon Data Firehose écrit des événements dans Amazon S3 sous des clés telles que s3://example-stream/events/2026/11/22/. Une table du catalogue de données AWS Glue nommée events est partitionnée par une colonne dt. Chaque jour, l'exécution de MSCK REPAIR TABLE events dans Amazon Athena n'ajoute aucune partition. Des tâches Apache Spark sur Amazon EMR lisent aussi la table et obtiennent ses partitions depuis le catalogue de données.

    Quelle solution rend chaque nouveau jour interrogeable depuis Athena et Amazon EMR ?
body:
  options:
    - { id: a, text: { en: "Run MSCK REPAIR TABLE events every hour instead of once a day.", fr: "Exécuter MSCK REPAIR TABLE events toutes les heures au lieu d'une fois par jour." } }
    - { id: b, text: { en: "Enable partition projection on the table with a storage.location.template that matches the year/month/day layout.", fr: "Activer la projection de partitions sur la table avec un storage.location.template qui correspond à la structure year/month/day." } }
    - { id: c, text: { en: "Each day, run ALTER TABLE events ADD IF NOT EXISTS PARTITION (dt='2026-11-22') LOCATION 's3://example-stream/events/2026/11/22/' for the new day.", fr: "Chaque jour, exécuter ALTER TABLE events ADD IF NOT EXISTS PARTITION (dt='2026-11-22') LOCATION 's3://example-stream/events/2026/11/22/' pour le nouveau jour." } }
    - { id: d, text: { en: "Recreate the table with lowercase column names so that MSCK REPAIR TABLE can discover the folders.", fr: "Recréer la table avec des noms de colonnes en minuscules pour que MSCK REPAIR TABLE puisse découvrir les dossiers." } }
answer: { optionId: c }
explanation:
  correct:
    en: "MSCK REPAIR TABLE discovers only Hive-style key=value folders, and the Firehose layout has none. ALTER TABLE ADD PARTITION with a LOCATION registers the partition in the Data Catalog whatever the folder name, and IF NOT EXISTS avoids an error on reruns; registered partitions are visible to every engine that reads the catalog, including EMR."
    fr: "MSCK REPAIR TABLE ne découvre que les dossiers de style Hive clé=valeur, et la structure Firehose n'en contient pas. ALTER TABLE ADD PARTITION avec LOCATION enregistre la partition dans le catalogue de données quel que soit le nom du dossier, et IF NOT EXISTS évite une erreur en cas de relance ; les partitions enregistrées sont visibles par tous les moteurs qui lisent le catalogue, y compris EMR."
  options:
    a:
      en: "The folders are not in key=value form, so MSCK REPAIR TABLE finds nothing however often it runs."
      fr: "Les dossiers ne sont pas au format clé=valeur : MSCK REPAIR TABLE ne trouve rien, quelle que soit la fréquence d'exécution."
    b:
      en: "Partition projection works only for Athena queries; EMR uses the partition metadata of the catalog and would not see the new days."
      fr: "La projection de partitions ne fonctionne que pour les requêtes Athena ; EMR utilise les métadonnées de partition du catalogue et ne verrait pas les nouveaux jours."
    d:
      en: "Lowercase paths matter for key=value folders; it does not make MSCK REPAIR TABLE read a year/month/day layout."
      fr: "Les chemins en minuscules comptent pour les dossiers clé=valeur ; cela ne permet pas à MSCK REPAIR TABLE de lire une structure year/month/day."
references:
  - title: Partition your data
    url: https://docs.aws.amazon.com/athena/latest/ug/partitions.html
  - title: Use partition projection with Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html
