id: deac01-3b-quick-s3-manifest
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketing team wants to visualize tab-separated files that have a header row and are stored under s3://amzn-s3-demo-bucket/campaigns/ and its subfolders. A data engineer creates an AWS Quick Sight dataset directly from Amazon S3, without Athena, with the following manifest file. Quick Sight already has access to the bucket, but the imported dataset shows each row as a single column.

    ```json
    {
      "fileLocations": [
        { "URIPrefixes": ["s3://amzn-s3-demo-bucket/campaigns/"] }
      ]
    }
    ```

    Which change will fix the import?
  fr: |
    Une équipe marketing veut visualiser des fichiers séparés par des tabulations, avec une ligne d'en-tête, stockés sous s3://amzn-s3-demo-bucket/campaigns/ et ses sous-dossiers. Un ingénieur des données crée un jeu de données AWS Quick Sight directement à partir d'Amazon S3, sans Athena, avec le fichier manifeste suivant. Quick Sight a déjà accès au compartiment, mais le jeu de données importé affiche chaque ligne dans une seule colonne.

    ```json
    {
      "fileLocations": [
        { "URIPrefixes": ["s3://amzn-s3-demo-bucket/campaigns/"] }
      ]
    }
    ```

    Quelle modification corrige l'importation ?
body:
  options:
    - { id: a, text: { en: "Replace URIPrefixes with a URIs list that names every file under the prefix.", fr: "Remplacer URIPrefixes par une liste URIs qui nomme chaque fichier sous le préfixe." } }
    - { id: b, text: { en: 'Add `"containsHeader": "false"` in a globalUploadSettings section of the manifest.', fr: 'Ajouter `"containsHeader": "false"` dans une section globalUploadSettings du manifeste.' } }
    - { id: c, text: { en: 'Add `"format": "TSV"` and `"delimiter": "\t"` in a globalUploadSettings section of the manifest.', fr: 'Ajouter `"format": "TSV"` et `"delimiter": "\t"` dans une section globalUploadSettings du manifeste.' } }
    - { id: d, text: { en: "Save the manifest with a .csv extension so that Quick Sight reads it as delimited text.", fr: "Enregistrer le manifeste avec l'extension .csv afin que Quick Sight le lise comme du texte délimité." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Without globalUploadSettings, Quick Sight applies the defaults: CSV format with a comma delimiter and a header row. Tab-separated files therefore load as one column per row; setting the format to TSV with a tab delimiter fixes the parsing, and URIPrefixes already reads the subfolders recursively."
    fr: "Sans globalUploadSettings, Quick Sight applique les valeurs par défaut : format CSV avec la virgule comme délimiteur et une ligne d'en-tête. Les fichiers séparés par des tabulations se chargent donc en une colonne par ligne ; définir le format TSV avec la tabulation comme délimiteur corrige l'analyse, et URIPrefixes lit déjà les sous-dossiers de façon récursive."
  options:
    a:
      en: "Listing the files changes which files are imported, not how each line is split into columns."
      fr: "Lister les fichiers change les fichiers importés, et non la façon dont chaque ligne est découpée en colonnes."
    b:
      en: "The files do have a header row, so this setting would import the header as data and still not split the columns."
      fr: "Les fichiers ont bien une ligne d'en-tête : ce paramètre importerait l'en-tête comme une donnée sans découper les colonnes."
    d:
      en: "A Quick Sight manifest file must have the .json extension."
      fr: "Un fichier manifeste Quick Sight doit avoir l'extension .json."
references:
  - title: Supported formats for Amazon S3 manifest files
    url: https://docs.aws.amazon.com/quicksight/latest/user/supported-manifest-file-format.html
