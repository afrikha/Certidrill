id: deac01-3a-sdk-glue-job-arguments
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function starts an AWS Glue Spark job for each new file that lands in Amazon S3. Several runs of the job can run at the same time. Each run must process only the S3 object key that the function received, and the Glue script must read that key at run time.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda démarre une tâche Spark AWS Glue pour chaque nouveau fichier déposé dans Amazon S3. Plusieurs exécutions de la tâche peuvent avoir lieu en même temps. Chaque exécution doit traiter uniquement la clé d'objet S3 reçue par la fonction, et le script Glue doit lire cette clé au moment de l'exécution.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Call start_job_run with Arguments={'--input_key': key}, and read args['input_key'] in the script after getResolvedOptions(sys.argv, ['JOB_NAME', 'input_key']).", fr: "Appeler start_job_run avec Arguments={'--input_key': key}, et lire args['input_key'] dans le script après getResolvedOptions(sys.argv, ['JOB_NAME', 'input_key'])." } }
    - { id: b, text: { en: "Call start_job_run with Arguments={'--input-key': key}, and read args['input-key'] in the script after getResolvedOptions(sys.argv, ['JOB_NAME', 'input-key']).", fr: "Appeler start_job_run avec Arguments={'--input-key': key}, et lire args['input-key'] dans le script après getResolvedOptions(sys.argv, ['JOB_NAME', 'input-key'])." } }
    - { id: c, text: { en: "Call update_job to write the key in the job description before each start_job_run call, and read it in the script with get_job.", fr: "Appeler update_job pour écrire la clé dans la description de la tâche avant chaque appel start_job_run, et la lire dans le script avec get_job." } }
    - { id: d, text: { en: "Set an INPUT_KEY environment variable in the Lambda function, and read os.environ['INPUT_KEY'] in the Glue script.", fr: "Définir une variable d'environnement INPUT_KEY dans la fonction Lambda, et lire os.environ['INPUT_KEY'] dans le script Glue." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Job parameters are passed in the Arguments map of StartJobRun with keys that begin with two hyphens, and getResolvedOptions returns them to the script without the hyphens. Each run receives its own arguments, so concurrent runs do not interfere."
    fr: "Les paramètres de tâche sont transmis dans la table Arguments de StartJobRun avec des clés qui commencent par deux tirets, et getResolvedOptions les renvoie au script sans les tirets. Chaque exécution reçoit ses propres arguments : les exécutions simultanées n'interfèrent pas."
  options:
    b:
      en: "Argument names must use underscores, not hyphens, after the two leading hyphens; otherwise getResolvedOptions cannot resolve them."
      fr: "Les noms d'arguments doivent utiliser des traits de soulignement, pas des tirets, après les deux tirets initiaux ; sinon getResolvedOptions ne peut pas les résoudre."
    c:
      en: "The job definition is shared by all runs, so concurrent runs would overwrite each other's key."
      fr: "La définition de la tâche est partagée par toutes les exécutions : des exécutions simultanées écraseraient la clé les unes des autres."
    d:
      en: "Environment variables of a Lambda function exist only in the function's runtime and are not passed to Glue job runs."
      fr: "Les variables d'environnement d'une fonction Lambda n'existent que dans son environnement d'exécution et ne sont pas transmises aux exécutions de tâches Glue."
references:
  - title: Accessing parameters using getResolvedOptions
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-crawler-pyspark-extensions-get-resolved-options.html
