id: deac01-3a-mwaa-tasks-queued
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany schedules about 40 DAGs in an Amazon MWAA environment to start at 06:00 every day. The environment is configured with a minimum of 1 worker and a maximum of 2 workers. Every morning, many tasks remain in the queued state for more than 30 minutes while both workers run at high CPU utilization. The company wants the tasks to start promptly during this peak without changing the DAGs.

    Which solution will meet these requirements?
  fr: |
    AnyCompany planifie environ 40 DAG dans un environnement Amazon MWAA pour qu'ils démarrent à 06:00 chaque jour. L'environnement est configuré avec un minimum de 1 worker et un maximum de 2 workers. Chaque matin, de nombreuses tâches restent à l'état queued pendant plus de 30 minutes, alors que les deux workers fonctionnent avec une forte utilisation du processeur. L'entreprise veut que les tâches démarrent rapidement pendant ce pic, sans modifier les DAG.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the log level of the scheduler logs to ERROR so that the scheduler spends less time writing logs.", fr: "Passer le niveau de journalisation des journaux du planificateur à ERROR pour que le planificateur passe moins de temps à écrire des journaux." } }
    - { id: b, text: { en: "Move half of the DAG files to a second S3 bucket that the same environment also reads.", fr: "Déplacer la moitié des fichiers DAG vers un second compartiment S3 que le même environnement lit aussi." } }
    - { id: c, text: { en: "Update the environment to raise the maximum number of workers, for example to 10, so that autoscaling adds workers during the peak.", fr: "Mettre à jour l'environnement pour augmenter le nombre maximal de workers, par exemple à 10, afin que la mise à l'échelle automatique ajoute des workers pendant le pic." } }
    - { id: d, text: { en: "Raise the MaxConcurrentRuns value of the Glue jobs that the DAGs call.", fr: "Augmenter la valeur MaxConcurrentRuns des tâches Glue appelées par les DAG." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon MWAA adds workers up to the configured maximum when tasks are waiting. Here autoscaling is already at its ceiling of 2 workers, so raising the maximum (for example with update-environment --max-workers) lets the environment run more tasks at the same time and scale back down after the peak."
    fr: "Amazon MWAA ajoute des workers jusqu'au maximum configuré lorsque des tâches attendent. Ici, la mise à l'échelle automatique est déjà à son plafond de 2 workers : augmenter le maximum (par exemple avec update-environment --max-workers) permet d'exécuter plus de tâches en même temps, puis de réduire le nombre de workers après le pic."
  options:
    a:
      en: "The log level filters the messages sent to CloudWatch; it does not add capacity to run queued tasks."
      fr: "Le niveau de journalisation filtre les messages envoyés à CloudWatch ; il n'ajoute pas de capacité pour exécuter les tâches en file d'attente."
    b:
      en: "An environment reads its DAGs from the dags folder of its own bucket, and moving files does not add workers."
      fr: "Un environnement lit ses DAG dans le dossier dags de son propre compartiment, et déplacer des fichiers n'ajoute pas de workers."
    d:
      en: "The tasks are waiting for an Airflow worker slot, not for Glue; Glue concurrency does not affect the Airflow queue."
      fr: "Les tâches attendent un emplacement de worker Airflow, pas Glue ; la simultanéité Glue n'a pas d'effet sur la file d'attente Airflow."
references:
  - title: "Troubleshooting: DAGs, Operators, Connections, and other issues"
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/t-apache-airflow-202.html
  - title: What Is Amazon Managed Workflows for Apache Airflow?
    url: https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html
