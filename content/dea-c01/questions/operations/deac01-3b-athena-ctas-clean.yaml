id: deac01-3b-athena-ctas-clean
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer must turn the Athena table orders_raw, which is stored as CSV, into a cleaned table named orders_clean. The new table must be registered in the AWS Glue Data Catalog, stored as Parquet in a new Amazon S3 location, and contain no duplicate rows and no rows without an order_id. The engineer wants a single SQL statement.

    Which statement will meet these requirements?
  fr: |
    Un ingénieur des données doit transformer la table Athena orders_raw, stockée au format CSV, en une table nettoyée nommée orders_clean. La nouvelle table doit être enregistrée dans le AWS Glue Data Catalog, stockée au format Parquet dans un nouvel emplacement Amazon S3, et ne contenir ni lignes en double ni lignes sans order_id. L'ingénieur veut une seule instruction SQL.

    Quelle instruction répond à ces exigences ?
body:
  options:
    - { id: a, text: "`CREATE VIEW orders_clean AS SELECT DISTINCT * FROM orders_raw WHERE order_id IS NOT NULL`" }
    - { id: b, text: "`CREATE TABLE orders_clean WITH (format = 'PARQUET', external_location = 's3://amzn-s3-demo-bucket/clean/orders/') AS SELECT DISTINCT * FROM orders_raw WHERE order_id IS NOT NULL`" }
    - { id: c, text: "`INSERT INTO orders_raw SELECT DISTINCT * FROM orders_raw WHERE order_id IS NOT NULL`" }
    - { id: d, text: "`UNLOAD (SELECT DISTINCT * FROM orders_raw WHERE order_id IS NOT NULL) TO 's3://amzn-s3-demo-bucket/clean/orders/' WITH (format = 'PARQUET')`" }
answer: { optionId: b }
explanation:
  correct:
    en: "A CREATE TABLE AS SELECT (CTAS) statement creates a new table in the catalog from the results of a SELECT and stores its data files in the chosen S3 location, here in Parquet. SELECT DISTINCT removes the duplicate rows and the WHERE clause drops the rows without an order_id."
    fr: "Une instruction CREATE TABLE AS SELECT (CTAS) crée une nouvelle table dans le catalogue à partir des résultats d'un SELECT et stocke ses fichiers de données dans l'emplacement S3 choisi, ici au format Parquet. SELECT DISTINCT supprime les lignes en double et la clause WHERE écarte les lignes sans order_id."
  options:
    a:
      en: "A view stores only the query; no Parquet copy of the data is written to Amazon S3."
      fr: "Une vue ne stocke que la requête ; aucune copie Parquet des données n'est écrite dans Amazon S3."
    c:
      en: "INSERT INTO appends the selected rows to the CSV table itself, which adds more duplicates instead of creating a clean Parquet table."
      fr: "INSERT INTO ajoute les lignes sélectionnées à la table CSV elle-même, ce qui ajoute des doublons au lieu de créer une table Parquet propre."
    d:
      en: "UNLOAD writes the query results to Amazon S3 but does not create a table in the Data Catalog."
      fr: "UNLOAD écrit les résultats de la requête dans Amazon S3 mais ne crée pas de table dans le Data Catalog."
references:
  - title: Create a table from query results (CTAS)
    url: https://docs.aws.amazon.com/athena/latest/ug/ctas.html
  - title: CREATE TABLE AS
    url: https://docs.aws.amazon.com/athena/latest/ug/create-table-as.html
