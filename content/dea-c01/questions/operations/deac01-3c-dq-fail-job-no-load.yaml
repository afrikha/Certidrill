id: deac01-3c-dq-fail-job-no-load
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Glue Studio job loads daily order files into the reporting zone in Amazon S3. If any order in a file has an empty order_id, nothing from that file may be written to the reporting zone and the job run must end in a failed state so that the orchestration stops. The job already contains an Evaluate Data Quality transform with the rule IsComplete "order_id".

    How should the data engineer configure the transform?
  fr: |
    Une tâche AWS Glue Studio charge des fichiers de commandes quotidiens dans la zone de reporting d'Amazon S3. Si une commande d'un fichier a un order_id vide, rien de ce fichier ne doit être écrit dans la zone de reporting et l'exécution de la tâche doit se terminer en échec pour que l'orchestration s'arrête. La tâche contient déjà une transformation Evaluate Data Quality avec la règle IsComplete "order_id".

    Comment l'ingénieur des données doit-il configurer la transformation ?
body:
  options:
    - { id: a, text: { en: "Keep On ruleset failure set to None and add an analyzer for the order_id column.", fr: "Conserver On ruleset failure sur None et ajouter un analyseur (analyzer) pour la colonne order_id." } }
    - { id: b, text: { en: "Set On ruleset failure to Fail job without loading to target data.", fr: "Définir On ruleset failure sur Fail job without loading to target data." } }
    - { id: c, text: { en: "Replace the rule with IsUnique \"order_id\" and keep the default action.", fr: "Remplacer la règle par IsUnique \"order_id\" et conserver l'action par défaut." } }
    - { id: d, text: { en: "Keep the default action and set the number of retries of the job to 0.", fr: "Conserver l'action par défaut et définir le nombre de nouvelles tentatives de la tâche à 0." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With Fail job without loading to target data, the job fails immediately when a data quality error occurs and loads no data target. The default, None, lets the job continue despite ruleset failures."
    fr: "Avec Fail job without loading to target data, la tâche échoue immédiatement lorsqu'une erreur de qualité des données se produit et ne charge aucune cible. La valeur par défaut, None, laisse la tâche continuer malgré les échecs de l'ensemble de règles."
  options:
    a:
      en: "With None the job continues and loads the file, and analyzers only gather statistics without asserting a condition or triggering an action."
      fr: "Avec None, la tâche continue et charge le fichier, et les analyseurs ne font que collecter des statistiques sans vérifier de condition ni déclencher d'action."
    c:
      en: "IsUnique checks duplicates rather than empty values, and the default action does not stop the load."
      fr: "IsUnique vérifie les doublons plutôt que les valeurs vides, et l'action par défaut n'arrête pas le chargement."
    d:
      en: "Retries apply after a run fails; with the default action the run does not fail, so the file is still loaded."
      fr: "Les nouvelles tentatives s'appliquent après l'échec d'une exécution ; avec l'action par défaut, l'exécution n'échoue pas et le fichier est quand même chargé."
references:
  - title: Evaluating data quality for ETL jobs in AWS Glue Studio
    url: https://docs.aws.amazon.com/glue/latest/dg/tutorial-data-quality.html
