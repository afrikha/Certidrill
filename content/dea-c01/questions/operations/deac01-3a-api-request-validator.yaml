id: deac01-3a-api-request-validator
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany exposes sales data through an Amazon API Gateway REST API. The method GET /sales expects the store_id and date query string parameters and uses a Lambda integration that runs an Amazon Athena query. Many client requests omit store_id, and each of them still invokes the function and runs an expensive query over all stores. The company wants these requests rejected before they reach the backend, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose des données de ventes par une API REST Amazon API Gateway. La méthode GET /sales attend les paramètres de chaîne de requête store_id et date et utilise une intégration Lambda qui exécute une requête Amazon Athena. De nombreuses requêtes clientes omettent store_id, et chacune d'elles appelle quand même la fonction et exécute une requête coûteuse sur tous les magasins. L'entreprise veut que ces requêtes soient rejetées avant d'atteindre le backend, avec le MOINS d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add code at the start of the Lambda function that returns an error when store_id is missing.", fr: "Ajouter au début de la fonction Lambda du code qui renvoie une erreur lorsque store_id est absent." } }
    - { id: b, text: { en: "Mark store_id and date as required query string parameters and attach a request validator that validates request parameters.", fr: "Marquer store_id et date comme paramètres de chaîne de requête obligatoires et associer un validateur de requêtes qui valide les paramètres de requête." } }
    - { id: c, text: { en: "Add an AWS WAF rate-based rule to the stage that blocks clients sending many requests.", fr: "Ajouter à l'étape une règle AWS WAF basée sur le taux qui bloque les clients envoyant beaucoup de requêtes." } }
    - { id: d, text: { en: "Enable API caching on the stage so that repeated requests without store_id are served from the cache.", fr: "Activer la mise en cache d'API sur l'étape pour que les requêtes répétées sans store_id soient servies depuis le cache." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A request validator on a REST API method checks that required query string parameters, headers, or path parameters are present and non-blank, and can validate the body against a model. A failing request receives a 400 error without invoking the integration."
    fr: "Un validateur de requêtes sur une méthode d'API REST vérifie que les paramètres de chaîne de requête, les en-têtes ou les paramètres de chemin obligatoires sont présents et non vides, et peut valider le corps par rapport à un modèle. Une requête non conforme reçoit une erreur 400 sans appeler l'intégration."
  options:
    a:
      en: "The check works, but the function is still invoked for every bad request, and it needs code changes."
      fr: "La vérification fonctionne, mais la fonction est toujours appelée pour chaque mauvaise requête, et cela demande de modifier le code."
    c:
      en: "A rate-based rule limits request volume per client; it does not check which parameters a request contains."
      fr: "Une règle basée sur le taux limite le volume de requêtes par client ; elle ne vérifie pas les paramètres que contient une requête."
    d:
      en: "Caching returns earlier responses; the first request for each key still reaches the backend, and bad requests are not rejected."
      fr: "La mise en cache renvoie des réponses antérieures ; la première requête de chaque clé atteint toujours le backend, et les mauvaises requêtes ne sont pas rejetées."
references:
  - title: Request validation for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-method-request-validation.html
