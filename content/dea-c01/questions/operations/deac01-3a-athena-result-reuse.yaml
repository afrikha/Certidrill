id: deac01-3a-athena-result-reuse
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A dashboard sends the same Amazon Athena queries every few minutes, in one workgroup, against AWS Glue Data Catalog tables that are refreshed once per hour. The tables have no Lake Formation fine-grained permissions. Results that are up to 1 hour old are acceptable. The company wants to reduce query cost and latency with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un tableau de bord envoie les mêmes requêtes Amazon Athena toutes les quelques minutes, dans un groupe de travail, sur des tables du catalogue de données AWS Glue actualisées une fois par heure. Les tables n'ont pas d'autorisations fines Lake Formation. Des résultats datant de 1 heure au plus sont acceptables. L'entreprise veut réduire le coût et la latence des requêtes avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run each dashboard query in its own workgroup so that the results of each query are cached separately.", fr: "Exécuter chaque requête du tableau de bord dans son propre groupe de travail pour que les résultats de chaque requête soient mis en cache séparément." } }
    - { id: b, text: { en: "Enable partition projection on the tables so that Athena stops reading partition metadata from the catalog.", fr: "Activer la projection de partitions sur les tables pour qu'Athena ne lise plus les métadonnées de partition dans le catalogue." } }
    - { id: c, text: { en: "Enable S3 Transfer Acceleration on the bucket that stores the Athena query results.", fr: "Activer S3 Transfer Acceleration sur le compartiment qui stocke les résultats des requêtes Athena." } }
    - { id: d, text: { en: "Enable query result reuse for the dashboard queries with a maximum age of 60 minutes.", fr: "Activer la réutilisation des résultats de requête pour les requêtes du tableau de bord avec un âge maximal de 60 minutes." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With query result reuse, Athena returns the last stored result of a matching query instead of running it again, as long as the result is not older than the maximum age (up to 7 days). This reduces the bytes scanned and the response time, and it applies to Glue-registered tables without fine-grained access control."
    fr: "Avec la réutilisation des résultats de requête, Athena renvoie le dernier résultat stocké d'une requête correspondante au lieu de la réexécuter, tant que ce résultat ne dépasse pas l'âge maximal (jusqu'à 7 jours). Cela réduit les octets analysés et le temps de réponse, et s'applique aux tables enregistrées dans Glue sans contrôle d'accès fin."
  options:
    a:
      en: "Results are reused only within the same workgroup, and separate workgroups add administration without avoiding new runs."
      fr: "Les résultats ne sont réutilisés que dans le même groupe de travail, et des groupes de travail séparés ajoutent de l'administration sans éviter de nouvelles exécutions."
    b:
      en: "Partition projection speeds up partition lookups but each query still scans the data again."
      fr: "La projection de partitions accélère la recherche des partitions, mais chaque requête analyse toujours à nouveau les données."
    c:
      en: "Transfer Acceleration speeds up long-distance S3 transfers; it does not reduce the data that queries scan."
      fr: "Transfer Acceleration accélère les transferts S3 longue distance ; il ne réduit pas les données analysées par les requêtes."
references:
  - title: Reuse query results in Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/reusing-query-results.html
