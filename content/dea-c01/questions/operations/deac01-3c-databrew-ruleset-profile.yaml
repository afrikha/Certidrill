id: deac01-3c-databrew-ruleset-profile
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Business analysts at an insurance company use AWS Glue DataBrew to prepare a weekly policies dataset from Amazon S3. They want to define, without writing code, rules such as "the value in column premium is between 0 and 50,000" and "missing values in column agent_id do not exceed 2%", and to check them on every new weekly file.

    Which solution will meet these requirements?
  fr: |
    Les analystes métier d'une compagnie d'assurance utilisent AWS Glue DataBrew pour préparer un jeu de données hebdomadaire de polices à partir d'Amazon S3. Ils veulent définir, sans écrire de code, des règles telles que « la valeur de la colonne premium est comprise entre 0 et 50 000 » et « les valeurs manquantes de la colonne agent_id ne dépassent pas 2 % », et les vérifier sur chaque nouveau fichier hebdomadaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the checks as recipe steps that filter out invalid rows, and run the recipe in a recipe job every week.", fr: "Ajouter les contrôles comme étapes de recette qui filtrent les lignes non valides, et exécuter la recette dans une tâche de recette chaque semaine." } }
    - { id: b, text: { en: "Create a custom classifier for an AWS Glue crawler that rejects the files that break the rules.", fr: "Créer un classificateur personnalisé pour un robot d'analyse AWS Glue qui rejette les fichiers qui enfreignent les règles." } }
    - { id: c, text: { en: "Create a DataBrew ruleset with the two rules for the dataset, and add the ruleset to a scheduled profile job.", fr: "Créer pour le jeu de données un ensemble de règles DataBrew contenant les deux règles, et ajouter cet ensemble de règles à une tâche de profil planifiée." } }
    - { id: d, text: { en: "Change the sample of the DataBrew project to the full dataset and review the column statistics every week.", fr: "Remplacer l'échantillon du projet DataBrew par le jeu de données complet et examiner chaque semaine les statistiques des colonnes." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A DataBrew ruleset is a set of data quality rules associated with a dataset, and the ruleset fails validation if any rule's criteria is not met. Rulesets are validated when they are added to a profile job, which produces a validation report and can run on a schedule."
    fr: "Un ensemble de règles DataBrew est un ensemble de règles de qualité des données associé à un jeu de données, et il échoue à la validation si les critères d'une règle ne sont pas respectés. Les ensembles de règles sont validés lorsqu'ils sont ajoutés à une tâche de profil, qui produit un rapport de validation et peut s'exécuter selon une planification."
  options:
    a:
      en: "Recipe steps transform or remove data; they do not evaluate a percentage threshold or report which rule passed or failed."
      fr: "Les étapes de recette transforment ou suppriment des données ; elles n'évaluent pas un seuil en pourcentage et n'indiquent pas quelle règle a réussi ou échoué."
    b:
      en: "Crawler classifiers infer the format and schema of data; they do not validate value ranges or missing values."
      fr: "Les classificateurs des robots d'analyse déduisent le format et le schéma des données ; ils ne valident ni des plages de valeurs ni des valeurs manquantes."
    d:
      en: "A project sample is for interactive work and is limited in size; manual reviews are not rules that are checked automatically."
      fr: "L'échantillon d'un projet sert au travail interactif et sa taille est limitée ; des examens manuels ne sont pas des règles vérifiées automatiquement."
references:
  - title: Validating data quality in AWS Glue DataBrew
    url: https://docs.aws.amazon.com/databrew/latest/dg/profile.data-quality-rules.html
