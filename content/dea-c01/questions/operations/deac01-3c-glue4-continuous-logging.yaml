id: deac01-3c-glue4-continuous-logging
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer maintains a long-running AWS Glue 4.0 Spark job. When the job behaves unexpectedly, the engineer can read its driver and executor logs in Amazon CloudWatch only after the run has finished. The engineer wants to follow these logs in CloudWatch while the job is still running.

    Which job parameter should the data engineer set?
  fr: |
    Un ingénieur des données gère une tâche Spark AWS Glue 4.0 de longue durée. Lorsque la tâche se comporte de façon inattendue, l'ingénieur ne peut lire ses journaux de pilote et d'exécuteurs dans Amazon CloudWatch qu'une fois l'exécution terminée. L'ingénieur souhaite suivre ces journaux dans CloudWatch pendant que la tâche s'exécute encore.

    Quel paramètre de tâche l'ingénieur des données doit-il définir ?
body:
  options:
    - { id: a, text: '`--enable-metrics`' }
    - { id: b, text: '`--enable-continuous-cloudwatch-log` = `true`' }
    - { id: c, text: '`--enable-spark-ui` = `true`' }
    - { id: d, text: '`--enable-observability-metrics` = `true`' }
answer: { optionId: b }
explanation:
  correct:
    en: "The --enable-continuous-cloudwatch-log parameter turns on real-time continuous logging, so Spark driver and executor logs can be viewed in CloudWatch during the run. Without it, logs are available only after the job completes; AWS Glue 5.0 enables real-time logging for all jobs."
    fr: "Le paramètre --enable-continuous-cloudwatch-log active la journalisation continue en temps réel : les journaux du pilote et des exécuteurs Spark peuvent être consultés dans CloudWatch pendant l'exécution. Sans lui, les journaux ne sont disponibles qu'à la fin de la tâche ; AWS Glue 5.0 active la journalisation en temps réel pour toutes les tâches."
  options:
    a:
      en: "--enable-metrics collects job profiling metrics; it does not stream the log events during the run."
      fr: "--enable-metrics collecte des métriques de profilage de la tâche ; il ne diffuse pas les événements de journal pendant l'exécution."
    c:
      en: "--enable-spark-ui writes Spark event logs to S3 for the Spark UI; it does not send driver and executor logs to CloudWatch in real time."
      fr: "--enable-spark-ui écrit les journaux d'événements Spark dans S3 pour l'interface Spark UI ; il n'envoie pas les journaux du pilote et des exécuteurs vers CloudWatch en temps réel."
    d:
      en: "Observability metrics publish CloudWatch metrics about the run, not its log events."
      fr: "Les métriques d'observabilité publient des métriques CloudWatch sur l'exécution, pas ses événements de journal."
references:
  - title: Using job parameters in AWS Glue jobs
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-glue-arguments.html
