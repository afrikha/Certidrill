id: deac01-3a-sfn-catch-retry-notify
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Step Functions Standard workflow runs an AWS Glue job with the glue:startJobRun.sync integration. The data team wants transient failures of the job to be retried up to 3 times with increasing delays between attempts. If the job still fails, the workflow must publish a message to an Amazon SNS topic and then end with a failed status.

    Which combination of changes will meet these requirements? (Choose two.)
  fr: |
    Un flux de travail Standard AWS Step Functions exécute une tâche AWS Glue avec l'intégration glue:startJobRun.sync. L'équipe data veut que les échecs transitoires de la tâche soient retentés jusqu'à 3 fois avec des délais croissants entre les tentatives. Si la tâche échoue encore, le flux de travail doit publier un message dans une rubrique Amazon SNS, puis se terminer avec un état d'échec.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a Retry field to the Glue task with IntervalSeconds 60, MaxAttempts 3, and BackoffRate 2.", fr: "Ajouter au Task Glue un champ Retry avec IntervalSeconds 60, MaxAttempts 3 et BackoffRate 2." } }
    - { id: b, text: { en: "Add a Catch field with States.ALL to the Glue task whose Next state is an sns:publish task followed by a Fail state.", fr: "Ajouter au Task Glue un champ Catch avec States.ALL dont l'état Next est une tâche sns:publish suivie d'un état Fail." } }
    - { id: c, text: { en: "Add a Choice state after the Glue task that publishes to SNS when the JobRunState field of the output equals FAILED.", fr: "Ajouter après le Task Glue un état Choice qui publie dans SNS lorsque le champ JobRunState de la sortie vaut FAILED." } }
    - { id: d, text: { en: "Set the TimeoutSeconds field of the state machine to 3 so that Step Functions restarts the execution after each failure.", fr: "Définir le champ TimeoutSeconds de la machine d'état sur 3 pour que Step Functions redémarre l'exécution après chaque échec." } }
    - { id: e, text: { en: "Change the workflow type to Express so that failed executions are retried automatically.", fr: "Changer le type de flux de travail en Express pour que les exécutions en échec soient retentées automatiquement." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "A retrier with MaxAttempts 3 and BackoffRate 2 retries the task three times and doubles the wait after each attempt. Retriers are applied first; when they are exhausted, a catcher on States.ALL moves the execution to the notification task, and a Fail state then ends the execution as failed."
    fr: "Un retrier avec MaxAttempts 3 et BackoffRate 2 retente la tâche trois fois et double l'attente après chaque tentative. Les retriers s'appliquent d'abord ; lorsqu'ils sont épuisés, un catcher sur States.ALL envoie l'exécution vers la tâche de notification, puis un état Fail termine l'exécution en échec."
  options:
    c:
      en: "With .sync, a failed job run makes the Task state fail, so the Choice state after it is never reached."
      fr: "Avec .sync, une exécution de tâche en échec fait échouer l'état Task : l'état Choice qui le suit n'est jamais atteint."
    d:
      en: "TimeoutSeconds limits the duration of the execution; it does not restart anything, and 3 seconds would time out every run."
      fr: "TimeoutSeconds limite la durée de l'exécution ; il ne redémarre rien, et 3 secondes feraient expirer chaque exécution."
    e:
      en: "Express workflows do not support .sync integrations and do not add automatic retries of failed tasks."
      fr: "Les flux de travail Express ne prennent pas en charge les intégrations .sync et n'ajoutent pas de nouvelles tentatives automatiques des tâches en échec."
references:
  - title: Handling errors in Step Functions workflows
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
