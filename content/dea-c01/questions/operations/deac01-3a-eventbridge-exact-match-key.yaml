id: deac01-3a-eventbridge-exact-match-key
objective: "3.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Amazon EventBridge is enabled on the Amazon S3 bucket example-landing. A data engineer creates the following rule on the default event bus to start an AWS Glue workflow for every object created under the raw/ prefix. Objects such as raw/2026/11/22/orders.json are created every hour, but the rule never matches.

    ```json
    {
      "source": ["aws.s3"],
      "detail-type": ["Object Created"],
      "detail": {
        "bucket": { "name": ["example-landing"] },
        "object": { "key": ["raw/"] }
      }
    }
    ```

    Which change will make the rule match these objects?
  fr: |
    Amazon EventBridge est activé sur le compartiment Amazon S3 example-landing. Un ingénieur data crée la règle suivante sur le bus d'événements par défaut pour démarrer un flux de travail AWS Glue pour chaque objet créé sous le préfixe raw/. Des objets tels que raw/2026/11/22/orders.json sont créés toutes les heures, mais la règle ne correspond jamais.

    ```json
    {
      "source": ["aws.s3"],
      "detail-type": ["Object Created"],
      "detail": {
        "bucket": { "name": ["example-landing"] },
        "object": { "key": ["raw/"] }
      }
    }
    ```

    Quelle modification permet à la règle de correspondre à ces objets ?
body:
  options:
    - { id: a, text: { en: "Change the detail-type value from Object Created to PutObject.", fr: "Remplacer la valeur de detail-type Object Created par PutObject." } }
    - { id: b, text: { en: "Create the same rule on a custom event bus instead of the default event bus.", fr: "Créer la même règle sur un bus d'événements personnalisé au lieu du bus par défaut." } }
    - { id: c, text: { en: "Add a reason field that matches CompleteMultipartUpload to the detail object.", fr: "Ajouter à l'objet detail un champ reason qui correspond à CompleteMultipartUpload." } }
    - { id: d, text: { en: "Replace the key value with a prefix matcher: \"key\": [{ \"prefix\": \"raw/\" }].", fr: "Remplacer la valeur de key par un opérateur de préfixe : \"key\": [{ \"prefix\": \"raw/\" }]." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A plain string in an event pattern matches only that exact value, so the pattern matches an object whose key is exactly raw/. The prefix comparison operator matches string values that begin with the given value, which covers every key under raw/."
    fr: "Une chaîne simple dans un modèle d'événement ne correspond qu'à cette valeur exacte : le modèle ne correspond qu'à un objet dont la clé est exactement raw/. L'opérateur de comparaison prefix correspond aux chaînes qui commencent par la valeur donnée, ce qui couvre toutes les clés sous raw/."
  options:
    a:
      en: "The detail-type of S3 events is Object Created; PutObject is a value of the reason field."
      fr: "Le detail-type des événements S3 est Object Created ; PutObject est une valeur du champ reason."
    b:
      en: "S3 sends events to the default event bus; a rule on a custom bus would receive nothing."
      fr: "S3 envoie les événements au bus d'événements par défaut ; une règle sur un bus personnalisé ne recevrait rien."
    c:
      en: "Adding a condition only narrows the pattern further and the exact key comparison still fails."
      fr: "Ajouter une condition ne fait que restreindre davantage le modèle, et la comparaison exacte de la clé échoue toujours."
references:
  - title: Comparison operators for use in event patterns in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-create-pattern-operators.html
  - title: EventBridge event message structure
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/ev-events.html
