id: deac01-3a-lambda-kinesis-tumbling
objective: "3.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Lambda function consumes clickstream records from an Amazon Kinesis Data Streams stream. The company wants the existing function to compute click counts per page for each 1-minute interval of each shard and to write one aggregate item per interval to Amazon DynamoDB. The company does not want to store intermediate counts in an external database between invocations.

    Which solution will meet these requirements?
  fr: |
    Une fonction Lambda consomme des enregistrements de parcours de navigation d'un flux Amazon Kinesis Data Streams. L'entreprise veut que la fonction existante calcule le nombre de clics par page pour chaque intervalle de 1 minute de chaque partition (shard) et écrive un élément agrégé par intervalle dans Amazon DynamoDB. L'entreprise ne veut pas stocker les comptes intermédiaires dans une base de données externe entre les appels.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the batching window of the event source mapping to 60 seconds and count the clicks within each batch.", fr: "Définir la fenêtre de traitement par lots du mappage de source d'événement sur 60 secondes et compter les clics dans chaque lot." } }
    - { id: b, text: { en: "Set a 60-second tumbling window on the event source mapping, return the counts as state, and write the item when isFinalInvokeForWindow is true.", fr: "Définir une fenêtre bascule (tumbling window) de 60 secondes sur le mappage de source d'événement, renvoyer les comptes comme état et écrire l'élément lorsque isFinalInvokeForWindow vaut true." } }
    - { id: c, text: { en: "Replace the function with an Amazon Managed Service for Apache Flink application that uses a 1-minute window.", fr: "Remplacer la fonction par une application Amazon Managed Service for Apache Flink qui utilise une fenêtre de 1 minute." } }
    - { id: d, text: { en: "Store the running counts in an Amazon ElastiCache cluster and write them to DynamoDB every minute.", fr: "Stocker les comptes en cours dans un cluster Amazon ElastiCache et les écrire dans DynamoDB chaque minute." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Tumbling windows let a Kinesis consumer keep state across invocations without an external database: each invocation receives the window's state and returns the updated state (up to 1 MB per shard). On the final invocation of the window, isFinalInvokeForWindow is true, and the function writes the aggregate."
    fr: "Les fenêtres bascules permettent à un consommateur Kinesis de conserver un état entre les appels sans base de données externe : chaque appel reçoit l'état de la fenêtre et renvoie l'état mis à jour (jusqu'à 1 Mo par partition). Lors de l'appel final de la fenêtre, isFinalInvokeForWindow vaut true, et la fonction écrit l'agrégat."
  options:
    a:
      en: "A batching window only delays invocations; one interval can span several batches, and counts are lost between invocations."
      fr: "Une fenêtre de traitement par lots ne fait que retarder les appels ; un intervalle peut couvrir plusieurs lots, et les comptes sont perdus entre les appels."
    c:
      en: "Flink can aggregate by window, but it replaces the existing Lambda function that the company wants to keep."
      fr: "Flink peut agréger par fenêtre, mais il remplace la fonction Lambda existante que l'entreprise veut conserver."
    d:
      en: "ElastiCache is the external store for intermediate state that the company does not want."
      fr: "ElastiCache est le stockage externe d'état intermédiaire dont l'entreprise ne veut pas."
references:
  - title: Implementing stateful Kinesis Data Streams processing in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-windows.html
