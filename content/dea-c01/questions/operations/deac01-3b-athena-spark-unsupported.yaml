id: deac01-3b-athena-spark-unsupported
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team moves its data exploration to Athena notebooks in a workgroup that uses PySpark engine version 3. Some notebook cells fail when they read objects from the AWS Glue Data Catalog that the team queries without errors in an Athena SQL workgroup. No AWS Lake Formation permissions are in use.

    Which characteristics of the failing objects explain the failures? (Choose two.)
  fr: |
    Une équipe déplace son exploration des données vers des blocs-notes Athena dans un groupe de travail qui utilise PySpark engine version 3. Certaines cellules échouent lorsqu'elles lisent des objets du AWS Glue Data Catalog que l'équipe interroge sans erreur dans un groupe de travail Athena SQL. Aucune autorisation AWS Lake Formation n'est utilisée.

    Quelles caractéristiques des objets en échec expliquent les échecs ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The object is a view that was created with Athena SQL.", fr: "L'objet est une vue créée avec Athena SQL." } }
    - { id: b, text: { en: "The table stores its data as Snappy-compressed Parquet files.", fr: "La table stocke ses données sous forme de fichiers Parquet compressés avec Snappy." } }
    - { id: c, text: { en: "The table uses partition projection.", fr: "La table utilise la projection de partitions." } }
    - { id: d, text: { en: "The table belongs to the Data Catalog of the same AWS account and Region.", fr: "La table appartient au Data Catalog du même compte AWS et de la même Région." } }
    - { id: e, text: { en: "The table is partitioned by date, and its partitions were added with MSCK REPAIR TABLE.", fr: "La table est partitionnée par date, et ses partitions ont été ajoutées avec MSCK REPAIR TABLE." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "With PySpark engine version 3, views created by Athena SQL cannot be queried by Athena for Spark, because the two engines implement views differently. Tables that use partition projection are not supported either."
    fr: "Avec PySpark engine version 3, les vues créées par Athena SQL ne peuvent pas être interrogées par Athena for Spark, car les deux moteurs implémentent les vues différemment. Les tables qui utilisent la projection de partitions ne sont pas prises en charge non plus."
  options:
    b:
      en: "Snappy-compressed Parquet is a common columnar format that Spark reads natively."
      fr: "Le Parquet compressé avec Snappy est un format en colonnes courant que Spark lit nativement."
    d:
      en: "Athena for Spark sessions read the Data Catalog of their own account and Region by default."
      fr: "Les sessions Athena for Spark lisent par défaut le Data Catalog de leur propre compte et de leur Région."
    e:
      en: "Partitions registered in the Data Catalog, for example by MSCK REPAIR TABLE, are ordinary catalog partitions that Spark can read."
      fr: "Les partitions enregistrées dans le Data Catalog, par exemple par MSCK REPAIR TABLE, sont des partitions de catalogue ordinaires que Spark peut lire."
references:
  - title: Considerations and limitations
    url: https://docs.aws.amazon.com/athena/latest/ug/notebooks-spark-considerations-and-limitations.html
