id: deac01-3b-athena-iceberg-time-travel
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores customer records in an Apache Iceberg table named customers that it queries with Athena engine version 3. An auditor asks to see the full content of the table exactly as it was at 08:00 UTC on March 1, 2026, before a faulty update ran.

    Which query will meet this requirement?
  fr: |
    Une entreprise stocke ses fiches clients dans une table Apache Iceberg nommée customers, qu'elle interroge avec la version 3 du moteur Athena. Un auditeur demande à voir le contenu complet de la table exactement tel qu'il était le 1er mars 2026 à 08:00 UTC, avant l'exécution d'une mise à jour erronée.

    Quelle requête répond à cette exigence ?
body:
  options:
    - { id: a, text: "`SELECT * FROM customers WHERE updated_at <= TIMESTAMP '2026-03-01 08:00:00 UTC'`" }
    - { id: b, text: "`SELECT * FROM customers FOR SYSTEM_TIME AS OF TIMESTAMP '2026-03-01 08:00:00 UTC'`" }
    - { id: c, text: "`SELECT * FROM customers FOR TIMESTAMP AS OF TIMESTAMP '2026-03-01 08:00:00 UTC'`" }
    - { id: d, text: "`SELECT * FROM \"customers$history\"`" }
answer: { optionId: c }
explanation:
  correct:
    en: "Athena engine version 3 queries a past state of an Iceberg table with FOR TIMESTAMP AS OF, which reads the snapshot that was current at that time. The result is the table as it was then, including rows that were later changed or deleted."
    fr: "La version 3 du moteur Athena interroge un état passé d'une table Iceberg avec FOR TIMESTAMP AS OF, qui lit l'instantané en vigueur à ce moment-là. Le résultat est la table telle qu'elle était alors, y compris les lignes modifiées ou supprimées depuis."
  options:
    a:
      en: "This filters the current rows: rows changed after that time are missing and deleted rows are not returned."
      fr: "Cette requête filtre les lignes actuelles : les lignes modifiées après cette heure manquent et les lignes supprimées ne sont pas renvoyées."
    b:
      en: "FOR SYSTEM_TIME AS OF was the engine version 2 syntax; engine version 3 replaced it with FOR TIMESTAMP AS OF."
      fr: "FOR SYSTEM_TIME AS OF était la syntaxe de la version 2 du moteur ; la version 3 l'a remplacée par FOR TIMESTAMP AS OF."
    d:
      en: "The $history metadata table shows the history of the table's snapshots, not the customer rows themselves."
      fr: "La table de métadonnées $history montre l'historique des instantanés de la table, pas les lignes clients elles-mêmes."
references:
  - title: Perform time travel and version travel queries
    url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-time-travel-and-version-travel-queries.html
  - title: Query Iceberg table data
    url: https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-table-data.html
