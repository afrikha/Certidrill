id: deac01-3b-config-resource-history
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team must be able to show auditors the configuration history of its Amazon Redshift clusters and Amazon Kinesis data streams: what each setting was on any past date and when it changed. The team wants a managed service that records this automatically.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données doit pouvoir montrer aux auditeurs l'historique de configuration de ses clusters Amazon Redshift et de ses flux de données Amazon Kinesis : la valeur de chaque paramètre à n'importe quelle date passée et le moment où il a changé. L'équipe veut un service géré qui enregistre ces informations automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Publish the cluster and stream metrics to Amazon CloudWatch and keep them for the audit period.", fr: "Publier les métriques des clusters et des flux dans Amazon CloudWatch et les conserver pendant la période d'audit." } }
    - { id: b, text: { en: "Turn on AWS Config recording for the AWS::Redshift::Cluster and AWS::Kinesis::Stream resource types.", fr: "Activer l'enregistrement AWS Config pour les types de ressources AWS::Redshift::Cluster et AWS::Kinesis::Stream." } }
    - { id: c, text: { en: "Collect the cluster and stream settings with AWS Systems Manager Inventory and keep the inventory history.", fr: "Collecter les paramètres des clusters et des flux avec AWS Systems Manager Inventory et conserver l'historique de l'inventaire." } }
    - { id: d, text: { en: "Tag every cluster and stream with its current settings after each change.", fr: "Étiqueter chaque cluster et chaque flux avec ses paramètres actuels après chaque modification." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Config records configuration items for supported resource types, including Redshift clusters and Kinesis streams, each time their configuration changes. Auditors can then see the configuration of a resource at a past point in time and the timeline of its changes."
    fr: "AWS Config enregistre des éléments de configuration pour les types de ressources pris en charge, dont les clusters Redshift et les flux Kinesis, à chaque modification de leur configuration. Les auditeurs peuvent alors voir la configuration d'une ressource à un moment passé et la chronologie de ses modifications."
  options:
    a:
      en: "Metrics describe performance and usage over time, not the configuration settings of the resources."
      fr: "Les métriques décrivent les performances et l'utilisation dans le temps, et non les paramètres de configuration des ressources."
    c:
      en: "Systems Manager Inventory collects software and configuration data from managed nodes, not Redshift or Kinesis settings."
      fr: "Systems Manager Inventory collecte des données de logiciels et de configuration sur des nœuds gérés, et non les paramètres Redshift ou Kinesis."
    d:
      en: "Manual tagging is not automatic, keeps only the latest values and cannot be trusted as audit evidence."
      fr: "L'étiquetage manuel n'est pas automatique, ne conserve que les dernières valeurs et ne constitue pas une preuve d'audit fiable."
references:
  - title: Supported Resource Types for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/resource-config-reference.html
  - title: What Is AWS Config?
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
