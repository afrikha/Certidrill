id: deac01-3c-databrew-duplicates-correlation
objective: "3.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data analyst investigates an AWS Glue DataBrew dataset of invoices that downstream reports describe as inconsistent. The analyst suspects two problems. First, the same invoice rows are present several times in the dataset. Second, the gross_amount and net_amount columns, which should move together, no longer do so for many rows. The analyst wants the next DataBrew profile job to report on both problems.

    Which two profile job settings should the analyst turn on? (Choose two.)
  fr: |
    Un analyste de données examine un jeu de données de factures AWS Glue DataBrew que les rapports en aval décrivent comme incohérent. L'analyste soupçonne deux problèmes. D'abord, les mêmes lignes de facture sont présentes plusieurs fois dans le jeu de données. Ensuite, les colonnes gross_amount et net_amount, qui devraient évoluer ensemble, ne le font plus pour de nombreuses lignes. L'analyste veut que la prochaine tâche de profil DataBrew rende compte des deux problèmes.

    Quels sont les deux paramètres de la tâche de profil que l'analyste doit activer ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Duplicate row detection and count in the dataset-level configuration", fr: "La détection et le comptage des lignes en double dans la configuration au niveau du jeu de données" } }
    - { id: b, text: { en: "PII entity detection on the gross_amount and net_amount columns", fr: "La détection d'entités PII sur les colonnes gross_amount et net_amount" } }
    - { id: c, text: { en: "The correlations matrix for the gross_amount and net_amount columns", fr: "La matrice de corrélations pour les colonnes gross_amount et net_amount" } }
    - { id: d, text: { en: "A configuration override that limits the statistics computed for the two amount columns", fr: "Un remplacement de configuration qui limite les statistiques calculées pour les deux colonnes de montant" } }
    - { id: e, text: { en: "CloudWatch logging for the profile job in the advanced job settings", fr: "La journalisation CloudWatch de la tâche de profil dans les paramètres avancés de la tâche" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "At the dataset level, a profile job can detect and count duplicate rows and can compute a correlations matrix for selected columns. The correlation statistic is the Pearson coefficient between two columns, which shows how closely their values are related."
    fr: "Au niveau du jeu de données, une tâche de profil peut détecter et compter les lignes en double, et calculer une matrice de corrélations pour les colonnes sélectionnées. La statistique de corrélation est le coefficient de Pearson entre deux colonnes, qui montre à quel point leurs valeurs sont liées."
  options:
    b:
      en: "Entity detection finds personal data such as emails or card numbers; it says nothing about duplicates or the relation between amounts."
      fr: "La détection d'entités trouve des données personnelles comme des e-mails ou des numéros de carte ; elle ne dit rien des doublons ni de la relation entre les montants."
    d:
      en: "An override that limits statistics reduces the information collected instead of adding the two checks."
      fr: "Un remplacement qui limite les statistiques réduit les informations collectées au lieu d'ajouter les deux contrôles."
    e:
      en: "Job logs help diagnose the job itself; they do not add any statistic about the data."
      fr: "Les journaux de la tâche aident à diagnostiquer la tâche elle-même ; ils n'ajoutent aucune statistique sur les données."
references:
  - title: Creating and working with AWS Glue DataBrew profile jobs
    url: https://docs.aws.amazon.com/databrew/latest/dg/jobs.profile.html
  - title: Building a profile job configuration programmatically in AWS Glue DataBrew
    url: https://docs.aws.amazon.com/databrew/latest/dg/profile.configuration.html
