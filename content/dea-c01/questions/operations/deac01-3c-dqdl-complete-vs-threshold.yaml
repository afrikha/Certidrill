id: deac01-3c-dqdl-complete-vs-threshold
objective: "3.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue ETL job evaluates incoming customer records with an Evaluate Data Quality transform before it loads them. The data steward sets two requirements. The customer_id field must never be null in any record. The phone field is optional, but at least 95% of the records in each batch must have a phone value that is not null.

    Which two DQDL rules will meet these requirements? (Choose two.)
  fr: |
    Une tâche ETL AWS Glue évalue les enregistrements clients entrants avec une transformation Evaluate Data Quality avant de les charger. Le responsable des données fixe deux exigences. Le champ customer_id ne doit jamais être nul, dans aucun enregistrement. Le champ phone est facultatif, mais au moins 95 % des enregistrements de chaque lot doivent avoir une valeur phone non nulle.

    Quelles sont les deux règles DQDL qui répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: '`IsComplete "customer_id"`' }
    - { id: b, text: '`IsUnique "customer_id"`' }
    - { id: c, text: '`Completeness "customer_id" > 0.95`' }
    - { id: d, text: '`Completeness "phone" >= 0.95`' }
    - { id: e, text: '`IsComplete "phone"`' }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "IsComplete passes only when every value of the column is present, which enforces a field that must never be null. Completeness returns the share of non-null values, so the expression >= 0.95 accepts a batch in which at least 95% of the records have a phone value."
    fr: "IsComplete ne réussit que si toutes les valeurs de la colonne sont présentes, ce qui impose un champ qui ne doit jamais être nul. Completeness renvoie la part des valeurs non nulles : l'expression >= 0.95 accepte un lot dans lequel au moins 95 % des enregistrements ont une valeur phone."
  options:
    b:
      en: "IsUnique checks that values are not duplicated; it does not require every record to have a value."
      fr: "IsUnique vérifie que les valeurs ne sont pas en double ; elle n'exige pas que chaque enregistrement ait une valeur."
    c:
      en: "This rule accepts up to 5% of null customer_id values, but the field must never be null."
      fr: "Cette règle accepte jusqu'à 5 % de valeurs customer_id nulles, alors que le champ ne doit jamais être nul."
    e:
      en: "Requiring a phone value in every record is stricter than the 95% rule and would fail valid batches."
      fr: "Exiger une valeur phone dans chaque enregistrement est plus strict que la règle des 95 % et ferait échouer des lots valides."
references:
  - title: Data Quality Definition Language (DQDL) reference
    url: https://docs.aws.amazon.com/glue/latest/dg/dqdl.html
