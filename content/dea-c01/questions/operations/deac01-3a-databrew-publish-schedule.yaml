id: deac01-3a-databrew-publish-schedule
objective: "3.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An analyst at AnyCompany built a cleaning recipe interactively in an AWS Glue DataBrew project that works on a sample of a sales dataset. The recipe must now be applied to the full dataset every day at 02:00 UTC, and the output must be written to Amazon S3. The analyst does not write code.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une analyste d'AnyCompany a créé une recette de nettoyage de façon interactive dans un projet AWS Glue DataBrew qui travaille sur un échantillon d'un jeu de données de ventes. La recette doit maintenant être appliquée au jeu de données complet chaque jour à 02:00 UTC, et la sortie doit être écrite dans Amazon S3. L'analyste n'écrit pas de code.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Publish the recipe so that a version of it can be used by jobs.", fr: "Publier la recette pour qu'une version de celle-ci puisse être utilisée par des tâches." } }
    - { id: b, text: { en: "Create a profile job that uses the recipe and the dataset, and write the profile to Amazon S3.", fr: "Créer une tâche de profil qui utilise la recette et le jeu de données, et écrire le profil dans Amazon S3." } }
    - { id: c, text: { en: "Increase the sample size of the project to the full dataset and keep the interactive session open.", fr: "Porter la taille d'échantillon du projet au jeu de données complet et garder la session interactive ouverte." } }
    - { id: d, text: { en: "Create a recipe job that uses the dataset and the published recipe, with an Amazon S3 output, and associate a daily schedule at 02:00 UTC.", fr: "Créer une tâche de recette qui utilise le jeu de données et la recette publiée, avec une sortie Amazon S3, et lui associer une planification quotidienne à 02:00 UTC." } }
    - { id: e, text: { en: "Export the recipe as an AWS Glue crawler classifier and run the crawler every day at 02:00 UTC.", fr: "Exporter la recette en tant que classifieur de robot d'analyse AWS Glue et exécuter le robot chaque jour à 02:00 UTC." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A recipe job transforms a dataset with a DataBrew recipe, and the recipe must be published before a job can use it. The job reads the full dataset, writes to the chosen output such as Amazon S3, and can be attached to a recurring, time-of-day, or cron schedule."
    fr: "Une tâche de recette transforme un jeu de données avec une recette DataBrew, et la recette doit être publiée avant qu'une tâche puisse l'utiliser. La tâche lit le jeu de données complet, écrit dans la sortie choisie comme Amazon S3, et peut être associée à une planification récurrente, à heure fixe ou cron."
  options:
    b:
      en: "A profile job evaluates the data and writes statistics; it does not apply the recipe steps."
      fr: "Une tâche de profil évalue les données et écrit des statistiques ; elle n'applique pas les étapes de la recette."
    c:
      en: "An interactive session is for authoring recipes and does not produce a scheduled output."
      fr: "Une session interactive sert à créer des recettes et ne produit pas de sortie planifiée."
    e:
      en: "Crawler classifiers infer schemas; a DataBrew recipe cannot be exported as a classifier."
      fr: "Les classifieurs de robot d'analyse déduisent des schémas ; une recette DataBrew ne peut pas être exportée en classifieur."
references:
  - title: Creating and working with AWS Glue DataBrew recipe jobs
    url: https://docs.aws.amazon.com/databrew/latest/dg/jobs.recipe.html
