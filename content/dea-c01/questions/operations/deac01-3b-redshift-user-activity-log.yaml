id: deac01-3b-redshift-user-activity-log
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company turned on audit logging for its provisioned Amazon Redshift cluster with an Amazon S3 bucket as the destination. From now on, auditors require the log files to contain the text of every SQL statement that runs on the cluster. The bucket receives connection logs and user logs, but no user activity logs.

    Which action will make the cluster log the statements?
  fr: |
    Une entreprise a activé la journalisation d'audit de son cluster Amazon Redshift provisionné avec un compartiment Amazon S3 comme destination. Désormais, les auditeurs exigent que les fichiers journaux contiennent le texte de chaque instruction SQL exécutée sur le cluster. Le compartiment reçoit les journaux de connexion et les journaux utilisateur, mais aucun journal d'activité utilisateur.

    Quelle action permet au cluster de journaliser les instructions ?
body:
  options:
    - { id: a, text: { en: "Change the audit logging destination from Amazon S3 to Amazon CloudWatch.", fr: "Remplacer la destination de la journalisation d'audit Amazon S3 par Amazon CloudWatch." } }
    - { id: b, text: { en: "Set the enable_user_activity_logging parameter to true in the parameter group of the cluster.", fr: "Définir le paramètre enable_user_activity_logging sur true dans le groupe de paramètres du cluster." } }
    - { id: c, text: { en: "Create an AWS CloudTrail trail that logs the management events of Amazon Redshift to the same bucket.", fr: "Créer un journal de suivi AWS CloudTrail qui journalise les événements de gestion d'Amazon Redshift dans le même compartiment." } }
    - { id: d, text: { en: "Export the STL_CONNECTION_LOG system table to the bucket every day.", fr: "Exporter chaque jour la table système STL_CONNECTION_LOG dans le compartiment." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The user activity log records each query before it runs, but it also requires the enable_user_activity_logging database parameter, which is false by default. With audit logging alone, Redshift writes only the connection log and the user log, which matches what the bucket contains."
    fr: "Le journal d'activité utilisateur enregistre chaque requête avant son exécution, mais il exige aussi le paramètre de base de données enable_user_activity_logging, défini sur false par défaut. Avec la seule journalisation d'audit, Redshift n'écrit que le journal de connexion et le journal utilisateur, ce qui correspond au contenu du compartiment."
  options:
    a:
      en: "Changing the destination does not change which logs are produced; the parameter is still needed for the user activity log."
      fr: "Changer de destination ne change pas les journaux produits ; le paramètre reste nécessaire pour le journal d'activité utilisateur."
    c:
      en: "CloudTrail records Redshift API calls, such as cluster changes, not the SQL statements run in the database."
      fr: "CloudTrail enregistre les appels d'API Redshift, comme les modifications de cluster, et non les instructions SQL exécutées dans la base."
    d:
      en: "STL_CONNECTION_LOG records connections and authentication attempts, not the text of the statements."
      fr: "STL_CONNECTION_LOG enregistre les connexions et les tentatives d'authentification, et non le texte des instructions."
references:
  - title: Database audit logging
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/db-auditing.html
