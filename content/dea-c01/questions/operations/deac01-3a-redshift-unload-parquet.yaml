id: deac01-3a-redshift-unload-parquet
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany computes daily sales aggregates in an Amazon Redshift table. Analysts in another team query the data with Amazon Athena and need it in Amazon S3 in a columnar format, organized in Hive-style folders by sale_date. The company wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany calcule des agrégats de ventes quotidiens dans une table Amazon Redshift. Les analystes d'une autre équipe interrogent les données avec Amazon Athena et en ont besoin dans Amazon S3 au format en colonnes, organisées en dossiers de style Hive par sale_date. L'entreprise veut le MOINS d'effort de développement possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run UNLOAD with the default output format and the MANIFEST option to a prefix in the analysts' bucket.", fr: "Exécuter UNLOAD avec le format de sortie par défaut et l'option MANIFEST vers un préfixe du compartiment des analystes." } }
    - { id: b, text: { en: "Run UNLOAD with FORMAT AS PARQUET and PARTITION BY (sale_date) to a prefix in the analysts' bucket.", fr: "Exécuter UNLOAD avec FORMAT AS PARQUET et PARTITION BY (sale_date) vers un préfixe du compartiment des analystes." } }
    - { id: c, text: { en: "Write an AWS Glue job that reads the table over JDBC and writes Parquet files partitioned by sale_date.", fr: "Écrire une tâche AWS Glue qui lit la table en JDBC et écrit des fichiers Parquet partitionnés par sale_date." } }
    - { id: d, text: { en: "Run a COPY command with the FORMAT AS PARQUET option that writes the table to the analysts' bucket.", fr: "Exécuter une commande COPY avec l'option FORMAT AS PARQUET qui écrit la table dans le compartiment des analystes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "UNLOAD writes the result of a query to Amazon S3, and FORMAT AS PARQUET produces Snappy-compressed Parquet files. PARTITION BY writes Hive-style folders such as sale_date=2026-11-22/, which Athena can use as partitions, all with one SQL statement."
    fr: "UNLOAD écrit le résultat d'une requête dans Amazon S3, et FORMAT AS PARQUET produit des fichiers Parquet compressés en Snappy. PARTITION BY écrit des dossiers de style Hive tels que sale_date=2026-11-22/, utilisables comme partitions par Athena, le tout en une seule instruction SQL."
  options:
    a:
      en: "The default UNLOAD format is pipe-delimited text, not a columnar format, and it is not partitioned."
      fr: "Le format UNLOAD par défaut est du texte délimité par des barres verticales, pas un format en colonnes, et il n'est pas partitionné."
    c:
      en: "A Glue job works but requires writing and running code that UNLOAD makes unnecessary."
      fr: "Une tâche Glue fonctionne mais impose d'écrire et d'exécuter du code qu'UNLOAD rend inutile."
    d:
      en: "COPY loads data from Amazon S3 into Redshift; it does not export a table."
      fr: "COPY charge des données d'Amazon S3 dans Redshift ; il n'exporte pas de table."
references:
  - title: UNLOAD
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_UNLOAD.html
