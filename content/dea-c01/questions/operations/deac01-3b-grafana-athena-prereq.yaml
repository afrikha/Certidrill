id: deac01-3b-grafana-athena-prereq
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data platform team wants to show data from Athena tables in an existing Amazon Managed Grafana workspace, next to its CloudWatch panels. The workspace uses the AWS managed policies that Amazon Managed Grafana provides for Athena. The table data is stored in an Amazon S3 bucket named example-sales-data, and the queries run in an Athena workgroup named analytics.

    Which combination of actions must the team complete so that the panels can query the tables? (Choose three.)
  fr: |
    Une équipe de plateforme de données veut afficher des données de tables Athena dans un espace de travail Amazon Managed Grafana existant, à côté de ses panneaux CloudWatch. L'espace de travail utilise les politiques gérées par AWS qu'Amazon Managed Grafana fournit pour Athena. Les données des tables sont stockées dans un compartiment Amazon S3 nommé example-sales-data, et les requêtes s'exécutent dans un groupe de travail Athena nommé analytics.

    Quelle combinaison d'actions l'équipe doit-elle effectuer pour que les panneaux puissent interroger les tables ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Tag the analytics workgroup with GrafanaDataSource: true.", fr: "Ajouter au groupe de travail analytics la balise GrafanaDataSource: true." } }
    - { id: b, text: { en: "Change the analytics engine of the workgroup to Apache Spark.", fr: "Remplacer le moteur d'analyse du groupe de travail par Apache Spark." } }
    - { id: c, text: { en: "Write the workgroup query results to a bucket whose name starts with grafana-athena-query-results-.", fr: "Écrire les résultats des requêtes du groupe de travail dans un compartiment dont le nom commence par grafana-athena-query-results-." } }
    - { id: d, text: { en: "Turn on the Requester Pays setting of the example-sales-data bucket.", fr: "Activer le paramètre Requester Pays du compartiment example-sales-data." } }
    - { id: e, text: { en: "Add permissions to read the example-sales-data bucket to the workspace role.", fr: "Ajouter au rôle de l'espace de travail des autorisations de lecture du compartiment example-sales-data." } }
    - { id: f, text: { en: "Import the tables into SPICE before the workspace queries them.", fr: "Importer les tables dans SPICE avant que l'espace de travail ne les interroge." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "Amazon Managed Grafana can add Athena as a data source. With its managed policies for Athena, the workgroups must be tagged GrafanaDataSource: true and the query results must go to a bucket whose name starts with grafana-athena-query-results-. The managed policy does not include access to the S3 buckets that hold the table data, so those permissions must be added to the role."
    fr: "Amazon Managed Grafana peut ajouter Athena comme source de données. Avec ses politiques gérées pour Athena, les groupes de travail doivent porter la balise GrafanaDataSource: true et les résultats des requêtes doivent aller dans un compartiment dont le nom commence par grafana-athena-query-results-. La politique gérée n'inclut pas l'accès aux compartiments S3 qui contiennent les données des tables : ces autorisations doivent être ajoutées au rôle."
  options:
    b:
      en: "Spark-enabled workgroups run notebooks, not the SQL queries that a Grafana panel sends."
      fr: "Les groupes de travail Spark exécutent des blocs-notes, et non les requêtes SQL qu'envoie un panneau Grafana."
    d:
      en: "Requester Pays changes who pays for requests; it grants no permission to the workspace."
      fr: "Requester Pays change qui paie les requêtes ; il n'accorde aucune autorisation à l'espace de travail."
    f:
      en: "SPICE is the in-memory engine of Quick Sight; Grafana does not use it."
      fr: "SPICE est le moteur en mémoire de Quick Sight ; Grafana ne l'utilise pas."
references:
  - title: Prerequisites
    url: https://docs.aws.amazon.com/grafana/latest/userguide/Athena-prereq.html
  - title: Connect to an Amazon Athena data source
    url: https://docs.aws.amazon.com/grafana/latest/userguide/AWS-Athena.html
