id: deac01-3b-approx-distinct
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A dashboard shows the number of unique visitors per day from a 5 TB clickstream table in Athena. The query uses COUNT(DISTINCT visitor_id) grouped by day and has become slow. The product owners accept a small error, about 2 %, in the daily counts.

    Which change will make the query faster with the LEAST effort?
  fr: |
    Un tableau de bord affiche le nombre de visiteurs uniques par jour à partir d'une table de parcours de navigation (clickstream) de 5 To dans Athena. La requête utilise COUNT(DISTINCT visitor_id) regroupé par jour et est devenue lente. Les responsables produit acceptent une petite erreur, d'environ 2 %, dans les comptages quotidiens.

    Quelle modification accélère la requête avec le MOINS d'efforts possible ?
body:
  options:
    - { id: a, text: { en: "Add visitor_id to the GROUP BY clause.", fr: "Ajouter visitor_id à la clause GROUP BY." } }
    - { id: b, text: { en: "Add an ORDER BY clause on the day column.", fr: "Ajouter une clause ORDER BY sur la colonne de jour." } }
    - { id: c, text: { en: "Save the query as a view and point the dashboard to the view instead of the table.", fr: "Enregistrer la requête sous forme de vue et faire pointer le tableau de bord vers la vue plutôt que vers la table." } }
    - { id: d, text: { en: "Replace COUNT(DISTINCT visitor_id) with approx_distinct(visitor_id).", fr: "Remplacer COUNT(DISTINCT visitor_id) par approx_distinct(visitor_id)." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Athena provides approximate aggregate functions for cases where exact values are not needed. Unlike COUNT(DISTINCT col), approx_distinct uses much less memory and runs faster, and the change is a single function in the query."
    fr: "Athena fournit des fonctions d'agrégation approximatives pour les cas où des valeurs exactes ne sont pas nécessaires. Contrairement à COUNT(DISTINCT col), approx_distinct utilise beaucoup moins de mémoire et s'exécute plus vite, et la modification se limite à une fonction dans la requête."
  options:
    a:
      en: "Grouping by visitor_id returns one row per visitor and day, which changes the result instead of counting visitors."
      fr: "Regrouper par visitor_id renvoie une ligne par visiteur et par jour, ce qui change le résultat au lieu de compter les visiteurs."
    b:
      en: "Sorting adds work, and Athena recommends avoiding ORDER BY when the result does not need to be sorted."
      fr: "Le tri ajoute du travail, et Athena recommande d'éviter ORDER BY lorsque le résultat n'a pas besoin d'être trié."
    c:
      en: "An Athena view stores the query text, not its results, so the same aggregation runs at every refresh."
      fr: "Une vue Athena stocke le texte de la requête, pas ses résultats : la même agrégation s'exécute à chaque actualisation."
references:
  - title: Optimize queries
    url: https://docs.aws.amazon.com/athena/latest/ug/performance-tuning-query-optimization-techniques.html
