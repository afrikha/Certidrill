id: deac01-3a-sdk-s3-upload-large
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python script on an Amazon EC2 instance uploads a 40 GB nightly database extract to Amazon S3 with a single put_object call of Boto3, and the upload fails. The company wants the upload to succeed and to be as fast as possible, with the LEAST amount of code.

    Which solution will meet these requirements?
  fr: |
    Un script Python sur une instance Amazon EC2 charge chaque nuit un export de base de données de 40 Go dans Amazon S3 avec un seul appel put_object de Boto3, et le chargement échoue. L'entreprise veut que le chargement réussisse et soit aussi rapide que possible, avec le MOINS de code possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Compress the extract with gzip and keep the single put_object call.", fr: "Compresser l'export avec gzip et conserver l'appel put_object unique." } }
    - { id: b, text: { en: "Enable S3 Transfer Acceleration on the bucket and keep the single put_object call.", fr: "Activer S3 Transfer Acceleration sur le compartiment et conserver l'appel put_object unique." } }
    - { id: c, text: { en: "Write code that calls create_multipart_upload, upload_part for each part in sequence, and complete_multipart_upload.", fr: "Écrire du code qui appelle create_multipart_upload, upload_part pour chaque partie l'une après l'autre, puis complete_multipart_upload." } }
    - { id: d, text: { en: "Replace put_object with the upload_file method of the Boto3 S3 client, which splits large files into parts that it uploads in parallel.", fr: "Remplacer put_object par la méthode upload_file du client S3 Boto3, qui découpe les fichiers volumineux en parties chargées en parallèle." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon S3 recommends multipart upload for objects of 100 MB or more. The Boto3 upload_file method manages the transfer for you: it splits a large file into smaller chunks and uploads them in parallel, so a single call replaces the failing put_object."
    fr: "Amazon S3 recommande le chargement partitionné (multipart upload) pour les objets de 100 Mo ou plus. La méthode upload_file de Boto3 gère le transfert : elle découpe un fichier volumineux en morceaux plus petits et les charge en parallèle, si bien qu'un seul appel remplace le put_object en échec."
  options:
    a:
      en: "Compression may shrink the file but still sends it in one request, which is not the recommended method for a large object and is not parallel."
      fr: "La compression peut réduire le fichier mais l'envoie toujours en une seule requête, ce qui n'est pas la méthode recommandée pour un gros objet et n'est pas parallèle."
    b:
      en: "Transfer Acceleration speeds up long-distance transfers through edge locations; it does not change the single-request upload."
      fr: "Transfer Acceleration accélère les transferts longue distance via des emplacements périphériques ; il ne change pas le chargement en une seule requête."
    c:
      en: "The low-level calls work but need much more code, and uploading parts one after another is slower than a parallel transfer."
      fr: "Les appels de bas niveau fonctionnent mais nécessitent beaucoup plus de code, et charger les parties l'une après l'autre est plus lent qu'un transfert parallèle."
references:
  - title: Uploading and copying objects using multipart upload in Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html
  - title: Uploading files
    url: https://docs.aws.amazon.com/boto3/latest/guide/s3-uploading-files.html
