id: deac01-3b-late-binding-spectrum
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer must create an Amazon Redshift view that combines recent sales in the local table public.sales with historical sales in the Redshift Spectrum external table spectrum.sales_history. The engineer has permission to query both tables, but the following statement fails.

    ```sql
    CREATE VIEW public.all_sales AS
    SELECT sale_id, sale_date, amount FROM public.sales
    UNION ALL
    SELECT sale_id, sale_date, amount FROM spectrum.sales_history;
    ```

    Which change will allow the view to be created?
  fr: |
    Un ingénieur des données doit créer une vue Amazon Redshift qui combine les ventes récentes de la table locale public.sales et les ventes historiques de la table externe Redshift Spectrum spectrum.sales_history. L'ingénieur est autorisé à interroger les deux tables, mais l'instruction suivante échoue.

    ```sql
    CREATE VIEW public.all_sales AS
    SELECT sale_id, sale_date, amount FROM public.sales
    UNION ALL
    SELECT sale_id, sale_date, amount FROM spectrum.sales_history;
    ```

    Quelle modification permet de créer la vue ?
body:
  options:
    - { id: a, text: { en: "Remove the schema names so that both tables are resolved through the search path.", fr: "Supprimer les noms de schéma afin que les deux tables soient résolues via le chemin de recherche." } }
    - { id: b, text: { en: "Replace UNION ALL with UNION.", fr: "Remplacer UNION ALL par UNION." } }
    - { id: c, text: { en: "Run the same statement as a superuser.", fr: "Exécuter la même instruction en tant que superutilisateur." } }
    - { id: d, text: { en: "Add the WITH NO SCHEMA BINDING clause at the end of the statement.", fr: "Ajouter la clause WITH NO SCHEMA BINDING à la fin de l'instruction." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Redshift Spectrum external tables can be referenced only in a late-binding view, which is created with WITH NO SCHEMA BINDING. Such a view has no dependency on the objects it references, and Redshift checks them only when the view is queried."
    fr: "Les tables externes Redshift Spectrum ne peuvent être référencées que dans une vue à liaison tardive (late-binding view), créée avec WITH NO SCHEMA BINDING. Une telle vue ne dépend pas des objets qu'elle référence, et Redshift ne les vérifie qu'au moment où la vue est interrogée."
  options:
    a:
      en: "A late-binding view requires schema-qualified table names, so removing them would make the corrected statement fail."
      fr: "Une vue à liaison tardive exige des noms de table qualifiés par le schéma : les supprimer ferait échouer l'instruction corrigée."
    b:
      en: "The set operator is not the cause; a regular view cannot reference an external table, whatever the operator."
      fr: "L'opérateur ensembliste n'est pas en cause ; une vue ordinaire ne peut référencer une table externe, quel que soit l'opérateur."
    c:
      en: "The rule applies to every user: privileges do not let a schema-bound view reference an external table."
      fr: "La règle s'applique à tous les utilisateurs : les privilèges ne permettent pas à une vue liée au schéma de référencer une table externe."
references:
  - title: CREATE VIEW
    url: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_VIEW.html
