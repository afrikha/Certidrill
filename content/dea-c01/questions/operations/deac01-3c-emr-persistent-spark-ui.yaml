id: deac01-3c-emr-persistent-spark-ui
objective: "3.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A transient Amazon EMR 7.x cluster with a single primary node runs a nightly Spark application and then terminates. Spark event logs are written to the default HDFS location, and logging to Amazon S3 is enabled. Three days ago, one stage of the application took four times longer than usual. A data engineer must now inspect the stages, tasks and executors of that run in the Spark History Server, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Un cluster Amazon EMR 7.x transitoire avec un seul nœud primaire exécute chaque nuit une application Spark, puis se termine. Les journaux d'événements Spark sont écrits dans l'emplacement HDFS par défaut, et la journalisation vers Amazon S3 est activée. Il y a trois jours, une étape (stage) de l'application a duré quatre fois plus longtemps que d'habitude. Un ingénieur des données doit maintenant examiner les étapes, les tâches et les exécuteurs de cette exécution dans le Spark History Server, avec le MOINS d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Launch a new EMR cluster and open the Spark History Server on its primary node through an SSH tunnel.", fr: "Lancer un nouveau cluster EMR et ouvrir le Spark History Server sur son nœud primaire via un tunnel SSH." } }
    - { id: b, text: { en: "Run a CloudWatch Logs Insights query on the cluster's log group to rebuild the stage and task timeline.", fr: "Exécuter une requête CloudWatch Logs Insights sur le groupe de journaux du cluster pour reconstruire la chronologie des étapes et des tâches." } }
    - { id: c, text: { en: "Open the terminated cluster in the Amazon EMR console and use its persistent Spark History Server user interface.", fr: "Ouvrir le cluster terminé dans la console Amazon EMR et utiliser son interface persistante du Spark History Server." } }
    - { id: d, text: { en: "Create an Athena table on the S3 log folder of the cluster and query the step logs for the stage durations.", fr: "Créer une table Athena sur le dossier de journaux S3 du cluster et interroger les journaux d'étape pour obtenir la durée des étapes Spark." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Persistent application user interfaces host the Spark History Server off-cluster, so the application history of active and terminated clusters can be opened from the console for 30 days after the application ends, without SSH or a web proxy. The feature needs event logs in HDFS and is not available for clusters with multiple primary nodes, which matches this cluster."
    fr: "Les interfaces utilisateur d'application persistantes hébergent le Spark History Server hors du cluster : l'historique des applications des clusters actifs et terminés peut être ouvert depuis la console pendant 30 jours après la fin de l'application, sans SSH ni proxy web. La fonctionnalité exige des journaux d'événements dans HDFS et n'est pas disponible pour les clusters à plusieurs nœuds primaires, ce qui correspond à ce cluster."
  options:
    a:
      en: "The event logs of the old run were in the HDFS of the terminated cluster, so a new cluster's history server does not show that run."
      fr: "Les journaux d'événements de l'ancienne exécution se trouvaient dans le HDFS du cluster terminé : le serveur d'historique d'un nouveau cluster n'affiche pas cette exécution."
    b:
      en: "The cluster logs to S3, not to CloudWatch Logs, and log queries do not provide the Spark UI views of stages and executors."
      fr: "Le cluster journalise vers S3, pas vers CloudWatch Logs, et des requêtes de journaux ne fournissent pas les vues Spark UI des étapes et des exécuteurs."
    d:
      en: "Step logs do not contain the stage and task metrics of the Spark UI, and building a table adds effort."
      fr: "Les journaux d'étape ne contiennent pas les métriques des étapes et des tâches de Spark UI, et la création d'une table ajoute de l'effort."
references:
  - title: View persistent application user interfaces in Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/app-history-spark-UI.html
