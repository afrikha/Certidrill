id: deac01-3c-dq-results-to-s3
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Glue Studio job runs an Evaluate Data Quality transform with 25 rules on each daily load. The data governance team wants to build an Amazon Athena report that shows, for every run, each rule and whether it passed or failed, so that it can follow quality trends over months.

    How should the data engineer configure the job?
  fr: |
    Une tâche AWS Glue Studio exécute une transformation Evaluate Data Quality de 25 règles à chaque chargement quotidien. L'équipe de gouvernance des données veut créer un rapport Amazon Athena qui montre, pour chaque exécution, chaque règle et si elle a réussi ou échoué, afin de suivre l'évolution de la qualité sur plusieurs mois.

    Comment l'ingénieur des données doit-il configurer la tâche ?
body:
  options:
    - { id: a, text: { en: "Select the Data quality results output of the transform and write it to an Amazon S3 target that Athena can query.", fr: "Sélectionner la sortie Data quality results de la transformation et l'écrire dans une cible Amazon S3 interrogeable par Athena." } }
    - { id: b, text: { en: "Select only the original data output with the data quality columns, and write the row-level results to Amazon S3.", fr: "Sélectionner uniquement la sortie des données d'origine avec les colonnes de qualité, et écrire les résultats au niveau des lignes dans Amazon S3." } }
    - { id: c, text: { en: "Keep the CloudWatch publishing option and query the glue.data.quality.rules.failed metric from Athena.", fr: "Conserver l'option de publication CloudWatch et interroger la métrique glue.data.quality.rules.failed depuis Athena." } }
    - { id: d, text: { en: "Turn on continuous logging and create an Athena table on the job's CloudWatch Logs log group.", fr: "Activer la journalisation continue et créer une table Athena sur le groupe de journaux CloudWatch Logs de la tâche." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Data quality results output of the transform contains the configured rules and their pass or fail status, and it is meant to be written to Amazon S3 or other databases. Each run then adds rule-level records that Athena can query for trends."
    fr: "La sortie Data quality results de la transformation contient les règles configurées et leur statut de réussite ou d'échec, et elle est prévue pour être écrite dans Amazon S3 ou d'autres bases de données. Chaque exécution ajoute alors des enregistrements par règle qu'Athena peut interroger pour suivre les tendances."
  options:
    b:
      en: "Row-level outcomes describe each data record, not one result per rule, and dataset-level rules are skipped at row level."
      fr: "Les résultats au niveau des lignes décrivent chaque enregistrement de données, pas un résultat par règle, et les règles au niveau du jeu de données sont ignorées au niveau des lignes."
    c:
      en: "The CloudWatch metrics give only the number of passed and failed rules per run, and Athena does not query CloudWatch metrics this way."
      fr: "Les métriques CloudWatch ne donnent que le nombre de règles réussies et échouées par exécution, et Athena n'interroge pas les métriques CloudWatch de cette façon."
    d:
      en: "Job logs are not a structured record of rule outcomes, and Athena tables are defined on data in S3, not on log groups."
      fr: "Les journaux de la tâche ne sont pas un enregistrement structuré des résultats des règles, et les tables Athena se définissent sur des données dans S3, pas sur des groupes de journaux."
references:
  - title: Evaluating data quality for ETL jobs in AWS Glue Studio
    url: https://docs.aws.amazon.com/glue/latest/dg/tutorial-data-quality.html
