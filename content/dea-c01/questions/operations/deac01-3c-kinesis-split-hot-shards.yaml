id: deac01-3c-kinesis-split-hot-shards
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Kinesis data stream in provisioned mode has 10 shards and uses customer_id as the partition key, so the events of each customer stay in order. The stream receives events from 200,000 customers, and no single customer sends more than 100 KB per second. Shard-level metrics show that 2 shards are throttled during peaks because several large customers hash to their ranges, while the other 8 shards use less than 30% of their capacity. The company wants to remove the throttling at the LOWEST cost.

    Which solution will meet these requirements?
  fr: |
    Un flux de données Amazon Kinesis en mode provisionné compte 10 partitions (shards) et utilise customer_id comme clé de partition, afin que les événements de chaque client restent dans l'ordre. Le flux reçoit les événements de 200 000 clients, et aucun client n'envoie plus de 100 Ko par seconde. Les métriques au niveau des partitions montrent que 2 partitions sont limitées pendant les pics parce que plusieurs gros clients sont hachés dans leurs plages, tandis que les 8 autres utilisent moins de 30 % de leur capacité. L'entreprise veut supprimer la limitation au coût le PLUS BAS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use UpdateShardCount to double the stream to 20 shards with uniform scaling.", fr: "Utiliser UpdateShardCount pour doubler le flux à 20 partitions avec une mise à l'échelle uniforme." } }
    - { id: b, text: { en: "Replace customer_id with a random partition key for each event.", fr: "Remplacer customer_id par une clé de partition aléatoire pour chaque événement." } }
    - { id: c, text: { en: "Split the 2 hot shards, and merge pairs of adjacent cold shards if their combined traffic allows it.", fr: "Diviser les 2 partitions très sollicitées, et fusionner des paires de partitions peu sollicitées adjacentes si leur trafic cumulé le permet." } }
    - { id: d, text: { en: "Register the consumer applications for enhanced fan-out.", fr: "Inscrire les applications consommatrices à la diffusion améliorée (enhanced fan-out)." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Shard metrics identify hot shards that receive much more data than expected and cold shards that receive much less. Splitting only the hot shards adds capacity for the hash keys that target them, and merging cold shards uses their unused capacity, so the stream does not pay for shards that it does not need. customer_id stays the key, so per-customer order is kept."
    fr: "Les métriques des partitions identifient les partitions très sollicitées, qui reçoivent beaucoup plus de données que prévu, et les partitions peu sollicitées, qui en reçoivent beaucoup moins. Diviser uniquement les partitions très sollicitées ajoute de la capacité pour les clés de hachage qui les ciblent, et fusionner les partitions peu sollicitées utilise leur capacité inutilisée : le flux ne paie pas de partitions inutiles. customer_id reste la clé, ce qui conserve l'ordre par client."
  options:
    a:
      en: "Doubling every shard also doubles the cost of the 8 under-used shards, which gives more capacity than needed."
      fr: "Doubler chaque partition double aussi le coût des 8 partitions sous-utilisées, ce qui donne plus de capacité que nécessaire."
    b:
      en: "A random key spreads the load but sends a customer's events to different shards, which breaks their order."
      fr: "Une clé aléatoire répartit la charge, mais envoie les événements d'un client vers des partitions différentes, ce qui rompt leur ordre."
    d:
      en: "Enhanced fan-out increases read throughput for consumers; the throttling happens on writes to the hot shards."
      fr: "La diffusion améliorée augmente le débit de lecture des consommateurs ; la limitation se produit à l'écriture sur les partitions très sollicitées."
references:
  - title: Decide on a strategy for resharding
    url: https://docs.aws.amazon.com/streams/latest/dev/kinesis-using-sdk-java-resharding-strategies.html
