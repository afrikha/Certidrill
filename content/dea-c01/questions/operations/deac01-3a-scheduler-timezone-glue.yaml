id: deac01-3a-scheduler-timezone-glue
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue job of AnyCompany must start at 06:30 Paris time every weekday, all year long, including after the changes between winter time and summer time. The company does not want to write code or adjust the schedule twice a year.

    Which solution will meet these requirements?
  fr: |
    Une tâche AWS Glue d'AnyCompany doit démarrer à 06:30 heure de Paris chaque jour ouvré, toute l'année, y compris après les passages entre l'heure d'hiver et l'heure d'été. L'entreprise ne veut ni écrire de code ni ajuster la planification deux fois par an.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a scheduled Glue trigger with the expression cron(30 5 ? * MON-FRI *) for the job.", fr: "Créer pour la tâche un déclencheur Glue planifié avec l'expression cron(30 5 ? * MON-FRI *)." } }
    - { id: b, text: { en: "Create an EventBridge Scheduler schedule with cron(30 6 ? * MON-FRI *), the Europe/Paris time zone, and the glue:startJobRun universal target.", fr: "Créer une planification EventBridge Scheduler avec cron(30 6 ? * MON-FRI *), le fuseau horaire Europe/Paris et la cible universelle glue:startJobRun." } }
    - { id: c, text: { en: "Create an EventBridge Scheduler schedule with rate(1 days) that first runs at 06:30 Paris time on a Monday.", fr: "Créer une planification EventBridge Scheduler avec rate(1 days) dont la première exécution a lieu à 06:30 heure de Paris un lundi." } }
    - { id: d, text: { en: "Create a Lambda function that runs every 5 minutes, checks the Paris time, and starts the job at 06:30.", fr: "Créer une fonction Lambda qui s'exécute toutes les 5 minutes, vérifie l'heure de Paris et démarre la tâche à 06:30." } }
answer: { optionId: b }
explanation:
  correct:
    en: "EventBridge Scheduler evaluates cron and one-time expressions in the IANA time zone of the schedule and adjusts for daylight saving time. A universal target (arn:aws:scheduler:::aws-sdk:glue:startJobRun) calls the Glue API directly with the permissions of the execution role, without code."
    fr: "EventBridge Scheduler évalue les expressions cron et ponctuelles dans le fuseau horaire IANA de la planification et tient compte de l'heure d'été. Une cible universelle (arn:aws:scheduler:::aws-sdk:glue:startJobRun) appelle directement l'API Glue avec les autorisations du rôle d'exécution, sans code."
  options:
    a:
      en: "Glue time-based schedules are in UTC, so the local start time moves by one hour when Paris changes time."
      fr: "Les planifications temporelles Glue sont en UTC : l'heure de démarrage locale se décale d'une heure lors des changements d'heure à Paris."
    c:
      en: "A rate of 1 day is always 24 hours, so it drifts by one hour across a time change and also runs on weekends."
      fr: "Un taux de 1 jour vaut toujours 24 heures : il se décale d'une heure lors d'un changement d'heure et s'exécute aussi le week-end."
    d:
      en: "The function is custom code that runs about 288 times a day to start one job."
      fr: "La fonction est du code personnalisé qui s'exécute environ 288 fois par jour pour démarrer une seule tâche."
references:
  - title: Schedule types in EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html
  - title: Time-based schedules for jobs and crawlers
    url: https://docs.aws.amazon.com/glue/latest/dg/monitor-data-warehouse-schedule.html
