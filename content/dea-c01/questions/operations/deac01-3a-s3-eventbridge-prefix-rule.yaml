id: deac01-3a-s3-eventbridge-prefix-rule
objective: "3.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Amazon S3 bucket example-landing has an event notification, without any prefix or suffix filter, that sends all object-created events to an Amazon SQS queue used by another team. AnyCompany must now start an AWS Step Functions workflow each time an object is created under the invoices/ prefix of the same bucket. The existing notification must not change.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Le compartiment Amazon S3 example-landing possède une notification d'événement, sans filtre de préfixe ni de suffixe, qui envoie tous les événements de création d'objets vers une file d'attente Amazon SQS utilisée par une autre équipe. AnyCompany doit désormais démarrer un flux de travail AWS Step Functions chaque fois qu'un objet est créé sous le préfixe invoices/ du même compartiment. La notification existante ne doit pas changer.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Enable Amazon EventBridge on the bucket and create a rule on the default event bus that matches Object Created events whose object key starts with invoices/, with the state machine as the target.", fr: "Activer Amazon EventBridge sur le compartiment et créer, sur le bus d'événements par défaut, une règle qui correspond aux événements Object Created dont la clé d'objet commence par invoices/, avec la machine d'état comme cible." } }
    - { id: b, text: { en: "Add a second event notification for object creation with the invoices/ prefix to the bucket, with the state machine as its destination.", fr: "Ajouter au compartiment une seconde notification d'événement de création d'objets avec le préfixe invoices/, avec la machine d'état comme destination." } }
    - { id: c, text: { en: "Enable Amazon EventBridge on the bucket and create a rule on a new custom event bus that matches the S3 Object Created events under invoices/.", fr: "Activer Amazon EventBridge sur le compartiment et créer, sur un nouveau bus d'événements personnalisé, une règle qui correspond aux événements S3 Object Created sous invoices/." } }
    - { id: d, text: { en: "Add a Lambda function that reads the other team's SQS queue, filters on invoices/, and starts the state machine.", fr: "Ajouter une fonction Lambda qui lit la file SQS de l'autre équipe, filtre sur invoices/ et démarre la machine d'état." } }
answer: { optionId: a }
explanation:
  correct:
    en: "When EventBridge is enabled on a bucket, S3 sends its events to the default event bus in addition to the existing notifications. A rule can match source aws.s3, detail-type Object Created, and a prefix on detail.object.key, and it can start the state machine directly."
    fr: "Lorsqu'EventBridge est activé sur un compartiment, S3 envoie ses événements au bus d'événements par défaut en plus des notifications existantes. Une règle peut correspondre à la source aws.s3, au detail-type Object Created et à un préfixe sur detail.object.key, et peut démarrer directement la machine d'état."
  options:
    b:
      en: "A filter-less notification overlaps every other filter for the same event type, so S3 rejects the new configuration."
      fr: "Une notification sans filtre chevauche tous les autres filtres pour le même type d'événement : S3 rejette la nouvelle configuration."
    c:
      en: "S3, like other AWS services, sends its events to the default event bus, so a rule on a custom bus never receives them."
      fr: "S3, comme les autres services AWS, envoie ses événements au bus d'événements par défaut : une règle sur un bus personnalisé ne les reçoit jamais."
    d:
      en: "The function competes with the other team for the queue messages and is custom code."
      fr: "La fonction entre en concurrence avec l'autre équipe pour les messages de la file et constitue du code personnalisé."
references:
  - title: Using EventBridge
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
  - title: Configuring event notifications using object key name filtering
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-filtering.html
