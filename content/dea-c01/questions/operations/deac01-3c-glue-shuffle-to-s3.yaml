id: deac01-3c-glue-shuffle-to-s3
objective: "3.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue 4.0 Spark job joins and repartitions several terabytes of data every night on G.1X workers. Since the data volume grew, runs fail with the error No space left on device during the shuffle stages. The team does not want to change the worker type, and the fix must not leave data in Amazon S3 that grows without limit.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une tâche Spark AWS Glue 4.0 joint et repartitionne plusieurs téraoctets de données chaque nuit sur des nœuds de travail G.1X. Depuis que le volume de données a augmenté, les exécutions échouent avec l'erreur No space left on device pendant les étapes de brassage (shuffle). L'équipe ne veut pas changer de type de nœud de travail, et la correction ne doit pas laisser dans Amazon S3 des données qui croissent sans limite.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the job parameter --write-shuffle-spills-to-s3 set to true.", fr: "Ajouter le paramètre de tâche --write-shuffle-spills-to-s3 défini sur true." } }
    - { id: b, text: { en: "Add the job parameter --write-shuffle-files-to-s3 set to true.", fr: "Ajouter le paramètre de tâche --write-shuffle-files-to-s3 défini sur true." } }
    - { id: c, text: { en: "Enable job run queuing so that runs wait until disk space is available.", fr: "Activer la mise en file d'attente des exécutions pour que les exécutions attendent que de l'espace disque soit disponible." } }
    - { id: d, text: { en: "Set the number of retries of the job to 3 so that failed shuffle stages are run again.", fr: "Définir le nombre de nouvelles tentatives de la tâche à 3 pour que les étapes de brassage en échec soient réexécutées." } }
    - { id: e, text: { en: "Add an S3 Lifecycle rule that expires the objects under the shuffle data prefix of the job's temporary directory.", fr: "Ajouter une règle de cycle de vie S3 qui fait expirer les objets sous le préfixe des données de brassage du répertoire temporaire de la tâche." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Shuffle writes data to local disk, and Spark fails with No space left on device when the executors run out of disk. The --write-shuffle-files-to-s3 flag makes the AWS Glue shuffle manager write and read shuffle data in S3, by default under the --TempDir path. The shuffle manager does not delete these files after the job, so a Lifecycle rule on the prefix removes them."
    fr: "Le brassage écrit des données sur le disque local, et Spark échoue avec No space left on device lorsque les exécuteurs manquent d'espace disque. L'indicateur --write-shuffle-files-to-s3 fait écrire et lire les données de brassage dans S3 par le gestionnaire de brassage AWS Glue, par défaut sous le chemin --TempDir. Ce gestionnaire ne supprime pas ces fichiers après la tâche : une règle de cycle de vie sur le préfixe les supprime."
  options:
    a:
      en: "Offloading spill files to S3 with this flag is supported only on AWS Glue 2.0, and it is not the main shuffle flag."
      fr: "Le déchargement des fichiers de débordement vers S3 avec cet indicateur n'est pris en charge que sur AWS Glue 2.0, et ce n'est pas l'indicateur principal de brassage."
    c:
      en: "Queuing waits for account or job limits such as concurrency and capacity; it cannot add disk space to the workers of a run."
      fr: "La mise en file d'attente attend la libération de limites du compte ou de la tâche, comme la concurrence et la capacité ; elle ne peut pas ajouter d'espace disque aux nœuds d'une exécution."
    d:
      en: "A retry runs the same job on the same workers with the same data, so it fails again for the same reason."
      fr: "Une nouvelle tentative exécute la même tâche sur les mêmes nœuds avec les mêmes données : elle échoue de nouveau pour la même raison."
references:
  - title: Storing Spark shuffle data
    url: https://docs.aws.amazon.com/glue/latest/dg/monitor-spark-shuffle-manager.html
