id: deac01-3b-rolling-average-frame
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Amazon Redshift table daily_sales has exactly one row per store and calendar day, with the columns store_id, sale_date and total. A data engineer must add a column that shows, for each store, the average total of the current day and the 6 previous days.

    Which expression will meet this requirement?
  fr: |
    La table Amazon Redshift daily_sales contient exactement une ligne par magasin et par jour calendaire, avec les colonnes store_id, sale_date et total. Un ingénieur des données doit ajouter une colonne qui affiche, pour chaque magasin, la moyenne de total sur le jour courant et les 6 jours précédents.

    Quelle expression répond à cette exigence ?
body:
  options:
    - { id: a, text: "`AVG(total) OVER (PARTITION BY store_id ORDER BY sale_date)`" }
    - { id: b, text: "`AVG(total) OVER (PARTITION BY store_id ORDER BY sale_date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)`" }
    - { id: c, text: "`AVG(total) OVER (PARTITION BY store_id ORDER BY sale_date ROWS BETWEEN 7 PRECEDING AND CURRENT ROW)`" }
    - { id: d, text: "`AVG(total) OVER (PARTITION BY sale_date ORDER BY store_id ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)`" }
answer: { optionId: b }
explanation:
  correct:
    en: "PARTITION BY store_id computes the average separately for each store, ORDER BY sale_date orders its days, and the frame of 6 preceding rows plus the current row covers 7 days because there is exactly one row per day. This is a 7-day rolling (moving) average."
    fr: "PARTITION BY store_id calcule la moyenne séparément pour chaque magasin, ORDER BY sale_date ordonne ses jours, et le cadre de 6 lignes précédentes plus la ligne courante couvre 7 jours, car il y a exactement une ligne par jour. C'est une moyenne mobile sur 7 jours."
  options:
    a:
      en: "In Amazon Redshift, an aggregate window function with ORDER BY requires an explicit frame clause, so this expression is rejected."
      fr: "Dans Amazon Redshift, une fonction de fenêtrage d'agrégation avec ORDER BY exige une clause de cadre explicite : cette expression est rejetée."
    c:
      en: "7 preceding rows plus the current row average 8 days instead of 7."
      fr: "7 lignes précédentes plus la ligne courante font une moyenne sur 8 jours au lieu de 7."
    d:
      en: "Partitioning by sale_date averages different stores of the same day, not the days of one store."
      fr: "Partitionner par sale_date fait la moyenne de magasins différents le même jour, et non des jours d'un même magasin."
references:
  - title: Window functions
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_Window_functions.html
