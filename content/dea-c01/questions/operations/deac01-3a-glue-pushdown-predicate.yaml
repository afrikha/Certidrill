id: deac01-3a-glue-pushdown-predicate
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue Spark job reads an AWS Glue Data Catalog table that is partitioned by year, month, and day and holds 5 years of data in Amazon S3. Each night, the job needs only the partition of the previous day, but it reads every partition, filters the rows in Spark, and runs for hours. The job is sometimes rerun for the same day after source corrections and must then process that day again.

    Which solution will reduce the run time with the LEAST change to the job?
  fr: |
    Une tâche Spark AWS Glue lit une table du catalogue de données AWS Glue partitionnée par year, month et day, qui contient 5 ans de données dans Amazon S3. Chaque nuit, la tâche n'a besoin que de la partition de la veille, mais elle lit toutes les partitions, filtre les lignes dans Spark et s'exécute pendant des heures. La tâche est parfois relancée pour le même jour après des corrections de la source et doit alors retraiter ce jour.

    Quelle solution réduit la durée d'exécution avec le MOINS de modifications de la tâche ?
body:
  options:
    - { id: a, text: { en: "Change the worker type of the job from G.1X to G.2X and double the number of workers.", fr: "Faire passer le type de worker de la tâche de G.1X à G.2X et doubler le nombre de workers." } }
    - { id: b, text: { en: "Enable job bookmarks on the job so that it reads only the files added since the last run.", fr: "Activer les signets de tâche pour qu'elle ne lise que les fichiers ajoutés depuis la dernière exécution." } }
    - { id: c, text: { en: "Pass a push_down_predicate on the year, month, and day partition columns in the from_catalog call.", fr: "Transmettre un push_down_predicate sur les colonnes de partition year, month et day dans l'appel from_catalog." } }
    - { id: d, text: { en: "Apply the Filter transform on year, month, and day immediately after the table is read.", fr: "Appliquer la transformation Filter sur year, month et day immédiatement après la lecture de la table." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A push_down_predicate filters the partitions listed from the Data Catalog before Glue lists and reads their S3 files, so only the requested day is read. Because it selects partitions by value, a rerun for the same day reads that day again."
    fr: "Un push_down_predicate filtre les partitions lues dans le catalogue de données avant que Glue liste et lise leurs fichiers S3 : seul le jour demandé est lu. Comme il sélectionne les partitions par valeur, une relance pour le même jour relit ce jour."
  options:
    a:
      en: "Larger workers add cost but the job still lists and reads 5 years of data."
      fr: "Des workers plus grands augmentent le coût, mais la tâche liste et lit toujours 5 ans de données."
    b:
      en: "Bookmarks skip data already processed, so a rerun for a corrected day would not reprocess it."
      fr: "Les signets ignorent les données déjà traitées : une relance pour un jour corrigé ne le retraiterait pas."
    d:
      en: "A Filter transform runs after all partitions have been read, which is the current behavior."
      fr: "Une transformation Filter s'exécute après la lecture de toutes les partitions, ce qui correspond au comportement actuel."
references:
  - title: Managing partitions for ETL output in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-partitions.html
