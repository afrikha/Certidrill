id: deac01-3b-athena-spark-idle-timeout
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Analysts explore data in Athena notebooks of a Spark-enabled workgroup (PySpark engine version 3). The notebooks were created with a session idle timeout of 480 minutes. The cost report shows DPU usage for hours after the analysts stop working, because they close the browser tab without ending their sessions. The company wants to reduce this cost with the LEAST effort for the analysts.

    Which solution will meet these requirements?
  fr: |
    Des analystes explorent des données dans des blocs-notes Athena d'un groupe de travail Spark (PySpark engine version 3). Les blocs-notes ont été créés avec un délai d'inactivité de session de 480 minutes. Le rapport de coûts montre une consommation de DPU pendant des heures après la fin du travail des analystes, car ils ferment l'onglet du navigateur sans terminer leur session. L'entreprise veut réduire ce coût avec le MOINS d'efforts possible pour les analystes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Lower the maximum concurrent DPUs of the notebook sessions from 20 to 3.", fr: "Réduire le nombre maximal de DPU simultanés des sessions de blocs-notes de 20 à 3." } }
    - { id: b, text: { en: "Ask the analysts to close the notebook tab as soon as they finish their analysis.", fr: "Demander aux analystes de fermer l'onglet du bloc-notes dès la fin de leur analyse." } }
    - { id: c, text: { en: "Lower the session idle timeout of the notebooks to a short value, such as 15 minutes.", fr: "Réduire le délai d'inactivité de session des blocs-notes à une valeur courte, par exemple 15 minutes." } }
    - { id: d, text: { en: "Set a per-query data usage control on the workgroup to limit the data that each calculation scans.", fr: "Définir un contrôle d'utilisation des données par requête sur le groupe de travail pour limiter les données analysées par chaque calcul." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The session idle timeout ends a notebook session after the chosen number of idle minutes (1 to 480, default 20). Athena remembers the session settings of each notebook, so a shorter value stops abandoned sessions automatically without any action from the analysts."
    fr: "Le délai d'inactivité de session met fin à une session de bloc-notes après le nombre de minutes d'inactivité choisi (de 1 à 480, 20 par défaut). Athena mémorise les paramètres de session de chaque bloc-notes : une valeur plus courte arrête automatiquement les sessions abandonnées sans action des analystes."
  options:
    a:
      en: "The maximum concurrent DPUs caps how far a session can scale; an idle session still keeps running until it times out."
      fr: "Le nombre maximal de DPU simultanés limite la mise à l'échelle d'une session ; une session inactive continue de s'exécuter jusqu'à son expiration."
    b:
      en: "Closing the notebook tab does not by itself terminate the session, which is exactly the current behavior."
      fr: "Fermer l'onglet du bloc-notes ne termine pas à lui seul la session, ce qui est précisément le comportement actuel."
    d:
      en: "Data usage controls limit the bytes scanned by SQL queries; they do not end idle Spark sessions."
      fr: "Les contrôles d'utilisation des données limitent les octets analysés par les requêtes SQL ; ils ne terminent pas les sessions Spark inactives."
references:
  - title: Get started with Apache Spark on Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/notebooks-spark-getting-started.html
