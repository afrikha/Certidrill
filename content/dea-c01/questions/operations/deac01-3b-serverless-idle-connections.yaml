id: deac01-3b-serverless-idle-connections
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company moved its reporting workload to Amazon Redshift Serverless to pay only for the compute it uses. A BI server on Amazon EC2 keeps a pool of database connections open all day and runs a health-check query on each connection every few seconds. The bill shows RPU usage every night and weekend, when no reports run.

    Which change will stop the compute charges outside report hours?
  fr: |
    Une entreprise a migré sa charge de reporting vers Amazon Redshift Serverless pour ne payer que le calcul utilisé. Un serveur de BI sur Amazon EC2 garde un pool de connexions à la base de données ouvert toute la journée et exécute une requête de vérification d'état sur chaque connexion toutes les quelques secondes. La facture montre une consommation de RPU chaque nuit et chaque week-end, alors qu'aucun rapport ne s'exécute.

    Quelle modification arrête les frais de calcul en dehors des heures de reporting ?
body:
  options:
    - { id: a, text: { en: "Lower the base capacity of the workgroup to the minimum RPU value so that each health check costs less.", fr: "Réduire la capacité de base du groupe de travail à la valeur minimale de RPU afin que chaque vérification d'état coûte moins cher." } }
    - { id: b, text: { en: "Configure the BI server's pool to close idle connections and stop health checks outside report hours.", fr: "Configurer le pool du serveur de BI pour fermer les connexions inactives et arrêter les vérifications d'état hors des heures de reporting." } }
    - { id: c, text: { en: "Create a usage limit on RPU hours with the alert action, so that the team is notified of overnight usage.", fr: "Créer une limite d'utilisation sur les RPU-heures avec l'action d'alerte, afin que l'équipe soit prévenue de la consommation nocturne." } }
    - { id: d, text: { en: "Configure a pause schedule for the workgroup during nights and weekends, and resume it on weekday mornings.", fr: "Configurer une planification de pause du groupe de travail les nuits et les week-ends, et le réactiver les matins de semaine." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Redshift Serverless bills compute while work runs, and AWS warns that open connection pools can generate costs even when no user workload runs, because their health checks are queries. Closing idle connections and stopping the checks outside report hours removes the activity that consumes RPUs."
    fr: "Redshift Serverless facture le calcul tant que du travail s'exécute, et AWS avertit que des pools de connexions ouverts peuvent générer des coûts même sans charge utilisateur, car leurs vérifications d'état sont des requêtes. Fermer les connexions inactives et arrêter les vérifications en dehors des heures de reporting supprime l'activité qui consomme des RPU."
  options:
    a:
      en: "A lower base capacity reduces the rate, but the health-check queries still consume RPUs every night."
      fr: "Une capacité de base plus faible réduit le tarif, mais les requêtes de vérification consomment toujours des RPU chaque nuit."
    c:
      en: "The alert action only notifies when the limit is reached; it does not stop the queries that consume RPUs."
      fr: "L'action d'alerte ne fait que notifier lorsque la limite est atteinte ; elle n'arrête pas les requêtes qui consomment des RPU."
    d:
      en: "Redshift Serverless has no pause or resume; pausing is a feature of provisioned clusters."
      fr: "Redshift Serverless n'a ni pause ni reprise ; la mise en pause est une fonctionnalité des clusters provisionnés."
references:
  - title: Billing for Amazon Redshift Serverless
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-billing.html
  - title: Comparing Amazon Redshift Serverless to an Amazon Redshift provisioned data warehouse
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-console-comparison.html
