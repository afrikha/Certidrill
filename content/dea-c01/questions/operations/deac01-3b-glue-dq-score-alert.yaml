id: deac01-3b-glue-dq-score-alert
objective: "3.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue ETL job evaluates an AWS Glue Data Quality ruleset on the data of each run. The job run itself succeeds even when some rules fail. The data team wants an email whenever the data quality score of a run is 0.9 or lower.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une tâche ETL AWS Glue évalue un ensemble de règles AWS Glue Data Quality sur les données de chaque exécution. L'exécution de la tâche réussit même lorsque certaines règles échouent. L'équipe de données veut recevoir un e-mail chaque fois que le score de qualité des données d'une exécution est inférieur ou égal à 0,9.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Keep the Publish metrics to Amazon CloudWatch option selected for the data quality evaluation.", fr: "Laisser l'option Publish metrics to Amazon CloudWatch sélectionnée pour l'évaluation de la qualité des données." } }
    - { id: b, text: { en: "Create an EventBridge rule for Glue Job State Change events with the FAILED state that targets an SNS topic with an email subscription.", fr: "Créer une règle EventBridge pour les événements Glue Job State Change à l'état FAILED qui cible une rubrique SNS avec un abonnement e-mail." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on glue.data.quality.rules.failed greater than or equal to 1 that notifies an SNS topic.", fr: "Créer une alarme CloudWatch sur glue.data.quality.rules.failed supérieure ou égale à 1 qui notifie une rubrique SNS." } }
    - { id: d, text: { en: "Create an EventBridge rule for Data Quality Evaluation Results Available events with a score filter of 0.9 or lower that targets SNS.", fr: "Créer une règle EventBridge pour les événements Data Quality Evaluation Results Available avec un filtre de score inférieur ou égal à 0,9 qui cible SNS." } }
    - { id: e, text: { en: "Turn on job bookmarks so that the job skips the data that failed the rules.", fr: "Activer les signets de tâche afin que la tâche ignore les données qui ont échoué aux règles." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Glue Data Quality emits a Data Quality Evaluation Results Available event (source aws.glue-dataquality) at the end of each ruleset evaluation, with the state and score of the run, and an event pattern can filter on the score numerically. EventBridge publishing works only if the Publish metrics to Amazon CloudWatch option, selected by default, stays selected."
    fr: "Glue Data Quality émet un événement Data Quality Evaluation Results Available (source aws.glue-dataquality) à la fin de chaque évaluation d'ensemble de règles, avec l'état et le score de l'exécution, et un modèle d'événement peut filtrer numériquement sur le score. La publication vers EventBridge ne fonctionne que si l'option Publish metrics to Amazon CloudWatch, sélectionnée par défaut, reste sélectionnée."
  options:
    b:
      en: "The job run succeeds even when rules fail, so a rule on failed job runs never sees a low score."
      fr: "L'exécution de la tâche réussit même quand des règles échouent : une règle sur les exécutions en échec ne voit jamais un score faible."
    c:
      en: "This alarm fires as soon as one rule fails, which does not match the requirement to alert on a score of 0.9 or lower."
      fr: "Cette alarme se déclenche dès qu'une règle échoue, ce qui ne correspond pas à l'exigence d'alerter sur un score inférieur ou égal à 0,9."
    e:
      en: "Job bookmarks track data already processed; they neither evaluate quality nor send alerts."
      fr: "Les signets de tâche suivent les données déjà traitées ; ils n'évaluent pas la qualité et n'envoient pas d'alerte."
references:
  - title: Setting up alerts, deployments, and scheduling
    url: https://docs.aws.amazon.com/glue/latest/dg/data-quality-alerts.html
