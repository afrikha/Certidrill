id: deac01-3a-api-sfn-http-task
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A daily AWS Step Functions workflow must call the REST API of a SaaS vendor to request a data export, and then pass the API response to an AWS Glue job. The vendor API uses OAuth client credentials. The security team does not allow credentials in the state machine definition or in function code. The company wants the LEAST amount of custom code.

    Which solution will meet these requirements?
  fr: |
    Un flux de travail AWS Step Functions quotidien doit appeler l'API REST d'un fournisseur SaaS pour demander un export de données, puis transmettre la réponse de l'API à une tâche AWS Glue. L'API du fournisseur utilise des informations d'identification client OAuth. L'équipe de sécurité n'autorise aucune information d'identification dans la définition de la machine d'état ni dans le code des fonctions. L'entreprise veut le MOINS de code personnalisé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a Lambda task whose function calls the vendor API with the client secret read from an environment variable.", fr: "Ajouter une tâche Lambda dont la fonction appelle l'API du fournisseur avec le secret client lu dans une variable d'environnement." } }
    - { id: b, text: { en: "Add an HTTP Task that calls the vendor API and references an EventBridge connection that uses OAuth authorization.", fr: "Ajouter une tâche HTTP (HTTP Task) qui appelle l'API du fournisseur et référence une connexion EventBridge qui utilise l'autorisation OAuth." } }
    - { id: c, text: { en: "Add an HTTP Task that calls the vendor API with the client ID and secret written in the Headers field of the task.", fr: "Ajouter une tâche HTTP (HTTP Task) qui appelle l'API du fournisseur avec l'ID et le secret client écrits dans le champ Headers de la tâche." } }
    - { id: d, text: { en: "Pass the client secret to the Glue job as a job argument and call the vendor API from the job script.", fr: "Transmettre le secret client à la tâche Glue comme argument et appeler l'API du fournisseur depuis le script de la tâche." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An HTTP Task (arn:aws:states:::http:invoke) calls public HTTPS APIs directly from the workflow. It requires an EventBridge connection, which supports Basic, OAuth, and API Key authorization and stores the credentials in an encrypted Secrets Manager secret, so no secret appears in the definition or in code."
    fr: "Une tâche HTTP (arn:aws:states:::http:invoke) appelle directement des API HTTPS publiques depuis le flux de travail. Elle nécessite une connexion EventBridge, qui prend en charge les autorisations Basic, OAuth et API Key et stocke les informations d'identification dans un secret Secrets Manager chiffré : aucun secret n'apparaît dans la définition ni dans le code."
  options:
    a:
      en: "This adds a function to write and maintain, and the secret sits in the function configuration in plain text."
      fr: "Cette option ajoute une fonction à écrire et maintenir, et le secret se trouve en clair dans la configuration de la fonction."
    c:
      en: "Credentials in the Headers field are part of the state machine definition, which the security team forbids."
      fr: "Des informations d'identification dans le champ Headers font partie de la définition de la machine d'état, ce que l'équipe de sécurité interdit."
    d:
      en: "The secret becomes visible in the job arguments, and the API call moves into custom script code."
      fr: "Le secret devient visible dans les arguments de la tâche, et l'appel d'API passe dans du code de script personnalisé."
references:
  - title: Call HTTPS APIs in Step Functions workflows
    url: https://docs.aws.amazon.com/step-functions/latest/dg/call-https-apis.html
