id: deac01-3c-redshift-copy-emptyasnull
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nightly COPY command loads pipe-delimited files into an Amazon Redshift table. Some records contain two delimiters in succession for the VARCHAR column email. After each load, a data quality query counts the rows WHERE email IS NULL, but it returns 0 because those fields are loaded as empty strings. The data engineer wants these empty fields to be loaded as NULL so that the check counts them.

    Which COPY parameter should the data engineer add?
  fr: |
    Une commande COPY nocturne charge des fichiers délimités par des barres verticales dans une table Amazon Redshift. Certains enregistrements contiennent deux délimiteurs successifs pour la colonne VARCHAR email. Après chaque chargement, une requête de qualité des données compte les lignes WHERE email IS NULL, mais elle renvoie 0 parce que ces champs sont chargés comme des chaînes vides. L'ingénieur des données veut que ces champs vides soient chargés comme NULL pour que le contrôle les compte.

    Quel paramètre COPY l'ingénieur des données doit-il ajouter ?
body:
  options:
    - { id: a, text: "BLANKSASNULL" }
    - { id: b, text: "NOLOAD" }
    - { id: c, text: "EMPTYASNULL" }
    - { id: d, text: "MAXERROR 100" }
answer: { optionId: c }
explanation:
  correct:
    en: "EMPTYASNULL loads empty CHAR and VARCHAR fields, which occur when two delimiters follow each other with no characters between them, as NULL. It behaves like NULL AS '' (empty string), so the IS NULL check now counts them."
    fr: "EMPTYASNULL charge comme NULL les champs CHAR et VARCHAR vides, qui apparaissent lorsque deux délimiteurs se suivent sans caractère entre eux. Il se comporte comme NULL AS '' (chaîne vide) : le contrôle IS NULL les compte alors."
  options:
    a:
      en: "BLANKSASNULL applies to fields that contain only white space characters, not to empty fields between two delimiters."
      fr: "BLANKSASNULL s'applique aux champs qui ne contiennent que des espaces, pas aux champs vides entre deux délimiteurs."
    b:
      en: "NOLOAD only checks that the files can be parsed and loads no rows."
      fr: "NOLOAD vérifie seulement que les fichiers peuvent être analysés et ne charge aucune ligne."
    d:
      en: "MAXERROR sets how many rejected rows a load tolerates; empty fields are not errors and are still loaded as empty strings."
      fr: "MAXERROR fixe le nombre de lignes rejetées qu'un chargement tolère ; les champs vides ne sont pas des erreurs et sont toujours chargés comme chaînes vides."
references:
  - title: Data conversion parameters
    url: https://docs.aws.amazon.com/redshift/latest/dg/copy-parameters-data-conversion.html
