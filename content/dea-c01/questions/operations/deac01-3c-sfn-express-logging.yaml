id: deac01-3c-sfn-express-logging
objective: "3.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys an AWS Step Functions Express workflow with AWS CloudFormation. The workflow orchestrates the ingestion of small files and runs thousands of times each hour. When an execution fails, engineers cannot find any execution history for it. They need to see in Amazon CloudWatch Logs the events of failed executions, including the task that failed, but they do not want events from successful executions, to keep the log volume low.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany déploie un flux de travail Express AWS Step Functions avec AWS CloudFormation. Le flux de travail orchestre l'ingestion de petits fichiers et s'exécute des milliers de fois par heure. Lorsqu'une exécution échoue, les ingénieurs ne trouvent aucun historique d'exécution. Ils doivent voir dans Amazon CloudWatch Logs les événements des exécutions en échec, y compris la tâche qui a échoué, mais ils ne veulent pas les événements des exécutions réussies, afin de limiter le volume des journaux.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a LoggingConfiguration to the state machine with the ERROR log level and a CloudWatch Logs log group as the destination.", fr: "Ajouter à la machine d'état une LoggingConfiguration avec le niveau de journalisation ERROR et un groupe de journaux CloudWatch Logs comme destination." } }
    - { id: b, text: { en: "Add a LoggingConfiguration to the state machine with the FATAL log level and a CloudWatch Logs log group as the destination.", fr: "Ajouter à la machine d'état une LoggingConfiguration avec le niveau de journalisation FATAL et un groupe de journaux CloudWatch Logs comme destination." } }
    - { id: c, text: { en: "Allow the CloudWatch Logs log delivery actions, such as logs:CreateLogDelivery and logs:PutResourcePolicy, in the state machine's execution role.", fr: "Autoriser les actions de livraison de journaux CloudWatch Logs, telles que logs:CreateLogDelivery et logs:PutResourcePolicy, dans le rôle d'exécution de la machine d'état." } }
    - { id: d, text: { en: "Add a LoggingConfiguration to the state machine with the ALL log level and a CloudWatch Logs log group as the destination.", fr: "Ajouter à la machine d'état une LoggingConfiguration avec le niveau de journalisation ALL et un groupe de journaux CloudWatch Logs comme destination." } }
    - { id: e, text: { en: "Open the execution history of the failed executions on the Step Functions console instead of using CloudWatch Logs.", fr: "Ouvrir l'historique d'exécution des exécutions en échec dans la console Step Functions au lieu d'utiliser CloudWatch Logs." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Express workflows do not record execution history in Step Functions, and logging is not enabled by default when the state machine is created with CloudFormation. The ERROR level logs failure, abort and timeout events such as TaskFailed and ExecutionFailed but not success events, and the execution role needs the CloudWatch Logs log delivery permissions for Step Functions to write to the log group."
    fr: "Les flux de travail Express n'enregistrent pas d'historique d'exécution dans Step Functions, et la journalisation n'est pas activée par défaut lorsque la machine d'état est créée avec CloudFormation. Le niveau ERROR consigne les événements d'échec, d'abandon et d'expiration comme TaskFailed et ExecutionFailed, mais pas les événements de réussite, et le rôle d'exécution a besoin des autorisations de livraison de journaux CloudWatch Logs pour que Step Functions écrive dans le groupe de journaux."
  options:
    b:
      en: "FATAL logs only execution-level events such as ExecutionFailed, so the failed task would not appear."
      fr: "FATAL ne consigne que des événements au niveau de l'exécution comme ExecutionFailed : la tâche en échec n'apparaîtrait pas."
    d:
      en: "ALL logs every event type, including those of the thousands of successful executions, which the team wants to avoid."
      fr: "ALL consigne tous les types d'événements, y compris ceux des milliers d'exécutions réussies, ce que l'équipe veut éviter."
    e:
      en: "Unlike Standard workflows, Express workflows keep no execution history in Step Functions; logging to CloudWatch Logs is required."
      fr: "Contrairement aux flux de travail Standard, les flux de travail Express ne conservent aucun historique d'exécution dans Step Functions ; la journalisation vers CloudWatch Logs est nécessaire."
references:
  - title: Using CloudWatch Logs to log execution history in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/cw-logs.html
