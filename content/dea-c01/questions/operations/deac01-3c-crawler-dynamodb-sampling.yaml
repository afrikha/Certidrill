id: deac01-3c-crawler-dynamodb-sampling
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Glue crawler catalogs a provisioned Amazon DynamoDB table of 900 million items so that the table can be used by AWS Glue jobs. All the items follow the same structure. Each crawl scans the entire table, takes many hours and consumes read capacity that the production application needs. The data engineer wants the crawler to infer the schema from part of the data only.

    Which crawler setting should the data engineer use?
  fr: |
    Un robot d'analyse AWS Glue catalogue une table Amazon DynamoDB provisionnée de 900 millions d'éléments pour qu'elle puisse être utilisée par des tâches AWS Glue. Tous les éléments ont la même structure. Chaque analyse lit la table entière, dure de nombreuses heures et consomme de la capacité de lecture dont l'application de production a besoin. L'ingénieur des données veut que le robot d'analyse déduise le schéma à partir d'une partie des données seulement.

    Quel paramètre du robot d'analyse l'ingénieur des données doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Raise the scanning rate of the crawler to 1.5 so that the full scan finishes sooner.", fr: "Porter le taux d'analyse (scanning rate) du robot d'analyse à 1.5 pour que l'analyse complète se termine plus tôt." } }
    - { id: b, text: { en: "Set the subsequent crawler runs option to Crawl new sub-folders only.", fr: "Définir l'option des exécutions suivantes du robot d'analyse sur Crawl new sub-folders only." } }
    - { id: c, text: { en: "Add a custom classifier that describes the structure of the items.", fr: "Ajouter un classificateur personnalisé qui décrit la structure des éléments." } }
    - { id: d, text: { en: "Select Enable data sampling for the DynamoDB data source of the crawler.", fr: "Sélectionner Enable data sampling pour la source de données DynamoDB du robot d'analyse." } }
answer: { optionId: d }
explanation:
  correct:
    en: "For DynamoDB, MongoDB and Amazon DocumentDB data stores, Enable data sampling makes the crawler read only a data sample; if it is not selected, the entire table is crawled, which can take a long time. Sampling suits a table whose items share the same structure."
    fr: "Pour les magasins de données DynamoDB, MongoDB et Amazon DocumentDB, Enable data sampling fait lire au robot d'analyse un simple échantillon de données ; si l'option n'est pas sélectionnée, la table entière est analysée, ce qui peut être long. L'échantillonnage convient à une table dont les éléments partagent la même structure."
  options:
    a:
      en: "A higher scanning rate makes the crawler use a larger share of the table's read capacity, which hurts the production application, and it still reads every item."
      fr: "Un taux d'analyse plus élevé fait utiliser au robot d'analyse une plus grande part de la capacité de lecture de la table, ce qui pénalise l'application de production, et il lit toujours chaque élément."
    b:
      en: "This option applies to Amazon S3 folders, not to DynamoDB tables."
      fr: "Cette option s'applique aux dossiers Amazon S3, pas aux tables DynamoDB."
    c:
      en: "Custom classifiers describe file formats in data stores such as Amazon S3; they do not reduce the number of DynamoDB items read."
      fr: "Les classificateurs personnalisés décrivent des formats de fichiers dans des magasins comme Amazon S3 ; ils ne réduisent pas le nombre d'éléments DynamoDB lus."
references:
  - title: "Step 2: Choose data sources and classifiers"
    url: https://docs.aws.amazon.com/glue/latest/dg/define-crawler-choose-data-sources.html
