id: deac01-3c-trail-eventbridge-delete-db
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's data platform team must receive an email within minutes whenever any principal calls the AWS Glue DeleteDatabase or DeleteTable API in the production account. The account already has a CloudTrail trail that logs management events, and an Amazon SNS topic with the team's email subscription exists. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    L'équipe plateforme de données d'AnyCompany doit recevoir un e-mail en quelques minutes chaque fois qu'un principal appelle l'API AWS Glue DeleteDatabase ou DeleteTable dans le compte de production. Le compte possède déjà un journal de suivi CloudTrail qui consigne les événements de gestion, et une rubrique Amazon SNS avec l'abonnement e-mail de l'équipe existe. La solution doit présenter la plus FAIBLE charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable CloudTrail Insights on the trail and send the Insights events to the SNS topic.", fr: "Activer CloudTrail Insights sur le journal de suivi et envoyer les événements Insights vers la rubrique SNS." } }
    - { id: b, text: { en: "Schedule an AWS Lambda function every 5 minutes that calls the CloudTrail LookupEvents API for the two event names and publishes matches to the SNS topic.", fr: "Planifier toutes les 5 minutes une fonction AWS Lambda qui appelle l'API CloudTrail LookupEvents pour les deux noms d'événement et publie les résultats dans la rubrique SNS." } }
    - { id: c, text: { en: "Create an AWS Config rule that evaluates Glue databases and tables, and send noncompliance notifications to the SNS topic.", fr: "Créer une règle AWS Config qui évalue les bases de données et les tables Glue, et envoyer les notifications de non-conformité vers la rubrique SNS." } }
    - { id: d, text: { en: "Create an Amazon EventBridge rule on the default event bus for AWS API Call via CloudTrail events from aws.glue with those event names, with the SNS topic as the target.", fr: "Créer une règle Amazon EventBridge sur le bus d'événements par défaut pour les événements AWS API Call via CloudTrail provenant de aws.glue avec ces noms d'événement, avec la rubrique SNS comme cible." } }
answer: { optionId: d }
explanation:
  correct:
    en: "When a trail is logging, CloudTrail delivers API call events to the default event bus with the detail-type AWS API Call via CloudTrail. DeleteDatabase and DeleteTable are write management events, which a rule in the default ENABLED state matches, so a pattern on the source and eventName sends each call to SNS with no code to run."
    fr: "Lorsqu'un journal de suivi est actif, CloudTrail livre les événements d'appels d'API au bus d'événements par défaut avec le detail-type AWS API Call via CloudTrail. DeleteDatabase et DeleteTable sont des événements de gestion en écriture, qu'une règle dans l'état par défaut ENABLED fait correspondre : un modèle sur la source et sur eventName envoie chaque appel vers SNS sans code à exécuter."
  options:
    a:
      en: "Insights reports unusual call or error rates compared with a baseline; it does not notify on each individual call."
      fr: "Insights signale des taux d'appels ou d'erreurs inhabituels par rapport à une base de référence ; il ne notifie pas chaque appel individuel."
    b:
      en: "A polling function adds code, scheduling and pagination to maintain, which is more overhead than an event rule."
      fr: "Une fonction d'interrogation ajoute du code, une planification et une pagination à maintenir, soit plus de charge qu'une règle d'événement."
    c:
      en: "AWS Config evaluates resource configurations against rules; it does not alert on who called a deletion API."
      fr: "AWS Config évalue des configurations de ressources par rapport à des règles ; il n'alerte pas sur l'auteur d'un appel d'API de suppression."
references:
  - title: AWS service events delivered via AWS CloudTrail
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
