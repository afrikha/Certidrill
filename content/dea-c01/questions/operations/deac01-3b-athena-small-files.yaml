id: deac01-3b-athena-small-files
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An IoT pipeline writes each sensor reading as a separate JSON object of about 2 KB in date-partitioned prefixes of an Amazon S3 bucket, which adds millions of objects every day. Athena queries over a month of data have become slow, and some fail with SlowDown errors from Amazon S3.

    Which solution will improve the query performance the MOST?
  fr: |
    Un pipeline IoT écrit chaque relevé de capteur sous la forme d'un objet JSON distinct d'environ 2 Ko dans des préfixes partitionnés par date d'un compartiment Amazon S3, ce qui ajoute des millions d'objets chaque jour. Les requêtes Athena sur un mois de données sont devenues lentes, et certaines échouent avec des erreurs SlowDown d'Amazon S3.

    Quelle solution améliore le PLUS les performances des requêtes ?
body:
  options:
    - { id: a, text: { en: "Add hour and sensor_id as additional partition keys so that each query reads fewer objects per partition.", fr: "Ajouter hour et sensor_id comme clés de partition supplémentaires afin que chaque requête lise moins d'objets par partition." } }
    - { id: b, text: { en: "Compact each day's objects into a few larger Parquet files with a scheduled job and query the compacted table.", fr: "Compacter les objets de chaque jour en quelques fichiers Parquet plus volumineux avec une tâche planifiée et interroger la table compactée." } }
    - { id: c, text: { en: "Compress each JSON object with gzip when the pipeline writes it, to reduce the bytes that Athena scans.", fr: "Compresser chaque objet JSON avec gzip au moment où le pipeline l'écrit, pour réduire les octets analysés par Athena." } }
    - { id: d, text: { en: "Raise the per-query data usage limit of the Athena workgroup so that queries over a month can complete.", fr: "Augmenter la limite d'utilisation des données par requête du groupe de travail Athena afin que les requêtes sur un mois puissent aboutir." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Datasets made of many small files perform poorly in Athena, because reading one larger object is faster than reading the same records from many small ones, and the request rate can exceed S3 limits and return SlowDown. Compacting into larger Parquet files also lets Athena read only the needed columns and compress them efficiently."
    fr: "Les jeux de données composés de nombreux petits fichiers offrent de mauvaises performances dans Athena, car lire un objet plus volumineux est plus rapide que lire les mêmes enregistrements dans de nombreux petits objets, et le taux de requêtes peut dépasser les limites de S3 et renvoyer SlowDown. Compacter en fichiers Parquet plus volumineux permet aussi à Athena de ne lire que les colonnes nécessaires et de les compresser efficacement."
  options:
    a:
      en: "More partition keys fragment the data into even more, smaller files, which makes the problem worse."
      fr: "Davantage de clés de partition fragmentent les données en fichiers encore plus nombreux et plus petits, ce qui aggrave le problème."
    c:
      en: "Compression reduces bytes scanned but keeps millions of tiny objects, so the per-object overhead and S3 request rate remain."
      fr: "La compression réduit les octets analysés mais conserve des millions de minuscules objets : le surcoût par objet et le taux de requêtes S3 demeurent."
    d:
      en: "Data usage controls cap or alert on bytes scanned; they do not make queries faster or reduce S3 requests."
      fr: "Les contrôles d'utilisation des données plafonnent les octets analysés ou alertent à leur sujet ; ils n'accélèrent pas les requêtes et ne réduisent pas les requêtes S3."
references:
  - title: Optimize data
    url: https://docs.aws.amazon.com/athena/latest/ug/performance-tuning-data-optimization-techniques.html
