id: deac01-3c-dms-data-validation
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany migrates an on-premises PostgreSQL database to Amazon Aurora PostgreSQL with an AWS Database Migration Service (AWS DMS) task that performs a full load and then replicates ongoing changes. All the tables have primary keys. Before the cutover, the data team must confirm that each row in the target contains the same data as the corresponding row in the source, including the rows changed during replication, and must see which records do not match.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    AnyCompany migre une base de données PostgreSQL sur site vers Amazon Aurora PostgreSQL avec une tâche AWS Database Migration Service (AWS DMS) qui effectue un chargement complet puis réplique les modifications en cours. Toutes les tables ont une clé primaire. Avant la bascule, l'équipe données doit confirmer que chaque ligne de la cible contient les mêmes données que la ligne correspondante de la source, y compris les lignes modifiées pendant la réplication, et doit voir quels enregistrements ne correspondent pas.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Enable data validation in the DMS task settings, and then review the validation state and failed records in the table statistics.", fr: "Activer la validation des données dans les paramètres de la tâche DMS, puis examiner l'état de validation et les enregistrements en échec dans les statistiques de table." } }
    - { id: b, text: { en: "Run AWS Glue DataBrew profile jobs on the source and target tables, and compare the two profiles.", fr: "Exécuter des tâches de profil AWS Glue DataBrew sur les tables source et cible, et comparer les deux profils." } }
    - { id: c, text: { en: "Schedule Amazon Athena federated queries that compare the row counts of each table in both databases.", fr: "Planifier des requêtes fédérées Amazon Athena qui comparent le nombre de lignes de chaque table dans les deux bases de données." } }
    - { id: d, text: { en: "Turn on CloudWatch logging for the DMS task, and then search the task logs for errors with Logs Insights.", fr: "Activer la journalisation CloudWatch de la tâche DMS, puis rechercher les erreurs dans les journaux de la tâche avec Logs Insights." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS DMS data validation compares each source row with its corresponding target row and reports mismatches. It starts after the full load and validates CDC changes as they occur, and the table statistics show ValidationState and ValidationFailedRecords, with details written to the awsdms_validation_failures_v1 table. Validation requires a primary key or unique index."
    fr: "La validation des données AWS DMS compare chaque ligne source à la ligne cible correspondante et signale les différences. Elle démarre après le chargement complet et valide les modifications CDC au fil de l'eau, et les statistiques de table affichent ValidationState et ValidationFailedRecords, le détail étant écrit dans la table awsdms_validation_failures_v1. La validation exige une clé primaire ou un index unique."
  options:
    b:
      en: "Profiles compare statistics, not individual rows, so they cannot show which records differ."
      fr: "Les profils comparent des statistiques, pas des lignes individuelles : ils ne peuvent pas montrer quels enregistrements diffèrent."
    c:
      en: "Equal row counts do not prove that the values match, and this needs connectors and scheduled queries."
      fr: "Des nombres de lignes égaux ne prouvent pas que les valeurs correspondent, et cela nécessite des connecteurs et des requêtes planifiées."
    d:
      en: "Task logs report task errors, not a row-by-row comparison of source and target data."
      fr: "Les journaux de la tâche signalent ses erreurs, pas une comparaison ligne par ligne des données source et cible."
references:
  - title: AWS DMS data validation
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Validating.html
