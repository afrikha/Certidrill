id: deac01-3a-glue-flex-execution
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs 30 AWS Glue 5.0 Spark ETL jobs with G.1X workers every night to prepare reports that business users read the next morning. The start time and duration of the jobs can vary as long as they finish before morning. The company wants to reduce the cost of these jobs without changing their code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute chaque nuit 30 tâches ETL Spark AWS Glue 5.0 avec des workers G.1X pour préparer des rapports que les utilisateurs métier lisent le lendemain matin. L'heure de démarrage et la durée des tâches peuvent varier tant qu'elles se terminent avant le matin. L'entreprise veut réduire le coût de ces tâches sans modifier leur code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the execution class of the jobs to FLEX.", fr: "Définir la classe d'exécution des tâches sur FLEX." } }
    - { id: b, text: { en: "Change the worker type of the jobs to G.025X.", fr: "Passer le type de worker des tâches à G.025X." } }
    - { id: c, text: { en: "Increase the timeout of the jobs to 7 days.", fr: "Porter le délai d'expiration des tâches à 7 jours." } }
    - { id: d, text: { en: "Set the MaxConcurrentRuns value of the jobs to 1.", fr: "Définir la valeur MaxConcurrentRuns des tâches sur 1." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The FLEX execution class is for non-urgent Spark jobs whose start and completion times may vary; it supports Glue 3.0 or later with G.1X or G.2X workers and is billed at a lower DPU-hour rate than the STANDARD class. It is a job setting, so the scripts do not change."
    fr: "La classe d'exécution FLEX est destinée aux tâches Spark non urgentes dont les heures de démarrage et de fin peuvent varier ; elle prend en charge Glue 3.0 ou ultérieur avec des workers G.1X ou G.2X et est facturée à un tarif par DPU-heure inférieur à celui de la classe STANDARD. C'est un paramètre de la tâche : les scripts ne changent pas."
  options:
    b:
      en: "G.025X workers are intended for low-volume streaming jobs and could leave large batch jobs short of memory."
      fr: "Les workers G.025X sont destinés aux tâches de streaming à faible volume et pourraient manquer de mémoire pour de gros traitements par lots."
    c:
      en: "The timeout only limits how long a run may last; it does not reduce the price of the run."
      fr: "Le délai d'expiration limite seulement la durée d'une exécution ; il ne réduit pas son prix."
    d:
      en: "MaxConcurrentRuns limits parallel runs of a job; the same work is billed at the same rate."
      fr: "MaxConcurrentRuns limite les exécutions parallèles d'une tâche ; le même travail est facturé au même tarif."
references:
  - title: Configuring job properties for Spark jobs in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/add-job.html
  - title: Jobs
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-jobs-job.html
