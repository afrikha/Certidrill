id: deac01-3a-glue-workflow-event-batch
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Partners of AnyCompany upload CSV files to an Amazon S3 bucket at irregular times during the day. An AWS Glue crawler and two Glue jobs process the files as one pipeline. Running the pipeline once for every file is too expensive. The pipeline must start after 50 new files have arrived, or 10 minutes after the first new file arrives if fewer than 50 files arrive. The company wants to use only AWS Glue orchestration features and no custom code.

    Which solution will meet these requirements?
  fr: |
    Les partenaires d'AnyCompany chargent des fichiers CSV dans un compartiment Amazon S3 à des heures irrégulières de la journée. Un robot d'analyse AWS Glue et deux tâches Glue traitent les fichiers en un seul pipeline. Exécuter le pipeline une fois par fichier coûte trop cher. Le pipeline doit démarrer après l'arrivée de 50 nouveaux fichiers, ou 10 minutes après l'arrivée du premier nouveau fichier s'il en arrive moins de 50. L'entreprise veut utiliser uniquement les fonctionnalités d'orchestration d'AWS Glue, sans code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Glue workflow whose start trigger is a schedule trigger that runs every 10 minutes.", fr: "Créer un flux de travail Glue dont le déclencheur de démarrage est un déclencheur planifié qui s'exécute toutes les 10 minutes." } }
    - { id: b, text: { en: "Create an EventBridge rule that invokes a Lambda function for each new object; the function counts the files in DynamoDB and starts the workflow at 50 files.", fr: "Créer une règle EventBridge qui appelle une fonction Lambda pour chaque nouvel objet ; la fonction compte les fichiers dans DynamoDB et démarre le flux de travail à 50 fichiers." } }
    - { id: c, text: { en: "Create a Glue workflow with an on-demand start trigger, and an S3 event notification that starts the crawler for each new object.", fr: "Créer un flux de travail Glue avec un déclencheur de démarrage à la demande, et une notification d'événement S3 qui démarre le robot d'analyse pour chaque nouvel objet." } }
    - { id: d, text: { en: "Create a Glue workflow with an EVENT start trigger that has a batch size of 50 and a batch window of 600 seconds, and an EventBridge rule that targets the workflow.", fr: "Créer un flux de travail Glue avec un déclencheur de démarrage EVENT dont la taille de lot est 50 et la fenêtre de lot 600 secondes, et une règle EventBridge qui cible le flux de travail." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A Glue workflow can start from Amazon EventBridge events and wait for a batch: the batch size sets the number of events, and the batch window (up to 900 seconds) starts with the first event. Whichever condition is met first starts the workflow, which then runs the crawler and jobs through its own triggers."
    fr: "Un flux de travail Glue peut démarrer à partir d'événements Amazon EventBridge et attendre un lot : la taille de lot fixe le nombre d'événements, et la fenêtre de lot (900 secondes au maximum) commence au premier événement. La première condition remplie démarre le flux de travail, qui exécute ensuite le robot d'analyse et les tâches par ses propres déclencheurs."
  options:
    a:
      en: "A schedule runs every 10 minutes even when no file has arrived, and it does not start the pipeline as soon as 50 files are present."
      fr: "Une planification s'exécute toutes les 10 minutes même sans nouveau fichier, et ne démarre pas le pipeline dès que 50 fichiers sont présents."
    b:
      en: "The Lambda function and the DynamoDB counter are custom code that Glue event batching makes unnecessary."
      fr: "La fonction Lambda et le compteur DynamoDB sont du code personnalisé que le traitement par lots d'événements de Glue rend inutile."
    c:
      en: "Starting the crawler for each object runs the processing once per file, which is the cost the company wants to avoid."
      fr: "Démarrer le robot d'analyse pour chaque objet exécute le traitement une fois par fichier, ce que l'entreprise veut éviter pour des raisons de coût."
references:
  - title: Overview of workflows in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/workflows_overview.html
  - title: Starting an AWS Glue workflow with an Amazon EventBridge event
    url: https://docs.aws.amazon.com/glue/latest/dg/starting-workflow-eventbridge.html
