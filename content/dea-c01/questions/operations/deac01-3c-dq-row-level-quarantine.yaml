id: deac01-3c-dq-row-level-quarantine
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue Studio visual ETL job loads customer records from a landing zone into a curated zone in Amazon S3. During each run, records whose customer_id or email field is empty must be written to a quarantine prefix for review, while all the other records continue to the curated zone in the same run. The data engineers want to use the built-in data quality features of AWS Glue and write as little code as possible.

    Which solution will meet these requirements?
  fr: |
    Une tâche ETL visuelle AWS Glue Studio charge des enregistrements clients d'une zone d'atterrissage vers une zone organisée dans Amazon S3. Pendant chaque exécution, les enregistrements dont le champ customer_id ou email est vide doivent être écrits dans un préfixe de quarantaine pour examen, tandis que tous les autres enregistrements continuent vers la zone organisée au cours de la même exécution. Les ingénieurs des données veulent utiliser les fonctionnalités de qualité des données intégrées d'AWS Glue et écrire le moins de code possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an Evaluate Data Quality transform with IsComplete rules on both fields and the option to add data quality columns to the row-level output, and then route the rows on DataQualityEvaluationResult.", fr: "Ajouter une transformation Evaluate Data Quality avec des règles IsComplete sur les deux champs et l'option qui ajoute des colonnes de qualité des données à la sortie au niveau des lignes, puis aiguiller les lignes selon DataQualityEvaluationResult." } }
    - { id: b, text: { en: "Add an Evaluate Data Quality transform with IsComplete rules on both fields and set On ruleset failure to Fail job without loading to target data.", fr: "Ajouter une transformation Evaluate Data Quality avec des règles IsComplete sur les deux champs et définir On ruleset failure sur Fail job without loading to target data." } }
    - { id: c, text: { en: "Run an AWS Glue Data Quality evaluation on the curated Data Catalog table after each job run, and move the failing records afterward.", fr: "Exécuter une évaluation AWS Glue Data Quality sur la table organisée du Data Catalog après chaque exécution de la tâche, puis déplacer ensuite les enregistrements en échec." } }
    - { id: d, text: { en: "Add an Evaluate Data Quality transform with a RowCount rule, and then split the output on the overall ruleset result of the run.", fr: "Ajouter une transformation Evaluate Data Quality avec une règle RowCount, puis séparer la sortie selon le résultat global de l'ensemble de règles de l'exécution." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Evaluate Data Quality transform can output the original data as rowLevelOutcomes with added columns such as DataQualityRulesFail and DataQualityEvaluationResult, which is Passed or Failed for each row. A downstream filter on that column sends failing rows to the quarantine prefix and passing rows to the curated zone in the same run."
    fr: "La transformation Evaluate Data Quality peut produire les données d'origine sous forme de rowLevelOutcomes avec des colonnes ajoutées comme DataQualityRulesFail et DataQualityEvaluationResult, qui vaut Passed ou Failed pour chaque ligne. Un filtre en aval sur cette colonne envoie les lignes en échec vers le préfixe de quarantaine et les lignes valides vers la zone organisée au cours de la même exécution."
  options:
    b:
      en: "This setting stops the job and loads no target, so the valid records would not reach the curated zone."
      fr: "Ce paramètre arrête la tâche et ne charge aucune cible : les enregistrements valides n'atteindraient pas la zone organisée."
    c:
      en: "A catalog evaluation runs after the data is already loaded, so bad records reach the curated zone and need a separate cleanup."
      fr: "Une évaluation sur le catalogue s'exécute une fois les données déjà chargées : les enregistrements incorrects atteignent la zone organisée et nécessitent un nettoyage distinct."
    d:
      en: "RowCount is a dataset-level rule that cannot identify error records, and the overall result cannot separate rows."
      fr: "RowCount est une règle au niveau du jeu de données qui ne peut pas identifier les enregistrements en erreur, et le résultat global ne permet pas de séparer les lignes."
references:
  - title: Evaluating data quality for ETL jobs in AWS Glue Studio
    url: https://docs.aws.amazon.com/glue/latest/dg/tutorial-data-quality.html
