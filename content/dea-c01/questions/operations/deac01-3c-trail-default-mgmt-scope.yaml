id: deac01-3c-trail-default-mgmt-scope
objective: "3.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany created a multi-Region CloudTrail trail with the default event settings, which log management events only. The data platform uses AWS Glue, AWS Lake Formation, Amazon S3, Amazon DynamoDB and an Amazon Redshift provisioned cluster. An auditor asks which of the following activities the trail's log files will contain.

    Which activities will the trail record? (Choose two.)
  fr: |
    AnyCompany a créé un journal de suivi CloudTrail multi-Région avec les paramètres d'événements par défaut, qui ne consignent que les événements de gestion. La plateforme de données utilise AWS Glue, AWS Lake Formation, Amazon S3, Amazon DynamoDB et un cluster provisionné Amazon Redshift. Un auditeur demande lesquelles des activités suivantes figureront dans les fichiers journaux du journal de suivi.

    Quelles activités le journal de suivi enregistre-t-il ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An ETL pipeline uploads a Parquet file to the curated bucket with PutObject.", fr: "Un pipeline ETL charge un fichier Parquet dans le compartiment organisé avec PutObject." } }
    - { id: b, text: { en: "A data engineer starts an AWS Glue job with StartJobRun.", fr: "Un ingénieur des données démarre une tâche AWS Glue avec StartJobRun." } }
    - { id: c, text: { en: "An analyst runs a SELECT statement on a Redshift table from a SQL client.", fr: "Un analyste exécute une instruction SELECT sur une table Redshift depuis un client SQL." } }
    - { id: d, text: { en: "An administrator grants SELECT on a Data Catalog table to a role with Lake Formation GrantPermissions.", fr: "Un administrateur accorde SELECT sur une table du Data Catalog à un rôle avec GrantPermissions de Lake Formation." } }
    - { id: e, text: { en: "An application writes an order item to a DynamoDB table with PutItem.", fr: "Une application écrit un élément de commande dans une table DynamoDB avec PutItem." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Trails log management events by default; these are control plane operations on resources, such as starting a Glue job run or changing Lake Formation permissions. Object-level S3 operations and item-level DynamoDB operations are data events, which trails do not log unless data event selectors are added."
    fr: "Les journaux de suivi consignent par défaut les événements de gestion, c'est-à-dire les opérations du plan de contrôle sur les ressources, comme le démarrage d'une exécution de tâche Glue ou la modification d'autorisations Lake Formation. Les opérations S3 au niveau des objets et les opérations DynamoDB au niveau des éléments sont des événements de données, que les journaux de suivi ne consignent pas sans sélecteurs d'événements de données."
  options:
    a:
      en: "PutObject is an S3 data event, which is not logged by default and is charged separately when enabled."
      fr: "PutObject est un événement de données S3, qui n'est pas consigné par défaut et est facturé à part lorsqu'il est activé."
    c:
      en: "CloudTrail captures Redshift API calls, not the SQL statements run in the database; those are in the user activity log of database audit logging."
      fr: "CloudTrail capture les appels d'API Redshift, pas les instructions SQL exécutées dans la base de données ; celles-ci figurent dans le journal d'activité utilisateur de la journalisation d'audit de la base de données."
    e:
      en: "PutItem is a DynamoDB data event, which needs a data event selector on the trail."
      fr: "PutItem est un événement de données DynamoDB, qui nécessite un sélecteur d'événements de données sur le journal de suivi."
references:
  - title: Logging management events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-management-events-with-cloudtrail.html
  - title: Logging data events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
