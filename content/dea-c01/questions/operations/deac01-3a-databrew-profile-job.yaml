id: deac01-3a-databrew-profile-job
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany receives a new 40-column customer dataset in Amazon S3 from an acquired business. Before analysts design the cleaning steps, they need column-level statistics of the data, a count of duplicate rows, and a correlation matrix between selected columns. The analysts do not write code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany reçoit dans Amazon S3 un nouveau jeu de données clients de 40 colonnes provenant d'une entreprise rachetée. Avant que les analystes conçoivent les étapes de nettoyage, ils ont besoin de statistiques par colonne, du nombre de lignes en double et d'une matrice de corrélation entre des colonnes choisies. Les analystes n'écrivent pas de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS Glue crawler on the dataset and review the table schema that it creates in the Data Catalog.", fr: "Créer un robot d'analyse AWS Glue sur le jeu de données et examiner le schéma de table qu'il crée dans le catalogue de données." } }
    - { id: b, text: { en: "Create an AWS Glue DataBrew dataset and run a recipe job that writes the cleaned data to a new prefix.", fr: "Créer un jeu de données AWS Glue DataBrew et exécuter une tâche de recette qui écrit les données nettoyées dans un nouveau préfixe." } }
    - { id: c, text: { en: "Create an AWS Glue DataBrew dataset and run a profile job with duplicate detection and a correlation matrix enabled.", fr: "Créer un jeu de données AWS Glue DataBrew et exécuter une tâche de profil avec la détection des doublons et la matrice de corrélation activées." } }
    - { id: d, text: { en: "Create an Amazon Athena table and run a CREATE TABLE AS SELECT statement that writes the data in Parquet format.", fr: "Créer une table Amazon Athena et exécuter une instruction CREATE TABLE AS SELECT qui écrit les données au format Parquet." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A DataBrew profile job runs a series of evaluations on a dataset and writes the results to Amazon S3, with configurable dataset-level and column-level statistics. At the dataset level, it can detect and count duplicate rows and build a correlation matrix, which helps decide the steps of later recipe jobs."
    fr: "Une tâche de profil DataBrew exécute une série d'évaluations sur un jeu de données et écrit les résultats dans Amazon S3, avec des statistiques configurables au niveau du jeu de données et des colonnes. Au niveau du jeu de données, elle peut détecter et compter les lignes en double et créer une matrice de corrélation, ce qui aide à choisir les étapes des futures tâches de recette."
  options:
    a:
      en: "A crawler infers the schema and partitions; it does not compute statistics, duplicates, or correlations."
      fr: "Un robot d'analyse déduit le schéma et les partitions ; il ne calcule ni statistiques, ni doublons, ni corrélations."
    b:
      en: "A recipe job applies transformation steps; the analysts have not designed those steps yet."
      fr: "Une tâche de recette applique des étapes de transformation ; les analystes ne les ont pas encore conçues."
    d:
      en: "CTAS converts the data format, and computing the statistics would require the analysts to write SQL."
      fr: "CTAS convertit le format des données, et calculer les statistiques obligerait les analystes à écrire du SQL."
references:
  - title: Creating and working with AWS Glue DataBrew profile jobs
    url: https://docs.aws.amazon.com/databrew/latest/dg/jobs.profile.html
