id: deac01-3a-api-partner-key-throttling
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function runs every hour to download the latest records from a partner's REST API and write them to Amazon S3. The API requires an API key and returns HTTP 429 responses, sometimes with a Retry-After header, when the caller sends requests too quickly. The security team requires the key to be encrypted, kept out of the function code and configuration, and rotatable. An hourly download must not be lost because of throttling.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une fonction AWS Lambda s'exécute toutes les heures pour télécharger les derniers enregistrements de l'API REST d'un partenaire et les écrire dans Amazon S3. L'API exige une clé d'API et renvoie des réponses HTTP 429, parfois avec un en-tête Retry-After, lorsque l'appelant envoie des requêtes trop vite. L'équipe de sécurité exige que la clé soit chiffrée, absente du code et de la configuration de la fonction, et renouvelable. Un téléchargement horaire ne doit pas être perdu à cause de la limitation.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the API key in AWS Secrets Manager and retrieve it at run time with permissions granted to the execution role.", fr: "Stocker la clé d'API dans AWS Secrets Manager et la récupérer à l'exécution avec des autorisations accordées au rôle d'exécution." } }
    - { id: b, text: { en: "Store the API key in a Lambda environment variable and restrict who can view the function configuration.", fr: "Stocker la clé d'API dans une variable d'environnement Lambda et restreindre qui peut consulter la configuration de la fonction." } }
    - { id: c, text: { en: "Increase the memory of the function so that it has more network bandwidth for the partner API.", fr: "Augmenter la mémoire de la fonction pour qu'elle dispose de plus de bande passante réseau vers l'API du partenaire." } }
    - { id: d, text: { en: "On a 429 response, wait for the Retry-After duration or an exponential backoff with jitter, and then retry the request.", fr: "Sur une réponse 429, attendre la durée Retry-After ou un backoff exponentiel avec gigue (jitter), puis retenter la requête." } }
    - { id: e, text: { en: "Enable API Gateway caching for the partner API so that throttled requests are served from the cache.", fr: "Activer la mise en cache API Gateway pour l'API du partenaire afin que les requêtes limitées soient servies depuis le cache." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Secrets Manager stores the key encrypted, supports rotation, and lets the function read it at run time through its execution role, so the key is not in the code or configuration. HTTP 429 means the caller must slow down: waiting for Retry-After or backing off exponentially with jitter before retrying lets the download complete."
    fr: "Secrets Manager stocke la clé chiffrée, prend en charge la rotation et permet à la fonction de la lire à l'exécution par son rôle d'exécution : la clé n'est ni dans le code ni dans la configuration. HTTP 429 signifie que l'appelant doit ralentir : attendre Retry-After ou appliquer un backoff exponentiel avec gigue avant de retenter permet de terminer le téléchargement."
  options:
    b:
      en: "An environment variable is part of the function configuration, which the security team excludes."
      fr: "Une variable d'environnement fait partie de la configuration de la fonction, ce que l'équipe de sécurité exclut."
    c:
      en: "The partner throttles the request rate; more bandwidth does not stop 429 responses."
      fr: "Le partenaire limite le taux de requêtes ; plus de bande passante n'empêche pas les réponses 429."
    e:
      en: "API Gateway caching applies to APIs that the company hosts in API Gateway, not to a partner's external API."
      fr: "La mise en cache API Gateway s'applique aux API que l'entreprise héberge dans API Gateway, pas à l'API externe d'un partenaire."
references:
  - title: What is AWS Secrets Manager?
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
  - title: Retry behavior
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
