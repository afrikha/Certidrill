id: deac01-3c-trail-event-history-delete
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team at AnyCompany uses the AWS Glue Data Catalog for its data lake. Yesterday, a table named orders_curated disappeared from the Data Catalog, and Amazon Athena queries now fail. The account has no CloudTrail trail and no event data store. The team must identify the IAM principal that removed the table, and when, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données d'AnyCompany utilise AWS Glue Data Catalog pour son lac de données. Hier, une table nommée orders_curated a disparu du Data Catalog et les requêtes Amazon Athena échouent désormais. Le compte ne possède aucun journal de suivi (trail) CloudTrail ni aucun magasin de données d'événements. L'équipe doit identifier le principal IAM qui a supprimé la table, et à quel moment, avec le MOINS d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudTrail trail that logs management events to Amazon S3, and then query the delivered log files with Athena.", fr: "Créer un journal de suivi CloudTrail qui consigne les événements de gestion dans Amazon S3, puis interroger les fichiers journaux livrés avec Athena." } }
    - { id: b, text: { en: "In the CloudTrail console, filter Event history in the Region of the catalog on the event name DeleteTable.", fr: "Dans la console CloudTrail, filtrer l'historique des événements de la Région du catalogue sur le nom d'événement DeleteTable." } }
    - { id: c, text: { en: "Run a CloudWatch Logs Insights query on the /aws-glue/jobs/output log group for the word DeleteTable.", fr: "Exécuter une requête CloudWatch Logs Insights sur le groupe de journaux /aws-glue/jobs/output pour rechercher le mot DeleteTable." } }
    - { id: d, text: { en: "Enable S3 server access logging on the data lake bucket, and then search the access logs for DELETE requests.", fr: "Activer la journalisation des accès au serveur S3 sur le compartiment du lac de données, puis rechercher les requêtes DELETE dans les journaux d'accès." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudTrail is enabled by default, and Event history keeps a searchable record of the last 90 days of management events in each Region at no charge, without any trail. DeleteTable is a Data Catalog management event, so a lookup on the event name shows the user identity and the time of the call."
    fr: "CloudTrail est activé par défaut, et l'historique des événements conserve, sans frais et sans journal de suivi, un enregistrement consultable des 90 derniers jours d'événements de gestion de chaque Région. DeleteTable est un événement de gestion du Data Catalog : une recherche sur le nom d'événement affiche l'identité de l'utilisateur et l'heure de l'appel."
  options:
    a:
      en: "A new trail records only the events that occur after it is created, so it cannot show yesterday's deletion."
      fr: "Un nouveau journal de suivi n'enregistre que les événements postérieurs à sa création : il ne peut pas montrer la suppression d'hier."
    c:
      en: "Glue job output logs contain what scripts print, not the Data Catalog API calls made by principals."
      fr: "Les journaux de sortie des tâches Glue contiennent ce que les scripts affichent, pas les appels d'API au Data Catalog effectués par les principaux."
    d:
      en: "Deleting a catalog table is a Glue API call, not an S3 request, and logging enabled now would not cover yesterday."
      fr: "La suppression d'une table du catalogue est un appel d'API Glue, pas une requête S3, et une journalisation activée maintenant ne couvrirait pas la journée d'hier."
references:
  - title: Working with CloudTrail event history
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
