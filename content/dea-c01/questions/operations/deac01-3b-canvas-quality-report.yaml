id: deac01-3b-canvas-quality-report
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data science team prepares a tabular dataset for a customer churn classification model in Amazon SageMaker Canvas. Before any training, the team wants an automatically generated report that flags duplicate rows, missing values and outliers, and that warns about columns that could cause target leakage. The team does not want to write code.

    Which solution will meet these requirements?
  fr: |
    Une équipe de science des données prépare un jeu de données tabulaire pour un modèle de classification de l'attrition des clients dans Amazon SageMaker Canvas. Avant tout entraînement, l'équipe veut un rapport généré automatiquement qui signale les lignes en double, les valeurs manquantes et les valeurs aberrantes, et qui avertit des colonnes susceptibles de provoquer une fuite de la cible (target leakage). L'équipe ne veut pas écrire de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Data Quality and Insights Report on the dataset in a SageMaker Canvas Data Wrangler flow, with churn as the target.", fr: "Créer un Data Quality and Insights Report sur le jeu de données dans un flux Data Wrangler de SageMaker Canvas, avec l'attrition comme cible." } }
    - { id: b, text: { en: "Evaluate the dataset in AWS Glue Data Quality with a ruleset of completeness and uniqueness rules that Glue recommends.", fr: "Évaluer le jeu de données dans AWS Glue Data Quality avec un ensemble de règles d'exhaustivité et d'unicité recommandées par Glue." } }
    - { id: c, text: { en: "Run an AWS Glue DataBrew profile job on the dataset with duplicate row detection and the correlation matrix enabled.", fr: "Exécuter une tâche de profil AWS Glue DataBrew sur le jeu de données avec la détection des lignes en double et la matrice de corrélation activées." } }
    - { id: d, text: { en: "Run Athena queries that count nulls, duplicates and outliers per column, and save the query results in Amazon S3.", fr: "Exécuter des requêtes Athena qui comptent les valeurs nulles, les doublons et les valeurs aberrantes par colonne, et enregistrer les résultats dans Amazon S3." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In SageMaker Canvas, the Data Quality and Insights Report of a Data Wrangler flow reports missing values, outliers and duplicate rows. Because it takes a problem type and a target column, it also ranks features by prediction power and highlights a score that suggests target leakage."
    fr: "Dans SageMaker Canvas, le Data Quality and Insights Report d'un flux Data Wrangler signale les valeurs manquantes, les valeurs aberrantes et les lignes en double. Comme il prend un type de problème et une colonne cible, il classe aussi les caractéristiques selon leur pouvoir prédictif et met en évidence un score qui suggère une fuite de la cible."
  options:
    c:
      en: "A DataBrew profile reports statistics such as duplicates and missing values, but it has no target column and does not detect target leakage."
      fr: "Un profil DataBrew produit des statistiques comme les doublons et les valeurs manquantes, mais il n'a pas de colonne cible et ne détecte pas la fuite de la cible."
    b:
      en: "Glue Data Quality evaluates rulesets of data quality rules; it has no target column and does not assess target leakage for a model."
      fr: "Glue Data Quality évalue des ensembles de règles de qualité des données ; il n'a pas de colonne cible et n'évalue pas la fuite de la cible pour un modèle."
    d:
      en: "Athena queries are code that the team must write, and they do not assess target leakage."
      fr: "Les requêtes Athena sont du code que l'équipe doit écrire, et elles n'évaluent pas la fuite de la cible."
references:
  - title: Perform exploratory data analysis (EDA)
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/canvas-analyses.html
