id: deac01-3b-emr-ec2-hbase
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company needs Apache HBase on Amazon EMR for low-latency random reads and writes on billions of rows, and it runs nightly Apache Spark jobs on the same data. The team prefers a serverless deployment whenever it meets the requirements.

    Which deployment will meet these requirements?
  fr: |
    Une entreprise a besoin d'Apache HBase sur Amazon EMR pour des lectures et écritures aléatoires à faible latence sur des milliards de lignes, et elle exécute chaque nuit des tâches Apache Spark sur les mêmes données. L'équipe préfère un déploiement sans serveur chaque fois qu'il répond aux exigences.

    Quel déploiement répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An Amazon EMR cluster on Amazon EC2 with HBase and Spark installed.", fr: "Un cluster Amazon EMR sur Amazon EC2 avec HBase et Spark installés." } }
    - { id: b, text: { en: "An Amazon EMR Serverless application with the HBase runtime for reads and writes and a Spark application for the nightly jobs.", fr: "Une application Amazon EMR Serverless avec le runtime HBase pour les lectures et écritures, et une application Spark pour les tâches nocturnes." } }
    - { id: c, text: { en: "Athena for Apache Spark notebooks for both the random access and the nightly jobs.", fr: "Des blocs-notes Athena for Apache Spark pour l'accès aléatoire et pour les tâches nocturnes." } }
    - { id: d, text: { en: "AWS Glue Spark jobs that read and write the data in Amazon S3 through the Glue Data Catalog.", fr: "Des tâches AWS Glue Spark qui lisent et écrivent les données dans Amazon S3 via le Glue Data Catalog." } }
answer: { optionId: a }
explanation:
  correct:
    en: "EMR Serverless provides a serverless runtime for frameworks such as Apache Spark and Apache Hive; it offers no HBase runtime, so no serverless option meets the HBase requirement. An EMR cluster on EC2 can run HBase for random access and Spark for the nightly jobs, at the cost of managing the cluster."
    fr: "EMR Serverless fournit un environnement sans serveur pour des frameworks comme Apache Spark et Apache Hive ; il n'offre pas de runtime HBase : aucune option sans serveur ne répond donc à l'exigence HBase. Un cluster EMR sur EC2 peut exécuter HBase pour l'accès aléatoire et Spark pour les tâches nocturnes, au prix de la gestion du cluster."
  options:
    b:
      en: "EMR Serverless applications use runtimes such as Spark or Hive; there is no HBase runtime."
      fr: "Les applications EMR Serverless utilisent des runtimes comme Spark ou Hive ; il n'existe pas de runtime HBase."
    c:
      en: "Athena for Spark runs interactive Spark sessions; it is not a low-latency random-access data store."
      fr: "Athena for Spark exécute des sessions Spark interactives ; ce n'est pas un magasin de données à accès aléatoire à faible latence."
    d:
      en: "Glue jobs are batch Spark processing; they do not provide HBase or low-latency random reads and writes."
      fr: "Les tâches Glue sont des traitements Spark par lots ; elles ne fournissent ni HBase ni lectures et écritures aléatoires à faible latence."
references:
  - title: What is Amazon EMR Serverless?
    url: https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/emr-serverless.html
