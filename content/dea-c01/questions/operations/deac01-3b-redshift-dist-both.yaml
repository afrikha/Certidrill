id: deac01-3b-redshift-dist-both
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Two large Amazon Redshift tables, orders (3 billion rows) and order_items (12 billion rows), both use DISTSTYLE EVEN. A daily report joins them on order_id and has become slow. The EXPLAIN output shows DS_DIST_BOTH on the join step. Both tables are loaded once per day.

    Which change will reduce the cost of this join the MOST?
  fr: |
    Deux grandes tables Amazon Redshift, orders (3 milliards de lignes) et order_items (12 milliards de lignes), utilisent toutes deux DISTSTYLE EVEN. Un rapport quotidien les joint sur order_id et est devenu lent. La sortie d'EXPLAIN montre DS_DIST_BOTH sur l'étape de jointure. Les deux tables sont chargées une fois par jour.

    Quelle modification réduit le PLUS le coût de cette jointure ?
body:
  options:
    - { id: a, text: { en: "Define order_id as the distribution key (DISTKEY) of both tables.", fr: "Définir order_id comme clé de distribution (DISTKEY) des deux tables." } }
    - { id: b, text: { en: "Define order_id as the sort key of both tables and keep DISTSTYLE EVEN.", fr: "Définir order_id comme clé de tri des deux tables et conserver DISTSTYLE EVEN." } }
    - { id: c, text: { en: "Run VACUUM and ANALYZE on both tables after each daily load.", fr: "Exécuter VACUUM et ANALYZE sur les deux tables après chaque chargement quotidien." } }
    - { id: d, text: { en: "Change both tables to DISTSTYLE ALL.", fr: "Passer les deux tables en DISTSTYLE ALL." } }
answer: { optionId: a }
explanation:
  correct:
    en: "DS_DIST_BOTH means that both tables are redistributed for the join, usually because they are not joined on their distribution keys. With DISTKEY(order_id) on both tables, matching rows are collocated on the same slices and the join can run as DS_DIST_NONE, with no redistribution."
    fr: "DS_DIST_BOTH signifie que les deux tables sont redistribuées pour la jointure, généralement parce qu'elles ne sont pas jointes sur leurs clés de distribution. Avec DISTKEY(order_id) sur les deux tables, les lignes correspondantes sont colocalisées sur les mêmes tranches et la jointure peut s'exécuter en DS_DIST_NONE, sans redistribution."
  options:
    d:
      en: "DISTSTYLE ALL copies the whole table to every node, which suits small dimension tables, not billions of rows."
      fr: "DISTSTYLE ALL copie toute la table sur chaque nœud, ce qui convient aux petites tables de dimension, pas à des milliards de lignes."
    b:
      en: "A sort key helps scans and merge joins, but with EVEN distribution the rows still have to be redistributed for the join."
      fr: "Une clé de tri aide les analyses et les jointures par fusion, mais avec une distribution EVEN les lignes doivent toujours être redistribuées pour la jointure."
    c:
      en: "VACUUM and ANALYZE reclaim space and refresh statistics; they do not change how the rows are distributed across slices."
      fr: "VACUUM et ANALYZE récupèrent de l'espace et actualisent les statistiques ; ils ne changent pas la répartition des lignes entre les tranches."
references:
  - title: Evaluating the query plan
    url: https://docs.aws.amazon.com/redshift/latest/dg/c_data_redistribution.html
