id: deac01-3c-cwl-account-subscription
objective: "3.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's analytics account has more than 300 CloudWatch Logs log groups for AWS Lambda functions, AWS Glue jobs and Amazon MWAA environments, and teams create new log groups every week. A data engineer must copy the log events of all current and future log groups continuously to an Amazon S3 data lake through an existing Amazon Data Firehose stream. The log group that records the Firehose delivery errors must be excluded. The solution must require the LEAST ongoing effort.

    Which solution will meet these requirements?
  fr: |
    Le compte d'analyse d'AnyCompany compte plus de 300 groupes de journaux CloudWatch Logs pour des fonctions AWS Lambda, des tâches AWS Glue et des environnements Amazon MWAA, et les équipes créent de nouveaux groupes de journaux chaque semaine. Un ingénieur des données doit copier en continu les événements de journal de tous les groupes de journaux actuels et futurs vers un lac de données Amazon S3, par l'intermédiaire d'un flux Amazon Data Firehose existant. Le groupe de journaux qui enregistre les erreurs de livraison de Firehose doit être exclu. La solution doit demander le MOINS d'effort continu possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an account-level subscription filter policy with put-account-policy, the Firehose stream as the destination, and selection criteria that exclude the Firehose error log group.", fr: "Créer une politique de filtre d'abonnement au niveau du compte avec put-account-policy, le flux Firehose comme destination et des critères de sélection qui excluent le groupe de journaux d'erreurs de Firehose." } }
    - { id: b, text: { en: "Create an EventBridge rule for CreateLogGroup API calls that invokes a Lambda function, which adds a subscription filter to Firehose on each new log group.", fr: "Créer une règle EventBridge pour les appels d'API CreateLogGroup qui invoque une fonction Lambda, laquelle ajoute à chaque nouveau groupe de journaux un filtre d'abonnement vers Firehose." } }
    - { id: c, text: { en: "Schedule a daily CreateExportTask for every log group that exports the previous day's events to the data lake bucket.", fr: "Planifier chaque jour une tâche CreateExportTask pour chaque groupe de journaux, qui exporte les événements de la veille vers le compartiment du lac de données." } }
    - { id: d, text: { en: "Install the CloudWatch agent on an Amazon EC2 instance and configure it to read all the log groups and forward them to Firehose.", fr: "Installer l'agent CloudWatch sur une instance Amazon EC2 et le configurer pour lire tous les groupes de journaux et les transférer à Firehose." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An account-level subscription filter policy sends log events to Kinesis Data Streams, Lambda or Firehose and applies to existing log groups and to log groups created later. Its selection criteria (NOT IN) exclude log groups that belong to the delivery workflow, which avoids a recursive loop that would inflate ingestion charges."
    fr: "Une politique de filtre d'abonnement au niveau du compte envoie les événements de journal vers Kinesis Data Streams, Lambda ou Firehose et s'applique aux groupes de journaux existants comme à ceux créés ultérieurement. Ses critères de sélection (NOT IN) excluent les groupes de journaux du flux de livraison, ce qui évite une boucle récursive qui augmenterait les frais d'ingestion."
  options:
    b:
      en: "This works for new groups but leaves custom code to maintain and does not cover the 300 existing log groups without a separate backfill."
      fr: "Cela fonctionne pour les nouveaux groupes, mais laisse du code personnalisé à maintenir et ne couvre pas les 300 groupes existants sans un rattrapage distinct."
    c:
      en: "Export tasks are batch copies started per log group; they are not continuous and must be scheduled and tracked for every group."
      fr: "Les tâches d'exportation sont des copies par lots lancées par groupe de journaux ; elles ne sont pas continues et doivent être planifiées et suivies pour chaque groupe."
    d:
      en: "The CloudWatch agent collects files and metrics from the server it runs on; it does not read existing CloudWatch Logs log groups."
      fr: "L'agent CloudWatch collecte les fichiers et les métriques du serveur sur lequel il s'exécute ; il ne lit pas des groupes de journaux CloudWatch Logs existants."
references:
  - title: Account-level subscription filters
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/SubscriptionFilters-AccountLevel.html
  - title: PutAccountPolicy
    url: https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutAccountPolicy.html
