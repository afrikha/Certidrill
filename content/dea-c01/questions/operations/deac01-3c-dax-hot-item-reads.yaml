id: deac01-3c-dax-hot-item-reads
objective: "3.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    During a one-day flash sale, a retail company's product page reads the same few items of an Amazon DynamoDB table tens of thousands of times each second. The reads are concentrated on these hot keys and are throttled, although the table's total read capacity is far from used. The application calls GetItem with ConsistentRead set to true, and the business accepts that a product page can show data that is a few seconds old. Writes to these items are rare.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Pendant une vente flash d'une journée, la page produit d'une entreprise de distribution lit les mêmes quelques éléments d'une table Amazon DynamoDB des dizaines de milliers de fois par seconde. Les lectures se concentrent sur ces clés très sollicitées et sont limitées, bien que la capacité de lecture totale de la table soit loin d'être utilisée. L'application appelle GetItem avec ConsistentRead défini sur true, et l'entreprise accepte qu'une page produit affiche des données vieilles de quelques secondes. Les écritures sur ces éléments sont rares.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Switch the table to on-demand capacity mode for the day of the sale.", fr: "Passer la table en mode de capacité à la demande pour la journée de la vente." } }
    - { id: b, text: { en: "Create a DynamoDB Accelerator (DAX) cluster and send the product page reads through the DAX client.", fr: "Créer un cluster DynamoDB Accelerator (DAX) et envoyer les lectures de la page produit via le client DAX." } }
    - { id: c, text: { en: "Add a global secondary index with the same partition key and read the items from the index.", fr: "Ajouter un index secondaire global avec la même clé de partition et lire les éléments depuis l'index." } }
    - { id: d, text: { en: "Double the provisioned read capacity units of the table.", fr: "Doubler les unités de capacité de lecture provisionnées de la table." } }
    - { id: e, text: { en: "Change the product page reads to eventually consistent reads by setting ConsistentRead to false.", fr: "Passer les lectures de la page produit en lectures à cohérence éventuelle en définissant ConsistentRead sur false." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "DAX is an in-memory cache that offloads repeated reads of popular items, such as a one-day sale on a product, from the table. DAX caches only eventually consistent reads: it passes strongly consistent requests to DynamoDB without caching them, so the reads must stop using ConsistentRead true."
    fr: "DAX est un cache en mémoire qui décharge la table des lectures répétées d'éléments populaires, comme lors d'une vente d'une journée sur un produit. DAX ne met en cache que les lectures à cohérence éventuelle : il transmet les requêtes fortement cohérentes à DynamoDB sans les mettre en cache, de sorte que les lectures ne doivent plus utiliser ConsistentRead à true."
  options:
    a:
      en: "On-demand mode changes how table capacity is provisioned and billed, but the reads still concentrate on the same few keys."
      fr: "Le mode à la demande change la façon dont la capacité de la table est provisionnée et facturée, mais les lectures se concentrent toujours sur les mêmes quelques clés."
    c:
      en: "An index with the same partition key concentrates the same reads on the same key values, and it adds write cost."
      fr: "Un index avec la même clé de partition concentre les mêmes lectures sur les mêmes valeurs de clé, et il ajoute un coût d'écriture."
    d:
      en: "The table's total capacity is already far from used; more capacity does not spread reads that target the same keys."
      fr: "La capacité totale de la table est déjà loin d'être utilisée ; davantage de capacité ne répartit pas des lectures qui visent les mêmes clés."
references:
  - title: In-memory acceleration with DynamoDB Accelerator (DAX)
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
  - title: DAX and DynamoDB consistency models
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.consistency.html
