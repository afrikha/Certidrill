id: deac01-3b-unified-studio-lineage
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company publishes its data assets in the catalog of Amazon SageMaker Unified Studio. Data consumers need a graph that shows where each published asset comes from and which transformations produced it. Some of the transformations run in an on-premises scheduler that can emit OpenLineage events.

    Which solution will meet these requirements?
  fr: |
    Une entreprise publie ses ressources de données dans le catalogue d'Amazon SageMaker Unified Studio. Les consommateurs de données ont besoin d'un graphe qui montre d'où vient chaque ressource publiée et quelles transformations l'ont produite. Certaines transformations s'exécutent dans un planificateur sur site capable d'émettre des événements OpenLineage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use data lineage in SageMaker Unified Studio and send it the scheduler's OpenLineage events through its APIs.", fr: "Utiliser le lignage des données (data lineage) de SageMaker Unified Studio et lui envoyer les événements OpenLineage du planificateur via ses API." } }
    - { id: b, text: { en: "Turn on AWS Config recording for the Glue jobs and the other resources that run the transformations.", fr: "Activer l'enregistrement AWS Config pour les tâches Glue et les autres ressources qui exécutent les transformations." } }
    - { id: c, text: { en: "Query the CloudTrail events of the transformation jobs with Athena and publish the results as a report.", fr: "Interroger avec Athena les événements CloudTrail des tâches de transformation et publier les résultats sous forme de rapport." } }
    - { id: d, text: { en: "Compare the versions of each table schema that the AWS Glue Data Catalog keeps for the published assets.", fr: "Comparer les versions de chaque schéma de table que le AWS Glue Data Catalog conserve pour les ressources publiées." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Data lineage in SageMaker Unified Studio is OpenLineage-compatible: it captures lineage events from OpenLineage-enabled systems or through APIs and shows the origin of assets, their chain of connections and the transformations applied. Events from the on-premises scheduler can be published to it programmatically."
    fr: "Le lignage des données de SageMaker Unified Studio est compatible OpenLineage : il capture les événements de lignage de systèmes compatibles OpenLineage ou via des API et montre l'origine des ressources, leur chaîne de connexions et les transformations appliquées. Les événements du planificateur sur site peuvent lui être publiés par programmation."
  options:
    b:
      en: "AWS Config tracks configuration changes of AWS resources, not how data flows between datasets."
      fr: "AWS Config suit les modifications de configuration des ressources AWS, et non la circulation des données entre jeux de données."
    c:
      en: "CloudTrail shows API calls, not the datasets read and written by each job, and it does not cover the on-premises scheduler."
      fr: "CloudTrail montre des appels d'API, et non les jeux de données lus et écrits par chaque tâche, et il ne couvre pas le planificateur sur site."
    d:
      en: "Schema versions show how a table's columns changed, not where its data came from."
      fr: "Les versions de schéma montrent l'évolution des colonnes d'une table, et non l'origine de ses données."
references:
  - title: Data lineage in Amazon SageMaker Unified Studio
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/datazone-data-lineage.html
