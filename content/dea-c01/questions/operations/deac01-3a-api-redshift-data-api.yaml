id: deac01-3a-api-redshift-data-api
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An internal metrics API uses Amazon API Gateway and AWS Lambda functions that query an Amazon Redshift Serverless workgroup through a PostgreSQL driver. The functions run in a VPC, store the database password in their code, and open a new connection for each request, which exhausts connections during traffic peaks. The company wants to stop managing database connections and drivers and to remove the password from the code.

    Which solution will meet these requirements?
  fr: |
    Une API interne de métriques utilise Amazon API Gateway et des fonctions AWS Lambda qui interrogent un groupe de travail Amazon Redshift Serverless par un pilote PostgreSQL. Les fonctions s'exécutent dans un VPC, stockent le mot de passe de la base de données dans leur code et ouvrent une nouvelle connexion à chaque requête, ce qui épuise les connexions pendant les pics de trafic. L'entreprise veut ne plus gérer de connexions ni de pilotes de base de données, et supprimer le mot de passe du code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Put an Amazon RDS Proxy in front of the workgroup and connect the functions to the proxy endpoint.", fr: "Placer un Amazon RDS Proxy devant le groupe de travail et connecter les fonctions au point de terminaison du proxy." } }
    - { id: b, text: { en: "Open the connection outside the handler so that it is reused, and move the password to an environment variable.", fr: "Ouvrir la connexion hors du gestionnaire pour la réutiliser, et déplacer le mot de passe dans une variable d'environnement." } }
    - { id: c, text: { en: "Call the Amazon Redshift Data API with the workgroup name and a Secrets Manager secret ARN, then read the results with DescribeStatement and GetStatementResult.", fr: "Appeler l'API de données Amazon Redshift avec le nom du groupe de travail et l'ARN d'un secret Secrets Manager, puis lire les résultats avec DescribeStatement et GetStatementResult." } }
    - { id: d, text: { en: "Set reserved concurrency on the functions to cap the number of connections, and keep the driver.", fr: "Définir une simultanéité réservée sur les fonctions pour plafonner le nombre de connexions, et conserver le pilote." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Redshift Data API runs SQL through an HTTPS endpoint and the AWS SDK, without drivers or persistent connections, against Redshift Serverless workgroups and provisioned clusters. Calls are asynchronous, and authentication uses Secrets Manager or temporary credentials, so no password is passed in code."
    fr: "L'API de données Redshift exécute du SQL par un point de terminaison HTTPS et le kit AWS SDK, sans pilote ni connexion persistante, sur les groupes de travail Redshift Serverless et les clusters provisionnés. Les appels sont asynchrones, et l'authentification utilise Secrets Manager ou des informations d'identification temporaires : aucun mot de passe n'est transmis dans le code."
  options:
    a:
      en: "RDS Proxy pools connections for Amazon RDS and Aurora databases, not for Amazon Redshift, and the driver would remain."
      fr: "RDS Proxy mutualise les connexions des bases Amazon RDS et Aurora, pas d'Amazon Redshift, et le pilote resterait."
    b:
      en: "Connections and the driver are still managed by the functions, and an environment variable still stores the password."
      fr: "Les connexions et le pilote restent gérés par les fonctions, et une variable d'environnement stocke toujours le mot de passe."
    d:
      en: "Capping concurrency throttles the API during peaks and leaves the driver and the password in place."
      fr: "Plafonner la simultanéité limite l'API pendant les pics et laisse en place le pilote et le mot de passe."
references:
  - title: Using the Amazon Redshift Data API
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/data-api.html
