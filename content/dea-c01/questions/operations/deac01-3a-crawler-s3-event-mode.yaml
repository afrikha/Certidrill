id: deac01-3a-crawler-s3-event-mode
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue crawler runs every hour on an Amazon S3 data lake prefix that contains about 2 million objects in thousands of folders. Each hour, new objects arrive in only a few folders, but every crawl lists the whole prefix, takes a long time, and generates many S3 LIST requests. The Data Catalog must still receive the new partitions every hour.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Un robot d'analyse AWS Glue s'exécute toutes les heures sur un préfixe de lac de données Amazon S3 qui contient environ 2 millions d'objets répartis dans des milliers de dossiers. Chaque heure, de nouveaux objets n'arrivent que dans quelques dossiers, mais chaque analyse liste tout le préfixe, dure longtemps et génère de nombreuses requêtes S3 LIST. Le catalogue de données doit toujours recevoir les nouvelles partitions toutes les heures.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Run the crawler every 15 minutes so that each crawl has fewer new objects to find.", fr: "Exécuter le robot d'analyse toutes les 15 minutes pour que chaque analyse ait moins de nouveaux objets à trouver." } }
    - { id: b, text: { en: "Replace the crawler with a Lambda function that lists the prefix every hour and calls BatchCreatePartition.", fr: "Remplacer le robot d'analyse par une fonction Lambda qui liste le préfixe toutes les heures et appelle BatchCreatePartition." } }
    - { id: c, text: { en: "Send S3 event notifications for the crawler's target prefix to an Amazon SQS queue, and configure the crawler to crawl based on these events.", fr: "Envoyer les notifications d'événement S3 du préfixe cible du robot d'analyse vers une file d'attente Amazon SQS, et configurer le robot pour qu'il analyse en fonction de ces événements." } }
    - { id: d, text: { en: "Run the MSCK REPAIR TABLE statement in Amazon Athena every hour instead of the crawler.", fr: "Exécuter l'instruction MSCK REPAIR TABLE dans Amazon Athena toutes les heures à la place du robot d'analyse." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In S3 event mode, after a first full crawl, the crawler reads the S3 events from the SQS queue and lists only the folders where objects were added or deleted. Recrawls are faster and make fewer S3 LIST requests, and a run with an empty queue costs nothing."
    fr: "En mode événements S3, après une première analyse complète, le robot d'analyse lit les événements S3 dans la file SQS et ne liste que les dossiers où des objets ont été ajoutés ou supprimés. Les nouvelles analyses sont plus rapides et font moins de requêtes S3 LIST, et une exécution avec une file vide ne coûte rien."
  options:
    a:
      en: "Each crawl still lists the whole prefix, so more frequent crawls multiply the LIST requests."
      fr: "Chaque analyse liste toujours tout le préfixe : des analyses plus fréquentes multiplient les requêtes LIST."
    b:
      en: "The function still lists the whole prefix every hour and is custom code to maintain."
      fr: "La fonction liste toujours tout le préfixe chaque heure et constitue du code personnalisé à maintenir."
    d:
      en: "MSCK REPAIR TABLE scans the folder and its subfolders, so it does not avoid listing the whole prefix."
      fr: "MSCK REPAIR TABLE analyse le dossier et ses sous-dossiers : il n'évite pas de lister tout le préfixe."
references:
  - title: Accelerating crawls using Amazon S3 event notifications
    url: https://docs.aws.amazon.com/glue/latest/dg/crawler-s3-event-notifications.html
