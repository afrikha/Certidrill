id: deac01-3a-sfn-standard-emr-serverless
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team at AnyCompany is designing an AWS Step Functions workflow for a monthly reconciliation pipeline. The workflow runs an Apache Spark job on Amazon EMR Serverless that takes about 3 hours, and then loads the results into Amazon Redshift. The load must start only after the Spark job succeeds, and each step must run exactly once per execution unless a retry is configured.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'ingénierie des données d'AnyCompany conçoit un flux de travail AWS Step Functions pour un pipeline de rapprochement mensuel. Le flux de travail exécute sur Amazon EMR Serverless une tâche Apache Spark qui dure environ 3 heures, puis charge les résultats dans Amazon Redshift. Le chargement ne doit démarrer qu'après la réussite de la tâche Spark, et chaque étape doit s'exécuter exactement une fois par exécution, sauf si une nouvelle tentative est configurée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use an asynchronous Express workflow with an emr-serverless:startJobRun.sync task, followed by the Redshift load task.", fr: "Utiliser un flux de travail Express asynchrone avec une tâche emr-serverless:startJobRun.sync, suivie de la tâche de chargement Redshift." } }
    - { id: b, text: { en: "Use a synchronous Express workflow with an emr-serverless:startJobRun task, followed by a Wait state and the Redshift load task.", fr: "Utiliser un flux de travail Express synchrone avec une tâche emr-serverless:startJobRun, suivie d'un état Wait et de la tâche de chargement Redshift." } }
    - { id: c, text: { en: "Use a Standard workflow with an emr-serverless:startJobRun.sync task, followed by the Redshift load task.", fr: "Utiliser un flux de travail Standard avec une tâche emr-serverless:startJobRun.sync, suivie de la tâche de chargement Redshift." } }
    - { id: d, text: { en: "Use a Standard workflow with an emr-serverless:startJobRun task that uses the Request Response pattern, followed by the Redshift load task.", fr: "Utiliser un flux de travail Standard avec une tâche emr-serverless:startJobRun qui utilise le modèle Request Response, suivie de la tâche de chargement Redshift." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Standard workflows run for up to one year with exactly-once execution of each state, and they support the Run a Job (.sync) pattern. The emr-serverless:startJobRun.sync integration waits until the job run reaches SUCCESS before the load task starts."
    fr: "Les flux de travail Standard s'exécutent jusqu'à un an avec une exécution exactement une fois de chaque état, et prennent en charge le modèle Run a Job (.sync). L'intégration emr-serverless:startJobRun.sync attend que l'exécution de la tâche atteigne SUCCESS avant de lancer le chargement."
  options:
    a:
      en: "Express workflows run for at most five minutes, do not support .sync, and asynchronous Express executions are at-least-once."
      fr: "Les flux de travail Express durent cinq minutes au maximum, ne prennent pas en charge .sync, et les exécutions Express asynchrones sont au moins une fois (at-least-once)."
    b:
      en: "An Express workflow cannot run for 3 hours, and a fixed Wait state does not confirm that the job succeeded."
      fr: "Un flux de travail Express ne peut pas durer 3 heures, et un état Wait fixe ne confirme pas la réussite de la tâche."
    d:
      en: "Request Response returns as soon as the job run is submitted, so the load would start before the Spark job finishes."
      fr: "Request Response rend la main dès la soumission de l'exécution : le chargement démarrerait avant la fin de la tâche Spark."
references:
