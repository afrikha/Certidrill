id: deac01-3c-dqdl-aggregatematch-recon
objective: "3.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Glue ETL job copies daily payment records from a staging dataset to a curated dataset. In the Evaluate Data Quality transform, the staging data is added as a reference dataset with the alias staging. The payments have no unique key, because a payment can legitimately appear twice with the same values. The finance team requires a check that the total of the amount column in the curated output equals the total in the staging data.

    Which DQDL rule will meet this requirement?
  fr: |
    Une tâche ETL AWS Glue copie des enregistrements de paiement quotidiens d'un jeu de données intermédiaire vers un jeu de données organisé. Dans la transformation Evaluate Data Quality, les données intermédiaires sont ajoutées comme jeu de données de référence avec l'alias staging. Les paiements n'ont pas de clé unique, car un paiement peut légitimement apparaître deux fois avec les mêmes valeurs. L'équipe financière exige un contrôle vérifiant que le total de la colonne amount dans la sortie organisée est égal au total des données intermédiaires.

    Quelle règle DQDL répond à cette exigence ?
body:
  options:
    - { id: a, text: '`DatasetMatch "staging" "payment_id" >= 1.0`' }
    - { id: b, text: '`ReferentialIntegrity "amount" "staging.amount" = 1.0`' }
    - { id: c, text: '`Sum "amount" = 1.0`' }
    - { id: d, text: '`AggregateMatch "sum(amount)" "sum(staging.amount)" = 1.0`' }
answer: { optionId: d }
explanation:
  correct:
    en: "AggregateMatch divides the first aggregation by the second and compares the ratio with the expression; it supports sum and avg across the primary and a reference dataset. A ratio equal to 1.0 means the two totals are identical, and the rule does not need unique keys."
    fr: "AggregateMatch divise la première agrégation par la seconde et compare le ratio à l'expression ; elle prend en charge sum et avg entre le jeu de données principal et un jeu de référence. Un ratio égal à 1.0 signifie que les deux totaux sont identiques, et la règle n'exige pas de clés uniques."
  options:
    a:
      en: "DatasetMatch joins the datasets on key columns that must be unique and not null; without such a key it returns an error, and AWS recommends AggregateMatch instead."
      fr: "DatasetMatch joint les jeux de données sur des colonnes clés qui doivent être uniques et non nulles ; sans une telle clé, la règle renvoie une erreur, et AWS recommande AggregateMatch à la place."
    b:
      en: "ReferentialIntegrity checks that amount values exist in the reference set of values; it does not compare totals, and duplicates or missing rows would not change the result."
      fr: "ReferentialIntegrity vérifie que les valeurs de amount existent dans l'ensemble de valeurs de référence ; elle ne compare pas des totaux, et des doublons ou des lignes manquantes ne changeraient pas le résultat."
    c:
      en: "Sum checks the total of one dataset against a constant; 1.0 is not the staging total, which changes every day."
      fr: "Sum compare le total d'un seul jeu de données à une constante ; 1.0 n'est pas le total intermédiaire, qui change chaque jour."
references:
  - title: AggregateMatch
    url: https://docs.aws.amazon.com/glue/latest/dg/dqdl-rule-types-AggregateMatch.html
  - title: DatasetMatch
    url: https://docs.aws.amazon.com/glue/latest/dg/dqdl-rule-types-DatasetMatch.html
