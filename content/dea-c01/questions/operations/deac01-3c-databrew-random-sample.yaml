id: deac01-3c-databrew-random-sample
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An analyst builds an AWS Glue DataBrew recipe on a dataset of 3 years of support tickets. The source files are ordered by creation date, and the project uses a sample of the first 500 rows. The analyst notices that the sample shows only tickets from the first weeks and none of the newer ticket categories. The analyst wants the interactive sample to be more representative of the whole dataset.

    Which change should the analyst make to the project sample?
  fr: |
    Un analyste construit une recette AWS Glue DataBrew sur un jeu de données de 3 ans de tickets de support. Les fichiers source sont triés par date de création, et le projet utilise un échantillon des 500 premières lignes. L'analyste remarque que l'échantillon ne montre que des tickets des premières semaines et aucune des catégories de tickets plus récentes. L'analyste veut que l'échantillon interactif soit plus représentatif de l'ensemble du jeu de données.

    Quelle modification l'analyste doit-il apporter à l'échantillon du projet ?
body:
  options:
    - { id: a, text: { en: "Change the sample type to the last 500 rows.", fr: "Passer le type d'échantillon aux 500 dernières lignes." } }
    - { id: b, text: { en: "Change the sample type to 5,000 random rows.", fr: "Passer le type d'échantillon à 5 000 lignes aléatoires." } }
    - { id: c, text: { en: "Keep the first rows and raise the sample size to 5,000 rows.", fr: "Conserver les premières lignes et porter la taille de l'échantillon à 5 000 lignes." } }
    - { id: d, text: { en: "Run a recipe job on the full dataset after each recipe change.", fr: "Exécuter une tâche de recette sur le jeu de données complet après chaque modification de la recette." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A DataBrew sample for interactive analysis takes rows with the FIRST_N, LAST_N or RANDOM type, with a size of up to 5,000 rows. Random rows spread the sample over the whole period, so the newer categories appear, whereas first or last rows of a date-ordered file stay biased toward one end."
    fr: "Un échantillon DataBrew pour l'analyse interactive prend des lignes selon le type FIRST_N, LAST_N ou RANDOM, avec une taille allant jusqu'à 5 000 lignes. Des lignes aléatoires répartissent l'échantillon sur toute la période, ce qui fait apparaître les catégories récentes, alors que les premières ou dernières lignes d'un fichier trié par date restent biaisées vers une extrémité."
  options:
    a:
      en: "The last rows are biased toward the newest tickets, so the older categories would disappear instead."
      fr: "Les dernières lignes sont biaisées vers les tickets les plus récents : ce sont alors les catégories anciennes qui disparaîtraient."
    c:
      en: "More first rows still come from the beginning of a file that is ordered by date, so the sample stays biased."
      fr: "Davantage de premières lignes proviennent toujours du début d'un fichier trié par date : l'échantillon reste biaisé."
    d:
      en: "A recipe job writes transformed output; it does not change the sample that the analyst sees while building the recipe."
      fr: "Une tâche de recette écrit une sortie transformée ; elle ne modifie pas l'échantillon que l'analyste voit pendant qu'il construit la recette."
references:
  - title: Sample
    url: https://docs.aws.amazon.com/databrew/latest/dg/API_Sample.html
