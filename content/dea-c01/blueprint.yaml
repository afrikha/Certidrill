# DEA-C01 — AWS Certified Data Engineer – Associate
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-19):
#   - AWS Certified Data Engineer - Associate (DEA-C01) Exam Guide, HTML pages and Markdown copies under
#     https://docs.aws.amazon.com/aws-certification/latest/data-engineer-associate-01/data-engineer-associate-01.html
#     (domain pages data-engineer-associate-01-domain1..4, dea-01-in-scope-services,
#     dea-01-out-of-scope-services, dea-01-revisions), and the PDF in the same folder.
#     The fr_fr path serves the English text (meta locale en_us) and the fr_fr PDF fails:
#     no French guide exists.
#   - Certification page: https://aws.amazon.com/certification/certified-data-engineer-associate/
#     (130 minutes, 65 questions, multiple choice or multiple response, 150 USD; DEA-C01 only,
#     no retirement or new-version date announced).
# Guide version: 1.1, published December 12, 2025 (Revisions page and PDF change history;
# 1.0 = first release, undated). blueprint.version = that date.
# Exam facts: 65 questions = 50 scored + 15 unscored (not identified); scaled score 100–1,000,
# pass at 720, compensatory scoring; response types: multiple choice (1 correct of 4) and multiple
# response (2 or more correct of 5 or more). No penalty for guessing. The guide does not state the
# duration (130 min from the certification page).
# Unscored questions are not modelled: the mock exam scores all 65 questions.
# Domain weights: share of scored content as published (34 / 26 / 22 / 18 %).
certification:
  code: dea-c01
  title: AWS Certified Data Engineer – Associate
  vendor: AWS
  # The official exam is not offered in French: the site offers this certification in English only
  # (the French files written earlier stay in the repository, unused).
  languages: [en]
  active: false

blueprint:
  version: '2025-12-12'
  durationMin: 130
  questionCount: { min: 65, max: 65 }
  passScore: 720
  maxScore: 1000
  # AWS gives no partial credit on multiple-response questions (see docs/SPECS-AWS.md §3.3);
  # ignored by the loader until that rule is implemented.
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing

  # Target share of each question type in an exam (0..1). The real exam has only
  # multiple choice (single) and multiple response (multi).
  typeMix:
    single: { min: 0.78, max: 0.88 }
    multi: { min: 0.12, max: 0.22 }

  difficultyMix: { easy: 0.30, medium: 0.50, hard: 0.20 }

  structure:
    caseStudies:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
      placement: end
    series:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # Readiness index (0–100), the central indicator of the dashboard.
    # index = weighted sum of four criteria, each worth 0–100 points:
    #   level       — weighted average of the last `window` exams, weights 1, 2, …, n
    #                 from the oldest to the latest
    #   consistency — lowest of the last `recent` exams
    #   domains     — weakest domain, averaged over the last `recent` exams
    #   freshness   — share of never-seen questions, and date of the last exam
    # Scores map to points linearly: `scale.from` or less → 0, `scale.to` or more → 100.
    # "Ready" = index at `bands.ready` or more AND five rules (minAttempts,
    # consecutive × minScore, domainFloor, freshness.minNewShare: at least that
    # share of never-seen questions in the `recent` exams, freshness.zeroDays: a
    # last exam at most that old); while a rule fails, the index stays
    # under `bands.ready`.
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale: { from: 600, to: 850 }
      weights: { level: 0.5, consistency: 0.2, domains: 0.2, freshness: 0.1 }
      bands: { progressing: 50, almost: 70, ready: 85 }
      # Recency: full up to staleDays after the last exam, then down to 0 at zeroDays;
      # past zeroDays, no "ready" until a new exam.
      freshness: { staleDays: 30, zeroDays: 90, minNewShare: 0.5 }
    # XP, levels, domain mastery and badges: the "gaming" side. They reward
    # effort and progress; only the readiness index says "ready".
    progression:
      xp:
        base: 50            # any finished exam
        scoreFrom: 400      # score XP = (score - 400) × 0.5: 0 at 400, 300 at 1000
        perPoint: 0.5
        knownShare: 0.5     # only half the score XP on questions already seen
        passBonus: 100      # at 720 or more
        bestBonus: 75       # best score so far
        domainBonus: 50     # per domain at least 50 points above the previous exam
        domainGain: 50
      levels:
        - { xp: 0, title: { en: Data apprentice, fr: Apprenti data } }
        - { xp: 150, title: { en: Lake explorer, fr: Explorateur du lac de données } }
        - { xp: 400, title: { en: Stream wrangler, fr: Maître des flux } }
        - { xp: 750, title: { en: Glue crafter, fr: Artisan Glue } }
        - { xp: 1200, title: { en: Junior data engineer, fr: Ingénieur data junior } }
        - { xp: 1750, title: { en: Partition strategist, fr: Stratège des partitions } }
        - { xp: 2400, title: { en: Warehouse builder, fr: Bâtisseur d'entrepôt } }
        - { xp: 3150, title: { en: Pipeline guardian, fr: Gardien des pipelines } }
        - { xp: 4000, title: { en: AWS data engineer, fr: Ingénieur data AWS } }
        - { xp: 5000, title: { en: Data lake legend, fr: Légende du lac de données } }
      mastery: { bronze: 650, silver: 700, gold: 850 }
      badges:
        hatTrick: { count: 3, min: 800 }
        regular: { weeks: 4 }
        comeback: { gain: 150 }


domains:
  - code: ingestion
    order: 1
    weight: { min: 0.34, max: 0.34 }
    title:
      en: Data Ingestion and Transformation
      fr: Ingestion et transformation des données
  - code: datastore
    order: 2
    weight: { min: 0.26, max: 0.26 }
    title:
      en: Data Store Management
      fr: Gestion des magasins de données
  - code: operations
    order: 3
    weight: { min: 0.22, max: 0.22 }
    title:
      en: Data Operations and Support
      fr: Opérations et support des données
  - code: governance
    order: 4
    weight: { min: 0.18, max: 0.18 }
    title:
      en: Data Security and Governance
      fr: Sécurité et gouvernance des données
