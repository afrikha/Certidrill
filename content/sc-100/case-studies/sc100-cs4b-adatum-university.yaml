id: sc100-cs4b-adatum-university
status: draft
title:
  en: Adatum University
  fr: Adatum University
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Adatum University is a public research university in the European Union. It has 32,000 students, 4,800 staff members and three campuses. Its research teams work with about 150 partner universities.

        The university's security budget was increased after an audit found inactive external accounts and research data reachable without authentication. The CISO asked you to recommend the security and compliance solutions for the next two years.
      fr: |
        Adatum University est une université de recherche publique de l'Union européenne. Elle compte 32 000 étudiants, 4 800 membres du personnel et trois campus. Ses équipes de recherche collaborent avec environ 150 universités partenaires.

        Le budget de sécurité de l'université a été augmenté après qu'un audit a constaté des comptes externes inactifs et des données de recherche accessibles sans authentification. Le RSSI vous a demandé de recommander les solutions de sécurité et de conformité pour les deux prochaines années.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Microsoft 365**

        - Staff members have Microsoft 365 A5 and Microsoft Entra ID Governance licenses. Students have Microsoft 365 A3 licenses.
        - Each research project has a team in Microsoft Teams. The principal investigator of the project is the owner of the team.
        - About 3,500 researchers of partner universities are B2B guest users in the project teams. Many of them haven't signed in for more than a year.
        - Email is filtered by a third-party email security gateway before it reaches Exchange Online. The Microsoft Defender for Office 365 policies are left at their default settings.

        **Azure**

        | Resource | Description |
        | --- | --- |
        | sql-sis | Azure SQL Database of the student information system: grades, identity documents, disability accommodations |
        | stresearch | Azure Data Lake Storage account that contains survey and health research datasets |
        | vm-alumni | Azure virtual machine that runs SQL Server with the alumni and donor database |

        - Research scripts access stresearch with the storage account access keys, which are shared in the scripts' configuration files.
        - Two containers of stresearch allow anonymous read access to blobs.
        - Microsoft Defender for Cloud has the Defender CSPM plan enabled on all subscriptions.

        **AI**

        - The university plans to give Microsoft 365 Copilot licenses to 1,000 staff members and to let departments build their own AI agents and applications.
        - Each department chooses its AI tools today, without common rules.
      fr: |
        **Microsoft 365**

        - Les membres du personnel disposent de licences Microsoft 365 A5 et Microsoft Entra ID Governance. Les étudiants disposent de licences Microsoft 365 A3.
        - Chaque projet de recherche dispose d'une équipe dans Microsoft Teams. Le chercheur principal du projet est le propriétaire de l'équipe.
        - Environ 3 500 chercheurs des universités partenaires sont des utilisateurs invités B2B dans les équipes des projets. Beaucoup d'entre eux ne se sont pas connectés depuis plus d'un an.
        - Les e-mails sont filtrés par une passerelle de sécurité de messagerie tierce avant d'atteindre Exchange Online. Les stratégies de Microsoft Defender for Office 365 sont conservées avec leurs paramètres par défaut.

        **Azure**

        | Ressource | Description |
        | --- | --- |
        | sql-sis | Base de données Azure SQL Database du système d'information des étudiants : notes, pièces d'identité, aménagements pour handicap |
        | stresearch | Compte Azure Data Lake Storage qui contient des jeux de données d'enquêtes et de recherche en santé |
        | vm-alumni | Machine virtuelle Azure qui exécute SQL Server avec la base de données des anciens élèves et des donateurs |

        - Les scripts de recherche accèdent à stresearch avec les clés d'accès du compte de stockage, partagées dans les fichiers de configuration des scripts.
        - Deux conteneurs de stresearch autorisent l'accès en lecture anonyme aux objets blob.
        - Le plan Defender CSPM de Microsoft Defender pour le cloud est activé sur tous les abonnements.

        **IA**

        - L'université prévoit d'attribuer des licences Microsoft 365 Copilot à 1 000 membres du personnel et de laisser les départements créer leurs propres agents et applications d'IA.
        - Aujourd'hui, chaque département choisit ses outils d'IA, sans règles communes.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **AI strategy requirements**

        - Define one AI adoption strategy for all departments that takes AI use cases from a plan to production, adapts the existing Azure landing zone to AI workloads, and sets common standards for AI workloads.
        - Departments must prefer the AI platform with the least operational responsibility that meets their needs.

        **Guest requirements**

        - Every quarter, the principal investigators must confirm each guest of their teams. The review must cover teams created later without additional configuration.
        - A guest who isn't confirmed, including when the principal investigator doesn't answer, must lose access automatically. The guest account must be deleted from the tenant 30 days later unless an administrator restores it.
        - Minimize administrative effort.

        **Posture reporting requirements**

        - Report to the board every quarter a posture metric for Microsoft 365 that shows the trend and compares the university with similar organizations.
        - The recommendations that the third-party email gateway already addresses must be reflected in the metric.

        **Compliance requirements**

        - Track the university's progress toward GDPR, with improvement actions assigned to owners.
        - Keep examination records stored in SharePoint Online for five years after their creation, and then delete them automatically.
        - Preserve the mailboxes and OneDrive accounts of six staff members involved in a legal dispute.
        - Detect harassing messages sent by staff members to students in Teams chats.

        **Data requirements**

        - The data protection officer needs a catalog that shows which columns and files of sql-sis, stresearch and the alumni database contain personal data, based on a full scan.
        - The security team must prioritize the attack paths that lead to the Azure data stores that contain personal data.
        - Research scripts must access stresearch with individual identities that can be revoked one by one, and no data in stresearch must be readable anonymously.
      fr: |
        **Exigences relatives à la stratégie d'IA**

        - Définir une stratégie d'adoption de l'IA unique pour tous les départements, qui fait passer les cas d'usage de l'IA d'un plan à la production, adapte la zone d'atterrissage Azure existante aux charges de travail d'IA et fixe des standards communs pour les charges de travail d'IA.
        - Les départements doivent privilégier la plateforme d'IA qui répond à leurs besoins avec la plus faible responsabilité opérationnelle.

        **Exigences relatives aux invités**

        - Chaque trimestre, les chercheurs principaux doivent confirmer chaque invité de leurs équipes. La révision doit couvrir les équipes créées ultérieurement sans configuration supplémentaire.
        - Un invité qui n'est pas confirmé, y compris quand le chercheur principal ne répond pas, doit perdre son accès automatiquement. Le compte invité doit être supprimé du locataire 30 jours plus tard, sauf si un administrateur le restaure.
        - Réduire au minimum l'effort administratif.

        **Exigences relatives au reporting de la posture**

        - Présenter au conseil d'administration, chaque trimestre, une métrique de posture pour Microsoft 365 qui montre la tendance et compare l'université à des organisations similaires.
        - Les recommandations que la passerelle de messagerie tierce traite déjà doivent être prises en compte dans la métrique.

        **Exigences relatives à la conformité**

        - Suivre la progression de l'université vers le RGPD, avec des actions d'amélioration attribuées à des propriétaires.
        - Conserver les dossiers d'examen stockés dans SharePoint Online pendant cinq ans après leur création, puis les supprimer automatiquement.
        - Préserver les boîtes aux lettres et les comptes OneDrive de six membres du personnel impliqués dans un litige.
        - Détecter les messages de harcèlement envoyés par des membres du personnel à des étudiants dans les conversations Teams.

        **Exigences relatives aux données**

        - Le délégué à la protection des données a besoin d'un catalogue qui montre quelles colonnes et quels fichiers de sql-sis, de stresearch et de la base de données des anciens élèves contiennent des données personnelles, d'après une analyse complète.
        - L'équipe de sécurité doit hiérarchiser les chemins d'attaque qui mènent aux magasins de données Azure contenant des données personnelles.
        - Les scripts de recherche doivent accéder à stresearch avec des identités individuelles révocables une par une, et aucune donnée de stresearch ne doit être lisible de façon anonyme.
