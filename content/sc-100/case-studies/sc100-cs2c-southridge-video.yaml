id: sc100-cs2c-southridge-video
status: draft
title:
  en: Southridge Video
  fr: Southridge Video
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Southridge Video produces television series and documentaries for streaming platforms. The company has 2,500 employees in Montreal and Vancouver and works with about 600 freelance editors, translators and composers.

        Southridge Video is rolling out Microsoft 365 Copilot and AI agents to its employees, and it plans to sell licenses for its archive footage to partner broadcasters through an API. A leak of an unreleased episode last year led the board to require stronger controls over unreleased content.
      fr: |
        Southridge Video produit des séries télévisées et des documentaires pour des plateformes de diffusion en continu. La société compte 2 500 employés à Montréal et à Vancouver et travaille avec environ 600 monteurs, traducteurs et compositeurs indépendants.

        Southridge Video déploie Microsoft 365 Copilot et des agents IA auprès de ses employés, et prévoit de vendre des licences d'utilisation de ses images d'archives à des diffuseurs partenaires au moyen d'une API. La fuite d'un épisode non diffusé l'année dernière a conduit le conseil d'administration à exiger des contrôles plus stricts sur les contenus non diffusés.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity and licenses**

        All the employees have cloud-only accounts in a Microsoft Entra tenant named southridgevideo.com and Microsoft 365 E7 licenses. The Windows and macOS devices of the employees are enrolled in Microsoft Intune. Most freelancers belong to partner studios that have their own Microsoft Entra tenants and use Microsoft 365 Copilot. The other freelancers use personal email addresses that aren't associated with any Microsoft Entra tenant or Microsoft account. Project managers invite freelancers as guests to Teams teams.

        **Archive datacenter**

        The footage archive is stored in a datacenter in Montreal on Windows file servers that expose SMB shares. A web-based media asset manager that runs on the same network indexes the footage. Employees reach both systems through a VPN that gives access to the whole datacenter network.

        **Sensitivity labels**

        Microsoft Purview sensitivity labels are published to all the employees. Scripts and edit decision lists of episodes that are not released yet are labeled **Highly Confidential\Unreleased**. This label encrypts the content and grants the Co-Author permissions to the production team and to the freelancers of the project. The scripts are shared with the freelancers, who open them in the Office apps of their own studios.

        **AI agents**

        Producers create agents in Microsoft Copilot Studio that read the script library and the production calendar. Each agent gets an agent identity in the Microsoft Entra tenant. Some agents work autonomously, others act on behalf of the signed-in producer, and two agents that send emails use agent user accounts.

        **Licensing API**

        Developers are building a REST API, hosted in Azure App Service, that partner broadcasters will call to search the archive and license footage.
      fr: |
        **Identité et licences**

        Tous les employés disposent de comptes cloud uniquement dans un locataire Microsoft Entra nommé southridgevideo.com et de licences Microsoft 365 E7. Les appareils Windows et macOS des employés sont inscrits dans Microsoft Intune. La plupart des indépendants appartiennent à des studios partenaires qui ont leurs propres locataires Microsoft Entra et utilisent Microsoft 365 Copilot. Les autres indépendants utilisent des adresses e-mail personnelles qui ne sont associées à aucun locataire Microsoft Entra ni à aucun compte Microsoft. Les chefs de projet invitent les indépendants comme invités dans des équipes Teams.

        **Centre de données des archives**

        Les archives d'images sont stockées dans un centre de données à Montréal, sur des serveurs de fichiers Windows qui exposent des partages SMB. Un gestionnaire de ressources multimédias web qui s'exécute sur le même réseau indexe les images. Les employés accèdent aux deux systèmes par un VPN qui donne accès à tout le réseau du centre de données.

        **Étiquettes de confidentialité**

        Des étiquettes de confidentialité Microsoft Purview sont publiées pour tous les employés. Les scripts et les listes de décisions de montage des épisodes qui ne sont pas encore diffusés portent l'étiquette **Highly Confidential\Unreleased**. Cette étiquette chiffre le contenu et accorde les autorisations Co-Author à l'équipe de production et aux indépendants du projet. Les scripts sont partagés avec les indépendants, qui les ouvrent dans les applications Office de leurs propres studios.

        **Agents IA**

        Les producteurs créent dans Microsoft Copilot Studio des agents qui lisent la bibliothèque de scripts et le calendrier de production. Chaque agent obtient une identité d'agent dans le locataire Microsoft Entra. Certains agents travaillent de façon autonome, d'autres agissent pour le compte du producteur connecté, et deux agents qui envoient des e-mails utilisent des comptes d'utilisateur d'agent.

        **API de licences**

        Les développeurs créent une API REST, hébergée dans Azure App Service, que les diffuseurs partenaires appelleront pour rechercher dans les archives et acquérir des licences d'utilisation d'images.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Access requirements**

        - The VPN must be retired. Employees must reach only the file shares and the media asset manager of the archive datacenter, not the whole network, and each access must be evaluated by Conditional Access.
        - Southridge Video must accept the multifactor authentication that guest freelancers perform in the tenants of their studios.
        - The sound engineers of Fabrikam Studios, a partner studio, must work with Southridge employees in Teams shared channels from their own Teams client, without guest accounts in the southridgevideo.com tenant.
        - The freelancers who use personal email addresses must sign in without creating a password or an account with any identity provider.
        - Before a translator gets access to unreleased episodes, the translator must prove an accreditation that the Screen Translators Guild issues to its members as a digital credential.

        **AI requirements**

        - No instance of Microsoft 365 Copilot, in the southridgevideo.com tenant or in the tenant of a partner studio, must return content from the scripts labeled **Highly Confidential\Unreleased**. The production team and the freelancers must still be able to open, edit and save the scripts; they don't need to copy text from them.
        - The security team must control the access of agents to Microsoft Entra-protected resources by using Conditional Access, including the access of the agent user accounts. New agents must be covered without updating the policies.

        **API requirements**

        - Partner broadcasters must authenticate by using OAuth 2.0 access tokens issued by the southridgevideo.com tenant, and requests without a valid token must be rejected before they reach App Service.
        - Each partner must be limited to a number of calls per minute.
        - Requests must be inspected for common web exploits, such as SQL injection, before they reach the API gateway.
      fr: |
        **Exigences d'accès**

        - Le VPN doit être retiré. Les employés ne doivent atteindre que les partages de fichiers et le gestionnaire de ressources multimédias du centre de données des archives, pas tout le réseau, et chaque accès doit être évalué par l'accès conditionnel.
        - Southridge Video doit accepter l'authentification multifacteur que les indépendants invités effectuent dans les locataires de leurs studios.
        - Les ingénieurs du son de Fabrikam Studios, un studio partenaire, doivent travailler avec les employés de Southridge dans des canaux partagés Teams depuis leur propre client Teams, sans compte invité dans le locataire southridgevideo.com.
        - Les indépendants qui utilisent des adresses e-mail personnelles doivent se connecter sans créer de mot de passe ni de compte auprès d'un fournisseur d'identité.
        - Avant d'obtenir l'accès aux épisodes non diffusés, un traducteur doit prouver une accréditation que la Screen Translators Guild délivre à ses membres sous forme d'information d'identification numérique.

        **Exigences relatives à l'IA**

        - Aucune instance de Microsoft 365 Copilot, dans le locataire southridgevideo.com ou dans le locataire d'un studio partenaire, ne doit renvoyer de contenu des scripts qui portent l'étiquette **Highly Confidential\Unreleased**. L'équipe de production et les indépendants doivent toujours pouvoir ouvrir, modifier et enregistrer les scripts ; ils n'ont pas besoin d'en copier du texte.
        - L'équipe de sécurité doit contrôler l'accès des agents aux ressources protégées par Microsoft Entra au moyen de l'accès conditionnel, y compris l'accès des comptes d'utilisateur d'agent. Les nouveaux agents doivent être couverts sans modifier les stratégies.

        **Exigences relatives à l'API**

        - Les diffuseurs partenaires doivent s'authentifier avec des jetons d'accès OAuth 2.0 émis par le locataire southridgevideo.com, et les requêtes sans jeton valide doivent être rejetées avant d'atteindre App Service.
        - Chaque partenaire doit être limité à un nombre d'appels par minute.
        - Les requêtes doivent être inspectées pour détecter les attaques web courantes, comme l'injection SQL, avant d'atteindre la passerelle d'API.
