id: sc100-cs4a-blue-yonder-airlines
status: draft
title:
  en: Blue Yonder Airlines
  fr: Blue Yonder Airlines
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Blue Yonder Airlines is a regional airline that operates 70 aircraft from two hubs in Brussels and Lisbon. It has 5,800 employees, including 2,400 pilots and cabin crew members, and offices at 25 airports.

        After a ransomware attack grounded a competitor for four days, the board approved a Zero Trust program. The CISO asked you to design the program and the first security initiatives.
      fr: |
        Blue Yonder Airlines est une compagnie aérienne régionale qui exploite 70 avions depuis deux hubs, à Bruxelles et à Lisbonne. Elle compte 5 800 employés, dont 2 400 pilotes et membres d'équipage de cabine, et des bureaux dans 25 aéroports.

        Après qu'une attaque par rançongiciel a cloué au sol un concurrent pendant quatre jours, le conseil d'administration a approuvé un programme Confiance Zéro. Le RSSI vous a demandé de concevoir ce programme et les premières initiatives de sécurité.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity**

        An on-premises Active Directory Domain Services (AD DS) forest is synchronized to a Microsoft Entra tenant by Microsoft Entra Connect Sync. All employees have Microsoft 365 E5 and Microsoft Intune Suite licenses.

        The 40 members of the **IT-Ops** group are members of Domain Admins. They use the same accounts to read email, to manage the domain controllers, to patch servers and to manage the Azure subscriptions and the AWS accounts.

        **Conditional Access**

        | Policy | Users | Target resources | Conditions | Control |
        | --- | --- | --- | --- | --- |
        | CA01 | All users, except the **Crew-Travel** group (2,400 users, excluded "temporarily" since 2025) | Office 365 | None | Require multifactor authentication |
        | CA02 | All users, except the two emergency access accounts | All resources | Client apps: legacy authentication clients | Block access |
        | CA03 | All users | All resources | Locations: all locations except **HQ-Networks**, a named location marked as trusted | Require multifactor authentication |

        Sign-ins from HQ-Networks don't require multifactor authentication.

        **Workloads**

        - **CrewPlan**, the crew scheduling application, runs on Windows and Linux Amazon EC2 instances in three AWS accounts of an AWS organization. An organization trail in the management account delivers the AWS CloudTrail logs of all the accounts to one Amazon S3 bucket.
        - **MaintTrack**, the aircraft maintenance records application, runs on 30 Linux servers in the Brussels datacenter.
        - **FlightStatus** is an API in Azure that the systems of four codeshare partner airlines call to read flight status.

        **Security operations**

        The SOC uses Microsoft Defender XDR and Microsoft Sentinel in the Microsoft Defender portal. Microsoft Defender for Cloud is enabled only on the Azure subscriptions. The AWS accounts and the Brussels servers aren't monitored.

        **Devices and internet access**

        - Office employees use Windows laptops managed by Intune.
        - Each airport office has two to four Windows check-in kiosks that run only the check-in app. They aren't assigned to a user, have a TPM 2.0 chip and are connected by Ethernet. Local technicians reinstall them manually from a USB image.
        - Maintenance engineers use Windows laptops. A vendor's engine diagnostic tool requires administrative rights, so all 300 engineers are local administrators of their laptops.
        - Internet traffic from the Brussels head office goes through an on-premises web proxy. Airport offices and crew members on layover in hotels access the internet directly.
      fr: |
        **Identité**

        Une forêt Active Directory Domain Services (AD DS) locale est synchronisée avec un locataire Microsoft Entra par Microsoft Entra Connect Sync. Tous les employés disposent de licences Microsoft 365 E5 et Microsoft Intune Suite.

        Les 40 membres du groupe **IT-Ops** sont membres de Domain Admins. Ils utilisent les mêmes comptes pour lire leurs e-mails, gérer les contrôleurs de domaine, appliquer les correctifs aux serveurs et gérer les abonnements Azure et les comptes AWS.

        **Accès conditionnel**

        | Stratégie | Utilisateurs | Ressources cibles | Conditions | Contrôle |
        | --- | --- | --- | --- | --- |
        | CA01 | Tous les utilisateurs, sauf le groupe **Crew-Travel** (2 400 utilisateurs, exclus « temporairement » depuis 2025) | Office 365 | Aucune | Exiger l'authentification multifacteur |
        | CA02 | Tous les utilisateurs, sauf les deux comptes d'accès d'urgence | Toutes les ressources | Applications clientes : clients d'authentification hérités | Bloquer l'accès |
        | CA03 | Tous les utilisateurs | Toutes les ressources | Emplacements : tous les emplacements sauf **HQ-Networks**, un emplacement nommé marqué comme approuvé | Exiger l'authentification multifacteur |

        Les connexions depuis HQ-Networks n'exigent pas d'authentification multifacteur.

        **Charges de travail**

        - **CrewPlan**, l'application de planification des équipages, s'exécute sur des instances Amazon EC2 Windows et Linux dans trois comptes AWS d'une organisation AWS. Un journal de suivi d'organisation (organization trail) dans le compte de gestion envoie les journaux AWS CloudTrail de tous les comptes vers un seul compartiment Amazon S3.
        - **MaintTrack**, l'application des dossiers de maintenance des avions, s'exécute sur 30 serveurs Linux dans le centre de données de Bruxelles.
        - **FlightStatus** est une API dans Azure que les systèmes de quatre compagnies partenaires en partage de codes appellent pour lire le statut des vols.

        **Opérations de sécurité**

        Le SOC utilise Microsoft Defender XDR et Microsoft Sentinel dans le portail Microsoft Defender. Microsoft Defender pour le cloud n'est activé que sur les abonnements Azure. Les comptes AWS et les serveurs de Bruxelles ne sont pas surveillés.

        **Appareils et accès à Internet**

        - Les employés de bureau utilisent des ordinateurs portables Windows gérés par Intune.
        - Chaque bureau d'aéroport dispose de deux à quatre bornes d'enregistrement Windows qui n'exécutent que l'application d'enregistrement. Elles ne sont attribuées à aucun utilisateur, disposent d'une puce TPM 2.0 et sont connectées par Ethernet. Les techniciens locaux les réinstallent manuellement à partir d'une image USB.
        - Les ingénieurs de maintenance utilisent des ordinateurs portables Windows. L'outil de diagnostic moteur d'un fournisseur exige des droits d'administration : les 300 ingénieurs sont donc administrateurs locaux de leurs ordinateurs portables.
        - Le trafic Internet du siège de Bruxelles passe par un proxy web local. Les bureaux d'aéroport et les membres d'équipage en escale à l'hôtel accèdent directement à Internet.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Zero Trust program requirements**

        - Business leaders must sponsor the program, and each initiative must be tied to a business outcome.
        - The first initiative must let pilots and cabin crew members work securely from airports, hotels and home.

        **Privileged access requirements**

        - Redesign administrative access by following the enterprise access model.
        - An administrator of the servers or of the cloud accounts must never be able to take control of the identity systems.

        **Conditional Access requirements**

        - Validate the existing policies against the Zero Trust principles before new policies are added.

        **Monitoring requirements**

        - The CrewPlan instances and the MaintTrack servers must send their security events to Microsoft Sentinel by using the same agent and centrally managed collection rules.
        - The CloudTrail logs of all the AWS accounts must be ingested into Microsoft Sentinel.
        - The security posture of all current and future AWS accounts of the organization must be assessed in Defender for Cloud.

        **Web access requirements**

        - Block the Gambling and Peer-to-peer web categories for all users, wherever they work.
        - Members of the **Fraud-Investigations** group must keep access to gambling sites. They use the same shared workstations as other revenue analysts.
        - Decommission the on-premises web proxy.

        **Device requirements**

        - Check-in kiosks must be provisioned without a technician on site and without a user typing credentials, and must run only the check-in app.
        - Maintenance engineers must stop being local administrators but must still run the diagnostic tool.
      fr: |
        **Exigences relatives au programme Confiance Zéro**

        - Les responsables métier doivent parrainer le programme, et chaque initiative doit être liée à un résultat métier.
        - La première initiative doit permettre aux pilotes et aux membres d'équipage de cabine de travailler de façon sécurisée depuis les aéroports, les hôtels et leur domicile.

        **Exigences relatives à l'accès privilégié**

        - Repenser l'accès administratif en suivant le modèle d'accès d'entreprise.
        - Un administrateur des serveurs ou des comptes cloud ne doit jamais pouvoir prendre le contrôle des systèmes d'identité.

        **Exigences relatives à l'accès conditionnel**

        - Valider les stratégies existantes par rapport aux principes de la Confiance Zéro avant d'ajouter de nouvelles stratégies.

        **Exigences relatives à la surveillance**

        - Les instances CrewPlan et les serveurs MaintTrack doivent envoyer leurs événements de sécurité à Microsoft Sentinel avec le même agent et des règles de collecte gérées de façon centralisée.
        - Les journaux CloudTrail de tous les comptes AWS doivent être ingérés dans Microsoft Sentinel.
        - La posture de sécurité de tous les comptes AWS actuels et futurs de l'organisation doit être évaluée dans Defender pour le cloud.

        **Exigences relatives à l'accès web**

        - Bloquer les catégories web Gambling et Peer-to-peer pour tous les utilisateurs, où qu'ils travaillent.
        - Les membres du groupe **Fraud-Investigations** doivent conserver l'accès aux sites de jeux d'argent. Ils utilisent les mêmes postes de travail partagés que les autres analystes des recettes.
        - Mettre hors service le proxy web local.

        **Exigences relatives aux appareils**

        - Les bornes d'enregistrement doivent être provisionnées sans technicien sur place et sans qu'un utilisateur saisisse des informations d'identification, et ne doivent exécuter que l'application d'enregistrement.
        - Les ingénieurs de maintenance ne doivent plus être administrateurs locaux, mais doivent toujours pouvoir exécuter l'outil de diagnostic.
