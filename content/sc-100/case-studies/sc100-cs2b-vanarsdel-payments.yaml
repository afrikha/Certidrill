id: sc100-cs2b-vanarsdel-payments
status: draft
title:
  en: VanArsdel Payments
  fr: VanArsdel Payments
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        VanArsdel Payments is a payment service provider that processes card payments for 6,000 online merchants. The company has 900 employees in Dublin and Warsaw.

        VanArsdel Payments grew by acquiring two companies, and its workloads now run on Azure, Amazon Web Services (AWS) and Google Cloud Platform (GCP). The company must renew its PCI DSS certification in six months, and the chief information security officer (CISO) wants one security posture program for the three clouds.
      fr: |
        VanArsdel Payments est un prestataire de services de paiement qui traite les paiements par carte de 6 000 commerçants en ligne. La société compte 900 employés à Dublin et à Varsovie.

        VanArsdel Payments s'est développée en rachetant deux sociétés, et ses charges de travail s'exécutent désormais sur Azure, Amazon Web Services (AWS) et Google Cloud Platform (GCP). La société doit renouveler sa certification PCI DSS dans six mois, et le responsable de la sécurité des systèmes d'information (RSSI) veut un seul programme de posture de sécurité pour les trois clouds.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity and development**

        All the employees have cloud-only accounts in a Microsoft Entra tenant. The developers use GitHub Enterprise Cloud.

        **Cloud environments**

        | Cloud | Resources |
        | --- | --- |
        | Azure | A management group named **MG-VanArsdel** that contains two subscriptions. The merchant portal runs on Azure App Service and uses Azure SQL Database. |
        | AWS | An AWS organization of 12 accounts. The payment API runs on two Amazon Elastic Kubernetes Service (EKS) clusters, and its container images are stored in Amazon Elastic Container Registry (ECR). The accounts contain about 400 IAM roles created by different teams over several years. |
        | GCP | A project named **gcp-analytics** that contains Compute Engine virtual machines and BigQuery datasets used for fraud analytics. |

        **Security tooling**

        Microsoft Defender for Cloud is used only on the Azure subscriptions, with the foundational cloud security posture management (CSPM) capabilities. No AWS account or GCP project is connected to Defender for Cloud.

        **Deployment pipeline**

        GitHub Actions workflows deploy the merchant portal to Azure by using a service principal. Its client secret is stored as a GitHub repository secret. Last year, the secret was exposed in a workflow log and had to be rotated.
      fr: |
        **Identité et développement**

        Tous les employés disposent de comptes cloud uniquement dans un locataire Microsoft Entra. Les développeurs utilisent GitHub Enterprise Cloud.

        **Environnements cloud**

        | Cloud | Ressources |
        | --- | --- |
        | Azure | Un groupe d'administration nommé **MG-VanArsdel** qui contient deux abonnements. Le portail des commerçants s'exécute sur Azure App Service et utilise Azure SQL Database. |
        | AWS | Une organisation AWS de 12 comptes. L'API de paiement s'exécute sur deux clusters Amazon Elastic Kubernetes Service (EKS), et ses images de conteneur sont stockées dans Amazon Elastic Container Registry (ECR). Les comptes contiennent environ 400 rôles IAM créés par différentes équipes au fil des années. |
        | GCP | Un projet nommé **gcp-analytics** qui contient des machines virtuelles Compute Engine et des jeux de données BigQuery utilisés pour l'analyse de la fraude. |

        **Outils de sécurité**

        Microsoft Defender for Cloud est utilisé uniquement sur les abonnements Azure, avec les fonctionnalités de gestion de la posture de sécurité cloud (CSPM) de base. Aucun compte AWS ni projet GCP n'est connecté à Defender for Cloud.

        **Pipeline de déploiement**

        Des workflows GitHub Actions déploient le portail des commerçants sur Azure en utilisant un principal de service. Son secret client est stocké comme secret de dépôt GitHub. L'année dernière, le secret est apparu dans un journal de workflow et a dû être renouvelé.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Posture management requirements**

        - The security team must assess the posture of Azure, AWS and GCP from Defender for Cloud and use attack path analysis to find how an internet-exposed workload could reach payment data.
        - No agent can be installed on the virtual machines or the EKS nodes for the posture assessment.
        - The security team must identify the Microsoft Entra service principals, AWS IAM roles and GCP service accounts that hold permissions they don't use, and get recommendations to right-size them.
        - The security team must explain to the board how the secure score in Defender for Cloud relates to the Microsoft Secure Score that it already reports for Microsoft 365.

        **Compliance requirements**

        - The auditors require a downloadable report that shows the status of the PCI DSS v4.0.1 controls for the Azure subscriptions, the AWS accounts and the GCP project.

        **Workload requirements**

        - Runtime threats on the EKS clusters must be detected, and the images in Amazon ECR must be assessed for vulnerabilities.
        - The GitHub Actions workflows must deploy to Azure without any stored secret or certificate.

        **General requirements**

        - The solution must minimize the number of new security products. VanArsdel Payments prefers capabilities of Defender for Cloud.
      fr: |
        **Exigences de gestion de la posture**

        - L'équipe de sécurité doit évaluer la posture d'Azure, d'AWS et de GCP depuis Defender for Cloud et utiliser l'analyse du chemin d'attaque pour découvrir comment une charge de travail exposée sur Internet pourrait atteindre les données de paiement.
        - Aucun agent ne peut être installé sur les machines virtuelles ni sur les nœuds EKS pour l'évaluation de la posture.
        - L'équipe de sécurité doit identifier les principaux de service Microsoft Entra, les rôles IAM AWS et les comptes de service GCP qui détiennent des autorisations qu'ils n'utilisent pas, et obtenir des recommandations pour les ajuster.
        - L'équipe de sécurité doit expliquer au conseil d'administration le rapport entre le degré de sécurisation de Defender for Cloud et le Niveau de sécurité Microsoft qu'elle présente déjà pour Microsoft 365.

        **Exigences de conformité**

        - Les auditeurs exigent un rapport téléchargeable qui montre l'état des contrôles PCI DSS v4.0.1 pour les abonnements Azure, les comptes AWS et le projet GCP.

        **Exigences relatives aux charges de travail**

        - Les menaces à l'exécution sur les clusters EKS doivent être détectées, et les images d'Amazon ECR doivent être évaluées pour détecter les vulnérabilités.
        - Les workflows GitHub Actions doivent déployer sur Azure sans aucun secret ni certificat stocké.

        **Exigences générales**

        - La solution doit réduire au minimum le nombre de nouveaux produits de sécurité. VanArsdel Payments privilégie les fonctionnalités de Defender for Cloud.
