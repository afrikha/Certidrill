id: sc100-cs3b-fabrikam-freight
status: draft
title:
  en: Fabrikam Freight
  fr: Fabrikam Freight
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Fabrikam Freight is a logistics company that operates warehouses and truck fleets in 11 countries. Its head office and its main datacenter are in Rotterdam.

        Fabrikam recently acquired Proseware Couriers, a parcel delivery company. The IT teams of Proseware will be merged into Fabrikam over the next two years. Fabrikam wants to manage the security of all its servers and identities from Microsoft cloud services.
      fr: |
        Fabrikam Freight est une entreprise de logistique qui exploite des entrepôts et des flottes de camions dans 11 pays. Son siège et son centre de données principal se trouvent à Rotterdam.

        Fabrikam a récemment racheté Proseware Couriers, une entreprise de livraison de colis. Les équipes informatiques de Proseware seront intégrées à Fabrikam au cours des deux prochaines années. Fabrikam souhaite gérer la sécurité de tous ses serveurs et de toutes ses identités à partir des services cloud de Microsoft.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity**

        - Fabrikam has a Microsoft Entra tenant named fabrikamfreight.com. All users have Microsoft Entra ID P2 licenses.
        - Fabrikam has an AD DS forest named fabrikam.local. Proseware has an AD DS forest named proseware.local. Proseware has no Microsoft Entra tenant.
        - There is no network connectivity and no trust between the two forests. The legal team forbids connecting them until the merger is complete.
        - No directory synchronization is configured yet.
        - The Security Administrator, Conditional Access Administrator and Global Administrator roles are held by 14 administrators. All these roles are assigned as eligible assignments in Microsoft Entra Privileged Identity Management (PIM).

        **Servers**

        | Location | Servers |
        | --- | --- |
        | Rotterdam datacenter | 220 Windows Server and Red Hat Enterprise Linux servers |
        | AWS | 90 Amazon EC2 instances in an AWS account named **aws-tracking** |
        | GCP | 40 Compute Engine VMs in a GCP project named **gcp-routing** |
        | Azure | 60 Azure virtual machines in a subscription named **Sub-Core** |

        The DevOps teams create and delete EC2 instances and Compute Engine VMs every week. aws-tracking and gcp-routing are connected to Microsoft Defender for Cloud by using the native connectors. Defender for Servers Plan 2 is enabled on Sub-Core and on both connectors.

        Each team patches its own servers with its own tools. A recent ransomware incident started on a Linux server that was missing a security update for eight months.

        **Proseware**

        Proseware runs its customer-facing websites from several hosting providers. Its IT team left before the acquisition, and nobody at Fabrikam has a full list of the domains, hosts and IP address ranges that Proseware exposes to the internet.
      fr: |
        **Identité**

        - Fabrikam dispose d'un locataire Microsoft Entra nommé fabrikamfreight.com. Tous les utilisateurs disposent de licences Microsoft Entra ID P2.
        - Fabrikam dispose d'une forêt AD DS nommée fabrikam.local. Proseware dispose d'une forêt AD DS nommée proseware.local. Proseware n'a pas de locataire Microsoft Entra.
        - Il n'existe ni connectivité réseau ni approbation entre les deux forêts. L'équipe juridique interdit de les connecter tant que la fusion n'est pas terminée.
        - Aucune synchronisation d'annuaire n'est encore configurée.
        - Les rôles Security Administrator, Conditional Access Administrator et Global Administrator sont détenus par 14 administrateurs. Tous ces rôles sont attribués sous forme d'attributions éligibles dans Microsoft Entra Privileged Identity Management (PIM).

        **Serveurs**

        | Emplacement | Serveurs |
        | --- | --- |
        | Centre de données de Rotterdam | 220 serveurs Windows Server et Red Hat Enterprise Linux |
        | AWS | 90 instances Amazon EC2 dans un compte AWS nommé **aws-tracking** |
        | GCP | 40 machines virtuelles Compute Engine dans un projet GCP nommé **gcp-routing** |
        | Azure | 60 machines virtuelles Azure dans un abonnement nommé **Sub-Core** |

        Les équipes DevOps créent et suppriment des instances EC2 et des machines virtuelles Compute Engine chaque semaine. aws-tracking et gcp-routing sont connectés à Microsoft Defender pour le cloud avec les connecteurs natifs. Defender for Servers Plan 2 est activé sur Sub-Core et sur les deux connecteurs.

        Chaque équipe applique les correctifs de ses propres serveurs avec ses propres outils. Un incident récent de rançongiciel a commencé sur un serveur Linux auquel il manquait une mise à jour de sécurité depuis huit mois.

        **Proseware**

        Proseware exploite ses sites web destinés aux clients chez plusieurs hébergeurs. Son équipe informatique est partie avant le rachat, et personne chez Fabrikam ne dispose de la liste complète des domaines, des hôtes et des plages d'adresses IP que Proseware expose sur Internet.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Server management requirements**

        - All the servers must be represented as Azure resources so that Azure Policy and Azure role-based access control (Azure RBAC) apply to them.
        - EC2 instances and Compute Engine VMs created in the future must be onboarded automatically.

        **Security update requirements**

        - Every server, whatever its location and operating system, must be assessed for missing updates every 24 hours.
        - Updates must be installed during maintenance windows that Fabrikam defines, from a single service.

        **Identity requirements**

        - The users of both forests must be synchronized to fabrikamfreight.com.
        - The synchronization configuration must be managed from the Microsoft Entra admin center, and the synchronization must continue if one on-premises server fails.

        **Administration requirements**

        - Any administrator who creates, changes or deletes a Conditional Access policy, or who permanently deletes a directory object, must satisfy a phishing-resistant MFA policy at the time of the action, whatever role grants the permission.
        - Administrators must not be prompted for this policy when they sign in or perform other tasks.

        **Exposure requirements**

        - Fabrikam must build and maintain an inventory of the internet-facing assets of Proseware, including the assets that nobody knows about, starting from the Proseware domain names.
        - The discovery must not require any agent or any access to the Proseware networks or hosting accounts.

        **General requirements**

        - Minimize administrative effort.
      fr: |
        **Exigences relatives à la gestion des serveurs**

        - Tous les serveurs doivent être représentés sous forme de ressources Azure pour qu'Azure Policy et le contrôle d'accès en fonction du rôle Azure (Azure RBAC) s'y appliquent.
        - Les instances EC2 et les machines virtuelles Compute Engine créées à l'avenir doivent être intégrées automatiquement.

        **Exigences relatives aux mises à jour de sécurité**

        - Chaque serveur, quels que soient son emplacement et son système d'exploitation, doit être évalué toutes les 24 heures pour détecter les mises à jour manquantes.
        - Les mises à jour doivent être installées pendant des fenêtres de maintenance définies par Fabrikam, à partir d'un service unique.

        **Exigences relatives aux identités**

        - Les utilisateurs des deux forêts doivent être synchronisés vers fabrikamfreight.com.
        - La configuration de la synchronisation doit être gérée à partir du centre d'administration Microsoft Entra, et la synchronisation doit continuer si un serveur local tombe en panne.

        **Exigences relatives à l'administration**

        - Tout administrateur qui crée, modifie ou supprime une stratégie d'accès conditionnel, ou qui supprime définitivement un objet d'annuaire, doit satisfaire une stratégie d'authentification multifacteur résistante au hameçonnage au moment de l'action, quel que soit le rôle qui lui accorde l'autorisation.
        - Les administrateurs ne doivent pas être invités à satisfaire cette stratégie lors de leur connexion ou quand ils effectuent d'autres tâches.

        **Exigences relatives à l'exposition**

        - Fabrikam doit constituer et tenir à jour un inventaire des ressources de Proseware exposées sur Internet, y compris celles que personne ne connaît, à partir des noms de domaine de Proseware.
        - La découverte ne doit nécessiter aucun agent ni aucun accès aux réseaux ou aux comptes d'hébergement de Proseware.

        **Exigences générales**

        - Réduire au minimum l'effort d'administration.
