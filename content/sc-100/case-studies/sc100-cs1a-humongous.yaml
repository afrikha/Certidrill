id: sc100-cs1a-humongous
status: draft
title:
  en: Humongous Insurance
  fr: Humongous Insurance
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Humongous Insurance is a property and casualty insurer that has 6,500 employees in Canada and France. Policies are sold by employees and by independent brokers.

        Humongous is opening a new partner portal for brokers. The chief information security officer (CISO) asks you to design the identity, access and data protection controls before the portal goes into production.
      fr: |
        Humongous Insurance est un assureur de dommages qui compte 6 500 employés au Canada et en France. Les contrats sont vendus par des employés et par des courtiers indépendants.

        Humongous ouvre un nouveau portail partenaires pour les courtiers. Le responsable de la sécurité des systèmes d'information (RSSI) vous demande de concevoir les contrôles d'identité, d'accès et de protection des données avant la mise en production du portail.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity and devices**

        Humongous has a Microsoft Entra tenant named humongousins.com that is synchronized with an on-premises Active Directory Domain Services (AD DS) forest. All the employees have Microsoft 365 E5 licenses. The employees use Windows 11 laptops that are Microsoft Entra joined and managed by Microsoft Intune. The Global Secure Access client is installed on every laptop, but no traffic forwarding profile is enabled.

        Twelve Azure administrators have a permanent Owner role assignment on an Azure subscription named **Sub-Claims**. Five identity administrators hold the Conditional Access Administrator or Security Administrator role and manage the Conditional Access policies and the cross-tenant access settings.

        **Applications and data**

        | Resource | Description |
        | --- | --- |
        | app-claims | Azure App Service web app that hosts the claims portal |
        | sqldb-claims | Azure SQL Database used by app-claims. The **Policyholders** table contains the **NationalId** and **BankIban** columns. Transparent data encryption uses the default service-managed key. |
        | Broker Hub | A Microsoft Teams team, a SharePoint site and the **app-broker** enterprise application used by brokers |

        The database administrators of sqldb-claims are employees of Litware Managed Services, an outsourcing company.

        **Partners**

        - Brokers from 140 brokerages are invited as B2B guest users. Today, administrators add them manually to the Broker Hub resources, and the accounts are never removed.
        - Humongous actuaries also use accounts in the tenant of the reinsurer Adatum Re (adatumre.com).
      fr: |
        **Identité et appareils**

        Humongous dispose d'un locataire Microsoft Entra nommé humongousins.com, synchronisé avec une forêt Active Directory Domain Services (AD DS) locale. Tous les employés disposent de licences Microsoft 365 E5. Les employés utilisent des ordinateurs portables Windows 11 joints à Microsoft Entra et gérés par Microsoft Intune. Le client Global Secure Access est installé sur chaque ordinateur portable, mais aucun profil de transfert du trafic n'est activé.

        Douze administrateurs Azure ont une attribution permanente du rôle Owner sur un abonnement Azure nommé **Sub-Claims**. Cinq administrateurs d'identité détiennent le rôle Conditional Access Administrator ou Security Administrator et gèrent les stratégies d'accès conditionnel et les paramètres d'accès interlocataire.

        **Applications et données**

        | Ressource | Description |
        | --- | --- |
        | app-claims | Application web Azure App Service qui héberge le portail des sinistres |
        | sqldb-claims | Base de données Azure SQL Database utilisée par app-claims. La table **Policyholders** contient les colonnes **NationalId** et **BankIban**. Le chiffrement transparent des données utilise la clé gérée par le service par défaut. |
        | Broker Hub | Une équipe Microsoft Teams, un site SharePoint et l'application d'entreprise **app-broker** utilisés par les courtiers |

        Les administrateurs de bases de données de sqldb-claims sont des employés de Litware Managed Services, une société d'infogérance.

        **Partenaires**

        - Les courtiers de 140 cabinets de courtage sont invités comme utilisateurs invités B2B. Aujourd'hui, les administrateurs les ajoutent manuellement aux ressources de Broker Hub, et les comptes ne sont jamais supprimés.
        - Les actuaires de Humongous utilisent aussi des comptes dans le locataire du réassureur Adatum Re (adatumre.com).
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Partner requirements**

        - Brokers must request access to all the Broker Hub resources in a single request. A partner manager approves each request, and the access expires after 180 days.
        - Every quarter, the partner managers must confirm that each broker still needs access.

        **Privileged access requirements**

        - The Owner role on Sub-Claims must be used only when needed, for a limited time and after approval.
        - Before an administrator creates, updates or deletes a Conditional Access policy or changes a partner in the cross-tenant access settings, the administrator must sign in again with a phishing-resistant method, whatever role grants the permission. Other administrative tasks must not trigger this prompt.

        **Network requirements**

        - On the company laptops, users must be able to sign in only with accounts from humongousins.com and adatumre.com, including when they work from home or from hotels. Humongous does not want to route traffic through a corporate proxy.

        **Data requirements**

        - The values of NationalId and BankIban must never be visible in plaintext to the Litware Managed Services administrators or to the Azure administrators. app-claims must continue to read and write the values.
        - The database files and backups of sqldb-claims must be encrypted with a key that Humongous creates, rotates and can revoke.
        - This key must be stored in a single-tenant HSM, and the owners of Sub-Claims must not be able to grant themselves access to it.

        **General requirements**

        - Minimize administrative effort.
      fr: |
        **Exigences relatives aux partenaires**

        - Les courtiers doivent demander l'accès à toutes les ressources de Broker Hub en une seule demande. Un responsable des partenariats approuve chaque demande, et l'accès expire au bout de 180 jours.
        - Chaque trimestre, les responsables des partenariats doivent confirmer que chaque courtier a toujours besoin de son accès.

        **Exigences relatives à l'accès privilégié**

        - Le rôle Owner sur Sub-Claims ne doit être utilisé qu'en cas de besoin, pour une durée limitée et après approbation.
        - Avant qu'un administrateur crée, mette à jour ou supprime une stratégie d'accès conditionnel ou modifie un partenaire dans les paramètres d'accès interlocataire, l'administrateur doit se réauthentifier avec une méthode résistante au hameçonnage, quel que soit le rôle qui lui accorde l'autorisation. Les autres tâches d'administration ne doivent pas déclencher cette invite.

        **Exigences réseau**

        - Sur les ordinateurs portables de l'entreprise, les utilisateurs ne doivent pouvoir se connecter qu'avec des comptes de humongousins.com et de adatumre.com, y compris lorsqu'ils travaillent à domicile ou depuis un hôtel. Humongous ne souhaite pas faire passer le trafic par un proxy d'entreprise.

        **Exigences relatives aux données**

        - Les valeurs de NationalId et de BankIban ne doivent jamais être visibles en clair par les administrateurs de Litware Managed Services ni par les administrateurs Azure. app-claims doit continuer à lire et à écrire ces valeurs.
        - Les fichiers de base de données et les sauvegardes de sqldb-claims doivent être chiffrés avec une clé que Humongous crée, renouvelle et peut révoquer.
        - Cette clé doit être stockée dans un HSM monolocataire, et les propriétaires de Sub-Claims ne doivent pas pouvoir s'en accorder l'accès.

        **Exigences générales**

        - Réduire au minimum l'effort d'administration.
