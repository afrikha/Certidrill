id: sc100-cs1b-lamna
status: draft
title:
  en: Lamna Healthcare
  fr: Lamna Healthcare
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lamna Healthcare operates 14 hospitals and 60 outpatient clinics. It has 9,000 clinical and administrative staff members.

        Lamna is rolling out Microsoft 365 Copilot to its staff and is moving the back end of its patient portal to a public cloud. An audit by the health regulator found gaps in data protection, audit and mobile access. You must design the controls that close these gaps.
      fr: |
        Lamna Healthcare exploite 14 hôpitaux et 60 cliniques de consultations externes. Elle compte 9 000 membres du personnel soignant et administratif.

        Lamna déploie Microsoft 365 Copilot auprès de son personnel et migre le back-end de son portail patients vers un cloud public. Un audit de l'autorité de santé a relevé des lacunes en matière de protection des données, d'audit et d'accès mobile. Vous devez concevoir les contrôles qui comblent ces lacunes.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Microsoft 365**

        Lamna has a Microsoft Entra tenant named lamnahealth.com. All the staff members have Microsoft 365 E5 licenses. Microsoft 365 Copilot licenses are assigned to the administrative staff, and Lamna plans to extend them to the clinicians. SharePoint Advanced Management is available.

        - The SharePoint site **Research-Archive** is shared with Everyone except external users. A review of its permissions started this month and will take several weeks.
        - Audit (Premium) uses the default audit log retention policies.

        **Devices**

        - Administrative staff use Windows 11 laptops that are enrolled in Microsoft Intune and onboarded to Microsoft Defender for Endpoint Plan 2. The laptops are often used from home.
        - Clinicians use their personal iOS and Android phones for Outlook and Teams. The phones are not enrolled in Intune.

        **Patient portal**

        | Component | Location |
        | --- | --- |
        | Front end | Azure App Service in an Azure subscription named **Sub-Portal** |
        | Back end | Amazon EC2 instances and Amazon RDS databases in an AWS account named **aws-portal-prod** |

        Sub-Portal and aws-portal-prod are connected to Microsoft Defender for Cloud, and the Defender CSPM plan is enabled on both. No standard other than the default standards is assigned.

        **Recent incidents**

        - Phishing email messages that contained malicious attachments and links reached staff mailboxes.
        - Administrative staff uploaded patient lists to consumer file-sharing apps and to unapproved AI chat apps.
      fr: |
        **Microsoft 365**

        Lamna dispose d'un locataire Microsoft Entra nommé lamnahealth.com. Tous les membres du personnel disposent de licences Microsoft 365 E5. Des licences Microsoft 365 Copilot sont attribuées au personnel administratif, et Lamna prévoit de les étendre aux soignants. SharePoint Advanced Management est disponible.

        - Le site SharePoint **Research-Archive** est partagé avec Tout le monde sauf les utilisateurs externes. Une révision de ses autorisations a commencé ce mois-ci et durera plusieurs semaines.
        - Audit (Premium) utilise les stratégies de rétention des journaux d'audit par défaut.

        **Appareils**

        - Le personnel administratif utilise des ordinateurs portables Windows 11 inscrits dans Microsoft Intune et intégrés à Microsoft Defender for Endpoint Plan 2. Les ordinateurs portables sont souvent utilisés à domicile.
        - Les soignants utilisent leurs téléphones personnels iOS et Android pour Outlook et Teams. Les téléphones ne sont pas inscrits dans Intune.

        **Portail patients**

        | Composant | Emplacement |
        | --- | --- |
        | Front-end | Azure App Service dans un abonnement Azure nommé **Sub-Portal** |
        | Back-end | Instances Amazon EC2 et bases de données Amazon RDS dans un compte AWS nommé **aws-portal-prod** |

        Sub-Portal et aws-portal-prod sont connectés à Microsoft Defender for Cloud, et le plan Defender CSPM est activé sur les deux. Aucune norme autre que les normes par défaut n'est attribuée.

        **Incidents récents**

        - Des messages d'hameçonnage qui contenaient des pièces jointes et des liens malveillants sont arrivés dans les boîtes aux lettres du personnel.
        - Des membres du personnel administratif ont chargé des listes de patients dans des applications grand public de partage de fichiers et dans des applications de conversation IA non approuvées.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Copilot requirements**

        - Before the Copilot licenses are extended to the clinicians, the security team must identify the other SharePoint sites whose content is shared with Everyone except external users. The identification must not change any permission.
        - Until the permission review of Research-Archive is complete, the content of the site must not appear in Copilot responses or in organization-wide search results. The members of the site must keep their access.

        **Audit requirements**

        - The audit records of the activities performed by clinicians must remain searchable in Microsoft Purview Audit for seven years.

        **Mobile requirements**

        - On the clinicians' phones, organization data in Outlook and Teams must not be copied to personal apps.
        - Lamna must be able to remove the organization data from a lost phone without affecting personal data.
        - The phones must remain unenrolled.

        **Threat protection requirements**

        - Email attachments must be checked for malware before they are delivered.
        - Links in email messages and Teams messages must be checked when a user selects them.
        - The use of unapproved cloud apps from the Windows laptops must be discovered and blocked, including when the laptops are used from home.

        **Compliance requirements**

        - The security team must track the compliance of the Azure and AWS resources of the patient portal against a healthcare standard in the regulatory compliance dashboard of Defender for Cloud, by using the same standard for both clouds.

        **General requirements**

        - Use the existing licenses whenever possible.
      fr: |
        **Exigences relatives à Copilot**

        - Avant l'extension des licences Copilot aux soignants, l'équipe de sécurité doit identifier les autres sites SharePoint dont le contenu est partagé avec Tout le monde sauf les utilisateurs externes. Cette identification ne doit modifier aucune autorisation.
        - Tant que la révision des autorisations de Research-Archive n'est pas terminée, le contenu du site ne doit apparaître ni dans les réponses de Copilot ni dans les résultats de la recherche à l'échelle de l'organisation. Les membres du site doivent conserver leur accès.

        **Exigences relatives à l'audit**

        - Les enregistrements d'audit des activités effectuées par les soignants doivent rester consultables dans Microsoft Purview Audit pendant sept ans.

        **Exigences relatives aux appareils mobiles**

        - Sur les téléphones des soignants, les données de l'organisation dans Outlook et Teams ne doivent pas être copiées vers des applications personnelles.
        - Lamna doit pouvoir supprimer les données de l'organisation d'un téléphone perdu sans affecter les données personnelles.
        - Les téléphones doivent rester non inscrits.

        **Exigences relatives à la protection contre les menaces**

        - Les pièces jointes des e-mails doivent être analysées pour détecter les programmes malveillants avant leur remise.
        - Les liens des messages électroniques et des messages Teams doivent être vérifiés quand un utilisateur les sélectionne.
        - L'utilisation d'applications cloud non approuvées depuis les ordinateurs portables Windows doit être découverte et bloquée, y compris quand les ordinateurs portables sont utilisés à domicile.

        **Exigences relatives à la conformité**

        - L'équipe de sécurité doit suivre la conformité des ressources Azure et AWS du portail patients par rapport à une norme du secteur de la santé dans le tableau de bord de conformité réglementaire de Defender for Cloud, en utilisant la même norme pour les deux clouds.

        **Exigences générales**

        - Utiliser les licences existantes dans la mesure du possible.
