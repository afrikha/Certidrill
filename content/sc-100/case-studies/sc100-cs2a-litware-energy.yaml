id: sc100-cs2a-litware-energy
status: draft
title:
  en: Litware Energy
  fr: Litware Energy
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Litware Energy produces and distributes electricity in Portugal and Spain. The company has 3,200 employees, a head office in Lisbon, nine power plants and two regional control centers.

        Last year, a ransomware attack against another utility encrypted its IT servers and its backups and forced its control centers into manual operation for two weeks. The board of Litware Energy asks the security team for a resiliency program that covers the IT and the operational technology (OT) environments.
      fr: |
        Litware Energy produit et distribue de l'électricité au Portugal et en Espagne. La société compte 3 200 employés, un siège à Lisbonne, neuf centrales électriques et deux centres de conduite régionaux.

        L'année dernière, une attaque par rançongiciel contre un autre fournisseur d'énergie a chiffré ses serveurs informatiques et ses sauvegardes, et a contraint ses centres de conduite à fonctionner manuellement pendant deux semaines. Le conseil d'administration de Litware Energy demande à l'équipe de sécurité un programme de résilience qui couvre les environnements informatiques (IT) et de technologie opérationnelle (OT).
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity**

        Litware Energy has a single Active Directory Domain Services (AD DS) forest named litware.com. Four domain controllers that run Windows Server 2022 are split between the Lisbon and Madrid datacenters. Microsoft Entra Connect Sync synchronizes the forest with a Microsoft Entra tenant. All the employees have Microsoft 365 E5 licenses.

        **IT environment**

        | Component | Description |
        | --- | --- |
        | Laptops | 2,800 Windows 11 devices that are Microsoft Entra hybrid joined and enrolled in Microsoft Intune |
        | On-premises servers | 350 Windows Server virtual machines in the Lisbon and Madrid datacenters, joined to litware.com |
        | Azure | A subscription named **Sub-Ops** that contains 40 virtual machines backed up to a Recovery Services vault named **RSV-Ops** |
        | Security operations | A Microsoft Sentinel workspace and Microsoft Defender XDR. Microsoft Defender for Endpoint is deployed to the laptops and to the IT servers. |

        **Plant networks**

        Each power plant has an OT network that contains programmable logic controllers (PLCs), remote terminal units (RTUs) and human-machine interface (HMI) workstations that communicate over Modbus/TCP and DNP3. A firewall separates each OT network from the IT network. The demilitarized zone (DMZ) of each plant allows outbound HTTPS connections to Azure. The security operations center (SOC) has no visibility into the OT networks.
      fr: |
        **Identité**

        Litware Energy dispose d'une seule forêt Active Directory Domain Services (AD DS) nommée litware.com. Quatre contrôleurs de domaine qui exécutent Windows Server 2022 sont répartis entre les centres de données de Lisbonne et de Madrid. Microsoft Entra Connect Sync synchronise la forêt avec un locataire Microsoft Entra. Tous les employés disposent de licences Microsoft 365 E5.

        **Environnement informatique**

        | Composant | Description |
        | --- | --- |
        | Ordinateurs portables | 2 800 appareils Windows 11 joints à Microsoft Entra hybride et inscrits dans Microsoft Intune |
        | Serveurs locaux | 350 machines virtuelles Windows Server dans les centres de données de Lisbonne et de Madrid, jointes à litware.com |
        | Azure | Un abonnement nommé **Sub-Ops** qui contient 40 machines virtuelles sauvegardées dans un coffre Recovery Services nommé **RSV-Ops** |
        | Opérations de sécurité | Un espace de travail Microsoft Sentinel et Microsoft Defender XDR. Microsoft Defender for Endpoint est déployé sur les ordinateurs portables et sur les serveurs informatiques. |

        **Réseaux des centrales**

        Chaque centrale dispose d'un réseau OT qui contient des automates programmables (PLC), des unités terminales distantes (RTU) et des postes de supervision (HMI) qui communiquent en Modbus/TCP et en DNP3. Un pare-feu sépare chaque réseau OT du réseau informatique. La zone démilitarisée (DMZ) de chaque centrale autorise les connexions HTTPS sortantes vers Azure. Le centre des opérations de sécurité (SOC) n'a aucune visibilité sur les réseaux OT.
  - key: findings
    title: { en: "Audit findings", fr: "Constats d'audit" }
    body:
      en: |
        An internal audit reported the following issues:

        - All the laptops and all the servers share the same local Administrator password, which was set in the deployment image.
        - The members of the Domain Admins group sign in to their standard laptops, which they also use for email and web browsing, and they connect to the domain controllers by using Remote Desktop from these laptops.
        - Twenty-five services run as standard user accounts that have service principal names (SPNs). Their passwords were never changed. One of these accounts runs the same web application on a farm of four servers.
        - The administrators who have the Backup Contributor role on RSV-Ops, and the owners of Sub-Ops, can reduce the retention of the backup policies and delete recovery points.
        - The SOC has no detection for attacks against AD DS, such as the theft and cracking of Kerberos service tickets or the forging of Kerberos tickets.
      fr: |
        Un audit interne a relevé les problèmes suivants :

        - Tous les ordinateurs portables et tous les serveurs partagent le même mot de passe Administrator local, défini dans l'image de déploiement.
        - Les membres du groupe Domain Admins se connectent à leurs ordinateurs portables standard, qu'ils utilisent aussi pour la messagerie et la navigation web, et ils se connectent aux contrôleurs de domaine avec le Bureau à distance depuis ces ordinateurs.
        - Vingt-cinq services s'exécutent sous des comptes d'utilisateur standard qui ont des noms de principal du service (SPN). Leurs mots de passe n'ont jamais été changés. L'un de ces comptes exécute la même application web sur une batterie de quatre serveurs.
        - Les administrateurs qui ont le rôle Backup Contributor sur RSV-Ops, ainsi que les propriétaires de Sub-Ops, peuvent réduire la rétention des stratégies de sauvegarde et supprimer des points de récupération.
        - Le SOC n'a aucune détection pour les attaques contre AD DS, comme le vol et le cassage de tickets de service Kerberos ou la falsification de tickets Kerberos.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **OT requirements**

        - All the OT assets of the plants must be discovered, and unauthorized commands sent to PLCs must be detected.
        - No software can be installed on the PLCs, the RTUs or the HMI workstations, and the monitoring solution must not inject traffic into the OT networks.
        - The SOC must investigate OT alerts in Microsoft Sentinel, together with the IT incidents.
        - The SOC must evaluate its detection coverage against the techniques that adversaries use against industrial control systems.

        **Identity and endpoint requirements**

        - Each laptop and each server must have a unique local administrator password that is rotated automatically. The help desk must be able to retrieve the password of a laptop from the cloud, even when the laptop is not connected to the corporate network. The passwords of the on-premises servers must be stored on premises.
        - The Directory Services Restore Mode (DSRM) passwords of the domain controllers must also be managed and rotated.
        - The members of Domain Admins must perform administrative tasks only from devices that cannot be used for email or web browsing.
        - The service account passwords must be long, random and rotated automatically, with no administrative effort. The four servers of the web farm must keep sharing one account.
        - The SOC must detect attacks against AD DS by using the existing licenses.

        **Backup requirements**

        - Nobody, including the owners of Sub-Ops, must be able to reduce the retention of the backups of RSV-Ops or to delete recovery points before they expire.
        - The other critical operations on RSV-Ops must require the approval of the security team, which does not administer the backups.
      fr: |
        **Exigences OT**

        - Tous les actifs OT des centrales doivent être découverts, et les commandes non autorisées envoyées aux automates programmables (PLC) doivent être détectées.
        - Aucun logiciel ne peut être installé sur les PLC, les RTU ou les postes HMI, et la solution de surveillance ne doit injecter aucun trafic dans les réseaux OT.
        - Le SOC doit examiner les alertes OT dans Microsoft Sentinel, avec les incidents informatiques.
        - Le SOC doit évaluer sa couverture de détection par rapport aux techniques que les adversaires utilisent contre les systèmes de contrôle industriels.

        **Exigences d'identité et de points de terminaison**

        - Chaque ordinateur portable et chaque serveur doit avoir un mot de passe d'administrateur local unique, renouvelé automatiquement. Le support technique doit pouvoir récupérer le mot de passe d'un ordinateur portable depuis le cloud, même quand l'ordinateur n'est pas connecté au réseau de l'entreprise. Les mots de passe des serveurs locaux doivent être stockés en local.
        - Les mots de passe du mode de restauration des services d'annuaire (DSRM) des contrôleurs de domaine doivent aussi être gérés et renouvelés.
        - Les membres de Domain Admins ne doivent effectuer les tâches d'administration que depuis des appareils qui ne peuvent pas servir à la messagerie ni à la navigation web.
        - Les mots de passe des comptes de service doivent être longs, aléatoires et renouvelés automatiquement, sans effort d'administration. Les quatre serveurs de la batterie web doivent continuer à partager un même compte.
        - Le SOC doit détecter les attaques contre AD DS en utilisant les licences existantes.

        **Exigences de sauvegarde**

        - Personne, y compris les propriétaires de Sub-Ops, ne doit pouvoir réduire la rétention des sauvegardes de RSV-Ops ni supprimer des points de récupération avant leur expiration.
        - Les autres opérations critiques sur RSV-Ops doivent exiger l'approbation de l'équipe de sécurité, qui n'administre pas les sauvegardes.
