# SC-100 objectives — official study guide, skills measured as of 2026-10-21 (en-us page, checked on 2026-11-16).
# `code` is the stable key referenced by question files and course sections.
# English verbatim. French from the fr-fr page (straight apostrophes), which still showed the July 28, 2026
# version on 2026-11-16 (same 14 groups and 81 bullets; the October 21 changes are "minor" in groups 2.1 and 4.1):
# re-sync 2.1.x and 4.1.x when the localized page is updated. Only casing slips were normalized.
best-practices:
- group:
    en: Design a resiliency strategy for ransomware and other attacks based on Microsoft Security Best Practices
    fr: Concevoir une stratégie de résilience pour les rançongiciels et d'autres attaques en suivant les bonnes pratiques de sécurité de Microsoft
  objectives:
  - code: 1.1.1
    en: Design a security strategy to support business resiliency goals, including identifying and prioritizing threats to business-critical assets
    fr: Concevoir une stratégie de sécurité pour prendre en charge les objectifs de résilience de l'entreprise, notamment l'identification et la hiérarchisation des menaces sur les ressources vitales pour l'entreprise
  - code: 1.1.2
    en: Design solutions for business continuity and disaster recovery (BCDR), including secure backup and restore for hybrid and multicloud environments
    fr: Concevoir des solutions pour la continuité d'activité et reprise d'activité (BCDR), y compris la sauvegarde et la restauration sécurisées pour les environnements hybrides et multicloud.
  - code: 1.1.3
    en: Design solutions for mitigating ransomware attacks, including prioritization of BCDR and privileged access
    fr: Concevoir des solutions pour atténuer les attaques par ransomware, notamment la hiérarchisation de BCDR et l'accès privilégié
  - code: 1.1.4
    en: Evaluate solutions for security updates
    fr: Concevoir des solutions pour les correctifs de sécurité
- group:
    en: Design solutions that align with the Microsoft Cybersecurity Reference Architectures (MCRA) and Microsoft Cloud Security Benchmark (MCSB)
    fr: Concevoir des solutions qui s'alignent sur les architectures de référence de cybersécurité Microsoft (MCRA) et le benchmark de sécurité Microsoft Cloud (MCSB)
  objectives:
  - code: 1.2.1
    en: Design solutions that align with best practices for cybersecurity capabilities and controls
    fr: Concevoir des solutions qui s'alignent sur les bonnes pratiques relatives aux fonctionnalités et aux contrôles de cybersécurité
  - code: 1.2.2
    en: Design solutions that align with best practices for protecting against insider, external, and supply chain attacks
    fr: Créer des solutions qui s'alignent avec les meilleures pratiques de protection contre les attaques internes, externes et liées à la chaîne d'approvisionnement
  - code: 1.2.3
    en: Design AI solutions that align to the Microsoft Cloud Security Benchmark.
    fr: Concevoir des solutions IA qui s'alignent sur le benchmark Microsoft Cloud Security.
  - code: 1.2.4
    en: Design solutions that align with the Zero Trust adoption framework
    fr: Concevoir des solutions qui s'alignent sur le framework d'adoption de Confiance Zéro
- group:
    en: Design solutions that align with the Microsoft Cloud Adoption Framework for Azure (CAF) and the Azure Well-Architected Framework
    fr: Concevoir des solutions qui s'alignent sur Microsoft Cloud Adoption Framework pour Azure (CAF) et Azure Well-Architected Framework
  objectives:
  - code: 1.3.1
    en: Design a strategy for secure AI adoption
    fr: Concevoir une stratégie pour l'adoption sécurisée de l'IA
  - code: 1.3.2
    en: Design a new or evaluate an existing strategy for security and governance based on the Microsoft Cloud Adoption Framework for Azure (CAF) and the Azure Well-Architected Framework (WAF)
    fr: Concevoir une stratégie nouvelle ou évaluer une stratégie existante pour la sécurité et la gouvernance basées sur le Microsoft Cloud Adoption Framework pour Azure (CAF) et Azure Well-Architected Framework (WAF)
  - code: 1.3.3
    en: Recommend solutions for security and governance based on the Microsoft Cloud Adoption Framework for Azure (CAF) and the Azure Well-Architected Framework
    fr: Recommander des solutions de sécurité et de gouvernance basées sur le Microsoft Cloud Adoption Framework for Azure (CAF) et l'Azure Well-Architected Framework
  - code: 1.3.4
    en: Design solutions for implementing and governing security by using Azure landing zones
    fr: Concevoir des solutions pour implémenter et gouverner la sécurité à l'aide de zones d'atterrissage Azure
  - code: 1.3.5
    en: Design a DevSecOps process that aligns with best practices in the Microsoft Cloud Adoption Framework for Azure (CAF)
    fr: Concevoir un processus DevSecOps qui s'aligne sur les meilleures pratiques dans le Framework d'adoption du cloud Microsoft pour Azure (CAF)
operations-identity:
- group:
    en: Design solutions for security operations
    fr: Concevoir des solutions pour les opérations de sécurité
  objectives:
  - code: 2.1.1
    en: Design a solution for detection and response that includes extended detection and response (XDR) and security information and event management (SIEM)
    fr: Concevoir une solution de détection et de réponse qui inclut la détection et réponse étendues (XDR) et la gestion des informations et des événements de sécurité (SIEM)
  - code: 2.1.2
    en: Design a solution for centralized logging and auditing, including Microsoft Purview Audit
    fr: Concevoir une solution pour la journalisation et un audit centralisés, notamment Microsoft Purview Audit
  - code: 2.1.3
    en: Design monitoring to support hybrid and multicloud environments
    fr: Concevoir une solution de surveillance pour prendre en charge les environnements hybrides et multicloud
  - code: 2.1.4
    en: Design a solution for security orchestration, automation, and response (SOAR), including Microsoft Sentinel and Microsoft Defender XDR
    fr: Concevoir une solution pour l'orchestration de la sécurité et la réponse automatisée (SOAR), notamment Microsoft Sentinel et Microsoft Defender XDR
  - code: 2.1.5
    en: Design and evaluate security workflows, including incident response, threat hunting, and incident management
    fr: Concevoir et évaluer des workflows de sécurité, notamment la réponse aux incidents, le repérage des menaces et la gestion des incidents
  - code: 2.1.6
    en: Design and evaluate threat detection coverage by using MITRE ATT&CK matrices, including Enterprise, Mobile, and industrial control systems (ICS)
    fr: Concevoir et évaluer la couverture de détection des menaces à l'aide de matrices MITRE ATT&CK, y compris les systèmes de contrôle entreprise, mobile et industriel (ICS)
- group:
    en: Design solutions for identity and access management
    fr: Concevoir des solutions pour gérer les identités et les accès
  objectives:
  - code: 2.2.1
    en: Design a solution for agent identities using Microsoft Entra Agent ID and conditional access policies
    fr: Concevoir une solution pour les identités d'agent à l'aide de stratégies d'accès conditionnel et de Identifiant d'assistant Microsoft Entra
  - code: 2.2.2
    en: Design a solution for access to software as a service (SaaS), platform as a service (PaaS), infrastructure as a service (IaaS), hybrid/on-premises, and multicloud resources, including identity, networking, and application controls
    fr: Concevoir une solution pour accéder aux ressources SaaS (software as a service), PaaS (platform as a service), IaaS (infrastructure as a service), hybrides/locales et multiclouds, notamment des contrôles d'identité, de réseau et d'application
  - code: 2.2.3
    en: Design a solution for Microsoft Entra ID, including hybrid and multi-cloud environments
    fr: Concevoir une solution pour Microsoft Entra ID, y compris pour les environnements hybrides et multiclouds
  - code: 2.2.4
    en: Design a solution for external identities, including business-to-business (B2B) and decentralized identity
    fr: Concevoir une solution pour les identités externes, notamment l'entreprise à l'entreprise (B2B) et l'identité décentralisée
  - code: 2.2.5
    en: Design a modern authentication and authorization strategy, including Conditional Access, continuous access evaluation, risk scoring, and protected actions
    fr: Concevoir une stratégie moderne d'authentification et d'autorisation, y compris l'accès conditionnel, l'évaluation continue de l'accès, l'évaluation des risques et les actions protégées.
  - code: 2.2.6
    en: Validate the alignment of Conditional Access policies with a Zero Trust strategy
    fr: Valider l'alignement des stratégies d'accès conditionnel sur une stratégie Confiance Zéro
  - code: 2.2.7
    en: Specify requirements to harden Active Directory Domain Services (AD DS)
    fr: Spécifier les exigences pour sécuriser services de domaine Active Directory (AD DS)
  - code: 2.2.8
    en: Design a solution to manage secrets, keys, and certificates
    fr: Concevoir une solution pour gérer les secrets, les clés et les certificats
- group:
    en: Design solutions for securing privileged access
    fr: Concevoir des solutions pour sécuriser les accès privilégiés
  objectives:
  - code: 2.3.1
    en: Design a solution for assigning and delegating privileged roles by using the enterprise access model
    fr: Concevoir une solution pour attribuer et déléguer des rôles privilégiés à l'aide du modèle d'accès d'entreprise
  - code: 2.3.2
    en: Evaluate the security and governance of Microsoft Entra ID, including Microsoft Entra Privileged Identity Management (PIM), entitlement management, and access reviews
    fr: Évaluer la sécurité et la gouvernance de Microsoft Entra ID, y compris Microsoft Entra Privileged Identity Management (PIM), la gestion des droits d'utilisation et l'examen des accès
  - code: 2.3.3
    en: Evaluate the security and governance of Active Directory Domain Services (AD DS), including resilience to common attacks
    fr: Évaluer la sécurité et la gouvernance des services de domaine Active Directory (AD DS), notamment la résilience aux attaques courantes
  - code: 2.3.4
    en: Design a solution for securing the administration of cloud tenants, including SaaS and multicloud infrastructure and platforms
    fr: Concevoir une solution pour sécuriser l'administration des locataires cloud, notamment l'infrastructure et les plateformes SaaS et multiclouds
  - code: 2.3.5
    en: Design a solution for cloud infrastructure entitlement management
    fr: Concevoir une solution pour la gestion des droits d'utilisation de l'infrastructure cloud
  - code: 2.3.6
    en: Evaluate an access review management solution
    fr: Évaluer une solution de gestion de révision d'accès
  - code: 2.3.7
    en: Design a solution for secure workstations for privileged access, including remote access
    fr: Concevoir une solution pour les stations de travail sécurisées pour l'accès privilégié, y compris l'accès à distance
- group:
    en: Design solutions for regulatory compliance
    fr: Concevoir des solutions de conformité réglementaire
  objectives:
  - code: 2.4.1
    en: Translate compliance requirements into security controls
    fr: Traduire les exigences de conformité en contrôles de sécurité
  - code: 2.4.2
    en: Design a solution to address compliance requirements by using Microsoft Purview
    fr: Concevoir une solution pour répondre aux exigences de conformité à l'aide de Microsoft Purview
  - code: 2.4.3
    en: Design Azure Policy solutions to address security and compliance requirements
    fr: Concevoir des solutions Azure Policy pour répondre aux exigences de sécurité et de conformité
  - code: 2.4.4
    en: Evaluate and validate alignment with regulatory standards and benchmarks by using Microsoft Defender for Cloud
    fr: Évaluer et valider l'alignement sur les normes réglementaires et les benchmarks à l'aide de Microsoft Defender pour le cloud
infrastructure:
- group:
    en: Design solutions for security posture management in hybrid and multicloud environments
    fr: Concevoir des solutions pour gérer la posture de sécurité dans des environnements hybrides et multiclouds
  objectives:
  - code: 3.1.1
    en: Evaluate security posture by using Microsoft Defender for Cloud, including the Microsoft Cloud Security Benchmark (MCSB)
    fr: Évaluer la posture de sécurité à l'aide de Microsoft Defender for Cloud, y compris le benchmark de sécurité Microsoft Cloud (MCSB)
  - code: 3.1.2
    en: Evaluate security posture by using Microsoft Secure Score
    fr: Évaluer la posture de sécurité en utilisant le niveau de sécurité Microsoft
  - code: 3.1.3
    en: Design integrated security posture management solutions that include Microsoft Defender for Cloud in hybrid and multi-cloud environments
    fr: Concevoir des solutions intégrées de gestion de l'état de la sécurité qui incluent Microsoft Defender pour le cloud dans des environnements hybrides et multi-cloud
  - code: 3.1.4
    en: Select cloud workload protection solutions in Microsoft Defender for Cloud
    fr: Sélectionner les solutions de protection des charges de travail dans Microsoft Defender pour le cloud
  - code: 3.1.5
    en: Design a solution for integrating hybrid and multicloud environments by using Azure Arc
    fr: Concevoir une solution pour intégrer des environnements hybrides et multiclouds avec Azure Arc
  - code: 3.1.6
    en: Design a solution for Microsoft Defender External Attack Surface Management (Defender EASM)
    fr: Concevoir une solution pour Microsoft Defender External Attack Surface Management (Defender EASM)
  - code: 3.1.7
    en: Specify requirements and priorities for a posture management process that uses Microsoft Security Exposure Management attack paths, attack surface reduction, security insights, and initiatives
    fr: Spécifier les exigences et les priorités d'un processus de gestion de la posture qui utilise les chemins d'attaque, la réduction de la surface d'attaque, les insights sur la sécurité et les initiatives de Sécurité Microsoft - Gestion de l'exposition
- group:
    en: Specify requirements for securing server and client endpoints
    fr: Spécifier les exigences en matière de sécurisation des points de terminaison du serveur et du client
  objectives:
  - code: 3.2.1
    en: Specify security requirements for servers, including multiple platforms and operating systems
    fr: Spécifier les exigences de sécurité pour les serveurs, y compris plusieurs plateformes et systèmes d'exploitation
  - code: 3.2.2
    en: Specify security requirements for mobile devices and clients, including endpoint protection, hardening, and configuration
    fr: Spécifier les exigences de sécurité pour les appareils mobiles et les clients, y compris la protection, la sécurisation renforcée et la configuration des points de terminaison
  - code: 3.2.3
    en: Specify security requirements for IoT devices and embedded systems
    fr: Spécifier les exigences de sécurité pour les appareils IoT et les systèmes incorporés
  - code: 3.2.4
    en: Evaluate solutions for securing operational technology (OT) and industrial control systems (ICS) by using Microsoft Defender for IoT
    fr: Évaluer des solutions pour sécuriser les technologies opérationnelles (OT) et les systèmes de contrôle industriels (ICS) avec Microsoft Defender pour IoT
  - code: 3.2.5
    en: Specify security baselines for server and client endpoints
    fr: Spécifier des lignes de base de sécurité pour les points de terminaison serveur et client
  - code: 3.2.6
    en: Evaluate Windows Local Administrator Password Solution (Windows LAPS) solution
    fr: Évaluer la solution de mot de passe d'administrateur local Windows (Windows LAPS)
- group:
    en: Specify requirements for securing SaaS, PaaS, and IaaS services
    fr: Spécifier les exigences pour sécuriser les services SaaS, PaaS et IaaS
  objectives:
  - code: 3.3.1
    en: Specify security baselines for SaaS, PaaS, and IaaS services
    fr: Spécifier des bases de référence de sécurité pour les services SaaS, PaaS et IaaS
  - code: 3.3.2
    en: Specify security requirements for IoT workloads
    fr: Spécifier des exigences de sécurité pour les charges de travail IoT
  - code: 3.3.3
    en: Specify security requirements for web workloads
    fr: Spécifier les exigences de sécurité pour les charges de travail web
  - code: 3.3.4
    en: Specify security requirements for containers
    fr: Spécifier des exigences de sécurité pour les conteneurs
  - code: 3.3.5
    en: Specify security requirements for container orchestration
    fr: Spécifier des exigences de sécurité pour l'orchestration des conteneurs
  - code: 3.3.6
    en: Evaluate solutions that include Azure AI services security
    fr: Évaluer les solutions qui incluent la sécurité d'Azure AI Services
- group:
    en: Evaluate solutions for network security and Security Service Edge (SSE)
    fr: Évaluer les solutions pour la sécurité réseau et Security Service Edge (SSE)
  objectives:
  - code: 3.4.1
    en: Evaluate network designs to align with security requirements and best practices
    fr: Évaluer les conceptions réseau pour s'aligner sur les exigences de sécurité et les meilleures pratiques
  - code: 3.4.2
    en: Evaluate solutions that use Microsoft Entra Internet Access as a secure web gateway
    fr: Évaluer les solutions qui utilisent Accès Internet Microsoft Entra comme passerelle web sécurisée
  - code: 3.4.3
    en: Evaluate solutions that use Microsoft Entra Internet Access for Microsoft Services, including cross-tenant configurations
    fr: Évaluer les solutions qui utilisent Accès Internet Microsoft Entra pour les services Microsoft, y compris les configurations interlocataires
  - code: 3.4.4
    en: Evaluate solutions that use Microsoft Entra Private Access
    fr: Évaluer les solutions qui utilisent l'accès privé Microsoft Entra
apps-data:
- group:
    en: Evaluate solutions for securing Microsoft 365
    fr: Évaluer des solutions pour sécuriser Microsoft 365
  objectives:
  - code: 4.1.1
    en: Evaluate security posture for productivity and collaboration workloads by using metrics, including Microsoft Secure Score
    fr: Évaluer la posture de sécurité des charges de travail en matière de productivité et de collaboration à l'aide de métriques, y compris le Niveau de sécurité Microsoft.
  - code: 4.1.2
    en: Evaluate solutions that include Microsoft Defender for Office 365 and Microsoft Defender for Cloud Apps
    fr: Évaluer les solutions qui incluent Microsoft Defender for Office 365 et Microsoft Defender for Cloud Apps
  - code: 4.1.3
    en: Evaluate device management solutions that include Microsoft Intune
    fr: Évaluer les solutions de gestion des appareils qui incluent Microsoft Intune
  - code: 4.1.4
    en: Evaluate solutions for securing data in Microsoft 365 by using Microsoft Purview
    fr: Évaluer les solutions de sécurisation des données dans Microsoft 365 à l'aide de Microsoft Purview
  - code: 4.1.5
    en: Evaluate data security and compliance controls in Microsoft 365 Copilot
    fr: Évaluer la sécurité des données et les contrôles de conformité dans Microsoft Copilot pour les services Microsoft 365
- group:
    en: Design solutions for securing applications
    fr: Concevoir des solutions pour sécuriser les applications
  objectives:
  - code: 4.2.1
    en: Evaluate the security posture of existing application portfolios
    fr: Évaluer la posture de sécurité de portefeuilles d'applications existants
  - code: 4.2.2
    en: Evaluate threats to business-critical applications by using threat modeling
    fr: Évaluer les menaces pesant sur les applications vitales pour l'entreprise en utilisant la modélisation des menaces
  - code: 4.2.3
    en: Design and implement a full lifecycle strategy for application security
    fr: Concevoir et implémenter une stratégie de cycle de vie complet pour la sécurité des applications
  - code: 4.2.4
    en: Design and implement standards and practices for securing the application development process
    fr: Concevoir et implémenter des normes et des pratiques pour sécuriser le processus de développement d'applications
  - code: 4.2.5
    en: Map technologies to application security requirements
    fr: Mapper les technologies aux exigences de sécurité des applications
  - code: 4.2.6
    en: Design a solution for workload identities to authenticate and access Azure resources
    fr: Concevoir une solution pour les identités de charge de travail afin d'authentifier et d'accéder aux ressources Azure
  - code: 4.2.7
    en: Design a solution for API management and security
    fr: Concevoir une solution pour la gestion et la sécurité des API
  - code: 4.2.8
    en: Design solutions that secure applications by using Azure Web Application Firewall (WAF)
    fr: Concevoir des solutions qui sécurisent les applications à l'aide d'Azure Web Application Firewall (WAF)
- group:
    en: Design solutions for securing an organization's data
    fr: Concevoir des solutions pour sécuriser les données d'une organisation
  objectives:
  - code: 4.3.1
    en: Evaluate solutions for data discovery and classification
    fr: Évaluer les solutions pour la recherche et la classification de données
  - code: 4.3.2
    en: Specify priorities for mitigating threats to data
    fr: Spécifier des priorités pour atténuer les menaces sur les données
  - code: 4.3.3
    en: Evaluate solutions for encryption of data at rest and in transit, including Azure Key Vault and infrastructure encryption
    fr: Évaluer les solutions pour le chiffrement de données au repos et en transit, notamment Azure Key Vault et le chiffrement d'infrastructure
  - code: 4.3.4
    en: Design security for data used in AI workloads
    fr: Concevoir la sécurité des données utilisées dans les charges de travail IA
  - code: 4.3.5
    en: Design a security solution for data in Azure workloads, including Azure SQL, Azure Synapse Analytics, and Azure Cosmos DB
    fr: Concevoir une solution de sécurité pour les données dans les charges de travail Azure, notamment Azure SQL, Azure Synapse Analytics et Azure Cosmos DB
  - code: 4.3.6
    en: Design a security solution for data in Azure Storage
    fr: Concevoir une solution de sécurité pour les données dans Stockage Azure
  - code: 4.3.7
    en: Design a security solution that includes Microsoft Defender for Storage and Microsoft Defender for Databases
    fr: Concevoir une solution de sécurité qui inclut Microsoft Defender pour le stockage et Microsoft Defender for Databases
