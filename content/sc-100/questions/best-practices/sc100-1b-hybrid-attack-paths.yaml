id: sc100-1b-hybrid-attack-paths
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has an on-premises Active Directory Domain Services (AD DS) forest synchronized with Microsoft Entra ID, 6,000 devices onboarded to Microsoft Defender for Endpoint, and workloads in Azure and AWS protected by Microsoft Defender for Cloud. A third-party scanner from Qualys assesses the on-premises servers.

    The CISO wants to reduce the risk of an external attacker reaching the company's most valuable systems. You need to recommend a solution that meets the following requirements:

    - Mark domain controllers, key vaults and the payroll database as critical assets.
    - Show how an attacker could move from a compromised device or identity on-premises to cloud resources.
    - Identify the choke points shared by many of these paths, and include the Qualys data.

    What should you recommend?
  fr: |
    Proseware, Inc. dispose d'une forêt Active Directory Domain Services (AD DS) locale synchronisée avec Microsoft Entra ID, de 6 000 appareils intégrés à Microsoft Defender for Endpoint et de charges de travail dans Azure et AWS protégées par Microsoft Defender for Cloud. Un analyseur tiers de Qualys évalue les serveurs locaux.

    Le RSSI veut réduire le risque qu'un attaquant externe atteigne les systèmes les plus précieux de l'entreprise. Vous devez recommander une solution qui répond aux exigences suivantes :

    - Marquer les contrôleurs de domaine, les coffres de clés et la base de données de paie comme ressources critiques.
    - Montrer comment un attaquant pourrait passer d'un appareil ou d'une identité compromis en local à des ressources cloud.
    - Identifier les points d'étranglement partagés par un grand nombre de ces chemins, et inclure les données de Qualys.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Microsoft Defender External Attack Surface Management }
    - { id: b, text: Microsoft Defender Vulnerability Management }
    - { id: c, text: { en: "Microsoft Sentinel with hunting queries over the Defender data", fr: "Microsoft Sentinel avec des requêtes de repérage sur les données de Defender" } }
    - { id: d, text: Microsoft Security Exposure Management }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Security Exposure Management builds an exposure graph across devices, identities and cloud resources, including hybrid relationships. It provides critical asset management, attack paths and choke points with recommendations, and data connectors that bring in third-party sources such as Qualys.
    fr: |-
      Security Exposure Management construit un graphe d'exposition qui couvre les appareils, les identités et les ressources cloud, relations hybrides comprises. Il fournit la gestion des ressources critiques, les chemins d'attaque et les points d'étranglement avec des recommandations, ainsi que des connecteurs de données qui intègrent des sources tierces comme Qualys.
  options:
    a:
      en: |-
        Defender EASM discovers internet-facing assets from the outside; it doesn't model internal paths from on-premises identities to cloud resources.
      fr: |-
        Defender EASM découvre les ressources exposées sur Internet depuis l'extérieur ; il ne modélise pas les chemins internes entre les identités locales et les ressources cloud.
    b:
      en: |-
        Defender Vulnerability Management prioritizes vulnerabilities on devices, but it doesn't compute attack paths or choke points toward critical assets.
      fr: |-
        Defender Vulnerability Management priorise les vulnérabilités des appareils, mais il ne calcule ni chemins d'attaque ni points d'étranglement vers les ressources critiques.
    c:
      en: |-
        Sentinel hunting searches logs for attacker activity that already happened; it doesn't simulate the paths an attacker could take.
      fr: |-
        Le repérage dans Sentinel recherche dans les journaux une activité d'attaquant déjà survenue ; il ne simule pas les chemins qu'un attaquant pourrait emprunter.
references:
  - title: What is Microsoft Security Exposure Management? - Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/microsoft-security-exposure-management
