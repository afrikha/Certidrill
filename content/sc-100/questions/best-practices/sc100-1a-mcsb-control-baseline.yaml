id: sc100-1a-mcsb-control-baseline
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. is moving 200 workloads to Azure. The security architects need a baseline of security controls to design and assess the workloads against.

    Each control must describe a technology-agnostic security principle and Azure implementation guidance, and the controls must map to built-in Azure Policy definitions so that compliance can be measured.

    Which reference should you recommend?
  fr: |
    Contoso, Ltd. migre 200 charges de travail vers Azure. Les architectes de sécurité ont besoin d'une base de référence de contrôles de sécurité pour concevoir et évaluer les charges de travail.

    Chaque contrôle doit décrire un principe de sécurité indépendant de la technologie et des recommandations de mise en œuvre pour Azure, et les contrôles doivent correspondre à des définitions Azure Policy intégrées pour que la conformité puisse être mesurée.

    Quelle référence devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The Microsoft cloud security benchmark (MCSB)", fr: "Le Microsoft cloud security benchmark (MCSB)" } }
    - { id: b, text: { en: "The Microsoft Cybersecurity Reference Architectures (MCRA)", fr: "Les Microsoft Cybersecurity Reference Architectures (MCRA)" } }
    - { id: c, text: { en: "The Zero Trust adoption framework", fr: "Le framework d'adoption de la Confiance Zéro" } }
    - { id: d, text: { en: "The Security Adoption Framework (SAF)", fr: "Le Security Adoption Framework (SAF)" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each MCSB control contains a technology-agnostic security principle, the risk it mitigates, Azure implementation guidance and links to built-in Azure Policy definitions where applicable. MCSB v2 maps its controls to more than 420 built-in Azure Policy definitions, so Azure Policy and Microsoft Defender for Cloud can measure and monitor the posture.
    fr: |
      Chaque contrôle du MCSB contient un principe de sécurité indépendant de la technologie, le risque qu'il atténue, des recommandations de mise en œuvre pour Azure et des liens vers des définitions Azure Policy intégrées le cas échéant. Le MCSB v2 associe ses contrôles à plus de 420 définitions Azure Policy intégrées : Azure Policy et Microsoft Defender for Cloud peuvent mesurer et surveiller la posture.
  options:
    b:
      en: |-
        The MCRA show capabilities and how they fit together. They aren't a list of controls with Azure Policy mappings.
      fr: |-
        Les MCRA montrent les capacités et leur assemblage. Ce n'est pas une liste de contrôles associés à Azure Policy.
    c:
      en: |-
        The Zero Trust adoption framework organizes a security program around business scenarios. It doesn't provide controls mapped to Azure Policy.
      fr: |-
        Le framework d'adoption de la Confiance Zéro organise un programme de sécurité autour de scénarios métier. Il ne fournit pas de contrôles associés à Azure Policy.
    d:
      en: |-
        The SAF is Microsoft's guidance to modernize security strategy, governance, architecture and operations, of which the MCRA are a component. It isn't a control baseline.
      fr: |-
        Le SAF est l'ensemble des recommandations de Microsoft pour moderniser la stratégie, la gouvernance, l'architecture et les opérations de sécurité, dont les MCRA sont une composante. Ce n'est pas une base de référence de contrôles.
references:
  - title: Overview of Microsoft cloud security benchmark v2 (preview)
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/overview
