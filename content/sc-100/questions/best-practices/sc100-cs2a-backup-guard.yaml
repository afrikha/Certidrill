id: sc100-cs2a-backup-guard
objective: "1.1.3"
type: multi
caseStudy: sc100-cs2a-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to protect the backups of RSV-Ops against a ransomware operator who obtains privileged access to Sub-Ops. The solution must meet the backup requirements.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution pour protéger les sauvegardes de RSV-Ops contre un opérateur de rançongiciel qui obtient un accès privilégié à Sub-Ops. La solution doit répondre aux exigences de sauvegarde.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply a Delete resource lock to RSV-Ops and to its resource group", fr: "Appliquer un verrou de ressource Suppression à RSV-Ops et à son groupe de ressources" } }
    - { id: b, text: { en: "Enable immutability on RSV-Ops and lock the immutability setting", fr: "Activer l'immuabilité sur RSV-Ops et verrouiller le paramètre d'immuabilité" } }
    - { id: c, text: { en: "Replace the Backup Contributor assignments with Backup Operator assignments", fr: "Remplacer les attributions Backup Contributor par des attributions Backup Operator" } }
    - { id: d, text: { en: "Enable multi-user authorization on RSV-Ops with a Resource Guard in another tenant", fr: "Activer l'autorisation multi-utilisateur sur RSV-Ops avec un Resource Guard dans un autre locataire" } }
    - { id: e, text: { en: "Enable Cross Region Restore on RSV-Ops and its geo-redundant storage", fr: "Activer la restauration interrégion sur RSV-Ops et son stockage géoredondant" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      A locked immutable vault blocks the deletion of recovery points before their expiry and any policy change that reduces retention, and locking is irreversible, so even the subscription owners can't turn it off. Multi-user authorization makes Azure Backup check a Resource Guard before critical operations; the security team owns the Resource Guard, and placing it in another tenant gives the strongest isolation from a compromised Sub-Ops.
    fr: |
      Un coffre immuable verrouillé bloque la suppression des points de récupération avant leur expiration et toute modification de stratégie qui réduit la rétention ; le verrouillage est irréversible, et même les propriétaires de l'abonnement ne peuvent donc pas le désactiver. L'autorisation multi-utilisateur oblige Sauvegarde Azure à vérifier un Resource Guard avant les opérations critiques ; l'équipe de sécurité est propriétaire du Resource Guard, et le placer dans un autre locataire offre l'isolation la plus forte vis-à-vis d'un abonnement Sub-Ops compromis.
  options:
    a:
      en: A resource lock doesn't stop retention changes or the deletion of recovery points, and the owners of the subscription can remove the lock.
      fr: Un verrou de ressource n'empêche ni les modifications de rétention ni la suppression de points de récupération, et les propriétaires de l'abonnement peuvent retirer le verrou.
    c:
      en: Changing the role of the backup administrators doesn't restrict the subscription owners, who keep full control of the vault.
      fr: Changer le rôle des administrateurs de sauvegarde ne restreint pas les propriétaires de l'abonnement, qui gardent le contrôle total du coffre.
    e:
      en: Cross Region Restore improves availability during a regional outage, but recovery points deleted by an attacker are deleted in both regions.
      fr: La restauration interrégion améliore la disponibilité pendant une panne régionale, mais des points de récupération supprimés par un attaquant le sont dans les deux régions.
references:
  - title: Concept of Immutable Vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
  - title: Multiuser Authorization Using Resource Guard
    url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
