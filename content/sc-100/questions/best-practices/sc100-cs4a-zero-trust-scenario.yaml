id: sc100-cs4a-zero-trust-scenario
objective: "1.2.4"
type: single
caseStudy: sc100-cs4a-blue-yonder-airlines
difficulty: 1
status: draft
stem:
  en: |
    You are preparing the Zero Trust program by using the Zero Trust adoption framework.

    Which business scenario should you recommend for the first initiative?
  fr: |
    Vous préparez le programme Confiance Zéro à l'aide du framework d'adoption de la Confiance Zéro.

    Quel scénario métier devez-vous recommander pour la première initiative ?
body:
  options:
    - { id: a, text: { en: "Rapidly modernize your security posture", fr: "Rapidly modernize your security posture" } }
    - { id: b, text: { en: "Prevent or reduce business damage from a breach", fr: "Prevent or reduce business damage from a breach" } }
    - { id: c, text: { en: "Secure remote and hybrid work", fr: "Secure remote and hybrid work" } }
    - { id: d, text: { en: "Identify and protect sensitive business data", fr: "Identify and protect sensitive business data" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Zero Trust adoption framework organizes the program into business scenarios that leaders can sponsor, each tied to a business outcome. The first initiative is about letting crew members work securely from airports, hotels and home, which is the outcome of the Secure remote and hybrid work scenario.
    fr: |-
      Le framework d'adoption de la Confiance Zéro organise le programme en scénarios métier que les responsables peuvent parrainer, chacun lié à un résultat métier. La première initiative consiste à permettre aux membres d'équipage de travailler de façon sécurisée depuis les aéroports, les hôtels et leur domicile : c'est le résultat du scénario Secure remote and hybrid work.
  options:
    a:
      en: |-
        Modernizing the security posture measures and raises the posture across the whole estate; it isn't focused on where and how employees work.
      fr: |-
        La modernisation de la posture de sécurité mesure et améliore la posture de l'ensemble du parc ; elle n'est pas centrée sur l'endroit et la façon dont les employés travaillent.
    b:
      en: |-
        This scenario fits the board's concern about ransomware, but the requirements define the first initiative as remote work for crew members.
      fr: |-
        Ce scénario correspond à la préoccupation du conseil d'administration concernant les rançongiciels, mais les exigences définissent la première initiative comme le travail à distance des membres d'équipage.
    d:
      en: |-
        This scenario finds and protects sensitive data with classification and data loss prevention; it doesn't address secure access for remote workers.
      fr: |-
        Ce scénario recherche et protège les données sensibles par la classification et la protection contre la perte de données ; il ne traite pas de l'accès sécurisé des travailleurs à distance.
references:
  - title: Zero Trust adoption framework overview
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/zero-trust-adoption-overview
