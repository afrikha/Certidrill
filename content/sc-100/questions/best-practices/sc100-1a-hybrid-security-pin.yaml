id: sc100-1a-hybrid-security-pin
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders backs up 40 on-premises Windows file servers to a Recovery Services vault named RSV-Files by using the Microsoft Azure Recovery Services (MARS) agent.

    You need to recommend a solution so that an attacker who gains administrative access to a file server can't stop protection with deletion of the backup data or change the passphrase without an additional verification obtained from the Azure portal. Deleted backup data must remain recoverable for a period. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Northwind Traders sauvegarde 40 serveurs de fichiers Windows locaux dans un coffre Recovery Services nommé RSV-Files avec l'agent Microsoft Azure Recovery Services (MARS).

    Vous devez recommander une solution pour qu'un attaquant qui obtient un accès administratif à un serveur de fichiers ne puisse pas arrêter la protection avec suppression des données de sauvegarde ni changer la phrase secrète sans une vérification supplémentaire obtenue dans le portail Azure. Les données de sauvegarde supprimées doivent rester récupérables pendant un certain temps. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Apply a Delete resource lock to RSV-Files and to its resource group", fr: "Appliquer un verrou de ressource Suppression à RSV-Files et à son groupe de ressources" } }
    - { id: b, text: { en: "Enable geo-redundant storage and Cross Region Restore on RSV-Files", fr: "Activer le stockage géoredondant et la restauration interrégion sur RSV-Files" } }
    - { id: c, text: { en: "Enable the security features of RSV-Files that require a security PIN", fr: "Activer les fonctionnalités de sécurité de RSV-Files qui exigent un code PIN de sécurité" } }
    - { id: d, text: { en: "Encrypt the backup data in RSV-Files with a customer-managed key", fr: "Chiffrer les données de sauvegarde de RSV-Files avec une clé gérée par le client" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The security features for hybrid backups protect MARS agent, MABS and DPM backups. Critical operations such as Stop Protection with Delete data and Change Passphrase require a security PIN that is generated in the Azure portal and is valid for five minutes, and deleted backup data is kept for 14 additional days. Microsoft also recommends multi-user authorization to protect the disabling of these features.
    fr: |
      Les fonctionnalités de sécurité des sauvegardes hybrides protègent les sauvegardes de l'agent MARS, de MABS et de DPM. Les opérations critiques comme Stop Protection with Delete data et Change Passphrase exigent un code PIN de sécurité généré dans le portail Azure et valable cinq minutes, et les données de sauvegarde supprimées sont conservées 14 jours de plus. Microsoft recommande aussi l'autorisation multi-utilisateur pour protéger la désactivation de ces fonctionnalités.
  options:
    a:
      en: |-
        A resource lock protects the vault resource against deletion or modification. It doesn't require a verification obtained from the portal before destructive backup operations, and it doesn't keep deleted backup data for an extra period.
      fr: |-
        Un verrou de ressource protège la ressource coffre contre la suppression ou la modification. Il n'exige pas de vérification obtenue dans le portail avant les opérations de sauvegarde destructrices et ne conserve pas les données supprimées pendant une période supplémentaire.
    b:
      en: |-
        Cross Region Restore restores Azure VMs in the paired region. It doesn't add a verification before destructive operations on hybrid backups.
      fr: |-
        La restauration interrégion restaure des VM Azure dans la région jumelée. Elle n'ajoute pas de vérification avant les opérations destructrices sur les sauvegardes hybrides.
    d:
      en: |-
        A customer-managed key controls the encryption of the backup data. It doesn't stop an administrator of the server from deleting the backups.
      fr: |-
        Une clé gérée par le client contrôle le chiffrement des données de sauvegarde. Elle n'empêche pas un administrateur du serveur de supprimer les sauvegardes.
references:
  - title: Security features to help protect hybrid backups that use Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-security-feature
