id: sc100-1b-vendor-access
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Entra ID P2 and Microsoft Entra ID Governance. A maintenance vendor has its own Microsoft Entra tenant. About 40 vendor technicians need access to a SaaS maintenance application and to a SharePoint Online site for the duration of a six-month contract.

    After a supply chain incident at a competitor, the CISO sets the following requirements:

    - Vendor access must end automatically when the contract ends, without relying on reviewers.
    - Guest accounts that no longer have any access must be removed from the Northwind tenant.
    - Vendor technicians must request access, and a Northwind manager must approve each request.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Entra ID P2 et Microsoft Entra ID Governance. Un prestataire de maintenance dispose de son propre locataire Microsoft Entra. Environ 40 techniciens du prestataire ont besoin d'accéder à une application SaaS de maintenance et à un site SharePoint Online pendant la durée d'un contrat de six mois.

    Après un incident de la chaîne d'approvisionnement chez un concurrent, le RSSI fixe les exigences suivantes :

    - L'accès du prestataire doit prendre fin automatiquement à la fin du contrat, sans dépendre de réviseurs.
    - Les comptes invités qui n'ont plus aucun accès doivent être supprimés du locataire de Northwind.
    - Les techniciens du prestataire doivent demander l'accès, et un responsable de Northwind doit approuver chaque demande.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the vendor's tenant as a connected organization in entitlement management", fr: "Ajouter le locataire du prestataire comme organisation connectée dans la gestion des droits d'utilisation" } }
    - { id: b, text: { en: "Configure B2B direct connect with the vendor's tenant in the cross-tenant access settings", fr: "Configurer B2B direct connect avec le locataire du prestataire dans les paramètres d'accès interlocataire" } }
    - { id: c, text: { en: "Create a monthly access review of all guest users, with the vendor manager as the reviewer", fr: "Créer une révision d'accès mensuelle de tous les utilisateurs invités, avec le responsable du prestataire comme réviseur" } }
    - { id: d, text: { en: "Create an access package with both resources, an approval step and an assignment expiration", fr: "Créer un package d'accès avec les deux ressources, une étape d'approbation et une expiration des attributions" } }
    - { id: e, text: { en: "Invite the technicians as guests and make them eligible members of a group in PIM for Groups", fr: "Inviter les techniciens comme invités et les rendre membres éligibles d'un groupe dans PIM pour les groupes" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      A connected organization lets users from the vendor's tenant request an access package. The access package bundles the application and the site, requires approval and expires its assignments at the end of the contract. By default, when a guest invited through entitlement management loses its last assignment, the account is blocked from signing in and removed after 30 days.
    fr: |-
      Une organisation connectée permet aux utilisateurs du locataire du prestataire de demander un package d'accès. Le package d'accès regroupe l'application et le site, exige une approbation et fait expirer ses attributions à la fin du contrat. Par défaut, quand un invité ajouté par la gestion des droits d'utilisation perd sa dernière attribution, son compte est bloqué à la connexion puis supprimé au bout de 30 jours.
  options:
    b:
      en: |-
        B2B direct connect is used for Teams shared channels; it doesn't grant time-limited access to an application and a SharePoint site.
      fr: |-
        B2B direct connect sert aux canaux partagés Teams ; il n'accorde pas d'accès limité dans le temps à une application et à un site SharePoint.
    c:
      en: |-
        An access review depends on reviewers, which the CISO excludes, and doesn't remove access at a fixed contract end date.
      fr: |-
        Une révision d'accès dépend de réviseurs, ce que le RSSI exclut, et ne retire pas l'accès à la date de fin du contrat.
    e:
      en: |-
        PIM for Groups provides just-in-time membership, but manual invitations provide no request and approval flow and no automatic removal of unused guest accounts.
      fr: |-
        PIM pour les groupes fournit une appartenance juste-à-temps, mais des invitations manuelles n'offrent ni flux de demande et d'approbation ni suppression automatique des comptes invités inutilisés.
references:
  - title: Govern access for external users in entitlement management - Microsoft Entra ID Governance
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-external-users
