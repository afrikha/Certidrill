id: sc100-1b-ai-adopt-platform
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The HR department of Fabrikam, Inc. wants an AI agent that answers employee questions about HR policies by using documents stored in SharePoint Online. The HR team has two business analysts and no developers or data scientists. Fabrikam uses Microsoft 365 E5 and Azure.

    The AI adoption strategy of Fabrikam follows the Cloud Adoption Framework for Azure (CAF). The solution must minimize the operational and security responsibility of Fabrikam.

    What should you recommend?
  fr: |
    Le service RH de Fabrikam, Inc. veut un agent d'IA qui répond aux questions des employés sur les politiques RH à partir de documents stockés dans SharePoint Online. L'équipe RH compte deux analystes métier et aucun développeur ni data scientist. Fabrikam utilise Microsoft 365 E5 et Azure.

    La stratégie d'adoption de l'IA de Fabrikam suit le Cloud Adoption Framework pour Azure (CAF). La solution doit réduire au minimum la responsabilité opérationnelle et de sécurité de Fabrikam.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A custom agent built in Microsoft Foundry with the SharePoint documents as a knowledge source", fr: "Un agent personnalisé créé dans Microsoft Foundry avec les documents SharePoint comme source de connaissances" } }
    - { id: b, text: { en: "An agent built in Microsoft Copilot Studio with the SharePoint site as a knowledge source", fr: "Un agent créé dans Microsoft Copilot Studio avec le site SharePoint comme source de connaissances" } }
    - { id: c, text: { en: "An open-source model hosted on Azure virtual machines with GPUs, indexed on the SharePoint documents", fr: "Un modèle open source hébergé sur des machines virtuelles Azure avec GPU, indexé sur les documents SharePoint" } }
    - { id: d, text: { en: "A model trained in Azure Machine Learning on the SharePoint documents and exposed through an endpoint", fr: "Un modèle entraîné dans Azure Machine Learning sur les documents SharePoint et exposé par un point de terminaison" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CAF recommends the AI option that meets the requirements with the least operational responsibility. Copilot Studio is the SaaS option for low-code agent creation, suited to business users, and Microsoft operates the platform, so Fabrikam keeps fewer components to secure.
    fr: |-
      Le CAF recommande l'option d'IA qui répond aux exigences avec le moins de responsabilité opérationnelle. Copilot Studio est l'option SaaS pour créer des agents en low-code, adaptée aux utilisateurs métier, et Microsoft exploite la plateforme : Fabrikam conserve moins de composants à sécuriser.
  options:
    a:
      en: |-
        Foundry is the PaaS option for custom AI apps and agents; it requires developers and leaves more configuration to secure.
      fr: |-
        Foundry est l'option PaaS pour les applications et agents d'IA personnalisés ; elle exige des développeurs et laisse davantage de configuration à sécuriser.
    c:
      en: |-
        CAF states that AI on Azure infrastructure shouldn't be the default approach; it brings the most operational responsibility.
      fr: |-
        Le CAF indique que l'IA sur l'infrastructure Azure ne doit pas être l'approche par défaut ; elle apporte la plus grande responsabilité opérationnelle.
    d:
      en: |-
        Training a model requires data science skills and isn't needed to answer questions from existing documents.
      fr: |-
        Entraîner un modèle exige des compétences en science des données et n'est pas nécessaire pour répondre à des questions à partir de documents existants.
references:
  - title: AI adoption - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/
