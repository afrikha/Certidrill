id: sc100-1a-recovery-dependencies
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has an on-premises AD DS forest, file servers, and Azure virtual machines that are protected by Azure Backup. Azure Site Recovery replicates the file servers to Azure. The restore procedures, the configuration management database (CMDB) and the network diagrams are stored on a file share in the datacenter.

    You are updating the BCDR plan so that the company can recover from a ransomware attack in which the attacker also targets the recovery process.

    Which two actions should you include in the plan? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'une forêt AD DS locale, de serveurs de fichiers et de machines virtuelles Azure protégées par la Sauvegarde Azure. Azure Site Recovery réplique les serveurs de fichiers vers Azure. Les procédures de restauration, la base de données de gestion des configurations (CMDB) et les schémas réseau sont stockés sur un partage de fichiers du centre de données.

    Vous mettez à jour le plan BCDR pour que l'entreprise puisse se remettre d'une attaque par rançongiciel dans laquelle l'attaquant cible aussi le processus de récupération.

    Quelles sont les deux actions que vous devez inclure dans le plan ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Exclude the domain controllers from backup, because they can be rebuilt from Microsoft Entra ID", fr: "Exclure les contrôleurs de domaine de la sauvegarde, car ils peuvent être reconstruits à partir de Microsoft Entra ID" } }
    - { id: b, text: { en: "Keep the Site Recovery replicas as the only recovery copies of the file servers", fr: "Conserver les réplicas Site Recovery comme seules copies de récupération des serveurs de fichiers" } }
    - { id: c, text: { en: "Include the AD DS domain controllers in the automated, scheduled backups", fr: "Inclure les contrôleurs de domaine AD DS dans les sauvegardes automatiques planifiées" } }
    - { id: d, text: { en: "Move the recovery documents to the IT SharePoint site that the operations team uses every day", fr: "Déplacer les documents de récupération vers le site SharePoint informatique que l'équipe d'exploitation utilise chaque jour" } }
    - { id: e, text: { en: "Protect the restore procedures, the CMDB and the network diagrams, for example by keeping printed copies", fr: "Protéger les procédures de restauration, la CMDB et les schémas réseau, par exemple en conservant des copies imprimées" } }
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: |
      Identity systems such as Active Directory come first in Microsoft's backup and restore priority order, and Microsoft warns that existing backups often miss critical IT systems such as AD DS domain controllers. Attackers also target the documents needed to recover, so the restore procedures, the CMDB and the network diagrams must be protected or printed, out of the attacker's reach.
    fr: |
      Les systèmes d'identité comme Active Directory viennent en premier dans l'ordre de priorité de sauvegarde et de restauration de Microsoft, et Microsoft avertit que les sauvegardes existantes oublient souvent des systèmes informatiques critiques comme les contrôleurs de domaine AD DS. Les attaquants ciblent aussi les documents nécessaires à la récupération : les procédures de restauration, la CMDB et les schémas réseau doivent être protégés ou imprimés, hors de portée de l'attaquant.
  options:
    a:
      en: |-
        Microsoft Entra ID doesn't hold the AD DS forest. Without a backup of the domain controllers, the on-premises identity system can't be recovered.
      fr: |-
        Microsoft Entra ID ne contient pas la forêt AD DS. Sans sauvegarde des contrôleurs de domaine, le système d'identité local ne peut pas être récupéré.
    b:
      en: |-
        Replicas can contain encrypted data when encryption is detected late. They don't replace protected, long-retention backups.
      fr: |-
        Les réplicas peuvent contenir des données chiffrées quand le chiffrement est détecté tard. Ils ne remplacent pas des sauvegardes protégées à longue rétention.
    d:
      en: |-
        A site that the production accounts reach every day is exposed to the same attacker. The documents must be kept where the attack can't reach them.
      fr: |-
        Un site auquel les comptes de production accèdent chaque jour est exposé au même attaquant. Les documents doivent être conservés hors de portée de l'attaque.
references:
  - title: Ransomware attack recovery plan
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase1
  - title: Backup and restore plan to protect against ransomware
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware
