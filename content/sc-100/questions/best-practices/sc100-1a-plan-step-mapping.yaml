id: sc100-1a-plan-step-mapping
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is building a ransomware mitigation roadmap based on Microsoft's plan to protect against ransomware. The security architect proposed the following controls and must assign each one to the step of the plan that it belongs to.

    Which step should you assign to each control? To answer, drag the appropriate steps to the correct controls. Each step may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys élabore une feuille de route d'atténuation des rançongiciels fondée sur le plan de Microsoft pour se protéger contre les rançongiciels. L'architecte de sécurité a proposé les contrôles suivants et doit affecter chacun à l'étape du plan à laquelle il appartient.

    Quelle étape devez-vous affecter à chaque contrôle ? Pour répondre, faites glisser les étapes appropriées vers les contrôles correspondants. Chaque étape peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: step1, text: { en: "Step 1: Prepare the ransomware recovery plan", fr: "Étape 1 : préparer le plan de récupération" } }
    - { id: step2, text: { en: "Step 2: Limit the scope of ransomware damage", fr: "Étape 2 : limiter l'étendue des dégâts" } }
    - { id: step3, text: { en: "Step 3: Make it hard for cybercriminals to get in", fr: "Étape 3 : rendre l'accès difficile aux cybercriminels" } }
  targets:
    - id: t1
      text: { en: "Store the backups in online immutable storage", fr: "Stocker les sauvegardes dans un stockage immuable en ligne" }
    - id: t2
      text: { en: "Require secure workstations for all administrators", fr: "Exiger des stations de travail sécurisées pour tous les administrateurs" }
    - id: t3
      text: { en: "Publish on-premises web apps with Microsoft Entra application proxy instead of a VPN", fr: "Publier les applications web locales avec le proxy d'application Microsoft Entra au lieu d'un VPN" }
    - id: t4
      text: { en: "Designate protected folders to block unauthorized applications from changing data", fr: "Désigner des dossiers protégés pour empêcher les applications non autorisées de modifier les données" }
    - id: t5
      text: { en: "Deploy attack surface reduction rules for Office in audit mode, then in block mode", fr: "Déployer les règles de réduction de la surface d'attaque pour Office en mode audit, puis en mode blocage" }
answer:
  mapping: { t1: step1, t2: step2, t3: step3, t4: step1, t5: step3 }
explanation:
  correct:
    en: |
      Step 1 covers secure backups, such as online immutable storage, and data protection, such as protected folders. Step 2 protects privileged access, including secure workstations for administrators. Step 3 hardens the entry points: remote access, such as publishing apps with Microsoft Entra application proxy, and email and collaboration, such as attack surface reduction rules deployed in audit mode before block mode.
    fr: |
      L'étape 1 couvre les sauvegardes sécurisées, comme le stockage immuable en ligne, et la protection des données, comme les dossiers protégés. L'étape 2 protège l'accès privilégié, notamment avec des stations de travail sécurisées pour les administrateurs. L'étape 3 durcit les points d'entrée : l'accès à distance, comme la publication d'applications avec le proxy d'application Microsoft Entra, et l'e-mail et la collaboration, comme les règles de réduction de la surface d'attaque déployées en mode audit avant le mode blocage.
references:
  - title: Ransomware attack recovery plan
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase1
  - title: Defend against ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase3
