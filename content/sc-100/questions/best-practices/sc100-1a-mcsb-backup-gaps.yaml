id: sc100-1a-mcsb-backup-gaps
objective: "1.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation assesses its Azure backup design against the Backup and Recovery (BR) domain of the Microsoft cloud security benchmark (MCSB) v2. The design is as follows:

    - Azure Policy enforces Azure Backup on every virtual machine, with daily backups and 30 days of retention.
    - Backup Reports in Log Analytics and alerts on job failures, disabled protection and retention reductions are sent to the SOC.
    - Soft delete is enabled on the Recovery Services vaults. Immutability and multi-user authorization are disabled, and the backup administrators hold permanent Backup Contributor assignments.
    - No restore has been performed since the vaults were created.

    Which two MCSB controls does the design fail to meet?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation évalue sa conception de sauvegarde Azure par rapport au domaine Backup and Recovery (BR) du Microsoft cloud security benchmark (MCSB) v2. La conception est la suivante :

    - Azure Policy impose la Sauvegarde Azure sur chaque machine virtuelle, avec des sauvegardes quotidiennes et 30 jours de rétention.
    - Les rapports de sauvegarde dans Log Analytics et les alertes sur les échecs de travaux, la désactivation de la protection et les réductions de rétention sont envoyés au SOC.
    - La suppression réversible est activée sur les coffres Recovery Services. L'immuabilité et l'autorisation multi-utilisateur sont désactivées, et les administrateurs de sauvegarde détiennent des attributions Backup Contributor permanentes.
    - Aucune restauration n'a été effectuée depuis la création des coffres.

    Quels sont les deux contrôles du MCSB que la conception ne respecte pas ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "BR-1: Ensure regular automated backups" }
    - { id: b, text: "BR-2: Protect backup and recovery data" }
    - { id: c, text: "BR-3: Monitor backups" }
    - { id: d, text: "BR-4: Regularly test backup" }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      BR-2 asks for least-privilege access with just-in-time elevation through Privileged Identity Management, immutable vaults and multi-user authorization so that a single administrator can't weaken protection; soft delete alone doesn't meet it. BR-4 asks to restore backups regularly to isolated environments and measure the recovery time against the RTO, and no restore has ever been tested.
    fr: |
      BR-2 demande un accès du moindre privilège avec une élévation juste-à-temps par Privileged Identity Management, des coffres immuables et l'autorisation multi-utilisateur pour qu'un seul administrateur ne puisse pas affaiblir la protection ; la suppression réversible seule n'y répond pas. BR-4 demande de restaurer régulièrement les sauvegardes dans des environnements isolés et de mesurer le délai de récupération par rapport au RTO, or aucune restauration n'a jamais été testée.
  options:
    a:
      en: |-
        BR-1 is met, because Azure Policy enforces automated daily backups with a defined retention on every virtual machine.
      fr: |-
        BR-1 est respecté, car Azure Policy impose des sauvegardes quotidiennes automatisées avec une rétention définie sur chaque machine virtuelle.
    c:
      en: |-
        BR-3 is met, because Backup Reports and alerts on failures, disabled protection and retention reductions cover backup health and configuration changes.
      fr: |-
        BR-3 est respecté, car les rapports de sauvegarde et les alertes sur les échecs, la désactivation de la protection et les réductions de rétention couvrent l'intégrité des sauvegardes et les modifications de configuration.
references:
  - title: Backup and Recovery
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-backup-recovery
