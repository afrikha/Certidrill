id: sc100-1a-safe-restore-point
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. was hit by human-operated ransomware. The incident timeline shows that the attacker gained initial access and installed persistence 18 days ago, and that encryption started 6 days ago. The attacker has been evicted.

    The servers are backed up every day to an immutable Recovery Services vault with 30 days of retention, and Azure Site Recovery replicates the most critical servers to another region. You need to recommend a recovery approach that minimizes the risk of reinfection and restores the most important services first.

    What should you recommend?
  fr: |
    Contoso, Ltd. a été touchée par un rançongiciel à opération humaine. La chronologie de l'incident montre que l'attaquant a obtenu un accès initial et installé une persistance il y a 18 jours, et que le chiffrement a commencé il y a 6 jours. L'attaquant a été évincé.

    Les serveurs sont sauvegardés chaque jour dans un coffre Recovery Services immuable avec une rétention de 30 jours, et Azure Site Recovery réplique les serveurs les plus critiques vers une autre région. Vous devez recommander une approche de récupération qui réduit au minimum le risque de réinfection et restaure d'abord les services les plus importants.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Fail over the critical servers to their Site Recovery replicas, then restore the other servers from their latest recovery points", fr: "Basculer les serveurs critiques vers leurs réplicas Site Recovery, puis restaurer les autres serveurs à partir de leurs derniers points de récupération" } }
    - { id: b, text: { en: "Use recovery points from just before the encryption started, validate them, and restore the business-critical servers first", fr: "Utiliser les points de récupération d'avant le début du chiffrement, les valider, et restaurer d'abord les serveurs vitaux pour l'entreprise" } }
    - { id: c, text: { en: "Use recovery points from before the initial access, validate them, and restore the business-critical servers first", fr: "Utiliser les points de récupération d'avant l'accès initial, les valider, et restaurer d'abord les serveurs vitaux pour l'entreprise" } }
    - { id: d, text: { en: "Use recovery points from before the initial access, validate them, and restore the least critical servers first", fr: "Utiliser les points de récupération d'avant l'accès initial, les valider, et restaurer d'abord les serveurs les moins critiques" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft recommends using the incident timeline to identify a safe point-in-time backup that isn't infected, validating backups before restoring them, and restoring business-critical systems first. A recovery point from before the initial access excludes the attacker's persistence, at the cost of more data loss that must be recovered by other means.
    fr: |
      Microsoft recommande d'utiliser la chronologie de l'incident pour identifier une sauvegarde à un point dans le temps sûre et non infectée, de valider les sauvegardes avant de les restaurer, et de restaurer d'abord les systèmes vitaux pour l'entreprise. Un point de récupération d'avant l'accès initial exclut la persistance de l'attaquant, au prix d'une perte de données plus importante à récupérer par d'autres moyens.
  options:
    a:
      en: |-
        The replicas reproduce the current state of the servers, including encrypted data and the attacker's persistence.
      fr: |-
        Les réplicas reproduisent l'état actuel des serveurs, y compris les données chiffrées et la persistance de l'attaquant.
    b:
      en: |-
        Recovery points between the initial access and the encryption can contain the persistence that the attacker installed 18 days ago.
      fr: |-
        Les points de récupération situés entre l'accès initial et le chiffrement peuvent contenir la persistance que l'attaquant a installée il y a 18 jours.
    d:
      en: |-
        The guidance is to restore the business-critical systems first, so that the most important services return as soon as possible.
      fr: |-
        Les recommandations demandent de restaurer d'abord les systèmes vitaux, pour que les services les plus importants reviennent le plus tôt possible.
references:
  - title: Backup and restore plan to protect against ransomware
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware
