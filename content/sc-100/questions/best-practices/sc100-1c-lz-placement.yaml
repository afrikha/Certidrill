id: sc100-1c-lz-placement
objective: "1.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses the reference management group hierarchy of the Microsoft Cloud Adoption Framework for Azure (CAF) for its Azure landing zones. The platform team must place four subscriptions.

    | Subscription | Use |
    | --- | --- |
    | Sub-Shop | Public e-commerce website that needs direct internet connectivity |
    | Sub-Stock | Internal inventory application reached from the offices through the hub network |
    | Sub-Lab | Short-lived developer experiments, isolated from development, test and production |
    | Sub-Legacy | Retired workload whose subscription has been canceled |

    Which management group should you recommend for each subscription? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise la hiérarchie de groupes d'administration de référence du Microsoft Cloud Adoption Framework for Azure (CAF) pour ses zones d'atterrissage Azure. L'équipe de plateforme doit placer quatre abonnements.

    | Abonnement | Utilisation |
    | --- | --- |
    | Sub-Shop | Site de commerce électronique public qui a besoin d'une connectivité Internet directe |
    | Sub-Stock | Application d'inventaire interne accessible depuis les bureaux via le réseau hub |
    | Sub-Lab | Expérimentations de courte durée des développeurs, isolées du développement, du test et de la production |
    | Sub-Legacy | Charge de travail retirée dont l'abonnement a été résilié |

    Quel groupe d'administration devez-vous recommander pour chaque abonnement ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Sub-Shop: [[shop]]

      Sub-Stock: [[stock]]

      Sub-Lab: [[lab]]

      Sub-Legacy: [[legacy]]
    fr: |
      Sub-Shop : [[shop]]

      Sub-Stock : [[stock]]

      Sub-Lab : [[lab]]

      Sub-Legacy : [[legacy]]
  slots:
    - id: shop
      options:
        - { id: corp, text: Corp }
        - { id: online, text: Online }
        - { id: sandbox, text: Sandbox }
        - { id: decom, text: Decommissioned }
        - { id: conn, text: Connectivity }
    - id: stock
      options:
        - { id: corp, text: Corp }
        - { id: online, text: Online }
        - { id: sandbox, text: Sandbox }
        - { id: decom, text: Decommissioned }
        - { id: conn, text: Connectivity }
    - id: lab
      options:
        - { id: corp, text: Corp }
        - { id: online, text: Online }
        - { id: sandbox, text: Sandbox }
        - { id: decom, text: Decommissioned }
        - { id: conn, text: Connectivity }
    - id: legacy
      options:
        - { id: corp, text: Corp }
        - { id: online, text: Online }
        - { id: sandbox, text: Sandbox }
        - { id: decom, text: Decommissioned }
        - { id: conn, text: Connectivity }
answer:
  values: { shop: online, stock: corp, lab: sandbox, legacy: decom }
explanation:
  correct:
    en: |
      Under Landing zones, Online receives workloads that need direct internet connectivity and Corp receives workloads connected to the corporate network through the hub. Sandbox is for experimentation isolated from development, test and production, with a less restrictive policy set. Decommissioned holds canceled landing zones until Azure deletes their subscriptions, after 30 to 60 days.
    fr: |
      Sous Landing zones, Online accueille les charges de travail qui ont besoin d'une connectivité Internet directe et Corp celles qui sont connectées au réseau d'entreprise via le hub. Sandbox est destiné aux expérimentations isolées du développement, du test et de la production, avec un ensemble de stratégies moins restrictif. Decommissioned héberge les zones d'atterrissage résiliées jusqu'à ce qu'Azure supprime leurs abonnements, après 30 à 60 jours.
  options:
    conn:
      en: |-
        Connectivity is a Platform management group for shared networking resources such as hubs and firewalls, not for workloads.
      fr: |-
        Connectivity est un groupe d'administration Platform pour les ressources réseau partagées comme les hubs et les pare-feu, pas pour les charges de travail.
references:
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
