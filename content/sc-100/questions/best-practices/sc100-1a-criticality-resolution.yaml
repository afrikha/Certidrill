id: sc100-1a-criticality-resolution
objective: "1.1.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses critical asset management in Microsoft Security Exposure Management to prioritize threats to business-critical assets. Two assets match several classification rules:

    - **AKS-Prod**, an Azure Kubernetes Service cluster, matches *Premium tier Azure Kubernetes Service cluster* (High) and *Locked Azure Kubernetes Service cluster* (Low).
    - **SRV-BKP01**, an on-premises server, matches the predefined *Backup* classification (Medium) and a custom classification named *Recovery infrastructure* that the security team created with the Very High level.

    Answer each prompt by selecting the criticality level that Exposure Management assigns to the asset.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise la gestion des ressources critiques de Microsoft Security Exposure Management pour hiérarchiser les menaces qui pèsent sur ses ressources vitales pour l'entreprise. Deux ressources correspondent à plusieurs règles de classification :

    - **AKS-Prod**, un cluster Azure Kubernetes Service, correspond à *Premium tier Azure Kubernetes Service cluster* (High) et à *Locked Azure Kubernetes Service cluster* (Low).
    - **SRV-BKP01**, un serveur local, correspond à la classification prédéfinie *Backup* (Medium) et à une classification personnalisée nommée *Recovery infrastructure* que l'équipe de sécurité a créée avec le niveau Very High.

    Répondez à chaque consigne en sélectionnant le niveau de criticité qu'Exposure Management attribue à la ressource.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Criticality level of AKS-Prod", fr: "Niveau de criticité d'AKS-Prod" }
    - id: p2
      text: { en: "Criticality level of SRV-BKP01", fr: "Niveau de criticité de SRV-BKP01" }
  grid:
    header: [{ en: "Asset", fr: "Ressource" }, Low, Medium, High, Very High]
    rows:
      - [{ text: AKS-Prod }, { text: Low, area: aks-low }, { text: Medium, area: aks-med }, { text: High, area: aks-high }, { text: Very High, area: aks-vh }]
      - [{ text: SRV-BKP01 }, { text: Low, area: bkp-low }, { text: Medium, area: bkp-med }, { text: High, area: bkp-high }, { text: Very High, area: bkp-vh }]
answer:
  values: { p1: aks-high, p2: bkp-vh }
explanation:
  correct:
    en: |
      When several classification rules apply to an asset, the rule with the highest criticality level takes precedence, and the level reverts to the next applicable one only when the asset stops meeting that rule. AKS-Prod is therefore High, even though the lock rule alone would make it Low. Custom classifications follow the same logic, so SRV-BKP01 is Very High instead of the Medium level of the predefined Backup rule.
    fr: |
      Quand plusieurs règles de classification s'appliquent à une ressource, la règle de plus haut niveau de criticité l'emporte, et le niveau ne revient au suivant que lorsque la ressource ne remplit plus cette règle. AKS-Prod est donc High, même si la règle du verrou seule le placerait en Low. Les classifications personnalisées suivent la même logique : SRV-BKP01 est Very High au lieu du niveau Medium de la règle prédéfinie Backup.
references:
  - title: Predefined classifications
    url: https://learn.microsoft.com/en-us/security-exposure-management/predefined-classification-rules-and-levels
  - title: Overview of critical asset management
    url: https://learn.microsoft.com/en-us/security-exposure-management/critical-asset-management
