id: sc100-1a-ransomware-plan-order
objective: "1.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has no formal ransomware protection program. The company has an on-premises AD DS forest, Azure subscriptions and Microsoft 365. The CISO wants to follow the priority order of Microsoft's plan to protect against ransomware.

    Which three steps should the program follow in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders n'a aucun programme formel de protection contre les rançongiciels. L'entreprise dispose d'une forêt AD DS locale, d'abonnements Azure et de Microsoft 365. Le RSSI veut suivre l'ordre de priorité du plan de Microsoft pour se protéger contre les rançongiciels.

    Quelles sont les trois étapes que le programme doit suivre dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: recover, text: { en: "Prepare a ransomware recovery plan that doesn't depend on paying the ransom.", fr: "Préparer un plan de récupération qui ne dépend pas du paiement de la rançon." } }
    - { id: limit, text: { en: "Limit the scope of ransomware damage by protecting privileged roles.", fr: "Limiter l'étendue des dégâts en protégeant les rôles privilégiés." } }
    - { id: entry, text: { en: "Make it hard for attackers to get in through the common entry points.", fr: "Rendre l'accès difficile aux attaquants par les points d'entrée courants." } }
    - { id: inventory, text: { en: "Inventory every IT asset before starting any protection work.", fr: "Inventorier chaque ressource informatique avant de commencer tout travail de protection." } }
    - { id: siem, text: { en: "Deploy a SIEM before changing any other security control.", fr: "Déployer un SIEM avant de modifier tout autre contrôle de sécurité." } }
answer:
  sequence: [ recover, limit, entry ]
explanation:
  correct:
    en: |
      Microsoft's plan has three steps in priority order: prepare the recovery plan so that the organization can recover without paying, limit the damage by protecting privileged roles, then make it hard to get in at the common entry points. The third step takes the longest and must not slow down the first two.
    fr: |
      Le plan de Microsoft compte trois étapes par ordre de priorité : préparer le plan de récupération pour que l'organisation puisse récupérer sans payer, limiter les dégâts en protégeant les rôles privilégiés, puis rendre l'accès difficile aux points d'entrée courants. La troisième étape est la plus longue et ne doit pas ralentir les deux premières.
  options:
    inventory:
      en: |-
        Waiting for a complete inventory delays the backups and privileged access work that reduce risk fastest.
      fr: |-
        Attendre un inventaire complet retarde le travail sur les sauvegardes et l'accès privilégié, qui réduit le risque le plus vite.
    siem:
      en: |-
        Detection and response belong to the plan, but deploying a SIEM isn't a prerequisite for the other steps.
      fr: |-
        La détection et la réponse font partie du plan, mais le déploiement d'un SIEM n'est pas un prérequis des autres étapes.
references:
  - title: Quickly protect your organization against ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware
