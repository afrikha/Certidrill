id: sc100-1c-lz-environments
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Azure landing zones. A workload team is onboarding an internal payroll application that connects to the corporate network through the hub. The application needs development, test and production environments. All three environments must follow the same Corp policies, and a change in one environment must have no impact on the others.

    You need to recommend how to organize the environments. The solution must follow the management group recommendations of the Microsoft Cloud Adoption Framework for Azure (CAF).

    What should you recommend?
  fr: |
    Fabrikam, Inc. utilise des zones d'atterrissage Azure. Une équipe de charge de travail intègre une application de paie interne qui se connecte au réseau d'entreprise via le hub. L'application a besoin d'environnements de développement, de test et de production. Les trois environnements doivent suivre les mêmes stratégies Corp, et une modification dans un environnement ne doit avoir aucun impact sur les autres.

    Vous devez recommander comment organiser les environnements. La solution doit suivre les recommandations du Microsoft Cloud Adoption Framework for Azure (CAF) relatives aux groupes d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create Development, Test and Production management groups under Corp, each with one subscription", fr: "Créer des groupes d'administration Development, Test et Production sous Corp, chacun avec un abonnement" } }
    - { id: b, text: { en: "Create one subscription in Corp, with one resource group for each environment", fr: "Créer un abonnement dans Corp, avec un groupe de ressources pour chaque environnement" } }
    - { id: c, text: { en: "Create one subscription for each environment, and place the three subscriptions in Corp", fr: "Créer un abonnement pour chaque environnement, et placer les trois abonnements dans Corp" } }
    - { id: d, text: { en: "Place the production subscription in Corp, and the development and test subscriptions in Sandbox", fr: "Placer l'abonnement de production dans Corp, et les abonnements de développement et de test dans Sandbox" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The CAF recommends not creating management groups for production, test and development: the environments go into separate subscriptions within the same management group. Subscriptions are the unit of management and isolation between application environments, and placing all three in Corp gives them the same inherited policies.
    fr: |
      Le CAF recommande de ne pas créer de groupes d'administration pour la production, le test et le développement : les environnements vont dans des abonnements distincts au sein du même groupe d'administration. L'abonnement est l'unité de gestion et d'isolation entre les environnements d'une application, et placer les trois dans Corp leur donne les mêmes stratégies héritées.
  options:
    a:
      en: |-
        Management groups per environment deepen the hierarchy and duplicate policy assignments, which the CAF advises against.
      fr: |-
        Des groupes d'administration par environnement approfondissent la hiérarchie et dupliquent les attributions de stratégies, ce que le CAF déconseille.
    b:
      en: |-
        Resource groups in one subscription share its limits, access and settings, so a change in one environment can affect the others.
      fr: |-
        Des groupes de ressources dans un même abonnement en partagent les limites, les accès et les paramètres : une modification dans un environnement peut affecter les autres.
    d:
      en: |-
        Sandbox is for experiments isolated from development, test and production, with relaxed policies; the environments must follow the Corp policies.
      fr: |-
        Sandbox est destiné aux expérimentations isolées du développement, du test et de la production, avec des stratégies assouplies ; les environnements doivent suivre les stratégies Corp.
references:
