id: sc100-1c-govern-sequence
objective: "1.3.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. is moving its datacenter workloads to Azure and wants to set up cloud governance by following the Microsoft Cloud Adoption Framework for Azure (CAF). The company has already formed a cloud governance team that includes security, compliance and platform representatives and has an executive sponsor.

    You need to recommend the next steps of the governance process.

    Which four actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. migre les charges de travail de son centre de données vers Azure et souhaite mettre en place la gouvernance cloud en suivant le Microsoft Cloud Adoption Framework for Azure (CAF). L'entreprise a déjà constitué une équipe de gouvernance cloud qui comprend des représentants de la sécurité, de la conformité et de la plateforme, et qui dispose d'un sponsor exécutif.

    Vous devez recommander les étapes suivantes du processus de gouvernance.

    Quelles sont les quatre actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: document, text: { en: "Document cloud governance policies that address the identified risks.", fr: "Documenter des stratégies de gouvernance cloud qui traitent les risques identifiés." } }
    - { id: team, text: { en: "Build a cloud governance team.", fr: "Constituer une équipe de gouvernance cloud." } }
    - { id: monitor, text: { en: "Monitor cloud compliance.", fr: "Surveiller la conformité cloud." } }
    - { id: assess, text: { en: "Assess the cloud risks and record them in a risk register.", fr: "Évaluer les risques cloud et les consigner dans un registre des risques." } }
    - { id: war, text: { en: "Run a Well-Architected Review of each workload.", fr: "Effectuer une Well-Architected Review de chaque charge de travail." } }
    - { id: enforce, text: { en: "Enforce the cloud governance policies.", fr: "Appliquer les stratégies de gouvernance cloud." } }
answer:
  sequence: [assess, document, enforce, monitor]
explanation:
  correct:
    en: |
      The CAF governance process has five steps: build a cloud governance team, assess cloud risks, document cloud governance policies, enforce them and monitor cloud compliance. The first step is done once, and the other four repeat as a cycle. Policies are written from the risks, so the risk assessment comes before the documentation, and enforcement comes before monitoring.
    fr: |
      Le processus de gouvernance du CAF compte cinq étapes : constituer une équipe de gouvernance cloud, évaluer les risques cloud, documenter les stratégies de gouvernance cloud, les appliquer et surveiller la conformité cloud. La première étape est réalisée une fois, et les quatre autres se répètent en cycle. Les stratégies sont rédigées à partir des risques : l'évaluation des risques précède donc la documentation, et l'application précède la surveillance.
  options:
    team: { en: "The governance team already exists, so this step is complete.", fr: "L'équipe de gouvernance existe déjà : cette étape est terminée." }
    war: { en: "A Well-Architected Review evaluates the design of one workload; it isn't a step of the CAF governance process.", fr: "Une Well-Architected Review évalue la conception d'une charge de travail ; ce n'est pas une étape du processus de gouvernance du CAF." }
references:
  - title: Build a cloud governance team
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/
