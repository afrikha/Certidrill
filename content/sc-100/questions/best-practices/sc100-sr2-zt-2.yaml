status: draft
stem:
  en: |
    You recommend the "Prevent or reduce business damage from a breach" business scenario.
  fr: |
    Vous recommandez le scénario métier « Prevent or reduce business damage from a breach ».
body:
  solution:
    en: |
      You recommend that the program follow the **Prevent or reduce business damage from a breach** business scenario of the Zero Trust adoption framework.
    fr: |
      Vous recommandez que le programme suive le scénario métier **Prevent or reduce business damage from a breach** du framework d'adoption de la Confiance Zéro.
answer: { value: false }
explanation:
  correct:
    en: |
      This business scenario applies the assume-breach principle. It focuses on limiting the blast radius through segmentation, verifying end-to-end encryption, and building threat protection with XDR. It doesn't target strong authentication, device compliance, and app access for employees who work from home, which is the outcome Litware's executives want to sponsor.
    fr: |
      Ce scénario métier applique le principe « supposer une violation ». Il vise à limiter le rayon d'impact par la segmentation, à vérifier le chiffrement de bout en bout et à mettre en place la protection contre les menaces avec XDR. Il ne cible pas l'authentification forte, la conformité des appareils et l'accès aux applications pour des employés qui travaillent depuis leur domicile, qui est le résultat que la direction de Litware veut parrainer.
references:
  - title: Prevent or reduce business damage from a breach with Zero Trust
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/prevent-reduce-business-damage-breach
