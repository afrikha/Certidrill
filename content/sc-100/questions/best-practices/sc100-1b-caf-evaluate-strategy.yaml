id: sc100-1b-caf-evaluate-strategy
objective: "1.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You are evaluating the security and governance strategy of Fabrikam, Inc. against the Cloud Adoption Framework for Azure (CAF). Fabrikam has 40 subscriptions under a management group hierarchy and creates about five new subscriptions each quarter. You find the following practices:

    - The security policies, such as "storage accounts must disable public network access", are assigned at the management groups with the Audit effect only, so non-compliant resources keep being deployed.
    - Twelve operations engineers have permanent Owner role assignments on all the subscriptions.
    - A quarterly meeting reviews the list of non-compliant resources.

    You need to recommend changes that address the first two findings. The solution must minimize administrative effort and apply to future subscriptions.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez la stratégie de sécurité et de gouvernance de Fabrikam, Inc. par rapport au Cloud Adoption Framework pour Azure (CAF). Fabrikam dispose de 40 abonnements sous une hiérarchie de groupes d'administration et crée environ cinq nouveaux abonnements chaque trimestre. Vous constatez les pratiques suivantes :

    - Les stratégies de sécurité, comme « les comptes de stockage doivent désactiver l'accès réseau public », sont attribuées aux groupes d'administration avec l'effet Audit uniquement : des ressources non conformes continuent d'être déployées.
    - Douze ingénieurs d'exploitation ont des attributions permanentes du rôle Owner sur tous les abonnements.
    - Une réunion trimestrielle examine la liste des ressources non conformes.

    Vous devez recommander des changements qui traitent les deux premiers constats. La solution doit réduire au minimum l'effort d'administration et s'appliquer aux futurs abonnements.

    Quelles sont les deux actions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the security policies to each subscription with the Deny effect", fr: "Attribuer les stratégies de sécurité à chaque abonnement avec l'effet Deny" } }
    - { id: b, text: { en: "Change the effect of the management group assignments from Audit to Deny", fr: "Faire passer l'effet des attributions des groupes d'administration d'Audit à Deny" } }
    - { id: c, text: { en: "Hold the compliance review meeting every month instead of every quarter", fr: "Tenir la réunion de revue de conformité chaque mois au lieu de chaque trimestre" } }
    - { id: d, text: { en: "Replace the permanent Owner assignments with a custom role that is assigned permanently", fr: "Remplacer les attributions Owner permanentes par un rôle personnalisé attribué de façon permanente" } }
    - { id: e, text: { en: "Make the engineers eligible for the Owner role in Microsoft Entra PIM, with access reviews", fr: "Rendre les ingénieurs éligibles au rôle Owner dans Microsoft Entra PIM, avec des révisions d'accès" } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      CAF recommends automated enforcement with predeployment checks, so the Deny effect on the existing management group assignments blocks non-compliant deployments in all current and future subscriptions. For security governance, CAF recommends just-in-time access with PIM and access reviews instead of standing privileged access.
    fr: |-
      Le CAF recommande une application automatisée avec des contrôles avant déploiement : l'effet Deny sur les attributions existantes des groupes d'administration bloque les déploiements non conformes dans tous les abonnements actuels et futurs. Pour la gouvernance de la sécurité, le CAF recommande un accès juste-à-temps avec PIM et des révisions d'accès au lieu d'un accès privilégié permanent.
  options:
    a:
      en: |-
        Per-subscription assignments multiply the management effort and must be repeated for each new subscription, unlike inherited management group assignments.
      fr: |-
        Des attributions par abonnement multiplient l'effort de gestion et doivent être répétées pour chaque nouvel abonnement, contrairement aux attributions héritées des groupes d'administration.
    c:
      en: |-
        A more frequent manual review is still manual and doesn't prevent non-compliant deployments.
      fr: |-
        Une revue manuelle plus fréquente reste manuelle et n'empêche pas les déploiements non conformes.
    d:
      en: |-
        A custom role can reduce permissions, but a permanent assignment keeps standing access that PIM would remove.
      fr: |-
        Un rôle personnalisé peut réduire les autorisations, mais une attribution permanente conserve un accès permanent que PIM supprimerait.
references:
  - title: Enforce cloud governance policies - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/enforce-cloud-governance-policies
