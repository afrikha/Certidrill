id: sc100-1b-ai-adopt-phases
objective: "1.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is preparing its AI adoption by following the AI scenario of the Cloud Adoption Framework for Azure (CAF). The project manager lists four activities.

    In which step of the CAF AI adoption process should each activity take place? To answer, drag the appropriate steps to the correct activities. Each step may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prépare son adoption de l'IA en suivant le scénario IA du Cloud Adoption Framework pour Azure (CAF). Le chef de projet liste quatre activités.

    Dans quelle étape du processus d'adoption de l'IA du CAF chaque activité doit-elle avoir lieu ? Pour répondre, faites glisser les étapes appropriées vers les activités correspondantes. Chaque étape peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: plan, text: Plan }
    - { id: ready, text: Ready }
    - { id: govern, text: Govern }
    - { id: secure, text: Secure }
    - { id: manage, text: Manage }
  targets:
    - id: t1
      text: { en: "Turn the selected AI use cases into a plan to move them into production", fr: "Transformer les cas d'usage d'IA retenus en plan de mise en production" }
    - id: t2
      text: { en: "Determine how the AI workloads fit into the Azure landing zone", fr: "Déterminer comment les charges de travail d'IA s'intègrent à la zone d'atterrissage Azure" }
    - id: t3
      text: { en: "Document the policies for selecting and onboarding models", fr: "Documenter les stratégies de sélection et d'intégration des modèles" }
    - id: t4
      text: { en: "Threat model the AI systems with MITRE ATLAS and build an AI asset inventory", fr: "Modéliser les menaces des systèmes d'IA avec MITRE ATLAS et construire un inventaire des ressources d'IA" }
answer:
  mapping: { t1: plan, t2: ready, t3: govern, t4: secure }
explanation:
  correct:
    en: |-
      In the CAF AI scenario, Plan turns use cases into a production plan, and Ready determines how AI workloads fit into the Azure landing zone. Govern assesses AI risks and documents policies such as model selection and onboarding. Secure discovers AI risks (threat modeling with STRIDE, MITRE ATLAS and OWASP), protects AI resources (asset inventory) and detects threats.
    fr: |-
      Dans le scénario IA du CAF, Plan transforme les cas d'usage en plan de mise en production, et Ready détermine comment les charges de travail d'IA s'intègrent à la zone d'atterrissage Azure. Govern évalue les risques de l'IA et documente des stratégies comme la sélection et l'intégration des modèles. Secure découvre les risques de l'IA (modélisation des menaces avec STRIDE, MITRE ATLAS et l'OWASP), protège les ressources d'IA (inventaire) et détecte les menaces.
  options:
    manage:
      en: |-
        Manage covers the ongoing operation of AI workloads; none of these activities is an operational task.
      fr: |-
        Manage couvre l'exploitation continue des charges de travail d'IA ; aucune de ces activités n'est une tâche d'exploitation.
references:
  - title: AI adoption - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/
  - title: Govern AI - Guidance to set up your organization's AI governance process - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/govern
