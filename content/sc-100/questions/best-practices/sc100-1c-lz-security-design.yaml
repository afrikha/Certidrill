id: sc100-1c-lz-security-design
objective: "1.3.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is designing the security of its Azure landing zones by following the security design area of the Microsoft Cloud Adoption Framework for Azure (CAF). Auditors require one year of access audit history for Microsoft Entra ID and five years of retention for the Azure activity log.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation conçoit la sécurité de ses zones d'atterrissage Azure en suivant la zone de conception sécurité du Microsoft Cloud Adoption Framework for Azure (CAF). Les auditeurs exigent un an d'historique d'audit des accès pour Microsoft Entra ID et cinq ans de rétention pour le journal d'activité Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The CAF recommends enabling Defender for Cloud on all subscriptions and using Azure Policy to keep the subscriptions compliant.
        fr: Le CAF recommande d'activer Defender for Cloud sur tous les abonnements et d'utiliser Azure Policy pour maintenir leur conformité.
    - id: s2
      text:
        en: The reports of Microsoft Entra ID P2 keep the audit data long enough to meet the one-year requirement without any export.
        fr: Les rapports de Microsoft Entra ID P2 conservent les données d'audit assez longtemps pour respecter l'exigence d'un an sans aucune exportation.
    - id: s3
      text:
        en: To keep the activity log for five years, the CAF recommends exporting it to Azure Storage in addition to Azure Monitor Logs.
        fr: Pour conserver le journal d'activité pendant cinq ans, le CAF recommande de l'exporter vers Stockage Azure en plus des Journaux Azure Monitor.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The security design area recommends enabling Defender for Cloud for all subscriptions and using Azure Policy to ensure compliance. Microsoft Entra ID P1 and P2 reports have a 30-day retention period, so a one-year history requires exporting the data. The activity log is exported to Azure Monitor Logs for long-term retention, and to Azure Storage when it must be kept beyond two years.
    fr: |
      La zone de conception sécurité recommande d'activer Defender for Cloud pour tous les abonnements et d'utiliser Azure Policy pour garantir la conformité. Les rapports Microsoft Entra ID P1 et P2 ont une période de rétention de 30 jours : un historique d'un an exige donc d'exporter les données. Le journal d'activité est exporté vers les Journaux Azure Monitor pour une rétention à long terme, et vers Stockage Azure lorsqu'il doit être conservé au-delà de deux ans.
references:
  - title: Security design in Azure
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/security
