id: sc100-1c-dso-pipeline-hardening
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. builds and deploys its applications with Azure Pipelines. The pipelines run on self-hosted build agents that accept inbound connections from the internet. One pipeline identity deploys to both development and production, and any marketplace extension can be installed. The security team wants the build agents treated as high-value assets and the pipelines aligned with the Azure Well-Architected Framework guidance for a secure development lifecycle.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. génère et déploie ses applications avec Azure Pipelines. Les pipelines s'exécutent sur des agents de build auto-hébergés qui acceptent des connexions entrantes depuis Internet. Une seule identité de pipeline déploie à la fois en développement et en production, et n'importe quelle extension de la Place de marché peut être installée. L'équipe de sécurité souhaite que les agents de build soient traités comme des ressources à forte valeur et que les pipelines soient alignés sur les recommandations de l'Azure Well-Architected Framework pour un cycle de vie de développement sécurisé.

    Quelles sont les deux actions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run the builds on Microsoft-hosted agents instead of the internet-exposed self-hosted agents", fr: "Exécuter les builds sur des agents hébergés par Microsoft au lieu des agents auto-hébergés exposés sur Internet" } }
    - { id: b, text: { en: "Grant the pipeline identity Owner on every subscription so that one identity serves all the stages", fr: "Accorder à l'identité du pipeline le rôle Owner sur chaque abonnement pour qu'une seule identité serve toutes les étapes" } }
    - { id: c, text: { en: "Run the build agents in the production virtual network so that deployments stay on private addresses", fr: "Exécuter les agents de build dans le réseau virtuel de production pour que les déploiements restent sur des adresses privées" } }
    - { id: d, text: { en: "Separate the production stages from non-production ones, each with its own identity and approvals", fr: "Séparer les étapes de production des étapes hors production, chacune avec sa propre identité et ses approbations" } }
    - { id: e, text: { en: "Keep all marketplace extensions available, and review the pipeline logs for anomalies every week", fr: "Conserver toutes les extensions de la Place de marché, et examiner les journaux des pipelines chaque semaine pour détecter les anomalies" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      The Well-Architected Framework treats build agents as high-value assets: prefer Microsoft-hosted agents, restrict inbound access and allow only controlled outbound traffic. It also asks to segment the pipeline stages and separate production from non-production, so that a compromise of a development stage can't reach production. Only trusted pipeline tasks and extensions should be allowed.
    fr: |
      Le Well-Architected Framework traite les agents de build comme des ressources à forte valeur : privilégier les agents hébergés par Microsoft, restreindre l'accès entrant et n'autoriser qu'un trafic sortant contrôlé. Il demande aussi de segmenter les étapes du pipeline et de séparer la production du hors-production, pour qu'une compromission d'une étape de développement ne puisse pas atteindre la production. Seules des tâches et des extensions de pipeline approuvées doivent être autorisées.
  options:
    b:
      en: |-
        One Owner identity across all subscriptions maximizes the blast radius of a compromised pipeline, against least privilege.
      fr: |-
        Une seule identité Owner sur tous les abonnements maximise le rayon d'impact d'un pipeline compromis, à l'encontre du moindre privilège.
    c:
      en: |-
        Placing build agents in the production network removes the separation between build and production that the guidance requires.
      fr: |-
        Placer les agents de build dans le réseau de production supprime la séparation entre build et production qu'exigent les recommandations.
    e:
      en: |-
        The guidance allows only trusted tasks and extensions; a weekly log review detects abuse after the fact.
      fr: |-
        Les recommandations n'autorisent que des tâches et des extensions approuvées ; une revue hebdomadaire des journaux détecte les abus après coup.
references:
  - title: Architecture strategies for securing a development lifecycle
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/secure-development-lifecycle
