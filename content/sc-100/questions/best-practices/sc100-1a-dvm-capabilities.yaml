id: sc100-1a-dvm-capabilities
objective: "1.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Defender Vulnerability Management for all its devices, and its endpoint team manages the Windows devices with Microsoft Intune. The CISO defined four requirements for the security update process.

    Which capability should you recommend for each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Defender Vulnerability Management pour tous ses appareils, et son équipe des points de terminaison gère les appareils Windows avec Microsoft Intune. Le RSSI a défini quatre exigences pour le processus de mises à jour de sécurité.

    Quelle capacité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les capacités appropriées vers les exigences correspondantes. Chaque capacité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: block, text: { en: "Block vulnerable applications", fr: "Bloquer les applications vulnérables" } }
    - { id: task, text: { en: "Intune remediation tasks", fr: "Tâches de correction Intune" } }
    - { id: baseline, text: { en: "Security baselines assessment", fr: "Évaluation des bases de référence de sécurité" } }
    - { id: cert, text: { en: "Certificate inventory", fr: "Inventaire des certificats" } }
    - { id: periodic, text: { en: "Periodic assessment", fr: "Évaluation périodique" } }
    - { id: hotpatch, text: Hotpatching }
  targets:
    - id: t1
      text: { en: "Prevent a vulnerable version of an application from running on a device group until it is updated", fr: "Empêcher une version vulnérable d'une application de s'exécuter sur un groupe d'appareils jusqu'à sa mise à jour" }
    - id: t2
      text: { en: "Hand the fix of a recommendation to the endpoint team in the tool that it already uses", fr: "Confier la correction d'une recommandation à l'équipe des points de terminaison dans l'outil qu'elle utilise déjà" }
    - id: t3
      text: { en: "Measure the device configurations against CIS and STIG benchmarks", fr: "Mesurer les configurations des appareils par rapport aux benchmarks CIS et STIG" }
    - id: t4
      text: { en: "Find certificates that are about to expire or that use weak signature algorithms", fr: "Trouver les certificats sur le point d'expirer ou qui utilisent des algorithmes de signature faibles" }
answer:
  mapping: { t1: block, t2: task, t3: baseline, t4: cert }
explanation:
  correct:
    en: |
      Defender Vulnerability Management can block vulnerable applications for device groups, create Intune remediation tasks from a recommendation, assess security baselines against benchmarks such as CIS and STIG, and inventory digital certificates to flag expiration and weak signature algorithms.
    fr: |
      Defender Vulnerability Management peut bloquer des applications vulnérables pour des groupes d'appareils, créer des tâches de correction Intune à partir d'une recommandation, évaluer les bases de référence de sécurité par rapport à des benchmarks comme CIS et STIG, et inventorier les certificats numériques pour signaler leur expiration et les algorithmes de signature faibles.
  options:
    periodic:
      en: |-
        Periodic assessment is an Azure Update Manager capability that checks servers for missing updates every 24 hours.
      fr: |-
        L'évaluation périodique est une capacité d'Azure Update Manager qui recherche toutes les 24 heures les mises à jour manquantes sur les serveurs.
    hotpatch:
      en: |-
        Hotpatching installs security updates without a restart; it doesn't meet any of the four requirements.
      fr: |-
        Le hotpatching installe des mises à jour de sécurité sans redémarrage ; il ne répond à aucune des quatre exigences.
references:
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
