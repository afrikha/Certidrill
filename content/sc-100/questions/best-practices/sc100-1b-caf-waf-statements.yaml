id: sc100-1b-caf-waf-statements
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is designing a security and governance strategy based on the Cloud Adoption Framework for Azure (CAF) and the Azure Well-Architected Framework (WAF). The architecture board reviews the following statements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. conçoit une stratégie de sécurité et de gouvernance fondée sur le Cloud Adoption Framework pour Azure (CAF) et Azure Well-Architected Framework (WAF). Le comité d'architecture examine les affirmations suivantes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Azure Advisor recommendations can be broken down by the pillars of the WAF.
        fr: |-
          Les recommandations d'Azure Advisor peuvent être réparties selon les piliers du WAF.
    - id: s2
      text:
        en: |-
          The WAF Security pillar is designed to define the governance policies that apply to all the subscriptions and business units of the organization.
        fr: |-
          Le pilier Sécurité du WAF est conçu pour définir les stratégies de gouvernance qui s'appliquent à tous les abonnements et à toutes les divisions de l'organisation.
    - id: s3
      text:
        en: |-
          CAF recommends manual enforcement, such as checklists, training and audits, where automated enforcement of a governance policy isn't practical.
        fr: |-
          Le CAF recommande une application manuelle, comme des listes de contrôle, des formations et des audits, là où l'application automatisée d'une stratégie de gouvernance n'est pas réalisable.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Azure Advisor uses the WAF pillars to generate its recommendations, and the Advisor score can be broken down by pillar. The WAF guides the design of individual workloads; organization-wide governance policies are the scope of the CAF Govern methodology. CAF recommends automating enforcement wherever feasible and using manual practices only where automation isn't practical.
    fr: |-
      Azure Advisor s'appuie sur les piliers du WAF pour générer ses recommandations, et le score Advisor peut être réparti par pilier. Le WAF guide la conception de charges de travail individuelles ; les stratégies de gouvernance à l'échelle de l'organisation relèvent de la méthodologie Govern du CAF. Le CAF recommande d'automatiser l'application partout où c'est possible et de n'utiliser des pratiques manuelles que là où l'automatisation n'est pas réalisable.
references:
  - title: Microsoft Azure Well-Architected Framework - Microsoft Azure Well-Architected Framework
    url: https://learn.microsoft.com/en-us/azure/well-architected/pillars
  - title: Enforce cloud governance policies - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/enforce-cloud-governance-policies
