id: sc100-1c-dso-oidc
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. deploys Azure resources from GitHub Actions workflows. The workflows authenticate by using a service principal whose client secret is stored as a GitHub secret. A Zero Trust review of the DevOps environment requires that no long-lived Azure credential is stored in GitHub. The change must not add infrastructure to maintain.

    You need to recommend a solution.

    What should you recommend?
  fr: |
    Contoso, Ltd. déploie des ressources Azure depuis des workflows GitHub Actions. Les workflows s'authentifient au moyen d'un principal de service dont le secret client est stocké comme secret GitHub. Une revue Confiance Zéro de l'environnement DevOps exige qu'aucune information d'identification Azure de longue durée ne soit stockée dans GitHub. La modification ne doit pas ajouter d'infrastructure à maintenir.

    Vous devez recommander une solution.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Configure Azure to trust GitHub's OpenID Connect provider as a federated identity for the workflows", fr: "Configurer Azure pour approuver le fournisseur OpenID Connect de GitHub comme identité fédérée pour les workflows" } }
    - { id: b, text: { en: "Move the client secret to Azure Key Vault, and have each workflow read it at run time", fr: "Déplacer le secret client vers Azure Key Vault, et faire lire le secret par chaque workflow à l'exécution" } }
    - { id: c, text: { en: "Replace the client secret with a certificate stored as an encrypted GitHub secret", fr: "Remplacer le secret client par un certificat stocké comme secret GitHub chiffré" } }
    - { id: d, text: { en: "Shorten the lifetime of the client secret, and rotate it automatically with Azure Automation", fr: "Raccourcir la durée de vie du secret client, et le renouveler automatiquement avec Azure Automation" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Microsoft's Zero Trust guidance for DevOps recommends configuring Azure to trust GitHub's OpenID Connect (OIDC) as a federated identity. The workflows then exchange a short-lived GitHub token for Azure access, without storing Azure credentials as long-lived GitHub secrets. Federation is configuration on the identity, so there's no runner, vault or rotation job to maintain.
    fr: |
      Les recommandations Confiance Zéro de Microsoft pour DevOps préconisent de configurer Azure pour approuver l'OpenID Connect (OIDC) de GitHub comme identité fédérée. Les workflows échangent alors un jeton GitHub de courte durée contre un accès Azure, sans stocker d'informations d'identification Azure comme secrets GitHub de longue durée. La fédération est une configuration de l'identité : il n'y a ni runner, ni coffre, ni tâche de rotation à maintenir.
  options:
    b:
      en: |-
        To read Key Vault, the workflow must first authenticate to Azure, so a stored credential would still be needed.
      fr: |-
        Pour lire Key Vault, le workflow doit d'abord s'authentifier auprès d'Azure : une information d'identification stockée resterait nécessaire.
    c:
      en: |-
        A certificate stored in GitHub is still a long-lived credential kept in GitHub.
      fr: |-
        Un certificat stocké dans GitHub reste une information d'identification de longue durée conservée dans GitHub.
    d:
      en: |-
        Rotation reduces the exposure window, but a secret is still stored in GitHub and an Automation job is added to maintain.
      fr: |-
        La rotation réduit la fenêtre d'exposition, mais un secret reste stocké dans GitHub et une tâche Automation s'ajoute à maintenir.
references:
  - title: Secure DevOps environments for Zero Trust
    url: https://learn.microsoft.com/en-us/security/zero-trust/develop/secure-devops-environments-zero-trust
