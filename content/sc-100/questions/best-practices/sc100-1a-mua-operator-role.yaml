id: sc100-1a-mua-operator-role
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank protects its Azure workloads with Recovery Services vaults. Multi-user authorization (MUA) is enabled on every vault with a Resource Guard named RG-Backup that the security team owns in a separate tenant. The backup administrators have the Backup Contributor role on the vaults and the Reader role on RG-Backup.

    A backup administrator must reduce the retention of one backup policy once, for a decommissioned application. The solution must follow the principle of least privilege, keep every vault protected, and ensure that the backup administrator can't delete RG-Backup.

    What should you recommend?
  fr: |
    Woodgrove Bank protège ses charges de travail Azure avec des coffres Recovery Services. L'autorisation multi-utilisateur (MUA) est activée sur chaque coffre avec un Resource Guard nommé RG-Backup que l'équipe de sécurité détient dans un locataire distinct. Les administrateurs de sauvegarde ont le rôle Backup Contributor sur les coffres et le rôle Reader sur RG-Backup.

    Un administrateur de sauvegarde doit réduire une seule fois la rétention d'une stratégie de sauvegarde, pour une application retirée du service. La solution doit respecter le principe du moindre privilège, garder chaque coffre protégé et garantir que l'administrateur de sauvegarde ne peut pas supprimer RG-Backup.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The security team grants the Backup MUA Operator role on RG-Backup just in time, then removes it", fr: "L'équipe de sécurité accorde juste-à-temps le rôle Backup MUA Operator sur RG-Backup, puis le retire" } }
    - { id: b, text: { en: "The security team grants the Contributor role on RG-Backup just in time, then removes it", fr: "L'équipe de sécurité accorde juste-à-temps le rôle Contributor sur RG-Backup, puis le retire" } }
    - { id: c, text: { en: "The security team assigns the Backup MUA Admin role on RG-Backup permanently to the backup team", fr: "L'équipe de sécurité attribue de façon permanente le rôle Backup MUA Admin sur RG-Backup à l'équipe de sauvegarde" } }
    - { id: d, text: { en: "The security team excludes the Modify policy operation from the protection of RG-Backup", fr: "L'équipe de sécurité exclut l'opération Modify policy de la protection de RG-Backup" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Backup MUA Operator lets a user perform only the critical operations that the Resource Guard protects, and it doesn't allow deleting the Resource Guard. Microsoft recommends that the backup administrator request access, for example through Microsoft Entra Privileged Identity Management, and that the security administrator grant this role temporarily and revoke it after the operation.
    fr: |
      Backup MUA Operator permet uniquement d'effectuer les opérations critiques que le Resource Guard protège, et ne permet pas de supprimer le Resource Guard. Microsoft recommande que l'administrateur de sauvegarde demande l'accès, par exemple par Microsoft Entra Privileged Identity Management, et que l'administrateur de sécurité accorde ce rôle temporairement puis le révoque après l'opération.
  options:
    b:
      en: |-
        Contributor on the Resource Guard also grants permission to delete it, which violates the requirement.
      fr: |-
        Le rôle Contributor sur le Resource Guard accorde aussi l'autorisation de le supprimer, ce qui enfreint l'exigence.
    c:
      en: |-
        Backup MUA Admin is the role of the Resource Guard owner. It grants delete permissions on the Resource Guard, and a permanent assignment removes the second authorization.
      fr: |-
        Backup MUA Admin est le rôle du propriétaire du Resource Guard. Il accorde des autorisations de suppression sur le Resource Guard, et une attribution permanente supprime la seconde autorisation.
    d:
      en: |-
        An excluded operation is excluded for all the vaults associated with the Resource Guard, so every vault would lose that protection.
      fr: |-
        Une opération exclue l'est pour tous les coffres associés au Resource Guard : chaque coffre perdrait donc cette protection.
references:
  - title: Multiuser authorization using Resource Guard
    url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
