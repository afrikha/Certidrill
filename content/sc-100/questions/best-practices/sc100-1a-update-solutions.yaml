id: sc100-1a-update-solutions
objective: "1.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has Windows Server and Linux servers in AWS connected by Azure Arc, 4,000 Windows 11 laptops enrolled in Microsoft Intune, and macOS, iOS and Android devices onboarded to Microsoft Defender for Endpoint. The company is designing its security update strategy.

    You need to recommend a solution for each requirement.

    How should you complete the recommendation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose de serveurs Windows Server et Linux dans AWS connectés par Azure Arc, de 4 000 ordinateurs portables Windows 11 inscrits dans Microsoft Intune, et d'appareils macOS, iOS et Android intégrés à Microsoft Defender for Endpoint. L'entreprise conçoit sa stratégie de mises à jour de sécurité.

    Vous devez recommander une solution pour chaque exigence.

    Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Install the updates of the servers in AWS in a defined maintenance window: [[s1]]

      Automate the Windows quality and feature updates of the laptops through deployment rings: [[s2]]

      Decide which vulnerabilities to fix first across all the devices, based on exploitation in the wild: [[s3]]
    fr: |
      Installer les mises à jour des serveurs dans AWS pendant une fenêtre de maintenance définie : [[s1]]

      Automatiser les mises à jour qualité et de fonctionnalités Windows des ordinateurs portables par anneaux de déploiement : [[s2]]

      Décider quelles vulnérabilités corriger en premier sur tous les appareils, selon leur exploitation active : [[s3]]
  slots:
    - id: s1
      options:
        - { id: aum, text: Azure Update Manager }
        - { id: autopatch, text: Windows Autopatch }
        - { id: mdvm, text: Microsoft Defender Vulnerability Management }
    - id: s2
      options:
        - { id: aum, text: Azure Update Manager }
        - { id: autopatch, text: Windows Autopatch }
        - { id: mdvm, text: Microsoft Defender Vulnerability Management }
    - id: s3
      options:
        - { id: aum, text: Azure Update Manager }
        - { id: autopatch, text: Windows Autopatch }
        - { id: mdvm, text: Microsoft Defender Vulnerability Management }
answer:
  values: { s1: aum, s2: autopatch, s3: mdvm }
explanation:
  correct:
    en: |
      Azure Update Manager schedules updates in maintenance windows for machines that run a server operating system, including machines in other clouds connected by Azure Arc. Windows Autopatch automates Windows quality and feature updates for Intune-managed devices through sequential deployment rings. Defender Vulnerability Management prioritizes vulnerabilities on Windows, macOS, Linux, Android and iOS by using threat intelligence and breach likelihood.
    fr: |
      Azure Update Manager planifie les mises à jour dans des fenêtres de maintenance pour les machines qui exécutent un système d'exploitation serveur, y compris dans d'autres clouds connectés par Azure Arc. Windows Autopatch automatise les mises à jour qualité et de fonctionnalités Windows des appareils gérés par Intune au moyen d'anneaux de déploiement successifs. Defender Vulnerability Management priorise les vulnérabilités sur Windows, macOS, Linux, Android et iOS à l'aide du renseignement sur les menaces et de la probabilité de violation.
references:
  - title: What is Azure Update Manager?
    url: https://learn.microsoft.com/en-us/azure/update-manager/overview
  - title: What is Windows Autopatch?
    url: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/overview/windows-autopatch-overview
