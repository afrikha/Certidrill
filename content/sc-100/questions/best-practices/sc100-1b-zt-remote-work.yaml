id: sc100-1b-zt-remote-work
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation lets its 3,000 employees work from home, from customer sites and from shared offices, on both company-managed and personal devices. The CIO wants a Zero Trust initiative in which every identity uses strong authentication, devices are registered and then managed with Microsoft Intune, and only compliant devices can access company data.

    You plan the initiative by using the Zero Trust adoption framework.

    Which business scenario should you use?
  fr: |
    Adatum Corporation permet à ses 3 000 employés de travailler depuis leur domicile, depuis les sites des clients et depuis des bureaux partagés, sur des appareils gérés par l'entreprise et sur des appareils personnels. Le DSI veut une initiative Confiance Zéro dans laquelle chaque identité utilise une authentification forte, les appareils sont inscrits puis gérés avec Microsoft Intune, et seuls les appareils conformes peuvent accéder aux données de l'entreprise.

    Vous planifiez l'initiative avec le framework d'adoption de la Confiance Zéro.

    Quel scénario métier devez-vous utiliser ?
body:
  options:
    - { id: a, text: Rapidly modernize your security posture }
    - { id: b, text: Identify and protect sensitive business data }
    - { id: c, text: Prevent or reduce business damage from a breach }
    - { id: d, text: Secure remote and hybrid work }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Secure remote and hybrid work covers users who work from anywhere on any device. Its stages start with strong authentication for every identity, then device registration and the starting point Conditional Access policies, then device management with Intune so that only compliant devices access data.
    fr: |-
      Secure remote and hybrid work couvre les utilisateurs qui travaillent de n'importe où sur n'importe quel appareil. Ses étapes commencent par une authentification forte pour chaque identité, puis l'inscription des appareils et les stratégies d'accès conditionnel du niveau de départ, puis la gestion des appareils avec Intune pour que seuls les appareils conformes accèdent aux données.
  options:
    a:
      en: |-
        This scenario is about measuring and raising the overall security posture, not about remote access on any device.
      fr: |-
        Ce scénario porte sur la mesure et l'amélioration de la posture de sécurité globale, pas sur l'accès à distance depuis n'importe quel appareil.
    b:
      en: |-
        This scenario discovers, classifies and protects sensitive data with labels and DLP; device compliance for access is the remote work scenario.
      fr: |-
        Ce scénario découvre, classifie et protège les données sensibles avec des étiquettes et la DLP ; la conformité des appareils pour l'accès relève du scénario de travail à distance.
    c:
      en: |-
        This scenario focuses on breach prevention, recovery and XDR to limit damage, not on enabling access from anywhere.
      fr: |-
        Ce scénario se concentre sur la prévention des violations, la récupération et le XDR pour limiter les dégâts, pas sur l'accès depuis n'importe où.
references:
  - title: Secure remote and hybrid work with Zero Trust
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/secure-remote-hybrid-work
