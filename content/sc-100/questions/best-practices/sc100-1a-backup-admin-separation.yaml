id: sc100-1a-backup-admin-separation
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. backs up its Azure virtual machines to a Recovery Services vault named RSV1. Immutability is enabled on RSV1 but isn't locked. The backup administrators are members of the Domain Admins group in the on-premises AD DS forest, and the same accounts are synchronized to Microsoft Entra ID, where they hold the Owner role on the subscription that contains RSV1.

    A penetration test shows that an attacker who compromises AD DS can disable immutability and delete the recovery points. You need to recommend a change so that the backups stay recoverable even if AD DS is fully compromised.

    What should you recommend?
  fr: |
    Fabrikam, Inc. sauvegarde ses machines virtuelles Azure dans un coffre Recovery Services nommé RSV1. L'immuabilité est activée sur RSV1 mais n'est pas verrouillée. Les administrateurs de sauvegarde sont membres du groupe Domain Admins de la forêt AD DS locale, et les mêmes comptes sont synchronisés avec Microsoft Entra ID, où ils détiennent le rôle Owner sur l'abonnement qui contient RSV1.

    Un test d'intrusion montre qu'un attaquant qui compromet AD DS peut désactiver l'immuabilité et supprimer les points de récupération. Vous devez recommander une modification pour que les sauvegardes restent récupérables même si AD DS est entièrement compromis.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Extend the soft delete retention of RSV1 to 180 days, and enable Cross Region Restore", fr: "Porter la rétention de la suppression réversible de RSV1 à 180 jours, et activer la restauration interrégion" } }
    - { id: b, text: { en: "Deploy Defender for Identity sensors on the domain controllers, and alert on changes to RSV1", fr: "Déployer des capteurs Defender for Identity sur les contrôleurs de domaine, et alerter sur les modifications de RSV1" } }
    - { id: c, text: { en: "Move RSV1 to a new resource group, and apply a Delete resource lock to the resource group", fr: "Déplacer RSV1 vers un nouveau groupe de ressources, et appliquer un verrou de ressource Suppression au groupe de ressources" } }
    - { id: d, text: { en: "Administer RSV1 with cloud-only accounts that aren't synchronized from AD DS, and lock immutability", fr: "Administrer RSV1 avec des comptes cloud uniquement, non synchronisés depuis AD DS, et verrouiller l'immuabilité" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The backups depend on privileged access: as long as the accounts that control RSV1 come from AD DS, a domain compromise gives the attacker control of the backups. Cloud-only administrative accounts break that dependency, and locked immutability can't be reversed, so recovery points can't be deleted before their expiry even by an Owner of the subscription.
    fr: |
      Les sauvegardes dépendent de l'accès privilégié : tant que les comptes qui contrôlent RSV1 viennent d'AD DS, une compromission du domaine donne à l'attaquant le contrôle des sauvegardes. Des comptes d'administration cloud uniquement suppriment cette dépendance, et l'immuabilité verrouillée est irréversible : les points de récupération ne peuvent pas être supprimés avant leur expiration, même par un Owner de l'abonnement.
  options:
    a:
      en: |-
        The compromised Owner accounts can still disable soft delete and the unlocked immutability. Cross Region Restore doesn't protect recovery points from deletion.
      fr: |-
        Les comptes Owner compromis peuvent toujours désactiver la suppression réversible et l'immuabilité non verrouillée. La restauration interrégion ne protège pas les points de récupération contre la suppression.
    b:
      en: |-
        Detection helps respond to the attack, but the attacker keeps the Owner role and can still delete the recovery points.
      fr: |-
        La détection aide à répondre à l'attaque, mais l'attaquant garde le rôle Owner et peut toujours supprimer les points de récupération.
    c:
      en: |-
        An Owner can remove a resource lock, so the compromised accounts can still disable immutability and delete the backups.
      fr: |-
        Un Owner peut retirer un verrou de ressource : les comptes compromis peuvent donc toujours désactiver l'immuabilité et supprimer les sauvegardes.
references:
  - title: Immutable vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
  - title: Limit the impact of ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase2
