id: sc100-1c-block-list
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has 80 Azure subscriptions under an intermediate root management group and creates new subscriptions every month. To control which services teams use, the platform team maintains, on each subscription, an Azure Policy assignment that allows about 200 approved resource types. Workload teams wait weeks for each new service to be approved, and the lists differ between subscriptions. The security team forbids only a few services.

    You need to recommend a change that aligns with the Microsoft Cloud Adoption Framework for Azure (CAF) guidance on enforcing governance policies. The solution must keep the forbidden services out of every subscription, including future ones, and minimize administrative effort.

    What should you recommend?
  fr: |
    Proseware, Inc. dispose de 80 abonnements Azure sous un groupe d'administration racine intermédiaire et crée de nouveaux abonnements chaque mois. Pour contrôler les services utilisés par les équipes, l'équipe de plateforme gère, sur chaque abonnement, une attribution Azure Policy qui autorise environ 200 types de ressources approuvés. Les équipes des charges de travail attendent des semaines l'approbation de chaque nouveau service, et les listes diffèrent d'un abonnement à l'autre. L'équipe de sécurité n'interdit que quelques services.

    Vous devez recommander une modification alignée sur les recommandations du Microsoft Cloud Adoption Framework for Azure (CAF) pour l'application des stratégies de gouvernance. La solution doit tenir les services interdits à l'écart de chaque abonnement, y compris des futurs abonnements, et réduire l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep the list of allowed types, and assign it once at the intermediate root instead of on each subscription", fr: "Conserver la liste des types autorisés, et l'attribuer une seule fois à la racine intermédiaire au lieu de chaque abonnement" } }
    - { id: b, text: { en: "Replace the lists with a short list of disallowed types assigned to each subscription when it's created", fr: "Remplacer les listes par une courte liste de types interdits attribuée à chaque abonnement lors de sa création" } }
    - { id: c, text: { en: "Replace the lists with a short list of disallowed types assigned once at the intermediate root", fr: "Remplacer les listes par une courte liste de types interdits attribuée une seule fois à la racine intermédiaire" } }
    - { id: d, text: { en: "Remove the assignments, and have the security team review new deployments weekly in Azure Resource Graph", fr: "Supprimer les attributions, et faire examiner les nouveaux déploiements chaque semaine dans Azure Resource Graph par l'équipe de sécurité" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The CAF recommends preferring block lists over allow lists and keeping them short, so that only the forbidden services need maintenance and new services don't wait for approval. It also recommends applying policies at the highest practical scope with an inheritance model: one assignment at the intermediate root reaches every current and future subscription below it. A disallowed resource types policy at that scope meets both requirements.
    fr: |
      Le CAF recommande de préférer les listes de blocage aux listes d'autorisation et de les garder courtes : seuls les services interdits sont à maintenir et les nouveaux services n'attendent pas d'approbation. Il recommande aussi d'appliquer les stratégies à l'étendue la plus élevée possible avec un modèle d'héritage : une seule attribution à la racine intermédiaire atteint chaque abonnement actuel et futur placé dessous. Une stratégie de types de ressources interdits à cette étendue répond aux deux exigences.
  options:
    a:
      en: One assignment removes the drift between subscriptions, but a 200-entry allow list still needs an update for every new service, which keeps the effort and the delays.
      fr: Une seule attribution supprime les écarts entre abonnements, mais une liste d'autorisation de 200 entrées doit toujours être mise à jour pour chaque nouveau service, ce qui maintient l'effort et les délais.
    b:
      en: Per-subscription assignments depend on the creation process and multiply the assignments to maintain, instead of using inheritance.
      fr: Des attributions par abonnement dépendent du processus de création et multiplient les attributions à maintenir, au lieu d'utiliser l'héritage.
    d:
      en: A weekly manual review detects forbidden services after deployment instead of keeping them out, and the CAF prefers automation wherever it's feasible.
      fr: Une revue manuelle hebdomadaire détecte les services interdits après leur déploiement au lieu de les empêcher, et le CAF privilégie l'automatisation partout où elle est possible.
references:
  - title: Enforce cloud governance policies
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/enforce-cloud-governance-policies
