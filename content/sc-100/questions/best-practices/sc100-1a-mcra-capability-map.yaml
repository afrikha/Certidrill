id: sc100-1a-mcra-capability-map
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses the capabilities view of the Microsoft Cybersecurity Reference Architectures (MCRA) to align its design with Microsoft's best practices. The company has an on-premises AD DS forest, Microsoft 365, a public website hosted by several providers, and plants with industrial control systems.

    You need to recommend a Microsoft capability for each gap that the architects identified.

    How should you complete the recommendation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise la vue des capacités des Microsoft Cybersecurity Reference Architectures (MCRA) pour aligner sa conception sur les bonnes pratiques de Microsoft. L'entreprise dispose d'une forêt AD DS locale, de Microsoft 365, d'un site web public hébergé par plusieurs fournisseurs et d'usines équipées de systèmes de contrôle industriels.

    Vous devez recommander une capacité Microsoft pour chaque lacune identifiée par les architectes.

    Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Discover and control the SaaS applications that employees use: [[s1]]

      Detect identity attacks against the on-premises AD DS forest: [[s2]]

      Discover the company's unknown internet-facing assets: [[s3]]

      Monitor the industrial control systems with passive network sensors: [[s4]]
    fr: |
      Découvrir et contrôler les applications SaaS que les employés utilisent : [[s1]]

      Détecter les attaques d'identité contre la forêt AD DS locale : [[s2]]

      Découvrir les ressources inconnues de l'entreprise exposées à Internet : [[s3]]

      Surveiller les systèmes de contrôle industriels avec des capteurs réseau passifs : [[s4]]
  slots:
    - id: s1
      options:
        - { id: mdca, text: Microsoft Defender for Cloud Apps }
        - { id: mdc, text: Microsoft Defender for Cloud }
        - { id: easm, text: Microsoft Defender External Attack Surface Management }
    - id: s2
      options:
        - { id: idp, text: Microsoft Entra ID Protection }
        - { id: mdi, text: Microsoft Defender for Identity }
        - { id: mdo, text: Microsoft Defender for Office 365 }
    - id: s3
      options:
        - { id: iot, text: Microsoft Defender for IoT }
        - { id: sentinel, text: Microsoft Sentinel }
        - { id: easm, text: Microsoft Defender External Attack Surface Management }
    - id: s4
      options:
        - { id: easm, text: Microsoft Defender External Attack Surface Management }
        - { id: iot, text: Microsoft Defender for IoT }
        - { id: mdca, text: Microsoft Defender for Cloud Apps }
answer:
  values: { s1: mdca, s2: mdi, s3: easm, s4: iot }
explanation:
  correct:
    en: |
      In the MCRA capabilities view, Defender for Cloud Apps discovers and controls SaaS applications, Defender for Identity detects threats against AD DS identities, Defender External Attack Surface Management discovers internet-facing assets from the outside, and Defender for IoT protects OT and IoT devices, including industrial control systems monitored by network sensors.
    fr: |
      Dans la vue des capacités des MCRA, Defender for Cloud Apps découvre et contrôle les applications SaaS, Defender for Identity détecte les menaces contre les identités AD DS, Defender External Attack Surface Management découvre depuis l'extérieur les ressources exposées à Internet, et Defender for IoT protège les appareils OT et IoT, y compris les systèmes de contrôle industriels surveillés par des capteurs réseau.
  options:
    mdc:
      en: |-
        Defender for Cloud protects cloud workloads and their posture; it doesn't discover the SaaS applications that employees use.
      fr: |-
        Defender for Cloud protège les charges de travail cloud et leur posture ; il ne découvre pas les applications SaaS que les employés utilisent.
    idp:
      en: |-
        ID Protection evaluates the risk of Microsoft Entra users and sign-ins; it doesn't monitor the on-premises domain controllers.
      fr: |-
        ID Protection évalue le risque des utilisateurs et des connexions Microsoft Entra ; il ne surveille pas les contrôleurs de domaine locaux.
    iot:
      en: |-
        Defender for IoT monitors OT and IoT networks from the inside; it doesn't discover assets exposed on the internet.
      fr: |-
        Defender for IoT surveille les réseaux OT et IoT de l'intérieur ; il ne découvre pas les ressources exposées sur Internet.
references:
  - title: Microsoft Cybersecurity Reference Architectures
    url: https://learn.microsoft.com/en-us/security/adoption/mcra
