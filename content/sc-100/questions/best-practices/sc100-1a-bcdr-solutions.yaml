id: sc100-1a-bcdr-solutions
objective: "1.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation runs a three-tier application on Azure virtual machines in one region, and its employees store their working files on on-premises file servers. The company is designing its business continuity and disaster recovery (BCDR) solution.

    You need to recommend a solution for each of the following requirements.

    How should you complete the recommendation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation exécute une application à trois niveaux sur des machines virtuelles Azure dans une région, et ses employés stockent leurs fichiers de travail sur des serveurs de fichiers locaux. L'entreprise conçoit sa solution de continuité d'activité et de reprise d'activité (BCDR).

    Vous devez recommander une solution pour chacune des exigences suivantes.

    Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To return the application VMs to their state before their data was encrypted: [[s1]]

      To fail over the three tiers of the application to another Azure region in a defined order during a regional outage: [[s2]]

      To let employees restore earlier versions of their own files after an attack: [[s3]]
    fr: |
      Pour ramener les VM de l'application à leur état d'avant le chiffrement de leurs données : [[s1]]

      Pour basculer les trois niveaux de l'application vers une autre région Azure dans un ordre défini pendant une panne régionale : [[s2]]

      Pour permettre aux employés de restaurer eux-mêmes les versions antérieures de leurs fichiers après une attaque : [[s3]]
  slots:
    - id: s1
      options:
        - { id: backup, text: { en: "Azure Backup", fr: "Sauvegarde Azure" } }
        - { id: asr, text: Azure Site Recovery }
        - { id: mover, text: Azure Resource Mover }
    - id: s2
      options:
        - { id: crr, text: { en: "Azure Backup Cross Region Restore", fr: "La restauration interrégion de la Sauvegarde Azure" } }
        - { id: plan, text: { en: "An Azure Site Recovery recovery plan", fr: "Un plan de récupération Azure Site Recovery" } }
        - { id: zrs, text: { en: "Zone-redundant storage for the VM disks", fr: "Le stockage redondant interzone pour les disques des VM" } }
    - id: s3
      options:
        - { id: mars, text: { en: "File servers protected by the MARS agent", fr: "Des serveurs de fichiers protégés par l'agent MARS" } }
        - { id: blob, text: { en: "Azure Blob Storage with immutability policies", fr: "Le Stockage Blob Azure avec des stratégies d'immuabilité" } }
        - { id: odsp, text: { en: "OneDrive and SharePoint", fr: "OneDrive et SharePoint" } }
answer:
  values: { s1: backup, s2: plan, s3: odsp }
explanation:
  correct:
    en: |
      Azure Backup keeps point-in-time recovery points, so it can restore data as it was before the encryption. A Site Recovery recovery plan groups the replicated machines and sequences their failover to another region, which suits a multi-tier application during an outage. Microsoft's ransomware guidance recommends moving user data to OneDrive and SharePoint, where versioning and the recycle bin let users recover their files themselves.
    fr: |
      La Sauvegarde Azure conserve des points de récupération dans le temps : elle peut restaurer les données telles qu'elles étaient avant le chiffrement. Un plan de récupération Site Recovery regroupe les machines répliquées et ordonne leur basculement vers une autre région, ce qui convient à une application multiniveau pendant une panne. Les recommandations de Microsoft contre les rançongiciels préconisent de déplacer les données utilisateur vers OneDrive et SharePoint, où la gestion des versions et la corbeille permettent aux utilisateurs de récupérer eux-mêmes leurs fichiers.
  options:
    asr:
      en: |-
        Site Recovery replication reproduces changes quickly, including encrypted data; it is designed for failover, not for point-in-time recovery after encryption.
      fr: |-
        La réplication Site Recovery reproduit vite les modifications, données chiffrées comprises ; elle est conçue pour le basculement, pas pour la récupération à un point dans le temps après un chiffrement.
    crr:
      en: |-
        Cross Region Restore restores individual VMs from backups in the paired region; it doesn't orchestrate the ordered failover of an application.
      fr: |-
        La restauration interrégion restaure des VM individuelles à partir de sauvegardes dans la région jumelée ; elle n'orchestre pas le basculement ordonné d'une application.
    mars:
      en: |-
        MARS agent backups are restored by administrators, not by the employees themselves.
      fr: |-
        Les sauvegardes de l'agent MARS sont restaurées par les administrateurs, pas par les employés eux-mêmes.
references:
  - title: About Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
  - title: Ransomware attack recovery plan
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase1
