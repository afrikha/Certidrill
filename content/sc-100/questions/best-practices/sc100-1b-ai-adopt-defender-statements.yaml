id: sc100-1b-ai-adopt-defender-statements
objective: "1.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. runs generative AI applications on Azure OpenAI in Azure and on Amazon Bedrock in AWS. Both environments are connected to Microsoft Defender for Cloud. The secure AI adoption strategy requires automated AI risk detection and AI-specific incident response, as recommended by the Cloud Adoption Framework for Azure (CAF).

    The architect evaluates the capabilities of Defender for Cloud for this strategy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. exécute des applications d'IA générative sur Azure OpenAI dans Azure et sur Amazon Bedrock dans AWS. Les deux environnements sont connectés à Microsoft Defender for Cloud. La stratégie d'adoption sécurisée de l'IA exige une détection automatisée des risques de l'IA et une réponse aux incidents propre à l'IA, comme le recommande le Cloud Adoption Framework pour Azure (CAF).

    L'architecte évalue les capacités de Defender for Cloud pour cette stratégie.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          AI security posture management requires the Defender Cloud Security Posture Management (CSPM) plan.
        fr: |-
          La gestion de la posture de sécurité de l'IA exige le plan Defender Cloud Security Posture Management (CSPM).
    - id: s2
      text:
        en: |-
          Threat protection for AI services raises jailbreak alerts for the models that Proseware uses in Amazon Bedrock.
        fr: |-
          La protection contre les menaces pour les services d'IA génère des alertes de jailbreak pour les modèles que Proseware utilise dans Amazon Bedrock.
    - id: s3
      text:
        en: |-
          Alerts from threat protection for AI services can be correlated with incidents in the Microsoft Defender XDR portal.
        fr: |-
          Les alertes de la protection contre les menaces pour les services d'IA peuvent être corrélées avec des incidents dans le portail Microsoft Defender XDR.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      AI security posture management, which covers Azure, AWS and GCP AI workloads, is part of the Defender CSPM plan. Threat protection for AI services covers supported Azure OpenAI and Azure AI Model Inference models and isn't available for connected AWS accounts, so Bedrock models don't get its run-time alerts. Its alerts can be centralized in the Defender XDR portal and correlated with incidents.
    fr: |-
      La gestion de la posture de sécurité de l'IA, qui couvre les charges de travail d'IA d'Azure, d'AWS et de GCP, fait partie du plan Defender CSPM. La protection contre les menaces pour les services d'IA couvre les modèles Azure OpenAI et Azure AI Model Inference pris en charge et n'est pas disponible pour les comptes AWS connectés : les modèles Bedrock ne reçoivent pas ses alertes à l'exécution. Ses alertes peuvent être centralisées dans le portail Defender XDR et corrélées avec des incidents.
references:
  - title: Overview - AI security posture management - Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture
  - title: AI threat protection in Microsoft Defender for Cloud - Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
