id: sc100-1b-insider-departing
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. is a pharmaceutical company that uses Microsoft 365 E5. Its research documents are stored in SharePoint Online and OneDrive.

    Last year, two researchers copied research files to personal cloud storage during the weeks before they left the company. The HR system of Contoso records the resignation date and the last working day of every employee.

    You need to recommend a solution that detects this behavior in the weeks before and after an employee's last working day. The solution must use the HR data.

    What should you recommend?
  fr: |
    Contoso, Ltd. est un laboratoire pharmaceutique qui utilise Microsoft 365 E5. Ses documents de recherche sont stockés dans SharePoint Online et OneDrive.

    L'an dernier, deux chercheurs ont copié des fichiers de recherche vers un stockage cloud personnel pendant les semaines qui ont précédé leur départ de l'entreprise. Le système RH de Contoso enregistre la date de démission et le dernier jour de travail de chaque employé.

    Vous devez recommander une solution qui détecte ce comportement dans les semaines qui précèdent et suivent le dernier jour de travail d'un employé. La solution doit utiliser les données RH.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A Microsoft Entra ID Protection user risk policy that requires a password change", fr: "Une stratégie de risque utilisateur Microsoft Entra ID Protection qui exige un changement de mot de passe" }
    - id: b
      text: { en: "A Microsoft Purview Insider Risk Management policy based on the Data theft by departing users template, with the HR connector", fr: "Une stratégie Microsoft Purview Insider Risk Management fondée sur le modèle Data theft by departing users, avec le connecteur RH" }
    - id: c
      text: { en: "Microsoft Entra access reviews of the SharePoint site memberships, triggered by the HR system", fr: "Des révisions d'accès Microsoft Entra des appartenances aux sites SharePoint, déclenchées par le système RH" }
    - id: d
      text: { en: "Microsoft Defender for Identity sensors on the domain controllers, with the HR data imported as a watchlist", fr: "Des capteurs Microsoft Defender for Identity sur les contrôleurs de domaine, avec les données RH importées comme liste de surveillance" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The researchers used their own legitimate access, which is an insider risk. The Data theft by departing users template of Insider Risk Management detects downloads, printing and copies to personal cloud services around a resignation or end date, and it uses the HR connector to know those dates.
    fr: |-
      Les chercheurs ont utilisé leurs propres accès légitimes, ce qui relève du risque interne. Le modèle Data theft by departing users d'Insider Risk Management détecte les téléchargements, les impressions et les copies vers des services cloud personnels autour d'une date de démission ou de fin de contrat, et il utilise le connecteur RH pour connaître ces dates.
  options:
    a:
      en: |-
        ID Protection detects sign-ins and accounts that look compromised. Here the legitimate user is the actor, so the account shows no identity risk.
      fr: |-
        ID Protection détecte les connexions et les comptes qui semblent compromis. Ici, l'auteur est l'utilisateur légitime : le compte ne présente aucun risque d'identité.
    c:
      en: |-
        An access review recertifies who keeps access; it doesn't detect files being copied by users who still need their access until their last day.
      fr: |-
        Une révision d'accès recertifie qui conserve un accès ; elle ne détecte pas les copies de fichiers faites par des utilisateurs qui ont besoin de leurs accès jusqu'à leur dernier jour.
    d:
      en: |-
        Defender for Identity detects attacks against on-premises Active Directory, not data exfiltration from SharePoint Online and OneDrive.
      fr: |-
        Defender for Identity détecte les attaques contre l'Active Directory local, pas l'exfiltration de données depuis SharePoint Online et OneDrive.
references:
  - title: Learn about Insider Risk Management policy templates
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management-policy-templates
