id: sc100-1a-privileged-access-tasks
objective: "1.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has an on-premises AD DS forest synchronized to Microsoft Entra ID, Microsoft 365 and Azure subscriptions. To limit the scope of ransomware damage, the company is implementing Microsoft's privileged access strategy for ransomware.

    You need to recommend a Microsoft solution for each task.

    How should you complete the recommendation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'une forêt AD DS locale synchronisée avec Microsoft Entra ID, de Microsoft 365 et d'abonnements Azure. Pour limiter l'étendue des dégâts d'un rançongiciel, l'entreprise met en œuvre la stratégie d'accès privilégié de Microsoft contre les rançongiciels.

    Vous devez recommander une solution Microsoft pour chaque tâche.

    Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To validate user and device trust before any access to administrative interfaces: [[s1]]

      To detect attacks against the AD DS administrator accounts and groups: [[s2]]

      To limit the attacker's time in the environment with incidents correlated across endpoints, email and identities: [[s3]]
    fr: |
      Pour valider la confiance dans l'utilisateur et l'appareil avant tout accès aux interfaces d'administration : [[s1]]

      Pour détecter les attaques contre les comptes et les groupes d'administrateurs AD DS : [[s2]]

      Pour limiter le temps de l'attaquant dans l'environnement grâce à des incidents corrélés entre points de terminaison, e-mail et identités : [[s3]]
  slots:
    - id: s1
      options:
        - { id: ca, text: { en: "Microsoft Entra Conditional Access", fr: "L'accès conditionnel Microsoft Entra" } }
        - { id: pp, text: { en: "Microsoft Entra Password Protection", fr: "La Protection par mot de passe Microsoft Entra" } }
        - { id: asr, text: { en: "Attack surface reduction rules", fr: "Les règles de réduction de la surface d'attaque" } }
    - id: s2
      options:
        - { id: mdo, text: Microsoft Defender for Office 365 }
        - { id: mdi, text: Microsoft Defender for Identity }
        - { id: mdvm, text: Microsoft Defender Vulnerability Management }
    - id: s3
      options:
        - { id: purview, text: Microsoft Purview Audit }
        - { id: aum, text: Azure Update Manager }
        - { id: xdr, text: Microsoft Defender XDR }
answer:
  values: { s1: ca, s2: mdi, s3: xdr }
explanation:
  correct:
    en: |
      End-to-end session security validates user and device trust with Microsoft Entra Conditional Access before access to administrative interfaces. Defender for Identity monitors AD DS and detects attacks such as privilege escalation against administrator accounts and groups. Defender XDR correlates signals from endpoints, email, identities and cloud apps into incidents, which shortens the attacker's time in the environment.
    fr: |
      La sécurité de session de bout en bout valide la confiance dans l'utilisateur et l'appareil avec l'accès conditionnel Microsoft Entra avant l'accès aux interfaces d'administration. Defender for Identity surveille AD DS et détecte des attaques comme l'élévation de privilèges contre les comptes et les groupes d'administrateurs. Defender XDR corrèle les signaux des points de terminaison, de l'e-mail, des identités et des applications cloud en incidents, ce qui réduit le temps de l'attaquant dans l'environnement.
  options:
    pp:
      en: |-
        Password Protection blocks weak passwords; it doesn't evaluate the device before administrative access.
      fr: |-
        La Protection par mot de passe bloque les mots de passe faibles ; elle n'évalue pas l'appareil avant l'accès administratif.
    mdvm:
      en: |-
        Defender Vulnerability Management prioritizes software vulnerabilities; it doesn't detect attacks against AD DS accounts.
      fr: |-
        Defender Vulnerability Management priorise les vulnérabilités logicielles ; il ne détecte pas les attaques contre les comptes AD DS.
    purview:
      en: |-
        Purview Audit records user and admin activities for investigation; it doesn't correlate threats into incidents.
      fr: |-
        Purview Audit enregistre les activités des utilisateurs et des administrateurs pour les enquêtes ; il ne corrèle pas les menaces en incidents.
references:
  - title: Limit the impact of ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase2
