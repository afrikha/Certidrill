id: sc100-1b-external-surface
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. acquired three companies in the last two years. Each acquired company registered its own domains and hosts websites with several hosting providers. None of these assets is onboarded to a Microsoft security product.

    Attackers recently exploited a forgotten web server of one of the acquired companies.

    You need to recommend a solution that continuously discovers Litware's internet-facing assets, starting from a few known domains, and highlights their vulnerabilities from an outside-in view.

    What should you recommend?
  fr: |
    Litware, Inc. a acquis trois entreprises au cours des deux dernières années. Chaque entreprise acquise a enregistré ses propres domaines et héberge des sites web chez plusieurs hébergeurs. Aucune de ces ressources n'est intégrée à un produit de sécurité Microsoft.

    Des attaquants ont récemment exploité un serveur web oublié de l'une des entreprises acquises.

    Vous devez recommander une solution qui découvre en continu les ressources de Litware exposées sur Internet, à partir de quelques domaines connus, et qui met en évidence leurs vulnérabilités vues de l'extérieur.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Defender for Cloud Apps Cloud Discovery", fr: "Cloud Discovery de Microsoft Defender for Cloud Apps" } }
    - { id: b, text: Microsoft Defender Vulnerability Management }
    - { id: c, text: Microsoft Defender External Attack Surface Management }
    - { id: d, text: Microsoft Defender for IoT }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Defender EASM starts from discovery seeds such as known domains, recursively finds infrastructure connected to them (domains, IP blocks, hosts, ASNs) and builds an inventory of the external attack surface. Its insights highlight vulnerabilities and hygiene issues of assets that no agent or connector covers.
    fr: |-
      Defender EASM part de graines de découverte comme des domaines connus, trouve de façon récursive l'infrastructure qui leur est liée (domaines, blocs d'adresses IP, hôtes, ASN) et construit un inventaire de la surface d'attaque externe. Ses analyses mettent en évidence les vulnérabilités et les problèmes d'hygiène de ressources qu'aucun agent ni connecteur ne couvre.
  options:
    a:
      en: |-
        Cloud Discovery analyzes traffic logs to find the SaaS applications that users access; it doesn't map the company's own internet-facing assets.
      fr: |-
        Cloud Discovery analyse les journaux de trafic pour trouver les applications SaaS auxquelles les utilisateurs accèdent ; il ne cartographie pas les ressources exposées sur Internet de l'entreprise.
    b:
      en: |-
        Defender Vulnerability Management assesses devices that are onboarded to Microsoft Defender; the forgotten servers aren't onboarded.
      fr: |-
        Defender Vulnerability Management évalue les appareils intégrés à Microsoft Defender ; les serveurs oubliés ne le sont pas.
    d:
      en: |-
        Defender for IoT discovers and protects IoT and OT devices on monitored networks, not internet-facing websites.
      fr: |-
        Defender for IoT découvre et protège les appareils IoT et OT des réseaux surveillés, pas des sites web exposés sur Internet.
references:
  - title: Defender EASM Overview
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview
