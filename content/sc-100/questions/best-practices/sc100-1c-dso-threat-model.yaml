id: sc100-1c-dso-threat-model
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is building a booking application on Azure. On its previous project, the team found several design flaws only during the penetration test before go-live, and fixing them delayed the release by two months. For the new project, the DevSecOps process must identify design-level threats as early as possible, as the Azure Well-Architected Framework recommends.

    You need to recommend a practice.

    What should you recommend?
  fr: |
    Tailspin Toys développe une application de réservation sur Azure. Lors de son projet précédent, l'équipe n'a découvert plusieurs défauts de conception que pendant le test d'intrusion précédant la mise en service, et leur correction a retardé la mise en production de deux mois. Pour le nouveau projet, le processus DevSecOps doit identifier les menaces liées à la conception le plus tôt possible, comme le recommande l'Azure Well-Architected Framework.

    Vous devez recommander une pratique.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Run dynamic application security testing (DAST) in the release pipeline", fr: "Exécuter des tests dynamiques de sécurité des applications (DAST) dans le pipeline de mise en production" } }
    - { id: b, text: { en: "Schedule a third-party penetration test at the end of each sprint", fr: "Planifier un test d'intrusion par un tiers à la fin de chaque sprint" } }
    - { id: c, text: { en: "Enable attack path analysis in Defender for Cloud on the production subscription", fr: "Activer l'analyse des chemins d'attaque de Defender for Cloud sur l'abonnement de production" } }
    - { id: d, text: { en: "Threat model the design with STRIDE, and update the model as the architecture changes", fr: "Modéliser les menaces de la conception avec STRIDE, et mettre à jour le modèle quand l'architecture change" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Well-Architected Framework guidance for a secure development lifecycle (SE:02) starts threat modeling early in the design: define the system boundaries, inventory the assets, map the data flows and analyze each component from an attacker's perspective with a method such as STRIDE. The model is revisited as the architecture changes, so design flaws are found before any code is deployed.
    fr: |
      Les recommandations du Well-Architected Framework pour un cycle de vie de développement sécurisé (SE:02) font commencer la modélisation des menaces tôt dans la conception : définir les limites du système, inventorier les ressources, cartographier les flux de données et analyser chaque composant du point de vue d'un attaquant avec une méthode comme STRIDE. Le modèle est revu quand l'architecture change : les défauts de conception sont trouvés avant tout déploiement de code.
  options:
    a:
      en: |-
        DAST tests a running application, so it finds issues after the design is built, not during design.
      fr: |-
        DAST teste une application en cours d'exécution : il trouve les problèmes une fois la conception réalisée, pas pendant la conception.
    b:
      en: |-
        Penetration tests are point-in-time tests of a built system; more of them would still find design flaws late.
      fr: |-
        Les tests d'intrusion sont des tests ponctuels d'un système construit ; en faire davantage trouverait toujours les défauts de conception tardivement.
    c:
      en: |-
        Attack path analysis evaluates deployed cloud resources, after the design is already in production.
      fr: |-
        L'analyse des chemins d'attaque évalue des ressources cloud déployées, une fois la conception déjà en production.
references:
  - title: Architecture strategies for securing a development lifecycle
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/secure-development-lifecycle
