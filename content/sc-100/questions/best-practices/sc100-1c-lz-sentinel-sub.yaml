id: sc100-1c-lz-sentinel-sub
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. is deploying Azure landing zones by following the reference management group hierarchy of the Microsoft Cloud Adoption Framework for Azure (CAF). The security operations team needs a location for Microsoft Sentinel and its syslog collectors. These resources must be managed separately from the workloads and from the shared networking resources.

    You need to recommend where to deploy these resources.

    What should you recommend?
  fr: |
    Contoso, Ltd. déploie des zones d'atterrissage Azure en suivant la hiérarchie de groupes d'administration de référence du Microsoft Cloud Adoption Framework for Azure (CAF). L'équipe des opérations de sécurité a besoin d'un emplacement pour Microsoft Sentinel et ses collecteurs syslog. Ces ressources doivent être gérées séparément des charges de travail et des ressources réseau partagées.

    Vous devez recommander où déployer ces ressources.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A dedicated subscription in the Connectivity management group under Platform", fr: "Un abonnement dédié dans le groupe d'administration Connectivity sous Platform" } }
    - { id: b, text: { en: "A dedicated subscription in the Security management group under Platform", fr: "Un abonnement dédié dans le groupe d'administration Security sous Platform" } }
    - { id: c, text: { en: "A dedicated subscription in the Corp management group under Landing zones", fr: "Un abonnement dédié dans le groupe d'administration Corp sous Landing zones" } }
    - { id: d, text: { en: "A dedicated subscription in the Identity management group under Platform", fr: "Un abonnement dédié dans le groupe d'administration Identity sous Platform" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the CAF reference hierarchy, the Platform management group contains Management, Connectivity, Identity and Security. The Security management group holds a dedicated subscription for security and SIEM tooling, such as Microsoft Sentinel and syslog collectors, which keeps these resources apart from the workload landing zones and the networking hub.
    fr: |
      Dans la hiérarchie de référence du CAF, le groupe d'administration Platform contient Management, Connectivity, Identity et Security. Le groupe d'administration Security héberge un abonnement dédié aux outils de sécurité et de SIEM, comme Microsoft Sentinel et les collecteurs syslog, ce qui sépare ces ressources des zones d'atterrissage des charges de travail et du hub réseau.
  options:
    a:
      en: |-
        Connectivity holds the shared networking resources, such as hubs, firewalls and DNS, which the scenario requires to keep separate.
      fr: |-
        Connectivity héberge les ressources réseau partagées, comme les hubs, les pare-feu et le DNS, dont le scénario exige la séparation.
    c:
      en: |-
        Corp is a workload landing zone management group for applications connected to the corporate network, not for platform security tooling.
      fr: |-
        Corp est un groupe d'administration de zones d'atterrissage pour les applications connectées au réseau d'entreprise, pas pour les outils de sécurité de la plateforme.
    d:
      en: |-
        Identity hosts identity services such as domain controllers, not the SIEM.
      fr: |-
        Identity héberge des services d'identité comme les contrôleurs de domaine, pas le SIEM.
references:
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
