id: sc100-1b-mcsb-ai-agent-privilege
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is building a customer service agent in Microsoft Foundry. The agent needs to read order status and create support tickets. In the current design, the agent calls the internal APIs with an API key that is shared with three other applications and that grants access to all 40 internal APIs.

    You need to recommend a change that aligns the design with the Microsoft cloud security benchmark (MCSB) control for agent functions.

    What should you recommend?
  fr: |
    Adatum Corporation crée un agent de service client dans Microsoft Foundry. L'agent doit lire l'état des commandes et créer des tickets de support. Dans la conception actuelle, l'agent appelle les API internes avec une clé API partagée avec trois autres applications et qui donne accès aux 40 API internes.

    Vous devez recommander une modification qui aligne la conception sur le contrôle du Microsoft cloud security benchmark (MCSB) relatif aux fonctions des agents.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Give the agent its own Microsoft Entra Agent ID identity, scoped to the two required APIs with short-lived tokens", fr: "Donner à l'agent sa propre identité Microsoft Entra Agent ID, limitée aux deux API nécessaires avec des jetons à courte durée de vie" } }
    - { id: b, text: { en: "Store the shared API key in Azure Key Vault and rotate it every month for all four applications", fr: "Stocker la clé API partagée dans Azure Key Vault et la renouveler chaque mois pour les quatre applications" } }
    - { id: c, text: { en: "Enable Prompt Shields in Azure AI Content Safety on the prompts that the agent receives", fr: "Activer Prompt Shields dans Azure AI Content Safety sur les prompts que l'agent reçoit" } }
    - { id: d, text: { en: "Add a safety system message that instructs the agent to call only the two required APIs", fr: "Ajouter un message système de sécurité qui demande à l'agent de n'appeler que les deux API nécessaires" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AI-4 (Apply least privilege for agent functions) asks for a separate identity for each agent, RBAC or ABAC with short-lived scoped tokens, and a capability manifest that denies everything not explicitly allowed. Microsoft Entra Agent ID gives the agent its own identity, so its access can be limited to the two APIs it needs and audited separately from the other applications.
    fr: |-
      AI-4 (Apply least privilege for agent functions) demande une identité distincte pour chaque agent, du RBAC ou de l'ABAC avec des jetons à courte durée de vie et à portée limitée, et un manifeste de capacités qui refuse tout ce qui n'est pas explicitement autorisé. Microsoft Entra Agent ID donne à l'agent sa propre identité : son accès peut être limité aux deux API dont il a besoin et audité séparément des autres applications.
  options:
    b:
      en: |-
        Rotation protects the key, but the agent still shares a credential that grants all 40 APIs, so its privileges aren't reduced.
      fr: |-
        La rotation protège la clé, mais l'agent partage toujours un identifiant qui donne accès aux 40 API : ses privilèges ne sont pas réduits.
    c:
      en: |-
        Prompt Shields detect prompt attacks (AI-2 and AI-3); if one succeeds, the agent can still call every API.
      fr: |-
        Prompt Shields détecte les attaques par prompt (AI-2 et AI-3) ; si l'une d'elles réussit, l'agent peut toujours appeler toutes les API.
    d:
      en: |-
        A system message guides behavior but isn't an enforcement boundary; a manipulated agent would keep the access of the shared key.
      fr: |-
        Un message système oriente le comportement mais n'est pas une limite appliquée ; un agent manipulé conserverait l'accès de la clé partagée.
references:
  - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security
