id: sc100-1a-update-statements
objective: "1.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is evaluating solutions for security updates. The environment contains Windows 11 devices enrolled in Microsoft Intune, macOS and mobile devices, and Windows and Linux servers. Microsoft Defender Vulnerability Management and Windows Autopatch are being considered.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys évalue des solutions pour les mises à jour de sécurité. L'environnement contient des appareils Windows 11 inscrits dans Microsoft Intune, des appareils macOS et mobiles, et des serveurs Windows et Linux. Microsoft Defender Vulnerability Management et Windows Autopatch sont envisagés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Defender Vulnerability Management installs the missing updates on the Linux servers during a maintenance window.
        fr: |-
          Defender Vulnerability Management installe les mises à jour manquantes sur les serveurs Linux pendant une fenêtre de maintenance.
    - id: s2
      text:
        en: |-
          Defender Vulnerability Management can create a remediation task in Microsoft Intune from a security recommendation.
        fr: |-
          Defender Vulnerability Management peut créer une tâche de correction dans Microsoft Intune à partir d'une recommandation de sécurité.
    - id: s3
      text:
        en: |-
          Windows Autopatch can update Microsoft 365 Apps for enterprise, Microsoft Edge and Microsoft Teams on the Windows 11 devices.
        fr: |-
          Windows Autopatch peut mettre à jour Microsoft 365 Apps for enterprise, Microsoft Edge et Microsoft Teams sur les appareils Windows 11.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Defender Vulnerability Management discovers and prioritizes vulnerabilities and tracks remediation, but it doesn't install updates itself; remediation goes through Intune tasks, application blocking or other mitigations. Windows Autopatch, which builds on Intune policies, automates updates for Windows, Microsoft 365 Apps for enterprise, Microsoft Edge and Microsoft Teams.
    fr: |
      Defender Vulnerability Management découvre et priorise les vulnérabilités et suit leur correction, mais il n'installe pas lui-même les mises à jour ; la correction passe par des tâches Intune, le blocage d'applications ou d'autres atténuations. Windows Autopatch, qui s'appuie sur les stratégies Intune, automatise les mises à jour de Windows, de Microsoft 365 Apps for enterprise, de Microsoft Edge et de Microsoft Teams.
references:
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
  - title: What is Windows Autopatch?
    url: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/overview/windows-autopatch-overview
