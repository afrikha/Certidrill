id: sc100-1b-zt-principles
objective: "1.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. is mapping the controls of its security roadmap to the guiding principles of Zero Trust.

    Which principle does each control mainly implement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. associe les contrôles de sa feuille de route de sécurité aux principes directeurs de la Confiance Zéro.

    Quel principe chaque contrôle met-il principalement en œuvre ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Evaluate user risk, device compliance and location on every access request: [[s1]]

      Replace permanent administrator role assignments with just-in-time activation: [[s2]]

      Segment the network to limit lateral movement and use analytics to detect attackers already inside: [[s3]]
    fr: |
      Évaluer le risque utilisateur, la conformité de l'appareil et l'emplacement à chaque demande d'accès : [[s1]]

      Remplacer les attributions permanentes de rôles d'administrateur par une activation juste-à-temps : [[s2]]

      Segmenter le réseau pour limiter les déplacements latéraux et utiliser l'analytique pour détecter les attaquants déjà présents : [[s3]]
  slots:
    - id: s1
      options:
        - { id: verify, text: { en: "Verify explicitly", fr: "Vérifier explicitement" } }
        - { id: least, text: { en: "Use least privilege access", fr: "Utiliser l'accès du moindre privilège" } }
        - { id: breach, text: { en: "Assume breach", fr: "Supposer une violation" } }
    - id: s2
      options:
        - { id: verify, text: { en: "Verify explicitly", fr: "Vérifier explicitement" } }
        - { id: least, text: { en: "Use least privilege access", fr: "Utiliser l'accès du moindre privilège" } }
        - { id: breach, text: { en: "Assume breach", fr: "Supposer une violation" } }
    - id: s3
      options:
        - { id: verify, text: { en: "Verify explicitly", fr: "Vérifier explicitement" } }
        - { id: least, text: { en: "Use least privilege access", fr: "Utiliser l'accès du moindre privilège" } }
        - { id: breach, text: { en: "Assume breach", fr: "Supposer une violation" } }
answer:
  values: { s1: verify, s2: least, s3: breach }
explanation:
  correct:
    en: |-
      Verify explicitly authenticates and authorizes every request with all available signals. Use least privilege access gives users and workloads only the access they need, for the shortest time, which is what just-in-time activation does. Assume breach designs controls for an attacker already inside, by limiting the blast radius and enabling rapid detection and response.
    fr: |-
      Vérifier explicitement authentifie et autorise chaque demande avec tous les signaux disponibles. Utiliser l'accès du moindre privilège ne donne aux utilisateurs et aux charges de travail que l'accès nécessaire, pour la durée la plus courte, ce que fait l'activation juste-à-temps. Supposer une violation conçoit les contrôles pour un attaquant déjà présent, en limitant le rayon d'impact et en permettant une détection et une réponse rapides.
references:
  - title: Zero Trust as a security foundation
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
