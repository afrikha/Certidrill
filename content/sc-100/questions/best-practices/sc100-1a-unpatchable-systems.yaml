id: sc100-1a-unpatchable-systems
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders patches its servers with Azure Update Manager and its client devices with Microsoft Intune. A production line is controlled by a server that runs an operating system no longer supported by Microsoft. The equipment vendor doesn't support a newer operating system, and replacing the line is planned in 18 months.

    You need to recommend how the security update strategy should handle this server until it is replaced.

    What should you recommend?
  fr: |
    Northwind Traders met à jour ses serveurs avec Azure Update Manager et ses appareils clients avec Microsoft Intune. Une ligne de production est pilotée par un serveur qui exécute un système d'exploitation que Microsoft ne prend plus en charge. Le fournisseur de l'équipement ne prend pas en charge un système plus récent, et le remplacement de la ligne est prévu dans 18 mois.

    Vous devez recommander la façon dont la stratégie de mises à jour de sécurité doit traiter ce serveur jusqu'à son remplacement.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Onboard the server to Azure Arc, and add it to a monthly Azure Update Manager schedule", fr: "Intégrer le serveur à Azure Arc, et l'ajouter à un calendrier mensuel d'Azure Update Manager" } }
    - { id: b, text: { en: "Create exceptions for its vulnerabilities in Defender Vulnerability Management, and keep it connected", fr: "Créer des exceptions pour ses vulnérabilités dans Defender Vulnerability Management, et le garder connecté" } }
    - { id: c, text: { en: "Enable hotpatching on the server, so that it receives security updates without restarting", fr: "Activer le hotpatching sur le serveur, pour qu'il reçoive les mises à jour de sécurité sans redémarrer" } }
    - { id: d, text: { en: "Isolate the server on its own network segment, disable legacy protocols, and plan its retirement", fr: "Isoler le serveur sur son propre segment réseau, désactiver les protocoles hérités, et planifier son retrait" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft's ransomware guidance asks to keep software updated and supported and, when that isn't possible, to isolate, disable or retire insecure systems and protocols, including unsupported operating systems and legacy protocols. Isolation reduces the exposure of a system that can't receive security updates until it is retired.
    fr: |
      Les recommandations de Microsoft contre les rançongiciels demandent de maintenir les logiciels à jour et pris en charge et, quand ce n'est pas possible, d'isoler, de désactiver ou de retirer les systèmes et protocoles non sécurisés, y compris les systèmes d'exploitation non pris en charge et les protocoles hérités. L'isolement réduit l'exposition d'un système qui ne peut pas recevoir de mises à jour de sécurité jusqu'à son retrait.
  options:
    a:
      en: |-
        An operating system that is no longer supported doesn't receive new security updates, so a schedule has nothing to install.
      fr: |-
        Un système d'exploitation qui n'est plus pris en charge ne reçoit plus de nouvelles mises à jour de sécurité : un calendrier n'a rien à installer.
    b:
      en: |-
        An exception hides the risk in reports without reducing it, and the server stays reachable from the rest of the network.
      fr: |-
        Une exception masque le risque dans les rapports sans le réduire, et le serveur reste accessible depuis le reste du réseau.
    c:
      en: |-
        Hotpatching installs supported security updates without a restart; it can't deliver updates for an unsupported operating system.
      fr: |-
        Le hotpatching installe des mises à jour de sécurité prises en charge sans redémarrage ; il ne peut pas fournir de mises à jour pour un système d'exploitation non pris en charge.
references:
  - title: Defend against ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase3
