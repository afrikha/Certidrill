id: sc100-1b-zt-framework-choice
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The CISO of Fabrikam, Inc. is launching a Zero Trust program. The executive committee asks for a program that is tied to business outcomes, with a clear role for each executive and sponsor, priorities organized by business scenario, and a way to track progress through incremental stages.

    You need to recommend the Microsoft guidance that the CISO should use to organize the program.

    What should you recommend?
  fr: |
    Le RSSI de Fabrikam, Inc. lance un programme Confiance Zéro. Le comité de direction demande un programme lié aux résultats métier, avec un rôle clair pour chaque dirigeant et chaque parrain, des priorités organisées par scénario métier et un moyen de suivre la progression par étapes successives.

    Vous devez recommander les recommandations Microsoft que le RSSI doit utiliser pour organiser le programme.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: "Microsoft Cybersecurity Reference Architectures (MCRA)" }
    - { id: b, text: "Microsoft cloud security benchmark (MCSB)" }
    - { id: c, text: { en: "The Zero Trust adoption framework", fr: "Le framework d'adoption de la Confiance Zéro" } }
    - { id: d, text: "Azure Well-Architected Framework (WAF)" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Zero Trust adoption framework organizes Zero Trust around business scenarios, describes the interests of each executive and the sponsors and implementers of each area, and splits each scenario into stages with deployment objectives and progress tracking resources.
    fr: |-
      Le framework d'adoption de la Confiance Zéro organise la Confiance Zéro autour de scénarios métier, décrit les intérêts de chaque dirigeant ainsi que les parrains et les responsables de mise en œuvre de chaque domaine, et découpe chaque scénario en étapes avec des objectifs de déploiement et des ressources de suivi de la progression.
  options:
    a:
      en: |-
        The MCRA describe the target technical architecture and how capabilities integrate; they don't organize a program by business scenario and sponsor.
      fr: |-
        Les MCRA décrivent l'architecture technique cible et l'intégration des capacités ; elles n'organisent pas un programme par scénario métier et par parrain.
    b:
      en: |-
        The MCSB is a list of security controls for cloud workloads, not a program structure.
      fr: |-
        Le MCSB est une liste de contrôles de sécurité pour les charges de travail cloud, pas une structure de programme.
    d:
      en: |-
        The WAF guides the design of individual workloads, not an enterprise Zero Trust program.
      fr: |-
        Le WAF guide la conception de charges de travail individuelles, pas un programme Confiance Zéro d'entreprise.
references:
  - title: Zero Trust adoption framework overview
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/zero-trust-adoption-overview
