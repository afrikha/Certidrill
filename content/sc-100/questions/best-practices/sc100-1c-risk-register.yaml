id: sc100-1c-risk-register
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. runs workloads in Azure and AWS and uses Microsoft 365. Its cloud governance team follows the Microsoft Cloud Adoption Framework for Azure (CAF) and assesses cloud risks before it writes governance policies. The team is building its first risk register.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. exécute des charges de travail dans Azure et AWS et utilise Microsoft 365. Son équipe de gouvernance cloud suit le Microsoft Cloud Adoption Framework for Azure (CAF) et évalue les risques cloud avant de rédiger les stratégies de gouvernance. L'équipe constitue son premier registre des risques.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each risk in the register should have one primary owner who coordinates the response across the teams involved.
        fr: Chaque risque du registre doit avoir un propriétaire principal unique qui coordonne la réponse entre les équipes concernées.
    - id: s2
      text:
        en: When every mitigation of a risk costs more than the risk itself, the team can accept the risk and document the reasoning.
        fr: Lorsque chaque atténuation d'un risque coûte plus cher que le risque lui-même, l'équipe peut accepter le risque et documenter sa justification.
    - id: s3
      text:
        en: After a security incident, the team should wait for the next scheduled review to reassess the related risks.
        fr: Après un incident de sécurité, l'équipe doit attendre la prochaine revue planifiée pour réévaluer les risques concernés.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The CAF asks for one primary risk owner per risk, who coordinates the response across teams and is the first escalation contact. For each risk, the team chooses to avoid, mitigate, transfer or accept it and documents why; accepting is appropriate when mitigation costs more than the risk is worth. Risks are reviewed on a schedule and also after events such as an incident, a failed control, a new threat or a regulatory change.
    fr: |
      Le CAF demande un propriétaire principal par risque, qui coordonne la réponse entre les équipes et sert de premier contact d'escalade. Pour chaque risque, l'équipe choisit de l'éviter, de l'atténuer, de le transférer ou de l'accepter, et documente pourquoi ; l'acceptation convient lorsque l'atténuation coûte plus que ce que vaut le risque. Les risques sont revus selon un calendrier, mais aussi après des événements tels qu'un incident, un contrôle défaillant, une nouvelle menace ou un changement réglementaire.
references:
  - title: Assess cloud risks
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/assess-cloud-risks
