id: sc100-1c-dso-tool-map
objective: "1.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders hosts code in Azure DevOps, GitHub and GitLab. The company is designing the security controls of its DevSecOps process and has listed three requirements. The repositories in Azure Repos have existed for several years.

    What should you recommend for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders héberge du code dans Azure DevOps, GitHub et GitLab. L'entreprise conçoit les contrôles de sécurité de son processus DevSecOps et a énuméré trois exigences. Les dépôts d'Azure Repos existent depuis plusieurs années.

    Que devez-vous recommander pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Find the secrets already present in the commit history of the Azure Repos repositories: [[s1]]

      Detect vulnerabilities in first-party code at each pull request in Azure Repos: [[s2]]

      Show the findings from Azure DevOps, GitHub and GitLab in one place, next to the cloud security posture: [[s3]]
    fr: |
      Trouver les secrets déjà présents dans l'historique des commits des dépôts Azure Repos : [[s1]]

      Détecter les vulnérabilités du code interne à chaque pull request dans Azure Repos : [[s2]]

      Afficher les résultats d'Azure DevOps, de GitHub et de GitLab au même endroit, à côté de la posture de sécurité cloud : [[s3]]
  slots:
    - id: s1
      options:
        - { id: push, text: { en: "Push protection", fr: "Protection push" } }
        - { id: alerts, text: { en: "Secret scanning alerts", fr: "Alertes d'analyse des secrets" } }
        - { id: codeql, text: { en: "CodeQL code scanning", fr: "Analyse du code CodeQL" } }
        - { id: depalerts, text: { en: "Dependency alerts", fr: "Alertes de dépendances" } }
        - { id: mdc, text: { en: "Defender for Cloud DevOps security", fr: "Sécurité DevOps de Defender for Cloud" } }
    - id: s2
      options:
        - { id: push, text: { en: "Push protection", fr: "Protection push" } }
        - { id: alerts, text: { en: "Secret scanning alerts", fr: "Alertes d'analyse des secrets" } }
        - { id: codeql, text: { en: "CodeQL code scanning", fr: "Analyse du code CodeQL" } }
        - { id: depalerts, text: { en: "Dependency alerts", fr: "Alertes de dépendances" } }
        - { id: mdc, text: { en: "Defender for Cloud DevOps security", fr: "Sécurité DevOps de Defender for Cloud" } }
    - id: s3
      options:
        - { id: push, text: { en: "Push protection", fr: "Protection push" } }
        - { id: alerts, text: { en: "Secret scanning alerts", fr: "Alertes d'analyse des secrets" } }
        - { id: codeql, text: { en: "CodeQL code scanning", fr: "Analyse du code CodeQL" } }
        - { id: depalerts, text: { en: "Dependency alerts", fr: "Alertes de dépendances" } }
        - { id: mdc, text: { en: "Defender for Cloud DevOps security", fr: "Sécurité DevOps de Defender for Cloud" } }
answer:
  values: { s1: alerts, s2: codeql, s3: mdc }
explanation:
  correct:
    en: |
      Push protection evaluates only the pushes made after it's enabled, while repository secret scanning detects and alerts on existing secrets, including those in historical commits. CodeQL scanning, part of GitHub Code Security for Azure DevOps, detects vulnerabilities in first-party code, whereas dependency alerts cover open-source packages. Defender for Cloud DevOps security connects Azure DevOps, GitHub and GitLab and shows code, secret, dependency and IaC findings in one console with code-to-cloud context.
    fr: |
      La protection push n'évalue que les push effectués après son activation, tandis que l'analyse des secrets du dépôt détecte les secrets existants, y compris dans les commits historiques, et génère des alertes. L'analyse CodeQL, incluse dans GitHub Code Security for Azure DevOps, détecte les vulnérabilités du code interne, alors que les alertes de dépendances couvrent les packages open source. La sécurité DevOps de Defender for Cloud connecte Azure DevOps, GitHub et GitLab et affiche les résultats sur le code, les secrets, les dépendances et l'IaC dans une seule console, avec le contexte du code au cloud.
  options:
    push:
      en: |-
        Push protection blocks new secrets at push time; it doesn't report the secrets already in the history.
      fr: |-
        La protection push bloque les nouveaux secrets au moment du push ; elle ne signale pas les secrets déjà présents dans l'historique.
references:
  - title: Configure GitHub Advanced Security for Azure DevOps features
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features
  - title: Microsoft Defender for Cloud DevOps Security Benefits
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-devops-introduction
