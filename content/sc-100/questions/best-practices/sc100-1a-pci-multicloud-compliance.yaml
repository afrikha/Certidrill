id: sc100-1a-pci-multicloud-compliance
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank processes card payments in Azure subscriptions and in AWS accounts. All the environments are connected to Microsoft Defender for Cloud, the Defender CSPM plan is enabled, and the Microsoft cloud security benchmark (MCSB) is assigned with the default settings.

    The auditors ask the bank to show how its Azure and AWS resources perform against the PCI DSS v4 requirements, and the security team must track the failing controls. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Woodgrove Bank traite des paiements par carte dans des abonnements Azure et des comptes AWS. Tous les environnements sont connectés à Microsoft Defender for Cloud, le plan Defender CSPM est activé, et le Microsoft cloud security benchmark (MCSB) est attribué avec les paramètres par défaut.

    Les auditeurs demandent à la banque de montrer comment ses ressources Azure et AWS se situent par rapport aux exigences de PCI DSS v4, et l'équipe de sécurité doit suivre les contrôles en échec. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Rely on the MCSB assessment, because the MCSB controls are mapped to PCI DSS v4", fr: "S'appuyer sur l'évaluation du MCSB, car les contrôles du MCSB sont associés à PCI DSS v4" } }
    - { id: b, text: { en: "Assign the PCI DSS v4 built-in Azure Policy initiative to the root management group", fr: "Attribuer l'initiative Azure Policy intégrée PCI DSS v4 au groupe d'administration racine" } }
    - { id: c, text: { en: "Assign the PCI DSS v4 standard in Defender for Cloud regulatory compliance to Azure and AWS", fr: "Attribuer la norme PCI DSS v4 dans la conformité réglementaire de Defender for Cloud à Azure et AWS" } }
    - { id: d, text: { en: "Use the standards mapping of the MCRA to document the PCI DSS v4 controls", fr: "Utiliser le mappage des normes des MCRA pour documenter les contrôles PCI DSS v4" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Regulatory compliance in Defender for Cloud assesses assigned standards against the relevant resources, and PCI DSS v4.0.1 is available for Azure, AWS and GCP. The dashboard shows the failing controls and supports audit reports. It helps identify the issues that prevent compliance; it doesn't certify the bank, and controls that can't be assessed automatically appear as unavailable.
    fr: |
      La conformité réglementaire de Defender for Cloud évalue les normes attribuées sur les ressources concernées, et PCI DSS v4.0.1 est disponible pour Azure, AWS et GCP. Le tableau de bord montre les contrôles en échec et propose des rapports d'audit. Il aide à identifier les problèmes qui empêchent la conformité ; il ne certifie pas la banque, et les contrôles qui ne peuvent pas être évalués automatiquement apparaissent comme indisponibles.
  options:
    a:
      en: |-
        Microsoft states that the MCSB mappings only show that Azure features can address a requirement fully or partially; they don't make the workloads compliant or report PCI DSS controls.
      fr: |-
        Microsoft précise que les correspondances du MCSB montrent seulement que des fonctionnalités Azure peuvent répondre totalement ou partiellement à une exigence ; elles ne rendent pas les charges de travail conformes et ne rendent pas compte des contrôles PCI DSS.
    b:
      en: |-
        An Azure Policy initiative evaluates Azure resources only. It doesn't cover the AWS accounts.
      fr: |-
        Une initiative Azure Policy n'évalue que les ressources Azure. Elle ne couvre pas les comptes AWS.
    d:
      en: |-
        The MCRA map Microsoft capabilities to Zero Trust standards; they don't assess resources against PCI DSS.
      fr: |-
        Les MCRA associent les capacités Microsoft aux normes Confiance Zéro ; elles n'évaluent pas les ressources par rapport à PCI DSS.
references:
  - title: Regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
  - title: Overview of Microsoft cloud security benchmark v2 (preview)
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/overview
