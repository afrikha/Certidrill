id: sc100-1a-lateral-traversal
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. recovered from a ransomware attack on its on-premises environment. The investigation shows that the attacker compromised one workstation, then used the same local administrator password, which is configured on every workstation and server, to take control of 900 other devices.

    You need to recommend which task of Microsoft's privileged access strategy for ransomware addresses this weakness, and how to implement it.

    What should you recommend?
  fr: |
    Contoso, Ltd. s'est remise d'une attaque par rançongiciel sur son environnement local. L'enquête montre que l'attaquant a compromis une station de travail, puis a utilisé le même mot de passe d'administrateur local, configuré sur toutes les stations de travail et tous les serveurs, pour prendre le contrôle de 900 autres appareils.

    Vous devez recommander la tâche de la stratégie d'accès privilégié de Microsoft contre les rançongiciels qui traite cette faiblesse, et la façon de la mettre en œuvre.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enforce end-to-end session security by requiring Conditional Access for administrative interfaces", fr: "Imposer la sécurité de session de bout en bout en exigeant l'accès conditionnel pour les interfaces d'administration" } }
    - { id: b, text: { en: "Mitigate lateral traversal by randomizing local account passwords with Windows LAPS", fr: "Limiter les déplacements latéraux en rendant aléatoires les mots de passe des comptes locaux avec Windows LAPS" } }
    - { id: c, text: { en: "Protect and monitor identity systems by deploying Microsoft Defender for Identity sensors", fr: "Protéger et surveiller les systèmes d'identité en déployant des capteurs Microsoft Defender for Identity" } }
    - { id: d, text: { en: "Ensure rapid threat response by sending all device alerts to Microsoft Sentinel", fr: "Garantir une réponse rapide aux menaces en envoyant toutes les alertes des appareils à Microsoft Sentinel" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The lateral traversal task ensures that compromising one device doesn't give control of many others through local account passwords, service account passwords or other secrets. Microsoft targets 100% of local workstation and server passwords randomized; Windows LAPS gives each device a unique, managed local administrator password.
    fr: |
      La tâche de limitation des déplacements latéraux garantit que la compromission d'un appareil ne donne pas le contrôle de beaucoup d'autres par les mots de passe des comptes locaux, des comptes de service ou d'autres secrets. Microsoft vise 100 % de mots de passe locaux aléatoires sur les stations de travail et les serveurs ; Windows LAPS donne à chaque appareil un mot de passe d'administrateur local unique et géré.
  options:
    a:
      en: |-
        Conditional Access validates users and devices before access to administrative interfaces. A shared local password is used directly on the devices and bypasses it.
      fr: |-
        L'accès conditionnel valide les utilisateurs et les appareils avant l'accès aux interfaces d'administration. Un mot de passe local partagé est utilisé directement sur les appareils et le contourne.
    c:
      en: |-
        Defender for Identity helps detect attacks against AD DS, but detection doesn't remove the shared password that enables the traversal.
      fr: |-
        Defender for Identity aide à détecter les attaques contre AD DS, mais la détection ne supprime pas le mot de passe partagé qui permet les déplacements.
    d:
      en: |-
        Faster response limits the attacker's time in the environment, but every device would still share the same local password.
      fr: |-
        Une réponse plus rapide limite le temps de l'attaquant dans l'environnement, mais tous les appareils partageraient toujours le même mot de passe local.
references:
  - title: Limit the impact of ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase2
