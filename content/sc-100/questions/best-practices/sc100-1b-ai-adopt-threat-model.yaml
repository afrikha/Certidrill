id: sc100-1b-ai-adopt-threat-model
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has used STRIDE threat modeling for its web applications for five years. The company now builds retrieval-augmented generation (RAG) applications and AI agents in Azure.

    The CISO asks you to define how the security team should discover AI security risks, in line with the Secure AI guidance of the Cloud Adoption Framework for Azure (CAF).

    What should you recommend?
  fr: |
    Adatum Corporation utilise la modélisation des menaces STRIDE pour ses applications web depuis cinq ans. L'entreprise crée maintenant des applications de génération augmentée de récupération (RAG) et des agents d'IA dans Azure.

    Le RSSI vous demande de définir comment l'équipe de sécurité doit découvrir les risques de sécurité de l'IA, conformément aux recommandations Secure AI du Cloud Adoption Framework pour Azure (CAF).

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Replace STRIDE with a separate methodology used only for AI workloads", fr: "Remplacer STRIDE par une méthodologie distincte utilisée uniquement pour les charges de travail d'IA" } }
    - { id: b, text: { en: "Run red teaming once the AI applications are in production, instead of threat modeling", fr: "Effectuer un red teaming une fois les applications d'IA en production, à la place de la modélisation des menaces" } }
    - { id: c, text: { en: "Start from the STRIDE threat model, then validate AI coverage with MITRE ATLAS and OWASP generative AI risks", fr: "Partir du modèle de menaces STRIDE, puis valider la couverture de l'IA avec MITRE ATLAS et les risques d'IA générative de l'OWASP" } }
    - { id: d, text: { en: "Rely on the risk assessment published by the model provider for each model", fr: "S'appuyer sur l'évaluation des risques publiée par le fournisseur de chaque modèle" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The CAF Secure AI guidance starts AI risk discovery from an existing threat model, such as STRIDE, and supplements it with AI-specific knowledge bases, MITRE ATLAS and the OWASP generative AI risks. It also recommends assessing data risks, testing models for vulnerabilities and repeating assessments periodically.
    fr: |-
      Les recommandations Secure AI du CAF font partir la découverte des risques d'IA d'un modèle de menaces existant, comme STRIDE, complété par des bases de connaissances propres à l'IA, MITRE ATLAS et les risques d'IA générative de l'OWASP. Elles recommandent aussi d'évaluer les risques sur les données, de tester les modèles pour trouver des vulnérabilités et de répéter les évaluations périodiquement.
  options:
    a:
      en: |-
        The guidance builds on the existing threat model; discarding it loses the coverage of the non-AI components of the application.
      fr: |-
        Les recommandations s'appuient sur le modèle de menaces existant ; l'abandonner fait perdre la couverture des composants non IA de l'application.
    b:
      en: |-
        Red teaming complements threat modeling and should run before attackers find weaknesses, not replace design-time analysis.
      fr: |-
        Le red teaming complète la modélisation des menaces et doit avoir lieu avant que les attaquants trouvent les faiblesses, sans remplacer l'analyse à la conception.
    d:
      en: |-
        The provider's assessment doesn't cover Adatum's data, integrations and agents, which create most of the application's risks.
      fr: |-
        L'évaluation du fournisseur ne couvre pas les données, les intégrations et les agents d'Adatum, qui créent l'essentiel des risques de l'application.
references:
  - title: Secure AI - Guidance to set up your organization's AI security process - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/secure
