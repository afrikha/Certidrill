id: sc100-1b-mcsb-ai-registry-policy
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. created a model review board. Approved models are published to a central Azure Machine Learning registry. Fabrikam has 25 subscriptions that contain Azure Machine Learning workspaces.

    You need to recommend a solution that aligns with the Microsoft cloud security benchmark (MCSB) and prevents teams from deploying models that don't come from the approved registry. The solution must minimize custom development.

    What should you recommend?
  fr: |
    Fabrikam, Inc. a créé un comité de revue des modèles. Les modèles approuvés sont publiés dans un registre Azure Machine Learning central. Fabrikam dispose de 25 abonnements qui contiennent des espaces de travail Azure Machine Learning.

    Vous devez recommander une solution qui s'aligne sur le Microsoft cloud security benchmark (MCSB) et qui empêche les équipes de déployer des modèles qui ne proviennent pas du registre approuvé. La solution doit réduire au minimum le développement personnalisé.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure AI Content Safety filters on every model endpoint", fr: "Des filtres Azure AI Content Safety sur chaque point de terminaison de modèle" } }
    - { id: b, text: { en: "The built-in Azure Policy definition for approved registry models, with the Deny effect", fr: "La définition Azure Policy intégrée pour les modèles de registre approuvés, avec l'effet Deny" } }
    - { id: c, text: { en: "Microsoft Defender for Cloud threat protection for AI services", fr: "La protection contre les menaces pour les services d'IA de Microsoft Defender for Cloud" } }
    - { id: d, text: { en: "A Microsoft Purview Data Loss Prevention policy on the workspaces", fr: "Une stratégie de protection contre la perte de données Microsoft Purview sur les espaces de travail" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For AI-1 (Ensure use of approved models), the MCSB names the Azure Policy definition that requires Azure Machine Learning deployments to use only approved registry models. Assigned with the Deny effect at a scope that covers the 25 subscriptions, it blocks non-compliant deployments without any code.
    fr: |-
      Pour AI-1 (Ensure use of approved models), le MCSB cite la définition Azure Policy qui exige que les déploiements Azure Machine Learning n'utilisent que des modèles de registre approuvés. Attribuée avec l'effet Deny à une étendue qui couvre les 25 abonnements, elle bloque les déploiements non conformes sans aucun code.
  options:
    a:
      en: |-
        Content Safety filters harmful prompts and outputs of a deployed model; it doesn't stop the deployment of an unapproved model.
      fr: |-
        Content Safety filtre les prompts et sorties nuisibles d'un modèle déployé ; il n'empêche pas le déploiement d'un modèle non approuvé.
    c:
      en: |-
        Threat protection for AI services raises alerts on attacks against running AI services; it doesn't govern which models are deployed.
      fr: |-
        La protection contre les menaces pour les services d'IA génère des alertes sur les attaques visant les services d'IA en fonctionnement ; elle ne gouverne pas les modèles déployés.
    d:
      en: |-
        DLP protects sensitive data from leaving through supported locations; it doesn't control model deployments.
      fr: |-
        La DLP empêche les données sensibles de sortir par les emplacements pris en charge ; elle ne contrôle pas les déploiements de modèles.
references:
  - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security
