id: sc100-1a-update-manager-scoping
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Azure Update Manager for 500 Azure virtual machines and Azure Arc-enabled servers. The security update design must meet the following requirements:

    - Every machine that has the tag Env=Prod, including machines created later, must be patched automatically in the Saturday maintenance window.
    - The HR application team must be able to manage the updates of its 12 servers only.

    Which two capabilities should you include in the design? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Azure Update Manager pour 500 machines virtuelles Azure et serveurs Azure Arc. La conception des mises à jour de sécurité doit respecter les exigences suivantes :

    - Chaque machine qui a l'étiquette Env=Prod, y compris les machines créées plus tard, doit être mise à jour automatiquement pendant la fenêtre de maintenance du samedi.
    - L'équipe applicative RH doit pouvoir gérer les mises à jour de ses 12 serveurs uniquement.

    Quelles sont les deux capacités que vous devez inclure dans la conception ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Windows Autopatch groups that contain the production machines", fr: "Des groupes Windows Autopatch qui contiennent les machines de production" } }
    - { id: b, text: { en: "An Azure RBAC role assignment scoped to the 12 HR servers", fr: "Une attribution de rôle Azure RBAC limitée aux 12 serveurs RH" } }
    - { id: c, text: { en: "A Log Analytics workspace with access granted to the HR team", fr: "Un espace de travail Log Analytics auquel l'équipe RH a accès" } }
    - { id: d, text: { en: "Device groups in Defender Vulnerability Management for the HR servers", fr: "Des groupes d'appareils dans Defender Vulnerability Management pour les serveurs RH" } }
    - { id: e, text: { en: "A dynamic scope based on the Env=Prod tag in the Saturday schedule", fr: "Une étendue dynamique fondée sur l'étiquette Env=Prod dans le calendrier du samedi" } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      Dynamic scoping groups machines by criteria such as tags, so machines created later with Env=Prod join the Saturday schedule automatically. Azure Update Manager uses Azure RBAC at the level of each resource, so you can delegate patch management of the 12 HR servers without granting access to the other machines.
    fr: |
      L'étendue dynamique regroupe les machines selon des critères comme les étiquettes : les machines créées plus tard avec Env=Prod rejoignent automatiquement le calendrier du samedi. Azure Update Manager utilise Azure RBAC au niveau de chaque ressource : vous pouvez déléguer la gestion des mises à jour des 12 serveurs RH sans accorder l'accès aux autres machines.
  options:
    a:
      en: |-
        Autopatch groups organize Windows client devices for Windows Autopatch; they don't schedule server updates in Azure Update Manager.
      fr: |-
        Les groupes Autopatch organisent des appareils clients Windows pour Windows Autopatch ; ils ne planifient pas les mises à jour des serveurs dans Azure Update Manager.
    c:
      en: |-
        Azure Update Manager doesn't depend on a Log Analytics workspace, and workspace access doesn't control who can patch a machine.
      fr: |-
        Azure Update Manager ne dépend pas d'un espace de travail Log Analytics, et l'accès à un espace de travail ne contrôle pas qui peut mettre à jour une machine.
    d:
      en: |-
        Device groups scope vulnerability data and remediation in Defender; they don't grant permissions in Azure Update Manager.
      fr: |-
        Les groupes d'appareils délimitent les données de vulnérabilité et la correction dans Defender ; ils n'accordent pas d'autorisations dans Azure Update Manager.
references:
  - title: What is Azure Update Manager?
    url: https://learn.microsoft.com/en-us/azure/update-manager/overview
