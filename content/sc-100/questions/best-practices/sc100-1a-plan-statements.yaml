id: sc100-1a-plan-statements
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is implementing Microsoft's plan to protect against ransomware. The backup, identity and endpoint teams each own part of the work, and the CISO wants measurable targets for each step.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys met en œuvre le plan de Microsoft pour se protéger contre les rançongiciels. Les équipes de sauvegarde, d'identité et des points de terminaison détiennent chacune une partie du travail, et le RSSI veut des objectifs mesurables pour chaque étape.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The step that limits the scope of damage targets 100% of administrators required to use secure workstations within 30 to 90 days.
        fr: |-
          L'étape qui limite l'étendue des dégâts vise 100 % d'administrateurs tenus d'utiliser des stations de travail sécurisées sous 30 à 90 jours.
    - id: s2
      text:
        en: |-
          The checklists are ordered by technical dependency, so the identity team must wait until the backup team completes its tasks.
        fr: |-
          Les listes de contrôle sont ordonnées par dépendance technique : l'équipe d'identité doit donc attendre que l'équipe de sauvegarde termine ses tâches.
    - id: s3
      text:
        en: |-
          The step that hardens entry points targets 100% of employees actively using MFA within 30 days.
        fr: |-
          L'étape qui durcit les points d'entrée vise 100 % d'employés utilisant activement la MFA sous 30 jours.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The second step targets, within 30 to 90 days, 100% of administrators on secure workstations, 100% of local passwords randomized and 100% of privilege escalation mitigations deployed. The order of the checklists reflects prioritization, not technical dependency, and teams can work in parallel. The third step targets 100% of employees actively using MFA and full deployment of higher password security within 30 days.
    fr: |
      La deuxième étape vise, sous 30 à 90 jours, 100 % d'administrateurs sur des stations de travail sécurisées, 100 % de mots de passe locaux aléatoires et 100 % des atténuations d'élévation de privilèges déployées. L'ordre des listes de contrôle reflète la priorisation, pas une dépendance technique, et les équipes peuvent travailler en parallèle. La troisième étape vise 100 % d'employés utilisant activement la MFA et le déploiement complet d'une sécurité renforcée des mots de passe sous 30 jours.
references:
  - title: Limit the impact of ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase2
  - title: Defend against ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase3
