id: sc100-1b-ai-adopt-risky-usage
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is rolling out Microsoft 365 Copilot to 8,000 employees. The bank also knows that some employees use public generative AI websites.

    As part of its secure AI adoption strategy, the bank needs to detect employees who browse generative AI websites or who include sensitive information in prompts to Microsoft 365 Copilot and agents. The bank uses Microsoft 365 E5 and Microsoft Edge on all devices.

    What should you recommend?
  fr: |
    Woodgrove Bank déploie Microsoft 365 Copilot auprès de 8 000 employés. La banque sait aussi que certains employés utilisent des sites web publics d'IA générative.

    Dans le cadre de sa stratégie d'adoption sécurisée de l'IA, la banque doit détecter les employés qui consultent des sites web d'IA générative ou qui incluent des informations sensibles dans des prompts adressés à Microsoft 365 Copilot et aux agents. La banque utilise Microsoft 365 E5 et Microsoft Edge sur tous les appareils.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Insider Risk Management policy based on the Data theft by departing users template", fr: "Une stratégie Insider Risk Management fondée sur le modèle Data theft by departing users" } }
    - { id: b, text: { en: "Microsoft Defender for Cloud threat protection for AI services", fr: "La protection contre les menaces pour les services d'IA de Microsoft Defender for Cloud" } }
    - { id: c, text: { en: "An Insider Risk Management policy based on the Risky AI usage template", fr: "Une stratégie Insider Risk Management fondée sur le modèle Risky AI usage" } }
    - { id: d, text: { en: "A Microsoft Entra ID Protection sign-in risk policy for the Copilot users", fr: "Une stratégie de risque de connexion Microsoft Entra ID Protection pour les utilisateurs de Copilot" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Risky AI usage template of Insider Risk Management detects browsing to generative AI websites, and prompts and responses that contain sensitive information in Microsoft 365 Copilot, Microsoft Copilot and agents. Browser signals require the Microsoft Insider risk extension in Edge. The CAF Secure AI guidance names Insider Risk Management to assess AI data risks and detect risky AI behavior.
    fr: |-
      Le modèle Risky AI usage d'Insider Risk Management détecte la consultation de sites web d'IA générative, ainsi que les prompts et réponses qui contiennent des informations sensibles dans Microsoft 365 Copilot, Microsoft Copilot et les agents. Les signaux de navigation exigent l'extension Microsoft Insider risk dans Edge. Les recommandations Secure AI du CAF citent Insider Risk Management pour évaluer les risques de l'IA sur les données et détecter les comportements d'IA à risque.
  options:
    a:
      en: |-
        This template detects exfiltration around an employee's departure date, not risky use of AI tools.
      fr: |-
        Ce modèle détecte l'exfiltration autour de la date de départ d'un employé, pas l'utilisation risquée d'outils d'IA.
    b:
      en: |-
        Threat protection for AI services protects the organization's own Azure AI deployments; it doesn't monitor employees' use of Copilot or public AI websites.
      fr: |-
        La protection contre les menaces pour les services d'IA protège les déploiements Azure AI de l'organisation ; elle ne surveille pas l'utilisation de Copilot ou des sites d'IA publics par les employés.
    d:
      en: |-
        Sign-in risk evaluates whether a sign-in is compromised; it doesn't inspect what users put in prompts.
      fr: |-
        Le risque de connexion évalue si une connexion est compromise ; il n'examine pas ce que les utilisateurs mettent dans les prompts.
references:
  - title: Learn about Insider Risk Management policy templates
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management-policy-templates
