id: sc100-1a-mcsb-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys adopts the Microsoft cloud security benchmark (MCSB) v2 as the control baseline for its Azure workloads. The compliance team must also demonstrate PCI DSS v4 and ISO/IEC 27001:2022 compliance to external auditors.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys adopte le Microsoft cloud security benchmark (MCSB) v2 comme base de référence de contrôles pour ses charges de travail Azure. L'équipe de conformité doit aussi démontrer la conformité à PCI DSS v4 et à ISO/IEC 27001:2022 auprès d'auditeurs externes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Implementing the MCSB controls that map to PCI DSS v4 makes the workloads compliant with PCI DSS v4.
        fr: |-
          Mettre en œuvre les contrôles du MCSB associés à PCI DSS v4 rend les charges de travail conformes à PCI DSS v4.
    - id: s2
      text:
        en: |-
          Each MCSB v2 control has a criticality level of Must have, Should have, or Nice to have.
        fr: |-
          Chaque contrôle du MCSB v2 a un niveau de criticité Must have, Should have ou Nice to have.
    - id: s3
      text:
        en: |-
          Every MCSB control is linked to at least one built-in Azure Policy definition.
        fr: |-
          Chaque contrôle du MCSB est lié à au moins une définition Azure Policy intégrée.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The MCSB maps its controls to frameworks such as PCI DSS v4 and ISO/IEC 27001:2022, but Microsoft cautions that the mappings only show that Azure features can address a requirement fully or partially; they don't make the workloads compliant. Each control states a criticality level of Must have, Should have or Nice to have. Some controls have no Azure Policy definition, because Azure Policy can't enforce them.
    fr: |
      Le MCSB associe ses contrôles à des frameworks comme PCI DSS v4 et ISO/IEC 27001:2022, mais Microsoft précise que ces correspondances montrent seulement que des fonctionnalités Azure peuvent répondre totalement ou partiellement à une exigence ; elles ne rendent pas les charges de travail conformes. Chaque contrôle indique un niveau de criticité Must have, Should have ou Nice to have. Certains contrôles n'ont aucune définition Azure Policy, car Azure Policy ne peut pas les imposer.
references:
  - title: Overview of Microsoft cloud security benchmark v2 (preview)
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/overview
