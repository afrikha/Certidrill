id: sc100-1b-zt-data-stages
objective: "1.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft 365 E5 and stores sensitive data in SharePoint Online, OneDrive, Teams, on-premises file shares and several SaaS applications. The company adopts the Identify and protect sensitive business data business scenario of the Zero Trust adoption framework.

    You need to plan the deployment by following the stages of the scenario.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. utilise Microsoft 365 E5 et stocke des données sensibles dans SharePoint Online, OneDrive, Teams, des partages de fichiers locaux et plusieurs applications SaaS. L'entreprise adopte le scénario métier Identify and protect sensitive business data du framework d'adoption de la Confiance Zéro.

    Vous devez planifier le déploiement en suivant les étapes du scénario.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: discover, text: { en: "Discover sensitive data with sensitive information types, trainable classifiers and content explorer.", fr: "Découvrir les données sensibles avec les types d'informations sensibles, les classifieurs entraînables et l'explorateur de contenu." } }
    - { id: schema, text: { en: "Define a classification schema of a few sensitivity labels, apply labels and introduce DLP policies that warn users.", fr: "Définir un schéma de classification de quelques étiquettes de confidentialité, appliquer les étiquettes et introduire des stratégies DLP qui avertissent les utilisateurs." } }
    - { id: protect, text: { en: "Add encryption to the labels, introduce automatic labeling and start insider risk policies.", fr: "Ajouter le chiffrement aux étiquettes, introduire l'étiquetage automatique et lancer des stratégies de gestion des risques internes." } }
    - { id: extend, text: { en: "Extend labels and DLP to SaaS apps, and scan on-premises file shares with the information protection scanner.", fr: "Étendre les étiquettes et la DLP aux applications SaaS, et analyser les partages de fichiers locaux avec le scanneur de protection des informations." } }
    - { id: blockall, text: { en: "Enable DLP policies that block all external sharing for every user.", fr: "Activer des stratégies DLP qui bloquent tout partage externe pour tous les utilisateurs." } }
    - { id: manylabels, text: { en: "Create a separate sensitivity label for each department and project.", fr: "Créer une étiquette de confidentialité distincte pour chaque service et chaque projet." } }
answer:
  sequence: [discover, schema, protect, extend]
explanation:
  correct:
    en: |-
      The scenario first discovers and identifies sensitive data, then develops and tests a classification schema, applies labels and starts with soft DLP policies that warn rather than block. Stage 3 adds protection (encryption) to labels, automatic labeling and insider risk management. Stage 4 extends protection to SaaS apps, on-premises file shares and cloud infrastructure.
    fr: |-
      Le scénario commence par découvrir et identifier les données sensibles, puis élabore et teste un schéma de classification, applique les étiquettes et commence par des stratégies DLP souples qui avertissent au lieu de bloquer. L'étape 3 ajoute la protection (chiffrement) aux étiquettes, l'étiquetage automatique et la gestion des risques internes. L'étape 4 étend la protection aux applications SaaS, aux partages de fichiers locaux et à l'infrastructure cloud.
  options:
    blockall:
      en: |-
        The guidance starts DLP in a soft mode that warns, then tightens it as confidence grows; blocking everything at once disrupts users.
      fr: |-
        Les recommandations commencent la DLP en mode souple qui avertit, puis la durcissent à mesure que la confiance augmente ; tout bloquer d'emblée perturbe les utilisateurs.
    manylabels:
      en: |-
        The guidance recommends a small schema of about three to five label tiers, because fewer labels are easier to use.
      fr: |-
        Les recommandations préconisent un schéma réduit d'environ trois à cinq niveaux d'étiquettes, car moins d'étiquettes sont plus faciles à utiliser.
references:
  - title: Identify and protect sensitive business data with Zero Trust
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/identify-protect-sensitive-business-data
