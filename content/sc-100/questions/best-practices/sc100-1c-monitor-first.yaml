id: sc100-1c-monitor-first
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has 60 Azure subscriptions in a management group hierarchy. The cloud governance team has written a new policy that requires a cost center tag on every resource group. The risk that the policy addresses is rated low priority. Workload teams deploy several times a day from pipelines, and the governance team wants to understand the impact of the policy before it affects any deployment.

    You need to recommend an enforcement approach that aligns with the Microsoft Cloud Adoption Framework for Azure (CAF).

    What should you recommend?
  fr: |
    Adatum Corporation dispose de 60 abonnements Azure dans une hiérarchie de groupes d'administration. L'équipe de gouvernance cloud a rédigé une nouvelle stratégie qui exige une étiquette de centre de coûts sur chaque groupe de ressources. Le risque traité par cette stratégie est classé en priorité basse. Les équipes des charges de travail déploient plusieurs fois par jour depuis des pipelines, et l'équipe de gouvernance souhaite comprendre l'impact de la stratégie avant qu'elle n'affecte un déploiement.

    Vous devez recommander une approche d'application alignée sur le Microsoft Cloud Adoption Framework for Azure (CAF).

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Assign the policy at the management group with an audit effect, review the compliance results, and then decide whether to block", fr: "Attribuer la stratégie au groupe d'administration avec un effet audit, examiner les résultats de conformité, puis décider s'il faut bloquer" } }
    - { id: b, text: { en: "Assign the policy at the management group with a deny effect, so that no resource group is created without the tag", fr: "Attribuer la stratégie au groupe d'administration avec un effet deny, afin qu'aucun groupe de ressources ne soit créé sans l'étiquette" } }
    - { id: c, text: { en: "Publish the policy in a compliance checklist, and have each workload team review its resource groups every quarter", fr: "Publier la stratégie dans une liste de contrôle de conformité, et faire vérifier ses groupes de ressources par chaque équipe tous les trimestres" } }
    - { id: d, text: { en: "Ask each workload team to assign the policy with a deny effect to its own subscriptions", fr: "Demander à chaque équipe de charge de travail d'attribuer la stratégie avec un effet deny à ses propres abonnements" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The CAF recommends a monitor-first approach for lower-priority risks: observe compliance before applying restrictive controls. It also recommends automated enforcement at the highest practical scope, such as a management group, so that every subscription inherits the policy. An audit assignment at the management group reports noncompliant resource groups without blocking any pipeline, and the team can tighten it once the impact is known.
    fr: |
      Le CAF recommande une approche « surveiller d'abord » pour les risques de priorité basse : observer la conformité avant d'appliquer des contrôles restrictifs. Il recommande aussi une application automatisée à l'étendue la plus élevée possible, comme un groupe d'administration, afin que chaque abonnement hérite de la stratégie. Une attribution en audit au groupe d'administration signale les groupes de ressources non conformes sans bloquer de pipeline, et l'équipe peut la durcir une fois l'impact connu.
  options:
    b:
      en: A deny effect blocks deployments immediately, before the team understands the impact, which the scenario wants to avoid.
      fr: Un effet deny bloque les déploiements immédiatement, avant que l'équipe ne comprenne l'impact, ce que le scénario veut éviter.
    c:
      en: The CAF keeps manual checks for cases that can't be automated; a tag requirement can be monitored automatically by Azure Policy.
      fr: Le CAF réserve les contrôles manuels aux cas qui ne peuvent pas être automatisés ; une exigence d'étiquette peut être surveillée automatiquement par Azure Policy.
    d:
      en: Per-subscription assignments by each team multiply the work, can drift apart and block deployments from the start.
      fr: Des attributions par abonnement faites par chaque équipe multiplient le travail, peuvent diverger et bloquent les déploiements dès le départ.
references:
  - title: Enforce cloud governance policies
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/enforce-cloud-governance-policies
