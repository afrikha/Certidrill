id: sc100-1b-caf-waf-scope
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank already governs its Azure estate by using Azure landing zones. The team that owns the card payments application asks you to evaluate the security of the application's architecture, from its identity and network design to its secrets, encryption and incident response, and to produce a prioritized list of improvements for that application.

    Which Microsoft guidance should you use?
  fr: |
    Woodgrove Bank gouverne déjà son patrimoine Azure avec des zones d'atterrissage Azure. L'équipe propriétaire de l'application de paiement par carte vous demande d'évaluer la sécurité de l'architecture de l'application, de sa conception des identités et du réseau à ses secrets, son chiffrement et sa réponse aux incidents, et de produire une liste priorisée d'améliorations pour cette application.

    Quelles recommandations Microsoft devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Security pillar of the Azure Well-Architected Framework and its design review checklist", fr: "Le pilier Sécurité d'Azure Well-Architected Framework et sa liste de contrôle de revue de conception" } }
    - { id: b, text: { en: "The Govern methodology of the Cloud Adoption Framework for Azure", fr: "La méthodologie Govern du Cloud Adoption Framework pour Azure" } }
    - { id: c, text: { en: "The business scenarios of the Zero Trust adoption framework", fr: "Les scénarios métier du framework d'adoption de la Confiance Zéro" } }
    - { id: d, text: { en: "The capability diagrams of the Microsoft Cybersecurity Reference Architectures", fr: "Les diagrammes de capacités des Microsoft Cybersecurity Reference Architectures" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The Well-Architected Framework applies to one workload. Its Security pillar provides a design review checklist (SE:01 to SE:12) that covers identity, segmentation, network, encryption, secrets, monitoring, testing and incident response, and the Well-Architected Review assessment helps prioritize improvements for that workload.
    fr: |-
      Le Well-Architected Framework s'applique à une charge de travail. Son pilier Sécurité fournit une liste de contrôle de revue de conception (SE:01 à SE:12) qui couvre l'identité, la segmentation, le réseau, le chiffrement, les secrets, la surveillance, les tests et la réponse aux incidents, et l'évaluation Well-Architected Review aide à prioriser les améliorations de cette charge de travail.
  options:
    b:
      en: |-
        The CAF Govern methodology governs the whole cloud estate (risks, policies, enforcement, compliance), which Woodgrove already does with landing zones.
      fr: |-
        La méthodologie Govern du CAF gouverne l'ensemble du patrimoine cloud (risques, stratégies, application, conformité), ce que Woodgrove fait déjà avec les zones d'atterrissage.
    c:
      en: |-
        The Zero Trust business scenarios organize an enterprise security program, not the review of one application's architecture.
      fr: |-
        Les scénarios métier de la Confiance Zéro organisent un programme de sécurité d'entreprise, pas la revue de l'architecture d'une application.
    d:
      en: |-
        The MCRA show which Microsoft capabilities exist and how they integrate; they aren't a review checklist for a workload.
      fr: |-
        Les MCRA montrent quelles capacités Microsoft existent et comment elles s'intègrent ; ce n'est pas une liste de contrôle de revue pour une charge de travail.
references:
  - title: Design review checklist for Security - Microsoft Azure Well-Architected Framework
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/checklist
