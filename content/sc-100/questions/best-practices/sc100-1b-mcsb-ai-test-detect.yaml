id: sc100-1b-mcsb-ai-test-detect
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. runs generative AI applications that use Azure OpenAI models. The security team has two requirements:

    - Find prompt injection and jailbreak weaknesses before each release and after every model or prompt change.
    - Alert the security operations center (SOC) when jailbreak attempts or data leakage occur against the production applications.

    You need to recommend a design that aligns with the Microsoft cloud security benchmark (MCSB).

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. exécute des applications d'IA générative qui utilisent des modèles Azure OpenAI. L'équipe de sécurité a deux exigences :

    - Trouver les faiblesses d'injection de prompts et de jailbreak avant chaque mise en production et après chaque changement de modèle ou de prompt.
    - Alerter le centre des opérations de sécurité (SOC) quand des tentatives de jailbreak ou des fuites de données se produisent contre les applications de production.

    Vous devez recommander une conception qui s'aligne sur le Microsoft cloud security benchmark (MCSB).

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Before each release: implement [[c1]] by using [[t1]].

      In production: implement [[c2]] by using [[t2]].
    fr: |
      Avant chaque mise en production : implémenter [[c1]] avec [[t1]].

      En production : implémenter [[c2]] avec [[t2]].
  slots:
    - id: c1
      options:
        - { id: ai1, text: "AI-1: Ensure use of approved models" }
        - { id: ai3, text: "AI-3: Adopt safety meta-prompts" }
        - { id: ai7, text: "AI-7: Perform continuous AI red teaming" }
    - id: t1
      options:
        - { id: pyrit, text: { en: "PyRIT automated in the CI/CD pipeline", fr: "PyRIT automatisé dans le pipeline CI/CD" } }
        - { id: policy, text: { en: "Azure Policy compliance scans", fr: "Les analyses de conformité Azure Policy" } }
        - { id: dlp, text: { en: "Microsoft Purview Data Loss Prevention", fr: "La protection contre la perte de données Microsoft Purview" } }
    - id: c2
      options:
        - { id: ai2, text: "AI-2: Implement multi-layered content filtering" }
        - { id: ai5, text: "AI-5: Ensure human-in-the-loop" }
        - { id: ai6, text: "AI-6: Establish monitoring and detection" }
    - id: t2
      options:
        - { id: registry, text: { en: "The Azure Machine Learning model registry", fr: "Le registre de modèles Azure Machine Learning" } }
        - { id: mdc, text: { en: "Microsoft Defender for Cloud threat protection for AI services", fr: "La protection contre les menaces pour les services d'IA de Microsoft Defender for Cloud" } }
        - { id: logicapps, text: { en: "Azure Logic Apps approval workflows", fr: "Les workflows d'approbation Azure Logic Apps" } }
answer:
  values: { c1: ai7, t1: pyrit, c2: ai6, t2: mdc }
explanation:
  correct:
    en: |-
      AI-7 asks for continuous red teaming embedded in CI/CD, with tools such as PyRIT or the AI Red Teaming Agent, so that tests run on every change. AI-6 asks to detect jailbreaks, prompt injection and data exfiltration in operation; Defender for Cloud threat protection for AI services raises these alerts for Azure OpenAI models and can send them to the SOC through Defender XDR or Microsoft Sentinel.
    fr: |-
      AI-7 demande un red teaming continu intégré au CI/CD, avec des outils comme PyRIT ou AI Red Teaming Agent, pour que les tests s'exécutent à chaque changement. AI-6 demande de détecter le jailbreak, l'injection de prompts et l'exfiltration de données en fonctionnement ; la protection contre les menaces pour les services d'IA de Defender for Cloud génère ces alertes pour les modèles Azure OpenAI et peut les transmettre au SOC via Defender XDR ou Microsoft Sentinel.
  options:
    ai2:
      en: |-
        Content filtering blocks malicious input, but the requirement is to alert the SOC, which is monitoring and detection.
      fr: |-
        Le filtrage de contenu bloque les entrées malveillantes, mais l'exigence est d'alerter le SOC, ce qui relève de la surveillance et de la détection.
    ai3:
      en: |-
        Safety meta-prompts harden the system instructions; they don't test the application for weaknesses.
      fr: |-
        Les méta-prompts de sécurité renforcent les instructions système ; ils ne testent pas l'application pour trouver des faiblesses.
references:
  - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security
  - title: AI threat protection in Microsoft Defender for Cloud - Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
