id: sc100-1b-zt-compliance-scenario
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders processes personal data of European customers in Microsoft 365 and Azure. An upcoming audit will check compliance with GDPR and ISO/IEC 27001. The Zero Trust program must address the following requirements:

    - Identify the regulations that apply and assess the gaps against them.
    - Convert the required controls into measurable objectives and track a compliance score with improvement actions that auditors can review.
    - Discover and label the personal data, and protect it with DLP, as part of the same plan.

    You need to recommend the business scenario of the Zero Trust adoption framework that the plan should follow, and the tool to track progress.

    What should you recommend?
  fr: |
    Northwind Traders traite des données personnelles de clients européens dans Microsoft 365 et Azure. Un audit à venir vérifiera la conformité au RGPD et à ISO/IEC 27001. Le programme Confiance Zéro doit répondre aux exigences suivantes :

    - Identifier les réglementations applicables et évaluer les écarts par rapport à celles-ci.
    - Convertir les contrôles requis en objectifs mesurables et suivre un score de conformité avec des actions d'amélioration que les auditeurs peuvent examiner.
    - Découvrir et étiqueter les données personnelles, et les protéger avec la DLP, dans le même plan.

    Vous devez recommander le scénario métier du framework d'adoption de la Confiance Zéro que le plan doit suivre, et l'outil de suivi de la progression.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Identify and protect sensitive business data, tracked with content explorer", fr: "Identify and protect sensitive business data, suivi avec l'explorateur de contenu" } }
    - { id: b, text: { en: "Meet regulatory and compliance requirements, tracked with Microsoft Purview Compliance Manager", fr: "Meet regulatory and compliance requirements, suivi avec Microsoft Purview Compliance Manager" } }
    - { id: c, text: { en: "Rapidly modernize your security posture, tracked with Microsoft Security Exposure Management", fr: "Rapidly modernize your security posture, suivi avec Microsoft Security Exposure Management" } }
    - { id: d, text: { en: "Meet regulatory and compliance requirements, tracked with Azure Policy compliance results", fr: "Meet regulatory and compliance requirements, suivi avec les résultats de conformité Azure Policy" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Meet regulatory and compliance requirements scenario starts by identifying the applicable regulations and assessing gaps, then discovers and protects regulated data with labels and DLP, and ends with continuous compliance. Compliance Manager provides the assessments, improvement actions and compliance score used throughout the scenario and supports reporting to auditors.
    fr: |-
      Le scénario Meet regulatory and compliance requirements commence par identifier les réglementations applicables et évaluer les écarts, puis découvre et protège les données réglementées avec des étiquettes et la DLP, et se termine par la conformité continue. Compliance Manager fournit les évaluations, les actions d'amélioration et le score de conformité utilisés tout au long du scénario, et facilite les rapports destinés aux auditeurs.
  options:
    a:
      en: |-
        The data scenario covers discovery and labeling, but it doesn't map regulations to controls; content explorer shows where sensitive data is, not a compliance score.
      fr: |-
        Le scénario des données couvre la découverte et l'étiquetage, mais il ne mappe pas les réglementations aux contrôles ; l'explorateur de contenu montre où se trouvent les données sensibles, pas un score de conformité.
    c:
      en: |-
        This scenario measures overall posture with exposure scores; it isn't organized around regulations and auditors.
      fr: |-
        Ce scénario mesure la posture globale avec des scores d'exposition ; il n'est pas organisé autour des réglementations et des auditeurs.
    d:
      en: |-
        The scenario is right, but Azure Policy only evaluates Azure resources and doesn't track improvement actions for the Microsoft 365 data.
      fr: |-
        Le scénario est le bon, mais Azure Policy n'évalue que les ressources Azure et ne suit pas d'actions d'amélioration pour les données Microsoft 365.
references:
  - title: Meet regulatory and compliance requirements with Zero Trust
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/meet-regulatory-compliance-requirements
