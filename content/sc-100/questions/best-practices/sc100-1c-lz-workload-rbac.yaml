id: sc100-1c-lz-workload-rbac
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Azure landing zones and automates subscription vending. Each workload team must be able to manage only the resources of its own workload landing zone subscriptions. The platform team wants to follow the principle of least privilege and the recommendations of the Microsoft Cloud Adoption Framework for Azure (CAF).

    You need to recommend where to assign the Azure RBAC roles of the workload teams.

    What should you recommend?
  fr: |
    Tailspin Toys utilise des zones d'atterrissage Azure et automatise la distribution d'abonnements (subscription vending). Chaque équipe de charge de travail doit pouvoir gérer uniquement les ressources des abonnements de sa propre zone d'atterrissage. L'équipe de plateforme souhaite suivre le principe du moindre privilège et les recommandations du Microsoft Cloud Adoption Framework for Azure (CAF).

    Vous devez recommander où attribuer les rôles Azure RBAC des équipes des charges de travail.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "On the workload subscriptions or resource groups, as part of the subscription vending process", fr: "Sur les abonnements ou groupes de ressources de la charge de travail, dans le cadre de la distribution d'abonnements" } }
    - { id: b, text: { en: "On the Corp and Online management groups, depending on the workload type of each team", fr: "Sur les groupes d'administration Corp et Online, selon le type de charge de travail de chaque équipe" } }
    - { id: c, text: { en: "On the Landing zones management group, with one assignment for each workload team", fr: "Sur le groupe d'administration Landing zones, avec une attribution par équipe de charge de travail" } }
    - { id: d, text: { en: "On the intermediate root management group, with eligible assignments in Privileged Identity Management", fr: "Sur le groupe d'administration racine intermédiaire, avec des attributions éligibles dans Privileged Identity Management" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The CAF recommends not assigning workload team permissions at management group scope. Workload teams receive their roles at the subscription or resource group level, typically during subscription vending, so each team reaches only its own landing zone. Management group roles are kept for platform teams, controlled with Privileged Identity Management.
    fr: |
      Le CAF recommande de ne pas attribuer les autorisations des équipes des charges de travail à l'étendue d'un groupe d'administration. Les équipes reçoivent leurs rôles au niveau de l'abonnement ou du groupe de ressources, généralement lors de la distribution d'abonnements : chaque équipe n'atteint ainsi que sa propre zone d'atterrissage. Les rôles au niveau des groupes d'administration sont réservés aux équipes de plateforme, contrôlés par Privileged Identity Management.
  options:
    b:
      en: |-
        A role on Corp or Online is inherited by every subscription in that management group, so a team could manage other teams' workloads.
      fr: |-
        Un rôle sur Corp ou Online est hérité par chaque abonnement de ce groupe d'administration : une équipe pourrait gérer les charges de travail des autres équipes.
    c:
      en: |-
        A role on Landing zones reaches every workload subscription below it, which breaks least privilege.
      fr: |-
        Un rôle sur Landing zones atteint chaque abonnement de charge de travail placé dessous, ce qui enfreint le moindre privilège.
    d:
      en: |-
        Just-in-time activation limits standing access but not the scope: the role would still cover the whole hierarchy, platform included.
      fr: |-
        L'activation juste-à-temps limite l'accès permanent mais pas l'étendue : le rôle couvrirait toujours toute la hiérarchie, plateforme comprise.
references:
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
