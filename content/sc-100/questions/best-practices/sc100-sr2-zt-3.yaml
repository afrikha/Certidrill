stem:
  en: |
    You recommend the "Secure remote and hybrid work" business scenario.
  fr: |
    Vous recommandez le scénario métier « Secure remote and hybrid work ».
body:
  solution:
    en: |
      You recommend that the program follow the **Secure remote and hybrid work** business scenario of the Zero Trust adoption framework.
    fr: |
      Vous recommandez que le programme suive le scénario métier **Secure remote and hybrid work** du framework d'adoption de la Confiance Zéro.
answer: { value: true }
explanation:
  correct:
    en: |
      The Zero Trust adoption framework organizes guidance into business scenarios that executives can sponsor. Secure remote and hybrid work covers strong authentication with Conditional Access, device registration, management and compliance, and access to Microsoft 365, SaaS, and on-premises apps. It uses the lifecycle phases adapted from the Cloud Adoption Framework, from defining the strategy to governing and managing, and the framework provides an adoption tracker and an objectives workbook.
    fr: |
      Le framework d'adoption de la Confiance Zéro organise ses recommandations en scénarios métier que la direction peut parrainer. Secure remote and hybrid work couvre l'authentification forte avec l'accès conditionnel, l'inscription, la gestion et la conformité des appareils, et l'accès à Microsoft 365, aux applications SaaS et aux applications locales. Il utilise les phases de cycle de vie adaptées du Cloud Adoption Framework, de la définition de la stratégie à la gouvernance et à la gestion, et le framework fournit un outil de suivi de l'adoption et un classeur d'objectifs.
references:
  - title: Secure remote and hybrid work with Zero Trust
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/secure-remote-hybrid-work
  - title: Zero Trust adoption framework overview
