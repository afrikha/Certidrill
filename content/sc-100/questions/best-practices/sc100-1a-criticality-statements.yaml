id: sc100-1a-criticality-statements
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Security Exposure Management to identify and prioritize threats to its business-critical assets. The environment contains on-premises domain controllers, servers and workstations, Microsoft Entra ID, and Azure resources. The security team relies on the predefined classifications and hasn't created custom classifications.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Security Exposure Management pour identifier et hiérarchiser les menaces qui pèsent sur ses ressources vitales pour l'entreprise. L'environnement contient des contrôleurs de domaine, des serveurs et des stations de travail locaux, Microsoft Entra ID et des ressources Azure. L'équipe de sécurité s'appuie sur les classifications prédéfinies et n'a créé aucune classification personnalisée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The domain controllers are classified at the Very High criticality level by default.
        fr: |-
          Les contrôleurs de domaine sont classés au niveau de criticité Very High par défaut.
    - id: s2
      text:
        en: |-
          When an asset matches several classification rules, Exposure Management applies the lowest of their criticality levels.
        fr: |-
          Quand une ressource correspond à plusieurs règles de classification, Exposure Management applique le plus bas de leurs niveaux de criticité.
    - id: s3
      text:
        en: |-
          Alerts and incidents show whether the affected asset is classified as business-critical.
        fr: |-
          Les alertes et les incidents indiquent si la ressource concernée est classée comme vitale pour l'entreprise.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The predefined Domain Controller classification is Very High, like Global Administrator and Microsoft Entra ID. When several rules apply to one asset, the rule with the highest criticality level takes precedence. Criticality is used beyond Exposure Management itself: incidents and alerts mark business-critical assets with a crown indicator, which helps the SOC prioritize.
    fr: |
      La classification prédéfinie Domain Controller est Very High, comme Global Administrator et Microsoft Entra ID. Quand plusieurs règles s'appliquent à une ressource, la règle de plus haut niveau de criticité l'emporte. La criticité est utilisée au-delà d'Exposure Management : les incidents et les alertes signalent les ressources vitales par une couronne, ce qui aide le SOC à prioriser.
references:
  - title: Predefined classifications
    url: https://learn.microsoft.com/en-us/security-exposure-management/predefined-classification-rules-and-levels
  - title: Overview of critical asset management
    url: https://learn.microsoft.com/en-us/security-exposure-management/critical-asset-management
