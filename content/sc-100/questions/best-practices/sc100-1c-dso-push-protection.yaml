id: sc100-1c-dso-push-protection
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation hosts its source code in Azure Repos. Developers have accidentally committed storage account keys several times. As part of its DevSecOps process, the security team must stop new secrets from reaching the repositories. The company doesn't want to pay for code scanning capabilities that it won't use.

    You need to recommend a solution.

    What should you recommend?
  fr: |
    Adatum Corporation héberge son code source dans Azure Repos. Les développeurs ont validé par erreur des clés de compte de stockage à plusieurs reprises. Dans le cadre de son processus DevSecOps, l'équipe de sécurité doit empêcher les nouveaux secrets d'atteindre les dépôts. L'entreprise ne souhaite pas payer des capacités d'analyse du code qu'elle n'utilisera pas.

    Vous devez recommander une solution.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "GitHub Code Security for Azure DevOps with CodeQL scanning", fr: "GitHub Code Security for Azure DevOps avec l'analyse CodeQL" } }
    - { id: b, text: { en: "A Microsoft Sentinel analytics rule on the Azure DevOps audit log", fr: "Une règle d'analyse Microsoft Sentinel sur le journal d'audit Azure DevOps" } }
    - { id: c, text: { en: "GitHub Secret Protection for Azure DevOps with push protection", fr: "GitHub Secret Protection for Azure DevOps avec la protection push" } }
    - { id: d, text: { en: "Defender for Cloud DevOps security recommendations for exposed secrets", fr: "Les recommandations de sécurité DevOps de Defender for Cloud pour les secrets exposés" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      GitHub Secret Protection for Azure DevOps includes push protection, which blocks pushes that contain secrets, plus secret scanning alerts for existing exposures. It's sold separately from GitHub Code Security for Azure DevOps, so the company pays only for the secret capabilities. Push protection evaluates the pushes made after it's enabled, so it stops new secrets before they reach the repository.
    fr: |
      GitHub Secret Protection for Azure DevOps comprend la protection push, qui bloque les push contenant des secrets, ainsi que les alertes d'analyse des secrets pour les expositions existantes. Il est vendu séparément de GitHub Code Security for Azure DevOps : l'entreprise ne paie donc que les capacités liées aux secrets. La protection push évalue les push effectués après son activation : elle arrête les nouveaux secrets avant qu'ils n'atteignent le dépôt.
  options:
    a:
      en: |-
        Code Security provides CodeQL and dependency alerts, the code scanning the company doesn't want, and doesn't block secrets.
      fr: |-
        Code Security fournit CodeQL et les alertes de dépendances, l'analyse du code que l'entreprise ne veut pas, et ne bloque pas les secrets.
    b:
      en: |-
        A Sentinel rule would alert after the event; it can't block the push.
      fr: |-
        Une règle Sentinel alerterait après coup ; elle ne peut pas bloquer le push.
    d:
      en: |-
        Defender for Cloud shows exposed secret findings after they exist, and for Azure DevOps it relies on GitHub Advanced Security for Azure DevOps to produce them.
      fr: |-
        Defender for Cloud affiche les secrets exposés une fois qu'ils existent, et pour Azure DevOps il s'appuie sur GitHub Advanced Security for Azure DevOps pour les produire.
references:
  - title: Configure GitHub Advanced Security for Azure DevOps features
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features
