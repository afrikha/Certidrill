id: sc100-1b-zt-adoption-statements
objective: "1.2.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys is planning the Secure remote and hybrid work business scenario of the Zero Trust adoption framework. The project team wrote the following planning assumptions.

    For each of the following statements, select **Yes** if the statement is consistent with the Zero Trust adoption guidance. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys planifie le scénario métier Secure remote and hybrid work du framework d'adoption de la Confiance Zéro. L'équipe projet a rédigé les hypothèses de planification suivantes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est conforme aux recommandations d'adoption de la Confiance Zéro. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The team secures identities first, then endpoints, then apps, then the network.
        fr: |-
          L'équipe sécurise d'abord les identités, puis les points de terminaison, puis les applications, puis le réseau.
    - id: s2
      text:
        en: |-
          In the Ready phase, the team deploys the new Conditional Access policies to all users at the same time, so that no group stays unprotected during the rollout.
        fr: |-
          Dans la phase Ready, l'équipe déploie les nouvelles stratégies d'accès conditionnel à tous les utilisateurs en même temps, pour qu'aucun groupe ne reste non protégé pendant le déploiement.
    - id: s3
      text:
        en: |-
          The stage 1 objectives of the business scenarios are aligned, so that the organization progresses on all scenarios together.
        fr: |-
          Les objectifs de l'étape 1 des scénarios métier sont alignés, pour que l'organisation progresse sur tous les scénarios ensemble.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      The remote and hybrid work guidance secures identities, endpoints, apps and network in that order. In the Ready phase, it recommends testing in a test tenant and rolling out in waves (evaluate, pilot, then full deployment), so that a misconfigured Conditional Access policy can't lock out users or administrators. The adoption framework aligns stage 1 objectives across scenarios so that progress happens on all fronts together.
    fr: |-
      Les recommandations sur le travail à distance et hybride sécurisent les identités, les points de terminaison, les applications et le réseau dans cet ordre. Dans la phase Ready, elles recommandent de tester dans un locataire de test et de déployer par vagues (évaluation, pilote, puis déploiement complet), pour qu'une stratégie d'accès conditionnel mal configurée ne puisse pas bloquer les utilisateurs ou les administrateurs. Le framework d'adoption aligne les objectifs de l'étape 1 entre les scénarios pour que la progression ait lieu sur tous les fronts à la fois.
references:
  - title: Secure remote and hybrid work with Zero Trust
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/secure-remote-hybrid-work
  - title: Zero Trust adoption framework overview
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/zero-trust-adoption-overview
