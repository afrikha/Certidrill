id: sc100-1a-mcra-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. plans to use the Microsoft Cybersecurity Reference Architectures (MCRA) to align its security design with Microsoft's best practices for cybersecurity capabilities. The company has an on-premises datacenter, plants with operational technology (OT), and workloads in Azure, AWS and GCP.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. prévoit d'utiliser les Microsoft Cybersecurity Reference Architectures (MCRA) pour aligner sa conception de sécurité sur les bonnes pratiques de Microsoft relatives aux capacités de cybersécurité. L'entreprise dispose d'un centre de données local, d'usines avec des technologies opérationnelles (OT) et de charges de travail dans Azure, AWS et GCP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The MCRA are a component of Microsoft's Security Adoption Framework (SAF).
        fr: |-
          Les MCRA sont une composante du Security Adoption Framework (SAF) de Microsoft.
    - id: s2
      text:
        en: |-
          The MCRA include diagrams for OT and for multicloud and cross-platform capabilities.
        fr: |-
          Les MCRA comprennent des diagrammes pour l'OT et pour les capacités multiclouds et multiplateformes.
    - id: s3
      text:
        en: |-
          Defender for Cloud uses the MCRA as its default standard to calculate the compliance of Azure resources.
        fr: |-
          Defender for Cloud utilise les MCRA comme norme par défaut pour calculer la conformité des ressources Azure.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The MCRA are a component of the Security Adoption Framework, which helps modernize security strategy, governance, architecture and operations. The deck includes detailed diagrams for Microsoft cybersecurity capabilities, Zero Trust user access, security operations, OT, multicloud and cross-platform capabilities, attack chain coverage and more. The default standard of Defender for Cloud is the Microsoft cloud security benchmark, not the MCRA, which are architecture diagrams rather than assessable controls.
    fr: |
      Les MCRA sont une composante du Security Adoption Framework, qui aide à moderniser la stratégie, la gouvernance, l'architecture et les opérations de sécurité. Le jeu de diagrammes comprend des diagrammes détaillés des capacités de cybersécurité Microsoft, de l'accès utilisateur Confiance Zéro, des opérations de sécurité, de l'OT, des capacités multiclouds et multiplateformes, de la couverture de la chaîne d'attaque, entre autres. La norme par défaut de Defender for Cloud est le Microsoft cloud security benchmark, pas les MCRA, qui sont des diagrammes d'architecture et non des contrôles évaluables.
references:
  - title: Microsoft Cybersecurity Reference Architectures
    url: https://learn.microsoft.com/en-us/security/adoption/mcra
  - title: Regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
