id: sc100-1c-dso-testing-types
objective: "1.3.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is adding automated security checks to the DevSecOps pipeline of a web application. The application uses open-source packages, and its infrastructure is deployed from Bicep templates. The DevSecOps lead lists four requirements.

    Which practice should you recommend for each requirement? To answer, drag the appropriate practices to the correct requirements. Each practice may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. ajoute des contrôles de sécurité automatisés au pipeline DevSecOps d'une application web. L'application utilise des packages open source, et son infrastructure est déployée à partir de modèles Bicep. Le responsable DevSecOps énumère quatre exigences.

    Quelle pratique devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les pratiques appropriées vers les exigences correspondantes. Chaque pratique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dast, text: { en: "Dynamic application security testing (DAST)", fr: "Tests dynamiques de sécurité des applications (DAST)" } }
    - { id: secret, text: { en: "Secret scanning", fr: "Analyse des secrets" } }
    - { id: iac, text: { en: "Infrastructure as code (IaC) scanning", fr: "Analyse de l'infrastructure as code (IaC)" } }
    - { id: sast, text: { en: "Static application security testing (SAST)", fr: "Tests statiques de sécurité des applications (SAST)" } }
    - { id: pentest, text: { en: "Third-party penetration testing", fr: "Test d'intrusion par un tiers" } }
    - { id: dep, text: { en: "Dependency scanning", fr: "Analyse des dépendances" } }
  targets:
    - id: t1
      text: { en: "Analyze the application source code for vulnerabilities at every pull request", fr: "Analyser le code source de l'application à la recherche de vulnérabilités à chaque pull request" }
    - id: t2
      text: { en: "After each deployment to staging, automatically test the running application against common attack patterns", fr: "Après chaque déploiement en préproduction, tester automatiquement l'application en cours d'exécution contre des modèles d'attaque courants" }
    - id: t3
      text: { en: "Find known vulnerabilities in the open-source packages that the application uses", fr: "Trouver les vulnérabilités connues des packages open source utilisés par l'application" }
    - id: t4
      text: { en: "Detect misconfigurations in the Bicep templates before they're deployed", fr: "Détecter les erreurs de configuration dans les modèles Bicep avant leur déploiement" }
answer:
  mapping: { t1: sast, t2: dast, t3: dep, t4: iac }
explanation:
  correct:
    en: |
      The Well-Architected Framework recommends SAST to scan code as it's written and DAST to test the running application against realistic attacks, both as quality gates in the pipeline. Continuous dependency scanning finds vulnerable open-source components in the supply chain. IaC template scans catch misconfigurations, compliance issues and policy violations before the infrastructure is deployed.
    fr: |
      Le Well-Architected Framework recommande SAST pour analyser le code au fil de son écriture et DAST pour tester l'application en cours d'exécution contre des attaques réalistes, tous deux comme critères de qualité du pipeline. L'analyse continue des dépendances trouve les composants open source vulnérables de la chaîne d'approvisionnement. L'analyse des modèles IaC détecte les erreurs de configuration, les problèmes de conformité et les violations de stratégie avant le déploiement de l'infrastructure.
  options:
    pentest:
      en: |-
        A penetration test is a point-in-time exercise by external experts, not an automated check after each deployment.
      fr: |-
        Un test d'intrusion est un exercice ponctuel mené par des experts externes, pas un contrôle automatisé après chaque déploiement.
    secret:
      en: |-
        Secret scanning finds credentials in the code; it doesn't find code vulnerabilities, vulnerable packages or template misconfigurations.
      fr: |-
        L'analyse des secrets trouve des informations d'identification dans le code ; elle ne trouve ni vulnérabilités du code, ni packages vulnérables, ni erreurs de configuration des modèles.
references:
  - title: Architecture strategies for securing a development lifecycle
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/secure-development-lifecycle
  - title: Perform Your Cloud Adoption Securely
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/secure/adopt
