id: sc100-1c-monitor-security-tool
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys follows the Govern methodology of the Microsoft Cloud Adoption Framework for Azure (CAF). The governance team has documented security policies for 25 Azure subscriptions and for AWS accounts that are connected to Microsoft security services. For the monitor step, the team must review security recommendations, track the secure score and use a regulatory compliance dashboard for these environments.

    You need to recommend a tool for this monitoring.

    What should you recommend?
  fr: |
    Tailspin Toys suit la méthodologie Govern du Microsoft Cloud Adoption Framework for Azure (CAF). L'équipe de gouvernance a documenté des stratégies de sécurité pour 25 abonnements Azure et pour des comptes AWS connectés aux services de sécurité Microsoft. Pour l'étape de surveillance, l'équipe doit examiner les recommandations de sécurité, suivre le degré de sécurisation et utiliser un tableau de bord de conformité réglementaire pour ces environnements.

    Vous devez recommander un outil pour cette surveillance.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Microsoft Sentinel }
    - { id: b, text: Microsoft Purview }
    - { id: c, text: Microsoft Defender for Cloud }
    - { id: d, text: Azure Service Health }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For security governance, the CAF monitoring guidance points to Defender for Cloud: review its security recommendations, monitor the secure score and use the regulatory compliance dashboard. Defender for Cloud assesses Azure subscriptions and connected AWS accounts, so one tool covers both environments.
    fr: |
      Pour la gouvernance de la sécurité, les recommandations de surveillance du CAF désignent Defender for Cloud : examiner ses recommandations de sécurité, surveiller le degré de sécurisation et utiliser le tableau de bord de conformité réglementaire. Defender for Cloud évalue les abonnements Azure et les comptes AWS connectés : un seul outil couvre donc les deux environnements.
  options:
    a:
      en: Microsoft Sentinel detects and responds to threats; it doesn't provide a secure score or security recommendations for resources.
      fr: Microsoft Sentinel détecte les menaces et y répond ; il ne fournit ni degré de sécurisation ni recommandations de sécurité pour les ressources.
    b:
      en: Microsoft Purview is the CAF tool for monitoring data governance, not cloud resource security posture.
      fr: Microsoft Purview est l'outil du CAF pour surveiller la gouvernance des données, pas la posture de sécurité des ressources cloud.
    d:
      en: Service Health reports Azure service incidents and maintenance that affect operations; it doesn't measure security posture.
      fr: Service Health signale les incidents et les maintenances des services Azure qui affectent l'exploitation ; il ne mesure pas la posture de sécurité.
references:
  - title: Monitor cloud compliance
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/monitor-cloud-governance
