id: sc100-1a-aws-default-standards
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. connects its AWS accounts to Microsoft Defender for Cloud. The security architect wants the AWS workloads to be assessed against best-practice controls as soon as the connector is created, before any regulatory standard is assigned.

    You need to identify which standards Defender for Cloud enables by default for the AWS accounts.

    Which standards should you identify?
  fr: |
    Fabrikam, Inc. connecte ses comptes AWS à Microsoft Defender for Cloud. L'architecte de sécurité veut que les charges de travail AWS soient évaluées par rapport à des contrôles de bonnes pratiques dès la création du connecteur, avant l'attribution de toute norme réglementaire.

    Vous devez identifier les normes que Defender for Cloud active par défaut pour les comptes AWS.

    Quelles normes devez-vous identifier ?
body:
  options:
    - { id: a, text: { en: "The MCSB and AWS Foundational Security Best Practices", fr: "Le MCSB et AWS Foundational Security Best Practices" } }
    - { id: b, text: { en: "The MCSB only", fr: "Le MCSB uniquement" } }
    - { id: c, text: { en: "The MCSB and CIS AWS Foundations v3.0.0", fr: "Le MCSB et CIS AWS Foundations v3.0.0" } }
    - { id: d, text: { en: "The MCSB and AWS Well Architected Framework 2024", fr: "Le MCSB et AWS Well Architected Framework 2024" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Enabling Defender for Cloud turns on the Microsoft cloud security benchmark by default. For Azure, the MCSB is the only default standard; for AWS, the MCSB and AWS Foundational Security Best Practices are enabled; for GCP, the MCSB and GCP Default are enabled.
    fr: |
      L'activation de Defender for Cloud active par défaut le Microsoft cloud security benchmark. Pour Azure, le MCSB est la seule norme par défaut ; pour AWS, le MCSB et AWS Foundational Security Best Practices sont activés ; pour GCP, le MCSB et GCP Default sont activés.
  options:
    b:
      en: |-
        The MCSB alone is the default for Azure subscriptions. AWS connectors also get AWS Foundational Security Best Practices.
      fr: |-
        Le MCSB seul est la norme par défaut des abonnements Azure. Les connecteurs AWS reçoivent aussi AWS Foundational Security Best Practices.
    c:
      en: |-
        CIS AWS Foundations v3.0.0 is available for AWS, but you must assign it; it isn't enabled by default.
      fr: |-
        CIS AWS Foundations v3.0.0 est disponible pour AWS, mais vous devez l'attribuer ; il n'est pas activé par défaut.
    d:
      en: |-
        AWS Well Architected Framework 2024 is an available standard that you assign; it isn't enabled by default.
      fr: |-
        AWS Well Architected Framework 2024 est une norme disponible que vous attribuez ; elle n'est pas activée par défaut.
references:
  - title: Regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
