id: sc100-1b-waf-checklist-map
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is reviewing the design of its claims processing workload with the security design review checklist of the Azure Well-Architected Framework (WAF). The review found three gaps:

    - Database connection strings were never rotated, and no process exists for an emergency rotation.
    - The workload data isn't labeled by sensitivity, so the team can't decide which data needs the strongest controls.
    - Incident procedures cover only server outages and don't say which team runs them.

    Which WAF recommendation addresses each gap? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. examine la conception de sa charge de travail de traitement des réclamations avec la liste de contrôle de revue de conception de sécurité d'Azure Well-Architected Framework (WAF). La revue a trouvé trois écarts :

    - Les chaînes de connexion aux bases de données n'ont jamais été renouvelées, et aucun processus n'existe pour un renouvellement d'urgence.
    - Les données de la charge de travail ne sont pas étiquetées selon leur sensibilité : l'équipe ne peut pas déterminer quelles données exigent les contrôles les plus forts.
    - Les procédures d'incident ne couvrent que les pannes de serveurs et n'indiquent pas quelle équipe les exécute.

    Quelle recommandation du WAF traite chaque écart ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Connection string rotation: [[s1]]

      Data sensitivity labels: [[s2]]

      Incident procedures: [[s3]]
    fr: |
      Renouvellement des chaînes de connexion : [[s1]]

      Étiquettes de sensibilité des données : [[s2]]

      Procédures d'incident : [[s3]]
  slots:
    - id: s1
      options:
        - { id: se05, text: "SE:05" }
        - { id: se07, text: "SE:07" }
        - { id: se09, text: "SE:09" }
    - id: s2
      options:
        - { id: se01, text: "SE:01" }
        - { id: se03, text: "SE:03" }
        - { id: se04, text: "SE:04" }
    - id: s3
      options:
        - { id: se12, text: "SE:12" }
        - { id: se10, text: "SE:10" }
        - { id: se11, text: "SE:11" }
answer:
  values: { s1: se09, s2: se03, s3: se12 }
explanation:
  correct:
    en: |-
      SE:09 protects application secrets by hardening their storage, restricting and auditing access, and running a regular rotation process that can handle emergencies. SE:03 classifies and labels workload data and systems by sensitivity and uses the classification to prioritize security. SE:12 defines and tests incident response procedures from localized issues to disaster recovery, and defines which team or individual runs each procedure.
    fr: |-
      SE:09 protège les secrets d'application en durcissant leur stockage, en restreignant et en auditant l'accès, et en appliquant un processus de renouvellement régulier capable de gérer les urgences. SE:03 classifie et étiquette les données et les systèmes de la charge de travail selon leur sensibilité et utilise la classification pour prioriser la sécurité. SE:12 définit et teste les procédures de réponse aux incidents, des problèmes localisés à la reprise d'activité, et indique quelle équipe ou quelle personne exécute chaque procédure.
  options:
    se05:
      en: |-
        SE:05 covers identity and access management, not the rotation of stored secrets.
      fr: |-
        SE:05 couvre la gestion des identités et des accès, pas le renouvellement des secrets stockés.
    se01:
      en: |-
        SE:01 establishes a security baseline aligned with compliance and standards; labeling data is SE:03.
      fr: |-
        SE:01 établit une base de référence de sécurité alignée sur la conformité et les normes ; l'étiquetage des données relève de SE:03.
    se10:
      en: |-
        SE:10 covers monitoring and threat detection that feed incident response, not the procedures themselves.
      fr: |-
        SE:10 couvre la surveillance et la détection des menaces qui alimentent la réponse aux incidents, pas les procédures elles-mêmes.
references:
  - title: Design review checklist for Security - Microsoft Azure Well-Architected Framework
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/checklist
