id: sc100-1b-caf-risk-register
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is evaluating its cloud risk management practices against the Govern methodology of the Cloud Adoption Framework for Azure (CAF). Today, each workload team rates its own risks with its own scale, risks are owned by a committee, and the risk list is updated only during the annual external audit.

    You need to recommend changes that align the practices with CAF.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation évalue ses pratiques de gestion des risques cloud par rapport à la méthodologie Govern du Cloud Adoption Framework pour Azure (CAF). Aujourd'hui, chaque équipe de charge de travail évalue ses propres risques sur sa propre échelle, les risques appartiennent à un comité, et la liste des risques n'est mise à jour que lors de l'audit externe annuel.

    Vous devez recommander des changements qui alignent les pratiques sur le CAF.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ownership: [[s1]]

      Prioritization: [[s2]]

      Review of the risk register: [[s3]]
    fr: |
      Propriété : [[s1]]

      Priorisation : [[s2]]

      Revue du registre des risques : [[s3]]
  slots:
    - id: s1
      options:
        - { id: committee, text: { en: "Keep the committee as the shared owner of every risk", fr: "Conserver le comité comme propriétaire partagé de chaque risque" } }
        - { id: owner, text: { en: "Assign one primary owner to each risk", fr: "Attribuer un propriétaire principal à chaque risque" } }
        - { id: sponsor, text: { en: "Make the executive sponsor the owner of every risk", fr: "Désigner le parrain exécutif comme propriétaire de chaque risque" } }
    - id: s2
      options:
        - { id: teamscale, text: { en: "Keep a scale chosen by each workload team", fr: "Conserver une échelle choisie par chaque équipe de charge de travail" } }
        - { id: probonly, text: { en: "Rank the risks by probability alone", fr: "Classer les risques selon leur seule probabilité" } }
        - { id: formula, text: { en: "Use one method for all teams: probability × impact", fr: "Utiliser une méthode unique pour toutes les équipes : probabilité × impact" } }
    - id: s3
      options:
        - { id: events, text: { en: "On a regular schedule and after events such as a failed control", fr: "À un rythme régulier et après des événements comme l'échec d'un contrôle" } }
        - { id: audit, text: { en: "Only during the annual external audit", fr: "Uniquement lors de l'audit externe annuel" } }
        - { id: newsub, text: { en: "Only when a new subscription is created", fr: "Uniquement lors de la création d'un nouvel abonnement" } }
answer:
  values: { s1: owner, s2: formula, s3: events }
explanation:
  correct:
    en: |-
      CAF assigns one primary risk owner who coordinates the treatment and is the first contact for escalation. It recommends one consistent prioritization methodology across the organization, preferably quantitative, with risk priority equal to risk probability multiplied by risk impact. Risks are reviewed regularly (quarterly, biannually or yearly) and after events such as a failed control, a new technology, a new threat or a regulatory change.
    fr: |-
      Le CAF attribue un propriétaire principal à chaque risque, qui coordonne son traitement et sert de premier contact pour l'escalade. Il recommande une méthode de priorisation cohérente dans toute l'organisation, de préférence quantitative, avec une priorité égale à la probabilité du risque multipliée par son impact. Les risques sont revus régulièrement (chaque trimestre, semestre ou année) et après des événements comme l'échec d'un contrôle, une nouvelle technologie, une nouvelle menace ou un changement réglementaire.
  options:
    probonly:
      en: |-
        CAF combines probability and impact, and notes that impact matters more than probability because high-impact risks have lasting effects.
      fr: |-
        Le CAF combine probabilité et impact, et souligne que l'impact compte davantage que la probabilité, car les risques à fort impact ont des effets durables.
references:
  - title: Assess cloud risks - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/assess-cloud-risks
