id: sc100-1b-irm-templates
objective: "1.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys plans to deploy Microsoft Purview Insider Risk Management. Wingtip uses Microsoft 365 E5 and Microsoft Defender for Endpoint, but it hasn't configured an HR connector, and the HR team can't provide data before next year.

    The security architect is evaluating which policy templates the company can use now.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit de déployer Microsoft Purview Insider Risk Management. Wingtip utilise Microsoft 365 E5 et Microsoft Defender for Endpoint, mais n'a pas configuré de connecteur RH, et l'équipe RH ne peut pas fournir de données avant l'an prochain.

    L'architecte de sécurité évalue les modèles de stratégie que l'entreprise peut utiliser dès maintenant.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          A policy based on the Data theft by departing users template can use the deletion of the user's Microsoft Entra account as its triggering event.
        fr: |-
          Une stratégie fondée sur le modèle Data theft by departing users peut utiliser la suppression du compte Microsoft Entra de l'utilisateur comme événement déclencheur.
    - id: s2
      text:
        en: |-
          A policy based on the Data leaks template requires an HR connector.
        fr: |-
          Une stratégie fondée sur le modèle Data leaks exige un connecteur RH.
    - id: s3
      text:
        en: |-
          A policy based on the Security policy violations template requires the HR connector to receive alerts from Microsoft Defender for Endpoint.
        fr: |-
          Une stratégie fondée sur le modèle Security policy violations exige le connecteur RH pour recevoir les alertes de Microsoft Defender for Endpoint.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      Without an HR connector, the Data theft by departing users template can use the Microsoft Entra user account deletion as its trigger. The Data leaks template is triggered by a DLP policy with high-severity incident reports or by customized triggering indicators, not by HR data. The Security policy violations template needs Defender for Endpoint integrated with Microsoft Purview; only its departing-user and risky-user variants add HR data.
    fr: |-
      Sans connecteur RH, le modèle Data theft by departing users peut utiliser la suppression du compte utilisateur Microsoft Entra comme déclencheur. Le modèle Data leaks est déclenché par une stratégie DLP avec des rapports d'incident de gravité élevée ou par des indicateurs de déclenchement personnalisés, pas par des données RH. Le modèle Security policy violations a besoin de Defender for Endpoint intégré à Microsoft Purview ; seules ses variantes pour les utilisateurs sur le départ et les utilisateurs à risque ajoutent des données RH.
references:
  - title: Learn about Insider Risk Management policy templates
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management-policy-templates
