id: sc100-1b-mcsb-ai-approved-models
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. builds machine learning solutions in Azure Machine Learning. During an assessment against the Microsoft cloud security benchmark (MCSB), you discover that data scientists download models from public model hubs and deploy them to production endpoints. No one verifies the origin of the models, scans them or approves them before deployment.

    Which MCSB control does this practice fail to meet?
  fr: |
    Contoso, Ltd. crée des solutions de machine learning dans Azure Machine Learning. Lors d'une évaluation par rapport au Microsoft cloud security benchmark (MCSB), vous découvrez que des data scientists téléchargent des modèles depuis des hubs de modèles publics et les déploient sur des points de terminaison de production. Personne ne vérifie l'origine des modèles, ne les analyse ni ne les approuve avant le déploiement.

    Quel contrôle du MCSB cette pratique ne respecte-t-elle pas ?
body:
  options:
    - { id: a, text: "AI-7: Perform continuous AI red teaming" }
    - { id: b, text: "AI-2: Implement multi-layered content filtering" }
    - { id: c, text: "AI-1: Ensure use of approved models" }
    - { id: d, text: "AI-6: Establish monitoring and detection" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AI-1 requires that only models that passed a formal verification and approval process are deployed. It recommends a central model registry that tracks provenance, scan results and approvals, automated integrity checks such as hash verification and backdoor scanning, and multi-stage approval workflows.
    fr: |-
      AI-1 exige que seuls les modèles passés par un processus formel de vérification et d'approbation soient déployés. Il recommande un registre de modèles central qui suit la provenance, les résultats d'analyse et les approbations, des contrôles d'intégrité automatisés comme la vérification de hachage et la recherche de portes dérobées, et des workflows d'approbation en plusieurs étapes.
  options:
    a:
      en: |-
        Red teaming tests deployed AI systems with adversarial techniques; it doesn't control which models are allowed into production.
      fr: |-
        Le red teaming teste les systèmes d'IA déployés avec des techniques adverses ; il ne contrôle pas quels modèles sont autorisés en production.
    b:
      en: |-
        Content filtering screens prompts and outputs at run time; it doesn't verify the origin of a model.
      fr: |-
        Le filtrage de contenu examine les prompts et les sorties à l'exécution ; il ne vérifie pas l'origine d'un modèle.
    d:
      en: |-
        Monitoring and detection look for attacks such as jailbreaks and data exfiltration in operation, not for unapproved models before deployment.
      fr: |-
        La surveillance et la détection recherchent des attaques comme le jailbreak et l'exfiltration de données en fonctionnement, pas des modèles non approuvés avant le déploiement.
references:
  - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security
