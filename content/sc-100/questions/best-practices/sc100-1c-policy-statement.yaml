id: sc100-1c-policy-statement
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The cloud governance team at Wingtip Toys is documenting its first cloud governance policies by following the Microsoft Cloud Adoption Framework for Azure (CAF). The risk register already lists the exposure of storage accounts to the internet as a risk. The platform team's draft security policy for this risk is a step-by-step procedure that configures the networking settings of a storage account, with no other information.

    You need to recommend how to rewrite the draft.

    What should you recommend?
  fr: |
    L'équipe de gouvernance cloud de Wingtip Toys documente ses premières stratégies de gouvernance cloud en suivant le Microsoft Cloud Adoption Framework for Azure (CAF). Le registre des risques recense déjà l'exposition des comptes de stockage à Internet comme un risque. Le projet de stratégie de sécurité de l'équipe de plateforme pour ce risque est une procédure pas à pas qui configure les paramètres réseau d'un compte de stockage, sans aucune autre information.

    Vous devez recommander comment réécrire ce projet.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep the procedure as the policy, add the expected setting values, and publish it in the central repository", fr: "Conserver la procédure comme stratégie, ajouter les valeurs de paramètres attendues, et la publier dans le dépôt central" } }
    - { id: b, text: { en: "Replace the procedure with the Azure Policy definition that enforces the setting, and publish it as the policy", fr: "Remplacer la procédure par la définition Azure Policy qui applique le paramètre, et la publier comme stratégie" } }
    - { id: c, text: { en: "Keep the procedure as the policy, and have the executive sponsor approve it so that teams must apply it", fr: "Conserver la procédure comme stratégie, et la faire approuver par le sponsor exécutif pour que les équipes doivent l'appliquer" } }
    - { id: d, text: { en: "Write an outcome-based statement, link it to the risk ID, and define its scope, remediation and monitoring", fr: "Rédiger un énoncé axé sur le résultat, le lier à l'ID du risque, et définir son étendue, sa correction et sa surveillance" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In the CAF, a cloud governance policy is a statement with definitive language ("must", "must not") that describes an outcome rather than configuration steps, for example "Storage accounts must not allow public network access". Each policy links to at least one risk ID and states its purpose, scope, remediation and how compliance is monitored. The enforcement tool, such as Azure Policy, is named in the policy but doesn't replace it.
    fr: |
      Dans le CAF, une stratégie de gouvernance cloud est un énoncé au langage affirmatif (« doit », « ne doit pas ») qui décrit un résultat plutôt que des étapes de configuration, par exemple « Les comptes de stockage ne doivent pas autoriser l'accès réseau public ». Chaque stratégie est liée à au moins un ID de risque et précise son objectif, son étendue, sa correction et la manière dont la conformité est surveillée. L'outil d'application, comme Azure Policy, est cité dans la stratégie mais ne la remplace pas.
  options:
    a:
      en: Setting values still describe configuration steps, and the policy would stay without its risk ID, scope, remediation and monitoring.
      fr: Des valeurs de paramètres décrivent toujours des étapes de configuration, et la stratégie resterait sans ID de risque, étendue, correction ni surveillance.
    b:
      en: An Azure Policy definition is an enforcement mechanism; the documented policy must state the outcome in business terms and link to the risk.
      fr: Une définition Azure Policy est un mécanisme d'application ; la stratégie documentée doit énoncer le résultat en termes métier et être liée au risque.
    c:
      en: |-
        Sponsor approval gives authority but doesn't fix the content: the policy would remain a procedure without the required fields.
      fr: |-
        L'approbation du sponsor donne l'autorité mais ne corrige pas le contenu : la stratégie resterait une procédure sans les champs requis.
references:
  - title: Document cloud governance policies
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/document-cloud-governance-policies
