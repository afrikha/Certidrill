id: sc100-1a-assume-breach
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. is defining a security strategy that supports its business resiliency goals. The board asks that the strategy limit business damage when an attacker gets into the environment, instead of investing only in keeping attackers out. The strategy must follow the Zero Trust principle that Microsoft's ransomware protection guidance is based on.

    Which principle should the strategy be based on?
  fr: |
    Litware, Inc. définit une stratégie de sécurité qui prend en charge ses objectifs de résilience. Le conseil d'administration demande que la stratégie limite les dégâts pour l'entreprise lorsqu'un attaquant pénètre dans l'environnement, au lieu d'investir uniquement pour tenir les attaquants dehors. La stratégie doit suivre le principe Confiance Zéro sur lequel reposent les recommandations de Microsoft contre les rançongiciels.

    Sur quel principe la stratégie doit-elle reposer ?
body:
  options:
    - { id: a, text: { en: "Verify explicitly", fr: "Vérifier explicitement" } }
    - { id: b, text: { en: "Assume breach", fr: "Supposer une violation" } }
    - { id: c, text: { en: "Use least privilege access", fr: "Utiliser l'accès du moindre privilège" } }
    - { id: d, text: { en: "Secure by default", fr: "Sécurisé par défaut" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft's ransomware plan applies the Zero Trust principle of assuming a breach: it focuses on minimizing business risk even if attackers gain access. That is why its first step is a recovery plan that works without paying a ransom, before entry points are hardened.
    fr: |
      Le plan de Microsoft contre les rançongiciels applique le principe Confiance Zéro qui consiste à supposer une violation : il vise à réduire le risque pour l'entreprise même si les attaquants obtiennent un accès. C'est pourquoi sa première étape est un plan de récupération qui fonctionne sans payer de rançon, avant le durcissement des points d'entrée.
  options:
    a:
      en: |-
        Verify explicitly is about authenticating and authorizing every request with all available signals. It doesn't address the damage once an attacker is inside.
      fr: |-
        Vérifier explicitement consiste à authentifier et autoriser chaque demande avec tous les signaux disponibles. Ce principe ne traite pas des dégâts une fois l'attaquant à l'intérieur.
    c:
      en: |-
        Least privilege limits what each identity can do. It contributes to resiliency, but the principle that frames designing for an attacker already inside is assume breach.
      fr: |-
        Le moindre privilège limite ce que chaque identité peut faire. Il contribue à la résilience, mais le principe qui consiste à concevoir pour un attaquant déjà à l'intérieur est la supposition de violation.
    d:
      en: |-
        Secure by default isn't one of the three Zero Trust principles; Zero Trust uses verify explicitly, least privilege access and assume breach.
      fr: |-
        Sécurisé par défaut ne fait pas partie des trois principes Confiance Zéro ; la Confiance Zéro utilise la vérification explicite, l'accès du moindre privilège et la supposition de violation.
references:
  - title: Quickly protect your organization against ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware
