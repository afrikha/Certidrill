id: sc100-1b-ai-adopt-inventory
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. builds generative AI applications on Azure OpenAI and Azure Machine Learning, and two business units use Amazon Bedrock in AWS and Google Vertex AI in GCP. Microsoft Defender for Cloud is connected to the Azure subscriptions, the AWS accounts and the GCP projects.

    As part of the "protect AI resources" step of its secure AI adoption strategy, Contoso needs a complete inventory of its AI workloads across the three clouds, including an AI bill of materials, misconfiguration recommendations and attack paths.

    What should you recommend?
  fr: |
    Contoso, Ltd. crée des applications d'IA générative sur Azure OpenAI et Azure Machine Learning, et deux divisions utilisent Amazon Bedrock dans AWS et Google Vertex AI dans GCP. Microsoft Defender for Cloud est connecté aux abonnements Azure, aux comptes AWS et aux projets GCP.

    Dans le cadre de l'étape « protéger les ressources d'IA » de sa stratégie d'adoption sécurisée de l'IA, Contoso a besoin d'un inventaire complet de ses charges de travail d'IA dans les trois clouds, avec une nomenclature d'IA (AI BOM), des recommandations sur les erreurs de configuration et des chemins d'attaque.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Resource Graph queries scheduled across all the subscriptions", fr: "Des requêtes Azure Resource Graph planifiées sur tous les abonnements" } }
    - { id: b, text: { en: "Defender for Cloud threat protection for AI services", fr: "La protection contre les menaces pour les services d'IA de Defender for Cloud" } }
    - { id: c, text: { en: "Microsoft Sentinel with the data connectors of the three clouds", fr: "Microsoft Sentinel avec les connecteurs de données des trois clouds" } }
    - { id: d, text: { en: "AI security posture management in the Defender CSPM plan of Defender for Cloud", fr: "La gestion de la posture de sécurité de l'IA du plan Defender CSPM de Defender for Cloud" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AI security posture management, part of the Defender CSPM plan, discovers the AI bill of materials of generative AI applications in Azure, AWS and GCP, including Azure OpenAI, Azure Machine Learning, Amazon Bedrock and Google Vertex AI. It provides posture recommendations and attack path analysis for these workloads, which the CAF Secure AI guidance names for the AI asset inventory.
    fr: |-
      La gestion de la posture de sécurité de l'IA, incluse dans le plan Defender CSPM, découvre la nomenclature d'IA (AI BOM) des applications d'IA générative dans Azure, AWS et GCP, dont Azure OpenAI, Azure Machine Learning, Amazon Bedrock et Google Vertex AI. Elle fournit des recommandations de posture et l'analyse des chemins d'attaque pour ces charges de travail, ce que les recommandations Secure AI du CAF citent pour l'inventaire des ressources d'IA.
  options:
    a:
      en: |-
        Resource Graph lists Azure resources only; it doesn't cover AWS and GCP or compute attack paths.
      fr: |-
        Resource Graph ne liste que les ressources Azure ; il ne couvre ni AWS ni GCP et ne calcule pas de chemins d'attaque.
    b:
      en: |-
        Threat protection raises run-time alerts for supported Azure models; it isn't a posture inventory and isn't available for connected AWS accounts.
      fr: |-
        La protection contre les menaces génère des alertes à l'exécution pour les modèles Azure pris en charge ; ce n'est pas un inventaire de posture et elle n'est pas disponible pour les comptes AWS connectés.
    c:
      en: |-
        Sentinel collects and analyzes logs for detection; it doesn't build an AI bill of materials or posture recommendations.
      fr: |-
        Sentinel collecte et analyse les journaux pour la détection ; il ne construit ni nomenclature d'IA ni recommandations de posture.
references:
  - title: Overview - AI security posture management - Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture
  - title: Secure AI - Guidance to set up your organization's AI security process - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/secure
