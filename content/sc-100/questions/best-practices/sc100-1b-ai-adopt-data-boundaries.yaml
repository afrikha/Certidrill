id: sc100-1b-ai-adopt-data-boundaries
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is deploying an AI application in Azure that uses Azure OpenAI, Azure AI Search and Azure Blob Storage. The security requirements for the application are:

    - Sensitive data must be detected and blocked in the AI workflows.
    - The application must reach the PaaS services without using public endpoints.
    - The application must authenticate to Azure services without stored credentials.

    You need to recommend solutions that follow the Secure AI guidance of the Cloud Adoption Framework for Azure (CAF).

    What should you recommend for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. déploie dans Azure une application d'IA qui utilise Azure OpenAI, Azure AI Search et Stockage Blob Azure. Les exigences de sécurité de l'application sont les suivantes :

    - Les données sensibles doivent être détectées et bloquées dans les workflows d'IA.
    - L'application doit joindre les services PaaS sans utiliser de points de terminaison publics.
    - L'application doit s'authentifier auprès des services Azure sans informations d'identification stockées.

    Vous devez recommander des solutions qui suivent les recommandations Secure AI du Cloud Adoption Framework pour Azure (CAF).

    Que devez-vous recommander pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Detect and block sensitive data: [[s1]]

      Private access to the PaaS services: [[s2]]

      Authentication without stored credentials: [[s3]]
    fr: |
      Détecter et bloquer les données sensibles : [[s1]]

      Accès privé aux services PaaS : [[s2]]

      Authentification sans informations d'identification stockées : [[s3]]
  slots:
    - id: s1
      options:
        - { id: dlp, text: { en: "Microsoft Purview Data Loss Prevention", fr: "Protection contre la perte de données Microsoft Purview" } }
        - { id: policy, text: Azure Policy }
        - { id: fw, text: Azure Firewall }
    - id: s2
      options:
        - { id: tags, text: { en: "Network security groups with service tags", fr: "Des groupes de sécurité réseau avec des étiquettes de service" } }
        - { id: pl, text: Azure Private Link }
        - { id: nat, text: { en: "A NAT gateway", fr: "Une passerelle NAT" } }
    - id: s3
      options:
        - { id: kv, text: { en: "Keys stored in Azure Key Vault", fr: "Des clés stockées dans Azure Key Vault" } }
        - { id: sas, text: { en: "Shared access signatures", fr: "Des signatures d'accès partagé" } }
        - { id: mi, text: { en: "Managed identities", fr: "Des identités managées" } }
answer:
  values: { s1: dlp, s2: pl, s3: mi }
explanation:
  correct:
    en: |-
      The CAF Secure AI guidance uses Microsoft Purview Data Loss Prevention to scan and block sensitive data in AI workflows, Azure Private Link for private endpoint access to PaaS services as part of data boundaries, and managed identities so that AI workloads authenticate without stored credentials.
    fr: |-
      Les recommandations Secure AI du CAF utilisent la protection contre la perte de données Microsoft Purview pour analyser et bloquer les données sensibles dans les workflows d'IA, Azure Private Link pour l'accès par points de terminaison privés aux services PaaS dans le cadre des limites de données, et les identités managées pour que les charges de travail d'IA s'authentifient sans informations d'identification stockées.
  options:
    tags:
      en: |-
        Service tags filter traffic to the services' public endpoints; the traffic still targets public endpoints.
      fr: |-
        Les étiquettes de service filtrent le trafic vers les points de terminaison publics des services ; le trafic vise toujours des points de terminaison publics.
    kv:
      en: |-
        Key Vault protects stored keys, but the keys remain stored credentials that must be retrieved and rotated.
      fr: |-
        Key Vault protège les clés stockées, mais ces clés restent des informations d'identification stockées qu'il faut récupérer et renouveler.
references:
  - title: Secure AI - Guidance to set up your organization's AI security process - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/secure
