id: sc100-1b-caf-cia-triad
objective: "1.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is integrating security into its cloud adoption strategy by following the Secure methodology of the Cloud Adoption Framework for Azure (CAF). The strategy maps each planned control to one element of the CIA triad.

    Which element of the triad does each control mainly protect? To answer, drag the appropriate elements to the correct controls. Each element may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. intègre la sécurité à sa stratégie d'adoption du cloud en suivant la méthodologie Secure du Cloud Adoption Framework pour Azure (CAF). La stratégie associe chaque contrôle prévu à un élément de la triade CIA.

    Quel élément de la triade chaque contrôle protège-t-il principalement ? Pour répondre, faites glisser les éléments appropriés vers les contrôles correspondants. Chaque élément peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: conf, text: { en: "Confidentiality", fr: "Confidentialité" } }
    - { id: integ, text: { en: "Integrity", fr: "Intégrité" } }
    - { id: avail, text: { en: "Availability", fr: "Disponibilité" } }
  targets:
    - id: t1
      text: { en: "Signed packages and a secured update supply chain for internal tools", fr: "Packages signés et chaîne de mise à jour sécurisée pour les outils internes" }
    - id: t2
      text: { en: "Customer-managed keys and data classification for customer records", fr: "Clés gérées par le client et classification des données pour les dossiers clients" }
    - id: t3
      text: { en: "Health probes, autoscaling and fault isolation for the ordering service", fr: "Sondes d'intégrité, mise à l'échelle automatique et isolation des pannes pour le service de commande" }
    - id: t4
      text: { en: "Immutable storage and version control for audit records", fr: "Stockage immuable et gestion de versions pour les enregistrements d'audit" }
answer:
  mapping: { t1: integ, t2: conf, t3: avail, t4: integ }
explanation:
  correct:
    en: |-
      In the CAF Secure methodology, confidentiality restricts access to sensitive data (encryption, key management, identity, segmentation, classification). Integrity preserves data correctness (hashing, signing, immutable storage, version control, secure update supply chains). Availability sustains timely access (redundancy, fault isolation, autoscaling, health probes, backup and disaster recovery).
    fr: |-
      Dans la méthodologie Secure du CAF, la confidentialité restreint l'accès aux données sensibles (chiffrement, gestion des clés, identité, segmentation, classification). L'intégrité préserve l'exactitude des données (hachage, signature, stockage immuable, gestion de versions, chaînes de mise à jour sécurisées). La disponibilité maintient un accès en temps voulu (redondance, isolation des pannes, mise à l'échelle automatique, sondes d'intégrité, sauvegarde et reprise d'activité).
references:
  - title: Secure Overview - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/secure/
