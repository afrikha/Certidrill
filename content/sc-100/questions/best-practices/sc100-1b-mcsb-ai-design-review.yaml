id: sc100-1b-mcsb-ai-design-review
objective: "1.2.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders designs an AI support agent. The architecture board wants to validate the design against the artificial intelligence security domain of the Microsoft cloud security benchmark (MCSB). The components of the design are shown in the following table.

    Answer each prompt by selecting the component whose design doesn't meet the control.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit un agent de support basé sur l'IA. Le comité d'architecture veut valider la conception par rapport au domaine Sécurité de l'intelligence artificielle du Microsoft cloud security benchmark (MCSB). Les composants de la conception figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le composant dont la conception ne respecte pas le contrôle.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "AI-4: Apply least privilege for agent functions", fr: "AI-4 : Apply least privilege for agent functions" }
    - id: p2
      text: { en: "AI-1: Ensure use of approved models", fr: "AI-1 : Ensure use of approved models" }
  grid:
    header: [{ en: "Component", fr: "Composant" }, { en: "Design", fr: "Conception" }]
    rows:
      - - { text: { en: "Chat model", fr: "Modèle de conversation" }, area: chat }
        - { text: { en: "Deployed from the Foundry model catalog after approval by the AI review board, and recorded in the central registry", fr: "Déployé depuis le catalogue de modèles Foundry après approbation par le comité de revue de l'IA, et enregistré dans le registre central" } }
      - - { text: { en: "Input and output filtering", fr: "Filtrage des entrées et des sorties" }, area: filter }
        - { text: { en: "Prompt Shields screen user prompts and retrieved documents; outputs are filtered and logged", fr: "Prompt Shields examine les prompts des utilisateurs et les documents récupérés ; les sorties sont filtrées et journalisées" } }
      - - { text: { en: "Agent identity", fr: "Identité de l'agent" }, area: identity }
        - { text: { en: "Uses the service principal of the CRM integration, which has the Contributor role on the production subscription", fr: "Utilise le principal de service de l'intégration CRM, qui a le rôle Contributor sur l'abonnement de production" } }
      - - { text: { en: "Sentiment classifier", fr: "Classifieur de sentiment" }, area: sentiment }
        - { text: { en: "Downloaded by a developer from a public model hub and deployed directly to a production endpoint", fr: "Téléchargé par un développeur depuis un hub de modèles public et déployé directement sur un point de terminaison de production" } }
      - - { text: { en: "Refund tool", fr: "Outil de remboursement" }, area: refund }
        - { text: { en: "Refunds above USD 200 wait for a supervisor's approval in Power Automate", fr: "Les remboursements supérieurs à 200 USD attendent l'approbation d'un superviseur dans Power Automate" } }
      - - { text: { en: "Monitoring", fr: "Surveillance" }, area: monitor }
        - { text: { en: "Defender for Cloud threat protection for AI services sends alerts to Microsoft Sentinel", fr: "La protection contre les menaces pour les services d'IA de Defender for Cloud envoie les alertes à Microsoft Sentinel" } }
answer:
  values: { p1: identity, p2: sentiment }
explanation:
  correct:
    en: |-
      AI-4 requires a dedicated identity for each agent with access limited to its purpose; reusing a service principal that has Contributor on the subscription gives the agent far more access than it needs and mixes its activity with another application. AI-1 requires every model, not only the main one, to pass verification and approval before production; the sentiment classifier bypasses the registry and the review board.
    fr: |-
      AI-4 exige une identité dédiée pour chaque agent, avec un accès limité à sa finalité ; réutiliser un principal de service qui a le rôle Contributor sur l'abonnement donne à l'agent bien plus d'accès que nécessaire et mélange son activité avec celle d'une autre application. AI-1 exige que chaque modèle, pas seulement le modèle principal, passe la vérification et l'approbation avant la production ; le classifieur de sentiment contourne le registre et le comité de revue.
references:
  - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security
