id: sc100-1b-zt-posture-scores
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank follows the Rapidly modernize your security posture business scenario of the Zero Trust adoption framework. Woodgrove uses Microsoft Defender XDR, Microsoft Defender for Cloud and Microsoft Entra ID.

    In the first stage of the plan, the CISO must capture initial scores that quantify the security posture across devices, identities and cloud resources. Recommendations must be assigned to owners and grouped in a Zero Trust initiative that executives can follow.

    What should you recommend?
  fr: |
    Woodgrove Bank suit le scénario métier Rapidly modernize your security posture du framework d'adoption de la Confiance Zéro. Woodgrove utilise Microsoft Defender XDR, Microsoft Defender for Cloud et Microsoft Entra ID.

    Dans la première étape du plan, le RSSI doit relever des scores initiaux qui quantifient la posture de sécurité des appareils, des identités et des ressources cloud. Les recommandations doivent être attribuées à des responsables et regroupées dans une initiative Confiance Zéro que les dirigeants peuvent suivre.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Microsoft Security Exposure Management }
    - { id: b, text: Microsoft Purview Compliance Manager }
    - { id: c, text: { en: "The regulatory compliance dashboard of Microsoft Defender for Cloud", fr: "Le tableau de bord de conformité réglementaire de Microsoft Defender for Cloud" } }
    - { id: d, text: { en: "Microsoft Sentinel workbooks built on the incident data", fr: "Des classeurs Microsoft Sentinel créés à partir des données d'incidents" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In this scenario, Microsoft Security Exposure Management provides the posture scores captured in stage 1 and updated later, and a Zero Trust initiative whose recommendations can be assigned to owners. It aggregates the posture of devices, identities and cloud resources from the Defender products.
    fr: |-
      Dans ce scénario, Microsoft Security Exposure Management fournit les scores de posture relevés à l'étape 1 et mis à jour ensuite, ainsi qu'une initiative Confiance Zéro dont les recommandations peuvent être attribuées à des responsables. Il agrège la posture des appareils, des identités et des ressources cloud à partir des produits Defender.
  options:
    b:
      en: |-
        Compliance Manager tracks the status against regulations, which the scenario captures separately; it isn't the posture score across devices, identities and cloud.
      fr: |-
        Compliance Manager suit l'état par rapport aux réglementations, que le scénario relève séparément ; ce n'est pas le score de posture des appareils, des identités et du cloud.
    c:
      en: |-
        The regulatory compliance dashboard shows compliance of cloud resources with standards; it doesn't cover devices and identities or provide a Zero Trust initiative.
      fr: |-
        Le tableau de bord de conformité réglementaire montre la conformité des ressources cloud aux normes ; il ne couvre ni les appareils ni les identités et ne fournit pas d'initiative Confiance Zéro.
    d:
      en: |-
        Sentinel workbooks report on detected incidents, which is response activity, not a posture score with assignable recommendations.
      fr: |-
        Les classeurs Sentinel rendent compte des incidents détectés, c'est-à-dire de l'activité de réponse, pas d'un score de posture avec des recommandations attribuables.
references:
  - title: Rapidly modernize your security posture for Zero Trust
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/rapidly-modernize-security-posture
