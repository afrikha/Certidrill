id: sc100-1a-exposure-tools
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has workloads on-premises and in Azure, AWS and GCP. The vulnerability team uses Tenable and Qualys, and the IT team keeps its configuration items in ServiceNow CMDB. The security strategy must identify and prioritize threats to business-critical assets.

    You need to recommend solutions that meet the following requirements.

    How should you complete the recommendation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose de charges de travail en local et dans Azure, AWS et GCP. L'équipe chargée des vulnérabilités utilise Tenable et Qualys, et l'équipe informatique tient ses éléments de configuration dans ServiceNow CMDB. La stratégie de sécurité doit identifier et hiérarchiser les menaces qui pèsent sur les ressources vitales pour l'entreprise.

    Vous devez recommander des solutions qui répondent aux exigences suivantes.

    Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To bring the Tenable, Qualys and ServiceNow CMDB data into the same exposure view as the Microsoft data: [[s1]]

      To find the assets through which many attack paths flow, including paths from on-premises to the cloud: [[s2]]

      To track over time a score of how well the business-critical assets are protected: [[s3]]
    fr: |
      Pour intégrer les données Tenable, Qualys et ServiceNow CMDB dans la même vue de l'exposition que les données Microsoft : [[s1]]

      Pour trouver les ressources par lesquelles passent de nombreux chemins d'attaque, y compris des chemins du local vers le cloud : [[s2]]

      Pour suivre dans le temps une note de la protection des ressources vitales pour l'entreprise : [[s3]]
  slots:
    - id: s1
      options:
        - { id: conn, text: { en: "Data connectors in Security Exposure Management", fr: "Les connecteurs de données de Security Exposure Management" } }
        - { id: watch, text: { en: "Watchlists in Microsoft Sentinel", fr: "Les watchlists de Microsoft Sentinel" } }
        - { id: arc, text: { en: "Azure Arc-enabled servers", fr: "Les serveurs Azure Arc" } }
    - id: s2
      options:
        - { id: ta, text: { en: "Threat analytics reports", fr: "Les rapports d'analyse des menaces" } }
        - { id: choke, text: { en: "Choke points", fr: "Les points de contention (choke points)" } }
        - { id: ss, text: { en: "Microsoft Secure Score improvement actions", fr: "Les actions d'amélioration de Microsoft Secure Score" } }
    - id: s3
      options:
        - { id: mss, text: { en: "Microsoft Secure Score", fr: "Microsoft Secure Score" } }
        - { id: dfc, text: { en: "The Defender for Cloud secure score", fr: "Le degré de sécurisation de Defender for Cloud" } }
        - { id: cap, text: { en: "The Critical Asset Protection initiative", fr: "L'initiative Critical Asset Protection" } }
answer:
  values: { s1: conn, s2: choke, s3: cap }
explanation:
  correct:
    en: |
      Security Exposure Management consolidates data from external tools such as ServiceNow CMDB, Tenable, Qualys and Rapid7 through its data connectors. Choke points are the assets through which many attack paths flow, including paths that bridge on-premises and cloud environments. The Critical Asset Protection initiative, under exposure insights, scores the security resilience of critical assets over time.
    fr: |
      Security Exposure Management regroupe les données d'outils externes comme ServiceNow CMDB, Tenable, Qualys et Rapid7 grâce à ses connecteurs de données. Les points de contention sont les ressources par lesquelles passent de nombreux chemins d'attaque, y compris ceux qui relient le local et le cloud. L'initiative Critical Asset Protection, dans les exposure insights, note dans le temps la résilience des ressources critiques.
  options:
    watch:
      en: |-
        A Sentinel watchlist is a static list used in queries; it doesn't build an exposure view.
      fr: |-
        Une watchlist Sentinel est une liste statique utilisée dans des requêtes ; elle ne construit pas de vue de l'exposition.
    ss:
      en: |-
        Secure Score improvement actions are configuration recommendations; they don't show where attack paths converge.
      fr: |-
        Les actions d'amélioration de Secure Score sont des recommandations de configuration ; elles ne montrent pas où convergent les chemins d'attaque.
    mss:
      en: |-
        Microsoft Secure Score measures the overall posture, not the protection of the assets classified as critical.
      fr: |-
        Microsoft Secure Score mesure la posture globale, pas la protection des ressources classées comme critiques.
references:
  - title: What is Microsoft Security Exposure Management?
    url: https://learn.microsoft.com/en-us/security-exposure-management/microsoft-security-exposure-management
  - title: Overview of critical asset management
    url: https://learn.microsoft.com/en-us/security-exposure-management/critical-asset-management
