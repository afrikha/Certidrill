id: sc100-1a-replication-not-backup
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys runs 80 VMware virtual machines in an on-premises datacenter. Azure Site Recovery replicates the virtual machines to Azure, and the CIO considers that this replication covers the ransomware risk.

    A security review requires a BCDR design that meets the following requirements:

    - The company must be able to recover data as it was several weeks before an attack is detected, because ransomware can encrypt data slowly.
    - No administrator, including the owners of the Azure subscription, can delete the recovery copies or shorten their retention.

    What should you recommend?
  fr: |
    Tailspin Toys exécute 80 machines virtuelles VMware dans un centre de données local. Azure Site Recovery réplique les machines virtuelles vers Azure, et le DSI considère que cette réplication couvre le risque de rançongiciel.

    Une revue de sécurité exige une conception BCDR qui respecte les exigences suivantes :

    - L'entreprise doit pouvoir récupérer les données telles qu'elles étaient plusieurs semaines avant la détection d'une attaque, car un rançongiciel peut chiffrer les données lentement.
    - Aucun administrateur, y compris les propriétaires de l'abonnement Azure, ne peut supprimer les copies de récupération ni raccourcir leur rétention.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Increase the Site Recovery replication frequency, and keep the replicas as the only recovery copies", fr: "Augmenter la fréquence de réplication de Site Recovery, et conserver les réplicas comme seules copies de récupération" } }
    - { id: b, text: { en: "Back up the VMs to a Recovery Services vault with Azure Backup Server, and enable and lock immutability", fr: "Sauvegarder les VM dans un coffre Recovery Services avec Azure Backup Server, et activer et verrouiller l'immuabilité" } }
    - { id: c, text: { en: "Back up the VMs to a Recovery Services vault with Azure Backup Server, and extend soft delete to 180 days", fr: "Sauvegarder les VM dans un coffre Recovery Services avec Azure Backup Server, et porter la suppression réversible à 180 jours" } }
    - { id: d, text: { en: "Create a Site Recovery recovery plan for the VMs, and run a test failover of the plan every month", fr: "Créer un plan de récupération Site Recovery pour les VM, et exécuter chaque mois un test de basculement du plan" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Replication reproduces changes quickly, so replicas and recent recovery points can already contain encrypted data when slow encryption is detected. Backups with a retention of several weeks keep older, clean recovery points. A Recovery Services vault with immutability enabled and locked blocks the deletion of recovery points before their expiry and any reduction of retention, and the locked state can't be reversed, even by the subscription owners.
    fr: |
      La réplication reproduit vite les modifications : les réplicas et les points de récupération récents peuvent déjà contenir des données chiffrées quand un chiffrement lent est détecté. Des sauvegardes conservées plusieurs semaines gardent des points de récupération plus anciens et sains. Un coffre Recovery Services dont l'immuabilité est activée et verrouillée bloque la suppression des points de récupération avant leur expiration et toute réduction de la rétention, et l'état verrouillé est irréversible, même pour les propriétaires de l'abonnement.
  options:
    a:
      en: |-
        More frequent replication propagates encrypted data faster. Replicas aren't long-retention backups that an attacker can't delete.
      fr: |-
        Une réplication plus fréquente propage plus vite les données chiffrées. Les réplicas ne sont pas des sauvegardes à longue rétention qu'un attaquant ne peut pas supprimer.
    c:
      en: |-
        Soft delete keeps deleted backup data recoverable for a while, but an owner can disable it and nothing stops a reduction of retention.
      fr: |-
        La suppression réversible garde les données supprimées récupérables pendant un temps, mais un propriétaire peut la désactiver et rien n'empêche une réduction de la rétention.
    d:
      en: |-
        A recovery plan orders the failover of machines during an outage. It doesn't add older recovery points or protect them from deletion.
      fr: |-
        Un plan de récupération ordonne le basculement des machines pendant une panne. Il n'ajoute pas de points de récupération plus anciens et ne les protège pas contre la suppression.
references:
  - title: Immutable vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
  - title: Backup and restore plan to protect against ransomware
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware
