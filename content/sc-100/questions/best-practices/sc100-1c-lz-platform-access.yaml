id: sc100-1c-lz-platform-access
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. runs Azure landing zones. Platform engineers sometimes need the Owner role at the Platform management group to troubleshoot shared services. The security team requires that no one has standing privileged access at management group scope, that each elevation is approved and that the remaining access is recertified on a regular schedule.

    You need to recommend a solution that follows the security design area of Azure landing zones.

    What should you recommend?
  fr: |
    Proseware, Inc. exploite des zones d'atterrissage Azure. Les ingénieurs plateforme ont parfois besoin du rôle Owner sur le groupe d'administration Platform pour dépanner les services partagés. L'équipe de sécurité exige que personne ne dispose d'un accès privilégié permanent à l'étendue d'un groupe d'administration, que chaque élévation soit approuvée et que les accès restants soient recertifiés à intervalles réguliers.

    Vous devez recommander une solution conforme à la zone de conception sécurité des zones d'atterrissage Azure.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Permanent Owner assignments at the Platform management group, with a quarterly manual review", fr: "Des attributions Owner permanentes sur le groupe d'administration Platform, avec une revue manuelle trimestrielle" } }
    - { id: b, text: { en: "Owner assignments on each platform subscription, granted to a shared emergency access account", fr: "Des attributions Owner sur chaque abonnement de plateforme, accordées à un compte d'accès d'urgence partagé" } }
    - { id: c, text: { en: "Contributor assignments at the intermediate root, protected by a Conditional Access policy", fr: "Des attributions Contributor à la racine intermédiaire, protégées par une stratégie d'accès conditionnel" } }
    - { id: d, text: { en: "Eligible Owner assignments at the Platform management group in PIM, with approval and access reviews", fr: "Des attributions Owner éligibles sur le groupe d'administration Platform dans PIM, avec approbation et révisions d'accès" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The security design area recommends Privileged Identity Management for least-privilege access across the Azure environment and recurring access reviews so that people and service principals keep correct authorization levels. The CAF management group guidance allows platform teams management group roles for troubleshooting, controlled with PIM. Eligible assignments remove standing access, approval gates each activation and access reviews recertify the eligibility.
    fr: |
      La zone de conception sécurité recommande Privileged Identity Management pour un accès à moindre privilège sur tout l'environnement Azure, et des révisions d'accès récurrentes pour que les personnes et les principaux de service conservent des niveaux d'autorisation corrects. Les recommandations du CAF sur les groupes d'administration autorisent les équipes de plateforme à disposer de rôles sur les groupes d'administration pour le dépannage, contrôlés par PIM. Les attributions éligibles suppriment l'accès permanent, l'approbation contrôle chaque activation et les révisions d'accès recertifient l'éligibilité.
  options:
    a:
      en: |-
        Permanent assignments are standing privileged access, which the security team forbids, even with periodic reviews.
      fr: |-
        Des attributions permanentes constituent un accès privilégié permanent, interdit par l'équipe de sécurité, même avec des revues périodiques.
    b:
      en: |-
        A shared account removes individual accountability, and its assignments are standing access without approval.
      fr: |-
        Un compte partagé supprime la responsabilité individuelle, et ses attributions sont un accès permanent sans approbation.
    c:
      en: |-
        Conditional Access controls sign-in conditions but doesn't remove standing access or require approval, and Contributor doesn't provide the Owner permissions that the engineers need.
      fr: |-
        L'accès conditionnel contrôle les conditions de connexion mais ne supprime pas l'accès permanent et n'exige pas d'approbation, et Contributor ne fournit pas les autorisations Owner dont les ingénieurs ont besoin.
references:
  - title: Security design in Azure
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/security
