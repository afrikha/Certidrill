id: sc100-1a-hotpatching
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs a payment processing workload on Windows Server virtual machines in Azure. The virtual machines meet the prerequisites of every Azure Update Manager capability. The business allows no planned restart of these virtual machines during the month.

    You need to recommend a solution to install critical security updates on the virtual machines as soon as they are released while minimizing downtime.

    What should you recommend?
  fr: |
    Woodgrove Bank exécute une charge de travail de traitement des paiements sur des machines virtuelles Windows Server dans Azure. Les machines virtuelles remplissent les prérequis de toutes les capacités d'Azure Update Manager. L'activité n'autorise aucun redémarrage planifié de ces machines virtuelles au cours du mois.

    Vous devez recommander une solution pour installer les mises à jour de sécurité critiques sur les machines virtuelles dès leur publication tout en réduisant au minimum les temps d'arrêt.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Scheduled patching in Azure Update Manager, in a monthly maintenance window", fr: "La mise à jour planifiée d'Azure Update Manager, dans une fenêtre de maintenance mensuelle" } }
    - { id: b, text: { en: "Periodic assessment in Azure Update Manager, every 24 hours", fr: "L'évaluation périodique d'Azure Update Manager, toutes les 24 heures" } }
    - { id: c, text: { en: "Hotpatching for the virtual machines, managed by Azure Update Manager", fr: "Le hotpatching des machines virtuelles, géré par Azure Update Manager" } }
    - { id: d, text: { en: "A Site Recovery failover to replicas that are patched in another region", fr: "Un basculement Site Recovery vers des réplicas mis à jour dans une autre région" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      On Azure VMs, hotpatching applies critical updates without a restart, which reduces downtime. Azure Update Manager manages hotpatching together with the other update capabilities, so the critical updates are installed quickly without waiting for a restart window.
    fr: |
      Sur les VM Azure, le hotpatching applique les mises à jour critiques sans redémarrage, ce qui réduit les temps d'arrêt. Azure Update Manager gère le hotpatching avec ses autres capacités de mise à jour : les mises à jour critiques sont installées rapidement sans attendre une fenêtre de redémarrage.
  options:
    a:
      en: |-
        A monthly window delays critical updates, and installing them in the window can require a restart, which the business doesn't allow.
      fr: |-
        Une fenêtre mensuelle retarde les mises à jour critiques, et leur installation dans la fenêtre peut exiger un redémarrage, que l'activité n'autorise pas.
    b:
      en: |-
        Periodic assessment only checks for missing updates; it doesn't install them.
      fr: |-
        L'évaluation périodique ne fait que rechercher les mises à jour manquantes ; elle ne les installe pas.
    d:
      en: |-
        A failover is a disaster recovery operation that interrupts the service, and the replicas would need the same updates.
      fr: |-
        Un basculement est une opération de reprise d'activité qui interrompt le service, et les réplicas auraient besoin des mêmes mises à jour.
references:
  - title: What is Azure Update Manager?
    url: https://learn.microsoft.com/en-us/azure/update-manager/overview
