id: sc100-1b-mcsb-ai-controls-map
objective: "1.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is reviewing the design of an AI shopping assistant against the artificial intelligence security domain of the Microsoft cloud security benchmark (MCSB). The review lists four requirements.

    Which MCSB control does each requirement implement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys examine la conception d'un assistant d'achat basé sur l'IA par rapport au domaine Sécurité de l'intelligence artificielle du Microsoft cloud security benchmark (MCSB). La revue liste quatre exigences.

    Quel contrôle du MCSB chaque exigence implémente-t-elle ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ai1, text: "AI-1: Ensure use of approved models" }
    - { id: ai2, text: "AI-2: Implement multi-layered content filtering" }
    - { id: ai3, text: "AI-3: Adopt safety meta-prompts" }
    - { id: ai4, text: "AI-4: Apply least privilege for agent functions" }
    - { id: ai5, text: "AI-5: Ensure human-in-the-loop" }
    - { id: ai6, text: "AI-6: Establish monitoring and detection" }
  targets:
    - id: t1
      text: { en: "The assistant can call only the catalog and cart APIs; every other call is denied", fr: "L'assistant ne peut appeler que les API du catalogue et du panier ; tout autre appel est refusé" }
    - id: t2
      text: { en: "Responses are checked for harmful content and logged before they reach the user", fr: "Les réponses sont vérifiées contre le contenu nuisible et journalisées avant d'atteindre l'utilisateur" }
    - id: t3
      text: { en: "The system instructions define the assistant's role and mark retrieved web content as untrusted", fr: "Les instructions système définissent le rôle de l'assistant et marquent le contenu web récupéré comme non fiable" }
    - id: t4
      text: { en: "Data accessed by the assistant is classified, and anomalous behavior raises alerts", fr: "Les données consultées par l'assistant sont classifiées, et un comportement anormal génère des alertes" }
answer:
  mapping: { t1: ai4, t2: ai2, t3: ai3, t4: ai6 }
explanation:
  correct:
    en: |-
      A capability manifest that denies everything not explicitly allowed is AI-4. Filtering and logging outputs before delivery is part of the multi-layered filtering of AI-2. Defining the model's role in the system context and spotlighting untrusted data is AI-3. Classifying data accessed by AI apps and alerting on anomalies is AI-6.
    fr: |-
      Un manifeste de capacités qui refuse tout ce qui n'est pas explicitement autorisé relève d'AI-4. Filtrer et journaliser les sorties avant leur livraison fait partie du filtrage multicouche d'AI-2. Définir le rôle du modèle dans le contexte système et marquer les données non fiables (spotlighting) relève d'AI-3. Classifier les données consultées par les applications d'IA et alerter sur les anomalies relève d'AI-6.
  options:
    ai1:
      en: |-
        AI-1 governs which models reach production; none of the requirements is about model approval.
      fr: |-
        AI-1 gouverne les modèles qui arrivent en production ; aucune des exigences ne porte sur l'approbation des modèles.
    ai5:
      en: |-
        AI-5 adds human approval of critical actions; none of the requirements asks for an approval.
      fr: |-
        AI-5 ajoute une approbation humaine des actions critiques ; aucune des exigences ne demande d'approbation.
references:
  - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security
