id: sc100-1c-dso-cspm-features
objective: "1.3.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has connected its Azure DevOps organization and its GitHub organization to Microsoft Defender for Cloud as part of its DevSecOps process. Only the foundational CSPM capabilities are in use: Defender CSPM isn't enabled on any Azure subscription, AWS connector or GCP connector. The security team evaluates what the DevOps security capabilities provide in this configuration.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. a connecté son organisation Azure DevOps et son organisation GitHub à Microsoft Defender for Cloud dans le cadre de son processus DevSecOps. Seules les capacités CSPM de base (Foundational CSPM) sont utilisées : Defender CSPM n'est activé sur aucun abonnement Azure, connecteur AWS ou connecteur GCP. L'équipe de sécurité évalue ce que les capacités de sécurité DevOps fournissent dans cette configuration.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Defender for Cloud lists the repositories of both organizations in its DevOps inventory.
        fr: Defender for Cloud répertorie les dépôts des deux organisations dans son inventaire DevOps.
    - id: s2
      text:
        en: Developers receive Defender for Cloud findings as annotations on their Azure DevOps pull requests.
        fr: Les développeurs reçoivent les résultats de Defender for Cloud sous forme d'annotations sur leurs pull requests Azure DevOps.
    - id: s3
      text:
        en: Attack path analysis includes the DevOps resources of both organizations.
        fr: L'analyse des chemins d'attaque inclut les ressources DevOps des deux organisations.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The DevOps inventory and the recommendations for DevOps environment misconfigurations are available with foundational CSPM for Azure DevOps and GitHub. Pull request annotations, code-to-cloud mapping, attack path analysis and the cloud security explorer require Defender CSPM. Attack path analysis also needs Defender CSPM on an Azure subscription, AWS connector or GCP connector in the same tenant as the DevOps connector.
    fr: |
      L'inventaire DevOps et les recommandations sur les erreurs de configuration des environnements DevOps sont disponibles avec le CSPM de base pour Azure DevOps et GitHub. Les annotations de pull requests, le mappage du code au cloud, l'analyse des chemins d'attaque et l'explorateur de sécurité cloud exigent Defender CSPM. L'analyse des chemins d'attaque nécessite aussi Defender CSPM sur un abonnement Azure, un connecteur AWS ou un connecteur GCP dans le même locataire que le connecteur DevOps.
references:
  - title: Support and prerequisites
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
