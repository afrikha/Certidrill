id: sc100-1a-backup-priority-systems
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an on-premises AD DS forest synchronized to Microsoft Entra ID by Microsoft Entra Connect, an ERP finance system, a customer ordering platform and security monitoring tools. Its backup coverage is incomplete.

    You are designing the backup and restore plan that the company will use to recover from a ransomware attack. You need to recommend which systems to protect and restore first, following Microsoft's guidance.

    What should you recommend?
  fr: |
    Northwind Traders dispose d'une forêt AD DS locale synchronisée avec Microsoft Entra ID par Microsoft Entra Connect, d'un ERP financier, d'une plateforme de commande client et d'outils de surveillance de la sécurité. Sa couverture de sauvegarde est incomplète.

    Vous concevez le plan de sauvegarde et de restauration que l'entreprise utilisera pour se remettre d'une attaque par rançongiciel. Vous devez recommander les systèmes à protéger et à restaurer en premier, en suivant les recommandations de Microsoft.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The identity systems: AD DS and Microsoft Entra Connect", fr: "Les systèmes d'identité : AD DS et Microsoft Entra Connect" } }
    - { id: b, text: { en: "The financial systems: the ERP finance system", fr: "Les systèmes financiers : l'ERP financier" } }
    - { id: c, text: { en: "The revenue systems: the customer ordering platform", fr: "Les systèmes générateurs de revenus : la plateforme de commande client" } }
    - { id: d, text: { en: "The security systems: the security monitoring tools", fr: "Les systèmes de sécurité : les outils de surveillance de la sécurité" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Microsoft's backup and restore plan starts with identity systems such as Active Directory and Microsoft Entra Connect, then human life and safety systems, financial systems, product or service enablement, and minimum security systems. Every other system depends on identity to authenticate, so it must be recoverable first; the backup list is also the restore list.
    fr: |
      Le plan de sauvegarde et de restauration de Microsoft commence par les systèmes d'identité comme Active Directory et Microsoft Entra Connect, puis les systèmes de sécurité des personnes, les systèmes financiers, les systèmes qui permettent de fournir les produits ou services, et les systèmes de sécurité minimaux. Tous les autres systèmes dépendent de l'identité pour l'authentification : elle doit donc être récupérable en premier ; la liste des sauvegardes est aussi la liste des restaurations.
  options:
    b:
      en: |-
        Financial systems come after identity systems and human safety systems in the priority order, because they can't run without authentication.
      fr: |-
        Les systèmes financiers viennent après les systèmes d'identité et les systèmes de sécurité des personnes dans l'ordre de priorité, car ils ne fonctionnent pas sans authentification.
    c:
      en: |-
        Systems that enable products or services are fourth in the order. Restoring them first fails if the identity systems are still down.
      fr: |-
        Les systèmes qui permettent de fournir les produits ou services sont quatrièmes dans l'ordre. Les restaurer en premier échoue si les systèmes d'identité sont toujours indisponibles.
    d:
      en: |-
        Minimum security systems are part of the list, but they come last in the priority order of the backup and restore plan.
      fr: |-
        Les systèmes de sécurité minimaux font partie de la liste, mais ils viennent en dernier dans l'ordre de priorité du plan de sauvegarde et de restauration.
references:
  - title: Backup and restore plan to protect against ransomware
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware
