id: sc100-1a-vault-excellent-level
objective: "1.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. protects its Azure virtual machines with a Recovery Services vault named RSV-Prod. Multi-user authorization (MUA) is already enabled on RSV-Prod with a Resource Guard in a subscription that the security team owns. Soft delete is enabled with the default settings, and immutability is disabled.

    The security policy requires that RSV-Prod reach the Excellent security level of Azure Backup.

    Which two actions meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. protège ses machines virtuelles Azure avec un coffre Recovery Services nommé RSV-Prod. L'autorisation multi-utilisateur (MUA) est déjà activée sur RSV-Prod avec un Resource Guard situé dans un abonnement que l'équipe de sécurité détient. La suppression réversible est activée avec les paramètres par défaut et l'immuabilité est désactivée.

    La stratégie de sécurité exige que RSV-Prod atteigne le niveau de sécurité Excellent de la Sauvegarde Azure.

    Quelles sont les deux actions qui répondent à l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable immutability on RSV-Prod without locking it", fr: "Activer l'immuabilité sur RSV-Prod sans la verrouiller" } }
    - { id: b, text: { en: "Enable immutability on RSV-Prod and lock it", fr: "Activer l'immuabilité sur RSV-Prod et la verrouiller" } }
    - { id: c, text: { en: "Extend the soft delete retention of RSV-Prod to 180 days", fr: "Porter la rétention de la suppression réversible de RSV-Prod à 180 jours" } }
    - { id: d, text: { en: "Make soft delete always-on for RSV-Prod", fr: "Rendre la suppression réversible toujours active pour RSV-Prod" } }
    - { id: e, text: { en: "Enable Cross Region Restore on RSV-Prod", fr: "Activer la restauration interrégion sur RSV-Prod" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Azure Backup rates a vault Excellent when immutability or soft delete is enabled and irreversible, that is locked immutability or always-on soft delete, and MUA is enabled on the vault. MUA is already in place, so either irreversible capability completes the requirement on its own.
    fr: |
      La Sauvegarde Azure classe un coffre Excellent quand l'immuabilité ou la suppression réversible est activée et irréversible, c'est-à-dire une immuabilité verrouillée ou une suppression réversible toujours active, et que la MUA est activée sur le coffre. La MUA est déjà en place : chacune des deux capacités irréversibles suffit donc à elle seule.
  options:
    a:
      en: |-
        Immutability that isn't locked can be disabled, so it is a reversible capability and doesn't reach the Excellent level.
      fr: |-
        Une immuabilité non verrouillée peut être désactivée : c'est une capacité réversible qui n'atteint pas le niveau Excellent.
    c:
      en: |-
        A longer retention doesn't make soft delete irreversible; an administrator can still disable it.
      fr: |-
        Une rétention plus longue ne rend pas la suppression réversible irréversible ; un administrateur peut toujours la désactiver.
    e:
      en: |-
        Cross Region Restore improves availability during a regional outage. It isn't one of the capabilities that determine the security level.
      fr: |-
        La restauration interrégion améliore la disponibilité pendant une panne régionale. Elle ne fait pas partie des capacités qui déterminent le niveau de sécurité.
references:
  - title: Overview of security and cyber recovery in Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/security-overview
