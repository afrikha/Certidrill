id: sc100-1b-ai-adopt-caf-statements
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is writing its secure AI adoption strategy based on the AI scenario of the Cloud Adoption Framework for Azure (CAF). The draft strategy contains the following statements.

    For each of the following statements, select **Yes** if the statement is consistent with the CAF guidance. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders rédige sa stratégie d'adoption sécurisée de l'IA à partir du scénario IA du Cloud Adoption Framework pour Azure (CAF). Le projet de stratégie contient les affirmations suivantes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est conforme aux recommandations du CAF. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Models and datasets are stored in Azure Blob Storage with private endpoints, encryption at rest and in transit, and strict access policies.
        fr: |-
          Les modèles et les jeux de données sont stockés dans Stockage Blob Azure avec des points de terminaison privés, un chiffrement au repos et en transit, et des stratégies d'accès strictes.
    - id: s2
      text:
        en: |-
          AI on Azure infrastructure is the default choice for new AI applications, because it gives the most control over security.
        fr: |-
          L'IA sur l'infrastructure Azure est le choix par défaut pour les nouvelles applications d'IA, car elle donne le plus de contrôle sur la sécurité.
    - id: s3
      text:
        en: |-
          The Secure step is completed once, before the first AI workload goes to production, and isn't revisited afterward.
        fr: |-
          L'étape Secure est réalisée une seule fois, avant la mise en production de la première charge de travail d'IA, et n'est plus revue ensuite.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      The Secure AI guidance protects AI artifacts in Blob Storage with private endpoints, encryption at rest and in transit, strict access policies and monitoring. CAF recommends the option with the least operational responsibility and states that AI on Azure infrastructure shouldn't be the default approach. Secure is a continuous process that the organization revisits regularly, with periodic risk assessments.
    fr: |-
      Les recommandations Secure AI protègent les artefacts d'IA dans Stockage Blob avec des points de terminaison privés, un chiffrement au repos et en transit, des stratégies d'accès strictes et une surveillance. Le CAF recommande l'option qui implique le moins de responsabilité opérationnelle et indique que l'IA sur l'infrastructure Azure ne doit pas être l'approche par défaut. Secure est un processus continu que l'organisation revoit régulièrement, avec des évaluations des risques périodiques.
references:
  - title: Secure AI - Guidance to set up your organization's AI security process - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/secure
  - title: AI adoption - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/
