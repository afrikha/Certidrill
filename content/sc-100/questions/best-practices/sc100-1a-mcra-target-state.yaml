id: sc100-1a-mcra-target-state
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has on-premises datacenters, workloads in Azure and AWS, operational technology (OT) networks in its plants, and a third-party SIEM and EDR solution. The CISO asks you to define a target-state security architecture.

    You need a Microsoft reference that shows the cybersecurity capabilities across this hybrid estate and how Microsoft capabilities integrate with the security tools that the company already owns.

    Which reference should you use?
  fr: |
    Litware, Inc. dispose de centres de données locaux, de charges de travail dans Azure et AWS, de réseaux de technologies opérationnelles (OT) dans ses usines, et d'une solution SIEM et EDR tierce. Le RSSI vous demande de définir une architecture de sécurité cible.

    Vous avez besoin d'une référence Microsoft qui montre les capacités de cybersécurité sur ce patrimoine hybride et la façon dont les capacités Microsoft s'intègrent aux outils de sécurité que l'entreprise possède déjà.

    Quelle référence devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Microsoft cloud security benchmark (MCSB)", fr: "Le Microsoft cloud security benchmark (MCSB)" } }
    - { id: b, text: { en: "The Microsoft Cloud Adoption Framework for Azure (CAF)", fr: "Le Microsoft Cloud Adoption Framework pour Azure (CAF)" } }
    - { id: c, text: { en: "The Azure Well-Architected Framework (WAF)", fr: "L'Azure Well-Architected Framework (WAF)" } }
    - { id: d, text: { en: "The Microsoft Cybersecurity Reference Architectures (MCRA)", fr: "Les Microsoft Cybersecurity Reference Architectures (MCRA)" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The MCRA are technical reference architectures for end-to-end security based on Zero Trust principles, covering legacy IT, multicloud, IoT, OT and AI. Organizations use them as a starting template for a target-state architecture, to compare Microsoft's recommendations with their current tools, and to identify integration points with existing security tools, including third-party products.
    fr: |
      Les MCRA sont des architectures de référence techniques pour une sécurité de bout en bout fondée sur les principes Confiance Zéro, qui couvrent l'informatique héritée, le multicloud, l'IoT, l'OT et l'IA. Les organisations les utilisent comme modèle de départ d'une architecture cible, pour comparer les recommandations de Microsoft à leurs outils actuels, et pour repérer les points d'intégration avec les outils de sécurité existants, y compris des produits tiers.
  options:
    a:
      en: |-
        The MCSB is a set of security controls to assess cloud workloads against. It doesn't map capabilities and their integration with third-party tools.
      fr: |-
        Le MCSB est un ensemble de contrôles de sécurité par rapport auxquels évaluer les charges de travail cloud. Il ne cartographie pas les capacités ni leur intégration avec des outils tiers.
    b:
      en: |-
        The CAF guides cloud adoption, including its security and governance methodologies. It isn't a capability map of a hybrid estate with OT.
      fr: |-
        Le CAF guide l'adoption du cloud, y compris ses méthodologies de sécurité et de gouvernance. Ce n'est pas une carte des capacités d'un patrimoine hybride avec OT.
    c:
      en: |-
        The WAF guides the design of individual Azure workloads across its pillars. It doesn't describe the organization's security capabilities as a whole.
      fr: |-
        Le WAF guide la conception des charges de travail Azure selon ses piliers. Il ne décrit pas les capacités de sécurité de l'organisation dans leur ensemble.
references:
  - title: Microsoft Cybersecurity Reference Architectures
    url: https://learn.microsoft.com/en-us/security/adoption/mcra
