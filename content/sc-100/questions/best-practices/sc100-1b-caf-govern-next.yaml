id: sc100-1b-caf-govern-next
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is starting its cloud adoption. The CIO sponsors a new cloud governance team with members from IT operations, cloud architecture, security, compliance and finance. The team plans to write governance policies for security, cost and data.

    According to the Govern methodology of the Cloud Adoption Framework for Azure (CAF), what should the team do before it documents the cloud governance policies?
  fr: |
    Tailspin Toys commence son adoption du cloud. Le DSI parraine une nouvelle équipe de gouvernance cloud composée de membres de l'exploitation informatique, de l'architecture cloud, de la sécurité, de la conformité et de la finance. L'équipe prévoit de rédiger des stratégies de gouvernance pour la sécurité, les coûts et les données.

    Selon la méthodologie Govern du Cloud Adoption Framework pour Azure (CAF), que doit faire l'équipe avant de documenter les stratégies de gouvernance cloud ?
body:
  options:
    - { id: a, text: { en: "Assign Azure Policy definitions with the Deny effect at the tenant root group", fr: "Attribuer des définitions Azure Policy avec l'effet Deny au groupe racine du locataire" } }
    - { id: b, text: { en: "Turn on continuous compliance monitoring in Microsoft Defender for Cloud", fr: "Activer la surveillance continue de la conformité dans Microsoft Defender for Cloud" } }
    - { id: c, text: { en: "Assess the cloud risks and record them in a risk register", fr: "Évaluer les risques cloud et les consigner dans un registre des risques" } }
    - { id: d, text: { en: "Deploy the Azure landing zone reference implementation", fr: "Déployer l'implémentation de référence des zones d'atterrissage Azure" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The CAF Govern process builds the governance team once, then cycles through assessing cloud risks, documenting governance policies, enforcing them and monitoring compliance. Policies are written to address the risks that the assessment identified and recorded in the risk register.
    fr: |-
      Le processus Govern du CAF constitue l'équipe de gouvernance une fois, puis enchaîne en cycle l'évaluation des risques cloud, la documentation des stratégies de gouvernance, leur application et la surveillance de la conformité. Les stratégies sont rédigées pour traiter les risques identifiés par l'évaluation et consignés dans le registre des risques.
  options:
    a:
      en: |-
        Enforcing policies is the step after documenting them; the team can't enforce policies it hasn't written yet.
      fr: |-
        L'application des stratégies est l'étape qui suit leur documentation ; l'équipe ne peut pas appliquer des stratégies qu'elle n'a pas encore rédigées.
    b:
      en: |-
        Monitoring compliance is the last step of the cycle, after the policies are documented and enforced.
      fr: |-
        La surveillance de la conformité est la dernière étape du cycle, après la documentation et l'application des stratégies.
    d:
      en: |-
        A landing zone implements governance decisions; the Govern methodology first identifies the risks that these decisions must address.
      fr: |-
        Une zone d'atterrissage met en œuvre des décisions de gouvernance ; la méthodologie Govern identifie d'abord les risques que ces décisions doivent traiter.
references:
  - title: Build a cloud governance team - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/
  - title: Assess cloud risks - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/assess-cloud-risks
