id: sc100-1a-threat-prioritization
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an on-premises datacenter, Azure subscriptions and Microsoft 365. The company uses Microsoft Defender XDR and Microsoft Security Exposure Management.

    The CISO asks you to design a security strategy that supports the bank's business resiliency goals. The strategy must identify the threats to business-critical assets and prioritize the security work according to their impact on the business.

    Which two actions should you include in the strategy? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un centre de données local, d'abonnements Azure et de Microsoft 365. L'entreprise utilise Microsoft Defender XDR et Microsoft Security Exposure Management.

    Le RSSI vous demande de concevoir une stratégie de sécurité qui prend en charge les objectifs de résilience de la banque. La stratégie doit identifier les menaces qui pèsent sur les ressources vitales pour l'entreprise et prioriser le travail de sécurité selon leur impact sur l'activité.

    Quelles sont les deux actions que vous devez inclure dans la stratégie ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Record ransomware in the risk register as a high-likelihood, high-impact scenario", fr: "Inscrire le rançongiciel au registre des risques comme un scénario à forte probabilité et à fort impact" } }
    - { id: b, text: { en: "Give commodity malware alerts a low priority so that analysts focus on human-operated attacks", fr: "Donner une faible priorité aux alertes de logiciels malveillants courants pour que les analystes se concentrent sur les attaques à opération humaine" } }
    - { id: c, text: { en: "Classify the critical assets and prioritize the recommendations and attack paths that reach them", fr: "Classer les ressources critiques et prioriser les recommandations et les chemins d'attaque qui les atteignent" } }
    - { id: d, text: { en: "Rank the threats by the number of alerts that each device generated during the last 90 days", fr: "Classer les menaces selon le nombre d'alertes générées par chaque appareil au cours des 90 derniers jours" } }
    - { id: e, text: { en: "Postpone backup protection until every business unit has completed its asset inventory", fr: "Reporter la protection des sauvegardes jusqu'à ce que chaque unité commerciale ait terminé son inventaire des ressources" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Microsoft recommends adding ransomware to the risk register as a high-likelihood, high-impact scenario, so that the business treats it like other major risks. Classifying critical assets in Security Exposure Management then lets the team prioritize the recommendations and attack paths that lead to the assets whose compromise would hurt the business most.
    fr: |
      Microsoft recommande d'inscrire le rançongiciel au registre des risques comme un scénario à forte probabilité et à fort impact, pour que l'entreprise le traite comme ses autres risques majeurs. Classer les ressources critiques dans Security Exposure Management permet ensuite à l'équipe de prioriser les recommandations et les chemins d'attaque qui mènent aux ressources dont la compromission nuirait le plus à l'activité.
  options:
    b:
      en: |-
        Microsoft warns not to ignore commodity malware, because ransomware operators regularly buy access to organizations that such malware has already infected.
      fr: |-
        Microsoft met en garde contre l'oubli des logiciels malveillants courants, car les opérateurs de rançongiciels achètent régulièrement des accès à des organisations déjà infectées par ces logiciels.
    d:
      en: |-
        The number of alerts per device says nothing about the business value of the device. Prioritization must start from the business impact of the assets.
      fr: |-
        Le nombre d'alertes par appareil n'indique rien sur la valeur métier de l'appareil. La priorisation doit partir de l'impact métier des ressources.
    e:
      en: |-
        Microsoft warns that other work must not delay critical areas such as backups and privileged access, which are the first two steps of the ransomware plan.
      fr: |-
        Microsoft avertit que les autres travaux ne doivent pas retarder des domaines critiques comme les sauvegardes et l'accès privilégié, qui sont les deux premières étapes du plan contre les rançongiciels.
references:
  - title: Backup and restore plan to protect against ransomware
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware
  - title: Overview of critical asset management
    url: https://learn.microsoft.com/en-us/security-exposure-management/critical-asset-management
