id: sc100-1a-human-operated-response
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has an on-premises Active Directory Domain Services (AD DS) forest, Azure subscriptions and Microsoft 365. Ransomware encrypted the data on 12 file servers last night.

    The investigation shows that the attacker signed in with stolen credentials three weeks ago, elevated privileges to a domain administrator account and moved laterally to the file servers before deploying the ransomware. The attacker also copied data outside the network.

    You need to recommend how the organization should respond to the attack.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose d'une forêt Active Directory Domain Services (AD DS) locale, d'abonnements Azure et de Microsoft 365. Un rançongiciel a chiffré les données de 12 serveurs de fichiers la nuit dernière.

    L'enquête montre que l'attaquant s'est connecté avec des informations d'identification volées il y a trois semaines, a élevé ses privilèges jusqu'à un compte d'administrateur de domaine et s'est déplacé latéralement jusqu'aux serveurs de fichiers avant de déployer le rançongiciel. L'attaquant a aussi copié des données hors du réseau.

    Vous devez recommander la façon dont l'organisation doit répondre à l'attaque.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Treat it as commodity ransomware and remediate the malware on the 12 file servers", fr: "La traiter comme un rançongiciel courant et corriger le logiciel malveillant sur les 12 serveurs de fichiers" } }
    - { id: b, text: { en: "Restore the 12 file servers from their latest recovery points and resume operations", fr: "Restaurer les 12 serveurs de fichiers à partir de leurs derniers points de récupération et reprendre l'activité" } }
    - { id: c, text: { en: "Treat it as human-operated ransomware and run a full incident response that evicts the attacker", fr: "La traiter comme un rançongiciel à opération humaine et mener une réponse complète aux incidents qui évince l'attaquant" } }
    - { id: d, text: { en: "Isolate the 12 file servers and run full antivirus scans on them before reconnecting them", fr: "Isoler les 12 serveurs de fichiers et y exécuter des analyses antivirus complètes avant de les reconnecter" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Credential theft, privilege elevation and lateral movement are the hallmarks of human-operated ransomware: an active attacker who targets the organization rather than a single device. Microsoft states that such an attack requires complete eviction of the adversary, because the attacker keeps threatening operations after the first encounter. The response must therefore scope the compromised accounts and systems, not only the encrypted servers.
    fr: |
      Le vol d'informations d'identification, l'élévation de privilèges et le déplacement latéral sont les marques d'un rançongiciel à opération humaine : un attaquant actif qui cible l'organisation plutôt qu'un seul appareil. Microsoft indique qu'une telle attaque exige l'éviction complète de l'adversaire, car il continue de menacer l'activité après la première rencontre. La réponse doit donc délimiter les comptes et les systèmes compromis, pas seulement les serveurs chiffrés.
  options:
    a:
      en: |-
        Malware remediation is the response to commodity ransomware that spreads automatically. Here the attacker still holds a domain administrator account and would come back.
      fr: |-
        La correction des logiciels malveillants est la réponse à un rançongiciel courant qui se propage automatiquement. Ici, l'attaquant détient toujours un compte d'administrateur de domaine et reviendrait.
    b:
      en: |-
        Restoring the servers while the attacker still controls privileged accounts lets the attacker encrypt them again, and the restore point might already contain the attacker's persistence.
      fr: |-
        Restaurer les serveurs alors que l'attaquant contrôle encore des comptes privilégiés lui permet de les chiffrer de nouveau, et le point de restauration peut déjà contenir sa persistance.
    d:
      en: |-
        Isolating and scanning the servers handles the payload only. It doesn't remove the stolen credentials or the compromised domain administrator account.
      fr: |-
        Isoler et analyser les serveurs ne traite que la charge utile. Cela ne supprime ni les informations d'identification volées ni le compte d'administrateur de domaine compromis.
references:
  - title: What is ransomware?
    url: https://learn.microsoft.com/en-us/security/ransomware/human-operated-ransomware
