id: sc100-1b-supply-chain-vendor
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys develops a desktop application that thousands of customers install. The application includes an updater that downloads new versions, scripts and configuration files from the Tailspin update service.

    You need to recommend a design for the update process that follows Microsoft's guidance for software vendors against supply chain attacks.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys développe une application de bureau que des milliers de clients installent. L'application comprend un programme de mise à jour qui télécharge les nouvelles versions, des scripts et des fichiers de configuration depuis le service de mise à jour de Tailspin.

    Vous devez recommander une conception du processus de mise à jour qui suit les recommandations de Microsoft destinées aux éditeurs de logiciels contre les attaques de la chaîne d'approvisionnement.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Update channel: [[s1]]

      Update content: [[s2]]

      Build and update infrastructure administrators: [[s3]]
    fr: |
      Canal de mise à jour : [[s1]]

      Contenu des mises à jour : [[s2]]

      Administrateurs de l'infrastructure de build et de mise à jour : [[s3]]
  slots:
    - id: s1
      options:
        - { id: pin, text: { en: "Require TLS and implement certificate pinning", fr: "Exiger TLS et implémenter l'épinglage de certificat" } }
        - { id: ipallow, text: { en: "Allow downloads only from a list of update server IP addresses", fr: "N'autoriser les téléchargements que depuis une liste d'adresses IP de serveurs de mise à jour" } }
        - { id: http, text: { en: "Use HTTP and compare the file size with the published value", fr: "Utiliser HTTP et comparer la taille du fichier à la valeur publiée" } }
    - id: s2
      options:
        - { id: exeonly, text: { en: "Sign the executables and accept unsigned scripts and configuration files", fr: "Signer les exécutables et accepter les scripts et fichiers de configuration non signés" } }
        - { id: signall, text: { en: "Sign every file, scripts and configuration files included, and verify signatures", fr: "Signer chaque fichier, scripts et fichiers de configuration compris, et vérifier les signatures" } }
        - { id: hashes, text: { en: "Publish file hashes on the download page for customers to check manually", fr: "Publier les hachages des fichiers sur la page de téléchargement pour une vérification manuelle par les clients" } }
    - id: s3
      options:
        - { id: shared, text: { en: "Share one administrator account protected by a long password", fr: "Partager un compte administrateur protégé par un mot de passe long" } }
        - { id: expire, text: { en: "Require a password change every 30 days", fr: "Exiger un changement de mot de passe tous les 30 jours" } }
        - { id: mfa, text: { en: "Require multifactor authentication", fr: "Exiger l'authentification multifacteur" } }
answer:
  values: { s1: pin, s2: signall, s3: mfa }
explanation:
  correct:
    en: |-
      For software vendors, Microsoft recommends requiring TLS for update channels with certificate pinning, signing everything (configuration files, scripts, XML files and packages) and checking digital signatures, and keeping the build and update infrastructure secure, which includes requiring multifactor authentication for administrators and patching it immediately.
    fr: |-
      Pour les éditeurs de logiciels, Microsoft recommande d'exiger TLS sur les canaux de mise à jour avec l'épinglage de certificat, de tout signer (fichiers de configuration, scripts, fichiers XML et packages) et de vérifier les signatures numériques, et de maintenir une infrastructure de build et de mise à jour sécurisée, ce qui comprend l'authentification multifacteur pour les administrateurs et l'application immédiate des correctifs.
  options:
    exeonly:
      en: |-
        An attacker who can change an unsigned script or configuration file can still control the updater.
      fr: |-
        Un attaquant qui peut modifier un script ou un fichier de configuration non signé peut encore contrôler le programme de mise à jour.
    ipallow:
      en: |-
        An IP allowlist doesn't authenticate the server cryptographically and doesn't protect content in transit.
      fr: |-
        Une liste d'adresses IP autorisées n'authentifie pas le serveur de façon cryptographique et ne protège pas le contenu en transit.
references:
  - title: Supply chain attacks - Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/malware/supply-chain-malware
