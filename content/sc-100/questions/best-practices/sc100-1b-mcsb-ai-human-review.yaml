id: sc100-1b-mcsb-ai-human-review
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. deploys an AI agent that handles customer claims. The agent can issue refunds and can send customer data to the API of an external shipping partner.

    The finance department requires that a supervisor approves every refund above USD 500 and every transfer of customer data to an external system before the agent completes the action. The solution must align with the Microsoft cloud security benchmark (MCSB) and minimize custom development.

    What should you recommend?
  fr: |
    Proseware, Inc. déploie un agent d'IA qui traite les réclamations des clients. L'agent peut émettre des remboursements et envoyer des données client à l'API d'un partenaire de livraison externe.

    Le service financier exige qu'un superviseur approuve chaque remboursement supérieur à 500 USD et chaque transfert de données client vers un système externe avant que l'agent termine l'action. La solution doit s'aligner sur le Microsoft cloud security benchmark (MCSB) et réduire au minimum le développement personnalisé.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Prompt Shields in Azure AI Content Safety on every customer request", fr: "Prompt Shields dans Azure AI Content Safety sur chaque demande client" } }
    - { id: b, text: { en: "An approval step in Azure Logic Apps that pauses these actions until a supervisor approves", fr: "Une étape d'approbation dans Azure Logic Apps qui suspend ces actions jusqu'à l'approbation d'un superviseur" } }
    - { id: c, text: { en: "Monthly red teaming of the agent with PyRIT before each release", fr: "Un red teaming mensuel de l'agent avec PyRIT avant chaque mise en production" } }
    - { id: d, text: { en: "Defender for Cloud threat protection alerts on the agent's model deployment", fr: "Les alertes de protection contre les menaces de Defender for Cloud sur le déploiement du modèle de l'agent" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AI-5 (Ensure human-in-the-loop) asks to identify critical actions, such as external data transfers and high-impact decisions, and to pause the AI process until a human approves. The benchmark names approval workflows in Azure Logic Apps or Power Automate, which require no custom approval code.
    fr: |-
      AI-5 (Ensure human-in-the-loop) demande d'identifier les actions critiques, comme les transferts de données externes et les décisions à fort impact, et de suspendre le processus d'IA jusqu'à l'approbation d'un humain. Le benchmark cite les workflows d'approbation d'Azure Logic Apps ou de Power Automate, qui ne demandent aucun code d'approbation personnalisé.
  options:
    a:
      en: |-
        Prompt Shields detect prompt attacks; they don't ask a supervisor to approve a legitimate refund.
      fr: |-
        Prompt Shields détecte les attaques par prompt ; il ne demande pas à un superviseur d'approuver un remboursement légitime.
    c:
      en: |-
        Red teaming finds weaknesses before release; it doesn't add an approval to each action in production.
      fr: |-
        Le red teaming trouve les faiblesses avant la mise en production ; il n'ajoute pas d'approbation à chaque action en production.
    d:
      en: |-
        Threat protection alerts on attacks after they happen; the requirement is an approval before the action completes.
      fr: |-
        La protection contre les menaces alerte sur des attaques après coup ; l'exigence est une approbation avant que l'action se termine.
references:
  - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security
