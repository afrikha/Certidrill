id: sc100-1b-ai-adopt-governance
objective: "1.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has 30 AI workloads in Azure. Six of them make credit decisions and are classified as high risk; the others are internal productivity tools classified as low risk. An AI Center of Excellence sets the Responsible AI requirements for the whole company.

    The current governance relies on a yearly review of every workload and on emails that remind teams of the AI policies. You need to recommend changes that align AI governance with the Cloud Adoption Framework for Azure (CAF), while keeping the review effort proportionate to the risk.

    Which two changes should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose de 30 charges de travail d'IA dans Azure. Six d'entre elles prennent des décisions de crédit et sont classées à haut risque ; les autres sont des outils de productivité internes classés à faible risque. Un centre d'excellence de l'IA fixe les exigences d'IA responsable pour toute l'entreprise.

    La gouvernance actuelle repose sur une revue annuelle de chaque charge de travail et sur des e-mails qui rappellent les stratégies d'IA aux équipes. Vous devez recommander des changements qui alignent la gouvernance de l'IA sur le Cloud Adoption Framework pour Azure (CAF), tout en gardant un effort de revue proportionné au risque.

    Quels sont les deux changements que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Review the high-risk workloads quarterly and keep yearly reviews for the low-risk workloads", fr: "Revoir les charges de travail à haut risque chaque trimestre et conserver des revues annuelles pour celles à faible risque" } }
    - { id: b, text: { en: "Review every workload monthly, whatever its risk classification", fr: "Revoir chaque charge de travail tous les mois, quelle que soit sa classification de risque" } }
    - { id: c, text: { en: "Let each business unit define its own Responsible AI requirements for its workloads", fr: "Laisser chaque division définir ses propres exigences d'IA responsable pour ses charges de travail" } }
    - { id: d, text: { en: "Enforce the policies with Azure Policy and Microsoft Purview, and keep training and audits where automation isn't possible", fr: "Appliquer les stratégies avec Azure Policy et Microsoft Purview, et conserver la formation et les audits là où l'automatisation n'est pas possible" } }
    - { id: e, text: { en: "Replace the policy reminders with workshops and manual audits of each deployment", fr: "Remplacer les rappels des stratégies par des ateliers et des audits manuels de chaque déploiement" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      The CAF Govern AI guidance monitors AI risks with quarterly reviews for high-risk workloads and annual reviews for lower-risk ones. It enforces AI governance policies automatically where possible, with tools such as Azure Policy and Microsoft Purview, and supplements them with manual enforcement such as training, workshops and audits.
    fr: |-
      Les recommandations Govern AI du CAF surveillent les risques de l'IA avec des revues trimestrielles pour les charges de travail à haut risque et des revues annuelles pour les autres. Elles appliquent les stratégies de gouvernance de l'IA automatiquement quand c'est possible, avec des outils comme Azure Policy et Microsoft Purview, et les complètent par une application manuelle comme la formation, les ateliers et les audits.
  options:
    b:
      en: |-
        Monthly reviews of low-risk tools don't keep the effort proportionate to the risk; the guidance differentiates the cadence by risk.
      fr: |-
        Des revues mensuelles des outils à faible risque ne gardent pas un effort proportionné au risque ; les recommandations différencient la fréquence selon le risque.
    c:
      en: |-
        CAF centralizes Responsible AI requirements in a central function such as an AI Center of Excellence; business units work within those boundaries.
      fr: |-
        Le CAF centralise les exigences d'IA responsable dans une fonction centrale comme un centre d'excellence de l'IA ; les divisions travaillent dans ces limites.
    e:
      en: |-
        Manual enforcement only supplements automation; relying on it alone adds effort and leaves gaps.
      fr: |-
        L'application manuelle ne fait que compléter l'automatisation ; s'appuyer uniquement sur elle ajoute de l'effort et laisse des lacunes.
references:
  - title: Govern AI - Guidance to set up your organization's AI governance process - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/govern
