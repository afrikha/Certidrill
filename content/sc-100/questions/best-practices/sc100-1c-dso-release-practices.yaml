id: sc100-1c-dso-release-practices
objective: "1.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is defining a DevSecOps process for its Azure workloads by following the Microsoft Cloud Adoption Framework for Azure (CAF) and the Azure Well-Architected Framework. The platform architect asks you to confirm what this guidance recommends.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys définit un processus DevSecOps pour ses charges de travail Azure en suivant le Microsoft Cloud Adoption Framework for Azure (CAF) et l'Azure Well-Architected Framework. L'architecte de plateforme vous demande de confirmer ce que recommandent ces référentiels.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The guidance recommends deploying all infrastructure through code and keeping the infrastructure code with the application code.
        fr: Les recommandations préconisent de déployer toute l'infrastructure par le code et de conserver le code d'infrastructure avec le code de l'application.
    - id: s2
      text:
        en: The guidance recommends running security tests against a copy of production data so that the results are realistic.
        fr: Les recommandations préconisent d'exécuter les tests de sécurité sur une copie des données de production pour que les résultats soient réalistes.
    - id: s3
      text:
        en: The guidance recommends scanning the IaC templates, images and pipelines of test environments on the same cadence as production.
        fr: Les recommandations préconisent d'analyser les modèles IaC, les images et les pipelines des environnements de test au même rythme que la production.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The CAF asks to deploy all infrastructure through code, without exception, to colocate the IaC assets with the application code and to apply the same safe deployment practices. The Well-Architected Framework testing guidance uses synthetic data and dedicated test credentials rather than production data, which also keeps test environments from becoming a path to production data. It asks to scan test assets such as IaC, images and pipelines on the same cadence as production.
    fr: |
      Le CAF demande de déployer toute l'infrastructure par le code, sans exception, de placer les ressources IaC avec le code de l'application et d'appliquer les mêmes pratiques de déploiement sûr. Les recommandations de test du Well-Architected Framework utilisent des données synthétiques et des informations d'identification de test dédiées plutôt que des données de production, ce qui évite aussi que les environnements de test deviennent un chemin vers les données de production. Elles demandent d'analyser les ressources de test, comme l'IaC, les images et les pipelines, au même rythme que la production.
references:
  - title: Perform Your Cloud Adoption Securely
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/secure/adopt
  - title: Architecture strategies for security testing
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/test
