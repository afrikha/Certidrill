id: sc100-1c-lz-ip-forwarding
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses the reference hierarchy of Azure landing zones: an intermediate root management group named Woodgrove, with Platform (Management, Connectivity, Identity and Security) and Landing zones (Corp and Online) below it. Network virtual appliances in the Connectivity subscription require IP forwarding. The security team requires that no virtual machine in any workload landing zone, current or future, can have IP forwarding enabled or accept RDP from the internet.

    You need to recommend where to assign the policies that enforce these requirements. The solution must minimize the number of policy assignments and exemptions.

    What should you recommend?
  fr: |
    Woodgrove Bank utilise la hiérarchie de référence des zones d'atterrissage Azure : un groupe d'administration racine intermédiaire nommé Woodgrove, avec Platform (Management, Connectivity, Identity et Security) et Landing zones (Corp et Online) en dessous. Des appliances virtuelles réseau de l'abonnement Connectivity ont besoin du transfert IP. L'équipe de sécurité exige qu'aucune machine virtuelle d'une zone d'atterrissage de charge de travail, actuelle ou future, ne puisse avoir le transfert IP activé ni accepter de connexions RDP depuis Internet.

    Vous devez recommander où attribuer les stratégies qui appliquent ces exigences. La solution doit réduire le nombre d'attributions de stratégies et d'exemptions.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Assign the policies to the Woodgrove management group", fr: "Attribuer les stratégies au groupe d'administration Woodgrove" } }
    - { id: b, text: { en: "Assign the policies to the Landing zones management group", fr: "Attribuer les stratégies au groupe d'administration Landing zones" } }
    - { id: c, text: { en: "Assign the policies to the Corp and Online management groups", fr: "Attribuer les stratégies aux groupes d'administration Corp et Online" } }
    - { id: d, text: { en: "Assign the policies to each subscription under Landing zones", fr: "Attribuer les stratégies à chaque abonnement sous Landing zones" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the Azure landing zone reference architecture, the policies that prevent IP forwarding and inbound RDP from the internet apply to the online and corporate-connected landing zones. One assignment at the Landing zones management group is inherited by Corp, Online and every future workload subscription below them, and it doesn't reach the Platform management group, so the network virtual appliances keep IP forwarding without an exemption.
    fr: |
      Dans l'architecture de référence des zones d'atterrissage Azure, les stratégies qui empêchent le transfert IP et le RDP entrant depuis Internet s'appliquent aux zones d'atterrissage Online et connectées au réseau d'entreprise. Une seule attribution au groupe d'administration Landing zones est héritée par Corp, Online et chaque futur abonnement de charge de travail placé dessous, et elle n'atteint pas le groupe d'administration Platform : les appliances virtuelles réseau conservent le transfert IP sans exemption.
  options:
    a:
      en: |-
        An assignment at the intermediate root also reaches Platform, so the appliances in Connectivity would need an exemption.
      fr: |-
        Une attribution à la racine intermédiaire atteint aussi Platform : les appliances de Connectivity auraient besoin d'une exemption.
    c:
      en: |-
        Corp and Online together meet the requirement, but with two assignments per policy instead of one.
      fr: |-
        Corp et Online ensemble répondent à l'exigence, mais avec deux attributions par stratégie au lieu d'une.
    d:
      en: |-
        Per-subscription assignments multiply the assignments and don't cover future subscriptions automatically.
      fr: |-
        Des attributions par abonnement multiplient les attributions et ne couvrent pas automatiquement les futurs abonnements.
references:
  - title: Security design in Azure
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/security
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
