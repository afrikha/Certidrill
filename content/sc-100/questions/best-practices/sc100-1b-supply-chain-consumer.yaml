id: sc100-1b-supply-chain-consumer
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is a logistics company. It doesn't develop software. Its 4,000 Windows devices and 300 Windows servers run line-of-business applications from several independent software vendors, and these applications update themselves automatically.

    A security bulletin reports that a vendor in the same industry had its update infrastructure compromised, and that the malicious update was signed with the vendor's certificate.

    You need to recommend controls, applied in the Fabrikam environment, that follow Microsoft's guidance for organizations against this type of supply chain attack.

    Which two controls should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. est une entreprise de logistique. Elle ne développe pas de logiciels. Ses 4 000 appareils Windows et 300 serveurs Windows exécutent des applications métier de plusieurs éditeurs indépendants, et ces applications se mettent à jour automatiquement.

    Un bulletin de sécurité indique que l'infrastructure de mise à jour d'un éditeur du même secteur a été compromise et que la mise à jour malveillante était signée avec le certificat de l'éditeur.

    Vous devez recommander des contrôles, appliqués dans l'environnement de Fabrikam, qui suivent les recommandations de Microsoft destinées aux organisations contre ce type d'attaque de la chaîne d'approvisionnement.

    Quels sont les deux contrôles que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy code integrity policies that allow only authorized applications to run", fr: "Déployer des stratégies d'intégrité du code qui n'autorisent que les applications approuvées" } }
    - { id: b, text: { en: "Require TLS with certificate pinning on the vendors' update channels", fr: "Exiger TLS avec épinglage de certificat sur les canaux de mise à jour des éditeurs" } }
    - { id: c, text: { en: "Deploy an EDR solution that automatically detects and remediates suspicious activity", fr: "Déployer une solution EDR qui détecte et corrige automatiquement les activités suspectes" } }
    - { id: d, text: { en: "Disable automatic updates for all third-party applications", fr: "Désactiver les mises à jour automatiques de toutes les applications tierces" } }
    - { id: e, text: { en: "Add the vendors' domains as seeds in Microsoft Defender EASM", fr: "Ajouter les domaines des éditeurs comme graines dans Microsoft Defender EASM" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      Microsoft's guidance for organizations against supply chain attacks is to deploy strong code integrity policies so that only authorized apps run, and to use endpoint detection and response that automatically detects and remediates suspicious activities. Because a signed malicious update still behaves maliciously, EDR detection on the endpoints is what catches it after it runs.
    fr: |-
      Les recommandations de Microsoft aux organisations contre les attaques de la chaîne d'approvisionnement sont de déployer des stratégies d'intégrité du code strictes pour que seules les applications autorisées s'exécutent, et d'utiliser une solution de détection et de réponse des points de terminaison (EDR) qui détecte et corrige automatiquement les activités suspectes. Une mise à jour malveillante signée garde un comportement malveillant : c'est la détection EDR sur les points de terminaison qui l'intercepte après son exécution.
  options:
    b:
      en: |-
        Certificate pinning and TLS on update channels are recommendations for software vendors, who build the updaters; Fabrikam doesn't control them.
      fr: |-
        L'épinglage de certificat et TLS sur les canaux de mise à jour sont des recommandations pour les éditeurs, qui construisent les programmes de mise à jour ; Fabrikam ne les contrôle pas.
    d:
      en: |-
        Disabling updates leaves known vulnerabilities unpatched and adds a larger risk than it removes.
      fr: |-
        Désactiver les mises à jour laisse des vulnérabilités connues sans correctif et ajoute un risque plus grand que celui qu'elle supprime.
    e:
      en: |-
        Defender EASM discovers the organization's own internet-facing assets; it doesn't inspect the vendors' software or updates.
      fr: |-
        Defender EASM découvre les ressources exposées sur Internet de l'organisation elle-même ; il n'inspecte ni les logiciels ni les mises à jour des éditeurs.
references:
  - title: Supply chain attacks - Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/malware/supply-chain-malware
