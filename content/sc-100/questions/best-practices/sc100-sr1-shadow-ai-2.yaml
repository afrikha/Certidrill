stem:
  en: You recommend AI security posture management in Microsoft Defender for Cloud.
  fr: Vous recommandez la gestion de la posture de sécurité de l'IA dans Microsoft Defender for Cloud.
body:
  solution:
    en: |
      You recommend enabling the **Defender Cloud Security Posture Management (CSPM)** plan on the Azure subscriptions and on an AWS connector, and using **AI security posture management** to build the AI bill of materials and to remediate the recommendations it raises.
    fr: |
      Vous recommandez d'activer le plan **Defender Cloud Security Posture Management (CSPM)** sur les abonnements Azure et sur un connecteur AWS, et d'utiliser la **gestion de la posture de sécurité de l'IA** pour établir la nomenclature d'IA (AI BOM) et corriger les recommandations qu'elle produit.
answer: { value: false }
explanation:
  correct:
    en: AI security posture management discovers the AI workloads that Litware deploys, such as Azure OpenAI, Microsoft Foundry, Azure Machine Learning, and Amazon Bedrock, and assesses their configuration. It doesn't see the public generative AI websites that employees open from their devices, and it can't block them. The Defender CSPM plan is also not covered by the Microsoft 365 E5 licenses.
    fr: "La gestion de la posture de sécurité de l'IA découvre les charges de travail d'IA que Litware déploie, comme Azure OpenAI, Microsoft Foundry, Azure Machine Learning et Amazon Bedrock, et évalue leur configuration. Elle ne voit pas les sites web publics d'IA générative que les employés ouvrent depuis leurs appareils et ne peut pas les bloquer. Le plan Defender CSPM n'est pas non plus couvert par les licences Microsoft 365 E5."
references:
  - title: Overview - AI security posture management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture
