id: sc100-1b-zt-breach-tracks
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    After a ransomware attack at a competitor, the board of Tailspin Toys asks the CISO for a Zero Trust plan that limits the damage of a future breach and helps the company recover quickly. The CISO chooses the Prevent or reduce business damage from a breach business scenario of the Zero Trust adoption framework.

    The scenario divides the work into two implementation tracks that separate IT groups can run in parallel.

    Which two tracks should the plan include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Après une attaque par rançongiciel chez un concurrent, le conseil d'administration de Tailspin Toys demande au RSSI un plan Confiance Zéro qui limite les dégâts d'une future violation et aide l'entreprise à récupérer rapidement. Le RSSI choisit le scénario métier Prevent or reduce business damage from a breach du framework d'adoption de la Confiance Zéro.

    Le scénario divise le travail en deux parcours de mise en œuvre que des groupes informatiques distincts peuvent mener en parallèle.

    Quels sont les deux parcours que le plan doit inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Threat protection and extended detection and response (XDR)", fr: "Protection contre les menaces et détection et réponse étendues (XDR)" } }
    - { id: b, text: { en: "Data discovery, classification and labeling", fr: "Découverte, classification et étiquetage des données" } }
    - { id: c, text: { en: "Regulatory requirement mapping and compliance reporting", fr: "Mappage des exigences réglementaires et rapports de conformité" } }
    - { id: d, text: { en: "Security breach prevention and recovery infrastructure", fr: "Infrastructure de prévention des violations de sécurité et de récupération" } }
    - { id: e, text: { en: "Device registration and remote access for hybrid workers", fr: "Inscription des appareils et accès à distance pour les travailleurs hybrides" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      The Prevent or reduce business damage from a breach scenario has two implementation tracks, security breach prevention and recovery infrastructure, and threat protection and XDR. They need different IT groups and can run in parallel, and they apply the assume breach principle by limiting the blast radius and improving detection and response.
    fr: |-
      Le scénario Prevent or reduce business damage from a breach comporte deux parcours de mise en œuvre : l'infrastructure de prévention des violations de sécurité et de récupération, et la protection contre les menaces et le XDR. Ils mobilisent des groupes informatiques différents et peuvent être menés en parallèle, et ils appliquent le principe Supposer une violation en limitant le rayon d'impact et en améliorant la détection et la réponse.
  options:
    b:
      en: |-
        Discovering and labeling data belongs to the Identify and protect sensitive business data scenario.
      fr: |-
        La découverte et l'étiquetage des données relèvent du scénario Identify and protect sensitive business data.
    c:
      en: |-
        Mapping regulations to controls belongs to the Meet regulatory and compliance requirements scenario.
      fr: |-
        Le mappage des réglementations aux contrôles relève du scénario Meet regulatory and compliance requirements.
    e:
      en: |-
        Device registration and remote access belong to the Secure remote and hybrid work scenario.
      fr: |-
        L'inscription des appareils et l'accès à distance relèvent du scénario Secure remote and hybrid work.
references:
  - title: Prevent or reduce business damage from a breach with Zero Trust
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/prevent-reduce-business-damage-breach
