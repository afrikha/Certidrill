id: sc100-1b-threat-sources-map
objective: "1.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft 365 E5, Azure and Azure DevOps. The CISO lists four threats to address in the security architecture.

    You need to recommend a Microsoft solution for each threat.

    Which solution should you recommend for each threat? To answer, drag the appropriate solutions to the correct threats. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft 365 E5, Azure et Azure DevOps. Le RSSI liste quatre menaces à traiter dans l'architecture de sécurité.

    Vous devez recommander une solution Microsoft pour chaque menace.

    Quelle solution devez-vous recommander pour chaque menace ? Pour répondre, faites glisser les solutions appropriées vers les menaces correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: irm, text: Microsoft Purview Insider Risk Management }
    - { id: easm, text: Microsoft Defender External Attack Surface Management }
    - { id: idp, text: Microsoft Entra ID Protection }
    - { id: ghas, text: { en: "GitHub Advanced Security for Azure DevOps dependency scanning", fr: "Analyse des dépendances de GitHub Advanced Security for Azure DevOps" } }
    - { id: iot, text: Microsoft Defender for IoT }
    - { id: mdo, text: Microsoft Defender for Office 365 }
  targets:
    - id: t1
      text: { en: "An employee who resigned downloads large volumes of files from SharePoint Online before leaving", fr: "Un employé démissionnaire télécharge de gros volumes de fichiers depuis SharePoint Online avant son départ" }
    - id: t2
      text: { en: "The domains and IP ranges of a recently acquired subsidiary are unknown to the security team", fr: "Les domaines et les plages d'adresses IP d'une filiale récemment acquise sont inconnus de l'équipe de sécurité" }
    - id: t3
      text: { en: "An open-source package used by an in-house application has a published vulnerability", fr: "Un package open source utilisé par une application interne présente une vulnérabilité publiée" }
    - id: t4
      text: { en: "A user's credentials are used to sign in from an anonymous IP address", fr: "Les informations d'identification d'un utilisateur servent à se connecter depuis une adresse IP anonyme" }
answer:
  mapping: { t1: irm, t2: easm, t3: ghas, t4: idp }
explanation:
  correct:
    en: |-
      The departing employee is an insider risk, handled by Insider Risk Management. Unknown internet-facing assets are an external attack surface, discovered from seeds by Defender EASM. A vulnerable open-source dependency is a software supply chain risk, found by dependency scanning in the pipeline. A sign-in from an anonymous IP address is an identity risk detected by ID Protection.
    fr: |-
      L'employé sur le départ représente un risque interne, traité par Insider Risk Management. Des ressources exposées sur Internet inconnues forment une surface d'attaque externe, découverte à partir de graines par Defender EASM. Une dépendance open source vulnérable est un risque de la chaîne d'approvisionnement logicielle, détecté par l'analyse des dépendances dans le pipeline. Une connexion depuis une adresse IP anonyme est un risque d'identité détecté par ID Protection.
  options:
    iot:
      en: |-
        Defender for IoT protects IoT and OT devices; none of the threats involves them.
      fr: |-
        Defender for IoT protège les appareils IoT et OT ; aucune des menaces ne les concerne.
    mdo:
      en: |-
        Defender for Office 365 protects email and collaboration against phishing and malware; it doesn't cover these four threats.
      fr: |-
        Defender for Office 365 protège la messagerie et la collaboration contre l'hameçonnage et les programmes malveillants ; il ne couvre pas ces quatre menaces.
references:
  - title: Defender EASM Overview
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview
  - title: Set up dependency scanning for GitHub Advanced Security - Azure Repos
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-dependency-scanning
