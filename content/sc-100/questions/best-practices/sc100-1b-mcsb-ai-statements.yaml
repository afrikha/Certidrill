id: sc100-1b-mcsb-ai-statements
objective: "1.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. is writing internal AI security standards based on the artificial intelligence security domain of the Microsoft cloud security benchmark (MCSB). A draft of the standards contains the following statements.

    For each of the following statements, select **Yes** if the statement is consistent with the MCSB. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. rédige des normes internes de sécurité de l'IA fondées sur le domaine Sécurité de l'intelligence artificielle du Microsoft cloud security benchmark (MCSB). Un brouillon des normes contient les affirmations suivantes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est conforme au MCSB. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Each AI agent receives its own identity instead of sharing the credentials of another application.
        fr: |-
          Chaque agent d'IA reçoit sa propre identité au lieu de partager les informations d'identification d'une autre application.
    - id: s2
      text:
        en: |-
          A human reviewer approves every response generated by the models before it reaches a user.
        fr: |-
          Un réviseur humain approuve chaque réponse générée par les modèles avant qu'elle n'atteigne un utilisateur.
    - id: s3
      text:
        en: |-
          AI red teaming runs in the CI/CD pipelines, so that tests are repeated when models or prompts change.
        fr: |-
          Le red teaming de l'IA s'exécute dans les pipelines CI/CD, pour que les tests soient répétés quand les modèles ou les prompts changent.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      AI-4 gives each agent a separate identity, such as Microsoft Entra Agent ID, with scoped and short-lived access. AI-5 applies human review to critical actions (external data transfers, sensitive data processing, high-impact decisions) and recommends selective review to avoid reviewer fatigue, not approval of every response. AI-7 recommends embedding red teaming in CI/CD and running it on a regular cadence.
    fr: |-
      AI-4 donne à chaque agent une identité distincte, comme Microsoft Entra Agent ID, avec un accès limité et de courte durée. AI-5 applique la revue humaine aux actions critiques (transferts de données externes, traitement de données sensibles, décisions à fort impact) et recommande une revue sélective pour éviter la lassitude des réviseurs, pas l'approbation de chaque réponse. AI-7 recommande d'intégrer le red teaming au CI/CD et de l'exécuter à un rythme régulier.
references:
  - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security
