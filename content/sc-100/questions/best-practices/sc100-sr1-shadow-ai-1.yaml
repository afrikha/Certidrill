stem:
  en: You recommend Cloud Discovery in Defender for Cloud Apps with Defender for Endpoint enforcement.
  fr: Vous recommandez Cloud Discovery dans Defender for Cloud Apps avec l'application par Defender for Endpoint.
body:
  solution:
    en: |
      You recommend integrating **Microsoft Defender for Cloud Apps** with Defender for Endpoint for Cloud Discovery. The security team reviews the discovered apps of the **Generative AI** category and their risk scores in the cloud app catalog, and tags the apps it doesn't approve as **Unsanctioned**. **Enforce app access** and custom network indicators are enabled, and network protection runs in block mode on the devices.
    fr: |
      Vous recommandez d'intégrer **Microsoft Defender for Cloud Apps** à Defender for Endpoint pour Cloud Discovery. L'équipe de sécurité examine les applications découvertes de la catégorie **Generative AI** et leurs scores de risque dans le catalogue d'applications cloud, et marque les applications qu'elle n'approuve pas comme **Unsanctioned**. **Enforce app access** et les indicateurs réseau personnalisés sont activés, et la protection du réseau s'exécute en mode blocage sur les appareils.
answer: { value: true }
explanation:
  correct:
    en: Defender for Endpoint sends the traffic of every onboarded device to Cloud Discovery, wherever the device is. The cloud app catalog scores each app on general, security, compliance, and legal factors and has a Generative AI category. Unsanctioned apps are synced to Defender for Endpoint, and network protection blocks their domains on the devices; Microsoft 365 E5 includes both products.
    fr: "Defender for Endpoint envoie à Cloud Discovery le trafic de chaque appareil intégré, où qu'il se trouve. Le catalogue d'applications cloud attribue à chaque application un score selon des facteurs généraux, de sécurité, de conformité et juridiques, et comporte une catégorie Generative AI. Les applications Unsanctioned sont synchronisées avec Defender for Endpoint, et la protection du réseau bloque leurs domaines sur les appareils ; Microsoft 365 E5 inclut les deux produits."
references:
  - title: Cloud app catalog and risk scores
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/risk-score
  - title: Govern discovered apps using Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/mde-govern
