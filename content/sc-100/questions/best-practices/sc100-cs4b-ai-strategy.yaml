id: sc100-cs4b-ai-strategy
objective: "1.3.1"
type: single
caseStudy: sc100-cs4b-adatum-university
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend the Microsoft guidance on which to base the strategy that meets the AI strategy requirements.

    What should you recommend?
  fr: |
    Vous devez recommander les recommandations Microsoft sur lesquelles fonder la stratégie qui respecte les exigences relatives à la stratégie d'IA.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The artificial intelligence security domain of the Microsoft cloud security benchmark", fr: "Le domaine de sécurité de l'intelligence artificielle du Microsoft cloud security benchmark" } }
    - { id: b, text: { en: "The AI workload guidance of the Azure Well-Architected Framework", fr: "Les recommandations pour les charges de travail d'IA de l'Azure Well-Architected Framework" } }
    - { id: c, text: { en: "The AI capabilities of the Microsoft Cybersecurity Reference Architectures", fr: "Les fonctionnalités d'IA des Microsoft Cybersecurity Reference Architectures" } }
    - { id: d, text: { en: "The AI adoption guidance of the Cloud Adoption Framework for Azure", fr: "Les recommandations d'adoption de l'IA du Cloud Adoption Framework pour Azure" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Cloud Adoption Framework AI adoption guidance is an organization-wide process: AI planning turns use cases into a plan for production, AI ready fits AI workloads into the Azure landing zone, and the govern, secure and manage steps set the standards. It also advises approving the solution with the least operational responsibility, such as a SaaS platform before Azure platforms or infrastructure.
    fr: |-
      Les recommandations d'adoption de l'IA du Cloud Adoption Framework décrivent un processus à l'échelle de l'organisation : la planification de l'IA transforme les cas d'usage en plan de mise en production, l'étape AI ready intègre les charges de travail d'IA dans la zone d'atterrissage Azure, et les étapes de gouvernance, de sécurisation et de gestion fixent les standards. Elles recommandent aussi d'approuver la solution qui implique la plus faible responsabilité opérationnelle, par exemple une plateforme SaaS avant les plateformes ou l'infrastructure Azure.
  options:
    a:
      en: |-
        The benchmark's AI domain lists the controls that a secure AI design must meet; it doesn't define an adoption process from planning to production.
      fr: |-
        Le domaine IA du benchmark énumère les contrôles qu'une conception d'IA sécurisée doit respecter ; il ne définit pas de processus d'adoption, de la planification à la production.
    b:
      en: |-
        The Well-Architected Framework guides the design of one workload; it isn't the organization-wide strategy that adapts the landing zone and sets common standards.
      fr: |-
        Le Well-Architected Framework guide la conception d'une charge de travail ; ce n'est pas la stratégie à l'échelle de l'organisation qui adapte la zone d'atterrissage et fixe des standards communs.
    c:
      en: |-
        The reference architectures show Microsoft security capabilities and how they integrate; they don't organize the adoption of AI.
      fr: |-
        Les architectures de référence montrent les fonctionnalités de sécurité de Microsoft et leur intégration ; elles n'organisent pas l'adoption de l'IA.
references:
  - title: AI adoption
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/
