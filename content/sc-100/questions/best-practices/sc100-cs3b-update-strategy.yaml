id: sc100-cs3b-update-strategy
objective: "1.1.4"
type: single
caseStudy: sc100-cs3b-fabrikam-freight
difficulty: 1
status: draft
stem:
  en: |
    The servers are onboarded to Azure as recommended. You need to recommend a solution that meets the security update requirements.

    What should you recommend?
  fr: |
    Les serveurs sont intégrés à Azure comme recommandé. Vous devez recommander une solution qui respecte les exigences relatives aux mises à jour de sécurité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Windows Server Update Services (WSUS) in Rotterdam, with downstream WSUS servers in AWS, GCP and Azure", fr: "Windows Server Update Services (WSUS) à Rotterdam, avec des serveurs WSUS en aval dans AWS, GCP et Azure" } }
    - { id: b, text: { en: "Microsoft Defender Vulnerability Management security recommendations, reviewed every day by each team", fr: "Les recommandations de sécurité de Microsoft Defender Vulnerability Management, examinées chaque jour par chaque équipe" } }
    - { id: c, text: { en: "Azure Update Manager with periodic assessment and scheduled patching for all the servers", fr: "Azure Update Manager avec l'évaluation périodique et la mise à jour planifiée pour tous les serveurs" } }
    - { id: d, text: { en: "Windows Update rings in Microsoft Intune, assigned to device groups that contain all the servers", fr: "Des anneaux de mise à jour Windows dans Microsoft Intune, attribués à des groupes d'appareils qui contiennent tous les serveurs" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Azure Update Manager manages the updates of Windows and Linux machines in Azure, on-premises and in other clouds connected by Azure Arc, from one service. Periodic assessment checks for missing updates every 24 hours, and scheduled patching installs updates in maintenance windows that you define.
    fr: |-
      Azure Update Manager gère les mises à jour des machines Windows et Linux dans Azure, en local et dans d'autres clouds connectés par Azure Arc, à partir d'un seul service. L'évaluation périodique recherche les mises à jour manquantes toutes les 24 heures, et la mise à jour planifiée installe les mises à jour pendant les fenêtres de maintenance que vous définissez.
  options:
    a:
      en: |-
        WSUS distributes Microsoft updates to Windows machines only. It doesn't cover the Red Hat Enterprise Linux servers.
      fr: |-
        WSUS distribue les mises à jour Microsoft aux machines Windows uniquement. Il ne couvre pas les serveurs Red Hat Enterprise Linux.
    b:
      en: |-
        Security recommendations show missing updates and vulnerabilities, but they don't install updates in maintenance windows.
      fr: |-
        Les recommandations de sécurité indiquent les mises à jour manquantes et les vulnérabilités, mais elles n'installent pas de mises à jour pendant des fenêtres de maintenance.
    d:
      en: |-
        Windows Update rings apply to Windows devices managed by Intune. They don't cover the Linux servers, and they don't replace a server patching service.
      fr: |-
        Les anneaux de mise à jour Windows s'appliquent aux appareils Windows gérés par Intune. Ils ne couvrent pas les serveurs Linux et ne remplacent pas un service de mise à jour des serveurs.
references:
  - title: Azure Update Manager Overview
    url: https://learn.microsoft.com/en-us/azure/update-manager/overview
