id: sc100-1a-update-policy-at-scale
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a management group that contains 40 subscriptions. Application teams create Azure virtual machines every day, and new on-premises servers are onboarded to Azure Arc every week. Azure Update Manager is the chosen update solution.

    The security update strategy requires that every existing and future machine has periodic assessment enabled without any action from the application teams. Non-compliant machines must be visible to the security team. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose d'un groupe d'administration qui contient 40 abonnements. Les équipes applicatives créent chaque jour des machines virtuelles Azure, et de nouveaux serveurs locaux sont intégrés à Azure Arc chaque semaine. Azure Update Manager est la solution de mise à jour retenue.

    La stratégie de mises à jour de sécurité exige que chaque machine existante et future ait l'évaluation périodique activée sans aucune action des équipes applicatives. Les machines non conformes doivent être visibles par l'équipe de sécurité. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Automation runbook that an Event Grid subscription runs each time a machine is created", fr: "Un runbook Automation qu'un abonnement Event Grid exécute chaque fois qu'une machine est créée" } }
    - { id: b, text: { en: "A dynamic scope in each subscription that targets all the machines of the subscription", fr: "Une étendue dynamique dans chaque abonnement qui cible toutes les machines de l'abonnement" } }
    - { id: c, text: { en: "A device group in Defender Vulnerability Management that includes all the servers", fr: "Un groupe d'appareils dans Defender Vulnerability Management qui inclut tous les serveurs" } }
    - { id: d, text: { en: "An Azure Policy assignment for periodic assessment at the management group, with remediation", fr: "Une attribution Azure Policy pour l'évaluation périodique au niveau du groupe d'administration, avec correction" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Update Manager supports Azure Policy for automated assessment at scale. A policy assigned at the management group applies to every subscription and every new Azure VM or Arc-enabled server, remediation enables periodic assessment on existing machines, and the compliance view shows the machines that don't comply, without custom code.
    fr: |
      Azure Update Manager prend en charge Azure Policy pour l'évaluation automatisée à grande échelle. Une stratégie attribuée au groupe d'administration s'applique à chaque abonnement et à chaque nouvelle VM Azure ou nouveau serveur Arc, la correction active l'évaluation périodique sur les machines existantes, et la vue de conformité montre les machines non conformes, sans code personnalisé.
  options:
    a:
      en: |-
        A runbook triggered by events can work, but it is custom code to build and maintain across 40 subscriptions, and it doesn't report compliance.
      fr: |-
        Un runbook déclenché par des événements peut fonctionner, mais c'est du code personnalisé à créer et à maintenir sur 40 abonnements, et il ne rend pas compte de la conformité.
    b:
      en: |-
        A dynamic scope selects machines for a patching schedule; it doesn't enable periodic assessment, and one scope per subscription adds effort.
      fr: |-
        Une étendue dynamique sélectionne des machines pour un calendrier de mise à jour ; elle n'active pas l'évaluation périodique, et une étendue par abonnement ajoute de l'effort.
    c:
      en: |-
        Device groups organize devices in Defender Vulnerability Management; they don't configure the update assessment of Azure Update Manager.
      fr: |-
        Les groupes d'appareils organisent les appareils dans Defender Vulnerability Management ; ils ne configurent pas l'évaluation des mises à jour d'Azure Update Manager.
references:
  - title: What is Azure Update Manager?
    url: https://learn.microsoft.com/en-us/azure/update-manager/overview
