stem:
  en: |
    You recommend the Microsoft Cybersecurity Reference Architectures (MCRA).
  fr: |
    Vous recommandez les Microsoft Cybersecurity Reference Architectures (MCRA).
body:
  solution:
    en: |
      You recommend that the program be based on the **Microsoft Cybersecurity Reference Architectures (MCRA)**, starting from their Zero Trust user access diagram.
    fr: |
      Vous recommandez de fonder le programme sur les **Microsoft Cybersecurity Reference Architectures (MCRA)**, en partant de leur diagramme de l'accès utilisateur Confiance Zéro.
answer: { value: false }
explanation:
  correct:
    en: |
      The MCRA are technical reference architectures that show which Microsoft security capabilities exist and how they fit together. They help design the target architecture, but they don't organize a program around business scenarios, and they don't provide lifecycle phases or progress trackers. That is the role of the Zero Trust adoption framework.
    fr: |
      Les MCRA sont des architectures de référence techniques qui montrent quelles capacités de sécurité Microsoft existent et comment elles s'assemblent. Elles aident à concevoir l'architecture cible, mais elles n'organisent pas un programme autour de scénarios métier et ne fournissent ni phases de cycle de vie ni outils de suivi de l'avancement. C'est le rôle du framework d'adoption de la Confiance Zéro.
references:
  - title: Microsoft Cybersecurity Reference Architectures (MCRA)
    url: https://learn.microsoft.com/en-us/security/adoption/mcra
  - title: Zero Trust adoption framework overview
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/zero-trust-adoption-overview
