id: sc100-1a-backup-feature-mapping
objective: "1.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys protects its Azure virtual machines with a geo-redundant Recovery Services vault. The security team defined four requirements for the backup design.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys protège ses machines virtuelles Azure avec un coffre Recovery Services géoredondant. L'équipe de sécurité a défini quatre exigences pour la conception des sauvegardes.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: soft, text: { en: "Soft delete", fr: "Suppression réversible" } }
    - { id: locked, text: { en: "Immutable vault, enabled and locked", fr: "Coffre immuable, activé et verrouillé" } }
    - { id: mua, text: { en: "Multi-user authorization with a Resource Guard", fr: "Autorisation multi-utilisateur avec un Resource Guard" } }
    - { id: crr, text: { en: "Cross Region Restore", fr: "Restauration interrégion" } }
    - { id: asr, text: Azure Site Recovery }
    - { id: lock, text: { en: "Delete resource lock", fr: "Verrou de ressource Suppression" } }
  targets:
    - id: t1
      text: { en: "Recover backup data that an administrator deleted five days ago", fr: "Récupérer des données de sauvegarde qu'un administrateur a supprimées il y a cinq jours" }
    - id: t2
      text: { en: "Irreversibly block any reduction of the retention of recovery points", fr: "Bloquer de façon irréversible toute réduction de la rétention des points de récupération" }
    - id: t3
      text: { en: "Require approval from the security team before soft delete can be disabled", fr: "Exiger l'approbation de l'équipe de sécurité avant que la suppression réversible puisse être désactivée" }
    - id: t4
      text: { en: "Restore VMs from backups in the paired region without waiting for Microsoft to declare a disaster", fr: "Restaurer des VM à partir des sauvegardes dans la région jumelée sans attendre que Microsoft déclare un sinistre" }
answer:
  mapping: { t1: soft, t2: locked, t3: mua, t4: crr }
explanation:
  correct:
    en: |
      Soft delete keeps deleted backup data recoverable for 14 days by default. An immutable vault that is enabled and locked blocks retention reductions, and the locked state can't be reversed. Multi-user authorization makes critical operations, including disabling soft delete, depend on a Resource Guard that another team controls. Cross Region Restore restores Azure VMs in the paired region on demand, unlike the vault's GRS failover, which waits for Azure to declare a disaster.
    fr: |
      La suppression réversible garde les données de sauvegarde supprimées récupérables 14 jours par défaut. Un coffre immuable activé et verrouillé bloque les réductions de rétention, et l'état verrouillé est irréversible. L'autorisation multi-utilisateur fait dépendre les opérations critiques, dont la désactivation de la suppression réversible, d'un Resource Guard contrôlé par une autre équipe. La restauration interrégion restaure à la demande des VM Azure dans la région jumelée, contrairement au basculement GRS du coffre, qui attend qu'Azure déclare un sinistre.
  options:
    asr:
      en: |-
        Site Recovery replicates and fails over running machines; it doesn't restore from the vault's backups.
      fr: |-
        Site Recovery réplique et bascule des machines en cours d'exécution ; il ne restaure pas à partir des sauvegardes du coffre.
    lock:
      en: |-
        A resource lock doesn't stop retention changes, and the subscription owners can remove it.
      fr: |-
        Un verrou de ressource n'empêche pas les modifications de rétention, et les propriétaires de l'abonnement peuvent le retirer.
references:
  - title: Overview of security and cyber recovery in Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/security-overview
  - title: Backup and restore plan to protect against ransomware
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware
