id: sc100-1c-govern-tools
objective: "1.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. follows the Microsoft Cloud Adoption Framework for Azure (CAF) to enforce its cloud governance policies. The governance team wants to use, for each governance area, the Microsoft tool that the CAF recommends.

    Which tool should you recommend for each governance area? To answer, drag the appropriate tools to the correct governance areas. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. suit le Microsoft Cloud Adoption Framework for Azure (CAF) pour appliquer ses stratégies de gouvernance cloud. L'équipe de gouvernance souhaite utiliser, pour chaque domaine de gouvernance, l'outil Microsoft que recommande le CAF.

    Quel outil devez-vous recommander pour chaque domaine de gouvernance ? Pour répondre, faites glisser les outils appropriés vers les domaines de gouvernance correspondants. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sentinel, text: Microsoft Sentinel }
    - { id: purview, text: Microsoft Purview }
    - { id: advisor, text: Azure Advisor }
    - { id: defender, text: Microsoft Defender for Cloud }
    - { id: costmgmt, text: Microsoft Cost Management }
    - { id: idgov, text: Microsoft Entra ID Governance }
  targets:
    - id: sec
      text: { en: "Security: built-in security policies aligned with the Microsoft cloud security benchmark, NIST SP 800 and CIS", fr: "Sécurité : stratégies de sécurité intégrées alignées sur le benchmark de sécurité cloud Microsoft, NIST SP 800 et CIS" }
    - id: data
      text: { en: "Data: catalog data sources, monitor sensitive data and manage its lifecycle", fr: "Données : cataloguer les sources de données, surveiller les données sensibles et gérer leur cycle de vie" }
    - id: ident
      text: { en: "Identity: access reviews, access request workflows and just-in-time privileged access", fr: "Identité : révisions d'accès, workflows de demande d'accès et accès privilégié juste-à-temps" }
    - id: cost
      text: { en: "Cost: create budgets and identify spending anomalies", fr: "Coûts : créer des budgets et identifier les anomalies de dépenses" }
answer:
  mapping: { sec: defender, data: purview, ident: idgov, cost: costmgmt }
explanation:
  correct:
    en: |
      The CAF names Defender for Cloud for security governance, with built-in policies aligned with NIST, CIS and the Microsoft cloud security benchmark. Microsoft Purview covers data governance, including cataloging, sensitive data monitoring and lifecycle management. Microsoft Entra ID Governance provides access reviews, access requests and Privileged Identity Management, and Cost Management provides budgets and anomaly detection.
    fr: |
      Le CAF désigne Defender for Cloud pour la gouvernance de la sécurité, avec des stratégies intégrées alignées sur NIST, CIS et le benchmark de sécurité cloud Microsoft. Microsoft Purview couvre la gouvernance des données, notamment le catalogage, la surveillance des données sensibles et la gestion du cycle de vie. Microsoft Entra ID Governance fournit les révisions d'accès, les demandes d'accès et Privileged Identity Management, et Cost Management fournit les budgets et la détection des anomalies.
  options:
    sentinel: { en: "Microsoft Sentinel is a SIEM and SOAR for detection and response, not a governance enforcement tool.", fr: "Microsoft Sentinel est un SIEM et un SOAR de détection et de réponse, pas un outil d'application de la gouvernance." }
    advisor: { en: "Azure Advisor gives recommendations, such as idle resources, but budgets and anomaly detection are Cost Management features.", fr: "Azure Advisor fournit des recommandations, comme les ressources inactives, mais les budgets et la détection des anomalies sont des fonctionnalités de Cost Management." }
references:
  - title: Enforce cloud governance policies
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/enforce-cloud-governance-policies
  - title: Monitor cloud compliance
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/monitor-cloud-governance
