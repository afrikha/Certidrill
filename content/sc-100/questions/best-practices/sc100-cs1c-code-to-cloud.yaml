id: sc100-cs1c-code-to-cloud
objective: "1.3.5"
type: multi
caseStudy: sc100-cs1c-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that meets the DevSecOps requirements.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution qui respecte les exigences DevSecOps.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Connect the wingtip organization to Defender for Cloud by using a GitHub connector", fr: "Connecter l'organisation wingtip à Defender for Cloud au moyen d'un connecteur GitHub" } }
    - { id: b, text: { en: "Connect the wingtip organization to Microsoft Sentinel by using the GitHub data connector", fr: "Connecter l'organisation wingtip à Microsoft Sentinel au moyen du connecteur de données GitHub" } }
    - { id: c, text: { en: "Enable the Defender CSPM plan on Sub-Games", fr: "Activer le plan Defender CSPM sur Sub-Games" } }
    - { id: d, text: { en: "Enable Defender for Servers Plan 2 on Sub-Games", fr: "Activer Defender for Servers Plan 2 sur Sub-Games" } }
    - { id: e, text: { en: "Enable GitHub Advanced Security secret scanning on all the repositories", fr: "Activer l'analyse des secrets de GitHub Advanced Security sur tous les dépôts" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      The DevOps security capabilities of Defender for Cloud start with a connector for the GitHub organization. Code-to-cloud mapping for containers, which links a running image to the repository that built it, and attack path analysis require the paid Defender CSPM plan on a cloud environment in the same tenant as the DevOps connector. The workflows already run the Microsoft Security DevOps action, which is the other prerequisite of the mapping.
    fr: |-
      Les capacités de sécurité DevOps de Defender for Cloud reposent d'abord sur un connecteur pour l'organisation GitHub. Le mappage du code au cloud pour les conteneurs, qui relie une image en cours d'exécution au dépôt qui l'a générée, et l'analyse des chemins d'attaque exigent le plan payant Defender CSPM sur un environnement cloud du même locataire que le connecteur DevOps. Les workflows exécutent déjà l'action Microsoft Security DevOps, qui est l'autre prérequis du mappage.
  options:
    b:
      en: |-
        The Sentinel connector ingests GitHub logs for detection and hunting; it doesn't map container images to their repositories or build attack paths.
      fr: |-
        Le connecteur Sentinel ingère les journaux GitHub pour la détection et la chasse ; il ne relie pas les images conteneur à leurs dépôts et ne construit pas de chemins d'attaque.
    d:
      en: |-
        Defender for Servers protects virtual machines; it doesn't provide code-to-cloud mapping or attack path analysis.
      fr: |-
        Defender for Servers protège les machines virtuelles ; il ne fournit ni le mappage du code au cloud ni l'analyse des chemins d'attaque.
    e:
      en: |-
        Secret scanning produces findings about exposed secrets; it doesn't trace running images back to their repositories.
      fr: |-
        L'analyse des secrets produit des résultats sur les secrets exposés ; elle ne remonte pas des images en cours d'exécution jusqu'à leurs dépôts.
references:
  - title: Support and prerequisites
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
