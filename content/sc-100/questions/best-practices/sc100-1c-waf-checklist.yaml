id: sc100-1c-waf-checklist
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is reviewing the design of a customer portal named Portal1 against the Security pillar of the Azure Well-Architected Framework. Portal1 runs on Azure App Service and stores customer data in Azure SQL Database. The review produced three requirements.

    You need to map each requirement to the recommendation of the Security design review checklist that it implements.

    Which recommendation should you identify for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders examine la conception d'un portail client nommé Portal1 par rapport au pilier Sécurité de l'Azure Well-Architected Framework. Portal1 s'exécute sur Azure App Service et stocke les données des clients dans Azure SQL Database. La revue a produit trois exigences.

    Vous devez associer chaque exigence à la recommandation de la liste de contrôle de la revue de conception de sécurité qu'elle met en œuvre.

    Quelle recommandation devez-vous identifier pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Store the database connection strings outside the code, restrict and audit access to them, and rotate them on a schedule and in an emergency: [[r1]]

      Apply sensitivity labels to the data stores of Portal1 so that the labels drive the protection priorities: [[r2]]

      Simulate attacks regularly to confirm that the detection mechanisms raise the expected alerts: [[r3]]
    fr: |
      Stocker les chaînes de connexion de la base de données en dehors du code, restreindre et auditer leur accès, et les renouveler selon un calendrier et en urgence : [[r1]]

      Appliquer des étiquettes de confidentialité aux magasins de données de Portal1 afin qu'elles orientent les priorités de protection : [[r2]]

      Simuler régulièrement des attaques pour vérifier que les mécanismes de détection déclenchent les alertes attendues : [[r3]]
  slots:
    - id: r1
      options:
        - { id: se03, text: { en: "SE:03 Classify and label data and systems", fr: "SE:03 Classifier et étiqueter les données et les systèmes" } }
        - { id: se07, text: { en: "SE:07 Encrypt data with modern methods", fr: "SE:07 Chiffrer les données avec des méthodes modernes" } }
        - { id: se09, text: { en: "SE:09 Protect application secrets", fr: "SE:09 Protéger les secrets d'application" } }
        - { id: se10, text: { en: "SE:10 Implement holistic monitoring and threat detection", fr: "SE:10 Mettre en œuvre une surveillance globale et la détection des menaces" } }
        - { id: se11, text: { en: "SE:11 Establish a comprehensive testing regimen", fr: "SE:11 Établir un programme de tests complet" } }
    - id: r2
      options:
        - { id: se03, text: { en: "SE:03 Classify and label data and systems", fr: "SE:03 Classifier et étiqueter les données et les systèmes" } }
        - { id: se07, text: { en: "SE:07 Encrypt data with modern methods", fr: "SE:07 Chiffrer les données avec des méthodes modernes" } }
        - { id: se09, text: { en: "SE:09 Protect application secrets", fr: "SE:09 Protéger les secrets d'application" } }
        - { id: se10, text: { en: "SE:10 Implement holistic monitoring and threat detection", fr: "SE:10 Mettre en œuvre une surveillance globale et la détection des menaces" } }
        - { id: se11, text: { en: "SE:11 Establish a comprehensive testing regimen", fr: "SE:11 Établir un programme de tests complet" } }
    - id: r3
      options:
        - { id: se03, text: { en: "SE:03 Classify and label data and systems", fr: "SE:03 Classifier et étiqueter les données et les systèmes" } }
        - { id: se07, text: { en: "SE:07 Encrypt data with modern methods", fr: "SE:07 Chiffrer les données avec des méthodes modernes" } }
        - { id: se09, text: { en: "SE:09 Protect application secrets", fr: "SE:09 Protéger les secrets d'application" } }
        - { id: se10, text: { en: "SE:10 Implement holistic monitoring and threat detection", fr: "SE:10 Mettre en œuvre une surveillance globale et la détection des menaces" } }
        - { id: se11, text: { en: "SE:11 Establish a comprehensive testing regimen", fr: "SE:11 Établir un programme de tests complet" } }
answer:
  values: { r1: se09, r2: se03, r3: se11 }
explanation:
  correct:
    en: |
      SE:09 covers application secrets: hardened storage, restricted and audited access, and a regular rotation process that can also rotate in an emergency. SE:03 asks to classify and label all workload data and systems and to let the classification drive design and security priorities. SE:11 is a testing regimen that prevents issues, validates threat prevention and tests the threat detection mechanisms, which is what an attack simulation does.
    fr: |
      SE:09 couvre les secrets d'application : stockage renforcé, accès restreint et audité, et processus de rotation régulier capable aussi de renouveler en urgence. SE:03 demande de classifier et d'étiqueter toutes les données et tous les systèmes de la charge de travail, et de laisser la classification orienter la conception et les priorités de sécurité. SE:11 est un programme de tests qui prévient les problèmes, valide la prévention des menaces et teste les mécanismes de détection, ce que fait une simulation d'attaque.
  options:
    se10:
      en: SE:10 designs the monitoring and detection strategy itself; verifying that detections fire under simulated attacks belongs to the testing regimen.
      fr: SE:10 conçoit la stratégie de surveillance et de détection elle-même ; vérifier que les détections se déclenchent lors d'attaques simulées relève du programme de tests.
    se07:
      en: SE:07 is about encrypting data; it doesn't cover secret storage and rotation or classification.
      fr: SE:07 porte sur le chiffrement des données ; il ne couvre ni le stockage et la rotation des secrets, ni la classification.
references:
  - title: Design review checklist for Security
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/checklist
