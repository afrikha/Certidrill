id: sc100-1b-mcsb-ai-jailbreak
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank deploys a generative AI chatbot for customers. The chatbot retrieves product documents and answers questions. During a pilot, testers made the chatbot ignore its instructions by pasting crafted text into their questions and by uploading documents that contain hidden instructions.

    You need to recommend controls from the Microsoft cloud security benchmark (MCSB) that stop these manipulations at run time, before the model acts on them.

    Which two controls should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank déploie un chatbot d'IA générative pour ses clients. Le chatbot récupère des documents produits et répond aux questions. Pendant un pilote, des testeurs ont fait ignorer ses instructions au chatbot en collant un texte construit dans leurs questions et en chargeant des documents qui contiennent des instructions cachées.

    Vous devez recommander des contrôles du Microsoft cloud security benchmark (MCSB) qui arrêtent ces manipulations à l'exécution, avant que le modèle n'agisse en conséquence.

    Quels sont les deux contrôles que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "AI-1: Ensure use of approved models" }
    - { id: b, text: "AI-2: Implement multi-layered content filtering" }
    - { id: c, text: "AI-5: Ensure human-in-the-loop" }
    - { id: d, text: "AI-3: Adopt safety meta-prompts" }
    - { id: e, text: "AI-7: Perform continuous AI red teaming" }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      AI-2 screens inputs for injection and harmful content, for example with Prompt Shields in Azure AI Content Safety, and filters outputs. AI-3 embeds safety meta-prompts in the system context that reject attempts to override instructions, and uses spotlighting to label untrusted data such as retrieved documents. Together they act on each request at run time.
    fr: |-
      AI-2 examine les entrées à la recherche d'injections et de contenu nuisible, par exemple avec Prompt Shields dans Azure AI Content Safety, et filtre les sorties. AI-3 intègre au contexte système des méta-prompts de sécurité qui rejettent les tentatives de contournement des instructions, et utilise le spotlighting pour marquer les données non fiables comme les documents récupérés. Ensemble, ils agissent sur chaque demande à l'exécution.
  options:
    a:
      en: |-
        Approved models address model provenance; an approved model can still be manipulated by prompts.
      fr: |-
        Les modèles approuvés traitent la provenance du modèle ; un modèle approuvé peut toujours être manipulé par des prompts.
    c:
      en: |-
        Human-in-the-loop applies to critical actions such as external transfers; reviewing every chatbot answer isn't the intent and doesn't stop the manipulation.
      fr: |-
        L'humain dans la boucle s'applique aux actions critiques comme les transferts externes ; examiner chaque réponse du chatbot n'est pas l'objectif et n'arrête pas la manipulation.
    e:
      en: |-
        Red teaming finds these weaknesses during testing, but it doesn't block an attack at run time.
      fr: |-
        Le red teaming trouve ces faiblesses pendant les tests, mais il ne bloque pas une attaque à l'exécution.
references:
  - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security
