id: sc100-1c-lz-hierarchy-settings
objective: "1.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has Azure landing zones below an intermediate root management group named Litware, where all the organization-wide policies are assigned. Developers regularly create Visual Studio subscriptions, which appear directly under the tenant root group, outside every landing zone policy. An audit also found that any user in the tenant can create management groups.

    You need to recommend changes that fix both findings. The solution must follow the management group recommendations of the Microsoft Cloud Adoption Framework for Azure (CAF).

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose de zones d'atterrissage Azure sous un groupe d'administration racine intermédiaire nommé Litware, où sont attribuées toutes les stratégies de l'organisation. Les développeurs créent régulièrement des abonnements Visual Studio, qui apparaissent directement sous le groupe racine du locataire, en dehors de toute stratégie de zone d'atterrissage. Un audit a aussi constaté que n'importe quel utilisateur du locataire peut créer des groupes d'administration.

    Vous devez recommander des modifications qui corrigent les deux constats. La solution doit suivre les recommandations du Microsoft Cloud Adoption Framework for Azure (CAF) relatives aux groupes d'administration.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Move the Litware policy assignments to the tenant root group", fr: "Déplacer les attributions de stratégies de Litware vers le groupe racine du locataire" } }
    - { id: b, text: { en: "Set the Sandbox management group as the default management group for new subscriptions", fr: "Définir le groupe d'administration Sandbox comme groupe d'administration par défaut des nouveaux abonnements" } }
    - { id: c, text: { en: "Apply a delete lock (CanNotDelete) to the tenant root group", fr: "Appliquer un verrou Suppression (CanNotDelete) au groupe racine du locataire" } }
    - { id: d, text: { en: "Assign the Reader role to all users at the tenant root group", fr: "Attribuer le rôle Reader à tous les utilisateurs au niveau du groupe racine du locataire" } }
    - { id: e, text: { en: "Enable Azure RBAC authorization in the management group hierarchy settings", fr: "Activer l'autorisation Azure RBAC dans les paramètres de hiérarchie des groupes d'administration" } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      The CAF recommends configuring a default management group for new subscriptions so that none land under the root, which matters most for Visual Studio and MSDN subscriptions; a sandbox management group is a good candidate. By default, any principal in the tenant can create management groups under the root, so the CAF recommends enabling Azure RBAC authorization in the hierarchy settings so that only privileged users can operate management groups.
    fr: |
      Le CAF recommande de configurer un groupe d'administration par défaut pour les nouveaux abonnements afin qu'aucun n'arrive sous la racine, ce qui compte surtout pour les abonnements Visual Studio et MSDN ; un groupe d'administration Sandbox est un bon candidat. Par défaut, tout principal du locataire peut créer des groupes d'administration sous la racine : le CAF recommande donc d'activer l'autorisation Azure RBAC dans les paramètres de hiérarchie, pour que seuls des utilisateurs privilégiés puissent gérer les groupes d'administration.
  options:
    a:
      en: |-
        The CAF advises limiting the policy assignments at the root scope; organization-wide policies stay on the intermediate root.
      fr: |-
        Le CAF conseille de limiter les attributions de stratégies à l'étendue racine ; les stratégies de l'organisation restent sur la racine intermédiaire.
    c:
      en: |-
        Resource locks apply to subscriptions, resource groups and resources, not to management groups, and a lock wouldn't control subscription placement.
      fr: |-
        Les verrous de ressources s'appliquent aux abonnements, aux groupes de ressources et aux ressources, pas aux groupes d'administration, et un verrou ne contrôlerait pas le placement des abonnements.
    d:
      en: |-
        Reader grants visibility; it doesn't stop users from creating management groups or place new subscriptions.
      fr: |-
        Reader accorde la visibilité ; il n'empêche pas les utilisateurs de créer des groupes d'administration et ne place pas les nouveaux abonnements.
references:
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
