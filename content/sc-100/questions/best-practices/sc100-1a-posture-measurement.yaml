id: sc100-1a-posture-measurement
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has Azure subscriptions, AWS and GCP accounts connected to Microsoft Defender for Cloud, and a Microsoft 365 E5 tenant. The CISO wants to align with Microsoft's best practices for security controls and report the posture to the board.

    You need to recommend a solution for each requirement.

    How should you complete the recommendation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'abonnements Azure, de comptes AWS et GCP connectés à Microsoft Defender for Cloud, et d'un locataire Microsoft 365 E5. Le RSSI veut s'aligner sur les bonnes pratiques de Microsoft relatives aux contrôles de sécurité et présenter la posture au conseil d'administration.

    Vous devez recommander une solution pour chaque exigence.

    Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Measure the posture of the Azure, AWS and GCP resources against the Microsoft cloud security benchmark: [[s1]]

      Measure the posture of the Microsoft 365 services, identities and devices: [[s2]]

      Prevent any new storage account from allowing public network access, in line with an MCSB network security control: [[s3]]
    fr: |
      Mesurer la posture des ressources Azure, AWS et GCP par rapport au Microsoft cloud security benchmark : [[s1]]

      Mesurer la posture des services Microsoft 365, des identités et des appareils : [[s2]]

      Empêcher tout nouveau compte de stockage d'autoriser l'accès au réseau public, conformément à un contrôle de sécurité réseau du MCSB : [[s3]]
  slots:
    - id: s1
      options:
        - { id: mss, text: Microsoft Secure Score }
        - { id: dfcss, text: { en: "The Defender for Cloud secure score", fr: "Le degré de sécurisation de Defender for Cloud" } }
        - { id: cap, text: { en: "The Critical Asset Protection initiative", fr: "L'initiative Critical Asset Protection" } }
    - id: s2
      options:
        - { id: dfcss, text: { en: "The Defender for Cloud secure score", fr: "Le degré de sécurisation de Defender for Cloud" } }
        - { id: comp, text: { en: "The compliance score of Microsoft Purview Compliance Manager", fr: "Le score de conformité de Microsoft Purview Compliance Manager" } }
        - { id: mss, text: Microsoft Secure Score }
    - id: s3
      options:
        - { id: rec, text: { en: "A Defender for Cloud security recommendation", fr: "Une recommandation de sécurité de Defender for Cloud" } }
        - { id: deny, text: { en: "An Azure Policy assignment with the Deny effect", fr: "Une attribution Azure Policy avec l'effet Deny" } }
        - { id: dlp, text: { en: "A Microsoft Purview DLP policy", fr: "Une stratégie DLP Microsoft Purview" } }
answer:
  values: { s1: dfcss, s2: mss, s3: deny }
explanation:
  correct:
    en: |
      Defender for Cloud assesses Azure, AWS and GCP resources against the MCSB, which it enables by default, and its secure score reflects those recommendations. Microsoft Secure Score measures the posture of Microsoft 365 services, identities, devices and apps in the Defender portal. The MCSB controls map to built-in Azure Policy definitions, and a Deny assignment blocks non-compliant resources at creation, whereas a recommendation only reports them.
    fr: |
      Defender for Cloud évalue les ressources Azure, AWS et GCP par rapport au MCSB, qu'il active par défaut, et son degré de sécurisation reflète ces recommandations. Microsoft Secure Score mesure la posture des services Microsoft 365, des identités, des appareils et des applications dans le portail Defender. Les contrôles du MCSB correspondent à des définitions Azure Policy intégrées, et une attribution Deny bloque les ressources non conformes à leur création, alors qu'une recommandation ne fait que les signaler.
  options:
    mss:
      en: |-
        Microsoft Secure Score covers Microsoft 365 workloads, identities and devices, not the MCSB assessment of cloud resources.
      fr: |-
        Microsoft Secure Score couvre les charges de travail Microsoft 365, les identités et les appareils, pas l'évaluation MCSB des ressources cloud.
    comp:
      en: |-
        The compliance score measures progress on regulatory and data protection requirements, not the security posture of services and devices.
      fr: |-
        Le score de conformité mesure la progression sur les exigences réglementaires et de protection des données, pas la posture de sécurité des services et des appareils.
    rec:
      en: |-
        A recommendation reports non-compliant resources after they exist; it doesn't prevent their creation.
      fr: |-
        Une recommandation signale les ressources non conformes une fois créées ; elle n'empêche pas leur création.
references:
  - title: Regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
  - title: Overview of Microsoft cloud security benchmark v2 (preview)
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/overview
