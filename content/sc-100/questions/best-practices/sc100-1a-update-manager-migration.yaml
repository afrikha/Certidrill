id: sc100-1a-update-manager-migration
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has 300 Windows Server and Linux servers: 180 Azure virtual machines and 120 on-premises servers connected by Azure Arc. The servers were patched by the legacy Azure Automation Update Management solution, which depended on a Log Analytics workspace and an Automation account.

    You need to recommend a security update solution for all the servers. The solution must assess and install updates from one service and must not depend on a Log Analytics workspace or an Automation account.

    What should you recommend?
  fr: |
    Litware, Inc. dispose de 300 serveurs Windows Server et Linux : 180 machines virtuelles Azure et 120 serveurs locaux connectés par Azure Arc. Les serveurs étaient mis à jour par l'ancienne solution Update Management d'Azure Automation, qui dépendait d'un espace de travail Log Analytics et d'un compte Automation.

    Vous devez recommander une solution de mises à jour de sécurité pour tous les serveurs. La solution doit évaluer et installer les mises à jour à partir d'un seul service et ne doit dépendre ni d'un espace de travail Log Analytics ni d'un compte Automation.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Windows Autopatch }
    - { id: b, text: Azure Automation State Configuration }
    - { id: c, text: Windows Server Update Services (WSUS) }
    - { id: d, text: Azure Update Manager }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Update Manager manages the updates of Windows and Linux machines that run a server operating system, in Azure and on Azure Arc-enabled servers, from a single service. It is native to Azure VMs and Arc-enabled servers and has no dependency on Log Analytics or Azure Automation.
    fr: |
      Azure Update Manager gère les mises à jour des machines Windows et Linux qui exécutent un système d'exploitation serveur, dans Azure et sur les serveurs Azure Arc, à partir d'un seul service. Il est natif sur les VM Azure et les serveurs Arc et ne dépend ni de Log Analytics ni d'Azure Automation.
  options:
    a:
      en: |-
        Windows Autopatch automates updates for Windows client devices, Microsoft 365 Apps, Microsoft Edge and Teams. It doesn't patch Linux servers.
      fr: |-
        Windows Autopatch automatise les mises à jour des appareils clients Windows, de Microsoft 365 Apps, de Microsoft Edge et de Teams. Il ne met pas à jour les serveurs Linux.
    b:
      en: |-
        State Configuration is a configuration management feature of Azure Automation. It doesn't assess and install security updates, and it depends on an Automation account.
      fr: |-
        State Configuration est une fonctionnalité de gestion de configuration d'Azure Automation. Elle n'évalue ni n'installe les mises à jour de sécurité, et elle dépend d'un compte Automation.
    c:
      en: |-
        WSUS distributes Microsoft updates to Windows machines only, so it doesn't cover the Linux servers.
      fr: |-
        WSUS distribue les mises à jour Microsoft aux machines Windows uniquement : il ne couvre pas les serveurs Linux.
references:
  - title: What is Azure Update Manager?
    url: https://learn.microsoft.com/en-us/azure/update-manager/overview
