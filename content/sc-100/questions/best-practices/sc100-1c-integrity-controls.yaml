id: sc100-1c-integrity-controls
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is building its cloud security strategy with the Secure methodology of the Microsoft Cloud Adoption Framework for Azure (CAF), which maps controls to the confidentiality, integrity and availability (CIA) triad. An audit found two gaps: release packages can be altered between the build and the deployment without detection, and administrators can modify the archived audit records.

    You need to recommend controls that close both gaps.

    Which two controls should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank élabore sa stratégie de sécurité cloud avec la méthodologie Secure du Microsoft Cloud Adoption Framework for Azure (CAF), qui associe les contrôles à la triade confidentialité, intégrité et disponibilité (CIA). Un audit a relevé deux lacunes : les packages de mise en production peuvent être modifiés entre le build et le déploiement sans être détectés, et les administrateurs peuvent modifier les enregistrements d'audit archivés.

    Vous devez recommander des contrôles qui comblent les deux lacunes.

    Quels sont les deux contrôles que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply sensitivity labels to the archived audit records", fr: "Appliquer des étiquettes de confidentialité aux enregistrements d'audit archivés" } }
    - { id: b, text: { en: "Sign the release packages and verify the signatures before deployment", fr: "Signer les packages de mise en production et vérifier les signatures avant le déploiement" } }
    - { id: c, text: { en: "Deploy the release pipeline agents across availability zones", fr: "Déployer les agents du pipeline de mise en production dans plusieurs zones de disponibilité" } }
    - { id: d, text: { en: "Store the archived audit records in immutable storage", fr: "Stocker les enregistrements d'audit archivés dans un stockage immuable" } }
    - { id: e, text: { en: "Replicate the archived audit records to a paired region", fr: "Répliquer les enregistrements d'audit archivés vers une région jumelée" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Both gaps are integrity gaps. The CAF Secure methodology maps integrity to controls such as hashing, signing, immutable storage, version control and secure update supply chains. Signing the packages makes any change after the build detectable, and immutable storage prevents anyone, administrators included, from modifying the archived records.
    fr: |
      Les deux lacunes concernent l'intégrité. La méthodologie Secure du CAF associe l'intégrité à des contrôles tels que le hachage, la signature, le stockage immuable, la gestion de versions et des chaînes d'approvisionnement de mises à jour sécurisées. La signature des packages rend détectable toute modification après le build, et le stockage immuable empêche quiconque, administrateurs compris, de modifier les enregistrements archivés.
  options:
    a:
      en: Sensitivity labels support confidentiality through classification; they don't stop an administrator from changing a record.
      fr: Les étiquettes de confidentialité servent la confidentialité par la classification ; elles n'empêchent pas un administrateur de modifier un enregistrement.
    c:
      en: Availability zones improve the availability of the agents; they don't detect a modified package.
      fr: Les zones de disponibilité améliorent la disponibilité des agents ; elles ne détectent pas un package modifié.
    e:
      en: Replication is an availability control; a modified record would simply be replicated.
      fr: La réplication est un contrôle de disponibilité ; un enregistrement modifié serait simplement répliqué.
references:
  - title: Secure Overview
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/secure/
