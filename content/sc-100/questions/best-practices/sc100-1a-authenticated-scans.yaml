id: sc100-1a-authenticated-scans
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender for Endpoint and Microsoft Defender Vulnerability Management on its corporate devices. A manufacturing site has 60 Windows devices that the vendor manages under a support contract. No agent can be installed on these devices, but Fabrikam has remote access credentials for them.

    You need to recommend a solution to regularly assess the 60 devices for software vulnerabilities, so that the security update strategy covers them. The solution must minimize the number of new products.

    What should you recommend?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender for Endpoint et Microsoft Defender Vulnerability Management sur ses appareils d'entreprise. Un site de production compte 60 appareils Windows que le fournisseur gère dans le cadre d'un contrat de support. Aucun agent ne peut être installé sur ces appareils, mais Fabrikam dispose d'informations d'identification d'accès à distance pour eux.

    Vous devez recommander une solution pour évaluer régulièrement les vulnérabilités logicielles des 60 appareils, afin que la stratégie de mises à jour de sécurité les couvre. La solution doit réduire au minimum le nombre de nouveaux produits.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Authenticated scans in Defender Vulnerability Management", fr: "Les analyses authentifiées de Defender Vulnerability Management" } }
    - { id: b, text: { en: "Periodic assessment in Azure Update Manager", fr: "L'évaluation périodique d'Azure Update Manager" } }
    - { id: c, text: { en: "Microsoft Defender External Attack Surface Management", fr: "Microsoft Defender External Attack Surface Management" } }
    - { id: d, text: { en: "Device compliance policies in Microsoft Intune", fr: "Les stratégies de conformité des appareils de Microsoft Intune" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Defender Vulnerability Management can scan unmanaged Windows devices regularly for software vulnerabilities when you provide credentials for remote access. The results join the same risk-based prioritization as the devices that run Defender for Endpoint, without installing an agent on the vendor-managed devices.
    fr: |
      Defender Vulnerability Management peut analyser régulièrement les vulnérabilités logicielles d'appareils Windows non gérés quand vous fournissez des informations d'identification d'accès à distance. Les résultats rejoignent la même priorisation fondée sur les risques que les appareils qui exécutent Defender for Endpoint, sans installer d'agent sur les appareils gérés par le fournisseur.
  options:
    b:
      en: |-
        Periodic assessment works on Azure VMs and Azure Arc-enabled servers, which requires installing the Connected Machine agent.
      fr: |-
        L'évaluation périodique fonctionne sur les VM Azure et les serveurs Azure Arc, ce qui exige d'installer l'agent Connected Machine.
    c:
      en: |-
        Defender EASM discovers internet-facing assets from the outside. It doesn't assess the installed software of internal devices.
      fr: |-
        Defender EASM découvre les ressources exposées à Internet depuis l'extérieur. Il n'évalue pas les logiciels installés sur les appareils internes.
    d:
      en: |-
        Compliance policies apply to devices enrolled in Intune, which the vendor-managed devices aren't.
      fr: |-
        Les stratégies de conformité s'appliquent aux appareils inscrits dans Intune, ce que ne sont pas les appareils gérés par le fournisseur.
references:
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
