id: sc100-cs3c-landing-zone-policy
objective: "1.3.4"
type: multi
caseStudy: sc100-cs3c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that meets the landing zone requirements.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution qui respecte les exigences relatives à la zone d'atterrissage.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the policy at the Landing zones management group", fr: "Attribuer la stratégie au groupe d'administration Landing zones" } }
    - { id: b, text: { en: "Move sub-trial-portal to the Online management group", fr: "Déplacer sub-trial-portal vers le groupe d'administration Online" } }
    - { id: c, text: { en: "Assign the policy to each subscription in the Corp management group", fr: "Attribuer la stratégie à chaque abonnement du groupe d'administration Corp" } }
    - { id: d, text: { en: "Move sub-trial-portal to the Sandbox management group", fr: "Déplacer sub-trial-portal vers le groupe d'administration Sandbox" } }
    - { id: e, text: { en: "Assign the policy at the Corp management group", fr: "Attribuer la stratégie au groupe d'administration Corp" } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      In an Azure landing zone, Corp is the management group for workloads that connect to the corporate network through the hub, and Online is for workloads that need direct internet connectivity. One assignment at Corp applies to all its current and future subscriptions. TrialPortal is internet-facing, so its subscription belongs in Online, where the Corp policy doesn't apply.
    fr: |-
      Dans une zone d'atterrissage Azure, Corp est le groupe d'administration des charges de travail connectées au réseau d'entreprise via le hub, et Online celui des charges de travail qui ont besoin d'une connectivité Internet directe. Une seule attribution au niveau de Corp s'applique à tous ses abonnements actuels et futurs. TrialPortal est exposé sur Internet : son abonnement doit donc se trouver dans Online, où la stratégie de Corp ne s'applique pas.
  options:
    a:
      en: |-
        Landing zones also contains Online, so the policy would apply to internet-facing workloads.
      fr: |-
        Landing zones contient aussi Online : la stratégie s'appliquerait donc aux charges de travail exposées sur Internet.
    c:
      en: |-
        Per-subscription assignments multiply the assignments and don't cover the subscriptions created every quarter.
      fr: |-
        Des attributions par abonnement multiplient les attributions et ne couvrent pas les abonnements créés chaque trimestre.
    d:
      en: |-
        Sandbox is for testing and exploration, not for a production website.
      fr: |-
        Sandbox est destiné aux tests et à l'exploration, pas à un site web de production.
references:
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
