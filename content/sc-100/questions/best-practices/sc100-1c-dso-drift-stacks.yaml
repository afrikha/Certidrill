id: sc100-1c-dso-drift-stacks
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank deploys the production infrastructure of a trading application from Azure Pipelines by using Bicep. Operations engineers hold the Contributor role on the subscription because they manage other resources in it. They sometimes change the pipeline-deployed resources in the Azure portal, which causes configuration drift. In line with the Microsoft Cloud Adoption Framework for Azure (CAF), the pipeline-deployed resources must change only through the automation. The engineers must keep their role, and the pipeline must keep updating the resources.

    You need to recommend a solution.

    What should you recommend?
  fr: |
    Woodgrove Bank déploie l'infrastructure de production d'une application de trading depuis Azure Pipelines au moyen de Bicep. Les ingénieurs d'exploitation disposent du rôle Contributor sur l'abonnement, car ils y gèrent d'autres ressources. Ils modifient parfois dans le portail Azure les ressources déployées par le pipeline, ce qui provoque une dérive de configuration. Conformément au Microsoft Cloud Adoption Framework for Azure (CAF), les ressources déployées par le pipeline ne doivent changer que par l'automatisation. Les ingénieurs doivent conserver leur rôle, et le pipeline doit continuer à mettre à jour les ressources.

    Vous devez recommander une solution.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Apply a read-only lock (ReadOnly) to the resource groups that the pipeline deploys", fr: "Appliquer un verrou Lecture seule (ReadOnly) aux groupes de ressources déployés par le pipeline" } }
    - { id: b, text: { en: "Deploy the resources as a deployment stack with deny settings that exclude the pipeline identity", fr: "Déployer les ressources sous forme de pile de déploiement avec des paramètres de refus qui excluent l'identité du pipeline" } }
    - { id: c, text: { en: "Assign an Azure Policy definition with a deny effect to the resource groups that the pipeline deploys", fr: "Attribuer une définition Azure Policy avec un effet deny aux groupes de ressources déployés par le pipeline" } }
    - { id: d, text: { en: "Enable infrastructure as code scanning in Defender for Cloud DevOps security for the Bicep repository", fr: "Activer l'analyse de l'infrastructure as code dans la sécurité DevOps de Defender for Cloud pour le dépôt Bicep" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The CAF recommends deploying infrastructure through code and using deployment stacks with deny settings to block unauthorized changes to the managed resources. The deny settings create a deny assignment that blocks writes even for principals whose role allows them, such as the engineers' Contributor role, while the pipeline identity is listed as an excluded principal and keeps updating the resources.
    fr: |
      Le CAF recommande de déployer l'infrastructure par le code et d'utiliser des piles de déploiement avec des paramètres de refus pour bloquer les modifications non autorisées des ressources gérées. Les paramètres de refus créent une affectation de refus qui bloque les écritures même pour les principaux dont le rôle les autorise, comme le rôle Contributor des ingénieurs, tandis que l'identité du pipeline, déclarée comme principal exclu, continue à mettre à jour les ressources.
  options:
    a:
      en: |-
        A ReadOnly lock blocks every principal, the pipeline included, so the automation could no longer update the resources.
      fr: |-
        Un verrou ReadOnly bloque tous les principaux, pipeline compris : l'automatisation ne pourrait plus mettre à jour les ressources.
    c:
      en: |-
        Azure Policy evaluates the properties of a request, not who sends it, so it can't allow the pipeline's changes while blocking the same changes from the engineers.
      fr: |-
        Azure Policy évalue les propriétés d'une requête, pas son émetteur : elle ne peut pas autoriser les modifications du pipeline tout en bloquant les mêmes modifications faites par les ingénieurs.
    d:
      en: |-
        IaC scanning finds misconfigurations in the templates; it doesn't prevent changes made directly in the portal.
      fr: |-
        L'analyse IaC trouve les erreurs de configuration dans les modèles ; elle n'empêche pas les modifications faites directement dans le portail.
references:
  - title: Perform Your Cloud Adoption Securely
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/secure/adopt
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
