id: sc100-1b-caf-policy-as-code
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has 120 Azure subscriptions organized according to the Azure landing zone management group hierarchy. The platform team creates and modifies Azure Policy assignments manually in the Azure portal, and nobody can tell who changed an assignment or why.

    The CISO wants the governance policies to be versioned and reviewed before deployment, aligned with the Azure landing zone recommendations, and applied to all current and future subscriptions with minimal overhead.

    What should you recommend?
  fr: |
    Wingtip Toys dispose de 120 abonnements Azure organisés selon la hiérarchie de groupes d'administration des zones d'atterrissage Azure. L'équipe de plateforme crée et modifie les attributions Azure Policy manuellement dans le portail Azure, et personne ne peut dire qui a modifié une attribution ni pourquoi.

    Le RSSI veut que les stratégies de gouvernance soient versionnées et examinées avant leur déploiement, alignées sur les recommandations des zones d'atterrissage Azure, et appliquées à tous les abonnements actuels et futurs avec un minimum de charge.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Export the assignments to a wiki page each month and review the changes in a governance meeting", fr: "Exporter les attributions dans une page wiki chaque mois et examiner les changements en réunion de gouvernance" } }
    - { id: b, text: { en: "Manage the policies as code with Enterprise Azure Policy as Code (EPAC), assigned at the management groups", fr: "Gérer les stratégies en tant que code avec Enterprise Azure Policy as Code (EPAC), attribuées aux groupes d'administration" } }
    - { id: c, text: { en: "Deploy the policy assignments to each subscription with a script run by the platform team", fr: "Déployer les attributions de stratégie sur chaque abonnement avec un script exécuté par l'équipe de plateforme" } }
    - { id: d, text: { en: "Apply ReadOnly locks to the management groups to prevent changes to the assignments", fr: "Appliquer des verrous ReadOnly aux groupes d'administration pour empêcher la modification des attributions" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CAF recommends policy as code, through infrastructure as code, and names Enterprise Azure Policy as Code (EPAC) to manage policies aligned with Azure landing zone recommendations. Changes go through source control and review, and assignments at the management groups are inherited by every current and future subscription.
    fr: |-
      Le CAF recommande la stratégie en tant que code, via l'infrastructure as code, et cite Enterprise Azure Policy as Code (EPAC) pour gérer des stratégies alignées sur les recommandations des zones d'atterrissage Azure. Les changements passent par le contrôle de code source et la revue, et les attributions aux groupes d'administration sont héritées par chaque abonnement actuel et futur.
  options:
    a:
      en: |-
        A monthly export documents changes after the fact; it doesn't version or review them before deployment.
      fr: |-
        Un export mensuel documente les changements après coup ; il ne les versionne pas et ne les examine pas avant le déploiement.
    c:
      en: |-
        Per-subscription assignments by script multiply assignments and miss new subscriptions until the script runs again.
      fr: |-
        Des attributions par abonnement via un script multiplient les attributions et oublient les nouveaux abonnements jusqu'à la prochaine exécution du script.
    d:
      en: |-
        Resource locks can't be applied to management groups, and locks wouldn't provide versioning or review.
      fr: |-
        Les verrous de ressources ne peuvent pas être appliqués aux groupes d'administration, et ils n'apporteraient ni versionnement ni revue.
references:
  - title: Enforce cloud governance policies - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/enforce-cloud-governance-policies
