id: sc100-1a-recovery-first-rationale
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. is adopting Microsoft's plan to protect against ransomware. During a steering meeting, the head of IT operations asks why the plan starts by preparing a ransomware recovery plan instead of hardening the entry points that attackers use.

    You need to explain the main reason for this priority.

    What should you explain?
  fr: |
    Proseware, Inc. adopte le plan de Microsoft pour se protéger contre les rançongiciels. Lors d'un comité de pilotage, le responsable de l'exploitation informatique demande pourquoi le plan commence par la préparation d'un plan de récupération plutôt que par le durcissement des points d'entrée qu'utilisent les attaquants.

    Vous devez expliquer la principale raison de cette priorité.

    Que devez-vous expliquer ?
body:
  options:
    - { id: a, text: { en: "Privileged access controls can't be configured until the backups are protected", fr: "Les contrôles d'accès privilégié ne peuvent pas être configurés tant que les sauvegardes ne sont pas protégées" } }
    - { id: b, text: { en: "Protected backups stop attackers from entering the environment in the first place", fr: "Des sauvegardes protégées empêchent les attaquants d'entrer dans l'environnement" } }
    - { id: c, text: { en: "Recovering without paying the ransom removes the attackers' monetary incentive", fr: "Récupérer sans payer de rançon supprime l'intérêt financier des attaquants" } }
    - { id: d, text: { en: "The recovery plan is the least expensive of the three steps to implement", fr: "Le plan de récupération est la moins coûteuse des trois étapes à mettre en œuvre" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The first step aims to let the organization recover from an attack without paying the ransom, which removes the attackers' main incentive whatever entry point they use. The plan is ordered to reduce risk as fast as possible under the assume breach principle; hardening entry points takes longer and must not slow down the first two steps.
    fr: |
      La première étape vise à permettre à l'organisation de se remettre d'une attaque sans payer de rançon, ce qui supprime le principal intérêt des attaquants, quel que soit leur point d'entrée. Le plan est ordonné pour réduire le risque le plus vite possible selon le principe de supposition de violation ; le durcissement des points d'entrée prend plus de temps et ne doit pas ralentir les deux premières étapes.
  options:
    a:
      en: |-
        Microsoft states that the order of its checklists reflects prioritization, not technical dependency. Backup and identity teams can work in parallel.
      fr: |-
        Microsoft précise que l'ordre de ses listes de contrôle reflète la priorisation, pas une dépendance technique. Les équipes de sauvegarde et d'identité peuvent travailler en parallèle.
    b:
      en: |-
        Backups don't prevent intrusion. Making it hard to get in is the third step of the plan.
      fr: |-
        Les sauvegardes n'empêchent pas l'intrusion. Rendre l'accès difficile est la troisième étape du plan.
    d:
      en: |-
        The order is driven by risk reduction and urgency, not by the cost of each step.
      fr: |-
        L'ordre est dicté par la réduction du risque et l'urgence, pas par le coût de chaque étape.
references:
  - title: Quickly protect your organization against ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware
