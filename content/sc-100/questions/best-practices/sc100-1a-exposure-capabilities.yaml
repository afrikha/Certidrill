id: sc100-1a-exposure-capabilities
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is deploying Microsoft Security Exposure Management to identify and prioritize threats to its business-critical assets in a hybrid environment that includes Azure and AWS. The security team defined three requirements.

    Which capability should you recommend for each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. déploie Microsoft Security Exposure Management pour identifier et hiérarchiser les menaces qui pèsent sur ses ressources vitales pour l'entreprise, dans un environnement hybride qui comprend Azure et AWS. L'équipe de sécurité a défini trois exigences.

    Quelle capacité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les capacités appropriées vers les exigences correspondantes. Chaque capacité peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: paths, text: { en: "Attack paths", fr: "Chemins d'attaque" } }
    - { id: custom, text: { en: "Custom classifications", fr: "Classifications personnalisées" } }
    - { id: map, text: { en: "Attack surface map", fr: "Carte de la surface d'attaque" } }
    - { id: predef, text: { en: "Predefined classifications", fr: "Classifications prédéfinies" } }
    - { id: ta, text: { en: "Threat analytics", fr: "Analyse des menaces" } }
  targets:
    - id: t1
      text: { en: "Show how an attacker could move from an internet-facing VM to a database that holds customer data", fr: "Montrer comment un attaquant pourrait passer d'une VM exposée à Internet à une base de données qui contient des données client" }
    - id: t2
      text: { en: "Mark the servers of the in-house pricing application as critical, although no built-in rule detects them", fr: "Marquer comme critiques les serveurs de l'application interne de tarification, bien qu'aucune règle intégrée ne les détecte" }
    - id: t3
      text: { en: "Explore the assets of the environment and their relationships as a graph", fr: "Explorer les ressources de l'environnement et leurs relations sous forme de graphe" }
answer:
  mapping: { t1: paths, t2: custom, t3: map }
explanation:
  correct:
    en: |
      Attack paths simulate how an attacker could breach the attack surface and reach a target, including paths that span on-premises and cloud. Custom classifications let the team define its own crown jewels by query or add assets manually when the predefined catalog doesn't cover them. The attack surface map visualizes the environment and its relationships as a graph, with critical assets highlighted.
    fr: |
      Les chemins d'attaque simulent la façon dont un attaquant pourrait franchir la surface d'attaque et atteindre une cible, y compris par des chemins qui relient le local et le cloud. Les classifications personnalisées permettent à l'équipe de définir ses propres joyaux de la couronne par requête ou d'ajouter des ressources à la main quand le catalogue prédéfini ne les couvre pas. La carte de la surface d'attaque représente l'environnement et ses relations sous forme de graphe, avec les ressources critiques mises en évidence.
  options:
    predef:
      en: |-
        Predefined classifications only detect the asset types of the built-in catalog, which the pricing servers don't match.
      fr: |-
        Les classifications prédéfinies ne détectent que les types de ressources du catalogue intégré, auxquels les serveurs de tarification ne correspondent pas.
    ta:
      en: |-
        Threat analytics describes threat actors and campaigns; it doesn't model the organization's own environment.
      fr: |-
        L'analyse des menaces décrit des acteurs et des campagnes de menace ; elle ne modélise pas l'environnement de l'organisation.
references:
  - title: What is Microsoft Security Exposure Management?
    url: https://learn.microsoft.com/en-us/security-exposure-management/microsoft-security-exposure-management
  - title: Overview of critical asset management
    url: https://learn.microsoft.com/en-us/security-exposure-management/critical-asset-management
