id: sc100-1b-zt-scale-motion
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. migrated 60 applications to Azure by following the Cloud Adoption Framework for Azure (CAF), one application at a time. The company now starts a Zero Trust program that will use the Zero Trust adoption framework, which uses the same lifecycle phases as CAF.

    The program manager proposes to reuse the migration approach and complete all Zero Trust controls for one application before moving to the next one.

    You need to recommend the approach that the Zero Trust adoption framework describes for scaling the program.

    What should you recommend?
  fr: |
    Litware, Inc. a migré 60 applications vers Azure en suivant le Cloud Adoption Framework pour Azure (CAF), une application à la fois. L'entreprise lance maintenant un programme Confiance Zéro qui utilisera le framework d'adoption de la Confiance Zéro, lequel reprend les mêmes phases de cycle de vie que le CAF.

    Le responsable du programme propose de réutiliser l'approche de la migration et de terminer tous les contrôles Confiance Zéro d'une application avant de passer à la suivante.

    Vous devez recommander l'approche que le framework d'adoption de la Confiance Zéro décrit pour la mise à l'échelle du programme.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Deploy all the technical areas across the whole estate in a single project", fr: "Déployer tous les domaines techniques sur tout le patrimoine en un seul projet" } }
    - { id: b, text: { en: "Apply one piece, such as data protection, across the whole estate, then repeat with the next piece", fr: "Appliquer un élément, comme la protection des données, à tout le patrimoine, puis recommencer avec l'élément suivant" } }
    - { id: c, text: { en: "Repeat the full set of Zero Trust controls for each application, starting with the most critical one", fr: "Répéter l'ensemble des contrôles Confiance Zéro pour chaque application, en commençant par la plus critique" } }
    - { id: d, text: { en: "Start with the most complex pieces, then add quick wins once the foundation is in place", fr: "Commencer par les éléments les plus complexes, puis ajouter les gains rapides une fois les fondations en place" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CAF introduces one application or service at a time, so it scales by repeating the process for each workload. Zero Trust introduces security configurations across the entire digital estate, so it scales one piece of the architecture across the estate, then repeats with additional pieces, starting with strategic quick wins and foundational pieces.
    fr: |-
      Le CAF introduit une application ou un service à la fois : il passe à l'échelle en répétant le processus pour chaque charge de travail. La Confiance Zéro introduit des configurations de sécurité sur tout le patrimoine numérique : elle passe à l'échelle en appliquant un élément de l'architecture à tout le patrimoine, puis en recommençant avec d'autres éléments, en commençant par les gains rapides stratégiques et les éléments fondamentaux.
  options:
    a:
      en: |-
        The framework is incremental, with stages and quick wins; a single project for every area is the opposite of its guidance.
      fr: |-
        Le framework est incrémental, avec des étapes et des gains rapides ; un projet unique pour tous les domaines est le contraire de ses recommandations.
    c:
      en: |-
        This is the CAF scaling motion for workloads, which the program manager proposed; Zero Trust scales each piece across the estate instead.
      fr: |-
        C'est le mouvement de mise à l'échelle du CAF pour les charges de travail, celui que proposait le responsable du programme ; la Confiance Zéro étend plutôt chaque élément à tout le patrimoine.
    d:
      en: |-
        The framework starts with quick wins and foundational pieces, then advances to more complex pieces.
      fr: |-
        Le framework commence par les gains rapides et les éléments fondamentaux, puis passe aux éléments plus complexes.
references:
  - title: Zero Trust adoption framework overview
    url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/zero-trust-adoption-overview
