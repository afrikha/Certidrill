id: sc100-1c-lz-principles
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is redesigning its Azure environment around Azure landing zones. The architecture board has written three requirements and wants to know which Azure landing zone design principle each one applies.

    Which design principle should you identify for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation reconçoit son environnement Azure autour de zones d'atterrissage Azure. Le comité d'architecture a rédigé trois exigences et souhaite savoir quel principe de conception des zones d'atterrissage Azure chacune applique.

    Quel principe de conception devez-vous identifier pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Workload teams obtain their own subscriptions through a self-service process and manage them within the platform guardrails: [[p1]]

      Security and regulatory controls are enforced by Azure Policy, whatever tool a team uses to deploy: [[p2]]

      All teams work through Azure Resource Manager instead of an in-house provisioning portal built by the company: [[p3]]
    fr: |
      Les équipes des charges de travail obtiennent leurs propres abonnements via un processus en libre-service et les gèrent dans le cadre des garde-fous de la plateforme : [[p1]]

      Les contrôles de sécurité et réglementaires sont appliqués par Azure Policy, quel que soit l'outil de déploiement utilisé par une équipe : [[p2]]

      Toutes les équipes passent par Azure Resource Manager au lieu d'un portail de provisionnement interne développé par l'entreprise : [[p3]]
  slots:
    - id: p1
      options:
        - { id: demo, text: { en: "Subscription democratization", fr: "Démocratisation des abonnements" } }
        - { id: policy, text: { en: "Policy-driven governance", fr: "Gouvernance pilotée par les stratégies" } }
        - { id: plane, text: { en: "Single control and management plane", fr: "Plan de contrôle et de gestion unique" } }
        - { id: app, text: { en: "Application-centric service model", fr: "Modèle de service centré sur les applications" } }
        - { id: native, text: { en: "Alignment with Azure-native design and roadmaps", fr: "Alignement sur la conception native Azure et les feuilles de route" } }
    - id: p2
      options:
        - { id: demo, text: { en: "Subscription democratization", fr: "Démocratisation des abonnements" } }
        - { id: policy, text: { en: "Policy-driven governance", fr: "Gouvernance pilotée par les stratégies" } }
        - { id: plane, text: { en: "Single control and management plane", fr: "Plan de contrôle et de gestion unique" } }
        - { id: app, text: { en: "Application-centric service model", fr: "Modèle de service centré sur les applications" } }
        - { id: native, text: { en: "Alignment with Azure-native design and roadmaps", fr: "Alignement sur la conception native Azure et les feuilles de route" } }
    - id: p3
      options:
        - { id: demo, text: { en: "Subscription democratization", fr: "Démocratisation des abonnements" } }
        - { id: policy, text: { en: "Policy-driven governance", fr: "Gouvernance pilotée par les stratégies" } }
        - { id: plane, text: { en: "Single control and management plane", fr: "Plan de contrôle et de gestion unique" } }
        - { id: app, text: { en: "Application-centric service model", fr: "Modèle de service centré sur les applications" } }
        - { id: native, text: { en: "Alignment with Azure-native design and roadmaps", fr: "Alignement sur la conception native Azure et les feuilles de route" } }
answer:
  values: { p1: demo, p2: policy, p3: plane }
explanation:
  correct:
    en: |
      Subscription democratization lets workload teams obtain and manage subscriptions independently, through self-service vending, within the platform guardrails. Policy-driven governance uses Azure Policy to enforce security, governance and regulatory controls independently of the implementation tooling. The single control and management plane principle avoids abstraction layers such as customer-developed portals and relies on Azure Resource Manager as the consistent control plane.
    fr: |
      La démocratisation des abonnements permet aux équipes des charges de travail d'obtenir et de gérer des abonnements de façon autonome, via une distribution en libre-service, dans le cadre des garde-fous de la plateforme. La gouvernance pilotée par les stratégies utilise Azure Policy pour appliquer les contrôles de sécurité, de gouvernance et réglementaires, indépendamment des outils d'implémentation. Le principe du plan de contrôle et de gestion unique évite les couches d'abstraction comme les portails développés par le client et s'appuie sur Azure Resource Manager comme plan de contrôle cohérent.
  options:
    native:
      en: |-
        This principle favors Azure-native services over third-party solutions; avoiding a custom portal in favor of Resource Manager is the single control plane principle.
      fr: |-
        Ce principe privilégie les services natifs Azure par rapport aux solutions tierces ; éviter un portail personnalisé au profit de Resource Manager relève du principe du plan de contrôle unique.
references:
  - title: Azure landing zone design principles
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-principles
