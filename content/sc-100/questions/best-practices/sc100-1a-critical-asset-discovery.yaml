id: sc100-1a-critical-asset-discovery
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has an on-premises AD DS domain synchronized to Microsoft Entra ID, workloads in Azure, AWS and GCP, and 6,000 devices onboarded to Microsoft Defender for Endpoint. The AWS and GCP accounts are connected to Microsoft Defender for Cloud.

    The CISO wants the security strategy to focus remediation on threats to business-critical assets. The solution must identify critical devices, identities and cloud resources automatically, let the security team add the company's own crown jewels, and use asset criticality to prioritize attack paths and recommendations. Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose d'un domaine AD DS local synchronisé avec Microsoft Entra ID, de charges de travail dans Azure, AWS et GCP, et de 6 000 appareils intégrés à Microsoft Defender for Endpoint. Les comptes AWS et GCP sont connectés à Microsoft Defender for Cloud.

    Le RSSI veut que la stratégie de sécurité concentre les corrections sur les menaces qui pèsent sur les ressources vitales pour l'entreprise. La solution doit identifier automatiquement les appareils, les identités et les ressources cloud critiques, permettre à l'équipe de sécurité d'ajouter les propres joyaux de la couronne de l'entreprise, et utiliser la criticité des ressources pour prioriser les chemins d'attaque et les recommandations. L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Microsoft Sentinel watchlist of high-value assets, maintained by the security team", fr: "Une watchlist Microsoft Sentinel des ressources à forte valeur, tenue à jour par l'équipe de sécurité" } }
    - { id: b, text: { en: "Azure tags that record criticality, queried with Azure Resource Graph", fr: "Des étiquettes Azure qui indiquent la criticité, interrogées avec Azure Resource Graph" } }
    - { id: c, text: { en: "Data classification in the Microsoft Purview Data Map for all data sources", fr: "La classification des données dans le mappage de données Microsoft Purview pour toutes les sources de données" } }
    - { id: d, text: { en: "Critical asset management in Microsoft Security Exposure Management", fr: "La gestion des ressources critiques dans Microsoft Security Exposure Management" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Critical asset management classifies devices, identities and cloud resources from Azure, AWS and GCP automatically by using a catalog of predefined classifications, and supports custom classifications for the organization's own crown jewels. The criticality level is then reflected in attack paths, the attack surface map, advanced hunting and incidents, so remediation can be prioritized by business impact without maintaining lists by hand.
    fr: |
      La gestion des ressources critiques classe automatiquement les appareils, les identités et les ressources cloud d'Azure, d'AWS et de GCP à l'aide d'un catalogue de classifications prédéfinies, et prend en charge des classifications personnalisées pour les propres joyaux de la couronne de l'organisation. Le niveau de criticité est ensuite repris dans les chemins d'attaque, la carte de la surface d'attaque, la chasse avancée et les incidents : les corrections peuvent être priorisées selon l'impact métier sans tenir de listes à la main.
  options:
    a:
      en: |-
        A watchlist is a manually maintained list used in Sentinel queries. It doesn't classify assets automatically and doesn't drive attack path prioritization.
      fr: |-
        Une watchlist est une liste tenue à la main et utilisée dans les requêtes Sentinel. Elle ne classe pas les ressources automatiquement et ne pilote pas la priorisation des chemins d'attaque.
    b:
      en: |-
        Azure tags cover Azure resources only, must be set by hand and aren't used to prioritize attack paths across devices and identities.
      fr: |-
        Les étiquettes Azure ne couvrent que les ressources Azure, doivent être posées à la main et ne servent pas à prioriser les chemins d'attaque sur les appareils et les identités.
    c:
      en: |-
        The Data Map classifies data by its content, such as sensitive information types. It doesn't classify devices and identities or prioritize security recommendations.
      fr: |-
        Le mappage de données classe les données selon leur contenu, par exemple les types d'informations sensibles. Il ne classe ni les appareils ni les identités et ne priorise pas les recommandations de sécurité.
references:
  - title: Overview of critical asset management
    url: https://learn.microsoft.com/en-us/security-exposure-management/critical-asset-management
  - title: What is Microsoft Security Exposure Management?
    url: https://learn.microsoft.com/en-us/security-exposure-management/microsoft-security-exposure-management
