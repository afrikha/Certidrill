id: sc100-1a-strongest-backup-protection
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation backs up its on-premises servers and Azure workloads to online backup storage. A risk assessment states that a ransomware operator who obtains administrative access could deliberately erase or encrypt the backups.

    You need to recommend the backup protection that Microsoft's ransomware recovery plan describes as the strongest protection against deliberate erasure and encryption.

    What should you recommend?
  fr: |
    Adatum Corporation sauvegarde ses serveurs locaux et ses charges de travail Azure sur un stockage de sauvegarde en ligne. Une évaluation des risques indique qu'un opérateur de rançongiciel qui obtient un accès administratif pourrait effacer ou chiffrer délibérément les sauvegardes.

    Vous devez recommander la protection des sauvegardes que le plan de récupération de Microsoft contre les rançongiciels décrit comme la plus forte contre l'effacement et le chiffrement délibérés.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Require MFA or a PIN as an out-of-band step before online backups can be modified", fr: "Exiger la MFA ou un code PIN comme étape hors bande avant toute modification des sauvegardes en ligne" } }
    - { id: b, text: { en: "Encrypt the online backups with customer-managed keys stored in Azure Key Vault", fr: "Chiffrer les sauvegardes en ligne avec des clés gérées par le client stockées dans Azure Key Vault" } }
    - { id: c, text: { en: "Replicate the online backups to the paired region by using geo-redundant storage", fr: "Répliquer les sauvegardes en ligne vers la région jumelée à l'aide du stockage géoredondant" } }
    - { id: d, text: { en: "Store the backups in online immutable storage, or fully offline or off-site", fr: "Stocker les sauvegardes dans un stockage immuable en ligne, ou complètement hors ligne ou hors site" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The secure backups checklist of the ransomware recovery plan defines two levels. Strong protection requires out-of-band steps such as MFA or a PIN before online backups can be modified. The strongest protection stores backups in online immutable storage, such as Azure Blob immutable storage, or fully offline or off-site, so that an attacker with administrative rights can't erase or encrypt them.
    fr: |
      La liste de contrôle des sauvegardes sécurisées du plan de récupération contre les rançongiciels définit deux niveaux. La protection forte exige des étapes hors bande comme la MFA ou un code PIN avant toute modification des sauvegardes en ligne. La protection la plus forte stocke les sauvegardes dans un stockage immuable en ligne, comme le stockage immuable des objets blob Azure, ou complètement hors ligne ou hors site : un attaquant doté de droits d'administration ne peut ni les effacer ni les chiffrer.
  options:
    a:
      en: |-
        Out-of-band steps are the strong level of the checklist, not the strongest. The backups remain modifiable once the step is passed.
      fr: |-
        Les étapes hors bande correspondent au niveau fort de la liste de contrôle, pas au plus fort. Les sauvegardes restent modifiables une fois l'étape franchie.
    b:
      en: |-
        Customer-managed keys protect the confidentiality of backup data. They don't stop an administrator from deleting the backups.
      fr: |-
        Les clés gérées par le client protègent la confidentialité des données de sauvegarde. Elles n'empêchent pas un administrateur de supprimer les sauvegardes.
    c:
      en: |-
        Geo-redundant storage protects against a regional outage. A deletion made by an attacker applies to both copies.
      fr: |-
        Le stockage géoredondant protège contre une panne régionale. Une suppression faite par un attaquant s'applique aux deux copies.
references:
  - title: Ransomware attack recovery plan
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase1
