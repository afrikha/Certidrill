id: sc100-1b-caf-posture-modernization
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is defining the security part of its cloud strategy by using the Secure methodology of the Cloud Adoption Framework for Azure (CAF). The CISO describes the current approach: a penetration test before each major migration and a security review of new projects by an architecture committee.

    The CISO wants the strategy to modernize the security posture continuously, prioritize work by measurable risk reduction and validate controls automatically.

    What should you include in the strategy?
  fr: |
    Northwind Traders définit le volet sécurité de sa stratégie cloud avec la méthodologie Secure du Cloud Adoption Framework pour Azure (CAF). Le RSSI décrit l'approche actuelle : un test d'intrusion avant chaque migration majeure et une revue de sécurité des nouveaux projets par un comité d'architecture.

    Le RSSI veut que la stratégie modernise la posture de sécurité en continu, priorise le travail selon la réduction mesurable du risque et valide les contrôles automatiquement.

    Que devez-vous inclure dans la stratégie ?
body:
  options:
    - { id: a, text: { en: "Penetration tests twice a year, with the findings reviewed by the architecture committee", fr: "Des tests d'intrusion deux fois par an, avec des résultats examinés par le comité d'architecture" } }
    - { id: b, text: { en: "An annual external audit against ISO/IEC 27001, with an improvement plan for each finding", fr: "Un audit externe annuel selon ISO/IEC 27001, avec un plan d'amélioration pour chaque constat" } }
    - { id: c, text: { en: "Azure Advisor cost recommendations, reviewed each month by the FinOps team", fr: "Les recommandations de coût d'Azure Advisor, examinées chaque mois par l'équipe FinOps" } }
    - { id: d, text: { en: "Alignment with the Zero Trust adoption framework, validated by policy, IaC and Defender for Cloud secure score", fr: "Un alignement sur le framework d'adoption de la Confiance Zéro, validé par les stratégies, l'IaC et le degré de sécurisation de Defender for Cloud" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In the CAF Secure methodology, security posture modernization aligns with the Zero Trust adoption framework, prioritizes work by measurable risk reduction, and validates it through policy, infrastructure as code, continuous compliance scanning and Defender for Cloud secure score tracking. Posture sustainment then repeats measurement, improvement and validation.
    fr: |-
      Dans la méthodologie Secure du CAF, la modernisation de la posture de sécurité s'aligne sur le framework d'adoption de la Confiance Zéro, priorise le travail selon la réduction mesurable du risque et le valide par les stratégies, l'infrastructure as code, l'analyse continue de la conformité et le suivi du degré de sécurisation de Defender for Cloud. Le maintien de la posture répète ensuite la mesure, l'amélioration et la validation.
  options:
    a:
      en: |-
        More frequent penetration tests are still point-in-time and manual; they don't provide continuous, automated validation.
      fr: |-
        Des tests d'intrusion plus fréquents restent ponctuels et manuels ; ils n'apportent pas de validation continue et automatisée.
    b:
      en: |-
        An annual audit checks compliance with one standard once a year; it doesn't modernize the posture continuously.
      fr: |-
        Un audit annuel vérifie la conformité à une norme une fois par an ; il ne modernise pas la posture en continu.
    c:
      en: |-
        Cost recommendations address cost optimization, not security posture.
      fr: |-
        Les recommandations de coût concernent l'optimisation des coûts, pas la posture de sécurité.
references:
  - title: Secure Overview - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/secure/
