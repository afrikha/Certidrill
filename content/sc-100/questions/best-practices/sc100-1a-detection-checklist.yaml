id: sc100-1a-detection-checklist
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender XDR, Microsoft Defender for Endpoint on all devices, and Microsoft Sentinel. As part of limiting the scope of ransomware damage, the SOC manager asks you to update the detection and response design according to Microsoft's ransomware guidance.

    Which two actions should you include in the design? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Defender XDR, Microsoft Defender for Endpoint sur tous les appareils et Microsoft Sentinel. Dans le cadre de la limitation de l'étendue des dégâts d'un rançongiciel, le responsable du SOC vous demande de mettre à jour la conception de la détection et de la réponse selon les recommandations de Microsoft contre les rançongiciels.

    Quelles sont les deux actions que vous devez inclure dans la conception ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Monitor for the clearing of the Security and PowerShell Operational event logs and for disabled security tools", fr: "Surveiller l'effacement des journaux d'événements Security et PowerShell Operational et la désactivation des outils de sécurité" } }
    - { id: b, text: { en: "Wait for the forensic report of an incident before isolating the devices that it affects", fr: "Attendre le rapport d'analyse forensique d'un incident avant d'isoler les appareils qu'il concerne" } }
    - { id: c, text: { en: "Lower the priority of commodity malware alerts so that analysts focus on human-operated attacks", fr: "Baisser la priorité des alertes de logiciels malveillants courants pour que les analystes se concentrent sur les attaques à opération humaine" } }
    - { id: d, text: { en: "Rapidly isolate the impacted devices by using Microsoft Defender for Endpoint", fr: "Isoler rapidement les appareils touchés à l'aide de Microsoft Defender for Endpoint" } }
    - { id: e, text: { en: "Focus detection on internal file servers rather than on endpoint, email, identity and RDP entry points", fr: "Concentrer la détection sur les serveurs de fichiers internes plutôt que sur les points d'entrée points de terminaison, e-mail, identité et RDP" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      The detection and response checklist of the second step asks the SOC to watch for adversaries disabling security, such as clearing the Security and PowerShell Operational logs or turning off security tools. It also asks to isolate impacted devices rapidly with Defender for Endpoint to limit the attacker's access and time in the environment.
    fr: |
      La liste de contrôle de détection et de réponse de la deuxième étape demande au SOC de surveiller les adversaires qui désactivent la sécurité, par exemple en effaçant les journaux Security et PowerShell Operational ou en arrêtant les outils de sécurité. Elle demande aussi d'isoler rapidement les appareils touchés avec Defender for Endpoint pour limiter l'accès et le temps de l'attaquant dans l'environnement.
  options:
    b:
      en: |-
        Delaying isolation gives the attacker more time to spread. The guidance asks for rapid isolation.
      fr: |-
        Retarder l'isolement laisse plus de temps à l'attaquant pour se propager. Les recommandations demandent un isolement rapide.
    c:
      en: |-
        Microsoft warns not to ignore commodity malware, because ransomware operators buy access to organizations through it.
      fr: |-
        Microsoft met en garde contre l'oubli des logiciels malveillants courants, car les opérateurs de rançongiciels achètent des accès aux organisations par ce biais.
    e:
      en: |-
        Endpoint, email, identity and RDP are the favored entry points, and the checklist asks to prioritize them.
      fr: |-
        Les points de terminaison, l'e-mail, l'identité et RDP sont les points d'entrée privilégiés, et la liste de contrôle demande de les prioriser.
references:
  - title: Limit the impact of ransomware attacks
    url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase2
