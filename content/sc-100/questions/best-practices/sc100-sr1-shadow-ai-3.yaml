series: sc100-sr1-shadow-ai
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You recommend the Microsoft Purview browser extension with Data Security Posture Management.
  fr: Vous recommandez l'extension de navigateur Microsoft Purview avec Data Security Posture Management.
body:
  solution:
    en: |
      You recommend onboarding the devices to Microsoft Purview, deploying the **Microsoft Purview browser extension**, and using **Microsoft Purview Data Security Posture Management** to report the visits to third-party generative AI sites and the sensitive information that employees send to them.
    fr: |
      Vous recommandez d'intégrer les appareils à Microsoft Purview, de déployer l'**extension de navigateur Microsoft Purview** et d'utiliser **Microsoft Purview Data Security Posture Management** pour signaler les visites de sites d'IA générative tiers et les informations sensibles que les employés leur envoient.
answer: { value: false }
explanation:
  correct:
    en: Purview gives visibility into AI website visits and the sensitive data sent to supported third-party AI sites, which helps the data protection part of the strategy. It doesn't rate each app against security, compliance, and legal criteria, and it doesn't block the apps that the security team rejects. The cloud app catalog and unsanctioned apps of Defender for Cloud Apps meet those requirements.
    fr: "Purview offre une visibilité sur les visites de sites web d'IA et sur les données sensibles envoyées aux sites d'IA tiers pris en charge, ce qui aide le volet protection des données de la stratégie. Il n'évalue pas chaque application selon des critères de sécurité, de conformité et juridiques, et ne bloque pas les applications que l'équipe de sécurité refuse. Le catalogue d'applications cloud et les applications non approuvées de Defender for Cloud Apps répondent à ces exigences."
references:
  - title: Cloud app catalog and risk scores
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/risk-score
