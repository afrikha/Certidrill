id: sc100-1b-insider-privacy
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has offices in Germany and France and uses Microsoft 365 E5. The security team plans to detect data leaks by employees, such as risky sharing of files, printing and copies to personal cloud services.

    The works council approved the project with the following conditions:

    - Analysts who triage alerts must not see the identity of the employees by default.
    - Only a small group of authorized investigators can access the details of a case.
    - The solution must minimize administrative effort.

    What should you include in the recommendation?
  fr: |
    Adatum Corporation a des bureaux en Allemagne et en France et utilise Microsoft 365 E5. L'équipe de sécurité prévoit de détecter les fuites de données par des employés, comme le partage risqué de fichiers, l'impression et les copies vers des services cloud personnels.

    Le comité d'entreprise a approuvé le projet aux conditions suivantes :

    - Les analystes qui trient les alertes ne doivent pas voir l'identité des employés par défaut.
    - Seul un petit groupe d'enquêteurs autorisés peut accéder aux détails d'un dossier.
    - La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "Microsoft Purview Insider Risk Management, after you turn on pseudonymization, which is off by default", fr: "Microsoft Purview Insider Risk Management, après avoir activé la pseudonymisation, désactivée par défaut" }
    - id: b
      text: { en: "Microsoft Purview Audit (Premium) searches that HR runs for each employee under suspicion", fr: "Des recherches Microsoft Purview Audit (Premium) que les RH exécutent pour chaque employé suspecté" }
    - id: c
      text: { en: "Microsoft Purview Insider Risk Management with its default pseudonymization, and role groups that limit case access", fr: "Microsoft Purview Insider Risk Management avec sa pseudonymisation par défaut, et des groupes de rôles qui limitent l'accès aux dossiers" }
    - id: d
      text: { en: "Microsoft Entra ID Protection risky user reports, reviewed by a delegated group of investigators", fr: "Les rapports d'utilisateurs à risque de Microsoft Entra ID Protection, examinés par un groupe délégué d'enquêteurs" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Insider Risk Management detects data leak activities with policies such as the Data leaks template, and it is built with privacy by design. Users are pseudonymized by default, and role-based access and audit logs restrict who can see and investigate cases, so no extra configuration is needed for the works council conditions.
    fr: |-
      Insider Risk Management détecte les activités de fuite de données avec des stratégies comme le modèle Data leaks, et il est conçu avec la confidentialité dès la conception. Les utilisateurs sont pseudonymisés par défaut, et l'accès en fonction du rôle et les journaux d'audit limitent qui peut voir et examiner les dossiers : aucune configuration supplémentaire n'est nécessaire pour respecter les conditions du comité d'entreprise.
  options:
    a:
      en: |-
        Insider Risk Management is the right product, but pseudonymization is on by default; there is nothing to turn on.
      fr: |-
        Insider Risk Management est le bon produit, mais la pseudonymisation est activée par défaut : il n'y a rien à activer.
    b:
      en: |-
        Manual audit log searches don't detect leaks proactively, expose identities to HR and require effort for every employee.
      fr: |-
        Des recherches manuelles dans le journal d'audit ne détectent pas les fuites de manière proactive, exposent les identités aux RH et demandent un effort pour chaque employé.
    d:
      en: |-
        ID Protection reports compromised-looking accounts and sign-ins; it doesn't detect data leaks by legitimate users.
      fr: |-
        ID Protection signale les comptes et les connexions qui semblent compromis ; il ne détecte pas les fuites de données par des utilisateurs légitimes.
references:
  - title: Learn about Insider Risk Management
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management
