id: sc100-1a-backup-statements
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is designing secure backup and restore for Azure virtual machines, Azure Blob Storage accounts and on-premises servers. The design uses Recovery Services vaults and Backup vaults. Operational backup is used for the blob containers, and vaulted backup is used for the other workloads.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. conçoit une sauvegarde et une restauration sécurisées pour des machines virtuelles Azure, des comptes Stockage Blob Azure et des serveurs locaux. La conception utilise des coffres Recovery Services et des coffres de sauvegarde. La sauvegarde opérationnelle est utilisée pour les conteneurs d'objets blob, et la sauvegarde en coffre pour les autres charges de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Locking immutability on the Backup vault also protects the operational backups of the blob containers.
        fr: |-
          Verrouiller l'immuabilité du coffre de sauvegarde protège aussi les sauvegardes opérationnelles des conteneurs d'objets blob.
    - id: s2
      text:
        en: |-
          Vaulted backup data is stored in a Microsoft-managed subscription and tenant, logically separated from the production environment.
        fr: |-
          Les données de sauvegarde en coffre sont stockées dans un abonnement et un locataire gérés par Microsoft, séparés logiquement de l'environnement de production.
    - id: s3
      text:
        en: |-
          Soft delete can keep deleted backup data for seven years to meet the long-term retention requirements.
        fr: |-
          La suppression réversible peut conserver les données de sauvegarde supprimées pendant sept ans pour répondre aux exigences de rétention à long terme.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Immutability applies to vaulted data only; operational backups of blobs, files and disks stay outside its scope. Vaulted backup data sits in a Microsoft-managed subscription and tenant, which is a logical separation, not an offline air gap. Soft delete keeps deleted data for 14 days by default and up to 180 days; it doesn't provide long-term retention.
    fr: |
      L'immuabilité ne s'applique qu'aux données en coffre ; les sauvegardes opérationnelles des objets blob, des fichiers et des disques restent hors de sa portée. Les données de sauvegarde en coffre se trouvent dans un abonnement et un locataire gérés par Microsoft, ce qui est une séparation logique, pas une isolation hors ligne. La suppression réversible conserve les données supprimées 14 jours par défaut et jusqu'à 180 jours ; elle n'offre pas de rétention à long terme.
references:
  - title: Overview of security and cyber recovery in Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/security-overview
  - title: Immutable vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
