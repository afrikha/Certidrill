id: sc100-2c-policy-exemption-mitigated
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. assigned an Azure Policy initiative at a management group. One definition requires that storage accounts use private endpoints.

    A storage account named stlegacy01 in a resource group named RG-Legacy can't use a private endpoint. The security team approved another control that meets the intent of the definition for this account. RG-Legacy contains other storage accounts that must remain evaluated.

    You need stlegacy01 to stop being reported as non-compliant for that definition, with the reason documented, while all the other definitions of the initiative still apply to it.

    What should you recommend?
  fr: |
    Fabrikam, Inc. a attribué une initiative Azure Policy à un groupe d'administration. L'une des définitions exige que les comptes de stockage utilisent des points de terminaison privés.

    Un compte de stockage nommé stlegacy01 dans un groupe de ressources nommé RG-Legacy ne peut pas utiliser de point de terminaison privé. L'équipe de sécurité a approuvé un autre contrôle qui répond à l'intention de la définition pour ce compte. RG-Legacy contient d'autres comptes de stockage qui doivent rester évalués.

    Vous devez faire en sorte que stlegacy01 ne soit plus signalé comme non conforme pour cette définition, avec la raison documentée, tout en restant soumis à toutes les autres définitions de l'initiative.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An exemption of stlegacy01 for that definition, in the Waiver category", fr: "Une exemption de stlegacy01 pour cette définition, dans la catégorie Waiver" } }
    - { id: b, text: { en: "An exemption of stlegacy01 for that definition, in the Mitigated category", fr: "Une exemption de stlegacy01 pour cette définition, dans la catégorie Mitigated" } }
    - { id: c, text: { en: "An exclusion of RG-Legacy in the initiative assignment", fr: "Une exclusion de RG-Legacy dans l'attribution de l'initiative" } }
    - { id: d, text: { en: "The enforcement mode of the initiative assignment set to Disabled", fr: "Le mode d'application de l'attribution de l'initiative défini sur Disabled" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An exemption can target one resource and selected definitions of an initiative, and it records a category and a description. The Mitigated category means the policy intent is met through another method, which is the case here. Waiver means the non-compliance is accepted temporarily, which doesn't describe an approved compensating control.
    fr: |
      Une exemption peut cibler une seule ressource et des définitions choisies d'une initiative, et elle enregistre une catégorie et une description. La catégorie Mitigated signifie que l'intention de la stratégie est satisfaite par une autre méthode, ce qui est le cas ici. Waiver signifie que la non-conformité est acceptée temporairement, ce qui ne décrit pas un contrôle compensatoire approuvé.
  options:
    a:
      en: "Waiver records that the non-compliance is temporarily accepted, not that another control meets the intent."
      fr: "Waiver indique que la non-conformité est acceptée temporairement, pas qu'un autre contrôle répond à l'intention."
    c:
      en: "An exclusion removes the whole resource group from every definition of the initiative, including the other storage accounts, and documents no reason."
      fr: "Une exclusion retire tout le groupe de ressources de toutes les définitions de l'initiative, y compris les autres comptes de stockage, et ne documente aucune raison."
    d:
      en: "The enforcement mode affects every resource in the assignment scope and doesn't change how stlegacy01's compliance is reported."
      fr: "Le mode d'application concerne toutes les ressources de l'étendue de l'attribution et ne change pas la façon dont la conformité de stlegacy01 est signalée."
references:
  - title: Details of the policy exemption structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure
