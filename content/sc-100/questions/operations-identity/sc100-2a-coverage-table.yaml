id: sc100-2a-coverage-table
objective: "2.1.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Sentinel. You summarize the following data from the MITRE ATT&CK page for four techniques that the threat intelligence team considers a priority. The third column counts the analytics rules that are enabled; the fourth counts the available rule templates that aren't enabled.

    Answer each prompt by selecting the appropriate technique.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Sentinel. Vous résumez les données suivantes de la page MITRE ATT&CK pour quatre techniques que l'équipe de renseignement sur les menaces considère comme prioritaires. La troisième colonne compte les règles d'analyse activées ; la quatrième compte les modèles de règles disponibles qui ne sont pas activés.

    Répondez à chaque consigne en sélectionnant la technique appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The technique whose gap you can close fastest by enabling existing templates", fr: "La technique dont vous pouvez combler le plus vite la lacune en activant des modèles existants" }
    - id: p2
      text: { en: "The technique that requires writing a new custom detection to be covered", fr: "La technique qui exige l'écriture d'une nouvelle détection personnalisée pour être couverte" }
  grid:
    header: [{ en: "Technique", fr: "Technique" }, { en: "Tactic", fr: "Tactique" }, { en: "Enabled rules", fr: "Règles activées" }, { en: "Templates not enabled", fr: "Modèles non activés" }]
    rows:
      - [{ text: "T1566 Phishing", area: t1566 }, { text: "Initial Access" }, { text: "4" }, { text: "2" }]
      - [{ text: "T1110 Brute Force", area: t1110 }, { text: "Credential Access" }, { text: "0" }, { text: "3" }]
      - [{ text: "T1486 Data Encrypted for Impact", area: t1486 }, { text: "Impact" }, { text: "2" }, { text: "0" }]
      - [{ text: "T1199 Trusted Relationship", area: t1199 }, { text: "Initial Access" }, { text: "0" }, { text: "0" }]
answer:
  values: { p1: t1110, p2: t1199 }
explanation:
  correct:
    en: |
      Brute Force has no enabled rule but three available templates: enabling them, after checking that their data sources are connected, closes the gap without development. Trusted Relationship has neither an enabled rule nor a template, so covering it requires a new custom analytics rule. Phishing and Data Encrypted for Impact already have active detections.
    fr: |
      Brute Force n'a aucune règle activée mais trois modèles disponibles : les activer, après avoir vérifié que leurs sources de données sont connectées, comble la lacune sans développement. Trusted Relationship n'a ni règle activée ni modèle : le couvrir exige une nouvelle règle d'analyse personnalisée. Phishing et Data Encrypted for Impact ont déjà des détections actives.
references:
  - title: View MITRE ATT&CK Coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
