id: sc100-2c-comp-control-tools
objective: "2.4.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft 365 E5 and Azure. The compliance team translated its obligations into the controls in the answer area.

    Which solution should implement each control? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft 365 E5 et Azure. L'équipe de conformité a traduit ses obligations en contrôles, qui figurent dans la zone de réponse.

    Quelle solution doit implémenter chaque contrôle ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Prevent the deployment of Azure resources outside the approved regions: [[region]]

      Detect employees who download large volumes of confidential files before they leave the company: [[insider]]

      Track the implementation of the organizational and technical controls of ISO/IEC 27001, with owners and evidence: [[track]]
    fr: |
      Empêcher le déploiement de ressources Azure en dehors des régions approuvées : [[region]]

      Détecter les employés qui téléchargent de gros volumes de fichiers confidentiels avant de quitter l'entreprise : [[insider]]

      Suivre l'implémentation des contrôles organisationnels et techniques d'ISO/IEC 27001, avec des propriétaires et des preuves : [[track]]
  slots:
    - id: region
      options:
        - { id: policy, text: "Azure Policy" }
        - { id: irm, text: "Microsoft Purview Insider Risk Management" }
        - { id: cm, text: "Microsoft Purview Compliance Manager" }
        - { id: cc, text: "Microsoft Purview Communication Compliance" }
        - { id: mdc, text: { en: "Defender for Cloud regulatory compliance", fr: "Conformité réglementaire de Defender pour le cloud" } }
    - id: insider
      options:
        - { id: policy, text: "Azure Policy" }
        - { id: irm, text: "Microsoft Purview Insider Risk Management" }
        - { id: cm, text: "Microsoft Purview Compliance Manager" }
        - { id: cc, text: "Microsoft Purview Communication Compliance" }
        - { id: mdc, text: { en: "Defender for Cloud regulatory compliance", fr: "Conformité réglementaire de Defender pour le cloud" } }
    - id: track
      options:
        - { id: policy, text: "Azure Policy" }
        - { id: irm, text: "Microsoft Purview Insider Risk Management" }
        - { id: cm, text: "Microsoft Purview Compliance Manager" }
        - { id: cc, text: "Microsoft Purview Communication Compliance" }
        - { id: mdc, text: { en: "Defender for Cloud regulatory compliance", fr: "Conformité réglementaire de Defender pour le cloud" } }
answer:
  values: { region: policy, insider: irm, track: cm }
explanation:
  correct:
    en: |
      An Azure Policy allowed locations definition with the deny effect is a preventive control that blocks deployments outside the approved regions. The Data theft by departing users template of Insider Risk Management detects the activities typical of that theft, with an HR connector for the departure signal. Compliance Manager assessments group the controls of a regulation or standard, with improvement actions assigned to owners and evidence attached.
    fr: |
      Une définition Azure Policy d'emplacements autorisés avec l'effet deny est un contrôle préventif qui bloque les déploiements hors des régions approuvées. Le modèle Data theft by departing users d'Insider Risk Management détecte les activités typiques de ce vol, avec un connecteur RH pour le signal de départ. Les évaluations du Gestionnaire de conformité regroupent les contrôles d'une réglementation ou d'une norme, avec des actions d'amélioration attribuées à des propriétaires et des preuves jointes.
  options:
    mdc:
      en: "Defender for Cloud regulatory compliance reports whether resources pass the automated technical checks of a standard; it doesn't block deployments or track organizational controls with owners."
      fr: "La conformité réglementaire de Defender pour le cloud indique si les ressources réussissent les vérifications techniques automatisées d'une norme ; elle ne bloque pas les déploiements et ne suit pas les contrôles organisationnels avec des propriétaires."
    cc:
      en: "Communication Compliance detects inappropriate or non-compliant messages; it doesn't track file downloads by departing employees."
      fr: "Communication Compliance détecte les messages inappropriés ou non conformes ; il ne suit pas les téléchargements de fichiers par les employés sur le départ."
references:
  - title: Learn about Insider Risk Management
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
