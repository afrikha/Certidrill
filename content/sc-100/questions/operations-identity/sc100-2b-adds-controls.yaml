id: sc100-2b-adds-controls
objective: "2.2.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is specifying the controls that will harden its AD DS environment. The domain controllers and member servers run Windows Server 2022 with current updates.

    Which control should you specify for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders spécifie les contrôles qui sécuriseront son environnement AD DS. Les contrôleurs de domaine et les serveurs membres exécutent Windows Server 2022 avec les mises à jour actuelles.

    Quel contrôle devez-vous spécifier pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: laps, text: Windows LAPS }
    - { id: gmsa, text: { en: "Group managed service accounts (gMSAs)", fr: "Comptes de service administrés de groupe (gMSA)" } }
    - { id: pu, text: { en: "Protected Users group", fr: "Groupe Protected Users" } }
    - { id: mdi, text: Microsoft Defender for Identity }
    - { id: health, text: Microsoft Entra Connect Health }
  targets:
    - { id: t1, text: { en: "Each member server has a unique, regularly rotated local administrator password", fr: "Chaque serveur membre a un mot de passe d'administrateur local unique, renouvelé régulièrement" } }
    - { id: t2, text: { en: "A service that runs on a four-server farm uses one identity whose password Windows manages", fr: "Un service qui s'exécute sur une batterie de quatre serveurs utilise une seule identité dont Windows gère le mot de passe" } }
    - { id: t3, text: { en: "Administrator credentials aren't cached on hosts and can't be used with NTLM", fr: "Les informations d'identification des administrateurs ne sont pas mises en cache sur les hôtes et ne peuvent pas être utilisées avec NTLM" } }
    - { id: t4, text: { en: "Identity misconfigurations are reported as posture assessments in Microsoft Secure Score", fr: "Les erreurs de configuration des identités sont signalées sous forme d'évaluations de la posture dans Microsoft Secure Score" } }
answer:
  mapping: { t1: laps, t2: gmsa, t3: pu, t4: mdi }
explanation:
  correct:
    en: |-
      Windows LAPS rotates and backs up a unique local administrator password for each device. A gMSA gives a server farm one service identity whose password Windows computes and changes. Protected Users stops credential caching and NTLM for its members. Defender for Identity sensors produce security posture assessments in Microsoft Secure Score.
    fr: |-
      Windows LAPS renouvelle et sauvegarde un mot de passe d'administrateur local unique pour chaque appareil. Un gMSA donne à une batterie de serveurs une seule identité de service dont Windows calcule et change le mot de passe. Protected Users empêche la mise en cache des informations d'identification et NTLM pour ses membres. Les capteurs Defender for Identity produisent des évaluations de la posture de sécurité dans Microsoft Secure Score.
  options:
    health: { en: "Connect Health monitors the health of the synchronization and AD FS infrastructure; it doesn't produce security posture assessments.", fr: "Connect Health surveille l'intégrité de la synchronisation et de l'infrastructure AD FS ; il ne produit pas d'évaluations de la posture de sécurité." }
references:
  - title: What is Windows LAPS?
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview
  - title: Group Managed Service Accounts overview
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/group-managed-service-accounts-overview
