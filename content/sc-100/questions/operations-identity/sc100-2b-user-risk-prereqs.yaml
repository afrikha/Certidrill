id: sc100-2b-user-risk-prereqs
objective: "2.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation synchronizes its AD DS users to Microsoft Entra ID with password hash synchronization and has Microsoft Entra ID P2 licenses. Adatum plans a Conditional Access policy for high user risk that requires risk remediation.

    Users who sign in with a password and are flagged at high user risk, for example because of leaked credentials, must regain access by themselves, through a secure password change, without contacting the help desk.

    Which two prerequisites should you include in the design? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation synchronise ses utilisateurs AD DS avec Microsoft Entra ID par la synchronisation du hachage de mot de passe et dispose de licences Microsoft Entra ID P2. Adatum prévoit une stratégie d'accès conditionnel pour un risque utilisateur élevé qui exige la correction du risque.

    Les utilisateurs qui se connectent par mot de passe et sont signalés avec un risque utilisateur élevé, par exemple à cause d'informations d'identification divulguées, doivent retrouver l'accès par eux-mêmes, par un changement de mot de passe sécurisé, sans contacter le support.

    Quelles sont les deux conditions préalables à inclure dans la conception ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Switch the domain to pass-through authentication", fr: "Basculer le domaine vers l'authentification directe" } }
    - { id: b, text: { en: "Register users for Microsoft Entra MFA before they are at risk", fr: "Inscrire les utilisateurs à la MFA Microsoft Entra avant qu'ils ne soient à risque" } }
    - { id: c, text: { en: "Add a sign-in risk condition to the same policy", fr: "Ajouter une condition de risque de connexion à la même stratégie" } }
    - { id: d, text: { en: "Enable Seamless single sign-on for the domain", fr: "Activer l'authentification unique fluide pour le domaine" } }
    - { id: e, text: { en: "Enable password writeback in the synchronization", fr: "Activer la réécriture du mot de passe dans la synchronisation" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Users must already be registered for Microsoft Entra MFA, because the secure password change happens after a successful MFA; unregistered users are blocked and need an administrator. For hybrid users, password writeback must be enabled so that the new password is written to AD DS.
    fr: |-
      Les utilisateurs doivent déjà être inscrits à la MFA Microsoft Entra, car le changement de mot de passe sécurisé se fait après une MFA réussie ; les utilisateurs non inscrits sont bloqués et ont besoin d'un administrateur. Pour les utilisateurs hybrides, la réécriture du mot de passe doit être activée afin que le nouveau mot de passe soit écrit dans AD DS.
  options:
    a: { en: "Pass-through authentication isn't required; password hash synchronization is also what ID Protection uses to detect leaked credentials.", fr: "L'authentification directe n'est pas nécessaire ; la synchronisation du hachage de mot de passe est d'ailleurs ce qu'utilise ID Protection pour détecter les informations d'identification divulguées." }
    c: { en: "Microsoft recommends separate policies for sign-in risk and user risk, not one policy that combines both conditions.", fr: "Microsoft recommande des stratégies distinctes pour le risque de connexion et le risque utilisateur, et non une stratégie qui combine les deux conditions." }
    d: { en: "Seamless SSO changes the sign-in experience on domain-joined devices; it isn't needed for risk remediation.", fr: "L'authentification unique fluide change l'expérience de connexion sur les appareils joints au domaine ; elle n'est pas nécessaire à la correction du risque." }
references:
  - title: Risk policies
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-configure-risk-policies
