id: sc100-2b-joiner-leaver-workflows
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders provisions employees from its HR system into Microsoft Entra ID and has Microsoft Entra ID Governance licenses. Today, IT staff perform onboarding and offboarding tasks by hand, and some tasks are forgotten.

    You need to recommend a solution that, a few days before a new employee's start date, generates a Temporary Access Pass and emails it to the employee's manager, and that runs offboarding tasks automatically on the employee's last day. The solution must minimize custom development.

    What should you recommend?
  fr: |
    Northwind Traders provisionne ses employés depuis son système RH vers Microsoft Entra ID et dispose de licences Microsoft Entra ID Governance. Aujourd'hui, le personnel informatique effectue à la main les tâches d'arrivée et de départ, et certaines tâches sont oubliées.

    Vous devez recommander une solution qui, quelques jours avant la date d'arrivée d'un nouvel employé, génère un Temporary Access Pass et l'envoie par e-mail au responsable de l'employé, et qui exécute automatiquement les tâches de départ le dernier jour de l'employé. La solution doit réduire au minimum le développement personnalisé.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Entitlement management with automatic assignment policies", fr: "La gestion des droits d'utilisation avec des stratégies d'attribution automatique" } }
    - { id: b, text: { en: "Lifecycle workflows in Microsoft Entra ID Governance", fr: "Les workflows de cycle de vie de Microsoft Entra ID Governance" } }
    - { id: c, text: { en: "Recurring access reviews of group memberships", fr: "Des révisions d'accès récurrentes des appartenances aux groupes" } }
    - { id: d, text: { en: "PIM for Groups with time-bound eligible memberships", fr: "PIM for Groups avec des appartenances éligibles limitées dans le temps" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Lifecycle workflows automate tasks at key events of the identity lifecycle, such as before a start date, when a status changes and at departure. A typical joiner task emails a Temporary Access Pass to the new user's manager, and leaver tasks run on the last day without custom code.
    fr: |-
      Les workflows de cycle de vie automatisent des tâches aux moments clés du cycle de vie des identités, comme avant une date d'arrivée, lors d'un changement de statut et au départ. Une tâche d'arrivée typique envoie un Temporary Access Pass par e-mail au responsable du nouvel utilisateur, et les tâches de départ s'exécutent le dernier jour, sans code personnalisé.
  options:
    a: { en: "Automatic assignment policies grant or remove access packages based on attributes; they don't generate a Temporary Access Pass or email it.", fr: "Les stratégies d'attribution automatique accordent ou retirent des packages d'accès selon des attributs ; elles ne génèrent pas de Temporary Access Pass et ne l'envoient pas par e-mail." }
    c: { en: "Access reviews recertify existing access periodically; they don't run tasks at a start date or a last day.", fr: "Les révisions d'accès recertifient périodiquement l'accès existant ; elles n'exécutent pas de tâches à une date d'arrivée ou un dernier jour." }
    d: { en: "PIM for Groups controls when a group membership is active, not onboarding or offboarding tasks.", fr: "PIM for Groups contrôle le moment où une appartenance à un groupe est active, pas les tâches d'arrivée ou de départ." }
references:
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
