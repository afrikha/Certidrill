id: sc100-2a-detection-stack-map
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has Microsoft 365 E5 with all the Microsoft Defender XDR workloads deployed. It also uses a third-party VPN appliance that sends Syslog messages, and firewalls whose logs must be kept for seven years for occasional forensic investigations.

    You need to recommend which solution meets each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose de Microsoft 365 E5 avec toutes les charges de travail Microsoft Defender XDR déployées. Elle utilise aussi une appliance VPN tierce qui envoie des messages Syslog, et des pare-feu dont les journaux doivent être conservés sept ans pour des investigations forensiques occasionnelles.

    Vous devez recommander la solution qui répond à chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Investigate a phishing email that led to a compromised device and a stolen session: [[s1]]

      Correlate the VPN appliance logs with Microsoft Entra sign-in events: [[s2]]

      Keep the firewall logs for seven years at the lowest cost: [[s3]]
    fr: |
      Investiguer un e-mail d'hameçonnage qui a conduit à un appareil compromis et à une session volée : [[s1]]

      Corréler les journaux de l'appliance VPN avec les événements de connexion Microsoft Entra : [[s2]]

      Conserver les journaux de pare-feu sept ans au moindre coût : [[s3]]
  slots:
    - id: s1
      options:
        - { id: xdr, text: { en: "Microsoft Defender XDR incidents", fr: "Les incidents Microsoft Defender XDR" } }
        - { id: mdc, text: { en: "Microsoft Defender for Cloud alerts", fr: "Les alertes Microsoft Defender pour le cloud" } }
        - { id: audit, text: { en: "Microsoft Purview Audit (Standard)", fr: "Microsoft Purview Audit (Standard)" } }
    - id: s2
      options:
        - { id: sentinel, text: { en: "Microsoft Sentinel analytics rules", fr: "Les règles d'analyse Microsoft Sentinel" } }
        - { id: idp, text: { en: "Microsoft Entra ID Protection", fr: "Microsoft Entra ID Protection" } }
        - { id: mdca, text: { en: "Microsoft Defender for Cloud Apps app connectors", fr: "Les connecteurs d'applications de Microsoft Defender for Cloud Apps" } }
    - id: s3
      options:
        - { id: analytics, text: { en: "The Sentinel analytics tier with maximum retention", fr: "Le niveau Analytique de Sentinel avec la rétention maximale" } }
        - { id: lake, text: { en: "The Sentinel data lake tier", fr: "Le niveau Lac de données de Sentinel" } }
        - { id: audit10, text: { en: "Audit (Premium) with the 10-Year Audit Log Retention add-on", fr: "Audit (Premium) avec le module complémentaire 10-Year Audit Log Retention" } }
answer:
  values: { s1: xdr, s2: sentinel, s3: lake }
explanation:
  correct:
    en: |
      Defender XDR correlates the email, endpoint and identity signals of the Defender products into one incident. A non-Microsoft Syslog source correlated with Microsoft Entra sign-ins requires the Sentinel SIEM and its analytics rules. The Sentinel data lake tier keeps data for up to 12 years at low cost for occasional queries, whereas the analytics tier is designed for real-time detection and keeps data for a shorter period.
    fr: |
      Defender XDR corrèle les signaux de messagerie, de points de terminaison et d'identité des produits Defender en un seul incident. Une source Syslog non Microsoft corrélée avec les connexions Microsoft Entra exige le SIEM Sentinel et ses règles d'analyse. Le niveau Lac de données de Sentinel conserve les données jusqu'à 12 ans à faible coût pour des requêtes occasionnelles, alors que le niveau Analytique est conçu pour la détection en temps réel et conserve les données moins longtemps.
  options:
    audit10:
      en: Purview Audit retention applies to Microsoft 365 audit records, not to firewall logs.
      fr: La rétention de Purview Audit s'applique aux enregistrements d'audit Microsoft 365, pas aux journaux de pare-feu.
    mdca:
      en: App connectors of Defender for Cloud Apps connect SaaS applications through their APIs; they don't ingest Syslog from a VPN appliance for correlation.
      fr: Les connecteurs d'applications de Defender for Cloud Apps connectent des applications SaaS au moyen de leurs API ; ils n'ingèrent pas le Syslog d'une appliance VPN à des fins de corrélation.
references:
  - title: Microsoft Sentinel data lake overview
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-lake-overview
  - title: Microsoft Sentinel in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/microsoft-sentinel-defender-portal
