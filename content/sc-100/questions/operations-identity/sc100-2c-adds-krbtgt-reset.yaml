id: sc100-2c-adds-krbtgt-reset
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's incident response team confirms that an attacker ran DCSync against an Active Directory Domain Services (AD DS) domain and obtained the password hash of the krbtgt account. The attacker's access to the domain controllers has been removed, and the ticket lifetime policies use the default values.

    You need to recommend an action that invalidates any Kerberos ticket the attacker could forge with the stolen key, without disrupting replication between the domain controllers.

    What should you recommend?
  fr: |
    L'équipe de réponse aux incidents de Woodgrove Bank confirme qu'un attaquant a exécuté DCSync sur un domaine Active Directory Domain Services (AD DS) et obtenu le hachage du mot de passe du compte krbtgt. L'accès de l'attaquant aux contrôleurs de domaine a été supprimé, et les stratégies de durée de vie des tickets utilisent les valeurs par défaut.

    Vous devez recommander une action qui invalide tout ticket Kerberos que l'attaquant pourrait forger avec la clé volée, sans perturber la réplication entre les contrôleurs de domaine.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Reset the passwords of all the members of the Domain Admins and Enterprise Admins groups", fr: "Réinitialiser les mots de passe de tous les membres des groupes Domain Admins et Enterprise Admins" } }
    - { id: b, text: { en: "Reset the krbtgt password once, and then force replication to all the domain controllers", fr: "Réinitialiser une fois le mot de passe krbtgt, puis forcer la réplication vers tous les contrôleurs de domaine" } }
    - { id: c, text: { en: "Reset the krbtgt password twice, and wait at least 10 hours between the two resets", fr: "Réinitialiser deux fois le mot de passe krbtgt, en attendant au moins 10 heures entre les deux réinitialisations" } }
    - { id: d, text: { en: "Add all the administrative accounts to the Protected Users group", fr: "Ajouter tous les comptes d'administration au groupe Protected Users" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The krbtgt account keeps its two most recent passwords, so tickets signed with the stolen key stay valid after a single reset. A second reset removes the old key from the history. Waiting longer than the maximum ticket lifetime (10 hours by default) between the resets lets legitimate tickets expire and replication complete, so domain controllers don't fail to replicate with an old password.
    fr: |
      Le compte krbtgt conserve ses deux mots de passe les plus récents : les tickets signés avec la clé volée restent valides après une seule réinitialisation. Une deuxième réinitialisation retire l'ancienne clé de l'historique. Attendre plus que la durée de vie maximale des tickets (10 heures par défaut) entre les réinitialisations laisse expirer les tickets légitimes et la réplication se terminer, pour qu'aucun contrôleur de domaine ne tente de répliquer avec un ancien mot de passe.
  options:
    a:
      en: "Golden Tickets are signed with the krbtgt key, not with the administrators' passwords; changing those passwords doesn't invalidate the forged tickets."
      fr: "Les Golden Tickets sont signés avec la clé krbtgt, pas avec les mots de passe des administrateurs ; changer ces mots de passe n'invalide pas les tickets forgés."
    b:
      en: "After one reset, the previous key is still in the password history, so tickets forged with the stolen hash are still accepted."
      fr: "Après une seule réinitialisation, la clé précédente est toujours dans l'historique des mots de passe : les tickets forgés avec le hachage volé sont encore acceptés."
    d:
      en: "Protected Users restricts how its members authenticate; it doesn't change the key that signs forged tickets."
      fr: "Protected Users restreint la façon dont ses membres s'authentifient ; il ne change pas la clé qui signe les tickets forgés."
references:
  - title: AD Forest Recovery - Reset the krbtgt password
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/forest-recovery-guide/ad-forest-recovery-reset-the-krbtgt-password
