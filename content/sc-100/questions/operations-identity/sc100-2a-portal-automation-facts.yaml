id: sc100-2a-portal-automation-facts
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is onboarding its Microsoft Sentinel workspace to the Microsoft Defender portal. The workspace has automation rules with incident triggers and alert triggers, and several playbooks.

    You are reviewing the automation design for the Defender portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. intègre son espace de travail Microsoft Sentinel au portail Microsoft Defender. L'espace de travail contient des règles d'automatisation avec des déclencheurs d'incident et d'alerte, ainsi que plusieurs playbooks.

    Vous examinez la conception de l'automatisation pour le portail Defender.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An existing automation rule with an incident trigger runs on incidents that contain only Defender XDR alerts.
        fr: Une règle d'automatisation existante avec un déclencheur d'incident s'exécute sur des incidents qui ne contiennent que des alertes Defender XDR.
    - id: s2
      text:
        en: An automation rule with the standard alert created trigger runs on Microsoft Defender for Endpoint alerts.
        fr: Une règle d'automatisation avec le déclencheur standard de création d'alerte s'exécute sur les alertes Microsoft Defender for Endpoint.
    - id: s3
      text:
        en: An automation rule with an incident trigger can run a playbook that is based on the alert trigger.
        fr: Une règle d'automatisation avec un déclencheur d'incident peut exécuter un playbook basé sur le déclencheur d'alerte.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      In the Defender portal, all incidents have Microsoft XDR as their provider and existing incident-trigger rules run on both Sentinel and Defender XDR incidents. Alert-trigger rules act only on Sentinel alerts; Defender XDR alerts require the Enhanced Alert Trigger. Incident-trigger rules can run only incident-trigger playbooks, and alert-trigger rules only alert-trigger playbooks.
    fr: |
      Dans le portail Defender, tous les incidents ont Microsoft XDR comme fournisseur, et les règles existantes à déclencheur d'incident s'exécutent sur les incidents Sentinel comme Defender XDR. Les règles à déclencheur d'alerte n'agissent que sur les alertes Sentinel ; les alertes Defender XDR exigent l'Enhanced Alert Trigger. Les règles à déclencheur d'incident ne peuvent exécuter que des playbooks à déclencheur d'incident, et les règles à déclencheur d'alerte que des playbooks à déclencheur d'alerte.
references:
  - title: Transition your Microsoft Sentinel environment to the Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
