id: sc100-2c-purview-compliance-score
objective: "2.4.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Purview Compliance Manager to track its progress on the EU GDPR and ISO/IEC 27001 and on an internal security policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise le Gestionnaire de conformité Microsoft Purview pour suivre sa progression sur le RGPD de l'UE, ISO/IEC 27001 et une stratégie de sécurité interne.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An assessment that reaches a score of 100 percent certifies Northwind for the regulation."
        fr: "Une évaluation qui atteint un score de 100 % certifie Northwind pour la réglementation."
    - id: s2
      text:
        en: "The compliance score gives more points to improvement actions that address a higher risk."
        fr: "Le score de conformité accorde plus de points aux actions d'amélioration qui traitent un risque plus élevé."
    - id: s3
      text:
        en: "Northwind can build an assessment for its internal security policy from a custom template."
        fr: "Northwind peut créer une évaluation pour sa stratégie de sécurité interne à partir d'un modèle personnalisé."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The compliance score is a risk-based score that awards points for completed improvement actions, with an impact that depends on the action's risk; it measures progress, not certification, which only an auditor can grant. Compliance Manager offers more than 360 regulatory templates, and organizations can create custom templates, for example for internal policies.
    fr: |
      Le score de conformité est un score basé sur le risque qui accorde des points pour les actions d'amélioration terminées, avec un impact qui dépend du risque de l'action ; il mesure une progression, pas une certification, que seul un auditeur peut accorder. Le Gestionnaire de conformité propose plus de 360 modèles réglementaires, et les organisations peuvent créer des modèles personnalisés, par exemple pour des stratégies internes.
  options:
    s1:
      en: "The score shows how far the recommended actions are implemented; it isn't a certification."
      fr: "Le score montre où en est l'implémentation des actions recommandées ; ce n'est pas une certification."
references:
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
