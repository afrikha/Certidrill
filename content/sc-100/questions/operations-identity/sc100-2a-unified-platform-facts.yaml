id: sc100-2a-unified-platform-facts
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Sentinel in the Azure portal, with the Fusion rule and Microsoft incident creation rules enabled. Some business units don't have Microsoft Defender XDR licenses.

    You plan to recommend that Woodgrove onboard its Sentinel workspace to the Microsoft Defender portal (unified security operations platform).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Sentinel dans le portail Azure, avec la règle Fusion et les règles de création d'incidents Microsoft activées. Certaines divisions n'ont pas de licences Microsoft Defender XDR.

    Vous prévoyez de recommander à Woodgrove d'intégrer son espace de travail Sentinel au portail Microsoft Defender (plateforme d'opérations de sécurité unifiée).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After onboarding, the Fusion rule keeps creating incidents from its own correlations.
        fr: Après l'intégration, la règle Fusion continue de créer des incidents à partir de ses propres corrélations.
    - id: s2
      text:
        en: Microsoft Sentinel can be used in the Defender portal even by organizations without Defender XDR or an E5 license.
        fr: Microsoft Sentinel peut être utilisé dans le portail Defender même par des organisations sans Defender XDR ni licence E5.
    - id: s3
      text:
        en: Staying in the Azure portal is a long-term option, because Sentinel remains supported there after March 31, 2027.
        fr: Rester dans le portail Azure est une option à long terme, car Sentinel y reste pris en charge après le 31 mars 2027.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Onboarding disables the Fusion rule; the Defender XDR correlation engine replaces it, and Microsoft incident creation rules are deactivated to avoid duplicates. Sentinel is generally available in the Defender portal, including for customers without Defender XDR or an E5 license, although some capabilities then are limited. After March 31, 2027, Sentinel is no longer supported in the Azure portal and is available only in the Defender portal.
    fr: |
      L'intégration désactive la règle Fusion ; le moteur de corrélation de Defender XDR la remplace, et les règles de création d'incidents Microsoft sont désactivées pour éviter les doublons. Sentinel est en disponibilité générale dans le portail Defender, y compris pour les clients sans Defender XDR ni licence E5, même si certaines fonctionnalités sont alors limitées. Après le 31 mars 2027, Sentinel n'est plus pris en charge dans le portail Azure et n'est disponible que dans le portail Defender.
references:
  - title: Transition your Microsoft Sentinel environment to the Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
  - title: Microsoft Sentinel in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/microsoft-sentinel-defender-portal
