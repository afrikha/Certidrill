id: sc100-2c-comp-control-framework
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. runs regulated workloads in Azure and AWS. The compliance team must derive the technical security controls for the workloads from a single set of prescriptive recommendations whose controls are already mapped to CIS Controls, NIST and PCI DSS. The team wants to monitor these controls in the regulatory compliance dashboard of Microsoft Defender for Cloud.

    What should the team use?
  fr: |
    Fabrikam, Inc. exécute des charges de travail réglementées dans Azure et AWS. L'équipe de conformité doit déduire les contrôles de sécurité techniques des charges de travail d'un seul ensemble de recommandations prescriptives dont les contrôles sont déjà mis en correspondance avec les CIS Controls, NIST et PCI DSS. L'équipe veut superviser ces contrôles dans le tableau de bord de conformité réglementaire de Microsoft Defender pour le cloud.

    Que doit utiliser l'équipe ?
body:
  options:
    - { id: a, text: { en: "The Microsoft Cybersecurity Reference Architectures (MCRA)", fr: "Les architectures de référence de cybersécurité Microsoft (MCRA)" } }
    - { id: b, text: { en: "The Microsoft cloud security benchmark (MCSB)", fr: "Le benchmark de sécurité cloud Microsoft (MCSB)" } }
    - { id: c, text: { en: "The Secure methodology of the Cloud Adoption Framework", fr: "La méthodologie Sécuriser du Cloud Adoption Framework" } }
    - { id: d, text: { en: "The security pillar of the Azure Well-Architected Framework", fr: "Le pilier Sécurité d'Azure Well-Architected Framework" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The MCSB provides prescriptive security recommendations for Azure and multicloud workloads, with controls pre-mapped to industry frameworks such as CIS Controls, NIST and PCI DSS. Its status is monitored in the Defender for Cloud regulatory compliance dashboard, which makes it the natural base for translating these requirements into controls.
    fr: |
      Le MCSB fournit des recommandations de sécurité prescriptives pour les charges de travail Azure et multicloud, avec des contrôles déjà mis en correspondance avec des référentiels du secteur comme les CIS Controls, NIST et PCI DSS. Son état se supervise dans le tableau de bord de conformité réglementaire de Defender pour le cloud, ce qui en fait la base naturelle pour traduire ces exigences en contrôles.
  options:
    a:
      en: "The MCRA are diagrams of Microsoft security capabilities and how they integrate; they aren't a control set mapped to CIS, NIST and PCI DSS."
      fr: "Les MCRA sont des diagrammes des capacités de sécurité Microsoft et de leur intégration ; ce n'est pas un ensemble de contrôles mis en correspondance avec CIS, NIST et PCI DSS."
    c:
      en: "The Cloud Adoption Framework guides the security of the adoption journey; it isn't the control set that Defender for Cloud assesses."
      fr: "Le Cloud Adoption Framework guide la sécurité du parcours d'adoption ; ce n'est pas l'ensemble de contrôles qu'évalue Defender pour le cloud."
    d:
      en: "The security pillar gives design principles for a workload; it isn't a benchmark of controls mapped to regulatory frameworks."
      fr: "Le pilier Sécurité donne des principes de conception pour une charge de travail ; ce n'est pas un benchmark de contrôles mis en correspondance avec des référentiels réglementaires."
references:
  - title: Microsoft cloud security benchmark introduction
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/introduction
