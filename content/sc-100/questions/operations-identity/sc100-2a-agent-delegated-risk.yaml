id: sc100-2a-agent-delegated-risk
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has Microsoft 365 E7. An AI agent registered with Microsoft Entra Agent ID summarizes mailboxes for employees. It works only on behalf of the signed-in employee (delegated access) and has no application permissions of its own.

    The security team requires that mailbox access through the agent be blocked when Microsoft Entra ID Protection detects that the identity involved is likely compromised. A draft design proposes a Conditional Access policy that targets the agent identity and blocks high agent risk.

    What should you recommend instead?
  fr: |
    Litware, Inc. dispose de Microsoft 365 E7. Un agent IA inscrit avec Microsoft Entra Agent ID résume les boîtes aux lettres des employés. Il travaille uniquement au nom de l'employé connecté (accès délégué) et n'a aucune autorisation d'application propre.

    L'équipe de sécurité exige que l'accès aux boîtes aux lettres par l'agent soit bloqué quand Microsoft Entra ID Protection détecte que l'identité concernée est probablement compromise. Un projet de conception propose une stratégie d'accès conditionnel qui cible l'identité d'agent et bloque le risque d'agent élevé.

    Que devez-vous recommander à la place ?
body:
  options:
    - { id: a, text: { en: "A policy that targets the agent's user account and requires a compliant device", fr: "Une stratégie qui cible le compte d'utilisateur de l'agent et exige un appareil conforme" } }
    - { id: b, text: { en: "A policy that targets the agent identity blueprint and blocks high agent risk", fr: "Une stratégie qui cible le blueprint d'identité d'agent et bloque le risque d'agent élevé" } }
    - { id: c, text: { en: "A workload identity policy that blocks the risky service principals", fr: "Une stratégie d'identité de charge de travail qui bloque les principaux de service à risque" } }
    - { id: d, text: { en: "A policy that targets the employees and uses user risk and sign-in risk conditions", fr: "Une stratégie qui cible les employés et utilise des conditions de risque utilisateur et de risque de connexion" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With delegated (on-behalf-of) access, the token subject is the signed-in user, so Conditional Access evaluates policies that target users and groups. ID Protection also attributes risky activity in on-behalf-of flows to the user, not to the agent. A user-targeted policy with user risk and sign-in risk conditions therefore blocks the agent's access when the employee's identity is at risk; Microsoft 365 E7 includes the required Microsoft Entra ID P2 capabilities.
    fr: |
      Avec un accès délégué (on-behalf-of), le sujet du jeton est l'utilisateur connecté : l'accès conditionnel évalue donc les stratégies qui ciblent les utilisateurs et les groupes. ID Protection attribue aussi l'activité à risque des flux on-behalf-of à l'utilisateur, pas à l'agent. Une stratégie ciblant les utilisateurs avec des conditions de risque utilisateur et de risque de connexion bloque donc l'accès de l'agent quand l'identité de l'employé est à risque ; Microsoft 365 E7 inclut les fonctionnalités Microsoft Entra ID P2 nécessaires.
  options:
    a:
      en: |
        The agent doesn't act as an agent user in this scenario, and a compliant device requirement doesn't react to identity risk.
      fr: |
        L'agent n'agit pas en tant qu'utilisateur d'agent dans ce scénario, et l'exigence d'un appareil conforme ne réagit pas au risque d'identité.
    b:
      en: |
        Like the draft, a blueprint policy evaluates the agent identity, which isn't the token subject in delegated access.
      fr: |
        Comme le projet, une stratégie sur le blueprint évalue l'identité d'agent, qui n'est pas le sujet du jeton en accès délégué.
    c:
      en: |
        The agent isn't a traditional service principal, and in delegated access the evaluated identity is the user.
      fr: |
        L'agent n'est pas un principal de service traditionnel, et en accès délégué l'identité évaluée est l'utilisateur.
references:
  - title: Conditional Access for Agents in Microsoft Entra
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
  - title: ID Protection for agents
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-risky-agents
