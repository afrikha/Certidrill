id: sc100-2b-privileged-groups
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. is writing the hardening requirements of its AD DS forest. An assessment shows that the Domain Admins group has 18 permanent members. The members use these accounts for daily tasks such as resetting user passwords and joining computers to the domain.

    You need to specify a requirement that reduces the exposure of the most privileged groups.

    What should you include in the requirements?
  fr: |
    Fabrikam, Inc. rédige les exigences de sécurisation de sa forêt AD DS. Une évaluation montre que le groupe Domain Admins compte 18 membres permanents. Ces membres utilisent ces comptes pour des tâches quotidiennes comme la réinitialisation de mots de passe et la jonction d'ordinateurs au domaine.

    Vous devez spécifier une exigence qui réduit l'exposition des groupes les plus privilégiés.

    Que devez-vous inclure dans les exigences ?
body:
  options:
    - { id: a, text: { en: "Move the accounts to Enterprise Admins so that a single forest-level group is monitored", fr: "Déplacer les comptes vers Enterprise Admins pour ne surveiller qu'un seul groupe au niveau de la forêt" } }
    - { id: b, text: { en: "Rename the Domain Admins group and hide its membership from authenticated users", fr: "Renommer le groupe Domain Admins et masquer ses membres aux utilisateurs authentifiés" } }
    - { id: c, text: { en: "Keep the memberships and require 20-character passwords that expire every 30 days", fr: "Conserver les appartenances et exiger des mots de passe de 20 caractères qui expirent tous les 30 jours" } }
    - { id: d, text: { en: "Remove permanent membership and delegate the daily tasks with least-privilege rights", fr: "Supprimer l'appartenance permanente et déléguer les tâches quotidiennes avec des droits de moindre privilège" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Microsoft's best practices for securing Active Directory include eliminating permanent membership in highly privileged groups, granting temporary membership through controls when it is needed, and implementing a least-privilege, role-based administrative model. Privileged accounts must not be used for everyday tasks.
    fr: |-
      Les bonnes pratiques de Microsoft pour sécuriser Active Directory comprennent la suppression de l'appartenance permanente aux groupes hautement privilégiés, l'attribution d'une appartenance temporaire contrôlée quand elle est nécessaire, et un modèle d'administration basé sur les rôles et le moindre privilège. Les comptes privilégiés ne doivent pas servir aux tâches quotidiennes.
  options:
    a: { en: "Enterprise Admins is even more privileged than Domain Admins; moving the accounts increases exposure.", fr: "Enterprise Admins est encore plus privilégié que Domain Admins ; y déplacer les comptes augmente l'exposition." }
    b: { en: "Renaming or hiding the group doesn't reduce the number of privileged accounts or their use for daily tasks.", fr: "Renommer ou masquer le groupe ne réduit ni le nombre de comptes privilégiés ni leur utilisation pour les tâches quotidiennes." }
    c: { en: "Stronger passwords don't remove the standing privilege, and the accounts stay exposed on every machine they're used on.", fr: "Des mots de passe plus forts ne suppriment pas le privilège permanent, et les comptes restent exposés sur chaque machine où ils sont utilisés." }
references:
  - title: Best practices for securing Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
