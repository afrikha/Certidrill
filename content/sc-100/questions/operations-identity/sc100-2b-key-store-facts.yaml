id: sc100-2b-key-store-facts
objective: "2.2.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is reviewing its design for secrets, keys and certificates. Applications use Azure Key Vault for secrets and certificates, a Managed HSM pool holds the customer-managed keys of Azure services, and vault administrators must get just-in-time access.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. passe en revue sa conception des secrets, des clés et des certificats. Les applications utilisent Azure Key Vault pour les secrets et les certificats, un pool Managed HSM contient les clés gérées par le client des services Azure, et les administrateurs des coffres doivent obtenir un accès juste-à-temps.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The application certificates can be moved to the Managed HSM pool to protect them with a single-tenant HSM.
        fr: |-
          Les certificats des applications peuvent être déplacés dans le pool Managed HSM pour les protéger avec un HSM monolocataire.
    - id: s2
      text:
        en: |-
          The soft delete retention period of a key vault can be set between 7 and 90 days.
        fr: |-
          La période de rétention de la suppression réversible d'un coffre de clés peut être définie entre 7 et 90 jours.
    - id: s3
      text:
        en: |-
          With the Azure RBAC permission model, vault administrators can receive eligible role assignments that they activate through Privileged Identity Management.
        fr: |-
          Avec le modèle d'autorisation Azure RBAC, les administrateurs des coffres peuvent recevoir des attributions de rôle éligibles qu'ils activent par Privileged Identity Management.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      Managed HSM stores asymmetric and symmetric keys only, not certificates or secrets. Soft delete keeps deleted objects for a retention period of 7 to 90 days. Microsoft recommends the Azure RBAC permission model because legacy access policies don't support PIM; with RBAC, roles can be eligible and activated just in time with approval and MFA.
    fr: |-
      Managed HSM ne stocke que des clés asymétriques et symétriques, ni certificats ni secrets. La suppression réversible conserve les objets supprimés pendant une période de rétention de 7 à 90 jours. Microsoft recommande le modèle d'autorisation Azure RBAC, car les stratégies d'accès héritées ne prennent pas en charge PIM ; avec RBAC, les rôles peuvent être éligibles et activés juste-à-temps avec approbation et MFA.
references:
  - title: Secure your Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/best-practices
  - title: How to choose the right Azure key management solution
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management-choose
