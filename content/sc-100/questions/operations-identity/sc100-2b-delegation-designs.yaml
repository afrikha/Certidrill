id: sc100-2b-delegation-designs
objective: "2.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is redesigning the delegation of Microsoft Entra roles according to the enterprise access model and the principle of least privilege. Users are organized by country, and Microsoft Entra ID P2 licenses are available.

    Which design should you recommend for each requirement? To answer, drag the appropriate designs to the correct requirements. Each design may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation revoit la délégation des rôles Microsoft Entra selon le modèle d'accès d'entreprise et le principe du privilège minimum. Les utilisateurs sont organisés par pays, et des licences Microsoft Entra ID P2 sont disponibles.

    Quelle conception devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les conceptions appropriées vers les exigences correspondantes. Chaque conception peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: au, text: { en: "Helpdesk Administrator assigned at the scope of an administrative unit", fr: "Helpdesk Administrator attribué à l'étendue d'une unité administrative" } }
    - { id: pimg, text: { en: "PIM for Groups on a role-assignable group that holds the roles", fr: "PIM for Groups sur un groupe assignable à un rôle qui détient les rôles" } }
    - { id: app, text: { en: "Application Administrator assigned at the scope of one application", fr: "Application Administrator attribué à l'étendue d'une application" } }
    - { id: ga, text: { en: "Global Administrator as an eligible assignment in PIM", fr: "Global Administrator en attribution éligible dans PIM" } }
    - { id: uadm, text: { en: "User Administrator assigned at the tenant scope", fr: "User Administrator attribué à l'étendue du locataire" } }
  targets:
    - { id: t1, text: { en: "Help desk agents in Germany reset the passwords of German users only", fr: "Les agents du support en Allemagne réinitialisent les mots de passe des seuls utilisateurs allemands" } }
    - { id: t2, text: { en: "Cloud operators get the four Microsoft Entra roles they need with a single just-in-time activation", fr: "Les opérateurs cloud obtiennent les quatre rôles Microsoft Entra dont ils ont besoin par une seule activation juste-à-temps" } }
    - { id: t3, text: { en: "The CRM team manages the configuration of the CRM enterprise application and no other app", fr: "L'équipe CRM gère la configuration de l'application d'entreprise CRM et d'aucune autre application" } }
answer:
  mapping: { t1: au, t2: pimg, t3: app }
explanation:
  correct:
    en: |-
      An administrative unit restricts a role such as Helpdesk Administrator to a subset of users, such as one country. With PIM for Groups, a role-assignable group holds several roles permanently and users become eligible members, so one activation grants all the roles. Assigning Application Administrator at the scope of one application limits the team to that app.
    fr: |-
      Une unité administrative limite un rôle comme Helpdesk Administrator à un sous-ensemble d'utilisateurs, par exemple un pays. Avec PIM for Groups, un groupe assignable à un rôle détient plusieurs rôles de manière permanente et les utilisateurs en deviennent membres éligibles : une activation accorde tous les rôles. Attribuer Application Administrator à l'étendue d'une application limite l'équipe à cette application.
  options:
    ga: { en: "Global Administrator is never least privilege for these tasks, even when it's eligible.", fr: "Global Administrator n'est jamais le privilège minimum pour ces tâches, même en attribution éligible." }
    uadm: { en: "A tenant-scope User Administrator can manage every user, beyond one country, and more than passwords.", fr: "Un User Administrator à l'étendue du locataire peut gérer tous les utilisateurs, au-delà d'un pays, et plus que les mots de passe." }
references:
  - title: Best practices for Microsoft Entra roles
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/best-practices
