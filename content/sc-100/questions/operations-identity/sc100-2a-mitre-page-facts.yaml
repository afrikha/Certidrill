id: sc100-2a-mitre-page-facts
objective: "2.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. plans to use the MITRE ATT&CK page of Microsoft Sentinel to report detection coverage to its board every quarter. You are reviewing the assumptions of the reporting design.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. prévoit d'utiliser la page MITRE ATT&CK de Microsoft Sentinel pour présenter chaque trimestre la couverture de détection à son conseil d'administration. Vous examinez les hypothèses de la conception du rapport.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: By default, the page counts the scheduled and near-real-time analytics rules that are active in the workspace.
        fr: Par défaut, la page compte les règles d'analyse planifiées et en quasi-temps réel actives dans l'espace de travail.
    - id: s2
      text:
        en: Selecting the simulated coverage view enables the corresponding rule templates in the workspace.
        fr: Sélectionner la vue de couverture simulée active les modèles de règles correspondants dans l'espace de travail.
    - id: s3
      text:
        en: In MITRE ATT&CK, a tactic describes how an adversary performs an action, and a technique describes the adversary's goal.
        fr: Dans MITRE ATT&CK, une tactique décrit comment un adversaire réalise une action, et une technique décrit l'objectif de l'adversaire.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The matrix shows by default the scheduled and near-real-time rules currently active. Simulated coverage only displays the coverage the available detections would provide; it doesn't configure anything. In MITRE ATT&CK, the tactic is the adversary's goal (for example, credential access) and the technique is how the adversary achieves it.
    fr: |
      La matrice montre par défaut les règles planifiées et en quasi-temps réel actuellement actives. La couverture simulée ne fait qu'afficher la couverture que fourniraient les détections disponibles ; elle ne configure rien. Dans MITRE ATT&CK, la tactique est l'objectif de l'adversaire (par exemple, l'accès aux identifiants) et la technique est la façon dont il l'atteint.
references:
  - title: View MITRE ATT&CK Coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
