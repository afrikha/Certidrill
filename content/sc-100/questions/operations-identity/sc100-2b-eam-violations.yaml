id: sc100-2b-eam-violations
objective: "2.3.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. is auditing its privileged access against the enterprise access model before a Zero Trust assessment. The following table lists some of the current assignments. The Microsoft Entra Connect servers are member servers of the AD DS domain.

    Answer each prompt by selecting the identity in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. audite son accès privilégié par rapport au modèle d'accès d'entreprise avant une évaluation Confiance Zéro. Le tableau suivant liste certaines des attributions actuelles. Les serveurs Microsoft Entra Connect sont des serveurs membres du domaine AD DS.

    Répondez à chaque consigne en sélectionnant l'identité dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The assignment that lets management plane administrators take control of the control plane", fr: "L'attribution qui permet aux administrateurs du plan de gestion de prendre le contrôle du plan de contrôle" }
    - id: p2
      text: { en: "The assignment that exposes a Microsoft Entra privileged role to a compromise of AD DS", fr: "L'attribution qui expose un rôle privilégié Microsoft Entra à une compromission d'AD DS" }
  grid:
    header: [{ en: "Identity", fr: "Identité" }, { en: "Source", fr: "Source" }, { en: "Permission", fr: "Autorisation" }, { en: "Used from", fr: "Utilisée depuis" }]
    rows:
      - - { text: AdminOps1, area: r1 }
        - { text: { en: "Cloud-only", fr: "Cloud uniquement" } }
        - { text: { en: "Exchange Administrator, eligible in PIM", fr: "Exchange Administrator, éligible dans PIM" } }
        - { text: { en: "Privileged access workstation", fr: "Station de travail à accès privilégié" } }
      - - { text: SrvAdmins, area: r2 }
        - { text: { en: "AD DS group", fr: "Groupe AD DS" } }
        - { text: { en: "Local Administrators on all member servers", fr: "Administrateurs locaux sur tous les serveurs membres" } }
        - { text: { en: "Jump server", fr: "Serveur de rebond" } }
      - - { text: GA-Ann, area: r3 }
        - { text: { en: "Synchronized from AD DS", fr: "Synchronisé depuis AD DS" } }
        - { text: { en: "Global Administrator, eligible in PIM", fr: "Global Administrator, éligible dans PIM" } }
        - { text: { en: "Privileged access workstation", fr: "Station de travail à accès privilégié" } }
      - - { text: HelpdeskDE, area: r4 }
        - { text: { en: "Cloud-only group", fr: "Groupe cloud uniquement" } }
        - { text: { en: "Helpdesk Administrator scoped to the Germany administrative unit", fr: "Helpdesk Administrator limité à l'unité administrative Allemagne" } }
        - { text: { en: "Standard workstations", fr: "Postes de travail standard" } }
      - - { text: deploy-sp, area: r5 }
        - { text: { en: "Service principal", fr: "Principal de service" } }
        - { text: { en: "Contributor on the application subscription", fr: "Contributor sur l'abonnement de l'application" } }
        - { text: { en: "Deployment pipeline", fr: "Pipeline de déploiement" } }
answer:
  values: { p1: r2, p2: r3 }
explanation:
  correct:
    en: |-
      The enterprise access model enforces a hierarchy that prevents lower planes from controlling higher planes. SrvAdmins manages member servers (management plane), but the Microsoft Entra Connect servers are member servers that control identities (control plane), so server administrators can take control of identity. GA-Ann is synchronized from AD DS; Microsoft recommends cloud-only accounts for Microsoft Entra roles because a compromised on-premises account can compromise Microsoft Entra resources.
    fr: |-
      Le modèle d'accès d'entreprise impose une hiérarchie qui empêche les plans inférieurs de contrôler les plans supérieurs. SrvAdmins gère les serveurs membres (plan de gestion), mais les serveurs Microsoft Entra Connect sont des serveurs membres qui contrôlent les identités (plan de contrôle) : les administrateurs de serveurs peuvent donc prendre le contrôle de l'identité. GA-Ann est synchronisé depuis AD DS ; Microsoft recommande des comptes cloud uniquement pour les rôles Microsoft Entra, car un compte local compromis peut compromettre les ressources Microsoft Entra.
references:
  - title: Enterprise access model
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model
  - title: Best practices for Microsoft Entra roles
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/best-practices
