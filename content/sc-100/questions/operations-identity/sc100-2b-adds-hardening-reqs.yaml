id: sc100-2b-adds-hardening-reqs
objective: "2.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is writing the AD DS hardening specification for its Zero Trust program. A recent incident started on an administrator's laptop that was used both for email and for managing domain controllers. The specification must reduce credential theft and the ability of malware to run on the most critical systems.

    Which two requirements should you include in the specification? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation rédige la spécification de sécurisation d'AD DS de son programme Confiance Zéro. Un incident récent a commencé sur l'ordinateur portable d'un administrateur, utilisé à la fois pour la messagerie et pour gérer les contrôleurs de domaine. La spécification doit réduire le vol d'informations d'identification et la capacité des logiciels malveillants à s'exécuter sur les systèmes les plus critiques.

    Quelles sont les deux exigences à inclure dans la spécification ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the service accounts of domain controller applications to Protected Users", fr: "Ajouter les comptes de service des applications des contrôleurs de domaine à Protected Users" } }
    - { id: b, text: { en: "Use application allowlists on domain controllers and administrative hosts", fr: "Utiliser des listes d'autorisation d'applications sur les contrôleurs de domaine et les hôtes d'administration" } }
    - { id: c, text: { en: "Set one strong local Administrator password shared by all servers of a tier", fr: "Définir un mot de passe Administrator local fort, partagé par tous les serveurs d'un même tier" } }
    - { id: d, text: { en: "Manage domain controllers only from dedicated hosts without email or browsers", fr: "Gérer les contrôleurs de domaine uniquement depuis des hôtes dédiés, sans messagerie ni navigateur" } }
    - { id: e, text: { en: "Keep permanent Domain Admins membership for on-call engineers", fr: "Conserver l'appartenance permanente à Domain Admins pour les ingénieurs d'astreinte" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Microsoft's Active Directory best practices include application allowlists on domain controllers, administrative hosts and other sensitive systems, and secure administrative hosts that don't run email, web browsers or productivity software. A trusted system must never be administered from a less-trusted host, which is how the incident started.
    fr: |-
      Les bonnes pratiques Active Directory de Microsoft comprennent des listes d'autorisation d'applications sur les contrôleurs de domaine, les hôtes d'administration et les autres systèmes sensibles, et des hôtes d'administration sécurisés qui n'exécutent ni messagerie, ni navigateur web, ni logiciel de productivité. Un système approuvé ne doit jamais être administré depuis un hôte moins fiable, ce qui est l'origine de l'incident.
  options:
    a: { en: "Service and computer accounts must never be added to Protected Users.", fr: "Les comptes de service et d'ordinateur ne doivent jamais être ajoutés à Protected Users." }
    c: { en: "Identical local administrator credentials across systems allow lateral movement; each system needs its own password, for example with Windows LAPS.", fr: "Des informations d'identification d'administrateur local identiques entre systèmes permettent le mouvement latéral ; chaque système a besoin de son propre mot de passe, par exemple avec Windows LAPS." }
    e: { en: "Microsoft recommends eliminating permanent membership in highly privileged groups and granting temporary membership through controls.", fr: "Microsoft recommande de supprimer l'appartenance permanente aux groupes hautement privilégiés et d'accorder une appartenance temporaire contrôlée." }
references:
  - title: Best practices for securing Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
