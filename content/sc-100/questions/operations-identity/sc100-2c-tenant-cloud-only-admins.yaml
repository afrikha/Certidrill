id: sc100-2c-tenant-cloud-only-admins
objective: "2.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys synchronizes its Active Directory Domain Services (AD DS) forest to Microsoft Entra ID by using Microsoft Entra Connect with password hash synchronization.

    Eight members of the Domain Admins group are also assigned the Global Administrator role in Microsoft Entra ID through their synchronized accounts. They sign in with a password and a code sent by SMS.

    You need to ensure that a compromise of AD DS doesn't give control of the Microsoft 365 tenant, and that administrative sign-ins to the tenant resist phishing.

    Which two actions should you recommend?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys synchronise sa forêt Active Directory Domain Services (AD DS) avec Microsoft Entra ID par Microsoft Entra Connect avec la synchronisation de hachage de mot de passe.

    Huit membres du groupe Domain Admins détiennent aussi le rôle Global Administrator dans Microsoft Entra ID par leurs comptes synchronisés. Ils se connectent avec un mot de passe et un code envoyé par SMS.

    Vous devez vous assurer qu'une compromission d'AD DS ne donne pas le contrôle du locataire Microsoft 365, et que les connexions d'administration au locataire résistent au hameçonnage.

    Quelles sont les deux actions à recommander ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create cloud-only accounts for the Microsoft Entra administrative roles and remove the roles from the synchronized accounts", fr: "Créer des comptes cloud uniquement pour les rôles d'administration Microsoft Entra et retirer les rôles des comptes synchronisés" } }
    - { id: b, text: { en: "Replace password hash synchronization with federation through AD FS for the administrator accounts", fr: "Remplacer la synchronisation de hachage de mot de passe par une fédération AD FS pour les comptes d'administrateur" } }
    - { id: c, text: { en: "Require a phishing-resistant authentication strength in Conditional Access for the administrative roles", fr: "Exiger une force d'authentification résistante au hameçonnage dans l'accès conditionnel pour les rôles d'administration" } }
    - { id: d, text: { en: "Add the synchronized administrator accounts to the Protected Users group in AD DS", fr: "Ajouter les comptes d'administrateur synchronisés au groupe Protected Users dans AD DS" } }
    - { id: e, text: { en: "Scope the Global Administrator assignments to an administrative unit that contains only the administrators", fr: "Limiter les attributions Global Administrator à une unité administrative qui ne contient que les administrateurs" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      An attacker who controls AD DS can reset or take over any synchronized account, so tenant administrators must use cloud-only accounts that AD DS can't change. SMS codes can be phished; a Conditional Access policy that requires a phishing-resistant authentication strength (passkeys, Windows Hello for Business or certificate-based authentication) for the administrative roles closes that gap.
    fr: |
      Un attaquant qui contrôle AD DS peut réinitialiser ou prendre le contrôle de tout compte synchronisé : les administrateurs du locataire doivent utiliser des comptes cloud uniquement qu'AD DS ne peut pas modifier. Les codes SMS peuvent être hameçonnés ; une stratégie d'accès conditionnel qui exige une force d'authentification résistante au hameçonnage (clés d'accès, Windows Hello Entreprise ou authentification par certificat) pour les rôles d'administration comble cette lacune.
  options:
    b:
      en: "Federation makes the tenant sign-in depend even more on the on-premises infrastructure; an AD FS compromise would then give tenant access."
      fr: "La fédération rend la connexion au locataire encore plus dépendante de l'infrastructure locale ; une compromission d'AD FS donnerait alors accès au locataire."
    d:
      en: "Protected Users hardens on-premises authentication; the accounts would still be synchronized and controlled from AD DS."
      fr: "Protected Users renforce l'authentification locale ; les comptes resteraient synchronisés et contrôlés depuis AD DS."
    e:
      en: "Global Administrator is a tenant-wide role that can't be scoped to an administrative unit, and the scope doesn't change who controls the accounts."
      fr: "Global Administrator est un rôle à l'échelle du locataire qui ne peut pas être limité à une unité administrative, et l'étendue ne change pas qui contrôle les comptes."
references:
  - title: Manage emergency access admin accounts
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access
  - title: Best practices for securing Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
