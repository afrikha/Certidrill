id: sc100-cs4a-access-planes
objective: "2.3.1"
type: dragdrop
caseStudy: sc100-cs4a-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You are redesigning administrative access to meet the privileged access requirements. You start by classifying the access of Blue Yonder Airlines according to the enterprise access model.

    To which plane or access pathway does each access belong? To answer, drag the appropriate planes or pathways to the correct accesses. Each plane or pathway may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous repensez l'accès administratif pour respecter les exigences relatives à l'accès privilégié. Vous commencez par classer les accès de Blue Yonder Airlines selon le modèle d'accès d'entreprise.

    À quel plan ou chemin d'accès chaque accès appartient-il ? Pour répondre, faites glisser les plans ou chemins d'accès appropriés vers les accès correspondants. Chaque plan ou chemin d'accès peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: control, text: { en: "Control plane", fr: "Plan de contrôle" } }
    - { id: management, text: { en: "Management plane", fr: "Plan de gestion" } }
    - { id: workload, text: { en: "Data/workload plane", fr: "Plan des données/charges de travail" } }
    - { id: user, text: { en: "User access", fr: "Accès utilisateur" } }
    - { id: app, text: { en: "App access", fr: "Accès aux applications" } }
  targets:
    - id: t1
      text: { en: "Manage the domain controllers, Microsoft Entra Connect Sync and the Conditional Access policies", fr: "Gérer les contrôleurs de domaine, Microsoft Entra Connect Sync et les stratégies d'accès conditionnel" }
    - id: t2
      text: { en: "Patch the CrewPlan EC2 instances and the MaintTrack servers", fr: "Appliquer les correctifs aux instances EC2 de CrewPlan et aux serveurs MaintTrack" }
    - id: t3
      text: { en: "Configure the rules and the user roles inside CrewPlan, done by the crew planning department", fr: "Configurer les règles et les rôles utilisateur dans CrewPlan, ce que fait le service de planification des équipages" }
    - id: t4
      text: { en: "Calls from the partner airlines' systems to FlightStatus", fr: "Appels des systèmes des compagnies partenaires vers FlightStatus" }
answer:
  mapping: { t1: control, t2: management, t3: workload, t4: app }
explanation:
  correct:
    en: |-
      The control plane holds centralized identity and access control, so AD DS, its synchronization server and Conditional Access belong there. The management plane is enterprise IT management of workloads and the infrastructure they run on, on-premises or in any cloud. Per-workload management, sometimes done by a business unit, is the data/workload plane. Programmatic access through APIs is the app access pathway.
    fr: |-
      Le plan de contrôle contient le contrôle centralisé des identités et des accès : AD DS, son serveur de synchronisation et l'accès conditionnel en font partie. Le plan de gestion est la gestion informatique d'entreprise des charges de travail et de l'infrastructure qui les héberge, en local ou dans n'importe quel cloud. La gestion propre à une charge de travail, parfois assurée par un service métier, relève du plan des données/charges de travail. L'accès programmatique par des API est le chemin d'accès aux applications.
  options:
    user:
      en: |-
        User access is the pathway of employees, partners and customers who use the applications from their devices. None of the four accesses is a person using an application.
      fr: |-
        L'accès utilisateur est le chemin des employés, partenaires et clients qui utilisent les applications depuis leurs appareils. Aucun des quatre accès n'est une personne qui utilise une application.
references:
  - title: Securing privileged access Enterprise access model
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model
