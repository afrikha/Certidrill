id: sc100-2b-cloud-hsm-pkcs11
objective: "2.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is migrating an on-premises code-signing application to Azure virtual machines. The application calls its hardware security module (HSM) through the PKCS#11 interface and can't be rewritten.

    The keys must stay in a single-tenant HSM validated at FIPS 140-3 Level 3, and Litware must keep control of the root of trust.

    Which key management solution should you recommend?
  fr: |
    Litware, Inc. migre une application locale de signature de code vers des machines virtuelles Azure. L'application appelle son module de sécurité matériel (HSM) par l'interface PKCS#11 et ne peut pas être réécrite.

    Les clés doivent rester dans un HSM monolocataire validé FIPS 140-3 niveau 3, et Litware doit garder le contrôle de la racine de confiance.

    Quelle solution de gestion des clés devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure Key Vault Premium }
    - { id: b, text: Azure Cloud HSM }
    - { id: c, text: Azure Key Vault Managed HSM }
    - { id: d, text: Azure Payment HSM }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Azure Cloud HSM is a single-tenant HSM validated at FIPS 140-3 Level 3 with full native PKCS#11, JCA/JCE and CNG/KSP support. It targets lift-and-shift applications, TLS offload, TDE and code signing, with customer control of the root of trust.
    fr: |-
      Azure Cloud HSM est un HSM monolocataire validé FIPS 140-3 niveau 3, avec une prise en charge native complète de PKCS#11, JCA/JCE et CNG/KSP. Il cible les applications migrées telles quelles (lift-and-shift), le déchargement TLS, TDE et la signature de code, avec le contrôle de la racine de confiance par le client.
  options:
    a: { en: "Key Vault Premium is a multitenant service without customer control of the root of trust or a PKCS#11 interface.", fr: "Key Vault Premium est un service multilocataire, sans contrôle de la racine de confiance par le client ni interface PKCS#11." }
    c: { en: "Managed HSM is single tenant, but its PKCS#11 support is limited to TLS offload with F5 and NGINX; it targets encryption at rest and customer-managed keys for Azure services.", fr: "Managed HSM est monolocataire, mais sa prise en charge de PKCS#11 se limite au déchargement TLS avec F5 et NGINX ; il cible le chiffrement au repos et les clés gérées par le client des services Azure." }
    d: { en: "Payment HSM is designed for payment PIN processing, not for general code signing.", fr: "Payment HSM est conçu pour le traitement des codes PIN de paiement, pas pour la signature de code en général." }
references:
  - title: How to choose the right Azure key management solution
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management-choose
