id: sc100-2a-coverage-data-gap
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Sentinel. The MITRE ATT&CK page shows three active scheduled analytics rules mapped to the Brute Force technique, and the detection engineering team reports this technique as covered. The three rules query the logs of the remote access VPN appliances.

    During a purple team exercise, a password spray attack against the VPN appliances generates no alert. The rules are enabled, their schedules are correct and their queries are valid.

    What should you recommend that the team verify first?
  fr: |
    Woodgrove Bank utilise Microsoft Sentinel. La page MITRE ATT&CK montre trois règles d'analyse planifiées actives mappées sur la technique Brute Force, et l'équipe d'ingénierie de détection considère cette technique comme couverte. Les trois règles interrogent les journaux des appliances VPN d'accès distant.

    Lors d'un exercice purple team, une attaque par pulvérisation de mots de passe contre les appliances VPN ne génère aucune alerte. Les règles sont activées, leurs planifications sont correctes et leurs requêtes sont valides.

    Que devez-vous recommander à l'équipe de vérifier en premier ?
body:
  options:
    - { id: a, text: { en: "Whether the simulated coverage view includes the three rules", fr: "Si la vue de couverture simulée inclut les trois règles" } }
    - { id: b, text: { en: "Whether the rules are also mapped to the Initial Access tactic", fr: "Si les règles sont aussi mappées sur la tactique Initial Access" } }
    - { id: c, text: { en: "Whether a data connector ingests the VPN logs that the rules query", fr: "Si un connecteur de données ingère les journaux VPN interrogés par les règles" } }
    - { id: d, text: { en: "Whether hunting queries are tagged with the Brute Force technique", fr: "Si des requêtes de repérage sont étiquetées avec la technique Brute Force" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The MITRE page counts the rules that are enabled and mapped to a technique; it doesn't prove that the data they need is ingested. A rule that queries VPN logs can't fire if no connector sends those logs to the workspace, so the coverage is only on paper. Checking the data sources is part of any coverage evaluation.
    fr: |
      La page MITRE compte les règles activées et mappées sur une technique ; elle ne prouve pas que les données dont elles ont besoin sont ingérées. Une règle qui interroge des journaux VPN ne peut pas se déclencher si aucun connecteur n'envoie ces journaux à l'espace de travail : la couverture n'existe alors que sur le papier. Vérifier les sources de données fait partie de toute évaluation de couverture.
  options:
    a:
      en: |
        Simulated coverage shows templates that aren't configured yet; it doesn't explain why enabled rules don't fire.
      fr: |
        La couverture simulée montre des modèles pas encore configurés ; elle n'explique pas pourquoi des règles activées ne se déclenchent pas.
    b:
      en: |
        MITRE mappings classify a rule for coverage reporting; they don't affect whether its query returns results.
      fr: |
        Les mappages MITRE classent une règle pour le rapport de couverture ; ils n'influencent pas le fait que sa requête renvoie des résultats.
    d:
      en: |
        Hunting queries are run by analysts and don't generate alerts by themselves; tagging them doesn't fix the missing alerts.
      fr: |
        Les requêtes de repérage sont exécutées par des analystes et ne génèrent pas d'alertes d'elles-mêmes ; les étiqueter ne corrige pas l'absence d'alertes.
references:
  - title: View MITRE ATT&CK Coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
