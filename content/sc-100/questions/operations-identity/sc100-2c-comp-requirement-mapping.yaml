id: sc100-2c-comp-requirement-mapping
objective: "2.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders processes card payments and must translate its PCI DSS obligations into security controls. Northwind uses Microsoft 365 E5, Azure, and AWS.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders traite des paiements par carte et doit traduire ses obligations PCI DSS en contrôles de sécurité. Northwind utilise Microsoft 365 E5, Azure et AWS.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dlp, text: { en: "Microsoft Purview Data Loss Prevention", fr: "Protection contre la perte de données Microsoft Purview" } }
    - { id: cmk, text: { en: "Customer-managed keys in Azure Key Vault", fr: "Clés gérées par le client dans Azure Key Vault" } }
    - { id: policy, text: "Azure Policy" }
    - { id: sentinel, text: "Microsoft Sentinel" }
    - { id: lockbox, text: "Customer Lockbox" }
    - { id: cm, text: { en: "Microsoft Purview Compliance Manager", fr: "Gestionnaire de conformité Microsoft Purview" } }
  targets:
    - id: t1
      text: { en: "Card numbers must not be sent in Teams chats or emails", fr: "Les numéros de carte ne doivent pas être envoyés dans les conversations Teams ni dans les e-mails" }
    - id: t2
      text: { en: "The encryption keys of the Azure SQL databases that store cardholder data must be generated and controlled by Northwind", fr: "Les clés de chiffrement des bases Azure SQL qui stockent les données des titulaires de carte doivent être générées et contrôlées par Northwind" }
    - id: t3
      text: { en: "Every new Azure subscription must enforce the approved security configuration of resources", fr: "Chaque nouvel abonnement Azure doit imposer la configuration de sécurité approuvée des ressources" }
    - id: t4
      text: { en: "Administrator activity in Azure, AWS and on-premises systems must be collected centrally, correlated and alerted on", fr: "L'activité des administrateurs dans Azure, AWS et les systèmes locaux doit être collectée de façon centralisée, corrélée et faire l'objet d'alertes" }
answer:
  mapping: { t1: dlp, t2: cmk, t3: policy, t4: sentinel }
explanation:
  correct:
    en: |
      DLP policies detect sensitive information such as card numbers in Exchange email and Teams chats and can block it. Customer-managed keys stored in Key Vault let Northwind generate and control the keys that encrypt the databases. Azure Policy assignments at a management group are inherited by new subscriptions and enforce resource configuration. Sentinel collects logs from Azure, AWS and on-premises sources and correlates them into alerts and incidents.
    fr: |
      Les stratégies DLP détectent les informations sensibles comme les numéros de carte dans les e-mails Exchange et les conversations Teams, et peuvent les bloquer. Les clés gérées par le client stockées dans Key Vault permettent à Northwind de générer et contrôler les clés qui chiffrent les bases de données. Les attributions Azure Policy à un groupe d'administration sont héritées par les nouveaux abonnements et imposent la configuration des ressources. Sentinel collecte les journaux d'Azure, d'AWS et des sources locales et les corrèle en alertes et en incidents.
  options:
    lockbox:
      en: "Customer Lockbox controls Microsoft engineers' access to Microsoft 365 content; it matches none of these requirements."
      fr: "Customer Lockbox contrôle l'accès des ingénieurs Microsoft au contenu Microsoft 365 ; il ne correspond à aucune de ces exigences."
    cm:
      en: "Compliance Manager tracks the progress of improvement actions; it doesn't enforce or detect any of these controls itself."
      fr: "Le Gestionnaire de conformité suit la progression des actions d'amélioration ; il n'impose ni ne détecte lui-même aucun de ces contrôles."
references:
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
