id: sc100-2a-arc-ama-servers
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has 400 Windows and Linux servers in two on-premises datacenters and 150 virtual machines in Google Cloud. Azure virtual machines already send their security events to Microsoft Sentinel through the Azure Monitor Agent and data collection rules.

    You need to recommend a solution to collect the security events of the on-premises and Google Cloud servers. The servers must be managed with the same agent and the same Azure Policy assignments as the Azure virtual machines.

    What should you recommend?
  fr: |
    Litware, Inc. dispose de 400 serveurs Windows et Linux dans deux centres de données locaux et de 150 machines virtuelles dans Google Cloud. Les machines virtuelles Azure envoient déjà leurs événements de sécurité à Microsoft Sentinel par l'agent Azure Monitor et des règles de collecte de données.

    Vous devez recommander une solution pour collecter les événements de sécurité des serveurs locaux et Google Cloud. Les serveurs doivent être gérés avec le même agent et les mêmes attributions Azure Policy que les machines virtuelles Azure.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Install the Log Analytics agent on each server and connect it to the workspace", fr: "Installer l'agent Log Analytics sur chaque serveur et le connecter à l'espace de travail" } }
    - { id: b, text: { en: "Onboard the servers to Azure Arc, then deploy the Azure Monitor Agent with data collection rules", fr: "Intégrer les serveurs à Azure Arc, puis déployer l'agent Azure Monitor avec des règles de collecte de données" } }
    - { id: c, text: { en: "Forward the events to a Windows Event Collector server and send them to Sentinel through Syslog", fr: "Transférer les événements vers un serveur collecteur d'événements Windows et les envoyer à Sentinel par Syslog" } }
    - { id: d, text: { en: "Onboard the servers to Microsoft Defender for Endpoint and rely on its device events", fr: "Intégrer les serveurs à Microsoft Defender for Endpoint et s'appuyer sur ses événements d'appareil" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Azure Monitor Agent runs on machines in other clouds and on-premises through Azure Arc. Azure Arc gives each server an Azure resource, so the same data collection rules and Azure Policy assignments as for Azure virtual machines apply to it.
    fr: |
      L'agent Azure Monitor s'exécute sur les machines d'autres clouds et locales grâce à Azure Arc. Azure Arc donne à chaque serveur une ressource Azure : les mêmes règles de collecte de données et les mêmes attributions Azure Policy que pour les machines virtuelles Azure s'y appliquent donc.
  options:
    a:
      en: |
        The Log Analytics agent (MMA) is retired; the Azure Monitor Agent is the supported agent.
      fr: |
        L'agent Log Analytics (MMA) est retiré ; l'agent Azure Monitor est l'agent pris en charge.
    c:
      en: |
        An event collector chain adds servers to maintain and doesn't put the servers under the same agent and Azure Policy management as the Azure virtual machines.
      fr: |
        Une chaîne de collecteurs d'événements ajoute des serveurs à maintenir et ne place pas les serveurs sous la même gestion d'agent et Azure Policy que les machines virtuelles Azure.
    d:
      en: |
        Defender for Endpoint protects the servers, but its device events aren't the Windows security events and Syslog that the existing data collection rules collect, and it doesn't bring Azure Policy management.
      fr: |
        Defender for Endpoint protège les serveurs, mais ses événements d'appareil ne sont pas les événements de sécurité Windows et le Syslog que collectent les règles de collecte de données existantes, et il n'apporte pas la gestion par Azure Policy.
references:
  - title: Azure Monitor Agent overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview
