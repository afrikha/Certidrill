id: sc100-2a-hunt-to-detection
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The threat hunting team of Woodgrove Bank uses Microsoft Sentinel. Starting from a threat intelligence report, a hunter wrote a query that found an attacker using a living-off-the-land technique on two servers.

    The SOC manager wants this behavior to be detected automatically in the future, with an incident created for each new occurrence, without depending on a hunter running the query again.

    What should you recommend?
  fr: |
    L'équipe de repérage des menaces de Woodgrove Bank utilise Microsoft Sentinel. À partir d'un rapport de renseignement sur les menaces, un chasseur a écrit une requête qui a trouvé un attaquant utilisant une technique « living off the land » sur deux serveurs.

    Le responsable du SOC veut que ce comportement soit détecté automatiquement à l'avenir, avec un incident créé pour chaque nouvelle occurrence, sans dépendre d'un chasseur qui relance la requête.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Save the results of the query as hunting bookmarks", fr: "Enregistrer les résultats de la requête comme signets de repérage" } }
    - { id: b, text: { en: "Create an analytics rule from the hunting query", fr: "Créer une règle d'analyse à partir de la requête de repérage" } }
    - { id: c, text: { en: "Add the query to a workbook shared with the SOC", fr: "Ajouter la requête à un classeur partagé avec le SOC" } }
    - { id: d, text: { en: "Tag the hunting query with its MITRE ATT&CK technique", fr: "Étiqueter la requête de repérage avec sa technique MITRE ATT&CK" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A successful hunt should become a detection: from a valuable hunting query, you create an analytics rule (a custom detection) that runs on a schedule and creates alerts and incidents. The behavior is then detected without anyone rerunning the hunt.
    fr: |
      Un repérage réussi doit devenir une détection : à partir d'une requête de repérage utile, vous créez une règle d'analyse (une détection personnalisée) qui s'exécute selon une planification et crée des alertes et des incidents. Le comportement est alors détecté sans que personne ne relance le repérage.
  options:
    a:
      en: |
        Bookmarks preserve the rows found during this hunt as evidence; they don't detect future occurrences.
      fr: |
        Les signets conservent comme preuves les lignes trouvées pendant ce repérage ; ils ne détectent pas les occurrences futures.
    c:
      en: |
        A workbook displays the results when someone opens it; it doesn't create incidents.
      fr: |
        Un classeur affiche les résultats quand quelqu'un l'ouvre ; il ne crée pas d'incidents.
    d:
      en: |
        MITRE mapping classifies the query and shows it in coverage views, but the query still runs only when a hunter runs it.
      fr: |
        Le mappage MITRE classe la requête et l'affiche dans les vues de couverture, mais la requête ne s'exécute toujours que quand un chasseur la lance.
references:
  - title: Threat hunting in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
