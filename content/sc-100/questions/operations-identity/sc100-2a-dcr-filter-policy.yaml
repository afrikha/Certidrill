id: sc100-2a-dcr-filter-policy
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has onboarded 2,000 on-premises servers to Azure Arc. The security team wants Microsoft Sentinel to receive only the Windows security events that its analytics rules use, because collecting all the events would exceed the budget.

    New servers are onboarded to Azure Arc every week, and they must be configured the same way without manual work.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. a intégré 2 000 serveurs locaux à Azure Arc. L'équipe de sécurité veut que Microsoft Sentinel ne reçoive que les événements de sécurité Windows utilisés par ses règles d'analyse, car collecter tous les événements dépasserait le budget.

    De nouveaux serveurs sont intégrés à Azure Arc chaque semaine, et ils doivent être configurés de la même façon sans travail manuel.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a data collection rule that collects only the required security events", fr: "Créer une règle de collecte de données qui collecte uniquement les événements de sécurité requis" } }
    - { id: b, text: { en: "Create an automation rule that deletes the unneeded events after ingestion", fr: "Créer une règle d'automatisation qui supprime les événements inutiles après l'ingestion" } }
    - { id: c, text: { en: "Assign Azure Policy definitions that deploy the Azure Monitor Agent and associate the rule", fr: "Attribuer des définitions Azure Policy qui déploient l'agent Azure Monitor et associent la règle" } }
    - { id: d, text: { en: "Forward all the events to one Windows Event Collector that runs the agent", fr: "Transférer tous les événements vers un collecteur d'événements Windows qui exécute l'agent" } }
    - { id: e, text: { en: "Reduce the interactive retention of the SecurityEvent table to 30 days", fr: "Réduire la rétention interactive de la table SecurityEvent à 30 jours" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A data collection rule defines what the Azure Monitor Agent collects and can filter the events at the source, so only the events used by detections are ingested and billed. Azure Policy assignments deploy the agent to Arc-enabled servers and associate the rule with them, including servers onboarded later.
    fr: |
      Une règle de collecte de données définit ce que l'agent Azure Monitor collecte et peut filtrer les événements à la source : seuls les événements utilisés par les détections sont ingérés et facturés. Des attributions Azure Policy déploient l'agent sur les serveurs compatibles Arc et leur associent la règle, y compris pour les serveurs intégrés plus tard.
  options:
    b:
      en: |
        Automation rules act on incidents and alerts, not on ingested events, and ingestion is billed when the data arrives.
      fr: |
        Les règles d'automatisation agissent sur les incidents et les alertes, pas sur les événements ingérés, et l'ingestion est facturée à l'arrivée des données.
    d:
      en: |
        Forwarding all the events to a collector still ingests everything, and it adds a server to maintain.
      fr: |
        Transférer tous les événements vers un collecteur ingère toujours tout, et ajoute un serveur à maintenir.
    e:
      en: |
        Retention affects storage after ingestion, not the volume ingested, which is the main cost.
      fr: |
        La rétention concerne le stockage après l'ingestion, pas le volume ingéré, qui est le coût principal.
references:
  - title: Azure Monitor Agent overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview
