id: sc100-2a-saas-download-control
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Salesforce with single sign-on through Microsoft Entra ID. External contractors access Salesforce from their own unmanaged personal computers, on which Fabrikam can't install any software.

    The contractors must be able to view customer records and reports in a browser, but they must not be able to download files from Salesforce. Employees on managed devices must keep unrestricted access.

    What should you recommend?
  fr: |
    Fabrikam, Inc. utilise Salesforce avec l'authentification unique par Microsoft Entra ID. Des prestataires externes accèdent à Salesforce depuis leurs ordinateurs personnels non gérés, sur lesquels Fabrikam ne peut installer aucun logiciel.

    Les prestataires doivent pouvoir consulter les fiches clients et les rapports dans un navigateur, mais ne doivent pas pouvoir télécharger de fichiers depuis Salesforce. Les employés sur des appareils gérés doivent conserver un accès sans restriction.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Conditional Access policy that requires a compliant device for Salesforce", fr: "Une stratégie d'accès conditionnel qui exige un appareil conforme pour Salesforce" } }
    - { id: b, text: { en: "Microsoft Purview endpoint DLP policies that block file copies on the devices", fr: "Des stratégies DLP de point de terminaison Microsoft Purview qui bloquent les copies de fichiers sur les appareils" } }
    - { id: c, text: { en: "Microsoft Entra Private Access with a per-app definition for Salesforce", fr: "Accès privé Microsoft Entra avec une définition par application pour Salesforce" } }
    - { id: d, text: { en: "Conditional Access app control with a session policy that blocks downloads", fr: "Le contrôle d'application par accès conditionnel avec une stratégie de session qui bloque les téléchargements" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Conditional Access app control routes the contractors' browser sessions through Defender for Cloud Apps, where a session policy can block downloads while allowing the rest of the session. Nothing needs to be installed on the device, which suits unmanaged devices and partners, and the Conditional Access policy can apply the session control only to unmanaged devices.
    fr: |
      Le contrôle d'application par accès conditionnel fait passer les sessions de navigateur des prestataires par Defender for Cloud Apps, où une stratégie de session peut bloquer les téléchargements tout en autorisant le reste de la session. Rien n'a besoin d'être installé sur l'appareil, ce qui convient aux appareils non gérés et aux partenaires, et la stratégie d'accès conditionnel peut n'appliquer le contrôle de session qu'aux appareils non gérés.
  options:
    a:
      en: |
        Requiring a compliant device would block the contractors completely, while they must still be able to view records.
      fr: |
        Exiger un appareil conforme bloquerait complètement les prestataires, alors qu'ils doivent toujours pouvoir consulter les fiches.
    b:
      en: |
        Endpoint DLP requires devices onboarded to Microsoft Purview, which isn't possible on the contractors' unmanaged computers.
      fr: |
        La DLP de point de terminaison exige des appareils intégrés à Microsoft Purview, ce qui n'est pas possible sur les ordinateurs non gérés des prestataires.
    c:
      en: |
        Private Access gives network access to private resources; Salesforce is a SaaS app, and Private Access doesn't control downloads inside a session.
      fr: |
        Accès privé donne un accès réseau aux ressources privées ; Salesforce est une application SaaS, et Accès privé ne contrôle pas les téléchargements dans une session.
references:
  - title: Conditional Access app control in Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad
