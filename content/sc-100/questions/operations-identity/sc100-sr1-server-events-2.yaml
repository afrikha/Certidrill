id: sc100-sr1-server-events-2
objective: "2.1.3"
type: series_yesno
series: sc100-sr1-server-events
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You recommend the Log Analytics agent connected directly to LAW-SOC.
  fr: Vous recommandez l'agent Log Analytics connecté directement à LAW-SOC.
body:
  solution:
    en: |
      You recommend installing the **Log Analytics agent** on every server and EC2 instance, connecting each agent directly to LAW-SOC with the workspace ID and key, and selecting the **Common** set of security events in Microsoft Sentinel.
    fr: |
      Vous recommandez d'installer l'**agent Log Analytics** sur chaque serveur et chaque instance EC2, de connecter chaque agent directement à LAW-SOC avec l'ID et la clé de l'espace de travail, et de sélectionner l'ensemble d'événements de sécurité **Common** dans Microsoft Sentinel.
answer: { value: false }
explanation:
  correct:
    en: The Log Analytics agent is the legacy agent that the Azure Monitor Agent replaced, and it is no longer supported, so the solution breaks the agent requirement. The supported design for servers outside Azure is Azure Arc with the Azure Monitor Agent and data collection rules.
    fr: "L'agent Log Analytics est l'agent hérité que l'agent Azure Monitor a remplacé, et il n'est plus pris en charge : la solution ne respecte donc pas l'exigence sur l'agent. La conception prise en charge pour les serveurs hors d'Azure est Azure Arc avec l'agent Azure Monitor et des règles de collecte de données."
references:
  - title: Azure Monitor Agent overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview
