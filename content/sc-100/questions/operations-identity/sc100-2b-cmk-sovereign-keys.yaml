id: sc100-2b-cmk-sovereign-keys
objective: "2.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank must encrypt Azure Storage accounts and Azure SQL databases with customer-managed keys. A regulator requires these keys to be held in a single-tenant HSM, with key sovereignty and customer control of the root of trust, and the bank wants a PaaS service that integrates natively with Azure encryption at rest.

    Woodgrove also needs to store the TLS certificates of its web apps, with automatic renewal. The certificates have no HSM requirement. The solution must minimize cost.

    What should you recommend?
  fr: |
    Woodgrove Bank doit chiffrer des comptes Stockage Azure et des bases de données Azure SQL avec des clés gérées par le client. Un régulateur exige que ces clés soient conservées dans un HSM monolocataire, avec la souveraineté des clés et le contrôle de la racine de confiance par le client, et la banque veut un service PaaS intégré nativement au chiffrement au repos d'Azure.

    Woodgrove doit aussi stocker les certificats TLS de ses applications web, avec un renouvellement automatique. Les certificats n'ont aucune exigence HSM. La solution doit réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Key Vault Premium for both the customer-managed keys and the certificates", fr: "Key Vault Premium pour les clés gérées par le client et pour les certificats" } }
    - { id: b, text: { en: "Managed HSM for both the customer-managed keys and the certificates", fr: "Managed HSM pour les clés gérées par le client et pour les certificats" } }
    - { id: c, text: { en: "Azure Cloud HSM for both the customer-managed keys and the certificates", fr: "Azure Cloud HSM pour les clés gérées par le client et pour les certificats" } }
    - { id: d, text: { en: "Managed HSM for the customer-managed keys, and Key Vault Standard for the certificates", fr: "Managed HSM pour les clés gérées par le client, et Key Vault Standard pour les certificats" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Managed HSM is a single-tenant PaaS HSM with key sovereignty and customer control of the root of trust, designed for encryption at rest and customer-managed keys of Azure services. It stores only keys, so the certificates go to Azure Key Vault, where the Standard tier is the cheapest option when no HSM protection is required.
    fr: |-
      Managed HSM est un HSM PaaS monolocataire qui offre la souveraineté des clés et le contrôle de la racine de confiance par le client, conçu pour le chiffrement au repos et les clés gérées par le client des services Azure. Il ne stocke que des clés : les certificats vont dans Azure Key Vault, dont le niveau Standard est l'option la moins chère quand aucune protection HSM n'est exigée.
  options:
    a: { en: "Key Vault Premium is multitenant and doesn't provide key sovereignty or customer control of the root of trust.", fr: "Key Vault Premium est multilocataire et n'offre ni la souveraineté des clés ni le contrôle de la racine de confiance par le client." }
    b: { en: "Managed HSM supports asymmetric and symmetric keys only; it can't store certificates.", fr: "Managed HSM ne prend en charge que des clés asymétriques et symétriques ; il ne peut pas stocker de certificats." }
    c: { en: "Cloud HSM is an IaaS-style HSM that doesn't integrate with Azure PaaS services for customer-managed keys.", fr: "Cloud HSM est un HSM de type IaaS qui ne s'intègre pas aux services PaaS Azure pour les clés gérées par le client." }
references:
  - title: How to choose the right Azure key management solution
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management-choose
