id: sc100-2a-agent-controls-map
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has Microsoft 365 E7. Its developers build autonomous AI agents that use agent identities from Microsoft Entra Agent ID. You are designing the controls that apply to these agents.

    You need to recommend a solution for each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose de Microsoft 365 E7. Ses développeurs créent des agents IA autonomes qui utilisent des identités d'agent de Microsoft Entra Agent ID. Vous concevez les contrôles qui s'appliquent à ces agents.

    Vous devez recommander une solution pour chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Block the agents that ID Protection flags as high risk: [[s1]]

      Give one agent extra Microsoft Graph permissions for 90 days, after approval: [[s2]]

      Disable the agent identities that are no longer used: [[s3]]
    fr: |
      Bloquer les agents qu'ID Protection signale comme à risque élevé : [[s1]]

      Donner à un agent des autorisations Microsoft Graph supplémentaires pendant 90 jours, après approbation : [[s2]]

      Désactiver les identités d'agent qui ne sont plus utilisées : [[s3]]
  slots:
    - id: s1
      options:
        - { id: carisk, text: { en: "A Conditional Access policy for agents with an agent risk condition", fr: "Une stratégie d'accès conditionnel pour les agents avec une condition de risque d'agent" } }
        - { id: userrisk, text: { en: "A Conditional Access policy for all users with a user risk condition", fr: "Une stratégie d'accès conditionnel pour tous les utilisateurs avec une condition de risque utilisateur" } }
        - { id: session, text: { en: "A Defender for Cloud Apps session policy", fr: "Une stratégie de session Defender for Cloud Apps" } }
    - id: s2
      options:
        - { id: consent, text: { en: "Admin consent on the agent identity blueprint", fr: "Un consentement administrateur sur le blueprint d'identité d'agent" } }
        - { id: package, text: { en: "An access package with an expiration date", fr: "Un package d'accès avec une date d'expiration" } }
        - { id: pim, text: { en: "A PIM eligible assignment of a directory role", fr: "Une attribution éligible PIM d'un rôle d'annuaire" } }
    - id: s3
      options:
        - { id: review, text: { en: "A recurring access review of guest users", fr: "Une révision d'accès récurrente des utilisateurs invités" } }
        - { id: leaver, text: { en: "A leaver lifecycle workflow for employees", fr: "Un workflow de cycle de vie de départ pour les employés" } }
        - { id: inactivity, text: { en: "The default inactivity policy for agent identities", fr: "La stratégie d'inactivité par défaut des identités d'agent" } }
answer:
  values: { s1: carisk, s2: package, s3: inactivity }
explanation:
  correct:
    en: |
      Conditional Access for agents can block agents identified as high risk by ID Protection for agents. Access packages can grant agent identities Microsoft Graph permissions, group memberships or Microsoft Entra roles, with approval and an expiration date; the sponsor is notified before expiry. Every tenant has a default inactivity policy that identifies inactive agent identities, notifies the relevant users and disables the identities if no new activity is detected.
    fr: |
      L'accès conditionnel pour les agents peut bloquer les agents identifiés comme à risque élevé par ID Protection pour les agents. Les packages d'accès peuvent accorder aux identités d'agent des autorisations Microsoft Graph, des appartenances à des groupes ou des rôles Microsoft Entra, avec approbation et date d'expiration ; le sponsor est averti avant l'expiration. Chaque locataire dispose d'une stratégie d'inactivité par défaut qui identifie les identités d'agent inactives, avertit les utilisateurs concernés et désactive les identités si aucune nouvelle activité n'est détectée.
  options:
    userrisk:
      en: |
        User risk policies evaluate users; the autonomous agents authenticate as agent identities.
      fr: |
        Les stratégies de risque utilisateur évaluent des utilisateurs ; les agents autonomes s'authentifient comme identités d'agent.
    consent:
      en: |
        Permissions granted to a blueprint are granted to all the agent identities created from it, permanently and without approval of each request.
      fr: |
        Les autorisations accordées à un blueprint sont accordées à toutes les identités d'agent créées à partir de celui-ci, de façon permanente et sans approbation de chaque demande.
    pim:
      en: |
        A directory role doesn't grant Microsoft Graph application permissions, and PIM for roles isn't the mechanism described for time-limited agent access.
      fr: |
        Un rôle d'annuaire n'accorde pas d'autorisations d'application Microsoft Graph, et PIM pour les rôles n'est pas le mécanisme décrit pour un accès limité dans le temps des agents.
references:
  - title: Governing Agent Identities
    url: https://learn.microsoft.com/en-us/entra/id-governance/agent-id-governance-overview
  - title: ID Protection for agents
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-risky-agents
