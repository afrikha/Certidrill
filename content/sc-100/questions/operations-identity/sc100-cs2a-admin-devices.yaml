id: sc100-cs2a-admin-devices
objective: "2.3.7"
type: single
caseStudy: sc100-cs2a-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution for the members of Domain Admins to administer the domain controllers. The solution must meet the identity and endpoint requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui permette aux membres de Domain Admins d'administrer les contrôleurs de domaine. La solution doit répondre aux exigences d'identité et de points de terminaison.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A hardened jump server in each datacenter that the administrators reach by using Remote Desktop from their standard laptops", fr: "Un serveur de rebond renforcé dans chaque centre de données, que les administrateurs joignent avec le Bureau à distance depuis leurs ordinateurs portables standard" } }
    - { id: b, text: { en: "Specialized devices on which the administrators have no local administrator rights and run only approved applications", fr: "Des appareils spécialisés sur lesquels les administrateurs n'ont aucun droit d'administrateur local et n'exécutent que des applications approuvées" } }
    - { id: c, text: { en: "Dedicated privileged access workstations managed by Intune that deny URL access by default and block email", fr: "Des stations de travail d'accès privilégié dédiées, gérées par Intune, qui refusent l'accès aux URL par défaut et bloquent la messagerie" } }
    - { id: d, text: { en: "Azure Virtual Desktop session hosts that the administrators open from their standard laptops", fr: "Des hôtes de session Azure Virtual Desktop que les administrateurs ouvrent depuis leurs ordinateurs portables standard" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Domain administrators hold the most sensitive privileges, which Microsoft maps to the privileged access workstation (PAW) security level. A PAW denies URL access by default and blocks email and general web browsing, so the administrators use a separate device and account for productivity. PAWs are managed by Intune, run only applications deployed by the administrators, and use hardware and Windows protections such as Credential Guard and BitLocker.
    fr: |
      Les administrateurs de domaine détiennent les privilèges les plus sensibles, que Microsoft associe au niveau de sécurité de la station de travail d'accès privilégié (PAW). Une PAW refuse l'accès aux URL par défaut et bloque la messagerie et la navigation web générale ; les administrateurs utilisent donc un appareil et un compte distincts pour la productivité. Les PAW sont gérées par Intune, n'exécutent que les applications déployées par les administrateurs et utilisent des protections matérielles et Windows comme Credential Guard et BitLocker.
  options:
    a:
      en: The security of a session can't exceed the security of the device it starts from; a jump server reached from a laptop used for email and browsing inherits the risk of that laptop.
      fr: La sécurité d'une session ne peut pas dépasser celle de l'appareil d'où elle part ; un serveur de rebond joint depuis un ordinateur utilisé pour la messagerie et la navigation hérite du risque de cet ordinateur.
    b:
      en: Specialized devices still allow email and web browsing, which the requirements forbid for domain administration.
      fr: Les appareils spécialisés autorisent encore la messagerie et la navigation web, ce que les exigences interdisent pour l'administration du domaine.
    d:
      en: The administrators would still start their sessions from laptops used for email and browsing, which an attacker who controls the laptop can hijack.
      fr: Les administrateurs démarreraient encore leurs sessions depuis des ordinateurs portables utilisés pour la messagerie et la navigation, qu'un attaquant contrôlant l'ordinateur peut détourner.
references:
  - title: Why are privileged access devices important
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-devices
