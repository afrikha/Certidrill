id: sc100-2a-containment-speed
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has Microsoft 365 E5 with Microsoft Defender for Endpoint on all devices and Microsoft Defender for Identity on all domain controllers. Microsoft Sentinel is onboarded to the Microsoft Defender portal.

    A proposed design uses an automation rule with the incident created trigger to run a playbook that isolates devices and disables accounts when a ransomware incident is detected. The business requires compromised devices and accounts to be contained as soon as a human-operated ransomware attack is detected with high confidence, at any time of day, and the SOC must be able to undo each action.

    What should you recommend instead?
  fr: |
    Litware, Inc. dispose de Microsoft 365 E5 avec Microsoft Defender for Endpoint sur tous les appareils et Microsoft Defender for Identity sur tous les contrôleurs de domaine. Microsoft Sentinel est intégré au portail Microsoft Defender.

    Une conception proposée utilise une règle d'automatisation avec le déclencheur de création d'incident pour exécuter un playbook qui isole les appareils et désactive les comptes quand un incident de rançongiciel est détecté. L'entreprise exige que les appareils et les comptes compromis soient contenus dès qu'une attaque par rançongiciel opérée par des humains est détectée avec un niveau de confiance élevé, à toute heure, et le SOC doit pouvoir annuler chaque action.

    Que devez-vous recommander à la place ?
body:
  options:
    - { id: a, text: { en: "Run the same playbook from an automation rule that uses the Enhanced Alert Trigger", fr: "Exécuter le même playbook depuis une règle d'automatisation qui utilise l'Enhanced Alert Trigger" } }
    - { id: b, text: { en: "Rely on automatic attack disruption in Microsoft Defender XDR", fr: "S'appuyer sur l'interruption automatique des attaques dans Microsoft Defender XDR" } }
    - { id: c, text: { en: "Configure automated investigation and response to require approval of all actions", fr: "Configurer l'examen et la réponse automatisés pour exiger l'approbation de toutes les actions" } }
    - { id: d, text: { en: "Create a near-real-time analytics rule that runs the playbook from its alerts", fr: "Créer une règle d'analyse en quasi-temps réel qui exécute le playbook à partir de ses alertes" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Automatic attack disruption correlates endpoint, identity and email signals into a high-confidence incident and contains the compromised assets in real time: it contains devices through Defender for Endpoint and disables accounts through Defender for Identity. Every automatic action can be undone by the SOC. A Sentinel playbook in the Defender portal runs only after the incident is synchronized, which can take several minutes.
    fr: |
      L'interruption automatique des attaques corrèle les signaux de points de terminaison, d'identité et de messagerie en un incident à niveau de confiance élevé et contient les ressources compromises en temps réel : elle contient les appareils par Defender for Endpoint et désactive les comptes par Defender for Identity. Le SOC peut annuler chaque action automatique. Un playbook Sentinel dans le portail Defender ne s'exécute qu'après la synchronisation de l'incident, ce qui peut prendre plusieurs minutes.
  options:
    a:
      en: |
        The Enhanced Alert Trigger lets automation rules act on Defender XDR alerts, but the response is still a playbook that runs after the synchronization delay and depends on custom logic.
      fr: |
        L'Enhanced Alert Trigger permet aux règles d'automatisation d'agir sur les alertes Defender XDR, mais la réponse reste un playbook qui s'exécute après le délai de synchronisation et dépend d'une logique personnalisée.
    c:
      en: |
        Requiring approval for every action waits for an analyst, which doesn't meet the at-any-time containment requirement.
      fr: |
        Exiger l'approbation de chaque action attend un analyste, ce qui ne répond pas à l'exigence de confinement à toute heure.
    d:
      en: |
        A near-real-time rule detects faster, but containment still relies on a playbook and on custom detection logic instead of the high-confidence correlation of Defender XDR.
      fr: |
        Une règle en quasi-temps réel détecte plus vite, mais le confinement repose toujours sur un playbook et sur une logique de détection personnalisée au lieu de la corrélation à niveau de confiance élevé de Defender XDR.
references:
  - title: Automatic attack disruption in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption
  - title: Transition your Microsoft Sentinel environment to the Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/move-to-defender
