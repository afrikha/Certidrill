id: sc100-2b-mdi-sensor-placement
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has Microsoft Defender for Identity sensors on all its domain controllers. The forest also contains two Microsoft Entra Connect servers, an AD FS farm and an enterprise certificate authority based on AD CS. The certificate template assessments already appear in Microsoft Secure Score.

    The AD DS hardening requirements state that Secure Score must also report misconfigurations of the certificate authority and of the synchronization and authentication between AD DS and Microsoft Entra ID. The solution must minimize the number of additional sensors.

    Where should you deploy additional Defender for Identity sensors?
  fr: |
    Tailspin Toys dispose de capteurs Microsoft Defender for Identity sur tous ses contrôleurs de domaine. La forêt contient aussi deux serveurs Microsoft Entra Connect, une batterie AD FS et une autorité de certification d'entreprise basée sur AD CS. Les évaluations des modèles de certificats apparaissent déjà dans le Niveau de sécurité Microsoft (Microsoft Secure Score).

    Les exigences de sécurisation d'AD DS imposent que Secure Score signale aussi les erreurs de configuration de l'autorité de certification ainsi que de la synchronisation et de l'authentification entre AD DS et Microsoft Entra ID. La solution doit réduire au minimum le nombre de capteurs supplémentaires.

    Où devez-vous déployer des capteurs Defender for Identity supplémentaires ?
body:
  options:
    - { id: a, text: { en: "On the AD CS server and on the Microsoft Entra Connect servers", fr: "Sur le serveur AD CS et sur les serveurs Microsoft Entra Connect" } }
    - { id: b, text: { en: "On the AD FS servers and on the Microsoft Entra Connect servers", fr: "Sur les serveurs AD FS et sur les serveurs Microsoft Entra Connect" } }
    - { id: c, text: { en: "Nowhere: the domain controller sensors already produce these assessments", fr: "Nulle part : les capteurs des contrôleurs de domaine produisent déjà ces évaluations" } }
    - { id: d, text: { en: "On the AD CS server and on the AD FS servers", fr: "Sur le serveur AD CS et sur les serveurs AD FS" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Certificate template assessments are available to every customer with AD CS, but certificate authority assessments require a sensor on the AD CS server. Hybrid security recommendations, which cover synchronization and authentication between on-premises and cloud identity, require a sensor on the servers that run Microsoft Entra Connect.
    fr: |-
      Les évaluations des modèles de certificats sont disponibles pour tout client disposant d'AD CS, mais les évaluations de l'autorité de certification exigent un capteur sur le serveur AD CS. Les recommandations de sécurité hybride, qui couvrent la synchronisation et l'authentification entre l'identité locale et l'identité cloud, exigent un capteur sur les serveurs qui exécutent Microsoft Entra Connect.
  options:
    b: { en: "Without a sensor on the AD CS server, the certificate authority assessments don't appear.", fr: "Sans capteur sur le serveur AD CS, les évaluations de l'autorité de certification n'apparaissent pas." }
    c: { en: "Domain controller sensors don't provide the certificate authority and hybrid security assessments.", fr: "Les capteurs des contrôleurs de domaine ne fournissent pas les évaluations de l'autorité de certification ni de la sécurité hybride." }
    d: { en: "Hybrid security recommendations require a sensor on the Microsoft Entra Connect servers, not on AD FS.", fr: "Les recommandations de sécurité hybride exigent un capteur sur les serveurs Microsoft Entra Connect, pas sur AD FS." }
references:
  - title: Microsoft Defender for Identity's security posture assessments
    url: https://learn.microsoft.com/en-us/defender-for-identity/security-assessment
