id: sc100-2c-tenant-saas-posture
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft 365 E5 and Salesforce. Users and Salesforce administrators sign in to Salesforce through Microsoft Entra single sign-on.

    An audit found that several security settings of the Salesforce tenant were weak, such as multifactor authentication that wasn't required for some administrative profiles. The security team wants to find such misconfigurations continuously and to see the remediation guidance in Microsoft Security Exposure Management with the other recommendations of the organization.

    What should you recommend?
  fr: |
    Fabrikam, Inc. utilise Microsoft 365 E5 et Salesforce. Les utilisateurs et les administrateurs Salesforce se connectent à Salesforce par l'authentification unique Microsoft Entra.

    Un audit a révélé que plusieurs paramètres de sécurité du locataire Salesforce étaient faibles, par exemple une authentification multifacteur qui n'était pas exigée pour certains profils d'administration. L'équipe de sécurité veut trouver ces erreurs de configuration en continu et voir les recommandations de correction dans Microsoft Security Exposure Management avec les autres recommandations de l'organisation.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Connect Salesforce to Microsoft Defender for Cloud Apps with an app connector and turn on its security recommendations", fr: "Connecter Salesforce à Microsoft Defender for Cloud Apps avec un connecteur d'applications et activer ses recommandations de sécurité" } }
    - { id: b, text: { en: "Turn on Cloud Discovery in Microsoft Defender for Cloud Apps by using the traffic of Microsoft Defender for Endpoint", fr: "Activer Cloud Discovery dans Microsoft Defender for Cloud Apps à partir du trafic de Microsoft Defender for Endpoint" } }
    - { id: c, text: { en: "Enable the Defender CSPM plan in Microsoft Defender for Cloud and review its attack paths", fr: "Activer le plan Defender CSPM dans Microsoft Defender pour le cloud et examiner ses chemins d'attaque" } }
    - { id: d, text: { en: "Create a quarterly access review of the users assigned to the Salesforce enterprise application", fr: "Créer une révision d'accès trimestrielle des utilisateurs affectés à l'application d'entreprise Salesforce" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SaaS security posture management (SSPM) in Defender for Cloud Apps assesses the security configuration of connected SaaS apps such as Salesforce. Once the app is connected through an app connector and its security recommendations are turned on, the recommendations appear in Exposure Management and in Microsoft Secure Score, with implementation guidance.
    fr: |
      La gestion de la posture de sécurité SaaS (SSPM) de Defender for Cloud Apps évalue la configuration de sécurité des applications SaaS connectées comme Salesforce. Une fois l'application connectée par un connecteur d'applications et ses recommandations de sécurité activées, les recommandations apparaissent dans Exposure Management et dans le Niveau de sécurité Microsoft (Microsoft Secure Score), avec des instructions d'implémentation.
  options:
    b:
      en: "Cloud Discovery inventories the cloud apps that users reach, to find shadow IT; it doesn't read the security settings of a sanctioned Salesforce tenant."
      fr: "Cloud Discovery inventorie les applications cloud que les utilisateurs atteignent, pour trouver l'informatique fantôme ; il ne lit pas les paramètres de sécurité d'un locataire Salesforce approuvé."
    c:
      en: "Defender CSPM assesses cloud infrastructure in Azure, AWS and GCP; it doesn't evaluate the configuration of a SaaS tenant."
      fr: "Defender CSPM évalue l'infrastructure cloud dans Azure, AWS et GCP ; il n'évalue pas la configuration d'un locataire SaaS."
    d:
      en: "An access review recertifies who can use the app; it doesn't detect weak security settings inside Salesforce."
      fr: "Une révision d'accès recertifie qui peut utiliser l'application ; elle ne détecte pas les paramètres de sécurité faibles dans Salesforce."
references:
  - title: SaaS Security Posture Management (SSPM) in Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/security-saas
