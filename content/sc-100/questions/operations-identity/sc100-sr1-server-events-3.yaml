id: sc100-sr1-server-events-3
objective: "2.1.3"
type: series_yesno
series: sc100-sr1-server-events
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You recommend Azure Arc for the on-premises servers and the AWS S3 connector for the EC2 instances.
  fr: Vous recommandez Azure Arc pour les serveurs locaux et le connecteur AWS S3 pour les instances EC2.
body:
  solution:
    en: |
      You recommend onboarding the on-premises servers to **Azure Arc-enabled servers** and collecting their events with the **Windows Security Events via AMA** connector and a data collection rule. For Amazon EC2, you configure the **Amazon Web Services S3** connector in Microsoft Sentinel to ingest the **AWS CloudTrail** management and data events of the AWS account.
    fr: |
      Vous recommandez d'intégrer les serveurs locaux à **Azure Arc-enabled servers** et de collecter leurs événements avec le connecteur **Windows Security Events via AMA** et une règle de collecte de données. Pour Amazon EC2, vous configurez le connecteur **Amazon Web Services S3** dans Microsoft Sentinel pour ingérer les événements de gestion et de données **AWS CloudTrail** du compte AWS.
answer: { value: false }
explanation:
  correct:
    en: CloudTrail records the API activity of the AWS account, such as who started or changed an instance; it doesn't contain the Windows security events generated inside the guest OS of the EC2 instances. The EC2 instances also need Azure Arc and the Azure Monitor Agent so that the same data collection rule governs them.
    fr: "CloudTrail enregistre l'activité d'API du compte AWS, par exemple qui a démarré ou modifié une instance ; il ne contient pas les événements de sécurité Windows générés dans le système d'exploitation invité des instances EC2. Les instances EC2 ont elles aussi besoin d'Azure Arc et de l'agent Azure Monitor pour que la même règle de collecte de données les gouverne."
references:
  - title: Connect Microsoft Sentinel to Amazon Web Services to ingest AWS service log data
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-aws
