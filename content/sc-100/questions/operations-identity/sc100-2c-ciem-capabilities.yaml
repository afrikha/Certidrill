id: sc100-2c-ciem-capabilities
objective: "2.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has workloads in Azure, AWS, and GCP. You are evaluating cloud infrastructure entitlement management (CIEM) in Microsoft Defender for Cloud to govern the permissions of human and workload identities in the three clouds.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. a des charges de travail dans Azure, AWS et GCP. Vous évaluez la gestion des droits d'utilisation de l'infrastructure cloud (CIEM) de Microsoft Defender pour le cloud pour gouverner les autorisations des identités humaines et de charge de travail dans les trois clouds.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "CIEM analyzes Azure identities only, so the AWS and GCP identities need a separate product."
        fr: "La CIEM n'analyse que les identités Azure : les identités AWS et GCP nécessitent un produit distinct."
    - id: s2
      text:
        en: "CIEM can recommend enforcing multifactor authentication for AWS IAM users."
        fr: "La CIEM peut recommander d'imposer l'authentification multifacteur aux utilisateurs IAM AWS."
    - id: s3
      text:
        en: "The deprecation of Microsoft Entra Permissions Management removes the CIEM capabilities of Defender for Cloud."
        fr: "La dépréciation de Microsoft Entra Permissions Management supprime les fonctionnalités CIEM de Defender pour le cloud."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      CIEM in the Defender CSPM plan covers Microsoft Entra identities, AWS IAM users, roles and groups, and GCP IAM users, groups and service accounts. Its recommendations include removing inactive, guest or blocked accounts, limiting administrative privileges, right-sizing overprovisioned identities and enforcing MFA and strong passwords for IAM users. Microsoft states that the deprecation of Microsoft Entra Permissions Management doesn't affect the CIEM capabilities of Defender for Cloud.
    fr: |
      La CIEM du plan Defender CSPM couvre les identités Microsoft Entra, les utilisateurs, rôles et groupes IAM AWS, ainsi que les utilisateurs, groupes et comptes de service IAM GCP. Ses recommandations incluent le retrait des comptes inactifs, invités ou bloqués, la limitation des privilèges d'administration, l'ajustement des identités surprovisionnées et l'imposition de la MFA et de mots de passe forts aux utilisateurs IAM. Microsoft indique que la dépréciation de Microsoft Entra Permissions Management n'affecte pas les fonctionnalités CIEM de Defender pour le cloud.
references:
  - title: Cloud infrastructure entitlement management (CIEM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/permissions-management
