id: sc100-2b-ca-exclusion-review
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Conditional Access policy that requires MFA for all users and all resources. The policy has three exclusions:

    | Excluded object | Details |
    | --- | --- |
    | EmergencyAccess group | Two cloud-only emergency access accounts |
    | Migration-Exception group | 300 users excluded eight months ago during a telephony migration that is now complete |
    | svc-reports user account | Used with a password by a scheduled script on an Azure virtual machine to call Microsoft Graph |

    You need to recommend changes that align the policy with Zero Trust while preventing an administrative lockout of the tenant.

    What should you recommend?
  fr: |
    Woodgrove Bank dispose d'une stratégie d'accès conditionnel qui exige la MFA pour tous les utilisateurs et toutes les ressources. La stratégie comporte trois exclusions :

    | Objet exclu | Détails |
    | --- | --- |
    | Groupe EmergencyAccess | Deux comptes d'accès d'urgence cloud uniquement |
    | Groupe Migration-Exception | 300 utilisateurs exclus il y a huit mois pendant une migration téléphonique désormais terminée |
    | Compte d'utilisateur svc-reports | Utilisé avec un mot de passe par un script planifié sur une machine virtuelle Azure pour appeler Microsoft Graph |

    Vous devez recommander des modifications qui alignent la stratégie sur la Confiance Zéro tout en empêchant un blocage administratif du locataire.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Remove the three exclusions so that the policy applies to every account without exception", fr: "Supprimer les trois exclusions pour que la stratégie s'applique à tous les comptes sans exception" } }
    - { id: b, text: { en: "Keep the three exclusions, and review the Migration-Exception group in a quarterly access review", fr: "Conserver les trois exclusions, et réviser le groupe Migration-Exception dans une révision d'accès trimestrielle" } }
    - { id: c, text: { en: "Keep EmergencyAccess and svc-reports excluded, and require MFA for Migration-Exception only off the office network", fr: "Conserver les exclusions d'EmergencyAccess et de svc-reports, et n'exiger la MFA pour Migration-Exception qu'en dehors du réseau du bureau" } }
    - { id: d, text: { en: "Keep EmergencyAccess excluded, remove Migration-Exception, and replace svc-reports with a managed identity", fr: "Conserver l'exclusion d'EmergencyAccess, supprimer Migration-Exception, et remplacer svc-reports par une identité managée" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Emergency access accounts must stay excluded from policies that could block them, to prevent a tenant lockout. A temporary exclusion whose reason has ended must be removed as soon as possible. A user account used by a script is a gap: Microsoft recommends replacing service accounts in scripts with managed identities, which don't use passwords and are governed by workload identity controls.
    fr: |-
      Les comptes d'accès d'urgence doivent rester exclus des stratégies qui pourraient les bloquer, pour éviter un blocage du locataire. Une exclusion temporaire dont la raison a disparu doit être supprimée au plus vite. Un compte d'utilisateur utilisé par un script est une lacune : Microsoft recommande de remplacer les comptes de service des scripts par des identités managées, qui n'utilisent pas de mot de passe et relèvent des contrôles des identités de charge de travail.
  options:
    a: { en: "Removing the emergency access exclusion exposes the tenant to a lockout if MFA or the policy fails.", fr: "Supprimer l'exclusion des comptes d'accès d'urgence expose le locataire à un blocage si la MFA ou la stratégie échoue." }
    b: { en: "An access review doesn't enforce MFA: 300 users and a password-based script account would stay outside the policy.", fr: "Une révision d'accès n'impose pas la MFA : 300 utilisateurs et un compte de script à mot de passe resteraient hors de la stratégie." }
    c: { en: "Trusting the office network grants implicit trust by location, and the script account keeps a password without MFA.", fr: "Faire confiance au réseau du bureau accorde une confiance implicite liée à l'emplacement, et le compte du script garde un mot de passe sans MFA." }
references:
  - title: Plan a Conditional Access deployment
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/plan-conditional-access
  - title: Manage emergency access accounts in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access
