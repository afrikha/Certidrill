id: sc100-2b-cloud-sync-fit
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation synchronizes two AD DS forests to Microsoft Entra ID by using a single Microsoft Entra Connect Sync server. The identity team proposes replacing it with Microsoft Entra Cloud Sync and lists the requirements below.

    Which two requirements can Microsoft Entra Cloud Sync meet?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation synchronise deux forêts AD DS avec Microsoft Entra ID à l'aide d'un seul serveur Microsoft Entra Connect Sync. L'équipe identité propose de le remplacer par Microsoft Entra Cloud Sync et liste les exigences ci-dessous.

    Quelles sont les deux exigences auxquelles Microsoft Entra Cloud Sync peut répondre ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Synchronization continues automatically if one synchronization server fails", fr: "La synchronisation continue automatiquement si un serveur de synchronisation tombe en panne" } }
    - { id: b, text: { en: "A distribution group of 180,000 members is synchronized", fr: "Un groupe de distribution de 180 000 membres est synchronisé" } }
    - { id: c, text: { en: "Devices registered in Microsoft Entra ID are written back to AD DS", fr: "Les appareils inscrits dans Microsoft Entra ID sont réécrits dans AD DS" } }
    - { id: d, text: { en: "Security groups created in the cloud are provisioned to AD DS for on-premises apps", fr: "Des groupes de sécurité créés dans le cloud sont provisionnés dans AD DS pour des applications locales" } }
    - { id: e, text: { en: "Attributes of the same user are merged from an account forest and a resource forest", fr: "Les attributs d'un même utilisateur sont fusionnés depuis une forêt de comptes et une forêt de ressources" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Cloud Sync supports several active provisioning agents on different servers, with automatic failover and no staging server. It is also the only engine that provisions cloud groups to AD DS. Groups over 50,000 members, device writeback and merging attributes from several sources remain Connect Sync capabilities.
    fr: |-
      Cloud Sync prend en charge plusieurs agents de provisionnement actifs sur des serveurs différents, avec un basculement automatique et sans serveur en mode intermédiaire. C'est aussi le seul moteur qui provisionne des groupes cloud dans AD DS. Les groupes de plus de 50 000 membres, la réécriture d'appareils et la fusion d'attributs de plusieurs sources restent des capacités de Connect Sync.
  options:
    b: { en: "Cloud Sync supports groups of up to 50,000 members; Connect Sync supports 250,000.", fr: "Cloud Sync prend en charge des groupes de 50 000 membres au plus ; Connect Sync en prend en charge 250 000." }
    c: { en: "Device writeback isn't available in Cloud Sync; it was discontinued in favor of Cloud Kerberos Trust.", fr: "La réécriture d'appareils n'est pas disponible dans Cloud Sync ; elle a été abandonnée au profit de Cloud Kerberos Trust." }
    e: { en: "Merging attributes from several AD sources and cross-forest references require Connect Sync.", fr: "La fusion d'attributs de plusieurs sources AD et les références entre forêts exigent Connect Sync." }
references:
  - title: "Migrate from Microsoft Entra Connect Sync to Cloud Sync: decision guide"
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/connect-to-cloud-sync-decision-guide
