id: sc100-2b-cae-limits
objective: "2.2.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. relies on continuous access evaluation (CAE) for Exchange Online and SharePoint Online. Litware has two Conditional Access policies for these services: Policy1 blocks access from outside a named location that lists the IP ranges of the corporate egress points, and Policy2 blocks access from outside a named location that lists the countries where Litware operates. Partners access SharePoint Online as B2B guests.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. s'appuie sur l'évaluation continue de l'accès (CAE) pour Exchange Online et SharePoint Online. Litware dispose de deux stratégies d'accès conditionnel pour ces services : Policy1 bloque l'accès hors d'un emplacement nommé qui liste les plages IP des points de sortie de l'entreprise, et Policy2 bloque l'accès hors d'un emplacement nommé qui liste les pays où Litware opère. Des partenaires accèdent à SharePoint Online en tant qu'invités B2B.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          When a user's session moves to an IP address in a country that Policy2 doesn't list, CAE enforces Policy2 in near real time.
        fr: |-
          Quand la session d'un utilisateur passe à une adresse IP d'un pays que Policy2 ne liste pas, la CAE applique Policy2 en quasi temps réel.
    - id: s2
      text:
        en: |-
          When an administrator revokes all the refresh tokens of a guest user, CAE ends that guest's SharePoint Online session in near real time.
        fr: |-
          Quand un administrateur révoque tous les jetons d'actualisation d'un utilisateur invité, la CAE met fin à la session SharePoint Online de cet invité en quasi temps réel.
    - id: s3
      text:
        en: |-
          CAE ends the session of a Litware user whose password is reset, even if no Conditional Access policy targets that user.
        fr: |-
          La CAE met fin à la session d'un utilisateur de Litware dont le mot de passe est réinitialisé, même si aucune stratégie d'accès conditionnel ne cible cet utilisateur.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |-
      CAE enforces only IP-based named locations; country and region locations aren't evaluated by CAE, so Policy2 is applied at the next token issuance instead. CAE doesn't support guest user accounts, so revocation events aren't enforced instantly for them. Critical event evaluation, such as a password reset, doesn't depend on Conditional Access policies.
    fr: |-
      La CAE n'applique que les emplacements nommés basés sur des adresses IP ; les emplacements par pays ou région ne sont pas évalués par la CAE, et Policy2 s'applique donc à la prochaine émission de jeton. La CAE ne prend pas en charge les comptes d'utilisateur invités : les événements de révocation ne sont pas appliqués instantanément pour eux. L'évaluation des événements critiques, comme une réinitialisation de mot de passe, ne dépend pas des stratégies d'accès conditionnel.
references:
  - title: Continuous access evaluation
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-continuous-access-evaluation
