id: sc100-2b-ca-validation-tools
objective: "2.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is validating a set of new Conditional Access policies against its Zero Trust strategy before enforcing them. Some of the policies require MFA, others limit sessions from unmanaged devices. Tailspin has two emergency access accounts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys valide un ensemble de nouvelles stratégies d'accès conditionnel par rapport à sa stratégie Confiance Zéro avant de les appliquer. Certaines stratégies exigent la MFA, d'autres limitent les sessions depuis des appareils non gérés. Tailspin dispose de deux comptes d'accès d'urgence.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The What If tool can simulate a sign-in by a given user under given conditions and show which policies would apply.
        fr: |-
          L'outil What If peut simuler la connexion d'un utilisateur donné dans des conditions données et montrer quelles stratégies s'appliqueraient.
    - id: s2
      text:
        en: |-
          A policy in report-only mode enforces its session controls, but not its grant controls.
        fr: |-
          Une stratégie en mode rapport seul applique ses contrôles de session, mais pas ses contrôles d'octroi.
    - id: s3
      text:
        en: |-
          The emergency access accounts must be excluded from the report-only policies to prevent a lockout.
        fr: |-
          Les comptes d'accès d'urgence doivent être exclus des stratégies en mode rapport seul pour éviter un blocage.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      The What If tool simulates sign-ins and shows which policies apply to a user in a scenario; it is the first step when users report access problems. Report-only mode evaluates policies without enforcing grant controls or session controls. Because report-only policies don't block access, emergency access accounts don't need an exclusion from them; they must be excluded from enforced policies that could block them.
    fr: |-
      L'outil What If simule des connexions et montre quelles stratégies s'appliquent à un utilisateur dans un scénario ; c'est la première étape quand des utilisateurs signalent des problèmes d'accès. Le mode rapport seul évalue les stratégies sans appliquer ni les contrôles d'octroi ni les contrôles de session. Comme les stratégies en mode rapport seul ne bloquent pas l'accès, les comptes d'accès d'urgence n'ont pas besoin d'en être exclus ; ils doivent l'être des stratégies appliquées qui pourraient les bloquer.
references:
  - title: Analyze Conditional Access Policy Impact
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-report-only
  - title: Manage emergency access accounts in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access
