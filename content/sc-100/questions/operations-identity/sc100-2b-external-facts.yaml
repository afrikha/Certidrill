id: sc100-2b-external-facts
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is designing access for external users. Partner organizations use Microsoft Entra ID, and Contoso also plans a customer-facing app hosted in an external tenant. Contoso wants partner access to expire automatically.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. conçoit l'accès des utilisateurs externes. Les organisations partenaires utilisent Microsoft Entra ID, et Contoso prévoit aussi une application destinée aux clients, hébergée dans un locataire externe. Contoso veut que l'accès des partenaires expire automatiquement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Partner users who join Teams shared channels through B2B direct connect appear as guest user objects in Contoso's directory.
        fr: |-
          Les utilisateurs partenaires qui rejoignent des canaux partagés Teams par la connexion directe B2B apparaissent comme objets utilisateur invités dans l'annuaire de Contoso.
    - id: s2
      text:
        en: |-
          With entitlement management and a connected organization, partner users can request access, are added as B2B guests when approved, and are removed when their access expires.
        fr: |-
          Avec la gestion des droits d'utilisation et une organisation connectée, les utilisateurs partenaires peuvent demander l'accès, sont ajoutés comme invités B2B après approbation et sont supprimés quand leur accès expire.
    - id: s3
      text:
        en: |-
          Customers who sign in to the app in the external tenant also get single sign-on to Contoso's Microsoft 365 apps.
        fr: |-
          Les clients qui se connectent à l'application du locataire externe obtiennent aussi l'authentification unique aux applications Microsoft 365 de Contoso.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      B2B direct connect users authenticate in their home organization and aren't added as guests to the resource directory. Entitlement management lets connected organizations request access packages; approved users are added as B2B guests and removed when their access expires or is revoked. SSO in an external tenant covers the apps registered in that tenant only, not Microsoft 365 or other Microsoft SaaS apps.
    fr: |-
      Les utilisateurs de la connexion directe B2B s'authentifient dans leur organisation d'origine et ne sont pas ajoutés comme invités dans l'annuaire de ressources. La gestion des droits d'utilisation permet aux organisations connectées de demander des packages d'accès ; les utilisateurs approuvés sont ajoutés comme invités B2B et supprimés quand leur accès expire ou est révoqué. Dans un locataire externe, l'authentification unique ne couvre que les applications inscrites dans ce locataire, pas Microsoft 365 ni les autres applications SaaS Microsoft.
references:
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
