id: sc100-2c-ar-settings-findings
objective: "2.3.6"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys created a quarterly access review of the members of 50 project groups in Microsoft Entra ID Governance. The review settings are shown in the following table.

    After the first review, the auditors report two findings:

    - In the groups whose owners had left the company, nobody was asked to review the members.
    - Members that no reviewer acted on kept their access.

    Answer each prompt by selecting the setting that causes the finding.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys a créé une révision d'accès trimestrielle des membres de 50 groupes de projet dans Microsoft Entra ID Governance. Les paramètres de la révision figurent dans le tableau suivant.

    Après la première révision, les auditeurs signalent deux constats :

    - Dans les groupes dont les propriétaires avaient quitté l'entreprise, personne n'a été invité à réviser les membres.
    - Les membres sur lesquels aucun réviseur ne s'est prononcé ont gardé leur accès.

    Répondez à chaque consigne en sélectionnant le paramètre qui cause le constat.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Nobody reviewed the members of the groups without an owner", fr: "Personne n'a révisé les membres des groupes sans propriétaire" }
    - id: p2
      text: { en: "Members that no reviewer acted on kept their access", fr: "Les membres sur lesquels aucun réviseur ne s'est prononcé ont gardé leur accès" }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: "Review scope" }, { text: "Everyone", area: scope }]
      - [{ text: "Reviewers" }, { text: "Group owner(s)", area: reviewers }]
      - [{ text: "Fallback reviewers" }, { text: "None", area: fallback }]
      - [{ text: "Recurrence" }, { text: "Quarterly", area: recurrence }]
      - [{ text: "Auto apply results to resource" }, { text: "Enabled", area: autoapply }]
      - [{ text: "If reviewers don't respond" }, { text: "Approve access", area: noresponse }]
      - [{ text: "No sign-in within 30 days" }, { text: "Enabled", area: helper }]
answer:
  values: { p1: fallback, p2: noresponse }
explanation:
  correct:
    en: |
      Fallback reviewers review when the Group owner(s) option finds no owner for a group; with none set, the members of ownerless groups had no reviewer. The If reviewers don't respond setting applies to users that no reviewer acted on: Approve access keeps them, even with auto apply enabled. Remove access or Take recommendations would have removed them or followed the sign-in based recommendations.
    fr: |
      Les réviseurs de secours révisent quand l'option Group owner(s) ne trouve aucun propriétaire pour un groupe ; sans réviseur de secours, les membres des groupes sans propriétaire n'avaient pas de réviseur. Le paramètre If reviewers don't respond s'applique aux utilisateurs sur lesquels aucun réviseur ne s'est prononcé : Approve access les conserve, même avec l'application automatique activée. Remove access ou Take recommendations les auraient retirés ou auraient suivi les recommandations basées sur les connexions.
references:
  - title: Create an access review of groups and applications
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
