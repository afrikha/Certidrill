id: sc100-2c-policy-rollout
objective: "2.4.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has 60 Azure subscriptions in a management group hierarchy. A new security requirement states that storage accounts must disable public network access. You plan to use a policy definition whose effect parameter allows Audit, Deny and Disabled.

    Several applications rely on public network access until they're replaced next year, and the rollout must not break deployments that the security team hasn't reviewed.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso, Ltd. dispose de 60 abonnements Azure dans une hiérarchie de groupes d'administration. Une nouvelle exigence de sécurité impose que les comptes de stockage désactivent l'accès réseau public. Vous prévoyez d'utiliser une définition de stratégie dont le paramètre d'effet autorise Audit, Deny et Disabled.

    Plusieurs applications dépendent de l'accès réseau public jusqu'à leur remplacement l'an prochain, et le déploiement ne doit pas casser de déploiements que l'équipe de sécurité n'a pas examinés.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: audit, text: { en: "Assign the definition at the top-level management group with the Audit effect.", fr: "Attribuer la définition au groupe d'administration de niveau supérieur avec l'effet Audit." } }
    - { id: review, text: { en: "Review the compliance results with the application owners.", fr: "Examiner les résultats de conformité avec les propriétaires des applications." } }
    - { id: exempt, text: { en: "Create Waiver exemptions with an expiration date for the approved storage accounts.", fr: "Créer des exemptions Waiver avec une date d'expiration pour les comptes de stockage approuvés." } }
    - { id: deny, text: { en: "Change the effect of the assignment to Deny.", fr: "Changer l'effet de l'attribution en Deny." } }
    - { id: remediate, text: { en: "Create a remediation task for the non-compliant storage accounts.", fr: "Créer une tâche de correction pour les comptes de stockage non conformes." } }
    - { id: persub, text: { en: "Assign the definition to each subscription separately.", fr: "Attribuer la définition à chaque abonnement séparément." } }
answer:
  sequence: [ audit, review, exempt, deny ]
explanation:
  correct:
    en: |
      Assigning at the top-level management group covers every current and future subscription. Starting with Audit reports the non-compliant storage accounts without blocking anything, so the owners can confirm which ones are legitimate exceptions. Waiver exemptions with an expiry accept that temporary non-compliance and stop being honored after the date. Switching to Deny then blocks new non-compliant accounts without breaking the exempted ones.
    fr: |
      L'attribution au groupe d'administration de niveau supérieur couvre tous les abonnements actuels et futurs. Commencer par Audit signale les comptes de stockage non conformes sans rien bloquer, pour que les propriétaires confirment les exceptions légitimes. Les exemptions Waiver avec expiration acceptent cette non-conformité temporaire et ne sont plus prises en compte après la date. Passer ensuite à Deny bloque les nouveaux comptes non conformes sans casser ceux qui sont exemptés.
  options:
    remediate:
      en: "Remediation tasks apply only to deployIfNotExists and modify effects; this definition uses Audit or Deny."
      fr: "Les tâches de correction ne s'appliquent qu'aux effets deployIfNotExists et modify ; cette définition utilise Audit ou Deny."
    persub:
      en: "Sixty separate assignments add effort and miss future subscriptions that a management group assignment would cover."
      fr: "Soixante attributions distinctes ajoutent de l'effort et oublient les futurs abonnements que couvrirait une attribution au groupe d'administration."
references:
  - title: Details of the policy exemption structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
