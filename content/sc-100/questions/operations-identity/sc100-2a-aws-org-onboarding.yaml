id: sc100-2a-aws-org-onboarding
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs workloads in an AWS organization that contains 120 member accounts. The cloud team creates new AWS accounts every month.

    The security architects must see the security posture and recommendations of every AWS account, including future accounts, in Microsoft Defender for Cloud. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Tailspin Toys exécute des charges de travail dans une organisation AWS qui contient 120 comptes membres. L'équipe cloud crée de nouveaux comptes AWS chaque mois.

    Les architectes de sécurité doivent voir la posture de sécurité et les recommandations de chaque compte AWS, y compris les comptes futurs, dans Microsoft Defender pour le cloud. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create a Defender for Cloud connector for each member account", fr: "Créer un connecteur Defender pour le cloud pour chaque compte membre" } }
    - { id: b, text: { en: "Onboard all the EC2 instances to Azure Arc", fr: "Intégrer toutes les instances EC2 à Azure Arc" } }
    - { id: c, text: { en: "Connect the AWS management account to Defender for Cloud", fr: "Connecter le compte de gestion AWS à Defender pour le cloud" } }
    - { id: d, text: { en: "Connect the AWS CloudTrail logs to Microsoft Sentinel", fr: "Connecter les journaux AWS CloudTrail à Microsoft Sentinel" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When the AWS management account is connected with the management account onboarding type, Defender for Cloud creates connectors for the management account and automatically provisions the member accounts, including those created later. Specific accounts can be excluded if needed.
    fr: |
      Quand le compte de gestion AWS est connecté avec le type d'intégration compte de gestion, Defender pour le cloud crée des connecteurs pour le compte de gestion et provisionne automatiquement les comptes membres, y compris ceux créés plus tard. Des comptes spécifiques peuvent être exclus si nécessaire.
  options:
    a:
      en: |
        One connector per account works but must be repeated for every new account, which doesn't minimize administrative effort.
      fr: |
        Un connecteur par compte fonctionne mais doit être répété pour chaque nouveau compte, ce qui ne réduit pas l'effort d'administration.
    b:
      en: |
        Azure Arc onboards servers, not AWS accounts; it doesn't assess the configuration of the other AWS services.
      fr: |
        Azure Arc intègre des serveurs, pas des comptes AWS ; il n'évalue pas la configuration des autres services AWS.
    d:
      en: |
        CloudTrail logs in Sentinel support detection and hunting, but they don't produce posture recommendations in Defender for Cloud.
      fr: |
        Les journaux CloudTrail dans Sentinel servent à la détection et au repérage, mais ne produisent pas de recommandations de posture dans Defender pour le cloud.
references:
  - title: Connect AWS accounts to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
