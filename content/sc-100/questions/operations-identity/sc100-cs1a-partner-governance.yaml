id: sc100-cs1a-partner-governance
objective: "2.3.2"
type: dragdrop
caseStudy: sc100-cs1a-humongous
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a Microsoft Entra ID Governance feature for each requirement.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une fonctionnalité Microsoft Entra ID Governance pour chaque exigence.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pim, text: "Microsoft Entra Privileged Identity Management (PIM)" }
    - { id: em, text: { en: "Entitlement management", fr: "Gestion des droits d'utilisation" } }
    - { id: ar, text: { en: "Access reviews", fr: "Révisions d'accès" } }
    - { id: ca, text: { en: "Conditional Access", fr: "Accès conditionnel" } }
    - { id: idp, text: "Microsoft Entra ID Protection" }
  targets:
    - id: owner
      text: { en: "The Owner role on Sub-Claims", fr: "Le rôle Owner sur Sub-Claims" }
    - id: request
      text: { en: "Single broker request for the Broker Hub resources, with expiry after 180 days", fr: "Demande unique des courtiers pour les ressources de Broker Hub, avec expiration au bout de 180 jours" }
    - id: quarterly
      text: { en: "Quarterly confirmation of the brokers' access by the partner managers", fr: "Confirmation trimestrielle de l'accès des courtiers par les responsables des partenariats" }
answer:
  mapping: { owner: pim, request: em, quarterly: ar }
explanation:
  correct:
    en: |-
      PIM turns the permanent Owner assignments into eligible assignments that are activated just in time, for a limited duration and with approval. Entitlement management groups the team, the site and app-broker into an access package that brokers request in one step, with an approver and an expiration. Access reviews ask the partner managers on a recurring schedule to confirm or remove each broker's access.
    fr: |-
      PIM transforme les attributions permanentes du rôle Owner en attributions éligibles activées juste-à-temps, pour une durée limitée et après approbation. La gestion des droits d'utilisation regroupe l'équipe, le site et app-broker dans un package d'accès que les courtiers demandent en une seule fois, avec un approbateur et une expiration. Les révisions d'accès demandent périodiquement aux responsables des partenariats de confirmer ou de retirer l'accès de chaque courtier.
  options:
    ca:
      en: |-
        Conditional Access evaluates each sign-in; it does not grant time-bound role assignments, bundle resources or review existing access.
      fr: |-
        L'accès conditionnel évalue chaque connexion ; il n'accorde pas d'attributions de rôle limitées dans le temps, ne regroupe pas de ressources et ne révise pas les accès existants.
    idp:
      en: |-
        ID Protection detects user and sign-in risk; it does not manage the lifecycle of access.
      fr: |-
        ID Protection détecte les risques liés aux utilisateurs et aux connexions ; il ne gère pas le cycle de vie des accès.
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
  - title: What is entitlement management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview
