id: sc100-2c-mdc-scores
objective: "2.4.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft 365 E5, Microsoft Defender for Identity, and Microsoft Defender for Cloud with Azure subscriptions, AWS accounts and GCP projects. Leadership asks for three measurements.

    Which tool should provide each measurement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft 365 E5, Microsoft Defender for Identity et Microsoft Defender pour le cloud avec des abonnements Azure, des comptes AWS et des projets GCP. La direction demande trois mesures.

    Quel outil doit fournir chaque mesure ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Security posture of the Azure, AWS and GCP resources against the Microsoft cloud security benchmark: [[cloud]]

      Security posture of the identities, including the Defender for Identity posture assessments: [[identity]]

      Pass or fail status of each Azure resource for the controls of NIST SP 800-53 R5.1.1: [[nist]]
    fr: |
      Posture de sécurité des ressources Azure, AWS et GCP par rapport au benchmark de sécurité cloud Microsoft : [[cloud]]

      Posture de sécurité des identités, y compris les évaluations de posture de Defender for Identity : [[identity]]

      État réussi ou en échec de chaque ressource Azure pour les contrôles de NIST SP 800-53 R5.1.1 : [[nist]]
  slots:
    - id: cloud
      options:
        - { id: cloudscore, text: { en: "Defender for Cloud secure score", fr: "Degré de sécurisation de Defender pour le cloud" } }
        - { id: mss, text: "Microsoft Secure Score" }
        - { id: regcomp, text: { en: "Defender for Cloud regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire de Defender pour le cloud" } }
        - { id: cmscore, text: { en: "Compliance Manager compliance score", fr: "Score de conformité du Gestionnaire de conformité" } }
    - id: identity
      options:
        - { id: cloudscore, text: { en: "Defender for Cloud secure score", fr: "Degré de sécurisation de Defender pour le cloud" } }
        - { id: mss, text: "Microsoft Secure Score" }
        - { id: regcomp, text: { en: "Defender for Cloud regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire de Defender pour le cloud" } }
        - { id: cmscore, text: { en: "Compliance Manager compliance score", fr: "Score de conformité du Gestionnaire de conformité" } }
    - id: nist
      options:
        - { id: cloudscore, text: { en: "Defender for Cloud secure score", fr: "Degré de sécurisation de Defender pour le cloud" } }
        - { id: mss, text: "Microsoft Secure Score" }
        - { id: regcomp, text: { en: "Defender for Cloud regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire de Defender pour le cloud" } }
        - { id: cmscore, text: { en: "Compliance Manager compliance score", fr: "Score de conformité du Gestionnaire de conformité" } }
answer:
  values: { cloud: cloudscore, identity: mss, nist: regcomp }
explanation:
  correct:
    en: |
      The Defender for Cloud secure score (Cloud Secure Score) is based on the MCSB recommendations for Azure subscriptions, AWS accounts and GCP projects. Defender for Identity publishes its identity security posture assessments in Microsoft Secure Score. NIST SP 800-53 R5.1.1 is a standard of the regulatory compliance dashboard, which maps the resource assessments to the standard's controls.
    fr: |
      Le degré de sécurisation de Defender pour le cloud (Cloud Secure Score) est basé sur les recommandations du MCSB pour les abonnements Azure, les comptes AWS et les projets GCP. Defender for Identity publie ses évaluations de posture de sécurité des identités dans le Niveau de sécurité Microsoft (Microsoft Secure Score). NIST SP 800-53 R5.1.1 est une norme du tableau de bord de conformité réglementaire, qui associe les évaluations des ressources aux contrôles de la norme.
  options:
    cmscore:
      en: "The compliance score is a risk-weighted measure of completed Compliance Manager improvement actions; it isn't a per-resource posture or pass/fail view of cloud resources."
      fr: "Le score de conformité est une mesure pondérée par le risque des actions d'amélioration terminées du Gestionnaire de conformité ; ce n'est pas une vue de posture ou de réussite et d'échec par ressource cloud."
references:
  - title: Cloud Secure Score in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
  - title: Microsoft Defender for Identity Security Posture Assessments
    url: https://learn.microsoft.com/en-us/defender-for-identity/security-assessment
