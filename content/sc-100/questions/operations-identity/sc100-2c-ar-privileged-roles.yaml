id: sc100-2c-ar-privileged-roles
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Entra Privileged Identity Management (PIM) for its Microsoft Entra roles and Azure resource roles.

    Auditors require that, every quarter, a designated security manager confirms whether each user who has an eligible or active assignment to a privileged role still needs it, and that denied assignments are removed.

    What should you recommend?
  fr: |
    Contoso, Ltd. utilise Microsoft Entra Privileged Identity Management (PIM) pour ses rôles Microsoft Entra et ses rôles de ressources Azure.

    Les auditeurs exigent que, chaque trimestre, un responsable de la sécurité désigné confirme si chaque utilisateur qui a une attribution éligible ou active à un rôle privilégié en a encore besoin, et que les attributions refusées soient retirées.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "PIM role settings that limit the activation duration and require approval", fr: "Des paramètres de rôle PIM qui limitent la durée d'activation et exigent une approbation" } }
    - { id: b, text: { en: "An entitlement management access package with a quarterly expiration", fr: "Un package d'accès de la gestion des droits d'utilisation avec une expiration trimestrielle" } }
    - { id: c, text: { en: "Access reviews of the Microsoft Entra roles and Azure resource roles in PIM", fr: "Des révisions d'accès des rôles Microsoft Entra et des rôles de ressources Azure dans PIM" } }
    - { id: d, text: { en: "CIEM recommendations of the Defender CSPM plan in Microsoft Defender for Cloud", fr: "Les recommandations CIEM du plan Defender CSPM dans Microsoft Defender pour le cloud" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Access reviews of Microsoft Entra roles and Azure resource roles are created in PIM. They can recur quarterly, use a selected reviewer such as the security manager, and remove the denied assignments when the results are applied.
    fr: |
      Les révisions d'accès des rôles Microsoft Entra et des rôles de ressources Azure se créent dans PIM. Elles peuvent être trimestrielles, utiliser un réviseur choisi comme le responsable de la sécurité, et retirer les attributions refusées quand les résultats sont appliqués.
  options:
    a:
      en: "Role settings control how and for how long a role is activated; they don't ask anyone whether the assignment should continue."
      fr: "Les paramètres de rôle contrôlent comment et pour combien de temps un rôle est activé ; ils ne demandent à personne si l'attribution doit continuer."
    b:
      en: "An access package governs how access is requested and granted; it isn't how PIM role assignments are recertified."
      fr: "Un package d'accès gouverne la demande et l'octroi de l'accès ; ce n'est pas le moyen de recertifier les attributions de rôles PIM."
    d:
      en: "CIEM recommends removing unused permissions, but it doesn't run a recertification by a designated reviewer."
      fr: "La CIEM recommande de retirer les autorisations inutilisées, mais elle n'organise pas de recertification par un réviseur désigné."
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
