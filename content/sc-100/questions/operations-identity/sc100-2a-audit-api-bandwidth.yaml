id: sc100-2a-audit-api-bandwidth
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has 9,000 users with Microsoft 365 E3 licenses and uses Audit (Standard). A third-party SIEM, which must stay in place, collects the Microsoft 365 audit records through the Office 365 Management Activity API.

    During peaks of activity, the SIEM is throttled and receives audit records hours late. You need to recommend a solution that increases the rate at which audit records can be retrieved, without changing the SIEM.

    What should you recommend?
  fr: |
    Proseware, Inc. compte 9 000 utilisateurs dotés de licences Microsoft 365 E3 et utilise Audit (Standard). Un SIEM tiers, qui doit être conservé, collecte les enregistrements d'audit Microsoft 365 au moyen de l'Office 365 Management Activity API.

    Pendant les pics d'activité, le SIEM est limité et reçoit les enregistrements d'audit avec des heures de retard. Vous devez recommander une solution qui augmente le débit de récupération des enregistrements d'audit, sans modifier le SIEM.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create an audit log retention policy of one year for all users", fr: "Créer une stratégie de rétention des journaux d'audit d'un an pour tous les utilisateurs" } }
    - { id: b, text: { en: "Assign licenses that include Audit (Premium) to the users", fr: "Attribuer aux utilisateurs des licences qui incluent Audit (Premium)" } }
    - { id: c, text: { en: "Export the audit log every hour with an audit search job", fr: "Exporter le journal d'audit toutes les heures avec une tâche de recherche d'audit" } }
    - { id: d, text: { en: "Connect Microsoft 365 to Microsoft Sentinel with the Microsoft 365 connector", fr: "Connecter Microsoft 365 à Microsoft Sentinel avec le connecteur Microsoft 365" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Audit (Premium) gives organizations about twice the baseline bandwidth of Audit (Standard) on the Office 365 Management Activity API, so the existing SIEM can retrieve records faster. The baseline bandwidth of Audit (Standard) depends on the seat count and subscription, and organizations with E5 licenses get about twice the bandwidth of non-E5 organizations.
    fr: |
      Audit (Premium) donne aux organisations environ deux fois la bande passante de base d'Audit (Standard) sur l'Office 365 Management Activity API ; le SIEM existant peut ainsi récupérer les enregistrements plus vite. La bande passante de base d'Audit (Standard) dépend du nombre de postes et de l'abonnement, et les organisations dotées de licences E5 obtiennent environ deux fois la bande passante des organisations non E5.
  options:
    a:
      en: |
        A retention policy changes how long records are kept, not how fast they can be retrieved through the API. It also requires Audit (Premium).
      fr: |
        Une stratégie de rétention change la durée de conservation des enregistrements, pas la vitesse à laquelle l'API permet de les récupérer. Elle exige aussi Audit (Premium).
    c:
      en: |
        Scheduled manual exports add administrative effort and bypass the SIEM's integration instead of increasing the API throughput it uses.
      fr: |
        Des exportations manuelles planifiées ajoutent de l'effort d'administration et contournent l'intégration du SIEM au lieu d'augmenter le débit de l'API qu'il utilise.
    d:
      en: |
        Sentinel would collect the logs into its own workspace, but the requirement is to keep the third-party SIEM unchanged.
      fr: |
        Sentinel collecterait les journaux dans son propre espace de travail, mais l'exigence est de conserver le SIEM tiers sans le modifier.
references:
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
