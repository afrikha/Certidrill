id: sc100-2a-xdr-native-correlation
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft 365 E5 subscription. Microsoft Defender for Endpoint, Microsoft Defender for Office 365 and Microsoft Defender for Identity are deployed to all users, devices and domain controllers. Contoso has no other security data sources.

    The security team must see a phishing email, the device it compromised and the domain account used afterward as one incident, and must be able to isolate the device and disable the account from the same console. The solution must minimize cost and administrative effort.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose d'un abonnement Microsoft 365 E5. Microsoft Defender for Endpoint, Microsoft Defender for Office 365 et Microsoft Defender for Identity sont déployés pour tous les utilisateurs, appareils et contrôleurs de domaine. Contoso n'a aucune autre source de données de sécurité.

    L'équipe de sécurité doit voir un e-mail d'hameçonnage, l'appareil qu'il a compromis et le compte de domaine utilisé ensuite comme un seul incident, et doit pouvoir isoler l'appareil et désactiver le compte depuis la même console. La solution doit réduire au minimum les coûts et l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Use the Microsoft Defender XDR incidents in the Microsoft Defender portal", fr: "Utiliser les incidents Microsoft Defender XDR dans le portail Microsoft Defender" } }
    - { id: b, text: { en: "Ingest the Defender products' raw tables into Microsoft Sentinel and write analytics rules", fr: "Ingérer les tables brutes des produits Defender dans Microsoft Sentinel et écrire des règles d'analyse" } }
    - { id: c, text: { en: "Enable all the Defender plans of Microsoft Defender for Cloud on the subscription", fr: "Activer tous les plans Defender de Microsoft Defender pour le cloud sur l'abonnement" } }
    - { id: d, text: { en: "Send the Defender alerts to a Log Analytics workspace and build Azure Monitor workbooks", fr: "Envoyer les alertes Defender vers un espace de travail Log Analytics et créer des classeurs Azure Monitor" } }
answer: { optionId: a }
explanation:
  correct:
    en: Defender XDR already correlates the signals of Defender for Endpoint, Defender for Office 365 and Defender for Identity into cross-domain incidents, and offers the response actions of each product (isolate a device, disable a user) in the Defender portal. It is included in the Microsoft 365 E5 licenses, so it adds no ingestion cost and no rules to maintain.
    fr: Defender XDR corrèle déjà les signaux de Defender for Endpoint, Defender for Office 365 et Defender for Identity en incidents interdomaines, et propose les actions de réponse de chaque produit (isoler un appareil, désactiver un utilisateur) dans le portail Defender. Il est inclus dans les licences Microsoft 365 E5 ; il n'ajoute donc ni coût d'ingestion ni règles à maintenir.
  options:
    b:
      en: Sentinel is needed when non-Microsoft sources or custom logic are involved. Here it would add ingestion costs and custom rules to rebuild a correlation that Defender XDR already provides.
      fr: Sentinel est nécessaire quand des sources non Microsoft ou une logique personnalisée interviennent. Ici, il ajouterait des coûts d'ingestion et des règles personnalisées pour reconstruire une corrélation que Defender XDR fournit déjà.
    c:
      en: Defender for Cloud protects Azure and multicloud workloads; it doesn't correlate email, endpoint and on-premises identity signals into one incident.
      fr: Defender pour le cloud protège les charges de travail Azure et multiclouds ; il ne corrèle pas les signaux de messagerie, de points de terminaison et d'identité locale en un seul incident.
    d:
      en: Workbooks visualize data but neither correlate alerts into incidents nor provide response actions on devices and accounts.
      fr: Les classeurs visualisent des données, mais ne corrèlent pas les alertes en incidents et ne fournissent aucune action de réponse sur les appareils et les comptes.
references:
