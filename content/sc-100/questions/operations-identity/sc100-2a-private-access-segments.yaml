id: sc100-2a-private-access-segments
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is deploying Microsoft Entra Private Access to replace its VPN. Employees use many internal servers in the 10.10.0.0/16 range. A finance application is hosted separately in the 172.16.5.0/24 range.

    All employees must reach the 10.10.0.0/16 resources with a single, broad definition that requires little maintenance. Only the finance group must reach the finance application, and only from a compliant device.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. déploie Accès privé Microsoft Entra pour remplacer son VPN. Les employés utilisent de nombreux serveurs internes dans la plage 10.10.0.0/16. Une application financière est hébergée séparément dans la plage 172.16.5.0/24.

    Tous les employés doivent atteindre les ressources de 10.10.0.0/16 avec une seule définition large qui demande peu de maintenance. Seul le groupe finance doit atteindre l'application financière, et uniquement depuis un appareil conforme.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure Quick Access for the 10.10.0.0/16 range and assign it to all employees", fr: "Configurer Quick Access pour la plage 10.10.0.0/16 et l'attribuer à tous les employés" } }
    - { id: b, text: { en: "Add the finance range to Quick Access and require a compliant device for Quick Access", fr: "Ajouter la plage financière à Quick Access et exiger un appareil conforme pour Quick Access" } }
    - { id: c, text: { en: "Create a Global Secure Access app for the finance range with its own policy", fr: "Créer une application Global Secure Access pour la plage financière avec sa propre stratégie" } }
    - { id: d, text: { en: "Create an Internet Access security profile that blocks the finance range", fr: "Créer un profil de sécurité Accès Internet qui bloque la plage financière" } }
    - { id: e, text: { en: "Publish the internal servers through Microsoft Entra application proxy", fr: "Publier les serveurs internes par le proxy d'application Microsoft Entra" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Quick Access is the primary group of FQDNs, IP addresses and ranges that are always tunneled, which suits the broad internal range. A separate Global Secure Access app (per-app access) is used when a subset of private resources needs a different Conditional Access policy or different assignments: here, the finance group and a compliant device requirement.
    fr: |
      Quick Access est le groupe principal de noms de domaine complets, d'adresses IP et de plages toujours acheminés par le tunnel, ce qui convient à la plage interne large. Une application Global Secure Access distincte (accès par application) s'utilise quand un sous-ensemble de ressources privées a besoin d'une stratégie d'accès conditionnel ou d'attributions différentes : ici, le groupe finance et l'exigence d'un appareil conforme.
  options:
    b:
      en: |
        A compliant device requirement on Quick Access would apply to every employee and every internal server, and Quick Access assignments wouldn't limit the finance app to the finance group.
      fr: |
        Une exigence d'appareil conforme sur Quick Access s'appliquerait à tous les employés et à tous les serveurs internes, et les attributions de Quick Access ne limiteraient pas l'application financière au groupe finance.
    d:
      en: |
        Internet Access filters internet and SaaS traffic; it doesn't govern access to private ranges reached through Private Access.
      fr: |
        Accès Internet filtre le trafic Internet et SaaS ; il ne régit pas l'accès aux plages privées atteintes par Accès privé.
    e:
      en: |
        Application proxy publishes web apps one by one, which isn't a single broad definition for many servers and protocols.
      fr: |
        Le proxy d'application publie les applications web une par une, ce qui n'est pas une définition unique et large pour de nombreux serveurs et protocoles.
references:
  - title: Learn about Microsoft Entra Private Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access
