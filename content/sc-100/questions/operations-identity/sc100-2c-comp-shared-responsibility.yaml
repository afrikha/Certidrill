id: sc100-2c-comp-shared-responsibility
objective: "2.4.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. is moving a regulated application from Azure virtual machines to Azure App Service, and its collaboration workloads to Microsoft 365. The compliance officer asks which responsibilities stay with Contoso whatever the deployment type: IaaS, PaaS or SaaS.

    Which two responsibilities should you identify?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. migre une application réglementée de machines virtuelles Azure vers Azure App Service, et ses charges de travail de collaboration vers Microsoft 365. Le responsable de la conformité demande quelles responsabilités restent à Contoso quel que soit le type de déploiement : IaaS, PaaS ou SaaS.

    Quelles sont les deux responsabilités à identifier ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Physical security of the datacenter hosts", fr: "La sécurité physique des hôtes du centre de données" } }
    - { id: b, text: { en: "Patching the operating system of the App Service instances", fr: "La mise à jour corrective du système d'exploitation des instances App Service" } }
    - { id: c, text: { en: "Creating, managing and removing user accounts and their access", fr: "La création, la gestion et la suppression des comptes d'utilisateur et de leurs accès" } }
    - { id: d, text: { en: "Classifying and protecting the data", fr: "La classification et la protection des données" } }
    - { id: e, text: { en: "Network controls of the Microsoft 365 service", fr: "Les contrôles réseau du service Microsoft 365" } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      In every model, the customer keeps responsibility for its data (classification, protection, governance), its endpoints, its accounts and its access management. In PaaS and SaaS, the operating system moves to Microsoft; physical hosts, network and datacenter are always Microsoft's, and network controls become Microsoft's in SaaS.
    fr: |
      Dans tous les modèles, le client reste responsable de ses données (classification, protection, gouvernance), de ses points de terminaison, de ses comptes et de la gestion de ses accès. En PaaS et en SaaS, le système d'exploitation passe à Microsoft ; les hôtes physiques, le réseau et le centre de données relèvent toujours de Microsoft, et les contrôles réseau deviennent ceux de Microsoft en SaaS.
  options:
    a:
      en: "Physical hosts and datacenters are Microsoft's responsibility in every model, including IaaS."
      fr: "Les hôtes physiques et les centres de données relèvent de Microsoft dans tous les modèles, y compris l'IaaS."
    b:
      en: "In PaaS, Microsoft manages the operating system of the App Service instances."
      fr: "En PaaS, Microsoft gère le système d'exploitation des instances App Service."
    e:
      en: "In SaaS, network controls are fully Microsoft's responsibility."
      fr: "En SaaS, les contrôles réseau relèvent entièrement de Microsoft."
references:
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
