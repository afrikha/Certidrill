id: sc100-2b-adds-tier0-spec
objective: "2.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is completing the AD DS hardening specification for its hybrid identity. The forest synchronizes to Microsoft Entra ID. The specification must cover the servers protected like domain controllers, the recovery credentials of the domain controllers, and the Kerberos encryption for privileged and service accounts.

    How should you complete the specification? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank finalise la spécification de sécurisation d'AD DS de son identité hybride. La forêt est synchronisée avec Microsoft Entra ID. La spécification doit couvrir les serveurs protégés comme les contrôleurs de domaine, les informations d'identification de récupération des contrôleurs de domaine, et le chiffrement Kerberos des comptes privilégiés et de service.

    Comment devez-vous compléter la spécification ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Protect at the same level as the domain controllers (control plane): [[t0]]

      Use Windows LAPS on the domain controllers to manage: [[dsrm]]

      Kerberos encryption type for Protected Users members and gMSAs: [[enc]]
    fr: |
      Protéger au même niveau que les contrôleurs de domaine (plan de contrôle) : [[t0]]

      Utiliser Windows LAPS sur les contrôleurs de domaine pour gérer : [[dsrm]]

      Type de chiffrement Kerberos des membres de Protected Users et des gMSA : [[enc]]
  slots:
    - id: t0
      options:
        - { id: file, text: { en: "The file servers that host the finance shares", fr: "Les serveurs de fichiers qui hébergent les partages financiers" } }
        - { id: connect, text: { en: "The Microsoft Entra Connect servers", fr: "Les serveurs Microsoft Entra Connect" } }
        - { id: web, text: { en: "The web servers of the intranet", fr: "Les serveurs web de l'intranet" } }
        - { id: sql, text: { en: "The SQL Server instances of the business apps", fr: "Les instances SQL Server des applications métier" } }
    - id: dsrm
      options:
        - { id: krbtgt, text: { en: "The krbtgt account password", fr: "Le mot de passe du compte krbtgt" } }
        - { id: gmsa, text: { en: "The passwords of the gMSAs", fr: "Les mots de passe des gMSA" } }
        - { id: dsrm, text: { en: "The Directory Services Restore Mode (DSRM) account password", fr: "Le mot de passe du compte du mode de restauration des services d'annuaire (DSRM)" } }
        - { id: admin, text: { en: "The passwords of the Domain Admins members", fr: "Les mots de passe des membres de Domain Admins" } }
    - id: enc
      options:
        - { id: aes, text: AES }
        - { id: rc4, text: RC4 }
        - { id: des, text: DES }
answer:
  values: { t0: connect, dsrm: dsrm, enc: aes }
explanation:
  correct:
    en: |-
      The control plane covers the identity systems that control access across the enterprise; Microsoft Entra Connect servers can change identities in both AD DS and Microsoft Entra ID, so they are protected like domain controllers. On domain controllers, Windows LAPS backs up the DSRM account password to AD DS. Protected Users members can't use DES or RC4, and Microsoft recommends AES for managed service accounts.
    fr: |-
      Le plan de contrôle couvre les systèmes d'identité qui contrôlent l'accès dans toute l'entreprise ; les serveurs Microsoft Entra Connect peuvent modifier les identités à la fois dans AD DS et dans Microsoft Entra ID, ils sont donc protégés comme les contrôleurs de domaine. Sur les contrôleurs de domaine, Windows LAPS sauvegarde le mot de passe du compte DSRM dans AD DS. Les membres de Protected Users ne peuvent pas utiliser DES ni RC4, et Microsoft recommande AES pour les comptes de service administrés.
  options:
    gmsa: { en: "gMSA passwords are already computed and changed by the domain controllers through the Key Distribution Service.", fr: "Les mots de passe des gMSA sont déjà calculés et changés par les contrôleurs de domaine via le service de distribution de clés." }
    rc4: { en: "Protected Users members don't get RC4 keys, and Microsoft recommends AES for managed service accounts.", fr: "Les membres de Protected Users n'obtiennent pas de clés RC4, et Microsoft recommande AES pour les comptes de service administrés." }
references:
  - title: What is Windows LAPS?
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview
  - title: Enterprise access model
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model
