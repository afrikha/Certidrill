id: sc100-2c-ciem-attack-path
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has Azure subscriptions and AWS accounts connected to Microsoft Defender for Cloud. The Defender CSPM plan is enabled on all of them.

    A service principal used by a deployment pipeline holds the Contributor role on several subscriptions. The security team wants to know whether an attacker who compromises an internet-exposed virtual machine could use an overprivileged identity to reach a database that contains sensitive data, and to see the route the attacker would take as a graph.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose d'abonnements Azure et de comptes AWS connectés à Microsoft Defender pour le cloud. Le plan Defender CSPM est activé sur tous.

    Un principal de service utilisé par un pipeline de déploiement détient le rôle Contributor sur plusieurs abonnements. L'équipe de sécurité veut savoir si un attaquant qui compromet une machine virtuelle exposée sur Internet pourrait utiliser une identité surprivilégiée pour atteindre une base de données qui contient des données sensibles, et voir sous forme de graphe le chemin que suivrait l'attaquant.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The Microsoft cloud security benchmark in the regulatory compliance dashboard", fr: "Le benchmark de sécurité cloud Microsoft dans le tableau de bord de conformité réglementaire" } }
    - { id: b, text: { en: "Lateral movement paths in Microsoft Defender for Identity", fr: "Les chemins de mouvement latéral dans Microsoft Defender for Identity" } }
    - { id: c, text: { en: "The risky workload identities report in Microsoft Entra ID Protection", fr: "Le rapport des identités de charge de travail à risque dans Microsoft Entra ID Protection" } }
    - { id: d, text: { en: "Attack path analysis in Defender for Cloud", fr: "L'analyse des chemins d'attaque dans Defender pour le cloud" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      CIEM in Defender CSPM correlates identity risks with attack path analysis. Attack path analysis shows, as a graph, how an attacker could move from an internet-exposed entry point, through an identity with excessive permissions, to a sensitive resource such as a database, so the team can break the path.
    fr: |
      La CIEM de Defender CSPM relie les risques liés aux identités à l'analyse des chemins d'attaque. L'analyse des chemins d'attaque montre sous forme de graphe comment un attaquant pourrait passer d'un point d'entrée exposé sur Internet à une ressource sensible comme une base de données, en passant par une identité aux autorisations excessives, pour que l'équipe puisse couper le chemin.
  options:
    a:
      en: "The compliance dashboard reports controls that pass or fail; it doesn't show the route from an exposed machine to a database."
      fr: "Le tableau de bord de conformité indique les contrôles réussis ou en échec ; il ne montre pas le chemin d'une machine exposée vers une base de données."
    b:
      en: "Defender for Identity maps lateral movement paths inside on-premises Active Directory, not paths through cloud resources and service principal permissions."
      fr: "Defender for Identity cartographie les chemins de mouvement latéral dans l'Active Directory local, pas les chemins à travers les ressources cloud et les autorisations des principaux de service."
    c:
      en: "ID Protection flags workload identities that show signs of compromise; it doesn't compute which resources their permissions let an attacker reach."
      fr: "ID Protection signale les identités de charge de travail qui présentent des signes de compromission ; il ne calcule pas les ressources que leurs autorisations permettent à un attaquant d'atteindre."
references:
  - title: Cloud infrastructure entitlement management (CIEM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/permissions-management
