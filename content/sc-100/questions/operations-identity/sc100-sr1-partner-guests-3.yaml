id: sc100-sr1-partner-guests-3
objective: "2.3.6"
type: series_yesno
series: sc100-sr1-partner-guests
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You recommend PIM for Groups with eligible guest memberships whose activation the owners approve.
  fr: Vous recommandez PIM for Groups avec des appartenances éligibles pour les invités, dont l'activation est approuvée par les propriétaires.
body:
  solution:
    en: |
      You recommend bringing **PRJ-Fabrikam** under **Privileged Identity Management (PIM) for Groups**. The guests become **eligible** members with no end date, they must activate their membership to use the project resources, and each activation requires the approval of a group owner.
    fr: |
      Vous recommandez de placer **PRJ-Fabrikam** sous **Privileged Identity Management (PIM) for Groups**. Les invités deviennent membres **éligibles** sans date de fin, ils doivent activer leur appartenance pour utiliser les ressources du projet, et chaque activation nécessite l'approbation d'un propriétaire du groupe.
answer: { value: false }
explanation:
  correct:
    en: PIM for Groups controls when an eligible member can use the membership; it doesn't ask the owners to confirm every three months whether each guest still needs access. Eligible assignments with no end date stay in place indefinitely, so guests are never removed automatically, and approving each activation adds effort for the owners.
    fr: "PIM for Groups contrôle le moment où un membre éligible peut utiliser son appartenance ; il ne demande pas aux propriétaires de confirmer tous les trois mois que chaque invité a toujours besoin de son accès. Les attributions éligibles sans date de fin restent en place indéfiniment : les invités ne sont donc jamais retirés automatiquement, et l'approbation de chaque activation ajoute de l'effort pour les propriétaires."
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
  - title: Privileged Identity Management (PIM) for Groups
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/concept-pim-for-groups
