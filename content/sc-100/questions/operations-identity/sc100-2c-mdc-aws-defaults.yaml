id: sc100-2c-mdc-aws-defaults
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys connects an AWS account to Microsoft Defender for Cloud. The team doesn't assign any additional standard.

    Which standards does Defender for Cloud enable by default for the AWS account?
  fr: |
    Tailspin Toys connecte un compte AWS à Microsoft Defender pour le cloud. L'équipe n'attribue aucune norme supplémentaire.

    Quelles normes Defender pour le cloud active-t-il par défaut pour le compte AWS ?
body:
  options:
    - { id: a, text: { en: "The Microsoft cloud security benchmark only", fr: "Le benchmark de sécurité cloud Microsoft uniquement" } }
    - { id: b, text: { en: "The CIS AWS Foundations Benchmark and the AWS Well-Architected Framework", fr: "Le CIS AWS Foundations Benchmark et l'AWS Well-Architected Framework" } }
    - { id: c, text: { en: "The Microsoft cloud security benchmark and AWS Foundational Security Best Practices", fr: "Le benchmark de sécurité cloud Microsoft et AWS Foundational Security Best Practices" } }
    - { id: d, text: { en: "The Microsoft cloud security benchmark and PCI DSS v4.0.1", fr: "Le benchmark de sécurité cloud Microsoft et PCI DSS v4.0.1" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When Defender for Cloud is enabled, AWS accounts get the Microsoft cloud security benchmark and AWS Foundational Security Best Practices by default. Azure gets the MCSB only, and GCP gets the MCSB and GCP Default. Other standards, such as CIS or PCI DSS, must be assigned.
    fr: |
      Quand Defender pour le cloud est activé, les comptes AWS reçoivent par défaut le benchmark de sécurité cloud Microsoft et AWS Foundational Security Best Practices. Azure reçoit le MCSB seul, et GCP le MCSB et GCP Default. Les autres normes, comme CIS ou PCI DSS, doivent être attribuées.
  options:
    a:
      en: "The MCSB alone is the default for Azure; AWS also gets AWS Foundational Security Best Practices."
      fr: "Le MCSB seul est la valeur par défaut pour Azure ; AWS reçoit aussi AWS Foundational Security Best Practices."
    b:
      en: "The CIS AWS Foundations Benchmark and the AWS Well-Architected Framework are available for AWS but must be assigned."
      fr: "Le CIS AWS Foundations Benchmark et l'AWS Well-Architected Framework sont disponibles pour AWS mais doivent être attribués."
    d:
      en: "PCI DSS v4.0.1 is an optional standard that must be assigned."
      fr: "PCI DSS v4.0.1 est une norme facultative qui doit être attribuée."
references:
  - title: Regulatory compliance in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
