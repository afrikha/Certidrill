id: sc100-2a-agent-identity-type
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has Microsoft 365 E7. Business users build AI agents in Microsoft Copilot Studio, and hundreds of agents are created and retired every month. Separately, the IT department runs a payroll web app that uses a managed identity to read an Azure SQL database.

    The security team wants the AI agents to get purpose-built nonhuman identities that can be targeted by Conditional Access and governed by sponsors, distinct from the identities of traditional applications.

    Which identity type should you recommend for the AI agents?
  fr: |
    Contoso, Ltd. dispose de Microsoft 365 E7. Des utilisateurs métier créent des agents IA dans Microsoft Copilot Studio, et des centaines d'agents sont créés et retirés chaque mois. Par ailleurs, le service informatique exploite une application web de paie qui utilise une identité managée pour lire une base de données Azure SQL.

    L'équipe de sécurité veut que les agents IA obtiennent des identités non humaines dédiées, qui puissent être ciblées par l'accès conditionnel et gouvernées par des sponsors, distinctes des identités des applications traditionnelles.

    Quel type d'identité devez-vous recommander pour les agents IA ?
body:
  options:
    - { id: a, text: { en: "Agent identities from Microsoft Entra Agent ID", fr: "Des identités d'agent de Microsoft Entra Agent ID" } }
    - { id: b, text: { en: "User-assigned managed identities", fr: "Des identités managées affectées par l'utilisateur" } }
    - { id: c, text: { en: "App registrations with workload identity federation", fr: "Des inscriptions d'applications avec la fédération des identités de charge de travail" } }
    - { id: d, text: { en: "Cloud-only user accounts with a service naming convention", fr: "Des comptes d'utilisateur cloud uniquement avec une convention de nommage de service" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Microsoft Entra Agent ID gives AI agents agent identities: nonhuman identities designed for agents that are created in bulk, for example from Copilot Studio, and retired without orphaned credentials or permissions. They can be targeted by Conditional Access for agents and governed with sponsors and access packages. The payroll app's managed identity remains a workload identity.
    fr: |
      Microsoft Entra Agent ID donne aux agents IA des identités d'agent : des identités non humaines conçues pour des agents créés en masse, par exemple depuis Copilot Studio, et retirés sans informations d'identification ni autorisations orphelines. Elles peuvent être ciblées par l'accès conditionnel pour les agents et gouvernées par des sponsors et des packages d'accès. L'identité managée de l'application de paie reste une identité de charge de travail.
  options:
    b:
      en: |
        Managed identities are workload identities tied to Azure resources; they aren't the identity type that Agent ID manages for AI agents.
      fr: |
        Les identités managées sont des identités de charge de travail liées à des ressources Azure ; ce n'est pas le type d'identité qu'Agent ID gère pour les agents IA.
    c:
      en: |
        App registrations and their service principals suit long-lived applications with known ownership, not agents created and destroyed dynamically, and they aren't agent identities.
      fr: |
        Les inscriptions d'applications et leurs principaux de service conviennent à des applications durables dont le propriétaire est connu, pas à des agents créés et détruits dynamiquement, et ce ne sont pas des identités d'agent.
    d:
      en: |
        Ordinary user accounts would treat agents as humans, with passwords and MFA, and wouldn't distinguish them from employees.
      fr: |
        Des comptes d'utilisateur ordinaires traiteraient les agents comme des humains, avec des mots de passe et la MFA, et ne les distingueraient pas des employés.
references:
  - title: What are agent identities?
    url: https://learn.microsoft.com/en-us/entra/agent-id/identity-platform/what-is-agent-id
  - title: What is Microsoft Entra Agent ID?
    url: https://learn.microsoft.com/en-us/entra/agent-id/identity-professional/microsoft-entra-agent-identities-for-ai-agents
