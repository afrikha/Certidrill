id: sc100-2a-siem-third-party
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR with Microsoft 365 E5. Its environment also includes Palo Alto Networks firewalls in two datacenters, workloads in AWS and an Okta tenant used by a recently acquired subsidiary.

    The SOC must correlate the firewall logs, the AWS CloudTrail events and the Okta sign-in events with the Defender XDR alerts, and work from a single incident queue. Custom detection logic must be supported.

    What should you recommend?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR avec Microsoft 365 E5. Son environnement comprend aussi des pare-feu Palo Alto Networks dans deux centres de données, des charges de travail dans AWS et un locataire Okta utilisé par une filiale récemment acquise.

    Le SOC doit corréler les journaux des pare-feu, les événements AWS CloudTrail et les événements de connexion Okta avec les alertes Defender XDR, et travailler depuis une seule file d'incidents. Une logique de détection personnalisée doit être prise en charge.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Defender for Cloud with the AWS connector, integrated with Defender XDR", fr: "Microsoft Defender pour le cloud avec le connecteur AWS, intégré à Defender XDR" } }
    - { id: b, text: { en: "Microsoft Sentinel with data connectors, onboarded to the Microsoft Defender portal", fr: "Microsoft Sentinel avec des connecteurs de données, intégré au portail Microsoft Defender" } }
    - { id: c, text: { en: "Microsoft Purview Audit (Premium) with the Office 365 Management Activity API", fr: "Microsoft Purview Audit (Premium) avec l'Office 365 Management Activity API" } }
    - { id: d, text: { en: "An Azure Monitor Log Analytics workspace with log search alert rules", fr: "Un espace de travail Log Analytics Azure Monitor avec des règles d'alerte de recherche dans les journaux" } }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft Sentinel is the SIEM that ingests any source through data connectors (firewalls, AWS, Okta) and runs custom analytics rules. Onboarded to the Defender portal, its alerts and the Defender XDR alerts are correlated into the same incidents, in a single queue.
    fr: Microsoft Sentinel est le SIEM qui ingère n'importe quelle source au moyen de connecteurs de données (pare-feu, AWS, Okta) et exécute des règles d'analyse personnalisées. Intégré au portail Defender, ses alertes et celles de Defender XDR sont corrélées dans les mêmes incidents, dans une seule file.
  options:
    a:
      en: Defender for Cloud assesses and protects the AWS resources, but it doesn't ingest firewall logs or Okta sign-ins for correlation.
      fr: Defender pour le cloud évalue et protège les ressources AWS, mais n'ingère ni les journaux de pare-feu ni les connexions Okta à des fins de corrélation.
    c:
      en: Purview Audit records Microsoft 365 activity for compliance and forensics; it isn't a SIEM and doesn't correlate third-party events.
      fr: Purview Audit enregistre l'activité Microsoft 365 pour la conformité et l'investigation ; ce n'est pas un SIEM et il ne corrèle pas d'événements tiers.
    d:
      en: A workspace with alert rules can store and query logs, but it has no incident correlation with Defender XDR and no SOC incident queue.
      fr: Un espace de travail avec des règles d'alerte peut stocker et interroger des journaux, mais il n'offre ni corrélation d'incidents avec Defender XDR ni file d'incidents pour le SOC.
references:
  - title: Microsoft Sentinel in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/azure/sentinel/microsoft-sentinel-defender-portal
