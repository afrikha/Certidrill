id: sc100-2b-ca-rollout-order
objective: "2.2.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation designs a new Conditional Access policy that requires a compliant device for all users and all resources. The policy is part of its Zero Trust plan. The security team wants to confirm the impact of the policy before users can be blocked, and to limit disruption during the rollout.

    Which four actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation conçoit une nouvelle stratégie d'accès conditionnel qui exige un appareil conforme pour tous les utilisateurs et toutes les ressources. La stratégie fait partie de son plan Confiance Zéro. L'équipe de sécurité veut confirmer l'impact de la stratégie avant que des utilisateurs puissent être bloqués, et limiter les perturbations pendant le déploiement.

    Quelles sont les quatre actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: report, text: { en: "Create the policy in report-only mode.", fr: "Créer la stratégie en mode rapport seul." } }
    - { id: review, text: { en: "Review the report-only results in the sign-in logs and the insights and reporting workbook.", fr: "Examiner les résultats en mode rapport seul dans les journaux de connexion et le classeur d'insights et de rapports." } }
    - { id: pilot, text: { en: "Turn on the policy for a pilot group.", fr: "Activer la stratégie pour un groupe pilote." } }
    - { id: all, text: { en: "Turn on the policy for all users.", fr: "Activer la stratégie pour tous les utilisateurs." } }
    - { id: secdef, text: { en: "Enable security defaults for the tenant.", fr: "Activer les paramètres de sécurité par défaut du locataire." } }
    - { id: excladm, text: { en: "Exclude all administrators from the policy permanently.", fr: "Exclure définitivement tous les administrateurs de la stratégie." } }
answer:
  sequence: [ report, review, pilot, all ]
explanation:
  correct:
    en: |-
      New policies start in report-only mode, which evaluates them at sign-in without enforcing grant or session controls. The results in the sign-in logs and in the insights and reporting workbook show the impact before enforcement. The policy is then piloted with a group and finally enabled for everyone.
    fr: |-
      Les nouvelles stratégies démarrent en mode rapport seul, qui les évalue à la connexion sans appliquer les contrôles d'octroi ou de session. Les résultats dans les journaux de connexion et dans le classeur d'insights et de rapports montrent l'impact avant l'application. La stratégie est ensuite testée avec un groupe pilote, puis activée pour tous.
  options:
    secdef: { en: "Security defaults can't be combined with Conditional Access policies.", fr: "Les paramètres de sécurité par défaut ne peuvent pas être combinés avec des stratégies d'accès conditionnel." }
    excladm: { en: "Only emergency access accounts should be excluded; excluding all administrators creates a gap for the most privileged accounts.", fr: "Seuls les comptes d'accès d'urgence doivent être exclus ; exclure tous les administrateurs crée une lacune pour les comptes les plus privilégiés." }
references:
  - title: Plan a Conditional Access deployment
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/plan-conditional-access
  - title: Analyze Conditional Access Policy Impact
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-report-only
