id: sc100-cs2b-pci-report
objective: "2.4.4"
type: single
caseStudy: sc100-cs2b-vanarsdel-payments
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution that produces the report that the auditors require. The solution must meet the compliance requirements and the general requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui produit le rapport exigé par les auditeurs. La solution doit répondre aux exigences de conformité et aux exigences générales.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Assign the PCI DSS built-in initiative of Azure Policy to MG-VanArsdel and export its compliance results", fr: "Attribuer l'initiative intégrée PCI DSS d'Azure Policy à MG-VanArsdel et exporter ses résultats de conformité" } }
    - { id: b, text: { en: "Download the PCI DSS attestation of Microsoft from the audit reports of the Service Trust Portal", fr: "Télécharger l'attestation PCI DSS de Microsoft depuis les rapports d'audit du Service Trust Portal" } }
    - { id: c, text: { en: "Add the PCI DSS v4.0.1 standard to each environment in Defender for Cloud and download its compliance report", fr: "Ajouter la norme PCI DSS v4.0.1 à chaque environnement dans Defender for Cloud et télécharger son rapport de conformité" } }
    - { id: d, text: { en: "Track the improvement actions of the PCI DSS category in Microsoft Secure Score and export the history", fr: "Suivre les actions d'amélioration de la catégorie PCI DSS dans le Niveau de sécurité Microsoft et en exporter l'historique" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The regulatory compliance dashboard of Defender for Cloud assesses resources against the controls of a standard, and PCI DSS v4.0.1 is available for Azure, AWS and GCP once the accounts and the project are connected. Adding a standard other than the MCSB requires at least one paid plan, which Defender CSPM provides. The Download report action produces a PDF of the status by control for the auditors.
    fr: |
      Le tableau de bord de conformité réglementaire de Defender for Cloud évalue les ressources par rapport aux contrôles d'une norme, et PCI DSS v4.0.1 est disponible pour Azure, AWS et GCP une fois les comptes et le projet connectés. Ajouter une norme autre que le MCSB exige au moins un plan payant, ce que Defender CSPM fournit. L'action Download report produit un PDF de l'état par contrôle pour les auditeurs.
  options:
    a:
      en: An Azure Policy initiative evaluates only Azure resources, so the AWS accounts and the GCP project would be missing from the report.
      fr: Une initiative Azure Policy n'évalue que des ressources Azure ; les comptes AWS et le projet GCP manqueraient donc dans le rapport.
    b:
      en: The Service Trust Portal reports cover the compliance of Microsoft's own cloud services, not the configuration of the customer's resources in three clouds.
      fr: Les rapports du Service Trust Portal couvrent la conformité des services cloud de Microsoft eux-mêmes, pas la configuration des ressources du client dans trois clouds.
    d:
      en: Microsoft Secure Score measures the posture of Microsoft 365 and related workloads; it doesn't report PCI DSS controls for Azure, AWS and GCP resources.
      fr: Le Niveau de sécurité Microsoft mesure la posture de Microsoft 365 et des charges de travail associées ; il ne rend pas compte des contrôles PCI DSS pour des ressources Azure, AWS et GCP.
references:
  - title: Improve regulatory compliance in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
  - title: Regulatory compliance in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
