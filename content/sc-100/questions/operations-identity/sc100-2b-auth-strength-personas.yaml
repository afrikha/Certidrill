id: sc100-2b-auth-strength-personas
objective: "2.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing Conditional Access grant controls for three personas and wants to use built-in authentication strengths only.

    - Administrators must use only FIDO2 security keys, Windows Hello for Business or multifactor certificate-based authentication.
    - Warehouse supervisors must sign in without a password; Microsoft Authenticator phone sign-in is allowed.
    - Contractors can use a password plus a push notification, a software OATH token or a text message.

    Which authentication strength should you recommend for each persona? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit les contrôles d'octroi de l'accès conditionnel pour trois personas et ne veut utiliser que des forces d'authentification intégrées.

    - Les administrateurs ne doivent utiliser que des clés de sécurité FIDO2, Windows Hello Entreprise ou l'authentification par certificat multifacteur.
    - Les superviseurs d'entrepôt doivent se connecter sans mot de passe ; la connexion par téléphone avec Microsoft Authenticator est autorisée.
    - Les prestataires peuvent utiliser un mot de passe plus une notification Push, un jeton OATH logiciel ou un SMS.

    Quelle force d'authentification devez-vous recommander pour chaque persona ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Administrators: [[adm]]

      Warehouse supervisors: [[sup]]

      Contractors: [[ctr]]
    fr: |
      Administrateurs : [[adm]]

      Superviseurs d'entrepôt : [[sup]]

      Prestataires : [[ctr]]
  slots:
    - id: adm
      options:
        - { id: mfa, text: Multifactor authentication }
        - { id: pwl, text: Passwordless MFA }
        - { id: phr, text: Phishing-resistant MFA }
    - id: sup
      options:
        - { id: mfa, text: Multifactor authentication }
        - { id: pwl, text: Passwordless MFA }
        - { id: phr, text: Phishing-resistant MFA }
    - id: ctr
      options:
        - { id: mfa, text: Multifactor authentication }
        - { id: pwl, text: Passwordless MFA }
        - { id: phr, text: Phishing-resistant MFA }
answer:
  values: { adm: phr, sup: pwl, ctr: mfa }
explanation:
  correct:
    en: |-
      Phishing-resistant MFA allows only FIDO2 security keys, Windows Hello for Business or platform credentials, and multifactor certificate-based authentication. Passwordless MFA allows the same methods plus Microsoft Authenticator phone sign-in. The Multifactor authentication strength also accepts a password plus something the user has, such as a push notification, an OATH token or a text message.
    fr: |-
      Phishing-resistant MFA n'autorise que les clés de sécurité FIDO2, Windows Hello Entreprise ou les informations d'identification de plateforme, et l'authentification par certificat multifacteur. Passwordless MFA autorise les mêmes méthodes plus la connexion par téléphone avec Microsoft Authenticator. La force Multifactor authentication accepte aussi un mot de passe plus un élément que possède l'utilisateur, comme une notification Push, un jeton OATH ou un SMS.
references:
  - title: Conditional Access authentication strengths
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-strengths
