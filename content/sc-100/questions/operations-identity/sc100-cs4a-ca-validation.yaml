id: sc100-cs4a-ca-validation
objective: "2.2.6"
type: yesno_statements
caseStudy: sc100-cs4a-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You are validating the existing Conditional Access policies to meet the Conditional Access requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous validez les stratégies d'accès conditionnel existantes pour respecter les exigences relatives à l'accès conditionnel.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The exclusions of CA02 follow Microsoft's Conditional Access guidance.
        fr: |-
          Les exclusions de CA02 suivent les recommandations de Microsoft pour l'accès conditionnel.
    - id: s2
      text:
        en: |-
          To align CA01 with Zero Trust, you should remove the Crew-Travel exclusion and change the target resources to All resources.
        fr: |-
          Pour aligner CA01 sur la Confiance Zéro, vous devez supprimer l'exclusion de Crew-Travel et remplacer les ressources cibles par Toutes les ressources.
    - id: s3
      text:
        en: |-
          CA03 follows the verify explicitly principle, because sign-ins from HQ-Networks come from the corporate network.
        fr: |-
          CA03 suit le principe de vérification explicite, car les connexions depuis HQ-Networks proviennent du réseau d'entreprise.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |-
      Microsoft recommends excluding the emergency access accounts from Conditional Access policies to prevent a lockout, and CA02 excludes only them. A large group excluded for years leaves 2,400 users without the control, and a policy that targets All resources covers new apps without changes, so CA01 needs both fixes. Zero Trust treats every request as untrusted regardless of its origin: skipping multifactor authentication because a sign-in comes from the corporate network relies on location as implicit trust.
    fr: |-
      Microsoft recommande d'exclure les comptes d'accès d'urgence des stratégies d'accès conditionnel pour éviter un verrouillage, et CA02 n'exclut qu'eux. Un groupe important exclu depuis des années laisse 2 400 utilisateurs sans le contrôle, et une stratégie qui cible Toutes les ressources couvre les nouvelles applications sans modification : CA01 a donc besoin des deux corrections. La Confiance Zéro traite chaque demande comme non approuvée, quelle que soit son origine : ne pas exiger l'authentification multifacteur parce qu'une connexion provient du réseau d'entreprise revient à accorder une confiance implicite à l'emplacement.
references:
  - title: Plan a Conditional Access deployment
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/plan-conditional-access
  - title: Zero Trust as a security foundation
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
