id: sc100-2a-simulated-coverage
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Sentinel and has installed several content hub solutions, but has enabled only a few of their analytics rule templates. Before enabling more rules, the detection engineering lead wants to know which MITRE ATT&CK techniques would be covered if the available detections were enabled.

    You need to recommend how to obtain this view with the least effort.

    What should you recommend?
  fr: |
    Northwind Traders utilise Microsoft Sentinel et a installé plusieurs solutions du hub de contenu, mais n'a activé que quelques-uns de leurs modèles de règles d'analyse. Avant d'activer davantage de règles, le responsable de l'ingénierie de détection veut savoir quelles techniques MITRE ATT&CK seraient couvertes si les détections disponibles étaient activées.

    Vous devez recommander comment obtenir cette vue avec le moins d'effort.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The active coverage view of the Sentinel MITRE ATT&CK page", fr: "La vue de couverture active de la page MITRE ATT&CK de Sentinel" } }
    - { id: b, text: { en: "The simulated coverage view of the Sentinel MITRE ATT&CK page", fr: "La vue de couverture simulée de la page MITRE ATT&CK de Sentinel" } }
    - { id: c, text: { en: "The secure score of Microsoft Defender for Cloud", fr: "Le degré de sécurisation de Microsoft Defender pour le cloud" } }
    - { id: d, text: { en: "A workbook that counts the incidents by MITRE tactic", fr: "Un classeur qui compte les incidents par tactique MITRE" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Simulated coverage shows the detections that are available but not yet configured in the workspace, so the team can see the coverage it could reach by enabling them. The default view shows only the scheduled and near-real-time rules that are currently active.
    fr: |
      La couverture simulée montre les détections disponibles mais pas encore configurées dans l'espace de travail : l'équipe peut ainsi voir la couverture qu'elle atteindrait en les activant. La vue par défaut ne montre que les règles planifiées et en quasi-temps réel actuellement actives.
  options:
    a:
      en: |
        Active coverage shows only the rules already enabled, not what the available templates would add.
      fr: |
        La couverture active ne montre que les règles déjà activées, pas ce qu'ajouteraient les modèles disponibles.
    c:
      en: |
        Secure score measures the security posture of cloud resources against recommendations; it doesn't map detections to MITRE techniques.
      fr: |
        Le degré de sécurisation mesure la posture de sécurité des ressources cloud par rapport à des recommandations ; il ne mappe pas les détections sur les techniques MITRE.
    d:
      en: |
        Incidents reflect what was detected in the past by enabled rules; they say nothing about rules that aren't enabled, and building a workbook adds effort.
      fr: |
        Les incidents reflètent ce que des règles activées ont détecté par le passé ; ils n'indiquent rien sur les règles non activées, et créer un classeur ajoute de l'effort.
references:
  - title: View MITRE ATT&CK Coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
