id: sc100-2b-eam-devops-plane
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. applies the enterprise access model. A central IT team manages the Azure subscriptions, the AWS accounts and the servers used across the company. A DevOps team manages the configuration and deployments of the order processing application only.

    You need to classify the administrative rights of the DevOps team.

    Which plane should you assign them to?
  fr: |
    Contoso, Ltd. applique le modèle d'accès d'entreprise. Une équipe informatique centrale gère les abonnements Azure, les comptes AWS et les serveurs utilisés dans toute l'entreprise. Une équipe DevOps gère uniquement la configuration et les déploiements de l'application de traitement des commandes.

    Vous devez classer les droits d'administration de l'équipe DevOps.

    À quel plan devez-vous les attribuer ?
body:
  options:
    - { id: a, text: { en: "Control plane", fr: "Plan de contrôle" } }
    - { id: b, text: { en: "Management plane", fr: "Plan de gestion" } }
    - { id: c, text: { en: "User access", fr: "Accès utilisateur" } }
    - { id: d, text: { en: "Data/workload plane", fr: "Plan des données/charges de travail" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The enterprise access model splits the former tier 1 into the management plane, for enterprise-wide IT management, and the data/workload plane, for the management of each workload by IT or business units. The split accommodates DevOps teams that manage a single application.
    fr: |-
      Le modèle d'accès d'entreprise divise l'ancien tier 1 entre le plan de gestion, pour la gestion informatique à l'échelle de l'entreprise, et le plan des données/charges de travail, pour la gestion de chaque charge de travail par l'informatique ou les unités métier. Cette division s'adapte aux équipes DevOps qui gèrent une seule application.
  options:
    a: { en: "The control plane is the centralized identity and access control of the enterprise, not the management of one application.", fr: "Le plan de contrôle est le contrôle centralisé des identités et des accès de l'entreprise, pas la gestion d'une application." }
    b: { en: "The management plane is the enterprise-wide IT management of the central team, such as subscriptions, accounts and servers.", fr: "Le plan de gestion est la gestion informatique à l'échelle de l'entreprise de l'équipe centrale, comme les abonnements, les comptes et les serveurs." }
    c: { en: "User access is how employees, partners and customers reach resources, not how they administer them.", fr: "L'accès utilisateur est la manière dont les employés, partenaires et clients atteignent les ressources, pas celle dont ils les administrent." }
references:
  - title: Enterprise access model
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model
