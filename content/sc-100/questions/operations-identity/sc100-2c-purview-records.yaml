id: sc100-2c-purview-records
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is a broker-dealer that stores trade confirmations in SharePoint document libraries and Exchange Online mailboxes.

    A regulation requires that the trade confirmations be kept for seven years and that nobody can edit or delete them during that period. At the end of the period, a compliance officer must validate the items before they're deleted, and Proseware must keep proof of the disposal.

    What should you include in the recommendation?
  fr: |
    Proseware, Inc. est un courtier en valeurs mobilières qui stocke des confirmations de transactions dans des bibliothèques de documents SharePoint et des boîtes aux lettres Exchange Online.

    Une réglementation exige que les confirmations de transactions soient conservées sept ans et que personne ne puisse les modifier ni les supprimer pendant cette période. À la fin de la période, un responsable de la conformité doit valider les éléments avant leur suppression, et Proseware doit conserver une preuve de la destruction.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "A retention policy that retains all the content of the SharePoint sites and the mailboxes for seven years", fr: "Une stratégie de rétention qui conserve tout le contenu des sites SharePoint et des boîtes aux lettres pendant sept ans" } }
    - { id: b, text: { en: "eDiscovery holds on the SharePoint sites and the mailboxes that store the confirmations", fr: "Des conservations eDiscovery sur les sites SharePoint et les boîtes aux lettres qui stockent les confirmations" } }
    - { id: c, text: { en: "Retention labels that declare the confirmations as records, with a disposition review at the end of the period", fr: "Des étiquettes de rétention qui déclarent les confirmations comme enregistrements, avec une révision avant destruction à la fin de la période" } }
    - { id: d, text: { en: "Sensitivity labels with encryption that grant view-only permissions on the confirmations", fr: "Des étiquettes de confidentialité avec chiffrement qui accordent des autorisations de lecture seule sur les confirmations" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In Records Management, a retention label that marks items as records restricts them: a locked record can't be edited or deleted, and Exchange items marked as records always behave as locked records. A disposition review lets a reviewer validate items before deletion at the end of the retention period, and proof of the disposal is kept and can be exported.
    fr: |
      Dans Records Management, une étiquette de rétention qui marque des éléments comme enregistrements les restreint : un enregistrement verrouillé ne peut être ni modifié ni supprimé, et les éléments Exchange marqués comme enregistrements se comportent toujours comme des enregistrements verrouillés. Une révision avant destruction permet à un réviseur de valider les éléments avant leur suppression à la fin de la période de rétention, et la preuve de la destruction est conservée et exportable.
  options:
    a:
      en: "A retention policy keeps content for a location but doesn't declare records, so items can still be edited, and it offers no disposition review."
      fr: "Une stratégie de rétention conserve le contenu d'un emplacement mais ne déclare pas d'enregistrements : les éléments restent modifiables, et elle n'offre pas de révision avant destruction."
    b:
      en: "eDiscovery holds preserve content for litigation or an investigation; they don't manage a retention period and its disposal."
      fr: "Les conservations eDiscovery préservent du contenu pour un litige ou une enquête ; elles ne gèrent pas une période de rétention et sa destruction."
    d:
      en: "Sensitivity labels protect who can open and use content; they don't retain it or control its disposal."
      fr: "Les étiquettes de confidentialité protègent qui peut ouvrir et utiliser le contenu ; elles ne le conservent pas et ne contrôlent pas sa destruction."
references:
  - title: Records management for documents and emails in Microsoft 365
    url: https://learn.microsoft.com/en-us/purview/records-management
