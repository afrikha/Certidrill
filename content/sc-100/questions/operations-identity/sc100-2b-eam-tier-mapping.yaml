id: sc100-2b-eam-tier-mapping
objective: "2.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders currently secures its on-premises Active Directory with the tier model. The company is moving to the enterprise access model to cover Microsoft Entra ID, Azure, AWS and its partners and customers, and needs to explain to the administrators how the tiers map to the new model.

    How should you complete the mapping? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders sécurise actuellement son Active Directory local avec le modèle de niveaux (tiers). L'entreprise passe au modèle d'accès d'entreprise pour couvrir Microsoft Entra ID, Azure, AWS ainsi que ses partenaires et clients, et doit expliquer aux administrateurs comment les tiers correspondent au nouveau modèle.

    Comment devez-vous compléter la correspondance ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Tier 0 becomes: [[t0]]

      Tier 1 becomes: [[t1]]

      Tier 2 becomes: [[t2]]
    fr: |
      Le tier 0 devient : [[t0]]

      Le tier 1 devient : [[t1]]

      Le tier 2 devient : [[t2]]
  slots:
    - id: t0
      options:
        - { id: ctrl, text: { en: "The control plane", fr: "Le plan de contrôle" } }
        - { id: mgmt, text: { en: "The management plane and the data/workload plane", fr: "Le plan de gestion et le plan des données/charges de travail" } }
        - { id: access, text: { en: "User access and app access", fr: "L'accès utilisateur et l'accès aux applications" } }
        - { id: priv, text: { en: "The privileged access pathways", fr: "Les chemins d'accès privilégié" } }
    - id: t1
      options:
        - { id: ctrl, text: { en: "The control plane", fr: "Le plan de contrôle" } }
        - { id: mgmt, text: { en: "The management plane and the data/workload plane", fr: "Le plan de gestion et le plan des données/charges de travail" } }
        - { id: access, text: { en: "User access and app access", fr: "L'accès utilisateur et l'accès aux applications" } }
        - { id: priv, text: { en: "The privileged access pathways", fr: "Les chemins d'accès privilégié" } }
    - id: t2
      options:
        - { id: ctrl, text: { en: "The control plane", fr: "Le plan de contrôle" } }
        - { id: mgmt, text: { en: "The management plane and the data/workload plane", fr: "Le plan de gestion et le plan des données/charges de travail" } }
        - { id: access, text: { en: "User access and app access", fr: "L'accès utilisateur et l'accès aux applications" } }
        - { id: priv, text: { en: "The privileged access pathways", fr: "Les chemins d'accès privilégié" } }
answer:
  values: { t0: ctrl, t1: mgmt, t2: access }
explanation:
  correct:
    en: |-
      Tier 0 expands into the control plane, which covers all aspects of access control, including network access control where it's the only option. Tier 1 splits into the management plane (enterprise-wide IT management) and the data/workload plane (per-workload management). Tier 2 splits into user access (including B2B and B2C) and app access (API pathways).
    fr: |-
      Le tier 0 s'étend en plan de contrôle, qui couvre tous les aspects du contrôle d'accès, y compris le contrôle d'accès réseau quand c'est la seule option. Le tier 1 se divise en plan de gestion (gestion informatique à l'échelle de l'entreprise) et plan des données/charges de travail (gestion par charge de travail). Le tier 2 se divise en accès utilisateur (y compris B2B et B2C) et accès aux applications (chemins d'accès par API).
  options:
    priv: { en: "Privileged access pathways describe how IT staff and developers manage the systems; they aren't the replacement of one tier.", fr: "Les chemins d'accès privilégié décrivent comment le personnel informatique et les développeurs gèrent les systèmes ; ils ne remplacent pas un tier en particulier." }
references:
  - title: Enterprise access model
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model
