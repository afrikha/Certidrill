id: sc100-2b-role-deviations
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank asks you to evaluate the security of its Microsoft Entra roles. The tenant synchronizes users from AD DS, and Microsoft Entra ID P2 licenses are available. The review produced the findings listed below.

    Which two findings should you report as deviations from Microsoft's best practices for Microsoft Entra roles?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank vous demande d'évaluer la sécurité de ses rôles Microsoft Entra. Le locataire synchronise des utilisateurs depuis AD DS, et des licences Microsoft Entra ID P2 sont disponibles. La revue a produit les constats listés ci-dessous.

    Quels sont les deux constats à signaler comme des écarts par rapport aux bonnes pratiques de Microsoft pour les rôles Microsoft Entra ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Two cloud-only emergency access accounts have a permanent active Global Administrator assignment", fr: "Deux comptes d'accès d'urgence cloud uniquement ont une attribution active permanente de Global Administrator" } }
    - { id: b, text: { en: "Privileged roles are assigned to role-assignable groups whose membership is managed in PIM", fr: "Des rôles privilégiés sont attribués à des groupes assignables à un rôle dont l'appartenance est gérée dans PIM" } }
    - { id: c, text: { en: "Seven administrators have a permanent Global Administrator assignment for their daily work", fr: "Sept administrateurs ont une attribution permanente de Global Administrator pour leur travail quotidien" } }
    - { id: d, text: { en: "Activation of privileged roles in PIM requires MFA and a justification", fr: "L'activation des rôles privilégiés dans PIM exige la MFA et une justification" } }
    - { id: e, text: { en: "Several Microsoft Entra roles are assigned to accounts synchronized from AD DS", fr: "Plusieurs rôles Microsoft Entra sont attribués à des comptes synchronisés depuis AD DS" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      Microsoft recommends fewer than five Global Administrators and just-in-time access through PIM instead of permanent assignments used for daily work. Microsoft Entra roles should be assigned to cloud-only accounts, because a compromised on-premises account can compromise Microsoft Entra resources.
    fr: |-
      Microsoft recommande moins de cinq Global Administrators et un accès juste-à-temps par PIM plutôt que des attributions permanentes utilisées pour le travail quotidien. Les rôles Microsoft Entra doivent être attribués à des comptes cloud uniquement, car un compte local compromis peut compromettre les ressources Microsoft Entra.
  options:
    a: { en: "Two cloud-only emergency access accounts with a permanent Global Administrator assignment are a recommended practice.", fr: "Deux comptes d'accès d'urgence cloud uniquement avec une attribution permanente de Global Administrator sont une pratique recommandée." }
    b: { en: "Role-assignable groups managed in PIM avoid standing owners or members, which Microsoft recommends.", fr: "Des groupes assignables à un rôle gérés dans PIM évitent les propriétaires ou membres permanents, ce que Microsoft recommande." }
    d: { en: "Requiring MFA and a justification at activation is part of the recommended PIM configuration.", fr: "Exiger la MFA et une justification à l'activation fait partie de la configuration PIM recommandée." }
references:
  - title: Best practices for Microsoft Entra roles
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/best-practices
