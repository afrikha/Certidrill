id: sc100-2b-pta-account-policy
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. synchronizes its AD DS forest to Microsoft Entra ID and plans the sign-in method for Microsoft 365. The security policy states that the on-premises account state must be enforced at the moment of each cloud sign-in: a locked-out account, an expired password or a sign-in outside the allowed logon hours must be refused immediately.

    The company doesn't want to deploy or operate federation servers. If the on-premises authentication components fail completely, administrators must be able to switch users to a cloud-based sign-in method.

    What should you recommend?
  fr: |
    Contoso, Ltd. synchronise sa forêt AD DS avec Microsoft Entra ID et planifie la méthode de connexion à Microsoft 365. La politique de sécurité impose que l'état du compte local soit appliqué au moment de chaque connexion cloud : un compte verrouillé, un mot de passe expiré ou une connexion en dehors des heures d'ouverture de session autorisées doivent être refusés immédiatement.

    L'entreprise ne veut ni déployer ni exploiter de serveurs de fédération. Si les composants d'authentification locaux tombent complètement en panne, les administrateurs doivent pouvoir basculer les utilisateurs vers une méthode de connexion basée sur le cloud.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Password hash synchronization only, with password writeback enabled", fr: "Synchronisation du hachage de mot de passe seule, avec la réécriture du mot de passe activée" } }
    - { id: b, text: { en: "Federation with AD FS, with password hash synchronization enabled as a backup", fr: "Fédération avec AD FS, avec la synchronisation du hachage de mot de passe activée en secours" } }
    - { id: c, text: { en: "Pass-through authentication, with password hash synchronization enabled as a backup", fr: "Authentification directe, avec la synchronisation du hachage de mot de passe activée en secours" } }
    - { id: d, text: { en: "Password hash synchronization only, with Seamless single sign-on enabled", fr: "Synchronisation du hachage de mot de passe seule, avec l'authentification unique fluide activée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Pass-through authentication validates the password against AD DS through on-premises agents, so it enforces locked-out, expired and logon-hours states at sign-in without federation servers. Enabling password hash synchronization as well provides a backup method; the failover isn't automatic, and administrators switch the sign-in method in Microsoft Entra Connect.
    fr: |-
      L'authentification directe valide le mot de passe auprès d'AD DS par des agents locaux ; elle applique donc à la connexion les états verrouillé, expiré et heures d'ouverture de session, sans serveurs de fédération. Activer aussi la synchronisation du hachage de mot de passe fournit une méthode de secours ; le basculement n'est pas automatique, et les administrateurs changent la méthode de connexion dans Microsoft Entra Connect.
  options:
    a: { en: "Password hash synchronization only enforces disabled accounts, with a delay; it doesn't refuse locked-out accounts or logon-hours violations immediately.", fr: "La synchronisation du hachage de mot de passe n'applique que les comptes désactivés, avec un délai ; elle ne refuse pas immédiatement les comptes verrouillés ni les connexions hors des heures autorisées." }
    b: { en: "Federation meets the account state requirement, but it requires federation servers, which the company refuses.", fr: "La fédération répond à l'exigence sur l'état du compte, mais elle exige des serveurs de fédération, que l'entreprise refuse." }
    d: { en: "Seamless single sign-on improves the user experience but doesn't change how password hash synchronization enforces account states.", fr: "L'authentification unique fluide améliore l'expérience utilisateur mais ne change pas la manière dont la synchronisation du hachage de mot de passe applique l'état des comptes." }
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
