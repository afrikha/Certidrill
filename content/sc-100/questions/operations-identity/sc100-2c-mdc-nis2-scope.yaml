id: sc100-2c-mdc-nis2-scope
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. must demonstrate alignment with the EU NIS2 directive. Its environment contains:

    - Azure subscriptions under the tenant root management group
    - An AWS organization connected to Microsoft Defender for Cloud through its management account, with new member accounts onboarded automatically
    - A GCP organization connected at the organization level

    The Defender CSPM plan is enabled everywhere. The security team works in the Microsoft Defender portal. You need a single view of NIS2 compliance for all current and future subscriptions, accounts and projects. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Fabrikam, Inc. doit démontrer son alignement sur la directive européenne NIS2. Son environnement contient :

    - Des abonnements Azure sous le groupe d'administration racine du locataire
    - Une organisation AWS connectée à Microsoft Defender pour le cloud par son compte de gestion, avec intégration automatique des nouveaux comptes membres
    - Une organisation GCP connectée au niveau de l'organisation

    Le plan Defender CSPM est activé partout. L'équipe de sécurité travaille dans le portail Microsoft Defender. Vous avez besoin d'une vue unique de la conformité NIS2 pour tous les abonnements, comptes et projets actuels et futurs. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Assign the EU NIS2 2022 standard to each subscription, AWS account and GCP project, and to each new one as it's created", fr: "Attribuer la norme EU NIS2 2022 à chaque abonnement, compte AWS et projet GCP, et à chaque nouveau dès sa création" } }
    - { id: b, text: { en: "Assign an Azure Policy initiative for NIS2 to the tenant root management group", fr: "Attribuer une initiative Azure Policy pour NIS2 au groupe d'administration racine du locataire" } }
    - { id: c, text: { en: "Assign the EU NIS2 2022 standard in the Azure portal to the tenant root management group, the AWS management account and the GCP organization", fr: "Attribuer la norme EU NIS2 2022 dans le portail Azure au groupe d'administration racine du locataire, au compte de gestion AWS et à l'organisation GCP" } }
    - { id: d, text: { en: "Assign the EU NIS2 2022 standard to the AWS and GCP connectors from the regulatory compliance page of the Defender portal", fr: "Attribuer la norme EU NIS2 2022 aux connecteurs AWS et GCP depuis la page de conformité réglementaire du portail Defender" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      EU NIS2 2022 is available for Azure, AWS and GCP. Microsoft recommends assigning a standard at the highest applicable scope, a management group, an AWS management account or a GCP organization, so compliance data is aggregated for all the nested resources, including those added later. Standards are assigned in the Azure portal; the Defender portal then shows the assigned standards in read-only monitoring.
    fr: |
      EU NIS2 2022 est disponible pour Azure, AWS et GCP. Microsoft recommande d'attribuer une norme à l'étendue applicable la plus haute, un groupe d'administration, un compte de gestion AWS ou une organisation GCP, pour agréger les données de conformité de toutes les ressources imbriquées, y compris celles ajoutées plus tard. Les normes s'attribuent dans le portail Azure ; le portail Defender affiche ensuite les normes attribuées en supervision en lecture seule.
  options:
    a:
      en: "Per-account assignments give the same result with far more effort, and any new account forgotten is left out."
      fr: "Des attributions par compte donnent le même résultat avec beaucoup plus d'effort, et tout nouveau compte oublié reste en dehors."
    b:
      en: "An Azure Policy initiative covers only the Azure subscriptions; the AWS and GCP resources would be missing."
      fr: "Une initiative Azure Policy ne couvre que les abonnements Azure : les ressources AWS et GCP manqueraient."
    d:
      en: "The Defender portal offers read-only monitoring of assigned standards; configuration and assignment are done in the Azure portal."
      fr: "Le portail Defender offre une supervision en lecture seule des normes attribuées ; la configuration et l'attribution se font dans le portail Azure."
references:
  - title: Assign regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages
  - title: Regulatory compliance in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
