id: sc100-2b-vault-protection
objective: "2.2.8"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys hosts web apps in Azure App Service. The apps read their secrets from Azure Key Vault by using a client secret stored in each app's configuration file.

    A security review sets two requirements: deleted keys and secrets must be recoverable, and nobody, including an administrator with full permissions, must be able to permanently delete them during the retention period; and the apps must stop storing any credential to authenticate to Key Vault.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys héberge des applications web dans Azure App Service. Les applications lisent leurs secrets dans Azure Key Vault à l'aide d'un secret client stocké dans le fichier de configuration de chaque application.

    Une revue de sécurité fixe deux exigences : les clés et secrets supprimés doivent pouvoir être récupérés, et personne, pas même un administrateur disposant de toutes les autorisations, ne doit pouvoir les supprimer définitivement pendant la période de rétention ; et les applications ne doivent plus stocker aucune information d'identification pour s'authentifier auprès de Key Vault.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable soft delete and purge protection on the vaults", fr: "Activer la suppression réversible et la protection contre le vidage sur les coffres" } }
    - { id: b, text: { en: "Move the client secrets to App Service application settings", fr: "Déplacer les secrets client dans les paramètres d'application d'App Service" } }
    - { id: c, text: { en: "Switch the vaults to the vault access policy permission model", fr: "Basculer les coffres vers le modèle d'autorisation par stratégie d'accès au coffre" } }
    - { id: d, text: { en: "Back up every secret to a storage account each night", fr: "Sauvegarder chaque secret dans un compte de stockage chaque nuit" } }
    - { id: e, text: { en: "Authenticate the apps to Key Vault with managed identities", fr: "Authentifier les applications auprès de Key Vault avec des identités managées" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Soft delete keeps deleted objects recoverable for 7 to 90 days, and purge protection prevents their permanent deletion during that period, even by a malicious administrator. Managed identities let the apps authenticate to Key Vault without any credential stored in code or configuration.
    fr: |-
      La suppression réversible garde les objets supprimés récupérables pendant 7 à 90 jours, et la protection contre le vidage empêche leur suppression définitive pendant cette période, même par un administrateur malveillant. Les identités managées permettent aux applications de s'authentifier auprès de Key Vault sans aucune information d'identification stockée dans le code ou la configuration.
  options:
    c: { en: "Access policies are the legacy model; Microsoft recommends Azure RBAC, and the model doesn't affect deletion or app credentials.", fr: "Les stratégies d'accès sont le modèle hérité ; Microsoft recommande Azure RBAC, et le modèle n'influe ni sur la suppression ni sur les informations d'identification des applications." }
    d: { en: "A backup helps restore objects but doesn't stop an administrator from permanently deleting them in the vault.", fr: "Une sauvegarde aide à restaurer des objets mais n'empêche pas un administrateur de les supprimer définitivement dans le coffre." }
    b: { en: "Application settings still store a credential; the requirement is to remove it.", fr: "Les paramètres d'application stockent toujours une information d'identification ; l'exigence est de la supprimer." }
references:
  - title: Secure your Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/best-practices
