id: sc100-2a-private-access-vpn
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has users who work remotely and connect to the on-premises datacenter through a VPN. They use internal web apps, SMB file shares and RDP to administrative servers. The CISO wants to retire the VPN.

    The replacement must give per-application access to these private resources, without exposing them to the internet, and every access must be governed by Conditional Access policies.

    What should you recommend?
  fr: |
    Northwind Traders a des utilisateurs qui travaillent à distance et se connectent au centre de données local par un VPN. Ils utilisent des applications web internes, des partages de fichiers SMB et le RDP vers des serveurs d'administration. Le RSSI veut retirer le VPN.

    La solution de remplacement doit donner un accès par application à ces ressources privées, sans les exposer à Internet, et chaque accès doit être régi par des stratégies d'accès conditionnel.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra Internet Access", fr: "Accès Internet Microsoft Entra" } }
    - { id: b, text: { en: "Microsoft Entra application proxy", fr: "Le proxy d'application Microsoft Entra" } }
    - { id: c, text: { en: "Microsoft Entra Private Access", fr: "Accès privé Microsoft Entra" } }
    - { id: d, text: { en: "Defender for Cloud Apps session control", fr: "Le contrôle de session de Defender for Cloud Apps" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft Entra Private Access is the Zero Trust Network Access (ZTNA) part of Global Secure Access: it gives access to private resources without a legacy VPN, supports per-app access for TCP and UDP traffic, uses private network connectors so that nothing is exposed to the internet, and integrates with Conditional Access.
    fr: |
      Accès privé Microsoft Entra est la partie Zero Trust Network Access (ZTNA) de Global Secure Access : il donne accès aux ressources privées sans VPN traditionnel, prend en charge l'accès par application pour le trafic TCP et UDP, utilise des connecteurs de réseau privé pour que rien ne soit exposé à Internet, et s'intègre à l'accès conditionnel.
  options:
    a:
      en: |
        Internet Access is the secure web gateway for internet and SaaS traffic, not access to private resources.
      fr: |
        Accès Internet est la passerelle web sécurisée pour le trafic Internet et SaaS, pas pour l'accès aux ressources privées.
    b:
      en: |
        Application proxy publishes web applications; it doesn't cover SMB file shares or RDP. Private Access builds on it and extends it to these protocols.
      fr: |
        Le proxy d'application publie des applications web ; il ne couvre ni les partages de fichiers SMB ni le RDP. Accès privé s'appuie sur lui et l'étend à ces protocoles.
    d:
      en: |
        Session control monitors and restricts activities inside browser sessions of cloud apps; it doesn't provide network access to private resources.
      fr: |
        Le contrôle de session surveille et restreint les activités dans les sessions de navigateur d'applications cloud ; il ne fournit pas d'accès réseau aux ressources privées.
references:
  - title: What is Global Secure Access?
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access
  - title: Learn about Microsoft Entra Private Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access
