id: sc100-2a-remediation-approach
objective: "2.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is writing the incident response procedures of its SOC, which uses Microsoft Defender XDR and Microsoft Sentinel. The procedures must follow Microsoft's incident response guidance.

    You need to recommend the remediation approach for each situation.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation rédige les procédures de réponse aux incidents de son SOC, qui utilise Microsoft Defender XDR et Microsoft Sentinel. Les procédures doivent suivre les recommandations de Microsoft en matière de réponse aux incidents.

    Vous devez recommander l'approche de correction pour chaque situation.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Malware detected early on one laptop, with no sign of persistence elsewhere: [[s1]]

      Adversary entrenched for months with several persistence mechanisms across the domain: [[s2]]

      First credentials to reset during recovery: [[s3]]
    fr: |
      Logiciel malveillant détecté tôt sur un ordinateur portable, sans signe de persistance ailleurs : [[s1]]

      Adversaire implanté depuis des mois avec plusieurs mécanismes de persistance dans le domaine : [[s2]]

      Premiers identifiants à réinitialiser pendant la reprise : [[s3]]
  slots:
    - id: s1
      options:
        - { id: clean, text: { en: "Clean as you go", fr: "Nettoyer au fur et à mesure" } }
        - { id: bigbang, text: { en: "A coordinated Big Bang remediation", fr: "Une correction coordonnée de type Big Bang" } }
        - { id: wait, text: { en: "Monitor the device without acting", fr: "Surveiller l'appareil sans agir" } }
    - id: s2
      options:
        - { id: piecemeal, text: { en: "Clean each system as soon as it is found", fr: "Nettoyer chaque système dès qu'il est trouvé" } }
        - { id: bigbang, text: { en: "A coordinated Big Bang remediation", fr: "Une correction coordonnée de type Big Bang" } }
        - { id: rebuild, text: { en: "Reset all user passwords at once, then investigate", fr: "Réinitialiser tous les mots de passe des utilisateurs en même temps, puis investiguer" } }
    - id: s3
      options:
        - { id: priv, text: { en: "Compromised privileged and service accounts", fr: "Les comptes privilégiés et de service compromis" } }
        - { id: all, text: { en: "All user accounts at the same time", fr: "Tous les comptes d'utilisateur en même temps" } }
        - { id: guests, text: { en: "Guest accounts of partners", fr: "Les comptes invités des partenaires" } }
answer:
  values: { s1: clean, s2: bigbang, s3: priv }
explanation:
  correct:
    en: |
      Microsoft's guidance is to clean as you go when an incident is detected early, and to prepare a coordinated Big Bang remediation when the adversary is already entrenched, because partial remediation can tip off the attacker. During recovery, compromised privileged and service accounts are reset first; the guidance warns against resetting all passwords at once.
    fr: |
      Les recommandations de Microsoft consistent à nettoyer au fur et à mesure quand un incident est détecté tôt, et à préparer une correction coordonnée de type Big Bang quand l'adversaire est déjà implanté, car une correction partielle peut alerter l'attaquant. Pendant la reprise, les comptes privilégiés et de service compromis sont réinitialisés en premier ; les recommandations déconseillent de réinitialiser tous les mots de passe en même temps.
  options:
    wait:
      en: |
        An early, isolated detection is the case where Microsoft recommends acting immediately.
      fr: |
        Une détection précoce et isolée est le cas où Microsoft recommande d'agir immédiatement.
    piecemeal:
      en: |
        Cleaning systems one by one against an entrenched adversary warns the attacker, who can use the other persistence mechanisms.
      fr: |
        Nettoyer les systèmes un par un face à un adversaire implanté avertit l'attaquant, qui peut utiliser les autres mécanismes de persistance.
    rebuild:
      en: |
        Resetting every password at once before investigating is the approach the guidance warns against.
      fr: |
        Réinitialiser tous les mots de passe en même temps avant d'investiguer est l'approche que les recommandations déconseillent.
references:
  - title: Incident response overview
    url: https://learn.microsoft.com/en-us/security/operations/incident-response-overview
