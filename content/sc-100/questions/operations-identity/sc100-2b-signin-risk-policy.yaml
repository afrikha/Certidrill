id: sc100-2b-signin-risk-policy
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has Microsoft Entra ID P2 licenses for all users and uses password-based sign-in with Microsoft Entra MFA. Users work from home, from customer sites and from the office.

    You need to recommend a policy that prompts users for MFA only when Microsoft Entra ID Protection estimates that a sign-in probably isn't performed by the account owner, at a medium or high level. Users must be able to remediate the risk themselves. The design must follow Microsoft's current recommendations.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose de licences Microsoft Entra ID P2 pour tous ses utilisateurs, qui se connectent par mot de passe avec la MFA Microsoft Entra. Les utilisateurs travaillent depuis chez eux, chez des clients et au bureau.

    Vous devez recommander une stratégie qui ne demande la MFA aux utilisateurs que lorsque Microsoft Entra ID Protection estime qu'une connexion n'est probablement pas effectuée par le propriétaire du compte, avec un niveau moyen ou élevé. Les utilisateurs doivent pouvoir corriger eux-mêmes le risque. La conception doit suivre les recommandations actuelles de Microsoft.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Conditional Access policy for medium and high sign-in risk that requires an MFA authentication strength and sign-in frequency Every time", fr: "Une stratégie d'accès conditionnel pour un risque de connexion moyen et élevé qui exige une force d'authentification MFA et la fréquence de connexion Every time" } }
    - { id: b, text: { en: "A sign-in risk policy configured in Microsoft Entra ID Protection that requires MFA for medium and high sign-in risk", fr: "Une stratégie de risque de connexion configurée dans Microsoft Entra ID Protection qui exige la MFA pour un risque de connexion moyen et élevé" } }
    - { id: c, text: { en: "A Conditional Access policy for high user risk that requires risk remediation and sign-in frequency Every time", fr: "Une stratégie d'accès conditionnel pour un risque utilisateur élevé qui exige la correction du risque et la fréquence de connexion Every time" } }
    - { id: d, text: { en: "A Conditional Access policy that requires an MFA authentication strength for all sign-ins from outside the office named location", fr: "Une stratégie d'accès conditionnel qui exige une force d'authentification MFA pour toutes les connexions hors de l'emplacement nommé du bureau" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Sign-in risk estimates that a given authentication isn't performed by the account owner. Microsoft recommends a Conditional Access policy for medium and high sign-in risk that requires the MFA authentication strength with sign-in frequency Every time; completing MFA remediates the sign-in risk.
    fr: |-
      Le risque de connexion estime qu'une authentification donnée n'est pas effectuée par le propriétaire du compte. Microsoft recommande une stratégie d'accès conditionnel pour un risque de connexion moyen et élevé qui exige la force d'authentification MFA avec la fréquence de connexion Every time ; effectuer la MFA corrige le risque de connexion.
  options:
    b: { en: "The legacy risk policies of ID Protection retire on October 1, 2026; risk policies are now created in Conditional Access.", fr: "Les stratégies de risque héritées d'ID Protection sont retirées le 1er octobre 2026 ; les stratégies de risque se créent désormais dans l'accès conditionnel." }
    c: { en: "User risk means the account is probably compromised; the requirement is about the risk of each sign-in.", fr: "Le risque utilisateur signifie que le compte est probablement compromis ; l'exigence porte sur le risque de chaque connexion." }
    d: { en: "A location condition prompts for every sign-in from home or customer sites, whatever the risk.", fr: "Une condition d'emplacement déclenche une invite pour chaque connexion depuis le domicile ou chez un client, quel que soit le risque." }
references:
  - title: Risk policies
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-configure-risk-policies
  - title: What are risk detections?
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
