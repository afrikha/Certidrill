id: sc100-2c-tenant-aws-admins
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft 365, Azure, and 25 AWS accounts in an AWS organization. AWS administrators sign in to the AWS console with IAM users that have passwords and long-lived access keys.

    You need to recommend a solution for the administration of the AWS accounts that meets the following requirements:

    - Administrative sign-ins require Microsoft Entra multifactor authentication and Conditional Access policies that require a compliant device.
    - Administrative permissions are granted just in time, after approval.
    - Access is removed automatically when an administrator leaves the company.

    The solution must minimize administrative effort. What should you recommend?
  fr: |
    Proseware, Inc. utilise Microsoft 365, Azure et 25 comptes AWS dans une organisation AWS. Les administrateurs AWS se connectent à la console AWS avec des utilisateurs IAM qui ont des mots de passe et des clés d'accès de longue durée.

    Vous devez recommander une solution pour l'administration des comptes AWS qui répond aux exigences suivantes :

    - Les connexions d'administration exigent l'authentification multifacteur Microsoft Entra et des stratégies d'accès conditionnel qui exigent un appareil conforme.
    - Les autorisations d'administration sont accordées juste-à-temps, après approbation.
    - L'accès est retiré automatiquement quand un administrateur quitte l'entreprise.

    La solution doit réduire au minimum l'effort d'administration. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Store the IAM user credentials in a privileged access management (PAM) vault that requires approval before each checkout", fr: "Stocker les informations d'identification des utilisateurs IAM dans un coffre de gestion des accès privilégiés (PAM) qui exige une approbation avant chaque extraction" } }
    - { id: b, text: { en: "Connect the AWS accounts to Microsoft Defender for Cloud with the Defender CSPM plan, so that CIEM right-sizes the permissions of the IAM users", fr: "Connecter les comptes AWS à Microsoft Defender pour le cloud avec le plan Defender CSPM, pour que la CIEM ajuste les autorisations des utilisateurs IAM" } }
    - { id: c, text: { en: "Connect AWS to Microsoft Defender for Cloud Apps with an app connector, and create session policies for the AWS console", fr: "Connecter AWS à Microsoft Defender for Cloud Apps avec un connecteur d'applications, et créer des stratégies de session pour la console AWS" } }
    - { id: d, text: { en: "Integrate AWS IAM Identity Center with Microsoft Entra ID for SSO and provisioning, and make membership of the groups mapped to AWS permission sets eligible through PIM for Groups", fr: "Intégrer AWS IAM Identity Center à Microsoft Entra ID pour l'authentification unique et le provisionnement, et rendre éligible par PIM for Groups l'appartenance aux groupes associés aux jeux d'autorisations AWS" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With AWS IAM Identity Center federated to Microsoft Entra ID, administrators sign in with their Entra accounts, so Entra MFA and Conditional Access apply, and automatic provisioning removes the access of disabled users. Permission sets define what a group can do in each AWS account. PIM for Groups makes membership of the privileged groups eligible, with approval and a limited duration, and activation provisions the membership to the application.
    fr: |
      Avec AWS IAM Identity Center fédéré à Microsoft Entra ID, les administrateurs se connectent avec leurs comptes Entra : la MFA Entra et l'accès conditionnel s'appliquent, et le provisionnement automatique retire l'accès des utilisateurs désactivés. Les jeux d'autorisations définissent ce qu'un groupe peut faire dans chaque compte AWS. PIM for Groups rend éligible l'appartenance aux groupes privilégiés, avec approbation et durée limitée, et l'activation provisionne l'appartenance dans l'application.
  options:
    a:
      en: "A vault adds approval to credential checkout, but sign-ins still don't use Microsoft Entra MFA and Conditional Access, and the IAM users must still be deprovisioned by hand."
      fr: "Un coffre ajoute une approbation à l'extraction des informations d'identification, mais les connexions n'utilisent toujours pas la MFA Microsoft Entra ni l'accès conditionnel, et les utilisateurs IAM doivent encore être supprimés à la main."
    b:
      en: "CIEM finds unused and excessive permissions; it doesn't change how administrators authenticate or grant access just in time."
      fr: "La CIEM trouve les autorisations inutilisées et excessives ; elle ne change ni la façon dont les administrateurs s'authentifient ni l'octroi d'accès juste-à-temps."
    c:
      en: "App connectors and session policies give visibility and session control, but the IAM users keep their own passwords and standing permissions."
      fr: "Les connecteurs d'applications et les stratégies de session apportent visibilité et contrôle de session, mais les utilisateurs IAM gardent leurs propres mots de passe et des autorisations permanentes."
references:
  - title: Configure AWS IAM Identity Center (successor to AWS Single Sign-On) for Single sign-on with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/saas-apps/aws-single-sign-on-tutorial
  - title: Privileged Identity Management (PIM) for Groups
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/concept-pim-for-groups
