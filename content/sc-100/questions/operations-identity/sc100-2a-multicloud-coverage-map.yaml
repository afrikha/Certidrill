id: sc100-2a-multicloud-coverage-map
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender XDR and Microsoft Sentinel in the Microsoft Defender portal. It also runs EC2 instances in AWS and has several Google Cloud projects.

    You are designing the monitoring of the multicloud environment. You need to recommend a solution for each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender XDR et Microsoft Sentinel dans le portail Microsoft Defender. Elle exécute aussi des instances EC2 dans AWS et dispose de plusieurs projets Google Cloud.

    Vous concevez la surveillance de l'environnement multicloud. Vous devez recommander une solution pour chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Threat detection and endpoint protection on the EC2 instances: [[s1]]

      Misconfiguration findings for the Google Cloud projects: [[s2]]

      Detections that correlate AWS API activity with Microsoft Entra sign-ins: [[s3]]
    fr: |
      Détection des menaces et protection des points de terminaison sur les instances EC2 : [[s1]]

      Constats de configuration incorrecte pour les projets Google Cloud : [[s2]]

      Détections qui corrèlent l'activité des API AWS avec les connexions Microsoft Entra : [[s3]]
  slots:
    - id: s1
      options:
        - { id: servers, text: { en: "Defender for Servers enabled on the AWS connector of Defender for Cloud", fr: "Defender for Servers activé sur le connecteur AWS de Defender pour le cloud" } }
        - { id: cspm, text: { en: "Foundational CSPM on the AWS connector of Defender for Cloud", fr: "La CSPM de base sur le connecteur AWS de Defender pour le cloud" } }
        - { id: mdca, text: { en: "The AWS app connector of Defender for Cloud Apps", fr: "Le connecteur d'application AWS de Defender for Cloud Apps" } }
    - id: s2
      options:
        - { id: gcp, text: { en: "The GCP connector of Defender for Cloud", fr: "Le connecteur GCP de Defender pour le cloud" } }
        - { id: arc, text: { en: "Azure Arc onboarding of the Google Cloud VMs", fr: "L'intégration à Azure Arc des machines virtuelles Google Cloud" } }
        - { id: policy, text: { en: "Azure Policy assigned at the root management group", fr: "Azure Policy attribuée au groupe d'administration racine" } }
    - id: s3
      options:
        - { id: mdcaws, text: { en: "Recommendations of the Defender for Cloud AWS connector", fr: "Les recommandations du connecteur AWS de Defender pour le cloud" } }
        - { id: sentinel, text: { en: "Analytics rules on CloudTrail logs ingested into Sentinel", fr: "Des règles d'analyse sur les journaux CloudTrail ingérés dans Sentinel" } }
        - { id: idp, text: { en: "Risk detections of Microsoft Entra ID Protection", fr: "Les détections de risque de Microsoft Entra ID Protection" } }
answer:
  values: { s1: servers, s2: gcp, s3: sentinel }
explanation:
  correct:
    en: |
      Workload protection of EC2 instances is a Defender plan, Defender for Servers, enabled on the AWS connector of Defender for Cloud. Posture management of Google Cloud projects comes from the GCP connector of Defender for Cloud. Correlating AWS API activity with Microsoft Entra sign-ins is a SIEM task: CloudTrail logs are ingested into Sentinel, where analytics rules can join them with the sign-in logs.
    fr: |
      La protection des charges de travail des instances EC2 est un plan Defender, Defender for Servers, activé sur le connecteur AWS de Defender pour le cloud. La gestion de la posture des projets Google Cloud vient du connecteur GCP de Defender pour le cloud. Corréler l'activité des API AWS avec les connexions Microsoft Entra est une tâche de SIEM : les journaux CloudTrail sont ingérés dans Sentinel, où des règles d'analyse peuvent les joindre aux journaux de connexion.
  options:
    cspm:
      en: |
        Foundational CSPM assesses configuration; it doesn't provide threat detection or endpoint protection on the instances.
      fr: |
        La CSPM de base évalue la configuration ; elle ne fournit ni détection des menaces ni protection des points de terminaison sur les instances.
    arc:
      en: |
        Azure Arc onboards servers, not the configuration of the other Google Cloud services in the projects.
      fr: |
        Azure Arc intègre des serveurs, pas la configuration des autres services Google Cloud des projets.
    mdcaws:
      en: |
        Defender for Cloud recommendations describe posture; they aren't detections correlated with sign-in events.
      fr: |
        Les recommandations de Defender pour le cloud décrivent la posture ; ce ne sont pas des détections corrélées avec les événements de connexion.
references:
  - title: Connect AWS accounts to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
