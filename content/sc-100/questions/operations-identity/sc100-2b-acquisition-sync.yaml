id: sc100-2b-acquisition-sync
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. acquires Wingtip Toys. Wingtip Toys has its own AD DS forest, with no network connectivity and no trust with the Proseware forest; the security team forbids creating either until an audit is complete.

    Wingtip users must get accounts in the Proseware Microsoft Entra tenant within two weeks. Synchronization must stay available if one server fails. Users must keep signing in to Microsoft 365 if the Wingtip datacenter is offline, and the solution must minimize the infrastructure to deploy.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. acquiert Wingtip Toys. Wingtip Toys possède sa propre forêt AD DS, sans connectivité réseau ni approbation avec la forêt Proseware ; l'équipe de sécurité interdit d'en créer avant la fin d'un audit.

    Les utilisateurs de Wingtip doivent obtenir des comptes dans le locataire Microsoft Entra de Proseware sous deux semaines. La synchronisation doit rester disponible si un serveur tombe en panne. Les utilisateurs doivent pouvoir continuer à se connecter à Microsoft 365 si le centre de données de Wingtip est hors ligne, et la solution doit réduire au minimum l'infrastructure à déployer.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Synchronize the Wingtip forest by using: [[sync]]

      Sign-in method for the Wingtip users: [[auth]]
    fr: |
      Synchroniser la forêt Wingtip à l'aide de : [[sync]]

      Méthode de connexion des utilisateurs de Wingtip : [[auth]]
  slots:
    - id: sync
      options:
        - { id: cloudsync, text: { en: "Microsoft Entra Cloud Sync agents installed on two Wingtip servers", fr: "Des agents Microsoft Entra Cloud Sync installés sur deux serveurs Wingtip" } }
        - { id: staging, text: { en: "The existing Connect Sync server, plus a Connect Sync server in staging mode", fr: "Le serveur Connect Sync existant, plus un serveur Connect Sync en mode intermédiaire" } }
        - { id: b2b, text: { en: "B2B collaboration invitations sent to the Wingtip users", fr: "Des invitations de collaboration B2B envoyées aux utilisateurs de Wingtip" } }
        - { id: trust, text: { en: "A forest trust, then the existing Connect Sync server", fr: "Une approbation de forêt, puis le serveur Connect Sync existant" } }
    - id: auth
      options:
        - { id: pta, text: { en: "Pass-through authentication", fr: "Authentification directe" } }
        - { id: phs, text: { en: "Password hash synchronization", fr: "Synchronisation du hachage de mot de passe" } }
        - { id: adfs, text: { en: "Federation with a new AD FS farm", fr: "Fédération avec une nouvelle batterie AD FS" } }
answer:
  values: { sync: cloudsync, auth: phs }
explanation:
  correct:
    en: |-
      Cloud Sync natively synchronizes disconnected forests to one tenant without forest consolidation, and several active agents provide automatic failover. Password hash synchronization authenticates in the cloud, so sign-in doesn't depend on the Wingtip datacenter, and it needs no extra servers.
    fr: |-
      Cloud Sync synchronise nativement des forêts déconnectées vers un seul locataire sans consolidation des forêts, et plusieurs agents actifs assurent un basculement automatique. La synchronisation du hachage de mot de passe authentifie dans le cloud : la connexion ne dépend pas du centre de données de Wingtip, et elle n'exige aucun serveur supplémentaire.
  options:
    staging: { en: "Connect Sync doesn't support disconnected forests: the existing server can't reach the Wingtip forest.", fr: "Connect Sync ne prend pas en charge les forêts déconnectées : le serveur existant ne peut pas joindre la forêt Wingtip." }
    trust: { en: "The security team forbids a trust and network connectivity until the audit is complete.", fr: "L'équipe de sécurité interdit l'approbation et la connectivité réseau avant la fin de l'audit." }
    b2b: { en: "Guests aren't accounts synchronized from the Wingtip forest, and they keep signing in with their home organization.", fr: "Des invités ne sont pas des comptes synchronisés depuis la forêt Wingtip, et ils continuent de se connecter auprès de leur organisation d'origine." }
    pta: { en: "Pass-through authentication depends on agents and domain controllers in the Wingtip datacenter.", fr: "L'authentification directe dépend d'agents et de contrôleurs de domaine du centre de données de Wingtip." }
references:
  - title: What is Microsoft Entra Cloud Sync?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/what-is-cloud-sync
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
