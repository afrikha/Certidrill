id: sc100-cs1b-audit-retention
objective: "2.1.2"
type: single
caseStudy: sc100-cs1b-lamna
difficulty: 2
status: draft
stem:
  en: |-
    You need to recommend a solution that meets the audit requirements. What should you recommend?
  fr: |-
    Vous devez recommander une solution qui respecte les exigences relatives à l'audit. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep the default Audit (Premium) policy, which retains the audit records of users who have an E5 license", fr: "Conserver la stratégie Audit (Premium) par défaut, qui conserve les enregistrements d'audit des utilisateurs qui ont une licence E5" } }
    - { id: b, text: { en: "Create an audit log retention policy of seven years for the clinicians, and rely on their E5 licenses", fr: "Créer une stratégie de rétention des journaux d'audit de sept ans pour les soignants, et s'appuyer sur leurs licences E5" } }
    - { id: c, text: { en: "Create a Microsoft Purview retention policy of seven years for the Exchange, SharePoint and OneDrive locations of the clinicians", fr: "Créer une stratégie de rétention Microsoft Purview de sept ans pour les emplacements Exchange, SharePoint et OneDrive des soignants" } }
    - { id: d, text: { en: "Create an audit log retention policy of seven years for the clinicians, and assign them 10-year audit log retention add-on licenses", fr: "Créer une stratégie de rétention des journaux d'audit de sept ans pour les soignants, et leur attribuer des licences de module complémentaire de rétention des journaux d'audit de 10 ans" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Audit log retention policies can keep records for up to 10 years, but the retention of three, five, seven or ten years requires that the user who performs the activity has a 10-year audit log retention add-on license in addition to the E5 license. Retention depends on the licenses of the user who generates the record, so the add-on is assigned to the clinicians.
    fr: |-
      Les stratégies de rétention des journaux d'audit peuvent conserver les enregistrements jusqu'à 10 ans, mais une rétention de trois, cinq, sept ou dix ans exige que l'utilisateur qui effectue l'activité dispose d'une licence de module complémentaire de rétention des journaux d'audit de 10 ans en plus de sa licence E5. La rétention dépend des licences de l'utilisateur qui génère l'enregistrement : le module complémentaire est donc attribué aux soignants.
  options:
    a:
      en: |-
        The default Audit (Premium) policy retains the Exchange, SharePoint, OneDrive and Microsoft Entra records of E5 users for one year, and other records for 180 days.
      fr: |-
        La stratégie Audit (Premium) par défaut conserve les enregistrements Exchange, SharePoint, OneDrive et Microsoft Entra des utilisateurs E5 pendant un an, et les autres enregistrements pendant 180 jours.
    b:
      en: |-
        Without the add-on license, a seven-year policy doesn't apply to the records of the clinicians, which keep the retention of the default policy for their license.
      fr: |-
        Sans la licence de module complémentaire, une stratégie de sept ans ne s'applique pas aux enregistrements des soignants, qui conservent la rétention de la stratégie par défaut de leur licence.
    c:
      en: |-
        A Purview retention policy retains the content of mailboxes and sites; it doesn't change how long audit records are kept.
      fr: |-
        Une stratégie de rétention Purview conserve le contenu des boîtes aux lettres et des sites ; elle ne modifie pas la durée de conservation des enregistrements d'audit.
references:
  - title: Manage audit log retention policies
    url: https://learn.microsoft.com/en-us/purview/audit-log-retention-policies
