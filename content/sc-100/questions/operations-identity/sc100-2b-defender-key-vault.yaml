id: sc100-2b-defender-key-vault
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. stores the secrets and certificates of 60 applications in Azure Key Vault. The security operations team receives the vault audit logs but has no detection for suspicious use of the vaults.

    You need to recommend a solution that alerts the team about unusual and potentially harmful attempts to access or exploit the vaults, such as access from a suspicious IP address or an unusual volume of operations. The solution must minimize the effort of writing detection rules.

    What should you recommend?
  fr: |
    Contoso, Ltd. stocke les secrets et certificats de 60 applications dans Azure Key Vault. L'équipe des opérations de sécurité reçoit les journaux d'audit des coffres, mais ne dispose d'aucune détection d'utilisation suspecte des coffres.

    Vous devez recommander une solution qui alerte l'équipe sur les tentatives inhabituelles et potentiellement dangereuses d'accès aux coffres ou d'exploitation de ceux-ci, comme un accès depuis une adresse IP suspecte ou un volume inhabituel d'opérations. La solution doit réduire au minimum l'effort d'écriture de règles de détection.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Assign Azure Policy definitions that audit the vault configuration", fr: "Attribuer des définitions Azure Policy qui auditent la configuration des coffres" } }
    - { id: b, text: { en: "Enable purge protection and soft delete on every vault", fr: "Activer la protection contre le vidage et la suppression réversible sur chaque coffre" } }
    - { id: c, text: { en: "Enable the Microsoft Defender for Key Vault plan", fr: "Activer le plan Microsoft Defender for Key Vault" } }
    - { id: d, text: { en: "Enable the Key Vault firewall and allow only selected networks", fr: "Activer le pare-feu Key Vault et n'autoriser que les réseaux sélectionnés" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Microsoft Defender for Key Vault, a Defender for Cloud plan, detects unusual and potentially harmful attempts to access or exploit vaults and raises security alerts, without custom detection rules. Microsoft recommends enabling it together with audit logging and alerts.
    fr: |-
      Microsoft Defender for Key Vault, un plan de Defender pour le cloud, détecte les tentatives inhabituelles et potentiellement dangereuses d'accès aux coffres ou d'exploitation de ceux-ci et génère des alertes de sécurité, sans règles de détection personnalisées. Microsoft recommande de l'activer avec la journalisation d'audit et les alertes.
  options:
    a: { en: "Azure Policy audits and enforces configuration; it doesn't detect suspicious access at run time.", fr: "Azure Policy audite et impose la configuration ; il ne détecte pas les accès suspects à l'exécution." }
    b: { en: "Soft delete and purge protection allow recovery of deleted objects; they don't detect attacks.", fr: "La suppression réversible et la protection contre le vidage permettent de récupérer des objets supprimés ; elles ne détectent pas les attaques." }
    d: { en: "The firewall reduces exposure but generates no alerts on suspicious behavior from allowed networks.", fr: "Le pare-feu réduit l'exposition mais ne génère aucune alerte sur un comportement suspect depuis les réseaux autorisés." }
references:
  - title: Secure your Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/best-practices
