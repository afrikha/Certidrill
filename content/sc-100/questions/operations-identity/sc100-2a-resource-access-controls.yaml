id: sc100-2a-resource-access-controls
objective: "2.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is designing Zero Trust access to its SaaS, PaaS and IaaS resources in Azure and on the internet. For each requirement, you must recommend the control that meets it.

    Which control should you recommend for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation conçoit l'accès Confiance Zéro à ses ressources SaaS, PaaS et IaaS dans Azure et sur Internet. Pour chaque exigence, vous devez recommander le contrôle qui y répond.

    Quel contrôle devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ia, text: { en: "Microsoft Entra Internet Access", fr: "Accès Internet Microsoft Entra" } }
    - { id: mi, text: { en: "Managed identity", fr: "Identité managée" } }
    - { id: pe, text: { en: "Private endpoint with public network access disabled", fr: "Point de terminaison privé avec l'accès réseau public désactivé" } }
    - { id: bastion, text: "Azure Bastion" }
    - { id: appctl, text: { en: "Conditional Access app control", fr: "Contrôle d'application par accès conditionnel" } }
  targets:
    - id: t1
      text: { en: "Block employees from gambling websites based on their identity", fr: "Bloquer l'accès des employés aux sites de jeux d'argent en fonction de leur identité" }
    - id: t2
      text: { en: "Let an App Service app read an Azure SQL database without stored credentials", fr: "Permettre à une application App Service de lire une base de données Azure SQL sans informations d'identification stockées" }
    - id: t3
      text: { en: "Make a storage account reachable only from a virtual network", fr: "Rendre un compte de stockage joignable uniquement depuis un réseau virtuel" }
    - id: t4
      text: { en: "Let admins RDP to Azure VMs from a browser, without public IP addresses or client software", fr: "Permettre aux administrateurs d'utiliser le RDP vers des machines virtuelles Azure depuis un navigateur, sans adresses IP publiques ni logiciel client" }
answer:
  mapping: { t1: ia, t2: mi, t3: pe, t4: bastion }
explanation:
  correct:
    en: |
      Internet Access is an identity-centric secure web gateway with web content filtering by category. A managed identity lets an app get Microsoft Entra tokens without handling secrets, passwords or keys. A private endpoint with public network access disabled limits a PaaS service to private network paths. Azure Bastion provides RDP and SSH to virtual machines from the Azure portal over TLS, without public IP addresses on the VMs. Conditional Access app control controls sessions in cloud apps, not these network or credential requirements.
    fr: |
      Accès Internet est une passerelle web sécurisée centrée sur l'identité, avec un filtrage du contenu web par catégorie. Une identité managée permet à une application d'obtenir des jetons Microsoft Entra sans manipuler de secrets, de mots de passe ni de clés. Un point de terminaison privé avec l'accès réseau public désactivé limite un service PaaS aux chemins réseau privés. Azure Bastion fournit le RDP et le SSH vers les machines virtuelles depuis le portail Azure via TLS, sans adresses IP publiques sur les machines virtuelles. Le contrôle d'application par accès conditionnel contrôle les sessions dans les applications cloud, pas ces exigences de réseau ou d'informations d'identification.
references:
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
  - title: Learn about Microsoft Entra Internet Access for all apps
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-internet-access
