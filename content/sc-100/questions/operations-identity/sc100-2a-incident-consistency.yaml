id: sc100-2a-incident-consistency
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating the incident management workflow of Fabrikam, Inc., which uses Microsoft Sentinel in the Microsoft Defender portal. An audit found that analysts handle phishing incidents differently, skip mandatory steps such as revoking sessions, and close most incidents as Undetermined without a comment.

    The SOC manager wants every phishing incident to follow the same steps, and wants to use the outcome of closed incidents to tune the analytics rules. The solution must minimize administrative effort.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez le workflow de gestion des incidents de Fabrikam, Inc., qui utilise Microsoft Sentinel dans le portail Microsoft Defender. Un audit a constaté que les analystes traitent les incidents d'hameçonnage de façon différente, sautent des étapes obligatoires comme la révocation des sessions, et ferment la plupart des incidents comme Undetermined sans commentaire.

    Le responsable du SOC veut que chaque incident d'hameçonnage suive les mêmes étapes, et veut utiliser le résultat des incidents fermés pour ajuster les règles d'analyse. La solution doit réduire au minimum l'effort d'administration.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add incident tasks to phishing incidents by using an automation rule", fr: "Ajouter des tâches d'incident aux incidents d'hameçonnage au moyen d'une règle d'automatisation" } }
    - { id: b, text: { en: "Set closing standards and review the classifications of closed incidents", fr: "Fixer des règles de fermeture et examiner les classifications des incidents fermés" } }
    - { id: c, text: { en: "Assign the Microsoft Sentinel Contributor role to all the analysts", fr: "Attribuer le rôle Microsoft Sentinel Contributor à tous les analystes" } }
    - { id: d, text: { en: "Move the phishing analytics rules to a dedicated workspace", fr: "Déplacer les règles d'analyse d'hameçonnage vers un espace de travail dédié" } }
    - { id: e, text: { en: "Disable alert grouping in the phishing analytics rules", fr: "Désactiver le regroupement d'alertes dans les règles d'analyse d'hameçonnage" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Incident tasks are a checklist of the standard steps for each analyst, and an automation rule can add them automatically to the incidents of the phishing rules. A closing classification with a reason and a comment records whether each incident was a true or false positive, which is the input used to tune the analytics rules.
    fr: |
      Les tâches d'incident constituent une liste de contrôle des étapes standard pour chaque analyste, et une règle d'automatisation peut les ajouter automatiquement aux incidents des règles d'hameçonnage. Une classification de fermeture avec une raison et un commentaire indique si chaque incident était un vrai ou un faux positif, ce qui est l'entrée utilisée pour ajuster les règles d'analyse.
  options:
    c:
      en: |
        Contributor grants rule editing to every analyst, which breaks least privilege and doesn't standardize the handling steps.
      fr: |
        Contributor accorde la modification des règles à chaque analyste, ce qui enfreint le moindre privilège et ne standardise pas les étapes de traitement.
    d:
      en: |
        A separate workspace adds administration and splits correlation; it doesn't make analysts follow the same steps.
      fr: |
        Un espace de travail séparé ajoute de l'administration et fragmente la corrélation ; il n'oblige pas les analystes à suivre les mêmes étapes.
    e:
      en: |
        In the Defender portal, grouping is controlled by the Defender XDR correlation engine, and disabling it would only create more incidents to handle.
      fr: |
        Dans le portail Defender, le regroupement est contrôlé par le moteur de corrélation de Defender XDR, et le désactiver ne ferait que créer davantage d'incidents à traiter.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
