id: sc100-2b-b2b-direct-connect
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. and Contoso, Ltd. both use Microsoft Entra ID and Microsoft Teams. The two companies start a joint engineering program.

    Engineers from both companies must chat, call and share files in Teams shared channels without switching organizations in Teams. Fabrikam's security policy forbids creating guest user objects for Contoso engineers in the Fabrikam directory.

    What should you recommend?
  fr: |
    Fabrikam, Inc. et Contoso, Ltd. utilisent toutes deux Microsoft Entra ID et Microsoft Teams. Les deux entreprises lancent un programme d'ingénierie commun.

    Les ingénieurs des deux entreprises doivent converser, s'appeler et partager des fichiers dans des canaux partagés Teams sans changer d'organisation dans Teams. La politique de sécurité de Fabrikam interdit de créer des objets utilisateur invités pour les ingénieurs de Contoso dans l'annuaire de Fabrikam.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "B2B direct connect, enabled by both organizations in their cross-tenant access settings", fr: "La connexion directe B2B, activée par les deux organisations dans leurs paramètres d'accès interlocataire" } }
    - { id: b, text: { en: "B2B collaboration, with invitations sent to the Contoso engineers by the channel owners", fr: "La collaboration B2B, avec des invitations envoyées aux ingénieurs de Contoso par les propriétaires de canaux" } }
    - { id: c, text: { en: "Cross-tenant synchronization of the Contoso engineers into the Fabrikam tenant", fr: "La synchronisation interlocataire des ingénieurs de Contoso vers le locataire Fabrikam" } }
    - { id: d, text: { en: "An external tenant in which the Contoso engineers sign up with self-service", fr: "Un locataire externe dans lequel les ingénieurs de Contoso s'inscrivent en libre-service" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      B2B direct connect creates a mutual trust between two Microsoft Entra organizations and is mainly used for Teams Connect shared channels. Users authenticate in their home organization, get a token from the resource organization and are not added as guests to the directory. Both organizations must enable it.
    fr: |-
      La connexion directe B2B crée une approbation mutuelle entre deux organisations Microsoft Entra et sert principalement aux canaux partagés Teams Connect. Les utilisateurs s'authentifient dans leur organisation d'origine, obtiennent un jeton de l'organisation de ressources et ne sont pas ajoutés comme invités dans l'annuaire. Les deux organisations doivent l'activer.
  options:
    b: { en: "B2B collaboration creates a guest user object in the Fabrikam directory, which the policy forbids.", fr: "La collaboration B2B crée un objet utilisateur invité dans l'annuaire de Fabrikam, ce que la politique interdit." }
    c: { en: "Cross-tenant synchronization creates user objects in the target tenant and is designed for the tenants of one multitenant organization.", fr: "La synchronisation interlocataire crée des objets utilisateur dans le locataire cible et est conçue pour les locataires d'une même organisation multilocataire." }
    d: { en: "An external tenant serves consumer and business customer apps; it doesn't provide Teams shared channels.", fr: "Un locataire externe sert les applications destinées aux consommateurs et aux clients professionnels ; il ne fournit pas de canaux partagés Teams." }
references:
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
