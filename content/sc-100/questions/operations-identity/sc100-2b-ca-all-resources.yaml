id: sc100-2b-ca-all-resources
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. is validating its Conditional Access design against its Zero Trust strategy. The policy that requires MFA for all users targets a list of 25 cloud apps. Contoso adds new SaaS apps to Microsoft Entra ID every month, and the review finds three recently added apps that no policy covers.

    You need to recommend a change that closes the gap for current and future apps. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Contoso, Ltd. valide sa conception de l'accès conditionnel par rapport à sa stratégie Confiance Zéro. La stratégie qui exige la MFA pour tous les utilisateurs cible une liste de 25 applications cloud. Contoso ajoute chaque mois de nouvelles applications SaaS à Microsoft Entra ID, et la revue trouve trois applications ajoutées récemment qu'aucune stratégie ne couvre.

    Vous devez recommander une modification qui comble la lacune pour les applications actuelles et futures. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Add each new app to the policy as a mandatory step of the app onboarding process", fr: "Ajouter chaque nouvelle application à la stratégie comme étape obligatoire du processus d'intégration des applications" } }
    - { id: b, text: { en: "Change the target resources of the policy to All resources", fr: "Remplacer les ressources cibles de la stratégie par All resources" } }
    - { id: c, text: { en: "Create one policy per app so that each app owner manages the policy of the app", fr: "Créer une stratégie par application pour que chaque propriétaire d'application gère la stratégie de son application" } }
    - { id: d, text: { en: "Target the apps that have a custom security attribute by using a filter for applications", fr: "Cibler les applications qui ont un attribut de sécurité personnalisé à l'aide d'un filtre d'applications" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Microsoft recommends that at least one policy include All resources, so that newly onboarded apps are protected without updating the policy. Targeting a list of apps leaves a gap each time an app is added and someone forgets to update the list.
    fr: |-
      Microsoft recommande qu'au moins une stratégie inclue All resources, pour que les applications nouvellement intégrées soient protégées sans mettre à jour la stratégie. Cibler une liste d'applications laisse une lacune chaque fois qu'une application est ajoutée et que quelqu'un oublie de mettre la liste à jour.
  options:
    a: { en: "A manual onboarding step adds effort and fails as soon as the step is skipped.", fr: "Une étape d'intégration manuelle ajoute de l'effort et échoue dès que l'étape est oubliée." }
    c: { en: "One policy per app multiplies policies toward the tenant limit and still leaves new apps uncovered until a policy is created.", fr: "Une stratégie par application multiplie les stratégies jusqu'à la limite du locataire et laisse les nouvelles applications non couvertes tant qu'aucune stratégie n'est créée." }
    d: { en: "A filter still depends on each new app being tagged with the attribute; an untagged app stays uncovered.", fr: "Un filtre dépend toujours de l'étiquetage de chaque nouvelle application avec l'attribut ; une application non étiquetée reste non couverte." }
references:
  - title: Plan a Conditional Access deployment
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/plan-conditional-access
