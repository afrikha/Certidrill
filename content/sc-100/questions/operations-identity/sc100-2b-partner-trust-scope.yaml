id: sc100-2b-partner-trust-scope
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has a Conditional Access policy that requires MFA and a compliant device for all users, including guests, to access its project portal.

    Adatum works with two partners. Litware, Inc. uses Microsoft Entra ID, enforces MFA and manages its devices with Intune; Litware users invited as guests must register MFA again in Adatum and can't satisfy the device requirement. Freelancers from other organizations sign in with personal accounts and must keep performing MFA in Adatum. Adatum must not accept MFA or device claims from any other organization, and the Conditional Access policy must not be weakened.

    What should you recommend?
  fr: |
    Adatum Corporation dispose d'une stratégie d'accès conditionnel qui exige la MFA et un appareil conforme pour tous les utilisateurs, invités compris, pour accéder à son portail de projets.

    Adatum travaille avec deux partenaires. Litware, Inc. utilise Microsoft Entra ID, impose la MFA et gère ses appareils avec Intune ; les utilisateurs de Litware invités doivent réinscrire leur MFA chez Adatum et ne peuvent pas satisfaire l'exigence d'appareil. Des indépendants d'autres organisations se connectent avec des comptes personnels et doivent continuer à effectuer la MFA chez Adatum. Adatum ne doit accepter les revendications MFA ou d'appareil d'aucune autre organisation, et la stratégie d'accès conditionnel ne doit pas être affaiblie.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "In the default inbound cross-tenant access settings, trust MFA and compliant device claims", fr: "Dans les paramètres d'accès interlocataire entrants par défaut, approuver les revendications MFA et d'appareil conforme" } }
    - { id: b, text: { en: "Add Litware to the cross-tenant access settings and trust its MFA and compliant device claims", fr: "Ajouter Litware aux paramètres d'accès interlocataire et approuver ses revendications MFA et d'appareil conforme" } }
    - { id: c, text: { en: "Exclude the Litware guests from the policy and require MFA for them in a separate policy", fr: "Exclure les invités de Litware de la stratégie et exiger la MFA pour eux dans une stratégie distincte" } }
    - { id: d, text: { en: "Add Litware to the cross-tenant access settings and allow inbound B2B direct connect", fr: "Ajouter Litware aux paramètres d'accès interlocataire et autoriser la connexion directe B2B entrante" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Organizational settings in the cross-tenant access settings apply to one partner organization. Trusting Litware's MFA and compliant device claims lets Litware users satisfy Adatum's policy with the MFA and the Intune compliance of their home tenant, so the policy stays unchanged. The freelancers aren't affected and keep performing MFA in Adatum.
    fr: |-
      Les paramètres d'organisation des paramètres d'accès interlocataire s'appliquent à une seule organisation partenaire. Approuver les revendications MFA et d'appareil conforme de Litware permet à ses utilisateurs de satisfaire la stratégie d'Adatum avec la MFA et la conformité Intune de leur locataire d'origine ; la stratégie reste inchangée. Les indépendants ne sont pas concernés et continuent d'effectuer la MFA chez Adatum.
  options:
    a: { en: "Default settings apply to every Microsoft Entra organization, not only to Litware: Adatum would accept the claims of every other organization.", fr: "Les paramètres par défaut s'appliquent à toutes les organisations Microsoft Entra, pas seulement à Litware : Adatum accepterait les revendications de toutes les autres organisations." }
    c: { en: "Excluding the Litware guests removes the compliant device requirement for them, which weakens the policy.", fr: "Exclure les invités de Litware supprime pour eux l'exigence d'appareil conforme, ce qui affaiblit la stratégie." }
    d: { en: "B2B direct connect serves Teams shared channels; Litware guests accessing the portal still go through B2B collaboration.", fr: "La connexion directe B2B sert aux canaux partagés Teams ; les invités de Litware qui accèdent au portail passent toujours par la collaboration B2B." }
references:
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
