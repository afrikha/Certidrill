id: sc100-2b-protected-users-scope
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an AD DS forest at the Windows Server 2016 domain functional level. All hosts support AES for Kerberos. Tier 0 administrators use dedicated administrator accounts, separate from their standard user accounts.

    You need to specify a requirement for the tier 0 administrator accounts: their credentials must not be cached in plaintext or as NTLM hashes on the hosts they sign in to, they must not use NTLM, RC4 or DES, they must not be delegated, and their Kerberos tickets must expire after four hours.

    What should you include in the requirements?
  fr: |
    Contoso, Ltd. dispose d'une forêt AD DS au niveau fonctionnel de domaine Windows Server 2016. Tous les hôtes prennent en charge AES pour Kerberos. Les administrateurs de tier 0 utilisent des comptes d'administration dédiés, distincts de leurs comptes d'utilisateur standard.

    Vous devez spécifier une exigence pour les comptes d'administration de tier 0 : leurs informations d'identification ne doivent pas être mises en cache en texte clair ni sous forme de hachage NTLM sur les hôtes où ils se connectent, ils ne doivent pas utiliser NTLM, RC4 ni DES, ils ne doivent pas être délégués, et leurs tickets Kerberos doivent expirer au bout de quatre heures.

    Que devez-vous inclure dans les exigences ?
body:
  options:
    - { id: a, text: { en: "Add the service accounts of the tier 0 applications to the Protected Users group", fr: "Ajouter les comptes de service des applications de tier 0 au groupe Protected Users" } }
    - { id: b, text: { en: "Enable the setting that marks the administrator accounts as sensitive and not delegable", fr: "Activer le paramètre « Le compte est sensible et ne peut pas être délégué » sur les comptes d'administration" } }
    - { id: c, text: { en: "Add the dedicated administrator accounts to the Protected Users group after testing", fr: "Ajouter les comptes d'administration dédiés au groupe Protected Users après des tests" } }
    - { id: d, text: { en: "Require smart card sign-in for interactive logon on the administrator accounts", fr: "Exiger la connexion par carte à puce pour l'ouverture de session interactive des comptes d'administration" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Members of Protected Users get nonconfigurable protections. Hosts don't cache plaintext credentials or NTLM one-way functions, domain controllers refuse NTLM, DES and RC4 and any delegation, and the TGT lifetime is limited to four hours. Microsoft recommends testing before adding privileged accounts, because the restrictions can't be overridden.
    fr: |-
      Les membres de Protected Users reçoivent des protections non configurables. Les hôtes ne mettent en cache ni les informations d'identification en texte clair ni les fonctions unidirectionnelles NTLM, les contrôleurs de domaine refusent NTLM, DES et RC4 ainsi que toute délégation, et la durée de vie du TGT est limitée à quatre heures. Microsoft recommande de tester avant d'ajouter des comptes privilégiés, car ces restrictions ne peuvent pas être levées.
  options:
    a: { en: "Service and computer accounts must never be added to Protected Users: their credentials are always present on the host, so membership gives no local protection.", fr: "Les comptes de service et d'ordinateur ne doivent jamais être ajoutés à Protected Users : leurs informations d'identification sont toujours présentes sur l'hôte, l'appartenance n'apporte donc aucune protection locale." }
    b: { en: "This setting only prevents delegation; it doesn't stop credential caching, NTLM or RC4, and doesn't shorten ticket lifetime.", fr: "Ce paramètre empêche seulement la délégation ; il n'empêche ni la mise en cache des informations d'identification, ni NTLM, ni RC4, et ne raccourcit pas la durée de vie des tickets." }
    d: { en: "Smart card sign-in strengthens the initial authentication but doesn't by itself prevent caching or NTLM use.", fr: "La connexion par carte à puce renforce l'authentification initiale mais n'empêche pas à elle seule la mise en cache ni l'utilisation de NTLM." }
references:
  - title: Protected Users security group
    url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/protected-users-security-group
