id: sc100-cs1a-protected-actions
objective: "2.2.5"
type: dropdown
caseStudy: sc100-cs1a-humongous
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that meets the privileged access requirement for changes to Conditional Access and to the cross-tenant access settings.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution qui respecte l'exigence relative à l'accès privilégié pour les modifications de l'accès conditionnel et des paramètres d'accès interlocataire.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Assign the following to the Conditional Access and cross-tenant access permissions: [[assign]]

      In the Conditional Access policy that targets it, use the grant control: [[grant]]
    fr: |
      Attribuer l'élément suivant aux autorisations d'accès conditionnel et d'accès interlocataire : [[assign]]

      Dans la stratégie d'accès conditionnel qui le cible, utiliser le contrôle d'octroi : [[grant]]
  slots:
    - id: assign
      options:
        - { id: context, text: { en: "An authentication context", fr: "Un contexte d'authentification" } }
        - { id: location, text: { en: "A named location", fr: "Un emplacement nommé" } }
        - { id: pim, text: { en: "A PIM activation setting that requires an authentication context", fr: "Un paramètre d'activation PIM qui exige un contexte d'authentification" } }
        - { id: role, text: { en: "A custom role that contains only these permissions", fr: "Un rôle personnalisé qui ne contient que ces autorisations" } }
    - id: grant
      options:
        - { id: mfa, text: Require multifactor authentication }
        - { id: phish, text: "Require authentication strength: Phishing-resistant MFA" }
        - { id: compliant, text: Require device to be marked as compliant }
        - { id: terms, text: Require terms of use }
answer:
  values: { assign: context, grant: phish }
explanation:
  correct:
    en: |-
      Protected actions assign a Conditional Access authentication context to high-impact permissions, such as creating, updating or deleting Conditional Access policies and managing partners in the cross-tenant access settings. The user is prompted only when attempting one of these actions, whatever role grants the permission. The built-in Phishing-resistant MFA authentication strength accepts only phishing-resistant methods.
    fr: |-
      Les actions protégées attribuent un contexte d'authentification d'accès conditionnel à des autorisations à fort impact, comme la création, la mise à jour ou la suppression de stratégies d'accès conditionnel et la gestion des partenaires dans les paramètres d'accès interlocataire. L'utilisateur n'est invité que lorsqu'il tente l'une de ces actions, quel que soit le rôle qui lui accorde l'autorisation. La force d'authentification intégrée Phishing-resistant MFA n'accepte que des méthodes résistantes au hameçonnage.
  options:
    location:
      en: |-
        A named location is a condition of a policy; it can't be assigned to directory permissions.
      fr: |-
        Un emplacement nommé est une condition de stratégie ; il ne peut pas être attribué à des autorisations d'annuaire.
    pim:
      en: |-
        A PIM setting prompts at role activation, not when the action is attempted, and it doesn't cover administrators who receive the permission another way.
      fr: |-
        Un paramètre PIM déclenche l'invite à l'activation du rôle, et non au moment où l'action est tentée, et il ne couvre pas les administrateurs qui reçoivent l'autorisation autrement.
    role:
      en: |-
        A custom role limits who has the permissions; it doesn't require reauthentication when they are used.
      fr: |-
        Un rôle personnalisé limite qui détient les autorisations ; il n'exige pas de réauthentification quand elles sont utilisées.
    mfa:
      en: |-
        Require multifactor authentication accepts methods that aren't phishing resistant, such as push notifications.
      fr: |-
        Require multifactor authentication accepte des méthodes qui ne résistent pas au hameçonnage, comme les notifications Push.
references:
  - title: What are protected actions in Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/protected-actions-overview
