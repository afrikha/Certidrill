id: sc100-2c-paw-controls
objective: "2.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is designing privileged access workstations (PAWs) for its Global Administrators and Azure platform administrators. The PAWs are new devices with TPM 2.0 that will be managed by Microsoft Intune.

    The design must follow the Microsoft guidance for the privileged device profile.

    Which two controls should you include in the design?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. conçoit des stations de travail à accès privilégié (PAW) pour ses Global Administrators et ses administrateurs de la plateforme Azure. Les PAW sont des appareils neufs avec TPM 2.0 qui seront gérés par Microsoft Intune.

    La conception doit suivre les recommandations de Microsoft pour le profil d'appareil privilégié.

    Quels sont les deux contrôles à inclure dans la conception ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deny web access by default and allow only the destinations that administration requires", fr: "Refuser par défaut l'accès web et n'autoriser que les destinations nécessaires à l'administration" } }
    - { id: b, text: { en: "Install Outlook so that administrators receive PIM approval requests on the PAW", fr: "Installer Outlook pour que les administrateurs reçoivent les demandes d'approbation PIM sur la PAW" } }
    - { id: c, text: { en: "Grant local administrator rights so that administrators can install tools when needed", fr: "Accorder les droits d'administrateur local pour que les administrateurs installent des outils au besoin" } }
    - { id: d, text: { en: "Enforce application control so that only approved applications run", fr: "Imposer le contrôle d'application pour que seules les applications approuvées s'exécutent" } }
    - { id: e, text: { en: "Let administrators join their personal devices as PAWs through Windows Autopilot", fr: "Permettre aux administrateurs de joindre leurs appareils personnels comme PAW par Windows Autopilot" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      In the privileged profile, URL access is denied by default and application control is enforced, so a phishing link or an unapproved binary can't run on the device used for administration. The profile also removes local administrator rights, installs apps only through Intune, and blocks email and general browsing.
    fr: |
      Dans le profil privilégié, l'accès aux URL est refusé par défaut et le contrôle d'application est imposé : un lien d'hameçonnage ou un binaire non approuvé ne peut pas s'exécuter sur l'appareil utilisé pour l'administration. Le profil retire aussi les droits d'administrateur local, n'installe les applications que par Intune et bloque la messagerie et la navigation générale.
  options:
    b:
      en: "Email is blocked on PAWs because it's a main phishing vector; administrators read email on a separate productivity device."
      fr: "La messagerie est bloquée sur les PAW car c'est un vecteur majeur d'hameçonnage ; les administrateurs lisent leurs e-mails sur un appareil de productivité distinct."
    c:
      en: "The privileged profile removes local administrator rights, and applications are installed only by Intune."
      fr: "Le profil privilégié retire les droits d'administrateur local, et les applications ne sont installées que par Intune."
    e:
      en: "Personal device join is excluded from the privileged profile, which denies BYOD enrollment."
      fr: "La jonction d'appareils personnels est exclue du profil privilégié, qui refuse l'inscription BYOD."
references:
  - title: Why are privileged access devices important
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-devices
