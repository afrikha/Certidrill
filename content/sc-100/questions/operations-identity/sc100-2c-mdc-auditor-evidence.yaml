id: sc100-2c-mdc-auditor-evidence
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has Azure subscriptions, AWS accounts, and GCP projects connected to Microsoft Defender for Cloud, with the Defender CSPM plan enabled.

    Each month, the security team must give the external auditor the status of each ISO/IEC 27001:2022 control for the three clouds, with the resources that pass or fail the assessments behind each control and the remediation steps for the failing ones.

    What should the team use?
  fr: |
    Contoso, Ltd. dispose d'abonnements Azure, de comptes AWS et de projets GCP connectés à Microsoft Defender pour le cloud, avec le plan Defender CSPM activé.

    Chaque mois, l'équipe de sécurité doit fournir à l'auditeur externe l'état de chaque contrôle ISO/IEC 27001:2022 pour les trois clouds, avec les ressources qui réussissent ou échouent aux évaluations derrière chaque contrôle et les étapes de correction de celles qui échouent.

    Que doit utiliser l'équipe ?
body:
  options:
    - { id: a, text: { en: "The Defender for Cloud secure score of the three clouds", fr: "Le degré de sécurisation de Defender pour le cloud des trois clouds" } }
    - { id: b, text: { en: "The Microsoft Secure Score of the tenant", fr: "Le Niveau de sécurité Microsoft (Microsoft Secure Score) du locataire" } }
    - { id: c, text: { en: "The Azure Policy compliance view of the ISO 27001 initiative assigned to the subscriptions", fr: "La vue de conformité Azure Policy de l'initiative ISO 27001 attribuée aux abonnements" } }
    - { id: d, text: { en: "The regulatory compliance dashboard of Defender for Cloud with the ISO/IEC 27001:2022 standard assigned", fr: "Le tableau de bord de conformité réglementaire de Defender pour le cloud avec la norme ISO/IEC 27001:2022 attribuée" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      ISO/IEC 27001:2022 is available as a standard for Azure, AWS and GCP in Defender for Cloud. Once it's assigned, the regulatory compliance dashboard shows each control, the compliant and non-compliant resources of the assessments behind it, and remediation steps, and it offers audit report downloads.
    fr: |
      ISO/IEC 27001:2022 est disponible comme norme pour Azure, AWS et GCP dans Defender pour le cloud. Une fois la norme attribuée, le tableau de bord de conformité réglementaire affiche chaque contrôle, les ressources conformes et non conformes des évaluations qui le composent et les étapes de correction, et propose le téléchargement de rapports d'audit.
  options:
    a:
      en: "The Defender for Cloud secure score is built from the recommendations of the Microsoft cloud security benchmark; it isn't organized by ISO 27001 controls."
      fr: "Le degré de sécurisation de Defender pour le cloud est calculé à partir des recommandations du benchmark de sécurité cloud Microsoft ; il n'est pas organisé selon les contrôles ISO 27001."
    b:
      en: "Microsoft Secure Score measures the posture of identity, Microsoft 365 and related workloads; it doesn't map cloud resources to ISO 27001 controls."
      fr: "Le Niveau de sécurité Microsoft mesure la posture des identités, de Microsoft 365 et des charges de travail associées ; il n'associe pas les ressources cloud aux contrôles ISO 27001."
    c:
      en: "An Azure Policy initiative evaluates Azure resources only, so the AWS and GCP resources would be missing."
      fr: "Une initiative Azure Policy n'évalue que les ressources Azure : les ressources AWS et GCP manqueraient."
references:
  - title: Regulatory compliance in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
