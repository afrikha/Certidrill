id: sc100-2c-ciem-tools
objective: "2.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has Azure subscriptions and AWS accounts connected to Microsoft Defender for Cloud with the Defender CSPM plan enabled. You are designing how the security team will use cloud infrastructure entitlement management (CIEM).

    Which Defender for Cloud capability should the team use for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'abonnements Azure et de comptes AWS connectés à Microsoft Defender pour le cloud avec le plan Defender CSPM activé. Vous concevez la façon dont l'équipe de sécurité utilisera la gestion des droits d'utilisation de l'infrastructure cloud (CIEM).

    Quelle fonctionnalité de Defender pour le cloud l'équipe doit-elle utiliser pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Query every identity that has access to internet-exposed storage that contains sensitive data: [[query]]

      Give leadership a customizable visual report of identity insights, unhealthy recommendations and attack paths: [[report]]

      Remove the permissions that overprovisioned identities don't use: [[fix]]
    fr: |
      Interroger toutes les identités qui ont accès à un stockage exposé sur Internet contenant des données sensibles : [[query]]

      Fournir à la direction un rapport visuel personnalisable des informations sur les identités, des recommandations non saines et des chemins d'attaque : [[report]]

      Retirer les autorisations que les identités surprovisionnées n'utilisent pas : [[fix]]
  slots:
    - id: query
      options:
        - { id: explorer, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité cloud" } }
        - { id: workbook, text: { en: "CIEM workbook", fr: "Classeur CIEM" } }
        - { id: recs, text: { en: "Security recommendations", fr: "Recommandations de sécurité" } }
        - { id: compliance, text: { en: "Regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire" } }
    - id: report
      options:
        - { id: explorer, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité cloud" } }
        - { id: workbook, text: { en: "CIEM workbook", fr: "Classeur CIEM" } }
        - { id: recs, text: { en: "Security recommendations", fr: "Recommandations de sécurité" } }
        - { id: compliance, text: { en: "Regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire" } }
    - id: fix
      options:
        - { id: explorer, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité cloud" } }
        - { id: workbook, text: { en: "CIEM workbook", fr: "Classeur CIEM" } }
        - { id: recs, text: { en: "Security recommendations", fr: "Recommandations de sécurité" } }
        - { id: compliance, text: { en: "Regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire" } }
answer:
  values: { query: explorer, report: workbook, fix: recs }
explanation:
  correct:
    en: |
      Cloud security explorer queries which identities have access to which resources, with context such as sensitive data or internet exposure. The CIEM workbook is a customizable visual report of identity posture, unhealthy recommendations and attack paths. The CIEM security recommendations tell you to right-size the permissions of overprovisioned identities based on their actual usage.
    fr: |
      L'explorateur de sécurité cloud interroge les identités qui ont accès à quelles ressources, avec un contexte comme les données sensibles ou l'exposition à Internet. Le classeur CIEM est un rapport visuel personnalisable de la posture des identités, des recommandations non saines et des chemins d'attaque. Les recommandations de sécurité CIEM indiquent d'ajuster les autorisations des identités surprovisionnées selon leur utilisation réelle.
  options:
    compliance:
      en: "The regulatory compliance dashboard maps assessments to the controls of standards; it isn't the CIEM tool for any of these needs."
      fr: "Le tableau de bord de conformité réglementaire associe les évaluations aux contrôles des normes ; ce n'est l'outil CIEM d'aucun de ces besoins."
references:
  - title: Cloud infrastructure entitlement management (CIEM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/permissions-management
