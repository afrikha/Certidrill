id: sc100-2b-cae-account-disable
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Entra ID, Exchange Online and SharePoint Online. An internal audit shows that after HR disables the account of a departing employee, the employee's existing sessions to email and files can keep working until the access token expires.

    You need to recommend a solution so that access to Exchange Online and SharePoint Online stops in near real time when an account is disabled or its password is reset. The solution must minimize administrative effort and must not add sign-in prompts for active users.

    What should you recommend?
  fr: |
    Northwind Traders utilise Microsoft Entra ID, Exchange Online et SharePoint Online. Un audit interne montre qu'après la désactivation par les RH du compte d'un employé qui quitte l'entreprise, les sessions existantes de cet employé vers sa messagerie et ses fichiers peuvent continuer de fonctionner jusqu'à l'expiration du jeton d'accès.

    Vous devez recommander une solution pour que l'accès à Exchange Online et à SharePoint Online s'arrête en quasi temps réel quand un compte est désactivé ou que son mot de passe est réinitialisé. La solution doit réduire au minimum l'effort d'administration et ne doit pas ajouter d'invites de connexion pour les utilisateurs actifs.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A token lifetime policy that sets the access token lifetime to 10 minutes", fr: "Une stratégie de durée de vie des jetons qui fixe la durée de vie des jetons d'accès à 10 minutes" } }
    - { id: b, text: { en: "A Conditional Access policy that sets the sign-in frequency to Every time", fr: "Une stratégie d'accès conditionnel qui fixe la fréquence de connexion à Every time" } }
    - { id: c, text: { en: "A Conditional Access policy that requires a compliant device for both services", fr: "Une stratégie d'accès conditionnel qui exige un appareil conforme pour les deux services" } }
    - { id: d, text: { en: "Continuous access evaluation of critical events by both services", fr: "L'évaluation continue de l'accès des événements critiques par les deux services" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With continuous access evaluation (CAE), Exchange Online and SharePoint Online subscribe to critical events such as a disabled or deleted account, a password change or reset and revoked refresh tokens, and reject the token in near real time. Critical event evaluation doesn't depend on Conditional Access, and CAE-capable sessions get long-lived tokens, so active users aren't prompted more often.
    fr: |-
      Avec l'évaluation continue de l'accès (CAE), Exchange Online et SharePoint Online s'abonnent aux événements critiques comme un compte désactivé ou supprimé, un mot de passe changé ou réinitialisé et des jetons d'actualisation révoqués, et rejettent le jeton en quasi temps réel. L'évaluation des événements critiques ne dépend pas de l'accès conditionnel, et les sessions compatibles CAE reçoivent des jetons de longue durée : les utilisateurs actifs ne sont pas sollicités plus souvent.
  options:
    a: { en: "Configurable token lifetimes aren't honored for CAE-aware sessions, and short tokens still leave a window after the account is disabled.", fr: "Les durées de vie de jeton configurables ne sont pas respectées pour les sessions compatibles CAE, et des jetons courts laissent quand même une fenêtre après la désactivation du compte." }
    b: { en: "Every time forces reauthentication at each sign-in, which adds prompts for active users; it doesn't revoke an existing session.", fr: "Every time impose une réauthentification à chaque connexion, ce qui ajoute des invites pour les utilisateurs actifs ; cela ne révoque pas une session existante." }
    c: { en: "A device requirement doesn't react to the account being disabled while the token is valid.", fr: "Une exigence d'appareil ne réagit pas à la désactivation du compte tant que le jeton est valide." }
references:
  - title: Continuous access evaluation
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-continuous-access-evaluation
