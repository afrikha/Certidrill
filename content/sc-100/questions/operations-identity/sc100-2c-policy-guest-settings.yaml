id: sc100-2c-policy-guest-settings
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation runs Windows Server virtual machines in Azure, Windows servers in its on-premises datacenter, and Windows instances in Amazon EC2.

    Auditors require a report of operating system settings, such as the password policy and the TLS protocol versions, for all these servers in the Azure Policy compliance view. Later, the same settings must be applied automatically, and drift must be corrected.

    What should you recommend?
  fr: |
    Adatum Corporation exécute des machines virtuelles Windows Server dans Azure, des serveurs Windows dans son centre de données local et des instances Windows dans Amazon EC2.

    Les auditeurs exigent un rapport des paramètres du système d'exploitation, comme la stratégie de mot de passe et les versions du protocole TLS, pour tous ces serveurs dans la vue de conformité d'Azure Policy. Plus tard, les mêmes paramètres devront être appliqués automatiquement et les écarts corrigés.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The CIS AWS Foundations standard on the AWS connector of Defender for Cloud, plus Azure Policy for the Azure VMs", fr: "La norme CIS AWS Foundations sur le connecteur AWS de Defender pour le cloud, plus Azure Policy pour les machines virtuelles Azure" } }
    - { id: b, text: { en: "Machine configuration policies, with the on-premises and EC2 servers onboarded to Azure Arc", fr: "Des stratégies de configuration machine, avec les serveurs locaux et EC2 intégrés à Azure Arc" } }
    - { id: c, text: { en: "Microsoft Intune compliance policies assigned to all the servers", fr: "Des stratégies de conformité Microsoft Intune affectées à tous les serveurs" } }
    - { id: d, text: { en: "Azure Policy assignments at the tenant root management group, without other changes", fr: "Des attributions Azure Policy au groupe d'administration racine du locataire, sans autre modification" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Machine configuration audits or configures operating system settings as code, through Azure Policy, for Azure machines and Arc-enabled machines. Onboarding the on-premises and EC2 servers to Azure Arc brings them into the same compliance view. The Audit mode meets the first requirement, and the Apply and Autocorrect mode later applies the settings and restores them if they drift.
    fr: |
      La configuration machine audite ou configure les paramètres du système d'exploitation sous forme de code, par Azure Policy, pour les machines Azure et les machines compatibles Arc. Intégrer les serveurs locaux et EC2 à Azure Arc les place dans la même vue de conformité. Le mode Audit répond à la première exigence, et le mode Apply and Autocorrect applique ensuite les paramètres et les rétablit en cas d'écart.
  options:
    a:
      en: "The CIS AWS Foundations standard assesses the configuration of AWS services, not settings inside the Windows operating system, and its results aren't in the Azure Policy compliance view."
      fr: "La norme CIS AWS Foundations évalue la configuration des services AWS, pas les paramètres du système d'exploitation Windows, et ses résultats ne figurent pas dans la vue de conformité d'Azure Policy."
    c:
      en: "Intune compliance policies don't report to Azure Policy and aren't the tool for Windows Server configuration auditing across Azure, on-premises and AWS."
      fr: "Les stratégies de conformité Intune ne remontent pas dans Azure Policy et ne sont pas l'outil d'audit de la configuration de Windows Server dans Azure, en local et dans AWS."
    d:
      en: "Without Azure Arc, Azure Policy can't see the on-premises and EC2 servers, and it can't read settings inside the operating system without machine configuration."
      fr: "Sans Azure Arc, Azure Policy ne voit pas les serveurs locaux et EC2, et il ne peut pas lire les paramètres du système d'exploitation sans la configuration machine."
references:
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
