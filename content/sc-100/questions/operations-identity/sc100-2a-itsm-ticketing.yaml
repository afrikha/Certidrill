id: sc100-2a-itsm-ticketing
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Sentinel in the Microsoft Defender portal and ServiceNow as its IT service management tool. The SOC manager wants a ServiceNow ticket to be opened, and a message posted in a Microsoft Teams channel, every time a high-severity incident is created.

    The solution must not require analysts to take any action.

    What should you recommend?
  fr: |
    Adatum Corporation utilise Microsoft Sentinel dans le portail Microsoft Defender et ServiceNow comme outil de gestion des services informatiques. Le responsable du SOC veut qu'un ticket ServiceNow soit ouvert et qu'un message soit publié dans un canal Microsoft Teams chaque fois qu'un incident de gravité élevée est créé.

    La solution ne doit exiger aucune action des analystes.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An automation rule that runs a playbook when a high-severity incident is created", fr: "Une règle d'automatisation qui exécute un playbook quand un incident de gravité élevée est créé" } }
    - { id: b, text: { en: "An automation rule that adds a task to open the ticket on high-severity incidents", fr: "Une règle d'automatisation qui ajoute une tâche d'ouverture du ticket sur les incidents de gravité élevée" } }
    - { id: c, text: { en: "A playbook that the analysts run manually from each high-severity incident", fr: "Un playbook que les analystes exécutent manuellement depuis chaque incident de gravité élevée" } }
    - { id: d, text: { en: "Automated investigation and response set to full automation for all device groups", fr: "L'examen et la réponse automatisés en automatisation complète pour tous les groupes d'appareils" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Opening a ticket in a third-party tool and posting to Teams need connectors, so they belong in a playbook (an Azure Logic Apps workflow). An automation rule with the incident created trigger and a severity condition runs that playbook automatically, with no analyst action.
    fr: |
      Ouvrir un ticket dans un outil tiers et publier dans Teams exigent des connecteurs : ces actions relèvent d'un playbook (un workflow Azure Logic Apps). Une règle d'automatisation avec le déclencheur de création d'incident et une condition de gravité exécute ce playbook automatiquement, sans action des analystes.
  options:
    b:
      en: |
        A task is a checklist item for an analyst; it doesn't open the ticket by itself.
      fr: |
        Une tâche est un élément de liste de contrôle pour un analyste ; elle n'ouvre pas le ticket d'elle-même.
    c:
      en: |
        A manually run playbook requires an analyst action for each incident.
      fr: |
        Un playbook exécuté manuellement exige une action d'un analyste pour chaque incident.
    d:
      en: |
        AIR investigates and remediates evidence such as files and devices; it doesn't integrate with ServiceNow or Teams.
      fr: |
        L'examen et la réponse automatisés investiguent et corrigent des preuves comme des fichiers et des appareils ; ils ne s'intègrent pas à ServiceNow ni à Teams.
references:
  - title: Automate threat response with playbooks in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/automate-responses-with-playbooks
