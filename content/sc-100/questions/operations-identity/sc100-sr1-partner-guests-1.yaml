id: sc100-sr1-partner-guests-1
objective: "2.3.6"
type: series_yesno
series: sc100-sr1-partner-guests
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You recommend a quarterly access review of PRJ-Fabrikam that removes access when reviewers don't respond.
  fr: Vous recommandez une révision d'accès trimestrielle de PRJ-Fabrikam qui supprime l'accès quand les réviseurs ne répondent pas.
body:
  solution:
    en: |
      You recommend an access review of **PRJ-Fabrikam** that recurs every quarter, with the scope set to **Guest users only** and **Group owner(s)** as reviewers. **Auto apply results to resource** is enabled, and **If reviewers don't respond** is set to **Remove access**.
    fr: |
      Vous recommandez une révision d'accès de **PRJ-Fabrikam** qui se répète chaque trimestre, avec l'étendue définie sur **Guest users only** et **Group owner(s)** comme réviseurs. **Auto apply results to resource** est activé, et **If reviewers don't respond** est défini sur **Remove access**.
answer: { value: true }
explanation:
  correct:
    en: The Guest users only scope limits the review to the B2B guests, so the Woodgrove employees are not reviewed, and the group owners attest each guest every quarter. With auto-apply enabled, denied guests are removed from the group when the review ends, and Remove access also removes the guests that the owners did not confirm, with no manual step.
    fr: "L'étendue Guest users only limite la révision aux invités B2B, si bien que les employés de Woodgrove ne sont pas révisés, et les propriétaires du groupe attestent chaque invité tous les trimestres. Avec l'application automatique, les invités refusés sont retirés du groupe à la fin de la révision, et Remove access retire aussi les invités que les propriétaires n'ont pas confirmés, sans étape manuelle."
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
