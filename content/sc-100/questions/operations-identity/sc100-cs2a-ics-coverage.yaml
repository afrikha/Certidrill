id: sc100-cs2a-ics-coverage
objective: "2.1.6"
type: single
caseStudy: sc100-cs2a-litware-energy
difficulty: 1
status: draft
stem:
  en: |
    After the OT monitoring solution is deployed, the SOC manager asks you how the SOC should evaluate its detection coverage for the power plants. The evaluation must meet the OT requirements.

    Which framework should you recommend as the reference for the evaluation?
  fr: |
    Une fois la solution de surveillance OT déployée, le responsable du SOC vous demande comment le SOC doit évaluer sa couverture de détection pour les centrales. L'évaluation doit répondre aux exigences OT.

    Quel référentiel devez-vous recommander comme base de l'évaluation ?
body:
  options:
    - { id: a, text: { en: "The MITRE ATT&CK Enterprise matrix", fr: "La matrice MITRE ATT&CK Enterprise" } }
    - { id: b, text: { en: "The MITRE ATT&CK for ICS matrix", fr: "La matrice MITRE ATT&CK for ICS" } }
    - { id: c, text: { en: "The MITRE ATT&CK Mobile matrix", fr: "La matrice MITRE ATT&CK Mobile" } }
    - { id: d, text: { en: "The Microsoft cloud security benchmark (MCSB)", fr: "Le benchmark de sécurité cloud Microsoft (MCSB)" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The MITRE ATT&CK for ICS matrix describes the tactics and techniques that adversaries use against industrial control systems, such as unauthorized command messages sent to controllers. Defender for IoT OT alerts reference these technique IDs (T0xxx), so the SOC can compare the detections it receives with the ICS techniques that matter for the plants.
    fr: |
      La matrice MITRE ATT&CK for ICS décrit les tactiques et les techniques que les adversaires utilisent contre les systèmes de contrôle industriels, comme les messages de commande non autorisés envoyés aux automates. Les alertes OT de Defender for IoT référencent ces identifiants de techniques (T0xxx) ; le SOC peut ainsi comparer les détections qu'il reçoit aux techniques ICS pertinentes pour les centrales.
  options:
    a:
      en: The Enterprise matrix covers IT platforms such as Windows, Linux, identity providers and cloud services, not the techniques that target PLCs and RTUs.
      fr: La matrice Enterprise couvre des plateformes informatiques comme Windows, Linux, les fournisseurs d'identité et les services cloud, pas les techniques qui ciblent les PLC et les RTU.
    c:
      en: The Mobile matrix covers attacks against Android and iOS devices.
      fr: La matrice Mobile couvre les attaques contre les appareils Android et iOS.
    d:
      en: The MCSB is a set of security controls and recommendations for cloud workloads; it isn't a catalog of adversary techniques for measuring detection coverage.
      fr: Le MCSB est un ensemble de contrôles et de recommandations de sécurité pour les charges de travail cloud ; ce n'est pas un catalogue de techniques d'adversaires qui permet de mesurer une couverture de détection.
references:
  - title: Microsoft Defender for IoT alert reference
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/alert-engine-messages
