id: sc100-2c-policy-multicloud
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has Azure subscriptions in a management group hierarchy and an AWS organization connected to Microsoft Defender for Cloud. The Defender CSPM plan is enabled on all the Azure subscriptions and on the AWS connector.

    You need to recommend a solution that meets the following requirements:

    - Creating an Azure storage account that allows anonymous blob access is blocked.
    - The AWS accounts are continuously assessed against the CIS AWS Foundations Benchmark.
    - The number of tools used is minimized.

    What should you recommend?
  fr: |
    Litware, Inc. dispose d'abonnements Azure dans une hiérarchie de groupes d'administration et d'une organisation AWS connectée à Microsoft Defender pour le cloud. Le plan Defender CSPM est activé sur tous les abonnements Azure et sur le connecteur AWS.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - La création d'un compte de stockage Azure qui autorise l'accès anonyme aux blobs est bloquée.
    - Les comptes AWS sont évalués en continu par rapport au CIS AWS Foundations Benchmark.
    - Le nombre d'outils utilisés est réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Policy with the Deny effect for both the Azure subscriptions and the AWS accounts", fr: "Azure Policy avec l'effet Deny pour les abonnements Azure et pour les comptes AWS" } }
    - { id: b, text: { en: "The Defender for Cloud regulatory compliance dashboard for both, with the CIS Azure and CIS AWS Foundations standards", fr: "Le tableau de bord de conformité réglementaire de Defender pour le cloud pour les deux, avec les normes CIS Azure et CIS AWS Foundations" } }
    - { id: c, text: { en: "Azure Policy with the Deny effect for Azure, and the CIS AWS Foundations standard on the AWS connector in Defender for Cloud", fr: "Azure Policy avec l'effet Deny pour Azure, et la norme CIS AWS Foundations sur le connecteur AWS dans Defender pour le cloud" } }
    - { id: d, text: { en: "Microsoft Purview Compliance Manager assessments built from the CIS templates for both clouds", fr: "Des évaluations du Gestionnaire de conformité Microsoft Purview créées à partir des modèles CIS pour les deux clouds" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Only Azure Policy can block an Azure Resource Manager request, with the deny effect assigned at a management group. Azure Policy can't evaluate AWS accounts, but Defender for Cloud, which Litware already uses, assesses AWS accounts continuously against standards such as CIS AWS Foundations once the standard is assigned to the connector. Defender for Cloud's standards on Azure are themselves Azure Policy initiatives, so the design adds no new tool.
    fr: |
      Seul Azure Policy peut bloquer une requête Azure Resource Manager, avec l'effet deny attribué à un groupe d'administration. Azure Policy ne peut pas évaluer les comptes AWS, mais Defender pour le cloud, que Litware utilise déjà, évalue en continu les comptes AWS par rapport à des normes comme CIS AWS Foundations une fois la norme attribuée au connecteur. Dans Azure, les normes de Defender pour le cloud sont elles-mêmes des initiatives Azure Policy : la conception n'ajoute aucun outil.
  options:
    a:
      en: "Azure Policy evaluates Azure resources only; it can't assign a definition to an AWS account."
      fr: "Azure Policy n'évalue que les ressources Azure ; il ne peut pas attribuer une définition à un compte AWS."
    b:
      en: "The regulatory compliance dashboard assesses and reports; it doesn't block the creation of a non-compliant storage account."
      fr: "Le tableau de bord de conformité réglementaire évalue et rend compte ; il ne bloque pas la création d'un compte de stockage non conforme."
    d:
      en: "Compliance Manager tracks improvement actions; it blocks nothing and adds a tool that the requirements don't need."
      fr: "Le Gestionnaire de conformité suit des actions d'amélioration ; il ne bloque rien et ajoute un outil dont les exigences n'ont pas besoin."
references:
  - title: Regulatory compliance in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
  - title: Assign regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages
