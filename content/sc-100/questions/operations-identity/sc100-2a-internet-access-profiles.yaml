id: sc100-2a-internet-access-profiles
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has licensed Microsoft Entra Internet Access and Microsoft Entra Private Access for all employees and routes their traffic through Global Secure Access. You are designing the web and SaaS access controls.

    You need to recommend a solution for each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys a acquis les licences Accès Internet Microsoft Entra et Accès privé Microsoft Entra pour tous les employés et achemine leur trafic par Global Secure Access. Vous concevez les contrôles d'accès au web et aux applications SaaS.

    Vous devez recommander une solution pour chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Block gambling websites for all traffic, including users that no Conditional Access policy targets: [[s1]]

      Let the marketing team reach one social media site that a category policy blocks: [[s2]]

      Prevent employees from signing in to other organizations' tenants from corporate devices: [[s3]]
    fr: |
      Bloquer les sites de jeux d'argent pour tout le trafic, y compris pour les utilisateurs qu'aucune stratégie d'accès conditionnel ne cible : [[s1]]

      Permettre à l'équipe marketing d'atteindre un réseau social bloqué par une stratégie de catégorie : [[s2]]

      Empêcher les employés de se connecter aux locataires d'autres organisations depuis les appareils de l'entreprise : [[s3]]
  slots:
    - id: s1
      options:
        - { id: baseline, text: { en: "The baseline security profile", fr: "Le profil de sécurité de base" } }
        - { id: linked, text: { en: "A security profile linked to a Conditional Access policy", fr: "Un profil de sécurité lié à une stratégie d'accès conditionnel" } }
        - { id: utr, text: { en: "Universal tenant restrictions", fr: "Les restrictions de locataire universelles" } }
    - id: s2
      options:
        - { id: higher, text: { en: "An FQDN allow policy with a higher priority number than the block policy", fr: "Une stratégie d'autorisation FQDN avec un numéro de priorité supérieur à celui de la stratégie de blocage" } }
        - { id: lower, text: { en: "An FQDN allow policy with a lower priority number than the block policy", fr: "Une stratégie d'autorisation FQDN avec un numéro de priorité inférieur à celui de la stratégie de blocage" } }
        - { id: sanction, text: { en: "A sanctioned app tag in Defender for Cloud Apps", fr: "Une balise d'application approuvée dans Defender for Cloud Apps" } }
    - id: s3
      options:
        - { id: inbound, text: { en: "Inbound cross-tenant access settings", fr: "Les paramètres d'accès interlocataire entrant" } }
        - { id: utr, text: { en: "Universal tenant restrictions", fr: "Les restrictions de locataire universelles" } }
        - { id: wcf, text: { en: "Web content filtering by category", fr: "Le filtrage du contenu web par catégorie" } }
answer:
  values: { s1: baseline, s2: lower, s3: utr }
explanation:
  correct:
    en: |
      The baseline security profile applies to all Internet Access traffic, even without a Conditional Access link. Filtering policies with a lower priority number are evaluated first, so an allow policy for the site at a lower number than the category block policy, in a profile linked to a Conditional Access policy for marketing, lets that team through. Universal tenant restrictions, part of the Microsoft traffic profile features, prevent sign-ins to other organizations' tenants through Global Secure Access.
    fr: |
      Le profil de sécurité de base s'applique à tout le trafic Accès Internet, même sans lien avec l'accès conditionnel. Les stratégies de filtrage dont le numéro de priorité est le plus bas sont évaluées en premier : une stratégie d'autorisation du site avec un numéro inférieur à celui de la stratégie de blocage par catégorie, dans un profil lié à une stratégie d'accès conditionnel pour le marketing, laisse donc passer cette équipe. Les restrictions de locataire universelles, qui font partie des fonctionnalités du profil de trafic Microsoft, empêchent les connexions aux locataires d'autres organisations par Global Secure Access.
  options:
    linked:
      en: |
        A profile linked to a Conditional Access policy applies only to the users that the policy targets.
      fr: |
        Un profil lié à une stratégie d'accès conditionnel ne s'applique qu'aux utilisateurs que la stratégie cible.
    higher:
      en: |
        A higher number is evaluated after the block policy, so the site would still be blocked.
      fr: |
        Un numéro plus élevé est évalué après la stratégie de blocage : le site serait donc toujours bloqué.
    inbound:
      en: |
        Inbound settings control how external users access your tenant, not how your users access other tenants.
      fr: |
        Les paramètres entrants contrôlent la façon dont les utilisateurs externes accèdent à votre locataire, pas la façon dont vos utilisateurs accèdent à d'autres locataires.
references:
  - title: Learn about Microsoft Entra Internet Access for all apps
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-internet-access
  - title: What is Global Secure Access?
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access
