id: sc100-2c-paw-onprem-console
objective: "2.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. hosts a web-based management console for its storage arrays and a Remote Desktop Services (RDS) farm used by administrators in its on-premises datacenter. Administrators reach them today through a VPN that gives full access to the datacenter network. There is no network connectivity between Azure and the datacenter.

    You need to recommend a remote access solution that meets the following requirements:

    - No inbound port is opened on the datacenter firewall.
    - Access is granted per application, not to the network.
    - Microsoft Entra Conditional Access requires a compliant privileged access workstation.
    - Sessions to the console are monitored, and file downloads from the console are blocked.

    What should you recommend?
  fr: |
    Contoso, Ltd. héberge dans son centre de données local une console de gestion web pour ses baies de stockage et une batterie de services Bureau à distance (RDS) utilisée par les administrateurs. Les administrateurs y accèdent aujourd'hui par un VPN qui donne un accès complet au réseau du centre de données. Il n'existe aucune connectivité réseau entre Azure et le centre de données.

    Vous devez recommander une solution d'accès à distance qui répond aux exigences suivantes :

    - Aucun port entrant n'est ouvert sur le pare-feu du centre de données.
    - L'accès est accordé par application, pas au réseau.
    - L'accès conditionnel Microsoft Entra exige une station de travail à accès privilégié conforme.
    - Les sessions vers la console sont surveillées, et les téléchargements de fichiers depuis la console sont bloqués.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep the VPN, integrate it with Microsoft Entra authentication, and require compliant devices with Conditional Access", fr: "Conserver le VPN, l'intégrer à l'authentification Microsoft Entra et exiger des appareils conformes avec l'accès conditionnel" } }
    - { id: b, text: { en: "Publish the console and the RDS farm through Microsoft Entra application proxy, and add Defender for Cloud Apps session controls", fr: "Publier la console et la batterie RDS par le proxy d'application Microsoft Entra, et ajouter des contrôles de session Defender for Cloud Apps" } }
    - { id: c, text: { en: "Deploy Azure Bastion in a hub virtual network and connect to the on-premises servers by their IP addresses", fr: "Déployer Azure Bastion dans un réseau virtuel hub et se connecter aux serveurs locaux par leurs adresses IP" } }
    - { id: d, text: { en: "Publish a Remote Desktop gateway on the internet and require Network Level Authentication", fr: "Publier une passerelle Bureau à distance sur Internet et exiger l'authentification au niveau du réseau" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Application proxy publishes on-premises web apps and RDS through outbound connections from its connectors, so no inbound port is opened, and each app gets its own Conditional Access policy. Integrated with Defender for Cloud Apps, it adds session controls that monitor sessions and block downloads. This retrofits Zero Trust controls onto the legacy administrative apps.
    fr: |
      Le proxy d'application publie les applications web locales et RDS par des connexions sortantes de ses connecteurs : aucun port entrant n'est ouvert, et chaque application a sa propre stratégie d'accès conditionnel. Intégré à Defender for Cloud Apps, il ajoute des contrôles de session qui surveillent les sessions et bloquent les téléchargements. Cela applique les contrôles Confiance Zéro aux applications d'administration héritées.
  options:
    a:
      en: "Even with Microsoft Entra authentication, the VPN still gives access to the whole network and doesn't block downloads from the console."
      fr: "Même avec l'authentification Microsoft Entra, le VPN donne toujours accès à tout le réseau et ne bloque pas les téléchargements depuis la console."
    c:
      en: "Bastion can reach only addresses that its virtual network can route to, and there is no connectivity between Azure and the datacenter; it also has no download-blocking session controls for the web console."
      fr: "Bastion ne peut atteindre que les adresses routables depuis son réseau virtuel, et il n'existe aucune connectivité entre Azure et le centre de données ; il n'a pas non plus de contrôles de session bloquant les téléchargements de la console web."
    d:
      en: "Publishing a gateway on the internet opens an inbound port and doesn't give per-app Conditional Access or session controls."
      fr: "Publier une passerelle sur Internet ouvre un port entrant et ne donne ni accès conditionnel par application ni contrôles de session."
references:
  - title: Securing privileged access intermediaries
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-intermediaries
