id: sc100-2b-governance-facts
objective: "2.3.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation is evaluating the security and governance of its Microsoft Entra tenant. The executives' accounts are in a restricted management administrative unit. The tenant has two emergency access accounts, and privileged roles are managed with Privileged Identity Management.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation évalue la sécurité et la gouvernance de son locataire Microsoft Entra. Les comptes des dirigeants se trouvent dans une unité administrative de gestion restreinte. Le locataire dispose de deux comptes d'accès d'urgence, et les rôles privilégiés sont gérés avec Privileged Identity Management.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          PIM can make users eligible members of a security group so that the group membership is activated just in time.
        fr: |-
          PIM peut rendre des utilisateurs membres éligibles d'un groupe de sécurité pour que l'appartenance au groupe soit activée juste-à-temps.
    - id: s2
      text:
        en: |-
          The executives' group memberships can be recertified by an access review created in Microsoft Entra ID Governance.
        fr: |-
          Les appartenances aux groupes des dirigeants peuvent être recertifiées par une révision d'accès créée dans Microsoft Entra ID Governance.
    - id: s3
      text:
        en: |-
          The emergency access accounts should receive the Global Administrator role as eligible assignments in PIM.
        fr: |-
          Les comptes d'accès d'urgence doivent recevoir le rôle Global Administrator en attributions éligibles dans PIM.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      PIM manages Microsoft Entra roles, Azure resource roles and PIM for Groups, which makes group membership or ownership just in time. Governance features such as PIM, entitlement management, lifecycle workflows and access reviews can't manage the users or groups of a restricted management administrative unit. Emergency access accounts keep a permanent active Global Administrator assignment so that they work when PIM or MFA can't be used.
    fr: |-
      PIM gère les rôles Microsoft Entra, les rôles de ressources Azure et PIM for Groups, qui rend l'appartenance ou la propriété d'un groupe juste-à-temps. Les fonctionnalités de gouvernance comme PIM, la gestion des droits d'utilisation, les workflows de cycle de vie et les révisions d'accès ne peuvent pas gérer les utilisateurs ni les groupes d'une unité administrative de gestion restreinte. Les comptes d'accès d'urgence conservent une attribution active permanente de Global Administrator pour fonctionner quand PIM ou la MFA ne peuvent pas être utilisés.
references:
  - title: Restricted management administrative units in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/admin-units-restricted-management
  - title: Manage emergency access accounts in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access
