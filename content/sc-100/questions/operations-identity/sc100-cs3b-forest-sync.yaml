id: sc100-cs3b-forest-sync
objective: "2.2.3"
type: yesno_statements
caseStudy: sc100-cs3b-fabrikam-freight
difficulty: 2
status: draft
stem:
  en: |
    You recommend Microsoft Entra Cloud Sync to meet the identity requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous recommandez Microsoft Entra Cloud Sync pour respecter les exigences relatives aux identités.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Cloud Sync can synchronize fabrikam.local and proseware.local to fabrikamfreight.com without a trust or network connectivity between the two forests.
        fr: |-
          Cloud Sync peut synchroniser fabrikam.local et proseware.local vers fabrikamfreight.com sans approbation ni connectivité réseau entre les deux forêts.
    - id: s2
      text:
        en: |-
          The synchronization configuration is stored on the servers that run the provisioning agents.
        fr: |-
          La configuration de la synchronisation est stockée sur les serveurs qui exécutent les agents de provisionnement.
    - id: s3
      text:
        en: |-
          To keep synchronizing when a server fails, you deploy several active provisioning agents on different servers.
        fr: |-
          Pour que la synchronisation continue quand un serveur tombe en panne, vous déployez plusieurs agents de provisionnement actifs sur des serveurs différents.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Cloud Sync natively handles multiple disconnected AD DS forests, which supports mergers and acquisitions where forests can't be connected. All the synchronization configuration is stored and managed in Microsoft Entra ID, not on the agent servers. Several active provisioning agents on different servers provide automatic failover.
    fr: |-
      Cloud Sync gère nativement plusieurs forêts AD DS déconnectées, ce qui couvre les fusions et acquisitions dans lesquelles les forêts ne peuvent pas être connectées. Toute la configuration de la synchronisation est stockée et gérée dans Microsoft Entra ID, pas sur les serveurs des agents. Plusieurs agents de provisionnement actifs sur des serveurs différents assurent un basculement automatique.
references:
  - title: What is Microsoft Entra Cloud Sync?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/what-is-cloud-sync
