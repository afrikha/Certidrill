id: sc100-2b-verified-id-roles
objective: "2.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders plans a decentralized identity solution based on Microsoft Entra Verified ID. Northwind's HR department will issue proof-of-employment credentials to employees. Employees will keep the credentials in Microsoft Authenticator. Tailspin Toys, a partner, will accept the credentials on its benefits portal to grant employee discounts, without calling Northwind's systems.

    Which role does each participant play? To answer, drag the appropriate roles to the correct participants. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit une solution d'identité décentralisée basée sur Microsoft Entra Verified ID. Le service RH de Northwind émettra des informations d'identification de preuve d'emploi aux employés. Les employés conserveront ces informations d'identification dans Microsoft Authenticator. Tailspin Toys, un partenaire, acceptera ces informations d'identification sur son portail d'avantages pour accorder des remises aux employés, sans appeler les systèmes de Northwind.

    Quel rôle joue chaque participant ? Pour répondre, faites glisser les rôles appropriés vers les participants correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: issuer, text: { en: "Issuer", fr: "Émetteur" } }
    - { id: holder, text: { en: "Holder (user)", fr: "Détenteur (utilisateur)" } }
    - { id: verifier, text: { en: "Verifier", fr: "Vérificateur" } }
    - { id: idp, text: { en: "Federated identity provider", fr: "Fournisseur d'identité fédéré" } }
    - { id: resolver, text: { en: "Trust system", fr: "Système d'approbation" } }
  targets:
    - { id: hr, text: { en: "Northwind HR department", fr: "Service RH de Northwind" } }
    - { id: emp, text: { en: "Northwind employee with Microsoft Authenticator", fr: "Employé de Northwind avec Microsoft Authenticator" } }
    - { id: portal, text: { en: "Tailspin Toys benefits portal", fr: "Portail d'avantages de Tailspin Toys" } }
answer:
  mapping: { hr: issuer, emp: holder, portal: verifier }
explanation:
  correct:
    en: |-
      The issuer verifies the user and signs a verifiable credential with its decentralized identifier (DID). The user requests the credential, stores it in Authenticator, which acts as the wallet, and presents it. The verifier validates the credential against the public key of an issuer it trusts, without contacting the issuer. The trust system is where DIDs are resolved (did:web), not a participant of this scenario.
    fr: |-
      L'émetteur vérifie l'utilisateur et signe une information d'identification vérifiable avec son identificateur décentralisé (DID). L'utilisateur demande l'information d'identification, la conserve dans Authenticator, qui sert de portefeuille, et la présente. Le vérificateur valide l'information d'identification avec la clé publique d'un émetteur qu'il approuve, sans contacter l'émetteur. Le système d'approbation est l'endroit où les DID sont résolus (did:web), pas un participant de ce scénario.
  options:
    idp: { en: "No federation is involved: the verifier doesn't redirect the user to Northwind to sign in.", fr: "Aucune fédération n'intervient : le vérificateur ne redirige pas l'utilisateur vers Northwind pour se connecter." }
references:
  - title: Introduction to Microsoft Entra Verified ID
    url: https://learn.microsoft.com/en-us/entra/verified-id/decentralized-identifier-overview
