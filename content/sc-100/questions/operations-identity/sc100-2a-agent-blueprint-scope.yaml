id: sc100-2a-agent-blueprint-scope
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has Microsoft 365 E7. A third-party orchestration platform creates agent identities in the Fabrikam tenant from a single agent identity blueprint, without any administrator action, and Fabrikam can't modify the platform. Thousands of agent identities are created and deleted every week.

    You need to recommend a design that applies the same Conditional Access policy to every current and future agent of the platform. If the platform is compromised, administrators must be able to stop all its agents from authenticating with a single action.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose de Microsoft 365 E7. Une plateforme d'orchestration tierce crée des identités d'agent dans le locataire Fabrikam à partir d'un seul blueprint d'identité d'agent, sans aucune action d'un administrateur, et Fabrikam ne peut pas modifier la plateforme. Des milliers d'identités d'agent sont créées et supprimées chaque semaine.

    Vous devez recommander une conception qui applique la même stratégie d'accès conditionnel à chaque agent actuel et futur de la plateforme. Si la plateforme est compromise, les administrateurs doivent pouvoir empêcher tous ses agents de s'authentifier en une seule action.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Target a custom security attribute set on each agent, and disable the agents that have it", fr: "Cibler un attribut de sécurité personnalisé défini sur chaque agent, et désactiver les agents qui l'ont" } }
    - { id: b, text: { en: "Target the platform's service principal as a workload identity, and disable it", fr: "Cibler le principal de service de la plateforme comme identité de charge de travail, et le désactiver" } }
    - { id: c, text: { en: "Target the agent identity blueprint in the policy, and disable the blueprint", fr: "Cibler le blueprint d'identité d'agent dans la stratégie, et désactiver le blueprint" } }
    - { id: d, text: { en: "Target the agent users of the platform, and block sign-in for each agent user", fr: "Cibler les utilisateurs d'agent de la plateforme, et bloquer la connexion de chaque utilisateur d'agent" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      All agent identities are created from a blueprint, and a Conditional Access policy that targets a blueprint applies to all the agent identities created from it, including future ones. Disabling the blueprint prevents all its agent identities from authenticating, which is the single action required.
    fr: |
      Toutes les identités d'agent sont créées à partir d'un blueprint, et une stratégie d'accès conditionnel qui cible un blueprint s'applique à toutes les identités d'agent créées à partir de celui-ci, y compris les futures. Désactiver le blueprint empêche toutes ses identités d'agent de s'authentifier, ce qui est l'action unique requise.
  options:
    a:
      en: |
        Custom security attributes cover future agents only if someone sets the attribute on each new agent, which the platform doesn't do, and disabling the agents one by one isn't a single action.
      fr: |
        Les attributs de sécurité personnalisés ne couvrent les agents futurs que si quelqu'un définit l'attribut sur chaque nouvel agent, ce que la plateforme ne fait pas, et désactiver les agents un par un n'est pas une action unique.
    b:
      en: |
        The agents authenticate as agent identities, not as a traditional service principal, so a workload identity policy doesn't cover their tokens.
      fr: |
        Les agents s'authentifient comme identités d'agent, pas comme un principal de service traditionnel : une stratégie d'identité de charge de travail ne couvre donc pas leurs jetons.
    d:
      en: |
        Agent users are separate accounts that the platform doesn't necessarily create, policies on them don't cover the agent identities, and blocking each one isn't a single action.
      fr: |
        Les utilisateurs d'agent sont des comptes distincts que la plateforme ne crée pas forcément, les stratégies qui les ciblent ne couvrent pas les identités d'agent, et bloquer chacun d'eux n'est pas une action unique.
references:
  - title: Agent identity blueprints in Microsoft Entra Agent ID
    url: https://learn.microsoft.com/en-us/entra/agent-id/identity-platform/agent-blueprint
  - title: Conditional Access for Agents in Microsoft Entra
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
