id: sc100-2a-agent-api-keys
objective: "2.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has Microsoft 365 E7. Its data science team runs AI agents on AWS Bedrock that call an internal REST API hosted in Azure. Today, each agent authenticates to the API with a static API key.

    The security team requires that Conditional Access for agents and ID Protection for agents apply to every call that these agents make to the API.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose de Microsoft 365 E7. Son équipe de science des données exécute sur AWS Bedrock des agents IA qui appellent une API REST interne hébergée dans Azure. Aujourd'hui, chaque agent s'authentifie auprès de l'API avec une clé API statique.

    L'équipe de sécurité exige que l'accès conditionnel pour les agents et ID Protection pour les agents s'appliquent à chaque appel que ces agents font à l'API.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the API keys in Azure Key Vault and rotate them every 30 days", fr: "Stocker les clés API dans Azure Key Vault et les renouveler tous les 30 jours" } }
    - { id: b, text: { en: "Give each agent an agent identity created from an agent identity blueprint", fr: "Donner à chaque agent une identité d'agent créée à partir d'un blueprint d'identité d'agent" } }
    - { id: c, text: { en: "Create an agent user for each agent and keep the API keys for the calls", fr: "Créer un utilisateur d'agent pour chaque agent et conserver les clés API pour les appels" } }
    - { id: d, text: { en: "Configure the API to accept only access tokens issued by Microsoft Entra ID", fr: "Configurer l'API pour qu'elle n'accepte que des jetons d'accès émis par Microsoft Entra ID" } }
    - { id: e, text: { en: "Publish the API through Microsoft Entra application proxy", fr: "Publier l'API par le proxy d'application Microsoft Entra" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Conditional Access is evaluated when Microsoft Entra ID issues or refreshes a token, so agents that use API keys bypass it entirely. Agents built on non-Microsoft platforms such as AWS Bedrock can use agent identities through the Microsoft Entra ID Auth SDK or workload identity federation. The API must then require Microsoft Entra access tokens, so that every call goes through token issuance, where Conditional Access and agent risk apply.
    fr: |
      L'accès conditionnel est évalué quand Microsoft Entra ID émet ou actualise un jeton : les agents qui utilisent des clés API le contournent donc entièrement. Des agents créés sur des plateformes non Microsoft comme AWS Bedrock peuvent utiliser des identités d'agent au moyen du SDK Microsoft Entra ID Auth ou de la fédération des identités de charge de travail. L'API doit ensuite exiger des jetons d'accès Microsoft Entra, afin que chaque appel passe par l'émission de jetons, où l'accès conditionnel et le risque d'agent s'appliquent.
  options:
    a:
      en: |
        Rotation protects the keys better, but calls with API keys still don't involve Microsoft Entra token issuance.
      fr: |
        Le renouvellement protège mieux les clés, mais les appels avec des clés API ne passent toujours pas par l'émission de jetons Microsoft Entra.
    c:
      en: |
        As long as the API calls use API keys, the agent user's policies never apply to them.
      fr: |
        Tant que les appels à l'API utilisent des clés API, les stratégies de l'utilisateur d'agent ne s'y appliquent jamais.
    e:
      en: |
        Application proxy publishes on-premises web apps for users; it isn't how cloud agents obtain agent identity tokens.
      fr: |
        Le proxy d'application publie des applications web locales pour des utilisateurs ; ce n'est pas ainsi que des agents cloud obtiennent des jetons d'identité d'agent.
references:
  - title: Conditional Access for Agents in Microsoft Entra
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
  - title: What is Microsoft Entra Agent ID?
    url: https://learn.microsoft.com/en-us/entra/agent-id/identity-professional/microsoft-entra-agent-identities-for-ai-agents
