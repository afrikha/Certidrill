id: sc100-2c-tenant-breakglass
objective: "2.3.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is designing emergency access accounts for its Microsoft Entra tenant. All the administrators currently sign in by using Microsoft Authenticator, and every privileged role is assigned through Microsoft Entra Privileged Identity Management (PIM).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit des comptes d'accès d'urgence pour son locataire Microsoft Entra. Tous les administrateurs se connectent actuellement avec Microsoft Authenticator, et chaque rôle privilégié est attribué par Microsoft Entra Privileged Identity Management (PIM).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "One emergency access account is enough if its credentials are stored in a fireproof safe."
        fr: "Un seul compte d'accès d'urgence suffit si ses informations d'identification sont conservées dans un coffre ignifugé."
    - id: s2
      text:
        en: "The emergency access accounts should hold the Global Administrator role as an eligible assignment in PIM."
        fr: "Les comptes d'accès d'urgence doivent détenir le rôle Global Administrator sous forme d'attribution éligible dans PIM."
    - id: s3
      text:
        en: "The emergency access accounts should use passkeys (FIDO2) rather than Microsoft Authenticator."
        fr: "Les comptes d'accès d'urgence doivent utiliser des clés d'accès (FIDO2) plutôt que Microsoft Authenticator."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Microsoft recommends two or more cloud-only emergency access accounts, so that one remains if the other is unusable. They hold Global Administrator as a permanent active assignment, because an activation could itself depend on the services that failed. They use a phishing-resistant method, preferably passkeys (FIDO2), that differs from the method of the normal administrators, so a failure of that method doesn't lock out every account.
    fr: |
      Microsoft recommande au moins deux comptes d'accès d'urgence cloud uniquement, pour qu'il en reste un si l'autre est inutilisable. Ils détiennent Global Administrator en attribution active permanente, car une activation pourrait elle-même dépendre des services en panne. Ils utilisent une méthode résistante au hameçonnage, de préférence des clés d'accès (FIDO2), différente de celle des administrateurs habituels, pour qu'une panne de cette méthode ne bloque pas tous les comptes.
  options:
    s1:
      en: "Create at least two emergency access accounts for redundancy, and store their credentials in separate secure locations."
      fr: "Créez au moins deux comptes d'accès d'urgence pour la redondance, et conservez leurs informations d'identification dans des lieux sécurisés distincts."
    s2:
      en: "Emergency access accounts are the exception to just-in-time access; their Global Administrator assignment is permanent active."
      fr: "Les comptes d'accès d'urgence sont l'exception à l'accès juste-à-temps ; leur attribution Global Administrator est active permanente."
references:
  - title: Manage emergency access admin accounts
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access
