id: sc100-2a-xdr-siem-split
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has Microsoft 365 E5, with Microsoft Defender for Endpoint on all devices and Microsoft Defender for Identity sensors on all domain controllers. The datacenter is protected by Cisco firewalls that can send logs only in the Common Event Format (CEF) over Syslog.

    You are designing the detection and response solution. The solution must meet the following requirements:

    - Contain compromised devices and accounts automatically during a ransomware attack in progress.
    - Correlate the firewall logs with the identity and endpoint alerts in custom detections.

    Which two components should you include in the design? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose de Microsoft 365 E5, avec Microsoft Defender for Endpoint sur tous les appareils et des capteurs Microsoft Defender for Identity sur tous les contrôleurs de domaine. Le centre de données est protégé par des pare-feu Cisco qui ne peuvent envoyer leurs journaux qu'au format CEF (Common Event Format) sur Syslog.

    Vous concevez la solution de détection et de réponse. La solution doit répondre aux exigences suivantes :

    - Contenir automatiquement les appareils et les comptes compromis pendant une attaque par rançongiciel en cours.
    - Corréler les journaux des pare-feu avec les alertes d'identité et de points de terminaison dans des détections personnalisées.

    Quels sont les deux composants à inclure dans la conception ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Automatic attack disruption in Microsoft Defender XDR", fr: "L'interruption automatique des attaques dans Microsoft Defender XDR" } }
    - { id: b, text: { en: "Cloud discovery in Microsoft Defender for Cloud Apps with a log collector for the firewalls", fr: "La découverte cloud de Microsoft Defender for Cloud Apps avec un collecteur de journaux pour les pare-feu" } }
    - { id: c, text: { en: "Microsoft Sentinel with the CEF via AMA data connector and a Linux log forwarder", fr: "Microsoft Sentinel avec le connecteur de données CEF via AMA et un redirecteur de journaux Linux" } }
    - { id: d, text: { en: "Microsoft Defender for Servers Plan 2 on the domain controllers", fr: "Microsoft Defender for Servers Plan 2 sur les contrôleurs de domaine" } }
    - { id: e, text: { en: "Microsoft Purview Audit (Premium) for all the administrators", fr: "Microsoft Purview Audit (Premium) pour tous les administrateurs" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Automatic attack disruption uses the Defender XDR correlation of endpoint and identity signals to contain devices and users during attacks such as ransomware, without waiting for an analyst. Firewall logs are a non-Microsoft source, so they need Microsoft Sentinel; the CEF via AMA connector collects them through a Linux log forwarder, and custom detections can then join them with the Defender XDR data.
    fr: |
      L'interruption automatique des attaques s'appuie sur la corrélation des signaux de points de terminaison et d'identité de Defender XDR pour contenir les appareils et les utilisateurs pendant des attaques comme un rançongiciel, sans attendre un analyste. Les journaux de pare-feu sont une source non Microsoft : ils nécessitent Microsoft Sentinel ; le connecteur CEF via AMA les collecte par un redirecteur de journaux Linux, puis des détections personnalisées peuvent les joindre aux données Defender XDR.
  options:
    b:
      en: Cloud discovery analyzes firewall logs to find the cloud apps in use (shadow IT); it doesn't make them available for custom security detections.
      fr: La découverte cloud analyse les journaux de pare-feu pour trouver les applications cloud utilisées (shadow IT) ; elle ne les rend pas disponibles pour des détections de sécurité personnalisées.
    d:
      en: Defender for Servers protects servers, but the domain controllers are already covered by Defender for Endpoint and Defender for Identity, and it doesn't collect the firewall logs.
      fr: Defender for Servers protège des serveurs, mais les contrôleurs de domaine sont déjà couverts par Defender for Endpoint et Defender for Identity, et il ne collecte pas les journaux de pare-feu.
    e:
      en: Purview Audit records Microsoft 365 activity; it neither contains attacks nor ingests firewall logs.
      fr: Purview Audit enregistre l'activité Microsoft 365 ; il ne contient pas les attaques et n'ingère pas les journaux de pare-feu.
references:
  - title: Automatic attack disruption in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption
  - title: Ingest syslog and CEF messages to Microsoft Sentinel - AMA
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
