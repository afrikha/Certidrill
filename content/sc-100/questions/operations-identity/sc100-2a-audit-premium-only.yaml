id: sc100-2a-audit-premium-only
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Audit (Standard) in Microsoft Purview. The compliance officer asks you to justify an upgrade of the users' licenses to include Audit (Premium).

    You need to identify the capabilities that Wingtip doesn't have today and would get with Audit (Premium).

    Which two capabilities should you identify?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Audit (Standard) dans Microsoft Purview. Le responsable de la conformité vous demande de justifier une mise à niveau des licences des utilisateurs pour inclure Audit (Premium).

    Vous devez identifier les fonctionnalités dont Wingtip ne dispose pas aujourd'hui et qu'elle obtiendrait avec Audit (Premium).

    Quelles sont les deux fonctionnalités à identifier ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Searching the unified audit log in the Microsoft Purview portal", fr: "La recherche dans le journal d'audit unifié dans le portail Microsoft Purview" } }
    - { id: b, text: { en: "Audit log retention policies scoped to specific users or activities", fr: "Des stratégies de rétention des journaux d'audit limitées à des utilisateurs ou des activités spécifiques" } }
    - { id: c, text: { en: "Retrieving audit records through the Office 365 Management Activity API", fr: "La récupération des enregistrements d'audit au moyen de l'Office 365 Management Activity API" } }
    - { id: d, text: { en: "One-year default retention of Exchange, SharePoint and OneDrive records", fr: "Une rétention par défaut d'un an des enregistrements Exchange, SharePoint et OneDrive" } }
    - { id: e, text: { en: "Audit logging turned on by default for the organization", fr: "La journalisation d'audit activée par défaut pour l'organisation" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Audit (Premium) adds custom audit log retention policies by service, activity or user, and keeps Microsoft Entra ID, Exchange, OneDrive and SharePoint records for one year by default, instead of 180 days with Audit (Standard). It also adds intelligent insights such as MailItemsAccessed and more API bandwidth.
    fr: |
      Audit (Premium) ajoute des stratégies personnalisées de rétention des journaux d'audit par service, activité ou utilisateur, et conserve par défaut un an les enregistrements Microsoft Entra ID, Exchange, OneDrive et SharePoint, au lieu de 180 jours avec Audit (Standard). Il ajoute aussi des informations intelligentes comme MailItemsAccessed et davantage de bande passante d'API.
  options:
    a:
      en: |
        Audit log search is available with Audit (Standard).
      fr: |
        La recherche dans le journal d'audit est disponible avec Audit (Standard).
    c:
      en: |
        The Management Activity API is available with Audit (Standard), with a baseline bandwidth; Premium only increases that bandwidth.
      fr: |
        L'API Management Activity est disponible avec Audit (Standard), avec une bande passante de base ; Premium ne fait qu'augmenter cette bande passante.
    e:
      en: |
        Auditing is on by default for organizations with the appropriate subscription, with Audit (Standard) as well.
      fr: |
        L'audit est activé par défaut pour les organisations disposant de l'abonnement approprié, avec Audit (Standard) également.
references:
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
