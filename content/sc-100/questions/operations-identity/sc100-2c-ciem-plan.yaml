id: sc100-2c-ciem-plan
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has Azure subscriptions, AWS accounts, and GCP projects connected to Microsoft Defender for Cloud. Only the free foundational CSPM capabilities are in use.

    You need to identify the identities in the three clouds that are inactive or overprovisioned, and to get recommendations that right-size their permissions based on actual usage.

    Which Defender for Cloud plan should you enable?
  fr: |
    Northwind Traders dispose d'abonnements Azure, de comptes AWS et de projets GCP connectés à Microsoft Defender pour le cloud. Seules les fonctionnalités gratuites de CSPM de base sont utilisées.

    Vous devez identifier les identités des trois clouds qui sont inactives ou surprovisionnées, et obtenir des recommandations qui ajustent leurs autorisations en fonction de leur utilisation réelle.

    Quel plan Defender pour le cloud devez-vous activer ?
body:
  options:
    - { id: a, text: Defender for Servers Plan 2 }
    - { id: b, text: Defender CSPM }
    - { id: c, text: Defender for Resource Manager }
    - { id: d, text: Defender for Storage }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cloud infrastructure entitlement management (CIEM) is included in the Defender CSPM plan. It covers Microsoft Entra users, groups and service principals, AWS IAM users, roles and groups, and GCP IAM users, groups and service accounts, and recommends removing inactive accounts and right-sizing overprovisioned permissions.
    fr: |
      La gestion des droits d'utilisation de l'infrastructure cloud (CIEM) est incluse dans le plan Defender CSPM. Elle couvre les utilisateurs, groupes et principaux de service Microsoft Entra, les utilisateurs, rôles et groupes IAM AWS, ainsi que les utilisateurs, groupes et comptes de service IAM GCP, et recommande de retirer les comptes inactifs et d'ajuster les autorisations surprovisionnées.
  options:
    a:
      en: "Defender for Servers protects machines (vulnerabilities, EDR, just-in-time VM access); it doesn't analyze cloud identity permissions."
      fr: "Defender for Servers protège les machines (vulnérabilités, EDR, accès juste-à-temps aux machines virtuelles) ; il n'analyse pas les autorisations des identités cloud."
    c:
      en: "Defender for Resource Manager detects suspicious management operations in Azure; it doesn't compare granted and used permissions across clouds."
      fr: "Defender for Resource Manager détecte les opérations de gestion suspectes dans Azure ; il ne compare pas les autorisations accordées et utilisées entre les clouds."
    d:
      en: "Defender for Storage detects threats to storage accounts; it has no entitlement analysis."
      fr: "Defender for Storage détecte les menaces sur les comptes de stockage ; il n'a pas d'analyse des droits d'utilisation."
references:
  - title: Cloud infrastructure entitlement management (CIEM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/permissions-management
