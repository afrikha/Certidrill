id: sc100-cs2c-agent-access
objective: "2.2.1"
type: yesno_statements
caseStudy: sc100-cs2c-southridge-video
difficulty: 3
status: draft
stem:
  en: |
    You are designing the Conditional Access policies for the agents of the producers. The policies must meet the AI requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les stratégies d'accès conditionnel pour les agents des producteurs. Les stratégies doivent répondre aux exigences relatives à l'IA.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A policy that targets agent identities by using a custom security attribute applies to new agents that receive the attribute, without any change to the policy.
        fr: Une stratégie qui cible des identités d'agent au moyen d'un attribut de sécurité personnalisé s'applique aux nouveaux agents qui reçoivent l'attribut, sans aucune modification de la stratégie.
    - id: s2
      text:
        en: You can target the agent user accounts of the two email agents by adding them to a security group that the policy includes.
        fr: Vous pouvez cibler les comptes d'utilisateur d'agent des deux agents de messagerie en les ajoutant à un groupe de sécurité inclus dans la stratégie.
    - id: s3
      text:
        en: A policy that targets the agent identity of an agent also applies to the agent user account that is linked to this agent identity.
        fr: Une stratégie qui cible l'identité d'agent d'un agent s'applique aussi au compte d'utilisateur d'agent lié à cette identité d'agent.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Conditional Access can target agents through custom security attributes, so any agent identity labeled with the attribute, including a future one, is covered automatically. Agent user accounts are selected explicitly in the agents assignment of the policy: scoping them through group membership isn't supported, and policies scoped through the Users assignment don't apply to them. An agent user account is also targeted separately from its agent identity, and a policy on one doesn't apply to the other.
    fr: |
      L'accès conditionnel peut cibler des agents au moyen d'attributs de sécurité personnalisés ; toute identité d'agent qui porte l'attribut, y compris une identité future, est donc couverte automatiquement. Les comptes d'utilisateur d'agent sont sélectionnés explicitement dans l'attribution des agents de la stratégie : leur ciblage par appartenance à un groupe n'est pas pris en charge, et les stratégies limitées par l'attribution Utilisateurs ne s'appliquent pas à eux. Un compte d'utilisateur d'agent est aussi ciblé séparément de son identité d'agent, et une stratégie sur l'un ne s'applique pas à l'autre.
references:
  - title: Conditional Access for Agents in Microsoft Entra
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
  - title: What are agent identities?
    url: https://learn.microsoft.com/en-us/entra/agent-id/identity-platform/what-is-agent-id
