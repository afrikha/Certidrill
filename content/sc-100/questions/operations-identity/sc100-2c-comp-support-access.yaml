id: sc100-2c-comp-support-access
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft 365 E5. A banking regulator requires that Woodgrove explicitly approve any access by Microsoft support engineers to the content of its mailboxes, SharePoint sites and OneDrive accounts before the access occurs.

    Which control should you recommend to meet the requirement?
  fr: |
    Woodgrove Bank utilise Microsoft 365 E5. Un régulateur bancaire exige que Woodgrove approuve explicitement tout accès des ingénieurs du support Microsoft au contenu de ses boîtes aux lettres, de ses sites SharePoint et de ses comptes OneDrive avant que l'accès ait lieu.

    Quel contrôle devez-vous recommander pour répondre à l'exigence ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra Privileged Identity Management for the Exchange Administrator role", fr: "Microsoft Entra Privileged Identity Management pour le rôle Exchange Administrator" } }
    - { id: b, text: { en: "Microsoft Purview Customer Key for Exchange Online and SharePoint", fr: "Microsoft Purview Customer Key pour Exchange Online et SharePoint" } }
    - { id: c, text: { en: "Privileged access management in Microsoft 365 for Exchange tasks", fr: "La gestion des accès privilégiés de Microsoft 365 pour les tâches Exchange" } }
    - { id: d, text: { en: "Customer Lockbox", fr: "Customer Lockbox" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Customer Lockbox makes the customer's approval the final step before a Microsoft engineer can access content in Exchange Online, SharePoint, OneDrive, Teams or Windows 365. A request that isn't approved expires and grants no access. It's included in Microsoft 365 E5, and approvers are Global Administrators or users with the Customer Lockbox access approver role.
    fr: |
      Customer Lockbox fait de l'approbation du client la dernière étape avant qu'un ingénieur Microsoft puisse accéder au contenu d'Exchange Online, SharePoint, OneDrive, Teams ou Windows 365. Une demande non approuvée expire et n'accorde aucun accès. Il est inclus dans Microsoft 365 E5, et les approbateurs sont les Global Administrators ou les utilisateurs qui ont le rôle Customer Lockbox access approver.
  options:
    a:
      en: "PIM controls when Woodgrove's own administrators can use a role; it has no effect on Microsoft support engineers."
      fr: "PIM contrôle quand les administrateurs de Woodgrove eux-mêmes peuvent utiliser un rôle ; il n'a aucun effet sur les ingénieurs du support Microsoft."
    b:
      en: "Customer Key lets Woodgrove control the encryption keys of its data at rest; it doesn't add an approval step to support access."
      fr: "Customer Key permet à Woodgrove de contrôler les clés de chiffrement de ses données au repos ; il n'ajoute pas d'étape d'approbation à l'accès du support."
    c:
      en: "Privileged access management in Microsoft 365 requires approval for tasks run by the organization's own administrators, not by Microsoft engineers."
      fr: "La gestion des accès privilégiés de Microsoft 365 exige une approbation pour les tâches exécutées par les administrateurs de l'organisation, pas par les ingénieurs Microsoft."
references:
  - title: Customer Lockbox requests
    url: https://learn.microsoft.com/en-us/purview/customer-lockbox-requests
