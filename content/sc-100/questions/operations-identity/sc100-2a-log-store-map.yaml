id: sc100-2a-log-store-map
objective: "2.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has Microsoft 365 E5 licenses for all users and uses Microsoft Sentinel onboarded to the Microsoft Defender portal. You are designing where the security and audit data is stored and queried.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose de licences Microsoft 365 E5 pour tous les utilisateurs et utilise Microsoft Sentinel intégré au portail Microsoft Defender. Vous concevez l'emplacement de stockage et d'interrogation des données de sécurité et d'audit.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: std, text: "Audit (Standard)" }
    - { id: prem, text: "Audit (Premium)" }
    - { id: analytics, text: { en: "Sentinel analytics tier", fr: "Niveau Analytique de Sentinel" } }
    - { id: lake, text: { en: "Sentinel data lake tier", fr: "Niveau Lac de données de Sentinel" } }
    - { id: ah, text: { en: "Defender XDR advanced hunting", fr: "Repérage avancé de Defender XDR" } }
  targets:
    - id: t1
      text: { en: "Run near-real-time detections on firewall logs", fr: "Exécuter des détections en quasi-temps réel sur les journaux de pare-feu" }
    - id: t2
      text: { en: "Keep eight years of proxy logs for rare forensic queries at the lowest cost", fr: "Conserver huit ans de journaux de proxy pour de rares requêtes forensiques au moindre coût" }
    - id: t3
      text: { en: "Find which SharePoint files a user deleted ten months ago", fr: "Trouver quels fichiers SharePoint un utilisateur a supprimés il y a dix mois" }
    - id: t4
      text: { en: "Query the last 30 days of device process events without paying to ingest them", fr: "Interroger les 30 derniers jours d'événements de processus des appareils sans payer leur ingestion" }
answer:
  mapping: { t1: analytics, t2: lake, t3: prem, t4: ah }
explanation:
  correct:
    en: |
      The analytics tier is built for real-time detection, alerting and incident management. The data lake tier is the low-cost store for large volumes, with up to 12 years of retention. Audit (Premium) keeps SharePoint records for one year by default, so a ten-month-old deletion is still searchable. Defender XDR advanced hunting keeps its raw data for 30 days at no ingestion cost.
    fr: |
      Le niveau Analytique est conçu pour la détection en temps réel, les alertes et la gestion des incidents. Le niveau Lac de données est le stockage à faible coût pour de gros volumes, avec jusqu'à 12 ans de rétention. Audit (Premium) conserve par défaut un an les enregistrements SharePoint : une suppression vieille de dix mois reste donc consultable. Le repérage avancé de Defender XDR conserve ses données brutes 30 jours sans coût d'ingestion.
  options:
    std:
      en: |
        Audit (Standard) keeps records for 180 days, so a ten-month-old SharePoint event is no longer available.
      fr: |
        Audit (Standard) conserve les enregistrements 180 jours : un événement SharePoint vieux de dix mois n'est plus disponible.
references:
  - title: Microsoft Sentinel data lake overview
    url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-lake-overview
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
