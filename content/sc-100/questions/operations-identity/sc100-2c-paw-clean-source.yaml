id: sc100-2c-paw-clean-source
objective: "2.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating the privileged access design of Litware, Inc. Administrators use their productivity laptops, which they also use for email and web browsing, to connect to a hardened jump server, from which they manage the domain controllers. A privileged access management (PAM) solution stores the passwords of the Domain Admins accounts and checks them out on request.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez la conception de l'accès privilégié de Litware, Inc. Les administrateurs utilisent leurs ordinateurs portables de productivité, qui leur servent aussi pour la messagerie et la navigation web, pour se connecter à un serveur de rebond renforcé, depuis lequel ils gèrent les contrôleurs de domaine. Une solution de gestion des accès privilégiés (PAM) stocke les mots de passe des comptes Domain Admins et les délivre à la demande.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The hardened jump server protects the domain controllers even if an administrator's laptop is compromised."
        fr: "Le serveur de rebond renforcé protège les contrôleurs de domaine même si l'ordinateur portable d'un administrateur est compromis."
    - id: s2
      text:
        en: "An attacker who controls an administrator's laptop can use a checked-out Domain Admins credential while the administrator is signed in."
        fr: "Un attaquant qui contrôle l'ordinateur portable d'un administrateur peut utiliser une information d'identification Domain Admins délivrée pendant que l'administrateur est connecté."
    - id: s3
      text:
        en: "Starting the administrative sessions from privileged access workstations instead of the laptops applies the clean source principle to the design."
        fr: "Démarrer les sessions d'administration depuis des stations de travail à accès privilégié au lieu des ordinateurs portables applique le principe de la source propre à la conception."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The security of a privileged session is limited by the device it starts from: an attacker who controls that device can impersonate the user or steal credentials, which defeats the protections of intermediaries such as jump servers. PAM solutions don't address device compromise either, because the credentials are usable on the workstation while the user is signed in. The clean source starts at a privileged access workstation.
    fr: |
      La sécurité d'une session privilégiée est limitée par l'appareil d'où elle part : un attaquant qui contrôle cet appareil peut usurper l'identité de l'utilisateur ou voler ses informations d'identification, ce qui annule les protections des intermédiaires comme les serveurs de rebond. Les solutions PAM ne traitent pas non plus la compromission de l'appareil, car les informations d'identification sont utilisables sur la station pendant que l'utilisateur est connecté. La source propre commence à une station de travail à accès privilégié.
  options:
    s1:
      en: "The attacker rides the administrator's session from the compromised laptop through the jump server."
      fr: "L'attaquant emprunte la session de l'administrateur depuis l'ordinateur portable compromis à travers le serveur de rebond."
references:
  - title: Securing privileged access intermediaries
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-intermediaries
  - title: Why are privileged access devices important
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-devices
