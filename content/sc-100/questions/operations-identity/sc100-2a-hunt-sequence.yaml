id: sc100-2a-hunt-sequence
objective: "2.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is designing a threat hunting workflow for its SOC, which uses Microsoft Sentinel. Each hunt must be traceable and must improve the detections when it finds malicious activity.

    You need to recommend the sequence of a hunt.

    Which four actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso, Ltd. conçoit un workflow de repérage des menaces pour son SOC, qui utilise Microsoft Sentinel. Chaque repérage doit être traçable et doit améliorer les détections quand il trouve une activité malveillante.

    Vous devez recommander la séquence d'un repérage.

    Quelles sont les quatre actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: hypo, text: { en: "Define a hypothesis from threat intelligence or a MITRE ATT&CK technique.", fr: "Définir une hypothèse à partir du renseignement sur les menaces ou d'une technique MITRE ATT&CK." } }
    - { id: query, text: { en: "Run hunting queries against the relevant data.", fr: "Exécuter des requêtes de repérage sur les données pertinentes." } }
    - { id: bookmark, text: { en: "Bookmark the suspicious results with notes and tags.", fr: "Créer des signets sur les résultats suspects avec des notes et des étiquettes." } }
    - { id: rule, text: { en: "Create an analytics rule from the query that found the activity.", fr: "Créer une règle d'analyse à partir de la requête qui a trouvé l'activité." } }
    - { id: close, text: { en: "Close the related incidents as benign positives.", fr: "Fermer les incidents associés comme positifs bénins." } }
    - { id: retention, text: { en: "Reduce the retention of the tables that were queried.", fr: "Réduire la rétention des tables interrogées." } }
answer:
  sequence: [ hypo, query, bookmark, rule ]
explanation:
  correct:
    en: |
      A hunt starts with a hypothesis, for example from the MITRE map or threat intelligence, then runs queries and bookmarks the interesting results so that they're preserved and can be escalated to incidents. When the hunt confirms malicious activity, the query becomes an analytics rule so that the behavior is detected automatically afterward.
    fr: |
      Un repérage commence par une hypothèse, par exemple issue de la carte MITRE ou du renseignement sur les menaces, puis exécute des requêtes et crée des signets sur les résultats intéressants afin de les conserver et de pouvoir les escalader en incidents. Quand le repérage confirme une activité malveillante, la requête devient une règle d'analyse afin que le comportement soit ensuite détecté automatiquement.
  options:
    close:
      en: |
        Malicious activity found by a hunt isn't a benign positive; closing incidents isn't a step of the hunt.
      fr: |
        Une activité malveillante trouvée par un repérage n'est pas un positif bénin ; fermer des incidents n'est pas une étape du repérage.
    retention:
      en: |
        Reducing retention removes the data that future hunts and investigations need.
      fr: |
        Réduire la rétention supprime les données dont les repérages et investigations futurs ont besoin.
references:
  - title: Threat hunting in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/hunting
