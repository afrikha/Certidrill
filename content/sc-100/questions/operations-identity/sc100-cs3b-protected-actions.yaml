id: sc100-cs3b-protected-actions
objective: "2.2.5"
type: single
caseStudy: sc100-cs3b-fabrikam-freight
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a solution that meets the administration requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui respecte les exigences relatives à l'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Require an authentication context on PIM activation of the Conditional Access Administrator and Global Administrator roles, and require phishing-resistant MFA for that context", fr: "Exiger un contexte d'authentification lors de l'activation PIM des rôles Conditional Access Administrator et Global Administrator, et exiger une MFA résistante au hameçonnage pour ce contexte" } }
    - { id: b, text: { en: "Assign an authentication context to the permissions as protected actions, and require phishing-resistant MFA for that context in a Conditional Access policy", fr: "Attribuer un contexte d'authentification aux autorisations en tant qu'actions protégées, et exiger une MFA résistante au hameçonnage pour ce contexte dans une stratégie d'accès conditionnel" } }
    - { id: c, text: { en: "Create a Conditional Access policy that targets Microsoft Admin Portals and requires the phishing-resistant MFA authentication strength", fr: "Créer une stratégie d'accès conditionnel qui cible Microsoft Admin Portals et exige la force d'authentification MFA résistante au hameçonnage" } }
    - { id: d, text: { en: "Create a Conditional Access policy that targets the three directory roles for all resources and requires the phishing-resistant MFA authentication strength", fr: "Créer une stratégie d'accès conditionnel qui cible les trois rôles d'annuaire pour toutes les ressources et exige la force d'authentification MFA résistante au hameçonnage" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Protected actions assign Conditional Access policies, through an authentication context, to high-impact Microsoft Entra permissions such as Conditional Access policy management and the permanent deletion of directory objects. The policy is enforced when the administrator performs the action, not at sign-in or role activation, and independently of the role that grants the permission.
    fr: |-
      Les actions protégées attribuent des stratégies d'accès conditionnel, via un contexte d'authentification, à des autorisations Microsoft Entra à fort impact comme la gestion des stratégies d'accès conditionnel et la suppression définitive d'objets d'annuaire. La stratégie est appliquée quand l'administrateur effectue l'action, pas lors de la connexion ni de l'activation du rôle, et quel que soit le rôle qui accorde l'autorisation.
  options:
    a:
      en: |-
        PIM activation policies are enforced when the role is activated, not when the action is performed, and they don't cover the Security Administrator role, which can also manage Conditional Access policies.
      fr: |-
        Les stratégies d'activation PIM sont appliquées lors de l'activation du rôle, pas au moment de l'action, et elles ne couvrent pas le rôle Security Administrator, qui peut aussi gérer les stratégies d'accès conditionnel.
    c:
      en: |-
        A policy on Microsoft Admin Portals prompts administrators when they sign in to the portals, whatever task they perform, which the requirements forbid.
      fr: |-
        Une stratégie sur Microsoft Admin Portals sollicite les administrateurs lors de leur connexion aux portails, quelle que soit la tâche effectuée, ce que les exigences interdisent.
    d:
      en: |-
        A policy that targets the directory roles is evaluated at sign-in for every resource, so administrators are prompted for all their tasks.
      fr: |-
        Une stratégie qui cible les rôles d'annuaire est évaluée à la connexion pour toutes les ressources : les administrateurs sont donc sollicités pour toutes leurs tâches.
references:
  - title: What are protected actions in Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/protected-actions-overview
