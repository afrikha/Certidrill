id: sc100-2a-triage-role
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is designing the roles of its SOC, which uses Microsoft Sentinel. The tier-1 analysts triage incidents: they assign incidents, change their status and severity, and close them.

    The tier-1 analysts must not be able to create or edit analytics rules or install content hub solutions. The design must follow the principle of least privilege.

    Which role should you recommend for the tier-1 analysts on the Sentinel workspace?
  fr: |
    Tailspin Toys conçoit les rôles de son SOC, qui utilise Microsoft Sentinel. Les analystes de niveau 1 trient les incidents : ils attribuent les incidents, changent leur état et leur gravité, et les ferment.

    Les analystes de niveau 1 ne doivent pas pouvoir créer ni modifier des règles d'analyse ni installer des solutions du hub de contenu. La conception doit respecter le principe du moindre privilège.

    Quel rôle devez-vous recommander pour les analystes de niveau 1 sur l'espace de travail Sentinel ?
body:
  options:
    - { id: a, text: Microsoft Sentinel Reader }
    - { id: b, text: Microsoft Sentinel Contributor }
    - { id: c, text: Microsoft Sentinel Responder }
    - { id: d, text: Microsoft Sentinel Playbook Operator }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft Sentinel Responder has all the Reader permissions plus the management of incidents, which covers assignment, status, severity and closing. It doesn't allow creating or editing analytics rules or managing the content hub.
    fr: |
      Microsoft Sentinel Responder dispose de toutes les autorisations de Reader, plus la gestion des incidents, ce qui couvre l'attribution, l'état, la gravité et la fermeture. Il ne permet ni de créer ou modifier des règles d'analyse ni de gérer le hub de contenu.
  options:
    a:
      en: |
        Microsoft Sentinel Reader can view incidents but can't manage them.
      fr: |
        Microsoft Sentinel Reader peut consulter les incidents mais pas les gérer.
    b:
      en: |
        Microsoft Sentinel Contributor adds the creation and editing of analytics rules and content hub management, which the tier-1 analysts must not have.
      fr: |
        Microsoft Sentinel Contributor ajoute la création et la modification des règles d'analyse et la gestion du hub de contenu, que les analystes de niveau 1 ne doivent pas avoir.
    d:
      en: |
        Microsoft Sentinel Playbook Operator lets users list, view and manually run playbooks; it doesn't grant incident management.
      fr: |
        Microsoft Sentinel Playbook Operator permet de lister, consulter et exécuter manuellement des playbooks ; il n'accorde pas la gestion des incidents.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
