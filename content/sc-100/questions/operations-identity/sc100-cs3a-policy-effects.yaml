id: sc100-cs3a-policy-effects
objective: "2.4.3"
type: dropdown
caseStudy: sc100-cs3a-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You are designing the Azure Policy definitions that meet the governance requirements.

    Which effect should each policy definition use? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les définitions Azure Policy qui respectent les exigences de gouvernance.

    Quel effet chaque définition de stratégie doit-elle utiliser ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Storage accounts with public network access: [[storage]]

      Diagnostic settings of new Key Vaults: [[vault]]

      CostCenter tag on every resource: [[tag]]
    fr: |
      Comptes de stockage avec accès réseau public : [[storage]]

      Paramètres de diagnostic des nouveaux coffres Key Vault : [[vault]]

      Étiquette CostCenter sur chaque ressource : [[tag]]
  slots:
    - id: storage
      options:
        - { id: audit, text: Audit }
        - { id: deny, text: Deny }
        - { id: dine, text: DeployIfNotExists }
        - { id: modify, text: Modify }
        - { id: append, text: Append }
    - id: vault
      options:
        - { id: audit, text: AuditIfNotExists }
        - { id: deny, text: Deny }
        - { id: dine, text: DeployIfNotExists }
        - { id: modify, text: Modify }
        - { id: append, text: Append }
    - id: tag
      options:
        - { id: audit, text: Audit }
        - { id: deny, text: Deny }
        - { id: dine, text: DeployIfNotExists }
        - { id: modify, text: Modify }
        - { id: append, text: Append }
answer:
  values: { storage: deny, vault: dine, tag: modify }
explanation:
  correct:
    en: |-
      Deny rejects the create or update request of a storage account that doesn't comply, which Audit only reports. DeployIfNotExists deploys a related resource, such as a diagnostic setting, when it doesn't exist. Modify adds or changes properties such as tags, and with DeployIfNotExists it's one of the two effects that remediation tasks can apply to existing non-compliant resources; Append can't be remediated.
    fr: |-
      Deny rejette la requête de création ou de mise à jour d'un compte de stockage non conforme, alors qu'Audit se contente de la signaler. DeployIfNotExists déploie une ressource associée, comme un paramètre de diagnostic, quand elle n'existe pas. Modify ajoute ou modifie des propriétés comme les étiquettes ; avec DeployIfNotExists, c'est l'un des deux effets que les tâches de correction peuvent appliquer aux ressources existantes non conformes, ce qui n'est pas le cas d'Append.
  options:
    audit:
      en: |-
        Audit and AuditIfNotExists only log non-compliance; they don't block, deploy or modify anything.
      fr: |-
        Audit et AuditIfNotExists ne font que consigner la non-conformité ; ils ne bloquent, ne déploient ni ne modifient rien.
references:
  - title: Remediate non-compliant resources
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
