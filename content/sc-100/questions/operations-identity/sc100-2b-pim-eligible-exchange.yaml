id: sc100-2b-pim-eligible-exchange
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has Microsoft Entra ID P2 licenses. Six messaging administrators hold a permanent assignment of the Exchange Administrator role, although they use it a few hours per week.

    You need to recommend a solution so that the role is usable only when needed, for at most four hours at a time, after MFA and a justification. Security officers must be notified when the role is activated.

    What should you recommend?
  fr: |
    Tailspin Toys dispose de licences Microsoft Entra ID P2. Six administrateurs de la messagerie détiennent une attribution permanente du rôle Exchange Administrator, alors qu'ils ne l'utilisent que quelques heures par semaine.

    Vous devez recommander une solution pour que le rôle ne soit utilisable qu'en cas de besoin, pendant quatre heures au plus à chaque fois, après une MFA et une justification. Les responsables de la sécurité doivent être avertis quand le rôle est activé.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A quarterly access review of the Exchange Administrator role assignments", fr: "Une révision d'accès trimestrielle des attributions du rôle Exchange Administrator" } }
    - { id: b, text: { en: "A Conditional Access policy that requires MFA for the Exchange admin center", fr: "Une stratégie d'accès conditionnel qui exige la MFA pour le centre d'administration Exchange" } }
    - { id: c, text: { en: "Eligible assignments in Privileged Identity Management with activation settings", fr: "Des attributions éligibles dans Privileged Identity Management avec des paramètres d'activation" } }
    - { id: d, text: { en: "A custom role with only the Exchange permissions they use, assigned permanently", fr: "Un rôle personnalisé limité aux autorisations Exchange qu'ils utilisent, attribué de manière permanente" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With an eligible assignment in PIM, administrators activate the role just in time for a limited duration, and the role settings can require MFA and a justification and send notifications on activation. The access expires automatically at the end of the activation.
    fr: |-
      Avec une attribution éligible dans PIM, les administrateurs activent le rôle juste-à-temps pour une durée limitée, et les paramètres du rôle peuvent exiger la MFA et une justification et envoyer des notifications à l'activation. L'accès expire automatiquement à la fin de l'activation.
  options:
    a: { en: "An access review confirms whether the assignment should continue; it doesn't remove the standing access between reviews.", fr: "Une révision d'accès confirme si l'attribution doit continuer ; elle ne supprime pas l'accès permanent entre deux révisions." }
    b: { en: "MFA at sign-in doesn't limit when the role is active; the assignment stays permanent.", fr: "La MFA à la connexion ne limite pas le moment où le rôle est actif ; l'attribution reste permanente." }
    d: { en: "A narrower role reduces the permissions but keeps them active all the time.", fr: "Un rôle plus restreint réduit les autorisations mais les laisse actives en permanence." }
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
