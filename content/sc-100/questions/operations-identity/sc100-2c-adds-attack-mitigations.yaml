id: sc100-2c-adds-attack-mitigations
objective: "2.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is evaluating the resilience of its on-premises Active Directory Domain Services (AD DS) environment. A red team exercise used the techniques in the answer area.

    You need to recommend a mitigation for each technique.

    Which mitigation should you recommend for each technique? To answer, drag the appropriate mitigations to the correct techniques. Each mitigation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation évalue la résilience de son environnement Active Directory Domain Services (AD DS) local. Un exercice de red team a utilisé les techniques de la zone de réponse.

    Vous devez recommander une atténuation pour chaque technique.

    Quelle atténuation devez-vous recommander pour chaque technique ? Pour répondre, faites glisser les atténuations appropriées vers les techniques correspondantes. Chaque atténuation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: laps, text: { en: "Windows LAPS", fr: "Windows LAPS" } }
    - { id: gmsa, text: { en: "Group managed service accounts (gMSA)", fr: "Comptes de service administrés de groupe (gMSA)" } }
    - { id: pwdprot, text: { en: "Microsoft Entra Password Protection for AD DS", fr: "Protection par mot de passe Microsoft Entra pour AD DS" } }
    - { id: paw, text: { en: "Separate administrative accounts used only from privileged access workstations", fr: "Comptes d'administration distincts utilisés uniquement depuis des stations de travail à accès privilégié" } }
    - { id: krbtgt, text: { en: "Reset the krbtgt password twice", fr: "Réinitialiser deux fois le mot de passe krbtgt" } }
  targets:
    - id: t1
      text: { en: "The hash of the local Administrator password, identical on all member servers, is reused to move laterally", fr: "Le hachage du mot de passe Administrateur local, identique sur tous les serveurs membres, est réutilisé pour se déplacer latéralement" }
    - id: t2
      text: { en: "Service tickets for a service account that has a weak, never-changed password are requested and cracked offline", fr: "Des tickets de service d'un compte de service au mot de passe faible et jamais changé sont demandés puis cassés hors ligne" }
    - id: t3
      text: { en: "A few common passwords are tried against thousands of user accounts", fr: "Quelques mots de passe courants sont essayés sur des milliers de comptes d'utilisateur" }
    - id: t4
      text: { en: "Domain Admins credentials are stolen when administrators sign in to user workstations to troubleshoot them", fr: "Des informations d'identification Domain Admins sont volées quand les administrateurs se connectent aux stations des utilisateurs pour les dépanner" }
answer:
  mapping: { t1: laps, t2: gmsa, t3: pwdprot, t4: paw }
explanation:
  correct:
    en: |
      Windows LAPS gives each device its own regularly rotated local administrator password, which stops pass-the-hash with a shared password. A gMSA has a long password that Windows manages and changes automatically, which defeats offline cracking of service tickets. Password Protection blocks weak and banned passwords in AD DS, the passwords that sprays try first. Privileged accounts must never sign in to less trusted hosts: separate admin accounts used from secure admin hosts keep their credentials out of user workstations.
    fr: |
      Windows LAPS donne à chaque appareil son propre mot de passe d'administrateur local renouvelé régulièrement, ce qui empêche le pass-the-hash avec un mot de passe partagé. Un gMSA a un mot de passe long que Windows gère et change automatiquement, ce qui met en échec le cassage hors ligne des tickets de service. La protection par mot de passe bloque dans AD DS les mots de passe faibles et interdits, ceux qu'essaie en premier une pulvérisation. Les comptes privilégiés ne doivent jamais se connecter à des hôtes moins fiables : des comptes d'administration distincts utilisés depuis des hôtes d'administration sécurisés gardent leurs informations d'identification hors des stations des utilisateurs.
  options:
    krbtgt:
      en: "Resetting the krbtgt password twice invalidates forged Golden Tickets after a domain compromise; it doesn't address any of these techniques."
      fr: "Réinitialiser deux fois le mot de passe krbtgt invalide les Golden Tickets forgés après une compromission du domaine ; cela ne traite aucune de ces techniques."
references:
  - title: "Windows LAPS Overview: Manage Admin Passwords"
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview
  - title: Best practices for securing Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
