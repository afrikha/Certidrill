id: sc100-2a-compliant-network-license
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has Microsoft Entra ID P1 licenses for all users and no other Microsoft Entra licenses. A Conditional Access policy currently allows access to Exchange Online and SharePoint Online only from the IP addresses of the offices, which blocks remote employees.

    You need to recommend a replacement that allows access to Exchange Online and SharePoint Online only from managed devices whose traffic goes through Global Secure Access, wherever the employees are, so that stolen tokens can't be used from other networks. The solution must not require additional licenses.

    What should you recommend?
  fr: |
    Tailspin Toys dispose de licences Microsoft Entra ID P1 pour tous les utilisateurs et d'aucune autre licence Microsoft Entra. Une stratégie d'accès conditionnel n'autorise actuellement l'accès à Exchange Online et SharePoint Online que depuis les adresses IP des bureaux, ce qui bloque les employés à distance.

    Vous devez recommander une solution de remplacement qui n'autorise l'accès à Exchange Online et SharePoint Online que depuis des appareils gérés dont le trafic passe par Global Secure Access, où que soient les employés, afin que des jetons volés ne puissent pas être utilisés depuis d'autres réseaux. La solution ne doit pas exiger de licences supplémentaires.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra Internet Access with web content filtering for all users", fr: "Accès Internet Microsoft Entra avec filtrage du contenu web pour tous les utilisateurs" } }
    - { id: b, text: { en: "The Microsoft traffic profile with a compliant network check in Conditional Access", fr: "Le profil de trafic Microsoft avec une vérification de réseau conforme dans l'accès conditionnel" } }
    - { id: c, text: { en: "Microsoft Entra Private Access with a Quick Access definition for Microsoft 365", fr: "Accès privé Microsoft Entra avec une définition Quick Access pour Microsoft 365" } }
    - { id: d, text: { en: "Named locations built from the countries where the employees work", fr: "Des emplacements nommés créés à partir des pays où travaillent les employés" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Internet Access for Microsoft services uses the prepopulated Microsoft traffic forwarding profile, and its features include the compliant network check, which Conditional Access uses to allow access only through Global Secure Access. Microsoft Entra ID P1 or P2 includes Internet Access for Microsoft services, so no additional license is needed.
    fr: |
      Accès Internet pour les services Microsoft utilise le profil de transfert de trafic Microsoft prérempli, et ses fonctionnalités incluent la vérification de réseau conforme, que l'accès conditionnel utilise pour n'autoriser l'accès que par Global Secure Access. Microsoft Entra ID P1 ou P2 inclut Accès Internet pour les services Microsoft : aucune licence supplémentaire n'est donc nécessaire.
  options:
    a:
      en: |
        Internet Access for all apps is a secure web gateway that requires its own license, beyond Microsoft Entra ID P1, and web filtering doesn't restrict where tokens are used.
      fr: |
        Accès Internet pour toutes les applications est une passerelle web sécurisée qui exige sa propre licence, au-delà de Microsoft Entra ID P1, et le filtrage web ne restreint pas l'endroit où les jetons sont utilisés.
    c:
      en: |
        Private Access is for private corporate resources, not Microsoft 365, and it requires its own license.
      fr: |
        Accès privé est destiné aux ressources privées de l'entreprise, pas à Microsoft 365, et il exige sa propre licence.
    d:
      en: |
        Country locations still allow any network inside those countries, including an attacker's, so stolen tokens could be replayed.
      fr: |
        Des emplacements par pays autorisent toujours n'importe quel réseau dans ces pays, y compris celui d'un attaquant : des jetons volés pourraient donc être rejoués.
references:
  - title: What is Global Secure Access?
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access
