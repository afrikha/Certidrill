id: sc100-2a-audit-mail-read
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has Microsoft 365 E5 licenses for all users. An attacker used stolen tokens to access the mailboxes of three executives for two weeks.

    The legal team must know exactly which email messages the attacker opened, including the sensitivity label of each message, to decide which customers to notify.

    Which data source should you recommend for the investigation?
  fr: |
    Northwind Traders dispose de licences Microsoft 365 E5 pour tous les utilisateurs. Un attaquant a utilisé des jetons volés pour accéder aux boîtes aux lettres de trois dirigeants pendant deux semaines.

    L'équipe juridique doit savoir exactement quels e-mails l'attaquant a ouverts, y compris l'étiquette de confidentialité de chaque message, pour décider quels clients avertir.

    Quelle source de données devez-vous recommander pour l'investigation ?
body:
  options:
    - { id: a, text: { en: "The message trace of Exchange Online", fr: "Le suivi des messages d'Exchange Online" } }
    - { id: b, text: { en: "The Microsoft Entra sign-in logs of the executives", fr: "Les journaux de connexion Microsoft Entra des dirigeants" } }
    - { id: c, text: { en: "The MailItemsAccessed events of Audit (Premium)", fr: "Les événements MailItemsAccessed d'Audit (Premium)" } }
    - { id: d, text: { en: "The email entity pages of Defender for Office 365", fr: "Les pages d'entité e-mail de Defender for Office 365" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      MailItemsAccessed is an intelligent insight of Audit (Premium): it records access to mail items, and its SensitivityLabel property shows the label of the accessed message. This is the record that tells investigators which messages were read in a compromised mailbox. The E5 licenses include Audit (Premium).
    fr: |
      MailItemsAccessed est une information intelligente d'Audit (Premium) : il enregistre l'accès aux éléments de messagerie, et sa propriété SensitivityLabel indique l'étiquette du message consulté. C'est l'enregistrement qui indique aux enquêteurs quels messages ont été lus dans une boîte aux lettres compromise. Les licences E5 incluent Audit (Premium).
  options:
    a:
      en: |
        Message trace follows the delivery of messages through Exchange Online; it doesn't record which messages were opened in a mailbox.
      fr: |
        Le suivi des messages suit l'acheminement des messages dans Exchange Online ; il n'enregistre pas quels messages ont été ouverts dans une boîte aux lettres.
    b:
      en: |
        Sign-in logs show when and from where tokens were issued, not which mail items were read with them.
      fr: |
        Les journaux de connexion indiquent quand et d'où les jetons ont été émis, pas quels éléments de messagerie ont été lus avec eux.
    d:
      en: |
        Email entity pages describe a message's delivery, threats and actions taken by Defender for Office 365; they don't list the items an attacker opened.
      fr: |
        Les pages d'entité e-mail décrivent la remise d'un message, ses menaces et les actions prises par Defender for Office 365 ; elles ne listent pas les éléments ouverts par un attaquant.
references:
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
