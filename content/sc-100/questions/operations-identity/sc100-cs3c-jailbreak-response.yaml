id: sc100-cs3c-jailbreak-response
objective: "2.1.4"
type: single
caseStudy: sc100-cs3c-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a solution that meets the incident response requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui respecte les exigences relatives à la réponse aux incidents.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An automation rule with the alert created trigger that assigns the owner and runs a playbook based on the incident trigger", fr: "Une règle d'automatisation avec le déclencheur de création d'alerte qui attribue le propriétaire et exécute un playbook basé sur le déclencheur d'incident" } }
    - { id: b, text: { en: "An automation rule with the incident created trigger that assigns the owner and runs a playbook based on the incident trigger", fr: "Une règle d'automatisation avec le déclencheur de création d'incident qui attribue le propriétaire et exécute un playbook basé sur le déclencheur d'incident" } }
    - { id: c, text: { en: "A playbook based on the incident trigger that assigns the owner and revokes the sessions, run manually by the analysts", fr: "Un playbook basé sur le déclencheur d'incident qui attribue le propriétaire et révoque les sessions, exécuté manuellement par les analystes" } }
    - { id: d, text: { en: "An automation rule with the incident updated trigger that adds a task asking the analyst to revoke the sessions", fr: "Une règle d'automatisation avec le déclencheur de mise à jour d'incident qui ajoute une tâche demandant à l'analyste de révoquer les sessions" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An automation rule that runs when an incident is created can filter on the analytics rule, assign the owner with a built-in action and then run a playbook for the action that needs another service, such as revoking sessions in Microsoft Entra ID. Incident-trigger automation rules can run only incident-trigger playbooks, which is the recommended trigger for most playbooks.
    fr: |-
      Une règle d'automatisation exécutée à la création d'un incident peut filtrer sur la règle d'analyse, attribuer le propriétaire avec une action intégrée, puis exécuter un playbook pour l'action qui nécessite un autre service, comme la révocation des sessions dans Microsoft Entra ID. Les règles d'automatisation à déclencheur d'incident ne peuvent exécuter que des playbooks à déclencheur d'incident, le déclencheur recommandé pour la plupart des playbooks.
  options:
    a:
      en: |-
        Alert-trigger automation rules can run only alert-trigger playbooks, not incident-trigger playbooks. The owner is also a property of the incident, not of the alert.
      fr: |-
        Les règles d'automatisation à déclencheur d'alerte ne peuvent exécuter que des playbooks à déclencheur d'alerte, pas des playbooks à déclencheur d'incident. Le propriétaire est en outre une propriété de l'incident, pas de l'alerte.
    c:
      en: |-
        A playbook that analysts run manually doesn't meet the requirement to assign and revoke automatically.
      fr: |-
        Un playbook exécuté manuellement par les analystes ne respecte pas l'exigence d'attribution et de révocation automatiques.
    d:
      en: |-
        An incident task only reminds the analyst to act; the sessions aren't revoked automatically, and the owner isn't assigned.
      fr: |-
        Une tâche d'incident ne fait que rappeler à l'analyste d'agir ; les sessions ne sont pas révoquées automatiquement et le propriétaire n'est pas attribué.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
