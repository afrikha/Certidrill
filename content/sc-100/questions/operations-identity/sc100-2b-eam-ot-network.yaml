id: sc100-2b-eam-ot-network
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is mapping its privileged access to the enterprise access model. Its factories use legacy operational technology (OT) controllers that can't authenticate with Microsoft Entra ID or AD DS. Access to these controllers is restricted only by firewall rules on an industrial network segment, and a small OT network team manages these rules.

    You need to classify the management of these firewall rules so that the team's accounts and devices get the appropriate level of protection.

    In which part of the enterprise access model should you classify it?
  fr: |
    Fabrikam, Inc. fait correspondre son accès privilégié au modèle d'accès d'entreprise. Ses usines utilisent des contrôleurs de technologie opérationnelle (OT) hérités qui ne peuvent pas s'authentifier avec Microsoft Entra ID ni AD DS. L'accès à ces contrôleurs n'est limité que par des règles de pare-feu sur un segment de réseau industriel, et une petite équipe réseau OT gère ces règles.

    Vous devez classer la gestion de ces règles de pare-feu pour que les comptes et appareils de l'équipe reçoivent le niveau de protection approprié.

    Dans quelle partie du modèle d'accès d'entreprise devez-vous la classer ?
body:
  options:
    - { id: a, text: { en: "Control plane", fr: "Plan de contrôle" } }
    - { id: b, text: { en: "Management plane", fr: "Plan de gestion" } }
    - { id: c, text: { en: "Data/workload plane", fr: "Plan des données/charges de travail" } }
    - { id: d, text: { en: "App access", fr: "Accès aux applications" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The control plane provides consistent access control across the enterprise, based on centralized identity systems, and includes network access control where it is the only or best option, as for legacy OT. The firewall rules are the only access control of these controllers, so the team that manages them operates at control plane level.
    fr: |-
      Le plan de contrôle fournit un contrôle d'accès cohérent dans toute l'entreprise, fondé sur des systèmes d'identité centralisés, et inclut le contrôle d'accès réseau quand c'est la seule ou la meilleure option, comme pour l'OT hérité. Les règles de pare-feu sont le seul contrôle d'accès de ces contrôleurs : l'équipe qui les gère opère au niveau du plan de contrôle.
  options:
    b: { en: "The management plane covers IT management of workloads and their infrastructure, not the access control that protects them.", fr: "Le plan de gestion couvre la gestion informatique des charges de travail et de leur infrastructure, pas le contrôle d'accès qui les protège." }
    c: { en: "The data/workload plane holds business processes and data; managing the only access control of a system is higher in the hierarchy.", fr: "Le plan des données/charges de travail contient les processus métier et les données ; gérer le seul contrôle d'accès d'un système se situe plus haut dans la hiérarchie." }
    d: { en: "App access describes programmatic access through APIs, not administration of access control.", fr: "L'accès aux applications décrit l'accès programmatique par des API, pas l'administration du contrôle d'accès." }
references:
  - title: Enterprise access model
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model
