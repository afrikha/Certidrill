id: sc100-sr1-server-events-1
objective: "2.1.3"
type: series_yesno
series: sc100-sr1-server-events
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You recommend Azure Arc, the Azure Monitor Agent, and a data collection rule.
  fr: Vous recommandez Azure Arc, l'agent Azure Monitor et une règle de collecte de données.
body:
  solution:
    en: |
      You recommend onboarding all the on-premises servers and EC2 instances to **Azure Arc-enabled servers**. In Microsoft Sentinel, you configure the **Windows Security Events via AMA** connector, which deploys the **Azure Monitor Agent** to the Azure Arc-enabled servers and associates them with a **data collection rule** that sends the selected events to LAW-SOC.
    fr: |
      Vous recommandez d'intégrer tous les serveurs locaux et toutes les instances EC2 à **Azure Arc-enabled servers**. Dans Microsoft Sentinel, vous configurez le connecteur **Windows Security Events via AMA**, qui déploie l'**agent Azure Monitor** sur les serveurs avec Azure Arc et les associe à une **règle de collecte de données** qui envoie les événements sélectionnés à LAW-SOC.
answer: { value: true }
explanation:
  correct:
    en: The Azure Monitor Agent is the supported agent for guest OS data, and a machine outside Azure must have Azure Arc installed before the AMA-based connector can collect its events. The data collection rule defines in Azure which events every associated server sends, whatever its location.
    fr: "L'agent Azure Monitor est l'agent pris en charge pour les données du système d'exploitation invité, et une machine hors d'Azure doit disposer d'Azure Arc avant que le connecteur basé sur l'AMA puisse collecter ses événements. La règle de collecte de données définit dans Azure les événements que chaque serveur associé envoie, quel que soit son emplacement."
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
  - title: Azure Monitor Agent overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview
