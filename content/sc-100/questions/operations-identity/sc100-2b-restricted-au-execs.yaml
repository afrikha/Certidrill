id: sc100-2b-restricted-au-execs
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank wants to protect the Microsoft Entra accounts and devices of its 40 executives. Only a three-person executive support team must be able to reset their passwords, change their properties and access their BitLocker recovery keys.

    Administrators who hold tenant-wide roles, including User Administrator and Global Administrator, must not be able to modify these accounts by default, and any change to this protection must be auditable. The support team's role assignments must follow least privilege.

    What should you recommend?
  fr: |
    Woodgrove Bank veut protéger les comptes et appareils Microsoft Entra de ses 40 dirigeants. Seule une équipe de support des dirigeants de trois personnes doit pouvoir réinitialiser leurs mots de passe, modifier leurs propriétés et accéder à leurs clés de récupération BitLocker.

    Les administrateurs qui détiennent des rôles à l'échelle du locataire, dont User Administrator et Global Administrator, ne doivent pas pouvoir modifier ces comptes par défaut, et toute modification de cette protection doit être auditable. Les attributions de rôle de l'équipe de support doivent respecter le privilège minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An administrative unit for the executives, with roles assigned to the support team at its scope", fr: "Une unité administrative pour les dirigeants, avec des rôles attribués à l'équipe de support à son étendue" } }
    - { id: b, text: { en: "A restricted management administrative unit for the executives, with roles assigned to the support team at its scope", fr: "Une unité administrative de gestion restreinte pour les dirigeants, avec des rôles attribués à l'équipe de support à son étendue" } }
    - { id: c, text: { en: "A role-assignable group that contains the executives, with the support team assigned as group owners", fr: "Un groupe assignable à un rôle qui contient les dirigeants, avec l'équipe de support désignée comme propriétaire du groupe" } }
    - { id: d, text: { en: "A protected action on user management permissions, with a policy that targets the support team", fr: "Une action protégée sur les autorisations de gestion des utilisateurs, avec une stratégie qui cible l'équipe de support" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In a restricted management administrative unit, only administrators with a role assigned at the scope of that unit can modify its users, devices and security groups; tenant-level roles such as User Administrator and Global Administrator are blocked. A Global Administrator can assign themselves a role at that scope, but it is an auditable event. Note that governance features such as PIM and access reviews can't manage restricted users.
    fr: |-
      Dans une unité administrative de gestion restreinte, seuls les administrateurs qui ont un rôle attribué à l'étendue de cette unité peuvent modifier ses utilisateurs, appareils et groupes de sécurité ; les rôles au niveau du locataire comme User Administrator et Global Administrator sont bloqués. Un Global Administrator peut s'attribuer un rôle à cette étendue, mais c'est un événement auditable. À noter : les fonctionnalités de gouvernance comme PIM et les révisions d'accès ne peuvent pas gérer les utilisateurs restreints.
  options:
    a: { en: "A regular administrative unit scopes the support team's roles, but tenant-level administrators keep their permissions on the executives.", fr: "Une unité administrative ordinaire limite les rôles de l'équipe de support, mais les administrateurs au niveau du locataire gardent leurs autorisations sur les dirigeants." }
    c: { en: "Group owners manage membership, not the members' accounts; Global Administrators would still be able to modify the executives.", fr: "Les propriétaires d'un groupe gèrent son appartenance, pas les comptes des membres ; les Global Administrators pourraient toujours modifier les dirigeants." }
    d: { en: "Protected actions require a Conditional Access policy when a permission is used; Microsoft advises against using them to restrict who can act, which is the role of role assignments.", fr: "Les actions protégées exigent une stratégie d'accès conditionnel quand une autorisation est utilisée ; Microsoft déconseille de s'en servir pour restreindre qui peut agir, ce qui est le rôle des attributions de rôle." }
references:
  - title: Restricted management administrative units in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/admin-units-restricted-management
