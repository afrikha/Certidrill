id: sc100-2c-mdc-standards-evaluation
objective: "2.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has Azure subscriptions in Microsoft Defender for Cloud. The only paid plan enabled is Defender for Servers Plan 1. The compliance team wants to validate the alignment of the subscriptions with PCI DSS v4.0.1 by using the regulatory compliance dashboard.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'abonnements Azure dans Microsoft Defender pour le cloud. Le seul plan payant activé est Defender for Servers Plan 1. L'équipe de conformité veut valider l'alignement des abonnements sur PCI DSS v4.0.1 à l'aide du tableau de bord de conformité réglementaire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Controls that Defender for Cloud can't assess automatically appear greyed out in the dashboard."
        fr: "Les contrôles que Defender pour le cloud ne peut pas évaluer automatiquement apparaissent grisés dans le tableau de bord."
    - id: s2
      text:
        en: "The regulatory standards assigned to the Azure subscriptions are implemented as Azure Policy initiatives."
        fr: "Les normes réglementaires attribuées aux abonnements Azure sont implémentées sous forme d'initiatives Azure Policy."
    - id: s3
      text:
        en: "With the plans currently enabled, Northwind can add the PCI DSS v4.0.1 standard to the dashboard."
        fr: "Avec les plans actuellement activés, Northwind peut ajouter la norme PCI DSS v4.0.1 au tableau de bord."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Defender for Cloud continuously assesses the controls that can be checked automatically; the others are greyed out because it can't determine their compliance. Regulatory compliance standards use Azure Policy initiatives. To add a standard, any Defender for Cloud plan qualifies except Defender for Servers Plan 1 and Defender for APIs Plan 1, so Northwind must enable another plan, such as Defender CSPM.
    fr: |
      Defender pour le cloud évalue en continu les contrôles vérifiables automatiquement ; les autres sont grisés car il ne peut pas déterminer leur conformité. Les normes de conformité réglementaire utilisent des initiatives Azure Policy. Pour ajouter une norme, tout plan Defender pour le cloud convient sauf Defender for Servers Plan 1 et Defender for APIs Plan 1 : Northwind doit activer un autre plan, comme Defender CSPM.
  options:
    s3:
      en: "Defender for Servers Plan 1 doesn't give access to the compliance standards beyond the defaults."
      fr: "Defender for Servers Plan 1 ne donne pas accès aux normes de conformité au-delà des normes par défaut."
references:
  - title: Assign regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages
  - title: Regulatory compliance in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
