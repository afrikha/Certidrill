id: sc100-2c-paw-device-profiles
objective: "2.3.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is adopting the Microsoft privileged access device profiles. Devices are managed by Microsoft Intune and protected by Microsoft Defender for Endpoint.

    You need to assign a device profile to each group of users in the answer area. The profile must match the impact of a compromise of the users' accounts.

    Which profile should you assign to each group? To answer, drag the appropriate profiles to the correct groups. Each profile may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation adopte les profils d'appareils d'accès privilégié de Microsoft. Les appareils sont gérés par Microsoft Intune et protégés par Microsoft Defender for Endpoint.

    Vous devez attribuer un profil d'appareil à chaque groupe d'utilisateurs de la zone de réponse. Le profil doit correspondre à l'impact d'une compromission des comptes des utilisateurs.

    Quel profil devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les profils appropriés vers les groupes correspondants. Chaque profil peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: ent, text: { en: "Enterprise", fr: "Entreprise" } }
    - { id: spec, text: { en: "Specialized", fr: "Spécialisé" } }
    - { id: priv, text: { en: "Privileged access workstation (PAW)", fr: "Station de travail à accès privilégié (PAW)" } }
    - { id: byod, text: { en: "Personal device enrolled by the user", fr: "Appareil personnel inscrit par l'utilisateur" } }
  targets:
    - id: t1
      text: { en: "Global Administrators of the Microsoft Entra tenant", fr: "Les Global Administrators du locataire Microsoft Entra" }
    - id: t2
      text: { en: "General developers who install their own tools and browse the web", fr: "Les développeurs généralistes qui installent leurs propres outils et naviguent sur le web" }
    - id: t3
      text: { en: "Payment operators who need email and web access, but must run only applications that IT installs, without local administrator rights", fr: "Les opérateurs de paiement qui ont besoin de la messagerie et du web, mais ne doivent exécuter que les applications installées par l'informatique, sans droits d'administrateur local" }
    - id: t4
      text: { en: "Members of the Domain Admins group", fr: "Les membres du groupe Domain Admins" }
answer:
  mapping: { t1: priv, t2: ent, t3: spec, t4: priv }
explanation:
  correct:
    en: |
      The PAW profile is for roles whose compromise would materially affect the organization, such as Global Administrators and Domain Admins; it blocks email and general browsing, so they use separate accounts and devices for productivity. The enterprise profile lets users run their own applications and browse, with an EDR such as Defender for Endpoint. The specialized profile removes local administrator rights and allows only applications installed by an administrator, while keeping email and browsing.
    fr: |
      Le profil PAW s'adresse aux rôles dont la compromission affecterait sensiblement l'organisation, comme les Global Administrators et les Domain Admins ; il bloque la messagerie et la navigation générale, donc ces utilisateurs ont des comptes et des appareils distincts pour la productivité. Le profil entreprise permet d'exécuter ses propres applications et de naviguer, avec un EDR comme Defender for Endpoint. Le profil spécialisé retire les droits d'administrateur local et n'autorise que les applications installées par un administrateur, tout en gardant la messagerie et la navigation.
  options:
    byod:
      en: "The specialized and privileged profiles deny BYOD enrollment; a personal device fits none of these groups."
      fr: "Les profils spécialisé et privilégié refusent l'inscription BYOD ; un appareil personnel ne convient à aucun de ces groupes."
references:
  - title: Why are privileged access devices important
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-devices
