id: sc100-2c-purview-solutions
objective: "2.4.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft 365 E5. The legal and compliance teams submitted the requirements in the answer area.

    Which Microsoft Purview solution should you recommend for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft 365 E5. Les équipes juridique et conformité ont soumis les exigences de la zone de réponse.

    Quelle solution Microsoft Purview devez-vous recommander pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Preserve and collect the mailboxes and OneDrive content of the employees named in a lawsuit: [[legal]]

      Detect threatening or harassing language in Teams messages: [[conduct]]

      Encrypt documents classified Highly Confidential, including after they're shared outside the organization: [[protect]]
    fr: |
      Conserver et collecter les boîtes aux lettres et le contenu OneDrive des employés cités dans un procès : [[legal]]

      Détecter les propos menaçants ou harcelants dans les messages Teams : [[conduct]]

      Chiffrer les documents classés Highly Confidential, y compris après leur partage hors de l'organisation : [[protect]]
  slots:
    - id: legal
      options:
        - { id: ediscovery, text: "eDiscovery" }
        - { id: commcomp, text: "Communication Compliance" }
        - { id: mip, text: { en: "Information Protection (sensitivity labels)", fr: "Information Protection (étiquettes de confidentialité)" } }
        - { id: dlm, text: "Data Lifecycle Management" }
        - { id: irm, text: "Insider Risk Management" }
    - id: conduct
      options:
        - { id: ediscovery, text: "eDiscovery" }
        - { id: commcomp, text: "Communication Compliance" }
        - { id: mip, text: { en: "Information Protection (sensitivity labels)", fr: "Information Protection (étiquettes de confidentialité)" } }
        - { id: dlm, text: "Data Lifecycle Management" }
        - { id: irm, text: "Insider Risk Management" }
    - id: protect
      options:
        - { id: ediscovery, text: "eDiscovery" }
        - { id: commcomp, text: "Communication Compliance" }
        - { id: mip, text: { en: "Information Protection (sensitivity labels)", fr: "Information Protection (étiquettes de confidentialité)" } }
        - { id: dlm, text: "Data Lifecycle Management" }
        - { id: irm, text: "Insider Risk Management" }
answer:
  values: { legal: ediscovery, conduct: commcomp, protect: mip }
explanation:
  correct:
    en: |
      eDiscovery places holds on the custodians' mailboxes and OneDrive accounts and collects their content for the case. Communication Compliance uses machine learning classifiers to detect threats, harassment and discrimination in Teams and Exchange messages. Sensitivity labels with encryption protect documents wherever they go, so the protection stays after the file leaves the organization.
    fr: |
      eDiscovery place des conservations sur les boîtes aux lettres et les comptes OneDrive des dépositaires et collecte leur contenu pour le dossier. Communication Compliance utilise des classifieurs d'apprentissage automatique pour détecter les menaces, le harcèlement et la discrimination dans les messages Teams et Exchange. Les étiquettes de confidentialité avec chiffrement protègent les documents où qu'ils aillent : la protection reste après la sortie du fichier de l'organisation.
  options:
    dlm:
      en: "Data Lifecycle Management retains or deletes content for a set period; it isn't designed to preserve the content of specific people for a lawsuit."
      fr: "Data Lifecycle Management conserve ou supprime du contenu pendant une durée définie ; il n'est pas conçu pour conserver le contenu de personnes précises pour un procès."
    irm:
      en: "Insider Risk Management detects risky activities such as data theft or leaks; it doesn't classify offensive language in messages."
      fr: "Insider Risk Management détecte les activités à risque comme le vol ou la fuite de données ; il ne classe pas les propos offensants dans les messages."
references:
  - title: Learn about Communication Compliance
    url: https://learn.microsoft.com/en-us/purview/communication-compliance
