id: sc100-2c-policy-effects-design
objective: "2.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is designing Azure Policy definitions for the security and compliance requirements in the answer area.

    Which effect should each policy definition use? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank conçoit des définitions Azure Policy pour les exigences de sécurité et de conformité de la zone de réponse.

    Quel effet chaque définition de stratégie doit-elle utiliser ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Nobody can delete the production Log Analytics workspaces: [[del]]

      Report the virtual machines that have no Azure Backup protection, without changing them: [[backup]]

      Record the attestation of a control that requires annual security training for administrators: [[train]]
    fr: |
      Personne ne peut supprimer les espaces de travail Log Analytics de production : [[del]]

      Signaler les machines virtuelles sans protection Sauvegarde Azure, sans les modifier : [[backup]]

      Enregistrer l'attestation d'un contrôle qui exige une formation annuelle à la sécurité pour les administrateurs : [[train]]
  slots:
    - id: del
      options:
        - { id: deny, text: Deny }
        - { id: denyaction, text: DenyAction }
        - { id: audit, text: Audit }
        - { id: manual, text: Manual }
    - id: backup
      options:
        - { id: audit, text: Audit }
        - { id: aine, text: AuditIfNotExists }
        - { id: dine, text: DeployIfNotExists }
        - { id: manual, text: Manual }
    - id: train
      options:
        - { id: audit, text: Audit }
        - { id: aine, text: AuditIfNotExists }
        - { id: manual, text: Manual }
        - { id: disabled, text: Disabled }
answer:
  values: { del: denyaction, backup: aine, train: manual }
explanation:
  correct:
    en: |
      DenyAction blocks a specific action, the delete operation, on matching resources, while Deny blocks create and update requests. AuditIfNotExists flags a resource whose related resource, here the backup protection, is missing, without deploying anything as DeployIfNotExists would. Manual is for controls that Azure Policy can't evaluate, whose compliance is attested by people.
    fr: |
      DenyAction bloque une action précise, l'opération de suppression, sur les ressources concernées, alors que Deny bloque les requêtes de création et de mise à jour. AuditIfNotExists signale une ressource dont la ressource associée, ici la protection de sauvegarde, est absente, sans rien déployer comme le ferait DeployIfNotExists. Manual sert aux contrôles qu'Azure Policy ne peut pas évaluer, dont la conformité est attestée par des personnes.
  options:
    deny:
      en: "Deny evaluates create and update requests; it doesn't block a delete operation."
      fr: "Deny évalue les requêtes de création et de mise à jour ; il ne bloque pas une opération de suppression."
    dine:
      en: "DeployIfNotExists would deploy the backup configuration, which the requirement excludes."
      fr: "DeployIfNotExists déploierait la configuration de sauvegarde, ce que l'exigence exclut."
references:
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
