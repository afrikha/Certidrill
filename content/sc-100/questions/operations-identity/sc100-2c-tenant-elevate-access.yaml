id: sc100-2c-tenant-elevate-access
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a Microsoft Entra tenant and 30 Azure subscriptions organized in a management group hierarchy. Global Administrators occasionally use elevate access to recover control of subscriptions after Owner assignments were removed by mistake.

    The security policy requires that every use of elevate access creates an incident that the security operations team investigates. The Microsoft Entra audit logs are already connected to a Microsoft Sentinel workspace.

    What should you recommend?
  fr: |
    Litware, Inc. dispose d'un locataire Microsoft Entra et de 30 abonnements Azure organisés dans une hiérarchie de groupes d'administration. Les Global Administrators utilisent parfois l'élévation d'accès pour reprendre le contrôle d'abonnements dont les attributions Owner ont été supprimées par erreur.

    La stratégie de sécurité exige que chaque utilisation de l'élévation d'accès crée un incident que l'équipe des opérations de sécurité examine. Les journaux d'audit Microsoft Entra sont déjà connectés à un espace de travail Microsoft Sentinel.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Microsoft Entra ID Protection user risk policy that targets the Global Administrators", fr: "Une stratégie de risque utilisateur Microsoft Entra ID Protection qui cible les Global Administrators" } }
    - { id: b, text: { en: "A weekly access review of the Global Administrator role assignments in Microsoft Entra ID", fr: "Une révision d'accès hebdomadaire des attributions du rôle Global Administrator dans Microsoft Entra ID" } }
    - { id: c, text: { en: "A scheduled analytics rule in Microsoft Sentinel created from the Azure RBAC (Elevate Access) template", fr: "Une règle d'analyse planifiée dans Microsoft Sentinel créée à partir du modèle Azure RBAC (Elevate Access)" } }
    - { id: d, text: { en: "An Azure Policy assignment at the tenant root management group that audits role assignments", fr: "Une attribution Azure Policy au groupe d'administration racine du locataire qui audite les attributions de rôles" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Elevate access assigns the User Access Administrator role at the root scope (/) to the Global Administrator who uses it. The event is recorded in the Microsoft Entra audit logs (service Azure RBAC (Elevated Access)) and in the Azure activity logs. With the audit logs in Sentinel, a scheduled analytics rule from the Azure RBAC (Elevate Access) template turns each elevation into an incident.
    fr: |
      L'élévation d'accès attribue le rôle User Access Administrator à l'étendue racine (/) au Global Administrator qui l'utilise. L'événement est enregistré dans les journaux d'audit Microsoft Entra (service Azure RBAC (Elevated Access)) et dans les journaux d'activité Azure. Avec les journaux d'audit dans Sentinel, une règle d'analyse planifiée issue du modèle Azure RBAC (Elevate Access) transforme chaque élévation en incident.
  options:
    a:
      en: "ID Protection reacts to signs that an account is compromised; a legitimate administrator who elevates access raises no user risk."
      fr: "ID Protection réagit aux signes de compromission d'un compte ; un administrateur légitime qui élève son accès ne génère aucun risque utilisateur."
    b:
      en: "An access review recertifies who holds the role; it doesn't detect each use of elevate access or create an incident."
      fr: "Une révision d'accès recertifie qui détient le rôle ; elle ne détecte pas chaque utilisation de l'élévation d'accès et ne crée pas d'incident."
    d:
      en: "Azure Policy reports resource compliance; it doesn't create security incidents, and the elevated assignment is at the root scope, above the tenant root management group."
      fr: "Azure Policy signale la conformité des ressources ; il ne crée pas d'incidents de sécurité, et l'attribution élevée se situe à l'étendue racine, au-dessus du groupe d'administration racine du locataire."
references:
  - title: Elevate access to manage all Azure subscriptions and management groups
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin
