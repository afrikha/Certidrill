id: sc100-2c-paw-azure-vm-access
objective: "2.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys runs Windows and Linux virtual machines in an Azure hub-and-spoke network. The virtual machines have no public IP addresses. Administrators use privileged access workstations (PAWs).

    You need to recommend a solution that lets the administrators open RDP and SSH sessions from the PAWs to the virtual machines. The solution must not add public IP addresses to the virtual machines or require a VPN, and access must be subject to Conditional Access policies that require the PAWs.

    What should you recommend?
  fr: |
    Tailspin Toys exécute des machines virtuelles Windows et Linux dans un réseau Azure en étoile (hub-and-spoke). Les machines virtuelles n'ont pas d'adresse IP publique. Les administrateurs utilisent des stations de travail à accès privilégié (PAW).

    Vous devez recommander une solution qui permet aux administrateurs d'ouvrir des sessions RDP et SSH depuis les PAW vers les machines virtuelles. La solution ne doit pas ajouter d'adresses IP publiques aux machines virtuelles ni exiger de VPN, et l'accès doit être soumis à des stratégies d'accès conditionnel qui exigent les PAW.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A jump server with a public IP address and a network security group rule that allows RDP from the administrators' IP addresses", fr: "Un serveur de rebond avec une adresse IP publique et une règle de groupe de sécurité réseau qui autorise RDP depuis les adresses IP des administrateurs" } }
    - { id: b, text: { en: "A point-to-site VPN gateway that uses Microsoft Entra authentication", fr: "Une passerelle VPN point à site qui utilise l'authentification Microsoft Entra" } }
    - { id: c, text: { en: "Azure Bastion deployed in the hub virtual network, used from the Azure portal", fr: "Azure Bastion déployé dans le réseau virtuel hub, utilisé depuis le portail Azure" } }
    - { id: d, text: { en: "Microsoft Entra application proxy, with an application published for the RDP port of each virtual machine", fr: "Le proxy d'application Microsoft Entra, avec une application publiée pour le port RDP de chaque machine virtuelle" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Bastion provides RDP and SSH over TLS from the Azure portal (or a native client) to virtual machines by their private IP addresses, with no public IP, agent or VPN. Microsoft's guidance is that the Azure portal sign-in must require the security level of the resources it reaches, here a Conditional Access policy that requires the PAWs.
    fr: |
      Azure Bastion fournit RDP et SSH via TLS depuis le portail Azure (ou un client natif) vers les machines virtuelles par leurs adresses IP privées, sans IP publique, agent ni VPN. Selon les recommandations de Microsoft, la connexion au portail Azure doit exiger le niveau de sécurité des ressources atteintes, ici une stratégie d'accès conditionnel qui exige les PAW.
  options:
    a:
      en: "The jump server adds a public IP address exposed to the internet, and direct RDP from the internet is weakly protected against attacks such as password spray."
      fr: "Le serveur de rebond ajoute une adresse IP publique exposée à Internet, et le RDP direct depuis Internet est mal protégé contre des attaques comme la pulvérisation de mots de passe."
    b:
      en: "The requirements exclude a VPN, and a VPN gives network-level access rather than access to specific servers."
      fr: "Les exigences excluent un VPN, et un VPN donne un accès au niveau réseau plutôt qu'à des serveurs précis."
    d:
      en: "Application proxy publishes web apps and Remote Desktop Services through a gateway, not the raw RDP port of each VM, and it doesn't cover SSH."
      fr: "Le proxy d'application publie des applications web et les services Bureau à distance par une passerelle, pas le port RDP brut de chaque machine virtuelle, et il ne couvre pas SSH."
references:
  - title: What is Azure Bastion?
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
  - title: Securing privileged access intermediaries
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-intermediaries
