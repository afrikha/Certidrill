id: sc100-2b-customer-app-tenant
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank plans a new loyalty app for its retail customers. Woodgrove has never used a customer identity service.

    Customers must create their own accounts by using an email address and a password, a one-time passcode or a Google account. The sign-in pages must show Woodgrove branding without Microsoft branding. Customer accounts must be kept apart from the employee directory.

    What should you recommend?
  fr: |
    Woodgrove Bank prévoit une nouvelle application de fidélité pour ses clients particuliers. Woodgrove n'a jamais utilisé de service d'identité client.

    Les clients doivent créer eux-mêmes leur compte avec une adresse e-mail et un mot de passe, un code secret à usage unique ou un compte Google. Les pages de connexion doivent afficher la marque Woodgrove, sans marque Microsoft. Les comptes clients doivent rester séparés de l'annuaire des employés.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A new Azure AD B2C tenant with custom policies built on the Identity Experience Framework", fr: "Un nouveau locataire Azure AD B2C avec des stratégies personnalisées basées sur Identity Experience Framework" } }
    - { id: b, text: { en: "B2B collaboration in the workforce tenant, with self-service sign-up for guests", fr: "La collaboration B2B dans le locataire de main-d'œuvre, avec l'inscription en libre-service des invités" } }
    - { id: c, text: { en: "An external tenant in Microsoft Entra External ID, with self-service sign-up user flows", fr: "Un locataire externe dans Microsoft Entra External ID, avec des flux d'utilisateurs d'inscription en libre-service" } }
    - { id: d, text: { en: "Microsoft Entra Verified ID credentials issued to customers who sign up", fr: "Des informations d'identification Microsoft Entra Verified ID émises aux clients qui s'inscrivent" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An external tenant is a separate Microsoft Entra tenant for apps published to consumers and business customers. It supports self-service sign-up with email and password, one-time passcodes or social accounts such as Google, and neutral, customizable branding.
    fr: |-
      Un locataire externe est un locataire Microsoft Entra distinct pour les applications publiées à des consommateurs et à des clients professionnels. Il prend en charge l'inscription en libre-service avec e-mail et mot de passe, codes secrets à usage unique ou comptes sociaux comme Google, et une marque neutre et personnalisable.
  options:
    a: { en: "Azure AD B2C is no longer available for new customers to purchase since May 1, 2025.", fr: "Azure AD B2C n'est plus proposé à l'achat aux nouveaux clients depuis le 1er mai 2025." }
    b: { en: "B2B collaboration adds guests to the employee directory with Microsoft default branding; it targets partners, not retail customers.", fr: "La collaboration B2B ajoute des invités dans l'annuaire des employés avec la marque Microsoft par défaut ; elle cible les partenaires, pas les clients particuliers." }
    d: { en: "Verified ID issues and verifies credentials; it doesn't provide customer sign-up and sign-in for an app.", fr: "Verified ID émet et vérifie des informations d'identification ; il ne fournit pas l'inscription et la connexion des clients à une application." }
references:
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
