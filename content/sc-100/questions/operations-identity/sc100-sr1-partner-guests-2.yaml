id: sc100-sr1-partner-guests-2
objective: "2.3.6"
type: series_yesno
series: sc100-sr1-partner-guests
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You recommend a quarterly access review of PRJ-Fabrikam that makes no change when reviewers don't respond.
  fr: Vous recommandez une révision d'accès trimestrielle de PRJ-Fabrikam qui n'apporte aucune modification quand les réviseurs ne répondent pas.
body:
  solution:
    en: |
      You recommend an access review of **PRJ-Fabrikam** that recurs every quarter, with the scope set to **Guest users only** and **Group owner(s)** as reviewers. **Auto apply results to resource** is enabled, and **If reviewers don't respond** is set to **No change**.
    fr: |
      Vous recommandez une révision d'accès de **PRJ-Fabrikam** qui se répète chaque trimestre, avec l'étendue définie sur **Guest users only** et **Group owner(s)** comme réviseurs. **Auto apply results to resource** est activé, et **If reviewers don't respond** est défini sur **No change**.
answer: { value: false }
explanation:
  correct:
    en: Auto-apply removes only the guests that an owner explicitly denies. With No change, a guest that the owners never review keeps the group membership, so a guest whose access was not confirmed doesn't lose access.
    fr: "L'application automatique retire uniquement les invités qu'un propriétaire refuse explicitement. Avec No change, un invité que les propriétaires ne révisent jamais conserve son appartenance au groupe : un invité dont l'accès n'a pas été confirmé ne perd donc pas l'accès."
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
