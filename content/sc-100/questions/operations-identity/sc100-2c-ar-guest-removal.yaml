id: sc100-2c-ar-guest-removal
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has 400 Microsoft 365 groups that contain guest users from partner organizations. Every group has at least one owner. The company has Microsoft Entra ID Governance licenses.

    You need to recommend a solution that meets the following requirements:

    - Every quarter, the owners of each group confirm whether each guest still needs access.
    - Guests who are denied lose all access to the tenant, not only to the group.
    - An administrator can restore a guest denied by mistake for up to 30 days.
    - Administrative effort is minimized.

    What should you recommend?
  fr: |
    Woodgrove Bank dispose de 400 groupes Microsoft 365 qui contiennent des utilisateurs invités d'organisations partenaires. Chaque groupe a au moins un propriétaire. L'entreprise dispose de licences Microsoft Entra ID Governance.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Chaque trimestre, les propriétaires de chaque groupe confirment si chaque invité a encore besoin de l'accès.
    - Les invités refusés perdent tout accès au locataire, pas seulement au groupe.
    - Un administrateur peut restaurer pendant 30 jours un invité refusé par erreur.
    - L'effort d'administration est réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A recurring access review of all Microsoft 365 groups with guest users, with auto apply and the option to remove the user's membership from the resource", fr: "Une révision d'accès récurrente de tous les groupes Microsoft 365 avec des utilisateurs invités, avec application automatique et l'option de suppression de l'appartenance de l'utilisateur à la ressource" } }
    - { id: b, text: { en: "A recurring access review of all Microsoft 365 groups with guest users, with auto apply and the option to block sign-in for 30 days and then remove the user from the tenant", fr: "Une révision d'accès récurrente de tous les groupes Microsoft 365 avec des utilisateurs invités, avec application automatique et l'option de blocage de la connexion pendant 30 jours puis de suppression de l'utilisateur du locataire" } }
    - { id: c, text: { en: "An entitlement management access package for each group, with assignments that expire after 90 days", fr: "Un package d'accès de la gestion des droits d'utilisation pour chaque groupe, avec des attributions qui expirent après 90 jours" } }
    - { id: d, text: { en: "A quarterly script that emails the group owners a list of guests and deletes the guests they flag", fr: "Un script trimestriel qui envoie aux propriétaires de groupe la liste des invités par e-mail et supprime les invités qu'ils signalent" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A review scoped to all Microsoft 365 groups with guest users, guest users only, covers every group without creating 400 reviews. For guest-only reviews, the action to block denied guests from signing in for 30 days and then remove them from the tenant revokes all tenant access, and administrators can re-enable a guest during those 30 days. Auto apply enforces the decisions without manual work.
    fr: |
      Une révision limitée aux invités de tous les groupes Microsoft 365 avec des utilisateurs invités couvre chaque groupe sans créer 400 révisions. Pour les révisions limitées aux invités, l'action qui bloque la connexion des invités refusés pendant 30 jours puis les supprime du locataire retire tout accès au locataire, et les administrateurs peuvent réactiver un invité pendant ces 30 jours. L'application automatique applique les décisions sans travail manuel.
  options:
    a:
      en: "Removing membership takes the guest out of the reviewed group only; the guest can still sign in and keeps its other access."
      fr: "Supprimer l'appartenance retire l'invité du groupe révisé seulement ; l'invité peut encore se connecter et garde ses autres accès."
    c:
      en: "Access packages would require redesigning how guests get access to 400 groups, and an expiration doesn't ask the owners to confirm each guest."
      fr: "Les packages d'accès imposeraient de repenser la façon dont les invités accèdent à 400 groupes, et une expiration ne demande pas aux propriétaires de confirmer chaque invité."
    d:
      en: "A custom script is code to build and maintain, and deleting guests directly leaves no 30-day window to restore them through the review."
      fr: "Un script personnalisé est du code à créer et maintenir, et supprimer directement les invités ne laisse pas la fenêtre de 30 jours de la révision pour les restaurer."
references:
  - title: Create an access review of groups and applications
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
