id: sc100-2c-adds-lateral-paths
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has an on-premises Active Directory Domain Services (AD DS) forest that contains three domains. The forest is synchronized to a Microsoft Entra tenant, and the company has Microsoft 365 E5 licenses.

    A penetration test showed that an attacker who compromised a help desk workstation reached a member of the Domain Admins group in two hops by reusing cached credentials.

    The CISO asks for a solution that continuously shows which sensitive accounts are exposed through such paths, assesses the AD DS configuration against common identity attacks, and raises alerts on attacks such as DCShadow and Golden Ticket activity. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose d'une forêt Active Directory Domain Services (AD DS) locale qui contient trois domaines. La forêt est synchronisée avec un locataire Microsoft Entra, et l'entreprise dispose de licences Microsoft 365 E5.

    Un test d'intrusion a montré qu'un attaquant qui avait compromis une station de travail du support a atteint un membre du groupe Domain Admins en deux rebonds, en réutilisant des informations d'identification mises en cache.

    Le RSSI demande une solution qui montre en continu quels comptes sensibles sont exposés par de tels chemins, évalue la configuration d'AD DS par rapport aux attaques d'identité courantes et génère des alertes sur des attaques comme DCShadow ou l'activité Golden Ticket. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Sentinel, with user and entity behavior analytics (UEBA) enabled", fr: "Microsoft Sentinel, avec l'analyse du comportement des utilisateurs et des entités (UEBA) activée" } }
    - { id: b, text: { en: "Attack path analysis of the Defender CSPM plan in Microsoft Defender for Cloud", fr: "L'analyse des chemins d'attaque du plan Defender CSPM de Microsoft Defender pour le cloud" } }
    - { id: c, text: { en: "Microsoft Entra ID Protection, with a user risk policy for the administrators", fr: "Microsoft Entra ID Protection, avec une stratégie de risque utilisateur pour les administrateurs" } }
    - { id: d, text: { en: "Microsoft Defender for Identity, with sensors on all the domain controllers", fr: "Microsoft Defender for Identity, avec des capteurs sur tous les contrôleurs de domaine" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Defender for Identity sensors on the domain controllers analyze AD DS traffic and events. The service maps lateral movement paths that lead to sensitive accounts, publishes identity security posture assessments in Microsoft Secure Score, and detects domain dominance attacks such as DCShadow and Golden Ticket activity. It's included in Microsoft 365 E5, so it meets the need with one product.
    fr: |
      Les capteurs Defender for Identity des contrôleurs de domaine analysent le trafic et les événements d'AD DS. Le service cartographie les chemins de mouvement latéral qui mènent aux comptes sensibles, publie des évaluations de la posture de sécurité des identités dans le Niveau de sécurité Microsoft (Microsoft Secure Score) et détecte les attaques de domination du domaine comme DCShadow et l'activité Golden Ticket. Il est inclus dans Microsoft 365 E5 : un seul produit répond au besoin.
  options:
    a:
      en: "UEBA finds anomalous behavior in the data Sentinel ingests, but it provides no AD DS posture assessments or lateral movement paths, and it requires building the data collection yourself."
      fr: "UEBA trouve les comportements anormaux dans les données ingérées par Sentinel, mais il ne fournit ni évaluations de posture d'AD DS ni chemins de mouvement latéral, et il faut construire soi-même la collecte des données."
    b:
      en: "Attack path analysis covers cloud resources assessed by Defender for Cloud; it doesn't analyze cached credentials and group memberships inside an on-premises AD DS forest."
      fr: "L'analyse des chemins d'attaque couvre les ressources cloud évaluées par Defender pour le cloud ; elle n'analyse pas les informations d'identification en cache ni les appartenances aux groupes d'une forêt AD DS locale."
    c:
      en: "ID Protection evaluates sign-in and user risk in Microsoft Entra ID; it doesn't assess AD DS configuration or detect DCShadow on domain controllers."
      fr: "ID Protection évalue le risque de connexion et le risque utilisateur dans Microsoft Entra ID ; il n'évalue pas la configuration d'AD DS et ne détecte pas DCShadow sur les contrôleurs de domaine."
references:
  - title: Microsoft Defender for Identity Overview
    url: https://learn.microsoft.com/en-us/defender-for-identity/what-is
  - title: Microsoft Defender for Identity Security Posture Assessments
    url: https://learn.microsoft.com/en-us/defender-for-identity/security-assessment
