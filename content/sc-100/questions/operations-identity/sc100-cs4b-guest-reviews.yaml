id: sc100-cs4b-guest-reviews
objective: "2.3.6"
type: single
caseStudy: sc100-cs4b-adatum-university
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating access review designs for the guests. Each design is a quarterly access review of all Microsoft 365 groups with guest users, scoped to guest users only, with the group owners as reviewers.

    Which design meets the guest requirements?
  fr: |
    Vous évaluez des conceptions de révision d'accès pour les invités. Chaque conception est une révision d'accès trimestrielle de tous les groupes Microsoft 365 comportant des utilisateurs invités, limitée aux utilisateurs invités, avec les propriétaires des groupes comme réviseurs.

    Quelle conception respecte les exigences relatives aux invités ?
body:
  options:
    - { id: a, text: { en: "Auto apply results: enabled. If reviewers don't respond: No change. Action on denied guests: block sign-in for 30 days, then remove from the tenant.", fr: "Auto apply results : activé. If reviewers don't respond : No change. Action sur les invités refusés : bloquer la connexion pendant 30 jours, puis supprimer du locataire." } }
    - { id: b, text: { en: "Auto apply results: enabled. If reviewers don't respond: Remove access. Action on denied guests: remove the user's membership from the resource.", fr: "Auto apply results : activé. If reviewers don't respond : Remove access. Action sur les invités refusés : supprimer l'appartenance de l'utilisateur à la ressource." } }
    - { id: c, text: { en: "Auto apply results: enabled. If reviewers don't respond: Remove access. Action on denied guests: block sign-in for 30 days, then remove from the tenant.", fr: "Auto apply results : activé. If reviewers don't respond : Remove access. Action sur les invités refusés : bloquer la connexion pendant 30 jours, puis supprimer du locataire." } }
    - { id: d, text: { en: "Auto apply results: disabled. If reviewers don't respond: Remove access. Action on denied guests: block sign-in for 30 days, then remove from the tenant.", fr: "Auto apply results : désactivé. If reviewers don't respond : Remove access. Action sur les invités refusés : bloquer la connexion pendant 30 jours, puis supprimer du locataire." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Auto apply results removes denied access automatically when the review ends, and Remove access treats the guests that a principal investigator didn't review as denied. For reviews of guest users, Block user from signing-in for 30 days, then remove user from the tenant blocks the account and deletes it after 30 days unless an administrator re-enables it. A review of all Microsoft 365 groups with guest users also covers teams created later.
    fr: |-
      Auto apply results supprime automatiquement l'accès refusé à la fin de la révision, et Remove access traite comme refusés les invités qu'un chercheur principal n'a pas révisés. Pour les révisions d'utilisateurs invités, l'action Block user from signing-in for 30 days, then remove user from the tenant bloque le compte et le supprime au bout de 30 jours, sauf si un administrateur le réactive. Une révision de tous les groupes Microsoft 365 comportant des utilisateurs invités couvre aussi les équipes créées ultérieurement.
  options:
    a:
      en: |-
        With No change, guests whom the principal investigator doesn't review keep their access, which violates the requirement.
      fr: |-
        Avec No change, les invités que le chercheur principal ne révise pas conservent leur accès, ce qui enfreint l'exigence.
    b:
      en: |-
        Removing the membership removes access to the team only; the guest account stays in the tenant and is never deleted.
      fr: |-
        La suppression de l'appartenance ne retire que l'accès à l'équipe ; le compte invité reste dans le locataire et n'est jamais supprimé.
    d:
      en: |-
        Without auto apply, an administrator must apply the results manually, so access isn't removed automatically and administrative effort increases.
      fr: |-
        Sans application automatique, un administrateur doit appliquer les résultats manuellement : l'accès n'est donc pas retiré automatiquement et l'effort administratif augmente.
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
