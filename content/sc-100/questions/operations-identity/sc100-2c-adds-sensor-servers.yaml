id: sc100-2c-adds-sensor-servers
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is deploying Microsoft Defender for Identity to evaluate and protect its on-premises Active Directory Domain Services (AD DS) forest. The forest contains the following servers:

    | Role | Number |
    | --- | --- |
    | Domain controllers, including two read-only domain controllers | 6 |
    | Active Directory Federation Services (AD FS) servers | 2 |
    | Enterprise certification authority running Active Directory Certificate Services (AD CS) | 1 |
    | Exchange Server mailbox servers | 4 |
    | File servers | 20 |

    Sensors will be installed on all the domain controllers. You need to recommend which other servers must receive a sensor so that Defender for Identity monitors the authentication infrastructure that attackers target.

    Which two types of servers should you include in the recommendation?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. déploie Microsoft Defender for Identity pour évaluer et protéger sa forêt Active Directory Domain Services (AD DS) locale. La forêt contient les serveurs suivants :

    | Rôle | Nombre |
    | --- | --- |
    | Contrôleurs de domaine, dont deux contrôleurs de domaine en lecture seule | 6 |
    | Serveurs Active Directory Federation Services (AD FS) | 2 |
    | Autorité de certification d'entreprise exécutant Active Directory Certificate Services (AD CS) | 1 |
    | Serveurs de boîtes aux lettres Exchange Server | 4 |
    | Serveurs de fichiers | 20 |

    Des capteurs seront installés sur tous les contrôleurs de domaine. Vous devez recommander les autres serveurs qui doivent recevoir un capteur pour que Defender for Identity surveille l'infrastructure d'authentification que visent les attaquants.

    Quels sont les deux types de serveurs à inclure dans la recommandation ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Exchange Server mailbox servers", fr: "Les serveurs de boîtes aux lettres Exchange Server" } }
    - { id: b, text: { en: "The AD FS servers", fr: "Les serveurs AD FS" } }
    - { id: c, text: { en: "No other servers, because the read-only domain controllers relay their events", fr: "Aucun autre serveur, car les contrôleurs de domaine en lecture seule relaient leurs événements" } }
    - { id: d, text: { en: "The file servers", fr: "Les serveurs de fichiers" } }
    - { id: e, text: { en: "The AD CS certification authority", fr: "L'autorité de certification AD CS" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Defender for Identity sensors go on every domain controller, read-only domain controllers included, and on the AD FS, AD CS and Microsoft Entra Connect servers that aren't domain controllers. AD FS issues federation tokens and AD CS issues certificates that can impersonate administrators, so both are part of the identity attack surface.
    fr: |
      Les capteurs Defender for Identity s'installent sur chaque contrôleur de domaine, y compris les contrôleurs de domaine en lecture seule, et sur les serveurs AD FS, AD CS et Microsoft Entra Connect qui ne sont pas contrôleurs de domaine. AD FS émet des jetons de fédération et AD CS des certificats qui peuvent usurper l'identité d'administrateurs : tous deux font partie de la surface d'attaque des identités.
  options:
    a:
      en: "Exchange servers aren't among the servers that host a Defender for Identity sensor; Defender for Endpoint protects them as servers."
      fr: "Les serveurs Exchange ne font pas partie des serveurs qui hébergent un capteur Defender for Identity ; Defender for Endpoint les protège en tant que serveurs."
    c:
      en: "Each domain controller, read-only or not, needs its own sensor, and the federation and certificate servers need sensors too; no server relays the events of another."
      fr: "Chaque contrôleur de domaine, en lecture seule ou non, a besoin de son propre capteur, et les serveurs de fédération et de certificats aussi ; aucun serveur ne relaie les événements d'un autre."
    d:
      en: "File servers aren't part of the authentication infrastructure that the sensors monitor."
      fr: "Les serveurs de fichiers ne font pas partie de l'infrastructure d'authentification que surveillent les capteurs."
references:
  - title: Deploy Microsoft Defender for Identity sensors
    url: https://learn.microsoft.com/en-us/defender-for-identity/deploy/deploy-defender-identity
