id: sc100-sr2-ar-2
objective: "2.3.6"
type: series_yesno
series: sc100-sr2-guest-reviews
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You recommend one recurring review of all Microsoft 365 groups with guest users, in which the guests review their own access.
  fr: |
    Vous recommandez une révision récurrente de tous les groupes Microsoft 365 avec des utilisateurs invités, dans laquelle les invités révisent leur propre accès.
body:
  solution:
    en: |
      You recommend a single access review with the following settings:

      - Scope: **All Microsoft 365 groups with guest users**, **Guest users only**
      - Reviewers: **Users review their own access**
      - Recurrence: **Quarterly**, end date **Never**
      - **Auto apply results to resource**: enabled
      - **If reviewers don't respond**: **Remove access**
    fr: |
      Vous recommandez une seule révision d'accès avec les paramètres suivants :

      - Étendue : **All Microsoft 365 groups with guest users**, **Guest users only**
      - Réviseurs : **Users review their own access**
      - Périodicité : **Quarterly**, date de fin **Never**
      - **Auto apply results to resource** : activé
      - **If reviewers don't respond** : **Remove access**
answer: { value: false }
explanation:
  correct:
    en: |
      With self-review, each guest decides whether to keep their own membership, so a guest who confirms keeps access without any owner involvement. The requirement is that the owners of each team or group make the decision, which needs the Group owner(s) reviewer option.
    fr: |
      Avec l'auto-révision, chaque invité décide s'il conserve sa propre appartenance : un invité qui confirme garde son accès sans aucune intervention d'un propriétaire. L'exigence impose que les propriétaires de chaque équipe ou groupe prennent la décision, ce qui nécessite l'option de réviseurs Group owner(s).
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
