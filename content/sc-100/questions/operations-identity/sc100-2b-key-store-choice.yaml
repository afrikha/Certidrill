id: sc100-2b-key-store-choice
objective: "2.2.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is designing key management for three workloads. For each workload, the solution must meet the stated requirement at the lowest cost.

    - A card payment platform must perform payment PIN processing in an HSM.
    - Azure Storage accounts must be encrypted with customer-managed keys protected by an HSM; a multitenant service is acceptable.
    - Internal web apps need a store for their secrets and certificates; there is no HSM requirement.

    Which solution should you recommend for each workload? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. conçoit la gestion des clés de trois charges de travail. Pour chaque charge de travail, la solution doit répondre à l'exigence indiquée au coût le plus bas.

    - Une plateforme de paiement par carte doit effectuer le traitement des codes PIN de paiement dans un HSM.
    - Des comptes Stockage Azure doivent être chiffrés avec des clés gérées par le client protégées par un HSM ; un service multilocataire est acceptable.
    - Des applications web internes ont besoin d'un magasin pour leurs secrets et certificats ; il n'y a aucune exigence HSM.

    Quelle solution devez-vous recommander pour chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Payment PIN processing: [[pin]]

      Customer-managed keys for Azure Storage: [[cmk]]

      Secrets and certificates of the web apps: [[app]]
    fr: |
      Traitement des codes PIN de paiement : [[pin]]

      Clés gérées par le client pour Stockage Azure : [[cmk]]

      Secrets et certificats des applications web : [[app]]
  slots:
    - id: pin
      options:
        - { id: std, text: Azure Key Vault Standard }
        - { id: prem, text: Azure Key Vault Premium }
        - { id: mhsm, text: Azure Key Vault Managed HSM }
        - { id: pay, text: Azure Payment HSM }
    - id: cmk
      options:
        - { id: std, text: Azure Key Vault Standard }
        - { id: prem, text: Azure Key Vault Premium }
        - { id: mhsm, text: Azure Key Vault Managed HSM }
        - { id: pay, text: Azure Payment HSM }
    - id: app
      options:
        - { id: std, text: Azure Key Vault Standard }
        - { id: prem, text: Azure Key Vault Premium }
        - { id: mhsm, text: Azure Key Vault Managed HSM }
        - { id: pay, text: Azure Payment HSM }
answer:
  values: { pin: pay, cmk: prem, app: std }
explanation:
  correct:
    en: |-
      Payment HSM is the service for payment PIN processing. Key Vault Premium is the recommended minimum for customer-managed keys protected by an HSM and costs less than the single-tenant Managed HSM, which the requirement doesn't need. Key Vault Standard stores secrets and certificates with software protection at the lowest cost.
    fr: |-
      Payment HSM est le service du traitement des codes PIN de paiement. Key Vault Premium est le minimum recommandé pour des clés gérées par le client protégées par un HSM et coûte moins cher que Managed HSM, monolocataire, dont l'exigence n'a pas besoin. Key Vault Standard stocke les secrets et les certificats avec une protection logicielle au coût le plus bas.
  options:
    mhsm: { en: "Managed HSM is single tenant and costs more; it also stores only keys, not secrets or certificates.", fr: "Managed HSM est monolocataire et coûte plus cher ; il ne stocke par ailleurs que des clés, ni secrets ni certificats." }
references:
  - title: How to choose the right Azure key management solution
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management-choose
