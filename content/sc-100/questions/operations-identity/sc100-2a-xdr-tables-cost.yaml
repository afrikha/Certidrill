id: sc100-2a-xdr-tables-cost
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has Microsoft 365 E5 and uses Microsoft Sentinel in the Azure portal to correlate Linux appliance logs. Today, the raw advanced hunting tables of Microsoft Defender for Endpoint, such as device process and network events, are streamed into the Sentinel workspace so that analytics rules can join them with the appliance logs.

    Ingestion of these tables represents most of the Sentinel bill. Litware wants to keep detections that combine device events of the last 30 days with the appliance logs, and to reduce the ingestion cost.

    What should you recommend?
  fr: |
    Litware, Inc. dispose de Microsoft 365 E5 et utilise Microsoft Sentinel dans le portail Azure pour corréler des journaux d'appliances Linux. Aujourd'hui, les tables brutes de repérage avancé de Microsoft Defender for Endpoint, comme les événements de processus et de réseau des appareils, sont transmises en continu à l'espace de travail Sentinel afin que des règles d'analyse les joignent aux journaux des appliances.

    L'ingestion de ces tables représente l'essentiel de la facture Sentinel. Litware veut conserver des détections qui combinent les événements des appareils des 30 derniers jours avec les journaux des appliances, et réduire le coût d'ingestion.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep streaming the tables and reduce their interactive retention to 30 days", fr: "Continuer à transmettre les tables et réduire leur rétention interactive à 30 jours" } }
    - { id: b, text: { en: "Stop streaming the tables and enable the Fusion rule to correlate the device alerts", fr: "Arrêter de transmettre les tables et activer la règle Fusion pour corréler les alertes des appareils" } }
    - { id: c, text: { en: "Onboard Sentinel to the Defender portal, stop streaming the tables and use custom detection rules", fr: "Intégrer Sentinel au portail Defender, arrêter de transmettre les tables et utiliser des règles de détection personnalisées" } }
    - { id: d, text: { en: "Keep streaming the tables and enable Microsoft incident creation rules for Defender for Endpoint", fr: "Continuer à transmettre les tables et activer les règles de création d'incidents Microsoft pour Defender for Endpoint" } }
answer: { optionId: c }
explanation:
  correct:
    en: In the Defender portal, custom detection rules can query both the Sentinel tables and the Defender XDR tables, without ingesting the Defender XDR data into Sentinel. The advanced hunting raw data is available for 30 days at no ingestion cost, which keeps the joined detections while removing the main source of cost.
    fr: Dans le portail Defender, les règles de détection personnalisées peuvent interroger à la fois les tables Sentinel et les tables Defender XDR, sans ingérer les données Defender XDR dans Sentinel. Les données brutes de repérage avancé sont disponibles 30 jours sans coût d'ingestion, ce qui conserve les détections combinées tout en supprimant la principale source de coût.
  options:
    a:
      en: Ingestion is billed when data arrives; shortening retention doesn't reduce the ingestion cost.
      fr: L'ingestion est facturée à l'arrivée des données ; raccourcir la rétention ne réduit pas le coût d'ingestion.
    b:
      en: Fusion correlates alerts, not raw device events with appliance logs, and it is disabled once the workspace is onboarded to the Defender portal.
      fr: Fusion corrèle des alertes, pas des événements bruts d'appareils avec des journaux d'appliances, et il est désactivé dès que l'espace de travail est intégré au portail Defender.
    d:
      en: Incident creation rules only turn product alerts into incidents; they don't reduce the ingestion of the raw tables.
      fr: Les règles de création d'incidents transforment seulement les alertes des produits en incidents ; elles ne réduisent pas l'ingestion des tables brutes.
