id: sc100-2b-contractor-access-package
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. runs projects with contractors from Litware, Inc., which uses Microsoft Entra ID. For each project, Litware users need a Teams team, a SharePoint site and an enterprise application.

    Litware users must request the access themselves, the project lead must approve each request, and access must expire after 90 days. Administrators must not send invitations, and Litware guest accounts must be removed from Contoso's directory when they no longer have any access.

    What should you recommend?
  fr: |
    Contoso, Ltd. mène des projets avec des prestataires de Litware, Inc., qui utilise Microsoft Entra ID. Pour chaque projet, les utilisateurs de Litware ont besoin d'une équipe Teams, d'un site SharePoint et d'une application d'entreprise.

    Les utilisateurs de Litware doivent demander l'accès eux-mêmes, le chef de projet doit approuver chaque demande, et l'accès doit expirer après 90 jours. Les administrateurs ne doivent pas envoyer d'invitations, et les comptes invités de Litware doivent être supprimés de l'annuaire de Contoso quand ils n'ont plus aucun accès.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An access package with a request policy for Litware as a connected organization", fr: "Un package d'accès avec une stratégie de demande pour Litware en tant qu'organisation connectée" } }
    - { id: b, text: { en: "B2B invitations sent by the project leads, followed by a quarterly access review", fr: "Des invitations B2B envoyées par les chefs de projet, suivies d'une révision d'accès trimestrielle" } }
    - { id: c, text: { en: "Cross-tenant synchronization of the Litware users into Contoso's tenant", fr: "La synchronisation interlocataire des utilisateurs de Litware vers le locataire de Contoso" } }
    - { id: d, text: { en: "PIM for Groups with 90-day eligible memberships for the Litware users", fr: "PIM for Groups avec des appartenances éligibles de 90 jours pour les utilisateurs de Litware" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Entitlement management bundles groups and teams, SharePoint sites and app roles in an access package whose policy defines who can request, the approvers and the expiration. When Litware is a connected organization, its users request access themselves; once approved they are added as B2B guests, and entitlement management removes them when their access expires or is revoked.
    fr: |-
      La gestion des droits d'utilisation regroupe des groupes et équipes, des sites SharePoint et des rôles d'application dans un package d'accès dont la stratégie définit qui peut demander, les approbateurs et l'expiration. Quand Litware est une organisation connectée, ses utilisateurs demandent l'accès eux-mêmes ; une fois approuvés, ils sont ajoutés comme invités B2B, et la gestion des droits d'utilisation les supprime quand leur accès expire ou est révoqué.
  options:
    b: { en: "Invitations are sent by Contoso, which the requirement forbids, and the access doesn't expire after 90 days.", fr: "Les invitations sont envoyées par Contoso, ce que l'exigence interdit, et l'accès n'expire pas après 90 jours." }
    c: { en: "Cross-tenant synchronization is designed for the tenants of one multitenant organization; it has no request or approval workflow.", fr: "La synchronisation interlocataire est conçue pour les locataires d'une même organisation multilocataire ; elle n'a pas de flux de demande ni d'approbation." }
    d: { en: "PIM for Groups makes membership just in time for existing users; it doesn't onboard external users through requests.", fr: "PIM for Groups rend l'appartenance juste-à-temps pour des utilisateurs existants ; il n'intègre pas des utilisateurs externes par des demandes." }
references:
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
