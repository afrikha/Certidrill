id: sc100-2a-playbook-permissions
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is designing Microsoft Sentinel playbooks. One playbook adds enrichment comments and changes the status of incidents. Another playbook only receives incidents and posts a summary in Microsoft Teams. Automation rules must be able to run both playbooks.

    Each identity must have the least privileges required, and the number of identities to manage must be minimized.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. conçoit des playbooks Microsoft Sentinel. Un playbook ajoute des commentaires d'enrichissement et change l'état des incidents. Un autre playbook reçoit seulement les incidents et publie un résumé dans Microsoft Teams. Les règles d'automatisation doivent pouvoir exécuter les deux playbooks.

    Chaque identité doit disposer des privilèges minimaux requis, et le nombre d'identités à gérer doit être réduit au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Managed identity of the enrichment playbook, on the workspace: [[s1]]

      Managed identity of the Teams summary playbook, on the workspace: [[s2]]

      Microsoft Sentinel service account, on the playbooks' resource group: [[s3]]
    fr: |
      Identité managée du playbook d'enrichissement, sur l'espace de travail : [[s1]]

      Identité managée du playbook de résumé Teams, sur l'espace de travail : [[s2]]

      Compte de service Microsoft Sentinel, sur le groupe de ressources des playbooks : [[s3]]
  slots:
    - id: s1
      options:
        - { id: reader, text: Microsoft Sentinel Reader }
        - { id: responder, text: Microsoft Sentinel Responder }
        - { id: contributor, text: Microsoft Sentinel Contributor }
    - id: s2
      options:
        - { id: reader, text: Microsoft Sentinel Reader }
        - { id: responder, text: Microsoft Sentinel Responder }
        - { id: operator, text: Microsoft Sentinel Playbook Operator }
    - id: s3
      options:
        - { id: automation, text: Microsoft Sentinel Automation Contributor }
        - { id: operator, text: Microsoft Sentinel Playbook Operator }
        - { id: logic, text: Logic App Contributor }
answer:
  values: { s1: responder, s2: reader, s3: automation }
explanation:
  correct:
    en: |
      A managed identity grants permissions directly to the playbook and reduces the number of identities to manage. A playbook whose steps update incidents needs Microsoft Sentinel Responder; one that only receives incidents needs Microsoft Sentinel Reader. Microsoft Sentinel runs playbooks from automation rules with a service account that needs the Microsoft Sentinel Automation Contributor role on the resource group that contains the playbooks.
    fr: |
      Une identité managée accorde les autorisations directement au playbook et réduit le nombre d'identités à gérer. Un playbook dont les étapes mettent à jour les incidents a besoin de Microsoft Sentinel Responder ; un playbook qui reçoit seulement les incidents a besoin de Microsoft Sentinel Reader. Microsoft Sentinel exécute les playbooks depuis les règles d'automatisation avec un compte de service qui a besoin du rôle Microsoft Sentinel Automation Contributor sur le groupe de ressources qui contient les playbooks.
  options:
    contributor:
      en: |
        Microsoft Sentinel Contributor also lets the identity create and edit analytics rules and content, which is more than updating incidents requires.
      fr: |
        Microsoft Sentinel Contributor permet aussi à l'identité de créer et de modifier des règles d'analyse et du contenu, ce qui dépasse ce que la mise à jour des incidents exige.
    operator:
      en: |
        Microsoft Sentinel Playbook Operator lets users list, view and manually run playbooks; it isn't the permission that the playbook identity or the automation service account needs.
      fr: |
        Microsoft Sentinel Playbook Operator permet à des utilisateurs de lister, consulter et exécuter manuellement des playbooks ; ce n'est pas l'autorisation dont ont besoin l'identité du playbook ou le compte de service d'automatisation.
    logic:
      en: |
        Logic App Contributor is needed to create or edit playbooks, not for Sentinel to run them.
      fr: |
        Logic App Contributor est nécessaire pour créer ou modifier des playbooks, pas pour que Sentinel les exécute.
references:
  - title: Authenticate playbooks to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/authenticate-playbooks-to-sentinel
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
