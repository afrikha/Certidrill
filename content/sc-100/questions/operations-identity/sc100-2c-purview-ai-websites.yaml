id: sc100-2c-purview-ai-websites
objective: "2.4.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. is a financial services company. Its employees use Windows devices with Google Chrome, and some of them paste customer data into third-party generative AI websites.

    The compliance team wants Microsoft Purview Data Security Posture Management to report the sensitive information sent to these websites and to deploy its ready-to-use policies that protect it. Microsoft Purview Audit is turned on.

    Which two actions should you recommend?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. est une société de services financiers. Ses employés utilisent des appareils Windows avec Google Chrome, et certains collent des données clients dans des sites web d'IA générative tiers.

    L'équipe de conformité veut que Microsoft Purview Data Security Posture Management signale les informations sensibles envoyées à ces sites et déploie ses stratégies prêtes à l'emploi qui les protègent. Microsoft Purview Audit est activé.

    Quelles sont les deux actions à recommander ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Onboard the Windows devices to Microsoft Purview", fr: "Intégrer les appareils Windows à Microsoft Purview" } }
    - { id: b, text: { en: "Enable AI security posture management in the Defender CSPM plan", fr: "Activer la gestion de la posture de sécurité de l'IA dans le plan Defender CSPM" } }
    - { id: c, text: { en: "Turn on Cloud Discovery in Microsoft Defender for Cloud Apps", fr: "Activer Cloud Discovery dans Microsoft Defender for Cloud Apps" } }
    - { id: d, text: { en: "Create an Insider Risk Management policy from the Data theft by departing users template", fr: "Créer une stratégie Insider Risk Management à partir du modèle Data theft by departing users" } }
    - { id: e, text: { en: "Deploy the Microsoft Purview browser extension to the devices", fr: "Déployer l'extension de navigateur Microsoft Purview sur les appareils" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      To get insights into third-party AI sites, Purview requires the devices to be onboarded to Microsoft Purview and the Microsoft Purview browser extension to be installed, in addition to Audit. The posture solution can then report AI website visits and the sensitive information types sent, and its one-click policies detect and protect sensitive data in prompts to those sites.
    fr: |
      Pour obtenir de la visibilité sur les sites d'IA tiers, Purview exige que les appareils soient intégrés à Microsoft Purview et que l'extension de navigateur Microsoft Purview soit installée, en plus d'Audit. La solution de posture peut alors signaler les visites de sites d'IA et les types d'informations sensibles envoyés, et ses stratégies en un clic détectent et protègent les données sensibles des invites envoyées à ces sites.
  options:
    b:
      en: "AI security posture management in Defender CSPM assesses AI workloads deployed in the organization's clouds, not the data users paste into third-party websites."
      fr: "La gestion de la posture de sécurité de l'IA de Defender CSPM évalue les charges de travail d'IA déployées dans les clouds de l'organisation, pas les données que les utilisateurs collent dans des sites tiers."
    c:
      en: "Cloud Discovery shows which cloud apps are used, but it doesn't inspect the sensitive information in prompts or feed the Purview posture reports."
      fr: "Cloud Discovery montre les applications cloud utilisées, mais il n'inspecte pas les informations sensibles des invites et n'alimente pas les rapports de posture de Purview."
    d:
      en: "The departing users template detects data theft by leavers; it isn't a prerequisite for visibility into AI websites."
      fr: "Le modèle des utilisateurs sur le départ détecte le vol de données par les partants ; ce n'est pas un prérequis de la visibilité sur les sites d'IA."
references:
  - title: Setup tasks for Microsoft Purview Data Security Posture Management
    url: https://learn.microsoft.com/en-us/purview/data-security-posture-management-setup
