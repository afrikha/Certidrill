id: sc100-cs4a-multicloud-monitoring
objective: "2.1.3"
type: dropdown
caseStudy: sc100-cs4a-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that meets the monitoring requirements.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution qui respecte les exigences relatives à la surveillance.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Security events of the CrewPlan instances and the MaintTrack servers: [[events]]

      CloudTrail logs of all the AWS accounts: [[trail]]

      Posture of all current and future AWS accounts: [[posture]]
    fr: |
      Événements de sécurité des instances CrewPlan et des serveurs MaintTrack : [[events]]

      Journaux CloudTrail de tous les comptes AWS : [[trail]]

      Posture de tous les comptes AWS actuels et futurs : [[posture]]
  slots:
    - id: events
      options:
        - { id: mma, text: { en: "Install the Log Analytics agent on the machines and connect it to the Sentinel workspace", fr: "Installer l'agent Log Analytics sur les machines et le connecter à l'espace de travail Sentinel" } }
        - { id: arc, text: { en: "Onboard the machines to Azure Arc, then deploy the Azure Monitor Agent with data collection rules", fr: "Intégrer les machines à Azure Arc, puis déployer l'agent Azure Monitor avec des règles de collecte de données" } }
        - { id: syslog, text: { en: "Forward the events of the machines in Syslog format to a Linux log forwarder", fr: "Transférer les événements des machines au format Syslog vers un redirecteur de journaux Linux" } }
    - id: trail
      options:
        - { id: s3, text: { en: "The Amazon Web Services S3 connector of Sentinel, reading the bucket of the organization trail", fr: "Le connecteur Amazon Web Services S3 de Sentinel, qui lit le compartiment du journal de suivi d'organisation" } }
        - { id: mdc, text: { en: "The AWS connector of Defender for Cloud, connected to the management account", fr: "Le connecteur AWS de Defender pour le cloud, connecté au compte de gestion" } }
        - { id: ama, text: { en: "The Azure Monitor Agent on each CrewPlan instance, with a data collection rule for CloudTrail", fr: "L'agent Azure Monitor sur chaque instance CrewPlan, avec une règle de collecte de données pour CloudTrail" } }
    - id: posture
      options:
        - { id: single, text: { en: "Connect each of the three AWS accounts to Defender for Cloud as a single account", fr: "Connecter chacun des trois comptes AWS à Defender pour le cloud en tant que compte unique" } }
        - { id: arconly, text: { en: "Onboard the CrewPlan instances to Azure Arc and enable Defender for Servers on them", fr: "Intégrer les instances CrewPlan à Azure Arc et activer Defender for Servers sur celles-ci" } }
        - { id: org, text: { en: "Connect the AWS management account to Defender for Cloud as a management account", fr: "Connecter le compte de gestion AWS à Defender pour le cloud en tant que compte de gestion" } }
answer:
  values: { events: arc, trail: s3, posture: org }
explanation:
  correct:
    en: |-
      Machines outside Azure get an Azure resource identity through Azure Arc, which lets you deploy the Azure Monitor Agent and manage collection centrally with data collection rules for both Windows and Linux. The Amazon Web Services S3 connector ingests CloudTrail management and data events from an S3 bucket notified through SQS, so the organization trail brings the logs of all the accounts. Onboarding the management account lets Defender for Cloud automatically create connectors for the member accounts, including accounts created later.
    fr: |-
      Les machines hors d'Azure obtiennent une identité de ressource Azure grâce à Azure Arc, ce qui permet de déployer l'agent Azure Monitor et de gérer la collecte de façon centralisée avec des règles de collecte de données, pour Windows comme pour Linux. Le connecteur Amazon Web Services S3 ingère les événements de gestion et de données CloudTrail depuis un compartiment S3 notifié via SQS : le journal de suivi d'organisation apporte donc les journaux de tous les comptes. L'intégration du compte de gestion permet à Defender pour le cloud de créer automatiquement des connecteurs pour les comptes membres, y compris les comptes créés ultérieurement.
  options:
    mma:
      en: |-
        The Log Analytics agent is retired; new collection uses the Azure Monitor Agent with data collection rules.
      fr: |-
        L'agent Log Analytics est mis hors service ; la nouvelle collecte utilise l'agent Azure Monitor avec des règles de collecte de données.
    syslog:
      en: |-
        A Syslog forwarder is for appliances that can't run an agent; it doesn't collect the Windows security events of the CrewPlan instances.
      fr: |-
        Un redirecteur Syslog est destiné aux appliances qui ne peuvent pas exécuter d'agent ; il ne collecte pas les événements de sécurité Windows des instances CrewPlan.
    mdc:
      en: |-
        The Defender for Cloud connector assesses the posture of the AWS resources; it doesn't ingest the CloudTrail logs into Sentinel.
      fr: |-
        Le connecteur de Defender pour le cloud évalue la posture des ressources AWS ; il n'ingère pas les journaux CloudTrail dans Sentinel.
    ama:
      en: |-
        CloudTrail logs are delivered by AWS to S3; they aren't events on the instances that an agent could collect.
      fr: |-
        Les journaux CloudTrail sont envoyés par AWS vers S3 ; ce ne sont pas des événements des instances qu'un agent pourrait collecter.
    single:
      en: |-
        Single-account connectors cover only the three existing accounts; future accounts would need new connectors.
      fr: |-
        Des connecteurs de compte unique ne couvrent que les trois comptes existants ; les futurs comptes nécessiteraient de nouveaux connecteurs.
    arconly:
      en: |-
        Defender for Servers protects the instances, but it doesn't assess the posture of the other resources of the AWS accounts.
      fr: |-
        Defender for Servers protège les instances, mais il n'évalue pas la posture des autres ressources des comptes AWS.
references:
  - title: Connect Microsoft Sentinel to Amazon Web Services to ingest AWS service log data
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-aws
  - title: Connect AWS accounts to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
