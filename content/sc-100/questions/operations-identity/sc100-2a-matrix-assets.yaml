id: sc100-2a-matrix-assets
objective: "2.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. operates a bottling plant, a fleet of delivery drivers and a corporate IT environment. You are designing a threat detection coverage assessment based on the MITRE ATT&CK framework.

    Which reference should you use to assess each environment? To answer, drag the appropriate references to the correct environments. Each reference may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. exploite une usine d'embouteillage, une flotte de chauffeurs-livreurs et un environnement informatique d'entreprise. Vous concevez une évaluation de la couverture de détection des menaces fondée sur le framework MITRE ATT&CK.

    Quelle référence devez-vous utiliser pour évaluer chaque environnement ? Pour répondre, faites glisser les références appropriées vers les environnements correspondants. Chaque référence peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: ent, text: { en: "MITRE ATT&CK Enterprise matrix", fr: "Matrice MITRE ATT&CK Enterprise" } }
    - { id: mob, text: { en: "MITRE ATT&CK Mobile matrix", fr: "Matrice MITRE ATT&CK Mobile" } }
    - { id: ics, text: { en: "MITRE ATT&CK for ICS matrix", fr: "Matrice MITRE ATT&CK for ICS" } }
    - { id: mcsb, text: { en: "Microsoft cloud security benchmark", fr: "Benchmark de sécurité cloud Microsoft" } }
  targets:
    - id: t1
      text: { en: "The Microsoft Entra tenant and the Microsoft 365 services", fr: "Le locataire Microsoft Entra et les services Microsoft 365" }
    - id: t2
      text: { en: "The AKS clusters that run the ordering application", fr: "Les clusters AKS qui exécutent l'application de commande" }
    - id: t3
      text: { en: "The Android tablets used by the delivery drivers", fr: "Les tablettes Android utilisées par les chauffeurs-livreurs" }
    - id: t4
      text: { en: "The HMIs and PLCs of the bottling lines", fr: "Les IHM et les automates des lignes d'embouteillage" }
answer:
  mapping: { t1: ent, t2: ent, t3: mob, t4: ics }
explanation:
  correct:
    en: |
      The Enterprise matrix covers Windows, macOS and Linux, but also cloud platforms such as identity providers, SaaS and Office suite, IaaS, and containers, so it applies to the tenant, Microsoft 365 and the AKS clusters. The Mobile matrix covers Android and iOS devices. The ICS matrix covers industrial control systems such as HMIs and PLCs; Microsoft Defender for IoT maps its OT alerts to it. The Microsoft cloud security benchmark is a control framework, not an adversary technique matrix.
    fr: |
      La matrice Enterprise couvre Windows, macOS et Linux, mais aussi les plateformes cloud comme les fournisseurs d'identité, le SaaS et la suite Office, l'IaaS et les conteneurs : elle s'applique donc au locataire, à Microsoft 365 et aux clusters AKS. La matrice Mobile couvre les appareils Android et iOS. La matrice ICS couvre les systèmes de contrôle industriels comme les IHM et les automates ; Microsoft Defender for IoT y mappe ses alertes OT. Le benchmark de sécurité cloud Microsoft est un cadre de contrôles, pas une matrice de techniques d'adversaires.
references:
  - title: View MITRE ATT&CK Coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
