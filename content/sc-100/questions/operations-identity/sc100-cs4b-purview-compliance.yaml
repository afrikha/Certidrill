explanation:
  correct:
    en: |-
      Compliance Manager applies a regulation template such as GDPR as an assessment, with improvement actions that you assign to owners and a compliance score that shows progress. Data Lifecycle Management retention policies keep content for a set period and then delete it automatically. eDiscovery places holds on the mailboxes and OneDrive accounts of the people involved in a case. Communication Compliance detects harassment, threats and other inappropriate language in email and Teams chats, with pseudonymized user names by default.
    fr: |-
      Le Gestionnaire de conformité applique un modèle de réglementation comme le RGPD sous forme d'évaluation, avec des actions d'amélioration attribuées à des propriétaires et un score de conformité qui montre la progression. Les stratégies de rétention de Data Lifecycle Management conservent le contenu pendant une durée définie, puis le suppriment automatiquement. eDiscovery place des conservations sur les boîtes aux lettres et les comptes OneDrive des personnes impliquées dans une affaire. La conformité des communications détecte le harcèlement, les menaces et les autres propos inappropriés dans les e-mails et les conversations Teams, avec des noms d'utilisateur pseudonymisés par défaut.
  options:
    irm:
      en: |-
        Insider Risk Management correlates user activities to detect risks such as data theft by a departing employee; it doesn't review message content for harassment or track a regulation.
      fr: |-
        La gestion des risques internes met en corrélation les activités des utilisateurs pour détecter des risques comme le vol de données par un employé sur le départ ; elle n'analyse pas le contenu des messages pour y trouver du harcèlement et ne suit pas une réglementation.
references:
