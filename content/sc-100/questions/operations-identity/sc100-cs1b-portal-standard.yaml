id: sc100-cs1b-portal-standard
objective: "2.4.4"
type: yesno_statements
caseStudy: sc100-cs1b-lamna
difficulty: 3
status: draft
stem:
  en: |
    You are evaluating how Defender for Cloud can meet the compliance requirements. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez la façon dont Defender for Cloud peut respecter les exigences relatives à la conformité. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The HIPAA standard can be assigned to both Sub-Portal and aws-portal-prod to meet the requirement.
        fr: |-
          La norme HIPAA peut être attribuée à Sub-Portal et à aws-portal-prod pour respecter l'exigence.
    - id: s2
      text:
        en: |-
          The HITRUST CSF v11.3.0 standard can be assigned to both Sub-Portal and aws-portal-prod to meet the requirement.
        fr: |-
          La norme HITRUST CSF v11.3.0 peut être attribuée à Sub-Portal et à aws-portal-prod pour respecter l'exigence.
    - id: s3
      text:
        en: |-
          The regulatory compliance dashboard currently assesses aws-portal-prod against the Microsoft cloud security benchmark and AWS Foundational Security Best Practices.
        fr: |-
          Le tableau de bord de conformité réglementaire évalue actuellement aws-portal-prod par rapport au Microsoft Cloud Security Benchmark et à AWS Foundational Security Best Practices.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      In Defender for Cloud, HIPAA is available only for Azure, so it can't cover the AWS account. HITRUST CSF v11.3.0 is available for Azure, AWS and GCP, so one healthcare standard can track both clouds. When an AWS account is connected, the Microsoft cloud security benchmark and AWS Foundational Security Best Practices are enabled by default.
    fr: |-
      Dans Defender for Cloud, la norme HIPAA n'est disponible que pour Azure : elle ne peut pas couvrir le compte AWS. HITRUST CSF v11.3.0 est disponible pour Azure, AWS et GCP : une seule norme du secteur de la santé peut donc suivre les deux clouds. Quand un compte AWS est connecté, le Microsoft Cloud Security Benchmark et AWS Foundational Security Best Practices sont activés par défaut.
references:
  - title: Regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
