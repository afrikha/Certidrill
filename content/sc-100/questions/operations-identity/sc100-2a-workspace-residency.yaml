id: sc100-2a-workspace-residency
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has a single Microsoft Entra tenant, subsidiaries in Europe and in the United States, and one central SOC that uses Microsoft Sentinel. A European regulation requires the security logs of the European subsidiary to be stored in the European Union. No residency requirement applies to the logs of the US subsidiary.

    The design must minimize the number of Log Analytics workspaces, simplify hunting across all the data, and maximize commitment tier discounts.

    What should you recommend?
  fr: |
    Adatum Corporation dispose d'un seul locataire Microsoft Entra, de filiales en Europe et aux États-Unis, et d'un SOC central qui utilise Microsoft Sentinel. Une réglementation européenne exige que les journaux de sécurité de la filiale européenne soient stockés dans l'Union européenne. Aucune exigence de résidence ne s'applique aux journaux de la filiale américaine.

    La conception doit réduire au minimum le nombre d'espaces de travail Log Analytics, simplifier le repérage sur l'ensemble des données et maximiser les remises des niveaux d'engagement.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One workspace in an EU region and one workspace in a US region", fr: "Un espace de travail dans une région de l'UE et un espace de travail dans une région des États-Unis" } }
    - { id: b, text: { en: "One workspace in a US region, with table-level RBAC on the European data", fr: "Un espace de travail dans une région des États-Unis, avec un RBAC au niveau des tables sur les données européennes" } }
    - { id: c, text: { en: "One workspace in an EU region for the logs of both subsidiaries", fr: "Un espace de travail dans une région de l'UE pour les journaux des deux filiales" } }
    - { id: d, text: { en: "One workspace per subscription, queried with cross-workspace queries", fr: "Un espace de travail par abonnement, interrogé par des requêtes interespaces de travail" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A workspace design starts with a single workspace and adds one only for a requirement such as data residency. Only the European logs have a location requirement, and the US logs can also be stored in the EU, so a single EU workspace meets the regulation. It keeps hunting in one place and combines the daily volumes to reach a higher commitment tier.
    fr: |
      Une conception d'espaces de travail commence par un seul espace de travail et n'en ajoute un que pour une exigence comme la résidence des données. Seuls les journaux européens ont une exigence d'emplacement, et les journaux américains peuvent aussi être stockés dans l'UE : un seul espace de travail dans l'UE respecte donc la réglementation. Il garde le repérage en un seul endroit et cumule les volumes quotidiens pour atteindre un niveau d'engagement plus élevé.
  options:
    a:
      en: |
        A US workspace isn't required by any residency rule; it adds a workspace, splits hunting and reduces the volume that counts toward each commitment tier.
      fr: |
        Aucune règle de résidence n'exige d'espace de travail aux États-Unis ; il ajoute un espace de travail, sépare le repérage et réduit le volume pris en compte pour chaque niveau d'engagement.
    b:
      en: |
        Access control doesn't change where data is stored; the European logs would leave the EU, which violates the regulation.
      fr: |
        Le contrôle d'accès ne change pas l'emplacement de stockage ; les journaux européens quitteraient l'UE, ce qui enfreint la réglementation.
    d:
      en: |
        Subscriptions aren't a reason to split workspaces; this multiplies workspaces and makes hunting slower and less convenient.
      fr: |
        Les abonnements ne sont pas une raison de séparer les espaces de travail ; cela multiplie les espaces de travail et rend le repérage plus lent et moins pratique.
references:
  - title: Design a Log Analytics workspace architecture
    url: https://learn.microsoft.com/en-us/azure/sentinel/best-practices-workspace-architecture
