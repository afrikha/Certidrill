id: sc100-2c-tenant-admin-controls
objective: "2.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Entra tenant with Microsoft Entra ID P2 licenses, Microsoft 365, and Azure subscriptions. Administrators have privileged access workstations (PAWs) that are managed by Microsoft Intune.

    You are designing the security of the tenant administration. The design must meet the requirements in the answer area.

    What should you include in the design for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P2, de Microsoft 365 et d'abonnements Azure. Les administrateurs disposent de stations de travail à accès privilégié (PAW) gérées par Microsoft Intune.

    Vous concevez la sécurité de l'administration du locataire. La conception doit répondre aux exigences de la zone de réponse.

    Que devez-vous inclure dans la conception pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Administrative portals are reachable only from the PAWs: [[dev]]

      The Global Administrator role is usable only when needed, for a limited time: [[jit]]

      Changes to cross-tenant access settings require phishing-resistant authentication when they're made, whatever role grants the permission: [[pa]]
    fr: |
      Les portails d'administration ne sont accessibles que depuis les PAW : [[dev]]

      Le rôle Global Administrator n'est utilisable qu'en cas de besoin, pour une durée limitée : [[jit]]

      Les modifications des paramètres d'accès interlocataire exigent une authentification résistante au hameçonnage au moment où elles sont faites, quel que soit le rôle qui accorde l'autorisation : [[pa]]
  slots:
    - id: dev
      options:
        - { id: ca, text: { en: "A Conditional Access policy for the administrative roles with a filter for devices that matches the PAWs", fr: "Une stratégie d'accès conditionnel pour les rôles d'administration avec un filtre d'appareils qui correspond aux PAW" } }
        - { id: comp, text: { en: "An Intune compliance policy assigned to the PAWs", fr: "Une stratégie de conformité Intune affectée aux PAW" } }
        - { id: idp, text: { en: "A Microsoft Entra ID Protection sign-in risk policy", fr: "Une stratégie de risque de connexion Microsoft Entra ID Protection" } }
    - id: jit
      options:
        - { id: pim, text: { en: "An eligible assignment in Privileged Identity Management", fr: "Une attribution éligible dans Privileged Identity Management" } }
        - { id: review, text: { en: "A monthly access review of the role", fr: "Une révision d'accès mensuelle du rôle" } }
        - { id: pkg, text: { en: "An entitlement management access package", fr: "Un package d'accès de la gestion des droits d'utilisation" } }
    - id: pa
      options:
        - { id: prot, text: { en: "A protected action linked to an authentication context", fr: "Une action protégée liée à un contexte d'authentification" } }
        - { id: pimapp, text: { en: "Approval for the activation of the Security Administrator role in PIM", fr: "Une approbation pour l'activation du rôle Security Administrator dans PIM" } }
        - { id: rmau, text: { en: "A restricted management administrative unit", fr: "Une unité administrative de gestion restreinte" } }
answer:
  values: { dev: ca, jit: pim, pa: prot }
explanation:
  correct:
    en: |
      Conditional Access enforces where administrators sign in from: a policy that targets the administrative roles and allows only devices matching the PAWs blocks other devices. PIM eligible assignments make Global Administrator usable only after activation, for a limited duration. Protected actions tie permissions such as updating cross-tenant access settings to an authentication context, so Conditional Access applies when the action is performed, regardless of the role that grants the permission.
    fr: |
      L'accès conditionnel impose l'origine des connexions des administrateurs : une stratégie qui cible les rôles d'administration et n'autorise que les appareils correspondant aux PAW bloque les autres appareils. Les attributions éligibles de PIM rendent Global Administrator utilisable seulement après activation, pour une durée limitée. Les actions protégées lient des autorisations comme la mise à jour des paramètres d'accès interlocataire à un contexte d'authentification : l'accès conditionnel s'applique au moment où l'action est effectuée, quel que soit le rôle qui accorde l'autorisation.
  options:
    comp:
      en: "A compliance policy only marks devices as compliant or not; without Conditional Access, nothing blocks sign-ins from other devices."
      fr: "Une stratégie de conformité ne fait que marquer les appareils comme conformes ou non ; sans accès conditionnel, rien ne bloque les connexions depuis d'autres appareils."
    pimapp:
      en: "PIM approval applies when one role is activated, not when the action is performed, and other roles can also grant the permission."
      fr: "L'approbation PIM s'applique à l'activation d'un rôle, pas au moment de l'action, et d'autres rôles peuvent aussi accorder l'autorisation."
    review:
      en: "An access review decides whether someone keeps the role; it doesn't limit when the role is active."
      fr: "Une révision d'accès décide si quelqu'un garde le rôle ; elle ne limite pas quand le rôle est actif."
references:
  - title: What are protected actions in Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/protected-actions-overview
  - title: Why are privileged access devices important
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-devices
