id: sc100-sr2-ar-3
objective: "2.3.6"
type: series_yesno
series: sc100-sr2-guest-reviews
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You recommend one recurring review of all Microsoft 365 groups with guest users, reviewed by the group owners, that takes the recommendations when reviewers don't respond.
  fr: |
    Vous recommandez une révision récurrente de tous les groupes Microsoft 365 avec des utilisateurs invités, effectuée par les propriétaires des groupes, qui applique les recommandations en l'absence de réponse des réviseurs.
body:
  solution:
    en: |
      You recommend a single access review with the following settings:

      - Scope: **All Microsoft 365 groups with guest users**, **Guest users only**
      - Reviewers: **Group owner(s)**
      - Recurrence: **Quarterly**, end date **Never**
      - **Auto apply results to resource**: enabled
      - **If reviewers don't respond**: **Take recommendations**
    fr: |
      Vous recommandez une seule révision d'accès avec les paramètres suivants :

      - Étendue : **All Microsoft 365 groups with guest users**, **Guest users only**
      - Réviseurs : **Group owner(s)**
      - Périodicité : **Quarterly**, date de fin **Never**
      - **Auto apply results to resource** : activé
      - **If reviewers don't respond** : **Take recommendations**
answer: { value: false }
explanation:
  correct:
    en: |
      Take recommendations applies the system's recommendation to the guests that no owner reviewed. A guest is recommended for denial when they haven't signed in during the last 30 days, so a guest who signed in recently can be approved even though no owner approved them. The requirement that every guest not explicitly approved loses membership needs Remove access.
    fr: |
      Take recommendations applique la recommandation du système aux invités qu'aucun propriétaire n'a révisés. Un invité reçoit une recommandation de refus lorsqu'il ne s'est pas connecté au cours des 30 derniers jours : un invité qui s'est connecté récemment peut donc être approuvé alors qu'aucun propriétaire ne l'a approuvé. L'exigence selon laquelle tout invité non explicitement approuvé perd son appartenance nécessite Remove access.
references:
  - title: Review recommendations for Access reviews
    url: https://learn.microsoft.com/en-us/entra/id-governance/review-recommendations-access-reviews
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
