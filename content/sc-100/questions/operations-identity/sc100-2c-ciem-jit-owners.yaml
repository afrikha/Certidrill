id: sc100-2c-ciem-jit-owners
objective: "2.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has 20 Azure subscriptions and 15 GCP projects. The GCP projects are connected to Microsoft Defender for Cloud. An audit found the following issues:

    - Twelve users hold permanent Owner assignments on the Azure subscriptions.
    - Many GCP service accounts hold roles whose permissions they never use.

    You need to recommend a solution that meets the following requirements:

    - The Owner role can be used only after an approved, time-limited activation.
    - The unused permissions of the GCP service accounts are identified, with right-sizing recommendations, in Defender for Cloud.

    Which two components should you include in the recommendation?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose de 20 abonnements Azure et de 15 projets GCP. Les projets GCP sont connectés à Microsoft Defender pour le cloud. Un audit a relevé les problèmes suivants :

    - Douze utilisateurs détiennent des attributions Owner permanentes sur les abonnements Azure.
    - De nombreux comptes de service GCP détiennent des rôles dont ils n'utilisent jamais les autorisations.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Le rôle Owner n'est utilisable qu'après une activation approuvée et limitée dans le temps.
    - Les autorisations inutilisées des comptes de service GCP sont identifiées, avec des recommandations d'ajustement, dans Defender pour le cloud.

    Quels sont les deux composants à inclure dans la recommandation ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Quarterly access reviews of the Owner role assignments on the subscriptions", fr: "Des révisions d'accès trimestrielles des attributions du rôle Owner sur les abonnements" } }
    - { id: b, text: { en: "Microsoft Entra Privileged Identity Management for Azure resources, with eligible Owner assignments that require approval", fr: "Microsoft Entra Privileged Identity Management pour les ressources Azure, avec des attributions Owner éligibles qui exigent une approbation" } }
    - { id: c, text: { en: "Microsoft Entra Permissions Management, with the GCP projects onboarded as an authorization system", fr: "Microsoft Entra Permissions Management, avec les projets GCP intégrés comme système d'autorisation" } }
    - { id: d, text: { en: "The Defender CSPM plan enabled on the GCP connector, for its CIEM capabilities", fr: "Le plan Defender CSPM activé sur le connecteur GCP, pour ses fonctionnalités CIEM" } }
    - { id: e, text: { en: "Azure Policy assignments that audit role assignments in the GCP projects", fr: "Des attributions Azure Policy qui auditent les attributions de rôles dans les projets GCP" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      PIM for Azure resources replaces permanent Owner assignments with eligible ones that are activated for a limited time, with approval. CIEM, part of the Defender CSPM plan, analyzes GCP IAM users, groups and service accounts and recommends right-sizing overprovisioned permissions based on actual usage, in Defender for Cloud.
    fr: |
      PIM pour les ressources Azure remplace les attributions Owner permanentes par des attributions éligibles activées pour une durée limitée, avec approbation. La CIEM, qui fait partie du plan Defender CSPM, analyse les utilisateurs, groupes et comptes de service IAM GCP et recommande d'ajuster les autorisations surprovisionnées selon l'utilisation réelle, dans Defender pour le cloud.
  options:
    a:
      en: "Access reviews recertify the Owner assignments, but the role stays permanently active between reviews."
      fr: "Les révisions d'accès recertifient les attributions Owner, mais le rôle reste actif en permanence entre deux révisions."
    c:
      en: "Microsoft Entra Permissions Management is deprecated; CIEM in Defender for Cloud is the current solution, and the requirement asks for Defender for Cloud."
      fr: "Microsoft Entra Permissions Management est déprécié ; la CIEM de Defender pour le cloud est la solution actuelle, et l'exigence demande Defender pour le cloud."
    e:
      en: "Azure Policy evaluates Azure Resource Manager resources; it can't evaluate GCP IAM role bindings or measure permission usage."
      fr: "Azure Policy évalue les ressources Azure Resource Manager ; il ne peut pas évaluer les liaisons de rôles IAM GCP ni mesurer l'utilisation des autorisations."
references:
  - title: Cloud infrastructure entitlement management (CIEM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/permissions-management
