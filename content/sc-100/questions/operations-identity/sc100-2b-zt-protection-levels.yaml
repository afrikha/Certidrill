id: sc100-2b-zt-protection-levels
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is checking its Conditional Access policies against the Zero Trust identity and device access configurations recommended by Microsoft. Litware assigns users to three groups that match the protection levels: starting point, enterprise and specialized security. Users have Microsoft Entra ID P2 licenses.

    Which MFA condition should each group's policy use? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. vérifie ses stratégies d'accès conditionnel par rapport aux configurations d'accès des identités et des appareils Confiance Zéro recommandées par Microsoft. Litware répartit les utilisateurs en trois groupes qui correspondent aux niveaux de protection : point de départ, entreprise et sécurité spécialisée. Les utilisateurs disposent de licences Microsoft Entra ID P2.

    Quelle condition de MFA la stratégie de chaque groupe doit-elle utiliser ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Starting point: require MFA when [[sp]]

      Enterprise: require MFA when [[ent]]

      Specialized security: require MFA for [[spec]]
    fr: |
      Point de départ : exiger la MFA quand [[sp]]

      Entreprise : exiger la MFA quand [[ent]]

      Sécurité spécialisée : exiger la MFA pour [[spec]]
  slots:
    - id: sp
      options:
        - { id: high, text: { en: "sign-in risk is high", fr: "le risque de connexion est élevé" } }
        - { id: medhigh, text: { en: "sign-in risk is medium or high", fr: "le risque de connexion est moyen ou élevé" } }
        - { id: lowup, text: { en: "sign-in risk is low, medium or high", fr: "le risque de connexion est faible, moyen ou élevé" } }
    - id: ent
      options:
        - { id: high, text: { en: "sign-in risk is high", fr: "le risque de connexion est élevé" } }
        - { id: medhigh, text: { en: "sign-in risk is medium or high", fr: "le risque de connexion est moyen ou élevé" } }
        - { id: lowup, text: { en: "sign-in risk is low, medium or high", fr: "le risque de connexion est faible, moyen ou élevé" } }
    - id: spec
      options:
        - { id: risky, text: { en: "sessions with medium or high sign-in risk", fr: "les sessions avec un risque de connexion moyen ou élevé" } }
        - { id: new, text: { en: "all new sessions", fr: "toutes les nouvelles sessions" } }
        - { id: unmanaged, text: { en: "sessions from unmanaged devices only", fr: "les sessions depuis des appareils non gérés uniquement" } }
answer:
  values: { sp: medhigh, ent: lowup, spec: new }
explanation:
  correct:
    en: |-
      In Microsoft's Zero Trust identity and device access configurations, the starting point level enforces MFA when sign-in risk is medium or high, the enterprise level lowers the threshold to low, medium or high sign-in risk, and the specialized security level enforces MFA for all new sessions. High-risk users must change their password at all three levels.
    fr: |-
      Dans les configurations d'accès des identités et des appareils Confiance Zéro de Microsoft, le niveau point de départ impose la MFA quand le risque de connexion est moyen ou élevé, le niveau entreprise abaisse le seuil à un risque de connexion faible, moyen ou élevé, et le niveau sécurité spécialisée impose la MFA pour toutes les nouvelles sessions. Les utilisateurs à risque élevé doivent changer leur mot de passe aux trois niveaux.
references:
  - title: Zero Trust identity and device access configurations
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-identity-device-access-policies-overview
