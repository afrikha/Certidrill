id: sc100-cs2a-service-accounts
objective: "2.3.3"
type: dropdown
caseStudy: sc100-cs2a-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that addresses the audit findings about the service accounts and about the attacks against AD DS. The solution must meet the identity and endpoint requirements.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution qui corrige les constats d'audit sur les comptes de service et sur les attaques contre AD DS. La solution doit répondre aux exigences d'identité et de points de terminaison.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Accounts that run the services, including the web farm: [[account]]

      Detection of attacks against AD DS: [[detect]]
    fr: |
      Comptes qui exécutent les services, y compris la batterie web : [[account]]

      Détection des attaques contre AD DS : [[detect]]
  slots:
    - id: account
      options:
        - { id: smsa, text: { en: "Standalone managed service accounts (sMSAs)", fr: "Comptes de service administrés autonomes (sMSA)" } }
        - { id: gmsa, text: { en: "Group managed service accounts (gMSAs)", fr: "Comptes de service administrés de groupe (gMSA)" } }
        - { id: fgpp, text: { en: "User accounts with a fine-grained password policy that requires 30 characters", fr: "Comptes d'utilisateur avec une stratégie de mot de passe affinée qui exige 30 caractères" } }
    - id: detect
      options:
        - { id: idp, text: { en: "Microsoft Entra ID Protection risk detections", fr: "Détections de risque de Microsoft Entra ID Protection" } }
        - { id: mdi, text: { en: "Microsoft Defender for Identity sensors on the domain controllers and the Microsoft Entra Connect server", fr: "Capteurs Microsoft Defender for Identity sur les contrôleurs de domaine et le serveur Microsoft Entra Connect" } }
        - { id: sentinel, text: { en: "Microsoft Sentinel analytics rules on the Microsoft Entra sign-in logs", fr: "Règles d'analyse Microsoft Sentinel sur les journaux de connexion Microsoft Entra" } }
answer:
  values: { account: gmsa, detect: mdi }
explanation:
  correct:
    en: |
      With a gMSA, the domain computes and changes the password automatically, and several servers can use the same account, which covers the web farm with no administrative effort. Defender for Identity sensors installed on all the domain controllers, and on the Microsoft Entra Connect, AD FS and AD CS servers, analyze Kerberos and NTLM activity to detect attacks such as credential theft, lateral movement and forged tickets. Defender for Identity is included in Microsoft 365 E5, so no new license is needed.
    fr: |
      Avec un gMSA, le domaine calcule et change le mot de passe automatiquement, et plusieurs serveurs peuvent utiliser le même compte, ce qui couvre la batterie web sans effort d'administration. Les capteurs Defender for Identity installés sur tous les contrôleurs de domaine, ainsi que sur les serveurs Microsoft Entra Connect, AD FS et AD CS, analysent l'activité Kerberos et NTLM pour détecter des attaques comme le vol d'informations d'identification, le mouvement latéral et les tickets falsifiés. Defender for Identity est inclus dans Microsoft 365 E5 ; aucune nouvelle licence n'est donc nécessaire.
  options:
    smsa:
      en: An sMSA can be used on a single server only, so the four servers of the web farm couldn't share it.
      fr: Un sMSA ne peut être utilisé que sur un seul serveur ; les quatre serveurs de la batterie web ne pourraient donc pas le partager.
    fgpp:
      en: A fine-grained password policy makes the passwords longer, but someone must still choose and change them, which doesn't meet the no-effort rotation requirement.
      fr: Une stratégie de mot de passe affinée allonge les mots de passe, mais quelqu'un doit encore les choisir et les changer, ce qui ne répond pas à l'exigence de renouvellement sans effort.
    idp:
      en: ID Protection evaluates Microsoft Entra sign-ins and users; it doesn't see Kerberos traffic on the on-premises domain controllers.
      fr: ID Protection évalue les connexions et les utilisateurs Microsoft Entra ; il ne voit pas le trafic Kerberos sur les contrôleurs de domaine locaux.
    sentinel:
      en: Microsoft Entra sign-in logs don't contain the Kerberos ticket requests processed by the on-premises domain controllers.
      fr: Les journaux de connexion Microsoft Entra ne contiennent pas les demandes de tickets Kerberos traitées par les contrôleurs de domaine locaux.
references:
  - title: Group Managed Service Accounts overview
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/group-managed-service-accounts-overview
  - title: Deploy Microsoft Defender for Identity sensors
    url: https://learn.microsoft.com/en-us/defender-for-identity/deploy/deploy-defender-identity
