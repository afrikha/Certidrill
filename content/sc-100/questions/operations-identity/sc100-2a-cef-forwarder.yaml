id: sc100-2a-cef-forwarder
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has network appliances in an on-premises datacenter that can only send their security events as Common Event Format (CEF) messages over Syslog. No agent can be installed on the appliances.

    You need to recommend how to bring these events into Microsoft Sentinel by using the currently supported agent.

    What should you include in the recommendation?
  fr: |
    Woodgrove Bank dispose d'appliances réseau dans un centre de données local qui ne peuvent envoyer leurs événements de sécurité que sous forme de messages CEF (Common Event Format) sur Syslog. Aucun agent ne peut être installé sur les appliances.

    Vous devez recommander comment amener ces événements dans Microsoft Sentinel avec l'agent actuellement pris en charge.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "An Arc-enabled Linux log forwarder that runs the Azure Monitor Agent", fr: "Un redirecteur de journaux Linux compatible Arc qui exécute l'agent Azure Monitor" } }
    - { id: b, text: { en: "A Windows server that runs the Log Analytics agent as a Syslog collector", fr: "Un serveur Windows qui exécute l'agent Log Analytics comme collecteur Syslog" } }
    - { id: c, text: { en: "A Defender for Cloud Apps log collector that uploads the appliance logs", fr: "Un collecteur de journaux Defender for Cloud Apps qui charge les journaux des appliances" } }
    - { id: d, text: { en: "An Azure event hub that receives the Syslog messages from the appliances", fr: "Un hub d'événements Azure qui reçoit les messages Syslog des appliances" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The CEF via AMA connector uses a designated Linux machine as a log forwarder: the appliances send their messages to its Syslog daemon, and the Azure Monitor Agent sends them to the workspace according to a data collection rule. A forwarder that isn't an Azure virtual machine must have the Azure Arc Connected Machine agent.
    fr: |
      Le connecteur CEF via AMA utilise une machine Linux dédiée comme redirecteur de journaux : les appliances envoient leurs messages à son démon Syslog, et l'agent Azure Monitor les envoie à l'espace de travail selon une règle de collecte de données. Un redirecteur qui n'est pas une machine virtuelle Azure doit disposer de l'agent Azure Arc Connected Machine.
  options:
    b:
      en: |
        The Log Analytics agent is retired, and the supported forwarder design uses a Linux machine with a Syslog daemon.
      fr: |
        L'agent Log Analytics est retiré, et la conception de redirecteur prise en charge utilise une machine Linux avec un démon Syslog.
    c:
      en: |
        The Defender for Cloud Apps log collector feeds cloud discovery (shadow IT), not Sentinel detections.
      fr: |
        Le collecteur de journaux Defender for Cloud Apps alimente la découverte cloud (shadow IT), pas les détections Sentinel.
    d:
      en: |
        The appliances can't send Syslog directly to an event hub, and this isn't the supported collection path for CEF into Sentinel.
      fr: |
        Les appliances ne peuvent pas envoyer de Syslog directement à un hub d'événements, et ce n'est pas le chemin de collecte pris en charge pour le CEF vers Sentinel.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel - AMA
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
