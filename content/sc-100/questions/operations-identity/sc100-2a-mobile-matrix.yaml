id: sc100-2a-mobile-matrix
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has 3,000 field technicians who use Android and iOS phones enrolled in Microsoft Intune and protected by Microsoft Defender for Endpoint. The CISO asks you to evaluate how well the current detections cover the adversary techniques that target these phones, such as malicious apps and network-based attacks on the devices.

    Which framework should you use to map the techniques?
  fr: |
    Contoso, Ltd. compte 3 000 techniciens de terrain qui utilisent des téléphones Android et iOS inscrits dans Microsoft Intune et protégés par Microsoft Defender for Endpoint. Le RSSI vous demande d'évaluer dans quelle mesure les détections actuelles couvrent les techniques d'adversaires qui ciblent ces téléphones, comme les applications malveillantes et les attaques réseau sur les appareils.

    Quel framework devez-vous utiliser pour mapper les techniques ?
body:
  options:
    - { id: a, text: { en: "The MITRE ATT&CK Enterprise matrix", fr: "La matrice MITRE ATT&CK Enterprise" } }
    - { id: b, text: { en: "The MITRE ATT&CK for ICS matrix", fr: "La matrice MITRE ATT&CK for ICS" } }
    - { id: c, text: { en: "The Microsoft cloud security benchmark", fr: "Le benchmark de sécurité cloud Microsoft" } }
    - { id: d, text: { en: "The MITRE ATT&CK Mobile matrix", fr: "La matrice MITRE ATT&CK Mobile" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      MITRE ATT&CK has three matrices: Enterprise, Mobile and ICS. The Mobile matrix describes the tactics and techniques that target Android and iOS devices, so it is the reference for evaluating detection coverage of the technicians' phones.
    fr: |
      MITRE ATT&CK comprend trois matrices : Enterprise, Mobile et ICS. La matrice Mobile décrit les tactiques et techniques qui ciblent les appareils Android et iOS : c'est la référence pour évaluer la couverture de détection des téléphones des techniciens.
  options:
    a:
      en: |
        The Enterprise matrix covers Windows, macOS, Linux, cloud platforms, network devices and containers, not Android and iOS devices.
      fr: |
        La matrice Enterprise couvre Windows, macOS, Linux, les plateformes cloud, les périphériques réseau et les conteneurs, pas les appareils Android et iOS.
    b:
      en: |
        The ICS matrix covers industrial control systems such as PLCs and HMIs.
      fr: |
        La matrice ICS couvre les systèmes de contrôle industriels comme les automates et les IHM.
    c:
      en: |
        The Microsoft cloud security benchmark is a set of security controls and recommendations for cloud workloads, not a catalog of adversary techniques.
      fr: |
        Le benchmark de sécurité cloud Microsoft est un ensemble de contrôles et de recommandations de sécurité pour les charges de travail cloud, pas un catalogue de techniques d'adversaires.
references:
  - title: View MITRE ATT&CK Coverage in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
