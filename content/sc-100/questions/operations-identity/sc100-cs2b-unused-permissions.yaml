id: sc100-cs2b-unused-permissions
objective: "2.3.5"
type: single
caseStudy: sc100-cs2b-vanarsdel-payments
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to identify the identities that hold permissions they don't use in the three clouds. The solution must meet the posture management requirements and the general requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour identifier les identités qui détiennent des autorisations qu'elles n'utilisent pas dans les trois clouds. La solution doit répondre aux exigences de gestion de la posture et aux exigences générales.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra access reviews of the service principals, with recommendations based on sign-in activity", fr: "Des révisions d'accès Microsoft Entra des principaux de service, avec des recommandations basées sur l'activité de connexion" } }
    - { id: b, text: { en: "Microsoft Entra Privileged Identity Management with eligible assignments for the Azure roles", fr: "Microsoft Entra Privileged Identity Management avec des attributions éligibles pour les rôles Azure" } }
    - { id: c, text: { en: "Cloud infrastructure entitlement management (CIEM) in the Defender CSPM plan", fr: "La gestion des droits d'utilisation de l'infrastructure cloud (CIEM) du plan Defender CSPM" } }
    - { id: d, text: { en: "Azure Policy assignments that audit the role assignments in MG-VanArsdel", fr: "Des attributions Azure Policy qui auditent les attributions de rôles dans MG-VanArsdel" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CIEM is part of the Defender CSPM plan and covers Microsoft Entra users, groups and service principals, AWS IAM users, roles and groups, and GCP IAM users, groups and service accounts. It flags inactive and overprovisioned identities and recommends right-sizing their permissions based on actual usage, and it correlates them with attack paths, all from Defender for Cloud.
    fr: |
      CIEM fait partie du plan Defender CSPM et couvre les utilisateurs, les groupes et les principaux de service Microsoft Entra, les utilisateurs, les rôles et les groupes IAM AWS, ainsi que les utilisateurs, les groupes et les comptes de service IAM GCP. Il signale les identités inactives et surprovisionnées, recommande d'ajuster leurs autorisations en fonction de leur utilisation réelle et les met en relation avec les chemins d'attaque, le tout depuis Defender for Cloud.
  options:
    a:
      en: Access reviews certify Microsoft Entra access; they don't analyze the permissions used by AWS IAM roles or GCP service accounts.
      fr: Les révisions d'accès certifient des accès Microsoft Entra ; elles n'analysent pas les autorisations utilisées par les rôles IAM AWS ou les comptes de service GCP.
    b:
      en: PIM provides just-in-time activation of Microsoft Entra and Azure roles; it doesn't measure unused permissions in AWS or GCP.
      fr: PIM fournit l'activation juste-à-temps des rôles Microsoft Entra et Azure ; il ne mesure pas les autorisations inutilisées dans AWS ou GCP.
    d:
      en: Azure Policy evaluates the configuration of Azure resources only, and it doesn't compare granted permissions with their use.
      fr: Azure Policy évalue uniquement la configuration des ressources Azure, et il ne compare pas les autorisations accordées à leur utilisation.
references:
  - title: Cloud infrastructure entitlement management (CIEM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/permissions-management
