id: sc100-2a-automation-layers
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has Microsoft 365 E5 and uses Microsoft Sentinel in the Microsoft Defender portal. You are designing the security orchestration, automation and response (SOAR) layer. For each requirement, you must choose the mechanism that meets it with the least custom development.

    Which mechanism should you recommend for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose de Microsoft 365 E5 et utilise Microsoft Sentinel dans le portail Microsoft Defender. Vous concevez la couche d'orchestration de la sécurité et de réponse automatisée (SOAR). Pour chaque exigence, vous devez choisir le mécanisme qui y répond avec le moins de développement personnalisé.

    Quel mécanisme devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les mécanismes appropriés vers les exigences correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rule, text: { en: "Sentinel automation rule", fr: "Règle d'automatisation Sentinel" } }
    - { id: playbook, text: { en: "Sentinel playbook", fr: "Playbook Sentinel" } }
    - { id: air, text: { en: "Automated investigation and response (AIR)", fr: "Examen et réponse automatisés (AIR)" } }
    - { id: disruption, text: { en: "Automatic attack disruption", fr: "Interruption automatique des attaques" } }
    - { id: analytics, text: { en: "Scheduled analytics rule", fr: "Règle d'analyse planifiée" } }
  targets:
    - id: t1
      text: { en: "Raise the severity of incidents from one analytics rule and assign them to the tier-2 team", fr: "Augmenter la gravité des incidents d'une règle d'analyse et les attribuer à l'équipe de niveau 2" }
    - id: t2
      text: { en: "Block an attacker's IP address on a third-party firewall through its REST API", fr: "Bloquer l'adresse IP d'un attaquant sur un pare-feu tiers au moyen de son API REST" }
    - id: t3
      text: { en: "Investigate a suspicious email alert and queue remediation of the malicious messages for approval", fr: "Investiguer une alerte d'e-mail suspect et mettre en file d'attente la correction des messages malveillants pour approbation" }
    - id: t4
      text: { en: "Contain compromised users during a business email compromise attack in progress", fr: "Contenir les utilisateurs compromis pendant une attaque par compromission de messagerie en cours" }
answer:
  mapping: { t1: rule, t2: playbook, t3: air, t4: disruption }
explanation:
  correct:
    en: |
      Automation rules change severity, status and owner without code. A call to a third-party API needs a connector and steps, which is the role of a playbook. In Defender for Office 365, AIR investigates email alerts and queues remediation actions on the malicious messages for the SOC to approve. Automatic attack disruption contains compromised assets during attacks such as business email compromise. An analytics rule detects threats; it doesn't respond to them.
    fr: |
      Les règles d'automatisation changent la gravité, l'état et le propriétaire sans code. Un appel à une API tierce exige un connecteur et des étapes, ce qui est le rôle d'un playbook. Dans Defender for Office 365, l'AIR investigue les alertes de messagerie et met en file d'attente des actions de correction sur les messages malveillants, que le SOC approuve. L'interruption automatique des attaques contient les ressources compromises pendant des attaques comme la compromission de messagerie. Une règle d'analyse détecte des menaces ; elle n'y répond pas.
references:
  - title: Automated investigation and response in Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-xdr/m365d-autoir
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
