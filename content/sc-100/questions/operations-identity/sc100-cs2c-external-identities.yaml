id: sc100-cs2c-external-identities
objective: "2.2.4"
type: dragdrop
caseStudy: sc100-cs2c-southridge-video
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend an external identity solution for each of the following access requirements.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution d'identités externes pour chacune des exigences d'accès suivantes.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: trust, text: { en: "Inbound trust settings in the cross-tenant access settings", fr: "Paramètres d'approbation entrants dans les paramètres d'accès interlocataire" } }
    - { id: direct, text: "B2B direct connect" }
    - { id: eotp, text: { en: "Email one-time passcode authentication", fr: "Authentification par code secret à usage unique envoyé par e-mail" } }
    - { id: vid, text: "Microsoft Entra Verified ID" }
    - { id: sync, text: { en: "Cross-tenant synchronization", fr: "Synchronisation interlocataire" } }
  targets:
    - { id: t1, text: { en: "Accept the MFA that guest freelancers perform in their studio tenants", fr: "Accepter l'authentification multifacteur que les indépendants invités effectuent dans les locataires de leurs studios" } }
    - { id: t2, text: { en: "Shared channels with the sound engineers of Fabrikam Studios", fr: "Canaux partagés avec les ingénieurs du son de Fabrikam Studios" } }
    - { id: t3, text: { en: "Sign-in of the freelancers who use personal email addresses", fr: "Connexion des indépendants qui utilisent des adresses e-mail personnelles" } }
    - { id: t4, text: { en: "Proof of the accreditation of the translators", fr: "Preuve de l'accréditation des traducteurs" } }
answer:
  mapping: { t1: trust, t2: direct, t3: eotp, t4: vid }
explanation:
  correct:
    en: |
      Inbound trust settings let Conditional Access accept the MFA, compliant device and Microsoft Entra hybrid joined device claims that a user already satisfied in the home tenant. B2B direct connect is a mutual trust between two Microsoft Entra organizations that currently supports Teams shared channels, and the external users don't get guest objects in the resource tenant. Email one-time passcode authentication signs in guests whose domain has no Microsoft Entra directory or federation by sending a code to their email address. Verified ID verifies W3C verifiable credentials that an issuer, here the guild, signs and that the holder presents from a wallet such as Microsoft Authenticator.
    fr: |
      Les paramètres d'approbation entrants permettent à l'accès conditionnel d'accepter les revendications d'authentification multifacteur, d'appareil conforme et d'appareil joint à Microsoft Entra hybride qu'un utilisateur a déjà satisfaites dans son locataire d'origine. B2B direct connect est une relation d'approbation mutuelle entre deux organisations Microsoft Entra qui prend actuellement en charge les canaux partagés Teams, et les utilisateurs externes n'obtiennent pas d'objet invité dans le locataire de ressources. L'authentification par code secret à usage unique envoyé par e-mail connecte les invités dont le domaine n'a ni annuaire Microsoft Entra ni fédération, en envoyant un code à leur adresse e-mail. Verified ID vérifie des informations d'identification vérifiables W3C qu'un émetteur, ici la guilde, signe et que le titulaire présente depuis un portefeuille comme Microsoft Authenticator.
  options:
    sync:
      en: Cross-tenant synchronization creates and updates B2B users between tenants of the same organization; it creates accounts instead of avoiding them, and it doesn't verify credentials or sign in personal email users.
      fr: La synchronisation interlocataire crée et met à jour des utilisateurs B2B entre des locataires d'une même organisation ; elle crée des comptes au lieu de les éviter, et elle ne vérifie pas d'informations d'identification et ne connecte pas les utilisateurs d'adresses e-mail personnelles.
references:
  - title: Cross-tenant access overview
    url: https://learn.microsoft.com/en-us/entra/external-id/cross-tenant-access-overview
  - title: B2B direct connect Microsoft Entra overview
    url: https://learn.microsoft.com/en-us/entra/external-id/b2b-direct-connect-overview
