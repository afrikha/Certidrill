id: sc100-cs3c-vault-design
objective: "2.2.8"
type: multi
caseStudy: sc100-cs3c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a new design for the storage of the application secrets. The solution must meet the secrets requirements.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une nouvelle conception pour le stockage des secrets des applications. La solution doit respecter les exigences relatives aux secrets.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable purge protection on kv-trey-shared and keep it as the only vault", fr: "Activer la protection contre le vidage sur kv-trey-shared et le conserver comme seul coffre" } }
    - { id: b, text: { en: "Create one Key Vault per application, per environment and per region", fr: "Créer un coffre Key Vault par application, par environnement et par région" } }
    - { id: c, text: { en: "Grant each application's managed identity a vault access policy limited to its own secrets", fr: "Accorder à l'identité managée de chaque application une stratégie d'accès au coffre limitée à ses propres secrets" } }
    - { id: d, text: { en: "Use the Azure RBAC permission model on the vaults", fr: "Utiliser le modèle d'autorisation Azure RBAC sur les coffres" } }
    - { id: e, text: { en: "Move the secrets to the Premium tier so that they're protected by HSMs", fr: "Déplacer les secrets vers le niveau Premium pour qu'ils soient protégés par des HSM" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      Microsoft recommends one vault per application, region and environment, because grouping secrets in one vault increases the blast radius of a security event. Legacy vault access policies don't support Privileged Identity Management, whereas Azure RBAC role assignments can be made eligible in PIM for just-in-time access.
    fr: |-
      Microsoft recommande un coffre par application, par région et par environnement, car regrouper les secrets dans un seul coffre augmente le rayon d'impact d'un incident de sécurité. Les stratégies d'accès au coffre héritées ne prennent pas en charge Privileged Identity Management, alors que les attributions de rôles Azure RBAC peuvent être rendues éligibles dans PIM pour un accès juste-à-temps.
  options:
    a:
      en: |-
        Purge protection guards against the permanent deletion of objects, but a single shared vault keeps the blast radius that the requirements forbid.
      fr: |-
        La protection contre le vidage protège contre la suppression définitive d'objets, mais un coffre partagé unique conserve le rayon d'impact que les exigences interdisent.
    c:
      en: |-
        Vault access policies grant permissions on the whole vault, not on individual secrets, and they don't support PIM.
      fr: |-
        Les stratégies d'accès au coffre accordent des autorisations sur tout le coffre, pas sur des secrets individuels, et elles ne prennent pas en charge PIM.
    e:
      en: |-
        HSM protection applies to keys and changes how they're stored; it doesn't separate the secrets of the applications or provide just-in-time access.
      fr: |-
        La protection HSM s'applique aux clés et change leur mode de stockage ; elle ne sépare pas les secrets des applications et n'offre pas d'accès juste-à-temps.
references:
  - title: Secure your Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/best-practices
