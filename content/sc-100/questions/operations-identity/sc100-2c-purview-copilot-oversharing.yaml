id: sc100-2c-purview-copilot-oversharing
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. plans to roll out Microsoft 365 Copilot to 5,000 users. The data protection officer is concerned that Copilot could surface sensitive files from SharePoint sites that are shared too broadly.

    You need to recommend a Microsoft Purview solution that finds the potentially overshared SharePoint sites before the rollout, and then gives insights into the sensitive information in Copilot prompts and responses, with ready-to-use policies to protect it.

    What should you recommend?
  fr: |
    Contoso, Ltd. prévoit de déployer Microsoft 365 Copilot auprès de 5 000 utilisateurs. Le délégué à la protection des données craint que Copilot ne fasse apparaître des fichiers sensibles de sites SharePoint partagés trop largement.

    Vous devez recommander une solution Microsoft Purview qui trouve les sites SharePoint potentiellement surpartagés avant le déploiement, puis donne une visibilité sur les informations sensibles des invites et des réponses de Copilot, avec des stratégies prêtes à l'emploi pour les protéger.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Purview Communication Compliance", fr: "Microsoft Purview Communication Compliance" } }
    - { id: b, text: { en: "Microsoft Purview Compliance Manager", fr: "Gestionnaire de conformité Microsoft Purview" } }
    - { id: c, text: { en: "Microsoft Purview eDiscovery", fr: "Microsoft Purview eDiscovery" } }
    - { id: d, text: { en: "Microsoft Purview Data Security Posture Management", fr: "Microsoft Purview Data Security Posture Management" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Data Security Posture Management, which replaces the classic DSPM for AI, secures the data that Copilots, agents and other AI apps use. Its data risk assessments find and help fix potential oversharing in SharePoint sites, its reports show AI activity and the sensitive information in interactions, and its one-click policies apply protections such as DLP.
    fr: |
      Data Security Posture Management, qui remplace la version classique de DSPM for AI, sécurise les données qu'utilisent les Copilots, les agents et les autres applications d'IA. Ses évaluations des risques liés aux données trouvent le surpartage potentiel dans les sites SharePoint et aident à le corriger, ses rapports montrent l'activité d'IA et les informations sensibles des interactions, et ses stratégies en un clic appliquent des protections comme la DLP.
  options:
    a:
      en: "Communication Compliance can review Copilot prompts and responses for inappropriate content, but it doesn't assess SharePoint oversharing."
      fr: "Communication Compliance peut examiner les invites et les réponses de Copilot pour détecter du contenu inapproprié, mais il n'évalue pas le surpartage SharePoint."
    b:
      en: "Compliance Manager tracks improvement actions for regulations; it doesn't scan SharePoint sites for overshared content."
      fr: "Le Gestionnaire de conformité suit les actions d'amélioration des réglementations ; il n'analyse pas les sites SharePoint à la recherche de contenu surpartagé."
    c:
      en: "eDiscovery searches and preserves content for investigations; it doesn't assess sharing risk or offer AI protection policies."
      fr: "eDiscovery recherche et conserve du contenu pour les enquêtes ; il n'évalue pas le risque de partage et n'offre pas de stratégies de protection pour l'IA."
references:
  - title: Learn how Microsoft Purview Data Security Posture Management for AI provides data security and compliance protections for Copilots and other generative AI apps - (classic)
    url: https://learn.microsoft.com/en-us/purview/dspm-for-ai
