id: sc100-2c-adds-forest-recovery
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has an on-premises Active Directory Domain Services (AD DS) forest with four domain controllers in two sites. The domain controllers are backed up every night to a file share on a domain-joined server.

    A ransomware risk assessment concludes that an attacker who obtains Domain Admins rights could encrypt every domain controller at the same time. The board requires that Litware can restore AD DS after such an attack.

    What should you recommend?
  fr: |
    Litware, Inc. dispose d'une forêt Active Directory Domain Services (AD DS) locale avec quatre contrôleurs de domaine répartis sur deux sites. Les contrôleurs de domaine sont sauvegardés chaque nuit sur un partage de fichiers d'un serveur joint au domaine.

    Une évaluation du risque de rançongiciel conclut qu'un attaquant qui obtient les droits Domain Admins pourrait chiffrer tous les contrôleurs de domaine en même temps. Le conseil d'administration exige que Litware puisse restaurer AD DS après une telle attaque.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A documented, regularly tested forest recovery plan that uses domain controller backups kept offline or in immutable storage", fr: "Un plan de récupération de forêt documenté et testé régulièrement, qui utilise des sauvegardes de contrôleurs de domaine conservées hors ligne ou dans un stockage immuable" } }
    - { id: b, text: { en: "Two additional domain controllers in a third site, so that replication keeps a healthy copy of the directory", fr: "Deux contrôleurs de domaine supplémentaires dans un troisième site, pour que la réplication conserve une copie saine de l'annuaire" } }
    - { id: c, text: { en: "Microsoft Entra Connect, so that the forest can be rebuilt from the objects synchronized to Microsoft Entra ID", fr: "Microsoft Entra Connect, pour que la forêt puisse être reconstruite à partir des objets synchronisés dans Microsoft Entra ID" } }
    - { id: d, text: { en: "Microsoft Defender for Identity sensors on every domain controller, so that the attack is detected while it runs", fr: "Des capteurs Microsoft Defender for Identity sur chaque contrôleur de domaine, pour détecter l'attaque pendant son déroulement" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When every domain controller is lost, only a forest recovery restores AD DS, and Microsoft provides a forest recovery guide to build a custom plan from. The backups must be out of reach of an attacker who holds Domain Admins rights, so a share on a domain-joined server isn't enough, and the plan must be tested so the restore works when it's needed.
    fr: |
      Quand tous les contrôleurs de domaine sont perdus, seule une récupération de forêt restaure AD DS, et Microsoft fournit un guide de récupération de forêt à partir duquel construire un plan adapté. Les sauvegardes doivent être hors de portée d'un attaquant qui détient les droits Domain Admins : un partage sur un serveur joint au domaine ne suffit pas, et le plan doit être testé pour que la restauration fonctionne le jour où elle est nécessaire.
  options:
    b:
      en: "Additional domain controllers are just as reachable by the attacker, and replication copies the attacker's changes; they add availability, not recoverability."
      fr: "Des contrôleurs de domaine supplémentaires sont tout aussi accessibles à l'attaquant, et la réplication copie ses modifications ; ils apportent de la disponibilité, pas de la capacité de récupération."
    c:
      en: "Microsoft Entra Connect synchronizes objects to the cloud; it isn't a backup of AD DS and can't restore a forest."
      fr: "Microsoft Entra Connect synchronise des objets vers le cloud ; ce n'est pas une sauvegarde d'AD DS et il ne peut pas restaurer une forêt."
    d:
      en: "Detection is useful, but it doesn't give Litware a way to restore the directory once the domain controllers are encrypted."
      fr: "La détection est utile, mais elle ne donne pas à Litware le moyen de restaurer l'annuaire une fois les contrôleurs de domaine chiffrés."
references:
  - title: Active Directory Forest Recovery Guide
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/forest-recovery-guide/ad-forest-recovery-guide
