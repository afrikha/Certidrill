id: sc100-2b-verified-id-design
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank wants to issue proof-of-employment credentials by using Microsoft Entra Verified ID. Employees will present them to Proseware, Inc., an insurer that offers group rates. Proseware doesn't use Microsoft Entra ID and has no integration with Woodgrove's systems. The credentials must remain under the employees' control.

    Which two statements about the proposed design are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank veut émettre des informations d'identification de preuve d'emploi avec Microsoft Entra Verified ID. Les employés les présenteront à Proseware, Inc., un assureur qui propose des tarifs de groupe. Proseware n'utilise pas Microsoft Entra ID et n'a aucune intégration avec les systèmes de Woodgrove. Les informations d'identification doivent rester sous le contrôle des employés.

    Quelles sont les deux affirmations vraies concernant la conception proposée ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Proseware can validate a credential without contacting Woodgrove at presentation time", fr: "Proseware peut valider une information d'identification sans contacter Woodgrove au moment de la présentation" } }
    - { id: b, text: { en: "Proseware must be added to Woodgrove's tenant as a connected organization to verify a credential", fr: "Proseware doit être ajoutée au locataire de Woodgrove comme organisation connectée pour vérifier une information d'identification" } }
    - { id: c, text: { en: "Each credential is stored in Woodgrove's tenant and retrieved by Proseware at each verification", fr: "Chaque information d'identification est stockée dans le locataire de Woodgrove et récupérée par Proseware à chaque vérification" } }
    - { id: d, text: { en: "Proseware must deploy Microsoft Entra ID to verify the credentials", fr: "Proseware doit déployer Microsoft Entra ID pour vérifier les informations d'identification" } }
    - { id: e, text: { en: "Woodgrove's decentralized identifier can use the did:web method, anchored on a web domain it owns", fr: "L'identificateur décentralisé de Woodgrove peut utiliser la méthode did:web, ancrée sur un domaine web qui lui appartient" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      A verifiable credential is portable: the verifier checks the issuer's signature against the public key in the issuer's DID document, without contacting the issuer or a central authority. Microsoft supports the did:web trust method, which builds trust on the reputation of a web domain.
    fr: |-
      Une information d'identification vérifiable est portable : le vérificateur contrôle la signature de l'émetteur avec la clé publique du document DID de l'émetteur, sans contacter l'émetteur ni une autorité centrale. Microsoft prend en charge la méthode d'approbation did:web, qui fonde la confiance sur la réputation d'un domaine web.
  options:
    b: { en: "Connected organizations belong to entitlement management; a verifier only needs to trust the issuer's DID.", fr: "Les organisations connectées relèvent de la gestion des droits d'utilisation ; un vérificateur doit seulement approuver le DID de l'émetteur." }
    c: { en: "The credential is held in the employee's wallet (Authenticator), and the employee decides when to present it.", fr: "L'information d'identification est conservée dans le portefeuille de l'employé (Authenticator), et c'est l'employé qui décide quand la présenter." }
    d: { en: "A verifier can use open standards (SIOP and Presentation Exchange); a Microsoft Entra tenant is optional and only simplifies the work.", fr: "Un vérificateur peut utiliser des standards ouverts (SIOP et Presentation Exchange) ; un locataire Microsoft Entra est facultatif et ne fait que simplifier le travail." }
references:
  - title: Introduction to Microsoft Entra Verified ID
    url: https://learn.microsoft.com/en-us/entra/verified-id/decentralized-identifier-overview
