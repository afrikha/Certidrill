id: sc100-2c-ar-design-evaluation
objective: "2.3.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has Microsoft Entra ID P2 licenses for all its users and no Microsoft Entra ID Governance or Microsoft Entra Suite licenses.

    A proposed access review design contains a tenant-level review of the users who haven't signed in for 90 days, the **No sign-in within 30 days** decision helper on the application reviews, and a two-stage review of the finance groups.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose de licences Microsoft Entra ID P2 pour tous ses utilisateurs et d'aucune licence Microsoft Entra ID Governance ou Microsoft Entra Suite.

    Une conception de révisions d'accès proposée contient une révision au niveau du locataire des utilisateurs qui ne se sont pas connectés depuis 90 jours, l'aide à la décision **No sign-in within 30 days** sur les révisions d'applications et une révision en deux étapes des groupes financiers.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The existing licenses cover the review of inactive users at the tenant level."
        fr: "Les licences existantes couvrent la révision des utilisateurs inactifs au niveau du locataire."
    - id: s2
      text:
        en: "The No sign-in within 30 days decision helper takes only interactive sign-ins into account."
        fr: "L'aide à la décision No sign-in within 30 days ne prend en compte que les connexions interactives."
    - id: s3
      text:
        en: "The two-stage review can send only the users approved in the first stage to the second-stage reviewers."
        fr: "La révision en deux étapes peut n'envoyer aux réviseurs de la deuxième étape que les utilisateurs approuvés à la première étape."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Reviews of inactive users require Microsoft Entra ID Governance (or Microsoft Entra Suite) licenses, so the P2 licenses aren't enough for that part of the design. The No sign-in within 30 days helper counts both interactive and non-interactive sign-ins (sign-ins to the application for app reviews). In a multi-stage review, you specify which reviewees go to the next stage, for example only those approved.
    fr: |
      Les révisions d'utilisateurs inactifs exigent des licences Microsoft Entra ID Governance (ou Microsoft Entra Suite) : les licences P2 ne suffisent pas pour cette partie de la conception. L'aide No sign-in within 30 days compte les connexions interactives et non interactives (les connexions à l'application pour les révisions d'applications). Dans une révision à plusieurs étapes, vous indiquez quels utilisateurs révisés passent à l'étape suivante, par exemple seulement ceux qui ont été approuvés.
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
  - title: Create an access review of groups and applications
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
