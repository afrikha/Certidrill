id: sc100-2b-auth-context-approval
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a custom treasury application registered in Microsoft Entra ID. Users sign in to it with the MFA that the company policy already requires.

    When a user approves a wire transfer in the application, the user must reauthenticate with a phishing-resistant method from a compliant device. Other actions in the application must not trigger additional prompts. The development team can modify the application.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose d'une application de trésorerie personnalisée inscrite dans Microsoft Entra ID. Les utilisateurs s'y connectent avec la MFA que la politique de l'entreprise impose déjà.

    Quand un utilisateur approuve un virement dans l'application, il doit se réauthentifier avec une méthode résistante au hameçonnage depuis un appareil conforme. Les autres actions de l'application ne doivent pas déclencher d'invites supplémentaires. L'équipe de développement peut modifier l'application.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A protected action on the application's permissions, with a policy that requires phishing-resistant MFA and a compliant device", fr: "Une action protégée sur les autorisations de l'application, avec une stratégie qui exige une MFA résistante au hameçonnage et un appareil conforme" } }
    - { id: b, text: { en: "PIM for Groups on the group that grants the approver role, with activation that requires phishing-resistant MFA", fr: "PIM for Groups sur le groupe qui accorde le rôle d'approbateur, avec une activation qui exige une MFA résistante au hameçonnage" } }
    - { id: c, text: { en: "An authentication context that the application requests at approval, targeted by a policy that requires phishing-resistant MFA and a compliant device", fr: "Un contexte d'authentification que l'application demande à l'approbation, ciblé par une stratégie qui exige une MFA résistante au hameçonnage et un appareil conforme" } }
    - { id: d, text: { en: "A policy that targets the application and requires phishing-resistant MFA, a compliant device and sign-in frequency Every time", fr: "Une stratégie qui cible l'application et exige une MFA résistante au hameçonnage, un appareil conforme et la fréquence de connexion Every time" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An authentication context lets an application require a Conditional Access policy for a sensitive action within the app, rather than at sign-in. The application raises the context when the user approves a transfer, and the policy targeting that context requires the Phishing-resistant MFA authentication strength and a compliant device.
    fr: |-
      Un contexte d'authentification permet à une application d'exiger une stratégie d'accès conditionnel pour une action sensible dans l'application, plutôt qu'à la connexion. L'application déclenche le contexte quand l'utilisateur approuve un virement, et la stratégie qui cible ce contexte exige la force d'authentification Phishing-resistant MFA et un appareil conforme.
  options:
    a: { en: "Protected actions apply to Microsoft Entra permissions, such as managing Conditional Access policies, not to the actions of a custom application.", fr: "Les actions protégées s'appliquent à des autorisations Microsoft Entra, comme la gestion des stratégies d'accès conditionnel, pas aux actions d'une application personnalisée." }
    b: { en: "PIM enforces its requirements when the membership is activated, not each time a transfer is approved.", fr: "PIM applique ses exigences à l'activation de l'appartenance, et non à chaque approbation de virement." }
    d: { en: "A policy on the whole application prompts at every sign-in, including for the actions that must not trigger prompts.", fr: "Une stratégie sur toute l'application déclenche une invite à chaque connexion, y compris pour les actions qui ne doivent pas en déclencher." }
references:
  - title: Conditional Access authentication strengths
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-strengths
  - title: What are protected actions in Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/protected-actions-overview
