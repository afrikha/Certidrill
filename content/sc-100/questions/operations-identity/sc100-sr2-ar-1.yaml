id: sc100-sr2-ar-1
objective: "2.3.6"
type: series_yesno
series: sc100-sr2-guest-reviews
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You recommend one recurring review of all Microsoft 365 groups with guest users, reviewed by the group owners, that removes access when reviewers don't respond.
  fr: |
    Vous recommandez une révision récurrente de tous les groupes Microsoft 365 avec des utilisateurs invités, effectuée par les propriétaires des groupes, qui supprime l'accès en l'absence de réponse des réviseurs.
body:
  solution:
    en: |
      You recommend a single access review with the following settings:

      - Scope: **All Microsoft 365 groups with guest users**, **Guest users only**
      - Reviewers: **Group owner(s)**
      - Recurrence: **Quarterly**, end date **Never**
      - **Auto apply results to resource**: enabled
      - **If reviewers don't respond**: **Remove access**
    fr: |
      Vous recommandez une seule révision d'accès avec les paramètres suivants :

      - Étendue : **All Microsoft 365 groups with guest users**, **Guest users only**
      - Réviseurs : **Group owner(s)**
      - Périodicité : **Quarterly**, date de fin **Never**
      - **Auto apply results to resource** : activé
      - **If reviewers don't respond** : **Remove access**
answer: { value: true }
explanation:
  correct:
    en: |
      The All Microsoft 365 groups with guest users scope creates recurring reviews of the guests of every team and Microsoft 365 group, so groups created later are included without extra work. Group owners are the reviewers, and with auto-apply enabled and Remove access for non-responses, every guest who isn't approved loses membership when the review ends.
    fr: |
      L'étendue All Microsoft 365 groups with guest users crée des révisions récurrentes des invités de chaque équipe et de chaque groupe Microsoft 365 : les groupes créés plus tard sont inclus sans travail supplémentaire. Les propriétaires des groupes sont les réviseurs, et avec l'application automatique activée et Remove access en l'absence de réponse, chaque invité non approuvé perd son appartenance à la fin de la révision.
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
