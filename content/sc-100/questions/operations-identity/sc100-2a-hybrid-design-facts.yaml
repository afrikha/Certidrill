id: sc100-2a-hybrid-design-facts
objective: "2.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has servers on-premises, in Azure and in AWS, and uses Microsoft Defender for Cloud and Microsoft Sentinel. A consultant proposes the following design assumptions for monitoring the hybrid and multicloud environment.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose de serveurs locaux, dans Azure et dans AWS, et utilise Microsoft Defender pour le cloud et Microsoft Sentinel. Un consultant propose les hypothèses de conception suivantes pour la surveillance de l'environnement hybride et multicloud.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When both Microsoft Sentinel and Defender for Cloud are used, Microsoft Learn recommends considering the same Log Analytics workspace for both.
        fr: Quand Microsoft Sentinel et Defender pour le cloud sont utilisés tous les deux, Microsoft Learn recommande d'envisager le même espace de travail Log Analytics pour les deux.
    - id: s2
      text:
        en: Connecting the AWS accounts to Defender for Cloud also makes their CloudTrail events available to Sentinel analytics rules.
        fr: Connecter les comptes AWS à Defender pour le cloud rend aussi leurs événements CloudTrail disponibles pour les règles d'analyse de Sentinel.
    - id: s3
      text:
        en: The bandwidth charges of sending server logs to a workspace in another region usually justify one workspace per region.
        fr: Les frais de bande passante liés à l'envoi des journaux de serveurs vers un espace de travail d'une autre région justifient généralement un espace de travail par région.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Microsoft Learn recommends considering the same workspace for Microsoft Sentinel and Defender for Cloud to keep security data in one place. The Defender for Cloud AWS connector assesses posture and protects workloads; CloudTrail events reach Sentinel through the Sentinel AWS data connectors. Cross-region bandwidth charges are usually minor compared with ingestion costs, so a workspace per region is created only when they are significant enough to justify the added complexity.
    fr: |
      Microsoft Learn recommande d'envisager le même espace de travail pour Microsoft Sentinel et Defender pour le cloud afin de garder les données de sécurité en un seul endroit. Le connecteur AWS de Defender pour le cloud évalue la posture et protège les charges de travail ; les événements CloudTrail parviennent à Sentinel par les connecteurs de données AWS de Sentinel. Les frais de bande passante entre régions sont généralement faibles par rapport aux coûts d'ingestion : un espace de travail par région n'est créé que s'ils sont assez importants pour justifier la complexité ajoutée.
references:
  - title: Design a Log Analytics workspace architecture
    url: https://learn.microsoft.com/en-us/azure/sentinel/best-practices-workspace-architecture
  - title: Connect AWS accounts to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
