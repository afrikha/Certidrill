id: sc100-2a-audit-retention-scope
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has Microsoft 365 E5 licenses and plans to purchase the 10-Year Audit Log Retention add-on for its finance department. The compliance team writes the following assumptions in the audit design.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose de licences Microsoft 365 E5 et prévoit d'acheter le module complémentaire 10-Year Audit Log Retention pour son service financier. L'équipe de conformité rédige les hypothèses suivantes dans la conception de l'audit.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An audit log retention policy can keep only specific activities of a service, such as file deletions in SharePoint, longer than the other records.
        fr: Une stratégie de rétention des journaux d'audit peut conserver plus longtemps que les autres enregistrements uniquement certaines activités d'un service, comme les suppressions de fichiers dans SharePoint.
    - id: s2
      text:
        en: A 10-year policy created next month also keeps for 10 years the finance records that were generated before the policy existed.
        fr: Une stratégie de 10 ans créée le mois prochain conserve aussi 10 ans les enregistrements du service financier générés avant l'existence de la stratégie.
    - id: s3
      text:
        en: The records generated by the service principals of the finance applications can be kept for 10 years with the add-on.
        fr: Les enregistrements générés par les principaux de service des applications financières peuvent être conservés 10 ans avec le module complémentaire.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Audit log retention policies of Audit (Premium) can be scoped by service, activity or user, with priorities. Ten-year retention requires the per-user add-on license and a 10-year policy, and it isn't retroactive. Records from non-user entities, such as service principals, system events and applications, are kept for a fixed period of one year that can't be configured.
    fr: |
      Les stratégies de rétention des journaux d'audit d'Audit (Premium) peuvent être limitées par service, activité ou utilisateur, avec des priorités. La rétention de dix ans exige la licence de module complémentaire par utilisateur et une stratégie de 10 ans, et elle n'est pas rétroactive. Les enregistrements des entités non utilisateur, comme les principaux de service, les événements système et les applications, sont conservés pendant une durée fixe d'un an qui n'est pas configurable.
references:
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
