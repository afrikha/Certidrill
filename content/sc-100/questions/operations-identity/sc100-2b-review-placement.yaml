id: sc100-2b-review-placement
objective: "2.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. must prove to its auditors that access is recertified every quarter. The governance team plans four access reviews and wants to create each review in the Microsoft Entra feature that manages the access being reviewed.

    Where should each review be created? To answer, drag the appropriate features to the correct reviews. Each feature may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. doit prouver à ses auditeurs que l'accès est recertifié chaque trimestre. L'équipe de gouvernance prévoit quatre révisions d'accès et veut créer chaque révision dans la fonctionnalité Microsoft Entra qui gère l'accès révisé.

    Où chaque révision doit-elle être créée ? Pour répondre, faites glisser les fonctionnalités appropriées vers les révisions correspondantes. Chaque fonctionnalité peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: pim, text: Privileged Identity Management }
    - { id: em, text: { en: "Entitlement management", fr: "Gestion des droits d'utilisation" } }
    - { id: ar, text: { en: "Access reviews for groups and applications", fr: "Révisions d'accès des groupes et applications" } }
    - { id: lcw, text: { en: "Lifecycle workflows", fr: "Workflows de cycle de vie" } }
  targets:
    - { id: t1, text: { en: "Users who hold the Global Administrator role", fr: "Utilisateurs qui détiennent le rôle Global Administrator" } }
    - { id: t2, text: { en: "Owner role assignments on the production Azure subscription", fr: "Attributions du rôle Owner sur l'abonnement Azure de production" } }
    - { id: t3, text: { en: "Assignments of the access package used by contractors", fr: "Attributions du package d'accès utilisé par les prestataires" } }
    - { id: t4, text: { en: "Guest members of a Microsoft 365 group", fr: "Membres invités d'un groupe Microsoft 365" } }
answer:
  mapping: { t1: pim, t2: pim, t3: em, t4: ar }
explanation:
  correct:
    en: |-
      Reviews of Microsoft Entra roles and of Azure resource roles are created in PIM. Reviews of access package assignments are created in entitlement management. Reviews of security and Microsoft 365 group members, including guests, and of users assigned to applications are created in access reviews.
    fr: |-
      Les révisions des rôles Microsoft Entra et des rôles de ressources Azure se créent dans PIM. Les révisions des attributions de packages d'accès se créent dans la gestion des droits d'utilisation. Les révisions des membres des groupes de sécurité et Microsoft 365, invités compris, et des utilisateurs attribués aux applications se créent dans les révisions d'accès.
  options:
    lcw: { en: "Lifecycle workflows automate joiner, mover and leaver tasks; they don't recertify access.", fr: "Les workflows de cycle de vie automatisent les tâches d'arrivée, de mobilité et de départ ; ils ne recertifient pas l'accès." }
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
