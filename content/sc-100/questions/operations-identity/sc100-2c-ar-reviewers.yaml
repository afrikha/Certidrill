id: sc100-2c-ar-reviewers
objective: "2.3.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is designing access reviews in Microsoft Entra ID Governance for the resources in the answer area. Each review must use the reviewers best placed to decide whether access should continue, and self-review is acceptable only for low-risk access.

    Which reviewer option should you select for each review? To answer, drag the appropriate reviewer options to the correct reviews. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. conçoit des révisions d'accès dans Microsoft Entra ID Governance pour les ressources de la zone de réponse. Chaque révision doit utiliser les réviseurs les mieux placés pour décider si l'accès doit continuer, et l'autorévision n'est acceptable que pour les accès à faible risque.

    Quelle option de réviseur devez-vous sélectionner pour chaque révision ? Pour répondre, faites glisser les options de réviseur appropriées vers les révisions correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: managers, text: "Managers of users" }
    - { id: owners, text: "Group owner(s)" }
    - { id: self, text: "Users review their own access" }
    - { id: selected, text: "Selected user(s) or group(s)" }
    - { id: fallback, text: "Fallback reviewer(s)" }
  targets:
    - id: t1
      text: { en: "Employees' access to the payroll application, where each employee's need depends on their job", fr: "L'accès des employés à l'application de paie, où le besoin de chaque employé dépend de son poste" }
    - id: t2
      text: { en: "Membership of project groups, each of which has an accountable owner", fr: "L'appartenance aux groupes de projet, qui ont chacun un propriétaire responsable" }
    - id: t3
      text: { en: "Membership of a low-risk, company-wide social community group", fr: "L'appartenance à un groupe de communauté sociale à faible risque, ouvert à toute l'entreprise" }
    - id: t4
      text: { en: "Partner users' access to the partner portal application, which the partner program lead decides", fr: "L'accès des utilisateurs partenaires à l'application de portail partenaires, que décide le responsable du programme partenaires" }
answer:
  mapping: { t1: managers, t2: owners, t3: self, t4: selected }
explanation:
  correct:
    en: |
      Managers know whether their employees' jobs still need the payroll app. Group owners are accountable for their project groups. Self-review fits low-risk access only. A selected user, here the partner program lead, reviews when a specific person owns the decision. Fallback reviewers are used with the managers or group owners options when a user has no manager or a group has no owner; they aren't a reviewer option on their own.
    fr: |
      Les responsables savent si le poste de leurs employés nécessite encore l'application de paie. Les propriétaires de groupe sont responsables de leurs groupes de projet. L'autorévision ne convient qu'aux accès à faible risque. Un utilisateur sélectionné, ici le responsable du programme partenaires, révise quand une personne précise détient la décision. Les réviseurs de secours s'utilisent avec les options responsables ou propriétaires de groupe quand un utilisateur n'a pas de responsable ou qu'un groupe n'a pas de propriétaire ; ils ne sont pas une option de réviseur à part entière.
references:
  - title: Create an access review of groups and applications
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
