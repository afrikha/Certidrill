id: sc100-2b-phs-resilience
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has a single Active Directory Domain Services (AD DS) forest synchronized to Microsoft Entra ID by Microsoft Entra Connect Sync. Users sign in to Microsoft 365 through an AD FS farm hosted in the on-premises datacenter.

    After a ransomware attack at a competitor, the board sets two requirements: users must be able to sign in to Microsoft 365 even if the on-premises datacenter is unavailable, and Microsoft Entra ID Protection must be able to report users whose credentials have leaked. The solution must minimize the on-premises infrastructure to maintain.

    Which sign-in method should you recommend?
  fr: |
    Fabrikam, Inc. dispose d'une seule forêt Active Directory Domain Services (AD DS) synchronisée avec Microsoft Entra ID par Microsoft Entra Connect Sync. Les utilisateurs se connectent à Microsoft 365 par une batterie AD FS hébergée dans le centre de données local.

    Après une attaque par rançongiciel chez un concurrent, le conseil d'administration fixe deux exigences : les utilisateurs doivent pouvoir se connecter à Microsoft 365 même si le centre de données local est indisponible, et Microsoft Entra ID Protection doit pouvoir signaler les utilisateurs dont les informations d'identification ont été divulguées. La solution doit réduire au minimum l'infrastructure locale à maintenir.

    Quelle méthode de connexion devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Pass-through authentication with three authentication agents on separate servers", fr: "Authentification directe avec trois agents d'authentification sur des serveurs distincts" } }
    - { id: b, text: { en: "Password hash synchronization with cloud authentication", fr: "Synchronisation du hachage de mot de passe avec authentification cloud" } }
    - { id: c, text: { en: "Federation with a second AD FS farm deployed on Azure virtual machines", fr: "Fédération avec une seconde batterie AD FS déployée sur des machines virtuelles Azure" } }
    - { id: d, text: { en: "Federation with AD FS and Microsoft Entra Connect Health monitoring", fr: "Fédération avec AD FS et la surveillance Microsoft Entra Connect Health" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Password hash synchronization authenticates users in the cloud, so sign-in keeps working when the on-premises infrastructure is down, and it requires the least deployment and maintenance effort. ID Protection also needs password hash synchronization to produce the leaked credentials report, whatever the sign-in method.
    fr: |-
      La synchronisation du hachage de mot de passe authentifie les utilisateurs dans le cloud ; la connexion continue donc de fonctionner quand l'infrastructure locale est en panne, et c'est la méthode qui demande le moins d'effort de déploiement et de maintenance. ID Protection a aussi besoin de la synchronisation du hachage de mot de passe pour produire le rapport des informations d'identification divulguées, quelle que soit la méthode de connexion.
  options:
    a: { en: "Pass-through authentication depends on on-premises agents and domain controllers, and it doesn't provide leaked credential detection without password hash synchronization.", fr: "L'authentification directe dépend d'agents et de contrôleurs de domaine locaux, et elle ne fournit pas la détection des informations d'identification divulguées sans la synchronisation du hachage de mot de passe." }
    c: { en: "A second AD FS farm adds infrastructure to maintain and still depends on domain controllers; it doesn't enable the leaked credentials report.", fr: "Une seconde batterie AD FS ajoute de l'infrastructure à maintenir et dépend toujours des contrôleurs de domaine ; elle n'active pas le rapport des informations d'identification divulguées." }
    d: { en: "Monitoring the AD FS farm doesn't remove its dependency on the on-premises datacenter.", fr: "Surveiller la batterie AD FS ne supprime pas sa dépendance au centre de données local." }
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
