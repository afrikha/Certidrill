id: sc100-2b-aws-identity-center
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Entra ID for Microsoft 365 and Azure. The company also runs workloads in an AWS organization that contains 40 AWS accounts, where engineers currently sign in with IAM users created in each account.

    You need to recommend an identity solution for access to the AWS accounts. Engineers must sign in with their Microsoft Entra ID accounts under the existing Conditional Access policies. Access must be removed from AWS automatically when an engineer leaves the AWS group in Microsoft Entra ID. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Litware, Inc. utilise Microsoft Entra ID pour Microsoft 365 et Azure. L'entreprise exécute aussi des charges de travail dans une organisation AWS qui contient 40 comptes AWS, où les ingénieurs se connectent aujourd'hui avec des utilisateurs IAM créés dans chaque compte.

    Vous devez recommander une solution d'identité pour l'accès aux comptes AWS. Les ingénieurs doivent se connecter avec leur compte Microsoft Entra ID, sous les stratégies d'accès conditionnel existantes. L'accès doit être retiré automatiquement d'AWS lorsqu'un ingénieur quitte le groupe AWS dans Microsoft Entra ID. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Invite the existing IAM users to the Microsoft Entra tenant as B2B guests", fr: "Inviter les utilisateurs IAM existants dans le locataire Microsoft Entra en tant qu'invités B2B" } }
    - { id: b, text: { en: "Require MFA on the IAM users of every AWS account and review them quarterly", fr: "Exiger la MFA sur les utilisateurs IAM de chaque compte AWS et les réviser chaque trimestre" } }
    - { id: c, text: { en: "Deploy Microsoft Entra Domain Services and create a trust with AWS Directory Service", fr: "Déployer Microsoft Entra Domain Services et créer une approbation avec AWS Directory Service" } }
    - { id: d, text: { en: "Integrate AWS IAM Identity Center with Microsoft Entra ID for SAML SSO and automatic provisioning", fr: "Intégrer AWS IAM Identity Center à Microsoft Entra ID pour l'authentification unique SAML et le provisionnement automatique" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Keeping Microsoft Entra ID as the single identity provider and federating AWS IAM Identity Center with it applies Microsoft Entra sign-in and Conditional Access to every AWS account. The Microsoft Entra provisioning service (SCIM) creates users and groups in IAM Identity Center and removes users who no longer need access. SSO and provisioning are configured on the same enterprise application.
    fr: |-
      Garder Microsoft Entra ID comme fournisseur d'identité unique et lui fédérer AWS IAM Identity Center applique la connexion Microsoft Entra et l'accès conditionnel à tous les comptes AWS. Le service de provisionnement Microsoft Entra (SCIM) crée les utilisateurs et les groupes dans IAM Identity Center et supprime les utilisateurs qui n'ont plus besoin d'accès. L'authentification unique et le provisionnement se configurent sur la même application d'entreprise.
  options:
    a: { en: "Guest accounts in the Microsoft Entra tenant don't give access to AWS accounts; the IAM users would remain the way engineers sign in to AWS.", fr: "Des comptes invités dans le locataire Microsoft Entra ne donnent pas accès aux comptes AWS ; les utilisateurs IAM resteraient le moyen de connexion à AWS." }
    b: { en: "IAM users stay separate identities in 40 accounts: they aren't governed by Conditional Access and must be removed manually.", fr: "Les utilisateurs IAM restent des identités distinctes dans 40 comptes : ils ne sont pas gouvernés par l'accès conditionnel et doivent être supprimés manuellement." }
    c: { en: "A domain trust provides Kerberos and LDAP for workloads; it doesn't federate the AWS console sign-in with Conditional Access or provision users.", fr: "Une approbation de domaine fournit Kerberos et LDAP aux charges de travail ; elle ne fédère pas la connexion à la console AWS avec l'accès conditionnel et ne provisionne pas les utilisateurs." }
references:
  - title: Configure AWS IAM Identity Center (successor to AWS single sign-on) for automatic user provisioning with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/saas-apps/aws-single-sign-on-provisioning-tutorial
