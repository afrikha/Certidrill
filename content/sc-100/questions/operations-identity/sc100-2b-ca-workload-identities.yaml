id: sc100-2b-ca-workload-identities
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. runs automation jobs from its datacenter by using single-tenant Microsoft Entra applications whose service principals authenticate with client secrets. A Zero Trust review notes that the Conditional Access policies of the tenant all target users and groups.

    You need to recommend a solution that blocks token requests from these service principals when they come from outside the datacenter's public IP ranges. Existing user policies must not change.

    What should you recommend?
  fr: |
    Fabrikam, Inc. exécute des tâches d'automatisation depuis son centre de données à l'aide d'applications Microsoft Entra monolocataires dont les principaux de service s'authentifient avec des secrets client. Une revue Confiance Zéro note que les stratégies d'accès conditionnel du locataire ciblent toutes des utilisateurs et des groupes.

    Vous devez recommander une solution qui bloque les demandes de jeton de ces principaux de service lorsqu'elles proviennent de l'extérieur des plages d'adresses IP publiques du centre de données. Les stratégies existantes des utilisateurs ne doivent pas changer.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Conditional Access policy for workload identities that blocks the service principals outside a named location", fr: "Une stratégie d'accès conditionnel pour les identités de charge de travail qui bloque les principaux de service hors d'un emplacement nommé" } }
    - { id: b, text: { en: "Add the service principals to the user policy that blocks access from outside a named location", fr: "Ajouter les principaux de service à la stratégie utilisateur qui bloque l'accès hors d'un emplacement nommé" } }
    - { id: c, text: { en: "Replace the client secrets with certificates and store the certificates in Azure Key Vault", fr: "Remplacer les secrets client par des certificats et stocker les certificats dans Azure Key Vault" } }
    - { id: d, text: { en: "Exclude the service principals from all policies and alert on their sign-ins in Microsoft Sentinel", fr: "Exclure les principaux de service de toutes les stratégies et générer des alertes sur leurs connexions dans Microsoft Sentinel" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Policies scoped to users and groups don't apply to service principal sign-ins. Conditional Access for workload identities targets single-tenant service principals and can block their token requests based on location, which closes the gap without changing the user policies.
    fr: |-
      Les stratégies limitées aux utilisateurs et aux groupes ne s'appliquent pas aux connexions des principaux de service. L'accès conditionnel pour les identités de charge de travail cible des principaux de service monolocataires et peut bloquer leurs demandes de jeton selon l'emplacement, ce qui comble la lacune sans modifier les stratégies des utilisateurs.
  options:
    b: { en: "A user policy can't include service principals, and changing it would modify the existing user policies.", fr: "Une stratégie utilisateur ne peut pas inclure de principaux de service, et la modifier changerait les stratégies existantes des utilisateurs." }
    c: { en: "Certificates are stronger credentials than secrets, but a stolen certificate could still be used from any location.", fr: "Les certificats sont des informations d'identification plus fortes que les secrets, mais un certificat volé pourrait encore être utilisé depuis n'importe quel emplacement." }
    d: { en: "Alerts detect misuse after the fact; they don't block token requests from outside the datacenter.", fr: "Les alertes détectent l'utilisation abusive après coup ; elles ne bloquent pas les demandes de jeton venant de l'extérieur du centre de données." }
references:
  - title: Plan a Conditional Access deployment
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/plan-conditional-access
