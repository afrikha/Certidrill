id: sc100-2a-ir-plan-gap
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You are evaluating the incident response plan of Lamna Healthcare for a ransomware attack. The plan defines a technical incident leader, a communications liaison and an incident recorder, and it is tested twice a year in tabletop exercises.

    During an incident, the responders coordinate in a Microsoft Teams channel, share the network diagrams and recovery procedures stored in SharePoint Online, and reach each other through the corporate directory. All these services rely on the corporate Microsoft Entra tenant.

    Which change should you recommend to the plan?
  fr: |
    Vous évaluez le plan de réponse aux incidents de Lamna Healthcare pour une attaque par rançongiciel. Le plan définit un responsable technique de l'incident, un chargé de communication et un rédacteur de l'incident, et il est testé deux fois par an lors d'exercices sur table.

    Pendant un incident, les intervenants se coordonnent dans un canal Microsoft Teams, partagent les schémas réseau et les procédures de reprise stockés dans SharePoint Online, et se joignent au moyen de l'annuaire de l'entreprise. Tous ces services reposent sur le locataire Microsoft Entra de l'entreprise.

    Quelle modification devez-vous recommander pour le plan ?
body:
  options:
    - { id: a, text: { en: "Create a dedicated Teams channel and SharePoint site for each incident", fr: "Créer un canal Teams et un site SharePoint dédiés pour chaque incident" } }
    - { id: b, text: { en: "Plan out-of-band communications and keep key documents immutably offline", fr: "Prévoir des communications hors bande et conserver les documents clés de façon immuable hors ligne" } }
    - { id: c, text: { en: "Add an automation rule that posts every new incident to the Teams channel", fr: "Ajouter une règle d'automatisation qui publie chaque nouvel incident dans le canal Teams" } }
    - { id: d, text: { en: "Increase the frequency of the tabletop exercises to once a month", fr: "Augmenter la fréquence des exercices sur table à une fois par mois" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The plan's roles and exercises follow Microsoft's guidance, but every coordination tool depends on the systems an attacker may compromise or encrypt. Microsoft Learn recommends planning how to communicate when email and collaboration services are down or documentation is held for ransom, and storing phone numbers, topologies and restoration procedures immutably in offline locations.
    fr: |
      Les rôles et les exercices du plan suivent les recommandations de Microsoft, mais chaque outil de coordination dépend des systèmes qu'un attaquant peut compromettre ou chiffrer. Microsoft Learn recommande de prévoir comment communiquer quand la messagerie et les services de collaboration sont indisponibles ou que la documentation est prise en otage, et de stocker les numéros de téléphone, les topologies et les procédures de restauration de façon immuable dans des emplacements hors ligne.
  options:
    a:
      en: |
        More channels and sites still depend on the same tenant and services, which may be unavailable during a ransomware attack.
      fr: |
        Davantage de canaux et de sites dépendent toujours du même locataire et des mêmes services, qui peuvent être indisponibles pendant une attaque par rançongiciel.
    c:
      en: |
        Notifications into Teams speed up awareness but still depend on Teams being available and trustworthy.
      fr: |
        Des notifications dans Teams accélèrent la prise de connaissance, mais dépendent toujours de la disponibilité et de la fiabilité de Teams.
    d:
      en: |
        The plan is already exercised regularly; more exercises won't remove the dependency on the compromised services.
      fr: |
        Le plan est déjà exercé régulièrement ; davantage d'exercices ne supprimeront pas la dépendance aux services compromis.
references:
  - title: Incident response planning
    url: https://learn.microsoft.com/en-us/security/operations/incident-response-planning
