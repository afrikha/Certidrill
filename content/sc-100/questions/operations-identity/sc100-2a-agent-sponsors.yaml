id: sc100-2a-agent-sponsors
objective: "2.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has Microsoft 365 E7 and is designing the governance of its agent identities in Microsoft Entra Agent ID. The design assigns technical owners from the platform team and business sponsors from each department.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose de Microsoft 365 E7 et conçoit la gouvernance de ses identités d'agent dans Microsoft Entra Agent ID. La conception désigne des propriétaires techniques de l'équipe plateforme et des sponsors métier de chaque service.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each agent identity must have at least one sponsor when it is created.
        fr: Chaque identité d'agent doit avoir au moins un sponsor lors de sa création.
    - id: s2
      text:
        en: A sponsor can change the credentials and authentication properties of the agent identities it sponsors.
        fr: Un sponsor peut modifier les informations d'identification et les propriétés d'authentification des identités d'agent qu'il parraine.
    - id: s3
      text:
        en: When a sponsor leaves Adatum, the sponsorship can be transferred automatically to the sponsor's manager.
        fr: Quand un sponsor quitte Adatum, le parrainage peut être transféré automatiquement au responsable hiérarchique du sponsor.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Sponsors are required on create for agent identities and blueprints. Sponsors carry business accountability: they make lifecycle decisions, request access packages and can disable an agent, but only owners can change settings and credentials, including authentication properties. When a sponsor leaves the organization, sponsorship can be transferred automatically to the sponsor's manager, and lifecycle workflows can notify co-sponsors and the manager.
    fr: |
      Les sponsors sont obligatoires à la création pour les identités d'agent et les blueprints. Les sponsors portent la responsabilité métier : ils prennent les décisions de cycle de vie, demandent des packages d'accès et peuvent désactiver un agent, mais seuls les propriétaires peuvent modifier les paramètres et les informations d'identification, y compris les propriétés d'authentification. Quand un sponsor quitte l'organisation, le parrainage peut être transféré automatiquement à son responsable hiérarchique, et des workflows de cycle de vie peuvent avertir les cosponsors et le responsable.
references:
  - title: Administrative relationships in Microsoft Entra Agent ID (Owners, sponsors, and managers)
    url: https://learn.microsoft.com/en-us/entra/agent-id/agent-owners-sponsors-managers
  - title: Governing Agent Identities
    url: https://learn.microsoft.com/en-us/entra/id-governance/agent-id-governance-overview
