id: sc100-2b-hybrid-auth-facts
objective: "2.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys is reviewing the hybrid identity design of its Microsoft Entra tenant. Some domains use pass-through authentication, others are federated with AD FS. A legacy line-of-business application signs users in with the DOMAIN\username format.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys passe en revue la conception d'identité hybride de son locataire Microsoft Entra. Certains domaines utilisent l'authentification directe, d'autres sont fédérés avec AD FS. Une application métier héritée connecte les utilisateurs au format DOMAINE\nomutilisateur.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          If all pass-through authentication agents become unavailable, sign-ins fail over to password hash synchronization automatically.
        fr: |-
          Si tous les agents d'authentification directe deviennent indisponibles, les connexions basculent automatiquement vers la synchronisation du hachage de mot de passe.
    - id: s2
      text:
        en: |-
          For the federated domains, Microsoft Entra ID Protection can report users with leaked credentials only if password hash synchronization is also enabled.
        fr: |-
          Pour les domaines fédérés, Microsoft Entra ID Protection ne peut signaler les utilisateurs dont les informations d'identification ont été divulguées que si la synchronisation du hachage de mot de passe est aussi activée.
    - id: s3
      text:
        en: |-
          Sign-in with the DOMAIN\username format instead of a user principal name is a requirement that calls for federation.
        fr: |-
          La connexion au format DOMAINE\nomutilisateur au lieu d'un nom d'utilisateur principal est une exigence qui impose la fédération.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      Password hash synchronization can be a backup for pass-through authentication, but the switch is manual in Microsoft Entra Connect. The leaked credentials report of ID Protection requires password hash synchronization whatever the sign-in method. A sign-in that uses the sAMAccountName (DOMAIN\username) instead of the UPN is one of the requirements that Microsoft Entra ID doesn't support natively and that need a federated solution.
    fr: |-
      La synchronisation du hachage de mot de passe peut servir de secours à l'authentification directe, mais le basculement est manuel dans Microsoft Entra Connect. Le rapport des informations d'identification divulguées d'ID Protection exige la synchronisation du hachage de mot de passe, quelle que soit la méthode de connexion. Une connexion qui utilise le sAMAccountName (DOMAINE\nomutilisateur) au lieu de l'UPN fait partie des exigences que Microsoft Entra ID ne prend pas en charge nativement et qui imposent une solution fédérée.
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
