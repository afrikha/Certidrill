id: sc100-2c-adds-protected-users
objective: "2.3.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has an Active Directory Domain Services (AD DS) forest at the Windows Server 2016 domain functional level. All the domain controllers and member servers run Windows Server 2022.

    To reduce credential theft, a consultant proposes to add the members of the Domain Admins group and the service accounts that run SQL Server to the Protected Users group. You are evaluating the proposal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une forêt Active Directory Domain Services (AD DS) au niveau fonctionnel de domaine Windows Server 2016. Tous les contrôleurs de domaine et les serveurs membres exécutent Windows Server 2022.

    Pour réduire le vol d'informations d'identification, un consultant propose d'ajouter les membres du groupe Domain Admins et les comptes de service qui exécutent SQL Server au groupe Protected Users. Vous évaluez la proposition.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "After they're added to the group, the members of Domain Admins can no longer authenticate by using NTLM."
        fr: "Une fois ajoutés au groupe, les membres de Domain Admins ne peuvent plus s'authentifier avec NTLM."
    - id: s2
      text:
        en: "Adding the SQL Server service accounts to the group is a recommended way to protect their passwords."
        fr: "Ajouter les comptes de service SQL Server au groupe est une façon recommandée de protéger leurs mots de passe."
    - id: s3
      text:
        en: "The members of the group can still be delegated by using Kerberos constrained delegation."
        fr: "Les membres du groupe peuvent encore être délégués par la délégation Kerberos contrainte."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      At a domain functional level of Windows Server 2012 R2 or later, members of Protected Users can't use NTLM, DES or RC4 for Kerberos pre-authentication, can't be delegated by unconstrained or constrained delegation, and get non-renewable four-hour TGTs. Microsoft says not to add service or computer accounts: the password or certificate is always available on the host, so membership gives them no local protection. Test the impact before adding all privileged accounts, because there is no workaround for the restrictions.
    fr: |
      À partir du niveau fonctionnel de domaine Windows Server 2012 R2, les membres de Protected Users ne peuvent utiliser ni NTLM, ni DES ou RC4 pour la pré-authentification Kerberos, ne peuvent pas être délégués par délégation non contrainte ou contrainte, et reçoivent des TGT de quatre heures non renouvelables. Microsoft recommande de ne pas ajouter de comptes de service ou d'ordinateur : le mot de passe ou le certificat est toujours disponible sur l'hôte, donc l'appartenance ne leur apporte aucune protection locale. Testez l'impact avant d'ajouter tous les comptes privilégiés, car les restrictions n'ont pas de contournement.
  options:
    s2:
      en: "Service accounts get no local protection from the group; use group managed service accounts (gMSA) to give them long, automatically rotated passwords."
      fr: "Les comptes de service ne tirent aucune protection locale du groupe ; utilisez des comptes de service administrés de groupe (gMSA) pour leur donner des mots de passe longs renouvelés automatiquement."
    s3:
      en: "Members can't be delegated by either unconstrained or constrained delegation."
      fr: "Les membres ne peuvent être délégués ni par délégation non contrainte ni par délégation contrainte."
references:
  - title: Guidance about how to configure protected accounts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/how-to-configure-protected-accounts
