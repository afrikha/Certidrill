id: sc100-3c-ai-multicloud-posture
objective: "3.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware develops generative AI applications on three clouds: Azure OpenAI models in Microsoft Foundry, Amazon Bedrock in AWS, and Vertex AI in Google Cloud. Defender for Cloud is already connected to the AWS accounts and GCP projects.

    The CISO wants the security team to:

    - keep an inventory of the AI models, libraries and grounding data sources used by each application;
    - identify AI endpoints exposed to the internet and attack paths that lead to the data used for grounding.

    The solution must work across the three clouds from a single console.

    What should you recommend?
  fr: |
    Litware développe des applications d'IA générative sur trois clouds : des modèles Azure OpenAI dans Microsoft Foundry, Amazon Bedrock dans AWS et Vertex AI dans Google Cloud. Defender for Cloud est déjà connecté aux comptes AWS et aux projets GCP.

    Le RSSI veut que l'équipe de sécurité :

    - tienne un inventaire des modèles d'IA, des bibliothèques et des sources de données d'ancrage utilisés par chaque application ;
    - identifie les points de terminaison d'IA exposés à Internet et les chemins d'attaque qui mènent aux données utilisées pour l'ancrage.

    La solution doit fonctionner sur les trois clouds depuis une seule console.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "AI security posture management in the Defender CSPM plan", fr: "La gestion de la posture de sécurité de l'IA dans le plan Defender CSPM" } }
    - { id: b, text: { en: "Threat protection for AI services in Defender for Cloud", fr: "La protection contre les menaces pour les services d'IA dans Defender for Cloud" } }
    - { id: c, text: { en: "Data security posture management for AI in Microsoft Purview", fr: "La gestion de la posture de sécurité des données pour l'IA dans Microsoft Purview" } }
    - { id: d, text: { en: "Cloud discovery of generative AI apps in Defender for Cloud Apps", fr: "La découverte cloud des applications d'IA générative dans Defender for Cloud Apps" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AI security posture management, part of Defender CSPM, discovers generative AI workloads in Azure (Azure OpenAI, Foundry, Azure Machine Learning), AWS (Amazon Bedrock) and GCP (Vertex AI). It builds an AI bill of materials, flags internet-exposed AI endpoints and uses attack path analysis to show risks to grounding and fine-tuning data.
    fr: |-
      La gestion de la posture de sécurité de l'IA, qui fait partie de Defender CSPM, découvre les charges de travail d'IA générative dans Azure (Azure OpenAI, Foundry, Azure Machine Learning), AWS (Amazon Bedrock) et GCP (Vertex AI). Elle construit une nomenclature IA (AI BOM), signale les points de terminaison d'IA exposés à Internet et utilise l'analyse des chemins d'attaque pour montrer les risques pesant sur les données d'ancrage et d'ajustement.
  options:
    b:
      en: |-
        Threat protection raises alerts on attacks against AI services; it doesn't build an inventory or attack paths, and it isn't available for connected AWS accounts.
      fr: |-
        La protection contre les menaces génère des alertes sur les attaques visant les services d'IA ; elle ne construit ni inventaire ni chemins d'attaque, et elle n'est pas disponible pour les comptes AWS connectés.
    c:
      en: |-
        Purview DSPM for AI governs the data in prompts and responses; it doesn't map cloud AI resources, their exposure or attack paths.
      fr: |-
        Le DSPM pour l'IA de Purview régit les données des prompts et des réponses ; il ne cartographie pas les ressources d'IA cloud, leur exposition ni les chemins d'attaque.
    d:
      en: |-
        Cloud discovery finds the generative AI SaaS apps that users reach; it doesn't inventory the applications Litware builds on cloud platforms.
      fr: |-
        La découverte cloud trouve les applications SaaS d'IA générative que les utilisateurs atteignent ; elle n'inventorie pas les applications que Litware développe sur des plateformes cloud.
references:
  - title: Overview - AI security posture management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture
