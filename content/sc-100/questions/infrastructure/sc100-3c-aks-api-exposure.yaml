id: sc100-3c-aks-api-exposure
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation plans a new Azure Kubernetes Service (AKS) cluster for its claims platform. Cluster administrators work from the on-premises network, which is connected to the Azure hub virtual network by ExpressRoute private peering.

    The security requirements state that the Kubernetes API server must have no public endpoint and must be reachable only from the Adatum private networks.

    What should you recommend?
  fr: |
    Adatum Corporation prévoit un nouveau cluster Azure Kubernetes Service (AKS) pour sa plateforme de sinistres. Les administrateurs du cluster travaillent depuis le réseau local, qui est connecté au réseau virtuel hub Azure par le peering privé ExpressRoute.

    Les exigences de sécurité indiquent que le serveur d'API Kubernetes ne doit avoir aucun point de terminaison public et ne doit être joignable que depuis les réseaux privés d'Adatum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A public cluster with authorized IP ranges that contain the on-premises egress addresses", fr: "Un cluster public avec des plages d'adresses IP autorisées qui contiennent les adresses de sortie locales" } }
    - { id: b, text: { en: "A public cluster with a network security group that filters the node subnet", fr: "Un cluster public avec un groupe de sécurité réseau qui filtre le sous-réseau des nœuds" } }
    - { id: c, text: { en: "A private cluster whose API server is reached from the hub and on-premises networks", fr: "Un cluster privé dont le serveur d'API est atteint depuis le hub et les réseaux locaux" } }
    - { id: d, text: { en: "A public cluster behind an Azure Firewall DNAT rule that forwards to the API server", fr: "Un cluster public derrière une règle DNAT du Pare-feu Azure qui redirige vers le serveur d'API" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      By default, the AKS API server has a public IP address and FQDN. A private cluster gives the API server a private address in the virtual network, so it has no public endpoint and is reachable only from networks connected to that virtual network, such as the hub and the on-premises network over ExpressRoute.
    fr: |-
      Par défaut, le serveur d'API AKS possède une adresse IP publique et un FQDN. Un cluster privé donne au serveur d'API une adresse privée dans le réseau virtuel : il n'a aucun point de terminaison public et n'est joignable que depuis les réseaux connectés à ce réseau virtuel, comme le hub et le réseau local via ExpressRoute.
  options:
    a:
      en: |-
        Authorized IP ranges restrict who can call the API server, but the endpoint stays public.
      fr: |-
        Les plages d'adresses IP autorisées restreignent qui peut appeler le serveur d'API, mais le point de terminaison reste public.
    b:
      en: |-
        The API server is managed by Microsoft outside the node subnet, so an NSG on that subnet doesn't remove its public endpoint.
      fr: |-
        Le serveur d'API est géré par Microsoft hors du sous-réseau des nœuds : un NSG sur ce sous-réseau ne supprime pas son point de terminaison public.
    d:
      en: |-
        A DNAT rule publishes a service on the firewall's public IP; the API server keeps its own public endpoint.
      fr: |-
        Une règle DNAT publie un service sur l'adresse IP publique du pare-feu ; le serveur d'API garde son propre point de terminaison public.
references:
  - title: Security concepts for applications and clusters in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-security
  - title: Secure access to the API server using authorized IP address ranges in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/api-server-authorized-ip-ranges
