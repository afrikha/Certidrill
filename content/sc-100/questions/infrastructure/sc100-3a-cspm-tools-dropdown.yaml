id: sc100-3a-cspm-tools-dropdown
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation enabled Defender CSPM on its Azure subscriptions and on its connected AWS accounts. The security architecture team lists three posture evaluation requirements.

    Which Defender for Cloud capability should you recommend for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation a activé Defender CSPM sur ses abonnements Azure et sur ses comptes AWS connectés. L'équipe d'architecture de sécurité liste trois exigences d'évaluation de la posture.

    Quelle fonctionnalité de Defender for Cloud devez-vous recommander pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Build an ad hoc query that finds VMs exposed to the internet that have high-severity vulnerabilities and permissions on a key vault: [[query]]

      Report the posture as a percentage for each subscription and each AWS connector: [[percent]]

      Show which ISO/IEC 27001:2022 controls fail and download a report for the auditors: [[iso]]
    fr: |
      Créer une requête ad hoc qui trouve les machines virtuelles exposées à Internet qui présentent des vulnérabilités de gravité élevée et disposent d'autorisations sur un coffre de clés : [[query]]

      Présenter la posture sous forme de pourcentage pour chaque abonnement et chaque connecteur AWS : [[percent]]

      Montrer quels contrôles ISO/IEC 27001:2022 échouent et télécharger un rapport pour les auditeurs : [[iso]]
  slots:
    - id: query
      options:
        - { id: path, text: { en: "Attack path analysis", fr: "Analyse du chemin d'attaque" } }
        - { id: explorer, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité cloud" } }
        - { id: score, text: { en: "Secure score", fr: "Degré de sécurisation" } }
        - { id: compliance, text: { en: "Regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire" } }
    - id: percent
      options:
        - { id: path, text: { en: "Attack path analysis", fr: "Analyse du chemin d'attaque" } }
        - { id: explorer, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité cloud" } }
        - { id: score, text: { en: "Secure score", fr: "Degré de sécurisation" } }
        - { id: compliance, text: { en: "Regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire" } }
    - id: iso
      options:
        - { id: path, text: { en: "Attack path analysis", fr: "Analyse du chemin d'attaque" } }
        - { id: explorer, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité cloud" } }
        - { id: score, text: { en: "Secure score", fr: "Degré de sécurisation" } }
        - { id: compliance, text: { en: "Regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire" } }
answer:
  values: { query: explorer, percent: score, iso: compliance }
explanation:
  correct:
    en: The cloud security explorer lets you build your own queries over the cloud security graph, combining exposure, vulnerabilities and permissions. The secure score summarizes posture as a percentage and is calculated for each subscription and each AWS or GCP connector. The regulatory compliance dashboard maps assessments to the controls of a standard such as ISO/IEC 27001:2022, shows failing controls and lets you download audit reports.
    fr: L'explorateur de sécurité cloud permet de créer vos propres requêtes sur le graphe de sécurité cloud, en combinant exposition, vulnérabilités et autorisations. Le degré de sécurisation résume la posture sous forme de pourcentage et se calcule pour chaque abonnement et chaque connecteur AWS ou GCP. Le tableau de bord de conformité réglementaire associe les évaluations aux contrôles d'une norme comme ISO/IEC 27001:2022, montre les contrôles en échec et permet de télécharger des rapports d'audit.
  options:
    path:
      en: Attack path analysis automatically shows exploitable paths to resources; it doesn't let you build an ad hoc query, report a percentage or report on a standard.
      fr: L'analyse du chemin d'attaque montre automatiquement les chemins exploitables vers les ressources ; elle ne permet ni de créer une requête ad hoc, ni de présenter un pourcentage, ni de rendre compte d'une norme.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
  - title: Cloud Secure Score in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
