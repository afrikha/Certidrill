id: sc100-3c-ai-keyless
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has 40 Microsoft Foundry resources across several subscriptions. Some applications call the deployed Azure OpenAI models by using the resource keys, which developers copy into configuration files.

    The security team requires that only identities that hold an Azure role on a Foundry resource can call its models, and that the rule apply automatically to existing and future resources.

    What should you recommend?
  fr: |
    Contoso dispose de 40 ressources Microsoft Foundry réparties sur plusieurs abonnements. Certaines applications appellent les modèles Azure OpenAI déployés avec les clés des ressources, que les développeurs copient dans des fichiers de configuration.

    L'équipe de sécurité exige que seules les identités qui détiennent un rôle Azure sur une ressource Foundry puissent appeler ses modèles, et que la règle s'applique automatiquement aux ressources existantes et futures.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Store the resource keys in Azure Key Vault and rotate them automatically every 30 days", fr: "Stocker les clés des ressources dans Azure Key Vault et les renouveler automatiquement tous les 30 jours" } }
    - { id: b, text: { en: "Disable key authentication on the resources and enforce it with the built-in Azure Policy definition", fr: "Désactiver l'authentification par clé sur les ressources et l'imposer avec la définition Azure Policy intégrée" } }
    - { id: c, text: { en: "Create private endpoints for the resources and disable public network access", fr: "Créer des points de terminaison privés pour les ressources et désactiver l'accès au réseau public" } }
    - { id: d, text: { en: "Assign the Foundry User role to the applications and remove their Contributor assignments", fr: "Attribuer le rôle Foundry User aux applications et supprimer leurs attributions Contributor" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Anyone who holds a resource key can call the models regardless of Azure RBAC. Disabling local (key) authentication leaves Microsoft Entra ID as the only way in, so every call needs a role assignment, and the built-in Azure Policy definition audits or denies resources that keep key authentication enabled, including new ones.
    fr: |-
      Quiconque détient une clé de ressource peut appeler les modèles, indépendamment d'Azure RBAC. Désactiver l'authentification locale (par clé) laisse Microsoft Entra ID comme seul moyen d'accès : chaque appel exige une attribution de rôle, et la définition Azure Policy intégrée audite ou refuse les ressources qui gardent l'authentification par clé activée, y compris les nouvelles.
  options:
    a:
      en: |-
        Rotation shortens the life of a key, but any holder of the current key still bypasses Azure RBAC.
      fr: |-
        Le renouvellement raccourcit la durée de vie d'une clé, mais tout détenteur de la clé actuelle contourne toujours Azure RBAC.
    c:
      en: |-
        Private endpoints control the network path, not the identity of the caller; a key still works from the private network.
      fr: |-
        Les points de terminaison privés contrôlent le chemin réseau, pas l'identité de l'appelant ; une clé fonctionne toujours depuis le réseau privé.
    d:
      en: |-
        Narrowing role assignments helps least privilege, but applications that use keys don't need any role at all.
      fr: |-
        Restreindre les attributions de rôles aide au privilège minimum, mais les applications qui utilisent des clés n'ont besoin d'aucun rôle.
references:
  - title: Disable local authentication in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/disable-local-auth
