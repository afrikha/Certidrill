id: sc100-3a-easm-acquisition
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender for Cloud with Defender CSPM on its Azure subscriptions and AWS accounts. Woodgrove has just acquired Litware, Inc.

    Litware's internet presence is poorly documented: domains registered by several business units, IP ranges in a colocation datacenter, and websites hosted by third-party providers. The CISO requires the following:

    - Build an inventory of Litware's entire internet-facing footprint, including unknown assets.
    - Rescan the assets confirmed as owned every day and report vulnerabilities and hygiene issues on them.

    The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Woodgrove Bank utilise Microsoft Defender for Cloud avec Defender CSPM sur ses abonnements Azure et ses comptes AWS. Woodgrove vient d'acquérir Litware, Inc.

    La présence Internet de Litware est mal documentée : des domaines enregistrés par plusieurs unités commerciales, des plages IP dans un centre de données en colocation et des sites web hébergés par des fournisseurs tiers. Le RSSI exige ce qui suit :

    - Construire un inventaire de toute l'empreinte exposée à Internet de Litware, y compris les ressources inconnues.
    - Réanalyser chaque jour les ressources dont la propriété est confirmée et y signaler les vulnérabilités et les problèmes d'hygiène.

    La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Rely on the Defender EASM integration of Defender CSPM after connecting the Litware subscriptions", fr: "S'appuyer sur l'intégration Defender EASM de Defender CSPM après avoir connecté les abonnements de Litware" }
    - id: b
      text: { en: "Connect the Litware servers to Azure Arc and enable Defender for Servers Plan 2 on them", fr: "Connecter les serveurs de Litware à Azure Arc et activer Defender for Servers Plan 2 sur ceux-ci" }
    - id: c
      text: { en: "Explore the Litware assets in the attack surface map of Security Exposure Management", fr: "Explorer les ressources de Litware dans la carte de la surface d'attaque de Security Exposure Management" }
    - id: d
      text: { en: "Deploy a Defender EASM resource that uses the known Litware domains and IP blocks as seeds", fr: "Déployer une ressource Defender EASM qui utilise comme graines les domaines et blocs IP connus de Litware" }
answer:
  optionId: d
explanation:
  correct:
    en: A standalone Defender EASM resource recursively discovers infrastructure connected to its discovery seeds, such as domains, IP blocks, hosts and Whois organizations, so it finds Litware assets outside any cloud subscription. Assets confirmed as Approved Inventory are scanned daily, and the dashboards report vulnerabilities, compliance and hygiene issues.
    fr: Une ressource Defender EASM autonome découvre de façon récursive l'infrastructure liée à ses graines de découverte, comme les domaines, les blocs IP, les hôtes et les organisations Whois ; elle trouve donc les ressources de Litware situées hors de tout abonnement cloud. Les ressources confirmées comme Approved Inventory sont analysées chaque jour, et les tableaux de bord signalent les vulnérabilités ainsi que les problèmes de conformité et d'hygiène.
  options:
    a:
      en: The integration in Defender CSPM discovers internet exposure of the connected cloud resources; it doesn't inventory domains, colocation IP ranges and third-party websites outside the clouds.
      fr: L'intégration dans Defender CSPM découvre l'exposition à Internet des ressources cloud connectées ; elle n'inventorie pas les domaines, les plages IP en colocation et les sites web tiers hors des clouds.
    b:
      en: Azure Arc and Defender for Servers cover servers that you already know and manage; they don't discover unknown internet-facing assets.
      fr: Azure Arc et Defender for Servers couvrent des serveurs déjà connus et gérés ; ils ne découvrent pas les ressources inconnues exposées à Internet.
    c:
      en: The attack surface map visualizes assets that are already in the exposure graph; it doesn't discover Litware's unknown external assets by itself.
      fr: La carte de la surface d'attaque visualise des ressources déjà présentes dans le graphe d'exposition ; elle ne découvre pas à elle seule les ressources externes inconnues de Litware.
references:
  - title: Defender EASM Overview
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview
  - title: Understand Inventory Assets
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/understanding-inventory-assets
