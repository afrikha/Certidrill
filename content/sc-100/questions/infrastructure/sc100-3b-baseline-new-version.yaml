id: sc100-3b-baseline-new-version
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Finance deployed an Intune security baseline profile for Windows two years ago and assigned it to 40 device groups. Microsoft has since released a new version of the baseline. The security team wants the settings of the new version on the devices, and doesn't want to recreate the profile and its 40 assignments.

    What should you recommend?
  fr: |
    Fabrikam Finance a déployé il y a deux ans un profil de base de référence de sécurité Intune pour Windows et l'a attribué à 40 groupes d'appareils. Microsoft a depuis publié une nouvelle version de la base de référence. L'équipe de sécurité veut appliquer aux appareils les paramètres de la nouvelle version, sans recréer le profil ni ses 40 attributions.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Change the version of the existing profile to the latest baseline version.", fr: "Changer la version du profil existant pour la dernière version de la base de référence." } }
    - { id: b, text: { en: "Edit the settings of the existing profile to match the values of the new version.", fr: "Modifier les paramètres du profil existant pour qu'ils correspondent aux valeurs de la nouvelle version." } }
    - { id: c, text: { en: "Import the new version as a Group Policy backup into Group Policy analytics.", fr: "Importer la nouvelle version sous forme de sauvegarde de stratégie de groupe dans l'analyse de stratégie de groupe." } }
    - { id: d, text: { en: "Delete the profile, create a profile from the latest version, and assign it again.", fr: "Supprimer le profil, créer un profil à partir de la dernière version, puis l'attribuer de nouveau." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a new baseline version is available, profiles based on older versions become read-only for their settings, although their names, descriptions and assignments can still be edited. Intune lets you change the version of an existing profile without creating a new one, so the profile keeps its assignments and receives the new version's settings.
    fr: |
      Quand une nouvelle version de base de référence est disponible, les profils fondés sur les versions antérieures passent en lecture seule pour leurs paramètres, même si leurs noms, descriptions et attributions restent modifiables. Intune permet de changer la version d'un profil existant sans en créer un nouveau ; le profil conserve ainsi ses attributions et reçoit les paramètres de la nouvelle version.
  options:
    b:
      en: |
        The settings of a profile based on an older version can't be changed anymore.
      fr: |
        Les paramètres d'un profil fondé sur une version antérieure ne peuvent plus être modifiés.
    c:
      en: |
        Group Policy analytics evaluates existing Group Policy objects for migration; it doesn't update a baseline profile.
      fr: |
        L'analyse de stratégie de groupe évalue des objets de stratégie de groupe existants en vue de leur migration ; elle ne met pas à jour un profil de base de référence.
    d:
      en: |
        This works, but it recreates the profile and its 40 assignments, which the team wants to avoid.
      fr: |
        Cela fonctionne, mais recrée le profil et ses 40 attributions, ce que l'équipe veut éviter.
references:
  - title: Use security baselines to help secure Windows devices you manage with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/security-baselines
