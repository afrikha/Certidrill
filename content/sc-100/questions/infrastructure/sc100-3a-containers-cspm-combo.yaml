id: sc100-3a-containers-cspm-combo
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys runs its ordering platform on Azure Kubernetes Service (AKS) and Amazon EKS clusters. The images are stored in Azure Container Registry and Amazon ECR. The AWS accounts are connected to Microsoft Defender for Cloud, and no paid plan is enabled.

    The security architecture must meet the following requirements:

    - Detect suspicious activity in the clusters at runtime and investigate the alerts in Microsoft Defender XDR.
    - Audit or block the deployment of images that don't meet the vulnerability policy.
    - Show attack paths that start at internet-exposed workloads and reach storage accounts and S3 buckets that contain sensitive data.

    The solution must use the minimum number of plans.

    Which plans should you recommend?
  fr: |
    Wingtip Toys exécute sa plateforme de commandes sur des clusters Azure Kubernetes Service (AKS) et Amazon EKS. Les images sont stockées dans Azure Container Registry et Amazon ECR. Les comptes AWS sont connectés à Microsoft Defender for Cloud, et aucun plan payant n'est activé.

    L'architecture de sécurité doit répondre aux exigences suivantes :

    - Détecter les activités suspectes dans les clusters à l'exécution et examiner les alertes dans Microsoft Defender XDR.
    - Auditer ou bloquer le déploiement des images qui ne respectent pas la stratégie de vulnérabilités.
    - Montrer les chemins d'attaque qui partent de charges de travail exposées à Internet et atteignent des comptes de stockage et des compartiments S3 contenant des données sensibles.

    La solution doit utiliser le nombre minimal de plans.

    Quels plans devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Defender for Containers only", fr: "Defender for Containers uniquement" }
    - id: b
      text: { en: "Defender CSPM only", fr: "Defender CSPM uniquement" }
    - id: c
      text: { en: "Defender for Servers Plan 2 and Defender CSPM", fr: "Defender for Servers Plan 2 et Defender CSPM" }
    - id: d
      text: { en: "Defender for Containers and Defender CSPM", fr: "Defender for Containers et Defender CSPM" }
answer:
  optionId: d
explanation:
  correct:
    en: Defender for Containers provides runtime threat protection for clusters, with alerts that can be investigated in Defender XDR, and gated deployment rules that audit or block images that don't meet the vulnerability policy. Attack path analysis and sensitive data discovery are Defender CSPM capabilities, so the design needs both plans.
    fr: Defender for Containers fournit la protection contre les menaces à l'exécution pour les clusters, avec des alertes qu'il est possible d'examiner dans Defender XDR, et des règles de déploiement contrôlé qui auditent ou bloquent les images qui ne respectent pas la stratégie de vulnérabilités. L'analyse du chemin d'attaque et la découverte des données sensibles sont des fonctionnalités de Defender CSPM ; la conception exige donc les deux plans.
  options:
    a:
      en: Defender for Containers adds its findings to the cloud security graph, but attack path analysis and sensitive data discovery require Defender CSPM.
      fr: Defender for Containers ajoute ses résultats au graphe de sécurité cloud, mais l'analyse du chemin d'attaque et la découverte des données sensibles exigent Defender CSPM.
    b:
      en: Defender CSPM provides attack paths and agentless container vulnerability assessment, but not runtime threat detection or gated deployment.
      fr: Defender CSPM fournit les chemins d'attaque et l'évaluation sans agent des vulnérabilités des conteneurs, mais ni la détection des menaces à l'exécution ni le déploiement contrôlé.
    c:
      en: Defender for Servers protects machines; it doesn't provide Kubernetes runtime protection or gated deployment of images.
      fr: Defender for Servers protège des machines ; il ne fournit ni la protection à l'exécution de Kubernetes ni le déploiement contrôlé des images.
references:
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
