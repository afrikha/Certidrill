id: sc100-3b-client-statements
objective: "3.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is defining the security requirements for its client devices. Corporate Windows 11 laptops are enrolled in Microsoft Intune and onboarded to Microsoft Defender for Endpoint. Employees also use personal Android phones that won't be enrolled in Intune; Defender for Endpoint is installed on those phones.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys définit les exigences de sécurité de ses appareils clients. Les ordinateurs portables Windows 11 de l'entreprise sont inscrits dans Microsoft Intune et intégrés à Microsoft Defender for Endpoint. Les employés utilisent aussi des téléphones Android personnels qui ne seront pas inscrits dans Intune ; Defender for Endpoint est installé sur ces téléphones.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An Intune compliance policy can mark a laptop as noncompliant when BitLocker isn't enabled.
        fr: Une stratégie de conformité Intune peut rendre un ordinateur portable non conforme quand BitLocker n'est pas activé.
    - id: s2
      text:
        en: An Intune app protection policy can use the device risk level reported by Defender for Endpoint on the personal phones.
        fr: Une stratégie de protection des applications Intune peut utiliser le niveau de risque de l'appareil signalé par Defender for Endpoint sur les téléphones personnels.
    - id: s3
      text:
        en: A Conditional Access policy that requires a compliant device allows the personal phones because they have app protection policies.
        fr: Une stratégie d'accès conditionnel qui exige un appareil conforme autorise les téléphones personnels parce qu'ils ont des stratégies de protection des applications.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Compliance policies can require device encryption such as BitLocker on Windows. App protection policies can set an acceptable device risk level from Defender for Endpoint on both enrolled and unenrolled devices. Device compliance, however, is evaluated only for enrolled devices, so unenrolled phones can't satisfy a "require compliant device" grant; for them, use "require app protection policy".
    fr: |
      Les stratégies de conformité peuvent exiger le chiffrement de l'appareil, par exemple BitLocker sous Windows. Les stratégies de protection des applications peuvent définir un niveau de risque d'appareil acceptable fourni par Defender for Endpoint, sur les appareils inscrits comme non inscrits. En revanche, la conformité n'est évaluée que pour les appareils inscrits : des téléphones non inscrits ne peuvent pas satisfaire un contrôle « exiger un appareil conforme » ; pour eux, utilisez « exiger une stratégie de protection des applications ».
references:
  - title: Integrate Microsoft Defender for Endpoint with Intune for Device Compliance
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/advanced-threat-protection
  - title: App protection policies overview
    url: https://learn.microsoft.com/en-us/intune/intune-service/apps/app-protection-policy
