seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You recommend Microsoft Entra Private Access with Quick Access.
  fr: |
    Vous recommandez l'accès privé Microsoft Entra avec Quick Access.
body:
  solution:
    en: |
      You recommend that you deploy Microsoft Entra private network connectors at the headquarters, enable the **Private Access** traffic forwarding profile with **Quick Access**, and deploy the Global Secure Access client to all devices by using Intune.
    fr: |
      Vous recommandez de déployer des connecteurs de réseau privé Microsoft Entra au siège, d'activer le profil de transfert du trafic **Private Access** avec **Quick Access** et de déployer le client Global Secure Access sur tous les appareils à l'aide d'Intune.
answer: { value: false }
explanation:
  correct:
    en: |
      Microsoft Entra Private Access gives identity-based access to private resources through connectors, replacing a VPN for internal apps. Quick Access defines private destinations; it doesn't forward public internet traffic or apply web category filtering. Blocking a web category needs the Internet Access traffic forwarding profile and a web content filtering policy.
    fr: |
      L'accès privé Microsoft Entra fournit un accès fondé sur l'identité aux ressources privées par l'intermédiaire de connecteurs, en remplacement d'un VPN pour les applications internes. Quick Access définit des destinations privées ; il ne transfère pas le trafic Internet public et n'applique aucun filtrage par catégorie web. Bloquer une catégorie web nécessite le profil de transfert du trafic d'accès Internet et une stratégie de filtrage du contenu web.
references:
  - title: Global Secure Access traffic forwarding profiles
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-traffic-forwarding
