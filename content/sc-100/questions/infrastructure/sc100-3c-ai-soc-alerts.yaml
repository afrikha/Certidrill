id: sc100-3c-ai-soc-alerts
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam exposes a customer support assistant built on an Azure OpenAI model deployment in Microsoft Foundry. A Foundry guardrail already filters harmful content.

    The security operations team uses Microsoft Defender XDR. It wants alerts when users attempt jailbreaks or when responses may leak sensitive data, correlated with the other incidents of the attacker, and including the suspicious prompts to speed up investigations.

    What should you recommend?
  fr: |
    Fabrikam expose un assistant de support client fondé sur un déploiement de modèle Azure OpenAI dans Microsoft Foundry. Un garde-fou Foundry filtre déjà le contenu préjudiciable.

    L'équipe des opérations de sécurité utilise Microsoft Defender XDR. Elle veut des alertes quand des utilisateurs tentent des jailbreaks ou quand des réponses risquent de divulguer des données sensibles, corrélées avec les autres incidents de l'attaquant et incluant les prompts suspects pour accélérer les investigations.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "AI security posture management in Defender CSPM for the subscription", fr: "La gestion de la posture de sécurité de l'IA dans Defender CSPM pour l'abonnement" } }
    - { id: b, text: { en: "Diagnostic settings that send the resource logs of the Foundry resource to a Log Analytics workspace", fr: "Des paramètres de diagnostic qui envoient les journaux de ressources de la ressource Foundry à un espace de travail Log Analytics" } }
    - { id: c, text: { en: "Threat protection for AI services in Defender for Cloud, with user prompt evidence enabled", fr: "La protection contre les menaces pour les services d'IA dans Defender for Cloud, avec les preuves de prompt utilisateur activées" } }
    - { id: d, text: { en: "A Foundry guardrail that adds the user prompt attacks control to the deployment", fr: "Un garde-fou Foundry qui ajoute le contrôle des attaques par prompt utilisateur au déploiement" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Threat protection for AI services in Defender for Cloud generates security alerts for jailbreak attempts, data leakage and credential theft against generative AI applications. Its alerts can include prompt evidence, and they are correlated with other signals into incidents in the Defender XDR portal.
    fr: |-
      La protection contre les menaces pour les services d'IA dans Defender for Cloud génère des alertes de sécurité sur les tentatives de jailbreak, la fuite de données et le vol d'identifiants visant les applications d'IA générative. Ses alertes peuvent inclure les preuves de prompt, et elles sont corrélées avec d'autres signaux en incidents dans le portail Defender XDR.
  options:
    a:
      en: |-
        AI-SPM inventories AI workloads and finds misconfigurations and attack paths; it doesn't alert on attacks in progress.
      fr: |-
        L'AI-SPM inventorie les charges de travail d'IA et trouve les erreurs de configuration et les chemins d'attaque ; il n'alerte pas sur les attaques en cours.
    b:
      en: |-
        Resource logs give raw telemetry; they produce no threat detection or Defender XDR incident on their own.
      fr: |-
        Les journaux de ressources fournissent une télémétrie brute ; à eux seuls, ils ne produisent ni détection des menaces ni incident Defender XDR.
    d:
      en: |-
        A guardrail blocks jailbreak prompts in the request path, but it doesn't raise SOC alerts correlated in Defender XDR.
      fr: |-
        Un garde-fou bloque les prompts de jailbreak dans le chemin de la requête, mais il ne génère pas d'alertes pour le SOC corrélées dans Defender XDR.
references:
  - title: AI threat protection in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
