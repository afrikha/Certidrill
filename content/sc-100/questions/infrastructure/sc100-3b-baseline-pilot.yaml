id: sc100-3b-baseline-pilot
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Engineering manages 7,000 Windows 11 devices with Microsoft Intune. The devices run several line-of-business applications and already receive device configuration profiles for firewall and Windows Update settings. The CISO wants to apply the Intune security baseline for Windows to all the devices.

    You need to recommend a deployment approach that minimizes the risk of breaking the applications or creating conflicting settings.

    What should you recommend?
  fr: |
    Contoso Engineering gère 7 000 appareils Windows 11 avec Microsoft Intune. Les appareils exécutent plusieurs applications métier et reçoivent déjà des profils de configuration d'appareil pour les paramètres de pare-feu et de Windows Update. Le RSSI veut appliquer la base de référence de sécurité Intune pour Windows à tous les appareils.

    Vous devez recommander une approche de déploiement qui réduit au minimum le risque de casser les applications ou de créer des paramètres en conflit.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Assign the baseline with its default values to all the devices at once, and remove the existing configuration profiles.", fr: "Attribuer la base de référence avec ses valeurs par défaut à tous les appareils en une fois, et supprimer les profils de configuration existants." } }
    - { id: b, text: { en: "Assign the baseline to all the devices, and also deploy the matching Group Policy baseline as a fallback.", fr: "Attribuer la base de référence à tous les appareils, et déployer aussi la base de référence de stratégie de groupe correspondante comme solution de repli." } }
    - { id: c, text: { en: "Create the baseline profile from an earlier baseline version, because older versions have less restrictive defaults.", fr: "Créer le profil de base de référence à partir d'une version antérieure, car les anciennes versions ont des valeurs par défaut moins restrictives." } }
    - { id: d, text: { en: "Review conflicts with the existing profiles, assign the baseline to a pilot group, and check per-setting status before a wider rollout.", fr: "Examiner les conflits avec les profils existants, attribuer la base de référence à un groupe pilote, et vérifier l'état par paramètre avant un déploiement plus large." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Baseline defaults are almost always the most restrictive values, and baselines often manage the same settings as other profiles. Microsoft advises reviewing the settings for conflicting values and customizing the baseline; monitoring per-setting status on a pilot group reveals problems before they reach every device.
    fr: |
      Les valeurs par défaut d'une base de référence sont presque toujours les plus restrictives, et les bases de référence gèrent souvent les mêmes paramètres que d'autres profils. Microsoft conseille d'examiner les paramètres pour détecter les valeurs en conflit et de personnaliser la base de référence ; le suivi de l'état par paramètre sur un groupe pilote révèle les problèmes avant qu'ils n'atteignent tous les appareils.
  options:
    a:
      en: |
        Restrictive defaults deployed everywhere at once maximize the risk of breaking the applications.
      fr: |
        Des valeurs par défaut restrictives déployées partout en une fois maximisent le risque de casser les applications.
    b:
      en: |
        Managing the same settings from Intune and Group Policy creates conflicts instead of avoiding them.
      fr: |
        Gérer les mêmes paramètres depuis Intune et la stratégie de groupe crée des conflits au lieu de les éviter.
    c:
      en: |
        You can't create new profiles from an older baseline version; older versions are read-only.
      fr: |
        Vous ne pouvez pas créer de nouveaux profils à partir d'une version antérieure de la base de référence ; les anciennes versions sont en lecture seule.
references:
  - title: Use security baselines to help secure Windows devices you manage with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/security-baselines
