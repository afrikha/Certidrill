id: sc100-3b-client-asr
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has 4,000 Windows 11 devices onboarded to Microsoft Defender for Endpoint and managed by Microsoft Intune. Several recent incidents started with a malicious Office macro that launched PowerShell, or with an executable attachment opened from Outlook.

    You need to recommend a control that blocks Office applications from creating child processes and blocks executable content from email clients. Users must still be able to run the applications they currently use.

    What should you include in the recommendation?
  fr: |
    Adatum dispose de 4 000 appareils Windows 11 intégrés à Microsoft Defender for Endpoint et gérés par Microsoft Intune. Plusieurs incidents récents ont commencé par une macro Office malveillante qui a lancé PowerShell, ou par une pièce jointe exécutable ouverte depuis Outlook.

    Vous devez recommander un contrôle qui empêche les applications Office de créer des processus enfants et qui bloque le contenu exécutable provenant des clients de messagerie. Les utilisateurs doivent toujours pouvoir exécuter les applications qu'ils utilisent actuellement.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "App Control for Business policies", fr: "Des stratégies App Control for Business" } }
    - { id: b, text: { en: "Attack surface reduction rules", fr: "Des règles de réduction de la surface d'attaque" } }
    - { id: c, text: { en: "Tamper protection", fr: "La protection contre les falsifications" } }
    - { id: d, text: { en: "Network protection", fr: "La protection du réseau" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Attack surface reduction rules target specific software behaviors that malware abuses, such as Office applications creating child processes and executable content launched from email. They block those behaviors without restricting which applications users can run.
    fr: |
      Les règles de réduction de la surface d'attaque ciblent des comportements logiciels précis exploités par les logiciels malveillants, comme la création de processus enfants par les applications Office et le contenu exécutable lancé depuis la messagerie. Elles bloquent ces comportements sans restreindre les applications que les utilisateurs peuvent exécuter.
  options:
    a:
      en: |
        App Control for Business decides which applications and drivers may run; it doesn't target the behavior of an allowed application such as Word starting PowerShell.
      fr: |
        App Control for Business détermine quelles applications et quels pilotes peuvent s'exécuter ; il ne cible pas le comportement d'une application autorisée, comme Word qui lance PowerShell.
    c:
      en: |
        Tamper protection stops changes to Defender security settings; it doesn't block macro or email behaviors.
      fr: |
        La protection contre les falsifications empêche la modification des paramètres de sécurité de Defender ; elle ne bloque pas les comportements des macros ou de la messagerie.
    d:
      en: |
        Network protection blocks connections to dangerous domains and IP addresses, not process creation by Office applications.
      fr: |
        La protection du réseau bloque les connexions vers des domaines et des adresses IP dangereux, pas la création de processus par les applications Office.
references:
  - title: ASR rules reference
    url: https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference
