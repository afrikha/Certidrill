id: sc100-cs3b-server-onboarding
objective: "3.1.5"
type: dropdown
caseStudy: sc100-cs3b-fabrikam-freight
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend how to onboard the servers to Azure. The solution must meet the server management requirements and the general requirements.

    What should you recommend for each group of servers? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander la façon d'intégrer les serveurs à Azure. La solution doit respecter les exigences relatives à la gestion des serveurs et les exigences générales.

    Que devez-vous recommander pour chaque groupe de serveurs ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Rotterdam datacenter servers: [[onprem]]

      EC2 instances and Compute Engine VMs: [[cloud]]
    fr: |
      Serveurs du centre de données de Rotterdam : [[onprem]]

      Instances EC2 et machines virtuelles Compute Engine : [[cloud]]
  slots:
    - id: onprem
      options:
        - { id: arc, text: { en: "Connect them as Azure Arc-enabled servers", fr: "Les connecter en tant que serveurs avec Azure Arc" } }
        - { id: ama, text: { en: "Install the Azure Monitor Agent with a data collection rule", fr: "Installer l'agent Azure Monitor avec une règle de collecte de données" } }
        - { id: mde, text: { en: "Onboard them to Microsoft Defender for Endpoint", fr: "Les intégrer à Microsoft Defender for Endpoint" } }
    - id: cloud
      options:
        - { id: script, text: { en: "Run the Azure Arc onboarding script on each instance and VM", fr: "Exécuter le script d'intégration Azure Arc sur chaque instance et machine virtuelle" } }
        - { id: auto, text: { en: "Enable Azure Arc autoprovisioning in the AWS and GCP connectors", fr: "Activer le provisionnement automatique d'Azure Arc dans les connecteurs AWS et GCP" } }
        - { id: ama, text: { en: "Install the Azure Monitor Agent with a data collection rule", fr: "Installer l'agent Azure Monitor avec une règle de collecte de données" } }
        - { id: mde, text: { en: "Onboard them to Microsoft Defender for Endpoint", fr: "Les intégrer à Microsoft Defender for Endpoint" } }
answer:
  values: { onprem: arc, cloud: auto }
explanation:
  correct:
    en: |-
      Azure Arc-enabled servers project machines that run outside Azure as Azure resources, so Azure Policy and Azure RBAC apply to them. For AWS and GCP, autoprovisioning in the Defender for Cloud connectors installs Azure Arc and the enabled extensions automatically on each newly detected instance, which covers the instances created every week without manual work.
    fr: |-
      Les serveurs avec Azure Arc projettent les machines exécutées en dehors d'Azure sous forme de ressources Azure, ce qui permet d'y appliquer Azure Policy et Azure RBAC. Pour AWS et GCP, le provisionnement automatique dans les connecteurs Defender pour le cloud installe automatiquement Azure Arc et les extensions activées sur chaque nouvelle instance détectée, ce qui couvre les instances créées chaque semaine sans intervention manuelle.
  options:
    script:
      en: |-
        Running the onboarding script on each machine works for existing instances, but each new instance needs a manual action, which doesn't meet the automatic onboarding requirement.
      fr: |-
        Exécuter le script d'intégration sur chaque machine fonctionne pour les instances existantes, mais chaque nouvelle instance demande une action manuelle, ce qui ne respecte pas l'exigence d'intégration automatique.
    ama:
      en: |-
        The Azure Monitor Agent collects monitoring data; it doesn't turn a machine into an Azure resource.
      fr: |-
        L'agent Azure Monitor collecte des données de supervision ; il ne transforme pas une machine en ressource Azure.
    mde:
      en: |-
        Defender for Endpoint protects the servers, but it doesn't create Azure resources to which Azure Policy and Azure RBAC apply.
      fr: |-
        Defender for Endpoint protège les serveurs, mais il ne crée pas de ressources Azure auxquelles appliquer Azure Policy et Azure RBAC.
references:
  - title: Azure Arc-enabled servers Overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
  - title: Connect your GCP Project
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-gcp
