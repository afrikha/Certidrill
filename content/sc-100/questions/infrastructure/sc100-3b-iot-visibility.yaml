id: sc100-3b-iot-visibility
objective: "3.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso Logistics has the following devices:

    - Network printers and VoIP phones on the corporate network of each warehouse. Every warehouse laptop is onboarded to Microsoft Defender for Endpoint.
    - PLCs and HMIs that control conveyor belts on an isolated OT network in each warehouse.
    - Edge gateways that run Azure IoT Operations on Azure Arc-enabled Kubernetes clusters.

    None of the printers, phones, PLCs or HMIs can run an agent. You need to recommend a threat visibility solution for each device type.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Logistics dispose des appareils suivants :

    - Des imprimantes réseau et des téléphones VoIP sur le réseau d'entreprise de chaque entrepôt. Chaque ordinateur portable des entrepôts est intégré à Microsoft Defender for Endpoint.
    - Des PLC et des HMI qui pilotent des convoyeurs sur un réseau OT isolé dans chaque entrepôt.
    - Des passerelles de périphérie qui exécutent Azure IoT Operations sur des clusters Kubernetes avec Azure Arc.

    Aucune imprimante, aucun téléphone, aucun PLC ni aucune HMI ne peut exécuter d'agent. Vous devez recommander une solution de visibilité sur les menaces pour chaque type d'appareil.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Printers and VoIP phones: [[eiot]]

      PLCs and HMIs: [[ot]]

      Edge clusters that run Azure IoT Operations: [[edge]]
    fr: |
      Imprimantes et téléphones VoIP : [[eiot]]

      PLC et HMI : [[ot]]

      Clusters de périphérie qui exécutent Azure IoT Operations : [[edge]]
  slots:
    - id: eiot
      options:
        - { id: eiot, text: { en: "Enterprise IoT security with Defender for Endpoint", fr: "Sécurité IoT d'entreprise avec Defender for Endpoint" } }
        - { id: ot, text: { en: "Defender for IoT OT network sensors", fr: "Capteurs réseau OT de Defender for IoT" } }
        - { id: mdc, text: "Microsoft Defender for Containers" }
    - id: ot
      options:
        - { id: eiot, text: { en: "Enterprise IoT security with Defender for Endpoint", fr: "Sécurité IoT d'entreprise avec Defender for Endpoint" } }
        - { id: ot, text: { en: "Defender for IoT OT network sensors", fr: "Capteurs réseau OT de Defender for IoT" } }
        - { id: mdc, text: "Microsoft Defender for Containers" }
    - id: edge
      options:
        - { id: eiot, text: { en: "Enterprise IoT security with Defender for Endpoint", fr: "Sécurité IoT d'entreprise avec Defender for Endpoint" } }
        - { id: ot, text: { en: "Defender for IoT OT network sensors", fr: "Capteurs réseau OT de Defender for IoT" } }
        - { id: mdc, text: "Microsoft Defender for Containers" }
answer:
  values: { eiot: eiot, ot: ot, edge: mdc }
explanation:
  correct:
    en: |
      Enterprise IoT security builds on Defender for Endpoint to cover printers, phones and conferencing systems on the corporate network. OT network sensors of Defender for IoT monitor industrial devices and protocols on isolated OT networks without agents. For edge solutions that run on Kubernetes, Microsoft recommends Defender for IoT together with Defender for Containers, which protects the cluster workloads.
    fr: |
      La sécurité IoT d'entreprise s'appuie sur Defender for Endpoint pour couvrir les imprimantes, les téléphones et les systèmes de conférence du réseau d'entreprise. Les capteurs réseau OT de Defender for IoT surveillent sans agent les appareils et protocoles industriels des réseaux OT isolés. Pour les solutions de périphérie qui s'exécutent sur Kubernetes, Microsoft recommande Defender for IoT avec Defender for Containers, qui protège les charges de travail du cluster.
references:
  - title: What is Microsoft Defender for IoT?
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/overview
  - title: Secure your IoT solutions
    url: https://learn.microsoft.com/en-us/azure/iot/iot-overview-security
