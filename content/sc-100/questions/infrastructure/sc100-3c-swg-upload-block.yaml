id: sc100-3c-swg-upload-block
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso uses Microsoft Entra Internet Access as its secure web gateway. The web content filtering policies use web categories and FQDNs, and the Global Secure Access client runs on all managed devices.

    The data protection team requires that users can browse a public file-sharing website served over HTTPS but can't upload files to it. Today, the gateway can only allow or block the whole site.

    What should you include in the recommendation?
  fr: |
    Contoso utilise Accès Internet Microsoft Entra comme passerelle web sécurisée. Les stratégies de filtrage du contenu web utilisent des catégories web et des FQDN, et le client Global Secure Access s'exécute sur tous les appareils gérés.

    L'équipe de protection des données exige que les utilisateurs puissent consulter un site public de partage de fichiers servi en HTTPS, sans pouvoir y charger de fichiers. Aujourd'hui, la passerelle ne peut qu'autoriser ou bloquer le site entier.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "Block the FQDN of the site in a filtering policy with a higher priority than the allow rule", fr: "Bloquer le FQDN du site dans une stratégie de filtrage de priorité plus élevée que la règle d'autorisation" } }
    - { id: b, text: { en: "Block the web category of the site in the baseline profile", fr: "Bloquer la catégorie web du site dans le profil de base" } }
    - { id: c, text: { en: "Turn on universal tenant restrictions with a tenant restrictions v2 policy that blocks the site", fr: "Activer les restrictions de locataire universelles avec une stratégie de restrictions de locataire v2 qui bloque le site" } }
    - { id: d, text: { en: "Turn on TLS inspection, and add a rule for the site with an HTTP method condition on POST and PUT", fr: "Activer l'inspection TLS, et ajouter une règle pour le site avec une condition de méthode HTTP sur POST et PUT" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Without TLS inspection, the gateway sees only the SNI of HTTPS connections, so it can allow or block a whole site but can't see the HTTP methods. With TLS inspection on, a filtering rule can add an HTTP method condition, which blocks uploads (POST, PUT) while browsing (GET) stays allowed.
    fr: |-
      Sans inspection TLS, la passerelle ne voit que le SNI des connexions HTTPS : elle peut autoriser ou bloquer un site entier, mais ne voit pas les méthodes HTTP. Avec l'inspection TLS activée, une règle de filtrage peut ajouter une condition de méthode HTTP, qui bloque les chargements (POST, PUT) tandis que la consultation (GET) reste autorisée.
  options:
    a:
      en: |-
        Blocking the FQDN blocks browsing as well as uploads.
      fr: |-
        Bloquer le FQDN bloque la consultation autant que les chargements.
    b:
      en: |-
        A category block in the baseline profile also blocks the whole site, and every site of that category, for all traffic.
      fr: |-
        Un blocage par catégorie dans le profil de base bloque aussi le site entier, et tous les sites de cette catégorie, pour tout le trafic.
    c:
      en: |-
        Tenant restrictions control sign-ins to Microsoft Entra tenants; they don't filter a third-party website.
      fr: |-
        Les restrictions de locataire contrôlent les connexions aux locataires Microsoft Entra ; elles ne filtrent pas un site web tiers.
references:
  - title: How to configure Global Secure Access web content filtering
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-web-content-filtering
