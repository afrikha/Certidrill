id: sc100-3c-net-admin-access
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys administers about 80 Windows and Linux virtual machines in Azure. Today, each VM has a public IP address with RDP or SSH open to the administrators' home IP addresses.

    The new design must remove all public IP addresses from the VMs and keep management ports closed to the internet. Administrators must open RDP and SSH sessions over TLS from a web browser, without installing a VPN client.

    What should you recommend?
  fr: |
    Tailspin Toys administre environ 80 machines virtuelles Windows et Linux dans Azure. Aujourd'hui, chaque machine virtuelle possède une adresse IP publique avec RDP ou SSH ouvert vers les adresses IP personnelles des administrateurs.

    La nouvelle conception doit supprimer toutes les adresses IP publiques des machines virtuelles et garder les ports de gestion fermés à Internet. Les administrateurs doivent ouvrir des sessions RDP et SSH sur TLS depuis un navigateur web, sans installer de client VPN.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Bastion deployed in the virtual network of the VMs or in a peered hub", fr: "Azure Bastion déployé dans le réseau virtuel des machines virtuelles ou dans un hub relié par peering" } }
    - { id: b, text: { en: "Just-in-time VM access in Defender for Cloud on the current public IP addresses", fr: "L'accès juste-à-temps aux machines virtuelles de Defender for Cloud sur les adresses IP publiques actuelles" } }
    - { id: c, text: { en: "A point-to-site VPN on Azure VPN Gateway with Microsoft Entra authentication", fr: "Un VPN point à site sur la passerelle VPN Azure avec l'authentification Microsoft Entra" } }
    - { id: d, text: { en: "Azure Firewall DNAT rules that translate a public port to each VM", fr: "Des règles DNAT du Pare-feu Azure qui traduisent un port public vers chaque machine virtuelle" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Azure Bastion is a managed PaaS service that provides RDP and SSH over TLS from the Azure portal, so the VMs need no public IP address and no management port is exposed to the internet.
    fr: |-
      Azure Bastion est un service PaaS managé qui fournit RDP et SSH sur TLS depuis le portail Azure : les machines virtuelles n'ont besoin d'aucune adresse IP publique et aucun port de gestion n'est exposé à Internet.
  options:
    b:
      en: |-
        Just-in-time access reduces exposure time, but the VMs keep their public IP addresses and the ports are still opened to the internet on demand.
      fr: |-
        L'accès juste-à-temps réduit la durée d'exposition, mais les machines virtuelles gardent leurs adresses IP publiques et les ports restent ouverts à Internet à la demande.
    c:
      en: |-
        A point-to-site VPN requires a VPN client on each administrator's device, which the requirement excludes.
      fr: |-
        Un VPN point à site exige un client VPN sur l'appareil de chaque administrateur, ce que l'exigence exclut.
    d:
      en: |-
        DNAT rules publish RDP and SSH on the firewall's public IP address, so management ports stay exposed to the internet.
      fr: |-
        Les règles DNAT publient RDP et SSH sur l'adresse IP publique du pare-feu : les ports de gestion restent exposés à Internet.
references:
  - title: What is Azure Bastion?
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
