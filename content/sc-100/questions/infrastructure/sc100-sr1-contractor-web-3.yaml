id: sc100-sr1-contractor-web-3
objective: "3.4.2"
type: series_yesno
series: sc100-sr1-contractor-web
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You recommend linking a Gambling filtering policy to the baseline security profile.
  fr: Vous recommandez de lier une stratégie de filtrage Gambling au profil de sécurité de base.
body:
  solution:
    en: |
      You recommend enabling the **Internet Access** traffic forwarding profile for all users. You create a web content filtering policy that blocks the **Gambling** category and link it to the **baseline** security profile. No Conditional Access policy is created.
    fr: |
      Vous recommandez d'activer le profil de transfert du trafic **Internet Access** pour tous les utilisateurs. Vous créez une stratégie de filtrage du contenu web qui bloque la catégorie **Gambling** et la liez au profil de sécurité de **base**. Aucune stratégie d'accès conditionnel n'est créée.
answer: { value: false }
explanation:
  correct:
    en: The baseline profile is enforced by default, without Conditional Access, as the lowest-priority catch-all for the traffic that Global Secure Access processes. It can't be scoped to a group, so it would block Gambling for every user and change the internet access of users outside Contractors.
    fr: "Le profil de base est appliqué par défaut, sans accès conditionnel, comme règle fourre-tout de plus basse priorité pour le trafic traité par Global Secure Access. Il ne peut pas être limité à un groupe : il bloquerait donc Gambling pour tous les utilisateurs et modifierait l'accès Internet des utilisateurs extérieurs à Contractors."
references:
  - title: How to configure Global Secure Access web content filtering
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-web-content-filtering
