id: sc100-3a-choke-point-hotarea
objective: "3.1.7"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Security Exposure Management. The choke points that lead to the critical assets of Tailspin Toys are shown in the following table.

    Answer each prompt by selecting the appropriate node.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Security Exposure Management. Les points d'étranglement qui mènent aux ressources critiques de Tailspin Toys figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le nœud approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Securing this node breaks the largest number of attack paths", fr: "Sécuriser ce nœud coupe le plus grand nombre de chemins d'attaque" }
    - id: p2
      text: { en: "If an attacker compromises this node, the largest number of critical assets is at risk", fr: "Si un attaquant compromet ce nœud, le plus grand nombre de ressources critiques est menacé" }
  grid:
    header: [{ en: "Node", fr: "Nœud" }, { en: "Type", fr: "Type" }, { en: "Attack paths through the node", fr: "Chemins d'attaque passant par le nœud" }, { en: "Critical assets in the blast radius", fr: "Ressources critiques dans le rayon d'impact" }]
    rows:
      - [{ text: svc-backup, area: n1 }, { text: { en: "User account", fr: "Compte d'utilisateur" } }, { text: "42" }, { text: "3" }]
      - [{ text: SRV-APP07, area: n2 }, { text: { en: "Device", fr: "Appareil" } }, { text: "18" }, { text: "2" }]
      - [{ text: Helpdesk-Ops, area: n3 }, { text: { en: "Group", fr: "Groupe" } }, { text: "27" }, { text: "8" }]
      - [{ text: kv-payments, area: n4 }, { text: { en: "Key vault", fr: "Coffre de clés" } }, { text: "9" }, { text: "1" }]
answer:
  values: { p1: n1, p2: n3 }
explanation:
  correct:
    en: A choke point is a node where several attack paths to critical assets intersect, so securing the node with the most paths, svc-backup, breaks the most paths at once. The blast radius shows how compromising one asset could affect others; Helpdesk-Ops has the most critical assets in its blast radius, even though fewer paths go through it.
    fr: Un point d'étranglement est un nœud où se croisent plusieurs chemins d'attaque vers des ressources critiques ; sécuriser le nœud qui compte le plus de chemins, svc-backup, coupe donc le plus de chemins à la fois. Le rayon d'impact montre comment la compromission d'une ressource peut en affecter d'autres ; Helpdesk-Ops a le plus de ressources critiques dans son rayon d'impact, même si moins de chemins passent par lui.
references:
  - title: Work with attack paths in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/review-attack-paths
