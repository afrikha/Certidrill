id: sc100-3b-iotw-pki-design
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Health is designing the PKI for 40,000 connected infusion pumps that will authenticate to Azure IoT Hub with CA-signed X.509 certificates. A root CA signs a subordinate CA, which signs the device certificates.

    You need to complete the security requirements of the IoT workload.

    What should you include in the requirements? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Health conçoit la PKI de 40 000 pompes à perfusion connectées qui s'authentifieront auprès d'Azure IoT Hub avec des certificats X.509 signés par une autorité de certification. Une autorité de certification racine signe une autorité subordonnée, qui signe les certificats des appareils.

    Vous devez compléter les exigences de sécurité de la charge de travail IoT.

    Que devez-vous inclure dans les exigences ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Root CA: [[root]]

      Subject common name (CN) of each device certificate: [[cn]]

      Pump whose private key is compromised: [[revoke]]
    fr: |
      Autorité de certification racine : [[root]]

      Nom commun (CN) du sujet de chaque certificat d'appareil : [[cn]]

      Pompe dont la clé privée est compromise : [[revoke]]
  slots:
    - id: root
      options:
        - { id: offline, text: { en: "Kept offline", fr: "Conservée hors connexion" } }
        - { id: hub, text: { en: "Uploaded to IoT Hub with its private key", fr: "Chargée dans IoT Hub avec sa clé privée" } }
        - { id: device, text: { en: "Installed on each pump with its private key", fr: "Installée sur chaque pompe avec sa clé privée" } }
    - id: cn
      options:
        - { id: devid, text: { en: "The device ID registered in IoT Hub", fr: "L'ID d'appareil inscrit dans IoT Hub" } }
        - { id: host, text: { en: "The host name of the IoT hub", fr: "Le nom d'hôte du hub IoT" } }
        - { id: ca, text: { en: "The name of the subordinate CA", fr: "Le nom de l'autorité de certification subordonnée" } }
    - id: revoke
      options:
        - { id: crl, text: { en: "Add its certificate to the CA's revocation list", fr: "Ajouter son certificat à la liste de révocation de l'autorité de certification" } }
        - { id: disable, text: { en: "Disable the device in the IoT Hub identity registry", fr: "Désactiver l'appareil dans le registre des identités d'IoT Hub" } }
        - { id: removeca, text: { en: "Delete the subordinate CA certificate from IoT Hub", fr: "Supprimer le certificat de l'autorité subordonnée d'IoT Hub" } }
answer:
  values: { root: offline, cn: devid, revoke: disable }
explanation:
  correct:
    en: |
      The root CA is the trust anchor and is kept offline in production, while a subordinate CA signs the device certificates; private keys are never uploaded or shared. The common name of a device certificate must match the device ID registered in IoT Hub. IoT Hub doesn't check certificate revocation lists, so you block a compromised pump by disabling its device identity in the registry.
    fr: |
      L'autorité racine est l'ancre de confiance et reste hors connexion en production, tandis qu'une autorité subordonnée signe les certificats des appareils ; les clés privées ne sont jamais chargées ni partagées. Le nom commun d'un certificat d'appareil doit correspondre à l'ID d'appareil inscrit dans IoT Hub. IoT Hub ne vérifie pas les listes de révocation de certificats : vous bloquez une pompe compromise en désactivant son identité d'appareil dans le registre.
  options:
    hub:
      en: |
        The file uploaded to IoT Hub must never contain a private key; ownership is proven with a signed challenge instead.
      fr: |
        Le fichier chargé dans IoT Hub ne doit jamais contenir de clé privée ; la possession est prouvée par la signature d'un défi.
    crl:
      en: |
        IoT Hub doesn't check CRLs, so the pump would keep connecting.
      fr: |
        IoT Hub ne vérifie pas les listes de révocation ; la pompe continuerait de se connecter.
    removeca:
      en: |
        Deleting the CA certificate would block all 40,000 pumps, not only the compromised one.
      fr: |
        Supprimer le certificat de l'autorité bloquerait les 40 000 pompes, pas seulement la pompe compromise.
references:
  - title: Authenticate with X.509 certificates
    url: https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-x509
  - title: "Tutorial: Create and upload certificates for testing"
    url: https://learn.microsoft.com/en-us/azure/iot-hub/iot-hub-security-x509-get-started
