id: sc100-3a-arc-design-dragdrop
objective: "3.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing the Azure Arc integration of 3,000 on-premises Windows Server and Linux servers. The design must meet three requirements.

    What should you include in the design for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit l'intégration Azure Arc de 3 000 serveurs Windows Server et Linux locaux. La conception doit répondre à trois exigences.

    Que devez-vous inclure dans la conception pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sp, text: { en: "A service principal that has the Azure Connected Machine Onboarding role", fr: "Un principal de service qui dispose du rôle Azure Connected Machine Onboarding" } }
    - { id: spcontrib, text: { en: "A service principal that has the Contributor role on the subscription", fr: "Un principal de service qui dispose du rôle Contributor sur l'abonnement" } }
    - { id: mc, text: { en: "Azure Policy machine configuration assigned at the management group", fr: "La configuration des machines Azure Policy attribuée au groupe d'administration" } }
    - { id: lighthouse, text: Azure Lighthouse }
    - { id: pls, text: { en: "An Azure Arc private link scope", fr: "Une étendue de liaison privée Azure Arc" } }
  targets:
    - id: onboard
      text: { en: "Connect the servers by running a script, with an identity that can do nothing else than onboard machines", fr: "Connecter les serveurs en exécutant un script, avec une identité qui ne peut rien faire d'autre qu'intégrer des machines" }
    - id: baseline
      text: { en: "Audit the same operating system settings on the Azure VMs and on the Arc-enabled servers", fr: "Auditer les mêmes paramètres de système d'exploitation sur les machines virtuelles Azure et sur les serveurs compatibles Arc" }
    - id: msp
      text: { en: "Let a managed service provider manage the Arc-enabled servers from its own Microsoft Entra tenant", fr: "Permettre à un fournisseur de services managés de gérer les serveurs compatibles Arc depuis son propre locataire Microsoft Entra" }
answer:
  mapping: { onboard: sp, baseline: mc, msp: lighthouse }
explanation:
  correct:
    en: For onboarding at scale, the generated script uses a service principal that holds the Azure Connected Machine Onboarding role, a limited identity with only the permission needed to connect machines. Machine configuration audits operating system settings on Azure VMs and on hybrid Arc-enabled machines, so one assignment at the management group covers both. Azure Lighthouse is supported for Arc-enabled servers and lets a service provider manage delegated subscriptions and resource groups.
    fr: Pour l'intégration à grande échelle, le script généré utilise un principal de service qui détient le rôle Azure Connected Machine Onboarding, une identité limitée qui ne dispose que de l'autorisation nécessaire pour connecter des machines. La configuration des machines audite les paramètres du système d'exploitation sur les machines virtuelles Azure et sur les machines hybrides compatibles Arc ; une seule attribution au groupe d'administration couvre donc les deux. Azure Lighthouse est pris en charge pour les serveurs compatibles Arc et permet à un fournisseur de services de gérer des abonnements et des groupes de ressources délégués.
  options:
    spcontrib:
      en: Contributor on the subscription grants far more than onboarding, which breaks the requirement.
      fr: Contributor sur l'abonnement accorde bien plus que l'intégration, ce qui contrevient à l'exigence.
    pls:
      en: A private link scope keeps the agent traffic on private IPs; none of the requirements is about the network path.
      fr: Une étendue de liaison privée maintient le trafic de l'agent sur des IP privées ; aucune des exigences ne concerne le chemin réseau.
references:
  - title: Connect hybrid machines to Azure at scale
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/onboard-service-principal
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
