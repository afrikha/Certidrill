id: sc100-3a-exposure-process-order
objective: "3.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. licensed Microsoft Security Exposure Management. You are specifying the posture management process that the security team will follow to reduce the exposure of its payment systems. The attack paths shown to the team must be complete and must target the payment systems.

    Which four actions should the process include in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. a acquis une licence Microsoft Security Exposure Management. Vous spécifiez le processus de gestion de la posture que l'équipe de sécurité suivra pour réduire l'exposition de ses systèmes de paiement. Les chemins d'attaque présentés à l'équipe doivent être complets et doivent cibler les systèmes de paiement.

    Quelles sont les quatre actions que le processus doit inclure dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: data, text: { en: "Confirm that Defender for Endpoint, Defender Vulnerability Management and Defender for Cloud with CSPM provide their data.", fr: "Confirmer que Defender for Endpoint, Gestion des vulnérabilités Microsoft Defender et Defender for Cloud avec CSPM fournissent leurs données." } }
    - { id: crit, text: { en: "Review the critical asset classifications and add a custom classification for the payment systems.", fr: "Examiner les classifications de ressources critiques et ajouter une classification personnalisée pour les systèmes de paiement." } }
    - { id: paths, text: { en: "Review the attack paths and choke points that lead to the critical assets.", fr: "Examiner les chemins d'attaque et les points d'étranglement qui mènent aux ressources critiques." } }
    - { id: fix, text: { en: "Remediate the linked recommendations in the workload that owns them.", fr: "Corriger les recommandations associées dans la charge de travail dont elles relèvent." } }
    - { id: exempt, text: { en: "Exempt the recommendations that apply to assets that aren't critical.", fr: "Exempter les recommandations qui s'appliquent aux ressources non critiques." } }
    - { id: sentinel, text: { en: "Create a Microsoft Sentinel workspace to store the exposure graph.", fr: "Créer un espace de travail Microsoft Sentinel pour stocker le graphe d'exposition." } }
answer:
  sequence: [ data, crit, paths, fix ]
explanation:
  correct:
    en: Attack paths are generated from the data of the integrated workloads, and missing data or unlicensed workloads leave paths out, so the sources come first. Paths end at critical assets, which must therefore be classified before the paths are reviewed. Choke points then show where one fix breaks several paths, and the linked recommendations are remediated in their originating workload.
    fr: Les chemins d'attaque sont générés à partir des données des charges de travail intégrées, et des données manquantes ou des charges de travail sans licence font disparaître des chemins ; les sources viennent donc en premier. Les chemins aboutissent aux ressources critiques, qui doivent donc être classées avant l'examen des chemins. Les points d'étranglement montrent ensuite où une seule correction coupe plusieurs chemins, et les recommandations associées sont corrigées dans leur charge de travail d'origine.
  options:
    exempt:
      en: Exemptions are for false positives, risks covered by other controls or accepted risks; exempting every non-critical asset hides exposure that attack paths can use.
      fr: Les exemptions concernent les faux positifs, les risques couverts par d'autres contrôles ou les risques acceptés ; exempter toutes les ressources non critiques masque une exposition que les chemins d'attaque peuvent utiliser.
    sentinel:
      en: The enterprise exposure graph is built by Exposure Management itself; it doesn't need a Sentinel workspace.
      fr: Le graphe d'exposition d'entreprise est construit par Exposure Management lui-même ; il n'a pas besoin d'un espace de travail Sentinel.
references:
  - title: Work with attack paths in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/review-attack-paths
  - title: Overview of critical asset management in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/critical-asset-management
