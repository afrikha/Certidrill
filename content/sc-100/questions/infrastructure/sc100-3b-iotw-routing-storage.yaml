id: sc100-3b-iotw-routing-storage
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam Energy has an Azure IoT hub that receives telemetry from wind turbines. Message routing sends the telemetry to an Azure Storage account. The security baseline requires that the storage account accepts traffic only from selected virtual networks and that no service uses storage account keys or connection strings.

    You need to recommend how the IoT hub must write to the storage account.

    What should you recommend?
  fr: |
    Fabrikam Energy dispose d'un hub IoT Azure qui reçoit la télémétrie d'éoliennes. Le routage des messages envoie la télémétrie vers un compte Stockage Azure. La base de référence de sécurité exige que le compte de stockage n'accepte le trafic que depuis des réseaux virtuels sélectionnés et qu'aucun service n'utilise de clés de compte de stockage ni de chaînes de connexion.

    Vous devez recommander comment le hub IoT doit écrire dans le compte de stockage.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Use a key-based routing endpoint, and add the public IP address ranges of the Azure region to the storage firewall", fr: "Utiliser un point de terminaison de routage basé sur une clé, et ajouter les plages d'adresses IP publiques de la région Azure au pare-feu du stockage" } }
    - { id: b, text: { en: "Create a private endpoint for the IoT hub, and use the storage account connection string in the routing endpoint", fr: "Créer un point de terminaison privé pour le hub IoT, et utiliser la chaîne de connexion du compte de stockage dans le point de terminaison de routage" } }
    - { id: c, text: { en: "Give the IoT hub a managed identity with a data role on the storage account, and allow trusted Microsoft services on the storage firewall", fr: "Attribuer au hub IoT une identité managée avec un rôle de données sur le compte de stockage, et autoriser les services Microsoft approuvés sur le pare-feu du stockage" } }
    - { id: d, text: { en: "Turn off the storage firewall, and grant the IoT hub access to the container with a stored access policy", fr: "Désactiver le pare-feu du stockage, et accorder au hub IoT l'accès au conteneur avec une stratégie d'accès stockée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A storage account bound to a virtual network blocks IoT Hub by default. The IoT hub must use a managed identity that has RBAC permissions on the custom endpoint, and the trusted Microsoft services exception lets the hub reach the storage account through the firewall. No key or connection string is involved.
    fr: |
      Un compte de stockage lié à un réseau virtuel bloque IoT Hub par défaut. Le hub IoT doit utiliser une identité managée disposant d'autorisations RBAC sur le point de terminaison personnalisé, et l'exception des services Microsoft approuvés permet au hub de joindre le compte de stockage à travers le pare-feu. Aucune clé ni chaîne de connexion n'intervient.
  options:
    a:
      en: |
        Key-based authentication is forbidden by the baseline, and opening the firewall to public IP ranges breaks the selected-networks requirement; IoT Hub reaches a network-restricted storage account through the trusted Microsoft services exception.
      fr: |
        L'authentification par clé est interdite par la base de référence, et ouvrir le pare-feu à des plages d'adresses IP publiques enfreint l'exigence relative aux réseaux sélectionnés ; IoT Hub joint un compte de stockage restreint au réseau grâce à l'exception des services Microsoft approuvés.
    b:
      en: |
        A private endpoint for the IoT hub secures inbound connections to the hub, not the hub's outbound writes, and a connection string is forbidden.
      fr: |
        Un point de terminaison privé pour le hub IoT sécurise les connexions entrantes vers le hub, pas les écritures sortantes du hub, et une chaîne de connexion est interdite.
    d:
      en: |
        Turning off the firewall breaks the virtual network requirement, and a stored access policy is used with SAS tokens signed by a key.
      fr: |
        Désactiver le pare-feu enfreint l'exigence relative aux réseaux virtuels, et une stratégie d'accès stockée s'utilise avec des jetons SAS signés par une clé.
references:
  - title: Azure IoT Hub support for virtual networks
    url: https://learn.microsoft.com/en-us/azure/iot-hub/virtual-network-support
