id: sc100-cs1c-aks-guardrails
objective: "3.3.5"
type: yesno_statements
caseStudy: sc100-cs1c-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating how Defender for Containers can meet the container requirements. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez la façon dont Defender for Containers peut respecter les exigences relatives aux conteneurs. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Gated deployment rules can block the deployment to aks-games of images that don't meet the vulnerability policy.
        fr: |-
          Des règles de déploiement contrôlé peuvent bloquer le déploiement sur aks-games des images qui ne respectent pas la stratégie de vulnérabilité.
    - id: s2
      text:
        en: |-
          Azure Policy for Kubernetes can evaluate each request to the API server of aks-games and block the creation of privileged containers.
        fr: |-
          Azure Policy pour Kubernetes peut évaluer chaque requête adressée au serveur d'API de aks-games et bloquer la création de conteneurs privilégiés.
    - id: s3
      text:
        en: |-
          All the runtime threat detections for aks-games come from the analysis of the Kubernetes audit logs, so no component is required in the cluster.
        fr: |-
          Toutes les détections des menaces à l'exécution pour aks-games proviennent de l'analyse des journaux d'audit Kubernetes : aucun composant n'est donc nécessaire dans le cluster.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |-
      Software supply chain protection in Defender for Containers supports gated deployment rules that audit or block deployments of images that don't meet the vulnerability policy. Kubernetes data plane hardening uses Azure Policy for Kubernetes, which checks every request to the API server against the policies before it is persisted, so a policy can block privileged containers. Runtime threat protection combines agentless detections from the Kubernetes audit logs with sensor-based detections that require the Defender sensor in the cluster.
    fr: |-
      La protection de la chaîne d'approvisionnement logicielle de Defender for Containers prend en charge des règles de déploiement contrôlé qui auditent ou bloquent le déploiement des images qui ne respectent pas la stratégie de vulnérabilité. Le renforcement du plan de données Kubernetes utilise Azure Policy pour Kubernetes, qui vérifie chaque requête adressée au serveur d'API par rapport aux stratégies avant qu'elle soit persistée : une stratégie peut donc bloquer les conteneurs privilégiés. La protection contre les menaces à l'exécution combine des détections sans agent issues des journaux d'audit Kubernetes et des détections fondées sur le capteur Defender, qui doit être présent dans le cluster.
references:
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
