id: sc100-3b-web-origin-lockdown
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso Insurance publishes a claims portal that runs on Azure App Service. The portal is exposed to customers through an Azure Front Door Premium profile with a WAF policy.

    A penetration test showed that attackers can bypass the WAF by sending requests directly to the app's azurewebsites.net host name. The security baseline requires that the app has no public inbound endpoint and that all customer traffic goes through Front Door.

    What should you recommend?
  fr: |
    Contoso Insurance publie un portail de déclaration de sinistres qui s'exécute sur Azure App Service. Le portail est exposé aux clients par un profil Azure Front Door Premium avec une stratégie WAF.

    Un test d'intrusion a montré que des attaquants peuvent contourner le WAF en envoyant des requêtes directement au nom d'hôte azurewebsites.net de l'application. La base de référence de sécurité exige que l'application n'ait aucun point de terminaison entrant public et que tout le trafic des clients passe par Front Door.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Connect Front Door to the app through Private Link, and disable public network access on the app.", fr: "Connecter Front Door à l'application par Private Link, et désactiver l'accès au réseau public sur l'application." } }
    - { id: b, text: { en: "Add an access restriction that allows only the AzureFrontDoor.Backend service tag.", fr: "Ajouter une restriction d'accès qui n'autorise que l'étiquette de service AzureFrontDoor.Backend." } }
    - { id: c, text: { en: "Enable virtual network integration on the app, and add an NSG that denies internet traffic.", fr: "Activer l'intégration au réseau virtuel sur l'application, et ajouter un NSG qui refuse le trafic Internet." } }
    - { id: d, text: { en: "Enable HTTPS Only on the app, and require a minimum TLS version of 1.2.", fr: "Activer HTTPS uniquement sur l'application, et exiger TLS 1.2 comme version minimale." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Front Door Premium supports a Private Link connection to the origin, so it reaches the app through a private endpoint. With public network access disabled, the app has no public inbound endpoint and the WAF can't be bypassed.
    fr: |
      Front Door Premium prend en charge une connexion Private Link vers l'origine ; il joint donc l'application par un point de terminaison privé. Avec l'accès au réseau public désactivé, l'application n'a plus de point de terminaison entrant public et le WAF ne peut plus être contourné.
  options:
    b:
      en: |
        An access restriction filters the traffic that reaches the public endpoint, but the endpoint stays public, which the baseline forbids.
      fr: |
        Une restriction d'accès filtre le trafic qui atteint le point de terminaison public, mais ce point de terminaison reste public, ce que la base de référence interdit.
    c:
      en: |
        Virtual network integration controls outbound traffic only; it can't restrict inbound access to the app.
      fr: |
        L'intégration au réseau virtuel ne contrôle que le trafic sortant ; elle ne peut pas restreindre l'accès entrant à l'application.
    d:
      en: |
        HTTPS Only and TLS 1.2 protect the transport, but direct requests over HTTPS still bypass Front Door.
      fr: |
        HTTPS uniquement et TLS 1.2 protègent le transport, mais des requêtes directes en HTTPS contournent toujours Front Door.
references:
  - title: Comparison between Azure Front Door and Azure Content Delivery Network
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/tier-comparison
  - title: Azure security baseline for App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/security-recommendations
