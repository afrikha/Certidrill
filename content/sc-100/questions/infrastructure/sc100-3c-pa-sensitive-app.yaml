id: sc100-3c-pa-sensitive-app
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso replaced its VPN with Microsoft Entra Private Access. A Quick Access app that includes 10.1.0.0/16 on all ports is assigned to all employees.

    A finance database server at 10.1.8.20 listens on TCP 1433. The security team requires that:

    - only members of the Finance group can reach the server;
    - each connection to the server requires phishing-resistant MFA from a compliant device;
    - the other resources in 10.1.0.0/16 keep their current access rules.

    What should you recommend?
  fr: |
    Contoso a remplacé son VPN par Accès privé Microsoft Entra. Une application Quick Access qui inclut 10.1.0.0/16 sur tous les ports est attribuée à tous les employés.

    Un serveur de base de données financière à l'adresse 10.1.8.20 écoute sur TCP 1433. L'équipe de sécurité exige que :

    - seuls les membres du groupe Finance puissent atteindre le serveur ;
    - chaque connexion au serveur exige une MFA résistante au hameçonnage depuis un appareil conforme ;
    - les autres ressources de 10.1.0.0/16 conservent leurs règles d'accès actuelles.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Global Secure Access app for 10.1.8.20:1433 assigned to Finance, with a Conditional Access policy for MFA and device compliance", fr: "Une application Global Secure Access pour 10.1.8.20:1433 attribuée à Finance, avec une stratégie d'accès conditionnel pour la MFA et la conformité de l'appareil" } }
    - { id: b, text: { en: "A Conditional Access policy for MFA and device compliance on the Quick Access app, applied to all users", fr: "Une stratégie d'accès conditionnel pour la MFA et la conformité de l'appareil sur l'application Quick Access, appliquée à tous les utilisateurs" } }
    - { id: c, text: { en: "An NSG rule on the database subnet that allows TCP 1433 only from the IP addresses of the Finance devices", fr: "Une règle NSG sur le sous-réseau de la base de données qui n'autorise TCP 1433 que depuis les adresses IP des appareils de Finance" } }
    - { id: d, text: { en: "A second Quick Access app for 10.1.8.20:1433 assigned to Finance, with a Conditional Access policy for MFA", fr: "Une seconde application Quick Access pour 10.1.8.20:1433 attribuée à Finance, avec une stratégie d'accès conditionnel pour la MFA" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A per-app Global Secure Access app can overlap with Quick Access, and its segment takes priority: traffic to 10.1.8.20:1433 is evaluated against the app's own assignments and Conditional Access policy, so only Finance can reach it with the required controls. The rest of 10.1.0.0/16 keeps flowing through Quick Access unchanged.
    fr: |-
      Une application Global Secure Access par application peut chevaucher Quick Access, et son segment a priorité : le trafic vers 10.1.8.20:1433 est évalué par rapport aux attributions et à la stratégie d'accès conditionnel propres à l'application, si bien que seul Finance peut l'atteindre avec les contrôles exigés. Le reste de 10.1.0.0/16 continue de passer par Quick Access sans changement.
  options:
    b:
      en: |-
        A policy on Quick Access changes the access rules for every resource in 10.1.0.0/16 and still lets all employees reach the server.
      fr: |-
        Une stratégie sur Quick Access modifie les règles d'accès de toutes les ressources de 10.1.0.0/16 et laisse encore tous les employés atteindre le serveur.
    c:
      en: |-
        Through Private Access, connections reach the server from the private network connectors, not from the users' device addresses, and an NSG can't require MFA.
      fr: |-
        Via Accès privé, les connexions atteignent le serveur depuis les connecteurs de réseau privé, pas depuis les adresses des appareils des utilisateurs, et un NSG ne peut pas exiger de MFA.
    d:
      en: |-
        Quick Access is meant for the broad set of private resources; granular control over a subset, with its own assignments and Conditional Access, is the role of Global Secure Access apps.
      fr: |-
        Quick Access est destiné à l'ensemble large des ressources privées ; le contrôle granulaire d'un sous-ensemble, avec ses propres attributions et son accès conditionnel, est le rôle des applications Global Secure Access.
references:
  - title: How to configure per-app access using Global Secure Access applications
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-per-app-access
  - title: Learn about Microsoft Entra Private Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access
