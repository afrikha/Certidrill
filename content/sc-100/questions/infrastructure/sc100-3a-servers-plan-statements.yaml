id: sc100-3a-servers-plan-statements
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is choosing between Defender for Servers Plan 1 and Plan 2 for a subscription that contains 200 Azure VMs. Only 15 of the VMs process payment data.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. hésite entre Defender for Servers Plan 1 et Plan 2 pour un abonnement qui contient 200 machines virtuelles Azure. Seules 15 de ces machines virtuelles traitent des données de paiement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Plan 1 includes the integration with Microsoft Defender for Endpoint for endpoint detection and response.
        fr: Le Plan 1 inclut l'intégration avec Microsoft Defender for Endpoint pour la détection et la réponse des points de terminaison.
    - id: s2
      text:
        en: Plan 1 includes agentless malware scanning of the VM disks.
        fr: Le Plan 1 inclut l'analyse sans agent des logiciels malveillants sur les disques des machines virtuelles.
    - id: s3
      text:
        en: Plan 2 can be enabled on the 15 payment VMs only, without enabling it on the subscription.
        fr: Le Plan 2 peut être activé sur les 15 machines virtuelles de paiement uniquement, sans être activé sur l'abonnement.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Both plans include the Defender for Endpoint integration. Agentless malware scanning is a Plan 2 capability. Plan 1 can be enabled per resource, but Plan 2 can only be enabled at the subscription level; it can then be disabled for individual resources.
    fr: Les deux plans incluent l'intégration de Defender for Endpoint. L'analyse sans agent des logiciels malveillants est une fonctionnalité du Plan 2. Le Plan 1 peut être activé par ressource, mais le Plan 2 ne peut être activé qu'au niveau de l'abonnement ; il peut ensuite être désactivé pour des ressources individuelles.
  options:
    s2:
      en: Agentless malware scanning is available only in Defender for Servers Plan 2.
      fr: L'analyse sans agent des logiciels malveillants n'est disponible que dans Defender for Servers Plan 2.
    s3:
      en: Plan 2 is enabled at the subscription level; per-resource enablement is available for Plan 1 only.
      fr: Le Plan 2 s'active au niveau de l'abonnement ; l'activation par ressource n'est disponible que pour le Plan 1.
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
  - title: Agentless machine scanning in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-agentless-data-collection
