id: sc100-3b-client-device-risk
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has 12,000 Windows 11 laptops that are Microsoft Entra joined, enrolled in Microsoft Intune and onboarded to Microsoft Defender for Endpoint. Users access Microsoft 365 from the laptops.

    The security team requires that a laptop on which Defender for Endpoint detects high-risk threat activity automatically loses access to Microsoft 365 until the threat is remediated. Access must be restored automatically after remediation. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Woodgrove Bank dispose de 12 000 ordinateurs portables Windows 11 joints à Microsoft Entra, inscrits dans Microsoft Intune et intégrés à Microsoft Defender for Endpoint. Les utilisateurs accèdent à Microsoft 365 depuis ces ordinateurs.

    L'équipe de sécurité exige qu'un ordinateur sur lequel Defender for Endpoint détecte une activité de menace à risque élevé perde automatiquement l'accès à Microsoft 365 jusqu'à la correction de la menace. L'accès doit être rétabli automatiquement après la correction. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Connect Defender for Endpoint to Intune, set a device risk level in the compliance policy, and require a compliant device in Conditional Access.", fr: "Connecter Defender for Endpoint à Intune, définir un niveau de risque d'appareil dans la stratégie de conformité, et exiger un appareil conforme dans l'accès conditionnel." } }
    - { id: b, text: { en: "Configure a Conditional Access policy that blocks access when the sign-in risk detected by Microsoft Entra ID Protection is high.", fr: "Configurer une stratégie d'accès conditionnel qui bloque l'accès quand le risque de connexion détecté par Microsoft Entra ID Protection est élevé." } }
    - { id: c, text: { en: "Turn on automated investigation and remediation in Defender for Endpoint with the full automation level for all device groups.", fr: "Activer l'investigation et la correction automatisées dans Defender for Endpoint avec le niveau d'automatisation complet pour tous les groupes d'appareils." } }
    - { id: d, text: { en: "Deploy all the attack surface reduction rules in block mode to the laptops by using an Intune endpoint security policy.", fr: "Déployer toutes les règles de réduction de la surface d'attaque en mode blocage sur les ordinateurs avec une stratégie de sécurité des points de terminaison Intune." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With Defender for Endpoint integrated as a mobile threat defense solution, Intune evaluates the device risk level in real time: a high-risk device becomes noncompliant, and the Conditional Access policy that requires a compliant device blocks it. When the threat is remediated, the device becomes compliant again and regains access without manual action.
    fr: |
      Avec Defender for Endpoint intégré comme solution de défense contre les menaces mobiles, Intune évalue en temps réel le niveau de risque de l'appareil : un appareil à risque élevé devient non conforme, et la stratégie d'accès conditionnel qui exige un appareil conforme le bloque. Une fois la menace corrigée, l'appareil redevient conforme et retrouve l'accès sans action manuelle.
  options:
    b:
      en: |
        Sign-in risk is evaluated from identity signals of the sign-in, not from the threats that Defender for Endpoint detects on the device.
      fr: |
        Le risque de connexion est évalué à partir des signaux d'identité de la connexion, et non à partir des menaces que Defender for Endpoint détecte sur l'appareil.
    c:
      en: |
        Automated investigation and remediation cleans up threats, but it doesn't remove the device's access to Microsoft 365 while the threat is active.
      fr: |
        L'investigation et la correction automatisées nettoient les menaces, mais elles ne retirent pas l'accès de l'appareil à Microsoft 365 tant que la menace est active.
    d:
      en: |
        Attack surface reduction rules block risky behaviors on the device; they don't control access to Microsoft 365.
      fr: |
        Les règles de réduction de la surface d'attaque bloquent des comportements à risque sur l'appareil ; elles ne contrôlent pas l'accès à Microsoft 365.
references:
  - title: Integrate Microsoft Defender for Endpoint with Intune for Device Compliance
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/advanced-threat-protection
