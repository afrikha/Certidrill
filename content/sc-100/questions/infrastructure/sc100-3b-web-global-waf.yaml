id: sc100-3b-web-global-waf
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Travel runs a public booking website on Azure App Service in two Azure regions. Customers connect from every continent.

    You need to recommend a single global entry point for the website that blocks SQL injection and cross-site scripting attacks by using Microsoft-managed rules, and that blocks malicious bots at the edge of the Microsoft network.

    What should you recommend?
  fr: |
    Wingtip Travel exécute un site web public de réservation sur Azure App Service dans deux régions Azure. Les clients se connectent depuis tous les continents.

    Vous devez recommander un point d'entrée global unique pour le site web, qui bloque les attaques par injection SQL et par script intersite avec des règles gérées par Microsoft, et qui bloque les bots malveillants à la périphérie du réseau Microsoft.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Front Door Standard with a WAF policy that uses custom rules and geo-filtering", fr: "Azure Front Door Standard avec une stratégie WAF qui utilise des règles personnalisées et le filtrage géographique" } }
    - { id: b, text: { en: "Azure Application Gateway WAF_v2 with the managed rule set, deployed in the primary region", fr: "Azure Application Gateway WAF_v2 avec l'ensemble de règles managé, déployé dans la région primaire" } }
    - { id: c, text: { en: "Azure Firewall Premium with intrusion detection and prevention", fr: "Pare-feu Azure Premium avec détection et prévention des intrusions" } }
    - { id: d, text: { en: "Azure Front Door Premium with a WAF policy that uses the managed rule set and bot protection", fr: "Azure Front Door Premium avec une stratégie WAF qui utilise l'ensemble de règles managé et la protection contre les bots" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Front Door is a global entry point at the edge of the Microsoft network, and its WAF policy filters web attacks before they reach the regional apps. The Microsoft-managed rule set and bot protection are available only in the Premium tier.
    fr: |
      Azure Front Door est un point d'entrée global à la périphérie du réseau Microsoft, et sa stratégie WAF filtre les attaques web avant qu'elles n'atteignent les applications régionales. L'ensemble de règles managé par Microsoft et la protection contre les bots ne sont disponibles qu'au niveau Premium.
  options:
    a:
      en: |
        Front Door Standard supports custom WAF rules and geo-filtering, but the Microsoft-managed rule set and bot protection need Premium.
      fr: |
        Front Door Standard prend en charge les règles WAF personnalisées et le filtrage géographique, mais l'ensemble de règles managé par Microsoft et la protection contre les bots nécessitent Premium.
    b:
      en: |
        Application Gateway supports managed rules, but it is a regional service, so it isn't a global entry point at the edge for both regions.
      fr: |
        Application Gateway prend en charge les règles managées, mais c'est un service régional : il ne constitue pas un point d'entrée global en périphérie pour les deux régions.
    c:
      en: |
        Azure Firewall protects virtual network traffic; it isn't a web application firewall at the global edge for App Service.
      fr: |
        Le Pare-feu Azure protège le trafic des réseaux virtuels ; ce n'est pas un pare-feu d'applications web en périphérie globale pour App Service.
references:
  - title: Comparison between Azure Front Door and Azure Content Delivery Network
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/tier-comparison
