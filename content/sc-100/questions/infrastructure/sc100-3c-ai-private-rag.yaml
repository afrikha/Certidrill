id: sc100-3c-ai-private-rag
objective: "3.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is designing a retrieval-augmented generation (RAG) application. A Microsoft Foundry project uses an Azure AI Search index and an Azure Storage account that holds the source documents. The application runs in an Azure virtual network that is connected to the on-premises network.

    The security requirements state that the Foundry resource, the search service and the storage account must not accept any connection over their public endpoints, while the application and on-premises users keep access.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit une application de génération augmentée de récupération (RAG). Un projet Microsoft Foundry utilise un index Azure AI Search et un compte Stockage Azure qui contient les documents sources. L'application s'exécute dans un réseau virtuel Azure connecté au réseau local.

    Les exigences de sécurité indiquent que la ressource Foundry, le service de recherche et le compte de stockage ne doivent accepter aucune connexion sur leurs points de terminaison publics, tandis que l'application et les utilisateurs locaux gardent l'accès.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create private endpoints for the Foundry resource, the search service and the storage account", fr: "Créer des points de terminaison privés pour la ressource Foundry, le service de recherche et le compte de stockage" } }
    - { id: b, text: { en: "Add IP network rules that allow only the public egress addresses of the company", fr: "Ajouter des règles de réseau IP qui n'autorisent que les adresses de sortie publiques de l'entreprise" } }
    - { id: c, text: { en: "Disable public network access on the Foundry resource, the search service and the storage account", fr: "Désactiver l'accès au réseau public sur la ressource Foundry, le service de recherche et le compte de stockage" } }
    - { id: d, text: { en: "Encrypt the three resources with customer-managed keys stored in Azure Key Vault", fr: "Chiffrer les trois ressources avec des clés gérées par le client stockées dans Azure Key Vault" } }
    - { id: e, text: { en: "Add a guardrail with the indirect attacks control to the model deployment", fr: "Ajouter un garde-fou avec le contrôle des attaques indirectes au déploiement du modèle" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Private endpoints give the Foundry resource and its connected services private IP addresses in the virtual network, reachable from on-premises through the existing connection. A private endpoint doesn't close the public endpoint by itself, so public network access must also be disabled on each resource.
    fr: |-
      Les points de terminaison privés donnent à la ressource Foundry et aux services connectés des adresses IP privées dans le réseau virtuel, joignables depuis le réseau local par la connexion existante. Un point de terminaison privé ne ferme pas à lui seul le point de terminaison public : l'accès au réseau public doit aussi être désactivé sur chaque ressource.
  options:
    b:
      en: |-
        IP rules filter callers but still accept connections on the public endpoints, which the requirement forbids.
      fr: |-
        Les règles IP filtrent les appelants, mais acceptent toujours des connexions sur les points de terminaison publics, ce que l'exigence interdit.
    d:
      en: |-
        Customer-managed keys protect data at rest; they don't change how the resources are reached.
      fr: |-
        Les clés gérées par le client protègent les données au repos ; elles ne changent pas la façon dont les ressources sont atteintes.
    e:
      en: |-
        The indirect attacks control detects instructions hidden in documents; it isn't a network control.
      fr: |-
        Le contrôle des attaques indirectes détecte les instructions cachées dans les documents ; ce n'est pas un contrôle réseau.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
