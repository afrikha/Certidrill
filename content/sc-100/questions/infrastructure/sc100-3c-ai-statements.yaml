id: sc100-3c-ai-statements
objective: "3.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is evaluating the AI security controls for an assistant that summarizes customer emails and attached documents by using an Azure OpenAI model in Microsoft Foundry. Threat protection for AI services is enabled in Defender for Cloud.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank évalue les contrôles de sécurité de l'IA pour un assistant qui résume les e-mails des clients et les documents joints avec un modèle Azure OpenAI dans Microsoft Foundry. La protection contre les menaces pour les services d'IA est activée dans Defender for Cloud.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          A Foundry guardrail can detect instructions that an attacker hides in an attached document passed to the model.
        fr: |-
          Un garde-fou Foundry peut détecter des instructions qu'un attaquant cache dans un document joint transmis au modèle.
    - id: s2
      text:
        en: |-
          Alerts from threat protection for AI services can be investigated in the Defender XDR portal together with the other incidents of the organization.
        fr: |-
          Les alertes de la protection contre les menaces pour les services d'IA peuvent être examinées dans le portail Defender XDR avec les autres incidents de l'organisation.
    - id: s3
      text:
        en: |-
          Threat protection for AI services scans the images and audio sent in prompts for jailbreak attempts.
        fr: |-
          La protection contre les menaces pour les services d'IA analyse les images et l'audio envoyés dans les prompts à la recherche de tentatives de jailbreak.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |-
      Prompt Shields, available as the indirect attacks control of a Foundry guardrail, detect instructions embedded in documents and other content passed to the model. Alerts from threat protection for AI services are correlated into incidents in the Defender XDR portal. The service scans text tokens only; image and audio tokens aren't scanned.
    fr: |-
      Prompt Shields, disponible comme contrôle des attaques indirectes d'un garde-fou Foundry, détecte les instructions incorporées dans les documents et autres contenus transmis au modèle. Les alertes de la protection contre les menaces pour les services d'IA sont corrélées en incidents dans le portail Defender XDR. Le service n'analyse que les jetons de texte ; les jetons d'image et d'audio ne sont pas analysés.
references:
  - title: AI threat protection in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
  - title: Prompt Shields in Azure AI Content Safety
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection
