id: sc100-3a-gcp-code-dropdown
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender for Cloud for its Azure subscriptions. It plans to extend the posture management solution to the following environments:

    - A GCP organization that contains 40 projects. A single connection must cover the organization, and the projects of two sandbox folders must stay out of scope.
    - Infrastructure as code templates stored in GitHub and GitLab repositories. Misconfigurations and exposed secrets must be correlated with the cloud resources that the templates deploy.

    What should you include in the recommendation for each environment? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Defender for Cloud pour ses abonnements Azure. Elle prévoit d'étendre la solution de gestion de la posture aux environnements suivants :

    - Une organisation GCP qui contient 40 projets. Une seule connexion doit couvrir l'organisation, et les projets de deux dossiers de bac à sable doivent rester hors du périmètre.
    - Des modèles d'infrastructure as code stockés dans des dépôts GitHub et GitLab. Les erreurs de configuration et les secrets exposés doivent être mis en corrélation avec les ressources cloud que les modèles déploient.

    Que devez-vous inclure dans la recommandation pour chaque environnement ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      GCP organization: [[gcp]]

      GitHub and GitLab repositories: [[code]]
    fr: |
      Organisation GCP : [[gcp]]

      Dépôts GitHub et GitLab : [[code]]
  slots:
    - id: gcp
      options:
        - { id: org, text: { en: "One GCP connector at the organization level with the two folders excluded", fr: "Un connecteur GCP au niveau de l'organisation avec les deux dossiers exclus" } }
        - { id: project, text: { en: "One GCP connector for each project that is in scope", fr: "Un connecteur GCP pour chaque projet du périmètre" } }
        - { id: arc, text: { en: "Azure Arc-enabled servers on the Compute Engine VMs of each project", fr: "Des serveurs compatibles Azure Arc sur les machines virtuelles Compute Engine de chaque projet" } }
        - { id: sentinel, text: { en: "The GCP data connector of Microsoft Sentinel", fr: "Le connecteur de données GCP de Microsoft Sentinel" } }
    - id: code
      options:
        - { id: devops, text: { en: "DevOps security connectors for GitHub and GitLab", fr: "Des connecteurs de sécurité DevOps pour GitHub et GitLab" } }
        - { id: containers, text: { en: "The Defender for Containers plan", fr: "Le plan Defender for Containers" } }
        - { id: apis, text: { en: "The Defender for APIs plan", fr: "Le plan Defender for APIs" } }
        - { id: appservice, text: { en: "The Defender for App Service plan", fr: "Le plan Defender for App Service" } }
answer:
  values: { gcp: org, code: devops }
explanation:
  correct:
    en: A GCP connector can be created for an organization, with optional exclusions of project numbers and folder IDs, so projects in scope are covered without one connector per project. The DevOps security connectors for GitHub, Azure DevOps and GitLab bring code findings such as IaC misconfigurations and exposed secrets into Defender for Cloud, where they are correlated with cloud security insights.
    fr: Un connecteur GCP peut être créé pour une organisation, avec l'exclusion facultative de numéros de projet et d'ID de dossier ; les projets du périmètre sont ainsi couverts sans un connecteur par projet. Les connecteurs de sécurité DevOps pour GitHub, Azure DevOps et GitLab apportent dans Defender for Cloud les résultats du code, comme les erreurs de configuration IaC et les secrets exposés, qui y sont mis en corrélation avec les informations de sécurité cloud.
  options:
    project:
      en: Project-level connectors must be created and maintained one by one, which doesn't meet the single connection requirement.
      fr: Les connecteurs au niveau du projet doivent être créés et maintenus un par un, ce qui ne respecte pas l'exigence d'une connexion unique.
    sentinel:
      en: The Sentinel connector ingests GCP logs for detection; it doesn't feed the posture assessment.
      fr: Le connecteur Sentinel ingère des journaux GCP pour la détection ; il n'alimente pas l'évaluation de la posture.
    containers:
      en: Defender for Containers protects clusters and scans images; it doesn't scan IaC templates in repositories.
      fr: Defender for Containers protège les clusters et analyse les images ; il n'analyse pas les modèles IaC des dépôts.
references:
  - title: Connect your GCP Project
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-gcp
  - title: Microsoft Defender for Cloud Overview
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
