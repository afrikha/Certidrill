id: sc100-3c-pa-access-paths
objective: "3.4.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware has a datacenter connected to Azure. Employees have Microsoft Entra Suite licenses, and their managed devices run the Global Secure Access client.

    You need to recommend a solution for each access requirement.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un centre de données connecté à Azure. Les employés disposent de licences Microsoft Entra Suite, et leurs appareils gérés exécutent le client Global Secure Access.

    Vous devez recommander une solution pour chaque exigence d'accès.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: pa, text: { en: "Microsoft Entra Private Access", fr: "Accès privé Microsoft Entra" } }
    - { id: appproxy, text: { en: "Microsoft Entra application proxy", fr: "Proxy d'application Microsoft Entra" } }
    - { id: bastion, text: { en: "Azure Bastion", fr: "Azure Bastion" } }
    - { id: s2s, text: { en: "Azure VPN Gateway site-to-site connection", fr: "Connexion site à site de la passerelle VPN Azure" } }
    - { id: ia, text: { en: "Microsoft Entra Internet Access", fr: "Accès Internet Microsoft Entra" } }
  targets:
    - id: t1
      text: { en: "Remote employees reach SMB file shares and an SSH server in the datacenter, with MFA enforced per application", fr: "Les employés distants atteignent des partages de fichiers SMB et un serveur SSH du centre de données, avec une MFA imposée par application" }
    - id: t2
      text: { en: "Partners on unmanaged devices open an on-premises web app in a browser, without installing any client", fr: "Des partenaires sur des appareils non gérés ouvrent une application web locale dans un navigateur, sans installer de client" }
    - id: t3
      text: { en: "Servers in a branch office network replicate data to Azure virtual machines", fr: "Les serveurs du réseau d'une succursale répliquent des données vers des machines virtuelles Azure" }
    - id: t4
      text: { en: "Cloud administrators open RDP sessions to Azure VMs from the Azure portal, without public IP addresses on the VMs", fr: "Les administrateurs cloud ouvrent des sessions RDP vers des machines virtuelles Azure depuis le portail Azure, sans adresse IP publique sur les machines virtuelles" }
answer:
  mapping: { t1: pa, t2: appproxy, t3: s2s, t4: bastion }
explanation:
  correct:
    en: |-
      Private Access gives users zero trust access to any TCP or UDP private app, with per-app Conditional Access. Application proxy publishes on-premises web apps to browsers without a client. A site-to-site VPN connects networks for server-to-server traffic, which isn't user access. Azure Bastion provides RDP and SSH to Azure VMs from the portal without public IP addresses.
    fr: |-
      Accès privé donne aux utilisateurs un accès Confiance Zéro à toute application privée TCP ou UDP, avec un accès conditionnel par application. Le proxy d'application publie des applications web locales vers les navigateurs sans client. Un VPN site à site connecte des réseaux pour le trafic de serveur à serveur, qui n'est pas un accès utilisateur. Azure Bastion fournit RDP et SSH vers les machines virtuelles Azure depuis le portail, sans adresse IP publique.
  options:
    ia:
      en: |-
        Internet Access secures traffic to the internet and SaaS apps; it doesn't provide access to private resources.
      fr: |-
        Accès Internet sécurise le trafic vers Internet et les applications SaaS ; il ne donne pas accès aux ressources privées.
references:
  - title: Learn about Microsoft Entra Private Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access
  - title: What is Azure Bastion?
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
