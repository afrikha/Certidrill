id: sc100-3a-server-edr-multiplatform
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders runs Windows Server, Red Hat Enterprise Linux and Ubuntu servers in Azure, in AWS and in an on-premises datacenter. The on-premises servers are Azure Arc-enabled servers, and the AWS accounts are connected to Microsoft Defender for Cloud.

    You need to specify one solution that provides endpoint detection and response (EDR) and threat detection on all the servers, whatever their operating system or location.

    What should you specify?
  fr: |
    Northwind Traders exécute des serveurs Windows Server, Red Hat Enterprise Linux et Ubuntu dans Azure, dans AWS et dans un centre de données local. Les serveurs locaux sont des serveurs compatibles Azure Arc, et les comptes AWS sont connectés à Microsoft Defender for Cloud.

    Vous devez spécifier une solution unique qui fournit la détection et réponse des points de terminaison (EDR) et la détection des menaces sur tous les serveurs, quels que soient leur système d'exploitation et leur emplacement.

    Que devez-vous spécifier ?
body:
  options:
    - id: a
      text: { en: "Defender CSPM with agentless machine scanning", fr: "Defender CSPM avec l'analyse sans agent des machines" }
    - id: b
      text: { en: "Defender for Servers with the Defender for Endpoint integration", fr: "Defender for Servers avec l'intégration de Defender for Endpoint" }
    - id: c
      text: { en: "Azure Policy machine configuration with the security baselines", fr: "La configuration des machines Azure Policy avec les bases de référence de sécurité" }
    - id: d
      text: { en: "Defender for Containers with the Defender sensor", fr: "Defender for Containers avec le capteur Defender" }
answer:
  optionId: b
explanation:
  correct:
    en: Defender for Servers protects Windows and Linux machines in Azure, AWS, GCP and on-premises environments connected to Defender for Cloud. Both plans include the Defender for Endpoint integration, which provides EDR and threat detection.
    fr: Defender for Servers protège les machines Windows et Linux dans Azure, AWS, GCP et dans les environnements locaux connectés à Defender for Cloud. Les deux plans incluent l'intégration de Defender for Endpoint, qui fournit l'EDR et la détection des menaces.
  options:
    a:
      en: Agentless scanning assesses disk snapshots for vulnerabilities, secrets and malware; it doesn't provide EDR, and it doesn't cover on-premises servers.
      fr: L'analyse sans agent évalue des captures instantanées de disques pour détecter les vulnérabilités, les secrets et les logiciels malveillants ; elle ne fournit pas d'EDR et ne couvre pas les serveurs locaux.
    c:
      en: Machine configuration audits or applies operating system settings; it doesn't detect or respond to threats.
      fr: La configuration des machines audite ou applique des paramètres du système d'exploitation ; elle ne détecte pas les menaces et n'y répond pas.
    d:
      en: Defender for Containers protects Kubernetes clusters and container workloads, not standalone servers.
      fr: Defender for Containers protège les clusters Kubernetes et les charges de travail en conteneurs, pas les serveurs autonomes.
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
