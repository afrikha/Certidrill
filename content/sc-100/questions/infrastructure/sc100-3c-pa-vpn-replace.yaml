id: sc100-3c-pa-vpn-replace
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has 4,000 remote employees who use a legacy VPN appliance to reach applications in two datacenters. The applications use many TCP and UDP ports on the 10.10.0.0/16 and 10.20.0.0/16 ranges and FQDNs under corp.fabrikam.com. Users have Microsoft Entra Suite licenses.

    The VPN appliance reaches end of support in two months. You need to recommend the first step of a Zero Trust replacement that restores access to all these resources as quickly as possible, before finer-grained policies are introduced.

    What should you recommend?
  fr: |
    Fabrikam compte 4 000 employés distants qui utilisent une appliance VPN ancienne pour atteindre des applications dans deux centres de données. Les applications utilisent de nombreux ports TCP et UDP sur les plages 10.10.0.0/16 et 10.20.0.0/16 et des FQDN sous corp.fabrikam.com. Les utilisateurs disposent de licences Microsoft Entra Suite.

    L'appliance VPN arrive en fin de support dans deux mois. Vous devez recommander la première étape d'un remplacement Confiance Zéro qui rétablit l'accès à toutes ces ressources le plus vite possible, avant l'introduction de stratégies plus fines.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Publish each application with Microsoft Entra application proxy", fr: "Publier chaque application avec le proxy d'application Microsoft Entra" } }
    - { id: b, text: { en: "Configure Quick Access in Microsoft Entra Private Access with the ranges and the wildcard FQDN", fr: "Configurer Quick Access dans Accès privé Microsoft Entra avec les plages et le FQDN générique" } }
    - { id: c, text: { en: "Create a Global Secure Access app for each application, with its own Conditional Access policy", fr: "Créer une application Global Secure Access pour chaque application, avec sa propre stratégie d'accès conditionnel" } }
    - { id: d, text: { en: "Deploy a point-to-site configuration on Azure VPN Gateway with Microsoft Entra authentication", fr: "Déployer une configuration point à site sur la passerelle VPN Azure avec l'authentification Microsoft Entra" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Quick Access is the Private Access app that groups the broad set of private IP ranges and FQDNs to tunnel, like a traditional VPN but without network-level access to the whole datacenter. It is the fastest way to replace the VPN, and App Discovery then helps move sensitive apps to per-app access.
    fr: |-
      Quick Access est l'application d'Accès privé qui regroupe l'ensemble large des plages d'adresses IP privées et des FQDN à faire passer en tunnel, comme un VPN classique, mais sans accès réseau à l'ensemble du centre de données. C'est le moyen le plus rapide de remplacer le VPN, et la découverte d'applications aide ensuite à passer les applications sensibles en accès par application.
  options:
    a:
      en: |-
        Application proxy publishes web applications; it doesn't cover the many TCP and UDP ports these applications use.
      fr: |-
        Le proxy d'application publie des applications web ; il ne couvre pas les nombreux ports TCP et UDP utilisés par ces applications.
    c:
      en: |-
        Per-app access is the target state, but defining every application first takes far longer than the two months available.
      fr: |-
        L'accès par application est l'état cible, mais définir d'abord chaque application prend bien plus que les deux mois disponibles.
    d:
      en: |-
        A point-to-site VPN reaches Azure virtual networks with network-level access; it is another VPN, not a Zero Trust replacement.
      fr: |-
        Un VPN point à site atteint les réseaux virtuels Azure avec un accès au niveau réseau ; c'est un autre VPN, pas un remplacement Confiance Zéro.
references:
  - title: How to configure Quick Access for Global Secure Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-quick-access
