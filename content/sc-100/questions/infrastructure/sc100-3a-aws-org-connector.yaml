id: sc100-3a-aws-org-connector
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has 120 AWS accounts in AWS Organizations. Teams create new member accounts every week. The cloud security team uses a delegated administrator account for its AWS security tools.

    You need to recommend how to connect the AWS environment to Microsoft Defender for Cloud. New member accounts must be onboarded automatically, and the solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose de 120 comptes AWS dans AWS Organizations. Les équipes créent de nouveaux comptes membres chaque semaine. L'équipe de sécurité cloud utilise un compte administrateur délégué pour ses outils de sécurité AWS.

    Vous devez recommander la façon de connecter l'environnement AWS à Microsoft Defender for Cloud. Les nouveaux comptes membres doivent être intégrés automatiquement, et la solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Create a connector for the delegated administrator account", fr: "Créer un connecteur pour le compte administrateur délégué" }
    - id: b
      text: { en: "Create a connector for the AWS management account", fr: "Créer un connecteur pour le compte de gestion AWS" }
    - id: c
      text: { en: "Create a single-account connector for each account every week", fr: "Créer un connecteur de compte unique pour chaque compte chaque semaine" }
    - id: d
      text: { en: "Install the Azure Arc agent on the EC2 instances of each account", fr: "Installer l'agent Azure Arc sur les instances EC2 de chaque compte" }
answer:
  optionId: b
explanation:
  correct:
    en: A connector created for the AWS management account uses auto provisioning to create connectors for the discovered member accounts and for the accounts created later, with optional exclusions. Only the management account can be used for this onboarding.
    fr: Un connecteur créé pour le compte de gestion AWS utilise le provisionnement automatique pour créer des connecteurs pour les comptes membres découverts et pour ceux créés ensuite, avec des exclusions facultatives. Seul le compte de gestion peut être utilisé pour cette intégration.
  options:
    a:
      en: Delegated administrator accounts aren't supported for management account onboarding.
      fr: Les comptes administrateurs délégués ne sont pas pris en charge pour l'intégration par compte de gestion.
    c:
      en: Single-account connectors work, but creating one for each new account every week is manual and doesn't onboard accounts automatically.
      fr: Les connecteurs de compte unique fonctionnent, mais en créer un pour chaque nouveau compte chaque semaine est manuel et n'intègre pas les comptes automatiquement.
    d:
      en: Azure Arc projects individual machines; it doesn't connect the AWS accounts and their other resources to the posture assessment.
      fr: Azure Arc projette des machines individuelles ; il ne connecte pas les comptes AWS et leurs autres ressources à l'évaluation de la posture.
references:
  - title: Connect your AWS Account
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
