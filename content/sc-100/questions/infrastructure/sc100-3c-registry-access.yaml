id: sc100-3c-registry-access
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Kubernetes Service (AKS) cluster named aks-prod that pulls images from an Azure Container Registry registry named crcontoso.

    Today, the cluster uses the registry admin user, whose password is stored in a Kubernetes secret. The security team requires that no registry credential be stored in the cluster and that the cluster receive only the permissions it needs.

    What should you recommend?
  fr: |
    Contoso dispose d'un cluster Azure Kubernetes Service (AKS) nommé aks-prod qui extrait des images d'un registre Azure Container Registry nommé crcontoso.

    Aujourd'hui, le cluster utilise l'utilisateur administrateur du registre, dont le mot de passe est stocké dans un secret Kubernetes. L'équipe de sécurité exige qu'aucun identifiant de registre ne soit stocké dans le cluster et que le cluster ne reçoive que les autorisations dont il a besoin.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create a repository-scoped token with pull permissions and store it in a Kubernetes secret", fr: "Créer un jeton délimité au dépôt avec des autorisations d'extraction et le stocker dans un secret Kubernetes" } }
    - { id: b, text: { en: "Assign the AcrPush role on crcontoso to the kubelet managed identity of aks-prod", fr: "Attribuer le rôle AcrPush sur crcontoso à l'identité managée kubelet de aks-prod" } }
    - { id: c, text: { en: "Enable anonymous pull access on crcontoso and disable the admin user", fr: "Activer l'accès anonyme en extraction sur crcontoso et désactiver l'utilisateur administrateur" } }
    - { id: d, text: { en: "Assign the AcrPull role on crcontoso to the kubelet managed identity of aks-prod", fr: "Attribuer le rôle AcrPull sur crcontoso à l'identité managée kubelet de aks-prod" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Integrating AKS with the registry gives the kubelet managed identity the AcrPull role, so nodes pull images with Microsoft Entra authentication and no credential is stored in the cluster. AcrPull allows pulling only, which matches least privilege, and the admin user can then be disabled.
    fr: |-
      L'intégration d'AKS au registre attribue le rôle AcrPull à l'identité managée kubelet : les nœuds extraient les images avec l'authentification Microsoft Entra et aucun identifiant n'est stocké dans le cluster. AcrPull ne permet que l'extraction, ce qui respecte le privilège minimum, et l'utilisateur administrateur peut ensuite être désactivé.
  options:
    a:
      en: |-
        A token is still a credential stored in the cluster as a secret.
      fr: |-
        Un jeton reste un identifiant stocké dans le cluster sous forme de secret.
    b:
      en: |-
        AcrPush also allows pushing images, which is more than the cluster needs.
      fr: |-
        AcrPush permet aussi d'envoyer des images, ce qui dépasse les besoins du cluster.
    c:
      en: |-
        Anonymous pull lets anyone pull the images, which removes access control instead of tightening it.
      fr: |-
        L'extraction anonyme permet à n'importe qui d'extraire les images, ce qui supprime le contrôle d'accès au lieu de le renforcer.
references:
  - title: Integrate Azure Container Registry with Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration
  - title: Authenticate with Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-authentication
