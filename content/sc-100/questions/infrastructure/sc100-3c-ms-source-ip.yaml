id: sc100-3c-ms-source-ip
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso recently routed Microsoft 365 traffic through Global Secure Access by enabling the Microsoft traffic forwarding profile. Since then, the security operations team reports that Microsoft Entra sign-in logs show the address of the Global Secure Access edge instead of the user's real public IP address.

    As a result, Microsoft Entra ID Protection risk detections are less accurate, and a Conditional Access policy based on the offices' known IP addresses no longer matches.

    What should you recommend?
  fr: |
    Contoso a récemment fait passer le trafic Microsoft 365 par Global Secure Access en activant le profil de transfert du trafic Microsoft. Depuis, l'équipe des opérations de sécurité signale que les journaux de connexion Microsoft Entra affichent l'adresse de la périphérie Global Secure Access au lieu de l'adresse IP publique réelle de l'utilisateur.

    Par conséquent, les détections de risque de Microsoft Entra ID Protection sont moins précises, et une stratégie d'accès conditionnel fondée sur les adresses IP connues des bureaux ne correspond plus.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable the Microsoft 365 enriched logs of Global Secure Access", fr: "Activer les journaux enrichis Microsoft 365 de Global Secure Access" } }
    - { id: b, text: { en: "Replace the IP-based named location with All Compliant Network locations", fr: "Remplacer l'emplacement nommé fondé sur les adresses IP par All Compliant Network locations" } }
    - { id: c, text: { en: "Turn on universal tenant restrictions for Microsoft Entra ID and Microsoft Graph", fr: "Activer les restrictions de locataire universelles pour Microsoft Entra ID et Microsoft Graph" } }
    - { id: d, text: { en: "Enable Conditional Access signaling for Microsoft Entra ID to turn on source IP restoration", fr: "Activer la signalisation de l'accès conditionnel pour Microsoft Entra ID afin d'activer la restauration de l'adresse IP source" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Source IP restoration passes the user's original egress IP address to Microsoft Entra ID and Microsoft Graph. Sign-in and audit logs then show the real address, ID Protection risk detections regain accuracy, and IP-based Conditional Access location policies keep working. It is turned on with the Conditional Access signaling setting of adaptive access.
    fr: |-
      La restauration de l'adresse IP source transmet l'adresse IP de sortie d'origine de l'utilisateur à Microsoft Entra ID et à Microsoft Graph. Les journaux de connexion et d'audit affichent alors l'adresse réelle, les détections de risque d'ID Protection retrouvent leur précision et les stratégies d'accès conditionnel fondées sur les emplacements IP continuent de fonctionner. Elle s'active avec le paramètre de signalisation de l'accès conditionnel de l'accès adaptatif.
  options:
    a:
      en: |-
        Enriched logs add detail on Microsoft 365 traffic in Global Secure Access; they don't change the IP address that Microsoft Entra ID sees.
      fr: |-
        Les journaux enrichis ajoutent des détails sur le trafic Microsoft 365 dans Global Secure Access ; ils ne changent pas l'adresse IP que voit Microsoft Entra ID.
    b:
      en: |-
        A compliant network condition would replace the office policy with a different control, and it doesn't restore the IP address used by ID Protection.
      fr: |-
        Une condition de réseau conforme remplacerait la stratégie des bureaux par un autre contrôle, et elle ne restaure pas l'adresse IP utilisée par ID Protection.
    c:
      en: |-
        Universal tenant restrictions control which tenants users can sign in to; they don't affect the logged IP address.
      fr: |-
        Les restrictions de locataire universelles contrôlent les locataires auxquels les utilisateurs peuvent se connecter ; elles n'affectent pas l'adresse IP journalisée.
references:
  - title: Source IP restoration
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-source-ip-restoration
