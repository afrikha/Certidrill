id: sc100-3b-iotw-backend-access
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware Water has an Azure IoT hub named IoTHub1. Devices are provisioned to IoTHub1 through an Azure IoT Hub Device Provisioning Service (DPS) instance that is linked to the hub. A back-end application that runs on Azure App Service creates and deletes device identities in IoTHub1. Today it uses the connection string of the iothubowner shared access policy.

    You need to recommend a solution that meets the following requirements:

    - The back-end application must authenticate by using Microsoft Entra ID and must have only the permissions it needs.
    - Device provisioning must continue to work.

    What should you recommend?
  fr: |
    Litware Water dispose d'un hub IoT Azure nommé IoTHub1. Les appareils sont provisionnés dans IoTHub1 par une instance Azure IoT Hub Device Provisioning Service (DPS) liée au hub. Une application back-end qui s'exécute sur Azure App Service crée et supprime des identités d'appareil dans IoTHub1. Aujourd'hui, elle utilise la chaîne de connexion de la stratégie d'accès partagé iothubowner.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - L'application back-end doit s'authentifier avec Microsoft Entra ID et ne disposer que des autorisations dont elle a besoin.
    - Le provisionnement des appareils doit continuer à fonctionner.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Assign IoT Hub Registry Contributor to the app's managed identity, and deny connections that use shared access policies on IoTHub1.", fr: "Attribuer IoT Hub Registry Contributor à l'identité managée de l'application, et refuser les connexions qui utilisent des stratégies d'accès partagé sur IoTHub1." } }
    - { id: b, text: { en: "Assign IoT Hub Data Contributor to the app's managed identity, and keep connections that use shared access policies allowed on IoTHub1.", fr: "Attribuer IoT Hub Data Contributor à l'identité managée de l'application, et conserver l'autorisation des connexions qui utilisent des stratégies d'accès partagé sur IoTHub1." } }
    - { id: c, text: { en: "Create a shared access policy with only the registry write permission, and store its connection string in Azure Key Vault.", fr: "Créer une stratégie d'accès partagé avec la seule autorisation d'écriture dans le registre, et stocker sa chaîne de connexion dans Azure Key Vault." } }
    - { id: d, text: { en: "Assign IoT Hub Registry Contributor to the app's managed identity, and keep connections that use shared access policies allowed on IoTHub1.", fr: "Attribuer IoT Hub Registry Contributor à l'identité managée de l'application, et conserver l'autorisation des connexions qui utilisent des stratégies d'accès partagé sur IoTHub1." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      IoT Hub Registry Contributor grants full access to the device registry and nothing else, which is what the application needs, and Microsoft Entra ID with Azure RBAC authorizes the service API calls. DPS links to IoT hubs only through shared access policies, so denying shared access policy connections on IoTHub1 would make provisioning fail; the policies must stay allowed while the application itself stops using them.
    fr: |
      IoT Hub Registry Contributor accorde un accès complet au registre des appareils et rien d'autre, ce dont l'application a besoin, et Microsoft Entra ID avec Azure RBAC autorise les appels aux API de service. DPS ne se lie aux hubs IoT que par des stratégies d'accès partagé : refuser les connexions par stratégie d'accès partagé sur IoTHub1 ferait échouer le provisionnement ; les stratégies doivent rester autorisées, tandis que l'application elle-même cesse de les utiliser.
  options:
    a:
      en: |
        Denying shared access policies makes provisioning through DPS fail with an unauthorized error.
      fr: |
        Refuser les stratégies d'accès partagé fait échouer le provisionnement par DPS avec une erreur d'autorisation.
    b:
      en: |
        IoT Hub Data Contributor grants full access to all data plane operations, more than the registry access the application needs.
      fr: |
        IoT Hub Data Contributor accorde un accès complet à toutes les opérations du plan de données, plus que l'accès au registre dont l'application a besoin.
    c:
      en: |
        A shared access policy is a key-based credential, not Microsoft Entra ID authentication, even if its connection string is stored in Key Vault.
      fr: |
        Une stratégie d'accès partagé est une information d'identification basée sur une clé, pas une authentification Microsoft Entra ID, même si sa chaîne de connexion est stockée dans Key Vault.
references:
  - title: Control access to IoT Hub by using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/iot-hub/iot-hub-dev-guide-azure-ad-rbac
