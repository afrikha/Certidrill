id: sc100-3c-pa-statements
objective: "3.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is designing Microsoft Entra Private Access for its employees. User accounts are synchronized from Active Directory Domain Services (AD DS) to Microsoft Entra ID. Internet traffic is already handled by a third-party Security Service Edge (SSE) product that Adatum wants to keep.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation conçoit Accès privé Microsoft Entra pour ses employés. Les comptes d'utilisateur sont synchronisés d'Active Directory Domain Services (AD DS) vers Microsoft Entra ID. Le trafic Internet est déjà pris en charge par un produit Security Service Edge (SSE) tiers qu'Adatum veut conserver.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          For Kerberos single sign-on to SMB shares through Private Access, the domain controllers of the connectors' Active Directory site must also be published as application segments.
        fr: |-
          Pour l'authentification unique Kerberos aux partages SMB via Accès privé, les contrôleurs de domaine du site Active Directory des connecteurs doivent aussi être publiés comme segments d'application.
    - id: s2
      text:
        en: |-
          A user who is a member of a group nested in the group assigned to a Private Access app gets access to that app.
        fr: |-
          Un utilisateur membre d'un groupe imbriqué dans le groupe attribué à une application d'Accès privé obtient l'accès à cette application.
    - id: s3
      text:
        en: |-
          Adatum can use Private Access for private applications while the third-party SSE keeps handling internet traffic.
        fr: |-
          Adatum peut utiliser Accès privé pour les applications privées tandis que le SSE tiers continue de prendre en charge le trafic Internet.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Kerberos SSO needs the client to reach a domain controller, so the domain controllers in the connectors' site are published with their ports (Kerberos 88, LDAP 389 and others) by specific IP addresses or FQDNs. Nested groups aren't supported for Private Access app assignments. Private Access runs side by side with a third-party SSE that keeps the internet traffic.
    fr: |-
      L'authentification unique Kerberos exige que le client atteigne un contrôleur de domaine : les contrôleurs de domaine du site des connecteurs sont publiés avec leurs ports (Kerberos 88, LDAP 389 et autres) par adresses IP ou FQDN précis. Les groupes imbriqués ne sont pas pris en charge pour les attributions des applications d'Accès privé. Accès privé fonctionne à côté d'un SSE tiers qui garde le trafic Internet.
references:
  - title: Use Kerberos for single sign-on (SSO) to your resources with Microsoft Entra Private Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-kerberos-sso
  - title: How to configure per-app access using Global Secure Access applications
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-per-app-access
