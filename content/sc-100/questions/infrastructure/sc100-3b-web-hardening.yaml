id: sc100-3b-web-hardening
objective: "3.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware is defining the hardening requirements for 120 web apps on Azure App Service. The apps are deployed by Azure Pipelines. Some apps must call an Azure SQL database that is reachable only through a private endpoint in a virtual network.

    What should you include in the requirements? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware définit les exigences de sécurisation renforcée de 120 applications web sur Azure App Service. Les applications sont déployées par Azure Pipelines. Certaines applications doivent appeler une base de données Azure SQL joignable uniquement par un point de terminaison privé dans un réseau virtuel.

    Que devez-vous inclure dans les exigences ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Client connections: [[tls]]

      FTP and SCM deployment endpoints: [[scm]]

      Access from the apps to the private SQL database: [[out]]
    fr: |
      Connexions des clients : [[tls]]

      Points de terminaison de déploiement FTP et SCM : [[scm]]

      Accès des applications à la base de données SQL privée : [[out]]
  slots:
    - id: tls
      options:
        - { id: https12, text: { en: "HTTPS Only enabled, with TLS 1.2 or later as the minimum version", fr: "HTTPS uniquement activé, avec TLS 1.2 ou version ultérieure comme version minimale" } }
        - { id: redirect, text: { en: "HTTP allowed, with redirection to HTTPS handled in the app code", fr: "HTTP autorisé, avec une redirection vers HTTPS gérée dans le code de l'application" } }
        - { id: tls10, text: { en: "TLS 1.0 allowed as the minimum version for older browsers", fr: "TLS 1.0 autorisé comme version minimale pour les anciens navigateurs" } }
    - id: scm
      options:
        - { id: nobasic, text: { en: "Basic authentication disabled, deployments authenticated with Microsoft Entra ID", fr: "Authentification de base désactivée, déploiements authentifiés avec Microsoft Entra ID" } }
        - { id: rotate, text: { en: "Publishing profile credentials rotated every 30 days", fr: "Informations d'identification du profil de publication renouvelées tous les 30 jours" } }
        - { id: ftp, text: { en: "FTP allowed for emergency fixes", fr: "FTP autorisé pour les correctifs d'urgence" } }
    - id: out
      options:
        - { id: pe, text: { en: "A private endpoint on each app", fr: "Un point de terminaison privé sur chaque application" } }
        - { id: vnet, text: { en: "Virtual network integration", fr: "L'intégration au réseau virtuel" } }
        - { id: ar, text: { en: "Access restrictions on each app", fr: "Des restrictions d'accès sur chaque application" } }
answer:
  values: { tls: https12, scm: nobasic, out: vnet }
explanation:
  correct:
    en: |
      HTTPS-only redirection isn't on by default and must be enabled, and the minimum TLS version should be 1.2 or higher for the app and the SCM site. Basic username and password authentication should be turned off for FTP and SCM, so that deployments use Microsoft Entra ID. Virtual network integration controls the app's outbound traffic and lets it reach the private endpoint of the database.
    fr: |
      La redirection HTTPS uniquement n'est pas activée par défaut et doit l'être, et la version TLS minimale doit être 1.2 ou supérieure pour l'application et le site SCM. L'authentification de base par nom d'utilisateur et mot de passe doit être désactivée pour FTP et SCM, afin que les déploiements utilisent Microsoft Entra ID. L'intégration au réseau virtuel contrôle le trafic sortant de l'application et lui permet de joindre le point de terminaison privé de la base de données.
  options:
    pe:
      en: |
        A private endpoint on the app covers inbound traffic only; it doesn't let the app call resources in the virtual network.
      fr: |
        Un point de terminaison privé sur l'application ne couvre que le trafic entrant ; il ne permet pas à l'application d'appeler des ressources du réseau virtuel.
    ar:
      en: |
        Access restrictions filter inbound requests to the app, not its outbound calls.
      fr: |
        Les restrictions d'accès filtrent les requêtes entrantes vers l'application, pas ses appels sortants.
    rotate:
      en: |
        Rotated publishing credentials are still basic authentication secrets.
      fr: |
        Des informations d'identification de publication renouvelées restent des secrets d'authentification de base.
references:
  - title: Secure your Azure App Service deployment
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-security
  - title: Azure security baseline for App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/security-recommendations
