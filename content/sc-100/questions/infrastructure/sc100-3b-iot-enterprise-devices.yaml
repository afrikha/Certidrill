id: sc100-3b-iot-enterprise-devices
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has 18 offices. The corporate network of each office contains printers, VoIP phones, smart TVs and video conferencing systems that can't run a security agent. All the Windows laptops in the offices are already onboarded to Microsoft Defender for Endpoint.

    You need to recommend a solution that inventories these devices, identifies their vulnerabilities and shows them in the Microsoft Defender portal. The solution must minimize the additional infrastructure to deploy.

    What should you recommend?
  fr: |
    Northwind Traders dispose de 18 bureaux. Le réseau d'entreprise de chaque bureau contient des imprimantes, des téléphones VoIP, des téléviseurs connectés et des systèmes de visioconférence qui ne peuvent pas exécuter d'agent de sécurité. Tous les ordinateurs portables Windows des bureaux sont déjà intégrés à Microsoft Defender for Endpoint.

    Vous devez recommander une solution qui inventorie ces appareils, identifie leurs vulnérabilités et les affiche dans le portail Microsoft Defender. La solution doit réduire au minimum l'infrastructure supplémentaire à déployer.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Defender for IoT OT network sensors connected to a SPAN port in each office", fr: "Des capteurs réseau OT Microsoft Defender for IoT connectés à un port SPAN dans chaque bureau" } }
    - { id: b, text: { en: "Microsoft Defender External Attack Surface Management (Defender EASM)", fr: "Microsoft Defender External Attack Surface Management (Defender EASM)" } }
    - { id: c, text: { en: "Enterprise IoT security with Microsoft Defender for Endpoint", fr: "La sécurité IoT d'entreprise avec Microsoft Defender for Endpoint" } }
    - { id: d, text: { en: "Microsoft Defender for Cloud Apps cloud discovery", fr: "La découverte cloud de Microsoft Defender for Cloud Apps" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Enterprise IoT security extends agentless security to enterprise IoT devices such as printers, smart TVs and conferencing systems by building on Defender for Endpoint, which is already deployed. The devices, their vulnerabilities and recommendations appear in the Microsoft Defender portal without new appliances.
    fr: |
      La sécurité IoT d'entreprise étend une sécurité sans agent aux appareils IoT d'entreprise comme les imprimantes, les téléviseurs connectés et les systèmes de conférence, en s'appuyant sur Defender for Endpoint, déjà déployé. Les appareils, leurs vulnérabilités et les recommandations apparaissent dans le portail Microsoft Defender sans nouvelle appliance.
  options:
    a:
      en: |
        OT network sensors are designed for industrial networks and would require a physical or virtual sensor in each of the 18 offices.
      fr: |
        Les capteurs réseau OT sont conçus pour les réseaux industriels et nécessiteraient un capteur physique ou virtuel dans chacun des 18 bureaux.
    b:
      en: |
        Defender EASM discovers internet-facing assets from the outside; it doesn't inventory devices inside the corporate network.
      fr: |
        Defender EASM découvre depuis l'extérieur les actifs exposés sur Internet ; il n'inventorie pas les appareils du réseau d'entreprise.
    d:
      en: |
        Cloud discovery identifies the cloud apps that users access; it doesn't inventory network devices or their vulnerabilities.
      fr: |
        La découverte cloud identifie les applications cloud auxquelles les utilisateurs accèdent ; elle n'inventorie ni les appareils réseau ni leurs vulnérabilités.
references:
  - title: What is Microsoft Defender for IoT?
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/overview
