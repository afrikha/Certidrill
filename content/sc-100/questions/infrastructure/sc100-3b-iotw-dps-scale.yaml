id: sc100-3b-iotw-dps-scale
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Climate will ship 200,000 connected thermostats over the next two years. The thermostats will connect to three Azure IoT Hub instances, one in each of three Azure regions. Each thermostat has an X.509 device certificate issued by Contoso's intermediate CA.

    The firmware image must not contain any IoT hub connection string, and each thermostat must be assigned automatically to the IoT hub with the lowest latency at its first boot. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Contoso Climate livrera 200 000 thermostats connectés au cours des deux prochaines années. Les thermostats se connecteront à trois instances Azure IoT Hub, une dans chacune de trois régions Azure. Chaque thermostat dispose d'un certificat d'appareil X.509 émis par l'autorité de certification intermédiaire de Contoso.

    L'image du microprogramme ne doit contenir aucune chaîne de connexion de hub IoT, et chaque thermostat doit être affecté automatiquement au hub IoT dont la latence est la plus faible lors de son premier démarrage. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Individual enrollments in the Device Provisioning Service, one per thermostat, with the evenly weighted distribution policy", fr: "Des inscriptions individuelles dans Device Provisioning Service, une par thermostat, avec la stratégie de distribution pondérée uniforme" } }
    - { id: b, text: { en: "An X.509 enrollment group in the Device Provisioning Service, with the lowest latency allocation policy", fr: "Un groupe d'inscription X.509 dans Device Provisioning Service, avec la stratégie d'allocation de latence la plus faible" } }
    - { id: c, text: { en: "A device identity created in each IoT hub by a script, with the three connection strings stored in the firmware", fr: "Une identité d'appareil créée dans chaque hub IoT par un script, avec les trois chaînes de connexion stockées dans le microprogramme" } }
    - { id: d, text: { en: "A shared access policy with the DeviceConnect permission in each IoT hub, selected by the thermostat at first boot", fr: "Une stratégie d'accès partagé avec l'autorisation DeviceConnect dans chaque hub IoT, choisie par le thermostat au premier démarrage" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Device Provisioning Service provides zero-touch provisioning at scale: devices contact the global endpoint with the ID scope, so no hub connection string is stored in the firmware. An enrollment group covers all the devices whose certificates share the same signing CA, and the lowest latency allocation policy assigns each device to the closest linked hub.
    fr: |
      Device Provisioning Service fournit un provisionnement sans intervention à grande échelle : les appareils contactent le point de terminaison global avec l'étendue d'ID ; aucune chaîne de connexion de hub n'est donc stockée dans le microprogramme. Un groupe d'inscription couvre tous les appareils dont les certificats partagent la même autorité de signature, et la stratégie d'allocation de latence la plus faible affecte chaque appareil au hub lié le plus proche.
  options:
    a:
      en: |
        Creating 200,000 individual enrollments doesn't minimize effort, and evenly weighted distribution ignores latency.
      fr: |
        Créer 200 000 inscriptions individuelles ne réduit pas l'effort au minimum, et la distribution pondérée uniforme ignore la latence.
    c:
      en: |
        Connection strings in the firmware are exactly what the requirements forbid, and the script would have to register every device in every hub.
      fr: |
        Des chaînes de connexion dans le microprogramme sont précisément ce que les exigences interdisent, et le script devrait inscrire chaque appareil dans chaque hub.
    d:
      en: |
        A shared access policy is a hub-wide credential: storing it on devices puts a hub connection secret in the firmware.
      fr: |
        Une stratégie d'accès partagé est une information d'identification valable pour tout le hub : la stocker sur les appareils place un secret de connexion au hub dans le microprogramme.
references:
  - title: IoT Hub Device Provisioning Service terminology
    url: https://learn.microsoft.com/en-us/azure/iot-dps/concepts-service
