id: sc100-3b-iot-tampering
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Agritech deploys soil sensors and irrigation gateways in open fields. The devices connect to Azure over cellular links by using TLS. A threat model identified two risks: an attacker with physical access could plug into a USB or debug port, and an attacker could push modified firmware to the devices.

    You need to specify device security requirements that address both risks.

    Which two requirements should you include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Agritech déploie des capteurs de sol et des passerelles d'irrigation dans des champs. Les appareils se connectent à Azure par des liaisons cellulaires avec TLS. Un modèle de menaces a identifié deux risques : un attaquant ayant un accès physique pourrait se brancher sur un port USB ou de débogage, et un attaquant pourrait envoyer un microprogramme modifié aux appareils.

    Vous devez spécifier des exigences de sécurité des appareils qui traitent les deux risques.

    Quelles sont les deux exigences à inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Disable or cover unused USB and debug ports, and use hardware that reports tampering signals to the cloud.", fr: "Désactiver ou couvrir les ports USB et de débogage inutilisés, et utiliser du matériel qui signale les tentatives de falsification au cloud." } }
    - { id: b, text: { en: "Require TLS 1.2 or later for all the telemetry that the devices send to Azure.", fr: "Exiger TLS 1.2 ou version ultérieure pour toute la télémétrie que les appareils envoient à Azure." } }
    - { id: c, text: { en: "Install only firmware updates whose cryptographic signature the device verifies, delivered through a secure update service.", fr: "N'installer que les mises à jour de microprogramme dont l'appareil vérifie la signature cryptographique, fournies par un service de mise à jour sécurisé." } }
    - { id: d, text: { en: "Rotate the symmetric key that all the devices share every 30 days.", fr: "Renouveler tous les 30 jours la clé symétrique partagée par tous les appareils." } }
    - { id: e, text: { en: "Scan the public IP addresses of the gateways with Defender EASM.", fr: "Analyser les adresses IP publiques des passerelles avec Defender EASM." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Minimizing the physical attack surface, such as covering unused USB ports, and choosing hardware with tamper detection that reports to the cloud address physical access. A secure update path with cryptographic assurance of the firmware version prevents the installation of modified firmware.
    fr: |
      Réduire la surface d'attaque physique, par exemple en couvrant les ports USB inutilisés, et choisir du matériel avec détection des falsifications qui remonte au cloud traitent l'accès physique. Un chemin de mise à jour sécurisé avec une garantie cryptographique de la version du microprogramme empêche l'installation d'un microprogramme modifié.
  options:
    b:
      en: |
        TLS protects data in transit; the devices already use it, and it addresses neither physical ports nor firmware integrity.
      fr: |
        TLS protège les données en transit ; les appareils l'utilisent déjà, et il ne traite ni les ports physiques ni l'intégrité du microprogramme.
    d:
      en: |
        A shared key gives no per-device identity, and rotating it doesn't stop modified firmware or physical access.
      fr: |
        Une clé partagée ne donne pas d'identité par appareil, et son renouvellement n'empêche ni un microprogramme modifié ni l'accès physique.
    e:
      en: |
        Defender EASM discovers internet-exposed assets; it doesn't protect the device ports or validate firmware.
      fr: |
        Defender EASM découvre les actifs exposés sur Internet ; il ne protège pas les ports des appareils et ne valide pas le microprogramme.
references:
  - title: Secure your IoT solutions
    url: https://learn.microsoft.com/en-us/azure/iot/iot-overview-security
