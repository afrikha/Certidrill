id: sc100-3b-svc-responsibility
objective: "3.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum Travel uses Azure virtual machines (IaaS), Azure App Service (PaaS) and Microsoft 365 (SaaS). You are building a security baseline for each service model based on the shared responsibility model.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Travel utilise des machines virtuelles Azure (IaaS), Azure App Service (PaaS) et Microsoft 365 (SaaS). Vous créez une base de référence de sécurité pour chaque modèle de service à partir du modèle de responsabilité partagée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The baseline for the virtual machines must include operating system patching and configuration by Adatum.
        fr: La base de référence des machines virtuelles doit inclure la mise à jour et la configuration du système d'exploitation par Adatum.
    - id: s2
      text:
        en: For App Service, network controls are entirely Microsoft's responsibility, so the PaaS baseline needs no network requirement.
        fr: Pour App Service, les contrôles réseau relèvent entièrement de Microsoft ; la base de référence PaaS n'a donc besoin d'aucune exigence réseau.
    - id: s3
      text:
        en: For Microsoft 365, Adatum remains responsible for its data, its configuration settings and its identities.
        fr: Pour Microsoft 365, Adatum reste responsable de ses données, de ses paramètres de configuration et de ses identités.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      In IaaS the operating system is a customer responsibility. In PaaS, network controls are shared: Microsoft runs the platform network, but the customer still configures access restrictions, private endpoints and similar controls. Customer data, configurations and settings, and identities and users stay with the customer in every model, including SaaS.
    fr: |
      En IaaS, le système d'exploitation relève du client. En PaaS, les contrôles réseau sont partagés : Microsoft exploite le réseau de la plateforme, mais le client configure toujours les restrictions d'accès, les points de terminaison privés et les contrôles similaires. Les données du client, les configurations et paramètres, ainsi que les identités et les utilisateurs restent au client dans tous les modèles, y compris le SaaS.
references:
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
