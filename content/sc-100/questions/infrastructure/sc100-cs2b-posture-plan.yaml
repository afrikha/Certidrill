id: sc100-cs2b-posture-plan
objective: "3.1.3"
type: dropdown
caseStudy: sc100-cs2b-vanarsdel-payments
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution for the posture assessment of the three clouds. The solution must meet the posture management requirements and the general requirements.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution pour l'évaluation de la posture des trois clouds. La solution doit répondre aux exigences de gestion de la posture et aux exigences générales.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Defender for Cloud plan to enable on all the environments: [[plan]]

      Method to onboard the AWS accounts and the GCP project: [[onboard]]
    fr: |
      Plan Defender for Cloud à activer sur tous les environnements : [[plan]]

      Méthode d'intégration des comptes AWS et du projet GCP : [[onboard]]
  slots:
    - id: plan
      options:
        - { id: foundational, text: { en: "Foundational CSPM", fr: "CSPM de base (Foundational CSPM)" } }
        - { id: servers, text: "Defender for Servers Plan 2" }
        - { id: dcspm, text: "Defender CSPM" }
    - id: onboard
      options:
        - { id: arc, text: { en: "Azure Arc-enabled servers on every EC2 and Compute Engine instance", fr: "Serveurs Azure Arc sur chaque instance EC2 et Compute Engine" } }
        - { id: connectors, text: { en: "An AWS connector and a GCP connector in Defender for Cloud", fr: "Un connecteur AWS et un connecteur GCP dans Defender for Cloud" } }
        - { id: sentinel, text: { en: "Microsoft Sentinel data connectors for AWS CloudTrail and GCP audit logs", fr: "Connecteurs de données Microsoft Sentinel pour AWS CloudTrail et les journaux d'audit GCP" } }
answer:
  values: { plan: dcspm, onboard: connectors }
explanation:
  correct:
    en: |
      Attack path analysis, the cloud security explorer and agentless scanning are capabilities of the paid Defender CSPM plan, which is available for Azure, AWS and GCP; foundational CSPM provides only the secure score, recommendations and the MCSB. The AWS and GCP connectors of Defender for Cloud read the cloud APIs of the accounts and the project, so posture is assessed without installing any agent.
    fr: |
      L'analyse du chemin d'attaque, l'explorateur de sécurité cloud et l'analyse sans agent sont des fonctionnalités du plan payant Defender CSPM, disponible pour Azure, AWS et GCP ; le CSPM de base ne fournit que le degré de sécurisation, les recommandations et le MCSB. Les connecteurs AWS et GCP de Defender for Cloud lisent les API cloud des comptes et du projet ; la posture est donc évaluée sans installer d'agent.
  options:
    foundational:
      en: Foundational CSPM doesn't include attack path analysis.
      fr: Le CSPM de base n'inclut pas l'analyse du chemin d'attaque.
    servers:
      en: Defender for Servers Plan 2 protects servers; it doesn't provide attack path analysis across the cloud resources.
      fr: Defender for Servers Plan 2 protège des serveurs ; il ne fournit pas l'analyse du chemin d'attaque sur l'ensemble des ressources cloud.
    arc:
      en: Azure Arc installs the Connected Machine agent on each instance, which the requirements forbid, and doesn't cover non-VM resources such as ECR or BigQuery.
      fr: Azure Arc installe l'agent Connected Machine sur chaque instance, ce que les exigences interdisent, et ne couvre pas les ressources autres que des machines virtuelles comme ECR ou BigQuery.
    sentinel:
      en: Sentinel data connectors ingest logs for detection and hunting; they don't feed the posture assessment of Defender for Cloud.
      fr: Les connecteurs de données Sentinel ingèrent des journaux pour la détection et la chasse ; ils n'alimentent pas l'évaluation de la posture de Defender for Cloud.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
