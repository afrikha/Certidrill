id: sc100-3b-baseline-drift
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Logistics has 400 servers that run Windows Server 2019 and Windows Server 2022. Half of them are Azure virtual machines, and the others are on-premises servers onboarded to Azure Arc. The servers aren't managed by Intune.

    You need to recommend a solution for the server security baseline that meets the following requirements:

    - The hardened operating system settings are applied to every server.
    - Any setting that a local administrator changes is restored automatically.
    - Compliance is reported centrally in Azure.

    What should you recommend?
  fr: |
    Northwind Logistics dispose de 400 serveurs qui exécutent Windows Server 2019 et Windows Server 2022. La moitié sont des machines virtuelles Azure, et les autres des serveurs locaux intégrés à Azure Arc. Les serveurs ne sont pas gérés par Intune.

    Vous devez recommander une solution pour la base de référence de sécurité des serveurs qui répond aux exigences suivantes :

    - Les paramètres renforcés du système d'exploitation sont appliqués à chaque serveur.
    - Tout paramètre modifié par un administrateur local est restauré automatiquement.
    - La conformité est signalée de façon centralisée dans Azure.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Machine configuration assignments that only audit the settings", fr: "Des attributions de configuration des machines qui auditent uniquement les paramètres" } }
    - { id: b, text: { en: "Machine configuration assignments that apply the settings and correct drift automatically", fr: "Des attributions de configuration des machines qui appliquent les paramètres et corrigent automatiquement la dérive" } }
    - { id: c, text: { en: "Machine configuration assignments that apply the settings and monitor them for changes", fr: "Des attributions de configuration des machines qui appliquent les paramètres et en surveillent les modifications" } }
    - { id: d, text: { en: "OSConfig security baselines with drift control, deployed through Azure Policy", fr: "Des bases de référence de sécurité OSConfig avec contrôle de la dérive, déployées par Azure Policy" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Machine Configuration audits or configures operating system settings of Azure and Arc-enabled machines, and reports results through Azure Policy. Of its three modes, only Apply and Autocorrect restores conformance when drift occurs; Audit only reports the state, and Apply and Monitor applies the configuration and monitors it.
    fr: |
      La configuration des machines Azure audite ou configure les paramètres du système d'exploitation des machines Azure et des machines avec Azure Arc, et signale les résultats via Azure Policy. Parmi ses trois modes, seul Apply and Autocorrect rétablit la conformité en cas de dérive ; Audit se contente de signaler l'état, et Apply and Monitor applique la configuration et la surveille.
  options:
    a:
      en: |
        Audit mode reports noncompliant settings but never applies or restores them.
      fr: |
        Le mode audit signale les paramètres non conformes mais ne les applique ni ne les restaure jamais.
    c:
      en: |
        Apply and Monitor applies the configuration and monitors it for changes; it doesn't restore the settings that drift.
      fr: |
        Apply and Monitor applique la configuration et en surveille les modifications ; il ne restaure pas les paramètres qui dérivent.
    d:
      en: |
        OSConfig applies to Windows Server 2025, and these servers run Windows Server 2019 and 2022.
      fr: |
        OSConfig s'applique à Windows Server 2025, et ces serveurs exécutent Windows Server 2019 et 2022.
references:
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
  - title: OSConfig security configuration for Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-overview
