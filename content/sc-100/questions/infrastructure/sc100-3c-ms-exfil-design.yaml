id: sc100-3c-ms-exfil-design
objective: "3.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation wants to stop data exfiltration through foreign Microsoft 365 tenants. Employees use Windows laptops, macOS laptops and iOS phones, mostly from home, and Adatum has no corporate proxy. All users have Microsoft Entra ID P1 licenses.

    The design must ensure that, on Adatum devices, users can sign in only to the Adatum tenant and to two approved partner tenants.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation veut empêcher l'exfiltration de données par des locataires Microsoft 365 étrangers. Les employés utilisent des ordinateurs portables Windows et macOS ainsi que des téléphones iOS, surtout depuis leur domicile, et Adatum n'a pas de proxy d'entreprise. Tous les utilisateurs disposent de licences Microsoft Entra ID P1.

    La conception doit garantir que, sur les appareils d'Adatum, les utilisateurs ne peuvent se connecter qu'au locataire d'Adatum et à deux locataires partenaires approuvés.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Define the allowed tenants in: [[policy]]

      Enforce the policy on the devices by using: [[enforce]]

      Forward the sign-in traffic by enabling: [[profile]]
    fr: |
      Définir les locataires autorisés dans : [[policy]]

      Appliquer la stratégie sur les appareils avec : [[enforce]]

      Transférer le trafic de connexion en activant : [[profile]]
  slots:
    - id: policy
      options:
        - { id: trv2, text: { en: "A tenant restrictions v2 policy", fr: "Une stratégie de restrictions de locataire v2" } }
        - { id: outbound, text: { en: "The outbound B2B collaboration settings", fr: "Les paramètres sortants de collaboration B2B" } }
        - { id: inbound, text: { en: "The inbound B2B collaboration settings", fr: "Les paramètres entrants de collaboration B2B" } }
        - { id: ca, text: { en: "A Conditional Access policy with a compliant network condition", fr: "Une stratégie d'accès conditionnel avec une condition de réseau conforme" } }
    - id: enforce
      options:
        - { id: utr, text: { en: "Universal tenant restrictions with the Global Secure Access client", fr: "Les restrictions de locataire universelles avec le client Global Secure Access" } }
        - { id: gpo, text: { en: "The Windows Group Policy setting for tenant restrictions", fr: "Le paramètre de stratégie de groupe Windows pour les restrictions de locataire" } }
        - { id: header, text: { en: "A proxy that injects the tenant restrictions header", fr: "Un proxy qui injecte l'en-tête des restrictions de locataire" } }
    - id: profile
      options:
        - { id: microsoft, text: { en: "The Microsoft traffic forwarding profile", fr: "Le profil de transfert du trafic Microsoft" } }
        - { id: internet, text: { en: "The Internet access traffic forwarding profile", fr: "Le profil de transfert du trafic d'accès Internet" } }
        - { id: private, text: { en: "The Private access traffic forwarding profile", fr: "Le profil de transfert du trafic d'accès privé" } }
answer:
  values: { policy: trv2, enforce: utr, profile: microsoft }
explanation:
  correct:
    en: |-
      Tenant restrictions v2 defines which external tenants and apps can be used with external accounts on your devices and networks. Universal tenant restrictions enforce that policy through the Global Secure Access client on all platforms without a corporate proxy, and they require the Microsoft traffic forwarding profile with the Microsoft Entra ID endpoints set to tunnel.
    fr: |-
      Les restrictions de locataire v2 définissent les locataires et applications externes utilisables avec des comptes externes sur vos appareils et réseaux. Les restrictions de locataire universelles appliquent cette stratégie par le client Global Secure Access sur toutes les plateformes, sans proxy d'entreprise, et exigent le profil de transfert du trafic Microsoft avec les points de terminaison Microsoft Entra ID en tunnel.
  options:
    outbound:
      en: |-
        Outbound settings govern Adatum accounts in B2B scenarios; they don't stop users from signing in with accounts of foreign tenants.
      fr: |-
        Les paramètres sortants régissent les comptes d'Adatum dans les scénarios B2B ; ils n'empêchent pas les utilisateurs de se connecter avec des comptes de locataires étrangers.
    gpo:
      en: |-
        The Group Policy option covers only Windows devices, not the macOS laptops and iOS phones.
      fr: |-
        L'option de stratégie de groupe ne couvre que les appareils Windows, pas les ordinateurs portables macOS ni les téléphones iOS.
    header:
      en: |-
        Adatum has no corporate proxy, and a proxy wouldn't see the traffic of users at home.
      fr: |-
        Adatum n'a pas de proxy d'entreprise, et un proxy ne verrait pas le trafic des utilisateurs à domicile.
references:
  - title: Turn on Universal Tenant Restrictions
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-universal-tenant-restrictions
  - title: Set up tenant restrictions v2
    url: https://learn.microsoft.com/en-us/entra/external-id/tenant-restrictions-v2
