id: sc100-cs2a-ot-sensors
objective: "3.2.4"
type: dropdown
caseStudy: sc100-cs2a-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to monitor the OT networks of the power plants. The solution must meet the OT requirements.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution pour surveiller les réseaux OT des centrales. La solution doit répondre aux exigences OT.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Monitoring solution: [[product]]

      Source of the monitored traffic: [[traffic]]

      Sensor management mode: [[mode]]
    fr: |
      Solution de surveillance : [[product]]

      Source du trafic surveillé : [[traffic]]

      Mode de gestion des capteurs : [[mode]]
  slots:
    - id: product
      options:
        - { id: easm, text: "Microsoft Defender External Attack Surface Management (Defender EASM)" }
        - { id: iot, text: { en: "Microsoft Defender for IoT OT network sensors", fr: "Capteurs réseau OT de Microsoft Defender for IoT" } }
        - { id: mde, text: { en: "Microsoft Defender for Endpoint device discovery", fr: "Découverte d'appareils de Microsoft Defender for Endpoint" } }
    - id: traffic
      options:
        - { id: scan, text: { en: "Active scans of the PLC and RTU address ranges", fr: "Analyses actives des plages d'adresses des PLC et des RTU" } }
        - { id: span, text: { en: "A SPAN port or a network TAP on the plant switches", fr: "Un port SPAN ou un TAP réseau sur les commutateurs des centrales" } }
        - { id: agent, text: { en: "An agent installed on each HMI workstation", fr: "Un agent installé sur chaque poste HMI" } }
    - id: mode
      options:
        - { id: local, text: { en: "Locally managed sensors", fr: "Capteurs gérés localement" } }
        - { id: cloud, text: { en: "Cloud-connected sensors", fr: "Capteurs connectés au cloud" } }
answer:
  values: { product: iot, traffic: span, mode: cloud }
explanation:
  correct:
    en: |
      Microsoft Defender for IoT provides agentless, network-layer monitoring of OT devices: its OT network sensors discover the assets and analyze industrial protocols with deep packet inspection. A sensor receives a copy of the traffic from a SPAN port or a network TAP, so nothing is installed on the PLCs, RTUs or HMIs and no traffic is injected. Cloud-connected sensors send their alerts to Azure through the outbound HTTPS path of the DMZ, which is what allows the Microsoft Sentinel integration; a locally managed sensor keeps its data in its own console.
    fr: |
      Microsoft Defender for IoT assure une surveillance sans agent, au niveau du réseau, des appareils OT : ses capteurs réseau OT découvrent les actifs et analysent les protocoles industriels par inspection approfondie des paquets. Un capteur reçoit une copie du trafic depuis un port SPAN ou un TAP réseau ; rien n'est donc installé sur les PLC, les RTU ou les postes HMI et aucun trafic n'est injecté. Les capteurs connectés au cloud envoient leurs alertes à Azure par le chemin HTTPS sortant de la DMZ, ce qui permet l'intégration avec Microsoft Sentinel ; un capteur géré localement conserve ses données dans sa propre console.
  options:
    easm:
      en: Defender EASM discovers internet-facing assets from the outside; it doesn't see the internal OT networks or Modbus and DNP3 commands.
      fr: Defender EASM découvre depuis l'extérieur les actifs exposés sur Internet ; il ne voit ni les réseaux OT internes ni les commandes Modbus et DNP3.
    mde:
      en: Defender for Endpoint device discovery relies on onboarded endpoints and targets enterprise IoT devices; it doesn't analyze industrial protocols on segregated OT networks.
      fr: La découverte d'appareils de Defender for Endpoint s'appuie sur des points de terminaison intégrés et vise les appareils IoT d'entreprise ; elle n'analyse pas les protocoles industriels sur des réseaux OT isolés.
    scan:
      en: Active scans inject traffic into the OT networks, which the requirements forbid.
      fr: Des analyses actives injectent du trafic dans les réseaux OT, ce que les exigences interdisent.
    agent:
      en: No software can be installed on the HMI workstations.
      fr: Aucun logiciel ne peut être installé sur les postes HMI.
    local:
      en: Locally managed sensors keep the detailed data in each sensor console and don't send alerts to Azure, so the SOC couldn't investigate them in Microsoft Sentinel.
      fr: Des capteurs gérés localement conservent les données détaillées dans chaque console de capteur et n'envoient pas d'alertes à Azure ; le SOC ne pourrait donc pas les examiner dans Microsoft Sentinel.
references:
  - title: Defender for IoT - OT architecture and components
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/architecture
  - title: Enhance your OT security with Defender for IoT
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/overview
