id: sc100-3a-arc-vs-mde-direct
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has 400 on-premises Windows Server and Linux servers. The servers were onboarded directly to Microsoft Defender for Endpoint by using the onboarding package, and they aren't connected to Azure.

    The security team adds the following requirements:

    - Show the missing operating system updates of the servers in Microsoft Defender for Cloud.
    - Audit local operating system settings by using Azure Policy machine configuration.
    - Keep endpoint detection and response (EDR) from Defender for Endpoint.

    The solution must minimize cost.

    What should you recommend?
  fr: |
    Adatum Corporation dispose de 400 serveurs Windows Server et Linux locaux. Les serveurs ont été intégrés directement à Microsoft Defender for Endpoint à l'aide du package d'intégration, et ils ne sont pas connectés à Azure.

    L'équipe de sécurité ajoute les exigences suivantes :

    - Afficher dans Microsoft Defender for Cloud les mises à jour manquantes du système d'exploitation des serveurs.
    - Auditer les paramètres locaux du système d'exploitation avec la configuration des machines Azure Policy.
    - Conserver la détection et réponse des points de terminaison (EDR) de Defender for Endpoint.

    La solution doit réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Keep the direct onboarding and enable Defender for Servers Plan 2 on the subscription that hosts the Defender for Endpoint integration", fr: "Conserver l'intégration directe et activer Defender for Servers Plan 2 sur l'abonnement qui héberge l'intégration de Defender for Endpoint" }
    - id: b
      text: { en: "Connect the servers to Azure Arc and enable Defender for Servers Plan 1 on the subscription that contains them", fr: "Connecter les serveurs à Azure Arc et activer Defender for Servers Plan 1 sur l'abonnement qui les contient" }
    - id: c
      text: { en: "Install the Azure Monitor Agent on the servers and enable Defender CSPM on the subscription that contains the workspace", fr: "Installer l'agent Azure Monitor sur les serveurs et activer Defender CSPM sur l'abonnement qui contient l'espace de travail" }
    - id: d
      text: { en: "Connect the servers to Azure Arc and enable Defender for Servers Plan 2 on the subscription that contains them", fr: "Connecter les serveurs à Azure Arc et activer Defender for Servers Plan 2 sur l'abonnement qui les contient" }
answer:
  optionId: d
explanation:
  correct:
    en: Machine configuration and Defender for Cloud recommendations apply to Azure resources, so the on-premises servers must first become Azure Arc-enabled servers. The OS system updates assessment is a Defender for Servers Plan 2 feature, available for on-premises machines onboarded with Azure Arc; Plan 2 also keeps the Defender for Endpoint integration.
    fr: La configuration des machines et les recommandations de Defender for Cloud s'appliquent à des ressources Azure ; les serveurs locaux doivent donc d'abord devenir des serveurs compatibles Azure Arc. L'évaluation des mises à jour du système d'exploitation est une fonctionnalité de Defender for Servers Plan 2, disponible pour les machines locales intégrées à Azure Arc ; le Plan 2 conserve aussi l'intégration de Defender for Endpoint.
  options:
    a:
      en: Servers onboarded directly to Defender for Endpoint aren't Azure resources, so machine configuration and the Defender for Cloud updates assessment can't apply to them.
      fr: Les serveurs intégrés directement à Defender for Endpoint ne sont pas des ressources Azure ; la configuration des machines et l'évaluation des mises à jour de Defender for Cloud ne peuvent donc pas s'y appliquer.
    b:
      en: Plan 1 is cheaper, but it doesn't include the OS system updates assessment, which requires Plan 2.
      fr: Le Plan 1 coûte moins cher, mais il n'inclut pas l'évaluation des mises à jour du système d'exploitation, qui exige le Plan 2.
    c:
      en: The Azure Monitor Agent collects data but doesn't make the servers Azure resources, and Defender CSPM doesn't provide the OS system updates assessment of the servers.
      fr: L'agent Azure Monitor collecte des données mais ne transforme pas les serveurs en ressources Azure, et Defender CSPM ne fournit pas l'évaluation des mises à jour du système d'exploitation des serveurs.
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
