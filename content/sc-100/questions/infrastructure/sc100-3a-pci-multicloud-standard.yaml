id: sc100-3a-pci-multicloud-standard
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. processes card payments in two Azure subscriptions and four AWS accounts. The AWS accounts are already connected to Microsoft Defender for Cloud, and all environments use Foundational CSPM.

    A qualified security assessor requires a continuous assessment of the resource configurations in both clouds against PCI DSS v4.0.1. The results must be shown in one dashboard, and the assessor must be able to download reports.

    The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Fabrikam, Inc. traite des paiements par carte dans deux abonnements Azure et quatre comptes AWS. Les comptes AWS sont déjà connectés à Microsoft Defender for Cloud, et tous les environnements utilisent Foundational CSPM.

    Un évaluateur de sécurité qualifié exige une évaluation continue des configurations des ressources des deux clouds selon PCI DSS v4.0.1. Les résultats doivent figurer dans un seul tableau de bord, et l'évaluateur doit pouvoir télécharger des rapports.

    La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Assign the PCI DSS initiative of Azure Policy to the Azure subscriptions and enable AWS Security Hub in the AWS accounts", fr: "Attribuer l'initiative PCI DSS d'Azure Policy aux abonnements Azure et activer AWS Security Hub dans les comptes AWS" }
    - id: b
      text: { en: "Enable Defender CSPM on the subscriptions and AWS connectors, then add PCI DSS v4.0.1 to the regulatory compliance dashboard", fr: "Activer Defender CSPM sur les abonnements et les connecteurs AWS, puis ajouter PCI DSS v4.0.1 au tableau de bord de conformité réglementaire" }
    - id: c
      text: { en: "Keep Foundational CSPM on the subscriptions and AWS connectors, then add PCI DSS v4.0.1 to the regulatory compliance dashboard", fr: "Conserver Foundational CSPM sur les abonnements et les connecteurs AWS, puis ajouter PCI DSS v4.0.1 au tableau de bord de conformité réglementaire" }
    - id: d
      text: { en: "Enable Defender for Servers Plan 2 on the subscriptions and AWS connectors, then review the operating system baseline results", fr: "Activer Defender for Servers Plan 2 sur les abonnements et les connecteurs AWS, puis examiner les résultats de la base de référence du système d'exploitation" }
answer:
  optionId: b
explanation:
  correct:
    en: Regulatory compliance assessments beyond the default benchmark are a Defender CSPM capability, available for Azure, AWS and GCP. Once the plan is enabled, you add PCI DSS v4.0.1 to the regulatory compliance dashboard, which maps the assessments of both clouds to the standard's controls and lets you download audit reports from one place.
    fr: Les évaluations de conformité réglementaire au-delà du benchmark par défaut sont une fonctionnalité de Defender CSPM, disponible pour Azure, AWS et GCP. Une fois le plan activé, vous ajoutez PCI DSS v4.0.1 au tableau de bord de conformité réglementaire, qui associe les évaluations des deux clouds aux contrôles de la norme et permet de télécharger des rapports d'audit depuis un seul endroit.
  options:
    a:
      en: This produces two separate tools and dashboards, one per cloud, which doesn't meet the single-dashboard requirement and increases administrative effort.
      fr: Cette option produit deux outils et deux tableaux de bord distincts, un par cloud, ce qui ne respecte pas l'exigence d'un tableau de bord unique et augmente l'effort d'administration.
    c:
      en: Foundational CSPM includes only the Microsoft cloud security benchmark; regulatory compliance assessments for standards such as PCI DSS require Defender CSPM.
      fr: Foundational CSPM n'inclut que le benchmark de sécurité cloud Microsoft ; les évaluations de conformité réglementaire pour des normes comme PCI DSS exigent Defender CSPM.
    d:
      en: Defender for Servers protects machines and assesses their operating system settings; it doesn't assess all the cloud resources against the PCI DSS controls.
      fr: Defender for Servers protège les machines et évalue les paramètres de leur système d'exploitation ; il n'évalue pas l'ensemble des ressources cloud selon les contrôles PCI DSS.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
  - title: Regulatory compliance in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
