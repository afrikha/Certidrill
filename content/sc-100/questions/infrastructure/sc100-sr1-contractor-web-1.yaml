id: sc100-sr1-contractor-web-1
objective: "3.4.2"
type: series_yesno
series: sc100-sr1-contractor-web
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You recommend an Internet Access filtering policy delivered to Contractors by Conditional Access.
  fr: Vous recommandez une stratégie de filtrage d'Accès Internet appliquée à Contractors par l'accès conditionnel.
body:
  solution:
    en: |
      You recommend enabling the **Internet Access** traffic forwarding profile and assigning it to **Contractors**. You create a web content filtering policy that blocks the **Gambling** category and link it to a new security profile. A Conditional Access policy that targets **Contractors** and the **All internet resources with Global Secure Access** resource applies the security profile by using the **Use Global Secure Access security profile** session control.
    fr: |
      Vous recommandez d'activer le profil de transfert du trafic **Internet Access** et de l'attribuer à **Contractors**. Vous créez une stratégie de filtrage du contenu web qui bloque la catégorie **Gambling** et la liez à un nouveau profil de sécurité. Une stratégie d'accès conditionnel qui cible **Contractors** et la ressource **All internet resources with Global Secure Access** applique le profil de sécurité au moyen du contrôle de session **Use Global Secure Access security profile**.
answer: { value: true }
explanation:
  correct:
    en: Microsoft Entra Internet Access acts as a cloud-delivered secure web gateway, so the Global Secure Access client sends internet traffic to the Microsoft edge from any location, without the on-premises network. Conditional Access adds the security profile only to the tokens of Contractors members, so the Gambling block doesn't affect the other users.
    fr: "Accès Internet Microsoft Entra joue le rôle de passerelle web sécurisée fournie depuis le cloud : le client Global Secure Access envoie le trafic Internet à la périphérie Microsoft depuis n'importe quel emplacement, sans passer par le réseau local. L'accès conditionnel ajoute le profil de sécurité uniquement aux jetons des membres de Contractors, si bien que le blocage de Gambling n'affecte pas les autres utilisateurs."
references:
  - title: How to configure Global Secure Access web content filtering
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-web-content-filtering
