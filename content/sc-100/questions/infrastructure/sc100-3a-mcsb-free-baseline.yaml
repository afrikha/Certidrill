id: sc100-3a-mcsb-free-baseline
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has 12 Azure subscriptions, eight AWS accounts and three GCP projects. The CISO wants every environment assessed against one common set of cloud security best practices, with a posture score for each environment. No regulatory standard is required for now.

    The solution must minimize cost.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose de 12 abonnements Azure, de huit comptes AWS et de trois projets GCP. Le RSSI veut que chaque environnement soit évalué selon un même ensemble de bonnes pratiques de sécurité cloud, avec un score de posture pour chaque environnement. Aucune norme réglementaire n'est exigée pour l'instant.

    La solution doit réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Connect the AWS accounts and GCP projects to Defender for Cloud and use Foundational CSPM with the Microsoft cloud security benchmark", fr: "Connecter les comptes AWS et les projets GCP à Defender for Cloud et utiliser Foundational CSPM avec le benchmark de sécurité cloud Microsoft" }
    - id: b
      text: { en: "Enable Defender CSPM on every environment and add the ISO/IEC 27001:2022 standard to the regulatory compliance dashboard", fr: "Activer Defender CSPM sur chaque environnement et ajouter la norme ISO/IEC 27001:2022 au tableau de bord de conformité réglementaire" }
    - id: c
      text: { en: "Enable Defender for Servers Plan 2 on every environment and use the operating system baseline assessments", fr: "Activer Defender for Servers Plan 2 sur chaque environnement et utiliser les évaluations de la base de référence du système d'exploitation" }
    - id: d
      text: { en: "Ingest the AWS CloudTrail and GCP audit logs into Microsoft Sentinel and build a posture workbook", fr: "Ingérer les journaux AWS CloudTrail et d'audit GCP dans Microsoft Sentinel et créer un classeur de posture" }
answer:
  optionId: a
explanation:
  correct:
    en: Foundational CSPM is the free tier of Defender for Cloud. It applies the Microsoft cloud security benchmark (MCSB) to Azure subscriptions and to connected AWS accounts and GCP projects, produces recommendations and calculates a secure score for each subscription or connector. This meets the requirement of one common benchmark and a score per environment at no extra cost.
    fr: Foundational CSPM est le niveau gratuit de Defender for Cloud. Il applique le benchmark de sécurité cloud Microsoft (MCSB) aux abonnements Azure ainsi qu'aux comptes AWS et projets GCP connectés, produit des recommandations et calcule un degré de sécurisation pour chaque abonnement ou connecteur. Cela répond à l'exigence d'un benchmark commun et d'un score par environnement, sans coût supplémentaire.
  options:
    b:
      en: Regulatory compliance assessments for additional standards require the paid Defender CSPM plan, and no regulatory standard is required, so this adds cost without meeting a requirement.
      fr: Les évaluations de conformité réglementaire pour d'autres normes exigent le plan payant Defender CSPM, et aucune norme réglementaire n'est demandée ; cette option ajoute un coût sans répondre à une exigence.
    c:
      en: Defender for Servers is a paid workload protection plan that covers machines only; it doesn't assess the other cloud resources and isn't needed for the benchmark assessment.
      fr: Defender for Servers est un plan payant de protection des charges de travail qui ne couvre que les machines ; il n'évalue pas les autres ressources cloud et n'est pas nécessaire pour l'évaluation du benchmark.
    d:
      en: Sentinel ingests activity logs for detection and hunting; logs don't provide a configuration assessment against a benchmark, and ingestion adds cost.
      fr: Sentinel ingère des journaux d'activité pour la détection et la chasse ; les journaux ne fournissent pas d'évaluation de la configuration selon un benchmark, et l'ingestion ajoute un coût.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
  - title: Regulatory compliance in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
