id: sc100-3b-iot-legacy-firmware
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Properties manages office buildings. Each building has badge readers and building management controllers that run embedded firmware. The vendor no longer releases firmware updates, and the devices can't run a security agent. Today the devices are on the same network as the user workstations.

    You need to recommend a requirement that reduces the risk that an attacker who compromises a workstation reaches these devices.

    What should you recommend?
  fr: |
    Adatum Properties gère des immeubles de bureaux. Chaque immeuble dispose de lecteurs de badges et de contrôleurs de gestion technique du bâtiment qui exécutent un microprogramme embarqué. Le fournisseur ne publie plus de mises à jour du microprogramme, et les appareils ne peuvent pas exécuter d'agent de sécurité. Aujourd'hui, les appareils sont sur le même réseau que les postes de travail des utilisateurs.

    Vous devez recommander une exigence qui réduit le risque qu'un attaquant ayant compromis un poste de travail atteigne ces appareils.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Place the devices in a dedicated network segment protected by firewall rules", fr: "Placer les appareils dans un segment réseau dédié protégé par des règles de pare-feu" } }
    - { id: b, text: { en: "Install Microsoft Defender for Endpoint on the badge readers and controllers", fr: "Installer Microsoft Defender for Endpoint sur les lecteurs de badges et les contrôleurs" } }
    - { id: c, text: { en: "Enroll the badge readers and controllers in Microsoft Intune and assign a compliance policy", fr: "Inscrire les lecteurs de badges et les contrôleurs dans Microsoft Intune et leur attribuer une stratégie de conformité" } }
    - { id: d, text: { en: "Require multifactor authentication for the users of the workstations", fr: "Exiger l'authentification multifacteur pour les utilisateurs des postes de travail" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Devices that can't be patched or host an agent are protected by network controls: segmentation and firewall rules limit which systems can reach them, so a compromised workstation can't connect to them directly. Agentless monitoring can then watch the traffic of that segment.
    fr: |
      Les appareils qui ne peuvent pas être mis à jour ni héberger d'agent sont protégés par des contrôles réseau : la segmentation et les règles de pare-feu limitent les systèmes qui peuvent les joindre, si bien qu'un poste compromis ne peut pas s'y connecter directement. Une surveillance sans agent peut ensuite observer le trafic de ce segment.
  options:
    b:
      en: |
        The devices can't run a security agent, so Defender for Endpoint can't be installed on them.
      fr: |
        Les appareils ne peuvent pas exécuter d'agent de sécurité ; Defender for Endpoint ne peut donc pas y être installé.
    c:
      en: |
        Intune manages supported operating systems such as Windows, iOS and Android, not embedded firmware of badge readers.
      fr: |
        Intune gère des systèmes d'exploitation pris en charge comme Windows, iOS et Android, pas le microprogramme embarqué des lecteurs de badges.
    d:
      en: |
        MFA protects user sign-ins; it doesn't stop malware on a workstation from connecting to devices on the same network.
      fr: |
        L'authentification multifacteur protège les connexions des utilisateurs ; elle n'empêche pas un logiciel malveillant sur un poste de se connecter aux appareils du même réseau.
references:
  - title: Secure your IoT solutions
    url: https://learn.microsoft.com/en-us/azure/iot/iot-overview-security
