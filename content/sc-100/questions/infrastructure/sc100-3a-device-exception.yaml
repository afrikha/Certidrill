id: sc100-3a-device-exception
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation onboarded all its Windows devices to Microsoft Defender for Endpoint. A recommended action of the **Device** category in Microsoft Secure Score is covered on every device by a non-Microsoft endpoint control that Adatum must keep.

    An administrator created an exception per device group for the matching recommendation in Microsoft Defender Vulnerability Management, but the Secure Score action still shows **To address**.

    You need Secure Score to record the justification and reflect the coverage for the organization.

    What should you recommend?
  fr: |
    Adatum Corporation a intégré tous ses appareils Windows à Microsoft Defender for Endpoint. Une action recommandée de la catégorie **Device** du Niveau de sécurité Microsoft est couverte sur tous les appareils par un contrôle de point de terminaison non Microsoft qu'Adatum doit conserver.

    Un administrateur a créé une exception par groupe d'appareils pour la recommandation correspondante dans Gestion des vulnérabilités Microsoft Defender, mais l'action du Niveau de sécurité Microsoft présente toujours l'état **To address**.

    Le Niveau de sécurité Microsoft doit enregistrer la justification et refléter la couverture pour l'organisation.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Set the status of the Secure Score action to Resolved through third party", fr: "Définir l'état de l'action du Niveau de sécurité Microsoft sur Resolved through third party" }
    - id: b
      text: { en: "Replace the exception with a global exception in Defender Vulnerability Management", fr: "Remplacer l'exception par une exception globale dans Gestion des vulnérabilités Microsoft Defender" }
    - id: c
      text: { en: "Set the status of the Secure Score action to Risk accepted", fr: "Définir l'état de l'action du Niveau de sécurité Microsoft sur Risk accepted" }
    - id: d
      text: { en: "Keep the exception per device group and wait for the next daily synchronization", fr: "Conserver l'exception par groupe d'appareils et attendre la prochaine synchronisation quotidienne" }
answer:
  optionId: b
explanation:
  correct:
    en: You can't set a status directly on Device recommendations in Secure Score; you're directed to the matching Defender Vulnerability Management recommendation. A global exception there updates the Secure Score status with the exception justification, which can take up to two hours. An exception per device group doesn't update Secure Score, so the action stays To address.
    fr: Vous ne pouvez pas définir directement un état sur les recommandations Device du Niveau de sécurité Microsoft ; vous êtes redirigé vers la recommandation correspondante de Gestion des vulnérabilités Microsoft Defender. Une exception globale à cet endroit met à jour l'état du Niveau de sécurité Microsoft avec la justification de l'exception, ce qui peut prendre jusqu'à deux heures. Une exception par groupe d'appareils ne met pas à jour le Niveau de sécurité Microsoft ; l'action reste donc To address.
  options:
    a:
      en: Resolved through third party is the right status for other categories, but statuses can't be set on Device recommendations in Secure Score.
      fr: Resolved through third party est l'état approprié pour les autres catégories, mais aucun état ne peut être défini sur les recommandations Device dans le Niveau de sécurité Microsoft.
    c:
      en: Statuses can't be set on Device recommendations in Secure Score, and Risk accepted wouldn't reflect a control that is in place.
      fr: Aucun état ne peut être défini sur les recommandations Device dans le Niveau de sécurité Microsoft, et Risk accepted ne refléterait pas un contrôle en place.
    d:
      en: An exception per device group never updates Secure Score, whatever the synchronization schedule.
      fr: Une exception par groupe d'appareils ne met jamais à jour le Niveau de sécurité Microsoft, quel que soit le calendrier de synchronisation.
references:
  - title: Assess your security posture through Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-improvement-actions
