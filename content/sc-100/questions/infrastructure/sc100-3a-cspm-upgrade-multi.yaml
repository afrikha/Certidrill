id: sc100-3a-cspm-upgrade-multi
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender for Cloud with Foundational CSPM on its Azure subscriptions and its connected AWS accounts. The security team submits the following posture requirements:

    - Show a secure score for each subscription.
    - Scan VM disks for vulnerabilities without installing an agent.
    - Trigger a logic app when a recommendation becomes unhealthy.
    - Identify exploitable paths from internet-exposed VMs to storage accounts that hold sensitive data.
    - Assess the AWS accounts against the Microsoft cloud security benchmark.

    Which two requirements require you to enable Defender CSPM?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Defender for Cloud avec Foundational CSPM sur ses abonnements Azure et ses comptes AWS connectés. L'équipe de sécurité soumet les exigences de posture suivantes :

    - Afficher un degré de sécurisation pour chaque abonnement.
    - Analyser les disques des machines virtuelles pour détecter les vulnérabilités sans installer d'agent.
    - Déclencher une application logique quand une recommandation devient non saine.
    - Identifier les chemins exploitables entre les machines virtuelles exposées à Internet et les comptes de stockage qui contiennent des données sensibles.
    - Évaluer les comptes AWS selon le benchmark de sécurité cloud Microsoft.

    Quelles sont les deux exigences qui vous obligent à activer Defender CSPM ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Show a secure score for each subscription", fr: "Afficher un degré de sécurisation pour chaque abonnement" }
    - id: b
      text: { en: "Scan VM disks for vulnerabilities without installing an agent", fr: "Analyser les disques des machines virtuelles pour détecter les vulnérabilités sans installer d'agent" }
    - id: c
      text: { en: "Trigger a logic app when a recommendation becomes unhealthy", fr: "Déclencher une application logique quand une recommandation devient non saine" }
    - id: d
      text: { en: "Identify exploitable paths from internet-exposed VMs to storage accounts that hold sensitive data", fr: "Identifier les chemins exploitables entre les machines virtuelles exposées à Internet et les comptes de stockage qui contiennent des données sensibles" }
    - id: e
      text: { en: "Assess the AWS accounts against the Microsoft cloud security benchmark", fr: "Évaluer les comptes AWS selon le benchmark de sécurité cloud Microsoft" }
answer:
  optionIds: [b, d]
explanation:
  correct:
    en: Agentless VM vulnerability scanning and attack path analysis are Defender CSPM capabilities for Azure, AWS and GCP. Attack path analysis, combined with sensitive data discovery, finds exploitable paths from internet-exposed resources to data stores.
    fr: L'analyse sans agent des vulnérabilités des machines virtuelles et l'analyse du chemin d'attaque sont des fonctionnalités de Defender CSPM pour Azure, AWS et GCP. L'analyse du chemin d'attaque, combinée à la découverte des données sensibles, trouve les chemins exploitables entre les ressources exposées à Internet et les magasins de données.
  options:
    a:
      en: The secure score is included in Foundational CSPM.
      fr: Le degré de sécurisation est inclus dans Foundational CSPM.
    c:
      en: Workflow automation is included in Foundational CSPM.
      fr: L'automatisation des workflows est incluse dans Foundational CSPM.
    e:
      en: The Microsoft cloud security benchmark is the default standard of Foundational CSPM, including for connected AWS accounts.
      fr: Le benchmark de sécurité cloud Microsoft est la norme par défaut de Foundational CSPM, y compris pour les comptes AWS connectés.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
