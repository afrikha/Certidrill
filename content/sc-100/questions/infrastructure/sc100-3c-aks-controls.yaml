id: sc100-3c-aks-controls
objective: "3.3.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso is writing the security baseline for its Azure Kubernetes Service (AKS) clusters. The clusters are integrated with Microsoft Entra ID.

    You need to recommend a control for each requirement.

    Which control should you recommend for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso rédige la base de référence de sécurité de ses clusters Azure Kubernetes Service (AKS). Les clusters sont intégrés à Microsoft Entra ID.

    Vous devez recommander un contrôle pour chaque exigence.

    Quel contrôle devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: local, text: { en: "Disable local accounts", fr: "Désactiver les comptes locaux" } }
    - { id: azrbac, text: { en: "Azure RBAC for Kubernetes authorization", fr: "Azure RBAC pour l'autorisation Kubernetes" } }
    - { id: kms, text: { en: "KMS etcd encryption with Azure Key Vault", fr: "Chiffrement etcd KMS avec Azure Key Vault" } }
    - { id: policy, text: { en: "Azure Policy for Kubernetes", fr: "Azure Policy pour Kubernetes" } }
    - { id: authip, text: { en: "API server authorized IP ranges", fr: "Plages d'adresses IP autorisées du serveur d'API" } }
    - { id: upgrade, text: { en: "Automatic node OS image upgrades", fr: "Mises à niveau automatiques de l'image du système d'exploitation des nœuds" } }
  targets:
    - id: t1
      text: { en: "No static credential can grant cluster-admin access without Microsoft Entra authentication", fr: "Aucun identifiant statique ne peut accorder un accès cluster-admin sans authentification Microsoft Entra" }
    - id: t2
      text: { en: "Permissions inside the cluster are granted by role assignments to Microsoft Entra groups, managed like other Azure permissions", fr: "Les autorisations dans le cluster sont accordées par des attributions de rôles à des groupes Microsoft Entra, gérées comme les autres autorisations Azure" }
    - id: t3
      text: { en: "Kubernetes secrets at rest are encrypted with a key that Contoso controls", fr: "Les secrets Kubernetes au repos sont chiffrés avec une clé que Contoso contrôle" }
    - id: t4
      text: { en: "Pod specifications that mount host paths are rejected", fr: "Les spécifications de pod qui montent des chemins de l'hôte sont rejetées" }
answer:
  mapping: { t1: local, t2: azrbac, t3: kms, t4: policy }
explanation:
  correct:
    en: |-
      Disabling local accounts removes the static cluster-admin credential, so every access goes through Microsoft Entra ID. Azure RBAC for Kubernetes authorization grants in-cluster permissions through Azure role assignments. KMS etcd encryption encrypts Kubernetes secrets with a customer-managed key in Key Vault. Azure Policy for Kubernetes checks each request to the API server and can deny pods that mount host paths.
    fr: |-
      Désactiver les comptes locaux supprime l'identifiant cluster-admin statique : tout accès passe par Microsoft Entra ID. Azure RBAC pour l'autorisation Kubernetes accorde les autorisations dans le cluster par des attributions de rôles Azure. Le chiffrement etcd KMS chiffre les secrets Kubernetes avec une clé gérée par le client dans Key Vault. Azure Policy pour Kubernetes vérifie chaque requête adressée au serveur d'API et peut refuser les pods qui montent des chemins de l'hôte.
  options:
    authip:
      en: |-
        Authorized IP ranges limit the networks that reach the API server; they don't remove credentials or check pod specifications.
      fr: |-
        Les plages d'adresses IP autorisées limitent les réseaux qui atteignent le serveur d'API ; elles ne suppriment pas d'identifiants et ne vérifient pas les spécifications de pod.
    upgrade:
      en: |-
        Node image upgrades keep the nodes patched, which isn't one of the listed requirements.
      fr: |-
        Les mises à niveau de l'image des nœuds maintiennent les nœuds à jour, ce qui ne figure pas parmi les exigences.
references:
  - title: Manage local accounts with Microsoft Entra integration
    url: https://learn.microsoft.com/en-us/azure/aks/manage-local-accounts-managed-azure-ad
  - title: Security concepts for applications and clusters in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-security
