id: sc100-3a-target-score-rbac
objective: "3.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank activated Microsoft Defender unified role-based access control (RBAC). Microsoft Defender for Endpoint uses device groups, and most administrators can access only the device groups of their region.

    You are specifying the permissions of the exposure management team. The team members must set the target scores of the Security Exposure Management initiatives and edit metric values. The solution must follow the principle of least privilege.

    Which two permissions should you include in the specification?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank a activé le contrôle d'accès en fonction du rôle (RBAC) unifié de Microsoft Defender. Microsoft Defender for Endpoint utilise des groupes d'appareils, et la plupart des administrateurs n'ont accès qu'aux groupes d'appareils de leur région.

    Vous spécifiez les autorisations de l'équipe de gestion de l'exposition. Les membres de l'équipe doivent définir les scores cibles des initiatives de Security Exposure Management et modifier les valeurs des métriques. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux autorisations à inclure dans la spécification ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A custom unified RBAC role with Exposure Management (read), assigned to the Microsoft Security Exposure Management data source", fr: "Un rôle RBAC unifié personnalisé avec Exposure Management (read), attribué à la source de données Microsoft Security Exposure Management" }
    - id: b
      text: { en: "A custom unified RBAC role with Exposure Management (manage), assigned to the Microsoft Security Exposure Management data source", fr: "Un rôle RBAC unifié personnalisé avec Exposure Management (manage), attribué à la source de données Microsoft Security Exposure Management" }
    - id: c
      text: { en: "A custom unified RBAC role with Core security settings (manage)", fr: "Un rôle RBAC unifié personnalisé avec Core security settings (manage)" }
    - id: d
      text: { en: "Access to all the Defender for Endpoint device groups", fr: "L'accès à tous les groupes d'appareils Defender for Endpoint" }
    - id: e
      text: { en: "The Global Administrator role in Microsoft Entra ID", fr: "Le rôle Global Administrator dans Microsoft Entra ID" }
answer:
  optionIds: [b, d]
explanation:
  correct:
    en: Exposure Management (manage) includes everything in read plus the ability to set initiative target scores and edit metric values, provided that the user has access to all the Defender for Endpoint device groups. The custom role must be assigned to the Microsoft Security Exposure Management data source.
    fr: Exposure Management (manage) inclut tout ce que permet read, plus la possibilité de définir les scores cibles des initiatives et de modifier les valeurs des métriques, à condition que l'utilisateur ait accès à tous les groupes d'appareils Defender for Endpoint. Le rôle personnalisé doit être attribué à la source de données Microsoft Security Exposure Management.
  options:
    a:
      en: Exposure Management (read) gives access to the experiences and data but doesn't allow setting target scores.
      fr: Exposure Management (read) donne accès aux expériences et aux données, mais ne permet pas de définir des scores cibles.
    c:
      en: Core security settings (manage) is required for sensitive actions such as connecting or changing the vendor of the external attack surface management initiative, not for target scores.
      fr: Core security settings (manage) est exigé pour des actions sensibles comme connecter ou changer le fournisseur de l'initiative de gestion de la surface d'attaque externe, pas pour les scores cibles.
    e:
      en: Global Administrator can set target scores, but Microsoft recommends limiting it to emergency scenarios; it breaks least privilege.
      fr: Global Administrator peut définir des scores cibles, mais Microsoft recommande de le limiter aux scénarios d'urgence ; il contrevient au moindre privilège.
references:
  - title: Prerequisites and support in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/prerequisites
