id: sc100-3b-svc-paas-enforce
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Retail has 35 Azure subscriptions under a management group named Production. Development teams deploy Azure App Service apps by using their own templates.

    The PaaS security baseline requires that every App Service app is accessible over HTTPS only. Deployments that don't meet the requirement must be prevented in all current and future subscriptions under Production, and existing noncompliant apps must be reported. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Woodgrove Retail dispose de 35 abonnements Azure sous un groupe d'administration nommé Production. Les équipes de développement déploient des applications Azure App Service avec leurs propres modèles.

    La base de référence de sécurité PaaS exige que chaque application App Service ne soit accessible qu'en HTTPS. Les déploiements qui ne respectent pas l'exigence doivent être empêchés dans tous les abonnements actuels et futurs sous Production, et les applications non conformes existantes doivent être signalées. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Review the App Service recommendations in Defender for Cloud every week and open a ticket for each noncompliant app", fr: "Examiner chaque semaine les recommandations App Service de Defender for Cloud et ouvrir un ticket pour chaque application non conforme" } }
    - { id: b, text: { en: "Enable Microsoft Defender for App Service on each subscription under the Production management group", fr: "Activer Microsoft Defender for App Service sur chaque abonnement sous le groupe d'administration Production" } }
    - { id: c, text: { en: "Place Azure Front Door in front of every app and configure an HTTP-to-HTTPS redirect rule", fr: "Placer Azure Front Door devant chaque application et configurer une règle de redirection de HTTP vers HTTPS" } }
    - { id: d, text: { en: "Assign a built-in Azure Policy definition with the Deny effect to the Production management group", fr: "Attribuer une définition Azure Policy intégrée avec l'effet Deny au groupe d'administration Production" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The App Service security baseline points to the built-in Azure Policy definition "App Service apps should only be accessible over HTTPS", which can audit or deny non-HTTPS configurations. Assigned with the Deny effect at the management group, it applies to every current and future subscription below it, blocks noncompliant deployments and reports the existing apps as noncompliant.
    fr: |
      La base de référence de sécurité d'App Service renvoie à la définition Azure Policy intégrée « App Service apps should only be accessible over HTTPS », qui peut auditer ou refuser les configurations non HTTPS. Attribuée avec l'effet Deny au groupe d'administration, elle s'applique à tous les abonnements actuels et futurs situés en dessous, bloque les déploiements non conformes et signale les applications existantes comme non conformes.
  options:
    a:
      en: |
        Recommendations report the problem but don't prevent deployments, and weekly manual reviews don't minimize effort.
      fr: |
        Les recommandations signalent le problème mais n'empêchent pas les déploiements, et des revues manuelles hebdomadaires ne réduisent pas l'effort au minimum.
    b:
      en: |
        Defender for App Service detects threats against apps; it doesn't block deployments that allow HTTP.
      fr: |
        Defender for App Service détecte les menaces visant les applications ; il ne bloque pas les déploiements qui autorisent HTTP.
    c:
      en: |
        A redirect at Front Door doesn't change the app's own configuration, and direct requests to the app would still accept HTTP.
      fr: |
        Une redirection dans Front Door ne modifie pas la configuration de l'application, et les requêtes directes vers l'application accepteraient toujours HTTP.
references:
  - title: Azure security baseline for App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/security-recommendations
