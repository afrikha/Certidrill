id: sc100-3a-score-points-multi
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The CISO of Fabrikam, Inc. plans to use Microsoft Secure Score as a key performance indicator for the Microsoft 365 tenant. Before approving the indicator, the CISO asks how the score awards points.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Le RSSI de Fabrikam, Inc. prévoit d'utiliser le Niveau de sécurité Microsoft comme indicateur clé de performance pour le locataire Microsoft 365. Avant d'approuver l'indicateur, le RSSI demande comment le score attribue des points.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "If MFA protects 50 of 100 users for a 10-point action, the action earns 5 points", fr: "Si la MFA protège 50 utilisateurs sur 100 pour une action de 10 points, l'action rapporte 5 points" }
    - id: b
      text: { en: "Setting an action to Risk accepted awards the points that the action is worth", fr: "Définir une action sur Risk accepted accorde les points que vaut l'action" }
    - id: c
      text: { en: "Recommended actions appear only for the products that the tenant has licensed", fr: "Les actions recommandées n'apparaissent que pour les produits dont le locataire possède une licence" }
    - id: d
      text: { en: "Each recommended action is worth 10 points or less", fr: "Chaque action recommandée vaut 10 points ou moins" }
    - id: e
      text: { en: "An administrator can set the Completed status manually to award the points", fr: "Un administrateur peut définir manuellement l'état Completed pour accorder les points" }
answer:
  optionIds: [a, d]
explanation:
  correct:
    en: Each recommended action is worth 10 points or less. Most actions are binary, but some award partial points as a percentage of the configuration, so 50 of 100 users protected on a 10-point action earns 5 points.
    fr: Chaque action recommandée vaut 10 points ou moins. La plupart des actions sont binaires, mais certaines accordent des points partiels en proportion de la configuration ; 50 utilisateurs sur 100 protégés pour une action de 10 points rapportent donc 5 points.
  options:
    b:
      en: Risk accepted awards no points; it records that the organization accepts the remaining risk.
      fr: L'état Risk accepted n'accorde aucun point ; il enregistre que l'organisation accepte le risque restant.
    c:
      en: The full set of recommendations is shown regardless of the license edition, because the score reflects the absolute posture.
      fr: L'ensemble des recommandations est affiché quelle que soit l'édition de licence, car le score reflète la posture absolue.
    e:
      en: Completed is set automatically when Microsoft data confirms that all the possible points are achieved; it can't be changed.
      fr: L'état Completed est défini automatiquement quand les données Microsoft confirment que tous les points possibles sont atteints ; il ne peut pas être modifié.
references:
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
  - title: Assess your security posture through Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-improvement-actions
