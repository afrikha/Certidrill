id: sc100-3a-exposure-blocks-dropdown
objective: "3.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Security Exposure Management. The CISO lists three requirements for the posture management process.

    Which Exposure Management capability should you specify for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft Security Exposure Management. Le RSSI liste trois exigences pour le processus de gestion de la posture.

    Quelle fonctionnalité d'Exposure Management devez-vous spécifier pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Measure the readiness of the organization against ransomware and compare it with a goal of 80 %: [[ransom]]

      Find the single asset through which many attack paths to critical assets pass: [[choke]]

      Query the relationships between devices, identities and cloud resources to hunt for exposure: [[graph]]
    fr: |
      Mesurer la préparation de l'organisation face aux rançongiciels et la comparer à un objectif de 80 % : [[ransom]]

      Trouver la ressource unique par laquelle passent de nombreux chemins d'attaque vers des ressources critiques : [[choke]]

      Interroger les relations entre les appareils, les identités et les ressources cloud pour rechercher l'exposition : [[graph]]
  slots:
    - id: ransom
      options:
        - { id: initiative, text: { en: "A security initiative with a target score", fr: "Une initiative de sécurité avec un score cible" } }
        - { id: choke, text: { en: "A choke point", fr: "Un point d'étranglement" } }
        - { id: blast, text: { en: "The blast radius", fr: "Le rayon d'impact" } }
        - { id: graph, text: { en: "The enterprise exposure graph", fr: "Le graphe d'exposition d'entreprise" } }
    - id: choke
      options:
        - { id: initiative, text: { en: "A security initiative with a target score", fr: "Une initiative de sécurité avec un score cible" } }
        - { id: choke, text: { en: "A choke point", fr: "Un point d'étranglement" } }
        - { id: blast, text: { en: "The blast radius", fr: "Le rayon d'impact" } }
        - { id: graph, text: { en: "The enterprise exposure graph", fr: "Le graphe d'exposition d'entreprise" } }
    - id: graph
      options:
        - { id: initiative, text: { en: "A security initiative with a target score", fr: "Une initiative de sécurité avec un score cible" } }
        - { id: choke, text: { en: "A choke point", fr: "Un point d'étranglement" } }
        - { id: blast, text: { en: "The blast radius", fr: "Le rayon d'impact" } }
        - { id: graph, text: { en: "The enterprise exposure graph", fr: "Le graphe d'exposition d'entreprise" } }
answer:
  values: { ransom: initiative, choke: choke, graph: graph }
explanation:
  correct:
    en: Security initiatives measure exposure in one security area, such as ransomware, and you can set a target score as a percentage. Choke points are nodes where several attack paths to a critical asset intersect, so securing one addresses several paths. The enterprise exposure graph combines asset and relationship data from all the workloads and can be queried to explore assets, assess risk and hunt.
    fr: Les initiatives de sécurité mesurent l'exposition dans un domaine de sécurité, comme les rançongiciels, et vous pouvez définir un score cible sous forme de pourcentage. Les points d'étranglement sont des nœuds où se croisent plusieurs chemins d'attaque vers une ressource critique ; en sécuriser un traite donc plusieurs chemins. Le graphe d'exposition d'entreprise combine les données des ressources et de leurs relations issues de toutes les charges de travail et peut être interrogé pour explorer les ressources, évaluer le risque et chasser.
  options:
    blast:
      en: The blast radius shows what an attacker could reach from one choke point; it doesn't find the choke point, measure an area or support hunting queries.
      fr: Le rayon d'impact montre ce qu'un attaquant pourrait atteindre depuis un point d'étranglement ; il ne trouve pas le point d'étranglement, ne mesure pas un domaine et ne prend pas en charge les requêtes de chasse.
references:
  - title: Review Security Initiatives in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/initiatives
  - title: What is Microsoft Security Exposure Management?
    url: https://learn.microsoft.com/en-us/security-exposure-management/microsoft-security-exposure-management
