id: sc100-3a-easm-cspm-integration
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender for Cloud with Defender CSPM on its Azure subscriptions and AWS accounts. The cloud security team wants to validate from the outside which cloud resources are really exposed to the internet, and to use that exposure in attack path analysis and in cloud security explorer queries.

    The scope is limited to the cloud resources. No additional license or resource may be deployed.

    What should you recommend?
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender for Cloud avec Defender CSPM sur ses abonnements Azure et ses comptes AWS. L'équipe de sécurité cloud veut valider depuis l'extérieur quelles ressources cloud sont réellement exposées à Internet, et utiliser cette exposition dans l'analyse du chemin d'attaque et dans les requêtes de l'explorateur de sécurité cloud.

    Le périmètre se limite aux ressources cloud. Aucune licence ni ressource supplémentaire ne doit être déployée.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Use the Defender EASM integration that is included in Defender CSPM", fr: "Utiliser l'intégration Defender EASM incluse dans Defender CSPM" }
    - id: b
      text: { en: "Deploy a Defender EASM resource and add the cloud IP ranges as discovery seeds", fr: "Déployer une ressource Defender EASM et ajouter les plages IP cloud comme graines de découverte" }
    - id: c
      text: { en: "Enable Defender for Servers Plan 2 and use the network map of the VMs", fr: "Activer Defender for Servers Plan 2 et utiliser la carte réseau des machines virtuelles" }
    - id: d
      text: { en: "Run connection troubleshooting from Azure Network Watcher on each public endpoint", fr: "Exécuter la résolution des problèmes de connexion d'Azure Network Watcher sur chaque point de terminaison public" }
answer:
  optionId: a
explanation:
  correct:
    en: The Defender EASM integration is included with the Defender CSPM plan and needs no Defender EASM license or special configuration. EASM collects outside-in data on publicly exposed assets, and Defender CSPM uses it to validate internet exposure, to find attack paths that start from internet-exposed IPs and to correlate those IPs in cloud security explorer queries.
    fr: L'intégration Defender EASM est incluse dans le plan Defender CSPM et ne demande ni licence Defender EASM ni configuration particulière. EASM collecte depuis l'extérieur des données sur les ressources exposées publiquement, et Defender CSPM les utilise pour valider l'exposition à Internet, trouver les chemins d'attaque qui partent d'adresses IP exposées à Internet et mettre ces adresses en corrélation dans les requêtes de l'explorateur de sécurité cloud.
  options:
    b:
      en: A standalone Defender EASM resource covers the whole external footprint, but it is an additional resource and license that the scope doesn't require.
      fr: Une ressource Defender EASM autonome couvre toute l'empreinte externe, mais c'est une ressource et une licence supplémentaires que le périmètre n'exige pas.
    c:
      en: The network map is an Azure-only view of the network topology; it doesn't validate exposure from the internet for AWS resources or feed attack paths.
      fr: La carte réseau est une vue de la topologie réseau limitée à Azure ; elle ne valide pas l'exposition depuis Internet des ressources AWS et n'alimente pas les chemins d'attaque.
    d:
      en: Network Watcher tests connectivity from Azure resources; it doesn't scan the external attack surface or feed Defender for Cloud.
      fr: Network Watcher teste la connectivité depuis des ressources Azure ; il n'analyse pas la surface d'attaque externe et n'alimente pas Defender for Cloud.
references:
  - title: External attack surface management in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-easm
