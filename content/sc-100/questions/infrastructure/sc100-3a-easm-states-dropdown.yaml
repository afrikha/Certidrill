id: sc100-3a-easm-states-dropdown
objective: "3.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation deployed Microsoft Defender External Attack Surface Management (Defender EASM). The security team reviews the discovered assets and must label them so that the inventory reflects ownership.

    Which state should you assign to each asset? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation a déployé Microsoft Defender External Attack Surface Management (Defender EASM). L'équipe de sécurité examine les ressources découvertes et doit les étiqueter pour que l'inventaire reflète la propriété.

    Quel état devez-vous attribuer à chaque ressource ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A host name under adatum.com that Adatum operates and must monitor every day: [[owned]]

      An IP address of a hosting provider that runs the public website of Adatum: [[dep]]

      The websites of independent franchisees that use the Adatum brand and must be reported separately: [[franchise]]
    fr: |
      Un nom d'hôte sous adatum.com qu'Adatum exploite et doit surveiller chaque jour : [[owned]]

      Une adresse IP d'un hébergeur qui exécute le site web public d'Adatum : [[dep]]

      Les sites web de franchisés indépendants qui utilisent la marque Adatum et dont il faut rendre compte séparément : [[franchise]]
  slots:
    - id: owned
      options:
        - { id: approved, text: Approved Inventory }
        - { id: candidate, text: Candidate }
        - { id: dependency, text: Dependency }
        - { id: monitor, text: Monitor Only }
        - { id: investigate, text: Requires Investigation }
    - id: dep
      options:
        - { id: approved, text: Approved Inventory }
        - { id: candidate, text: Candidate }
        - { id: dependency, text: Dependency }
        - { id: monitor, text: Monitor Only }
        - { id: investigate, text: Requires Investigation }
    - id: franchise
      options:
        - { id: approved, text: Approved Inventory }
        - { id: candidate, text: Candidate }
        - { id: dependency, text: Dependency }
        - { id: monitor, text: Monitor Only }
        - { id: investigate, text: Requires Investigation }
answer:
  values: { owned: approved, dep: dependency, franchise: monitor }
explanation:
  correct:
    en: Approved Inventory is the owned attack surface that you're directly responsible for; these assets are scanned daily and always shown in the dashboards. Dependency is infrastructure owned by a third party that directly supports owned assets, such as a provider IP address that hosts your web content. Monitor Only is relevant to the attack surface but neither directly controlled nor a technical dependency, such as independent franchisees kept separate for reporting.
    fr: Approved Inventory désigne la surface d'attaque possédée dont vous êtes directement responsable ; ces ressources sont analysées chaque jour et toujours affichées dans les tableaux de bord. Dependency désigne une infrastructure détenue par un tiers qui soutient directement les ressources possédées, comme l'adresse IP d'un fournisseur qui héberge votre contenu web. Monitor Only désigne ce qui concerne la surface d'attaque sans être directement contrôlé ni constituer une dépendance technique, comme des franchisés indépendants tenus à part pour le reporting.
  options:
    candidate:
      en: Candidate is a state assigned during discovery to assets whose ownership must still be reviewed manually; the ownership of these assets is already known.
      fr: Candidate est un état attribué pendant la découverte aux ressources dont la propriété doit encore être examinée manuellement ; la propriété de ces ressources est déjà connue.
    investigate:
      en: Requires Investigation flags an asset for manual validation based on confidence scores; it doesn't record a known relationship.
      fr: Requires Investigation signale une ressource à valider manuellement selon des scores de confiance ; il n'enregistre pas une relation connue.
references:
  - title: Understand Inventory Assets
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/understanding-inventory-assets
