id: sc100-3c-net-hub-review
objective: "3.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation proposes the following Azure network design:

    - A hub virtual network contains Azure Firewall Standard.
    - Spoke1 and Spoke2 are each peered with the hub. Spoke1 and Spoke2 are also peered directly with each other.
    - Outbound internet traffic from the spokes leaves through the default system routes, filtered by NSG outbound rules that use service tags.

    The security requirements state that all traffic between spokes must be inspected by the hub firewall, and that the spokes may reach only a list of approved internet FQDNs.

    Which two changes should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation propose la conception réseau Azure suivante :

    - Un réseau virtuel hub contient le Pare-feu Azure Standard.
    - Spoke1 et Spoke2 sont chacun reliés au hub par peering. Spoke1 et Spoke2 sont aussi reliés directement entre eux par peering.
    - Le trafic Internet sortant des spokes sort par les itinéraires système par défaut, filtré par des règles NSG sortantes qui utilisent des étiquettes de service.

    Les exigences de sécurité indiquent que tout le trafic entre spokes doit être inspecté par le pare-feu du hub, et que les spokes ne peuvent atteindre qu'une liste de FQDN Internet approuvés.

    Quelles sont les deux modifications à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Remove the direct peering and route spoke-to-spoke traffic to the hub firewall with user-defined routes", fr: "Supprimer le peering direct et router le trafic entre spokes vers le pare-feu du hub avec des itinéraires définis par l'utilisateur" } }
    - { id: b, text: { en: "Route 0.0.0.0/0 to the hub firewall and allow the approved FQDNs with application rules", fr: "Router 0.0.0.0/0 vers le pare-feu du hub et autoriser les FQDN approuvés avec des règles d'application" } }
    - { id: c, text: { en: "Upgrade the firewall to Azure Firewall Premium so that it can filter by FQDN", fr: "Passer au Pare-feu Azure Premium pour qu'il puisse filtrer par FQDN" } }
    - { id: d, text: { en: "Enable Azure DDoS Network Protection on the hub virtual network", fr: "Activer Azure DDoS Network Protection sur le réseau virtuel hub" } }
    - { id: e, text: { en: "Add NSG outbound rules that list the approved FQDNs on each spoke subnet", fr: "Ajouter sur chaque sous-réseau spoke des règles NSG sortantes qui listent les FQDN approuvés" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      A direct peering lets spoke traffic bypass the hub, so it must be removed and the spokes must send each other's prefixes to the firewall with user-defined routes. Sending 0.0.0.0/0 to the firewall forces internet egress through it, and application rules in Azure Firewall Standard allow traffic by FQDN.
    fr: |-
      Un peering direct permet au trafic des spokes de contourner le hub : il faut le supprimer et faire envoyer par les spokes les préfixes de l'autre spoke vers le pare-feu avec des itinéraires définis par l'utilisateur. Envoyer 0.0.0.0/0 vers le pare-feu force la sortie Internet à le traverser, et les règles d'application du Pare-feu Azure Standard autorisent le trafic par FQDN.
  options:
    c:
      en: |-
        FQDN filtering in application rules is already available in Azure Firewall Standard; Premium adds TLS inspection, IDPS and URL filtering.
      fr: |-
        Le filtrage FQDN dans les règles d'application est déjà disponible dans le Pare-feu Azure Standard ; Premium ajoute l'inspection TLS, l'IDPS et le filtrage d'URL.
    d:
      en: |-
        DDoS Network Protection mitigates volumetric attacks on public IP addresses; it doesn't route or filter spoke traffic.
      fr: |-
        DDoS Network Protection atténue les attaques volumétriques sur les adresses IP publiques ; il ne route ni ne filtre le trafic des spokes.
    e:
      en: |-
        NSG rules filter on IP addresses, ports and service tags; they can't match FQDNs.
      fr: |-
        Les règles NSG filtrent sur les adresses IP, les ports et les étiquettes de service ; elles ne peuvent pas correspondre à des FQDN.
references:
  - title: Hub-spoke network topology in Azure
    url: https://learn.microsoft.com/en-us/azure/architecture/networking/architecture/hub-spoke
  - title: Azure Firewall features by SKU
    url: https://learn.microsoft.com/en-us/azure/firewall/features-by-sku
