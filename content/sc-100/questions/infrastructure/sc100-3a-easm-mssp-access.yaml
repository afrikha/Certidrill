id: sc100-3a-easm-mssp-access
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. deployed a Microsoft Defender External Attack Surface Management (Defender EASM) resource in its Azure subscription. A managed security service provider (MSSP) that uses its own Microsoft Entra tenant must review the Defender EASM inventory and dashboards for Contoso.

    The MSSP analysts must not be able to create, edit or delete resources or inventory assets.

    What should you recommend?
  fr: |
    Contoso, Ltd. a déployé une ressource Microsoft Defender External Attack Surface Management (Defender EASM) dans son abonnement Azure. Un fournisseur de services de sécurité managés (MSSP) qui utilise son propre locataire Microsoft Entra doit examiner l'inventaire et les tableaux de bord Defender EASM de Contoso.

    Les analystes du MSSP ne doivent pas pouvoir créer, modifier ni supprimer des ressources ou des ressources d'inventaire.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Delegate the resource group of the Defender EASM resource to the MSSP tenant by using Azure Lighthouse", fr: "Déléguer le groupe de ressources de la ressource Defender EASM au locataire du MSSP avec Azure Lighthouse" }
    - id: b
      text: { en: "Invite the analysts as guest users in the Contoso tenant and assign them the Contributor role on the Defender EASM resource", fr: "Inviter les analystes comme utilisateurs invités dans le locataire Contoso et leur attribuer le rôle Contributor sur la ressource Defender EASM" }
    - id: c
      text: { en: "Invite the analysts as guest users in the Contoso tenant and assign them the Reader role on the Defender EASM resource", fr: "Inviter les analystes comme utilisateurs invités dans le locataire Contoso et leur attribuer le rôle Reader sur la ressource Defender EASM" }
    - id: d
      text: { en: "Assign the analysts the Security Reader role in the Microsoft Entra tenant of the MSSP", fr: "Attribuer aux analystes le rôle Security Reader dans le locataire Microsoft Entra du MSSP" }
answer:
  optionId: c
explanation:
  correct:
    en: Defender EASM doesn't support cross-tenant access, including through Azure Lighthouse, so users must authenticate directly to the tenant where the resource lives. Guest accounts in the Contoso tenant meet that condition, and the Reader role lets them view the data without creating, deleting or editing resources or assets.
    fr: Defender EASM ne prend pas en charge l'accès entre locataires, y compris via Azure Lighthouse ; les utilisateurs doivent donc s'authentifier directement auprès du locataire où se trouve la ressource. Des comptes invités dans le locataire Contoso remplissent cette condition, et le rôle Reader leur permet de consulter les données sans créer, supprimer ni modifier de ressources.
  options:
    a:
      en: Cross-tenant access through Azure Lighthouse isn't supported by Defender EASM.
      fr: L'accès entre locataires via Azure Lighthouse n'est pas pris en charge par Defender EASM.
    b:
      en: Contributor can create, delete and edit Defender EASM resources and inventory assets, which the requirements forbid.
      fr: Contributor peut créer, supprimer et modifier des ressources Defender EASM et des ressources d'inventaire, ce que les exigences interdisent.
    d:
      en: A role in the MSSP tenant grants no access to a resource in the Contoso subscription.
      fr: Un rôle dans le locataire du MSSP n'accorde aucun accès à une ressource de l'abonnement Contoso.
references:
  - title: Defender EASM Overview
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview
