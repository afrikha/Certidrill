id: sc100-cs2c-archive-access
objective: "3.4.4"
type: single
caseStudy: sc100-cs2c-southridge-video
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution to replace the VPN for access to the archive datacenter. The solution must meet the access requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour remplacer le VPN d'accès au centre de données des archives. La solution doit répondre aux exigences d'accès.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra application proxy with a connector that publishes the file servers and the media asset manager", fr: "Le proxy d'application Microsoft Entra avec un connecteur qui publie les serveurs de fichiers et le gestionnaire de ressources multimédias" } }
    - { id: b, text: { en: "Microsoft Entra Internet Access with a filtering profile that is linked to a Conditional Access policy", fr: "Microsoft Entra Internet Access avec un profil de filtrage lié à une stratégie d'accès conditionnel" } }
    - { id: c, text: { en: "An Azure VPN Gateway point-to-site configuration that uses Microsoft Entra authentication", fr: "Une configuration point à site Azure VPN Gateway qui utilise l'authentification Microsoft Entra" } }
    - { id: d, text: { en: "Microsoft Entra Private Access apps for the file shares and the media asset manager, with a private network connector", fr: "Des applications Microsoft Entra Private Access pour les partages de fichiers et le gestionnaire de ressources multimédias, avec un connecteur de réseau privé" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft Entra Private Access is designed to replace a VPN: you define the FQDNs and IP addresses of the internal resources as Global Secure Access apps, each app is an enterprise application that Conditional Access policies protect, and a private network connector in the datacenter brokers the connections. Users reach only the published resources, not the network, and the Global Secure Access client tunnels the traffic for SMB as well as web access.
    fr: |
      Microsoft Entra Private Access est conçu pour remplacer un VPN : vous définissez les FQDN et les adresses IP des ressources internes comme applications Accès global sécurisé, chaque application est une application d'entreprise protégée par des stratégies d'accès conditionnel, et un connecteur de réseau privé dans le centre de données relaie les connexions. Les utilisateurs n'atteignent que les ressources publiées, pas le réseau, et le client Accès global sécurisé fait transiter le trafic SMB comme l'accès web.
  options:
    a:
      en: Application proxy publishes web applications over HTTP and HTTPS; it can't publish SMB file shares.
      fr: Le proxy d'application publie des applications web en HTTP et HTTPS ; il ne peut pas publier des partages de fichiers SMB.
    b:
      en: Internet Access is a secure web gateway for internet and SaaS traffic; it doesn't give access to private resources in the datacenter.
      fr: Internet Access est une passerelle web sécurisée pour le trafic Internet et SaaS ; il ne donne pas accès aux ressources privées du centre de données.
    c:
      en: A point-to-site VPN still gives network-level access to the address spaces it routes, instead of access to specific applications.
      fr: Un VPN point à site donne encore un accès au niveau du réseau aux espaces d'adressage qu'il route, au lieu d'un accès à des applications précises.
references:
  - title: Learn about Microsoft Entra Private Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access
