id: sc100-3a-arc-private-link
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is connecting 1,200 on-premises servers to Azure Arc. The datacenter is connected to an Azure virtual network by ExpressRoute private peering. The network policy allows outbound internet access only to the Microsoft Entra ID and Azure Resource Manager endpoints.

    You need to recommend a solution that lets the Connected Machine agent communicate with the Azure Arc services over private IP addresses.

    What should you recommend?
  fr: |
    Woodgrove Bank connecte 1 200 serveurs locaux à Azure Arc. Le centre de données est connecté à un réseau virtuel Azure par le peering privé ExpressRoute. La stratégie réseau n'autorise l'accès Internet sortant que vers les points de terminaison Microsoft Entra ID et Azure Resource Manager.

    Vous devez recommander une solution qui permet à l'agent Connected Machine de communiquer avec les services Azure Arc via des adresses IP privées.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "An outbound proxy server in the perimeter network of the datacenter", fr: "Un serveur proxy sortant dans le réseau de périmètre du centre de données" }
    - id: b
      text: { en: "An Azure Arc private link scope with a private endpoint in the virtual network", fr: "Une étendue de liaison privée Azure Arc avec un point de terminaison privé dans le réseau virtuel" }
    - id: c
      text: { en: "An Azure Firewall instance in the virtual network that allows the Azure Arc FQDNs", fr: "Une instance de Pare-feu Azure dans le réseau virtuel qui autorise les noms de domaine complets d'Azure Arc" }
    - id: d
      text: { en: "An Azure Lighthouse delegation of the subscription that contains the Arc resources", fr: "Une délégation Azure Lighthouse de l'abonnement qui contient les ressources Arc" }
answer:
  optionId: b
explanation:
  correct:
    en: An Azure Arc private link scope connects private endpoints, and the virtual networks that contain them, to Arc-enabled servers, so the agent reaches the Arc services over private IPs through ExpressRoute or a site-to-site VPN. Traffic to Microsoft Entra ID and Azure Resource Manager still uses their public endpoints unless a resource management private link is configured, which the network policy allows.
    fr: Une étendue de liaison privée Azure Arc relie des points de terminaison privés, et les réseaux virtuels qui les contiennent, aux serveurs compatibles Arc ; l'agent atteint ainsi les services Arc via des adresses IP privées par ExpressRoute ou un VPN site à site. Le trafic vers Microsoft Entra ID et Azure Resource Manager utilise toujours leurs points de terminaison publics, sauf si une liaison privée de gestion des ressources est configurée, ce que la stratégie réseau autorise.
  options:
    a:
      en: A proxy forwards the agent traffic to the public endpoints of Azure Arc, which isn't private IP communication and isn't allowed by the network policy.
      fr: Un proxy transfère le trafic de l'agent vers les points de terminaison publics d'Azure Arc, ce qui n'est pas une communication par IP privées et n'est pas autorisé par la stratégie réseau.
    c:
      en: Azure Firewall can filter traffic by FQDN, but the agent would still reach the public endpoints of Azure Arc.
      fr: Le Pare-feu Azure peut filtrer le trafic par nom de domaine complet, mais l'agent atteindrait toujours les points de terminaison publics d'Azure Arc.
    d:
      en: Azure Lighthouse delegates management access across tenants; it doesn't change the network path of the agent.
      fr: Azure Lighthouse délègue l'accès de gestion entre locataires ; il ne modifie pas le chemin réseau de l'agent.
references:
  - title: Use Azure Private Link to connect servers to Azure Arc by using a private endpoint
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/private-link-security
