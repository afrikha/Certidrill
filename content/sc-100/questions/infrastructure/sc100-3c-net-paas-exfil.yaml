id: sc100-3c-net-paas-exfil
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso is reviewing a network design for a data platform. Virtual machines in a spoke virtual network write to an Azure Storage account named stcontosodata. The design uses a service endpoint for Microsoft.Storage on the VM subnet and a storage firewall rule that allows that subnet.

    The security architects add two requirements:

    - The VMs must not be able to copy data to storage accounts that belong to other Microsoft Entra tenants.
    - Analysts on the on-premises network must reach stcontosodata over the ExpressRoute private peering, never over the internet.

    What should you recommend?
  fr: |
    Contoso examine la conception réseau d'une plateforme de données. Des machines virtuelles d'un réseau virtuel spoke écrivent dans un compte Stockage Azure nommé stcontosodata. La conception utilise un point de terminaison de service pour Microsoft.Storage sur le sous-réseau des machines virtuelles et une règle de pare-feu de stockage qui autorise ce sous-réseau.

    Les architectes de sécurité ajoutent deux exigences :

    - Les machines virtuelles ne doivent pas pouvoir copier des données vers des comptes de stockage appartenant à d'autres locataires Microsoft Entra.
    - Les analystes du réseau local doivent atteindre stcontosodata par le peering privé ExpressRoute, jamais par Internet.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep the service endpoint and add the on-premises public IP ranges to the storage firewall", fr: "Conserver le point de terminaison de service et ajouter les plages d'adresses IP publiques locales au pare-feu de stockage" } }
    - { id: b, text: { en: "Add an NSG outbound rule on the VM subnet that allows only the Storage service tag", fr: "Ajouter au sous-réseau des machines virtuelles une règle NSG sortante qui n'autorise que l'étiquette de service Storage" } }
    - { id: c, text: { en: "Route the VM subnet to Azure Firewall with a network rule that allows the Storage service tag", fr: "Router le sous-réseau des machines virtuelles vers le Pare-feu Azure avec une règle de réseau qui autorise l'étiquette de service Storage" } }
    - { id: d, text: { en: "Use a private endpoint for stcontosodata, disable its public network access and block outbound internet from the VM subnet", fr: "Utiliser un point de terminaison privé pour stcontosodata, désactiver son accès au réseau public et bloquer l'accès Internet sortant du sous-réseau des machines virtuelles" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A private endpoint maps one specific storage account to a private IP address, so the VMs reach only that account privately, and with outbound internet blocked they can't reach other tenants' accounts. The private IP is reachable from on-premises over ExpressRoute private peering, and disabling public network access closes the internet path.
    fr: |-
      Un point de terminaison privé associe un compte de stockage précis à une adresse IP privée : les machines virtuelles n'atteignent que ce compte en privé et, avec l'accès Internet sortant bloqué, elles ne peuvent pas atteindre les comptes d'autres locataires. L'adresse IP privée est joignable depuis le réseau local par le peering privé ExpressRoute, et la désactivation de l'accès au réseau public ferme le chemin Internet.
  options:
    a:
      en: |-
        A service endpoint doesn't restrict which storage account the VMs reach, and on-premises users would still use the public endpoint.
      fr: |-
        Un point de terminaison de service ne restreint pas le compte de stockage atteint par les machines virtuelles, et les utilisateurs locaux utiliseraient encore le point de terminaison public.
    b:
      en: |-
        The Storage service tag covers every storage account in Azure, including those of other tenants.
      fr: |-
        L'étiquette de service Storage couvre tous les comptes de stockage d'Azure, y compris ceux d'autres locataires.
    c:
      en: |-
        A network rule on the Storage service tag also allows any storage account, and it does nothing for on-premises access.
      fr: |-
        Une règle de réseau sur l'étiquette de service Storage autorise elle aussi n'importe quel compte de stockage, et elle n'apporte rien pour l'accès local.
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
