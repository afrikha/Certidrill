id: sc100-cs1c-signing-exposure
objective: "3.1.7"
type: single
caseStudy: sc100-cs1c-wingtip
difficulty: 1
status: draft
stem:
  en: |-
    The Defender CSPM plan is enabled on Sub-Games. You need to recommend a solution that meets the exposure management requirements. What should you recommend?
  fr: |-
    Le plan Defender CSPM est activé sur Sub-Games. Vous devez recommander une solution qui respecte les exigences relatives à la gestion de l'exposition. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Run a Defender EASM discovery of the internet-facing assets of Wingtip and review the insights", fr: "Lancer une découverte Defender EASM des ressources exposées à internet de Wingtip et examiner les insights" } }
    - { id: b, text: { en: "Review the Microsoft Secure Score improvement actions for devices and identities", fr: "Examiner les actions d'amélioration du Niveau de sécurité Microsoft pour les appareils et les identités" } }
    - { id: c, text: { en: "Review the attack paths that lead to kv-signing and their choke points in Security Exposure Management", fr: "Examiner les chemins d'attaque qui mènent à kv-signing et leurs points d'étranglement dans Security Exposure Management" } }
    - { id: d, text: { en: "Assign the Microsoft cloud security benchmark to Sub-Games and review the failed controls", fr: "Attribuer le Microsoft Cloud Security Benchmark à Sub-Games et examiner les contrôles en échec" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Security Exposure Management builds an exposure graph from devices, identities and cloud resources and generates attack paths, including hybrid paths, that show how an attacker could reach a target such as kv-signing. Choke points are the nodes through which many attack paths flow, so remediating them first removes the largest number of paths.
    fr: |-
      Security Exposure Management construit un graphe d'exposition à partir des appareils, des identités et des ressources cloud, et génère des chemins d'attaque, y compris hybrides, qui montrent comment un attaquant pourrait atteindre une cible comme kv-signing. Les points d'étranglement sont les nœuds par lesquels passent de nombreux chemins d'attaque : les corriger en premier supprime le plus grand nombre de chemins.
  options:
    a:
      en: |-
        Defender EASM discovers the assets exposed on the internet from an outside-in view; it doesn't model the internal chains of weaknesses that lead to kv-signing.
      fr: |-
        Defender EASM découvre les ressources exposées sur internet avec une vue de l'extérieur ; il ne modélise pas les enchaînements internes de faiblesses qui mènent à kv-signing.
    b:
      en: |-
        Improvement actions are scored one by one; they don't show how weaknesses combine into a path to a target.
      fr: |-
        Les actions d'amélioration sont notées une par une ; elles ne montrent pas comment les faiblesses se combinent en un chemin vers une cible.
    d:
      en: |-
        The benchmark is already applied by default, and its controls list individual misconfigurations without linking them into attack paths.
      fr: |-
        Le benchmark est déjà appliqué par défaut, et ses contrôles listent des erreurs de configuration individuelles sans les relier en chemins d'attaque.
references:
  - title: What is Microsoft Security Exposure Management?
    url: https://learn.microsoft.com/en-us/security-exposure-management/microsoft-security-exposure-management
