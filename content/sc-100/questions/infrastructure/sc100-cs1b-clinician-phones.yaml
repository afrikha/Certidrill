id: sc100-cs1b-clinician-phones
objective: "3.2.2"
type: single
caseStudy: sc100-cs1b-lamna
difficulty: 1
status: draft
stem:
  en: |-
    You need to recommend a solution for the clinicians' phones that meets the mobile requirements. What should you recommend?
  fr: |-
    Vous devez recommander une solution pour les téléphones des soignants qui respecte les exigences relatives aux appareils mobiles. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Intune device compliance policies, and a Conditional Access policy that requires a compliant device", fr: "Des stratégies de conformité des appareils Intune, et une stratégie d'accès conditionnel qui exige un appareil conforme" } }
    - { id: b, text: { en: "Intune app protection policies for Outlook and Teams, and a Conditional Access policy that requires an app protection policy", fr: "Des stratégies de protection des applications Intune pour Outlook et Teams, et une stratégie d'accès conditionnel qui exige une stratégie de protection des applications" } }
    - { id: c, text: { en: "Microsoft Defender for Cloud Apps session policies that use Conditional Access app control for Outlook and Teams", fr: "Des stratégies de session Microsoft Defender for Cloud Apps qui utilisent le contrôle d'application par accès conditionnel pour Outlook et Teams" } }
    - { id: d, text: { en: "Intune user enrollment for iOS and Android Enterprise personally owned work profile for Android", fr: "L'inscription des utilisateurs Intune pour iOS et le profil professionnel Android Enterprise pour les appareils personnels Android" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      App protection policies apply to devices that aren't enrolled in any MDM solution and protect organization data only in a work context: they can block copy and paste into personal apps, and a selective wipe removes the organization data from the app without touching personal data. Conditional Access ensures that the apps can connect only when the app protection policy applies.
    fr: |-
      Les stratégies de protection des applications s'appliquent aux appareils qui ne sont inscrits dans aucune solution MDM et ne protègent les données de l'organisation que dans un contexte professionnel : elles peuvent bloquer le copier-coller vers des applications personnelles, et une réinitialisation sélective supprime les données de l'organisation de l'application sans toucher aux données personnelles. L'accès conditionnel garantit que les applications ne peuvent se connecter que lorsque la stratégie de protection des applications s'applique.
  options:
    a:
      en: |-
        Device compliance is evaluated only for devices enrolled in Intune, and the phones must remain unenrolled.
      fr: |-
        La conformité des appareils n'est évaluée que pour les appareils inscrits dans Intune, et les téléphones doivent rester non inscrits.
    c:
      en: |-
        Session policies control browser sessions; they don't protect the data inside the Outlook and Teams mobile apps or wipe it.
      fr: |-
        Les stratégies de session contrôlent les sessions de navigateur ; elles ne protègent pas les données dans les applications mobiles Outlook et Teams et ne permettent pas de les effacer.
    d:
      en: |-
        Both options enroll the phones in Intune, which the requirements forbid.
      fr: |-
        Les deux options inscrivent les téléphones dans Intune, ce que les exigences interdisent.
references:
  - title: App protection policies overview
    url: https://learn.microsoft.com/en-us/intune/intune-service/apps/app-protection-policy
