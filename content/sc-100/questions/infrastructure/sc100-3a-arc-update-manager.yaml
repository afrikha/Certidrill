id: sc100-3a-arc-update-manager
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Azure Update Manager to assess and install operating system updates on its Azure VMs. Contoso also has 250 Windows Server and Linux servers in an on-premises datacenter that are patched manually.

    You need to recommend a solution that assesses and deploys security updates on the on-premises servers from the same Azure solution as the Azure VMs, with permissions controlled by Azure RBAC.

    The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Contoso, Ltd. utilise Azure Update Manager pour évaluer et installer les mises à jour du système d'exploitation sur ses machines virtuelles Azure. Contoso dispose aussi de 250 serveurs Windows Server et Linux dans un centre de données local, mis à jour manuellement.

    Vous devez recommander une solution qui évalue et déploie les mises à jour de sécurité sur les serveurs locaux depuis la même solution Azure que les machines virtuelles Azure, avec des autorisations contrôlées par Azure RBAC.

    La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Deploy a Windows Server Update Services (WSUS) server in the datacenter for the on-premises servers", fr: "Déployer un serveur Windows Server Update Services (WSUS) dans le centre de données pour les serveurs locaux" }
    - id: b
      text: { en: "Onboard the servers to Defender for Endpoint and use the Defender Vulnerability Management inventory", fr: "Intégrer les serveurs à Defender for Endpoint et utiliser l'inventaire de Gestion des vulnérabilités Microsoft Defender" }
    - id: c
      text: { en: "Install the Azure Monitor Agent on the servers and collect the update logs in Log Analytics", fr: "Installer l'agent Azure Monitor sur les serveurs et collecter les journaux de mise à jour dans Log Analytics" }
    - id: d
      text: { en: "Connect the servers to Azure Arc and manage their updates with Azure Update Manager", fr: "Connecter les serveurs à Azure Arc et gérer leurs mises à jour avec Azure Update Manager" }
answer:
  optionId: d
explanation:
  correct:
    en: Azure Arc-enabled servers can be managed by Azure Update Manager for operating system updates, like Azure VMs. Because the servers become Azure resources, Azure RBAC controls who can assess and deploy updates.
    fr: Les serveurs compatibles Azure Arc peuvent être gérés par Azure Update Manager pour les mises à jour du système d'exploitation, comme les machines virtuelles Azure. Comme les serveurs deviennent des ressources Azure, Azure RBAC contrôle qui peut évaluer et déployer les mises à jour.
  options:
    a:
      en: WSUS is a separate on-premises solution that doesn't use Azure RBAC and doesn't patch Linux servers.
      fr: WSUS est une solution locale distincte qui n'utilise pas Azure RBAC et ne met pas à jour les serveurs Linux.
    b:
      en: Defender Vulnerability Management identifies missing updates and vulnerabilities, but it doesn't deploy the updates from the Azure solution used for the Azure VMs.
      fr: Gestion des vulnérabilités Microsoft Defender identifie les mises à jour manquantes et les vulnérabilités, mais elle ne déploie pas les mises à jour depuis la solution Azure utilisée pour les machines virtuelles Azure.
    c:
      en: Collecting logs reports on update activity but doesn't assess or deploy updates.
      fr: Collecter des journaux rend compte de l'activité de mise à jour, mais n'évalue ni ne déploie de mises à jour.
references:
  - title: Azure Arc-enabled servers Overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
