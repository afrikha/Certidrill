id: sc100-sr2-swg-3
objective: "3.4.2"
type: series_yesno
series: sc100-sr2-web-filtering
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You recommend the Microsoft traffic forwarding profile with a filtering policy in the baseline profile.
  fr: |
    Vous recommandez le profil de transfert du trafic Microsoft avec une stratégie de filtrage dans le profil de base.
body:
  solution:
    en: |
      You recommend that you deploy the Global Secure Access client to all devices by using Intune, enable only the **Microsoft traffic** forwarding profile, and link a web content filtering policy that blocks the **Gambling** category to the **baseline profile**.
    fr: |
      Vous recommandez de déployer le client Global Secure Access sur tous les appareils à l'aide d'Intune, d'activer uniquement le profil de transfert du trafic **Microsoft traffic** et de lier une stratégie de filtrage du contenu web qui bloque la catégorie **Gambling** au **profil de base**.
answer: { value: false }
explanation:
  correct:
    en: |
      The Microsoft traffic profile forwards only the traffic of Microsoft services such as Exchange Online, SharePoint Online, and Microsoft Teams. Traffic to gambling websites never reaches Global Secure Access, so the baseline profile, which applies to Internet Access traffic, can't block it. The Internet Access traffic forwarding profile must be enabled.
    fr: |
      Le profil de trafic Microsoft ne transfère que le trafic des services Microsoft, comme Exchange Online, SharePoint Online et Microsoft Teams. Le trafic vers les sites de jeux d'argent n'atteint jamais Global Secure Access : le profil de base, qui s'applique au trafic d'accès Internet, ne peut donc pas le bloquer. Le profil de transfert du trafic d'accès Internet doit être activé.
references:
  - title: Global Secure Access traffic forwarding profiles
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-traffic-forwarding
  - title: How to configure Global Secure Access web content filtering
