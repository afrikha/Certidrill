id: sc100-3b-web-api-protection
objective: "3.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Logistics exposes REST APIs that run on Azure App Service to 300 partner companies. Each partner calls the APIs with an OAuth 2.0 access token issued by Microsoft Entra ID.

    You need to recommend a solution that meets the following requirements:

    - Tokens are validated and each partner's call rate is limited before requests reach the back-end APIs.
    - The security team receives alerts about suspicious API usage and sees which APIs expose sensitive data.

    Which two components should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Logistics expose à 300 entreprises partenaires des API REST qui s'exécutent sur Azure App Service. Chaque partenaire appelle les API avec un jeton d'accès OAuth 2.0 émis par Microsoft Entra ID.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les jetons sont validés et le débit d'appels de chaque partenaire est limité avant que les requêtes n'atteignent les API back-end.
    - L'équipe de sécurité reçoit des alertes sur les utilisations suspectes des API et voit quelles API exposent des données sensibles.

    Quels sont les deux composants à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Azure API Management with JWT validation and rate limit policies", fr: "Azure API Management avec des stratégies de validation JWT et de limitation du débit" } }
    - { id: b, text: { en: "Microsoft Defender for App Service", fr: "Microsoft Defender for App Service" } }
    - { id: c, text: { en: "Microsoft Defender for APIs", fr: "Microsoft Defender for APIs" } }
    - { id: d, text: { en: "Azure DDoS Network Protection", fr: "Protection réseau Azure DDoS" } }
    - { id: e, text: { en: "Azure Firewall Premium with intrusion detection and prevention", fr: "Pare-feu Azure Premium avec détection et prévention des intrusions" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      API Management sits in front of the back-end APIs and applies policies such as JWT validation and rate limiting per key before forwarding the requests. Defender for APIs protects the APIs published in API Management: it inventories them, flags those that handle sensitive data and raises alerts on suspicious usage.
    fr: |
      Azure API Management se place devant les API back-end et applique des stratégies comme la validation JWT et la limitation du débit par clé avant de transférer les requêtes. Defender for APIs protège les API publiées dans API Management : il les inventorie, signale celles qui traitent des données sensibles et génère des alertes sur les utilisations suspectes.
  options:
    b:
      en: |
        Defender for App Service detects threats against the App Service platform and apps; it doesn't validate tokens or classify the data exposed by each API.
      fr: |
        Defender for App Service détecte les menaces visant la plateforme App Service et les applications ; il ne valide pas les jetons et ne classe pas les données exposées par chaque API.
    d:
      en: |
        DDoS Network Protection mitigates volumetric attacks on public IP addresses; it doesn't validate tokens or limit calls per partner.
      fr: |
        La protection réseau DDoS atténue les attaques volumétriques sur les adresses IP publiques ; elle ne valide pas les jetons et ne limite pas les appels par partenaire.
    e:
      en: |
        Azure Firewall filters network traffic; it doesn't understand OAuth tokens or per-partner API quotas.
      fr: |
        Le Pare-feu Azure filtre le trafic réseau ; il ne comprend ni les jetons OAuth ni les quotas d'API par partenaire.
references:
  - title: About Microsoft Defender for APIs
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-apis-introduction
  - title: Azure API Management policy reference
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-policies
