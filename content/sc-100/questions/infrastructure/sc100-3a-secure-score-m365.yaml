id: sc100-3a-secure-score-m365
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft 365 E5. The security steering committee wants a single measurement of the security posture of Exchange Online, SharePoint Online, Microsoft Teams and Microsoft Entra ID. The measurement must list prioritized recommended actions, show the points that each action is worth, and track progress over time.

    What should you recommend?
  fr: |
    Proseware, Inc. utilise Microsoft 365 E5. Le comité de pilotage de la sécurité veut une mesure unique de la posture de sécurité d'Exchange Online, de SharePoint Online, de Microsoft Teams et de Microsoft Entra ID. La mesure doit lister des actions recommandées hiérarchisées, indiquer les points que vaut chaque action et suivre la progression dans le temps.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "The secure score of Microsoft Defender for Cloud", fr: "Le degré de sécurisation de Microsoft Defender for Cloud" }
    - id: b
      text: { en: "Microsoft Secure Score in the Microsoft Defender portal", fr: "Le Niveau de sécurité Microsoft dans le portail Microsoft Defender" }
    - id: c
      text: { en: "The compliance score of Microsoft Purview Compliance Manager", fr: "Le score de conformité du Gestionnaire de conformité Microsoft Purview" }
    - id: d
      text: { en: "The Advisor score of Azure Advisor", fr: "Le score Advisor d'Azure Advisor" }
answer:
  optionId: b
explanation:
  correct:
    en: Microsoft Secure Score measures the posture of Microsoft 365 workloads and identities, including Microsoft Entra ID, Exchange Online, SharePoint Online and Teams. Each recommended action is worth points, the actions are ranked, and the history and metrics views track progress over time.
    fr: Le Niveau de sécurité Microsoft mesure la posture des charges de travail et des identités Microsoft 365, notamment Microsoft Entra ID, Exchange Online, SharePoint Online et Teams. Chaque action recommandée vaut des points, les actions sont classées, et les vues d'historique et de métriques suivent la progression dans le temps.
  options:
    a:
      en: The Defender for Cloud secure score measures Azure, AWS and GCP resources against the cloud security benchmark, not Microsoft 365 workloads.
      fr: Le degré de sécurisation de Defender for Cloud mesure les ressources Azure, AWS et GCP selon le benchmark de sécurité cloud, pas les charges de travail Microsoft 365.
    c:
      en: The compliance score tracks progress on the improvement actions of regulatory assessments; it isn't the security posture measurement of the Microsoft 365 workloads.
      fr: Le score de conformité suit la progression des actions d'amélioration des évaluations réglementaires ; ce n'est pas la mesure de la posture de sécurité des charges de travail Microsoft 365.
    d:
      en: The Advisor score covers Azure resources across several pillars; it doesn't measure Exchange Online, SharePoint Online, Teams or Microsoft Entra ID.
      fr: Le score Advisor couvre des ressources Azure selon plusieurs piliers ; il ne mesure pas Exchange Online, SharePoint Online, Teams ni Microsoft Entra ID.
references:
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
