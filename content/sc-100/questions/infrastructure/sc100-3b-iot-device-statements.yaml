id: sc100-3b-iot-device-statements
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Devices is writing the security requirements for a new line of embedded smart meters that will connect to Azure IoT Hub through the Device Provisioning Service (DPS).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Devices rédige les exigences de sécurité d'une nouvelle gamme de compteurs intelligents embarqués qui se connecteront à Azure IoT Hub par le service Device Provisioning Service (DPS).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A hardware security module is the most secure place on the device to store its X.509 private key or its symmetric key.
        fr: Un module de sécurité matériel est l'emplacement le plus sûr sur l'appareil pour stocker sa clé privée X.509 ou sa clé symétrique.
    - id: s2
      text:
        en: An X.509 enrollment group in DPS lets you provision many meters whose certificates chain to the same CA without creating an enrollment per meter.
        fr: Un groupe d'inscription X.509 dans DPS permet de provisionner de nombreux compteurs dont les certificats se rattachent à la même autorité de certification sans créer une inscription par compteur.
    - id: s3
      text:
        en: Giving all the meters of a production batch the same symmetric key gives each meter a unique identity in IoT Hub.
        fr: Attribuer la même clé symétrique à tous les compteurs d'un lot de production donne à chaque compteur une identité unique dans IoT Hub.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Microsoft strongly recommends hardware security modules as the most secure storage for device secrets, for both X.509 certificates and symmetric keys. An enrollment group covers all the devices that share an attestation mechanism, such as certificates signed by the same CA, which suits large fleets with the same initial configuration. A key shared by many devices doesn't identify any single device: one compromised meter exposes the whole batch.
    fr: |
      Microsoft recommande vivement les modules de sécurité matériels comme stockage le plus sûr des secrets d'appareil, pour les certificats X.509 comme pour les clés symétriques. Un groupe d'inscription couvre tous les appareils qui partagent un mécanisme d'attestation, comme des certificats signés par la même autorité de certification, ce qui convient aux grands parcs ayant la même configuration initiale. Une clé partagée par de nombreux appareils n'identifie aucun appareil en particulier : un compteur compromis expose tout le lot.
references:
  - title: IoT Hub Device Provisioning Service terminology
    url: https://learn.microsoft.com/en-us/azure/iot-dps/concepts-service
