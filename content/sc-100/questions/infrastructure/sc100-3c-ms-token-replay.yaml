id: sc100-3c-ms-token-replay
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has 8,000 users who work from offices, from home and while traveling. All corporate devices run the Global Secure Access client with the Microsoft traffic forwarding profile enabled.

    After an adversary-in-the-middle phishing campaign, the CISO wants stolen tokens to be useless when they are replayed from networks outside Woodgrove's control. Access to Microsoft 365 and the other Microsoft Entra-integrated apps must keep working wherever employees connect, and the security team doesn't want to maintain lists of egress IP addresses.

    What should you recommend?
  fr: |
    Woodgrove Bank compte 8 000 utilisateurs qui travaillent depuis les bureaux, depuis leur domicile et en déplacement. Tous les appareils de l'entreprise exécutent le client Global Secure Access avec le profil de transfert du trafic Microsoft activé.

    Après une campagne d'hameçonnage de type adversaire au milieu, le RSSI veut que les jetons volés soient inutilisables lorsqu'ils sont rejoués depuis des réseaux hors du contrôle de Woodgrove. L'accès à Microsoft 365 et aux autres applications intégrées à Microsoft Entra doit continuer de fonctionner où que se connectent les employés, et l'équipe de sécurité ne veut pas maintenir de listes d'adresses IP de sortie.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Conditional Access policy that blocks all resources from any location except All Compliant Network locations", fr: "Une stratégie d'accès conditionnel qui bloque toutes les ressources depuis tout emplacement sauf All Compliant Network locations" } }
    - { id: b, text: { en: "A Conditional Access policy that blocks all resources from any location except a named location with the office egress IP ranges", fr: "Une stratégie d'accès conditionnel qui bloque toutes les ressources depuis tout emplacement sauf un emplacement nommé contenant les plages d'adresses IP de sortie des bureaux" } }
    - { id: c, text: { en: "Universal tenant restrictions with a tenant restrictions v2 policy that allows only the Woodgrove tenant", fr: "Les restrictions de locataire universelles avec une stratégie de restrictions de locataire v2 qui n'autorise que le locataire de Woodgrove" } }
    - { id: d, text: { en: "Source IP restoration, so that sign-in logs show the original public IP address of each user", fr: "La restauration de l'adresse IP source, pour que les journaux de connexion affichent l'adresse IP publique d'origine de chaque utilisateur" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The compliant network check lets Conditional Access require that requests come through Woodgrove's own Global Secure Access tenant, wherever the user is, without IP lists. A refresh token replayed from an attacker's network is refused at sign-in, and apps that support continuous access evaluation, such as Microsoft Graph, also reject replayed access tokens.
    fr: |-
      La vérification du réseau conforme permet à l'accès conditionnel d'exiger que les requêtes passent par le locataire Global Secure Access de Woodgrove, où que soit l'utilisateur, sans liste d'adresses IP. Un jeton d'actualisation rejoué depuis le réseau d'un attaquant est refusé à la connexion, et les applications qui prennent en charge l'évaluation continue de l'accès, comme Microsoft Graph, rejettent aussi les jetons d'accès rejoués.
  options:
    b:
      en: |-
        IP-based named locations require maintaining egress ranges and would block employees who work from home or while traveling.
      fr: |-
        Les emplacements nommés fondés sur les adresses IP exigent de maintenir des plages de sortie et bloqueraient les employés à domicile ou en déplacement.
    c:
      en: |-
        Tenant restrictions stop users from signing in to other tenants; they don't stop an attacker from replaying a Woodgrove token.
      fr: |-
        Les restrictions de locataire empêchent les utilisateurs de se connecter à d'autres locataires ; elles n'empêchent pas un attaquant de rejouer un jeton de Woodgrove.
    d:
      en: |-
        Source IP restoration improves logs and risk detections, but it doesn't require traffic to come through Global Secure Access.
      fr: |-
        La restauration de l'adresse IP source améliore les journaux et les détections de risque, mais elle n'exige pas que le trafic passe par Global Secure Access.
references:
  - title: Enable compliant network check with Conditional Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-compliant-network
