id: sc100-cs3a-privileged-pods
objective: "3.3.5"
type: single
caseStudy: sc100-cs3a-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that meets the Kubernetes requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui respecte les exigences relatives à Kubernetes.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Kubernetes data plane hardening with Azure Policy for Kubernetes set to deny the requests", fr: "Le renforcement du plan de données Kubernetes avec Azure Policy pour Kubernetes configuré pour refuser les requêtes" } }
    - { id: b, text: { en: "Gated deployment rules that block images that don't meet the vulnerability policy", fr: "Des règles de déploiement contrôlé qui bloquent les images non conformes à la stratégie de vulnérabilités" } }
    - { id: c, text: { en: "Run-time threat detection alerts from the Defender sensor of Defender for Containers", fr: "Les alertes de détection des menaces à l'exécution du capteur Defender de Defender for Containers" } }
    - { id: d, text: { en: "Binary drift blocking in the run-time protection of Defender for Containers", fr: "Le blocage de la dérive binaire dans la protection à l'exécution de Defender for Containers" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Kubernetes data plane hardening uses Azure Policy for Kubernetes to evaluate each request to the Kubernetes API server before it's persisted. When the policy is enforced, requests to create privileged containers are blocked.
    fr: |-
      Le renforcement du plan de données Kubernetes utilise Azure Policy pour Kubernetes pour évaluer chaque requête adressée au serveur d'API Kubernetes avant qu'elle ne soit persistée. Quand la stratégie est appliquée, les requêtes de création de conteneurs privilégiés sont bloquées.
  options:
    d:
      en: |-
        Binary drift blocking stops unauthorized external processes inside running containers. It doesn't evaluate requests to create privileged containers.
      fr: |-
        Le blocage de la dérive binaire arrête les processus externes non autorisés dans les conteneurs en cours d'exécution. Il n'évalue pas les requêtes de création de conteneurs privilégiés.
    b:
      en: |-
        Gated deployment blocks images based on their vulnerability findings, not on the privileges requested by the pod specification.
      fr: |-
        Le déploiement contrôlé bloque des images en fonction de leurs vulnérabilités, pas en fonction des privilèges demandés par la spécification du pod.
    c:
      en: |-
        Run-time threat detection raises alerts about suspicious activity. It detects, but doesn't block the creation of privileged containers.
      fr: |-
        La détection des menaces à l'exécution génère des alertes sur les activités suspectes. Elle détecte, mais ne bloque pas la création de conteneurs privilégiés.
references:
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
