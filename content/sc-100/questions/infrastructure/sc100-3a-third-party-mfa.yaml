id: sc100-3a-third-party-mfa
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys federates its Microsoft Entra tenant with a non-Microsoft identity provider that enforces multifactor authentication (MFA) for every user, including administrators. In Microsoft Secure Score, the recommended action to require MFA for administrative roles shows the status **To address**.

    You need Microsoft Secure Score to reflect the real posture of the tenant. The authentication solution must not change.

    What should you recommend?
  fr: |
    Wingtip Toys fédère son locataire Microsoft Entra avec un fournisseur d'identité non Microsoft qui impose l'authentification multifacteur (MFA) à tous les utilisateurs, administrateurs compris. Dans le Niveau de sécurité Microsoft, l'action recommandée qui exige la MFA pour les rôles d'administration présente l'état **To address**.

    Le Niveau de sécurité Microsoft doit refléter la posture réelle du locataire. La solution d'authentification ne doit pas changer.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Set the status of the action to Risk accepted", fr: "Définir l'état de l'action sur Risk accepted" }
    - id: b
      text: { en: "Set the status of the action to Planned", fr: "Définir l'état de l'action sur Planned" }
    - id: c
      text: { en: "Turn on security defaults in the tenant", fr: "Activer les paramètres de sécurité par défaut dans le locataire" }
    - id: d
      text: { en: "Set the status of the action to Resolved through third party", fr: "Définir l'état de l'action sur Resolved through third party" }
answer:
  optionId: d
explanation:
  correct:
    en: When a non-Microsoft solution already covers a recommended action, you mark it as resolved through third party and the score gains the points the action is worth. Microsoft can't verify the implementation, so the status should be reviewed if the external solution stops covering the control.
    fr: Quand une solution non Microsoft couvre déjà une action recommandée, vous la marquez comme résolue par un tiers et le score gagne les points que vaut l'action. Microsoft ne peut pas vérifier la mise en œuvre ; l'état doit donc être revu si la solution externe cesse de couvrir le contrôle.
  options:
    a:
      en: Risk accepted awards no points, so the score would still understate a control that is in place.
      fr: L'état Risk accepted n'accorde aucun point ; le score sous-estimerait toujours un contrôle pourtant en place.
    b:
      en: Planned is for actions that you intend to complete; it doesn't add the points of a control already implemented.
      fr: L'état Planned concerne les actions que vous prévoyez de réaliser ; il n'ajoute pas les points d'un contrôle déjà mis en œuvre.
    c:
      en: Security defaults would change how users authenticate with Microsoft Entra ID, which the requirements forbid.
      fr: Les paramètres de sécurité par défaut modifieraient la façon dont les utilisateurs s'authentifient auprès de Microsoft Entra ID, ce que les exigences interdisent.
references:
  - title: Assess your security posture through Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-improvement-actions
