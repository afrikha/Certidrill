id: sc100-3b-svc-baseline-entries
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Health is adopting Azure Key Vault, Azure SQL Database and Azure Kubernetes Service. The architecture team uses the Azure security baseline of each service to write the security requirements that the project teams must implement.

    Which baseline entries should the team turn into requirements for the project teams?
  fr: |
    Northwind Health adopte Azure Key Vault, Azure SQL Database et Azure Kubernetes Service. L'équipe d'architecture utilise la base de référence de sécurité Azure de chaque service pour rédiger les exigences de sécurité que les équipes projet doivent mettre en œuvre.

    Quelles entrées des bases de référence l'équipe doit-elle transformer en exigences pour les équipes projet ?
body:
  options:
    - { id: a, text: { en: "Only the entries that include a Microsoft Defender for Cloud monitoring note", fr: "Uniquement les entrées qui comportent une note de surveillance Microsoft Defender for Cloud" } }
    - { id: b, text: { en: "Only the entries whose Enabled by Default value is True", fr: "Uniquement les entrées dont la valeur Enabled by Default est True" } }
    - { id: c, text: { en: "The supported features whose configuration responsibility is Customer or Shared", fr: "Les fonctionnalités prises en charge dont la responsabilité de configuration est Customer ou Shared" } }
    - { id: d, text: { en: "The features whose Supported value is False, so that the teams build compensating controls", fr: "Les fonctionnalités dont la valeur Supported est False, afin que les équipes créent des contrôles compensatoires" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each entry of an Azure security baseline maps an MCSB control to a feature, and states whether the feature is supported, whether it is enabled by default and who is responsible for configuring it: Customer, Microsoft or Shared. The supported features with Customer or Shared responsibility are the configurations that the project teams must implement.
    fr: |
      Chaque entrée d'une base de référence de sécurité Azure associe un contrôle MCSB à une fonctionnalité, et indique si la fonctionnalité est prise en charge, si elle est activée par défaut et qui est responsable de sa configuration : Customer, Microsoft ou Shared. Les fonctionnalités prises en charge dont la responsabilité est Customer ou Shared sont les configurations que les équipes projet doivent mettre en œuvre.
  options:
    a:
      en: |
        The monitoring note is omitted when Defender for Cloud doesn't monitor a feature, but the customer may still have to configure it.
      fr: |
        La note de surveillance est omise quand Defender for Cloud ne surveille pas une fonctionnalité, mais le client peut quand même devoir la configurer.
    b:
      en: |
        A feature enabled by default may need no action, while a feature that isn't enabled by default is exactly one the customer must implement.
      fr: |
        Une fonctionnalité activée par défaut peut ne nécessiter aucune action, alors qu'une fonctionnalité non activée par défaut est justement à mettre en œuvre par le client.
    d:
      en: |
        A feature that isn't supported can't be used to secure the service, so it can't become a configuration requirement.
      fr: |
        Une fonctionnalité non prise en charge ne peut pas servir à sécuriser le service ; elle ne peut donc pas devenir une exigence de configuration.
references:
  - title: Security baselines for Azure overview
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/security-baselines-overview
