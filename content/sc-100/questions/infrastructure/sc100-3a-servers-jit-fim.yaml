id: sc100-3a-servers-jit-fim
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. runs 80 Windows Server VMs in Azure. The security requirements state that management ports must be opened only on approved request for a limited time, and that changes to critical operating system files and registry keys must be detected.

    The solution must minimize cost.

    What should you recommend?
  fr: |
    Contoso, Ltd. exécute 80 machines virtuelles Windows Server dans Azure. Les exigences de sécurité stipulent que les ports de gestion ne doivent être ouverts que sur demande approuvée et pour une durée limitée, et que les modifications des fichiers critiques du système d'exploitation et des clés de Registre doivent être détectées.

    La solution doit réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Defender for Servers Plan 1
    - id: b
      text: Defender for Servers Plan 2
    - id: c
      text: Defender CSPM
    - id: d
      text: { en: "Microsoft Defender for Endpoint Plan 2 licenses", fr: "Licences Microsoft Defender for Endpoint Plan 2" }
answer:
  optionId: b
explanation:
  correct:
    en: Just-in-time VM access and file integrity monitoring are Defender for Servers Plan 2 features. Plan 1 is cheaper but provides mainly the Defender for Endpoint integration and agent-based vulnerability assessment.
    fr: L'accès juste-à-temps aux machines virtuelles et la surveillance de l'intégrité des fichiers sont des fonctionnalités de Defender for Servers Plan 2. Le Plan 1 coûte moins cher mais fournit principalement l'intégration de Defender for Endpoint et l'évaluation des vulnérabilités avec agent.
  options:
    a:
      en: Plan 1 doesn't include just-in-time VM access or file integrity monitoring.
      fr: Le Plan 1 n'inclut ni l'accès juste-à-temps aux machines virtuelles ni la surveillance de l'intégrité des fichiers.
    c:
      en: Defender CSPM is a posture plan; it doesn't provide just-in-time VM access or file integrity monitoring.
      fr: Defender CSPM est un plan de posture ; il ne fournit ni l'accès juste-à-temps aux machines virtuelles ni la surveillance de l'intégrité des fichiers.
    d:
      en: Defender for Endpoint provides EDR on the servers, but just-in-time VM access and file integrity monitoring are Defender for Cloud features of Defender for Servers Plan 2.
      fr: Defender for Endpoint fournit l'EDR sur les serveurs, mais l'accès juste-à-temps aux machines virtuelles et la surveillance de l'intégrité des fichiers sont des fonctionnalités de Defender for Cloud incluses dans Defender for Servers Plan 2.
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
