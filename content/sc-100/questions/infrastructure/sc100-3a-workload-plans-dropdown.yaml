id: sc100-3a-workload-plans-dropdown
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. connected its AWS accounts to Microsoft Defender for Cloud. You need to select workload protection plans for three groups of resources. Each group must get only the plan that meets its requirement, and the solution must minimize cost.

    Which plan should you recommend for each group? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. a connecté ses comptes AWS à Microsoft Defender for Cloud. Vous devez sélectionner des plans de protection des charges de travail pour trois groupes de ressources. Chaque groupe ne doit recevoir que le plan qui répond à son exigence, et la solution doit réduire les coûts au minimum.

    Quel plan devez-vous recommander pour chaque groupe ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure VMs that need endpoint detection and response (EDR) only: [[edr]]

      EC2 instances that need just-in-time VM access and agentless malware scanning: [[ec2]]

      Amazon EKS clusters that need runtime threat detection: [[eks]]
    fr: |
      Machines virtuelles Azure qui n'ont besoin que de la détection et réponse des points de terminaison (EDR) : [[edr]]

      Instances EC2 qui ont besoin de l'accès juste-à-temps aux machines virtuelles et de l'analyse sans agent des logiciels malveillants : [[ec2]]

      Clusters Amazon EKS qui ont besoin de la détection des menaces à l'exécution : [[eks]]
  slots:
    - id: edr
      options:
        - { id: p1, text: Defender for Servers Plan 1 }
        - { id: p2, text: Defender for Servers Plan 2 }
        - { id: containers, text: Defender for Containers }
        - { id: cspm, text: Defender CSPM }
    - id: ec2
      options:
        - { id: p1, text: Defender for Servers Plan 1 }
        - { id: p2, text: Defender for Servers Plan 2 }
        - { id: containers, text: Defender for Containers }
        - { id: cspm, text: Defender CSPM }
    - id: eks
      options:
        - { id: p1, text: Defender for Servers Plan 1 }
        - { id: p2, text: Defender for Servers Plan 2 }
        - { id: containers, text: Defender for Containers }
        - { id: cspm, text: Defender CSPM }
answer:
  values: { edr: p1, ec2: p2, eks: containers }
explanation:
  correct:
    en: Defender for Servers Plan 1 includes the Defender for Endpoint integration (EDR) and is the cheaper plan. Just-in-time VM access, available for Azure and AWS, and agentless malware scanning require Plan 2. Runtime threat protection of Kubernetes clusters, including EKS, is provided by Defender for Containers.
    fr: Defender for Servers Plan 1 inclut l'intégration de Defender for Endpoint (EDR) et c'est le plan le moins cher. L'accès juste-à-temps aux machines virtuelles, disponible pour Azure et AWS, et l'analyse sans agent des logiciels malveillants exigent le Plan 2. La protection contre les menaces à l'exécution des clusters Kubernetes, y compris EKS, est fournie par Defender for Containers.
  options:
    cspm:
      en: Defender CSPM provides posture capabilities such as agentless vulnerability scanning and attack paths; it doesn't provide EDR, just-in-time access or runtime threat detection.
      fr: Defender CSPM fournit des fonctionnalités de posture comme l'analyse sans agent des vulnérabilités et les chemins d'attaque ; il ne fournit ni EDR, ni accès juste-à-temps, ni détection des menaces à l'exécution.
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
