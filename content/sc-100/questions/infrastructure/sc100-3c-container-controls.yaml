id: sc100-3c-container-controls
objective: "3.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is writing the security requirements for the container images of a new application that will run on Azure Kubernetes Service (AKS). The images are built with ACR Tasks in Azure Container Registry.

    You need to recommend a control for each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders rédige les exigences de sécurité des images conteneur d'une nouvelle application qui s'exécutera sur Azure Kubernetes Service (AKS). Les images sont générées avec des tâches ACR dans Azure Container Registry.

    Vous devez recommander un contrôle pour chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      No database connection string is stored in the images: [[secrets]]

      Application images are rebuilt when their base image is patched: [[rebuild]]

      Crypto-mining processes started inside running containers are detected: [[runtime]]
    fr: |
      Aucune chaîne de connexion de base de données n'est stockée dans les images : [[secrets]]

      Les images applicatives sont reconstruites quand leur image de base est corrigée : [[rebuild]]

      Les processus de minage de cryptomonnaie lancés dans des conteneurs en cours d'exécution sont détectés : [[runtime]]
  slots:
    - id: secrets
      options:
        - { id: kv, text: { en: "Microsoft Entra Workload ID with secrets read from Azure Key Vault at run time", fr: "Microsoft Entra Workload ID avec des secrets lus dans Azure Key Vault à l'exécution" } }
        - { id: env, text: { en: "Environment variables defined in the Dockerfile", fr: "Des variables d'environnement définies dans le Dockerfile" } }
        - { id: lock, text: { en: "An image lock on each repository", fr: "Un verrou d'image sur chaque dépôt" } }
        - { id: va, text: { en: "Agentless vulnerability assessment of the registry", fr: "L'évaluation des vulnérabilités sans agent du registre" } }
    - id: rebuild
      options:
        - { id: gated, text: { en: "Gated deployment rules", fr: "Des règles de déploiement contrôlé" } }
        - { id: trigger, text: { en: "ACR Tasks base image update triggers", fr: "Les déclencheurs de mise à jour de l'image de base des tâches ACR" } }
        - { id: geo, text: { en: "Registry geo-replication", fr: "La géoréplication du registre" } }
        - { id: purge, text: { en: "Automatic purge of untagged manifests", fr: "Le vidage automatique des manifestes sans balise" } }
    - id: runtime
      options:
        - { id: sensor, text: { en: "Runtime threat protection with the Defender sensor", fr: "La protection contre les menaces à l'exécution avec le capteur Defender" } }
        - { id: policy, text: { en: "Azure Policy for Kubernetes", fr: "Azure Policy pour Kubernetes" } }
        - { id: pe, text: { en: "A private endpoint for the registry", fr: "Un point de terminaison privé pour le registre" } }
        - { id: notary, text: { en: "Notary Project image signatures", fr: "Des signatures d'image Notary Project" } }
answer:
  values: { secrets: kv, rebuild: trigger, runtime: sensor }
explanation:
  correct:
    en: |-
      Secrets stay out of images when pods authenticate with Microsoft Entra Workload ID and read them from Key Vault at run time. ACR Tasks can trigger a build automatically when a base image is updated, so application images pick up the patched base. Crypto-mining in a running container is a runtime behavior that the Defender sensor of Defender for Containers detects.
    fr: |-
      Les secrets restent hors des images quand les pods s'authentifient avec Microsoft Entra Workload ID et les lisent dans Key Vault à l'exécution. Les tâches ACR peuvent déclencher automatiquement un build quand une image de base est mise à jour : les images applicatives intègrent alors la base corrigée. Le minage de cryptomonnaie dans un conteneur en cours d'exécution est un comportement à l'exécution que détecte le capteur Defender de Defender for Containers.
  options:
    env:
      en: |-
        Environment variables in the Dockerfile are baked into the image layers, which is exactly what the requirement forbids.
      fr: |-
        Les variables d'environnement du Dockerfile sont intégrées aux couches de l'image, ce que l'exigence interdit justement.
    va:
      en: |-
        Vulnerability assessment reports vulnerable packages; it doesn't keep secrets out of images.
      fr: |-
        L'évaluation des vulnérabilités signale les packages vulnérables ; elle ne tient pas les secrets hors des images.
    gated:
      en: |-
        Gated deployment blocks vulnerable images at deployment; it doesn't rebuild anything.
      fr: |-
        Le déploiement contrôlé bloque les images vulnérables au déploiement ; il ne reconstruit rien.
    policy:
      en: |-
        Azure Policy for Kubernetes checks requests to the API server; it doesn't watch processes inside containers.
      fr: |-
        Azure Policy pour Kubernetes vérifie les requêtes adressées au serveur d'API ; il ne surveille pas les processus à l'intérieur des conteneurs.
references:
  - title: About base image updates for ACR Tasks
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-tasks-base-images
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
