id: sc100-3c-aks-pod-identity
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs twelve microservices in an Azure Kubernetes Service (AKS) cluster. Several services read secrets from Azure Key Vault and write to Azure Storage accounts by using service principals whose client secrets are stored as Kubernetes secrets.

    The security team requires that:

    - no long-lived credential be stored in the cluster;
    - each microservice receive only the Azure permissions it needs, independently of the other microservices.

    What should you recommend?
  fr: |
    Proseware exécute douze microservices dans un cluster Azure Kubernetes Service (AKS). Plusieurs services lisent des secrets dans Azure Key Vault et écrivent dans des comptes Stockage Azure avec des principaux de service dont les secrets client sont stockés sous forme de secrets Kubernetes.

    L'équipe de sécurité exige que :

    - aucun identifiant de longue durée ne soit stocké dans le cluster ;
    - chaque microservice ne reçoive que les autorisations Azure dont il a besoin, indépendamment des autres microservices.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra Workload ID, with a managed identity federated to the service account of each microservice", fr: "Microsoft Entra Workload ID, avec une identité managée fédérée au compte de service de chaque microservice" } }
    - { id: b, text: { en: "The kubelet managed identity of the cluster, granted the roles that all the microservices need", fr: "L'identité managée kubelet du cluster, à laquelle sont accordés les rôles nécessaires à tous les microservices" } }
    - { id: c, text: { en: "Microsoft Entra pod-managed identity, with an identity binding for each microservice", fr: "L'identité managée par pod Microsoft Entra, avec une liaison d'identité pour chaque microservice" } }
    - { id: d, text: { en: "Certificate credentials for the service principals, stored in Kubernetes secrets and rotated every 30 days", fr: "Des certificats pour les principaux de service, stockés dans des secrets Kubernetes et renouvelés tous les 30 jours" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Microsoft Entra Workload ID uses the cluster's OIDC issuer and a federated identity credential: a pod that runs under a given Kubernetes service account exchanges its projected token for a Microsoft Entra token, with no stored secret. Each microservice gets its own managed identity, so its role assignments are scoped to what it needs.
    fr: |-
      Microsoft Entra Workload ID utilise l'émetteur OIDC du cluster et des informations d'identification fédérées : un pod qui s'exécute sous un compte de service Kubernetes donné échange son jeton projeté contre un jeton Microsoft Entra, sans secret stocké. Chaque microservice reçoit sa propre identité managée : ses attributions de rôles se limitent à ce dont il a besoin.
  options:
    b:
      en: |-
        The kubelet identity is shared by every pod on the nodes, so each microservice would get the permissions of all the others.
      fr: |-
        L'identité kubelet est partagée par tous les pods des nœuds : chaque microservice obtiendrait les autorisations de tous les autres.
    c:
      en: |-
        Pod-managed identity was a preview that is deprecated and replaced by Microsoft Entra Workload ID; a new design shouldn't use it.
      fr: |-
        L'identité managée par pod était une préversion dépréciée et remplacée par Microsoft Entra Workload ID ; une nouvelle conception ne doit pas l'utiliser.
    d:
      en: |-
        A certificate stored in a Kubernetes secret is still a long-lived credential in the cluster.
      fr: |-
        Un certificat stocké dans un secret Kubernetes reste un identifiant de longue durée dans le cluster.
references:
  - title: Use a Microsoft Entra Workload ID on Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
