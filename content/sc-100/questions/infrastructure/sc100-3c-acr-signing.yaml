id: sc100-3c-acr-signing
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam builds container images in Azure Pipelines, stores them in an Azure Container Registry Premium registry, and deploys them to three Azure Kubernetes Service (AKS) clusters.

    After a supply chain incident at a partner, the security team sets the following requirements:

    - Each image deployed to the clusters must carry a cryptographic signature that proves it was produced by the Fabrikam build pipeline.
    - The signing keys and certificates must be stored in Azure Key Vault.
    - The clusters must refuse to run images whose signature can't be verified.

    What should you recommend?
  fr: |
    Fabrikam génère des images conteneur dans Azure Pipelines, les stocke dans un registre Azure Container Registry Premium et les déploie sur trois clusters Azure Kubernetes Service (AKS).

    Après un incident de chaîne d'approvisionnement chez un partenaire, l'équipe de sécurité fixe les exigences suivantes :

    - Chaque image déployée sur les clusters doit porter une signature cryptographique qui prouve qu'elle a été produite par le pipeline de build de Fabrikam.
    - Les clés et certificats de signature doivent être stockés dans Azure Key Vault.
    - Les clusters doivent refuser d'exécuter les images dont la signature ne peut pas être vérifiée.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable Docker Content Trust on the registry and set DOCKER_CONTENT_TRUST in the pipelines", fr: "Activer Docker Content Trust sur le registre et définir DOCKER_CONTENT_TRUST dans les pipelines" } }
    - { id: b, text: { en: "Sign the images with Notation in the pipelines, and verify the signatures on the clusters with Ratify and Azure Policy", fr: "Signer les images avec Notation dans les pipelines, et vérifier les signatures sur les clusters avec Ratify et Azure Policy" } }
    - { id: c, text: { en: "Enable gated deployment rules in Defender for Containers, and scan the images in the registry", fr: "Activer des règles de déploiement contrôlé dans Defender for Containers, et analyser les images du registre" } }
    - { id: d, text: { en: "Lock each pushed image in the registry, and allow only AcrPull for the cluster identities", fr: "Verrouiller chaque image envoyée dans le registre, et n'autoriser qu'AcrPull pour les identités des clusters" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Notary Project is the industry standard that Azure Container Registry supports for signing OCI artifacts: Notation signs the images in the pipeline with keys and certificates kept in Azure Key Vault. On AKS, Ratify with Azure Policy verifies the signatures at admission, so unsigned or tampered images are refused.
    fr: |-
      Le Notary Project est la norme du secteur prise en charge par Azure Container Registry pour signer les artefacts OCI : Notation signe les images dans le pipeline avec des clés et des certificats conservés dans Azure Key Vault. Sur AKS, Ratify associé à Azure Policy vérifie les signatures à l'admission : les images non signées ou altérées sont refusées.
  options:
    a:
      en: |-
        Docker Content Trust is deprecated in Azure Container Registry and will be removed on March 31, 2028; it doesn't keep its signing keys in Azure Key Vault.
      fr: |-
        Docker Content Trust est déprécié dans Azure Container Registry et sera supprimé le 31 mars 2028 ; il ne conserve pas ses clés de signature dans Azure Key Vault.
    c:
      en: |-
        Gated deployment blocks images that break the vulnerability policy; it doesn't prove who built an image.
      fr: |-
        Le déploiement contrôlé bloque les images qui enfreignent la stratégie de vulnérabilité ; il ne prouve pas qui a produit une image.
    d:
      en: |-
        An image lock prevents an image from being deleted or overwritten, and AcrPull limits what the clusters can do; neither proves the origin of an image.
      fr: |-
        Un verrou d'image empêche la suppression ou l'écrasement d'une image, et AcrPull limite ce que les clusters peuvent faire ; aucun des deux ne prouve l'origine d'une image.
references:
  - title: Transition from Docker Content Trust to Notary Project
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-content-trust-deprecation
