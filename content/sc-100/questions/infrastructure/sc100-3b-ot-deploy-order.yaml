id: sc100-3b-ot-deploy-order
objective: "3.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Pharma plans to monitor the OT network of a new production site with cloud-connected Microsoft Defender for IoT OT sensors. An OT plan is already onboarded to the Azure subscription.

    Which five actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam Pharma prévoit de surveiller le réseau OT d'un nouveau site de production avec des capteurs OT Microsoft Defender for IoT connectés au cloud. Un plan OT est déjà intégré à l'abonnement Azure.

    Quelles sont les cinq actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: prep, text: { en: "Create a network diagram and list the devices and subnets to monitor.", fr: "Créer un schéma du réseau et lister les appareils et les sous-réseaux à surveiller." } }
    - { id: onboard, text: { en: "Onboard the OT sensors in the Azure portal.", fr: "Intégrer les capteurs OT dans le portail Azure." } }
    - { id: mirror, text: { en: "Configure traffic mirroring on the site switches.", fr: "Configurer la mise en miroir du trafic sur les commutateurs du site." } }
    - { id: install, text: { en: "Install and activate the OT sensors.", fr: "Installer et activer les capteurs OT." } }
    - { id: learn, text: { en: "Learn the OT alerts to create the network baseline.", fr: "Apprendre les alertes OT pour créer la base de référence du réseau." } }
    - { id: console, text: { en: "Deploy an on-premises management console to manage the sensors.", fr: "Déployer une console de gestion locale pour gérer les capteurs." } }
    - { id: agent, text: { en: "Install the Defender for Endpoint sensor on each PLC.", fr: "Installer le capteur Defender for Endpoint sur chaque PLC." } }
answer:
  sequence: [ prep, onboard, mirror, install, learn ]
explanation:
  correct:
    en: |
      The OT deployment path starts with planning and preparing the site (network diagram, devices and subnets), then onboarding the sensors in the Azure portal. The site networking setup follows with traffic mirroring, then the sensors are installed and activated. Finally, you calibrate monitoring and learn the alerts so that the sensor builds the network baseline and leaves learning mode.
    fr: |
      Le parcours de déploiement OT commence par la planification et la préparation du site (schéma réseau, appareils et sous-réseaux), puis par l'intégration des capteurs dans le portail Azure. Vient ensuite la configuration réseau du site avec la mise en miroir du trafic, puis l'installation et l'activation des capteurs. Enfin, vous ajustez la surveillance et apprenez les alertes pour que le capteur établisse la base de référence du réseau et quitte le mode d'apprentissage.
  options:
    console:
      en: |
        The legacy on-premises management console isn't available after January 1, 2025, and cloud-connected sensors are managed in the Azure portal.
      fr: |
        La console de gestion locale héritée n'est plus disponible depuis le 1er janvier 2025, et les capteurs connectés au cloud sont gérés dans le portail Azure.
    agent:
      en: |
        OT monitoring is agentless: PLCs can't run the Defender for Endpoint sensor.
      fr: |
        La surveillance OT est sans agent : les PLC ne peuvent pas exécuter le capteur Defender for Endpoint.
references:
  - title: Deploy Defender for IoT for OT monitoring
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/ot-deploy/ot-deploy-path
