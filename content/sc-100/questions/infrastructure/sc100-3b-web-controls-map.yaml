id: sc100-3b-web-controls-map
objective: "3.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum Bank is writing the security requirements for its web workloads on Azure.

    Which solution should you specify for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Bank rédige les exigences de sécurité de ses charges de travail web sur Azure.

    Quelle solution devez-vous spécifier pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: easyauth, text: { en: "App Service built-in authentication", fr: "Authentification intégrée d'App Service" } }
    - { id: ase, text: { en: "App Service Environment with an internal load balancer", fr: "App Service Environment avec un équilibreur de charge interne" } }
    - { id: defas, text: "Microsoft Defender for App Service" }
    - { id: kvref, text: { en: "Key Vault references", fr: "Références Key Vault" } }
    - { id: vnetint, text: { en: "Virtual network integration", fr: "Intégration au réseau virtuel" } }
    - { id: pe, text: { en: "Private endpoint on the app", fr: "Point de terminaison privé sur l'application" } }
  targets:
    - { id: t1, text: { en: "Users must sign in with Microsoft Entra ID before any request reaches the app code, without code changes", fr: "Les utilisateurs doivent se connecter avec Microsoft Entra ID avant qu'une requête n'atteigne le code de l'application, sans modification du code" } }
    - { id: t2, text: { en: "A third-party API token used by the app must be stored outside the app settings", fr: "Un jeton d'API tiers utilisé par l'application doit être stocké en dehors des paramètres de l'application" } }
    - { id: t3, text: { en: "The app must call a database that is reachable only from a virtual network", fr: "L'application doit appeler une base de données joignable uniquement depuis un réseau virtuel" } }
    - { id: t4, text: { en: "The security team must receive threat alerts based on the requests and the infrastructure of the apps", fr: "L'équipe de sécurité doit recevoir des alertes de menaces basées sur les requêtes et l'infrastructure des applications" } }
answer:
  mapping: { t1: easyauth, t2: kvref, t3: vnetint, t4: defas }
explanation:
  correct:
    en: |
      Built-in authentication handles sign-in with Microsoft Entra ID before requests reach the code. Key Vault references keep secrets in Key Vault, read through the app's managed identity. Virtual network integration controls the app's outbound traffic and lets it reach private resources. Defender for App Service detects threats by monitoring the app's requests, responses and underlying infrastructure. A private endpoint secures inbound traffic only, and an App Service Environment isn't needed for these requirements.
    fr: |
      L'authentification intégrée gère la connexion avec Microsoft Entra ID avant que les requêtes n'atteignent le code. Les références Key Vault conservent les secrets dans Key Vault, lus par l'identité managée de l'application. L'intégration au réseau virtuel contrôle le trafic sortant de l'application et lui permet de joindre des ressources privées. Defender for App Service détecte les menaces en surveillant les requêtes, les réponses et l'infrastructure sous-jacente de l'application. Un point de terminaison privé ne sécurise que le trafic entrant, et un App Service Environment n'est pas nécessaire pour ces exigences.
references:
  - title: Secure your Azure App Service deployment
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-security
  - title: Azure security baseline for App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/security-recommendations
