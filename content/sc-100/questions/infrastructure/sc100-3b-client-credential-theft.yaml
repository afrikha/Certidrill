id: sc100-3b-client-credential-theft
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has 8,000 domain-joined Windows 11 Enterprise devices licensed with Microsoft 365 E3. The devices support virtualization-based security and Secure Boot. A penetration test showed that an attacker who gained local administrator rights on one device could extract NTLM password hashes and Kerberos ticket-granting tickets (TGTs) of domain users from memory, and then move laterally by using pass-the-hash and pass-the-ticket.

    You need to recommend a client hardening requirement that prevents the extraction of these secrets, even by malware that runs with administrative privileges in the operating system.

    What should you recommend?
  fr: |
    Contoso dispose de 8 000 appareils Windows 11 Entreprise joints au domaine, avec des licences Microsoft 365 E3. Les appareils prennent en charge la sécurité basée sur la virtualisation et le démarrage sécurisé. Un test d'intrusion a montré qu'un attaquant ayant obtenu les droits d'administrateur local sur un appareil pouvait extraire de la mémoire les hachages de mots de passe NTLM et les tickets TGT Kerberos des utilisateurs du domaine, puis se déplacer latéralement par pass-the-hash et pass-the-ticket.

    Vous devez recommander une exigence de sécurisation renforcée des clients qui empêche l'extraction de ces secrets, même par un logiciel malveillant exécuté avec des privilèges d'administration dans le système d'exploitation.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Windows LAPS on every device", fr: "Windows LAPS sur chaque appareil" } }
    - { id: b, text: { en: "BitLocker with TPM and PIN protectors", fr: "BitLocker avec des protecteurs TPM et code PIN" } }
    - { id: c, text: { en: "Tamper protection in Defender for Endpoint", fr: "La protection contre les falsifications de Defender for Endpoint" } }
    - { id: d, text: { en: "Credential Guard", fr: "Credential Guard" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Credential Guard uses virtualization-based security to isolate NTLM password hashes, Kerberos TGTs and stored domain credentials, so that malware running with administrative privileges in the OS can't extract them. It blocks pass-the-hash and pass-the-ticket techniques, and it is supported on Windows Enterprise editions licensed through E3 or E5.
    fr: |
      Credential Guard utilise la sécurité basée sur la virtualisation pour isoler les hachages de mots de passe NTLM, les tickets TGT Kerberos et les informations d'identification de domaine stockées ; un logiciel malveillant exécuté avec des privilèges d'administration dans le système d'exploitation ne peut pas les extraire. Il bloque les techniques pass-the-hash et pass-the-ticket, et il est pris en charge sur les éditions Windows Entreprise sous licence E3 ou E5.
  options:
    a:
      en: |
        Windows LAPS gives each device a unique local administrator password; it doesn't protect the domain users' hashes and tickets held in memory.
      fr: |
        Windows LAPS attribue à chaque appareil un mot de passe d'administrateur local unique ; il ne protège pas les hachages et les tickets des utilisateurs du domaine conservés en mémoire.
    b:
      en: |
        BitLocker protects data on a stopped or stolen device; it doesn't protect secrets in the memory of a running system.
      fr: |
        BitLocker protège les données d'un appareil arrêté ou volé ; il ne protège pas les secrets dans la mémoire d'un système en cours d'exécution.
    c:
      en: |
        Tamper protection prevents changes to Defender settings; it doesn't isolate credentials from processes that read memory.
      fr: |
        La protection contre les falsifications empêche la modification des paramètres de Defender ; elle n'isole pas les informations d'identification des processus qui lisent la mémoire.
references:
  - title: Credential Guard overview
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/
