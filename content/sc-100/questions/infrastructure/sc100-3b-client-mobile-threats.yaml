id: sc100-3b-client-mobile-threats
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has 2,500 corporate-owned iPhone and Android devices that are enrolled in Microsoft Intune. Users read email in Outlook and open links from email and Teams messages.

    You need to recommend a solution that meets the following requirements:

    - Users are protected against phishing websites opened from any app on the devices.
    - A device on which a high-risk threat is detected can't access Exchange Online until the threat is resolved.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose de 2 500 appareils iPhone et Android appartenant à l'entreprise et inscrits dans Microsoft Intune. Les utilisateurs lisent leur courrier dans Outlook et ouvrent des liens depuis les e-mails et les messages Teams.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les utilisateurs sont protégés contre les sites web d'hameçonnage ouverts depuis n'importe quelle application des appareils.
    - Un appareil sur lequel une menace à risque élevé est détectée ne peut pas accéder à Exchange Online tant que la menace n'est pas résolue.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy attack surface reduction rules to the devices.", fr: "Déployer des règles de réduction de la surface d'attaque sur les appareils." } }
    - { id: b, text: { en: "Deploy Defender for Endpoint on iOS and Android with web protection enabled.", fr: "Déployer Defender for Endpoint sur iOS et Android avec la protection web activée." } }
    - { id: c, text: { en: "Deploy App Control for Business policies to the devices.", fr: "Déployer des stratégies App Control for Business sur les appareils." } }
    - { id: d, text: { en: "Set a maximum device threat level in the Intune compliance policies, and require a compliant device in Conditional Access.", fr: "Définir un niveau de menace maximal de l'appareil dans les stratégies de conformité Intune, et exiger un appareil conforme dans l'accès conditionnel." } }
    - { id: e, text: { en: "Require multifactor authentication for every Exchange Online sign-in from the phones in Conditional Access.", fr: "Exiger l'authentification multifacteur pour chaque connexion à Exchange Online depuis les téléphones dans l'accès conditionnel." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Defender for Endpoint on iOS and Android provides web protection against phishing and unsafe sites, and it reports a device risk level to Intune as a mobile threat defense solution. A compliance policy with a maximum threat level marks a high-risk device as noncompliant, and Conditional Access then blocks it until the threat is resolved.
    fr: |
      Defender for Endpoint sur iOS et Android fournit une protection web contre l'hameçonnage et les sites dangereux, et il transmet à Intune un niveau de risque de l'appareil en tant que solution de défense contre les menaces mobiles. Une stratégie de conformité avec un niveau de menace maximal rend non conforme un appareil à risque élevé, puis l'accès conditionnel le bloque jusqu'à la résolution de la menace.
  options:
    a:
      en: |
        Attack surface reduction rules are a Windows capability; they don't apply to iOS or Android.
      fr: |
        Les règles de réduction de la surface d'attaque sont une fonctionnalité Windows ; elles ne s'appliquent ni à iOS ni à Android.
    c:
      en: |
        App Control for Business controls which applications run on Windows; it doesn't exist for iOS or Android.
      fr: |
        App Control for Business contrôle les applications qui s'exécutent sous Windows ; il n'existe pas pour iOS ni Android.
    e:
      en: |
        MFA verifies the user, not the device: a compromised phone would still reach Exchange Online after a successful MFA prompt.
      fr: |
        L'authentification multifacteur vérifie l'utilisateur, pas l'appareil : un téléphone compromis atteindrait toujours Exchange Online après une authentification réussie.
references:
  - title: Integrate Microsoft Defender for Endpoint with Intune for Device Compliance
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/advanced-threat-protection
