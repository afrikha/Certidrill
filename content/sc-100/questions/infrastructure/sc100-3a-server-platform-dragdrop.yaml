id: sc100-3a-server-platform-dragdrop
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is writing security requirements for three groups of Windows servers. The domain controllers run Windows Server 2025, and the member servers run Windows Server 2022 with current updates. Some member servers are Azure VMs.

    Which solution should you specify for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank rédige les exigences de sécurité de trois groupes de serveurs Windows. Les contrôleurs de domaine exécutent Windows Server 2025, et les serveurs membres exécutent Windows Server 2022 avec les mises à jour actuelles. Certains serveurs membres sont des machines virtuelles Azure.

    Quelle solution devez-vous spécifier pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mdi, text: Microsoft Defender for Identity }
    - { id: laps, text: Windows LAPS }
    - { id: jit, text: { en: "Just-in-time VM access", fr: "Accès juste-à-temps aux machines virtuelles" } }
    - { id: aum, text: Azure Update Manager }
    - { id: mc, text: { en: "Azure Policy machine configuration", fr: "Configuration des machines Azure Policy" } }
  targets:
    - id: dc
      text: { en: "Domain controllers: detect Golden Ticket activity, DCShadow and malicious replication", fr: "Contrôleurs de domaine : détecter l'activité Golden Ticket, DCShadow et la réplication malveillante" }
    - id: local
      text: { en: "Member servers: give each server a unique, regularly rotated local administrator password backed up to AD DS", fr: "Serveurs membres : donner à chaque serveur un mot de passe d'administrateur local unique, renouvelé régulièrement et sauvegardé dans AD DS" }
    - id: ports
      text: { en: "Member servers in Azure: open RDP only on approved request and for a limited time", fr: "Serveurs membres dans Azure : n'ouvrir RDP que sur demande approuvée et pour une durée limitée" }
answer:
  mapping: { dc: mdi, local: laps, ports: jit }
explanation:
  correct:
    en: Defender for Identity detects domain dominance activity such as Golden Ticket, DCShadow and malicious domain controller replication. Windows LAPS automatically manages and rotates the local administrator password of Active Directory-joined servers and backs it up to AD DS, which prevents lateral movement with shared passwords. Just-in-time VM access, a Defender for Servers Plan 2 feature, opens management ports only on approved, time-limited requests.
    fr: Defender for Identity détecte les activités de domination du domaine comme Golden Ticket, DCShadow et la réplication malveillante de contrôleurs de domaine. Windows LAPS gère et renouvelle automatiquement le mot de passe de l'administrateur local des serveurs joints à Active Directory et le sauvegarde dans AD DS, ce qui empêche le mouvement latéral avec des mots de passe partagés. L'accès juste-à-temps aux machines virtuelles, une fonctionnalité de Defender for Servers Plan 2, n'ouvre les ports de gestion que sur des demandes approuvées et limitées dans le temps.
  options:
    aum:
      en: Azure Update Manager installs operating system updates; it doesn't meet any of the three requirements.
      fr: Azure Update Manager installe les mises à jour du système d'exploitation ; il ne répond à aucune des trois exigences.
    mc:
      en: Machine configuration audits or applies operating system settings; it doesn't detect identity attacks, rotate passwords or control port access.
      fr: La configuration des machines audite ou applique des paramètres du système d'exploitation ; elle ne détecte pas les attaques d'identité, ne renouvelle pas les mots de passe et ne contrôle pas l'accès aux ports.
references:
  - title: Microsoft Defender for Identity Overview
    url: https://learn.microsoft.com/en-us/defender-for-identity/what-is
  - title: "Windows LAPS Overview: Manage Admin Passwords"
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview
