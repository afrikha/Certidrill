id: sc100-3a-planned-score
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys approved a six-month identity and email hardening project that will implement 12 recommended actions from Microsoft Secure Score. The CISO must show the board today the Secure Score that the organization will reach when the project ends, without changing the current score.

    What should you recommend?
  fr: |
    Tailspin Toys a approuvé un projet de six mois de renforcement des identités et de la messagerie qui mettra en œuvre 12 actions recommandées du Niveau de sécurité Microsoft. Le RSSI doit présenter dès aujourd'hui au conseil d'administration le Niveau de sécurité Microsoft que l'organisation atteindra à la fin du projet, sans modifier le score actuel.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Set the 12 actions to Planned and present the Planned score view", fr: "Définir les 12 actions sur Planned et présenter la vue Planned score" }
    - id: b
      text: { en: "Set the 12 actions to Resolved through alternate mitigation and present the current score", fr: "Définir les 12 actions sur Resolved through alternate mitigation et présenter le score actuel" }
    - id: c
      text: { en: "Set the 12 actions to Risk accepted and present the Risk acceptance trend", fr: "Définir les 12 actions sur Risk accepted et présenter la tendance d'acceptation des risques" }
    - id: d
      text: { en: "Present the comparison with organizations of a similar seat count", fr: "Présenter la comparaison avec les organisations d'un nombre de postes similaire" }
answer:
  optionId: a
explanation:
  correct:
    en: The Planned status records actions that have concrete plans for completion. The Planned score view projects the score that the organization reaches once the planned actions are completed, while the current score stays unchanged.
    fr: L'état Planned enregistre les actions dont la réalisation fait l'objet de plans concrets. La vue Planned score projette le score que l'organisation atteint une fois les actions planifiées réalisées, tandis que le score actuel reste inchangé.
  options:
    b:
      en: Resolved through alternate mitigation immediately adds the points to the current score, which misstates the current posture.
      fr: Resolved through alternate mitigation ajoute immédiatement les points au score actuel, ce qui fausse la posture actuelle.
    c:
      en: Risk accepted awards no points and states that the actions won't be implemented, the opposite of the project.
      fr: Risk accepted n'accorde aucun point et indique que les actions ne seront pas mises en œuvre, à l'inverse du projet.
    d:
      en: The comparison shows how the current score compares with similar organizations; it doesn't project the score after the project.
      fr: La comparaison montre comment le score actuel se situe par rapport à des organisations similaires ; elle ne projette pas le score après le projet.
references:
  - title: Assess your security posture through Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-improvement-actions
  - title: Track your Microsoft Secure Score history and meet goals
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-history-metrics-trends
