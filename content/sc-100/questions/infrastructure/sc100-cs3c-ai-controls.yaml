stem:
  en: |
    You need to recommend a solution for each AI security requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution pour chaque exigence relative à la sécurité de l'IA.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Instructions hidden in the partner PDF files: [[hidden]]

      Alerts about jailbreak attempts: [[alerts]]

      Discovery of AI workloads and attack paths: [[posture]]
    fr: |
      Instructions cachées dans les fichiers PDF des partenaires : [[hidden]]

      Alertes sur les tentatives de jailbreak : [[alerts]]

      Découverte des charges de travail d'IA et des chemins d'attaque : [[posture]]
  slots:
    - id: hidden
      options:
        - { id: indirect, text: { en: "A Foundry guardrail with the Indirect attacks control", fr: "Un garde-fou Foundry avec le contrôle Indirect attacks" } }
        - { id: protected, text: { en: "A Foundry guardrail with the Protected material control", fr: "Un garde-fou Foundry avec le contrôle Protected material" } }
        - { id: threat, text: { en: "Threat protection for AI services in Defender for Cloud", fr: "La protection contre les menaces pour les services d'IA dans Defender pour le cloud" } }
        - { id: aispm, text: { en: "AI security posture management in Defender CSPM", fr: "La gestion de la posture de sécurité de l'IA dans Defender CSPM" } }
    - id: alerts
      options:
        - { id: indirect, text: { en: "A Foundry guardrail with the Indirect attacks control", fr: "Un garde-fou Foundry avec le contrôle Indirect attacks" } }
        - { id: protected, text: { en: "A Foundry guardrail with the Protected material control", fr: "Un garde-fou Foundry avec le contrôle Protected material" } }
        - { id: threat, text: { en: "Threat protection for AI services in Defender for Cloud", fr: "La protection contre les menaces pour les services d'IA dans Defender pour le cloud" } }
        - { id: aispm, text: { en: "AI security posture management in Defender CSPM", fr: "La gestion de la posture de sécurité de l'IA dans Defender CSPM" } }
    - id: posture
      options:
        - { id: indirect, text: { en: "A Foundry guardrail with the Indirect attacks control", fr: "Un garde-fou Foundry avec le contrôle Indirect attacks" } }
