answer:
  values: { hidden: indirect, alerts: threat, posture: aispm }
explanation:
  correct:
    en: |-
      A guardrail is a named collection of controls; the Indirect attacks control detects attacks embedded in the content that a model or agent processes, and the Annotate and block action stops them. Threat protection for AI services raises security alerts on threats such as jailbreak and integrates with Defender XDR, so the SOC correlates them with other incidents. AI security posture management in Defender CSPM discovers AI workloads in Azure, AWS (Amazon Bedrock) and GCP, and adds them to attack path analysis.
    fr: |-
      Un garde-fou est un ensemble nommé de contrôles ; le contrôle Indirect attacks détecte les attaques incorporées dans le contenu traité par un modèle ou un agent, et l'action Annotate and block les arrête. La protection contre les menaces pour les services d'IA génère des alertes de sécurité sur des menaces comme le jailbreak et s'intègre à Defender XDR : le SOC les corrèle donc avec les autres incidents. La gestion de la posture de sécurité de l'IA dans Defender CSPM découvre les charges de travail d'IA dans Azure, AWS (Amazon Bedrock) et GCP, et les intègre à l'analyse des chemins d'attaque.
  options:
    protected:
      en: |-
        The Protected material control detects known protected text or code; it doesn't detect hidden instructions or raise SOC alerts.
      fr: |-
        Le contrôle Protected material détecte du texte ou du code protégés connus ; il ne détecte pas d'instructions cachées et ne génère pas d'alertes pour le SOC.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
