id: sc100-3a-exposure-statements
objective: "3.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is evaluating Microsoft Security Exposure Management for its commercial Microsoft 365 tenant and for a separate tenant that a subsidiary operates in a US Government cloud. The security architect must specify the requirements of the posture management process.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. évalue Microsoft Security Exposure Management pour son locataire Microsoft 365 commercial et pour un locataire distinct qu'une filiale exploite dans un cloud US Government. L'architecte de sécurité doit spécifier les exigences du processus de gestion de la posture.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The subsidiary can use Exposure Management in its US Government cloud tenant.
        fr: La filiale peut utiliser Exposure Management dans son locataire du cloud US Government.
    - id: s2
      text:
        en: The recommendations listed in an initiative are remediated in the workload that they come from, such as Defender Vulnerability Management.
        fr: Les recommandations listées dans une initiative sont corrigées dans la charge de travail dont elles proviennent, comme Gestion des vulnérabilités Microsoft Defender.
    - id: s3
      text:
        en: Asset data from ServiceNow CMDB and Tenable can be brought into Exposure Management by using data connectors.
        fr: Les données de ressources de ServiceNow CMDB et de Tenable peuvent être intégrées à Exposure Management au moyen de connecteurs de données.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Exposure Management is available in the public cloud only, not in US Government, China or other sovereign clouds. Initiatives list only the recommendations that are active in Microsoft Secure Score or Defender for Cloud, and each one is managed in its originating workload. Third-party tools such as ServiceNow CMDB, Tenable, Qualys and Rapid7 are consolidated into the same view through the exposure management data connectors.
    fr: Exposure Management n'est disponible que dans le cloud public, pas dans les clouds US Government, Chine ou autres clouds souverains. Les initiatives ne listent que les recommandations actives dans le Niveau de sécurité Microsoft ou Defender for Cloud, et chacune est gérée dans sa charge de travail d'origine. Des outils tiers comme ServiceNow CMDB, Tenable, Qualys et Rapid7 sont regroupés dans la même vue au moyen des connecteurs de données de la gestion de l'exposition.
  options:
    s1:
      en: The service isn't available in national or sovereign clouds.
      fr: Le service n'est pas disponible dans les clouds nationaux ou souverains.
references:
  - title: What is Microsoft Security Exposure Management?
    url: https://learn.microsoft.com/en-us/security-exposure-management/microsoft-security-exposure-management
  - title: Review Security Initiatives in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/initiatives
