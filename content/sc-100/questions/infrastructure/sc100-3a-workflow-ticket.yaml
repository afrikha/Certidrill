id: sc100-3a-workflow-ticket
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Cloud with Foundational CSPM only. The budget doesn't allow any additional paid security plan or service. An existing logic app already creates tickets in ServiceNow.

    You need to recommend a solution that automatically opens a ticket whenever a recommendation about storage accounts that allow public access becomes unhealthy.

    What should you recommend?
  fr: |
    Litware, Inc. utilise Microsoft Defender for Cloud avec Foundational CSPM uniquement. Le budget ne permet aucun plan ni service de sécurité payant supplémentaire. Une application logique existante crée déjà des tickets dans ServiceNow.

    Vous devez recommander une solution qui ouvre automatiquement un ticket chaque fois qu'une recommandation relative aux comptes de stockage autorisant l'accès public devient non saine.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A governance rule in Defender for Cloud that assigns the recommendation to an owner", fr: "Une règle de gouvernance dans Defender for Cloud qui attribue la recommandation à un propriétaire" }
    - id: b
      text: { en: "An automation rule in Microsoft Sentinel that runs the logic app as a playbook", fr: "Une règle d'automatisation dans Microsoft Sentinel qui exécute l'application logique en tant que playbook" }
    - id: c
      text: { en: "A workflow automation in Defender for Cloud that triggers the logic app", fr: "Une automatisation de workflow dans Defender for Cloud qui déclenche l'application logique" }
    - id: d
      text: { en: "An Azure Policy assignment with the Deny effect for public access on storage accounts", fr: "Une attribution Azure Policy avec l'effet Deny pour l'accès public aux comptes de stockage" }
answer:
  optionId: c
explanation:
  correct:
    en: Workflow automation is included in Foundational CSPM. It triggers a logic app when a recommendation or an alert matches the conditions you define, so the existing logic app can create the ServiceNow ticket without any paid plan.
    fr: L'automatisation des workflows est incluse dans Foundational CSPM. Elle déclenche une application logique quand une recommandation ou une alerte correspond aux conditions que vous définissez ; l'application logique existante peut donc créer le ticket ServiceNow sans aucun plan payant.
  options:
    a:
      en: Governance rules assign owners and due dates, but they are a Defender CSPM capability, which the budget excludes, and they don't open tickets in ServiceNow.
      fr: Les règles de gouvernance attribuent des propriétaires et des dates d'échéance, mais c'est une fonctionnalité de Defender CSPM, que le budget exclut, et elles n'ouvrent pas de tickets dans ServiceNow.
    b:
      en: Microsoft Sentinel is an additional paid service that would have to ingest the Defender for Cloud data first, which the budget doesn't allow.
      fr: Microsoft Sentinel est un service payant supplémentaire qui devrait d'abord ingérer les données de Defender for Cloud, ce que le budget ne permet pas.
    d:
      en: A Deny policy prevents new noncompliant configurations, but it doesn't open a ticket when the recommendation becomes unhealthy, which is the requirement.
      fr: Une stratégie Deny empêche les nouvelles configurations non conformes, mais elle n'ouvre pas de ticket quand la recommandation devient non saine, ce qui est l'exigence.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
