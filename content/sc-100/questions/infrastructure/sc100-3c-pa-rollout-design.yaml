id: sc100-3c-pa-rollout-design
objective: "3.4.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank is deploying Microsoft Entra Private Access in a datacenter. Users must keep the habits they had on the VPN, and the security team plans to move from broad access to least-privilege access within six months.

    The design must meet the following requirements:

    - Users open internal sites with short names, such as http://intranet, that are resolved by the internal DNS servers.
    - Before creating per-app applications, the security team must see which private destinations and ports users actually reach, and how many users reach each one.
    - Access must survive the failure of one connector server.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank déploie Accès privé Microsoft Entra dans un centre de données. Les utilisateurs doivent garder les habitudes qu'ils avaient avec le VPN, et l'équipe de sécurité prévoit de passer d'un accès large à un accès selon le privilège minimum en six mois.

    La conception doit respecter les exigences suivantes :

    - Les utilisateurs ouvrent des sites internes avec des noms courts, comme http://intranet, résolus par les serveurs DNS internes.
    - Avant de créer des applications par application, l'équipe de sécurité doit voir les destinations privées et les ports que les utilisateurs atteignent réellement, et combien d'utilisateurs atteignent chacun d'eux.
    - L'accès doit survivre à la panne d'un serveur de connecteur.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Short internal names: [[dns]]

      Visibility before segmentation: [[discovery]]

      Connector resilience: [[ha]]
    fr: |
      Noms internes courts : [[dns]]

      Visibilité avant la segmentation : [[discovery]]

      Résilience des connecteurs : [[ha]]
  slots:
    - id: dns
      options:
        - { id: suffix, text: { en: "Private DNS with the internal DNS suffix added in Quick Access", fr: "Le DNS privé avec le suffixe DNS interne ajouté dans Quick Access" } }
        - { id: zone, text: { en: "An Azure DNS private zone linked to the hub virtual network", fr: "Une zone privée Azure DNS liée au réseau virtuel hub" } }
        - { id: netbios, text: { en: "Application segments defined with NetBIOS names", fr: "Des segments d'application définis avec des noms NetBIOS" } }
    - id: discovery
      options:
        - { id: appdisc, text: { en: "App Discovery for Global Secure Access", fr: "La découverte d'applications de Global Secure Access" } }
        - { id: enriched, text: { en: "Microsoft 365 enriched logs", fr: "Les journaux enrichis Microsoft 365" } }
        - { id: mdca, text: { en: "Cloud discovery in Defender for Cloud Apps", fr: "La découverte cloud de Defender for Cloud Apps" } }
        - { id: sourceip, text: { en: "Source IP restoration", fr: "La restauration de l'adresse IP source" } }
    - id: ha
      options:
        - { id: two, text: { en: "At least two connector servers in the connector group used by the apps", fr: "Au moins deux serveurs de connecteur dans le groupe de connecteurs utilisé par les applications" } }
        - { id: maint, text: { en: "A maintenance connector group that holds a standby connector", fr: "Un groupe de connecteurs de maintenance qui contient un connecteur de secours" } }
        - { id: perapp, text: { en: "One connector group per application, each with one connector", fr: "Un groupe de connecteurs par application, chacun avec un connecteur" } }
answer:
  values: { dns: suffix, discovery: appdisc, ha: two }
explanation:
  correct:
    en: |-
      Private DNS in Quick Access resolves names under the added DNS suffixes through the internal DNS servers reached by the connectors, so short names keep working. App Discovery shows the destinations, protocols, ports and user counts of the traffic that flows through Quick Access, which is the input for per-app segmentation. With more than one connector in a group, the service routes new requests to the healthy connectors when one fails.
    fr: |-
      Le DNS privé de Quick Access résout les noms sous les suffixes DNS ajoutés par les serveurs DNS internes joints par les connecteurs : les noms courts continuent de fonctionner. La découverte d'applications affiche les destinations, les protocoles, les ports et le nombre d'utilisateurs du trafic qui passe par Quick Access, ce qui alimente la segmentation par application. Avec plusieurs connecteurs dans un groupe, le service route les nouvelles requêtes vers les connecteurs sains quand l'un d'eux tombe en panne.
  options:
    zone:
      en: |-
        An Azure DNS private zone resolves names for Azure virtual networks; it doesn't resolve the datacenter names for Private Access clients.
      fr: |-
        Une zone privée Azure DNS résout les noms pour les réseaux virtuels Azure ; elle ne résout pas les noms du centre de données pour les clients d'Accès privé.
    netbios:
      en: |-
        NetBIOS names aren't supported in application segments.
      fr: |-
        Les noms NetBIOS ne sont pas pris en charge dans les segments d'application.
    mdca:
      en: |-
        Cloud discovery analyzes traffic to cloud apps, not private destinations reached through Quick Access.
      fr: |-
        La découverte cloud analyse le trafic vers les applications cloud, pas les destinations privées atteintes via Quick Access.
    maint:
      en: |-
        A maintenance group receives no production traffic; a connector there doesn't take over when another one fails.
      fr: |-
        Un groupe de maintenance ne reçoit aucun trafic de production ; un connecteur qui s'y trouve ne prend pas le relais quand un autre tombe en panne.
    perapp:
      en: |-
        A group with a single connector loses its applications when that connector fails.
      fr: |-
        Un groupe avec un seul connecteur perd ses applications quand ce connecteur tombe en panne.
references:
  - title: How to configure Quick Access for Global Secure Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-quick-access
  - title: Application discovery for Global Secure Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-application-discovery
