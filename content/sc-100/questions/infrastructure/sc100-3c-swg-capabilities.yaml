id: sc100-3c-swg-capabilities
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is replacing an on-premises web proxy. Employees work from offices and from home, and they use Windows laptops, macOS laptops and Android phones. Adatum is evaluating Microsoft Entra Internet Access as the secure web gateway.

    Which two requirements can Internet Access meet?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation remplace un proxy web local. Les employés travaillent depuis les bureaux et depuis leur domicile, et ils utilisent des ordinateurs portables Windows et macOS ainsi que des téléphones Android. Adatum évalue Accès Internet Microsoft Entra comme passerelle web sécurisée.

    Quelles sont les deux exigences qu'Accès Internet peut satisfaire ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply Conditional Access, such as requiring a compliant device, to internet destinations that aren't federated with Microsoft Entra ID", fr: "Appliquer l'accès conditionnel, par exemple exiger un appareil conforme, aux destinations Internet qui ne sont pas fédérées avec Microsoft Entra ID" } }
    - { id: b, text: { en: "Inspect inbound requests to Adatum's public web apps in Azure for SQL injection", fr: "Inspecter les requêtes entrantes vers les applications web publiques d'Adatum dans Azure à la recherche d'injection SQL" } }
    - { id: c, text: { en: "Apply the same user-based web filtering on the Android phones as on the laptops, at home and in the office", fr: "Appliquer le même filtrage web fondé sur l'utilisateur aux téléphones Android qu'aux ordinateurs portables, à domicile comme au bureau" } }
    - { id: d, text: { en: "Filter the outbound traffic of Azure virtual machines that run unattended batch jobs", fr: "Filtrer le trafic sortant des machines virtuelles Azure qui exécutent des traitements par lots sans surveillance" } }
    - { id: e, text: { en: "Give remote users access to file shares in the on-premises datacenter without a VPN", fr: "Donner aux utilisateurs distants l'accès aux partages de fichiers du centre de données local sans VPN" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Universal Conditional Access in Internet Access extends Conditional Access controls to all internet destinations, including apps that don't use Microsoft Entra ID for sign-in. The Global Secure Access client runs on Windows, macOS, iOS and Android, so identity-based filtering policies follow users on every platform and network.
    fr: |-
      L'accès conditionnel universel d'Accès Internet étend les contrôles d'accès conditionnel à toutes les destinations Internet, y compris les applications qui n'utilisent pas Microsoft Entra ID pour la connexion. Le client Global Secure Access s'exécute sur Windows, macOS, iOS et Android : les stratégies de filtrage fondées sur l'identité suivent les utilisateurs sur chaque plateforme et chaque réseau.
  options:
    b:
      en: |-
        Inbound protection of web apps against SQL injection is the job of a WAF, not of a secure web gateway for users.
      fr: |-
        La protection entrante des applications web contre l'injection SQL relève d'un WAF, pas d'une passerelle web sécurisée pour les utilisateurs.
    d:
      en: |-
        Egress filtering for Azure workloads without users is the role of Azure Firewall.
      fr: |-
        Le filtrage de sortie des charges de travail Azure sans utilisateur relève du Pare-feu Azure.
    e:
      en: |-
        Access to private resources such as on-premises file shares is provided by Microsoft Entra Private Access.
      fr: |-
        L'accès aux ressources privées comme les partages de fichiers locaux est fourni par Accès privé Microsoft Entra.
references:
  - title: What is Global Secure Access?
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access
