id: sc100-3c-aks-multicloud
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs Kubernetes workloads on Azure Kubernetes Service (AKS), Amazon EKS, Google GKE and on-premises clusters built with an upstream Kubernetes distribution. The security operations team uses Microsoft Defender XDR.

    You need to recommend a solution that provides, for every cluster:

    - runtime threat detection for the nodes and workloads, with alerts in Defender XDR;
    - security recommendations for the cluster configuration and vulnerability findings for the running images.

    The solution must minimize the number of security products to operate.

    What should you recommend?
  fr: |
    Fabrikam exécute des charges de travail Kubernetes sur Azure Kubernetes Service (AKS), Amazon EKS, Google GKE et des clusters locaux bâtis sur une distribution Kubernetes standard. L'équipe des opérations de sécurité utilise Microsoft Defender XDR.

    Vous devez recommander une solution qui fournit, pour chaque cluster :

    - la détection des menaces à l'exécution pour les nœuds et les charges de travail, avec des alertes dans Defender XDR ;
    - des recommandations de sécurité sur la configuration du cluster et des résultats de vulnérabilité pour les images en cours d'exécution.

    La solution doit réduire au minimum le nombre de produits de sécurité à exploiter.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Defender CSPM on the Azure subscriptions, with AWS and GCP connectors for EKS and GKE", fr: "Defender CSPM sur les abonnements Azure, avec des connecteurs AWS et GCP pour EKS et GKE" } }
    - { id: b, text: { en: "Microsoft Sentinel, with data connectors that collect the Kubernetes audit logs of every cluster", fr: "Microsoft Sentinel, avec des connecteurs de données qui collectent les journaux d'audit Kubernetes de chaque cluster" } }
    - { id: c, text: { en: "Azure Policy for Kubernetes on every cluster, with the on-premises clusters connected to Azure Arc", fr: "Azure Policy pour Kubernetes sur chaque cluster, avec les clusters locaux connectés à Azure Arc" } }
    - { id: d, text: { en: "Defender for Containers, with AWS and GCP connectors and Azure Arc-enabled Kubernetes for the on-premises clusters", fr: "Defender for Containers, avec des connecteurs AWS et GCP et Kubernetes compatible Azure Arc pour les clusters locaux" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Defender for Containers protects AKS, EKS and GKE through the Azure, AWS and GCP connectors, and on-premises clusters once they are Azure Arc-enabled Kubernetes. One plan provides posture recommendations, vulnerability assessment and sensor-based runtime threat detection, and its alerts are correlated in Defender XDR.
    fr: |-
      Defender for Containers protège AKS, EKS et GKE via les connecteurs Azure, AWS et GCP, ainsi que les clusters locaux une fois connectés en tant que Kubernetes compatible Azure Arc. Un seul plan fournit les recommandations de posture, l'évaluation des vulnérabilités et la détection des menaces à l'exécution fondée sur le capteur, et ses alertes sont corrélées dans Defender XDR.
  options:
    a:
      en: |-
        Defender CSPM provides posture management but no runtime threat detection for the clusters, and it doesn't cover the on-premises clusters.
      fr: |-
        Defender CSPM fournit la gestion de la posture, mais aucune détection des menaces à l'exécution pour les clusters, et il ne couvre pas les clusters locaux.
    b:
      en: |-
        Sentinel can analyze collected logs, but it provides neither workload runtime protection nor vulnerability findings, and it adds custom detection work.
      fr: |-
        Sentinel peut analyser les journaux collectés, mais il ne fournit ni protection des charges de travail à l'exécution ni résultats de vulnérabilité, et il ajoute un travail de détection personnalisé.
    c:
      en: |-
        Azure Policy for Kubernetes hardens the data plane by checking API requests; it doesn't detect threats or scan images.
      fr: |-
        Azure Policy pour Kubernetes renforce le plan de données en vérifiant les requêtes d'API ; il ne détecte pas les menaces et n'analyse pas les images.
references:
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
  - title: Enable Defender for Containers in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-enable-plan
