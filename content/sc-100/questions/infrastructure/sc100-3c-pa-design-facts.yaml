id: sc100-3c-pa-design-facts
objective: "3.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is evaluating Microsoft Entra Private Access to replace the VPN used to reach applications in its datacenter. The network team is concerned about the firewall changes and the migration path from broad access to per-application access.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders évalue Accès privé Microsoft Entra pour remplacer le VPN utilisé pour atteindre les applications de son centre de données. L'équipe réseau s'inquiète des modifications de pare-feu et du chemin de migration d'un accès large vers un accès par application.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The private network connectors make only outbound connections, so no inbound port has to be opened on the datacenter firewall.", fr: "Les connecteurs de réseau privé n'établissent que des connexions sortantes : aucun port entrant ne doit être ouvert sur le pare-feu du centre de données." } }
    - { id: b, text: { en: "When a segment is moved from Quick Access to a Global Secure Access app, users assigned only to Quick Access keep their access to it.", fr: "Quand un segment passe de Quick Access à une application Global Secure Access, les utilisateurs attribués uniquement à Quick Access en conservent l'accès." } }
    - { id: c, text: { en: "App Discovery lists the application segments that users reach through Quick Access, which helps create per-app access applications.", fr: "La découverte d'applications liste les segments d'application que les utilisateurs atteignent via Quick Access, ce qui aide à créer des applications d'accès par application." } }
    - { id: d, text: { en: "Private Access can publish only HTTP and HTTPS applications, so SMB and RDP still require the VPN.", fr: "Accès privé ne peut publier que des applications HTTP et HTTPS : SMB et RDP exigent toujours le VPN." } }
    - { id: e, text: { en: "Users can be granted access to a Private Access app through nested groups of the assigned group.", fr: "Les utilisateurs peuvent obtenir l'accès à une application d'Accès privé par des groupes imbriqués dans le groupe attribué." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Private network connectors communicate with the service over outbound connections only, so the datacenter needs no inbound rule. App Discovery analyzes the traffic that flows through Quick Access and shows the destinations, ports and users, from which administrators create per-app applications.
    fr: |-
      Les connecteurs de réseau privé communiquent avec le service uniquement par des connexions sortantes : le centre de données n'a besoin d'aucune règle entrante. La découverte d'applications analyse le trafic qui passe par Quick Access et affiche les destinations, les ports et les utilisateurs, à partir desquels les administrateurs créent des applications par application.
  options:
    b:
      en: |-
        The segment of the Global Secure Access app takes priority, and Quick Access no longer processes its traffic; users must be assigned to the new app.
      fr: |-
        Le segment de l'application Global Secure Access a priorité, et Quick Access ne traite plus son trafic ; les utilisateurs doivent être attribués à la nouvelle application.
    d:
      en: |-
        Private Access publishes TCP and UDP applications by IP address, FQDN and port, including SMB (445), RDP (3389) and SSH (22).
      fr: |-
        Accès privé publie des applications TCP et UDP par adresse IP, FQDN et port, y compris SMB (445), RDP (3389) et SSH (22).
    e:
      en: |-
        Nested groups aren't supported: users must be assigned directly or be direct members of an assigned group.
      fr: |-
        Les groupes imbriqués ne sont pas pris en charge : les utilisateurs doivent être attribués directement ou être membres directs d'un groupe attribué.
references:
  - title: How to configure private network connectors for Microsoft Entra Private Access and Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-connectors
  - title: Application discovery for Global Secure Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-application-discovery
