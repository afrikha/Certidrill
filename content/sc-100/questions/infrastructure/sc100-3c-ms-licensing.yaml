id: sc100-3c-ms-licensing
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has 2,500 users licensed for Microsoft 365 E3, which includes Microsoft Entra ID P1. No other Microsoft Entra license is assigned.

    Tailspin plans to deploy the Global Secure Access client with only the Microsoft traffic forwarding profile, to use the compliant network check and source IP restoration for Microsoft 365 traffic.

    Which additional license should you recommend? The solution must minimize costs.
  fr: |
    Tailspin Toys compte 2 500 utilisateurs disposant de licences Microsoft 365 E3, qui incluent Microsoft Entra ID P1. Aucune autre licence Microsoft Entra n'est attribuée.

    Tailspin prévoit de déployer le client Global Secure Access avec uniquement le profil de transfert du trafic Microsoft, pour utiliser la vérification du réseau conforme et la restauration de l'adresse IP source pour le trafic Microsoft 365.

    Quelle licence supplémentaire devez-vous recommander ? La solution doit réduire les coûts au minimum.
body:
  options:
    - { id: a, text: { en: "Microsoft Entra Suite", fr: "Microsoft Entra Suite" } }
    - { id: b, text: { en: "Microsoft Entra Internet Access", fr: "Microsoft Entra Internet Access" } }
    - { id: c, text: { en: "No additional license", fr: "Aucune licence supplémentaire" } }
    - { id: d, text: { en: "Microsoft Entra ID P2", fr: "Microsoft Entra ID P2" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Microsoft Entra Internet Access for Microsoft services, which uses the Microsoft traffic forwarding profile, is included in Microsoft Entra ID P1 and P2. The P1 license that comes with Microsoft 365 E3 is enough for the compliant network check and source IP restoration.
    fr: |-
      Accès Internet Microsoft Entra pour les services Microsoft, qui utilise le profil de transfert du trafic Microsoft, est inclus dans Microsoft Entra ID P1 et P2. La licence P1 fournie avec Microsoft 365 E3 suffit pour la vérification du réseau conforme et la restauration de l'adresse IP source.
  options:
    a:
      en: |-
        Microsoft Entra Suite adds Internet Access, Private Access and other capabilities that the scenario doesn't need.
      fr: |-
        Microsoft Entra Suite ajoute Internet Access, Private Access et d'autres fonctionnalités dont le scénario n'a pas besoin.
    b:
      en: |-
        The Internet Access license is needed for internet and SaaS traffic, not for the Microsoft traffic profile.
      fr: |-
        La licence Internet Access est nécessaire pour le trafic Internet et SaaS, pas pour le profil de trafic Microsoft.
    d:
      en: |-
        P2 isn't required: the Microsoft traffic profile features are included from P1.
      fr: |-
        P2 n'est pas nécessaire : les fonctionnalités du profil de trafic Microsoft sont incluses dès P1.
references:
  - title: What is Global Secure Access?
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access
  - title: Source IP restoration
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-source-ip-restoration
