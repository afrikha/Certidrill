id: sc100-cs1a-tenant-restrictions
objective: "3.4.3"
type: single
caseStudy: sc100-cs1a-humongous
difficulty: 3
status: draft
stem:
  en: |-
    You need to recommend a solution that meets the network requirements. What should you include in the recommendation?
  fr: |-
    Vous devez recommander une solution qui respecte les exigences réseau. Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "Configure the inbound B2B collaboration settings of the cross-tenant access settings to allow only adatumre.com", fr: "Configurer les paramètres de collaboration B2B entrante des paramètres d'accès interlocataire pour n'autoriser que adatumre.com" } }
    - { id: b, text: { en: "Create a tenant restrictions v2 policy that allows adatumre.com, and have the on-premises proxy insert the tenant restrictions header", fr: "Créer une stratégie de restrictions de locataire v2 qui autorise adatumre.com, et faire insérer l'en-tête des restrictions de locataire par le proxy local" } }
    - { id: c, text: { en: "Create a tenant restrictions v2 policy that allows adatumre.com, enable the Microsoft traffic profile and turn on universal tenant restrictions", fr: "Créer une stratégie de restrictions de locataire v2 qui autorise adatumre.com, activer le profil de trafic Microsoft et activer les restrictions de locataire universelles" } }
    - { id: d, text: { en: "Enable the Private Access profile and publish the Microsoft Entra ID endpoints of humongousins.com and adatumre.com by using Quick Access", fr: "Activer le profil Private Access et publier les points de terminaison Microsoft Entra ID de humongousins.com et de adatumre.com avec Quick Access" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Universal tenant restrictions, part of Microsoft Entra Internet Access for Microsoft services, apply the tenant restrictions v2 policy to every device that runs the Global Secure Access client, without routing traffic through a company proxy. With the Microsoft traffic profile enabled, the laptops can sign in only to the tenants that the policy authorizes, wherever the users work.
    fr: |-
      Les restrictions de locataire universelles, qui font partie de Microsoft Entra Internet Access pour les services Microsoft, appliquent la stratégie de restrictions de locataire v2 à tous les appareils qui exécutent le client Global Secure Access, sans faire passer le trafic par un proxy d'entreprise. Une fois le profil de trafic Microsoft activé, les ordinateurs portables ne peuvent se connecter qu'aux locataires autorisés par la stratégie, où que travaillent les utilisateurs.
  options:
    a:
      en: |-
        Inbound settings control how users from other tenants access Humongous resources; they do not stop Humongous laptops from signing in with accounts of other tenants.
      fr: |-
        Les paramètres entrants contrôlent la façon dont les utilisateurs d'autres locataires accèdent aux ressources de Humongous ; ils n'empêchent pas les ordinateurs portables de Humongous de se connecter avec des comptes d'autres locataires.
    b:
      en: |-
        A proxy protects only the traffic that passes through it, so laptops at home or in hotels are not covered, and Humongous does not want a corporate proxy.
      fr: |-
        Un proxy ne protège que le trafic qui le traverse : les ordinateurs portables à domicile ou à l'hôtel ne sont pas couverts, et Humongous ne veut pas de proxy d'entreprise.
    d:
      en: |-
        Private Access provides access to private, internal resources; it does not enforce which tenants users can sign in to.
      fr: |-
        Private Access donne accès à des ressources internes privées ; il n'impose pas les locataires auxquels les utilisateurs peuvent se connecter.
references:
  - title: Turn on Universal Tenant Restrictions
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-universal-tenant-restrictions
