id: sc100-3c-swg-branch-baseline
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders connects 40 branch offices to Global Secure Access as remote networks. Some branch devices, such as kiosks and printers, don't run the Global Secure Access client and aren't used by a signed-in user.

    The security team wants malicious and adult web categories blocked for all Internet Access traffic, including the remote network traffic, as a catch-all that doesn't depend on Conditional Access assignments.

    What should you recommend?
  fr: |
    Northwind Traders connecte 40 succursales à Global Secure Access en tant que réseaux distants. Certains appareils des succursales, comme des bornes et des imprimantes, n'exécutent pas le client Global Secure Access et ne sont pas utilisés par un utilisateur connecté.

    L'équipe de sécurité veut bloquer les catégories web malveillantes et pour adultes pour tout le trafic d'accès Internet, y compris le trafic des réseaux distants, comme règle fourre-tout qui ne dépend pas des attributions d'accès conditionnel.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A security profile linked by a Conditional Access policy that targets all users", fr: "Un profil de sécurité lié par une stratégie d'accès conditionnel qui cible tous les utilisateurs" } }
    - { id: b, text: { en: "A filtering policy that blocks the categories, linked to the baseline profile", fr: "Une stratégie de filtrage qui bloque les catégories, liée au profil de base" } }
    - { id: c, text: { en: "A Conditional Access policy that requires a compliant network for all resources", fr: "Une stratégie d'accès conditionnel qui exige un réseau conforme pour toutes les ressources" } }
    - { id: d, text: { en: "Universal tenant restrictions enabled for the remote networks", fr: "Les restrictions de locataire universelles activées pour les réseaux distants" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The baseline profile applies to all Internet Access traffic in the tenant, including remote network traffic, without a Conditional Access policy. It runs at the lowest priority, so it acts as a catch-all even when another profile matches a user.
    fr: |-
      Le profil de base s'applique à tout le trafic d'accès Internet du locataire, y compris le trafic des réseaux distants, sans stratégie d'accès conditionnel. Il s'exécute à la priorité la plus basse : il sert de règle fourre-tout même quand un autre profil correspond à un utilisateur.
  options:
    a:
      en: |-
        A profile linked by Conditional Access applies to the users the policy targets, so traffic from devices without a signed-in user isn't covered.
      fr: |-
        Un profil lié par l'accès conditionnel s'applique aux utilisateurs ciblés par la stratégie : le trafic des appareils sans utilisateur connecté n'est pas couvert.
    c:
      en: |-
        The compliant network check controls access to Microsoft Entra-integrated apps; it doesn't filter web categories.
      fr: |-
        La vérification du réseau conforme contrôle l'accès aux applications intégrées à Microsoft Entra ; elle ne filtre pas les catégories web.
    d:
      en: |-
        Universal tenant restrictions limit the Microsoft Entra tenants users can sign in to; they don't block web categories.
      fr: |-
        Les restrictions de locataire universelles limitent les locataires Microsoft Entra auxquels les utilisateurs peuvent se connecter ; elles ne bloquent pas de catégories web.
references:
  - title: Learn about Microsoft Entra Internet Access for all apps
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-internet-access
