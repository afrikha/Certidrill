id: sc100-3c-aks-statements
objective: "3.3.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware runs Azure Kubernetes Service (AKS) clusters that use Microsoft Entra integration with Azure RBAC for Kubernetes authorization, and Kubernetes clusters in its own datacenter that are connected to Azure Arc.

    You are reviewing the cluster security design.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute des clusters Azure Kubernetes Service (AKS) qui utilisent l'intégration Microsoft Entra avec Azure RBAC pour l'autorisation Kubernetes, ainsi que des clusters Kubernetes dans son propre centre de données, connectés à Azure Arc.

    Vous examinez la conception de sécurité des clusters.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Azure Policy for Kubernetes can enforce the same pod security rules on the Azure Arc-enabled clusters in the datacenter as on the AKS clusters.
        fr: |-
          Azure Policy pour Kubernetes peut imposer les mêmes règles de sécurité des pods sur les clusters compatibles Azure Arc du centre de données que sur les clusters AKS.
    - id: s2
      text:
        en: |-
          A user who holds only the Azure Kubernetes Service Cluster User Role can create deployments in every namespace of an AKS cluster.
        fr: |-
          Un utilisateur qui ne détient que le rôle Azure Kubernetes Service Cluster User Role peut créer des déploiements dans tous les espaces de noms d'un cluster AKS.
    - id: s3
      text:
        en: |-
          A network security group on the node subnet can block traffic between two pods of different namespaces that run on the same node.
        fr: |-
          Un groupe de sécurité réseau sur le sous-réseau des nœuds peut bloquer le trafic entre deux pods d'espaces de noms différents qui s'exécutent sur le même nœud.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      Azure Policy for Kubernetes extends to Azure Arc-enabled Kubernetes clusters, so the same pod security policies govern AKS and on-premises clusters. The Azure Kubernetes Service Cluster User Role only lets a user download the kubeconfig; Kubernetes API operations still need a Kubernetes authorization role, such as an Azure RBAC role for Kubernetes. Traffic between pods on the same node never crosses the subnet NSG, so namespace isolation requires Kubernetes network policies.
    fr: |-
      Azure Policy pour Kubernetes s'étend aux clusters Kubernetes compatibles Azure Arc : les mêmes stratégies de sécurité des pods régissent les clusters AKS et locaux. Le rôle Azure Kubernetes Service Cluster User Role permet seulement de télécharger le kubeconfig ; les opérations sur l'API Kubernetes exigent encore un rôle d'autorisation Kubernetes, comme un rôle Azure RBAC pour Kubernetes. Le trafic entre pods d'un même nœud ne traverse jamais le NSG du sous-réseau : l'isolation des espaces de noms exige des stratégies réseau Kubernetes.
references:
  - title: Security concepts for applications and clusters in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-security
  - title: Use Microsoft Entra ID authorization for the Kubernetes API in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
