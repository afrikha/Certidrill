id: sc100-3a-score-weighting
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a management group named MG1 that contains two subscriptions. In Microsoft Defender for Cloud, the classic secure score of the subscriptions is as follows:

    - **Sub-Prod**: 1,200 applicable resources, secure score 40 %
    - **Sub-Lab**: 30 applicable resources, secure score 90 %

    The CFO expects the secure score of MG1 to be about 65 %, the average of the two values, and wants to use it as a quarterly KPI.

    What should you tell the CFO about the secure score of MG1?
  fr: |
    Tailspin Toys dispose d'un groupe d'administration nommé MG1 qui contient deux abonnements. Dans Microsoft Defender for Cloud, le degré de sécurisation classique des abonnements est le suivant :

    - **Sub-Prod** : 1 200 ressources applicables, degré de sécurisation de 40 %
    - **Sub-Lab** : 30 ressources applicables, degré de sécurisation de 90 %

    Le directeur financier s'attend à ce que le degré de sécurisation de MG1 soit d'environ 65 %, la moyenne des deux valeurs, et veut l'utiliser comme indicateur trimestriel.

    Que devez-vous indiquer au directeur financier au sujet du degré de sécurisation de MG1 ?
body:
  options:
    - id: a
      text: { en: "It is about 65 %, because the score of a management group is the average of its subscription scores", fr: "Il est d'environ 65 %, car le score d'un groupe d'administration est la moyenne des scores de ses abonnements" }
    - id: b
      text: { en: "It is about 90 %, because the score of a management group is the score of its best subscription", fr: "Il est d'environ 90 %, car le score d'un groupe d'administration est celui de son meilleur abonnement" }
    - id: c
      text: { en: "It is close to 40 %, because each subscription is weighted by its number of healthy and unhealthy resources", fr: "Il est proche de 40 %, car chaque abonnement est pondéré par son nombre de ressources saines et non saines" }
    - id: d
      text: { en: "It isn't available, because the secure score is calculated only for individual subscriptions", fr: "Il n'est pas disponible, car le degré de sécurisation n'est calculé que pour des abonnements individuels" }
answer:
  optionId: c
explanation:
  correct:
    en: When several subscriptions or connectors are combined, Defender for Cloud weights each one with a linear model based on its count of healthy and unhealthy resources. The aggregated score is a weighted sum, not a simple average of the percentages, so Sub-Prod with 1,200 resources dominates and the MG1 score is close to 40 %.
    fr: Quand plusieurs abonnements ou connecteurs sont regroupés, Defender for Cloud pondère chacun avec un modèle linéaire fondé sur son nombre de ressources saines et non saines. Le score agrégé est une somme pondérée, pas une simple moyenne des pourcentages ; Sub-Prod, avec 1 200 ressources, domine donc et le score de MG1 est proche de 40 %.
  options:
    a:
      en: The aggregated score isn't a simple average of the subscription percentages.
      fr: Le score agrégé n'est pas une simple moyenne des pourcentages des abonnements.
    b:
      en: No rule gives a management group the score of its best subscription; all applicable resources are counted.
      fr: Aucune règle ne donne à un groupe d'administration le score de son meilleur abonnement ; toutes les ressources applicables sont comptées.
    d:
      en: The secure score page shows the score by subscription and by management group.
      fr: La page du degré de sécurisation présente le score par abonnement et par groupe d'administration.
references:
  - title: Cloud Secure Score in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
