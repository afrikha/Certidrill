id: sc100-3b-svc-tools-map
objective: "3.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Media runs IaaS virtual machines in Azure and AWS, PaaS services in Azure, and uses Salesforce. You are specifying how each security baseline will be assessed or enforced.

    Which solution should you specify for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam Media exécute des machines virtuelles IaaS dans Azure et AWS, des services PaaS dans Azure, et utilise Salesforce. Vous spécifiez comment chaque base de référence de sécurité sera évaluée ou appliquée.

    Quelle solution devez-vous spécifier pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sspm, text: { en: "Defender for Cloud Apps security recommendations (SSPM)", fr: "Recommandations de sécurité de Defender for Cloud Apps (SSPM)" } }
    - { id: mc, text: { en: "Azure Policy machine configuration", fr: "Configuration des machines Azure Policy" } }
    - { id: deny, text: { en: "Azure Policy with the Deny effect", fr: "Azure Policy avec l'effet Deny" } }
    - { id: mdc, text: { en: "Defender for Cloud with the Microsoft cloud security benchmark", fr: "Defender for Cloud avec le benchmark de sécurité cloud Microsoft" } }
    - { id: intune, text: { en: "Intune security baselines", fr: "Bases de référence de sécurité Intune" } }
    - { id: sentinel, text: "Microsoft Sentinel" }
  targets:
    - { id: t1, text: { en: "Report misconfigured security settings of the Salesforce tenant", fr: "Signaler les paramètres de sécurité mal configurés du locataire Salesforce" } }
    - { id: t2, text: { en: "Audit operating system settings inside the Azure VMs and the Azure Arc-enabled AWS VMs", fr: "Auditer les paramètres du système d'exploitation dans les machines virtuelles Azure et les machines virtuelles AWS avec Azure Arc" } }
    - { id: t3, text: { en: "Prevent the creation of PaaS resources that break the baseline", fr: "Empêcher la création de ressources PaaS qui ne respectent pas la base de référence" } }
    - { id: t4, text: { en: "Continuously assess the Azure and AWS resources against Microsoft's cloud security controls", fr: "Évaluer en continu les ressources Azure et AWS par rapport aux contrôles de sécurité cloud de Microsoft" } }
answer:
  mapping: { t1: sspm, t2: mc, t3: deny, t4: mdc }
explanation:
  correct:
    en: |
      SSPM in Defender for Cloud Apps assesses the security configuration of connected SaaS apps such as Salesforce. Machine configuration audits or configures operating system settings of Azure and Arc-enabled machines. A policy with the Deny effect blocks noncompliant resource creation. Defender for Cloud assesses Azure and multicloud resources against the Microsoft cloud security benchmark. Intune baselines target managed Windows devices, and Microsoft Sentinel is a SIEM, not a posture assessment tool.
    fr: |
      La SSPM de Defender for Cloud Apps évalue la configuration de sécurité des applications SaaS connectées comme Salesforce. La configuration des machines audite ou configure les paramètres du système d'exploitation des machines Azure et des machines avec Azure Arc. Une stratégie avec l'effet Deny bloque la création de ressources non conformes. Defender for Cloud évalue les ressources Azure et multicloud par rapport au benchmark de sécurité cloud Microsoft. Les bases de référence Intune ciblent les appareils Windows gérés, et Microsoft Sentinel est un SIEM, pas un outil d'évaluation de la posture.
references:
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
  - title: SaaS security posture management (SSPM) overview
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/security-saas
