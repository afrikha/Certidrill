id: sc100-3c-net-design-gaps
objective: "3.4.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank proposes the network design shown in the following table for a customer portal hosted in Azure.

    The security requirements include:

    - Azure SQL Database must not be reachable from the internet.
    - No management port of any VM may be exposed to the internet.
    - Web traffic must be inspected for OWASP attacks before it reaches the web tier.

    Answer each prompt by selecting the component whose proposed configuration fails the requirement.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank propose la conception réseau décrite dans le tableau suivant pour un portail client hébergé dans Azure.

    Les exigences de sécurité incluent :

    - Azure SQL Database ne doit pas être joignable depuis Internet.
    - Aucun port de gestion d'une machine virtuelle ne doit être exposé à Internet.
    - Le trafic web doit être inspecté contre les attaques OWASP avant d'atteindre le niveau web.

    Répondez à chaque consigne en sélectionnant le composant dont la configuration proposée ne respecte pas l'exigence.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Fails the requirement for Azure SQL Database", fr: "Ne respecte pas l'exigence relative à Azure SQL Database" }
    - id: p2
      text: { en: "Fails the requirement for management ports", fr: "Ne respecte pas l'exigence relative aux ports de gestion" }
  grid:
    header: [{ en: "Component", fr: "Composant" }, { en: "Proposed configuration", fr: "Configuration proposée" }]
    rows:
      - [{ text: { en: "Web entry point", fr: "Point d'entrée web" }, area: web }, { text: { en: "Application Gateway WAF_v2 with a WAF policy in Prevention mode, in front of the web tier", fr: "Application Gateway WAF_v2 avec une stratégie WAF en mode Prévention, devant le niveau web" } }]
      - [{ text: { en: "Web tier VMs", fr: "Machines virtuelles du niveau web" }, area: vms }, { text: { en: "No public IP address; NSG allows TCP 443 only from the Application Gateway subnet", fr: "Aucune adresse IP publique ; le NSG n'autorise TCP 443 que depuis le sous-réseau d'Application Gateway" } }]
      - [{ text: { en: "Jump server", fr: "Serveur de rebond" }, area: jump }, { text: { en: "Public IP address; NSG allows TCP 3389 from the operations team's office IP range", fr: "Adresse IP publique ; le NSG autorise TCP 3389 depuis la plage d'adresses IP du bureau de l'équipe d'exploitation" } }]
      - [{ text: { en: "Azure SQL Database", fr: "Azure SQL Database" }, area: sql }, { text: { en: "Private endpoint in the data subnet; public network access enabled with a firewall rule for the office IP range", fr: "Point de terminaison privé dans le sous-réseau de données ; accès au réseau public activé avec une règle de pare-feu pour la plage d'adresses IP du bureau" } }]
      - [{ text: { en: "Outbound traffic", fr: "Trafic sortant" }, area: egress }, { text: { en: "User-defined route 0.0.0.0/0 to Azure Firewall Premium in the hub", fr: "Itinéraire défini par l'utilisateur 0.0.0.0/0 vers le Pare-feu Azure Premium dans le hub" } }]
answer:
  values: { p1: sql, p2: jump }
explanation:
  correct:
    en: |-
      A private endpoint doesn't close the public endpoint of Azure SQL Database: with public network access still enabled, the server remains reachable from the internet for the allowed range, so public network access must be disabled. The jump server exposes RDP on a public IP address, even if only to one IP range; Azure Bastion would remove that exposure. The Application Gateway WAF_v2 in Prevention mode already meets the OWASP requirement.
    fr: |-
      Un point de terminaison privé ne ferme pas le point de terminaison public d'Azure SQL Database : avec l'accès au réseau public toujours activé, le serveur reste joignable depuis Internet pour la plage autorisée, il faut donc désactiver l'accès au réseau public. Le serveur de rebond expose RDP sur une adresse IP publique, même pour une seule plage d'adresses ; Azure Bastion supprimerait cette exposition. L'Application Gateway WAF_v2 en mode Prévention respecte déjà l'exigence OWASP.
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: What is Azure Bastion?
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
