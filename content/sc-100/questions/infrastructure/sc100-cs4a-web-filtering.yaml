id: sc100-cs4a-web-filtering
objective: "3.4.2"
type: single
caseStudy: sc100-cs4a-blue-yonder-airlines
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a solution that meets the web access requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui respecte les exigences relatives à l'accès web.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Web content filtering in Defender for Endpoint, with a policy that blocks the categories for every device group except the Fraud-Investigations devices", fr: "Le filtrage du contenu web de Defender for Endpoint, avec une stratégie qui bloque les catégories pour chaque groupe d'appareils sauf les appareils de Fraud-Investigations" } }
    - { id: b, text: { en: "Azure Firewall Premium in a hub virtual network, with web category rules and forced tunneling of the airport offices' internet traffic to the hub", fr: "Pare-feu Azure Premium dans un réseau virtuel hub, avec des règles de catégories web et un tunneling forcé du trafic Internet des bureaux d'aéroport vers le hub" } }
    - { id: c, text: { en: "Microsoft Entra Internet Access with the Global Secure Access client, and a security profile that blocks the categories, linked by a Conditional Access policy that excludes Fraud-Investigations", fr: "Microsoft Entra Internet Access avec le client Global Secure Access, et un profil de sécurité qui bloque les catégories, lié par une stratégie d'accès conditionnel qui exclut Fraud-Investigations" } }
    - { id: d, text: { en: "Microsoft Entra Internet Access for Microsoft services with the Global Secure Access client, and universal tenant restrictions that exclude Fraud-Investigations", fr: "Microsoft Entra Internet Access pour les services Microsoft avec le client Global Secure Access, et des restrictions de locataire universelles qui excluent Fraud-Investigations" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Microsoft Entra Internet Access is an identity-centric secure web gateway: the Global Secure Access client forwards internet traffic from wherever the user works, so the on-premises proxy is no longer needed. Web content filtering policies block web categories, and a Conditional Access policy that targets All internet resources with Global Secure Access links the security profile to users and groups. The exception therefore follows the signed-in user, even on shared workstations.
    fr: |-
      Microsoft Entra Internet Access est une passerelle web sécurisée centrée sur l'identité : le client Global Secure Access transfère le trafic Internet depuis n'importe quel lieu de travail de l'utilisateur, ce qui rend le proxy local inutile. Les stratégies de filtrage du contenu web bloquent des catégories web, et une stratégie d'accès conditionnel qui cible All internet resources with Global Secure Access lie le profil de sécurité à des utilisateurs et des groupes. L'exception suit donc l'utilisateur connecté, même sur des postes de travail partagés.
  options:
    a:
      en: |-
        Defender for Endpoint web content filtering policies target device groups. Fraud investigators share workstations with other analysts, so a device-based exception can't separate them.
      fr: |-
        Les stratégies de filtrage du contenu web de Defender for Endpoint ciblent des groupes d'appareils. Les enquêteurs de fraude partagent des postes de travail avec d'autres analystes : une exception basée sur l'appareil ne peut pas les distinguer.
    b:
      en: |-
        Azure Firewall filters only the traffic that passes through the Azure virtual network: crew members in hotels and at home aren't covered, and its rules don't apply per user group.
      fr: |-
        Pare-feu Azure ne filtre que le trafic qui traverse le réseau virtuel Azure : les membres d'équipage à l'hôtel et à domicile ne sont pas couverts, et ses règles ne s'appliquent pas par groupe d'utilisateurs.
    d:
      en: |-
        The Microsoft traffic profile handles only Microsoft 365 and Microsoft Entra traffic, and tenant restrictions control which tenants users sign in to, not web categories.
      fr: |-
        Le profil de trafic Microsoft ne traite que le trafic Microsoft 365 et Microsoft Entra, et les restrictions de locataire contrôlent les locataires auxquels les utilisateurs se connectent, pas les catégories web.
references:
  - title: How to configure Global Secure Access web content filtering
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-web-content-filtering
