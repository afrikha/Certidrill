id: sc100-3a-arc-hardening-statements
objective: "3.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. plans to connect its on-premises Active Directory Domain Services (AD DS) domain controllers to Azure Arc so that Microsoft Defender for Cloud and the Azure Monitor Agent can cover them. The identity team considers the domain controllers as tier 0 assets.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. prévoit de connecter ses contrôleurs de domaine Active Directory Domain Services (AD DS) locaux à Azure Arc pour que Microsoft Defender for Cloud et l'agent Azure Monitor puissent les couvrir. L'équipe des identités considère les contrôleurs de domaine comme des ressources de niveau 0.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can configure the Connected Machine agent on each domain controller to allow only the Azure Monitor Agent and Defender for Endpoint extensions.
        fr: Vous pouvez configurer l'agent Connected Machine de chaque contrôleur de domaine pour qu'il n'autorise que les extensions Azure Monitor Agent et Defender for Endpoint.
    - id: s2
      text:
        en: You can configure the Connected Machine agent to run under a domain service account that the identity team manages.
        fr: Vous pouvez configurer l'agent Connected Machine pour qu'il s'exécute sous un compte de service de domaine géré par l'équipe des identités.
    - id: s3
      text:
        en: The administrators of the subscription that contains the Arc-enabled domain controllers should be treated as equivalent to tier 0 administrators.
        fr: Les administrateurs de l'abonnement qui contient les contrôleurs de domaine compatibles Arc doivent être considérés comme équivalents à des administrateurs de niveau 0.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The extension manager of the Connected Machine agent supports an allowlist, so a domain controller can be limited to the extensions it needs. The agent uses local, system-managed identities and doesn't support domain-joined or user-provided service accounts. Because subscription and management group administrators can add role assignments or apply policies that change the server, they should be treated as equivalent to local administrators of the tier 0 assets, ideally in a dedicated subscription with few persistent administrators.
    fr: Le gestionnaire d'extensions de l'agent Connected Machine prend en charge une liste d'autorisation ; un contrôleur de domaine peut donc être limité aux extensions dont il a besoin. L'agent utilise des identités locales gérées par le système et ne prend pas en charge les comptes de service joints au domaine ou fournis par l'utilisateur. Comme les administrateurs d'abonnement et de groupe d'administration peuvent ajouter des attributions de rôles ou appliquer des stratégies qui modifient le serveur, ils doivent être considérés comme équivalents aux administrateurs locaux des ressources de niveau 0, idéalement dans un abonnement dédié avec peu d'administrateurs permanents.
  options:
    s2:
      en: The service account model of the agent is intentional and not configurable.
      fr: Le modèle de compte de service de l'agent est intentionnel et n'est pas configurable.
references:
  - title: Security overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-overview
