id: sc100-3b-iotw-statements
objective: "3.3.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Northwind Fleet is reviewing the access design of an Azure IoT hub that collects GPS data from delivery trucks. The security team wants to replace shared keys with Microsoft Entra ID wherever possible and to apply least privilege.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Fleet examine la conception des accès d'un hub IoT Azure qui collecte les données GPS de camions de livraison. L'équipe de sécurité veut remplacer les clés partagées par Microsoft Entra ID partout où c'est possible et appliquer le moindre privilège.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The trucks can authenticate with Microsoft Entra ID when they send device-to-cloud messages to the IoT hub.
        fr: Les camions peuvent s'authentifier avec Microsoft Entra ID quand ils envoient des messages appareil-vers-cloud au hub IoT.
    - id: s2
      text:
        en: An Azure role that allows writing to the IoT hub resource can set or rotate the shared access policy keys, even if it doesn't allow listing them.
        fr: Un rôle Azure qui autorise l'écriture sur la ressource du hub IoT peut définir ou renouveler les clés des stratégies d'accès partagé, même s'il n'autorise pas à les lister.
    - id: s3
      text:
        en: A dashboard application that only reads device twins and data plane properties can be given the IoT Hub Data Reader role.
        fr: Une application de tableau de bord qui lit uniquement les jumeaux d'appareil et les propriétés du plan de données peut recevoir le rôle IoT Hub Data Reader.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Microsoft Entra ID authenticates calls to the IoT Hub service APIs only; device APIs such as device-to-cloud messages use symmetric keys or X.509 certificates. The write permission on the IoT hub resource can set or rotate any shared access policy key, so it must be limited to trusted principals and audited. IoT Hub Data Reader grants read access to data plane properties, which fits a read-only dashboard.
    fr: |
      Microsoft Entra ID authentifie uniquement les appels aux API de service d'IoT Hub ; les API d'appareil comme les messages appareil-vers-cloud utilisent des clés symétriques ou des certificats X.509. L'autorisation d'écriture sur la ressource du hub IoT peut définir ou renouveler n'importe quelle clé de stratégie d'accès partagé ; elle doit donc être réservée à des principaux de confiance et auditée. IoT Hub Data Reader accorde un accès en lecture aux propriétés du plan de données, ce qui convient à un tableau de bord en lecture seule.
references:
  - title: Control access to IoT Hub by using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/iot-hub/iot-hub-dev-guide-azure-ad-rbac
