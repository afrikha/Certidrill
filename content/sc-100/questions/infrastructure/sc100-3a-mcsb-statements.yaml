id: sc100-3a-mcsb-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is preparing a posture review of its Azure subscriptions and AWS accounts in Microsoft Defender for Cloud. The compliance team asks how the Microsoft cloud security benchmark (MCSB) and the regulatory compliance dashboard should be interpreted.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prépare une revue de la posture de ses abonnements Azure et de ses comptes AWS dans Microsoft Defender for Cloud. L'équipe conformité demande comment interpréter le benchmark de sécurité cloud Microsoft (MCSB) et le tableau de bord de conformité réglementaire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When an AWS account is connected to Defender for Cloud, the MCSB is enabled for that account by default.
        fr: Quand un compte AWS est connecté à Defender for Cloud, le MCSB est activé par défaut pour ce compte.
    - id: s2
      text:
        en: A control that Defender for Cloud can't assess automatically is shown as unavailable in the regulatory compliance dashboard.
        fr: Un contrôle que Defender for Cloud ne peut pas évaluer automatiquement apparaît comme indisponible dans le tableau de bord de conformité réglementaire.
    - id: s3
      text:
        en: Because the MCSB controls are mapped to PCI DSS v4, an account that passes every MCSB recommendation is compliant with PCI DSS v4.
        fr: Comme les contrôles du MCSB sont associés à PCI DSS v4, un compte qui satisfait toutes les recommandations du MCSB est conforme à PCI DSS v4.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: The MCSB is enabled by default for Azure subscriptions, AWS accounts and GCP projects; AWS accounts also get AWS Foundational Security Best Practices. Controls that can't be assessed automatically are greyed out as unavailable, because Defender for Cloud can't decide whether resources comply with them. A mapping between the MCSB and a framework means that Azure features can fully or partially address a requirement; it doesn't mean that implementing them makes you compliant.
    fr: Le MCSB est activé par défaut pour les abonnements Azure, les comptes AWS et les projets GCP ; les comptes AWS reçoivent aussi AWS Foundational Security Best Practices. Les contrôles qui ne peuvent pas être évalués automatiquement apparaissent grisés comme indisponibles, car Defender for Cloud ne peut pas déterminer si les ressources les respectent. Une association entre le MCSB et un référentiel signifie que des fonctionnalités Azure peuvent répondre totalement ou partiellement à une exigence ; elle ne signifie pas que leur mise en œuvre vous rend conforme.
  options:
    s3:
      en: The benchmark mappings indicate coverage, not compliance; a PCI DSS assessment still covers requirements outside the scope of the MCSB recommendations.
      fr: Les associations du benchmark indiquent une couverture, pas une conformité ; une évaluation PCI DSS couvre aussi des exigences hors du périmètre des recommandations du MCSB.
references:
  - title: Regulatory compliance in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
  - title: Overview of the Microsoft cloud security benchmark v2 (preview)
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/overview
