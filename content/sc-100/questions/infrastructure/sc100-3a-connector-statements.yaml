id: sc100-3a-connector-statements
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to connect its AWS accounts to Microsoft Defender for Cloud. The AWS security team must approve the integration and asks how the connection works.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de connecter ses comptes AWS à Microsoft Defender for Cloud. L'équipe de sécurité AWS doit approuver l'intégration et demande comment fonctionne la connexion.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The CSPM plan of the connector assesses the AWS resources through read-only calls to the AWS resource APIs.
        fr: Le plan CSPM du connecteur évalue les ressources AWS au moyen d'appels en lecture seule aux API de ressources AWS.
    - id: s2
      text:
        en: Defender for Cloud authenticates to AWS by using federated trust and short-lived credentials instead of stored long-lived secrets.
        fr: Defender for Cloud s'authentifie auprès d'AWS au moyen d'une approbation fédérée et d'informations d'identification de courte durée plutôt que de secrets de longue durée stockés.
    - id: s3
      text:
        en: The AWS accounts must be covered by Defender CSPM, because Foundational CSPM assesses only Azure subscriptions.
        fr: Les comptes AWS doivent être couverts par Defender CSPM, car Foundational CSPM n'évalue que les abonnements Azure.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: The CSPM plan of the AWS connector makes read-only calls to the AWS resource APIs, which are logged in CloudTrail if a trail records read events. Onboarding creates IAM roles and trust relationships so that Defender for Cloud uses federated trust and short-lived credentials. Foundational CSPM, the free tier, already includes multicloud coverage of AWS and GCP through agentless connections.
    fr: Le plan CSPM du connecteur AWS effectue des appels en lecture seule aux API de ressources AWS, journalisés dans CloudTrail si un journal de suivi enregistre les événements de lecture. L'intégration crée des rôles IAM et des relations d'approbation pour que Defender for Cloud utilise une approbation fédérée et des informations d'identification de courte durée. Foundational CSPM, le niveau gratuit, inclut déjà la couverture multicloud d'AWS et de GCP grâce à des connexions sans agent.
  options:
    s3:
      en: Foundational CSPM covers AWS accounts and GCP projects; Defender CSPM adds capabilities such as attack paths and regulatory standards.
      fr: Foundational CSPM couvre les comptes AWS et les projets GCP ; Defender CSPM ajoute des fonctionnalités comme les chemins d'attaque et les normes réglementaires.
references:
  - title: Connect your AWS Account
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
  - title: Microsoft Defender for Cloud Overview
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
