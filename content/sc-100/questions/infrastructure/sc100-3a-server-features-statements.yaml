id: sc100-3a-server-features-statements
objective: "3.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. enabled Defender for Servers Plan 2 on its Azure subscriptions and on its AWS and GCP connectors. None of the EC2 instances and Compute Engine VMs is onboarded to Azure Arc. The security architect checks which server requirements the design meets in each cloud.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. a activé Defender for Servers Plan 2 sur ses abonnements Azure et sur ses connecteurs AWS et GCP. Aucune instance EC2 ni machine virtuelle Compute Engine n'est intégrée à Azure Arc. L'architecte de sécurité vérifie quelles exigences relatives aux serveurs la conception respecte dans chaque cloud.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The network map of Defender for Servers shows the EC2 instances and their connections.
        fr: La carte réseau de Defender for Servers montre les instances EC2 et leurs connexions.
    - id: s2
      text:
        en: Just-in-time VM access can protect the management ports of the EC2 instances.
        fr: L'accès juste-à-temps aux machines virtuelles peut protéger les ports de gestion des instances EC2.
    - id: s3
      text:
        en: The Compute Engine VMs receive operating system baseline recommendations based on the Microsoft cloud security benchmark.
        fr: Les machines virtuelles Compute Engine reçoivent des recommandations de base de référence du système d'exploitation fondées sur le benchmark de sécurité cloud Microsoft.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: The network map of Defender for Servers Plan 2 is available for Azure only. Just-in-time VM access is available for Azure and AWS. Operating system baseline misconfigurations based on the MCSB are assessed in Azure, AWS and GCP only for machines onboarded with Azure Arc, so the Compute Engine VMs don't receive them in this design.
    fr: La carte réseau de Defender for Servers Plan 2 n'est disponible que pour Azure. L'accès juste-à-temps aux machines virtuelles est disponible pour Azure et AWS. Les erreurs de configuration de la base de référence du système d'exploitation fondées sur le MCSB ne sont évaluées dans Azure, AWS et GCP que pour les machines intégrées avec Azure Arc ; les machines virtuelles Compute Engine ne les reçoivent donc pas dans cette conception.
  options:
    s1:
      en: The network map covers Azure resources only.
      fr: La carte réseau ne couvre que les ressources Azure.
    s3:
      en: The baseline assessment requires the GCP VMs to be onboarded to Azure Arc.
      fr: L'évaluation de la base de référence exige que les machines virtuelles GCP soient intégrées à Azure Arc.
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
