id: sc100-3a-score-reader-role
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Defender XDR with Microsoft Defender unified role-based access control (RBAC) activated. A team of risk analysts must review Microsoft Secure Score and its recommended actions in the Microsoft Defender portal.

    The analysts must not be able to change any setting, and the solution must follow the principle of least privilege.

    What should you recommend?
  fr: |
    Contoso, Ltd. utilise Microsoft Defender XDR avec le contrôle d'accès en fonction du rôle (RBAC) unifié de Microsoft Defender activé. Une équipe d'analystes des risques doit examiner le Niveau de sécurité Microsoft et ses actions recommandées dans le portail Microsoft Defender.

    Les analystes ne doivent pouvoir modifier aucun paramètre, et la solution doit respecter le principe du moindre privilège.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Assign a custom unified RBAC role with the Exposure Management (read) permission", fr: "Attribuer un rôle RBAC unifié personnalisé avec l'autorisation Exposure Management (read)" }
    - id: b
      text: { en: "Assign the Global Reader role in Microsoft Entra ID", fr: "Attribuer le rôle Global Reader dans Microsoft Entra ID" }
    - id: c
      text: { en: "Assign the Security Administrator role in Microsoft Entra ID", fr: "Attribuer le rôle Security Administrator dans Microsoft Entra ID" }
    - id: d
      text: { en: "Assign a custom unified RBAC role with the Exposure Management (manage) permission", fr: "Attribuer un rôle RBAC unifié personnalisé avec l'autorisation Exposure Management (manage)" }
answer:
  optionId: a
explanation:
  correct:
    en: With unified RBAC, Microsoft recommends a custom role that has the Exposure Management (read) permission of the Security posture category, assigned to the Microsoft Security Exposure Management data source. It grants read access to Secure Score without any other administrative permission.
    fr: Avec le RBAC unifié, Microsoft recommande un rôle personnalisé disposant de l'autorisation Exposure Management (read) de la catégorie Security posture, attribué à la source de données Microsoft Security Exposure Management. Il accorde l'accès en lecture au Niveau de sécurité Microsoft sans aucune autre autorisation d'administration.
  options:
    c:
      en: Security Administrator can change Secure Score statuses and many security settings, which breaks the read-only and least privilege requirements.
      fr: Security Administrator peut modifier les états du Niveau de sécurité Microsoft et de nombreux paramètres de sécurité, ce qui contrevient aux exigences de lecture seule et de moindre privilège.
    b:
      en: Global Reader is read-only, but it grants read access across the whole tenant, which is broader than needed.
      fr: Global Reader est en lecture seule, mais il accorde l'accès en lecture à tout le locataire, ce qui est plus large que nécessaire.
    d:
      en: The manage permission lets users change data such as recommendation statuses and target scores, which the analysts must not do.
      fr: L'autorisation manage permet de modifier des données comme les états des recommandations et les scores cibles, ce que les analystes ne doivent pas faire.
references:
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
  - title: Prerequisites and support in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/prerequisites
