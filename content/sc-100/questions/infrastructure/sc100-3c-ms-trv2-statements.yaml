id: sc100-3c-ms-trv2-statements
objective: "3.4.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware configures a tenant restrictions v2 policy in its tenant, litware.com. The default policy blocks all external tenants, and a partner policy allows fabrikam.com. Universal tenant restrictions are turned on, and every Litware device, Windows and macOS, runs the Global Secure Access client.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware configure une stratégie de restrictions de locataire v2 dans son locataire, litware.com. La stratégie par défaut bloque tous les locataires externes, et une stratégie de partenaire autorise fabrikam.com. Les restrictions de locataire universelles sont activées, et chaque appareil de Litware, Windows et macOS, exécute le client Global Secure Access.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          When a Litware employee signs in to litware.com with a litware.com account, the tenant restrictions v2 policy is processed.
        fr: |-
          Quand un employé de Litware se connecte à litware.com avec un compte litware.com, la stratégie de restrictions de locataire v2 est traitée.
    - id: s2
      text:
        en: |-
          On a Litware macOS device, a user can't sign in with an account from a tenant other than litware.com or fabrikam.com, even though no corporate proxy is used.
        fr: |-
          Sur un appareil macOS de Litware, un utilisateur ne peut pas se connecter avec un compte d'un locataire autre que litware.com ou fabrikam.com, même si aucun proxy d'entreprise n'est utilisé.
    - id: s3
      text:
        en: |-
          To block personal Microsoft accounts, Litware can block them for selected applications, but it can't block them for selected users only.
        fr: |-
          Pour bloquer les comptes Microsoft personnels, Litware peut les bloquer pour des applications choisies, mais ne peut pas les bloquer pour certains utilisateurs seulement.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      Tenant restrictions v2 applies only when an identity from another tenant signs in or accesses resources; it isn't processed for users accessing their own tenant. Universal tenant restrictions enforce the policy through the Global Secure Access client on all platforms, without a corporate proxy, so only the allowed tenants remain available. Personal Microsoft accounts can be blocked per application, but user-level scoping isn't supported for them.
    fr: |-
      Les restrictions de locataire v2 ne s'appliquent que quand une identité d'un autre locataire se connecte ou accède à des ressources ; la stratégie n'est pas traitée pour les utilisateurs qui accèdent à leur propre locataire. Les restrictions de locataire universelles appliquent la stratégie par le client Global Secure Access sur toutes les plateformes, sans proxy d'entreprise : seuls les locataires autorisés restent accessibles. Les comptes Microsoft personnels peuvent être bloqués par application, mais la délimitation par utilisateur n'est pas prise en charge pour eux.
references:
  - title: Set up tenant restrictions v2
    url: https://learn.microsoft.com/en-us/entra/external-id/tenant-restrictions-v2
  - title: Turn on Universal Tenant Restrictions
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-universal-tenant-restrictions
