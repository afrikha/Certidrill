id: sc100-3b-laps-statements
objective: "3.2.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank is evaluating Windows LAPS for its Microsoft Entra joined Windows 11 devices. The passwords will be backed up to Microsoft Entra ID. The security team requires multifactor authentication for every administrator who recovers a password, enforced by Conditional Access.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank évalue Windows LAPS pour ses appareils Windows 11 joints à Microsoft Entra. Les mots de passe seront sauvegardés dans Microsoft Entra ID. L'équipe de sécurité exige l'authentification multifacteur pour chaque administrateur qui récupère un mot de passe, appliquée par l'accès conditionnel.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Windows LAPS manages the password of one local administrator account per device at a time.
        fr: Windows LAPS gère le mot de passe d'un seul compte d'administrateur local par appareil à la fois.
    - id: s2
      text:
        en: A Conditional Access policy can target a Cloud Device Administrator assignment that is scoped to an administrative unit.
        fr: Une stratégie d'accès conditionnel peut cibler une attribution Cloud Device Administrator limitée à l'étendue d'une unité administrative.
    - id: s3
      text:
        en: Each password recovery appears in the Microsoft Entra audit logs.
        fr: Chaque récupération de mot de passe apparaît dans les journaux d'audit Microsoft Entra.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Windows LAPS manages only one local administrator account per device; if the policy targets another account, the first one is no longer managed. Conditional Access can target the built-in roles that recover passwords, but administrative unit-scoped roles and custom roles aren't supported, so the recovering administrators should hold tenant-scoped built-in roles if MFA must be enforced this way. Recoveries are logged in the Microsoft Entra audit logs with the activity "Recover device local administrator password".
    fr: |
      Windows LAPS ne gère qu'un seul compte d'administrateur local par appareil ; si la stratégie cible un autre compte, le premier n'est plus géré. L'accès conditionnel peut cibler les rôles intégrés qui récupèrent les mots de passe, mais les rôles limités à une unité administrative et les rôles personnalisés ne sont pas pris en charge ; les administrateurs qui récupèrent les mots de passe doivent donc détenir des rôles intégrés à l'étendue du locataire si l'authentification multifacteur doit être appliquée ainsi. Les récupérations sont journalisées dans les journaux d'audit Microsoft Entra avec l'activité « Recover device local administrator password ».
references:
  - title: Use Windows Local Administrator Password Solution (LAPS) with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-manage-local-admin-passwords
