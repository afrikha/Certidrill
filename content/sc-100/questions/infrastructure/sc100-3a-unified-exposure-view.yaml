id: sc100-3a-unified-exposure-view
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft 365 E5 with Microsoft Defender for Endpoint and Microsoft Defender for Identity on all devices and domain controllers. Microsoft Defender for Cloud with Defender CSPM covers the Azure subscriptions and the AWS accounts.

    The CISO requires one posture experience for cloud resources, devices and identities that meets the following requirements:

    - Exposure must be prioritized according to how important each asset is to the business.
    - Progress in each security area, such as ransomware, must be measured against a goal set by the CISO.
    - No additional product may be deployed, and administrative effort must be minimized.

    What should you recommend?
  fr: |
    Woodgrove Bank utilise Microsoft 365 E5 avec Microsoft Defender for Endpoint et Microsoft Defender for Identity sur tous les appareils et contrôleurs de domaine. Microsoft Defender for Cloud avec Defender CSPM couvre les abonnements Azure et les comptes AWS.

    Le RSSI exige une expérience de posture unique pour les ressources cloud, les appareils et les identités qui réponde aux exigences suivantes :

    - L'exposition doit être hiérarchisée selon l'importance de chaque ressource pour l'entreprise.
    - La progression dans chaque domaine de sécurité, comme les rançongiciels, doit être mesurée par rapport à un objectif fixé par le RSSI.
    - Aucun produit supplémentaire ne doit être déployé, et l'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "The Defender for Cloud dashboard in the Azure portal with the classic secure score of each subscription and connector", fr: "Le tableau de bord de Defender for Cloud dans le portail Azure avec le degré de sécurisation classique de chaque abonnement et connecteur" }
    - id: b
      text: { en: "Microsoft Secure Score in the Defender portal with a custom comparison view for each security area", fr: "Le Niveau de sécurité Microsoft dans le portail Defender avec une vue de comparaison personnalisée pour chaque domaine de sécurité" }
    - id: c
      text: { en: "Microsoft Security Exposure Management in the Defender portal with asset classifications and initiatives", fr: "Microsoft Security Exposure Management dans le portail Defender avec les classifications de ressources et les initiatives" }
    - id: d
      text: { en: "A Microsoft Sentinel workbook fed by the Defender for Cloud, Defender for Endpoint and Defender for Identity data connectors", fr: "Un classeur Microsoft Sentinel alimenté par les connecteurs de données Defender for Cloud, Defender for Endpoint et Defender for Identity" }
answer:
  optionId: c
explanation:
  correct:
    en: Security Exposure Management is part of the Defender portal and needs no separate deployment. It builds a unified view across endpoints, identities and the cloud resources that Defender for Cloud integrates, classifies critical assets across devices, identities and cloud resources, and measures each security area through initiatives that have target scores.
    fr: Security Exposure Management fait partie du portail Defender et ne demande aucun déploiement distinct. Il construit une vue unifiée des points de terminaison, des identités et des ressources cloud intégrées par Defender for Cloud, classe les ressources critiques parmi les appareils, les identités et les ressources cloud, et mesure chaque domaine de sécurité au moyen d'initiatives dotées de scores cibles.
  options:
    a:
      en: The classic secure score covers cloud resources only and doesn't take asset criticality into account.
      fr: Le degré de sécurisation classique ne couvre que les ressources cloud et ne tient pas compte de la criticité des ressources.
    b:
      en: Microsoft Secure Score doesn't weight exposure by asset criticality, and its comparison views compare the score with other organizations rather than measure each area against a goal.
      fr: Le Niveau de sécurité Microsoft ne pondère pas l'exposition selon la criticité des ressources, et ses vues de comparaison comparent le score à d'autres organisations au lieu de mesurer chaque domaine par rapport à un objectif.
    d:
      en: Microsoft Sentinel is an additional product to deploy and feed, and a workbook doesn't provide criticality-based prioritization or targets.
      fr: Microsoft Sentinel est un produit supplémentaire à déployer et à alimenter, et un classeur ne fournit ni hiérarchisation selon la criticité ni cibles.
references:
  - title: What is Microsoft Security Exposure Management?
    url: https://learn.microsoft.com/en-us/security-exposure-management/microsoft-security-exposure-management
  - title: Overview of critical asset management in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/critical-asset-management
