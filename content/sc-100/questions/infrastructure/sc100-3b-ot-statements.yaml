id: sc100-3b-ot-statements
objective: "3.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso Energy is evaluating Microsoft Defender for IoT for its power distribution substations. Some substations will use cloud-connected OT sensors, and others will use locally managed OT sensors.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Energy évalue Microsoft Defender for IoT pour ses postes de distribution électrique. Certains postes utiliseront des capteurs OT connectés au cloud, et d'autres des capteurs OT gérés localement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A cloud-connected OT sensor analyzes the traffic and generates alerts on the sensor itself, and sends telemetry and insights to Azure.
        fr: Un capteur OT connecté au cloud analyse le trafic et génère les alertes sur le capteur lui-même, puis envoie la télémétrie et les informations à Azure.
    - id: s2
      text:
        en: Locally managed OT sensors receive Microsoft threat intelligence packages automatically.
        fr: Les capteurs OT gérés localement reçoivent automatiquement les packages de renseignement sur les menaces de Microsoft.
    - id: s3
      text:
        en: In an OT network, a device that has had no network activity for more than 60 days is marked as inactive and isn't counted as a device.
        fr: Dans un réseau OT, un appareil sans activité réseau depuis plus de 60 jours est marqué comme inactif et n'est pas compté comme appareil.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Collection, processing, analysis and alerting take place on the sensor, and only telemetry and insights go to the Azure portal; cloud-connected sensors also send alert information to Azure. Threat intelligence packages are pushed automatically only to cloud-connected sensors: on locally managed sensors you upload them manually. In OT networks, a device is marked inactive after more than 60 days without network activity, and inactive devices aren't counted.
    fr: |
      La collecte, le traitement, l'analyse et les alertes ont lieu sur le capteur, et seules la télémétrie et les informations sont envoyées au portail Azure ; les capteurs connectés au cloud envoient aussi les informations d'alerte à Azure. Les packages de renseignement sur les menaces ne sont poussés automatiquement que vers les capteurs connectés au cloud : sur les capteurs gérés localement, vous les chargez manuellement. Dans les réseaux OT, un appareil est marqué inactif après plus de 60 jours sans activité réseau, et les appareils inactifs ne sont pas comptés.
references:
  - title: Microsoft Defender for IoT architecture and components for your OT environment
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/architecture
