id: sc100-3b-laps-device-grid
objective: "3.2.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Litware has the devices shown in the following table. All the devices have the latest Windows updates. The AD DS domain is at the Windows Server 2016 domain functional level. A Windows LAPS policy is assigned to each device with the backup directory shown in the table, and password encryption is enabled for the devices that back up to Active Directory.

    Answer each prompt by selecting the appropriate device.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose des appareils présentés dans le tableau suivant. Tous les appareils disposent des dernières mises à jour Windows. Le domaine AD DS est au niveau fonctionnel de domaine Windows Server 2016. Une stratégie Windows LAPS est attribuée à chaque appareil avec l'annuaire de sauvegarde indiqué dans le tableau, et le chiffrement des mots de passe est activé pour les appareils qui sauvegardent dans Active Directory.

    Répondez à chaque consigne en sélectionnant l'appareil approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The device on which the assigned policy can't back up the password", fr: "L'appareil sur lequel la stratégie attribuée ne peut pas sauvegarder le mot de passe" }
    - id: p2
      text: { en: "The device whose previous passwords can be kept in a password history", fr: "L'appareil dont les mots de passe précédents peuvent être conservés dans un historique des mots de passe" }
  grid:
    header: [{ en: Device, fr: Appareil }, { en: Operating system, fr: Système d'exploitation }, { en: Join state, fr: État de jonction }, { en: Backup directory, fr: Annuaire de sauvegarde }]
    rows:
      - [{ text: DEV1, area: dev1 }, { text: Windows 11 24H2 }, { text: { en: Microsoft Entra joined, fr: Joint à Microsoft Entra } }, { text: Microsoft Entra ID }]
      - [{ text: DEV2, area: dev2 }, { text: Windows 11 23H2 }, { text: { en: Microsoft Entra hybrid joined, fr: Joint à Microsoft Entra hybride } }, { text: Microsoft Entra ID }]
      - [{ text: DEV3, area: dev3 }, { text: Windows 11 24H2 }, { text: { en: Microsoft Entra registered, fr: Inscrit auprès de Microsoft Entra } }, { text: Microsoft Entra ID }]
      - [{ text: SRV1, area: srv1 }, { text: Windows Server 2025 }, { text: { en: Active Directory joined, fr: Joint à Active Directory } }, { text: Active Directory }]
answer:
  values: { p1: dev3, p2: srv1 }
explanation:
  correct:
    en: |
      Windows LAPS doesn't support Microsoft Entra registered (workplace-joined) devices, so DEV3 can't back up its password. Password history is available only for passwords backed up to Active Directory with encryption enabled, which is the case of SRV1; DEV1 and DEV2 back up to Microsoft Entra ID, which is supported for joined and hybrid joined devices.
    fr: |
      Windows LAPS ne prend pas en charge les appareils inscrits auprès de Microsoft Entra ; DEV3 ne peut donc pas sauvegarder son mot de passe. L'historique des mots de passe n'est disponible que pour les mots de passe sauvegardés dans Active Directory avec le chiffrement activé, ce qui est le cas de SRV1 ; DEV1 et DEV2 sauvegardent dans Microsoft Entra ID, ce qui est pris en charge pour les appareils joints et joints hybrides.
references:
  - title: "Windows LAPS Overview: Manage Admin Passwords"
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview
  - title: Key concepts in Windows LAPS
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-concepts-overview
