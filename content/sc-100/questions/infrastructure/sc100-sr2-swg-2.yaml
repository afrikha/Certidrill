id: sc100-sr2-swg-2
objective: "3.4.2"
type: series_yesno
series: sc100-sr2-web-filtering
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You recommend Microsoft Entra Internet Access with a security profile that is linked to a Conditional Access policy.
  fr: |
    Vous recommandez l'accès Internet Microsoft Entra avec un profil de sécurité lié à une stratégie d'accès conditionnel.
body:
  solution:
    en: |
      You recommend the following configuration:

      - Deploy the Global Secure Access client to all devices by using Intune, and enable the **Internet Access** traffic forwarding profile.
      - Create a web content filtering policy that blocks the **Gambling** category, and add the policy to a security profile.
      - Create a Conditional Access policy that targets **All users** and **All internet resources with Global Secure Access**, with the **Use Global Secure Access security profile** session control set to that profile.
    fr: |
      Vous recommandez la configuration suivante :

      - Déployer le client Global Secure Access sur tous les appareils à l'aide d'Intune et activer le profil de transfert du trafic **Internet Access**.
      - Créer une stratégie de filtrage du contenu web qui bloque la catégorie **Gambling** et ajouter la stratégie à un profil de sécurité.
      - Créer une stratégie d'accès conditionnel qui cible **All users** et **All internet resources with Global Secure Access**, avec le contrôle de session **Use Global Secure Access security profile** défini sur ce profil.
answer: { value: true }
explanation:
  correct:
    en: |
      Microsoft Entra Internet Access is the identity-centric secure web gateway of Global Secure Access. The client forwards internet traffic from any network to the service without a VPN, the filtering policy blocks the Gambling category, and the Conditional Access session control applies the security profile to every user based on their Microsoft Entra identity.
    fr: |
      L'accès Internet Microsoft Entra est la passerelle web sécurisée centrée sur l'identité de Global Secure Access. Le client transfère le trafic Internet de n'importe quel réseau vers le service sans VPN, la stratégie de filtrage bloque la catégorie Gambling et le contrôle de session de l'accès conditionnel applique le profil de sécurité à chaque utilisateur selon son identité Microsoft Entra.
references:
  - title: How to configure Global Secure Access web content filtering
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-web-content-filtering
