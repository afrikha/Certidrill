id: sc100-3b-web-no-secrets
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam Retail is building a web app on Azure App Service. The app reads product data from Azure SQL Database and stores images in Azure Blob Storage. Developers currently keep the SQL password and the storage account key in the app settings.

    You need to recommend a solution that removes these credentials from the code and the configuration. The solution must minimize the effort to manage credentials.

    What should you recommend?
  fr: |
    Fabrikam Retail développe une application web sur Azure App Service. L'application lit les données des produits dans Azure SQL Database et stocke des images dans le Stockage Blob Azure. Les développeurs conservent actuellement le mot de passe SQL et la clé du compte de stockage dans les paramètres de l'application.

    Vous devez recommander une solution qui supprime ces informations d'identification du code et de la configuration. La solution doit réduire au minimum l'effort de gestion des informations d'identification.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Encrypt the app settings with a customer-managed key stored in Azure Key Vault.", fr: "Chiffrer les paramètres de l'application avec une clé gérée par le client stockée dans Azure Key Vault." } }
    - { id: b, text: { en: "Enable a managed identity for the app, and grant it Microsoft Entra access to Azure SQL Database and Blob Storage.", fr: "Activer une identité managée pour l'application, et lui accorder un accès Microsoft Entra à Azure SQL Database et au Stockage Blob." } }
    - { id: c, text: { en: "Register an application in Microsoft Entra ID, and store its client secret in the app settings.", fr: "Inscrire une application dans Microsoft Entra ID, et stocker son secret client dans les paramètres de l'application." } }
    - { id: d, text: { en: "Rotate the SQL password and the storage account key every 30 days with an automation runbook.", fr: "Renouveler le mot de passe SQL et la clé du compte de stockage tous les 30 jours avec un runbook d'automatisation." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A managed identity lets the app authenticate to Azure SQL Database and Storage with Microsoft Entra ID, so no credential is stored in code or configuration. The platform manages, rotates and protects the identity's credentials.
    fr: |
      Une identité managée permet à l'application de s'authentifier auprès d'Azure SQL Database et du Stockage avec Microsoft Entra ID ; aucune information d'identification n'est stockée dans le code ou la configuration. La plateforme gère, renouvelle et protège les informations d'identification de l'identité.
  options:
    a:
      en: |
        Encryption protects the settings at rest, but the password and the key are still credentials held in the configuration.
      fr: |
        Le chiffrement protège les paramètres au repos, mais le mot de passe et la clé restent des informations d'identification conservées dans la configuration.
    c:
      en: |
        A client secret is itself a credential in the configuration that must be rotated.
      fr: |
        Un secret client est lui-même une information d'identification dans la configuration, qu'il faut renouveler.
    d:
      en: |
        Rotation shortens the life of the credentials, but they remain in the app settings and the runbook adds effort.
      fr: |
        Le renouvellement raccourcit la durée de vie des informations d'identification, mais elles restent dans les paramètres de l'application et le runbook ajoute de l'effort.
references:
  - title: Secure your Azure App Service deployment
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-security
