id: sc100-3c-aks-traffic
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank hosts a payments application in an Azure Kubernetes Service (AKS) cluster deployed in a spoke virtual network. A hub virtual network contains Azure Firewall.

    The network requirements for the cluster are:

    - Pods in the payments namespace must accept connections only from pods in the frontend namespace.
    - Outbound traffic from the cluster to the internet must be inspected centrally and allowed only to approved FQDNs.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank héberge une application de paiement dans un cluster Azure Kubernetes Service (AKS) déployé dans un réseau virtuel spoke. Un réseau virtuel hub contient le Pare-feu Azure.

    Les exigences réseau du cluster sont les suivantes :

    - Les pods de l'espace de noms payments ne doivent accepter de connexions que des pods de l'espace de noms frontend.
    - Le trafic sortant du cluster vers Internet doit être inspecté de façon centralisée et autorisé uniquement vers des FQDN approuvés.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply Kubernetes network policies that select the payments and frontend namespaces", fr: "Appliquer des stratégies réseau Kubernetes qui sélectionnent les espaces de noms payments et frontend" } }
    - { id: b, text: { en: "Add inbound rules to the NSG of the node subnet that filter traffic between the two namespaces", fr: "Ajouter des règles entrantes au NSG du sous-réseau des nœuds pour filtrer le trafic entre les deux espaces de noms" } }
    - { id: c, text: { en: "Route 0.0.0.0/0 from the node subnet to Azure Firewall and define application rules for the approved FQDNs", fr: "Router 0.0.0.0/0 du sous-réseau des nœuds vers le Pare-feu Azure et définir des règles d'application pour les FQDN approuvés" } }
    - { id: d, text: { en: "Configure authorized IP ranges on the API server for the approved destinations", fr: "Configurer des plages d'adresses IP autorisées sur le serveur d'API pour les destinations approuvées" } }
    - { id: e, text: { en: "Assign Azure Policy for Kubernetes initiatives that deny privileged containers", fr: "Attribuer des initiatives Azure Policy pour Kubernetes qui refusent les conteneurs privilégiés" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Kubernetes network policies allow or deny traffic between pods by namespace and label selectors, which isolates the payments namespace. A user-defined route that sends 0.0.0.0/0 to Azure Firewall forces cluster egress through the hub, where application rules allow only the approved FQDNs.
    fr: |-
      Les stratégies réseau Kubernetes autorisent ou refusent le trafic entre les pods selon les sélecteurs d'espace de noms et d'étiquette, ce qui isole l'espace de noms payments. Un itinéraire défini par l'utilisateur qui envoie 0.0.0.0/0 vers le Pare-feu Azure force la sortie du cluster à passer par le hub, où des règles d'application n'autorisent que les FQDN approuvés.
  options:
    b:
      en: |-
        Pods of both namespaces can run on the same nodes in the same subnet; an NSG sees IP addresses, not namespaces.
      fr: |-
        Les pods des deux espaces de noms peuvent s'exécuter sur les mêmes nœuds du même sous-réseau ; un NSG voit des adresses IP, pas des espaces de noms.
    d:
      en: |-
        Authorized IP ranges restrict who can reach the API server; they don't control traffic leaving the cluster.
      fr: |-
        Les plages d'adresses IP autorisées restreignent qui peut atteindre le serveur d'API ; elles ne contrôlent pas le trafic qui sort du cluster.
    e:
      en: |-
        Denying privileged containers hardens workloads but doesn't filter any network traffic.
      fr: |-
        Refuser les conteneurs privilégiés renforce les charges de travail, mais ne filtre aucun trafic réseau.
references:
  - title: Security concepts for applications and clusters in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-security
