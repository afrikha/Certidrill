id: sc100-3c-ai-control-map
objective: "3.3.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is evaluating the security of a generative AI platform. Several business units will build applications on shared Azure OpenAI model deployments in Microsoft Foundry.

    You need to recommend a solution for each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation évalue la sécurité d'une plateforme d'IA générative. Plusieurs unités commerciales créeront des applications sur des déploiements de modèles Azure OpenAI partagés dans Microsoft Foundry.

    Vous devez recommander une solution pour chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Enforce a token limit for each business unit and log all model traffic in one place: [[gateway]]

      Block hateful and violent content in user prompts and model completions: [[content]]

      Detect sensitive information in prompts and responses and apply data loss prevention and auditing: [[data]]
    fr: |
      Imposer une limite de jetons à chaque unité commerciale et journaliser tout le trafic des modèles en un seul endroit : [[gateway]]

      Bloquer le contenu haineux et violent dans les prompts utilisateur et les complétions du modèle : [[content]]

      Détecter les informations sensibles dans les prompts et les réponses, et appliquer la prévention des pertes de données et l'audit : [[data]]
  slots:
    - id: gateway
      options:
        - { id: apim, text: { en: "AI gateway in Azure API Management", fr: "La passerelle IA d'Azure API Management" } }
        - { id: guard, text: { en: "A Foundry guardrail", fr: "Un garde-fou Foundry" } }
        - { id: tp, text: { en: "Threat protection for AI services", fr: "La protection contre les menaces pour les services d'IA" } }
        - { id: dspm, text: { en: "Microsoft Purview DSPM for AI", fr: "Le DSPM pour l'IA de Microsoft Purview" } }
    - id: content
      options:
        - { id: apim, text: { en: "AI gateway in Azure API Management", fr: "La passerelle IA d'Azure API Management" } }
        - { id: guard, text: { en: "A Foundry guardrail", fr: "Un garde-fou Foundry" } }
        - { id: tp, text: { en: "Threat protection for AI services", fr: "La protection contre les menaces pour les services d'IA" } }
        - { id: dspm, text: { en: "Microsoft Purview DSPM for AI", fr: "Le DSPM pour l'IA de Microsoft Purview" } }
    - id: data
      options:
        - { id: apim, text: { en: "AI gateway in Azure API Management", fr: "La passerelle IA d'Azure API Management" } }
        - { id: guard, text: { en: "A Foundry guardrail", fr: "Un garde-fou Foundry" } }
        - { id: tp, text: { en: "Threat protection for AI services", fr: "La protection contre les menaces pour les services d'IA" } }
        - { id: dspm, text: { en: "Microsoft Purview DSPM for AI", fr: "Le DSPM pour l'IA de Microsoft Purview" } }
answer:
  values: { gateway: apim, content: guard, data: dspm }
explanation:
  correct:
    en: |-
      The AI gateway capabilities of Azure API Management sit in front of the model endpoints, enforce token limits per consumer and log the model traffic centrally. A Foundry guardrail applies content filters that block harmful categories such as hate and violence in prompts and completions. Microsoft Purview data security posture management for AI discovers sensitive information in AI interactions and applies DLP, auditing and other compliance controls.
    fr: |-
      Les fonctionnalités de passerelle IA d'Azure API Management se placent devant les points de terminaison des modèles, imposent des limites de jetons par consommateur et journalisent le trafic des modèles de façon centralisée. Un garde-fou Foundry applique des filtres de contenu qui bloquent les catégories préjudiciables comme la haine et la violence dans les prompts et les complétions. La gestion de la posture de sécurité des données pour l'IA de Microsoft Purview découvre les informations sensibles dans les interactions avec l'IA et applique la DLP, l'audit et d'autres contrôles de conformité.
  options:
    tp:
      en: |-
        Threat protection for AI services raises alerts on attacks; it doesn't limit tokens, filter content or apply DLP.
      fr: |-
        La protection contre les menaces pour les services d'IA génère des alertes sur les attaques ; elle ne limite pas les jetons, ne filtre pas le contenu et n'applique pas de DLP.
references:
  - title: AI gateway capabilities in Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
