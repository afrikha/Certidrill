id: sc100-3c-swg-group-exception
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has 3,000 employees who work from home, from branch offices and while traveling, on Windows, macOS and iOS devices. All users have Microsoft Entra Suite licenses, and the Global Secure Access client is deployed with the Internet access traffic forwarding profile enabled.

    The security team must block the social networking web category for all users, except the members of the Marketing group, wherever the users connect from.

    What should you recommend?
  fr: |
    Proseware compte 3 000 employés qui travaillent depuis leur domicile, depuis des succursales et en déplacement, sur des appareils Windows, macOS et iOS. Tous les utilisateurs disposent de licences Microsoft Entra Suite, et le client Global Secure Access est déployé avec le profil de transfert du trafic d'accès Internet activé.

    L'équipe de sécurité doit bloquer la catégorie web des réseaux sociaux pour tous les utilisateurs, sauf les membres du groupe Marketing, d'où qu'ils se connectent.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Link a filtering policy that blocks the category to the baseline profile, and exclude the Marketing group from that profile", fr: "Lier une stratégie de filtrage qui bloque la catégorie au profil de base, et exclure le groupe Marketing de ce profil" } }
    - { id: b, text: { en: "Configure web content filtering in Defender for Endpoint with a device group for the Marketing devices", fr: "Configurer le filtrage du contenu web de Defender for Endpoint avec un groupe d'appareils pour les appareils du service Marketing" } }
    - { id: c, text: { en: "Add the category to a security profile, and link it with a Conditional Access policy that targets all users except Marketing", fr: "Ajouter la catégorie à un profil de sécurité, et le lier avec une stratégie d'accès conditionnel qui cible tous les utilisateurs sauf Marketing" } }
    - { id: d, text: { en: "Deny the category in an Azure Firewall Premium policy, and add an allow rule for the source IP addresses of Marketing", fr: "Refuser la catégorie dans une stratégie du Pare-feu Azure Premium, et ajouter une règle d'autorisation pour les adresses IP sources de Marketing" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In Microsoft Entra Internet Access, filtering policies are grouped in security profiles, and a Conditional Access policy that targets All internet resources with Global Secure Access applies a profile to the users it includes. Assigning the blocking profile to all users except Marketing gives an identity-based exception that follows users on every network and platform.
    fr: |-
      Dans Accès Internet Microsoft Entra, les stratégies de filtrage sont regroupées dans des profils de sécurité, et une stratégie d'accès conditionnel qui cible All internet resources with Global Secure Access applique un profil aux utilisateurs qu'elle inclut. Attribuer le profil de blocage à tous les utilisateurs sauf Marketing crée une exception fondée sur l'identité qui suit les utilisateurs sur tous les réseaux et toutes les plateformes.
  options:
    a:
      en: |-
        The baseline profile applies to all Internet Access traffic without Conditional Access, so it can't exclude a group.
      fr: |-
        Le profil de base s'applique à tout le trafic d'accès Internet sans accès conditionnel : il ne peut pas exclure un groupe.
    b:
      en: |-
        Defender for Endpoint web content filtering targets device groups, not user groups, so it doesn't express an exception for the members of Marketing.
      fr: |-
        Le filtrage du contenu web de Defender for Endpoint cible des groupes d'appareils, pas des groupes d'utilisateurs : il n'exprime pas d'exception pour les membres de Marketing.
    d:
      en: |-
        Azure Firewall filters only the traffic routed through Azure virtual networks, and remote users have no fixed source IP address.
      fr: |-
        Le Pare-feu Azure ne filtre que le trafic routé par les réseaux virtuels Azure, et les utilisateurs distants n'ont pas d'adresse IP source fixe.
references:
  - title: How to configure Global Secure Access web content filtering
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-web-content-filtering
  - title: Learn about Microsoft Entra Internet Access for all apps
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-internet-access
