id: sc100-3b-laps-enable-entra
objective: "3.2.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has 3,000 Windows 11 24H2 devices that are Microsoft Entra joined and enrolled in Microsoft Intune. The tenant has Microsoft Entra ID P1 licenses. No local administrator password solution is deployed.

    You need to recommend how to back up the local administrator password of each device to Microsoft Entra ID by using Windows LAPS. The solution must minimize administrative effort.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de 3 000 appareils Windows 11 24H2 joints à Microsoft Entra et inscrits dans Microsoft Intune. Le locataire dispose de licences Microsoft Entra ID P1. Aucune solution de mot de passe d'administrateur local n'est déployée.

    Vous devez recommander comment sauvegarder le mot de passe d'administrateur local de chaque appareil dans Microsoft Entra ID avec Windows LAPS. La solution doit réduire au minimum l'effort d'administration.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the legacy Microsoft LAPS client on each device.", fr: "Installer le client Microsoft LAPS hérité sur chaque appareil." } }
    - { id: b, text: { en: "Turn on Windows LAPS in the Microsoft Entra device settings.", fr: "Activer Windows LAPS dans les paramètres des appareils Microsoft Entra." } }
    - { id: c, text: { en: "Extend the Active Directory schema for Windows LAPS.", fr: "Étendre le schéma Active Directory pour Windows LAPS." } }
    - { id: d, text: { en: "Deploy an Intune Windows LAPS policy that sets the backup directory to Microsoft Entra ID.", fr: "Déployer une stratégie Windows LAPS Intune qui définit Microsoft Entra ID comme annuaire de sauvegarde." } }
    - { id: e, text: { en: "Assign Microsoft Entra ID P2 licenses to the device owners.", fr: "Attribuer des licences Microsoft Entra ID P2 aux propriétaires des appareils." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Windows LAPS is built into Windows 11 24H2. Backing up to Microsoft Entra ID needs the tenant-wide setting that enables LAPS in the Microsoft Entra device settings, and a client-side policy whose backup directory is Microsoft Entra ID; Microsoft recommends Intune to deliver that policy.
    fr: |
      Windows LAPS est intégré à Windows 11 24H2. La sauvegarde dans Microsoft Entra ID nécessite le paramètre de locataire qui active LAPS dans les paramètres des appareils Microsoft Entra, et une stratégie côté client dont l'annuaire de sauvegarde est Microsoft Entra ID ; Microsoft recommande Intune pour fournir cette stratégie.
  options:
    a:
      en: |
        Legacy Microsoft LAPS is deprecated, its installation is blocked on Windows 11 23H2 and later, and it can't back up to Microsoft Entra ID.
      fr: |
        Microsoft LAPS hérité est déprécié, son installation est bloquée sur Windows 11 23H2 et versions ultérieures, et il ne peut pas sauvegarder dans Microsoft Entra ID.
    c:
      en: |
        The schema extension is needed only to back up passwords to Active Directory; these devices aren't joined to AD DS.
      fr: |
        L'extension du schéma n'est nécessaire que pour sauvegarder les mots de passe dans Active Directory ; ces appareils ne sont pas joints à AD DS.
    e:
      en: |
        Backup to Microsoft Entra ID requires only Microsoft Entra ID Free or higher.
      fr: |
        La sauvegarde dans Microsoft Entra ID nécessite seulement Microsoft Entra ID Free ou un niveau supérieur.
references:
  - title: Use Windows Local Administrator Password Solution (LAPS) with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-manage-local-admin-passwords
  - title: "Windows LAPS Overview: Manage Admin Passwords"
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview
