id: sc100-3c-ms-cross-tenant
objective: "3.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso collaborates with a partner company named Fabrikam. Each company has its own Microsoft Entra tenant. All Contoso devices run the Global Secure Access client with the Microsoft traffic forwarding profile.

    You need to recommend a control for each requirement of Contoso.

    Which control should you recommend for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso collabore avec une entreprise partenaire nommée Fabrikam. Chaque entreprise a son propre locataire Microsoft Entra. Tous les appareils de Contoso exécutent le client Global Secure Access avec le profil de transfert du trafic Microsoft.

    Vous devez recommander un contrôle pour chaque exigence de Contoso.

    Quel contrôle devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: inbound, text: { en: "Inbound cross-tenant access settings", fr: "Paramètres d'accès interlocataire entrants" } }
    - { id: outbound, text: { en: "Outbound cross-tenant access settings", fr: "Paramètres d'accès interlocataire sortants" } }
    - { id: trv2, text: { en: "Tenant restrictions v2 with universal tenant restrictions", fr: "Restrictions de locataire v2 avec les restrictions de locataire universelles" } }
    - { id: compliant, text: { en: "Compliant network check in Conditional Access", fr: "Vérification du réseau conforme dans l'accès conditionnel" } }
    - { id: sync, text: { en: "Cross-tenant synchronization", fr: "Synchronisation interlocataire" } }
  targets:
    - id: t1
      text: { en: "Only Fabrikam's project group can access Contoso apps as B2B collaboration users", fr: "Seul le groupe de projet de Fabrikam peut accéder aux applications de Contoso en tant qu'utilisateurs de collaboration B2B" }
    - id: t2
      text: { en: "Contoso accounts can access other organizations as B2B collaboration users only in Fabrikam's tenant", fr: "Les comptes de Contoso ne peuvent accéder à d'autres organisations en tant qu'utilisateurs de collaboration B2B que dans le locataire de Fabrikam" }
    - id: t3
      text: { en: "On Contoso devices, nobody can sign in with an account from another organization's tenant, except Fabrikam's", fr: "Sur les appareils de Contoso, personne ne peut se connecter avec un compte du locataire d'une autre organisation, sauf celui de Fabrikam" }
    - id: t4
      text: { en: "Contoso users can reach SharePoint Online only through Contoso's Global Secure Access", fr: "Les utilisateurs de Contoso ne peuvent atteindre SharePoint Online que par le Global Secure Access de Contoso" }
answer:
  mapping: { t1: inbound, t2: outbound, t3: trv2, t4: compliant }
explanation:
  correct:
    en: |-
      Inbound settings control how external users, such as Fabrikam's project group, access Contoso's apps. Outbound settings control how Contoso's own accounts access external organizations, so they can allow only Fabrikam. Tenant restrictions v2 controls external accounts used on Contoso's devices, and universal tenant restrictions enforce it through the Global Secure Access client. The compliant network check makes Conditional Access require Contoso's Global Secure Access.
    fr: |-
      Les paramètres entrants contrôlent la façon dont les utilisateurs externes, comme le groupe de projet de Fabrikam, accèdent aux applications de Contoso. Les paramètres sortants contrôlent la façon dont les comptes de Contoso accèdent aux organisations externes : ils peuvent n'autoriser que Fabrikam. Les restrictions de locataire v2 contrôlent les comptes externes utilisés sur les appareils de Contoso, et les restrictions de locataire universelles les appliquent par le client Global Secure Access. La vérification du réseau conforme fait exiger par l'accès conditionnel le Global Secure Access de Contoso.
  options:
    sync:
      en: |-
        Cross-tenant synchronization provisions users from one tenant into another; it doesn't restrict access.
      fr: |-
        La synchronisation interlocataire provisionne des utilisateurs d'un locataire dans un autre ; elle ne restreint pas l'accès.
references:
  - title: Cross-tenant access overview
    url: https://learn.microsoft.com/en-us/entra/external-id/cross-tenant-access-overview
  - title: Set up tenant restrictions v2
    url: https://learn.microsoft.com/en-us/entra/external-id/tenant-restrictions-v2
