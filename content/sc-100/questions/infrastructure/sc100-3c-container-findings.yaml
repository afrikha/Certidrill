id: sc100-3c-container-findings
objective: "3.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores container images in Azure Container Registry, Amazon Elastic Container Registry (ECR) and Google Artifact Registry. The images run on Azure Kubernetes Service (AKS), Amazon EKS and Google GKE clusters.

    You are evaluating whether Microsoft Defender for Containers, with the Defender sensor deployed on every cluster, meets the container security requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank stocke des images conteneur dans Azure Container Registry, Amazon Elastic Container Registry (ECR) et Google Artifact Registry. Les images s'exécutent sur des clusters Azure Kubernetes Service (AKS), Amazon EKS et Google GKE.

    Vous évaluez si Microsoft Defender for Containers, avec le capteur Defender déployé sur chaque cluster, respecte les exigences de sécurité des conteneurs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The agentless vulnerability assessment can scan the images stored in Amazon ECR and Google Artifact Registry, not only those in Azure Container Registry.
        fr: |-
          L'évaluation des vulnérabilités sans agent peut analyser les images stockées dans Amazon ECR et Google Artifact Registry, et pas seulement celles d'Azure Container Registry.
    - id: s2
      text:
        en: |-
          When the vulnerability assessment finds a critical vulnerability in an image, the registry stops serving the image to the clusters.
        fr: |-
          Quand l'évaluation des vulnérabilités trouve une vulnérabilité critique dans une image, le registre cesse de fournir l'image aux clusters.
    - id: s3
      text:
        en: |-
          Binary drift blocking can stop a process that wasn't part of the original image from running in a container.
        fr: |-
          Le blocage de la dérive des binaires peut empêcher l'exécution, dans un conteneur, d'un processus qui ne faisait pas partie de l'image d'origine.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      The agentless vulnerability assessment of Defender for Containers covers Azure Container Registry, Amazon ECR, Google Artifact Registry and Google Container Registry, with daily rescans. Findings are recommendations: they don't change what the registry serves; blocking a vulnerable image at deployment needs gated deployment rules. With the sensor, binary drift detection alerts on processes that weren't in the image, and binary drift blocking stops them according to the drift policies.
    fr: |-
      L'évaluation des vulnérabilités sans agent de Defender for Containers couvre Azure Container Registry, Amazon ECR, Google Artifact Registry et Google Container Registry, avec une nouvelle analyse quotidienne. Les résultats sont des recommandations : ils ne changent pas ce que le registre fournit ; bloquer une image vulnérable au déploiement exige des règles de déploiement contrôlé. Avec le capteur, la détection de la dérive des binaires alerte sur les processus absents de l'image, et le blocage de la dérive des binaires les arrête selon les stratégies de dérive.
references:
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
