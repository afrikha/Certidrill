id: sc100-3b-svc-model-baselines
objective: "3.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso Pharma runs a clinical trials application. The web tier runs on Windows Server virtual machines in Azure, and the data tier uses Azure SQL Database. You are writing the security baseline document of the application.

    What should you include in the document? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Pharma exécute une application d'essais cliniques. Le niveau web s'exécute sur des machines virtuelles Windows Server dans Azure, et le niveau données utilise Azure SQL Database. Vous rédigez le document de base de référence de sécurité de l'application.

    Que devez-vous inclure dans le document ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Security capabilities and recommended configuration of the data tier: [[sql]]

      OS configuration management controls for the data tier: [[os]]

      Audit of the guest operating system settings of the web tier: [[guest]]
    fr: |
      Capacités de sécurité et configuration recommandée du niveau données : [[sql]]

      Contrôles de gestion de la configuration du système d'exploitation pour le niveau données : [[os]]

      Audit des paramètres du système d'exploitation invité du niveau web : [[guest]]
  slots:
    - id: sql
      options:
        - { id: azsql, text: { en: "The Azure security baseline for Azure SQL Database", fr: "La base de référence de sécurité Azure pour Azure SQL Database" } }
        - { id: winsrv, text: { en: "The Windows Server security baseline", fr: "La base de référence de sécurité Windows Server" } }
        - { id: m365, text: { en: "Microsoft Secure Score recommendations for Microsoft 365", fr: "Les recommandations Microsoft Secure Score pour Microsoft 365" } }
    - id: os
      options:
        - { id: cust, text: { en: "A customer responsibility", fr: "Une responsabilité du client" } }
        - { id: shared, text: { en: "A shared responsibility", fr: "Une responsabilité partagée" } }
        - { id: na, text: { en: "Not applicable", fr: "Non applicable" } }
    - id: guest
      options:
        - { id: mc, text: { en: "Azure Policy machine configuration", fr: "La configuration des machines Azure Policy" } }
        - { id: intune, text: { en: "An Intune security baseline", fr: "Une base de référence de sécurité Intune" } }
        - { id: sspm, text: { en: "Defender for Cloud Apps security recommendations", fr: "Les recommandations de sécurité de Defender for Cloud Apps" } }
answer:
  values: { sql: azsql, os: na, guest: mc }
explanation:
  correct:
    en: |
      Azure security baselines describe the security capabilities and recommended secure configuration of each Azure service, mapped to the Microsoft cloud security benchmark. IaaS or compute-centric controls such as OS configuration management typically don't apply to a PaaS service, because Microsoft manages its operating system. For the virtual machines, machine configuration audits or configures the guest operating system settings.
    fr: |
      Les bases de référence de sécurité Azure décrivent les capacités de sécurité et la configuration sécurisée recommandée de chaque service Azure, alignées sur le benchmark de sécurité cloud Microsoft. Les contrôles IaaS ou centrés sur le calcul, comme la gestion de la configuration du système d'exploitation, ne s'appliquent généralement pas à un service PaaS, car Microsoft gère son système d'exploitation. Pour les machines virtuelles, la configuration des machines audite ou configure les paramètres du système d'exploitation invité.
  options:
    winsrv:
      en: |
        The Windows Server baseline hardens an operating system that you manage; you don't manage the OS of Azure SQL Database.
      fr: |
        La base de référence Windows Server renforce un système d'exploitation que vous gérez ; vous ne gérez pas le système d'exploitation d'Azure SQL Database.
    cust:
      en: |
        In PaaS, the operating system is Microsoft's responsibility.
      fr: |
        En PaaS, le système d'exploitation relève de Microsoft.
    intune:
      en: |
        Intune security baselines target Intune-managed Windows devices, not Azure server VMs governed by Azure Policy.
      fr: |
        Les bases de référence de sécurité Intune ciblent les appareils Windows gérés par Intune, pas les machines virtuelles serveur Azure gouvernées par Azure Policy.
references:
  - title: Security baselines for Azure overview
    url: https://learn.microsoft.com/en-us/security/benchmark/azure/security-baselines-overview
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
