id: sc100-3c-net-edge-controls
objective: "3.4.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware is evaluating network security controls for an internet-facing e-commerce platform in Azure. Users connect from many countries, and the web tier runs in spoke virtual networks behind public load balancers.

    You need to recommend a control for each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware évalue les contrôles de sécurité réseau d'une plateforme de commerce électronique exposée à Internet dans Azure. Les utilisateurs se connectent depuis de nombreux pays, et le niveau web s'exécute dans des réseaux virtuels spoke derrière des équilibreurs de charge publics.

    Vous devez recommander un contrôle pour chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Block SQL injection and malicious bots at the global edge, before traffic reaches Azure regions: [[waf]]

      Mitigate volumetric attacks on the public IP addresses of the load balancers, with access to the DDoS Rapid Response team: [[ddos]]

      Decrypt outbound HTTPS traffic from the spokes and inspect it with intrusion detection signatures: [[tls]]
    fr: |
      Bloquer l'injection SQL et les bots malveillants en périphérie mondiale, avant que le trafic n'atteigne les régions Azure : [[waf]]

      Atténuer les attaques volumétriques sur les adresses IP publiques des équilibreurs de charge, avec accès à l'équipe DDoS Rapid Response : [[ddos]]

      Déchiffrer le trafic HTTPS sortant des spokes et l'inspecter avec des signatures de détection d'intrusion : [[tls]]
  slots:
    - id: waf
      options:
        - { id: afd, text: { en: "Azure Front Door Premium with a WAF policy", fr: "Azure Front Door Premium avec une stratégie WAF" } }
        - { id: ddosn, text: { en: "Azure DDoS Network Protection", fr: "Azure DDoS Network Protection" } }
        - { id: afwp, text: { en: "Azure Firewall Premium", fr: "Pare-feu Azure Premium" } }
        - { id: nsg, text: { en: "NSGs with application security groups", fr: "Des NSG avec des groupes de sécurité d'application" } }
    - id: ddos
      options:
        - { id: afd, text: { en: "Azure Front Door Premium with a WAF policy", fr: "Azure Front Door Premium avec une stratégie WAF" } }
        - { id: ddosn, text: { en: "Azure DDoS Network Protection", fr: "Azure DDoS Network Protection" } }
        - { id: afwp, text: { en: "Azure Firewall Premium", fr: "Pare-feu Azure Premium" } }
        - { id: nsg, text: { en: "NSGs with application security groups", fr: "Des NSG avec des groupes de sécurité d'application" } }
    - id: tls
      options:
        - { id: afd, text: { en: "Azure Front Door Premium with a WAF policy", fr: "Azure Front Door Premium avec une stratégie WAF" } }
        - { id: ddosn, text: { en: "Azure DDoS Network Protection", fr: "Azure DDoS Network Protection" } }
        - { id: afwp, text: { en: "Azure Firewall Premium", fr: "Pare-feu Azure Premium" } }
        - { id: nsg, text: { en: "NSGs with application security groups", fr: "Des NSG avec des groupes de sécurité d'application" } }
answer:
  values: { waf: afd, ddos: ddosn, tls: afwp }
explanation:
  correct:
    en: |-
      Azure Front Door Premium runs a WAF policy with managed rule sets and bot protection at Microsoft's global edge. DDoS Network Protection gives tuned mitigation of layer 3 and 4 attacks on the public IP addresses of the protected virtual networks, and it includes DDoS Rapid Response support, which DDoS IP Protection doesn't. Azure Firewall Premium adds TLS inspection and signature-based IDPS for outbound traffic.
    fr: |-
      Azure Front Door Premium exécute une stratégie WAF avec des ensembles de règles managés et la protection contre les bots en périphérie mondiale de Microsoft. DDoS Network Protection fournit une atténuation ajustée des attaques de couches 3 et 4 sur les adresses IP publiques des réseaux virtuels protégés, et inclut le support DDoS Rapid Response, ce que DDoS IP Protection ne fait pas. Le Pare-feu Azure Premium ajoute l'inspection TLS et un IDPS fondé sur des signatures pour le trafic sortant.
  options:
    nsg:
      en: |-
        NSGs filter on layers 3 and 4; they neither inspect HTTP payloads nor decrypt TLS.
      fr: |-
        Les NSG filtrent aux couches 3 et 4 ; ils n'inspectent pas le contenu HTTP et ne déchiffrent pas le TLS.
references:
  - title: About Azure DDoS Protection Tier Comparison
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison
  - title: Azure Firewall Premium features implementation guide
    url: https://learn.microsoft.com/en-us/azure/firewall/premium-features
