id: sc100-cs2a-laps
objective: "3.2.6"
type: yesno_statements
caseStudy: sc100-cs2a-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You plan to use Windows Local Administrator Password Solution (Windows LAPS) to meet the requirements for the local administrator passwords and the DSRM passwords.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser Windows Local Administrator Password Solution (Windows LAPS) pour répondre aux exigences relatives aux mots de passe d'administrateur local et aux mots de passe DSRM.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can configure the laptops to back up their local administrator passwords to Microsoft Entra ID.
        fr: Vous pouvez configurer les ordinateurs portables pour qu'ils sauvegardent leurs mots de passe d'administrateur local dans Microsoft Entra ID.
    - id: s2
      text:
        en: You can configure each laptop to back up its password to both Microsoft Entra ID and AD DS, so that the on-premises help desk tools keep working.
        fr: Vous pouvez configurer chaque ordinateur portable pour qu'il sauvegarde son mot de passe à la fois dans Microsoft Entra ID et dans AD DS, afin que les outils locaux du support technique continuent de fonctionner.
    - id: s3
      text:
        en: To meet the DSRM requirement, the domain controllers must back up their DSRM passwords to Microsoft Entra ID.
        fr: Pour répondre à l'exigence DSRM, les contrôleurs de domaine doivent sauvegarder leurs mots de passe DSRM dans Microsoft Entra ID.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The laptops are Microsoft Entra hybrid joined, and a hybrid-joined device can back up its password to Microsoft Entra ID or to AD DS: backing up to Microsoft Entra ID lets the help desk retrieve it from the cloud while the laptop is off the corporate network. A device can't back up to both directories at the same time, so you choose one target per device (Microsoft Entra ID for the laptops, AD DS for the domain-joined servers). Windows LAPS backs up DSRM passwords of domain controllers to Windows Server Active Directory only.
    fr: |
      Les ordinateurs portables sont joints à Microsoft Entra hybride, et un appareil joint hybride peut sauvegarder son mot de passe dans Microsoft Entra ID ou dans AD DS : la sauvegarde dans Microsoft Entra ID permet au support technique de le récupérer depuis le cloud quand l'ordinateur est hors du réseau de l'entreprise. Un appareil ne peut pas sauvegarder dans les deux annuaires à la fois ; vous choisissez donc une cible par appareil (Microsoft Entra ID pour les ordinateurs portables, AD DS pour les serveurs joints au domaine). Windows LAPS sauvegarde les mots de passe DSRM des contrôleurs de domaine uniquement dans Windows Server Active Directory.
references:
  - title: "Windows LAPS Overview: Manage Admin Passwords"
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview
