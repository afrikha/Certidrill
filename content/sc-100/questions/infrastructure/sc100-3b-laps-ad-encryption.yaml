id: sc100-3b-laps-ad-encryption
objective: "3.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an on-premises Active Directory Domain Services (AD DS) domain at the Windows Server 2016 domain functional level. The domain contains 600 member servers that run Windows Server 2019, Windows Server 2022 and Windows Server 2025. All the servers have the April 11, 2023 update or later. The servers aren't registered in Microsoft Entra ID. Legacy Microsoft LAPS is installed on 200 of the servers.

    You need to recommend a solution for the local administrator passwords of the servers. The solution must meet the following requirements:

    - Only the members of a group named Tier1-Admins can read the passwords.
    - After a server is restored from an old backup, an administrator can still sign in with a previous password.

    What should you recommend?
  fr: |
    Contoso dispose d'un domaine Active Directory Domain Services (AD DS) local au niveau fonctionnel de domaine Windows Server 2016. Le domaine contient 600 serveurs membres qui exécutent Windows Server 2019, Windows Server 2022 et Windows Server 2025. Tous les serveurs ont la mise à jour du 11 avril 2023 ou ultérieure. Les serveurs ne sont pas inscrits dans Microsoft Entra ID. Microsoft LAPS hérité est installé sur 200 des serveurs.

    Vous devez recommander une solution pour les mots de passe d'administrateur local des serveurs. La solution doit répondre aux exigences suivantes :

    - Seuls les membres d'un groupe nommé Tier1-Admins peuvent lire les mots de passe.
    - Après la restauration d'un serveur à partir d'une ancienne sauvegarde, un administrateur peut encore se connecter avec un mot de passe précédent.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Windows LAPS in legacy Microsoft LAPS emulation mode, with read permissions on the password attribute granted to Tier1-Admins", fr: "Windows LAPS en mode d'émulation de Microsoft LAPS hérité, avec des autorisations de lecture sur l'attribut de mot de passe accordées à Tier1-Admins" } }
    - { id: b, text: { en: "Windows LAPS with backup to Active Directory, password encryption enabled, Tier1-Admins as the authorized decryptor, and password history", fr: "Windows LAPS avec sauvegarde dans Active Directory, chiffrement des mots de passe activé, Tier1-Admins comme déchiffreur autorisé, et historique des mots de passe" } }
    - { id: c, text: { en: "Windows LAPS with backup to Active Directory, password encryption disabled, read permissions granted to Tier1-Admins, and password history", fr: "Windows LAPS avec sauvegarde dans Active Directory, chiffrement des mots de passe désactivé, autorisations de lecture accordées à Tier1-Admins, et historique des mots de passe" } }
    - { id: d, text: { en: "Windows LAPS with backup to Microsoft Entra ID, and the Cloud Device Administrator role assigned to Tier1-Admins", fr: "Windows LAPS avec sauvegarde dans Microsoft Entra ID, et le rôle Cloud Device Administrator attribué à Tier1-Admins" } }
answer: { optionId: b }
explanation:
  correct:
    en: Password encryption needs the Windows Server 2016 domain functional level, which Contoso has; the password is encrypted for one authorized decryptor principal, here the Tier1-Admins group. Password history is available only when password encryption is enabled, and it keeps the previous passwords needed after a restore. Legacy Microsoft LAPS is deprecated, and Microsoft recommends migrating from it to native Windows LAPS.
    fr: Le chiffrement des mots de passe nécessite le niveau fonctionnel de domaine Windows Server 2016, dont Contoso dispose ; le mot de passe est chiffré pour un seul principal déchiffreur autorisé, ici le groupe Tier1-Admins. L'historique des mots de passe n'est disponible que si le chiffrement est activé, et il conserve les mots de passe précédents nécessaires après une restauration. Microsoft LAPS hérité est déprécié, et Microsoft recommande de migrer vers Windows LAPS natif.
  options:
    a:
      en: Emulation mode stores the passwords in clear text in AD, so neither encryption nor password history is available.
      fr: Le mode d'émulation stocke les mots de passe en texte clair dans AD ; ni le chiffrement ni l'historique des mots de passe ne sont disponibles.
    c:
      en: "Password history isn't supported for clear-text passwords: it requires password encryption."
      fr: "L'historique des mots de passe n'est pas pris en charge pour les mots de passe en texte clair : il nécessite le chiffrement."
    d:
      en: The servers are joined only to AD DS, and Windows LAPS backs up the passwords of AD-joined devices to Active Directory only.
      fr: Les serveurs sont joints uniquement à AD DS, et Windows LAPS sauvegarde les mots de passe des appareils joints à AD uniquement dans Active Directory.
references:
  - title: Key concepts in Windows LAPS
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-concepts-overview
  - title: "Windows LAPS Overview: Manage Admin Passwords"
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview
