id: sc100-cs3b-proseware-discovery
objective: "3.1.6"
type: single
caseStudy: sc100-cs3b-fabrikam-freight
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that meets the exposure requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui respecte les exigences relatives à l'exposition.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create a Defender EASM resource and run a discovery with the Proseware domains as seeds", fr: "Créer une ressource Defender EASM et lancer une découverte avec les domaines de Proseware comme points de départ" } }
    - { id: b, text: { en: "Enable device discovery in Microsoft Defender for Endpoint on the Fabrikam servers", fr: "Activer la découverte d'appareils dans Microsoft Defender for Endpoint sur les serveurs de Fabrikam" } }
    - { id: c, text: { en: "Use Cloud Discovery in Microsoft Defender for Cloud Apps to list the apps that Proseware uses", fr: "Utiliser Cloud Discovery dans Microsoft Defender for Cloud Apps pour lister les applications utilisées par Proseware" } }
    - { id: d, text: { en: "Connect the Proseware hosting accounts to Defender CSPM and review the internet exposure insights", fr: "Connecter les comptes d'hébergement de Proseware à Defender CSPM et examiner les informations sur l'exposition à Internet" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Defender EASM continuously discovers and maps an organization's internet-facing attack surface from the outside. Starting from discovery seeds such as domains, it recursively finds connected hosts, IP address blocks and other assets, including previously unknown ones, without access to the target networks.
    fr: |-
      Defender EASM découvre et cartographie en continu, depuis l'extérieur, la surface d'attaque d'une organisation exposée sur Internet. À partir de points de départ de découverte (seeds) comme des domaines, il trouve de façon récursive les hôtes, les blocs d'adresses IP et les autres ressources connectés, y compris ceux qui étaient inconnus, sans accès aux réseaux cibles.
  options:
    d:
      en: |-
        Defender CSPM needs a connector to each cloud account, which requires access to the hosting accounts. It also can't find assets in accounts that nobody knows about.
      fr: |-
        Defender CSPM a besoin d'un connecteur vers chaque compte cloud, ce qui exige un accès aux comptes d'hébergement. Il ne peut pas non plus trouver des ressources dans des comptes que personne ne connaît.
    b:
      en: |-
        Device discovery finds devices on the internal networks where Defender for Endpoint is deployed, not the internet-facing assets of another company.
      fr: |-
        La découverte d'appareils trouve les appareils des réseaux internes où Defender for Endpoint est déployé, pas les ressources exposées sur Internet d'une autre entreprise.
    c:
      en: |-
        Cloud Discovery analyzes network traffic to identify the cloud apps that users access. It doesn't inventory the websites that Proseware exposes.
      fr: |-
        Cloud Discovery analyse le trafic réseau pour identifier les applications cloud auxquelles les utilisateurs accèdent. Il n'inventorie pas les sites web exposés par Proseware.
references:
  - title: Defender EASM Overview
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview
