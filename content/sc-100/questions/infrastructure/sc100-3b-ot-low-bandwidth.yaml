id: sc100-3b-ot-low-bandwidth
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Utilities operates 60 remote water pumping stations. Each station has a small OT network and is connected to the corporate WAN by a low-bandwidth, high-latency satellite link. Outbound connections to Azure are allowed.

    The security team must monitor the OT traffic of every station with Microsoft Defender for IoT and see the devices and alerts of all the stations in the Azure portal. The design must not saturate the satellite links.

    What should you recommend?
  fr: |
    Wingtip Utilities exploite 60 stations de pompage d'eau distantes. Chaque station dispose d'un petit réseau OT et est reliée au WAN de l'entreprise par une liaison satellite à faible bande passante et à latence élevée. Les connexions sortantes vers Azure sont autorisées.

    L'équipe de sécurité doit surveiller le trafic OT de chaque station avec Microsoft Defender for IoT et voir dans le portail Azure les appareils et les alertes de toutes les stations. La conception ne doit pas saturer les liaisons satellite.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One OT sensor virtual machine in Azure that receives the traffic mirrored from all the stations over the WAN", fr: "Une machine virtuelle de capteur OT dans Azure qui reçoit le trafic mis en miroir depuis toutes les stations via le WAN" } }
    - { id: b, text: { en: "A cloud-connected OT sensor in each station that analyzes traffic locally and sends telemetry and alerts to Azure", fr: "Un capteur OT connecté au cloud dans chaque station, qui analyse le trafic localement et envoie la télémétrie et les alertes à Azure" } }
    - { id: c, text: { en: "A locally managed OT sensor in each station, with alerts exported manually from each sensor console every week", fr: "Un capteur OT géré localement dans chaque station, avec des alertes exportées manuellement de chaque console de capteur chaque semaine" } }
    - { id: d, text: { en: "One OT sensor in the corporate datacenter that receives the traffic mirrored from the WAN routers", fr: "Un capteur OT dans le centre de données de l'entreprise qui reçoit le trafic mis en miroir depuis les routeurs du WAN" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An OT sensor collects, processes, analyzes and alerts directly on the sensor, which suits locations with low bandwidth or high latency: only telemetry and insights are sent to the Azure portal. Cloud-connected sensors give the central view of the devices and alerts of all the stations.
    fr: |
      Un capteur OT collecte, traite, analyse et génère les alertes directement sur le capteur, ce qui convient aux sites à faible bande passante ou à latence élevée : seules la télémétrie et les informations sont envoyées au portail Azure. Les capteurs connectés au cloud offrent la vue centralisée des appareils et des alertes de toutes les stations.
  options:
    a:
      en: |
        Mirroring the raw traffic of 60 stations over satellite links would saturate them; the sensor must be placed where it sees the traffic.
      fr: |
        Mettre en miroir le trafic brut de 60 stations sur des liaisons satellite les saturerait ; le capteur doit être placé là où il voit le trafic.
    c:
      en: |
        Locally managed sensors don't send their data to Azure, so the team wouldn't get the central view in the Azure portal.
      fr: |
        Les capteurs gérés localement n'envoient pas leurs données à Azure ; l'équipe n'obtiendrait donc pas la vue centralisée dans le portail Azure.
    d:
      en: |
        A sensor in the datacenter would see only the traffic that crosses the WAN, not the communication between the devices inside each station.
      fr: |
        Un capteur dans le centre de données ne verrait que le trafic qui traverse le WAN, pas les communications entre les appareils à l'intérieur de chaque station.
references:
  - title: Microsoft Defender for IoT architecture and components for your OT environment
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/architecture
