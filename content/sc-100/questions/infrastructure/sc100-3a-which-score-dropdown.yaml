id: sc100-3a-which-score-dropdown
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft 365 E5, Microsoft Defender for Cloud with Defender CSPM on Azure, AWS and GCP, and Microsoft Security Exposure Management. The board asks for three posture indicators.

    Which score should you recommend for each indicator? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft 365 E5, Microsoft Defender for Cloud avec Defender CSPM sur Azure, AWS et GCP, ainsi que Microsoft Security Exposure Management. Le conseil d'administration demande trois indicateurs de posture.

    Quel score devez-vous recommander pour chaque indicateur ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Posture of the Microsoft 365 identities, email and collaboration workloads: [[m365]]

      Posture of the Azure, AWS and GCP resources, weighted by asset risk factors and asset criticality: [[cloud]]

      Resilience of the organization against ransomware, with a target value: [[ransom]]
    fr: |
      Posture des identités, de la messagerie et des charges de travail de collaboration Microsoft 365 : [[m365]]

      Posture des ressources Azure, AWS et GCP, pondérée par les facteurs de risque et la criticité des ressources : [[cloud]]

      Résilience de l'organisation face aux rançongiciels, avec une valeur cible : [[ransom]]
  slots:
    - id: m365
      options:
        - { id: mss, text: { en: "Microsoft Secure Score", fr: "Niveau de sécurité Microsoft" } }
        - { id: classic, text: { en: "Classic secure score of Defender for Cloud", fr: "Degré de sécurisation classique de Defender for Cloud" } }
        - { id: cloud, text: { en: "Cloud Secure Score of Defender for Cloud", fr: "Cloud Secure Score de Defender for Cloud" } }
        - { id: initiative, text: { en: "Score of a Security Exposure Management initiative", fr: "Score d'une initiative de Security Exposure Management" } }
    - id: cloud
      options:
        - { id: mss, text: { en: "Microsoft Secure Score", fr: "Niveau de sécurité Microsoft" } }
        - { id: classic, text: { en: "Classic secure score of Defender for Cloud", fr: "Degré de sécurisation classique de Defender for Cloud" } }
        - { id: cloud, text: { en: "Cloud Secure Score of Defender for Cloud", fr: "Cloud Secure Score de Defender for Cloud" } }
        - { id: initiative, text: { en: "Score of a Security Exposure Management initiative", fr: "Score d'une initiative de Security Exposure Management" } }
    - id: ransom
      options:
        - { id: mss, text: { en: "Microsoft Secure Score", fr: "Niveau de sécurité Microsoft" } }
        - { id: classic, text: { en: "Classic secure score of Defender for Cloud", fr: "Degré de sécurisation classique de Defender for Cloud" } }
        - { id: cloud, text: { en: "Cloud Secure Score of Defender for Cloud", fr: "Cloud Secure Score de Defender for Cloud" } }
        - { id: initiative, text: { en: "Score of a Security Exposure Management initiative", fr: "Score d'une initiative de Security Exposure Management" } }
answer:
  values: { m365: mss, cloud: cloud, ransom: initiative }
explanation:
  correct:
    en: Microsoft Secure Score covers Microsoft 365 workloads such as Microsoft Entra ID, Exchange Online, SharePoint Online and Teams. The risk-based Cloud Secure Score, shown in the Defender portal, weights open recommendations by risk level and by asset risk factors and criticality; the classic secure score counts MCSB recommendations without those factors. A Security Exposure Management initiative measures exposure in one security area, such as ransomware, and lets you set a target score.
    fr: Le Niveau de sécurité Microsoft couvre les charges de travail Microsoft 365 comme Microsoft Entra ID, Exchange Online, SharePoint Online et Teams. Le Cloud Secure Score basé sur les risques, affiché dans le portail Defender, pondère les recommandations ouvertes selon leur niveau de risque et selon les facteurs de risque et la criticité des ressources ; le degré de sécurisation classique compte les recommandations du MCSB sans ces facteurs. Une initiative de Security Exposure Management mesure l'exposition dans un domaine de sécurité, comme les rançongiciels, et permet de définir un score cible.
  options:
    classic:
      en: The classic secure score doesn't take asset risk factors or criticality into account, and it doesn't measure Microsoft 365 workloads.
      fr: Le degré de sécurisation classique ne tient pas compte des facteurs de risque ni de la criticité des ressources, et il ne mesure pas les charges de travail Microsoft 365.
references:
  - title: Cloud Secure Score in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
  - title: Review Security Initiatives in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/initiatives
