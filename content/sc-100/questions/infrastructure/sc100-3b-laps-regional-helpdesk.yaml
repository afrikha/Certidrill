id: sc100-3b-laps-regional-helpdesk
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has 9,000 Windows 11 devices that are Microsoft Entra joined and managed by Microsoft Intune. The devices are used in France, Germany and Spain. Fabrikam plans to deploy Windows LAPS and back up the local administrator passwords to Microsoft Entra ID.

    Each country has its own help desk team. A help desk team must be able to recover the local administrator password of the devices in its own country only. The solution must follow the principle of least privilege.

    What should you recommend?
  fr: |
    Fabrikam dispose de 9 000 appareils Windows 11 joints à Microsoft Entra et gérés par Microsoft Intune. Les appareils sont utilisés en France, en Allemagne et en Espagne. Fabrikam prévoit de déployer Windows LAPS et de sauvegarder les mots de passe d'administrateur local dans Microsoft Entra ID.

    Chaque pays dispose de sa propre équipe de support technique. Une équipe de support doit pouvoir récupérer le mot de passe d'administrateur local des appareils de son pays uniquement. La solution doit respecter le principe du moindre privilège.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Assign the Helpdesk Administrator role to each team at the tenant scope.", fr: "Attribuer le rôle Helpdesk Administrator à chaque équipe dans l'étendue du locataire." } }
    - { id: b, text: { en: "Assign the Intune Administrator role to each team at the tenant scope.", fr: "Attribuer le rôle Intune Administrator à chaque équipe dans l'étendue du locataire." } }
    - { id: c, text: { en: "Assign the Cloud Device Administrator role to each team, scoped to an administrative unit that contains the devices of its country.", fr: "Attribuer le rôle Cloud Device Administrator à chaque équipe, dans l'étendue d'une unité administrative qui contient les appareils de son pays." } }
    - { id: d, text: { en: "Assign the Security Reader role to each team, scoped to an administrative unit that contains the devices of its country.", fr: "Attribuer le rôle Security Reader à chaque équipe, dans l'étendue d'une unité administrative qui contient les appareils de son pays." } }
answer: { optionId: c }
explanation:
  correct:
    en: Cloud Device Administrator can read both the LAPS password and its metadata. Microsoft Entra ID lets you add devices to an administrative unit and assign Cloud Device Administrator scoped to that unit, so each team recovers passwords only for the devices of its country.
    fr: Cloud Device Administrator peut lire le mot de passe LAPS et ses métadonnées. Microsoft Entra ID permet d'ajouter des appareils à une unité administrative et d'attribuer Cloud Device Administrator dans l'étendue de cette unité ; chaque équipe ne récupère ainsi que les mots de passe des appareils de son pays.
  options:
    a:
      en: Helpdesk Administrator can read only the LAPS metadata, not the password, and the tenant scope covers every country.
      fr: Helpdesk Administrator ne peut lire que les métadonnées LAPS, pas le mot de passe, et l'étendue du locataire couvre tous les pays.
    b:
      en: Intune Administrator can recover passwords, but at the tenant scope each team could read the passwords of all 9,000 devices and would also get full Intune administration rights.
      fr: Intune Administrator peut récupérer les mots de passe, mais dans l'étendue du locataire chaque équipe pourrait lire les mots de passe des 9 000 appareils et obtiendrait aussi tous les droits d'administration Intune.
    d:
      en: Security Reader grants access to the LAPS metadata only, so the teams couldn't recover any password.
      fr: Security Reader ne donne accès qu'aux métadonnées LAPS ; les équipes ne pourraient donc récupérer aucun mot de passe.
references:
  - title: Use Windows Local Administrator Password Solution (LAPS) with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-manage-local-admin-passwords
