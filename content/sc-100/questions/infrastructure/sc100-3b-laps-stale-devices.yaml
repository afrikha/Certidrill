id: sc100-3b-laps-stale-devices
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has 1,500 Microsoft Entra joined Windows 11 devices that back up their local administrator passwords to Microsoft Entra ID by using Windows LAPS. An automated cleanup process deletes from Microsoft Entra ID every device object that hasn't signed in for 90 days.

    About 200 of the devices are spare laptops kept in storage for up to a year. When a spare laptop is taken out of storage, a technician must be able to sign in with the local administrator account before the device reconnects to the network.

    What should you recommend?
  fr: |
    Tailspin Toys dispose de 1 500 appareils Windows 11 joints à Microsoft Entra qui sauvegardent leurs mots de passe d'administrateur local dans Microsoft Entra ID avec Windows LAPS. Un processus de nettoyage automatisé supprime de Microsoft Entra ID chaque objet appareil qui ne s'est pas connecté depuis 90 jours.

    Environ 200 des appareils sont des ordinateurs portables de rechange conservés en stock jusqu'à un an. Quand un ordinateur portable de rechange sort du stock, un technicien doit pouvoir se connecter avec le compte d'administrateur local avant que l'appareil ne se reconnecte au réseau.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable password history in the Windows LAPS policy of the spare laptops.", fr: "Activer l'historique des mots de passe dans la stratégie Windows LAPS des ordinateurs portables de rechange." } }
    - { id: b, text: { en: "Increase the maximum password age in the Windows LAPS policy to 365 days.", fr: "Porter l'âge maximal du mot de passe à 365 jours dans la stratégie Windows LAPS." } }
    - { id: c, text: { en: "Configure a post-authentication action that resets the password after each use.", fr: "Configurer une action post-authentification qui réinitialise le mot de passe après chaque utilisation." } }
    - { id: d, text: { en: "Exclude the spare laptops from the automated device cleanup process.", fr: "Exclure les ordinateurs portables de rechange du processus de nettoyage automatisé des appareils." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The LAPS password backed up to Microsoft Entra ID is stored on the device object. When the device is deleted from Microsoft Entra ID, its LAPS credential is lost and can't be recovered, so the stored laptops must be kept out of the cleanup process.
    fr: |
      Le mot de passe LAPS sauvegardé dans Microsoft Entra ID est stocké sur l'objet appareil. Quand l'appareil est supprimé de Microsoft Entra ID, ses informations d'identification LAPS sont perdues et ne peuvent pas être récupérées ; les ordinateurs en stock doivent donc être exclus du nettoyage.
  options:
    a:
      en: |
        Password history is a feature of passwords backed up to Active Directory with encryption, and it wouldn't survive the deletion of the device object anyway.
      fr: |
        L'historique des mots de passe est une fonctionnalité des mots de passe sauvegardés dans Active Directory avec chiffrement, et il ne survivrait de toute façon pas à la suppression de l'objet appareil.
    b:
      en: |
        A longer password age changes when the password rotates, but the backed-up password still disappears when the device object is deleted after 90 days.
      fr: |
        Un âge de mot de passe plus long modifie la date de rotation, mais le mot de passe sauvegardé disparaît quand même lors de la suppression de l'objet appareil après 90 jours.
    c:
      en: |
        A post-authentication action limits how long a used password stays valid; it doesn't keep the password retrievable after the device object is deleted.
      fr: |
        Une action post-authentification limite la durée de validité d'un mot de passe utilisé ; elle ne permet pas de récupérer le mot de passe après la suppression de l'objet appareil.
references:
  - title: Use Windows Local Administrator Password Solution (LAPS) with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-manage-local-admin-passwords
