id: sc100-3a-arc-govern-onprem
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has 500 Windows Server and Linux servers in two on-premises datacenters. The cloud governance team wants to manage the servers like Azure VMs: organize them in resource groups with tags, control administrative access with Azure role-based access control (Azure RBAC), and audit the settings inside the operating systems by using Azure Policy.

    What should you recommend?
  fr: |
    Proseware, Inc. dispose de 500 serveurs Windows Server et Linux dans deux centres de données locaux. L'équipe de gouvernance cloud veut gérer les serveurs comme des machines virtuelles Azure : les organiser dans des groupes de ressources avec des étiquettes, contrôler l'accès d'administration avec le contrôle d'accès en fonction du rôle Azure (Azure RBAC) et auditer les paramètres à l'intérieur des systèmes d'exploitation avec Azure Policy.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Install the Azure Monitor Agent on each server and associate a data collection rule", fr: "Installer l'agent Azure Monitor sur chaque serveur et associer une règle de collecte de données" }
    - id: b
      text: { en: "Onboard each server directly to Microsoft Defender for Endpoint", fr: "Intégrer chaque serveur directement à Microsoft Defender for Endpoint" }
    - id: c
      text: { en: "Connect each server to Azure as an Azure Arc-enabled server", fr: "Connecter chaque serveur à Azure en tant que serveur compatible Azure Arc" }
    - id: d
      text: { en: "Delegate the datacenter subscriptions to the governance team by using Azure Lighthouse", fr: "Déléguer les abonnements des centres de données à l'équipe de gouvernance avec Azure Lighthouse" }
answer:
  optionId: c
explanation:
  correct:
    en: Azure Arc-enabled servers give each machine outside Azure an Azure resource ID, so it can be placed in a resource group, tagged and governed with Azure RBAC. Azure Policy machine configuration can then audit settings inside the operating system, as for Azure VMs.
    fr: Les serveurs compatibles Azure Arc donnent à chaque machine hors d'Azure un ID de ressource Azure ; elle peut ainsi être placée dans un groupe de ressources, étiquetée et gouvernée avec Azure RBAC. La configuration des machines Azure Policy peut ensuite auditer les paramètres du système d'exploitation, comme pour les machines virtuelles Azure.
  options:
    a:
      en: The Azure Monitor Agent collects logs and metrics; it doesn't turn the servers into Azure resources that Azure RBAC and Azure Policy can govern.
      fr: L'agent Azure Monitor collecte des journaux et des métriques ; il ne transforme pas les serveurs en ressources Azure que Azure RBAC et Azure Policy peuvent gouverner.
    b:
      en: Direct onboarding to Defender for Endpoint provides endpoint protection, but the servers don't become Azure resources.
      fr: L'intégration directe à Defender for Endpoint fournit la protection des points de terminaison, mais les serveurs ne deviennent pas des ressources Azure.
    d:
      en: Azure Lighthouse delegates access to existing Azure resources across tenants; it doesn't bring on-premises servers into Azure.
      fr: Azure Lighthouse délègue l'accès à des ressources Azure existantes entre locataires ; il n'intègre pas les serveurs locaux à Azure.
references:
  - title: Azure Arc-enabled servers Overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
