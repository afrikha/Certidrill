id: sc100-cs2b-score-comparison
objective: "3.1.1"
type: yesno_statements
caseStudy: sc100-cs2b-vanarsdel-payments
difficulty: 3
status: draft
stem:
  en: |
    You prepare the explanation of the secure score for the board, as required by the posture management requirements. The AWS accounts and the GCP project are connected to Defender for Cloud.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez l'explication du degré de sécurisation pour le conseil d'administration, comme l'exigent les exigences de gestion de la posture. Les comptes AWS et le projet GCP sont connectés à Defender for Cloud.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The recommendations for the AWS accounts and the GCP project contribute to the secure score of Defender for Cloud, and each connector gets its own score.
        fr: Les recommandations pour les comptes AWS et le projet GCP contribuent au degré de sécurisation de Defender for Cloud, et chaque connecteur obtient son propre score.
    - id: s2
      text:
        en: Adding the PCI DSS v4.0.1 standard to the regulatory compliance dashboard changes how the classic secure score of the subscriptions is calculated.
        fr: Ajouter la norme PCI DSS v4.0.1 au tableau de bord de conformité réglementaire modifie la façon dont le degré de sécurisation classique des abonnements est calculé.
    - id: s3
      text:
        en: The cloud secure score of Defender for Cloud and the Microsoft Secure Score for Microsoft 365 use the same calculation model, so the board can compare the two values directly.
        fr: Le degré de sécurisation cloud de Defender for Cloud et le Niveau de sécurité Microsoft pour Microsoft 365 utilisent le même modèle de calcul ; le conseil d'administration peut donc comparer directement les deux valeurs.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Defender for Cloud calculates a score for each subscription, AWS account, GCP project or connector, and the posture page filters it by environment. In the classic secure score, only the built-in recommendations of the MCSB affect the score; adding a standard such as PCI DSS adds its controls to the regulatory compliance dashboard without changing how the score is calculated. The cloud secure score and Microsoft Secure Score are separate models with different calculations, so their values aren't directly comparable.
    fr: |
      Defender for Cloud calcule un score pour chaque abonnement, compte AWS, projet GCP ou connecteur, et la page de posture le filtre par environnement. Dans le degré de sécurisation classique, seules les recommandations intégrées du MCSB influent sur le score ; ajouter une norme comme PCI DSS ajoute ses contrôles au tableau de bord de conformité réglementaire sans changer le calcul du score. Le degré de sécurisation cloud et le Niveau de sécurité Microsoft sont des modèles distincts aux calculs différents ; leurs valeurs ne sont donc pas directement comparables.
references:
  - title: Cloud Secure Score in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
