id: sc100-3c-net-central-rules
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has 300 virtual networks in 60 subscriptions under a single management group. Each workload team manages the network security groups (NSGs) of its own subnets.

    The security team must ensure that:

    - inbound RDP and SSH from the internet is denied in every virtual network, whatever rules the workload teams create in their NSGs;
    - virtual networks created later in the management group receive the rule without manual action;
    - the workload teams keep control of their own NSG rules for application traffic.

    What should you recommend?
  fr: |
    Fabrikam dispose de 300 réseaux virtuels dans 60 abonnements sous un même groupe d'administration. Chaque équipe de charge de travail gère les groupes de sécurité réseau (NSG) de ses propres sous-réseaux.

    L'équipe de sécurité doit garantir que :

    - le RDP et le SSH entrants depuis Internet sont refusés dans chaque réseau virtuel, quelles que soient les règles créées par les équipes dans leurs NSG ;
    - les réseaux virtuels créés ultérieurement dans le groupe d'administration reçoivent la règle sans action manuelle ;
    - les équipes de charge de travail gardent le contrôle de leurs propres règles NSG pour le trafic applicatif.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Just-in-time VM access in Defender for Cloud on every subscription", fr: "L'accès juste-à-temps aux machines virtuelles de Defender for Cloud sur chaque abonnement" } }
    - { id: b, text: { en: "Security admin rules in Azure Virtual Network Manager, applied to a network group with Azure Policy-based dynamic membership", fr: "Des règles d'administration de la sécurité dans Azure Virtual Network Manager, appliquées à un groupe réseau à appartenance dynamique fondée sur Azure Policy" } }
    - { id: c, text: { en: "A central NSG with deny rules, associated by the security team with every subnet", fr: "Un NSG central avec des règles de refus, associé par l'équipe de sécurité à chaque sous-réseau" } }
    - { id: d, text: { en: "Azure Firewall in a hub, with no DNAT rule for ports 3389 and 22", fr: "Le Pare-feu Azure dans un hub, sans règle DNAT pour les ports 3389 et 22" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Security admin rules are evaluated before NSG rules, and a Deny admin rule stops the traffic so that no NSG rule can allow it. A network group whose membership is defined by Azure Policy adds new virtual networks automatically, and the workload teams keep managing their NSGs for everything else.
    fr: |-
      Les règles d'administration de la sécurité sont évaluées avant les règles NSG, et une règle d'administration Deny arrête le trafic : aucune règle NSG ne peut l'autoriser. Un groupe réseau dont l'appartenance est définie par Azure Policy ajoute automatiquement les nouveaux réseaux virtuels, et les équipes continuent de gérer leurs NSG pour tout le reste.
  options:
    a:
      en: |-
        Just-in-time access opens management ports on demand through NSG rules; it doesn't stop workload teams from opening them permanently.
      fr: |-
        L'accès juste-à-temps ouvre les ports de gestion à la demande par des règles NSG ; il n'empêche pas les équipes de les ouvrir de façon permanente.
    c:
      en: |-
        A subnet has only one NSG, so a central NSG would take control of the subnet rules away from the workload teams, and new subnets would need manual association.
      fr: |-
        Un sous-réseau n'a qu'un seul NSG : un NSG central retirerait aux équipes le contrôle des règles du sous-réseau, et les nouveaux sous-réseaux exigeraient une association manuelle.
    d:
      en: |-
        Azure Firewall filters only the traffic routed through it; a VM with its own public IP address and an open NSG rule would bypass it.
      fr: |-
        Le Pare-feu Azure ne filtre que le trafic routé vers lui ; une machine virtuelle dotée de sa propre adresse IP publique et d'une règle NSG ouverte le contournerait.
references:
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
  - title: Configuring network groups with Azure Policy in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-azure-policy-integration
