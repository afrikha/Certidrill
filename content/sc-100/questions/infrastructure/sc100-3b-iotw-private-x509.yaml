id: sc100-3b-iotw-private-x509
objective: "3.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Manufacturing has an Azure IoT hub that receives data from machines in two factories. The factories are connected to Azure by ExpressRoute private peering. Some machines authenticate with X.509 certificates and others with SAS tokens derived from device symmetric keys.

    The new security baseline for the IoT workload states:

    - The IoT hub must not be reachable from the public internet.
    - Devices and modules must authenticate only with X.509 certificates.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Manufacturing dispose d'un hub IoT Azure qui reçoit les données de machines de deux usines. Les usines sont reliées à Azure par le peering privé ExpressRoute. Certaines machines s'authentifient avec des certificats X.509 et d'autres avec des jetons SAS dérivés de clés symétriques d'appareil.

    La nouvelle base de référence de sécurité de la charge de travail IoT indique :

    - Le hub IoT ne doit pas être accessible depuis Internet.
    - Les appareils et les modules doivent s'authentifier uniquement avec des certificats X.509.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a private endpoint for the IoT hub in a virtual network reachable over ExpressRoute, and disable public network access.", fr: "Créer un point de terminaison privé pour le hub IoT dans un réseau virtuel joignable par ExpressRoute, et désactiver l'accès au réseau public." } }
    - { id: b, text: { en: "Add IP filter rules that allow only the public IP addresses of the two factories.", fr: "Ajouter des règles de filtre IP qui n'autorisent que les adresses IP publiques des deux usines." } }
    - { id: c, text: { en: "Disable SAS token authentication for devices and modules on the IoT hub.", fr: "Désactiver l'authentification par jeton SAS pour les appareils et les modules sur le hub IoT." } }
    - { id: d, text: { en: "Shorten the lifetime of the SAS tokens that the devices generate to one hour.", fr: "Réduire à une heure la durée de vie des jetons SAS générés par les appareils." } }
    - { id: e, text: { en: "Publish a certificate revocation list that IoT Hub checks at each connection.", fr: "Publier une liste de révocation de certificats qu'IoT Hub vérifie à chaque connexion." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A private endpoint gives the IoT hub a private IP address that on-premises devices reach over ExpressRoute private peering, and it supports both device and service APIs; turning off public network access then blocks the public endpoint. Disabling SAS authentication for devices and modules leaves X.509 certificates as the only device authentication option.
    fr: |
      Un point de terminaison privé donne au hub IoT une adresse IP privée que les appareils locaux joignent par le peering privé ExpressRoute, et il prend en charge les API d'appareil comme les API de service ; désactiver ensuite l'accès au réseau public bloque le point de terminaison public. Désactiver l'authentification SAS pour les appareils et les modules laisse les certificats X.509 comme seule option d'authentification des appareils.
  options:
    b:
      en: |
        An IP filter that allows public addresses keeps the public endpoint reachable from the internet.
      fr: |
        Un filtre IP qui autorise des adresses publiques laisse le point de terminaison public accessible depuis Internet.
    d:
      en: |
        Short-lived SAS tokens are still SAS authentication, which the baseline forbids for devices and modules.
      fr: |
        Des jetons SAS de courte durée restent une authentification SAS, que la base de référence interdit pour les appareils et les modules.
    e:
      en: |
        IoT Hub doesn't check certificate revocation lists; you disable a device in the identity registry to block it.
      fr: |
        IoT Hub ne vérifie pas les listes de révocation de certificats ; vous désactivez un appareil dans le registre des identités pour le bloquer.
references:
  - title: Azure IoT Hub support for virtual networks
    url: https://learn.microsoft.com/en-us/azure/iot-hub/virtual-network-support
  - title: Authenticate with X.509 certificates
    url: https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-x509
