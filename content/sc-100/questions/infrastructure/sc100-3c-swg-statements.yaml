id: sc100-3c-swg-statements
objective: "3.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is evaluating Microsoft Entra Internet Access as the secure web gateway for its employees. TLS inspection isn't enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam évalue Accès Internet Microsoft Entra comme passerelle web sécurisée pour ses employés. L'inspection TLS n'est pas activée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Web content filtering matches HTTPS traffic on the Server Name Indication (SNI) of the connection.
        fr: |-
          Le filtrage du contenu web compare le trafic HTTPS sur l'indication du nom du serveur (SNI) de la connexion.
    - id: s2
      text:
        en: |-
          When two security profiles apply to a user, the profile with priority 200 is processed before the profile with priority 100.
        fr: |-
          Quand deux profils de sécurité s'appliquent à un utilisateur, le profil de priorité 200 est traité avant le profil de priorité 100.
    - id: s3
      text:
        en: |-
          Users of Internet Access need a Microsoft Entra ID P1 or P2 license in addition to the Internet Access license.
        fr: |-
          Les utilisateurs d'Accès Internet ont besoin d'une licence Microsoft Entra ID P1 ou P2 en plus de la licence Internet Access.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      For TLS-encrypted traffic, web content filtering relies on the SNI unless TLS inspection is turned on; unencrypted HTTP is matched on the URL. Security profiles are processed in priority order from 100, the highest, to 65,000, the lowest, so priority 100 comes first. Internet Access is licensed standalone or in Microsoft Entra Suite, and its users also need Microsoft Entra ID P1 or P2.
    fr: |-
      Pour le trafic chiffré en TLS, le filtrage du contenu web s'appuie sur le SNI sauf si l'inspection TLS est activée ; le HTTP non chiffré est comparé sur l'URL. Les profils de sécurité sont traités par ordre de priorité, de 100, la plus haute, à 65 000, la plus basse : la priorité 100 passe donc en premier. Accès Internet est concédé sous licence de façon autonome ou dans Microsoft Entra Suite, et ses utilisateurs ont aussi besoin de Microsoft Entra ID P1 ou P2.
references:
  - title: Learn about Microsoft Entra Internet Access for all apps
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-internet-access
  - title: What is Global Secure Access?
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access
