id: sc100-3a-server-controls-dropdown
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. runs Windows Server and Linux servers as Azure VMs and as on-premises Azure Arc-enabled servers. Defender for Servers Plan 2 is enabled. You are writing the server security requirements.

    What should you specify for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. exécute des serveurs Windows Server et Linux sous forme de machines virtuelles Azure et de serveurs locaux compatibles Azure Arc. Defender for Servers Plan 2 est activé. Vous rédigez les exigences de sécurité des serveurs.

    Que devez-vous spécifier pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Detect changes to critical system files and registry keys on the Azure VMs: [[fim]]

      Audit the SSH settings of the Linux servers and the password policy of the Windows servers with the same definitions in Azure and on-premises: [[config]]

      Install operating system security updates on a schedule on the Azure VMs and the Arc-enabled servers: [[patch]]
    fr: |
      Détecter les modifications des fichiers système critiques et des clés de Registre sur les machines virtuelles Azure : [[fim]]

      Auditer les paramètres SSH des serveurs Linux et la stratégie de mot de passe des serveurs Windows avec les mêmes définitions dans Azure et en local : [[config]]

      Installer selon une planification les mises à jour de sécurité du système d'exploitation sur les machines virtuelles Azure et les serveurs compatibles Arc : [[patch]]
  slots:
    - id: fim
      options:
        - { id: fim, text: { en: "File integrity monitoring", fr: "Surveillance de l'intégrité des fichiers" } }
        - { id: mc, text: { en: "Azure Policy machine configuration", fr: "Configuration des machines Azure Policy" } }
        - { id: aum, text: Azure Update Manager }
        - { id: jit, text: { en: "Just-in-time VM access", fr: "Accès juste-à-temps aux machines virtuelles" } }
    - id: config
      options:
        - { id: fim, text: { en: "File integrity monitoring", fr: "Surveillance de l'intégrité des fichiers" } }
        - { id: mc, text: { en: "Azure Policy machine configuration", fr: "Configuration des machines Azure Policy" } }
        - { id: aum, text: Azure Update Manager }
        - { id: jit, text: { en: "Just-in-time VM access", fr: "Accès juste-à-temps aux machines virtuelles" } }
    - id: patch
      options:
        - { id: fim, text: { en: "File integrity monitoring", fr: "Surveillance de l'intégrité des fichiers" } }
        - { id: mc, text: { en: "Azure Policy machine configuration", fr: "Configuration des machines Azure Policy" } }
        - { id: aum, text: Azure Update Manager }
        - { id: jit, text: { en: "Just-in-time VM access", fr: "Accès juste-à-temps aux machines virtuelles" } }
answer:
  values: { fim: fim, config: mc, patch: aum }
explanation:
  correct:
    en: File integrity monitoring, a Defender for Servers Plan 2 feature, detects changes to files and registry keys. Machine configuration audits or configures operating system settings on Azure VMs and hybrid Arc-enabled machines, for both Windows and Linux, so the same definitions apply everywhere. Azure Update Manager installs operating system updates on Azure VMs and Arc-enabled servers.
    fr: La surveillance de l'intégrité des fichiers, une fonctionnalité de Defender for Servers Plan 2, détecte les modifications des fichiers et des clés de Registre. La configuration des machines audite ou configure les paramètres du système d'exploitation sur les machines virtuelles Azure et les machines hybrides compatibles Arc, pour Windows comme pour Linux ; les mêmes définitions s'appliquent donc partout. Azure Update Manager installe les mises à jour du système d'exploitation sur les machines virtuelles Azure et les serveurs compatibles Arc.
  options:
    jit:
      en: Just-in-time VM access controls when management ports are open; it doesn't detect changes, audit settings or install updates.
      fr: L'accès juste-à-temps aux machines virtuelles contrôle l'ouverture des ports de gestion ; il ne détecte pas de modifications, n'audite pas de paramètres et n'installe pas de mises à jour.
references:
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
