id: sc100-3c-vuln-gate
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs microservices on Azure Kubernetes Service (AKS) clusters and stores the images in Azure Container Registry. Microsoft Defender for Containers is enabled on all subscriptions, and developers already receive the vulnerability findings for the registry images.

    Despite the findings, images with critical vulnerabilities still reach production. The security team wants deployments of such images to be reported first, then refused once teams are ready, without writing custom admission controllers.

    What should you include in the recommendation?
  fr: |
    Litware exécute des microservices sur des clusters Azure Kubernetes Service (AKS) et stocke les images dans Azure Container Registry. Microsoft Defender for Containers est activé sur tous les abonnements, et les développeurs reçoivent déjà les résultats de vulnérabilité des images du registre.

    Malgré ces résultats, des images présentant des vulnérabilités critiques arrivent encore en production. L'équipe de sécurité veut que les déploiements de ces images soient d'abord signalés, puis refusés une fois les équipes prêtes, sans écrire de contrôleurs d'admission personnalisés.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "Gated deployment rules in Defender for Containers, set to audit and then to block", fr: "Des règles de déploiement contrôlé dans Defender for Containers, en mode audit puis en mode blocage" } }
    - { id: b, text: { en: "Binary drift blocking in the runtime protection of Defender for Containers", fr: "Le blocage de la dérive des binaires dans la protection à l'exécution de Defender for Containers" } }
    - { id: c, text: { en: "ACR Tasks triggered by base image updates to rebuild the application images", fr: "Des tâches ACR déclenchées par les mises à jour des images de base pour reconstruire les images applicatives" } }
    - { id: d, text: { en: "Daily rescans of the running containers by the agentless vulnerability assessment", fr: "Une nouvelle analyse quotidienne des conteneurs en cours d'exécution par l'évaluation des vulnérabilités sans agent" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Gated deployment in Defender for Containers evaluates the vulnerability findings of an image when it is deployed to the cluster. Its rules can audit or block deployments of images that break the organization's vulnerability policy, which supports a report-first, then enforce rollout.
    fr: |-
      Le déploiement contrôlé de Defender for Containers évalue les résultats de vulnérabilité d'une image au moment de son déploiement sur le cluster. Ses règles peuvent auditer ou bloquer les déploiements des images qui enfreignent la stratégie de vulnérabilité de l'organisation, ce qui permet de signaler d'abord, puis d'imposer.
  options:
    b:
      en: |-
        Binary drift blocking stops processes that weren't in the original image from running in a container; it doesn't evaluate image vulnerabilities at deployment.
      fr: |-
        Le blocage de la dérive des binaires empêche l'exécution dans un conteneur de processus absents de l'image d'origine ; il n'évalue pas les vulnérabilités des images au déploiement.
    c:
      en: |-
        Automatic rebuilds reduce vulnerabilities in new images, but nothing stops a vulnerable image from being deployed.
      fr: |-
        Les reconstructions automatiques réduisent les vulnérabilités des nouvelles images, mais rien n'empêche le déploiement d'une image vulnérable.
    d:
      en: |-
        Rescans report vulnerabilities in containers that are already running; reporting doesn't stop a deployment.
      fr: |-
        Les nouvelles analyses signalent les vulnérabilités des conteneurs déjà en cours d'exécution ; signaler n'empêche pas un déploiement.
references:
  - title: Gated deployment for Kubernetes container images
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/runtime-gated-overview
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
