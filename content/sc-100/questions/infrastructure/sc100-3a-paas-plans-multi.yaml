id: sc100-3a-paas-plans-multi
objective: "3.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation hosts a customer portal as a web app in Azure App Service. The web app stores its data in Azure SQL Database. The web app isn't published through Azure API Management.

    You need to recommend Microsoft Defender for Cloud plans that detect attacks that target the web app and attacks such as SQL injection that target the database.

    Which two plans should you recommend?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation héberge un portail client sous forme d'application web dans Azure App Service. L'application web stocke ses données dans Azure SQL Database. L'application web n'est pas publiée via Azure API Management.

    Vous devez recommander des plans de Microsoft Defender for Cloud qui détectent les attaques visant l'application web et les attaques comme l'injection SQL visant la base de données.

    Quels sont les deux plans à recommander ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Defender for App Service }
    - { id: b, text: Defender for Servers Plan 1 }
    - { id: c, text: Defender for APIs }
    - { id: d, text: Defender for Databases }
    - { id: e, text: Defender for Storage }
answer:
  optionIds: [a, d]
explanation:
  correct:
    en: Defender for App Service identifies attacks that target web apps and APIs running on App Service. Defender for Databases covers Azure SQL databases, SQL servers on machines, open-source relational databases and Azure Cosmos DB, and detects attacks such as SQL injection.
    fr: Defender for App Service identifie les attaques visant les applications web et les API exécutées sur App Service. Defender for Databases couvre les bases de données Azure SQL, les serveurs SQL sur des machines, les bases de données relationnelles open source et Azure Cosmos DB, et détecte des attaques comme l'injection SQL.
  options:
    b:
      en: Defender for Servers protects VMs and servers; App Service and Azure SQL Database are PaaS services that it doesn't cover.
      fr: Defender for Servers protège les machines virtuelles et les serveurs ; App Service et Azure SQL Database sont des services PaaS qu'il ne couvre pas.
    c:
      en: Defender for APIs protects APIs published in API Management, which isn't used here.
      fr: Defender for APIs protège les API publiées dans API Management, qui n'est pas utilisé ici.
    e:
      en: Defender for Storage protects storage accounts, which the solution doesn't use for its data.
      fr: Defender for Storage protège les comptes de stockage, que la solution n'utilise pas pour ses données.
references:
  - title: Microsoft Defender for Cloud Overview
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
