id: sc100-3b-ot-site-plan
objective: "3.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware Manufacturing is preparing a Microsoft Defender for IoT deployment for two factories. The factories were built from the same template: both use the 10.10.0.0/16 address range for their OT devices. In factory A, one production segment is connected to an unmanaged switch that has no SPAN port. The OT devices must not receive any traffic generated by the monitoring solution.

    You need to complete the site plan.

    What should you include in the plan? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware Manufacturing prépare un déploiement de Microsoft Defender for IoT pour deux usines. Les usines ont été construites sur le même modèle : toutes deux utilisent la plage d'adresses 10.10.0.0/16 pour leurs appareils OT. Dans l'usine A, un segment de production est relié à un commutateur non administrable qui n'a pas de port SPAN. Les appareils OT ne doivent recevoir aucun trafic généré par la solution de surveillance.

    Vous devez compléter le plan de site.

    Que devez-vous inclure dans le plan ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Traffic source for the segment behind the unmanaged switch: [[mirror]]

      Sensors of factory A and factory B: [[zone]]

      Device count used to size the license: [[count]]
    fr: |
      Source du trafic pour le segment derrière le commutateur non administrable : [[mirror]]

      Capteurs de l'usine A et de l'usine B : [[zone]]

      Nombre d'appareils utilisé pour dimensionner la licence : [[count]]
  slots:
    - id: mirror
      options:
        - { id: tap, text: { en: "A network TAP on the segment uplink", fr: "Un TAP réseau sur la liaison montante du segment" } }
        - { id: scan, text: { en: "Scheduled active scans of the segment", fr: "Des analyses actives planifiées du segment" } }
        - { id: agent, text: { en: "An agent installed on each PLC of the segment", fr: "Un agent installé sur chaque PLC du segment" } }
    - id: zone
      options:
        - { id: same, text: { en: "Assigned to the same site and zone", fr: "Affectés au même site et à la même zone" } }
        - { id: diff, text: { en: "Assigned to different zones", fr: "Affectés à des zones différentes" } }
        - { id: one, text: { en: "Replaced by one sensor that monitors both factories", fr: "Remplacés par un seul capteur qui surveille les deux usines" } }
    - id: count
      options:
        - { id: all, text: { en: "Every IP address seen on the OT networks", fr: "Chaque adresse IP observée sur les réseaux OT" } }
        - { id: filtered, text: { en: "Devices, excluding public internet IPs, multicast and broadcast groups, and devices inactive for more than 60 days", fr: "Les appareils, hors adresses IP Internet publiques, groupes de multidiffusion et de diffusion, et appareils inactifs depuis plus de 60 jours" } }
        - { id: switches, text: { en: "Switches that have a SPAN port, multiplied by the number of sensors", fr: "Les commutateurs dotés d'un port SPAN, multipliés par le nombre de capteurs" } }
answer:
  values: { mirror: tap, zone: diff, count: filtered }
explanation:
  correct:
    en: |
      A network TAP copies the traffic of a link without a SPAN port and without injecting any traffic toward the devices. Sensors that see recurring IP ranges must be placed in different zones so that devices with the same addresses in the two factories aren't incorrectly consolidated. The license is sized on the device count after removing public internet IPs, multicast and broadcast groups, and devices inactive for more than 60 days.
    fr: |
      Un TAP réseau copie le trafic d'une liaison sans port SPAN et sans injecter de trafic vers les appareils. Les capteurs qui voient des plages d'adresses IP récurrentes doivent être placés dans des zones différentes, afin que les appareils de même adresse des deux usines ne soient pas consolidés à tort. La licence est dimensionnée sur le nombre d'appareils après exclusion des adresses IP Internet publiques, des groupes de multidiffusion et de diffusion, et des appareils inactifs depuis plus de 60 jours.
  options:
    scan:
      en: |
        Active scans send traffic to the OT devices, which the requirement forbids.
      fr: |
        Des analyses actives envoient du trafic aux appareils OT, ce que l'exigence interdit.
    agent:
      en: |
        Defender for IoT OT monitoring is agentless and network based; PLCs can't host an agent.
      fr: |
        La surveillance OT de Defender for IoT est sans agent et basée sur le réseau ; les PLC ne peuvent pas héberger d'agent.
    same:
      en: |
        With the same zone, devices of both factories that share an IP address would be merged into one device in the inventory.
      fr: |
        Avec la même zone, les appareils des deux usines qui partagent une adresse IP seraient fusionnés en un seul appareil dans l'inventaire.
references:
  - title: Prepare an OT site deployment
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/best-practices/plan-prepare-deploy
