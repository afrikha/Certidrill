id: sc100-3b-ot-sensor-count
objective: "3.2.4"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Proseware Foods has a production site with three OT networks: packaging, cooking and refrigeration. The three networks have no physical connectivity with each other. In each network, two Ethernet-connected switches are installed in the same control room, less than 20 meters apart, and each switch supports SPAN ports.

    You are planning the Microsoft Defender for IoT sensor deployment for the site. The design must follow Microsoft's sensor placement guidance and minimize the number of sensors.

    What is the minimum number of OT sensors that you should plan?
  fr: |
    Proseware Foods dispose d'un site de production avec trois réseaux OT : conditionnement, cuisson et réfrigération. Les trois réseaux n'ont aucune connectivité physique entre eux. Dans chaque réseau, deux commutateurs reliés par Ethernet sont installés dans la même salle de contrôle, à moins de 20 mètres l'un de l'autre, et chaque commutateur prend en charge les ports SPAN.

    Vous planifiez le déploiement des capteurs Microsoft Defender for IoT pour le site. La conception doit suivre les recommandations de Microsoft pour le placement des capteurs et réduire au minimum le nombre de capteurs.

    Quel est le nombre minimal de capteurs OT que vous devez prévoir ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "6" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft recommends at least one sensor for each network that has no physical connectivity to the others, so the three isolated networks need three sensors. Inside each network the two switches are much closer than 80 meters, the distance beyond which another sensor is recommended, so one sensor per network is enough.
    fr: |
      Microsoft recommande au moins un capteur pour chaque réseau qui n'a aucune connectivité physique avec les autres ; les trois réseaux isolés nécessitent donc trois capteurs. Dans chaque réseau, les deux commutateurs sont bien plus proches que 80 mètres, la distance au-delà de laquelle un capteur supplémentaire est recommandé ; un capteur par réseau suffit donc.
  options:
    a:
      en: |
        A single sensor can't see the traffic of networks that have no physical connectivity with it.
      fr: |
        Un seul capteur ne peut pas voir le trafic de réseaux qui n'ont aucune connectivité physique avec lui.
    b:
      en: |
        Two sensors would leave one of the three isolated networks unmonitored.
      fr: |
        Deux capteurs laisseraient l'un des trois réseaux isolés sans surveillance.
    d:
      en: |
        One sensor per switch isn't required when the switches of a network are close together; six sensors don't minimize the count.
      fr: |
        Un capteur par commutateur n'est pas nécessaire quand les commutateurs d'un réseau sont proches ; six capteurs ne réduisent pas le nombre au minimum.
references:
  - title: Prepare an OT site deployment
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/best-practices/plan-prepare-deploy
