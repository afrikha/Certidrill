id: sc100-3b-iot-device-identity
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Robotics manufactures embedded controllers that connect to an Azure IoT solution. Today, every controller of a product line uses the same symmetric key, which is written into the firmware image at the factory.

    A security review requires a new design for the next product line:

    - Each controller must have its own identity.
    - Copying the firmware image from one controller to another must not allow the copy to impersonate the original controller.
    - Many controllers must be trusted without registering a credential for each one in the cloud.

    What should you recommend?
  fr: |
    Fabrikam Robotics fabrique des contrôleurs embarqués qui se connectent à une solution Azure IoT. Aujourd'hui, tous les contrôleurs d'une gamme utilisent la même clé symétrique, écrite dans l'image du microprogramme en usine.

    Une revue de sécurité exige une nouvelle conception pour la gamme suivante :

    - Chaque contrôleur doit avoir sa propre identité.
    - La copie de l'image du microprogramme d'un contrôleur vers un autre ne doit pas permettre à la copie d'usurper l'identité du contrôleur d'origine.
    - De nombreux contrôleurs doivent être approuvés sans inscrire d'informations d'identification pour chacun dans le cloud.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A unique symmetric key per controller, stored in the firmware image and registered in the cloud", fr: "Une clé symétrique unique par contrôleur, stockée dans l'image du microprogramme et inscrite dans le cloud" } }
    - { id: b, text: { en: "A self-signed X.509 certificate per controller, with each thumbprint registered in the cloud", fr: "Un certificat X.509 auto-signé par contrôleur, avec chaque empreinte inscrite dans le cloud" } }
    - { id: c, text: { en: "The shared symmetric key of the product line, stored in a TPM and rotated every 30 days", fr: "La clé symétrique partagée de la gamme, stockée dans un TPM et renouvelée tous les 30 jours" } }
    - { id: d, text: { en: "A CA-signed X.509 certificate per controller, with its private key generated and kept in a hardware security module", fr: "Un certificat X.509 signé par une autorité de certification par contrôleur, avec sa clé privée générée et conservée dans un module de sécurité matériel" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A device certificate signed by a CA chain gives each controller its own identity, and registering the CA certificate once lets the cloud trust any number of devices whose certificates chain to it. Generating and storing the private key in a hardware security module keeps it out of the firmware image, so copying the image doesn't copy the identity.
    fr: |
      Un certificat d'appareil signé par une chaîne d'autorités de certification donne à chaque contrôleur sa propre identité, et l'inscription unique du certificat d'autorité permet au cloud d'approuver un nombre quelconque d'appareils dont les certificats s'y rattachent. Générer et stocker la clé privée dans un module de sécurité matériel la garde hors de l'image du microprogramme : copier l'image ne copie pas l'identité.
  options:
    a:
      en: |
        A key stored in the firmware image is copied with the image, and each key must be registered individually.
      fr: |
        Une clé stockée dans l'image du microprogramme est copiée avec l'image, et chaque clé doit être inscrite individuellement.
    b:
      en: |
        Self-signed certificates require registering every thumbprint, and they are meant for testing rather than production fleets.
      fr: |
        Les certificats auto-signés nécessitent l'inscription de chaque empreinte, et ils sont destinés aux tests plutôt qu'aux parcs en production.
    c:
      en: |
        A shared key never gives each controller its own identity, however often it is rotated.
      fr: |
        Une clé partagée ne donne jamais à chaque contrôleur sa propre identité, quelle que soit la fréquence de son renouvellement.
references:
  - title: Authenticate with X.509 certificates
    url: https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-x509
