id: sc100-3a-easm-shadow-it
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The marketing teams of Contoso, Ltd. register domains and launch campaign websites with several hosting providers without informing IT. The CISO wants to discover the internet-facing domains, hosts and IP addresses that belong to Contoso but are unknown to IT, and to identify the vulnerabilities and exposed services on them.

    What should you recommend?
  fr: |
    Les équipes marketing de Contoso, Ltd. enregistrent des domaines et lancent des sites web de campagne chez plusieurs hébergeurs sans en informer l'informatique. Le RSSI veut découvrir les domaines, les hôtes et les adresses IP exposés à Internet qui appartiennent à Contoso mais que l'informatique ne connaît pas, et identifier les vulnérabilités et les services exposés qu'ils présentent.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Cloud Discovery in Microsoft Defender for Cloud Apps", fr: "Cloud Discovery dans Microsoft Defender for Cloud Apps" }
    - id: b
      text: { en: "Device discovery in Microsoft Defender for Endpoint", fr: "La découverte d'appareils dans Microsoft Defender for Endpoint" }
    - id: c
      text: { en: "Microsoft Defender External Attack Surface Management", fr: "Microsoft Defender External Attack Surface Management" }
    - id: d
      text: { en: "Network sensors of Microsoft Defender for IoT", fr: "Les capteurs réseau de Microsoft Defender for IoT" }
answer:
  optionId: c
explanation:
  correct:
    en: Defender EASM gives an outside-in view of the organization. Starting from discovery seeds that Contoso knows, it recursively finds connected infrastructure such as domains, hosts, IP blocks and ASNs, builds an inventory, and reports vulnerabilities, compliance and hygiene issues on the discovered assets.
    fr: Defender EASM donne une vue de l'organisation depuis l'extérieur. À partir de graines de découverte connues de Contoso, il trouve de façon récursive l'infrastructure liée, comme les domaines, les hôtes, les blocs IP et les ASN, construit un inventaire et signale les vulnérabilités ainsi que les problèmes de conformité et d'hygiène des ressources découvertes.
  options:
    a:
      en: Cloud Discovery identifies the cloud apps that users access from the network; it doesn't discover the websites and domains that the organization exposes on the internet.
      fr: Cloud Discovery identifie les applications cloud auxquelles les utilisateurs accèdent depuis le réseau ; il ne découvre pas les sites web et les domaines que l'organisation expose sur Internet.
    b:
      en: Device discovery finds unmanaged devices on the corporate network, not internet-facing assets hosted by external providers.
      fr: La découverte d'appareils trouve les appareils non gérés du réseau de l'entreprise, pas les ressources exposées à Internet hébergées par des fournisseurs externes.
    d:
      en: Defender for IoT discovers OT and IoT devices inside the network by analyzing traffic, not external web infrastructure.
      fr: Defender for IoT découvre les appareils OT et IoT à l'intérieur du réseau en analysant le trafic, pas l'infrastructure web externe.
references:
  - title: Defender EASM Overview
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview
