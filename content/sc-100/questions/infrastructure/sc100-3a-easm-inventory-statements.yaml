id: sc100-3a-easm-inventory-statements
objective: "3.1.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has used Microsoft Defender External Attack Surface Management (Defender EASM) for one month. The security operations manager prepares the procedure for reviewing the inventory.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Defender External Attack Surface Management (Defender EASM) depuis un mois. Le responsable des opérations de sécurité prépare la procédure de revue de l'inventaire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An asset in the Candidate state must be reviewed manually to determine whether Tailspin Toys owns it.
        fr: Une ressource à l'état Candidate doit être examinée manuellement pour déterminer si Tailspin Toys en est propriétaire.
    - id: s2
      text:
        en: Assets in the Approved Inventory state are scanned every day.
        fr: Les ressources à l'état Approved Inventory sont analysées chaque jour.
    - id: s3
      text:
        en: Assets in the Dependency state are included in the dashboard charts by default.
        fr: Les ressources à l'état Dependency sont incluses par défaut dans les graphiques des tableaux de bord.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Candidate assets have a relationship to the known seeds that isn't strong enough to label them Approved Inventory, so you must review them to determine ownership. Approved Inventory assets are scanned daily and always appear in the dashboard charts, while all the other states are excluded from the charts by default and only appear if you change the inventory filters.
    fr: Les ressources Candidate ont avec les graines connues une relation qui n'est pas assez forte pour les étiqueter Approved Inventory ; vous devez donc les examiner pour déterminer la propriété. Les ressources Approved Inventory sont analysées chaque jour et apparaissent toujours dans les graphiques des tableaux de bord, tandis que tous les autres états sont exclus des graphiques par défaut et n'apparaissent que si vous modifiez les filtres de l'inventaire.
  options:
    s3:
      en: Only Approved Inventory assets are shown in the dashboard charts by default.
      fr: Seules les ressources Approved Inventory sont affichées par défaut dans les graphiques des tableaux de bord.
references:
  - title: Understand Inventory Assets
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/understanding-inventory-assets
