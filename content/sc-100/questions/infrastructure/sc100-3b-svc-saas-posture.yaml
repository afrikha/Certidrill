id: sc100-3b-svc-saas-posture
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware Insurance uses Microsoft 365, Salesforce and ServiceNow, and runs its own workloads in Azure and AWS. Microsoft Defender for Cloud with Defender CSPM covers the Azure and AWS resources. Litware has Microsoft Defender for Cloud Apps licenses.

    The CISO requires a security baseline for the SaaS applications: the security team must get recommendations about misconfigured security settings in the Salesforce and ServiceNow tenants and track the remediation in Microsoft Secure Score. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Litware Insurance utilise Microsoft 365, Salesforce et ServiceNow, et exécute ses propres charges de travail dans Azure et AWS. Microsoft Defender for Cloud avec Defender CSPM couvre les ressources Azure et AWS. Litware dispose de licences Microsoft Defender for Cloud Apps.

    Le RSSI exige une base de référence de sécurité pour les applications SaaS : l'équipe de sécurité doit obtenir des recommandations sur les paramètres de sécurité mal configurés des locataires Salesforce et ServiceNow, et suivre leur correction dans Microsoft Secure Score. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Connect Salesforce and ServiceNow to Defender for Cloud Apps with app connectors, and turn on security recommendations", fr: "Connecter Salesforce et ServiceNow à Defender for Cloud Apps avec des connecteurs d'applications, et activer les recommandations de sécurité" } }
    - { id: b, text: { en: "Add Salesforce and ServiceNow to Defender for Cloud as multicloud environments, and assign the Microsoft cloud security benchmark", fr: "Ajouter Salesforce et ServiceNow à Defender for Cloud comme environnements multicloud, et attribuer le benchmark de sécurité cloud Microsoft" } }
    - { id: c, text: { en: "Assign Azure Policy initiatives that audit the Salesforce and ServiceNow configuration", fr: "Attribuer des initiatives Azure Policy qui auditent la configuration de Salesforce et ServiceNow" } }
    - { id: d, text: { en: "Configure Conditional Access app control session policies for Salesforce and ServiceNow", fr: "Configurer des stratégies de session du contrôle d'application par accès conditionnel pour Salesforce et ServiceNow" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SaaS security posture management (SSPM) in Defender for Cloud Apps requires the app to be connected with an app connector and security recommendations turned on for each instance. The recommendations, based on Microsoft benchmarks, then appear in Microsoft Secure Score and in Microsoft Security Exposure Management.
    fr: |
      La gestion de la posture de sécurité SaaS (SSPM) de Defender for Cloud Apps exige que l'application soit connectée par un connecteur d'applications et que les recommandations de sécurité soient activées pour chaque instance. Les recommandations, fondées sur les benchmarks Microsoft, apparaissent ensuite dans Microsoft Secure Score et dans Microsoft Security Exposure Management.
  options:
    b:
      en: |
        Defender for Cloud assesses cloud infrastructure such as Azure, AWS and GCP; it doesn't connect to SaaS tenants such as Salesforce or ServiceNow.
      fr: |
        Defender for Cloud évalue l'infrastructure cloud comme Azure, AWS et GCP ; il ne se connecte pas à des locataires SaaS comme Salesforce ou ServiceNow.
    c:
      en: |
        Azure Policy evaluates Azure resources; it can't read the settings of a SaaS tenant.
      fr: |
        Azure Policy évalue des ressources Azure ; il ne peut pas lire les paramètres d'un locataire SaaS.
    d:
      en: |
        Session policies control user sessions in real time; they don't assess the security configuration of the SaaS tenant.
      fr: |
        Les stratégies de session contrôlent les sessions des utilisateurs en temps réel ; elles n'évaluent pas la configuration de sécurité du locataire SaaS.
references:
  - title: SaaS security posture management (SSPM) overview
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/security-saas
