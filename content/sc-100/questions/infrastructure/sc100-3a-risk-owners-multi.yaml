id: sc100-3a-risk-owners-multi
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Cloud with Foundational CSPM on 30 Azure subscriptions and 12 AWS accounts. The remediation backlog contains more than 4,000 recommendations. The security architecture must meet the following requirements:

    - A recommendation on an internet-exposed VM that can reach a database holding customer data must be handled before the same recommendation on an isolated test VM.
    - Every recommendation must be assigned to the owner of the resource with a due date, and overdue items must be tracked.
    - No recommendation may be hidden from the posture views.

    Which two actions should you include in the recommendation?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Defender for Cloud avec Foundational CSPM sur 30 abonnements Azure et 12 comptes AWS. Le backlog de correction contient plus de 4 000 recommandations. L'architecture de sécurité doit répondre aux exigences suivantes :

    - Une recommandation portant sur une machine virtuelle exposée à Internet qui peut atteindre une base de données contenant des données client doit être traitée avant la même recommandation sur une machine virtuelle de test isolée.
    - Chaque recommandation doit être attribuée au propriétaire de la ressource avec une date d'échéance, et les éléments en retard doivent être suivis.
    - Aucune recommandation ne doit être masquée dans les vues de posture.

    Quelles sont les deux actions à inclure dans la recommandation ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Enable Defender CSPM and use risk prioritization with the customer databases marked as critical assets", fr: "Activer Defender CSPM et utiliser la hiérarchisation des risques avec les bases de données client marquées comme ressources critiques" }
    - id: b
      text: { en: "Create exemptions for the recommendations that apply to the test VMs", fr: "Créer des exemptions pour les recommandations qui s'appliquent aux machines virtuelles de test" }
    - id: c
      text: { en: "Create governance rules that assign each recommendation to the resource owner with a due date", fr: "Créer des règles de gouvernance qui attribuent chaque recommandation au propriétaire de la ressource avec une date d'échéance" }
    - id: d
      text: { en: "Configure continuous export of the recommendations to a Log Analytics workspace", fr: "Configurer l'exportation continue des recommandations vers un espace de travail Log Analytics" }
    - id: e
      text: { en: "Create a workflow automation that emails the subscription owner when a recommendation becomes unhealthy", fr: "Créer une automatisation de workflow qui envoie un e-mail au propriétaire de l'abonnement quand une recommandation devient non saine" }
answer:
  optionIds: [a, c]
explanation:
  correct:
    en: Risk prioritization and critical assets protection are Defender CSPM capabilities that rank recommendations by risk factors such as internet exposure, data sensitivity and asset criticality. Governance rules, also part of Defender CSPM, assign an owner and a due date to recommendations and track overdue items, which drives remediation at scale.
    fr: La hiérarchisation des risques et la protection des ressources critiques sont des fonctionnalités de Defender CSPM qui classent les recommandations selon des facteurs de risque comme l'exposition à Internet, la sensibilité des données et la criticité des ressources. Les règles de gouvernance, qui font aussi partie de Defender CSPM, attribuent un propriétaire et une date d'échéance aux recommandations et suivent les éléments en retard, ce qui pilote la correction à grande échelle.
  options:
    b:
      en: Exemptions remove the recommendations from the posture views, which the requirements forbid, and they don't rank the remaining items by risk.
      fr: Les exemptions retirent les recommandations des vues de posture, ce que les exigences interdisent, et elles ne classent pas les éléments restants selon le risque.
    d:
      en: Continuous export copies the data to another store; it neither ranks the recommendations by risk nor assigns owners and due dates.
      fr: L'exportation continue copie les données vers un autre magasin ; elle ne classe pas les recommandations selon le risque et n'attribue ni propriétaires ni dates d'échéance.
    e:
      en: An email notification doesn't assign a due date or track overdue items, and the subscription owner isn't necessarily the resource owner.
      fr: Une notification par e-mail n'attribue pas de date d'échéance et ne suit pas les éléments en retard, et le propriétaire de l'abonnement n'est pas forcément celui de la ressource.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
