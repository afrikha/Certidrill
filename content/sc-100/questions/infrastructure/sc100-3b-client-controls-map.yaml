id: sc100-3b-client-controls-map
objective: "3.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware is writing the security requirements for its clients and mobile devices. The company uses Microsoft Intune and Microsoft Defender for Endpoint.

    Which solution should you specify for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware rédige les exigences de sécurité de ses clients et appareils mobiles. L'entreprise utilise Microsoft Intune et Microsoft Defender for Endpoint.

    Quelle solution devez-vous spécifier pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: app, text: { en: "Intune app protection policy", fr: "Stratégie de protection des applications Intune" } }
    - { id: comp, text: { en: "Intune compliance policy", fr: "Stratégie de conformité Intune" } }
    - { id: base, text: { en: "Intune security baseline", fr: "Base de référence de sécurité Intune" } }
    - { id: mde, text: { en: "Microsoft Defender for Endpoint", fr: "Microsoft Defender for Endpoint" } }
    - { id: wdac, text: { en: "App Control for Business", fr: "App Control for Business" } }
    - { id: cg, text: { en: "Credential Guard", fr: "Credential Guard" } }
  targets:
    - { id: t1, text: { en: "Personal Android phones that won't be enrolled: prevent users from saving corporate files to personal storage", fr: "Téléphones Android personnels qui ne seront pas inscrits : empêcher les utilisateurs d'enregistrer des fichiers de l'entreprise dans un stockage personnel" } }
    - { id: t2, text: { en: "Enrolled Windows 11 laptops: apply Microsoft's recommended set of Windows security settings as the starting configuration", fr: "Ordinateurs portables Windows 11 inscrits : appliquer l'ensemble de paramètres de sécurité Windows recommandé par Microsoft comme configuration de départ" } }
    - { id: t3, text: { en: "Windows, macOS and Linux workstations: endpoint detection and response", fr: "Postes de travail Windows, macOS et Linux : détection et réponse sur les points de terminaison" } }
    - { id: t4, text: { en: "Shared kiosk devices: allow only approved executables to run", fr: "Appareils kiosques partagés : n'autoriser que l'exécution des exécutables approuvés" } }
answer:
  mapping: { t1: app, t2: base, t3: mde, t4: wdac }
explanation:
  correct:
    en: |
      App protection policies protect corporate data inside apps without device enrollment, so they fit personal phones. An Intune security baseline is a preconfigured group of Windows settings recommended by Microsoft. Defender for Endpoint provides EDR on Windows, macOS and Linux. App Control for Business restricts the applications and drivers allowed to run. A compliance policy evaluates enrolled devices but doesn't configure them, and Credential Guard protects credentials in memory.
    fr: |
      Les stratégies de protection des applications protègent les données de l'entreprise dans les applications sans inscription de l'appareil : elles conviennent aux téléphones personnels. Une base de référence de sécurité Intune est un groupe préconfiguré de paramètres Windows recommandés par Microsoft. Defender for Endpoint fournit l'EDR sous Windows, macOS et Linux. App Control for Business restreint les applications et les pilotes autorisés à s'exécuter. Une stratégie de conformité évalue les appareils inscrits sans les configurer, et Credential Guard protège les informations d'identification en mémoire.
references:
  - title: Use security baselines to help secure Windows devices you manage with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/security-baselines
  - title: App protection policies overview
    url: https://learn.microsoft.com/en-us/intune/intune-service/apps/app-protection-policy
