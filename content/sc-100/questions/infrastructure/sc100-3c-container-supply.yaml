id: sc100-3c-container-supply
objective: "3.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is moving its order services to Azure Container Apps. The Container Apps environment is integrated with a virtual network named VNet1, and the images will be stored in a new Azure Container Registry registry.

    The design must meet the following requirements:

    - The registry must not be reachable from the internet.
    - The container apps must pull their images without a username, password or token stored in their configuration.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys migre ses services de commande vers Azure Container Apps. L'environnement Container Apps est intégré à un réseau virtuel nommé VNet1, et les images seront stockées dans un nouveau registre Azure Container Registry.

    La conception doit respecter les exigences suivantes :

    - Le registre ne doit pas être joignable depuis Internet.
    - Les applications conteneur doivent extraire leurs images sans nom d'utilisateur, mot de passe ni jeton stocké dans leur configuration.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Use a Premium registry with a private endpoint in VNet1 and public network access disabled", fr: "Utiliser un registre Premium avec un point de terminaison privé dans VNet1 et l'accès au réseau public désactivé" } }
    - { id: b, text: { en: "Use a Standard registry with an IP network rule that allows only the outbound IP of the environment", fr: "Utiliser un registre Standard avec une règle de réseau IP qui n'autorise que l'adresse IP sortante de l'environnement" } }
    - { id: c, text: { en: "Assign a managed identity to each container app and grant it the AcrPull role on the registry", fr: "Attribuer une identité managée à chaque application conteneur et lui accorder le rôle AcrPull sur le registre" } }
    - { id: d, text: { en: "Enable the registry admin user and reference its password as a Container Apps secret", fr: "Activer l'utilisateur administrateur du registre et référencer son mot de passe comme secret Container Apps" } }
    - { id: e, text: { en: "Enable anonymous pull access so that the container apps don't need credentials", fr: "Activer l'accès anonyme en extraction pour que les applications conteneur n'aient pas besoin d'identifiants" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Private endpoints and disabling public network access are Premium registry features: the registry then gets a private IP address in VNet1 and refuses internet traffic. A managed identity with the AcrPull role lets Azure Container Apps pull images with Microsoft Entra authentication, so no credential is kept in the app configuration.
    fr: |-
      Les points de terminaison privés et la désactivation de l'accès au réseau public sont des fonctionnalités des registres Premium : le registre obtient alors une adresse IP privée dans VNet1 et refuse le trafic Internet. Une identité managée avec le rôle AcrPull permet à Azure Container Apps d'extraire les images avec l'authentification Microsoft Entra : aucun identifiant n'est conservé dans la configuration de l'application.
  options:
    b:
      en: |-
        Network rules require the Premium tier, and an IP rule keeps the public endpoint reachable from the internet.
      fr: |-
        Les règles de réseau exigent le niveau Premium, et une règle IP laisse le point de terminaison public joignable depuis Internet.
    d:
      en: |-
        The admin user password is a shared credential stored in the app configuration, which the requirement forbids.
      fr: |-
        Le mot de passe de l'utilisateur administrateur est un identifiant partagé stocké dans la configuration de l'application, ce que l'exigence interdit.
    e:
      en: |-
        Anonymous pull lets anyone who can reach the registry pull the images; it removes authentication instead of replacing it.
      fr: |-
        L'extraction anonyme permet à quiconque atteint le registre d'extraire les images ; elle supprime l'authentification au lieu de la remplacer.
references:
  - title: Azure Container Apps image pull from Azure Container Registry with managed identity
    url: https://learn.microsoft.com/en-us/azure/container-apps/managed-identity-image-pull
  - title: Azure Container Registry SKU features and limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
