id: sc100-3c-swg-rollout
objective: "3.4.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Litware is piloting Microsoft Entra Internet Access with a group named GSA-Pilot. The Internet access traffic forwarding profile is enabled, and the Global Secure Access client is installed on the pilot devices.

    You need to recommend how to block the gambling web category for the members of GSA-Pilot only.

    Which three actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware pilote Accès Internet Microsoft Entra avec un groupe nommé GSA-Pilot. Le profil de transfert du trafic d'accès Internet est activé, et le client Global Secure Access est installé sur les appareils pilotes.

    Vous devez recommander comment bloquer la catégorie web des jeux d'argent pour les seuls membres de GSA-Pilot.

    Quelles sont les trois actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: filter, text: { en: "Create a web content filtering policy with a rule that blocks the gambling category.", fr: "Créer une stratégie de filtrage du contenu web avec une règle qui bloque la catégorie des jeux d'argent." } }
    - { id: profile, text: { en: "Create a security profile and link the filtering policy to it.", fr: "Créer un profil de sécurité et y lier la stratégie de filtrage." } }
    - { id: ca, text: { en: "Create a Conditional Access policy for GSA-Pilot that targets All internet resources with Global Secure Access and uses the security profile as a session control.", fr: "Créer une stratégie d'accès conditionnel pour GSA-Pilot qui cible All internet resources with Global Secure Access et utilise le profil de sécurité comme contrôle de session." } }
    - { id: baseline, text: { en: "Link the filtering policy to the baseline profile.", fr: "Lier la stratégie de filtrage au profil de base." } }
    - { id: utr, text: { en: "Turn on universal tenant restrictions.", fr: "Activer les restrictions de locataire universelles." } }
    - { id: named, text: { en: "Mark the All Compliant Network locations named location as trusted.", fr: "Marquer l'emplacement nommé All Compliant Network locations comme approuvé." } }
answer:
  sequence: [ filter, profile, ca ]
explanation:
  correct:
    en: |-
      Rules live in filtering policies, filtering policies are grouped in a security profile, and the profile reaches users through a Conditional Access policy that targets All internet resources with Global Secure Access with the Use Global Secure Access security profile session control. Scoping that policy to GSA-Pilot limits the block to the pilot users.
    fr: |-
      Les règles se trouvent dans des stratégies de filtrage, les stratégies de filtrage sont regroupées dans un profil de sécurité, et le profil atteint les utilisateurs par une stratégie d'accès conditionnel qui cible All internet resources with Global Secure Access avec le contrôle de session Use Global Secure Access security profile. Limiter cette stratégie à GSA-Pilot restreint le blocage aux utilisateurs pilotes.
  options:
    baseline:
      en: |-
        The baseline profile applies to all Internet Access traffic, not only to the pilot group.
      fr: |-
        Le profil de base s'applique à tout le trafic d'accès Internet, pas seulement au groupe pilote.
    utr:
      en: |-
        Universal tenant restrictions control sign-ins to other Microsoft Entra tenants, not web categories.
      fr: |-
        Les restrictions de locataire universelles contrôlent les connexions à d'autres locataires Microsoft Entra, pas les catégories web.
    named:
      en: |-
        The compliant network location is used by the compliant network check; it isn't needed for web content filtering.
      fr: |-
        L'emplacement de réseau conforme sert à la vérification du réseau conforme ; il n'est pas nécessaire au filtrage du contenu web.
references:
  - title: How to configure Global Secure Access web content filtering
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-web-content-filtering
