id: sc100-3b-baseline-intune-profiles
objective: "3.2.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum Consulting manages its Windows 11 laptops and its Windows 365 Cloud PCs with Microsoft Intune. Users work with Microsoft Edge and Microsoft 365 Apps. You need to specify which Intune security baseline covers each requirement.

    What should you specify? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Consulting gère ses ordinateurs portables Windows 11 et ses PC cloud Windows 365 avec Microsoft Intune. Les utilisateurs travaillent avec Microsoft Edge et Microsoft 365 Apps. Vous devez spécifier quelle base de référence de sécurité Intune couvre chaque exigence.

    Que devez-vous spécifier ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Recommended browser security settings: [[edge]]

      Recommended security settings for Word, Excel and Outlook: [[office]]

      Recommended security settings for the Cloud PCs: [[cloudpc]]
    fr: |
      Paramètres de sécurité recommandés du navigateur : [[edge]]

      Paramètres de sécurité recommandés pour Word, Excel et Outlook : [[office]]

      Paramètres de sécurité recommandés pour les PC cloud : [[cloudpc]]
  slots:
    - id: edge
      options:
        - { id: edge, text: "Microsoft Edge Baseline" }
        - { id: win, text: "Security Baseline for Windows 10 and later" }
        - { id: mde, text: "Microsoft Defender for Endpoint baseline" }
    - id: office
      options:
        - { id: m365, text: "Microsoft 365 Apps for Enterprise" }
        - { id: edge, text: "Microsoft Edge Baseline" }
        - { id: w365, text: "Windows 365 Security Baseline" }
    - id: cloudpc
      options:
        - { id: w365, text: "Windows 365 Security Baseline" }
        - { id: mde, text: "Microsoft Defender for Endpoint baseline" }
        - { id: m365, text: "Microsoft 365 Apps for Enterprise" }
answer:
  values: { edge: edge, office: m365, cloudpc: w365 }
explanation:
  correct:
    en: |
      Intune provides separate baselines per product: the Microsoft Edge Baseline for the browser, the Microsoft 365 Apps for Enterprise baseline for Office applications, and the Windows 365 Security Baseline for Cloud PCs. The Defender for Endpoint baseline is optimized for physical devices and isn't currently recommended for VMs or VDI endpoints such as Cloud PCs.
    fr: |
      Intune fournit des bases de référence distinctes par produit : Microsoft Edge Baseline pour le navigateur, Microsoft 365 Apps for Enterprise pour les applications Office, et Windows 365 Security Baseline pour les PC cloud. La base de référence Defender for Endpoint est optimisée pour les appareils physiques et n'est pas recommandée actuellement pour les machines virtuelles ni les points de terminaison VDI comme les PC cloud.
references:
  - title: Use security baselines to help secure Windows devices you manage with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/security-baselines
