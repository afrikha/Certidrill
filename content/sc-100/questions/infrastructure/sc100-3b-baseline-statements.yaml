id: sc100-3b-baseline-statements
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Insurance is moving its Windows client management from Group Policy to Microsoft Intune. The security team asks you to evaluate Intune security baselines before you specify them as the client baseline.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Insurance transfère la gestion de ses clients Windows de la stratégie de groupe vers Microsoft Intune. L'équipe de sécurité vous demande d'évaluer les bases de référence de sécurité Intune avant de les spécifier comme base de référence des clients.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The settings of the Intune baselines and of the Group Policy security baselines are chosen by the same Microsoft security team.", fr: "Les paramètres des bases de référence Intune et des bases de référence de sécurité de stratégie de groupe sont choisis par la même équipe de sécurité Microsoft." } }
    - { id: b, text: { en: "An Intune security baseline is a one-to-one implementation of the matching CIS benchmark.", fr: "Une base de référence de sécurité Intune est une implémentation exacte du benchmark CIS correspondant." } }
    - { id: c, text: { en: "The Microsoft Defender for Endpoint baseline is optimized for physical devices and isn't currently recommended for VDI endpoints.", fr: "La base de référence Microsoft Defender for Endpoint est optimisée pour les appareils physiques et n'est pas recommandée actuellement pour les points de terminaison VDI." } }
    - { id: d, text: { en: "The Intune baselines include the settings that apply only to on-premises domain controllers.", fr: "Les bases de référence Intune incluent les paramètres qui ne s'appliquent qu'aux contrôleurs de domaine locaux." } }
    - { id: e, text: { en: "A device can receive only one security baseline profile at a time.", fr: "Un appareil ne peut recevoir qu'un seul profil de base de référence de sécurité à la fois." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The same Microsoft security team selects and organizes the settings of the Group Policy and Intune baselines; Intune includes all the relevant settings except those specific to on-premises domain controllers. The Defender for Endpoint baseline is optimized for physical devices and isn't currently recommended for VMs or VDI endpoints.
    fr: |
      La même équipe de sécurité Microsoft sélectionne et organise les paramètres des bases de référence de stratégie de groupe et Intune ; Intune inclut tous les paramètres pertinents sauf ceux propres aux contrôleurs de domaine locaux. La base de référence Defender for Endpoint est optimisée pour les appareils physiques et n'est pas recommandée actuellement pour les machines virtuelles ni les points de terminaison VDI.
  options:
    b:
      en: |
        Microsoft consults organizations such as CIS, but there is no one-to-one mapping between CIS-compliant settings and Microsoft baselines.
      fr: |
        Microsoft consulte des organisations comme le CIS, mais il n'existe pas de correspondance exacte entre les paramètres conformes CIS et les bases de référence Microsoft.
    d:
      en: |
        Settings specific to on-premises domain controllers are excluded from the Intune baselines.
      fr: |
        Les paramètres propres aux contrôleurs de domaine locaux sont exclus des bases de référence Intune.
    e:
      en: |
        You can deploy several baselines at once, and even several instances of the same baseline; you must then resolve any conflicting values.
      fr: |
        Vous pouvez déployer plusieurs bases de référence à la fois, et même plusieurs instances de la même base de référence ; vous devez alors résoudre les éventuelles valeurs en conflit.
references:
  - title: Use security baselines to help secure Windows devices you manage with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/security-baselines
