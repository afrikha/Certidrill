id: sc100-sr1-contractor-web-2
objective: "3.4.2"
type: series_yesno
series: sc100-sr1-contractor-web
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You recommend a filtering policy delivered to Contractors with only the Microsoft traffic profile enabled.
  fr: Vous recommandez une stratégie de filtrage appliquée à Contractors avec seulement le profil de trafic Microsoft activé.
body:
  solution:
    en: |
      You recommend enabling only the **Microsoft** traffic forwarding profile and assigning it to **Contractors**. You create a web content filtering policy that blocks the **Gambling** category and link it to a new security profile. A Conditional Access policy that targets **Contractors** applies the security profile by using the **Use Global Secure Access security profile** session control.
    fr: |
      Vous recommandez d'activer uniquement le profil de transfert du trafic **Microsoft** et de l'attribuer à **Contractors**. Vous créez une stratégie de filtrage du contenu web qui bloque la catégorie **Gambling** et la liez à un nouveau profil de sécurité. Une stratégie d'accès conditionnel qui cible **Contractors** applique le profil de sécurité au moyen du contrôle de session **Use Global Secure Access security profile**.
answer: { value: false }
explanation:
  correct:
    en: The Microsoft traffic forwarding profile acquires only the traffic of Microsoft workloads such as Exchange Online, SharePoint Online, and Microsoft Teams. Gambling websites are public internet destinations that only the Internet Access profile forwards, and traffic that the client doesn't acquire is never filtered.
    fr: "Le profil de transfert du trafic Microsoft acquiert uniquement le trafic des charges de travail Microsoft comme Exchange Online, SharePoint Online et Microsoft Teams. Les sites de jeux d'argent sont des destinations Internet publiques que seul le profil Internet Access transfère, et le trafic que le client n'acquiert pas n'est jamais filtré."
references:
  - title: Global Secure Access traffic forwarding profiles
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-traffic-forwarding
