id: sc100-3b-baseline-tools-map
objective: "3.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Manufacturing has the endpoints described in the targets. You need to specify the tool that deploys or assesses the security baseline of each group of endpoints. The solution must minimize administrative effort.

    Which tool should you specify for each group? To answer, drag the appropriate tools to the correct groups. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Manufacturing dispose des points de terminaison décrits dans les cibles. Vous devez spécifier l'outil qui déploie ou évalue la base de référence de sécurité de chaque groupe de points de terminaison. La solution doit réduire au minimum l'effort d'administration.

    Quel outil devez-vous spécifier pour chaque groupe ? Pour répondre, faites glisser les outils appropriés vers les groupes correspondants. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mc, text: { en: "Azure Policy machine configuration", fr: "Configuration des machines Azure Policy" } }
    - { id: intune, text: { en: "Intune security baselines", fr: "Bases de référence de sécurité Intune" } }
    - { id: gpo, text: { en: "Group Policy baselines from the Security Compliance Toolkit", fr: "Bases de référence de stratégie de groupe du Security Compliance Toolkit" } }
    - { id: osconfig, text: { en: "OSConfig security baselines", fr: "Bases de référence de sécurité OSConfig" } }
    - { id: sspm, text: { en: "Defender for Cloud Apps security recommendations", fr: "Recommandations de sécurité de Defender for Cloud Apps" } }
  targets:
    - { id: t1, text: { en: "Linux virtual machines in AWS, onboarded to Azure Arc", fr: "Machines virtuelles Linux dans AWS, intégrées à Azure Arc" } }
    - { id: t2, text: { en: "Microsoft Entra joined Windows 11 laptops enrolled in Intune", fr: "Ordinateurs portables Windows 11 joints à Microsoft Entra et inscrits dans Intune" } }
    - { id: t3, text: { en: "Domain-joined Windows Server 2016 servers in an isolated datacenter, managed only by Group Policy", fr: "Serveurs Windows Server 2016 joints au domaine dans un centre de données isolé, gérés uniquement par la stratégie de groupe" } }
    - { id: t4, text: { en: "Windows Server 2025 servers that need a baseline tailored to their server role, with drift control", fr: "Serveurs Windows Server 2025 qui nécessitent une base de référence adaptée à leur rôle de serveur, avec contrôle de la dérive" } }
answer:
  mapping: { t1: mc, t2: intune, t3: gpo, t4: osconfig }
explanation:
  correct:
    en: |
      Machine configuration audits or configures OS settings of Azure and Arc-enabled machines, Windows and Linux. Intune security baselines are preconfigured Windows settings for Intune-managed devices. The Group Policy security baselines of the Security Compliance Toolkit fit servers managed only by Group Policy. OSConfig applies Windows Server 2025 baselines tailored to the server role and can correct drift automatically. Defender for Cloud Apps assesses SaaS apps, not endpoints.
    fr: |
      La configuration des machines audite ou configure les paramètres du système d'exploitation des machines Azure et des machines avec Azure Arc, Windows comme Linux. Les bases de référence de sécurité Intune sont des paramètres Windows préconfigurés pour les appareils gérés par Intune. Les bases de référence de sécurité de stratégie de groupe du Security Compliance Toolkit conviennent aux serveurs gérés uniquement par la stratégie de groupe. OSConfig applique des bases de référence Windows Server 2025 adaptées au rôle du serveur et peut corriger automatiquement la dérive. Defender for Cloud Apps évalue des applications SaaS, pas des points de terminaison.
references:
  - title: OSConfig security configuration for Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-overview
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
