id: sc100-3a-onboard-sources-dragdrop
objective: "3.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. is designing an integrated posture management solution based on Microsoft Defender for Cloud. The solution must cover four environments.

    What should you recommend to bring each environment into the solution? To answer, drag the appropriate solutions to the correct environments. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. conçoit une solution intégrée de gestion de la posture fondée sur Microsoft Defender for Cloud. La solution doit couvrir quatre environnements.

    Que devez-vous recommander pour intégrer chaque environnement à la solution ? Pour répondre, faites glisser les solutions appropriées vers les environnements correspondants. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: arcsrv, text: { en: "Azure Arc-enabled servers", fr: "Serveurs compatibles Azure Arc" } }
    - { id: arck8s, text: { en: "Azure Arc-enabled Kubernetes", fr: "Kubernetes compatible Azure Arc" } }
    - { id: aws, text: { en: "AWS connector in Defender for Cloud", fr: "Connecteur AWS dans Defender for Cloud" } }
    - { id: easm, text: { en: "Standalone Defender EASM resource", fr: "Ressource Defender EASM autonome" } }
    - { id: devops, text: { en: "DevOps security connector", fr: "Connecteur de sécurité DevOps" } }
    - { id: sentinel, text: { en: "Microsoft Sentinel data connector", fr: "Connecteur de données Microsoft Sentinel" } }
  targets:
    - id: vmware
      text: { en: "Windows and Linux VMs in the on-premises VMware environment", fr: "Machines virtuelles Windows et Linux de l'environnement VMware local" }
    - id: k8s
      text: { en: "Kubernetes clusters that run in the on-premises datacenter", fr: "Clusters Kubernetes exécutés dans le centre de données local" }
    - id: eks
      text: { en: "Amazon EKS clusters and S3 buckets", fr: "Clusters Amazon EKS et compartiments S3" }
    - id: external
      text: { en: "Internet-facing domains and IP ranges of a subsidiary, outside the clouds", fr: "Domaines et plages IP exposés à Internet d'une filiale, hors des clouds" }
answer:
  mapping: { vmware: arcsrv, k8s: arck8s, eks: aws, external: easm }
explanation:
  correct:
    en: Azure Arc-enabled servers and Azure Arc-enabled Kubernetes project on-premises machines and clusters as Azure resources, so that Defender for Servers and Defender for Containers can cover them. The AWS connector brings the AWS account resources, including EKS clusters and S3 buckets, into the assessment. A standalone Defender EASM resource discovers the external attack surface beyond the cloud resources.
    fr: Les serveurs compatibles Azure Arc et Kubernetes compatible Azure Arc projettent les machines et les clusters locaux comme des ressources Azure, pour que Defender for Servers et Defender for Containers puissent les couvrir. Le connecteur AWS intègre à l'évaluation les ressources du compte AWS, y compris les clusters EKS et les compartiments S3. Une ressource Defender EASM autonome découvre la surface d'attaque externe au-delà des ressources cloud.
  options:
    devops:
      en: DevOps security connectors cover code repositories, not running infrastructure.
      fr: Les connecteurs de sécurité DevOps couvrent les dépôts de code, pas l'infrastructure en cours d'exécution.
    sentinel:
      en: Sentinel data connectors ingest logs for detection; they don't feed the posture assessment.
      fr: Les connecteurs de données Sentinel ingèrent des journaux pour la détection ; ils n'alimentent pas l'évaluation de la posture.
references:
  - title: Azure Arc overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/overview
  - title: Microsoft Defender for Cloud Overview
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
