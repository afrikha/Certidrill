id: sc100-3a-paas-threats-dragdrop
objective: "3.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. is selecting Microsoft Defender for Cloud workload protection plans for its Azure subscriptions. The security team lists four threats that must raise security alerts.

    Which plan should you recommend for each threat? To answer, drag the appropriate plans to the correct threats. Each plan may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. sélectionne des plans de protection des charges de travail de Microsoft Defender for Cloud pour ses abonnements Azure. L'équipe de sécurité liste quatre menaces qui doivent générer des alertes de sécurité.

    Quel plan devez-vous recommander pour chaque menace ? Pour répondre, faites glisser les plans appropriés vers les menaces correspondantes. Chaque plan peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: kv, text: Defender for Key Vault }
    - { id: arm, text: Defender for Resource Manager }
    - { id: ai, text: Defender for AI Services }
    - { id: apis, text: Defender for APIs }
    - { id: storage, text: Defender for Storage }
    - { id: appsvc, text: Defender for App Service }
  targets:
    - id: secrets
      text: { en: "Unusual access to the secrets stored in a key vault", fr: "Accès inhabituels aux secrets stockés dans un coffre de clés" }
    - id: mgmt
      text: { en: "Suspicious management operations performed on the subscriptions", fr: "Opérations de gestion suspectes effectuées sur les abonnements" }
    - id: jailbreak
      text: { en: "Jailbreak attempts against a generative AI application built on Azure OpenAI models", fr: "Tentatives de jailbreak contre une application d'IA générative fondée sur des modèles Azure OpenAI" }
    - id: apim
      text: { en: "Attacks against the APIs published in Azure API Management", fr: "Attaques contre les API publiées dans Azure API Management" }
answer:
  mapping: { secrets: kv, mgmt: arm, jailbreak: ai, apim: apis }
explanation:
  correct:
    en: Defender for Key Vault detects unusual and potentially harmful access to key vaults. Defender for Resource Manager detects unusual management operations. Threat protection for AI services raises alerts for jailbreak, data leakage and credential theft against Azure OpenAI models. Defender for APIs detects real-time threats against business-critical APIs.
    fr: Defender for Key Vault détecte les accès inhabituels et potentiellement dangereux aux coffres de clés. Defender for Resource Manager détecte les opérations de gestion inhabituelles. La protection contre les menaces pour les services d'IA génère des alertes en cas de jailbreak, de fuite de données et de vol d'identifiants contre les modèles Azure OpenAI. Defender for APIs détecte les menaces en temps réel contre les API critiques pour l'entreprise.
  options:
    storage:
      en: Defender for Storage protects storage accounts, which none of the threats target.
      fr: Defender for Storage protège les comptes de stockage, qu'aucune des menaces ne vise.
    appsvc:
      en: Defender for App Service protects apps hosted on App Service, not APIs published through API Management.
      fr: Defender for App Service protège les applications hébergées sur App Service, pas les API publiées via API Management.
references:
  - title: Microsoft Defender for Cloud Overview
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
  - title: AI threat protection in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
