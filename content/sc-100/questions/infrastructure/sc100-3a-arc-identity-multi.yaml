id: sc100-3a-arc-identity-multi
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs a reporting application on an on-premises Windows Server server named SRV-REP01. The application must read a connection string from Azure Key Vault. The security policy forbids storing any credential, certificate or secret on the server to authenticate to Azure.

    Which two actions should you recommend?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute une application de rapports sur un serveur Windows Server local nommé SRV-REP01. L'application doit lire une chaîne de connexion dans Azure Key Vault. La stratégie de sécurité interdit de stocker sur le serveur des informations d'identification, un certificat ou un secret pour s'authentifier auprès d'Azure.

    Quelles sont les deux actions à recommander ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create a service principal and store its client secret in the application configuration", fr: "Créer un principal de service et stocker son secret client dans la configuration de l'application" }
    - id: b
      text: { en: "Connect SRV-REP01 to Azure as an Azure Arc-enabled server", fr: "Connecter SRV-REP01 à Azure en tant que serveur compatible Azure Arc" }
    - id: c
      text: { en: "Synchronize the computer account of SRV-REP01 to Microsoft Entra ID by using Microsoft Entra Connect", fr: "Synchroniser le compte d'ordinateur de SRV-REP01 avec Microsoft Entra ID à l'aide de Microsoft Entra Connect" }
    - id: d
      text: { en: "Grant the managed identity of SRV-REP01 permission to read secrets in the key vault", fr: "Accorder à l'identité managée de SRV-REP01 l'autorisation de lire les secrets du coffre de clés" }
    - id: e
      text: { en: "Onboard SRV-REP01 directly to Microsoft Defender for Endpoint", fr: "Intégrer SRV-REP01 directement à Microsoft Defender for Endpoint" }
answer:
  optionIds: [b, d]
explanation:
  correct:
    en: An Azure Arc-enabled server receives a managed identity, provided locally by the Hybrid Instance Metadata Service (HIMDS), that the agent and applications can use to authenticate to Azure without stored secrets. You then grant that identity access to the key vault secrets.
    fr: Un serveur compatible Azure Arc reçoit une identité managée, fournie localement par le service HIMDS (Hybrid Instance Metadata Service), que l'agent et les applications peuvent utiliser pour s'authentifier auprès d'Azure sans secret stocké. Vous accordez ensuite à cette identité l'accès aux secrets du coffre de clés.
  options:
    a:
      en: Storing a client secret on the server breaks the security policy, and the secret must also be rotated.
      fr: Stocker un secret client sur le serveur contrevient à la stratégie de sécurité, et le secret doit en plus faire l'objet d'une rotation.
    c:
      en: Microsoft Entra Connect synchronizes identities for hybrid identity scenarios; it doesn't give the server an identity that can authenticate to Key Vault without secrets.
      fr: Microsoft Entra Connect synchronise les identités pour les scénarios d'identité hybride ; il ne donne pas au serveur une identité capable de s'authentifier auprès de Key Vault sans secret.
    e:
      en: Defender for Endpoint protects the server; it doesn't provide an identity for applications to access Azure resources.
      fr: Defender for Endpoint protège le serveur ; il ne fournit pas d'identité permettant aux applications d'accéder aux ressources Azure.
references:
  - title: Security overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-overview
  - title: Azure Arc-enabled servers Overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
