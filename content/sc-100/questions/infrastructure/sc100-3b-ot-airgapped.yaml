id: sc100-3b-ot-airgapped
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Chemicals operates four plants. Each plant has an OT network with PLCs, HMIs and engineering workstations. A national regulation forbids any OT data from leaving the corporate on-premises networks, and the plants have no internet connectivity.

    The security operations center (SOC) uses an on-premises SIEM in the corporate datacenter, which is reachable from every plant. The SOC must receive OT alerts from all the plants in the SIEM and build its own dashboards of the OT device inventory.

    You plan to use Microsoft Defender for IoT. The solution must minimize the additional management hardware to deploy.

    What should you recommend?
  fr: |
    Adatum Chemicals exploite quatre usines. Chaque usine dispose d'un réseau OT avec des PLC, des HMI et des postes d'ingénierie. Une réglementation nationale interdit à toute donnée OT de quitter les réseaux locaux de l'entreprise, et les usines n'ont aucune connectivité Internet.

    Le centre des opérations de sécurité (SOC) utilise un SIEM local dans le centre de données de l'entreprise, accessible depuis chaque usine. Le SOC doit recevoir dans le SIEM les alertes OT de toutes les usines et créer ses propres tableaux de bord de l'inventaire des appareils OT.

    Vous prévoyez d'utiliser Microsoft Defender for IoT. La solution doit réduire au minimum le matériel de gestion supplémentaire à déployer.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Locally managed OT sensors that forward alerts to the SIEM by using syslog, with dashboards built on the Defender for IoT APIs", fr: "Des capteurs OT gérés localement qui transfèrent les alertes au SIEM par syslog, avec des tableaux de bord créés à partir des API de Defender for IoT" } }
    - { id: b, text: { en: "Cloud-connected OT sensors that reach Azure through a proxy in each plant, with alerts sent to Microsoft Sentinel", fr: "Des capteurs OT connectés au cloud qui joignent Azure par un proxy dans chaque usine, avec des alertes envoyées à Microsoft Sentinel" } }
    - { id: c, text: { en: "Locally managed OT sensors that are managed centrally by a Defender for IoT on-premises management console in the datacenter", fr: "Des capteurs OT gérés localement et administrés de façon centralisée par une console de gestion locale Defender for IoT dans le centre de données" } }
    - { id: d, text: { en: "Enterprise IoT security with Microsoft Defender for Endpoint, onboarded on the engineering workstations of each plant", fr: "La sécurité IoT d'entreprise avec Microsoft Defender for Endpoint, intégré sur les postes d'ingénierie de chaque usine" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Locally managed sensors keep all the data on-premises. For air-gapped deployments, Microsoft recommends integrating each sensor with the existing infrastructure: alerts and syslog messages forwarded to the SIEM, and the Defender for IoT API used to build management dashboards. This avoids a separate management appliance.
    fr: |
      Les capteurs gérés localement conservent toutes les données en local. Pour les déploiements isolés (air-gapped), Microsoft recommande d'intégrer chaque capteur à l'infrastructure existante : alertes et messages syslog transférés au SIEM, et API de Defender for IoT utilisée pour créer des tableaux de bord de gestion. Cela évite une appliance de gestion distincte.
  options:
    b:
      en: |
        Cloud-connected sensors send alert information to Azure, which the regulation forbids, and the plants have no internet connectivity.
      fr: |
        Les capteurs connectés au cloud envoient des informations d'alerte à Azure, ce que la réglementation interdit, et les usines n'ont aucune connectivité Internet.
    c:
      en: |
        The legacy on-premises management console isn't supported or available for download after January 1, 2025, and it is additional management hardware.
      fr: |
        La console de gestion locale héritée n'est plus prise en charge ni téléchargeable depuis le 1er janvier 2025, et elle représente du matériel de gestion supplémentaire.
    d:
      en: |
        Enterprise IoT security relies on Defender for Endpoint, a cloud service, and targets enterprise IoT devices rather than industrial protocols on OT networks.
      fr: |
        La sécurité IoT d'entreprise s'appuie sur Defender for Endpoint, un service cloud, et cible les appareils IoT d'entreprise plutôt que les protocoles industriels des réseaux OT.
references:
  - title: Hybrid or air-gapped deployment path for sensor management
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/ot-deploy/air-gapped-deploy
  - title: What is Microsoft Defender for IoT?
    url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/overview
