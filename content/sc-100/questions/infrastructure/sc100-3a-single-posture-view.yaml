id: sc100-3a-single-posture-view
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. runs workloads in Azure, AWS and GCP, and 300 Windows and Linux servers in an on-premises VMware environment. The security team wants one posture dashboard with security recommendations for the cloud resources of the three providers and for the on-premises servers.

    The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Litware, Inc. exécute des charges de travail dans Azure, AWS et GCP, ainsi que 300 serveurs Windows et Linux dans un environnement VMware local. L'équipe de sécurité veut un seul tableau de bord de posture avec des recommandations de sécurité pour les ressources cloud des trois fournisseurs et pour les serveurs locaux.

    La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Microsoft Sentinel with the AWS, GCP and Syslog data connectors and a posture workbook", fr: "Microsoft Sentinel avec les connecteurs de données AWS, GCP et Syslog et un classeur de posture" }
    - id: b
      text: { en: "Microsoft Defender for Endpoint on every server and the device inventory of the Defender portal", fr: "Microsoft Defender for Endpoint sur chaque serveur et l'inventaire des appareils du portail Defender" }
    - id: c
      text: { en: "Azure Policy machine configuration assignments in each cloud and in the datacenter", fr: "Des attributions de configuration des machines Azure Policy dans chaque cloud et dans le centre de données" }
    - id: d
      text: { en: "Defender for Cloud with AWS and GCP connectors, and Azure Arc for the on-premises servers", fr: "Defender for Cloud avec des connecteurs AWS et GCP, et Azure Arc pour les serveurs locaux" }
answer:
  optionId: d
explanation:
  correct:
    en: Defender for Cloud covers Azure natively, AWS accounts and GCP projects through agentless connectors, and on-premises machines through Azure Arc. All the resources then appear in the same inventory, recommendations and secure score.
    fr: Defender for Cloud couvre Azure en natif, les comptes AWS et les projets GCP grâce à des connecteurs sans agent, et les machines locales grâce à Azure Arc. Toutes les ressources apparaissent alors dans le même inventaire, les mêmes recommandations et le même degré de sécurisation.
  options:
    a:
      en: Sentinel collects logs for detection and hunting; it doesn't assess configurations or produce security recommendations, and building the workbook adds effort.
      fr: Sentinel collecte des journaux pour la détection et la chasse ; il n'évalue pas les configurations et ne produit pas de recommandations de sécurité, et la création du classeur ajoute de l'effort.
    b:
      en: Defender for Endpoint protects and inventories devices; it doesn't assess the configuration of the cloud resources of the three providers.
      fr: Defender for Endpoint protège et inventorie les appareils ; il n'évalue pas la configuration des ressources cloud des trois fournisseurs.
    c:
      en: Machine configuration audits settings inside Azure and Arc-enabled machines only; it doesn't assess cloud resources such as storage or networks, and it doesn't provide a posture dashboard.
      fr: La configuration des machines audite uniquement les paramètres à l'intérieur des machines Azure et compatibles Arc ; elle n'évalue pas les ressources cloud comme le stockage ou les réseaux et ne fournit pas de tableau de bord de posture.
references:
  - title: Microsoft Defender for Cloud Overview
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
