id: sc100-cs2b-eks-protection
objective: "3.1.4"
type: single
caseStudy: sc100-cs2b-vanarsdel-payments
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a Defender for Cloud plan to enable on the AWS connector in addition to the posture management plan. The solution must meet the workload requirements for the payment API.

    Which plan should you recommend?
  fr: |
    Vous devez recommander un plan Defender for Cloud à activer sur le connecteur AWS en plus du plan de gestion de la posture. La solution doit répondre aux exigences relatives aux charges de travail pour l'API de paiement.

    Quel plan devez-vous recommander ?
body:
  options:
    - { id: a, text: "Microsoft Defender for Servers Plan 2" }
    - { id: b, text: "Microsoft Defender for APIs" }
    - { id: c, text: "Microsoft Defender for Containers" }
    - { id: d, text: "Microsoft Defender for Resource Manager" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Defender for Containers protects Kubernetes clusters, nodes, workloads, registries and images across clouds. It scans the images of registries such as Amazon ECR for vulnerabilities and detects suspicious activity at the cluster, node and workload levels, with alerts that can be investigated in Microsoft Defender XDR.
    fr: |
      Defender for Containers protège les clusters Kubernetes, les nœuds, les charges de travail, les registres et les images sur plusieurs clouds. Il analyse les images de registres comme Amazon ECR pour détecter les vulnérabilités et détecte les activités suspectes au niveau du cluster, des nœuds et des charges de travail, avec des alertes qui peuvent être examinées dans Microsoft Defender XDR.
  options:
    a:
      en: Defender for Servers protects the operating system of servers; it doesn't assess registry images or analyze Kubernetes activity.
      fr: Defender for Servers protège le système d'exploitation des serveurs ; il n'évalue pas les images de registre et n'analyse pas l'activité Kubernetes.
    b:
      en: Defender for APIs protects APIs published in Azure API Management; it doesn't scan container images or protect EKS clusters.
      fr: Defender for APIs protège les API publiées dans Gestion des API Azure ; il n'analyse pas les images de conteneur et ne protège pas les clusters EKS.
    d:
      en: Defender for Resource Manager monitors Azure Resource Manager operations; it doesn't cover AWS workloads.
      fr: Defender for Resource Manager surveille les opérations Azure Resource Manager ; il ne couvre pas les charges de travail AWS.
references:
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
