id: sc100-3a-hybrid-attack-path
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has Azure VMs, an on-premises Active Directory Domain Services (AD DS) forest, Microsoft Defender for Endpoint on all devices and servers, Microsoft Defender for Identity, and Microsoft Defender for Cloud with Defender CSPM.

    During a red team exercise, an attacker compromised an internet-exposed Azure VM, used the credentials of an administrator who signed in to the VM, and reached an on-premises domain controller.

    You need to recommend a solution that continuously identifies and prioritizes such paths across cloud resources, identities and on-premises assets.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose de machines virtuelles Azure, d'une forêt Active Directory Domain Services (AD DS) locale, de Microsoft Defender for Endpoint sur tous les appareils et serveurs, de Microsoft Defender for Identity et de Microsoft Defender for Cloud avec Defender CSPM.

    Lors d'un exercice de red team, un attaquant a compromis une machine virtuelle Azure exposée à Internet, a utilisé les informations d'identification d'un administrateur qui s'était connecté à la machine virtuelle et a atteint un contrôleur de domaine local.

    Vous devez recommander une solution qui identifie et hiérarchise en continu de tels chemins entre les ressources cloud, les identités et les ressources locales.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Attack paths in Microsoft Security Exposure Management", fr: "Les chemins d'attaque dans Microsoft Security Exposure Management" }
    - id: b
      text: { en: "Lateral movement paths in Defender for Identity", fr: "Les chemins de mouvement latéral dans Defender for Identity" }
    - id: c
      text: { en: "Attack path analysis in Defender for Cloud", fr: "L'analyse du chemin d'attaque dans Defender for Cloud" }
    - id: d
      text: { en: "Scheduled hunting queries in Microsoft Sentinel", fr: "Des requêtes de chasse planifiées dans Microsoft Sentinel" }
answer:
  optionId: a
explanation:
  correct:
    en: Security Exposure Management generates attack paths from the data of Defender for Endpoint, Defender Vulnerability Management and Defender for Cloud, including hybrid paths that start at a compromised cloud VM, pivot through an identity and reach an on-premises domain controller. It identifies choke points so that the most impactful fixes come first.
    fr: Security Exposure Management génère des chemins d'attaque à partir des données de Defender for Endpoint, de Gestion des vulnérabilités Microsoft Defender et de Defender for Cloud, y compris des chemins hybrides qui partent d'une machine virtuelle cloud compromise, pivotent par une identité et atteignent un contrôleur de domaine local. Il identifie les points d'étranglement pour que les corrections les plus efficaces passent en premier.
  options:
    c:
      en: The attack path experience of Defender for Cloud is limited to cloud environments; it doesn't follow a path to an on-premises domain controller.
      fr: L'expérience des chemins d'attaque de Defender for Cloud est limitée aux environnements cloud ; elle ne suit pas un chemin jusqu'à un contrôleur de domaine local.
    b:
      en: Lateral movement paths show how an attacker can move between on-premises identities and devices; they don't start from the internet exposure of an Azure VM.
      fr: Les chemins de mouvement latéral montrent comment un attaquant peut se déplacer entre des identités et des appareils locaux ; ils ne partent pas de l'exposition à Internet d'une machine virtuelle Azure.
    d:
      en: Hunting queries search for activity in collected logs; they don't model and prioritize potential paths to critical assets.
      fr: Les requêtes de chasse recherchent des activités dans les journaux collectés ; elles ne modélisent ni ne hiérarchisent les chemins potentiels vers les ressources critiques.
references:
  - title: Work with attack paths in Microsoft Security Exposure Management
    url: https://learn.microsoft.com/en-us/security-exposure-management/review-attack-paths
