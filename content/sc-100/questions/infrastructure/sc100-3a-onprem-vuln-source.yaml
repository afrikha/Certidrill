id: sc100-3a-onprem-vuln-source
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. enabled Defender for Servers Plan 2 for its Azure VMs, its AWS EC2 instances and 200 on-premises Azure Arc-enabled servers. Microsoft Defender for Endpoint is deployed on every server.

    The security requirements state that a vulnerability assessment and a software inventory must be available for every server. A draft design relies on agentless machine scanning for all the servers.

    What should you specify for the on-premises servers?
  fr: |
    Fabrikam, Inc. a activé Defender for Servers Plan 2 pour ses machines virtuelles Azure, ses instances AWS EC2 et 200 serveurs locaux compatibles Azure Arc. Microsoft Defender for Endpoint est déployé sur chaque serveur.

    Les exigences de sécurité stipulent qu'une évaluation des vulnérabilités et un inventaire logiciel doivent être disponibles pour chaque serveur. Une ébauche de conception s'appuie sur l'analyse sans agent des machines pour tous les serveurs.

    Que devez-vous spécifier pour les serveurs locaux ?
body:
  options:
    - id: a
      text: { en: "Keep agentless machine scanning, because Azure Arc exposes the disks of the servers to Defender for Cloud", fr: "Conserver l'analyse sans agent des machines, car Azure Arc expose les disques des serveurs à Defender for Cloud" }
    - id: b
      text: { en: "Enable Defender CSPM so that agentless scanning can take snapshots of the on-premises disks", fr: "Activer Defender CSPM pour que l'analyse sans agent puisse prendre des captures instantanées des disques locaux" }
    - id: c
      text: { en: "Use the Defender Vulnerability Management findings that come from the Defender for Endpoint sensor", fr: "Utiliser les résultats de Gestion des vulnérabilités Microsoft Defender issus du capteur Defender for Endpoint" }
    - id: d
      text: { en: "Deploy the Azure Monitor Agent with a data collection rule that collects the installed software", fr: "Déployer l'agent Azure Monitor avec une règle de collecte de données qui collecte les logiciels installés" }
answer:
  optionId: c
explanation:
  correct:
    en: Agentless machine scanning takes snapshots of the disks of Azure VMs, AWS EC2 instances and GCP compute instances and analyzes them out of band; on-premises machines have no cloud disk to snapshot. For those servers, the vulnerability assessment and software inventory come from Defender Vulnerability Management through the Defender for Endpoint sensor that is already deployed.
    fr: L'analyse sans agent des machines prend des captures instantanées des disques des machines virtuelles Azure, des instances AWS EC2 et des instances de calcul GCP et les analyse hors bande ; les machines locales n'ont pas de disque cloud à capturer. Pour ces serveurs, l'évaluation des vulnérabilités et l'inventaire logiciel proviennent de Gestion des vulnérabilités Microsoft Defender par le capteur Defender for Endpoint déjà déployé.
  options:
    a:
      en: Azure Arc projects the server as an Azure resource, but it doesn't give Defender for Cloud a disk snapshot to scan.
      fr: Azure Arc projette le serveur comme une ressource Azure, mais ne fournit pas à Defender for Cloud de capture instantanée de disque à analyser.
    b:
      en: Defender CSPM also uses agentless scanning, which supports Azure, AWS and GCP machines, not on-premises disks.
      fr: Defender CSPM utilise aussi l'analyse sans agent, qui prend en charge les machines Azure, AWS et GCP, pas les disques locaux.
    d:
      en: The Azure Monitor Agent collects logs and performance data; it doesn't assess vulnerabilities.
      fr: L'agent Azure Monitor collecte des journaux et des données de performances ; il n'évalue pas les vulnérabilités.
references:
  - title: Agentless machine scanning in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-agentless-data-collection
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
