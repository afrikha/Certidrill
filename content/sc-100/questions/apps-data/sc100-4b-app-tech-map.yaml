id: sc100-4b-app-tech-map
objective: "4.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is designing a new internet-facing order management application in Azure. The security architect listed the application security requirements shown in the answer area.

    Which technology should you map to each requirement? To answer, drag the appropriate technologies to the correct requirements. Each technology may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit une nouvelle application de gestion des commandes exposée à Internet dans Azure. L'architecte sécurité a listé les exigences de sécurité de l'application présentées dans la zone de réponse.

    Quelle technologie devez-vous associer à chaque exigence ? Pour répondre, faites glisser les technologies appropriées vers les exigences correspondantes. Chaque technologie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ddos, text: "Azure DDoS Protection" }
    - { id: kv, text: "Azure Key Vault" }
    - { id: apim, text: "Azure API Management" }
    - { id: policy, text: "Azure Policy" }
    - { id: fw, text: { en: "Azure Firewall", fr: "Pare-feu Azure" } }
    - { id: mdca, text: "Microsoft Defender for Cloud Apps" }
  targets:
    - { id: t1, text: { en: "Mitigate volumetric network-layer attacks against the application's public IP addresses", fr: "Atténuer les attaques volumétriques de la couche réseau contre les adresses IP publiques de l'application" } }
    - { id: t2, text: { en: "Store the certificates and keys that the application uses", fr: "Stocker les certificats et les clés qu'utilise l'application" } }
    - { id: t3, text: { en: "Publish the order APIs to partners with authentication, throttling and versioning", fr: "Publier les API de commandes pour les partenaires avec authentification, limitation et gestion des versions" } }
    - { id: t4, text: { en: "Prevent the deployment of storage accounts that allow public network access", fr: "Empêcher le déploiement de comptes de stockage qui autorisent l'accès au réseau public" } }
answer:
  mapping: { t1: ddos, t2: kv, t3: apim, t4: policy }
explanation:
  correct:
    en: |
      Azure DDoS Protection mitigates volumetric attacks against public IP addresses. Azure Key Vault stores the secrets, keys and certificates of the application. Azure API Management is the gateway that authenticates, throttles and versions published APIs. Azure Policy with the Deny effect blocks the deployment of noncompliant resources, such as storage accounts with public network access.
    fr: |
      Azure DDoS Protection atténue les attaques volumétriques contre les adresses IP publiques. Azure Key Vault stocke les secrets, les clés et les certificats de l'application. Azure API Management est la passerelle qui authentifie, limite et versionne les API publiées. Azure Policy avec l'effet Deny bloque le déploiement des ressources non conformes, comme des comptes de stockage avec accès au réseau public.
  options:
    fw:
      en: Azure Firewall filters network traffic between networks; it doesn't absorb volumetric DDoS attacks or govern resource deployments.
      fr: Pare-feu Azure filtre le trafic réseau entre réseaux ; il n'absorbe pas les attaques DDoS volumétriques et ne régit pas les déploiements de ressources.
    mdca:
      en: Defender for Cloud Apps protects the use of SaaS applications; it doesn't publish APIs or store keys.
      fr: Defender for Cloud Apps protège l'utilisation des applications SaaS ; il ne publie pas d'API et ne stocke pas de clés.
references:
  - title: Mitigate OWASP API security top 10 in Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/mitigate-owasp-api-threats
