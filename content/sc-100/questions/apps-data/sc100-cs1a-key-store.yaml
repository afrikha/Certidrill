id: sc100-cs1a-key-store
objective: "4.3.3"
type: single
caseStudy: sc100-cs1a-humongous
difficulty: 2
status: draft
stem:
  en: |-
    You need to recommend where to store the customer-managed key that protects sqldb-claims. The solution must meet the data requirements. What should you recommend?
  fr: |-
    Vous devez recommander l'emplacement de stockage de la clé gérée par le client qui protège sqldb-claims. La solution doit respecter les exigences relatives aux données. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure Key Vault Standard vault that uses the Azure RBAC permission model", fr: "Un coffre Azure Key Vault Standard qui utilise le modèle d'autorisation Azure RBAC" } }
    - { id: b, text: { en: "An Azure Key Vault Premium vault that uses the Azure RBAC permission model", fr: "Un coffre Azure Key Vault Premium qui utilise le modèle d'autorisation Azure RBAC" } }
    - { id: c, text: { en: "An Azure Key Vault Managed HSM that uses local RBAC", fr: "Un HSM managé Azure Key Vault qui utilise le RBAC local" } }
    - { id: d, text: { en: "An Azure Key Vault Premium vault that uses the access policy permission model", fr: "Un coffre Azure Key Vault Premium qui utilise le modèle d'autorisation par stratégie d'accès" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Managed HSM is a single-tenant service: each instance is a dedicated HSM cluster with its own security domain. Its local RBAC model gives the designated HSM administrators complete control that management group, subscription and resource group administrators can't override. Azure SQL supports Managed HSM keys as TDE protectors.
    fr: |-
      Un HSM managé est un service monolocataire : chaque instance est un cluster HSM dédié avec son propre domaine de sécurité. Son modèle de RBAC local donne aux administrateurs HSM désignés un contrôle total que les administrateurs des groupes d'administration, des abonnements et des groupes de ressources ne peuvent pas outrepasser. Azure SQL prend en charge les clés d'un HSM managé comme protecteurs TDE.
  options:
    a:
      en: |-
        A Standard vault protects keys with software, not with an HSM, and subscription owners can assign themselves Azure RBAC data roles on the vault.
      fr: |-
        Un coffre Standard protège les clés par logiciel, et non avec un HSM, et les propriétaires de l'abonnement peuvent s'attribuer des rôles de données Azure RBAC sur le coffre.
    b:
      en: |-
        A Premium vault isn't a dedicated single-tenant HSM, and subscription owners can assign themselves Azure RBAC data roles on the vault.
      fr: |-
        Un coffre Premium n'est pas un HSM monolocataire dédié, et les propriétaires de l'abonnement peuvent s'attribuer des rôles de données Azure RBAC sur le coffre.
    d:
      en: |-
        A Premium vault isn't a dedicated single-tenant HSM, and subscription owners can edit the access policies of the vault to grant themselves access.
      fr: |-
        Un coffre Premium n'est pas un HSM monolocataire dédié, et les propriétaires de l'abonnement peuvent modifier les stratégies d'accès du coffre pour s'accorder l'accès.
references:
  - title: What is Azure Key Vault Managed HSM?
    url: https://learn.microsoft.com/en-us/azure/key-vault/managed-hsm/overview
