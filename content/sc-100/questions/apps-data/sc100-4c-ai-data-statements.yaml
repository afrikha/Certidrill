id: sc100-4c-ai-data-statements
objective: "4.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is designing a retrieval-augmented generation (RAG) application in Microsoft Foundry. The application uses Azure AI Search to index documents that carry Microsoft Purview sensitivity labels, some of which apply encryption. The application calls the model with an API key.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. conçoit une application de génération augmentée de récupération (RAG) dans Microsoft Foundry. L'application utilise Azure AI Search pour indexer des documents qui portent des étiquettes de confidentialité Microsoft Purview, dont certaines appliquent un chiffrement. L'application appelle le modèle avec une clé API.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          For the application to return content from an encrypted document, the user needs the EXTRACT usage right in addition to VIEW.
        fr: |-
          Pour que l'application renvoie le contenu d'un document chiffré, l'utilisateur a besoin du droit d'utilisation EXTRACT en plus de VIEW.
    - id: s2
      text:
        en: |-
          Microsoft Purview DLP policies for Foundry can block the prompts that this application sends to the model.
        fr: |-
          Les stratégies DLP Microsoft Purview pour Foundry peuvent bloquer les invites que cette application envoie au modèle.
    - id: s3
      text:
        en: |-
          Prompts and responses of the application can appear in Microsoft Purview Audit after Purview data security is enabled for Foundry.
        fr: |-
          Les invites et les réponses de l'application peuvent apparaître dans Microsoft Purview Audit une fois la sécurité des données Purview activée pour Foundry.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      When a label applies encryption, users need both EXTRACT and VIEW for AI apps to return the data. Purview data security policies for Foundry apply only to calls that use a Microsoft Entra user-context token or that explicitly include user context; with an API key, interactions only appear in Audit and in the DSPM for AI activity explorer.
    fr: |-
      Quand une étiquette applique un chiffrement, les utilisateurs ont besoin d'EXTRACT et de VIEW pour que les applications d'IA renvoient les données. Les stratégies de sécurité des données Purview pour Foundry ne s'appliquent qu'aux appels qui utilisent un jeton Microsoft Entra en contexte utilisateur ou qui incluent explicitement le contexte utilisateur ; avec une clé API, les interactions apparaissent seulement dans Audit et dans l'explorateur d'activités de DSPM pour l'IA.
references:
  - title: Use Microsoft Purview to manage data security & compliance for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/purview/ai-azure-foundry
