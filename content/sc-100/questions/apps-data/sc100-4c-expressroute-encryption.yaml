id: sc100-4c-expressroute-encryption
objective: "4.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. connects its datacenter to Azure virtual networks by using ExpressRoute. Traffic between the datacenter and the virtual networks includes unencrypted legacy database replication.

    A new policy requires all traffic between the datacenter and Azure to be encrypted in transit, without modifying the legacy applications. Fabrikam can choose any ExpressRoute connectivity model.

    Which two solutions meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. relie son centre de données aux réseaux virtuels Azure par ExpressRoute. Le trafic entre le centre de données et les réseaux virtuels comprend une réplication de base de données héritée non chiffrée.

    Une nouvelle stratégie exige que tout le trafic entre le centre de données et Azure soit chiffré en transit, sans modifier les applications héritées. Fabrikam peut choisir n'importe quel modèle de connectivité ExpressRoute.

    Quelles sont les deux solutions qui répondent à l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "ExpressRoute FastPath on the virtual network gateway", fr: "ExpressRoute FastPath sur la passerelle de réseau virtuel" } }
    - { id: b, text: { en: "An IPsec site-to-site VPN over ExpressRoute private peering", fr: "Un VPN site à site IPsec sur le peering privé ExpressRoute" } }
    - { id: c, text: { en: "ExpressRoute Global Reach between two circuits", fr: "ExpressRoute Global Reach entre deux circuits" } }
    - { id: d, text: { en: "MACsec on ExpressRoute Direct ports", fr: "MACsec sur les ports ExpressRoute Direct" } }
    - { id: e, text: { en: "A route filter on Microsoft peering", fr: "Un filtre de routage sur le peering Microsoft" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      ExpressRoute is a private connection, but it isn't encrypted by default. MACsec encrypts traffic at layer 2 between your edge routers and the Microsoft edge routers on ExpressRoute Direct. An IPsec VPN tunnel over private peering encrypts traffic end to end at layer 3 between the datacenter and the Azure VPN gateway. Neither requires application changes.
    fr: |-
      ExpressRoute est une connexion privée, mais elle n'est pas chiffrée par défaut. MACsec chiffre le trafic au niveau de la couche 2 entre vos routeurs de périphérie et ceux de Microsoft sur ExpressRoute Direct. Un tunnel VPN IPsec sur le peering privé chiffre le trafic de bout en bout au niveau de la couche 3 entre le centre de données et la passerelle VPN Azure. Aucune des deux solutions n'exige de modifier les applications.
  options:
    a:
      en: |-
        FastPath improves data path performance by bypassing the gateway; it doesn't encrypt traffic.
      fr: |-
        FastPath améliore les performances du chemin de données en contournant la passerelle ; il ne chiffre pas le trafic.
    c:
      en: |-
        Global Reach links on-premises sites through two circuits; it doesn't encrypt traffic.
      fr: |-
        Global Reach relie des sites locaux par deux circuits ; il ne chiffre pas le trafic.
    e:
      en: |-
        A route filter selects which Microsoft service prefixes are advertised on Microsoft peering; it doesn't encrypt traffic to virtual networks.
      fr: |-
        Un filtre de routage choisit les préfixes de services Microsoft annoncés sur le peering Microsoft ; il ne chiffre pas le trafic vers les réseaux virtuels.
references:
  - title: About encryption for Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-encryption
