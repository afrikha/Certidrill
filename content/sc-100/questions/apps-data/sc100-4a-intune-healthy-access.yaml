id: sc100-4a-intune-healthy-access
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation enrolls all its corporate Windows 11 and macOS devices in Microsoft Intune. The Windows devices are Microsoft Entra hybrid joined. An endpoint security policy already turns on disk encryption on every device.

    As part of a Zero Trust initiative, access to Exchange Online and SharePoint Online must be allowed only from devices that are encrypted and that run a minimum operating system version. A device that falls out of these requirements must lose access automatically.

    Which two components should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation inscrit tous ses appareils d'entreprise Windows 11 et macOS dans Microsoft Intune. Les appareils Windows sont joints hybrides Microsoft Entra. Une stratégie de sécurité des points de terminaison active déjà le chiffrement de disque sur chaque appareil.

    Dans le cadre d'une initiative Confiance Zéro, l'accès à Exchange Online et à SharePoint Online ne doit être autorisé que depuis des appareils chiffrés qui exécutent une version minimale du système d'exploitation. Un appareil qui cesse de respecter ces exigences doit perdre l'accès automatiquement.

    Quels sont les deux composants à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Conditional Access policy with the grant control Require Microsoft Entra hybrid joined device", fr: "Une stratégie d'accès conditionnel avec le contrôle d'octroi Require Microsoft Entra hybrid joined device" } }
    - { id: b, text: { en: "Intune compliance policies for Windows and macOS that check encryption and the OS version", fr: "Des stratégies de conformité Intune pour Windows et macOS qui vérifient le chiffrement et la version du système d'exploitation" } }
    - { id: c, text: { en: "Intune app protection policies for the Microsoft 365 apps", fr: "Des stratégies de protection des applications Intune pour les applications Microsoft 365" } }
    - { id: d, text: { en: "A Conditional Access policy with the grant control Require device to be marked as compliant", fr: "Une stratégie d'accès conditionnel avec le contrôle d'octroi Require device to be marked as compliant" } }
    - { id: e, text: { en: "Intune security baselines for Windows assigned to all devices", fr: "Des bases de référence de sécurité Intune pour Windows attribuées à tous les appareils" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Compliance policies evaluate each enrolled device against rules such as encryption and minimum OS version and report its compliance state to Microsoft Entra ID. A Conditional Access policy that requires a compliant device then grants access only while the device meets those rules, and blocks it as soon as it becomes noncompliant.
    fr: |-
      Les stratégies de conformité évaluent chaque appareil inscrit au regard de règles comme le chiffrement et la version minimale du système d'exploitation, et transmettent son état de conformité à Microsoft Entra ID. Une stratégie d'accès conditionnel qui exige un appareil conforme n'accorde alors l'accès que tant que l'appareil respecte ces règles, et le bloque dès qu'il devient non conforme.
  options:
    a:
      en: |-
        Hybrid join proves that the device belongs to the domain, not that it's encrypted or up to date, and macOS devices can't be hybrid joined.
      fr: |-
        La jonction hybride prouve que l'appareil appartient au domaine, pas qu'il est chiffré ou à jour, et les appareils macOS ne peuvent pas être joints hybrides.
    c:
      en: |-
        App protection policies protect data inside apps; they don't evaluate disk encryption or the OS version of the device.
      fr: |-
        Les stratégies de protection des applications protègent les données dans les applications ; elles n'évaluent ni le chiffrement du disque ni la version du système d'exploitation de l'appareil.
    e:
      en: |-
        Security baselines configure recommended settings; they don't report a compliance state that Conditional Access can evaluate, and they don't cover macOS.
      fr: |-
        Les bases de référence de sécurité configurent des paramètres recommandés ; elles ne transmettent pas d'état de conformité évaluable par l'accès conditionnel et ne couvrent pas macOS.
references:
  - title: Device compliance policies in Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/device-compliance-get-started
