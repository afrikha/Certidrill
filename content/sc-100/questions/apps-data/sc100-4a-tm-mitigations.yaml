id: sc100-4a-tm-mitigations
objective: "4.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. built a threat model for its claims processing application, which runs on Azure App Service and stores data in Azure SQL Database. The model lists three threats that must be mitigated before release:

    - Repudiation: claims adjusters could deny that they approved a payment, and the application can't prove otherwise.
    - Information disclosure: the database connection string, with its password, is stored in the application settings and readable by every developer.
    - Denial of service: a partner floods the claims API with requests and makes it unavailable to other partners.

    Which mitigation should you recommend for each threat? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. a construit un modèle de menaces pour son application de traitement des sinistres, qui s'exécute sur Azure App Service et stocke ses données dans Azure SQL Database. Le modèle liste trois menaces à atténuer avant la mise en production :

    - Répudiation : des gestionnaires de sinistres pourraient nier avoir approuvé un paiement, et l'application ne peut pas prouver le contraire.
    - Divulgation d'informations : la chaîne de connexion à la base de données, avec son mot de passe, est stockée dans les paramètres de l'application et lisible par tous les développeurs.
    - Déni de service : un partenaire inonde l'API des sinistres de requêtes et la rend indisponible pour les autres partenaires.

    Quelle atténuation devez-vous recommander pour chaque menace ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Repudiation: [[repud]]

      Information disclosure: [[disclose]]

      Denial of service: [[dos]]
    fr: |
      Répudiation : [[repud]]

      Divulgation d'informations : [[disclose]]

      Déni de service : [[dos]]
  slots:
    - id: repud
      options:
        - { id: audit, text: { en: "Log every approval with the adjuster's identity to tamper-proof storage", fr: "Journaliser chaque approbation avec l'identité du gestionnaire dans un stockage inviolable" } }
        - { id: tls, text: { en: "Require TLS 1.2 or later for all connections", fr: "Exiger TLS 1.2 ou version ultérieure pour toutes les connexions" } }
        - { id: tde, text: { en: "Turn on transparent data encryption for the database", fr: "Activer le chiffrement transparent des données pour la base de données" } }
    - id: disclose
      options:
        - { id: mi, text: { en: "Use a managed identity with Microsoft Entra authentication to Azure SQL", fr: "Utiliser une identité managée avec l'authentification Microsoft Entra auprès d'Azure SQL" } }
        - { id: rotate, text: { en: "Rotate the SQL password every 90 days", fr: "Changer le mot de passe SQL tous les 90 jours" } }
        - { id: ddm, text: { en: "Apply dynamic data masking to the claims tables", fr: "Appliquer le masquage dynamique des données aux tables des sinistres" } }
    - id: dos
      options:
        - { id: throttle, text: { en: "Publish the API through API Management with a rate limit per partner", fr: "Publier l'API par API Management avec une limite de débit par partenaire" } }
        - { id: pe, text: { en: "Connect the app to the database through a private endpoint", fr: "Connecter l'application à la base de données par un point de terminaison privé" } }
        - { id: mfa, text: { en: "Require MFA for partner administrators", fr: "Exiger la MFA pour les administrateurs des partenaires" } }
answer:
  values: { repud: audit, disclose: mi, dos: throttle }
explanation:
  correct:
    en: |-
      Non-repudiation requires proof of who did what, so approvals are logged with the user's identity in storage that can't be altered. A managed identity removes the stored password altogether: the app gets Microsoft Entra tokens for Azure SQL and no developer can read a credential. Rate limiting per partner in API Management keeps one caller from exhausting the API for the others.
    fr: |-
      La non-répudiation exige une preuve de qui a fait quoi : les approbations sont journalisées avec l'identité de l'utilisateur dans un stockage non modifiable. Une identité managée supprime complètement le mot de passe stocké : l'application obtient des jetons Microsoft Entra pour Azure SQL et aucun développeur ne peut lire d'informations d'identification. La limitation du débit par partenaire dans API Management empêche un appelant d'épuiser l'API au détriment des autres.
  options:
    tls:
      en: |-
        TLS protects data in transit against tampering and disclosure; it doesn't prove who approved a payment.
      fr: |-
        TLS protège les données en transit contre la falsification et la divulgation ; il ne prouve pas qui a approuvé un paiement.
    rotate:
      en: |-
        Rotation shortens the life of the password, but developers can still read the current one.
      fr: |-
        La rotation raccourcit la durée de vie du mot de passe, mais les développeurs peuvent toujours lire le mot de passe en cours.
    pe:
      en: |-
        A private endpoint removes public exposure of the database; it doesn't limit the requests a partner sends to the API.
      fr: |-
        Un point de terminaison privé supprime l'exposition publique de la base de données ; il ne limite pas les requêtes qu'un partenaire envoie à l'API.
references:
  - title: Threats - Microsoft Threat Modeling Tool
    url: https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats
  - title: Architecture strategies for securing a development lifecycle
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/threat-model
