id: sc100-4c-keyless-rag
objective: "4.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders is building a RAG application that runs in Azure Container Apps. An Azure AI Search indexer reads product manuals from a storage account named stmanuals, and the application queries the search index.

    The design must meet the following requirements:

    - No API keys, account keys or SAS tokens can be used anywhere in the data path.
    - Each component must have only the data-plane permissions it needs.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders crée une application RAG qui s'exécute dans Azure Container Apps. Un indexeur Azure AI Search lit des manuels produits dans un compte de stockage nommé stmanuals, et l'application interroge l'index de recherche.

    La conception doit répondre aux exigences suivantes :

    - Aucune clé API, clé de compte ni jeton SAS ne peut être utilisé dans le chemin des données.
    - Chaque composant ne doit disposer que des autorisations de plan de données dont il a besoin.

    Quelles sont les deux actions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the search admin API key in Azure Key Vault and let the application read it with its managed identity", fr: "Stocker la clé API d'administration de la recherche dans Azure Key Vault et laisser l'application la lire avec son identité managée" } }
    - { id: b, text: { en: "Set the search service to role-based access control only and grant the application's managed identity Search Index Data Reader", fr: "Configurer le service de recherche sur le contrôle d'accès en fonction du rôle uniquement et accorder Search Index Data Reader à l'identité managée de l'application" } }
    - { id: c, text: { en: "Disallow Shared Key on stmanuals and grant the search service's managed identity Storage Blob Data Reader", fr: "Interdire Shared Key sur stmanuals et accorder Storage Blob Data Reader à l'identité managée du service de recherche" } }
    - { id: d, text: { en: "Grant the application's managed identity Search Service Contributor on the search service", fr: "Accorder Search Service Contributor sur le service de recherche à l'identité managée de l'application" } }
    - { id: e, text: { en: "Configure the indexer data source with an account SAS stored in Azure Key Vault", fr: "Configurer la source de données de l'indexeur avec une SAS de compte stockée dans Azure Key Vault" } }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: |-
      In role-based access control only mode, the search service refuses data requests that pass an API key, and Search Index Data Reader lets the application query indexes without changing them. Disallowing Shared Key on the storage account rejects account keys, account SAS and service SAS, while the search service's managed identity reads blobs with Storage Blob Data Reader.
    fr: |-
      En mode contrôle d'accès en fonction du rôle uniquement, le service de recherche refuse les demandes de données qui transmettent une clé API, et Search Index Data Reader permet à l'application d'interroger les index sans les modifier. Interdire Shared Key sur le compte de stockage rejette les clés de compte, les SAS de compte et les SAS de service, tandis que l'identité managée du service de recherche lit les objets blob avec Storage Blob Data Reader.
  options:
    a:
      en: |-
        Keeping the admin key in Key Vault still authorizes data requests with an API key, and an admin key grants full rights on the service.
      fr: |-
        Conserver la clé d'administration dans Key Vault autorise toujours les demandes de données par clé API, et une clé d'administration accorde tous les droits sur le service.
    d:
      en: |-
        Search Service Contributor manages the service and its objects, which is more than querying requires.
      fr: |-
        Search Service Contributor gère le service et ses objets, ce qui dépasse ce qu'exige l'interrogation.
    e:
      en: |-
        An account SAS is signed with the account key, which the requirements forbid.
      fr: |-
        Une SAS de compte est signée avec la clé de compte, ce que les exigences interdisent.
references:
  - title: Enable or disable role-based access control in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-security-enable-roles
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
