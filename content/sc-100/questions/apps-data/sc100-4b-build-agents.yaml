id: sc100-4b-build-agents
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation builds and deploys its applications with Azure Pipelines. All pipelines run on two self-hosted build agents. The agent VMs persist between runs, are connected to the same virtual network as the production workloads, and use a service principal with a client secret that has the Contributor role on the development, test and production subscriptions.

    You are designing the security of the build and release process. The solution must meet the following requirements:

    - The build environment must not keep any state between runs.
    - A compromise of the development or test stage must not give access to production.
    - No long-lived secret may be used to authenticate to Azure.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Adatum Corporation génère et déploie ses applications avec Azure Pipelines. Tous les pipelines s'exécutent sur deux agents de build auto-hébergés. Les machines virtuelles des agents persistent entre les exécutions, sont connectées au même réseau virtuel que les charges de travail de production et utilisent un principal de service avec un secret client qui a le rôle Contributor sur les abonnements de développement, de test et de production.

    Vous concevez la sécurité du processus de build et de mise en production. La solution doit respecter les exigences suivantes :

    - L'environnement de build ne doit conserver aucun état entre les exécutions.
    - La compromission de l'étape de développement ou de test ne doit pas donner accès à la production.
    - Aucun secret de longue durée ne doit servir à s'authentifier auprès d'Azure.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep the self-hosted agents in a dedicated subnet protected by an NSG, and move the client secret to a variable group linked to Azure Key Vault.", fr: "Conserver les agents auto-hébergés dans un sous-réseau dédié protégé par un NSG, et déplacer le secret client vers un groupe de variables lié à Azure Key Vault." } }
    - { id: b, text: { en: "Use Microsoft-hosted agents, and create one workload identity federation service connection that has Contributor on the three subscriptions.", fr: "Utiliser des agents hébergés par Microsoft, et créer une seule connexion de service à fédération d'identité de charge de travail qui a le rôle Contributor sur les trois abonnements." } }
    - { id: c, text: { en: "Replace the agents with a Microsoft Dev Box for each developer, and deploy to each environment from the dev boxes by using the developers' accounts.", fr: "Remplacer les agents par un Microsoft Dev Box pour chaque développeur, et déployer dans chaque environnement depuis les Dev Box avec les comptes des développeurs." } }
    - { id: d, text: { en: "Use Microsoft-hosted agents, and create a workload identity federation service connection per environment, each scoped to its own subscription, with approvals on production.", fr: "Utiliser des agents hébergés par Microsoft, et créer une connexion de service à fédération d'identité de charge de travail par environnement, chacune limitée à son abonnement, avec des approbations sur la production." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft-hosted agents give each run a clean environment and remove the agent VMs to maintain. One workload identity federation service connection per environment, each with a role on its own subscription only, segments the pipeline stages so that a compromised test stage can't reach production, and federation removes the client secret. Approvals on the production environment add a human check before production deployments.
    fr: |
      Les agents hébergés par Microsoft fournissent un environnement propre à chaque exécution et suppriment les machines virtuelles d'agents à maintenir. Une connexion de service à fédération d'identité de charge de travail par environnement, chacune avec un rôle sur son seul abonnement, segmente les étapes du pipeline : une étape de test compromise ne peut pas atteindre la production, et la fédération supprime le secret client. Les approbations sur l'environnement de production ajoutent un contrôle humain avant les déploiements en production.
  options:
    a:
      en: The agents still persist between runs and the client secret is still a long-lived secret, even when it's stored in Key Vault.
      fr: Les agents persistent toujours entre les exécutions et le secret client reste un secret de longue durée, même stocké dans Key Vault.
    b:
      en: A single identity with Contributor on all subscriptions lets a compromised development or test stage deploy to production.
      fr: Une identité unique avec le rôle Contributor sur tous les abonnements permet à une étape de développement ou de test compromise de déployer en production.
    c:
      en: Deploying from developer workstations with developer accounts gives development environments direct access to production and removes the pipeline controls.
      fr: Déployer depuis des postes de développeurs avec des comptes de développeurs donne aux environnements de développement un accès direct à la production et supprime les contrôles du pipeline.
references:
  - title: Architecture strategies for securing a development lifecycle
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/secure-development-lifecycle
  - title: Workload identity federation concepts
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
