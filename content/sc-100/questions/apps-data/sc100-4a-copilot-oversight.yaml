id: sc100-4a-copilot-oversight
objective: "4.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has Microsoft 365 E5 and Microsoft 365 Copilot licenses for all employees. The compliance officer sets three requirements for Copilot interactions:

    - Detect employees who attempt prompt injection attacks or try to reach protected materials through Copilot, and correlate this with other risky activities of the same users.
    - Detect harassment and threats that employees write in Copilot prompts.
    - Delete Copilot prompts and responses automatically after two years.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose de licences Microsoft 365 E5 et Microsoft 365 Copilot pour tous ses employés. Le responsable de la conformité fixe trois exigences pour les interactions avec Copilot :

    - Détecter les employés qui tentent des attaques par injection d'invite ou essaient d'atteindre des contenus protégés par Copilot, et mettre ces faits en corrélation avec les autres activités à risque des mêmes utilisateurs.
    - Détecter le harcèlement et les menaces que les employés écrivent dans les invites Copilot.
    - Supprimer automatiquement les invites et les réponses Copilot au bout de deux ans.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Prompt injection and access to protected materials: [[risky]]

      Harassment and threats in prompts: [[conduct]]

      Deletion after two years: [[lifecycle]]
    fr: |
      Injection d'invite et accès aux contenus protégés : [[risky]]

      Harcèlement et menaces dans les invites : [[conduct]]

      Suppression au bout de deux ans : [[lifecycle]]
  slots:
    - id: risky
      options:
        - { id: irm, text: { en: "An Insider Risk Management policy from the Risky AI usage template", fr: "Une stratégie de gestion des risques internes créée à partir du modèle Risky AI usage" } }
        - { id: dlp, text: { en: "A DLP policy for the Copilot location", fr: "Une stratégie DLP pour l'emplacement Copilot" } }
        - { id: audit, text: { en: "An Audit search of Copilot interaction events", fr: "Une recherche d'audit sur les événements d'interaction Copilot" } }
    - id: conduct
      options:
        - { id: cc, text: { en: "A Communication Compliance policy", fr: "Une stratégie de conformité des communications" } }
        - { id: irm, text: { en: "An Insider Risk Management policy", fr: "Une stratégie de gestion des risques internes" } }
        - { id: ib, text: { en: "An information barriers policy", fr: "Une stratégie d'obstacles aux informations" } }
    - id: lifecycle
      options:
        - { id: hold, text: { en: "An eDiscovery hold on all mailboxes", fr: "Une conservation eDiscovery sur toutes les boîtes aux lettres" } }
        - { id: auditret, text: { en: "An audit log retention policy", fr: "Une stratégie de rétention des journaux d'audit" } }
        - { id: retention, text: { en: "A retention policy for Copilot interactions", fr: "Une stratégie de rétention pour les interactions Copilot" } }
answer:
  values: { risky: irm, conduct: cc, lifecycle: retention }
explanation:
  correct:
    en: |-
      The Risky AI usage policy template of Insider Risk Management detects risky usage such as prompt injection attacks and access to protected materials, alongside the other insider risk signals of the user. Communication Compliance detects regulatory and business conduct violations, such as harassment and threats, in prompts and responses. Retention policies for AI apps can retain or delete prompts and responses automatically.
    fr: |-
      Le modèle de stratégie Risky AI usage de la gestion des risques internes détecte les usages à risque, comme les attaques par injection d'invite et l'accès à des contenus protégés, avec les autres signaux de risque interne de l'utilisateur. La conformité des communications détecte les violations réglementaires et de conduite professionnelle, comme le harcèlement et les menaces, dans les invites et les réponses. Les stratégies de rétention pour les applications d'IA peuvent conserver ou supprimer automatiquement les invites et les réponses.
  options:
    dlp:
      en: |-
        DLP for the Copilot location blocks processing based on labels or sensitive information types; it doesn't detect prompt injection or correlate user risk.
      fr: |-
        La DLP pour l'emplacement Copilot bloque le traitement selon des étiquettes ou des types d'informations sensibles ; elle ne détecte pas l'injection d'invite et ne met pas le risque utilisateur en corrélation.
    audit:
      en: |-
        Audit records interactions for investigation; it doesn't raise risk-scored alerts.
      fr: |-
        L'audit enregistre les interactions pour les investigations ; il ne génère pas d'alertes évaluées selon le risque.
    hold:
      en: |-
        An eDiscovery hold preserves content for a case; it never deletes it.
      fr: |-
        Une conservation eDiscovery préserve le contenu pour un cas ; elle ne le supprime jamais.
    auditret:
      en: |-
        An audit log retention policy governs audit records, not the prompts and responses stored in mailboxes.
      fr: |-
        Une stratégie de rétention des journaux d'audit régit les enregistrements d'audit, pas les invites et les réponses stockées dans les boîtes aux lettres.
references:
  - title: Microsoft Purview data security and compliance protections for Microsoft 365 Copilot and other generative AI apps
    url: https://learn.microsoft.com/en-us/purview/ai-microsoft-purview
