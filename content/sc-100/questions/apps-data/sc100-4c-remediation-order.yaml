id: sc100-4c-remediation-order
objective: "4.3.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Defender CSPM with sensitive data discovery. A review of the Azure data estate returns the findings shown in the following table.

    The security team can remediate one data store at a time. Remediation must follow Microsoft's guidance to prioritize by data sensitivity first, and then by exposure.

    Answer each prompt by selecting the data store.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Defender CSPM avec la découverte des données sensibles. Un examen du patrimoine de données Azure renvoie les constats présentés dans le tableau suivant.

    L'équipe de sécurité peut corriger un seul magasin de données à la fois. La correction doit suivre les recommandations de Microsoft : hiérarchiser d'abord selon la sensibilité des données, puis selon leur exposition.

    Répondez à chaque consigne en sélectionnant le magasin de données.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The data store to remediate first", fr: "Le magasin de données à corriger en premier" }
    - id: p2
      text: { en: "The data store to remediate last", fr: "Le magasin de données à corriger en dernier" }
  grid:
    header: [{ en: "Data store", fr: "Magasin de données" }, { en: "Sensitive data found", fr: "Données sensibles trouvées" }, { en: "Network exposure", fr: "Exposition réseau" }, { en: "Authorization", fr: "Autorisation" }]
    rows:
      - [{ text: stmarketing, area: st1 }, { text: { en: "None", fr: "Aucune" } }, { text: { en: "Public endpoint, all networks", fr: "Point de terminaison public, tous les réseaux" } }, { text: { en: "Account keys allowed", fr: "Clés de compte autorisées" } }]
      - [{ text: sqlpayroll, area: sql1 }, { text: { en: "Bank account numbers", fr: "Numéros de compte bancaire" } }, { text: { en: "Private endpoint only", fr: "Point de terminaison privé uniquement" } }, { text: { en: "Microsoft Entra-only", fr: "Microsoft Entra uniquement" } }]
      - [{ text: stclaims, area: st2 }, { text: { en: "Passport numbers", fr: "Numéros de passeport" } }, { text: { en: "Public endpoint, all networks", fr: "Point de terminaison public, tous les réseaux" } }, { text: { en: "Account keys allowed", fr: "Clés de compte autorisées" } }]
      - [{ text: cosmosorders, area: cos1 }, { text: { en: "None", fr: "Aucune" } }, { text: { en: "Private endpoint only", fr: "Point de terminaison privé uniquement" } }, { text: { en: "Local authentication disabled", fr: "Authentification locale désactivée" } }]
answer:
  values: { p1: st2, p2: cos1 }
explanation:
  correct:
    en: |-
      stclaims holds sensitive data and is reachable from every network with account keys, so it combines the highest sensitivity with the highest exposure. cosmosorders holds no sensitive data, accepts no keys and is reachable only through a private endpoint, so it comes last. Defender CSPM uses sensitive data discovery precisely to separate critical data risks from less risky ones.
    fr: |-
      stclaims contient des données sensibles et est accessible depuis tous les réseaux avec les clés de compte : il cumule la sensibilité et l'exposition les plus élevées. cosmosorders ne contient aucune donnée sensible, n'accepte aucune clé et n'est accessible que par un point de terminaison privé : il passe en dernier. Defender CSPM utilise justement la découverte des données sensibles pour distinguer les risques critiques des risques moindres.
  options:
    st1:
      en: |-
        stmarketing is exposed, but it holds no sensitive data, so it ranks after the stores that hold sensitive data.
      fr: |-
        stmarketing est exposé, mais il ne contient aucune donnée sensible : il passe après les magasins qui en contiennent.
    sql1:
      en: |-
        sqlpayroll holds sensitive data, but it is already private and keyless, so it ranks after stclaims.
      fr: |-
        sqlpayroll contient des données sensibles, mais il est déjà privé et sans clé : il passe après stclaims.
references:
  - title: Overview - About data security posture management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-data-security-posture
