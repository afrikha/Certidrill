id: sc100-4b-workload-risk
objective: "4.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has 300 single-tenant app registrations that internal automation uses to call Azure and Microsoft Graph. Last quarter, an attacker used a leaked client secret of one of them from an unknown network. Woodgrove has Workload Identities Premium licenses.

    You need to recommend a solution that meets the following requirements:

    - Detect service principals that show risk signals, such as leaked credentials.
    - Automatically block token requests from the service principals whose risk level is high.
    - Minimize administrative effort.

    Which two components should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose de 300 inscriptions d'applications monolocataires que l'automatisation interne utilise pour appeler Azure et Microsoft Graph. Le trimestre dernier, un attaquant a utilisé depuis un réseau inconnu le secret client divulgué de l'une d'elles. Woodgrove dispose de licences Workload Identities Premium.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - Détecter les principaux de service qui présentent des signaux de risque, comme des informations d'identification divulguées.
    - Bloquer automatiquement les demandes de jeton des principaux de service dont le niveau de risque est élevé.
    - Réduire au minimum l'effort d'administration.

    Quels sont les deux composants à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Access reviews of the service principals assigned to privileged roles", fr: "Des révisions d'accès des principaux de service affectés à des rôles privilégiés" } }
    - { id: b, text: { en: "Microsoft Entra ID Protection for workload identities", fr: "Microsoft Entra ID Protection pour les identités de charge de travail" } }
    - { id: c, text: { en: "Eligible role assignments in Privileged Identity Management for the service principals", fr: "Des attributions de rôle éligibles dans Privileged Identity Management pour les principaux de service" } }
    - { id: d, text: { en: "A Conditional Access policy that requires multifactor authentication for the service principals", fr: "Une stratégie d'accès conditionnel qui exige l'authentification multifacteur pour les principaux de service" } }
    - { id: e, text: { en: "A Conditional Access policy for workload identities with the service principal risk condition", fr: "Une stratégie d'accès conditionnel pour les identités de charge de travail avec la condition de risque du principal de service" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      ID Protection detects risk for workload identities, such as leaked credentials, and assigns a risk level to the service principal. A Conditional Access policy for workload identities that uses the service principal risk condition with the Block grant control blocks token requests from high-risk single-tenant service principals automatically.
    fr: |
      ID Protection détecte les risques des identités de charge de travail, comme des informations d'identification divulguées, et attribue un niveau de risque au principal de service. Une stratégie d'accès conditionnel pour les identités de charge de travail qui utilise la condition de risque du principal de service avec le contrôle d'octroi Block bloque automatiquement les demandes de jeton des principaux de service monolocataires à risque élevé.
  options:
    a:
      en: Access reviews periodically confirm whether assignments are still needed; they don't detect risk or block a compromised service principal.
      fr: Les révisions d'accès confirment périodiquement si des attributions sont encore nécessaires ; elles ne détectent pas les risques et ne bloquent pas un principal de service compromis.
    c:
      en: Eligible assignments limit standing privilege, but they don't detect leaked credentials or block token requests based on risk.
      fr: Les attributions éligibles limitent les privilèges permanents, mais elles ne détectent pas les informations d'identification divulguées et ne bloquent pas les demandes de jeton en fonction du risque.
    d:
      en: Block is the only grant control for workload identities; a service principal can't perform multifactor authentication.
      fr: Block est le seul contrôle d'octroi pour les identités de charge de travail ; un principal de service ne peut pas effectuer d'authentification multifacteur.
references:
  - title: Conditional Access for workload identities
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/workload-identity
