id: sc100-4c-synapse-exfiltration
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an existing Azure Synapse Analytics workspace named synrisk that was created without a managed virtual network. Analysts run Spark notebooks and pipelines that read customer data.

    The security team requires that the workspace can send data only to resources in Woodgrove's own Microsoft Entra tenant. Outbound connections to storage accounts in any other tenant must be blocked, even for users with permissions in the workspace.

    What should you recommend?
  fr: |
    Woodgrove Bank dispose d'un espace de travail Azure Synapse Analytics existant nommé synrisk, créé sans réseau virtuel managé. Les analystes exécutent des notebooks Spark et des pipelines qui lisent des données clients.

    L'équipe de sécurité exige que l'espace de travail ne puisse envoyer des données qu'à des ressources du propre locataire Microsoft Entra de Woodgrove. Les connexions sortantes vers des comptes de stockage de tout autre locataire doivent être bloquées, même pour les utilisateurs disposant d'autorisations dans l'espace de travail.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create a workspace with a managed virtual network and data exfiltration protection, then migrate", fr: "Créer un espace de travail avec un réseau virtuel managé et la protection contre l'exfiltration de données, puis migrer" } }
    - { id: b, text: { en: "Enable a managed virtual network and data exfiltration protection on synrisk", fr: "Activer un réseau virtuel managé et la protection contre l'exfiltration de données sur synrisk" } }
    - { id: c, text: { en: "Add IP firewall rules to synrisk that allow only the public IP ranges of Woodgrove's offices", fr: "Ajouter à synrisk des règles de pare-feu IP qui n'autorisent que les plages IP publiques des bureaux de Woodgrove" } }
    - { id: d, text: { en: "Enable Defender for Azure SQL on the dedicated SQL pools of synrisk and review its alerts", fr: "Activer Defender for Azure SQL sur les pools SQL dédiés de synrisk et examiner ses alertes" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Data exfiltration protection restricts outbound traffic from a workspace's managed virtual network to managed private endpoints in approved Microsoft Entra tenants. Both the managed virtual network and exfiltration protection are chosen when the workspace is created and can't be added later, so a new workspace is required.
    fr: |-
      La protection contre l'exfiltration de données limite le trafic sortant du réseau virtuel managé d'un espace de travail aux points de terminaison privés managés situés dans des locataires Microsoft Entra approuvés. Le réseau virtuel managé et la protection contre l'exfiltration se choisissent à la création de l'espace de travail et ne peuvent pas être ajoutés ensuite : un nouvel espace de travail est nécessaire.
  options:
    b:
      en: |-
        The managed virtual network and data exfiltration protection can't be changed after the workspace is created.
      fr: |-
        Le réseau virtuel managé et la protection contre l'exfiltration de données ne peuvent pas être modifiés après la création de l'espace de travail.
    c:
      en: |-
        IP firewall rules control inbound connections to the workspace endpoints, not outbound connections from Spark or pipelines.
      fr: |-
        Les règles de pare-feu IP contrôlent les connexions entrantes vers les points de terminaison de l'espace de travail, pas les connexions sortantes de Spark ou des pipelines.
    d:
      en: |-
        Defender for Azure SQL detects threats on dedicated SQL pools; it doesn't block outbound data movement.
      fr: |-
        Defender for Azure SQL détecte les menaces sur les pools SQL dédiés ; il ne bloque pas les déplacements de données sortants.
references:
  - title: Data exfiltration protection for Azure Synapse Analytics workspaces
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/security/workspace-data-exfiltration-protection
