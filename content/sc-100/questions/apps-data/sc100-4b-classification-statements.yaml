id: sc100-4b-classification-statements
objective: "4.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is evaluating Microsoft Purview and Microsoft Defender for Cloud for data discovery and classification. Adatum's legal team is concerned about sharing customer records with Microsoft, and many of its documents are encrypted.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation évalue Microsoft Purview et Microsoft Defender for Cloud pour la découverte et la classification des données. L'équipe juridique d'Adatum s'inquiète du partage des enregistrements clients avec Microsoft, et beaucoup de ses documents sont chiffrés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The values of an exact data match source table are hashed with a salt before upload, so Microsoft doesn't see the plaintext data.
        fr: "Les valeurs d'une table source de correspondance exacte des données sont hachées avec un sel avant le chargement : Microsoft ne voit pas les données en clair."
    - id: s2
      text:
        en: Trainable classifiers can classify encrypted documents.
        fr: Les classifieurs entraînables peuvent classifier des documents chiffrés.
    - id: s3
      text:
        en: Sensitive data discovery in Defender for Cloud can use custom sensitive information types defined in Microsoft Purview.
        fr: La découverte des données sensibles de Defender for Cloud peut utiliser des types d'informations sensibles personnalisés définis dans Microsoft Purview.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With exact data match, the sensitive values are hashed with a salt before they are uploaded, so Microsoft never sees the plaintext records. Trainable classifiers only work with items that aren't encrypted. The Microsoft Purview classification engine powers sensitive data discovery in Defender for Cloud, which can import the custom sensitive information types and labels defined in Purview.
    fr: |
      Avec la correspondance exacte des données, les valeurs sensibles sont hachées avec un sel avant leur chargement : Microsoft ne voit jamais les enregistrements en clair. Les classifieurs entraînables ne fonctionnent qu'avec des éléments non chiffrés. Le moteur de classification de Microsoft Purview alimente la découverte des données sensibles de Defender for Cloud, qui peut importer les types d'informations sensibles personnalisés et les étiquettes définis dans Purview.
references:
  - title: Learn about exact data match based sensitive information types
    url: https://learn.microsoft.com/en-us/purview/sit-learn-about-exact-data-match-based-sits
  - title: About data security posture management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-data-security-posture
