id: sc100-4b-shared-identity
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. runs a batch processing application on six Azure virtual machines. The virtual machines are deleted and recreated from an image every week. All of them must read secrets from the same Azure key vault.

    You need to recommend an identity solution for the application. The permissions on the key vault must be granted before the virtual machines are created and must stay the same when the virtual machines are recreated. The solution must minimize administrative effort and must not use any credential that you manage.

    What should you recommend?
  fr: |
    Litware, Inc. exécute une application de traitement par lots sur six machines virtuelles Azure. Les machines virtuelles sont supprimées et recréées à partir d'une image chaque semaine. Toutes doivent lire des secrets dans le même coffre de clés Azure.

    Vous devez recommander une solution d'identité pour l'application. Les autorisations sur le coffre de clés doivent être accordées avant la création des machines virtuelles et rester identiques lorsque les machines virtuelles sont recréées. La solution doit réduire au minimum l'effort d'administration et ne doit utiliser aucune information d'identification que vous gérez.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A system-assigned managed identity on each virtual machine", fr: "Une identité managée affectée par le système sur chaque machine virtuelle" } }
    - { id: b, text: { en: "A user-assigned managed identity assigned to the six virtual machines", fr: "Une identité managée affectée par l'utilisateur attribuée aux six machines virtuelles" } }
    - { id: c, text: { en: "An app registration with a certificate installed in the image", fr: "Une inscription d'application avec un certificat installé dans l'image" } }
    - { id: d, text: { en: "A service principal for each virtual machine with a client secret", fr: "Un principal de service par machine virtuelle avec un secret client" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A user-assigned managed identity is a standalone Azure resource with its own lifecycle. It can be granted access to the key vault before any virtual machine exists, assigned to several virtual machines, and it keeps its permissions when the virtual machines are recycled. Azure manages its credentials.
    fr: |
      Une identité managée affectée par l'utilisateur est une ressource Azure autonome avec son propre cycle de vie. Elle peut recevoir l'accès au coffre de clés avant l'existence de toute machine virtuelle, être attribuée à plusieurs machines virtuelles et conserver ses autorisations lorsque les machines virtuelles sont recyclées. Azure gère ses informations d'identification.
  options:
    a:
      en: A system-assigned identity is created and deleted with its virtual machine, so permissions can't be granted in advance and must be granted again every week.
      fr: "Une identité affectée par le système est créée et supprimée avec sa machine virtuelle : les autorisations ne peuvent pas être accordées à l'avance et doivent être accordées de nouveau chaque semaine."
    c:
      en: A certificate in the image is a credential that you must protect and renew, and anyone who obtains the image obtains the credential.
      fr: Un certificat dans l'image est une information d'identification que vous devez protéger et renouveler, et quiconque obtient l'image obtient l'information d'identification.
    d:
      en: Client secrets are credentials that you must store and rotate, and one service principal per virtual machine multiplies them.
      fr: Les secrets clients sont des informations d'identification que vous devez stocker et faire tourner, et un principal de service par machine virtuelle les multiplie.
references:
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
