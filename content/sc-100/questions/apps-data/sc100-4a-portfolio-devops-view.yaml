id: sc100-4a-portfolio-devops-view
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. develops its applications in three platforms: Azure DevOps for the finance apps, GitHub Enterprise Cloud for the customer apps, and GitLab for an acquired subsidiary. Fabrikam already uses Microsoft Defender for Cloud for its Azure subscriptions, and code scanning tools are enabled in each platform.

    The CISO wants the central security team to evaluate the security posture of the whole application portfolio from one place, including code vulnerabilities, exposed secrets, open-source dependency vulnerabilities and infrastructure as code (IaC) misconfigurations from all three platforms.

    What should you recommend?
  fr: |
    Fabrikam, Inc. développe ses applications sur trois plateformes : Azure DevOps pour les applications financières, GitHub Enterprise Cloud pour les applications clients et GitLab pour une filiale rachetée. Fabrikam utilise déjà Microsoft Defender for Cloud pour ses abonnements Azure, et des outils d'analyse du code sont activés sur chaque plateforme.

    Le RSSI souhaite que l'équipe de sécurité centrale évalue depuis un point unique la posture de sécurité de tout le portefeuille d'applications, y compris les vulnérabilités du code, les secrets exposés, les vulnérabilités des dépendances open source et les mauvaises configurations de l'infrastructure as code (IaC) des trois plateformes.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable GitHub Advanced Security on every repository and review its security overview.", fr: "Activer GitHub Advanced Security sur chaque dépôt et consulter sa vue d'ensemble de la sécurité." } }
    - { id: b, text: { en: "Deploy Microsoft Defender External Attack Surface Management for the three platforms.", fr: "Déployer Microsoft Defender External Attack Surface Management pour les trois plateformes." } }
    - { id: c, text: { en: "Connect the three platforms to Defender for Cloud by using DevOps connectors.", fr: "Connecter les trois plateformes à Defender for Cloud au moyen de connecteurs DevOps." } }
    - { id: d, text: { en: "Assign an Azure Policy initiative that audits the repositories of the three platforms.", fr: "Attribuer une initiative Azure Policy qui audite les dépôts des trois plateformes." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Defender for Cloud DevOps security connects Azure DevOps, GitHub and GitLab and gives security teams a central view of code, secrets, open-source dependency and IaC findings produced by the scanners of each platform. Findings are correlated with other cloud security insights to prioritize fixes.
    fr: |-
      La sécurité DevOps de Defender for Cloud connecte Azure DevOps, GitHub et GitLab et offre aux équipes de sécurité une vue centrale des résultats sur le code, les secrets, les dépendances open source et l'IaC produits par les analyseurs de chaque plateforme. Les résultats sont mis en corrélation avec les autres informations de sécurité cloud pour hiérarchiser les corrections.
  options:
    a:
      en: |-
        GitHub Advanced Security reports in GitHub; it doesn't give one view that includes the GitLab repositories.
      fr: |-
        GitHub Advanced Security rend compte dans GitHub ; il n'offre pas une vue unique qui inclut les dépôts GitLab.
    b:
      en: |-
        Defender EASM discovers internet-facing assets from the outside; it doesn't read code or IaC findings from repositories.
      fr: |-
        Defender EASM découvre de l'extérieur les ressources exposées à Internet ; il ne lit pas les résultats sur le code ou l'IaC des dépôts.
    d:
      en: |-
        Azure Policy evaluates Azure resources; it can't audit the content of Azure DevOps, GitHub or GitLab repositories.
      fr: |-
        Azure Policy évalue des ressources Azure ; il ne peut pas auditer le contenu des dépôts Azure DevOps, GitHub ou GitLab.
references:
  - title: Overview of Microsoft Defender for Cloud DevOps security
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-devops-introduction
  - title: Support and prerequisites
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
