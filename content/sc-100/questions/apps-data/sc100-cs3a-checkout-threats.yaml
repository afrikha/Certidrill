id: sc100-cs3a-checkout-threats
objective: "4.2.2"
type: single
caseStudy: sc100-cs3a-wide-world-importers
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution that meets the checkout design requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui respecte les exigences relatives à la conception du paiement.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Run attack path analysis in Defender CSPM on the resources of the checkout microservice", fr: "Exécuter l'analyse du chemin d'attaque de Defender CSPM sur les ressources du microservice de paiement" } }
    - { id: b, text: { en: "Model the checkout data flows in the Microsoft Threat Modeling Tool and run a STRIDE per Element analysis", fr: "Modéliser les flux de données du paiement dans Microsoft Threat Modeling Tool et exécuter une analyse STRIDE par élément" } }
    - { id: c, text: { en: "Review the MITRE ATT&CK coverage of the checkout microservice in Microsoft Sentinel", fr: "Examiner la couverture MITRE ATT&CK du microservice de paiement dans Microsoft Sentinel" } }
    - { id: d, text: { en: "Scan the checkout repository with the code scanning of Defender for Cloud DevOps security", fr: "Analyser le dépôt du paiement avec l'analyse du code de la sécurité DevOps de Defender pour le cloud" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Threat Modeling Tool is a core element of the Microsoft SDL. Architects draw the data flows of a design and get a guided STRIDE per Element analysis of the threats and mitigations, early in the design, when issues are easy and cheap to fix.
    fr: |-
      Threat Modeling Tool est un élément central du SDL de Microsoft. Les architectes y dessinent les flux de données d'une conception et obtiennent une analyse guidée STRIDE par élément des menaces et des atténuations, dès la conception, quand les problèmes sont faciles et peu coûteux à corriger.
  options:
    a:
      en: |-
        Attack path analysis works on deployed cloud resources. The checkout microservice doesn't exist yet.
      fr: |-
        L'analyse du chemin d'attaque porte sur des ressources cloud déployées. Le microservice de paiement n'existe pas encore.
    c:
      en: |-
        The MITRE ATT&CK view of Microsoft Sentinel shows the coverage of detection rules in a workspace. It doesn't analyze the threats of a design.
      fr: |-
        La vue MITRE ATT&CK de Microsoft Sentinel montre la couverture des règles de détection d'un espace de travail. Elle n'analyse pas les menaces d'une conception.
    d:
      en: |-
        Code scanning needs code, and no code has been written yet. It also finds flaws in code, not the threats of each element of a data flow.
      fr: |-
        L'analyse du code nécessite du code, et aucune ligne n'a encore été écrite. Elle trouve aussi des failles dans le code, pas les menaces de chaque élément d'un flux de données.
references:
  - title: Microsoft Threat Modeling Tool overview
    url: https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool
