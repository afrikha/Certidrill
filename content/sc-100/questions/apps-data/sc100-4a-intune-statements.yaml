id: sc100-4a-intune-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is evaluating Microsoft Intune as part of its Zero Trust device strategy. Corporate laptops will be enrolled in Intune, and employees will also use personal iPhones that won't be enrolled. Conditional Access policies will be designed later.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys évalue Microsoft Intune dans le cadre de sa stratégie Confiance Zéro pour les appareils. Les portables d'entreprise seront inscrits dans Intune, et les employés utiliseront aussi des iPhone personnels qui ne seront pas inscrits. Les stratégies d'accès conditionnel seront conçues plus tard.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Intune app protection policies can protect corporate data in Outlook on a personal iPhone that isn't enrolled in any device management solution.
        fr: |-
          Les stratégies de protection des applications Intune peuvent protéger les données de l'entreprise dans Outlook sur un iPhone personnel qui n'est inscrit dans aucune solution de gestion des appareils.
    - id: s2
      text:
        en: |-
          An Intune compliance policy, with no Conditional Access policy, prevents a noncompliant laptop from accessing Exchange Online.
        fr: |-
          Une stratégie de conformité Intune, sans stratégie d'accès conditionnel, empêche un portable non conforme d'accéder à Exchange Online.
    - id: s3
      text:
        en: |-
          With the default tenant-wide compliance settings, a device that has no compliance policy assigned is considered compliant.
        fr: |-
          Avec les paramètres de conformité par défaut du locataire, un appareil auquel aucune stratégie de conformité n'est attribuée est considéré comme conforme.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      App protection policies work without device enrollment, independent of any MDM solution. A compliance policy only evaluates the device and reports its status to Microsoft Entra ID; a Conditional Access policy that requires a compliant device is what blocks access. The setting Mark devices with no compliance policy assigned as defaults to Compliant; Microsoft recommends Not compliant when you use Conditional Access.
    fr: |-
      Les stratégies de protection des applications fonctionnent sans inscription de l'appareil, indépendamment de toute solution MDM. Une stratégie de conformité ne fait qu'évaluer l'appareil et transmettre son état à Microsoft Entra ID ; c'est une stratégie d'accès conditionnel exigeant un appareil conforme qui bloque l'accès. Le paramètre Mark devices with no compliance policy assigned as vaut Compliant par défaut ; Microsoft recommande Not compliant quand vous utilisez l'accès conditionnel.
references:
  - title: App Protection Policies Overview
    url: https://learn.microsoft.com/en-us/intune/intune-service/apps/app-protection-policy
  - title: Device compliance policies in Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/device-compliance-get-started
