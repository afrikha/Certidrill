id: sc100-4a-purview-dlp-rollout
objective: "4.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has Microsoft 365 E5 and no data loss prevention (DLP) policy. The CISO asks you to design the rollout of DLP for Exchange Online, SharePoint Online, OneDrive and Teams. Business units fear that blocking actions will disrupt their work, so the rollout must measure the impact of each policy before any user is blocked.

    Which five actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose de Microsoft 365 E5 et d'aucune stratégie de protection contre la perte de données (DLP). Le RSSI vous demande de concevoir le déploiement de la DLP pour Exchange Online, SharePoint Online, OneDrive et Teams. Les unités métier craignent que les actions de blocage ne perturbent leur travail : le déploiement doit donc mesurer l'impact de chaque stratégie avant qu'un utilisateur ne soit bloqué.

    Quelles sont les cinq actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: plan, text: { en: "Identify the stakeholders and the categories of sensitive information to protect.", fr: "Identifier les parties prenantes et les catégories d'informations sensibles à protéger." } }
    - { id: design, text: { en: "Define the control objectives and draft a policy for each of them.", fr: "Définir les objectifs de contrôle et rédiger une stratégie pour chacun d'eux." } }
    - { id: simulate, text: { en: "Deploy the policies in simulation mode and review the matches.", fr: "Déployer les stratégies en mode simulation et examiner les correspondances." } }
    - { id: tune, text: { en: "Tune the conditions, locations and scope of the policies.", fr: "Ajuster les conditions, les emplacements et l'étendue des stratégies." } }
    - { id: enforce, text: { en: "Turn on the policies with their blocking actions.", fr: "Activer les stratégies avec leurs actions de blocage." } }
    - { id: block, text: { en: "Turn on Block without override in every policy for all users.", fr: "Activer Block without override dans chaque stratégie pour tous les utilisateurs." } }
    - { id: irm, text: { en: "Create an Insider Risk Management policy for departing users.", fr: "Créer une stratégie de gestion des risques internes pour les utilisateurs sur le départ." } }
answer:
  sequence: [ plan, design, simulate, tune, enforce ]
explanation:
  correct:
    en: |-
      Microsoft's DLP deployment approach is plan, prepare, design, simulate, tune, then enforce. You first identify stakeholders and the sensitive information categories, draft policies from control objectives, run them in simulation mode, which reports matches without applying actions, tune them, and only then turn them on with their actions.
    fr: |-
      L'approche de déploiement DLP de Microsoft est : planifier, préparer, concevoir, simuler, ajuster, puis appliquer. Vous identifiez d'abord les parties prenantes et les catégories d'informations sensibles, vous rédigez les stratégies à partir des objectifs de contrôle, vous les exécutez en mode simulation, qui signale les correspondances sans appliquer d'actions, vous les ajustez, et ce n'est qu'ensuite que vous les activez avec leurs actions.
  options:
    block:
      en: |-
        Blocking every user without override before measuring the impact is what the business units fear and skips the simulation phase.
      fr: |-
        Bloquer tous les utilisateurs sans possibilité de contournement avant d'en mesurer l'impact est précisément ce que craignent les unités métier, et cela saute la phase de simulation.
    irm:
      en: |-
        Insider Risk Management is a separate solution; it isn't a step of a DLP rollout.
      fr: |-
        La gestion des risques internes est une solution distincte ; ce n'est pas une étape d'un déploiement DLP.
references:
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
