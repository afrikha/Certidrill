id: sc100-4b-sit-methods
objective: "4.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is designing data classification in Microsoft Purview for its Microsoft 365 content. The classification will be used by DLP policies and auto-labeling policies. The data to detect is shown in the answer area.

    Which classification method should you recommend for each type of data? To answer, drag the appropriate methods to the correct types of data. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit la classification des données dans Microsoft Purview pour son contenu Microsoft 365. La classification sera utilisée par des stratégies DLP et des stratégies d'étiquetage automatique. Les données à détecter figurent dans la zone de réponse.

    Quelle méthode de classification devez-vous recommander pour chaque type de données ? Pour répondre, faites glisser les méthodes appropriées vers les types de données correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: builtin, text: { en: "Built-in sensitive information type", fr: "Type d'informations sensibles intégré" } }
    - { id: custom, text: { en: "Custom pattern-based sensitive information type", fr: "Type d'informations sensibles personnalisé fondé sur un modèle" } }
    - { id: edm, text: { en: "Exact data match sensitive information type", fr: "Type d'informations sensibles à correspondance exacte des données (EDM)" } }
    - { id: trainable, text: { en: "Trainable classifier", fr: "Classifieur entraînable" } }
    - { id: label, text: { en: "Retention label", fr: "Étiquette de rétention" } }
  targets:
    - { id: t1, text: { en: "Credit card numbers in emails and documents", fr: "Numéros de carte de crédit dans les e-mails et les documents" } }
    - { id: t2, text: { en: "Internal project codes made of PRJ- followed by six digits", fr: "Codes de projet internes composés de PRJ- suivi de six chiffres" } }
    - { id: t3, text: { en: "Account numbers of the 2 million current customers, exported daily from the CRM database, with as few false positives as possible", fr: "Numéros de compte des 2 millions de clients actuels, exportés chaque jour de la base de données CRM, avec le moins de faux positifs possible" } }
answer:
  mapping: { t1: builtin, t2: custom, t3: edm }
explanation:
  correct:
    en: |
      Credit card numbers have a well-known pattern with a checksum, which Microsoft provides as a built-in sensitive information type. An internal code with a fixed format needs a custom pattern-based type, for example a regular expression with keywords. Exact data match matches the exact values of a structured table that can be refreshed daily, so only real customer account numbers match and false positives drop.
    fr: |
      Les numéros de carte de crédit ont un modèle connu avec une somme de contrôle, que Microsoft fournit sous forme de type d'informations sensibles intégré. Un code interne au format fixe nécessite un type personnalisé fondé sur un modèle, par exemple une expression régulière avec des mots clés. La correspondance exacte des données compare les valeurs exactes d'une table structurée qui peut être actualisée chaque jour : seuls les vrais numéros de compte des clients correspondent, et les faux positifs diminuent.
  options:
    trainable:
      en: Trainable classifiers recognize categories of documents by example; they are for content without a pattern, not for specific values.
      fr: Les classifieurs entraînables reconnaissent des catégories de documents par l'exemple ; ils servent au contenu sans modèle, pas à des valeurs précises.
    label:
      en: A retention label governs how long content is kept; it isn't a detection method.
      fr: Une étiquette de rétention régit la durée de conservation du contenu ; ce n'est pas une méthode de détection.
references:
  - title: Learn about exact data match based sensitive information types
    url: https://learn.microsoft.com/en-us/purview/sit-learn-about-exact-data-match-based-sits
