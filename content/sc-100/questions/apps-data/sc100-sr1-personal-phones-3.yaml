id: sc100-sr1-personal-phones-3
objective: "4.1.3"
type: series_yesno
series: sc100-sr1-personal-phones
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You recommend Conditional Access App Control session policies in Defender for Cloud Apps.
  fr: Vous recommandez des stratégies de session du contrôle d'application par accès conditionnel dans Defender for Cloud Apps.
body:
  solution:
    en: |
      You recommend a Conditional Access policy that routes Exchange Online sessions from iOS and Android to **Conditional Access App Control**, and **Microsoft Defender for Cloud Apps** session policies that block copy and download actions.
    fr: |
      Vous recommandez une stratégie d'accès conditionnel qui achemine les sessions Exchange Online depuis iOS et Android vers le **contrôle d'application par accès conditionnel**, et des stratégies de session **Microsoft Defender for Cloud Apps** qui bloquent les actions de copie et de téléchargement.
answer: { value: false }
explanation:
  correct:
    en: Session controls of Conditional Access app control apply only to interactive web browser sessions; they don't control the data inside the Outlook mobile app. Defender for Cloud Apps is also not included in Microsoft 365 E3.
    fr: "Les contrôles de session du contrôle d'application par accès conditionnel s'appliquent uniquement aux sessions interactives de navigateur web ; ils ne contrôlent pas les données dans l'application Outlook mobile. De plus, Defender for Cloud Apps n'est pas inclus dans Microsoft 365 E3."
references:
  - title: Conditional Access app control in Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad
  - title: App Protection Policies Overview
    url: https://learn.microsoft.com/en-us/intune/intune-service/apps/app-protection-policy
