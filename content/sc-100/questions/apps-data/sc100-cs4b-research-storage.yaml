id: sc100-cs4b-research-storage
objective: "4.3.6"
type: single
caseStudy: sc100-cs4b-adatum-university
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution for stresearch that meets the research script requirement of the data requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour stresearch qui respecte l'exigence relative aux scripts de recherche, parmi les exigences relatives aux données.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Store the account keys in Azure Key Vault, rotate them every month, and disable anonymous access on the two containers", fr: "Stocker les clés du compte dans Azure Key Vault, les faire pivoter chaque mois et désactiver l'accès anonyme sur les deux conteneurs" } }
    - { id: b, text: { en: "Give each researcher an account SAS that expires after 90 days, and disallow anonymous blob access on the account", fr: "Remettre à chaque chercheur une SAS de compte qui expire au bout de 90 jours, et interdire l'accès anonyme aux objets blob sur le compte" } }
    - { id: c, text: { en: "Assign Storage Blob Data roles to the researchers, disallow Shared Key authorization, and disallow anonymous blob access on the account", fr: "Attribuer des rôles Storage Blob Data aux chercheurs, interdire l'autorisation par clé partagée et interdire l'accès anonyme aux objets blob sur le compte" } }
    - { id: d, text: { en: "Create a stored access policy for each researcher with a service SAS, and set the two containers to private access", fr: "Créer une stratégie d'accès stockée pour chaque chercheur avec une SAS de service, et définir les deux conteneurs en accès privé" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With Microsoft Entra ID authorization and Storage Blob Data roles, each script runs under an individual identity whose role assignment can be removed on its own. Disallowing Shared Key authorization stops the shared access keys and the SAS tokens they sign from working. Disallowing anonymous blob access at the account level overrides the container settings, so no container can be read anonymously, now or later.
    fr: |-
      Avec l'autorisation Microsoft Entra ID et les rôles Storage Blob Data, chaque script s'exécute sous une identité individuelle dont l'attribution de rôle peut être supprimée séparément. Interdire l'autorisation par clé partagée empêche les clés d'accès partagées et les jetons SAS qu'elles signent de fonctionner. Interdire l'accès anonyme aux objets blob au niveau du compte prévaut sur les paramètres des conteneurs : aucun conteneur ne peut être lu de façon anonyme, ni maintenant ni plus tard.
  options:
    a:
      en: |-
        Rotated keys are still shared secrets that grant full access to the account; one researcher's access can't be revoked without breaking all the scripts.
      fr: |-
        Des clés qui pivotent restent des secrets partagés qui donnent un accès complet au compte ; l'accès d'un chercheur ne peut pas être révoqué sans casser tous les scripts.
    b:
      en: |-
        An account SAS is signed with an account key and can be revoked only by rotating that key, which revokes every SAS signed with it.
      fr: |-
        Une SAS de compte est signée avec une clé du compte et ne peut être révoquée qu'en faisant pivoter cette clé, ce qui révoque toutes les SAS signées avec elle.
    d:
      en: |-
        Service SAS tokens are still signed with the account keys, which stay usable, and private containers don't prevent a new container from allowing anonymous access.
      fr: |-
        Les jetons SAS de service restent signés avec les clés du compte, qui restent utilisables, et des conteneurs privés n'empêchent pas un nouveau conteneur d'autoriser l'accès anonyme.
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
  - title: Remediate anonymous read access to blob data (Azure Resource Manager deployments)
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-prevent
