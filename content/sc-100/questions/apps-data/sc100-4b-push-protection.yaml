id: sc100-4b-push-protection
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. stores the source code of its applications in Git repositories in Azure Repos (Azure DevOps Services). During a review, the security team found storage account keys in several recent commits.

    You need to recommend a standard that rejects new commits containing credentials before they are stored in the repositories. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Proseware, Inc. stocke le code source de ses applications dans des dépôts Git d'Azure Repos (Azure DevOps Services). Lors d'une revue, l'équipe de sécurité a trouvé des clés de compte de stockage dans plusieurs commits récents.

    Vous devez recommander une norme qui rejette les nouveaux commits contenant des informations d'identification avant qu'ils ne soient stockés dans les dépôts. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Secret scanning repository scanning alerts in GitHub Advanced Security for Azure DevOps", fr: "Les alertes d'analyse des secrets du dépôt dans GitHub Advanced Security for Azure DevOps" } }
    - { id: b, text: { en: "Secret scanning push protection in GitHub Advanced Security for Azure DevOps", fr: "La protection des envois (push protection) de l'analyse des secrets dans GitHub Advanced Security for Azure DevOps" } }
    - { id: c, text: { en: "A Defender for Cloud DevOps security connector for the Azure DevOps organization", fr: "Un connecteur de sécurité DevOps de Defender for Cloud pour l'organisation Azure DevOps" } }
    - { id: d, text: { en: "Azure Key Vault references for every secret that the applications use", fr: "Des références Azure Key Vault pour chaque secret qu'utilisent les applications" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Push protection, part of the Secret Protection product of GitHub Advanced Security for Azure DevOps, checks each push and blocks pushes that contain secrets such as credentials, so they never reach a protected repository. It applies only to pushes made after it's enabled.
    fr: |
      La protection des envois, qui fait partie du produit Secret Protection de GitHub Advanced Security for Azure DevOps, vérifie chaque envoi et bloque ceux qui contiennent des secrets comme des informations d'identification : ils n'atteignent jamais un dépôt protégé. Elle ne s'applique qu'aux envois effectués après son activation.
  options:
    a:
      en: Repository scanning runs in the background and alerts on secrets that are already in the repository, including historical commits; it doesn't reject the push.
      fr: L'analyse du dépôt s'exécute en arrière-plan et alerte sur les secrets déjà présents dans le dépôt, y compris dans l'historique ; elle ne rejette pas l'envoi.
    c:
      en: The DevOps security connector gives the security team visibility of findings in Defender for Cloud; it doesn't block commits.
      fr: Le connecteur de sécurité DevOps donne à l'équipe de sécurité une visibilité des résultats dans Defender for Cloud ; il ne bloque pas les commits.
    d:
      en: Key Vault gives developers a place to store secrets, but nothing prevents a developer from committing a key by mistake.
      fr: Key Vault donne aux développeurs un endroit où stocker les secrets, mais rien n'empêche un développeur de commiter une clé par erreur.
references:
  - title: Configure GitHub Advanced Security for Azure DevOps features
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features
