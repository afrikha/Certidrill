id: sc100-4a-mdo-mdca-capabilities
objective: "4.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has Microsoft 365 E5, which includes Microsoft Defender for Office 365 Plan 2 and Microsoft Defender for Cloud Apps. Litware also uses a Salesforce tenant and dozens of OAuth apps that users consented to.

    You need to recommend a capability for each requirement.

    Which capability should you recommend for each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose de Microsoft 365 E5, qui inclut Microsoft Defender for Office 365 Plan 2 et Microsoft Defender for Cloud Apps. Litware utilise aussi un locataire Salesforce et des dizaines d'applications OAuth auxquelles les utilisateurs ont donné leur consentement.

    Vous devez recommander une fonctionnalité pour chaque exigence.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: links, text: { en: "Safe Links", fr: "Liens fiables (Safe Links)" } }
    - { id: attach, text: { en: "Safe Attachments", fr: "Pièces jointes fiables (Safe Attachments)" } }
    - { id: appgov, text: { en: "App governance", fr: "Gouvernance des applications (app governance)" } }
    - { id: sspm, text: { en: "SaaS security posture management", fr: "Gestion de la posture de sécurité SaaS (SSPM)" } }
    - { id: discovery, text: { en: "Cloud Discovery", fr: "Découverte cloud (Cloud Discovery)" } }
    - { id: sim, text: { en: "Attack simulation training", fr: "Formation à la simulation d'attaque" } }
  targets:
    - id: t1
      text: { en: "Check URLs in email and Teams messages at the moment users select them", fr: "Vérifier les URL des e-mails et des messages Teams au moment où les utilisateurs les sélectionnent" }
    - id: t2
      text: { en: "Scan files that users upload to SharePoint, OneDrive and Teams for malware", fr: "Rechercher les programmes malveillants dans les fichiers que les utilisateurs chargent dans SharePoint, OneDrive et Teams" }
    - id: t3
      text: { en: "Monitor the permissions and data access of OAuth apps registered in Microsoft Entra ID, and block risky apps", fr: "Surveiller les autorisations et l'accès aux données des applications OAuth inscrites dans Microsoft Entra ID, et bloquer les applications à risque" }
    - id: t4
      text: { en: "Receive recommendations about weak security settings of the Salesforce tenant", fr: "Recevoir des recommandations sur les paramètres de sécurité faibles du locataire Salesforce" }
answer:
  mapping: { t1: links, t2: attach, t3: appgov, t4: sspm }
explanation:
  correct:
    en: |-
      Safe Links checks URLs in email, Office clients and Teams when users select them. Safe Attachments protects email attachments and also files in SharePoint, OneDrive and Teams. App governance gives insights, policies and detections for OAuth apps registered in Microsoft Entra ID, Google and Salesforce. SaaS security posture management returns configuration recommendations for apps connected through an app connector, such as Salesforce.
    fr: |-
      Les Liens fiables vérifient les URL dans les e-mails, les clients Office et Teams quand les utilisateurs les sélectionnent. Les Pièces jointes fiables protègent les pièces jointes des e-mails ainsi que les fichiers de SharePoint, OneDrive et Teams. La gouvernance des applications fournit des insights, des stratégies et des détections pour les applications OAuth inscrites dans Microsoft Entra ID, Google et Salesforce. La gestion de la posture de sécurité SaaS renvoie des recommandations de configuration pour les applications connectées par un connecteur d'applications, comme Salesforce.
  options:
    discovery:
      en: |-
        Cloud Discovery finds the cloud apps used from traffic logs; it doesn't assess the configuration of a connected tenant or the permissions of OAuth apps.
      fr: |-
        La découverte cloud trouve les applications cloud utilisées à partir des journaux de trafic ; elle n'évalue ni la configuration d'un locataire connecté ni les autorisations des applications OAuth.
    sim:
      en: |-
        Attack simulation training runs phishing simulations to train users; it doesn't protect URLs or files.
      fr: |-
        La formation à la simulation d'attaque exécute des simulations de hameçonnage pour former les utilisateurs ; elle ne protège ni les URL ni les fichiers.
references:
  - title: Microsoft Defender for Office 365 overview
    url: https://learn.microsoft.com/en-us/defender-office-365/mdo-about
  - title: App governance in Microsoft Defender for Cloud Apps and Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/app-governance-manage-app-governance
