id: sc100-4a-copilot-hr-site
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. is deploying Microsoft 365 Copilot to 8,000 users and has SharePoint Advanced Management. During the pilot, users outside human resources (HR) receive Copilot answers that quote salary files from a SharePoint site named **HR-Records**. Years ago, the site was shared with Everyone except external users, and thousands of sharing links to individual files exist.

    HR sets the following requirements:

    - Only members of the Microsoft Entra security group **HR-Team** must be able to open the site's files and see their content in Copilot and in search.
    - Users outside HR-Team must lose access even if they hold a sharing link.
    - The solution must not require reviewing the permissions of each file.

    What should you recommend?
  fr: |
    Contoso, Ltd. déploie Microsoft 365 Copilot pour 8 000 utilisateurs et dispose de SharePoint Advanced Management. Pendant le pilote, des utilisateurs extérieurs aux ressources humaines (RH) reçoivent des réponses de Copilot qui citent des fichiers de salaires d'un site SharePoint nommé **HR-Records**. Il y a des années, le site a été partagé avec Tout le monde sauf les utilisateurs externes, et des milliers de liens de partage vers des fichiers individuels existent.

    Les RH fixent les exigences suivantes :

    - Seuls les membres du groupe de sécurité Microsoft Entra **HR-Team** doivent pouvoir ouvrir les fichiers du site et voir leur contenu dans Copilot et dans la recherche.
    - Les utilisateurs extérieurs à HR-Team doivent perdre l'accès même s'ils détiennent un lien de partage.
    - La solution ne doit pas exiger d'examiner les autorisations de chaque fichier.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Turn on Restricted Content Discovery for HR-Records.", fr: "Activer la découverte de contenu restreinte pour HR-Records." } }
    - { id: b, text: { en: "Run a data access governance report on HR-Records.", fr: "Exécuter un rapport de gouvernance de l'accès aux données sur HR-Records." } }
    - { id: c, text: { en: "Label the site's files and block the label with a DLP policy for Copilot.", fr: "Étiqueter les fichiers du site et bloquer l'étiquette avec une stratégie DLP pour Copilot." } }
    - { id: d, text: { en: "Apply a restricted access control policy with HR-Team to HR-Records.", fr: "Appliquer à HR-Records une stratégie de contrôle d'accès restreint avec HR-Team." } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A restricted access control policy limits a site and its content to members of up to 10 Microsoft 365 or Microsoft Entra security groups. Users outside the group can't open the content even with prior permissions or a sharing link, and the policy is honored by organization-wide search and Copilot. It applies at site level, so no per-file review is needed.
    fr: |-
      Une stratégie de contrôle d'accès restreint limite un site et son contenu aux membres de 10 groupes Microsoft 365 ou groupes de sécurité Microsoft Entra au maximum. Les utilisateurs extérieurs au groupe ne peuvent pas ouvrir le contenu, même avec des autorisations antérieures ou un lien de partage, et la stratégie est respectée par la recherche à l'échelle de l'organisation et par Copilot. Elle s'applique au niveau du site : aucun examen fichier par fichier n'est nécessaire.
  options:
    a:
      en: |-
        Restricted Content Discovery hides the site from organization-wide search and Copilot, but users who have access can still open the files through their links.
      fr: |-
        La découverte de contenu restreinte masque le site de la recherche à l'échelle de l'organisation et de Copilot, mais les utilisateurs qui ont accès peuvent toujours ouvrir les fichiers par leurs liens.
    b:
      en: |-
        A data access governance report identifies overshared content; it doesn't change who can access it.
      fr: |-
        Un rapport de gouvernance de l'accès aux données identifie le contenu surpartagé ; il ne modifie pas qui peut y accéder.
    c:
      en: |-
        A DLP policy for the Copilot location only stops Copilot from processing the labeled files; users outside HR-Team could still open them through their sharing links.
      fr: |-
        Une stratégie DLP pour l'emplacement Copilot empêche seulement Copilot de traiter les fichiers étiquetés ; les utilisateurs extérieurs à HR-Team pourraient toujours les ouvrir par leurs liens de partage.
references:
  - title: Restrict SharePoint site access with Microsoft 365 groups and Microsoft Entra security groups
    url: https://learn.microsoft.com/en-us/sharepoint/restricted-access-control
