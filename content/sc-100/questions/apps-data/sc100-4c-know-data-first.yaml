id: sc100-4c-know-data-first
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has a Microsoft 365 E5 subscription, several Azure subscriptions and on-premises file servers. The CISO asks you to launch a data protection program that follows Microsoft's data security guidance and Zero Trust principles.

    No inventory of sensitive data exists yet. Three teams already propose projects: one for customer-managed keys, one for data loss prevention (DLP) and one for threat detection on data services.

    You need to recommend which activity the program should prioritize first.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose d'un abonnement Microsoft 365 E5, de plusieurs abonnements Azure et de serveurs de fichiers locaux. Le RSSI vous demande de lancer un programme de protection des données conforme aux recommandations de Microsoft sur la sécurité des données et aux principes de la Confiance Zéro.

    Il n'existe encore aucun inventaire des données sensibles. Trois équipes proposent déjà des projets : un pour les clés gérées par le client, un pour la protection contre la perte de données (DLP) et un pour la détection des menaces sur les services de données.

    Vous devez recommander l'activité que le programme doit traiter en priorité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Encrypt every storage account and database with customer-managed keys", fr: "Chiffrer chaque compte de stockage et chaque base de données avec des clés gérées par le client" } }
    - { id: b, text: { en: "Discover and classify the sensitive data across the estate by using Microsoft Purview", fr: "Rechercher et classer les données sensibles de tout le patrimoine à l'aide de Microsoft Purview" } }
    - { id: c, text: { en: "Deploy DLP policies that block the sharing of documents in every location", fr: "Déployer des stratégies DLP qui bloquent le partage des documents dans tous les emplacements" } }
    - { id: d, text: { en: "Enable Defender for Storage and Defender for Databases on every subscription", fr: "Activer Defender for Storage et Defender for Databases sur chaque abonnement" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Microsoft Purview Information Protection is organized as know your data, protect your data and prevent data loss, and it starts with knowing your data. Until sensitive data is discovered and classified, the organization can't decide which data needs encryption, DLP or threat detection, or how strictly. Purview sensitive information types and trainable classifiers find the data, and sensitivity labels then carry the protection that later controls enforce.
    fr: |-
      Microsoft Purview Information Protection s'organise en trois volets, connaître ses données, protéger ses données et empêcher la perte de données, et commence par la connaissance des données. Tant que les données sensibles ne sont pas trouvées et classées, l'organisation ne peut pas décider quelles données ont besoin de chiffrement, de DLP ou de détection des menaces, ni avec quelle rigueur. Les types d'informations sensibles et les classifieurs entraînables de Purview trouvent les données, puis les étiquettes de confidentialité portent la protection qu'appliquent les contrôles suivants.
  options:
    a:
      en: |-
        Data at rest is already encrypted with Microsoft-managed keys. Customer-managed keys everywhere add key management effort without knowing which data justifies it.
      fr: |-
        Les données au repos sont déjà chiffrées avec des clés gérées par Microsoft. Des clés gérées par le client partout ajoutent un effort de gestion des clés sans savoir quelles données le justifient.
    c:
      en: |-
        DLP policies rely on classification to target sensitive content. Blocking all sharing without knowing the data would disrupt the business.
      fr: |-
        Les stratégies DLP s'appuient sur la classification pour cibler le contenu sensible. Bloquer tout partage sans connaître les données perturberait l'activité.
    d:
      en: |-
        Threat detection is useful, but it doesn't tell you where sensitive data is, and Defender alerts are prioritized better once the sensitivity of the data is known.
      fr: |-
        La détection des menaces est utile, mais elle n'indique pas où se trouvent les données sensibles, et les alertes Defender sont mieux hiérarchisées une fois la sensibilité des données connue.
references:
  - title: Protect your sensitive data with Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/information-protection
