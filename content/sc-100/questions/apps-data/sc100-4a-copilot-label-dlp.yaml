id: sc100-4a-copilot-label-dlp
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft 365 Copilot and Microsoft Purview. A sensitivity label named **Board Confidential** applies content marking only, without encryption. It is applied to board documents that are spread across hundreds of SharePoint sites and OneDrive accounts.

    Requirements:

    - Copilot must not use the content of items labeled Board Confidential to answer any user.
    - Users who have access to the items must keep opening, editing and copying them as they do today.
    - The protection settings of the Board Confidential label must not change.

    What should you recommend?
  fr: |
    Fabrikam, Inc. utilise Microsoft 365 Copilot et Microsoft Purview. Une étiquette de confidentialité nommée **Board Confidential** applique uniquement un marquage du contenu, sans chiffrement. Elle est appliquée à des documents du conseil d'administration répartis dans des centaines de sites SharePoint et de comptes OneDrive.

    Exigences :

    - Copilot ne doit utiliser le contenu des éléments étiquetés Board Confidential pour répondre à aucun utilisateur.
    - Les utilisateurs qui ont accès aux éléments doivent continuer à les ouvrir, les modifier et les copier comme aujourd'hui.
    - Les paramètres de protection de l'étiquette Board Confidential ne doivent pas changer.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A DLP policy for the Copilot location that prevents Copilot from processing items labeled Board Confidential", fr: "Une stratégie DLP pour l'emplacement Copilot qui empêche Copilot de traiter les éléments étiquetés Board Confidential" } }
    - { id: b, text: { en: "Encryption added to the Board Confidential label without the EXTRACT usage right for any user", fr: "Un chiffrement ajouté à l'étiquette Board Confidential sans le droit d'utilisation EXTRACT pour aucun utilisateur" } }
    - { id: c, text: { en: "Restricted Content Discovery turned on for every site that contains board documents", fr: "La découverte de contenu restreinte activée sur chaque site qui contient des documents du conseil" } }
    - { id: d, text: { en: "A Communication Compliance policy that detects Copilot responses that quote board documents", fr: "Une stratégie de conformité des communications qui détecte les réponses de Copilot citant des documents du conseil" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A DLP policy for the Microsoft 365 Copilot location can use a sensitivity label condition with the action that prevents Copilot from processing the content. Labeled items can still appear as citations, but Copilot doesn't use their content, and users keep their normal access to the files.
    fr: |-
      Une stratégie DLP pour l'emplacement Microsoft 365 Copilot peut utiliser une condition sur une étiquette de confidentialité avec l'action qui empêche Copilot de traiter le contenu. Les éléments étiquetés peuvent encore apparaître en citation, mais Copilot n'utilise pas leur contenu, et les utilisateurs conservent leur accès normal aux fichiers.
  options:
    b:
      en: |-
        Changing the label's protection settings is forbidden, and removing EXTRACT would also stop users from copying content.
      fr: |-
        Modifier les paramètres de protection de l'étiquette est interdit, et retirer EXTRACT empêcherait aussi les utilisateurs de copier du contenu.
    c:
      en: |-
        Restricted Content Discovery is set site by site and hides everything in each site from Copilot and organization-wide search, including content that isn't labeled Board Confidential.
      fr: |-
        La découverte de contenu restreinte se définit site par site et masque à Copilot et à la recherche à l'échelle de l'organisation tout le contenu de chaque site, y compris celui qui ne porte pas l'étiquette Board Confidential.
    d:
      en: |-
        Communication Compliance detects violations after the fact; it doesn't prevent Copilot from using the content.
      fr: |-
        La conformité des communications détecte les violations a posteriori ; elle n'empêche pas Copilot d'utiliser le contenu.
references:
  - title: Microsoft Purview DLP for Microsoft 365 Copilot and Cowork
    url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about
