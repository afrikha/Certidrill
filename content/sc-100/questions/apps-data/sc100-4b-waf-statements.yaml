id: sc100-4b-waf-statements
objective: "4.2.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is deploying Azure Web Application Firewall (WAF) on Azure Application Gateway WAF_v2 in front of a new customer portal. The WAF policy will contain managed rules and custom rules, and must block traffic from some countries.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. déploie Azure Web Application Firewall (WAF) sur Azure Application Gateway WAF_v2 devant un nouveau portail client. La stratégie WAF contiendra des règles managées et des règles personnalisées, et doit bloquer le trafic de certains pays.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Microsoft recommends running the new WAF in Detection mode for a short period before switching it to Prevention mode.
        fr: Microsoft recommande d'exécuter le nouveau WAF en mode Détection pendant une courte période avant de le passer en mode Prévention.
    - id: s2
      text:
        en: In the WAF policy, the managed rules are evaluated before the custom rules.
        fr: Dans la stratégie WAF, les règles managées sont évaluées avant les règles personnalisées.
    - id: s3
      text:
        en: The country-based blocking is implemented with a custom rule that uses the GeoMatch operator.
        fr: Le blocage par pays est implémenté avec une règle personnalisée qui utilise l'opérateur GeoMatch.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Microsoft recommends that a newly deployed WAF runs in Detection mode for a short time, so you can review the logs and tune false positives, before you switch to Prevention mode. Custom rules are evaluated before the managed rules of the policy. Geo-filtering on Application Gateway is done with custom rules that use the GeoMatch operator to allow or block countries or regions.
    fr: |
      Microsoft recommande qu'un WAF nouvellement déployé fonctionne en mode Détection pendant une courte période, afin d'examiner les journaux et d'ajuster les faux positifs, avant de passer en mode Prévention. Les règles personnalisées sont évaluées avant les règles managées de la stratégie. Sur Application Gateway, le filtrage géographique s'effectue avec des règles personnalisées qui utilisent l'opérateur GeoMatch pour autoriser ou bloquer des pays ou des régions.
references:
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
