id: sc100-4b-cspm-data
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has object stores and databases in Azure and AWS. Microsoft Defender for Cloud with foundational CSPM covers all the subscriptions and accounts. Fabrikam already defines custom sensitive information types in Microsoft Purview.

    The security team must find which data stores contain sensitive data, identify internet-exposed virtual machines that could reach those stores, and prioritize posture recommendations by data sensitivity. The same sensitive information types as in Purview must be used.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose de magasins d'objets et de bases de données dans Azure et AWS. Microsoft Defender for Cloud avec la CSPM de base couvre tous les abonnements et comptes. Fabrikam définit déjà des types d'informations sensibles personnalisés dans Microsoft Purview.

    L'équipe de sécurité doit trouver les magasins de données qui contiennent des données sensibles, identifier les machines virtuelles exposées à Internet qui pourraient atteindre ces magasins et hiérarchiser les recommandations de posture selon la sensibilité des données. Les mêmes types d'informations sensibles que dans Purview doivent être utilisés.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable Defender CSPM with the sensitive data discovery extension", fr: "Activer Defender CSPM avec l'extension de découverte des données sensibles" } }
    - { id: b, text: { en: "Enable Defender for Storage malware scanning on all the storage accounts", fr: "Activer l'analyse des programmes malveillants de Defender for Storage sur tous les comptes de stockage" } }
    - { id: c, text: { en: "Enable Data Discovery & Classification on each database", fr: "Activer Data Discovery & Classification sur chaque base de données" } }
    - { id: d, text: { en: "Register the data stores in the Microsoft Purview Data Map and schedule scans", fr: "Inscrire les magasins de données dans Microsoft Purview Data Map et planifier des analyses" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Sensitive data discovery in Defender CSPM finds sensitive data in object stores and databases across clouds, using the Microsoft Purview classification engine and the custom sensitive information types imported from Purview. The results feed attack path analysis, such as an internet-exposed virtual machine with access to a sensitive data store, the cloud security explorer, and the prioritization of recommendations.
    fr: |
      La découverte des données sensibles de Defender CSPM trouve les données sensibles dans les magasins d'objets et les bases de données de plusieurs clouds, à l'aide du moteur de classification de Microsoft Purview et des types d'informations sensibles personnalisés importés de Purview. Les résultats alimentent l'analyse des chemins d'attaque, comme une machine virtuelle exposée à Internet ayant accès à un magasin de données sensibles, l'explorateur de sécurité cloud et la hiérarchisation des recommandations.
  options:
    d:
      en: The Data Map scans and classifies data for discovery and governance, but it doesn't analyze attack paths or prioritize cloud posture recommendations.
      fr: Data Map analyse et classifie les données pour leur découverte et leur gouvernance, mais il n'analyse pas les chemins d'attaque et ne hiérarchise pas les recommandations de posture cloud.
    b:
      en: Malware scanning looks for malicious content in uploaded blobs; it doesn't classify sensitive data or map attack paths.
      fr: L'analyse des programmes malveillants recherche du contenu malveillant dans les objets blob chargés ; elle ne classifie pas les données sensibles et ne cartographie pas les chemins d'attaque.
    c:
      en: Data Discovery & Classification works inside Azure SQL databases only; it doesn't cover object stores or AWS, nor attack paths.
      fr: Data Discovery & Classification ne fonctionne que dans les bases de données Azure SQL ; il ne couvre ni les magasins d'objets ni AWS, ni les chemins d'attaque.
references:
