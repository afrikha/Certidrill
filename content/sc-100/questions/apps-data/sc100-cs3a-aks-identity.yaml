id: sc100-cs3a-aks-identity
objective: "4.2.6"
type: single
caseStudy: sc100-cs3a-wide-world-importers
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend how the microservices authenticate to Key Vault and Cosmos DB. The solution must meet the workload identity requirements.

    What should you recommend?
  fr: |
    Vous devez recommander la façon dont les microservices s'authentifient auprès de Key Vault et de Cosmos DB. La solution doit respecter les exigences relatives aux identités de charge de travail.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra Workload ID, with one user-assigned managed identity per cluster federated with the default service account of each namespace", fr: "Microsoft Entra Workload ID, avec une identité managée affectée par l'utilisateur par cluster, fédérée avec le compte de service par défaut de chaque espace de noms" } }
    - { id: b, text: { en: "The kubelet managed identity of each cluster, granted access to Key Vault and Cosmos DB and used by every pod", fr: "L'identité managée kubelet de chaque cluster, autorisée sur Key Vault et Cosmos DB et utilisée par chaque pod" } }
    - { id: c, text: { en: "One app registration per microservice, with its client secret stored in a Kubernetes secret mounted by the pods", fr: "Une inscription d'application par microservice, dont le secret client est stocké dans un secret Kubernetes monté par les pods" } }
    - { id: d, text: { en: "Microsoft Entra Workload ID, with one user-assigned managed identity per microservice federated with the service account of that microservice", fr: "Microsoft Entra Workload ID, avec une identité managée affectée par l'utilisateur par microservice, fédérée avec le compte de service de ce microservice" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With Microsoft Entra Workload ID, the AKS cluster acts as an OIDC token issuer, and Microsoft Entra ID exchanges the projected service account token of the pod for a Microsoft Entra token through a federated identity credential, so no secret is stored. One managed identity per microservice, federated with that microservice's service account, gives each microservice its own identity and its own role assignments.
    fr: |-
      Avec Microsoft Entra Workload ID, le cluster AKS joue le rôle d'émetteur de jetons OIDC, et Microsoft Entra ID échange le jeton projeté du compte de service du pod contre un jeton Microsoft Entra grâce à des informations d'identification d'identité fédérée ; aucun secret n'est donc stocké. Une identité managée par microservice, fédérée avec le compte de service de ce microservice, donne à chaque microservice sa propre identité et ses propres attributions de rôles.
  options:
    a:
      en: |-
        One identity per cluster is shared by all the microservices of the cluster, so no microservice has its own identity and each one receives the permissions of all the others.
      fr: |-
        Une identité par cluster est partagée par tous les microservices du cluster : aucun microservice n'a sa propre identité et chacun reçoit les autorisations de tous les autres.
    b:
      en: |-
        The kubelet identity is shared by every pod of the cluster, so it can't give each microservice its own identity or limit its permissions.
      fr: |-
        L'identité kubelet est partagée par tous les pods du cluster ; elle ne peut donc pas donner à chaque microservice sa propre identité ni limiter ses autorisations.
    c:
      en: |-
        A client secret stored in a Kubernetes secret is a secret stored in the cluster, which the requirements forbid.
      fr: |-
        Un secret client stocké dans un secret Kubernetes est un secret stocké dans le cluster, ce que les exigences interdisent.
references:
  - title: Use a Microsoft Entra Workload ID on Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
