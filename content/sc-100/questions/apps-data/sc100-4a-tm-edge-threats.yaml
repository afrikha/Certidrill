id: sc100-4a-tm-edge-threats
objective: "4.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank publishes its business-critical loan application through Azure Application Gateway Standard_v2 with a public IP address in a virtual network. The application runs on virtual machines in the same virtual network.

    The threat model rates two threats as high:

    - T1: A botnet floods the public IP address with network-layer (layer 3 and layer 4) traffic until the application is unavailable.
    - T2: An attacker injects SQL statements into the loan search form to read other customers' applications.

    Both threats must be mitigated at the platform level before the release, without changes to the application code.

    Which two solutions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank publie son application de prêts, vitale pour l'entreprise, par Azure Application Gateway Standard_v2 avec une adresse IP publique dans un réseau virtuel. L'application s'exécute sur des machines virtuelles du même réseau virtuel.

    Le modèle de menaces classe deux menaces au niveau élevé :

    - T1 : un botnet inonde l'adresse IP publique de trafic de couche réseau (couches 3 et 4) jusqu'à rendre l'application indisponible.
    - T2 : un attaquant injecte des instructions SQL dans le formulaire de recherche de prêts pour lire les demandes d'autres clients.

    Les deux menaces doivent être atténuées au niveau de la plateforme avant la mise en production, sans modification du code de l'application.

    Quelles sont les deux solutions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Azure DDoS Network Protection on the virtual network", fr: "Azure DDoS Network Protection sur le réseau virtuel" } }
    - { id: b, text: { en: "A network security group on the application subnet that allows only the Application Gateway subnet", fr: "Un groupe de sécurité réseau sur le sous-réseau de l'application qui n'autorise que le sous-réseau d'Application Gateway" } }
    - { id: c, text: { en: "Microsoft Defender for Servers Plan 2 on the virtual machines", fr: "Microsoft Defender for Servers Plan 2 sur les machines virtuelles" } }
    - { id: d, text: { en: "The WAF_v2 tier of Application Gateway with a WAF policy that uses the managed rule set", fr: "Le niveau WAF_v2 d'Application Gateway avec une stratégie WAF qui utilise l'ensemble de règles managé" } }
    - { id: e, text: { en: "A rate limit policy in Azure API Management in front of the application", fr: "Une stratégie de limitation du débit dans Azure API Management devant l'application" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Azure DDoS Protection mitigates layer 3 and layer 4 attack vectors against public endpoints in a virtual network, without application changes, which addresses T1. DDoS Protection doesn't cover layer 7, so web attacks such as SQL injection need a web application firewall: the WAF_v2 tier with a managed rule set inspects and blocks the malicious requests before they reach the application, which addresses T2.
    fr: |-
      Azure DDoS Protection atténue les vecteurs d'attaque de couches 3 et 4 contre les points de terminaison publics d'un réseau virtuel, sans modification de l'application, ce qui traite T1. DDoS Protection ne couvre pas la couche 7 : les attaques web comme l'injection SQL exigent un pare-feu d'applications web. Le niveau WAF_v2 avec un ensemble de règles managé inspecte et bloque les requêtes malveillantes avant qu'elles atteignent l'application, ce qui traite T2.
  options:
    b:
      en: |-
        The NSG limits who reaches the virtual machines, but the flood targets the gateway's public IP and the SQL injection arrives through the gateway itself.
      fr: |-
        Le groupe de sécurité réseau limite qui atteint les machines virtuelles, mais l'inondation vise l'adresse IP publique de la passerelle et l'injection SQL arrive par la passerelle elle-même.
    c:
      en: |-
        Defender for Servers detects threats on the machines; it doesn't absorb network floods or block injected requests at the edge.
      fr: |-
        Defender for Servers détecte les menaces sur les machines ; il n'absorbe pas les inondations réseau et ne bloque pas les requêtes injectées en périphérie.
    e:
      en: |-
        API Management throttles HTTP calls per caller; it neither absorbs layer 3 and layer 4 floods nor inspects form input for SQL injection.
      fr: |-
        API Management limite les appels HTTP par appelant ; il n'absorbe pas les inondations de couches 3 et 4 et n'inspecte pas les saisies de formulaire à la recherche d'injections SQL.
references:
  - title: Azure DDoS Protection Overview
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
  - title: What is Azure Web Application Firewall?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/overview
