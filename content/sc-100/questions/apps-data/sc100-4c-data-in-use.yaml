id: sc100-4c-data-in-use
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank plans to migrate a risk calculation application from on-premises servers to Azure virtual machines. The application processes customer portfolios in memory, and its code can't be modified.

    The regulator requires the data to be protected at rest, in transit and while it is being processed. Cloud operators and the hypervisor must not be able to read the memory of the workload. Disk encryption keys must be under Woodgrove's control.

    What should you include in the recommendation?
  fr: |
    Woodgrove Bank prévoit de migrer une application de calcul des risques depuis des serveurs locaux vers des machines virtuelles Azure. L'application traite en mémoire les portefeuilles des clients, et son code ne peut pas être modifié.

    Le régulateur exige que les données soient protégées au repos, en transit et pendant leur traitement. Les opérateurs du cloud et l'hyperviseur ne doivent pas pouvoir lire la mémoire de la charge de travail. Les clés de chiffrement des disques doivent être sous le contrôle de Woodgrove.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "Standard virtual machines with encryption at host and customer-managed keys in a Managed HSM", fr: "Des machines virtuelles standard avec le chiffrement sur l'hôte et des clés gérées par le client dans un HSM managé" } }
    - { id: b, text: { en: "Standard virtual machines with Always Encrypted and customer-managed keys in Key Vault", fr: "Des machines virtuelles standard avec Always Encrypted et des clés gérées par le client dans Key Vault" } }
    - { id: c, text: { en: "Standard virtual machines with infrastructure encryption and Trusted launch", fr: "Des machines virtuelles standard avec le chiffrement d'infrastructure et le lancement fiable" } }
    - { id: d, text: { en: "Confidential virtual machines with confidential disk encryption and customer-managed keys", fr: "Des machines virtuelles confidentielles avec le chiffrement de disque confidentiel et des clés gérées par le client" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Confidential VMs, on AMD SEV-SNP or Intel TDX processors, create a hardware-enforced boundary between the workload and the hypervisor and host management code, so the VM state stays protected and most applications migrate without code changes. Confidential OS disk encryption binds the disk encryption keys to the VM's TPM, with a platform-managed or customer-managed key. Together they cover data in use and at rest under customer control.
    fr: |-
      Les machines virtuelles confidentielles, sur des processeurs AMD SEV-SNP ou Intel TDX, créent une frontière matérielle entre la charge de travail et l'hyperviseur ainsi que le code de gestion de l'hôte : l'état de la machine virtuelle reste protégé et la plupart des applications migrent sans modification du code. Le chiffrement confidentiel du disque du système d'exploitation lie les clés de chiffrement du disque au module TPM de la machine virtuelle, avec une clé gérée par la plateforme ou par le client. Ensemble, ils couvrent les données en cours d'utilisation et au repos sous le contrôle du client.
  options:
    a:
      en: |-
        Encryption at host and customer-managed keys protect data at rest, but the memory of a standard VM isn't isolated from the host.
      fr: |-
        Le chiffrement sur l'hôte et les clés gérées par le client protègent les données au repos, mais la mémoire d'une machine virtuelle standard n'est pas isolée de l'hôte.
    b:
      en: |-
        Always Encrypted is a database feature that requires client driver changes; it doesn't protect the memory of an application running on a VM.
      fr: |-
        Always Encrypted est une fonctionnalité de base de données qui nécessite des modifications du pilote client ; elle ne protège pas la mémoire d'une application exécutée sur une machine virtuelle.
    c:
      en: |-
        Infrastructure encryption is a storage feature and Trusted launch protects the boot chain; neither encrypts memory against the host.
      fr: |-
        Le chiffrement d'infrastructure est une fonctionnalité de stockage et le lancement fiable protège la chaîne de démarrage ; aucun des deux ne chiffre la mémoire vis-à-vis de l'hôte.
references:
  - title: About Azure confidential VMs
    url: https://learn.microsoft.com/en-us/azure/confidential-computing/confidential-vm-overview
