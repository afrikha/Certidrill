id: sc100-4b-waf-policy-scope
objective: "4.2.8"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses one Azure Application Gateway WAF_v2 named agw1 to publish three websites: site1, site2 and site3. Each website has its own HTTP listener, and site1 uses path-based routing rules. A WAF policy named PolicyA is associated with agw1.

    You are designing additional WAF policies. The levels at which a WAF policy can be associated with agw1 are shown in the following table.

    Answer each prompt by selecting the association level that meets the requirement and affects nothing else.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise une passerelle Azure Application Gateway WAF_v2 nommée agw1 pour publier trois sites web : site1, site2 et site3. Chaque site web a son propre écouteur HTTP, et site1 utilise des règles de routage basées sur le chemin. Une stratégie WAF nommée PolicyA est associée à agw1.

    Vous concevez des stratégies WAF supplémentaires. Les niveaux auxquels une stratégie WAF peut être associée à agw1 figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le niveau d'association qui respecte l'exigence sans rien affecter d'autre.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Apply stricter custom rules only to the /admin path of site1", fr: "Appliquer des règles personnalisées plus strictes uniquement au chemin /admin de site1" }
    - id: p2
      text: { en: "Apply different exclusions to all the paths of site2 only", fr: "Appliquer des exclusions différentes à tous les chemins de site2 uniquement" }
  grid:
    header: [{ en: "Association level", fr: "Niveau d'association" }, { en: "Applies to", fr: "S'applique à" }]
    rows:
      - [{ text: { en: "Global", fr: "Global" }, area: global }, { text: { en: "Every site and path behind agw1", fr: "Tous les sites et chemins derrière agw1" } }]
      - [{ text: { en: "Per site", fr: "Par site" }, area: site }, { text: { en: "One HTTP listener", fr: "Un écouteur HTTP" } }]
      - [{ text: { en: "Per URI", fr: "Par URI" }, area: uri }, { text: { en: "One path of a path-based routing rule", fr: "Un chemin d'une règle de routage basée sur le chemin" } }]
answer:
  values: { p1: uri, p2: site }
explanation:
  correct:
    en: |
      On WAF_v2, a WAF policy can be associated globally, per site (HTTP listener) or per URI (path of a path-based routing rule), and the most specific association applies. A per-URI policy on the /admin path of site1 affects only that path, and a per-site policy on the listener of site2 affects all the paths of site2 without changing site1 or site3.
    fr: |
      Sur WAF_v2, une stratégie WAF peut être associée globalement, par site (écouteur HTTP) ou par URI (chemin d'une règle de routage basée sur le chemin), et l'association la plus spécifique s'applique. Une stratégie par URI sur le chemin /admin de site1 n'affecte que ce chemin, et une stratégie par site sur l'écouteur de site2 affecte tous les chemins de site2 sans modifier site1 ni site3.
references:
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
