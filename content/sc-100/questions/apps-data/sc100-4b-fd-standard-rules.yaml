id: sc100-4b-fd-standard-rules
objective: "4.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys publishes a global marketing website through an Azure Front Door Standard profile. Management has refused any upgrade of the profile this year.

    The security team listed several requirements for the website. You need to identify which requirements can be met by a WAF policy associated with the existing profile.

    Which two requirements can be met?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys publie un site web marketing mondial via un profil Azure Front Door Standard. La direction a refusé toute mise à niveau du profil cette année.

    L'équipe de sécurité a listé plusieurs exigences pour le site web. Vous devez identifier les exigences qui peuvent être satisfaites par une stratégie WAF associée au profil existant.

    Quelles sont les deux exigences qui peuvent être satisfaites ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Block requests that come from two specific countries", fr: "Bloquer les requêtes qui proviennent de deux pays précis" } }
    - { id: b, text: { en: "Block SQL injection by using the Default Rule Set", fr: "Bloquer l'injection SQL à l'aide du Default Rule Set" } }
    - { id: c, text: { en: "Block known bad bots by using the Bot Manager rule set", fr: "Bloquer les bots malveillants connus à l'aide du jeu de règles Bot Manager" } }
    - { id: d, text: { en: "Limit each client IP address to 300 requests per minute", fr: "Limiter chaque adresse IP cliente à 300 requêtes par minute" } }
    - { id: e, text: { en: "Mitigate volumetric network-layer floods against the origin", fr: "Atténuer les inondations volumétriques de la couche réseau contre l'origine" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      On the Front Door Standard tier, a WAF policy supports only custom rules. Custom rules include geo-filtering based on the country or region of the client IP address and rate limiting over a one-minute or five-minute window, so both requirements can be met without upgrading.
    fr: |
      Sur le niveau Standard de Front Door, une stratégie WAF ne prend en charge que les règles personnalisées. Les règles personnalisées incluent le filtrage géographique fondé sur le pays ou la région de l'adresse IP cliente et la limitation du débit sur une fenêtre d'une ou de cinq minutes : les deux exigences peuvent donc être satisfaites sans mise à niveau.
  options:
    b:
      en: Managed rule sets such as the Default Rule Set require the Front Door Premium tier.
      fr: Les ensembles de règles managés comme le Default Rule Set exigent le niveau Premium de Front Door.
    c:
      en: Bot protection with the Bot Manager rule set is a managed rule set available on Front Door Premium.
      fr: La protection contre les bots avec le jeu de règles Bot Manager est un ensemble de règles managé disponible sur Front Door Premium.
    e:
      en: A WAF inspects HTTP requests at layer 7; volumetric network-layer attacks are handled by DDoS protection, not by WAF rules.
      fr: Un WAF inspecte les requêtes HTTP à la couche 7 ; les attaques volumétriques de la couche réseau relèvent de la protection DDoS, pas des règles WAF.
references:
  - title: Azure Web Application Firewall on Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview
