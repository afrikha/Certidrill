id: sc100-cs1c-partner-apis
objective: "4.2.7"
type: single
caseStudy: sc100-cs1c-wingtip
difficulty: 2
status: draft
stem:
  en: |-
    You need to recommend a solution for the player APIs that meets the application requirements. What should you recommend?
  fr: |-
    Vous devez recommander une solution pour les API des joueurs qui respecte les exigences relatives aux applications. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable the Defender for App Service plan on Sub-Games and review its alerts", fr: "Activer le plan Defender for App Service sur Sub-Games et examiner ses alertes" } }
    - { id: b, text: { en: "Enable the Defender for APIs plan on Sub-Games and onboard the APIs of apim-partners", fr: "Activer le plan Defender for APIs sur Sub-Games et intégrer les API de apim-partners" } }
    - { id: c, text: { en: "Connect apim-partners to Microsoft Defender for Cloud Apps as an app connector", fr: "Connecter apim-partners à Microsoft Defender for Cloud Apps comme connecteur d'application" } }
    - { id: d, text: { en: "Enable the Defender for Resource Manager plan on Sub-Games and review its alerts", fr: "Activer le plan Defender for Resource Manager sur Sub-Games et examiner ses alertes" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Defender for APIs protects the APIs published in Azure API Management. It gives an inventory of the managed APIs, flags unauthenticated APIs and APIs that received no traffic in the last 30 days as inactive, classifies the APIs that receive or return sensitive data, and monitors runtime traffic to detect threats such as the OWASP API Top 10.
    fr: |-
      Defender for APIs protège les API publiées dans Azure API Management. Il fournit un inventaire des API managées, signale les API non authentifiées et marque comme inactives les API qui n'ont reçu aucun trafic au cours des 30 derniers jours, classifie les API qui reçoivent ou renvoient des données sensibles, et surveille le trafic à l'exécution pour détecter des menaces comme le Top 10 OWASP des API.
  options:
    a:
      en: |-
        Defender for App Service protects App Service apps; it doesn't inventory or classify the APIs published in API Management.
      fr: |-
        Defender for App Service protège les applications App Service ; il n'inventorie ni ne classifie les API publiées dans API Management.
    c:
      en: |-
        App connectors in Defender for Cloud Apps govern SaaS apps; they don't assess the APIs that an API Management instance publishes.
      fr: |-
        Les connecteurs d'applications de Defender for Cloud Apps gouvernent des applications SaaS ; ils n'évaluent pas les API publiées par une instance API Management.
    d:
      en: |-
        Defender for Resource Manager detects suspicious management operations on Azure resources, not attacks in the API traffic.
      fr: |-
        Defender for Resource Manager détecte les opérations de gestion suspectes sur les ressources Azure, et non les attaques dans le trafic des API.
references:
  - title: About Microsoft Defender for APIs
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-apis-introduction
