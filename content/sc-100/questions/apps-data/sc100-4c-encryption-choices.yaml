id: sc100-4c-encryption-choices
objective: "4.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is designing encryption for a new claims platform in Azure. The platform uses Azure SQL Database, Azure Storage accounts and Azure virtual machines.

    You need to recommend an encryption solution for each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. conçoit le chiffrement d'une nouvelle plateforme de gestion des sinistres dans Azure. La plateforme utilise Azure SQL Database, des comptes Stockage Azure et des machines virtuelles Azure.

    Vous devez recommander une solution de chiffrement pour chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Database administrators must never see the values of the NationalId column in clear text: [[s1]]

      Clients must not be able to connect to the storage accounts over unencrypted or weakly encrypted connections: [[s2]]

      The temporary disks and disk caches of the virtual machines must be encrypted, without running encryption inside the guest OS: [[s3]]
    fr: |
      Les administrateurs de bases de données ne doivent jamais voir en clair les valeurs de la colonne NationalId : [[s1]]

      Les clients ne doivent pas pouvoir se connecter aux comptes de stockage par des connexions non chiffrées ou faiblement chiffrées : [[s2]]

      Les disques temporaires et les caches de disque des machines virtuelles doivent être chiffrés, sans exécuter de chiffrement dans le système d'exploitation invité : [[s3]]
  slots:
    - id: s1
      options:
        - { id: ae, text: Always Encrypted }
        - { id: tde, text: { en: "Transparent data encryption with a customer-managed key", fr: "Chiffrement transparent des données avec une clé gérée par le client" } }
        - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
        - { id: infra, text: { en: "Infrastructure encryption", fr: "Chiffrement d'infrastructure" } }
    - id: s2
      options:
        - { id: tls, text: { en: "Secure transfer required with a minimum TLS version of 1.2", fr: "Transfert sécurisé requis avec une version TLS minimale 1.2" } }
        - { id: cmk, text: { en: "Customer-managed keys", fr: "Clés gérées par le client" } }
        - { id: dbl, text: { en: "Infrastructure encryption", fr: "Chiffrement d'infrastructure" } }
        - { id: scope, text: { en: "Encryption scopes", fr: "Étendues de chiffrement" } }
    - id: s3
      options:
        - { id: ade, text: Azure Disk Encryption }
        - { id: host, text: { en: "Encryption at host", fr: "Chiffrement sur l'hôte" } }
        - { id: sse, text: { en: "Server-side encryption with a customer-managed key", fr: "Chiffrement côté serveur avec une clé gérée par le client" } }
answer:
  values: { s1: ae, s2: tls, s3: host }
explanation:
  correct:
    en: |-
      Always Encrypted encrypts columns in the client driver with keys that the database engine never sees, so administrators can't read the values. Secure transfer required rejects HTTP connections and a minimum TLS version of 1.2 rejects older protocols. Encryption at host encrypts temporary disks and caches on the host server, with no agent or in-guest encryption.
    fr: |-
      Always Encrypted chiffre les colonnes dans le pilote client avec des clés que le moteur de base de données ne voit jamais : les administrateurs ne peuvent pas lire les valeurs. Le transfert sécurisé requis rejette les connexions HTTP, et une version TLS minimale 1.2 rejette les protocoles plus anciens. Le chiffrement sur l'hôte chiffre les disques temporaires et les caches sur le serveur hôte, sans agent ni chiffrement dans l'invité.
  options:
    tde:
      en: |-
        TDE encrypts data at rest, but the engine decrypts it for any user who can query, including administrators.
      fr: |-
        TDE chiffre les données au repos, mais le moteur les déchiffre pour tout utilisateur qui peut interroger la base, administrateurs compris.
    ddm:
      en: |-
        Dynamic data masking only hides values in query results; it doesn't encrypt the data, and privileged users can still see it.
      fr: |-
        Le masquage dynamique des données ne fait que masquer les valeurs dans les résultats de requête ; il ne chiffre pas les données, et les utilisateurs privilégiés peuvent toujours les voir.
    ade:
      en: |-
        Azure Disk Encryption runs BitLocker or DM-Crypt inside the guest OS, and it is scheduled for retirement on September 15, 2028.
      fr: |-
        Azure Disk Encryption exécute BitLocker ou DM-Crypt dans le système d'exploitation invité, et sa mise hors service est prévue le 15 septembre 2028.
    sse:
      en: |-
        Server-side encryption protects managed disks in storage, but temporary disks and caches aren't encrypted unless encryption at host is enabled.
      fr: |-
        Le chiffrement côté serveur protège les disques managés dans le stockage, mais les disques temporaires et les caches ne sont pas chiffrés sans le chiffrement sur l'hôte.
references:
  - title: Overview of managed disk encryption options
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
