id: sc100-4c-storage-design
objective: "4.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is designing a storage account named stfinance for accounting exports. Applications in an Azure virtual network write the exports, and on-premises users read them through ExpressRoute private peering.

    You need to recommend a configuration for each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit un compte de stockage nommé stfinance pour les exports comptables. Des applications d'un réseau virtuel Azure écrivent les exports, et les utilisateurs locaux les lisent par le peering privé ExpressRoute.

    Vous devez recommander une configuration pour chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Restore a previous state of an export that an application overwrote by mistake: [[s1]]

      Make stfinance unreachable from the internet while keeping access from the virtual network and from on-premises: [[s2]]

      Prevent anyone from copying the exports automatically to a storage account in another Microsoft Entra tenant: [[s3]]
    fr: |
      Restaurer un état antérieur d'un export qu'une application a écrasé par erreur : [[s1]]

      Rendre stfinance inaccessible depuis Internet tout en conservant l'accès depuis le réseau virtuel et depuis les sites locaux : [[s2]]

      Empêcher quiconque de copier automatiquement les exports vers un compte de stockage d'un autre locataire Microsoft Entra : [[s3]]
  slots:
    - id: s1
      options:
        - { id: versioning, text: { en: "Blob versioning", fr: "Le contrôle de version des objets blob" } }
        - { id: containerSd, text: { en: "Container soft delete", fr: "La suppression réversible des conteneurs" } }
        - { id: legalHold, text: { en: "A legal hold", fr: "Une conservation légale" } }
        - { id: lifecycle, text: { en: "A lifecycle management policy", fr: "Une stratégie de gestion du cycle de vie" } }
    - id: s2
      options:
        - { id: svcEp, text: { en: "Service endpoints and a firewall that allows the virtual network", fr: "Des points de terminaison de service et un pare-feu qui autorise le réseau virtuel" } }
        - { id: privEp, text: { en: "Private endpoints, with public network access disabled", fr: "Des points de terminaison privés, avec l'accès au réseau public désactivé" } }
        - { id: noAnon, text: { en: "Anonymous access disallowed", fr: "L'accès anonyme interdit" } }
    - id: s3
      options:
        - { id: crossTenant, text: { en: "Disallow cross-tenant object replication", fr: "Interdire la réplication d'objets entre locataires" } }
        - { id: tls, text: { en: "Require a minimum TLS version of 1.2", fr: "Exiger une version TLS minimale 1.2" } }
        - { id: infra, text: { en: "Enable infrastructure encryption", fr: "Activer le chiffrement d'infrastructure" } }
        - { id: lock, text: { en: "Add a ReadOnly lock on stfinance", fr: "Ajouter un verrou ReadOnly sur stfinance" } }
answer:
  values: { s1: versioning, s2: privEp, s3: crossTenant }
explanation:
  correct:
    en: |-
      Blob versioning keeps the previous version of a blob each time it is overwritten, so you can restore it. Private endpoints give the account private IP addresses reachable from the virtual network and over private peering, and disabling public network access closes the internet endpoint. Disallowing cross-tenant object replication blocks replication policies whose destination account is in another tenant.
    fr: |-
      Le contrôle de version des objets blob conserve la version précédente d'un objet blob à chaque écrasement : vous pouvez la restaurer. Les points de terminaison privés donnent au compte des adresses IP privées accessibles depuis le réseau virtuel et par le peering privé, et la désactivation de l'accès au réseau public ferme le point de terminaison Internet. Interdire la réplication d'objets entre locataires bloque les stratégies de réplication dont le compte de destination se trouve dans un autre locataire.
  options:
    containerSd:
      en: |-
        Container soft delete restores deleted containers, not overwritten blobs.
      fr: |-
        La suppression réversible des conteneurs restaure les conteneurs supprimés, pas les objets blob écrasés.
    svcEp:
      en: |-
        Service endpoints keep the public endpoint and don't serve on-premises clients over private peering.
      fr: |-
        Les points de terminaison de service conservent le point de terminaison public et ne servent pas les clients locaux par le peering privé.
    noAnon:
      en: |-
        Disallowing anonymous access still leaves the endpoint reachable from the internet for authorized requests.
      fr: |-
        Interdire l'accès anonyme laisse le point de terminaison accessible depuis Internet pour les demandes autorisées.
references:
  - title: Blob versioning
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
  - title: Prevent object replication across Microsoft Entra tenants
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-prevent-cross-tenant-policies
