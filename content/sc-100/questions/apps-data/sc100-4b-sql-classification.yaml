id: sc100-4b-sql-classification
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank runs its card management application on Azure SQL Database. The bank also uses the Microsoft Purview Data Map to catalog its data estate.

    Auditors require the following:

    - Columns that contain card numbers and national ID numbers must carry a sensitivity label and an information type stored with the database itself.
    - For each query, the audit log must record the sensitivity of the data that the query returned.

    The solution must minimize administrative effort. What should you recommend?
  fr: |
    Woodgrove Bank exécute son application de gestion des cartes sur Azure SQL Database. La banque utilise aussi Microsoft Purview Data Map pour cataloguer son patrimoine de données.

    Les auditeurs exigent ce qui suit :

    - Les colonnes qui contiennent des numéros de carte et des numéros d'identification nationaux doivent porter une étiquette de confidentialité et un type d'informations stockés avec la base de données elle-même.
    - Pour chaque requête, le journal d'audit doit enregistrer la sensibilité des données renvoyées par la requête.

    La solution doit réduire au minimum l'effort d'administration. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Classify the columns with Data Discovery & Classification and enable Azure SQL Auditing.", fr: "Classifier les colonnes avec Data Discovery & Classification et activer l'audit Azure SQL." } }
    - { id: b, text: { en: "Scan the database with the Purview Data Map and enable Azure SQL Auditing.", fr: "Analyser la base de données avec Purview Data Map et activer l'audit Azure SQL." } }
    - { id: c, text: { en: "Encrypt the columns with Always Encrypted and enable Azure SQL Auditing.", fr: "Chiffrer les colonnes avec Always Encrypted et activer l'audit Azure SQL." } }
    - { id: d, text: { en: "Enable sensitive data discovery in Defender CSPM and export its findings.", fr: "Activer la découverte des données sensibles dans Defender CSPM et exporter ses résultats." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Data Discovery & Classification is built into Azure SQL Database: it recommends classifications and stores sensitivity labels and information types on columns as metadata in the database engine. Azure SQL Auditing then writes the labels of the data returned by each query in the data_sensitivity_information field of the audit log.
    fr: |
      Data Discovery & Classification est intégré à Azure SQL Database : il recommande des classifications et stocke les étiquettes de confidentialité et les types d'informations des colonnes sous forme de métadonnées dans le moteur de base de données. L'audit Azure SQL écrit ensuite les étiquettes des données renvoyées par chaque requête dans le champ data_sensitivity_information du journal d'audit.
  options:
    b:
      en: The Data Map classifies the columns in the Purview catalog, not in the database metadata, so the audit log can't record the sensitivity of returned data.
      fr: "Data Map classifie les colonnes dans le catalogue Purview, pas dans les métadonnées de la base de données : le journal d'audit ne peut donc pas enregistrer la sensibilité des données renvoyées."
    c:
      en: Always Encrypted protects the column values from the database engine; it doesn't label columns or add sensitivity information to audit records.
      fr: Always Encrypted protège les valeurs des colonnes vis-à-vis du moteur de base de données ; il n'étiquette pas les colonnes et n'ajoute pas d'informations de sensibilité aux enregistrements d'audit.
    d:
      en: Sensitive data discovery adds data context to cloud posture; it doesn't store labels in the database or enrich the database audit log.
      fr: La découverte des données sensibles ajoute un contexte de données à la posture cloud ; elle ne stocke pas d'étiquettes dans la base de données et n'enrichit pas le journal d'audit de la base.
references:
  - title: Data Discovery & Classification
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/data-discovery-and-classification-overview
