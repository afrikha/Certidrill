id: sc100-sr2-stg-1
objective: "4.3.6"
type: series_yesno
series: sc100-sr2-storage-entra-auth
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |
    You recommend disallowing Shared Key authorization and assigning Azure RBAC data roles.
  fr: |
    Vous recommandez d'interdire l'autorisation par clé partagée et d'attribuer des rôles de données Azure RBAC.
body:
  solution:
    en: |
      You recommend the following configuration:

      - Disallow **Shared Key** authorization on stfinance01.
      - Assign the **Storage Blob Data Contributor** role on stfinance01 to the managed identity of the app's virtual machines.
      - Assign the **Storage Blob Data Reader** role on stfinance01 to the Analysts group.
    fr: |
      Vous recommandez la configuration suivante :

      - Interdire l'autorisation par **clé partagée** (Shared Key) sur stfinance01.
      - Attribuer le rôle **Storage Blob Data Contributor** sur stfinance01 à l'identité managée des machines virtuelles de l'application.
      - Attribuer le rôle **Storage Blob Data Reader** sur stfinance01 au groupe Analysts.
answer: { value: false }
explanation:
  correct:
    en: |
      Disallowing Shared Key authorization makes the account reject the account keys, service SAS, and account SAS, and the app uses its managed identity without a secret. However, anonymous requests aren't authorized at all, so they still succeed on the public-summaries container. Anonymous access must also be disallowed for every request to require a Microsoft Entra identity.
    fr: |
      Interdire l'autorisation par clé partagée fait rejeter par le compte les clés de compte, les SAS de service et les SAS de compte, et l'application utilise son identité managée sans secret. En revanche, les requêtes anonymes ne sont pas autorisées du tout : elles réussissent donc toujours sur le conteneur public-summaries. L'accès anonyme doit aussi être interdit pour que chaque requête exige une identité Microsoft Entra.
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
