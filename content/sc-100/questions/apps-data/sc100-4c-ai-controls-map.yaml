id: sc100-4c-ai-controls-map
objective: "4.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is deploying a customer support assistant in Microsoft Foundry. The assistant is grounded on order data and support documents, and users sign in with Microsoft Entra ID.

    You need to recommend a solution for each data security requirement.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys déploie un assistant de support client dans Microsoft Foundry. L'assistant est ancré sur les données de commandes et les documents de support, et les utilisateurs se connectent avec Microsoft Entra ID.

    Vous devez recommander une solution pour chaque exigence de sécurité des données.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: shields, text: { en: "Prompt Shields with blocking enabled in Foundry", fr: "Prompt Shields avec le blocage activé dans Foundry" } }
    - { id: dfai, text: { en: "Threat protection for AI services in Defender for Cloud", fr: "La protection contre les menaces pour les services d'IA dans Defender for Cloud" } }
    - { id: purview, text: { en: "Microsoft Purview data security for Foundry", fr: "La sécurité des données Microsoft Purview pour Foundry" } }
    - { id: aispm, text: { en: "AI security posture management in Defender CSPM", fr: "La gestion de la posture de sécurité de l'IA dans Defender CSPM" } }
    - { id: ca, text: { en: "Microsoft Entra Conditional Access", fr: "L'accès conditionnel Microsoft Entra" } }
  targets:
    - { id: t1, text: { en: "Stop user inputs that try to override the system instructions before the model processes them", fr: "Arrêter les entrées utilisateur qui tentent de contourner les instructions système avant que le modèle ne les traite" } }
    - { id: t2, text: { en: "Alert the SOC in Defender XDR about credential theft attempts and data leakage through the assistant", fr: "Alerter le SOC dans Defender XDR sur les tentatives de vol d'informations d'identification et les fuites de données via l'assistant" } }
    - { id: t3, text: { en: "Capture prompts and responses in the audit log and apply retention policies to them", fr: "Enregistrer les invites et les réponses dans le journal d'audit et leur appliquer des stratégies de rétention" } }
    - { id: t4, text: { en: "Build an AI bill of materials and find attack paths to the grounding data", fr: "Construire une nomenclature IA (AI BOM) et trouver les chemins d'attaque vers les données d'ancrage" } }
answer:
  mapping: { t1: shields, t2: dfai, t3: purview, t4: aispm }
explanation:
  correct:
    en: |-
      With blocking enabled in Foundry, Prompt Shields block inputs classified as attacks before the model processes them. Threat protection for AI services raises alerts for jailbreak, data leakage and credential theft, and the alerts can be correlated in Defender XDR. Purview data security for Foundry captures prompts and responses in the unified audit log and supports retention. Defender CSPM AI security posture management builds the AI BOM and attack paths.
    fr: |-
      Avec le blocage activé dans Foundry, Prompt Shields bloque les entrées classées comme des attaques avant que le modèle ne les traite. La protection contre les menaces pour les services d'IA déclenche des alertes sur le jailbreak, la fuite de données et le vol d'informations d'identification, et ces alertes peuvent être corrélées dans Defender XDR. La sécurité des données Purview pour Foundry enregistre les invites et les réponses dans le journal d'audit unifié et prend en charge la rétention. La gestion de la posture de sécurité de l'IA de Defender CSPM construit l'AI BOM et les chemins d'attaque.
  options:
    ca:
      en: |-
        Conditional Access controls who can sign in and under which conditions; it doesn't inspect prompts or AI data.
      fr: |-
        L'accès conditionnel contrôle qui peut se connecter et dans quelles conditions ; il n'inspecte ni les invites ni les données d'IA.
references:
  - title: Prompt Shields
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection
  - title: Use Microsoft Purview to manage data security & compliance for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/purview/ai-azure-foundry
