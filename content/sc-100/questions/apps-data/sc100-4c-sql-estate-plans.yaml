id: sc100-4c-sql-estate-plans
objective: "4.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has the following SQL workloads:

    - Azure SQL Managed Instance instances in two Azure subscriptions
    - SQL Server 2019 on Windows Server virtual machines in an on-premises VMware cluster
    - SQL Server 2022 on Amazon EC2 instances in an AWS account connected to Defender for Cloud

    The SOC requires vulnerability assessment and threat detection for every SQL workload. The solution must use the fewest Defender for Cloud plans.

    Which plans should you recommend?
  fr: |
    Woodgrove Bank dispose des charges de travail SQL suivantes :

    - Des instances Azure SQL Managed Instance dans deux abonnements Azure
    - SQL Server 2019 sur des machines virtuelles Windows Server d'un cluster VMware local
    - SQL Server 2022 sur des instances Amazon EC2 d'un compte AWS connecté à Defender for Cloud

    Le SOC exige l'évaluation des vulnérabilités et la détection des menaces pour chaque charge de travail SQL. La solution doit utiliser le moins de plans Defender for Cloud possible.

    Quels plans devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Defender for SQL servers on machines only, with all workloads onboarded to Azure Arc", fr: "Defender for SQL servers on machines uniquement, avec toutes les charges de travail intégrées à Azure Arc" } }
    - { id: b, text: { en: "Defender for Azure SQL Databases and Defender for SQL servers on machines", fr: "Defender for Azure SQL Databases et Defender for SQL servers on machines" } }
    - { id: c, text: { en: "Defender for Azure SQL Databases and Defender for open-source relational databases", fr: "Defender for Azure SQL Databases et Defender for open-source relational databases" } }
    - { id: d, text: { en: "Defender for Azure SQL Databases, Defender for SQL servers on machines and Defender for Servers Plan 2", fr: "Defender for Azure SQL Databases, Defender for SQL servers on machines et Defender for Servers Plan 2" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Defender for Azure SQL Databases covers the PaaS offerings, including SQL Managed Instance. Defender for SQL servers on machines protects SQL Server on virtual machines and Azure Arc SQL Server instances, so the on-premises and EC2 instances are covered once they are onboarded to Azure Arc; the plan can be enabled on the AWS connector. Two plans meet the requirement.
    fr: |-
      Defender for Azure SQL Databases couvre les offres PaaS, dont SQL Managed Instance. Defender for SQL servers on machines protège SQL Server sur des machines virtuelles et les instances SQL Server Azure Arc : les instances locales et EC2 sont couvertes une fois intégrées à Azure Arc ; le plan peut être activé sur le connecteur AWS. Deux plans répondent à l'exigence.
  options:
    a:
      en: |-
        SQL Managed Instance is a PaaS service that you can't onboard to Azure Arc; it needs Defender for Azure SQL Databases.
      fr: |-
        SQL Managed Instance est un service PaaS que vous ne pouvez pas intégrer à Azure Arc ; il nécessite Defender for Azure SQL Databases.
    c:
      en: |-
        Defender for open-source relational databases covers PostgreSQL and MySQL engines, not SQL Server on machines.
      fr: |-
        Defender for open-source relational databases couvre les moteurs PostgreSQL et MySQL, pas SQL Server sur des machines.
    d:
      en: |-
        Defender for Servers protects the operating system; it adds no SQL vulnerability assessment or SQL threat detection, so the third plan isn't needed.
      fr: |-
        Defender for Servers protège le système d'exploitation ; il n'ajoute ni évaluation des vulnérabilités SQL ni détection des menaces SQL : le troisième plan n'est pas nécessaire.
references:
  - title: Enable Defender for SQL Servers on Machines
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-sql-usage
  - title: Protect your databases with Defender for Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-databases-plan
