id: sc100-4b-pr-gates
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. develops a .NET application in a Git repository in Azure Repos (Azure DevOps Services). Developers merge their changes into the main branch through pull requests.

    You need to recommend a development standard that prevents a pull request from being merged into the main branch when it introduces new high or critical vulnerabilities in Contoso's own code, such as SQL injection. Developers must fix the issues in the pull request.

    Which two components should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. développe une application .NET dans un dépôt Git d'Azure Repos (Azure DevOps Services). Les développeurs fusionnent leurs modifications dans la branche principale au moyen de demandes de tirage.

    Vous devez recommander une norme de développement qui empêche la fusion d'une demande de tirage dans la branche principale lorsqu'elle introduit de nouvelles vulnérabilités élevées ou critiques dans le code de Contoso, comme une injection SQL. Les développeurs doivent corriger les problèmes dans la demande de tirage.

    Quels sont les deux composants à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Microsoft Sentinel analytics rules on the Azure DevOps audit log", fr: "Des règles d'analyse Microsoft Sentinel sur le journal d'audit Azure DevOps" } }
    - { id: b, text: { en: "CodeQL code scanning from GitHub Advanced Security for Azure DevOps", fr: "L'analyse du code CodeQL de GitHub Advanced Security for Azure DevOps" } }
    - { id: c, text: { en: "Recommendations from Defender for Cloud foundational CSPM", fr: "Les recommandations de la gestion de la posture de sécurité cloud (CSPM) de base de Defender for Cloud" } }
    - { id: d, text: { en: "A branch policy on main that requires build validation and the Advanced Security status check", fr: "Une stratégie de branche sur main qui exige la validation de build et la vérification d'état Advanced Security" } }
    - { id: e, text: { en: "An Azure Policy assignment with the Deny effect on the application's resource group", fr: "Une attribution Azure Policy avec l'effet Deny sur le groupe de ressources de l'application" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Code scanning in the Code Security product of GitHub Advanced Security for Azure DevOps uses the CodeQL engine to find issues such as SQL injection in the team's code. A branch policy that requires build validation and the Advanced Security status check for new high and critical alerts blocks the merge until the developer fixes the alerts introduced by the pull request.
    fr: |
      L'analyse du code du produit Code Security de GitHub Advanced Security for Azure DevOps utilise le moteur CodeQL pour trouver des problèmes comme l'injection SQL dans le code de l'équipe. Une stratégie de branche qui exige la validation de build et la vérification d'état Advanced Security pour les nouvelles alertes élevées et critiques bloque la fusion jusqu'à ce que le développeur corrige les alertes introduites par la demande de tirage.
  options:
    a:
      en: Sentinel analytics rules detect suspicious activity after the fact; they don't analyze code or block a merge.
      fr: Les règles d'analyse Sentinel détectent les activités suspectes a posteriori ; elles n'analysent pas le code et ne bloquent pas une fusion.
    c:
      en: Foundational CSPM shows recommendations to the security team; it doesn't gate pull requests.
      fr: La CSPM de base présente des recommandations à l'équipe de sécurité ; elle ne contrôle pas les demandes de tirage.
    e:
      en: Azure Policy evaluates Azure resource configurations at deployment; it doesn't inspect application code in a repository.
      fr: Azure Policy évalue la configuration des ressources Azure au déploiement ; il n'inspecte pas le code applicatif d'un dépôt.
references:
  - title: Configure GitHub Advanced Security for Azure DevOps features
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features
