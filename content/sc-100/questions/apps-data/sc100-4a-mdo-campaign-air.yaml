id: sc100-4a-mdo-campaign-air
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has 4,000 Microsoft 365 users. Every user is licensed for Microsoft Defender for Office 365 Plan 1, and the security operations team uses real-time detections to investigate suspicious email.

    After a phishing wave, the CISO sets new requirements:

    - Analysts must see related phishing messages grouped as campaigns across all mailboxes.
    - Suspicious email clusters and compromised users must be investigated automatically, and analysts must be able to approve the remediation actions from Microsoft Defender XDR.

    You need to recommend a solution that meets the requirements. The solution must minimize the number of new products to deploy.

    What should you recommend?
  fr: |
    Wingtip Toys compte 4 000 utilisateurs Microsoft 365. Chaque utilisateur dispose d'une licence Microsoft Defender for Office 365 Plan 1, et l'équipe des opérations de sécurité utilise les détections en temps réel pour investiguer les e-mails suspects.

    Après une vague de hameçonnage, le RSSI fixe de nouvelles exigences :

    - Les analystes doivent voir les messages de hameçonnage liés regroupés en campagnes dans toutes les boîtes aux lettres.
    - Les groupes d'e-mails suspects et les utilisateurs compromis doivent être investigués automatiquement, et les analystes doivent pouvoir approuver les actions de correction depuis Microsoft Defender XDR.

    Vous devez recommander une solution qui respecte les exigences. La solution doit réduire au minimum le nombre de nouveaux produits à déployer.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Defender for Endpoint Plan 2 for all users", fr: "Microsoft Defender for Endpoint Plan 2 pour tous les utilisateurs" } }
    - { id: b, text: { en: "Microsoft Sentinel with playbooks that remediate email", fr: "Microsoft Sentinel avec des playbooks qui corrigent les e-mails" } }
    - { id: c, text: { en: "Microsoft Defender for Cloud Apps with app connectors", fr: "Microsoft Defender for Cloud Apps avec des connecteurs d'applications" } }
    - { id: d, text: { en: "Microsoft Defender for Office 365 Plan 2 for all users", fr: "Microsoft Defender for Office 365 Plan 2 pour tous les utilisateurs" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Defender for Office 365 Plan 2 adds campaign views, Threat Explorer, Threat Trackers and automated investigation and response (AIR) for email clusters and compromised users, with remediation actions approved in Defender XDR. Plan 1 only provides real-time detections. Moving the users to Plan 2 stays within the same product.
    fr: |-
      Defender for Office 365 Plan 2 ajoute les vues de campagnes, Threat Explorer, Threat Trackers et l'investigation et la réponse automatisées (AIR) pour les groupes d'e-mails et les utilisateurs compromis, avec des actions de correction approuvées dans Defender XDR. Le Plan 1 ne fournit que les détections en temps réel. Passer les utilisateurs au Plan 2 reste dans le même produit.
  options:
    a:
      en: |-
        Defender for Endpoint Plan 2 automates investigations on devices; it doesn't group phishing messages into campaigns or remediate mailboxes.
      fr: |-
        Defender for Endpoint Plan 2 automatise les investigations sur les appareils ; il ne regroupe pas les messages de hameçonnage en campagnes et ne corrige pas les boîtes aux lettres.
    b:
      en: |-
        Sentinel playbooks are a new product to deploy and build, and they don't provide the campaign views of Defender for Office 365.
      fr: |-
        Les playbooks Sentinel sont un nouveau produit à déployer et à construire, et ils ne fournissent pas les vues de campagnes de Defender for Office 365.
    c:
      en: |-
        Defender for Cloud Apps protects SaaS apps and OAuth usage; it doesn't investigate email campaigns.
      fr: |-
        Defender for Cloud Apps protège les applications SaaS et l'usage OAuth ; il n'investigue pas les campagnes d'e-mails.
references:
  - title: Microsoft Defender for Office 365 overview
    url: https://learn.microsoft.com/en-us/defender-office-365/mdo-about
