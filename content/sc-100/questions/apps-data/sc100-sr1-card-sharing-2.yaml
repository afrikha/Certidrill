id: sc100-sr1-card-sharing-2
objective: "4.1.4"
type: series_yesno
series: sc100-sr1-card-sharing
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You recommend an Insider Risk Management policy for data leaks.
  fr: Vous recommandez une stratégie de gestion des risques internes pour les fuites de données.
body:
  solution:
    en: |
      You recommend a Microsoft Purview **Insider Risk Management** policy based on the **Data leaks** template, scoped to the finance department, with indicators for sharing files and sending emails that contain sensitive information outside the organization. Analysts review the alerts and send notices to the employees.
    fr: |
      Vous recommandez une stratégie de **gestion des risques internes** Microsoft Purview basée sur le modèle **Data leaks**, limitée au service financier, avec des indicateurs pour le partage de fichiers et l'envoi d'e-mails contenant des informations sensibles à l'extérieur de l'organisation. Les analystes examinent les alertes et envoient des avis aux employés.
answer: { value: false }
explanation:
  correct:
    en: Insider Risk Management detects risky activity, raises alerts, and supports investigation and notices after the fact. It doesn't stop the email or the share at the time of the action, so card numbers can still reach external partners; real-time blocking with policy tips is a DLP capability.
    fr: "La gestion des risques internes détecte les activités à risque, génère des alertes et permet l'investigation et l'envoi d'avis a posteriori. Elle n'arrête pas l'e-mail ou le partage au moment de l'action : des numéros de carte peuvent donc encore parvenir aux partenaires externes ; le blocage en temps réel avec conseils de stratégie est une fonctionnalité de la DLP."
references:
  - title: Learn about Insider Risk Management
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management
