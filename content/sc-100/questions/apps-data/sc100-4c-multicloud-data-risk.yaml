id: sc100-4c-multicloud-data-risk
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank stores customer data in Azure Storage accounts, Azure SQL databases, Amazon S3 buckets and Amazon RDS databases. The Azure subscriptions and the AWS accounts are already connected to Microsoft Defender for Cloud.

    The security team must prioritize the remediation of misconfigurations by data sensitivity. The team must also see which internet-exposed compute resources could be used to move laterally to sensitive data stores in both clouds. The solution must use the same sensitive information types as the Microsoft Purview deployment and minimize the number of products.

    What should you recommend?
  fr: |
    Woodgrove Bank stocke des données clients dans des comptes Stockage Azure, des bases de données Azure SQL, des compartiments Amazon S3 et des bases de données Amazon RDS. Les abonnements Azure et les comptes AWS sont déjà connectés à Microsoft Defender for Cloud.

    L'équipe de sécurité doit hiérarchiser la correction des mauvaises configurations selon la sensibilité des données. Elle doit aussi voir quelles ressources de calcul exposées à Internet pourraient servir à se déplacer latéralement vers des magasins de données sensibles dans les deux clouds. La solution doit utiliser les mêmes types d'informations sensibles que le déploiement Microsoft Purview et réduire au minimum le nombre de produits.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Purview Data Security Posture Management with data risk assessments", fr: "La gestion de la posture de sécurité des données de Microsoft Purview avec des évaluations des risques liés aux données" } }
    - { id: b, text: { en: "Defender for Storage and Defender for Databases on every subscription and AWS account", fr: "Defender for Storage et Defender for Databases sur chaque abonnement et chaque compte AWS" } }
    - { id: c, text: { en: "Defender CSPM with the sensitive data discovery extension and attack path analysis", fr: "Defender CSPM avec l'extension de découverte des données sensibles et l'analyse des chemins d'attaque" } }
    - { id: d, text: { en: "Microsoft Purview Data Map scans of every data source with classification rules", fr: "Des analyses Microsoft Purview Data Map de chaque source de données avec des règles de classification" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Defender CSPM sensitive data discovery samples object stores and databases across clouds with the Purview classification engine and its sensitive information types. It feeds attack path analysis, which shows internet-exposed VMs that can reach sensitive data stores, and prioritizes recommendations by data sensitivity.
    fr: |-
      La découverte des données sensibles de Defender CSPM échantillonne les magasins d'objets et les bases de données des différents clouds avec le moteur de classification de Purview et ses types d'informations sensibles. Elle alimente l'analyse des chemins d'attaque, qui montre les machines virtuelles exposées à Internet capables d'atteindre des magasins de données sensibles, et hiérarchise les recommandations selon la sensibilité des données.
  options:
    a:
      en: |-
        Purview DSPM prioritizes data risks from user activity and data security policies; it doesn't analyze cloud misconfigurations or lateral movement paths from exposed compute.
      fr: |-
        Purview DSPM hiérarchise les risques liés aux données à partir de l'activité des utilisateurs et des stratégies de sécurité des données ; il n'analyse pas les mauvaises configurations cloud ni les chemins de déplacement latéral depuis des ressources de calcul exposées.
    b:
      en: |-
        These workload protection plans detect active threats; they don't model attack paths or prioritize posture recommendations.
      fr: |-
        Ces plans de protection des charges de travail détectent les menaces actives ; ils ne modélisent pas les chemins d'attaque et ne hiérarchisent pas les recommandations de posture.
    d:
      en: |-
        Data Map catalogs and classifies data, but it has no view of network exposure or attack paths.
      fr: |-
        Data Map catalogue et classe les données, mais n'a aucune vue de l'exposition réseau ni des chemins d'attaque.
references:
  - title: Overview - About data security posture management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-data-security-posture
