id: sc100-sr1-card-sharing-3
objective: "4.1.4"
type: series_yesno
series: sc100-sr1-card-sharing
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You recommend a custom DLP policy that uses the Credit card number sensitive information type.
  fr: Vous recommandez une stratégie DLP personnalisée qui utilise le type d'informations sensibles Credit card number.
body:
  solution:
    en: |
      You recommend a Microsoft Purview **DLP** policy created from the **Custom** template, applied to the Exchange email, SharePoint sites, OneDrive accounts, and Teams chat and channel messages locations. One rule detects the **Credit card number** sensitive information type in content shared with people outside the organization, blocks the action, and shows a policy tip to the user.
    fr: |
      Vous recommandez une stratégie **DLP** Microsoft Purview créée à partir du modèle **Custom**, appliquée aux emplacements Exchange email, SharePoint sites, OneDrive accounts et Teams chat and channel messages. Une règle détecte le type d'informations sensibles **Credit card number** dans le contenu partagé avec des personnes extérieures à l'organisation, bloque l'action et affiche un conseil de stratégie à l'utilisateur.
answer: { value: true }
explanation:
  correct:
    en: A template only preloads sensitive information types and rules; a custom policy with the Credit card number type detects the same data. The policy covers the four channels, blocks only external sharing, and notifies the user with a policy tip, so it meets every requirement.
    fr: "Un modèle ne fait que précharger des types d'informations sensibles et des règles ; une stratégie personnalisée avec le type Credit card number détecte les mêmes données. La stratégie couvre les quatre canaux, bloque uniquement le partage externe et informe l'utilisateur par un conseil de stratégie : elle répond donc à toutes les exigences."
references:
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
