id: sc100-4c-partner-sas-revoke
objective: "4.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. shares delivery reports with partners from a blob container in a storage account named stpartners. Shared Key authorization is disallowed on stpartners, and internal applications use managed identities.

    Partners can't use Microsoft Entra identities from Contoso's tenant, so they need time-limited URLs to download the reports. If a partner reports a leaked URL, the security team must be able to invalidate all outstanding partner URLs immediately, without re-enabling Shared Key and without affecting the internal applications.

    What should you recommend?
  fr: |
    Contoso, Ltd. partage des rapports de livraison avec des partenaires depuis un conteneur d'objets blob d'un compte de stockage nommé stpartners. L'autorisation Shared Key est interdite sur stpartners, et les applications internes utilisent des identités managées.

    Les partenaires ne peuvent pas utiliser d'identités Microsoft Entra du locataire de Contoso : ils ont donc besoin d'URL limitées dans le temps pour télécharger les rapports. Si un partenaire signale une URL divulguée, l'équipe de sécurité doit pouvoir invalider immédiatement toutes les URL partenaires en cours, sans réactiver Shared Key et sans affecter les applications internes.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "User delegation SAS tokens, and revoke the user delegation keys of the account to revoke them", fr: "Des jetons SAS de délégation d'utilisateur, et révoquer les clés de délégation d'utilisateur du compte pour les révoquer" } }
    - { id: b, text: { en: "Account SAS tokens with a short expiry time, and rotate the account keys to revoke them", fr: "Des jetons SAS de compte avec un délai d'expiration court, et faire tourner les clés de compte pour les révoquer" } }
    - { id: c, text: { en: "Service SAS tokens that reference a stored access policy on the container, and delete the policy to revoke them", fr: "Des jetons SAS de service qui référencent une stratégie d'accès stockée sur le conteneur, et supprimer la stratégie pour les révoquer" } }
    - { id: d, text: { en: "Anonymous read access on the container, and change it to private to revoke access", fr: "L'accès en lecture anonyme sur le conteneur, et le repasser en privé pour révoquer l'accès" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A user delegation SAS is signed with a user delegation key obtained with Microsoft Entra credentials, so it keeps working when Shared Key is disallowed. Revoking the user delegation keys invalidates every user delegation SAS signed with them at once, while managed identities keep using Microsoft Entra authorization.
    fr: |-
      Une SAS de délégation d'utilisateur est signée avec une clé de délégation d'utilisateur obtenue grâce aux informations d'identification Microsoft Entra : elle continue de fonctionner quand Shared Key est interdite. Révoquer les clés de délégation d'utilisateur invalide d'un coup toutes les SAS de délégation d'utilisateur signées avec elles, tandis que les identités managées continuent d'utiliser l'autorisation Microsoft Entra.
  options:
    b:
      en: |-
        An account SAS is also signed with an account key and is denied while Shared Key is disallowed.
      fr: |-
        Une SAS de compte est elle aussi signée avec une clé de compte et elle est refusée tant que Shared Key est interdite.
    c:
      en: |-
        A service SAS is signed with an account key, so Azure Storage denies it while Shared Key is disallowed.
      fr: |-
        Une SAS de service est signée avec une clé de compte : Stockage Azure la refuse tant que Shared Key est interdite.
    d:
      en: |-
        Anonymous access isn't time-limited and exposes the reports to anyone who finds the URL.
      fr: |-
        L'accès anonyme n'est pas limité dans le temps et expose les rapports à quiconque trouve l'URL.
references:
  - title: Create a user delegation SAS
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
