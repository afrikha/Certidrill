id: sc100-4a-purview-label-at-rest
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has Microsoft 365 E5. SharePoint Online and OneDrive already contain about 4 million Office documents, some of which include passport numbers. Many of these files haven't been opened for years. A sensitivity label named **Restricted** exists but has been applied manually to only a few files.

    Requirements:

    - Existing files that contain passport numbers must receive the Restricted label without any user action.
    - Users must be blocked when they try to share files that contain passport numbers with people outside Adatum.

    Which two solutions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose de Microsoft 365 E5. SharePoint Online et OneDrive contiennent déjà environ 4 millions de documents Office, dont certains incluent des numéros de passeport. Beaucoup de ces fichiers n'ont pas été ouverts depuis des années. Une étiquette de confidentialité nommée **Restricted** existe, mais elle n'a été appliquée manuellement qu'à quelques fichiers.

    Exigences :

    - Les fichiers existants qui contiennent des numéros de passeport doivent recevoir l'étiquette Restricted sans aucune action de l'utilisateur.
    - Les utilisateurs doivent être bloqués quand ils tentent de partager avec des personnes extérieures à Adatum des fichiers qui contiennent des numéros de passeport.

    Quelles sont les deux solutions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Client-side auto-labeling configured in the Restricted label settings", fr: "L'étiquetage automatique côté client configuré dans les paramètres de l'étiquette Restricted" } }
    - { id: b, text: { en: "An auto-labeling policy for SharePoint and OneDrive that applies Restricted", fr: "Une stratégie d'étiquetage automatique pour SharePoint et OneDrive qui applique Restricted" } }
    - { id: c, text: { en: "A DLP policy for SharePoint and OneDrive that blocks external sharing of matching files", fr: "Une stratégie DLP pour SharePoint et OneDrive qui bloque le partage externe des fichiers correspondants" } }
    - { id: d, text: { en: "A retention label policy that applies a label to files with passport numbers", fr: "Une stratégie d'étiquettes de rétention qui applique une étiquette aux fichiers contenant des numéros de passeport" } }
    - { id: e, text: { en: "A sensitivity label for containers applied to every SharePoint site", fr: "Une étiquette de confidentialité pour les conteneurs appliquée à chaque site SharePoint" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      A service-side auto-labeling policy runs in SharePoint and OneDrive, needs no user interaction and can label existing files at rest, after a mandatory simulation. A DLP policy for the SharePoint and OneDrive locations detects the passport numbers, or the label, and blocks sharing with external users.
    fr: |-
      Une stratégie d'étiquetage automatique côté service s'exécute dans SharePoint et OneDrive, ne nécessite aucune interaction de l'utilisateur et peut étiqueter les fichiers existants au repos, après une simulation obligatoire. Une stratégie DLP pour les emplacements SharePoint et OneDrive détecte les numéros de passeport, ou l'étiquette, et bloque le partage avec des utilisateurs externes.
  options:
    a:
      en: |-
        Client-side labeling runs only when users edit documents in Office apps, so files that nobody opens would never be labeled.
      fr: |-
        L'étiquetage côté client ne s'exécute que lorsque les utilisateurs modifient des documents dans les applications Office : les fichiers que personne n'ouvre ne seraient jamais étiquetés.
    d:
      en: |-
        A retention label controls how long files are kept; it isn't the Restricted sensitivity label and doesn't block sharing.
      fr: |-
        Une étiquette de rétention contrôle la durée de conservation des fichiers ; ce n'est pas l'étiquette de confidentialité Restricted et elle ne bloque pas le partage.
    e:
      en: |-
        A container label applies to the site itself, not to each document, and it doesn't detect passport numbers.
      fr: |-
        Une étiquette de conteneur s'applique au site lui-même, pas à chaque document, et elle ne détecte pas les numéros de passeport.
references:
  - title: Automatically apply a sensitivity label to Microsoft 365 data
    url: https://learn.microsoft.com/en-us/purview/apply-sensitivity-label-automatically
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
