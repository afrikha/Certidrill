id: sc100-4a-mdo-mdca-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is evaluating Microsoft Defender for Office 365 Plan 1 and Microsoft Defender for Cloud Apps for its Microsoft 365 tenant. Employees use Microsoft Edge and Google Chrome on their computers, and collaborate in Teams, SharePoint and OneDrive.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. évalue Microsoft Defender for Office 365 Plan 1 et Microsoft Defender for Cloud Apps pour son locataire Microsoft 365. Les employés utilisent Microsoft Edge et Google Chrome sur leurs ordinateurs, et collaborent dans Teams, SharePoint et OneDrive.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          With Plan 1, Safe Attachments can protect files that users share in SharePoint, OneDrive and Teams.
        fr: |-
          Avec le Plan 1, les Pièces jointes fiables peuvent protéger les fichiers que les utilisateurs partagent dans SharePoint, OneDrive et Teams.
    - id: s2
      text:
        en: |-
          Plan 1 includes Attack simulation training to run phishing simulations for users.
        fr: |-
          Le Plan 1 inclut la formation à la simulation d'attaque pour exécuter des simulations de hameçonnage auprès des utilisateurs.
    - id: s3
      text:
        en: |-
          For users of Microsoft Edge, Conditional Access app control protects sessions without adding the .mcas.ms suffix to the app URL.
        fr: |-
          Pour les utilisateurs de Microsoft Edge, le contrôle d'application par accès conditionnel protège les sessions sans ajouter le suffixe .mcas.ms à l'URL de l'application.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Plan 1 includes Safe Attachments for email and for files in SharePoint, OneDrive and Teams. Attack simulation training is a Plan 2 capability. Browsers other than Edge are redirected through a reverse proxy that adds the .mcas.ms suffix, whereas Edge users get in-browser protection without redirection.
    fr: |-
      Le Plan 1 inclut les Pièces jointes fiables pour les e-mails et pour les fichiers de SharePoint, OneDrive et Teams. La formation à la simulation d'attaque est une fonctionnalité du Plan 2. Les navigateurs autres qu'Edge sont redirigés par un proxy inverse qui ajoute le suffixe .mcas.ms, tandis que les utilisateurs d'Edge bénéficient de la protection intégrée au navigateur, sans redirection.
references:
  - title: Microsoft Defender for Office 365 overview
    url: https://learn.microsoft.com/en-us/defender-office-365/mdo-about
  - title: Conditional Access app control
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad
