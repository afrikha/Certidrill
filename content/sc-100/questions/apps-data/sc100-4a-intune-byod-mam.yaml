id: sc100-4a-intune-byod-mam
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys allows sales staff to read corporate email and Teams messages on their personal iOS and Android phones. The staff refuse to enroll their phones in any device management solution.

    Security requirements:

    - Corporate data must not be copied or saved into personal apps on the phones.
    - Access to corporate data must require a PIN in the work apps.
    - When an employee leaves, only corporate data must be removed from the phone.

    What should you recommend?
  fr: |
    Tailspin Toys autorise le personnel commercial à lire la messagerie d'entreprise et les messages Teams sur ses téléphones personnels iOS et Android. Les employés refusent d'inscrire leurs téléphones dans une solution de gestion des appareils.

    Exigences de sécurité :

    - Les données de l'entreprise ne doivent pas être copiées ni enregistrées dans des applications personnelles des téléphones.
    - L'accès aux données de l'entreprise doit exiger un code PIN dans les applications professionnelles.
    - Quand un employé quitte l'entreprise, seules les données de l'entreprise doivent être supprimées du téléphone.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Intune compliance policies and a Conditional Access policy that requires a compliant device", fr: "Des stratégies de conformité Intune et une stratégie d'accès conditionnel qui exige un appareil conforme" } }
    - { id: b, text: { en: "Intune device configuration profiles and a Conditional Access policy that requires a Microsoft Entra hybrid joined device", fr: "Des profils de configuration d'appareil Intune et une stratégie d'accès conditionnel qui exige un appareil joint hybride Microsoft Entra" } }
    - { id: c, text: { en: "Intune app protection policies and a Conditional Access policy that requires an app protection policy", fr: "Des stratégies de protection des applications Intune et une stratégie d'accès conditionnel qui exige une stratégie de protection des applications" } }
    - { id: d, text: { en: "Defender for Cloud Apps session policies and a Conditional Access policy that uses app-enforced restrictions", fr: "Des stratégies de session Defender for Cloud Apps et une stratégie d'accès conditionnel qui utilise les restrictions appliquées par l'application" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Intune app protection policies (mobile application management) protect corporate data inside the work apps without requiring device enrollment: they can block copy and save to personal apps, require a PIN, and selectively wipe only the company data. Conditional Access enforces that only apps protected by such a policy reach the data.
    fr: |-
      Les stratégies de protection des applications Intune (gestion des applications mobiles) protègent les données de l'entreprise dans les applications professionnelles sans exiger l'inscription de l'appareil : elles peuvent bloquer la copie et l'enregistrement vers les applications personnelles, exiger un code PIN et effacer de façon sélective les seules données de l'entreprise. L'accès conditionnel garantit que seules les applications protégées par une telle stratégie accèdent aux données.
  options:
    a:
      en: |-
        Compliance policies evaluate devices enrolled in Intune; unenrolled personal phones would never be marked as compliant.
      fr: |-
        Les stratégies de conformité évaluent des appareils inscrits dans Intune ; des téléphones personnels non inscrits ne seraient jamais marqués comme conformes.
    b:
      en: |-
        Configuration profiles require enrollment, and phones can't be Microsoft Entra hybrid joined.
      fr: |-
        Les profils de configuration exigent l'inscription, et des téléphones ne peuvent pas être joints hybrides Microsoft Entra.
    d:
      en: |-
        Session policies control browser sessions; they don't protect data inside the mobile Outlook and Teams apps or wipe it selectively.
      fr: |-
        Les stratégies de session contrôlent des sessions de navigateur ; elles ne protègent pas les données dans les applications mobiles Outlook et Teams et ne les effacent pas de façon sélective.
references:
  - title: App Protection Policies Overview
    url: https://learn.microsoft.com/en-us/intune/intune-service/apps/app-protection-policy
