id: sc100-4b-trainable-classifier
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. stores thousands of statements of work in SharePoint Online and OneDrive. The documents are written by different teams with different templates and don't contain any consistent number format or keyword.

    You need to recommend a classification method that Microsoft Purview can use to automatically apply a sensitivity label to these documents. You have a large set of sample statements of work and of unrelated documents.

    What should you recommend?
  fr: |
    Contoso, Ltd. stocke des milliers de cahiers des charges de prestation (statements of work) dans SharePoint Online et OneDrive. Les documents sont rédigés par différentes équipes avec différents modèles et ne contiennent aucun format de numéro ni mot clé cohérent.

    Vous devez recommander une méthode de classification que Microsoft Purview peut utiliser pour appliquer automatiquement une étiquette de confidentialité à ces documents. Vous disposez d'un grand ensemble d'exemples de cahiers des charges et de documents sans rapport.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A custom sensitive information type based on a regular expression", fr: "Un type d'informations sensibles personnalisé fondé sur une expression régulière" } }
    - { id: b, text: { en: "A custom trainable classifier", fr: "Un classifieur entraînable personnalisé" } }
    - { id: c, text: { en: "An exact data match sensitive information type", fr: "Un type d'informations sensibles à correspondance exacte des données (EDM)" } }
    - { id: d, text: { en: "A keyword dictionary sensitive information type", fr: "Un type d'informations sensibles de type dictionnaire de mots clés" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Trainable classifiers identify content by example rather than by pattern, which suits content that pattern matching can't identify. You train a custom classifier with positive and negative samples, then use it as a condition to auto-label Office files with a sensitivity label.
    fr: |
      Les classifieurs entraînables identifient le contenu par l'exemple plutôt que par un modèle, ce qui convient au contenu que la recherche de modèles ne peut pas identifier. Vous entraînez un classifieur personnalisé avec des exemples positifs et négatifs, puis vous l'utilisez comme condition pour appliquer automatiquement une étiquette de confidentialité aux fichiers Office.
  options:
    a:
      en: A regular expression needs a consistent pattern, which these documents don't have.
      fr: Une expression régulière exige un modèle cohérent, que ces documents n'ont pas.
    c:
      en: Exact data match finds exact values from a structured table of sensitive records; it doesn't recognize a category of documents.
      fr: La correspondance exacte des données trouve les valeurs exactes d'une table structurée d'enregistrements sensibles ; elle ne reconnaît pas une catégorie de documents.
    d:
      en: A keyword dictionary relies on keywords, and the documents don't share consistent keywords.
      fr: Un dictionnaire de mots clés repose sur des mots clés, et les documents ne partagent pas de mots clés cohérents.
references:
  - title: Learn about trainable classifiers
    url: https://learn.microsoft.com/en-us/purview/trainable-classifiers-learn-about
