id: sc100-4a-intune-windows-plan
objective: "4.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders manages 9,000 Windows devices with Configuration Manager. The devices are Microsoft Entra hybrid joined. Northwind bought Microsoft 365 E5 and plans its device management strategy:

    - New Windows laptops must be shipped directly from the vendor to employees and be configured automatically at first sign-in, without IT handling them.
    - Existing devices must keep Configuration Manager for application deployment for two more years, while compliance policies move to Intune so that Conditional Access can use device compliance.
    - All Windows devices must receive the group of Windows settings recommended by Microsoft security teams, with minimal design effort.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders gère 9 000 appareils Windows avec Configuration Manager. Les appareils sont joints hybrides Microsoft Entra. Northwind a acheté Microsoft 365 E5 et prépare sa stratégie de gestion des appareils :

    - Les nouveaux portables Windows doivent être expédiés directement du fournisseur aux employés et être configurés automatiquement à la première connexion, sans manipulation par l'informatique.
    - Les appareils existants doivent conserver Configuration Manager pour le déploiement des applications pendant encore deux ans, tandis que les stratégies de conformité passent à Intune afin que l'accès conditionnel puisse utiliser la conformité des appareils.
    - Tous les appareils Windows doivent recevoir l'ensemble de paramètres Windows recommandés par les équipes de sécurité de Microsoft, avec un effort de conception minimal.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      New laptops: [[new]]

      Existing devices: [[existing]]

      Recommended Windows settings: [[settings]]
    fr: |
      Nouveaux portables : [[new]]

      Appareils existants : [[existing]]

      Paramètres Windows recommandés : [[settings]]
  slots:
    - id: new
      options:
        - { id: autopilot, text: Windows Autopilot }
        - { id: bulk, text: { en: "Bulk enrollment with a provisioning package applied by IT", fr: "L'inscription en bloc avec un package de provisionnement appliqué par l'informatique" } }
        - { id: imaging, text: { en: "A Configuration Manager task sequence image", fr: "Une image de séquence de tâches Configuration Manager" } }
    - id: existing
      options:
        - { id: comgmt, text: { en: "Co-management with the compliance policies workload switched to Intune", fr: "La cogestion avec la charge de travail des stratégies de conformité basculée vers Intune" } }
        - { id: tenant, text: { en: "Tenant attach without Intune enrollment", fr: "L'attachement de locataire sans inscription dans Intune" } }
        - { id: reimage, text: { en: "Reset the devices and enroll them in Intune only", fr: "Réinitialiser les appareils et les inscrire dans Intune uniquement" } }
    - id: settings
      options:
        - { id: custom, text: { en: "Custom device configuration profiles built from the settings catalog", fr: "Des profils de configuration d'appareil personnalisés créés depuis le catalogue de paramètres" } }
        - { id: baseline, text: { en: "Intune security baselines", fr: "Les bases de référence de sécurité Intune" } }
        - { id: compliance, text: { en: "Intune compliance policies", fr: "Les stratégies de conformité Intune" } }
answer:
  values: { new: autopilot, existing: comgmt, settings: baseline }
explanation:
  correct:
    en: |-
      Windows Autopilot provisions new devices shipped directly to users, with configuration applied at first sign-in. Co-management lets Configuration Manager and Intune manage the same Windows devices: you switch only the compliance policies workload to Intune, which brings Conditional Access with device compliance, and Configuration Manager keeps the other workloads. Security baselines are preconfigured groups of Windows settings recommended by Microsoft security teams.
    fr: |-
      Windows Autopilot provisionne les nouveaux appareils expédiés directement aux utilisateurs, avec une configuration appliquée à la première connexion. La cogestion permet à Configuration Manager et à Intune de gérer les mêmes appareils Windows : vous ne basculez vers Intune que la charge de travail des stratégies de conformité, ce qui apporte l'accès conditionnel fondé sur la conformité des appareils, et Configuration Manager conserve les autres charges de travail. Les bases de référence de sécurité sont des ensembles préconfigurés de paramètres Windows recommandés par les équipes de sécurité de Microsoft.
  options:
    tenant:
      en: |-
        Tenant attach uploads devices to the admin center for cloud actions, but without Intune enrollment the devices don't get Intune compliance policies.
      fr: |-
        L'attachement de locataire charge les appareils dans le centre d'administration pour des actions cloud, mais sans inscription dans Intune les appareils ne reçoivent pas les stratégies de conformité Intune.
    custom:
      en: |-
        Custom profiles would require designing every setting yourself instead of using Microsoft's recommended group.
      fr: |-
        Des profils personnalisés obligeraient à concevoir chaque paramètre vous-même au lieu d'utiliser l'ensemble recommandé par Microsoft.
references:
  - title: Co-management for Windows devices
    url: https://learn.microsoft.com/en-us/intune/configmgr/comanage/overview
