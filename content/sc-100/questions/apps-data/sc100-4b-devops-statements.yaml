id: sc100-4b-devops-statements
objective: "4.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. hosts code in Azure Repos and GitLab. You are evaluating GitHub Advanced Security for Azure DevOps and Microsoft Defender for Cloud DevOps security as part of the standards for the development process.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. héberge son code dans Azure Repos et GitLab. Vous évaluez GitHub Advanced Security for Azure DevOps et la sécurité DevOps de Microsoft Defender for Cloud dans le cadre des normes du processus de développement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When push protection is enabled on a repository, secrets committed before it was enabled are found by secret scanning repository scanning.
        fr: Lorsque la protection des envois est activée sur un dépôt, les secrets commités avant son activation sont trouvés par l'analyse des secrets du dépôt.
    - id: s2
      text:
        en: In GitHub Advanced Security for Azure DevOps, secret scanning is included in the Code Security product.
        fr: Dans GitHub Advanced Security for Azure DevOps, l'analyse des secrets est incluse dans le produit Code Security.
    - id: s3
      text:
        en: Defender for Cloud DevOps security can show the findings of both the Azure Repos and the GitLab repositories in one console.
        fr: La sécurité DevOps de Defender for Cloud peut afficher les résultats des dépôts Azure Repos et GitLab dans une même console.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Push protection evaluates only pushes made after it's enabled; repository scanning runs in the background and alerts on existing secrets, including those in historical commits. Secret scanning and push protection belong to the Secret Protection product, while Code Security contains dependency alerts and CodeQL code scanning. Defender for Cloud DevOps security supports Azure DevOps, GitHub and GitLab and centralizes their findings in one console.
    fr: |
      La protection des envois n'évalue que les envois effectués après son activation ; l'analyse du dépôt s'exécute en arrière-plan et alerte sur les secrets existants, y compris dans l'historique. L'analyse des secrets et la protection des envois appartiennent au produit Secret Protection, tandis que Code Security contient les alertes de dépendances et l'analyse du code CodeQL. La sécurité DevOps de Defender for Cloud prend en charge Azure DevOps, GitHub et GitLab et centralise leurs résultats dans une même console.
references:
  - title: Configure GitHub Advanced Security for Azure DevOps features
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features
  - title: Overview of Microsoft Defender for Cloud DevOps security
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-devops-introduction
