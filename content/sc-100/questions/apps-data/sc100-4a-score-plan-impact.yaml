id: sc100-4a-score-plan-impact
objective: "4.1.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Secure Score to prioritize work on its Microsoft 365 tenant. Security defaults are turned off. The security team prepared the plan shown in the following table for three recommended actions. No other change is planned.

    Answer each prompt by selecting the recommended action.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise le Niveau de sécurité Microsoft pour hiérarchiser le travail sur son locataire Microsoft 365. Les paramètres de sécurité par défaut sont désactivés. L'équipe de sécurité a préparé le plan présenté dans le tableau suivant pour trois actions recommandées. Aucune autre modification n'est prévue.

    Répondez à chaque consigne en sélectionnant l'action recommandée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which planned change will increase Microsoft Secure Score the most?", fr: "Quelle modification planifiée augmentera le plus le Niveau de sécurité Microsoft ?" }
    - id: p2
      text: { en: "Which planned change will not increase Microsoft Secure Score?", fr: "Quelle modification planifiée n'augmentera pas le Niveau de sécurité Microsoft ?" }
  grid:
    header: [{ en: "Recommended action", fr: "Action recommandée" }, { en: "Points achieved", fr: "Points obtenus" }, { en: "Maximum points", fr: "Points maximum" }, { en: "Planned change", fr: "Modification planifiée" }]
    rows:
      - - { text: Ensure all users can complete multifactor authentication for secure access, area: mfa-all }
        - { text: { en: "4.5", fr: "4,5" } }
        - { text: "9" }
        - { text: { en: "Register the remaining half of the users for MFA", fr: "Inscrire à la MFA la moitié restante des utilisateurs" } }
      - - { text: Enable policy to block legacy authentication, area: legacy }
        - { text: "0" }
        - { text: "7" }
        - { text: { en: "Set the status to Risk accepted because a legacy application still needs basic authentication", fr: "Définir le statut sur Risk accepted, car une application héritée a encore besoin de l'authentification de base" } }
      - - { text: Require MFA for administrative roles, area: mfa-admin }
        - { text: "0" }
        - { text: "10" }
        - { text: { en: "Create a Conditional Access policy that requires MFA for all administrative roles", fr: "Créer une stratégie d'accès conditionnel qui exige la MFA pour tous les rôles d'administration" } }
answer:
  values: { p1: mfa-admin, p2: legacy }
explanation:
  correct:
    en: |-
      Implementing an action earns the points it still lacks. Requiring MFA for every administrative role completes a 10-point action that has 0 points today, so it adds 10 points, while registering the remaining users completes a partial action and adds only the missing 4.5 points. Setting a status to Risk accepted records the decision not to implement the action and awards no points, so the legacy authentication action stays at 0.
    fr: |-
      Implémenter une action rapporte les points qui lui manquent encore. Exiger la MFA pour tous les rôles d'administration termine une action à 10 points qui en compte 0 aujourd'hui, ce qui ajoute 10 points, tandis qu'inscrire les utilisateurs restants termine une action partielle et n'ajoute que les 4,5 points manquants. Définir le statut sur Risk accepted enregistre la décision de ne pas implémenter l'action et n'accorde aucun point : l'action sur l'authentification héritée reste à 0.
  options:
    mfa-all:
      en: |-
        This action already earns 4.5 of its 9 points in proportion to the users covered; completing it adds 4.5 points, less than the administrator MFA action.
      fr: |-
        Cette action obtient déjà 4,5 de ses 9 points, en proportion des utilisateurs couverts ; la terminer ajoute 4,5 points, moins que l'action sur la MFA des administrateurs.
references:
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
  - title: Assess your security posture through Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-improvement-actions
