id: sc100-4a-score-reporting-map
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft 365 E5 subscription that includes Microsoft Defender for Cloud Apps. Sales teams also use a Salesforce tenant that authenticates through Microsoft Entra ID.

    The security architect must define the metrics of a quarterly posture report for the productivity and collaboration workloads:

    - Show the progress of Microsoft 365 controls toward ISO/IEC 27001.
    - Show the score that the organization will reach once the actions scheduled for next quarter are done.
    - Include the security configuration of the Salesforce tenant in Microsoft Secure Score.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un abonnement Microsoft 365 E5 qui inclut Microsoft Defender for Cloud Apps. Les équipes commerciales utilisent aussi un locataire Salesforce qui s'authentifie par Microsoft Entra ID.

    L'architecte sécurité doit définir les métriques d'un rapport de posture trimestriel pour les charges de travail de productivité et de collaboration :

    - Montrer la progression des contrôles Microsoft 365 vers ISO/IEC 27001.
    - Montrer le score que l'organisation atteindra une fois réalisées les actions prévues le trimestre prochain.
    - Inclure la configuration de sécurité du locataire Salesforce dans le Niveau de sécurité Microsoft.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Progress toward ISO/IEC 27001: [[reg]]

      Score after the scheduled actions: [[plan]]

      Salesforce configuration in Secure Score: [[saas]]
    fr: |
      Progression vers ISO/IEC 27001 : [[reg]]

      Score après les actions prévues : [[plan]]

      Configuration de Salesforce dans le Niveau de sécurité Microsoft : [[saas]]
  slots:
    - id: reg
      options:
        - { id: compliance, text: { en: "An assessment in Microsoft Purview Compliance Manager and its compliance score", fr: "Une évaluation dans Microsoft Purview Compliance Manager et son score de conformité" } }
        - { id: mdc, text: { en: "The ISO 27001 standard in the regulatory compliance dashboard of Defender for Cloud", fr: "La norme ISO 27001 dans le tableau de bord de conformité réglementaire de Defender for Cloud" } }
        - { id: secure, text: { en: "A custom comparison in Microsoft Secure Score", fr: "Une comparaison personnalisée dans le Niveau de sécurité Microsoft" } }
    - id: plan
      options:
        - { id: todo, text: { en: "Set the scheduled actions to To address and use History", fr: "Définir les actions prévues sur To address et utiliser l'historique" } }
        - { id: planned, text: { en: "Set the scheduled actions to Planned and use the planned score view", fr: "Définir les actions prévues sur Planned et utiliser la vue du score planifié" } }
        - { id: risk, text: { en: "Set the other actions to Risk accepted and use Metrics & trends", fr: "Définir les autres actions sur Risk accepted et utiliser Metrics & trends" } }
    - id: saas
      options:
        - { id: discovery, text: { en: "Cloud Discovery of Salesforce traffic in Defender for Cloud Apps", fr: "La découverte cloud (Cloud Discovery) du trafic Salesforce dans Defender for Cloud Apps" } }
        - { id: connector, text: { en: "A Defender for Cloud Apps app connector for Salesforce with security recommendations turned on", fr: "Un connecteur d'applications Defender for Cloud Apps pour Salesforce avec les recommandations de sécurité activées" } }
        - { id: caac, text: { en: "Conditional Access app control for Salesforce sessions", fr: "Le contrôle d'application par accès conditionnel pour les sessions Salesforce" } }
answer:
  values: { reg: compliance, plan: planned, saas: connector }
explanation:
  correct:
    en: |-
      Compliance Manager assessments map Microsoft 365 controls to regulations and standards such as ISO/IEC 27001 and measure progress with the compliance score. In Microsoft Secure Score, actions set to Planned feed the planned score view, which projects the score once those actions are completed. SaaS security posture management requires the app to be connected through a Defender for Cloud Apps app connector with security recommendations turned on; its recommendations then appear in Secure Score, filtered by product.
    fr: |-
      Les évaluations de Compliance Manager associent les contrôles Microsoft 365 aux réglementations et aux normes, comme ISO/IEC 27001, et mesurent la progression avec le score de conformité. Dans le Niveau de sécurité Microsoft, les actions définies sur Planned alimentent la vue du score planifié, qui projette le score une fois ces actions réalisées. La gestion de la posture de sécurité SaaS (SSPM) exige que l'application soit connectée par un connecteur d'applications Defender for Cloud Apps avec les recommandations de sécurité activées ; ses recommandations apparaissent ensuite dans le Niveau de sécurité Microsoft, filtrées par produit.
  options:
    mdc:
      en: |-
        The Defender for Cloud regulatory compliance dashboard assesses Azure, AWS and GCP resources, not Microsoft 365 controls.
      fr: |-
        Le tableau de bord de conformité réglementaire de Defender for Cloud évalue des ressources Azure, AWS et GCP, pas des contrôles Microsoft 365.
    risk:
      en: |-
        Risk accepted awards no points for the actions it covers; it doesn't project the score after the scheduled work.
      fr: |-
        Risk accepted n'accorde aucun point pour les actions concernées ; ce statut ne projette pas le score après les travaux prévus.
    discovery:
      en: |-
        Cloud Discovery analyzes traffic logs to find and rate cloud apps; it doesn't read the security configuration of the Salesforce tenant.
      fr: |-
        La découverte cloud analyse les journaux de trafic pour trouver et évaluer les applications cloud ; elle ne lit pas la configuration de sécurité du locataire Salesforce.
references:
  - title: SaaS Security Posture Management (SSPM) in Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/security-saas
  - title: Assess your security posture through Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-improvement-actions
