id: sc100-sr2-dlp-2
objective: "4.1.4"
type: series_yesno
series: sc100-sr2-dlp-card-numbers
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You recommend a DLP policy for the SharePoint and OneDrive locations that blocks people outside the organization.
  fr: |
    Vous recommandez une stratégie DLP pour les emplacements SharePoint et OneDrive qui bloque les personnes extérieures à l'organisation.
body:
  solution:
    en: |
      You recommend a data loss prevention (DLP) policy that applies to the **SharePoint** and **OneDrive** locations. A rule detects the **Credit Card Number** sensitive information type in content shared with people outside the organization, blocks only people outside the organization from accessing the content, and shows a policy tip to the user. You turn on the policy after you test it in simulation mode.
    fr: |
      Vous recommandez une stratégie de protection contre la perte de données (DLP) qui s'applique aux emplacements **SharePoint** et **OneDrive**. Une règle détecte le type d'informations sensibles **Credit Card Number** dans le contenu partagé avec des personnes extérieures à l'organisation, bloque l'accès au contenu uniquement pour les personnes extérieures à l'organisation et affiche un conseil de stratégie à l'utilisateur. Vous activez la stratégie après l'avoir testée en mode simulation.
answer: { value: true }
explanation:
  correct:
    en: |
      DLP scans both existing and new items in SharePoint and OneDrive by using sensitive information types, so no user has to classify anything. For these locations, a rule can block people outside the organization from accessing the matching content and show a policy tip, while internal users and external sharing of other documents are unaffected.
    fr: |
      La DLP analyse les éléments existants et nouveaux dans SharePoint et OneDrive à l'aide des types d'informations sensibles : aucun utilisateur n'a à classer quoi que ce soit. Pour ces emplacements, une règle peut empêcher les personnes extérieures à l'organisation d'accéder au contenu correspondant et afficher un conseil de stratégie, sans affecter les utilisateurs internes ni le partage externe des autres documents.
references:
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
