id: sc100-4a-copilot-usage-rights
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft 365 Copilot and sensitivity labels for SharePoint Online and OneDrive. The board of directors shares strategy documents with the finance team.

    Requirements for the strategy documents:

    - Board members must be able to edit the documents and use Copilot to summarize them.
    - Finance team members must be able to open and read the documents, but they must not be able to copy content from them, and Copilot must not return their content to finance team members.
    - The protection must stay with the documents if they are downloaded.

    What should you recommend?
  fr: |
    Litware, Inc. utilise Microsoft 365 Copilot et les étiquettes de confidentialité pour SharePoint Online et OneDrive. Le conseil d'administration partage des documents de stratégie avec l'équipe financière.

    Exigences pour les documents de stratégie :

    - Les membres du conseil doivent pouvoir modifier les documents et utiliser Copilot pour les résumer.
    - Les membres de l'équipe financière doivent pouvoir ouvrir et lire les documents, mais ils ne doivent pas pouvoir en copier le contenu, et Copilot ne doit pas leur renvoyer ce contenu.
    - La protection doit rester attachée aux documents s'ils sont téléchargés.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A label with encryption that grants board members rights that include EXTRACT, and grants finance members VIEW without EXTRACT", fr: "Une étiquette avec chiffrement qui accorde aux membres du conseil des droits incluant EXTRACT, et aux membres de la finance VIEW sans EXTRACT" } }
    - { id: b, text: { en: "A label without encryption, and a DLP policy for the Copilot location scoped to the finance team that blocks the label", fr: "Une étiquette sans chiffrement, et une stratégie DLP pour l'emplacement Copilot, limitée à l'équipe financière, qui bloque l'étiquette" } }
    - { id: c, text: { en: "A label with encryption that grants both groups VIEW and EXTRACT, and Restricted Content Discovery on the board site", fr: "Une étiquette avec chiffrement qui accorde VIEW et EXTRACT aux deux groupes, et la découverte de contenu restreinte sur le site du conseil" } }
    - { id: d, text: { en: "A label without encryption, and an Insider Risk Management policy from the Risky AI usage template for the finance team", fr: "Une étiquette sans chiffrement, et une stratégie de gestion des risques internes créée à partir du modèle Risky AI usage pour l'équipe financière" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When a label applies encryption, Copilot returns the content only to users who have both the VIEW and EXTRACT usage rights. Granting finance members VIEW without EXTRACT lets them read the documents but not copy from them, and Copilot doesn't use the content for them, while board members keep full use. Encryption stays with the file after download.
    fr: |-
      Quand une étiquette applique un chiffrement, Copilot ne renvoie le contenu qu'aux utilisateurs qui disposent à la fois des droits d'utilisation VIEW et EXTRACT. Accorder VIEW sans EXTRACT aux membres de la finance leur permet de lire les documents sans en copier le contenu, et Copilot n'utilise pas ce contenu pour eux, tandis que les membres du conseil gardent un usage complet. Le chiffrement reste attaché au fichier après le téléchargement.
  options:
    b:
      en: |-
        DLP for Copilot can stop Copilot processing for the finance team, but without encryption nothing prevents copying or protects downloaded files.
      fr: |-
        La DLP pour Copilot peut empêcher le traitement par Copilot pour l'équipe financière, mais sans chiffrement rien n'empêche la copie ni ne protège les fichiers téléchargés.
    c:
      en: |-
        With EXTRACT, finance members could copy content and Copilot could return it to them; Restricted Content Discovery would also hide the site from board members' Copilot.
      fr: |-
        Avec EXTRACT, les membres de la finance pourraient copier le contenu et Copilot pourrait le leur renvoyer ; la découverte de contenu restreinte masquerait en outre le site au Copilot des membres du conseil.
    d:
      en: |-
        Insider Risk Management detects risky AI usage; it doesn't prevent copying or Copilot processing, and an unencrypted file isn't protected after download.
      fr: |-
        La gestion des risques internes détecte les usages à risque de l'IA ; elle n'empêche ni la copie ni le traitement par Copilot, et un fichier non chiffré n'est pas protégé après téléchargement.
references:
  - title: Microsoft Purview data security and compliance protections for Microsoft 365 Copilot and other generative AI apps
    url: https://learn.microsoft.com/en-us/purview/ai-microsoft-purview
