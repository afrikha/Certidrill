id: sc100-4c-ai-user-context
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has a custom generative AI app in Microsoft Foundry that employees use to summarize contracts. The app calls the model with a single API key stored in Azure Key Vault. Microsoft Purview is licensed, and pay-as-you-go billing is enabled.

    The compliance team requires Purview data security policies to apply to each employee's interactions with the app, including Insider Risk Management for risky AI usage. Audit alone isn't enough.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose d'une application d'IA générative personnalisée dans Microsoft Foundry que les employés utilisent pour résumer des contrats. L'application appelle le modèle avec une clé API unique stockée dans Azure Key Vault. Microsoft Purview fait l'objet d'une licence, et la facturation à l'utilisation est activée.

    L'équipe de conformité exige que les stratégies de sécurité des données Purview s'appliquent aux interactions de chaque employé avec l'application, y compris la gestion des risques internes pour l'utilisation risquée de l'IA. L'audit seul ne suffit pas.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable Purview data security for Foundry in Defender for Cloud and keep the API key authentication", fr: "Activer la sécurité des données Purview pour Foundry dans Defender for Cloud et conserver l'authentification par clé API" } }
    - { id: b, text: { en: "Enable threat protection for AI services with user prompt evidence on the Foundry resource", fr: "Activer la protection contre les menaces pour les services d'IA avec les preuves d'invites utilisateur sur la ressource Foundry" } }
    - { id: c, text: { en: "Enable Purview data security for Foundry and call the model with Microsoft Entra user-context tokens", fr: "Activer la sécurité des données Purview pour Foundry et appeler le modèle avec des jetons Microsoft Entra en contexte utilisateur" } }
    - { id: d, text: { en: "Deploy Endpoint DLP policies for generative AI websites to the employees' devices", fr: "Déployer sur les appareils des employés des stratégies DLP de point de terminaison pour les sites web d'IA générative" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Purview data security policies for Foundry interactions apply to API calls that use a Microsoft Entra user-context token or that explicitly include user context. Without user context, interactions only appear in Purview Audit and in the DSPM for AI activity explorer, so the app must pass each employee's identity.
    fr: |-
      Les stratégies de sécurité des données Purview pour les interactions Foundry s'appliquent aux appels d'API qui utilisent un jeton Microsoft Entra en contexte utilisateur ou qui incluent explicitement le contexte utilisateur. Sans contexte utilisateur, les interactions apparaissent seulement dans Purview Audit et dans l'explorateur d'activités de DSPM pour l'IA : l'application doit donc transmettre l'identité de chaque employé.
  options:
    a:
      en: |-
        With a shared API key, Purview sees no user context, so the interactions are audited but the policies don't apply per employee.
      fr: |-
        Avec une clé API partagée, Purview ne voit aucun contexte utilisateur : les interactions sont auditées, mais les stratégies ne s'appliquent pas par employé.
    b:
      en: |-
        Threat protection for AI services raises security alerts for the SOC; it doesn't apply Purview compliance policies such as Insider Risk Management.
      fr: |-
        La protection contre les menaces pour les services d'IA déclenche des alertes de sécurité pour le SOC ; elle n'applique pas les stratégies de conformité Purview comme la gestion des risques internes.
    d:
      en: |-
        Endpoint DLP controls what users paste into browser-based AI sites; it doesn't apply to a custom app that calls the model from the cloud.
      fr: |-
        La DLP de point de terminaison contrôle ce que les utilisateurs collent dans les sites d'IA accessibles par navigateur ; elle ne s'applique pas à une application personnalisée qui appelle le modèle depuis le cloud.
references:
  - title: Use Microsoft Purview to manage data security & compliance for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/purview/ai-azure-foundry
