id: sc100-4a-portfolio-api-inventory
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank publishes 300 APIs for its mobile banking and partner applications through Azure API Management. The APIs were built by many teams over several years, and nobody knows which ones are still used.

    As part of an assessment of the application portfolio, the security team must:

    - List the API endpoints that have no detected authentication or that received no traffic in the last 30 days.
    - Classify sensitive data in API requests and responses.
    - Detect run-time attacks such as the OWASP API Top 10 threats.

    What should you recommend?
  fr: |
    Woodgrove Bank publie 300 API pour ses applications bancaires mobiles et partenaires par Azure API Management. Les API ont été créées par de nombreuses équipes pendant plusieurs années, et personne ne sait lesquelles sont encore utilisées.

    Dans le cadre d'une évaluation du portefeuille d'applications, l'équipe de sécurité doit :

    - Lister les points de terminaison d'API sans authentification détectée ou n'ayant reçu aucun trafic au cours des 30 derniers jours.
    - Classifier les données sensibles des requêtes et des réponses des API.
    - Détecter les attaques à l'exécution, comme les menaces du Top 10 OWASP pour les API.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Defender for APIs", fr: "Microsoft Defender for APIs" } }
    - { id: b, text: { en: "Microsoft Defender for App Service", fr: "Microsoft Defender for App Service" } }
    - { id: c, text: { en: "Azure Web Application Firewall on Azure Front Door", fr: "Azure Web Application Firewall sur Azure Front Door" } }
    - { id: d, text: { en: "Microsoft Defender for Cloud Apps app governance", fr: "La gouvernance des applications de Microsoft Defender for Cloud Apps" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Defender for APIs protects APIs published in Azure API Management. Its inventory marks endpoints as inactive after 30 days without traffic and as unauthenticated when no authentication is detected, it classifies sensitive data in request and response bodies, and it raises run-time alerts that cover the OWASP API Top 10 threats.
    fr: |-
      Defender for APIs protège les API publiées dans Azure API Management. Son inventaire marque les points de terminaison comme inactifs après 30 jours sans trafic et comme non authentifiés quand aucune authentification n'est détectée, il classifie les données sensibles des corps de requêtes et de réponses, et il génère des alertes d'exécution qui couvrent les menaces du Top 10 OWASP pour les API.
  options:
    b:
      en: |-
        Defender for App Service protects App Service apps and their hosts; it doesn't inventory API Management endpoints or classify API payloads.
      fr: |-
        Defender for App Service protège les applications App Service et leurs hôtes ; il n'inventorie pas les points de terminaison d'API Management et ne classifie pas les charges utiles des API.
    c:
      en: |-
        A WAF filters malicious HTTP requests at the edge; it doesn't report unused or unauthenticated endpoints or classify sensitive data.
      fr: |-
        Un WAF filtre les requêtes HTTP malveillantes en périphérie ; il ne signale pas les points de terminaison inutilisés ou non authentifiés et ne classifie pas les données sensibles.
    d:
      en: |-
        App governance monitors OAuth apps and their permissions in Microsoft 365, not APIs published in API Management.
      fr: |-
        La gouvernance des applications surveille les applications OAuth et leurs autorisations dans Microsoft 365, pas les API publiées dans API Management.
references:
  - title: About Microsoft Defender for APIs
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-apis-introduction
