id: sc100-4c-storage-components
objective: "4.3.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. plans to enable Defender for Storage on the storage accounts of its claims platform. Customers upload documents to Blob Storage, and some accounts hold credit card numbers.

    Which Defender for Storage capability meets each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. prévoit d'activer Defender for Storage sur les comptes de stockage de sa plateforme de gestion des sinistres. Les clients chargent des documents dans Stockage Blob, et certains comptes contiennent des numéros de carte bancaire.

    Quelle capacité de Defender for Storage répond à chaque exigence ? Pour répondre, faites glisser les capacités appropriées vers les exigences correspondantes. Chaque capacité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: activity, text: { en: "Activity monitoring", fr: "Supervision de l'activité" } }
    - { id: malware, text: { en: "Malware scanning", fr: "Analyse des programmes malveillants" } }
    - { id: sensitive, text: { en: "Sensitive data threat detection", fr: "Détection des menaces sur les données sensibles" } }
    - { id: event, text: { en: "Event-driven response through Event Grid", fr: "Réponse pilotée par les événements via Event Grid" } }
  targets:
    - { id: t1, text: { en: "Detect unusual access patterns, such as access from a suspicious IP address, without enabling resource logs", fr: "Détecter des schémas d'accès inhabituels, comme un accès depuis une adresse IP suspecte, sans activer les journaux de ressources" } }
    - { id: t2, text: { en: "Find malicious content in the documents that customers upload", fr: "Trouver du contenu malveillant dans les documents que chargent les clients" } }
    - { id: t3, text: { en: "Give a higher priority to alerts on the accounts that hold credit card numbers", fr: "Donner une priorité plus élevée aux alertes sur les comptes qui contiennent des numéros de carte bancaire" } }
answer:
  mapping: { t1: activity, t2: malware, t3: sensitive }
explanation:
  correct:
    en: |-
      Activity monitoring analyzes access patterns and doesn't need resource logs. Malware scanning, powered by Microsoft Defender Antivirus, scans uploaded blobs or scans on demand. Sensitive data threat detection considers the sensitivity of the data at risk to prioritize alerts.
    fr: |-
      La supervision de l'activité analyse les schémas d'accès et n'a pas besoin des journaux de ressources. L'analyse des programmes malveillants, fournie par Microsoft Defender Antivirus, analyse les objets blob chargés ou s'exécute à la demande. La détection des menaces sur les données sensibles tient compte de la sensibilité des données exposées pour hiérarchiser les alertes.
  options:
    event:
      en: |-
        Event Grid delivers scan results so that Azure Functions or Logic Apps can act on them; it doesn't detect anything by itself.
      fr: |-
        Event Grid transmet les résultats d'analyse pour que Azure Functions ou Logic Apps puissent agir ; il ne détecte rien par lui-même.
references:
  - title: What is Microsoft Defender for Storage
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction
