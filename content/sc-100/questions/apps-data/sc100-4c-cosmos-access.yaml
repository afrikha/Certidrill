id: sc100-4c-cosmos-access
objective: "4.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is designing the security of an Azure Cosmos DB for NoSQL account named cosmos-orders. A reporting service in Azure Kubernetes Service (AKS) authenticates with a workload identity and must read the items of a single container. On-premises clients connect over ExpressRoute private peering.

    The design must meet the following requirements:

    - The reporting service gets read-only access to the items and nothing else.
    - No request to the account can be authorized with a primary or secondary key.
    - The account must not be reachable from the internet.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. conçoit la sécurité d'un compte Azure Cosmos DB for NoSQL nommé cosmos-orders. Un service de rapports dans Azure Kubernetes Service (AKS) s'authentifie avec une identité de charge de travail et doit lire les éléments d'un seul conteneur. Des clients locaux se connectent par le peering privé ExpressRoute.

    La conception doit répondre aux exigences suivantes :

    - Le service de rapports obtient un accès en lecture seule aux éléments, et rien d'autre.
    - Aucune demande au compte ne peut être autorisée avec une clé primaire ou secondaire.
    - Le compte ne doit pas être accessible depuis Internet.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Access for the reporting service: [[s1]]

      Key-based access: [[s2]]

      Network access: [[s3]]
    fr: |
      Accès du service de rapports : [[s1]]

      Accès par clé : [[s2]]

      Accès réseau : [[s3]]
  slots:
    - id: s1
      options:
        - { id: dataReader, text: { en: "Cosmos DB Built-in Data Reader, scoped to the container", fr: "Cosmos DB Built-in Data Reader, limité au conteneur" } }
        - { id: accountReader, text: { en: "Cosmos DB Account Reader Role, scoped to the account", fr: "Cosmos DB Account Reader Role, limité au compte" } }
        - { id: docdb, text: { en: "DocumentDB Account Contributor, scoped to the account", fr: "DocumentDB Account Contributor, limité au compte" } }
        - { id: roKey, text: { en: "The read-only key, stored in Azure Key Vault", fr: "La clé en lecture seule, stockée dans Azure Key Vault" } }
    - id: s2
      options:
        - { id: local, text: { en: "Disable local authentication on the account", fr: "Désactiver l'authentification locale sur le compte" } }
        - { id: rotate, text: { en: "Rotate the keys every 30 days", fr: "Faire tourner les clés tous les 30 jours" } }
        - { id: metadata, text: { en: "Disable key-based metadata write access", fr: "Désactiver l'accès en écriture aux métadonnées par clé" } }
    - id: s3
      options:
        - { id: pe, text: { en: "Private endpoints, with public network access disabled", fr: "Points de terminaison privés, avec l'accès au réseau public désactivé" } }
        - { id: se, text: { en: "Virtual network service endpoints", fr: "Points de terminaison de service de réseau virtuel" } }
        - { id: ipfw, text: { en: "An IP firewall that allows the on-premises public IP ranges", fr: "Un pare-feu IP qui autorise les plages IP publiques locales" } }
answer:
  values: { s1: dataReader, s2: local, s3: pe }
explanation:
  correct:
    en: |-
      Cosmos DB data access with Microsoft Entra uses Cosmos DB's own data-plane roles, and Cosmos DB Built-in Data Reader can be scoped to a single container. Disabling local authentication makes the account reject every request authorized with a key. Private endpoints are reachable from on-premises over private peering, and disabling public network access closes the internet endpoint.
    fr: |-
      L'accès aux données Cosmos DB avec Microsoft Entra utilise les rôles du plan de données propres à Cosmos DB, et Cosmos DB Built-in Data Reader peut être limité à un seul conteneur. Désactiver l'authentification locale fait rejeter par le compte toute demande autorisée par une clé. Les points de terminaison privés sont accessibles depuis les sites locaux par le peering privé, et la désactivation de l'accès au réseau public ferme le point de terminaison Internet.
  options:
    accountReader:
      en: |-
        Cosmos DB Account Reader Role is a control-plane role; it doesn't grant data-plane access to items through Microsoft Entra ID.
      fr: |-
        Cosmos DB Account Reader Role est un rôle du plan de contrôle ; il n'accorde pas d'accès aux éléments par le plan de données via Microsoft Entra ID.
    docdb:
      en: |-
        DocumentDB Account Contributor manages the account, which is far more than read access to one container.
      fr: |-
        DocumentDB Account Contributor gère le compte, ce qui dépasse largement la lecture d'un conteneur.
    metadata:
      en: |-
        This setting only blocks changes to databases and containers through keys; keys still authorize data requests.
      fr: |-
        Ce paramètre bloque seulement les modifications des bases de données et des conteneurs par clé ; les clés autorisent toujours les demandes de données.
    se:
      en: |-
        Service endpoints work only for traffic from Azure subnets and leave the public endpoint in place; on-premises clients can't use them over private peering.
      fr: |-
        Les points de terminaison de service ne fonctionnent que pour le trafic issu de sous-réseaux Azure et laissent le point de terminaison public en place ; les clients locaux ne peuvent pas les utiliser par le peering privé.
references:
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/security/how-to-grant-data-plane-role-based-access
