id: sc100-4b-sdl-framework
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. develops customer-facing applications that run in Azure and AWS. Each development team currently decides on its own which security checks to perform.

    The CISO wants all teams to follow one process framework that defines the security activities required in each phase of software development, from training and requirements through design, implementation, verification, release and incident response. The framework must include threat modeling during design.

    What should you recommend that Fabrikam adopt?
  fr: |
    Fabrikam, Inc. développe des applications destinées aux clients qui s'exécutent dans Azure et AWS. Actuellement, chaque équipe de développement décide seule des contrôles de sécurité à effectuer.

    Le RSSI veut que toutes les équipes suivent un même cadre de processus qui définit les activités de sécurité requises à chaque phase du développement logiciel, de la formation et des exigences jusqu'à la conception, l'implémentation, la vérification, la mise en production et la réponse aux incidents. Le cadre doit inclure la modélisation des menaces pendant la conception.

    Que devez-vous recommander à Fabrikam d'adopter ?
body:
  options:
    - { id: a, text: { en: "The Microsoft cloud security benchmark (MCSB)", fr: "Le Microsoft cloud security benchmark (MCSB)" } }
    - { id: b, text: { en: "The Microsoft Cybersecurity Reference Architectures (MCRA)", fr: "Les Microsoft Cybersecurity Reference Architectures (MCRA)" } }
    - { id: c, text: { en: "The Microsoft Security Development Lifecycle (SDL)", fr: "Le Microsoft Security Development Lifecycle (SDL)" } }
    - { id: d, text: { en: "The Cloud Adoption Framework for Azure (CAF)", fr: "Le Cloud Adoption Framework pour Azure (CAF)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Microsoft SDL is a development process: it combines supporting activities (training and response) with core phases (requirements, design, implementation, verification and release). Threat models built from data flow diagrams are the main activity of its design phase, so it gives every team the same phase-by-phase security activities.
    fr: |
      Le Microsoft SDL est un processus de développement : il combine des activités de support (formation et réponse) et des phases principales (exigences, conception, implémentation, vérification et mise en production). Les modèles de menaces construits à partir de diagrammes de flux de données sont l'activité principale de sa phase de conception : il donne à toutes les équipes les mêmes activités de sécurité phase par phase.
  options:
    a:
      en: The MCSB is a set of security controls and baselines for cloud resources in Azure and other clouds. It says what to configure, not which activities to perform in each development phase.
      fr: Le MCSB est un ensemble de contrôles de sécurité et de bases de référence pour les ressources cloud dans Azure et d'autres clouds. Il indique quoi configurer, pas quelles activités mener à chaque phase du développement.
    b:
      en: The MCRA describes Microsoft security capabilities and how they integrate in a reference architecture. It isn't a development process with phases.
      fr: Les MCRA décrivent les capacités de sécurité Microsoft et leur intégration dans une architecture de référence. Ce n'est pas un processus de développement organisé en phases.
    d:
      en: The CAF guides an organization's cloud adoption journey (strategy, plan, ready, adopt, govern, secure, manage). It doesn't define the security activities of each software development phase.
      fr: Le CAF guide le parcours d'adoption du cloud d'une organisation (stratégie, planification, préparation, adoption, gouvernance, sécurité, gestion). Il ne définit pas les activités de sécurité de chaque phase du développement logiciel.
references:
  - title: Microsoft Security Development Lifecycle (SDL)
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-microsoft-security-development-lifecycle
