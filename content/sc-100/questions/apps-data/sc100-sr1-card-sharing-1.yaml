id: sc100-sr1-card-sharing-1
objective: "4.1.4"
type: series_yesno
series: sc100-sr1-card-sharing
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You recommend a DLP policy based on the PCI DSS template.
  fr: Vous recommandez une stratégie DLP basée sur le modèle PCI DSS.
body:
  solution:
    en: |
      You recommend a Microsoft Purview **data loss prevention (DLP)** policy created from the **PCI Data Security Standard (PCI DSS)** template, applied to the Exchange email, SharePoint sites, OneDrive accounts, and Teams chat and channel messages locations. The rule matches content shared with people outside the organization, blocks the action, and shows a policy tip to the user.
    fr: |
      Vous recommandez une stratégie de **protection contre la perte de données (DLP)** Microsoft Purview créée à partir du modèle **PCI Data Security Standard (PCI DSS)**, appliquée aux emplacements Exchange email, SharePoint sites, OneDrive accounts et Teams chat and channel messages. La règle détecte le contenu partagé avec des personnes extérieures à l'organisation, bloque l'action et affiche un conseil de stratégie à l'utilisateur.
answer: { value: true }
explanation:
  correct:
    en: The PCI DSS template of the Financial category detects the Credit card number sensitive information type. The four locations cover every channel in the requirements, the external sharing condition leaves internal sharing untouched, and the policy tip tells the user why the action is blocked.
    fr: "Le modèle PCI DSS de la catégorie Financial détecte le type d'informations sensibles Credit card number. Les quatre emplacements couvrent tous les canaux des exigences, la condition de partage externe laisse le partage interne intact, et le conseil de stratégie indique à l'utilisateur pourquoi l'action est bloquée."
references:
  - title: Data Loss Prevention policy reference
    url: https://learn.microsoft.com/en-us/purview/dlp-policy-reference
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
