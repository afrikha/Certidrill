id: sc100-sr1-personal-phones-2
objective: "4.1.3"
type: series_yesno
series: sc100-sr1-personal-phones
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You recommend Intune compliance policies and a Conditional Access policy that requires a compliant device.
  fr: Vous recommandez des stratégies de conformité Intune et une stratégie d'accès conditionnel qui exige un appareil conforme.
body:
  solution:
    en: |
      You recommend Intune **compliance policies** for iOS/iPadOS and Android that require a device passcode and block jailbroken or rooted devices. A Conditional Access policy for the iOS and Android platforms requires the **Require device to be marked as compliant** grant control to access Exchange Online.
    fr: |
      Vous recommandez des **stratégies de conformité** Intune pour iOS/iPadOS et Android qui exigent un code secret sur l'appareil et bloquent les appareils jailbreakés ou rootés. Une stratégie d'accès conditionnel pour les plateformes iOS et Android exige le contrôle d'octroi **Require device to be marked as compliant** pour accéder à Exchange Online.
answer: { value: false }
explanation:
  correct:
    en: A device can be marked as compliant only after it is enrolled in Intune, which the requirements prohibit for the personal phones. Compliance policies also evaluate the device settings; they don't stop copying email content into personal apps.
    fr: "Un appareil ne peut être marqué comme conforme qu'après son inscription dans Intune, ce que les exigences interdisent pour les téléphones personnels. De plus, les stratégies de conformité évaluent les paramètres de l'appareil ; elles n'empêchent pas de copier le contenu des e-mails dans des applications personnelles."
references:
  - title: "Conditional Access: Grant"
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant
