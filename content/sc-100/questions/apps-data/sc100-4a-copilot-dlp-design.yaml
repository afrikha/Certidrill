id: sc100-4a-copilot-dlp-design
objective: "4.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft 365 Copilot. The security architect reviews a proposed Microsoft Purview DLP design for Copilot:

    - One policy that protects the Exchange email and Copilot locations together.
    - One rule in that policy with two conditions: content contains the **Credit Card Number** sensitive information type, and content has the **Highly Confidential** sensitivity label.
    - The policy must stop Copilot from using the content of Highly Confidential files and from responding to prompts that contain credit card numbers.

    Which two statements about the design are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise Microsoft 365 Copilot. L'architecte sécurité examine une conception DLP Microsoft Purview proposée pour Copilot :

    - Une stratégie qui protège ensemble les emplacements de messagerie Exchange et Copilot.
    - Une règle dans cette stratégie avec deux conditions : le contenu contient le type d'informations sensibles **Credit Card Number**, et le contenu porte l'étiquette de confidentialité **Highly Confidential**.
    - La stratégie doit empêcher Copilot d'utiliser le contenu des fichiers Highly Confidential et de répondre aux invites qui contiennent des numéros de carte bancaire.

    Quelles sont les deux affirmations vraies sur cette conception ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Copilot location must be in its own policy, because selecting it disables the other locations of the policy.", fr: "L'emplacement Copilot doit figurer dans sa propre stratégie, car le sélectionner désactive les autres emplacements de la stratégie." } }
    - { id: b, text: { en: "The single rule works as designed, because one rule can combine sensitive information type and sensitivity label conditions.", fr: "La règle unique fonctionne comme prévu, car une règle peut combiner des conditions de type d'informations sensibles et d'étiquette de confidentialité." } }
    - { id: c, text: { en: "Highly Confidential files can still appear in response citations, but Copilot doesn't use their content.", fr: "Les fichiers Highly Confidential peuvent encore apparaître dans les citations des réponses, mais Copilot n'utilise pas leur contenu." } }
    - { id: d, text: { en: "The policy also scans the content of files that users upload directly into a prompt.", fr: "La stratégie analyse aussi le contenu des fichiers que les utilisateurs chargent directement dans une invite." } }
    - { id: e, text: { en: "Changes to the policy take effect for Copilot within five minutes.", fr: "Les modifications de la stratégie prennent effet pour Copilot en moins de cinq minutes." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The Copilot location is available only in the custom policy template, and selecting it disables all the other locations in the same policy, so the email location needs a separate policy. Items with a restricted label are excluded from processing: they can still appear in citations, but Copilot doesn't access or use their content.
    fr: |-
      L'emplacement Copilot n'est disponible que dans le modèle de stratégie personnalisé, et le sélectionner désactive tous les autres emplacements de la même stratégie : l'emplacement de messagerie exige une stratégie distincte. Les éléments portant une étiquette restreinte sont exclus du traitement : ils peuvent encore apparaître dans les citations, mais Copilot n'accède pas à leur contenu et ne l'utilise pas.
  options:
    b:
      en: |-
        A rule can't combine sensitive information type and sensitivity label conditions; each condition must go in a separate rule of the policy.
      fr: |-
        Une règle ne peut pas combiner des conditions de type d'informations sensibles et d'étiquette de confidentialité ; chaque condition doit figurer dans une règle distincte de la stratégie.
    d:
      en: |-
        DLP doesn't scan files uploaded directly into prompts; it checks only the typed prompt text.
      fr: |-
        La DLP n'analyse pas les fichiers chargés directement dans les invites ; elle ne vérifie que le texte saisi.
    e:
      en: |-
        Policy updates can take up to four hours to take effect.
      fr: |-
        Les mises à jour de stratégie peuvent prendre jusqu'à quatre heures pour prendre effet.
references:
  - title: Microsoft Purview DLP for Microsoft 365 Copilot and Cowork
    url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about
