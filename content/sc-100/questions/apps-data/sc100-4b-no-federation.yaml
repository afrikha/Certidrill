id: sc100-4b-no-federation
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation runs a nightly export job on a Linux server located in a partner's hosting facility. The job must upload files to an Azure Storage account in Adatum's tenant.

    The hosting contract forbids installing any agent on the server, so the server can't be onboarded to Azure Arc. The server doesn't run Kubernetes or any platform that can issue identity tokens, so no external identity provider is available.

    You need to recommend how the job should authenticate to Microsoft Entra ID. The solution must provide the strongest credential type available in this scenario.

    What should you recommend?
  fr: |
    Adatum Corporation exécute une tâche d'exportation nocturne sur un serveur Linux situé chez un hébergeur partenaire. La tâche doit charger des fichiers dans un compte Stockage Azure du locataire d'Adatum.

    Le contrat d'hébergement interdit l'installation de tout agent sur le serveur : le serveur ne peut donc pas être intégré à Azure Arc. Le serveur n'exécute ni Kubernetes ni aucune plateforme capable d'émettre des jetons d'identité : aucun fournisseur d'identité externe n'est disponible.

    Vous devez recommander la façon dont la tâche doit s'authentifier auprès de Microsoft Entra ID. La solution doit fournir le type d'information d'identification le plus robuste possible dans ce scénario.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A user-assigned managed identity with a federated identity credential", fr: "Une identité managée affectée par l'utilisateur avec des informations d'identification d'identité fédérée" } }
    - { id: b, text: { en: "An app registration with a client secret that expires after 24 months", fr: "Une inscription d'application avec un secret client qui expire au bout de 24 mois" } }
    - { id: c, text: { en: "An app registration with a certificate credential that is rotated regularly", fr: "Une inscription d'application avec un certificat renouvelé régulièrement" } }
    - { id: d, text: { en: "A dedicated user account that is excluded from multifactor authentication", fr: "Un compte d'utilisateur dédié exclu de l'authentification multifacteur" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Managed identities and workload identity federation remove credentials, but they need an Azure or Arc-enabled resource, or an external identity provider that issues tokens. When neither exists, the remaining option is an app registration, and a certificate is preferred to a client secret; keep it in a protected store and rotate it.
    fr: |
      Les identités managées et la fédération d'identité de charge de travail suppriment les informations d'identification, mais elles exigent une ressource Azure ou compatible Arc, ou un fournisseur d'identité externe qui émet des jetons. Quand aucun des deux n'existe, il reste l'inscription d'application, et un certificat est préférable à un secret client ; conservez-le dans un magasin protégé et renouvelez-le.
  options:
    a:
      en: A federated identity credential trusts tokens from an external identity provider; without a token issuer, there's nothing to federate.
      fr: Des informations d'identification d'identité fédérée approuvent les jetons d'un fournisseur d'identité externe ; sans émetteur de jetons, il n'y a rien à fédérer.
    b:
      en: A client secret is a shared secret, weaker than a certificate, and a long lifetime increases the impact of a leak.
      fr: Un secret client est un secret partagé, moins robuste qu'un certificat, et une longue durée de vie augmente l'impact d'une fuite.
    d:
      en: A user account used by software is not a workload identity, and excluding it from MFA leaves a password-only account.
      fr: Un compte d'utilisateur utilisé par un logiciel n'est pas une identité de charge de travail, et l'exclure de l'authentification multifacteur laisse un compte protégé par un simple mot de passe.
references:
  - title: Workload identity federation concepts
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
