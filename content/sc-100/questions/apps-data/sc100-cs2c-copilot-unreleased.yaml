id: sc100-cs2c-copilot-unreleased
objective: "4.1.5"
type: single
caseStudy: sc100-cs2c-southridge-video
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a solution to protect the scripts labeled Highly Confidential\Unreleased from Microsoft 365 Copilot. The solution must meet the AI requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour protéger les scripts qui portent l'étiquette Highly Confidential\Unreleased vis-à-vis de Microsoft 365 Copilot. La solution doit répondre aux exigences relatives à l'IA.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Replace the Co-Author permissions of the label with custom permissions that exclude the EXTRACT usage right", fr: "Remplacer les autorisations Co-Author de l'étiquette par des autorisations personnalisées qui excluent le droit d'utilisation EXTRACT" } }
    - { id: b, text: { en: "Create a Microsoft Purview DLP policy for the Copilot location in southridgevideo.com that excludes the items that have the label", fr: "Créer une stratégie DLP Microsoft Purview pour l'emplacement Copilot dans southridgevideo.com qui exclut les éléments qui portent l'étiquette" } }
    - { id: c, text: { en: "Turn on Restricted Content Discovery for the SharePoint sites of southridgevideo.com that store the scripts", fr: "Activer Restricted Content Discovery pour les sites SharePoint de southridgevideo.com qui stockent les scripts" } }
    - { id: d, text: { en: "Run a data risk assessment in Data Security Posture Management for AI on the sites that store the scripts", fr: "Exécuter une évaluation des risques liés aux données dans Data Security Posture Management for AI sur les sites qui stockent les scripts" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a sensitivity label applies encryption, a user must have the EXTRACT usage right, in addition to VIEW, for Copilot to return the content. The usage rights travel with the encrypted file, so they apply wherever the script is opened, including in the tenants of the partner studios. Custom permissions that keep viewing, editing and saving but remove EXTRACT let the production team and the freelancers keep working, and they don't need to copy text.
    fr: |
      Quand une étiquette de confidentialité applique un chiffrement, un utilisateur doit disposer du droit d'utilisation EXTRACT, en plus de VIEW, pour que Copilot renvoie le contenu. Les droits d'utilisation accompagnent le fichier chiffré ; ils s'appliquent donc partout où le script est ouvert, y compris dans les locataires des studios partenaires. Des autorisations personnalisées qui conservent l'affichage, la modification et l'enregistrement mais retirent EXTRACT permettent à l'équipe de production et aux indépendants de continuer à travailler, et ils n'ont pas besoin de copier du texte.
  options:
    b:
      en: A DLP policy for the Copilot location stops Copilot in southridgevideo.com from processing the labeled items, but it doesn't apply to Copilot in the tenants of the partner studios.
      fr: Une stratégie DLP pour l'emplacement Copilot empêche Copilot de southridgevideo.com de traiter les éléments étiquetés, mais elle ne s'applique pas à Copilot dans les locataires des studios partenaires.
    c:
      en: Restricted Content Discovery only limits the discovery of a site's content in organization-wide search and Copilot in southridgevideo.com; Copilot can still summarize a script that a user has open.
      fr: Restricted Content Discovery limite seulement la découverte du contenu d'un site dans la recherche à l'échelle de l'organisation et dans Copilot de southridgevideo.com ; Copilot peut encore résumer un script ouvert par un utilisateur.
    d:
      en: A data risk assessment identifies oversharing and recommends fixes; it doesn't by itself stop Copilot from returning content.
      fr: Une évaluation des risques liés aux données identifie le partage excessif et recommande des corrections ; elle n'empêche pas à elle seule Copilot de renvoyer du contenu.
references:
  - title: Use Microsoft Purview to manage data security & compliance for Microsoft 365 Copilot & Microsoft 365 Copilot Chat
    url: https://learn.microsoft.com/en-us/purview/ai-m365-copilot
  - title: Restrict discovery of SharePoint sites and content
    url: https://learn.microsoft.com/en-us/sharepoint/restricted-content-discovery
