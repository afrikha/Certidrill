id: sc100-cs1b-copilot-controls
objective: "4.1.5"
type: dropdown
caseStudy: sc100-cs1b-lamna
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend controls that meet the Copilot requirements.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander des contrôles qui respectent les exigences relatives à Copilot.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Identify the other sites shared with Everyone except external users: [[find]]

      Research-Archive during the permission review: [[site]]
    fr: |
      Identifier les autres sites partagés avec Tout le monde sauf les utilisateurs externes : [[find]]

      Research-Archive pendant la révision des autorisations : [[site]]
  slots:
    - id: find
      options:
        - { id: dag, text: { en: "Data access governance reports of SharePoint Advanced Management", fr: "Les rapports de gouvernance de l'accès aux données de SharePoint Advanced Management" } }
        - { id: rac, text: { en: "Restricted access control on all the SharePoint sites", fr: "Le contrôle d'accès restreint sur tous les sites SharePoint" } }
        - { id: score, text: { en: "Microsoft Secure Score improvement actions for SharePoint Online", fr: "Les actions d'amélioration du Niveau de sécurité Microsoft pour SharePoint Online" } }
        - { id: rcd, text: { en: "Restricted Content Discovery on all the SharePoint sites", fr: "La découverte de contenu restreinte sur tous les sites SharePoint" } }
    - id: site
      options:
        - { id: rcd, text: { en: "Restricted Content Discovery on Research-Archive", fr: "La découverte de contenu restreinte sur Research-Archive" } }
        - { id: rss, text: { en: "Restricted SharePoint Search with an allowed list that excludes Research-Archive", fr: "La recherche SharePoint restreinte avec une liste d'autorisation qui exclut Research-Archive" } }
        - { id: container, text: { en: "A sensitivity label with site settings applied to Research-Archive", fr: "Une étiquette de confidentialité avec des paramètres de site appliquée à Research-Archive" } }
        - { id: dlp, text: { en: "A Microsoft Purview DLP policy for the Copilot location that blocks sensitive prompts", fr: "Une stratégie DLP Microsoft Purview pour l'emplacement Copilot qui bloque les prompts sensibles" } }
answer:
  values: { find: dag, site: rcd }
explanation:
  correct:
    en: |-
      The data access governance reports discover potentially overshared content; one report tracks the sites whose content is shared with Everyone except external users, and the reports don't change permissions. Restricted Content Discovery is a site-level setting that keeps the content of a site out of organization-wide search and Copilot responses while permissions are reviewed; users who already have access can still open the content.
    fr: |-
      Les rapports de gouvernance de l'accès aux données découvrent le contenu potentiellement surpartagé ; l'un d'eux suit les sites dont le contenu est partagé avec Tout le monde sauf les utilisateurs externes, et les rapports ne modifient pas les autorisations. La découverte de contenu restreinte est un paramètre de site qui tient le contenu d'un site à l'écart de la recherche à l'échelle de l'organisation et des réponses de Copilot pendant la révision des autorisations ; les utilisateurs qui ont déjà accès peuvent toujours ouvrir le contenu.
  options:
    rac:
      en: |-
        Restricted access control remediates oversharing by limiting site access to specified groups, so it changes who can access the sites.
      fr: |-
        Le contrôle d'accès restreint corrige le surpartage en limitant l'accès aux sites à des groupes spécifiés : il modifie donc qui peut accéder aux sites.
    score:
      en: |-
        Secure Score improvement actions assess tenant-level configuration settings; they don't list the sites shared with Everyone except external users.
      fr: |-
        Les actions d'amélioration du Niveau de sécurité Microsoft évaluent des paramètres de configuration au niveau du locataire ; elles ne listent pas les sites partagés avec Tout le monde sauf les utilisateurs externes.
    rss:
      en: |-
        Restricted SharePoint Search is retiring: new enablement has been blocked since July 31, 2026. It is also a tenant-wide allowed list that affects search for all users.
      fr: |-
        La recherche SharePoint restreinte est en cours de retrait : sa nouvelle activation est bloquée depuis le 31 juillet 2026. C'est en outre une liste d'autorisation à l'échelle du locataire qui affecte la recherche pour tous les utilisateurs.
    container:
      en: |-
        A label applied to a site controls settings such as privacy and external sharing; it doesn't remove the content of the site from Copilot responses.
      fr: |-
        Une étiquette appliquée à un site contrôle des paramètres comme la confidentialité et le partage externe ; elle ne retire pas le contenu du site des réponses de Copilot.
    dlp:
      en: |-
        Blocking sensitive prompts acts on what users type; it doesn't stop Copilot from using the content of Research-Archive.
      fr: |-
        Bloquer les prompts sensibles agit sur ce que les utilisateurs saisissent ; cela n'empêche pas Copilot d'utiliser le contenu de Research-Archive.
references:
  - title: Data access governance reports for SharePoint and OneDrive sites
    url: https://learn.microsoft.com/en-us/sharepoint/data-access-governance-reports
  - title: Restrict discovery of SharePoint sites and content
    url: https://learn.microsoft.com/en-us/sharepoint/restricted-content-discovery
