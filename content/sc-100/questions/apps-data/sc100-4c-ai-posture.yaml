id: sc100-4c-ai-posture
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. builds generative AI applications in Microsoft Foundry and Azure OpenAI in Azure, and in Amazon Bedrock in AWS. The AWS accounts are connected to Microsoft Defender for Cloud.

    The security team must inventory the AI components of these applications, find the AI resources whose grounding or fine-tuning data could be exposed, and see externally reachable AI endpoints. The solution must cover both clouds.

    What should you recommend?
  fr: |
    Litware, Inc. crée des applications d'IA générative dans Microsoft Foundry et Azure OpenAI dans Azure, et dans Amazon Bedrock dans AWS. Les comptes AWS sont connectés à Microsoft Defender for Cloud.

    L'équipe de sécurité doit inventorier les composants d'IA de ces applications, trouver les ressources d'IA dont les données d'ancrage ou d'ajustement pourraient être exposées et voir les points de terminaison d'IA accessibles de l'extérieur. La solution doit couvrir les deux clouds.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "AI security posture management in Defender CSPM", fr: "La gestion de la posture de sécurité de l'IA dans Defender CSPM" } }
    - { id: b, text: { en: "Threat protection for AI services in Defender for Cloud", fr: "La protection contre les menaces pour les services d'IA dans Defender for Cloud" } }
    - { id: c, text: { en: "Microsoft Purview Data Security Posture Management for AI", fr: "La gestion de la posture de sécurité des données pour l'IA de Microsoft Purview" } }
    - { id: d, text: { en: "Prompt Shields in Azure AI Content Safety", fr: "Prompt Shields dans Azure AI Content Safety" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AI security posture management in Defender CSPM discovers AI workloads in Azure OpenAI, Foundry, Azure Machine Learning, Amazon Bedrock and Google Vertex AI and builds an AI bill of materials. Attack path analysis covers data exposed through grounding and fine-tuning across clouds, and it highlights externally reachable AI endpoints.
    fr: |-
      La gestion de la posture de sécurité de l'IA dans Defender CSPM découvre les charges de travail d'IA dans Azure OpenAI, Foundry, Azure Machine Learning, Amazon Bedrock et Google Vertex AI, et construit une nomenclature IA (AI BOM). L'analyse des chemins d'attaque couvre les données exposées par l'ancrage et l'ajustement dans les différents clouds, et met en évidence les points de terminaison d'IA accessibles de l'extérieur.
  options:
    b:
      en: |-
        Threat protection for AI services raises alerts on active threats such as jailbreak or data leakage; it doesn't inventory AI components or analyze posture, and it doesn't cover connected AWS accounts.
      fr: |-
        La protection contre les menaces pour les services d'IA déclenche des alertes sur des menaces actives comme le jailbreak ou la fuite de données ; elle n'inventorie pas les composants d'IA, n'analyse pas la posture et ne couvre pas les comptes AWS connectés.
    c:
      en: |-
        Purview DSPM for AI focuses on sensitive data in prompts and responses and on user activity; it doesn't map AI infrastructure or attack paths.
      fr: |-
        Purview DSPM pour l'IA se concentre sur les données sensibles des invites et des réponses et sur l'activité des utilisateurs ; il ne cartographie pas l'infrastructure d'IA ni les chemins d'attaque.
    d:
      en: |-
        Prompt Shields detect prompt attacks at runtime; they don't inventory resources or assess exposure.
      fr: |-
        Prompt Shields détecte les attaques par invite au moment de l'exécution ; il n'inventorie pas les ressources et n'évalue pas l'exposition.
references:
  - title: Overview - AI security posture management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture
