id: sc100-4c-sql-private-access
objective: "4.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. hosts a customer database on an Azure SQL Database logical server named sql-crm. Today, the server firewall has the setting that allows Azure services and resources to access the server, plus a rule for the public IP range of the on-premises NAT device.

    Applications in an Azure virtual network and on-premises applications connected through ExpressRoute private peering must keep access. Traffic to sql-crm must never use a public endpoint, and resources hosted in other customers' Azure subscriptions must not be able to reach the server.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. héberge une base de données clients sur un serveur logique Azure SQL Database nommé sql-crm. Aujourd'hui, le pare-feu du serveur a le paramètre qui autorise les services et ressources Azure à accéder au serveur, plus une règle pour la plage IP publique du dispositif NAT local.

    Les applications d'un réseau virtuel Azure et les applications locales connectées par le peering privé ExpressRoute doivent conserver leur accès. Le trafic vers sql-crm ne doit jamais utiliser de point de terminaison public, et les ressources hébergées dans les abonnements Azure d'autres clients ne doivent pas pouvoir atteindre le serveur.

    Quelles sont les deux actions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a private endpoint for sql-crm in the virtual network", fr: "Créer un point de terminaison privé pour sql-crm dans le réseau virtuel" } }
    - { id: b, text: { en: "Add a virtual network service endpoint for Microsoft.Sql and a virtual network rule", fr: "Ajouter un point de terminaison de service de réseau virtuel pour Microsoft.Sql et une règle de réseau virtuel" } }
    - { id: c, text: { en: "Keep the Azure services setting and remove the on-premises IP rule", fr: "Conserver le paramètre des services Azure et supprimer la règle IP locale" } }
    - { id: d, text: { en: "Deny public network access on sql-crm", fr: "Refuser l'accès au réseau public sur sql-crm" } }
    - { id: e, text: { en: "Replace the on-premises IP rule with a rule for the ExpressRoute gateway public IP", fr: "Remplacer la règle IP locale par une règle pour l'adresse IP publique de la passerelle ExpressRoute" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      A private endpoint gives sql-crm a private IP address in the virtual network, which on-premises clients reach over private peering. Disabling public network access then rejects every connection through the public endpoint, including the IP rules and the Azure services setting, which would let resources of any Azure customer through the firewall.
    fr: |-
      Un point de terminaison privé donne à sql-crm une adresse IP privée dans le réseau virtuel, que les clients locaux atteignent par le peering privé. Désactiver ensuite l'accès au réseau public rejette toute connexion par le point de terminaison public, y compris les règles IP et le paramètre des services Azure, qui laisserait passer le pare-feu aux ressources de n'importe quel client Azure.
  options:
    b:
      en: |-
        With a service endpoint, the server keeps its public endpoint, and on-premises traffic over private peering can't use it.
      fr: |-
        Avec un point de terminaison de service, le serveur conserve son point de terminaison public, et le trafic local passant par le peering privé ne peut pas l'utiliser.
    c:
      en: |-
        The Azure services setting allows connections from any Azure resource, including resources in other customers' subscriptions.
      fr: |-
        Le paramètre des services Azure autorise les connexions depuis toute ressource Azure, y compris celles des abonnements d'autres clients.
    e:
      en: |-
        Any IP rule still uses the public endpoint, which the requirements forbid.
      fr: |-
        Toute règle IP utilise toujours le point de terminaison public, ce que les exigences interdisent.
references:
  - title: Azure Private Link for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview
