id: sc100-cs4b-secure-score
objective: "4.1.1"
type: yesno_statements
caseStudy: sc100-cs4b-adatum-university
difficulty: 1
status: draft
stem:
  en: |
    You recommend Microsoft Secure Score to meet the posture reporting requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous recommandez le Niveau de sécurité Microsoft pour respecter les exigences relatives au reporting de la posture.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The board report can include a comparison of the university's score with the score of similar organizations.
        fr: |-
          Le rapport au conseil d'administration peut inclure une comparaison du score de l'université avec celui d'organisations similaires.
    - id: s2
      text:
        en: |-
          Assigning Microsoft 365 A5 licenses to the students would raise the university's score before any recommended action is implemented.
        fr: |-
          Attribuer des licences Microsoft 365 A5 aux étudiants augmenterait le score de l'université avant la mise en œuvre de toute action recommandée.
    - id: s3
      text:
        en: |-
          If you mark the recommended actions that the email gateway addresses as resolved through a third party, the university gets the points of those actions.
        fr: |-
          Si vous marquez les actions recommandées que la passerelle de messagerie traite comme résolues par un tiers, l'université obtient les points de ces actions.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Microsoft Secure Score provides history, trends and a comparison with similar organizations, which fits a quarterly board report. The absolute posture that the score represents stays the same whatever licenses the organization owns; licenses only change which recommendations you see. When a non-Microsoft solution or an alternate mitigation addresses a recommended action, you can mark it as such and you get the points.
    fr: |-
      Le Niveau de sécurité Microsoft fournit l'historique, les tendances et une comparaison avec des organisations similaires, ce qui convient à un rapport trimestriel au conseil d'administration. La posture absolue que représente le score reste la même quelles que soient les licences de l'organisation ; les licences ne changent que les recommandations affichées. Quand une solution non Microsoft ou une atténuation alternative traite une action recommandée, vous pouvez la marquer comme telle et vous obtenez les points.
references:
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
