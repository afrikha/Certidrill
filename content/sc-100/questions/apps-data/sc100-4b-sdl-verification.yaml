id: sc100-4b-sdl-verification
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is aligning its application security program with the Microsoft Security Development Lifecycle (SDL). The development teams already create threat models during design and release builds through deployment rings.

    An internal audit found that code reaches the release phase without any automated security testing. You need to recommend activities that belong to the SDL verification phase.

    Which two activities should you recommend?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. aligne son programme de sécurité des applications sur le Microsoft Security Development Lifecycle (SDL). Les équipes de développement créent déjà des modèles de menaces pendant la conception et mettent en production les builds par anneaux de déploiement.

    Un audit interne a constaté que le code atteint la phase de mise en production sans aucun test de sécurité automatisé. Vous devez recommander des activités qui relèvent de la phase de vérification du SDL.

    Quelles sont les deux activités à recommander ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Fuzz testing of the application's input parsers", fr: "Tests à données aléatoires (fuzzing) des analyseurs d'entrées de l'application" } }
    - { id: b, text: { en: "Definition of privacy requirements for each data type", fr: "Définition des exigences de confidentialité pour chaque type de données" } }
    - { id: c, text: { en: "Data flow diagrams that show the trust boundaries", fr: "Diagrammes de flux de données qui montrent les limites d'approbation" } }
    - { id: d, text: { en: "Credential and secret scanning of the code in the pipeline", fr: "Analyse des informations d'identification et des secrets du code dans le pipeline" } }
    - { id: e, text: { en: "Role-based secure development training for engineers", fr: "Formation au développement sécurisé adaptée au rôle des ingénieurs" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The SDL verification phase runs before release: a reviewer who didn't write the code reviews it, and the pipeline runs automated checks such as static analysis, binary analysis, credential and secret scanning, encryption scanning, fuzz testing and configuration validation. Penetration testing supplements these checks.
    fr: |
      La phase de vérification du SDL a lieu avant la mise en production : un relecteur qui n'a pas écrit le code le revoit, et le pipeline exécute des contrôles automatisés comme l'analyse statique, l'analyse binaire, l'analyse des informations d'identification et des secrets, l'analyse du chiffrement, les tests à données aléatoires (fuzzing) et la validation de la configuration. Les tests d'intrusion complètent ces contrôles.
  options:
    b:
      en: Security and privacy requirements are defined in the requirements phase, before design.
      fr: Les exigences de sécurité et de confidentialité sont définies pendant la phase des exigences, avant la conception.
    c:
      en: Data flow diagrams support threat modeling, which belongs to the design phase that the teams already perform.
      fr: Les diagrammes de flux de données servent à la modélisation des menaces, qui relève de la phase de conception que les équipes réalisent déjà.
    e:
      en: Training is a supporting activity of the SDL; it doesn't test code before release.
      fr: La formation est une activité de support du SDL ; elle ne teste pas le code avant la mise en production.
references:
  - title: Microsoft Security Development Lifecycle (SDL)
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-microsoft-security-development-lifecycle
