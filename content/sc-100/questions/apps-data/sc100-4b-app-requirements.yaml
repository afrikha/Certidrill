id: sc100-4b-app-requirements
objective: "4.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is designing a web application named App1 that will run in Azure App Service and be exposed to the internet. App1 reads and writes blobs in an Azure Storage account.

    You need to map a technology to each of the application security requirements.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. conçoit une application web nommée App1 qui s'exécutera dans Azure App Service et sera exposée à Internet. App1 lit et écrit des objets blob dans un compte Stockage Azure.

    Vous devez associer une technologie à chacune des exigences de sécurité de l'application.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      App1 must access the storage account without any credential in its code or configuration: [[ident]]

      SQL injection and cross-site scripting attempts must be blocked before they reach App1: [[l7]]

      No App Service app may be deployed in the subscription unless it accepts HTTPS only: [[govern]]
    fr: |
      App1 doit accéder au compte de stockage sans aucune information d'identification dans son code ou sa configuration : [[ident]]

      Les tentatives d'injection SQL et de scripting intersite doivent être bloquées avant d'atteindre App1 : [[l7]]

      Aucune application App Service ne doit être déployée dans l'abonnement si elle n'accepte pas uniquement HTTPS : [[govern]]
  slots:
    - id: ident
      options:
        - { id: sas, text: { en: "A SAS token stored in an app setting", fr: "Un jeton SAS stocké dans un paramètre d'application" } }
        - { id: mi, text: { en: "A managed identity with a Storage Blob Data role", fr: "Une identité managée avec un rôle Storage Blob Data" } }
        - { id: key, text: { en: "The storage account key stored in Azure Key Vault", fr: "La clé du compte de stockage stockée dans Azure Key Vault" } }
    - id: l7
      options:
        - { id: ddos, text: "Azure DDoS Protection" }
        - { id: nsg, text: { en: "A network security group", fr: "Un groupe de sécurité réseau" } }
        - { id: waf, text: "Azure Web Application Firewall" }
        - { id: defapp, text: "Microsoft Defender for App Service" }
    - id: govern
      options:
        - { id: rec, text: { en: "A Defender for Cloud recommendation", fr: "Une recommandation Defender for Cloud" } }
        - { id: deny, text: { en: "An Azure Policy assignment with the Deny effect", fr: "Une attribution Azure Policy avec l'effet Deny" } }
        - { id: lock, text: { en: "A ReadOnly lock on the subscription", fr: "Un verrou Lecture seule sur l'abonnement" } }
answer:
  values: { ident: mi, l7: waf, govern: deny }
explanation:
  correct:
    en: |
      A managed identity lets App1 obtain Microsoft Entra tokens without any credential to store, and a Storage Blob Data role authorizes it on the data. Azure WAF inspects HTTP requests and blocks common exploits such as SQL injection and cross-site scripting before they reach the app. An Azure Policy assignment with the Deny effect blocks the creation of noncompliant App Service apps.
    fr: |
      Une identité managée permet à App1 d'obtenir des jetons Microsoft Entra sans aucune information d'identification à stocker, et un rôle Storage Blob Data l'autorise sur les données. Azure WAF inspecte les requêtes HTTP et bloque les attaques courantes comme l'injection SQL et le scripting intersite avant qu'elles n'atteignent l'application. Une attribution Azure Policy avec l'effet Deny bloque la création d'applications App Service non conformes.
  options:
    sas:
      en: A SAS token is a credential stored in the configuration.
      fr: Un jeton SAS est une information d'identification stockée dans la configuration.
    key:
      en: The account key is still a credential that the app must retrieve and that must be rotated.
      fr: La clé du compte reste une information d'identification que l'application doit récupérer et qu'il faut renouveler.
    defapp:
      en: Defender for App Service detects attacks and raises alerts; it doesn't block requests.
      fr: Defender for App Service détecte les attaques et génère des alertes ; il ne bloque pas les requêtes.
    rec:
      en: A recommendation reports noncompliant apps after deployment; it doesn't prevent the deployment.
      fr: Une recommandation signale les applications non conformes après leur déploiement ; elle n'empêche pas le déploiement.
references:
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
  - title: Azure Web Application Firewall on Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview
