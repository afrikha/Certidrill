id: sc100-4b-api-inventory
objective: "4.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. publishes some APIs through Azure API Management. Other APIs run on AWS API Gateway, on on-premises servers, or are still under development. Nobody knows how many APIs exist or which versions are deployed where.

    You need to recommend a solution that provides a central inventory of all the organization's APIs, including their versions, definitions and deployments, and that supports design-time governance of API definitions.

    What should you recommend?
  fr: |
    Contoso, Ltd. publie certaines API via Azure API Management. D'autres API s'exécutent sur AWS API Gateway, sur des serveurs locaux, ou sont encore en cours de développement. Personne ne sait combien d'API existent ni quelles versions sont déployées où.

    Vous devez recommander une solution qui fournit un inventaire central de toutes les API de l'organisation, avec leurs versions, leurs définitions et leurs déploiements, et qui prend en charge la gouvernance des définitions d'API au moment de la conception.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: "Azure API Center" }
    - { id: b, text: "Microsoft Defender for APIs" }
    - { id: c, text: { en: "The developer portal of Azure API Management", fr: "Le portail des développeurs d'Azure API Management" } }
    - { id: d, text: { en: "Workspaces in Azure API Management", fr: "Les espaces de travail d'Azure API Management" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure API Center provides design-time API governance and centralized discovery. Its inventory includes APIs managed by API Management, APIs on other platforms, unmanaged APIs and APIs under development, with versions, definitions and deployments, and it can analyze API definitions against organizational standards.
    fr: |
      Azure API Center assure la gouvernance des API au moment de la conception et leur découverte centralisée. Son inventaire inclut les API gérées par API Management, les API d'autres plateformes, les API non gérées et les API en développement, avec leurs versions, définitions et déploiements, et il peut analyser les définitions d'API par rapport aux normes de l'organisation.
  options:
    b:
      en: Defender for APIs inventories and protects only the APIs published in Azure API Management.
      fr: Defender for APIs inventorie et protège uniquement les API publiées dans Azure API Management.
    c:
      en: The developer portal documents the APIs of one API Management instance for consumers; it doesn't inventory APIs hosted elsewhere.
      fr: Le portail des développeurs documente les API d'une instance API Management pour leurs consommateurs ; il n'inventorie pas les API hébergées ailleurs.
    d:
      en: Workspaces isolate administrative permissions inside an API Management instance; they don't inventory APIs on other platforms.
      fr: Les espaces de travail isolent les autorisations d'administration dans une instance API Management ; ils n'inventorient pas les API d'autres plateformes.
references:
  - title: What is Azure API Center?
    url: https://learn.microsoft.com/en-us/azure/api-center/overview
