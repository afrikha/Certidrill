id: sc100-4c-threat-mitigations
objective: "4.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is defining its data security roadmap for Azure and Microsoft 365. The risk register lists four threats to data, and the roadmap must assign the control that mitigates each threat first.

    Which control should you recommend for each threat? To answer, drag the appropriate controls to the correct threats. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation définit sa feuille de route de sécurité des données pour Azure et Microsoft 365. Le registre des risques recense quatre menaces sur les données, et la feuille de route doit attribuer à chacune le contrôle qui l'atténue en premier.

    Quel contrôle devez-vous recommander pour chaque menace ? Pour répondre, faites glisser les contrôles appropriés vers les menaces correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mi, text: { en: "Managed identities with Microsoft Entra authorization, and account keys disabled", fr: "Identités managées avec autorisation Microsoft Entra, et clés de compte désactivées" } }
    - { id: imm, text: { en: "Immutable storage with a locked time-based retention policy", fr: "Stockage immuable avec une stratégie de rétention limitée dans le temps verrouillée" } }
    - { id: irm, text: { en: "Microsoft Purview Insider Risk Management and DLP", fr: "Gestion des risques internes et DLP de Microsoft Purview" } }
    - { id: mal, text: { en: "Defender for Storage malware scanning", fr: "Analyse des programmes malveillants de Defender for Storage" } }
    - { id: cmk, text: { en: "Customer-managed keys for encryption at rest", fr: "Clés gérées par le client pour le chiffrement au repos" } }
  targets:
    - { id: t1, text: { en: "Connection strings with storage account keys leaked in a public code repository", fr: "Chaînes de connexion contenant des clés de compte de stockage divulguées dans un référentiel de code public" } }
    - { id: t2, text: { en: "Ransomware that deletes or overwrites archived records", fr: "Rançongiciel qui supprime ou écrase des enregistrements archivés" } }
    - { id: t3, text: { en: "Departing employees who copy confidential documents to personal cloud storage", fr: "Employés sur le départ qui copient des documents confidentiels vers un stockage cloud personnel" } }
    - { id: t4, text: { en: "Partners who upload infected files to a shared container", fr: "Partenaires qui chargent des fichiers infectés dans un conteneur partagé" } }
answer:
  mapping: { t1: mi, t2: imm, t3: irm, t4: mal }
explanation:
  correct:
    en: |-
      Leaked keys are mitigated by removing keys altogether, with managed identities and Microsoft Entra authorization. A locked time-based retention policy keeps records in a WORM state that no user can modify or delete. Insider Risk Management detects data theft by departing users and DLP blocks the copy. Malware scanning checks uploaded blobs for malicious content.
    fr: |-
      Les clés divulguées s'atténuent en supprimant les clés, avec des identités managées et l'autorisation Microsoft Entra. Une stratégie de rétention limitée dans le temps verrouillée maintient les enregistrements dans un état WORM qu'aucun utilisateur ne peut modifier ni supprimer. La gestion des risques internes détecte le vol de données par les utilisateurs sur le départ, et la DLP bloque la copie. L'analyse des programmes malveillants vérifie le contenu des objets blob chargés.
  options:
    cmk:
      en: |-
        Customer-managed keys control the encryption key, but data is decrypted transparently for any authorized request, including one made with a leaked account key.
      fr: |-
        Les clés gérées par le client contrôlent la clé de chiffrement, mais les données sont déchiffrées de façon transparente pour toute demande autorisée, y compris une demande faite avec une clé de compte divulguée.
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
  - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
