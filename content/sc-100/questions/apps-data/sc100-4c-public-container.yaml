id: sc100-4c-public-container
objective: "4.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. stores scanned customer contracts in a blob container of an Azure Storage account named stcontracts. An attack path in Defender CSPM shows that the container allows anonymous read access and that the account accepts connections from all networks.

    The only legitimate clients are applications in an Azure virtual network that authenticate with managed identities. You need to recommend the two actions to prioritize to stop the exposure of the contracts to the internet.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. stocke des contrats clients numérisés dans un conteneur d'objets blob d'un compte Stockage Azure nommé stcontracts. Un chemin d'attaque de Defender CSPM montre que le conteneur autorise l'accès en lecture anonyme et que le compte accepte les connexions depuis tous les réseaux.

    Les seuls clients légitimes sont des applications d'un réseau virtuel Azure qui s'authentifient avec des identités managées. Vous devez recommander les deux actions à traiter en priorité pour mettre fin à l'exposition des contrats sur Internet.

    Quelles sont les deux actions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Disallow anonymous access at the storage account level", fr: "Interdire l'accès anonyme au niveau du compte de stockage" } }
    - { id: b, text: { en: "Enable Defender for Storage on the storage account", fr: "Activer Defender for Storage sur le compte de stockage" } }
    - { id: c, text: { en: "Encrypt the storage account with a customer-managed key", fr: "Chiffrer le compte de stockage avec une clé gérée par le client" } }
    - { id: d, text: { en: "Disable public network access and add a private endpoint", fr: "Désactiver l'accès au réseau public et ajouter un point de terminaison privé" } }
    - { id: e, text: { en: "Enable blob versioning and blob soft delete", fr: "Activer le contrôle de version et la suppression réversible des objets blob" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Disallowing anonymous access at the account level overrides the container setting, so every request must be authorized. Disabling public network access and using a private endpoint removes the internet path for authorized callers too, which fits clients that run in a virtual network. Together they close both halves of the attack path.
    fr: |-
      Interdire l'accès anonyme au niveau du compte prévaut sur le paramètre du conteneur : chaque demande doit alors être autorisée. Désactiver l'accès au réseau public et utiliser un point de terminaison privé supprime aussi le chemin Internet pour les appelants autorisés, ce qui convient à des clients qui s'exécutent dans un réseau virtuel. Ensemble, ces actions ferment les deux moitiés du chemin d'attaque.
  options:
    b:
      en: |-
        Defender for Storage detects suspicious access, but it doesn't prevent anonymous reads from the internet.
      fr: |-
        Defender for Storage détecte les accès suspects, mais n'empêche pas les lectures anonymes depuis Internet.
    c:
      en: |-
        Encryption at rest is transparent to authorized and anonymous readers alike, so a customer-managed key doesn't reduce the exposure.
      fr: |-
        Le chiffrement au repos est transparent pour les lecteurs autorisés comme anonymes : une clé gérée par le client ne réduit pas l'exposition.
    e:
      en: |-
        Versioning and soft delete protect against deletion and overwrites, not against reading.
      fr: |-
        Le contrôle de version et la suppression réversible protègent contre la suppression et l'écrasement, pas contre la lecture.
references:
  - title: Remediate anonymous read access to blob data (Azure Resource Manager deployments)
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-prevent
