id: sc100-4a-portfolio-saas-and-azure
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has Microsoft 365 E5 and one Azure subscription. Its application portfolio contains:

    - 40 internally developed applications hosted on Azure App Service and Azure SQL Database.
    - An unknown number of SaaS applications that business units started using without IT approval. All employee devices are Windows 11 devices onboarded to Microsoft Defender for Endpoint.

    You need to recommend how to evaluate the security posture of the portfolio. The evaluation must assess the configuration of the Azure resources against the Microsoft cloud security benchmark, and must find the SaaS applications in use and rate their risk. The solution must minimize cost.

    Which two solutions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose de Microsoft 365 E5 et d'un abonnement Azure. Son portefeuille d'applications comprend :

    - 40 applications développées en interne, hébergées sur Azure App Service et Azure SQL Database.
    - Un nombre inconnu d'applications SaaS que des unités métier ont commencé à utiliser sans l'approbation de l'informatique. Tous les appareils des employés sont des appareils Windows 11 intégrés à Microsoft Defender for Endpoint.

    Vous devez recommander comment évaluer la posture de sécurité du portefeuille. L'évaluation doit apprécier la configuration des ressources Azure au regard du benchmark de sécurité cloud Microsoft (MCSB), et doit trouver les applications SaaS utilisées et évaluer leur risque. La solution doit réduire les coûts au minimum.

    Quelles sont les deux solutions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Foundational CSPM in Microsoft Defender for Cloud", fr: "Le CSPM de base de Microsoft Defender for Cloud" } }
    - { id: b, text: { en: "Microsoft Defender External Attack Surface Management", fr: "Microsoft Defender External Attack Surface Management" } }
    - { id: c, text: { en: "Cloud Discovery in Microsoft Defender for Cloud Apps", fr: "La découverte cloud (Cloud Discovery) de Microsoft Defender for Cloud Apps" } }
    - { id: d, text: { en: "Microsoft Purview Compliance Manager", fr: "Microsoft Purview Compliance Manager" } }
    - { id: e, text: { en: "The discovered apps inventory of Microsoft Intune", fr: "L'inventaire des applications découvertes de Microsoft Intune" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Foundational CSPM is free and assesses Azure resources against the Microsoft cloud security benchmark, with recommendations and a secure score. Cloud Discovery, fed by the Defender for Endpoint integration that Adatum already has, finds the cloud apps used and rates them with the risk indicators of the cloud app catalog.
    fr: |-
      Le CSPM de base est gratuit et évalue les ressources Azure au regard du benchmark de sécurité cloud Microsoft, avec des recommandations et un score de sécurité. La découverte cloud, alimentée par l'intégration de Defender for Endpoint dont Adatum dispose déjà, trouve les applications cloud utilisées et les évalue avec les indicateurs de risque du catalogue d'applications cloud.
  options:
    b:
      en: |-
        Defender EASM maps the company's own internet-facing assets from seeds; it doesn't find which third-party SaaS apps employees use, and it doesn't assess Azure configuration against MCSB.
      fr: |-
        Defender EASM cartographie à partir de valeurs de départ les ressources exposées à Internet de l'entreprise ; il ne trouve pas quelles applications SaaS tierces les employés utilisent et n'évalue pas la configuration Azure au regard du MCSB.
    d:
      en: |-
        Compliance Manager tracks regulatory controls for Microsoft 365; it neither assesses Azure resources against MCSB nor discovers SaaS apps.
      fr: |-
        Compliance Manager suit les contrôles réglementaires pour Microsoft 365 ; il n'évalue pas les ressources Azure au regard du MCSB et ne découvre pas les applications SaaS.
    e:
      en: |-
        Intune lists apps installed on managed devices; SaaS apps used in a browser don't appear there and aren't risk rated.
      fr: |-
        Intune liste les applications installées sur les appareils gérés ; les applications SaaS utilisées dans un navigateur n'y apparaissent pas et ne sont pas évaluées.
references:
  - title: Cloud app discovery overview
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/set-up-cloud-discovery
  - title: Defender EASM Overview
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview
