id: sc100-4b-dev-standards
objective: "4.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. is writing secure development standards for applications stored in Azure Repos and deployed to Azure with Bicep and Terraform templates. Each standard must be enforced by an automated scan.

    Which scan should you recommend for each standard? To answer, drag the appropriate scans to the correct standards. Each scan may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. rédige des normes de développement sécurisé pour des applications stockées dans Azure Repos et déployées dans Azure avec des modèles Bicep et Terraform. Chaque norme doit être appliquée par une analyse automatisée.

    Quelle analyse devez-vous recommander pour chaque norme ? Pour répondre, faites glisser les analyses appropriées vers les normes correspondantes. Chaque analyse peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dep, text: { en: "Dependency scanning", fr: "Analyse des dépendances" } }
    - { id: code, text: { en: "CodeQL code scanning", fr: "Analyse du code CodeQL" } }
    - { id: iac, text: { en: "Infrastructure as code scanning", fr: "Analyse de l'infrastructure as code (IaC)" } }
    - { id: secret, text: { en: "Secret scanning", fr: "Analyse des secrets" } }
    - { id: malware, text: { en: "Malware scanning in Defender for Storage", fr: "Analyse des programmes malveillants de Defender for Storage" } }
  targets:
    - { id: t1, text: { en: "Report known vulnerabilities in direct and transitive open-source packages", fr: "Signaler les vulnérabilités connues des packages open source directs et transitifs" } }
    - { id: t2, text: { en: "Report authentication bypass flaws in code written by the team", fr: "Signaler les failles de contournement de l'authentification dans le code écrit par l'équipe" } }
    - { id: t3, text: { en: "Report misconfigured resources in templates before deployment", fr: "Signaler les ressources mal configurées dans les modèles avant le déploiement" } }
    - { id: t4, text: { en: "Report credentials already present in the commit history", fr: "Signaler les informations d'identification déjà présentes dans l'historique des commits" } }
answer:
  mapping: { t1: dep, t2: code, t3: iac, t4: secret }
explanation:
  correct:
    en: |
      Dependency scanning finds known vulnerabilities in direct and transitive open-source dependencies. CodeQL code scanning is static analysis of the team's own code and finds issues such as authentication bypass. Infrastructure as code scanning checks Bicep, ARM and Terraform templates in the pipeline before anything is deployed. Secret scanning of the repository alerts on secrets already committed, including historical commits.
    fr: |
      L'analyse des dépendances trouve les vulnérabilités connues des dépendances open source directes et transitives. L'analyse du code CodeQL est une analyse statique du code de l'équipe et trouve des problèmes comme le contournement de l'authentification. L'analyse IaC vérifie les modèles Bicep, ARM et Terraform dans le pipeline avant tout déploiement. L'analyse des secrets du dépôt alerte sur les secrets déjà commités, y compris dans l'historique.
  options:
    malware:
      en: Defender for Storage malware scanning checks blobs uploaded to Azure Storage; it doesn't analyze source code or templates.
      fr: L'analyse des programmes malveillants de Defender for Storage vérifie les objets blob chargés dans Stockage Azure ; elle n'analyse ni le code source ni les modèles.
references:
  - title: Configure GitHub Advanced Security for Azure DevOps features
    url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features
  - title: Overview of Microsoft Defender for Cloud DevOps security
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-devops-introduction
