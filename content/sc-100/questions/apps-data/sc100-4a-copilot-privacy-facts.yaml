id: sc100-4a-copilot-privacy-facts
objective: "4.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans to deploy Microsoft 365 Copilot. The works council asks the security architect how Copilot handles organizational data before it approves the deployment.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit de déployer Microsoft 365 Copilot. Le comité d'entreprise demande à l'architecte sécurité comment Copilot traite les données de l'organisation avant d'approuver le déploiement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Copilot can include in a response organizational data that the user has no permission to view.
        fr: |-
          Copilot peut inclure dans une réponse des données de l'organisation que l'utilisateur n'a pas l'autorisation de consulter.
    - id: s2
      text:
        en: |-
          Prompts, responses and data accessed through Microsoft Graph are used to train the foundation large language models.
        fr: |-
          Les invites, les réponses et les données consultées par Microsoft Graph servent à entraîner les grands modèles de langage de fondation.
    - id: s3
      text:
        en: |-
          An eDiscovery search of a user's mailbox can find that user's Copilot prompts and responses.
        fr: |-
          Une recherche eDiscovery dans la boîte aux lettres d'un utilisateur peut trouver les invites et les réponses Copilot de cet utilisateur.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Copilot only surfaces organizational data to which the user has at least view permission. Prompts, responses and data accessed through Microsoft Graph aren't used to train foundation LLMs. User prompts and responses are stored in the user's mailbox, so an eDiscovery search of that mailbox with the Copilot activity type finds them.
    fr: |-
      Copilot ne fait apparaître que les données de l'organisation que l'utilisateur est au moins autorisé à consulter. Les invites, les réponses et les données consultées par Microsoft Graph ne servent pas à entraîner les grands modèles de langage de fondation. Les invites et les réponses de l'utilisateur sont stockées dans sa boîte aux lettres : une recherche eDiscovery dans cette boîte aux lettres avec le type d'activité Copilot les trouve.
references:
  - title: Data, Privacy, and Security for Microsoft Copilot
    url: https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-privacy
  - title: Microsoft Purview data security and compliance protections for Microsoft 365 Copilot and other generative AI apps
    url: https://learn.microsoft.com/en-us/purview/ai-microsoft-purview
