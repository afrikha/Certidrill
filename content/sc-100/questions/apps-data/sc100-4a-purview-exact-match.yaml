id: sc100-4a-purview-exact-match
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has Microsoft 365 E5. Its customer database contains 2 million rows with the customer name, account number and date of birth of each customer. Account numbers are 10-digit numbers with no checksum.

    A pilot DLP policy that uses a custom sensitive information type based on a regular expression generates many false positives, because invoices and order numbers use the same format.

    You need to recommend a classification method so that DLP policies detect only the real account numbers of Woodgrove customers, especially when they appear with the customer's name.

    What should you recommend?
  fr: |
    Woodgrove Bank dispose de Microsoft 365 E5. Sa base de données clients contient 2 millions de lignes avec le nom, le numéro de compte et la date de naissance de chaque client. Les numéros de compte sont des nombres à 10 chiffres sans somme de contrôle.

    Une stratégie DLP pilote qui utilise un type d'informations sensibles personnalisé fondé sur une expression régulière génère de nombreux faux positifs, car les factures et les numéros de commande utilisent le même format.

    Vous devez recommander une méthode de classification afin que les stratégies DLP ne détectent que les vrais numéros de compte des clients de Woodgrove, en particulier lorsqu'ils apparaissent avec le nom du client.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A sensitive information type based on exact data match (EDM)", fr: "Un type d'informations sensibles fondé sur la correspondance exacte des données (EDM)" } }
    - { id: b, text: { en: "A trainable classifier trained on samples of customer statements", fr: "Un classifieur entraînable entraîné sur des exemples de relevés clients" } }
    - { id: c, text: { en: "A document fingerprint created from a blank account opening form", fr: "Une empreinte de document créée à partir d'un formulaire vierge d'ouverture de compte" } }
    - { id: d, text: { en: "A custom sensitive information type with additional keywords and a higher confidence level", fr: "Un type d'informations sensibles personnalisé avec des mots clés supplémentaires et un niveau de confiance plus élevé" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An exact data match sensitive information type compares content with the actual values of a sensitive table uploaded as hashes, such as the customer database. It detects an account number only if it matches a real customer value, and it can require supporting fields such as the customer's name, which removes the false positives that pattern-based types produce.
    fr: |-
      Un type d'informations sensibles fondé sur la correspondance exacte des données compare le contenu aux valeurs réelles d'une table sensible chargée sous forme de hachages, comme la base de données clients. Il ne détecte un numéro de compte que s'il correspond à une valeur réelle d'un client, et il peut exiger des champs complémentaires comme le nom du client, ce qui élimine les faux positifs des types fondés sur des modèles.
  options:
    b:
      en: |-
        A trainable classifier recognizes categories of documents, not specific values that belong to real customers.
      fr: |-
        Un classifieur entraînable reconnaît des catégories de documents, pas des valeurs précises appartenant à de vrais clients.
    c:
      en: |-
        Document fingerprinting detects documents derived from a standard form; account numbers that appear in emails or other files wouldn't match.
      fr: |-
        L'empreinte de document détecte des documents dérivés d'un formulaire standard ; des numéros de compte présents dans des e-mails ou d'autres fichiers ne correspondraient pas.
    d:
      en: |-
        Keywords and confidence levels still rely on the 10-digit pattern, so invoice and order numbers near the same keywords would still match.
      fr: |-
        Les mots clés et les niveaux de confiance reposent toujours sur le modèle à 10 chiffres : des numéros de facture ou de commande proches des mêmes mots clés correspondraient encore.
references:
  - title: Learn about exact data match based sensitive information types
    url: https://learn.microsoft.com/en-us/purview/sit-learn-about-exact-data-match-based-sits
