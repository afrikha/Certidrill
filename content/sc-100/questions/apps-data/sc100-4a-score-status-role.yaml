id: sc100-4a-score-status-role
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Secure Score to track the posture of its Microsoft 365 workloads. Defender unified role-based access control (RBAC) isn't activated, so access to Secure Score is governed by Microsoft Entra roles.

    A posture team will review the recommended actions every month. Team members must be able to change the status of recommended actions and add notes to them. They must not be able to manage users, groups or other tenant settings beyond what this task requires.

    You need to recommend a Microsoft Entra role for the team. The solution must follow the principle of least privilege.

    Which role should you recommend?
  fr: |
    Adatum Corporation utilise le Niveau de sécurité Microsoft pour suivre la posture de ses charges de travail Microsoft 365. Le contrôle d'accès en fonction du rôle (RBAC) unifié de Defender n'est pas activé : l'accès au Niveau de sécurité Microsoft est donc régi par les rôles Microsoft Entra.

    Une équipe chargée de la posture examinera les actions recommandées chaque mois. Ses membres doivent pouvoir modifier le statut des actions recommandées et y ajouter des notes. Ils ne doivent pas pouvoir gérer les utilisateurs, les groupes ni d'autres paramètres du locataire au-delà de ce que cette tâche exige.

    Vous devez recommander un rôle Microsoft Entra pour l'équipe. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous recommander ?
body:
  options:
    - { id: a, text: Security Operator }
    - { id: b, text: Global Reader }
    - { id: c, text: Global Administrator }
    - { id: d, text: Security Administrator }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With Microsoft Entra roles, Security Administrator (or higher), Exchange Administrator and SharePoint Administrator have read and write access to Secure Score, which includes editing the status and notes of recommended actions. Security Administrator is the least privileged of these roles for a team that works across all the Microsoft 365 workloads.
    fr: |-
      Avec les rôles Microsoft Entra, Security Administrator (ou un rôle supérieur), Exchange Administrator et SharePoint Administrator disposent d'un accès en lecture et en écriture au Niveau de sécurité Microsoft, ce qui inclut la modification du statut et des notes des actions recommandées. Security Administrator est le moins privilégié de ces rôles pour une équipe qui travaille sur toutes les charges de travail Microsoft 365.
  options:
    a:
      en: |-
        Security Operator has read-only access to Secure Score; it can't edit the status or notes of a recommended action.
      fr: |-
        Security Operator dispose d'un accès en lecture seule au Niveau de sécurité Microsoft ; il ne peut pas modifier le statut ni les notes d'une action recommandée.
    b:
      en: |-
        Global Reader has read-only access to Secure Score, so team members couldn't change any status.
      fr: |-
        Global Reader dispose d'un accès en lecture seule au Niveau de sécurité Microsoft : les membres de l'équipe ne pourraient modifier aucun statut.
    c:
      en: |-
        Global Administrator can edit Secure Score but also manages users, groups and every tenant setting, which breaks least privilege.
      fr: |-
        Global Administrator peut modifier le Niveau de sécurité Microsoft, mais gère aussi les utilisateurs, les groupes et tous les paramètres du locataire, ce qui enfreint le principe du moindre privilège.
references:
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
