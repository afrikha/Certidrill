id: sc100-4b-sdl-sequence
objective: "4.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is starting the development of a new claims-processing application that will handle health data. You are designing the application security lifecycle by following the Microsoft Security Development Lifecycle (SDL).

    The lifecycle must identify risks as early as possible and must limit the impact of a faulty build on users.

    Which four actions should you include in the lifecycle, in the order in which they occur? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso, Ltd. lance le développement d'une nouvelle application de traitement des demandes de remboursement qui traitera des données de santé. Vous concevez le cycle de vie de la sécurité de l'application en suivant le Microsoft Security Development Lifecycle (SDL).

    Le cycle de vie doit identifier les risques le plus tôt possible et doit limiter l'impact d'une build défectueuse sur les utilisateurs.

    Quelles sont les quatre actions à inclure dans le cycle de vie, dans l'ordre où elles se produisent ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: req, text: { en: "Define the security and privacy requirements based on the health data that the application handles.", fr: "Définir les exigences de sécurité et de confidentialité en fonction des données de santé que traite l'application." } }
    - { id: tm, text: { en: "Build a threat model from data flow diagrams of the application and rate each threat.", fr: "Créer un modèle de menaces à partir de diagrammes de flux de données de l'application et évaluer chaque menace." } }
    - { id: scan, text: { en: "Run static code analysis and credential scanning on every pull request.", fr: "Exécuter l'analyse statique du code et l'analyse des informations d'identification à chaque demande de tirage." } }
    - { id: rings, text: { en: "Release each build in deployment rings, starting with the development team.", fr: "Mettre en production chaque build par anneaux de déploiement, en commençant par l'équipe de développement." } }
    - { id: latereview, text: { en: "Perform the first threat model review after the application is released to all users.", fr: "Effectuer la première revue du modèle de menaces après la mise en production de l'application pour tous les utilisateurs." } }
    - { id: bigbang, text: { en: "Release each build to all users at the same time after a manual approval.", fr: "Mettre en production chaque build pour tous les utilisateurs en même temps après une approbation manuelle." } }
answer:
  sequence: [ req, tm, scan, rings ]
explanation:
  correct:
    en: |
      In the SDL, requirements are defined first, then the design phase produces the threat model, the verification phase runs automated checks such as static analysis and credential scanning, and the release phase rolls builds out gradually through a safe deployment process in rings. Rings limit the impact of a faulty build because only a small group receives it first.
    fr: |
      Dans le SDL, les exigences sont définies en premier, puis la phase de conception produit le modèle de menaces, la phase de vérification exécute des contrôles automatisés comme l'analyse statique et l'analyse des informations d'identification, et la phase de mise en production déploie les builds progressivement par un processus de déploiement sûr en anneaux. Les anneaux limitent l'impact d'une build défectueuse, car seul un petit groupe la reçoit d'abord.
  options:
    latereview:
      en: Threat models are created and reviewed during design, before release. Waiting until after release identifies risks too late.
      fr: Les modèles de menaces sont créés et revus pendant la conception, avant la mise en production. Attendre la mise en production identifie les risques trop tard.
    bigbang:
      en: Releasing to all users at once exposes everyone to a faulty build; the SDL uses gradual ring deployment instead.
      fr: Une mise en production simultanée pour tous expose tous les utilisateurs à une build défectueuse ; le SDL utilise plutôt un déploiement progressif par anneaux.
references:
  - title: Microsoft Security Development Lifecycle (SDL)
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-microsoft-security-development-lifecycle
