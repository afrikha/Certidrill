id: sc100-4b-apim-misconfig
objective: "4.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is reviewing the configuration of its Azure API Management instance against the OWASP API Security Top 10 risk "security misconfiguration". The review found that back-end credentials are written in clear text inside policy definitions, and that the gateway still accepts TLS 1.0 connections from older clients.

    You need to recommend changes that address the findings.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. examine la configuration de son instance Azure API Management au regard du risque « mauvaise configuration de sécurité » du Top 10 OWASP de la sécurité des API. L'examen a révélé que des informations d'identification de back-end sont écrites en clair dans des définitions de stratégies, et que la passerelle accepte encore des connexions TLS 1.0 de clients anciens.

    Vous devez recommander des modifications qui corrigent ces constats.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Move the credentials to named values that reference secrets in Azure Key Vault.", fr: "Déplacer les informations d'identification vers des valeurs nommées qui référencent des secrets dans Azure Key Vault." } }
    - { id: b, text: { en: "Move the credentials to query string parameters that the client applications send.", fr: "Déplacer les informations d'identification vers des paramètres de chaîne de requête envoyés par les applications clientes." } }
    - { id: c, text: { en: "Disable TLS 1.0 and TLS 1.1 on the gateway, and audit the setting with Azure Policy.", fr: "Désactiver TLS 1.0 et TLS 1.1 sur la passerelle, et auditer le paramètre avec Azure Policy." } }
    - { id: d, text: { en: "Add a CORS policy that allows all origins so that older clients keep working.", fr: "Ajouter une stratégie CORS qui autorise toutes les origines pour que les clients anciens continuent de fonctionner." } }
    - { id: e, text: { en: "Publish the APIs in an open product that doesn't require a subscription.", fr: "Publier les API dans un produit ouvert qui n'exige pas d'abonnement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Secrets must not be stored in policies or source control: named values that reference Key Vault secrets, accessed with a managed identity, keep them out of the policy definitions. The gateway should reject TLS 1.0 and 1.1, and Azure Policy can audit that the setting stays compliant.
    fr: |
      Les secrets ne doivent pas être stockés dans les stratégies ni dans le contrôle de code source : des valeurs nommées qui référencent des secrets Key Vault, lues avec une identité managée, les retirent des définitions de stratégies. La passerelle doit refuser TLS 1.0 et 1.1, et Azure Policy peut auditer que le paramètre reste conforme.
  options:
    b:
      en: Credentials should travel in headers, not in URLs, and moving back-end credentials to clients exposes them further.
      fr: Les informations d'identification doivent circuler dans les en-têtes, pas dans les URL, et confier les informations d'identification du back-end aux clients les expose davantage.
    d:
      en: A CORS policy with a wildcard origin is itself a misconfiguration that Microsoft recommends avoiding.
      fr: Une stratégie CORS avec une origine générique est en soi une mauvaise configuration que Microsoft recommande d'éviter.
    e:
      en: Open products without subscription requirements remove a layer of access control; APIs should be published through products that require subscriptions.
      fr: Les produits ouverts sans abonnement suppriment une couche de contrôle d'accès ; les API doivent être publiées via des produits qui exigent un abonnement.
references:
  - title: Mitigate OWASP API security top 10 in Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/mitigate-owasp-api-threats
