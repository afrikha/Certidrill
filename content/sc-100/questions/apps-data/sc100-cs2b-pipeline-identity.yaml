id: sc100-cs2b-pipeline-identity
objective: "4.2.6"
type: single
caseStudy: sc100-cs2b-vanarsdel-payments
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend how the GitHub Actions workflows authenticate to Azure to deploy the merchant portal. The solution must meet the workload requirements.

    What should you recommend?
  fr: |
    Vous devez recommander la façon dont les workflows GitHub Actions s'authentifient auprès d'Azure pour déployer le portail des commerçants. La solution doit répondre aux exigences relatives aux charges de travail.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A client secret of the service principal that the workflow reads from Azure Key Vault at run time", fr: "Un secret client du principal de service que le workflow lit dans Azure Key Vault à l'exécution" } }
    - { id: b, text: { en: "A certificate credential of the service principal that is stored as a GitHub environment secret", fr: "Une information d'identification par certificat du principal de service, stockée comme secret d'environnement GitHub" } }
    - { id: c, text: { en: "The system-assigned managed identity of the App Service app, used by the GitHub-hosted runner", fr: "L'identité managée affectée par le système de l'application App Service, utilisée par l'exécuteur hébergé par GitHub" } }
    - { id: d, text: { en: "A user-assigned managed identity with a federated credential that trusts the GitHub repository", fr: "Une identité managée affectée par l'utilisateur avec des informations d'identification fédérées qui approuvent le dépôt GitHub" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Workload identity federation lets a GitHub Actions workflow exchange the token issued by GitHub for a Microsoft Entra access token, so no secret or certificate is stored anywhere. The federated credential is configured on a user-assigned managed identity (or an app registration), and its issuer, subject and audience must match the token of the repository, branch or environment that runs the deployment.
    fr: |
      La fédération des identités de charge de travail permet à un workflow GitHub Actions d'échanger le jeton émis par GitHub contre un jeton d'accès Microsoft Entra ; aucun secret ni certificat n'est donc stocké. Les informations d'identification fédérées sont configurées sur une identité managée affectée par l'utilisateur (ou une inscription d'application), et leurs valeurs issuer, subject et audience doivent correspondre au jeton du dépôt, de la branche ou de l'environnement qui exécute le déploiement.
  options:
    a:
      en: The workflow would need another credential to read the vault, and the client secret is still a stored, long-lived secret.
      fr: Le workflow aurait besoin d'une autre information d'identification pour lire le coffre, et le secret client reste un secret stocké à longue durée de vie.
    b:
      en: A certificate stored in GitHub is still a stored credential, which the requirements forbid.
      fr: Un certificat stocké dans GitHub reste une information d'identification stockée, ce que les exigences interdisent.
    c:
      en: A system-assigned managed identity can be used only by code that runs on its Azure resource; a GitHub-hosted runner can't obtain its tokens.
      fr: Une identité managée affectée par le système ne peut être utilisée que par du code qui s'exécute sur sa ressource Azure ; un exécuteur hébergé par GitHub ne peut pas obtenir ses jetons.
references:
  - title: Workload Identity Federation
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
