id: sc100-4b-discovery-tools
objective: "4.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has SQL Server databases on-premises, Azure Data Lake Storage accounts, and Microsoft 365 content. The chief data officer wants a governance program that starts with data discovery and classification.

    You need to recommend a solution for each requirement.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose de bases de données SQL Server locales, de comptes Azure Data Lake Storage et de contenu Microsoft 365. Le responsable des données veut un programme de gouvernance qui commence par la découverte et la classification des données.

    Vous devez recommander une solution pour chaque exigence.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Scan and classify the on-premises databases and the Data Lake Storage accounts, and keep their metadata up to date for data governance: [[map]]

      Automatically apply a Confidential marking with encryption to Microsoft 365 documents that match the classification: [[mark]]
    fr: |
      Analyser et classifier les bases de données locales et les comptes Data Lake Storage, et tenir leurs métadonnées à jour pour la gouvernance des données : [[map]]

      Appliquer automatiquement un marquage Confidentiel avec chiffrement aux documents Microsoft 365 qui correspondent à la classification : [[mark]]
  slots:
    - id: map
      options:
        - { id: datamap, text: "Microsoft Purview Data Map" }
        - { id: cspm, text: { en: "Sensitive data discovery in Defender CSPM", fr: "La découverte des données sensibles de Defender CSPM" } }
        - { id: sqldc, text: { en: "Data Discovery & Classification in Azure SQL", fr: "Data Discovery & Classification dans Azure SQL" } }
        - { id: dlp, text: { en: "Microsoft Purview Data Loss Prevention", fr: "Protection contre la perte de données Microsoft Purview" } }
    - id: mark
      options:
        - { id: sens, text: { en: "A sensitivity label applied by auto-labeling", fr: "Une étiquette de confidentialité appliquée par l'étiquetage automatique" } }
        - { id: ret, text: { en: "A retention label applied automatically", fr: "Une étiquette de rétention appliquée automatiquement" } }
        - { id: sit, text: { en: "A custom sensitive information type", fr: "Un type d'informations sensibles personnalisé" } }
        - { id: tc, text: { en: "A trainable classifier", fr: "Un classifieur entraînable" } }
answer:
  values: { map: datamap, mark: sens }
explanation:
  correct:
    en: |
      The Microsoft Purview Data Map captures metadata about data across hybrid, on-premises and multicloud sources, and its built-in scanning and classification keep it up to date; it's the foundation for data discovery and governance. A sensitivity label is the business decision that carries protection such as encryption, and auto-labeling applies it when content matches a sensitive information type or a trainable classifier.
    fr: |
      Microsoft Purview Data Map capture les métadonnées des données de sources hybrides, locales et multicloud, et l'analyse et la classification intégrées le tiennent à jour ; c'est la base de la découverte et de la gouvernance des données. Une étiquette de confidentialité est la décision métier qui porte une protection comme le chiffrement, et l'étiquetage automatique l'applique lorsque le contenu correspond à un type d'informations sensibles ou à un classifieur entraînable.
  options:
    cspm:
      en: Defender CSPM sensitive data discovery adds data context to cloud posture and attack paths; it doesn't scan on-premises SQL Server for a governance catalog.
      fr: La découverte des données sensibles de Defender CSPM ajoute un contexte de données à la posture cloud et aux chemins d'attaque ; elle n'analyse pas SQL Server local pour un catalogue de gouvernance.
    sqldc:
      en: Data Discovery & Classification works inside Azure SQL Database and SQL Managed Instance only.
      fr: Data Discovery & Classification ne fonctionne que dans Azure SQL Database et SQL Managed Instance.
    sit:
      en: Sensitive information types and classifiers detect content; the marking and encryption come from the sensitivity label.
      fr: Les types d'informations sensibles et les classifieurs détectent le contenu ; le marquage et le chiffrement viennent de l'étiquette de confidentialité.
    tc:
      en: Sensitive information types and classifiers detect content; the marking and encryption come from the sensitivity label.
      fr: Les types d'informations sensibles et les classifieurs détectent le contenu ; le marquage et le chiffrement viennent de l'étiquette de confidentialité.
references:
  - title: Microsoft Purview Data Map overview
    url: https://learn.microsoft.com/en-us/purview/concept-elastic-data-map
  - title: Learn about trainable classifiers
    url: https://learn.microsoft.com/en-us/purview/trainable-classifiers-learn-about
