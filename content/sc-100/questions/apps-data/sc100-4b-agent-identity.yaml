id: sc100-4b-agent-identity
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys is building an AI customer service solution. Each customer conversation starts a new instance of an autonomous AI agent, and instances are created and deleted thousands of times per day. The agent instances call Microsoft Graph and internal APIs protected by Microsoft Entra ID.

    You need to recommend an identity solution that meets the following requirements:

    - Each agent instance must have its own identity so that its actions can be audited.
    - The same security policies must apply to all instances from a single template.
    - Deleted instances must not leave orphaned credentials or permission assignments.

    What should you recommend?
  fr: |
    Tailspin Toys développe une solution de service client fondée sur l'IA. Chaque conversation client démarre une nouvelle instance d'un agent d'IA autonome, et des instances sont créées et supprimées des milliers de fois par jour. Les instances d'agent appellent Microsoft Graph et des API internes protégées par Microsoft Entra ID.

    Vous devez recommander une solution d'identité qui respecte les exigences suivantes :

    - Chaque instance d'agent doit avoir sa propre identité afin que ses actions puissent être auditées.
    - Les mêmes stratégies de sécurité doivent s'appliquer à toutes les instances à partir d'un modèle unique.
    - Les instances supprimées ne doivent pas laisser d'informations d'identification ni d'attributions d'autorisations orphelines.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One user-assigned managed identity shared by all the agent instances", fr: "Une identité managée affectée par l'utilisateur partagée par toutes les instances d'agent" } }
    - { id: b, text: { en: "An app registration with a certificate for each agent instance", fr: "Une inscription d'application avec un certificat pour chaque instance d'agent" } }
    - { id: c, text: { en: "A licensed user account for each agent instance", fr: "Un compte d'utilisateur sous licence pour chaque instance d'agent" } }
    - { id: d, text: { en: "Agent identities created from an agent identity blueprint", fr: "Des identités d'agent créées à partir d'un blueprint d'identité d'agent" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft Entra Agent ID provides agent identities, built for dynamic, short-lived agents that can be created and destroyed thousands of times per day. An agent identity blueprint is the template from which agent identities are created, so consistent policies apply to all of them, and agents can be retired without orphaned credentials or permission assignments.
    fr: |
      Microsoft Entra Agent ID fournit des identités d'agent, conçues pour des agents dynamiques et éphémères qui peuvent être créés et détruits des milliers de fois par jour. Un blueprint d'identité d'agent est le modèle à partir duquel les identités d'agent sont créées : des stratégies cohérentes s'appliquent à toutes, et les agents peuvent être retirés sans laisser d'informations d'identification ni d'attributions d'autorisations orphelines.
  options:
    a:
      en: A shared identity gives every instance the same identity, so the actions of one instance can't be audited separately.
      fr: "Une identité partagée donne la même identité à toutes les instances : les actions d'une instance ne peuvent pas être auditées séparément."
    b:
      en: Application identities are designed for services with long-term stability and known ownership; creating thousands of registrations and certificates per day leaves credentials to clean up.
      fr: Les identités d'application sont conçues pour des services stables dans la durée et dont le propriétaire est connu ; créer des milliers d'inscriptions et de certificats par jour laisse des informations d'identification à nettoyer.
    c:
      en: Agent identities don't use human authentication mechanisms; user accounts are designed for people, with passwords, MFA and mailboxes.
      fr: Les identités d'agent n'utilisent pas les mécanismes d'authentification humains ; les comptes d'utilisateur sont conçus pour des personnes, avec mots de passe, authentification multifacteur et boîtes aux lettres.
references:
