id: sc100-4b-frontdoor-only
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation publishes a customer portal that runs in an Azure App Service web app named app-portal. The app has a public endpoint and is published to the internet through an Azure Front Door profile named fd-adatum, which has a WAF policy.

    During a penetration test, the testers bypassed the WAF by sending requests directly to the default host name of app-portal. You need to recommend a solution that ensures that app-portal accepts HTTP requests only from fd-adatum, including rejecting requests relayed by Front Door profiles of other organizations. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Adatum Corporation publie un portail client qui s'exécute dans une application web Azure App Service nommée app-portal. L'application a un point de terminaison public et est publiée sur Internet via un profil Azure Front Door nommé fd-adatum, qui a une stratégie WAF.

    Pendant un test d'intrusion, les testeurs ont contourné le WAF en envoyant des requêtes directement au nom d'hôte par défaut d'app-portal. Vous devez recommander une solution qui garantit qu'app-portal n'accepte les requêtes HTTP que de fd-adatum, y compris en rejetant les requêtes relayées par les profils Front Door d'autres organisations. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable virtual network integration on app-portal, and associate an NSG that allows only the AzureFrontDoor.Backend service tag.", fr: "Activer l'intégration au réseau virtuel sur app-portal, et associer un NSG qui n'autorise que l'étiquette de service AzureFrontDoor.Backend." } }
    - { id: b, text: { en: "Add an access restriction rule on app-portal that allows only the AzureFrontDoor.Backend service tag.", fr: "Ajouter sur app-portal une règle de restriction d'accès qui n'autorise que l'étiquette de service AzureFrontDoor.Backend." } }
    - { id: c, text: { en: "Add an access restriction rule on app-portal that allows the AzureFrontDoor.Backend service tag and filters on the X-Azure-FDID header of fd-adatum.", fr: "Ajouter sur app-portal une règle de restriction d'accès qui autorise l'étiquette de service AzureFrontDoor.Backend et filtre sur l'en-tête X-Azure-FDID de fd-adatum." } }
    - { id: d, text: { en: "Assign a managed identity to fd-adatum, and grant the identity the Website Contributor role on app-portal.", fr: "Attribuer une identité managée à fd-adatum, et accorder à l'identité le rôle Website Contributor sur app-portal." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Traffic from Front Door comes from the IP ranges of the AzureFrontDoor.Backend service tag, which are shared by all Front Door customers. An access restriction rule that combines the service tag with the X-Azure-FDID header value, which identifies a specific Front Door instance, accepts only the requests that come through fd-adatum.
    fr: |
      Le trafic venant de Front Door provient des plages IP de l'étiquette de service AzureFrontDoor.Backend, partagées par tous les clients de Front Door. Une règle de restriction d'accès qui combine l'étiquette de service et la valeur de l'en-tête X-Azure-FDID, qui identifie une instance Front Door précise, n'accepte que les requêtes qui passent par fd-adatum.
  options:
    a:
      en: Virtual network integration is for outbound traffic from the app into a virtual network; it doesn't filter inbound requests to the app.
      fr: L'intégration au réseau virtuel concerne le trafic sortant de l'application vers un réseau virtuel ; elle ne filtre pas les requêtes entrantes vers l'application.
    b:
      en: The service tag alone also allows requests relayed by Front Door profiles that belong to other organizations.
      fr: L'étiquette de service seule autorise aussi les requêtes relayées par des profils Front Door appartenant à d'autres organisations.
    d:
      en: A role assignment authorizes management operations on the app; it doesn't control which clients can send HTTP requests to it.
      fr: Une attribution de rôle autorise des opérations de gestion sur l'application ; elle ne contrôle pas les clients qui peuvent lui envoyer des requêtes HTTP.
references:
  - title: Azure App Service access restrictions
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-access-restrictions
