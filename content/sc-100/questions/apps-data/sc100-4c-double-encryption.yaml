id: sc100-4c-double-encryption
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. stores regulated research data in an existing general-purpose v2 storage account named stresearch. The account contains blob containers and Azure Files shares, and it uses customer-managed keys for encryption at rest. Infrastructure encryption wasn't enabled when the account was created.

    A new regulation requires all the data in the account, blobs and file shares alike, to be encrypted twice at rest, at the service level and at the infrastructure level, with two different keys. The data must stay in Azure Storage.

    What should you recommend?
  fr: |
    Proseware, Inc. stocke des données de recherche réglementées dans un compte de stockage existant à usage général v2 nommé stresearch. Le compte contient des conteneurs d'objets blob et des partages Azure Files, et il utilise des clés gérées par le client pour le chiffrement au repos. Le chiffrement d'infrastructure n'a pas été activé lors de la création du compte.

    Une nouvelle réglementation exige que toutes les données du compte, objets blob comme partages de fichiers, soient chiffrées deux fois au repos, au niveau du service et au niveau de l'infrastructure, avec deux clés différentes. Les données doivent rester dans Stockage Azure.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable infrastructure encryption in the encryption settings of stresearch", fr: "Activer le chiffrement d'infrastructure dans les paramètres de chiffrement de stresearch" } }
    - { id: b, text: { en: "Create a storage account with infrastructure encryption enabled and migrate the data to it", fr: "Créer un compte de stockage avec le chiffrement d'infrastructure activé et y migrer les données" } }
    - { id: c, text: { en: "Move the customer-managed key of stresearch to an Azure Key Vault Managed HSM", fr: "Déplacer la clé gérée par le client de stresearch vers un HSM managé Azure Key Vault" } }
    - { id: d, text: { en: "Create an encryption scope with infrastructure encryption enabled and make it the default scope of every container", fr: "Créer une étendue de chiffrement avec le chiffrement d'infrastructure activé et en faire l'étendue par défaut de chaque conteneur" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With infrastructure encryption, data is encrypted twice, at the service level and at the infrastructure level, with two different algorithms and keys; the infrastructure layer always uses a separate Microsoft-managed key. You can't enable infrastructure encryption on an existing account, so the data must move to a new account created with it, which covers both blobs and file shares.
    fr: |-
      Avec le chiffrement d'infrastructure, les données sont chiffrées deux fois, au niveau du service et au niveau de l'infrastructure, avec deux algorithmes et deux clés différents ; la couche d'infrastructure utilise toujours une clé distincte gérée par Microsoft. Vous ne pouvez pas activer le chiffrement d'infrastructure sur un compte existant : les données doivent donc être déplacées vers un nouveau compte créé avec ce chiffrement, qui couvre à la fois les objets blob et les partages de fichiers.
  options:
    a:
      en: |-
        Infrastructure encryption can't be enabled or disabled after the storage account is created.
      fr: |-
        Le chiffrement d'infrastructure ne peut être ni activé ni désactivé après la création du compte de stockage.
    c:
      en: |-
        Moving the key to a Managed HSM changes where the key is protected, not the number of encryption layers.
      fr: |-
        Déplacer la clé vers un HSM managé change l'endroit où la clé est protégée, pas le nombre de couches de chiffrement.
    d:
      en: |-
        An encryption scope with infrastructure encryption doubly encrypts blob data, but encryption scopes apply to Blob Storage only, so the file shares stay single-encrypted.
      fr: |-
        Une étendue de chiffrement avec le chiffrement d'infrastructure chiffre deux fois les données d'objets blob, mais les étendues de chiffrement ne s'appliquent qu'au Stockage Blob : les partages de fichiers restent chiffrés une seule fois.
references:
  - title: Enable infrastructure encryption for double encryption of data
    url: https://learn.microsoft.com/en-us/azure/storage/common/infrastructure-encryption-enable
