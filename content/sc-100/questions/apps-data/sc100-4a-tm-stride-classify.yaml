id: sc100-4a-tm-stride-classify
objective: "4.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. is threat modeling its online ordering application, which is business critical. The threat modeling workshop recorded the following threats.

    Which STRIDE category should you assign to each threat? To answer, drag the appropriate categories to the correct threats. Each category may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. modélise les menaces de son application de commande en ligne, vitale pour l'entreprise. L'atelier de modélisation des menaces a consigné les menaces suivantes.

    Quelle catégorie STRIDE devez-vous attribuer à chaque menace ? Pour répondre, faites glisser les catégories appropriées vers les menaces correspondantes. Chaque catégorie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: spoof, text: { en: "Spoofing", fr: "Usurpation d'identité (Spoofing)" } }
    - { id: tamper, text: { en: "Tampering", fr: "Falsification (Tampering)" } }
    - { id: repud, text: { en: "Repudiation", fr: "Répudiation (Repudiation)" } }
    - { id: disclose, text: { en: "Information disclosure", fr: "Divulgation d'informations (Information disclosure)" } }
    - { id: dos, text: { en: "Denial of service", fr: "Déni de service (Denial of service)" } }
    - { id: eop, text: { en: "Elevation of privilege", fr: "Élévation de privilèges (Elevation of privilege)" } }
  targets:
    - id: t1
      text: { en: "An attacker uses a stolen password to sign in as a store manager", fr: "Un attaquant utilise un mot de passe volé pour se connecter en tant que responsable de magasin" }
    - id: t2
      text: { en: "A customer claims never to have placed an order, and the application has no record that proves otherwise", fr: "Un client affirme n'avoir jamais passé une commande, et l'application n'a aucun enregistrement qui prouve le contraire" }
    - id: t3
      text: { en: "An attacker changes the price of an item in the order request while it travels over an unencrypted connection", fr: "Un attaquant modifie le prix d'un article dans la requête de commande pendant qu'elle transite par une connexion non chiffrée" }
    - id: t4
      text: { en: "A customer account calls an administrative endpoint and gains the right to delete other customers' orders", fr: "Un compte client appelle un point de terminaison d'administration et obtient le droit de supprimer les commandes d'autres clients" }
answer:
  mapping: { t1: spoof, t2: repud, t3: tamper, t4: eop }
explanation:
  correct:
    en: |-
      Spoofing is using another user's authentication information. Repudiation is a user denying an action when the system can't prove otherwise. Tampering is the malicious modification of data, including data in transit over an open network. Elevation of privilege is an unprivileged user gaining privileged access.
    fr: |-
      L'usurpation d'identité consiste à utiliser les informations d'authentification d'un autre utilisateur. La répudiation est le fait qu'un utilisateur nie une action sans que le système puisse prouver le contraire. La falsification est la modification malveillante de données, y compris des données en transit sur un réseau ouvert. L'élévation de privilèges est l'obtention d'un accès privilégié par un utilisateur non privilégié.
  options:
    disclose:
      en: |-
        Information disclosure is exposing data to people who shouldn't see it; in t3 the data is modified, not only read.
      fr: |-
        La divulgation d'informations consiste à exposer des données à des personnes qui ne devraient pas les voir ; dans t3, les données sont modifiées, pas seulement lues.
    dos:
      en: |-
        Denial of service makes the service unavailable to valid users, which none of the threats describes.
      fr: |-
        Le déni de service rend le service indisponible pour les utilisateurs légitimes, ce qu'aucune des menaces ne décrit.
references:
  - title: Threats - Microsoft Threat Modeling Tool
    url: https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats
