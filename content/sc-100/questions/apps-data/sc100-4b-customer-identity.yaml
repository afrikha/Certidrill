id: sc100-4b-customer-identity
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Microsoft Entra tenant for its 8,000 employees. The bank plans a new mobile banking application for consumers.

    The application must meet the following requirements:

    - Consumers must be able to sign up by themselves with an email address and password or with a Google or Facebook account.
    - The sign-in pages must display the Woodgrove branding.
    - Consumer accounts must be kept separate from the employee directory.
    - The identity service must be one that Microsoft currently sells to new customers.

    What should you recommend for consumer authentication?
  fr: |
    Woodgrove Bank dispose d'un locataire Microsoft Entra pour ses 8 000 employés. La banque prévoit une nouvelle application bancaire mobile destinée aux particuliers.

    L'application doit respecter les exigences suivantes :

    - Les particuliers doivent pouvoir s'inscrire eux-mêmes avec une adresse e-mail et un mot de passe, ou avec un compte Google ou Facebook.
    - Les pages de connexion doivent afficher l'image de marque de Woodgrove.
    - Les comptes des particuliers doivent rester séparés de l'annuaire des employés.
    - Le service d'identité doit être un service que Microsoft vend actuellement aux nouveaux clients.

    Que devez-vous recommander pour l'authentification des particuliers ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra External ID in an external tenant", fr: "Microsoft Entra External ID dans un locataire externe" } }
    - { id: b, text: { en: "B2B collaboration in the existing workforce tenant", fr: "La collaboration B2B dans le locataire de personnel existant" } }
    - { id: c, text: { en: "A new Azure Active Directory B2C tenant", fr: "Un nouveau locataire Azure Active Directory B2C" } }
    - { id: d, text: { en: "Self-service sign-up user flows in the workforce tenant", fr: "Des flux d'utilisateurs d'inscription en libre-service dans le locataire de personnel" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An external tenant of Microsoft Entra External ID is a separate tenant for consumer and customer apps. Consumers sign up and sign in with email and password, one-time passcodes, or Google and Facebook accounts, and you can brand the sign-in experience. The consumer accounts stay out of the workforce tenant.
    fr: |
      Un locataire externe de Microsoft Entra External ID est un locataire distinct pour les applications destinées aux consommateurs et aux clients. Les particuliers s'inscrivent et se connectent avec une adresse e-mail et un mot de passe, des codes secrets à usage unique, ou des comptes Google et Facebook, et vous pouvez personnaliser l'expérience de connexion à vos couleurs. Les comptes des particuliers restent hors du locataire de personnel.
  options:
    b:
      en: B2B collaboration invites business partners as guests into the workforce tenant, where they authenticate with their own organization; it mixes external accounts with the employee directory.
      fr: La collaboration B2B invite des partenaires commerciaux comme invités dans le locataire de personnel, où ils s'authentifient avec leur propre organisation ; elle mélange les comptes externes et l'annuaire des employés.
    c:
      en: Since May 1, 2025, Azure AD B2C is no longer available for new customers to purchase; it's the legacy customer identity solution.
      fr: Depuis le 1er mai 2025, Azure AD B2C n'est plus disponible à l'achat pour les nouveaux clients ; c'est la solution d'identité client héritée.
    d:
      en: Self-service sign-up in the workforce tenant is for external business users and would place consumer accounts in the employee directory.
      fr: L'inscription en libre-service dans le locataire de personnel est destinée aux utilisateurs professionnels externes et placerait les comptes des particuliers dans l'annuaire des employés.
references:
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
