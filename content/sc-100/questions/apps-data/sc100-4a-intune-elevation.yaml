id: sc100-4a-intune-elevation
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has 1,200 Microsoft Entra joined Windows 11 devices managed by Microsoft Intune. Every user is a member of the local Administrators group, and an internal audit flags this as the main ransomware risk on endpoints. Fabrikam has the Intune licenses required for advanced capabilities.

    Requirements:

    - Users must run as standard users.
    - Engineers must still be able to run a list of approved setup programs and diagnostic tools that need administrator rights, after entering a business justification.
    - No user may hold full local administrator rights at any time, not even temporarily.
    - Every elevation must be logged.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose de 1 200 appareils Windows 11 joints à Microsoft Entra et gérés par Microsoft Intune. Tous les utilisateurs sont membres du groupe Administrateurs local, et un audit interne signale ce point comme le principal risque de rançongiciel sur les points de terminaison. Fabrikam dispose des licences Intune requises pour les fonctionnalités avancées.

    Exigences :

    - Les utilisateurs doivent travailler en tant qu'utilisateurs standard.
    - Les ingénieurs doivent pouvoir continuer à exécuter une liste de programmes d'installation et d'outils de diagnostic approuvés qui exigent des droits d'administrateur, après avoir saisi une justification métier.
    - Aucun utilisateur ne doit détenir de droits d'administrateur local complets à aucun moment, même temporairement.
    - Chaque élévation doit être journalisée.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Windows LAPS managed by Intune, with the local administrator password released to engineers on request", fr: "Windows LAPS géré par Intune, avec le mot de passe de l'administrateur local communiqué aux ingénieurs à la demande" } }
    - { id: b, text: { en: "Endpoint Privilege Management with user-confirmed elevation rules for the approved files", fr: "Endpoint Privilege Management avec des règles d'élévation confirmées par l'utilisateur pour les fichiers approuvés" } }
    - { id: c, text: { en: "Microsoft Entra PIM eligible assignments of the Microsoft Entra Joined Device Local Administrator role", fr: "Des attributions éligibles Microsoft Entra PIM du rôle Microsoft Entra Joined Device Local Administrator" } }
    - { id: d, text: { en: "An Intune account protection policy that keeps engineers in the local Administrators group", fr: "Une stratégie de protection de compte Intune qui maintient les ingénieurs dans le groupe Administrateurs local" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Endpoint Privilege Management lets users run as standard users and elevate only the files that elevation rules allow. A user-confirmed rule can require a business justification, most elevations run under an isolated virtual account that isn't added to the local Administrators group, and every elevation is logged.
    fr: |-
      Endpoint Privilege Management permet aux utilisateurs de travailler en tant qu'utilisateurs standard et de n'élever que les fichiers autorisés par des règles d'élévation. Une règle confirmée par l'utilisateur peut exiger une justification métier, la plupart des élévations s'exécutent sous un compte virtuel isolé qui n'est pas ajouté au groupe Administrateurs local, et chaque élévation est journalisée.
  options:
    a:
      en: |-
        Releasing the LAPS password gives the engineer the full local administrator account, which the requirements forbid.
      fr: |-
        Communiquer le mot de passe LAPS donne à l'ingénieur le compte administrateur local complet, ce que les exigences interdisent.
    c:
      en: |-
        Activating this role makes the user a local administrator of every Microsoft Entra joined device for the activation period, so full rights are held temporarily.
      fr: |-
        Activer ce rôle rend l'utilisateur administrateur local de tous les appareils joints à Microsoft Entra pendant la durée d'activation : des droits complets sont donc détenus temporairement.
    d:
      en: |-
        Keeping engineers in the local Administrators group leaves them with permanent full rights.
      fr: |-
        Maintenir les ingénieurs dans le groupe Administrateurs local leur laisse des droits complets permanents.
references:
  - title: Learn about using Endpoint Privilege Management with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/epm-overview
