id: sc100-4a-score-board-kpi
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft 365 E5 subscription and several Azure subscriptions. Users collaborate in Microsoft Teams, Exchange Online and SharePoint Online, and they sign in with Microsoft Entra ID.

    The CISO wants a single metric that reports the security posture of these productivity and identity workloads. The metric must show the history of the score, recommend improvement actions, and compare Contoso with organizations of a similar size, so that KPIs can be presented to the board every quarter.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose d'un abonnement Microsoft 365 E5 et de plusieurs abonnements Azure. Les utilisateurs collaborent dans Microsoft Teams, Exchange Online et SharePoint Online, et se connectent avec Microsoft Entra ID.

    Le RSSI souhaite une métrique unique qui rende compte de la posture de sécurité de ces charges de travail de productivité et d'identité. La métrique doit afficher l'historique du score, recommander des actions d'amélioration et comparer Contoso à des organisations de taille similaire, afin de présenter des indicateurs clés au conseil d'administration chaque trimestre.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The secure score of Microsoft Defender for Cloud", fr: "Le score de sécurité de Microsoft Defender for Cloud" } }
    - { id: b, text: { en: "The compliance score of Microsoft Purview Compliance Manager", fr: "Le score de conformité de Microsoft Purview Compliance Manager" } }
    - { id: c, text: { en: "Microsoft Secure Score in the Microsoft Defender portal", fr: "Le Niveau de sécurité Microsoft dans le portail Microsoft Defender" } }
    - { id: d, text: { en: "The exposure score of Microsoft Defender Vulnerability Management", fr: "Le score d'exposition de Microsoft Defender Vulnerability Management" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Microsoft Secure Score measures the security posture of Microsoft 365 workloads and identities, such as Microsoft Entra ID, Exchange Online, SharePoint Online and Microsoft Teams. It recommends improvement actions, keeps a history and offers metrics, trends and a comparison with similar organizations, which supports KPIs for leadership.
    fr: |-
      Le Niveau de sécurité Microsoft mesure la posture de sécurité des charges de travail et des identités Microsoft 365, comme Microsoft Entra ID, Exchange Online, SharePoint Online et Microsoft Teams. Il recommande des actions d'amélioration, conserve un historique et propose des métriques, des tendances et une comparaison avec des organisations similaires, ce qui permet de suivre des indicateurs clés pour la direction.
  options:
    a:
      en: |-
        The Defender for Cloud secure score measures the posture of cloud resources in Azure, AWS and GCP, not of Microsoft 365 collaboration workloads.
      fr: |-
        Le score de sécurité de Defender for Cloud mesure la posture des ressources cloud dans Azure, AWS et GCP, pas celle des charges de travail de collaboration Microsoft 365.
    b:
      en: |-
        The compliance score measures progress toward regulations and standards through improvement actions on controls; it isn't the security posture metric of the Defender portal.
      fr: |-
        Le score de conformité mesure la progression vers des réglementations et des normes au moyen d'actions d'amélioration sur des contrôles ; ce n'est pas la métrique de posture de sécurité du portail Defender.
    d:
      en: |-
        The exposure score reflects the vulnerabilities and misconfigurations of onboarded devices only; it doesn't cover Exchange Online, SharePoint Online, Teams or identities.
      fr: |-
        Le score d'exposition ne reflète que les vulnérabilités et les mauvaises configurations des appareils intégrés ; il ne couvre ni Exchange Online, ni SharePoint Online, ni Teams, ni les identités.
references:
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
