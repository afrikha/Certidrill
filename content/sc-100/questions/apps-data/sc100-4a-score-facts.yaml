id: sc100-4a-score-facts
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft 365 tenant. The security architect is preparing a posture review based on Microsoft Secure Score. Some licenses will be added next year, and the team discusses how changes to the tenant affect the score.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un locataire Microsoft 365. L'architecte sécurité prépare une revue de posture fondée sur le Niveau de sécurité Microsoft. Des licences seront ajoutées l'an prochain, et l'équipe s'interroge sur l'effet des modifications du locataire sur le score.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Buying additional Microsoft 365 licenses raises Microsoft Secure Score, even if no configuration changes.
        fr: |-
          L'achat de licences Microsoft 365 supplémentaires augmente le Niveau de sécurité Microsoft, même si aucune configuration ne change.
    - id: s2
      text:
        en: |-
          Turning on security defaults in Microsoft Entra ID earns the full points of the action that requires MFA for administrative roles.
        fr: |-
          L'activation des paramètres de sécurité par défaut dans Microsoft Entra ID rapporte la totalité des points de l'action qui exige la MFA pour les rôles d'administration.
    - id: s3
      text:
        en: |-
          An administrator can change the status of an action that Microsoft Secure Score shows as Completed back to To address.
        fr: |-
          Un administrateur peut remettre sur To address le statut d'une action que le Niveau de sécurité Microsoft affiche comme Completed.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      The absolute posture represented by Secure Score stays the same whatever licenses the organization owns; licenses only change which recommendations are shown. Security defaults give full points for MFA registration for all users, MFA for administrative roles and blocking legacy authentication. Completed means Microsoft data confirms that all the points are achieved, and that status can't be changed.
    fr: |-
      La posture absolue que représente le Niveau de sécurité Microsoft reste la même quelles que soient les licences détenues ; les licences ne changent que les recommandations affichées. Les paramètres de sécurité par défaut donnent tous les points pour l'inscription MFA de tous les utilisateurs, la MFA des rôles d'administration et le blocage de l'authentification héritée. Completed signifie que les données de Microsoft confirment que tous les points sont obtenus, et ce statut ne peut pas être modifié.
references:
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
  - title: Assess your security posture through Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-improvement-actions
