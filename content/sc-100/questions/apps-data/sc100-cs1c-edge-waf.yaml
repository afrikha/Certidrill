id: sc100-cs1c-edge-waf
objective: "4.2.8"
type: single
caseStudy: sc100-cs1c-wingtip
difficulty: 3
status: draft
stem:
  en: |-
    You need to recommend a solution for the online store that meets the application requirements. What should you recommend?
  fr: |-
    Vous devez recommander une solution pour la boutique en ligne qui respecte les exigences relatives aux applications. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Associate a WAF policy with fd-wingtip that uses the Default Rule Set, the Bot Manager rule set and a rate limit rule", fr: "Associer à fd-wingtip une stratégie WAF qui utilise le Default Rule Set, le jeu de règles Bot Manager et une règle de limitation du débit" } }
    - { id: b, text: { en: "Upgrade fd-wingtip to the Premium tier, and associate a WAF policy that uses the Default Rule Set, the Bot Manager rule set and a rate limit rule", fr: "Mettre à niveau fd-wingtip vers le niveau Premium, et associer une stratégie WAF qui utilise le Default Rule Set, le jeu de règles Bot Manager et une règle de limitation du débit" } }
    - { id: c, text: { en: "Deploy Azure Application Gateway WAF v2 in each region behind fd-wingtip, with managed rules, bot protection and a rate limit rule", fr: "Déployer Azure Application Gateway WAF v2 dans chaque région derrière fd-wingtip, avec des règles managées, la protection contre les bots et une règle de limitation du débit" } }
    - { id: d, text: { en: "Deploy Azure Firewall Premium in each region behind fd-wingtip, with intrusion detection and prevention in Alert and deny mode", fr: "Déployer Pare-feu Azure Premium dans chaque région derrière fd-wingtip, avec la détection et la prévention des intrusions en mode Alert and deny" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Azure WAF on Front Door is deployed at the edge locations, so requests are inspected before they enter any region. Its full capabilities, including managed rule sets such as the Default Rule Set and the Bot Manager rule set, require the Front Door Premium tier; rate limiting is a custom rule. fd-wingtip remains the entry point.
    fr: |-
      Azure WAF sur Front Door est déployé sur les emplacements de périphérie : les requêtes sont inspectées avant d'entrer dans une région. Ses capacités complètes, y compris les jeux de règles managés comme le Default Rule Set et le jeu de règles Bot Manager, exigent le niveau Premium de Front Door ; la limitation du débit est une règle personnalisée. fd-wingtip reste le point d'entrée.
  options:
    a:
      en: |-
        On the Front Door Standard tier, a WAF policy supports only custom rules, so the managed Default Rule Set and the Bot Manager rule set aren't available.
      fr: |-
        Sur le niveau Standard de Front Door, une stratégie WAF ne prend en charge que les règles personnalisées : le Default Rule Set managé et le jeu de règles Bot Manager ne sont pas disponibles.
    c:
      en: |-
        Application Gateway is a regional service, so the attacks reach each region before they are blocked, and the solution adds a gateway per region.
      fr: |-
        Application Gateway est un service régional : les attaques atteignent chaque région avant d'être bloquées, et la solution ajoute une passerelle par région.
    d:
      en: |-
        Azure Firewall is a regional network firewall; it isn't a web application firewall at the edge and doesn't provide bot protection rule sets.
      fr: |-
        Pare-feu Azure est un pare-feu réseau régional ; ce n'est pas un pare-feu d'applications web en périphérie et il ne fournit pas de jeux de règles de protection contre les bots.
references:
  - title: Azure Web Application Firewall on Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview
