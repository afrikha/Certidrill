id: sc100-4a-portfolio-unknowns
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders acquired two companies and is assessing the security posture of the combined application portfolio. Northwind has Microsoft 365 E5 and Microsoft Defender for Cloud.

    The assessment must cover two blind spots:

    - Third-party and in-house applications registered in Microsoft Entra ID that use OAuth permissions to access Microsoft 365 data, with alerts when an app behaves anomalously.
    - Web applications, domains and hosts of the acquired companies that are exposed on the internet but are missing from Northwind's inventory.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders a racheté deux sociétés et évalue la posture de sécurité du portefeuille d'applications combiné. Northwind dispose de Microsoft 365 E5 et de Microsoft Defender for Cloud.

    L'évaluation doit couvrir deux angles morts :

    - Les applications tierces et internes inscrites dans Microsoft Entra ID qui utilisent des autorisations OAuth pour accéder aux données Microsoft 365, avec des alertes quand une application se comporte de manière anormale.
    - Les applications web, les domaines et les hôtes des sociétés rachetées qui sont exposés sur Internet mais absents de l'inventaire de Northwind.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      OAuth applications: [[oauth]]

      Unknown internet-facing assets: [[external]]
    fr: |
      Applications OAuth : [[oauth]]

      Ressources exposées à Internet inconnues : [[external]]
  slots:
    - id: oauth
      options:
        - { id: appgov, text: { en: "App governance in Defender for Cloud Apps", fr: "La gouvernance des applications dans Defender for Cloud Apps" } }
        - { id: discovery, text: { en: "Cloud Discovery in Defender for Cloud Apps", fr: "La découverte cloud dans Defender for Cloud Apps" } }
        - { id: secure, text: { en: "Microsoft Secure Score recommended actions", fr: "Les actions recommandées du Niveau de sécurité Microsoft" } }
        - { id: cspm, text: { en: "Attack path analysis in Defender CSPM", fr: "L'analyse des chemins d'attaque de Defender CSPM" } }
    - id: external
      options:
        - { id: easm, text: { en: "Microsoft Defender External Attack Surface Management", fr: "Microsoft Defender External Attack Surface Management" } }
        - { id: apis, text: { en: "Microsoft Defender for APIs", fr: "Microsoft Defender for APIs" } }
        - { id: foundational, text: { en: "Foundational CSPM recommendations in Defender for Cloud", fr: "Les recommandations du CSPM de base de Defender for Cloud" } }
        - { id: discovery, text: { en: "Cloud Discovery in Defender for Cloud Apps", fr: "La découverte cloud dans Defender for Cloud Apps" } }
answer:
  values: { oauth: appgov, external: easm }
explanation:
  correct:
    en: |-
      App governance provides insights, policies, detections and remediation for OAuth-enabled apps registered in Microsoft Entra ID, including the permissions they hold and anomalous app activity. Defender EASM starts from discovery seeds and recursively finds infrastructure connected to known assets, which uncovers domains, hosts and IP blocks that the organization doesn't monitor.
    fr: |-
      La gouvernance des applications fournit des insights, des stratégies, des détections et des corrections pour les applications OAuth inscrites dans Microsoft Entra ID, y compris les autorisations qu'elles détiennent et les activités anormales. Defender EASM part de valeurs de départ (seeds) et trouve de façon récursive l'infrastructure liée aux ressources connues, ce qui révèle les domaines, les hôtes et les blocs d'adresses IP que l'organisation ne surveille pas.
  options:
    discovery:
      en: |-
        Cloud Discovery finds cloud apps that users reach in traffic logs; it neither monitors OAuth permissions nor finds the company's own internet-facing hosts.
      fr: |-
        La découverte cloud trouve dans les journaux de trafic les applications cloud consultées par les utilisateurs ; elle ne surveille pas les autorisations OAuth et ne trouve pas les hôtes exposés de l'entreprise.
    foundational:
      en: |-
        Foundational CSPM assesses resources already connected to Defender for Cloud, so assets missing from the inventory stay invisible.
      fr: |-
        Le CSPM de base évalue des ressources déjà connectées à Defender for Cloud : les ressources absentes de l'inventaire restent invisibles.
    apis:
      en: |-
        Defender for APIs covers APIs published in Azure API Management, not unknown web assets of the acquired companies.
      fr: |-
        Defender for APIs couvre les API publiées dans Azure API Management, pas les ressources web inconnues des sociétés rachetées.
references:
  - title: App governance in Microsoft Defender for Cloud Apps and Microsoft Defender XDR
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/app-governance-manage-app-governance
  - title: Defender EASM Overview
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview
