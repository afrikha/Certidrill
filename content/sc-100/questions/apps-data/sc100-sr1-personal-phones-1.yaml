id: sc100-sr1-personal-phones-1
objective: "4.1.3"
type: series_yesno
series: sc100-sr1-personal-phones
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You recommend Intune app protection policies enforced by a Conditional Access policy.
  fr: Vous recommandez des stratégies de protection des applications Intune appliquées par une stratégie d'accès conditionnel.
body:
  solution:
    en: |
      You recommend Intune **app protection policies** for iOS/iPadOS and Android that target Outlook, restrict cut, copy, and paste to policy-managed apps, and block saving copies of org data to personal storage. A Conditional Access policy for the iOS and Android platforms requires the **Require app protection policy** grant control to access Exchange Online.
    fr: |
      Vous recommandez des **stratégies de protection des applications** Intune pour iOS/iPadOS et Android qui ciblent Outlook, limitent le couper, copier et coller aux applications gérées par une stratégie et bloquent l'enregistrement de copies des données de l'organisation dans un stockage personnel. Une stratégie d'accès conditionnel pour les plateformes iOS et Android exige le contrôle d'octroi **Require app protection policy** pour accéder à Exchange Online.
answer: { value: true }
explanation:
  correct:
    en: App protection policies protect the organization's data inside the app, with or without device enrollment, which fits personal phones. The Require app protection policy grant needs only Microsoft Entra device registration through the broker app, not MDM enrollment, and blocks clients that don't have the policy.
    fr: "Les stratégies de protection des applications protègent les données de l'organisation dans l'application, avec ou sans inscription de l'appareil, ce qui convient aux téléphones personnels. Le contrôle d'octroi Require app protection policy nécessite uniquement l'inscription de l'appareil dans Microsoft Entra ID par l'application broker, et non une inscription MDM, et bloque les clients qui n'ont pas la stratégie."
references:
  - title: App Protection Policies Overview
    url: https://learn.microsoft.com/en-us/intune/intune-service/apps/app-protection-policy
  - title: "Conditional Access: Grant"
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant
