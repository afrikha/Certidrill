id: sc100-sr2-stg-3
objective: "4.3.6"
type: series_yesno
series: sc100-sr2-storage-entra-auth
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You recommend disallowing anonymous access and Shared Key authorization, and using Azure RBAC data roles and user delegation SAS.
  fr: |
    Vous recommandez d'interdire l'accès anonyme et l'autorisation par clé partagée, et d'utiliser des rôles de données Azure RBAC et des SAS de délégation d'utilisateur.
body:
  solution:
    en: |
      You recommend the following configuration:

      - Disallow anonymous blob access and **Shared Key** authorization on stfinance01.
      - Assign the **Storage Blob Data Contributor** role on stfinance01 to the managed identity of the app's virtual machines.
      - Assign the **Storage Blob Data Reader** role on stfinance01 to the Analysts group.
      - When an analyst must share a report for a limited time, the analyst creates a **user delegation SAS**.
    fr: |
      Vous recommandez la configuration suivante :

      - Interdire l'accès anonyme aux blobs et l'autorisation par **clé partagée** (Shared Key) sur stfinance01.
      - Attribuer le rôle **Storage Blob Data Contributor** sur stfinance01 à l'identité managée des machines virtuelles de l'application.
      - Attribuer le rôle **Storage Blob Data Reader** sur stfinance01 au groupe Analysts.
      - Lorsqu'un analyste doit partager un rapport pour une durée limitée, il crée une **SAS de délégation d'utilisateur**.
answer: { value: true }
explanation:
  correct:
    en: |
      With Shared Key disallowed, the leaked account keys, service SAS, and account SAS are rejected, and with anonymous access disallowed, no request reaches the data without authorization. The app uses its managed identity and the analysts use Azure RBAC, so access is granted and revoked per identity. A user delegation SAS is secured with Microsoft Entra credentials, so it remains allowed when Shared Key is disallowed.
    fr: |
      Avec la clé partagée interdite, les clés de compte, SAS de service et SAS de compte qui ont fuité sont rejetées, et avec l'accès anonyme interdit, aucune requête n'atteint les données sans autorisation. L'application utilise son identité managée et les analystes utilisent Azure RBAC : l'accès est accordé et révoqué par identité. Une SAS de délégation d'utilisateur est sécurisée par des informations d'identification Microsoft Entra : elle reste autorisée lorsque la clé partagée est interdite.
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
