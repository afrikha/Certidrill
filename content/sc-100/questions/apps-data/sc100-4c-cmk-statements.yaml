id: sc100-4c-cmk-statements
objective: "4.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans to move several Azure Storage accounts from Microsoft-managed keys to customer-managed keys stored in Azure Key Vault. The security team wants to understand the effect of the change before approving the design.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit de faire passer plusieurs comptes Stockage Azure des clés gérées par Microsoft à des clés gérées par le client stockées dans Azure Key Vault. L'équipe de sécurité veut comprendre l'effet de ce changement avant d'approuver la conception.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The key vault that stores the customer-managed keys must have soft delete and purge protection enabled.
        fr: |-
          Le coffre de clés qui stocke les clés gérées par le client doit avoir la suppression réversible et la protection contre le vidage activées.
    - id: s2
      text:
        en: |-
          If the storage account loses access to the customer-managed key, requests to read or write blob data fail.
        fr: |-
          Si le compte de stockage perd l'accès à la clé gérée par le client, les demandes de lecture ou d'écriture des données d'objets blob échouent.
    - id: s3
      text:
        en: |-
          After the change, a user with the Storage Blob Data Reader role must also be granted access to the key vault to read blobs.
        fr: |-
          Après le changement, un utilisateur disposant du rôle Storage Blob Data Reader doit aussi recevoir un accès au coffre de clés pour lire les objets blob.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |-
      Azure Storage requires soft delete and purge protection on the key vault or Managed HSM that holds a customer-managed key. When access to the key is revoked or the key is disabled, the account can't unwrap the encryption key and data operations fail. Encryption stays transparent to callers: the storage account's managed identity accesses the key, not the users.
    fr: |-
      Stockage Azure exige la suppression réversible et la protection contre le vidage sur le coffre de clés ou le HSM managé qui contient une clé gérée par le client. Quand l'accès à la clé est révoqué ou que la clé est désactivée, le compte ne peut plus désencapsuler la clé de chiffrement et les opérations sur les données échouent. Le chiffrement reste transparent pour les appelants : c'est l'identité managée du compte de stockage qui accède à la clé, pas les utilisateurs.
references:
  - title: Customer-managed keys for Azure Storage encryption
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
