id: sc100-4b-api-threat-detection
objective: "4.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. runs REST APIs in an Azure Kubernetes Service (AKS) cluster and in an Amazon EKS cluster. Each cluster exposes its APIs directly to partners through its own ingress controller. Litware uses Microsoft Defender for Cloud and Microsoft Sentinel.

    You need to recommend a solution that meets the following requirements:

    - Provide an inventory of the APIs that flags unauthenticated and unused endpoints.
    - Classify the APIs whose requests or responses contain sensitive data.
    - Detect OWASP API Top 10 threats in runtime traffic and send the alerts to Sentinel.
    - Minimize the number of security products.

    What should you recommend?
  fr: |
    Litware, Inc. exécute des API REST dans un cluster Azure Kubernetes Service (AKS) et dans un cluster Amazon EKS. Chaque cluster expose directement ses API aux partenaires via son propre contrôleur d'entrée. Litware utilise Microsoft Defender for Cloud et Microsoft Sentinel.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - Fournir un inventaire des API qui signale les points de terminaison non authentifiés et inutilisés.
    - Classifier les API dont les requêtes ou les réponses contiennent des données sensibles.
    - Détecter les menaces du Top 10 OWASP des API dans le trafic à l'exécution et envoyer les alertes à Sentinel.
    - Réduire au minimum le nombre de produits de sécurité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable Defender for Containers on both clusters and connect the AWS account to Defender for Cloud.", fr: "Activer Defender for Containers sur les deux clusters et connecter le compte AWS à Defender for Cloud." } }
    - { id: b, text: { en: "Register the APIs in Azure API Center and enable Defender for APIs on the API center.", fr: "Inscrire les API dans Azure API Center et activer Defender for APIs sur le centre d'API." } }
    - { id: c, text: { en: "Publish the APIs of both clusters through Azure API Management and enable Defender for APIs.", fr: "Publier les API des deux clusters via Azure API Management et activer Defender for APIs." } }
    - { id: d, text: { en: "Place Application Gateway WAF_v2 in front of the AKS ingress and send the WAF logs to Sentinel.", fr: "Placer Application Gateway WAF_v2 devant l'entrée AKS et envoyer les journaux WAF à Sentinel." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Defender for APIs currently supports only APIs published in Azure API Management, and API Management can front back ends hosted anywhere, including EKS. Once onboarded, Defender for APIs inventories the APIs, flags external, unauthenticated and inactive endpoints, classifies sensitive data in request and response bodies, detects OWASP API Top 10 threats, and exports alerts to Sentinel.
    fr: |
      Defender for APIs ne prend actuellement en charge que les API publiées dans Azure API Management, et API Management peut se placer devant des back-ends hébergés n'importe où, y compris EKS. Une fois les API intégrées, Defender for APIs les inventorie, signale les points de terminaison externes, non authentifiés et inactifs, classifie les données sensibles des corps de requête et de réponse, détecte les menaces du Top 10 OWASP des API et exporte les alertes vers Sentinel.
  options:
    a:
      en: Defender for Containers protects clusters and containers; it doesn't inventory API endpoints, assess their authentication or classify sensitive data in API payloads.
      fr: Defender for Containers protège les clusters et les conteneurs ; il n'inventorie pas les points de terminaison d'API, n'évalue pas leur authentification et ne classifie pas les données sensibles des charges utiles d'API.
    b:
      en: API Center is a design-time inventory, not a gateway that sees traffic, and Defender for APIs doesn't support APIs outside API Management.
      fr: API Center est un inventaire au moment de la conception, pas une passerelle qui voit le trafic, et Defender for APIs ne prend pas en charge les API hors d'API Management.
    d:
      en: A WAF filters web attacks but doesn't inventory or classify APIs, and this design leaves the EKS APIs uncovered.
      fr: Un WAF filtre les attaques web mais n'inventorie ni ne classifie les API, et cette conception laisse les API d'EKS sans couverture.
references:
  - title: About Microsoft Defender for APIs
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-apis-introduction
  - title: What is Azure API Center?
    url: https://learn.microsoft.com/en-us/azure/api-center/overview
