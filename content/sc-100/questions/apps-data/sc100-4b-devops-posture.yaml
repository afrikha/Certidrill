id: sc100-4b-devops-posture
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank stores application code in GitHub Enterprise Cloud, Azure DevOps and GitLab. Code scanning, secret scanning and dependency scanning are already enabled on each platform. Microsoft Defender for Cloud protects the Azure subscriptions with foundational CSPM only.

    You need to recommend a solution that meets the following requirements:

    - The security team must see the code, secret, dependency and infrastructure as code findings of the three platforms in one place.
    - Developers who use Azure DevOps must see the security findings as annotations in their pull requests.
    - The security team must be able to trace a misconfigured production resource back to the repository that defined it.
    - The number of additional products must be minimized.

    What should you recommend?
  fr: |
    Woodgrove Bank stocke le code de ses applications dans GitHub Enterprise Cloud, Azure DevOps et GitLab. L'analyse du code, l'analyse des secrets et l'analyse des dépendances sont déjà activées sur chaque plateforme. Microsoft Defender for Cloud protège les abonnements Azure avec la CSPM de base uniquement.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - L'équipe de sécurité doit voir au même endroit les résultats d'analyse du code, des secrets, des dépendances et de l'infrastructure as code des trois plateformes.
    - Les développeurs qui utilisent Azure DevOps doivent voir les résultats de sécurité sous forme d'annotations dans leurs demandes de tirage.
    - L'équipe de sécurité doit pouvoir remonter d'une ressource de production mal configurée jusqu'au dépôt qui l'a définie.
    - Le nombre de produits supplémentaires doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Connect the three platforms to Defender for Cloud DevOps security and keep foundational CSPM.", fr: "Connecter les trois plateformes à la sécurité DevOps de Defender for Cloud et conserver la CSPM de base." } }
    - { id: b, text: { en: "Use the security overview of each platform, and give the security team access to each of them.", fr: "Utiliser la vue d'ensemble de la sécurité de chaque plateforme, et donner à l'équipe de sécurité l'accès à chacune d'elles." } }
    - { id: c, text: { en: "Connect the three platforms to Defender for Cloud DevOps security and enable the Defender CSPM plan.", fr: "Connecter les trois plateformes à la sécurité DevOps de Defender for Cloud et activer le plan Defender CSPM." } }
    - { id: d, text: { en: "Send the audit logs of the three platforms to Microsoft Sentinel and build a workbook of the findings.", fr: "Envoyer les journaux d'audit des trois plateformes à Microsoft Sentinel et créer un classeur des résultats." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Defender for Cloud DevOps security connects Azure DevOps, GitHub and GitLab and centralizes code, secret, dependency and infrastructure as code findings in one console. Pull request annotations and code to cloud mapping, which links a cloud resource back to its code, are advanced DevOps posture features that require the paid Defender CSPM plan.
    fr: |
      La sécurité DevOps de Defender for Cloud connecte Azure DevOps, GitHub et GitLab et centralise les résultats d'analyse du code, des secrets, des dépendances et de l'IaC dans une même console. Les annotations des demandes de tirage et le mappage du code au cloud, qui relie une ressource cloud à son code, sont des fonctionnalités avancées de posture DevOps qui exigent le plan payant Defender CSPM.
  options:
    a:
      en: Foundational CSPM centralizes the DevOps findings, but pull request annotations and code to cloud mapping require Defender CSPM.
      fr: La CSPM de base centralise les résultats DevOps, mais les annotations des demandes de tirage et le mappage du code au cloud exigent Defender CSPM.
    b:
      en: Three separate consoles don't give one place for all findings, and they don't link production resources back to their code.
      fr: Trois consoles distinctes ne donnent pas un endroit unique pour tous les résultats, et elles ne relient pas les ressources de production à leur code.
    d:
      en: Audit logs record activity on the platforms, not the scanning findings, and Sentinel neither annotates pull requests nor maps code to cloud resources.
      fr: Les journaux d'audit enregistrent l'activité sur les plateformes, pas les résultats d'analyse, et Sentinel n'annote pas les demandes de tirage et ne mappe pas le code aux ressources cloud.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
  - title: Overview of Microsoft Defender for Cloud DevOps security
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-devops-introduction
