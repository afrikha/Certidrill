id: sc100-4c-priority-statements
objective: "4.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is prioritizing mitigations for threats to its data in Azure. The data stores use Microsoft-managed keys and accept storage account keys. Customer-managed keys for some databases are stored in Azure Key Vault.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys hiérarchise les atténuations des menaces sur ses données dans Azure. Les magasins de données utilisent des clés gérées par Microsoft et acceptent les clés de compte de stockage. Les clés gérées par le client de certaines bases de données sont stockées dans Azure Key Vault.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Switching a storage account to a customer-managed key mitigates the risk of an attacker who reads data with a stolen account key.
        fr: |-
          Le passage d'un compte de stockage à une clé gérée par le client atténue le risque qu'un attaquant lise les données avec une clé de compte volée.
    - id: s2
      text:
        en: |-
          Purge protection on the key vault mitigates the risk of a malicious administrator who permanently deletes a customer-managed key to make the databases unusable.
        fr: |-
          La protection contre le vidage sur le coffre de clés atténue le risque qu'un administrateur malveillant supprime définitivement une clé gérée par le client pour rendre les bases de données inutilisables.
    - id: s3
      text:
        en: |-
          Defender CSPM can use sensitive data discovery to rank attack paths in which internet-exposed virtual machines can reach data stores that hold sensitive data.
        fr: |-
          Defender CSPM peut utiliser la découverte des données sensibles pour classer les chemins d'attaque dans lesquels des machines virtuelles exposées à Internet peuvent atteindre des magasins de données contenant des données sensibles.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      Encryption at rest is transparent to authorized requests, and a request signed with the account key is authorized whatever key protects the data, so only disallowing Shared Key closes that threat. Purge protection prevents a deleted key from being purged before the retention period ends, so the key can be recovered. Defender CSPM data-aware posture shows attack paths from internet-exposed VMs to sensitive data stores and prioritizes them.
    fr: |-
      Le chiffrement au repos est transparent pour les demandes autorisées, et une demande signée avec la clé de compte est autorisée quelle que soit la clé qui protège les données : seule l'interdiction de Shared Key ferme cette menace. La protection contre le vidage empêche de vider une clé supprimée avant la fin de la période de rétention : la clé peut être récupérée. La posture tenant compte des données de Defender CSPM affiche les chemins d'attaque allant de machines virtuelles exposées à Internet vers des magasins de données sensibles et les hiérarchise.
references:
  - title: Overview - About data security posture management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-data-security-posture
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
