id: sc100-4b-owasp-controls
objective: "4.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys sells event tickets through APIs published in Azure API Management. A security assessment based on the OWASP API Security Top 10 produced the findings shown in the answer area.

    You need to recommend a mitigation for each finding.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys vend des billets d'événements via des API publiées dans Azure API Management. Une évaluation de sécurité fondée sur le Top 10 OWASP de la sécurité des API a produit les constats présentés dans la zone de réponse.

    Vous devez recommander une atténuation pour chaque constat.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Responses contain customer properties that the API definition doesn't document: [[props]]

      An operation forwards requests to a URL that the client supplies in the payload: [[ssrf]]

      Automated bots buy large numbers of tickets as soon as sales open: [[bots]]
    fr: |
      Les réponses contiennent des propriétés de clients que la définition de l'API ne documente pas : [[props]]

      Une opération transfère les requêtes vers une URL que le client fournit dans la charge utile : [[ssrf]]

      Des bots automatisés achètent de grandes quantités de billets dès l'ouverture des ventes : [[bots]]
  slots:
    - id: props
      options:
        - { id: content, text: { en: "Validate responses against the API schema with a content validation policy", fr: "Valider les réponses par rapport au schéma de l'API avec une stratégie de validation du contenu" } }
        - { id: allow, text: { en: "Check back-end host names against an allowlist in a policy expression", fr: "Vérifier les noms d'hôte de back-end par rapport à une liste d'autorisation dans une expression de stratégie" } }
        - { id: bot, text: { en: "Place a WAF with the Bot Manager rule set in front of API Management", fr: "Placer un WAF avec le jeu de règles Bot Manager devant API Management" } }
        - { id: cert, text: { en: "Require client certificates with a certificate validation policy", fr: "Exiger des certificats clients avec une stratégie de validation des certificats" } }
    - id: ssrf
      options:
        - { id: content, text: { en: "Validate responses against the API schema with a content validation policy", fr: "Valider les réponses par rapport au schéma de l'API avec une stratégie de validation du contenu" } }
        - { id: allow, text: { en: "Check back-end host names against an allowlist in a policy expression", fr: "Vérifier les noms d'hôte de back-end par rapport à une liste d'autorisation dans une expression de stratégie" } }
        - { id: bot, text: { en: "Place a WAF with the Bot Manager rule set in front of API Management", fr: "Placer un WAF avec le jeu de règles Bot Manager devant API Management" } }
        - { id: cert, text: { en: "Require client certificates with a certificate validation policy", fr: "Exiger des certificats clients avec une stratégie de validation des certificats" } }
    - id: bots
      options:
        - { id: content, text: { en: "Validate responses against the API schema with a content validation policy", fr: "Valider les réponses par rapport au schéma de l'API avec une stratégie de validation du contenu" } }
        - { id: allow, text: { en: "Check back-end host names against an allowlist in a policy expression", fr: "Vérifier les noms d'hôte de back-end par rapport à une liste d'autorisation dans une expression de stratégie" } }
        - { id: bot, text: { en: "Place a WAF with the Bot Manager rule set in front of API Management", fr: "Placer un WAF avec le jeu de règles Bot Manager devant API Management" } }
        - { id: cert, text: { en: "Require client certificates with a certificate validation policy", fr: "Exiger des certificats clients avec une stratégie de validation des certificats" } }
answer:
  values: { props: content, ssrf: allow, bots: bot }
explanation:
  correct:
    en: |
      Undocumented properties in responses are broken object property level authorization: the validate-content policy can block properties that the schema doesn't define. For server-side request forgery, don't use client-supplied URLs for back-end calls; if a URL from the payload is required, enforce an allowlist of host names, ports and media types with a policy expression. For unrestricted access to sensitive business flows by bots, front API Management with Application Gateway or Front Door and consider the Bot Manager rule set.
    fr: |
      Des propriétés non documentées dans les réponses relèvent d'une autorisation défaillante au niveau des propriétés d'objet : la stratégie validate-content peut bloquer les propriétés que le schéma ne définit pas. Contre la falsification de requête côté serveur (SSRF), n'utilisez pas d'URL fournies par le client pour les appels au back-end ; si une URL de la charge utile est nécessaire, imposez une liste d'autorisation de noms d'hôte, de ports et de types de média avec une expression de stratégie. Contre l'accès sans restriction des bots aux flux métier sensibles, placez Application Gateway ou Front Door devant API Management et envisagez le jeu de règles Bot Manager.
  options:
    cert:
      en: Client certificates authenticate callers; they don't filter response properties, outbound URLs or bot behavior from legitimate clients.
      fr: Les certificats clients authentifient les appelants ; ils ne filtrent ni les propriétés des réponses, ni les URL sortantes, ni le comportement de bots venant de clients légitimes.
references:
  - title: Mitigate OWASP API security top 10 in Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/mitigate-owasp-api-threats
