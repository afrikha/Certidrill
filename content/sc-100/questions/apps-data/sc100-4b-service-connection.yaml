id: sc100-4b-service-connection
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys deploys infrastructure to Azure by using Azure Pipelines on Microsoft-hosted agents. The Azure Resource Manager service connection uses an app registration with a client secret. Last month, the secret expired and blocked all deployments, and an earlier version of the secret appeared in a pipeline log.

    You need to recommend a standard for the service connection. The solution must ensure that there is no credential to store, rotate or renew, and the pipelines must keep using Microsoft-hosted agents.

    What should you recommend?
  fr: |
    Wingtip Toys déploie son infrastructure dans Azure avec Azure Pipelines sur des agents hébergés par Microsoft. La connexion de service Azure Resource Manager utilise une inscription d'application avec un secret client. Le mois dernier, le secret a expiré et a bloqué tous les déploiements, et une version antérieure du secret est apparue dans un journal de pipeline.

    Vous devez recommander une norme pour la connexion de service. La solution doit garantir qu'il n'y a aucune information d'identification à stocker, faire tourner ou renouveler, et les pipelines doivent continuer à utiliser des agents hébergés par Microsoft.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Store the client secret as a secret pipeline variable so that it's masked in the logs.", fr: "Stocker le secret client dans une variable de pipeline secrète pour qu'il soit masqué dans les journaux." } }
    - { id: b, text: { en: "Replace the client secret with a certificate stored in Azure Key Vault.", fr: "Remplacer le secret client par un certificat stocké dans Azure Key Vault." } }
    - { id: c, text: { en: "Rotate the client secret every 30 days with an Azure Automation runbook.", fr: "Faire tourner le secret client tous les 30 jours avec un runbook Azure Automation." } }
    - { id: d, text: { en: "Convert the service connection to use workload identity federation.", fr: "Convertir la connexion de service pour qu'elle utilise la fédération d'identité de charge de travail." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With workload identity federation, the app registration or user-assigned managed identity trusts tokens issued for the pipeline, and the pipeline exchanges them for a Microsoft Entra access token. No secret or certificate is stored, so nothing can expire or leak in a log.
    fr: |
      Avec la fédération d'identité de charge de travail, l'inscription d'application ou l'identité managée affectée par l'utilisateur approuve les jetons émis pour le pipeline, et le pipeline les échange contre un jeton d'accès Microsoft Entra. Aucun secret ni certificat n'est stocké : rien ne peut expirer ni fuiter dans un journal.
  options:
    a:
      en: Masking reduces the risk of exposure in logs, but the secret still has to be stored, rotated and renewed before it expires.
      fr: Le masquage réduit le risque d'exposition dans les journaux, mais le secret doit toujours être stocké, renouvelé et changé avant son expiration.
    b:
      en: A certificate is stronger than a client secret, but it's still a credential that must be stored and renewed before it expires.
      fr: Un certificat est plus robuste qu'un secret client, mais c'est toujours une information d'identification à stocker et à renouveler avant son expiration.
    c:
      en: Automated rotation reduces the lifetime of each secret but keeps a credential to store and adds a runbook to maintain.
      fr: La rotation automatisée réduit la durée de vie de chaque secret, mais conserve une information d'identification à stocker et ajoute un runbook à maintenir.
references:
  - title: Workload identity federation concepts
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
  - title: Manually set an Azure Resource Manager workload identity service connection
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/release/configure-workload-identity
