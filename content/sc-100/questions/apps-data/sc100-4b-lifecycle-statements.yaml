id: sc100-4b-lifecycle-statements
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is writing an application security lifecycle strategy based on the security pillar of the Azure Well-Architected Framework. The strategy covers testing, build pipelines and environments for applications deployed to Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders rédige une stratégie de cycle de vie de la sécurité des applications fondée sur le pilier sécurité d'Azure Well-Architected Framework. La stratégie couvre les tests, les pipelines de build et les environnements des applications déployées dans Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Static application security testing (SAST) tests the running application against realistic attack scenarios.
        fr: Les tests statiques de sécurité des applications (SAST) testent l'application en cours d'exécution face à des scénarios d'attaque réalistes.
    - id: s2
      text:
        en: Microsoft-hosted build agents provide a clean environment for each pipeline run.
        fr: Les agents de build hébergés par Microsoft fournissent un environnement propre pour chaque exécution de pipeline.
    - id: s3
      text:
        en: Development environments should have direct access to production so that developers can reproduce production issues quickly.
        fr: Les environnements de développement doivent avoir un accès direct à la production afin que les développeurs puissent reproduire rapidement les problèmes de production.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      SAST analyzes the code as developers write it; dynamic testing (DAST) exercises the running application against realistic attacks. Build agents are high-value assets, and Microsoft-hosted agents give each run a clean environment, which is why the Well-Architected Framework prefers them. Production must be strictly separated from non-production, and development environments shouldn't have direct production access.
    fr: |
      Le SAST analyse le code au moment où les développeurs l'écrivent ; les tests dynamiques (DAST) éprouvent l'application en cours d'exécution face à des attaques réalistes. Les agents de build sont des ressources de grande valeur, et les agents hébergés par Microsoft fournissent un environnement propre à chaque exécution, c'est pourquoi Well-Architected Framework les privilégie. La production doit être strictement séparée de la non-production, et les environnements de développement ne doivent pas avoir d'accès direct à la production.
references:
  - title: Architecture strategies for securing a development lifecycle
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/secure-development-lifecycle
