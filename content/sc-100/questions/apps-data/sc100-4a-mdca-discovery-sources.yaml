id: sc100-4a-mdca-discovery-sources
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has Microsoft 365 E5 and wants to evaluate the shadow IT risk of its organization with Microsoft Defender for Cloud Apps. The environment contains:

    - 2,500 Windows 11 laptops that are onboarded to Microsoft Defender for Endpoint. Most employees work from home several days a week.
    - A factory network of terminals that can't run any agent. All its internet traffic leaves through a firewall that can export logs over Syslog.

    Cloud apps used from both environments must be discovered and risk rated continuously, without manual log uploads.

    Which two data sources should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose de Microsoft 365 E5 et souhaite évaluer le risque de shadow IT de son organisation avec Microsoft Defender for Cloud Apps. L'environnement comprend :

    - 2 500 ordinateurs portables Windows 11 intégrés à Microsoft Defender for Endpoint. La plupart des employés télétravaillent plusieurs jours par semaine.
    - Un réseau d'usine composé de terminaux qui ne peuvent exécuter aucun agent. Tout son trafic Internet sort par un pare-feu capable d'exporter ses journaux en Syslog.

    Les applications cloud utilisées depuis les deux environnements doivent être découvertes et évaluées en continu, sans chargement manuel de journaux.

    Quelles sont les deux sources de données à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Snapshot reports of the firewall traffic logs", fr: "Des rapports d'instantané des journaux de trafic du pare-feu" } }
    - { id: b, text: { en: "The Microsoft Defender for Endpoint integration", fr: "L'intégration de Microsoft Defender for Endpoint" } }
    - { id: c, text: { en: "App connectors for the sanctioned SaaS apps", fr: "Des connecteurs d'applications pour les applications SaaS approuvées" } }
    - { id: d, text: { en: "A log collector that receives the firewall logs", fr: "Un collecteur de journaux qui reçoit les journaux du pare-feu" } }
    - { id: e, text: { en: "Conditional Access app control for all cloud apps", fr: "Le contrôle d'application par accès conditionnel pour toutes les applications cloud" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      The native Defender for Endpoint integration feeds Cloud Discovery continuously from onboarded devices and extends discovery beyond the corporate network, which covers remote laptops. For devices that can't run an agent, a log collector on the network receives the firewall logs over Syslog or FTP and uploads them continuously.
    fr: |-
      L'intégration native de Defender for Endpoint alimente la découverte cloud en continu depuis les appareils intégrés et étend la découverte au-delà du réseau de l'entreprise, ce qui couvre les portables en télétravail. Pour les appareils qui ne peuvent pas exécuter d'agent, un collecteur de journaux placé sur le réseau reçoit les journaux du pare-feu en Syslog ou FTP et les charge en continu.
  options:
    a:
      en: |-
        Snapshot reports require uploading the logs manually, which the requirement excludes.
      fr: |-
        Les rapports d'instantané exigent de charger les journaux manuellement, ce que l'exigence exclut.
    c:
      en: |-
        App connectors use the APIs of apps that are already known and sanctioned; they don't discover unknown apps.
      fr: |-
        Les connecteurs d'applications utilisent les API d'applications déjà connues et approuvées ; ils ne découvrent pas les applications inconnues.
    e:
      en: |-
        Conditional Access app control applies session controls to apps that sign in through an identity provider; it doesn't discover the apps used.
      fr: |-
        Le contrôle d'application par accès conditionnel applique des contrôles de session aux applications qui se connectent par un fournisseur d'identité ; il ne découvre pas les applications utilisées.
references:
  - title: Cloud app discovery overview
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/set-up-cloud-discovery
