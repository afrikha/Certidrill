id: sc100-4b-api-statements
objective: "4.2.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. publishes its partner APIs through Azure API Management and plans to enable Microsoft Defender for APIs. The security operations team uses Microsoft Sentinel, and Defender CSPM is enabled on the subscription.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. publie ses API partenaires via Azure API Management et prévoit d'activer Microsoft Defender for APIs. L'équipe des opérations de sécurité utilise Microsoft Sentinel, et Defender CSPM est activé sur l'abonnement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Defender for APIs blocks the requests that it detects as OWASP API Top 10 attacks.
        fr: Defender for APIs bloque les requêtes qu'il détecte comme des attaques du Top 10 OWASP des API.
    - id: s2
      text:
        en: The API assets protected by Defender for APIs can be queried in the cloud security explorer.
        fr: Les ressources d'API protégées par Defender for APIs peuvent être interrogées dans l'explorateur de sécurité cloud.
    - id: s3
      text:
        en: Defender for APIs alerts can be exported to Microsoft Sentinel.
        fr: Les alertes de Defender for APIs peuvent être exportées vers Microsoft Sentinel.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Defender for APIs monitors runtime traffic, raises alerts and makes recommendations; enforcement such as throttling or token validation is done by API Management policies. With the Defender CSPM plan, API assets and risks can be queried in the cloud security explorer, and Defender for APIs alerts and recommendations can be exported to a SIEM such as Microsoft Sentinel.
    fr: |
      Defender for APIs surveille le trafic à l'exécution, génère des alertes et formule des recommandations ; l'application de contrôles comme la limitation ou la validation des jetons relève des stratégies d'API Management. Avec le plan Defender CSPM, les ressources et les risques des API peuvent être interrogés dans l'explorateur de sécurité cloud, et les alertes et recommandations de Defender for APIs peuvent être exportées vers un SIEM comme Microsoft Sentinel.
references:
  - title: About Microsoft Defender for APIs
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-apis-introduction
