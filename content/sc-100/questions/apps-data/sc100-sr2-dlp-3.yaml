stem:
  en: |
    You recommend a DLP policy for the Devices location.
  fr: |
    Vous recommandez une stratégie DLP pour l'emplacement Appareils.
body:
  solution:
    en: |
      You recommend a data loss prevention (DLP) policy that applies only to the **Devices** location for the employees' Windows 11 devices. The policy detects the **Credit Card Number** sensitive information type, blocks copying the matching files to USB storage and uploading them to restricted cloud service domains, and shows a notification to the user.
    fr: |
      Vous recommandez une stratégie de protection contre la perte de données (DLP) qui s'applique uniquement à l'emplacement **Appareils** pour les appareils Windows 11 des employés. La stratégie détecte le type d'informations sensibles **Credit Card Number**, bloque la copie des fichiers correspondants sur un stockage USB et leur chargement vers des domaines de service cloud restreints, et affiche une notification à l'utilisateur.
answer: { value: false }
explanation:
  correct:
    en: |
      Endpoint DLP controls what users do with files on their Windows and macOS devices. It doesn't control who can open a document that is already stored in SharePoint Online or OneDrive, so external auditors who have a sharing link keep access, including to existing documents. The policy must include the SharePoint and OneDrive locations.
    fr: |
      La DLP de point de terminaison contrôle ce que les utilisateurs font des fichiers sur leurs appareils Windows et macOS. Elle ne contrôle pas qui peut ouvrir un document déjà stocké dans SharePoint Online ou OneDrive : les auditeurs externes qui disposent d'un lien de partage gardent l'accès, y compris aux documents existants. La stratégie doit inclure les emplacements SharePoint et OneDrive.
references:
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
