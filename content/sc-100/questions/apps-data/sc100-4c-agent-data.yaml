id: sc100-4c-agent-data
objective: "4.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation plans to deploy agents in Foundry Agent Service for its HR department. The agents will store conversation history and use vector stores built from HR documents.

    The design must meet the following requirements:

    - All agent data must stay in Azure resources that Adatum manages in its own tenant.
    - The vector store service must reject every data request that is authorized with an API key.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation prévoit de déployer des agents dans Foundry Agent Service pour son service RH. Les agents stockeront l'historique des conversations et utiliseront des magasins de vecteurs construits à partir de documents RH.

    La conception doit répondre aux exigences suivantes :

    - Toutes les données des agents doivent rester dans des ressources Azure qu'Adatum gère dans son propre locataire.
    - Le service de magasins de vecteurs doit rejeter toute demande de données autorisée par une clé API.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Agent environment: [[s1]]

      Store messages and conversation history in: [[s2]]

      API access control of the Azure AI Search service: [[s3]]
    fr: |
      Environnement des agents : [[s1]]

      Stocker les messages et l'historique des conversations dans : [[s2]]

      Contrôle d'accès aux API du service Azure AI Search : [[s3]]
  slots:
    - id: s1
      options:
        - { id: basic, text: { en: "Basic agent setup", fr: "Configuration de base des agents" } }
        - { id: standard, text: { en: "Standard agent setup", fr: "Configuration standard des agents" } }
    - id: s2
      options:
        - { id: cosmos, text: { en: "Azure Cosmos DB for NoSQL", fr: "Azure Cosmos DB for NoSQL" } }
        - { id: search, text: Azure AI Search }
        - { id: storage, text: { en: "Azure Storage", fr: "Stockage Azure" } }
        - { id: sql, text: Azure SQL Database }
    - id: s3
      options:
        - { id: key, text: { en: "API key", fr: "Clé API" } }
        - { id: rbac, text: { en: "Role-based access control", fr: "Contrôle d'accès en fonction du rôle" } }
        - { id: both, text: { en: "Both", fr: "Les deux" } }
answer:
  values: { s1: standard, s2: cosmos, s3: rbac }
explanation:
  correct:
    en: |-
      The standard agent setup uses customer-managed, single-tenant resources, so all agent data stays in your tenant; the basic setup uses Microsoft-managed resources. In the standard setup, Cosmos DB for NoSQL stores messages and conversation history, Azure AI Search stores vector stores and Azure Storage stores files. Setting Azure AI Search to role-based access control only makes it refuse data requests that pass an API key.
    fr: |-
      La configuration standard des agents utilise des ressources monolocataires gérées par le client : toutes les données des agents restent dans votre locataire ; la configuration de base utilise des ressources gérées par Microsoft. Dans la configuration standard, Cosmos DB for NoSQL stocke les messages et l'historique des conversations, Azure AI Search stocke les magasins de vecteurs et Stockage Azure stocke les fichiers. Configurer Azure AI Search sur le contrôle d'accès en fonction du rôle uniquement lui fait refuser les demandes de données qui transmettent une clé API.
  options:
    both:
      en: |-
        With Both, requests that pass an API key are still accepted; this option is meant only for the transition period.
      fr: |-
        Avec Les deux, les demandes qui transmettent une clé API restent acceptées ; cette option est réservée à la période de transition.
    search:
      en: |-
        Azure AI Search holds the vector stores, not the conversation history.
      fr: |-
        Azure AI Search contient les magasins de vecteurs, pas l'historique des conversations.
references:
  - title: Set up standard agent resources
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/standard-agent-setup
  - title: Enable or disable role-based access control in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-security-enable-roles
