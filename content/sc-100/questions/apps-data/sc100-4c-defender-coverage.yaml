id: sc100-4c-defender-coverage
objective: "4.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is designing threat protection for its data services with Defender for Cloud. The estate includes Azure Cosmos DB accounts that use different APIs, storage accounts that are created every week, and PostgreSQL servers on on-premises machines that are onboarded to Azure Arc.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation conçoit la protection contre les menaces de ses services de données avec Defender for Cloud. Le patrimoine comprend des comptes Azure Cosmos DB qui utilisent différentes API, des comptes de stockage créés chaque semaine et des serveurs PostgreSQL sur des machines locales intégrées à Azure Arc.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Defender for Azure Cosmos DB protects the accounts that use Azure Cosmos DB for MongoDB.
        fr: |-
          Defender for Azure Cosmos DB protège les comptes qui utilisent Azure Cosmos DB for MongoDB.
    - id: s2
      text:
        en: |-
          If Defender for Storage is enabled at the subscription level, storage accounts created later in the subscription are protected automatically.
        fr: |-
          Si Defender for Storage est activé au niveau de l'abonnement, les comptes de stockage créés ensuite dans l'abonnement sont protégés automatiquement.
    - id: s3
      text:
        en: |-
          Defender for open-source relational databases protects the PostgreSQL servers on the Azure Arc-enabled machines.
        fr: |-
          Defender for open-source relational databases protège les serveurs PostgreSQL des machines activées par Azure Arc.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      Defender for Azure Cosmos DB supports only Azure Cosmos DB for NoSQL; the MongoDB, Cassandra, Table and Gremlin APIs aren't supported. At the subscription level, Defender for Storage automatically includes existing and newly created storage accounts. Defender for open-source relational databases covers Azure flexible servers and Amazon RDS, and it isn't supported on Azure Arc-enabled machines.
    fr: |-
      Defender for Azure Cosmos DB ne prend en charge qu'Azure Cosmos DB for NoSQL ; les API MongoDB, Cassandra, Table et Gremlin ne sont pas prises en charge. Au niveau de l'abonnement, Defender for Storage inclut automatiquement les comptes de stockage existants et nouvellement créés. Defender for open-source relational databases couvre les serveurs flexibles Azure et Amazon RDS, et n'est pas pris en charge sur les machines activées par Azure Arc.
references:
  - title: Overview of Microsoft Defender for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-defender-for-cosmos
  - title: Overview of Microsoft Defender for Open-Source Relational Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-databases-introduction
