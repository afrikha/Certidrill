id: sc100-4a-portfolio-attack-paths
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. runs 140 line-of-business applications on Azure and AWS. Both clouds are connected to Microsoft Defender for Cloud with foundational CSPM only, and the security team receives thousands of recommendations that it can't prioritize.

    Leadership asks for an evaluation of the application portfolio that identifies which internet-exposed workloads could let an attacker move laterally, through vulnerabilities and attached identities, to a database that holds sensitive data. The highest-risk paths must be ranked first, with recommendations that break each path.

    What should you recommend?
  fr: |
    Contoso, Ltd. exécute 140 applications métier sur Azure et AWS. Les deux clouds sont connectés à Microsoft Defender for Cloud avec le CSPM de base uniquement, et l'équipe de sécurité reçoit des milliers de recommandations qu'elle ne parvient pas à hiérarchiser.

    La direction demande une évaluation du portefeuille d'applications qui identifie quelles charges de travail exposées à Internet pourraient permettre à un attaquant de se déplacer latéralement, par des vulnérabilités et des identités attachées, jusqu'à une base de données contenant des données sensibles. Les chemins les plus risqués doivent être classés en premier, avec des recommandations qui coupent chaque chemin.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Filter the foundational CSPM recommendations by severity and sort them by secure score impact.", fr: "Filtrer les recommandations du CSPM de base par gravité et les trier selon leur impact sur le score de sécurité." } }
    - { id: b, text: { en: "Enable the Defender CSPM plan and use attack path analysis.", fr: "Activer le plan Defender CSPM et utiliser l'analyse des chemins d'attaque." } }
    - { id: c, text: { en: "Enable Defender for Servers Plan 2 and review the vulnerability assessment findings.", fr: "Activer Defender for Servers Plan 2 et examiner les résultats de l'évaluation des vulnérabilités." } }
    - { id: d, text: { en: "Review the recommended actions of Microsoft Secure Score for each application.", fr: "Examiner les actions recommandées du Niveau de sécurité Microsoft pour chaque application." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Attack path analysis, part of the Defender CSPM plan, builds the cloud security graph from assets, permissions, network exposure and vulnerabilities. It follows possible lateral movement from an internet-exposed entry point to a critical target, such as a database with sensitive data, ranks the highest-risk paths and suggests the recommendations that break them.
    fr: |-
      L'analyse des chemins d'attaque, incluse dans le plan Defender CSPM, construit le graphe de sécurité cloud à partir des ressources, des autorisations, de l'exposition réseau et des vulnérabilités. Elle suit les déplacements latéraux possibles d'un point d'entrée exposé à Internet jusqu'à une cible critique, comme une base de données contenant des données sensibles, classe les chemins les plus risqués et propose les recommandations qui les coupent.
  options:
    a:
      en: |-
        Severity and score impact rate recommendations one by one; they don't correlate exposure, identities and data into paths.
      fr: |-
        La gravité et l'impact sur le score évaluent les recommandations une par une ; ils ne mettent pas en corrélation l'exposition, les identités et les données sous forme de chemins.
    c:
      en: |-
        Vulnerability assessment lists flaws per machine; without Defender CSPM it doesn't show how they chain to sensitive data.
      fr: |-
        L'évaluation des vulnérabilités liste les failles machine par machine ; sans Defender CSPM, elle ne montre pas comment elles s'enchaînent jusqu'aux données sensibles.
    d:
      en: |-
        Microsoft Secure Score covers Microsoft 365 workloads and identities, not applications hosted on Azure and AWS.
      fr: |-
        Le Niveau de sécurité Microsoft couvre les charges de travail et les identités Microsoft 365, pas les applications hébergées sur Azure et AWS.
references:
  - title: Security explorer and attack paths in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-attack-path
