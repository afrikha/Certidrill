id: sc100-4a-mdca-session-download
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Salesforce for customer relationship management. Salesforce is integrated with Microsoft Entra ID for single sign-on by using SAML 2.0. Woodgrove has Microsoft 365 E5 licenses.

    Contractors access Salesforce from personal computers that aren't managed by Woodgrove. The security team sets the following requirements:

    - Contractors must keep browser access to Salesforce from their personal computers.
    - During those sessions, downloads of files that contain customer data must be blocked in real time.
    - Nothing can be installed on the contractors' computers.

    What should you recommend?
  fr: |
    Woodgrove Bank utilise Salesforce pour la gestion de la relation client. Salesforce est intégré à Microsoft Entra ID pour l'authentification unique avec SAML 2.0. Woodgrove dispose de licences Microsoft 365 E5.

    Des prestataires accèdent à Salesforce depuis des ordinateurs personnels qui ne sont pas gérés par Woodgrove. L'équipe de sécurité fixe les exigences suivantes :

    - Les prestataires doivent conserver un accès à Salesforce par navigateur depuis leurs ordinateurs personnels.
    - Pendant ces sessions, le téléchargement des fichiers qui contiennent des données client doit être bloqué en temps réel.
    - Rien ne peut être installé sur les ordinateurs des prestataires.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Conditional Access policy that routes the sessions to Conditional Access app control, and a session policy in Defender for Cloud Apps", fr: "Une stratégie d'accès conditionnel qui redirige les sessions vers le contrôle d'application par accès conditionnel, et une stratégie de session dans Defender for Cloud Apps" } }
    - { id: b, text: { en: "A Salesforce app connector in Defender for Cloud Apps, and a file policy that quarantines files that contain customer data", fr: "Un connecteur d'applications Salesforce dans Defender for Cloud Apps, et une stratégie de fichier qui met en quarantaine les fichiers contenant des données client" } }
    - { id: c, text: { en: "A Conditional Access policy that grants access to Salesforce only from devices marked as compliant in Intune", fr: "Une stratégie d'accès conditionnel qui n'accorde l'accès à Salesforce que depuis des appareils marqués comme conformes dans Intune" } }
    - { id: d, text: { en: "An Intune device configuration profile that blocks file downloads in Microsoft Edge", fr: "Un profil de configuration d'appareil Intune qui bloque les téléchargements de fichiers dans Microsoft Edge" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Conditional Access app control uses a Microsoft Entra Conditional Access policy to route matching sessions to Defender for Cloud Apps, where a session policy blocks downloads of sensitive files in real time. It works for SAML 2.0 apps and requires nothing on the device, which suits unmanaged computers.
    fr: |-
      Le contrôle d'application par accès conditionnel utilise une stratégie d'accès conditionnel Microsoft Entra pour rediriger les sessions concernées vers Defender for Cloud Apps, où une stratégie de session bloque en temps réel le téléchargement des fichiers sensibles. Il fonctionne avec les applications SAML 2.0 et ne nécessite rien sur l'appareil, ce qui convient aux ordinateurs non gérés.
  options:
    b:
      en: |-
        An app connector scans files through the Salesforce API after the fact; it doesn't block a download during the user's session.
      fr: |-
        Un connecteur d'applications analyse les fichiers par l'API de Salesforce a posteriori ; il ne bloque pas un téléchargement pendant la session de l'utilisateur.
    c:
      en: |-
        Requiring a compliant device would block the contractors' unmanaged computers entirely instead of keeping browser access.
      fr: |-
        Exiger un appareil conforme bloquerait entièrement les ordinateurs non gérés des prestataires au lieu de conserver l'accès par navigateur.
    d:
      en: |-
        A device configuration profile applies only to devices enrolled in Intune, which the contractors' personal computers aren't, and it can't target files by their content.
      fr: |-
        Un profil de configuration d'appareil ne s'applique qu'aux appareils inscrits dans Intune, ce que ne sont pas les ordinateurs personnels des prestataires, et il ne peut pas cibler les fichiers selon leur contenu.
references:
  - title: Conditional Access app control
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad
