id: sc100-cs1b-threat-protection
objective: "4.1.2"
type: dragdrop
caseStudy: sc100-cs1b-lamna
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution for each threat protection requirement.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution pour chaque exigence relative à la protection contre les menaces.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: attach, text: { en: "Safe Attachments in Microsoft Defender for Office 365", fr: "Safe Attachments dans Microsoft Defender for Office 365" } }
    - { id: links, text: { en: "Safe Links in Microsoft Defender for Office 365", fr: "Safe Links dans Microsoft Defender for Office 365" } }
    - { id: mdca, text: { en: "Microsoft Defender for Cloud Apps integrated with Microsoft Defender for Endpoint", fr: "Microsoft Defender for Cloud Apps intégré à Microsoft Defender for Endpoint" } }
    - { id: dlp, text: { en: "Microsoft Purview DLP policies for Exchange and Teams", fr: "Des stratégies DLP Microsoft Purview pour Exchange et Teams" } }
    - { id: mdi, text: "Microsoft Defender for Identity" }
  targets:
    - id: email
      text: { en: "Check email attachments for malware before delivery", fr: "Analyser les pièces jointes des e-mails avant leur remise" }
    - id: click
      text: { en: "Check links in email and Teams messages when they are selected", fr: "Vérifier les liens des e-mails et des messages Teams quand ils sont sélectionnés" }
    - id: apps
      text: { en: "Discover and block unapproved cloud apps on the Windows laptops", fr: "Découvrir et bloquer les applications cloud non approuvées sur les ordinateurs portables Windows" }
answer:
  mapping: { email: attach, click: links, apps: mdca }
explanation:
  correct:
    en: |-
      Safe Attachments opens attachments in a virtual environment (detonation) before the messages are delivered. Safe Links provides time-of-click verification of URLs in email messages, Teams and supported Office apps. Defender for Cloud Apps uses the network traffic logs of Defender for Endpoint to discover the cloud apps used from the laptops wherever they are, and uses the network protection of Defender for Endpoint to block the apps marked as unsanctioned.
    fr: |-
      Safe Attachments ouvre les pièces jointes dans un environnement virtuel (détonation) avant la remise des messages. Safe Links vérifie les URL au moment du clic dans les e-mails, dans Teams et dans les applications Office prises en charge. Defender for Cloud Apps utilise les journaux de trafic réseau de Defender for Endpoint pour découvrir les applications cloud utilisées depuis les ordinateurs portables où qu'ils se trouvent, et s'appuie sur la protection réseau de Defender for Endpoint pour bloquer les applications marquées comme non approuvées.
  options:
    dlp:
      en: |-
        DLP policies detect sensitive content in messages; they don't scan attachments for malware, check links or discover cloud apps.
      fr: |-
        Les stratégies DLP détectent le contenu sensible dans les messages ; elles n'analysent pas les pièces jointes à la recherche de programmes malveillants, ne vérifient pas les liens et ne découvrent pas les applications cloud.
    mdi:
      en: |-
        Defender for Identity monitors on-premises Active Directory signals; it doesn't protect email or cloud app usage.
      fr: |-
        Defender for Identity surveille les signaux d'Active Directory local ; il ne protège ni la messagerie ni l'utilisation des applications cloud.
references:
  - title: Safe Links in Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/safe-links-about
  - title: Integrate Microsoft Defender for Endpoint with Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/mde-integration
