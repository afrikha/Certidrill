id: sc100-4a-tm-design-phase
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is designing a new payment application that will run on Azure and integrate with a third-party card processor. No code has been written yet. The architecture team has drawn the components and how data moves between them.

    The CISO wants potential security design flaws of this business-critical application to be identified and mitigated at the stage where they are cheapest to fix. The developers who will do the work aren't security experts.

    What should you recommend?
  fr: |
    Wingtip Toys conçoit une nouvelle application de paiement qui s'exécutera sur Azure et s'intégrera à un processeur de cartes tiers. Aucun code n'a encore été écrit. L'équipe d'architecture a dessiné les composants et la circulation des données entre eux.

    Le RSSI souhaite que les failles potentielles de conception de sécurité de cette application vitale pour l'entreprise soient identifiées et atténuées au stade où leur correction coûte le moins cher. Les développeurs qui feront ce travail ne sont pas des experts en sécurité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Model the threats with the Microsoft Threat Modeling Tool.", fr: "Modéliser les menaces avec Microsoft Threat Modeling Tool." } }
    - { id: b, text: { en: "Schedule a penetration test before the go-live.", fr: "Planifier un test d'intrusion avant la mise en production." } }
    - { id: c, text: { en: "Enable code scanning on every pull request.", fr: "Activer l'analyse du code sur chaque demande de tirage." } }
    - { id: d, text: { en: "Enable Defender for App Service on the production apps.", fr: "Activer Defender for App Service sur les applications de production." } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Threat modeling is the design analysis activity of the Security Development Lifecycle. The Microsoft Threat Modeling Tool is built for non-security experts: it guides the drawing of the data flow diagram, generates threats with STRIDE and helps manage mitigations. Issues found during design are cheaper and easier to fix.
    fr: |-
      La modélisation des menaces est l'activité d'analyse de la conception du Security Development Lifecycle. Microsoft Threat Modeling Tool est conçu pour des non-spécialistes de la sécurité : il guide le dessin du diagramme de flux de données, génère les menaces avec STRIDE et aide à gérer les atténuations. Les problèmes trouvés pendant la conception sont moins coûteux et plus faciles à corriger.
  options:
    b:
      en: |-
        A penetration test finds issues in a built application, when fixing a design flaw is far more expensive.
      fr: |-
        Un test d'intrusion trouve des problèmes dans une application déjà construite, quand corriger une faille de conception coûte bien plus cher.
    c:
      en: |-
        Code scanning analyzes code that doesn't exist yet; it finds implementation bugs rather than design flaws.
      fr: |-
        L'analyse du code porte sur un code qui n'existe pas encore ; elle trouve des bogues d'implémentation plutôt que des failles de conception.
    d:
      en: |-
        Defender for App Service detects attacks in production, which is the latest and most expensive stage.
      fr: |-
        Defender for App Service détecte les attaques en production, le stade le plus tardif et le plus coûteux.
references:
  - title: Microsoft Threat Modeling Tool overview
    url: https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool
