id: sc100-4c-shared-key-rollout
objective: "4.3.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has 300 Azure Storage accounts. Many applications still authorize requests with account keys or with SAS tokens signed with account keys. The security team requires all access to be authorized with Microsoft Entra ID, and the rollout must not break any application.

    Which four actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. dispose de 300 comptes Stockage Azure. De nombreuses applications autorisent encore leurs demandes avec des clés de compte ou avec des jetons SAS signés avec des clés de compte. L'équipe de sécurité exige que tout accès soit autorisé avec Microsoft Entra ID, et le déploiement ne doit interrompre aucune application.

    Quelles sont les quatre actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: detect, text: { en: "Identify the clients that authorize requests with account keys or SAS by using storage metrics and resource logs.", fr: "Identifier les clients qui autorisent leurs demandes avec des clés de compte ou des SAS à l'aide des métriques et des journaux de ressources du stockage." } }
    - { id: migrate, text: { en: "Migrate those clients to Microsoft Entra ID with managed identities, or to user delegation SAS.", fr: "Migrer ces clients vers Microsoft Entra ID avec des identités managées, ou vers des SAS de délégation d'utilisateur." } }
    - { id: disallow, text: { en: "Disallow Shared Key authorization on the storage accounts.", fr: "Interdire l'autorisation par clé partagée (Shared Key) sur les comptes de stockage." } }
    - { id: deny, text: { en: "Change the effect of the Azure Policy assignment that audits Shared Key access from Audit to Deny.", fr: "Faire passer l'effet de l'attribution Azure Policy qui audite l'accès Shared Key de Audit à Deny." } }
    - { id: rotate, text: { en: "Rotate both account keys of every storage account.", fr: "Faire tourner les deux clés de compte de chaque compte de stockage." } }
    - { id: cmk, text: { en: "Switch the storage accounts to customer-managed keys.", fr: "Faire passer les comptes de stockage aux clés gérées par le client." } }
answer:
  sequence: [ detect, migrate, disallow, deny ]
explanation:
  correct:
    en: |-
      You first find which clients use Shared Key or SAS, then move them to Microsoft Entra ID or user delegation SAS so that nothing breaks when keys stop working. Disallowing Shared Key then rejects account keys, account SAS and service SAS. Finally, switching the policy effect from Audit to Deny prevents new or reconfigured accounts from allowing Shared Key again.
    fr: |-
      Vous trouvez d'abord les clients qui utilisent Shared Key ou des SAS, puis vous les migrez vers Microsoft Entra ID ou des SAS de délégation d'utilisateur afin que rien ne s'interrompe quand les clés cessent de fonctionner. L'interdiction de Shared Key rejette ensuite les clés de compte, les SAS de compte et les SAS de service. Enfin, le passage de l'effet de la stratégie de Audit à Deny empêche les comptes nouveaux ou reconfigurés d'autoriser de nouveau Shared Key.
  options:
    rotate:
      en: |-
        Rotating keys invalidates existing keys and SAS but doesn't stop clients from using new keys, and it breaks applications that haven't migrated.
      fr: |-
        Faire tourner les clés invalide les clés et les SAS existants, mais n'empêche pas les clients d'utiliser les nouvelles clés, et interrompt les applications non migrées.
    cmk:
      en: |-
        Customer-managed keys change who controls encryption at rest, not how requests are authorized.
      fr: |-
        Les clés gérées par le client changent qui contrôle le chiffrement au repos, pas la façon dont les demandes sont autorisées.
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
