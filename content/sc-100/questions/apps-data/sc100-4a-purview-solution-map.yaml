id: sc100-4a-purview-solution-map
objective: "4.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. is an investment firm that has Microsoft 365 E5. The compliance team lists the following requirements for data in Microsoft 365.

    Which Microsoft Purview solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. est une société d'investissement qui dispose de Microsoft 365 E5. L'équipe de conformité énumère les exigences suivantes pour les données de Microsoft 365.

    Quelle solution Microsoft Purview devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: irm, text: { en: "Insider Risk Management", fr: "Gestion des risques internes (Insider Risk Management)" } }
    - { id: ib, text: { en: "Information barriers", fr: "Obstacles aux informations (information barriers)" } }
    - { id: ediscovery, text: eDiscovery }
    - { id: retention, text: { en: "Data lifecycle management retention policies", fr: "Stratégies de rétention de la gestion du cycle de vie des données" } }
    - { id: cc, text: { en: "Communication Compliance", fr: "Conformité des communications (Communication Compliance)" } }
    - { id: audit, text: Audit }
  targets:
    - id: t1
      text: { en: "Detect employees who resign and then download large volumes of confidential files", fr: "Détecter les employés qui démissionnent puis téléchargent de gros volumes de fichiers confidentiels" }
    - id: t2
      text: { en: "Prevent the research team and the trading team from communicating or collaborating in Teams", fr: "Empêcher l'équipe de recherche et l'équipe de trading de communiquer ou de collaborer dans Teams" }
    - id: t3
      text: { en: "Place the mailboxes and OneDrive accounts of 12 custodians on hold for litigation and export the relevant content", fr: "Placer en conservation les boîtes aux lettres et les comptes OneDrive de 12 dépositaires pour un litige et exporter le contenu pertinent" }
    - id: t4
      text: { en: "Keep all Teams chat messages for seven years, then delete them automatically", fr: "Conserver tous les messages de conversation Teams pendant sept ans, puis les supprimer automatiquement" }
answer:
  mapping: { t1: irm, t2: ib, t3: ediscovery, t4: retention }
explanation:
  correct:
    en: |-
      Insider Risk Management correlates signals, such as a resignation followed by mass downloads, to detect data theft by departing users. Information barriers prevent defined segments of users from communicating and collaborating. eDiscovery cases place custodians' content on hold, search it and export it. Retention policies keep content for a defined period and can delete it at the end.
    fr: |-
      La gestion des risques internes met en corrélation des signaux, comme une démission suivie de téléchargements massifs, pour détecter le vol de données par des utilisateurs sur le départ. Les obstacles aux informations empêchent des segments d'utilisateurs définis de communiquer et de collaborer. Les cas eDiscovery placent en conservation le contenu des dépositaires, le recherchent et l'exportent. Les stratégies de rétention conservent le contenu pendant une durée définie et peuvent le supprimer à son terme.
  options:
    cc:
      en: |-
        Communication Compliance detects policy violations, such as harassment or sharing sensitive information, in messages; it doesn't block communication between groups.
      fr: |-
        La conformité des communications détecte les violations de stratégie, comme le harcèlement ou le partage d'informations sensibles, dans les messages ; elle ne bloque pas la communication entre des groupes.
    audit:
      en: |-
        Audit records user and admin activities for investigations; it doesn't hold, retain or block content.
      fr: |-
        L'audit enregistre les activités des utilisateurs et des administrateurs pour les investigations ; il ne conserve pas, ne retient pas et ne bloque pas le contenu.
references:
  - title: Learn about Information Barriers
    url: https://learn.microsoft.com/en-us/purview/information-barriers
