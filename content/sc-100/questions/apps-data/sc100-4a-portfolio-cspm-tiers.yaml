id: sc100-4a-portfolio-cspm-tiers
objective: "4.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has connected its Azure DevOps organization and its GitHub organization to Microsoft Defender for Cloud. The Azure subscriptions that host the applications use foundational CSPM only. Agentless code scanning is enabled.

    The security architect must tell the application owners which DevOps security capabilities they get today and which require the Defender CSPM plan.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys a connecté son organisation Azure DevOps et son organisation GitHub à Microsoft Defender for Cloud. Les abonnements Azure qui hébergent les applications utilisent uniquement le CSPM de base. L'analyse du code sans agent est activée.

    L'architecte sécurité doit indiquer aux propriétaires d'applications quelles fonctionnalités de sécurité DevOps ils obtiennent aujourd'hui et lesquelles exigent le plan Defender CSPM.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          With foundational CSPM, Defender for Cloud shows posture recommendations for misconfigurations of the Azure DevOps and GitHub environments.
        fr: |-
          Avec le CSPM de base, Defender for Cloud affiche des recommandations de posture sur les mauvaises configurations des environnements Azure DevOps et GitHub.
    - id: s2
      text:
        en: |-
          With foundational CSPM, developers receive pull request annotations for security findings in Azure DevOps repositories.
        fr: |-
          Avec le CSPM de base, les développeurs reçoivent des annotations de demandes de tirage pour les résultats de sécurité dans les dépôts Azure DevOps.
    - id: s3
      text:
        en: |-
          Mapping a running container back to the GitHub repository that built its image requires the Defender CSPM plan.
        fr: |-
          Relier un conteneur en cours d'exécution au dépôt GitHub qui a produit son image exige le plan Defender CSPM.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Foundational CSPM includes the DevOps inventory and posture recommendations for DevOps environment misconfigurations in Azure DevOps and GitHub, plus security recommendations from the enabled scanners. Pull request annotations, available for Azure DevOps repositories, and code-to-cloud mapping for containers are Defender CSPM capabilities, as are attack path analysis and the cloud security explorer.
    fr: |-
      Le CSPM de base inclut l'inventaire DevOps et les recommandations de posture sur les mauvaises configurations des environnements Azure DevOps et GitHub, ainsi que les recommandations de sécurité issues des analyseurs activés. Les annotations de demandes de tirage, disponibles pour les dépôts Azure DevOps, et le mappage du code au cloud pour les conteneurs sont des fonctionnalités de Defender CSPM, tout comme l'analyse des chemins d'attaque et l'explorateur de sécurité cloud.
references:
  - title: Support and prerequisites
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/devops-support
