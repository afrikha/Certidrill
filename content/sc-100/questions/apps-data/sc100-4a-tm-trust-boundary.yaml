id: sc100-4a-tm-trust-boundary
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is reviewing the threat model of its booking platform. The data flow diagram contains these flows:

    - F1: A nightly job reads the reservations from the booking database to build an internal report.
    - F2: The web front end calls the booking service, which runs in the same App Service app and process.
    - F3: Anonymous internet users send booking requests to the web front end.
    - F4: The booking service writes reservations to the booking database, which the same team operates.

    The team has time to analyze only one flow in depth this week and must start with the flow that carries the highest exposure according to threat modeling practice.

    Which flow should the team analyze first?
  fr: |
    Tailspin Toys examine le modèle de menaces de sa plateforme de réservation. Le diagramme de flux de données contient ces flux :

    - F1 : un traitement nocturne lit les réservations dans la base de données de réservation pour produire un rapport interne.
    - F2 : le front-end web appelle le service de réservation, qui s'exécute dans la même application App Service et le même processus.
    - F3 : des utilisateurs Internet anonymes envoient des demandes de réservation au front-end web.
    - F4 : le service de réservation écrit les réservations dans la base de données de réservation, exploitée par la même équipe.

    L'équipe n'a le temps d'analyser en profondeur qu'un seul flux cette semaine et doit commencer par le flux le plus exposé selon les pratiques de modélisation des menaces.

    Quel flux l'équipe doit-elle analyser en premier ?
shuffle: false
body:
  options:
    - { id: f1, text: F1 }
    - { id: f2, text: F2 }
    - { id: f3, text: F3 }
    - { id: f4, text: F4 }
answer: { optionId: f3 }
explanation:
  correct:
    en: |-
      Trust boundaries show where different entities are in control. F3 crosses the boundary between anonymous internet users, whom Tailspin doesn't control, and its own web front end, so untrusted input enters the system there and that flow carries the highest exposure.
    fr: |-
      Les limites d'approbation indiquent où des entités différentes exercent le contrôle. F3 traverse la limite entre des utilisateurs Internet anonymes, que Tailspin ne contrôle pas, et son propre front-end web : c'est là que des entrées non fiables pénètrent dans le système, et ce flux présente l'exposition la plus élevée.
  options:
    f2:
      en: |-
        F2 stays inside one process under the same control, so it doesn't cross a trust boundary.
      fr: |-
        F2 reste à l'intérieur d'un seul processus sous le même contrôle : il ne traverse pas de limite d'approbation.
    f4:
      en: |-
        F4 connects components operated by the same team; it carries data that has already crossed the internet boundary.
      fr: |-
        F4 relie des composants exploités par la même équipe ; il transporte des données qui ont déjà traversé la limite avec Internet.
    f1:
      en: |-
        F1 is an internal batch read with no untrusted caller.
      fr: |-
        F1 est une lecture interne par lots, sans appelant non fiable.
references:
  - title: Getting Started - Microsoft Threat Modeling Tool
    url: https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-getting-started
