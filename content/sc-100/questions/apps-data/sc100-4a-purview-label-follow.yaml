id: sc100-4a-purview-label-follow
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has Microsoft 365 E5. The legal department shares merger documents with an external law firm by email and through SharePoint Online.

    The documents must stay protected wherever they go: after they are downloaded, forwarded or copied to a USB drive, only Contoso's legal team and users from the law firm's domain must be able to open them. The documents must also show a "Confidential" header.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose de Microsoft 365 E5. Le service juridique partage des documents de fusion avec un cabinet d'avocats externe par e-mail et par SharePoint Online.

    Les documents doivent rester protégés où qu'ils aillent : après leur téléchargement, leur transfert ou leur copie sur une clé USB, seuls l'équipe juridique de Contoso et les utilisateurs du domaine du cabinet doivent pouvoir les ouvrir. Les documents doivent aussi afficher un en-tête « Confidentiel ».

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A DLP policy that blocks sharing the documents with anyone outside the law firm's domain", fr: "Une stratégie DLP qui bloque le partage des documents avec toute personne extérieure au domaine du cabinet" } }
    - { id: b, text: { en: "A sensitivity label for containers applied to the legal team's SharePoint site", fr: "Une étiquette de confidentialité pour les conteneurs appliquée au site SharePoint de l'équipe juridique" } }
    - { id: c, text: { en: "A retention label that declares the documents as records", fr: "Une étiquette de rétention qui déclare les documents comme enregistrements" } }
    - { id: d, text: { en: "A sensitivity label that applies encryption and content marking to the documents", fr: "Une étiquette de confidentialité qui applique le chiffrement et le marquage du contenu aux documents" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A sensitivity label with encryption assigns usage rights to the users and domains you choose, and the protection stays with the file wherever it's stored or sent. The same label can add content marking such as a header, so one label meets both requirements.
    fr: |-
      Une étiquette de confidentialité avec chiffrement attribue des droits d'utilisation aux utilisateurs et aux domaines choisis, et la protection reste attachée au fichier où qu'il soit stocké ou envoyé. La même étiquette peut ajouter un marquage du contenu, comme un en-tête : une seule étiquette répond aux deux exigences.
  options:
    a:
      en: |-
        DLP controls sharing in the locations it monitors, but once a file is on a USB drive or forwarded by the law firm, nothing stops another person from opening it.
      fr: |-
        La DLP contrôle le partage dans les emplacements qu'elle surveille, mais une fois le fichier copié sur une clé USB ou transféré par le cabinet, rien n'empêche une autre personne de l'ouvrir.
    b:
      en: |-
        A container label sets privacy and sharing settings for the site; it doesn't encrypt files that leave it.
      fr: |-
        Une étiquette de conteneur définit des paramètres de confidentialité et de partage pour le site ; elle ne chiffre pas les fichiers qui en sortent.
    c:
      en: |-
        A retention label governs how long content is kept and whether it can be changed; it doesn't restrict who can open it.
      fr: |-
        Une étiquette de rétention régit la durée de conservation du contenu et sa modifiabilité ; elle ne restreint pas qui peut l'ouvrir.
references:
  - title: Learn about sensitivity labels
    url: https://learn.microsoft.com/en-us/purview/sensitivity-labels
