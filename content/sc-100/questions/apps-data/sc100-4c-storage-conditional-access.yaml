id: sc100-4c-storage-conditional-access
objective: "4.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation stores HR files in an Azure Storage account named sthr. Administrators and HR staff access the blobs with their Microsoft Entra accounts, and some scripts still use the account keys.

    The security team plans Microsoft Entra Conditional Access policies that require a compliant device to access sthr. You need to recommend the storage account setting that is required for these policies to protect the account.

    What should you recommend?
  fr: |
    Adatum Corporation stocke des fichiers RH dans un compte Stockage Azure nommé sthr. Les administrateurs et le personnel RH accèdent aux objets blob avec leurs comptes Microsoft Entra, et certains scripts utilisent encore les clés de compte.

    L'équipe de sécurité prévoit des stratégies d'accès conditionnel Microsoft Entra qui exigent un appareil conforme pour accéder à sthr. Vous devez recommander le paramètre de compte de stockage nécessaire pour que ces stratégies protègent le compte.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Require secure transfer for REST API operations", fr: "Exiger le transfert sécurisé pour les opérations de l'API REST" } }
    - { id: b, text: { en: "Disallow anonymous access to blobs", fr: "Interdire l'accès anonyme aux objets blob" } }
    - { id: c, text: { en: "Enable Defender for Storage on sthr", fr: "Activer Defender for Storage sur sthr" } }
    - { id: d, text: { en: "Disallow Shared Key authorization", fr: "Interdire l'autorisation par clé partagée (Shared Key)" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Conditional Access evaluates Microsoft Entra sign-ins, but a request signed with an account key or a key-based SAS never goes through Microsoft Entra ID. To protect a storage account with Conditional Access policies, Shared Key authorization must be disallowed so that every request uses a Microsoft Entra token.
    fr: |-
      L'accès conditionnel évalue les connexions Microsoft Entra, mais une demande signée avec une clé de compte ou une SAS fondée sur une clé ne passe jamais par Microsoft Entra ID. Pour protéger un compte de stockage avec des stratégies d'accès conditionnel, l'autorisation Shared Key doit être interdite afin que chaque demande utilise un jeton Microsoft Entra.
  options:
    a:
      en: |-
        Secure transfer forces HTTPS, but key-authorized requests over HTTPS still bypass Conditional Access.
      fr: |-
        Le transfert sécurisé impose HTTPS, mais les demandes autorisées par clé en HTTPS contournent toujours l'accès conditionnel.
    b:
      en: |-
        Disallowing anonymous access doesn't stop requests that are authorized with account keys.
      fr: |-
        Interdire l'accès anonyme n'arrête pas les demandes autorisées avec des clés de compte.
    c:
      en: |-
        Defender for Storage detects suspicious activity; it doesn't make requests go through Microsoft Entra ID.
      fr: |-
        Defender for Storage détecte les activités suspectes ; il ne fait pas passer les demandes par Microsoft Entra ID.
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
