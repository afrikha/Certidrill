id: sc100-4a-purview-crown-jewels
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. stores research documents in SharePoint Online and OneDrive. About 3 percent of them describe product formulas that a national regulation classifies as highly sensitive. Litware has Microsoft 365 E5 and already uses sensitivity labels with encryption that rely on Microsoft-managed keys.

    For the formula documents only, the regulator requires that:

    - One of the keys needed to decrypt the content stays under Litware's custody, in a service that Litware hosts in its own datacenter.
    - Content can't be decrypted with keys stored only in Microsoft's cloud.

    Litware accepts that these documents won't be available to Office for the web, eDiscovery, search or Copilot.

    What should you recommend for the formula documents?
  fr: |
    Litware, Inc. stocke ses documents de recherche dans SharePoint Online et OneDrive. Environ 3 % d'entre eux décrivent des formules de produits qu'une réglementation nationale classe comme hautement sensibles. Litware dispose de Microsoft 365 E5 et utilise déjà des étiquettes de confidentialité avec chiffrement qui s'appuient sur des clés gérées par Microsoft.

    Pour les seuls documents de formules, l'autorité de régulation exige que :

    - L'une des clés nécessaires pour déchiffrer le contenu reste sous la garde de Litware, dans un service que Litware héberge dans son propre centre de données.
    - Le contenu ne puisse pas être déchiffré avec des clés stockées uniquement dans le cloud de Microsoft.

    Litware accepte que ces documents ne soient disponibles ni dans Office pour le web, ni dans eDiscovery, ni dans la recherche, ni dans Copilot.

    Que devez-vous recommander pour les documents de formules ?
body:
  options:
    - { id: a, text: { en: "Microsoft Purview Customer Key with root keys that Litware generates", fr: "Microsoft Purview Customer Key avec des clés racines générées par Litware" } }
    - { id: b, text: { en: "A sensitivity label that uses bring your own key (BYOK) in Azure Key Vault", fr: "Une étiquette de confidentialité qui utilise une clé BYOK (bring your own key) dans Azure Key Vault" } }
    - { id: c, text: { en: "A sensitivity label that uses Double Key Encryption", fr: "Une étiquette de confidentialité qui utilise Double Key Encryption" } }
    - { id: d, text: { en: "A sensitivity label for containers applied to the research sites", fr: "Une étiquette de confidentialité pour les conteneurs appliquée aux sites de recherche" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Double Key Encryption protects content with two keys: one is held by the customer in a DKE service that can be hosted on-premises, and the other is stored in Azure, so both are needed to view the data. It's applied through sensitivity labels and is meant for a small share of highly sensitive, regulated content, which is why services such as eDiscovery, search, Office for the web and Copilot can't process it.
    fr: |-
      Double Key Encryption protège le contenu avec deux clés : l'une est détenue par le client dans un service DKE qui peut être hébergé en local, l'autre est stockée dans Azure, et les deux sont nécessaires pour consulter les données. Il s'applique par des étiquettes de confidentialité et vise une petite part de contenu hautement sensible et réglementé, ce qui explique que des services comme eDiscovery, la recherche, Office pour le web et Copilot ne puissent pas le traiter.
  options:
    a:
      en: |-
        Customer Key lets Litware supply the root keys of Microsoft 365 service encryption at rest, but those keys are kept in Azure Key Vault and the services still decrypt the data to process it.
      fr: |-
        Customer Key permet à Litware de fournir les clés racines du chiffrement de service au repos de Microsoft 365, mais ces clés sont conservées dans Azure Key Vault et les services déchiffrent toujours les données pour les traiter.
    b:
      en: |-
        With BYOK the single tenant key lives in Azure Key Vault in Microsoft's cloud, so no key stays in Litware's datacenter.
      fr: |-
        Avec BYOK, l'unique clé de locataire réside dans Azure Key Vault, dans le cloud de Microsoft : aucune clé ne reste dans le centre de données de Litware.
    d:
      en: |-
        A container label controls the privacy and sharing settings of sites; it doesn't encrypt the documents they contain.
      fr: |-
        Une étiquette de conteneur contrôle les paramètres de confidentialité et de partage des sites ; elle ne chiffre pas les documents qu'ils contiennent.
references:
  - title: What is Double Key Encryption (DKE)?
    url: https://learn.microsoft.com/en-us/purview/double-key-encryption
