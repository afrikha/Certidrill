id: sc100-4b-lifecycle-phase-tools
objective: "4.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is defining a full lifecycle strategy for the security of its online booking application. The strategy must assign a Microsoft technology or practice to several phases of the Microsoft Security Development Lifecycle (SDL).

    What should you recommend for each phase? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys définit une stratégie de cycle de vie complet pour la sécurité de son application de réservation en ligne. La stratégie doit attribuer une technologie ou une pratique Microsoft à plusieurs phases du Microsoft Security Development Lifecycle (SDL).

    Que devez-vous recommander pour chaque phase ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Design: identify and rate threats before any code is written: [[design]]

      Release: limit the number of users affected by a faulty build: [[release]]

      Response: correlate security alerts from production into incidents for the security operations team: [[response]]
    fr: |
      Conception : identifier et évaluer les menaces avant l'écriture du code : [[design]]

      Mise en production : limiter le nombre d'utilisateurs touchés par une build défectueuse : [[release]]

      Réponse : corréler les alertes de sécurité de production en incidents pour l'équipe des opérations de sécurité : [[response]]
  slots:
    - id: design
      options:
        - { id: codeql, text: { en: "CodeQL code scanning", fr: "L'analyse du code CodeQL" } }
        - { id: tmt, text: { en: "Microsoft Threat Modeling Tool", fr: "Microsoft Threat Modeling Tool" } }
        - { id: rings, text: { en: "Safe deployment in rings", fr: "Le déploiement sûr par anneaux" } }
        - { id: sentinel, text: { en: "Microsoft Sentinel", fr: "Microsoft Sentinel" } }
    - id: release
      options:
        - { id: codeql, text: { en: "CodeQL code scanning", fr: "L'analyse du code CodeQL" } }
        - { id: tmt, text: { en: "Microsoft Threat Modeling Tool", fr: "Microsoft Threat Modeling Tool" } }
        - { id: rings, text: { en: "Safe deployment in rings", fr: "Le déploiement sûr par anneaux" } }
        - { id: sentinel, text: { en: "Microsoft Sentinel", fr: "Microsoft Sentinel" } }
    - id: response
      options:
        - { id: codeql, text: { en: "CodeQL code scanning", fr: "L'analyse du code CodeQL" } }
        - { id: tmt, text: { en: "Microsoft Threat Modeling Tool", fr: "Microsoft Threat Modeling Tool" } }
        - { id: rings, text: { en: "Safe deployment in rings", fr: "Le déploiement sûr par anneaux" } }
        - { id: sentinel, text: { en: "Microsoft Sentinel", fr: "Microsoft Sentinel" } }
answer:
  values: { design: tmt, release: rings, response: sentinel }
explanation:
  correct:
    en: |
      In the design phase, the SDL uses threat models built from data flow diagrams with the Microsoft Threat Modeling Tool. The release phase rolls builds out gradually through a safe deployment process in rings, so a faulty build reaches a small group first. In the response phase, services are logged and monitored; Microsoft Sentinel correlates alerts into incidents for the security operations team.
    fr: |
      Pendant la phase de conception, le SDL utilise des modèles de menaces construits à partir de diagrammes de flux de données avec Microsoft Threat Modeling Tool. La phase de mise en production déploie les builds progressivement par un processus de déploiement sûr en anneaux : une build défectueuse atteint d'abord un petit groupe. Pendant la phase de réponse, les services sont journalisés et supervisés ; Microsoft Sentinel corrèle les alertes en incidents pour l'équipe des opérations de sécurité.
  options:
    codeql:
      en: CodeQL code scanning is static analysis of existing code, a verification activity; it can't run before code is written.
      fr: L'analyse du code CodeQL est une analyse statique du code existant, une activité de vérification ; elle ne peut pas s'exécuter avant l'écriture du code.
references:
  - title: Microsoft Security Development Lifecycle (SDL)
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-microsoft-security-development-lifecycle
