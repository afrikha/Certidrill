id: sc100-4c-sql-entra-only
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation runs several Azure SQL Database logical servers. An audit found applications and administrators that still connect with SQL logins and shared passwords.

    The security team requires every connection to the servers to be authenticated by Microsoft Entra ID, so that Conditional Access and MFA apply to administrators. SQL authentication must be impossible, including for the server admin login.

    What should you recommend?
  fr: |
    Adatum Corporation exploite plusieurs serveurs logiques Azure SQL Database. Un audit a trouvé des applications et des administrateurs qui se connectent encore avec des connexions SQL et des mots de passe partagés.

    L'équipe de sécurité exige que chaque connexion aux serveurs soit authentifiée par Microsoft Entra ID, afin que l'accès conditionnel et l'authentification multifacteur s'appliquent aux administrateurs. L'authentification SQL doit être impossible, y compris pour la connexion d'administrateur du serveur.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Set a Microsoft Entra admin and delete the contained database users that use SQL authentication", fr: "Définir un administrateur Microsoft Entra et supprimer les utilisateurs de base de données autonome qui utilisent l'authentification SQL" } }
    - { id: b, text: { en: "Enable Defender for Azure SQL to alert on sign-ins that use SQL authentication", fr: "Activer Defender for Azure SQL pour alerter sur les connexions qui utilisent l'authentification SQL" } }
    - { id: c, text: { en: "Disable public network access on the servers and use private endpoints", fr: "Désactiver l'accès au réseau public sur les serveurs et utiliser des points de terminaison privés" } }
    - { id: d, text: { en: "Set a Microsoft Entra admin and enable Microsoft Entra-only authentication on each server", fr: "Définir un administrateur Microsoft Entra et activer l'authentification Microsoft Entra uniquement sur chaque serveur" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Microsoft Entra-only authentication disables SQL authentication on the logical server, including the server admin login, so only Microsoft Entra identities can connect. It requires a Microsoft Entra admin to be set first, and Azure Policy can force new servers to be created with it enabled.
    fr: |-
      L'authentification Microsoft Entra uniquement désactive l'authentification SQL sur le serveur logique, y compris la connexion d'administrateur du serveur : seules les identités Microsoft Entra peuvent se connecter. Elle nécessite qu'un administrateur Microsoft Entra soit défini au préalable, et Azure Policy peut imposer que les nouveaux serveurs soient créés avec cette option activée.
  options:
    a:
      en: |-
        Deleting users removes today's accounts, but SQL authentication stays enabled, so the server admin login and new SQL logins still work.
      fr: |-
        Supprimer des utilisateurs retire les comptes actuels, mais l'authentification SQL reste activée : la connexion d'administrateur du serveur et les nouvelles connexions SQL fonctionnent toujours.
    b:
      en: |-
        Defender for Azure SQL detects threats; it doesn't disable an authentication method.
      fr: |-
        Defender for Azure SQL détecte les menaces ; il ne désactive pas une méthode d'authentification.
    c:
      en: |-
        Private endpoints restrict the network path; clients can still authenticate with SQL logins.
      fr: |-
        Les points de terminaison privés restreignent le chemin réseau ; les clients peuvent toujours s'authentifier avec des connexions SQL.
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
