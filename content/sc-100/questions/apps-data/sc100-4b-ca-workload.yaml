id: sc100-4b-ca-workload
objective: "4.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Entra tenant that contains single-tenant app registrations used by internal automation, user-assigned managed identities used by Azure workloads, and multitenant SaaS applications. Contoso is evaluating Conditional Access for workload identities.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un locataire Microsoft Entra qui contient des inscriptions d'applications monolocataires utilisées par l'automatisation interne, des identités managées affectées par l'utilisateur utilisées par des charges de travail Azure, et des applications SaaS multilocataires. Contoso évalue l'accès conditionnel pour les identités de charge de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Conditional Access policy for workload identities can be scoped to the user-assigned managed identities.
        fr: Une stratégie d'accès conditionnel pour les identités de charge de travail peut cibler les identités managées affectées par l'utilisateur.
    - id: s2
      text:
        en: A Conditional Access policy can block a single-tenant service principal that requests a token from outside Contoso's trusted named locations.
        fr: Une stratégie d'accès conditionnel peut bloquer un principal de service monolocataire qui demande un jeton depuis l'extérieur des emplacements nommés approuvés de Contoso.
    - id: s3
      text:
        en: Creating a Conditional Access policy scoped to service principals requires Workload Identities Premium licenses.
        fr: La création d'une stratégie d'accès conditionnel ciblant des principaux de service exige des licences Workload Identities Premium.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Conditional Access for workload identities applies to single-tenant service principals registered in the tenant; managed identities and multitenant or SaaS applications aren't covered, and access reviews are the suggested control for managed identities. A policy can use the location condition (for example, all locations except trusted named locations) or service principal risk, with Block as the only grant control. Workload Identities Premium is required to create or modify these policies.
    fr: |
      L'accès conditionnel pour les identités de charge de travail s'applique aux principaux de service monolocataires inscrits dans le locataire ; les identités managées et les applications multilocataires ou SaaS ne sont pas couvertes, et les révisions d'accès sont le contrôle suggéré pour les identités managées. Une stratégie peut utiliser la condition d'emplacement (par exemple tous les emplacements sauf les emplacements nommés approuvés) ou le risque du principal de service, avec Block comme seul contrôle d'octroi. Workload Identities Premium est requis pour créer ou modifier ces stratégies.
references:
  - title: Conditional Access for workload identities
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/workload-identity
