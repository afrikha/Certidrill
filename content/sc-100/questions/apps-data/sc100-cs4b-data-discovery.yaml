id: sc100-cs4b-data-discovery
objective: "4.3.1"
type: multi
caseStudy: sc100-cs4b-adatum-university
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a solution that meets the data protection officer requirement and the attack path requirement of the data requirements.

    Which two solutions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution qui respecte l'exigence du délégué à la protection des données et l'exigence relative aux chemins d'attaque, parmi les exigences relatives aux données.

    Quelles sont les deux solutions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Data discovery and classification in Azure SQL, enabled on sql-sis", fr: "La découverte et la classification des données d'Azure SQL, activées sur sql-sis" } }
    - { id: b, text: { en: "The sensitive data discovery component of the Defender CSPM plan", fr: "Le composant de découverte des données sensibles du plan Defender CSPM" } }
    - { id: c, text: { en: "Microsoft Purview Data Map, with a scan registered for each data source", fr: "Microsoft Purview Data Map, avec une analyse inscrite pour chaque source de données" } }
    - { id: d, text: { en: "Microsoft Purview auto-labeling policies for SharePoint Online and OneDrive", fr: "Des stratégies d'étiquetage automatique Microsoft Purview pour SharePoint Online et OneDrive" } }
    - { id: e, text: { en: "Sensitive data threat detection in Microsoft Defender for Storage on stresearch", fr: "La détection des menaces sur les données sensibles de Microsoft Defender pour le stockage sur stresearch" } }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: |-
      Microsoft Purview Data Map scans and classifies data sources such as Azure SQL Database, Azure Data Lake Storage and SQL Server, and builds the catalog that the data protection officer needs. Sensitive data discovery in Defender CSPM uses Purview sensitive information types to mark data stores as sensitive and highlights the attack paths that lead to them. It samples data rather than scanning it fully, which is why the catalog still requires Purview scanning.
    fr: |-
      Microsoft Purview Data Map analyse et classe des sources de données comme Azure SQL Database, Azure Data Lake Storage et SQL Server, et construit le catalogue dont le délégué à la protection des données a besoin. La découverte des données sensibles de Defender CSPM utilise les types d'informations sensibles de Purview pour marquer les magasins de données comme sensibles et met en évidence les chemins d'attaque qui y mènent. Elle échantillonne les données au lieu de les analyser entièrement : c'est pourquoi le catalogue nécessite toujours les analyses Purview.
  options:
    a:
      en: |-
        Data discovery and classification labels columns in one Azure SQL database; it doesn't cover stresearch or the alumni database, and it doesn't show attack paths.
      fr: |-
        La découverte et la classification des données étiquettent les colonnes d'une base de données Azure SQL ; elles ne couvrent ni stresearch ni la base de données des anciens élèves, et ne montrent pas de chemins d'attaque.
    d:
      en: |-
        Auto-labeling applies sensitivity labels to Microsoft 365 content; none of the three data stores is in SharePoint Online or OneDrive.
      fr: |-
        L'étiquetage automatique applique des étiquettes de confidentialité au contenu Microsoft 365 ; aucun des trois magasins de données ne se trouve dans SharePoint Online ou OneDrive.
    e:
      en: |-
        Sensitive data threat detection prioritizes security alerts on storage accounts that hold sensitive data; it doesn't build attack paths or a catalog of the databases.
      fr: |-
        La détection des menaces sur les données sensibles hiérarchise les alertes de sécurité sur les comptes de stockage qui contiennent des données sensibles ; elle ne construit ni chemins d'attaque ni catalogue des bases de données.
references:
  - title: Data sources that connect to Data Map
    url: https://learn.microsoft.com/en-us/purview/data-map-data-sources
  - title: Overview - About data security posture management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-data-security-posture
