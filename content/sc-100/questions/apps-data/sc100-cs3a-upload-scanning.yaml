id: sc100-cs3a-upload-scanning
objective: "4.3.7"
type: yesno_statements
caseStudy: sc100-cs3a-wide-world-importers
difficulty: 1
status: draft
stem:
  en: |
    You plan to enable on-upload malware scanning in Defender for Storage on stsupplierfiles to meet the supplier file requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'activer l'analyse des programmes malveillants au chargement dans Defender for Storage sur stsupplierfiles pour satisfaire les exigences relatives aux fichiers des fournisseurs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          To start func-orders as fast as possible after a clean result, you should use the Event Grid events of the scan results.
        fr: |-
          Pour démarrer func-orders le plus rapidement possible après un résultat sain, vous devez utiliser les événements Event Grid des résultats d'analyse.
    - id: s2
      text:
        en: |-
          Malware scanning detects malware in the invoices that are encrypted on the client side before upload.
        fr: |-
          L'analyse des programmes malveillants détecte les programmes malveillants dans les factures chiffrées côté client avant le dépôt.
    - id: s3
      text:
        en: |-
          Because the scan result is written to the blob index tags, the index tags can be used as the only control that prevents func-orders from processing malicious files.
        fr: |-
          Comme le résultat de l'analyse est écrit dans les balises d'index d'objet blob, ces balises peuvent servir de seul contrôle pour empêcher func-orders de traiter des fichiers malveillants.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      Event Grid events require more configuration, but they're the fastest way to trigger an automated response to a scan result. Malware scanning can't decrypt client-side encrypted data, so malware inside those invoices goes undetected. Blob index tags receive the scan result and time by default, but they aren't tamper-resistant, so Microsoft advises against using them as the sole security control.
    fr: |-
      Les événements Event Grid demandent plus de configuration, mais ce sont le moyen le plus rapide de déclencher une réponse automatisée à un résultat d'analyse. L'analyse des programmes malveillants ne peut pas déchiffrer les données chiffrées côté client : un programme malveillant présent dans ces factures n'est pas détecté. Les balises d'index d'objet blob reçoivent par défaut le résultat et l'heure de l'analyse, mais elles ne résistent pas à la falsification ; Microsoft déconseille donc de les utiliser comme seul contrôle de sécurité.
references:
  - title: Introduction to Defender for Storage Malware Scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-malware-scan
