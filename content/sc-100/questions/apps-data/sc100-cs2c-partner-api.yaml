id: sc100-cs2c-partner-api
objective: "4.2.7"
type: multi
caseStudy: sc100-cs2c-southridge-video
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to publish the licensing API to the partner broadcasters. The solution must meet the API requirements.

    Which two components should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution pour publier l'API de licences auprès des diffuseurs partenaires. La solution doit répondre aux exigences relatives à l'API.

    Quels sont les deux composants que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Azure API Management with the validate-azure-ad-token and rate-limit-by-key policies", fr: "Gestion des API Azure avec les stratégies validate-azure-ad-token et rate-limit-by-key" } }
    - { id: b, text: { en: "Microsoft Defender for APIs enabled for the subscription that hosts App Service", fr: "Microsoft Defender for APIs activé pour l'abonnement qui héberge App Service" } }
    - { id: c, text: { en: "Azure Application Gateway with a WAF policy in front of the API gateway", fr: "Azure Application Gateway avec une stratégie WAF devant la passerelle d'API" } }
    - { id: d, text: { en: "App Service authentication configured with the southridgevideo.com tenant", fr: "L'authentification App Service configurée avec le locataire southridgevideo.com" } }
    - { id: e, text: { en: "Azure Firewall Standard with DNAT rules that publish App Service", fr: "Pare-feu Azure Standard avec des règles DNAT qui publient App Service" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      API Management acts as the gateway: the validate-azure-ad-token policy rejects requests whose Microsoft Entra token is missing or invalid before they reach the backend, and rate-limit-by-key enforces a per-partner limit over a short window. A web application firewall on Application Gateway placed in front of API Management inspects requests for common web exploits such as SQL injection before they reach the gateway.
    fr: |
      Gestion des API Azure joue le rôle de passerelle : la stratégie validate-azure-ad-token rejette les requêtes dont le jeton Microsoft Entra est absent ou non valide avant qu'elles atteignent le back-end, et rate-limit-by-key impose une limite par partenaire sur une courte période. Un pare-feu d'applications web sur Application Gateway placé devant Gestion des API Azure inspecte les requêtes pour détecter les attaques web courantes comme l'injection SQL avant qu'elles atteignent la passerelle.
  options:
    b:
      en: Defender for APIs provides security insights, recommendations and threat detection for APIs published in API Management; it doesn't validate tokens, throttle partners or block web exploits.
      fr: Defender for APIs fournit des analyses de sécurité, des recommandations et la détection des menaces pour les API publiées dans Gestion des API Azure ; il ne valide pas de jetons, ne limite pas les partenaires et ne bloque pas les attaques web.
    d:
      en: App Service authentication validates tokens inside App Service itself, after the request has reached it, and it can't limit the calls of each partner.
      fr: L'authentification App Service valide les jetons dans App Service lui-même, une fois la requête arrivée, et elle ne peut pas limiter les appels de chaque partenaire.
    e:
      en: Azure Firewall Standard filters traffic at the network and application rule level; it doesn't inspect HTTP requests for web exploits the way a WAF does.
      fr: Pare-feu Azure Standard filtre le trafic au niveau des règles réseau et d'application ; il n'inspecte pas les requêtes HTTP pour détecter les attaques web comme le fait un WAF.
references:
  - title: Mitigate OWASP API security top 10 in Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/mitigate-owasp-api-threats
