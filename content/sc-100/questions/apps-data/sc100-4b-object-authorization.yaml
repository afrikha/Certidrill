id: sc100-4b-object-authorization
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders exposes an orders API to its mobile app through Azure API Management. API Management validates the Microsoft Entra access token of each request with the validate-azure-ad-token policy and applies a rate limit per user.

    A security researcher reports that a signed-in customer can read the orders of other customers by changing the order number in the request URL. Northwind owns the code of the back-end API.

    You need to recommend where to mitigate this vulnerability. What should you recommend?
  fr: |
    Northwind Traders expose une API de commandes à son application mobile via Azure API Management. API Management valide le jeton d'accès Microsoft Entra de chaque requête avec la stratégie validate-azure-ad-token et applique une limite de débit par utilisateur.

    Un chercheur en sécurité signale qu'un client connecté peut lire les commandes d'autres clients en modifiant le numéro de commande dans l'URL de la requête. Northwind est propriétaire du code de l'API back-end.

    Vous devez recommander l'endroit où atténuer cette vulnérabilité. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Add required claims to the validate-azure-ad-token policy in API Management.", fr: "Ajouter des revendications requises à la stratégie validate-azure-ad-token dans API Management." } }
    - { id: b, text: { en: "Enable Microsoft Defender for APIs on the API Management instance.", fr: "Activer Microsoft Defender for APIs sur l'instance API Management." } }
    - { id: c, text: { en: "Lower the per-user rate limit in API Management.", fr: "Réduire la limite de débit par utilisateur dans API Management." } }
    - { id: d, text: { en: "Check in the back-end API that the caller owns each requested order.", fr: "Vérifier dans l'API back-end que l'appelant est propriétaire de chaque commande demandée." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      This is broken object level authorization, the first threat of the OWASP API Security Top 10. Microsoft recommends implementing object level authorization in the back-end API itself, because only the back end knows which objects belong to which user. A custom API Management policy is only a fallback when the back end can't be changed.
    fr: |
      Il s'agit d'une autorisation défaillante au niveau des objets, la première menace du Top 10 OWASP de la sécurité des API. Microsoft recommande d'implémenter l'autorisation au niveau des objets dans l'API back-end elle-même, car seul le back-end sait quels objets appartiennent à quel utilisateur. Une stratégie API Management personnalisée n'est qu'un recours lorsque le back-end ne peut pas être modifié.
  options:
    a:
      en: Required claims check that the token is valid and authorized for the API, but the customer's token is valid; the claims don't say which orders the customer owns.
      fr: Les revendications requises vérifient que le jeton est valide et autorisé pour l'API, mais le jeton du client est valide ; elles n'indiquent pas quelles commandes appartiennent au client.
    b:
      en: Defender for APIs detects threats and recommends fixes; it doesn't enforce authorization on each object.
      fr: Defender for APIs détecte les menaces et recommande des corrections ; il n'applique pas l'autorisation sur chaque objet.
    c:
      en: A lower rate limit slows down the enumeration of orders but still lets a customer read other customers' orders.
      fr: Une limite de débit plus basse ralentit l'énumération des commandes, mais laisse toujours un client lire les commandes des autres.
references:
  - title: Mitigate OWASP API security top 10 in Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/mitigate-owasp-api-threats
