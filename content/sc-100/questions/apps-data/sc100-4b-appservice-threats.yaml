id: sc100-4b-appservice-threats
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. hosts 40 public web apps in Azure App Service. Several apps were decommissioned last year, but their custom domains were not always removed from DNS.

    You need to recommend a solution that alerts the security operations team when a subdomain is left open to takeover because its App Service website was decommissioned, and when attackers run high-privilege commands or vulnerability scanners against the running apps. No agent may be deployed.

    What should you recommend?
  fr: |
    Contoso, Ltd. héberge 40 applications web publiques dans Azure App Service. Plusieurs applications ont été mises hors service l'an dernier, mais leurs domaines personnalisés n'ont pas toujours été supprimés du DNS.

    Vous devez recommander une solution qui alerte l'équipe des opérations de sécurité lorsqu'un sous-domaine reste exposé à une prise de contrôle parce que son site web App Service a été mis hors service, et lorsque des attaquants exécutent des commandes à privilèges élevés ou des analyseurs de vulnérabilités contre les applications en cours d'exécution. Aucun agent ne doit être déployé.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Defender for Servers Plan 2", fr: "Microsoft Defender for Servers Plan 2" } }
    - { id: b, text: { en: "Microsoft Defender External Attack Surface Management", fr: "Microsoft Defender External Attack Surface Management" } }
    - { id: c, text: { en: "Azure Web Application Firewall on Azure Front Door", fr: "Azure Web Application Firewall sur Azure Front Door" } }
    - { id: d, text: { en: "Microsoft Defender for App Service", fr: "Microsoft Defender for App Service" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Defender for App Service is natively integrated with App Service, so no agent is deployed. It alerts on dangling DNS when an App Service website is decommissioned but its custom domain remains, and it detects attacks against the running apps, such as high-privilege command execution and vulnerability scanners.
    fr: |
      Defender for App Service est intégré nativement à App Service : aucun agent n'est déployé. Il alerte sur les entrées DNS non résolues (dangling DNS) lorsqu'un site web App Service est mis hors service alors que son domaine personnalisé subsiste, et il détecte les attaques contre les applications en cours d'exécution, comme l'exécution de commandes à privilèges élevés et les analyseurs de vulnérabilités.
  options:
    a:
      en: Defender for Servers protects virtual machines and Arc-enabled servers that you manage, not the App Service platform that hosts web apps.
      fr: Defender for Servers protège les machines virtuelles et les serveurs compatibles Arc que vous gérez, pas la plateforme App Service qui héberge les applications web.
    b:
      en: Defender EASM maps the internet-facing attack surface from the outside; it doesn't monitor command execution inside the running apps.
      fr: Defender EASM cartographie la surface d'attaque exposée à Internet depuis l'extérieur ; il ne surveille pas l'exécution de commandes dans les applications en cours d'exécution.
    c:
      en: A WAF filters HTTP requests at the edge; it doesn't detect dangling DNS entries or commands that run on the App Service instances.
      fr: Un WAF filtre les requêtes HTTP en périphérie ; il ne détecte ni les entrées DNS non résolues ni les commandes exécutées sur les instances App Service.
references:
  - title: Overview of Defender for App Service to protect your Azure App Service web apps and APIs
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-app-service-introduction
