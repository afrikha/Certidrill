id: sc100-4c-cosmos-threats
objective: "4.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys stores player profiles in an Azure Cosmos DB for NoSQL account. The SOC wants alerts when the account is queried from Tor exit nodes, when queries look like SQL injection attempts and when key-listing patterns resemble lateral movement.

    The solution must not access the data in the account or affect its performance.

    What should you recommend?
  fr: |
    Wingtip Toys stocke les profils des joueurs dans un compte Azure Cosmos DB for NoSQL. Le SOC veut des alertes quand le compte est interrogé depuis des nœuds de sortie Tor, quand des requêtes ressemblent à des tentatives d'injection SQL et quand des schémas d'énumération des clés ressemblent à un déplacement latéral.

    La solution ne doit pas accéder aux données du compte ni affecter ses performances.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Defender for Azure SQL Databases", fr: "Defender for Azure SQL Databases" } }
    - { id: b, text: { en: "Defender for Azure Cosmos DB", fr: "Defender for Azure Cosmos DB" } }
    - { id: c, text: { en: "Defender CSPM with sensitive data discovery", fr: "Defender CSPM avec la découverte des données sensibles" } }
    - { id: d, text: { en: "Defender for open-source relational databases", fr: "Defender for open-source relational databases" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Defender for Azure Cosmos DB, one of the Defender for Databases plans, detects potential SQL injection, access from known bad actors such as Tor exit nodes and suspicious key-listing patterns, based on Microsoft threat intelligence. It doesn't access the account data and doesn't affect the service's performance. It supports Cosmos DB for NoSQL.
    fr: |-
      Defender for Azure Cosmos DB, l'un des plans de Defender for Databases, détecte les injections SQL potentielles, les accès depuis des acteurs malveillants connus comme les nœuds de sortie Tor et les schémas suspects d'énumération des clés, à partir du renseignement sur les menaces de Microsoft. Il n'accède pas aux données du compte et n'affecte pas les performances du service. Il prend en charge Cosmos DB for NoSQL.
  options:
    a:
      en: |-
        Defender for Azure SQL Databases protects Azure SQL Database, SQL Managed Instance and Synapse dedicated SQL pools, not Cosmos DB.
      fr: |-
        Defender for Azure SQL Databases protège Azure SQL Database, SQL Managed Instance et les pools SQL dédiés Synapse, pas Cosmos DB.
    c:
      en: |-
        Defender CSPM assesses posture and data sensitivity; it doesn't raise threat detection alerts on database activity.
      fr: |-
        Defender CSPM évalue la posture et la sensibilité des données ; il ne déclenche pas d'alertes de détection des menaces sur l'activité de la base de données.
    d:
      en: |-
        Defender for open-source relational databases covers PostgreSQL, MySQL and Amazon RDS engines, not Cosmos DB.
      fr: |-
        Defender for open-source relational databases couvre PostgreSQL, MySQL et les moteurs Amazon RDS, pas Cosmos DB.
references:
  - title: Overview of Microsoft Defender for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-defender-for-cosmos
