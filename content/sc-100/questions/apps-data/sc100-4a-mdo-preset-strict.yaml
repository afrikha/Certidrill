id: sc100-4a-mdo-preset-strict
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has Microsoft Defender for Office 365 Plan 1 for all users. Today, only the default policies and Built-in protection apply.

    Executives and the finance team are frequent targets of impersonation attacks. They must receive the most aggressive email protection available. The settings must be kept up to date by Microsoft as threats change, and the solution must minimize administrative effort.

    What should you recommend for the executives and the finance team?
  fr: |
    Adatum Corporation dispose de Microsoft Defender for Office 365 Plan 1 pour tous les utilisateurs. Aujourd'hui, seules les stratégies par défaut et la protection intégrée (Built-in protection) s'appliquent.

    Les dirigeants et l'équipe financière sont souvent la cible d'attaques par emprunt d'identité. Ils doivent bénéficier de la protection de messagerie la plus stricte disponible. Les paramètres doivent être tenus à jour par Microsoft au fil de l'évolution des menaces, et la solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander pour les dirigeants et l'équipe financière ?
body:
  options:
    - { id: a, text: { en: "Add them to the Standard preset security policy.", fr: "Les ajouter à la stratégie de sécurité prédéfinie Standard." } }
    - { id: b, text: { en: "Add them to the Strict preset security policy.", fr: "Les ajouter à la stratégie de sécurité prédéfinie Strict." } }
    - { id: c, text: { en: "Create custom anti-phishing policies with the highest priority.", fr: "Créer des stratégies anti-hameçonnage personnalisées de priorité la plus élevée." } }
    - { id: d, text: { en: "Keep them in Built-in protection and tag them as priority accounts.", fr: "Les laisser dans la protection intégrée et les marquer comme comptes prioritaires." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Preset security policies apply settings that Microsoft maintains, and almost none of them can be changed, which removes tuning work. The Strict profile is the more aggressive one, intended for high-value targets and priority users, and it takes precedence over Standard and custom policies when a recipient matches several of them.
    fr: |-
      Les stratégies de sécurité prédéfinies appliquent des paramètres que Microsoft tient à jour, et presque aucun n'est modifiable, ce qui supprime le travail de réglage. Le profil Strict est le plus strict des deux, destiné aux cibles de grande valeur et aux utilisateurs prioritaires, et il prévaut sur Standard et sur les stratégies personnalisées quand un destinataire correspond à plusieurs d'entre elles.
  options:
    a:
      en: |-
        Standard is the baseline for most users; it's less aggressive than Strict.
      fr: |-
        Standard est la base de référence pour la plupart des utilisateurs ; il est moins strict que Strict.
    c:
      en: |-
        Custom policies must be designed and tuned by the administrators, and Microsoft doesn't update their settings.
      fr: |-
        Les stratégies personnalisées doivent être conçues et réglées par les administrateurs, et Microsoft ne met pas leurs paramètres à jour.
    d:
      en: |-
        Built-in protection gives only basic Safe Links and Safe Attachments protection, and a user tag alone doesn't change the policies that apply.
      fr: |-
        La protection intégrée ne fournit qu'une protection de base Liens fiables et Pièces jointes fiables, et une étiquette d'utilisateur seule ne change pas les stratégies qui s'appliquent.
references:
  - title: Preset security policies
    url: https://learn.microsoft.com/en-us/defender-office-365/preset-security-policies
