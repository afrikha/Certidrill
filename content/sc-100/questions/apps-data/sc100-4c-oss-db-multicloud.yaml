id: sc100-4c-oss-db-multicloud
objective: "4.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. runs its booking platform on Azure Database for PostgreSQL flexible server in Azure and on Amazon Aurora PostgreSQL in AWS. The AWS account is connected to Microsoft Defender for Cloud.

    The SOC needs alerts for brute force attacks and anomalous database access on both platforms, and the solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Proseware, Inc. exploite sa plateforme de réservation sur Azure Database pour PostgreSQL – Serveur flexible dans Azure et sur Amazon Aurora PostgreSQL dans AWS. Le compte AWS est connecté à Microsoft Defender for Cloud.

    Le SOC a besoin d'alertes sur les attaques par force brute et les accès anormaux aux bases de données sur les deux plateformes, et la solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable Defender for SQL servers on machines and onboard the Aurora instances to Azure Arc", fr: "Activer Defender for SQL servers on machines et intégrer les instances Aurora à Azure Arc" } }
    - { id: b, text: { en: "Enable Defender CSPM on the Azure subscription and on the AWS connector", fr: "Activer Defender CSPM sur l'abonnement Azure et sur le connecteur AWS" } }
    - { id: c, text: { en: "Enable Defender for Azure SQL Databases on the Azure subscription and on the AWS connector", fr: "Activer Defender for Azure SQL Databases sur l'abonnement Azure et sur le connecteur AWS" } }
    - { id: d, text: { en: "Enable Defender for open-source relational databases on the Azure subscription and on the AWS connector", fr: "Activer Defender for open-source relational databases sur l'abonnement Azure et sur le connecteur AWS" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Defender for open-source relational databases protects Azure Database for PostgreSQL and MySQL flexible servers and Amazon RDS engines, including Aurora PostgreSQL. It raises alerts on anomalous access and query patterns, and it separates successful brute force attacks from failed ones. Enabling it on the subscription and the AWS connector covers both platforms without agents.
    fr: |-
      Defender for open-source relational databases protège les serveurs flexibles Azure Database pour PostgreSQL et MySQL et les moteurs Amazon RDS, dont Aurora PostgreSQL. Il déclenche des alertes sur les schémas d'accès et de requête anormaux, et distingue les attaques par force brute réussies de celles qui échouent. L'activer sur l'abonnement et sur le connecteur AWS couvre les deux plateformes sans agent.
  options:
    a:
      en: |-
        Defender for SQL servers on machines protects SQL Server instances, and Aurora is a managed service on which you can't install the Azure Arc agent.
      fr: |-
        Defender for SQL servers on machines protège des instances SQL Server, et Aurora est un service managé sur lequel vous ne pouvez pas installer l'agent Azure Arc.
    b:
      en: |-
        Defender CSPM assesses posture and attack paths; it doesn't raise brute force alerts on database activity.
      fr: |-
        Defender CSPM évalue la posture et les chemins d'attaque ; il ne déclenche pas d'alertes de force brute sur l'activité des bases de données.
    c:
      en: |-
        Defender for Azure SQL Databases covers Azure SQL services, not PostgreSQL engines.
      fr: |-
        Defender for Azure SQL Databases couvre les services Azure SQL, pas les moteurs PostgreSQL.
references:
  - title: Overview of Microsoft Defender for Open-Source Relational Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-databases-introduction
