id: sc100-4b-private-backend
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs a booking application in an Azure App Service web app on a Premium v3 App Service plan. The app stores data in an Azure SQL Database logical server that is currently reachable from the internet. Tailspin has a virtual network named VNet1 in the same region.

    You need to recommend a solution that meets the following requirements:

    - The logical server must not be reachable from the internet.
    - The app must connect to the database through a private IP address.

    Which three actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute une application de réservation dans une application web Azure App Service sur un plan App Service Premium v3. L'application stocke ses données sur un serveur logique Azure SQL Database actuellement accessible depuis Internet. Tailspin dispose d'un réseau virtuel nommé VNet1 dans la même région.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - Le serveur logique ne doit pas être accessible depuis Internet.
    - L'application doit se connecter à la base de données par une adresse IP privée.

    Quelles sont les trois actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create a private endpoint for the logical server in VNet1.", fr: "Créer un point de terminaison privé pour le serveur logique dans VNet1." } }
    - { id: b, text: { en: "Add access restriction rules to the web app.", fr: "Ajouter des règles de restriction d'accès à l'application web." } }
    - { id: c, text: { en: "Disable public network access on the logical server.", fr: "Désactiver l'accès au réseau public sur le serveur logique." } }
    - { id: d, text: { en: "Enable Azure DDoS Network Protection on VNet1.", fr: "Activer Azure DDoS Network Protection sur VNet1." } }
    - { id: e, text: { en: "Enable virtual network integration on the web app with a subnet of VNet1.", fr: "Activer l'intégration au réseau virtuel sur l'application web avec un sous-réseau de VNet1." } }
    - { id: f, text: { en: "Enable Microsoft Defender for SQL on the logical server.", fr: "Activer Microsoft Defender for SQL sur le serveur logique." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      A private endpoint gives the logical server a private IP address in VNet1, and disabling public network access removes its internet exposure. App Service apps don't run inside a virtual network, so the app needs virtual network integration, which carries its outbound calls into VNet1, where it reaches the private endpoint.
    fr: |
      Un point de terminaison privé donne au serveur logique une adresse IP privée dans VNet1, et la désactivation de l'accès au réseau public supprime son exposition à Internet. Les applications App Service ne s'exécutent pas dans un réseau virtuel : l'application a besoin de l'intégration au réseau virtuel, qui fait passer ses appels sortants dans VNet1, où elle atteint le point de terminaison privé.
  options:
    b:
      en: Access restrictions filter inbound requests to the web app; they don't change how the app reaches the database.
      fr: Les restrictions d'accès filtrent les requêtes entrantes vers l'application web ; elles ne changent pas la façon dont l'application atteint la base de données.
    d:
      en: DDoS Network Protection mitigates volumetric attacks on public IP addresses; it doesn't make the database private.
      fr: DDoS Network Protection atténue les attaques volumétriques sur les adresses IP publiques ; il ne rend pas la base de données privée.
    f:
      en: Defender for SQL detects threats and vulnerabilities; it doesn't remove the public endpoint or provide private connectivity.
      fr: Defender for SQL détecte les menaces et les vulnérabilités ; il ne supprime pas le point de terminaison public et ne fournit pas de connectivité privée.
references:
  - title: App Service networking features
    url: https://learn.microsoft.com/en-us/azure/app-service/networking-features
