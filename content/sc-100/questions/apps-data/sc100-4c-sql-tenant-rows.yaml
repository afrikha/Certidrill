id: sc100-4c-sql-tenant-rows
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys runs a multitenant SaaS application that stores the orders of all its customers in shared tables of one Azure SQL database. Each table has a TenantId column, and the application sets the tenant of the signed-in user in the session context.

    A code review found that a missing filter in one query returned another customer's orders. The security architect requires the database itself to restrict every query to the rows of the current tenant, without changing every query of the application.

    What should you recommend?
  fr: |
    Tailspin Toys exploite une application SaaS multilocataire qui stocke les commandes de tous ses clients dans des tables partagées d'une seule base de données Azure SQL. Chaque table possède une colonne TenantId, et l'application définit le locataire de l'utilisateur connecté dans le contexte de session.

    Une revue de code a montré qu'un filtre manquant dans une requête renvoyait les commandes d'un autre client. L'architecte de sécurité exige que la base de données elle-même limite chaque requête aux lignes du locataire courant, sans modifier toutes les requêtes de l'application.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Dynamic data masking on the columns of the orders tables", fr: "Le masquage dynamique des données sur les colonnes des tables de commandes" } }
    - { id: b, text: { en: "Always Encrypted on the TenantId column", fr: "Always Encrypted sur la colonne TenantId" } }
    - { id: c, text: { en: "Row-level security with a security policy that filters on TenantId", fr: "La sécurité au niveau des lignes avec une stratégie de sécurité qui filtre sur TenantId" } }
    - { id: d, text: { en: "Column-level permissions that deny SELECT on the TenantId column", fr: "Des autorisations au niveau des colonnes qui refusent SELECT sur la colonne TenantId" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Row-level security applies a predicate function, through a security policy, to every query on the table, so the engine returns only the rows whose TenantId matches the session context. The filter is enforced in the database even when application code forgets it.
    fr: |-
      La sécurité au niveau des lignes applique une fonction de prédicat, par une stratégie de sécurité, à chaque requête sur la table : le moteur ne renvoie que les lignes dont TenantId correspond au contexte de session. Le filtre est appliqué dans la base de données même quand le code de l'application l'oublie.
  options:
    a:
      en: |-
        Masking hides column values in results but still returns every row of every tenant.
      fr: |-
        Le masquage cache les valeurs des colonnes dans les résultats, mais renvoie toujours toutes les lignes de tous les locataires.
    b:
      en: |-
        Encrypting TenantId protects its value, not access to the rows of other tenants.
      fr: |-
        Chiffrer TenantId protège sa valeur, pas l'accès aux lignes des autres locataires.
    d:
      en: |-
        Column permissions restrict which columns a user can read, not which rows.
      fr: |-
        Les autorisations sur les colonnes limitent les colonnes qu'un utilisateur peut lire, pas les lignes.
references:
  - title: Row-level security
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
