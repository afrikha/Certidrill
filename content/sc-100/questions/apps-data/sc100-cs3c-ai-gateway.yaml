id: sc100-cs3c-ai-gateway
objective: "4.2.7"
type: dragdrop
caseStudy: sc100-cs3c-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You plan to place apim-ai between the departments' applications and the Azure OpenAI model deployments.

    Which API Management capability should you recommend for each AI gateway requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de placer apim-ai entre les applications des départements et les déploiements de modèles Azure OpenAI.

    Quelle fonctionnalité de Gestion des API devez-vous recommander pour chaque exigence relative à la passerelle IA ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: limit, text: { en: "Token limit policy", fr: "Stratégie de limite de jetons" } }
    - { id: metric, text: { en: "Token metric emission policy", fr: "Stratégie d'émission de métriques de jetons" } }
    - { id: cache, text: { en: "Semantic caching policies", fr: "Stratégies de mise en cache sémantique" } }
    - { id: identity, text: { en: "Managed identity authentication to the backends", fr: "Authentification par identité managée auprès des backends" } }
    - { id: balance, text: { en: "Backend pool with load balancing and a circuit breaker", fr: "Pool de backends avec équilibrage de charge et disjoncteur" } }
    - { id: safety, text: { en: "Content safety policy", fr: "Stratégie de sécurité du contenu" } }
  targets:
    - id: t1
      text: { en: "Limit each department to a number of tokens per minute", fr: "Limiter chaque département à un nombre de jetons par minute" }
    - id: t2
      text: { en: "Report token consumption per department in Azure Monitor", fr: "Présenter la consommation de jetons par département dans Azure Monitor" }
    - id: t3
      text: { en: "Reach the models without API keys", fr: "Atteindre les modèles sans clés API" }
    - id: t4
      text: { en: "Send requests to the other region when one deployment is throttled", fr: "Envoyer les requêtes vers l'autre région quand un déploiement est limité" }
answer:
  mapping: { t1: limit, t2: metric, t3: identity, t4: balance }
explanation:
  correct:
    en: |-
      The token limit policy enforces token-based limits per counter key, such as a subscription key per department. The token metric emission policy sends token metrics to Azure Monitor with custom dimensions such as the department. API Management can authenticate to Azure AI services with a managed identity, so no API key is needed. A backend pool load-balances across the regional deployments, and its circuit breaker applies the Retry-After value returned by a throttled backend.
    fr: |-
      La stratégie de limite de jetons impose des limites basées sur les jetons par clé de compteur, par exemple une clé d'abonnement par département. La stratégie d'émission de métriques de jetons envoie des métriques de jetons à Azure Monitor avec des dimensions personnalisées comme le département. Gestion des API peut s'authentifier auprès des services d'IA Azure avec une identité managée : aucune clé API n'est nécessaire. Un pool de backends répartit la charge entre les déploiements régionaux, et son disjoncteur applique la valeur Retry-After renvoyée par un backend limité.
  options:
    cache:
      en: |-
        Semantic caching returns stored completions for similar prompts to reduce load; it doesn't enforce limits, report consumption or fail over.
      fr: |-
        La mise en cache sémantique renvoie des complétions stockées pour des prompts similaires afin de réduire la charge ; elle n'impose pas de limites, ne présente pas la consommation et n'assure pas de basculement.
    safety:
      en: |-
        The content safety policy moderates prompts with Azure AI Content Safety; it doesn't meet any of the four requirements.
      fr: |-
        La stratégie de sécurité du contenu modère les prompts avec Azure AI Content Safety ; elle ne répond à aucune des quatre exigences.
references:
  - title: AI gateway capabilities in Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
