id: sc100-sr2-stg-2
objective: "4.3.6"
type: series_yesno
series: sc100-sr2-storage-entra-auth
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You recommend rotating the account keys and storing them in Azure Key Vault.
  fr: |
    Vous recommandez d'effectuer la rotation des clés de compte et de les stocker dans Azure Key Vault.
body:
  solution:
    en: |
      You recommend that you rotate both account access keys of stfinance01, store the new connection string in Azure Key Vault, and let the app retrieve it by using the managed identity of its virtual machines. Analysts receive service SAS tokens signed with the new keys.
    fr: |
      Vous recommandez d'effectuer la rotation des deux clés d'accès du compte stfinance01, de stocker la nouvelle chaîne de connexion dans Azure Key Vault et de laisser l'application la récupérer à l'aide de l'identité managée de ses machines virtuelles. Les analystes reçoivent des jetons SAS de service signés avec les nouvelles clés.
answer: { value: false }
explanation:
  correct:
    en: |
      Rotating the keys invalidates the keys and SAS tokens that leaked, but the app and the analysts still use Shared Key authorization. Requests signed with an account key or a service SAS aren't tied to a Microsoft Entra identity, so access can't be granted or revoked per identity.
    fr: |
      La rotation des clés invalide les clés et les jetons SAS qui ont fuité, mais l'application et les analystes utilisent toujours l'autorisation par clé partagée. Les requêtes signées avec une clé de compte ou une SAS de service ne sont pas liées à une identité Microsoft Entra : l'accès ne peut donc pas être accordé ou révoqué par identité.
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
