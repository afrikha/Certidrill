status: draft
stem:
  en: |
    You recommend a DLP policy for the Exchange location.
  fr: |
    Vous recommandez une stratégie DLP pour l'emplacement Exchange.
body:
  solution:
    en: |
      You recommend a data loss prevention (DLP) policy that applies only to the **Exchange** location. The policy detects the **Credit Card Number** sensitive information type, blocks messages sent to recipients outside the organization, and shows a policy tip to the sender.
    fr: |
      Vous recommandez une stratégie de protection contre la perte de données (DLP) qui s'applique uniquement à l'emplacement **Exchange**. La stratégie détecte le type d'informations sensibles **Credit Card Number**, bloque les messages envoyés à des destinataires extérieurs à l'organisation et affiche un conseil de stratégie à l'expéditeur.
answer: { value: false }
explanation:
  correct:
    en: |
      The Exchange location protects email messages, not the documents stored in SharePoint Online and OneDrive. External auditors who receive a sharing link to a document still open it, because the sharing happens in SharePoint and OneDrive. The policy must include the SharePoint and OneDrive locations.
    fr: |
      L'emplacement Exchange protège les messages électroniques, pas les documents stockés dans SharePoint Online et OneDrive. Les auditeurs externes qui reçoivent un lien de partage vers un document peuvent toujours l'ouvrir, car le partage a lieu dans SharePoint et OneDrive. La stratégie doit inclure les emplacements SharePoint et OneDrive.
references:
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
