id: sc100-4a-tm-practice
objective: "4.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation wants to introduce threat modeling for its business-critical applications. The development teams use Azure DevOps and aren't security specialists. The security architect is preparing the guidance.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation souhaite instaurer la modélisation des menaces pour ses applications vitales pour l'entreprise. Les équipes de développement utilisent Azure DevOps et ne sont pas spécialistes de la sécurité. L'architecte sécurité prépare les recommandations.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The Microsoft Threat Modeling Tool generates potential threats for a diagram by using the STRIDE categories.
        fr: |-
          Microsoft Threat Modeling Tool génère les menaces potentielles d'un diagramme à l'aide des catégories STRIDE.
    - id: s2
      text:
        en: |-
          A threat model should be created once the application code is complete, so that it reflects the real implementation.
        fr: |-
          Un modèle de menaces doit être créé une fois le code de l'application terminé, afin de refléter l'implémentation réelle.
    - id: s3
      text:
        en: |-
          When a new integration adds a data flow to the application, the threat model should be updated.
        fr: |-
          Quand une nouvelle intégration ajoute un flux de données à l'application, le modèle de menaces doit être mis à jour.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      The analysis view of the Threat Modeling Tool lists threats generated from its default template, which uses STRIDE. Threat modeling is a design discipline: it identifies flaws early in design, when they're cheapest to fix, not after the code is written. The model must be revisited throughout the lifecycle as the architecture evolves, so that new features and data flows don't introduce unmanaged risk.
    fr: |-
      La vue d'analyse de Threat Modeling Tool liste les menaces générées à partir de son modèle par défaut, qui utilise STRIDE. La modélisation des menaces est une discipline de conception : elle identifie les failles tôt, pendant la conception, quand leur correction coûte le moins cher, et non après l'écriture du code. Le modèle doit être revu tout au long du cycle de vie à mesure que l'architecture évolue, afin que les nouvelles fonctionnalités et les nouveaux flux de données n'introduisent pas de risque non maîtrisé.
references:
  - title: Getting Started - Microsoft Threat Modeling Tool
    url: https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-getting-started
  - title: Architecture strategies for securing a development lifecycle
    url: https://learn.microsoft.com/en-us/azure/well-architected/security/threat-model
