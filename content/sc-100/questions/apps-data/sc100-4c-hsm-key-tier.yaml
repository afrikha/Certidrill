id: sc100-4c-hsm-key-tier
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans to encrypt several Azure Storage accounts and Azure SQL databases with customer-managed keys. The compliance team requires the keys to be generated and stored in hardware security modules (HSMs).

    The keys don't need to be in a single-tenant HSM, and the solution must minimize cost.

    Where should you recommend storing the keys?
  fr: |
    Northwind Traders prévoit de chiffrer plusieurs comptes Stockage Azure et bases de données Azure SQL avec des clés gérées par le client. L'équipe de conformité exige que les clés soient générées et stockées dans des modules de sécurité matériels (HSM).

    Les clés n'ont pas besoin de se trouver dans un HSM monolocataire, et la solution doit réduire les coûts au minimum.

    Où devez-vous recommander de stocker les clés ?
body:
  options:
    - { id: a, text: { en: "An Azure Key Vault Standard vault", fr: "Un coffre Azure Key Vault Standard" } }
    - { id: b, text: { en: "An Azure Key Vault Managed HSM", fr: "Un HSM managé Azure Key Vault" } }
    - { id: c, text: { en: "An Azure Key Vault Premium vault", fr: "Un coffre Azure Key Vault Premium" } }
    - { id: d, text: { en: "An Azure Payment HSM", fr: "Un Azure Payment HSM" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Premium tier of Azure Key Vault adds HSM-protected keys to the software-protected keys of the Standard tier, on a multitenant service. It meets the HSM requirement at a lower cost than a dedicated HSM, and Azure Storage and Azure SQL support Key Vault keys as customer-managed keys.
    fr: |-
      Le niveau Premium d'Azure Key Vault ajoute les clés protégées par HSM aux clés protégées par logiciel du niveau Standard, sur un service multilocataire. Il répond à l'exigence HSM à moindre coût qu'un HSM dédié, et Stockage Azure comme Azure SQL prennent en charge les clés Key Vault comme clés gérées par le client.
  options:
    a:
      en: |-
        The Standard tier protects keys with software only, so it doesn't meet the HSM requirement.
      fr: |-
        Le niveau Standard protège les clés uniquement par logiciel : il ne répond pas à l'exigence HSM.
    b:
      en: |-
        Managed HSM is a single-tenant HSM pool; it meets the requirement but costs more than needed when single tenancy isn't required.
      fr: |-
        Le HSM managé est un pool HSM monolocataire ; il répond à l'exigence, mais coûte plus que nécessaire quand la monolocation n'est pas exigée.
    d:
      en: |-
        Azure Payment HSM provides dedicated HSMs for payment processing operations; it isn't a key store that Azure Storage and Azure SQL use for customer-managed keys.
      fr: |-
        Azure Payment HSM fournit des HSM dédiés aux opérations de traitement des paiements ; ce n'est pas un magasin de clés que Stockage Azure et Azure SQL utilisent pour les clés gérées par le client.
references:
  - title: About Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
