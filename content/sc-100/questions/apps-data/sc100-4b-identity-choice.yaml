id: sc100-4b-identity-choice
objective: "4.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is standardizing the identities used by its workloads to access Azure resources. No workload may use a secret or a certificate that Fabrikam must store or rotate.

    You need to recommend an identity solution for each workload.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. normalise les identités qu'utilisent ses charges de travail pour accéder aux ressources Azure. Aucune charge de travail ne doit utiliser un secret ou un certificat que Fabrikam doit stocker ou renouveler.

    Vous devez recommander une solution d'identité pour chaque charge de travail.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      An Azure Functions app whose identity must be deleted automatically when the app is deleted: [[func]]

      A pod in an Amazon EKS cluster that reads blobs from an Azure Storage account: [[eks]]
    fr: |
      Une application Azure Functions dont l'identité doit être supprimée automatiquement lorsque l'application est supprimée : [[func]]

      Un pod dans un cluster Amazon EKS qui lit des objets blob dans un compte Stockage Azure : [[eks]]
  slots:
    - id: func
      options:
        - { id: sami, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
        - { id: uami, text: { en: "A user-assigned managed identity", fr: "Une identité managée affectée par l'utilisateur" } }
        - { id: cert, text: { en: "An app registration with a certificate", fr: "Une inscription d'application avec un certificat" } }
        - { id: fic, text: { en: "An app registration with a federated identity credential", fr: "Une inscription d'application avec des informations d'identification d'identité fédérée" } }
    - id: eks
      options:
        - { id: sami, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
        - { id: secret, text: { en: "An app registration with a client secret", fr: "Une inscription d'application avec un secret client" } }
        - { id: cert, text: { en: "An app registration with a certificate", fr: "Une inscription d'application avec un certificat" } }
        - { id: fic, text: { en: "An app registration with a federated identity credential", fr: "Une inscription d'application avec des informations d'identification d'identité fédérée" } }
answer:
  values: { func: sami, eks: fic }
explanation:
  correct:
    en: |
      A system-assigned managed identity is created with its Azure resource and deleted automatically with it. A pod in a Kubernetes cluster outside Azure, such as Amazon EKS, can use workload identity federation: a federated identity credential on an app registration or a user-assigned managed identity trusts the tokens that the cluster's issuer gives to the pod's service account, so no secret is stored.
    fr: |
      Une identité managée affectée par le système est créée avec sa ressource Azure et supprimée automatiquement avec elle. Un pod dans un cluster Kubernetes hors d'Azure, comme Amazon EKS, peut utiliser la fédération d'identité de charge de travail : des informations d'identification d'identité fédérée sur une inscription d'application ou une identité managée affectée par l'utilisateur approuvent les jetons que l'émetteur du cluster remet au compte de service du pod ; aucun secret n'est stocké.
  options:
    uami:
      en: A user-assigned managed identity has an independent lifecycle and must be deleted explicitly.
      fr: Une identité managée affectée par l'utilisateur a un cycle de vie indépendant et doit être supprimée explicitement.
    cert:
      en: A certificate is a credential that must be stored and renewed.
      fr: Un certificat est une information d'identification à stocker et à renouveler.
    secret:
      en: A client secret must be stored and rotated.
      fr: Un secret client doit être stocké et renouvelé.
    sami:
      en: A system-assigned managed identity exists only on an Azure resource; an EKS pod can't use one.
      fr: Une identité managée affectée par le système n'existe que sur une ressource Azure ; un pod EKS ne peut pas en utiliser.
    fic:
      en: Federation is for workloads that receive tokens from an external identity provider; an Azure Functions app uses a managed identity directly.
      fr: La fédération concerne les charges de travail qui reçoivent des jetons d'un fournisseur d'identité externe ; une application Azure Functions utilise directement une identité managée.
references:
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
  - title: Workload identity federation concepts
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
