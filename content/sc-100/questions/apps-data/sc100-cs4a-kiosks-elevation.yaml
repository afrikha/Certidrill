id: sc100-cs4a-kiosks-elevation
objective: "4.1.3"
type: multi
caseStudy: sc100-cs4a-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a Microsoft Intune solution that meets the device requirements.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution Microsoft Intune qui respecte les exigences relatives aux appareils.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy the check-in kiosks with Windows Autopilot user-driven mode and Microsoft Entra hybrid join", fr: "Déployer les bornes d'enregistrement avec le mode piloté par l'utilisateur de Windows Autopilot et la jonction hybride Microsoft Entra" } }
    - { id: b, text: { en: "Create Endpoint Privilege Management elevation rules for the diagnostic tool on the engineers' laptops", fr: "Créer des règles d'élévation Endpoint Privilege Management pour l'outil de diagnostic sur les ordinateurs portables des ingénieurs" } }
    - { id: c, text: { en: "Deploy Windows LAPS so that the engineers retrieve the local administrator password when they run the tool", fr: "Déployer Windows LAPS pour que les ingénieurs récupèrent le mot de passe de l'administrateur local quand ils exécutent l'outil" } }
    - { id: d, text: { en: "Deploy the check-in kiosks with Windows Autopilot self-deploying mode and a kiosk configuration profile", fr: "Déployer les bornes d'enregistrement avec le mode de déploiement automatique de Windows Autopilot et un profil de configuration de kiosque" } }
    - { id: e, text: { en: "Create an app protection policy for the diagnostic tool on the engineers' laptops", fr: "Créer une stratégie de protection des applications pour l'outil de diagnostic sur les ordinateurs portables des ingénieurs" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      Self-deploying mode is intended for kiosks and shared devices: a device with TPM 2.0 on Ethernet joins Microsoft Entra ID, enrolls in Intune and receives its policies and apps without user interaction, and a kiosk profile restricts it to the check-in app. Endpoint Privilege Management lets standard users run IT-approved files with elevated rights through elevation rules, so the engineers can leave the local Administrators group.
    fr: |-
      Le mode de déploiement automatique est destiné aux kiosques et aux appareils partagés : un appareil doté d'un TPM 2.0 et connecté par Ethernet rejoint Microsoft Entra ID, s'inscrit dans Intune et reçoit ses stratégies et ses applications sans interaction de l'utilisateur, et un profil de kiosque le limite à l'application d'enregistrement. Endpoint Privilege Management permet aux utilisateurs standard d'exécuter avec des droits élevés les fichiers approuvés par le service informatique, grâce à des règles d'élévation : les ingénieurs peuvent donc quitter le groupe Administrators local.
  options:
    a:
      en: |-
        User-driven mode requires a user to sign in with their credentials during provisioning, which the kiosk requirement rules out.
      fr: |-
        Le mode piloté par l'utilisateur exige qu'un utilisateur se connecte avec ses informations d'identification pendant le provisionnement, ce que l'exigence relative aux bornes exclut.
    c:
      en: |-
        Windows LAPS manages the password of the local administrator account; engineers who use it are still local administrators.
      fr: |-
        Windows LAPS gère le mot de passe du compte d'administrateur local ; les ingénieurs qui l'utilisent restent administrateurs locaux.
    e:
      en: |-
        App protection policies protect organization data inside managed apps; they don't grant elevated rights to a Windows executable.
      fr: |-
        Les stratégies de protection des applications protègent les données de l'organisation dans les applications gérées ; elles n'accordent pas de droits élevés à un exécutable Windows.
references:
  - title: Windows Autopilot self-deploying mode
    url: https://learn.microsoft.com/en-us/autopilot/self-deploying
  - title: Use Endpoint Privilege Management with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/epm-overview
