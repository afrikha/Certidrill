id: sc100-4b-layer-controls
objective: "4.2.8"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank publishes an online banking application through Azure Application Gateway in a hub-and-spoke network in Azure. The security architect wants each threat to be handled by the control designed for it.

    What should you recommend for each threat? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank publie une application de banque en ligne via Azure Application Gateway dans un réseau hub-and-spoke dans Azure. L'architecte sécurité veut que chaque menace soit traitée par le contrôle conçu pour elle.

    Que devez-vous recommander pour chaque menace ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Cross-site scripting payloads in HTTP requests to the application: [[xss]]

      A volumetric flood that targets the public IP address of the gateway: [[flood]]

      Traffic between spokes to IP addresses known to be malicious, on any protocol: [[ti]]
    fr: |
      Des charges utiles de scripting intersite dans les requêtes HTTP vers l'application : [[xss]]

      Une inondation volumétrique qui cible l'adresse IP publique de la passerelle : [[flood]]

      Du trafic entre spokes vers des adresses IP connues comme malveillantes, sur n'importe quel protocole : [[ti]]
  slots:
    - id: xss
      options:
        - { id: waf, text: "Azure Web Application Firewall" }
        - { id: ddos, text: "Azure DDoS Protection" }
        - { id: fw, text: { en: "Azure Firewall with threat intelligence-based filtering", fr: "Pare-feu Azure avec le filtrage basé sur le renseignement sur les menaces" } }
        - { id: nsg, text: { en: "Network security groups", fr: "Groupes de sécurité réseau" } }
    - id: flood
      options:
        - { id: waf, text: "Azure Web Application Firewall" }
        - { id: ddos, text: "Azure DDoS Protection" }
        - { id: fw, text: { en: "Azure Firewall with threat intelligence-based filtering", fr: "Pare-feu Azure avec le filtrage basé sur le renseignement sur les menaces" } }
        - { id: nsg, text: { en: "Network security groups", fr: "Groupes de sécurité réseau" } }
    - id: ti
      options:
        - { id: waf, text: "Azure Web Application Firewall" }
        - { id: ddos, text: "Azure DDoS Protection" }
        - { id: fw, text: { en: "Azure Firewall with threat intelligence-based filtering", fr: "Pare-feu Azure avec le filtrage basé sur le renseignement sur les menaces" } }
        - { id: nsg, text: { en: "Network security groups", fr: "Groupes de sécurité réseau" } }
answer:
  values: { xss: waf, flood: ddos, ti: fw }
explanation:
  correct:
    en: |
      Azure WAF inspects HTTP and HTTPS requests at layer 7 and blocks common exploits such as cross-site scripting. Volumetric attacks against public IP addresses are mitigated by Azure DDoS Protection, not by WAF rules. Azure Firewall in the hub filters traffic between spokes on all protocols and can alert on or deny traffic to known malicious IP addresses and domains with threat intelligence-based filtering.
    fr: |
      Azure WAF inspecte les requêtes HTTP et HTTPS à la couche 7 et bloque les attaques courantes comme le scripting intersite. Les attaques volumétriques contre les adresses IP publiques sont atténuées par Azure DDoS Protection, pas par les règles WAF. Pare-feu Azure dans le hub filtre le trafic entre spokes sur tous les protocoles et peut alerter sur le trafic vers des adresses IP et des domaines connus comme malveillants, ou le refuser, grâce au filtrage basé sur le renseignement sur les menaces.
  options:
    nsg:
      en: NSGs filter by IP address, port and protocol, but they don't inspect HTTP payloads, absorb floods or use threat intelligence.
      fr: Les NSG filtrent par adresse IP, port et protocole, mais ils n'inspectent pas les charges utiles HTTP, n'absorbent pas les inondations et n'utilisent pas le renseignement sur les menaces.
references:
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
