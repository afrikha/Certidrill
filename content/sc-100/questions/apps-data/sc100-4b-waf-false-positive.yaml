id: sc100-4b-waf-false-positive
objective: "4.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. publishes three websites, site1, site2 and site3, through one Azure Application Gateway WAF_v2. A single WAF policy that uses the OWASP CRS 3.2 managed rule set in Prevention mode is associated globally with the gateway.

    After go-live, the WAF blocks legitimate searches on site2: the request argument named query often contains SQL keywords, which match two SQL injection rules.

    You need to recommend a solution that meets the following requirements:

    - Legitimate searches on site2 must no longer be blocked.
    - All other request attributes of site2, and all requests to site1 and site3, must still be inspected by every rule.
    - The reduction of protection must be minimized.

    What should you recommend?
  fr: |
    Litware, Inc. publie trois sites web, site1, site2 et site3, via une seule passerelle Azure Application Gateway WAF_v2. Une seule stratégie WAF qui utilise l'ensemble de règles managé OWASP CRS 3.2 en mode Prévention est associée globalement à la passerelle.

    Après la mise en service, le WAF bloque des recherches légitimes sur site2 : l'argument de requête nommé query contient souvent des mots clés SQL, qui correspondent à deux règles d'injection SQL.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - Les recherches légitimes sur site2 ne doivent plus être bloquées.
    - Tous les autres attributs des requêtes de site2, et toutes les requêtes vers site1 et site3, doivent toujours être inspectés par toutes les règles.
    - La protection doit être réduite le moins possible.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Switch the global WAF policy to Detection mode.", fr: "Passer la stratégie WAF globale en mode Détection." } }
    - { id: b, text: { en: "Add a global exclusion for the query argument to the global WAF policy.", fr: "Ajouter une exclusion globale pour l'argument query à la stratégie WAF globale." } }
    - { id: c, text: { en: "Associate a per-site policy with site2 that excludes the query argument from the two matching rules.", fr: "Associer à site2 une stratégie par site qui exclut l'argument query des deux règles correspondantes." } }
    - { id: d, text: { en: "Disable the SQL injection rule group in a per-site policy associated with site2.", fr: "Désactiver le groupe de règles d'injection SQL dans une stratégie par site associée à site2." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A per-site policy applies only to the listener of site2, so site1 and site3 keep the global policy. A per-rule exclusion, supported with CRS 3.2 and later, removes only the query argument from the evaluation of the two rules that cause the false positives, while the rest of each request is still inspected. Microsoft recommends keeping exclusions as narrow as possible.
    fr: |
      Une stratégie par site ne s'applique qu'à l'écouteur de site2 : site1 et site3 conservent la stratégie globale. Une exclusion par règle, prise en charge à partir de CRS 3.2, retire uniquement l'argument query de l'évaluation des deux règles qui provoquent les faux positifs, tandis que le reste de chaque requête est toujours inspecté. Microsoft recommande de garder les exclusions aussi étroites que possible.
  options:
    a:
      en: Detection mode stops blocking every attack on the three websites; it only logs them.
      fr: Le mode Détection cesse de bloquer toutes les attaques sur les trois sites web ; il se contente de les journaliser.
    b:
      en: A global exclusion in the global policy removes the query argument from every rule on all three websites.
      fr: Une exclusion globale dans la stratégie globale retire l'argument query de toutes les règles sur les trois sites web.
    d:
      en: Disabling the whole rule group removes SQL injection protection from every attribute of site2's requests.
      fr: Désactiver tout le groupe de règles supprime la protection contre l'injection SQL pour tous les attributs des requêtes de site2.
references:
  - title: Web Application Firewall exclusion lists
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-waf-configuration
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
