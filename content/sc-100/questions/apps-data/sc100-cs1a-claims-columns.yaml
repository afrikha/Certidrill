id: sc100-cs1a-claims-columns
objective: "4.3.5"
type: multi
caseStudy: sc100-cs1a-humongous
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution for sqldb-claims that meets the data requirements.

    Which two features should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution pour sqldb-claims qui respecte les exigences relatives aux données.

    Quelles sont les deux fonctionnalités que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Dynamic data masking on the NationalId and BankIban columns", fr: "Le masquage dynamique des données sur les colonnes NationalId et BankIban" } }
    - { id: b, text: { en: "Always Encrypted on the NationalId and BankIban columns, with the column master key in Azure Key Vault", fr: "Always Encrypted sur les colonnes NationalId et BankIban, avec la clé principale de colonne dans Azure Key Vault" } }
    - { id: c, text: { en: "Transparent data encryption with a customer-managed key", fr: "Le chiffrement transparent des données avec une clé gérée par le client" } }
    - { id: d, text: { en: "A ledger table for the Policyholders data", fr: "Une table de registre pour les données Policyholders" } }
    - { id: e, text: { en: "Data discovery and classification labels on the NationalId and BankIban columns", fr: "Des étiquettes de découverte et classification des données sur les colonnes NationalId et BankIban" } }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: |-
      Always Encrypted encrypts the columns in the client driver of app-claims, and the database engine never sees the keys or the plaintext values, which separates the data owners from the database operators and cloud administrators. Transparent data encryption with a customer-managed key protects the database encryption key with a key that Humongous creates and rotates; the new backups are encrypted with the same protector, and revoking access to the key makes the database inaccessible.
    fr: |-
      Always Encrypted chiffre les colonnes dans le pilote client de app-claims, et le moteur de base de données ne voit jamais les clés ni les valeurs en clair, ce qui sépare les propriétaires des données des opérateurs de bases de données et des administrateurs du cloud. Le chiffrement transparent des données avec une clé gérée par le client protège la clé de chiffrement de la base de données avec une clé que Humongous crée et renouvelle ; les nouvelles sauvegardes sont chiffrées avec le même protecteur, et révoquer l'accès à la clé rend la base de données inaccessible.
  options:
    a:
      en: |-
        Dynamic data masking only hides values in query results for users without the UNMASK permission; the data is stored in plaintext and administrators can see it.
      fr: |-
        Le masquage dynamique des données masque seulement les valeurs dans les résultats des requêtes pour les utilisateurs sans l'autorisation UNMASK ; les données sont stockées en clair et les administrateurs peuvent les voir.
    d:
      en: |-
        A ledger table makes tampering detectable; it does not hide the values from administrators.
      fr: |-
        Une table de registre permet de détecter les falsifications ; elle ne masque pas les valeurs aux administrateurs.
    e:
      en: |-
        Classification labels identify and report sensitive columns; they do not encrypt or hide the values.
      fr: |-
        Les étiquettes de classification identifient les colonnes sensibles et en rendent compte ; elles ne chiffrent ni ne masquent les valeurs.
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
  - title: Azure SQL Transparent Data Encryption with customer-managed key
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
