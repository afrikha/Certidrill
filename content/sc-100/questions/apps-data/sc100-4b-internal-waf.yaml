id: sc100-4b-internal-waf
objective: "4.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation hosts an internal HR web application on virtual machines in an Azure virtual network in West Europe. Employees reach the application only from the corporate network over ExpressRoute, and the application must never be exposed to the internet.

    You need to recommend a solution that protects the application against SQL injection and cross-site scripting by using managed rule sets.

    What should you recommend?
  fr: |
    Adatum Corporation héberge une application web RH interne sur des machines virtuelles dans un réseau virtuel Azure en West Europe. Les employés n'accèdent à l'application que depuis le réseau de l'entreprise via ExpressRoute, et l'application ne doit jamais être exposée à Internet.

    Vous devez recommander une solution qui protège l'application contre l'injection SQL et le scripting intersite à l'aide d'ensembles de règles managés.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Application Gateway WAF_v2 with a private frontend IP address", fr: "Azure Application Gateway WAF_v2 avec une adresse IP frontale privée" } }
    - { id: b, text: { en: "Azure Firewall Premium with intrusion detection and prevention", fr: "Pare-feu Azure Premium avec la détection et la prévention des intrusions" } }
    - { id: c, text: { en: "Azure Front Door Standard with a WAF policy", fr: "Azure Front Door Standard avec une stratégie WAF" } }
    - { id: d, text: { en: "Azure Front Door Premium with a WAF policy", fr: "Azure Front Door Premium avec une stratégie WAF" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      WAF on Application Gateway is a regional web application firewall deployed in the virtual network. With WAF_v2 and a private frontend IP address, internal users reach the application through the gateway, which applies managed OWASP rule sets against SQL injection and cross-site scripting without exposing the application to the internet.
    fr: |
      Le WAF sur Application Gateway est un pare-feu d'applications web régional déployé dans le réseau virtuel. Avec WAF_v2 et une adresse IP frontale privée, les utilisateurs internes atteignent l'application via la passerelle, qui applique des ensembles de règles OWASP managés contre l'injection SQL et le scripting intersite sans exposer l'application à Internet.
  options:
    d:
      en: Front Door is a global entry point at Microsoft's internet edge, which doesn't fit an application that must stay internal.
      fr: Front Door est un point d'entrée mondial situé en périphérie Internet de Microsoft, ce qui ne convient pas à une application qui doit rester interne.
    b:
      en: Azure Firewall is a network firewall; it doesn't provide the managed web application rule sets of a WAF.
      fr: Pare-feu Azure est un pare-feu réseau ; il ne fournit pas les ensembles de règles managés d'applications web d'un WAF.
    c:
      en: Front Door is internet-facing, and the Standard tier supports only custom rules, not managed rule sets.
      fr: Front Door est exposé à Internet, et le niveau Standard ne prend en charge que les règles personnalisées, pas les ensembles de règles managés.
references:
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
