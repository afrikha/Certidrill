id: sc100-4c-worm-records
objective: "4.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank must keep trade confirmations in Azure Blob Storage for seven years to meet SEC Rule 17a-4(f). During that period, no user, including storage account administrators, can modify or delete the confirmations, and the retention period must never be shortened.

    What should you recommend for the container that stores the confirmations?
  fr: |
    Woodgrove Bank doit conserver les confirmations d'opérations dans Stockage Blob Azure pendant sept ans pour respecter la règle SEC 17a-4(f). Pendant cette période, aucun utilisateur, y compris les administrateurs du compte de stockage, ne peut modifier ni supprimer les confirmations, et la période de rétention ne doit jamais être raccourcie.

    Que devez-vous recommander pour le conteneur qui stocke les confirmations ?
body:
  options:
    - { id: a, text: { en: "A locked time-based retention policy of seven years", fr: "Une stratégie de rétention limitée dans le temps de sept ans, verrouillée" } }
    - { id: b, text: { en: "An unlocked time-based retention policy of seven years", fr: "Une stratégie de rétention limitée dans le temps de sept ans, non verrouillée" } }
    - { id: c, text: { en: "Blob soft delete with a retention period of 365 days", fr: "La suppression réversible des objets blob avec une période de rétention de 365 jours" } }
    - { id: d, text: { en: "A CanNotDelete resource lock on the storage account", fr: "Un verrou CanNotDelete sur le compte de stockage" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Immutable storage keeps blobs in a WORM state that no user can modify or delete, not even account administrators. A time-based retention policy must be locked to be compliant with SEC 17a-4(f); a locked policy can be extended but never shortened or deleted.
    fr: |-
      Le stockage immuable maintient les objets blob dans un état WORM qu'aucun utilisateur ne peut modifier ni supprimer, pas même les administrateurs du compte. Une stratégie de rétention limitée dans le temps doit être verrouillée pour être conforme à SEC 17a-4(f) ; une stratégie verrouillée peut être prolongée, mais jamais raccourcie ni supprimée.
  options:
    b:
      en: |-
        An unlocked policy is meant for testing; it can be shortened or deleted and isn't compliant.
      fr: |-
        Une stratégie non verrouillée est destinée aux tests ; elle peut être raccourcie ou supprimée et n'est pas conforme.
    c:
      en: |-
        Soft delete lets you recover deleted blobs for a while, but it doesn't prevent modification, and administrators can disable it.
      fr: |-
        La suppression réversible permet de récupérer les objets blob supprimés pendant un temps, mais n'empêche pas la modification, et les administrateurs peuvent la désactiver.
    d:
      en: |-
        A resource lock protects the account resource from deletion, not the blobs, and an Owner can remove it.
      fr: |-
        Un verrou de ressource protège la ressource du compte contre la suppression, pas les objets blob, et un Owner peut le retirer.
references:
  - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
