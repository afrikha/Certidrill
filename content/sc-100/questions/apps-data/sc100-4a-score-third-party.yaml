id: sc100-4a-score-third-party
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Secure Score to report the security posture of its Microsoft 365 tenant. All administrators sign in through a non-Microsoft identity provider that is federated with Microsoft Entra ID and that enforces multifactor authentication (MFA) for every administrative sign-in.

    Microsoft Secure Score shows the recommended action **Require MFA for administrative roles** with the status **To address**. The security team doesn't want to deploy a second MFA control for administrators.

    You need to recommend how to handle the action. The score must reflect the protection that is already in place.

    What should you recommend?
  fr: |
    Fabrikam, Inc. utilise le Niveau de sécurité Microsoft pour rendre compte de la posture de sécurité de son locataire Microsoft 365. Tous les administrateurs se connectent par un fournisseur d'identité non Microsoft, fédéré avec Microsoft Entra ID, qui impose l'authentification multifacteur (MFA) à chaque connexion d'administration.

    Le Niveau de sécurité Microsoft affiche l'action recommandée **Require MFA for administrative roles** avec le statut **To address**. L'équipe de sécurité ne veut pas déployer un second contrôle MFA pour les administrateurs.

    Vous devez recommander comment traiter l'action. Le score doit refléter la protection déjà en place.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Set the status of the action to Risk accepted.", fr: "Définir le statut de l'action sur Risk accepted." } }
    - { id: b, text: { en: "Set the status of the action to Resolved through third party.", fr: "Définir le statut de l'action sur Resolved through third party." } }
    - { id: c, text: { en: "Set the status of the action to Planned.", fr: "Définir le statut de l'action sur Planned." } }
    - { id: d, text: { en: "Turn on security defaults in Microsoft Entra ID.", fr: "Activer les paramètres de sécurité par défaut dans Microsoft Entra ID." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When a non-Microsoft application or service already addresses a recommended action, you set the status to Resolved through third party and the organization gains the points the action is worth. Microsoft has no visibility into that control, so the team must change the status again if the third-party protection stops.
    fr: |-
      Quand une application ou un service non Microsoft traite déjà une action recommandée, vous définissez le statut sur Resolved through third party et l'organisation obtient les points que vaut l'action. Microsoft n'a aucune visibilité sur ce contrôle : l'équipe doit donc changer de nouveau le statut si la protection tierce cesse.
  options:
    a:
      en: |-
        Risk accepted records a decision not to implement the action, and it awards no points, so the score wouldn't reflect the MFA that is enforced.
      fr: |-
        Risk accepted enregistre la décision de ne pas implémenter l'action et n'accorde aucun point : le score ne refléterait pas la MFA imposée.
    c:
      en: |-
        Planned indicates that the action will be completed later; it doesn't award the points now and only feeds the projected planned score.
      fr: |-
        Planned indique que l'action sera réalisée plus tard ; ce statut n'accorde pas les points maintenant et n'alimente que le score planifié projeté.
    d:
      en: |-
        Security defaults would add a second, Microsoft-enforced MFA control for administrators, which the security team doesn't want.
      fr: |-
        Les paramètres de sécurité par défaut ajouteraient un second contrôle MFA, appliqué par Microsoft, pour les administrateurs, ce que l'équipe de sécurité ne veut pas.
references:
  - title: Assess your security posture through Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-improvement-actions
