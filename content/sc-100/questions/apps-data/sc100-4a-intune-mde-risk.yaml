id: sc100-4a-intune-mde-risk
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. manages 6,000 Microsoft Entra joined Windows 11 devices with Microsoft Intune. Every device is onboarded to Microsoft Defender for Endpoint. Intune compliance policies already check BitLocker and the minimum OS version, and a Conditional Access policy requires a compliant device for Microsoft 365 apps.

    The security team requires that a device on which Defender for Endpoint detects high-risk threat activity loses access to Microsoft 365 data automatically, until analysts finish the investigation in Microsoft Defender XDR.

    What should you include in the recommendation?
  fr: |
    Contoso, Ltd. gère 6 000 appareils Windows 11 joints à Microsoft Entra avec Microsoft Intune. Chaque appareil est intégré à Microsoft Defender for Endpoint. Les stratégies de conformité Intune vérifient déjà BitLocker et la version minimale du système d'exploitation, et une stratégie d'accès conditionnel exige un appareil conforme pour les applications Microsoft 365.

    L'équipe de sécurité exige qu'un appareil sur lequel Defender for Endpoint détecte une activité malveillante à risque élevé perde automatiquement l'accès aux données Microsoft 365, jusqu'à ce que les analystes terminent l'investigation dans Microsoft Defender XDR.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "A Microsoft Entra ID Protection user risk policy that blocks access for high-risk users", fr: "Une stratégie de risque utilisateur Microsoft Entra ID Protection qui bloque l'accès des utilisateurs à risque élevé" } }
    - { id: b, text: { en: "A Conditional Access filter for devices that excludes devices tagged as high risk", fr: "Un filtre d'appareils d'accès conditionnel qui exclut les appareils marqués comme à risque élevé" } }
    - { id: c, text: { en: "An Intune security baseline for Defender for Endpoint assigned to all devices", fr: "Une base de référence de sécurité Intune pour Defender for Endpoint attribuée à tous les appareils" } }
    - { id: d, text: { en: "The Defender for Endpoint connector in Intune and a device risk level setting in the compliance policies", fr: "Le connecteur Defender for Endpoint dans Intune et un paramètre de niveau de risque de l'appareil dans les stratégies de conformité" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      After a service-to-service connection between Intune and Defender for Endpoint, a compliance policy can set the acceptable device risk level. When Defender for Endpoint classifies a device as high risk, Intune marks it noncompliant and the existing Conditional Access policy blocks it while the investigation runs.
    fr: |-
      Après une connexion de service à service entre Intune et Defender for Endpoint, une stratégie de conformité peut définir le niveau de risque acceptable de l'appareil. Quand Defender for Endpoint classe un appareil à risque élevé, Intune le marque comme non conforme et la stratégie d'accès conditionnel existante le bloque pendant l'investigation.
  options:
    a:
      en: |-
        A user risk policy reacts to identity risk detected by ID Protection, not to threat activity on a device.
      fr: |-
        Une stratégie de risque utilisateur réagit au risque d'identité détecté par ID Protection, pas à une activité malveillante sur un appareil.
    b:
      en: |-
        Device filters use static device properties; nothing in this design tags devices automatically with the Defender for Endpoint risk.
      fr: |-
        Les filtres d'appareils utilisent des propriétés statiques de l'appareil ; rien dans cette conception n'étiquette automatiquement les appareils avec le risque Defender for Endpoint.
    c:
      en: |-
        A security baseline applies recommended settings; it doesn't change a device's access based on detected threats.
      fr: |-
        Une base de référence de sécurité applique des paramètres recommandés ; elle ne modifie pas l'accès d'un appareil en fonction des menaces détectées.
references:
  - title: Integrate Microsoft Defender for Endpoint with Intune for Device Compliance
    url: https://learn.microsoft.com/en-us/intune/intune-service/protect/advanced-threat-protection
