# SC-100 — Microsoft Cybersecurity Architect (Microsoft Certified: Cybersecurity Architect Expert)
# Source: official study guide, "Skills measured as of October 21, 2026" (en-us page, checked on 2026-11-16).
# The fr-fr page still showed "Compétences mesurées le 28 juillet 2026" on that day (same 14 groups and
# 81 bullets): French titles come from it and must be re-synced when Microsoft updates the localized page.
# Real exam: 100 minutes (Microsoft's rule for associate and expert exams without labs; the exam page does
# not state the time), passing score 700/1000; Microsoft does not publish the number of questions (40 to 60
# on most exams) nor the list of exams with case studies or labs. Microsoft Learn is accessible during the exam.
# Design exam: no command, no code; fewer ordering and hot-area questions than AZ-104.
# Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
