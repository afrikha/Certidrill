chapter: 34-network-sse
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-34-01
    objective: "3.4.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has 3,000 users licensed for Microsoft 365 E3, which includes Microsoft Entra ID P1. No other Microsoft Entra license is assigned.

        Northwind wants 400 engineers to reach RDP, SSH and SMB servers in its datacenter through Global Secure Access instead of the VPN, with a separate application and Conditional Access policy for each group of servers.

        Which license should you recommend for each engineer? The solution must minimize costs.
      fr: |
        Northwind Traders compte 3 000 utilisateurs disposant de licences Microsoft 365 E3, qui incluent Microsoft Entra ID P1. Aucune autre licence Microsoft Entra n'est attribuée.

        Northwind veut que 400 ingénieurs atteignent des serveurs RDP, SSH et SMB de son centre de données via Global Secure Access au lieu du VPN, avec une application et une stratégie d'accès conditionnel distinctes pour chaque groupe de serveurs.

        Quelle licence devez-vous recommander pour chaque ingénieur ? La solution doit réduire les coûts au minimum.
    body:
      options:
        - { id: a, text: { en: "Microsoft Entra Internet Access", fr: "Microsoft Entra Internet Access" } }
        - { id: b, text: { en: "Microsoft Entra ID P2", fr: "Microsoft Entra ID P2" } }
        - { id: c, text: { en: "Microsoft Entra Private Access", fr: "Microsoft Entra Private Access" } }
        - { id: d, text: { en: "No additional license", fr: "Aucune licence supplémentaire" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Per-app access to private TCP and UDP resources is a Microsoft Entra Private Access capability, licensed standalone or in Microsoft Entra Suite. Private Access also requires Microsoft Entra ID P1 or P2, which the engineers already have through Microsoft 365 E3, so the standalone Private Access license is the least expensive addition.
        fr: |
          L'accès par application aux ressources privées TCP et UDP est une fonctionnalité d'Accès privé Microsoft Entra, sous licence autonome ou dans Microsoft Entra Suite. Accès privé exige aussi Microsoft Entra ID P1 ou P2, que les ingénieurs ont déjà avec Microsoft 365 E3 : la licence autonome Private Access est donc l'ajout le moins coûteux.
      options:
        a: { en: "Internet Access covers internet and SaaS traffic, not access to private applications in the datacenter.", fr: "Accès Internet couvre le trafic Internet et SaaS, pas l'accès aux applications privées du centre de données." }
        b: { en: "Entra ID P2 adds identity protection and governance features, but it doesn't include Private Access.", fr: "Entra ID P2 ajoute des fonctionnalités de protection et de gouvernance des identités, mais n'inclut pas Accès privé." }
        d: { en: "Entra ID P1 includes only the Microsoft traffic profile (Internet Access for Microsoft services), not Private Access.", fr: "Entra ID P1 n'inclut que le profil de trafic Microsoft (Accès Internet pour les services Microsoft), pas Accès privé." }
    references:
      - title: What is Global Secure Access?
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-34-02
    objective: "3.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. runs a three-tier application in one Azure virtual network. The web, application and database tiers run on virtual machines that are added and removed often, so their IP addresses change.

        The network design must allow only the application tier to reach the database tier on TCP 1433, without anyone maintaining lists of IP addresses.

        What should you recommend?
      fr: |
        Contoso, Ltd. exécute une application à trois niveaux dans un réseau virtuel Azure. Les niveaux web, application et base de données s'exécutent sur des machines virtuelles souvent ajoutées et supprimées : leurs adresses IP changent.

        La conception réseau doit n'autoriser que le niveau application à atteindre le niveau base de données sur TCP 1433, sans que personne ne tienne à jour de listes d'adresses IP.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "NSG rules that use the VirtualNetwork service tag as source and destination", fr: "Des règles NSG qui utilisent l'étiquette de service VirtualNetwork comme source et destination" } }
        - { id: b, text: { en: "NSG rules that use application security groups as source and destination", fr: "Des règles NSG qui utilisent des groupes de sécurité d'application comme source et destination" } }
        - { id: c, text: { en: "Azure Firewall network rules that use IP groups as source and destination", fr: "Des règles de réseau du Pare-feu Azure qui utilisent des groupes IP comme source et destination" } }
        - { id: d, text: { en: "User-defined routes that send database traffic to a network virtual appliance", fr: "Des itinéraires définis par l'utilisateur qui envoient le trafic de base de données vers une appliance virtuelle réseau" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Application security groups group the network interfaces of VMs by role, and an NSG rule can reference them as source and destination. A rule from the application group to the database group on TCP 1433 then follows the VMs as they are added or removed, with no IP address to maintain.
        fr: |
          Les groupes de sécurité d'application regroupent les cartes réseau des machines virtuelles par rôle, et une règle NSG peut les référencer comme source et destination. Une règle du groupe application vers le groupe base de données sur TCP 1433 suit alors les machines virtuelles ajoutées ou supprimées, sans adresse IP à tenir à jour.
      options:
        a: { en: "VirtualNetwork covers the whole virtual network and connected ranges, so it can't tell the application tier from the web tier.", fr: "VirtualNetwork couvre tout le réseau virtuel et les plages connectées : il ne distingue pas le niveau application du niveau web." }
        c: { en: "IP groups are lists of IP addresses and ranges, which someone has to keep up to date as VMs change.", fr: "Les groupes IP sont des listes d'adresses et de plages IP, que quelqu'un doit tenir à jour quand les machines virtuelles changent." }
        d: { en: "Routes choose the next hop of traffic; they don't decide which source may reach the database tier.", fr: "Les itinéraires choisissent le tronçon suivant du trafic ; ils ne décident pas quelle source peut atteindre le niveau base de données." }
    references:
      - title: Azure Application Security Groups Overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-34-03
    objective: "3.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. uses Microsoft Entra Internet Access. A security profile that contains web content filtering policies is linked by a Conditional Access policy to all employees.

        After a phishing campaign, the security operations team requires that employees be blocked from domains and URLs tied to active phishing, malware distribution and command-and-control servers. The indicators must come from Microsoft and third-party feeds and stay current without the team maintaining any list.

        What should you add to the security profile?
      fr: |
        Fabrikam, Inc. utilise Accès Internet Microsoft Entra. Un profil de sécurité qui contient des stratégies de filtrage du contenu web est lié par une stratégie d'accès conditionnel à tous les employés.

        Après une campagne d'hameçonnage, l'équipe des opérations de sécurité exige que les employés soient bloqués vers les domaines et les URL liés à l'hameçonnage actif, à la distribution de logiciels malveillants et aux serveurs de commande et de contrôle. Les indicateurs doivent provenir de flux de Microsoft et de tiers et rester à jour sans que l'équipe tienne de liste.

        Que devez-vous ajouter au profil de sécurité ?
    body:
      options:
        - { id: a, text: { en: "A TLS inspection policy that decrypts all web categories", fr: "Une stratégie d'inspection TLS qui déchiffre toutes les catégories web" } }
        - { id: b, text: { en: "A filtering policy with FQDN block rules updated by the team", fr: "Une stratégie de filtrage avec des règles de blocage FQDN mises à jour par l'équipe" } }
        - { id: c, text: { en: "A threat intelligence policy with its default blocking rule", fr: "Une stratégie de renseignement sur les menaces avec sa règle de blocage par défaut" } }
        - { id: d, text: { en: "A tenant restrictions v2 policy that blocks unknown tenants", fr: "Une stratégie de restrictions de locataire v2 qui bloque les locataires inconnus" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A threat intelligence policy blocks traffic to domain and URL indicators from Microsoft and third-party feeds, such as active phishing, malware distribution and command-and-control infrastructure, with no list to maintain. It is linked to a security profile, here the one already delivered to employees by Conditional Access.
        fr: |
          Une stratégie de renseignement sur les menaces bloque le trafic vers les indicateurs de domaines et d'URL des flux de Microsoft et de tiers, comme l'hameçonnage actif, la distribution de logiciels malveillants et les infrastructures de commande et de contrôle, sans liste à tenir. Elle est liée à un profil de sécurité, ici celui que l'accès conditionnel applique déjà aux employés.
      options:
        a: { en: "TLS inspection decrypts HTTPS so that other controls can see full URLs; it blocks nothing by itself.", fr: "L'inspection TLS déchiffre le HTTPS pour que les autres contrôles voient les URL complètes ; elle ne bloque rien à elle seule." }
        b: { en: "FQDN rules work, but the team would have to maintain the list, which the requirement excludes.", fr: "Les règles FQDN fonctionnent, mais l'équipe devrait tenir la liste à jour, ce que l'exigence exclut." }
        d: { en: "Tenant restrictions control which Microsoft Entra tenants users can sign in to, not malicious websites.", fr: "Les restrictions de locataire contrôlent les locataires Microsoft Entra auxquels les utilisateurs peuvent se connecter, pas les sites web malveillants." }
    references:
      - title: How to configure Global Secure Access threat intelligence
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-threat-intelligence

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-34-04
    objective: "3.4.3"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Contoso, Ltd. configures tenant restrictions v2 in its tenant. The default policy blocks all external tenants, and a partner policy is created for Fabrikam, Inc. Universal tenant restrictions are turned on, and every Contoso device runs the Global Secure Access client with the Microsoft traffic forwarding profile, in the office and at home.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. configure les restrictions de locataire v2 dans son locataire. La stratégie par défaut bloque tous les locataires externes, et une stratégie de partenaire est créée pour Fabrikam, Inc. Les restrictions de locataire universelles sont activées, et chaque appareil de Contoso exécute le client Global Secure Access avec le profil de transfert du trafic Microsoft, au bureau comme à domicile.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A Fabrikam consultant who is a guest in Contoso's tenant can use the Fabrikam account on a Contoso device to open Contoso's SharePoint sites.", fr: "Un consultant de Fabrikam invité dans le locataire de Contoso peut utiliser son compte Fabrikam sur un appareil de Contoso pour ouvrir les sites SharePoint de Contoso." } }
        - { id: b, text: { en: "An administrator who holds only the Global Secure Access Administrator role can turn on universal tenant restrictions.", fr: "Un administrateur qui détient uniquement le rôle Global Secure Access Administrator peut activer les restrictions de locataire universelles." } }
        - { id: c, text: { en: "The Fabrikam partner policy can allow only the accounts of selected Fabrikam users and groups, instead of every Fabrikam account.", fr: "La stratégie de partenaire de Fabrikam peut n'autoriser que les comptes d'utilisateurs et de groupes choisis de Fabrikam, au lieu de tous les comptes de Fabrikam." } }
        - { id: d, text: { en: "On a home network, the policy is enforced only if the home router injects the tenant restrictions header into sign-in requests.", fr: "Sur un réseau domestique, la stratégie n'est appliquée que si le routeur domestique injecte l'en-tête des restrictions de locataire dans les demandes de connexion." } }
    answer: { optionIds: [ a, c ] }
    explanation:
      correct:
        en: |
          Tenant restrictions aren't enforced when a user, or a guest user, accesses resources in the tenant where the policy is configured, so the consultant reaches Contoso's sites. Unlike version 1, tenant restrictions v2 offers tenant, user, group and application granularity, so the partner policy can allow only selected Fabrikam users and groups.
        fr: |
          Les restrictions de locataire ne sont pas appliquées quand un utilisateur, ou un utilisateur invité, accède aux ressources du locataire où la stratégie est configurée : le consultant atteint donc les sites de Contoso. Contrairement à la version 1, les restrictions de locataire v2 offrent une granularité par locataire, utilisateur, groupe et application : la stratégie de partenaire peut donc n'autoriser que des utilisateurs et groupes choisis de Fabrikam.
      options:
        b: { en: "Turning on enforcement requires both the Global Secure Access Administrator and Security Administrator roles.", fr: "L'activation de l'application exige à la fois les rôles Global Secure Access Administrator et Security Administrator." }
        d: { en: "Universal tenant restrictions apply the policy on any device that runs the client, without steering traffic through a proxy that inserts a header.", fr: "Les restrictions de locataire universelles appliquent la stratégie sur tout appareil qui exécute le client, sans faire passer le trafic par un proxy qui insère un en-tête." }
    references:
      - title: Turn on Universal Tenant Restrictions
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-universal-tenant-restrictions
      - title: Set up tenant restrictions v2
        url: https://learn.microsoft.com/en-us/entra/external-id/tenant-restrictions-v2

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-34-05
    objective: "3.4.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys reviews a proposed design for a new web workload in Azure:

        - A new virtual network will be created in the Azure portal in December 2026. Its subnets keep the portal's default settings.
        - A storage account gets a private endpoint in the virtual network. Its public network access setting isn't changed.
        - The public IP address of the Application Gateway is protected by Azure DDoS Network Protection.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys examine une conception proposée pour une nouvelle charge de travail web dans Azure :

        - Un nouveau réseau virtuel sera créé dans le portail Azure en décembre 2026. Ses sous-réseaux conservent les paramètres par défaut du portail.
        - Un compte de stockage reçoit un point de terminaison privé dans le réseau virtuel. Son paramètre d'accès au réseau public n'est pas modifié.
        - L'adresse IP publique de l'Application Gateway est protégée par Azure DDoS Network Protection.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: VMs without a public IP address in the new subnets can't reach the internet until an explicit outbound method, such as a NAT gateway, is configured.
            fr: Les machines virtuelles sans adresse IP publique des nouveaux sous-réseaux ne peuvent pas atteindre Internet tant qu'une méthode sortante explicite, comme une passerelle NAT, n'est pas configurée.
        - id: s2
          text:
            en: The private endpoint prevents clients on the internet from reaching the storage account through its public endpoint.
            fr: Le point de terminaison privé empêche les clients d'Internet d'atteindre le compte de stockage par son point de terminaison public.
        - id: s3
          text:
            en: DDoS Network Protection mitigates an HTTP request flood that targets the login page of the web application.
            fr: DDoS Network Protection atténue une inondation de requêtes HTTP qui cible la page de connexion de l'application web.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          The Azure portal already creates private subnets, and new virtual networks created with API versions released after March 31, 2026 default to them: VMs there get no default outbound access and need a NAT gateway, a public IP, an outbound rule or a firewall route. A private endpoint gives the service a private IP but doesn't restrict public network access, which must be disabled separately. DDoS Protection works at layers 3 and 4; a layer 7 HTTP flood needs a WAF.
        fr: |
          Le portail Azure crée déjà des sous-réseaux privés, et les nouveaux réseaux virtuels créés avec les versions d'API publiées après le 31 mars 2026 en utilisent par défaut : les machines virtuelles n'y ont pas d'accès sortant par défaut et ont besoin d'une passerelle NAT, d'une adresse IP publique, d'une règle de trafic sortant ou d'un itinéraire vers un pare-feu. Un point de terminaison privé donne au service une adresse IP privée mais ne restreint pas l'accès au réseau public, qui doit être désactivé séparément. DDoS Protection agit aux couches 3 et 4 : une inondation HTTP de couche 7 exige un WAF.
    references:
      - title: Default outbound access in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access
      - title: Azure DDoS Protection Overview
        url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-34-06
    objective: "3.4.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. replaced its VPN with Microsoft Entra Private Access. A Quick Access app that publishes 10.20.0.0/16 on all ports is assigned to the All-Staff group.

        Last week, the security team created a Global Secure Access app named **Payroll** for the segment 10.20.5.10 on TCP 443. The team assigned the **Payroll-Users** group to the app and targeted it with a Conditional Access policy that requires phishing-resistant MFA. Since then, members of the **Auditors** group, who belong to All-Staff but not to Payroll-Users, can no longer reach the payroll server.

        Auditors must reach the payroll server again, under the same Conditional Access requirements as Payroll-Users. Other All-Staff members must not reach it. The solution must minimize administrative effort.

        What should you recommend?
      fr: |
        Litware, Inc. a remplacé son VPN par Accès privé Microsoft Entra. Une application Quick Access qui publie 10.20.0.0/16 sur tous les ports est attribuée au groupe All-Staff.

        La semaine dernière, l'équipe de sécurité a créé une application Global Secure Access nommée **Payroll** pour le segment 10.20.5.10 sur TCP 443. L'équipe a attribué le groupe **Payroll-Users** à l'application et l'a ciblée avec une stratégie d'accès conditionnel qui exige une MFA résistante à l'hameçonnage. Depuis, les membres du groupe **Auditors**, qui appartiennent à All-Staff mais pas à Payroll-Users, ne peuvent plus atteindre le serveur de paie.

        Les auditeurs doivent de nouveau atteindre le serveur de paie, avec les mêmes exigences d'accès conditionnel que Payroll-Users. Les autres membres d'All-Staff ne doivent pas l'atteindre. La solution doit réduire l'effort d'administration au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Add the Auditors group as a member of the Payroll-Users group", fr: "Ajouter le groupe Auditors comme membre du groupe Payroll-Users" } }
        - { id: b, text: { en: "Assign the Auditors group directly to the Payroll app", fr: "Attribuer directement le groupe Auditors à l'application Payroll" } }
        - { id: c, text: { en: "Add 10.20.5.10 on TCP 443 to Quick Access as its own segment", fr: "Ajouter 10.20.5.10 sur TCP 443 à Quick Access comme segment distinct" } }
        - { id: d, text: { en: "Create a second app with the same segment for the Auditors group", fr: "Créer une seconde application avec le même segment pour le groupe Auditors" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A segment defined in a Global Secure Access app takes priority over an overlapping Quick Access segment, and Quick Access no longer processes that traffic for anyone. Access assignments aren't carried over from Quick Access, so the auditors lost access. Assigning the Auditors group directly to Payroll restores it, and the app's Conditional Access policy then applies to them too.
        fr: |
          Un segment défini dans une application Global Secure Access a priorité sur un segment Quick Access qui le chevauche, et Quick Access ne traite plus ce trafic pour personne. Les attributions d'accès ne sont pas reprises de Quick Access : les auditeurs ont donc perdu l'accès. Attribuer directement le groupe Auditors à Payroll le rétablit, et la stratégie d'accès conditionnel de l'application s'applique alors aussi à eux.
      options:
        a: { en: "Nested groups aren't supported for Private Access apps: members of a group nested in Payroll-Users don't get access.", fr: "Les groupes imbriqués ne sont pas pris en charge pour les applications d'Accès privé : les membres d'un groupe imbriqué dans Payroll-Users n'obtiennent pas l'accès." }
        c: { en: "The Payroll app keeps priority over any Quick Access segment for this destination, so the traffic still isn't handled by Quick Access.", fr: "L'application Payroll garde la priorité sur tout segment Quick Access pour cette destination : le trafic n'est toujours pas pris en charge par Quick Access." }
        d: { en: "Segments can't overlap between Private Access apps; only overlaps with Quick Access are allowed.", fr: "Les segments ne peuvent pas se chevaucher entre applications d'Accès privé ; seuls les chevauchements avec Quick Access sont autorisés." }
    references:
      - title: How to configure per-app access using Global Secure Access applications
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-per-app-access

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-34-07
    objective: "3.4.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum Corporation asks you to review three findings of its Azure network security assessment:

        - Spoke virtual networks and branch offices are connected to a Virtual WAN secured hub that contains Azure Firewall, but traffic between spokes and from branches to spokes doesn't pass through the firewall.
        - A standalone virtual network created in 2026 hosts build servers that must download packages from the internet through a fixed set of public IP addresses. No connection from the internet may reach them.
        - A public web app behind Application Gateway already has DDoS Network Protection, but bots now flood its login page with HTTP requests.

        You need to recommend a control for each finding.

        Which control should you recommend for each finding? To answer, drag the appropriate controls to the correct findings. Each control may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation vous demande d'examiner trois constats de son évaluation de la sécurité réseau Azure :

        - Les réseaux virtuels spokes et les succursales sont connectés à un hub virtuel sécurisé Virtual WAN qui contient le Pare-feu Azure, mais le trafic entre spokes et des succursales vers les spokes ne passe pas par le pare-feu.
        - Un réseau virtuel autonome créé en 2026 héberge des serveurs de build qui doivent télécharger des packages sur Internet par un ensemble fixe d'adresses IP publiques. Aucune connexion depuis Internet ne doit les atteindre.
        - Une application web publique derrière Application Gateway dispose déjà de DDoS Network Protection, mais des bots inondent désormais sa page de connexion de requêtes HTTP.

        Vous devez recommander un contrôle pour chaque constat.

        Quel contrôle devez-vous recommander pour chaque constat ? Pour répondre, faites glisser les contrôles appropriés vers les constats correspondants. Chaque contrôle peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: intent, text: { en: "Routing intent with a private traffic routing policy", fr: "Intention de routage avec une stratégie de routage du trafic privé" } }
        - { id: peering, text: { en: "Virtual network peering between the spokes", fr: "Peering de réseaux virtuels entre les spokes" } }
        - { id: nat, text: { en: "A NAT gateway associated with the subnet", fr: "Une passerelle NAT associée au sous-réseau" } }
        - { id: waf, text: { en: "A WAF policy on the Application Gateway", fr: "Une stratégie WAF sur l'Application Gateway" } }
        - { id: ddosip, text: { en: "Azure DDoS IP Protection on the public IP", fr: "Azure DDoS IP Protection sur l'adresse IP publique" } }
      targets:
        - id: t1
          text: { en: "Spoke-to-spoke and branch-to-spoke traffic bypasses the hub firewall", fr: "Le trafic entre spokes et des succursales vers les spokes contourne le pare-feu du hub" }
        - id: t2
          text: { en: "Build servers need outbound-only internet access with fixed public IPs", fr: "Les serveurs de build ont besoin d'un accès Internet sortant uniquement avec des adresses IP publiques fixes" }
        - id: t3
          text: { en: "Bots flood the login page with HTTP requests", fr: "Des bots inondent la page de connexion de requêtes HTTP" }
    answer:
      mapping: { t1: intent, t2: nat, t3: waf }
    explanation:
      correct:
        en: |
          With a private traffic routing policy, Virtual WAN sends branch-to-branch, branch-to-virtual network and inter-hub traffic, as well as traffic between VNets of the hub, through the security solution in the hub. A NAT gateway is the recommended explicit outbound method for a private subnet: it gives outbound connectivity through its public IPs and accepts no connection initiated from the internet. An HTTP flood is a layer 7 attack, which DDoS Protection doesn't cover and a WAF does.
        fr: |
          Avec une stratégie de routage du trafic privé, Virtual WAN fait passer le trafic entre succursales, des succursales vers les réseaux virtuels et entre hubs, ainsi que le trafic entre réseaux virtuels du hub, par la solution de sécurité du hub. Une passerelle NAT est la méthode sortante explicite recommandée pour un sous-réseau privé : elle fournit la connectivité sortante par ses adresses IP publiques et n'accepte aucune connexion initiée depuis Internet. Une inondation HTTP est une attaque de couche 7, que DDoS Protection ne couvre pas et qu'un WAF couvre.
      options:
        peering: { en: "Direct peering between spokes creates exactly the path that bypasses the hub firewall.", fr: "Un peering direct entre spokes crée justement le chemin qui contourne le pare-feu du hub." }
        ddosip: { en: "DDoS IP Protection is another layer 3-4 tier; it doesn't inspect HTTP requests.", fr: "DDoS IP Protection est un autre niveau de couches 3-4 ; il n'inspecte pas les requêtes HTTP." }
    references:
      - title: How to configure Virtual WAN Hub routing intent and routing policies
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
      - title: Default outbound access in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-34-08
    objective: "3.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. routes the Microsoft 365 traffic of its corporate devices through Global Secure Access with the Microsoft traffic forwarding profile. A Conditional Access policy that targets SharePoint Online for all users blocks access from every location except **All Compliant Network locations**.

        Since the policy was enabled, 150 consultants from Fabrikam, Inc. can't open Contoso's project sites. The consultants are B2B collaboration guests in Contoso's tenant. They work on Fabrikam-managed laptops that run the Global Secure Access client of Fabrikam's own tenant, and Fabrikam enforces MFA for all of them.

        The design must meet the following requirements:

        - Contoso employees must stay subject to the compliant network check.
        - The consultants must regain access from their Fabrikam laptops, wherever they work.
        - The consultants must complete MFA, and Contoso must rely on the MFA that Fabrikam already performs.

        What should you recommend?
      fr: |
        Contoso, Ltd. fait passer le trafic Microsoft 365 de ses appareils d'entreprise par Global Secure Access avec le profil de transfert du trafic Microsoft. Une stratégie d'accès conditionnel qui cible SharePoint Online pour tous les utilisateurs bloque l'accès depuis tous les emplacements sauf **All Compliant Network locations**.

        Depuis l'activation de la stratégie, 150 consultants de Fabrikam, Inc. ne peuvent plus ouvrir les sites de projet de Contoso. Les consultants sont des invités de collaboration B2B dans le locataire de Contoso. Ils travaillent sur des ordinateurs portables gérés par Fabrikam qui exécutent le client Global Secure Access du propre locataire de Fabrikam, et Fabrikam impose la MFA à chacun d'eux.

        La conception doit répondre aux exigences suivantes :

        - Les employés de Contoso doivent rester soumis à la vérification du réseau conforme.
        - Les consultants doivent retrouver l'accès depuis leurs ordinateurs portables Fabrikam, où qu'ils travaillent.
        - Les consultants doivent effectuer la MFA, et Contoso doit s'appuyer sur la MFA que Fabrikam effectue déjà.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Exclude guests from the policy, require MFA for them in a new policy, and trust MFA from Fabrikam in the inbound cross-tenant access settings", fr: "Exclure les invités de la stratégie, exiger la MFA pour eux dans une nouvelle stratégie, et approuver la MFA de Fabrikam dans les paramètres d'accès interlocataire entrants" } }
        - { id: b, text: { en: "Exclude guests from the policy, require MFA for them in a new policy, and allow Fabrikam in the outbound cross-tenant access settings", fr: "Exclure les invités de la stratégie, exiger la MFA pour eux dans une nouvelle stratégie, et autoriser Fabrikam dans les paramètres d'accès interlocataire sortants" } }
        - { id: c, text: { en: "Keep the policy for all users, and allow Fabrikam's tenant in the partner policy of Contoso's tenant restrictions v2", fr: "Conserver la stratégie pour tous les utilisateurs, et autoriser le locataire de Fabrikam dans la stratégie de partenaire des restrictions de locataire v2 de Contoso" } }
        - { id: d, text: { en: "Keep the policy for all users, and exclude a named location with the public IP ranges of Fabrikam's offices", fr: "Conserver la stratégie pour tous les utilisateurs, et exclure un emplacement nommé avec les plages d'adresses IP publiques des bureaux de Fabrikam" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The compliant network check is specific to the tenant that configures it: a user from another tenant can't pass it, even through that tenant's own Global Secure Access. Guests must therefore be excluded and covered by their own policy. Trusting MFA from Fabrikam in the inbound settings lets Contoso's policy accept the MFA claim from the guests' home tenant instead of challenging them again.
        fr: |
          La vérification du réseau conforme est propre au locataire qui la configure : un utilisateur d'un autre locataire ne peut pas la satisfaire, même par le Global Secure Access de son propre locataire. Les invités doivent donc être exclus et couverts par leur propre stratégie. Approuver la MFA de Fabrikam dans les paramètres entrants permet à la stratégie de Contoso d'accepter la revendication MFA du locataire d'origine des invités au lieu de leur demander de nouveau la MFA.
      options:
        b: { en: "Outbound settings govern Contoso accounts that access other organizations, not Fabrikam guests that access Contoso.", fr: "Les paramètres sortants régissent les comptes de Contoso qui accèdent à d'autres organisations, pas les invités de Fabrikam qui accèdent à Contoso." }
        c: { en: "Tenant restrictions v2 control external accounts on Contoso's devices and networks; the guests would still fail the compliant network check.", fr: "Les restrictions de locataire v2 contrôlent les comptes externes sur les appareils et réseaux de Contoso ; les invités échoueraient toujours à la vérification du réseau conforme." }
        d: { en: "Office IP ranges don't cover consultants who work from home or travel, and the exclusion doesn't require MFA.", fr: "Les plages IP des bureaux ne couvrent pas les consultants qui travaillent à domicile ou en déplacement, et l'exclusion n'exige pas la MFA." }
    references:
      - title: Enable compliant network check with Conditional Access
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-compliant-network
      - title: Manage cross-tenant access settings for B2B collaboration
        url: https://learn.microsoft.com/en-us/entra/external-id/cross-tenant-access-settings-b2b-collaboration

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-34-09
    objective: "3.4.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has 120 virtual networks in a management group. Workload teams manage the NSGs of their own subnets. The security team uses Azure Virtual Network Manager, and a low-priority security admin rule already denies all inbound traffic from the internet to every virtual network.

        The security team adds three requirements:

        - A vulnerability scanner in 10.50.1.0/24 must reach every VM on TCP 5986, even if a workload team adds an NSG rule that denies that traffic.
        - Outbound traffic to TCP 25 must be blocked in every virtual network, whatever rules the workload teams create.
        - Inbound HTTPS from the internet must be exempted from the deny-all rule, but each workload team must still be able to block it in its own NSGs.

        Which security admin rule action should you recommend for each requirement? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose de 120 réseaux virtuels dans un groupe d'administration. Les équipes des charges de travail gèrent les NSG de leurs propres sous-réseaux. L'équipe de sécurité utilise Azure Virtual Network Manager, et une règle d'administration de la sécurité de faible priorité refuse déjà tout le trafic entrant depuis Internet vers chaque réseau virtuel.

        L'équipe de sécurité ajoute trois exigences :

        - Un analyseur de vulnérabilités dans 10.50.1.0/24 doit atteindre chaque machine virtuelle sur TCP 5986, même si une équipe de charge de travail ajoute une règle NSG qui refuse ce trafic.
        - Le trafic sortant vers TCP 25 doit être bloqué dans chaque réseau virtuel, quelles que soient les règles créées par les équipes des charges de travail.
        - Le HTTPS entrant depuis Internet doit être exempté de la règle de refus global, mais chaque équipe de charge de travail doit toujours pouvoir le bloquer dans ses propres NSG.

        Quelle action de règle d'administration de la sécurité devez-vous recommander pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Scanner traffic on TCP 5986: [[scanner]]

          Outbound traffic to TCP 25: [[smtp]]

          Inbound HTTPS from the internet: [[https]]
        fr: |
          Trafic de l'analyseur sur TCP 5986 : [[scanner]]

          Trafic sortant vers TCP 25 : [[smtp]]

          HTTPS entrant depuis Internet : [[https]]
      slots:
        - id: scanner
          options:
            - { id: allow, text: "Allow" }
            - { id: always, text: "Always Allow" }
            - { id: deny, text: "Deny" }
        - id: smtp
          options:
            - { id: allow, text: "Allow" }
            - { id: always, text: "Always Allow" }
            - { id: deny, text: "Deny" }
        - id: https
          options:
            - { id: allow, text: "Allow" }
            - { id: always, text: "Always Allow" }
            - { id: deny, text: "Deny" }
    answer:
      values: { scanner: always, smtp: deny, https: allow }
    explanation:
      correct:
        en: |
          Security admin rules are evaluated before NSG rules. Always Allow delivers the traffic and ends evaluation, so no NSG rule can deny the scanner. Deny stops the traffic before any NSG rule is evaluated, so workload teams can't reopen TCP 25. Allow, placed at a higher priority than the deny-all rule, exempts HTTPS from it and then passes the traffic to the NSG rules, which can still block it.
        fr: |
          Les règles d'administration de la sécurité sont évaluées avant les règles NSG. Always Allow livre le trafic et arrête l'évaluation : aucune règle NSG ne peut refuser l'analyseur. Deny arrête le trafic avant l'évaluation de toute règle NSG : les équipes des charges de travail ne peuvent pas rouvrir TCP 25. Allow, placé à une priorité plus élevée que la règle de refus global, en exempte le HTTPS puis transmet le trafic aux règles NSG, qui peuvent toujours le bloquer.
      options:
        scanner: { en: "Allow would let a workload NSG deny the scanner, which the requirement forbids.", fr: "Allow laisserait un NSG de charge de travail refuser l'analyseur, ce que l'exigence interdit." }
        https: { en: "Always Allow would bypass the NSGs, so workload teams could no longer block HTTPS.", fr: "Always Allow contournerait les NSG : les équipes des charges de travail ne pourraient plus bloquer le HTTPS." }
    references:
      - title: Security admin rules in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-34-10
    objective: "3.4.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. uses Microsoft Entra Private Access with per-app access only. Two private network connectors in a connector group named **Paris-Connectors**, in the Paris datacenter, serve all the Global Secure Access apps today.

        Fabrikam acquires a company whose ERP system runs in a Montreal datacenter on TCP 3200. There is no network connectivity between the Paris and Montreal datacenters, and none will be built.

        The design must meet the following requirements:

        - Only members of the Finance group can reach the ERP system, from a compliant device and after MFA.
        - Access to the ERP system must continue if one connector server fails.
        - No inbound port may be opened on the Montreal firewall.

        Which three actions should you recommend? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. utilise Accès privé Microsoft Entra avec uniquement l'accès par application. Deux connecteurs de réseau privé d'un groupe de connecteurs nommé **Paris-Connectors**, dans le centre de données de Paris, servent aujourd'hui toutes les applications Global Secure Access.

        Fabrikam acquiert une entreprise dont le système ERP s'exécute dans un centre de données de Montréal sur TCP 3200. Il n'existe aucune connectivité réseau entre les centres de données de Paris et de Montréal, et aucune ne sera créée.

        La conception doit répondre aux exigences suivantes :

        - Seuls les membres du groupe Finance peuvent atteindre le système ERP, depuis un appareil conforme et après la MFA.
        - L'accès au système ERP doit continuer si un serveur de connecteur tombe en panne.
        - Aucun port entrant ne peut être ouvert sur le pare-feu de Montréal.

        Quelles sont les trois actions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Install two connectors in Montreal, add them to Paris-Connectors, and keep the ERP app on that group", fr: "Installer deux connecteurs à Montréal, les ajouter à Paris-Connectors, et laisser l'application ERP sur ce groupe" } }
        - { id: b, text: { en: "Install two connectors in Montreal in a new connector group, and assign the ERP app to that group", fr: "Installer deux connecteurs à Montréal dans un nouveau groupe de connecteurs, et affecter l'application ERP à ce groupe" } }
        - { id: c, text: { en: "Create a Global Secure Access app for the ERP segment, and assign the Finance group to it directly", fr: "Créer une application Global Secure Access pour le segment ERP, et lui attribuer directement le groupe Finance" } }
        - { id: d, text: { en: "Create a Conditional Access policy that targets the ERP app and requires MFA and a compliant device", fr: "Créer une stratégie d'accès conditionnel qui cible l'application ERP et exige la MFA et un appareil conforme" } }
        - { id: e, text: { en: "Allow inbound TCP 443 from the Global Secure Access edge to the Montreal connectors", fr: "Autoriser le TCP 443 entrant depuis la périphérie Global Secure Access vers les connecteurs de Montréal" } }
        - { id: f, text: { en: "Add the ERP segment to a Quick Access app, and target Quick Access with MFA and a compliant device", fr: "Ajouter le segment ERP à une application Quick Access, et cibler Quick Access avec la MFA et un appareil conforme" } }
    answer: { optionIds: [ b, c, d ] }
    explanation:
      correct:
        en: |
          The connectors that serve an app must reach it, so the ERP app needs its own location-based connector group in Montreal, with at least two connectors for high availability. A Global Secure Access app for the ERP segment, assigned directly to Finance, limits who can reach it, and Conditional Access for per-app access is configured on that app to require MFA and a compliant device. Connectors only make outbound connections, so no inbound port is needed.
        fr: |
          Les connecteurs qui servent une application doivent pouvoir l'atteindre : l'application ERP a donc besoin de son propre groupe de connecteurs géographique à Montréal, avec au moins deux connecteurs pour la haute disponibilité. Une application Global Secure Access pour le segment ERP, attribuée directement à Finance, limite qui peut l'atteindre, et l'accès conditionnel de l'accès par application se configure sur cette application pour exiger la MFA et un appareil conforme. Les connecteurs n'établissent que des connexions sortantes : aucun port entrant n'est nécessaire.
      options:
        a: { en: "Connections are spread across the connectors of a group, and the Paris connectors can't reach Montreal, so some ERP sessions would fail.", fr: "Les connexions sont réparties entre les connecteurs d'un groupe, et ceux de Paris ne peuvent pas atteindre Montréal : certaines sessions ERP échoueraient." }
        e: { en: "Connectors only send outbound requests; no inbound port is needed, and the requirement forbids one.", fr: "Les connecteurs n'envoient que des requêtes sortantes ; aucun port entrant n'est nécessaire, et l'exigence l'interdit." }
        f: { en: "Quick Access is the broad app of all employees, so its policy wouldn't limit the ERP system to the Finance group.", fr: "Quick Access est l'application large de tous les employés : sa stratégie ne limiterait pas le système ERP au groupe Finance." }
    references:
      - title: Microsoft Entra private network connectors
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-connectors
      - title: How to configure per-app access using Global Secure Access applications
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-per-app-access
