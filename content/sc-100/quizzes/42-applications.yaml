chapter: 42-applications
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-42-01
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys is threat modeling its business-critical mobile ordering app. The workshop records the following threat: an attacker on a public Wi-Fi network captures the traffic between the app and the order API and reads the customers' delivery addresses. The attacker doesn't change any data.

        Which STRIDE category should you assign to this threat?
      fr: |
        Tailspin Toys modélise les menaces de son application mobile de commande, vitale pour l'entreprise. L'atelier consigne la menace suivante : un attaquant connecté à un réseau Wi-Fi public capture le trafic entre l'application et l'API de commande et lit les adresses de livraison des clients. L'attaquant ne modifie aucune donnée.

        Quelle catégorie STRIDE devez-vous attribuer à cette menace ?
    body:
      options:
        - { id: a, text: { en: "Tampering", fr: "Falsification (Tampering)" } }
        - { id: b, text: { en: "Information disclosure", fr: "Divulgation d'informations (Information disclosure)" } }
        - { id: c, text: { en: "Spoofing", fr: "Usurpation d'identité (Spoofing)" } }
        - { id: d, text: { en: "Elevation of privilege", fr: "Élévation de privilèges (Elevation of privilege)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Information disclosure is the exposure of information to people who aren't allowed to see it, including reading data in transit. It violates confidentiality, and the typical mitigation is encryption in transit (TLS).
        fr: |
          La divulgation d'informations est l'exposition d'informations à des personnes qui n'ont pas le droit de les voir, y compris la lecture de données en transit. Elle viole la confidentialité, et l'atténuation typique est le chiffrement en transit (TLS).
      options:
        a: { en: "Tampering is the malicious modification of data, for example in transit; here the data is only read.", fr: "La falsification est la modification malveillante de données, par exemple en transit ; ici, les données sont seulement lues." }
        c: { en: "Spoofing is using someone else's authentication information to act as them; the attacker doesn't sign in as anyone.", fr: "L'usurpation d'identité consiste à utiliser les informations d'authentification d'une autre personne pour agir à sa place ; l'attaquant ne se connecte sous aucune identité." }
        d: { en: "Elevation of privilege is an unprivileged user gaining privileged access; the attacker gains no rights in the app.", fr: "L'élévation de privilèges est l'obtention d'un accès privilégié par un utilisateur non privilégié ; l'attaquant n'obtient aucun droit dans l'application." }
    references:
      - title: Threats - Microsoft Threat Modeling Tool
        url: https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-42-02
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders runs 60 line-of-business applications on Azure and on AWS. The security team must evaluate the configuration of the resources that host these applications against the Microsoft cloud security benchmark, in both clouds, and track a secure score for each environment.

        No budget is available this year for new security plans or licenses.

        What should you recommend?
      fr: |
        Northwind Traders exécute 60 applications métier sur Azure et sur AWS. L'équipe de sécurité doit évaluer la configuration des ressources qui hébergent ces applications par rapport au benchmark de sécurité cloud Microsoft, dans les deux clouds, et suivre un score de sécurité pour chaque environnement.

        Aucun budget n'est disponible cette année pour de nouveaux plans ou de nouvelles licences de sécurité.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Connect the AWS accounts to Defender for Cloud and use foundational CSPM", fr: "Connecter les comptes AWS à Defender for Cloud et utiliser la CSPM de base" } }
        - { id: b, text: { en: "Enable Defender CSPM on the subscriptions and on the AWS connectors", fr: "Activer Defender CSPM sur les abonnements et sur les connecteurs AWS" } }
        - { id: c, text: { en: "Assign the Microsoft cloud security benchmark initiative with Azure Policy", fr: "Attribuer l'initiative du benchmark de sécurité cloud Microsoft avec Azure Policy" } }
        - { id: d, text: { en: "Connect the AWS accounts to Defender for Cloud Apps as app connectors", fr: "Connecter les comptes AWS à Defender for Cloud Apps comme connecteurs d'applications" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Foundational CSPM is free. It provides security recommendations and a secure score based on the Microsoft cloud security benchmark for Azure, AWS and GCP resources once the accounts are connected to Defender for Cloud.
        fr: |
          La CSPM de base est gratuite. Elle fournit des recommandations de sécurité et un score de sécurité basés sur le benchmark de sécurité cloud Microsoft pour les ressources Azure, AWS et GCP, une fois les comptes connectés à Defender for Cloud.
      options:
        b: { en: "Defender CSPM is a paid plan; its additions, such as attack paths, aren't required to assess configurations against the benchmark.", fr: "Defender CSPM est un plan payant ; ses ajouts, comme les chemins d'attaque, ne sont pas nécessaires pour évaluer les configurations par rapport au benchmark." }
        c: { en: "An Azure Policy assignment evaluates Azure resources only, so the AWS resources aren't assessed.", fr: "Une attribution Azure Policy n'évalue que les ressources Azure : les ressources AWS ne sont donc pas évaluées." }
        d: { en: "Defender for Cloud Apps is licensed separately, and it doesn't assess cloud resources against the benchmark or provide this secure score.", fr: "Defender for Cloud Apps fait l'objet d'une licence distincte, et il n'évalue pas les ressources cloud par rapport au benchmark et ne fournit pas ce score de sécurité." }
    references:
      - title: What is Cloud Security Posture Management (CSPM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-42-03
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank's operations team receives Defender for Cloud alerts for its loan application, which runs in Azure App Service. Each time a flaw in the application code is reported, an operator applies a fix directly to the production app.

        The same types of flaws reappear in later releases, and the production code no longer matches the repository. You need to recommend a change to the application security lifecycle that prevents the flaws from recurring.

        What should you recommend?
      fr: |
        L'équipe des opérations de Woodgrove Bank reçoit des alertes Defender for Cloud pour son application de prêts, qui s'exécute dans Azure App Service. Chaque fois qu'une faille du code de l'application est signalée, un opérateur applique un correctif directement sur l'application de production.

        Les mêmes types de failles réapparaissent dans les versions suivantes, et le code de production ne correspond plus au dépôt. Vous devez recommander une modification du cycle de vie de la sécurité des applications qui empêche les failles de se reproduire.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Route each finding to the developers' backlog, fix it in code through the pipeline, and add a check for it", fr: "Envoyer chaque constat dans le backlog des développeurs, le corriger dans le code par le pipeline et ajouter une vérification" } }
        - { id: b, text: { en: "Let the operators keep fixing production, and have them commit each fix to the repository at the end of the month", fr: "Laisser les opérateurs continuer à corriger la production, et leur faire valider chaque correctif dans le dépôt à la fin du mois" } }
        - { id: c, text: { en: "Add a WAF custom rule for each reported flaw, and keep the rules permanently instead of changing the application code", fr: "Ajouter une règle personnalisée WAF pour chaque faille signalée, et conserver les règles définitivement au lieu de modifier le code de l'application" } }
        - { id: d, text: { en: "Schedule a yearly penetration test of the production app, and attach its report to the next release of the application", fr: "Planifier un test d'intrusion annuel de l'application de production, et joindre son rapport à la version suivante de l'application" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A full lifecycle strategy closes the loop: fixes for production issues go back into the development lifecycle, owned by the development team and shipped through the pipeline, so that production matches the code. Adding an automated check for the flaw type in verification shifts its detection left, to where it's cheapest to fix.
        fr: |
          Une stratégie de cycle de vie complet boucle la boucle : les correctifs des problèmes de production reviennent dans le cycle de développement, confiés à l'équipe de développement et livrés par le pipeline, pour que la production corresponde au code. Ajouter une vérification automatisée de ce type de faille dans la phase de vérification décale sa détection à gauche, là où elle coûte le moins à corriger.
      options:
        b: { en: "Fixes made outside the pipeline skip reviews and tests, and the development team still doesn't learn from the flaws.", fr: "Les correctifs faits hors du pipeline échappent aux revues et aux tests, et l'équipe de développement ne tire toujours pas de leçon des failles." }
        c: { en: "A WAF rule is a compensating control at run time; the flaw stays in the code and keeps reappearing in new features.", fr: "Une règle WAF est un contrôle compensatoire à l'exécution ; la faille reste dans le code et continue de réapparaître dans les nouvelles fonctionnalités." }
        d: { en: "A yearly test finds flaws late and rarely, and doesn't route the fixes back to the developers.", fr: "Un test annuel trouve les failles tard et rarement, et ne renvoie pas les correctifs aux développeurs." }
    references:
      - title: Architecture strategies for securing a development lifecycle
        url: https://learn.microsoft.com/en-us/azure/well-architected/security/secure-development-lifecycle

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-42-04
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. stores the code of its payment application in a Git repository in Azure Repos. A developer pushed a change directly to the main branch that disabled input validation, and nobody reviewed it.

        The new development standard requires every change to the main branch to go through a pull request approved by at least one person other than the person who last pushed changes to it.

        What should you include in the standard?
      fr: |
        Litware, Inc. stocke le code de son application de paiement dans un dépôt Git d'Azure Repos. Un développeur a envoyé directement sur la branche principale une modification qui désactivait la validation des entrées, et personne ne l'a revue.

        La nouvelle norme de développement exige que chaque modification de la branche principale passe par une demande de tirage approuvée par au moins une personne autre que celle qui y a envoyé les dernières modifications.

        Que devez-vous inclure dans la norme ?
    body:
      options:
        - { id: a, text: { en: "A branch policy on main that requires one reviewer and prohibits the most recent pusher from approving", fr: "Une stratégie de branche sur main qui exige un relecteur et interdit au dernier auteur d'un envoi d'approuver" } }
        - { id: b, text: { en: "A branch policy on main that requires one reviewer and allows requestors to approve their own changes", fr: "Une stratégie de branche sur main qui exige un relecteur et autorise les demandeurs à approuver leurs propres modifications" } }
        - { id: c, text: { en: "A build validation policy on main that runs CodeQL code scanning on every pull request", fr: "Une stratégie de validation de build sur main qui exécute l'analyse du code CodeQL à chaque demande de tirage" } }
        - { id: d, text: { en: "Secret scanning push protection enabled on the repository that stores the application", fr: "La protection des envois de l'analyse des secrets activée sur le dépôt qui stocke l'application" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A required branch policy blocks direct pushes to main: changes arrive only through pull requests. The minimum number of reviewers enforces the review, and prohibiting the most recent pusher from approving enforces separation of duties, because that person's vote doesn't count.
        fr: |
          Une stratégie de branche obligatoire bloque les envois directs sur main : les modifications n'arrivent que par des demandes de tirage. Le nombre minimal de relecteurs impose la revue, et l'interdiction d'approbation par le dernier auteur d'un envoi impose la séparation des tâches, car son vote ne compte pas.
      options:
        b: { en: "Letting requestors approve their own changes means the author's vote counts, so a change can complete without another person's review.", fr: "Autoriser les demandeurs à approuver leurs propres modifications fait compter le vote de l'auteur : une modification peut donc aboutir sans revue par une autre personne." }
        c: { en: "Build validation runs an automated check; it doesn't require a person to approve the change.", fr: "La validation de build exécute une vérification automatisée ; elle n'exige pas qu'une personne approuve la modification." }
        d: { en: "Push protection blocks commits that contain secrets; it doesn't require reviews or pull requests.", fr: "La protection des envois bloque les validations qui contiennent des secrets ; elle n'exige ni revue ni demande de tirage." }
    references:
      - title: Set and manage branch policies
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-42-05
    objective: "4.2.5"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso, Ltd. is designing an internal expense application named App1. App1 will run in Azure App Service and keep scanned receipts in an Azure Storage account. Contoso's teams deploy dozens of App Service apps every month.

        Which technology meets each requirement of the design? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. conçoit une application interne de notes de frais nommée App1. App1 s'exécutera dans Azure App Service et conservera les justificatifs numérisés dans un compte de stockage Azure. Les équipes de Contoso déploient des dizaines d'applications App Service chaque mois.

        Quelle technologie répond à chaque exigence de la conception ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Employees sign in to App1, and only from compliant devices: [[signin]]

          Every new App Service app automatically receives diagnostic settings that send its logs to the central Log Analytics workspace: [[logs]]

          Contoso can make the stored receipts unreadable by revoking access to a key: [[revoke]]
        fr: |
          Les employés se connectent à App1, et uniquement depuis des appareils conformes : [[signin]]

          Chaque nouvelle application App Service reçoit automatiquement des paramètres de diagnostic qui envoient ses journaux vers l'espace de travail Log Analytics central : [[logs]]

          Contoso peut rendre illisibles les justificatifs stockés en révoquant l'accès à une clé : [[revoke]]
      slots:
        - id: signin
          options:
            - { id: entra, text: { en: "Microsoft Entra ID with Conditional Access", fr: "Microsoft Entra ID avec l'accès conditionnel" } }
            - { id: extid, text: { en: "Microsoft Entra External ID", fr: "Microsoft Entra External ID" } }
            - { id: restrict, text: { en: "App Service access restrictions", fr: "Restrictions d'accès App Service" } }
            - { id: apim, text: { en: "API Management subscription keys", fr: "Clés d'abonnement API Management" } }
        - id: logs
          options:
            - { id: dine, text: { en: "Azure Policy with the DeployIfNotExists effect", fr: "Azure Policy avec l'effet DeployIfNotExists" } }
            - { id: deny, text: { en: "Azure Policy with the Deny effect", fr: "Azure Policy avec l'effet Deny" } }
            - { id: audit, text: { en: "Azure Policy with the Audit effect", fr: "Azure Policy avec l'effet Audit" } }
            - { id: defapp, text: { en: "Defender for App Service", fr: "Defender for App Service" } }
        - id: revoke
          options:
            - { id: cmk, text: { en: "Customer-managed keys in Azure Key Vault", fr: "Clés gérées par le client dans Azure Key Vault" } }
            - { id: mmk, text: { en: "Microsoft-managed keys", fr: "Clés gérées par Microsoft" } }
            - { id: infra, text: { en: "Infrastructure encryption", fr: "Chiffrement d'infrastructure" } }
            - { id: immut, text: { en: "Immutable storage", fr: "Stockage immuable" } }
    answer:
      values: { signin: entra, logs: dine, revoke: cmk }
    explanation:
      correct:
        en: |
          Employees authenticate with Microsoft Entra ID, and Conditional Access can require a compliant device for the app. DeployIfNotExists deploys a missing related resource, such as diagnostic settings, after each create or update; a remediation task covers existing apps. With customer-managed keys, revoking access to the key makes the data inaccessible.
        fr: |
          Les employés s'authentifient avec Microsoft Entra ID, et l'accès conditionnel peut exiger un appareil conforme pour l'application. DeployIfNotExists déploie une ressource associée manquante, comme des paramètres de diagnostic, après chaque création ou mise à jour ; une tâche de correction couvre les applications existantes. Avec des clés gérées par le client, révoquer l'accès à la clé rend les données inaccessibles.
      options:
        extid: { en: "External ID is for customers and partners, not for employees in the workforce tenant.", fr: "External ID est destiné aux clients et aux partenaires, pas aux employés du locataire de l'entreprise." }
        restrict: { en: "Access restrictions filter network sources; they don't check the device that signs in.", fr: "Les restrictions d'accès filtrent les sources réseau ; elles ne vérifient pas l'appareil qui se connecte." }
        deny: { en: "Deny blocks a non-compliant deployment; it doesn't add the missing diagnostic settings.", fr: "Deny bloque un déploiement non conforme ; il n'ajoute pas les paramètres de diagnostic manquants." }
        audit: { en: "Audit only reports the apps without diagnostic settings.", fr: "Audit ne fait que signaler les applications sans paramètres de diagnostic." }
        mmk: { en: "Contoso doesn't control Microsoft-managed keys, so it can't revoke them.", fr: "Contoso ne contrôle pas les clés gérées par Microsoft : elle ne peut donc pas les révoquer." }
        infra: { en: "Infrastructure encryption adds a second layer with a Microsoft-managed key; it gives no revocation control.", fr: "Le chiffrement d'infrastructure ajoute une deuxième couche avec une clé gérée par Microsoft ; il ne donne aucun contrôle de révocation." }
    references:
      - title: Azure Policy definitions deployIfNotExists effect
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deploy-if-not-exists
      - title: Customer-managed keys for Azure Storage encryption
        url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-42-06
    objective: "4.2.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation publishes its global online store through an Azure Front Door (classic) profile. The WAF policy associated with the profile uses the Default Rule Set, the Bot Manager rule set and two custom rules.

        Adatum must replace the classic profile before Front Door (classic) is retired. The solution must meet the following requirements:

        - Keep the managed rule protection and the bot protection at the edge.
        - Avoid any downtime for customers during the change.
        - Minimize cost and administrative effort.

        What should you recommend?
      fr: |
        Adatum Corporation publie sa boutique en ligne mondiale par un profil Azure Front Door (classique). La stratégie WAF associée au profil utilise le Default Rule Set, l'ensemble de règles Bot Manager et deux règles personnalisées.

        Adatum doit remplacer le profil classique avant la mise hors service de Front Door (classique). La solution doit répondre aux exigences suivantes :

        - Conserver la protection des règles managées et la protection contre les bots en périphérie.
        - Éviter toute interruption de service pour les clients pendant le changement.
        - Réduire au minimum le coût et l'effort d'administration.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Migrate the profile to Front Door Standard, and rewrite the managed rule protections as custom rules", fr: "Migrer le profil vers Front Door Standard, et réécrire les protections des règles managées sous forme de règles personnalisées" } }
        - { id: b, text: { en: "Migrate the profile to Front Door Premium with the built-in migration, which copies the WAF policy", fr: "Migrer le profil vers Front Door Premium avec la migration intégrée, qui copie la stratégie WAF" } }
        - { id: c, text: { en: "Keep the classic profile, because classic endpoints stay supported until the 2028 cutover deadline", fr: "Conserver le profil classique, car les points de terminaison classiques restent pris en charge jusqu'à l'échéance de bascule de 2028" } }
        - { id: d, text: { en: "Replace Front Door with an Application Gateway WAF_v2 in each origin region, with the same rule sets", fr: "Remplacer Front Door par une instance Application Gateway WAF_v2 dans chaque région d'origine, avec les mêmes ensembles de règles" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Only Front Door Premium runs managed rule sets and the Bot Manager rule set; Standard supports custom rules only. The built-in migration is a zero-downtime change of the control plane, and a classic WAF policy that has managed rules migrates to Premium with a copy of the policy. Front Door (classic) retires on March 31, 2027.
        fr: |
          Seul Front Door Premium exécute les ensembles de règles managés et l'ensemble de règles Bot Manager ; Standard ne prend en charge que les règles personnalisées. La migration intégrée est un changement du plan de contrôle sans interruption de service, et une stratégie WAF classique qui a des règles managées migre vers Premium avec une copie de la stratégie. Front Door (classique) sera mis hors service le 31 mars 2027.
      options:
        a: { en: "Custom rules can't reproduce the managed Default Rule Set or the bot protection, and a policy with managed rules can't migrate to Standard.", fr: "Les règles personnalisées ne peuvent pas reproduire le Default Rule Set managé ni la protection contre les bots, et une stratégie avec des règles managées ne peut pas migrer vers Standard." }
        c: { en: "The classic tier retires on March 31, 2027; the 2028 date only bounds the DNS cutover after a migration.", fr: "Le niveau classique sera mis hors service le 31 mars 2027 ; la date de 2028 ne borne que la bascule DNS après une migration." }
        d: { en: "Application Gateway is regional: protection would no longer be at the edge, and running a gateway per region adds cost and effort.", fr: "Application Gateway est régional : la protection ne serait plus en périphérie, et exploiter une passerelle par région ajoute du coût et de l'effort." }
    references:
      - title: Azure Front Door (classic) to Standard or Premium tier migration
        url: https://learn.microsoft.com/en-us/azure/frontdoor/tier-migration
      - title: Azure Web Application Firewall on Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-42-07
    objective: "4.2.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam, Inc. has Workload Identities Premium licenses. Its environment includes the following:

        - A GitHub Actions workflow in the repository fabrikam/webshop deploys to Azure as a user-assigned managed identity named id-deploy. The federated credential of id-deploy trusts the workflow runs of the main branch.
        - 40 single-tenant app registrations are used by internal automation. The security team plans to add their service principals to a security group named SG-Automation and to target SG-Automation with a Conditional Access policy that blocks token requests from outside Fabrikam's named locations.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. dispose de licences Workload Identities Premium. Son environnement comprend les éléments suivants :

        - Un workflow GitHub Actions du dépôt fabrikam/webshop déploie dans Azure en tant qu'identité managée affectée par l'utilisateur nommée id-deploy. Les informations d'identification fédérées d'id-deploy approuvent les exécutions du workflow de la branche main.
        - 40 inscriptions d'applications monolocataires sont utilisées par l'automatisation interne. L'équipe de sécurité prévoit d'ajouter leurs principaux de service à un groupe de sécurité nommé SG-Automation et de cibler SG-Automation avec une stratégie d'accès conditionnel qui bloque les demandes de jetons provenant de l'extérieur des emplacements nommés de Fabrikam.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The workflow runs of the main branch obtain tokens as id-deploy without any credential stored in GitHub.", fr: "Les exécutions du workflow de la branche main obtiennent des jetons en tant qu'id-deploy sans aucune information d'identification stockée dans GitHub." }
        - id: s2
          text: { en: "A workflow run of a feature branch of fabrikam/webshop also obtains tokens as id-deploy, because the repository matches.", fr: "Une exécution du workflow d'une branche de fonctionnalité de fabrikam/webshop obtient aussi des jetons en tant qu'id-deploy, car le dépôt correspond." }
        - id: s3
          text: { en: "Targeting SG-Automation applies the Conditional Access policy to the 40 service principals.", fr: "Cibler SG-Automation applique la stratégie d'accès conditionnel aux 40 principaux de service." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          With workload identity federation, the workflow exchanges its GitHub token for a Microsoft Entra token, so no secret is stored or rotated. The issuer, subject and audience of the external token must match the federated credential exactly, and the subject of a run includes its branch. A Conditional Access policy for workload identities applies only to service principals selected directly: assigning them to a group doesn't enforce it.
        fr: |
          Avec la fédération d'identité de charge de travail, le workflow échange son jeton GitHub contre un jeton Microsoft Entra : aucun secret n'est stocké ni renouvelé. L'émetteur, le sujet et l'audience du jeton externe doivent correspondre exactement aux informations d'identification fédérées, et le sujet d'une exécution inclut sa branche. Une stratégie d'accès conditionnel pour les identités de charge de travail ne s'applique qu'aux principaux de service sélectionnés directement : les affecter à un groupe ne l'applique pas.
      options:
        s2: { en: "The subject of a feature branch run differs from the one trusted for main, so the token exchange is refused; another federated credential would be needed.", fr: "Le sujet d'une exécution d'une branche de fonctionnalité diffère de celui approuvé pour main : l'échange de jeton est donc refusé ; d'autres informations d'identification fédérées seraient nécessaires." }
        s3: { en: "The service principals must be selected directly as workload identities in the policy; group membership doesn't scope it.", fr: "Les principaux de service doivent être sélectionnés directement comme identités de charge de travail dans la stratégie ; l'appartenance à un groupe ne détermine pas sa portée." }
    references:
      - title: Workload identity federation concepts
        url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
      - title: Conditional Access for workload identities
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/workload-identity

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-42-08
    objective: "4.2.7"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware, Inc. publishes its logistics APIs through Azure API Management. A review against the OWASP API Security Top 10 produced the findings shown in the answer area. Proseware wants each finding mitigated by the control that prevents it, not only detected.

        Which control should you recommend for each finding? To answer, drag the appropriate controls to the correct findings. Each control may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. publie ses API logistiques par Azure API Management. Une revue par rapport au Top 10 OWASP de la sécurité des API a produit les constats présentés dans la zone de réponse. Proseware veut que chaque constat soit atténué par le contrôle qui l'empêche, et pas seulement détecté.

        Quel contrôle devez-vous recommander pour chaque constat ? Pour répondre, faites glisser les contrôles appropriés vers les constats correspondants. Chaque contrôle peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: token, text: { en: "Validate Microsoft Entra tokens in a policy that applies to all APIs", fr: "Valider les jetons Microsoft Entra dans une stratégie qui s'applique à toutes les API" } }
        - { id: ops, text: { en: "Define each operation explicitly, without wildcard operations", fr: "Définir chaque opération explicitement, sans opérations génériques" } }
        - { id: envs, text: { en: "Use separate instances per environment, and limit the supported versions", fr: "Utiliser des instances distinctes par environnement, et limiter les versions prises en charge" } }
        - { id: mi, text: { en: "Authenticate to back ends with the managed identity of API Management", fr: "S'authentifier auprès des back-ends avec l'identité managée d'API Management" } }
        - { id: dfa, text: { en: "Enable Defender for APIs on the API Management instance", fr: "Activer Defender for APIs sur l'instance API Management" } }
        - { id: rate, text: { en: "Apply a rate limit per subscription key", fr: "Appliquer une limite de débit par clé d'abonnement" } }
      targets:
        - id: t1
          text: { en: "The APIs accept bearer tokens without checking their signature or their expiration", fr: "Les API acceptent des jetons du porteur sans vérifier leur signature ni leur expiration" }
        - id: t2
          text: { en: "A catch-all operation forwards calls to undocumented administrative endpoints of the back end", fr: "Une opération fourre-tout transmet des appels à des points de terminaison d'administration non documentés du back-end" }
        - id: t3
          text: { en: "Test APIs are published in the production instance, and three deprecated versions are still callable", fr: "Des API de test sont publiées dans l'instance de production, et trois versions dépréciées peuvent encore être appelées" }
        - id: t4
          text: { en: "Calls from API Management to a back-end service carry a shared password written in a policy", fr: "Les appels d'API Management vers un service back-end transportent un mot de passe partagé écrit dans une stratégie" }
    answer:
      mapping: { t1: token, t2: ops, t3: envs, t4: mi }
    explanation:
      correct:
        en: |
          Broken authentication is mitigated by validating Microsoft Entra tokens (validate-azure-ad-token) or other JWTs with required signatures and expiration. Broken function level authorization calls for explicit operations instead of wildcards. Improper inventory management calls for separate instances per environment and a limited number of supported versions. Back ends are called with a managed identity or the credential manager instead of a secret in a policy.
        fr: |
          L'authentification défaillante s'atténue en validant les jetons Microsoft Entra (validate-azure-ad-token) ou d'autres JWT avec signature et expiration obligatoires. L'autorisation défaillante au niveau des fonctions demande des opérations explicites au lieu d'opérations génériques. La gestion inappropriée de l'inventaire demande des instances distinctes par environnement et un nombre limité de versions prises en charge. Les back-ends sont appelés avec une identité managée ou le gestionnaire d'informations d'identification, au lieu d'un secret dans une stratégie.
      options:
        dfa: { en: "Defender for APIs detects and recommends; it doesn't enforce any control on the traffic.", fr: "Defender for APIs détecte et recommande ; il n'applique aucun contrôle sur le trafic." }
        rate: { en: "A rate limit mitigates resource consumption and brute force, not any of these four findings.", fr: "Une limite de débit atténue la consommation de ressources et la force brute, et aucun de ces quatre constats." }
    references:
      - title: Mitigate OWASP API security top 10 in Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/mitigate-owasp-api-threats

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-42-09
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. is moving an internal HR application to an Azure App Service web app on a Premium v3 plan. Fabrikam has a hub virtual network connected to its offices through ExpressRoute, and its devices are managed by Microsoft Intune.

        The design must meet the following requirements:

        - Only Fabrikam employees can use the app, and only from devices that are compliant in Intune.
        - The app must have no inbound endpoint reachable from the internet. Employees reach it from the hub virtual network and from the offices.
        - Administrative effort must be minimized.

        Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. migre une application RH interne vers une application web Azure App Service sur un plan Premium v3. Fabrikam dispose d'un réseau virtuel hub connecté à ses bureaux par ExpressRoute, et ses appareils sont gérés par Microsoft Intune.

        La conception doit répondre aux exigences suivantes :

        - Seuls les employés de Fabrikam peuvent utiliser l'application, et uniquement depuis des appareils conformes dans Intune.
        - L'application ne doit avoir aucun point de terminaison entrant accessible depuis Internet. Les employés l'atteignent depuis le réseau virtuel hub et depuis les bureaux.
        - L'effort d'administration doit être réduit au minimum.

        Quelles deux actions devez-vous inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Configure Microsoft Entra authentication, with Conditional Access that requires a compliant device", fr: "Configurer l'authentification Microsoft Entra, avec un accès conditionnel qui exige un appareil conforme" } }
        - { id: b, text: { en: "Enable virtual network integration for the app in a subnet of the hub virtual network", fr: "Activer l'intégration au réseau virtuel de l'application dans un sous-réseau du réseau virtuel hub" } }
        - { id: c, text: { en: "Add a private endpoint for the app in the hub virtual network, and disable public network access", fr: "Ajouter un point de terminaison privé pour l'application dans le réseau virtuel hub, et désactiver l'accès au réseau public" } }
        - { id: d, text: { en: "Configure Microsoft Entra External ID sign-up and sign-in user flows with multifactor authentication", fr: "Configurer des flux d'utilisateurs d'inscription et de connexion Microsoft Entra External ID avec l'authentification multifacteur" } }
        - { id: e, text: { en: "Add access restriction rules that allow only the public IP ranges of Fabrikam's offices", fr: "Ajouter des règles de restriction d'accès qui n'autorisent que les plages d'adresses IP publiques des bureaux de Fabrikam" } }
      choose: 2
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Employees authenticate with Microsoft Entra ID, and a Conditional Access policy targeting the app requires an Intune-compliant device. A private endpoint gives the app a private IP address in the hub virtual network for inbound traffic, reachable from the offices over ExpressRoute, and disabling public network access removes the internet endpoint.
        fr: |
          Les employés s'authentifient avec Microsoft Entra ID, et une stratégie d'accès conditionnel qui cible l'application exige un appareil conforme dans Intune. Un point de terminaison privé donne à l'application une adresse IP privée dans le réseau virtuel hub pour le trafic entrant, accessible depuis les bureaux par ExpressRoute, et la désactivation de l'accès au réseau public supprime le point de terminaison Internet.
      options:
        b: { en: "Virtual network integration handles outbound calls from the app only; the app stays reachable from the internet.", fr: "L'intégration au réseau virtuel ne traite que les appels sortants de l'application ; l'application reste accessible depuis Internet." }
        d: { en: "External ID serves customers and partners with separate accounts, not employees of the workforce tenant.", fr: "External ID sert les clients et les partenaires avec des comptes distincts, pas les employés du locataire de l'entreprise." }
        e: { en: "Access restrictions filter the public endpoint, which still exists and is reachable from the internet.", fr: "Les restrictions d'accès filtrent le point de terminaison public, qui existe toujours et reste accessible depuis Internet." }
    references:
      - title: App Service networking features
        url: https://learn.microsoft.com/en-us/azure/app-service/networking-features

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-42-10
    objective: "4.2.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware, Inc. runs an Azure API Management instance in internal virtual network mode. Internal applications reach all its APIs over ExpressRoute. Litware now plans to offer its shipment tracking APIs to 50 partners over the internet.

        The design must meet the following requirements:

        - Only the tracking APIs are reachable from the internet, behind managed WAF rules. All the other APIs stay reachable only from Litware's networks.
        - One partner must never slow down the others with bursts of calls.
        - Each partner's contract caps its volume of calls per month.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. exécute une instance Azure API Management en mode réseau virtuel interne. Les applications internes atteignent toutes ses API par ExpressRoute. Litware prévoit maintenant de proposer ses API de suivi des expéditions à 50 partenaires sur Internet.

        La conception doit répondre aux exigences suivantes :

        - Seules les API de suivi sont accessibles depuis Internet, derrière des règles WAF managées. Toutes les autres API restent accessibles uniquement depuis les réseaux de Litware.
        - Un partenaire ne doit jamais ralentir les autres par des rafales d'appels.
        - Le contrat de chaque partenaire plafonne son volume d'appels par mois.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Internet exposure of the tracking APIs: [[edge]]

          Protection against bursts of calls: [[burst]]

          Monthly cap of each partner's calls: [[cap]]
        fr: |
          Exposition des API de suivi sur Internet : [[edge]]

          Protection contre les rafales d'appels : [[burst]]

          Plafond mensuel des appels de chaque partenaire : [[cap]]
      slots:
        - id: edge
          options:
            - { id: agw, text: { en: "Application Gateway WAF_v2 in front of API Management, routing only the tracking API paths", fr: "Application Gateway WAF_v2 devant API Management, qui ne route que les chemins des API de suivi" } }
            - { id: external, text: { en: "API Management switched to external virtual network mode", fr: "API Management passé en mode réseau virtuel externe" } }
            - { id: fdstd, text: { en: "Azure Front Door Standard with a WAF policy", fr: "Azure Front Door Standard avec une stratégie WAF" } }
            - { id: fw, text: { en: "Azure Firewall with DNAT rules to API Management", fr: "Pare-feu Azure avec des règles DNAT vers API Management" } }
        - id: burst
          options:
            - { id: rate, text: { en: "A rate limit per subscription key (rate-limit-by-key)", fr: "Une limite de débit par clé d'abonnement (rate-limit-by-key)" } }
            - { id: quota, text: { en: "A usage quota per subscription key (quota-by-key)", fr: "Un quota d'utilisation par clé d'abonnement (quota-by-key)" } }
            - { id: size, text: { en: "A maximum payload size in content validation", fr: "Une taille maximale de charge utile dans la validation du contenu" } }
            - { id: dfa, text: { en: "Defender for APIs volumetric alerts", fr: "Les alertes volumétriques de Defender for APIs" } }
        - id: cap
          options:
            - { id: rate, text: { en: "A rate limit per subscription key (rate-limit-by-key)", fr: "Une limite de débit par clé d'abonnement (rate-limit-by-key)" } }
            - { id: quota, text: { en: "A usage quota per subscription key (quota-by-key)", fr: "Un quota d'utilisation par clé d'abonnement (quota-by-key)" } }
            - { id: size, text: { en: "A maximum payload size in content validation", fr: "Une taille maximale de charge utile dans la validation du contenu" } }
            - { id: dfa, text: { en: "Defender for APIs volumetric alerts", fr: "Les alertes volumétriques de Defender for APIs" } }
    answer:
      values: { edge: agw, burst: rate, cap: quota }
    explanation:
      correct:
        en: |
          Placing Application Gateway WAF_v2 in front of an internal API Management instance publishes only a subset of APIs to the internet, with WAF protection, while internal consumers keep using the private address. A rate limit per key controls calls over short windows, and a quota per key controls the volume over a longer period such as a month.
        fr: |
          Placer Application Gateway WAF_v2 devant une instance API Management interne ne publie sur Internet qu'un sous-ensemble des API, avec la protection du WAF, tandis que les consommateurs internes continuent d'utiliser l'adresse privée. Une limite de débit par clé contrôle les appels sur de courtes fenêtres, et un quota par clé contrôle le volume sur une période plus longue, comme un mois.
      options:
        external: { en: "External mode exposes the gateway and all its APIs to the internet, without a WAF.", fr: "Le mode externe expose la passerelle et toutes ses API sur Internet, sans WAF." }
        fdstd: { en: "Front Door Standard supports custom WAF rules only, not managed rules.", fr: "Front Door Standard ne prend en charge que les règles WAF personnalisées, pas les règles managées." }
        fw: { en: "Azure Firewall filters at the network level and has no WAF rule sets for HTTP attacks.", fr: "Pare-feu Azure filtre au niveau du réseau et n'a pas d'ensembles de règles WAF contre les attaques HTTP." }
        dfa: { en: "Defender for APIs alerts on volumetric attacks but doesn't throttle or cap calls.", fr: "Defender for APIs alerte sur les attaques volumétriques, mais ne limite ni ne plafonne les appels." }
    references:
      - title: Integrate API Management in an internal virtual network with Application Gateway
        url: https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-integrate-internal-vnet-appgateway
      - title: Mitigate OWASP API security top 10 in Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/mitigate-owasp-api-threats
