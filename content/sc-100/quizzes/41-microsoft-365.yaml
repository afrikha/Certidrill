chapter: 41-microsoft-365
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has 40 Azure subscriptions and 25 AWS accounts. The CISO wants one score that shows the security posture of the resources in these environments, with recommendations based on the Microsoft cloud security benchmark.

        Which score should you recommend?
      fr: |
        Contoso, Ltd. dispose de 40 abonnements Azure et de 25 comptes AWS. Le RSSI veut un score unique qui montre la posture de sécurité des ressources de ces environnements, avec des recommandations fondées sur le benchmark de sécurité cloud Microsoft.

        Quel score devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Microsoft Secure Score in the Microsoft Defender portal", fr: "Le Niveau de sécurité Microsoft (Microsoft Secure Score) dans le portail Microsoft Defender" } }
        - { id: b, text: { en: "The secure score of Microsoft Defender for Cloud", fr: "Le score de sécurité de Microsoft Defender for Cloud" } }
        - { id: c, text: { en: "The compliance score of Microsoft Purview Compliance Manager", fr: "Le score de conformité de Microsoft Purview Compliance Manager" } }
        - { id: d, text: { en: "The Azure Advisor score of each subscription", fr: "Le score Azure Advisor de chaque abonnement" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Defender for Cloud secure score aggregates the findings of the Microsoft cloud security benchmark recommendations for each Azure subscription and for each AWS or GCP connector, and combines them in a weighted overall score. It measures the posture of cloud resources, which is what the CISO asks for.
        fr: |
          Le score de sécurité de Defender for Cloud agrège les résultats des recommandations du benchmark de sécurité cloud Microsoft pour chaque abonnement Azure et chaque connecteur AWS ou GCP, et les combine dans un score global pondéré. Il mesure la posture des ressources cloud, ce que demande le RSSI.
      options:
        a: { en: "Microsoft Secure Score measures Microsoft 365 identities, apps, devices and data, not Azure and AWS resources.", fr: "Le Niveau de sécurité Microsoft mesure les identités, applications, appareils et données Microsoft 365, pas les ressources Azure et AWS." }
        c: { en: "The compliance score tracks progress toward regulations and standards, not the security posture of cloud resources.", fr: "Le score de conformité suit la progression vers les réglementations et les normes, pas la posture de sécurité des ressources cloud." }
        d: { en: "Azure Advisor covers Azure subscriptions only, so the AWS accounts would be missing.", fr: "Azure Advisor ne couvre que les abonnements Azure : les comptes AWS manqueraient." }
    references:
      - title: Secure score in Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-41-02
    objective: "4.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation's users have Exchange Online licenses only, so their mail is protected by Exchange Online Protection (EOP). Attackers now send messages that impersonate the CEO and the CFO, and messages from lookalike domains of Adatum's suppliers.

        You need to recommend a solution that detects user and domain impersonation. The solution must minimize costs.

        What should you recommend?
      fr: |
        Les utilisateurs d'Adatum Corporation n'ont que des licences Exchange Online : leur messagerie est donc protégée par Exchange Online Protection (EOP). Des attaquants envoient désormais des messages qui usurpent l'identité du PDG et du directeur financier, et des messages provenant de domaines ressemblant à ceux des fournisseurs d'Adatum.

        Vous devez recommander une solution qui détecte l'emprunt d'identité d'utilisateur et de domaine. La solution doit réduire les coûts au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Stricter anti-spam policies in EOP", fr: "Des stratégies anti-courrier indésirable plus strictes dans EOP" } }
        - { id: b, text: { en: "Microsoft Defender for Office 365 Plan 1", fr: "Microsoft Defender for Office 365 Plan 1" } }
        - { id: c, text: { en: "Microsoft Defender for Office 365 Plan 2", fr: "Microsoft Defender for Office 365 Plan 2" } }
        - { id: d, text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender for Cloud Apps" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          User and domain impersonation protection, with mailbox intelligence, isn't part of EOP: it starts with Defender for Office 365 Plan 1. Plan 2 includes it too, but adds Threat Explorer, AIR and attack simulation training that the requirement doesn't need, so Plan 1 minimizes costs.
        fr: |
          La protection contre l'emprunt d'identité d'utilisateur et de domaine, avec l'intelligence des boîtes aux lettres, ne fait pas partie d'EOP : elle commence avec Defender for Office 365 Plan 1. Le Plan 2 l'inclut aussi, mais ajoute Threat Explorer, AIR et la formation à la simulation d'attaque dont l'exigence n'a pas besoin : le Plan 1 réduit donc les coûts.
      options:
        a: { en: "EOP has no impersonation protection, however its anti-spam policies are tuned.", fr: "EOP n'a pas de protection contre l'emprunt d'identité, quel que soit le réglage de ses stratégies anti-courrier indésirable." }
        c: { en: "Plan 2 also detects impersonation, but it costs more for capabilities the requirement doesn't ask for.", fr: "Le Plan 2 détecte aussi l'emprunt d'identité, mais coûte plus cher pour des fonctionnalités que l'exigence ne demande pas." }
        d: { en: "Defender for Cloud Apps protects SaaS usage and OAuth apps; it doesn't filter inbound email.", fr: "Defender for Cloud Apps protège l'usage des applications SaaS et les applications OAuth ; il ne filtre pas les e-mails entrants." }
    references:
      - title: Microsoft Defender for Office 365 overview
        url: https://learn.microsoft.com/en-us/defender-office-365/mdo-about

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-41-03
    objective: "4.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. creates a Microsoft Teams team for each merger project. Fabrikam has Microsoft 365 E5.

        For every merger team, the compliance team requires that the team be private, that team owners can't add guests, and that files in the team's SharePoint site can be shared only with people in the organization. Team owners must not be able to change these settings.

        What should you recommend?
      fr: |
        Fabrikam, Inc. crée une équipe Microsoft Teams pour chaque projet de fusion. Fabrikam dispose de Microsoft 365 E5.

        Pour chaque équipe de fusion, l'équipe de conformité exige que l'équipe soit privée, que ses propriétaires ne puissent pas ajouter d'invités, et que les fichiers du site SharePoint de l'équipe ne puissent être partagés qu'avec des personnes de l'organisation. Les propriétaires d'équipe ne doivent pas pouvoir modifier ces paramètres.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A sensitivity label scoped to files and emails, with encryption for the project members", fr: "Une étiquette de confidentialité limitée aux fichiers et aux e-mails, avec chiffrement pour les membres du projet" } }
        - { id: b, text: { en: "A DLP policy for Teams and SharePoint that blocks sharing with people outside Fabrikam", fr: "Une stratégie DLP pour Teams et SharePoint qui bloque le partage avec des personnes extérieures à Fabrikam" } }
        - { id: c, text: { en: "A sensitivity label scoped to groups and sites, applied to each merger team", fr: "Une étiquette de confidentialité limitée aux groupes et aux sites, appliquée à chaque équipe de fusion" } }
        - { id: d, text: { en: "A retention label policy that applies a label to the merger sites", fr: "Une stratégie d'étiquettes de rétention qui applique une étiquette aux sites de fusion" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A sensitivity label for containers sets and locks the privacy of the team (Private), controls whether owners can add guests, and sets the external sharing level of the SharePoint site, here only people in the organization. Container labels don't label or encrypt the files inside the site; file protection would need a separate label scoped to files.
        fr: |
          Une étiquette de confidentialité pour les conteneurs définit et verrouille la confidentialité de l'équipe (Private), contrôle si les propriétaires peuvent ajouter des invités, et fixe le niveau de partage externe du site SharePoint, ici les personnes de l'organisation uniquement. Les étiquettes de conteneur n'étiquettent ni ne chiffrent les fichiers du site ; la protection des fichiers exigerait une étiquette distincte limitée aux fichiers.
      options:
        a: { en: "An item label protects documents and emails; it doesn't set the privacy, guest access or sharing settings of a team.", fr: "Une étiquette d'élément protège les documents et les e-mails ; elle ne définit pas la confidentialité, l'accès invité ni les paramètres de partage d'une équipe." }
        b: { en: "DLP acts on sensitive content when it is shared; it doesn't make a team private or stop owners from adding guests.", fr: "La DLP agit sur le contenu sensible au moment du partage ; elle ne rend pas une équipe privée et n'empêche pas les propriétaires d'ajouter des invités." }
        d: { en: "Retention labels keep or delete content; they don't control access or sharing.", fr: "Les étiquettes de rétention conservent ou suppriment le contenu ; elles ne contrôlent ni l'accès ni le partage." }
    references:
      - title: Use sensitivity labels to protect content in Microsoft Teams, Microsoft 365 groups, and SharePoint sites
        url: https://learn.microsoft.com/en-us/purview/sensitivity-labels-teams-groups-sites

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-41-04
    objective: "4.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders uses Microsoft 365 Copilot and Microsoft Purview. The data protection officer requires that, when a user's prompt contains a credit card number or a national ID number, Copilot doesn't use external web search to ground the response.

        Users must keep using Copilot as they do today for all other prompts.

        What should you recommend?
      fr: |
        Northwind Traders utilise Microsoft 365 Copilot et Microsoft Purview. Le délégué à la protection des données exige que, quand l'invite d'un utilisateur contient un numéro de carte bancaire ou un numéro d'identification national, Copilot n'utilise pas la recherche web externe pour fonder la réponse.

        Les utilisateurs doivent continuer à utiliser Copilot comme aujourd'hui pour toutes les autres invites.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Restricted Content Discovery on the sites that store card data", fr: "La découverte de contenu restreinte sur les sites qui stockent des données de carte" } }
        - { id: b, text: { en: "An Insider Risk Management policy from the Risky AI usage template", fr: "Une stratégie de gestion des risques internes issue du modèle Risky AI usage" } }
        - { id: c, text: { en: "A Communication Compliance policy that analyzes Copilot prompts", fr: "Une stratégie de conformité des communications qui analyse les invites Copilot" } }
        - { id: d, text: { en: "A DLP policy for the Copilot location with those sensitive information types", fr: "Une stratégie DLP pour l'emplacement Copilot avec ces types d'informations sensibles" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A DLP policy for the Copilot location, created from the custom template, can use sensitive information type conditions on prompts. When a prompt contains those types, Copilot automatically stops using external web search as a grounding source for that prompt, while other prompts are unaffected.
        fr: |
          Une stratégie DLP pour l'emplacement Copilot, créée à partir du modèle personnalisé, peut utiliser des conditions de types d'informations sensibles sur les invites. Quand une invite contient ces types, Copilot cesse automatiquement d'utiliser la recherche web externe comme source d'ancrage pour cette invite, sans effet sur les autres invites.
      options:
        a: { en: "Restricted Content Discovery keeps sites out of Copilot and search results; it doesn't evaluate the content of prompts.", fr: "La découverte de contenu restreinte exclut des sites de Copilot et des résultats de recherche ; elle n'évalue pas le contenu des invites." }
        b: { en: "Insider Risk Management detects risky AI usage and raises alerts; it doesn't change how Copilot grounds a response.", fr: "La gestion des risques internes détecte l'usage risqué de l'IA et génère des alertes ; elle ne change pas la façon dont Copilot fonde une réponse." }
        c: { en: "Communication Compliance captures matching prompts for reviewers after the fact; it doesn't block web search.", fr: "La conformité des communications capture les invites correspondantes pour les réviseurs après coup ; elle ne bloque pas la recherche web." }
    references:
      - title: Learn about using Microsoft Purview Data Loss Prevention to protect interactions with Microsoft 365 Copilot, Copilot Chat, and Cowork
        url: https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-41-05
    objective: "4.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank activated Microsoft Defender unified role-based access control (RBAC), including the Microsoft Security Exposure Management data source.

        A team of internal auditors must view Microsoft Secure Score and its recommended actions in the Microsoft Defender portal. They must not be able to change the status of an action, and they must not see incidents, devices or other Defender data. The solution must follow the principle of least privilege.

        What should you recommend?
      fr: |
        Woodgrove Bank a activé le contrôle d'accès en fonction du rôle (RBAC) unifié de Microsoft Defender, y compris la source de données Microsoft Security Exposure Management.

        Une équipe d'auditeurs internes doit consulter le Niveau de sécurité Microsoft (Microsoft Secure Score) et ses actions recommandées dans le portail Microsoft Defender. Elle ne doit pas pouvoir modifier le statut d'une action, ni voir les incidents, les appareils ou d'autres données de Defender. La solution doit respecter le principe du privilège minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "The Security Reader role in Microsoft Entra ID", fr: "Le rôle Security Reader dans Microsoft Entra ID" } }
        - { id: b, text: { en: "A custom role with the Exposure Management (manage) permission", fr: "Un rôle personnalisé avec l'autorisation Exposure Management (manage)" } }
        - { id: c, text: { en: "The Global Reader role in Microsoft Entra ID", fr: "Le rôle Global Reader dans Microsoft Entra ID" } }
        - { id: d, text: { en: "A custom role with the Exposure Management (read) permission", fr: "Un rôle personnalisé avec l'autorisation Exposure Management (read)" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          With Defender unified RBAC, Secure Score access comes from a custom role on the Microsoft Security Exposure Management data source. Exposure Management (read) gives read-only access to Secure Score, and the custom role grants nothing else in the Defender portal.
        fr: |
          Avec le RBAC unifié de Defender, l'accès au Niveau de sécurité Microsoft provient d'un rôle personnalisé sur la source de données Microsoft Security Exposure Management. Exposure Management (read) donne un accès en lecture seule au score, et le rôle personnalisé n'accorde rien d'autre dans le portail Defender.
      options:
        a: { en: "Security Reader is read-only on Secure Score, but it also reads incidents, alerts and other security data across the tenant.", fr: "Security Reader est en lecture seule sur le score, mais lit aussi les incidents, les alertes et d'autres données de sécurité du locataire." }
        b: { en: "Exposure Management (manage) lets users manage recommended actions, including their status.", fr: "Exposure Management (manage) permet de gérer les actions recommandées, y compris leur statut." }
        c: { en: "Global Reader reads Secure Score but also every setting of the tenant, far beyond the auditors' task.", fr: "Global Reader lit le score mais aussi tous les paramètres du locataire, bien au-delà de la tâche des auditeurs." }
    references:
      - title: Microsoft Secure Score
        url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-41-06
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has 2,000 users who use Exchange Online and Microsoft Teams. Today, the users have Exchange Online and Teams licenses only, with no Microsoft Defender for Office 365 license. The CISO lists three requirements:

        - Phishing email that is identified as malicious after delivery must be removed from mailboxes automatically.
        - Malicious messages in Teams chats that are identified after delivery must be removed automatically.
        - The security team must run phishing simulations and assign training to users who fall for them.

        For each requirement, you need to recommend the least expensive offering that meets it.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys compte 2 000 utilisateurs qui utilisent Exchange Online et Microsoft Teams. Aujourd'hui, les utilisateurs n'ont que des licences Exchange Online et Teams, sans licence Microsoft Defender for Office 365. Le RSSI énumère trois exigences :

        - Les e-mails d'hameçonnage identifiés comme malveillants après leur remise doivent être supprimés automatiquement des boîtes aux lettres.
        - Les messages malveillants des conversations Teams identifiés après leur remise doivent être supprimés automatiquement.
        - L'équipe de sécurité doit exécuter des simulations d'hameçonnage et attribuer une formation aux utilisateurs qui s'y laissent prendre.

        Pour chaque exigence, vous devez recommander l'offre la moins coûteuse qui y répond.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Remove malicious email after delivery: [[email]]

          Remove malicious Teams messages after delivery: [[teams]]

          Phishing simulations and training: [[sim]]
        fr: |
          Supprimer les e-mails malveillants après leur remise : [[email]]

          Supprimer les messages Teams malveillants après leur remise : [[teams]]

          Simulations d'hameçonnage et formation : [[sim]]
      slots:
        - id: email
          options:
            - { id: eop, text: { en: "Exchange Online Protection, already included", fr: "Exchange Online Protection, déjà inclus" } }
            - { id: p1, text: "Microsoft Defender for Office 365 Plan 1" }
            - { id: p2, text: "Microsoft Defender for Office 365 Plan 2" }
            - { id: mdca, text: "Microsoft Defender for Cloud Apps" }
        - id: teams
          options:
            - { id: eop, text: { en: "Exchange Online Protection, already included", fr: "Exchange Online Protection, déjà inclus" } }
            - { id: p1, text: "Microsoft Defender for Office 365 Plan 1" }
            - { id: p2, text: "Microsoft Defender for Office 365 Plan 2" }
            - { id: mdca, text: "Microsoft Defender for Cloud Apps" }
        - id: sim
          options:
            - { id: eop, text: { en: "Exchange Online Protection, already included", fr: "Exchange Online Protection, déjà inclus" } }
            - { id: p1, text: "Microsoft Defender for Office 365 Plan 1" }
            - { id: p2, text: "Microsoft Defender for Office 365 Plan 2" }
            - { id: mdca, text: "Microsoft Defender for Cloud Apps" }
    answer:
      values: { email: eop, teams: p1, sim: p2 }
    explanation:
      correct:
        en: |
          Zero-hour auto purge (ZAP) for email is a built-in feature of every cloud mailbox, with no special licensing: it quarantines or moves malware, phishing and spam found after delivery. ZAP for Microsoft Teams requires Defender for Office 365 Plan 1 or Plan 2. Attack simulation training is a Plan 2 capability.
        fr: |
          La purge automatique zéro heure (ZAP) pour les e-mails est une fonctionnalité intégrée à toute boîte aux lettres cloud, sans licence particulière : elle met en quarantaine ou déplace les programmes malveillants, l'hameçonnage et le courrier indésirable détectés après la remise. La ZAP pour Microsoft Teams exige Defender for Office 365 Plan 1 ou Plan 2. La formation à la simulation d'attaque est une fonctionnalité du Plan 2.
      options:
        email: { en: "Buying a Defender for Office 365 plan for email ZAP would add cost for a feature that EOP already provides.", fr: "Acheter un plan Defender for Office 365 pour la ZAP des e-mails ajouterait un coût pour une fonctionnalité qu'EOP fournit déjà." }
        teams: { en: "EOP alone doesn't include ZAP for Teams, and Plan 2 costs more than the Plan 1 that suffices.", fr: "EOP seul n'inclut pas la ZAP pour Teams, et le Plan 2 coûte plus cher que le Plan 1 qui suffit." }
    references:
      - title: Zero-hour auto purge (ZAP) in Microsoft Defender for Office 365
        url: https://learn.microsoft.com/en-us/defender-office-365/zero-hour-auto-purge
      - title: Microsoft Defender for Office 365 overview
        url: https://learn.microsoft.com/en-us/defender-office-365/mdo-about

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-41-07
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware, Inc. is an investment firm that has Microsoft 365 E5. Its compliance team lists the following requirements for data in Microsoft 365:

        - Litware must control the root keys that encrypt Exchange, SharePoint and Teams data at rest, and be able to make that data unreadable by revoking them. Search and eDiscovery must keep working.
        - DLP policies must detect merger and acquisition documents and patent drafts, which follow no fixed format.
        - Investigators must review Teams chats and Copilot prompts that contain threatening or harassing language.

        Which Microsoft Purview capability should you recommend for each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. est une société d'investissement qui dispose de Microsoft 365 E5. Son équipe de conformité énumère les exigences suivantes pour les données de Microsoft 365 :

        - Litware doit contrôler les clés racines qui chiffrent les données Exchange, SharePoint et Teams au repos, et pouvoir rendre ces données illisibles en les révoquant. La recherche et eDiscovery doivent continuer à fonctionner.
        - Les stratégies DLP doivent détecter les documents de fusion-acquisition et les projets de brevets, qui ne suivent aucun format fixe.
        - Les enquêteurs doivent examiner les conversations Teams et les invites Copilot qui contiennent des propos menaçants ou harcelants.

        Quelle fonctionnalité de Microsoft Purview devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: ck, text: "Customer Key" }
        - { id: dke, text: "Double Key Encryption" }
        - { id: tc, text: { en: "Trainable classifiers", fr: "Classifieurs entraînables" } }
        - { id: edm, text: { en: "Exact data match sensitive information types", fr: "Types d'informations sensibles de correspondance exacte des données" } }
        - { id: cc, text: { en: "Communication Compliance", fr: "Conformité des communications" } }
        - { id: irm, text: { en: "Insider Risk Management", fr: "Gestion des risques internes" } }
      targets:
        - id: t1
          text: { en: "Revocable root keys for data at rest, with search and eDiscovery still working", fr: "Clés racines révocables pour les données au repos, avec la recherche et eDiscovery toujours fonctionnelles" }
        - id: t2
          text: { en: "Detect merger documents and patent drafts that follow no fixed format", fr: "Détecter les documents de fusion et les projets de brevets qui ne suivent aucun format fixe" }
        - id: t3
          text: { en: "Review threatening or harassing language in Teams chats and Copilot prompts", fr: "Examiner les propos menaçants ou harcelants des conversations Teams et des invites Copilot" }
    answer:
      mapping: { t1: ck, t2: tc, t3: cc }
    explanation:
      correct:
        en: |
          Customer Key lets the organization control the root keys of service encryption at rest; revoking them leads to cryptographic deletion, while Microsoft 365 keeps using the keys for search indexing and eDiscovery. Trainable classifiers learn content categories, such as merger documents and patents, from examples instead of patterns, and DLP can use them as conditions. Communication Compliance detects harassing or threatening language in Teams chats and in Copilot prompts and responses, for review.
        fr: |
          Customer Key permet à l'organisation de contrôler les clés racines du chiffrement de service au repos ; leur révocation entraîne une suppression par chiffrement, tandis que Microsoft 365 continue d'utiliser les clés pour l'indexation de recherche et eDiscovery. Les classifieurs entraînables apprennent des catégories de contenu, comme les documents de fusion et les brevets, à partir d'exemples plutôt que de modèles, et la DLP peut les utiliser comme conditions. La conformité des communications détecte les propos harcelants ou menaçants dans les conversations Teams ainsi que dans les invites et réponses Copilot, pour examen.
      options:
        dke: { en: "Double Key Encryption keeps one key outside Microsoft's cloud, so services such as search and eDiscovery can't read the protected content.", fr: "Double Key Encryption garde une clé hors du cloud de Microsoft : des services comme la recherche et eDiscovery ne peuvent pas lire le contenu protégé." }
        edm: { en: "Exact data match finds values from a known table, such as customer records, not document categories without a fixed format.", fr: "La correspondance exacte des données trouve des valeurs d'une table connue, comme des fiches clients, pas des catégories de documents sans format fixe." }
        irm: { en: "Insider Risk Management correlates risky user activities, such as data theft by departing users, rather than reviewing message content.", fr: "La gestion des risques internes corrèle les activités utilisateur risquées, comme le vol de données par des utilisateurs sur le départ, au lieu d'examiner le contenu des messages." }
    references:
      - title: Service encryption with Microsoft Purview Customer Key
        url: https://learn.microsoft.com/en-us/purview/customer-key-overview
      - title: Learn about trainable classifiers
        url: https://learn.microsoft.com/en-us/purview/trainable-classifiers-learn-about

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-41-08
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso, Ltd. manages devices with Microsoft Intune:

        - Corporate Windows 11 laptops are Microsoft Entra joined and enrolled in Intune.
        - Personally owned Android phones are enrolled with a personally owned work profile.
        - Personal iPhones aren't enrolled; Outlook on them is protected by an app protection policy.

        An employee who has a corporate laptop, an Android phone and an iPhone leaves the company. The laptop was stolen the day before.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. gère ses appareils avec Microsoft Intune :

        - Les ordinateurs portables Windows 11 d'entreprise sont joints à Microsoft Entra et inscrits dans Intune.
        - Les téléphones Android personnels sont inscrits avec un profil professionnel sur appareil personnel.
        - Les iPhone personnels ne sont pas inscrits ; Outlook y est protégé par une stratégie de protection des applications.

        Un employé qui dispose d'un ordinateur portable d'entreprise, d'un téléphone Android et d'un iPhone quitte l'entreprise. L'ordinateur portable a été volé la veille.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: The Retire action on the Android phone removes the apps and data of the work profile and leaves the employee's personal photos on the phone.
            fr: L'action Retire sur le téléphone Android supprime les applications et les données du profil professionnel et laisse les photos personnelles de l'employé sur le téléphone.
        - id: s2
          text:
            en: The Wipe action with no option selected on the stolen laptop removes the MDM policies but keeps the user's files on the device.
            fr: L'action Wipe sans option sélectionnée sur l'ordinateur portable volé supprime les stratégies MDM mais conserve les fichiers de l'utilisateur sur l'appareil.
        - id: s3
          text:
            en: A selective wipe of the app protection data removes the corporate data from Outlook on the iPhone even if the employee never opens Outlook again.
            fr: Une réinitialisation sélective des données de protection des applications supprime les données d'entreprise d'Outlook sur l'iPhone même si l'employé n'ouvre plus jamais Outlook.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Retire removes company data without a factory reset: on a personally owned work profile device, it removes all data, apps and settings of the work profile and leaves personal data. Wipe with no option selected resets a Windows device to factory settings and deletes all user data, which fits a stolen corporate laptop. A selective wipe of app protection data takes effect the next time the app runs, so the user must open Outlook for the corporate data to be removed.
        fr: |
          Retire supprime les données d'entreprise sans réinitialisation aux paramètres d'usine : sur un appareil personnel avec profil professionnel, il supprime toutes les données, applications et paramètres du profil professionnel et laisse les données personnelles. Wipe sans option sélectionnée rétablit les paramètres d'usine d'un appareil Windows et supprime toutes les données de l'utilisateur, ce qui convient à un ordinateur portable d'entreprise volé. Une réinitialisation sélective des données de protection des applications prend effet à la prochaine exécution de l'application : l'utilisateur doit ouvrir Outlook pour que les données d'entreprise soient supprimées.
    references:
      - title: Remotely retire devices with Microsoft Intune
        url: https://learn.microsoft.com/en-us/intune/intune-service/remote-actions/device-retire
      - title: How to wipe only corporate data from Intune-managed apps
        url: https://learn.microsoft.com/en-us/intune/intune-service/apps/apps-selective-wipe

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-41-09
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank gives corporate iPhones to its traders and lets other employees use personal iPhones. Microsoft Authenticator is installed on every iPhone, and Woodgrove has Microsoft 365 E5.

        The design for access to Exchange Online from iOS must meet the following requirements:

        - Corporate iPhones are enrolled in Intune. They must meet the passcode and minimum iOS version standard, and then can use any mail app, including the native Mail app.
        - Personal iPhones won't be enrolled. They can access email only through Outlook, with corporate data that can't be copied to personal apps.
        - A single Conditional Access policy must cover both kinds of iPhones.

        Which three components should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank fournit des iPhone d'entreprise à ses traders et laisse les autres employés utiliser des iPhone personnels. Microsoft Authenticator est installé sur chaque iPhone, et Woodgrove dispose de Microsoft 365 E5.

        La conception de l'accès à Exchange Online depuis iOS doit répondre aux exigences suivantes :

        - Les iPhone d'entreprise sont inscrits dans Intune. Ils doivent respecter la norme de code secret et de version iOS minimale, puis peuvent utiliser n'importe quelle application de messagerie, y compris l'application Mail native.
        - Les iPhone personnels ne seront pas inscrits. Ils ne peuvent accéder à la messagerie que par Outlook, avec des données d'entreprise qui ne peuvent pas être copiées vers des applications personnelles.
        - Une seule stratégie d'accès conditionnel doit couvrir les deux types d'iPhone.

        Quels sont les trois composants que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "An Intune compliance policy for iOS that checks the passcode and the iOS version", fr: "Une stratégie de conformité Intune pour iOS qui vérifie le code secret et la version d'iOS" } }
        - { id: b, text: { en: "An Intune app protection policy for Outlook that blocks copying data to personal apps", fr: "Une stratégie de protection des applications Intune pour Outlook qui bloque la copie des données vers les applications personnelles" } }
        - { id: c, text: { en: "A Conditional Access policy with both grants and Require all the selected controls", fr: "Une stratégie d'accès conditionnel avec les deux contrôles d'octroi et Require all the selected controls" } }
        - { id: d, text: { en: "A Conditional Access policy with both grants and Require one of the selected controls", fr: "Une stratégie d'accès conditionnel avec les deux contrôles d'octroi et Require one of the selected controls" } }
        - { id: e, text: { en: "A Conditional Access policy with only the Require approved client app grant", fr: "Une stratégie d'accès conditionnel avec uniquement le contrôle d'octroi Require approved client app" } }
        - { id: f, text: { en: "An Intune device restrictions profile for iOS that blocks copy and paste on personal iPhones", fr: "Un profil de restrictions d'appareil Intune pour iOS qui bloque le copier-coller sur les iPhone personnels" } }
    answer: { optionIds: [ a, b, d ] }
    explanation:
      correct:
        en: |
          The compliance policy makes enrolled corporate iPhones compliant only when they meet the standard, and the app protection policy protects Outlook data on unenrolled phones. One Conditional Access policy that combines Require device to be marked as compliant and Require app protection policy with Require one of the selected controls lets a compliant corporate iPhone use any mail app, while a personal iPhone, which can't be compliant, passes only through protected Outlook. App protection requires the device to be registered through a broker app, here Authenticator.
        fr: |
          La stratégie de conformité ne rend les iPhone d'entreprise inscrits conformes que s'ils respectent la norme, et la stratégie de protection des applications protège les données d'Outlook sur les téléphones non inscrits. Une seule stratégie d'accès conditionnel qui combine Require device to be marked as compliant et Require app protection policy avec Require one of the selected controls permet à un iPhone d'entreprise conforme d'utiliser n'importe quelle application de messagerie, tandis qu'un iPhone personnel, qui ne peut pas être conforme, ne passe que par Outlook protégé. La protection des applications exige que l'appareil soit inscrit dans Microsoft Entra ID par une application broker, ici Authenticator.
      options:
        c: { en: "Requiring both controls would block personal iPhones, which can't be marked compliant, and the native Mail app on corporate iPhones.", fr: "Exiger les deux contrôles bloquerait les iPhone personnels, qui ne peuvent pas être marqués conformes, et l'application Mail native sur les iPhone d'entreprise." }
        e: { en: "The approved client app grant is retiring; new policies should use Require app protection policy, and this grant alone ignores device compliance.", fr: "Le contrôle d'octroi des applications clientes approuvées est en cours de retrait ; les nouvelles stratégies doivent utiliser Require app protection policy, et ce contrôle seul ignore la conformité des appareils." }
        f: { en: "Device restrictions profiles apply only to enrolled devices, and personal iPhones won't be enrolled.", fr: "Les profils de restrictions d'appareil ne s'appliquent qu'aux appareils inscrits, et les iPhone personnels ne seront pas inscrits." }
    references:
      - title: "Conditional Access: Grant"
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-41-10
    objective: "4.1.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam, Inc. has Microsoft 365 E5 and Microsoft 365 Copilot licenses for all employees. The legal department investigates an employee suspected of using Copilot to collect confidential acquisition data. It sets three requirements:

        - Identify the files that Copilot accessed to answer each of the employee's prompts, and the sensitivity label of each file.
        - Keep the Copilot audit records of all users for one year instead of the default period.
        - Give outside counsel the text of the employee's prompts and of Copilot's responses.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. dispose de licences Microsoft 365 E5 et Microsoft 365 Copilot pour tous ses employés. Le service juridique enquête sur un employé soupçonné d'utiliser Copilot pour rassembler des données confidentielles sur une acquisition. Il fixe trois exigences :

        - Identifier les fichiers auxquels Copilot a accédé pour répondre à chacune des invites de l'employé, et l'étiquette de confidentialité de chaque fichier.
        - Conserver les enregistrements d'audit Copilot de tous les utilisateurs pendant un an au lieu de la durée par défaut.
        - Fournir à l'avocat externe le texte des invites de l'employé et des réponses de Copilot.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Files accessed and their labels: [[files]]

          One-year retention of the records: [[keep]]

          Text of prompts and responses: [[text]]
        fr: |
          Fichiers consultés et leurs étiquettes : [[files]]

          Conservation des enregistrements pendant un an : [[keep]]

          Texte des invites et des réponses : [[text]]
      slots:
        - id: files
          options:
            - { id: audit, text: { en: "An Audit search of the Copilot interaction records", fr: "Une recherche Audit des enregistrements d'interactions Copilot" } }
            - { id: ediscovery, text: { en: "An eDiscovery search of the employee's mailbox", fr: "Une recherche eDiscovery dans la boîte aux lettres de l'employé" } }
            - { id: dra, text: { en: "A data risk assessment in Data Security Posture Management", fr: "Une évaluation des risques liés aux données dans Data Security Posture Management" } }
        - id: keep
          options:
            - { id: auditret, text: { en: "An audit log retention policy for the Copilot interaction records", fr: "Une stratégie de rétention des journaux d'audit pour les enregistrements d'interactions Copilot" } }
            - { id: ret, text: { en: "A retention policy for Microsoft 365 Copilot interactions", fr: "Une stratégie de rétention pour les interactions Microsoft 365 Copilot" } }
            - { id: hold, text: { en: "An eDiscovery hold on all mailboxes", fr: "Une conservation eDiscovery sur toutes les boîtes aux lettres" } }
        - id: text
          options:
            - { id: auditexp, text: { en: "An export of the Audit search results", fr: "Une exportation des résultats de la recherche Audit" } }
            - { id: edexp, text: { en: "An eDiscovery search on the Copilot activity item class, then an export", fr: "Une recherche eDiscovery sur la classe d'élément Copilot activity, puis une exportation" } }
            - { id: cc, text: { en: "A Communication Compliance policy scoped to the employee", fr: "Une stratégie de conformité des communications limitée à l'employé" } }
    answer:
      values: { files: audit, keep: auditret, text: edexp }
    explanation:
      correct:
        en: |
          Copilot interaction audit records list the resources Copilot accessed for each request, with the sensitivity label of each resource. With E5, audit records other than Exchange, SharePoint, OneDrive and Entra ID are kept 180 days by default; an audit log retention policy keeps them for one year. The prompts and responses themselves are stored in the user's Exchange mailbox, so an eDiscovery search on the Copilot activity item class finds them for export.
        fr: |
          Les enregistrements d'audit des interactions Copilot listent les ressources auxquelles Copilot a accédé pour chaque demande, avec l'étiquette de confidentialité de chaque ressource. Avec E5, les enregistrements d'audit autres qu'Exchange, SharePoint, OneDrive et Entra ID sont conservés 180 jours par défaut ; une stratégie de rétention des journaux d'audit les conserve un an. Les invites et les réponses elles-mêmes sont stockées dans la boîte aux lettres Exchange de l'utilisateur : une recherche eDiscovery sur la classe d'élément Copilot activity les trouve pour l'exportation.
      options:
        files: { en: "The mailbox holds the conversation text, not the list of resources accessed and their labels; a data risk assessment looks at overshared sites, not one user's prompts.", fr: "La boîte aux lettres contient le texte de la conversation, pas la liste des ressources consultées et de leurs étiquettes ; une évaluation des risques liés aux données porte sur les sites surpartagés, pas sur les invites d'un utilisateur." }
        keep: { en: "A retention policy for Copilot interactions keeps the prompts and responses in mailboxes, not the audit records.", fr: "Une stratégie de rétention pour les interactions Copilot conserve les invites et les réponses dans les boîtes aux lettres, pas les enregistrements d'audit." }
        text: { en: "Audit records reference prompt and response messages by ID; the text itself is in the mailbox.", fr: "Les enregistrements d'audit référencent les messages d'invite et de réponse par leur ID ; le texte lui-même se trouve dans la boîte aux lettres." }
    references:
      - title: Audit logs for Copilot and AI applications
        url: https://learn.microsoft.com/en-us/purview/audit-copilot
      - title: Search for and delete Copilot data in eDiscovery
        url: https://learn.microsoft.com/en-us/purview/edisc-search-copilot-data
