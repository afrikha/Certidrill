chapter: 23-privileged-access
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-23-01
    objective: "2.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. uses entitlement management. An access package named **Vendor Onboarding** lets users create supplier records, and an access package named **Vendor Payments** lets users approve supplier payments.

        A user who has one of the two access packages must not be able to obtain the other one.

        What should you recommend?
      fr: |
        Contoso, Ltd. utilise la gestion des droits d'utilisation. Un package d'accès nommé **Vendor Onboarding** permet aux utilisateurs de créer des fiches fournisseurs, et un package d'accès nommé **Vendor Payments** leur permet d'approuver les paiements des fournisseurs.

        Un utilisateur qui détient l'un des deux packages d'accès ne doit pas pouvoir obtenir l'autre.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Require approval by the finance manager in both request policies", fr: "Exiger l'approbation du responsable financier dans les deux stratégies de demande" } }
        - { id: b, text: { en: "Mark each access package as incompatible with the other one", fr: "Marquer chaque package d'accès comme incompatible avec l'autre" } }
        - { id: c, text: { en: "Create a quarterly access review of both access packages", fr: "Créer une révision d'accès trimestrielle des deux packages d'accès" } }
        - { id: d, text: { en: "Make the assignments of both packages expire after 30 days", fr: "Faire expirer les attributions des deux packages au bout de 30 jours" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Separation of duties checks in entitlement management block a request, or an administrator assignment, when the user already has an access package listed as incompatible. Each incompatibility is one-way, so each package lists the other one to block both directions.
        fr: |
          Les contrôles de séparation des tâches de la gestion des droits d'utilisation bloquent une demande, ou une attribution par un administrateur, quand l'utilisateur détient déjà un package d'accès déclaré incompatible. Chaque incompatibilité est unidirectionnelle : chaque package liste donc l'autre pour bloquer les deux sens.
      options:
        a: { en: "An approver can still approve the second package by mistake: approval doesn't enforce the rule.", fr: "Un approbateur peut encore approuver le second package par erreur : l'approbation n'impose pas la règle." }
        c: { en: "A review finds conflicting access after it was granted, instead of preventing it.", fr: "Une révision trouve l'accès conflictuel après son octroi, au lieu de l'empêcher." }
        d: { en: "Expiration limits how long access lasts, not which combinations of packages a user can hold.", fr: "L'expiration limite la durée de l'accès, pas les combinaisons de packages qu'un utilisateur peut détenir." }
    references:
      - title: Configure separation of duties for an access package in entitlement management
        url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-access-package-incompatible

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-23-02
    objective: "2.3.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. will give privileged access workstations (PAWs) to its 12 identity and cloud platform administrators. Fabrikam has Microsoft 365 E5, and its devices are managed by Microsoft Intune.

        How should the PAWs be provisioned, according to Microsoft's privileged access guidance?
      fr: |
        Fabrikam, Inc. va fournir des stations de travail à accès privilégié (PAW) à ses 12 administrateurs des identités et de la plateforme cloud. Fabrikam dispose de Microsoft 365 E5, et ses appareils sont gérés par Microsoft Intune.

        Comment les PAW doivent-elles être provisionnées, selon les recommandations de Microsoft sur l'accès privilégié ?
    body:
      options:
        - { id: a, text: { en: "Reuse the administrators' current laptops after removing their local admin rights", fr: "Réutiliser les ordinateurs portables actuels des administrateurs après leur avoir retiré les droits d'administrateur local" } }
        - { id: b, text: { en: "Let the administrators enroll their personal devices in Intune as PAWs", fr: "Laisser les administrateurs inscrire leurs appareils personnels dans Intune comme PAW" } }
        - { id: c, text: { en: "Register new devices in Windows Autopilot, then harden them with Intune", fr: "Inscrire de nouveaux appareils dans Windows Autopilot, puis les renforcer avec Intune" } }
        - { id: d, text: { en: "Join new devices to AD DS, and grant local admin rights to install tools", fr: "Joindre de nouveaux appareils à AD DS, et accorder les droits d'administrateur local pour installer des outils" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The privileged access deployment registers the devices in Windows Autopilot, ideally by the OEM or reseller at procurement, and applies the privileged profile through Intune: hardening policies, Defender for Endpoint, no local administrators and no personal devices. Conditional Access then allows administrative interfaces only from these compliant devices.
        fr: |
          Le déploiement de l'accès privilégié inscrit les appareils dans Windows Autopilot, idéalement par le fabricant ou le revendeur à l'achat, et applique le profil privilégié par Intune : stratégies de renforcement, Defender for Endpoint, aucun administrateur local et aucun appareil personnel. L'accès conditionnel n'autorise ensuite les interfaces d'administration que depuis ces appareils conformes.
      options:
        a: { en: "A laptop already used for email and browsing isn't a clean source: it may already be compromised.", fr: "Un ordinateur portable déjà utilisé pour la messagerie et la navigation n'est pas une source propre : il est peut-être déjà compromis." }
        b: { en: "The guidance blocks personally owned devices: a PAW must be a dedicated, company-controlled device.", fr: "Les recommandations bloquent les appareils personnels : une PAW doit être un appareil dédié contrôlé par l'entreprise." }
        d: { en: "PAW users must have no administrator rights on their devices, so that malware can't weaken the hardening.", fr: "Les utilisateurs de PAW ne doivent avoir aucun droit d'administrateur sur leurs appareils, pour que les logiciels malveillants ne puissent pas affaiblir le renforcement." }
    references:
      - title: Deploying a privileged access solution
        url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-deployment

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-23-03
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        At Tailspin Toys, an application team creates AKS clusters and container registries in a resource group named **RG-Apps**. The team must be able to assign the AcrPull role on its registries to the managed identities of its clusters, without waiting for the central IT team.

        The team must not be able to assign any other role, or to assign AcrPull to users. The solution must follow the principle of least privilege.

        What should you recommend?
      fr: |
        Chez Tailspin Toys, une équipe applicative crée des clusters AKS et des registres de conteneurs dans un groupe de ressources nommé **RG-Apps**. L'équipe doit pouvoir attribuer le rôle AcrPull sur ses registres aux identités managées de ses clusters, sans attendre l'équipe informatique centrale.

        L'équipe ne doit pouvoir attribuer aucun autre rôle, ni attribuer AcrPull à des utilisateurs. La solution doit respecter le principe du privilège minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Owner on RG-Apps, with an Azure Policy that audits new role assignments", fr: "Owner sur RG-Apps, avec une stratégie Azure Policy qui audite les nouvelles attributions de rôles" } }
        - { id: b, text: { en: "User Access Administrator on RG-Apps, with PIM approval for each activation", fr: "User Access Administrator sur RG-Apps, avec une approbation PIM pour chaque activation" } }
        - { id: c, text: { en: "Role Based Access Control Administrator on RG-Apps, eligible through PIM for 4 hours", fr: "Role Based Access Control Administrator sur RG-Apps, éligible par PIM pour 4 heures" } }
        - { id: d, text: { en: "Role Based Access Control Administrator on RG-Apps, with a condition on AcrPull and service principals", fr: "Role Based Access Control Administrator sur RG-Apps, avec une condition sur AcrPull et les principaux de service" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Role Based Access Control Administrator is designed to delegate role assignment management with fewer permissions than User Access Administrator. An Azure ABAC condition on the assignment can limit which roles the delegate assigns and to which principal types, here AcrPull for service principals only; any other assignment attempt fails.
        fr: |
          Role Based Access Control Administrator est conçu pour déléguer la gestion des attributions de rôles avec moins d'autorisations que User Access Administrator. Une condition Azure ABAC sur l'attribution peut limiter les rôles que le délégué attribue et les types de principaux concernés, ici AcrPull pour les principaux de service seulement ; toute autre tentative d'attribution échoue.
      options:
        a: { en: "Owner gives unrestricted access, and an audit policy reports assignments without preventing them.", fr: "Owner donne un accès illimité, et une stratégie d'audit signale les attributions sans les empêcher." }
        b: { en: "Once active, User Access Administrator can assign any role, including Owner, to any principal.", fr: "Une fois actif, User Access Administrator peut attribuer n'importe quel rôle, y compris Owner, à n'importe quel principal." }
        c: { en: "Without a condition, the role can assign any role to any principal during each activation.", fr: "Sans condition, le rôle peut attribuer n'importe quel rôle à n'importe quel principal pendant chaque activation." }
    references:
      - title: Delegate Azure access management to others
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/delegate-role-assignments-overview

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-23-04
    objective: "2.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. has 40 Azure subscriptions in a management group hierarchy. Global Administrators are eligible in Privileged Identity Management with a two-hour activation.

        During an incident, a Global Administrator activated the role, used **elevate access** in Microsoft Entra ID to restore an Owner assignment on a subscription, and let the PIM activation expire. The security policy requires that no standing privilege remains on the Azure hierarchy after such a task.

        What should you recommend?
      fr: |
        Litware, Inc. dispose de 40 abonnements Azure dans une hiérarchie de groupes d'administration. Les Global Administrators sont éligibles dans Privileged Identity Management avec une activation de deux heures.

        Pendant un incident, un Global Administrator a activé le rôle, utilisé l'**élévation d'accès** dans Microsoft Entra ID pour rétablir une attribution Owner sur un abonnement, puis laissé expirer l'activation PIM. La stratégie de sécurité exige qu'aucun privilège permanent ne subsiste sur la hiérarchie Azure après une telle tâche.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "No action: the elevated access ends with the Global Administrator activation", fr: "Aucune action : l'accès élevé prend fin avec l'activation Global Administrator" } }
        - { id: b, text: { en: "Reduce the maximum activation duration of Global Administrator to one hour", fr: "Réduire la durée d'activation maximale de Global Administrator à une heure" } }
        - { id: c, text: { en: "Turn elevated access off before the Global Administrator role is deactivated", fr: "Désactiver l'accès élevé avant la désactivation du rôle Global Administrator" } }
        - { id: d, text: { en: "Review the Global Administrator assignments every week in an access review", fr: "Réviser chaque semaine les attributions Global Administrator dans une révision d'accès" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Elevate access assigns User Access Administrator at the root scope, which covers every management group and subscription, and the assignment stays until it is removed. Deactivating the PIM role doesn't reset the toggle, so the administrator sets it back to No, as the same user, before the role is deactivated.
        fr: |
          L'élévation d'accès attribue User Access Administrator à l'étendue racine, qui couvre tous les groupes d'administration et abonnements, et l'attribution reste jusqu'à son retrait. La désactivation du rôle PIM ne réinitialise pas le paramètre : l'administrateur le remet donc à Non, avec le même compte, avant la désactivation du rôle.
      options:
        a: { en: "The User Access Administrator assignment at root scope persists after the PIM activation ends.", fr: "L'attribution User Access Administrator à l'étendue racine persiste après la fin de l'activation PIM." }
        b: { en: "A shorter activation doesn't remove the root assignment, which isn't tied to the activation.", fr: "Une activation plus courte ne retire pas l'attribution racine, qui n'est pas liée à l'activation." }
        d: { en: "Reviewing the Global Administrator role doesn't cover the Azure role assignment created at root scope.", fr: "Réviser le rôle Global Administrator ne couvre pas l'attribution de rôle Azure créée à l'étendue racine." }
    references:
      - title: Elevate access to manage all Azure subscriptions and management groups
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-23-05
    objective: "2.3.5"
    difficulty: 2
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove Bank is cleaning up the permissions of its cloud identities. Its 15 Azure subscriptions and 8 AWS accounts are connected to Microsoft Defender for Cloud, with Defender CSPM enabled on every connector. Every employee has a Microsoft Entra ID P2 license, and an audit found standing Owner and Contributor assignments that nobody has confirmed for two years.

        Which solution should you recommend for each permission requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank nettoie les autorisations de ses identités cloud. Ses 15 abonnements Azure et ses 8 comptes AWS sont connectés à Microsoft Defender pour le cloud, avec Defender CSPM activé sur chaque connecteur. Chaque employé dispose d'une licence Microsoft Entra ID P2, et un audit a trouvé des attributions Owner et Contributor permanentes que personne n'a confirmées depuis deux ans.

        Quelle solution devez-vous recommander pour chaque exigence d'autorisation ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: ciem, text: { en: "CIEM recommendations of Defender CSPM", fr: "Recommandations CIEM de Defender CSPM" } }
        - { id: pim, text: { en: "PIM for Azure resources", fr: "PIM pour les ressources Azure" } }
        - { id: ar, text: { en: "Access reviews of Azure resource roles", fr: "Révisions d'accès des rôles de ressources Azure" } }
        - { id: epm, text: Microsoft Entra Permissions Management }
        - { id: mdi, text: Microsoft Defender for Identity }
      targets:
        - id: t1
          text: { en: "List the AWS IAM roles and users that hold more permissions than they use, and the guest or blocked accounts that still have Azure access", fr: "Lister les rôles et utilisateurs IAM AWS qui détiennent plus d'autorisations qu'ils n'en utilisent, et les comptes invités ou bloqués qui ont encore un accès Azure" }
        - id: t2
          text: { en: "Make the Owner role on the production subscription usable only for a few hours, after approval", fr: "Rendre le rôle Owner de l'abonnement de production utilisable seulement quelques heures, après approbation" }
        - id: t3
          text: { en: "Have a security manager confirm every quarter that each Contributor assignment is still needed", fr: "Faire confirmer chaque trimestre par un responsable sécurité que chaque attribution Contributor est encore nécessaire" }
    answer:
      mapping: { t1: ciem, t2: pim, t3: ar }
    explanation:
      correct:
        en: |
          CIEM in Defender CSPM analyzes Microsoft Entra identities and AWS IAM users, roles and groups, with recommendations to remove inactive, guest or blocked accounts and to right-size overprovisioned permissions. PIM makes Azure roles eligible, with approval and a limited activation. An access review of Azure resource roles asks reviewers whether each assignment should continue.
        fr: |
          La CIEM de Defender CSPM analyse les identités Microsoft Entra et les utilisateurs, rôles et groupes IAM AWS, avec des recommandations pour retirer les comptes inactifs, invités ou bloqués et ajuster les autorisations surdimensionnées. PIM rend les rôles Azure éligibles, avec approbation et activation limitée. Une révision d'accès des rôles de ressources Azure demande aux réviseurs si chaque attribution doit continuer.
      options:
        epm: { en: "Microsoft Entra Permissions Management is retired; its CIEM capabilities live on in Defender CSPM.", fr: "Microsoft Entra Permissions Management est mis hors service ; les capacités CIEM se poursuivent dans Defender CSPM." }
        mdi: { en: "Defender for Identity protects on-premises AD DS, not the permissions of Azure and AWS identities.", fr: "Defender for Identity protège AD DS en local, pas les autorisations des identités Azure et AWS." }
    references:
      - title: Cloud infrastructure entitlement management (CIEM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/permissions-management
      - title: Create an access review of Azure resource and Microsoft Entra roles in PIM
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-create-roles-and-resource-roles-review

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-23-06
    objective: "2.3.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. is evaluating its privileged remote access against Microsoft's guidance for privileged access intermediaries. All administrators already use compliant privileged access workstations (PAWs).

        - Azure virtual machines are administered through Azure Bastion, opened from the Azure portal.
        - Domain Admins check out their passwords from a privileged access management (PAM) solution to make forest-level changes.
        - On-premises jump servers are shared by the Domain Admins and by the administrators of business applications, and are hardened to the specialized security level.

        Which two recommendations should you include in the evaluation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. évalue son accès à distance privilégié par rapport aux recommandations de Microsoft sur les intermédiaires d'accès privilégié. Tous les administrateurs utilisent déjà des stations de travail à accès privilégié (PAW) conformes.

        - Les machines virtuelles Azure sont administrées par Azure Bastion, ouvert depuis le portail Azure.
        - Les Domain Admins extraient leurs mots de passe d'une solution de gestion des accès privilégiés (PAM) pour effectuer des modifications au niveau de la forêt.
        - Des serveurs de rebond locaux sont partagés par les Domain Admins et par les administrateurs des applications métier, et sont renforcés au niveau de sécurité spécialisé.

        Quelles deux recommandations devez-vous inclure dans l'évaluation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Require the Azure portal sessions that open Bastion to meet the privileged security level", fr: "Exiger que les sessions du portail Azure qui ouvrent Bastion atteignent le niveau de sécurité privilégié" } }
        - { id: b, text: { en: "Require a second person in the PAM workflows used for business-critical changes", fr: "Exiger une deuxième personne dans les workflows PAM utilisés pour les modifications critiques" } }
        - { id: c, text: { en: "Keep the shared jump servers, because the specialized level fits both groups", fr: "Conserver les serveurs de rebond partagés, car le niveau spécialisé convient aux deux groupes" } }
        - { id: d, text: { en: "Rely on the PAM solution to protect checked-out passwords if a PAW is compromised", fr: "S'appuyer sur la solution PAM pour protéger les mots de passe extraits si une PAW est compromise" } }
        - { id: e, text: { en: "Replace Bastion with direct RDP restricted by NSG rules to the PAWs' public IPs", fr: "Remplacer Bastion par du RDP direct limité par des règles NSG aux IP publiques des PAW" } }
      choose: 2
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Azure Bastion is reached through the Azure portal, so the portal must require the security level of the roles that use it, typically privileged. PAM solutions mitigate some attacks, and Microsoft recommends a second person in business-critical workflows to raise the cost of insider collusion.
        fr: |
          Azure Bastion s'atteint par le portail Azure : le portail doit donc exiger le niveau de sécurité des rôles qui l'utilisent, généralement privilégié. Les solutions PAM atténuent certaines attaques, et Microsoft recommande une deuxième personne dans les workflows critiques pour augmenter le coût d'une collusion interne.
      options:
        c: { en: "Intermediaries used by privileged roles need additional controls, with administrative rights restricted to privileged roles: a shared specialized server doesn't meet that.", fr: "Les intermédiaires utilisés par des rôles privilégiés exigent des contrôles supplémentaires, avec des droits d'administration réservés aux rôles privilégiés : un serveur spécialisé partagé n'y répond pas." }
        d: { en: "A PAM solution can't reliably see or mitigate device risk: an attacker on the device uses the credentials while the user is signed in.", fr: "Une solution PAM ne peut pas voir ni atténuer de façon fiable le risque lié à l'appareil : un attaquant sur l'appareil utilise les informations d'identification pendant que l'utilisateur est connecté." }
        e: { en: "Direct RDP has limited protections against modern attacks and should be converted to a gateway or to Azure Bastion, not the reverse.", fr: "Le RDP direct a des protections limitées contre les attaques modernes et doit être converti vers une passerelle ou Azure Bastion, pas l'inverse." }
    references:
      - title: Securing privileged access intermediaries
        url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-intermediaries

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-23-07
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso, Ltd. is evaluating the resilience of its AD DS forest after a red team exercise. The forest includes an enterprise certification authority based on AD CS. The red team used the three techniques in the answer area.

        You need to recommend, for each technique, the control that prevents it from succeeding again.

        Which control should you recommend for each technique? To answer, drag the appropriate controls to the correct techniques. Each control may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. évalue la résilience de sa forêt AD DS après un exercice de red team. La forêt comprend une autorité de certification d'entreprise basée sur AD CS. La red team a utilisé les trois techniques de la zone de réponse.

        Vous devez recommander, pour chaque technique, le contrôle qui l'empêche de réussir à nouveau.

        Quel contrôle devez-vous recommander pour chaque technique ? Pour répondre, faites glisser les contrôles appropriés vers les techniques correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: cg, text: { en: "Credential Guard on workstations and member servers", fr: "Credential Guard sur les postes de travail et les serveurs membres" } }
        - { id: repl, text: { en: "Replication rights restricted to domain controllers", fr: "Droits de réplication réservés aux contrôleurs de domaine" } }
        - { id: adcs, text: { en: "AD CS treated as tier 0, with its templates reviewed", fr: "AD CS traité comme tier 0, avec ses modèles révisés" } }
        - { id: krbtgt, text: { en: "Two resets of the krbtgt account password", fr: "Deux réinitialisations du mot de passe du compte krbtgt" } }
        - { id: laps, text: { en: "Windows LAPS on all member servers", fr: "Windows LAPS sur tous les serveurs membres" } }
      targets:
        - id: t1
          text: { en: "Malware with local administrator rights on a workstation extracted NTLM hashes and a Kerberos TGT from memory and reused them", fr: "Un logiciel malveillant avec des droits d'administrateur local sur un poste de travail a extrait de la mémoire des hachages NTLM et un TGT Kerberos, puis les a réutilisés" }
        - id: t2
          text: { en: "A compromised help desk account that had been granted Replicating Directory Changes All retrieved the password hashes of all users", fr: "Un compte du support compromis, qui avait reçu Replicating Directory Changes All, a récupéré les hachages de mot de passe de tous les utilisateurs" }
        - id: t3
          text: { en: "A user enrolled a certificate from a template that lets the requester supply the subject name, then signed in as a Domain Admin", fr: "Un utilisateur a obtenu un certificat à partir d'un modèle qui laisse le demandeur fournir le nom du sujet, puis s'est connecté en tant que Domain Admin" }
    answer:
      mapping: { t1: cg, t2: repl, t3: adcs }
    explanation:
      correct:
        en: |
          Credential Guard isolates NTLM hashes and Kerberos TGTs with virtualization-based security, so even malware with administrative rights can't extract them for pass-the-hash or pass-the-ticket. A DCSync attack abuses replication rights, which only domain controllers need. Template abuse is mitigated by treating AD CS as tier 0 and reviewing vulnerable templates, which Defender for Identity reports in its certificate assessments.
        fr: |
          Credential Guard isole les hachages NTLM et les TGT Kerberos avec la sécurité basée sur la virtualisation : même un logiciel malveillant doté de droits d'administration ne peut pas les extraire pour un pass-the-hash ou un pass-the-ticket. Une attaque DCSync abuse des droits de réplication, dont seuls les contrôleurs de domaine ont besoin. L'abus de modèles s'atténue en traitant AD CS comme tier 0 et en révisant les modèles vulnérables, que Defender for Identity signale dans ses évaluations des certificats.
      options:
        krbtgt: { en: "Resetting krbtgt twice invalidates forged tickets after a compromise, but the account that holds replication rights could run DCSync again.", fr: "Réinitialiser deux fois krbtgt invalide les tickets falsifiés après une compromission, mais le compte qui détient les droits de réplication pourrait relancer DCSync." }
        laps: { en: "Windows LAPS makes local administrator passwords unique; it doesn't protect domain credentials cached in memory.", fr: "Windows LAPS rend uniques les mots de passe d'administrateur local ; il ne protège pas les informations d'identification de domaine en mémoire." }
    references:
      - title: Credential Guard
        url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/
      - title: Microsoft Defender for Identity Security Posture Assessments
        url: https://learn.microsoft.com/en-us/defender-for-identity/security-assessment

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-23-08
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has Microsoft Entra ID P2 licenses and manages its Microsoft Entra roles with Privileged Identity Management (PIM). You are evaluating the governance of these roles. The evaluation finds the following:

        - A provisioning script assigns Microsoft Entra roles directly through Microsoft Graph, without PIM.
        - The tenant has nine Global Administrators.
        - All eligible assignments of privileged roles end one year after they are created.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose de licences Microsoft Entra ID P2 et gère ses rôles Microsoft Entra avec Privileged Identity Management (PIM). Vous évaluez la gouvernance de ces rôles. L'évaluation constate ce qui suit :

        - Un script de provisionnement attribue des rôles Microsoft Entra directement par Microsoft Graph, sans PIM.
        - Le locataire compte neuf Global Administrators.
        - Toutes les attributions éligibles des rôles privilégiés se terminent un an après leur création.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "PIM can raise a high-severity alert for the role assignments that the script makes.", fr: "PIM peut déclencher une alerte de gravité élevée pour les attributions de rôles effectuées par le script." }
        - id: s2
          text: { en: "PIM raises its too many Global Administrators alert as soon as a tenant has more than five Global Administrators.", fr: "PIM déclenche son alerte de trop grand nombre de Global Administrators dès qu'un locataire compte plus de cinq Global Administrators." }
        - id: s3
          text: { en: "Because the eligible assignments end after one year, access reviews of the privileged roles aren't needed.", fr: "Comme les attributions éligibles se terminent au bout d'un an, les révisions d'accès des rôles privilégiés ne sont pas nécessaires." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          PIM raises the high-severity alert "Roles are being assigned outside of Privileged Identity Management", a policy violation that requires immediate action. Its Global Administrator alert uses two configurable criteria, a minimum number and a percentage, and appears only when both are met. PIM limits when a privilege is usable; whether someone should keep it is decided by access reviews.
        fr: |
          PIM déclenche l'alerte de gravité élevée « Roles are being assigned outside of Privileged Identity Management », une violation de stratégie qui exige une action immédiate. Son alerte sur les Global Administrators utilise deux critères configurables, un nombre minimal et un pourcentage, et n'apparaît que si les deux sont atteints. PIM limite quand un privilège est utilisable ; savoir si quelqu'un doit le conserver relève des révisions d'accès.
      options:
        s2: { en: "The alert isn't based on a fixed limit: it fires only when both the configured number and the configured percentage are met.", fr: "L'alerte ne repose pas sur une limite fixe : elle ne se déclenche que si le nombre et le pourcentage configurés sont tous deux atteints." }
        s3: { en: "An end date only bounds the eligibility; nobody confirms during that year that each administrator still needs the role.", fr: "Une date de fin ne fait que borner l'éligibilité ; personne ne confirme pendant cette année que chaque administrateur a encore besoin du rôle." }
    references:
      - title: Security alerts for Microsoft Entra roles in PIM
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-configure-security-alerts

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-23-09
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware, Inc. is auditing its privileged access against the enterprise access model. All Global Administrators are cloud-only accounts. The audit lists the configurations below.

        Which two configurations let identities of a lower plane take control of the control plane?

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. audite son accès privilégié par rapport au modèle d'accès d'entreprise. Tous les Global Administrators sont des comptes cloud uniquement. L'audit liste les configurations ci-dessous.

        Quelles deux configurations permettent à des identités d'un plan inférieur de prendre le contrôle du plan de contrôle ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "DevOps engineers own an app registration that has the Microsoft Graph application permission RoleManagement.ReadWrite.Directory.", fr: "Des ingénieurs DevOps sont propriétaires d'une inscription d'application qui a l'autorisation d'application Microsoft Graph RoleManagement.ReadWrite.Directory." } }
        - { id: b, text: { en: "A help desk group holds the Helpdesk Administrator role for the whole tenant.", fr: "Un groupe du support détient le rôle Helpdesk Administrator pour tout le locataire." } }
        - { id: c, text: { en: "Server administrators can edit the Group Policy objects linked to the Domain Controllers organizational unit.", fr: "Les administrateurs de serveurs peuvent modifier les objets de stratégie de groupe liés à l'unité d'organisation Domain Controllers." } }
        - { id: d, text: { en: "SOC analysts hold the Security Operator role to investigate alerts on user accounts.", fr: "Les analystes du SOC détiennent le rôle Security Operator pour enquêter sur les alertes des comptes d'utilisateur." } }
        - { id: e, text: { en: "Global Administrator is assigned to a role-assignable group whose membership is managed in PIM.", fr: "Global Administrator est attribué à un groupe assignable à un rôle dont l'appartenance est gérée dans PIM." } }
      choose: 2
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The owners of an app registration can add credentials to it and act as the app; with RoleManagement.ReadWrite.Directory, the app can assign any Microsoft Entra role, including Global Administrator, so the DevOps engineers can escalate to the control plane. Group Policy objects linked to the Domain Controllers OU run on the domain controllers, so whoever edits them controls AD DS.
        fr: |
          Les propriétaires d'une inscription d'application peuvent lui ajouter des informations d'identification et agir en tant qu'application ; avec RoleManagement.ReadWrite.Directory, l'application peut attribuer n'importe quel rôle Microsoft Entra, y compris Global Administrator : les ingénieurs DevOps peuvent donc s'élever jusqu'au plan de contrôle. Les objets de stratégie de groupe liés à l'unité d'organisation Domain Controllers s'exécutent sur les contrôleurs de domaine : qui les modifie contrôle AD DS.
      options:
        b: { en: "Helpdesk Administrator can reset the passwords of non-administrators and a few lower roles only, not of Global Administrators.", fr: "Helpdesk Administrator ne peut réinitialiser les mots de passe que des non-administrateurs et de quelques rôles inférieurs, pas des Global Administrators." }
        d: { en: "Security Operator is limited to non-administrative user accounts and can't act on privileged accounts.", fr: "Security Operator est limité aux comptes d'utilisateur non administrateurs et ne peut pas agir sur les comptes privilégiés." }
        e: { en: "Role-assignable groups protect the membership of privileged groups, and PIM makes it just in time: this is a recommended design.", fr: "Les groupes assignables à un rôle protègent l'appartenance aux groupes privilégiés, et PIM la rend juste-à-temps : c'est une conception recommandée." }
    references:
      - title: Privileged roles and permissions in Microsoft Entra ID (preview)
        url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/privileged-roles-permissions

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-23-10
    objective: "2.3.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Corporation has Microsoft Entra ID P2 licenses. It plans quarterly access reviews in Privileged Identity Management, with a security manager as the selected reviewer and **Auto apply results to resource** enabled. The current assignments are the following:

        | Role | Assigned to |
        | --- | --- |
        | Global Administrator (Microsoft Entra) | A role-assignable group named **RG-GlobalAdmins** with four members |
        | Owner on the production subscription (Azure) | A security group named **SG-Ops** with 12 members |
        | Contributor on the production subscription (Azure) | A service principal named **deploy-sp**, assigned directly |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation dispose de licences Microsoft Entra ID P2. Elle prévoit des révisions d'accès trimestrielles dans Privileged Identity Management, avec un responsable sécurité comme réviseur sélectionné et **Auto apply results to resource** activé. Les attributions actuelles sont les suivantes :

        | Rôle | Attribué à |
        | --- | --- |
        | Global Administrator (Microsoft Entra) | Un groupe assignable à un rôle nommé **RG-GlobalAdmins** de quatre membres |
        | Owner sur l'abonnement de production (Azure) | Un groupe de sécurité nommé **SG-Ops** de 12 membres |
        | Contributor sur l'abonnement de production (Azure) | Un principal de service nommé **deploy-sp**, attribué directement |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "In the review of the Global Administrator role, the security manager decides for each of the four members of RG-GlobalAdmins.", fr: "Dans la révision du rôle Global Administrator, le responsable sécurité décide pour chacun des quatre membres de RG-GlobalAdmins." }
        - id: s2
          text: { en: "If the security manager denies a member of SG-Ops in the review of the Owner role, the member is removed from SG-Ops.", fr: "Si le responsable sécurité refuse un membre de SG-Ops dans la révision du rôle Owner, ce membre est retiré de SG-Ops." }
        - id: s3
          text: { en: "Including deploy-sp in a review requires Microsoft Entra Workload ID Premium in addition to the P2 licenses.", fr: "Inclure deploy-sp dans une révision exige Microsoft Entra Workload ID Premium en plus des licences P2." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          In a review of a Microsoft Entra role, a role-assignable group appears by its name, without its membership being expanded, so the decision applies to the group. In a review of an Azure resource role, members of a group are shown individually, but a denied user isn't removed from the group. Reviewing service principals requires Workload ID Premium in addition to P2 or ID Governance.
        fr: |
          Dans la révision d'un rôle Microsoft Entra, un groupe assignable à un rôle apparaît sous son nom, sans que son appartenance soit développée : la décision porte donc sur le groupe. Dans la révision d'un rôle de ressource Azure, les membres d'un groupe sont présentés individuellement, mais un utilisateur refusé n'est pas retiré du groupe. La révision des principaux de service exige Workload ID Premium en plus de P2 ou d'ID Governance.
      options:
        s1: { en: "The group isn't expanded: to review its members one by one, the design needs a review of the group itself, for example through PIM for Groups.", fr: "Le groupe n'est pas développé : pour réviser ses membres un par un, la conception a besoin d'une révision du groupe lui-même, par exemple par PIM for Groups." }
        s2: { en: "The denied user keeps the group membership, and therefore the Owner role through the group; the group itself must be reviewed or cleaned up.", fr: "L'utilisateur refusé conserve son appartenance au groupe, donc le rôle Owner par ce groupe ; le groupe lui-même doit être révisé ou nettoyé." }
    references:
      - title: Create an access review of Azure resource and Microsoft Entra roles in PIM
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-create-roles-and-resource-roles-review
