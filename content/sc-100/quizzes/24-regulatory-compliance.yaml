chapter: 24-regulatory-compliance
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-24-01
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders is a European insurer. It uses Microsoft 365 E5, and its Azure resources are deployed in EU regions. Its Microsoft 365 tenant was created with a sign-up location in France, and Northwind doesn't use Multi-Geo Capabilities.

        A regulator requires that Microsoft store and process the customer data of these Microsoft cloud services within the European Union.

        Which Microsoft commitment or feature addresses this requirement?
      fr: |
        Northwind Traders est un assureur européen. Il utilise Microsoft 365 E5, et ses ressources Azure sont déployées dans des régions de l'UE. Son locataire Microsoft 365 a été créé avec un emplacement d'inscription en France, et Northwind n'utilise pas les fonctionnalités Multi-Geo.

        Un régulateur exige que Microsoft stocke et traite les données client de ces services cloud Microsoft à l'intérieur de l'Union européenne.

        Quel engagement ou quelle fonctionnalité de Microsoft répond à cette exigence ?
    body:
      options:
        - { id: a, text: Customer Lockbox }
        - { id: b, text: { en: "The EU Data Boundary", fr: "L'EU Data Boundary" } }
        - { id: c, text: Microsoft Purview Customer Key }
        - { id: d, text: { en: "The Allowed locations policy of Azure Policy", fr: "La stratégie Allowed locations d'Azure Policy" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The EU Data Boundary is Microsoft's commitment to store and process customer data and personal data of its enterprise online services, including Azure and Microsoft 365, within the EU. A Microsoft 365 tenant with an EU sign-up location and no Multi-Geo is in scope, and Azure regional services deployed in EU regions are in scope too.
        fr: |
          L'EU Data Boundary est l'engagement de Microsoft de stocker et de traiter les données client et les données personnelles de ses services en ligne d'entreprise, dont Azure et Microsoft 365, à l'intérieur de l'UE. Un locataire Microsoft 365 avec un emplacement d'inscription dans l'UE et sans Multi-Geo est concerné, de même que les services régionaux Azure déployés dans des régions de l'UE.
      options:
        a: { en: "Customer Lockbox makes Microsoft support engineers request approval before accessing content; it doesn't say where data is stored or processed.", fr: "Customer Lockbox oblige les ingénieurs du support Microsoft à demander une approbation avant d'accéder au contenu ; il ne dit rien de l'endroit où les données sont stockées ou traitées." }
        c: { en: "Customer Key lets the customer control the root encryption keys of Microsoft 365 content; it doesn't constrain the location of processing.", fr: "Customer Key permet au client de contrôler les clés de chiffrement racines du contenu Microsoft 365 ; il ne limite pas l'emplacement du traitement." }
        d: { en: "Allowed locations only restricts the regions of the Azure resources that Northwind deploys; it doesn't cover Microsoft 365 or Microsoft's own processing.", fr: "Allowed locations limite seulement les régions des ressources Azure que Northwind déploie ; il ne couvre ni Microsoft 365 ni le traitement effectué par Microsoft." }
    references:
      - title: What is the EU Data Boundary? - Microsoft Privacy
        url: https://learn.microsoft.com/en-us/privacy/eudb/eu-data-boundary-learn

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-24-02
    objective: "2.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank created an ISO/IEC 27001:2022 assessment for Microsoft 365 in Microsoft Purview Compliance Manager. For some controls, Microsoft implements part of the requirement in its cloud services, and Woodgrove must implement the rest itself.

        How does Compliance Manager classify these controls?
      fr: |
        Woodgrove Bank a créé une évaluation ISO/IEC 27001:2022 pour Microsoft 365 dans le Gestionnaire de conformité Microsoft Purview. Pour certains contrôles, Microsoft implémente une partie de l'exigence dans ses services cloud, et Woodgrove doit implémenter le reste lui-même.

        Comment le Gestionnaire de conformité classe-t-il ces contrôles ?
    body:
      options:
        - { id: a, text: { en: "Microsoft managed controls", fr: "Contrôles gérés par Microsoft" } }
        - { id: b, text: { en: "Customer managed controls", fr: "Contrôles gérés par le client" } }
        - { id: c, text: { en: "Shared controls", fr: "Contrôles partagés" } }
        - { id: d, text: { en: "Controls of a custom template", fr: "Contrôles d'un modèle personnalisé" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Compliance Manager has three types of controls: Microsoft managed controls, implemented by Microsoft for its cloud services; your controls, managed by the customer; and shared controls, for which responsibility is split between the customer and Microsoft. Woodgrove still owns the improvement actions of its part of a shared control.
        fr: |
          Le Gestionnaire de conformité distingue trois types de contrôles : les contrôles gérés par Microsoft, implémentés par Microsoft pour ses services cloud ; vos contrôles, gérés par le client ; et les contrôles partagés, dont la responsabilité est répartie entre le client et Microsoft. Woodgrove reste propriétaire des actions d'amélioration de sa part d'un contrôle partagé.
      options:
        a: { en: "Microsoft managed controls are implemented entirely by Microsoft; Woodgrove has nothing to implement for them.", fr: "Les contrôles gérés par Microsoft sont implémentés entièrement par Microsoft ; Woodgrove n'a rien à implémenter pour eux." }
        b: { en: "Customer managed controls are implemented entirely by the organization, with no part handled by Microsoft.", fr: "Les contrôles gérés par le client sont implémentés entièrement par l'organisation, sans aucune part prise en charge par Microsoft." }
        d: { en: "A custom template describes a regulation or internal policy that isn't in the catalog; it isn't a type of responsibility, and the assessment uses a prebuilt template.", fr: "Un modèle personnalisé décrit une réglementation ou une stratégie interne absente du catalogue ; ce n'est pas un type de responsabilité, et l'évaluation utilise un modèle prédéfini." }
    references:
      - title: Microsoft Purview Compliance Manager
        url: https://learn.microsoft.com/en-us/purview/compliance-manager

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-24-03
    objective: "2.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware, Inc. has 45 Azure subscriptions under a management group named **MG-Proseware**. The security team maintains an internal baseline of 30 custom Azure Policy definitions and adds new definitions every quarter.

        The baseline must be reported as one compliance result, and each new definition must apply to every subscription without creating a new policy assignment.

        What should you recommend?
      fr: |
        Proseware, Inc. dispose de 45 abonnements Azure sous un groupe d'administration nommé **MG-Proseware**. L'équipe de sécurité maintient une base de référence interne de 30 définitions Azure Policy personnalisées et ajoute de nouvelles définitions chaque trimestre.

        La base de référence doit être présentée comme un seul résultat de conformité, et chaque nouvelle définition doit s'appliquer à chaque abonnement sans créer de nouvelle attribution de stratégie.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Assign each definition to MG-Proseware, and assign each new definition there as it's created", fr: "Attribuer chaque définition à MG-Proseware, puis y attribuer chaque nouvelle définition dès sa création" } }
        - { id: b, text: { en: "Group the definitions in an initiative, and assign the initiative to MG-Proseware", fr: "Regrouper les définitions dans une initiative, puis attribuer l'initiative à MG-Proseware" } }
        - { id: c, text: { en: "Assign each definition to every subscription, with the same parameter values", fr: "Attribuer chaque définition à chaque abonnement, avec les mêmes valeurs de paramètres" } }
        - { id: d, text: { en: "Add the definitions to the Microsoft cloud security benchmark assignment", fr: "Ajouter les définitions à l'attribution du benchmark de sécurité cloud Microsoft" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An initiative groups policy definitions toward one goal and is assigned as a single item, with one compliance result. A definition added to the initiative later becomes part of the existing assignment, and the assignment at MG-Proseware is inherited by all current and future subscriptions below it.
        fr: |
          Une initiative regroupe des définitions de stratégie autour d'un objectif et s'attribue comme un seul élément, avec un seul résultat de conformité. Une définition ajoutée plus tard à l'initiative fait partie de l'attribution existante, et l'attribution sur MG-Proseware est héritée par tous les abonnements actuels et futurs en dessous.
      options:
        a: { en: "Separate assignments give 30 separate compliance results, and every new definition needs a new assignment.", fr: "Des attributions séparées donnent 30 résultats de conformité distincts, et chaque nouvelle définition exige une nouvelle attribution." }
        c: { en: "Per-subscription assignments multiply the work, miss future subscriptions and still need a new assignment for each new definition.", fr: "Des attributions par abonnement multiplient le travail, oublient les futurs abonnements et exigent toujours une nouvelle attribution pour chaque nouvelle définition." }
        d: { en: "The MCSB is a built-in initiative maintained by Microsoft: custom definitions can't be added to it.", fr: "Le MCSB est une initiative intégrée maintenue par Microsoft : on ne peut pas y ajouter de définitions personnalisées." }
    references:
      - title: Overview of Azure Policy - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-24-04
    objective: "2.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. uses Microsoft 365 E3 and can buy additional licenses. A financial regulator requires that the audit records of Exchange Online, SharePoint Online and Microsoft Entra ID be searchable for at least one year.

        The compliance team must also be able to set different retention periods for the audit records of specific users and activities.

        What should you recommend?
      fr: |
        Fabrikam, Inc. utilise Microsoft 365 E3 et peut acheter des licences supplémentaires. Un régulateur financier exige que les enregistrements d'audit d'Exchange Online, de SharePoint Online et de Microsoft Entra ID puissent être recherchés pendant au moins un an.

        L'équipe de conformité doit aussi pouvoir définir des durées de conservation différentes pour les enregistrements d'audit d'utilisateurs et d'activités spécifiques.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Microsoft Purview Audit (Standard), with audit log retention policies for specific users", fr: "Microsoft Purview Audit (Standard), avec des stratégies de rétention des journaux d'audit pour des utilisateurs spécifiques" } }
        - { id: b, text: { en: "Microsoft Purview Audit (Premium), with audit log retention policies for specific users", fr: "Microsoft Purview Audit (Premium), avec des stratégies de rétention des journaux d'audit pour des utilisateurs spécifiques" } }
        - { id: c, text: { en: "A Microsoft Purview retention policy that keeps Exchange and SharePoint content for one year", fr: "Une stratégie de rétention Microsoft Purview qui conserve le contenu Exchange et SharePoint pendant un an" } }
        - { id: d, text: { en: "An eDiscovery hold on the mailboxes and OneDrive accounts of the users in scope", fr: "Une conservation eDiscovery sur les boîtes aux lettres et les comptes OneDrive des utilisateurs concernés" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Audit (Premium) keeps the Exchange, SharePoint, OneDrive and Microsoft Entra ID audit records for one year by default, and adds audit log retention policies scoped by service, activity or user, with their own retention period and priority. Audit (Premium) is licensed per user, so Fabrikam buys the matching licenses on top of E3.
        fr: |
          Audit (Premium) conserve par défaut un an les enregistrements d'audit d'Exchange, SharePoint, OneDrive et Microsoft Entra ID, et ajoute des stratégies de rétention des journaux d'audit ciblées par service, activité ou utilisateur, avec leur propre durée et leur priorité. Audit (Premium) se licencie par utilisateur : Fabrikam achète donc les licences correspondantes en plus d'E3.
      options:
        a: { en: "Audit (Standard) keeps every record for 180 days, and audit log retention policies aren't available with it.", fr: "Audit (Standard) conserve chaque enregistrement 180 jours, et les stratégies de rétention des journaux d'audit n'y sont pas disponibles." }
        c: { en: "A retention policy keeps the content itself (mail, files), not the audit records of user and admin activity.", fr: "Une stratégie de rétention conserve le contenu lui-même (courrier, fichiers), pas les enregistrements d'audit de l'activité des utilisateurs et des administrateurs." }
        d: { en: "An eDiscovery hold preserves content for a case; it doesn't extend the retention of audit records.", fr: "Une conservation eDiscovery préserve du contenu pour une affaire ; elle ne prolonge pas la conservation des enregistrements d'audit." }
    references:
      - title: Learn about auditing solutions in Microsoft Purview
        url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-24-05
    objective: "2.4.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys assigned the PCI DSS v4.0.1 standard to its Azure subscriptions in Microsoft Defender for Cloud, with Defender CSPM enabled. Every month, a PCI DSS control fails again because application teams deploy new storage accounts that accept insecure transfer over HTTP, and the security team then fixes them by hand.

        The security team wants these deployments to fail, so that the application teams correct their templates.

        What should you recommend?
      fr: |
        Tailspin Toys a attribué la norme PCI DSS v4.0.1 à ses abonnements Azure dans Microsoft Defender pour le cloud, avec Defender CSPM activé. Chaque mois, un contrôle PCI DSS échoue de nouveau parce que les équipes applicatives déploient de nouveaux comptes de stockage qui acceptent le transfert non sécurisé en HTTP, et l'équipe de sécurité les corrige ensuite à la main.

        L'équipe de sécurité veut que ces déploiements échouent, pour que les équipes applicatives corrigent leurs modèles.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Select Enforce on the matching recommendation", fr: "Sélectionner Enforce sur la recommandation correspondante" } }
        - { id: b, text: { en: "Create a workflow automation that fixes the setting", fr: "Créer une automatisation de workflow qui corrige le paramètre" } }
        - { id: c, text: { en: "Exempt the new storage accounts as Mitigated", fr: "Exempter les nouveaux comptes de stockage comme Mitigated" } }
        - { id: d, text: { en: "Set the matching recommendation's effect to Deny", fr: "Définir l'effet de la recommandation correspondante sur Deny" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Regulatory standards reuse the assessments of the Defender for Cloud recommendations, which rely on Azure Policy. Setting the recommendation's effect to Deny blocks the creation of non-compliant storage accounts, so the deployment fails, the teams fix their templates and the control stops failing.
        fr: |
          Les normes réglementaires réutilisent les évaluations des recommandations de Defender pour le cloud, qui reposent sur Azure Policy. Définir l'effet de la recommandation sur Deny bloque la création des comptes de stockage non conformes : le déploiement échoue, les équipes corrigent leurs modèles et le contrôle cesse d'échouer.
      options:
        a: { en: "Enforce uses DeployIfNotExists to fix non-compliant resources after they're created: the deployment succeeds and the templates stay wrong.", fr: "Enforce utilise DeployIfNotExists pour corriger les ressources non conformes après leur création : le déploiement réussit et les modèles restent erronés." }
        b: { en: "A workflow automation reacts after the resource exists; it doesn't make the deployment fail.", fr: "Une automatisation de workflow réagit après la création de la ressource ; elle ne fait pas échouer le déploiement." }
        c: { en: "Mitigated is for resources protected by another control; here nothing protects them, and an exemption hides the failure instead of preventing it.", fr: "Mitigated s'applique aux ressources protégées par un autre contrôle ; ici rien ne les protège, et une exemption masque l'échec au lieu de l'empêcher." }
    references:
      - title: Manage the Microsoft Cloud Security Benchmark in Microsoft Defender for Cloud - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/prevent-misconfigurations

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-24-06
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank uses Microsoft 365 E5 for Exchange Online, SharePoint Online, OneDrive, Microsoft Teams and Microsoft 365 Copilot. A banking regulator sets the following requirements for the content stored at rest in Microsoft 365:

        - The root encryption keys must be controlled by Woodgrove, in addition to Microsoft's service encryption.
        - When Woodgrove leaves the service, revoking its keys must make the content unreadable.
        - Search, eDiscovery and Microsoft 365 Copilot must keep working on all the content.

        What should you recommend?
      fr: |
        Woodgrove Bank utilise Microsoft 365 E5 pour Exchange Online, SharePoint Online, OneDrive, Microsoft Teams et Microsoft 365 Copilot. Un régulateur bancaire fixe les exigences suivantes pour le contenu stocké au repos dans Microsoft 365 :

        - Les clés de chiffrement racines doivent être contrôlées par Woodgrove, en plus du chiffrement de service de Microsoft.
        - Quand Woodgrove quitte le service, la révocation de ses clés doit rendre le contenu illisible.
        - La recherche, eDiscovery et Microsoft 365 Copilot doivent continuer à fonctionner sur tout le contenu.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Double Key Encryption, applied with sensitivity labels to all the content", fr: "Le chiffrement à double clé (DKE), appliqué par des étiquettes de confidentialité à tout le contenu" } }
        - { id: b, text: { en: "Customer Key, with data encryption policies for the Microsoft 365 workloads", fr: "Customer Key, avec des stratégies de chiffrement des données pour les charges de travail Microsoft 365" } }
        - { id: c, text: { en: "Sensitivity labels that encrypt the content with Microsoft-managed keys", fr: "Des étiquettes de confidentialité qui chiffrent le contenu avec des clés gérées par Microsoft" } }
        - { id: d, text: { en: "Customer Lockbox, with approval of every Microsoft support request", fr: "Customer Lockbox, avec l'approbation de chaque demande du support Microsoft" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Microsoft Purview Customer Key adds an application-level encryption layer whose root keys the customer controls, through data encryption policies (DEPs) for Exchange, SharePoint, OneDrive, Teams and Copilot interactions. Revoking the keys starts the data purge path and makes the content unreadable, while the customer authorizes Microsoft 365 to use the keys for search indexing and eDiscovery, so these features keep working.
        fr: |
          Microsoft Purview Customer Key ajoute une couche de chiffrement au niveau de l'application dont le client contrôle les clés racines, par des stratégies de chiffrement des données (DEP) pour Exchange, SharePoint, OneDrive, Teams et les interactions Copilot. La révocation des clés lance le processus de purge des données et rend le contenu illisible, tandis que le client autorise Microsoft 365 à utiliser les clés pour l'indexation de la recherche et eDiscovery : ces fonctionnalités continuent donc de fonctionner.
      options:
        a: { en: "DKE content can't be indexed, searched, collected by eDiscovery or read by Copilot: it's meant only for a small set of highly sensitive data.", fr: "Le contenu DKE ne peut être ni indexé, ni recherché, ni collecté par eDiscovery, ni lu par Copilot : il est réservé à une petite part de données très sensibles." }
        c: { en: "With Microsoft-managed keys, Woodgrove doesn't control the root keys and can't revoke them.", fr: "Avec des clés gérées par Microsoft, Woodgrove ne contrôle pas les clés racines et ne peut pas les révoquer." }
        d: { en: "Customer Lockbox controls support engineers' access to content; it doesn't encrypt anything with Woodgrove's keys.", fr: "Customer Lockbox contrôle l'accès des ingénieurs du support au contenu ; il ne chiffre rien avec les clés de Woodgrove." }
    references:
      - title: Overview of Customer Key - Microsoft Purview
        url: https://learn.microsoft.com/en-us/purview/customer-key-overview
      - title: Double Key Encryption (DKE)
        url: https://learn.microsoft.com/en-us/purview/double-key-encryption

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-24-07
    objective: "2.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. runs 12 AKS clusters in Azure and 6 Kubernetes clusters in its on-premises datacenter. The on-premises clusters use a distribution validated for Azure Arc. All the subscriptions are under a management group named **MG-Contoso**.

        A new security requirement states:

        - No privileged container can be created in any of the 18 clusters.
        - The compliance of all the clusters must be reported in the Azure Policy compliance view.
        - The number of tools must be minimized.

        What should you recommend?
      fr: |
        Contoso, Ltd. exécute 12 clusters AKS dans Azure et 6 clusters Kubernetes dans son centre de données local. Les clusters locaux utilisent une distribution validée pour Azure Arc. Tous les abonnements se trouvent sous un groupe d'administration nommé **MG-Contoso**.

        Une nouvelle exigence de sécurité indique :

        - Aucun conteneur privilégié ne peut être créé dans l'un des 18 clusters.
        - La conformité de tous les clusters doit apparaître dans la vue de conformité d'Azure Policy.
        - Le nombre d'outils doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A Kubernetes policy with the Deny effect assigned to MG-Contoso, the Azure Policy add-on on AKS, and Gatekeeper installed with the same constraint on the on-premises clusters", fr: "Une stratégie Kubernetes avec l'effet Deny attribuée à MG-Contoso, le module complémentaire Azure Policy sur AKS, et Gatekeeper installé avec la même contrainte sur les clusters locaux" } }
        - { id: b, text: { en: "Machine configuration policies assigned to MG-Contoso, with the nodes of the on-premises clusters connected to Azure Arc as Arc-enabled servers", fr: "Des stratégies de configuration machine attribuées à MG-Contoso, avec les nœuds des clusters locaux connectés à Azure Arc comme serveurs compatibles Arc" } }
        - { id: c, text: { en: "A Kubernetes policy with the Deny effect assigned to MG-Contoso, the Azure Policy add-on on AKS, and the Azure Policy extension on the on-premises clusters connected to Azure Arc", fr: "Une stratégie Kubernetes avec l'effet Deny attribuée à MG-Contoso, le module complémentaire Azure Policy sur AKS, et l'extension Azure Policy sur les clusters locaux connectés à Azure Arc" } }
        - { id: d, text: { en: "Defender for Containers enabled on the subscriptions, with gated deployment rules that block privileged containers in the 18 clusters", fr: "Defender for Containers activé sur les abonnements, avec des règles de déploiement contrôlé qui bloquent les conteneurs privilégiés dans les 18 clusters" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Policy for Kubernetes extends Gatekeeper v3: an assignment with the Deny effect rejects admission requests that create privileged containers, and the results are reported to Azure Policy. AKS clusters get it through the Azure Policy add-on, and Arc-enabled Kubernetes clusters through the Azure Policy extension, so one assignment at MG-Contoso covers the 18 clusters.
        fr: |
          Azure Policy pour Kubernetes étend Gatekeeper v3 : une attribution avec l'effet Deny rejette les demandes d'admission qui créent des conteneurs privilégiés, et les résultats remontent dans Azure Policy. Les clusters AKS l'obtiennent par le module complémentaire Azure Policy, et les clusters Kubernetes compatibles Arc par l'extension Azure Policy : une seule attribution sur MG-Contoso couvre donc les 18 clusters.
      options:
        a: { en: "A Gatekeeper installed outside the add-on or extension doesn't report to Azure Policy, and it adds a second tool to maintain.", fr: "Un Gatekeeper installé hors du module complémentaire ou de l'extension ne remonte pas ses résultats dans Azure Policy, et il ajoute un second outil à maintenir." }
        b: { en: "Machine configuration audits settings inside the node operating systems; it doesn't control which pods the Kubernetes API admits.", fr: "La configuration machine audite des paramètres dans le système d'exploitation des nœuds ; elle ne contrôle pas les pods admis par l'API Kubernetes." }
        d: { en: "Gated deployment blocks images that don't meet the vulnerability policy; it doesn't evaluate the security context of the pods.", fr: "Le déploiement contrôlé bloque les images qui ne respectent pas la stratégie de vulnérabilités ; il n'évalue pas le contexte de sécurité des pods." }
    references:
      - title: Learn Azure Policy for Kubernetes - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/policy-for-kubernetes
      - title: Introduction to Microsoft Defender for Containers - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-24-08
    objective: "2.4.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware, Inc. has 30 Azure subscriptions under a management group named **MG-Litware**. They contain about 900 storage accounts.

        A new requirement states that every storage account, existing or new, must have public network access disabled. Several pipelines deploy storage accounts with the default settings, and the requirement must not cause any deployment to fail. The solution must minimize administrative effort.

        Which two actions should you recommend?

        Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. dispose de 30 abonnements Azure sous un groupe d'administration nommé **MG-Litware**. Ils contiennent environ 900 comptes de stockage.

        Une nouvelle exigence indique que chaque compte de stockage, existant ou nouveau, doit avoir l'accès réseau public désactivé. Plusieurs pipelines déploient des comptes de stockage avec les paramètres par défaut, et l'exigence ne doit faire échouer aucun déploiement. La solution doit réduire au minimum l'effort d'administration.

        Quelles deux actions devez-vous recommander ?

        Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Assign to MG-Litware a definition with the Deny effect for storage accounts that allow public network access", fr: "Attribuer à MG-Litware une définition avec l'effet Deny pour les comptes de stockage qui autorisent l'accès réseau public" } }
        - { id: b, text: { en: "Assign to MG-Litware a definition with the Modify effect that sets public network access to Disabled", fr: "Attribuer à MG-Litware une définition avec l'effet Modify qui définit l'accès réseau public sur Disabled" } }
        - { id: c, text: { en: "Set the enforcement mode of the assignment to Disabled so that no deployment is affected", fr: "Définir le mode d'application de l'attribution sur Disabled pour qu'aucun déploiement ne soit affecté" } }
        - { id: d, text: { en: "Create a remediation task for the assignment, by using the assignment's managed identity", fr: "Créer une tâche de correction pour l'attribution, avec l'identité managée de l'attribution" } }
        - { id: e, text: { en: "Assign to MG-Litware a definition with the AuditIfNotExists effect for storage accounts without a private endpoint", fr: "Attribuer à MG-Litware une définition avec l'effet AuditIfNotExists pour les comptes de stockage sans point de terminaison privé" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The Modify effect changes the property during the create or update request, so new storage accounts are deployed with public network access disabled and the pipelines don't fail. Existing accounts are fixed by a remediation task, which applies the Modify operation with the assignment's managed identity; Modify and DeployIfNotExists are the only effects that support remediation.
        fr: |
          L'effet Modify change la propriété pendant la demande de création ou de mise à jour : les nouveaux comptes de stockage sont déployés avec l'accès réseau public désactivé et les pipelines n'échouent pas. Les comptes existants sont corrigés par une tâche de correction, qui applique l'opération Modify avec l'identité managée de l'attribution ; Modify et DeployIfNotExists sont les seuls effets qui prennent en charge la correction.
      options:
        a: { en: "Deny makes the pipelines that use the default settings fail, which the requirement forbids, and it doesn't fix the existing accounts.", fr: "Deny fait échouer les pipelines qui utilisent les paramètres par défaut, ce que l'exigence interdit, et ne corrige pas les comptes existants." }
        c: { en: "With the enforcement mode set to Disabled, the Modify effect isn't applied when accounts are created, so new accounts stay non-compliant.", fr: "Avec le mode d'application sur Disabled, l'effet Modify n'est pas appliqué à la création des comptes : les nouveaux comptes restent non conformes." }
        e: { en: "AuditIfNotExists only reports; it changes neither new nor existing storage accounts.", fr: "AuditIfNotExists ne fait que signaler ; il ne modifie ni les nouveaux comptes de stockage ni les existants." }
    references:
      - title: Remediate non-compliant resources - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
      - title: Details of the policy assignment structure - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-24-09
    objective: "2.4.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Corporation, an EU insurer, has Azure subscriptions under its tenant root management group and a GCP organization connected to Microsoft Defender for Cloud at the organization level. The Defender CSPM plan is enabled on the Azure subscriptions and on the GCP connector.

        The compliance team works in the Microsoft Defender portal. It must show the alignment of both clouds with the Digital Operational Resilience Act (DORA) and with the EU AI Act. No standard has been added to the dashboard yet.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation, un assureur européen, dispose d'abonnements Azure sous son groupe d'administration racine du locataire et d'une organisation GCP connectée à Microsoft Defender pour le cloud au niveau de l'organisation. Le plan Defender CSPM est activé sur les abonnements Azure et sur le connecteur GCP.

        L'équipe de conformité travaille dans le portail Microsoft Defender. Elle doit montrer l'alignement des deux clouds sur le règlement DORA (Digital Operational Resilience Act) et sur l'EU AI Act. Aucune norme n'a encore été ajoutée au tableau de bord.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The GCP projects are already assessed against the Microsoft cloud security benchmark and the GCP Default standard.", fr: "Les projets GCP sont déjà évalués par rapport au benchmark de sécurité cloud Microsoft et à la norme GCP Default." }
        - id: s2
          text: { en: "Both DORA and the EU AI Act can be assigned to the GCP organization as well as to the Azure subscriptions.", fr: "DORA et l'EU AI Act peuvent tous deux être attribués à l'organisation GCP aussi bien qu'aux abonnements Azure." }
        - id: s3
          text: { en: "The team can assign the two standards to the GCP organization from the regulatory compliance page of the Defender portal.", fr: "L'équipe peut attribuer les deux normes à l'organisation GCP depuis la page de conformité réglementaire du portail Defender." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Defender for Cloud enables the MCSB and GCP Default by default on GCP, and DORA and the EU AI Act are among the standards available for Azure, AWS and GCP once a qualifying paid plan such as Defender CSPM is enabled. Standards are configured and assigned in the Azure portal; the Defender portal shows the regulatory compliance of the assigned standards for monitoring only.
        fr: |
          Defender pour le cloud active par défaut le MCSB et GCP Default sur GCP, et DORA et l'EU AI Act font partie des normes disponibles pour Azure, AWS et GCP dès qu'un plan payant éligible comme Defender CSPM est activé. Les normes se configurent et s'attribuent dans le portail Azure ; le portail Defender affiche la conformité réglementaire des normes attribuées pour la supervision seulement.
      options:
        s3: { en: "Assigning standards to a scope is done in the Azure portal (Regulatory compliance > Manage compliance policies); the Defender portal gives read-only standard details.", fr: "L'attribution de normes à une étendue se fait dans le portail Azure (Conformité réglementaire > Gérer les stratégies de conformité) ; le portail Defender donne les détails des normes en lecture seule." }
    references:
      - title: Regulatory compliance in Defender for Cloud - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
      - title: Assign regulatory compliance standards in Microsoft Defender for Cloud - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-24-10
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. prepares an ISO/IEC 27001:2022 certification audit. The scope includes Microsoft 365, 20 Azure subscriptions and 15 AWS accounts. The Azure subscriptions and the AWS accounts are connected to Microsoft Defender for Cloud with Defender CSPM, and the ISO/IEC 27001:2022 standard is assigned to them.

        The CISO sets the following requirements:

        - One progress score for the whole scope, including organizational controls such as supplier management and staff training, each with an owner and evidence.
        - The technical controls of the Azure and AWS resources must be tested automatically, without exporting results by hand.
        - Administrative effort must be minimized.

        What should you recommend?
      fr: |
        Fabrikam, Inc. prépare un audit de certification ISO/IEC 27001:2022. Le périmètre comprend Microsoft 365, 20 abonnements Azure et 15 comptes AWS. Les abonnements Azure et les comptes AWS sont connectés à Microsoft Defender pour le cloud avec Defender CSPM, et la norme ISO/IEC 27001:2022 leur est attribuée.

        Le RSSI fixe les exigences suivantes :

        - Un seul score de progression pour tout le périmètre, y compris les contrôles organisationnels comme la gestion des fournisseurs et la formation du personnel, chacun avec un propriétaire et des preuves.
        - Les contrôles techniques des ressources Azure et AWS doivent être testés automatiquement, sans exporter les résultats à la main.
        - L'effort d'administration doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "The Defender for Cloud regulatory compliance dashboard, with manual evidence for the controls it can't assess", fr: "Le tableau de bord de conformité réglementaire de Defender pour le cloud, avec des preuves manuelles pour les contrôles qu'il ne peut pas évaluer" } }
        - { id: b, text: { en: "A Compliance Manager assessment for Microsoft 365, with the monthly Defender for Cloud report attached as evidence", fr: "Une évaluation du Gestionnaire de conformité pour Microsoft 365, avec le rapport mensuel de Defender pour le cloud joint comme preuve" } }
        - { id: c, text: { en: "A Compliance Manager assessment from the ISO/IEC 27001:2022 template, with Microsoft 365, Azure and AWS as its services", fr: "Une évaluation du Gestionnaire de conformité issue du modèle ISO/IEC 27001:2022, avec Microsoft 365, Azure et AWS comme services" } }
        - { id: d, text: { en: "Microsoft Secure Score, with the improvement actions of the identity and data categories tracked to completion", fr: "Le Niveau de sécurité Microsoft, avec le suivi jusqu'à leur achèvement des actions d'amélioration des catégories identité et données" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Compliance Manager assesses Microsoft 365, Azure, AWS and GCP in one assessment, and its compliance score covers technical and organizational improvement actions, each assigned to an owner with evidence. Azure, AWS and GCP are assessed through the integration with Defender for Cloud: when the selected subscriptions and accounts are in scope of the same regulation in Defender for Cloud, the automated test results are pulled into the assessment.
        fr: |
          Le Gestionnaire de conformité évalue Microsoft 365, Azure, AWS et GCP dans une seule évaluation, et son score de conformité couvre les actions d'amélioration techniques et organisationnelles, chacune attribuée à un propriétaire avec des preuves. Azure, AWS et GCP sont évalués par l'intégration avec Defender pour le cloud : quand les abonnements et comptes sélectionnés sont dans l'étendue de la même réglementation dans Defender pour le cloud, les résultats des tests automatisés sont récupérés dans l'évaluation.
      options:
        a: { en: "The Defender for Cloud dashboard covers Azure, AWS and GCP resources only: Microsoft 365 is outside its scope, so there's no single score for the whole scope.", fr: "Le tableau de bord de Defender pour le cloud ne couvre que les ressources Azure, AWS et GCP : Microsoft 365 est hors de son périmètre, il n'y a donc pas de score unique pour tout le périmètre." }
        b: { en: "Attaching exported reports is a manual step every month, and the Azure and AWS results don't count in the assessment score.", fr: "Joindre des rapports exportés est une étape manuelle chaque mois, et les résultats Azure et AWS ne comptent pas dans le score de l'évaluation." }
        d: { en: "Microsoft Secure Score measures the security posture of Microsoft 365 workloads; it doesn't track the controls of a regulation or the Azure and AWS resources.", fr: "Le Niveau de sécurité Microsoft mesure la posture de sécurité des charges de travail Microsoft 365 ; il ne suit ni les contrôles d'une réglementation ni les ressources Azure et AWS." }
    references:
      - title: Multicloud support in Microsoft Purview Compliance Manager
        url: https://learn.microsoft.com/en-us/purview/compliance-manager-multicloud
      - title: Microsoft Purview Compliance Manager
        url: https://learn.microsoft.com/en-us/purview/compliance-manager
