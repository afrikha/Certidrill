chapter: 32-endpoints
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-32-01
    objective: "3.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso Energy monitors the OT network of a substation with Microsoft Defender for IoT. An OT sensor raises an alert because an engineering station sent a Modbus packet whose function code isn't allowed by the Modbus specification.

        Which sensor analytics engine detects this type of activity?
      fr: |
        Contoso Energy surveille le réseau OT d'un poste électrique avec Microsoft Defender pour IoT. Un capteur OT génère une alerte parce qu'une station d'ingénierie a envoyé un paquet Modbus dont le code de fonction n'est pas autorisé par la spécification Modbus.

        Quel moteur d'analyse du capteur détecte ce type d'activité ?
    body:
      options:
        - { id: a, text: { en: "The policy violation engine", fr: "Le moteur de violation de stratégie" } }
        - { id: b, text: { en: "The anomaly detection engine", fr: "Le moteur de détection des anomalies" } }
        - { id: c, text: { en: "The protocol violation engine", fr: "Le moteur de violation de protocole" } }
        - { id: d, text: { en: "The operational incident engine", fr: "Le moteur des incidents opérationnels" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The protocol violation engine identifies packet structures and field values that don't comply with an ICS protocol specification, such as an illegal Modbus function code. The sensor runs this analysis locally on the mirrored traffic.
        fr: |
          Le moteur de violation de protocole identifie les structures de paquets et les valeurs de champs qui ne respectent pas la spécification d'un protocole ICS, comme un code de fonction Modbus illégal. Le capteur effectue cette analyse localement sur le trafic mis en miroir.
      options:
        a: { en: "The policy violation engine detects deviations from the learned or configured baseline, not packets that break the protocol itself.", fr: "Le moteur de violation de stratégie détecte les écarts par rapport à la base de référence apprise ou configurée, pas les paquets qui enfreignent le protocole lui-même." }
        b: { en: "The anomaly engine detects unusual machine-to-machine communications, even when each packet is valid.", fr: "Le moteur d'anomalies détecte les communications inhabituelles de machine à machine, même quand chaque paquet est valide." }
        d: { en: "The operational engine detects operational issues, such as a device that stops responding.", fr: "Le moteur opérationnel détecte les problèmes d'exploitation, comme un appareil qui ne répond plus." }
    references:
      - title: Microsoft Defender for IoT architecture and components for your OT environment
        url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/architecture

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-32-02
    objective: "3.2.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation is deploying 2,000 new Windows 11 24H2 laptops that are joined to its Active Directory Domain Services (AD DS) domain. The desktop team plans to install the legacy Microsoft LAPS client on each laptop, as it did for the previous generation of devices.

        You need to recommend how to manage a unique local administrator password on each new laptop.

        What should you recommend?
      fr: |
        Adatum Corporation déploie 2 000 nouveaux ordinateurs portables Windows 11 24H2 joints à son domaine Active Directory Domain Services (AD DS). L'équipe des postes de travail prévoit d'installer le client de l'ancien Microsoft LAPS sur chaque ordinateur portable, comme pour la génération d'appareils précédente.

        Vous devez recommander comment gérer un mot de passe d'administrateur local unique sur chaque nouvel ordinateur portable.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Install the legacy Microsoft LAPS client with a Group Policy software deployment", fr: "Installer le client de l'ancien Microsoft LAPS par un déploiement logiciel de stratégie de groupe" } }
        - { id: b, text: { en: "Configure the Windows LAPS feature already built into the operating system", fr: "Configurer la fonctionnalité Windows LAPS déjà intégrée au système d'exploitation" } }
        - { id: c, text: { en: "Keep the legacy LAPS policies and run Windows LAPS in emulation mode permanently", fr: "Conserver les anciennes stratégies LAPS et exécuter Windows LAPS en mode d'émulation de façon permanente" } }
        - { id: d, text: { en: "Set the same strong local administrator password on all the laptops with a script", fr: "Définir le même mot de passe d'administrateur local fort sur tous les ordinateurs portables avec un script" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Windows LAPS is built into Windows 11 23H2 and later. The legacy Microsoft LAPS product is deprecated on these versions, and newer versions block the installation of its MSI package, so the laptops use a native Windows LAPS policy that backs up the password to AD DS.
        fr: |
          Windows LAPS est intégré à Windows 11 23H2 et versions ultérieures. L'ancien Microsoft LAPS est déprécié sur ces versions, et les versions plus récentes bloquent l'installation de son package MSI : les ordinateurs portables utilisent donc une stratégie Windows LAPS native qui sauvegarde le mot de passe dans AD DS.
      options:
        a: { en: "The legacy product is deprecated, and its MSI package can't be installed on these Windows versions.", fr: "L'ancien produit est déprécié, et son package MSI ne peut pas être installé sur ces versions de Windows." }
        c: { en: "Emulation mode is a temporary migration aid: it stores passwords in clear text in AD DS, without encryption or history.", fr: "Le mode d'émulation est une aide temporaire à la migration : il stocke les mots de passe en clair dans AD DS, sans chiffrement ni historique." }
        d: { en: "A shared password is exactly what allows lateral movement once one laptop is compromised.", fr: "Un mot de passe partagé est précisément ce qui permet le mouvement latéral dès qu'un ordinateur portable est compromis." }
    references:
      - title: What is Windows LAPS?
        url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-32-03
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. manages 5,000 Windows 11 devices with Microsoft Intune and protects them with Microsoft Defender for Endpoint. During a ransomware incident, the attackers turned off real-time protection and added antivirus exclusions on several devices before they encrypted the files.

        You need to recommend a control that blocks such changes to the Microsoft Defender Antivirus settings on the devices. The security team must keep managing these settings centrally.

        What should you recommend?
      fr: |
        Fabrikam, Inc. gère 5 000 appareils Windows 11 avec Microsoft Intune et les protège avec Microsoft Defender for Endpoint. Lors d'un incident de rançongiciel, les attaquants ont désactivé la protection en temps réel et ajouté des exclusions antivirus sur plusieurs appareils avant de chiffrer les fichiers.

        Vous devez recommander un contrôle qui bloque ces modifications des paramètres de l'Antivirus Microsoft Defender sur les appareils. L'équipe de sécurité doit continuer à gérer ces paramètres de façon centralisée.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Attack surface reduction rules", fr: "Règles de réduction de la surface d'attaque" } }
        - { id: b, text: { en: "App Control for Business", fr: "App Control for Business" } }
        - { id: c, text: { en: "Network protection", fr: "Protection réseau" } }
        - { id: d, text: { en: "Tamper protection", fr: "Protection contre les falsifications" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Tamper protection blocks changes to important Defender Antivirus settings, such as turning off real-time protection or adding exclusions, including changes attempted through the registry. It is turned on and managed centrally from Intune or the Microsoft Defender portal.
        fr: |
          La protection contre les falsifications bloque les modifications des paramètres importants de l'Antivirus Defender, comme la désactivation de la protection en temps réel ou l'ajout d'exclusions, y compris les tentatives passant par le Registre. Elle est activée et gérée de façon centralisée depuis Intune ou le portail Microsoft Defender.
      options:
        a: { en: "Attack surface reduction rules block common malware behaviors, such as Office creating child processes, not changes to the antivirus settings.", fr: "Les règles de réduction de la surface d'attaque bloquent des comportements courants des logiciels malveillants, comme la création de processus enfants par Office, pas les modifications des paramètres antivirus." }
        b: { en: "App Control for Business decides which applications can run; it doesn't protect the antivirus settings from being changed.", fr: "App Control for Business décide quelles applications peuvent s'exécuter ; il ne protège pas les paramètres antivirus contre les modifications." }
        c: { en: "Network protection blocks connections to malicious domains and IP addresses, not changes made on the device.", fr: "La protection réseau bloque les connexions vers des domaines et adresses IP malveillants, pas les modifications faites sur l'appareil." }
    references:
      - title: Tamper protection overview
        url: https://learn.microsoft.com/en-us/defender-endpoint/prevent-changes-to-security-settings-with-tamper-protection

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-32-04
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank is writing the security requirements for 150 new Generation 2 Windows Server virtual machines in Azure. Microsoft Defender for Servers Plan 2 is enabled on the subscriptions.

        A threat model identified bootkits and rootkits as a risk. The requirements state that only signed boot components can start, and that the security team is alerted when the boot chain of a VM deviates from a trusted baseline.

        What should you include in the requirements?
      fr: |
        Woodgrove Bank rédige les exigences de sécurité de 150 nouvelles machines virtuelles Windows Server de génération 2 dans Azure. Microsoft Defender for Servers Plan 2 est activé sur les abonnements.

        Un modèle de menace a identifié les bootkits et les rootkits comme un risque. Les exigences indiquent que seuls des composants de démarrage signés peuvent démarrer, et que l'équipe de sécurité est alertée quand la chaîne de démarrage d'une machine virtuelle s'écarte d'une base de référence fiable.

        Que devez-vous inclure dans les exigences ?
    body:
      options:
        - { id: a, text: { en: "File integrity monitoring of the system files and registry keys of each VM", fr: "La surveillance de l'intégrité des fichiers système et des clés de Registre de chaque machine virtuelle" } }
        - { id: b, text: { en: "Trusted launch with Secure Boot, vTPM and the guest attestation extension", fr: "Le lancement fiable avec le démarrage sécurisé, le vTPM et l'extension d'attestation d'invité" } }
        - { id: c, text: { en: "Machine configuration assignments of the MCSB operating system baseline", fr: "Des attributions de configuration des machines de la base de référence du système d'exploitation du MCSB" } }
        - { id: d, text: { en: "Just-in-time VM access on the management ports of each VM", fr: "L'accès juste-à-temps aux machines virtuelles sur les ports de gestion de chaque machine virtuelle" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Trusted launch protects Generation 2 VMs against bootkits and rootkits: Secure Boot lets only signed boot loaders, kernels and drivers start, and the vTPM measures the boot chain. With the guest attestation extension, Defender for Cloud assesses boot integrity and raises an alert when attestation fails.
        fr: |
          Le lancement fiable protège les machines virtuelles de génération 2 contre les bootkits et les rootkits : le démarrage sécurisé ne laisse démarrer que des chargeurs de démarrage, noyaux et pilotes signés, et le vTPM mesure la chaîne de démarrage. Avec l'extension d'attestation d'invité, Defender pour le cloud évalue l'intégrité du démarrage et génère une alerte quand l'attestation échoue.
      options:
        a: { en: "File integrity monitoring detects changes to files and registry keys in the running OS; it doesn't stop unsigned boot components.", fr: "La surveillance de l'intégrité des fichiers détecte les modifications des fichiers et des clés de Registre dans le système en cours d'exécution ; elle n'empêche pas les composants de démarrage non signés." }
        c: { en: "Machine configuration audits operating system settings; it doesn't verify what runs before the OS starts.", fr: "La configuration des machines audite les paramètres du système d'exploitation ; elle ne vérifie pas ce qui s'exécute avant le démarrage du système." }
        d: { en: "Just-in-time access limits when management ports are open; it has no effect on the boot chain.", fr: "L'accès juste-à-temps limite les moments où les ports de gestion sont ouverts ; il n'a aucun effet sur la chaîne de démarrage." }
    references:
      - title: Trusted Launch for Azure virtual machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-32-05
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware, Inc. is installing 1,200 IP cameras in its warehouses. The cameras can't run a security agent, and they send video to a cloud service over the network. Today, the cameras share the warehouse network with the user workstations.

        You are writing the security requirements for the cameras.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. installe 1 200 caméras IP dans ses entrepôts. Les caméras ne peuvent pas exécuter d'agent de sécurité, et elles envoient la vidéo à un service cloud par le réseau. Aujourd'hui, les caméras partagent le réseau des entrepôts avec les postes de travail des utilisateurs.

        Vous rédigez les exigences de sécurité des caméras.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The requirements can place the cameras in a network segment isolated from the user workstations by firewall rules.", fr: "Les exigences peuvent placer les caméras dans un segment réseau isolé des postes de travail des utilisateurs par des règles de pare-feu." }
        - id: s2
          text: { en: "Because the cameras can't host an agent, they can't be included in the inventory of devices and their vulnerabilities.", fr: "Comme les caméras ne peuvent pas héberger d'agent, elles ne peuvent pas figurer dans l'inventaire des appareils et de leurs vulnérabilités." }
        - id: s3
          text: { en: "A self-signed certificate generated on each camera is the recommended device identity for production.", fr: "Un certificat auto-signé généré sur chaque caméra est l'identité d'appareil recommandée pour la production." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Microsoft recommends network segmentation and firewalls to isolate IoT devices from other network resources. Devices that can't run an agent are still inventoried and assessed by network-based, agentless monitoring, such as Defender for Endpoint discovery for enterprise IoT. For identity, Microsoft doesn't recommend self-signed certificates in production: each device gets a unique certificate issued from a CA chain, with its private key protected in hardware.
        fr: |
          Microsoft recommande la segmentation réseau et des pare-feu pour isoler les appareils IoT des autres ressources réseau. Les appareils qui ne peuvent pas exécuter d'agent sont tout de même inventoriés et évalués par une surveillance réseau sans agent, comme la découverte de Defender for Endpoint pour l'IoT d'entreprise. Pour l'identité, Microsoft ne recommande pas les certificats auto-signés en production : chaque appareil reçoit un certificat unique émis par une chaîne d'autorités de certification, avec sa clé privée protégée dans le matériel.
      options:
        s2: { en: "Agentless, network-based discovery covers devices that can't host an agent.", fr: "La découverte réseau sans agent couvre les appareils qui ne peuvent pas héberger d'agent." }
        s3: { en: "Self-signed certificates aren't recommended for production; use certificates from a CA chain.", fr: "Les certificats auto-signés ne sont pas recommandés en production ; utilisez des certificats issus d'une chaîne d'autorités de certification." }
    references:
      - title: Secure your IoT solutions
        url: https://learn.microsoft.com/en-us/azure/iot/iot-overview-security
      - title: Authenticate identities with third-party X.509 certificates
        url: https://learn.microsoft.com/en-us/azure/iot-hub/authenticate-authorize-x509

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-32-06
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys has 9,000 Windows 11 devices that are Microsoft Entra joined and enrolled in Microsoft Intune. The devices still receive the Windows security baselines of the Security Compliance Toolkit through Group Policy, from the time they were domain-joined. Tailspin also has 60 domain controllers that run Windows Server 2025 and are managed by Group Policy.

        The security architect plans to replace the Group Policy baselines of the client devices with Intune security baselines. The plan assigns both the Intune security baseline for Windows and the Microsoft Defender for Endpoint baseline to all the clients.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose de 9 000 appareils Windows 11 joints à Microsoft Entra et inscrits dans Microsoft Intune. Les appareils reçoivent encore, par la stratégie de groupe, les bases de référence de sécurité Windows du Security Compliance Toolkit, depuis l'époque où ils étaient joints au domaine. Tailspin a aussi 60 contrôleurs de domaine qui exécutent Windows Server 2025 et sont gérés par la stratégie de groupe.

        L'architecte de sécurité prévoit de remplacer les bases de référence de stratégie de groupe des appareils clients par des bases de référence de sécurité Intune. Le plan attribue à tous les clients à la fois la base de référence de sécurité Intune pour Windows et la base de référence Microsoft Defender for Endpoint.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Tools of the Security Compliance Toolkit can help identify the cloud-based settings that replace the current Group Policy baseline of the clients.", fr: "Les outils du Security Compliance Toolkit peuvent aider à identifier les paramètres cloud qui remplacent la base de référence de stratégie de groupe actuelle des clients." }
        - id: s2
          text: { en: "The two Intune baselines assigned to the clients can manage the same setting with different default values.", fr: "Les deux bases de référence Intune attribuées aux clients peuvent gérer le même paramètre avec des valeurs par défaut différentes." }
        - id: s3
          text: { en: "The Intune security baseline for Windows also provides the settings that are specific to the domain controllers.", fr: "La base de référence de sécurité Intune pour Windows fournit aussi les paramètres propres aux contrôleurs de domaine." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The Security Compliance Toolkit doesn't enforce anything, but its tools help find the cloud-based options that replace on-premises GPO configurations. Separate baseline types, such as the Windows baseline and the Defender for Endpoint baseline, can include the same settings with different defaults, so the architect must review them for conflicts and manage each setting from one source. Intune baselines exclude the Group Policy baseline settings that apply only to on-premises domain controllers, which keep their Group Policy (or OSConfig) baseline.
        fr: |
          Le Security Compliance Toolkit n'applique rien, mais ses outils aident à trouver les options cloud qui remplacent les configurations d'objets de stratégie de groupe locales. Des types de bases de référence distincts, comme la base de référence Windows et celle de Defender for Endpoint, peuvent inclure les mêmes paramètres avec des valeurs par défaut différentes : l'architecte doit donc rechercher les conflits et gérer chaque paramètre depuis une seule source. Les bases de référence Intune excluent les paramètres de la base de référence de stratégie de groupe qui ne s'appliquent qu'aux contrôleurs de domaine locaux, lesquels conservent leur base de référence de stratégie de groupe (ou OSConfig).
      options:
        s3: { en: "Intune leaves out the settings that apply only to on-premises domain controllers.", fr: "Intune laisse de côté les paramètres qui ne s'appliquent qu'aux contrôleurs de domaine locaux." }
    references:
      - title: Use security baselines to help secure Windows devices you manage with Microsoft Intune
        url: https://learn.microsoft.com/en-us/intune/intune-service/protect/security-baselines

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-32-07
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware, Inc. has 3,000 Windows 11 laptops that are Microsoft Entra joined and 600 macOS laptops. All the laptops are enrolled in Microsoft Intune and onboarded to Microsoft Defender for Endpoint. Users browse the web with Microsoft Edge, Google Chrome and Mozilla Firefox.

        You are writing the client security requirements. The solution must use the products that Litware already has.

        What should you specify for each requirement? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. dispose de 3 000 ordinateurs portables Windows 11 joints à Microsoft Entra et de 600 ordinateurs portables macOS. Tous les ordinateurs portables sont inscrits dans Microsoft Intune et intégrés à Microsoft Defender for Endpoint. Les utilisateurs naviguent sur le web avec Microsoft Edge, Google Chrome et Mozilla Firefox.

        Vous rédigez les exigences de sécurité des clients. La solution doit utiliser les produits dont Litware dispose déjà.

        Que devez-vous spécifier pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          A Windows or macOS laptop whose disk isn't encrypted can't open Microsoft 365: [[enc]]

          Gambling and social media sites are blocked in every browser on Windows and macOS: [[web]]

          Signing in to Windows doesn't rely on a password that can be phished: [[cred]]
        fr: |
          Un ordinateur portable Windows ou macOS dont le disque n'est pas chiffré ne peut pas ouvrir Microsoft 365 : [[enc]]

          Les sites de jeux d'argent et de réseaux sociaux sont bloqués dans tous les navigateurs sous Windows et macOS : [[web]]

          La connexion à Windows ne repose pas sur un mot de passe qui peut être hameçonné : [[cred]]
      slots:
        - id: enc
          options:
            - { id: comp, text: { en: "A compliance policy that requires encryption, and Conditional Access that requires a compliant device", fr: "Une stratégie de conformité qui exige le chiffrement, et un accès conditionnel qui exige un appareil conforme" } }
            - { id: app, text: { en: "An app protection policy that encrypts corporate app data, and Conditional Access that requires it", fr: "Une stratégie de protection des applications qui chiffre les données d'entreprise des applications, et un accès conditionnel qui l'exige" } }
            - { id: base, text: { en: "The Intune security baseline for Windows, which turns on BitLocker on the laptops", fr: "La base de référence de sécurité Intune pour Windows, qui active BitLocker sur les ordinateurs portables" } }
            - { id: risk, text: { en: "The Defender for Endpoint device risk level, evaluated in a compliance policy", fr: "Le niveau de risque de l'appareil de Defender for Endpoint, évalué dans une stratégie de conformité" } }
        - id: web
          options:
            - { id: wcf, text: { en: "Web content filtering, with network protection in block mode", fr: "Le filtrage du contenu web, avec la protection réseau en mode blocage" } }
            - { id: ss, text: { en: "Microsoft Defender SmartScreen, turned on in Microsoft Edge", fr: "Microsoft Defender SmartScreen, activé dans Microsoft Edge" } }
            - { id: asr, text: { en: "Attack surface reduction rules, set to block mode", fr: "Les règles de réduction de la surface d'attaque, en mode blocage" } }
            - { id: wdac, text: { en: "App Control for Business policies in enforced mode", fr: "Des stratégies App Control for Business en mode appliqué" } }
        - id: cred
          options:
            - { id: whfb, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
            - { id: cg, text: { en: "Credential Guard", fr: "Credential Guard" } }
            - { id: laps, text: { en: "Windows LAPS", fr: "Windows LAPS" } }
            - { id: bl, text: { en: "BitLocker with a startup PIN", fr: "BitLocker avec un code PIN de démarrage" } }
    answer:
      values: { enc: comp, web: wcf, cred: whfb }
    explanation:
      correct:
        en: |
          Intune compliance policies for Windows and macOS can require encryption of data storage, and Conditional Access "Require device to be marked as compliant" blocks the noncompliant laptops. Web content filtering blocks site categories on Windows, macOS and Linux; outside Microsoft Edge on Windows, and in every browser on macOS, it's enforced by network protection in block mode. Windows Hello for Business replaces the password with a device-bound key unlocked by a PIN or biometric, so there is no password to phish.
        fr: |
          Les stratégies de conformité Intune pour Windows et macOS peuvent exiger le chiffrement du stockage des données, et l'accès conditionnel « Exiger que l'appareil soit marqué comme conforme » bloque les ordinateurs portables non conformes. Le filtrage du contenu web bloque des catégories de sites sous Windows, macOS et Linux ; en dehors de Microsoft Edge sous Windows, et dans tous les navigateurs sous macOS, il est appliqué par la protection réseau en mode blocage. Windows Hello Entreprise remplace le mot de passe par une clé liée à l'appareil, déverrouillée par un code PIN ou une donnée biométrique : il n'y a plus de mot de passe à hameçonner.
      options:
        app: { en: "App protection policies encrypt app data only, not the disk, and the page lists no macOS support.", fr: "Les stratégies de protection des applications chiffrent seulement les données des applications, pas le disque, et macOS n'est pas pris en charge." }
        base: { en: "A baseline configures Windows only and doesn't block access to Microsoft 365 when a laptop isn't encrypted.", fr: "Une base de référence configure seulement Windows et ne bloque pas l'accès à Microsoft 365 quand un ordinateur portable n'est pas chiffré." }
        ss: { en: "SmartScreen enforces web content filtering only in Microsoft Edge on Windows, not in Chrome, Firefox or on macOS.", fr: "SmartScreen n'applique le filtrage du contenu web que dans Microsoft Edge sous Windows, pas dans Chrome, Firefox ni sous macOS." }
        cg: { en: "Credential Guard protects secrets in memory, but users still type a password that can be phished.", fr: "Credential Guard protège les secrets en mémoire, mais les utilisateurs saisissent toujours un mot de passe qui peut être hameçonné." }
    references:
      - title: Web content filtering in Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/defender-endpoint/web-content-filtering
      - title: Windows Hello for Business
        url: https://learn.microsoft.com/en-us/windows/security/identity-protection/hello-for-business/

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-32-08
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Chemicals has three plants. Each plant has an OT network with PLCs, HMIs and engineering workstations, and is allowed outbound connections to Azure through a proxy. The corporate security operations center (SOC) uses Microsoft Sentinel.

        You need to recommend a monitoring solution that meets the following requirements:

        - Unauthorized changes to PLC programs and known OT malware are detected.
        - No monitoring component sits in the path of the OT traffic or sends traffic to the PLCs.
        - OT alerts are correlated with the IT incidents of the SOC.
        - When an attack from an engineering workstation is confirmed, automation run by the SOC adds a block rule to the OT firewall of the plant.

        What should you recommend?
      fr: |
        Northwind Chemicals possède trois usines. Chaque usine dispose d'un réseau OT avec des automates, des IHM et des stations d'ingénierie, et est autorisée à établir des connexions sortantes vers Azure par un proxy. Le centre des opérations de sécurité (SOC) de l'entreprise utilise Microsoft Sentinel.

        Vous devez recommander une solution de surveillance qui répond aux exigences suivantes :

        - Les modifications non autorisées des programmes des automates et les logiciels malveillants OT connus sont détectés.
        - Aucun composant de surveillance n'est placé sur le chemin du trafic OT ni n'envoie de trafic aux automates.
        - Les alertes OT sont corrélées aux incidents IT du SOC.
        - Quand une attaque depuis une station d'ingénierie est confirmée, une automatisation exécutée par le SOC ajoute une règle de blocage au pare-feu OT de l'usine.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "OT sensors connected inline between the PLC switches and the OT firewall, configured to drop malicious commands", fr: "Des capteurs OT connectés en ligne entre les commutateurs des automates et le pare-feu OT, configurés pour supprimer les commandes malveillantes" } }
        - { id: b, text: { en: "Locally managed OT sensors on SPAN ports, with alerts reviewed in each sensor console and threat intelligence uploaded manually", fr: "Des capteurs OT gérés localement sur des ports SPAN, avec les alertes examinées dans la console de chaque capteur et le renseignement sur les menaces chargé manuellement" } }
        - { id: c, text: { en: "Cloud-connected OT sensors on SPAN ports, with the Defender for IoT connector in Sentinel and a playbook that updates the OT firewall", fr: "Des capteurs OT connectés au cloud sur des ports SPAN, avec le connecteur Defender pour IoT dans Sentinel et un playbook qui met à jour le pare-feu OT" } }
        - { id: d, text: { en: "Enterprise IoT security in Defender for Endpoint, with discovery from the engineering workstations and alerts sent to Sentinel", fr: "La sécurité IoT d'entreprise dans Defender for Endpoint, avec la découverte depuis les stations d'ingénierie et les alertes envoyées à Sentinel" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Defender for IoT OT sensors analyze a copy of the traffic from a SPAN port or TAP, so they never sit inline or touch the PLCs, and their engines detect policy violations such as program changes and known industrial malware. Cloud-connected sensors send their alerts to Azure, where the Defender for IoT data connector streams them into Microsoft Sentinel for correlation; the blocking itself is done by the firewall, driven by a Sentinel playbook.
        fr: |
          Les capteurs OT de Defender pour IoT analysent une copie du trafic issue d'un port SPAN ou d'un TAP : ils ne sont jamais en ligne et ne touchent pas les automates, et leurs moteurs détectent les violations de stratégie comme les modifications de programmes ainsi que les logiciels malveillants industriels connus. Les capteurs connectés au cloud envoient leurs alertes à Azure, où le connecteur de données Defender pour IoT les transmet à Microsoft Sentinel pour la corrélation ; le blocage lui-même est fait par le pare-feu, piloté par un playbook Sentinel.
      options:
        a: { en: "OT sensors are passive and connect to a mirror port; an inline component would also break the second requirement.", fr: "Les capteurs OT sont passifs et se connectent à un port miroir ; un composant en ligne enfreindrait aussi la deuxième exigence." }
        b: { en: "Alerts kept in each sensor console never reach Sentinel, so they can't be correlated or trigger the SOC's automation.", fr: "Les alertes conservées dans la console de chaque capteur n'atteignent jamais Sentinel : elles ne peuvent être ni corrélées ni déclencher l'automatisation du SOC." }
        d: { en: "Enterprise IoT discovery targets corporate devices such as printers, not OT protocols, and can actively probe devices.", fr: "La découverte de l'IoT d'entreprise cible des appareils de l'entreprise comme les imprimantes, pas les protocoles OT, et peut sonder activement les appareils." }
    references:
      - title: Microsoft Defender for IoT architecture and components for your OT environment
        url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/architecture
      - title: "Tutorial: Connect Microsoft Defender for IoT with Microsoft Sentinel"
        url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/iot-solution

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-32-09
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso Pharma runs 300 Windows Server 2022 virtual machines in Azure and 80 on-premises Ubuntu 22.04 servers that are onboarded to Azure Arc. A laboratory controller in the on-premises datacenter runs an operating system that no longer receives security updates and can't be upgraded because of its instrument software. Defender for Servers Plan 2 is enabled, and Windows LAPS already manages the local administrator passwords of the Windows VMs.

        You need to recommend a solution that meets the following requirements:

        - The administrators of the Ubuntu servers sign in with their corporate identities, and no shared local password remains.
        - The risk that the laboratory controller is used as a starting point for lateral movement is reduced.

        Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso Pharma exécute 300 machines virtuelles Windows Server 2022 dans Azure et 80 serveurs Ubuntu 22.04 locaux intégrés à Azure Arc. Un contrôleur de laboratoire du centre de données local exécute un système d'exploitation qui ne reçoit plus de mises à jour de sécurité et qui ne peut pas être mis à niveau à cause de son logiciel d'instrument. Defender for Servers Plan 2 est activé, et Windows LAPS gère déjà les mots de passe d'administrateur local des machines virtuelles Windows.

        Vous devez recommander une solution qui répond aux exigences suivantes :

        - Les administrateurs des serveurs Ubuntu se connectent avec leurs identités d'entreprise, et aucun mot de passe local partagé ne subsiste.
        - Le risque que le contrôleur de laboratoire serve de point de départ à un mouvement latéral est réduit.

        Quelles deux actions devez-vous inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Assign Windows LAPS policies to the Ubuntu servers through Azure Arc", fr: "Attribuer des stratégies Windows LAPS aux serveurs Ubuntu par Azure Arc" } }
        - { id: b, text: { en: "Enable Microsoft Entra sign-in over SSH on the Ubuntu servers, and remove the shared local passwords", fr: "Activer la connexion Microsoft Entra par SSH sur les serveurs Ubuntu, et supprimer les mots de passe locaux partagés" } }
        - { id: c, text: { en: "Configure just-in-time VM access for the management ports of the laboratory controller", fr: "Configurer l'accès juste-à-temps aux machines virtuelles pour les ports de gestion du contrôleur de laboratoire" } }
        - { id: d, text: { en: "Move the laboratory controller to a dedicated network segment that allows only its required flows, and monitor its traffic", fr: "Déplacer le contrôleur de laboratoire dans un segment réseau dédié qui n'autorise que ses flux nécessaires, et surveiller son trafic" } }
        - { id: e, text: { en: "Rely on agentless machine scanning to assess and remediate the vulnerabilities of the laboratory controller", fr: "S'appuyer sur l'analyse sans agent des machines pour évaluer et corriger les vulnérabilités du contrôleur de laboratoire" } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Microsoft Entra sign-in for Linux works on Azure Arc-enabled servers too: administrators use their Entra credentials, access is granted by Azure roles, and local passwords and distributed SSH keys are no longer needed. A system that can't be patched is isolated in a dedicated segment that allows only the flows it needs, and its traffic is monitored, so a compromise can't spread.
        fr: |
          La connexion Microsoft Entra pour Linux fonctionne aussi sur les serveurs compatibles Azure Arc : les administrateurs utilisent leurs identifiants Entra, l'accès est accordé par des rôles Azure, et les mots de passe locaux et les clés SSH distribuées ne sont plus nécessaires. Un système qui ne peut pas être corrigé est isolé dans un segment dédié qui n'autorise que les flux nécessaires, et son trafic est surveillé, pour qu'une compromission ne puisse pas se propager.
      options:
        a: { en: "Windows LAPS manages Windows devices only; it can't manage the passwords of Linux servers.", fr: "Windows LAPS gère seulement des appareils Windows ; il ne peut pas gérer les mots de passe des serveurs Linux." }
        c: { en: "Just-in-time access works for Azure VMs and AWS EC2 instances, not for an on-premises server.", fr: "L'accès juste-à-temps fonctionne pour les machines virtuelles Azure et les instances AWS EC2, pas pour un serveur local." }
        e: { en: "Agentless scanning snapshots cloud disks, so it doesn't cover on-premises machines, and it doesn't install updates that no longer exist.", fr: "L'analyse sans agent prend des captures instantanées de disques cloud : elle ne couvre pas les machines locales, et elle n'installe pas des mises à jour qui n'existent plus." }
    references:
      - title: Sign in to a Linux virtual machine in Azure by using Microsoft Entra ID and OpenSSH
        url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-vm-sign-in-azure-ad-linux
      - title: Just-in-time machine access in Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-32-10
    objective: "3.2.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam, Inc. has 6,000 Windows 11 24H2 devices that are Microsoft Entra joined and managed by Microsoft Intune. Windows LAPS backs up the local administrator password of each device to Microsoft Entra ID. The tenant has Microsoft Entra ID P1 licenses.

        You are completing the Windows LAPS design. Each role assignment must follow the principle of least privilege within the stated requirement.

        What should you recommend for each requirement? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. dispose de 6 000 appareils Windows 11 24H2 joints à Microsoft Entra et gérés par Microsoft Intune. Windows LAPS sauvegarde le mot de passe d'administrateur local de chaque appareil dans Microsoft Entra ID. Le locataire dispose de licences Microsoft Entra ID P1.

        Vous finalisez la conception de Windows LAPS. Chaque attribution de rôle doit respecter le principe du privilège minimum dans le cadre de l'exigence indiquée.

        Que devez-vous recommander pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Level 2 support recovers the passwords of all the devices, and a Conditional Access policy that targets their directory role requires phishing-resistant MFA: [[recover]]

          Level 1 support sees when each password was last rotated and when it will rotate next, without reading the passwords: [[meta]]

          Within 4 hours after a technician signs in with the managed account, the password is changed and the technician's session ends: [[after]]
        fr: |
          Le support de niveau 2 récupère les mots de passe de tous les appareils, et une stratégie d'accès conditionnel qui cible leur rôle d'annuaire exige une MFA résistante à l'hameçonnage : [[recover]]

          Le support de niveau 1 voit quand chaque mot de passe a tourné pour la dernière fois et quand il tournera la prochaine fois, sans lire les mots de passe : [[meta]]

          Dans les 4 heures qui suivent la connexion d'un technicien avec le compte géré, le mot de passe est changé et la session du technicien prend fin : [[after]]
      slots:
        - id: recover
          options:
            - { id: cda, text: { en: "Cloud Device Administrator, assigned at the tenant scope", fr: "Cloud Device Administrator, attribué à l'étendue du locataire" } }
            - { id: custom, text: { en: "A custom role with only the deviceLocalCredentials/password/read permission", fr: "Un rôle personnalisé avec la seule autorisation deviceLocalCredentials/password/read" } }
            - { id: intune, text: { en: "Intune Administrator, assigned at the tenant scope", fr: "Intune Administrator, attribué à l'étendue du locataire" } }
            - { id: au, text: { en: "Cloud Device Administrator, scoped to an administrative unit of all the devices", fr: "Cloud Device Administrator, limité à une unité administrative de tous les appareils" } }
        - id: meta
          options:
            - { id: sr, text: Security Reader }
            - { id: cda, text: Cloud Device Administrator }
            - { id: intune, text: Intune Administrator }
        - id: after
          options:
            - { id: post, text: { en: "A post-authentication action that resets the password and signs out, with a 4-hour delay", fr: "Une action post-authentification qui réinitialise le mot de passe et déconnecte, avec un délai de 4 heures" } }
            - { id: hist, text: { en: "Password history in the Windows LAPS policy", fr: "L'historique des mots de passe dans la stratégie Windows LAPS" } }
            - { id: age, text: { en: "A password age of one day in the Windows LAPS policy", fr: "Une durée de vie du mot de passe d'un jour dans la stratégie Windows LAPS" } }
            - { id: emu, text: { en: "Legacy Microsoft LAPS emulation mode", fr: "Le mode d'émulation de l'ancien Microsoft LAPS" } }
    answer:
      values: { recover: cda, meta: sr, after: post }
    explanation:
      correct:
        en: |
          Conditional Access can target the built-in roles that recover LAPS passwords, but not custom roles or roles scoped to an administrative unit, so level 2 gets Cloud Device Administrator at the tenant scope, which grants less than Intune Administrator. Security Reader can read the LAPS metadata (rotation times) but not the passwords. Post-authentication actions rotate the password after the managed account is used; "reset the password and sign out" with a 4-hour delay ends the session too.
        fr: |
          L'accès conditionnel peut cibler les rôles intégrés qui récupèrent les mots de passe LAPS, mais pas les rôles personnalisés ni les rôles limités à une unité administrative : le niveau 2 reçoit donc Cloud Device Administrator à l'étendue du locataire, qui accorde moins qu'Intune Administrator. Security Reader peut lire les métadonnées LAPS (dates de rotation) mais pas les mots de passe. Les actions post-authentification font tourner le mot de passe après l'utilisation du compte géré ; « réinitialiser le mot de passe et déconnecter » avec un délai de 4 heures met aussi fin à la session.
      options:
        custom: { en: "The custom role is less privileged, but Conditional Access can't target custom roles.", fr: "Le rôle personnalisé est moins privilégié, mais l'accès conditionnel ne peut pas cibler les rôles personnalisés." }
        au: { en: "Conditional Access doesn't support role assignments scoped to an administrative unit.", fr: "L'accès conditionnel ne prend pas en charge les attributions de rôles limitées à une unité administrative." }
        hist: { en: "Password history isn't supported with Microsoft Entra ID backup, and it doesn't rotate a password after use.", fr: "L'historique des mots de passe n'est pas pris en charge avec la sauvegarde dans Microsoft Entra ID, et il ne fait pas tourner un mot de passe après usage." }
        age: { en: "The password age rotates on a schedule, whether or not the account was used, and doesn't end the session.", fr: "La durée de vie fait tourner le mot de passe selon un calendrier, que le compte ait été utilisé ou non, et ne met pas fin à la session." }
    references:
      - title: Windows Local Administrator Password Solution in Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-manage-local-admin-passwords
      - title: Configure policy settings for Windows LAPS
        url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-management-policy-settings
