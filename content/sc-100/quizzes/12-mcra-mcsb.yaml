chapter: 12-mcra-mcsb
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. uses the Microsoft cloud security benchmark (MCSB) v2 as its control baseline. The architects must find the controls that cover the security of the CI/CD pipelines, the source code repositories and the infrastructure as code templates of the development teams.

        Which MCSB control domain should they review?
      fr: |
        Contoso, Ltd. utilise le Microsoft cloud security benchmark (MCSB) v2 comme référentiel de contrôles. Les architectes doivent trouver les contrôles qui couvrent la sécurité des pipelines CI/CD, des dépôts de code source et des modèles d'infrastructure as code des équipes de développement.

        Quel domaine de contrôles du MCSB doivent-ils examiner ?
    body:
      options:
        - { id: a, text: "PV: Posture and vulnerability management" }
        - { id: b, text: "AM: Asset management" }
        - { id: c, text: "DS: DevOps security" }
        - { id: d, text: "ES: Endpoint security" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          MCSB v2 is organized in 12 control domains, and DevOps security (DS) is the one that covers the software development lifecycle: pipelines, repositories, dependencies and infrastructure as code. The other domains apply to running workloads.
        fr: |
          Le MCSB v2 est organisé en 12 domaines de contrôles, et DevOps security (DS) est celui qui couvre le cycle de vie du développement logiciel : pipelines, dépôts, dépendances et infrastructure as code. Les autres domaines s'appliquent aux charges de travail en exécution.
      options:
        a: { en: "Posture and vulnerability management covers configuration and vulnerability assessment of the deployed resources, not the development pipeline.", fr: "Posture and vulnerability management couvre l'évaluation de la configuration et des vulnérabilités des ressources déployées, pas le pipeline de développement." }
        b: { en: "Asset management covers the inventory and approval of assets and services, not the security of the build process.", fr: "Asset management couvre l'inventaire et l'approbation des ressources et des services, pas la sécurité du processus de build." }
        d: { en: "Endpoint security covers EDR and anti-malware on virtual machines and devices.", fr: "Endpoint security couvre l'EDR et l'anti-programme malveillant sur les machines virtuelles et les appareils." }
    references:
      - title: Overview of Microsoft cloud security benchmark v2 (preview)
        url: https://learn.microsoft.com/en-us/security/benchmark/azure/overview

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-12-02
    objective: "1.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The program office of Fabrikam, Inc. is planning its Zero Trust program with the Zero Trust adoption framework. The program manager notices that the framework organizes the work in the phases Define strategy, Plan, Ready, Adopt, Govern and Manage.

        Which Microsoft framework uses the same lifecycle phases?
      fr: |
        Le bureau de programme de Fabrikam, Inc. planifie son programme Confiance Zéro avec le framework d'adoption de la Confiance Zéro. Le chef de programme remarque que le framework organise le travail selon les phases Define strategy, Plan, Ready, Adopt, Govern et Manage.

        Quel framework Microsoft utilise les mêmes phases de cycle de vie ?
    body:
      options:
        - { id: a, text: "The Microsoft Cybersecurity Reference Architectures (MCRA)" }
        - { id: b, text: "The Azure Well-Architected Framework (WAF)" }
        - { id: c, text: "The Microsoft cloud security benchmark (MCSB)" }
        - { id: d, text: "The Microsoft Cloud Adoption Framework for Azure (CAF)" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Zero Trust adoption framework follows the lifecycle phases of the Cloud Adoption Framework. The difference is the scale motion: CAF repeats its process for each workload, whereas Zero Trust applies one piece of the architecture across the whole estate before moving to the next piece.
        fr: |
          Le framework d'adoption de la Confiance Zéro suit les phases de cycle de vie du Cloud Adoption Framework. La différence tient au mouvement de mise à l'échelle : le CAF répète son processus pour chaque charge de travail, alors que la Confiance Zéro applique un élément de l'architecture à tout le patrimoine avant de passer à l'élément suivant.
      options:
        a: { en: "The MCRA are architecture diagrams of capabilities and integrations; they don't define program phases.", fr: "Les MCRA sont des diagrammes d'architecture des capacités et des intégrations ; elles ne définissent pas de phases de programme." }
        b: { en: "The Well-Architected Framework is organized in pillars (security, reliability...) to design workloads, not in adoption phases.", fr: "Le Well-Architected Framework est organisé en piliers (sécurité, fiabilité...) pour concevoir des charges de travail, pas en phases d'adoption." }
        c: { en: "The MCSB is organized in control domains, not in lifecycle phases.", fr: "Le MCSB est organisé en domaines de contrôles, pas en phases de cycle de vie." }
    references:
      - title: Zero Trust adoption framework overview
        url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/zero-trust-adoption-overview

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-12-03
    objective: "1.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. uses Microsoft 365 E5. Employees paste customer contracts and pricing data into prompts of generative AI apps, including Microsoft 365 Copilot and consumer AI websites.

        The security team needs to detect the employees whose AI interactions involve sensitive information, score this risk per user together with their other risky activities, and keep the users pseudonymized for the analysts.

        What should you recommend?
      fr: |
        Litware, Inc. utilise Microsoft 365 E5. Des employés collent des contrats clients et des données tarifaires dans les invites d'applications d'IA générative, dont Microsoft 365 Copilot et des sites web d'IA grand public.

        L'équipe de sécurité doit détecter les employés dont les interactions avec l'IA impliquent des informations sensibles, noter ce risque par utilisateur avec leurs autres activités risquées, et garder les utilisateurs pseudonymisés pour les analystes.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A Microsoft Entra ID Protection user risk policy", fr: "Une stratégie de risque utilisateur de Microsoft Entra ID Protection" } }
        - { id: b, text: { en: "An Insider Risk Management policy from the Risky AI usage template", fr: "Une stratégie Insider Risk Management créée à partir du modèle Risky AI usage" } }
        - { id: c, text: { en: "Cloud Discovery of AI apps in Microsoft Defender for Cloud Apps", fr: "La découverte Cloud Discovery des applications d'IA dans Microsoft Defender for Cloud Apps" } }
        - { id: d, text: { en: "Microsoft Purview Audit searches of the Copilot interactions", fr: "Des recherches Microsoft Purview Audit sur les interactions Copilot" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Misuse of AI tools by a legitimate employee is an insider risk. Microsoft Purview Insider Risk Management has a Risky AI usage template that detects risky prompts and responses in AI apps, correlates them with the user's other risky activities into a risk score, and pseudonymizes users by default.
        fr: |
          Le détournement d'outils d'IA par un employé légitime est un risque interne. Microsoft Purview Insider Risk Management propose un modèle Risky AI usage qui détecte les invites et réponses risquées dans les applications d'IA, les corrèle avec les autres activités risquées de l'utilisateur dans un score de risque, et pseudonymise les utilisateurs par défaut.
      options:
        a: { en: "ID Protection evaluates the risk that an account is compromised; these employees use their own accounts legitimately.", fr: "ID Protection évalue le risque qu'un compte soit compromis ; ces employés utilisent légitimement leurs propres comptes." }
        c: { en: "Cloud Discovery inventories and scores the AI apps used in the organization; it doesn't score the sensitive content of each user's prompts.", fr: "Cloud Discovery inventorie et note les applications d'IA utilisées dans l'organisation ; il ne note pas le contenu sensible des invites de chaque utilisateur." }
        d: { en: "Audit searches are manual investigations that show user identities; they don't score risk per user or pseudonymize.", fr: "Les recherches d'audit sont des investigations manuelles qui montrent l'identité des utilisateurs ; elles ne notent pas le risque par utilisateur et ne pseudonymisent pas." }
    references:
      - title: Learn about Insider Risk Management
        url: https://learn.microsoft.com/en-us/purview/insider-risk-management

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-12-04
    objective: "1.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation stores contracts, designs and customer files in SharePoint Online, OneDrive, Teams and on-premises file shares. Nobody knows where the confidential files are, and employees regularly share them with partners.

        The CISO wants a Zero Trust initiative whose goal is to locate the confidential files and keep them protected wherever they go, including when they leave the organization. The initiative isn't driven by a regulation or an audit.

        Which business scenario of the Zero Trust adoption framework should the initiative follow?
      fr: |
        Adatum Corporation stocke des contrats, des plans et des dossiers clients dans SharePoint Online, OneDrive, Teams et des partages de fichiers locaux. Personne ne sait où se trouvent les fichiers confidentiels, et les employés les partagent régulièrement avec des partenaires.

        Le RSSI veut une initiative Confiance Zéro dont l'objectif est de localiser les fichiers confidentiels et de les protéger où qu'ils aillent, y compris quand ils quittent l'organisation. L'initiative n'est motivée ni par une réglementation ni par un audit.

        Quel scénario métier du framework d'adoption de la Confiance Zéro l'initiative doit-elle suivre ?
    body:
      options:
        - { id: a, text: Meet regulatory and compliance requirements }
        - { id: b, text: Secure remote and hybrid work }
        - { id: c, text: Identify and protect sensitive business data }
        - { id: d, text: Rapidly modernize your security posture }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Knowing where sensitive data is and keeping it protected wherever it goes is the goal of the Identify and protect sensitive business data business scenario, built on Microsoft Purview Information Protection and Data Loss Prevention.
        fr: |
          Savoir où sont les données sensibles et les protéger où qu'elles aillent est l'objectif du scénario métier Identify and protect sensitive business data, qui s'appuie sur Microsoft Purview Information Protection et la Protection contre la perte de données.
      options:
        a: { en: "This scenario maps regulations to controls and proves compliance; the stem has no regulatory requirement.", fr: "Ce scénario mappe des réglementations à des contrôles et prouve la conformité ; l'énoncé ne contient aucune exigence réglementaire." }
        b: { en: "This scenario secures users who work from anywhere on managed and personal devices; it isn't about locating and protecting data.", fr: "Ce scénario sécurise les utilisateurs qui travaillent de partout sur des appareils gérés et personnels ; il ne vise pas à localiser et protéger les données." }
        d: { en: "This scenario measures and raises the overall security posture; it doesn't focus on sensitive data.", fr: "Ce scénario mesure et élève la posture de sécurité globale ; il n'est pas centré sur les données sensibles." }
    references:
      - title: Zero Trust adoption framework overview
        url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/zero-trust-adoption-overview

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-12-05
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys assessed its generative AI application against the seven artificial intelligence security controls of the Microsoft cloud security benchmark (MCSB) v2, and all of them are met. A second review finds two more issues:

        - The Azure OpenAI resource accepts traffic from any internet address.
        - The application authenticates to the resource with an API key stored in its configuration file.

        Which two MCSB control domains cover these issues? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys a évalué son application d'IA générative par rapport aux sept contrôles de sécurité de l'intelligence artificielle du Microsoft cloud security benchmark (MCSB) v2, et tous sont respectés. Une seconde revue relève deux autres problèmes :

        - La ressource Azure OpenAI accepte le trafic de n'importe quelle adresse internet.
        - L'application s'authentifie auprès de la ressource avec une clé API stockée dans son fichier de configuration.

        Quels sont les deux domaines de contrôles du MCSB qui couvrent ces problèmes ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "NS: Network security" }
        - { id: b, text: "BR: Backup and recovery" }
        - { id: c, text: "IM: Identity management" }
        - { id: d, text: "IR: Incident response" }
        - { id: e, text: "AM: Asset management" }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          AI workloads inherit the other MCSB domains. Restricting network access to a cloud-native service, for example with a private endpoint and public network access disabled, is a Network security (NS) control. Replacing a stored key with an application identity, such as a managed identity, is an Identity management (IM) control.
        fr: |
          Les charges de travail d'IA héritent des autres domaines du MCSB. Restreindre l'accès réseau à un service cloud natif, par exemple avec un point de terminaison privé et l'accès réseau public désactivé, est un contrôle Network security (NS). Remplacer une clé stockée par une identité d'application, comme une identité managée, est un contrôle Identity management (IM).
      options:
        b: { en: "Backup and recovery covers backups and restore tests, not network exposure or authentication.", fr: "Backup and recovery couvre les sauvegardes et les tests de restauration, pas l'exposition réseau ni l'authentification." }
        d: { en: "Incident response covers preparation, detection and handling of incidents, not the configuration that prevents them.", fr: "Incident response couvre la préparation, la détection et le traitement des incidents, pas la configuration qui les prévient." }
        e: { en: "Asset management covers inventory and approved services; it doesn't define how the application authenticates or which networks can connect.", fr: "Asset management couvre l'inventaire et les services approuvés ; il ne définit pas comment l'application s'authentifie ni quels réseaux peuvent se connecter." }
    references:
      - title: Overview of Microsoft cloud security benchmark v2 (preview)
        url: https://learn.microsoft.com/en-us/security/benchmark/azure/overview

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-12-06
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank is designing an IT operations agent in Microsoft Foundry. Administrators ask the agent in natural language to restart, resize or delete Azure virtual machines. The current design is as follows:

        - Models come only from the approved Azure Machine Learning registry, enforced by Azure Policy.
        - Prompt Shields and output filtering of Azure AI Content Safety inspect every request and response.
        - A version-controlled safety system message defines the role of the agent and forbids destructive actions outside maintenance windows.
        - The agent runs with a service principal that holds the Contributor role on all the subscriptions.
        - Defender for Cloud threat protection for AI services sends alerts to the SOC, and PyRIT tests run in the CI/CD pipeline.
        - The agent executes every request immediately.

        You need to identify the controls of the artificial intelligence security domain of the Microsoft cloud security benchmark (MCSB) that the design doesn't meet.

        Which controls should you identify?
      fr: |
        Woodgrove Bank conçoit un agent d'exploitation informatique dans Microsoft Foundry. Les administrateurs demandent à l'agent, en langage naturel, de redémarrer, redimensionner ou supprimer des machines virtuelles Azure. La conception actuelle est la suivante :

        - Les modèles proviennent uniquement du registre Azure Machine Learning approuvé, ce qu'impose Azure Policy.
        - Les Prompt Shields et le filtrage des sorties d'Azure AI Content Safety inspectent chaque requête et chaque réponse.
        - Un message système de sécurité sous contrôle de version définit le rôle de l'agent et interdit les actions destructrices en dehors des fenêtres de maintenance.
        - L'agent s'exécute avec un principal de service qui détient le rôle Contributor sur tous les abonnements.
        - La protection contre les menaces de Defender for Cloud pour les services d'IA envoie des alertes au SOC, et des tests PyRIT s'exécutent dans le pipeline CI/CD.
        - L'agent exécute chaque demande immédiatement.

        Vous devez identifier les contrôles du domaine de sécurité de l'intelligence artificielle du Microsoft cloud security benchmark (MCSB) que la conception ne respecte pas.

        Quels contrôles devez-vous identifier ?
    body:
      options:
        - { id: a, text: "AI-2: Implement multi-layered content filtering, and AI-3: Adopt safety meta-prompts" }
        - { id: b, text: "AI-3: Adopt safety meta-prompts, and AI-5: Ensure human-in-the-loop" }
        - { id: c, text: "AI-4: Apply least privilege for agent functions, and AI-6: Establish monitoring and detection" }
        - { id: d, text: "AI-4: Apply least privilege for agent functions, and AI-5: Ensure human-in-the-loop" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The design relies on prompts and filters to restrain the agent. A service principal with Contributor on every subscription gives the agent far more than its purpose requires, which fails AI-4, and destructive actions such as deleting virtual machines run with no human approval, which fails AI-5. Least privilege and human review are the controls that still limit the damage when filtering and system instructions are bypassed.
        fr: |
          La conception s'appuie sur des invites et des filtres pour retenir l'agent. Un principal de service avec Contributor sur tous les abonnements donne à l'agent bien plus que ce que son objectif exige, ce qui ne respecte pas AI-4, et des actions destructrices comme la suppression de machines virtuelles s'exécutent sans approbation humaine, ce qui ne respecte pas AI-5. Le moindre privilège et la revue humaine sont les contrôles qui limitent encore les dégâts quand le filtrage et les instructions système sont contournés.
      options:
        a: { en: "Prompt Shields with output filtering meet AI-2, and the version-controlled safety system message meets AI-3.", fr: "Les Prompt Shields avec le filtrage des sorties respectent AI-2, et le message système de sécurité sous contrôle de version respecte AI-3." }
        b: { en: "AI-5 is missed, but the version-controlled safety system message meets AI-3; the other missing control is AI-4.", fr: "AI-5 n'est pas respecté, mais le message système de sécurité sous contrôle de version respecte AI-3 ; l'autre contrôle manquant est AI-4." }
        c: { en: "Defender for Cloud threat protection for AI services with SOC alerts meets AI-6; the missing control besides AI-4 is human review.", fr: "La protection contre les menaces de Defender for Cloud pour les services d'IA avec des alertes au SOC respecte AI-6 ; le contrôle manquant en plus d'AI-4 est la revue humaine." }
    references:
      - title: "Microsoft cloud security benchmark v2 - Artificial Intelligence Security"
        url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-12-07
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware, Inc. develops a SaaS platform. The code is stored in Azure Repos, and some teams use GitHub Enterprise Cloud. The applications use hundreds of open-source packages. Last month, a developer committed a storage account key to a repository, and a vulnerable package reached production.

        After a supply chain attack against a competitor, the CISO sets the following requirements:

        - Vulnerable dependencies and secrets in code must be detected in the repositories and pipelines, before deployment.
        - The security team, which doesn't use Azure DevOps or GitHub, must see these findings for all the repositories, together with the posture of the cloud resources.
        - The solution must minimize the number of products to deploy.

        Which two solutions should you recommend? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. développe une plateforme SaaS. Le code est stocké dans Azure Repos, et certaines équipes utilisent GitHub Enterprise Cloud. Les applications utilisent des centaines de packages open source. Le mois dernier, un développeur a validé une clé de compte de stockage dans un dépôt, et un package vulnérable est arrivé en production.

        Après une attaque de la chaîne d'approvisionnement contre un concurrent, le RSSI fixe les exigences suivantes :

        - Les dépendances vulnérables et les secrets présents dans le code doivent être détectés dans les dépôts et les pipelines, avant le déploiement.
        - L'équipe de sécurité, qui n'utilise ni Azure DevOps ni GitHub, doit voir ces résultats pour tous les dépôts, avec la posture des ressources cloud.
        - La solution doit réduire au minimum le nombre de produits à déployer.

        Quelles sont les deux solutions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "GitHub Advanced Security for the GitHub and Azure DevOps repositories", fr: "GitHub Advanced Security pour les dépôts GitHub et Azure DevOps" } }
        - { id: b, text: { en: "Microsoft Defender Vulnerability Management on the build agents of the pipelines", fr: "Microsoft Defender Vulnerability Management sur les agents de build des pipelines" } }
        - { id: c, text: { en: "Microsoft Defender EASM, with the code hosting domains as discovery seeds", fr: "Microsoft Defender EASM, avec les domaines d'hébergement du code comme points de départ de la découverte" } }
        - { id: d, text: { en: "DevOps security in Microsoft Defender for Cloud, with connectors to both platforms", fr: "La sécurité DevOps de Microsoft Defender for Cloud, avec des connecteurs vers les deux plateformes" } }
        - { id: e, text: { en: "Microsoft Purview Data Loss Prevention policies for the repositories", fr: "Des stratégies de Protection contre la perte de données Microsoft Purview pour les dépôts" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          GitHub Advanced Security, available for GitHub and for Azure DevOps, provides dependency scanning, secret scanning and code scanning in the repositories and pipelines. DevOps security in Defender for Cloud connects Azure DevOps and GitHub and shows these findings to the security team in the same tool as the posture of the cloud resources.
        fr: |
          GitHub Advanced Security, disponible pour GitHub et pour Azure DevOps, fournit l'analyse des dépendances, l'analyse des secrets et l'analyse du code dans les dépôts et les pipelines. La sécurité DevOps de Defender for Cloud connecte Azure DevOps et GitHub et montre ces résultats à l'équipe de sécurité dans le même outil que la posture des ressources cloud.
      options:
        b: { en: "Defender Vulnerability Management assesses the software installed on the build agents; it doesn't scan the code, its dependencies or its secrets in the repositories.", fr: "Defender Vulnerability Management évalue les logiciels installés sur les agents de build ; il n'analyse ni le code, ni ses dépendances, ni ses secrets dans les dépôts." }
        c: { en: "Defender EASM discovers internet-facing assets from the outside; it doesn't see the code or its dependencies.", fr: "Defender EASM découvre les ressources exposées sur internet depuis l'extérieur ; il ne voit ni le code ni ses dépendances." }
        e: { en: "Purview DLP protects sensitive information in Microsoft 365 and endpoints; it doesn't scan code repositories for secrets or vulnerable packages.", fr: "La DLP Purview protège les informations sensibles dans Microsoft 365 et sur les points de terminaison ; elle n'analyse pas les dépôts de code à la recherche de secrets ou de packages vulnérables." }
    references:
      - title: Microsoft Defender for Cloud DevOps Security Benefits
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-devops-introduction

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-12-08
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware, Inc. aligns its security architecture with the capabilities view of the Microsoft Cybersecurity Reference Architectures (MCRA). Remote employees use a legacy VPN to reach on-premises applications: file shares, RDP to servers, and an ERP client that uses a proprietary TCP protocol. The company also runs third-party firewalls and a third-party proxy, and it uses Microsoft Defender XDR.

        The CISO has the following requirements:

        - Replace the VPN for all the on-premises applications, with Conditional Access evaluated for each application.
        - Filter the internet traffic of remote employees by web category and apply Conditional Access to it, without the third-party proxy.
        - Correlate the logs of the third-party firewalls with the Microsoft alerts and run automated response playbooks.

        You need to recommend a capability for each requirement.

        How should you complete the recommendation? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. aligne son architecture de sécurité sur la vue des capacités des Microsoft Cybersecurity Reference Architectures (MCRA). Les employés à distance utilisent un VPN hérité pour atteindre des applications locales : des partages de fichiers, le RDP vers des serveurs et un client ERP qui utilise un protocole TCP propriétaire. L'entreprise exploite aussi des pare-feu tiers et un proxy tiers, et elle utilise Microsoft Defender XDR.

        Le RSSI a les exigences suivantes :

        - Remplacer le VPN pour toutes les applications locales, avec un accès conditionnel évalué pour chaque application.
        - Filtrer le trafic internet des employés à distance par catégorie web et lui appliquer l'accès conditionnel, sans le proxy tiers.
        - Corréler les journaux des pare-feu tiers avec les alertes Microsoft et exécuter des playbooks de réponse automatisée.

        Vous devez recommander une capacité pour chaque exigence.

        Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Replace the VPN: [[s1]]

          Filter internet traffic: [[s2]]

          Correlate third-party logs and automate the response: [[s3]]
        fr: |
          Remplacer le VPN : [[s1]]

          Filtrer le trafic internet : [[s2]]

          Corréler les journaux tiers et automatiser la réponse : [[s3]]
      slots:
        - id: s1
          options:
            - { id: appproxy, text: { en: "Microsoft Entra application proxy", fr: "Le proxy d'application Microsoft Entra" } }
            - { id: epa, text: Microsoft Entra Private Access }
            - { id: eia, text: Microsoft Entra Internet Access }
            - { id: bastion, text: Azure Bastion }
        - id: s2
          options:
            - { id: eia, text: Microsoft Entra Internet Access }
            - { id: epa, text: Microsoft Entra Private Access }
            - { id: mdca, text: Microsoft Defender for Cloud Apps }
        - id: s3
          options:
            - { id: xdr, text: Microsoft Defender XDR }
            - { id: xspm, text: Microsoft Security Exposure Management }
            - { id: sentinel, text: Microsoft Sentinel }
    answer:
      values: { s1: epa, s2: eia, s3: sentinel }
    explanation:
      correct:
        en: |
          Microsoft Entra Private Access gives access to on-premises applications on any TCP or UDP port without a VPN, with Conditional Access per application. Microsoft Entra Internet Access is the secure web gateway that filters internet traffic by web category and applies Conditional Access to it. Microsoft Sentinel is the SIEM and SOAR of the MCRA: it ingests third-party logs, correlates them with Microsoft alerts and runs playbooks.
        fr: |
          Microsoft Entra Private Access donne accès aux applications locales sur n'importe quel port TCP ou UDP sans VPN, avec un accès conditionnel par application. Microsoft Entra Internet Access est la passerelle web sécurisée qui filtre le trafic internet par catégorie web et lui applique l'accès conditionnel. Microsoft Sentinel est le SIEM et SOAR des MCRA : il ingère les journaux tiers, les corrèle avec les alertes Microsoft et exécute des playbooks.
      options:
        appproxy: { en: "Application proxy publishes on-premises web applications only; it can't carry file shares, RDP or a proprietary TCP protocol.", fr: "Le proxy d'application ne publie que des applications web locales ; il ne peut pas transporter les partages de fichiers, le RDP ni un protocole TCP propriétaire." }
        bastion: { en: "Azure Bastion gives RDP and SSH access to Azure virtual machines, not to on-premises applications.", fr: "Azure Bastion donne un accès RDP et SSH aux machines virtuelles Azure, pas aux applications locales." }
        mdca: { en: "Defender for Cloud Apps discovers and controls SaaS applications; it isn't the secure web gateway for all internet traffic.", fr: "Defender for Cloud Apps découvre et contrôle les applications SaaS ; ce n'est pas la passerelle web sécurisée de tout le trafic internet." }
        xdr: { en: "Defender XDR correlates the signals of the Microsoft Defender products; correlating third-party firewall logs with playbooks is the role of the SIEM and SOAR.", fr: "Defender XDR corrèle les signaux des produits Microsoft Defender ; corréler les journaux de pare-feu tiers avec des playbooks est le rôle du SIEM et SOAR." }
    references:
      - title: What is Global Secure Access?
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access
      - title: What is Microsoft Sentinel SIEM?
        url: https://learn.microsoft.com/en-us/azure/sentinel/overview

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-12-09
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has 120 applications in Azure and on-premises. Its employees work from the offices on managed devices, and the security posture scores are already tracked monthly. Last year, a ransomware attack spread from one compromised server to most of the datacenter, and recovery took three weeks.

        The board asks for a Zero Trust initiative whose goal is to contain an attacker and recover quickly from the next breach. The program manager proposes to reuse the approach of the cloud migration, which followed the Cloud Adoption Framework (CAF): complete every Zero Trust control for one application before moving to the next one.

        You need to recommend how to plan the initiative by using the Zero Trust adoption framework.

        What should you recommend?
      fr: |
        Northwind Traders dispose de 120 applications dans Azure et en local. Ses employés travaillent depuis les bureaux sur des appareils gérés, et les scores de posture de sécurité sont déjà suivis chaque mois. L'an dernier, une attaque par rançongiciel s'est propagée d'un serveur compromis à la plus grande partie du centre de données, et la récupération a pris trois semaines.

        Le conseil d'administration demande une initiative Confiance Zéro dont l'objectif est de contenir un attaquant et de récupérer vite lors de la prochaine violation. Le chef de programme propose de reprendre l'approche de la migration cloud, qui a suivi le Cloud Adoption Framework (CAF) : terminer tous les contrôles Confiance Zéro pour une application avant de passer à la suivante.

        Vous devez recommander comment planifier l'initiative avec le framework d'adoption de la Confiance Zéro.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Rapidly modernize your security posture, applying one piece of the architecture across all the applications before the next piece", fr: "Rapidly modernize your security posture, en appliquant un élément de l'architecture à toutes les applications avant l'élément suivant" } }
        - { id: b, text: { en: "Prevent or reduce business damage from a breach, completing every control for one application before the next application", fr: "Prevent or reduce business damage from a breach, en terminant tous les contrôles pour une application avant l'application suivante" } }
        - { id: c, text: { en: "Prevent or reduce business damage from a breach, applying one piece of the architecture across all the applications before the next piece", fr: "Prevent or reduce business damage from a breach, en appliquant un élément de l'architecture à toutes les applications avant l'élément suivant" } }
        - { id: d, text: { en: "Secure remote and hybrid work, completing every control for one application before the next application", fr: "Secure remote and hybrid work, en terminant tous les contrôles pour une application avant l'application suivante" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Containing an attacker and recovering quickly is the goal of the Prevent or reduce business damage from a breach business scenario. The adoption framework uses the CAF lifecycle phases but not its scale motion: instead of repeating everything per workload, it applies one piece of the architecture, such as segmentation, across the whole estate, then repeats with the next piece.
        fr: |
          Contenir un attaquant et récupérer vite est l'objectif du scénario métier Prevent or reduce business damage from a breach. Le framework d'adoption utilise les phases de cycle de vie du CAF mais pas son mouvement de mise à l'échelle : au lieu de tout répéter par charge de travail, il applique un élément de l'architecture, comme la segmentation, à tout le patrimoine, puis recommence avec l'élément suivant.
      options:
        a: { en: "The scale motion is right, but measuring and raising the posture isn't the goal; the posture scores are already tracked, and the board asks to contain a breach and recover.", fr: "Le mouvement de mise à l'échelle est juste, mais mesurer et élever la posture n'est pas l'objectif ; les scores de posture sont déjà suivis, et le conseil demande de contenir une violation et de récupérer." }
        b: { en: "The scenario is right, but completing every control per application is the CAF motion, which the Zero Trust adoption framework doesn't follow.", fr: "Le scénario est juste, mais terminer tous les contrôles par application est le mouvement du CAF, que le framework d'adoption de la Confiance Zéro ne suit pas." }
        d: { en: "The employees work from the offices on managed devices, so remote work isn't the goal, and the per-application motion is the CAF one.", fr: "Les employés travaillent depuis les bureaux sur des appareils gérés : le travail à distance n'est pas l'objectif, et le mouvement par application est celui du CAF." }
    references:
      - title: Zero Trust adoption framework overview
        url: https://learn.microsoft.com/en-us/security/zero-trust/adopt/zero-trust-adoption-overview

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-12-10
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. uses Microsoft 365 E5 and has deployed Microsoft Purview Insider Risk Management with the default settings. A Communication Compliance policy already detects threatening and harassing messages in Teams and Exchange.

        The legal department sets the following requirements for a new insider risk design:

        - Users whose messages are flagged by the Communication Compliance policy must automatically be brought into the scope of an insider risk policy that watches for data leaks.
        - Confirmed cases must be handed to the legal team, which must place the user's content on hold and review it.
        - Analysts must not see the identity of users during triage.
        - Administrative effort must be minimized.

        Which two actions should you include in the design? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. utilise Microsoft 365 E5 et a déployé Microsoft Purview Insider Risk Management avec les paramètres par défaut. Une stratégie Communication Compliance détecte déjà les messages menaçants et harcelants dans Teams et Exchange.

        Le service juridique fixe les exigences suivantes pour une nouvelle conception de gestion des risques internes :

        - Les utilisateurs dont les messages sont signalés par la stratégie Communication Compliance doivent entrer automatiquement dans l'étendue d'une stratégie de risque interne qui surveille les fuites de données.
        - Les dossiers confirmés doivent être transmis à l'équipe juridique, qui doit placer le contenu de l'utilisateur en conservation et l'examiner.
        - Les analystes ne doivent pas voir l'identité des utilisateurs pendant le tri.
        - L'effort administratif doit être réduit au minimum.

        Quelles sont les deux actions que vous devez inclure dans la conception ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a Data leaks by risky users policy triggered by the Communication Compliance policy", fr: "Créer une stratégie Data leaks by risky users déclenchée par la stratégie Communication Compliance" } }
        - { id: b, text: { en: "Turn on pseudonymization in the Insider Risk Management settings before the first triage", fr: "Activer la pseudonymisation dans les paramètres d'Insider Risk Management avant le premier tri" } }
        - { id: c, text: { en: "Escalate the confirmed cases from Insider Risk Management to eDiscovery (Premium)", fr: "Transmettre les dossiers confirmés d'Insider Risk Management à eDiscovery (Premium)" } }
        - { id: d, text: { en: "Create a Data theft by departing users policy, with an HR connector for the flagged users", fr: "Créer une stratégie Data theft by departing users, avec un connecteur RH pour les utilisateurs signalés" } }
        - { id: e, text: { en: "Create a Microsoft Entra ID Protection user risk policy for the flagged users", fr: "Créer une stratégie de risque utilisateur Microsoft Entra ID Protection pour les utilisateurs signalés" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The Data leaks by risky users template can use a Communication Compliance policy as its triggering event, so flagged users enter the scope without manual work. A case can be escalated to eDiscovery (Premium), where the legal team places content on hold and reviews it. Pseudonymization is already on by default, so no action is needed for triage.
        fr: |
          Le modèle Data leaks by risky users peut utiliser une stratégie Communication Compliance comme événement déclencheur : les utilisateurs signalés entrent dans l'étendue sans travail manuel. Un dossier peut être transmis à eDiscovery (Premium), où l'équipe juridique place le contenu en conservation et l'examine. La pseudonymisation est déjà activée par défaut : aucune action n'est nécessaire pour le tri.
      options:
        b: { en: "Users are pseudonymized by default in Insider Risk Management; with the default settings there is nothing to turn on.", fr: "Les utilisateurs sont pseudonymisés par défaut dans Insider Risk Management ; avec les paramètres par défaut, il n'y a rien à activer." }
        d: { en: "Data theft by departing users is triggered by resignation or termination dates from HR, not by Communication Compliance alerts.", fr: "Data theft by departing users est déclenché par les dates de démission ou de fin de contrat issues des RH, pas par les alertes Communication Compliance." }
        e: { en: "ID Protection detects compromised accounts; flagged messages from a legitimate user are an insider risk, not an identity risk.", fr: "ID Protection détecte les comptes compromis ; des messages signalés d'un utilisateur légitime relèvent du risque interne, pas du risque d'identité." }
    references:
      - title: Learn about Insider Risk Management
        url: https://learn.microsoft.com/en-us/purview/insider-risk-management
