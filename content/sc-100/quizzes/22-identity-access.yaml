chapter: 22-identity-access
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has Microsoft 365 E7. An AI agent named **InvoiceBot** has an agent identity in Microsoft Entra Agent ID and calls Microsoft Graph with it.

        InvoiceBot must now also work in a line-of-business system that strictly requires a Microsoft Entra user account for authentication.

        What should you add to the design of InvoiceBot?
      fr: |
        Contoso, Ltd. dispose de Microsoft 365 E7. Un agent IA nommé **InvoiceBot** possède une identité d'agent dans Microsoft Entra Agent ID et l'utilise pour appeler Microsoft Graph.

        InvoiceBot doit maintenant travailler aussi dans une application métier qui exige strictement un compte d'utilisateur Microsoft Entra pour l'authentification.

        Que devez-vous ajouter à la conception d'InvoiceBot ?
    body:
      options:
        - { id: a, text: { en: "An agent's user account paired with its agent identity", fr: "Un compte d'utilisateur d'agent associé à son identité d'agent" } }
        - { id: b, text: { en: "A second agent identity created from the same blueprint", fr: "Une deuxième identité d'agent créée à partir du même blueprint" } }
        - { id: c, text: { en: "A user-assigned managed identity attached to the agent", fr: "Une identité managée affectée par l'utilisateur rattachée à l'agent" } }
        - { id: d, text: { en: "A cloud-only user account whose password is kept in Key Vault", fr: "Un compte d'utilisateur cloud uniquement dont le mot de passe est gardé dans Key Vault" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          When an agent must reach a system that only accepts Microsoft Entra user accounts, Agent ID gives it a second account: an agent's user account. It is a user-type account decorated as an AI agent, always in a one-to-one relationship with the agent identity, so it stays governed as part of the agent.
        fr: |
          Quand un agent doit atteindre un système qui n'accepte que des comptes d'utilisateur Microsoft Entra, Agent ID lui donne un second compte : un compte d'utilisateur d'agent. C'est un compte de type utilisateur identifié comme agent IA, toujours en relation un à un avec l'identité d'agent ; il reste donc gouverné comme une partie de l'agent.
      options:
        b: { en: "Every agent identity is a special service principal, not a user account: a second one doesn't meet the requirement.", fr: "Toute identité d'agent est un principal de service spécial, pas un compte d'utilisateur : une deuxième identité ne répond pas à l'exigence." }
        c: { en: "A managed identity is a workload identity, also a service principal, and isn't tied to the agent's governance.", fr: "Une identité managée est une identité de charge de travail, elle aussi un principal de service, et n'est pas liée à la gouvernance de l'agent." }
        d: { en: "A regular user account isn't linked to the agent, and agents aren't meant to authenticate with passwords.", fr: "Un compte d'utilisateur ordinaire n'est pas lié à l'agent, et les agents ne sont pas faits pour s'authentifier avec des mots de passe." }
    references:
      - title: Overview of agent identities in Microsoft Entra
        url: https://learn.microsoft.com/en-us/entra/agent-id/agent-identities

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-22-02
    objective: "2.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        After a reorganization, Fabrikam, Inc. owns three Microsoft Entra tenants, one per business unit. Employees of each tenant must use apps of the other two tenants without receiving invitations.

        Their accounts in the other tenants must be created, updated and removed automatically when they join, change jobs or leave the company.

        What should you recommend?
      fr: |
        Après une réorganisation, Fabrikam, Inc. possède trois locataires Microsoft Entra, un par division. Les employés de chaque locataire doivent utiliser des applications des deux autres locataires sans recevoir d'invitation.

        Leurs comptes dans les autres locataires doivent être créés, mis à jour et supprimés automatiquement quand ils arrivent, changent de poste ou quittent l'entreprise.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "B2B direct connect enabled between the three tenants", fr: "La connexion directe B2B activée entre les trois locataires" } }
        - { id: b, text: { en: "Access packages with each other tenant as a connected organization", fr: "Des packages d'accès avec chaque autre locataire comme organisation connectée" } }
        - { id: c, text: { en: "Cross-tenant synchronization from each tenant to the other two", fr: "La synchronisation interlocataire de chaque locataire vers les deux autres" } }
        - { id: d, text: { en: "An external tenant in which the employees sign up themselves", fr: "Un locataire externe dans lequel les employés s'inscrivent eux-mêmes" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Cross-tenant synchronization automates the creation, update and deletion of B2B collaboration users across the tenants of one organization, as external members by default. It's a push from each source tenant to a target tenant, so each direction is configured, and accounts are removed when users leave.
        fr: |
          La synchronisation interlocataire automatise la création, la mise à jour et la suppression d'utilisateurs de collaboration B2B entre les locataires d'une même organisation, comme membres externes par défaut. C'est un envoi de chaque locataire source vers un locataire cible : chaque sens se configure, et les comptes sont supprimés quand les utilisateurs partent.
      options:
        a: { en: "B2B direct connect serves Teams shared channels and creates no account in the other tenant: it doesn't give access to its apps.", fr: "La connexion directe B2B sert aux canaux partagés Teams et ne crée aucun compte dans l'autre locataire : elle ne donne pas accès à ses applications." }
        b: { en: "Access packages require each user to request access and are meant for other organizations; they don't follow job changes automatically.", fr: "Les packages d'accès exigent que chaque utilisateur demande l'accès et visent d'autres organisations ; ils ne suivent pas automatiquement les changements de poste." }
        d: { en: "An external tenant serves consumer and business customer apps, not employees reaching their own organization's tenants.", fr: "Un locataire externe sert les applications pour les clients, pas les employés qui accèdent aux locataires de leur propre organisation." }
    references:
      - title: What is cross-tenant synchronization in Microsoft Entra ID?
        url: https://learn.microsoft.com/en-us/entra/identity/multi-tenant-organizations/cross-tenant-synchronization-overview

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-22-03
    objective: "2.2.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware, Inc. runs a containerized order service in an Amazon EKS cluster. The service reads secrets from an Azure key vault by using an app registration in Microsoft Entra ID and a client secret stored in AWS Secrets Manager. Last month, the client secret expired and caused an outage.

        You need to recommend a solution so that the service authenticates to Microsoft Entra ID without any secret or certificate to store or rotate.

        What should you recommend?
      fr: |
        Proseware, Inc. exécute un service de commandes conteneurisé dans un cluster Amazon EKS. Le service lit des secrets dans un coffre de clés Azure en utilisant une inscription d'application dans Microsoft Entra ID et une clé secrète client stockée dans AWS Secrets Manager. Le mois dernier, la clé secrète client a expiré et a provoqué une panne.

        Vous devez recommander une solution pour que le service s'authentifie auprès de Microsoft Entra ID sans aucun secret ni certificat à stocker ou à renouveler.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Store the client secret in the key vault and rotate it every 30 days", fr: "Stocker la clé secrète client dans le coffre de clés et la renouveler tous les 30 jours" } }
        - { id: b, text: { en: "Replace the client secret with a certificate kept in AWS Secrets Manager", fr: "Remplacer la clé secrète client par un certificat gardé dans AWS Secrets Manager" } }
        - { id: c, text: { en: "Enable a system-assigned managed identity for the order service", fr: "Activer une identité managée affectée par le système pour le service de commandes" } }
        - { id: d, text: { en: "Add a federated identity credential that trusts the EKS cluster issuer", fr: "Ajouter des informations d'identification fédérées qui approuvent l'émetteur du cluster EKS" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Workload identity federation lets a workload outside Azure, including any Kubernetes cluster such as EKS, exchange a token from its own identity provider for a Microsoft Entra access token. The federated identity credential is configured on the app registration or on a user-assigned managed identity, so no secret or certificate has to be stored, rotated or can expire.
        fr: |
          La fédération d'identité de charge de travail permet à une charge de travail hors d'Azure, y compris tout cluster Kubernetes comme EKS, d'échanger un jeton de son propre fournisseur d'identité contre un jeton d'accès Microsoft Entra. Les informations d'identification fédérées se configurent sur l'inscription d'application ou sur une identité managée affectée par l'utilisateur : aucun secret ni certificat n'est à stocker, à renouveler ou ne peut expirer.
      options:
        a: { en: "The service would still need a credential to read the vault, and a secret remains to rotate.", fr: "Le service aurait toujours besoin d'informations d'identification pour lire le coffre, et un secret reste à renouveler." }
        b: { en: "A certificate is still a credential that must be stored securely, renewed and can expire.", fr: "Un certificat reste des informations d'identification à stocker en sécurité, à renouveler, et qui peuvent expirer." }
        c: { en: "A system-assigned managed identity exists only for an Azure resource; a workload running in AWS can't have one.", fr: "Une identité managée affectée par le système n'existe que pour une ressource Azure ; une charge de travail qui s'exécute dans AWS ne peut pas en avoir." }
    references:
      - title: Workload Identity Federation
        url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-22-04
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders uses a SaaS expense application from the Microsoft Entra application gallery. The application supports SAML and SCIM 2.0. Today, employees sign in with local accounts that the application's administrators create by hand, and the accounts of employees who left the company stay active for weeks.

        You need to recommend a solution that meets the following requirements:

        - Employees sign in with their Microsoft Entra accounts, under the existing Conditional Access policies.
        - When an employee leaves the company, the account in the application is deactivated without any manual action.
        - Administrative effort is minimized.

        What should you recommend?
      fr: |
        Northwind Traders utilise une application SaaS de notes de frais de la galerie d'applications Microsoft Entra. L'application prend en charge SAML et SCIM 2.0. Aujourd'hui, les employés se connectent avec des comptes locaux que les administrateurs de l'application créent à la main, et les comptes des employés qui ont quitté l'entreprise restent actifs pendant des semaines.

        Vous devez recommander une solution qui répond aux exigences suivantes :

        - Les employés se connectent avec leurs comptes Microsoft Entra, sous les stratégies d'accès conditionnel existantes.
        - Quand un employé quitte l'entreprise, son compte dans l'application est désactivé sans aucune action manuelle.
        - L'effort d'administration est réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "SAML single sign-on with just-in-time creation of accounts at first sign-in", fr: "L'authentification unique SAML avec création juste-à-temps des comptes à la première connexion" } }
        - { id: b, text: { en: "SAML single sign-on with automatic user provisioning to the application", fr: "L'authentification unique SAML avec provisionnement automatique des utilisateurs dans l'application" } }
        - { id: c, text: { en: "Password-based single sign-on with the credentials kept by Microsoft Entra ID", fr: "L'authentification unique par mot de passe, avec les informations d'identification gardées par Microsoft Entra ID" } }
        - { id: d, text: { en: "SAML single sign-on with a monthly access review of the application's users", fr: "L'authentification unique SAML avec une révision d'accès mensuelle des utilisateurs de l'application" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          SSO with SAML puts every sign-in under Microsoft Entra ID and its Conditional Access policies, but access also requires an account in the app. Automatic provisioning through SCIM creates, updates and deactivates the accounts in the app as users join, change or leave, with no manual work.
        fr: |
          L'authentification unique SAML place chaque connexion sous Microsoft Entra ID et ses stratégies d'accès conditionnel, mais l'accès exige aussi un compte dans l'application. Le provisionnement automatique par SCIM crée, met à jour et désactive les comptes dans l'application quand les utilisateurs arrivent, changent ou partent, sans travail manuel.
      options:
        a: { en: "Just-in-time provisioning creates an account at first sign-in, but it doesn't deactivate the account when the employee leaves.", fr: "Le provisionnement juste-à-temps crée un compte à la première connexion, mais ne désactive pas le compte quand l'employé part." }
        c: { en: "Password-based SSO replays the application's own credentials, so the local accounts and their manual lifecycle remain.", fr: "L'authentification unique par mot de passe rejoue les informations d'identification propres à l'application : les comptes locaux et leur cycle de vie manuel demeurent." }
        d: { en: "A monthly review leaves accounts active for weeks and adds review work, where provisioning removes them automatically.", fr: "Une révision mensuelle laisse des comptes actifs pendant des semaines et ajoute du travail de révision, alors que le provisionnement les retire automatiquement." }
    references:
      - title: What is automated app user provisioning in Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/app-provisioning/user-provisioning

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-22-05
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has Microsoft Entra ID P2 licenses for all employees and no other Microsoft Entra licenses. Automation jobs in the datacenter use single-tenant applications registered in Tailspin's tenant, whose service principals authenticate with client secrets.

        You need to recommend a solution that blocks the token requests of these service principals when Microsoft Entra ID Protection evaluates them as high risk.

        What should you recommend?
      fr: |
        Tailspin Toys dispose de licences Microsoft Entra ID P2 pour tous ses employés et d'aucune autre licence Microsoft Entra. Des tâches d'automatisation du centre de données utilisent des applications monolocataires inscrites dans le locataire de Tailspin, dont les principaux de service s'authentifient avec des clés secrètes client.

        Vous devez recommander une solution qui bloque les demandes de jeton de ces principaux de service quand Microsoft Entra ID Protection les évalue à risque élevé.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Add Workload ID Premium, and create a workload identity policy with a service principal risk condition", fr: "Ajouter Workload ID Premium, et créer une stratégie d'identités de charge de travail avec une condition de risque du principal de service" } }
        - { id: b, text: { en: "Use the P2 licenses, and create a policy for the owners of the applications with a user risk condition", fr: "Utiliser les licences P2, et créer une stratégie pour les propriétaires des applications avec une condition de risque utilisateur" } }
        - { id: c, text: { en: "Move the jobs to managed identities, and include the identities in a risk-based workload identity policy", fr: "Passer les tâches sur des identités managées, et inclure ces identités dans une stratégie d'identités de charge de travail basée sur le risque" } }
        - { id: d, text: { en: "Create a workload identity policy that blocks the service principals outside the datacenter's named location", fr: "Créer une stratégie d'identités de charge de travail qui bloque les principaux de service hors de l'emplacement nommé du centre de données" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          ID Protection detects risk on workload identities, but full risk details and risk-based Conditional Access for them require Workload ID Premium, which P2 doesn't include. A Conditional Access policy for workload identities can then block single-tenant service principals registered in the tenant when their service principal risk is high.
        fr: |
          ID Protection détecte le risque des identités de charge de travail, mais les détails complets du risque et l'accès conditionnel basé sur le risque pour ces identités exigent Workload ID Premium, que P2 n'inclut pas. Une stratégie d'accès conditionnel pour les identités de charge de travail peut alors bloquer les principaux de service monolocataires inscrits dans le locataire quand leur risque est élevé.
      options:
        b: { en: "User risk concerns the owners' accounts, not the service principals, whose token requests would still succeed.", fr: "Le risque utilisateur concerne les comptes des propriétaires, pas les principaux de service, dont les demandes de jeton aboutiraient toujours." }
        c: { en: "Managed identities are out of scope of workload identity risk detection and of risk-based policies.", fr: "Les identités managées sont hors du périmètre de la détection du risque des identités de charge de travail et des stratégies basées sur le risque." }
        d: { en: "A location condition blocks by network, not by risk: a compromised service principal used from the datacenter isn't blocked.", fr: "Une condition d'emplacement bloque selon le réseau, pas selon le risque : un principal de service compromis utilisé depuis le centre de données n'est pas bloqué." }
    references:
      - title: Securing workload identities with Microsoft Entra ID Protection
        url: https://learn.microsoft.com/en-us/entra/id-protection/concept-workload-identity-risk

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-22-06
    objective: "2.2.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank is specifying the hardening requirements of its AD DS forest. All the domain controllers run Windows Server 2022.

        During a red team exercise, an attacker on the server network intercepted the LDAP traffic between an identity provisioning server and a domain controller. The attacker modified the requests in transit and added an account to a privileged group. The provisioning server already authenticates with Kerberos and connects over LDAP on port 389, without signing.

        You need to specify a requirement that makes this attack fail against every domain controller. The provisioning server can be reconfigured.

        Which requirement should you include?
      fr: |
        Woodgrove Bank spécifie les exigences de sécurisation de sa forêt AD DS. Tous les contrôleurs de domaine exécutent Windows Server 2022.

        Lors d'un exercice de red team, un attaquant présent sur le réseau des serveurs a intercepté le trafic LDAP entre un serveur de provisionnement des identités et un contrôleur de domaine. L'attaquant a modifié les requêtes en transit et ajouté un compte à un groupe privilégié. Le serveur de provisionnement s'authentifie déjà avec Kerberos et se connecte en LDAP sur le port 389, sans signature.

        Vous devez spécifier une exigence qui fait échouer cette attaque contre chaque contrôleur de domaine. Le serveur de provisionnement peut être reconfiguré.

        Quelle exigence devez-vous inclure ?
    body:
      options:
        - { id: a, text: { en: "Require Kerberos armoring (FAST) for all the domain clients", fr: "Exiger le blindage Kerberos (FAST) pour tous les clients du domaine" } }
        - { id: b, text: { en: "Require LDAP signing on all the domain controllers", fr: "Exiger la signature LDAP sur tous les contrôleurs de domaine" } }
        - { id: c, text: { en: "Require LDAP channel binding on all the domain controllers", fr: "Exiger la liaison de canal LDAP sur tous les contrôleurs de domaine" } }
        - { id: d, text: { en: "Restrict NTLM authentication to an exception list", fr: "Restreindre l'authentification NTLM à une liste d'exceptions" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Unsigned LDAP traffic is exposed to man-in-the-middle attacks, in which an intruder changes the packets so that the domain controller acts on forged requests. Requiring LDAP signing on the domain controllers makes them reject unsigned binds; the provisioning server is configured to sign first, as the hardening requirement on legacy protocols demands.
        fr: |
          Le trafic LDAP non signé est exposé aux attaques de l'intercepteur (man-in-the-middle), dans lesquelles un intrus modifie les paquets pour que le contrôleur de domaine agisse sur des requêtes falsifiées. Exiger la signature LDAP sur les contrôleurs de domaine leur fait rejeter les liaisons non signées ; le serveur de provisionnement est d'abord configuré pour signer, comme l'exige la sécurisation des protocoles hérités.
      options:
        a: { en: "Kerberos armoring protects the Kerberos authentication exchange, not the LDAP requests sent after authentication.", fr: "Le blindage Kerberos protège l'échange d'authentification Kerberos, pas les requêtes LDAP envoyées après l'authentification." }
        c: { en: "Channel binding protects authentication over LDAP with TLS (LDAPS); it doesn't apply to the server's connections on port 389 without TLS.", fr: "La liaison de canal protège l'authentification LDAP sur TLS (LDAPS) ; elle ne s'applique pas aux connexions du serveur sur le port 389 sans TLS." }
        d: { en: "The server already uses Kerberos: restricting NTLM doesn't protect the integrity of its LDAP traffic.", fr: "Le serveur utilise déjà Kerberos : restreindre NTLM ne protège pas l'intégrité de son trafic LDAP." }
    references:
      - title: How to enable LDAP signing - Windows Server
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/enable-ldap-signing-in-windows-server
      - title: "Domain controller: LDAP server channel binding token requirements"
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/domain-controller-ldap-server-channel-binding-token-requirements

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-22-07
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso, Ltd. has Microsoft Entra ID P1 licenses and a Conditional Access policy that requires MFA for all users, including guest and external users, on all resources. Contoso starts a joint program with Fabrikam, Inc., which also uses Microsoft Entra ID. The cross-tenant access settings of Contoso still have their default values.

        The design has three requirements:

        - Contoso employees can be invited as B2B collaboration users by Fabrikam, but by no other external organization.
        - Engineers of both companies collaborate in Teams shared channels through B2B direct connect.
        - On Contoso-managed devices, employees can't sign in with accounts that external organizations or unknown tenants gave them.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose de licences Microsoft Entra ID P1 et d'une stratégie d'accès conditionnel qui exige la MFA pour tous les utilisateurs, y compris les utilisateurs invités et externes, sur toutes les ressources. Contoso lance un programme commun avec Fabrikam, Inc., qui utilise aussi Microsoft Entra ID. Les paramètres d'accès interlocataire de Contoso ont encore leurs valeurs par défaut.

        La conception a trois exigences :

        - Les employés de Contoso peuvent être invités comme utilisateurs de collaboration B2B par Fabrikam, mais par aucune autre organisation externe.
        - Les ingénieurs des deux entreprises collaborent dans des canaux partagés Teams par la connexion directe B2B.
        - Sur les appareils gérés par Contoso, les employés ne peuvent pas se connecter avec des comptes que des organisations externes ou des locataires inconnus leur ont fournis.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "For the first requirement, Contoso can block B2B collaboration in its default outbound settings and allow it in organizational settings for Fabrikam.", fr: "Pour la première exigence, Contoso peut bloquer la collaboration B2B dans ses paramètres sortants par défaut et l'autoriser dans des paramètres d'organisation pour Fabrikam." }
        - id: s2
          text: { en: "The outbound settings configured for the first requirement also meet the third requirement.", fr: "Les paramètres sortants configurés pour la première exigence répondent aussi à la troisième exigence." }
        - id: s3
          text: { en: "Because of the MFA policy, Contoso must trust the MFA claims of Fabrikam in its inbound settings for the shared channels to work.", fr: "En raison de la stratégie MFA, Contoso doit approuver les revendications MFA de Fabrikam dans ses paramètres entrants pour que les canaux partagés fonctionnent." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Outbound settings control whether Contoso users can access external organizations, and organizational settings take precedence over the defaults, so a default block with a Fabrikam exception meets the first requirement. B2B direct connect users have no account in Contoso's tenant: when Conditional Access requires MFA, Contoso must accept the MFA claims of the partner's tenant.
        fr: |
          Les paramètres sortants déterminent si les utilisateurs de Contoso peuvent accéder aux organisations externes, et les paramètres d'organisation priment sur les paramètres par défaut : un blocage par défaut avec une exception pour Fabrikam répond à la première exigence. Les utilisateurs de la connexion directe B2B n'ont pas de compte dans le locataire de Contoso : quand l'accès conditionnel exige la MFA, Contoso doit accepter les revendications MFA du locataire partenaire.
      options:
        s2: { en: "Which external accounts can be used on Contoso devices is controlled by tenant restrictions, which are independent of the inbound, outbound and trust settings.", fr: "Les comptes externes utilisables sur les appareils de Contoso sont contrôlés par les restrictions de locataire, indépendantes des paramètres entrants, sortants et d'approbation." }
    references:
      - title: Cross-tenant access overview
        url: https://learn.microsoft.com/en-us/entra/external-id/cross-tenant-access-overview

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-22-08
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware, Inc. synchronizes its AD DS forest, litware.com, to its Microsoft Entra tenant with a single Microsoft Entra Connect Sync server and password hash synchronization. Several security groups of litware.com have up to 120,000 members, and all of them must stay synchronized.

        Litware acquires Adatum Corporation, which has its own AD DS forest, adatum.com. There is no network connectivity and no trust between the two forests, and none is allowed for a year. The users of the two forests are distinct.

        The solution must meet the following requirements:

        - Adatum users get accounts in the Litware tenant within weeks.
        - The synchronization of each forest can continue, or be resumed quickly, if one synchronization server fails.
        - Changes to the existing litware.com synchronization are minimized.

        How should you complete the recommendation? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. synchronise sa forêt AD DS, litware.com, avec son locataire Microsoft Entra au moyen d'un seul serveur Microsoft Entra Connect Sync et de la synchronisation du hachage de mot de passe. Plusieurs groupes de sécurité de litware.com comptent jusqu'à 120 000 membres, et tous doivent rester synchronisés.

        Litware acquiert Adatum Corporation, qui a sa propre forêt AD DS, adatum.com. Il n'existe ni connectivité réseau ni approbation entre les deux forêts, et aucune n'est autorisée pendant un an. Les utilisateurs des deux forêts sont distincts.

        La solution doit répondre aux exigences suivantes :

        - Les utilisateurs d'Adatum obtiennent des comptes dans le locataire de Litware en quelques semaines.
        - La synchronisation de chaque forêt peut continuer, ou reprendre rapidement, si un serveur de synchronisation tombe en panne.
        - Les modifications de la synchronisation existante de litware.com sont réduites au minimum.

        Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          litware.com engine: [[lit]]

          litware.com server failure: [[litha]]

          adatum.com: [[adt]]
        fr: |
          Moteur de litware.com : [[lit]]

          Panne de serveur pour litware.com : [[litha]]

          adatum.com : [[adt]]
      slots:
        - id: lit
          options:
            - { id: keep, text: { en: "Keep Microsoft Entra Connect Sync", fr: "Conserver Microsoft Entra Connect Sync" } }
            - { id: migrate, text: { en: "Migrate to Microsoft Entra Cloud Sync", fr: "Migrer vers Microsoft Entra Cloud Sync" } }
            - { id: both, text: { en: "Run Cloud Sync and Connect Sync for the same objects", fr: "Exécuter Cloud Sync et Connect Sync pour les mêmes objets" } }
        - id: litha
          options:
            - { id: staging, text: { en: "A second Connect Sync server in staging mode", fr: "Un second serveur Connect Sync en mode intermédiaire" } }
            - { id: active, text: { en: "A second active Connect Sync server", fr: "Un second serveur Connect Sync actif" } }
            - { id: agents, text: { en: "Two Cloud Sync agents in litware.com", fr: "Deux agents Cloud Sync dans litware.com" } }
        - id: adt
          options:
            - { id: connector, text: { en: "A new forest connector on the litware.com Connect Sync server", fr: "Un nouveau connecteur de forêt sur le serveur Connect Sync de litware.com" } }
            - { id: cloudsync, text: { en: "Cloud Sync agents on two adatum.com servers", fr: "Des agents Cloud Sync sur deux serveurs d'adatum.com" } }
            - { id: second, text: { en: "A separate Connect Sync server in adatum.com", fr: "Un serveur Connect Sync distinct dans adatum.com" } }
    answer:
      values: { lit: keep, litha: staging, adt: cloudsync }
    explanation:
      correct:
        en: |
          Cloud Sync supports groups of up to 50,000 members, against 250,000 for Connect Sync, so litware.com keeps Connect Sync, protected by a staging mode server that can be switched to active. An existing Connect Sync forest with a new forest on Cloud Sync is a supported topology, and Cloud Sync handles disconnected forests with several active agents for high availability.
        fr: |
          Cloud Sync prend en charge des groupes jusqu'à 50 000 membres, contre 250 000 pour Connect Sync : litware.com conserve donc Connect Sync, protégé par un serveur en mode intermédiaire qui peut devenir actif. Une forêt existante sous Connect Sync avec une nouvelle forêt sous Cloud Sync est une topologie prise en charge, et Cloud Sync gère les forêts déconnectées avec plusieurs agents actifs pour la haute disponibilité.
      options:
        migrate: { en: "Cloud Sync is limited to 50,000 members per group, below the 120,000-member groups of litware.com.", fr: "Cloud Sync est limité à 50 000 membres par groupe, en dessous des groupes de 120 000 membres de litware.com." }
        both: { en: "Running both engines on the same objects is a pilot pattern and doesn't remove the group size limit of Cloud Sync.", fr: "Exécuter les deux moteurs sur les mêmes objets est un schéma de pilote et ne lève pas la limite de taille des groupes de Cloud Sync." }
        active: { en: "Connect Sync supports only one active server per tenant; the other servers stay in staging mode.", fr: "Connect Sync ne prend en charge qu'un seul serveur actif par locataire ; les autres serveurs restent en mode intermédiaire." }
        connector: { en: "A Connect Sync forest connector needs network connectivity to adatum.com, which isn't allowed.", fr: "Un connecteur de forêt Connect Sync a besoin d'une connectivité réseau vers adatum.com, qui n'est pas autorisée." }
        second: { en: "A second active Connect Sync server for the same tenant isn't supported.", fr: "Un second serveur Connect Sync actif pour le même locataire n'est pas pris en charge." }
    references:
      - title: Microsoft Entra Cloud Sync supported topologies and scenarios
        url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/plan-cloud-sync-topologies
      - title: Microsoft Entra Cloud Sync migration decision guide
        url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/connect-to-cloud-sync-decision-guide

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-22-09
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware, Inc. has Microsoft 365 E7. Business units build agents in Microsoft Copilot Studio, and two of the agents have an agent's user account to send email. You are validating the Conditional Access policies against Litware's Zero Trust strategy:

        | Policy | Assignments | Target resources | Controls | State |
        | --- | --- | --- | --- | --- |
        | CA01 | All users, excluding the EmergencyAccess group (two cloud-only accounts) | All resources | Authentication strength: Multifactor authentication | On |
        | CA02 | All privileged directory roles | All resources | Authentication strength: Multifactor authentication | On |
        | CA03 | All users, client apps: Exchange ActiveSync and other clients | All resources | Block access | On |
        | CA04 | All users, excluding guest and external users | Office 365 | Require a compliant device | Report-only for 10 days |
        | CA05 | Agents: all agent identities | All resources | Block when the agent risk is high | On |

        Which two findings should you report as gaps?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. dispose de Microsoft 365 E7. Les divisions créent des agents dans Microsoft Copilot Studio, et deux de ces agents ont un compte d'utilisateur d'agent pour envoyer des e-mails. Vous validez les stratégies d'accès conditionnel par rapport à la stratégie Confiance Zéro de Litware :

        | Stratégie | Affectations | Ressources cibles | Contrôles | État |
        | --- | --- | --- | --- | --- |
        | CA01 | Tous les utilisateurs, sauf le groupe EmergencyAccess (deux comptes cloud uniquement) | Toutes les ressources | Force d'authentification : Multifactor authentication | Activée |
        | CA02 | Tous les rôles d'annuaire privilégiés | Toutes les ressources | Force d'authentification : Multifactor authentication | Activée |
        | CA03 | Tous les utilisateurs, applications clientes : Exchange ActiveSync et autres clients | Toutes les ressources | Bloquer l'accès | Activée |
        | CA04 | Tous les utilisateurs, sauf les utilisateurs invités et externes | Office 365 | Exiger un appareil conforme | Rapport seul depuis 10 jours |
        | CA05 | Agents : toutes les identités d'agent | Toutes les ressources | Bloquer quand le risque de l'agent est élevé | Activée |

        Quelles deux constatations devez-vous signaler comme des lacunes ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "The EmergencyAccess group is excluded from CA01.", fr: "Le groupe EmergencyAccess est exclu de CA01." } }
        - { id: b, text: { en: "CA02 uses the same authentication strength as CA01.", fr: "CA02 utilise la même force d'authentification que CA01." } }
        - { id: c, text: { en: "CA04 is still in report-only mode while its impact is reviewed.", fr: "CA04 est encore en mode rapport seul pendant l'analyse de son impact." } }
        - { id: d, text: { en: "The two agent's user accounts are expected to fall under CA01 and CA05.", fr: "Les deux comptes d'utilisateur d'agent sont censés relever de CA01 et de CA05." } }
        - { id: e, text: { en: "Guest and external users are excluded from CA04.", fr: "Les utilisateurs invités et externes sont exclus de CA04." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Verify explicitly calls for a phishing-resistant authentication strength for administrators; the built-in Multifactor authentication strength still accepts methods such as a password with a text message. Policies scoped through the users assignment, even All users, don't apply to agent's user accounts, and a policy that targets agent identities doesn't apply to their user accounts either: the agent users need a policy that selects them under Agents.
        fr: |
          Vérifier explicitement exige une force d'authentification résistante au hameçonnage pour les administrateurs ; la force intégrée Multifactor authentication accepte encore des méthodes comme un mot de passe avec un SMS. Les stratégies délimitées par l'affectation des utilisateurs, même All users, ne s'appliquent pas aux comptes d'utilisateur d'agent, et une stratégie qui cible les identités d'agent ne s'applique pas non plus à leurs comptes d'utilisateur : les utilisateurs d'agent ont besoin d'une stratégie qui les sélectionne sous Agents.
      options:
        a: { en: "Excluding the emergency access accounts prevents a lockout and is the documented exception.", fr: "Exclure les comptes d'accès d'urgence évite un verrouillage et constitue l'exception documentée." }
        c: { en: "Running a new policy in report-only mode and reading its impact before enforcing it is the recommended rollout.", fr: "Exécuter une nouvelle stratégie en mode rapport seul et lire son impact avant de l'appliquer est le déploiement recommandé." }
        e: { en: "Litware doesn't manage the guests' devices; this documented exclusion leaves them covered by the MFA requirement of CA01.", fr: "Litware ne gère pas les appareils des invités ; cette exclusion documentée les laisse couverts par l'exigence MFA de CA01." }
    references:
      - title: Conditional Access for Agents in Microsoft Entra
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-22-10
    objective: "2.2.8"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam, Inc. encrypts its Azure Storage accounts and Azure SQL databases with customer-managed keys stored in Azure Key Vault Premium. A new cryptographic standard requires the following:

        - Each key gets new key material at least once a year, without any manual action and without custom code.
        - The storage accounts and databases start using the new key material without anyone changing their encryption settings.
        - The key administrators are warned before a key reaches its expiration date.
        - No encrypted data becomes unreadable while the services move to the new key material.

        How should you complete the design? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. chiffre ses comptes Stockage Azure et ses bases de données Azure SQL avec des clés gérées par le client stockées dans Azure Key Vault Premium. Une nouvelle norme de chiffrement impose ce qui suit :

        - Chaque clé reçoit un nouveau matériel de clé au moins une fois par an, sans aucune action manuelle et sans code personnalisé.
        - Les comptes de stockage et les bases de données utilisent le nouveau matériel de clé sans que personne ne modifie leurs paramètres de chiffrement.
        - Les administrateurs des clés sont avertis avant qu'une clé atteigne sa date d'expiration.
        - Aucune donnée chiffrée ne devient illisible pendant que les services passent au nouveau matériel de clé.

        Comment devez-vous compléter la conception ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          New key material: [[rot]]

          Key reference in the services: [[uri]]

          Expiration warning: [[warn]]

          Previous key versions: [[old]]
        fr: |
          Nouveau matériel de clé : [[rot]]

          Référence de la clé dans les services : [[uri]]

          Avertissement d'expiration : [[warn]]

          Versions précédentes de la clé : [[old]]
      slots:
        - id: rot
          options:
            - { id: policy, text: { en: "A rotation policy on each key", fr: "Une stratégie de rotation sur chaque clé" } }
            - { id: runbook, text: { en: "A yearly Azure Automation runbook", fr: "Un runbook Azure Automation annuel" } }
            - { id: newvault, text: { en: "A new key vault created every year", fr: "Un nouveau coffre de clés créé chaque année" } }
        - id: uri
          options:
            - { id: versionless, text: { en: "A versionless key URI", fr: "Un URI de clé sans version" } }
            - { id: versioned, text: { en: "The URI of the current key version", fr: "L'URI de la version actuelle de la clé" } }
            - { id: exported, text: { en: "A copy of the key imported into each service", fr: "Une copie de la clé importée dans chaque service" } }
        - id: warn
          options:
            - { id: eventgrid, text: { en: "Event Grid near-expiry notifications", fr: "Les notifications Event Grid avant expiration" } }
            - { id: defender, text: { en: "Microsoft Defender for Key Vault alerts", fr: "Les alertes de Microsoft Defender for Key Vault" } }
            - { id: azpolicy, text: { en: "An Azure Policy audit of key expiration", fr: "Un audit Azure Policy de l'expiration des clés" } }
        - id: old
          options:
            - { id: enabled, text: { en: "Stay enabled until rewrapping is complete", fr: "Restent activées jusqu'à la fin du réencapsulage" } }
            - { id: disabled, text: { en: "Are disabled as soon as rotation runs", fr: "Sont désactivées dès l'exécution de la rotation" } }
            - { id: purged, text: { en: "Are deleted and purged after rotation", fr: "Sont supprimées et vidées après la rotation" } }
    answer:
      values: { rot: policy, uri: versionless, warn: eventgrid, old: enabled }
    explanation:
      correct:
        en: |
          A key rotation policy makes Key Vault create a new key version at the chosen frequency, with no code, and the same policy configures Event Grid notifications before expiry. Services that use a versionless key URI refresh to the latest version automatically. Rotation rewraps the data encryption keys rather than re-encrypting the data, so the old and new versions must both stay enabled until rewrapping is complete.
        fr: |
          Une stratégie de rotation des clés fait créer par Key Vault une nouvelle version de clé à la fréquence choisie, sans code, et la même stratégie configure des notifications Event Grid avant l'expiration. Les services qui utilisent un URI de clé sans version passent automatiquement à la dernière version. La rotation réencapsule les clés de chiffrement des données au lieu de rechiffrer les données : l'ancienne et la nouvelle version doivent donc rester activées jusqu'à la fin du réencapsulage.
      options:
        runbook: { en: "A runbook is custom code to write and maintain, which the standard forbids.", fr: "Un runbook est du code personnalisé à écrire et maintenir, ce que la norme interdit." }
        newvault: { en: "A new vault means a new key that every service must be reconfigured to use.", fr: "Un nouveau coffre signifie une nouvelle clé que chaque service doit être reconfiguré pour utiliser." }
        versioned: { en: "A URI pinned to one version keeps the service on the old version until someone changes it.", fr: "Un URI lié à une version laisse le service sur l'ancienne version jusqu'à ce que quelqu'un le modifie." }
        defender: { en: "Defender for Key Vault detects unusual and harmful access, not upcoming key expirations.", fr: "Defender for Key Vault détecte les accès inhabituels et nuisibles, pas les expirations de clés à venir." }
        azpolicy: { en: "An audit policy reports keys that don't meet a rule in the compliance view; it doesn't send the administrators a warning before each expiration.", fr: "Une stratégie d'audit signale dans la vue de conformité les clés qui ne respectent pas une règle ; elle n'envoie pas d'avertissement aux administrateurs avant chaque expiration." }
        disabled: { en: "Data encryption keys still wrapped with the old version would become unreadable until rewrapping finishes.", fr: "Les clés de chiffrement des données encore encapsulées avec l'ancienne version deviendraient illisibles jusqu'à la fin du réencapsulage." }
    references:
      - title: Configure cryptographic key auto-rotation in Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation
