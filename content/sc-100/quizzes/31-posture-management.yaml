chapter: 31-posture-management
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The CISO of Proseware, Inc. asks which part of Microsoft Defender for Cloud finds the misconfigured resources in Azure, AWS and GCP before an attacker exploits them, and measures the result with a secure score.

        What should you answer?
      fr: |
        Le RSSI de Proseware, Inc. demande quelle partie de Microsoft Defender for Cloud trouve les ressources mal configurées dans Azure, AWS et GCP avant qu'un attaquant ne les exploite, et mesure le résultat avec un degré de sécurisation.

        Que devez-vous répondre ?
    body:
      options:
        - { id: a, text: { en: "Cloud workload protection (CWP)", fr: "La protection des charges de travail cloud (CWP)" } }
        - { id: b, text: { en: "Workflow automation", fr: "L'automatisation des workflows" } }
        - { id: c, text: { en: "Cloud security posture management (CSPM)", fr: "La gestion de la posture de sécurité cloud (CSPM)" } }
        - { id: d, text: { en: "Continuous export", fr: "L'exportation continue" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Cloud security posture management assesses resources against the Microsoft cloud security benchmark, produces security recommendations and the secure score, and is available for Azure, AWS and GCP. Foundational CSPM is free; Defender CSPM adds capabilities such as attack path analysis and regulatory standards.
        fr: |
          La gestion de la posture de sécurité cloud évalue les ressources par rapport au benchmark de sécurité cloud Microsoft, produit les recommandations de sécurité et le degré de sécurisation, et couvre Azure, AWS et GCP. Foundational CSPM est gratuit ; Defender CSPM ajoute des fonctionnalités comme l'analyse des chemins d'attaque et les normes réglementaires.
      options:
        a: { en: "Cloud workload protection detects active threats on running resources and raises security alerts; it doesn't compute the secure score.", fr: "La protection des charges de travail cloud détecte les menaces actives sur les ressources en cours d'exécution et génère des alertes ; elle ne calcule pas le degré de sécurisation." }
        b: { en: "Workflow automation triggers a logic app when a recommendation or alert changes; it doesn't assess configurations.", fr: "L'automatisation des workflows déclenche une application logique quand une recommandation ou une alerte change ; elle n'évalue pas les configurations." }
        d: { en: "Continuous export sends alerts and recommendations to a workspace or an event hub; it doesn't find misconfigurations itself.", fr: "L'exportation continue envoie les alertes et les recommandations vers un espace de travail ou un hub d'événements ; elle ne trouve pas elle-même les erreurs de configuration." }
    references:
      - title: What is Cloud Security Posture Management (CSPM) - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-31-02
    objective: "3.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys deploys a Microsoft Defender External Attack Surface Management (Defender EASM) resource to map its internet-facing footprint, including the assets that IT doesn't know about.

        What must Tailspin Toys provide so that Defender EASM can start the discovery?
      fr: |
        Tailspin Toys déploie une ressource Microsoft Defender External Attack Surface Management (Defender EASM) pour cartographier son empreinte exposée à Internet, y compris les ressources que l'informatique ne connaît pas.

        Que doit fournir Tailspin Toys pour que Defender EASM puisse lancer la découverte ?
    body:
      options:
        - { id: a, text: { en: "The Azure Connected Machine agent on each internet-facing server", fr: "L'agent Azure Connected Machine sur chaque serveur exposé à Internet" } }
        - { id: b, text: { en: "A connector for each AWS account and GCP project that hosts websites", fr: "Un connecteur pour chaque compte AWS et projet GCP qui héberge des sites web" } }
        - { id: c, text: { en: "A network sensor in the perimeter network that captures inbound traffic", fr: "Un capteur réseau dans le réseau de périmètre qui capture le trafic entrant" } }
        - { id: d, text: { en: "Known assets, such as domains and IP blocks, used as discovery seeds", fr: "Des ressources connues, comme des domaines et des blocs IP, utilisées comme graines de découverte" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Defender EASM starts from discovery seeds, known legitimate assets of the organization such as domains, IP blocks, hosts or ASNs. It then searches recursively through the observed connections of these seeds to find related infrastructure, including unknown and unmonitored assets, from the outside and without any agent.
        fr: |
          Defender EASM part de graines de découverte, des ressources légitimes connues de l'organisation comme des domaines, des blocs IP, des hôtes ou des ASN. Il recherche ensuite de façon récursive dans les connexions observées de ces graines pour trouver l'infrastructure liée, y compris les ressources inconnues et non surveillées, depuis l'extérieur et sans agent.
      options:
        a: { en: "Defender EASM observes the internet from the outside: it needs no agent, and the unknown servers couldn't have one anyway.", fr: "Defender EASM observe Internet depuis l'extérieur : il n'a besoin d'aucun agent, et les serveurs inconnus ne pourraient de toute façon pas en avoir." }
        b: { en: "Cloud connectors bring AWS and GCP into Defender for Cloud; they don't reveal domains and hosts outside these accounts.", fr: "Les connecteurs cloud intègrent AWS et GCP à Defender for Cloud ; ils ne révèlent pas les domaines et les hôtes hors de ces comptes." }
        c: { en: "Network sensors that analyze traffic belong to internal discovery tools, not to an outside-in view of the attack surface.", fr: "Les capteurs réseau qui analysent le trafic relèvent des outils de découverte internes, pas d'une vue de la surface d'attaque depuis l'extérieur." }
    references:
      - title: Defender EASM Overview
        url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-31-03
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. tracks Microsoft Secure Score in the Microsoft Defender portal. A recommended action of the **Identity** category is already covered by a control that Litware's own engineering team developed and runs internally. The action still shows the status **To address**.

        You need Microsoft Secure Score to award the points of the action and to record why. What should you do?
      fr: |
        Litware, Inc. suit le Niveau de sécurité Microsoft dans le portail Microsoft Defender. Une action recommandée de la catégorie **Identity** est déjà couverte par un contrôle que l'équipe d'ingénierie de Litware a développé et exploite en interne. L'action affiche toujours l'état **To address**.

        Vous devez faire en sorte que le Niveau de sécurité Microsoft accorde les points de l'action et en enregistre la raison. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the status of the action to Resolved through third party", fr: "Définir l'état de l'action sur Resolved through third party" } }
        - { id: b, text: { en: "Set the status of the action to Risk accepted", fr: "Définir l'état de l'action sur Risk accepted" } }
        - { id: c, text: { en: "Set the status of the action to Planned", fr: "Définir l'état de l'action sur Planned" } }
        - { id: d, text: { en: "Set the status of the action to Resolved through alternate mitigation", fr: "Définir l'état de l'action sur Resolved through alternate mitigation" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Resolved through alternate mitigation is the status for an action that an internal tool already addresses: the score gains the points that the action is worth, and the justification is kept with the action. Microsoft has no visibility into the internal control, so the status must be reviewed if the control stops covering the action.
        fr: |
          Resolved through alternate mitigation est l'état d'une action déjà traitée par un outil interne : le score gagne les points que vaut l'action, et la justification est conservée avec l'action. Microsoft n'a aucune visibilité sur le contrôle interne : l'état doit donc être revu si ce contrôle cesse de couvrir l'action.
      options:
        a: { en: "Resolved through third party is for an action addressed by a non-Microsoft application or software; Litware's control is built in-house.", fr: "Resolved through third party concerne une action traitée par une application ou un logiciel non Microsoft ; le contrôle de Litware est développé en interne." }
        b: { en: "Risk accepted records a decision not to act and awards no points, although the control is in place.", fr: "Risk accepted enregistre la décision de ne pas agir et n'accorde aucun point, alors que le contrôle est en place." }
        c: { en: "Planned is for an action that will be completed later; it doesn't award the points of a control that already exists.", fr: "Planned concerne une action qui sera réalisée plus tard ; il n'accorde pas les points d'un contrôle qui existe déjà." }
    references:
      - title: Assess your security posture through Microsoft Secure Score - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score-improvement-actions

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-31-04
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has 40 Azure subscriptions under its tenant root management group, with Microsoft Defender for Cloud and Defender for Servers Plan 1. The security operations center uses Splunk Enterprise as its only SIEM and must keep it as the only SIEM.

        The Defender for Cloud security alerts and recommendations of every current and future subscription must reach Splunk as they change. Administrative effort must be minimized.

        What should you recommend?
      fr: |
        Northwind Traders dispose de 40 abonnements Azure sous son groupe d'administration racine du locataire, avec Microsoft Defender for Cloud et Defender for Servers Plan 1. Le centre des opérations de sécurité utilise Splunk Enterprise comme seul SIEM et doit le conserver comme seul SIEM.

        Les alertes de sécurité et les recommandations Defender for Cloud de chaque abonnement actuel et futur doivent parvenir à Splunk au fil de leurs changements. L'effort d'administration doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Continuous export to a Log Analytics workspace, configured in each subscription", fr: "L'exportation continue vers un espace de travail Log Analytics, configurée dans chaque abonnement" } }
        - { id: b, text: { en: "Continuous export to an event hub, deployed by Azure Policy at the root management group", fr: "L'exportation continue vers un hub d'événements, déployée par Azure Policy au groupe d'administration racine" } }
        - { id: c, text: { en: "A workflow automation in each subscription that emails every new alert to the SOC", fr: "Une automatisation de workflow dans chaque abonnement qui envoie chaque nouvelle alerte par e-mail au SOC" } }
        - { id: d, text: { en: "A Microsoft Sentinel workspace with the Defender for Cloud data connector for the tenant", fr: "Un espace de travail Microsoft Sentinel avec le connecteur de données Defender for Cloud pour le locataire" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Continuous export streams alerts and recommendations to Azure Event Hubs when their state changes, and Splunk reads the event hub with its add-on for Microsoft Cloud Services. The built-in policy that deploys export to an event hub, assigned at the root management group, covers every current and future subscription without per-subscription setup.
        fr: |
          L'exportation continue diffuse les alertes et les recommandations vers Azure Event Hubs quand leur état change, et Splunk lit le hub d'événements avec son module complémentaire pour Microsoft Cloud Services. La stratégie intégrée qui déploie l'exportation vers un hub d'événements, attribuée au groupe d'administration racine, couvre chaque abonnement actuel et futur sans configuration par abonnement.
      options:
        a: { en: "A Log Analytics workspace is the destination for Azure Monitor and Microsoft Sentinel, not for a third-party SIEM, and per-subscription setup misses new subscriptions.", fr: "Un espace de travail Log Analytics est la destination d'Azure Monitor et de Microsoft Sentinel, pas d'un SIEM tiers, et une configuration par abonnement oublie les nouveaux abonnements." }
        c: { en: "Emails don't feed Splunk, don't include recommendations and must be configured in every subscription.", fr: "Des e-mails n'alimentent pas Splunk, n'incluent pas les recommandations et doivent être configurés dans chaque abonnement." }
        d: { en: "Microsoft Sentinel would add a second SIEM, which the requirement forbids.", fr: "Microsoft Sentinel ajouterait un second SIEM, ce que l'exigence interdit." }
    references:
      - title: Stream alerts to monitoring solutions - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/export-to-siem
      - title: Set up continuous export in the Azure portal - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/continuous-export

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-31-05
    objective: "3.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank uses Microsoft Security Exposure Management. The CISO set a target score of 80 % for the ransomware initiative.

        The security team must review every significant drop of the initiative score, and of the metrics behind it, without writing any custom query.

        What should the team use?
      fr: |
        Woodgrove Bank utilise Sécurité Microsoft - Gestion de l'exposition. Le RSSI a défini un score cible de 80 % pour l'initiative sur les rançongiciels.

        L'équipe de sécurité doit examiner chaque baisse significative du score de l'initiative et des métriques qui le composent, sans écrire de requête personnalisée.

        Que doit utiliser l'équipe ?
    body:
      options:
        - { id: a, text: { en: "The Events page of Exposure insights, filtered for the initiative", fr: "La page Events des informations sur l'exposition, filtrée sur l'initiative" } }
        - { id: b, text: { en: "The target score of the initiative, compared with the current score each week", fr: "Le score cible de l'initiative, comparé chaque semaine au score actuel" } }
        - { id: c, text: { en: "A Defender for Cloud workflow automation on the ransomware recommendations", fr: "Une automatisation de workflow Defender for Cloud sur les recommandations liées aux rançongiciels" } }
        - { id: d, text: { en: "The history of Microsoft Secure Score for the identity and device categories", fr: "L'historique du Niveau de sécurité Microsoft pour les catégories identité et appareils" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Exposure insights include security events: the Events page lists initiative and metric score drop events for a chosen time range, and each event opens the affected initiative or metric. The team sees when the ransomware score fell and which metric caused it, without building a query.
        fr: |
          Les informations sur l'exposition incluent des événements de sécurité : la page Events liste les événements de baisse de score d'initiative et de métrique pour une période choisie, et chaque événement ouvre l'initiative ou la métrique concernée. L'équipe voit quand le score des rançongiciels a baissé et quelle métrique l'a causé, sans créer de requête.
      options:
        b: { en: "The target is the goal shown against the score; a weekly manual comparison misses the drops in between and doesn't show which metric caused them.", fr: "La cible est l'objectif affiché face au score ; une comparaison manuelle hebdomadaire manque les baisses intermédiaires et ne montre pas la métrique en cause." }
        c: { en: "Workflow automation reacts to Defender for Cloud recommendations and alerts on cloud resources; it doesn't follow an initiative that spans devices and identities.", fr: "L'automatisation des workflows réagit aux recommandations et alertes Defender for Cloud sur les ressources cloud ; elle ne suit pas une initiative qui couvre aussi les appareils et les identités." }
        d: { en: "The Secure Score history measures overall Microsoft 365 posture, not the ransomware initiative and its metrics.", fr: "L'historique du Niveau de sécurité Microsoft mesure la posture globale de Microsoft 365, pas l'initiative sur les rançongiciels et ses métriques." }
    references:
      - title: Review Security Initiatives in Microsoft Security Exposure Management - Microsoft Security Exposure Management
        url: https://learn.microsoft.com/en-us/security-exposure-management/initiatives

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-31-06
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. hosts a claims platform in an Azure subscription named **Sub-Claims**. Partners upload scanned documents to Azure Blob Storage containers, and the application stores the claim records in an Azure Cosmos DB for NoSQL account. Sub-Claims also contains 40 Azure VMs that already have Defender for Servers Plan 1.

        The security architecture must meet the following requirements:

        - Each document is scanned for malware as soon as it's uploaded.
        - An alert is raised when the Cosmos DB account is accessed from a Tor exit node or when SQL injection is attempted against it.
        - No plan that these requirements don't need is enabled.

        Which two plans should you recommend?

        Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. héberge une plateforme de sinistres dans un abonnement Azure nommé **Sub-Claims**. Des partenaires chargent des documents numérisés dans des conteneurs Stockage Blob Azure, et l'application stocke les dossiers de sinistres dans un compte Azure Cosmos DB for NoSQL. Sub-Claims contient aussi 40 machines virtuelles Azure qui disposent déjà de Defender for Servers Plan 1.

        L'architecture de sécurité doit répondre aux exigences suivantes :

        - Chaque document est analysé à la recherche de logiciels malveillants dès son chargement.
        - Une alerte est générée quand le compte Cosmos DB est consulté depuis un nœud de sortie Tor ou quand une injection SQL est tentée contre lui.
        - Aucun plan dont ces exigences n'ont pas besoin n'est activé.

        Quels deux plans devez-vous recommander ?

        Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Defender for Storage, with malware scanning on upload", fr: "Defender for Storage, avec l'analyse des logiciels malveillants au chargement" } }
        - { id: b, text: { en: "Defender for Servers Plan 2, for its agentless malware scanning", fr: "Defender for Servers Plan 2, pour son analyse sans agent des logiciels malveillants" } }
        - { id: c, text: { en: "Defender CSPM, for its sensitive data discovery", fr: "Defender CSPM, pour sa découverte des données sensibles" } }
        - { id: d, text: { en: "Defender for Databases, with the Azure Cosmos DB plan", fr: "Defender for Databases, avec le plan Azure Cosmos DB" } }
        - { id: e, text: { en: "Defender for Resource Manager, for its suspicious operation alerts", fr: "Defender for Resource Manager, pour ses alertes sur les opérations suspectes" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Defender for Storage scans blobs with Microsoft Defender Antivirus when they're uploaded, and its activity monitoring detects suspicious access to the storage account. Defender for Azure Cosmos DB, part of Defender for Databases, supports the NoSQL API and alerts on SQL injection attempts and on access from Tor exit nodes or suspicious IP addresses.
        fr: |
          Defender for Storage analyse les objets blob avec l'Antivirus Microsoft Defender lors de leur chargement, et sa surveillance de l'activité détecte les accès suspects au compte de stockage. Defender for Azure Cosmos DB, inclus dans Defender for Databases, prend en charge l'API NoSQL et génère des alertes sur les tentatives d'injection SQL et sur les accès depuis des nœuds de sortie Tor ou des adresses IP suspectes.
      options:
        b: { en: "The agentless malware scanning of Plan 2 scans the disks of the VMs, not the blobs that partners upload.", fr: "L'analyse sans agent des logiciels malveillants du Plan 2 analyse les disques des machines virtuelles, pas les objets blob chargés par les partenaires." }
        c: { en: "Sensitive data discovery adds data context to posture and attack paths; it neither scans files for malware nor raises threat alerts on Cosmos DB.", fr: "La découverte des données sensibles ajoute le contexte des données à la posture et aux chemins d'attaque ; elle n'analyse pas les fichiers à la recherche de logiciels malveillants et ne génère pas d'alertes de menace sur Cosmos DB." }
        e: { en: "Defender for Resource Manager watches management operations on the subscription, not data access to the Cosmos DB account.", fr: "Defender for Resource Manager surveille les opérations de gestion sur l'abonnement, pas l'accès aux données du compte Cosmos DB." }
    references:
      - title: What is Microsoft Defender for Storage - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction
      - title: Overview of Defender for Azure Cosmos DB - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-defender-for-cosmos

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-31-07
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam, Inc. enabled Defender CSPM on its Azure subscriptions. The CISO uses the classic secure score of Microsoft Defender for Cloud as a key indicator. Last month, the security team did the following:

        - It remediated every affected resource of a recommendation that is still in preview.
        - It created five custom recommendations for internal naming and encryption rules, and remediated all their findings.
        - In a security control that contains two recommendations, it remediated every resource for one of them; the other recommendation still has unhealthy resources.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. a activé Defender CSPM sur ses abonnements Azure. Le RSSI utilise le degré de sécurisation classique de Microsoft Defender for Cloud comme indicateur clé. Le mois dernier, l'équipe de sécurité a fait ce qui suit :

        - Elle a corrigé toutes les ressources concernées par une recommandation encore en préversion.
        - Elle a créé cinq recommandations personnalisées pour des règles internes de nommage et de chiffrement, et corrigé tous leurs résultats.
        - Dans un contrôle de sécurité qui contient deux recommandations, elle a corrigé toutes les ressources de l'une d'elles ; l'autre recommandation a encore des ressources non saines.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Remediating the preview recommendation didn't change the classic secure score.", fr: "La correction de la recommandation en préversion n'a pas modifié le degré de sécurisation classique." }
        - id: s2
          text: { en: "Remediating the findings of the custom recommendations raised the classic secure score.", fr: "La correction des résultats des recommandations personnalisées a augmenté le degré de sécurisation classique." }
        - id: s3
          text: { en: "The security control that contains two recommendations now earns its maximum points.", fr: "Le contrôle de sécurité qui contient deux recommandations rapporte désormais son nombre maximal de points." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Only built-in, generally available recommendations of the Microsoft cloud security benchmark count in the classic secure score: preview recommendations are excluded until they become generally available, and custom recommendations never count. A control earns all its points only when all of its recommendations are remediated for all resources.
        fr: |
          Seules les recommandations intégrées en disponibilité générale du benchmark de sécurité cloud Microsoft comptent dans le degré de sécurisation classique : les recommandations en préversion sont exclues jusqu'à leur disponibilité générale, et les recommandations personnalisées ne comptent jamais. Un contrôle ne rapporte tous ses points que lorsque toutes ses recommandations sont corrigées pour toutes les ressources.
      options:
        s2: { en: "Custom recommendations help track internal rules, but only built-in MCSB recommendations affect the classic secure score.", fr: "Les recommandations personnalisées aident à suivre des règles internes, mais seules les recommandations intégrées du MCSB influencent le degré de sécurisation classique." }
        s3: { en: "The other recommendation of the control still has unhealthy resources, so the control can't reach its maximum score.", fr: "L'autre recommandation du contrôle a encore des ressources non saines : le contrôle ne peut donc pas atteindre son score maximal." }
    references:
      - title: Cloud Secure Score in Microsoft Defender for Cloud - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-31-08
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders runs 60 instances of SQL Server 2019 on Windows Server 2022 in its on-premises datacenter. The servers were onboarded directly to Microsoft Defender for Endpoint by using the onboarding package and aren't connected to Azure. Northwind uses Microsoft Defender for Cloud for its Azure subscriptions.

        The security team sets the following requirements:

        - Vulnerability assessment of the SQL Server instances, with the findings in Defender for Cloud.
        - Alerts on SQL injection attempts and brute-force sign-ins against the instances.
        - No plan that these requirements don't need is enabled.

        What should you recommend?
      fr: |
        Northwind Traders exécute 60 instances de SQL Server 2019 sur Windows Server 2022 dans son centre de données local. Les serveurs ont été intégrés directement à Microsoft Defender for Endpoint avec le package d'intégration et ne sont pas connectés à Azure. Northwind utilise Microsoft Defender for Cloud pour ses abonnements Azure.

        L'équipe de sécurité fixe les exigences suivantes :

        - Évaluation des vulnérabilités des instances SQL Server, avec les résultats dans Defender for Cloud.
        - Alertes sur les tentatives d'injection SQL et les connexions par force brute contre les instances.
        - Aucun plan dont ces exigences n'ont pas besoin n'est activé.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Keep the direct onboarding, and enable Defender for Servers Plan 2 on the subscription linked to Defender for Endpoint", fr: "Conserver l'intégration directe, et activer Defender for Servers Plan 2 sur l'abonnement lié à Defender for Endpoint" } }
        - { id: b, text: { en: "Connect the servers to Azure Arc, and enable Defender for Servers Plan 2 on the subscription that contains them", fr: "Connecter les serveurs à Azure Arc, et activer Defender for Servers Plan 2 sur l'abonnement qui les contient" } }
        - { id: c, text: { en: "Connect the servers to Azure Arc as SQL Server enabled by Azure Arc, and enable Defender for SQL Servers on Machines", fr: "Connecter les serveurs à Azure Arc comme SQL Server compatible Arc, et activer Defender for SQL Servers on Machines" } }
        - { id: d, text: { en: "Enable Defender CSPM on the subscriptions, and use its agentless scanning to assess the SQL Server instances", fr: "Activer Defender CSPM sur les abonnements, et utiliser son analyse sans agent pour évaluer les instances SQL Server" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Defender for SQL Servers on Machines, part of Defender for Databases, provides vulnerability assessment and threat protection that detects SQL injection and brute-force attempts. For on-premises machines it requires the servers to be onboarded to Azure Arc and the instances registered as SQL Server enabled by Azure Arc, which gives them an Azure resource that Defender for Cloud can protect.
        fr: |
          Defender for SQL Servers on Machines, inclus dans Defender for Databases, fournit l'évaluation des vulnérabilités et une protection contre les menaces qui détecte les injections SQL et les tentatives de force brute. Pour les machines locales, il exige que les serveurs soient intégrés à Azure Arc et les instances inscrites comme SQL Server compatible Arc, ce qui leur donne une ressource Azure que Defender for Cloud peut protéger.
      options:
        a: { en: "Without Arc, the servers have no Azure resource for Defender for Cloud, and Defender for Servers doesn't include the SQL threat protection of Defender for Databases.", fr: "Sans Arc, les serveurs n'ont pas de ressource Azure pour Defender for Cloud, et Defender for Servers n'inclut pas la protection SQL contre les menaces de Defender for Databases." }
        b: { en: "Arc is the right first step, but Defender for Servers protects the operating system; SQL vulnerability assessment and SQL injection alerts come from Defender for SQL Servers on Machines.", fr: "Arc est la bonne première étape, mais Defender for Servers protège le système d'exploitation ; l'évaluation des vulnérabilités SQL et les alertes d'injection SQL viennent de Defender for SQL Servers on Machines." }
        d: { en: "Defender CSPM assesses posture and doesn't raise threat alerts, and its agentless scanning covers Azure, AWS and GCP machines, not unconnected on-premises servers.", fr: "Defender CSPM évalue la posture sans générer d'alertes de menace, et son analyse sans agent couvre les machines Azure, AWS et GCP, pas des serveurs locaux non connectés." }
    references:
      - title: Enable Microsoft Defender for SQL Servers on Machines - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-sql-usage
      - title: Benefits and Features of Defender for Azure SQL Databases - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-sql-introduction

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-31-09
    objective: "3.1.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso, Ltd. has deployed Microsoft Defender for Endpoint on all devices and Microsoft Defender for Identity on all domain controllers. Its Azure subscriptions and AWS accounts are covered by Microsoft Defender for Cloud with Defender CSPM, and its critical assets are classified in Microsoft Security Exposure Management. The red team and the cloud team bring three needs to the security architect.

        What should the posture management process use to meet each need? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. a déployé Microsoft Defender for Endpoint sur tous ses appareils et Microsoft Defender for Identity sur tous ses contrôleurs de domaine. Ses abonnements Azure et ses comptes AWS sont couverts par Microsoft Defender for Cloud avec Defender CSPM, et ses ressources critiques sont classées dans Sécurité Microsoft - Gestion de l'exposition. L'équipe rouge et l'équipe cloud soumettent trois besoins à l'architecte de sécurité.

        Que doit utiliser le processus de gestion de la posture pour répondre à chaque besoin ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Explore visually how an Azure VM, its managed identity and the key vault that the identity can read are connected: [[map]]

          Evaluate which devices, identities and cloud resources an attacker reaches if a jump server that many attack paths cross is compromised: [[impact]]

          Record that a recommendation on an Amazon S3 bucket is covered by a compensating control, with a justification and a review period: [[covered]]
        fr: |
          Explorer visuellement comment une machine virtuelle Azure, son identité managée et le coffre de clés que cette identité peut lire sont connectés : [[map]]

          Évaluer quels appareils, identités et ressources cloud un attaquant atteint si un serveur de rebond traversé par de nombreux chemins d'attaque est compromis : [[impact]]

          Enregistrer qu'une recommandation sur un compartiment Amazon S3 est couverte par un contrôle compensatoire, avec une justification et une période de révision : [[covered]]
      slots:
        - id: map
          options:
            - { id: surface, text: { en: "The attack surface map", fr: "La carte de la surface d'attaque" } }
            - { id: blast, text: { en: "The blast radius", fr: "Le rayon d'impact" } }
            - { id: choke, text: { en: "The choke point list", fr: "La liste des points d'étranglement" } }
            - { id: exempt, text: { en: "An exemption", fr: "Une exemption" } }
            - { id: target, text: { en: "An initiative target score", fr: "Un score cible d'initiative" } }
        - id: impact
          options:
            - { id: surface, text: { en: "The attack surface map", fr: "La carte de la surface d'attaque" } }
            - { id: blast, text: { en: "The blast radius", fr: "Le rayon d'impact" } }
            - { id: choke, text: { en: "The choke point list", fr: "La liste des points d'étranglement" } }
            - { id: exempt, text: { en: "An exemption", fr: "Une exemption" } }
            - { id: target, text: { en: "An initiative target score", fr: "Un score cible d'initiative" } }
        - id: covered
          options:
            - { id: surface, text: { en: "The attack surface map", fr: "La carte de la surface d'attaque" } }
            - { id: blast, text: { en: "The blast radius", fr: "Le rayon d'impact" } }
            - { id: choke, text: { en: "The choke point list", fr: "La liste des points d'étranglement" } }
            - { id: exempt, text: { en: "An exemption", fr: "Une exemption" } }
            - { id: target, text: { en: "An initiative target score", fr: "Un score cible d'initiative" } }
    answer:
      values: { map: surface, impact: blast, covered: exempt }
    explanation:
      correct:
        en: |
          The attack surface map visualizes assets and their relationships, including cloud resources and the identities that connect them. The blast radius starts from a choke point and shows what an attacker could reach if it fell; the choke point list only tells you where paths converge. An exemption excludes a finding covered by another control and records its scope, justification and review period for audit.
        fr: |
          La carte de la surface d'attaque visualise les ressources et leurs relations, y compris les ressources cloud et les identités qui les relient. Le rayon d'impact part d'un point d'étranglement et montre ce qu'un attaquant pourrait atteindre s'il tombait ; la liste des points d'étranglement indique seulement où les chemins convergent. Une exemption exclut un résultat couvert par un autre contrôle et enregistre son étendue, sa justification et sa période de révision pour l'audit.
      options:
        impact: { en: "The jump server is already known to be a choke point; the choke point list doesn't show what lies behind it, which is what the blast radius shows.", fr: "On sait déjà que le serveur de rebond est un point d'étranglement ; la liste des points d'étranglement ne montre pas ce qui se trouve derrière lui, ce que montre le rayon d'impact." }
        covered: { en: "A target score sets a goal for an initiative; it doesn't document why a single finding is accepted.", fr: "Un score cible fixe un objectif pour une initiative ; il ne documente pas pourquoi un résultat précis est accepté." }
    references:
      - title: Work with attack paths in Microsoft Security Exposure Management - Microsoft Security Exposure Management
        url: https://learn.microsoft.com/en-us/security-exposure-management/work-attack-paths-overview
      - title: What is Microsoft Security Exposure Management? - Microsoft Security Exposure Management
        url: https://learn.microsoft.com/en-us/security-exposure-management/microsoft-security-exposure-management

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-31-10
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has 60 Azure subscriptions in a management group hierarchy, and a subscription vending process creates new subscriptions every week. Woodgrove also has an AWS organization with 90 member accounts, and the cloud team creates new member accounts every week. The AWS security tools run in a delegated administrator account.

        Every server workload must be covered by Microsoft Defender for Cloud with Defender for Servers Plan 2, including in the future subscriptions and accounts. Administrative effort must be minimized.

        What should you recommend?
      fr: |
        Woodgrove Bank dispose de 60 abonnements Azure dans une hiérarchie de groupes d'administration, et un processus de distribution d'abonnements crée de nouveaux abonnements chaque semaine. Woodgrove dispose aussi d'une organisation AWS de 90 comptes membres, et l'équipe cloud crée de nouveaux comptes membres chaque semaine. Les outils de sécurité AWS s'exécutent dans un compte d'administrateur délégué.

        Chaque charge de travail serveur doit être couverte par Microsoft Defender for Cloud avec Defender for Servers Plan 2, y compris dans les futurs abonnements et comptes. L'effort d'administration doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A DeployIfNotExists policy that enables the plan, assigned at the top management group with a remediation task, and an AWS connector for the delegated administrator account", fr: "Une stratégie DeployIfNotExists qui active le plan, attribuée au groupe d'administration supérieur avec une tâche de correction, et un connecteur AWS pour le compte d'administrateur délégué" } }
        - { id: b, text: { en: "A DeployIfNotExists policy that enables the plan, assigned at the top management group with a remediation task, and an AWS connector for the management account with the plan selected", fr: "Une stratégie DeployIfNotExists qui active le plan, attribuée au groupe d'administration supérieur avec une tâche de correction, et un connecteur AWS pour le compte de gestion avec le plan sélectionné" } }
        - { id: c, text: { en: "A DeployIfNotExists policy that enables the plan, assigned at the top management group, and the AWS accounts brought under that assignment by installing Azure Arc in each account", fr: "Une stratégie DeployIfNotExists qui active le plan, attribuée au groupe d'administration supérieur, et les comptes AWS placés sous cette attribution en installant Azure Arc dans chaque compte" } }
        - { id: d, text: { en: "The plan enabled on each new subscription by the vending process, and a single-account AWS connector with the plan selected created for each new member account", fr: "Le plan activé sur chaque nouvel abonnement par le processus de distribution, et un connecteur AWS mono-compte avec le plan sélectionné créé pour chaque nouveau compte membre" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An Azure Policy assignment at the top management group is inherited by every current and future subscription: its DeployIfNotExists effect enables the plan on new subscriptions, and a remediation task enables it on the existing ones. On AWS, a connector for the management account auto-provisions connectors for the discovered and newly created member accounts, with the plans selected on the connector.
        fr: |
          Une attribution Azure Policy au groupe d'administration supérieur est héritée par chaque abonnement actuel et futur : son effet DeployIfNotExists active le plan sur les nouveaux abonnements, et une tâche de correction l'active sur les abonnements existants. Dans AWS, un connecteur pour le compte de gestion crée automatiquement les connecteurs des comptes membres découverts et nouvellement créés, avec les plans sélectionnés sur le connecteur.
      options:
        a: { en: "An organization connector works only with the AWS management account; delegated administrator accounts aren't supported.", fr: "Un connecteur d'organisation ne fonctionne qu'avec le compte de gestion AWS ; les comptes d'administrateur délégué ne sont pas pris en charge." }
        c: { en: "Azure Policy assignments evaluate Azure resources: Arc projects individual machines, not AWS accounts, and installing it by hand in every account isn't minimal effort.", fr: "Les attributions Azure Policy évaluent des ressources Azure : Arc projette des machines individuelles, pas des comptes AWS, et l'installer à la main dans chaque compte n'est pas un effort minimal." }
        d: { en: "Per-account connectors and per-subscription changes must be repeated every week, which isn't minimal effort.", fr: "Les connecteurs par compte et les modifications par abonnement doivent être répétés chaque semaine, ce qui n'est pas un effort minimal." }
    references:
      - title: Onboard a Management Group to Microsoft Defender for Cloud - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/onboard-management-group
      - title: Connect your AWS Account - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
