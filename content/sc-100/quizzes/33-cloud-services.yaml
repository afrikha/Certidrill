chapter: 33-cloud-services
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-33-01
    objective: "3.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. uses ServiceNow and Salesforce. Today, employees sign in to each SaaS app with a separate local account and password. The new SaaS security baseline requires employees to use their Microsoft Entra ID identities for these apps and to pass multifactor authentication (MFA) at sign-in.

        What should you recommend?
      fr: |
        Litware, Inc. utilise ServiceNow et Salesforce. Aujourd'hui, les employés se connectent à chaque application SaaS avec un compte local et un mot de passe distincts. La nouvelle base de référence de sécurité SaaS exige que les employés utilisent leurs identités Microsoft Entra ID pour ces applications et réussissent une authentification multifacteur (MFA) à la connexion.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Connect both apps to Defender for Cloud Apps with app connectors", fr: "Connecter les deux applications à Defender for Cloud Apps avec des connecteurs d'applications" } }
        - { id: b, text: { en: "Turn on the built-in MFA of each app for its local accounts", fr: "Activer la MFA intégrée de chaque application pour ses comptes locaux" } }
        - { id: c, text: { en: "Configure Entra SSO for both apps, and require MFA with Conditional Access", fr: "Configurer l'authentification unique Entra pour les deux applications, et exiger la MFA par l'accès conditionnel" } }
        - { id: d, text: { en: "Add both apps to Defender for Cloud and assign the MCSB to them", fr: "Ajouter les deux applications à Defender pour le cloud et leur attribuer le MCSB" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Federated single sign-on (SAML or OpenID Connect) with Microsoft Entra ID lets employees use their work identities in the SaaS apps. Conditional Access policies that target these cloud apps then require MFA at sign-in.
        fr: |
          L'authentification unique fédérée (SAML ou OpenID Connect) avec Microsoft Entra ID permet aux employés d'utiliser leurs identités professionnelles dans les applications SaaS. Des stratégies d'accès conditionnel qui ciblent ces applications cloud exigent ensuite la MFA à la connexion.
      options:
        a: { en: "App connectors give Defender for Cloud Apps posture and activity data; they don't change how users sign in.", fr: "Les connecteurs d'applications donnent à Defender for Cloud Apps des données de posture et d'activité ; ils ne changent pas la façon dont les utilisateurs se connectent." }
        b: { en: "Local accounts with app MFA still aren't the employees' Microsoft Entra ID identities.", fr: "Des comptes locaux avec la MFA de l'application ne sont toujours pas les identités Microsoft Entra ID des employés." }
        d: { en: "Defender for Cloud assesses Azure, AWS and GCP resources, not the sign-in of SaaS apps.", fr: "Defender pour le cloud évalue les ressources Azure, AWS et GCP, pas la connexion aux applications SaaS." }
    references:
      - title: What is single sign-on in Microsoft Entra ID?
        url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on
      - title: What is Conditional Access?
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-33-02
    objective: "3.3.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. runs production workloads on Linux node pools of an Azure Kubernetes Service (AKS) cluster. The security baseline requires that the nodes receive OS security fixes automatically, with updates tested by AKS. The Kubernetes version must change only during planned upgrades.

        What should you recommend?
      fr: |
        Fabrikam, Inc. exécute des charges de travail de production sur des pools de nœuds Linux d'un cluster Azure Kubernetes Service (AKS). La base de référence de sécurité exige que les nœuds reçoivent automatiquement les correctifs de sécurité du système d'exploitation, avec des mises à jour testées par AKS. La version de Kubernetes ne doit changer que lors des mises à niveau planifiées.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Set the cluster auto-upgrade channel to stable", fr: "Définir le canal de mise à niveau automatique du cluster sur stable" } }
        - { id: b, text: { en: "Set the node OS auto-upgrade channel to NodeImage", fr: "Définir le canal de mise à niveau automatique du système d'exploitation des nœuds sur NodeImage" } }
        - { id: c, text: { en: "Enable the vulnerability assessment of Defender for Containers", fr: "Activer l'évaluation des vulnérabilités de Defender for Containers" } }
        - { id: d, text: { en: "Run a manual node image upgrade at the end of each quarter", fr: "Exécuter une mise à niveau manuelle de l'image des nœuds à la fin de chaque trimestre" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The node OS auto-upgrade channel patches the node operating system without changing the Kubernetes version. With NodeImage, AKS ships a newly patched node image, typically weekly, and applies it within the maintenance window.
        fr: |
          Le canal de mise à niveau automatique du système d'exploitation des nœuds corrige le système d'exploitation des nœuds sans changer la version de Kubernetes. Avec NodeImage, AKS fournit une image de nœud corrigée, en général chaque semaine, et l'applique dans la fenêtre de maintenance.
      options:
        a: { en: "The cluster auto-upgrade channel upgrades the Kubernetes version, which must change only during planned upgrades.", fr: "Le canal de mise à niveau automatique du cluster met à niveau la version de Kubernetes, qui ne doit changer que lors des mises à niveau planifiées." }
        c: { en: "Vulnerability assessment reports missing fixes; it doesn't install them.", fr: "L'évaluation des vulnérabilités signale les correctifs manquants ; elle ne les installe pas." }
        d: { en: "A quarterly manual upgrade isn't automatic and leaves the nodes unpatched for months.", fr: "Une mise à niveau manuelle trimestrielle n'est pas automatique et laisse les nœuds sans correctifs pendant des mois." }
    references:
      - title: Autoupgrade node OS images in Azure Kubernetes Service (AKS)
        url: https://learn.microsoft.com/en-us/azure/aks/auto-upgrade-node-os-image

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-33-03
    objective: "3.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware, Inc. hosts a claims web application on virtual machines in a virtual network in the West Europe region. Employees reach the application from the on-premises network over ExpressRoute private peering, and partners reach it from the internet.

        The security requirements state that a web application firewall with managed rules must inspect every request, and that the employees' traffic must not leave the private connection.

        What should you recommend?
      fr: |
        Proseware, Inc. héberge une application web de gestion des sinistres sur des machines virtuelles dans un réseau virtuel de la région Europe Ouest. Les employés accèdent à l'application depuis le réseau local par le peering privé ExpressRoute, et les partenaires y accèdent depuis Internet.

        Les exigences de sécurité indiquent qu'un pare-feu d'applications web avec des règles managées doit inspecter chaque requête, et que le trafic des employés ne doit pas quitter la connexion privée.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Azure Front Door Premium with a WAF policy and a Private Link origin", fr: "Azure Front Door Premium avec une stratégie WAF et une origine Private Link" } }
        - { id: b, text: { en: "Application Gateway WAF_v2 with both a public and a private frontend IP", fr: "Application Gateway WAF_v2 avec une adresse IP frontale publique et une privée" } }
        - { id: c, text: { en: "Azure Firewall Premium with intrusion detection and prevention", fr: "Pare-feu Azure Premium avec la détection et la prévention des intrusions" } }
        - { id: d, text: { en: "Network security groups on the subnet, with Azure DDoS Protection", fr: "Des groupes de sécurité réseau sur le sous-réseau, avec Azure DDoS Protection" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Application Gateway WAF_v2 is a regional layer 7 WAF deployed in the virtual network. A v2 gateway can have a public and a private frontend IP, so partners use the public one and employees reach the private one over ExpressRoute, with the same WAF policy inspecting both.
        fr: |
          Application Gateway WAF_v2 est un WAF régional de couche 7 déployé dans le réseau virtuel. Une passerelle v2 peut avoir une adresse IP frontale publique et une privée : les partenaires utilisent la publique et les employés atteignent la privée par ExpressRoute, la même stratégie WAF inspectant les deux.
      options:
        a: { en: "Front Door is a global entry point on public endpoints: employees would reach it over the internet, not over private peering.", fr: "Front Door est un point d'entrée mondial sur des points de terminaison publics : les employés l'atteindraient par Internet, pas par le peering privé." }
        c: { en: "Azure Firewall isn't a WAF: it doesn't apply managed web rules against attacks such as SQL injection.", fr: "Le Pare-feu Azure n'est pas un WAF : il n'applique pas de règles web managées contre des attaques comme l'injection SQL." }
        d: { en: "NSGs filter at layers 3 and 4 and DDoS Protection mitigates volumetric attacks; neither inspects web requests.", fr: "Les NSG filtrent aux couches 3 et 4 et DDoS Protection atténue les attaques volumétriques ; aucun n'inspecte les requêtes web." }
    references:
      - title: What is Azure Web Application Firewall on Azure Application Gateway?
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
      - title: Application Gateway frontend IP address configuration
        url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-frontend-ip

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-33-04
    objective: "3.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders is building a retrieval-augmented generation (RAG) application on Azure App Service. The application uses a managed identity to query an index named **products** in an Azure AI Search service, which also hosts indexes of other teams. Key authentication will be disabled on the search service.

        You need to recommend the access that the application receives. The solution must follow the principle of least privilege.

        What should you recommend?
      fr: |
        Northwind Traders développe une application de génération augmentée de récupération (RAG) sur Azure App Service. L'application utilise une identité managée pour interroger un index nommé **products** dans un service Azure AI Search, qui héberge aussi des index d'autres équipes. L'authentification par clé sera désactivée sur le service de recherche.

        Vous devez recommander l'accès que reçoit l'application. La solution doit respecter le principe du privilège minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Search Index Data Contributor on the search service", fr: "Search Index Data Contributor sur le service de recherche" } }
        - { id: b, text: { en: "Search Service Contributor on the search service", fr: "Search Service Contributor sur le service de recherche" } }
        - { id: c, text: { en: "Contributor on the search service", fr: "Contributor sur le service de recherche" } }
        - { id: d, text: { en: "Search Index Data Reader on the products index", fr: "Search Index Data Reader sur l'index products" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Search Index Data Reader is the least-privileged data plane role for querying an index, and it can be scoped to a single index. With key authentication disabled, the application's access depends only on this role assignment.
        fr: |
          Search Index Data Reader est le rôle de plan de données le moins privilégié pour interroger un index, et il peut être limité à un seul index. Avec l'authentification par clé désactivée, l'accès de l'application dépend uniquement de cette attribution de rôle.
      options:
        a: { en: "This role also loads documents, and at the service scope it covers the indexes of the other teams.", fr: "Ce rôle charge aussi des documents, et à l'étendue du service il couvre les index des autres équipes." }
        b: { en: "Search Service Contributor manages objects but doesn't query indexes through role-based access.", fr: "Search Service Contributor gère les objets mais n'interroge pas les index par l'accès en fonction du rôle." }
        c: { en: "Contributor is a control plane role: it doesn't grant query access to the index.", fr: "Contributor est un rôle du plan de contrôle : il n'accorde pas l'accès en interrogation à l'index." }
    references:
      - title: Connect to Azure AI Search using roles
        url: https://learn.microsoft.com/en-us/azure/search/search-security-rbac

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-33-05
    objective: "3.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. will run line-of-business APIs on Azure Container Apps in a new environment. The APIs are called by applications in a virtual network named VNet1 and by on-premises users connected to VNet1 by ExpressRoute.

        The security requirements state that the APIs must have no public endpoint.

        What should you recommend for the Container Apps environment?
      fr: |
        Contoso, Ltd. va exécuter des API métier sur Azure Container Apps dans un nouvel environnement. Les API sont appelées par des applications d'un réseau virtuel nommé VNet1 et par des utilisateurs locaux connectés à VNet1 par ExpressRoute.

        Les exigences de sécurité indiquent que les API ne doivent avoir aucun point de terminaison public.

        Que devez-vous recommander pour l'environnement Container Apps ?
    body:
      options:
        - { id: a, text: { en: "An external environment whose ingress accepts traffic only from within the environment", fr: "Un environnement externe dont l'entrée n'accepte que le trafic provenant de l'environnement" } }
        - { id: b, text: { en: "An external environment with IP restrictions that allow only the corporate ranges", fr: "Un environnement externe avec des restrictions IP qui n'autorisent que les plages de l'entreprise" } }
        - { id: c, text: { en: "An internal environment deployed in a subnet of an existing virtual network", fr: "Un environnement interne déployé dans un sous-réseau d'un réseau virtuel existant" } }
        - { id: d, text: { en: "An external environment in the default network, published through Azure Front Door", fr: "Un environnement externe dans le réseau par défaut, publié par Azure Front Door" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An internal environment has no public endpoint: its virtual IP is an internal load balancer address from the virtual network, so it's reachable only from the virtual network and the networks connected to it. Public network access can't be enabled on it, and the network choice is made when the environment is created.
        fr: |
          Un environnement interne n'a pas de point de terminaison public : son adresse IP virtuelle est une adresse d'équilibreur de charge interne issue du réseau virtuel, il n'est donc joignable que depuis le réseau virtuel et les réseaux qui y sont connectés. L'accès au réseau public ne peut pas y être activé, et le choix du réseau se fait à la création de l'environnement.
      options:
        a: { en: "Ingress limited to the environment blocks the VNet1 applications and the on-premises users too.", fr: "Une entrée limitée à l'environnement bloque aussi les applications de VNet1 et les utilisateurs locaux." }
        b: { en: "IP restrictions filter callers, but the environment keeps a public endpoint.", fr: "Les restrictions IP filtrent les appelants, mais l'environnement conserve un point de terminaison public." }
        d: { en: "Front Door publishes the APIs on the internet, which is the opposite of the requirement.", fr: "Front Door publie les API sur Internet, ce qui est le contraire de l'exigence." }
    references:
      - title: Networking in Azure Container Apps environment
        url: https://learn.microsoft.com/en-us/azure/container-apps/networking

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-33-06
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware Foods runs Azure IoT Operations on an Azure Arc-enabled Kubernetes cluster in each plant. The instances were deployed with test settings during a pilot:

        - The MQTT broker uses the default certificate issuer created by Azure IoT Operations.
        - Every client that authenticates to the MQTT broker can publish and subscribe to every topic.
        - The connectors read the user names and passwords of the OPC UA servers from YAML files copied to the cluster.

        Before production, Litware requires that the TLS certificates are anchored in its enterprise PKI and trusted by its existing systems, that each production line's clients use only the topics of their line, and that no connector credential is stored in a file on the cluster.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware Foods exécute Azure IoT Operations sur un cluster Kubernetes compatible Azure Arc dans chaque usine. Les instances ont été déployées avec les paramètres de test pendant un pilote :

        - Le broker MQTT utilise l'émetteur de certificats par défaut créé par Azure IoT Operations.
        - Chaque client qui s'authentifie auprès du broker MQTT peut publier et s'abonner sur toutes les rubriques.
        - Les connecteurs lisent les noms d'utilisateur et mots de passe des serveurs OPC UA dans des fichiers YAML copiés sur le cluster.

        Avant la production, Litware exige que les certificats TLS soient ancrés dans son infrastructure à clé publique (PKI) d'entreprise et approuvés par ses systèmes existants, que les clients de chaque ligne de production n'utilisent que les rubriques de leur ligne, et qu'aucun identifiant de connecteur ne soit stocké dans un fichier sur le cluster.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          TLS certificates: [[tls]]

          Topic access of the MQTT clients: [[topics]]

          Connector credentials: [[secrets]]
        fr: |
          Certificats TLS : [[tls]]

          Accès des clients MQTT aux rubriques : [[topics]]

          Identifiants des connecteurs : [[secrets]]
      slots:
        - id: tls
          options:
            - { id: byo, text: { en: "Your own issuer backed by the enterprise CA, configured before the instance is deployed", fr: "Votre propre émetteur adossé à l'autorité de certification d'entreprise, configuré avant le déploiement de l'instance" } }
            - { id: default, text: { en: "The default issuer, with its root CA certificate distributed to the existing systems", fr: "L'émetteur par défaut, avec le certificat de sa racine distribué aux systèmes existants" } }
            - { id: selfsigned, text: { en: "A self-signed certificate generated on each client and trusted by the broker", fr: "Un certificat auto-signé généré sur chaque client et approuvé par le broker" } }
        - id: topics
          options:
            - { id: authz, text: { en: "BrokerAuthorization rules that allow each line's principals only the topics of their line", fr: "Des règles BrokerAuthorization qui n'autorisent aux principaux de chaque ligne que les rubriques de leur ligne" } }
            - { id: authn, text: { en: "An additional BrokerAuthentication method that requires X.509 client certificates", fr: "Une méthode BrokerAuthentication supplémentaire qui exige des certificats clients X.509" } }
            - { id: netpol, text: { en: "Kubernetes network policies that isolate the namespace of the MQTT broker", fr: "Des stratégies réseau Kubernetes qui isolent l'espace de noms du broker MQTT" } }
            - { id: rbac, text: { en: "An Azure role assignment on the Azure IoT Operations instance for each line", fr: "Une attribution de rôle Azure sur l'instance Azure IoT Operations pour chaque ligne" } }
        - id: secrets
          options:
            - { id: sync, text: { en: "Secure settings with secrets synchronized from Azure Key Vault by a managed identity", fr: "Les paramètres sécurisés avec des secrets synchronisés depuis Azure Key Vault par une identité managée" } }
            - { id: k8s, text: { en: "Kubernetes secrets created from the YAML files, then the files deleted", fr: "Des secrets Kubernetes créés à partir des fichiers YAML, puis la suppression des fichiers" } }
            - { id: cm, text: { en: "A ConfigMap in the Azure IoT Operations namespace that holds the credentials", fr: "Une ConfigMap de l'espace de noms Azure IoT Operations qui contient les identifiants" } }
    answer:
      values: { tls: byo, topics: authz, secrets: sync }
    explanation:
      correct:
        en: |
          The default issuer's root CA is self-signed, labeled "Not for Production" and trusted by no client outside Azure IoT Operations; for production, Microsoft recommends your own issuer backed by the enterprise PKI, set up before the instance is deployed. MQTT broker authorization is deny by default with BrokerAuthorization rules that grant Connect, Publish and Subscribe per principal and topic, which gives each line only its own topics. Secure settings use a user-assigned managed identity to synchronize secrets from Azure Key Vault to the edge.
        fr: |
          La racine de l'émetteur par défaut est auto-signée, étiquetée « Not for Production » et approuvée par aucun client en dehors d'Azure IoT Operations ; pour la production, Microsoft recommande votre propre émetteur adossé à la PKI d'entreprise, configuré avant le déploiement de l'instance. L'autorisation du broker MQTT refuse tout par défaut, avec des règles BrokerAuthorization qui accordent Connect, Publish et Subscribe par principal et par rubrique, ce qui donne à chaque ligne ses seules rubriques. Les paramètres sécurisés utilisent une identité managée affectée par l'utilisateur pour synchroniser les secrets depuis Azure Key Vault vers la périphérie.
      options:
        default: { en: "The default CA is for development and testing, and it isn't anchored in the enterprise PKI.", fr: "L'autorité de certification par défaut sert au développement et aux tests, et elle n'est pas ancrée dans la PKI d'entreprise." }
        authn: { en: "Authentication proves who the client is; it doesn't limit the topics that the client can use.", fr: "L'authentification prouve qui est le client ; elle ne limite pas les rubriques qu'il peut utiliser." }
        netpol: { en: "Network policies filter pod traffic, not MQTT topics inside a connection.", fr: "Les stratégies réseau filtrent le trafic des pods, pas les rubriques MQTT à l'intérieur d'une connexion." }
        k8s: { en: "The credentials would still be managed by hand on the cluster, outside Azure Key Vault.", fr: "Les identifiants seraient toujours gérés à la main sur le cluster, en dehors d'Azure Key Vault." }
    references:
      - title: Set up your own certificate issuer
        url: https://learn.microsoft.com/en-us/azure/iot-operations/deploy-iot-ops/howto-bring-your-own-issuer
      - title: Configure MQTT broker authorization
        url: https://learn.microsoft.com/en-us/azure/iot-operations/manage-mqtt-broker/howto-configure-authorization

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-33-07
    objective: "3.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank publishes a loan simulator that runs on Azure App Service. Customers reach it through an Azure Front Door **Standard** profile with a WAF policy that uses custom rules. The budget doesn't allow an upgrade to the Premium tier this year.

        A penetration test showed that requests sent to the app's azurewebsites.net host name, or relayed by another Front Door profile, bypass the WAF. The app must accept only the requests that come through Woodgrove's profile, without any change to the application code.

        What should you recommend?
      fr: |
        Woodgrove Bank publie un simulateur de prêt qui s'exécute sur Azure App Service. Les clients y accèdent par un profil Azure Front Door **Standard** avec une stratégie WAF qui utilise des règles personnalisées. Le budget ne permet pas de passer au niveau Premium cette année.

        Un test d'intrusion a montré que les requêtes envoyées au nom d'hôte azurewebsites.net de l'application, ou relayées par un autre profil Front Door, contournent le WAF. L'application ne doit accepter que les requêtes qui passent par le profil de Woodgrove, sans aucune modification du code de l'application.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "An access restriction on the app that allows only the AzureFrontDoor.Backend service tag", fr: "Une restriction d'accès sur l'application qui n'autorise que la balise de service AzureFrontDoor.Backend" } }
        - { id: b, text: { en: "A Private Link connection from Front Door to the app, and public network access disabled on the app", fr: "Une connexion Private Link de Front Door vers l'application, et l'accès au réseau public désactivé sur l'application" } }
        - { id: c, text: { en: "A WAF custom rule on the profile that blocks requests whose Host header isn't the custom domain", fr: "Une règle WAF personnalisée sur le profil qui bloque les requêtes dont l'en-tête Host n'est pas le domaine personnalisé" } }
        - { id: d, text: { en: "An access restriction that allows the AzureFrontDoor.Backend service tag with the profile's X-Azure-FDID value", fr: "Une restriction d'accès qui autorise la balise de service AzureFrontDoor.Backend avec la valeur X-Azure-FDID du profil" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          On the Standard tier, the origin is locked down with App Service access restrictions: the AzureFrontDoor.Backend service tag admits only Front Door's back-end addresses, and the X-Azure-FDID header filter admits only requests that carry Woodgrove's Front Door ID. Both checks are done by the platform, so the code doesn't change.
        fr: |
          Au niveau Standard, l'origine est verrouillée par des restrictions d'accès App Service : la balise de service AzureFrontDoor.Backend n'admet que les adresses principales de Front Door, et le filtre d'en-tête X-Azure-FDID n'admet que les requêtes qui portent l'ID Front Door de Woodgrove. Les deux contrôles sont faits par la plateforme : le code ne change pas.
      options:
        a: { en: "The service tag covers the Front Door addresses shared by all Azure customers, so another profile can still reach the app.", fr: "La balise de service couvre les adresses Front Door partagées par tous les clients Azure : un autre profil peut encore atteindre l'application." }
        b: { en: "Private Link origins require Front Door Premium, which the budget excludes.", fr: "Les origines Private Link exigent Front Door Premium, que le budget exclut." }
        c: { en: "The WAF only sees requests that go through the profile; direct requests to azurewebsites.net never reach it.", fr: "Le WAF ne voit que les requêtes qui passent par le profil ; les requêtes directes vers azurewebsites.net ne l'atteignent jamais." }
    references:
      - title: Secure traffic to Azure Front Door origins
        url: https://learn.microsoft.com/en-us/azure/frontdoor/origin-security

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-33-08
    objective: "3.3.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys is creating a new Azure Kubernetes Service (AKS) cluster with Microsoft Entra integration and Azure RBAC for Kubernetes authorization. Deployments are made by a SaaS deployment service that runs on the internet and publishes a fixed list of egress IP addresses. Cluster administrators work from the corporate network, which reaches the internet through two known egress IP addresses.

        The security requirements state that:

        - The API server is reachable only from the deployment service and the corporate network.
        - Nobody can obtain a static credential that grants administrator access to the cluster without Microsoft Entra authentication.

        Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys crée un nouveau cluster Azure Kubernetes Service (AKS) avec l'intégration Microsoft Entra et Azure RBAC pour l'autorisation Kubernetes. Les déploiements sont effectués par un service de déploiement SaaS qui s'exécute sur Internet et publie une liste fixe d'adresses IP de sortie. Les administrateurs du cluster travaillent depuis le réseau de l'entreprise, qui accède à Internet par deux adresses IP de sortie connues.

        Les exigences de sécurité indiquent que :

        - Le serveur d'API n'est joignable que depuis le service de déploiement et le réseau de l'entreprise.
        - Personne ne peut obtenir un identifiant statique qui donne un accès administrateur au cluster sans authentification Microsoft Entra.

        Quelles deux actions devez-vous inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Deploy the cluster as a private cluster, with a private endpoint for the API server", fr: "Déployer le cluster comme cluster privé, avec un point de terminaison privé pour le serveur d'API" } }
        - { id: b, text: { en: "Configure API server authorized IP ranges with the deployment service and corporate addresses", fr: "Configurer des plages d'adresses IP autorisées du serveur d'API avec les adresses du service de déploiement et de l'entreprise" } }
        - { id: c, text: { en: "Add rules to the NSG of the node subnet that allow only these addresses to reach the API server", fr: "Ajouter des règles au NSG du sous-réseau des nœuds qui n'autorisent que ces adresses à atteindre le serveur d'API" } }
        - { id: d, text: { en: "Disable local accounts on the cluster, so that admin credentials can't be retrieved", fr: "Désactiver les comptes locaux sur le cluster, pour que les identifiants admin ne puissent pas être récupérés" } }
        - { id: e, text: { en: "Apply Kubernetes network policies that accept traffic only from the deployment service", fr: "Appliquer des stratégies réseau Kubernetes qui n'acceptent que le trafic du service de déploiement" } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Authorized IP ranges keep the API server public but make it refuse requests from addresses outside the list, which suits a SaaS service on the internet with published egress addresses. Local accounts are enabled by default, so the static admin credential stays available even with Entra integration until local accounts are disabled; afterwards, getting the admin credential fails and access goes through Microsoft Entra ID.
        fr: |
          Les plages d'adresses IP autorisées gardent le serveur d'API public mais lui font refuser les requêtes des adresses hors de la liste, ce qui convient à un service SaaS sur Internet dont les adresses de sortie sont publiées. Les comptes locaux sont activés par défaut : l'identifiant admin statique reste disponible même avec l'intégration Entra tant qu'ils ne sont pas désactivés ; ensuite, la récupération de l'identifiant admin échoue et l'accès passe par Microsoft Entra ID.
      options:
        a: { en: "A SaaS service on the internet can't reach a private API server, and authorized IP ranges can't be used with private clusters.", fr: "Un service SaaS sur Internet ne peut pas atteindre un serveur d'API privé, et les plages d'adresses IP autorisées ne peuvent pas être utilisées avec les clusters privés." }
        c: { en: "The API server is in the AKS-managed control plane, not in the node subnet, so the NSG doesn't filter its traffic.", fr: "Le serveur d'API se trouve dans le plan de contrôle géré par AKS, pas dans le sous-réseau des nœuds : le NSG ne filtre pas son trafic." }
        e: { en: "Network policies filter traffic between pods, not requests to the API server.", fr: "Les stratégies réseau filtrent le trafic entre les pods, pas les requêtes vers le serveur d'API." }
    references:
      - title: Secure access to the API server using authorized IP address ranges in Azure Kubernetes Service (AKS)
        url: https://learn.microsoft.com/en-us/azure/aks/api-server-authorized-ip-ranges
      - title: Manage local accounts with Microsoft Entra integration
        url: https://learn.microsoft.com/en-us/azure/aks/manage-local-accounts-managed-azure-ad

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-33-09
    objective: "3.3.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Corporation exposes a customer assistant built on an Azure OpenAI model deployment in a Microsoft Foundry project. The assistant's back end runs on Azure App Service with a managed identity, and key authentication is disabled on the Foundry resource. Threat protection for AI services is enabled in Defender for Cloud, and a guardrail is assigned to the deployment.

        The security team requires that jailbreak attempts never reach the model and that the SOC is alerted about them.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation expose un assistant client basé sur un déploiement de modèle Azure OpenAI dans un projet Microsoft Foundry. Le back-end de l'assistant s'exécute sur Azure App Service avec une identité managée, et l'authentification par clé est désactivée sur la ressource Foundry. La protection contre les menaces pour les services d'IA est activée dans Defender pour le cloud, et un garde-fou est attribué au déploiement.

        L'équipe de sécurité exige que les tentatives de jailbreak n'atteignent jamais le modèle et que le SOC soit alerté à leur sujet.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Assigning the Contributor role on the Foundry resource to the managed identity lets the back end call the model deployment.", fr: "Attribuer le rôle Contributor sur la ressource Foundry à l'identité managée permet au back-end d'appeler le déploiement de modèle." }
        - id: s2
          text: { en: "A guardrail control for user prompt attacks, set to annotate and block on user input, can stop a jailbreak prompt.", fr: "Un contrôle de garde-fou pour les attaques par prompt utilisateur, réglé sur annoter et bloquer pour l'entrée utilisateur, peut arrêter un prompt de jailbreak." }
        - id: s3
          text: { en: "Threat protection for AI services blocks a detected jailbreak prompt before the model processes it.", fr: "La protection contre les menaces pour les services d'IA bloque un prompt de jailbreak détecté avant que le modèle ne le traite." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Contributor manages Foundry resources but has no data actions; with key authentication disabled, the back end needs a data role such as Foundry User. A guardrail scans the user input with Azure AI Content Safety and, with the annotate and block action, stops a user prompt attack before the model answers. Threat protection for AI services detects and alerts, with Defender XDR correlation; it doesn't block the prompt, so both controls are needed.
        fr: |
          Contributor gère les ressources Foundry mais n'a aucune action de données ; avec l'authentification par clé désactivée, le back-end a besoin d'un rôle de données comme Foundry User. Un garde-fou analyse l'entrée utilisateur avec Azure AI Content Safety et, avec l'action annoter et bloquer, arrête une attaque par prompt utilisateur avant que le modèle ne réponde. La protection contre les menaces pour les services d'IA détecte et alerte, avec la corrélation dans Defender XDR ; elle ne bloque pas le prompt : les deux contrôles sont donc nécessaires.
      options:
        s1: { en: "Contributor has no data actions; Foundry User is the least-privileged role that uses the deployments.", fr: "Contributor n'a aucune action de données ; Foundry User est le rôle le moins privilégié qui utilise les déploiements." }
        s3: { en: "Defender for AI services raises alerts; blocking before the model is the guardrail's job.", fr: "Defender for AI services génère des alertes ; bloquer avant le modèle est le rôle du garde-fou." }
    references:
      - title: Role-based access control for Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-foundry
      - title: Guardrails and controls overview in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-33-10
    objective: "3.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys stores its container images in an Azure Container Registry Premium registry. A release pipeline deploys the images to an AKS cluster that runs Kubernetes 1.32 and to Azure Container Apps. Microsoft Defender for Containers is enabled, and the developers receive the vulnerability findings of the registry images.

        The security team requires that no image with a critical vulnerability starts on either platform. The solution must use a single control for both platforms and must not require custom admission code.

        What should you recommend?
      fr: |
        Wingtip Toys stocke ses images conteneur dans un registre Azure Container Registry Premium. Un pipeline de mise en production déploie les images sur un cluster AKS qui exécute Kubernetes 1.32 et sur Azure Container Apps. Microsoft Defender for Containers est activé, et les développeurs reçoivent les résultats de vulnérabilités des images du registre.

        L'équipe de sécurité exige qu'aucune image comportant une vulnérabilité critique ne démarre sur l'une ou l'autre plateforme. La solution doit utiliser un seul contrôle pour les deux plateformes et ne doit pas nécessiter de code d'admission personnalisé.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Gated deployment rules in Defender for Containers, set to deny images with critical vulnerabilities", fr: "Des règles de déploiement contrôlé dans Defender for Containers, réglées pour refuser les images avec des vulnérabilités critiques" } }
        - { id: b, text: { en: "A scan of each image in the pipeline that stops the release on critical findings, as the only deployment path", fr: "Une analyse de chaque image dans le pipeline qui arrête la mise en production en cas de résultat critique, comme seul chemin de déploiement" } }
        - { id: c, text: { en: "Daily rescans of the registry images by the agentless vulnerability assessment of Defender for Containers", fr: "Des réanalyses quotidiennes des images du registre par l'évaluation des vulnérabilités sans agent de Defender for Containers" } }
        - { id: d, text: { en: "Notary Project signatures on every image, verified by the platforms before each deployment", fr: "Des signatures Notary Project sur chaque image, vérifiées par les plateformes avant chaque déploiement" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A scan in the build or release pipeline that stops on critical findings applies before the image reaches any platform, so it covers AKS and Container Apps alike, provided the pipeline is the only way to deploy. Gated deployment is an admission controller for Kubernetes, supported on AKS only, so it can't protect Container Apps.
        fr: |
          Une analyse dans le pipeline de build ou de mise en production qui s'arrête sur les résultats critiques s'applique avant que l'image n'atteigne une plateforme : elle couvre donc AKS comme Container Apps, à condition que le pipeline soit le seul moyen de déployer. Le déploiement contrôlé est un contrôleur d'admission pour Kubernetes, pris en charge sur AKS uniquement : il ne peut pas protéger Container Apps.
      options:
        a: { en: "Gated deployment works on AKS clusters only; Azure Container Apps isn't a supported environment.", fr: "Le déploiement contrôlé ne fonctionne que sur les clusters AKS ; Azure Container Apps n'est pas un environnement pris en charge." }
        c: { en: "Scanning reports that an image is vulnerable; it doesn't stop the image from running.", fr: "L'analyse signale qu'une image est vulnérable ; elle ne l'empêche pas de s'exécuter." }
        d: { en: "A signature proves where an image comes from and that it wasn't modified, not that it is free of vulnerabilities.", fr: "Une signature prouve d'où vient une image et qu'elle n'a pas été modifiée, pas qu'elle est exempte de vulnérabilités." }
    references:
      - title: Gated deployment for Kubernetes container images
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/runtime-gated-overview
      - title: Containers support matrix in Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/support-matrix-defender-for-containers
