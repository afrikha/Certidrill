chapter: 13-caf-waf
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-13-01
    objective: "1.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation is starting its move to Azure. The CISO wants one Microsoft guidance that integrates security into every phase of the adoption: the strategy, the plan, the preparation of the environment, the migration, and then the governance and the management of the cloud estate.

        Which guidance should you recommend?
      fr: |
        Adatum Corporation commence sa migration vers Azure. Le RSSI veut une seule recommandation Microsoft qui intègre la sécurité à chaque phase de l'adoption : la stratégie, le plan, la préparation de l'environnement, la migration, puis la gouvernance et la gestion du patrimoine cloud.

        Quelle recommandation devez-vous préconiser ?
    body:
      options:
        - { id: a, text: { en: "The Security pillar of the Azure Well-Architected Framework", fr: "Le pilier Sécurité d'Azure Well-Architected Framework" } }
        - { id: b, text: { en: "The security design area of Azure landing zones", fr: "La zone de conception sécurité des zones d'atterrissage Azure" } }
        - { id: c, text: { en: "The Secure methodology of the Cloud Adoption Framework", fr: "La méthodologie Secure du Cloud Adoption Framework" } }
        - { id: d, text: { en: "The control domains of the Microsoft cloud security benchmark", fr: "Les domaines de contrôle du Microsoft cloud security benchmark" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The CAF Secure methodology applies security to every phase of cloud adoption: teams and roles, strategy, plan, ready, adopt, govern and manage. Each phase covers posture modernization, incident preparedness, confidentiality, integrity, availability and posture sustainment, which is the organization-wide scope the CISO asks for.
        fr: |
          La méthodologie Secure du CAF applique la sécurité à chaque phase de l'adoption du cloud : équipes et rôles, stratégie, plan, préparation, adoption, gouvernance et gestion. Chaque phase couvre la modernisation de la posture, la préparation aux incidents, la confidentialité, l'intégrité, la disponibilité et le maintien de la posture, ce qui correspond à l'étendue de toute l'organisation demandée par le RSSI.
      options:
        a: { en: "The WAF Security pillar guides the design of one workload; it doesn't cover the adoption phases of the whole organization.", fr: "Le pilier Sécurité du WAF guide la conception d'une charge de travail ; il ne couvre pas les phases d'adoption de toute l'organisation." }
        b: { en: "The security design area builds the security foundation of the landing zone during the Ready phase; the other phases are covered by the Secure methodology.", fr: "La zone de conception sécurité construit la base de sécurité de la zone d'atterrissage pendant la phase Ready ; les autres phases relèvent de la méthodologie Secure." }
        d: { en: "The MCSB is a list of security controls and recommendations; it doesn't organize security across the phases of an adoption.", fr: "Le MCSB est une liste de contrôles et de recommandations de sécurité ; il n'organise pas la sécurité selon les phases d'une adoption." }
    references:
      - title: Secure Overview - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/secure/overview

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-13-02
    objective: "1.3.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. is deploying Azure landing zones by following the reference management group hierarchy of the Cloud Adoption Framework for Azure (CAF). The network team will deploy the hub resources shared by all the workloads: Azure Firewall, Azure Virtual WAN and the Azure DNS private zones.

        Where should you recommend deploying these resources?
      fr: |
        Fabrikam, Inc. déploie des zones d'atterrissage Azure en suivant la hiérarchie de groupes d'administration de référence du Cloud Adoption Framework pour Azure (CAF). L'équipe réseau va déployer les ressources du hub partagées par toutes les charges de travail : Pare-feu Azure, Azure Virtual WAN et les zones privées Azure DNS.

        Où devez-vous recommander de déployer ces ressources ?
    body:
      options:
        - { id: a, text: { en: "In a dedicated subscription of the Management management group, under Platform", fr: "Dans un abonnement dédié du groupe d'administration Management, sous Platform" } }
        - { id: b, text: { en: "In a dedicated subscription of the Connectivity management group, under Platform", fr: "Dans un abonnement dédié du groupe d'administration Connectivity, sous Platform" } }
        - { id: c, text: { en: "In a dedicated subscription of the Corp management group, under Landing zones", fr: "Dans un abonnement dédié du groupe d'administration Corp, sous Landing zones" } }
        - { id: d, text: { en: "In a dedicated subscription of the Security management group, under Platform", fr: "Dans un abonnement dédié du groupe d'administration Security, sous Platform" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In the reference hierarchy, the Connectivity management group under Platform contains a dedicated subscription for the shared networking resources: Azure Virtual WAN or the hub virtual network, Azure Firewall and the Azure DNS private zones. Keeping them in a platform subscription separates them from the workloads and lets the platform policies and roles apply to them.
        fr: |
          Dans la hiérarchie de référence, le groupe d'administration Connectivity sous Platform contient un abonnement dédié aux ressources réseau partagées : Azure Virtual WAN ou le réseau virtuel hub, Pare-feu Azure et les zones privées Azure DNS. Les placer dans un abonnement de plateforme les sépare des charges de travail et leur applique les stratégies et les rôles de la plateforme.
      options:
        a: { en: "The Management subscription hosts the management and monitoring resources, such as the Azure Monitor Logs workspace, not the hub network.", fr: "L'abonnement Management héberge les ressources de gestion et de surveillance, comme l'espace de travail des Journaux Azure Monitor, pas le réseau hub." }
        c: { en: "Corp holds the application landing zones that connect to the hub; the hub itself is a shared platform resource.", fr: "Corp contient les zones d'atterrissage d'application qui se connectent au hub ; le hub lui-même est une ressource de plateforme partagée." }
        d: { en: "The Security subscription hosts the SIEM tooling, such as Microsoft Sentinel and the syslog collectors, not the networking resources.", fr: "L'abonnement Security héberge l'outillage SIEM, comme Microsoft Sentinel et les collecteurs syslog, pas les ressources réseau." }
    references:
      - title: Management groups - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-13-03
    objective: "1.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. hosts its source code in Azure Repos. As part of its DevSecOps process, the security team wants developers to be alerted about known vulnerabilities in the open-source packages that the applications use, and wants the first-party code analyzed with CodeQL in the pipelines.

        Litware doesn't want to pay for capabilities that these requirements don't need.

        What should you recommend?
      fr: |
        Litware, Inc. héberge son code source dans Azure Repos. Dans le cadre de son processus DevSecOps, l'équipe de sécurité veut que les développeurs soient alertés des vulnérabilités connues des packages open source utilisés par les applications, et veut que le code interne soit analysé avec CodeQL dans les pipelines.

        Litware ne veut pas payer pour des fonctionnalités dont ces exigences n'ont pas besoin.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "GitHub Secret Protection for Azure DevOps on the repositories", fr: "GitHub Secret Protection for Azure DevOps sur les dépôts" } }
        - { id: b, text: { en: "GitHub Code Security for Azure DevOps on the repositories", fr: "GitHub Code Security for Azure DevOps sur les dépôts" } }
        - { id: c, text: { en: "Microsoft Defender for Containers on the production clusters", fr: "Microsoft Defender for Containers sur les clusters de production" } }
        - { id: d, text: { en: "Branch policies that require two reviewers on the main branch", fr: "Des stratégies de branche qui exigent deux réviseurs sur la branche principale" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          GitHub Advanced Security for Azure DevOps is sold as two products. GitHub Code Security for Azure DevOps includes dependency scanning, which alerts on vulnerable open-source packages, and CodeQL code scanning of first-party code; both run in the pipelines and cover the two requirements.
        fr: |
          GitHub Advanced Security for Azure DevOps est vendu sous la forme de deux produits. GitHub Code Security for Azure DevOps comprend l'analyse des dépendances, qui alerte sur les packages open source vulnérables, et l'analyse du code interne avec CodeQL ; les deux s'exécutent dans les pipelines et couvrent les deux exigences.
      options:
        a: { en: "Secret Protection provides push protection and secret scanning alerts; it includes neither dependency scanning nor CodeQL.", fr: "Secret Protection fournit la protection push et les alertes d'analyse des secrets ; il ne comprend ni l'analyse des dépendances ni CodeQL." }
        c: { en: "Defender for Containers protects container images and clusters; it doesn't analyze first-party source code in Azure Repos with CodeQL.", fr: "Defender for Containers protège les images conteneur et les clusters ; il n'analyse pas le code source interne d'Azure Repos avec CodeQL." }
        d: { en: "Peer review is a good practice, but reviewers don't automatically detect known vulnerabilities in dependencies.", fr: "La revue par les pairs est une bonne pratique, mais les réviseurs ne détectent pas automatiquement les vulnérabilités connues des dépendances." }
    references:
      - title: Configure GitHub Advanced Security for Azure DevOps features - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/security/configure-github-advanced-security-features

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-13-04
    objective: "1.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank uses Microsoft 365 E5. Business units have built agents in Microsoft Copilot Studio, partners provide other agents, and a few teams use agents built on other platforms.

        As part of its secure AI adoption strategy, the bank needs one registry of all these agents with their owner, usage and risk signals from Microsoft Defender, Microsoft Entra and Microsoft Purview. Administrators must be able to block a risky agent immediately while they investigate.

        What should you recommend?
      fr: |
        Woodgrove Bank utilise Microsoft 365 E5. Des unités métier ont créé des agents dans Microsoft Copilot Studio, des partenaires fournissent d'autres agents, et quelques équipes utilisent des agents créés sur d'autres plateformes.

        Dans le cadre de sa stratégie d'adoption sécurisée de l'IA, la banque a besoin d'un registre unique de tous ces agents, avec leur propriétaire, leur utilisation et les signaux de risque de Microsoft Defender, de Microsoft Entra et de Microsoft Purview. Les administrateurs doivent pouvoir bloquer immédiatement un agent à risque pendant leur investigation.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "AI security posture management in Microsoft Defender for Cloud", fr: "La gestion de la posture de sécurité de l'IA dans Microsoft Defender for Cloud" } }
        - { id: b, text: { en: "An Insider Risk Management policy from the Risky AI usage template", fr: "Une stratégie Insider Risk Management créée à partir du modèle Risky AI usage" } }
        - { id: c, text: { en: "An Azure Resource Graph query that lists the AI resources", fr: "Une requête Azure Resource Graph qui liste les ressources d'IA" } }
        - { id: d, text: { en: "The agent registry and controls of Microsoft Agent 365", fr: "Le registre des agents et les contrôles de Microsoft Agent 365" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Microsoft Agent 365 gives one view of the organization's agents, from Microsoft, partners and internal teams, including agents from connected platforms. Its registry shows the owner, usage and risk of each agent, with risk signals from Defender, Entra and Purview, and an administrator can block a risky agent immediately.
        fr: |
          Microsoft Agent 365 donne une vue unique des agents de l'organisation, qu'ils viennent de Microsoft, de partenaires ou d'équipes internes, y compris les agents des plateformes connectées. Son registre affiche le propriétaire, l'utilisation et le risque de chaque agent, avec les signaux de risque de Defender, d'Entra et de Purview, et un administrateur peut bloquer immédiatement un agent à risque.
      options:
        a: { en: "AI security posture management inventories AI workloads in Azure, AWS and GCP and their misconfigurations; it isn't a registry of Microsoft 365 and partner agents with a block control.", fr: "La gestion de la posture de sécurité de l'IA inventorie les charges de travail d'IA d'Azure, d'AWS et de GCP et leurs erreurs de configuration ; ce n'est pas un registre des agents Microsoft 365 et partenaires avec un contrôle de blocage." }
        b: { en: "The Risky AI usage template detects risky behavior of users with AI tools; it doesn't list agents or block them.", fr: "Le modèle Risky AI usage détecte les comportements à risque des utilisateurs avec les outils d'IA ; il ne liste pas les agents et ne les bloque pas." }
        c: { en: "Azure Resource Graph inventories Azure resources only; it can't see Copilot Studio or partner agents, or block one.", fr: "Azure Resource Graph inventorie uniquement les ressources Azure ; il ne voit pas les agents Copilot Studio ou partenaires et ne peut pas en bloquer un." }
    references:
      - title: Microsoft Agent 365 overview
        url: https://learn.microsoft.com/en-us/microsoft-agent-365/overview

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-13-05
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has 40 Azure subscriptions under a management group and adds new subscriptions every quarter. Workload teams create new key vaults every week. A new governance policy, written by following the Cloud Adoption Framework for Azure (CAF), requires every key vault to send its audit logs to the central Log Analytics workspace. About 120 key vaults already exist without this configuration.

        The policy must be enforced automatically on the existing and the future key vaults, with the least administrative effort.

        What should you recommend?
      fr: |
        Contoso, Ltd. dispose de 40 abonnements Azure sous un groupe d'administration et ajoute de nouveaux abonnements chaque trimestre. Les équipes des charges de travail créent de nouveaux coffres de clés chaque semaine. Une nouvelle stratégie de gouvernance, rédigée en suivant le Cloud Adoption Framework pour Azure (CAF), exige que chaque coffre de clés envoie ses journaux d'audit à l'espace de travail Log Analytics central. Environ 120 coffres de clés existent déjà sans cette configuration.

        La stratégie doit être appliquée automatiquement aux coffres de clés existants et futurs, avec un minimum d'effort administratif.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Assign a deny policy at the management group that blocks key vaults without diagnostic settings", fr: "Attribuer au groupe d'administration une stratégie deny qui bloque les coffres de clés sans paramètres de diagnostic" } }
        - { id: b, text: { en: "Assign a deployIfNotExists policy at the management group, then wait for the next compliance evaluation", fr: "Attribuer au groupe d'administration une stratégie deployIfNotExists, puis attendre la prochaine évaluation de conformité" } }
        - { id: c, text: { en: "Assign a deployIfNotExists policy to each of the 40 subscriptions, then create remediation tasks", fr: "Attribuer une stratégie deployIfNotExists à chacun des 40 abonnements, puis créer des tâches de correction" } }
        - { id: d, text: { en: "Assign a deployIfNotExists policy at the management group, then create a remediation task", fr: "Attribuer au groupe d'administration une stratégie deployIfNotExists, puis créer une tâche de correction" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A deployIfNotExists policy assigned at the management group configures the diagnostic settings of every new or updated key vault in all the subscriptions, including future ones. Resources that existed before the assignment are only flagged as non-compliant: a remediation task, run with the managed identity of the assignment, deploys the configuration on them.
        fr: |
          Une stratégie deployIfNotExists attribuée au groupe d'administration configure les paramètres de diagnostic de chaque coffre de clés nouveau ou mis à jour dans tous les abonnements, y compris les futurs. Les ressources qui existaient avant l'attribution sont seulement signalées comme non conformes : une tâche de correction, exécutée avec l'identité managée de l'attribution, y déploie la configuration.
      options:
        a: { en: "A deny effect only acts when a resource is created or updated; it never configures the 120 existing key vaults.", fr: "Un effet deny n'agit qu'à la création ou à la mise à jour d'une ressource ; il ne configure jamais les 120 coffres de clés existants." }
        b: { en: "A compliance evaluation only flags the 120 existing key vaults as non-compliant; without a remediation task, only new or updated key vaults are configured.", fr: "Une évaluation de conformité ne fait que signaler les 120 coffres de clés existants comme non conformes ; sans tâche de correction, seuls les coffres nouveaux ou mis à jour sont configurés." }
        c: { en: "Assignments on each subscription multiply the work and miss the subscriptions created later; one assignment at the management group is inherited by all of them.", fr: "Des attributions sur chaque abonnement multiplient le travail et manquent les abonnements créés plus tard ; une seule attribution au groupe d'administration est héritée par tous." }
    references:
      - title: Remediate non-compliant resources - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
      - title: Enforce cloud governance policies - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/enforce-cloud-governance-policies

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-13-06
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You are evaluating the incident preparedness and response of Tailspin Toys for its Azure workloads against the Secure methodology of the Cloud Adoption Framework for Azure (CAF). You find the following:

        - Runbooks define the roles, the communication channels and the decision authority, and the SOC runs tabletop simulations twice a year.
        - Microsoft Defender for Cloud alerts are routed to the SOC, where analysts assess their severity and assign them.
        - A playbook automatically isolates a compromised virtual machine.
        - After isolation, the virtual machine is restored from its latest backup, reconnected to production, and the incident is closed.

        The same attacker regained access twice in the last quarter, and the same weaknesses were exploited each time.

        Which two changes should you recommend? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous évaluez la préparation et la réponse aux incidents de Tailspin Toys pour ses charges de travail Azure par rapport à la méthodologie Secure du Cloud Adoption Framework pour Azure (CAF). Vous constatez ce qui suit :

        - Des runbooks définissent les rôles, les canaux de communication et l'autorité de décision, et le SOC organise des simulations sur table deux fois par an.
        - Les alertes de Microsoft Defender for Cloud sont acheminées vers le SOC, où les analystes évaluent leur gravité et les attribuent.
        - Un playbook isole automatiquement une machine virtuelle compromise.
        - Après l'isolement, la machine virtuelle est restaurée à partir de sa dernière sauvegarde, reconnectée à la production, puis l'incident est clôturé.

        Le même attaquant a regagné l'accès deux fois au cours du dernier trimestre, et les mêmes faiblesses ont été exploitées à chaque fois.

        Quelles sont les deux modifications que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Remove the attacker's access and persistence, such as stolen credentials and backdoors, before the recovery", fr: "Supprimer l'accès et la persistance de l'attaquant, comme les identifiants volés et les portes dérobées, avant la récupération" } }
        - { id: b, text: { en: "Require a manual approval for each isolation, so that the containment decisions stay with the analysts", fr: "Exiger une approbation manuelle pour chaque isolement, afin que les décisions de confinement restent aux analystes" } }
        - { id: c, text: { en: "Review each closed incident and turn the findings into changes to detections, policies and runbooks", fr: "Revoir chaque incident clôturé et transformer les constats en modifications des détections, des stratégies et des runbooks" } }
        - { id: d, text: { en: "Replace the tabletop simulations with a yearly penetration test performed by an external company", fr: "Remplacer les simulations sur table par un test d'intrusion annuel réalisé par une société externe" } }
        - { id: e, text: { en: "Lower the alert thresholds of the analytics so that more alerts reach the analysts for triage", fr: "Abaisser les seuils d'alerte des analyses afin que davantage d'alertes parviennent aux analystes pour le tri" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          CAF lists the stages of incident preparation and response as readiness, detection, triage, containment, eradication, recovery and post-incident learning. Tailspin goes from containment straight to recovery, so the attacker's foothold survives the restore (eradication is missing), and nothing is learned from closed incidents, so the same weaknesses stay open (post-incident learning is missing).
        fr: |
          Le CAF énumère les étapes de la préparation et de la réponse aux incidents : préparation, détection, tri, confinement, éradication, récupération et apprentissage post-incident. Tailspin passe directement du confinement à la récupération, si bien que l'implantation de l'attaquant survit à la restauration (l'éradication manque), et rien n'est tiré des incidents clôturés, si bien que les mêmes faiblesses restent ouvertes (l'apprentissage post-incident manque).
      options:
        b: { en: "CAF recommends automating containment actions such as isolating hosts; a manual approval slows containment and fixes neither gap.", fr: "Le CAF recommande d'automatiser les actions de confinement comme l'isolement des hôtes ; une approbation manuelle ralentit le confinement et ne comble aucune des deux lacunes." }
        d: { en: "CAF recommends practicing tabletop simulations; dropping them weakens readiness, which isn't the stage that fails here.", fr: "Le CAF recommande de pratiquer des simulations sur table ; les supprimer affaiblit la préparation, qui n'est pas l'étape défaillante ici." }
        e: { en: "CAF aims to improve alert fidelity and reduce false positives; more low-quality alerts don't stop the attacker from returning.", fr: "Le CAF vise à améliorer la fidélité des alertes et à réduire les faux positifs ; davantage d'alertes de faible qualité n'empêchent pas l'attaquant de revenir." }
    references:
      - title: Secure Overview - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/secure/overview

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-13-07
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders uses Azure landing zones. An initiative assigned to the Landing zones management group includes a policy that denies storage accounts with public network access.

        The marketing team has a subscription named Sub-Mkt in the Online management group. One storage account in Sub-Mkt must serve public downloads. The security team accepts the risk for this storage account only, for six months, and wants the exception documented. All the other storage accounts of Sub-Mkt and of the other subscriptions, current and future, must stay subject to the policy, and Sub-Mkt must keep the other policies of the initiative.

        You need to recommend a solution that follows the Cloud Adoption Framework for Azure (CAF) and minimizes administrative effort.

        What should you recommend?
      fr: |
        Northwind Traders utilise des zones d'atterrissage Azure. Une initiative attribuée au groupe d'administration Landing zones comprend une stratégie qui refuse les comptes de stockage dont l'accès réseau public est activé.

        L'équipe marketing dispose d'un abonnement nommé Sub-Mkt dans le groupe d'administration Online. Un compte de stockage de Sub-Mkt doit servir des téléchargements publics. L'équipe de sécurité accepte le risque pour ce compte de stockage uniquement, pendant six mois, et veut que l'exception soit documentée. Tous les autres comptes de stockage de Sub-Mkt et des autres abonnements, actuels et futurs, doivent rester soumis à la stratégie, et Sub-Mkt doit conserver les autres stratégies de l'initiative.

        Vous devez recommander une solution qui suit le Cloud Adoption Framework pour Azure (CAF) et réduit au minimum l'effort administratif.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Move Sub-Mkt to the Sandbox management group, where the policies are less restrictive", fr: "Déplacer Sub-Mkt vers le groupe d'administration Sandbox, où les stratégies sont moins restrictives" } }
        - { id: b, text: { en: "Add Sub-Mkt to the excluded scopes of the initiative assignment on the Landing zones group", fr: "Ajouter Sub-Mkt aux étendues exclues de l'attribution de l'initiative sur le groupe Landing zones" } }
        - { id: c, text: { en: "Create a policy exemption for this storage account, scoped to the policy, with an expiration date", fr: "Créer une exemption de stratégie pour ce compte de stockage, limitée à la stratégie, avec une date d'expiration" } }
        - { id: d, text: { en: "Change the effect of the policy from Deny to Audit in the initiative assigned to Landing zones", fr: "Remplacer l'effet Deny de la stratégie par Audit dans l'initiative attribuée à Landing zones" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A policy exemption can target a single resource and a single policy of an initiative, records a category and a description of the accepted risk, and can expire automatically. The storage account is excluded from that one policy for six months, while the rest of Sub-Mkt and every other subscription stay governed by the inherited initiative, which is the narrow, documented exception that CAF governance expects.
        fr: |
          Une exemption de stratégie peut cibler une seule ressource et une seule stratégie d'une initiative, enregistre une catégorie et une description du risque accepté, et peut expirer automatiquement. Le compte de stockage est exclu de cette seule stratégie pendant six mois, tandis que le reste de Sub-Mkt et tous les autres abonnements restent gouvernés par l'initiative héritée : c'est l'exception étroite et documentée qu'attend la gouvernance du CAF.
      options:
        a: { en: "Sandbox is for experiments isolated from production; moving Sub-Mkt there removes all the landing zone policies, not just one, for every storage account.", fr: "Sandbox sert aux expérimentations isolées de la production ; y déplacer Sub-Mkt retire toutes les stratégies de la zone d'atterrissage, pas une seule, pour tous les comptes de stockage." }
        b: { en: "An excluded scope removes the whole subscription from every policy of the initiative, so the other storage accounts and policies of Sub-Mkt are no longer enforced.", fr: "Une étendue exclue retire tout l'abonnement de toutes les stratégies de l'initiative : les autres comptes de stockage et les autres stratégies de Sub-Mkt ne sont plus appliqués." }
        d: { en: "Audit removes the protection from every storage account under Landing zones, current and future, to allow one exception.", fr: "Audit retire la protection de tous les comptes de stockage sous Landing zones, actuels et futurs, pour permettre une seule exception." }
    references:
      - title: Details of the policy exemption structure - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-13-08
    objective: "1.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware, Inc. runs a web app on Azure App Service that connects to Azure SQL Database with a SQL login. The password is stored in a configuration file of the GitHub repository. The app is deployed by a GitHub Actions workflow that already uses OpenID Connect federation to authenticate to Azure.

        During a DevSecOps review, the security team requires that the database credential be eliminated, so that no secret exists to store, rotate or leak. The solution must follow the Cloud Adoption Framework for Azure (CAF) DevSecOps guidance and minimize the effort to operate.

        What should you recommend?
      fr: |
        Proseware, Inc. exécute une application web sur Azure App Service qui se connecte à Azure SQL Database avec une connexion SQL. Le mot de passe est stocké dans un fichier de configuration du dépôt GitHub. L'application est déployée par un workflow GitHub Actions qui utilise déjà la fédération OpenID Connect pour s'authentifier auprès d'Azure.

        Lors d'une revue DevSecOps, l'équipe de sécurité exige la suppression de l'identifiant de la base de données, afin qu'aucun secret n'existe à stocker, à faire pivoter ou à divulguer. La solution doit suivre les recommandations DevSecOps du Cloud Adoption Framework pour Azure (CAF) et réduire au minimum l'effort d'exploitation.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Store the password in Azure Key Vault and reference it from the app settings", fr: "Stocker le mot de passe dans Azure Key Vault et le référencer depuis les paramètres de l'application" } }
        - { id: b, text: { en: "Enable secret scanning with push protection on the GitHub repository", fr: "Activer l'analyse des secrets avec la protection push sur le dépôt GitHub" } }
        - { id: c, text: { en: "Add a federated credential for the database connection to the workflow", fr: "Ajouter au workflow des informations d'identification fédérées pour la connexion à la base de données" } }
        - { id: d, text: { en: "Give the web app a managed identity that uses Microsoft Entra authentication to the database", fr: "Donner à l'application web une identité managée qui utilise l'authentification Microsoft Entra auprès de la base de données" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A managed identity gives the web app a Microsoft Entra identity whose credentials Azure manages; with Microsoft Entra authentication to Azure SQL Database, the app connects without any password. No secret exists anymore, so nothing has to be stored, rotated or protected from a leak, which is the long-term fix that the DevSecOps guidance prefers to secret handling.
        fr: |
          Une identité managée donne à l'application web une identité Microsoft Entra dont Azure gère les informations d'identification ; avec l'authentification Microsoft Entra auprès d'Azure SQL Database, l'application se connecte sans aucun mot de passe. Il n'existe plus de secret, donc plus rien à stocker, à faire pivoter ou à protéger contre une fuite : c'est la solution durable que les recommandations DevSecOps préfèrent à la gestion des secrets.
      options:
        a: { en: "Key Vault removes the password from the repository, but the secret still exists and must still be rotated and protected.", fr: "Key Vault retire le mot de passe du dépôt, mais le secret existe toujours et doit toujours être renouvelé et protégé." }
        b: { en: "Push protection blocks new secrets at push time, and secret scanning finds existing ones; the database password still exists.", fr: "La protection push bloque les nouveaux secrets au moment du push, et l'analyse des secrets trouve ceux qui existent ; le mot de passe de la base de données existe toujours." }
        c: { en: "The OIDC federation authenticates the workflow to Azure during deployment; the app's runtime connection to the database doesn't run in the workflow.", fr: "La fédération OIDC authentifie le workflow auprès d'Azure pendant le déploiement ; la connexion de l'application à la base de données à l'exécution ne passe pas par le workflow." }
    references:
      - title: Managed Identities - Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-managed-identity

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-13-09
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Wingtip Toys uses the reference management group hierarchy of Azure landing zones: an intermediate root named Wingtip, with Platform (Management, Connectivity, Identity and Security) and Landing zones (Corp and Online) below it. The Management subscription hosts the central Log Analytics workspace. Subscriptions are created every month in all these management groups.

        The security design must meet the following requirements:

        - Microsoft Defender for Cloud must be enabled on every subscription, platform and workload, current and future, and must stay enabled.
        - The Azure activity log of every subscription must be collected in the central workspace.

        The solution must follow the management group recommendations of the Cloud Adoption Framework for Azure (CAF) and minimize the number of assignments.

        Which two actions should you recommend? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys utilise la hiérarchie de groupes d'administration de référence des zones d'atterrissage Azure : une racine intermédiaire nommée Wingtip, avec Platform (Management, Connectivity, Identity et Security) et Landing zones (Corp et Online) en dessous. L'abonnement Management héberge l'espace de travail Log Analytics central. Des abonnements sont créés chaque mois dans tous ces groupes d'administration.

        La conception de la sécurité doit répondre aux exigences suivantes :

        - Microsoft Defender for Cloud doit être activé sur chaque abonnement, de plateforme et de charge de travail, actuel et futur, et doit le rester.
        - Le journal d'activité Azure de chaque abonnement doit être collecté dans l'espace de travail central.

        La solution doit suivre les recommandations du Cloud Adoption Framework pour Azure (CAF) sur les groupes d'administration et réduire au minimum le nombre d'attributions.

        Quelles sont les deux actions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Assign a deployIfNotExists policy that enables the Defender for Cloud plans at the Landing zones management group", fr: "Attribuer au groupe d'administration Landing zones une stratégie deployIfNotExists qui active les plans Defender for Cloud" } }
        - { id: b, text: { en: "Assign a deployIfNotExists policy that enables the Defender for Cloud plans at the Wingtip management group", fr: "Attribuer au groupe d'administration Wingtip une stratégie deployIfNotExists qui active les plans Defender for Cloud" } }
        - { id: c, text: { en: "Assign a deployIfNotExists policy that sends the activity log to the central workspace at the tenant root group", fr: "Attribuer au groupe racine du locataire une stratégie deployIfNotExists qui envoie le journal d'activité à l'espace de travail central" } }
        - { id: d, text: { en: "Assign a deployIfNotExists policy that sends the activity log to the central workspace at the Wingtip management group", fr: "Attribuer au groupe d'administration Wingtip une stratégie deployIfNotExists qui envoie le journal d'activité à l'espace de travail central" } }
        - { id: e, text: { en: "Apply a ReadOnly lock to the Wingtip management group so that nobody can disable the Defender for Cloud plans", fr: "Appliquer un verrou ReadOnly au groupe d'administration Wingtip pour que personne ne puisse désactiver les plans Defender for Cloud" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The security design area recommends enabling Defender for Cloud on all subscriptions and using Azure Policy to keep them compliant, and collecting the activity log centrally. Policies that apply to the whole organization belong at the intermediate root (Wingtip): one assignment for each requirement is inherited by every platform and workload subscription, including future ones, and deployIfNotExists configures them.
        fr: |
          La zone de conception sécurité recommande d'activer Defender for Cloud sur tous les abonnements et d'utiliser Azure Policy pour les maintenir conformes, et de collecter le journal d'activité de façon centralisée. Les stratégies qui s'appliquent à toute l'organisation se placent à la racine intermédiaire (Wingtip) : une attribution par exigence est héritée par chaque abonnement de plateforme et de charge de travail, y compris les futurs, et deployIfNotExists les configure.
      options:
        a: { en: "Landing zones doesn't contain the Platform subscriptions, so Defender for Cloud wouldn't be enforced on the management, connectivity, identity and security subscriptions.", fr: "Landing zones ne contient pas les abonnements de Platform : Defender for Cloud ne serait pas imposé aux abonnements de gestion, de connectivité, d'identité et de sécurité." }
        c: { en: "CAF recommends limiting assignments at the tenant root group and using the intermediate root for organization-wide policies.", fr: "Le CAF recommande de limiter les attributions au groupe racine du locataire et d'utiliser la racine intermédiaire pour les stratégies de toute l'organisation." }
        e: { en: "Resource locks can't be applied to a management group; Azure Policy is the control that the hierarchy propagates.", fr: "Les verrous de ressources ne s'appliquent pas à un groupe d'administration ; Azure Policy est le contrôle que la hiérarchie propage." }
    references:
      - title: Security design in Azure - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/security
      - title: Management groups - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-13-10
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso, Ltd. builds generative AI applications in Azure and is writing its secure AI adoption strategy based on the Secure AI guidance of the Cloud Adoption Framework for Azure (CAF). The guidance organizes the recommendations in three parts. The CISO lists four planned activities.

        To which part of the Secure AI guidance does each activity belong? To answer, drag the appropriate parts to the correct activities. Each part may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. crée des applications d'IA générative dans Azure et rédige sa stratégie d'adoption sécurisée de l'IA en s'appuyant sur les recommandations Secure AI du Cloud Adoption Framework pour Azure (CAF). Ces recommandations s'organisent en trois parties. Le RSSI liste quatre activités prévues.

        À quelle partie des recommandations Secure AI chaque activité appartient-elle ? Pour répondre, faites glisser les parties appropriées vers les activités correspondantes. Chaque partie peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: discover, text: { en: "Discover AI security risks", fr: "Découvrir les risques de sécurité de l'IA" } }
        - { id: protect, text: { en: "Protect AI resources and data", fr: "Protéger les ressources et les données d'IA" } }
        - { id: detect, text: { en: "Detect AI security threats", fr: "Détecter les menaces de sécurité de l'IA" } }
      targets:
        - id: t1
          text: { en: "Build a complete inventory of the AI workloads and models with Azure Resource Graph and Defender for Cloud AI security posture management", fr: "Construire un inventaire complet des charges de travail et des modèles d'IA avec Azure Resource Graph et la gestion de la posture de sécurité de l'IA de Defender for Cloud" }
        - id: t2
          text: { en: "Use Microsoft Purview Insider Risk Management to assess enterprise data risk, prioritized by data sensitivity", fr: "Utiliser Microsoft Purview Insider Risk Management pour évaluer le risque sur les données de l'entreprise, priorisé selon la sensibilité des données" }
        - id: t3
          text: { en: "Automate the detection and remediation of generative AI risks with Defender for Cloud AI security posture management", fr: "Automatiser la détection et la correction des risques de l'IA générative avec la gestion de la posture de sécurité de l'IA de Defender for Cloud" }
        - id: t4
          text: { en: "Red team the generative and nongenerative models for data leakage, prompt injection and model inversion", fr: "Pratiquer le red teaming des modèles génératifs et non génératifs contre la fuite de données, l'injection de prompts et l'inversion de modèle" }
    answer:
      mapping: { t1: protect, t2: discover, t3: detect, t4: discover }
    explanation:
      correct:
        en: |
          The Secure AI guidance places the AI asset inventory (Azure Resource Graph and AI security posture management) in Protect AI resources and data, because you can't protect what you don't know. Assessing data risk with Insider Risk Management and testing models through red teaming belong to Discover AI security risks. Automated detection and remediation of generative AI risks with AI security posture management belongs to Detect AI security threats: the same product serves two parts.
        fr: |
          Les recommandations Secure AI placent l'inventaire des ressources d'IA (Azure Resource Graph et gestion de la posture de sécurité de l'IA) dans Protéger les ressources et les données d'IA, car on ne protège pas ce qu'on ne connaît pas. L'évaluation du risque sur les données avec Insider Risk Management et le test des modèles par red teaming relèvent de Découvrir les risques de sécurité de l'IA. La détection et la correction automatisées des risques de l'IA générative avec la gestion de la posture de sécurité de l'IA relèvent de Détecter les menaces de sécurité de l'IA : le même produit sert deux parties.
      options:
        t1: { en: "The inventory sounds like discovery, but CAF lists it as the first step of protecting AI resources.", fr: "L'inventaire ressemble à de la découverte, mais le CAF le présente comme la première étape de la protection des ressources d'IA." }
        t2: { en: "Insider Risk Management can detect risky behavior, but here it is used to assess and prioritize data risk, which is a Discover activity.", fr: "Insider Risk Management peut détecter des comportements à risque, mais il sert ici à évaluer et prioriser le risque sur les données, une activité de la partie Découvrir." }
    references:
      - title: Secure AI - Guidance to set up your organization's AI security process - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ai/secure
