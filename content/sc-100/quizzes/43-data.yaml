chapter: 43-data
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-43-01
    objective: "4.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. uses Microsoft Purview data loss prevention (DLP), Insider Risk Management and sensitivity labels. Each solution has its own reports, and the security team can't tell which sensitive data is most at risk.

        The CISO wants one place that consolidates the insights of these solutions, finds sensitive data that is overshared or unprotected, and suggests prioritized actions such as applying labels or DLP policies.

        What should you recommend?
      fr: |
        Contoso, Ltd. utilise la protection contre la perte de données (DLP) de Microsoft Purview, Insider Risk Management et des étiquettes de confidentialité. Chaque solution a ses propres rapports, et l'équipe de sécurité ne sait pas quelles données sensibles sont les plus exposées.

        Le RSSI veut un endroit unique qui regroupe les informations de ces solutions, trouve les données sensibles surpartagées ou non protégées et suggère des actions hiérarchisées, comme appliquer des étiquettes ou des stratégies DLP.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Microsoft Purview Data Map scans of the data sources", fr: "Des analyses des sources de données par le Data Map de Microsoft Purview" } }
        - { id: b, text: { en: "Microsoft Purview Data Security Posture Management", fr: "Data Security Posture Management de Microsoft Purview" } }
        - { id: c, text: { en: "Sensitive data discovery in Defender CSPM", fr: "La découverte des données sensibles de Defender CSPM" } }
        - { id: d, text: { en: "Microsoft Purview Compliance Manager assessments", fr: "Des évaluations Microsoft Purview Compliance Manager" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Purview Data Security Posture Management (DSPM) consolidates insights from DLP, Insider Risk Management, information protection and Data Security Investigations. It scans for sensitive data, assesses risks such as oversharing and suggests prioritized actions, such as applying sensitivity labels or DLP policies.
        fr: |
          Data Security Posture Management (DSPM) de Purview regroupe les informations de DLP, d'Insider Risk Management, de la protection des informations et de Data Security Investigations. Il recherche les données sensibles, évalue des risques comme le surpartage et suggère des actions hiérarchisées, comme appliquer des étiquettes de confidentialité ou des stratégies DLP.
      options:
        a: { en: "The Data Map scans, classifies and catalogs data sources; it doesn't combine DLP and insider risk signals into prioritized actions.", fr: "Le Data Map analyse, classe et catalogue les sources de données ; il ne combine pas les signaux DLP et de risque interne en actions hiérarchisées." }
        c: { en: "Defender CSPM adds data sensitivity to cloud posture and attack paths; it doesn't use the DLP and insider risk insights.", fr: "Defender CSPM ajoute la sensibilité des données à la posture cloud et aux chemins d'attaque ; il n'utilise pas les informations de DLP et de risque interne." }
        d: { en: "Compliance Manager scores the implementation of regulatory controls; it doesn't analyze where sensitive data is at risk.", fr: "Compliance Manager évalue la mise en œuvre des contrôles réglementaires ; il n'analyse pas où les données sensibles sont exposées." }
    references:
      - title: Learn about Microsoft Purview Data Security Posture Management (DSPM)
        url: https://learn.microsoft.com/en-us/purview/data-security-posture-management-learn-about

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-43-02
    objective: "4.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. is moving its customer files and databases to Azure Storage and Azure SQL Database. The regulator requires the data to be encrypted at rest with AES-256.

        Fabrikam has no requirement to control, rotate or revoke the encryption keys, and the solution must minimize administrative effort.

        What should you recommend?
      fr: |
        Fabrikam, Inc. migre ses fichiers clients et ses bases de données vers Stockage Azure et Azure SQL Database. Le régulateur exige que les données soient chiffrées au repos avec AES-256.

        Fabrikam n'a aucune exigence de contrôle, de renouvellement ou de révocation des clés de chiffrement, et la solution doit réduire au minimum l'effort d'administration.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Customer-managed keys stored in an Azure Key Vault Premium vault", fr: "Des clés gérées par le client stockées dans un coffre Azure Key Vault Premium" } }
        - { id: b, text: { en: "Infrastructure encryption enabled on every new storage account", fr: "Le chiffrement d'infrastructure activé sur chaque nouveau compte de stockage" } }
        - { id: c, text: { en: "The default encryption at rest with Microsoft-managed keys", fr: "Le chiffrement au repos par défaut avec des clés gérées par Microsoft" } }
        - { id: d, text: { en: "Always Encrypted on every column of the SQL databases", fr: "Always Encrypted sur chaque colonne des bases de données SQL" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Storage and Azure SQL Database encrypt data at rest by default with AES-256, using keys that Microsoft manages. Nothing has to be configured or operated, which meets the requirement with the least effort when no key control is needed.
        fr: |
          Stockage Azure et Azure SQL Database chiffrent les données au repos par défaut avec AES-256, à l'aide de clés que Microsoft gère. Rien n'est à configurer ni à exploiter, ce qui répond à l'exigence avec le moins d'effort quand aucun contrôle des clés n'est nécessaire.
      options:
        a: { en: "Customer-managed keys add a key vault, permissions and rotation to operate; they answer a need for key control that Fabrikam doesn't have.", fr: "Les clés gérées par le client ajoutent un coffre, des autorisations et un renouvellement à exploiter ; elles répondent à un besoin de contrôle des clés que Fabrikam n'a pas." }
        b: { en: "Infrastructure encryption is a second layer for regulations that require double encryption; it isn't needed for encryption at rest.", fr: "Le chiffrement d'infrastructure est une deuxième couche pour les réglementations qui exigent un double chiffrement ; il n'est pas nécessaire pour le chiffrement au repos." }
        d: { en: "Always Encrypted is client-side encryption of selected columns, with keys to manage and query limitations.", fr: "Always Encrypted est un chiffrement côté client de certaines colonnes, avec des clés à gérer et des limites sur les requêtes." }
    references:
      - title: Enable infrastructure encryption for double encryption of data
        url: https://learn.microsoft.com/en-us/azure/storage/common/infrastructure-encryption-enable
      - title: Customer-managed keys for Azure Storage encryption
        url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-43-03
    objective: "4.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys protects its Azure virtual machines and databases with Azure Backup in a Backup vault. A threat assessment rates the following risk as high: an attacker who compromises a backup administrator account disables soft delete and deletes the backup data before encrypting the production servers.

        Tailspin's security team is separate from its backup team. Destructive operations on the vault must be blocked unless a member of the security team authorizes them.

        What should you recommend?
      fr: |
        Tailspin Toys protège ses machines virtuelles et ses bases de données Azure avec Sauvegarde Azure dans un coffre de sauvegarde. Une évaluation des menaces classe le risque suivant comme élevé : un attaquant qui compromet un compte d'administrateur de sauvegarde désactive la suppression réversible et supprime les données de sauvegarde avant de chiffrer les serveurs de production.

        L'équipe de sécurité de Tailspin est distincte de son équipe de sauvegarde. Les opérations destructrices sur le coffre doivent être bloquées tant qu'un membre de l'équipe de sécurité ne les a pas autorisées.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Send the vault's diagnostic logs to Microsoft Sentinel, with a rule that alerts on deletions", fr: "Envoyer les journaux de diagnostic du coffre vers Microsoft Sentinel, avec une règle qui alerte sur les suppressions" } }
        - { id: b, text: { en: "Encrypt the vault with a customer-managed key that the security team owns in Key Vault", fr: "Chiffrer le coffre avec une clé gérée par le client que l'équipe de sécurité possède dans Key Vault" } }
        - { id: c, text: { en: "Enable multi-user authorization with a Resource Guard that the security team owns", fr: "Activer l'autorisation multi-utilisateur avec un Resource Guard que l'équipe de sécurité possède" } }
        - { id: d, text: { en: "Enable cross-region restore so that a copy of the backups exists in the paired region", fr: "Activer la restauration interrégion pour qu'une copie des sauvegardes existe dans la région jumelée" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Multi-user authorization adds Resource Guard as a second authorization check: disabling soft delete is always protected, and deleting backup data or reducing retention can be protected too. The backup administrator needs a role on the Resource Guard, granted temporarily by the security administrator, so a single compromised account can't destroy the backups.
        fr: |
          L'autorisation multi-utilisateur ajoute Resource Guard comme seconde vérification d'autorisation : la désactivation de la suppression réversible est toujours protégée, et la suppression des données de sauvegarde ou la réduction de la rétention peuvent l'être aussi. L'administrateur de sauvegarde a besoin d'un rôle sur le Resource Guard, accordé temporairement par l'administrateur de sécurité : un seul compte compromis ne peut donc pas détruire les sauvegardes.
      options:
        a: { en: "An alert reports the deletion after it happens; it doesn't block the operation.", fr: "Une alerte signale la suppression après coup ; elle ne bloque pas l'opération." }
        b: { en: "A customer-managed key protects the confidentiality of backup data; it doesn't stop an administrator from deleting it.", fr: "Une clé gérée par le client protège la confidentialité des données de sauvegarde ; elle n'empêche pas un administrateur de les supprimer." }
        d: { en: "Cross-region restore addresses a regional outage; the same administrator can still disable protections and delete data.", fr: "La restauration interrégion répond à une panne régionale ; le même administrateur peut encore désactiver les protections et supprimer les données." }
    references:
      - title: Multiuser authorization using Resource Guard
        url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-43-04
    objective: "4.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation has Microsoft 365 E5. All employee devices run Windows 11 and are onboarded to Microsoft Purview. An investigation found that employees paste customer credit card numbers into third-party generative AI websites in their browsers.

        Employees must keep using these websites, but they must be warned or blocked when they try to share credit card numbers with them.

        What should you recommend?
      fr: |
        Adatum Corporation dispose de Microsoft 365 E5. Tous les appareils des employés exécutent Windows 11 et sont intégrés à Microsoft Purview. Une enquête a montré que des employés collent des numéros de carte bancaire de clients dans des sites web d'IA générative tiers, depuis leur navigateur.

        Les employés doivent pouvoir continuer à utiliser ces sites, mais ils doivent être avertis ou bloqués quand ils essaient d'y partager des numéros de carte bancaire.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Threat protection for AI services in Microsoft Defender for Cloud", fr: "La protection contre les menaces pour les services d'IA de Microsoft Defender for Cloud" } }
        - { id: b, text: { en: "Prompt shields configured as guardrails in Microsoft Foundry", fr: "Des prompt shields configurés comme garde-fous dans Microsoft Foundry" } }
        - { id: c, text: { en: "AI security posture management in Defender CSPM", fr: "La gestion de la posture de sécurité de l'IA de Defender CSPM" } }
        - { id: d, text: { en: "A Microsoft Purview Endpoint DLP policy for these sites", fr: "Une stratégie DLP de point de terminaison Microsoft Purview pour ces sites" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Endpoint DLP policies on Windows devices onboarded to Purview can warn or block users who share sensitive information, such as credit card numbers, with third-party generative AI sites accessed through a browser. Users keep access to the sites, and only the sensitive content is controlled.
        fr: |
          Les stratégies DLP de point de terminaison sur les appareils Windows intégrés à Purview peuvent avertir ou bloquer les utilisateurs qui partagent des informations sensibles, comme des numéros de carte bancaire, avec des sites d'IA générative tiers ouverts dans un navigateur. Les utilisateurs gardent l'accès aux sites, et seul le contenu sensible est contrôlé.
      options:
        a: { en: "Threat protection for AI services watches the organization's own Azure AI resources, not third-party websites.", fr: "La protection contre les menaces pour les services d'IA surveille les ressources Azure AI de l'organisation, pas les sites web tiers." }
        b: { en: "Prompt shields apply to the model deployments of Adatum's own Foundry resources, not to external AI sites.", fr: "Les prompt shields s'appliquent aux déploiements de modèles des ressources Foundry d'Adatum, pas aux sites d'IA externes." }
        c: { en: "AI security posture management inventories and assesses Adatum's cloud AI workloads; it doesn't control what users paste.", fr: "La gestion de la posture de sécurité de l'IA inventorie et évalue les charges de travail d'IA cloud d'Adatum ; elle ne contrôle pas ce que collent les utilisateurs." }
    references:
      - title: Microsoft Purview data security and compliance protections for generative AI apps
        url: https://learn.microsoft.com/en-us/purview/ai-microsoft-purview

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-43-05
    objective: "4.3.6"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders stores contracts and order files as block blobs in a general-purpose v2 storage account named stlegal. You are designing the data protection of stlegal.

        Which feature meets each requirement? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders stocke des contrats et des fichiers de commandes sous forme d'objets blob de blocs dans un compte de stockage v2 universel nommé stlegal. Vous concevez la protection des données de stlegal.

        Quelle fonctionnalité répond à chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          A faulty batch job overwrote thousands of order files across several containers yesterday. Return those containers to their state before the job ran: [[pitr]]

          An administrator who deletes a container by mistake must be able to recover it for 14 days: [[container]]

          The contracts linked to a lawsuit must not be modified or deleted until the legal team ends the case, whose duration is unknown: [[lawsuit]]
        fr: |
          Une tâche par lots défectueuse a écrasé hier des milliers de fichiers de commandes dans plusieurs conteneurs. Ramener ces conteneurs à leur état d'avant l'exécution de la tâche : [[pitr]]

          Un administrateur qui supprime un conteneur par erreur doit pouvoir le récupérer pendant 14 jours : [[container]]

          Les contrats liés à un procès ne doivent être ni modifiés ni supprimés tant que l'équipe juridique n'a pas clos l'affaire, dont la durée est inconnue : [[lawsuit]]
      slots:
        - id: pitr
          options:
            - { id: pitr, text: { en: "Point-in-time restore for block blobs", fr: "La restauration à un point dans le temps des objets blob de blocs" } }
            - { id: csd, text: { en: "Container soft delete", fr: "La suppression réversible des conteneurs" } }
            - { id: hold, text: { en: "A legal hold", fr: "Une conservation légale" } }
            - { id: lifecycle, text: { en: "A lifecycle management policy", fr: "Une stratégie de gestion du cycle de vie" } }
        - id: container
          options:
            - { id: pitr, text: { en: "Point-in-time restore for block blobs", fr: "La restauration à un point dans le temps des objets blob de blocs" } }
            - { id: csd, text: { en: "Container soft delete", fr: "La suppression réversible des conteneurs" } }
            - { id: hold, text: { en: "A legal hold", fr: "Une conservation légale" } }
            - { id: lifecycle, text: { en: "A lifecycle management policy", fr: "Une stratégie de gestion du cycle de vie" } }
        - id: lawsuit
          options:
            - { id: hold, text: { en: "A legal hold", fr: "Une conservation légale" } }
            - { id: tbr, text: { en: "A locked time-based retention policy", fr: "Une stratégie de rétention limitée dans le temps verrouillée" } }
            - { id: csd, text: { en: "Container soft delete", fr: "La suppression réversible des conteneurs" } }
            - { id: lock, text: { en: "A CanNotDelete lock on stlegal", fr: "Un verrou CanNotDelete sur stlegal" } }
    answer:
      values: { pitr: pitr, container: csd, lawsuit: hold }
    explanation:
      correct:
        en: |
          Point-in-time restore returns block blobs in one or more containers to an earlier state; it needs blob soft delete, change feed and versioning. It doesn't restore deleted containers, which is the job of container soft delete. A legal hold keeps data immutable until it's explicitly cleared, for cases where the retention period is unknown.
        fr: |
          La restauration à un point dans le temps ramène les objets blob de blocs d'un ou de plusieurs conteneurs à un état antérieur ; elle nécessite la suppression réversible des objets blob, le flux de modification et le contrôle de version. Elle ne restaure pas les conteneurs supprimés, ce qui est le rôle de la suppression réversible des conteneurs. Une conservation légale garde les données immuables jusqu'à sa levée explicite, quand la période de rétention est inconnue.
      options:
        lifecycle: { en: "Lifecycle management moves or deletes data by age; it doesn't restore or protect it.", fr: "La gestion du cycle de vie déplace ou supprime des données selon leur âge ; elle ne les restaure ni ne les protège." }
        tbr: { en: "A time-based retention policy needs a fixed interval, which the unknown duration of the case doesn't allow.", fr: "Une stratégie de rétention limitée dans le temps exige un intervalle fixe, ce que la durée inconnue de l'affaire ne permet pas." }
        lock: { en: "A resource lock protects the storage account resource, not the blobs from being overwritten or deleted.", fr: "Un verrou de ressource protège la ressource du compte de stockage, pas les objets blob contre l'écrasement ou la suppression." }
    references:
      - title: Point-in-time restore for block blobs
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/point-in-time-restore-overview
      - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-43-06
    objective: "4.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank stores trade settlement records in Azure SQL Database. The settlement application inserts and updates records, and SQL auditing already sends its logs to a Log Analytics workspace.

        A new regulation adds the following requirements:

        - The bank must give auditors cryptographic proof that the records weren't changed outside the application, including by database administrators and cloud administrators.
        - Every earlier version of a record must stay queryable with SQL.
        - The application code must not change.

        What should you recommend?
      fr: |
        Woodgrove Bank stocke ses enregistrements de règlement des transactions dans Azure SQL Database. L'application de règlement insère et met à jour des enregistrements, et l'audit SQL envoie déjà ses journaux vers un espace de travail Log Analytics.

        Une nouvelle réglementation ajoute les exigences suivantes :

        - La banque doit fournir aux auditeurs une preuve cryptographique que les enregistrements n'ont pas été modifiés en dehors de l'application, y compris par les administrateurs de bases de données et les administrateurs cloud.
        - Chaque version antérieure d'un enregistrement doit rester interrogeable en SQL.
        - Le code de l'application ne doit pas changer.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Convert the tables to append-only ledger tables, and store the database digests in immutable storage", fr: "Convertir les tables en tables de registre en ajout uniquement, et stocker les condensés de la base dans un stockage immuable" } }
        - { id: b, text: { en: "Convert the tables to updatable ledger tables, and store the database digests in immutable storage", fr: "Convertir les tables en tables de registre modifiables, et stocker les condensés de la base dans un stockage immuable" } }
        - { id: c, text: { en: "Convert the tables to temporal tables, and keep their history tables for the retention period", fr: "Convertir les tables en tables temporelles, et conserver leurs tables d'historique pendant la période de rétention" } }
        - { id: d, text: { en: "Send the SQL audit logs to a storage account that has a locked time-based retention policy", fr: "Envoyer les journaux d'audit SQL vers un compte de stockage qui a une stratégie de rétention limitée dans le temps verrouillée" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Ledger makes data tamper evident: changed rows are hashed and chained into blocks, and the database digests stored outside the database, for example in immutable Blob Storage, let auditors verify that nobody, including DBAs and cloud administrators, altered the data. Updatable ledger tables allow inserts and updates, keep previous row versions in a history table that SQL can query, and need no application change.
        fr: |
          Le registre (ledger) rend toute falsification détectable : les lignes modifiées sont hachées et chaînées en blocs, et les condensés de la base stockés hors de celle-ci, par exemple dans un stockage Blob immuable, permettent aux auditeurs de vérifier que personne, y compris les administrateurs de bases de données et les administrateurs cloud, n'a modifié les données. Les tables de registre modifiables autorisent les insertions et les mises à jour, conservent les versions antérieures des lignes dans une table d'historique interrogeable en SQL et ne nécessitent aucune modification de l'application.
      options:
        a: { en: "Append-only ledger tables block updates, so the application, which updates records, would break.", fr: "Les tables de registre en ajout uniquement bloquent les mises à jour : l'application, qui met à jour des enregistrements, ne fonctionnerait plus." }
        c: { en: "Temporal tables keep history but give no cryptographic proof: a privileged user can alter the current and history rows unnoticed.", fr: "Les tables temporelles conservent l'historique mais ne donnent aucune preuve cryptographique : un utilisateur privilégié peut modifier les lignes actuelles et l'historique sans être détecté." }
        d: { en: "Immutable audit logs record the statements that ran; they don't prove that the stored data is intact or keep queryable row versions.", fr: "Des journaux d'audit immuables enregistrent les instructions exécutées ; ils ne prouvent pas que les données stockées sont intactes et ne conservent pas de versions de lignes interrogeables." }
    references:
      - title: Ledger overview
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-43-07
    objective: "4.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso, Ltd. stores billing exports in a general-purpose v2 storage account named stbilling. Infrastructure encryption was enabled when stbilling was created, and the account uses a customer-managed key stored in an Azure Key Vault Premium vault. The security team is reviewing this design before it's applied to other accounts.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. stocke ses exports de facturation dans un compte de stockage v2 universel nommé stbilling. Le chiffrement d'infrastructure a été activé à la création de stbilling, et le compte utilise une clé gérée par le client stockée dans un coffre Azure Key Vault Premium. L'équipe de sécurité revoit cette conception avant de l'appliquer à d'autres comptes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Rotating the customer-managed key to a new key version re-encrypts all the blob data in stbilling.", fr: "Renouveler la clé gérée par le client vers une nouvelle version de clé rechiffre toutes les données blob de stbilling." }
        - id: s2
          text: { en: "Contoso can protect the infrastructure encryption layer of stbilling with a second customer-managed key.", fr: "Contoso peut protéger la couche de chiffrement d'infrastructure de stbilling avec une deuxième clé gérée par le client." }
        - id: s3
          text: { en: "For the other accounts, the customer-managed key can be stored in an Azure Key Vault Managed HSM instead of a vault.", fr: "Pour les autres comptes, la clé gérée par le client peut être stockée dans Azure Key Vault Managed HSM au lieu d'un coffre." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          With envelope encryption, the customer-managed key protects the account's root encryption key: rotating it changes that protection while the data stays encrypted, without re-encrypting it. Infrastructure encryption always uses a separate Microsoft-managed key, and customer-managed keys apply to the service level only. The key can be stored in a key vault or in a Managed HSM.
        fr: |
          Avec le chiffrement d'enveloppe, la clé gérée par le client protège la clé de chiffrement racine du compte : la renouveler change cette protection pendant que les données restent chiffrées, sans les rechiffrer. Le chiffrement d'infrastructure utilise toujours une clé distincte gérée par Microsoft, et les clés gérées par le client ne s'appliquent qu'au niveau du service. La clé peut être stockée dans un coffre de clés ou dans un Managed HSM.
      options:
        s1: { en: "Only the protection of the root encryption key changes; the blob data isn't rewritten.", fr: "Seule la protection de la clé de chiffrement racine change ; les données blob ne sont pas réécrites." }
        s2: { en: "The infrastructure layer relies on Microsoft-managed keys only.", fr: "La couche d'infrastructure ne repose que sur des clés gérées par Microsoft." }
    references:
      - title: Customer-managed keys for Azure Storage encryption
        url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
      - title: Enable infrastructure encryption for double encryption of data
        url: https://learn.microsoft.com/en-us/azure/storage/common/infrastructure-encryption-enable

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-43-08
    objective: "4.3.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware, Inc. receives insurance claim documents in a storage account named stclaims, which uses a customer-managed key. Customers upload about 25,000 GB of files to stclaims every month, mostly ZIP archives smaller than 1 GB.

        Defender for Storage is enabled at the subscription level with malware scanning and the default settings. Litware wants malicious files to be removed automatically without writing any code.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. reçoit des documents de sinistres dans un compte de stockage nommé stclaims, qui utilise une clé gérée par le client. Les clients chargent environ 25 000 Go de fichiers dans stclaims chaque mois, principalement des archives ZIP de moins de 1 Go.

        Defender for Storage est activé au niveau de l'abonnement avec l'analyse des programmes malveillants et les paramètres par défaut. Litware veut que les fichiers malveillants soient supprimés automatiquement sans écrire de code.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "With the current settings, every file uploaded to stclaims during a month is scanned for malware.", fr: "Avec les paramètres actuels, chaque fichier chargé dans stclaims au cours d'un mois est analysé à la recherche de programmes malveillants." }
        - id: s2
          text: { en: "The archives uploaded to stclaims can be scanned even though the account is encrypted with a customer-managed key.", fr: "Les archives chargées dans stclaims peuvent être analysées bien que le compte soit chiffré avec une clé gérée par le client." }
        - id: s3
          text: { en: "Defender for Storage can soft-delete the malicious blobs that it detects, without an Event Grid workflow.", fr: "Defender for Storage peut supprimer de manière réversible les objets blob malveillants qu'il détecte, sans workflow Event Grid." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          By default, malware scanning is capped at 10,000 GB of uploads per storage account per month: beyond the cap, scanning stops for the rest of the month, so the cap must be raised for stclaims. Blobs encrypted at rest with customer-managed keys are supported; only client-side encrypted blobs can't be scanned. Built-in automated remediation soft-deletes the malicious blobs found by on-upload and on-demand scanning.
        fr: |
          Par défaut, l'analyse des programmes malveillants est plafonnée à 10 000 Go de chargements par compte de stockage et par mois : au-delà, l'analyse s'arrête pour le reste du mois, et il faut donc relever le plafond de stclaims. Les objets blob chiffrés au repos avec des clés gérées par le client sont pris en charge ; seuls les objets blob chiffrés côté client ne peuvent pas être analysés. La correction automatisée intégrée supprime de manière réversible les objets blob malveillants trouvés par l'analyse au chargement et à la demande.
      options:
        s1: { en: "At about 25,000 GB a month, the uploads exceed the default cap of 10,000 GB, and the remaining files go unscanned.", fr: "Avec environ 25 000 Go par mois, les chargements dépassent le plafond par défaut de 10 000 Go, et les fichiers restants ne sont pas analysés." }
    references:
      - title: What is Microsoft Defender for Storage
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction
      - title: Introduction to Defender for Storage Malware Scanning
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-malware-scan

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-43-09
    objective: "4.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. plans to fine-tune a model in Microsoft Foundry for its claims assistant. The training dataset is an export of historical claims in an Azure Storage account. The export contains customer names and national ID numbers, which the assistant doesn't need. Today, every member of the analytics department can write to the dataset.

        The threat model rates two threats as high:

        - T1: The fine-tuned model reveals national ID numbers in its answers.
        - T2: Someone adds manipulated claims to the dataset to change the behavior of the model.

        Which two actions should you recommend? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. prévoit d'affiner un modèle dans Microsoft Foundry pour son assistant de sinistres. Le jeu de données d'entraînement est un export de sinistres historiques dans un compte Stockage Azure. L'export contient des noms de clients et des numéros d'identification nationaux, dont l'assistant n'a pas besoin. Aujourd'hui, chaque membre du service d'analyse peut écrire dans le jeu de données.

        Le modèle de menaces classe deux menaces comme élevées :

        - T1 : le modèle affiné révèle des numéros d'identification nationaux dans ses réponses.
        - T2 : quelqu'un ajoute des sinistres manipulés au jeu de données pour modifier le comportement du modèle.

        Quelles deux actions devez-vous recommander ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Remove the names and national ID numbers from the dataset before fine-tuning", fr: "Retirer les noms et les numéros d'identification nationaux du jeu de données avant l'affinage" } }
        - { id: b, text: { en: "Encrypt the storage account that holds the dataset with a customer-managed key", fr: "Chiffrer le compte de stockage qui contient le jeu de données avec une clé gérée par le client" } }
        - { id: c, text: { en: "Enable threat protection for AI services on the Foundry resource", fr: "Activer la protection contre les menaces pour les services d'IA sur la ressource Foundry" } }
        - { id: d, text: { en: "Limit write access to the dataset to a few data engineers, and approve its changes", fr: "Limiter l'accès en écriture au jeu de données à quelques ingénieurs de données, et approuver ses modifications" } }
        - { id: e, text: { en: "Configure prompt shields on the deployment of the fine-tuned model", fr: "Configurer des prompt shields sur le déploiement du modèle affiné" } }
      choose: 2
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Training data is minimized like any sensitive dataset: a model can't reveal values it was never trained on. Data poisoning is an integrity threat to the training data, mitigated by restricting who can change the dataset with least-privilege access and by validating and approving its changes before training.
        fr: |
          Les données d'entraînement se minimisent comme tout jeu de données sensible : un modèle ne peut pas révéler des valeurs sur lesquelles il n'a jamais été entraîné. L'empoisonnement des données est une menace pour l'intégrité des données d'entraînement, atténuée en restreignant qui peut modifier le jeu de données avec un accès à privilèges minimum et en validant et approuvant ses modifications avant l'entraînement.
      options:
        b: { en: "A customer-managed key protects the data at rest; authorized writers can still add manipulated claims, and the IDs still reach the model.", fr: "Une clé gérée par le client protège les données au repos ; les rédacteurs autorisés peuvent encore ajouter des sinistres manipulés, et les numéros atteignent toujours le modèle." }
        c: { en: "Threat protection for AI services detects attacks in prompts and responses at run time; it doesn't control the training data.", fr: "La protection contre les menaces pour les services d'IA détecte les attaques dans les prompts et les réponses à l'exécution ; elle ne contrôle pas les données d'entraînement." }
        e: { en: "Prompt shields block prompt attacks on the deployment; they don't remove what the model learned or protect the dataset.", fr: "Les prompt shields bloquent les attaques par prompt sur le déploiement ; ils ne retirent pas ce que le modèle a appris et ne protègent pas le jeu de données." }
    references:
      - title: Microsoft cloud security benchmark v2 - Artificial Intelligence Security
        url: https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-artificial-intelligence-security

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-43-10
    objective: "4.3.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank is designing the security of an Azure SQL database named sqldb-cards for its card services application. The database runs on a standard-series (Gen5) hardware configuration. Woodgrove's database administrators are employees of an external provider.

        What should you recommend for each requirement? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank conçoit la sécurité d'une base de données Azure SQL nommée sqldb-cards pour son application de services de cartes. La base de données s'exécute sur une configuration matérielle de série standard (Gen5). Les administrateurs de bases de données de Woodgrove sont des employés d'un prestataire externe.

        Que devez-vous recommander pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The database administrators must never see card numbers in clear, and the application must run range and LIKE queries on them: [[cards]]

          Call center agents see only the last four digits of customers' phone numbers, while their supervisors see the full numbers: [[phones]]

          Woodgrove must be able to make the whole database inaccessible on demand by revoking access to a key: [[revoke]]
        fr: |
          Les administrateurs de bases de données ne doivent jamais voir les numéros de carte en clair, et l'application doit exécuter des requêtes de plage et LIKE sur ces numéros : [[cards]]

          Les agents du centre d'appels ne voient que les quatre derniers chiffres des numéros de téléphone des clients, tandis que leurs superviseurs voient les numéros complets : [[phones]]

          Woodgrove doit pouvoir rendre toute la base de données inaccessible à la demande en révoquant l'accès à une clé : [[revoke]]
      slots:
        - id: cards
          options:
            - { id: enclave, text: { en: "Always Encrypted with secure enclaves", fr: "Always Encrypted avec enclaves sécurisées" } }
            - { id: det, text: { en: "Always Encrypted with deterministic encryption", fr: "Always Encrypted avec chiffrement déterministe" } }
            - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
            - { id: tde, text: { en: "TDE with a customer-managed key", fr: "TDE avec une clé gérée par le client" } }
        - id: phones
          options:
            - { id: enclave, text: { en: "Always Encrypted with secure enclaves", fr: "Always Encrypted avec enclaves sécurisées" } }
            - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
            - { id: rls, text: { en: "Row-level security", fr: "Sécurité au niveau des lignes" } }
            - { id: tde, text: { en: "TDE with a customer-managed key", fr: "TDE avec une clé gérée par le client" } }
        - id: revoke
          options:
            - { id: enclave, text: { en: "Always Encrypted with secure enclaves", fr: "Always Encrypted avec enclaves sécurisées" } }
            - { id: det, text: { en: "Always Encrypted with deterministic encryption", fr: "Always Encrypted avec chiffrement déterministe" } }
            - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
            - { id: tde, text: { en: "TDE with a customer-managed key", fr: "TDE avec une clé gérée par le client" } }
    answer:
      values: { cards: enclave, phones: ddm, revoke: tde }
    explanation:
      correct:
        en: |
          Always Encrypted keeps the keys outside the database, so administrators never see plaintext; without an enclave, only equality comparisons work on deterministic columns, while secure enclaves (VBS enclaves on standard-series hardware) add range comparisons and LIKE on randomized columns. Dynamic data masking hides part of a value in query results for nonprivileged users, and the UNMASK permission shows the full value. If the server loses access to a customer-managed TDE protector, the database becomes inaccessible.
        fr: |
          Always Encrypted garde les clés hors de la base de données : les administrateurs ne voient donc jamais les données en clair ; sans enclave, seules les comparaisons d'égalité fonctionnent sur les colonnes déterministes, tandis que les enclaves sécurisées (enclaves VBS sur du matériel de série standard) ajoutent les comparaisons de plage et LIKE sur les colonnes aléatoires. Le masquage dynamique des données masque une partie d'une valeur dans les résultats des requêtes pour les utilisateurs non privilégiés, et l'autorisation UNMASK affiche la valeur complète. Si le serveur perd l'accès à un protecteur TDE géré par le client, la base de données devient inaccessible.
      options:
        det: { en: "Deterministic encryption without an enclave supports equality comparisons only, not ranges or LIKE.", fr: "Le chiffrement déterministe sans enclave ne prend en charge que les comparaisons d'égalité, pas les plages ni LIKE." }
        rls: { en: "Row-level security filters which rows a user sees; it doesn't hide part of a column value.", fr: "La sécurité au niveau des lignes filtre les lignes qu'un utilisateur voit ; elle ne masque pas une partie de la valeur d'une colonne." }
    references:
      - title: Always Encrypted with secure enclaves
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves
      - title: Azure SQL Transparent Data Encryption with customer-managed key
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
