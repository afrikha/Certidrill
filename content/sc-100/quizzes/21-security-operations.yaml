chapter: 21-security-operations
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has Microsoft 365 E5 with Microsoft Defender for Endpoint, Microsoft Defender for Office 365 and Microsoft Defender for Identity deployed. Its Microsoft Sentinel workspace receives their alerts through the standalone connector of each product. The bank plans to connect the workspace to the Microsoft Defender portal.

        After the onboarding, how will the alerts of these products reach Microsoft Sentinel?
      fr: |
        Woodgrove Bank dispose de Microsoft 365 E5 avec Microsoft Defender for Endpoint, Microsoft Defender for Office 365 et Microsoft Defender for Identity déployés. Son espace de travail Microsoft Sentinel reçoit leurs alertes par le connecteur autonome de chaque produit. La banque prévoit de connecter l'espace de travail au portail Microsoft Defender.

        Après l'intégration, comment les alertes de ces produits parviendront-elles à Microsoft Sentinel ?
    body:
      options:
        - { id: a, text: { en: "Through the standalone product connectors, which keep streaming the alerts", fr: "Par les connecteurs autonomes des produits, qui continuent de transmettre les alertes" } }
        - { id: b, text: { en: "Through the Microsoft incident creation rules, which create one incident per alert", fr: "Par les règles de création d'incidents Microsoft, qui créent un incident par alerte" } }
        - { id: c, text: { en: "Through the Office 365 Management Activity API, which exports the alerts", fr: "Par l'Office 365 Management Activity API, qui exporte les alertes" } }
        - { id: d, text: { en: "Through the Microsoft Defender XDR connector, which is set up automatically", fr: "Par le connecteur Microsoft Defender XDR, qui est configuré automatiquement" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          When the workspace is onboarded to the Defender portal, Microsoft Sentinel is connected to Defender XDR and the Defender XDR connector is set up automatically. It brings the Defender XDR incidents and alerts, already correlated across endpoints, email and identities, into Sentinel.
        fr: |
          Quand l'espace de travail est intégré au portail Defender, Microsoft Sentinel est connecté à Defender XDR et le connecteur Defender XDR est configuré automatiquement. Il apporte dans Sentinel les incidents et les alertes de Defender XDR, déjà corrélés entre les points de terminaison, la messagerie et les identités.
      options:
        a: { en: "The standalone alert connectors of Defender for Endpoint, Defender for Office 365, Defender for Identity, Defender for Cloud Apps and Entra ID Protection are disconnected at onboarding.", fr: "Les connecteurs d'alertes autonomes de Defender for Endpoint, Defender for Office 365, Defender for Identity, Defender for Cloud Apps et Entra ID Protection sont déconnectés lors de l'intégration." }
        b: { en: "Microsoft incident creation rules are turned off for the Defender XDR products and aren't supported in the Defender portal, which has its own correlation engine.", fr: "Les règles de création d'incidents Microsoft sont désactivées pour les produits Defender XDR et ne sont pas prises en charge dans le portail Defender, qui a son propre moteur de corrélation." }
        c: { en: "The Office 365 Management Activity API exports the Microsoft 365 audit records to a SIEM; it isn't how Defender alerts reach Sentinel.", fr: "L'Office 365 Management Activity API exporte les enregistrements d'audit de Microsoft 365 vers un SIEM ; ce n'est pas ainsi que les alertes Defender parviennent à Sentinel." }
    references:
      - title: Microsoft Defender XDR integration with Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/microsoft-365-defender-sentinel-integration

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-21-02
    objective: "2.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Proseware, Inc. has Microsoft 365 E3 licenses and uses Audit (Standard) in Microsoft Purview. In November, an investigator searches the audit log for the file deletions that occurred in a SharePoint Online site eight months earlier. The search returns no results, although the deletions are known to have occurred.

        What is the most likely reason?
      fr: |
        Proseware, Inc. dispose de licences Microsoft 365 E3 et utilise Audit (Standard) dans Microsoft Purview. En novembre, un enquêteur recherche dans le journal d'audit les suppressions de fichiers survenues dans un site SharePoint Online huit mois plus tôt. La recherche ne renvoie aucun résultat, alors que les suppressions ont bien eu lieu.

        Quelle est la raison la plus probable ?
    body:
      options:
        - { id: a, text: { en: "Audit (Standard) keeps audit records for 180 days by default", fr: "Audit (Standard) conserve les enregistrements d'audit 180 jours par défaut" } }
        - { id: b, text: { en: "Auditing must first be turned on in the settings of each site", fr: "L'audit doit d'abord être activé dans les paramètres de chaque site" } }
        - { id: c, text: { en: "SharePoint Online activities are recorded only by Audit (Premium)", fr: "Les activités SharePoint Online ne sont enregistrées que par Audit (Premium)" } }
        - { id: d, text: { en: "Records older than 90 days are found only with Search-UnifiedAuditLog", fr: "Les enregistrements de plus de 90 jours ne se trouvent qu'avec Search-UnifiedAuditLog" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Audit (Standard) keeps audit records for 180 days, so records from eight months earlier no longer exist. Audit (Premium) keeps Exchange, SharePoint, OneDrive and Microsoft Entra ID records for one year by default, and retention policies can keep them longer, but only for records that still exist.
        fr: |
          Audit (Standard) conserve les enregistrements d'audit 180 jours ; les enregistrements d'il y a huit mois n'existent donc plus. Audit (Premium) conserve par défaut un an les enregistrements d'Exchange, de SharePoint, de OneDrive et de Microsoft Entra ID, et des stratégies de rétention peuvent les garder plus longtemps, mais seulement pour des enregistrements qui existent encore.
      options:
        b: { en: "Auditing is turned on by default for the organization; there is no per-site switch that would explain missing records.", fr: "L'audit est activé par défaut pour l'organisation ; aucun paramètre par site n'expliquerait l'absence d'enregistrements." }
        c: { en: "SharePoint activities are part of the unified audit log in Audit (Standard); Premium adds longer retention and intelligent insights.", fr: "Les activités SharePoint font partie du journal d'audit unifié dans Audit (Standard) ; Premium ajoute une rétention plus longue et des informations intelligentes." }
        d: { en: "The Purview portal, the Audit Search Graph API and Search-UnifiedAuditLog search the same records; none of them reaches records past retention.", fr: "Le portail Purview, l'Audit Search Graph API et Search-UnifiedAuditLog recherchent les mêmes enregistrements ; aucun n'atteint des enregistrements au-delà de la rétention." }
    references:
      - title: Learn about auditing solutions in Microsoft Purview
        url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-21-03
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. has Microsoft 365 E5 and an on-premises Active Directory Domain Services (AD DS) forest with 12 domain controllers. Microsoft Defender for Endpoint and Microsoft Defender for Office 365 are deployed.

        The SOC must detect reconnaissance, malicious domain controller replication and Golden Ticket activity against AD DS by using built-in detections. The alerts must be correlated with the endpoint and email alerts into the same incidents in the Microsoft Defender portal. The solution must minimize administrative effort.

        What should you recommend?
      fr: |
        Fabrikam, Inc. dispose de Microsoft 365 E5 et d'une forêt Active Directory Domain Services (AD DS) locale de 12 contrôleurs de domaine. Microsoft Defender for Endpoint et Microsoft Defender for Office 365 sont déployés.

        Le SOC doit détecter la reconnaissance, la réplication malveillante de contrôleurs de domaine et l'activité Golden Ticket contre AD DS à l'aide de détections intégrées. Les alertes doivent être corrélées avec les alertes des points de terminaison et de la messagerie dans les mêmes incidents du portail Microsoft Defender. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Microsoft Entra ID Protection risk policies for all users", fr: "Les stratégies de risque de Microsoft Entra ID Protection pour tous les utilisateurs" } }
        - { id: b, text: { en: "The Azure Monitor Agent on the domain controllers, with analytics rules in Microsoft Sentinel", fr: "L'agent Azure Monitor sur les contrôleurs de domaine, avec des règles d'analytique dans Microsoft Sentinel" } }
        - { id: c, text: { en: "Microsoft Defender for Identity sensors on the domain controllers", fr: "Des capteurs Microsoft Defender for Identity sur les contrôleurs de domaine" } }
        - { id: d, text: { en: "Microsoft Defender for Cloud Apps connectors for the Microsoft 365 apps", fr: "Des connecteurs Microsoft Defender for Cloud Apps pour les applications Microsoft 365" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Defender for Identity sensors run on the domain controllers and analyze their traffic and events locally. Its built-in detections cover reconnaissance, compromised credentials, lateral movement and domain dominance, such as DCShadow and Golden Ticket, and its alerts are correlated with the other Defender signals into unified incidents in the Defender portal.
        fr: |
          Les capteurs Defender for Identity s'exécutent sur les contrôleurs de domaine et analysent localement leur trafic et leurs événements. Ses détections intégrées couvrent la reconnaissance, les identifiants compromis, le mouvement latéral et la domination du domaine, comme DCShadow et Golden Ticket, et ses alertes sont corrélées avec les autres signaux Defender dans des incidents unifiés du portail Defender.
      options:
        a: { en: "ID Protection evaluates the risk of Microsoft Entra sign-ins and users; it doesn't analyze the traffic of on-premises domain controllers.", fr: "ID Protection évalue le risque des connexions et des utilisateurs Microsoft Entra ; il n'analyse pas le trafic des contrôleurs de domaine locaux." }
        b: { en: "Collecting Windows Security Events works, but the SOC would have to write and maintain its own detections, which isn't the least effort.", fr: "La collecte des Windows Security Events fonctionne, mais le SOC devrait écrire et maintenir ses propres détections : ce n'est pas l'effort minimal." }
        d: { en: "Defender for Cloud Apps connectors monitor cloud apps; they don't see attacks against AD DS domain controllers.", fr: "Les connecteurs Defender for Cloud Apps surveillent les applications cloud ; ils ne voient pas les attaques contre les contrôleurs de domaine AD DS." }
    references:
      - title: Microsoft Defender for Identity Overview - Microsoft Defender for Identity
        url: https://learn.microsoft.com/en-us/defender-for-identity/what-is

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-21-04
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. uses Microsoft Sentinel onboarded to the Microsoft Defender portal. The SOC manager is evaluating the detection and incident management workflow. The ingestion bill keeps growing, and the manager suspects that several tables are ingested into the analytics tier but used by no detection. The manager also wants recommendations that close coverage gaps for specific types of attacks.

        You need to recommend a solution that provides both with the least administrative effort.

        What should you recommend?
      fr: |
        Contoso, Ltd. utilise Microsoft Sentinel intégré au portail Microsoft Defender. Le responsable du SOC évalue le workflow de détection et de gestion des incidents. La facture d'ingestion ne cesse d'augmenter, et le responsable soupçonne que plusieurs tables sont ingérées dans le niveau analytique sans être utilisées par aucune détection. Il veut aussi des recommandations qui comblent les lacunes de couverture pour des types d'attaques précis.

        Vous devez recommander une solution qui fournit les deux avec un minimum d'effort administratif.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "The SOC optimization recommendations in the Defender portal", fr: "Les recommandations d'optimisation SOC du portail Defender" } }
        - { id: b, text: { en: "The simulated coverage view of the MITRE ATT&CK page", fr: "La vue de couverture simulée de la page MITRE ATT&CK" } }
        - { id: c, text: { en: "The cost recommendations of Azure Advisor for the workspace", fr: "Les recommandations de coût d'Azure Advisor pour l'espace de travail" } }
        - { id: d, text: { en: "The secure score of Microsoft Defender for Cloud", fr: "Le degré de sécurisation de Microsoft Defender for Cloud" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          SOC optimization gives recommendations tailored to the environment, recalculated every day. Data value recommendations show how to get more security value from ingested data or choose a better data plan, and coverage recommendations, such as threat-based ones, add controls to close gaps for types of attacks.
        fr: |
          L'optimisation SOC donne des recommandations adaptées à l'environnement, recalculées chaque jour. Les recommandations de valeur des données montrent comment tirer plus de valeur de sécurité des données ingérées ou choisir un meilleur plan de données, et les recommandations de couverture, comme celles basées sur les menaces, ajoutent des contrôles pour combler les lacunes face à des types d'attaques.
      options:
        b: { en: "Simulated coverage shows which techniques available rule templates would cover; it says nothing about ingested tables that no detection uses.", fr: "La couverture simulée montre les techniques que couvriraient les modèles de règles disponibles ; elle ne dit rien des tables ingérées qu'aucune détection n'utilise." }
        c: { en: "Azure Advisor gives generic cost advice on Azure resources; it doesn't know which Sentinel detections use which tables or which attacks are uncovered.", fr: "Azure Advisor donne des conseils de coût génériques sur les ressources Azure ; il ne sait pas quelles détections Sentinel utilisent quelles tables ni quelles attaques ne sont pas couvertes." }
        d: { en: "Secure score measures the security posture of cloud resources; it doesn't evaluate the data and detections of the SOC.", fr: "Le degré de sécurisation mesure la posture de sécurité des ressources cloud ; il n'évalue pas les données et les détections du SOC." }
    references:
      - title: Optimize security operations
        url: https://learn.microsoft.com/en-us/azure/sentinel/soc-optimization/soc-optimization-access

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-21-05
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has Microsoft 365 E5 licenses, which include Audit (Premium), for all users. The SOC is designing how it will investigate compromised accounts in Microsoft Teams and Exchange Online. The 10-Year Audit Log Retention add-on isn't purchased.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose pour tous les utilisateurs de licences Microsoft 365 E5, qui incluent Audit (Premium). Le SOC conçoit la façon dont il investiguera les comptes compromis dans Microsoft Teams et Exchange Online. Le module complémentaire 10-Year Audit Log Retention n'est pas acheté.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Audit (Premium) records Teams activities such as MessageRead, which help show which chat messages a compromised account read.", fr: "Audit (Premium) enregistre des activités Teams comme MessageRead, qui aident à montrer quels messages de conversation un compte compromis a lus." }
        - id: s2
          text: { en: "An audit log retention policy can keep the Teams records of specific users for one year instead of 180 days.", fr: "Une stratégie de rétention des journaux d'audit peut conserver un an, au lieu de 180 jours, les enregistrements Teams d'utilisateurs précis." }
        - id: s3
          text: { en: "MessageRead and the other Teams events are recorded only after auditing is turned on in the settings of each team.", fr: "MessageRead et les autres événements Teams ne sont enregistrés qu'après l'activation de l'audit dans les paramètres de chaque équipe." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Audit (Premium) adds intelligent insights, including Teams activities such as MessageRead and MessagesListed, which help scope what an attacker accessed. Retention policies, available with Audit (Premium), can target a service, specific activities or specific users and keep their records up to one year without the add-on. Auditing is on by default for the organization: there is no per-team switch.
        fr: |
          Audit (Premium) ajoute des informations intelligentes, dont des activités Teams comme MessageRead et MessagesListed, qui aident à délimiter ce à quoi un attaquant a accédé. Les stratégies de rétention, disponibles avec Audit (Premium), peuvent cibler un service, des activités ou des utilisateurs précis et conserver leurs enregistrements jusqu'à un an sans le module complémentaire. L'audit est activé par défaut pour l'organisation : il n'existe pas de paramètre par équipe.
      options:
        s3: { en: "Audit is enabled by default; Premium events are recorded for users who have a Premium license, without any setting per team.", fr: "L'audit est activé par défaut ; les événements Premium sont enregistrés pour les utilisateurs qui ont une licence Premium, sans aucun paramètre par équipe." }
    references:
      - title: Learn about auditing solutions in Microsoft Purview
        url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-21-06
    objective: "2.1.6"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Litware, Inc. operates a bottling plant whose production lines are controlled by PLCs and HMIs. Microsoft Defender for IoT network sensors monitor the OT network, and their alerts reach Microsoft Sentinel. The CISO asks you to design an evaluation of the threat detection coverage of the plant, so that the remediation effort goes first to the gaps that matter most to the business.

        Which four actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Litware, Inc. exploite une usine d'embouteillage dont les lignes de production sont pilotées par des automates (PLC) et des IHM. Des capteurs réseau Microsoft Defender pour IoT surveillent le réseau OT, et leurs alertes parviennent à Microsoft Sentinel. Le RSSI vous demande de concevoir une évaluation de la couverture de détection des menaces de l'usine, afin que l'effort de correction porte d'abord sur les lacunes les plus importantes pour l'entreprise.

        Quelles sont les quatre actions que vous devez recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 4
      actions:
        - { id: a1, text: { en: "Select the threats that matter to the plant, based on threat intelligence about the sector.", fr: "Sélectionner les menaces qui comptent pour l'usine, à partir du renseignement sur les menaces du secteur." } }
        - { id: a2, text: { en: "List the techniques used by these threat actors in the MITRE ATT&CK for ICS matrix.", fr: "Lister les techniques utilisées par ces acteurs de menace dans la matrice MITRE ATT&CK for ICS." } }
        - { id: a3, text: { en: "Compare these techniques with the detections in place, including the Defender for IoT alerts.", fr: "Comparer ces techniques avec les détections en place, y compris les alertes de Defender pour IoT." } }
        - { id: a4, text: { en: "Prioritize the gaps on the critical production assets and validate them with attack simulation.", fr: "Prioriser les lacunes sur les ressources de production critiques et les valider par une simulation d'attaque." } }
        - { id: a5, text: { en: "List the techniques of the Enterprise matrix that apply to the PLCs and HMIs as network devices.", fr: "Lister les techniques de la matrice Enterprise qui s'appliquent aux automates et aux IHM en tant qu'équipements réseau." } }
        - { id: a6, text: { en: "Enable every available rule template and report the simulated coverage as the current coverage.", fr: "Activer tous les modèles de règles disponibles et présenter la couverture simulée comme la couverture actuelle." } }
    answer:
      sequence: [a1, a2, a3, a4]
    explanation:
      correct:
        en: |
          A coverage evaluation starts from the threats that matter to the business, then lists the techniques of those actors in the matrix that fits the environment: the ICS matrix for PLCs, HMIs and OT protocols. You then compare the techniques with the detections in place, here the Defender for IoT alerts and the Sentinel rules, and prioritize the gaps on critical assets before validating them with attack simulation or purple teaming.
        fr: |
          Une évaluation de couverture part des menaces qui comptent pour l'entreprise, puis liste les techniques de ces acteurs dans la matrice adaptée à l'environnement : la matrice ICS pour les automates, les IHM et les protocoles OT. Vous comparez ensuite les techniques avec les détections en place, ici les alertes de Defender pour IoT et les règles Sentinel, puis vous priorisez les lacunes sur les ressources critiques avant de les valider par une simulation d'attaque ou du purple teaming.
      options:
        a5: { en: "PLCs, HMIs and engineering workstations of an industrial process are covered by the ICS matrix; the Enterprise matrix describes IT techniques.", fr: "Les automates, les IHM et les stations d'ingénierie d'un processus industriel relèvent de la matrice ICS ; la matrice Enterprise décrit des techniques IT." }
        a6: { en: "Simulated coverage shows what you could detect after configuring the detections; it isn't the current protection, and enabling every template ignores priorities.", fr: "La couverture simulée montre ce que vous pourriez détecter après avoir configuré les détections ; ce n'est pas la protection actuelle, et activer tous les modèles ignore les priorités." }
    references:
      - title: View MITRE ATT&CK Coverage in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage
      - title: Microsoft Defender for IoT alerts - Microsoft Defender for IoT
        url: https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/alerts

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-21-07
    objective: "2.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys uses Microsoft Sentinel in the Microsoft Defender portal with the Sentinel data lake. Proxy logs are kept for 90 days in the analytics tier and for five years in the data lake tier.

        A threat intelligence report describes an attacker whose command-and-control traffic has been active for three years. The threat hunters must test this hypothesis over the last three years of proxy logs by using Python machine learning libraries. The matching records must then be available in the analytics tier for the investigation. The solution must minimize cost.

        What should you recommend?
      fr: |
        Tailspin Toys utilise Microsoft Sentinel dans le portail Microsoft Defender avec le lac de données Sentinel. Les journaux du proxy sont conservés 90 jours dans le niveau analytique et cinq ans dans le niveau lac de données.

        Un rapport de renseignement sur les menaces décrit un attaquant dont le trafic de commande et de contrôle est actif depuis trois ans. Les chasseurs de menaces doivent tester cette hypothèse sur les trois dernières années de journaux du proxy à l'aide de bibliothèques Python d'apprentissage automatique. Les enregistrements correspondants doivent ensuite être disponibles dans le niveau analytique pour l'investigation. La solution doit réduire les coûts au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Extend the analytics retention of the proxy table to three years, then run the hunt in advanced hunting", fr: "Étendre à trois ans la rétention analytique de la table du proxy, puis exécuter le repérage dans la recherche avancée" } }
        - { id: b, text: { en: "Run the hunting query as a livestream session, then bookmark the matching records for the investigation", fr: "Exécuter la requête de repérage dans une session livestream, puis enregistrer en signets les enregistrements correspondants" } }
        - { id: c, text: { en: "Run a notebook over the data lake tier, then promote the matching records to the analytics tier", fr: "Exécuter un notebook sur le niveau lac de données, puis promouvoir les enregistrements correspondants vers le niveau analytique" } }
        - { id: d, text: { en: "Create a custom detection rule on the proxy table, then investigate the incidents that the rule creates", fr: "Créer une règle de détection personnalisée sur la table du proxy, puis investiguer les incidents créés par la règle" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The data lake tier keeps high-volume data for years at low cost, and its Jupyter notebooks run Python libraries and machine learning models over it. Notebooks and KQL jobs can promote their results from the lake tier to the analytics tier, so only the matching records are paid for at analytics prices and are available to the investigation.
        fr: |
          Le niveau lac de données conserve des données volumineuses pendant des années à faible coût, et ses notebooks Jupyter y exécutent des bibliothèques Python et des modèles d'apprentissage automatique. Les notebooks et les travaux KQL peuvent promouvoir leurs résultats du niveau lac de données vers le niveau analytique : seuls les enregistrements correspondants sont payés au tarif analytique et disponibles pour l'investigation.
      options:
        a: { en: "Analytics retention goes up to two years, so it can't hold three years, and keeping high-volume proxy logs in the analytics tier is the expensive option.", fr: "La rétention analytique va jusqu'à deux ans, elle ne peut donc pas contenir trois ans, et garder des journaux de proxy volumineux dans le niveau analytique est l'option coûteuse." }
        b: { en: "Livestream runs a query on new events as they arrive; it doesn't search three years of historical data.", fr: "Livestream exécute une requête sur les nouveaux événements à leur arrivée ; il ne recherche pas trois ans de données historiques." }
        d: { en: "A custom detection rule watches the analytics data going forward; it doesn't test a hypothesis over three years of past logs with Python.", fr: "Une règle de détection personnalisée surveille les données analytiques à venir ; elle ne teste pas une hypothèse sur trois ans de journaux passés avec Python." }
    references:
      - title: Microsoft Sentinel data lake overview - Microsoft Security
        url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-lake-overview

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-21-08
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso, Ltd. has Microsoft 365 E5, with Microsoft Defender for Endpoint on all devices, and uses Microsoft Sentinel onboarded to the Microsoft Defender portal. Sentinel also ingests firewall and AWS CloudTrail logs. To reduce costs, the CFO's office asks you to evaluate the following assumptions about the detection and response design.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose de Microsoft 365 E5, avec Microsoft Defender for Endpoint sur tous les appareils, et utilise Microsoft Sentinel intégré au portail Microsoft Defender. Sentinel ingère aussi les journaux de pare-feu et AWS CloudTrail. Pour réduire les coûts, la direction financière vous demande d'évaluer les hypothèses suivantes sur la conception de la détection et de la réponse.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If Defender for Endpoint is replaced by Windows security events collected into Sentinel by the Azure Monitor Agent, the SOC keeps the ability to isolate a device from the Defender portal.", fr: "Si Defender for Endpoint est remplacé par des événements de sécurité Windows collectés dans Sentinel par l'agent Azure Monitor, le SOC conserve la possibilité d'isoler un appareil depuis le portail Defender." }
        - id: s2
          text: { en: "The Defender XDR connector can stream advanced hunting events into Sentinel tables, where they can be kept longer than the 30 days of Defender XDR.", fr: "Le connecteur Defender XDR peut transmettre les événements de recherche avancée dans des tables Sentinel, où ils peuvent être conservés plus longtemps que les 30 jours de Defender XDR." }
        - id: s3
          text: { en: "Automation rules that select Defender XDR incidents by incident title keep working unchanged, because Sentinel analytics rules still name these incidents.", fr: "Les règles d'automatisation qui sélectionnent les incidents Defender XDR par leur titre continuent de fonctionner sans changement, car les règles d'analytique Sentinel nomment toujours ces incidents." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Defender XDR and Sentinel aren't alternatives: device isolation is a native response action of Defender for Endpoint, and a Sentinel-only design that ingests Windows events loses it. The Defender XDR connector can stream advanced hunting events into Sentinel tables, which can be retained longer than the default 30 days. In the Defender portal, the Defender XDR correlation engine creates and names the incidents, so automation rules that match on incident names may break and should use tags instead.
        fr: |
          Defender XDR et Sentinel ne sont pas des alternatives : l'isolement d'un appareil est une action de réponse native de Defender for Endpoint, et une conception « Sentinel seul » qui ingère des événements Windows la perd. Le connecteur Defender XDR peut transmettre les événements de recherche avancée dans des tables Sentinel, qui peuvent être conservées plus longtemps que les 30 jours par défaut. Dans le portail Defender, le moteur de corrélation de Defender XDR crée et nomme les incidents : les règles d'automatisation qui s'appuient sur le nom des incidents peuvent cesser de fonctionner et doivent plutôt utiliser des étiquettes.
      options:
        s1: { en: "Collecting events gives Sentinel data to analyze, not the endpoint sensor that performs isolation; the response action disappears with Defender for Endpoint.", fr: "Collecter des événements donne à Sentinel des données à analyser, pas le capteur de point de terminaison qui réalise l'isolement ; l'action de réponse disparaît avec Defender for Endpoint." }
        s3: { en: "The Defender XDR correlation engine names the incidents in the Defender portal, so rules that match on incident names may break.", fr: "Le moteur de corrélation de Defender XDR nomme les incidents dans le portail Defender : les règles qui s'appuient sur le nom des incidents peuvent cesser de fonctionner." }
    references:
      - title: Microsoft Defender XDR integration with Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/microsoft-365-defender-sentinel-integration

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-21-09
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. protects its Azure subscriptions, 30 AWS accounts and 12 GCP projects with Microsoft Defender for Cloud. Microsoft Sentinel is onboarded to the Microsoft Defender portal, and its workspace is the primary workspace. The workspace still uses the subscription-based connector of Defender for Cloud.

        Analysts see Defender for Cloud alerts both as separate Sentinel incidents and inside Defender XDR incidents, so they work the same attack twice. The SOC requires the Defender for Cloud alerts of the three clouds to be correlated with the other Defender alerts into single incidents in the Defender portal queue, without duplicates. The solution must minimize administrative effort.

        What should you recommend?
      fr: |
        Litware, Inc. protège ses abonnements Azure, 30 comptes AWS et 12 projets GCP avec Microsoft Defender pour le cloud. Microsoft Sentinel est intégré au portail Microsoft Defender, et son espace de travail est l'espace de travail principal. L'espace de travail utilise encore le connecteur de Defender pour le cloud basé sur l'abonnement.

        Les analystes voient les alertes de Defender pour le cloud à la fois comme des incidents Sentinel distincts et dans des incidents Defender XDR : ils traitent donc deux fois la même attaque. Le SOC exige que les alertes de Defender pour le cloud des trois clouds soient corrélées avec les autres alertes Defender dans des incidents uniques de la file du portail Defender, sans doublons. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Keep the subscription-based connector, and add an automation rule that closes the duplicate incidents", fr: "Conserver le connecteur basé sur l'abonnement, et ajouter une règle d'automatisation qui ferme les incidents en double" } }
        - { id: b, text: { en: "Keep the subscription-based connector, and disconnect the Defender XDR connector from the workspace", fr: "Conserver le connecteur basé sur l'abonnement, et déconnecter le connecteur Defender XDR de l'espace de travail" } }
        - { id: c, text: { en: "Use the tenant-based connector, and disconnect the subscription-based connector from all workspaces", fr: "Utiliser le connecteur basé sur le locataire, et déconnecter le connecteur basé sur l'abonnement de tous les espaces de travail" } }
        - { id: d, text: { en: "Use a secondary workspace for the Defender for Cloud alerts, and keep the primary workspace for the rest", fr: "Utiliser un espace de travail secondaire pour les alertes de Defender pour le cloud, et garder l'espace principal pour le reste" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The tenant-based Defender for Cloud connector streams the Defender for Cloud incidents, correlated by Defender XDR, to the primary workspace. Microsoft Learn recommends disconnecting the subscription-based (legacy) connector from all workspaces when the tenant-based connector is used, which removes the second path that creates the duplicate incidents.
        fr: |
          Le connecteur de Defender pour le cloud basé sur le locataire transmet à l'espace de travail principal les incidents de Defender pour le cloud corrélés par Defender XDR. Microsoft Learn recommande de déconnecter le connecteur basé sur l'abonnement (hérité) de tous les espaces de travail quand le connecteur basé sur le locataire est utilisé, ce qui supprime le second chemin qui crée les incidents en double.
      options:
        a: { en: "Closing duplicates hides the symptom, but the legacy connector keeps creating uncorrelated incidents that must be maintained in a rule.", fr: "Fermer les doublons masque le symptôme, mais le connecteur hérité continue de créer des incidents non corrélés qu'une règle doit gérer." }
        b: { en: "Without the Defender XDR connector, Sentinel loses the Defender XDR incidents, so nothing is correlated with the other Defender alerts.", fr: "Sans le connecteur Defender XDR, Sentinel perd les incidents Defender XDR : plus rien n'est corrélé avec les autres alertes Defender." }
        d: { en: "Tenant-correlated data goes to the primary workspace; a separate workspace splits the data and doesn't merge the alerts into single incidents.", fr: "Les données corrélées au niveau du locataire vont à l'espace de travail principal ; un espace séparé divise les données et ne fusionne pas les alertes dans des incidents uniques." }
    references:
      - title: Connect Microsoft Sentinel to the Microsoft Defender portal - Unified security operations
        url: https://learn.microsoft.com/en-us/unified-secops/microsoft-sentinel-onboard

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-21-10
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has Microsoft 365 E5, with Microsoft Defender for Endpoint on all devices and Microsoft Defender for Identity on all domain controllers. Automatic attack disruption is active. The 20 trading servers are in their own device group.

        The bank has the following requirements:

        - The two emergency access accounts and the service account of the ERP application must never be disabled automatically.
        - The trading servers must never be contained automatically; the SOC decides manually for them.
        - All the other users and devices must keep automatic containment.

        Which two actions should you recommend? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose de Microsoft 365 E5, avec Microsoft Defender for Endpoint sur tous les appareils et Microsoft Defender for Identity sur tous les contrôleurs de domaine. L'interruption automatique des attaques est active. Les 20 serveurs de trading sont dans leur propre groupe d'appareils.

        La banque a les exigences suivantes :

        - Les deux comptes d'accès d'urgence et le compte de service de l'application ERP ne doivent jamais être désactivés automatiquement.
        - Les serveurs de trading ne doivent jamais être contenus automatiquement ; le SOC décide manuellement pour eux.
        - Tous les autres utilisateurs et appareils doivent conserver le confinement automatique.

        Quelles sont les deux actions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add the three accounts as user exclusions of automatic attack disruption", fr: "Ajouter les trois comptes comme exclusions d'utilisateurs de l'interruption automatique des attaques" } }
        - { id: b, text: { en: "Set the trading servers' device group to Semi - require approval for all folders", fr: "Définir le groupe d'appareils des serveurs de trading sur Semi - require approval for all folders" } }
        - { id: c, text: { en: "Add selective isolation exclusions for the trading servers in Defender for Endpoint", fr: "Ajouter des exclusions d'isolement sélectif pour les serveurs de trading dans Defender for Endpoint" } }
        - { id: d, text: { en: "Set the trading servers' device group to No automated response", fr: "Définir le groupe d'appareils des serveurs de trading sur No automated response" } }
        - { id: e, text: { en: "Open a support case to opt the tenant out of automatic attack disruption", fr: "Ouvrir un dossier de support pour retirer le locataire de l'interruption automatique des attaques" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Attack disruption exclusions prevent selected user accounts, such as emergency access and service accounts, from being disabled automatically. For devices, the exclusion is the automation level of the device group: No automated response removes the group from automated containment, and Microsoft advises keeping such exclusions to a few assets with a clear business need. Every other user and device keeps automatic containment.
        fr: |
          Les exclusions de l'interruption des attaques empêchent la désactivation automatique de comptes d'utilisateurs choisis, comme les comptes d'accès d'urgence et les comptes de service. Pour les appareils, l'exclusion est le niveau d'automatisation du groupe d'appareils : No automated response retire le groupe du confinement automatique, et Microsoft conseille de limiter ces exclusions à quelques ressources ayant un vrai besoin métier. Tous les autres utilisateurs et appareils conservent le confinement automatique.
      options:
        b: { en: "Semi automation still allows automatic attack disruption without manual approval, so the trading servers could still be contained.", fr: "La semi-automatisation permet toujours l'interruption automatique des attaques sans approbation manuelle : les serveurs de trading pourraient encore être contenus." }
        c: { en: "Selective isolation exclusions let an already isolated device reach chosen destinations; they don't prevent the isolation.", fr: "Les exclusions d'isolement sélectif permettent à un appareil déjà isolé de joindre des destinations choisies ; elles n'empêchent pas l'isolement." }
        e: { en: "Opting out removes automatic containment for every user and device, which breaks the third requirement.", fr: "Le retrait supprime le confinement automatique pour tous les utilisateurs et appareils, ce qui enfreint la troisième exigence." }
    references:
      - title: Exclude assets from automated response in attack disruption - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption-exclusions
      - title: Configure automatic attack disruption in Microsoft Defender XDR - Microsoft Defender XDR
        url: https://learn.microsoft.com/en-us/defender-xdr/configure-attack-disruption
