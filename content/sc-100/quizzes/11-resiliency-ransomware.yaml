chapter: 11-resiliency-ransomware
questions:
  # ------------------------------------------------------------------ 1
  - id: sc100-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The security team of Fabrikam, Inc. is classifying the ransomware threats of its risk register. Microsoft's guidance distinguishes commodity ransomware from human-operated ransomware, and the response that each one requires is different.

        Which characteristic is specific to human-operated ransomware?
      fr: |
        L'équipe de sécurité de Fabrikam, Inc. classe les menaces de rançongiciel de son registre des risques. Les recommandations de Microsoft distinguent le rançongiciel courant (commodity) du rançongiciel à opération humaine, et la réponse que chacun exige est différente.

        Quelle caractéristique est propre au rançongiciel à opération humaine ?
    body:
      options:
        - { id: a, text: { en: "It spreads automatically, like a virus, through phishing and malware delivery", fr: "Il se propage automatiquement, comme un virus, par hameçonnage et diffusion de logiciels malveillants" } }
        - { id: b, text: { en: "It usually requires only malware remediation on the devices that it infected", fr: "Il n'exige généralement que la correction des logiciels malveillants sur les appareils infectés" } }
        - { id: c, text: { en: "Its operators elevate privileges and keep threatening the business after the first encounter", fr: "Ses opérateurs élèvent leurs privilèges et continuent de menacer l'activité après la première rencontre" } }
        - { id: d, text: { en: "It encrypts only the files of the device on which a user opened the attachment", fr: "Il ne chiffre que les fichiers de l'appareil sur lequel un utilisateur a ouvert la pièce jointe" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Human-operated ransomware is an active attack: criminals infiltrate the on-premises or cloud infrastructure, elevate their privileges and deploy ransomware to critical data. Unlike commodity ransomware, it keeps threatening business operations after the initial encounter, so it requires a full incident response rather than malware cleanup.
        fr: |
          Le rançongiciel à opération humaine est une attaque active : des criminels s'infiltrent dans l'infrastructure locale ou cloud, élèvent leurs privilèges et déploient le rançongiciel sur les données critiques. Contrairement au rançongiciel courant, il continue de menacer l'activité après la première rencontre ; il exige donc une réponse complète aux incidents, et pas un simple nettoyage des logiciels malveillants.
      options:
        a: { en: "Automated spreading through phishing and malware delivery describes commodity ransomware.", fr: "La propagation automatisée par hameçonnage et diffusion de logiciels malveillants décrit le rançongiciel courant." }
        b: { en: "Malware remediation alone is what commodity ransomware usually requires; a human-operated attack needs a full incident response.", fr: "La seule correction des logiciels malveillants est ce qu'exige généralement le rançongiciel courant ; une attaque à opération humaine demande une réponse complète aux incidents." }
        d: { en: "Human-operated attackers move through the infrastructure and target the critical data that they choose, not one device.", fr: "Les attaquants à opération humaine se déplacent dans l'infrastructure et ciblent les données critiques de leur choix, pas un seul appareil." }
    references:
      - title: What is ransomware?
        url: https://learn.microsoft.com/en-us/security/ransomware/human-operated-ransomware

  # ------------------------------------------------------------------ 2
  - id: sc100-qz-11-02
    objective: "1.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation backs up its Azure virtual machines to a Recovery Services vault by using Azure Backup. During a ransomware readiness review, an auditor asks why an attacker who takes full control of a protected virtual machine can't encrypt the backup data of that machine.

        What should you answer?
      fr: |
        Adatum Corporation sauvegarde ses machines virtuelles Azure dans un coffre Recovery Services avec la Sauvegarde Azure. Lors d'une revue de préparation aux rançongiciels, un auditeur demande pourquoi un attaquant qui prend le contrôle total d'une machine virtuelle protégée ne peut pas chiffrer les données de sauvegarde de cette machine.

        Que devez-vous répondre ?
    body:
      options:
        - { id: a, text: { en: "The backup data is reachable only through the vault, with no direct access to its storage", fr: "Les données de sauvegarde ne sont accessibles que par le coffre, sans accès direct à leur stockage" } }
        - { id: b, text: { en: "The backup data is encrypted by default with keys that the customer manages", fr: "Les données de sauvegarde sont chiffrées par défaut avec des clés que le client gère" } }
        - { id: c, text: { en: "The protected machine replicates its disks to the paired region every few minutes", fr: "La machine protégée réplique ses disques vers la région jumelée à quelques minutes d'intervalle" } }
        - { id: d, text: { en: "Soft delete blocks every write to the recovery points during their retention", fr: "La suppression réversible bloque toute écriture dans les points de récupération pendant leur rétention" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Backup stores backup data in storage that the guest or an attacker can't reach directly: the data is managed only through Recovery Services vaults and Backup vaults. Compromising the protected machine therefore doesn't give access to the backup storage or its content.
        fr: |
          La Sauvegarde Azure stocke les données de sauvegarde dans un stockage que l'invité ou un attaquant ne peut pas atteindre directement : les données ne se gèrent que par les coffres Recovery Services et les coffres de sauvegarde. Compromettre la machine protégée ne donne donc pas accès au stockage des sauvegardes ni à son contenu.
      options:
        b: { en: "Azure Backup uses Microsoft-managed keys by default; customer-managed keys are optional, and encryption doesn't decide who can reach the data.", fr: "La Sauvegarde Azure utilise par défaut des clés gérées par Microsoft ; les clés gérées par le client sont facultatives, et le chiffrement ne décide pas qui peut atteindre les données." }
        c: { en: "Frequent replication to another region is Azure Site Recovery; it reproduces changes, encrypted data included, and isn't the backup data.", fr: "La réplication fréquente vers une autre région relève d'Azure Site Recovery ; elle reproduit les modifications, données chiffrées comprises, et ce ne sont pas les données de sauvegarde." }
        d: { en: "Soft delete keeps deleted backup data recoverable for a period; it doesn't make recovery points read-only.", fr: "La suppression réversible garde récupérables pendant un temps les données de sauvegarde supprimées ; elle ne met pas les points de récupération en lecture seule." }
    references:
      - title: Azure backup and restore plan to protect against ransomware
        url: https://learn.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware

  # ------------------------------------------------------------------ 3
  - id: sc100-qz-11-03
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. is implementing step 3 of Microsoft's plan to protect against ransomware. A roadmap item says: "Deploy ASR rules for Office, in audit mode first, then in block mode." The goal is to stop Office documents from launching executable content and creating child processes on the Windows devices, which are managed with Microsoft Intune.

        Which solution does the roadmap item refer to?
      fr: |
        Litware, Inc. met en œuvre l'étape 3 du plan de Microsoft pour se protéger contre les rançongiciels. Un élément de la feuille de route indique : « Déployer les règles ASR pour Office, d'abord en mode audit, puis en mode blocage. » L'objectif est d'empêcher les documents Office de lancer du contenu exécutable et de créer des processus enfants sur les appareils Windows, gérés avec Microsoft Intune.

        À quelle solution l'élément de la feuille de route fait-il référence ?
    body:
      options:
        - { id: a, text: { en: "Replication policies in Azure Site Recovery", fr: "Les stratégies de réplication d'Azure Site Recovery" } }
        - { id: b, text: { en: "Attack surface reduction rules in Microsoft Defender for Endpoint", fr: "Les règles de réduction de la surface d'attaque de Microsoft Defender for Endpoint" } }
        - { id: c, text: { en: "Safe Attachments policies in Microsoft Defender for Office 365", fr: "Les stratégies Safe Attachments de Microsoft Defender for Office 365" } }
        - { id: d, text: { en: "Conditional Access policies in report-only mode", fr: "Les stratégies d'accès conditionnel en mode rapport seul" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In the ransomware guidance, ASR stands for attack surface reduction: rules of Microsoft Defender for Endpoint that block behaviors such as Office apps creating child processes or executable content. Microsoft recommends deploying them in audit mode first, then in block mode.
        fr: |
          Dans les recommandations sur les rançongiciels, ASR signifie réduction de la surface d'attaque (attack surface reduction) : des règles de Microsoft Defender for Endpoint qui bloquent des comportements comme la création de processus enfants ou de contenu exécutable par les applications Office. Microsoft recommande de les déployer d'abord en mode audit, puis en mode blocage.
      options:
        a: { en: "Azure Site Recovery shares the ASR acronym but replicates machines for failover; it doesn't control what Office does on a device.", fr: "Azure Site Recovery partage l'acronyme ASR mais réplique des machines pour le basculement ; il ne contrôle pas ce que fait Office sur un appareil." }
        c: { en: "Safe Attachments scans email attachments before delivery; it doesn't block the process behavior of Office apps on the devices.", fr: "Safe Attachments analyse les pièces jointes des e-mails avant leur remise ; il ne bloque pas le comportement des processus des applications Office sur les appareils." }
        d: { en: "Conditional Access controls sign-in to cloud apps; its report-only mode doesn't act on Office processes.", fr: "L'accès conditionnel contrôle la connexion aux applications cloud ; son mode rapport seul n'agit pas sur les processus Office." }
    references:
      - title: Make it hard for ransomware attacks to happen to your organization
        url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase3

  # ------------------------------------------------------------------ 4
  - id: sc100-qz-11-04
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys uses Azure Update Manager to assess and patch its Azure virtual machines. The company also runs 40 Windows Server and Linux virtual machines in Google Cloud Platform (GCP).

        The security update strategy requires the GCP virtual machines to be assessed and patched in the same maintenance schedules as the Azure virtual machines.

        What should you recommend so that Azure Update Manager can manage the GCP virtual machines?
      fr: |
        Tailspin Toys utilise Azure Update Manager pour évaluer et corriger ses machines virtuelles Azure. L'entreprise exécute aussi 40 machines virtuelles Windows Server et Linux dans Google Cloud Platform (GCP).

        La stratégie de mises à jour de sécurité exige que les machines virtuelles GCP soient évaluées et corrigées dans les mêmes planifications de maintenance que les machines virtuelles Azure.

        Que devez-vous recommander pour qu'Azure Update Manager puisse gérer les machines virtuelles GCP ?
    body:
      options:
        - { id: a, text: { en: "Create a Log Analytics workspace and an Automation account for the GCP machines", fr: "Créer un espace de travail Log Analytics et un compte Automation pour les machines GCP" } }
        - { id: b, text: { en: "Enroll the GCP machines in Microsoft Intune and assign Windows Update rings", fr: "Inscrire les machines GCP dans Microsoft Intune et leur affecter des anneaux Windows Update" } }
        - { id: c, text: { en: "Onboard the GCP machines to Microsoft Defender Vulnerability Management", fr: "Intégrer les machines GCP à Microsoft Defender Vulnerability Management" } }
        - { id: d, text: { en: "Connect the GCP machines to Azure as Azure Arc-enabled servers", fr: "Connecter les machines GCP à Azure en tant que serveurs Azure Arc" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Azure Update Manager manages Azure virtual machines and Azure Arc-enabled servers. Connecting the GCP machines with Azure Arc makes them Azure resources that Update Manager can assess and include in the same maintenance configurations as the Azure virtual machines.
        fr: |
          Azure Update Manager gère les machines virtuelles Azure et les serveurs Azure Arc. Connecter les machines GCP avec Azure Arc en fait des ressources Azure qu'Update Manager peut évaluer et inclure dans les mêmes configurations de maintenance que les machines virtuelles Azure.
      options:
        a: { en: "Azure Update Manager doesn't depend on a Log Analytics workspace or an Automation account; those were prerequisites of the legacy Update Management solution.", fr: "Azure Update Manager ne dépend ni d'un espace de travail Log Analytics ni d'un compte Automation ; c'étaient des prérequis de l'ancienne solution Update Management." }
        b: { en: "Intune update rings target Windows client devices, not Windows Server and Linux machines, and they don't put machines under Update Manager.", fr: "Les anneaux de mise à jour Intune ciblent les appareils clients Windows, pas les machines Windows Server et Linux, et ils ne placent pas les machines sous Update Manager." }
        c: { en: "Defender Vulnerability Management prioritizes vulnerabilities but doesn't install updates, and it doesn't make machines manageable by Update Manager.", fr: "Defender Vulnerability Management priorise les vulnérabilités mais n'installe pas les mises à jour, et il ne rend pas les machines gérables par Update Manager." }
    references:
      - title: Azure Update Manager Overview
        url: https://learn.microsoft.com/en-us/azure/update-manager/overview

  # ------------------------------------------------------------------ 5
  - id: sc100-qz-11-05
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders stores its employees' working documents on on-premises file shares, on which the Everyone group has the Modify permission. The company is preparing the recovery step of Microsoft's plan to protect against ransomware and wants to apply the data protection checklist of that step to these documents.

        Which two actions should you recommend? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders stocke les documents de travail de ses employés sur des partages de fichiers locaux, sur lesquels le groupe Everyone dispose de l'autorisation Modify. L'entreprise prépare l'étape de récupération du plan de Microsoft pour se protéger contre les rançongiciels et veut appliquer à ces documents la liste de contrôle de protection des données de cette étape.

        Quelles sont les deux actions que vous devez recommander ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Move the documents to OneDrive and SharePoint, and teach users to restore their own files", fr: "Déplacer les documents vers OneDrive et SharePoint, et apprendre aux utilisateurs à restaurer eux-mêmes leurs fichiers" } }
        - { id: b, text: { en: "Replicate the file servers to Azure with Site Recovery, and use the replicas as recovery copies", fr: "Répliquer les serveurs de fichiers vers Azure avec Site Recovery, et utiliser les réplicas comme copies de récupération" } }
        - { id: c, text: { en: "Exclude the shared folders from controlled folder access, so that backup software can write to them", fr: "Exclure les dossiers partagés de l'accès contrôlé aux dossiers, pour que le logiciel de sauvegarde puisse y écrire" } }
        - { id: d, text: { en: "Reduce the broad write and delete permissions on the shares, and monitor so that they don't reappear", fr: "Réduire les autorisations larges d'écriture et de suppression sur les partages, et surveiller pour qu'elles ne reviennent pas" } }
        - { id: e, text: { en: "Encrypt the file server volumes with BitLocker, so that ransomware can't read the documents", fr: "Chiffrer les volumes des serveurs de fichiers avec BitLocker, pour que le rançongiciel ne puisse pas lire les documents" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The data protection checklist moves user data to OneDrive and SharePoint, whose versioning and recycle bin let users recover their files themselves. It also asks to discover and reduce broad write and delete permissions on critical data locations, then audit them so that they don't come back, because ransomware relies on broad access.
        fr: |
          La liste de contrôle de protection des données déplace les données utilisateur vers OneDrive et SharePoint, dont la gestion des versions et la corbeille permettent aux utilisateurs de récupérer eux-mêmes leurs fichiers. Elle demande aussi de découvrir et de réduire les autorisations larges d'écriture et de suppression sur les emplacements de données critiques, puis de les auditer pour qu'elles ne reviennent pas, car le rançongiciel s'appuie sur des accès larges.
      options:
        b: { en: "Replication quickly reproduces changes, encrypted files included; it doesn't replace protected point-in-time copies.", fr: "La réplication reproduit vite les modifications, fichiers chiffrés compris ; elle ne remplace pas des copies protégées à un point dans le temps." }
        c: { en: "The checklist designates protected folders to stop unauthorized applications from changing their data; excluding them removes that protection.", fr: "La liste de contrôle désigne des dossiers protégés pour empêcher les applications non autorisées d'en modifier les données ; les exclure supprime cette protection." }
        e: { en: "BitLocker protects data at rest when a disk is stolen; ransomware that runs with a user's access still reads and encrypts the files.", fr: "BitLocker protège les données au repos en cas de vol d'un disque ; un rançongiciel qui s'exécute avec l'accès d'un utilisateur lit et chiffre quand même les fichiers." }
    references:
      - title: Prepare for ransomware attacks with a backup and recovery plan
        url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase1

  # ------------------------------------------------------------------ 6
  - id: sc100-qz-11-06
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Corporation is executing Microsoft's plan to protect against ransomware. Three teams work at the same time: the backup team, the identity team and the endpoint team. The business units are still building their inventory of critical assets, which will take six more months.

        The CISO reviews the proposals of the teams.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation exécute le plan de Microsoft pour se protéger contre les rançongiciels. Trois équipes travaillent en même temps : l'équipe de sauvegarde, l'équipe d'identité et l'équipe des points de terminaison. Les unités métier construisent encore leur inventaire des ressources critiques, ce qui prendra six mois de plus.

        Le RSSI examine les propositions des équipes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The backup team should protect the backups of the domain controllers and of the ERP system with immutable storage now, without waiting for the inventory.", fr: "L'équipe de sauvegarde doit protéger dès maintenant les sauvegardes des contrôleurs de domaine et du système ERP par un stockage immuable, sans attendre l'inventaire." }
        - id: s2
          text: { en: "The endpoint team should finish deploying attack surface reduction rules in block mode before the backup team starts, because these rules stop the initial infection.", fr: "L'équipe des points de terminaison doit terminer le déploiement des règles de réduction de la surface d'attaque en mode blocage avant que l'équipe de sauvegarde commence, car ces règles stoppent l'infection initiale." }
        - id: s3
          text: { en: "The identity team's plan to require strong MFA for the administrator and priority accounts first, then for all other users, follows Microsoft's guidance.", fr: "Le plan de l'équipe d'identité, qui exige une MFA forte d'abord pour les comptes d'administrateurs et prioritaires, puis pour tous les autres utilisateurs, suit les recommandations de Microsoft." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Identifying critical assets is long, cross-team work that must not delay backups and privileged access: the backup team protects critical systems, domain controllers included, now. Teams can work in parallel, but step 3 (entry points, such as attack surface reduction rules) must not slow down steps 1 and 2, so it is never a prerequisite for the backup work. For accounts, Microsoft recommends strong MFA or passwordless sign-in for all users, starting with administrator and priority accounts.
        fr: |
          L'identification des ressources critiques est un travail long et transversal qui ne doit pas retarder les sauvegardes et l'accès privilégié : l'équipe de sauvegarde protège dès maintenant les systèmes critiques, contrôleurs de domaine compris. Les équipes peuvent travailler en parallèle, mais l'étape 3 (les points d'entrée, comme les règles de réduction de la surface d'attaque) ne doit pas ralentir les étapes 1 et 2 ; ce n'est donc jamais un prérequis du travail sur les sauvegardes. Pour les comptes, Microsoft recommande une MFA forte ou une connexion sans mot de passe pour tous les utilisateurs, en commençant par les comptes d'administrateurs et prioritaires.
      options:
        s2: { en: "Hardening entry points is step 3; it takes the longest and must not delay the recovery plan, which comes first because it removes the attacker's monetary incentive whatever the entry point.", fr: "Le durcissement des points d'entrée est l'étape 3 ; c'est la plus longue et elle ne doit pas retarder le plan de récupération, qui passe en premier parce qu'il supprime l'intérêt financier de l'attaquant quel que soit le point d'entrée." }
    references:
      - title: Make it hard for ransomware attacks to happen to your organization
        url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase3
      - title: Quickly protect your organization against ransomware attacks
        url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware

  # ------------------------------------------------------------------ 7
  - id: sc100-qz-11-07
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso, Ltd. has an on-premises AD DS forest synchronized to Microsoft Entra ID, Azure virtual machines and Windows devices protected by Microsoft Defender Antivirus. After a ransomware attack, the investigation produced three findings:

        - Many on-premises AD DS passwords contain the company name followed by the year.
        - Administrators connect to the Azure virtual machines over RDP through public IP addresses.
        - With a local administrator account, the attacker turned off the real-time protection of Microsoft Defender Antivirus before deploying the payload.

        You need to recommend a control from step 3 of Microsoft's ransomware plan for each finding. Administrators must not have to install a VPN client.

        How should you complete the recommendation? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose d'une forêt AD DS locale synchronisée avec Microsoft Entra ID, de machines virtuelles Azure et d'appareils Windows protégés par l'Antivirus Microsoft Defender. Après une attaque par rançongiciel, l'enquête a produit trois constats :

        - De nombreux mots de passe AD DS locaux contiennent le nom de l'entreprise suivi de l'année.
        - Les administrateurs se connectent aux machines virtuelles Azure en RDP par des adresses IP publiques.
        - Avec un compte d'administrateur local, l'attaquant a désactivé la protection en temps réel de l'Antivirus Microsoft Defender avant de déployer la charge utile.

        Vous devez recommander un contrôle de l'étape 3 du plan de Microsoft contre les rançongiciels pour chaque constat. Les administrateurs ne doivent pas avoir à installer de client VPN.

        Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Passwords that contain the company name: [[s1]]

          RDP access to the Azure virtual machines: [[s2]]

          Real-time protection turned off by a local administrator: [[s3]]
        fr: |
          Mots de passe qui contiennent le nom de l'entreprise : [[s1]]

          Accès RDP aux machines virtuelles Azure : [[s2]]

          Protection en temps réel désactivée par un administrateur local : [[s3]]
      slots:
        - id: s1
          options:
            - { id: fgpp, text: { en: "AD DS fine-grained password policies", fr: "Des stratégies de mot de passe affinées AD DS" } }
            - { id: laps, text: Windows LAPS }
            - { id: pp, text: { en: "Microsoft Entra Password Protection extended to AD DS", fr: "La Protection par mot de passe Microsoft Entra étendue à AD DS" } }
            - { id: idp, text: { en: "Microsoft Entra ID Protection user risk policies", fr: "Les stratégies de risque utilisateur de Microsoft Entra ID Protection" } }
        - id: s2
          options:
            - { id: p2s, text: { en: "Azure point-to-site VPN with Microsoft Entra authentication", fr: "Un VPN point à site Azure avec authentification Microsoft Entra" } }
            - { id: bastion, text: Azure Bastion }
            - { id: appproxy, text: { en: "Microsoft Entra application proxy", fr: "Le proxy d'application Microsoft Entra" } }
        - id: s3
          options:
            - { id: bafs, text: { en: "Block at first sight", fr: "Le blocage à la première détection" } }
            - { id: cfa, text: { en: "Controlled folder access", fr: "L'accès contrôlé aux dossiers" } }
            - { id: asr, text: { en: "Attack surface reduction rules in audit mode", fr: "Des règles de réduction de la surface d'attaque en mode audit" } }
            - { id: tamper, text: { en: "Tamper protection", fr: "La protection contre les falsifications" } }
    answer:
      values: { s1: pp, s2: bastion, s3: tamper }
    explanation:
      correct:
        en: |
          Microsoft Entra Password Protection blocks known weak passwords and organization-specific terms, and Microsoft recommends extending it to AD DS for on-premises accounts. Azure Bastion secures RDP access to Azure virtual machines from the browser, without public IP addresses on the VMs and without a VPN client. Tamper protection prevents changes to important Defender Antivirus settings, such as real-time protection, even by a local administrator.
        fr: |
          La Protection par mot de passe Microsoft Entra bloque les mots de passe faibles connus et les termes propres à l'organisation, et Microsoft recommande de l'étendre à AD DS pour les comptes locaux. Azure Bastion sécurise l'accès RDP aux machines virtuelles Azure depuis le navigateur, sans adresse IP publique sur les VM et sans client VPN. La protection contre les falsifications empêche de modifier les paramètres importants de l'Antivirus Defender, comme la protection en temps réel, même par un administrateur local.
      options:
        fgpp: { en: "Fine-grained password policies set length, complexity and lockout per group; they can't ban specific words such as the company name.", fr: "Les stratégies de mot de passe affinées définissent la longueur, la complexité et le verrouillage par groupe ; elles ne peuvent pas interdire des mots précis comme le nom de l'entreprise." }
        laps: { en: "Windows LAPS randomizes local administrator passwords to stop lateral traversal; it doesn't check user passwords.", fr: "Windows LAPS rend aléatoires les mots de passe des administrateurs locaux pour limiter les déplacements latéraux ; il ne vérifie pas les mots de passe des utilisateurs." }
        p2s: { en: "A point-to-site VPN requires a VPN client on the administrators' devices, which the requirement excludes.", fr: "Un VPN point à site exige un client VPN sur les appareils des administrateurs, ce que l'exigence exclut." }
        appproxy: { en: "Application proxy publishes on-premises web applications; it isn't the control for RDP to Azure virtual machines.", fr: "Le proxy d'application publie des applications web locales ; ce n'est pas le contrôle de l'accès RDP aux machines virtuelles Azure." }
        asr: { en: "Attack surface reduction rules block risky behaviors, and in audit mode they only report; they don't stop an administrator from turning off real-time protection.", fr: "Les règles de réduction de la surface d'attaque bloquent des comportements risqués et, en mode audit, ne font que signaler ; elles n'empêchent pas un administrateur de désactiver la protection en temps réel." }
    references:
      - title: Make it hard for ransomware attacks to happen to your organization
        url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase3

  # ------------------------------------------------------------------ 8
  - id: sc100-qz-11-08
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank protects its workloads with 40 Recovery Services vaults and Backup vaults in 11 subscriptions across two Microsoft Entra tenants. The second tenant is managed from the first one through Azure Lighthouse. On-premises servers are backed up by Microsoft Azure Backup Server (MABS), and Azure Site Recovery replicates the core banking virtual machines to another region.

        The CISO has the following requirements:

        - One experience must show, across all the vaults, subscriptions and both tenants, the security level (Excellent, Good, Fair or Poor) of each vault and of its protected data sources.
        - The backup and replication jobs must be monitored from the same experience.
        - No custom report or development is allowed.

        What should you recommend?
      fr: |
        Woodgrove Bank protège ses charges de travail avec 40 coffres Recovery Services et coffres de sauvegarde dans 11 abonnements répartis sur deux locataires Microsoft Entra. Le second locataire est géré depuis le premier par Azure Lighthouse. Les serveurs locaux sont sauvegardés par Microsoft Azure Backup Server (MABS), et Azure Site Recovery réplique les machines virtuelles du système bancaire central vers une autre région.

        Le RSSI a les exigences suivantes :

        - Une seule expérience doit montrer, pour tous les coffres, tous les abonnements et les deux locataires, le niveau de sécurité (Excellent, Good, Fair ou Poor) de chaque coffre et de ses sources de données protégées.
        - Les travaux de sauvegarde et de réplication doivent être surveillés depuis la même expérience.
        - Aucun rapport personnalisé ni aucun développement n'est autorisé.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Defender for Cloud regulatory compliance with the MCSB backup and recovery controls", fr: "La conformité réglementaire de Defender for Cloud avec les contrôles de sauvegarde et récupération du MCSB" } }
        - { id: b, text: { en: "The Critical Asset Protection initiative of Microsoft Security Exposure Management", fr: "L'initiative Critical Asset Protection de Microsoft Security Exposure Management" } }
        - { id: c, text: { en: "Resiliency in Azure, the successor of Azure Business Continuity Center", fr: "Resiliency dans Azure, le successeur d'Azure Business Continuity Center" } }
        - { id: d, text: { en: "Backup reports in a Log Analytics workspace that every vault sends diagnostics to", fr: "Les rapports de sauvegarde dans un espace de travail Log Analytics alimenté par les diagnostics de chaque coffre" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Resiliency in Azure, formerly Azure Business Continuity Center, manages backup and replication across vaults, subscriptions, regions and Azure Lighthouse tenants from one experience. It computes the security level of each Azure Backup vault and protected data source in its Vaults and Security posture views, and it monitors jobs across Azure Backup and Azure Site Recovery, with no custom development.
        fr: |
          Resiliency dans Azure, anciennement Azure Business Continuity Center, gère la sauvegarde et la réplication sur les coffres, les abonnements, les régions et les locataires Azure Lighthouse depuis une seule expérience. Il calcule le niveau de sécurité de chaque coffre de la Sauvegarde Azure et de chaque source de données protégée dans ses vues Vaults et Security posture, et il surveille les travaux de la Sauvegarde Azure et d'Azure Site Recovery, sans développement personnalisé.
      options:
        a: { en: "Regulatory compliance reports the assessments mapped to the benchmark controls; it doesn't compute the Azure Backup security level of each vault or monitor backup jobs.", fr: "La conformité réglementaire présente les évaluations associées aux contrôles du benchmark ; elle ne calcule pas le niveau de sécurité de la Sauvegarde Azure de chaque coffre et ne surveille pas les travaux de sauvegarde." }
        b: { en: "The Critical Asset Protection initiative scores the protection of critical assets in exposure insights; it doesn't show vault security levels or backup and replication jobs.", fr: "L'initiative Critical Asset Protection note la protection des ressources critiques dans les exposure insights ; elle ne montre ni les niveaux de sécurité des coffres ni les travaux de sauvegarde et de réplication." }
        d: { en: "Backup reports need diagnostic settings on every vault and don't compute the vault security levels; meeting the requirement would mean building custom reports.", fr: "Les rapports de sauvegarde exigent des paramètres de diagnostic sur chaque coffre et ne calculent pas les niveaux de sécurité des coffres ; répondre à l'exigence demanderait des rapports personnalisés." }
    references:
      - title: What is Resiliency?
        url: https://learn.microsoft.com/en-us/azure/resiliency/resiliency-overview
      - title: Security levels in Resiliency
        url: https://learn.microsoft.com/en-us/azure/resiliency/security-levels-concept

  # ------------------------------------------------------------------ 9
  - id: sc100-qz-11-09
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. runs workloads in Azure, protected by Azure Backup, and in AWS, where the Amazon EC2 instances are backed up by AWS Backup. On-premises VMware virtual machines are protected by Microsoft Azure Backup Server (MABS).

        The same cloud administrator accounts, synchronized from the on-premises AD DS forest and protected by MFA, manage both the production workloads and the backups in every environment. Restores have never been tested.

        You need to recommend a secure backup and restore design that applies Microsoft's ransomware guidance consistently across the hybrid and multicloud environment.

        Which two actions should you include in the design? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. exécute des charges de travail dans Azure, protégées par la Sauvegarde Azure, et dans AWS, où les instances Amazon EC2 sont sauvegardées par AWS Backup. Les machines virtuelles VMware locales sont protégées par Microsoft Azure Backup Server (MABS).

        Les mêmes comptes d'administrateurs cloud, synchronisés depuis la forêt AD DS locale et protégés par la MFA, gèrent à la fois les charges de travail de production et les sauvegardes dans chaque environnement. Les restaurations n'ont jamais été testées.

        Vous devez recommander une conception de sauvegarde et de restauration sécurisées qui applique les recommandations de Microsoft sur les rançongiciels de façon cohérente dans l'environnement hybride et multicloud.

        Quelles sont les deux actions que vous devez inclure dans la conception ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Replicate the EC2 instances to Azure with Site Recovery, and use the replicas as their recovery copies", fr: "Répliquer les instances EC2 vers Azure avec Site Recovery, et utiliser les réplicas comme copies de récupération" } }
        - { id: b, text: { en: "Administer the backups of each environment with dedicated identities that don't manage production", fr: "Administrer les sauvegardes de chaque environnement avec des identités dédiées qui ne gèrent pas la production" } }
        - { id: c, text: { en: "Store every backup on geo-redundant storage, so that a second copy exists in another region", fr: "Stocker chaque sauvegarde sur un stockage géoredondant, pour qu'une seconde copie existe dans une autre région" } }
        - { id: d, text: { en: "Keep immutable or offline copies in each environment, and exercise restores on a regular schedule", fr: "Conserver des copies immuables ou hors ligne dans chaque environnement, et exercer les restaurations régulièrement" } }
        - { id: e, text: { en: "Encrypt the backups of all environments with customer-managed keys held by the cloud administrators", fr: "Chiffrer les sauvegardes de tous les environnements avec des clés gérées par le client et détenues par les administrateurs cloud" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The same requirements apply in every environment. Backups administered by the production accounts fall with them: an attacker who owns AD DS controls the synchronized accounts and can delete the backups everywhere, so backup administration needs separate identities. Immutable or offline copies are Microsoft's strongest protection against deliberate erasure and encryption, and regular exercises prove that the recovery time meets the BCDR goal.
        fr: |
          Les mêmes exigences s'appliquent dans chaque environnement. Des sauvegardes administrées par les comptes de production tombent avec eux : un attaquant qui contrôle AD DS contrôle les comptes synchronisés et peut supprimer les sauvegardes partout ; l'administration des sauvegardes exige donc des identités distinctes. Les copies immuables ou hors ligne sont la protection la plus forte selon Microsoft contre l'effacement et le chiffrement délibérés, et les exercices réguliers prouvent que le temps de récupération atteint l'objectif BCDR.
      options:
        a: { en: "Replication reproduces changes quickly, encrypted data included; it doesn't replace long-retention, protected backups.", fr: "La réplication reproduit vite les modifications, données chiffrées comprises ; elle ne remplace pas des sauvegardes protégées à longue rétention." }
        c: { en: "A geo-redundant copy is managed by the same accounts: a deletion or a reduced retention applies to both copies.", fr: "Une copie géoredondante est gérée par les mêmes comptes : une suppression ou une réduction de rétention s'applique aux deux copies." }
        e: { en: "Encryption doesn't stop an administrator from deleting backups, and keys held by the compromised administrators add a way to make them unreadable.", fr: "Le chiffrement n'empêche pas un administrateur de supprimer des sauvegardes, et des clés détenues par les administrateurs compromis ajoutent un moyen de les rendre illisibles." }
    references:
      - title: Prepare for ransomware attacks with a backup and recovery plan
        url: https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase1

  # ------------------------------------------------------------------ 10
  - id: sc100-qz-11-10
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. protects its Azure virtual machines with a Recovery Services vault named **RSV-Core** in a subscription named **Sub-Prod**. Soft delete uses the default settings, immutability is disabled, and multi-user authorization (MUA) isn't configured. A risk assessment states that an attacker could obtain the Owner role on Sub-Prod.

        You need to recommend a protection design for RSV-Core that meets the following requirements:

        - The recovery points must stay recoverable even if an attacker holds the Owner role on Sub-Prod.
        - When an application is retired, the backup team must still be able to reduce the retention of its backup policy, after approval by the security team.
        - RSV-Core must reach the Excellent security level of Azure Backup.

        What should you recommend?
      fr: |
        Contoso, Ltd. protège ses machines virtuelles Azure avec un coffre Recovery Services nommé **RSV-Core** dans un abonnement nommé **Sub-Prod**. La suppression réversible utilise les paramètres par défaut, l'immuabilité est désactivée et l'autorisation multi-utilisateur (MUA) n'est pas configurée. Une évaluation des risques indique qu'un attaquant pourrait obtenir le rôle Owner sur Sub-Prod.

        Vous devez recommander une conception de protection de RSV-Core qui répond aux exigences suivantes :

        - Les points de récupération doivent rester récupérables même si un attaquant détient le rôle Owner sur Sub-Prod.
        - Quand une application est retirée, l'équipe de sauvegarde doit toujours pouvoir réduire la rétention de sa stratégie de sauvegarde, après approbation de l'équipe de sécurité.
        - RSV-Core doit atteindre le niveau de sécurité Excellent de la Sauvegarde Azure.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Enable and lock immutability, and make soft delete always-on", fr: "Activer et verrouiller l'immuabilité, et rendre la suppression réversible toujours active" } }
        - { id: b, text: { en: "Make soft delete always-on, and enable MUA with a Resource Guard that the security team owns in Sub-Prod", fr: "Rendre la suppression réversible toujours active, et activer la MUA avec un Resource Guard que l'équipe de sécurité détient dans Sub-Prod" } }
        - { id: c, text: { en: "Enable immutability without locking it, and enable MUA with a Resource Guard in another tenant", fr: "Activer l'immuabilité sans la verrouiller, et activer la MUA avec un Resource Guard dans un autre locataire" } }
        - { id: d, text: { en: "Make soft delete always-on, and enable MUA with a Resource Guard that the security team owns in another tenant", fr: "Rendre la suppression réversible toujours active, et activer la MUA avec un Resource Guard que l'équipe de sécurité détient dans un autre locataire" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Always-on soft delete is irreversible, and with MUA enabled the vault reaches the Excellent level. A Resource Guard in another tenant, owned by the security team, is out of reach of an Owner of Sub-Prod, so disabling protection or deleting backup data requires the security team's approval. Reducing the retention of a policy stays possible: it is a protected operation that the security team approves, for example by granting the Backup MUA Operator role just in time.
        fr: |
          La suppression réversible toujours active est irréversible et, avec la MUA activée, le coffre atteint le niveau Excellent. Un Resource Guard dans un autre locataire, détenu par l'équipe de sécurité, est hors de portée d'un Owner de Sub-Prod : désactiver la protection ou supprimer des données de sauvegarde exige l'approbation de l'équipe de sécurité. Réduire la rétention d'une stratégie reste possible : c'est une opération protégée que l'équipe de sécurité approuve, par exemple en accordant juste-à-temps le rôle Backup MUA Operator.
      options:
        a: { en: "A locked immutable vault irreversibly blocks any reduction of retention, so the backup team could never shorten a policy, and without MUA the vault doesn't reach Excellent.", fr: "Un coffre immuable verrouillé bloque de façon irréversible toute réduction de rétention : l'équipe de sauvegarde ne pourrait jamais raccourcir une stratégie, et sans MUA le coffre n'atteint pas Excellent." }
        b: { en: "An Owner of Sub-Prod also controls a Resource Guard placed in Sub-Prod and can grant themselves the rights that bypass its approval.", fr: "Un Owner de Sub-Prod contrôle aussi un Resource Guard placé dans Sub-Prod et peut s'accorder les droits qui contournent son approbation." }
        c: { en: "Unlocked immutability and default soft delete are both reversible, so the vault doesn't reach the Excellent level despite MUA.", fr: "L'immuabilité non verrouillée et la suppression réversible par défaut sont toutes deux réversibles : le coffre n'atteint pas le niveau Excellent malgré la MUA." }
    references:
      - title: Multiuser Authorization Using Resource Guard - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
      - title: Overview of security and cyber recovery in Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/security-overview
