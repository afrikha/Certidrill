id: sc100-sr2-zt-remote-work
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. is a financial services company that has 4,000 employees, a Microsoft 365 E5 subscription, several Azure subscriptions, and an on-premises Active Directory Domain Services (AD DS) domain that syncs to Microsoft Entra ID. After the company adopted a hybrid work policy, most employees work from home on corporate and personal devices and access Microsoft 365, SaaS apps, and on-premises apps.

    The CISO asks you to recommend the Microsoft guidance on which to base a Zero Trust program for this change. The guidance must meet the following requirements:

    - Organize the program around a business outcome that executives can sponsor.
    - Cover user identities, devices, and access to apps for employees who work from any location.
    - Provide lifecycle phases from strategy definition to governance, with resources to track progress by objective.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. est une société de services financiers qui compte 4 000 employés, un abonnement Microsoft 365 E5, plusieurs abonnements Azure et un domaine Active Directory Domain Services (AD DS) local synchronisé avec Microsoft Entra ID. Depuis que la société a adopté une politique de travail hybride, la plupart des employés travaillent depuis leur domicile sur des appareils d'entreprise et personnels, et accèdent à Microsoft 365, à des applications SaaS et à des applications locales.

    Le RSSI vous demande de recommander le cadre de recommandations Microsoft sur lequel fonder un programme Confiance Zéro pour ce changement. Ce cadre doit répondre aux exigences suivantes :

    - Organiser le programme autour d'un résultat métier que la direction peut parrainer.
    - Couvrir les identités des utilisateurs, les appareils et l'accès aux applications pour des employés qui travaillent depuis n'importe quel emplacement.
    - Fournir des phases de cycle de vie, de la définition de la stratégie à la gouvernance, avec des ressources pour suivre l'avancement par objectif.
