id: sc100-sr1-personal-phones
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware, Inc. has Microsoft 365 E3 licenses, which include Microsoft Intune Plan 1 and Microsoft Entra ID P1. Proseware plans to let 800 sales employees read corporate email in the Outlook mobile app on their personal iOS and Android phones.

    You need to recommend a solution that meets the following requirements:

    - Users must not be able to paste corporate email content into personal apps or save attachments to personal storage locations.
    - The personal phones must not be enrolled in Intune or in any other mobile device management (MDM) solution.
    - Phones that don't apply these protections must be blocked from Exchange Online.
    - Administrative effort must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware, Inc. dispose de licences Microsoft 365 E3, qui incluent Microsoft Intune Plan 1 et Microsoft Entra ID P1. Proseware prévoit de permettre à 800 commerciaux de lire la messagerie de l'entreprise dans l'application Outlook mobile sur leurs téléphones iOS et Android personnels.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les utilisateurs ne doivent pas pouvoir coller le contenu des e-mails de l'entreprise dans des applications personnelles ni enregistrer les pièces jointes dans des emplacements de stockage personnels.
    - Les téléphones personnels ne doivent pas être inscrits dans Intune ni dans une autre solution de gestion des appareils mobiles (MDM).
    - Les téléphones qui n'appliquent pas ces protections doivent être bloqués pour Exchange Online.
    - L'effort d'administration doit être réduit au minimum.
