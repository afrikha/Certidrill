id: sc100-sr1-card-sharing
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has Microsoft 365 E5 licenses for all users. The finance department handles payment card data in Exchange Online, SharePoint Online, OneDrive, and Microsoft Teams. An audit found that employees sometimes send files and messages that contain credit card numbers to external partners.

    You need to recommend a solution that meets the following requirements:

    - Emails, Teams chat and channel messages, and shared SharePoint or OneDrive files that contain credit card numbers must not reach people outside the organization.
    - Employees must still be able to share this content with other Northwind employees.
    - When an action is blocked, the employee must be told why at the time of the action.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose de licences Microsoft 365 E5 pour tous ses utilisateurs. Le service financier traite des données de cartes de paiement dans Exchange Online, SharePoint Online, OneDrive et Microsoft Teams. Un audit a révélé que des employés envoient parfois à des partenaires externes des fichiers et des messages qui contiennent des numéros de carte bancaire.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les e-mails, les messages de conversation et de canal Teams ainsi que les fichiers SharePoint ou OneDrive partagés qui contiennent des numéros de carte bancaire ne doivent pas parvenir à des personnes extérieures à l'organisation.
    - Les employés doivent toujours pouvoir partager ce contenu avec d'autres employés de Northwind.
    - Quand une action est bloquée, l'employé doit en être informé, avec la raison, au moment de l'action.
