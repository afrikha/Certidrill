id: sc100-sr2-dlp-card-numbers
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has a Microsoft 365 E5 subscription. Employees store documents in SharePoint Online sites and in OneDrive, and they share some of the documents with external auditors by using sharing links. External sharing must remain enabled. Some existing and new documents contain credit card numbers.

    You need to recommend a Microsoft Purview solution that meets the following requirements:

    - Documents that contain credit card numbers, including existing documents, must not be accessible to people outside the organization.
    - Employees who share such a document must be informed by a policy tip.
    - Users must not have to classify documents manually.
    - Administrative effort must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un abonnement Microsoft 365 E5. Les employés stockent des documents dans des sites SharePoint Online et dans OneDrive, et partagent certains d'entre eux avec des auditeurs externes à l'aide de liens de partage. Le partage externe doit rester activé. Certains documents existants et nouveaux contiennent des numéros de carte bancaire.

    Vous devez recommander une solution Microsoft Purview qui répond aux exigences suivantes :

    - Les documents qui contiennent des numéros de carte bancaire, y compris les documents existants, ne doivent pas être accessibles aux personnes extérieures à l'organisation.
    - Les employés qui partagent un tel document doivent en être informés par un conseil de stratégie.
    - Les utilisateurs ne doivent pas avoir à classer les documents manuellement.
    - L'effort d'administration doit être réduit au minimum.
