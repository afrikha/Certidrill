id: sc100-sr2-guest-reviews
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. has a Microsoft Entra tenant that is licensed for Microsoft Entra ID Governance. Employees collaborate with partners in about 350 Microsoft Teams teams and Microsoft 365 groups, and the partners are invited as B2B guest users. New teams are created every week. Each team and group has at least two owners, and none of them is a dynamic group or a role-assignable group.

    You need to recommend an access review solution that meets the following requirements:

    - Every quarter, the guest membership of every team and Microsoft 365 group, including those created in the future, must be reviewed.
    - The owners of each team or group must decide whether each guest keeps access.
    - A guest who isn't explicitly approved by the end of a review must lose membership automatically.
    - Administrative effort must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. dispose d'un locataire Microsoft Entra sous licence Microsoft Entra ID Governance. Les employés collaborent avec des partenaires dans environ 350 équipes Microsoft Teams et groupes Microsoft 365, et les partenaires sont invités en tant qu'utilisateurs invités B2B. De nouvelles équipes sont créées chaque semaine. Chaque équipe et chaque groupe a au moins deux propriétaires, et aucun n'est un groupe dynamique ni un groupe assignable à un rôle.

    Vous devez recommander une solution de révision d'accès qui répond aux exigences suivantes :

    - Chaque trimestre, l'appartenance des invités à chaque équipe et à chaque groupe Microsoft 365, y compris ceux créés à l'avenir, doit être révisée.
    - Les propriétaires de chaque équipe ou groupe doivent décider si chaque invité conserve son accès.
    - Un invité qui n'est pas explicitement approuvé à la fin d'une révision doit perdre automatiquement son appartenance.
    - L'effort d'administration doit être réduit au minimum.
