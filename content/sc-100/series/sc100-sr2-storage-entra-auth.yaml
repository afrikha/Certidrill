id: sc100-sr2-storage-entra-auth
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation has an Azure Storage account named **stfinance01** that contains several blob containers of financial reports. An app that runs on Azure virtual machines reads and writes the reports, and members of a Microsoft Entra group named **Analysts** download them. One container, named **public-summaries**, is configured for anonymous read access. An audit found that account access keys and SAS tokens for stfinance01 were shared in scripts and emails.

    You need to recommend a solution that meets the following requirements:

    - Every request to the blob data in stfinance01 must be authorized with a Microsoft Entra identity, so that access can be granted and revoked per identity.
    - The account keys and SAS tokens that were shared must stop granting access.
    - The app must not store any secret.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation dispose d'un compte Stockage Azure nommé **stfinance01** qui contient plusieurs conteneurs de blobs de rapports financiers. Une application exécutée sur des machines virtuelles Azure lit et écrit les rapports, et les membres d'un groupe Microsoft Entra nommé **Analysts** les téléchargent. Un conteneur, nommé **public-summaries**, est configuré pour l'accès en lecture anonyme. Un audit a révélé que des clés d'accès du compte et des jetons SAS de stfinance01 ont été partagés dans des scripts et des e-mails.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Chaque requête vers les données blob de stfinance01 doit être autorisée avec une identité Microsoft Entra, afin que l'accès puisse être accordé et révoqué par identité.
    - Les clés de compte et les jetons SAS qui ont été partagés ne doivent plus donner accès.
    - L'application ne doit stocker aucun secret.
