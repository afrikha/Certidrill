id: sc100-sr1-partner-guests
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has a Microsoft Entra tenant and Microsoft Entra ID Governance licenses for all its users. Woodgrove collaborates with Fabrikam on a two-year project. About 120 Fabrikam employees were invited as B2B guest users. The guests and 40 Woodgrove employees are direct members of a security group named **PRJ-Fabrikam**, which grants access to a SharePoint site and to a line-of-business application. Two Woodgrove project managers are the owners of PRJ-Fabrikam.

    You need to recommend a solution that meets the following requirements:

    - Every three months, the owners of PRJ-Fabrikam must confirm that each guest still needs access.
    - A guest whose access is not confirmed by the owners must lose access to the project resources without any manual action.
    - The membership of Woodgrove employees must not be reviewed.
    - Administrative effort must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un locataire Microsoft Entra et de licences Microsoft Entra ID Governance pour tous ses utilisateurs. Woodgrove collabore avec Fabrikam sur un projet de deux ans. Environ 120 employés de Fabrikam ont été invités en tant qu'utilisateurs invités B2B. Les invités et 40 employés de Woodgrove sont membres directs d'un groupe de sécurité nommé **PRJ-Fabrikam**, qui donne accès à un site SharePoint et à une application métier. Deux chefs de projet de Woodgrove sont les propriétaires de PRJ-Fabrikam.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Tous les trois mois, les propriétaires de PRJ-Fabrikam doivent confirmer que chaque invité a toujours besoin de son accès.
    - Un invité dont l'accès n'est pas confirmé par les propriétaires doit perdre l'accès aux ressources du projet sans aucune action manuelle.
    - L'appartenance des employés de Woodgrove ne doit pas être révisée.
    - L'effort d'administration doit être réduit au minimum.
