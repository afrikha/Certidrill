id: sc100-sr2-web-filtering
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has 2,500 users who have Windows 11 devices that are Microsoft Entra joined and managed by Microsoft Intune. Most users work remotely and connect directly to the internet. The other users work at the headquarters, where web traffic goes through an on-premises proxy that the company plans to retire. The company has Microsoft Entra ID P1 and Microsoft Entra Suite licenses for all users.

    You need to recommend a solution that meets the following requirements:

    - Block access to the websites in the **Gambling** web category for all users, on any network.
    - Enforce the block in a cloud-delivered secure web gateway that applies policies based on the user's Microsoft Entra identity.
    - Don't require a VPN connection to the headquarters.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys compte 2 500 utilisateurs qui disposent d'appareils Windows 11 joints à Microsoft Entra et gérés par Microsoft Intune. La plupart des utilisateurs travaillent à distance et se connectent directement à Internet. Les autres travaillent au siège, où le trafic web passe par un proxy local que la société prévoit de retirer. La société dispose de licences Microsoft Entra ID P1 et Microsoft Entra Suite pour tous les utilisateurs.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Bloquer l'accès aux sites web de la catégorie web **Gambling** pour tous les utilisateurs, sur n'importe quel réseau.
    - Appliquer le blocage dans une passerelle web sécurisée fournie depuis le cloud, qui applique des stratégies selon l'identité Microsoft Entra de l'utilisateur.
    - Ne pas exiger de connexion VPN vers le siège.
