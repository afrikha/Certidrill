id: sc100-sr1-shadow-ai
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. has 6,000 employees who have Microsoft 365 E5 licenses. All employees use Windows 11 devices that are onboarded to Microsoft Defender for Endpoint and work either from the office or from home. Litware builds its own AI applications in Azure and Amazon Web Services (AWS).

    Litware is defining a strategy for secure AI adoption. An internal audit found that employees paste customer data into public generative AI websites. As the first step of the strategy, you need to recommend a solution that meets the following requirements:

    - Identify the generative AI software as a service (SaaS) apps that employees use from their devices.
    - Assess each of these apps against security, compliance, and legal criteria.
    - Block the apps that the security team does not approve on the employees' devices, at the office and at home.
    - Use the existing licenses.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. compte 6 000 employés qui disposent de licences Microsoft 365 E5. Tous les employés utilisent des appareils Windows 11 intégrés à Microsoft Defender for Endpoint et travaillent au bureau ou à domicile. Litware développe ses propres applications d'IA dans Azure et dans Amazon Web Services (AWS).

    Litware définit une stratégie d'adoption sécurisée de l'IA. Un audit interne a révélé que des employés collent des données client dans des sites web publics d'IA générative. Comme première étape de la stratégie, vous devez recommander une solution qui répond aux exigences suivantes :

    - Identifier les applications SaaS (software as a service) d'IA générative que les employés utilisent depuis leurs appareils.
    - Évaluer chacune de ces applications selon des critères de sécurité, de conformité et juridiques.
    - Bloquer sur les appareils des employés, au bureau et à domicile, les applications que l'équipe de sécurité n'approuve pas.
    - Utiliser les licences existantes.
