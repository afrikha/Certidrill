id: sc100-sr1-contractor-web
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has 3,000 users who work from offices, from home, and while traveling. All users have Microsoft Entra Suite licenses and Windows 11 devices that are joined to Microsoft Entra ID. The Global Secure Access client is deployed to every device. An on-premises web proxy filters internet traffic only for users who are connected to the corporate VPN.

    Tailspin plans to retire the VPN. You need to recommend a solution that meets the following requirements:

    - Members of a group named **Contractors** must be blocked from websites in the **Gambling** web category, wherever they work.
    - Internet access of the other users must not change.
    - Internet traffic must not be routed through the on-premises network.
    - Administrative effort must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys compte 3 000 utilisateurs qui travaillent au bureau, à domicile et en déplacement. Tous les utilisateurs disposent de licences Microsoft Entra Suite et d'appareils Windows 11 joints à Microsoft Entra ID. Le client Global Secure Access est déployé sur chaque appareil. Un proxy web local filtre le trafic Internet uniquement pour les utilisateurs connectés au VPN de l'entreprise.

    Tailspin prévoit de mettre hors service le VPN. Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les membres d'un groupe nommé **Contractors** doivent être bloqués sur les sites web de la catégorie web **Gambling**, où qu'ils travaillent.
    - L'accès Internet des autres utilisateurs ne doit pas changer.
    - Le trafic Internet ne doit pas être acheminé par le réseau local.
    - L'effort d'administration doit être réduit au minimum.
