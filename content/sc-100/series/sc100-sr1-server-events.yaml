id: sc100-sr1-server-events
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation uses Microsoft Sentinel with a Log Analytics workspace named **LAW-SOC** in Azure. Adatum has 300 Windows Server 2022 servers in two on-premises datacenters and 150 Windows Server 2022 instances in Amazon Elastic Compute Cloud (Amazon EC2). No monitoring agent is installed on these servers.

    You need to recommend a solution that meets the following requirements:

    - The Windows security events of every server must be collected in LAW-SOC.
    - Only a currently supported agent can be used.
    - The SOC team must define from Azure, in one place, which security events are collected from the servers.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation utilise Microsoft Sentinel avec un espace de travail Log Analytics nommé **LAW-SOC** dans Azure. Adatum dispose de 300 serveurs Windows Server 2022 dans deux centres de données locaux et de 150 instances Windows Server 2022 dans Amazon Elastic Compute Cloud (Amazon EC2). Aucun agent de surveillance n'est installé sur ces serveurs.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les événements de sécurité Windows de chaque serveur doivent être collectés dans LAW-SOC.
    - Seul un agent actuellement pris en charge peut être utilisé.
    - L'équipe SOC doit définir depuis Azure, en un seul endroit, quels événements de sécurité sont collectés sur les serveurs.
