id: dp800-1a-json-index-overlap
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Azure SQL database that contains a table named **Sales.Orders**. The table has a clustered primary key and a json column named **OrderDoc**. Queries filter on several properties under `$.customer` (such as id, name and segment) and on `$.status`.

    You run the following statement, and it fails.

    ```sql
    CREATE JSON INDEX JX_Orders_OrderDoc
        ON Sales.Orders (OrderDoc)
        FOR ('$.customer', '$.customer.id', '$.status');
    ```

    You need to index all the properties that the queries filter on.

    What should you do?
  fr: |
    Adatum dispose d'une base de données Azure SQL qui contient une table nommée **Sales.Orders**. La table a une clé primaire cluster et une colonne json nommée **OrderDoc**. Les requêtes filtrent sur plusieurs propriétés situées sous `$.customer` (comme id, name et segment) et sur `$.status`.

    Vous exécutez l'instruction suivante, qui échoue.

    ```sql
    CREATE JSON INDEX JX_Orders_OrderDoc
        ON Sales.Orders (OrderDoc)
        FOR ('$.customer', '$.customer.id', '$.status');
    ```

    Vous devez indexer toutes les propriétés sur lesquelles les requêtes filtrent.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove '$.customer.id' from the FOR clause.", fr: "Supprimer '$.customer.id' de la clause FOR." } }
    - { id: b, text: { en: "Remove '$.customer' from the FOR clause.", fr: "Supprimer '$.customer' de la clause FOR." } }
    - { id: c, text: { en: "Create a second JSON index on OrderDoc for '$.customer.id'.", fr: "Créer un second index JSON sur OrderDoc pour '$.customer.id'." } }
    - { id: d, text: { en: "Add WITH (ONLINE = ON) to the statement.", fr: "Ajouter WITH (ONLINE = ON) à l'instruction." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The paths of a JSON index can't overlap: '$.customer' and '$.customer.id' raise an error. Paths are indexed recursively, so '$.customer' already covers id, name, segment and every other property below it; removing '$.customer.id' keeps all the filtered properties indexed.
    fr: |
      Les chemins d'un index JSON ne peuvent pas se chevaucher : '$.customer' et '$.customer.id' génèrent une erreur. Les chemins sont indexés de manière récursive : '$.customer' couvre déjà id, name, segment et toutes les autres propriétés situées en dessous. Supprimer '$.customer.id' conserve donc l'indexation de toutes les propriétés filtrées.
  options:
    b: { en: "Without '$.customer', only id would be indexed under the customer object, not name or segment.", fr: "Sans '$.customer', seul id serait indexé sous l'objet client, pas name ni segment." }
    c: { en: "A json column can have only one JSON index.", fr: "Une colonne json ne peut avoir qu'un seul index JSON." }
    d: { en: "JSON indexes are built offline only; ONLINE = ON raises an error and doesn't fix the overlapping paths.", fr: "Les index JSON sont créés hors connexion uniquement ; ONLINE = ON génère une erreur et ne corrige pas le chevauchement des chemins." }
references:
  - title: CREATE JSON INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-json-index-transact-sql
