id: dp800-1c-corr-cross-apply-top
objective: "1.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have the tables **Sales.Customer** (CustomerID, FullName) and **Sales.Orders** (OrderID, CustomerID, OrderDate).

    You need a query that returns the two most recent orders of each customer. Customers that have no orders must not be returned.

    How should you complete the Transact-SQL statement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des tables **Sales.Customer** (CustomerID, FullName) et **Sales.Orders** (OrderID, CustomerID, OrderDate).

    Vous avez besoin d'une requête qui renvoie les deux commandes les plus récentes de chaque client. Les clients sans commande ne doivent pas être renvoyés.

    Comment devez-vous compléter l'instruction Transact-SQL ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT c.CustomerID, c.FullName, t.OrderID, t.OrderDate
    FROM Sales.Customer AS c
    [[apply]] (SELECT [[top]] o.OrderID, o.OrderDate
               FROM Sales.Orders AS o
               WHERE [[corr]]
               ORDER BY o.OrderDate DESC, o.OrderID DESC) AS t;
  slots:
    - id: apply
      options:
        - { id: cross, text: "CROSS APPLY" }
        - { id: outer, text: "OUTER APPLY" }
        - { id: inner, text: "INNER JOIN" }
        - { id: left, text: "LEFT JOIN" }
    - id: top
      options:
        - { id: top2, text: "TOP (2)" }
        - { id: top1, text: "TOP (1)" }
        - { id: pct, text: "TOP (2) PERCENT" }
        - { id: distinct, text: "DISTINCT" }
    - id: corr
      options:
        - { id: outerref, text: "o.CustomerID = c.CustomerID" }
        - { id: selfref, text: "o.CustomerID = t.CustomerID" }
        - { id: notnull, text: "o.CustomerID IS NOT NULL" }
answer:
  values: { apply: cross, top: top2, corr: outerref }
explanation:
  correct:
    en: |
      APPLY evaluates the right table expression once for each row of the left table source, so the derived table can reference c.CustomerID. CROSS APPLY returns no row for a customer whose derived table is empty, which removes the customers without orders. TOP (2) with ORDER BY returns the two most recent orders.
    fr: |
      APPLY évalue l'expression de table de droite pour chaque ligne de la source de table de gauche : la table dérivée peut donc référencer c.CustomerID. CROSS APPLY ne renvoie aucune ligne pour un client dont la table dérivée est vide, ce qui exclut les clients sans commande. TOP (2) avec ORDER BY renvoie les deux commandes les plus récentes.
  options:
    outer: { en: "OUTER APPLY returns one row with NULL order columns for customers that have no orders.", fr: "OUTER APPLY renvoie une ligne avec des colonnes de commande NULL pour les clients sans commande." }
    inner: { en: "A joined derived table can't reference columns of the other table, and a JOIN requires an ON clause.", fr: "Une table dérivée jointe ne peut pas référencer les colonnes de l'autre table, et une jointure exige une clause ON." }
    left: { en: "A joined derived table can't reference c.CustomerID, and a JOIN requires an ON clause.", fr: "Une table dérivée jointe ne peut pas référencer c.CustomerID, et une jointure exige une clause ON." }
    top1: { en: "TOP (1) returns only the most recent order.", fr: "TOP (1) ne renvoie que la commande la plus récente." }
    pct: { en: "TOP (2) PERCENT returns a percentage of the customer's orders, not two orders.", fr: "TOP (2) PERCENT renvoie un pourcentage des commandes du client, pas deux commandes." }
    distinct: { en: "DISTINCT doesn't limit the number of rows per customer.", fr: "DISTINCT ne limite pas le nombre de lignes par client." }
    selfref: { en: "t is the alias of the derived table itself; it can't be referenced inside its own definition.", fr: "t est l'alias de la table dérivée elle-même ; il ne peut pas être référencé dans sa propre définition." }
    notnull: { en: "Without correlation to c, every customer gets the two most recent orders of the whole table.", fr: "Sans corrélation avec c, chaque client reçoit les deux commandes les plus récentes de toute la table." }
references:
  - title: FROM clause plus JOIN, APPLY, PIVOT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/from-transact-sql
