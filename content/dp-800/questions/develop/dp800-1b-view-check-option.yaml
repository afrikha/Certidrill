id: dp800-1b-view-check-option
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains the following view.

    ```sql
    CREATE VIEW Sales.vWestCustomer
    AS
    SELECT CustomerID, FullName, Region, CreditLimit
    FROM Sales.Customer
    WHERE Region = 'West';
    ```

    The regional sales application of the West team inserts and updates customers only through the view. Some users of the application changed the Region value of customers to 'East', and the rows disappeared from the application. Other applications update Sales.Customer directly and must still be able to set any region.

    You need to ensure that the inserts and updates made through the view cannot produce rows that the view does not return.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient la vue suivante.

    ```sql
    CREATE VIEW Sales.vWestCustomer
    AS
    SELECT CustomerID, FullName, Region, CreditLimit
    FROM Sales.Customer
    WHERE Region = 'West';
    ```

    L'application commerciale de l'équipe West insère et modifie les clients uniquement par la vue. Des utilisateurs de l'application ont remplacé la valeur Region de certains clients par 'East', et les lignes ont disparu de l'application. D'autres applications modifient directement Sales.Customer et doivent toujours pouvoir définir n'importe quelle région.

    Vous devez vous assurer que les insertions et les mises à jour effectuées par la vue ne peuvent pas produire de lignes que la vue ne renvoie pas.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a CHECK constraint (Region = 'West') to Sales.Customer.", fr: "Ajouter une contrainte CHECK (Region = 'West') à Sales.Customer." } }
    - { id: b, text: { en: "Alter the view and add WITH SCHEMABINDING.", fr: "Modifier la vue et ajouter WITH SCHEMABINDING." } }
    - { id: c, text: { en: "Alter the view and add WITH VIEW_METADATA.", fr: "Modifier la vue et ajouter WITH VIEW_METADATA." } }
    - { id: d, text: { en: "Alter the view and add WITH CHECK OPTION.", fr: "Modifier la vue et ajouter WITH CHECK OPTION." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      WITH CHECK OPTION forces every data modification statement run against the view to follow the criteria of the view's SELECT statement, so an UPDATE that sets Region to 'East' through the view fails. The option applies only to modifications made through the view, so the applications that update Sales.Customer directly are not affected.
    fr: |
      WITH CHECK OPTION oblige chaque instruction de modification de données exécutée sur la vue à respecter les critères de l'instruction SELECT de la vue : un UPDATE qui définit Region sur 'East' par la vue échoue. L'option ne s'applique qu'aux modifications effectuées par la vue : les applications qui modifient directement Sales.Customer ne sont pas affectées.
  options:
    a: { en: "A CHECK constraint on the table would also block the other applications, which must be able to set any region.", fr: "Une contrainte CHECK sur la table bloquerait aussi les autres applications, qui doivent pouvoir définir n'importe quelle région." }
    b: { en: "Schema binding protects the base table schema from changes; it does not check the rows modified through the view.", fr: "La liaison au schéma protège le schéma de la table de base contre les modifications ; elle ne vérifie pas les lignes modifiées par la vue." }
    c: { en: "VIEW_METADATA changes the metadata returned to client APIs; it does not validate modified rows.", fr: "VIEW_METADATA modifie les métadonnées renvoyées aux API clientes ; elle ne valide pas les lignes modifiées." }
references:
  - title: CREATE VIEW (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-view-transact-sql
