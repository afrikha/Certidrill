status: draft
stem:
  en: You create a sequence and use it in a computed column of each table.
  fr: Vous créez une séquence et l'utilisez dans une colonne calculée de chaque table.
body:
  solution:
    en: |
      You create the following sequence:

      ```sql
      CREATE SEQUENCE Sales.OrderNumber AS int START WITH 500000 INCREMENT BY 1;
      ```

      In the `CREATE TABLE` statement of each table, you define the column as follows:

      ```sql
      OrderNo AS (NEXT VALUE FOR Sales.OrderNumber) PERSISTED NOT NULL PRIMARY KEY
      ```
    fr: |
      Vous créez la séquence suivante :

      ```sql
      CREATE SEQUENCE Sales.OrderNumber AS int START WITH 500000 INCREMENT BY 1;
      ```

      Dans l'instruction `CREATE TABLE` de chaque table, vous définissez la colonne comme suit :

      ```sql
      OrderNo AS (NEXT VALUE FOR Sales.OrderNumber) PERSISTED NOT NULL PRIMARY KEY
      ```
answer: { value: false }
explanation:
  correct:
    en: The sequence itself is correct, but NEXT VALUE FOR cannot be used in a computed column, a view or a user-defined function, so the CREATE TABLE statements fail. The supported way to assign a sequence value automatically is a DEFAULT constraint that calls NEXT VALUE FOR.
    fr: "La séquence elle-même est correcte, mais NEXT VALUE FOR ne peut pas être utilisée dans une colonne calculée, une vue ou une fonction définie par l'utilisateur : les instructions CREATE TABLE échouent. La méthode prise en charge pour attribuer automatiquement une valeur de séquence est une contrainte DEFAULT qui appelle NEXT VALUE FOR."
references:
  - title: NEXT VALUE FOR (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/next-value-for-transact-sql
