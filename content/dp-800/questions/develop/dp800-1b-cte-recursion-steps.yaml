id: dp800-1b-cte-recursion-steps
objective: "1.3.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You are explaining to a junior developer at Tailspin Toys how the Database Engine evaluates a recursive CTE that lists the categories of a product catalog, from the root categories down to the leaf categories.

    Which four steps describe the evaluation in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Vous expliquez à un développeur débutant de Tailspin Toys comment le moteur de base de données évalue une CTE récursive qui liste les catégories d'un catalogue de produits, des catégories racines jusqu'aux catégories feuilles.

    Quelles sont les quatre étapes qui décrivent l'évaluation dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: anchor, text: { en: "Run the anchor member once to produce the initial result set.", fr: "Exécuter une fois le membre d'ancrage pour produire le jeu de résultats initial." } }
    - { id: recursive, text: { en: "Run the recursive member with the rows of the previous iteration as input.", fr: "Exécuter le membre récursif avec les lignes de l'itération précédente comme entrée." } }
    - { id: repeat, text: { en: "Repeat the recursive member until it returns no rows.", fr: "Répéter le membre récursif jusqu'à ce qu'il ne renvoie aucune ligne." } }
    - { id: combine, text: { en: "Combine the anchor result and the results of all iterations with UNION ALL and return them.", fr: "Combiner le résultat de l'ancrage et les résultats de toutes les itérations avec UNION ALL et les renvoyer." } }
    - { id: dedupe, text: { en: "Remove the duplicate rows from each iteration before the next iteration starts.", fr: "Supprimer les lignes en double de chaque itération avant le début de l'itération suivante." } }
    - { id: leaves, text: { en: "Run the recursive member first to find the leaf categories.", fr: "Exécuter d'abord le membre récursif pour trouver les catégories feuilles." } }
answer:
  sequence: [ anchor, recursive, repeat, combine ]
explanation:
  correct:
    en: |
      The anchor member runs once and produces the initial rows. The recursive member then runs repeatedly, each time with the output of the previous iteration as its input, and the recursion stops when an iteration returns no rows. UNION ALL combines the anchor result and all iterations into the final result set.
    fr: |
      Le membre d'ancrage s'exécute une fois et produit les lignes initiales. Le membre récursif s'exécute ensuite de manière répétée, chaque fois avec la sortie de l'itération précédente comme entrée, et la récursivité s'arrête quand une itération ne renvoie aucune ligne. UNION ALL combine le résultat de l'ancrage et toutes les itérations dans le jeu de résultats final.
  options:
    dedupe: { en: "UNION ALL does not remove duplicates during the recursive steps; it concatenates all intermediate results.", fr: "UNION ALL ne supprime pas les doublons pendant les étapes récursives ; il concatène tous les résultats intermédiaires." }
    leaves: { en: "The recursive member needs the rows produced by the anchor member, so the anchor member always runs first.", fr: "Le membre récursif a besoin des lignes produites par le membre d'ancrage : le membre d'ancrage s'exécute toujours en premier." }
references:
  - title: WITH common_table_expression (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/with-common-table-expression-transact-sql
