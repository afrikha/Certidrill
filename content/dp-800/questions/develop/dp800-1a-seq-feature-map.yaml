id: dp800-1a-seq-feature-map
objective: "1.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has a sequence named **Sales.DocNumber** and several numbering requirements.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une séquence nommée **Sales.DocNumber** et de plusieurs exigences de numérotation.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: identity, text: { en: "IDENTITY property", fr: "Propriété IDENTITY" } }
    - { id: variable, text: "DECLARE @n bigint = NEXT VALUE FOR Sales.DocNumber;" }
    - { id: range, text: sys.sp_sequence_get_range }
    - { id: over, text: "NEXT VALUE FOR Sales.DocNumber OVER (ORDER BY ...)" }
    - { id: guid, text: "NEWSEQUENTIALID()" }
    - { id: cycle, text: "ALTER SEQUENCE ... CYCLE" }
  targets:
    - id: before
      text: { en: "Obtain an order number in a procedure before inserting the order header and its lines", fr: "Obtenir un numéro de commande dans une procédure avant d'insérer l'en-tête et les lignes de la commande" }
    - id: block
      text: { en: "Reserve 1,000 consecutive numbers in one call for a batch that runs offline", fr: "Réserver en un seul appel 1 000 numéros consécutifs pour un lot qui s'exécute hors connexion" }
    - id: ordered
      text: { en: "Number the rows returned by a SELECT statement in product-name order by using the shared sequence", fr: "Numéroter les lignes renvoyées par une instruction SELECT dans l'ordre des noms de produits à l'aide de la séquence partagée" }
    - id: single
      text: { en: "Auto-number the rows of one table without creating any other database object", fr: "Numéroter automatiquement les lignes d'une table sans créer d'autre objet de base de données" }
answer:
  mapping: { before: variable, block: range, ordered: over, single: identity }
explanation:
  correct:
    en: |
      NEXT VALUE FOR assigned to a variable returns a number before any row exists, which IDENTITY can't do. sys.sp_sequence_get_range reserves several values at once. NEXT VALUE FOR ... OVER (ORDER BY ...) generates values in the order of another column in a SELECT. For one table only, IDENTITY needs no separate object.
    fr: |
      NEXT VALUE FOR affecté à une variable renvoie un numéro avant qu'une ligne existe, ce que IDENTITY ne permet pas. sys.sp_sequence_get_range réserve plusieurs valeurs à la fois. NEXT VALUE FOR ... OVER (ORDER BY ...) génère des valeurs dans l'ordre d'une autre colonne dans un SELECT. Pour une seule table, IDENTITY ne nécessite aucun objet distinct.
  options:
    guid: { en: "NEWSEQUENTIALID() generates uniqueidentifier values, not order numbers.", fr: "NEWSEQUENTIALID() génère des valeurs uniqueidentifier, pas des numéros de commande." }
    cycle: { en: "CYCLE makes the sequence restart at its minimum after its maximum, which none of the requirements asks for.", fr: "CYCLE fait recommencer la séquence à son minimum après son maximum, ce qu'aucune exigence ne demande." }
references:
  - title: Sequence Numbers
    url: https://learn.microsoft.com/en-us/sql/relational-databases/sequence-numbers/sequence-numbers
