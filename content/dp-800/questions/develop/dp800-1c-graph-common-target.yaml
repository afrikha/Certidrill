id: dp800-1c-graph-common-target
objective: "1.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a node table named **Social.Person** and an edge table named **Social.Follows**. Each edge goes from the follower to the person who is followed.

    You write the following query.

    ```sql
    SELECT p1.FullName AS PersonA, p2.FullName AS PersonB,
           x.FullName AS FollowedAccount
    FROM Social.Person AS p1, Social.Follows AS f1, Social.Person AS x,
         Social.Follows AS f2, Social.Person AS p2
    WHERE <condition>
      AND p1.PersonID < p2.PersonID;
    ```

    You need to return the pairs of people who both follow the same account.

    Which two conditions can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table de nœuds nommée **Social.Person** et une table d'arêtes nommée **Social.Follows**. Chaque arête va de l'abonné vers la personne suivie.

    Vous écrivez la requête suivante.

    ```sql
    SELECT p1.FullName AS PersonA, p2.FullName AS PersonB,
           x.FullName AS FollowedAccount
    FROM Social.Person AS p1, Social.Follows AS f1, Social.Person AS x,
         Social.Follows AS f2, Social.Person AS p2
    WHERE <condition>
      AND p1.PersonID < p2.PersonID;
    ```

    Vous devez renvoyer les paires de personnes qui suivent toutes deux le même compte.

    Quelles sont les deux conditions que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`MATCH(p1-(f1)->x<-(f2)-p2)`" }
    - { id: b, text: "`MATCH(p1-(f1)->x-(f2)->p2)`" }
    - { id: c, text: "`MATCH(p1-(f1)->x AND p2-(f2)->x)`" }
    - { id: d, text: "`MATCH(p1-(f1)->x<-(f1)-p2)`" }
    - { id: e, text: "`MATCH(p1-(f1)->x OR p2-(f2)->x)`" }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Both people point to the same node x. You can write it as one pattern whose second arrow is reversed, p1-(f1)->x<-(f2)-p2, or as two patterns joined by AND inside MATCH. Each hop uses its own edge alias.
    fr: |
      Les deux personnes pointent vers le même nœud x. Vous pouvez l'écrire sous forme d'un seul modèle dont la seconde flèche est inversée, p1-(f1)->x<-(f2)-p2, ou de deux modèles reliés par AND dans MATCH. Chaque saut utilise son propre alias d'arête.
  options:
    b: { en: "This chain returns people followed by someone that p1 follows, not two followers of the same account.", fr: "Cette chaîne renvoie les personnes suivies par quelqu'un que p1 suit, pas deux abonnés du même compte." }
    d: { en: "The edge alias f1 is repeated, which isn't allowed in MATCH.", fr: "L'alias d'arête f1 est répété, ce qui n'est pas autorisé dans MATCH." }
    e: { en: "OR isn't supported in a MATCH pattern.", fr: "OR n'est pas pris en charge dans un modèle MATCH." }
references:
  - title: MATCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/match-sql-graph
