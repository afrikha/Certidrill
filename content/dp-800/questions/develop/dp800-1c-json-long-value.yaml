id: dp800-1c-json-long-value
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 database that contains a table named **Catalog.ProductDoc**. The table has an int column named ProductID and an nvarchar(max) column named Doc that stores a JSON document per product.

    The `$.description` property is a string that can be longer than 4,000 characters. The following expression returns NULL for those products.

    ```sql
    JSON_VALUE(d.Doc, '$.description')
    ```

    You need to return the complete description of every product as an nvarchar(max) value.

    What should you use?
  fr: |
    Vous disposez d'une base de données SQL Server 2022 qui contient une table nommée **Catalog.ProductDoc**. La table contient une colonne int nommée ProductID et une colonne nvarchar(max) nommée Doc qui stocke un document JSON par produit.

    La propriété `$.description` est une chaîne qui peut dépasser 4 000 caractères. L'expression suivante renvoie NULL pour ces produits.

    ```sql
    JSON_VALUE(d.Doc, '$.description')
    ```

    Vous devez renvoyer la description complète de chaque produit sous forme de valeur nvarchar(max).

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: "`JSON_QUERY(d.Doc, '$.description')`"
    - id: b
      text: "`JSON_VALUE(d.Doc, 'strict $.description')`"
    - id: c
      text: "`CROSS APPLY OPENJSON(d.Doc) WITH (Description nvarchar(max) '$.description' AS JSON) AS j`"
    - id: d
      text: "`CROSS APPLY OPENJSON(d.Doc) WITH (Description nvarchar(max) '$.description') AS j`"
answer: { optionId: d }
explanation:
  correct:
    en: |
      JSON_VALUE returns nvarchar(4000); in the default lax mode, it returns NULL when the value is longer than 4,000 characters. OPENJSON with an explicit schema can return the property as nvarchar(max), which is the documented approach for long scalar values. The RETURNING clause of JSON_VALUE isn't available in SQL Server 2022.
    fr: |
      JSON_VALUE renvoie un nvarchar(4000) ; dans le mode lax par défaut, il renvoie NULL quand la valeur dépasse 4 000 caractères. OPENJSON avec un schéma explicite peut renvoyer la propriété en nvarchar(max), ce qui est l'approche documentée pour les valeurs scalaires longues. La clause RETURNING de JSON_VALUE n'est pas disponible dans SQL Server 2022.
  options:
    a: { en: "JSON_QUERY returns objects and arrays; for a scalar string it returns NULL in lax mode.", fr: "JSON_QUERY renvoie des objets et des tableaux ; pour une chaîne scalaire, il renvoie NULL en mode lax." }
    b: { en: "In strict mode, a value longer than 4,000 characters raises an error instead of returning NULL.", fr: "En mode strict, une valeur de plus de 4 000 caractères lève une erreur au lieu de renvoyer NULL." }
    c: { en: "AS JSON returns objects and arrays; for a scalar string, the column is NULL in lax mode.", fr: "AS JSON renvoie des objets et des tableaux ; pour une chaîne scalaire, la colonne est NULL en mode lax." }
references:
  - title: JSON_VALUE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-value-transact-sql
  - title: OPENJSON (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/openjson-transact-sql
