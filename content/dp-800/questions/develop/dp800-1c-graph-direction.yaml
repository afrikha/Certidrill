id: dp800-1c-graph-direction
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a node table named **Social.Person** and an edge table named **Social.Follows**. Each edge goes from the person who follows to the person who is followed.

    You need to return the names of the people that Ana follows. You write the following query.

    ```sql
    SELECT p2.FullName
    FROM Social.Person AS p1, Social.Follows AS f, Social.Person AS p2
    WHERE <condition>;
    ```

    Which condition should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table de nœuds nommée **Social.Person** et une table d'arêtes nommée **Social.Follows**. Chaque arête va de la personne qui suit vers la personne suivie.

    Vous devez renvoyer les noms des personnes qu'Ana suit. Vous écrivez la requête suivante.

    ```sql
    SELECT p2.FullName
    FROM Social.Person AS p1, Social.Follows AS f, Social.Person AS p2
    WHERE <condition>;
    ```

    Quelle condition devez-vous utiliser ?
body:
  options:
    - { id: a, text: "`MATCH(p1-(f)->p2) AND p2.FullName = N'Ana'`" }
    - { id: b, text: "`MATCH(p2-(f)->p1) AND p1.FullName = N'Ana'`" }
    - { id: c, text: "`MATCH(p1-(f)->p2) AND p1.FullName = N'Ana'`" }
    - { id: d, text: "`MATCH(p1-(f)-p2) AND p1.FullName = N'Ana'`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In MATCH, the arrow follows the direction of the edge, from $from_id to $to_id. With p1-(f)->p2 and p1 set to Ana, p2 is every person that Ana follows, which is the column the query returns.
    fr: |
      Dans MATCH, la flèche suit le sens de l'arête, de $from_id vers $to_id. Avec p1-(f)->p2 et p1 égal à Ana, p2 représente chaque personne qu'Ana suit, c'est-à-dire la colonne renvoyée par la requête.
  options:
    a: { en: "Here p2 is Ana, so the query returns Ana once per follower instead of the people she follows.", fr: "Ici p2 est Ana : la requête renvoie Ana une fois par abonné au lieu des personnes qu'elle suit." }
    b: { en: "This pattern goes from p2 to Ana, so p2 lists Ana's followers.", fr: "Ce modèle va de p2 vers Ana : p2 liste donc les abonnés d'Ana." }
    d: { en: "An edge must have an explicit direction in MATCH; a pattern without an arrow isn't valid.", fr: "Une arête doit avoir un sens explicite dans MATCH ; un modèle sans flèche n'est pas valide." }
references:
  - title: MATCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/match-sql-graph
