id: dp800-1a-columnstore-facts
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys stores flight telemetry in a table named **Ops.Telemetry** that has a clustered columnstore index. Data is loaded every night by a bulk insert process.

    Which two statements about the table are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys stocke la télémétrie des vols dans une table nommée **Ops.Telemetry** dotée d'un index columnstore cluster. Les données sont chargées chaque nuit par un processus d'insertion en bloc.

    Quelles sont les deux affirmations vraies concernant la table ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each rowgroup of the index holds at most 1,048,576 rows.", fr: "Chaque rowgroup de l'index contient au plus 1 048 576 lignes." } }
    - { id: b, text: { en: "A bulk load batch of 102,400 to 1,048,576 rows goes directly into a compressed rowgroup.", fr: "Un lot de chargement en bloc de 102 400 à 1 048 576 lignes va directement dans un rowgroup compressé." } }
    - { id: c, text: { en: "Deleting rows from a compressed rowgroup immediately frees their storage.", fr: "La suppression de lignes d'un rowgroup compressé libère immédiatement leur stockage." } }
    - { id: d, text: { en: "The table can't have any nonclustered rowstore index.", fr: "La table ne peut avoir aucun index rowstore non cluster." } }
    - { id: e, text: { en: "Queries on the columnstore index are processed in row mode only.", fr: "Les requêtes sur l'index columnstore sont traitées uniquement en mode ligne." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      A rowgroup holds up to 1,048,576 rows. A bulk load of at least 102,400 rows is compressed directly into columnstore rowgroups; smaller batches go to the delta store, which the tuple mover compresses later.
    fr: |
      Un rowgroup contient jusqu'à 1 048 576 lignes. Un chargement en bloc d'au moins 102 400 lignes est compressé directement dans des rowgroups columnstore ; les lots plus petits vont dans le deltastore, que le moteur de tuples compresse plus tard.
  options:
    c: { en: "A deleted row of a compressed rowgroup is only marked as logically deleted; the space is reclaimed when the index is rebuilt.", fr: "Une ligne supprimée d'un rowgroup compressé est seulement marquée comme supprimée logiquement ; l'espace est récupéré lors de la reconstruction de l'index." }
    d: { en: "Since SQL Server 2016, a clustered columnstore table can have nonclustered rowstore (B-tree) indexes for seeks and uniqueness.", fr: "Depuis SQL Server 2016, une table columnstore cluster peut avoir des index rowstore (B-tree) non cluster pour les recherches et l'unicité." }
    e: { en: "Columnstore queries typically run in batch mode, which processes many rows at once.", fr: "Les requêtes columnstore s'exécutent généralement en mode batch, qui traite de nombreuses lignes à la fois." }
references:
  - title: "Columnstore indexes: overview"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview
