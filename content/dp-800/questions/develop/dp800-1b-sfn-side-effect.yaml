id: dp800-1b-sfn-side-effect
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at Northwind Traders tries to create a scalar function named Sales.ufn_GetPrice in an Azure SQL database. The function returns the current price of a product and, in the same body, inserts a row into a table named Sales.PriceLookupLog to record each lookup. The CREATE FUNCTION statement fails.

    You need to provide an object that records each lookup in Sales.PriceLookupLog and returns the price to the caller.

    What should you create?
  fr: |
    Un développeur de Northwind Traders tente de créer une fonction scalaire nommée Sales.ufn_GetPrice dans une base de données Azure SQL. La fonction renvoie le prix actuel d'un produit et, dans le même corps, insère une ligne dans une table nommée Sales.PriceLookupLog pour enregistrer chaque consultation. L'instruction CREATE FUNCTION échoue.

    Vous devez fournir un objet qui enregistre chaque consultation dans Sales.PriceLookupLog et renvoie le prix à l'appelant.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A multi-statement table-valued function that inserts the log row and returns the price", fr: "Une fonction table à instructions multiples qui insère la ligne de journal et renvoie le prix" } }
    - { id: b, text: { en: "A stored procedure that inserts the log row and returns the price in an OUTPUT parameter", fr: "Une procédure stockée qui insère la ligne de journal et renvoie le prix dans un paramètre OUTPUT" } }
    - { id: c, text: { en: "A scalar function created WITH SCHEMABINDING that inserts the log row and returns the price", fr: "Une fonction scalaire créée avec WITH SCHEMABINDING qui insère la ligne de journal et renvoie le prix" } }
    - { id: d, text: { en: "A scalar function created WITH EXECUTE AS OWNER that inserts the log row and returns the price", fr: "Une fonction scalaire créée avec WITH EXECUTE AS OWNER qui insère la ligne de journal et renvoie le prix" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      User-defined functions cannot perform actions that modify the database state, such as inserting into a table; only local table variables can be modified. A stored procedure can modify tables and return a value to the caller through an OUTPUT parameter.
    fr: |
      Les fonctions définies par l'utilisateur ne peuvent pas effectuer d'actions qui modifient l'état de la base de données, comme une insertion dans une table ; seules les variables de table locales peuvent être modifiées. Une procédure stockée peut modifier des tables et renvoyer une valeur à l'appelant par un paramètre OUTPUT.
  options:
    a: { en: "A table-valued function is also a user-defined function: it can insert only into its own table variable, not into Sales.PriceLookupLog.", fr: "Une fonction table est aussi une fonction définie par l'utilisateur : elle ne peut insérer que dans sa propre variable de table, pas dans Sales.PriceLookupLog." }
    c: { en: "Schema binding protects the referenced objects; it does not allow side effects in a function.", fr: "La liaison au schéma protège les objets référencés ; elle n'autorise pas d'effets de bord dans une fonction." }
    d: { en: "EXECUTE AS changes the security context of the function; the ban on modifying tables is not a permission issue.", fr: "EXECUTE AS change le contexte de sécurité de la fonction ; l'interdiction de modifier des tables n'est pas un problème d'autorisation." }
references:
  - title: Create user-defined functions (Database Engine)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/user-defined-functions/create-user-defined-functions-database-engine
