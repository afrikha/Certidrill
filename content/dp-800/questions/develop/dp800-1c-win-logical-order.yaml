id: dp800-1c-win-logical-order
objective: "1.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You review the following query.

    ```sql
    SELECT CustomerID,
           SUM(Amount) AS Total,
           RANK() OVER (ORDER BY SUM(Amount) DESC) AS Rnk
    FROM Sales.Orders
    WHERE OrderDate >= '20260101' AND OrderDate < '20270101'
    GROUP BY CustomerID
    ORDER BY Rnk;
    ```

    You need to explain to a developer the logical processing order that the Database Engine uses for this query.

    Which five actions should you list in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous examinez la requête suivante.

    ```sql
    SELECT CustomerID,
           SUM(Amount) AS Total,
           RANK() OVER (ORDER BY SUM(Amount) DESC) AS Rnk
    FROM Sales.Orders
    WHERE OrderDate >= '20260101' AND OrderDate < '20270101'
    GROUP BY CustomerID
    ORDER BY Rnk;
    ```

    Vous devez expliquer à un développeur l'ordre de traitement logique que le moteur de base de données utilise pour cette requête.

    Quelles sont les cinq actions à indiquer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: read, text: { en: "Read the rows of Sales.Orders.", fr: "Lire les lignes de Sales.Orders." } }
    - { id: filter, text: { en: "Keep the orders placed in 2026.", fr: "Conserver les commandes passées en 2026." } }
    - { id: group, text: { en: "Group the remaining rows by CustomerID.", fr: "Regrouper les lignes restantes par CustomerID." } }
    - { id: rank, text: { en: "Compute RANK() over the grouped rows by using SUM(Amount).", fr: "Calculer RANK() sur les lignes regroupées à l'aide de SUM(Amount)." } }
    - { id: sort, text: { en: "Sort the result by Rnk.", fr: "Trier le résultat par Rnk." } }
    - { id: rankraw, text: { en: "Compute RANK() over the individual order rows.", fr: "Calculer RANK() sur les lignes de commandes individuelles." } }
    - { id: filterrank, text: { en: "Remove the customers whose Rnk is greater than 10.", fr: "Supprimer les clients dont la valeur Rnk est supérieure à 10." } }
answer:
  sequence: [read, filter, group, rank, sort]
explanation:
  correct:
    en: |
      The logical processing order is FROM, WHERE, GROUP BY, HAVING, SELECT, DISTINCT, ORDER BY and then TOP. Window functions are evaluated with the SELECT list, so RANK() works on one row per customer, after grouping, and its alias can be used only by ORDER BY.
    fr: |
      L'ordre de traitement logique est FROM, WHERE, GROUP BY, HAVING, SELECT, DISTINCT, ORDER BY puis TOP. Les fonctions de fenêtre sont évaluées avec la liste SELECT : RANK() porte donc sur une ligne par client, après le regroupement, et son alias ne peut être utilisé que par ORDER BY.
  options:
    rankraw: { en: "The window function runs after GROUP BY, on the grouped rows, which is why it can use SUM(Amount).", fr: "La fonction de fenêtre s'exécute après GROUP BY, sur les lignes regroupées : c'est pourquoi elle peut utiliser SUM(Amount)." }
    filterrank: { en: "The query has no filter on Rnk; a filter on a window function result requires an outer query.", fr: "La requête n'a pas de filtre sur Rnk ; un filtre sur le résultat d'une fonction de fenêtre exige une requête externe." }
references:
  - title: SELECT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
