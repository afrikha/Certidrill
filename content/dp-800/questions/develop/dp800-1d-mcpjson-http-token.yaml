id: dp800-1d-mcpjson-http-token
objective: "1.4.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are creating a `.vscode/mcp.json` file that the whole team will commit to source control. It must connect GitHub Copilot in Visual Studio Code to a SQL MCP Server endpoint that uses the streamable HTTP transport and requires a bearer token.

    Each developer must type the token when the server starts. The token must be masked when it is typed and must never be stored in the file.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un fichier `.vscode/mcp.json` que toute l'équipe validera dans le contrôle de code source. Il doit connecter GitHub Copilot dans Visual Studio Code à un point de terminaison SQL MCP Server qui utilise le transport streamable HTTP et exige un jeton du porteur.

    Chaque développeur doit saisir le jeton au démarrage du serveur. Le jeton doit être masqué pendant la saisie et ne doit jamais être stocké dans le fichier.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "servers": {
        "inventory-sql": {
          "type": "[[type]]",
          "url": "https://dab-inventory.azurewebsites.net/mcp",
          "headers": {
            "Authorization": "Bearer [[ref]]"
          }
        }
      },
      "inputs": [
        {
          "id": "inv_token",
          "type": "[[input]]",
          "description": "Access token for the inventory MCP endpoint",
          "password": true
        }
      ]
    }
  slots:
    - id: type
      options:
        - { id: stdio, text: stdio }
        - { id: http, text: http }
        - { id: sse, text: sse }
    - id: ref
      options:
        - { id: env, text: "${env:inv_token}" }
        - { id: plain, text: "${inv_token}" }
        - { id: input, text: "${input:inv_token}" }
        - { id: sqlcmd, text: "$(inv_token)" }
    - id: input
      options:
        - { id: prompt, text: promptString }
        - { id: pick, text: pickString }
        - { id: command, text: command }
answer:
  values: { type: http, ref: input, input: prompt }
explanation:
  correct:
    en: |
      A server reached by URL over streamable HTTP uses the type `http`, with the token in `headers`. The `${input:inv_token}` variable refers to the `inputs` entry with the same id: a `promptString` input asks for the value when the server starts, `"password": true` masks it, and the value is stored securely outside the file.
    fr: |
      Un serveur joint par URL en streamable HTTP utilise le type `http`, avec le jeton dans `headers`. La variable `${input:inv_token}` fait référence à l'entrée `inputs` de même id : une entrée `promptString` demande la valeur au démarrage du serveur, `"password": true` la masque, et la valeur est stockée de manière sécurisée hors du fichier.
  options:
    stdio: { en: "stdio launches a local process with command and args; it doesn't connect to a URL.", fr: "stdio lance un processus local avec command et args ; il ne se connecte pas à une URL." }
    sse: { en: "sse is the Server-Sent Events transport, not the streamable HTTP transport of SQL MCP Server.", fr: "sse est le transport Server-Sent Events, pas le transport streamable HTTP de SQL MCP Server." }
    env: { en: "${env:...} reads an environment variable; it doesn't prompt the developer.", fr: "${env:...} lit une variable d'environnement ; il ne sollicite pas le développeur." }
    plain: { en: "${NAME} is the variable syntax of portable configuration files, not a reference to an input.", fr: "${NAME} est la syntaxe de variable des fichiers de configuration portables, pas une référence à une entrée." }
    sqlcmd: { en: "$(name) is SQLCMD variable syntax, which mcp.json doesn't use.", fr: "$(name) est la syntaxe des variables SQLCMD, que mcp.json n'utilise pas." }
    pick: { en: "pickString asks the user to choose among predefined options.", fr: "pickString demande à l'utilisateur de choisir parmi des options prédéfinies." }
    command: { en: "A command input runs a command to obtain the value instead of prompting.", fr: "Une entrée command exécute une commande pour obtenir la valeur au lieu de solliciter l'utilisateur." }
references:
  - title: Connect to MCP server endpoints, including Microsoft SQL Server and Fabric lakehouse
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/7-connect-mcp-server-endpoints
