id: dp800-1d-ai-code-review
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Developers at Northwind use GitHub Copilot to generate stored procedures and permission scripts for an Azure SQL database. The security team requires that every generated Transact-SQL script meets the company's security standards before it is committed to source control.

    What should you recommend?
  fr: |
    Les développeurs de Northwind utilisent GitHub Copilot pour générer des procédures stockées et des scripts d'autorisations pour une base de données Azure SQL. L'équipe de sécurité exige que chaque script Transact-SQL généré respecte les normes de sécurité de l'entreprise avant d'être validé dans le contrôle de code source.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Rely on the content filtering of GitHub Copilot to block insecure SQL patterns.", fr: "S'appuyer sur le filtrage de contenu de GitHub Copilot pour bloquer les modèles SQL non sécurisés." } }
    - { id: b, text: { en: "Add the standards to .github/copilot-instructions.md and commit generated code directly.", fr: "Ajouter les normes à .github/copilot-instructions.md et valider directement le code généré." } }
    - { id: c, text: { en: "Select the most capable model in the model picker for security-sensitive scripts.", fr: "Sélectionner le modèle le plus performant dans le sélecteur de modèle pour les scripts sensibles." } }
    - { id: d, text: { en: "Review generated scripts like any other code: permissions, dynamic SQL and data exposure.", fr: "Examiner les scripts générés comme tout autre code : autorisations, SQL dynamique et exposition des données." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AI-generated code is a first draft: the assistant optimizes for working code and common patterns, not for your security requirements. Apply the same review as for any code that enters the database environment, including GRANT statements against least privilege, parameterization of dynamic SQL and the columns that SELECT statements expose.
    fr: |
      Le code généré par l'IA est un premier jet : l'assistant optimise le fonctionnement et les modèles courants, pas vos exigences de sécurité. Appliquez la même revue qu'à tout code qui entre dans l'environnement de base de données, notamment les instructions GRANT au regard du moindre privilège, le paramétrage du SQL dynamique et les colonnes exposées par les instructions SELECT.
  options:
    a: { en: "Content filtering reduces insecure suggestions but doesn't replace a human review.", fr: "Le filtrage de contenu réduit les suggestions non sécurisées mais ne remplace pas une revue humaine." }
    b: { en: "Instruction files guide the model but don't guarantee that the generated code complies.", fr: "Les fichiers d'instructions guident le modèle mais ne garantissent pas la conformité du code généré." }
    c: { en: "A more capable model can still produce insecure code; the model choice isn't a security control.", fr: "Un modèle plus performant peut toujours produire du code non sécurisé : le choix du modèle n'est pas un contrôle de sécurité." }
references:
  - title: Interpret security impact of using AI-assisted tools
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/3-interpret-security-impact
