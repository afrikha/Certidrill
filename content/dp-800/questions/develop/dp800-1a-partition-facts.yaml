id: dp800-1a-partition-facts
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is planning to partition large tables in its SQL Server 2025 and Azure SQL Database environments.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit de partitionner de grandes tables dans ses environnements SQL Server 2025 et Azure SQL Database.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A table or index can have up to 15,000 partitions.", fr: "Une table ou un index peut avoir jusqu'à 15 000 partitions." } }
    - { id: b, text: { en: "An nvarchar(max) column can be used as the partitioning column.", fr: "Une colonne nvarchar(max) peut servir de colonne de partitionnement." } }
    - { id: c, text: { en: "A query can skip partitions only when its predicate references the partitioning column.", fr: "Une requête ne peut ignorer des partitions que si son prédicat référence la colonne de partitionnement." } }
    - { id: d, text: { en: "In Azure SQL Database, each partition can be mapped to its own filegroup.", fr: "Dans Azure SQL Database, chaque partition peut être mappée sur son propre groupe de fichiers." } }
    - { id: e, text: { en: "When neither LEFT nor RIGHT is specified, a partition function uses RANGE RIGHT.", fr: "Lorsque ni LEFT ni RIGHT n'est spécifié, une fonction de partition utilise RANGE RIGHT." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The Database Engine supports up to 15,000 partitions per table or index (14,999 boundary values). Partition elimination happens when the query predicate references the partitioning column; otherwise every partition must be read or sought.
    fr: |
      Le moteur de base de données prend en charge jusqu'à 15 000 partitions par table ou index (14 999 valeurs limites). L'élimination de partition a lieu lorsque le prédicat de la requête référence la colonne de partitionnement ; sinon, chaque partition doit être lue ou parcourue.
  options:
    b: { en: "text, ntext, image, xml, timestamp, varchar(max), nvarchar(max) and varbinary(max) columns can't be partitioning columns.", fr: "Les colonnes text, ntext, image, xml, timestamp, varchar(max), nvarchar(max) et varbinary(max) ne peuvent pas être des colonnes de partitionnement." }
    d: { en: "Azure SQL Database provides only the PRIMARY filegroup, so all partitions are on PRIMARY.", fr: "Azure SQL Database ne fournit que le groupe de fichiers PRIMARY : toutes les partitions sont sur PRIMARY." }
    e: { en: "LEFT is the default.", fr: "LEFT est la valeur par défaut." }
references:
  - title: Partitioned tables and indexes
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes
  - title: CREATE PARTITION FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-partition-function-transact-sql
