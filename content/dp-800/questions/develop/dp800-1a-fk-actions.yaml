id: dp800-1a-fk-actions
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a table named **HR.SalesRep** with a primary key on **SalesRepID**. You are creating a table named **Sales.Orders** that references HR.SalesRep. You need to meet the following requirements:

    - When a sales representative is deleted, the orders of that representative must be kept and must no longer reference any representative.
    - When the SalesRepID of a representative changes, the orders must reference the new value.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une table nommée **HR.SalesRep** avec une clé primaire sur **SalesRepID**. Vous créez une table nommée **Sales.Orders** qui référence HR.SalesRep. Vous devez satisfaire les exigences suivantes :

    - Lorsqu'un commercial est supprimé, ses commandes doivent être conservées et ne doivent plus référencer aucun commercial.
    - Lorsque le SalesRepID d'un commercial change, les commandes doivent référencer la nouvelle valeur.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE Sales.Orders
    (
        OrderID    int NOT NULL CONSTRAINT PK_Orders PRIMARY KEY,
        SalesRepID int [[nullity]],
        OrderDate  date NOT NULL,
        CONSTRAINT FK_Orders_SalesRep FOREIGN KEY (SalesRepID)
            REFERENCES HR.SalesRep (SalesRepID)
            ON DELETE [[del]]
            ON UPDATE [[upd]]
    );
  slots:
    - id: nullity
      options:
        - { id: nullable, text: "NULL" }
        - { id: notnull, text: NOT NULL }
    - id: del
      options:
        - { id: setnull, text: SET NULL }
        - { id: cascade, text: CASCADE }
        - { id: noaction, text: NO ACTION }
    - id: upd
      options:
        - { id: cascade, text: CASCADE }
        - { id: setnull, text: SET NULL }
        - { id: noaction, text: NO ACTION }
answer:
  values: { nullity: nullable, del: setnull, upd: cascade }
explanation:
  correct:
    en: |
      ON DELETE SET NULL keeps the orders and sets their foreign key to NULL when the referenced representative is deleted; this action requires a nullable foreign key column. ON UPDATE CASCADE propagates a changed SalesRepID to the referencing orders.
    fr: |
      ON DELETE SET NULL conserve les commandes et affecte NULL à leur clé étrangère lorsque le commercial référencé est supprimé ; cette action exige une colonne de clé étrangère qui accepte NULL. ON UPDATE CASCADE propage un SalesRepID modifié aux commandes qui le référencent.
  options:
    notnull: { en: "SET NULL can run only if the foreign key column is nullable.", fr: "SET NULL ne peut s'exécuter que si la colonne de clé étrangère accepte NULL." }
    cascade: { en: "ON DELETE CASCADE would delete the orders; for ON UPDATE, CASCADE is the correct choice.", fr: "ON DELETE CASCADE supprimerait les commandes ; pour ON UPDATE, CASCADE est le bon choix." }
    noaction: { en: "NO ACTION raises an error and rolls back the delete or update of the representative.", fr: "NO ACTION génère une erreur et annule la suppression ou la mise à jour du commercial." }
    setnull: { en: "For ON DELETE, SET NULL is correct; ON UPDATE SET NULL would lose the link instead of following the new value.", fr: "Pour ON DELETE, SET NULL est correct ; ON UPDATE SET NULL perdrait le lien au lieu de suivre la nouvelle valeur." }
references:
  - title: Primary and foreign key constraints
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/primary-and-foreign-key-constraints
