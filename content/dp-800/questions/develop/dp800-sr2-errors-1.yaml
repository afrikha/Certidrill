seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You roll back the transaction in the CATCH block and call RAISERROR with ERROR_MESSAGE().
  fr: Vous restaurez la transaction dans le bloc CATCH et appelez RAISERROR avec ERROR_MESSAGE().
body:
  solution:
    en: |
      You write the procedure body as follows.

      ```sql
      BEGIN TRY
          BEGIN TRANSACTION;
          -- INSERT INTO Sales.Orders ...
          -- INSERT INTO Sales.OrderLines ...
          COMMIT TRANSACTION;
      END TRY
      BEGIN CATCH
          IF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;
          DECLARE @msg nvarchar(2048) = ERROR_MESSAGE();
          RAISERROR (@msg, 16, 1);
      END CATCH;
      ```
    fr: |
      Vous écrivez le corps de la procédure comme suit.

      ```sql
      BEGIN TRY
          BEGIN TRANSACTION;
          -- INSERT INTO Sales.Orders ...
          -- INSERT INTO Sales.OrderLines ...
          COMMIT TRANSACTION;
      END TRY
      BEGIN CATCH
          IF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;
          DECLARE @msg nvarchar(2048) = ERROR_MESSAGE();
          RAISERROR (@msg, 16, 1);
      END CATCH;
      ```
answer: { value: false }
explanation:
  correct:
    en: The rollback removes the inserted rows, and the application receives the original message text. However, RAISERROR called with a message string always raises error number 50000, so the application would see 50000 instead of 547. A THROW statement without parameters in the CATCH block re-raises the original error number and message.
    fr: "La restauration supprime les lignes insérées, et l'application reçoit le texte du message d'origine. Cependant, RAISERROR appelé avec une chaîne de message déclenche toujours le numéro d'erreur 50000 : l'application verrait 50000 au lieu de 547. Une instruction THROW sans paramètres dans le bloc CATCH redéclenche le numéro et le message d'erreur d'origine."
