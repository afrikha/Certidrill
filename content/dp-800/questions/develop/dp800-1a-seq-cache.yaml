id: dp800-1a-seq-cache
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a sequence named **Sales.TicketNo** that was created with the NO CACHE option. Ticket inserts run at a very high rate, and the business accepts gaps in ticket numbers. You plan to run the following statement.

    ```sql
    ALTER SEQUENCE Sales.TicketNo CACHE 100;
    ```

    Which two statements describe the behavior after the change?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une séquence nommée **Sales.TicketNo** créée avec l'option NO CACHE. Les insertions de tickets ont lieu à un rythme très élevé, et l'entreprise accepte des trous dans les numéros de ticket. Vous prévoyez d'exécuter l'instruction suivante.

    ```sql
    ALTER SEQUENCE Sales.TicketNo CACHE 100;
    ```

    Quelles sont les deux affirmations qui décrivent le comportement après la modification ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The current value is written to the system tables less often than with NO CACHE.", fr: "La valeur actuelle est écrite dans les tables système moins souvent qu'avec NO CACHE." } }
    - { id: b, text: { en: "After a restart, the sequence can return a value that it already issued before the restart.", fr: "Après un redémarrage, la séquence peut renvoyer une valeur qu'elle avait déjà fournie avant le redémarrage." } }
    - { id: c, text: { en: "An unexpected shutdown can lose cached values that weren't used, which creates a gap.", fr: "Un arrêt inattendu peut faire perdre des valeurs en cache non utilisées, ce qui crée un trou." } }
    - { id: d, text: { en: "The Database Engine keeps a list of the next 100 values in memory.", fr: "Le moteur de base de données conserve en mémoire une liste des 100 valeurs suivantes." } }
    - { id: e, text: { en: "Values used by a rolled-back transaction are returned to the cache and reused.", fr: "Les valeurs utilisées par une transaction annulée sont rendues au cache et réutilisées." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With NO CACHE, the current value is written to the system tables every time a number is generated; with a cache, the metadata is updated only when a new block of values is allocated, which improves performance. After an unexpected shutdown such as a power failure, cached numbers that weren't used are lost, so the sequence continues with a gap.
    fr: |
      Avec NO CACHE, la valeur actuelle est écrite dans les tables système à chaque génération d'un numéro ; avec un cache, les métadonnées ne sont mises à jour que lors de l'allocation d'un nouveau bloc de valeurs, ce qui améliore les performances. Après un arrêt inattendu, comme une panne de courant, les numéros en cache non utilisés sont perdus : la séquence continue avec un trou.
  options:
    b: { en: "Without CYCLE or a manual restart, a sequence never issues the same value twice, even after a crash.", fr: "Sans CYCLE ni redémarrage manuel, une séquence ne fournit jamais deux fois la même valeur, même après un incident." }
    d: { en: "The cache stores only the current value and the number of values left, not a list of values.", fr: "Le cache ne stocke que la valeur actuelle et le nombre de valeurs restantes, pas une liste de valeurs." }
    e: { en: "Sequence values are consumed outside the transaction; a rollback never returns them.", fr: "Les valeurs de séquence sont consommées en dehors de la transaction ; une annulation ne les rend jamais." }
references:
  - title: CREATE SEQUENCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-sequence-transact-sql
