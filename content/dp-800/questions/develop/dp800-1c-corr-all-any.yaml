id: dp800-1c-corr-all-any
objective: "1.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a table named **Sales.Orders** that has the columns OrderID, CustomerID and Amount (NOT NULL). You review the following query.

    ```sql
    SELECT o.OrderID, o.CustomerID, o.Amount
    FROM Sales.Orders AS o
    WHERE o.Amount >= ALL (SELECT o2.Amount
                           FROM Sales.Orders AS o2
                           WHERE o2.CustomerID = o.CustomerID);
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une table nommée **Sales.Orders** qui contient les colonnes OrderID, CustomerID et Amount (NOT NULL). Vous examinez la requête suivante.

    ```sql
    SELECT o.OrderID, o.CustomerID, o.Amount
    FROM Sales.Orders AS o
    WHERE o.Amount >= ALL (SELECT o2.Amount
                           FROM Sales.Orders AS o2
                           WHERE o2.CustomerID = o.CustomerID);
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Replacing `>= ALL` with `>= ANY` returns the same rows.
        fr: |
          Remplacer `>= ALL` par `>= ANY` renvoie les mêmes lignes.
    - id: s2
      text:
        en: |
          The query returns, for each customer, the order or orders that have the highest Amount.
        fr: |
          La requête renvoie, pour chaque client, la ou les commandes dont le montant Amount est le plus élevé.
    - id: s3
      text:
        en: |
          The subquery is logically evaluated once for each row of the outer query.
        fr: |
          La sous-requête est évaluée logiquement une fois pour chaque ligne de la requête externe.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The subquery returns all the amounts of the current order's customer, including the current order. >= ALL is true only for an amount greater than or equal to every value, the maximum, so ties are all returned. >= ANY is true when the amount is greater than or equal to at least one value, which is always the case because the order's own amount is in the list. A correlated subquery depends on the outer row and is evaluated repeatedly, once per outer row.
    fr: |
      La sous-requête renvoie tous les montants du client de la commande courante, y compris celui de la commande courante. >= ALL n'est vrai que pour un montant supérieur ou égal à toutes les valeurs, c'est-à-dire au maximum : les ex aequo sont tous renvoyés. >= ANY est vrai quand le montant est supérieur ou égal à au moins une valeur, ce qui est toujours le cas puisque le montant de la commande figure dans la liste. Une sous-requête corrélée dépend de la ligne externe et est évaluée de façon répétée, une fois par ligne externe.
references:
  - title: Subqueries (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/subqueries
