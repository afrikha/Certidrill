id: dp800-cs3c-open-claims
objective: "1.2.3"
type: multi
caseStudy: dp800-cs3c-litware-insurance
difficulty: 3
status: draft
stem:
  en: |
    You need to create Claims.ufn_OpenClaims and write the dashboard query. The solution must meet the data requirements.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer Claims.ufn_OpenClaims et écrire la requête du tableau de bord. La solution doit satisfaire les exigences relatives aux données.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Create the function with RETURNS @claims TABLE (...) and a BEGIN...END body that inserts the open claims of both tables.
        fr: Créer la fonction avec RETURNS @claims TABLE (...) et un corps BEGIN...END qui insère les sinistres ouverts des deux tables.
    - id: b
      text:
        en: Create the function with RETURNS TABLE and a single RETURN (SELECT ... UNION ALL SELECT ...) over both tables.
        fr: Créer la fonction avec RETURNS TABLE et un seul RETURN (SELECT ... UNION ALL SELECT ...) sur les deux tables.
    - id: c
      text:
        en: Create a scalar function that returns the open claims of the policy as a JSON array.
        fr: Créer une fonction scalaire qui renvoie les sinistres ouverts de la police sous la forme d'un tableau JSON.
    - id: d
      text:
        en: In the dashboard query, call the function with Claims.Policy AS p CROSS APPLY Claims.ufn_OpenClaims(p.PolicyId).
        fr: Dans la requête du tableau de bord, appeler la fonction avec Claims.Policy AS p CROSS APPLY Claims.ufn_OpenClaims(p.PolicyId).
    - id: e
      text:
        en: In the dashboard query, call the function with Claims.Policy AS p OUTER APPLY Claims.ufn_OpenClaims(p.PolicyId).
        fr: Dans la requête du tableau de bord, appeler la fonction avec Claims.Policy AS p OUTER APPLY Claims.ufn_OpenClaims(p.PolicyId).
    - id: f
      text:
        en: In the dashboard query, call the function with Claims.Policy AS p LEFT JOIN Claims.ufn_OpenClaims(p.PolicyId) ON 1 = 1.
        fr: Dans la requête du tableau de bord, appeler la fonction avec Claims.Policy AS p LEFT JOIN Claims.ufn_OpenClaims(p.PolicyId) ON 1 = 1.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: An inline table-valued function is a single SELECT that the optimizer expands into the calling query, so it can seek on the indexes of both claim tables and estimate rows from their statistics. OUTER APPLY calls the function for each policy and keeps the policies for which the function returns no row, with NULL in the claim columns.
    fr: |
      Une fonction table inline est un seul SELECT que l'optimiseur développe dans la requête appelante : il peut donc effectuer des recherches dans les index des deux tables de sinistres et estimer les lignes à partir de leurs statistiques. OUTER APPLY appelle la fonction pour chaque police et conserve les polices pour lesquelles la fonction ne renvoie aucune ligne, avec NULL dans les colonnes des sinistres.
  options:
    a: { en: "A multi-statement TVF fills a table variable that the optimizer treats as opaque, with a fixed estimate or, with interleaved execution, the row count of the table variable, not statistics on the claim tables.", fr: "Une fonction table à instructions multiples remplit une variable de table que l'optimiseur traite comme opaque, avec une estimation fixe ou, avec l'exécution entrelacée, le nombre de lignes de la variable de table, et non les statistiques des tables de sinistres." }
    c: { en: "A scalar function returns one value per call and can't be used in a FROM clause as a set of claims.", fr: "Une fonction scalaire renvoie une valeur par appel et ne peut pas être utilisée dans une clause FROM comme un ensemble de sinistres." }
    d: { en: "CROSS APPLY removes the policies for which the function returns no row, so policies without open claims disappear.", fr: "CROSS APPLY supprime les polices pour lesquelles la fonction ne renvoie aucune ligne : les polices sans sinistre ouvert disparaissent." }
    f: { en: "A function in a JOIN can't take a column of the other table as its argument; correlated calls require APPLY.", fr: "Une fonction dans une jointure ne peut pas prendre une colonne de l'autre table comme argument ; les appels corrélés exigent APPLY." }
references:
  - title: Create user-defined functions (Database Engine)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/user-defined-functions/create-user-defined-functions-database-engine
