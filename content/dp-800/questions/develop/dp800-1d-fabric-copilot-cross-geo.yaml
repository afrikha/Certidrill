id: dp800-1d-fabric-copilot-cross-geo
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a Microsoft Fabric F8 capacity in the Japan East region. The tenant setting Users can use Copilot and other features powered by Azure OpenAI is enabled for the entire organization.

    Developers report that Copilot isn't available in the query editor of a SQL database hosted on the capacity.

    Which tenant setting should a Fabric administrator enable?
  fr: |
    Tailspin dispose d'une capacité Microsoft Fabric F8 dans la région Japan East. Le paramètre du locataire Users can use Copilot and other features powered by Azure OpenAI est activé pour toute l'organisation.

    Les développeurs signalent que Copilot n'est pas disponible dans l'éditeur de requête d'une base de données SQL hébergée sur la capacité.

    Quel paramètre du locataire un administrateur Fabric doit-il activer ?
body:
  options:
    - { id: a, text: "Data sent to Azure OpenAI can be stored outside your capacity's geographic region, compliance boundary, or national cloud instance" }
    - { id: b, text: "Capacities can be designated as Copilot in Fabric capacities" }
    - { id: c, text: "Data sent to Azure OpenAI can be processed outside your capacity's geographic region, compliance boundary, or national cloud instance" }
    - { id: d, text: "Users can use Copilot, AI Agents and other AI experiences powered by OpenAI as a Microsoft Subprocessor" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When the tenant or the capacity is outside the US or France, Copilot in SQL database in Fabric is disabled by default. A Fabric administrator must allow the data sent to Azure OpenAI to be processed outside the capacity's geographic region, compliance boundary, or national cloud instance.
    fr: |
      Quand le locataire ou la capacité se trouve hors des États-Unis ou de la France, Copilot dans la base de données SQL de Fabric est désactivé par défaut. Un administrateur Fabric doit autoriser le traitement des données envoyées à Azure OpenAI hors de la région géographique, de la limite de conformité ou de l'instance de cloud national de la capacité.
  options:
    a: { en: "The cross-geo storage setting applies to conversation history of Copilot in notebooks and Fabric data agents, not to Copilot in SQL database.", fr: "Le paramètre de stockage hors zone géographique s'applique à l'historique des conversations de Copilot dans les notebooks et des agents de données Fabric, pas à Copilot dans la base de données SQL." }
    b: { en: "Designating a Copilot capacity consolidates usage and billing; it doesn't lift the regional restriction.", fr: "La désignation d'une capacité Copilot regroupe l'utilisation et la facturation ; elle ne lève pas la restriction régionale." }
    d: { en: "This setting concerns experiences that use OpenAI as a subprocessor, not the regional processing of Azure OpenAI requests.", fr: "Ce paramètre concerne les expériences qui utilisent OpenAI comme sous-traitant, pas le traitement régional des requêtes Azure OpenAI." }
references:
  - title: What is Copilot in the SQL database in Fabric workload?
    url: https://learn.microsoft.com/en-us/fabric/database/sql/copilot
  - title: Copilot and Agent admin settings
    url: https://learn.microsoft.com/en-us/fabric/admin/service-admin-portal-copilot
