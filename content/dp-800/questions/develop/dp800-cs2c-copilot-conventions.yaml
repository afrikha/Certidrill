id: dp800-cs2c-copilot-conventions
objective: "1.4.4"
type: single
caseStudy: dp800-cs2c-fabrikam-residences
difficulty: 1
status: draft
stem:
  en: |
    You need to provide the team's Transact-SQL conventions to GitHub Copilot. The solution must meet the development requirements.

    Which file should you create in fabrikam-listings?
  fr: |
    Vous devez fournir les conventions Transact-SQL de l'équipe à GitHub Copilot. La solution doit satisfaire les exigences de développement.

    Quel fichier devez-vous créer dans fabrikam-listings ?
body:
  options:
    - { id: a, text: "`.github/prompts/tsql-conventions.prompt.md`" }
    - { id: b, text: "`.github/copilot-instructions.md`" }
    - { id: c, text: "`docs/copilot-instructions.md`" }
    - { id: d, text: "`.editorconfig`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Repository instructions are stored in a file named copilot-instructions.md in the .github folder at the root of the repository. They apply to everyone who works in the repository, and Copilot Chat adds them to the requests automatically, without any reference in the prompt.
    fr: |
      Les instructions de dépôt sont stockées dans un fichier nommé copilot-instructions.md dans le dossier .github à la racine du dépôt. Elles s'appliquent à toute personne qui travaille dans le dépôt, et Copilot Chat les ajoute automatiquement aux requêtes, sans référence dans le prompt.
  options:
    a: { en: "A prompt file in .github/prompts is a reusable prompt that a developer must reference in the chat, for example with #.", fr: "Un fichier de prompt dans .github/prompts est un prompt réutilisable qu'un développeur doit référencer dans la conversation, par exemple avec #." }
    c: { en: "Copilot reads repository instructions from the .github folder, not from a docs folder.", fr: "Copilot lit les instructions de dépôt dans le dossier .github, pas dans un dossier docs." }
    d: { en: ".editorconfig defines editor formatting settings such as indentation; it does not give instructions to Copilot.", fr: ".editorconfig définit des paramètres de mise en forme de l'éditeur, comme l'indentation ; il ne donne pas d'instructions à Copilot." }
references:
  - title: Create and configure GitHub Copilot instruction files
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/6-create-configure-copilot-instruction-files
