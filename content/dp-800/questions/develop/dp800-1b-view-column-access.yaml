id: dp800-1b-view-column-access
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named HR.Employee. The table has the columns EmployeeID, FullName, Department, Salary and NationalID. The HR schema and all its objects are owned by dbo.

    Members of a database role named Analysts must be able to query EmployeeID, FullName and Department for all employees. They must not be able to read Salary or NationalID. The solution must not grant any permission on HR.Employee.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée HR.Employee. La table comporte les colonnes EmployeeID, FullName, Department, Salary et NationalID. Le schéma HR et tous ses objets appartiennent à dbo.

    Les membres d'un rôle de base de données nommé Analysts doivent pouvoir interroger EmployeeID, FullName et Department pour tous les employés. Ils ne doivent pas pouvoir lire Salary ni NationalID. La solution ne doit accorder aucune autorisation sur HR.Employee.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a view named HR.vEmployeeDirectory that selects EmployeeID, FullName and Department from HR.Employee.", fr: "Créer une vue nommée HR.vEmployeeDirectory qui sélectionne EmployeeID, FullName et Department dans HR.Employee." } }
    - { id: b, text: { en: "Add the Analysts role to the db_datareader fixed database role.", fr: "Ajouter le rôle Analysts au rôle de base de données fixe db_datareader." } }
    - { id: c, text: { en: "Grant the SELECT permission on HR.vEmployeeDirectory to Analysts.", fr: "Accorder l'autorisation SELECT sur HR.vEmployeeDirectory à Analysts." } }
    - { id: d, text: { en: "Add a dynamic data mask to the Salary and NationalID columns.", fr: "Ajouter un masque de données dynamique aux colonnes Salary et NationalID." } }
    - { id: e, text: { en: "Create the view HR.vEmployeeDirectory with WITH CHECK OPTION.", fr: "Créer la vue HR.vEmployeeDirectory avec WITH CHECK OPTION." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A view that selects only the allowed columns exposes a restricted shape of the table. Because the view and the table have the same owner (dbo), ownership chaining means that SQL Server checks the SELECT permission on the view only, not on HR.Employee. Granting SELECT on the view to Analysts therefore gives access to the three columns and nothing else.
    fr: |
      Une vue qui ne sélectionne que les colonnes autorisées expose une forme restreinte de la table. Comme la vue et la table ont le même propriétaire (dbo), le chaînage des propriétés fait que SQL Server vérifie l'autorisation SELECT sur la vue uniquement, pas sur HR.Employee. Accorder SELECT sur la vue à Analysts donne donc accès aux trois colonnes et à rien d'autre.
  options:
    b: { en: "db_datareader grants SELECT on every table of the database, including all the columns of HR.Employee.", fr: "db_datareader accorde SELECT sur toutes les tables de la base, y compris toutes les colonnes de HR.Employee." }
    d: { en: "Dynamic Data Masking requires SELECT on the table and only obfuscates values in results; users can still infer them with predicates.", fr: "Le masquage dynamique des données exige SELECT sur la table et ne fait que masquer les valeurs dans les résultats ; les utilisateurs peuvent encore les déduire avec des prédicats." }
    e: { en: "CHECK OPTION validates modifications made through the view; it does not restrict which columns users can read.", fr: "CHECK OPTION valide les modifications effectuées par la vue ; elle ne limite pas les colonnes que les utilisateurs peuvent lire." }
references:
