id: dp800-1b-cte-construct
objective: "1.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing Transact-SQL for an Azure SQL database at Wingtip Toys. You must choose the construct that best fits each requirement.

    Which construct should you use for each requirement? To answer, drag the appropriate constructs to the correct requirements. Each construct may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez du Transact-SQL pour une base de données Azure SQL chez Wingtip Toys. Vous devez choisir la construction la mieux adaptée à chaque exigence.

    Quelle construction devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les constructions appropriées vers les exigences correspondantes. Chaque construction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cte, text: { en: "Nonrecursive CTE", fr: "CTE non récursive" } }
    - { id: rcte, text: { en: "Recursive CTE", fr: "CTE récursive" } }
    - { id: temp, text: { en: "Temporary table", fr: "Table temporaire" } }
    - { id: view, text: { en: "View", fr: "Vue" } }
    - { id: scalar, text: { en: "Scalar function", fr: "Fonction scalaire" } }
  targets:
    - id: steps
      text: { en: "Split one long query into named steps that only this query uses.", fr: "Découper une longue requête en étapes nommées que seule cette requête utilise." }
    - id: org
      text: { en: "Return all the direct and indirect reports of a manager in one query.", fr: "Renvoyer tous les subordonnés directs et indirects d'un responsable en une seule requête." }
    - id: reuse
      text: { en: "Compute a costly aggregation once and read it in five statements of the same batch.", fr: "Calculer une agrégation coûteuse une seule fois et la lire dans cinq instructions du même lot." }
    - id: shared
      text: { en: "Store a named query in the database that other users can query with their own SELECT permission.", fr: "Stocker dans la base une requête nommée que d'autres utilisateurs peuvent interroger avec leur propre autorisation SELECT." }
answer:
  mapping: { steps: cte, org: rcte, reuse: temp, shared: view }
explanation:
  correct:
    en: |
      A nonrecursive CTE names intermediate queries for the single statement that follows it. A recursive CTE walks a hierarchy of unknown depth. CTE results are not materialized and exist only for one statement, so a result reused by several statements belongs in a temporary table. A view is a database object on which permissions can be granted.
    fr: |
      Une CTE non récursive nomme des requêtes intermédiaires pour l'unique instruction qui la suit. Une CTE récursive parcourt une hiérarchie de profondeur inconnue. Les résultats des CTE ne sont pas matérialisés et n'existent que pour une instruction : un résultat réutilisé par plusieurs instructions doit aller dans une table temporaire. Une vue est un objet de base de données sur lequel des autorisations peuvent être accordées.
  options:
    scalar: { en: "A scalar function returns one value; it does not provide a rowset for these requirements.", fr: "Une fonction scalaire renvoie une seule valeur ; elle ne fournit pas d'ensemble de lignes pour ces exigences." }
references:
  - title: WITH common_table_expression (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/with-common-table-expression-transact-sql
