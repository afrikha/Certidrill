id: dp800-1c-regex-function-choice
objective: "1.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that has a compatibility level of 170. You are writing Transact-SQL code for a data quality project.

    Which regular expression function should you use for each requirement? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL dont le niveau de compatibilité est 170. Vous écrivez du code Transact-SQL pour un projet de qualité des données.

    Quelle fonction d'expression régulière devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: like, text: "REGEXP_LIKE" }
    - { id: replace, text: "REGEXP_REPLACE" }
    - { id: substr, text: "REGEXP_SUBSTR" }
    - { id: instr, text: "REGEXP_INSTR" }
    - { id: count, text: "REGEXP_COUNT" }
    - { id: split, text: "REGEXP_SPLIT_TO_TABLE" }
  targets:
    - id: t1
      text: { en: "Reject postal codes that don't match a pattern, in a CHECK constraint", fr: "Rejeter les codes postaux qui ne correspondent pas à un modèle, dans une contrainte CHECK" }
    - id: t2
      text: { en: "Return the position of the first digit in a product code", fr: "Renvoyer la position du premier chiffre dans un code produit" }
    - id: t3
      text: { en: "Return the number of times the word ERROR appears in a log line", fr: "Renvoyer le nombre de fois où le mot ERROR apparaît dans une ligne de journal" }
    - id: t4
      text: { en: "Return one row for each value of a list separated by semicolons or commas", fr: "Renvoyer une ligne pour chaque valeur d'une liste séparée par des points-virgules ou des virgules" }
answer:
  mapping: { t1: like, t2: instr, t3: count, t4: split }
explanation:
  correct:
    en: |
      REGEXP_LIKE returns a Boolean and can be used in WHERE clauses and CHECK constraints. REGEXP_INSTR returns the start (or end) position of a match, and REGEXP_COUNT returns the number of matches. REGEXP_SPLIT_TO_TABLE is a table-valued function that splits a string at each match of the delimiter pattern. REGEXP_REPLACE returns a modified string and REGEXP_SUBSTR returns the matched text.
    fr: |
      REGEXP_LIKE renvoie un booléen et peut être utilisé dans les clauses WHERE et les contraintes CHECK. REGEXP_INSTR renvoie la position de début (ou de fin) d'une correspondance, et REGEXP_COUNT renvoie le nombre de correspondances. REGEXP_SPLIT_TO_TABLE est une fonction table qui découpe une chaîne à chaque correspondance du modèle de délimiteur. REGEXP_REPLACE renvoie une chaîne modifiée et REGEXP_SUBSTR renvoie le texte correspondant.
references:
  - title: Regular expressions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/regular-expressions/overview
