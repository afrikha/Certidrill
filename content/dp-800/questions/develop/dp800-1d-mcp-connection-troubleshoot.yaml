id: dp800-1d-mcp-connection-troubleshoot
objective: "1.4.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Developers at Adatum connect GitHub Copilot Agent mode in Visual Studio Code to MCP endpoints for Azure SQL databases. They report four problems.

    Which action should you recommend for each problem? To answer, drag the appropriate actions to the correct problems. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les développeurs d'Adatum connectent le mode Agent de GitHub Copilot dans Visual Studio Code à des points de terminaison MCP pour des bases de données Azure SQL. Ils signalent quatre problèmes.

    Quelle action devez-vous recommander pour chaque problème ? Pour répondre, faites glisser les actions appropriées vers les problèmes correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: json, text: { en: "Validate the JSON syntax of .vscode/mcp.json", fr: "Valider la syntaxe JSON de .vscode/mcp.json" } }
    - { id: reauth, text: { en: "Re-authenticate or refresh the token", fr: "S'authentifier de nouveau ou actualiser le jeton" } }
    - { id: firewall, text: { en: "Allow the client IP address in the firewall rules of the server", fr: "Autoriser l'adresse IP du client dans les règles de pare-feu du serveur" } }
    - { id: perms, text: { en: "Verify the database permissions of the authenticated identity", fr: "Vérifier les autorisations de base de données de l'identité authentifiée" } }
    - { id: model, text: { en: "Select a different model in the model picker", fr: "Sélectionner un autre modèle dans le sélecteur de modèle" } }
    - { id: ask, text: { en: "Switch the chat mode to Ask", fr: "Faire passer le mode de conversation à Ask" } }
  targets:
    - { id: notlisted, text: { en: "The server doesn't appear under the Tools icon", fr: "Le serveur n'apparaît pas sous l'icône Tools" } }
    - { id: authfail, text: { en: "The connection fails with an authentication error after it worked for weeks", fr: "La connexion échoue avec une erreur d'authentification après avoir fonctionné pendant des semaines" } }
    - { id: timeout, text: { en: "The connection to the Azure SQL database times out from a new office", fr: "La connexion à la base de données Azure SQL expire depuis un nouveau bureau" } }
    - { id: empty, text: { en: "The agent connects but returns an empty schema", fr: "L'agent se connecte mais renvoie un schéma vide" } }
answer:
  mapping: { notlisted: json, authfail: reauth, timeout: firewall, empty: perms }
explanation:
  correct:
    en: |
      A server missing from the tools list usually comes from a syntax error in mcp.json. An authentication failure after a period of success points to expired credentials. A timeout from a new network location means the firewall blocks the new client IP address. Empty schema results mean that the authenticated identity lacks permissions in the database.
    fr: |
      Un serveur absent de la liste des outils provient généralement d'une erreur de syntaxe dans mcp.json. Un échec d'authentification après une période de fonctionnement indique des informations d'identification expirées. Une expiration depuis un nouvel emplacement réseau signifie que le pare-feu bloque la nouvelle adresse IP du client. Un schéma vide signifie que l'identité authentifiée n'a pas les autorisations nécessaires dans la base de données.
  options:
    model: { en: "The model doesn't affect whether the MCP connection works.", fr: "Le modèle n'a pas d'effet sur le fonctionnement de la connexion MCP." }
    ask: { en: "MCP tools are used in Agent mode; Ask mode wouldn't fix any of these problems.", fr: "Les outils MCP s'utilisent en mode Agent ; le mode Ask ne résoudrait aucun de ces problèmes." }
references:
  - title: Connect to MCP server endpoints, including Microsoft SQL Server and Fabric lakehouse
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/7-connect-mcp-server-endpoints
