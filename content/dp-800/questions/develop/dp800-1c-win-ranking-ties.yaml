id: dp800-1c-win-ranking-ties
objective: "1.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A table named **Quiz.Results** contains the following rows.

    | Player | Score |
    | --- | --- |
    | Ana | 98 |
    | Ben | 95 |
    | Chloe | 95 |
    | Dev | 90 |

    You run a query that returns the rows ordered by Score descending and four computed columns. Each column uses a different window function with `OVER (ORDER BY Score DESC)`.

    Which function produces each column? To answer, drag the appropriate functions to the correct columns. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une table nommée **Quiz.Results** contient les lignes suivantes.

    | Player | Score |
    | --- | --- |
    | Ana | 98 |
    | Ben | 95 |
    | Chloe | 95 |
    | Dev | 90 |

    Vous exécutez une requête qui renvoie les lignes triées par Score décroissant et quatre colonnes calculées. Chaque colonne utilise une fonction de fenêtre différente avec `OVER (ORDER BY Score DESC)`.

    Quelle fonction produit chaque colonne ? Pour répondre, faites glisser les fonctions appropriées vers les colonnes correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rownum, text: "ROW_NUMBER()" }
    - { id: rank, text: "RANK()" }
    - { id: dense, text: "DENSE_RANK()" }
    - { id: ntile, text: "NTILE(2)" }
    - { id: prank, text: "PERCENT_RANK()" }
    - { id: cume, text: "CUME_DIST()" }
  targets:
    - id: c1
      text: { en: "Column 1 returns 1, 2, 3, 4", fr: "La colonne 1 renvoie 1, 2, 3, 4" }
    - id: c2
      text: { en: "Column 2 returns 1, 2, 2, 4", fr: "La colonne 2 renvoie 1, 2, 2, 4" }
    - id: c3
      text: { en: "Column 3 returns 1, 2, 2, 3", fr: "La colonne 3 renvoie 1, 2, 2, 3" }
    - id: c4
      text: { en: "Column 4 returns 1, 1, 2, 2", fr: "La colonne 4 renvoie 1, 1, 2, 2" }
answer:
  mapping: { c1: rownum, c2: rank, c3: dense, c4: ntile }
explanation:
  correct:
    en: |
      ROW_NUMBER numbers every row sequentially, even ties. RANK gives ties the same value and then skips numbers (1, 2, 2, 4), while DENSE_RANK doesn't skip (1, 2, 2, 3). NTILE(2) distributes the four rows into two groups of two. PERCENT_RANK and CUME_DIST return values between 0 and 1, not integers.
    fr: |
      ROW_NUMBER numérote toutes les lignes de façon séquentielle, même les ex aequo. RANK donne la même valeur aux ex aequo puis saute des numéros (1, 2, 2, 4), alors que DENSE_RANK n'en saute pas (1, 2, 2, 3). NTILE(2) répartit les quatre lignes en deux groupes de deux. PERCENT_RANK et CUME_DIST renvoient des valeurs entre 0 et 1, pas des entiers.
references:
  - title: RANK (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/rank-transact-sql
  - title: NTILE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ntile-transact-sql
