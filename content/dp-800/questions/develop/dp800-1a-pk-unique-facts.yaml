id: dp800-1a-pk-unique-facts
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware creates a table by running the following statement. No other index is created on the table.

    ```sql
    CREATE TABLE Sales.Customer
    (
        CustomerID int NOT NULL CONSTRAINT PK_Customer PRIMARY KEY,
        Email      nvarchar(256) NULL CONSTRAINT UQ_Customer_Email UNIQUE,
        FullName   nvarchar(200) NOT NULL
    );
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware crée une table en exécutant l'instruction suivante. Aucun autre index n'est créé sur la table.

    ```sql
    CREATE TABLE Sales.Customer
    (
        CustomerID int NOT NULL CONSTRAINT PK_Customer PRIMARY KEY,
        Email      nvarchar(256) NULL CONSTRAINT UQ_Customer_Email UNIQUE,
        FullName   nvarchar(200) NOT NULL
    );
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "PK_Customer is enforced by a clustered index.", fr: "PK_Customer est imposée par un index cluster." } }
    - { id: b, text: { en: "Several customers can have a NULL Email.", fr: "Plusieurs clients peuvent avoir un Email NULL." } }
    - { id: c, text: { en: "UQ_Customer_Email is enforced by a unique nonclustered index.", fr: "UQ_Customer_Email est imposée par un index non cluster unique." } }
    - { id: d, text: { en: "You can disable UQ_Customer_Email by using ALTER TABLE ... NOCHECK CONSTRAINT.", fr: "Vous pouvez désactiver UQ_Customer_Email à l'aide de ALTER TABLE ... NOCHECK CONSTRAINT." } }
    - { id: e, text: { en: "You can remove the index of PK_Customer by using DROP INDEX.", fr: "Vous pouvez supprimer l'index de PK_Customer à l'aide de DROP INDEX." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      When neither CLUSTERED nor NONCLUSTERED is specified, a PRIMARY KEY constraint creates a clustered index if no clustered index exists, and a UNIQUE constraint creates a unique nonclustered index.
    fr: |
      Lorsque ni CLUSTERED ni NONCLUSTERED n'est spécifié, une contrainte PRIMARY KEY crée un index cluster s'il n'en existe pas encore, et une contrainte UNIQUE crée un index non cluster unique.
  options:
    b: { en: "A UNIQUE constraint allows only one NULL value in the column.", fr: "Une contrainte UNIQUE n'autorise qu'une seule valeur NULL dans la colonne." }
    d: { en: "Only FOREIGN KEY and CHECK constraints can be disabled; PRIMARY KEY, UNIQUE and DEFAULT constraints can't.", fr: "Seules les contraintes FOREIGN KEY et CHECK peuvent être désactivées ; les contraintes PRIMARY KEY, UNIQUE et DEFAULT ne le peuvent pas." }
    e: { en: "An index created for a constraint can't be dropped with DROP INDEX; you must drop the constraint with ALTER TABLE.", fr: "Un index créé pour une contrainte ne peut pas être supprimé avec DROP INDEX ; il faut supprimer la contrainte avec ALTER TABLE." }
references:
  - title: CREATE TABLE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-table-transact-sql
  - title: Unique constraints and check constraints
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/unique-constraints-and-check-constraints
