id: dp800-1c-graph-two-paths
objective: "1.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains the following graph tables:

    | Table | Type | Edge direction |
    | --- | --- | --- |
    | HR.Employee | Node | |
    | HR.Project | Node | |
    | HR.Skill | Node | |
    | HR.WorksOn | Edge | Employee to Project |
    | HR.Requires | Edge | Project to Skill |
    | HR.HasSkill | Edge | Employee to Skill |

    You need to list each employee and the active projects that the employee works on and that require at least one skill that the employee has.

    How should you complete the Transact-SQL statement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient les tables de graphe suivantes :

    | Table | Type | Sens des arêtes |
    | --- | --- | --- |
    | HR.Employee | Nœud | |
    | HR.Project | Nœud | |
    | HR.Skill | Nœud | |
    | HR.WorksOn | Arête | Employee vers Project |
    | HR.Requires | Arête | Project vers Skill |
    | HR.HasSkill | Arête | Employee vers Skill |

    Vous devez lister chaque employé et les projets actifs sur lesquels il travaille et qui exigent au moins une compétence qu'il possède.

    Comment devez-vous compléter l'instruction Transact-SQL ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT DISTINCT e.FullName, p.ProjectName
    FROM HR.Employee AS e, HR.WorksOn AS w, HR.Project AS p,
         HR.Requires AS r, HR.Skill AS s, HR.HasSkill AS h
    WHERE MATCH(e-(w)->p[[r]]s [[conn]] [[h]])
      AND p.Status = N'Active';
  slots:
    - id: r
      options:
        - { id: fwd, text: "-(r)->" }
        - { id: back, text: "<-(r)-" }
        - { id: reuse, text: "-(w)->" }
    - id: conn
      options:
        - { id: and, text: "AND" }
        - { id: or, text: "OR" }
        - { id: andnot, text: "AND NOT" }
    - id: h
      options:
        - { id: es, text: "e-(h)->s" }
        - { id: se, text: "s-(h)->e" }
        - { id: er, text: "e-(r)->s" }
answer:
  values: { r: fwd, conn: and, h: es }
explanation:
  correct:
    en: |
      Each arrow must follow the direction in which the edges were created, so Requires goes from p to s and HasSkill from e to s. Two patterns that end at the same skill node are combined with AND inside MATCH; OR and NOT aren't supported. DISTINCT removes duplicates when several skills match.
    fr: |
      Chaque flèche doit suivre le sens dans lequel les arêtes ont été créées : Requires va de p vers s et HasSkill de e vers s. Deux modèles qui aboutissent au même nœud de compétence sont combinés avec AND dans MATCH ; OR et NOT ne sont pas pris en charge. DISTINCT supprime les doublons quand plusieurs compétences correspondent.
  options:
    back: { en: "Requires edges go from Project to Skill; the reversed arrow finds no rows.", fr: "Les arêtes Requires vont de Project vers Skill ; la flèche inversée ne trouve aucune ligne." }
    reuse: { en: "The edge alias w is already used in the pattern, and an edge name can't be repeated in MATCH.", fr: "L'alias d'arête w est déjà utilisé dans le modèle, et un nom d'arête ne peut pas être répété dans MATCH." }
    or: { en: "OR isn't supported in a MATCH pattern.", fr: "OR n'est pas pris en charge dans un modèle MATCH." }
    andnot: { en: "NOT isn't supported in a MATCH pattern.", fr: "NOT n'est pas pris en charge dans un modèle MATCH." }
    se: { en: "HasSkill edges go from Employee to Skill, not the opposite.", fr: "Les arêtes HasSkill vont d'Employee vers Skill, pas l'inverse." }
    er: { en: "r already appears in the pattern and connects projects to skills, not employees.", fr: "r figure déjà dans le modèle et relie des projets à des compétences, pas des employés." }
references:
  - title: MATCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/match-sql-graph
  - title: Create a graph database and run some pattern matching queries using T-SQL
    url: https://learn.microsoft.com/en-us/sql/relational-databases/graphs/sql-graph-sample
