id: dp800-1a-unique-nullable
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a table named **Sales.Customer** with a clustered primary key on **CustomerID**. The table contains a nullable column named **TaxNumber**. Most customers have no tax number, but when a tax number is provided, it must be unique.

    You need to enforce this rule.

    Which statement should you run?
  fr: |
    Adatum dispose d'une table nommée **Sales.Customer** dotée d'une clé primaire cluster sur **CustomerID**. La table contient une colonne nommée **TaxNumber** qui accepte NULL. La plupart des clients n'ont pas de numéro fiscal, mais lorsqu'un numéro fiscal est fourni, il doit être unique.

    Vous devez imposer cette règle.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER TABLE Sales.Customer ADD CONSTRAINT UQ_Customer_TaxNumber UNIQUE (TaxNumber);" }
    - { id: b, text: "ALTER TABLE Sales.Customer ADD CONSTRAINT UQ_Customer_TaxNumber UNIQUE (TaxNumber) WHERE TaxNumber IS NOT NULL;" }
    - { id: c, text: "CREATE UNIQUE NONCLUSTERED INDEX UX_Customer_TaxNumber ON Sales.Customer (TaxNumber) WHERE TaxNumber IS NOT NULL;" }
    - { id: d, text: "CREATE UNIQUE CLUSTERED INDEX UX_Customer_TaxNumber ON Sales.Customer (TaxNumber);" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A filtered index can have the UNIQUE property. With the filter TaxNumber IS NOT NULL, uniqueness is enforced only on the rows that have a tax number, and any number of customers can have a NULL tax number.
    fr: |
      Un index filtré peut avoir la propriété UNIQUE. Avec le filtre TaxNumber IS NOT NULL, l'unicité n'est imposée que sur les lignes qui ont un numéro fiscal, et un nombre quelconque de clients peut avoir un numéro fiscal NULL.
  options:
    a: { en: "A UNIQUE constraint allows only one NULL in the column, so the second customer without a tax number would be rejected.", fr: "Une contrainte UNIQUE n'autorise qu'un seul NULL dans la colonne : le deuxième client sans numéro fiscal serait rejeté." }
    b: { en: "A filter can't be applied to a UNIQUE or PRIMARY KEY constraint; the statement is invalid.", fr: "Un filtre ne peut pas s'appliquer à une contrainte UNIQUE ou PRIMARY KEY : l'instruction n'est pas valide." }
    d: { en: "The table already has a clustered index, and this index would also allow only one NULL.", fr: "La table possède déjà un index cluster, et cet index n'autoriserait lui aussi qu'un seul NULL." }
references:
  - title: Create filtered indexes
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/create-filtered-indexes
  - title: Unique constraints and check constraints
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/unique-constraints-and-check-constraints
