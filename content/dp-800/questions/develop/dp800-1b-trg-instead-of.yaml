id: dp800-1b-trg-instead-of
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database for Fabrikam. A view named Sales.vCustomerAddress joins the Sales.Customer and Sales.Address tables. The view does not use WITH CHECK OPTION.

    A partner application must insert new customers by running INSERT statements against the view. Each insert must create one row in Sales.Customer and one row in Sales.Address.

    What should you create?
  fr: |
    Vous disposez d'une base de données Azure SQL pour Fabrikam. Une vue nommée Sales.vCustomerAddress joint les tables Sales.Customer et Sales.Address. La vue n'utilise pas WITH CHECK OPTION.

    Une application partenaire doit insérer de nouveaux clients en exécutant des instructions INSERT sur la vue. Chaque insertion doit créer une ligne dans Sales.Customer et une ligne dans Sales.Address.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An AFTER INSERT trigger on the view", fr: "Un déclencheur AFTER INSERT sur la vue" } }
    - { id: b, text: { en: "An INSTEAD OF INSERT trigger on the view", fr: "Un déclencheur INSTEAD OF INSERT sur la vue" } }
    - { id: c, text: { en: "An AFTER INSERT trigger on Sales.Customer", fr: "Un déclencheur AFTER INSERT sur Sales.Customer" } }
    - { id: d, text: { en: "An INSTEAD OF INSERT trigger on Sales.Address", fr: "Un déclencheur INSTEAD OF INSERT sur Sales.Address" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An INSERT through a view can modify only one base table. An INSTEAD OF INSERT trigger on the view runs in place of the INSERT statement and can read the inserted rows to write to both Sales.Customer and Sales.Address, which makes the view insertable.
    fr: |
      Un INSERT par une vue ne peut modifier qu'une seule table de base. Un déclencheur INSTEAD OF INSERT sur la vue s'exécute à la place de l'instruction INSERT et peut lire les lignes insérées pour écrire à la fois dans Sales.Customer et dans Sales.Address, ce qui rend la vue accessible en insertion.
  options:
    a: { en: "AFTER triggers cannot be defined on views, only on tables.", fr: "Les déclencheurs AFTER ne peuvent pas être définis sur des vues, uniquement sur des tables." }
    c: { en: "The INSERT against the view fails before any row reaches Sales.Customer, because it references columns of two base tables.", fr: "L'INSERT sur la vue échoue avant qu'une ligne n'atteigne Sales.Customer, car il référence des colonnes de deux tables de base." }
    d: { en: "A trigger on a base table does not change how the INSERT against the view is processed; it still targets two tables and fails.", fr: "Un déclencheur sur une table de base ne change pas le traitement de l'INSERT sur la vue ; il cible toujours deux tables et échoue." }
references:
  - title: CREATE TRIGGER (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-trigger-transact-sql
  - title: CREATE VIEW (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-view-transact-sql
