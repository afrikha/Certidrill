id: dp800-1d-ai-risk-controls
objective: "1.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to let its database developers use GitHub Copilot and MCP servers with Azure SQL databases. The security team lists four risks.

    Which control should you recommend for each risk? To answer, drag the appropriate controls to the correct risks. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit de permettre à ses développeurs de bases de données d'utiliser GitHub Copilot et des serveurs MCP avec des bases de données Azure SQL. L'équipe de sécurité liste quatre risques.

    Quel contrôle devez-vous recommander pour chaque risque ? Pour répondre, faites glisser les contrôles appropriés vers les risques correspondants. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: classify, text: { en: "Classify the data and align Copilot access with existing database permissions", fr: "Classifier les données et aligner l'accès à Copilot sur les autorisations de base de données existantes" } }
    - { id: review, text: { en: "Review each generated GRANT statement against the least-privilege model", fr: "Examiner chaque instruction GRANT générée au regard du modèle de moindre privilège" } }
    - { id: readonly, text: { en: "Connect the MCP server with a dedicated read-only identity", fr: "Connecter le serveur MCP avec une identité dédiée en lecture seule" } }
    - { id: private, text: { en: "Use a private endpoint or a VPN connection for MCP traffic", fr: "Utiliser un point de terminaison privé ou une connexion VPN pour le trafic MCP" } }
    - { id: model, text: { en: "Select a faster model in the model picker", fr: "Sélectionner un modèle plus rapide dans le sélecteur de modèle" } }
    - { id: prompt, text: { en: "Create a reusable prompt file in .github/prompts", fr: "Créer un fichier de prompt réutilisable dans .github/prompts" } }
  targets:
    - { id: regulated, text: { en: "Customer financial data could be processed by a cloud AI model without approval", fr: "Des données financières de clients pourraient être traitées par un modèle d'IA cloud sans approbation" } }
    - { id: grants, text: { en: "Copilot suggests granting broad permissions to make a script work", fr: "Copilot suggère d'accorder des autorisations larges pour faire fonctionner un script" } }
    - { id: writes, text: { en: "An agent could modify data through the MCP server", fr: "Un agent pourrait modifier des données par le biais du serveur MCP" } }
    - { id: network, text: { en: "MCP traffic to a sensitive database could cross the public internet", fr: "Le trafic MCP vers une base de données sensible pourrait traverser Internet" } }
answer:
  mapping: { regulated: classify, grants: review, writes: readonly, network: private }
explanation:
  correct:
    en: |
      Before enabling AI tools, classify the data (PII, financial, health) and decide who gets access in line with database permissions. Review GRANT and REVOKE statements that Copilot suggests. Give MCP connections dedicated least-privilege identities, read-only where possible. For sensitive environments, keep MCP traffic off public networks with private endpoints or VPN connections.
    fr: |
      Avant d'activer les outils d'IA, classifiez les données (données personnelles, financières, de santé) et décidez qui y a accès en cohérence avec les autorisations de base de données. Examinez les instructions GRANT et REVOKE suggérées par Copilot. Donnez aux connexions MCP des identités dédiées à moindre privilège, en lecture seule si possible. Pour les environnements sensibles, gardez le trafic MCP hors des réseaux publics avec des points de terminaison privés ou des connexions VPN.
  options:
    model: { en: "The choice of model doesn't reduce any of these risks.", fr: "Le choix du modèle ne réduit aucun de ces risques." }
    prompt: { en: "A prompt file is a reusable task template, not a security control.", fr: "Un fichier de prompt est un modèle de tâche réutilisable, pas un contrôle de sécurité." }
references:
  - title: Interpret security impact of using AI-assisted tools
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/3-interpret-security-impact
