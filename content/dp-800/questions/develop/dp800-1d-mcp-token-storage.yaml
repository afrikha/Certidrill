id: dp800-1d-mcp-token-storage
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your team commits the following `.vscode/mcp.json` file to a shared repository so that GitHub Copilot in Visual Studio Code can use an MCP endpoint.

    ```json
    {
      "servers": {
        "orders-sql": {
          "type": "http",
          "url": "https://dab-orders.azurewebsites.net/mcp",
          "headers": { "Authorization": "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOi..." }
        }
      }
    }
    ```

    You need to remove the access token from the file. The file must stay in source control.

    Which two changes achieve the goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe valide le fichier `.vscode/mcp.json` suivant dans un dépôt partagé afin que GitHub Copilot dans Visual Studio Code puisse utiliser un point de terminaison MCP.

    ```json
    {
      "servers": {
        "orders-sql": {
          "type": "http",
          "url": "https://dab-orders.azurewebsites.net/mcp",
          "headers": { "Authorization": "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOi..." }
        }
      }
    }
    ```

    Vous devez supprimer le jeton d'accès du fichier. Le fichier doit rester dans le contrôle de code source.

    Quelles sont les deux modifications qui permettent d'atteindre l'objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |
          Replace the token with `${input:orders_token}` and add an `inputs` entry of type `promptString` with `"password": true`.
        fr: |
          Remplacer le jeton par `${input:orders_token}` et ajouter une entrée `inputs` de type `promptString` avec `"password": true`.
    - id: b
      text:
        en: Replace the token with `${env:ORDERS_TOKEN}` and set the environment variable on each developer computer.
        fr: Remplacer le jeton par `${env:ORDERS_TOKEN}` et définir la variable d'environnement sur l'ordinateur de chaque développeur.
    - id: c
      text:
        en: Move the token to `.github/copilot-instructions.md` and reference it from the `headers` value.
        fr: Déplacer le jeton dans `.github/copilot-instructions.md` et le référencer depuis la valeur `headers`.
    - id: d
      text:
        en: Encode the token in Base64 before you store it in the `headers` value.
        fr: Encoder le jeton en Base64 avant de le stocker dans la valeur `headers`.
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      Never store credentials in configuration files that are committed to source control: use input prompts or environment variables. An `${input:...}` variable prompts for the value when the server starts and stores it securely outside the file, and `${env:...}` reads the value from an environment variable of the developer's computer.
    fr: |
      Ne stockez jamais d'informations d'identification dans des fichiers de configuration validés dans le contrôle de code source : utilisez des invites de saisie ou des variables d'environnement. Une variable `${input:...}` demande la valeur au démarrage du serveur et la stocke de manière sécurisée hors du fichier, et `${env:...}` lit la valeur dans une variable d'environnement de l'ordinateur du développeur.
  options:
    c: { en: "An instruction file is sent to the model as context and is committed too: the token would still be in source control and would also reach the AI.", fr: "Un fichier d'instructions est envoyé au modèle comme contexte et il est validé lui aussi : le jeton serait toujours dans le contrôle de code source et parviendrait en plus à l'IA." }
    d: { en: "Base64 is an encoding, not encryption: anyone who reads the file can decode the token.", fr: "Base64 est un encodage, pas un chiffrement : toute personne qui lit le fichier peut décoder le jeton." }
references:
  - title: Connect to MCP server endpoints, including Microsoft SQL Server and Fabric lakehouse
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/7-connect-mcp-server-endpoints
  - title: Interpret security impact of using AI-assisted tools
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/3-interpret-security-impact
