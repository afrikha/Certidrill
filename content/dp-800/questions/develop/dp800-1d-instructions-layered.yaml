id: dp800-1d-instructions-layered
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has 40 GitHub repositories that contain SQL database projects. All the developers use GitHub Copilot Chat.

    You need to provide Copilot with instructions that meet the following requirements:

    - Security rules that are common to all the repositories are maintained in one place, without a copy in each repository.
    - Each repository adds its own naming conventions, which apply to everyone who works in that repository.

    What should you recommend?
  fr: |
    Contoso dispose de 40 dépôts GitHub qui contiennent des projets de bases de données SQL. Tous les développeurs utilisent GitHub Copilot Chat.

    Vous devez fournir à Copilot des instructions qui satisfont les exigences suivantes :

    - Les règles de sécurité communes à tous les dépôts sont gérées à un seul endroit, sans copie dans chaque dépôt.
    - Chaque dépôt ajoute ses propres conventions de nommage, qui s'appliquent à toute personne qui travaille dans ce dépôt.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Each developer adds the security rules to personal instructions, and each repository gets a .github/copilot-instructions.md file.", fr: "Chaque développeur ajoute les règles de sécurité à ses instructions personnelles, et chaque dépôt reçoit un fichier .github/copilot-instructions.md." } }
    - { id: b, text: { en: "Organization-level instructions hold the security rules, and each repository gets a .github/copilot-instructions.md file.", fr: "Des instructions au niveau de l'organisation contiennent les règles de sécurité, et chaque dépôt reçoit un fichier .github/copilot-instructions.md." } }
    - { id: c, text: { en: "A shared repository holds the security rules in a .instructions.md file, and each repository gets a .github/prompts file.", fr: "Un dépôt partagé contient les règles de sécurité dans un fichier .instructions.md, et chaque dépôt reçoit un fichier dans .github/prompts." } }
    - { id: d, text: { en: "Each repository gets a .github/prompts/security.prompt.md file and a .github/copilot-instructions.md file.", fr: "Chaque dépôt reçoit un fichier .github/prompts/security.prompt.md et un fichier .github/copilot-instructions.md." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Layered instructions combine organization-level standards with repository-specific additions. The shared security rules are managed once at the organization level, and the `.github/copilot-instructions.md` file of each repository adds the conventions that apply to everyone working in it.
    fr: |
      Les instructions en couches combinent des normes au niveau de l'organisation et des ajouts propres à chaque dépôt. Les règles de sécurité communes sont gérées une seule fois au niveau de l'organisation, et le fichier `.github/copilot-instructions.md` de chaque dépôt ajoute les conventions qui s'appliquent à toute personne qui y travaille.
  options:
    a: { en: "Personal instructions are maintained by each developer, not in one place, and can drift.", fr: "Les instructions personnelles sont gérées par chaque développeur, pas à un seul endroit, et peuvent diverger." }
    c: { en: "An instruction file in another repository doesn't apply to these repositories, and prompt files aren't applied automatically.", fr: "Un fichier d'instructions d'un autre dépôt ne s'applique pas à ces dépôts, et les fichiers de prompt ne sont pas appliqués automatiquement." }
    d: { en: "This copies the security rules into every repository, and a prompt file applies only when a developer runs it.", fr: "Cela copie les règles de sécurité dans chaque dépôt, et un fichier de prompt ne s'applique que quand un développeur l'exécute." }
references:
  - title: Create and configure GitHub Copilot instruction files
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/6-create-configure-copilot-instruction-files
