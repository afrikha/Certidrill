id: dp800-1c-corr-pattern-choice
objective: "1.3.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have the tables **Sales.Customer** (CustomerID, FullName) and **Sales.Orders** (OrderID, CustomerID, OrderDate, Status, Amount).

    Which query pattern should you use for each requirement? To answer, drag the appropriate patterns to the correct requirements. Each pattern may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des tables **Sales.Customer** (CustomerID, FullName) et **Sales.Orders** (OrderID, CustomerID, OrderDate, Status, Amount).

    Quel modèle de requête devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les modèles appropriés vers les exigences correspondantes. Chaque modèle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: exists, text: { en: "A correlated EXISTS subquery", fr: "Une sous-requête EXISTS corrélée" } }
    - { id: notexists, text: { en: "A correlated NOT EXISTS subquery", fr: "Une sous-requête NOT EXISTS corrélée" } }
    - { id: scalar, text: { en: "A correlated scalar subquery in the SELECT list", fr: "Une sous-requête scalaire corrélée dans la liste SELECT" } }
    - { id: outerapply, text: "OUTER APPLY" }
    - { id: crossjoin, text: "CROSS JOIN" }
    - { id: unionall, text: "UNION ALL" }
  targets:
    - id: t1
      text: { en: "List the customers that have never placed an order", fr: "Lister les clients qui n'ont jamais passé de commande" }
    - id: t2
      text: { en: "List the customers that have at least one order with the Returned status", fr: "Lister les clients qui ont au moins une commande à l'état Returned" }
    - id: t3
      text: { en: "List every customer with the total Amount of the customer's orders in one column", fr: "Lister chaque client avec le montant total de ses commandes dans une colonne" }
    - id: t4
      text: { en: "List every customer with the OrderID, OrderDate and Amount of the customer's latest order, including customers without orders", fr: "Lister chaque client avec les colonnes OrderID, OrderDate et Amount de sa dernière commande, y compris les clients sans commande" }
answer:
  mapping: { t1: notexists, t2: exists, t3: scalar, t4: outerapply }
explanation:
  correct:
    en: |
      NOT EXISTS and EXISTS test whether a correlated row exists, without duplicating the customers. A scalar subquery returns one value per customer, such as a SUM, but it can return only one column. OUTER APPLY with TOP (1) returns several columns of the latest order and keeps the customers without orders with NULL values. CROSS JOIN and UNION ALL don't correlate rows.
    fr: |
      NOT EXISTS et EXISTS testent l'existence d'une ligne corrélée, sans dupliquer les clients. Une sous-requête scalaire renvoie une valeur par client, comme une somme SUM, mais une seule colonne. OUTER APPLY avec TOP (1) renvoie plusieurs colonnes de la dernière commande et conserve les clients sans commande avec des valeurs NULL. CROSS JOIN et UNION ALL ne corrèlent pas les lignes.
references:
  - title: Subqueries (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/subqueries
  - title: FROM clause plus JOIN, APPLY, PIVOT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/from-transact-sql
