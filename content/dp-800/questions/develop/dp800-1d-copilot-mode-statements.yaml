id: dp800-1d-copilot-mode-statements
objective: "1.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Developers at Woodgrove use GitHub Copilot Chat in SQL Server Management Studio (SSMS) 22.7 and in Visual Studio Code with MCP servers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les développeurs de Woodgrove utilisent GitHub Copilot Chat dans SQL Server Management Studio (SSMS) 22.7 et dans Visual Studio Code avec des serveurs MCP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In SSMS, when a prompt doesn't name a database, Agent mode uses the database of the active query editor.
        fr: Dans SSMS, quand un prompt ne nomme aucune base de données, le mode Agent utilise la base de données de l'éditeur de requête actif.
    - id: s2
      text:
        en: In Visual Studio Code, the tools that you enable or disable in the Tools picker apply to the current chat session.
        fr: Dans Visual Studio Code, les outils que vous activez ou désactivez dans le sélecteur d'outils s'appliquent à la session de conversation actuelle.
    - id: s3
      text:
        en: In SSMS, the tools of an MCP server are available in Ask mode once they are enabled in the Tools list.
        fr: Dans SSMS, les outils d'un serveur MCP sont disponibles en mode Ask une fois activés dans la liste Tools.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Agent mode in SSMS doesn't inherit context from the active query editor: include the server or database name in the prompt, otherwise Copilot checks your connection list or asks. In Visual Studio Code, tool selection applies per chat session, so you can limit the tools for each task. MCP tools in SSMS require Agent mode; Ask mode doesn't support MCP.
    fr: |
      En mode Agent, SSMS n'hérite pas du contexte de l'éditeur de requête actif : indiquez le nom du serveur ou de la base de données dans le prompt, sinon Copilot consulte votre liste de connexions ou vous interroge. Dans Visual Studio Code, la sélection des outils s'applique par session de conversation : vous pouvez limiter les outils pour chaque tâche. Les outils MCP dans SSMS exigent le mode Agent ; le mode Ask ne prend pas en charge MCP.
  options:
    s1: { en: "Agent mode doesn't inherit the context of the active query editor.", fr: "Le mode Agent n'hérite pas du contexte de l'éditeur de requête actif." }
    s3: { en: "Ask mode doesn't support MCP, whatever the Tools list contains.", fr: "Le mode Ask ne prend pas en charge MCP, quel que soit le contenu de la liste Tools." }
references:
  - title: Use GitHub Copilot Agent mode in SQL Server Management Studio
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/agent-mode
  - title: Configure model and model context protocol (MCP) tool options in a GitHub Copilot or Fabric Copilot chat session
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/5-configure-model-mcp-tool-options
