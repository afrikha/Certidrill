stem:
  en: You number the orders with ROW_NUMBER in a CTE and keep row 1.
  fr: Vous numérotez les commandes avec ROW_NUMBER dans une CTE et conservez la ligne 1.
body:
  solution:
    en: |
      You run the following query:

      ```sql
      WITH Ranked AS
      (
          SELECT OrderID, CustomerID, OrderDate, Amount,
                 ROW_NUMBER() OVER (PARTITION BY CustomerID
                                    ORDER BY OrderDate DESC, OrderID DESC) AS rn
          FROM Sales.Orders
      )
      SELECT OrderID, CustomerID, OrderDate, Amount
      FROM Ranked
      WHERE rn = 1;
      ```
    fr: |
      Vous exécutez la requête suivante :

      ```sql
      WITH Ranked AS
      (
          SELECT OrderID, CustomerID, OrderDate, Amount,
                 ROW_NUMBER() OVER (PARTITION BY CustomerID
                                    ORDER BY OrderDate DESC, OrderID DESC) AS rn
          FROM Sales.Orders
      )
      SELECT OrderID, CustomerID, OrderDate, Amount
      FROM Ranked
      WHERE rn = 1;
      ```
answer: { value: true }
explanation:
  correct:
    en: ROW_NUMBER restarts at 1 for each CustomerID and gives every row a distinct number, even when values tie. Because OrderID is unique, ordering by OrderDate DESC and then OrderID DESC makes the numbering deterministic, so row 1 is the latest order with the highest OrderID. The filter on rn in the outer query returns exactly one row per customer.
    fr: "ROW_NUMBER recommence à 1 pour chaque CustomerID et attribue à chaque ligne un numéro distinct, même en cas d'égalité. Comme OrderID est unique, le tri par OrderDate DESC puis OrderID DESC rend la numérotation déterministe : la ligne 1 est la commande la plus récente dont la valeur d'OrderID est la plus élevée. Le filtre sur rn dans la requête externe renvoie exactement une ligne par client."
references:
