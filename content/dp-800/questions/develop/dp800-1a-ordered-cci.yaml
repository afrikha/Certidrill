id: dp800-1a-ordered-cci
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a SQL Server 2022 database that contains a heap named **Sales.SalesHistory** with 400 million rows. Reports filter the table on ranges of **SaleDate**.

    You need to meet the following requirements:

    - The table itself must be stored in columnar format.
    - The column segments must be sorted on SaleDate so that range filters can skip rowgroups.
    - SaleID values must be unique, and lookups of a single SaleID must be efficient.

    How should you complete the Transact-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'une base de données SQL Server 2022 qui contient un tas nommé **Sales.SalesHistory** de 400 millions de lignes. Les rapports filtrent la table sur des plages de **SaleDate**.

    Vous devez satisfaire les exigences suivantes :

    - La table elle-même doit être stockée au format colonnes.
    - Les segments de colonnes doivent être triés sur SaleDate pour que les filtres de plage puissent ignorer des rowgroups.
    - Les valeurs de SaleID doivent être uniques, et la recherche d'un SaleID unique doit être efficace.

    Comment devez-vous compléter les instructions Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE [[a]] COLUMNSTORE INDEX CCI_SalesHistory
        ON Sales.SalesHistory
        [[b]] (SaleDate);

    CREATE [[c]] INDEX UX_SalesHistory_SaleID
        ON Sales.SalesHistory (SaleID);
  slots:
    - id: a
      options:
        - { id: cl, text: CLUSTERED }
        - { id: ncl, text: NONCLUSTERED }
    - id: b
      options:
        - { id: order, text: ORDER }
        - { id: include, text: INCLUDE }
        - { id: with, text: WITH }
    - id: c
      options:
        - { id: uncl, text: UNIQUE NONCLUSTERED }
        - { id: ucl, text: UNIQUE CLUSTERED }
        - { id: ncci, text: NONCLUSTERED COLUMNSTORE }
answer:
  values: { a: cl, b: order, c: uncl }
explanation:
  correct:
    en: |
      A clustered columnstore index makes the table itself columnar, and the ORDER clause creates an ordered clustered columnstore index, which SQL Server 2022 supports, so segments sorted on SaleDate let range filters eliminate rowgroups. A clustered columnstore table can also have nonclustered rowstore indexes: a unique nonclustered B-tree index on SaleID enforces uniqueness and supports singleton seeks.
    fr: |
      Un index columnstore cluster rend la table elle-même orientée colonnes, et la clause ORDER crée un index columnstore cluster ordonné, que SQL Server 2022 prend en charge : des segments triés sur SaleDate permettent aux filtres de plage d'éliminer des rowgroups. Une table columnstore cluster peut aussi avoir des index rowstore non cluster : un index B-tree non cluster unique sur SaleID impose l'unicité et permet des recherches de lignes uniques.
  options:
    ncl: { en: "A nonclustered columnstore index is a secondary copy of the data; the table would stay a rowstore heap. SQL Server 2022 also supports ordering only for clustered columnstore indexes.", fr: "Un index columnstore non cluster est une copie secondaire des données ; la table resterait un tas rowstore. De plus, SQL Server 2022 ne prend en charge l'ordre que pour les index columnstore cluster." }
    include: { en: "INCLUDE adds nonkey columns to rowstore indexes; it doesn't sort columnstore segments.", fr: "INCLUDE ajoute des colonnes non clés aux index rowstore ; il ne trie pas les segments columnstore." }
    with: { en: "WITH introduces index options such as MAXDOP, not a sort column.", fr: "WITH introduit des options d'index comme MAXDOP, pas une colonne de tri." }
    ucl: { en: "The clustered columnstore index is already the table's clustered index.", fr: "L'index columnstore cluster est déjà l'index cluster de la table." }
    ncci: { en: "A columnstore index doesn't enforce uniqueness and isn't suited to singleton lookups.", fr: "Un index columnstore n'impose pas l'unicité et n'est pas adapté aux recherches de lignes uniques." }
references:
  - title: "Columnstore indexes: overview"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview
