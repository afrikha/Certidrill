id: dp800-1b-sfn-rules
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the design of scalar user-defined functions for an Azure SQL database that uses compatibility level 160.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la conception de fonctions scalaires définies par l'utilisateur pour une base de données Azure SQL qui utilise le niveau de compatibilité 160.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A scalar function whose body calls GETDATE() is eligible for scalar UDF inlining.
        fr: Une fonction scalaire dont le corps appelle GETDATE() est éligible à l'incorporation des UDF scalaires.
    - id: s2
      text:
        en: A scalar function can use NEWID() to return a different identifier for each row of a query.
        fr: Une fonction scalaire peut utiliser NEWID() pour renvoyer un identificateur différent pour chaque ligne d'une requête.
    - id: s3
      text:
        en: A scalar function can declare a table variable and insert rows into it.
        fr: Une fonction scalaire peut déclarer une variable de table et y insérer des lignes.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      A function that calls a time-dependent intrinsic function such as GETDATE() is not inlineable, although GETDATE() itself is allowed in a function. NEWID, NEWSEQUENTIALID and RAND are side-effecting operators that cannot be used in a user-defined function (error 443). INSERT, UPDATE and DELETE statements are allowed on local table variables, because they do not change the database state outside the function.
    fr: |
      Une fonction qui appelle une fonction intrinsèque dépendante du temps comme GETDATE() n'est pas incorporable, même si GETDATE() est en soi autorisée dans une fonction. NEWID, NEWSEQUENTIALID et RAND sont des opérateurs à effet de bord qui ne peuvent pas être utilisés dans une fonction définie par l'utilisateur (erreur 443). Les instructions INSERT, UPDATE et DELETE sont autorisées sur les variables de table locales, car elles ne modifient pas l'état de la base de données en dehors de la fonction.
references:
  - title: Scalar UDF Inlining
    url: https://learn.microsoft.com/en-us/sql/relational-databases/user-defined-functions/scalar-udf-inlining
  - title: User-defined functions
