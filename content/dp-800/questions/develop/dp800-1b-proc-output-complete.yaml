id: dp800-1b-proc-output-complete
objective: "1.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database for Northwind Traders. The Sales.Customer table has an identity column named CustomerID. An AFTER INSERT trigger on Sales.Customer writes a row to an audit table that also has an identity column. Several sessions insert customers at the same time.

    You need a stored procedure that inserts a customer and returns the new CustomerID to the caller in the @newId variable.

    How should you complete the Transact-SQL code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL pour Northwind Traders. La table Sales.Customer possède une colonne d'identité nommée CustomerID. Un déclencheur AFTER INSERT sur Sales.Customer écrit une ligne dans une table d'audit qui possède aussi une colonne d'identité. Plusieurs sessions insèrent des clients en même temps.

    Vous avez besoin d'une procédure stockée qui insère un client et renvoie le nouveau CustomerID à l'appelant dans la variable @newId.

    Comment devez-vous compléter le code Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE OR ALTER PROCEDURE Sales.usp_AddCustomer
        @FullName   nvarchar(100),
        @CustomerID int [[def]]
    AS
    BEGIN
        SET NOCOUNT ON;
        INSERT INTO Sales.Customer (FullName) VALUES (@FullName);
        SET @CustomerID = [[id]];
    END;
    GO

    DECLARE @newId int;
    EXECUTE Sales.usp_AddCustomer @FullName = N'Ana Silva', @CustomerID = @newId [[call]];
  slots:
    - id: def
      options:
        - { id: output, text: OUTPUT }
        - { id: readonly, text: READONLY }
        - { id: defnull, text: "= NULL" }
    - id: id
      options:
        - { id: scope, text: "SCOPE_IDENTITY()" }
        - { id: atat, text: "@@IDENTITY" }
        - { id: identcur, text: "IDENT_CURRENT('Sales.Customer')" }
        - { id: rowcount, text: "@@ROWCOUNT" }
    - id: call
      options:
        - { id: output2, text: OUTPUT }
        - { id: readonly2, text: READONLY }
        - { id: recompile, text: WITH RECOMPILE }
answer:
  values: { def: output, id: scope, call: output2 }
explanation:
  correct:
    en: |
      An output parameter is declared with OUTPUT in the procedure, and the caller must also pass the variable with OUTPUT to receive the value; without it, no error occurs but the value is not available. SCOPE_IDENTITY() returns the last identity value inserted in the current scope, so it ignores the value generated by the trigger and the inserts of other sessions.
    fr: |
      Un paramètre de sortie est déclaré avec OUTPUT dans la procédure, et l'appelant doit aussi passer la variable avec OUTPUT pour recevoir la valeur ; sans cela, aucune erreur ne se produit mais la valeur n'est pas disponible. SCOPE_IDENTITY() renvoie la dernière valeur d'identité insérée dans l'étendue actuelle : elle ignore la valeur générée par le déclencheur et les insertions des autres sessions.
  options:
    readonly: { en: "READONLY applies only to table-valued parameters, which are input parameters.", fr: "READONLY s'applique uniquement aux paramètres table, qui sont des paramètres d'entrée." }
    defnull: { en: "A default value makes the parameter optional but does not return a value to the caller.", fr: "Une valeur par défaut rend le paramètre facultatif mais ne renvoie pas de valeur à l'appelant." }
    atat: { en: "@@IDENTITY returns the last identity value of the session in any scope, here the value inserted by the trigger into the audit table.", fr: "@@IDENTITY renvoie la dernière valeur d'identité de la session dans n'importe quelle étendue, ici la valeur insérée par le déclencheur dans la table d'audit." }
    identcur: { en: "IDENT_CURRENT returns the last identity value of the table for any session, so a concurrent insert can return another customer's ID.", fr: "IDENT_CURRENT renvoie la dernière valeur d'identité de la table pour toutes les sessions : une insertion concurrente peut renvoyer l'ID d'un autre client." }
    rowcount: { en: "@@ROWCOUNT returns the number of rows affected, not an identity value.", fr: "@@ROWCOUNT renvoie le nombre de lignes affectées, pas une valeur d'identité." }
    readonly2: { en: "READONLY is not an option of a parameter in an EXECUTE statement.", fr: "READONLY n'est pas une option de paramètre dans une instruction EXECUTE." }
    recompile: { en: "WITH RECOMPILE forces a new plan for this execution; the variable is still not set without OUTPUT.", fr: "WITH RECOMPILE force un nouveau plan pour cette exécution ; la variable n'est toujours pas définie sans OUTPUT." }
references:
  - title: Return data from a stored procedure
    url: https://learn.microsoft.com/en-us/sql/relational-databases/stored-procedures/return-data-from-a-stored-procedure
  - title: SCOPE_IDENTITY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/scope-identity-transact-sql
