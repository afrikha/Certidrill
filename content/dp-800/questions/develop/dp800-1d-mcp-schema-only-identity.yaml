id: dp800-1d-mcp-schema-only-identity
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You configure an MCP server that a GitHub Copilot agent uses to design queries for an Azure SQL database named sqldb-claims. The MCP server connects to the database with a dedicated database user named mcp_claims.

    The agent only needs the names of the tables, columns and keys. The claims data is regulated and must not be read by the agent. The solution must follow the principle of least privilege.

    What should you grant to mcp_claims?
  fr: |
    Vous configurez un serveur MCP qu'un agent GitHub Copilot utilise pour concevoir des requêtes pour une base de données Azure SQL nommée sqldb-claims. Le serveur MCP se connecte à la base de données avec un utilisateur de base de données dédié nommé mcp_claims.

    L'agent n'a besoin que des noms des tables, des colonnes et des clés. Les données de sinistres sont réglementées et ne doivent pas être lues par l'agent. La solution doit respecter le principe du moindre privilège.

    Que devez-vous accorder à mcp_claims ?
body:
  options:
    - { id: a, text: { en: "Membership in the db_datareader database role", fr: "L'appartenance au rôle de base de données db_datareader" } }
    - { id: b, text: { en: "The VIEW DEFINITION permission on the database", fr: "L'autorisation VIEW DEFINITION sur la base de données" } }
    - { id: c, text: { en: "The SELECT permission on the dbo schema", fr: "L'autorisation SELECT sur le schéma dbo" } }
    - { id: d, text: { en: "Membership in the db_owner database role", fr: "L'appartenance au rôle de base de données db_owner" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Use a dedicated, least-privilege identity for MCP connections, and when the AI only needs schema information, don't grant permissions that read data. VIEW DEFINITION lets the user see the metadata of the objects without reading their rows.
    fr: |
      Utilisez une identité dédiée à moindre privilège pour les connexions MCP et, quand l'IA n'a besoin que des informations de schéma, n'accordez pas d'autorisations de lecture des données. VIEW DEFINITION permet à l'utilisateur de voir les métadonnées des objets sans lire leurs lignes.
  options:
    a: { en: "db_datareader can read every table, including the regulated claims data.", fr: "db_datareader peut lire toutes les tables, y compris les données réglementées." }
    c: { en: "SELECT on the schema reads the rows of its tables, which the agent must not do.", fr: "SELECT sur le schéma lit les lignes de ses tables, ce que l'agent ne doit pas faire." }
    d: { en: "db_owner grants full control of the database, far beyond the need.", fr: "db_owner accorde le contrôle total de la base de données, bien au-delà du besoin." }
references:
  - title: Interpret security impact of using AI-assisted tools
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/3-interpret-security-impact
  - title: Configure model and model context protocol (MCP) tool options in a GitHub Copilot or Fabric Copilot chat session
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/5-configure-model-mcp-tool-options
