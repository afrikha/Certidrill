id: dp800-1b-trg-facts
objective: "1.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the DML triggers of an Azure SQL database for Tailspin Toys before a code review session. The database uses the default database options.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les déclencheurs DML d'une base de données Azure SQL pour Tailspin Toys avant une séance de revue de code. La base utilise les options de base de données par défaut.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An AFTER UPDATE trigger fires once for each row modified by the UPDATE statement.", fr: "Un déclencheur AFTER UPDATE se déclenche une fois pour chaque ligne modifiée par l'instruction UPDATE." } }
    - { id: b, text: { en: "An AFTER DELETE trigger fires even when the DELETE statement removes no rows.", fr: "Un déclencheur AFTER DELETE se déclenche même quand l'instruction DELETE ne supprime aucune ligne." } }
    - { id: c, text: { en: "A table can have two INSTEAD OF UPDATE triggers.", fr: "Une table peut avoir deux déclencheurs INSTEAD OF UPDATE." } }
    - { id: d, text: { en: "Inside a trigger, SET XACT_ABORT is ON by default.", fr: "Dans un déclencheur, SET XACT_ABORT est ON par défaut." } }
    - { id: e, text: { en: "An AFTER INSERT trigger can be defined on a view to make the view insertable.", fr: "Un déclencheur AFTER INSERT peut être défini sur une vue pour rendre la vue accessible en insertion." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      DML triggers fire when a valid event occurs, whether or not table rows are affected, so triggers often start with a test such as IF (ROWCOUNT_BIG() = 0) RETURN. SET XACT_ABORT is OFF by default in a Transact-SQL statement but ON by default in a trigger, so a run-time error in a trigger rolls back the whole transaction.
    fr: |
      Les déclencheurs DML s'exécutent quand un événement valide se produit, que des lignes de la table soient affectées ou non : les déclencheurs commencent souvent par un test comme IF (ROWCOUNT_BIG() = 0) RETURN. SET XACT_ABORT est OFF par défaut dans une instruction Transact-SQL mais ON par défaut dans un déclencheur : une erreur d'exécution dans un déclencheur restaure toute la transaction.
  options:
    a: { en: "A trigger fires once per statement; the inserted and deleted tables contain all the rows that the statement modified.", fr: "Un déclencheur s'exécute une fois par instruction ; les tables inserted et deleted contiennent toutes les lignes modifiées par l'instruction." }
    c: { en: "At most one INSTEAD OF trigger can be defined per INSERT, UPDATE or DELETE statement on a table or view.", fr: "Un seul déclencheur INSTEAD OF au maximum peut être défini par instruction INSERT, UPDATE ou DELETE sur une table ou une vue." }
    e: { en: "AFTER triggers cannot be defined on views; an INSTEAD OF trigger makes a view updatable.", fr: "Les déclencheurs AFTER ne peuvent pas être définis sur des vues ; un déclencheur INSTEAD OF rend une vue modifiable." }
references:
  - title: CREATE TRIGGER (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-trigger-transact-sql
  - title: SET XACT_ABORT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-xact-abort-transact-sql
