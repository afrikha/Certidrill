id: dp800-1d-ssms-add-mcp-server
objective: "1.4.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Database administrators at Tailspin run SQL Server Management Studio (SSMS) 22.4 with the AI Assistance workload and use GitHub Copilot Chat in Ask mode. The GitHub policies of the organization allow Agent mode and MCP servers.

    An administrator needs Copilot to use the tools of an HTTP MCP server named inventory-mcp.

    Which four actions should the administrator perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Les administrateurs de bases de données de Tailspin exécutent SQL Server Management Studio (SSMS) 22.4 avec la charge de travail AI Assistance et utilisent GitHub Copilot Chat en mode Ask. Les stratégies GitHub de l'organisation autorisent le mode Agent et les serveurs MCP.

    Un administrateur a besoin que Copilot utilise les outils d'un serveur MCP HTTP nommé inventory-mcp.

    Quelles sont les quatre actions que l'administrateur doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: update, text: { en: "Update SSMS to version 22.7 or later.", fr: "Mettre à jour SSMS vers la version 22.7 ou une version ultérieure." } }
    - { id: agent, text: { en: "In the Copilot Chat window, set the chat mode to Agent.", fr: "Dans la fenêtre Copilot Chat, définir le mode de conversation sur Agent." } }
    - { id: add, text: { en: "Select the Tools icon, select + and Add custom MCP server, enter the Server ID, the HTTP type and the URL, and save.", fr: "Sélectionner l'icône Tools, sélectionner + et Add custom MCP server, entrer le Server ID, le type HTTP et l'URL, puis enregistrer." } }
    - { id: enable, text: { en: "In the Tools list, select the tools of inventory-mcp.", fr: "Dans la liste Tools, sélectionner les outils d'inventory-mcp." } }
    - { id: palette, text: { en: "Run `MCP: Add Server` from the Command Palette.", fr: "Exécuter `MCP: Add Server` depuis la palette de commandes." } }
    - { id: ext, text: { en: "Install the GitHub Copilot Chat extension from the Extensions view.", fr: "Installer l'extension GitHub Copilot Chat depuis la vue Extensions." } }
answer:
  sequence: [update, agent, add, enable]
explanation:
  correct:
    en: |
      MCP servers in SSMS require SSMS 22.7 or later and Agent mode, so you update SSMS and switch the chat to Agent first. You add a custom server from the Tools icon of Copilot Chat, enter its Server ID, type and URL, and save, and SSMS initializes it. Its tools are disabled by default, so you enable them in the Tools list before Copilot can call them.
    fr: |
      Les serveurs MCP dans SSMS exigent SSMS 22.7 ou une version ultérieure et le mode Agent : vous mettez d'abord SSMS à jour et passez la conversation en mode Agent. Vous ajoutez un serveur personnalisé depuis l'icône Tools de Copilot Chat, entrez son Server ID, son type et son URL, puis enregistrez ; SSMS l'initialise. Ses outils sont désactivés par défaut : vous les activez dans la liste Tools avant que Copilot puisse les appeler.
  options:
    palette: { en: "`MCP: Add Server` is a Visual Studio Code command, not an SSMS one.", fr: "`MCP: Add Server` est une commande de Visual Studio Code, pas de SSMS." }
    ext: { en: "The Extensions view and the GitHub Copilot Chat extension belong to Visual Studio Code; SSMS gets Copilot from the AI Assistance workload.", fr: "La vue Extensions et l'extension GitHub Copilot Chat appartiennent à Visual Studio Code ; SSMS obtient Copilot par la charge de travail AI Assistance." }
references:
  - title: Use MCP servers with GitHub Copilot in SQL Server Management Studio
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/mcp-servers
