id: dp800-1b-view-order-by
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at Fabrikam created the following view in an Azure SQL database.

    ```sql
    CREATE VIEW Sales.vRecentOrders
    AS
    SELECT TOP (100) PERCENT OrderID, CustomerID, OrderDate, Amount
    FROM Sales.Orders
    WHERE OrderDate >= '20260101'
    ORDER BY OrderDate DESC;
    ```

    A report runs `SELECT * FROM Sales.vRecentOrders;` and the rows are not returned in descending order of OrderDate.

    You need to ensure that the report always returns the rows sorted by OrderDate in descending order.

    What should you do?
  fr: |
    Un développeur de Fabrikam a créé la vue suivante dans une base de données Azure SQL.

    ```sql
    CREATE VIEW Sales.vRecentOrders
    AS
    SELECT TOP (100) PERCENT OrderID, CustomerID, OrderDate, Amount
    FROM Sales.Orders
    WHERE OrderDate >= '20260101'
    ORDER BY OrderDate DESC;
    ```

    Un rapport exécute `SELECT * FROM Sales.vRecentOrders;` et les lignes ne sont pas renvoyées dans l'ordre décroissant de OrderDate.

    Vous devez vous assurer que le rapport renvoie toujours les lignes triées par OrderDate dans l'ordre décroissant.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a clustered index on the OrderDate column of Sales.Orders.", fr: "Créer un index cluster sur la colonne OrderDate de Sales.Orders." } }
    - { id: b, text: { en: "Add ORDER BY OrderDate DESC to the query of the report.", fr: "Ajouter ORDER BY OrderDate DESC à la requête du rapport." } }
    - { id: c, text: { en: "Add WITH SCHEMABINDING to the view definition.", fr: "Ajouter WITH SCHEMABINDING à la définition de la vue." } }
    - { id: d, text: { en: "Add WITH CHECK OPTION to the view definition.", fr: "Ajouter WITH CHECK OPTION à la définition de la vue." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An ORDER BY clause is allowed in a view only together with TOP (or OFFSET), and even then it does not guarantee ordered results when the view is queried. Only an ORDER BY clause in the outer query that reads the view guarantees the order of the rows returned to the report.
    fr: |
      Une clause ORDER BY n'est autorisée dans une vue qu'avec TOP (ou OFFSET), et même dans ce cas elle ne garantit pas des résultats triés quand la vue est interrogée. Seule une clause ORDER BY dans la requête externe qui lit la vue garantit l'ordre des lignes renvoyées au rapport.
  options:
    a: { en: "A clustered index can make an ordered scan likely, but without ORDER BY in the query the order of the result is never guaranteed.", fr: "Un index cluster peut rendre une analyse ordonnée probable, mais sans ORDER BY dans la requête l'ordre du résultat n'est jamais garanti." }
    c: { en: "Schema binding protects the base tables from schema changes; it has no effect on the order of the rows.", fr: "La liaison au schéma protège les tables de base contre les modifications de schéma ; elle n'a aucun effet sur l'ordre des lignes." }
    d: { en: "CHECK OPTION validates rows modified through the view; it has no effect on the order of the rows returned.", fr: "CHECK OPTION valide les lignes modifiées par la vue ; elle n'a aucun effet sur l'ordre des lignes renvoyées." }
references:
  - title: CREATE VIEW (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-view-transact-sql
