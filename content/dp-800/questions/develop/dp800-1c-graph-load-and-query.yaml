id: dp800-1c-graph-load-and-query
objective: "1.3.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named **HR.Staff** with the columns StaffID, FullName and ManagerID. A report walks the management chain by using a recursive CTE.

    You need to replace the recursive CTE with a graph query that uses MATCH. You will store the people in a new node table named **HR.Person** and the reporting lines in a new edge table named **HR.ManagedBy**.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée **HR.Staff** avec les colonnes StaffID, FullName et ManagerID. Un rapport parcourt la chaîne hiérarchique à l'aide d'une CTE récursive.

    Vous devez remplacer la CTE récursive par une requête de graphe qui utilise MATCH. Vous stockerez les personnes dans une nouvelle table de nœuds nommée **HR.Person** et les liens hiérarchiques dans une nouvelle table d'arêtes nommée **HR.ManagedBy**.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: tables
      text: { en: "Create HR.Person by using `AS NODE` and HR.ManagedBy by using `AS EDGE`.", fr: "Créer HR.Person avec `AS NODE` et HR.ManagedBy avec `AS EDGE`." }
    - id: nodes
      text: { en: "Insert one row per staff member from HR.Staff into HR.Person.", fr: "Insérer dans HR.Person une ligne par membre du personnel issue de HR.Staff." }
    - id: edges
      text: { en: "Insert one row per reporting line into HR.ManagedBy, with $from_id and $to_id set to the $node_id values of the employee and of the manager.", fr: "Insérer dans HR.ManagedBy une ligne par lien hiérarchique, avec $from_id et $to_id définis sur les valeurs $node_id de l'employé et du responsable." }
    - id: query
      text: { en: "Run a query that uses `MATCH(SHORTEST_PATH(...))` to return the management chain of each employee.", fr: "Exécuter une requête qui utilise `MATCH(SHORTEST_PATH(...))` pour renvoyer la chaîne hiérarchique de chaque employé." }
    - id: rawids
      text: { en: "Insert one row per reporting line into HR.ManagedBy, with $from_id and $to_id set to the StaffID and ManagerID values.", fr: "Insérer dans HR.ManagedBy une ligne par lien hiérarchique, avec $from_id et $to_id définis sur les valeurs StaffID et ManagerID." }
    - id: maxrec
      text: { en: "Add `OPTION (MAXRECURSION 0)` to the graph query.", fr: "Ajouter `OPTION (MAXRECURSION 0)` à la requête de graphe." }
answer:
  sequence: [tables, nodes, edges, query]
explanation:
  correct:
    en: |
      The node and edge tables must exist before they are loaded. Node rows must be inserted before edge rows, because each edge stores the $node_id values of its two nodes in $from_id and $to_id. The MATCH query then traverses the edges.
    fr: |
      Les tables de nœuds et d'arêtes doivent exister avant d'être chargées. Les lignes de nœuds doivent être insérées avant les lignes d'arêtes, car chaque arête stocke dans $from_id et $to_id les valeurs $node_id de ses deux nœuds. La requête MATCH parcourt ensuite les arêtes.
  options:
    rawids: { en: "$from_id and $to_id must receive $node_id values, not the business keys of the nodes.", fr: "$from_id et $to_id doivent recevoir des valeurs $node_id, pas les clés métier des nœuds." }
    maxrec: { en: "MAXRECURSION limits recursive CTEs; SHORTEST_PATH limits its depth with its own quantifier.", fr: "MAXRECURSION limite les CTE récursives ; SHORTEST_PATH limite sa profondeur avec son propre quantificateur." }
references:
  - title: Create a graph database and run some pattern matching queries using T-SQL
    url: https://learn.microsoft.com/en-us/sql/relational-databases/graphs/sql-graph-sample
  - title: MATCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/match-sql-graph
