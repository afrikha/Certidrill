id: dp800-1c-regex-tvf-results
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that has a compatibility level of 170. You run the following queries.

    ```sql
    SELECT value, ordinal
    FROM REGEXP_SPLIT_TO_TABLE('A-12, B-7 ,C-3', '\s*,\s*');

    SELECT match_id, match_value, substring_matches
    FROM REGEXP_MATCHES('A-12, B-7 ,C-3', '([A-Z])-(\d+)');
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL dont le niveau de compatibilité est 170. Vous exécutez les requêtes suivantes.

    ```sql
    SELECT value, ordinal
    FROM REGEXP_SPLIT_TO_TABLE('A-12, B-7 ,C-3', '\s*,\s*');

    SELECT match_id, match_value, substring_matches
    FROM REGEXP_MATCHES('A-12, B-7 ,C-3', '([A-Z])-(\d+)');
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The first query returns three rows whose ordinal values are 1, 2 and 3.", fr: "La première requête renvoie trois lignes dont les valeurs ordinal sont 1, 2 et 3." } }
    - { id: b, text: { en: "The first query returns the separators as rows.", fr: "La première requête renvoie les séparateurs sous forme de lignes." } }
    - { id: c, text: { en: "The second query returns one row whose match_value contains the three codes.", fr: "La deuxième requête renvoie une seule ligne dont la valeur match_value contient les trois codes." } }
    - { id: d, text: { en: "In each row of the second query, substring_matches describes the values of the two capture groups as a JSON array.", fr: "Dans chaque ligne de la deuxième requête, substring_matches décrit les valeurs des deux groupes de capture sous forme de tableau JSON." } }
    - { id: e, text: { en: "Both queries require the PREVIEW_FEATURES database scoped configuration.", fr: "Les deux requêtes exigent la configuration délimitée à la base de données PREVIEW_FEATURES." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      REGEXP_SPLIT_TO_TABLE splits the string at each match of the pattern and returns the pieces in the value column, with a 1-based ordinal column. REGEXP_MATCHES returns one row per match, with match_id, start_position, end_position, match_value and substring_matches, a json value that lists each captured group with its value, start and length.
    fr: |
      REGEXP_SPLIT_TO_TABLE découpe la chaîne à chaque correspondance du modèle et renvoie les morceaux dans la colonne value, avec une colonne ordinal commençant à 1. REGEXP_MATCHES renvoie une ligne par correspondance, avec match_id, start_position, end_position, match_value et substring_matches, une valeur json qui liste chaque groupe capturé avec sa valeur, son début et sa longueur.
  options:
    b: { en: "The separators are the matches of the pattern; they delimit the rows and aren't returned.", fr: "Les séparateurs sont les correspondances du modèle ; ils délimitent les lignes et ne sont pas renvoyés." }
    c: { en: "REGEXP_MATCHES returns one row for each match, so three rows here.", fr: "REGEXP_MATCHES renvoie une ligne par correspondance, donc trois lignes ici." }
    e: { en: "The table-valued regular expression functions depend on compatibility level 170, which the database already has.", fr: "Les fonctions table d'expressions régulières dépendent du niveau de compatibilité 170, que la base de données a déjà." }
references:
  - title: REGEXP_MATCHES (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-matches-transact-sql
  - title: REGEXP_SPLIT_TO_TABLE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-split-to-table-transact-sql
