id: dp800-1b-cte-maxrecursion
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database for Litware. A recursive CTE named Chain returns the full approval chain of a document, and the outer statement is `SELECT * FROM Chain;`. The deepest approval chain in the data has 240 levels.

    The query fails with error 530: "The statement terminated. The maximum recursion 100 has been exhausted before statement completion."

    You need the query to return the complete chain. If a data entry error ever creates a cycle in the chain, the query must stop with an error instead of running indefinitely.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL pour Litware. Une CTE récursive nommée Chain renvoie la chaîne d'approbation complète d'un document, et l'instruction externe est `SELECT * FROM Chain;`. La chaîne d'approbation la plus profonde des données compte 240 niveaux.

    La requête échoue avec l'erreur 530 : « The statement terminated. The maximum recursion 100 has been exhausted before statement completion. »

    Vous devez faire en sorte que la requête renvoie la chaîne complète. Si une erreur de saisie crée un jour un cycle dans la chaîne, la requête doit s'arrêter avec une erreur au lieu de s'exécuter indéfiniment.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add OPTION (MAXRECURSION 0) to the outer SELECT statement.", fr: "Ajouter OPTION (MAXRECURSION 0) à l'instruction SELECT externe." } }
    - { id: b, text: { en: "Add OPTION (MAXRECURSION 300) at the end of the recursive member inside the CTE.", fr: "Ajouter OPTION (MAXRECURSION 300) à la fin du membre récursif dans la CTE." } }
    - { id: c, text: { en: "Replace UNION ALL with UNION between the anchor and the recursive member.", fr: "Remplacer UNION ALL par UNION entre l'ancrage et le membre récursif." } }
    - { id: d, text: { en: "Add OPTION (MAXRECURSION 300) to the outer SELECT statement.", fr: "Ajouter OPTION (MAXRECURSION 300) à l'instruction SELECT externe." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The default recursion limit is 100. The MAXRECURSION hint, between 0 and 32,767, is set in the OPTION clause of the statement that uses the CTE. A limit of 300 lets the 240 levels complete, and a cycle still reaches the limit and ends the statement with an error.
    fr: |
      La limite de récursivité par défaut est 100. L'indicateur MAXRECURSION, entre 0 et 32 767, se définit dans la clause OPTION de l'instruction qui utilise la CTE. Une limite de 300 permet aux 240 niveaux de se terminer, et un cycle atteint toujours la limite et met fin à l'instruction avec une erreur.
  options:
    a: { en: "MAXRECURSION 0 removes the limit, so a cycle would make the query run indefinitely.", fr: "MAXRECURSION 0 supprime la limite : un cycle ferait s'exécuter la requête indéfiniment." }
    b: { en: "An OPTION clause with query hints is not allowed in the CTE definition; it can appear only in the outermost statement.", fr: "Une clause OPTION avec des indicateurs de requête n'est pas autorisée dans la définition de la CTE ; elle ne peut figurer que dans l'instruction la plus externe." }
    c: { en: "UNION ALL is the only set operator allowed between the last anchor member and the first recursive member.", fr: "UNION ALL est le seul opérateur ensembliste autorisé entre le dernier membre d'ancrage et le premier membre récursif." }
references:
