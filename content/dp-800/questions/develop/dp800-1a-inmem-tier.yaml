id: dp800-1a-inmem-tier
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure SQL database named **GameState** in the General Purpose service tier of the vCore purchasing model. You plan to store player sessions in memory-optimized tables.

    The database must remain in the vCore purchasing model.

    To which service tier should you move GameState?
  fr: |
    Tailspin Toys dispose d'une base de données Azure SQL nommée **GameState** dans le niveau de service General Purpose du modèle d'achat vCore. Vous prévoyez de stocker les sessions des joueurs dans des tables optimisées en mémoire.

    La base de données doit rester dans le modèle d'achat vCore.

    Vers quel niveau de service devez-vous déplacer GameState ?
body:
  options:
    - { id: a, text: Premium }
    - { id: b, text: Business Critical }
    - { id: c, text: { en: "General Purpose serverless", fr: "General Purpose serverless" } }
    - { id: d, text: Standard }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In Azure SQL Database, In-Memory OLTP is supported in the Premium tier of the DTU model and the Business Critical tier of the vCore model. Business Critical is therefore the only tier that meets both the memory-optimized table requirement and the vCore requirement.
    fr: |
      Dans Azure SQL Database, In-Memory OLTP est pris en charge dans le niveau Premium du modèle DTU et dans le niveau Business Critical du modèle vCore. Business Critical est donc le seul niveau qui satisfait à la fois l'exigence de tables optimisées en mémoire et l'exigence vCore.
  options:
    a: { en: "Premium supports In-Memory OLTP but belongs to the DTU purchasing model.", fr: "Premium prend en charge In-Memory OLTP mais appartient au modèle d'achat DTU." }
    c: { en: "General Purpose, provisioned or serverless, doesn't support In-Memory OLTP.", fr: "General Purpose, provisionné ou serverless, ne prend pas en charge In-Memory OLTP." }
    d: { en: "Standard is a DTU tier and doesn't support In-Memory OLTP.", fr: "Standard est un niveau DTU et ne prend pas en charge In-Memory OLTP." }
references:
  - title: Optimize performance by using in-memory technologies in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/in-memory-oltp-overview
