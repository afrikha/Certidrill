id: dp800-1d-catch-error-functions
objective: "1.3.8"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A stored procedure named Finance.usp_CloseMonth calls several other stored procedures. When an error occurs, its CATCH block must write the following information to dbo.ErrorLog:

    - the name of the stored procedure in which the error occurred;
    - the line number at which the error occurred;
    - the severity of the error.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une procédure stockée nommée Finance.usp_CloseMonth appelle plusieurs autres procédures stockées. Quand une erreur se produit, son bloc CATCH doit écrire les informations suivantes dans dbo.ErrorLog :

    - le nom de la procédure stockée dans laquelle l'erreur s'est produite ;
    - le numéro de la ligne à laquelle l'erreur s'est produite ;
    - la gravité de l'erreur.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    BEGIN CATCH
        IF XACT_STATE() <> 0 ROLLBACK TRANSACTION;

        INSERT INTO dbo.ErrorLog (ErrorNumber, ProcName, LineNumber, Severity)
        VALUES (ERROR_NUMBER(), [[proc]], [[line]], [[sev]]);

        THROW;
    END CATCH;
  slots:
    - id: proc
      options:
        - { id: errproc, text: "ERROR_PROCEDURE()" }
        - { id: errmsg, text: "ERROR_MESSAGE()" }
        - { id: errstate, text: "ERROR_STATE()" }
    - id: line
      options:
        - { id: rowcount, text: "@@ROWCOUNT" }
        - { id: errline, text: "ERROR_LINE()" }
        - { id: errstate, text: "ERROR_STATE()" }
    - id: sev
      options:
        - { id: errstate, text: "ERROR_STATE()" }
        - { id: xact, text: "XACT_STATE()" }
        - { id: errsev, text: "ERROR_SEVERITY()" }
answer:
  values: { proc: errproc, line: errline, sev: errsev }
explanation:
  correct:
    en: |
      Inside a CATCH block, ERROR_PROCEDURE() returns the name of the stored procedure or trigger in which the error occurred, even when it is a procedure called by the current one. ERROR_LINE() returns the line number inside that routine, and ERROR_SEVERITY() returns the severity. These functions return NULL outside the scope of a CATCH block.
    fr: |
      Dans un bloc CATCH, ERROR_PROCEDURE() renvoie le nom de la procédure stockée ou du déclencheur où l'erreur s'est produite, même s'il s'agit d'une procédure appelée par la procédure actuelle. ERROR_LINE() renvoie le numéro de ligne dans cette routine et ERROR_SEVERITY() renvoie la gravité. Ces fonctions renvoient NULL en dehors de la portée d'un bloc CATCH.
  options:
    errstate: { en: "ERROR_STATE() returns the state number of the error, not its procedure, line or severity.", fr: "ERROR_STATE() renvoie le numéro d'état de l'erreur, pas sa procédure, sa ligne ni sa gravité." }
    rowcount: { en: "@@ROWCOUNT returns the number of rows affected by the previous statement.", fr: "@@ROWCOUNT renvoie le nombre de lignes affectées par l'instruction précédente." }
    xact: { en: "XACT_STATE() describes the transaction state (1, 0 or -1), not the error severity.", fr: "XACT_STATE() décrit l'état de la transaction (1, 0 ou -1), pas la gravité de l'erreur." }
references:
  - title: TRY...CATCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/try-catch-transact-sql
