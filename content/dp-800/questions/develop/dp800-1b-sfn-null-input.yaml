id: dp800-1b-sfn-null-input
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains the following scalar function.

    ```sql
    CREATE FUNCTION Sales.ufn_NetPrice (@UnitPrice decimal(10, 2), @Discount decimal(4, 3))
    RETURNS decimal(10, 2)
    AS
    BEGIN
        RETURN @UnitPrice * (1 - ISNULL(@Discount, 0));
    END;
    ```

    Business rules change: when the unit price or the discount is unknown (NULL), the net price must also be unknown. The solution must not change the body of the function.

    Which option should you add to the function definition?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient la fonction scalaire suivante.

    ```sql
    CREATE FUNCTION Sales.ufn_NetPrice (@UnitPrice decimal(10, 2), @Discount decimal(4, 3))
    RETURNS decimal(10, 2)
    AS
    BEGIN
        RETURN @UnitPrice * (1 - ISNULL(@Discount, 0));
    END;
    ```

    Les règles métier changent : quand le prix unitaire ou la remise est inconnu (NULL), le prix net doit aussi être inconnu. La solution ne doit pas modifier le corps de la fonction.

    Quelle option devez-vous ajouter à la définition de la fonction ?
body:
  options:
    - { id: a, text: "WITH RETURNS NULL ON NULL INPUT" }
    - { id: b, text: "WITH SCHEMABINDING" }
    - { id: c, text: "WITH INLINE = OFF" }
    - { id: d, text: "WITH CALLED ON NULL INPUT" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      RETURNS NULL ON NULL INPUT sets the OnNULLCall attribute of the scalar function: when any argument is NULL, the function returns NULL. Without this option, CALLED ON NULL INPUT applies by default and the body runs, so ISNULL turns a NULL discount into 0.
    fr: |
      RETURNS NULL ON NULL INPUT définit l'attribut OnNULLCall de la fonction scalaire : quand un argument est NULL, la fonction renvoie NULL. Sans cette option, CALLED ON NULL INPUT s'applique par défaut et le corps s'exécute : ISNULL transforme alors une remise NULL en 0.
  options:
    d: { en: "CALLED ON NULL INPUT is the default behavior: the body runs and handles NULL values itself.", fr: "CALLED ON NULL INPUT est le comportement par défaut : le corps s'exécute et gère lui-même les valeurs NULL." }
    b: { en: "Schema binding protects the referenced objects; it does not change how NULL arguments are handled.", fr: "La liaison au schéma protège les objets référencés ; elle ne change pas le traitement des arguments NULL." }
    c: { en: "INLINE = OFF prevents scalar UDF inlining; the function still runs its body for NULL arguments.", fr: "INLINE = OFF empêche l'incorporation de la fonction scalaire ; la fonction exécute toujours son corps pour des arguments NULL." }
references:
  - title: CREATE FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql
