id: dp800-1c-fuzzy-max-distance
objective: "1.3.5"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You have a SQL Server 2025 database in which the PREVIEW_FEATURES database scoped configuration is set to ON.

    You run the following statement.

    ```sql
    SELECT EDIT_DISTANCE(N'Northwind Traders', N'Tailspin Toys', 3) AS Distance;
    ```

    The two strings need more than three edits to become identical.

    What does the statement return?
  fr: |
    Vous disposez d'une base de données SQL Server 2025 dans laquelle la configuration délimitée à la base de données PREVIEW_FEATURES est définie sur ON.

    Vous exécutez l'instruction suivante.

    ```sql
    SELECT EDIT_DISTANCE(N'Northwind Traders', N'Tailspin Toys', 3) AS Distance;
    ```

    Les deux chaînes nécessitent plus de trois modifications pour devenir identiques.

    Que renvoie l'instruction ?
body:
  options:
    - { id: a, text: "NULL" }
    - { id: b, text: "3" }
    - { id: c, text: "4" }
    - { id: d, text: { en: "An error", fr: "Une erreur" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The third argument, maximum_distance, lets the function stop once the distance exceeds the limit. If the actual distance is greater than maximum_distance, EDIT_DISTANCE returns maximum_distance + 1, which is 4 here.
    fr: |
      Le troisième argument, maximum_distance, permet à la fonction de s'arrêter dès que la distance dépasse la limite. Si la distance réelle est supérieure à maximum_distance, EDIT_DISTANCE renvoie maximum_distance + 1, soit 4 ici.
  options:
    a: { en: "NULL is returned only when an argument, including maximum_distance, is NULL.", fr: "NULL n'est renvoyé que lorsqu'un argument, y compris maximum_distance, est NULL." }
    b: { en: "The limit itself is returned only when the actual distance is exactly 3.", fr: "La limite elle-même n'est renvoyée que lorsque la distance réelle vaut exactement 3." }
    d: { en: "Exceeding maximum_distance isn't an error; the function returns the limit plus one.", fr: "Dépasser maximum_distance n'est pas une erreur ; la fonction renvoie la limite plus un." }
references:
  - title: EDIT_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/edit-distance-transact-sql
