id: dp800-1d-catch-not-handled
objective: "1.3.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You review a batch that runs in an Azure SQL database. The batch contains a TRY...CATCH construct, and its CATCH block logs every error that it receives. The session isn't ended by any of the errors.

    Which two errors are NOT handled by the CATCH block of the batch?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez un lot qui s'exécute dans une base de données Azure SQL. Le lot contient une construction TRY...CATCH, et son bloc CATCH journalise toutes les erreurs qu'il reçoit. Aucune de ces erreurs ne met fin à la session.

    Quelles sont les deux erreurs qui ne sont PAS traitées par le bloc CATCH du lot ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A RAISERROR statement with severity 10 in the TRY block", fr: "Une instruction RAISERROR de gravité 10 dans le bloc TRY" } }
    - { id: b, text: { en: "A divide-by-zero error in a SELECT statement of the TRY block", fr: "Une erreur de division par zéro dans une instruction SELECT du bloc TRY" } }
    - { id: c, text: { en: "A PRIMARY KEY violation in a stored procedure called from the TRY block", fr: "Une violation de PRIMARY KEY dans une procédure stockée appelée depuis le bloc TRY" } }
    - { id: d, text: { en: "A syntax error in a statement of the same batch", fr: "Une erreur de syntaxe dans une instruction du même lot" } }
    - { id: e, text: { en: "An invalid object name in a stored procedure called from the TRY block", fr: "Un nom d'objet non valide dans une procédure stockée appelée depuis le bloc TRY" } }
    - { id: f, text: { en: "A conversion error raised by CAST in the TRY block", fr: "Une erreur de conversion levée par CAST dans le bloc TRY" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      TRY...CATCH handles run-time errors with a severity higher than 10 that don't close the connection. A severity of 10 or lower is an informational message and doesn't transfer control to CATCH. A syntax error is a compile error: it prevents the batch from running at all, so the CATCH block never runs.
    fr: |
      TRY...CATCH traite les erreurs d'exécution de gravité supérieure à 10 qui ne ferment pas la connexion. Une gravité de 10 ou moins correspond à un message d'information et ne transfère pas le contrôle au bloc CATCH. Une erreur de syntaxe est une erreur de compilation : elle empêche l'exécution du lot, donc le bloc CATCH ne s'exécute jamais.
  options:
    b: { en: "A divide-by-zero error is a run-time error with a severity higher than 10, so CATCH handles it.", fr: "Une division par zéro est une erreur d'exécution de gravité supérieure à 10 : le bloc CATCH la traite." }
    c: { en: "Unhandled errors of a stored procedure called from the TRY block go to the CATCH block of the caller.", fr: "Les erreurs non traitées d'une procédure stockée appelée depuis le bloc TRY sont transmises au bloc CATCH de l'appelant." }
    e: { en: "Name resolution errors are caught when they occur at a lower execution level, such as in a called procedure.", fr: "Les erreurs de résolution de nom sont interceptées quand elles se produisent à un niveau d'exécution inférieur, par exemple dans une procédure appelée." }
    f: { en: "A conversion error is a run-time error with a severity higher than 10, so CATCH handles it.", fr: "Une erreur de conversion est une erreur d'exécution de gravité supérieure à 10 : le bloc CATCH la traite." }
references:
  - title: TRY...CATCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/try-catch-transact-sql
  - title: RAISERROR (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/raiserror-transact-sql
