id: dp800-1a-money-type
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam stores invoice lines in an Azure SQL database. You are adding a column named **LineAmount** to the **Billing.InvoiceLine** table.

    LineAmount must store values from 0 to 9,999,999.99 with exactly two decimal places. Calculations on the column must never be affected by binary floating-point rounding. The column must use as little storage as possible.

    Which data type should you use?
  fr: |
    Fabrikam stocke des lignes de facture dans une base de données Azure SQL. Vous ajoutez une colonne nommée **LineAmount** à la table **Billing.InvoiceLine**.

    LineAmount doit stocker des valeurs de 0 à 9 999 999,99 avec exactement deux décimales. Les calculs sur la colonne ne doivent jamais être affectés par les arrondis de la virgule flottante binaire. La colonne doit utiliser le moins de stockage possible.

    Quel type de données devez-vous utiliser ?
body:
  options:
    - { id: a, text: "decimal(7, 2)" }
    - { id: b, text: "decimal(9, 2)" }
    - { id: c, text: "float(53)" }
    - { id: d, text: "real" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      decimal is an exact numeric type, so it has no floating-point rounding. In decimal(p, s), p is the total number of digits and s the digits after the decimal point: 9,999,999.99 has seven integer digits plus two decimals, so decimal(9, 2) is the smallest precision that holds every value.
    fr: |
      decimal est un type numérique exact : il ne subit pas d'arrondi de virgule flottante. Dans decimal(p, s), p est le nombre total de chiffres et s le nombre de chiffres après la virgule : 9 999 999,99 compte sept chiffres entiers et deux décimales, donc decimal(9, 2) est la plus petite précision qui contient toutes les valeurs.
  options:
    a: { en: "decimal(7, 2) leaves only five integer digits, so its maximum is 99,999.99.", fr: "decimal(7, 2) ne laisse que cinq chiffres entiers : sa valeur maximale est 99 999,99." }
    c: { en: "float is an approximate type, so amounts can suffer from binary rounding.", fr: "float est un type approximatif : les montants peuvent subir des arrondis binaires." }
    d: { en: "real is also an approximate floating-point type, with even less precision than float(53).", fr: "real est aussi un type à virgule flottante approximatif, encore moins précis que float(53)." }
references:
  - title: decimal and numeric (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/decimal-and-numeric-transact-sql
