id: dp800-1c-win-last-value-frame
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a table named **Sales.PriceHistory** that has the columns ProductID, PriceDate and Price. Each product has one row per price change.

    You write the following query.

    ```sql
    SELECT ProductID, PriceDate, Price,
           LAST_VALUE(Price) OVER (PARTITION BY ProductID
                                   ORDER BY PriceDate) AS CurrentPrice
    FROM Sales.PriceHistory;
    ```

    The CurrentPrice column returns the price of the same row instead of the most recent price of the product. Every row of a product must show the price of the latest PriceDate of that product.

    What should you do?
  fr: |
    Vous disposez d'une table nommée **Sales.PriceHistory** qui contient les colonnes ProductID, PriceDate et Price. Chaque produit a une ligne par changement de prix.

    Vous écrivez la requête suivante.

    ```sql
    SELECT ProductID, PriceDate, Price,
           LAST_VALUE(Price) OVER (PARTITION BY ProductID
                                   ORDER BY PriceDate) AS CurrentPrice
    FROM Sales.PriceHistory;
    ```

    La colonne CurrentPrice renvoie le prix de la ligne elle-même au lieu du prix le plus récent du produit. Chaque ligne d'un produit doit afficher le prix de la date PriceDate la plus récente de ce produit.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add `IGNORE NULLS` after `LAST_VALUE(Price)`.", fr: "Ajouter `IGNORE NULLS` après `LAST_VALUE(Price)`." }
    - id: b
      text: { en: "Add `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING` after `ORDER BY PriceDate`.", fr: "Ajouter `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING` après `ORDER BY PriceDate`." }
    - id: c
      text: { en: "Add `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` after `ORDER BY PriceDate`.", fr: "Ajouter `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` après `ORDER BY PriceDate`." }
    - id: d
      text: { en: "Replace `PARTITION BY ProductID` with `PARTITION BY ProductID, PriceDate`.", fr: "Remplacer `PARTITION BY ProductID` par `PARTITION BY ProductID, PriceDate`." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When ORDER BY is specified without a frame, the window frame defaults to RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, so the last row of the frame is the current row. Extending the frame to UNBOUNDED FOLLOWING makes LAST_VALUE read the last row of the whole partition, which is the latest price of the product.
    fr: |
      Quand ORDER BY est spécifié sans cadre, le cadre de fenêtre par défaut est RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ; la dernière ligne du cadre est donc la ligne courante. Étendre le cadre jusqu'à UNBOUNDED FOLLOWING fait lire à LAST_VALUE la dernière ligne de toute la partition, c'est-à-dire le dernier prix du produit.
  options:
    a: { en: "IGNORE NULLS skips NULL prices; it doesn't change the frame, which still ends at the current row.", fr: "IGNORE NULLS ignore les prix NULL ; il ne change pas le cadre, qui se termine toujours à la ligne courante." }
    c: { en: "This frame is the same as the default for this query: it still ends at the current row.", fr: "Ce cadre équivaut à celui par défaut pour cette requête : il se termine toujours à la ligne courante." }
    d: { en: "Partitioning by date creates one partition per row, so LAST_VALUE always returns the row's own price.", fr: "Partitionner par date crée une partition par ligne : LAST_VALUE renvoie toujours le prix de la ligne elle-même." }
