id: dp800-cs2b-supplier-duplicates
objective: "1.3.5"
type: single
caseStudy: dp800-cs2b-munsons-pickles
difficulty: 2
status: draft
stem:
  en: |
    You write the following query to find duplicate suppliers.

    ```sql
    SELECT s1.SupplierId, s1.SupplierName, s2.SupplierId, s2.SupplierName
    FROM dbo.Suppliers AS s1
    INNER JOIN dbo.Suppliers AS s2
        ON s1.SupplierId < s2.SupplierId
    WHERE /* fuzzy predicate */;
    ```

    You need to meet the data quality requirements.

    What should you do?
  fr: |
    Vous écrivez la requête suivante pour trouver les fournisseurs en double.

    ```sql
    SELECT s1.SupplierId, s1.SupplierName, s2.SupplierId, s2.SupplierName
    FROM dbo.Suppliers AS s1
    INNER JOIN dbo.Suppliers AS s2
        ON s1.SupplierId < s2.SupplierId
    WHERE /* fuzzy predicate */;
    ```

    Vous devez satisfaire les exigences de qualité des données.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Run `ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;` and use the predicate `EDIT_DISTANCE(s1.SupplierName, s2.SupplierName) >= 85`.
        fr: Exécuter `ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;` et utiliser le prédicat `EDIT_DISTANCE(s1.SupplierName, s2.SupplierName) >= 85`.
    - id: b
      text:
        en: Keep the current database configuration and use the predicate `EDIT_DISTANCE_SIMILARITY(s1.SupplierName, s2.SupplierName) >= 85`.
        fr: Conserver la configuration actuelle de la base de données et utiliser le prédicat `EDIT_DISTANCE_SIMILARITY(s1.SupplierName, s2.SupplierName) >= 85`.
    - id: c
      text:
        en: Run `ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;` and use the predicate `EDIT_DISTANCE_SIMILARITY(s1.SupplierName, s2.SupplierName) >= 85`.
        fr: Exécuter `ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;` et utiliser le prédicat `EDIT_DISTANCE_SIMILARITY(s1.SupplierName, s2.SupplierName) >= 85`.
    - id: d
      text:
        en: Run `ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;` and use the predicate `JARO_WINKLER_DISTANCE(s1.SupplierName, s2.SupplierName) >= 85`.
        fr: Exécuter `ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;` et utiliser le prédicat `JARO_WINKLER_DISTANCE(s1.SupplierName, s2.SupplierName) >= 85`.
answer: { optionId: c }
explanation:
  correct:
    en: |
      EDIT_DISTANCE_SIMILARITY returns an int from 0 (no similarity) to 100 (exact match) that is computed relative to the length of the longer string, so a threshold of 85 works for names of any length. On SQL Server 2025, the fuzzy string matching functions are in preview and require the PREVIEW_FEATURES database scoped configuration, which is OFF by default. SupplierName is nvarchar(200) with a Windows collation, which these functions accept.
    fr: |
      EDIT_DISTANCE_SIMILARITY renvoie un int de 0 (aucune similarité) à 100 (correspondance exacte) calculé par rapport à la longueur de la chaîne la plus longue : un seuil de 85 fonctionne donc pour des noms de toute longueur. Sur SQL Server 2025, les fonctions de correspondance de chaînes approximative sont en préversion et exigent la configuration délimitée à la base de données PREVIEW_FEATURES, qui vaut OFF par défaut. SupplierName est de type nvarchar(200) avec un classement Windows, que ces fonctions acceptent.
  options:
    a: { en: "EDIT_DISTANCE returns the number of edits; a value of 85 or more selects names that are very different.", fr: "EDIT_DISTANCE renvoie le nombre de modifications ; une valeur de 85 ou plus sélectionne des noms très différents." }
    b: { en: "On SQL Server 2025, fuzzy string matching requires the PREVIEW_FEATURES configuration, which is still at its default value OFF.", fr: "Sur SQL Server 2025, la correspondance de chaînes approximative exige la configuration PREVIEW_FEATURES, qui est encore à sa valeur par défaut OFF." }
    d: { en: "JARO_WINKLER_DISTANCE returns a float distance (about 0.03 for Colour and Color), not a 0–100 similarity score, so no pair of near-identical names reaches 85.", fr: "JARO_WINKLER_DISTANCE renvoie une distance de type float (environ 0,03 pour Colour et Color), pas un score de similarité de 0 à 100 : aucune paire de noms presque identiques n'atteint 85." }
references:
  - title: EDIT_DISTANCE_SIMILARITY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/edit-distance-similarity-transact-sql
  - title: What is fuzzy string matching?
    url: https://learn.microsoft.com/en-us/sql/relational-databases/fuzzy-string-match/overview
