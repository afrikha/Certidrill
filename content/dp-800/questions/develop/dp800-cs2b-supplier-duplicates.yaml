id: dp800-cs2b-supplier-duplicates
objective: "1.3.5"
type: single
caseStudy: dp800-cs2b-munsons-pickles
difficulty: 2
status: draft
stem:
  en: |
    SQL-ERP1 has SQL Server 2025 CU11 or a later cumulative update installed. You write the following query to find duplicate suppliers.

    ```sql
    SELECT s1.SupplierId, s1.SupplierName, s2.SupplierId, s2.SupplierName
    FROM dbo.Suppliers AS s1
    INNER JOIN dbo.Suppliers AS s2
        ON s1.SupplierId < s2.SupplierId
    WHERE /* fuzzy predicate */;
    ```

    You need to meet the data quality requirements.

    Which predicate should you use?
  fr: |
    La CU11 de SQL Server 2025 ou une mise à jour cumulative ultérieure est installée sur SQL-ERP1. Vous écrivez la requête suivante pour trouver les fournisseurs en double.

    ```sql
    SELECT s1.SupplierId, s1.SupplierName, s2.SupplierId, s2.SupplierName
    FROM dbo.Suppliers AS s1
    INNER JOIN dbo.Suppliers AS s2
        ON s1.SupplierId < s2.SupplierId
    WHERE /* fuzzy predicate */;
    ```

    Vous devez satisfaire les exigences de qualité des données.

    Quel prédicat devez-vous utiliser ?
body:
  options:
    - id: a
      text: "`EDIT_DISTANCE(s1.SupplierName, s2.SupplierName) >= 85`"
    - id: b
      text: "`EDIT_DISTANCE_SIMILARITY(s1.SupplierName, s2.SupplierName) <= 15`"
    - id: c
      text: "`EDIT_DISTANCE_SIMILARITY(s1.SupplierName, s2.SupplierName) >= 85`"
    - id: d
      text: "`JARO_WINKLER_DISTANCE(s1.SupplierName, s2.SupplierName) >= 85`"
answer: { optionId: c }
explanation:
  correct:
    en: |
      EDIT_DISTANCE_SIMILARITY returns an int from 0 (no similarity) to 100 (exact match) that is computed relative to the length of the longer string, so a threshold of 85 works for names of any length. On SQL Server 2025 CU11 and later, the fuzzy string matching functions are generally available and run without the PREVIEW_FEATURES configuration. SupplierName is nvarchar(200) and the database collation is a Windows collation, which these functions accept.
    fr: |
      EDIT_DISTANCE_SIMILARITY renvoie un int de 0 (aucune similarité) à 100 (correspondance exacte) calculé par rapport à la longueur de la chaîne la plus longue : un seuil de 85 fonctionne donc pour des noms de toute longueur. Sur SQL Server 2025 CU11 et versions ultérieures, les fonctions de correspondance de chaînes approximative sont en disponibilité générale et s'exécutent sans la configuration PREVIEW_FEATURES. SupplierName est de type nvarchar(200) et le classement de la base de données est un classement Windows, que ces fonctions acceptent.
  options:
    a: { en: "EDIT_DISTANCE returns the number of edits; a value of 85 or more selects names that are very different.", fr: "EDIT_DISTANCE renvoie le nombre de modifications ; une valeur de 85 ou plus sélectionne des noms très différents." }
    b: { en: "A similarity of 15 or less selects names that are almost completely different: similarity goes up as names get closer.", fr: "Une similarité de 15 ou moins sélectionne des noms presque totalement différents : la similarité augmente quand les noms se rapprochent." }
    d: { en: "JARO_WINKLER_DISTANCE returns a float distance (about 0.03 for Colour and Color), not a 0–100 similarity score, so no pair of near-identical names reaches 85.", fr: "JARO_WINKLER_DISTANCE renvoie une distance de type float (environ 0,03 pour Colour et Color), pas un score de similarité de 0 à 100 : aucune paire de noms presque identiques n'atteint 85." }
references:
