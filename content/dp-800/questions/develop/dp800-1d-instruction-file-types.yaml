id: dp800-1d-instruction-file-types
objective: "1.4.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Your team customizes GitHub Copilot for a SQL database project in a GitHub repository.

    Which file should you create for each requirement? To answer, drag the appropriate files to the correct requirements. Each file may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe personnalise GitHub Copilot pour un projet de base de données SQL dans un dépôt GitHub.

    Quel fichier devez-vous créer pour chaque exigence ? Pour répondre, faites glisser les fichiers appropriés vers les exigences correspondantes. Chaque fichier peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: repo, text: ".github/copilot-instructions.md" }
    - { id: scoped, text: ".github/instructions/tests.instructions.md" }
    - { id: prompt, text: ".github/prompts/create-procedure.prompt.md" }
    - { id: mcp, text: ".vscode/mcp.json" }
    - { id: editor, text: ".editorconfig" }
  targets:
    - { id: all, text: { en: "Naming and style standards added to every chat request in the repository", fr: "Normes de nommage et de style ajoutées à chaque requête de conversation dans le dépôt" } }
    - { id: tests, text: { en: "Rules added automatically only for the test scripts in the tests folder", fr: "Règles ajoutées automatiquement uniquement pour les scripts de test du dossier tests" } }
    - { id: task, text: { en: "A reusable template that a developer runs on demand to create a stored procedure", fr: "Un modèle réutilisable qu'un développeur exécute à la demande pour créer une procédure stockée" } }
answer:
  mapping: { all: repo, tests: scoped, task: prompt }
explanation:
  correct:
    en: |
      `.github/copilot-instructions.md` applies to everyone in the repository and to every chat request. A `.instructions.md` file in .github/instructions applies to the files that match its applyTo glob, such as `tests/**/*.sql`. A `.prompt.md` file in .github/prompts is a reusable task template that a developer selects in the chat.
    fr: |
      `.github/copilot-instructions.md` s'applique à toute personne du dépôt et à chaque requête de conversation. Un fichier `.instructions.md` dans .github/instructions s'applique aux fichiers qui correspondent à son glob applyTo, comme `tests/**/*.sql`. Un fichier `.prompt.md` dans .github/prompts est un modèle de tâche réutilisable qu'un développeur sélectionne dans la conversation.
  options:
    mcp: { en: ".vscode/mcp.json declares MCP servers; it contains no instructions.", fr: ".vscode/mcp.json déclare des serveurs MCP ; il ne contient pas d'instructions." }
    editor: { en: ".editorconfig defines editor formatting settings, not Copilot instructions.", fr: ".editorconfig définit des paramètres de mise en forme de l'éditeur, pas des instructions pour Copilot." }
references:
  - title: Create and configure GitHub Copilot instruction files
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/6-create-configure-copilot-instruction-files
  - title: "Quickstart: Use custom instructions to align GitHub Copilot with your T-SQL conventions"
    url: https://learn.microsoft.com/en-us/sql/tools/visual-studio-code-extensions/github-copilot/custom-instructions
