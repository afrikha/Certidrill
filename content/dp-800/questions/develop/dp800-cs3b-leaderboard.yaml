id: dp800-cs3b-leaderboard
objective: "1.3.2"
type: yesno_statements
caseStudy: dp800-cs3b-proseware
difficulty: 2
status: draft
stem:
  en: |
    A developer writes the following query for the leaderboard.

    ```sql
    WITH Best AS (
        SELECT QuizId, LearnerId, MAX(Score) AS BestScore
        FROM dbo.QuizAttempts
        GROUP BY QuizId, LearnerId
    )
    SELECT QuizId, LearnerId, BestScore,
           RANK() OVER (PARTITION BY QuizId ORDER BY BestScore DESC) AS Position,
           LAG(BestScore) OVER (PARTITION BY QuizId ORDER BY BestScore DESC)
               - BestScore AS GapToPrevious,
           LAST_VALUE(BestScore) OVER (PARTITION BY QuizId ORDER BY BestScore DESC)
               AS LowestScore
    FROM Best;
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur écrit la requête suivante pour le classement.

    ```sql
    WITH Best AS (
        SELECT QuizId, LearnerId, MAX(Score) AS BestScore
        FROM dbo.QuizAttempts
        GROUP BY QuizId, LearnerId
    )
    SELECT QuizId, LearnerId, BestScore,
           RANK() OVER (PARTITION BY QuizId ORDER BY BestScore DESC) AS Position,
           LAG(BestScore) OVER (PARTITION BY QuizId ORDER BY BestScore DESC)
               - BestScore AS GapToPrevious,
           LAST_VALUE(BestScore) OVER (PARTITION BY QuizId ORDER BY BestScore DESC)
               AS LowestScore
    FROM Best;
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When two learners share the highest best score of a quiz, the learner with the next best score gets a Position of 3.
        fr: Quand deux apprenants partagent le meilleur score le plus élevé d'un quiz, l'apprenant qui a le score suivant obtient une Position de 3.
    - id: s2
      text:
        en: For the learner in the first position of a quiz, GapToPrevious returns 0.
        fr: Pour l'apprenant en première position d'un quiz, GapToPrevious renvoie 0.
    - id: s3
      text:
        en: On every row, LowestScore returns the lowest best score of the quiz.
        fr: Sur chaque ligne, LowestScore renvoie le plus bas des meilleurs scores du quiz.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      RANK gives tied rows the same rank and then skips ranks (1, 1, 3), so the query doesn't meet the requirement; DENSE_RANK returns 1, 1, 2. LAG without a default returns NULL when there is no previous row, so GapToPrevious is NULL for the first position; LAG(BestScore, 1, BestScore) would return 0. With ORDER BY and no frame, the frame is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, so LAST_VALUE returns the current row's score (or a tie of it); the frame must be ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING, or MIN(BestScore) OVER (PARTITION BY QuizId) can be used.
    fr: |
      RANK attribue le même rang aux lignes à égalité puis saute des rangs (1, 1, 3) : la requête ne respecte donc pas l'exigence ; DENSE_RANK renvoie 1, 1, 2. LAG sans valeur par défaut renvoie NULL quand il n'y a pas de ligne précédente : GapToPrevious vaut donc NULL pour la première position ; LAG(BestScore, 1, BestScore) renverrait 0. Avec ORDER BY et sans cadre, le cadre est RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW : LAST_VALUE renvoie donc le score de la ligne actuelle (ou d'une ligne à égalité) ; le cadre doit être ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING, ou MIN(BestScore) OVER (PARTITION BY QuizId) peut être utilisé.
references:
  - title: SELECT - OVER clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-over-clause-transact-sql
  - title: LAG (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/lag-transact-sql
