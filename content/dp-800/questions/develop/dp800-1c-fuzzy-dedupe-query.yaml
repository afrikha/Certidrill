id: dp800-1c-fuzzy-dedupe-query
objective: "1.3.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a SQL Server 2025 database in which the PREVIEW_FEATURES database scoped configuration is set to ON. A table named **Sales.Customer** has the columns CustomerID, PostalCode and FullName (nvarchar(200), Windows collation).

    You need a query that finds probable duplicate customers and meets the following requirements:

    - Compare only customers that have the same postal code.
    - Return each candidate pair once, and never compare a customer with itself.
    - Keep the pairs whose edit distance is 2 or less, and let the distance computation stop as soon as the distance exceeds 2.
    - Return Score, a value from 0 to 100 based on the edit distance between the names.

    How should you complete the Transact-SQL statement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données SQL Server 2025 dans laquelle la configuration délimitée à la base de données PREVIEW_FEATURES est définie sur ON. Une table nommée **Sales.Customer** contient les colonnes CustomerID, PostalCode et FullName (nvarchar(200), classement Windows).

    Vous avez besoin d'une requête qui trouve les doublons probables de clients et qui respecte les exigences suivantes :

    - Comparer uniquement les clients qui ont le même code postal.
    - Renvoyer chaque paire candidate une seule fois, et ne jamais comparer un client avec lui-même.
    - Conserver les paires dont la distance d'édition est inférieure ou égale à 2, et permettre au calcul de la distance de s'arrêter dès que la distance dépasse 2.
    - Renvoyer Score, une valeur de 0 à 100 basée sur la distance d'édition entre les noms.

    Comment devez-vous compléter l'instruction Transact-SQL ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT a.CustomerID AS CustomerA, b.CustomerID AS CustomerB,
           [[score]](a.FullName, b.FullName) AS Score
    FROM Sales.Customer AS a
    JOIN Sales.Customer AS b
         ON b.PostalCode = a.PostalCode
        AND a.CustomerID [[cmp]] b.CustomerID
    WHERE EDIT_DISTANCE(a.FullName, b.FullName, [[maxd]]) <= 2;
  slots:
    - id: score
      options:
        - { id: eds, text: "EDIT_DISTANCE_SIMILARITY" }
        - { id: jws, text: "JARO_WINKLER_SIMILARITY" }
        - { id: ed, text: "EDIT_DISTANCE" }
        - { id: jwd, text: "JARO_WINKLER_DISTANCE" }
    - id: cmp
      options:
        - { id: lt, text: "<" }
        - { id: ne, text: "<>" }
        - { id: eq, text: "=" }
        - { id: ge, text: ">=" }
    - id: maxd
      options:
        - { id: m1, text: "1" }
        - { id: m2, text: "2" }
        - { id: m3, text: "3" }
        - { id: mneg, text: "-1" }
answer:
  values: { score: eds, cmp: lt, maxd: m2 }
explanation:
  correct:
    en: |
      EDIT_DISTANCE_SIMILARITY turns the edit distance into an int from 0 to 100, relative to the length of the longer string. The < comparison keeps one row per pair and excludes self-pairs. With maximum_distance 2, the function returns the actual distance when it's 2 or less and 3 otherwise, so the filter is exact and the computation can stop early.
    fr: |
      EDIT_DISTANCE_SIMILARITY transforme la distance d'édition en un int de 0 à 100, relatif à la longueur de la chaîne la plus longue. La comparaison < conserve une ligne par paire et exclut les paires d'un client avec lui-même. Avec maximum_distance à 2, la fonction renvoie la distance réelle quand elle vaut 2 ou moins, et 3 sinon : le filtre est exact et le calcul peut s'arrêter tôt.
  options:
    jws: { en: "JARO_WINKLER_SIMILARITY returns 0–100, but from the Jaro-Winkler algorithm, not from the edit distance.", fr: "JARO_WINKLER_SIMILARITY renvoie une valeur de 0 à 100, mais issue de l'algorithme de Jaro-Winkler, pas de la distance d'édition." }
    ed: { en: "EDIT_DISTANCE returns a number of edits, not a 0–100 score.", fr: "EDIT_DISTANCE renvoie un nombre de modifications, pas un score de 0 à 100." }
    jwd: { en: "JARO_WINKLER_DISTANCE returns a float distance, not a 0–100 score.", fr: "JARO_WINKLER_DISTANCE renvoie une distance de type float, pas un score de 0 à 100." }
    ne: { en: "<> returns every pair twice, once in each order.", fr: "<> renvoie chaque paire deux fois, une fois dans chaque ordre." }
    eq: { en: "= compares each customer only with itself.", fr: "= ne compare chaque client qu'avec lui-même." }
    ge: { en: ">= includes self-pairs, which always have a distance of 0.", fr: ">= inclut les paires d'un client avec lui-même, dont la distance vaut toujours 0." }
    m1: { en: "With a limit of 1, every pair more than one edit apart returns 2 and passes the <= 2 filter.", fr: "Avec une limite de 1, chaque paire distante de plus d'une modification renvoie 2 et passe le filtre <= 2." }
    m3: { en: "The rows are correct, but the function keeps computing until the distance exceeds 3.", fr: "Les lignes sont correctes, mais la fonction poursuit le calcul jusqu'à ce que la distance dépasse 3." }
    mneg: { en: "A negative value returns the actual distance, so the computation never stops early.", fr: "Une valeur négative renvoie la distance réelle : le calcul ne s'arrête jamais plus tôt." }
references:
  - title: EDIT_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/edit-distance-transact-sql
  - title: EDIT_DISTANCE_SIMILARITY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/edit-distance-similarity-transact-sql
