id: dp800-1a-seq-default-start
objective: "1.1.5"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    A developer at Contoso creates a sequence by running the following statement.

    ```sql
    CREATE SEQUENCE Support.TicketNumber;
    ```

    The developer then runs `SELECT NEXT VALUE FOR Support.TicketNumber;` for the first time.

    Which value is returned?
  fr: |
    Un développeur de Contoso crée une séquence en exécutant l'instruction suivante.

    ```sql
    CREATE SEQUENCE Support.TicketNumber;
    ```

    Le développeur exécute ensuite `SELECT NEXT VALUE FOR Support.TicketNumber;` pour la première fois.

    Quelle valeur est renvoyée ?
body:
  options:
    - { id: a, text: "-9,223,372,036,854,775,808" }
    - { id: b, text: "-2,147,483,648" }
    - { id: c, text: "0" }
    - { id: d, text: "1" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without AS, a sequence is bigint. Without START WITH, an ascending sequence starts at its minimum value, and the default MINVALUE is the minimum of the data type. The first value is therefore the smallest bigint, -9,223,372,036,854,775,808. Specify AS, START WITH and MINVALUE explicitly to get a series that starts at 1.
    fr: |
      Sans AS, une séquence est de type bigint. Sans START WITH, une séquence croissante commence à sa valeur minimale, et la valeur MINVALUE par défaut est le minimum du type de données. La première valeur est donc le plus petit bigint, -9 223 372 036 854 775 808. Indiquez explicitement AS, START WITH et MINVALUE pour obtenir une série qui commence à 1.
  options:
    b: { en: "This is the minimum of int, but the default type of a sequence is bigint.", fr: "C'est le minimum du type int, mais le type par défaut d'une séquence est bigint." }
    c: { en: "0 is the minimum only for tinyint; the default type is bigint.", fr: "0 n'est le minimum que pour tinyint ; le type par défaut est bigint." }
    d: { en: "1 is the default increment, not the default start value.", fr: "1 est l'incrément par défaut, pas la valeur de départ par défaut." }
references:
  - title: CREATE SEQUENCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-sequence-transact-sql
