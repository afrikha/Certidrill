id: dp800-1a-type-choice
objective: "1.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is designing a table for a booking application in an Azure SQL database. The database uses the SQL_Latin1_General_CP1_CI_AS collation.

    You need to choose the smallest data type that meets each requirement.

    Which data type should you use for each column? To answer, drag the appropriate data types to the correct columns. Each data type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit une table pour une application de réservation dans une base de données Azure SQL. La base de données utilise le classement SQL_Latin1_General_CP1_CI_AS.

    Vous devez choisir le plus petit type de données qui répond à chaque exigence.

    Quel type de données devez-vous utiliser pour chaque colonne ? Pour répondre, faites glisser les types de données appropriés vers les colonnes correspondantes. Chaque type de données peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dt2, text: "datetime2(3)" }
    - { id: dto, text: "datetimeoffset(0)" }
    - { id: nv, text: "nvarchar(200)" }
    - { id: vc, text: "varchar(200)" }
    - { id: ti, text: tinyint }
    - { id: int, text: int }
  targets:
    - id: created
      text: { en: "CreatedAtUtc: time the booking was created, in UTC, to the millisecond", fr: "CreatedAtUtc : heure de création de la réservation, en UTC, à la milliseconde près" }
    - id: appt
      text: { en: "AppointmentAt: local time of the appointment, to the second, that must keep the customer's offset from UTC", fr: "AppointmentAt : heure locale du rendez-vous, à la seconde près, qui doit conserver le décalage du client par rapport à UTC" }
    - id: name
      text: { en: "CustomerName: names written in Latin, Greek and Japanese scripts", fr: "CustomerName : noms écrits en alphabets latin, grec et japonais" }
    - id: status
      text: { en: "StatusCode: an integer from 1 to 12", fr: "StatusCode : un entier de 1 à 12" }
answer:
  mapping: { created: dt2, appt: dto, name: nv, status: ti }
explanation:
  correct:
    en: |
      datetime2(3) stores a date and time to the millisecond without an offset, which suits a value already in UTC. datetimeoffset keeps the offset from UTC with the local time. With a non-UTF-8 collation, only nvarchar stores characters from several scripts. tinyint (0 to 255, 1 byte) is the smallest integer type that holds 1 to 12.
    fr: |
      datetime2(3) stocke une date et une heure à la milliseconde, sans décalage, ce qui convient à une valeur déjà en UTC. datetimeoffset conserve le décalage par rapport à UTC avec l'heure locale. Avec un classement non UTF-8, seul nvarchar stocke des caractères de plusieurs alphabets. tinyint (0 à 255, 1 octet) est le plus petit type entier qui contient les valeurs 1 à 12.
  options:
    vc: { en: "varchar with this code-page collation can't store Greek or Japanese characters.", fr: "varchar avec ce classement de page de codes ne peut pas stocker de caractères grecs ou japonais." }
    int: { en: "int uses 4 bytes, more than needed for 1 to 12.", fr: "int utilise 4 octets, plus que nécessaire pour 1 à 12." }
references:
  - title: datetimeoffset (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/datetimeoffset-transact-sql
  - title: datetime2 (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/datetime2-transact-sql
