id: dp800-cs3b-agent-mcp
objective: "1.4.5"
type: single
caseStudy: dp800-cs3b-proseware
difficulty: 1
status: draft
stem:
  en: You need to configure Visual Studio Code for the product analysts. The solution must meet the AI-assisted development requirements. What should you add to the .vscode/mcp.json file?
  fr: Vous devez configurer Visual Studio Code pour les analystes produit. La solution doit satisfaire les exigences de développement assisté par IA. Que devez-vous ajouter au fichier .vscode/mcp.json ?
body:
  options:
    - id: a
      text:
        en: A stdio server that runs dab start --mcp-stdio with a configuration file that points to LH-Engagement
        fr: Un serveur stdio qui exécute dab start --mcp-stdio avec un fichier de configuration qui pointe vers LH-Engagement
    - id: b
      text:
        en: An HTTP server whose URL is the SQL connection string of the SQL analytics endpoint of LH-Engagement
        fr: Un serveur HTTP dont l'URL est la chaîne de connexion SQL du point de terminaison d'analytique SQL de LH-Engagement
    - id: c
      text:
        en: An HTTP server whose URL is the address of DA-Engagement copied from the browser address bar in the Fabric portal
        fr: Un serveur HTTP dont l'URL est l'adresse de DA-Engagement copiée depuis la barre d'adresse du navigateur dans le portail Fabric
    - id: d
      text:
        en: An HTTP server whose URL is copied from the Model Context Protocol tab in the settings of DA-Engagement
        fr: Un serveur HTTP dont l'URL est copiée depuis l'onglet Model Context Protocol des paramètres de DA-Engagement
answer: { optionId: d }
explanation:
  correct:
    en: A published Fabric data agent is exposed as an MCP server over HTTP. Its MCP server URL is shown on the Model Context Protocol tab of the agent's settings, and VS Code adds it as an HTTP server and signs the analyst in. In Agent mode, Copilot Chat then calls the data agent as a tool, and the agent answers from LH-Engagement.
    fr: Un agent de données Fabric publié est exposé comme serveur MCP sur HTTP. Son URL de serveur MCP figure dans l'onglet Model Context Protocol des paramètres de l'agent, et VS Code l'ajoute comme serveur HTTP et connecte l'analyste. En mode Agent, Copilot Chat appelle alors l'agent de données comme outil, et l'agent répond à partir de LH-Engagement.
  options:
    a: { en: "dab start --mcp-stdio runs the SQL MCP Server of Data API builder over the entities of a DAB configuration; it doesn't go through the data agent.", fr: "dab start --mcp-stdio exécute le serveur SQL MCP Server de Data API builder sur les entités d'une configuration DAB ; il ne passe pas par l'agent de données." }
    b: { en: "A SQL connection string is a TDS endpoint for SQL clients, not an MCP server URL, and it bypasses DA-Engagement.", fr: "Une chaîne de connexion SQL est un point de terminaison TDS pour les clients SQL, pas une URL de serveur MCP, et elle contourne DA-Engagement." }
    c: { en: "The portal address opens the data agent in the Fabric user interface; MCP clients must call the MCP server URL shown on the Model Context Protocol tab.", fr: "L'adresse du portail ouvre l'agent de données dans l'interface utilisateur de Fabric ; les clients MCP doivent appeler l'URL de serveur MCP affichée dans l'onglet Model Context Protocol." }
references:
  - title: Data agent as Model Context Protocol server
    url: https://learn.microsoft.com/en-us/fabric/data-science/data-agent-mcp-server
