id: dp800-1d-copilot-login-permissions
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses GitHub Copilot in SQL Server Management Studio (SSMS) 22 with an Azure SQL database named sqldb-hr. A developer named Dev1 connects to sqldb-hr with a login that has the SELECT permission on the Recruiting schema only.

    Dev1 asks GitHub Copilot Chat for a query that lists the rows of the Payroll.Salary table, and then runs the generated query.

    What happens when the query runs?
  fr: |
    Adatum utilise GitHub Copilot dans SQL Server Management Studio (SSMS) 22 avec une base de données Azure SQL nommée sqldb-hr. Un développeur nommé Dev1 se connecte à sqldb-hr avec une connexion qui dispose de l'autorisation SELECT sur le schéma Recruiting uniquement.

    Dev1 demande à GitHub Copilot Chat une requête qui liste les lignes de la table Payroll.Salary, puis exécute la requête générée.

    Que se passe-t-il quand la requête s'exécute ?
body:
  options:
    - { id: a, text: { en: "The query succeeds because it runs with the identity of the GitHub Copilot service.", fr: "La requête réussit, car elle s'exécute avec l'identité du service GitHub Copilot." } }
    - { id: b, text: { en: "The query fails because it runs with the permissions of the login of Dev1.", fr: "La requête échoue, car elle s'exécute avec les autorisations de la connexion de Dev1." } }
    - { id: c, text: { en: "The query returns rows that Copilot cached when it read the database schema.", fr: "La requête renvoie des lignes que Copilot a mises en cache en lisant le schéma de la base de données." } }
    - { id: d, text: { en: "The query succeeds because Copilot grants Dev1 db_datareader for the chat session.", fr: "La requête réussit, car Copilot accorde db_datareader à Dev1 pour la session de conversation." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Queries written by GitHub Copilot in SSMS run with the permissions of your login. Without the SELECT permission on Payroll.Salary, the generated query fails with a permission error, exactly as a query that Dev1 typed would.
    fr: |
      Les requêtes écrites par GitHub Copilot dans SSMS s'exécutent avec les autorisations de votre connexion. Sans l'autorisation SELECT sur Payroll.Salary, la requête générée échoue avec une erreur d'autorisation, exactement comme une requête saisie par Dev1.
  options:
    a: { en: "Copilot doesn't bring its own database identity; the query uses the connection of the developer.", fr: "Copilot n'apporte pas sa propre identité de base de données : la requête utilise la connexion du développeur." }
    c: { en: "Copilot doesn't return cached table data; the query is executed by the database engine.", fr: "Copilot ne renvoie pas de données de table mises en cache : la requête est exécutée par le moteur de base de données." }
    d: { en: "Copilot can't change role memberships to work around missing permissions.", fr: "Copilot ne peut pas modifier les appartenances aux rôles pour contourner des autorisations manquantes." }
references:
  - title: What is GitHub Copilot in SQL Server Management Studio?
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/overview
