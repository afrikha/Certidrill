id: dp800-1d-scoped-instructions-file
objective: "1.4.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Your team wants GitHub Copilot in Visual Studio Code to follow two Transact-SQL rules. The rules must be added to chat requests automatically, but only when Copilot works with .sql files of the repository.

    How should you complete the instruction file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe souhaite que GitHub Copilot dans Visual Studio Code respecte deux règles Transact-SQL. Les règles doivent être ajoutées automatiquement aux requêtes de conversation, mais uniquement quand Copilot travaille avec des fichiers .sql du dépôt.

    Comment devez-vous compléter le fichier d'instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    File: [[path]]

    ---
    [[key]]: '**/*.sql'
    ---
    - Use THROW, not RAISERROR, in new code.
    - Name indexes IX_TableName_ColumnName.
  slots:
    - id: path
      options:
        - { id: prompt, text: ".github/prompts/tsql.prompt.md" }
        - { id: instr, text: ".github/instructions/tsql.instructions.md" }
        - { id: repo, text: ".github/copilot-instructions.md" }
        - { id: vscode, text: ".vscode/tsql.instructions.md" }
    - id: key
      options:
        - { id: description, text: description }
        - { id: agent, text: agent }
        - { id: applyto, text: applyTo }
answer:
  values: { path: instr, key: applyto }
explanation:
  correct:
    en: |
      Rules that target some files go in a file named `<name>.instructions.md` in the .github/instructions folder. The applyTo key of its frontmatter contains the glob, here `**/*.sql`, and Copilot adds the file automatically to requests for matching files.
    fr: |
      Les règles qui ciblent certains fichiers se placent dans un fichier nommé `<name>.instructions.md` dans le dossier .github/instructions. La clé applyTo de son en-tête contient le glob, ici `**/*.sql`, et Copilot ajoute automatiquement le fichier aux requêtes portant sur les fichiers correspondants.
  options:
    prompt: { en: "A prompt file is a reusable prompt that runs only when a developer selects it.", fr: "Un fichier de prompt est un prompt réutilisable qui ne s'exécute que quand un développeur le sélectionne." }
    repo: { en: "copilot-instructions.md applies to every request in the repository, not only to .sql files.", fr: "copilot-instructions.md s'applique à toutes les requêtes du dépôt, pas uniquement aux fichiers .sql." }
    vscode: { en: "Scoped instruction files are read from .github/instructions, not from .vscode.", fr: "Les fichiers d'instructions ciblés sont lus dans .github/instructions, pas dans .vscode." }
    description: { en: "description describes the file; it doesn't define which files the rules apply to.", fr: "description décrit le fichier ; elle ne définit pas les fichiers auxquels les règles s'appliquent." }
    agent: { en: "agent is a key of prompt files that selects the chat mode, not a file pattern.", fr: "agent est une clé des fichiers de prompt qui sélectionne le mode de conversation, pas un modèle de fichiers." }
references:
  - title: "Quickstart: Use custom instructions to align GitHub Copilot with your T-SQL conventions"
    url: https://learn.microsoft.com/en-us/sql/tools/visual-studio-code-extensions/github-copilot/custom-instructions
