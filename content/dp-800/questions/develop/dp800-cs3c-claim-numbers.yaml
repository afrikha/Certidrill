id: dp800-cs3c-claim-numbers
objective: "1.1.5"
type: single
caseStudy: dp800-cs3c-litware-insurance
difficulty: 1
status: draft
stem:
  en: You need to change how claim numbers are generated. The solution must meet the data requirements. What should you do?
  fr: Vous devez modifier la génération des numéros de sinistre. La solution doit satisfaire les exigences relatives aux données. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Keep the IDENTITY columns, reseed Claims.PropertyClaim at 50,000,000, and have the application read SCOPE_IDENTITY() after each insert.
        fr: Conserver les colonnes IDENTITY, réamorcer Claims.PropertyClaim à 50 000 000 et faire lire SCOPE_IDENTITY() par l'application après chaque insertion.
    - id: b
      text:
        en: Create a sequence, and have the application get the next claim number with NEXT VALUE FOR before it inserts the claim.
        fr: Créer une séquence et faire obtenir le prochain numéro de sinistre par l'application avec NEXT VALUE FOR avant l'insertion du sinistre.
    - id: c
      text:
        en: Create a sequence with the CYCLE option, and use NEXT VALUE FOR as the DEFAULT constraint of ClaimNumber in both tables.
        fr: Créer une séquence avec l'option CYCLE et utiliser NEXT VALUE FOR comme contrainte DEFAULT de ClaimNumber dans les deux tables.
    - id: d
      text:
        en: Replace ClaimNumber in both tables with a uniqueidentifier column whose DEFAULT constraint is NEWSEQUENTIALID().
        fr: Remplacer ClaimNumber dans les deux tables par une colonne uniqueidentifier dont la contrainte DEFAULT est NEWSEQUENTIALID().
answer: { optionId: b }
explanation:
  correct:
    en: A sequence isn't tied to a table, so one sequence can number the claims of both tables from a single series. NEXT VALUE FOR returns a number when it's called, so the application can store it in a variable, show it to the caller and insert it later into either table.
    fr: |
      Une séquence n'est liée à aucune table : une seule séquence peut donc numéroter les sinistres des deux tables à partir d'une seule série. NEXT VALUE FOR renvoie un numéro dès son appel : l'application peut le stocker dans une variable, l'indiquer à l'appelant et l'insérer plus tard dans l'une ou l'autre table.
  options:
    a: { en: "Each table keeps its own series, and SCOPE_IDENTITY() returns the number only after the row is inserted.", fr: "Chaque table conserve sa propre série, et SCOPE_IDENTITY() ne renvoie le numéro qu'après l'insertion de la ligne." }
    c: { en: "CYCLE restarts the series after its maximum value and reuses numbers, and a DEFAULT assigns the number only during the insert.", fr: "CYCLE redémarre la série après sa valeur maximale et réutilise des numéros, et une contrainte DEFAULT n'attribue le numéro que pendant l'insertion." }
    d: { en: "NEWSEQUENTIALID() returns a GUID, not a number, and only as a column default during the insert.", fr: "NEWSEQUENTIALID() renvoie un GUID, pas un nombre, et seulement comme valeur par défaut de colonne pendant l'insertion." }
references:
  - title: Sequence numbers
    url: https://learn.microsoft.com/en-us/sql/relational-databases/sequence-numbers/sequence-numbers
