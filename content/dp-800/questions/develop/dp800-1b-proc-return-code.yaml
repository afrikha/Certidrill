id: dp800-1b-proc-return-code
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are developing a stored procedure named Sales.usp_CreateQuote in an Azure SQL database for Litware. The procedure generates a quote number in the format QT-2026-000123 and stores it in a local variable named @QuoteNumber of type varchar(20).

    The calling application must receive the quote number after each call. The procedure must keep using its integer status code, where 0 means success.

    What should you use to return the quote number?
  fr: |
    Vous développez une procédure stockée nommée Sales.usp_CreateQuote dans une base de données Azure SQL pour Litware. La procédure génère un numéro de devis au format QT-2026-000123 et le stocke dans une variable locale nommée @QuoteNumber de type varchar(20).

    L'application appelante doit recevoir le numéro de devis après chaque appel. La procédure doit continuer à utiliser son code d'état entier, où 0 signifie la réussite.

    Que devez-vous utiliser pour renvoyer le numéro de devis ?
body:
  options:
    - { id: a, text: { en: "A RETURN @QuoteNumber statement at the end of the procedure", fr: "Une instruction RETURN @QuoteNumber à la fin de la procédure" } }
    - { id: b, text: { en: "A table-valued parameter declared with READONLY", fr: "Un paramètre table déclaré avec READONLY" } }
    - { id: c, text: { en: "A PRINT @QuoteNumber statement at the end of the procedure", fr: "Une instruction PRINT @QuoteNumber à la fin de la procédure" } }
    - { id: d, text: { en: "A varchar(20) parameter declared with OUTPUT", fr: "Un paramètre varchar(20) déclaré avec OUTPUT" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An OUTPUT parameter returns a value of any supported data type to the caller, which passes a variable with OUTPUT in the EXECUTE statement. The return code set with RETURN is an integer reserved for the status, and Microsoft advises against using it to return application data.
    fr: |
      Un paramètre OUTPUT renvoie à l'appelant une valeur de n'importe quel type de données pris en charge ; l'appelant passe une variable avec OUTPUT dans l'instruction EXECUTE. Le code de retour défini avec RETURN est un entier réservé à l'état, et Microsoft déconseille de l'utiliser pour renvoyer des données applicatives.
  options:
    a: { en: "RETURN accepts only an integer status code, so a varchar quote number cannot be returned this way, and the status code would be lost.", fr: "RETURN n'accepte qu'un code d'état entier : un numéro de devis varchar ne peut pas être renvoyé ainsi, et le code d'état serait perdu." }
    b: { en: "Table-valued parameters can only be input parameters and are read-only in the procedure.", fr: "Les paramètres table ne peuvent être que des paramètres d'entrée et sont en lecture seule dans la procédure." }
    c: { en: "PRINT sends an informational message, not a value that the application can read as data.", fr: "PRINT envoie un message d'information, pas une valeur que l'application peut lire comme une donnée." }
references:
  - title: Return data from a stored procedure
    url: https://learn.microsoft.com/en-us/sql/relational-databases/stored-procedures/return-data-from-a-stored-procedure
