id: dp800-1d-sql-mcp-stdio-config
objective: "1.4.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You develop locally against a SQL Server 2025 database with Data API builder 2.0. The dab-config.json file in your workspace folder defines entities and grants permissions to a role named reader. MCP is enabled in the runtime section.

    You need GitHub Copilot in Visual Studio Code to connect to SQL MCP Server. The solution must meet the following requirements:

    - Visual Studio Code starts and stops SQL MCP Server; you don't run dab start in a terminal.
    - The MCP tools run with the permissions of the reader role.

    How should you complete the `.vscode/mcp.json` file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous développez localement sur une base de données SQL Server 2025 avec Data API builder 2.0. Le fichier dab-config.json du dossier de votre espace de travail définit des entités et accorde des autorisations à un rôle nommé reader. MCP est activé dans la section runtime.

    GitHub Copilot dans Visual Studio Code doit se connecter à SQL MCP Server. La solution doit satisfaire les exigences suivantes :

    - Visual Studio Code démarre et arrête SQL MCP Server ; vous n'exécutez pas dab start dans un terminal.
    - Les outils MCP s'exécutent avec les autorisations du rôle reader.

    Comment devez-vous compléter le fichier `.vscode/mcp.json` ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "servers": {
        "sql-mcp-server": {
          "type": "[[type]]",
          "command": "dab",
          "args": [
            "start",
            "[[flag]]",
            "[[role]]",
            "--config",
            "${workspaceFolder}/dab-config.json"
          ]
        }
      }
    }
  slots:
    - id: type
      options:
        - { id: http, text: http }
        - { id: stdio, text: stdio }
        - { id: sse, text: sse }
    - id: flag
      options:
        - { id: hostmode, text: "--host-mode" }
        - { id: loglevel, text: "--loglevel" }
        - { id: mcpstdio, text: "--mcp-stdio" }
    - id: role
      options:
        - { id: anon, text: "role:anonymous" }
        - { id: bare, text: reader }
        - { id: reader, text: "role:reader" }
answer:
  values: { type: stdio, flag: mcpstdio, role: reader }
explanation:
  correct:
    en: |
      With the stdio transport, Visual Studio Code launches the command itself and talks to the process over standard input and output, so no separate dab start is needed. `dab start --mcp-stdio role:reader` starts SQL MCP Server in stdio mode as the reader role; when the role argument is omitted, the role defaults to anonymous.
    fr: |
      Avec le transport stdio, Visual Studio Code lance lui-même la commande et communique avec le processus par l'entrée et la sortie standard : aucun dab start distinct n'est nécessaire. `dab start --mcp-stdio role:reader` démarre SQL MCP Server en mode stdio avec le rôle reader ; si l'argument de rôle est omis, le rôle par défaut est anonymous.
  options:
    http: { en: "An http server is reached by URL and must already be running, for example after dab start in a terminal.", fr: "Un serveur http est joint par URL et doit déjà s'exécuter, par exemple après dab start dans un terminal." }
    hostmode: { en: "--host-mode is an option of dab init that sets the development or production mode.", fr: "--host-mode est une option de dab init qui définit le mode développement ou production." }
    loglevel: { en: "--loglevel sets the logging level; it doesn't enable the stdio transport.", fr: "--loglevel définit le niveau de journalisation ; il n'active pas le transport stdio." }
    anon: { en: "role:anonymous would run the tools with the permissions of the anonymous role.", fr: "role:anonymous exécuterait les outils avec les autorisations du rôle anonymous." }
    bare: { en: "The role is passed with the role: prefix.", fr: "Le rôle se transmet avec le préfixe role:." }
references:
  - title: Quickstart - Visual Studio Code local
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/quickstart-visual-studio-code
  - title: What is SQL MCP Server?
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/overview
