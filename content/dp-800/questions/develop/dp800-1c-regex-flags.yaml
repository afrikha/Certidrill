id: dp800-1c-regex-flags
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that has a compatibility level of 170. A table named **Ops.Device** has a varchar(10) column named Code that uses the Latin1_General_100_CI_AS collation.

    The following query returns the code `ab-1234` but not the code `AB-1234`.

    ```sql
    SELECT DeviceID, Code
    FROM Ops.Device
    WHERE REGEXP_LIKE(Code, '^[a-z]{2}-\d{4}$');
    ```

    You need the query to return both codes. The solution must not modify the data.

    Which predicate should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL dont le niveau de compatibilité est 170. Une table nommée **Ops.Device** contient une colonne varchar(10) nommée Code qui utilise le classement Latin1_General_100_CI_AS.

    La requête suivante renvoie le code `ab-1234`, mais pas le code `AB-1234`.

    ```sql
    SELECT DeviceID, Code
    FROM Ops.Device
    WHERE REGEXP_LIKE(Code, '^[a-z]{2}-\d{4}$');
    ```

    La requête doit renvoyer les deux codes. La solution ne doit pas modifier les données.

    Quel prédicat devez-vous utiliser ?
body:
  options:
    - id: a
      text: |-
        `REGEXP_LIKE(Code, '^[a-z]{2}-\d{4}$', 'i')`
    - id: b
      text: |-
        `REGEXP_LIKE(Code, '^[a-z]{2}-\d{4}$', 'ic')`
    - id: c
      text: |-
        `REGEXP_LIKE(Code COLLATE Latin1_General_100_CI_AS, '^[a-z]{2}-\d{4}$')`
    - id: d
      text: |-
        `REGEXP_LIKE(Code, '^[a-z]{2}-\d{4}$', 'm')`
answer: { optionId: a }
explanation:
  correct:
    en: |
      Regular expression matching doesn't honor collations, and the default flag is c (case-sensitive), so [a-z] doesn't match uppercase letters even on a case-insensitive column. The i flag makes the match case-insensitive.
    fr: |
      La correspondance d'expressions régulières ne respecte pas les classements, et l'indicateur par défaut est c (sensible à la casse) : [a-z] ne correspond donc pas aux majuscules, même sur une colonne insensible à la casse. L'indicateur i rend la correspondance insensible à la casse.
  options:
    b: { en: "When flags contradict each other, the last one is used: 'ic' is case-sensitive.", fr: "Quand des indicateurs se contredisent, le dernier est utilisé : 'ic' est sensible à la casse." }
    c: { en: "The column already uses this collation, and regular expressions ignore collations anyway.", fr: "La colonne utilise déjà ce classement, et les expressions régulières ignorent de toute façon les classements." }
    d: { en: "The m flag only changes how ^ and $ match line boundaries; matching stays case-sensitive.", fr: "L'indicateur m change seulement la façon dont ^ et $ correspondent aux limites de ligne ; la correspondance reste sensible à la casse." }
references:
  - title: Regular expressions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/regular-expressions/overview
  - title: REGEXP_LIKE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-like-transact-sql
