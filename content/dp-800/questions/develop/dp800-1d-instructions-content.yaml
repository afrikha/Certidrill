id: dp800-1d-instructions-content
objective: "1.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing the `.github/copilot-instructions.md` file of a SQL database project. The rules must make GitHub Copilot generate code that meets the following requirements:

    - Stored procedures roll back an open transaction on error and return the original error to the caller.
    - Dynamic SQL resists SQL injection.
    - Generated permission statements follow the principle of least privilege.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le fichier `.github/copilot-instructions.md` d'un projet de base de données SQL. Les règles doivent amener GitHub Copilot à générer du code qui satisfait les exigences suivantes :

    - Les procédures stockées annulent une transaction ouverte en cas d'erreur et renvoient l'erreur d'origine à l'appelant.
    - Le SQL dynamique résiste à l'injection SQL.
    - Les instructions d'autorisation générées respectent le principe du moindre privilège.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template:
    en: |
      # Database development standards

      ## Error handling
      - [[err]]

      ## Dynamic SQL
      - [[dyn]]

      ## Permissions
      - [[perm]]
    fr: |
      # Normes de développement de base de données

      ## Gestion des erreurs
      - [[err]]

      ## SQL dynamique
      - [[dyn]]

      ## Autorisations
      - [[perm]]
  slots:
    - id: err
      options:
        - { id: throw, text: { en: "Use TRY...CATCH; in CATCH, roll back when XACT_STATE() <> 0, then `THROW;`", fr: "Utiliser TRY...CATCH ; dans CATCH, annuler si XACT_STATE() <> 0, puis `THROW;`" } }
        - { id: atat, text: { en: "Check @@ERROR after each statement and RETURN the error number.", fr: "Vérifier @@ERROR après chaque instruction et renvoyer le numéro d'erreur avec RETURN." } }
        - { id: sev10, text: { en: "In CATCH, report the error with RAISERROR at severity 10.", fr: "Dans CATCH, signaler l'erreur avec RAISERROR de gravité 10." } }
    - id: dyn
      options:
        - { id: quotes, text: { en: "Use EXEC() and replace each single quote in user input with two quotes.", fr: "Utiliser EXEC() et remplacer chaque apostrophe de l'entrée utilisateur par deux apostrophes." } }
        - { id: params, text: { en: "Use sp_executesql with typed parameters; never concatenate user input.", fr: "Utiliser sp_executesql avec des paramètres typés ; ne jamais concaténer d'entrée utilisateur." } }
        - { id: owner, text: { en: "Run dynamic SQL in procedures created WITH EXECUTE AS OWNER.", fr: "Exécuter le SQL dynamique dans des procédures créées WITH EXECUTE AS OWNER." } }
    - id: perm
      options:
        - { id: dbowner, text: { en: "Add new application users to db_owner to avoid permission errors.", fr: "Ajouter les nouveaux utilisateurs d'application à db_owner pour éviter les erreurs d'autorisation." } }
        - { id: public, text: { en: "GRANT EXECUTE on new procedures to public.", fr: "Accorder EXECUTE sur les nouvelles procédures à public avec GRANT." } }
        - { id: roles, text: { en: "Grant permissions to roles on specific objects or schemas; never GRANT to public.", fr: "Accorder les autorisations à des rôles sur des objets ou schémas précis ; jamais de GRANT à public." } }
answer:
  values: { err: throw, dyn: params, perm: roles }
explanation:
  correct:
    en: |
      A CATCH block that rolls back when XACT_STATE() is not 0 and ends with `THROW;` returns the original error after cleaning up. Parameterized dynamic SQL with sp_executesql prevents injection, and permissions granted to roles on specific securables, never to public, follow least privilege. Instructions guide Copilot, so the generated code still needs review.
    fr: |
      Un bloc CATCH qui annule la transaction quand XACT_STATE() est différent de 0 et se termine par `THROW;` renvoie l'erreur d'origine après le nettoyage. Le SQL dynamique paramétré avec sp_executesql empêche l'injection, et les autorisations accordées à des rôles sur des éléments sécurisables précis, jamais à public, respectent le moindre privilège. Les instructions guident Copilot : le code généré doit toujours être examiné.
  options:
    atat: { en: "Returning an error number doesn't roll back the transaction or raise the original error.", fr: "Renvoyer un numéro d'erreur n'annule pas la transaction et ne lève pas l'erreur d'origine." }
    sev10: { en: "Severity 10 is informational: the caller doesn't receive an error.", fr: "La gravité 10 est informative : l'appelant ne reçoit pas d'erreur." }
    quotes: { en: "Escaping quotes in concatenated strings is fragile; parameters are the recommended defense.", fr: "L'échappement des apostrophes dans des chaînes concaténées est fragile ; les paramètres sont la défense recommandée." }
    owner: { en: "EXECUTE AS OWNER changes the security context; it doesn't prevent injection.", fr: "EXECUTE AS OWNER change le contexte de sécurité ; il n'empêche pas l'injection." }
    dbowner: { en: "db_owner grants full control of the database.", fr: "db_owner accorde le contrôle total de la base de données." }
    public: { en: "Every database user is a member of public, so a grant to public reaches everyone.", fr: "Chaque utilisateur de base de données est membre de public : une autorisation accordée à public atteint tout le monde." }
references:
  - title: Create and configure GitHub Copilot instruction files
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/6-create-configure-copilot-instruction-files
