id: dp800-cs1a-specs-filter
objective: "1.3.3"
type: multi
caseStudy: dp800-cs1a-adventure-works
difficulty: 1
status: draft
stem:
  en: |
    The storefront must list the active waterproof products that are available in black. You write the following query.

    ```sql
    SELECT ProductID, Name
    FROM dbo.Products
    WHERE ProductStatus = 'Active'
      AND JSON_VALUE(Specs, '$.waterproof') = 'true'
      AND <color condition>;
    ```

    Which two expressions can you use as the color condition? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    La boutique en ligne doit lister les produits actifs étanches qui sont disponibles en noir. Vous écrivez la requête suivante.

    ```sql
    SELECT ProductID, Name
    FROM dbo.Products
    WHERE ProductStatus = 'Active'
      AND JSON_VALUE(Specs, '$.waterproof') = 'true'
      AND <color condition>;
    ```

    Quelles sont les deux expressions que vous pouvez utiliser comme condition de couleur ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "JSON_VALUE(Specs, '$.colors') = 'black'" }
    - { id: b, text: "JSON_CONTAINS(Specs, 'black', '$.colors[*]') = 1" }
    - { id: c, text: "JSON_QUERY(Specs, '$.colors') = 'black'" }
    - { id: d, text: "EXISTS (SELECT 1 FROM OPENJSON(Specs, '$.colors') WHERE value = 'black')" }
    - { id: e, text: "JSON_PATH_EXISTS(Specs, '$.colors.black') = 1" }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      JSON_CONTAINS returns 1 when the search value equals an element of the array that the path points to; a path to an array must use the [*] wildcard. OPENJSON with a path returns one row per element of the colors array, with the element in the value column, so EXISTS finds the products that have a black element.
    fr: |
      JSON_CONTAINS renvoie 1 quand la valeur recherchée est égale à un élément du tableau désigné par le chemin ; un chemin vers un tableau doit utiliser le caractère générique [*]. OPENJSON avec un chemin renvoie une ligne par élément du tableau colors, avec l'élément dans la colonne value : EXISTS trouve donc les produits qui ont un élément black.
  options:
    a: { en: "JSON_VALUE returns scalar values only; for an array it returns NULL in the default lax mode.", fr: "JSON_VALUE ne renvoie que des valeurs scalaires ; pour un tableau, il renvoie NULL dans le mode lax par défaut." }
    c: { en: "JSON_QUERY returns the whole array as JSON text, such as [\"black\", \"red\"], which never equals 'black'.", fr: "JSON_QUERY renvoie tout le tableau sous forme de texte JSON, par exemple [\"black\", \"red\"], qui n'est jamais égal à 'black'." }
    e: { en: "This path looks for a property named black inside colors; colors is an array of strings, so the path never exists.", fr: "Ce chemin cherche une propriété nommée black dans colors ; colors est un tableau de chaînes, le chemin n'existe donc jamais." }
references:
  - title: JSON_CONTAINS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-contains-transact-sql
