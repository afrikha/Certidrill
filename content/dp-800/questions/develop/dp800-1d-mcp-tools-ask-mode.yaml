id: dp800-1d-mcp-tools-ask-mode
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In Visual Studio Code, you add the SQL MCP Server endpoint of an Azure SQL database to the `.vscode/mcp.json` file of your workspace. The server starts and shows a running status.

    In GitHub Copilot Chat, the chat mode is set to Ask. When you ask for the ten products with the lowest stock, Copilot answers with a generic query and never calls the tools of the server.

    What should you do?
  fr: |
    Dans Visual Studio Code, vous ajoutez le point de terminaison SQL MCP Server d'une base de données Azure SQL au fichier `.vscode/mcp.json` de votre espace de travail. Le serveur démarre et affiche un état d'exécution.

    Dans GitHub Copilot Chat, le mode de conversation est Ask. Quand vous demandez les dix produits dont le stock est le plus bas, Copilot répond avec une requête générique et n'appelle jamais les outils du serveur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select a different model in the model picker of the chat.", fr: "Sélectionner un autre modèle dans le sélecteur de modèle de la conversation." } }
    - { id: b, text: { en: "Reinstall the SQL Server (mssql) extension and restart the server.", fr: "Réinstaller l'extension SQL Server (mssql) et redémarrer le serveur." } }
    - { id: c, text: { en: "Switch the chat mode from Ask to Agent.", fr: "Faire passer le mode de conversation de Ask à Agent." } }
    - { id: d, text: { en: "Add the endpoint URL to .github/copilot-instructions.md.", fr: "Ajouter l'URL du point de terminaison à .github/copilot-instructions.md." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Only Agent mode lets Copilot use external tools, including MCP servers, to gather context and take actions. In Ask mode, Copilot answers in the chat without calling the tools of the server, even when the server is running.
    fr: |
      Seul le mode Agent permet à Copilot d'utiliser des outils externes, notamment des serveurs MCP, pour recueillir du contexte et effectuer des actions. En mode Ask, Copilot répond dans la conversation sans appeler les outils du serveur, même si celui-ci est en cours d'exécution.
  options:
    a: { en: "Every model is limited by the chat mode; changing the model doesn't make the tools available.", fr: "Tous les modèles sont limités par le mode de conversation : changer de modèle ne rend pas les outils disponibles." }
    b: { en: "The server already runs; the problem is the chat mode, not the installation.", fr: "Le serveur s'exécute déjà : le problème est le mode de conversation, pas l'installation." }
    d: { en: "Instruction files add guidance to prompts; they don't register or call MCP tools.", fr: "Les fichiers d'instructions ajoutent des consignes aux prompts ; ils n'inscrivent ni n'appellent d'outils MCP." }
references:
  - title: Configure model and model context protocol (MCP) tool options in a GitHub Copilot or Fabric Copilot chat session
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/5-configure-model-mcp-tool-options
