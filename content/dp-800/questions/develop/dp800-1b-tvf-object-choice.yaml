id: dp800-1b-tvf-object-choice
objective: "1.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are designing programmability objects for an Azure SQL database at Contoso. Each requirement must be met by using one object type.

    Which object type should you use for each requirement? To answer, drag the appropriate object types to the correct requirements. Each object type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez des objets de programmabilité pour une base de données Azure SQL chez Contoso. Chaque exigence doit être satisfaite à l'aide d'un seul type d'objet.

    Quel type d'objet devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types d'objets appropriés vers les exigences correspondantes. Chaque type d'objet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: scalar, text: { en: "Scalar function", fr: "Fonction scalaire" } }
    - { id: itvf, text: { en: "Inline table-valued function", fr: "Fonction table inline" } }
    - { id: proc, text: { en: "Stored procedure", fr: "Procédure stockée" } }
    - { id: view, text: { en: "View", fr: "Vue" } }
    - { id: trigger, text: { en: "Trigger", fr: "Déclencheur" } }
  targets:
    - id: shipping
      text: { en: "Compute a shipping cost from a weight and a zone code, in the SELECT list of many queries.", fr: "Calculer un coût d'expédition à partir d'un poids et d'un code de zone, dans la liste SELECT de nombreuses requêtes." }
    - id: orders
      text: { en: "Return the orders of the region passed as a parameter, in a FROM clause; the optimizer must use the statistics of the base tables.", fr: "Renvoyer les commandes de la région passée en paramètre, dans une clause FROM ; l'optimiseur doit utiliser les statistiques des tables de base." }
    - id: place
      text: { en: "Insert an order and its lines in one transaction when the application calls it.", fr: "Insérer une commande et ses lignes dans une même transaction quand l'application l'appelle." }
answer:
  mapping: { shipping: scalar, orders: itvf, place: proc }
explanation:
  correct:
    en: |
      A scalar function returns one value and can be used wherever an expression is allowed, such as a SELECT list. An inline table-valued function accepts parameters, is used in FROM, and is expanded into the calling query, so the optimizer works with the base tables' statistics. Only a stored procedure, called with EXECUTE, can modify tables and manage a transaction.
    fr: |
      Une fonction scalaire renvoie une seule valeur et peut être utilisée partout où une expression est autorisée, comme une liste SELECT. Une fonction table inline accepte des paramètres, s'utilise dans FROM et est développée dans la requête appelante : l'optimiseur travaille avec les statistiques des tables de base. Seule une procédure stockée, appelée avec EXECUTE, peut modifier des tables et gérer une transaction.
  options:
    view: { en: "A view takes no parameters, so it cannot return the orders of a region passed as a parameter.", fr: "Une vue ne prend aucun paramètre : elle ne peut pas renvoyer les commandes d'une région passée en paramètre." }
    trigger: { en: "A trigger runs automatically after or instead of a data modification; an application cannot call it.", fr: "Un déclencheur s'exécute automatiquement après ou à la place d'une modification de données ; une application ne peut pas l'appeler." }
references:
  - title: CREATE FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql
  - title: CREATE PROCEDURE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-procedure-transact-sql
