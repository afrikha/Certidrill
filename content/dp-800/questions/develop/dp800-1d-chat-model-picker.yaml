id: dp800-1d-chat-model-picker
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at Contoso uses GitHub Copilot Chat in SQL Server Management Studio (SSMS) with a fast model for routine code completion. For a session about the design of a new order-processing schema, the developer wants a more capable model. The change must not affect the other developers.

    What should the developer do?
  fr: |
    Un développeur de Contoso utilise GitHub Copilot Chat dans SQL Server Management Studio (SSMS) avec un modèle rapide pour la complétion de code courante. Pour une session sur la conception d'un nouveau schéma de traitement des commandes, le développeur souhaite un modèle plus performant. La modification ne doit pas affecter les autres développeurs.

    Que doit faire le développeur ?
body:
  options:
    - { id: a, text: { en: "Add a line that names the model to .github/copilot-instructions.md.", fr: "Ajouter une ligne qui nomme le modèle dans .github/copilot-instructions.md." } }
    - { id: b, text: { en: "Ask the GitHub organization owner to change the Copilot policy.", fr: "Demander au propriétaire de l'organisation GitHub de modifier la stratégie Copilot." } }
    - { id: c, text: { en: "Add the name of the model to the user-level .mcp.json file.", fr: "Ajouter le nom du modèle au fichier .mcp.json de niveau utilisateur." } }
    - { id: d, text: { en: "Select another model in the model selector at the top of the chat.", fr: "Sélectionner un autre modèle dans le sélecteur de modèle en haut de la conversation." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In SSMS, you choose the model for your chat in the model selector drop-down list at the top of the Copilot Chat window. Microsoft recommends more capable models for design and optimization questions and faster models for quick completions; the choice applies to your own chat only.
    fr: |
      Dans SSMS, vous choisissez le modèle de votre conversation dans la liste déroulante du sélecteur de modèle, en haut de la fenêtre Copilot Chat. Microsoft recommande des modèles plus performants pour les questions de conception et d'optimisation et des modèles plus rapides pour les complétions rapides ; le choix s'applique uniquement à votre conversation.
  options:
    a: { en: "Repository instructions apply to everyone in the repository, and they don't select the model.", fr: "Les instructions de dépôt s'appliquent à tous les membres du dépôt, et elles ne sélectionnent pas le modèle." }
    b: { en: "An organization policy would affect every member, which the requirement excludes.", fr: "Une stratégie d'organisation affecterait tous les membres, ce que l'exigence exclut." }
    c: { en: "The .mcp.json file declares MCP servers, not the chat model.", fr: "Le fichier .mcp.json déclare des serveurs MCP, pas le modèle de conversation." }
references:
  - title: Configure model and model context protocol (MCP) tool options in a GitHub Copilot or Fabric Copilot chat session
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/5-configure-model-mcp-tool-options
