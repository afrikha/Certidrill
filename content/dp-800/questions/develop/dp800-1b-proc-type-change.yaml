id: dp800-1b-proc-type-change
objective: "1.2.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a user-defined table type named Sales.OrderLineType with the columns ProductID and Quantity. A stored procedure named Sales.usp_AddLines has a READONLY parameter of this type. No other object references the type.

    You need to add a UnitPrice column to Sales.OrderLineType and make Sales.usp_AddLines insert the unit price. The type and the procedure must keep their names.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient un type de table défini par l'utilisateur nommé Sales.OrderLineType avec les colonnes ProductID et Quantity. Une procédure stockée nommée Sales.usp_AddLines possède un paramètre READONLY de ce type. Aucun autre objet ne référence le type.

    Vous devez ajouter une colonne UnitPrice à Sales.OrderLineType et faire en sorte que Sales.usp_AddLines insère le prix unitaire. Le type et la procédure doivent conserver leur nom.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: dropproc, text: { en: "Drop the procedure Sales.usp_AddLines.", fr: "Supprimer la procédure Sales.usp_AddLines." } }
    - { id: droptype, text: { en: "Drop the type Sales.OrderLineType.", fr: "Supprimer le type Sales.OrderLineType." } }
    - { id: createtype, text: { en: "Create the type Sales.OrderLineType with the ProductID, Quantity and UnitPrice columns.", fr: "Créer le type Sales.OrderLineType avec les colonnes ProductID, Quantity et UnitPrice." } }
    - { id: createproc, text: { en: "Create the procedure Sales.usp_AddLines that inserts UnitPrice.", fr: "Créer la procédure Sales.usp_AddLines qui insère UnitPrice." } }
    - { id: altertable, text: { en: "Run ALTER TABLE Sales.OrderLineType ADD UnitPrice decimal(10, 2) NOT NULL.", fr: "Exécuter ALTER TABLE Sales.OrderLineType ADD UnitPrice decimal(10, 2) NOT NULL." } }
    - { id: refresh, text: { en: "Run sp_refreshsqlmodule on Sales.usp_AddLines.", fr: "Exécuter sp_refreshsqlmodule sur Sales.usp_AddLines." } }
answer:
  sequence: [ dropproc, droptype, createtype, createproc ]
explanation:
  correct:
    en: |
      To modify a user-defined type, you must drop it with DROP TYPE and re-create it. DROP TYPE does not run while a stored procedure uses a parameter of the type, so the procedure must be dropped first. You then re-create the type with the new column and re-create the procedure that uses it.
    fr: |
      Pour modifier un type défini par l'utilisateur, vous devez le supprimer avec DROP TYPE puis le recréer. DROP TYPE ne s'exécute pas tant qu'une procédure stockée utilise un paramètre de ce type : la procédure doit donc être supprimée d'abord. Vous recréez ensuite le type avec la nouvelle colonne, puis la procédure qui l'utilise.
  options:
    altertable: { en: "A table type is not a table; ALTER TABLE cannot change its definition.", fr: "Un type de table n'est pas une table ; ALTER TABLE ne peut pas modifier sa définition." }
    refresh: { en: "Refreshing the module metadata does not add a column to the type, and the type cannot be dropped while the procedure exists.", fr: "Actualiser les métadonnées du module n'ajoute pas de colonne au type, et le type ne peut pas être supprimé tant que la procédure existe." }
references:
  - title: CREATE TYPE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-type-transact-sql
  - title: DROP TYPE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-type-transact-sql
