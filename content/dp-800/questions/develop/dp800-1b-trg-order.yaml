id: dp800-1b-trg-order
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database for Northwind Traders. The Sales.Orders table has three AFTER INSERT triggers: trg_Orders_Validate, trg_Orders_Notify and trg_Orders_Points.

    You need to ensure that trg_Orders_Validate always fires before the two other triggers. The three triggers must keep running after the INSERT statement.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL pour Northwind Traders. La table Sales.Orders possède trois déclencheurs AFTER INSERT : trg_Orders_Validate, trg_Orders_Notify et trg_Orders_Points.

    Vous devez vous assurer que trg_Orders_Validate se déclenche toujours avant les deux autres déclencheurs. Les trois déclencheurs doivent continuer à s'exécuter après l'instruction INSERT.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Rename the trigger to trg_A_Orders_Validate so that it sorts first by name.", fr: "Renommer le déclencheur en trg_A_Orders_Validate pour qu'il soit trié en premier par nom." } }
    - { id: b, text: { en: "Run sp_settriggerorder with @order = 'First' and @stmttype = 'INSERT' for trg_Orders_Validate.", fr: "Exécuter sp_settriggerorder avec @order = 'First' et @stmttype = 'INSERT' pour trg_Orders_Validate." } }
    - { id: c, text: { en: "Drop and re-create trg_Orders_Notify and trg_Orders_Points after trg_Orders_Validate.", fr: "Supprimer et recréer trg_Orders_Notify et trg_Orders_Points après trg_Orders_Validate." } }
    - { id: d, text: { en: "Enable the RECURSIVE_TRIGGERS database option.", fr: "Activer l'option de base de données RECURSIVE_TRIGGERS." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      sp_settriggerorder sets which AFTER trigger fires first and which fires last for a statement type; the triggers in between run in an undefined order. If trg_Orders_Validate is later changed with ALTER TRIGGER, its order is reset to None and must be set again.
    fr: |
      sp_settriggerorder définit quel déclencheur AFTER se déclenche en premier et lequel en dernier pour un type d'instruction ; les déclencheurs intermédiaires s'exécutent dans un ordre non défini. Si trg_Orders_Validate est modifié plus tard avec ALTER TRIGGER, son ordre est réinitialisé à None et doit être défini à nouveau.
  options:
    a: { en: "The firing order of AFTER triggers does not depend on their names.", fr: "L'ordre de déclenchement des déclencheurs AFTER ne dépend pas de leur nom." }
    c: { en: "Creation order does not define the firing order; the triggers that are not set as first or last run in an undefined order.", fr: "L'ordre de création ne définit pas l'ordre de déclenchement ; les déclencheurs qui ne sont pas définis comme premier ou dernier s'exécutent dans un ordre non défini." }
    d: { en: "RECURSIVE_TRIGGERS controls whether triggers can fire themselves again; it does not order triggers.", fr: "RECURSIVE_TRIGGERS détermine si des déclencheurs peuvent se déclencher à nouveau eux-mêmes ; l'option n'ordonne pas les déclencheurs." }
references:
  - title: sys.sp_settriggerorder (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-settriggerorder-transact-sql
