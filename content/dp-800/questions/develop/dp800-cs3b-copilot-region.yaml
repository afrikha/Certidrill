id: dp800-cs3b-copilot-region
objective: "1.4.2"
type: single
caseStudy: dp800-cs3b-proseware
difficulty: 1
status: draft
stem:
  en: |
    The members of SG-Developers report that Copilot isn't available in the SQL query editor of LearnDb.

    You need to meet the AI-assisted development requirements. What should a Fabric administrator do?
  fr: |
    Les membres de SG-Developers signalent que Copilot n'est pas disponible dans l'éditeur de requête SQL de LearnDb.

    Vous devez satisfaire les exigences de développement assisté par IA. Que doit faire un administrateur Fabric ?
body:
  options:
    - id: a
      text:
        en: Designate cap-prod as a Fabric Copilot capacity and assign WS-Learning to it.
        fr: Désigner cap-prod comme capacité Fabric Copilot et lui affecter WS-Learning.
    - id: b
      text:
        en: Move WS-Learning to cap-trial and enable Copilot for that capacity.
        fr: Déplacer WS-Learning vers cap-trial et activer Copilot pour cette capacité.
    - id: c
      text:
        en: Enable the tenant setting that lets data sent to Azure OpenAI be processed outside the capacity's region.
        fr: Activer le paramètre de locataire qui permet de traiter les données envoyées à Azure OpenAI hors de la région de la capacité.
    - id: d
      text:
        en: Assign GitHub Copilot Business licenses to the members of SG-Developers.
        fr: Attribuer des licences GitHub Copilot Business aux membres de SG-Developers.
answer: { optionId: c }
explanation:
  correct:
    en: Copilot in SQL database is disabled by default for capacities outside the US and France, and cap-prod is in Germany West Central. A Fabric administrator must enable the tenant setting "Data sent to Azure OpenAI can be processed outside your capacity's geographic region, compliance boundary, or national cloud instance". The main Copilot switch is already enabled for SG-Developers, and F64 meets the F2-or-higher prerequisite.
    fr: Copilot dans la base de données SQL est désactivé par défaut pour les capacités situées hors des États-Unis et de la France, et cap-prod se trouve en Germany West Central. Un administrateur Fabric doit activer le paramètre de locataire « Data sent to Azure OpenAI can be processed outside your capacity's geographic region, compliance boundary, or national cloud instance ». Le commutateur principal de Copilot est déjà activé pour SG-Developers, et F64 respecte le prérequis F2 ou supérieur.
  options:
    a: { en: "A Fabric Copilot capacity lets Pro and Premium Per User workspaces use Copilot; WS-Learning is already on a paid F64 capacity, and the region restriction remains.", fr: "Une capacité Fabric Copilot permet aux espaces de travail Pro et Premium par utilisateur d'utiliser Copilot ; WS-Learning est déjà sur une capacité F64 payante, et la restriction de région demeure." }
    b: { en: "Trial SKUs aren't supported for Copilot in SQL database, and cap-trial is in the same region.", fr: "Les références SKU d'évaluation ne sont pas prises en charge pour Copilot dans la base de données SQL, et cap-trial se trouve dans la même région." }
    d: { en: "GitHub Copilot is a separate product; its licenses don't enable Copilot in the Fabric portal.", fr: "GitHub Copilot est un produit distinct ; ses licences n'activent pas Copilot dans le portail Fabric." }
references:
  - title: What is Copilot in the SQL database in Fabric workload?
    url: https://learn.microsoft.com/en-us/fabric/database/sql/copilot
  - title: Enable and configure Copilot in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/copilot-enable-fabric
