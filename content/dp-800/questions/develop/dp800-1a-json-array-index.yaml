id: dp800-1a-json-array-index
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure SQL database that contains the following table.

    ```sql
    CREATE TABLE dbo.Article
    (
        ArticleID int IDENTITY NOT NULL PRIMARY KEY CLUSTERED,
        Meta      json NOT NULL
    );
    ```

    Each Meta document contains a `tags` array. The most frequent query is the following.

    ```sql
    SELECT ArticleID
    FROM dbo.Article
    WHERE JSON_CONTAINS(Meta, 'sql', '$.tags[*]') = 1;
    ```

    You need to create an index that speeds up searches for values inside the tags array.

    Which statement should you run?
  fr: |
    Proseware dispose d'une base de données Azure SQL qui contient la table suivante.

    ```sql
    CREATE TABLE dbo.Article
    (
        ArticleID int IDENTITY NOT NULL PRIMARY KEY CLUSTERED,
        Meta      json NOT NULL
    );
    ```

    Chaque document Meta contient un tableau `tags`. La requête la plus fréquente est la suivante.

    ```sql
    SELECT ArticleID
    FROM dbo.Article
    WHERE JSON_CONTAINS(Meta, 'sql', '$.tags[*]') = 1;
    ```

    Vous devez créer un index qui accélère la recherche de valeurs dans le tableau tags.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "CREATE JSON INDEX JX_Article_Meta ON dbo.Article (Meta) FOR ('$.tags') WITH (ONLINE = ON);" }
    - { id: b, text: "CREATE NONCLUSTERED INDEX IX_Article_Meta ON dbo.Article (Meta);" }
    - { id: c, text: "CREATE JSON INDEX JX_Article_Meta ON dbo.Article (Meta) FOR ('$.tags') WITH (OPTIMIZE_FOR_ARRAY_SEARCH = ON);" }
    - { id: d, text: "ALTER TABLE dbo.Article ADD Tags AS JSON_VALUE(Meta, '$.tags'); CREATE INDEX IX_Article_Tags ON dbo.Article (Tags);" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A JSON index on the json column can serve JSON_CONTAINS predicates on the indexed path, and the OPTIMIZE_FOR_ARRAY_SEARCH option optimizes searches inside arrays. The table already has the clustered primary key that a JSON index requires.
    fr: |
      Un index JSON sur la colonne json peut servir les prédicats JSON_CONTAINS sur le chemin indexé, et l'option OPTIMIZE_FOR_ARRAY_SEARCH optimise les recherches dans les tableaux. La table possède déjà la clé primaire cluster qu'exige un index JSON.
  options:
    a: { en: "JSON indexes support only ONLINE = OFF; ONLINE = ON raises an error.", fr: "Les index JSON ne prennent en charge que ONLINE = OFF ; ONLINE = ON génère une erreur." }
    b: { en: "A json column can't be the key column of a nonclustered index.", fr: "Une colonne json ne peut pas être la colonne clé d'un index non cluster." }
    d: { en: "JSON_VALUE returns a scalar; for an array it returns NULL in lax mode, so the computed column holds no tags.", fr: "JSON_VALUE renvoie une valeur scalaire ; pour un tableau, il renvoie NULL en mode lax : la colonne calculée ne contient aucune valeur du tableau tags." }
references:
