id: dp800-1a-check-computed
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is creating a table for hotel bookings. The table must expose the number of nights of each booking as a computed column named **Nights**, and a constraint must ensure that every booking lasts from 1 to 30 nights.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys crée une table pour des réservations d'hôtel. La table doit exposer le nombre de nuits de chaque réservation dans une colonne calculée nommée **Nights**, et une contrainte doit garantir que chaque réservation dure de 1 à 30 nuits.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE Sales.Booking
    (
        BookingID int NOT NULL CONSTRAINT PK_Booking PRIMARY KEY,
        CheckIn   date NOT NULL,
        CheckOut  date NOT NULL,
        Nights    AS DATEDIFF(day, CheckIn, CheckOut) [[p]],
        CONSTRAINT CK_Booking_Nights CHECK ([[c]])
    );
  slots:
    - id: p
      options:
        - { id: persisted, text: PERSISTED }
        - { id: sparse, text: SPARSE }
        - { id: nullopt, text: "NULL" }
    - id: c
      options:
        - { id: between, text: Nights BETWEEN 1 AND 30 }
        - { id: or, text: Nights >= 1 OR Nights <= 30 }
        - { id: max, text: MAX(Nights) <= 30 }
        - { id: in, text: "Nights IN (1, 30)" }
answer:
  values: { p: persisted, c: between }
explanation:
  correct:
    en: |
      A computed column must be marked PERSISTED to participate in a CHECK constraint. The table-level CHECK constraint then tests a Boolean condition on each row: BETWEEN 1 AND 30 includes both limits.
    fr: |
      Une colonne calculée doit être marquée PERSISTED pour participer à une contrainte CHECK. La contrainte CHECK de niveau table teste ensuite une condition booléenne sur chaque ligne : BETWEEN 1 AND 30 inclut les deux bornes.
  options:
    sparse: { en: "SPARSE optimizes storage of mostly-NULL regular columns; it doesn't apply to computed columns.", fr: "SPARSE optimise le stockage des colonnes ordinaires majoritairement NULL ; il ne s'applique pas aux colonnes calculées." }
    nullopt: { en: "The nullability of a computed column is determined by the engine, and the column still wouldn't be persisted.", fr: "La possibilité de valeur NULL d'une colonne calculée est déterminée par le moteur, et la colonne ne serait toujours pas persistante." }
    or: { en: "Every integer satisfies at least one side of the OR, so the constraint would accept any value.", fr: "Tout entier satisfait au moins un côté du OR : la contrainte accepterait n'importe quelle valeur." }
    max: { en: "A CHECK constraint evaluates each row; it can't contain an aggregate function.", fr: "Une contrainte CHECK évalue chaque ligne ; elle ne peut pas contenir de fonction d'agrégation." }
    in: { en: "IN (1, 30) accepts only the values 1 and 30, not the range between them.", fr: "IN (1, 30) n'accepte que les valeurs 1 et 30, pas la plage entre elles." }
references:
  - title: CREATE TABLE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-table-transact-sql
