id: dp800-1d-copilot-chat-settings
objective: "1.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer at Adatum uses GitHub Copilot in SQL Server Management Studio (SSMS) 22.7. The developer isn't an administrator of the GitHub organization or of the computer.

    Which three settings can the developer change directly in the Copilot Chat window for their own chat?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur d'Adatum utilise GitHub Copilot dans SQL Server Management Studio (SSMS) 22.7. Le développeur n'est administrateur ni de l'organisation GitHub ni de l'ordinateur.

    Quels sont les trois paramètres que le développeur peut modifier directement dans la fenêtre Copilot Chat pour sa propre conversation ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: model, text: { en: "The model that answers the prompts", fr: "Le modèle qui répond aux prompts" } }
    - { id: mode, text: { en: "The chat mode, Ask or Agent", fr: "Le mode de conversation, Ask ou Agent" } }
    - { id: tools, text: { en: "The MCP server tools that Copilot can use", fr: "Les outils de serveur MCP que Copilot peut utiliser" } }
    - { id: allowlist, text: { en: "The MCP server allow list", fr: "La liste d'autorisation des serveurs MCP" } }
    - { id: exclusion, text: { en: "The content exclusions for the repository", fr: "Les exclusions de contenu du dépôt" } }
    - { id: policy, text: { en: "The Disable Agent Mode policy", fr: "La stratégie Disable Agent Mode" } }
answer: { optionIds: [model, mode, tools] }
explanation:
  correct:
    en: |
      In the Copilot Chat window, the developer picks the model in the model selector, switches between Ask and Agent with the mode drop-down list, and enables or disables MCP tools in the Tools list. These choices are made per user, in the chat.
    fr: |
      Dans la fenêtre Copilot Chat, le développeur choisit le modèle dans le sélecteur de modèle, passe de Ask à Agent avec la liste déroulante des modes, et active ou désactive les outils MCP dans la liste Tools. Ces choix se font par utilisateur, dans la conversation.
  options:
    allowlist: { en: "The MCP server allow list is defined by administrators in the AI Controls of the GitHub enterprise or organization.", fr: "La liste d'autorisation des serveurs MCP est définie par les administrateurs dans les AI Controls de l'entreprise ou de l'organisation GitHub." }
    exclusion: { en: "Content exclusions are configured in the GitHub repository or organization settings.", fr: "Les exclusions de contenu se configurent dans les paramètres du dépôt ou de l'organisation GitHub." }
    policy: { en: "Disable Agent Mode is a Group Policy or Intune setting of the SSMS administrative templates.", fr: "Disable Agent Mode est un paramètre de stratégie de groupe ou d'Intune des modèles d'administration de SSMS." }
references:
  - title: Admin controls for GitHub Copilot in SQL Server Management Studio
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/admin-controls
  - title: Configure model and model context protocol (MCP) tool options in a GitHub Copilot or Fabric Copilot chat session
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/5-configure-model-mcp-tool-options
