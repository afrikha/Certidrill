id: dp800-1a-updatable-ledger
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware processes insurance payouts in an Azure SQL database. Payout amounts can be corrected by the application after they are recorded.

    External auditors must be able to verify cryptographically that no current or previous version of a payout row was tampered with, including by members of the db_owner role. The design must not block the corrections.

    Which type of table should you create for the payouts?
  fr: |
    Litware traite des versements d'assurance dans une base de données Azure SQL. L'application peut corriger le montant d'un versement après son enregistrement.

    Des auditeurs externes doivent pouvoir vérifier par chiffrement qu'aucune version actuelle ou précédente d'une ligne de versement n'a été falsifiée, y compris par des membres du rôle db_owner. La conception ne doit pas bloquer les corrections.

    Quel type de table devez-vous créer pour les versements ?
body:
  options:
    - { id: a, text: { en: "An append-only ledger table", fr: "Une table de registre en ajout uniquement" } }
    - { id: b, text: { en: "A system-versioned temporal table", fr: "Une table temporelle avec versions gérées par le système" } }
    - { id: c, text: { en: "An updatable ledger table", fr: "Une table de registre modifiable" } }
    - { id: d, text: { en: "A durable memory-optimized table", fr: "Une table optimisée en mémoire durable" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An updatable ledger table allows updates and deletes, keeps previous row versions in a history table and exposes them through a ledger view. Every change is hashed into the database ledger, and digests stored outside the database let auditors verify that no data was tampered with, even by privileged users.
    fr: |
      Une table de registre modifiable autorise les mises à jour et les suppressions, conserve les versions précédentes des lignes dans une table d'historique et les expose dans une vue de registre. Chaque modification est hachée dans le registre de la base de données, et des synthèses stockées hors de la base permettent aux auditeurs de vérifier qu'aucune donnée n'a été falsifiée, même par des utilisateurs privilégiés.
  options:
    a: { en: "An append-only ledger table blocks UPDATE and DELETE, so payouts couldn't be corrected.", fr: "Une table de registre en ajout uniquement bloque UPDATE et DELETE : les versements ne pourraient pas être corrigés." }
    b: { en: "A temporal table keeps history but provides no cryptographic proof; an administrator can turn versioning off and change the history.", fr: "Une table temporelle conserve l'historique mais ne fournit aucune preuve cryptographique ; un administrateur peut désactiver le versioning et modifier l'historique." }
    d: { en: "A memory-optimized table improves performance; it neither keeps history nor detects tampering.", fr: "Une table optimisée en mémoire améliore les performances ; elle ne conserve pas d'historique et ne détecte pas les falsifications." }
references:
  - title: Ledger overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview
