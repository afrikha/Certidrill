stem:
  en: You create an INSTEAD OF UPDATE trigger that writes the history rows.
  fr: Vous créez un déclencheur INSTEAD OF UPDATE qui écrit les lignes d'historique.
body:
  solution:
    en: |
      You create the following trigger.

      ```sql
      CREATE TRIGGER HR.trg_Employees_Salary ON HR.Employees
      INSTEAD OF UPDATE
      AS
      BEGIN
          SET NOCOUNT ON;
          INSERT INTO HR.SalaryHistory (EmployeeID, OldSalary, NewSalary)
          SELECT d.EmployeeID, d.Salary, i.Salary
          FROM deleted AS d
          INNER JOIN inserted AS i ON i.EmployeeID = d.EmployeeID
          WHERE i.Salary <> d.Salary;
      END;
      ```
    fr: |
      Vous créez le déclencheur suivant.

      ```sql
      CREATE TRIGGER HR.trg_Employees_Salary ON HR.Employees
      INSTEAD OF UPDATE
      AS
      BEGIN
          SET NOCOUNT ON;
          INSERT INTO HR.SalaryHistory (EmployeeID, OldSalary, NewSalary)
          SELECT d.EmployeeID, d.Salary, i.Salary
          FROM deleted AS d
          INNER JOIN inserted AS i ON i.EmployeeID = d.EmployeeID
          WHERE i.Salary <> d.Salary;
      END;
      ```
answer: { value: false }
explanation:
  correct:
    en: The history query is set-based, but an INSTEAD OF trigger runs in place of the triggering statement. Because the trigger never updates HR.Employees itself, the salaries stay unchanged while history rows claim they changed. An INSTEAD OF trigger would have to perform the UPDATE from inserted as well; an AFTER trigger is the simpler choice.
    fr: "La requête d'historique est ensembliste, mais un déclencheur INSTEAD OF s'exécute à la place de l'instruction qui le déclenche. Comme le déclencheur ne met jamais à jour HR.Employees lui-même, les salaires restent inchangés alors que les lignes d'historique indiquent qu'ils ont changé. Un déclencheur INSTEAD OF devrait aussi effectuer l'UPDATE à partir de inserted ; un déclencheur AFTER est le choix le plus simple."
