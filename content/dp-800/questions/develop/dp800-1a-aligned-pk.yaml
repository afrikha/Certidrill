id: dp800-1a-aligned-pk
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind has an Azure SQL database. A table named **Sales.Orders** is a heap created on the partition scheme **PS_OrderYear (OrderDate)**. OrderID values are generated by a sequence and never repeat.

    You need to add a primary key to Sales.Orders. The primary key index must be aligned with the table so that partitions can later be switched in and out.

    Which statement should you run?
  fr: |
    Northwind dispose d'une base de données Azure SQL. Une table nommée **Sales.Orders** est un tas créé sur le schéma de partition **PS_OrderYear (OrderDate)**. Les valeurs de OrderID sont générées par une séquence et ne se répètent jamais.

    Vous devez ajouter une clé primaire à Sales.Orders. L'index de la clé primaire doit être aligné sur la table pour que des partitions puissent ensuite être basculées vers la table ou hors de celle-ci.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER TABLE Sales.Orders ADD CONSTRAINT PK_Orders PRIMARY KEY CLUSTERED (OrderID) ON PS_OrderYear (OrderDate);" }
    - { id: b, text: "ALTER TABLE Sales.Orders ADD CONSTRAINT PK_Orders PRIMARY KEY CLUSTERED (OrderID, OrderDate) ON PS_OrderYear (OrderDate);" }
    - { id: c, text: "ALTER TABLE Sales.Orders ADD CONSTRAINT PK_Orders PRIMARY KEY NONCLUSTERED (OrderID) ON PS_OrderYear (OrderDate);" }
    - { id: d, text: "ALTER TABLE Sales.Orders ADD CONSTRAINT PK_Orders PRIMARY KEY NONCLUSTERED (OrderID) ON [PRIMARY];" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a unique index, including the index of a primary key, is partitioned, the partitioning column must be part of its key. Adding OrderDate to the key lets the clustered primary key be created on PS_OrderYear (OrderDate), so it is aligned with the table. Because OrderID never repeats, the composite key still identifies each order.
    fr: |
      Lorsqu'un index unique, y compris l'index d'une clé primaire, est partitionné, la colonne de partitionnement doit faire partie de sa clé. Ajouter OrderDate à la clé permet de créer la clé primaire cluster sur PS_OrderYear (OrderDate) : elle est alignée sur la table. Comme OrderID ne se répète jamais, la clé composite identifie toujours chaque commande.
  options:
    a: { en: "A partitioned unique clustered index must explicitly include the partitioning column in its key.", fr: "Un index cluster unique partitionné doit inclure explicitement la colonne de partitionnement dans sa clé." }
    c: { en: "A partitioned unique nonclustered index must also contain the partitioning column in its key.", fr: "Un index non cluster unique partitionné doit lui aussi contenir la colonne de partitionnement dans sa clé." }
    d: { en: "An index on the PRIMARY filegroup isn't partitioned, so it isn't aligned with the table and blocks partition switching.", fr: "Un index sur le groupe de fichiers PRIMARY n'est pas partitionné : il n'est pas aligné sur la table et bloque le basculement de partitions." }
references:
  - title: Partitioned tables and indexes
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes
