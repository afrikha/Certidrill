id: dp800-1c-win-filter-rownumber
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You need to return the most recent order of each customer from a table named **Sales.Orders**. You write the following query.

    ```sql
    SELECT OrderID, CustomerID, OrderDate
    FROM Sales.Orders
    WHERE ROW_NUMBER() OVER (PARTITION BY CustomerID
                             ORDER BY OrderDate DESC) = 1;
    ```

    The query fails.

    What should you do?
  fr: |
    Vous devez renvoyer la commande la plus récente de chaque client à partir d'une table nommée **Sales.Orders**. Vous écrivez la requête suivante.

    ```sql
    SELECT OrderID, CustomerID, OrderDate
    FROM Sales.Orders
    WHERE ROW_NUMBER() OVER (PARTITION BY CustomerID
                             ORDER BY OrderDate DESC) = 1;
    ```

    La requête échoue.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Move the ROW_NUMBER() condition from the WHERE clause to a HAVING clause.", fr: "Déplacer la condition ROW_NUMBER() de la clause WHERE vers une clause HAVING." }
    - id: b
      text: { en: "Add a `GROUP BY CustomerID` clause and keep the condition in WHERE.", fr: "Ajouter une clause `GROUP BY CustomerID` et conserver la condition dans WHERE." }
    - id: c
      text: { en: "Compute ROW_NUMBER() in a CTE and filter on its result in the outer query.", fr: "Calculer ROW_NUMBER() dans une CTE et filtrer sur son résultat dans la requête externe." }
    - id: d
      text: { en: "Replace ROW_NUMBER() with DENSE_RANK() in the WHERE clause.", fr: "Remplacer ROW_NUMBER() par DENSE_RANK() dans la clause WHERE." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Window functions are computed when the SELECT list is processed, after WHERE, GROUP BY and HAVING, so they can appear only in the SELECT and ORDER BY clauses. Computing ROW_NUMBER() in a CTE (or a derived table) exposes it as a column that the outer query can filter on.
    fr: |
      Les fonctions de fenêtre sont calculées lors du traitement de la liste SELECT, après WHERE, GROUP BY et HAVING ; elles ne peuvent donc figurer que dans les clauses SELECT et ORDER BY. Calculer ROW_NUMBER() dans une CTE (ou une table dérivée) l'expose comme une colonne sur laquelle la requête externe peut filtrer.
  options:
    a: { en: "HAVING is also processed before the SELECT list, so a window function isn't allowed there either.", fr: "HAVING est lui aussi traité avant la liste SELECT : une fonction de fenêtre n'y est pas autorisée non plus." }
    b: { en: "Grouping doesn't make a window function valid in WHERE, and it would collapse the order rows.", fr: "Le regroupement ne rend pas une fonction de fenêtre valide dans WHERE, et il fusionnerait les lignes de commandes." }
    d: { en: "DENSE_RANK() is also a window function: the same error occurs in WHERE.", fr: "DENSE_RANK() est aussi une fonction de fenêtre : la même erreur se produit dans WHERE." }
references:
  - title: SELECT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
