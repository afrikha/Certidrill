id: dp800-1d-applyto-matching
objective: "1.4.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    A repository opened as the workspace in Visual Studio Code contains the following instruction files:

    - `.github/copilot-instructions.md`, with general Transact-SQL standards;
    - `.github/instructions/tests.instructions.md`, whose frontmatter sets applyTo to `'tests/**/*.sql'`.

    A developer asks GitHub Copilot Chat about different files of the repository.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un dépôt ouvert comme espace de travail dans Visual Studio Code contient les fichiers d'instructions suivants :

    - `.github/copilot-instructions.md`, avec des normes Transact-SQL générales ;
    - `.github/instructions/tests.instructions.md`, dont l'en-tête définit applyTo sur `'tests/**/*.sql'`.

    Un développeur interroge GitHub Copilot Chat sur différents fichiers du dépôt.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A request about src/procedures/usp_GetOrder.sql includes the rules of tests.instructions.md.
        fr: Une requête sur src/procedures/usp_GetOrder.sql inclut les règles de tests.instructions.md.
    - id: s2
      text:
        en: A request about tests/integration/orders/test_ship.sql includes the rules of tests.instructions.md.
        fr: Une requête sur tests/integration/orders/test_ship.sql inclut les règles de tests.instructions.md.
    - id: s3
      text:
        en: A request about tests/unit/test_order.sql includes the rules of copilot-instructions.md.
        fr: Une requête sur tests/unit/test_order.sql inclut les règles de copilot-instructions.md.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The applyTo glob is evaluated from the workspace root: `tests/**/*.sql` matches .sql files at any depth under tests, such as tests/integration/orders/test_ship.sql, but not src/procedures/usp_GetOrder.sql. The repository-wide copilot-instructions.md file applies to every request in the repository, including those about test scripts.
    fr: |
      Le glob applyTo est évalué depuis la racine de l'espace de travail : `tests/**/*.sql` correspond aux fichiers .sql de n'importe quelle profondeur sous tests, comme tests/integration/orders/test_ship.sql, mais pas à src/procedures/usp_GetOrder.sql. Le fichier copilot-instructions.md de niveau dépôt s'applique à toutes les requêtes du dépôt, y compris celles qui portent sur des scripts de test.
  options:
    s1: { en: "src/procedures/usp_GetOrder.sql isn't under tests, so the glob doesn't match it.", fr: "src/procedures/usp_GetOrder.sql n'est pas sous tests : le glob ne lui correspond pas." }
references:
  - title: "Quickstart: Use custom instructions to align GitHub Copilot with your T-SQL conventions"
    url: https://learn.microsoft.com/en-us/sql/tools/visual-studio-code-extensions/github-copilot/custom-instructions
