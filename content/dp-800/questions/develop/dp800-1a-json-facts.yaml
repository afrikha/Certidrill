id: dp800-1a-json-facts
objective: "1.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind has an Azure SQL database that contains a table named **dbo.Events**. The table has a column named **Payload** of the json data type.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une base de données Azure SQL qui contient une table nommée **dbo.Events**. La table a une colonne nommée **Payload** de type de données json.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can insert the value 'true' into Payload.
        fr: Vous pouvez insérer la valeur 'true' dans Payload.
    - id: s2
      text:
        en: Payload can be an included column of a nonclustered index.
        fr: Payload peut être une colonne incluse d'un index non cluster.
    - id: s3
      text:
        en: Payload can be the key column of a nonclustered index.
        fr: Payload peut être la colonne clé d'un index non cluster.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A json value must be a JSON object or array: scalars such as 'true', '"contoso"' or 'null' are rejected, although a SQL NULL is allowed. A json column can be an included column of an index or appear in a filtered index's WHERE clause, but it can't be an index key column; values inside it are indexed with CREATE JSON INDEX.
    fr: |
      Une valeur json doit être un objet ou un tableau JSON : les valeurs scalaires comme 'true', '"contoso"' ou 'null' sont rejetées, mais un NULL SQL est autorisé. Une colonne json peut être une colonne incluse d'un index ou apparaître dans la clause WHERE d'un index filtré, mais elle ne peut pas être une colonne clé d'index ; les valeurs qu'elle contient s'indexent avec CREATE JSON INDEX.
references:
  - title: JSON data type
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/json-data-type
