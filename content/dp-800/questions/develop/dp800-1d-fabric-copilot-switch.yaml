id: dp800-1d-fabric-copilot-switch
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Fabric F64 capacity in the East US region. Last year, a Fabric administrator turned off several Copilot tenant settings. The settings aren't delegated to capacity administrators.

    Developers now need Copilot in the query editor of a SQL database in Fabric. The solution must enable only what is required.

    Which tenant setting should the Fabric administrator enable?
  fr: |
    Contoso dispose d'une capacité Microsoft Fabric F64 dans la région East US. L'année dernière, un administrateur Fabric a désactivé plusieurs paramètres du locataire liés à Copilot. Ces paramètres ne sont pas délégués aux administrateurs de capacité.

    Les développeurs ont maintenant besoin de Copilot dans l'éditeur de requête d'une base de données SQL dans Fabric. La solution doit activer uniquement ce qui est nécessaire.

    Quel paramètre du locataire l'administrateur Fabric doit-il activer ?
body:
  options:
    - { id: a, text: "Users can use Copilot and other features powered by Azure OpenAI" }
    - { id: b, text: "Data sent to Azure OpenAI can be processed outside your capacity's geographic region, compliance boundary, or national cloud instance" }
    - { id: c, text: "Capacities can be designated as Copilot in Fabric capacities" }
    - { id: d, text: "Users can use Copilot, AI Agents and other AI experiences powered by OpenAI as a Microsoft Subprocessor" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Users can use Copilot and other features powered by Azure OpenAI is the main switch for Copilot in Fabric, for the organization or for specific security groups. An F64 capacity in East US meets the capacity and region requirements, so no other setting is needed.
    fr: |
      Users can use Copilot and other features powered by Azure OpenAI est l'interrupteur principal de Copilot dans Fabric, pour l'organisation ou pour des groupes de sécurité spécifiques. Une capacité F64 dans East US satisfait les exigences de capacité et de région : aucun autre paramètre n'est nécessaire.
  options:
    b: { en: "Cross-geo processing is needed only when the capacity is outside the regions where Copilot requests are processed; East US is one of them.", fr: "Le traitement hors zone géographique n'est nécessaire que si la capacité est hors des régions où les requêtes Copilot sont traitées ; East US en fait partie." }
    c: { en: "This setting consolidates Copilot usage and billing on a designated capacity; it doesn't turn Copilot on.", fr: "Ce paramètre regroupe l'utilisation et la facturation de Copilot sur une capacité désignée ; il n'active pas Copilot." }
    d: { en: "This setting allows experiences that use OpenAI as a subprocessor; Copilot for SQL database relies on the Azure OpenAI setting.", fr: "Ce paramètre autorise les expériences qui utilisent OpenAI comme sous-traitant ; Copilot pour la base de données SQL dépend du paramètre Azure OpenAI." }
references:
  - title: Copilot and Agent admin settings
    url: https://learn.microsoft.com/en-us/fabric/admin/service-admin-portal-copilot
  - title: Enable and configure Copilot in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/copilot-enable-fabric
