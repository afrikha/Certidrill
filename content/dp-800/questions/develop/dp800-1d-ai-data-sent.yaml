id: dp800-1d-ai-data-sent
objective: "1.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's compliance officer asks which data AI-assisted tools send when developers work with the company's SQL databases.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le responsable de la conformité de Fabrikam demande quelles données les outils assistés par IA envoient quand les développeurs travaillent avec les bases de données SQL de l'entreprise.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: GitHub Copilot in SSMS retains prompts and responses after the chat session ends.
        fr: GitHub Copilot dans SSMS conserve les prompts et les réponses après la fin de la session de conversation.
    - id: s2
      text:
        en: When GitHub Copilot is connected to a database, schema information can be sent to the model with the prompt.
        fr: Quand GitHub Copilot est connecté à une base de données, des informations de schéma peuvent être envoyées au modèle avec le prompt.
    - id: s3
      text:
        en: Copilot in SQL database in Fabric reads the rows of your tables to generate Transact-SQL.
        fr: Copilot dans la base de données SQL de Fabric lit les lignes de vos tables pour générer du Transact-SQL.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      GitHub Copilot in SSMS doesn't retain prompts, responses or system metadata, and prompts aren't used to train the models. GitHub Copilot sends the code you edit, open files, your prompt and, when connected, database schema information. Copilot in SQL database in Fabric has access to the schema only (table and column names, primary and foreign keys), not to the data.
    fr: |
      GitHub Copilot dans SSMS ne conserve ni les prompts, ni les réponses, ni les métadonnées système, et les prompts ne servent pas à entraîner les modèles. GitHub Copilot envoie le code que vous modifiez, les fichiers ouverts, votre prompt et, une fois connecté, des informations de schéma de la base de données. Copilot dans la base de données SQL de Fabric n'a accès qu'au schéma (noms de tables et de colonnes, clés primaires et étrangères), pas aux données.
  options:
    s1: { en: "GitHub Copilot in SSMS doesn't retain prompts, responses or system metadata.", fr: "GitHub Copilot dans SSMS ne conserve ni les prompts, ni les réponses, ni les métadonnées système." }
    s3: { en: "Copilot for SQL database works from the schema only and has no access to the data.", fr: "Copilot pour la base de données SQL travaille uniquement à partir du schéma et n'a pas accès aux données." }
references:
  - title: What is GitHub Copilot in SQL Server Management Studio?
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/overview
  - title: What is Copilot in the SQL database in Fabric workload?
    url: https://learn.microsoft.com/en-us/fabric/database/sql/copilot
