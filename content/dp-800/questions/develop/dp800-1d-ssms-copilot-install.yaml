id: dp800-1d-ssms-copilot-install
objective: "1.4.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A database developer at Proseware has SQL Server Management Studio (SSMS) 22 installed without GitHub Copilot. The developer has a GitHub account with Copilot access.

    You need to enable GitHub Copilot Chat in SSMS for the developer.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un développeur de bases de données de Proseware a installé SQL Server Management Studio (SSMS) 22 sans GitHub Copilot. Le développeur dispose d'un compte GitHub avec un accès à Copilot.

    Vous devez activer GitHub Copilot Chat dans SSMS pour ce développeur.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: installer, text: { en: "Launch the Visual Studio Installer.", fr: "Lancer Visual Studio Installer." } }
    - { id: modify, text: { en: "Select Modify for the SSMS 22 installation.", fr: "Sélectionner Modify pour l'installation de SSMS 22." } }
    - { id: workload, text: { en: "On the Workloads tab, select AI Assistance, and then select Modify.", fr: "Dans l'onglet Workloads, sélectionner AI Assistance, puis Modify." } }
    - { id: signin, text: { en: "Select the GitHub Copilot badge, select Open Chat Window to Sign In, and sign in with the GitHub account.", fr: "Sélectionner le badge GitHub Copilot, sélectionner Open Chat Window to Sign In et se connecter avec le compte GitHub." } }
    - { id: vsext, text: { en: "In the Extensions view, install GitHub Copilot Chat.", fr: "Dans la vue Extensions, installer GitHub Copilot Chat." } }
    - { id: fabric, text: { en: "In the Fabric admin portal, enable Users can use Copilot and other features powered by Azure OpenAI.", fr: "Dans le portail d'administration Fabric, activer Users can use Copilot and other features powered by Azure OpenAI." } }
answer:
  sequence: [installer, modify, workload, signin]
explanation:
  correct:
    en: |
      GitHub Copilot in SSMS 22 is installed as the AI Assistance workload: in the Visual Studio Installer, you modify the SSMS installation, select the workload and apply the change. You then sign in from the GitHub Copilot badge with an account that has Copilot access, and the status icon becomes active.
    fr: |
      Dans SSMS 22, GitHub Copilot s'installe sous forme de charge de travail AI Assistance : dans Visual Studio Installer, vous modifiez l'installation de SSMS, sélectionnez la charge de travail et appliquez la modification. Vous vous connectez ensuite depuis le badge GitHub Copilot avec un compte qui a accès à Copilot, et l'icône d'état devient active.
  options:
    vsext: { en: "The Extensions view and the GitHub Copilot Chat extension belong to Visual Studio Code, not SSMS.", fr: "La vue Extensions et l'extension GitHub Copilot Chat appartiennent à Visual Studio Code, pas à SSMS." }
    fabric: { en: "The Fabric tenant settings control Copilot in Fabric, not GitHub Copilot in SSMS.", fr: "Les paramètres du locataire Fabric contrôlent Copilot dans Fabric, pas GitHub Copilot dans SSMS." }
references:
  - title: Install GitHub Copilot in SQL Server Management Studio
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/installation-state
