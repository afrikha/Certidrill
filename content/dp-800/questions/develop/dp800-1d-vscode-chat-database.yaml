id: dp800-1d-vscode-chat-database
objective: "1.4.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A developer at Wingtip has Visual Studio Code with no extension installed and a GitHub account with Copilot access. The developer needs schema-aware GitHub Copilot Chat conversations about an Azure SQL database named sqldb-sales. No MCP server must be configured.

    Which four actions should the developer perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un développeur de Wingtip dispose de Visual Studio Code sans aucune extension installée et d'un compte GitHub avec un accès à Copilot. Le développeur a besoin de conversations GitHub Copilot Chat qui tiennent compte du schéma d'une base de données Azure SQL nommée sqldb-sales. Aucun serveur MCP ne doit être configuré.

    Quelles sont les quatre actions que le développeur doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: ext, text: { en: "Install the GitHub Copilot, GitHub Copilot Chat and SQL Server (mssql) extensions, and sign in to GitHub.", fr: "Installer les extensions GitHub Copilot, GitHub Copilot Chat et SQL Server (mssql), puis se connecter à GitHub." } }
    - { id: connect, text: { en: "Connect to sqldb-sales from the Connections view of the MSSQL extension.", fr: "Se connecter à sqldb-sales depuis la vue Connections de l'extension MSSQL." } }
    - { id: chat, text: { en: "Right-click sqldb-sales and select Chat with this database.", fr: "Cliquer avec le bouton droit sur sqldb-sales et sélectionner Chat with this database." } }
    - { id: consent, text: { en: "Allow the MSSQL extension to access the language models provided by GitHub Copilot Chat.", fr: "Autoriser l'extension MSSQL à accéder aux modèles de langage fournis par GitHub Copilot Chat." } }
    - { id: workload, text: { en: "In the Visual Studio Installer, add the AI Assistance workload.", fr: "Dans Visual Studio Installer, ajouter la charge de travail AI Assistance." } }
    - { id: mcpjson, text: { en: "Add sqldb-sales as an HTTP server in .vscode/mcp.json.", fr: "Ajouter sqldb-sales comme serveur HTTP dans .vscode/mcp.json." } }
answer:
  sequence: [ext, connect, chat, consent]
explanation:
  correct:
    en: |
      In Visual Studio Code, GitHub Copilot Chat and the MSSQL extension provide database chat: you connect to the database from the Connections view, then right-click it and select Chat with this database. The first time, you grant the MSSQL extension access to the language models of GitHub Copilot Chat, which the database-aware conversation requires.
    fr: |
      Dans Visual Studio Code, GitHub Copilot Chat et l'extension MSSQL fournissent la conversation avec la base de données : vous vous connectez à la base depuis la vue Connections, puis vous cliquez dessus avec le bouton droit et sélectionnez Chat with this database. La première fois, vous accordez à l'extension MSSQL l'accès aux modèles de langage de GitHub Copilot Chat, nécessaire à la conversation contextuelle.
  options:
    workload: { en: "The AI Assistance workload installs GitHub Copilot in SSMS, not in Visual Studio Code.", fr: "La charge de travail AI Assistance installe GitHub Copilot dans SSMS, pas dans Visual Studio Code." }
    mcpjson: { en: "Chat with this database needs no MCP server, and the requirement excludes one.", fr: "Chat with this database ne nécessite aucun serveur MCP, et l'exigence en exclut un." }
references:
  - title: Overview of GitHub Copilot Integration
    url: https://learn.microsoft.com/en-us/sql/tools/visual-studio-code-extensions/github-copilot/overview
  - title: Enable GitHub Copilot and Fabric Copilot
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/4-enable-github-copilot-fabric-copilot
