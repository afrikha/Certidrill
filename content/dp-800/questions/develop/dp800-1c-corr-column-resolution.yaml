id: dp800-1c-corr-column-resolution
objective: "1.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have the following tables.

    ```sql
    CREATE TABLE Sales.Product
        (ProductID int PRIMARY KEY, Name nvarchar(100));
    CREATE TABLE Sales.Discontinued
        (ItemID int PRIMARY KEY, DiscontinuedOn date);
    ```

    Sales.Product contains 4,000 rows, and Sales.Discontinued contains 12 rows whose ItemID values are product IDs. You run the following query to list the discontinued products.

    ```sql
    SELECT p.ProductID, p.Name
    FROM Sales.Product AS p
    WHERE p.ProductID IN (SELECT ProductID FROM Sales.Discontinued);
    ```

    The query runs without error but returns all 4,000 products.

    What should you do?
  fr: |
    Vous disposez des tables suivantes.

    ```sql
    CREATE TABLE Sales.Product
        (ProductID int PRIMARY KEY, Name nvarchar(100));
    CREATE TABLE Sales.Discontinued
        (ItemID int PRIMARY KEY, DiscontinuedOn date);
    ```

    Sales.Product contient 4 000 lignes, et Sales.Discontinued contient 12 lignes dont les valeurs ItemID sont des ID de produit. Vous exécutez la requête suivante pour lister les produits abandonnés.

    ```sql
    SELECT p.ProductID, p.Name
    FROM Sales.Product AS p
    WHERE p.ProductID IN (SELECT ProductID FROM Sales.Discontinued);
    ```

    La requête s'exécute sans erreur, mais renvoie les 4 000 produits.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the IN predicate with `EXISTS (SELECT 1 FROM Sales.Discontinued)`.", fr: "Remplacer le prédicat IN par `EXISTS (SELECT 1 FROM Sales.Discontinued)`." } }
    - { id: b, text: { en: "Add DISTINCT to the subquery.", fr: "Ajouter DISTINCT à la sous-requête." } }
    - { id: c, text: { en: "Change the subquery to `SELECT d.ItemID FROM Sales.Discontinued AS d`.", fr: "Remplacer la sous-requête par `SELECT d.ItemID FROM Sales.Discontinued AS d`." } }
    - { id: d, text: { en: "Add `WHERE ProductID IS NOT NULL` to the subquery.", fr: "Ajouter `WHERE ProductID IS NOT NULL` à la sous-requête." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Sales.Discontinued has no ProductID column, so the unqualified ProductID in the subquery is resolved to the outer table, p.ProductID. The subquery becomes correlated and returns the outer product ID for each of its 12 rows, so every product qualifies. Selecting the qualified d.ItemID returns the intended list; qualifying column names prevents this error.
    fr: |
      Sales.Discontinued n'a pas de colonne ProductID : le ProductID non qualifié de la sous-requête est donc résolu sur la table externe, p.ProductID. La sous-requête devient corrélée et renvoie l'ID du produit externe pour chacune de ses 12 lignes : chaque produit est retenu. Sélectionner la colonne qualifiée d.ItemID renvoie la liste voulue ; qualifier les noms de colonnes évite cette erreur.
  options:
    a: { en: "This EXISTS isn't correlated: it is true for every product as long as the table has rows.", fr: "Ce EXISTS n'est pas corrélé : il est vrai pour chaque produit tant que la table contient des lignes." }
    b: { en: "The subquery still returns the outer ProductID, so every product still matches.", fr: "La sous-requête renvoie toujours le ProductID externe : chaque produit correspond toujours." }
    d: { en: "ProductID still resolves to the outer column, which is never NULL, so nothing changes.", fr: "ProductID est toujours résolu sur la colonne externe, qui n'est jamais NULL : rien ne change." }
references:
  - title: Subqueries (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/subqueries
