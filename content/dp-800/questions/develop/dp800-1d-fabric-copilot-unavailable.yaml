id: dp800-1d-fabric-copilot-unavailable
objective: "1.4.2"
type: multi
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Adatum has four Microsoft Fabric workspaces that each contain a SQL database.

    | Workspace | Capacity | Region | Network configuration |
    | --- | --- | --- | --- |
    | WS-Sales | Fabric trial capacity | East US | Public access enabled |
    | WS-Ops | F64 | East US | Private Link enabled, public access disabled |
    | WS-Paris | F2 | France Central | Public access enabled |
    | WS-Fin | P1 | West US 2 | Public access enabled |

    The tenant setting Users can use Copilot and other features powered by Azure OpenAI is enabled for the entire organization. The cross-geo processing settings are disabled.

    In which two workspaces is the Copilot chat pane unavailable for the SQL database?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de quatre espaces de travail Microsoft Fabric qui contiennent chacun une base de données SQL.

    | Espace de travail | Capacité | Région | Configuration réseau |
    | --- | --- | --- | --- |
    | WS-Sales | Capacité d'évaluation Fabric | East US | Accès public activé |
    | WS-Ops | F64 | East US | Private Link activé, accès public désactivé |
    | WS-Paris | F2 | France Central | Accès public activé |
    | WS-Fin | P1 | West US 2 | Accès public activé |

    Le paramètre du locataire Users can use Copilot and other features powered by Azure OpenAI est activé pour toute l'organisation. Les paramètres de traitement hors zone géographique sont désactivés.

    Dans quels deux espaces de travail le volet de conversation Copilot n'est-il pas disponible pour la base de données SQL ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: sales, text: WS-Sales }
    - { id: ops, text: WS-Ops }
    - { id: paris, text: WS-Paris }
    - { id: fin, text: WS-Fin }
answer: { optionIds: [sales, ops] }
explanation:
  correct:
    en: |
      Copilot in SQL database requires a paid F2 or P1 capacity or higher; trial SKUs aren't supported, so WS-Sales has no Copilot. The chat pane isn't available when Private Link is enabled and public access is disabled, which excludes WS-Ops. WS-Paris and WS-Fin use paid capacities in France and the US, where no cross-geo setting is needed.
    fr: |
      Copilot dans la base de données SQL exige une capacité payante F2 ou P1 ou supérieure ; les références SKU d'évaluation ne sont pas prises en charge, donc WS-Sales n'a pas Copilot. Le volet de conversation n'est pas disponible quand Private Link est activé et l'accès public désactivé, ce qui exclut WS-Ops. WS-Paris et WS-Fin utilisent des capacités payantes en France et aux États-Unis, où aucun paramètre hors zone géographique n'est nécessaire.
  options:
    paris: { en: "F2 is the minimum supported capacity, and capacities in France don't need the cross-geo processing setting.", fr: "F2 est la capacité minimale prise en charge, et les capacités situées en France n'ont pas besoin du paramètre de traitement hors zone géographique." }
    fin: { en: "A P1 capacity or higher is supported, and West US 2 is in the US.", fr: "Une capacité P1 ou supérieure est prise en charge, et West US 2 se trouve aux États-Unis." }
references:
  - title: What is Copilot in the SQL database in Fabric workload?
    url: https://learn.microsoft.com/en-us/fabric/database/sql/copilot
