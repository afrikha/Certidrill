id: dp800-1c-fuzzy-one-edit
objective: "1.3.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2025 database in which the PREVIEW_FEATURES database scoped configuration is set to ON. A table named **Inventory.Part** has a varchar(20) column named PartCode that uses a Windows collation.

    You need to return the parts whose PartCode differs from `TX-4410` by at most one insertion, deletion, substitution or transposition.

    Which two predicates can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données SQL Server 2025 dans laquelle la configuration délimitée à la base de données PREVIEW_FEATURES est définie sur ON. Une table nommée **Inventory.Part** contient une colonne varchar(20) nommée PartCode qui utilise un classement Windows.

    Vous devez renvoyer les pièces dont la valeur PartCode diffère de `TX-4410` d'au plus une insertion, suppression, substitution ou transposition.

    Quels sont les deux prédicats que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`EDIT_DISTANCE(PartCode, 'TX-4410') <= 1`" }
    - { id: b, text: "`EDIT_DISTANCE(PartCode, 'TX-4410') >= 1`" }
    - { id: c, text: "`EDIT_DISTANCE(PartCode, 'TX-4410', 1) <= 1`" }
    - { id: d, text: "`EDIT_DISTANCE_SIMILARITY(PartCode, 'TX-4410') <= 1`" }
    - { id: e, text: "`JARO_WINKLER_DISTANCE(PartCode, 'TX-4410') <= 1`" }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      EDIT_DISTANCE returns the minimum number of insertions, deletions, substitutions and transpositions, so <= 1 keeps codes within one edit. With maximum_distance 1, the function returns the actual distance when it's 0 or 1 and returns 2 otherwise, so <= 1 gives the same rows while letting the computation stop early.
    fr: |
      EDIT_DISTANCE renvoie le nombre minimal d'insertions, suppressions, substitutions et transpositions : <= 1 conserve donc les codes à une modification ou moins. Avec maximum_distance à 1, la fonction renvoie la distance réelle quand elle vaut 0 ou 1, et 2 sinon : <= 1 donne les mêmes lignes tout en permettant au calcul de s'arrêter tôt.
  options:
    b: { en: ">= 1 keeps every code except TX-4410 itself.", fr: ">= 1 conserve tous les codes sauf TX-4410 lui-même." }
    d: { en: "EDIT_DISTANCE_SIMILARITY returns 100 for identical strings; <= 1 keeps the least similar codes.", fr: "EDIT_DISTANCE_SIMILARITY renvoie 100 pour des chaînes identiques ; <= 1 conserve les codes les moins semblables." }
    e: { en: "JARO_WINKLER_DISTANCE returns a float distance, not a number of edits, so a threshold of 1 doesn't mean one edit.", fr: "JARO_WINKLER_DISTANCE renvoie une distance de type float, pas un nombre de modifications : un seuil de 1 ne signifie pas une modification." }
references:
  - title: EDIT_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/edit-distance-transact-sql
