stem:
  en: You create an AFTER UPDATE trigger that reads the old and new salary into variables.
  fr: Vous créez un déclencheur AFTER UPDATE qui lit l'ancien et le nouveau salaire dans des variables.
body:
  solution:
    en: |
      You create the following trigger.

      ```sql
      CREATE TRIGGER HR.trg_Employees_Salary ON HR.Employees
      AFTER UPDATE
      AS
      BEGIN
          SET NOCOUNT ON;
          DECLARE @id int, @old decimal(10, 2), @new decimal(10, 2);
          SELECT @id = EmployeeID, @old = Salary FROM deleted;
          SELECT @new = Salary FROM inserted WHERE EmployeeID = @id;
          IF @old <> @new
              INSERT INTO HR.SalaryHistory (EmployeeID, OldSalary, NewSalary)
              VALUES (@id, @old, @new);
      END;
      ```
    fr: |
      Vous créez le déclencheur suivant.

      ```sql
      CREATE TRIGGER HR.trg_Employees_Salary ON HR.Employees
      AFTER UPDATE
      AS
      BEGIN
          SET NOCOUNT ON;
          DECLARE @id int, @old decimal(10, 2), @new decimal(10, 2);
          SELECT @id = EmployeeID, @old = Salary FROM deleted;
          SELECT @new = Salary FROM inserted WHERE EmployeeID = @id;
          IF @old <> @new
              INSERT INTO HR.SalaryHistory (EmployeeID, OldSalary, NewSalary)
              VALUES (@id, @old, @new);
      END;
      ```
answer: { value: false }
explanation:
  correct:
    en: A DML trigger runs once per statement, and the deleted and inserted tables then contain every row changed by that statement. Assigning their columns to scalar variables keeps the values of only one row, so the yearly UPDATE would write a single history row instead of one per employee. Trigger logic must be set-based and join deleted and inserted on the key.
    fr: "Un déclencheur DML s'exécute une fois par instruction, et les tables deleted et inserted contiennent alors toutes les lignes modifiées par cette instruction. Affecter leurs colonnes à des variables scalaires ne conserve les valeurs que d'une seule ligne : l'UPDATE annuel n'écrirait qu'une ligne d'historique au lieu d'une par employé. La logique d'un déclencheur doit être ensembliste et joindre deleted et inserted sur la clé."
references:
  - title: Use the inserted and deleted tables
