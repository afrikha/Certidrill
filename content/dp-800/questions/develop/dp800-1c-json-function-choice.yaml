id: dp800-1c-json-function-choice
objective: "1.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A table named **Sales.WebOrder** has an nvarchar(max) column named Payload that stores documents such as the following one.

    ```json
    {"status":"new",
     "customer":{"email":"ana@contoso.com","address":{"city":"Lyon","zip":"69002"}},
     "lines":[{"sku":"TX-1","qty":3},{"sku":"TX-9","qty":1}]}
    ```

    Which JSON function should you use for each requirement? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une table nommée **Sales.WebOrder** contient une colonne nvarchar(max) nommée Payload qui stocke des documents comme le suivant.

    ```json
    {"status":"new",
     "customer":{"email":"ana@contoso.com","address":{"city":"Lyon","zip":"69002"}},
     "lines":[{"sku":"TX-1","qty":3},{"sku":"TX-9","qty":1}]}
    ```

    Quelle fonction JSON devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: value, text: "JSON_VALUE" }
    - { id: query, text: "JSON_QUERY" }
    - { id: openjson, text: "OPENJSON" }
    - { id: modify, text: "JSON_MODIFY" }
    - { id: isjson, text: "ISJSON" }
    - { id: arrayagg, text: "JSON_ARRAYAGG" }
  targets:
    - id: t1
      text: { en: "Return the customer's email address as a scalar value", fr: "Renvoyer l'adresse e-mail du client sous forme de valeur scalaire" }
    - id: t2
      text: { en: "Return the customer's address object as JSON text", fr: "Renvoyer l'objet address du client sous forme de texte JSON" }
    - id: t3
      text: { en: "Return one row for each element of the lines array", fr: "Renvoyer une ligne pour chaque élément du tableau lines" }
    - id: t4
      text: { en: "Change the value of status to shipped in the stored document", fr: "Remplacer la valeur de status par shipped dans le document stocké" }
answer:
  mapping: { t1: value, t2: query, t3: openjson, t4: modify }
explanation:
  correct:
    en: |
      JSON_VALUE extracts a scalar, and JSON_QUERY extracts an object or an array as JSON text. OPENJSON is a table-valued function that returns one row per element of the array its path points to. JSON_MODIFY returns the document with the property updated, for use in an UPDATE statement. ISJSON only tests whether a string contains valid JSON, and JSON_ARRAYAGG builds an array from rows.
    fr: |
      JSON_VALUE extrait une valeur scalaire, et JSON_QUERY extrait un objet ou un tableau sous forme de texte JSON. OPENJSON est une fonction table qui renvoie une ligne par élément du tableau désigné par son chemin. JSON_MODIFY renvoie le document avec la propriété modifiée, pour une instruction UPDATE. ISJSON teste seulement si une chaîne contient du JSON valide, et JSON_ARRAYAGG construit un tableau à partir de lignes.
references:
  - title: JSON_MODIFY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-modify-transact-sql
  - title: JSON_VALUE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-value-transact-sql
