id: dp800-1c-graph-shortest-statements
objective: "1.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a node table named **Air.Airport** and an edge table named **Air.FlightTo**. Air.FlightTo has a column named Distance. You plan to use SHORTEST_PATH to find routes between airports.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table de nœuds nommée **Air.Airport** et une table d'arêtes nommée **Air.FlightTo**. Air.FlightTo contient une colonne nommée Distance. Vous prévoyez d'utiliser SHORTEST_PATH pour trouver des itinéraires entre aéroports.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The + quantifier repeats the pattern one or more times and stops as soon as a shortest path is found.
        fr: |
          Le quantificateur + répète le modèle une ou plusieurs fois et s'arrête dès qu'un plus court chemin est trouvé.
    - id: s2
      text:
        en: |
          When several shortest paths of the same length exist between two airports, SHORTEST_PATH returns all of them.
        fr: |
          Quand plusieurs plus courts chemins de même longueur existent entre deux aéroports, SHORTEST_PATH les renvoie tous.
    - id: s3
      text:
        en: |
          SHORTEST_PATH finds unweighted shortest paths, so the Distance values aren't used to choose the route.
        fr: |
          SHORTEST_PATH trouve des plus courts chemins non pondérés : les valeurs Distance ne sont donc pas utilisées pour choisir l'itinéraire.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The + quantifier repeats the pattern one or more times and terminates as soon as a shortest path is found. SHORTEST_PATH returns any one shortest path, the first one found during the traversal, and doesn't return all shortest paths. The implementation finds an unweighted shortest path, measured in hops, so edge attributes such as Distance don't influence it.
    fr: |
      Le quantificateur + répète le modèle une ou plusieurs fois et s'arrête dès qu'un plus court chemin est trouvé. SHORTEST_PATH renvoie un seul plus court chemin, le premier trouvé pendant le parcours, et ne renvoie pas tous les plus courts chemins. L'implémentation trouve un plus court chemin non pondéré, mesuré en sauts : les attributs d'arête comme Distance ne l'influencent pas.
references:
  - title: SHORTEST_PATH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/graphs/sql-graph-shortest-path
