id: dp800-1b-tvf-outer-apply
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database for Proseware. A table-valued function named HR.ufn_DirectReports takes a manager ID and returns the employees who report to that manager.

    You need to list every department with the direct reports of its manager. Departments whose manager has no direct reports must appear in the result with NULL values in the employee columns.

    Which operator should you use between HR.Department and HR.ufn_DirectReports(d.ManagerID)?
  fr: |
    Vous disposez d'une base de données Azure SQL pour Proseware. Une fonction table nommée HR.ufn_DirectReports prend un ID de responsable et renvoie les employés qui dépendent de ce responsable.

    Vous devez lister chaque service avec les subordonnés directs de son responsable. Les services dont le responsable n'a aucun subordonné direct doivent apparaître dans le résultat avec des valeurs NULL dans les colonnes des employés.

    Quel opérateur devez-vous utiliser entre HR.Department et HR.ufn_DirectReports(d.ManagerID) ?
body:
  options:
    - { id: a, text: CROSS APPLY }
    - { id: b, text: LEFT OUTER JOIN }
    - { id: c, text: OUTER APPLY }
    - { id: d, text: FULL OUTER JOIN }
answer: { optionId: c }
explanation:
  correct:
    en: |
      OUTER APPLY evaluates the function for each department row, passing d.ManagerID, and produces one row for the department even when the function returns an empty result set; the function's columns are then NULL.
    fr: |
      OUTER APPLY évalue la fonction pour chaque ligne de service, en passant d.ManagerID, et produit une ligne pour le service même quand la fonction renvoie un jeu de résultats vide ; les colonnes de la fonction sont alors NULL.
  options:
    a: { en: "CROSS APPLY returns no row for a department whose manager has no direct reports.", fr: "CROSS APPLY ne renvoie aucune ligne pour un service dont le responsable n'a aucun subordonné direct." }
    b: { en: "A join cannot pass d.ManagerID, a column of the other table source, as the function argument; that correlation requires APPLY.", fr: "Une jointure ne peut pas passer d.ManagerID, une colonne de l'autre source de table, comme argument de la fonction ; cette corrélation exige APPLY." }
    d: { en: "A FULL OUTER JOIN cannot pass a column of the department table as the function argument either.", fr: "Une jointure FULL OUTER JOIN ne peut pas non plus passer une colonne de la table des services comme argument de la fonction." }
references:
  - title: FROM clause plus JOIN, APPLY, PIVOT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/from-transact-sql
