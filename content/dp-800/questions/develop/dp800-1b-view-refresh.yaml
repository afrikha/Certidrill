id: dp800-1b-view-refresh
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named Production.Product and the following view.

    ```sql
    CREATE VIEW Production.vProduct
    AS
    SELECT * FROM Production.Product;
    ```

    You add a column named Weight to Production.Product. Queries on Production.vProduct do not return the Weight column.

    You need to update the metadata of the view so that it returns the new column. The solution must not change the view definition.

    What should you run?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée Production.Product et la vue suivante.

    ```sql
    CREATE VIEW Production.vProduct
    AS
    SELECT * FROM Production.Product;
    ```

    Vous ajoutez une colonne nommée Weight à Production.Product. Les requêtes sur Production.vProduct ne renvoient pas la colonne Weight.

    Vous devez mettre à jour les métadonnées de la vue pour qu'elle renvoie la nouvelle colonne. La solution ne doit pas modifier la définition de la vue.

    Que devez-vous exécuter ?
body:
  options:
    - { id: a, text: "EXECUTE sp_refreshview N'Production.vProduct';" }
    - { id: b, text: "EXECUTE sp_recompile N'Production.vProduct';" }
    - { id: c, text: "UPDATE STATISTICS Production.Product;" }
    - { id: d, text: "DBCC FREEPROCCACHE;" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      sp_refreshview updates the persistent metadata of a view that is not schema-bound after a change to its underlying objects. A view created with SELECT * keeps the column list it had when it was created, so it returns the Weight column only after its metadata is refreshed.
    fr: |
      sp_refreshview met à jour les métadonnées persistantes d'une vue non liée au schéma après une modification de ses objets sous-jacents. Une vue créée avec SELECT * conserve la liste de colonnes qu'elle avait à sa création : elle ne renvoie la colonne Weight qu'après l'actualisation de ses métadonnées.
  options:
    b: { en: "sp_recompile only marks the modules that reference the object for recompilation at their next run; it does not refresh the column list of the view.", fr: "sp_recompile marque seulement les modules qui référencent l'objet pour qu'ils soient recompilés à leur prochaine exécution ; il n'actualise pas la liste de colonnes de la vue." }
    c: { en: "Updating statistics changes the optimizer's information about data distribution, not the metadata of the view.", fr: "La mise à jour des statistiques modifie les informations de l'optimiseur sur la distribution des données, pas les métadonnées de la vue." }
    d: { en: "Clearing the plan cache forces new plans but does not change the persistent column list stored for the view.", fr: "Vider le cache des plans force de nouveaux plans mais ne modifie pas la liste de colonnes persistante stockée pour la vue." }
references:
  - title: sys.sp_refreshview (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-refreshview-transact-sql
