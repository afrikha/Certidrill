id: dp800-1a-seq-shared
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove stores invoices in a table named **Billing.Invoice** and credit notes in a table named **Billing.CreditNote**. Both tables have an integer column named **DocumentNo**.

    Document numbers must come from a single increasing series shared by the two tables, so that an invoice and a credit note never receive the same number. Numbers must be assigned automatically when a row is inserted.

    What should you use?
  fr: |
    Woodgrove stocke les factures dans une table nommée **Billing.Invoice** et les avoirs dans une table nommée **Billing.CreditNote**. Les deux tables ont une colonne entière nommée **DocumentNo**.

    Les numéros de document doivent provenir d'une seule série croissante partagée par les deux tables, afin qu'une facture et un avoir ne reçoivent jamais le même numéro. Les numéros doivent être attribués automatiquement lors de l'insertion d'une ligne.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An IDENTITY property on DocumentNo in each table", fr: "Une propriété IDENTITY sur DocumentNo dans chaque table" } }
    - { id: b, text: { en: "A sequence referenced by a DEFAULT constraint on DocumentNo in each table", fr: "Une séquence référencée par une contrainte DEFAULT sur DocumentNo dans chaque table" } }
    - { id: c, text: { en: "A DEFAULT constraint that uses NEWSEQUENTIALID() in each table", fr: "Une contrainte DEFAULT qui utilise NEWSEQUENTIALID() dans chaque table" } }
    - { id: d, text: { en: "A view that numbers the rows of both tables with ROW_NUMBER()", fr: "Une vue qui numérote les lignes des deux tables avec ROW_NUMBER()" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A sequence is a schema-bound object that isn't tied to any table, so one series of numbers can be shared by several tables. A DEFAULT (NEXT VALUE FOR ...) constraint on each table assigns the next number automatically at insert time.
    fr: |
      Une séquence est un objet lié au schéma qui n'est associé à aucune table : une même série de numéros peut donc être partagée par plusieurs tables. Une contrainte DEFAULT (NEXT VALUE FOR ...) sur chaque table attribue automatiquement le numéro suivant lors de l'insertion.
  options:
    a: { en: "Each IDENTITY column has its own counter, so both tables would generate the same numbers.", fr: "Chaque colonne IDENTITY a son propre compteur : les deux tables généreraient les mêmes numéros." }
    c: { en: "NEWSEQUENTIALID() generates uniqueidentifier values, not integer document numbers.", fr: "NEWSEQUENTIALID() génère des valeurs uniqueidentifier, pas des numéros de document entiers." }
    d: { en: "ROW_NUMBER() computes numbers at query time; they aren't stored and change when rows are added.", fr: "ROW_NUMBER() calcule des numéros au moment de la requête ; ils ne sont pas stockés et changent quand des lignes sont ajoutées." }
references:
  - title: Sequence Numbers
    url: https://learn.microsoft.com/en-us/sql/relational-databases/sequence-numbers/sequence-numbers
