id: dp800-1c-win-share-of-total
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a table named **Sales.Orders** that has the columns OrderID, CustomerID, OrderDate and Amount (decimal(10, 2)).

    You write the following query.

    ```sql
    SELECT OrderID, CustomerID, Amount,
           <expression> AS ShareOfCustomer
    FROM Sales.Orders;
    ```

    ShareOfCustomer must return the Amount of the order as a percentage of the total Amount of all the orders of the same customer.

    Which two expressions can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une table nommée **Sales.Orders** qui contient les colonnes OrderID, CustomerID, OrderDate et Amount (decimal(10, 2)).

    Vous écrivez la requête suivante.

    ```sql
    SELECT OrderID, CustomerID, Amount,
           <expression> AS ShareOfCustomer
    FROM Sales.Orders;
    ```

    ShareOfCustomer doit renvoyer le montant Amount de la commande en pourcentage du montant total de toutes les commandes du même client.

    Quelles sont les deux expressions que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`Amount * 100.0 / SUM(Amount) OVER (PARTITION BY CustomerID)`" }
    - { id: b, text: "`Amount * 100.0 / SUM(Amount) OVER (PARTITION BY CustomerID ORDER BY OrderDate)`" }
    - { id: c, text: "`Amount * 100.0 / SUM(Amount) OVER ()`" }
    - { id: d, text: "`Amount * 100.0 / SUM(DISTINCT Amount) OVER (PARTITION BY CustomerID)`" }
    - { id: e, text: "`Amount * 100.0 / SUM(Amount) OVER (PARTITION BY CustomerID ORDER BY OrderDate ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)`" }
answer: { optionIds: [a, e] }
explanation:
  correct:
    en: |
      Without ORDER BY, an aggregate window function covers the whole partition, so SUM(Amount) OVER (PARTITION BY CustomerID) is the customer total on every row. With ORDER BY, the frame defaults to the rows up to the current row, unless you extend it explicitly to UNBOUNDED FOLLOWING, which again covers the whole partition.
    fr: |
      Sans ORDER BY, une fonction d'agrégat de fenêtre couvre toute la partition : SUM(Amount) OVER (PARTITION BY CustomerID) est le total du client sur chaque ligne. Avec ORDER BY, le cadre par défaut s'arrête à la ligne courante, sauf si vous l'étendez explicitement jusqu'à UNBOUNDED FOLLOWING, ce qui couvre de nouveau toute la partition.
  options:
    b: { en: "With ORDER BY and no frame, the default frame ends at the current row: the result is a running total, not the customer total.", fr: "Avec ORDER BY et sans cadre, le cadre par défaut se termine à la ligne courante : le résultat est un cumul, pas le total du client." }
    c: { en: "OVER () sums all the orders of all customers.", fr: "OVER () additionne toutes les commandes de tous les clients." }
    d: { en: "The OVER clause can't be used with DISTINCT aggregates; the statement fails.", fr: "La clause OVER ne peut pas être utilisée avec des agrégats DISTINCT ; l'instruction échoue." }
references:
  - title: SELECT - OVER clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-over-clause-transact-sql
