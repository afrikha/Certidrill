id: dp800-1a-graph-ddl
objective: "1.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso wants to model its reporting hierarchy as a graph in an Azure SQL database. Each employee is a node, and a ReportsTo relationship connects an employee to a manager, who is also an employee. Queries traverse the relationship from employee to manager.

    How should you complete the Transact-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso souhaite modéliser sous forme de graphe sa chaîne hiérarchique dans une base de données Azure SQL. Chaque employé est un nœud, et une relation ReportsTo relie un employé à son responsable, qui est lui aussi un employé. Les requêtes parcourent la relation de l'employé vers le responsable.

    Comment devez-vous compléter les instructions Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE Graph.Employee
    (
        EmployeeID int NOT NULL PRIMARY KEY,
        FullName   nvarchar(100) NOT NULL
    ) AS [[n]];

    CREATE TABLE Graph.ReportsTo
    (
        SinceDate date NULL,
        CONSTRAINT EC_ReportsTo CONNECTION (Graph.Employee TO Graph.Employee)
    ) AS [[e]];

    CREATE INDEX IX_ReportsTo_FromTo
        ON Graph.ReportsTo ([[cols]]);
  slots:
    - id: n
      options:
        - { id: node, text: NODE }
        - { id: edge, text: EDGE }
        - { id: ft, text: FILETABLE }
    - id: e
      options:
        - { id: node, text: NODE }
        - { id: edge, text: EDGE }
        - { id: ft, text: FILETABLE }
    - id: cols
      options:
        - { id: fromto, text: "$from_id, $to_id" }
        - { id: nodeid, text: $node_id }
        - { id: edgeid, text: $edge_id }
        - { id: empid, text: EmployeeID }
answer:
  values: { n: node, e: edge, cols: fromto }
explanation:
  correct:
    en: |
      Entities are node tables (AS NODE) and relationships are edge tables (AS EDGE); an edge constraint restricts the edge to Employee-to-Employee connections. Every edge stores the $node_id of its origin in $from_id and of its destination in $to_id. Neither SQL Server nor the edge constraint creates an index on these columns, and Microsoft recommends an index on ($from_id, $to_id) for lookups in the direction of the edge.
    fr: |
      Les entités sont des tables de nœuds (AS NODE) et les relations des tables d'arêtes (AS EDGE) ; une contrainte d'arête limite l'arête aux connexions Employee vers Employee. Chaque arête stocke le $node_id de son origine dans $from_id et celui de sa destination dans $to_id. Ni SQL Server ni la contrainte d'arête ne créent d'index sur ces colonnes, et Microsoft recommande un index sur ($from_id, $to_id) pour les recherches dans le sens de l'arête.
  options:
    ft: { en: "AS FILETABLE creates a table that stores files and folders, not graph objects.", fr: "AS FILETABLE crée une table qui stocke des fichiers et des dossiers, pas des objets de graphe." }
    nodeid: { en: "$node_id exists only in node tables.", fr: "$node_id n'existe que dans les tables de nœuds." }
    edgeid: { en: "$edge_id already gets a unique index by default and doesn't help traversal from a given node.", fr: "$edge_id reçoit déjà un index unique par défaut et n'aide pas le parcours à partir d'un nœud donné." }
    empid: { en: "EmployeeID is a column of the node table, not of the edge table.", fr: "EmployeeID est une colonne de la table de nœuds, pas de la table d'arêtes." }
references:
  - title: SQL Graph Architecture
    url: https://learn.microsoft.com/en-us/sql/relational-databases/graphs/sql-graph-architecture
  - title: Edge constraints
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/graph-edge-constraints
