id: dp800-1b-proc-set-options
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are writing a stored procedure named Sales.usp_TransferStock in an Azure SQL database. The procedure runs two UPDATE statements and one INSERT statement inside an explicit transaction and has no TRY...CATCH block.

    The procedure must meet the following requirements:

    - The client must not receive the messages that report the number of rows affected by each statement.
    - If any statement raises a run-time error, the entire transaction must be rolled back.

    Which two statements should you add at the beginning of the procedure body? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une procédure stockée nommée Sales.usp_TransferStock dans une base de données Azure SQL. La procédure exécute deux instructions UPDATE et une instruction INSERT dans une transaction explicite et ne comporte aucun bloc TRY...CATCH.

    La procédure doit satisfaire les exigences suivantes :

    - Le client ne doit pas recevoir les messages qui indiquent le nombre de lignes affectées par chaque instruction.
    - Si une instruction déclenche une erreur d'exécution, toute la transaction doit être restaurée.

    Quelles sont les deux instructions à ajouter au début du corps de la procédure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "SET IMPLICIT_TRANSACTIONS ON;" }
    - { id: b, text: "SET XACT_ABORT ON;" }
    - { id: c, text: "SET ANSI_WARNINGS OFF;" }
    - { id: d, text: "SET NOCOUNT ON;" }
    - { id: e, text: "SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      SET NOCOUNT ON suppresses the messages that report the number of rows affected by each statement. When SET XACT_ABORT is ON, a run-time error in any statement terminates and rolls back the entire transaction; with the default OFF, in some cases only the failing statement is rolled back and the transaction continues.
    fr: |
      SET NOCOUNT ON supprime les messages qui indiquent le nombre de lignes affectées par chaque instruction. Quand SET XACT_ABORT est ON, une erreur d'exécution dans une instruction met fin à toute la transaction et la restaure ; avec la valeur par défaut OFF, dans certains cas seule l'instruction en échec est restaurée et la transaction continue.
  options:
    a: { en: "Implicit transactions start a transaction automatically; they do not roll back the transaction when a statement fails.", fr: "Les transactions implicites démarrent automatiquement une transaction ; elles ne restaurent pas la transaction quand une instruction échoue." }
    c: { en: "Turning ANSI_WARNINGS off changes how some errors and warnings are reported; it does not roll back the transaction.", fr: "Désactiver ANSI_WARNINGS change la façon dont certaines erreurs et certains avertissements sont signalés ; cela ne restaure pas la transaction." }
    e: { en: "SERIALIZABLE controls locking and concurrency; it does not roll back the transaction after an error.", fr: "SERIALIZABLE contrôle le verrouillage et l'accès concurrentiel ; il ne restaure pas la transaction après une erreur." }
references:
