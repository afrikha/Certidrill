id: dp800-sr2-errors-3
objective: "1.3.8"
type: series_yesno
series: dp800-sr2-place-order-errors
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You roll back the transaction in the CATCH block and run THROW without parameters.
  fr: Vous restaurez la transaction dans le bloc CATCH et exécutez THROW sans paramètres.
body:
  solution:
    en: |
      You write the procedure body as follows.

      ```sql
      SET XACT_ABORT ON;
      BEGIN TRY
          BEGIN TRANSACTION;
          -- INSERT INTO Sales.Orders ...
          -- INSERT INTO Sales.OrderLines ...
          COMMIT TRANSACTION;
      END TRY
      BEGIN CATCH
          IF XACT_STATE() <> 0 ROLLBACK TRANSACTION;
          THROW;
      END CATCH;
      ```
    fr: |
      Vous écrivez le corps de la procédure comme suit.

      ```sql
      SET XACT_ABORT ON;
      BEGIN TRY
          BEGIN TRANSACTION;
          -- INSERT INTO Sales.Orders ...
          -- INSERT INTO Sales.OrderLines ...
          COMMIT TRANSACTION;
      END TRY
      BEGIN CATCH
          IF XACT_STATE() <> 0 ROLLBACK TRANSACTION;
          THROW;
      END CATCH;
      ```
answer: { value: true }
explanation:
  correct:
    en: A run-time error such as 547 inside the TRY block transfers control to the CATCH block, which rolls back the open transaction, committable or not, so no inserted row remains. THROW without parameters, allowed only inside a CATCH block, re-raises the caught error with its original number and message. The ROLLBACK statement ends with a semicolon, as THROW requires of the statement before it.
    fr: "Une erreur d'exécution comme 547 dans le bloc TRY transfère le contrôle au bloc CATCH, qui restaure la transaction ouverte, validable ou non : aucune ligne insérée ne reste. THROW sans paramètres, autorisé uniquement dans un bloc CATCH, redéclenche l'erreur interceptée avec son numéro et son message d'origine. L'instruction ROLLBACK se termine par un point-virgule, comme THROW l'exige de l'instruction qui le précède."
references:
  - title: THROW (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/throw-transact-sql
  - title: TRY...CATCH (Transact-SQL)
