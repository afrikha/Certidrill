id: dp800-1b-sfn-inline-scope
objective: "1.2.2"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    You manage an Azure SQL database for Woodgrove Bank. The database uses compatibility level 160, and scalar UDF inlining is enabled. After a release, three performance issues are linked to inlined scalar functions. Every other feature of compatibility level 160 must stay enabled.

    Which option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez une base de données Azure SQL pour Woodgrove Bank. La base utilise le niveau de compatibilité 160 et l'incorporation des UDF scalaires est activée. Après une mise en production, trois problèmes de performances sont liés à des fonctions scalaires incorporées. Toutes les autres fonctionnalités du niveau de compatibilité 160 doivent rester activées.

    Quelle option devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: inlineoff, text: "WITH INLINE = OFF in the function definition" }
    - { id: dsc, text: "ALTER DATABASE SCOPED CONFIGURATION SET TSQL_SCALAR_UDF_INLINING = OFF;" }
    - { id: hint, text: "OPTION (USE HINT ('DISABLE_TSQL_SCALAR_UDF_INLINING'))" }
    - { id: compat, text: "ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 140;" }
    - { id: schema, text: "WITH SCHEMABINDING in the function definition" }
  targets:
    - id: onefunction
      text: { en: "Never inline the function Risk.ufn_Score, in any query that calls it, without changing the calling queries.", fr: "Ne jamais incorporer la fonction Risk.ufn_Score, dans aucune requête qui l'appelle, sans modifier les requêtes appelantes." }
    - id: onequery
      text: { en: "Stop inlining in one month-end report query only; other queries keep inlining the same functions.", fr: "Arrêter l'incorporation dans une seule requête de rapport de fin de mois ; les autres requêtes continuent d'incorporer les mêmes fonctions." }
    - id: alldb
      text: { en: "Stop inlining every scalar function of the database until the issues are analyzed.", fr: "Arrêter l'incorporation de toutes les fonctions scalaires de la base jusqu'à l'analyse des problèmes." }
answer:
  mapping: { onefunction: inlineoff, onequery: hint, alldb: dsc }
explanation:
  correct:
    en: |
      Inlining can be disabled at three scopes without changing the compatibility level. INLINE = OFF in a function definition means that the function is never inlined. The USE HINT ('DISABLE_TSQL_SCALAR_UDF_INLINING') query hint applies to one query and takes precedence over the database settings. The TSQL_SCALAR_UDF_INLINING database scoped configuration disables inlining for the whole database. Lowering the compatibility level to 140 would also disable the other features of level 160, and schema binding has no effect on inlining decisions.
    fr: |
      L'incorporation peut être désactivée à trois étendues sans changer le niveau de compatibilité. INLINE = OFF dans la définition d'une fonction signifie que la fonction n'est jamais incorporée. L'indicateur de requête USE HINT ('DISABLE_TSQL_SCALAR_UDF_INLINING') s'applique à une requête et prévaut sur les paramètres de la base. La configuration délimitée à la base de données TSQL_SCALAR_UDF_INLINING désactive l'incorporation pour toute la base. Abaisser le niveau de compatibilité à 140 désactiverait aussi les autres fonctionnalités du niveau 160, et la liaison au schéma ne désactive pas l'incorporation.
references:
  - title: Scalar UDF Inlining
    url: https://learn.microsoft.com/en-us/sql/relational-databases/user-defined-functions/scalar-udf-inlining
  - title: Query hints (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/hints-transact-sql-query
