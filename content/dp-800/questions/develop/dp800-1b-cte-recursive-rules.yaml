id: dp800-1b-cte-recursive-rules
objective: "1.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A developer at Contoso writes a recursive CTE that walks the HR.Employee hierarchy of an Azure SQL database. Before the code review, you check the rules that the CTE must follow.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur de Contoso écrit une CTE récursive qui parcourt la hiérarchie HR.Employee d'une base de données Azure SQL. Avant la revue de code, vous vérifiez les règles que la CTE doit respecter.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Without a MAXRECURSION hint, the statement fails when the recursion exceeds 100 levels.", fr: "Sans indicateur MAXRECURSION, l'instruction échoue quand la récursivité dépasse 100 niveaux." } }
    - { id: b, text: { en: "The recursive member can join to the CTE with a LEFT OUTER JOIN to keep employees without reports.", fr: "Le membre récursif peut joindre la CTE avec un LEFT OUTER JOIN pour conserver les employés sans subordonnés." } }
    - { id: c, text: { en: "The recursive member cannot contain a GROUP BY clause.", fr: "Le membre récursif ne peut pas contenir de clause GROUP BY." } }
    - { id: d, text: { en: "The FROM clause of the recursive member can reference the CTE twice, for example to join two levels at once.", fr: "La clause FROM du membre récursif peut référencer la CTE deux fois, par exemple pour joindre deux niveaux à la fois." } }
    - { id: e, text: { en: "The columns returned by the recursive CTE keep the nullability of the columns of the anchor member.", fr: "Les colonnes renvoyées par la CTE récursive conservent la possibilité de valeur NULL des colonnes du membre d'ancrage." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The server-wide default recursion limit is 100, so a deeper recursion ends with an error unless the outer statement specifies OPTION (MAXRECURSION n). The recursive member cannot use SELECT DISTINCT, GROUP BY, PIVOT, HAVING, scalar aggregation, TOP, outer joins or subqueries.
    fr: |
      La limite de récursivité par défaut du serveur est 100 : une récursivité plus profonde se termine par une erreur, sauf si l'instruction externe spécifie OPTION (MAXRECURSION n). Le membre récursif ne peut pas utiliser SELECT DISTINCT, GROUP BY, PIVOT, HAVING, l'agrégation scalaire, TOP, les jointures externes ni les sous-requêtes.
  options:
    b: { en: "LEFT, RIGHT and FULL OUTER JOIN are not allowed in the recursive member; only INNER JOIN is allowed.", fr: "LEFT, RIGHT et FULL OUTER JOIN ne sont pas autorisées dans le membre récursif ; seule INNER JOIN est autorisée." }
    d: { en: "The FROM clause of a recursive member must refer to the CTE only one time.", fr: "La clause FROM d'un membre récursif ne doit référencer la CTE qu'une seule fois." }
    e: { en: "All the columns returned by a recursive CTE are nullable, regardless of the nullability of the columns in the member queries.", fr: "Toutes les colonnes renvoyées par une CTE récursive acceptent la valeur NULL, quelle que soit la possibilité de valeur NULL des colonnes des requêtes membres." }
references:
  - title: WITH common_table_expression (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/with-common-table-expression-transact-sql
