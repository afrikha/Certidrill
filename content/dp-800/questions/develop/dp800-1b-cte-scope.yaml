id: dp800-1b-cte-scope
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are refactoring the reporting queries of an Azure SQL database for Woodgrove Bank by using nonrecursive common table expressions (CTEs).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous refactorisez les requêtes de rapport d'une base de données Azure SQL pour Woodgrove Bank à l'aide d'expressions de table communes (CTE) non récursives.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After a WITH clause that defines a CTE named Totals, two consecutive SELECT statements of the same batch can both read from Totals.
        fr: Après une clause WITH qui définit une CTE nommée Totals, deux instructions SELECT consécutives du même lot peuvent toutes deux lire Totals.
    - id: s2
      text:
        en: A CTE can be used in the SELECT statement of a CREATE VIEW statement.
        fr: Une CTE peut être utilisée dans l'instruction SELECT d'une instruction CREATE VIEW.
    - id: s3
      text:
        en: When the outer query references the same CTE twice, the CTE is computed once and its result is reused.
        fr: Quand la requête externe référence deux fois la même CTE, la CTE est calculée une seule fois et son résultat est réutilisé.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A CTE is visible only to the single SELECT, INSERT, UPDATE, MERGE or DELETE statement that follows it, so a second statement cannot reference it. A CTE can also be specified in a CREATE VIEW statement. CTE results are not materialized: each reference in the outer query runs the CTE query again, so a costly result that is reused should go to a temporary table.
    fr: |
      Une CTE n'est visible que par l'unique instruction SELECT, INSERT, UPDATE, MERGE ou DELETE qui la suit : une deuxième instruction ne peut pas la référencer. Une CTE peut aussi être spécifiée dans une instruction CREATE VIEW. Les résultats des CTE ne sont pas matérialisés : chaque référence dans la requête externe exécute de nouveau la requête de la CTE, et un résultat coûteux à réutiliser doit donc aller dans une table temporaire.
references:
  - title: WITH common_table_expression (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/with-common-table-expression-transact-sql
