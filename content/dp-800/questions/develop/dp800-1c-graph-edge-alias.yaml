id: dp800-1c-graph-edge-alias
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a node table named **Social.Person** and an edge table named **Social.FriendOf**.

    You need to return the friends of the friends of Ana. You write the following query.

    ```sql
    SELECT p3.FullName
    FROM Social.Person AS p1, Social.FriendOf AS f,
         Social.Person AS p2, Social.Person AS p3
    WHERE MATCH(p1-(f)->p2-(f)->p3)
      AND p1.FullName = N'Ana';
    ```

    The query fails.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table de nœuds nommée **Social.Person** et une table d'arêtes nommée **Social.FriendOf**.

    Vous devez renvoyer les amis des amis d'Ana. Vous écrivez la requête suivante.

    ```sql
    SELECT p3.FullName
    FROM Social.Person AS p1, Social.FriendOf AS f,
         Social.Person AS p2, Social.Person AS p3
    WHERE MATCH(p1-(f)->p2-(f)->p3)
      AND p1.FullName = N'Ana';
    ```

    La requête échoue.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a fourth alias of Social.Person to the FROM clause.", fr: "Ajouter un quatrième alias de Social.Person à la clause FROM." }
    - id: b
      text: { en: "Add `Social.FriendOf AS f2` to the FROM clause and change the pattern to `p1-(f)->p2-(f2)->p3`.", fr: "Ajouter `Social.FriendOf AS f2` à la clause FROM et remplacer le modèle par `p1-(f)->p2-(f2)->p3`." }
    - id: c
      text: { en: "Change the pattern to `p3<-(f)-p2<-(f)-p1`.", fr: "Remplacer le modèle par `p3<-(f)-p2<-(f)-p1`." }
    - id: d
      text: { en: "Replace the comma-separated FROM list with INNER JOIN clauses on $from_id and $to_id.", fr: "Remplacer la liste FROM séparée par des virgules par des clauses INNER JOIN sur $from_id et $to_id." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Node names can be repeated inside MATCH, but an edge name can't. A two-hop pattern therefore needs a second alias of the edge table in the FROM clause, one for each hop.
    fr: |
      Les noms de nœuds peuvent être répétés dans MATCH, mais pas un nom d'arête. Un modèle à deux sauts nécessite donc un second alias de la table d'arêtes dans la clause FROM, un par saut.
  options:
    a: { en: "The query already has one node alias per position; the problem is the repeated edge alias.", fr: "La requête a déjà un alias de nœud par position ; le problème est l'alias d'arête répété." }
    c: { en: "Reversing the arrows describes the same pattern and still repeats the edge alias f.", fr: "Inverser les flèches décrit le même modèle et répète toujours l'alias d'arête f." }
    d: { en: "MATCH works with a comma-separated FROM list. Joins on the single alias f still describe one edge row, which can't be two different hops: a second edge alias is needed either way.", fr: "MATCH fonctionne avec une liste FROM séparée par des virgules. Des jointures sur le seul alias f décrivent toujours une seule ligne d'arête, qui ne peut pas représenter deux sauts différents : un second alias d'arête est nécessaire dans tous les cas." }
references:
  - title: MATCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/match-sql-graph
