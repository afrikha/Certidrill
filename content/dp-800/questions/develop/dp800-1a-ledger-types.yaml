id: dp800-1a-ledger-types
objective: "1.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove plans to create the following table in an Azure SQL database as an updatable ledger table.

    ```sql
    CREATE TABLE Claims.Claim
    (
        ClaimID    int NOT NULL PRIMARY KEY CLUSTERED,
        Notes      nvarchar(max) NULL,
        Attachment xml NULL,
        Summary    vector(1536) NULL,
        Amount     decimal(10, 2) NOT NULL
    )
    WITH (SYSTEM_VERSIONING = ON, LEDGER = ON);
    ```

    After creating the table, the team also plans to create a nonclustered rowstore index on **Amount** and to enable change data capture on the table.

    Which two elements of the design prevent the table from being an updatable ledger table?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove prévoit de créer la table suivante dans une base de données Azure SQL en tant que table de registre modifiable.

    ```sql
    CREATE TABLE Claims.Claim
    (
        ClaimID    int NOT NULL PRIMARY KEY CLUSTERED,
        Notes      nvarchar(max) NULL,
        Attachment xml NULL,
        Summary    vector(1536) NULL,
        Amount     decimal(10, 2) NOT NULL
    )
    WITH (SYSTEM_VERSIONING = ON, LEDGER = ON);
    ```

    Après la création de la table, l'équipe prévoit aussi de créer un index rowstore non cluster sur **Amount** et d'activer la capture des changements de données sur la table.

    Quels sont les deux éléments de la conception qui empêchent la table d'être une table de registre modifiable ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Notes column", fr: "La colonne Notes" } }
    - { id: b, text: { en: "The Attachment column", fr: "La colonne Attachment" } }
    - { id: c, text: { en: "The Summary column", fr: "La colonne Summary" } }
    - { id: d, text: { en: "The nonclustered index on Amount", fr: "L'index non cluster sur Amount" } }
    - { id: e, text: { en: "Change data capture on the table", fr: "La capture des changements de données sur la table" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Ledger tables don't support the xml, sql_variant, vector and FILESTREAM data types or user-defined types. The Attachment (xml) and Summary (vector) columns must be removed or stored in another table.
    fr: |
      Les tables de registre ne prennent pas en charge les types de données xml, sql_variant, vector et FILESTREAM ni les types définis par l'utilisateur. Les colonnes Attachment (xml) et Summary (vector) doivent être supprimées ou stockées dans une autre table.
  options:
    a: { en: "Large types such as nvarchar(max) are allowed in ledger tables; they only add storage and performance costs.", fr: "Les types volumineux comme nvarchar(max) sont autorisés dans les tables de registre ; ils ajoutent seulement des coûts de stockage et de performances." }
    d: { en: "Nonclustered rowstore indexes are allowed; only the combination with a clustered columnstore index is blocked.", fr: "Les index rowstore non cluster sont autorisés ; seule leur combinaison avec un index columnstore cluster est bloquée." }
    e: { en: "Change data capture is allowed on a ledger table, but not on its history table.", fr: "La capture des changements de données est autorisée sur une table de registre, mais pas sur sa table d'historique." }
references:
  - title: Ledger considerations and limitations
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-limits
