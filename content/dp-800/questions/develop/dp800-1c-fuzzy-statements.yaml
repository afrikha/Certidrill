id: dp800-1c-fuzzy-statements
objective: "1.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating the fuzzy string matching functions for a data cleansing project in Azure SQL Database.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez les fonctions de correspondance de chaînes floue pour un projet de nettoyage des données dans Azure SQL Database.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          EDIT_DISTANCE_SIMILARITY accepts an optional third argument that sets the maximum distance to compute.
        fr: |
          EDIT_DISTANCE_SIMILARITY accepte un troisième argument facultatif qui définit la distance maximale à calculer.
    - id: s2
      text:
        en: |
          If either string argument is NULL, EDIT_DISTANCE returns NULL.
        fr: |
          Si l'un des arguments de type chaîne est NULL, EDIT_DISTANCE renvoie NULL.
    - id: s3
      text:
        en: |
          JARO_WINKLER_DISTANCE returns a float value, and a lower value means more similar strings.
        fr: |
          JARO_WINKLER_DISTANCE renvoie une valeur de type float, et une valeur plus basse signifie des chaînes plus semblables.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Only EDIT_DISTANCE has the optional maximum_distance argument; EDIT_DISTANCE_SIMILARITY takes exactly two strings and returns 0 to 100. Both edit distance functions return NULL when an input is NULL. JARO_WINKLER_DISTANCE returns a float that is 0 for identical strings and grows as the strings differ, while JARO_WINKLER_SIMILARITY returns the 0–100 score.
    fr: |
      Seule EDIT_DISTANCE possède l'argument facultatif maximum_distance ; EDIT_DISTANCE_SIMILARITY prend exactement deux chaînes et renvoie une valeur de 0 à 100. Les deux fonctions de distance d'édition renvoient NULL quand une entrée est NULL. JARO_WINKLER_DISTANCE renvoie un float qui vaut 0 pour des chaînes identiques et augmente quand les chaînes diffèrent, alors que JARO_WINKLER_SIMILARITY renvoie le score de 0 à 100.
references:
  - title: EDIT_DISTANCE_SIMILARITY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/edit-distance-similarity-transact-sql
  - title: JARO_WINKLER_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/jaro-winkler-distance-transact-sql
