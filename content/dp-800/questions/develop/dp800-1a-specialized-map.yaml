id: dp800-1a-specialized-map
objective: "1.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is designing new tables in an Azure SQL database. Each table has one main requirement.

    Which type of table should you use for each requirement? To answer, drag the appropriate table types to the correct requirements. Each table type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit de nouvelles tables dans une base de données Azure SQL. Chaque table a une exigence principale.

    Quel type de table devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types de tables appropriés vers les exigences correspondantes. Chaque type de table peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: temporal, text: { en: "System-versioned temporal table", fr: "Table temporelle avec versions gérées par le système" } }
    - { id: append, text: { en: "Append-only ledger table", fr: "Table de registre en ajout uniquement" } }
    - { id: memory, text: { en: "Memory-optimized table", fr: "Table optimisée en mémoire" } }
    - { id: external, text: { en: "External table", fr: "Table externe" } }
    - { id: graph, text: { en: "Node and edge tables", fr: "Tables de nœuds et d'arêtes" } }
    - { id: columnstore, text: { en: "Table with a clustered columnstore index", fr: "Table avec un index columnstore cluster" } }
  targets:
    - id: parquet
      text: { en: "Query Parquet files stored in Azure Blob Storage without loading them into the database", fr: "Interroger des fichiers Parquet stockés dans le Stockage Blob Azure sans les charger dans la base de données" }
    - id: price
      text: { en: "Return the price list exactly as it was on any past date", fr: "Renvoyer la liste de prix exactement telle qu'elle était à n'importe quelle date passée" }
    - id: signin
      text: { en: "Store sign-in events that must never be updated or deleted and must be tamper-evident", fr: "Stocker des événements de connexion qui ne doivent jamais être modifiés ni supprimés et dont la falsification doit être détectable" }
    - id: hops
      text: { en: "Find every supplier within three relationship hops of a manufacturer", fr: "Trouver chaque fournisseur situé à trois relations au plus d'un fabricant" }
answer:
  mapping: { parquet: external, price: temporal, signin: append, hops: graph }
explanation:
  correct:
    en: |
      An external table reads files in place through an external data source. A temporal table keeps every previous row version and answers FOR SYSTEM_TIME AS OF queries. An append-only ledger table accepts only inserts and makes the data tamper-evident. Node and edge tables model relationships that MATCH queries traverse.
    fr: |
      Une table externe lit les fichiers sur place par l'intermédiaire d'une source de données externe. Une table temporelle conserve chaque version précédente des lignes et répond aux requêtes FOR SYSTEM_TIME AS OF. Une table de registre en ajout uniquement n'accepte que des insertions et rend la falsification des données détectable. Les tables de nœuds et d'arêtes modélisent des relations que les requêtes MATCH parcourent.
  options:
    memory: { en: "Memory-optimized tables target high-throughput OLTP and transient data, none of these requirements.", fr: "Les tables optimisées en mémoire visent l'OLTP à haut débit et les données transitoires, aucune de ces exigences." }
    columnstore: { en: "A clustered columnstore index speeds up scans and aggregates but provides no history, tamper evidence or graph traversal.", fr: "Un index columnstore cluster accélère les analyses et les agrégats mais n'apporte ni historique, ni preuve de non-falsification, ni parcours de graphe." }
references:
  - title: Temporal tables
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/temporal-tables
  - title: Ledger overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview
