id: dp800-1c-fuzzy-prefix-names
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named **CRM.Contact**. You need to find pairs of contacts whose LastName values are probably the same name typed differently.

    The comparison must meet the following requirements:

    - Return a score from 0 to 100, where a higher value means more similar names.
    - Give more weight to names that match from the beginning, because typos usually occur at the end of the names.

    Which predicate should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée **CRM.Contact**. Vous devez trouver les paires de contacts dont les valeurs LastName sont probablement le même nom saisi différemment.

    La comparaison doit respecter les exigences suivantes :

    - Renvoyer un score de 0 à 100, une valeur plus élevée signifiant des noms plus semblables.
    - Donner plus de poids aux noms qui concordent dès le début, car les fautes de frappe se produisent généralement à la fin des noms.

    Quel prédicat devez-vous utiliser ?
body:
  options:
    - { id: a, text: "`EDIT_DISTANCE_SIMILARITY(a.LastName, b.LastName) >= 90`" }
    - { id: b, text: "`JARO_WINKLER_DISTANCE(a.LastName, b.LastName) >= 90`" }
    - { id: c, text: "`EDIT_DISTANCE(a.LastName, b.LastName) >= 90`" }
    - { id: d, text: "`JARO_WINKLER_SIMILARITY(a.LastName, b.LastName) >= 90`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Jaro-Winkler algorithm gives preference to strings that match from the beginning for a set prefix length. JARO_WINKLER_SIMILARITY returns an int from 0 (no match) to 100 (full match), so a threshold of 90 keeps the most similar names.
    fr: |
      L'algorithme de Jaro-Winkler privilégie les chaînes qui concordent dès le début, sur une longueur de préfixe définie. JARO_WINKLER_SIMILARITY renvoie un int de 0 (aucune correspondance) à 100 (correspondance complète) : un seuil de 90 conserve donc les noms les plus semblables.
  options:
    a: { en: "EDIT_DISTANCE_SIMILARITY returns a 0–100 score, but it treats every position equally and doesn't favor matching prefixes.", fr: "EDIT_DISTANCE_SIMILARITY renvoie un score de 0 à 100, mais il traite toutes les positions de la même façon et ne favorise pas les préfixes concordants." }
    b: { en: "JARO_WINKLER_DISTANCE returns a float distance where lower means closer; values near 90 are never reached by similar names.", fr: "JARO_WINKLER_DISTANCE renvoie une distance de type float où une valeur basse signifie plus proche ; des noms semblables n'atteignent jamais une valeur proche de 90." }
    c: { en: "EDIT_DISTANCE returns a number of edits; 90 edits or more selects completely different names.", fr: "EDIT_DISTANCE renvoie un nombre de modifications ; 90 modifications ou plus sélectionne des noms complètement différents." }
references:
  - title: JARO_WINKLER_SIMILARITY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/jaro-winkler-similarity-transact-sql
  - title: What is fuzzy string matching?
    url: https://learn.microsoft.com/en-us/sql/relational-databases/fuzzy-string-match/overview
