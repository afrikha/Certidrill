id: dp800-1d-fabric-copilot-delegated
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has two Microsoft Fabric capacities in the East US region: cap-analytics (F32) and cap-finance (F16). A Fabric administrator enabled the Copilot tenant settings and delegated them to capacity administrators.

    Developers can use Copilot in the SQL databases of the workspaces assigned to cap-analytics, but not in those assigned to cap-finance.

    What should you do to enable Copilot for the cap-finance workspaces?
  fr: |
    Litware dispose de deux capacités Microsoft Fabric dans la région East US : cap-analytics (F32) et cap-finance (F16). Un administrateur Fabric a activé les paramètres du locataire liés à Copilot et les a délégués aux administrateurs de capacité.

    Les développeurs peuvent utiliser Copilot dans les bases de données SQL des espaces de travail affectés à cap-analytics, mais pas dans celles des espaces de travail affectés à cap-finance.

    Que devez-vous faire pour activer Copilot pour les espaces de travail de cap-finance ?
body:
  options:
    - { id: a, text: { en: "Assign GitHub Copilot licenses to the developers of the cap-finance workspaces.", fr: "Attribuer des licences GitHub Copilot aux développeurs des espaces de travail de cap-finance." } }
    - { id: b, text: { en: "Ask the capacity administrator of cap-finance to enable the Copilot settings for that capacity.", fr: "Demander à l'administrateur de capacité de cap-finance d'activer les paramètres Copilot pour cette capacité." } }
    - { id: c, text: { en: "Assign the cap-finance workspaces to a Fabric trial capacity in the same region.", fr: "Affecter les espaces de travail de cap-finance à une capacité d'évaluation Fabric de la même région." } }
    - { id: d, text: { en: "Give the developers the Admin role on the workspaces assigned to cap-finance.", fr: "Attribuer aux développeurs le rôle Admin sur les espaces de travail affectés à cap-finance." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the Copilot tenant settings are delegated, each capacity administrator must enable the same settings for their own capacity. The administrator of cap-analytics did so; the administrator of cap-finance hasn't yet.
    fr: |
      Quand les paramètres du locataire liés à Copilot sont délégués, chaque administrateur de capacité doit activer les mêmes paramètres pour sa propre capacité. L'administrateur de cap-analytics l'a fait ; celui de cap-finance ne l'a pas encore fait.
  options:
    a: { en: "GitHub Copilot is a separate product; its licenses don't enable Copilot in Fabric.", fr: "GitHub Copilot est un produit distinct : ses licences n'activent pas Copilot dans Fabric." }
    c: { en: "Trial SKUs aren't supported for Copilot in SQL database; a paid F2 or P1 capacity or higher is required.", fr: "Les références SKU d'évaluation ne sont pas prises en charge pour Copilot dans la base de données SQL ; une capacité payante F2 ou P1 ou supérieure est requise." }
    d: { en: "A workspace role doesn't override a Copilot setting that is off at the capacity level.", fr: "Un rôle d'espace de travail ne remplace pas un paramètre Copilot désactivé au niveau de la capacité." }
references:
  - title: Enable and configure Copilot in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/copilot-enable-fabric
