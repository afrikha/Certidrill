id: dp800-1a-json-platform
objective: "1.1.3"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Litware has the following databases.

    | Name | Platform |
    | --- | --- |
    | DB1 | SQL Server 2022 |
    | DB2 | Azure SQL Managed Instance with the SQL Server 2022 update policy |
    | DB3 | SQL database in Microsoft Fabric |
    | DB4 | SQL Server 2019 |

    You need to add a column of the native json data type to a table. You must not change the platform, version or update policy of any database.

    In which database can you create the column?
  fr: |
    Litware dispose des bases de données suivantes.

    | Nom | Plateforme |
    | --- | --- |
    | DB1 | SQL Server 2022 |
    | DB2 | Azure SQL Managed Instance avec la stratégie de mise à jour SQL Server 2022 |
    | DB3 | SQL database dans Microsoft Fabric |
    | DB4 | SQL Server 2019 |

    Vous devez ajouter une colonne du type de données natif json à une table. Vous ne devez modifier ni la plateforme, ni la version, ni la stratégie de mise à jour d'aucune base de données.

    Dans quelle base de données pouvez-vous créer la colonne ?
body:
  options:
    - { id: a, text: DB1 }
    - { id: b, text: DB2 }
    - { id: c, text: DB3 }
    - { id: d, text: DB4 }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The json data type is available in SQL Server 2025, Azure SQL Database, SQL database in Microsoft Fabric and Azure SQL Managed Instance configured with the SQL Server 2025 or Always-up-to-date update policy. Only DB3 runs on one of these platforms.
    fr: |
      Le type de données json est disponible dans SQL Server 2025, Azure SQL Database, SQL database dans Microsoft Fabric et Azure SQL Managed Instance configurée avec la stratégie de mise à jour SQL Server 2025 ou Always-up-to-date. Seule DB3 s'exécute sur l'une de ces plateformes.
  options:
    a: { en: "SQL Server 2022 has the JSON functions but not the json data type.", fr: "SQL Server 2022 dispose des fonctions JSON mais pas du type de données json." }
    b: { en: "Managed Instance supports json only with the SQL Server 2025 or Always-up-to-date update policy.", fr: "Managed Instance ne prend en charge json qu'avec la stratégie de mise à jour SQL Server 2025 ou Always-up-to-date." }
    d: { en: "SQL Server 2019 doesn't have the json data type; JSON must be stored as text.", fr: "SQL Server 2019 ne dispose pas du type de données json ; le JSON doit être stocké sous forme de texte." }
references:
  - title: JSON data type
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/json-data-type
