id: dp800-1b-tvf-valid-inline
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You need to create an inline table-valued function named Sales.ufn_CustomerOrders in an Azure SQL database. The function must return the orders of the customer passed as a parameter. You are evaluating the definitions shown in the Definitions exhibit.

    Which definition creates the function successfully?
  fr: |
    Vous devez créer une fonction table inline nommée Sales.ufn_CustomerOrders dans une base de données Azure SQL. La fonction doit renvoyer les commandes du client passé en paramètre. Vous évaluez les définitions présentées dans la pièce Définitions.

    Quelle définition crée la fonction sans erreur ?
exhibits:
  - id: definitions
    title: { en: "Definitions", fr: "Définitions" }
    body: |
      ```sql
      -- Definition 1
      CREATE FUNCTION Sales.ufn_CustomerOrders (@CustomerID int)
      RETURNS TABLE
      AS
      BEGIN
          RETURN (SELECT OrderID, OrderDate, Amount
                  FROM Sales.Orders WHERE CustomerID = @CustomerID);
      END;

      -- Definition 2
      CREATE FUNCTION Sales.ufn_CustomerOrders (@CustomerID int)
      RETURNS @t TABLE (OrderID int, OrderDate date, Amount decimal(12, 2))
      AS
      RETURN (SELECT OrderID, OrderDate, Amount
              FROM Sales.Orders WHERE CustomerID = @CustomerID);

      -- Definition 3
      CREATE FUNCTION Sales.ufn_CustomerOrders (@CustomerID int)
      RETURNS TABLE
      AS
      RETURN (SELECT OrderID, OrderDate, Amount
              FROM Sales.Orders WHERE CustomerID = @CustomerID);

      -- Definition 4
      CREATE FUNCTION Sales.ufn_CustomerOrders (@CustomerID int)
      RETURNS TABLE
      AS
      RETURN (SELECT OrderID, OrderDate, Amount
              FROM Sales.Orders WHERE CustomerID = @CustomerID
              ORDER BY OrderDate DESC);
      ```
body:
  options:
    - { id: a, text: { en: "Definition 1", fr: "Définition 1" } }
    - { id: b, text: { en: "Definition 2", fr: "Définition 2" } }
    - { id: c, text: { en: "Definition 3", fr: "Définition 3" } }
    - { id: d, text: { en: "Definition 4", fr: "Définition 4" } }
shuffle: false
answer: { optionId: c }
explanation:
  correct:
    en: |
      An inline table-valued function declares RETURNS TABLE and has no function body: AS is followed directly by RETURN and a single SELECT statement, optionally in parentheses. The columns of the result come from the SELECT list.
    fr: |
      Une fonction table inline déclare RETURNS TABLE et n'a pas de corps de fonction : AS est directement suivi de RETURN et d'une seule instruction SELECT, éventuellement entre parenthèses. Les colonnes du résultat proviennent de la liste SELECT.
  options:
    a: { en: "An inline function has no BEGIN...END block; a BEGIN...END body belongs to scalar and multi-statement functions.", fr: "Une fonction inline n'a pas de bloc BEGIN...END ; un corps BEGIN...END appartient aux fonctions scalaires et à instructions multiples." }
    b: { en: "RETURNS @t TABLE declares a multi-statement function, which needs a BEGIN...END body that fills @t and ends with a RETURN without argument.", fr: "RETURNS @t TABLE déclare une fonction à instructions multiples, qui exige un corps BEGIN...END remplissant @t et se terminant par un RETURN sans argument." }
    d: { en: "ORDER BY is not allowed in the SELECT of an inline function unless TOP, OFFSET or FOR XML is also specified; sort in the calling query instead.", fr: "ORDER BY n'est pas autorisé dans le SELECT d'une fonction inline sauf si TOP, OFFSET ou FOR XML est aussi spécifié ; triez plutôt dans la requête appelante." }
references:
  - title: CREATE FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql
