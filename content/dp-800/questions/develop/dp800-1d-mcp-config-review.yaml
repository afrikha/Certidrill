id: dp800-1d-mcp-config-review
objective: "1.4.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Litware's developers use GitHub Copilot agents with four MCP server configurations. In every environment, the agents only read schema and data. The `.vscode/mcp.json` file is committed to the team repository.

    The configurations are shown in the following table.

    Answer each prompt by selecting the appropriate cell.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les développeurs de Litware utilisent des agents GitHub Copilot avec quatre configurations de serveur MCP. Dans tous les environnements, les agents lisent uniquement le schéma et les données. Le fichier `.vscode/mcp.json` est validé dans le dépôt de l'équipe.

    Les configurations figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la cellule appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "The setting that exposes a credential in source control", fr: "Le paramètre qui expose une information d'identification dans le contrôle de code source" } }
    - { id: p2, text: { en: "The setting that violates the principle of least privilege", fr: "Le paramètre qui enfreint le principe du moindre privilège" } }
  grid:
    header: [{ en: "Server", fr: "Serveur" }, { en: "Environment", fr: "Environnement" }, { en: "Database identity", fr: "Identité de base de données" }, { en: "Token storage", fr: "Stockage du jeton" }]
    rows:
      - - { text: sales-dev }
        - { text: { en: "Development", fr: "Développement" } }
        - { text: { en: "Dedicated read-only user", fr: "Utilisateur dédié en lecture seule" }, area: dev-id }
        - { text: { en: "${input:dev_token} prompt", fr: "Invite ${input:dev_token}" }, area: dev-tok }
      - - { text: sales-test }
        - { text: { en: "Test", fr: "Test" } }
        - { text: { en: "Service principal, db_datareader", fr: "Principal de service, db_datareader" }, area: test-id }
        - { text: { en: "Environment variable", fr: "Variable d'environnement" }, area: test-tok }
      - - { text: sales-prod }
        - { text: { en: "Production", fr: "Production" } }
        - { text: { en: "Service principal, db_owner", fr: "Principal de service, db_owner" }, area: prod-id }
        - { text: { en: "${input:prod_token} prompt", fr: "Invite ${input:prod_token}" }, area: prod-tok }
      - - { text: sales-qa }
        - { text: { en: "Test", fr: "Test" } }
        - { text: { en: "Dedicated read-only user", fr: "Utilisateur dédié en lecture seule" }, area: qa-id }
        - { text: { en: "Token in the headers value of .vscode/mcp.json", fr: "Jeton dans la valeur headers de .vscode/mcp.json" }, area: qa-tok }
answer:
  values: { p1: qa-tok, p2: prod-id }
explanation:
  correct:
    en: |
      A token written in the committed `.vscode/mcp.json` file is readable by everyone with access to the repository; input prompts and environment variables keep it out of the file. Agents that only read need a read-only identity: db_owner on the production database grants full control, while db_datareader and dedicated read-only users match the need.
    fr: |
      Un jeton écrit dans le fichier `.vscode/mcp.json` validé est lisible par toute personne qui a accès au dépôt ; les invites de saisie et les variables d'environnement le gardent hors du fichier. Des agents qui ne font que lire ont besoin d'une identité en lecture seule : db_owner sur la base de production accorde le contrôle total, tandis que db_datareader et les utilisateurs dédiés en lecture seule correspondent au besoin.
references:
  - title: Connect to MCP server endpoints, including Microsoft SQL Server and Fabric lakehouse
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/7-connect-mcp-server-endpoints
