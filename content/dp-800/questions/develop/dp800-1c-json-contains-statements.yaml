id: dp800-1c-json-contains-statements
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2025 database. You run the following code.

    ```sql
    DECLARE @j json =
        '{"sku":"TX-1","sizes":[38,40,42],"tags":["outdoor","winter"]}';
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données SQL Server 2025. Vous exécutez le code suivant.

    ```sql
    DECLARE @j json =
        '{"sku":"TX-1","sizes":[38,40,42],"tags":["outdoor","winter"]}';
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          `JSON_CONTAINS(@j, 40, '$.sizes[*]')` returns 1.
        fr: |
          `JSON_CONTAINS(@j, 40, '$.sizes[*]')` renvoie 1.
    - id: s2
      text:
        en: |
          `JSON_CONTAINS(@j, 'out%', '$.tags[*]', 1)` returns 1.
        fr: |
          `JSON_CONTAINS(@j, 'out%', '$.tags[*]', 1)` renvoie 1.
    - id: s3
      text:
        en: |
          `JSON_CONTAINS(@j, 'outdoor', '$.labels[*]')` returns 0.
        fr: |
          `JSON_CONTAINS(@j, 'outdoor', '$.labels[*]')` renvoie 0.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A scalar search value is contained in an array when it equals one of its elements; the path to an array needs the [*] wildcard, and the int 40 is compared with the JSON numbers. The fourth argument, search_mode, set to 1 uses LIKE semantics for a character string search value, so 'out%' matches outdoor. When the path doesn't exist in the document, JSON_CONTAINS returns NULL, not 0.
    fr: |
      Une valeur scalaire recherchée est contenue dans un tableau quand elle est égale à l'un de ses éléments ; le chemin vers un tableau nécessite le caractère générique [*], et l'int 40 est comparé aux nombres JSON. Le quatrième argument, search_mode, défini à 1 utilise la sémantique LIKE pour une valeur recherchée de type chaîne : 'out%' correspond donc à outdoor. Quand le chemin n'existe pas dans le document, JSON_CONTAINS renvoie NULL, pas 0.
references:
  - title: JSON_CONTAINS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-contains-transact-sql
