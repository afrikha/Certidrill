id: dp800-1b-tvf-mstvf-choice
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are developing an Azure SQL database for Fabrikam. You need to create a reusable object named Inventory.Availability that meets the following requirements:

    - It takes a product ID and a channel code as parameters.
    - It returns a rowset that queries can join to other tables in their FROM clause.
    - Its logic must be written as several statements: an IF...ELSE block that loads stock from a table that depends on the channel code, followed by a statement that removes reserved quantities from the loaded rows.
    - It must not modify any table of the database.

    What should you create?
  fr: |
    Vous développez une base de données Azure SQL pour Fabrikam. Vous devez créer un objet réutilisable nommé Inventory.Availability qui satisfait les exigences suivantes :

    - Il prend un ID de produit et un code de canal comme paramètres.
    - Il renvoie un ensemble de lignes que les requêtes peuvent joindre à d'autres tables dans leur clause FROM.
    - Sa logique doit être écrite en plusieurs instructions : un bloc IF...ELSE qui charge le stock depuis une table qui dépend du code de canal, suivi d'une instruction qui retire les quantités réservées des lignes chargées.
    - Il ne doit modifier aucune table de la base de données.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An inline table-valued function", fr: "Une fonction table inline" } }
    - { id: b, text: { en: "A stored procedure", fr: "Une procédure stockée" } }
    - { id: c, text: { en: "A view", fr: "Une vue" } }
    - { id: d, text: { en: "A multi-statement table-valued function", fr: "Une fonction table à instructions multiples" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A multi-statement table-valued function declares a table variable in its RETURNS clause and fills it with several statements in a BEGIN...END body, including IF branches and modifications of that local table variable. It accepts parameters and can be used in a FROM clause like a table.
    fr: |
      Une fonction table à instructions multiples déclare une variable de table dans sa clause RETURNS et la remplit avec plusieurs instructions dans un corps BEGIN...END, y compris des branches IF et des modifications de cette variable de table locale. Elle accepte des paramètres et peut être utilisée dans une clause FROM comme une table.
  options:
    a: { en: "An inline table-valued function contains a single SELECT statement, so it cannot run conditional steps.", fr: "Une fonction table inline contient une seule instruction SELECT : elle ne peut pas exécuter d'étapes conditionnelles." }
    b: { en: "A stored procedure can run the steps, but it cannot be used in a FROM clause and joined to other tables.", fr: "Une procédure stockée peut exécuter les étapes, mais elle ne peut pas être utilisée dans une clause FROM et jointe à d'autres tables." }
    c: { en: "A view takes no parameters and contains a single SELECT statement.", fr: "Une vue ne prend aucun paramètre et contient une seule instruction SELECT." }
references:
  - title: CREATE FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql
