stem:
  en: You create an AFTER UPDATE trigger that joins deleted and inserted.
  fr: Vous créez un déclencheur AFTER UPDATE qui joint deleted et inserted.
body:
  solution:
    en: |
      You create the following trigger.

      ```sql
      CREATE TRIGGER HR.trg_Employees_Salary ON HR.Employees
      AFTER UPDATE
      AS
      BEGIN
          SET NOCOUNT ON;
          IF (ROWCOUNT_BIG() = 0) RETURN;
          INSERT INTO HR.SalaryHistory (EmployeeID, OldSalary, NewSalary)
          SELECT d.EmployeeID, d.Salary, i.Salary
          FROM deleted AS d
          INNER JOIN inserted AS i ON i.EmployeeID = d.EmployeeID
          WHERE i.Salary <> d.Salary;
      END;
      ```
    fr: |
      Vous créez le déclencheur suivant.

      ```sql
      CREATE TRIGGER HR.trg_Employees_Salary ON HR.Employees
      AFTER UPDATE
      AS
      BEGIN
          SET NOCOUNT ON;
          IF (ROWCOUNT_BIG() = 0) RETURN;
          INSERT INTO HR.SalaryHistory (EmployeeID, OldSalary, NewSalary)
          SELECT d.EmployeeID, d.Salary, i.Salary
          FROM deleted AS d
          INNER JOIN inserted AS i ON i.EmployeeID = d.EmployeeID
          WHERE i.Salary <> d.Salary;
      END;
      ```
answer: { value: true }
explanation:
  correct:
    en: For an UPDATE, deleted holds the rows before the change and inserted holds the rows after it, for every row of the statement. Joining them on EmployeeID and filtering on a different salary writes one history row per employee whose salary changed, whether the statement updates one row or several thousand. The AFTER trigger runs once the update is applied, and ChangedAt gets its default value.
    fr: "Pour un UPDATE, deleted contient les lignes avant la modification et inserted les lignes après, pour toutes les lignes de l'instruction. Les joindre sur EmployeeID et filtrer sur un salaire différent écrit une ligne d'historique par employé dont le salaire a changé, que l'instruction mette à jour une ligne ou plusieurs milliers. Le déclencheur AFTER s'exécute une fois la mise à jour appliquée, et ChangedAt reçoit sa valeur par défaut."
