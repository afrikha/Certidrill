id: dp800-1d-mcp-environment-practices
objective: "1.4.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank plans to connect GitHub Copilot agents to its Azure SQL databases through SQL MCP Server endpoints in development, test and production. The agents analyze data and suggest query and index changes, which the database administrators apply through the deployment pipeline. The team shares its Visual Studio Code configuration.

    Which three practices should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit de connecter des agents GitHub Copilot à ses bases de données Azure SQL par des points de terminaison SQL MCP Server en développement, en test et en production. Les agents analysent les données et suggèrent des modifications de requêtes et d'index, que les administrateurs de bases de données appliquent par le pipeline de déploiement. L'équipe partage sa configuration Visual Studio Code.

    Quelles sont les trois pratiques à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Configure separate MCP endpoints for development, test and production.", fr: "Configurer des points de terminaison MCP distincts pour le développement, le test et la production." } }
    - { id: b, text: { en: "Give the identity of each endpoint only the permissions the agent needs, read-only where possible.", fr: "N'accorder à l'identité de chaque point de terminaison que les autorisations dont l'agent a besoin, en lecture seule si possible." } }
    - { id: c, text: { en: "Share .vscode/mcp.json through version control, with tokens supplied through input prompts.", fr: "Partager .vscode/mcp.json par le contrôle de version, avec des jetons fournis par des invites de saisie." } }
    - { id: d, text: { en: "Grant db_ddladmin to the endpoint identity so that the agent creates the indexes it suggests.", fr: "Accorder db_ddladmin à l'identité du point de terminaison pour que l'agent crée les index qu'il suggère." } }
    - { id: e, text: { en: "Connect routine development sessions to the production endpoint so that the agent sees real data.", fr: "Connecter les sessions de développement courantes au point de terminaison de production pour que l'agent voie des données réelles." } }
    - { id: f, text: { en: "Use one service principal with db_owner for the three endpoints to simplify the configuration.", fr: "Utiliser un seul principal de service db_owner pour les trois points de terminaison afin de simplifier la configuration." } }
answer: { optionIds: [a, b, c] }
explanation:
  correct:
    en: |
      Use different endpoints for development, test and production, and avoid connecting AI assistants to production during routine development. Give each endpoint a dedicated identity with only the permissions it needs, typically read-only. Share MCP configurations through version control for consistency, and keep credentials out of the files with input prompts or environment variables.
    fr: |
      Utilisez des points de terminaison différents pour le développement, le test et la production, et évitez de connecter des assistants IA à la production pendant le développement courant. Donnez à chaque point de terminaison une identité dédiée qui ne dispose que des autorisations nécessaires, généralement en lecture seule. Partagez les configurations MCP par le contrôle de version pour garantir leur cohérence, et gardez les informations d'identification hors des fichiers avec des invites de saisie ou des variables d'environnement.
  options:
    d: { en: "SQL MCP Server doesn't run DDL, and index changes are applied by the administrators through the pipeline, so DDL rights only widen the identity.", fr: "SQL MCP Server n'exécute pas de DDL, et les modifications d'index sont appliquées par les administrateurs par le pipeline : des droits DDL ne feraient qu'élargir l'identité." }
    e: { en: "Routine development sessions shouldn't reach production.", fr: "Les sessions de développement courantes ne doivent pas atteindre la production." }
    f: { en: "A shared db_owner identity breaks least privilege and the separation of environments.", fr: "Une identité db_owner partagée enfreint le moindre privilège et la séparation des environnements." }
references:
  - title: Connect to MCP server endpoints, including Microsoft SQL Server and Fabric lakehouse
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/7-connect-mcp-server-endpoints
  - title: What is SQL MCP Server?
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/overview
