id: dp800-1c-win-running-ties
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a table named **Bank.Transactions** that has the columns TransactionID (primary key), AccountID, TxDate (date) and Amount. An account can have several transactions on the same date.

    A report uses the following expression to compute a running balance.

    ```sql
    SUM(Amount) OVER (PARTITION BY AccountID ORDER BY TxDate) AS Balance
    ```

    Two transactions of the same account on the same date show the same Balance value. You need to change the OVER clause to meet the following requirements:

    - The balance of each row includes only the rows up to and including that row.
    - Transactions of the same date are processed in TransactionID order.
    - Running the report twice on the same data returns the same balance for each row.

    Which OVER clause should you use?
  fr: |
    Vous disposez d'une table nommée **Bank.Transactions** qui contient les colonnes TransactionID (clé primaire), AccountID, TxDate (date) et Amount. Un compte peut avoir plusieurs transactions à la même date.

    Un rapport utilise l'expression suivante pour calculer un solde cumulé.

    ```sql
    SUM(Amount) OVER (PARTITION BY AccountID ORDER BY TxDate) AS Balance
    ```

    Deux transactions du même compte à la même date affichent la même valeur Balance. Vous devez modifier la clause OVER pour respecter les exigences suivantes :

    - Le solde de chaque ligne n'inclut que les lignes jusqu'à cette ligne comprise.
    - Les transactions d'une même date sont traitées dans l'ordre de TransactionID.
    - Exécuter deux fois le rapport sur les mêmes données renvoie le même solde pour chaque ligne.

    Quelle clause OVER devez-vous utiliser ?
body:
  options:
    - id: a
      text: "`OVER (PARTITION BY AccountID ORDER BY TxDate RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)`"
    - id: b
      text: "`OVER (PARTITION BY AccountID ORDER BY TxDate ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)`"
    - id: c
      text: "`OVER (PARTITION BY AccountID, TxDate ORDER BY TransactionID ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)`"
    - id: d
      text: "`OVER (PARTITION BY AccountID ORDER BY TxDate, TransactionID ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)`"
answer: { optionId: d }
explanation:
  correct:
    en: |
      The default frame with ORDER BY is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, which includes every row that has the same ORDER BY value as the current row, so same-date transactions share a balance. A ROWS frame stops at the physical current row, and adding TransactionID to ORDER BY makes the order of same-date rows unique, so the result is repeatable.
    fr: |
      Le cadre par défaut avec ORDER BY est RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, qui inclut toutes les lignes ayant la même valeur ORDER BY que la ligne courante ; les transactions d'une même date partagent donc un solde. Un cadre ROWS s'arrête à la ligne physique courante, et l'ajout de TransactionID à ORDER BY rend unique l'ordre des lignes d'une même date : le résultat est reproductible.
  options:
    a: { en: "This is the default frame that causes the problem: RANGE includes all rows of the same date.", fr: "C'est le cadre par défaut qui cause le problème : RANGE inclut toutes les lignes de la même date." }
    b: { en: "ROWS gives distinct balances, but the order of same-date rows isn't defined, so two runs can return different balances.", fr: "ROWS donne des soldes distincts, mais l'ordre des lignes d'une même date n'est pas défini : deux exécutions peuvent renvoyer des soldes différents." }
    c: { en: "Partitioning by TxDate restarts the balance at zero every day.", fr: "Partitionner par TxDate remet le solde à zéro chaque jour." }
references:
  - title: SELECT - OVER clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-over-clause-transact-sql
