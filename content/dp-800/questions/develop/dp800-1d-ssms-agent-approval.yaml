id: dp800-1d-ssms-agent-approval
objective: "1.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A database administrator uses GitHub Copilot in SQL Server Management Studio (SSMS) 22.7 in Agent mode to investigate a performance problem. Copilot pauses before each query and asks for approval.

    The administrator wants Copilot to run the query tool without asking again until the current chat session ends, and needs to know where to reset the approvals later and what Cancel does.

    How should you complete the guidance? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur de bases de données utilise GitHub Copilot dans SQL Server Management Studio (SSMS) 22.7 en mode Agent pour analyser un problème de performances. Copilot s'interrompt avant chaque requête et demande une approbation.

    L'administrateur souhaite que Copilot exécute l'outil de requête sans redemander jusqu'à la fin de la session de conversation actuelle, et il doit savoir où réinitialiser les approbations plus tard et ce que fait Cancel.

    Comment devez-vous compléter les consignes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the Allow drop-down list, select [[scope]].

      To review or reset the approvals, go to [[reset]].

      Selecting Cancel [[cancel]].
    fr: |
      Dans la liste déroulante Allow, sélectionnez [[scope]].

      Pour consulter ou réinitialiser les approbations, accédez à [[reset]].

      La sélection de Cancel [[cancel]].
  slots:
    - id: scope
      options:
        - { id: once, text: Allow once }
        - { id: session, text: Allow for this session }
        - { id: always, text: Allow always }
    - id: reset
      options:
        - { id: options, text: "Tools > Options > GitHub > Copilot > Tools" }
        - { id: icon, text: { en: "the Tools icon of the Copilot Chat window", fr: "l'icône Tools de la fenêtre Copilot Chat" } }
        - { id: file, text: { en: "the user-level .mcp.json file", fr: "le fichier .mcp.json de niveau utilisateur" } }
    - id: cancel
      options:
        - { id: rollback, text: { en: "rolls back the queries that Copilot already ran", fr: "annule les requêtes que Copilot a déjà exécutées" } }
        - { id: stop, text: { en: "stops running tools and pending queries without rolling back completed queries", fr: "arrête les outils en cours et les requêtes en attente sans annuler les requêtes terminées" } }
        - { id: disable, text: { en: "disables the query tool for all later sessions", fr: "désactive l'outil de requête pour toutes les sessions suivantes" } }
answer:
  values: { scope: session, reset: options, cancel: stop }
explanation:
  correct:
    en: |
      Allow for this session approves the tool for the current chat session; Allow once approves a single invocation, and Allow always persists across sessions. Approvals are reviewed and reset in Tools > Options > GitHub > Copilot > Tools. Cancel stops running tools and pending queries, but queries that already ran aren't rolled back.
    fr: |
      Allow for this session approuve l'outil pour la session de conversation actuelle ; Allow once approuve un seul appel, et Allow always est conservé d'une session à l'autre. Les approbations se consultent et se réinitialisent dans Tools > Options > GitHub > Copilot > Tools. Cancel arrête les outils en cours et les requêtes en attente, mais les requêtes déjà exécutées ne sont pas annulées.
  options:
    once: { en: "Allow once would ask again at the next query.", fr: "Allow once redemanderait une approbation à la requête suivante." }
    always: { en: "Allow always persists after the session ends, which goes beyond the requirement.", fr: "Allow always est conservé après la fin de la session, ce qui dépasse l'exigence." }
    rollback: { en: "Completed queries aren't rolled back when you select Cancel.", fr: "Les requêtes terminées ne sont pas annulées quand vous sélectionnez Cancel." }
references:
  - title: Use GitHub Copilot Agent mode in SQL Server Management Studio
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/agent-mode
