id: dp800-1b-proc-calls
objective: "1.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains the following stored procedure.

    ```sql
    CREATE PROCEDURE Sales.usp_CustomerOverview
        @CustomerID int,
        @Since      date = '20260101',
        @OrderCount int OUTPUT
    AS
    BEGIN
        SET NOCOUNT ON;
        SELECT CustomerID, FullName, Email FROM Sales.Customer WHERE CustomerID = @CustomerID;
        SELECT OrderID, OrderDate, Amount FROM Sales.Orders
        WHERE CustomerID = @CustomerID AND OrderDate >= @Since;
        SET @OrderCount = @@ROWCOUNT;
    END;
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient la procédure stockée suivante.

    ```sql
    CREATE PROCEDURE Sales.usp_CustomerOverview
        @CustomerID int,
        @Since      date = '20260101',
        @OrderCount int OUTPUT
    AS
    BEGIN
        SET NOCOUNT ON;
        SELECT CustomerID, FullName, Email FROM Sales.Customer WHERE CustomerID = @CustomerID;
        SELECT OrderID, OrderDate, Amount FROM Sales.Orders
        WHERE CustomerID = @CustomerID AND OrderDate >= @Since;
        SET @OrderCount = @@ROWCOUNT;
    END;
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "In a batch that declares `@n int`, `EXECUTE Sales.usp_CustomerOverview @CustomerID = 7, @OrderCount = @n;` returns an error because the OUTPUT keyword is missing."
        fr: "Dans un lot qui déclare `@n int`, `EXECUTE Sales.usp_CustomerOverview @CustomerID = 7, @OrderCount = @n;` renvoie une erreur, car le mot clé OUTPUT est absent."
    - id: s2
      text:
        en: A call that omits @Since uses the date 2026-01-01 for the filter.
        fr: Un appel qui omet @Since utilise la date 2026-01-01 pour le filtre.
    - id: s3
      text:
        en: The procedure returns two result sets to the caller.
        fr: La procédure renvoie deux jeux de résultats à l'appelant.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A procedure with an output parameter can be executed without OUTPUT in the call: no error is returned, but the caller cannot use the output value. Unlike a function, a procedure uses the default value of a parameter that the caller omits. Each SELECT statement in the body that is not an assignment or an INSERT ... SELECT sends its rows to the client, so the procedure returns two result sets; SET NOCOUNT ON suppresses only the row count messages.
    fr: |
      Une procédure qui a un paramètre de sortie peut être exécutée sans OUTPUT dans l'appel : aucune erreur n'est renvoyée, mais l'appelant ne peut pas utiliser la valeur de sortie. Contrairement à une fonction, une procédure utilise la valeur par défaut d'un paramètre que l'appelant omet. Chaque instruction SELECT du corps qui n'est ni une affectation ni un INSERT ... SELECT envoie ses lignes au client : la procédure renvoie deux jeux de résultats ; SET NOCOUNT ON supprime seulement les messages de nombre de lignes.
