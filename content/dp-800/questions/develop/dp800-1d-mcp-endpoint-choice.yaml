id: dp800-1d-mcp-endpoint-choice
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at Northwind is connected to an Azure SQL database named sqldb-dev in the MSSQL extension for Visual Studio Code. The developer has GitHub Copilot Chat.

    The developer needs schema-aware conversations about sqldb-dev. You must not install, configure or run any MCP server.

    What should the developer use?
  fr: |
    Un développeur de Northwind est connecté à une base de données Azure SQL nommée sqldb-dev dans l'extension MSSQL pour Visual Studio Code. Le développeur dispose de GitHub Copilot Chat.

    Le développeur a besoin de conversations qui tiennent compte du schéma de sqldb-dev. Vous ne devez installer, configurer ni exécuter aucun serveur MCP.

    Que doit utiliser le développeur ?
body:
  options:
    - { id: a, text: { en: "SQL MCP Server started locally with dab start", fr: "SQL MCP Server démarré localement avec dab start" } }
    - { id: b, text: { en: "The Azure MCP Server extension signed in to Azure", fr: "L'extension Azure MCP Server connectée à Azure" } }
    - { id: c, text: { en: "Chat with this database in the MSSQL extension", fr: "Chat with this database dans l'extension MSSQL" } }
    - { id: d, text: { en: "A Fabric data agent published as an MCP server", fr: "Un agent de données Fabric publié comme serveur MCP" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The MSSQL extension connects GitHub Copilot Chat directly to the database: right-click the connected database and select Chat with this database. The `@mssql` chat participant is schema-aware through the connection, and no separate MCP server is needed.
    fr: |
      L'extension MSSQL connecte directement GitHub Copilot Chat à la base de données : cliquez avec le bouton droit sur la base connectée et sélectionnez Chat with this database. Le participant de conversation `@mssql` tient compte du schéma grâce à la connexion, et aucun serveur MCP distinct n'est nécessaire.
  options:
    a: { en: "SQL MCP Server is an MCP server that you configure and run, which the requirement excludes.", fr: "SQL MCP Server est un serveur MCP que vous configurez et exécutez, ce que l'exigence exclut." }
    b: { en: "The Azure MCP Server extension installs and runs an MCP server.", fr: "L'extension Azure MCP Server installe et exécute un serveur MCP." }
    d: { en: "A Fabric data agent exposes Fabric data, not an Azure SQL database, and it is consumed as an MCP server.", fr: "Un agent de données Fabric expose des données Fabric, pas une base de données Azure SQL, et il est consommé comme serveur MCP." }
references:
  - title: Connect to MCP server endpoints, including Microsoft SQL Server and Fabric lakehouse
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/7-connect-mcp-server-endpoints
