id: dp800-1b-sfn-default-call
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains the following function.

    ```sql
    CREATE FUNCTION Sales.ufn_PriceWithTax
    (
        @Price   decimal(10, 2),
        @TaxRate decimal(4, 3) = 0.200
    )
    RETURNS decimal(12, 2)
    AS
    BEGIN
        RETURN @Price * (1 + @TaxRate);
    END;
    ```

    You need to write two queries:

    - The first query must return the price of each product with the default tax rate of the function.
    - The second query must return the price of each product with a reduced tax rate of 0.055.

    How should you complete the queries? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient la fonction suivante.

    ```sql
    CREATE FUNCTION Sales.ufn_PriceWithTax
    (
        @Price   decimal(10, 2),
        @TaxRate decimal(4, 3) = 0.200
    )
    RETURNS decimal(12, 2)
    AS
    BEGIN
        RETURN @Price * (1 + @TaxRate);
    END;
    ```

    Vous devez écrire deux requêtes :

    - La première requête doit renvoyer le prix de chaque produit avec le taux de taxe par défaut de la fonction.
    - La deuxième requête doit renvoyer le prix de chaque produit avec un taux réduit de 0.055.

    Comment devez-vous compléter les requêtes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT ProductID, [[q1]] AS PriceWithTax
    FROM Production.Product;

    SELECT ProductID, [[q2]] AS PriceWithReducedTax
    FROM Production.Product;
  slots:
    - id: q1
      options:
        - { id: default, text: "Sales.ufn_PriceWithTax(ListPrice, DEFAULT)" }
        - { id: omit, text: "Sales.ufn_PriceWithTax(ListPrice)" }
        - { id: nullarg, text: "Sales.ufn_PriceWithTax(ListPrice, NULL)" }
        - { id: noschema, text: "ufn_PriceWithTax(ListPrice, DEFAULT)" }
    - id: q2
      options:
        - { id: positional, text: "Sales.ufn_PriceWithTax(ListPrice, 0.055)" }
        - { id: named, text: "Sales.ufn_PriceWithTax(@Price = ListPrice, @TaxRate = 0.055)" }
        - { id: noschema2, text: "ufn_PriceWithTax(ListPrice, 0.055)" }
answer:
  values: { q1: default, q2: positional }
explanation:
  correct:
    en: |
      Unlike a stored procedure, a function does not use a parameter's default value when the argument is omitted: the caller must pass the DEFAULT keyword. In a query, a scalar function is called with at least its two-part name and its arguments are passed by position.
    fr: |
      Contrairement à une procédure stockée, une fonction n'utilise pas la valeur par défaut d'un paramètre quand l'argument est omis : l'appelant doit passer le mot clé DEFAULT. Dans une requête, une fonction scalaire est appelée avec au moins son nom en deux parties et ses arguments sont passés par position.
  options:
    omit: { en: "Omitting an argument of a function raises an error about an insufficient number of arguments.", fr: "Omettre un argument d'une fonction déclenche une erreur de nombre d'arguments insuffisant." }
    nullarg: { en: "NULL is passed as a value, so @TaxRate is NULL and the result is NULL instead of using 0.200.", fr: "NULL est passé comme valeur : @TaxRate vaut NULL et le résultat est NULL au lieu d'utiliser 0.200." }
    noschema: { en: "A scalar function must be called with its schema name; ufn_PriceWithTax alone is not recognized as a function.", fr: "Une fonction scalaire doit être appelée avec son nom de schéma ; ufn_PriceWithTax seul n'est pas reconnu comme une fonction." }
    named: { en: "Named parameter syntax is for EXECUTE calls; a function called in an expression takes its arguments by position.", fr: "La syntaxe des paramètres nommés concerne les appels EXECUTE ; une fonction appelée dans une expression prend ses arguments par position." }
    noschema2: { en: "A scalar function must be called with its schema name.", fr: "Une fonction scalaire doit être appelée avec son nom de schéma." }
references:
  - title: CREATE FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql
  - title: User-defined functions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/user-defined-functions/user-defined-functions
