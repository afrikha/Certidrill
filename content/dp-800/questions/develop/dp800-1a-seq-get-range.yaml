id: dp800-1a-seq-get-range
objective: "1.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a sequence named **Sales.OrderNumber**. A mobile application works offline and must reserve a block of 500 order numbers from the sequence before it disconnects. The first number of the block must be returned to the application.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une séquence nommée **Sales.OrderNumber**. Une application mobile fonctionne hors connexion et doit réserver un bloc de 500 numéros de commande dans la séquence avant de se déconnecter. Le premier numéro du bloc doit être renvoyé à l'application.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    DECLARE @first sql_variant;

    EXECUTE [[proc]]
        @sequence_name = N'Sales.OrderNumber',
        [[size]] = 500,
        @range_first_value = @first [[out]];

    SELECT @first AS FirstOrderNumber;
  slots:
    - id: proc
      options:
        - { id: getrange, text: sys.sp_sequence_get_range }
        - { id: applock, text: sys.sp_getapplock }
        - { id: context, text: sys.sp_set_session_context }
    - id: size
      options:
        - { id: rangesize, text: "@range_size" }
        - { id: lastvalue, text: "@range_last_value" }
        - { id: cyclecount, text: "@range_cycle_count" }
        - { id: increment, text: "@sequence_increment" }
    - id: out
      options:
        - { id: output, text: OUTPUT }
        - { id: readonly, text: READONLY }
        - { id: default, text: DEFAULT }
answer:
  values: { proc: getrange, size: rangesize, out: output }
explanation:
  correct:
    en: |
      sys.sp_sequence_get_range reserves the number of values given by @range_size and returns the first value of the range in the @range_first_value OUTPUT parameter (a sql_variant). The other values of the block are then reserved for the caller.
    fr: |
      sys.sp_sequence_get_range réserve le nombre de valeurs indiqué par @range_size et renvoie la première valeur de la plage dans le paramètre OUTPUT @range_first_value (de type sql_variant). Les autres valeurs du bloc sont alors réservées à l'appelant.
  options:
    applock: { en: "sp_getapplock places an application lock; it doesn't reserve sequence values.", fr: "sp_getapplock pose un verrou d'application ; il ne réserve pas de valeurs de séquence." }
    context: { en: "sp_set_session_context stores a key-value pair for the session.", fr: "sp_set_session_context stocke une paire clé-valeur pour la session." }
    lastvalue: { en: "@range_last_value is an optional OUTPUT parameter that returns the last value of the range.", fr: "@range_last_value est un paramètre OUTPUT facultatif qui renvoie la dernière valeur de la plage." }
    cyclecount: { en: "@range_cycle_count returns how many times the sequence cycled to serve the range.", fr: "@range_cycle_count renvoie le nombre de fois où la séquence a recommencé un cycle pour fournir la plage." }
    increment: { en: "@sequence_increment returns the increment of the sequence.", fr: "@sequence_increment renvoie l'incrément de la séquence." }
    readonly: { en: "READONLY applies to table-valued parameters.", fr: "READONLY s'applique aux paramètres table." }
    default: { en: "Without OUTPUT, the procedure can't return the first value to @first.", fr: "Sans OUTPUT, la procédure ne peut pas renvoyer la première valeur dans @first." }
references:
  - title: sys.sp_sequence_get_range (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-sequence-get-range-transact-sql
