id: dp800-cs3b-copilot-context
objective: "1.4.1"
type: multi
caseStudy: dp800-cs3b-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to answer the question of the compliance team about Copilot in the SQL query editor of LearnDb.

    Which two types of information can Copilot use when it answers a developer?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez répondre à la question de l'équipe de conformité sur Copilot dans l'éditeur de requête SQL de LearnDb.

    Quels sont les deux types d'informations que Copilot peut utiliser quand il répond à un développeur ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The schema of the LearnDb objects that the developer can access", fr: "Le schéma des objets de LearnDb auxquels le développeur peut accéder" } }
    - { id: b, text: { en: "The rows of dbo.Learners, including the unmasked email addresses", fr: "Les lignes de dbo.Learners, y compris les adresses e-mail non masquées" } }
    - { id: c, text: { en: "The text of the queries that the developer has run in the session", fr: "Le texte des requêtes que le développeur a exécutées dans la session" } }
    - { id: d, text: { en: "The schema of the LearnDb objects that the developer can't access", fr: "Le schéma des objets de LearnDb auxquels le développeur ne peut pas accéder" } }
    - { id: e, text: { en: "The clickstream data stored in the tables of LH-Engagement", fr: "Les données de parcours de navigation stockées dans les tables de LH-Engagement" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: Copilot in the SQL database workload works with the database schema that is accessible to the user, the content of the SQL queries the user has executed, their error messages and the earlier messages of the session. It has access to the schema, not to the data, which is also why its answers about data values can be inaccurate.
    fr: Copilot dans la charge de travail de base de données SQL utilise le schéma de base de données accessible à l'utilisateur, le contenu des requêtes SQL que l'utilisateur a exécutées, leurs messages d'erreur et les messages précédents de la session. Il a accès au schéma, pas aux données, ce qui explique aussi que ses réponses sur les valeurs des données puissent être inexactes.
  options:
    b: { en: "Copilot has access to the database schema, not to the data stored in the tables.", fr: "Copilot a accès au schéma de la base de données, pas aux données stockées dans les tables." }
    d: { en: "Copilot can only access the schema that is accessible to the user who asks.", fr: "Copilot ne peut accéder qu'au schéma accessible à l'utilisateur qui pose la question." }
    e: { en: "Copilot in the SQL query editor works on the database; it doesn't read the data of a lakehouse.", fr: "Copilot dans l'éditeur de requête SQL travaille sur la base de données ; il ne lit pas les données d'un lakehouse." }
references:
  - title: Privacy, security, and responsible AI use of Copilot in Fabric in the SQL database workload
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/copilot-database-privacy-security
  - title: What is Copilot in the SQL database in Fabric workload?
    url: https://learn.microsoft.com/en-us/fabric/database/sql/copilot
