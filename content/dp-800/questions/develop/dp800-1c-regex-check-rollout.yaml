id: dp800-1c-regex-check-rollout
objective: "1.3.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that has a compatibility level of 150. A table named **Sales.Customer** has a varchar(10) column named PostalCode. Some existing values contain lowercase letters and spaces, such as `ab1 2cd`. Every existing value becomes valid once its letters are uppercased and its spaces are removed.

    You need to add a CHECK constraint that uses `REGEXP_LIKE(PostalCode, '^[A-Z0-9]{5,7}$')`. The constraint must also be validated against the existing rows.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL dont le niveau de compatibilité est 150. Une table nommée **Sales.Customer** contient une colonne varchar(10) nommée PostalCode. Certaines valeurs existantes contiennent des minuscules et des espaces, comme `ab1 2cd`. Chaque valeur existante devient valide dès que ses lettres sont mises en majuscules et ses espaces supprimés.

    Vous devez ajouter une contrainte CHECK qui utilise `REGEXP_LIKE(PostalCode, '^[A-Z0-9]{5,7}$')`. La contrainte doit aussi être validée sur les lignes existantes.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: compat
      text: { en: "Set the compatibility level of the database to 170.", fr: "Définir le niveau de compatibilité de la base de données sur 170." }
    - id: fix
      text:
        en: |
          Run an UPDATE that sets PostalCode to `REGEXP_REPLACE(UPPER(PostalCode), '\s', '')` for the rows where `NOT REGEXP_LIKE(PostalCode, '^[A-Z0-9]{5,7}$')`.
        fr: |
          Exécuter une instruction UPDATE qui affecte `REGEXP_REPLACE(UPPER(PostalCode), '\s', '')` à PostalCode pour les lignes où `NOT REGEXP_LIKE(PostalCode, '^[A-Z0-9]{5,7}$')`.
    - id: add
      text: { en: "Add the CHECK constraint by using `ALTER TABLE ... WITH CHECK ADD CONSTRAINT`.", fr: "Ajouter la contrainte CHECK avec `ALTER TABLE ... WITH CHECK ADD CONSTRAINT`." }
    - id: nocheck
      text: { en: "Add the CHECK constraint by using `ALTER TABLE ... WITH NOCHECK ADD CONSTRAINT`.", fr: "Ajouter la contrainte CHECK avec `ALTER TABLE ... WITH NOCHECK ADD CONSTRAINT`." }
    - id: preview
      text: { en: "Set the PREVIEW_FEATURES database scoped configuration to ON.", fr: "Définir la configuration délimitée à la base de données PREVIEW_FEATURES sur ON." }
    - id: tvf
      text: { en: "Set the ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS database scoped configuration to ON.", fr: "Définir la configuration délimitée à la base de données ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS sur ON." }
answer:
  sequence: [compat, fix, add]
explanation:
  correct:
    en: |
      REGEXP_LIKE requires compatibility level 170, and the UPDATE uses it in its WHERE clause, so the level must be raised first. The existing values must then be corrected, because a constraint added WITH CHECK validates every existing row and fails if one of them violates it.
    fr: |
      REGEXP_LIKE exige le niveau de compatibilité 170, et l'instruction UPDATE l'utilise dans sa clause WHERE : le niveau doit donc être relevé en premier. Les valeurs existantes doivent ensuite être corrigées, car une contrainte ajoutée WITH CHECK valide chaque ligne existante et échoue si l'une d'elles la viole.
  options:
    nocheck: { en: "WITH NOCHECK skips the validation of existing rows, which the requirements forbid.", fr: "WITH NOCHECK ignore la validation des lignes existantes, ce que les exigences interdisent." }
    preview: { en: "This setting enables preview features; it doesn't lift the compatibility level requirement of REGEXP_LIKE.", fr: "Ce paramètre active les fonctionnalités en préversion ; il ne lève pas l'exigence de niveau de compatibilité de REGEXP_LIKE." }
    tvf: { en: "This setting concerns built-in table-valued functions; REGEXP_LIKE is a scalar function.", fr: "Ce paramètre concerne les fonctions table intégrées ; REGEXP_LIKE est une fonction scalaire." }
references:
  - title: REGEXP_LIKE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-like-transact-sql
  - title: REGEXP_REPLACE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-replace-transact-sql
