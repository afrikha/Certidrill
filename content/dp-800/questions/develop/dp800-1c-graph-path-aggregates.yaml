id: dp800-1c-graph-path-aggregates
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a node table named **Social.Person** (PersonID, FullName) and an edge table named **Social.Follows**.

    You need to return, for every person that Ana can reach within four hops, the name of the reached person and the number of hops of the shortest path. You write the following query.

    ```sql
    SELECT p1.FullName,
           <select list>
    FROM Social.Person AS p1,
         Social.Follows FOR PATH AS f,
         Social.Person FOR PATH AS p2
    WHERE MATCH(SHORTEST_PATH(p1(-(f)->p2){1,4}))
      AND p1.FullName = N'Ana';
    ```

    What should you use as the select list?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table de nœuds nommée **Social.Person** (PersonID, FullName) et une table d'arêtes nommée **Social.Follows**.

    Vous devez renvoyer, pour chaque personne qu'Ana peut atteindre en quatre sauts au plus, le nom de la personne atteinte et le nombre de sauts du plus court chemin. Vous écrivez la requête suivante.

    ```sql
    SELECT p1.FullName,
           <select list>
    FROM Social.Person AS p1,
         Social.Follows FOR PATH AS f,
         Social.Person FOR PATH AS p2
    WHERE MATCH(SHORTEST_PATH(p1(-(f)->p2){1,4}))
      AND p1.FullName = N'Ana';
    ```

    Que devez-vous utiliser comme liste de sélection ?
body:
  options:
    - id: a
      text: "`LAST_VALUE(p2.FullName) WITHIN GROUP (GRAPH PATH) AS Reached, COUNT(p2.PersonID) WITHIN GROUP (GRAPH PATH) AS Hops`"
    - id: b
      text: "`p2.FullName AS Reached, COUNT(p2.PersonID) WITHIN GROUP (GRAPH PATH) AS Hops`"
    - id: c
      text: "`LAST_VALUE(p2.FullName) WITHIN GROUP (GRAPH PATH) AS Reached, COUNT(*) WITHIN GROUP (GRAPH PATH) AS Hops`"
    - id: d
      text: "`LAST_VALUE(p2.FullName) OVER (ORDER BY p2.PersonID) AS Reached, COUNT(p2.PersonID) OVER () AS Hops`"
answer: { optionId: a }
explanation:
  correct:
    en: |
      Tables marked FOR PATH return an ordered collection of the nodes or edges of the path, so their columns can't be projected directly. Graph path aggregate functions with WITHIN GROUP (GRAPH PATH) read them instead. LAST_VALUE returns the last node of the path, and COUNT returns the number of non-null values in the path, which is the number of hops.
    fr: |
      Les tables marquées FOR PATH renvoient une collection ordonnée des nœuds ou des arêtes du chemin : leurs colonnes ne peuvent pas être projetées directement. Les fonctions d'agrégation de chemin de graphe avec WITHIN GROUP (GRAPH PATH) les lisent à la place. LAST_VALUE renvoie le dernier nœud du chemin, et COUNT renvoie le nombre de valeurs non NULL du chemin, c'est-à-dire le nombre de sauts.
  options:
    b: { en: "p2 is marked FOR PATH, so its columns can't be projected directly in the SELECT list.", fr: "p2 est marqué FOR PATH : ses colonnes ne peuvent pas être projetées directement dans la liste SELECT." }
    c: { en: "The graph path COUNT function doesn't support *; COUNT(*) causes a syntax error.", fr: "La fonction COUNT de chemin de graphe ne prend pas en charge * ; COUNT(*) provoque une erreur de syntaxe." }
    d: { en: "Window functions with OVER can't read the collections returned by FOR PATH tables.", fr: "Les fonctions de fenêtre avec OVER ne peuvent pas lire les collections renvoyées par les tables FOR PATH." }
references:
  - title: SHORTEST_PATH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/graphs/sql-graph-shortest-path
