id: dp800-1a-fk-facts
objective: "1.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is adding foreign keys to its SQL Server 2025 database. The **Sales.OrderLine** table will reference the **Sales.Product** table, which has a primary key on ProductID and a UNIQUE constraint on ProductCode.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys ajoute des clés étrangères à sa base de données SQL Server 2025. La table **Sales.OrderLine** référencera la table **Sales.Product**, qui a une clé primaire sur ProductID et une contrainte UNIQUE sur ProductCode.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Creating a foreign key on Sales.OrderLine automatically creates an index on the foreign key columns.
        fr: La création d'une clé étrangère sur Sales.OrderLine crée automatiquement un index sur les colonnes de la clé étrangère.
    - id: s2
      text:
        en: A foreign key on Sales.OrderLine can reference the ProductCode column.
        fr: Une clé étrangère sur Sales.OrderLine peut référencer la colonne ProductCode.
    - id: s3
      text:
        en: A foreign key on Sales.OrderLine can reference a table in another database on the same server.
        fr: Une clé étrangère sur Sales.OrderLine peut référencer une table d'une autre base de données du même serveur.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A foreign key doesn't create an index; Microsoft recommends indexing foreign key columns because they are used in joins and checked when the parent key changes. A foreign key can reference a PRIMARY KEY or UNIQUE constraint, or a unique index, of the referenced table. Foreign keys can reference only tables in the same database; cross-database integrity requires triggers.
    fr: |
      Une clé étrangère ne crée pas d'index ; Microsoft recommande d'indexer les colonnes de clé étrangère, car elles servent aux jointures et sont vérifiées lorsque la clé parente change. Une clé étrangère peut référencer une contrainte PRIMARY KEY ou UNIQUE, ou un index unique, de la table référencée. Les clés étrangères ne peuvent référencer que des tables de la même base de données ; l'intégrité entre bases de données exige des déclencheurs.
references:
  - title: Primary and foreign key constraints
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/primary-and-foreign-key-constraints
  - title: CREATE TABLE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-table-transact-sql
