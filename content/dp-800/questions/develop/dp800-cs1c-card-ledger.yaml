id: dp800-cs1c-card-ledger
objective: "1.1.2"
type: single
caseStudy: dp800-cs1c-woodgrove-bank
difficulty: 1
status: draft
stem:
  en: |
    You need to create dbo.CardTransactions. The solution must meet the card transactions requirements.

    Which table option should you use in the CREATE TABLE statement?
  fr: |
    Vous devez créer dbo.CardTransactions. La solution doit respecter les exigences relatives aux transactions par carte.

    Quelle option de table devez-vous utiliser dans l'instruction CREATE TABLE ?
body:
  options:
    - { id: a, text: "WITH (SYSTEM_VERSIONING = ON, LEDGER = ON)" }
    - { id: b, text: "WITH (SYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.CardTransactionsHistory))" }
    - { id: c, text: "WITH (MEMORY_OPTIMIZED = ON, DURABILITY = SCHEMA_AND_DATA)" }
    - { id: d, text: "WITH (LEDGER = ON (APPEND_ONLY = ON))" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An append-only ledger table accepts only INSERT statements: updates and deletes are blocked, which also protects against privileged users. Like every ledger table, it is hashed into the database ledger, so ledger verification against stored database digests detects any tampering, even by a sysadmin.
    fr: |
      Une table de registre en ajout uniquement n'accepte que les instructions INSERT : les mises à jour et les suppressions sont bloquées, ce qui protège aussi contre les utilisateurs privilégiés. Comme toute table de registre, elle est hachée dans le registre de la base de données : la vérification du registre par rapport aux synthèses de base de données stockées détecte toute falsification, même par un sysadmin.
  options:
    a: { en: "An updatable ledger table detects tampering but allows UPDATE and DELETE statements, which it only records in its history table.", fr: "Une table de registre modifiable détecte les falsifications mais autorise les instructions UPDATE et DELETE, qu'elle se contente d'enregistrer dans sa table d'historique." }
    b: { en: "A temporal table keeps previous row versions but allows updates and deletes and provides no tamper evidence.", fr: "Une table temporelle conserve les versions précédentes des lignes mais autorise les mises à jour et les suppressions et ne fournit aucune preuve de falsification." }
    c: { en: "A durable memory-optimized table improves performance; it neither blocks updates nor detects tampering.", fr: "Une table optimisée en mémoire durable améliore les performances ; elle ne bloque pas les mises à jour et ne détecte pas les falsifications." }
references:
  - title: Ledger overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview
