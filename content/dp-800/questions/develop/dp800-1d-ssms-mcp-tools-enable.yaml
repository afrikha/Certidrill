id: dp800-1d-ssms-mcp-tools-enable
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A database administrator uses GitHub Copilot in SQL Server Management Studio (SSMS) 22.7 in Agent mode. The administrator adds an HTTP MCP server by selecting the Tools icon, the green + button and Add custom MCP server. SSMS initializes the server, and the server appears in the Tools list.

    When the administrator asks a question that requires the new server, Copilot never calls its tools.

    What should the administrator do?
  fr: |
    Un administrateur de bases de données utilise GitHub Copilot dans SQL Server Management Studio (SSMS) 22.7 en mode Agent. Il ajoute un serveur MCP HTTP en sélectionnant l'icône Tools, le bouton + vert et Add custom MCP server. SSMS initialise le serveur, qui apparaît dans la liste Tools.

    Quand l'administrateur pose une question qui nécessite le nouveau serveur, Copilot n'appelle jamais ses outils.

    Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Switch the chat mode from Agent to Ask.", fr: "Faire passer le mode de conversation de Agent à Ask." } }
    - { id: b, text: { en: "Select the tools of the new server in the Tools list.", fr: "Sélectionner les outils du nouveau serveur dans la liste Tools." } }
    - { id: c, text: { en: "Change the Type of the server from HTTP to stdio.", fr: "Changer le type du serveur de HTTP en stdio." } }
    - { id: d, text: { en: "Add the same server to the user-level .mcp.json file.", fr: "Ajouter le même serveur au fichier .mcp.json de niveau utilisateur." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In SSMS, the tools of an MCP server are disabled by default after you add the server, with either method. You must enable each tool in the Tools list of Copilot Chat before Copilot can use it.
    fr: |
      Dans SSMS, les outils d'un serveur MCP sont désactivés par défaut après l'ajout du serveur, quelle que soit la méthode. Vous devez activer chaque outil dans la liste Tools de Copilot Chat avant que Copilot puisse l'utiliser.
  options:
    a: { en: "Ask mode doesn't support MCP; Agent mode is required.", fr: "Le mode Ask ne prend pas en charge MCP : le mode Agent est requis." }
    c: { en: "The transport isn't the problem: the server was initialized, but its tools are still disabled.", fr: "Le transport n'est pas en cause : le serveur a été initialisé, mais ses outils sont encore désactivés." }
    d: { en: "The config file is only another way to add a server; its tools would also start disabled.", fr: "Le fichier de configuration n'est qu'une autre manière d'ajouter un serveur : ses outils seraient aussi désactivés au départ." }
references:
  - title: Use MCP servers with GitHub Copilot in SQL Server Management Studio
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/mcp-servers
