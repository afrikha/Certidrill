id: dp800-1c-corr-scalar-multirow
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You write the following query.

    ```sql
    SELECT c.CustomerID, c.FullName,
           (SELECT o.OrderDate
            FROM Sales.Orders AS o
            WHERE o.CustomerID = c.CustomerID) AS LastOrderDate
    FROM Sales.Customer AS c;
    ```

    The query fails because the subquery returns more than one value for some customers. LastOrderDate must return the date of the customer's most recent order, or NULL for customers that have no orders.

    How should you rewrite the subquery?
  fr: |
    Vous écrivez la requête suivante.

    ```sql
    SELECT c.CustomerID, c.FullName,
           (SELECT o.OrderDate
            FROM Sales.Orders AS o
            WHERE o.CustomerID = c.CustomerID) AS LastOrderDate
    FROM Sales.Customer AS c;
    ```

    La requête échoue, car la sous-requête renvoie plusieurs valeurs pour certains clients. LastOrderDate doit renvoyer la date de la commande la plus récente du client, ou NULL pour les clients sans commande.

    Comment devez-vous réécrire la sous-requête ?
body:
  options:
    - { id: a, text: "`(SELECT DISTINCT o.OrderDate FROM Sales.Orders AS o WHERE o.CustomerID = c.CustomerID)`" }
    - { id: b, text: "`(SELECT MAX(o.OrderDate) FROM Sales.Orders AS o WHERE o.CustomerID = c.CustomerID)`" }
    - { id: c, text: "`(SELECT o.OrderDate FROM Sales.Orders AS o WHERE o.CustomerID = c.CustomerID ORDER BY o.OrderDate DESC)`" }
    - { id: d, text: "`(SELECT o.OrderDate FROM Sales.Orders AS o WHERE o.CustomerID = c.CustomerID AND o.OrderDate IS NOT NULL)`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A subquery used as a scalar expression must return a single value. MAX aggregates the orders of the correlated customer into one value, the most recent date, and returns NULL when the customer has no orders.
    fr: |
      Une sous-requête utilisée comme expression scalaire doit renvoyer une seule valeur. MAX agrège les commandes du client corrélé en une seule valeur, la date la plus récente, et renvoie NULL quand le client n'a pas de commande.
  options:
    a: { en: "A customer with orders on several dates still returns several values.", fr: "Un client ayant des commandes à plusieurs dates renvoie toujours plusieurs valeurs." }
    c: { en: "ORDER BY isn't allowed in a subquery unless TOP, OFFSET or FOR XML is also specified, and it wouldn't limit the result to one row.", fr: "ORDER BY n'est pas autorisé dans une sous-requête sans TOP, OFFSET ou FOR XML, et il ne limiterait pas le résultat à une ligne." }
    d: { en: "Removing NULL dates doesn't reduce the number of orders per customer.", fr: "Exclure les dates NULL ne réduit pas le nombre de commandes par client." }
references:
  - title: Subqueries (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/subqueries
