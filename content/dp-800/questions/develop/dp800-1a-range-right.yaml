id: dp800-1a-range-right
objective: "1.1.6"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Contoso partitions the **Sales.OrderArchive** table on the **OrderDate** column by using the following partition function.

    ```sql
    CREATE PARTITION FUNCTION PF_OrderYear (date)
    AS RANGE RIGHT FOR VALUES ('2025-01-01', '2026-01-01', '2027-01-01');
    ```

    A row is inserted with an OrderDate of 2026-01-01.

    In which partition is the row stored?
  fr: |
    Contoso partitionne la table **Sales.OrderArchive** sur la colonne **OrderDate** à l'aide de la fonction de partition suivante.

    ```sql
    CREATE PARTITION FUNCTION PF_OrderYear (date)
    AS RANGE RIGHT FOR VALUES ('2025-01-01', '2026-01-01', '2027-01-01');
    ```

    Une ligne est insérée avec la valeur OrderDate 2026-01-01.

    Dans quelle partition la ligne est-elle stockée ?
body:
  options:
    - { id: a, text: { en: "Partition 1", fr: "Partition 1" } }
    - { id: b, text: { en: "Partition 2", fr: "Partition 2" } }
    - { id: c, text: { en: "Partition 3", fr: "Partition 3" } }
    - { id: d, text: { en: "Partition 4", fr: "Partition 4" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Three boundary values create four partitions. With RANGE RIGHT, each boundary value is the lower bound of the partition on its right: partition 1 holds dates before 2025-01-01, partition 2 holds 2025, partition 3 holds dates from 2026-01-01 up to but excluding 2027-01-01, and partition 4 holds the rest. The value 2026-01-01 therefore goes to partition 3.
    fr: |
      Trois valeurs limites créent quatre partitions. Avec RANGE RIGHT, chaque valeur limite est la borne inférieure de la partition située à sa droite : la partition 1 contient les dates antérieures au 2025-01-01, la partition 2 l'année 2025, la partition 3 les dates du 2026-01-01 inclus au 2027-01-01 exclu, et la partition 4 le reste. La valeur 2026-01-01 va donc dans la partition 3.
  options:
    a: { en: "Partition 1 holds only dates earlier than 2025-01-01.", fr: "La partition 1 ne contient que des dates antérieures au 2025-01-01." }
    b: { en: "With RANGE LEFT, 2026-01-01 would be the upper bound of partition 2; with RANGE RIGHT it starts partition 3.", fr: "Avec RANGE LEFT, 2026-01-01 serait la borne supérieure de la partition 2 ; avec RANGE RIGHT, elle commence la partition 3." }
    d: { en: "Partition 4 starts at 2027-01-01.", fr: "La partition 4 commence au 2027-01-01." }
references:
  - title: CREATE PARTITION FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-partition-function-transact-sql
