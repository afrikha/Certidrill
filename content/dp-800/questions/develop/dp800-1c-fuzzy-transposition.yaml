id: dp800-1c-fuzzy-transposition
objective: "1.3.5"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have a SQL Server 2025 database in which the PREVIEW_FEATURES database scoped configuration is set to ON.

    You run the following statement.

    ```sql
    SELECT EDIT_DISTANCE(N'Fabrikam', N'Fabirkam') AS Distance;
    ```

    What value does the statement return?
  fr: |
    Vous disposez d'une base de données SQL Server 2025 dans laquelle la configuration délimitée à la base de données PREVIEW_FEATURES est définie sur ON.

    Vous exécutez l'instruction suivante.

    ```sql
    SELECT EDIT_DISTANCE(N'Fabrikam', N'Fabirkam') AS Distance;
    ```

    Quelle valeur l'instruction renvoie-t-elle ?
body:
  options:
    - { id: a, text: "0" }
    - { id: b, text: "1" }
    - { id: c, text: "2" }
    - { id: d, text: "3" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The two strings differ only by the adjacent letters r and i, which are swapped. EDIT_DISTANCE implements the Damerau-Levenshtein (optimal string alignment) algorithm, which counts insertions, deletions, substitutions and transpositions, so a single transposition is a distance of 1.
    fr: |
      Les deux chaînes ne diffèrent que par les lettres adjacentes r et i, qui sont interverties. EDIT_DISTANCE implémente l'algorithme de Damerau-Levenshtein (alignement optimal de chaînes), qui compte les insertions, suppressions, substitutions et transpositions : une seule transposition donne donc une distance de 1.
  options:
    a: { en: "0 is returned only for identical strings.", fr: "0 n'est renvoyé que pour des chaînes identiques." }
    c: { en: "2 is the classic Levenshtein distance, which counts a swap as two substitutions; EDIT_DISTANCE also counts transpositions.", fr: "2 est la distance de Levenshtein classique, qui compte une interversion comme deux substitutions ; EDIT_DISTANCE compte aussi les transpositions." }
    d: { en: "No sequence of edits needs three operations here.", fr: "Aucune suite de modifications ne nécessite trois opérations ici." }
references:
  - title: EDIT_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/edit-distance-transact-sql
