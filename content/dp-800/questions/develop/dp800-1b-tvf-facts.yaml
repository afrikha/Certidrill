id: dp800-1b-tvf-facts
objective: "1.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database that uses compatibility level 160 and contains the following function.

    ```sql
    CREATE FUNCTION Sales.ufn_CustomerSummary (@CustomerID int)
    RETURNS @s TABLE (Category nvarchar(50), Orders int, Revenue decimal(14, 2))
    AS
    BEGIN
        INSERT INTO @s (Category, Orders, Revenue)
        SELECT p.Category, COUNT(*), SUM(ol.Quantity * ol.UnitPrice)
        FROM Sales.Orders AS o
        JOIN Sales.OrderLine AS ol ON ol.OrderID = o.OrderID
        JOIN Production.Product AS p ON p.ProductID = ol.ProductID
        WHERE o.CustomerID = @CustomerID
        GROUP BY p.Category;

        IF NOT EXISTS (SELECT 1 FROM @s)
            INSERT INTO @s (Category, Orders, Revenue) VALUES (N'None', 0, 0);
        RETURN;
    END;
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui utilise le niveau de compatibilité 160 et contient la fonction suivante.

    ```sql
    CREATE FUNCTION Sales.ufn_CustomerSummary (@CustomerID int)
    RETURNS @s TABLE (Category nvarchar(50), Orders int, Revenue decimal(14, 2))
    AS
    BEGIN
        INSERT INTO @s (Category, Orders, Revenue)
        SELECT p.Category, COUNT(*), SUM(ol.Quantity * ol.UnitPrice)
        FROM Sales.Orders AS o
        JOIN Sales.OrderLine AS ol ON ol.OrderID = o.OrderID
        JOIN Production.Product AS p ON p.ProductID = ol.ProductID
        WHERE o.CustomerID = @CustomerID
        GROUP BY p.Category;

        IF NOT EXISTS (SELECT 1 FROM @s)
            INSERT INTO @s (Category, Orders, Revenue) VALUES (N'None', 0, 0);
        RETURN;
    END;
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A query can call the function once per customer by using CROSS APPLY with c.CustomerID as the argument.", fr: "Une requête peut appeler la fonction une fois par client en utilisant CROSS APPLY avec c.CustomerID comme argument." } }
    - { id: b, text: { en: "The optimizer expands the body of the function into the calling query, like a view.", fr: "L'optimiseur développe le corps de la fonction dans la requête appelante, comme une vue." } }
    - { id: c, text: { en: "Interleaved execution can use the actual number of rows returned by the function to compile the rest of the calling query.", fr: "L'exécution entrelacée peut utiliser le nombre réel de lignes renvoyées par la fonction pour compiler le reste de la requête appelante." } }
    - { id: d, text: { en: "A TRY...CATCH block can be added to the body to handle errors raised by the INSERT statements.", fr: "Un bloc TRY...CATCH peut être ajouté au corps pour gérer les erreurs déclenchées par les instructions INSERT." } }
    - { id: e, text: { en: "The body can be extended to write each call to a table named Sales.SummaryLog.", fr: "Le corps peut être complété pour écrire chaque appel dans une table nommée Sales.SummaryLog." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      APPLY evaluates a table-valued function for each row of the left table source and can pass a column of that table as the argument. Multi-statement table-valued functions have a fixed row estimate, but starting with SQL Server 2017 (14.x), plans that use them can benefit from interleaved execution, which uses the actual cardinality of the function instead of the fixed estimate.
    fr: |
      APPLY évalue une fonction table pour chaque ligne de la source de table de gauche et peut passer une colonne de cette table comme argument. Les fonctions table à instructions multiples ont une estimation fixe du nombre de lignes, mais depuis SQL Server 2017 (14.x), les plans qui les utilisent peuvent bénéficier de l'exécution entrelacée, qui utilise la cardinalité réelle de la fonction au lieu de l'estimation fixe.
  options:
    b: { en: "Only inline table-valued functions are expanded into the calling query; a multi-statement function returns an opaque table variable.", fr: "Seules les fonctions table inline sont développées dans la requête appelante ; une fonction à instructions multiples renvoie une variable de table opaque." }
    d: { en: "TRY...CATCH is not allowed in the body of a user-defined function.", fr: "TRY...CATCH n'est pas autorisé dans le corps d'une fonction définie par l'utilisateur." }
    e: { en: "A function cannot modify the database state; it can insert only into its local table variables.", fr: "Une fonction ne peut pas modifier l'état de la base de données ; elle ne peut insérer que dans ses variables de table locales." }
