id: dp800-1a-split-next-used
objective: "1.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a SQL Server 2025 database. The **Sales.Orders** table is partitioned by year by the partition function **PF_OrderYear** (RANGE RIGHT) and the partition scheme **PS_OrderYear**, which maps each year to its own filegroup. The last partition, which starts on 2027-01-01, is empty.

    You need to add a boundary for 2028-01-01 so that the new partition is stored on a new filegroup named **FG2028**. The solution must avoid moving data.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'une base de données SQL Server 2025. La table **Sales.Orders** est partitionnée par année par la fonction de partition **PF_OrderYear** (RANGE RIGHT) et le schéma de partition **PS_OrderYear**, qui mappe chaque année sur son propre groupe de fichiers. La dernière partition, qui commence au 2027-01-01, est vide.

    Vous devez ajouter une limite pour le 2028-01-01 afin que la nouvelle partition soit stockée sur un nouveau groupe de fichiers nommé **FG2028**. La solution doit éviter tout déplacement de données.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: split, text: { en: "Run ALTER PARTITION FUNCTION PF_OrderYear() SPLIT RANGE ('2028-01-01').", fr: "Exécuter ALTER PARTITION FUNCTION PF_OrderYear() SPLIT RANGE ('2028-01-01')." } }
    - { id: fg, text: { en: "Add a filegroup named FG2028 to the database.", fr: "Ajouter à la base de données un groupe de fichiers nommé FG2028." } }
    - { id: nextused, text: { en: "Run ALTER PARTITION SCHEME PS_OrderYear NEXT USED FG2028.", fr: "Exécuter ALTER PARTITION SCHEME PS_OrderYear NEXT USED FG2028." } }
    - { id: file, text: { en: "Add a data file to FG2028.", fr: "Ajouter un fichier de données à FG2028." } }
    - { id: merge, text: { en: "Run ALTER PARTITION FUNCTION PF_OrderYear() MERGE RANGE ('2027-01-01').", fr: "Exécuter ALTER PARTITION FUNCTION PF_OrderYear() MERGE RANGE ('2027-01-01')." } }
    - { id: newps, text: { en: "Create a new partition scheme that maps PF_OrderYear to FG2028.", fr: "Créer un nouveau schéma de partition qui mappe PF_OrderYear sur FG2028." } }
answer:
  sequence: [ fg, file, nextused, split ]
explanation:
  correct:
    en: |
      The filegroup must exist and contain a file before it can store data. Before a SPLIT, every partition scheme that uses the function needs a NEXT USED filegroup, otherwise ALTER PARTITION FUNCTION fails. Splitting the empty last partition then creates the new partition without moving rows.
    fr: |
      Le groupe de fichiers doit exister et contenir un fichier avant de pouvoir stocker des données. Avant un SPLIT, chaque schéma de partition qui utilise la fonction doit disposer d'un groupe de fichiers NEXT USED, faute de quoi ALTER PARTITION FUNCTION échoue. Fractionner la dernière partition, qui est vide, crée ensuite la nouvelle partition sans déplacer de lignes.
  options:
    merge: { en: "MERGE removes a boundary; the requirement is to add one.", fr: "MERGE supprime une limite ; l'exigence est d'en ajouter une." }
    newps: { en: "The table stays on PS_OrderYear; a new scheme would require rebuilding the table on it.", fr: "La table reste sur PS_OrderYear ; un nouveau schéma exigerait de reconstruire la table sur celui-ci." }
references:
  - title: ALTER PARTITION FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-partition-function-transact-sql
