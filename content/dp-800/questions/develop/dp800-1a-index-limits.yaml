id: dp800-1a-index-limits
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are designing a table named **Catalog.Product** in SQL Server 2025. Several columns are variable-length text columns, and the table will need many indexes.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez une table nommée **Catalog.Product** dans SQL Server 2025. Plusieurs colonnes sont des colonnes de texte de longueur variable, et la table aura besoin de nombreux index.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The key of a clustered index can be up to 1,700 bytes.
        fr: La clé d'un index cluster peut atteindre 1 700 octets.
    - id: s2
      text:
        en: The table can have up to 999 nonclustered indexes.
        fr: La table peut avoir jusqu'à 999 index non cluster.
    - id: s3
      text:
        en: When a row exceeds 8,060 bytes, variable-length column values can be moved off-row.
        fr: Lorsqu'une ligne dépasse 8 060 octets, les valeurs des colonnes de longueur variable peuvent être déplacées hors ligne.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A clustered index key is limited to 900 bytes; 1,700 bytes is the limit for a nonclustered index key. A table can have one clustered index and up to 999 nonclustered indexes. An in-row record is limited to 8,060 bytes, and row-overflow storage pushes variable-length values off-row, keeping a 24-byte pointer in the row.
    fr: |
      La clé d'un index cluster est limitée à 900 octets ; 1 700 octets est la limite de la clé d'un index non cluster. Une table peut avoir un index cluster et jusqu'à 999 index non cluster. Un enregistrement dans la ligne est limité à 8 060 octets, et le stockage de dépassement de ligne déplace les valeurs de longueur variable hors ligne en conservant un pointeur de 24 octets dans la ligne.
references:
  - title: Maximum capacity specifications for SQL Server
    url: https://learn.microsoft.com/en-us/sql/sql-server/maximum-capacity-specifications-for-sql-server
