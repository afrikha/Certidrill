id: dp800-sr1-order-number-1
objective: "1.1.5"
type: series_yesno
series: dp800-sr1-order-number
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You define OrderNo as an identity column in each table.
  fr: Vous définissez OrderNo comme colonne d'identité dans chaque table.
body:
  solution:
    en: |
      In the `CREATE TABLE` statement of each table, you define the column as follows:

      ```sql
      OrderNo int IDENTITY(500000, 1) NOT NULL PRIMARY KEY
      ```
    fr: |
      Dans l'instruction `CREATE TABLE` de chaque table, vous définissez la colonne comme suit :

      ```sql
      OrderNo int IDENTITY(500000, 1) NOT NULL PRIMARY KEY
      ```
answer: { value: false }
explanation:
  correct:
    en: An identity column generates values for its own table only, so each table keeps a separate counter. Both tables would assign 500000, 500001 and so on, and the same order number would appear in Sales.WebOrder and Sales.StoreOrder. One series of numbers shared by several tables requires a sequence object.
    fr: "Une colonne d'identité génère des valeurs pour sa propre table uniquement : chaque table conserve un compteur distinct. Les deux tables attribueraient 500000, 500001, etc., et un même numéro de commande apparaîtrait dans Sales.WebOrder et dans Sales.StoreOrder. Une série de numéros partagée par plusieurs tables nécessite un objet séquence."
references:
  - title: Sequence Numbers
    url: https://learn.microsoft.com/en-us/sql/relational-databases/sequence-numbers/sequence-numbers
