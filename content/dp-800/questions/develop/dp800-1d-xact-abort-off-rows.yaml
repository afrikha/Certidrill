id: dp800-1d-xact-abort-off-rows
objective: "1.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.ShipmentLine. The ShipmentID column of dbo.ShipmentLine has a FOREIGN KEY constraint that references dbo.Shipment. dbo.Shipment contains a row for ShipmentID 10 but no row for ShipmentID 99, and dbo.ShipmentLine is empty.

    You run the following batch.

    ```sql
    SET XACT_ABORT OFF;
    BEGIN TRANSACTION;
        INSERT INTO dbo.ShipmentLine (ShipmentID, LineNumber) VALUES (10, 1);
        INSERT INTO dbo.ShipmentLine (ShipmentID, LineNumber) VALUES (99, 2);
        INSERT INTO dbo.ShipmentLine (ShipmentID, LineNumber) VALUES (10, 3);
    COMMIT TRANSACTION;
    ```

    Which rows does dbo.ShipmentLine contain after the batch completes?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.ShipmentLine. La colonne ShipmentID de dbo.ShipmentLine possède une contrainte FOREIGN KEY qui référence dbo.Shipment. dbo.Shipment contient une ligne pour ShipmentID 10 mais aucune ligne pour ShipmentID 99, et dbo.ShipmentLine est vide.

    Vous exécutez le lot suivant.

    ```sql
    SET XACT_ABORT OFF;
    BEGIN TRANSACTION;
        INSERT INTO dbo.ShipmentLine (ShipmentID, LineNumber) VALUES (10, 1);
        INSERT INTO dbo.ShipmentLine (ShipmentID, LineNumber) VALUES (99, 2);
        INSERT INTO dbo.ShipmentLine (ShipmentID, LineNumber) VALUES (10, 3);
    COMMIT TRANSACTION;
    ```

    Quelles lignes dbo.ShipmentLine contient-elle à la fin du lot ?
body:
  options:
    - { id: a, text: { en: "No rows, because the foreign key error rolls back the whole transaction", fr: "Aucune ligne, car l'erreur de clé étrangère annule toute la transaction" } }
    - { id: b, text: { en: "Line 1 only, because the batch stops at the foreign key error", fr: "La ligne 1 uniquement, car le lot s'arrête à l'erreur de clé étrangère" } }
    - { id: c, text: { en: "Lines 1 and 3, committed by the COMMIT TRANSACTION statement", fr: "Les lignes 1 et 3, validées par l'instruction COMMIT TRANSACTION" } }
    - { id: d, text: { en: "Lines 1 and 3, in a transaction that stays open after the batch", fr: "Les lignes 1 et 3, dans une transaction qui reste ouverte après le lot" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With SET XACT_ABORT OFF, a constraint violation rolls back only the statement that raised it, and the transaction continues. The third INSERT runs and COMMIT TRANSACTION commits lines 1 and 3. With SET XACT_ABORT ON, the same error would roll back the entire transaction.
    fr: |
      Avec SET XACT_ABORT OFF, une violation de contrainte n'annule que l'instruction qui l'a provoquée, et la transaction continue. Le troisième INSERT s'exécute et COMMIT TRANSACTION valide les lignes 1 et 3. Avec SET XACT_ABORT ON, la même erreur annulerait toute la transaction.
  options:
    a: { en: "Rolling back the whole transaction is the behavior of SET XACT_ABORT ON, not OFF.", fr: "L'annulation de toute la transaction est le comportement de SET XACT_ABORT ON, pas OFF." }
    b: { en: "A foreign key violation doesn't stop the batch; the following statements still run.", fr: "Une violation de clé étrangère n'arrête pas le lot : les instructions suivantes s'exécutent toujours." }
    d: { en: "Execution continues to COMMIT TRANSACTION, which commits the transaction.", fr: "L'exécution continue jusqu'à COMMIT TRANSACTION, qui valide la transaction." }
references:
  - title: SET XACT_ABORT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-xact-abort-transact-sql
