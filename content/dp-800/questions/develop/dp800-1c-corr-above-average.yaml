id: dp800-1c-corr-above-average
objective: "1.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a table named **Sales.Orders** that has the columns OrderID, CustomerID and Amount (decimal(10, 2), NOT NULL).

    You need to return the orders whose Amount is greater than the average Amount of the orders of the same customer.

    Which two queries can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une table nommée **Sales.Orders** qui contient les colonnes OrderID, CustomerID et Amount (decimal(10, 2), NOT NULL).

    Vous devez renvoyer les commandes dont le montant Amount est supérieur au montant moyen des commandes du même client.

    Quelles sont les deux requêtes que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: "`SELECT o.OrderID, o.CustomerID, o.Amount FROM Sales.Orders AS o WHERE o.Amount > (SELECT AVG(o2.Amount) FROM Sales.Orders AS o2 WHERE o2.CustomerID = o.CustomerID);`"
    - id: b
      text: "`SELECT o.OrderID, o.CustomerID, o.Amount FROM Sales.Orders AS o WHERE o.Amount > (SELECT AVG(o2.Amount) FROM Sales.Orders AS o2);`"
    - id: c
      text: "`WITH x AS (SELECT OrderID, CustomerID, Amount, AVG(Amount) OVER (PARTITION BY CustomerID) AS CustAvg FROM Sales.Orders) SELECT OrderID, CustomerID, Amount FROM x WHERE Amount > CustAvg;`"
    - id: d
      text: "`SELECT OrderID, CustomerID, Amount FROM Sales.Orders WHERE Amount > AVG(Amount) OVER (PARTITION BY CustomerID);`"
    - id: e
      text: "`SELECT o.OrderID, o.CustomerID, o.Amount FROM Sales.Orders AS o WHERE o.Amount > ANY (SELECT o2.Amount FROM Sales.Orders AS o2 WHERE o2.CustomerID = o.CustomerID);`"
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      The correlated subquery references o.CustomerID, so it computes the average of the current order's customer for each outer row. The window function AVG(...) OVER (PARTITION BY CustomerID) computes the same per-customer average on every row; because a window function can't appear in WHERE, it is computed in a CTE and filtered in the outer query.
    fr: |
      La sous-requête corrélée référence o.CustomerID : elle calcule, pour chaque ligne externe, la moyenne du client de la commande courante. La fonction de fenêtre AVG(...) OVER (PARTITION BY CustomerID) calcule la même moyenne par client sur chaque ligne ; comme une fonction de fenêtre ne peut pas figurer dans WHERE, elle est calculée dans une CTE et filtrée dans la requête externe.
  options:
    b: { en: "The subquery isn't correlated: it compares each order with the average of all orders.", fr: "La sous-requête n'est pas corrélée : elle compare chaque commande à la moyenne de toutes les commandes." }
    d: { en: "Window functions aren't allowed in the WHERE clause; the statement fails.", fr: "Les fonctions de fenêtre ne sont pas autorisées dans la clause WHERE ; l'instruction échoue." }
    e: { en: "> ANY means greater than at least one value, that is, greater than the customer's minimum, not the average.", fr: "> ANY signifie supérieur à au moins une valeur, c'est-à-dire au minimum du client, pas à sa moyenne." }
references:
  - title: Subqueries (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/subqueries
  - title: SELECT - OVER clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-over-clause-transact-sql
