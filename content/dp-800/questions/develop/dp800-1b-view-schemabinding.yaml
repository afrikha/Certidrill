id: dp800-1b-view-schemabinding
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **SalesDb** that contains a view named Sales.vCustomerContact. The view selects the CustomerID, FullName and Email columns of the Sales.Customer table by using two-part names.

    Last week, a developer changed the data type of the Email column, and the reports that query the view failed.

    You need to ensure that no one can alter or drop the columns of Sales.Customer that the view references for as long as the view exists.

    What should you add to the view definition?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **SalesDb** qui contient une vue nommée Sales.vCustomerContact. La vue sélectionne les colonnes CustomerID, FullName et Email de la table Sales.Customer en utilisant des noms en deux parties.

    La semaine dernière, un développeur a modifié le type de données de la colonne Email, et les rapports qui interrogent la vue ont échoué.

    Vous devez vous assurer que personne ne peut modifier ni supprimer les colonnes de Sales.Customer référencées par la vue tant que la vue existe.

    Que devez-vous ajouter à la définition de la vue ?
body:
  options:
    - { id: a, text: "WITH CHECK OPTION" }
    - { id: b, text: "WITH VIEW_METADATA" }
    - { id: c, text: "WITH SCHEMABINDING" }
    - { id: d, text: "WITH ENCRYPTION" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      WITH SCHEMABINDING binds the view to the schema of its base tables: the referenced tables and columns cannot be modified in a way that would affect the view definition until the view is dropped or altered without the option. It requires two-part names, which the view already uses.
    fr: |
      WITH SCHEMABINDING lie la vue au schéma de ses tables de base : les tables et colonnes référencées ne peuvent pas être modifiées d'une manière qui affecterait la définition de la vue tant que celle-ci n'est pas supprimée ou modifiée sans cette option. L'option exige des noms en deux parties, que la vue utilise déjà.
  options:
    a: { en: "WITH CHECK OPTION controls the rows that INSERT and UPDATE statements through the view can produce; it does not protect the base table schema.", fr: "WITH CHECK OPTION contrôle les lignes que les instructions INSERT et UPDATE exécutées par la vue peuvent produire ; elle ne protège pas le schéma de la table de base." }
    b: { en: "WITH VIEW_METADATA makes client APIs see the view's metadata instead of the base tables'; it does not block schema changes.", fr: "WITH VIEW_METADATA fait voir aux API clientes les métadonnées de la vue au lieu de celles des tables de base ; elle ne bloque pas les modifications de schéma." }
    d: { en: "WITH ENCRYPTION obfuscates the text of the view definition; it does not prevent changes to the tables.", fr: "WITH ENCRYPTION masque le texte de la définition de la vue ; elle n'empêche pas les modifications des tables." }
references:
  - title: CREATE VIEW (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-view-transact-sql
