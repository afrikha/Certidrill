id: dp800-1b-sfn-inlineable
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You manage an Azure SQL database for Adatum. The database uses compatibility level 160 and contains about 300 scalar user-defined functions.

    Before you tune the slowest reports, you need to list the scalar functions whose definitions make them eligible for scalar UDF inlining.

    Which catalog view should you query?
  fr: |
    Vous gérez une base de données Azure SQL pour Adatum. La base utilise le niveau de compatibilité 160 et contient environ 300 fonctions scalaires définies par l'utilisateur.

    Avant d'optimiser les rapports les plus lents, vous devez lister les fonctions scalaires dont la définition les rend éligibles à l'incorporation des UDF scalaires (scalar UDF inlining).

    Quelle vue de catalogue devez-vous interroger ?
body:
  options:
    - { id: a, text: { en: "sys.database_scoped_configurations, filtered on the TSQL_SCALAR_UDF_INLINING row", fr: "sys.database_scoped_configurations, filtrée sur la ligne TSQL_SCALAR_UDF_INLINING" } }
    - { id: b, text: { en: "sys.objects, filtered on the is_ms_shipped column", fr: "sys.objects, filtrée sur la colonne is_ms_shipped" } }
    - { id: c, text: { en: "sys.sql_modules, filtered on the is_inlineable column", fr: "sys.sql_modules, filtrée sur la colonne is_inlineable" } }
    - { id: d, text: { en: "sys.parameters, filtered on the is_output column", fr: "sys.parameters, filtrée sur la colonne is_output" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The is_inlineable column of sys.sql_modules is 1 when the constructs used in the function make it eligible for inlining, and 0 otherwise. The value is derived from the definition; it does not guarantee that a given query will inline the function at compile time.
    fr: |
      La colonne is_inlineable de sys.sql_modules vaut 1 quand les constructions utilisées dans la fonction la rendent éligible à l'incorporation, et 0 sinon. La valeur est déduite de la définition ; elle ne garantit pas qu'une requête donnée incorporera la fonction à la compilation.
  options:
    a: { en: "This view shows whether inlining is enabled for the whole database, not which functions are eligible.", fr: "Cette vue indique si l'incorporation est activée pour toute la base, pas quelles fonctions sont éligibles." }
    b: { en: "is_ms_shipped identifies objects created by an internal component; it says nothing about inlining.", fr: "is_ms_shipped identifie les objets créés par un composant interne ; elle n'indique rien sur l'incorporation." }
    d: { en: "sys.parameters describes the parameters of modules; is_output identifies output parameters, which functions do not support.", fr: "sys.parameters décrit les paramètres des modules ; is_output identifie les paramètres de sortie, que les fonctions ne prennent pas en charge." }
references:
  - title: Scalar UDF Inlining
    url: https://learn.microsoft.com/en-us/sql/relational-databases/user-defined-functions/scalar-udf-inlining
