id: dp800-1c-json-null-defaults
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You run the following statement in an Azure SQL database.

    ```sql
    SELECT JSON_OBJECT('id': 7, 'note': NULL) AS A,
           JSON_ARRAY('x', NULL, 'y') AS B;
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous exécutez l'instruction suivante dans une base de données Azure SQL.

    ```sql
    SELECT JSON_OBJECT('id': 7, 'note': NULL) AS A,
           JSON_ARRAY('x', NULL, 'y') AS B;
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Column A contains `{\"id\":7,\"note\":null}`.", fr: "La colonne A contient `{\"id\":7,\"note\":null}`." } }
    - { id: b, text: { en: "Column A contains `{\"id\":7}`.", fr: "La colonne A contient `{\"id\":7}`." } }
    - { id: c, text: { en: "Column B contains `[\"x\",\"y\"]`.", fr: "La colonne B contient `[\"x\",\"y\"]`." } }
    - { id: d, text: { en: "Column B contains `[\"x\",null,\"y\"]`.", fr: "La colonne B contient `[\"x\",null,\"y\"]`." } }
    - { id: e, text: { en: "Columns A and B are returned as the json data type.", fr: "Les colonnes A et B sont renvoyées avec le type de données json." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      The default NULL clause differs between the constructors. JSON_OBJECT uses NULL ON NULL by default, so the note key is kept with a JSON null. JSON_ARRAY uses ABSENT ON NULL by default, so the NULL element is omitted.
    fr: |
      La clause NULL par défaut diffère selon le constructeur. JSON_OBJECT utilise NULL ON NULL par défaut : la clé note est conservée avec un null JSON. JSON_ARRAY utilise ABSENT ON NULL par défaut : l'élément NULL est omis.
  options:
    b: { en: "Omitting the key requires ABSENT ON NULL, which isn't the default of JSON_OBJECT.", fr: "Omettre la clé exige ABSENT ON NULL, qui n'est pas la valeur par défaut de JSON_OBJECT." }
    d: { en: "Keeping the null element requires NULL ON NULL, which isn't the default of JSON_ARRAY.", fr: "Conserver l'élément null exige NULL ON NULL, qui n'est pas la valeur par défaut de JSON_ARRAY." }
    e: { en: "Both functions return nvarchar(max) unless RETURNING json is specified.", fr: "Les deux fonctions renvoient un nvarchar(max), sauf si RETURNING json est spécifié." }
references:
  - title: JSON_OBJECT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-object-transact-sql
  - title: JSON_ARRAY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-array-transact-sql
