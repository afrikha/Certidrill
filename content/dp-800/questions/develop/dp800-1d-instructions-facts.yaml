id: dp800-1d-instructions-facts
objective: "1.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your team adds GitHub Copilot custom instructions to a repository that contains a SQL database project. The developers use Visual Studio Code with the MSSQL extension.

    Which two statements about the instructions are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe ajoute des instructions personnalisées GitHub Copilot à un dépôt qui contient un projet de base de données SQL. Les développeurs utilisent Visual Studio Code avec l'extension MSSQL.

    Quelles sont les deux affirmations vraies concernant ces instructions ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A matching .instructions.md file is added to chat requests automatically, without a slash command.", fr: "Un fichier .instructions.md correspondant est ajouté automatiquement aux requêtes de conversation, sans commande slash." } }
    - { id: b, text: { en: "Instructions guarantee that the generated code complies with the rules, so code review can be skipped.", fr: "Les instructions garantissent que le code généré respecte les règles : la revue de code peut être omise." } }
    - { id: c, text: { en: "The .github/copilot-instructions.md file is applied only when its frontmatter contains applyTo.", fr: "Le fichier .github/copilot-instructions.md n'est appliqué que si son en-tête contient applyTo." } }
    - { id: d, text: { en: "You can confirm that the instructions were sent by checking the request in the GitHub Copilot Chat output log.", fr: "Vous pouvez vérifier que les instructions ont été envoyées en consultant la requête dans le journal de sortie de GitHub Copilot Chat." } }
    - { id: e, text: { en: "A .prompt.md file in .github/prompts is added to every chat request automatically.", fr: "Un fichier .prompt.md placé dans .github/prompts est ajouté automatiquement à chaque requête de conversation." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      Copilot injects matching instruction files into every request automatically; no slash command is required. To check, select View > Output, choose GitHub Copilot Chat, and send a prompt: the request payload, including the custom instructions, appears in the log.
    fr: |
      Copilot injecte automatiquement les fichiers d'instructions correspondants dans chaque requête ; aucune commande slash n'est nécessaire. Pour le vérifier, sélectionnez View > Output, choisissez GitHub Copilot Chat et envoyez un prompt : la charge utile de la requête, instructions personnalisées comprises, apparaît dans le journal.
  options:
    b: { en: "Copilot considers instructions as context; compliance isn't guaranteed, so review and tests remain necessary.", fr: "Copilot prend les instructions en compte comme contexte ; la conformité n'est pas garantie, la revue et les tests restent nécessaires." }
    c: { en: "The repository-wide file needs no applyTo; it applies to every request in the repository.", fr: "Le fichier de niveau dépôt n'a pas besoin d'applyTo : il s'applique à toutes les requêtes du dépôt." }
    e: { en: "Prompt files are reusable templates that a developer references in the chat; they aren't applied automatically.", fr: "Les fichiers de prompt sont des modèles réutilisables qu'un développeur référence dans la conversation ; ils ne sont pas appliqués automatiquement." }
references:
  - title: "Quickstart: Use custom instructions to align GitHub Copilot with your T-SQL conventions"
    url: https://learn.microsoft.com/en-us/sql/tools/visual-studio-code-extensions/github-copilot/custom-instructions
  - title: Create and configure GitHub Copilot instruction files
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/6-create-configure-copilot-instruction-files
