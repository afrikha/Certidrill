id: dp800-1a-nocheck-trusted
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A database administrator at Northwind added a constraint by running the following statement.

    ```sql
    ALTER TABLE Sales.Orders WITH NOCHECK
        ADD CONSTRAINT CK_Orders_Amount CHECK (Amount >= 0);
    ```

    The constraint is enabled, but the query optimizer doesn't take it into account. You have corrected the existing rows that had a negative amount.

    You need to validate all the existing rows against the constraint so that the optimizer can rely on it.

    Which statement should you run?
  fr: |
    Un administrateur de bases de données de Northwind a ajouté une contrainte en exécutant l'instruction suivante.

    ```sql
    ALTER TABLE Sales.Orders WITH NOCHECK
        ADD CONSTRAINT CK_Orders_Amount CHECK (Amount >= 0);
    ```

    La contrainte est activée, mais l'optimiseur de requête n'en tient pas compte. Vous avez corrigé les lignes existantes qui avaient un montant négatif.

    Vous devez valider toutes les lignes existantes par rapport à la contrainte pour que l'optimiseur puisse s'appuyer sur elle.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER TABLE Sales.Orders CHECK CONSTRAINT CK_Orders_Amount;" }
    - { id: b, text: "ALTER TABLE Sales.Orders WITH NOCHECK CHECK CONSTRAINT CK_Orders_Amount;" }
    - { id: c, text: "ALTER TABLE Sales.Orders NOCHECK CONSTRAINT CK_Orders_Amount;" }
    - { id: d, text: "ALTER TABLE Sales.Orders WITH CHECK CHECK CONSTRAINT CK_Orders_Amount;" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A constraint added WITH NOCHECK skips the existing rows, and the optimizer ignores it until it is re-enabled WITH CHECK. WITH CHECK CHECK CONSTRAINT validates every existing row and makes the constraint trusted again.
    fr: |
      Une contrainte ajoutée avec WITH NOCHECK ignore les lignes existantes, et l'optimiseur n'en tient pas compte tant qu'elle n'est pas réactivée avec WITH CHECK. WITH CHECK CHECK CONSTRAINT valide toutes les lignes existantes et rend la contrainte de nouveau approuvée.
  options:
    a: { en: "Without WITH CHECK, a re-enabled constraint defaults to WITH NOCHECK, so existing rows aren't validated.", fr: "Sans WITH CHECK, une contrainte réactivée utilise WITH NOCHECK par défaut : les lignes existantes ne sont pas validées." }
    b: { en: "WITH NOCHECK explicitly skips the validation of existing rows.", fr: "WITH NOCHECK ignore explicitement la validation des lignes existantes." }
    c: { en: "NOCHECK CONSTRAINT disables the constraint for future inserts and updates.", fr: "NOCHECK CONSTRAINT désactive la contrainte pour les insertions et mises à jour futures." }
references:
  - title: ALTER TABLE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-table-transact-sql
