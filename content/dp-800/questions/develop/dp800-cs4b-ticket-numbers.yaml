id: dp800-cs4b-ticket-numbers
objective: "1.1.5"
type: single
caseStudy: dp800-cs4b-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You are designing the TicketNo column (bigint) of dbo.WebTickets and dbo.KioskTickets. The website and the kiosks sell tickets concurrently.

    You need to recommend a numbering solution that meets the ticketing requirements.

    What should you recommend?
  fr: |
    Vous concevez la colonne TicketNo (bigint) de dbo.WebTickets et de dbo.KioskTickets. Le site web et les bornes vendent des billets simultanément.

    Vous devez recommander une solution de numérotation qui satisfait les exigences de billetterie.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Define TicketNo as an IDENTITY column in both tables, with seeds far apart. In dbo.SellKioskTicket, read SCOPE_IDENTITY() to get the ticket number."
        fr: "Définir TicketNo comme une colonne IDENTITY dans les deux tables, avec des valeurs initiales très éloignées. Dans dbo.SellKioskTicket, lire SCOPE_IDENTITY() pour obtenir le numéro de billet."
    - id: b
      text:
        en: "Create a sequence, and define TicketNo in both tables as a computed column with the expression NEXT VALUE FOR. In dbo.SellKioskTicket, read the column after the insert."
        fr: "Créer une séquence, et définir TicketNo dans les deux tables comme une colonne calculée avec l'expression NEXT VALUE FOR. Dans dbo.SellKioskTicket, lire la colonne après l'insertion."
    - id: c
      text:
        en: "Create a sequence, and add a DEFAULT constraint with NEXT VALUE FOR on TicketNo in both tables. In dbo.SellKioskTicket, assign NEXT VALUE FOR to a variable before the insert."
        fr: "Créer une séquence, et ajouter une contrainte DEFAULT avec NEXT VALUE FOR sur TicketNo dans les deux tables. Dans dbo.SellKioskTicket, affecter NEXT VALUE FOR à une variable avant l'insertion."
    - id: d
      text:
        en: "Define TicketNo as an IDENTITY column in dbo.WebTickets. In dbo.SellKioskTicket, compute the highest TicketNo of both tables plus one before the insert."
        fr: "Définir TicketNo comme une colonne IDENTITY dans dbo.WebTickets. Dans dbo.SellKioskTicket, calculer le TicketNo le plus élevé des deux tables plus un avant l'insertion."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A sequence is independent of any table, so one sequence can feed the DEFAULT constraints of several tables, and the website gets a number without supplying it. NEXT VALUE FOR can also be assigned to a variable, so the kiosk procedure knows the number before the insert. Values are consumed even when a transaction rolls back, which only creates gaps, and the requirements accept them.
    fr: |
      Une séquence est indépendante de toute table : une même séquence peut alimenter les contraintes DEFAULT de plusieurs tables, et le site web obtient un numéro sans le fournir. NEXT VALUE FOR peut aussi être affecté à une variable : la procédure des bornes connaît le numéro avant l'insertion. Les valeurs sont consommées même quand une transaction est annulée, ce qui ne crée que des trous, et les exigences les acceptent.
  options:
    a: { en: "Two IDENTITY columns are two separate series, and SCOPE_IDENTITY() returns the number only after the row is inserted.", fr: "Deux colonnes IDENTITY forment deux séries distinctes, et SCOPE_IDENTITY() ne renvoie le numéro qu'après l'insertion de la ligne." }
    b: { en: "NEXT VALUE FOR isn't allowed in a computed column; it's allowed in a DEFAULT constraint.", fr: "NEXT VALUE FOR n'est pas autorisé dans une colonne calculée ; il est autorisé dans une contrainte DEFAULT." }
    d: { en: "Two concurrent sales can read the same maximum and get the same number, and the website's IDENTITY values can collide with the kiosk numbers.", fr: "Deux ventes simultanées peuvent lire le même maximum et obtenir le même numéro, et les valeurs IDENTITY du site web peuvent entrer en collision avec les numéros des bornes." }
references:
  - title: NEXT VALUE FOR (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/next-value-for-transact-sql
  - title: CREATE SEQUENCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-sequence-transact-sql
