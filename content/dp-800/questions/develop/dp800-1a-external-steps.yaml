id: dp800-1a-external-steps
objective: "1.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Azure SQL database named **SalesDB** and archives old orders as Parquet files in an Azure Blob Storage container. You have a SAS token that grants Read and List permissions on the container. SalesDB has no database master key. An external file format named **ParquetFormat** already exists in SalesDB.

    You need to create an external table in SalesDB that queries the Parquet files in place by using data virtualization.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind dispose d'une base de données Azure SQL nommée **SalesDB** et archive les anciennes commandes sous forme de fichiers Parquet dans un conteneur du Stockage Blob Azure. Vous disposez d'un jeton SAS qui accorde les autorisations Read et List sur le conteneur. SalesDB n'a pas de clé principale de base de données. Un format de fichier externe nommé **ParquetFormat** existe déjà dans SalesDB.

    Vous devez créer dans SalesDB une table externe qui interroge les fichiers Parquet sur place à l'aide de la virtualisation des données.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: tbl, text: { en: "Create an external table that references the data source and ParquetFormat.", fr: "Créer une table externe qui référence la source de données et ParquetFormat." } }
    - { id: cred, text: { en: "Create a database scoped credential with IDENTITY = 'SHARED ACCESS SIGNATURE' and the SAS token as the secret.", fr: "Créer des informations d'identification délimitées à la base de données avec IDENTITY = 'SHARED ACCESS SIGNATURE' et le jeton SAS comme secret." } }
    - { id: mk, text: { en: "Create a database master key.", fr: "Créer une clé principale de base de données." } }
    - { id: ds, text: { en: "Create an external data source whose LOCATION starts with abs:// and that uses the credential.", fr: "Créer une source de données externe dont l'emplacement (LOCATION) commence par abs:// et qui utilise les informations d'identification." } }
    - { id: https, text: { en: "Create an external data source whose LOCATION starts with https:// and that uses the credential.", fr: "Créer une source de données externe dont l'emplacement (LOCATION) commence par https:// et qui utilise les informations d'identification." } }
    - { id: cetas, text: { en: "Run CREATE EXTERNAL TABLE AS SELECT to export the archived orders to the container.", fr: "Exécuter CREATE EXTERNAL TABLE AS SELECT pour exporter les commandes archivées vers le conteneur." } }
answer:
  sequence: [ mk, cred, ds, tbl ]
explanation:
  correct:
    en: |
      A credential that contains a secret, such as a SAS token, needs a database master key to encrypt it, so the key comes first. The database scoped credential holds the SAS token, the external data source points to the container with the abs:// prefix and uses the credential, and the external table combines the data source and the existing file format.
    fr: |
      Des informations d'identification qui contiennent un secret, comme un jeton SAS, nécessitent une clé principale de base de données pour le chiffrer : la clé vient donc en premier. Les informations d'identification délimitées à la base de données contiennent le jeton SAS, la source de données externe pointe vers le conteneur avec le préfixe abs:// et utilise les informations d'identification, et la table externe associe la source de données et le format de fichier existant.
  options:
    https: { en: "External tables in Azure SQL Database require the endpoint-specific abs:// or adls:// prefix; the generic https:// prefix isn't supported for them.", fr: "Les tables externes d'Azure SQL Database exigent le préfixe propre au point de terminaison abs:// ou adls:// ; le préfixe générique https:// n'est pas pris en charge pour elles." }
    cetas: { en: "CREATE EXTERNAL TABLE AS SELECT isn't available in Azure SQL Database, and the goal is to read existing files, not to export data.", fr: "CREATE EXTERNAL TABLE AS SELECT n'est pas disponible dans Azure SQL Database, et l'objectif est de lire des fichiers existants, pas d'exporter des données." }
references:
  - title: Data virtualization with Azure SQL Database (Preview)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/data-virtualization-overview
