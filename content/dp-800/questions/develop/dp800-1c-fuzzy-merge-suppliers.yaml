id: dp800-1c-fuzzy-merge-suppliers
objective: "1.3.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a database named **Purchasing** on a SQL Server 2025 instance that has CU11 or a later cumulative update installed. All the database scoped configurations have their default values. The database contains the following tables:

    - **dbo.Supplier**: SupplierID (primary key), Country and SupplierName (nvarchar(200), Windows collation).
    - **dbo.PurchaseOrder**: a SupplierID column with a foreign key that references dbo.Supplier.

    You need to merge near-duplicate suppliers. For each pair whose names have an EDIT_DISTANCE_SIMILARITY of 90 or more, the supplier with the lowest SupplierID is kept. The foreign key must stay enabled during the whole process.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données nommée **Purchasing** sur une instance SQL Server 2025 où la CU11 ou une mise à jour cumulative ultérieure est installée. Toutes les configurations délimitées à la base de données ont leur valeur par défaut. La base de données contient les tables suivantes :

    - **dbo.Supplier** : SupplierID (clé primaire), Country et SupplierName (nvarchar(200), classement Windows).
    - **dbo.PurchaseOrder** : une colonne SupplierID avec une clé étrangère qui référence dbo.Supplier.

    Vous devez fusionner les fournisseurs quasi identiques. Pour chaque paire dont les noms ont une valeur EDIT_DISTANCE_SIMILARITY de 90 ou plus, le fournisseur dont le SupplierID est le plus petit est conservé. La clé étrangère doit rester activée pendant tout le processus.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: preview
      text: { en: "Run `ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;`.", fr: "Exécuter `ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;`." }
    - id: pairs
      text: { en: "Insert into a staging table the pairs of suppliers of the same country whose EDIT_DISTANCE_SIMILARITY is 90 or more, with the SupplierID to keep and the SupplierID to remove.", fr: "Insérer dans une table de travail les paires de fournisseurs d'un même pays dont la valeur EDIT_DISTANCE_SIMILARITY est de 90 ou plus, avec le SupplierID à conserver et le SupplierID à supprimer." }
    - id: repoint
      text: { en: "Update dbo.PurchaseOrder to replace each SupplierID to remove with the SupplierID to keep.", fr: "Mettre à jour dbo.PurchaseOrder pour remplacer chaque SupplierID à supprimer par le SupplierID à conserver." }
    - id: delete
      text: { en: "Delete from dbo.Supplier the suppliers to remove.", fr: "Supprimer de dbo.Supplier les fournisseurs à supprimer." }
    - id: tvf
      text: { en: "Run `ALTER DATABASE SCOPED CONFIGURATION SET ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS = ON;`.", fr: "Exécuter `ALTER DATABASE SCOPED CONFIGURATION SET ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS = ON;`." }
    - id: dropfk
      text: { en: "Drop the foreign key of dbo.PurchaseOrder.", fr: "Supprimer la clé étrangère de dbo.PurchaseOrder." }
answer:
  sequence: [pairs, repoint, delete]
explanation:
  correct:
    en: |
      The staging table records which supplier replaces which. Purchase orders must be moved to the surviving supplier before the duplicates are deleted, otherwise the foreign key blocks the deletion.
    fr: |
      La table de travail enregistre quel fournisseur en remplace un autre. Les bons de commande doivent être rattachés au fournisseur conservé avant la suppression des doublons, sinon la clé étrangère bloque la suppression.
  options:
    preview: { en: "The fuzzy string matching functions are generally available from SQL Server 2025 CU11, so they run without PREVIEW_FEATURES. Only earlier SQL Server 2025 builds need it.", fr: "Les fonctions de correspondance de chaînes floue sont en disponibilité générale depuis SQL Server 2025 CU11 : elles s'exécutent sans PREVIEW_FEATURES. Seules les builds antérieures de SQL Server 2025 en ont besoin." }
    tvf: { en: "This setting applies only to Azure SQL Database and SQL database in Fabric, and it concerns built-in table-valued functions.", fr: "Ce paramètre ne s'applique qu'à Azure SQL Database et à la base de données SQL dans Fabric, et il concerne les fonctions table intégrées." }
    dropfk: { en: "The foreign key must stay enabled, and moving the orders first makes dropping it unnecessary.", fr: "La clé étrangère doit rester activée, et rattacher d'abord les commandes rend sa suppression inutile." }
references:
  - title: What is fuzzy string matching?
    url: https://learn.microsoft.com/en-us/sql/relational-databases/fuzzy-string-match/overview
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
