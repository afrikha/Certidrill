id: dp800-1a-json-type-validate
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys stores customer preference documents in an Azure SQL database. Each document is a JSON object.

    The column that stores the documents must reject any value that isn't a valid JSON object or array, without a CHECK constraint, and must support JSON indexes.

    Which data type should you use for the column?
  fr: |
    Wingtip Toys stocke des documents de préférences client dans une base de données Azure SQL. Chaque document est un objet JSON.

    La colonne qui stocke les documents doit rejeter toute valeur qui n'est pas un objet ou un tableau JSON valide, sans contrainte CHECK, et doit prendre en charge les index JSON.

    Quel type de données devez-vous utiliser pour la colonne ?
body:
  options:
    - { id: a, text: "nvarchar(max)" }
    - { id: b, text: "varbinary(max)" }
    - { id: c, text: json }
    - { id: d, text: xml }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The native json data type stores documents in a parsed binary format and accepts only a JSON object or array (or a SQL NULL), so invalid text is rejected without any constraint. CREATE JSON INDEX can be created only on a json column.
    fr: |
      Le type de données natif json stocke les documents dans un format binaire déjà analysé et n'accepte qu'un objet ou un tableau JSON (ou un NULL SQL) : le texte non valide est rejeté sans aucune contrainte. CREATE JSON INDEX ne peut être créé que sur une colonne json.
  options:
    a: { en: "nvarchar(max) accepts any text; validation would need a CHECK constraint with ISJSON, and JSON indexes don't apply to it.", fr: "nvarchar(max) accepte n'importe quel texte ; la validation exigerait une contrainte CHECK avec ISJSON, et les index JSON ne s'y appliquent pas." }
    b: { en: "varbinary(max) stores raw bytes and performs no JSON validation.", fr: "varbinary(max) stocke des octets bruts et n'effectue aucune validation JSON." }
    d: { en: "xml validates XML documents, not JSON.", fr: "xml valide des documents XML, pas du JSON." }
references:
  - title: JSON data type
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/json-data-type
