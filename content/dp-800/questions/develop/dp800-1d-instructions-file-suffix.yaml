id: dp800-1d-instructions-file-suffix
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at Proseware creates a file named `.github/instructions/tsql-conventions.md` in the workspace. The file starts with frontmatter that sets applyTo to `'**/*.sql'`, followed by naming rules for constraints.

    When the developer asks GitHub Copilot Chat to create a table in a .sql file, the generated constraints don't follow the rules. The GitHub Copilot Chat output log shows that the file isn't included in the request.

    What should the developer do?
  fr: |
    Un développeur de Proseware crée un fichier nommé `.github/instructions/tsql-conventions.md` dans l'espace de travail. Le fichier commence par un en-tête (frontmatter) qui définit applyTo sur `'**/*.sql'`, suivi de règles de nommage des contraintes.

    Quand le développeur demande à GitHub Copilot Chat de créer une table dans un fichier .sql, les contraintes générées ne respectent pas les règles. Le journal de sortie de GitHub Copilot Chat montre que le fichier n'est pas inclus dans la requête.

    Que doit faire le développeur ?
body:
  options:
    - { id: a, text: { en: "Rename the file to tsql-conventions.instructions.md.", fr: "Renommer le fichier en tsql-conventions.instructions.md." } }
    - { id: b, text: { en: "Move the file to the .github/prompts folder.", fr: "Déplacer le fichier dans le dossier .github/prompts." } }
    - { id: c, text: { en: "Change the applyTo value to '*.sql'.", fr: "Remplacer la valeur applyTo par '*.sql'." } }
    - { id: d, text: { en: "Add a description value to the frontmatter of the file.", fr: "Ajouter une valeur description à l'en-tête (frontmatter) du fichier." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Scoped instruction files must be stored as `.github/instructions/<name>.instructions.md`: the .instructions.md suffix is required. Once the file is renamed, Copilot injects it automatically into every request for a file that matches the applyTo glob.
    fr: |
      Les fichiers d'instructions ciblés doivent être stockés sous la forme `.github/instructions/<name>.instructions.md` : le suffixe .instructions.md est obligatoire. Une fois le fichier renommé, Copilot l'injecte automatiquement dans chaque requête portant sur un fichier qui correspond au glob applyTo.
  options:
    b: { en: "The .github/prompts folder holds prompt files that are run on demand, not instructions applied automatically.", fr: "Le dossier .github/prompts contient des fichiers de prompt exécutés à la demande, pas des instructions appliquées automatiquement." }
    c: { en: "The glob already matches .sql files; the file isn't loaded because of its name.", fr: "Le glob correspond déjà aux fichiers .sql : le fichier n'est pas chargé à cause de son nom." }
    d: { en: "Without the .instructions.md suffix, the file isn't recognized as an instruction file, whatever its frontmatter contains.", fr: "Sans le suffixe .instructions.md, le fichier n'est pas reconnu comme fichier d'instructions, quel que soit le contenu de son en-tête." }
references:
  - title: "Quickstart: Use custom instructions to align GitHub Copilot with your T-SQL conventions"
    url: https://learn.microsoft.com/en-us/sql/tools/visual-studio-code-extensions/github-copilot/custom-instructions
