id: dp800-1c-regex-substr-instr
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A table named **Support.Ticket** has a column named Notes that contains text such as `Replaces SO-1001; see also SO-1002 and SO-1003`.

    You need a query that returns, for each ticket:

    - SecondOrderNumber: only the digits of the second order reference, for example `1002`.
    - SecondOrderEnd: the end position of the second order reference.

    How should you complete the Transact-SQL statement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une table nommée **Support.Ticket** contient une colonne nommée Notes qui contient du texte comme `Replaces SO-1001; see also SO-1002 and SO-1003`.

    Vous avez besoin d'une requête qui renvoie, pour chaque ticket :

    - SecondOrderNumber : uniquement les chiffres de la deuxième référence de commande, par exemple `1002`.
    - SecondOrderEnd : la position de fin de la deuxième référence de commande.

    Comment devez-vous compléter l'instruction Transact-SQL ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT TicketID,
           REGEXP_SUBSTR(Notes, 'SO-(\d+)', 1, [[occ]], 'c', [[grp]]) AS SecondOrderNumber,
           REGEXP_INSTR(Notes, 'SO-\d+', 1, 2, [[ret]]) AS SecondOrderEnd
    FROM Support.Ticket;
  slots:
    - id: occ
      options:
        - { id: o1, text: "1" }
        - { id: o2, text: "2" }
        - { id: o3, text: "3" }
    - id: grp
      options:
        - { id: g0, text: "0" }
        - { id: g1, text: "1" }
        - { id: g2, text: "2" }
    - id: ret
      options:
        - { id: r0, text: "0" }
        - { id: r1, text: "1" }
        - { id: r2, text: "2" }
answer:
  values: { occ: o2, grp: g1, ret: r1 }
explanation:
  correct:
    en: |
      The occurrence argument 2 selects the second match. The group argument 1 returns the first capture group, (\d+), instead of the whole match. In REGEXP_INSTR, the return_option argument is 0 for the beginning position and 1 for the end position.
    fr: |
      L'argument occurrence 2 sélectionne la deuxième correspondance. L'argument group 1 renvoie le premier groupe de capture, (\d+), au lieu de la correspondance entière. Dans REGEXP_INSTR, l'argument return_option vaut 0 pour la position de début et 1 pour la position de fin.
  options:
    o1: { en: "Occurrence 1 returns the first reference, 1001.", fr: "L'occurrence 1 renvoie la première référence, 1001." }
    o3: { en: "Occurrence 3 returns the third reference, 1003.", fr: "L'occurrence 3 renvoie la troisième référence, 1003." }
    g0: { en: "Group 0, the default, returns the entire match, SO-1002.", fr: "Le groupe 0, valeur par défaut, renvoie la correspondance entière, SO-1002." }
    g2: { en: "The pattern has only one capture group; group can't be greater than the number of groups.", fr: "Le modèle n'a qu'un groupe de capture ; group ne peut pas dépasser le nombre de groupes." }
    r0: { en: "Return option 0 returns the beginning position of the match.", fr: "L'option de retour 0 renvoie la position de début de la correspondance." }
    r2: { en: "Only 0 and 1 are valid return options; any other value returns an error.", fr: "Seules les options de retour 0 et 1 sont valides ; toute autre valeur renvoie une erreur." }
references:
  - title: REGEXP_SUBSTR (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-substr-transact-sql
  - title: REGEXP_INSTR (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-instr-transact-sql
