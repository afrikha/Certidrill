id: dp800-1a-default-insert
objective: "1.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware has an empty table created by the following statement.

    ```sql
    CREATE TABLE Sales.Lead
    (
        LeadID int IDENTITY(1, 1) NOT NULL CONSTRAINT PK_Lead PRIMARY KEY,
        Email  varchar(100) NOT NULL,
        Status varchar(10) NULL CONSTRAINT DF_Lead_Status DEFAULT ('New'),
        Score  tinyint NOT NULL CONSTRAINT DF_Lead_Score DEFAULT (0)
            CONSTRAINT CK_Lead_Score CHECK (Score <= 100)
    );
    ```

    Each statement in the following table runs separately.

    Answer each prompt by selecting the appropriate statement.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une table vide créée par l'instruction suivante.

    ```sql
    CREATE TABLE Sales.Lead
    (
        LeadID int IDENTITY(1, 1) NOT NULL CONSTRAINT PK_Lead PRIMARY KEY,
        Email  varchar(100) NOT NULL,
        Status varchar(10) NULL CONSTRAINT DF_Lead_Status DEFAULT ('New'),
        Score  tinyint NOT NULL CONSTRAINT DF_Lead_Score DEFAULT (0)
            CONSTRAINT CK_Lead_Score CHECK (Score <= 100)
    );
    ```

    Chaque instruction du tableau suivant s'exécute séparément.

    Répondez à chaque consigne en sélectionnant l'instruction appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The statement that stores NULL in Status", fr: "L'instruction qui stocke NULL dans Status" }
    - id: p2
      text: { en: "The statement that fails", fr: "L'instruction qui échoue" }
  grid:
    header: [{ en: "Statement", fr: "Instruction" }]
    rows:
      - [{ text: "INSERT INTO Sales.Lead (Email) VALUES ('a@contoso.com');", area: i1 }]
      - [{ text: "INSERT INTO Sales.Lead (Email, Status) VALUES ('b@contoso.com', NULL);", area: i2 }]
      - [{ text: "INSERT INTO Sales.Lead (Email, Score) VALUES ('c@contoso.com', NULL);", area: i3 }]
      - [{ text: "INSERT INTO Sales.Lead (Email, Status, Score) VALUES ('d@contoso.com', DEFAULT, 90);", area: i4 }]
answer:
  values: { p1: i2, p2: i3 }
explanation:
  correct:
    en: |
      A DEFAULT applies only when the column is omitted or the DEFAULT keyword is used; an explicit NULL is stored as NULL. The second statement therefore stores NULL in the nullable Status column. The third statement supplies an explicit NULL for Score, which is NOT NULL, so it fails even though Score has a default. The first and fourth statements store 'New' in Status, with scores of 0 and 90.
    fr: |
      Une contrainte DEFAULT ne s'applique que si la colonne est omise ou si le mot clé DEFAULT est utilisé ; un NULL explicite est stocké tel quel. La deuxième instruction stocke donc NULL dans la colonne Status, qui accepte NULL. La troisième instruction fournit un NULL explicite pour Score, qui est NOT NULL : elle échoue bien que Score ait une valeur par défaut. La première et la quatrième instruction stockent 'New' dans Status, avec des scores de 0 et 90.
references:
  - title: Specify default values for columns
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/specify-default-values-for-columns
