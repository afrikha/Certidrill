id: dp800-1a-seq-behavior
objective: "1.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses a sequence named **Sales.InvoiceNumber** in a DEFAULT constraint of the **Sales.Invoice** table.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise une séquence nommée **Sales.InvoiceNumber** dans une contrainte DEFAULT de la table **Sales.Invoice**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the transaction that inserted an invoice is rolled back, the number it used is returned to the sequence and issued again.
        fr: Si la transaction qui a inséré une facture est annulée, le numéro utilisé est rendu à la séquence et attribué de nouveau.
    - id: s2
      text:
        en: If an INSERT statement references Sales.InvoiceNumber twice for the same row, both references return the same value.
        fr: Si une instruction INSERT référence Sales.InvoiceNumber deux fois pour la même ligne, les deux références renvoient la même valeur.
    - id: s3
      text:
        en: You can use NEXT VALUE FOR Sales.InvoiceNumber in the definition of a computed column.
        fr: Vous pouvez utiliser NEXT VALUE FOR Sales.InvoiceNumber dans la définition d'une colonne calculée.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Sequence numbers are generated outside the current transaction and are consumed even if the transaction is rolled back, so gaps are expected. When the same sequence is referenced more than once for a row, every reference returns the same value. NEXT VALUE FOR isn't allowed in views, user-defined functions, computed columns or CHECK constraints; it is allowed in a DEFAULT constraint.
    fr: |
      Les numéros de séquence sont générés en dehors de la transaction en cours et sont consommés même si la transaction est annulée : des trous sont normaux. Lorsque la même séquence est référencée plusieurs fois pour une ligne, chaque référence renvoie la même valeur. NEXT VALUE FOR n'est pas autorisé dans les vues, les fonctions définies par l'utilisateur, les colonnes calculées ni les contraintes CHECK ; il est autorisé dans une contrainte DEFAULT.
references:
  - title: NEXT VALUE FOR (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/next-value-for-transact-sql
  - title: CREATE SEQUENCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-sequence-transact-sql
