id: dp800-cs2b-lot-regex
objective: "1.3.4"
type: yesno_statements
caseStudy: dp800-cs2b-munsons-pickles
difficulty: 1
status: draft
stem:
  en: |
    You are evaluating Transact-SQL regular expression functions for the data quality requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez les fonctions d'expressions régulières Transact-SQL pour les exigences de qualité des données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Adding `CHECK (REGEXP_LIKE(LotCode, '^[A-Z]{3}-[0-9]{6}-[0-9]{2}$'))` to dbo.Lots rejects the lot code `cuc-261104-07`.
        fr: |
          L'ajout de `CHECK (REGEXP_LIKE(LotCode, '^[A-Z]{3}-[0-9]{6}-[0-9]{2}$'))` à dbo.Lots rejette le code de lot `cuc-261104-07`.
    - id: s2
      text:
        en: |
          `REGEXP_COUNT(IngredientList, '\s*[;,]\s*')` returns the position of the first separator in IngredientList.
        fr: |
          `REGEXP_COUNT(IngredientList, '\s*[;,]\s*')` renvoie la position du premier séparateur dans IngredientList.
    - id: s3
      text:
        en: |
          `CROSS APPLY REGEXP_SPLIT_TO_TABLE(r.IngredientList, '\s*[;,]\s*') AS s` returns one row per ingredient, and `s.ordinal` gives the position of each ingredient in the list.
        fr: |
          `CROSS APPLY REGEXP_SPLIT_TO_TABLE(r.IngredientList, '\s*[;,]\s*') AS s` renvoie une ligne par ingrédient, et `s.ordinal` donne la position de chaque ingrédient dans la liste.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Regular expressions don't honor the collation and are case-sensitive by default (flag c), so `[A-Z]` rejects lowercase letters even though SupplyDb uses a case-insensitive collation; REGEXP_LIKE is available because the compatibility level is 170. REGEXP_COUNT returns the number of matches, not a position (REGEXP_INSTR returns positions). REGEXP_SPLIT_TO_TABLE is a table-valued function that returns a value column and a 1-based ordinal column.
    fr: |
      Les expressions régulières ne respectent pas le classement et sont sensibles à la casse par défaut (indicateur c) : `[A-Z]` rejette donc les minuscules même si SupplyDb utilise un classement insensible à la casse ; REGEXP_LIKE est disponible, car le niveau de compatibilité est 170. REGEXP_COUNT renvoie le nombre de correspondances, pas une position (c'est REGEXP_INSTR qui renvoie des positions). REGEXP_SPLIT_TO_TABLE est une fonction table qui renvoie une colonne value et une colonne ordinal commençant à 1.
references:
  - title: REGEXP_LIKE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-like-transact-sql
  - title: Regular expressions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/regular-expressions/overview
