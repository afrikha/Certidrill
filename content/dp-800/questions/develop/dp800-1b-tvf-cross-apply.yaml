id: dp800-1b-tvf-cross-apply
objective: "1.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains an inline table-valued function named Sales.ufn_TopOrders. The function takes a customer ID and a number N, and returns the N largest orders of that customer.

    You need to write a query that returns the three largest orders of each active customer. Customers that have no orders must not appear in the result.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une fonction table inline nommée Sales.ufn_TopOrders. La fonction prend un ID client et un nombre N, et renvoie les N commandes les plus importantes de ce client.

    Vous devez écrire une requête qui renvoie les trois commandes les plus importantes de chaque client actif. Les clients qui n'ont aucune commande ne doivent pas apparaître dans le résultat.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT c.CustomerID, c.FullName, t.OrderID, t.Amount
    FROM Sales.Customer AS c
    [[apply]] Sales.ufn_TopOrders([[arg]], 3) AS t
    WHERE c.IsActive = 1;
  slots:
    - id: apply
      options:
        - { id: cross, text: CROSS APPLY }
        - { id: outer, text: OUTER APPLY }
        - { id: crossjoin, text: CROSS JOIN }
    - id: arg
      options:
        - { id: ccust, text: c.CustomerID }
        - { id: tcust, text: t.CustomerID }
        - { id: param, text: "@CustomerID" }
answer:
  values: { apply: cross, arg: ccust }
explanation:
  correct:
    en: |
      APPLY evaluates the table-valued function for every row of the left table source, and the function can take a column of that table, here c.CustomerID, as an argument. CROSS APPLY produces no row for a customer when the function returns an empty result, so customers without orders are excluded.
    fr: |
      APPLY évalue la fonction table pour chaque ligne de la source de table de gauche, et la fonction peut prendre une colonne de cette table, ici c.CustomerID, comme argument. CROSS APPLY ne produit aucune ligne pour un client quand la fonction renvoie un résultat vide : les clients sans commande sont exclus.
  options:
    outer: { en: "OUTER APPLY keeps every customer, with NULL order columns when the function returns no rows.", fr: "OUTER APPLY conserve chaque client, avec des colonnes de commande NULL quand la fonction ne renvoie aucune ligne." }
    crossjoin: { en: "A CROSS JOIN cannot pass a column of the left table to the function; only APPLY supports this correlation.", fr: "Une jointure CROSS JOIN ne peut pas passer une colonne de la table de gauche à la fonction ; seul APPLY prend en charge cette corrélation." }
    tcust: { en: "The function's own output cannot be its input; the argument must come from the left table.", fr: "La sortie de la fonction ne peut pas être son entrée ; l'argument doit venir de la table de gauche." }
    param: { en: "The query declares no @CustomerID variable, and a single value would not return the orders of each customer.", fr: "La requête ne déclare aucune variable @CustomerID, et une valeur unique ne renverrait pas les commandes de chaque client." }
references:
  - title: FROM clause plus JOIN, APPLY, PIVOT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/from-transact-sql
