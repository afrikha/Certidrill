id: dp800-1b-trg-feature-choice
objective: "1.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are designing an Azure SQL database for Proseware. A developer proposes to implement each of the following requirements with a trigger. You must use a trigger only when no simpler built-in feature meets the requirement.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez une base de données Azure SQL pour Proseware. Un développeur propose d'implémenter chacune des exigences suivantes avec un déclencheur. Vous ne devez utiliser un déclencheur que lorsqu'aucune fonctionnalité intégrée plus simple ne satisfait l'exigence.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: check, text: { en: "CHECK constraint", fr: "Contrainte CHECK" } }
    - { id: temporal, text: { en: "System-versioned temporal table", fr: "Table temporelle versionnée par le système" } }
    - { id: after, text: { en: "AFTER UPDATE trigger", fr: "Déclencheur AFTER UPDATE" } }
    - { id: insteadof, text: { en: "INSTEAD OF trigger", fr: "Déclencheur INSTEAD OF" } }
    - { id: ddl, text: { en: "Database-scoped DDL trigger", fr: "Déclencheur DDL délimité à la base de données" } }
  targets:
    - id: qty
      text: { en: "Reject order lines whose Quantity is zero or negative.", fr: "Rejeter les lignes de commande dont la valeur Quantity est nulle ou négative." }
    - id: history
      text: { en: "Keep every previous version of each row of Sales.PriceList and query the prices as they were on any past date.", fr: "Conserver chaque version précédente de chaque ligne de Sales.PriceList et interroger les prix tels qu'ils étaient à n'importe quelle date passée." }
    - id: status
      text: { en: "When the status of an order changes, write a row with the old status, the new status and a business reason code to an approval queue table.", fr: "Quand le statut d'une commande change, écrire une ligne avec l'ancien statut, le nouveau statut et un code de motif métier dans une table de file d'approbation." }
    - id: schema
      text: { en: "Block every ALTER TABLE statement in the database during the quarter-end close.", fr: "Bloquer toute instruction ALTER TABLE dans la base de données pendant la clôture trimestrielle." }
answer:
  mapping: { qty: check, history: temporal, status: after, schema: ddl }
explanation:
  correct:
    en: |
      A rule on the values of a single row is a CHECK constraint. A full row history with point-in-time queries is a system-versioned temporal table, which keeps previous row versions in a history table without code. Writing custom business rows from the old and new values of a change needs an AFTER UPDATE trigger that reads deleted and inserted. Blocking schema changes needs a DDL trigger ON DATABASE FOR ALTER_TABLE that rolls back the statement.
    fr: |
      Une règle sur les valeurs d'une seule ligne est une contrainte CHECK. Un historique complet des lignes avec des requêtes à un point dans le temps est une table temporelle versionnée par le système, qui conserve les versions précédentes des lignes dans une table d'historique sans code. Écrire des lignes métier personnalisées à partir des anciennes et nouvelles valeurs d'une modification exige un déclencheur AFTER UPDATE qui lit deleted et inserted. Bloquer les modifications de schéma exige un déclencheur DDL ON DATABASE FOR ALTER_TABLE qui annule l'instruction.
  options:
    insteadof: { en: "An INSTEAD OF trigger replaces the modification statement; none of the requirements needs to replace the statement.", fr: "Un déclencheur INSTEAD OF remplace l'instruction de modification ; aucune des exigences n'a besoin de remplacer l'instruction." }
references:
  - title: CREATE TRIGGER (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-trigger-transact-sql
  - title: Temporal tables
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/temporal-tables
