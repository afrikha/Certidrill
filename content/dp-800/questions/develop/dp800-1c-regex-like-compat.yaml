id: dp800-1c-regex-like-compat
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **sqldb-crm** that has a compatibility level of 150.

    The following query runs successfully.

    ```sql
    SELECT REGEXP_REPLACE(Phone, '[^0-9]', '') AS Digits
    FROM Sales.Contact;
    ```

    The following query fails because REGEXP_LIKE isn't recognized.

    ```sql
    SELECT ContactID
    FROM Sales.Contact
    WHERE REGEXP_LIKE(Email, '@contoso\.com$', 'i');
    ```

    You need the second query to run.

    Which statement should you run first?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **sqldb-crm** dont le niveau de compatibilité est 150.

    La requête suivante s'exécute correctement.

    ```sql
    SELECT REGEXP_REPLACE(Phone, '[^0-9]', '') AS Digits
    FROM Sales.Contact;
    ```

    La requête suivante échoue, car REGEXP_LIKE n'est pas reconnu.

    ```sql
    SELECT ContactID
    FROM Sales.Contact
    WHERE REGEXP_LIKE(Email, '@contoso\.com$', 'i');
    ```

    Vous devez exécuter la deuxième requête.

    Quelle instruction devez-vous exécuter d'abord ?
body:
  options:
    - { id: a, text: "`ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;`" }
    - { id: b, text: "`ALTER DATABASE SCOPED CONFIGURATION SET ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS = ON;`" }
    - { id: c, text: "`ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 170;`" }
    - { id: d, text: "`ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 160;`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      REGEXP_LIKE requires database compatibility level 170 or higher, while the other scalar regular expression functions, such as REGEXP_REPLACE, are available at all compatibility levels. That is why the first query works and the second one fails at level 150.
    fr: |
      REGEXP_LIKE exige le niveau de compatibilité 170 ou supérieur, alors que les autres fonctions scalaires d'expressions régulières, comme REGEXP_REPLACE, sont disponibles à tous les niveaux de compatibilité. C'est pourquoi la première requête fonctionne et la seconde échoue au niveau 150.
  options:
    a: { en: "This setting enables preview features; it doesn't change the compatibility level that REGEXP_LIKE requires.", fr: "Ce paramètre active les fonctionnalités en préversion ; il ne change pas le niveau de compatibilité qu'exige REGEXP_LIKE." }
    b: { en: "This setting applies to built-in table-valued functions such as REGEXP_MATCHES, not to the scalar REGEXP_LIKE.", fr: "Ce paramètre s'applique aux fonctions table intégrées comme REGEXP_MATCHES, pas à la fonction scalaire REGEXP_LIKE." }
    d: { en: "Level 160 is still below the level 170 that REGEXP_LIKE requires.", fr: "Le niveau 160 reste inférieur au niveau 170 qu'exige REGEXP_LIKE." }
references:
  - title: REGEXP_LIKE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-like-transact-sql
