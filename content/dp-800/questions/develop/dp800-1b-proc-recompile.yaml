id: dp800-1b-proc-recompile
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database for Tailspin Toys. A stored procedure named Sales.usp_DailyReport runs four statements. One of them filters Sales.Orders on the @Status parameter. The data is highly skewed: some status values match a few rows and others match millions of rows. The cached plan of this statement is efficient for some values and very slow for others.

    You need to ensure that this statement gets a plan optimized for the parameter value of each execution. The other three statements must keep using their cached plans.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL pour Tailspin Toys. Une procédure stockée nommée Sales.usp_DailyReport exécute quatre instructions. L'une d'elles filtre Sales.Orders sur le paramètre @Status. Les données sont très asymétriques : certaines valeurs de statut correspondent à quelques lignes et d'autres à des millions de lignes. Le plan mis en cache de cette instruction est efficace pour certaines valeurs et très lent pour d'autres.

    Vous devez vous assurer que cette instruction obtient un plan optimisé pour la valeur du paramètre de chaque exécution. Les trois autres instructions doivent continuer à utiliser leurs plans mis en cache.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add OPTION (RECOMPILE) to the statement.", fr: "Ajouter OPTION (RECOMPILE) à l'instruction." } }
    - { id: b, text: { en: "Add OPTION (OPTIMIZE FOR UNKNOWN) to the statement.", fr: "Ajouter OPTION (OPTIMIZE FOR UNKNOWN) à l'instruction." } }
    - { id: c, text: { en: "Run sp_recompile on the procedure.", fr: "Exécuter sp_recompile sur la procédure." } }
    - { id: d, text: { en: "Add WITH RECOMPILE to the procedure definition.", fr: "Ajouter WITH RECOMPILE à la définition de la procédure." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The RECOMPILE query hint generates a new, temporary plan for the statement at each execution, using the current parameter values, and discards it after the statement completes. The other statements of the procedure are not affected and keep their cached plans.
    fr: |
      L'indicateur de requête RECOMPILE génère un nouveau plan temporaire pour l'instruction à chaque exécution, en utilisant les valeurs actuelles des paramètres, et le supprime une fois l'instruction terminée. Les autres instructions de la procédure ne sont pas affectées et conservent leurs plans mis en cache.
  options:
    d: { en: "WITH RECOMPILE compiles the whole procedure at every execution, so the other three statements also lose their cached plans.", fr: "WITH RECOMPILE compile toute la procédure à chaque exécution : les trois autres instructions perdent aussi leurs plans mis en cache." }
    b: { en: "OPTIMIZE FOR UNKNOWN builds one plan from the average selectivity of the column, not a plan for each parameter value.", fr: "OPTIMIZE FOR UNKNOWN crée un seul plan à partir de la sélectivité moyenne de la colonne, pas un plan pour chaque valeur de paramètre." }
    c: { en: "sp_recompile removes the current plan only once; the next plan compiled is cached and reused for all values again.", fr: "sp_recompile ne supprime le plan actuel qu'une fois ; le plan compilé ensuite est mis en cache et réutilisé pour toutes les valeurs." }
references:
  - title: Query hints (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/hints-transact-sql-query
  - title: CREATE PROCEDURE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-procedure-transact-sql
