id: dp800-1c-regex-replace-dates
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A table named **Ops.EventLog** has an nvarchar(2000) column named EventText. The text can contain several dates in the DD/MM/YYYY format, for example `Opened 03/11/2026, closed 05/11/2026`.

    You need a query that returns EventText with every date rewritten in the YYYY-MM-DD format, for example `Opened 2026-11-03, closed 2026-11-05`.

    How should you complete the Transact-SQL statement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une table nommée **Ops.EventLog** contient une colonne nvarchar(2000) nommée EventText. Le texte peut contenir plusieurs dates au format JJ/MM/AAAA, par exemple `Opened 03/11/2026, closed 05/11/2026`.

    Vous avez besoin d'une requête qui renvoie EventText avec chaque date réécrite au format AAAA-MM-JJ, par exemple `Opened 2026-11-03, closed 2026-11-05`.

    Comment devez-vous compléter l'instruction Transact-SQL ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT EventID,
           REGEXP_REPLACE(EventText, [[pat]], [[rep]], 1, [[occ]]) AS Normalized
    FROM Ops.EventLog;
  slots:
    - id: pat
      options:
        - id: groups
          text: |-
            '(\d{2})/(\d{2})/(\d{4})'
        - id: nogroups
          text: |-
            '\d{2}/\d{2}/\d{4}'
        - id: wrongorder
          text: |-
            '(\d{4})/(\d{2})/(\d{2})'
    - id: rep
      options:
        - id: back321
          text: |-
            '\3-\2-\1'
        - id: back123
          text: |-
            '\1-\2-\3'
        - id: dollar
          text: |-
            '$3-$2-$1'
        - id: amp
          text: |-
            '&'
    - id: occ
      options:
        - { id: o0, text: "0" }
        - { id: o1, text: "1" }
        - { id: o2, text: "2" }
answer:
  values: { pat: groups, rep: back321, occ: o0 }
explanation:
  correct:
    en: |
      Each part of the date must be in its own capture group so that the replacement can reorder them. In the replacement string, \n (1 through 9) inserts the substring matched by the nth group, so \3-\2-\1 writes year, month, day. The occurrence value 0, which is the default, replaces every match.
    fr: |
      Chaque partie de la date doit être dans son propre groupe de capture pour que le remplacement puisse les réordonner. Dans la chaîne de remplacement, \n (de 1 à 9) insère la sous-chaîne correspondant au nième groupe : \3-\2-\1 écrit donc l'année, le mois, puis le jour. La valeur d'occurrence 0, qui est la valeur par défaut, remplace toutes les correspondances.
  options:
    nogroups: { en: "Without capture groups, the replacement has no group to reference.", fr: "Sans groupes de capture, le remplacement n'a aucun groupe à référencer." }
    wrongorder: { en: "This pattern expects the year first, so it doesn't match DD/MM/YYYY dates.", fr: "Ce modèle attend l'année en premier : il ne correspond pas aux dates JJ/MM/AAAA." }
    back123: { en: "This keeps the day-month-year order and only changes the separator.", fr: "Cela conserve l'ordre jour-mois-année et ne change que le séparateur." }
    dollar: { en: "Group references in REGEXP_REPLACE use \\1 to \\9; $3 is inserted as literal text.", fr: "Les références de groupe de REGEXP_REPLACE utilisent \\1 à \\9 ; $3 est inséré comme texte littéral." }
    amp: { en: "& inserts the entire match, so the dates stay unchanged.", fr: "& insère la correspondance entière : les dates restent inchangées." }
    o1: { en: "Occurrence 1 replaces only the first date.", fr: "L'occurrence 1 ne remplace que la première date." }
    o2: { en: "Occurrence 2 replaces only the second date.", fr: "L'occurrence 2 ne remplace que la deuxième date." }
references:
  - title: REGEXP_REPLACE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-replace-transact-sql
