id: dp800-1b-trg-multirow
objective: "1.2.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database for Contoso. The following trigger is defined on the Sales.OrderLine table. Each order line references a different product.

    An import job inserts 50 order lines with a single INSERT ... SELECT statement. After the job, the stock of only one product has decreased.

    Answer each prompt by selecting the appropriate line of the trigger.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL pour Contoso. Le déclencheur suivant est défini sur la table Sales.OrderLine. Chaque ligne de commande référence un produit différent.

    Un travail d'importation insère 50 lignes de commande avec une seule instruction INSERT ... SELECT. Après le travail, le stock d'un seul produit a diminué.

    Répondez à chaque consigne en sélectionnant la ligne appropriée du déclencheur.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which line causes the trigger to process only one of the inserted rows?", fr: "Quelle ligne fait que le déclencheur ne traite qu'une seule des lignes insérées ?" }
    - id: p2
      text: { en: "Which line must you change so that the trigger runs in place of the INSERT statement instead of after it?", fr: "Quelle ligne devez-vous modifier pour que le déclencheur s'exécute à la place de l'instruction INSERT au lieu de s'exécuter après elle ?" }
  grid:
    header: [{ en: "Line", fr: "Ligne" }, { en: "Code", fr: "Code" }]
    rows:
      - [{ text: "1" }, { text: "CREATE OR ALTER TRIGGER Sales.trg_OrderLine_Stock", area: l1 }]
      - [{ text: "2" }, { text: "ON Sales.OrderLine", area: l2 }]
      - [{ text: "3" }, { text: "AFTER INSERT", area: l3 }]
      - [{ text: "4" }, { text: "AS BEGIN" }]
      - [{ text: "5" }, { text: "SET NOCOUNT ON;", area: l5 }]
      - [{ text: "6" }, { text: "DECLARE @ProductID int, @Qty int;", area: l6 }]
      - [{ text: "7" }, { text: "SELECT @ProductID = ProductID, @Qty = Quantity FROM inserted;", area: l7 }]
      - [{ text: "8" }, { text: "UPDATE Inventory.Stock SET OnHand = OnHand - @Qty WHERE ProductID = @ProductID;", area: l8 }]
      - [{ text: "9" }, { text: "END;" }]
answer:
  values: { p1: l7, p2: l3 }
explanation:
  correct:
    en: |
      A DML trigger fires once per statement, and the inserted table holds all the rows of the statement. Assigning inserted columns to scalar variables keeps the values of only one arbitrary row, so line 7 makes the trigger handle a single product; a set-based UPDATE that joins Inventory.Stock to inserted fixes it. The trigger type is set on line 3: INSTEAD OF INSERT runs in place of the INSERT statement, while AFTER INSERT runs after it.
    fr: |
      Un déclencheur DML s'exécute une fois par instruction, et la table inserted contient toutes les lignes de l'instruction. Affecter des colonnes de inserted à des variables scalaires ne conserve les valeurs que d'une seule ligne arbitraire : la ligne 7 fait traiter un seul produit au déclencheur ; un UPDATE ensembliste qui joint Inventory.Stock à inserted corrige le problème. Le type de déclencheur est défini à la ligne 3 : INSTEAD OF INSERT s'exécute à la place de l'instruction INSERT, alors qu'AFTER INSERT s'exécute après elle.
references:
  - title: CREATE TRIGGER (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-trigger-transact-sql
