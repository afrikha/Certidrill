id: dp800-1b-sfn-complete
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are developing an Azure SQL database for Wingtip Toys. You need a function named Sales.ufn_LineTotal that returns one value, the quantity multiplied by the unit price, and that can be used in the SELECT list of a query, for example `SELECT Sales.ufn_LineTotal(Quantity, UnitPrice) FROM Sales.OrderLine;`.

    How should you complete the function? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous développez une base de données Azure SQL pour Wingtip Toys. Vous avez besoin d'une fonction nommée Sales.ufn_LineTotal qui renvoie une seule valeur, la quantité multipliée par le prix unitaire, et qui peut être utilisée dans la liste SELECT d'une requête, par exemple `SELECT Sales.ufn_LineTotal(Quantity, UnitPrice) FROM Sales.OrderLine;`.

    Comment devez-vous compléter la fonction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE OR ALTER FUNCTION Sales.ufn_LineTotal
    (
        @Quantity  int,
        @UnitPrice decimal(10, 2)
    )
    [[ret]]
    AS
    [[open]]
        [[body]]
    END;
  slots:
    - id: ret
      options:
        - { id: scalar, text: "RETURNS decimal(12, 2)" }
        - { id: table, text: RETURNS TABLE }
        - { id: tvar, text: "RETURNS @t TABLE (Total decimal(12, 2))" }
    - id: open
      options:
        - { id: begin, text: BEGIN }
        - { id: begintry, text: BEGIN TRY }
        - { id: returnparen, text: "RETURN (" }
    - id: body
      options:
        - { id: return, text: "RETURN @Quantity * @UnitPrice;" }
        - { id: select, text: "SELECT @Quantity * @UnitPrice AS Total;" }
        - { id: print, text: "PRINT @Quantity * @UnitPrice;" }
answer:
  values: { ret: scalar, open: begin, body: return }
explanation:
  correct:
    en: |
      A scalar function declares the data type of its single return value in the RETURNS clause, and its body is a BEGIN...END block that ends with a RETURN statement returning a value of that type. It can then be called with its schema name wherever an expression is allowed.
    fr: |
      Une fonction scalaire déclare le type de données de son unique valeur de retour dans la clause RETURNS, et son corps est un bloc BEGIN...END qui se termine par une instruction RETURN renvoyant une valeur de ce type. Elle peut ensuite être appelée avec son nom de schéma partout où une expression est autorisée.
  options:
    table: { en: "RETURNS TABLE defines an inline table-valued function, which returns a rowset used in FROM, not a value for the SELECT list.", fr: "RETURNS TABLE définit une fonction table inline, qui renvoie un ensemble de lignes utilisé dans FROM, pas une valeur pour la liste SELECT." }
    tvar: { en: "RETURNS @t TABLE defines a multi-statement table-valued function, which returns a table.", fr: "RETURNS @t TABLE définit une fonction table à instructions multiples, qui renvoie une table." }
    begintry: { en: "TRY...CATCH is not allowed in the body of a user-defined function.", fr: "TRY...CATCH n'est pas autorisé dans le corps d'une fonction définie par l'utilisateur." }
    returnparen: { en: "RETURN (select) is the body of an inline table-valued function and has no matching END.", fr: "RETURN (select) est le corps d'une fonction table inline et n'a pas de END correspondant." }
    select: { en: "A function cannot return a result set to the client; a scalar function returns its value with RETURN.", fr: "Une fonction ne peut pas renvoyer de jeu de résultats au client ; une fonction scalaire renvoie sa valeur avec RETURN." }
    print: { en: "PRINT sends a message to the client, which a function cannot do, and it does not return a value.", fr: "PRINT envoie un message au client, ce qu'une fonction ne peut pas faire, et ne renvoie aucune valeur." }
references:
  - title: CREATE FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql
