id: dp800-1b-view-indexed-steps
objective: "1.2.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database for Litware. Reports repeatedly aggregate the Sales.OrderLine table by ProductID and SalesRegion, and some reports filter the aggregated result on SalesRegion only.

    You need to materialize the aggregation in an indexed view and support the filter on SalesRegion with an index on the view.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL pour Litware. Des rapports agrègent régulièrement la table Sales.OrderLine par ProductID et SalesRegion, et certains rapports filtrent le résultat agrégé sur SalesRegion uniquement.

    Vous devez matérialiser l'agrégation dans une vue indexée et prendre en charge le filtre sur SalesRegion avec un index sur la vue.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: view, text: { en: "Create the view WITH SCHEMABINDING by using two-part names, GROUP BY ProductID, SalesRegion and COUNT_BIG(*).", fr: "Créer la vue avec WITH SCHEMABINDING en utilisant des noms en deux parties, GROUP BY ProductID, SalesRegion et COUNT_BIG(*)." } }
    - { id: ucl, text: { en: "Create a unique clustered index on the ProductID and SalesRegion columns of the view.", fr: "Créer un index cluster unique sur les colonnes ProductID et SalesRegion de la vue." } }
    - { id: nc, text: { en: "Create a nonclustered index on the SalesRegion column of the view.", fr: "Créer un index non cluster sur la colonne SalesRegion de la vue." } }
    - { id: star, text: { en: "Create the view by using SELECT * so that new columns of the table appear automatically.", fr: "Créer la vue avec SELECT * pour que les nouvelles colonnes de la table apparaissent automatiquement." } }
    - { id: refresh, text: { en: "Run sp_refreshview on the view.", fr: "Exécuter sp_refreshview sur la vue." } }
    - { id: hint, text: { en: "Add the NOEXPAND hint to the SELECT statement of the view definition.", fr: "Ajouter l'indicateur NOEXPAND à l'instruction SELECT de la définition de la vue." } }
answer:
  sequence: [ view, ucl, nc ]
explanation:
  correct:
    en: |
      An indexed view must be schema-bound, use two-part names and include COUNT_BIG(*) when it has GROUP BY. The first index on the view must be a unique clustered index, which stores the result set. Nonclustered indexes, such as one on SalesRegion, can be created only after the clustered index exists.
    fr: |
      Une vue indexée doit être liée au schéma, utiliser des noms en deux parties et inclure COUNT_BIG(*) quand elle comporte GROUP BY. Le premier index de la vue doit être un index cluster unique, qui stocke le jeu de résultats. Les index non cluster, comme celui sur SalesRegion, ne peuvent être créés qu'une fois l'index cluster en place.
  options:
    star: { en: "SELECT * is not allowed in an indexed view; columns must be named explicitly.", fr: "SELECT * n'est pas autorisé dans une vue indexée ; les colonnes doivent être nommées explicitement." }
    refresh: { en: "sp_refreshview applies to views that are not schema-bound; it is not needed to index a view.", fr: "sp_refreshview s'applique aux vues non liées au schéma ; elle n'est pas nécessaire pour indexer une vue." }
    hint: { en: "NOEXPAND is a table hint used by the queries that read the view, not part of the view definition, and Azure SQL Database matches indexed views automatically.", fr: "NOEXPAND est un indicateur de table utilisé par les requêtes qui lisent la vue, pas un élément de la définition de la vue, et Azure SQL Database utilise automatiquement les vues indexées." }
references:
  - title: Create indexed views
    url: https://learn.microsoft.com/en-us/sql/relational-databases/views/create-indexed-views
