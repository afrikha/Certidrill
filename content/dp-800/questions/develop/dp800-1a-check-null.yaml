id: dp800-1a-check-null
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a table named **Sales.Quote** that contains the following column definition.

    ```sql
    Discount decimal(4, 1) NULL
        CONSTRAINT CK_Quote_Discount CHECK (Discount BETWEEN 0 AND 50)
    ```

    During testing, an INSERT statement that explicitly sets Discount to NULL succeeds. You delete the test row; no other row has a NULL discount.

    You need to ensure that every quote has a discount between 0 and 50.

    What should you do?
  fr: |
    Fabrikam dispose d'une table nommée **Sales.Quote** qui contient la définition de colonne suivante.

    ```sql
    Discount decimal(4, 1) NULL
        CONSTRAINT CK_Quote_Discount CHECK (Discount BETWEEN 0 AND 50)
    ```

    Pendant les tests, une instruction INSERT qui affecte explicitement NULL à Discount réussit. Vous supprimez la ligne de test ; aucune autre ligne n'a de remise NULL.

    Vous devez vous assurer que chaque devis a une remise comprise entre 0 et 50.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Re-create CK_Quote_Discount by using WITH CHECK.", fr: "Recréer CK_Quote_Discount à l'aide de WITH CHECK." } }
    - { id: b, text: { en: "Add a DEFAULT (0) constraint to the Discount column.", fr: "Ajouter une contrainte DEFAULT (0) à la colonne Discount." } }
    - { id: c, text: { en: "Alter the Discount column to NOT NULL.", fr: "Modifier la colonne Discount en NOT NULL." } }
    - { id: d, text: { en: "Rewrite the condition as Discount >= 0 AND Discount <= 50.", fr: "Réécrire la condition sous la forme Discount >= 0 AND Discount <= 50." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A CHECK constraint rejects only values for which the condition is FALSE. A NULL makes the condition UNKNOWN, so the row passes. Making the column NOT NULL rejects missing values, and the CHECK constraint keeps enforcing the range.
    fr: |
      Une contrainte CHECK ne rejette que les valeurs pour lesquelles la condition est FALSE. Un NULL rend la condition UNKNOWN : la ligne est acceptée. Passer la colonne en NOT NULL rejette les valeurs manquantes, et la contrainte CHECK continue d'imposer la plage.
  options:
    a: { en: "WITH CHECK validates existing rows; NULL still evaluates to UNKNOWN and passes.", fr: "WITH CHECK valide les lignes existantes ; NULL donne toujours UNKNOWN et passe." }
    b: { en: "A default applies only when no value is supplied; an explicit NULL is still stored.", fr: "Une valeur par défaut ne s'applique que si aucune valeur n'est fournie ; un NULL explicite est toujours stocké." }
    d: { en: "The rewritten condition is equivalent and also evaluates to UNKNOWN for NULL.", fr: "La condition réécrite est équivalente et donne aussi UNKNOWN pour NULL." }
references:
  - title: Unique constraints and check constraints
    url: https://learn.microsoft.com/en-us/sql/relational-databases/tables/unique-constraints-and-check-constraints
