id: dp800-1a-seq-cycle
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam uses the following sequence to assign loading dock slots.

    ```sql
    CREATE SEQUENCE Ops.DockSlot
        AS tinyint
        START WITH 10
        INCREMENT BY 10
        MINVALUE 5
        MAXVALUE 50
        CYCLE;
    ```

    The application has already obtained the values 10, 20, 30, 40 and 50 from the sequence. It then calls `NEXT VALUE FOR Ops.DockSlot` again.

    What is the result?
  fr: |
    Fabrikam utilise la séquence suivante pour attribuer des emplacements de quai de chargement.

    ```sql
    CREATE SEQUENCE Ops.DockSlot
        AS tinyint
        START WITH 10
        INCREMENT BY 10
        MINVALUE 5
        MAXVALUE 50
        CYCLE;
    ```

    L'application a déjà obtenu les valeurs 10, 20, 30, 40 et 50 de la séquence. Elle appelle ensuite de nouveau `NEXT VALUE FOR Ops.DockSlot`.

    Quel est le résultat ?
body:
  options:
    - { id: a, text: { en: "The value 10 is returned.", fr: "La valeur 10 est renvoyée." } }
    - { id: b, text: { en: "The value 0 is returned.", fr: "La valeur 0 est renvoyée." } }
    - { id: c, text: { en: "The value 5 is returned.", fr: "La valeur 5 est renvoyée." } }
    - { id: d, text: { en: "An error is raised because the sequence reached MAXVALUE.", fr: "Une erreur est générée, car la séquence a atteint MAXVALUE." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With CYCLE, an ascending sequence that passes its MAXVALUE restarts at its MINVALUE, not at its START WITH value. The next value after 50 is therefore 5, and the following ones are 15, 25 and so on.
    fr: |
      Avec CYCLE, une séquence croissante qui dépasse sa valeur MAXVALUE recommence à sa valeur MINVALUE, et non à sa valeur START WITH. La valeur suivant 50 est donc 5, puis viennent 15, 25 et ainsi de suite.
  options:
    a: { en: "A cycling sequence doesn't restart at START WITH but at MINVALUE.", fr: "Une séquence cyclique ne recommence pas à START WITH mais à MINVALUE." }
    b: { en: "0 is the minimum of tinyint, but the sequence defines MINVALUE 5.", fr: "0 est le minimum du type tinyint, mais la séquence définit MINVALUE 5." }
    d: { en: "The error is raised only with NO CYCLE, which is the default but not the setting here.", fr: "L'erreur n'est générée qu'avec NO CYCLE, qui est la valeur par défaut mais pas le paramètre utilisé ici." }
references:
  - title: CREATE SEQUENCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-sequence-transact-sql
