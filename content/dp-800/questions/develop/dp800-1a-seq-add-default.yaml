id: dp800-1a-seq-add-default
objective: "1.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a table named **Sales.WebOrder** that contains 50,000 rows. The primary key is an int column named **OrderNo**, and the application currently supplies its values.

    You need to change the design so that the database assigns OrderNo automatically from a new sequence when the application omits the column. Existing order numbers must be kept, and new numbers must never collide with them.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'une table nommée **Sales.WebOrder** qui contient 50 000 lignes. La clé primaire est une colonne int nommée **OrderNo**, dont les valeurs sont actuellement fournies par l'application.

    Vous devez modifier la conception pour que la base de données attribue automatiquement OrderNo à partir d'une nouvelle séquence lorsque l'application omet la colonne. Les numéros de commande existants doivent être conservés, et les nouveaux numéros ne doivent jamais entrer en conflit avec eux.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: default, text: { en: "Add a DEFAULT constraint on OrderNo that uses NEXT VALUE FOR the sequence.", fr: "Ajouter sur OrderNo une contrainte DEFAULT qui utilise NEXT VALUE FOR sur la séquence." } }
    - { id: max, text: { en: "Query the highest existing OrderNo value.", fr: "Interroger la valeur OrderNo existante la plus élevée." } }
    - { id: create, text: { en: "Create the sequence AS int with START WITH set to the highest existing value plus one.", fr: "Créer la séquence AS int avec START WITH égal à la valeur existante la plus élevée plus un." } }
    - { id: check, text: { en: "Add a CHECK constraint on OrderNo that uses NEXT VALUE FOR the sequence.", fr: "Ajouter sur OrderNo une contrainte CHECK qui utilise NEXT VALUE FOR sur la séquence." } }
    - { id: identity, text: { en: "Alter the OrderNo column to add the IDENTITY property.", fr: "Modifier la colonne OrderNo pour lui ajouter la propriété IDENTITY." } }
    - { id: restart, text: { en: "Run ALTER SEQUENCE with RESTART WITH 1.", fr: "Exécuter ALTER SEQUENCE avec RESTART WITH 1." } }
answer:
  sequence: [ max, create, default ]
explanation:
  correct:
    en: |
      You first find the highest number in use, then create the sequence so that it starts just above it, and finally add a DEFAULT (NEXT VALUE FOR ...) constraint so that inserts that omit OrderNo get the next number. The default constraint can be added only after the sequence exists.
    fr: |
      Vous recherchez d'abord le numéro le plus élevé utilisé, puis vous créez la séquence pour qu'elle commence juste au-dessus, et enfin vous ajoutez une contrainte DEFAULT (NEXT VALUE FOR ...) pour que les insertions qui omettent OrderNo reçoivent le numéro suivant. La contrainte par défaut ne peut être ajoutée qu'une fois la séquence créée.
  options:
    check: { en: "NEXT VALUE FOR isn't allowed in a CHECK constraint.", fr: "NEXT VALUE FOR n'est pas autorisé dans une contrainte CHECK." }
    identity: { en: "The IDENTITY property can't be added to an existing column, and the requirement is a sequence.", fr: "La propriété IDENTITY ne peut pas être ajoutée à une colonne existante, et l'exigence porte sur une séquence." }
    restart: { en: "Restarting at 1 would generate numbers that already exist in the table.", fr: "Recommencer à 1 générerait des numéros qui existent déjà dans la table." }
references:
  - title: NEXT VALUE FOR (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/next-value-for-transact-sql
  - title: Sequence Numbers
    url: https://learn.microsoft.com/en-us/sql/relational-databases/sequence-numbers/sequence-numbers
