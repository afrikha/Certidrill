id: dp800-1a-schema-only
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum loads sales files into a staging table every hour before transforming them. The database is an Azure SQL database in the Business Critical service tier.

    The staging data can be reloaded from the files at any time, so losing it after a restart is acceptable. You need to create the staging table so that loads generate no transaction log I/O.

    Which table option should you use in the CREATE TABLE statement?
  fr: |
    Adatum charge des fichiers de ventes dans une table de mise en lots chaque heure avant de les transformer. La base de données est une base de données Azure SQL du niveau de service Business Critical.

    Les données de mise en lots peuvent être rechargées à partir des fichiers à tout moment : leur perte après un redémarrage est acceptable. Vous devez créer la table de mise en lots pour que les chargements ne génèrent aucune E/S de journal des transactions.

    Quelle option de table devez-vous utiliser dans l'instruction CREATE TABLE ?
body:
  options:
    - { id: a, text: "WITH (MEMORY_OPTIMIZED = ON, DURABILITY = SCHEMA_AND_DATA)" }
    - { id: b, text: "WITH (MEMORY_OPTIMIZED = ON, DURABILITY = SCHEMA_ONLY)" }
    - { id: c, text: "WITH (LEDGER = ON (APPEND_ONLY = ON))" }
    - { id: d, text: "WITH (SYSTEM_VERSIONING = ON)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A memory-optimized table with DURABILITY = SCHEMA_ONLY keeps only its definition across a restart: its rows aren't logged, which removes transaction log I/O. This is the documented use case for transient data such as an ETL staging table. Business Critical supports In-Memory OLTP.
    fr: |
      Une table optimisée en mémoire avec DURABILITY = SCHEMA_ONLY ne conserve que sa définition après un redémarrage : ses lignes ne sont pas journalisées, ce qui supprime les E/S du journal des transactions. C'est le cas d'usage documenté pour des données transitoires comme une table de mise en lots ETL. Business Critical prend en charge In-Memory OLTP.
  options:
    a: { en: "SCHEMA_AND_DATA, the default, logs every change so that rows survive a restart.", fr: "SCHEMA_AND_DATA, la valeur par défaut, journalise chaque modification pour que les lignes survivent à un redémarrage." }
    c: { en: "An append-only ledger table is fully logged and adds hashing; it targets tamper evidence.", fr: "Une table de registre en ajout uniquement est entièrement journalisée et ajoute un hachage ; elle vise la preuve de non-falsification." }
    d: { en: "System versioning keeps a history of every change, which adds work instead of removing logging.", fr: "La gestion des versions par le système conserve l'historique de chaque modification, ce qui ajoute du travail au lieu de supprimer la journalisation." }
references:
  - title: Defining Durability for Memory-Optimized Objects
    url: https://learn.microsoft.com/en-us/sql/relational-databases/in-memory-oltp/defining-durability-for-memory-optimized-objects
