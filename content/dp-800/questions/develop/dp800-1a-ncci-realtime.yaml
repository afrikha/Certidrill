id: dp800-1a-ncci-realtime
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs an order-processing application on an Azure SQL database in the Business Critical service tier. The **Sales.OrderLine** table is a rowstore table with a clustered primary key and three nonclustered indexes that the application uses for singleton lookups.

    During business hours, analysts start running ad hoc aggregate queries that scan millions of rows of Sales.OrderLine on different column combinations. You need to speed up the analytical queries. The existing clustered and nonclustered indexes must remain unchanged, and the application must not be modified.

    What should you create on Sales.OrderLine?
  fr: |
    Northwind exécute une application de traitement des commandes sur une base de données Azure SQL du niveau de service Business Critical. La table **Sales.OrderLine** est une table rowstore dotée d'une clé primaire cluster et de trois index non cluster que l'application utilise pour des recherches de lignes uniques.

    Pendant les heures ouvrées, des analystes lancent des requêtes d'agrégation ad hoc qui analysent des millions de lignes de Sales.OrderLine sur différentes combinaisons de colonnes. Vous devez accélérer les requêtes analytiques. Les index cluster et non cluster existants doivent rester inchangés, et l'application ne doit pas être modifiée.

    Que devez-vous créer sur Sales.OrderLine ?
body:
  options:
    - { id: a, text: { en: "A clustered columnstore index", fr: "Un index columnstore cluster" } }
    - { id: b, text: { en: "A nonclustered columnstore index", fr: "Un index columnstore non cluster" } }
    - { id: c, text: { en: "A filtered nonclustered rowstore index", fr: "Un index rowstore non cluster filtré" } }
    - { id: d, text: { en: "A nonclustered rowstore index with included columns", fr: "Un index rowstore non cluster avec des colonnes incluses" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A nonclustered columnstore index is a secondary, column-oriented copy of the selected columns of a rowstore table. Microsoft recommends it for real-time operational analytics: analytical scans use the columnstore in batch mode while the OLTP workload keeps using the existing B-tree indexes, with no change to the table's clustered index or to the application.
    fr: |
      Un index columnstore non cluster est une copie secondaire, orientée colonnes, des colonnes choisies d'une table rowstore. Microsoft le recommande pour l'analytique opérationnelle en temps réel : les analyses utilisent le columnstore en mode batch, tandis que la charge OLTP continue d'utiliser les index B-tree existants, sans modifier l'index cluster de la table ni l'application.
  options:
    a: { en: "A clustered columnstore index becomes the table's storage, which replaces the existing clustered index.", fr: "Un index columnstore cluster devient le stockage de la table, ce qui remplace l'index cluster existant." }
    c: { en: "A filtered rowstore index serves a well-defined subset of rows, not large scans over varying columns.", fr: "Un index rowstore filtré sert un sous-ensemble de lignes bien défini, pas de grandes analyses sur des colonnes variables." }
    d: { en: "A rowstore index with included columns avoids lookups for one query shape; it doesn't speed up ad hoc aggregates over millions of rows.", fr: "Un index rowstore avec colonnes incluses évite les recherches de clés pour une forme de requête ; il n'accélère pas des agrégats ad hoc sur des millions de lignes." }
references:
  - title: "Columnstore indexes: overview"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview
