id: dp800-1d-fabric-agent-mcp-steps
objective: "1.4.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Fabric workspace on an F64 capacity. The workspace contains a lakehouse named lh_sales. The required data agent tenant settings are enabled.

    Developers must query lh_sales from GitHub Copilot Agent mode in Visual Studio Code through an MCP server.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un espace de travail Microsoft Fabric sur une capacité F64. L'espace de travail contient un lakehouse nommé lh_sales. Les paramètres du locataire requis pour les agents de données sont activés.

    Les développeurs doivent interroger lh_sales depuis le mode Agent de GitHub Copilot dans Visual Studio Code par le biais d'un serveur MCP.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: create, text: { en: "Create a data agent in the workspace.", fr: "Créer un agent de données dans l'espace de travail." } }
    - { id: source, text: { en: "Add lh_sales as a data source of the data agent.", fr: "Ajouter lh_sales comme source de données de l'agent de données." } }
    - { id: publish, text: { en: "Publish the data agent.", fr: "Publier l'agent de données." } }
    - { id: copy, text: { en: "In the data agent Settings, open the Model Context Protocol tab and copy the MCP server URL.", fr: "Dans les paramètres (Settings) de l'agent de données, ouvrir l'onglet Model Context Protocol et copier l'URL du serveur MCP." } }
    - { id: add, text: { en: "Add the URL as an HTTP server in .vscode/mcp.json, and then sign in with a Microsoft account.", fr: "Ajouter l'URL comme serveur HTTP dans .vscode/mcp.json, puis se connecter avec un compte Microsoft." } }
    - { id: dab, text: { en: "Run dab add for each table of lh_sales, and then run dab start.", fr: "Exécuter dab add pour chaque table de lh_sales, puis exécuter dab start." } }
    - { id: manual, text: { en: "Build the MCP server URL from the workspace ID and the data agent ID before you configure the agent.", fr: "Construire l'URL du serveur MCP à partir de l'ID de l'espace de travail et de l'ID de l'agent de données avant de configurer l'agent." } }
answer:
  sequence: [create, source, publish, copy, add]
explanation:
  correct:
    en: |
      A Fabric data agent exposes a lakehouse, a warehouse or a semantic model to AI assistants. You create the agent, give it the lakehouse as a source, and publish it: the MCP server works only after publication. The Model Context Protocol tab of its settings shows the MCP server URL, which you add as an HTTP server in Visual Studio Code before signing in.
    fr: |
      Un agent de données Fabric expose un lakehouse, un entrepôt ou un modèle sémantique aux assistants IA. Vous créez l'agent, lui donnez le lakehouse comme source et le publiez : le serveur MCP ne fonctionne qu'après la publication. L'onglet Model Context Protocol de ses paramètres affiche l'URL du serveur MCP, que vous ajoutez comme serveur HTTP dans Visual Studio Code avant de vous connecter.
  options:
    dab: { en: "SQL MCP Server (Data API builder) isn't how a Fabric lakehouse is exposed here; the data agent provides the MCP endpoint.", fr: "SQL MCP Server (Data API builder) n'est pas le moyen d'exposer ici un lakehouse Fabric : c'est l'agent de données qui fournit le point de terminaison MCP." }
    manual: { en: "A manually built URL returns an error until the data agent is published, and the URL is shown in the agent settings anyway.", fr: "Une URL construite manuellement renvoie une erreur tant que l'agent de données n'est pas publié, et l'URL est de toute façon affichée dans les paramètres de l'agent." }
references:
  - title: Data agent as Model Context Protocol server
    url: https://learn.microsoft.com/en-us/fabric/data-science/data-agent-mcp-server
  - title: Connect to MCP server endpoints, including Microsoft SQL Server and Fabric lakehouse
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/7-connect-mcp-server-endpoints
