id: dp800-1c-regex-sargable
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database that has a compatibility level of 170. A table named **Inventory.Item** contains 30 million rows and has a nonclustered index on a varchar(20) column named Sku.

    You need a query that returns the items whose Sku is exactly `TX-` followed by four digits. The solution must meet the following requirements:

    - Lowercase values such as `tx-1234` must not be returned.
    - The predicate must allow the query optimizer to use an index seek on Sku.

    Which predicate should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL dont le niveau de compatibilité est 170. Une table nommée **Inventory.Item** contient 30 millions de lignes et possède un index non cluster sur une colonne varchar(20) nommée Sku.

    Vous avez besoin d'une requête qui renvoie les articles dont la valeur Sku est exactement `TX-` suivi de quatre chiffres. La solution doit respecter les exigences suivantes :

    - Les valeurs en minuscules comme `tx-1234` ne doivent pas être renvoyées.
    - Le prédicat doit permettre à l'optimiseur de requête d'utiliser une recherche d'index (index seek) sur Sku.

    Quel prédicat devez-vous utiliser ?
body:
  options:
    - { id: a, text: "`REGEXP_LIKE(Sku, 'TX-[0-9]{4}$')`" }
    - { id: b, text: "`REGEXP_LIKE(Sku, '^TX-[0-9]{4}$', 'i')`" }
    - { id: c, text: "`REGEXP_LIKE(Sku, '.*TX-[0-9]{4}$')`" }
    - { id: d, text: "`REGEXP_LIKE(Sku, '^TX-[0-9]{4}$')`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      REGEXP_LIKE is SARGable only when the pattern begins with the ^ anchor; the anchored pattern can then contain quantifiers and ranges such as [0-9]{4}. Without flags, matching is case-sensitive (flag c), so tx-1234 isn't returned.
    fr: |
      REGEXP_LIKE n'est SARGable que lorsque le modèle commence par l'ancre ^ ; le modèle ancré peut alors contenir des quantificateurs et des plages comme [0-9]{4}. Sans indicateur, la correspondance est sensible à la casse (indicateur c) : tx-1234 n'est donc pas renvoyé.
  options:
    a: { en: "The pattern doesn't start with ^, so it isn't SARGable, and it also matches values such as XTX-1234.", fr: "Le modèle ne commence pas par ^ : il n'est pas SARGable, et il correspond aussi à des valeurs comme XTX-1234." }
    b: { en: "The i flag makes the match case-insensitive, so tx-1234 is returned.", fr: "L'indicateur i rend la correspondance insensible à la casse : tx-1234 est donc renvoyé." }
    c: { en: "A pattern that starts with .* instead of ^ can't use an index seek.", fr: "Un modèle qui commence par .* au lieu de ^ ne peut pas utiliser de recherche d'index." }
references:
  - title: REGEXP_LIKE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-like-transact-sql
