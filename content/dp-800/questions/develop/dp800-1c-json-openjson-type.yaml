id: dp800-1c-json-openjson-type
objective: "1.3.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You have the following Transact-SQL code.

    ```sql
    DECLARE @doc nvarchar(max) =
        N'{"name":"Kiosk-7","floor":2,"tags":["lobby","24h"],"owner":{"team":"Ops"}}';

    SELECT [key], [value], [type]
    FROM OPENJSON(@doc)
    WHERE [type] = <value>;
    ```

    You need the query to return only the first-level properties whose value is a JSON array.

    Which value should you use?
  fr: |
    Vous disposez du code Transact-SQL suivant.

    ```sql
    DECLARE @doc nvarchar(max) =
        N'{"name":"Kiosk-7","floor":2,"tags":["lobby","24h"],"owner":{"team":"Ops"}}';

    SELECT [key], [value], [type]
    FROM OPENJSON(@doc)
    WHERE [type] = <value>;
    ```

    La requête doit renvoyer uniquement les propriétés de premier niveau dont la valeur est un tableau JSON.

    Quelle valeur devez-vous utiliser ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "4" }
    - { id: d, text: "5" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Without a WITH clause, OPENJSON returns the key, value and type columns for each first-level property. The type column is 0 for null, 1 for a string, 2 for a number, 3 for true or false, 4 for an array and 5 for an object, so type = 4 returns only the tags property.
    fr: |
      Sans clause WITH, OPENJSON renvoie les colonnes key, value et type pour chaque propriété de premier niveau. La colonne type vaut 0 pour null, 1 pour une chaîne, 2 pour un nombre, 3 pour true ou false, 4 pour un tableau et 5 pour un objet : type = 4 ne renvoie donc que la propriété tags.
  options:
    a: { en: "Type 1 identifies string values, such as name.", fr: "Le type 1 identifie les valeurs de type chaîne, comme name." }
    b: { en: "Type 2 identifies numbers, such as floor.", fr: "Le type 2 identifie les nombres, comme floor." }
    d: { en: "Type 5 identifies objects, such as owner.", fr: "Le type 5 identifie les objets, comme owner." }
references:
  - title: OPENJSON (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/openjson-transact-sql
