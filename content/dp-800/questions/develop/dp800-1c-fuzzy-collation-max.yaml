id: dp800-1c-fuzzy-collation-max
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a SQL Server 2025 database in which the PREVIEW_FEATURES database scoped configuration is set to ON. The database contains two tables named **Sales.Customer** and **Staging.Customer**. Both tables have a FullName column of type nvarchar(max) that uses the SQL_Latin1_General_CP1_CI_AS collation. No FullName value is longer than 200 characters.

    You need to find the pairs of rows whose FullName values are within two edits of each other. The comparison must be case-insensitive. You can't change the table definitions.

    Which predicate should you use?
  fr: |
    Vous disposez d'une base de données SQL Server 2025 dans laquelle la configuration délimitée à la base de données PREVIEW_FEATURES est définie sur ON. La base de données contient deux tables nommées **Sales.Customer** et **Staging.Customer**. Les deux tables ont une colonne FullName de type nvarchar(max) qui utilise le classement SQL_Latin1_General_CP1_CI_AS. Aucune valeur FullName ne dépasse 200 caractères.

    Vous devez trouver les paires de lignes dont les valeurs FullName sont à deux modifications ou moins l'une de l'autre. La comparaison doit être insensible à la casse. Vous ne pouvez pas modifier la définition des tables.

    Quel prédicat devez-vous utiliser ?
body:
  options:
    - id: a
      text: "`EDIT_DISTANCE(CAST(a.FullName AS nvarchar(200)) COLLATE Latin1_General_100_CI_AS, CAST(b.FullName AS nvarchar(200)) COLLATE Latin1_General_100_CI_AS) <= 2`"
    - id: b
      text: "`EDIT_DISTANCE(a.FullName COLLATE Latin1_General_100_CI_AS, b.FullName COLLATE Latin1_General_100_CI_AS) <= 2`"
    - id: c
      text: "`EDIT_DISTANCE(CAST(a.FullName AS nvarchar(200)), CAST(b.FullName AS nvarchar(200))) <= 2`"
    - id: d
      text: "`EDIT_DISTANCE(CAST(a.FullName AS nvarchar(200)) COLLATE Latin1_General_100_BIN2, CAST(b.FullName AS nvarchar(200)) COLLATE Latin1_General_100_BIN2) <= 2`"
answer: { optionId: a }
explanation:
  correct:
    en: |
      The fuzzy string matching functions don't accept varchar(max) or nvarchar(max) arguments, and they don't support non-binary SQL_* collations. Casting to nvarchar(200) and applying a Windows collation with COLLATE fixes both problems, and the CI collation keeps the comparison case-insensitive, because the collation of the inputs determines case and accent sensitivity.
    fr: |
      Les fonctions de correspondance de chaînes floue n'acceptent pas d'arguments varchar(max) ou nvarchar(max), et elles ne prennent pas en charge les classements SQL_* non binaires. La conversion en nvarchar(200) et l'application d'un classement Windows avec COLLATE corrigent les deux problèmes, et le classement CI garde une comparaison insensible à la casse, car le classement des entrées détermine la sensibilité à la casse et aux accents.
  options:
    b: { en: "The Windows collation is supported, but the arguments are still nvarchar(max), which the function doesn't accept.", fr: "Le classement Windows est pris en charge, mais les arguments restent de type nvarchar(max), que la fonction n'accepte pas." }
    c: { en: "The values keep the SQL_Latin1_General_CP1_CI_AS collation, and non-binary SQL_* collations aren't supported.", fr: "Les valeurs conservent le classement SQL_Latin1_General_CP1_CI_AS, et les classements SQL_* non binaires ne sont pas pris en charge." }
    d: { en: "Binary collations are supported, but they compare case-sensitively, which violates the requirement.", fr: "Les classements binaires sont pris en charge, mais ils comparent en respectant la casse, ce qui ne respecte pas l'exigence." }
references:
  - title: What is fuzzy string matching?
    url: https://learn.microsoft.com/en-us/sql/relational-databases/fuzzy-string-match/overview
  - title: EDIT_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/edit-distance-transact-sql
