id: dp800-1d-dab-mcp-http-start
objective: "1.4.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are preparing a local development environment for an AI agent that must work with the dbo.Product table of an Azure SQL database. The connection string is stored in the SQL_CONNECTION_STRING environment variable.

    The solution must meet the following requirements:

    - The agent connects to SQL MCP Server over HTTP.
    - Any caller can read products, but no caller can create, update or delete them.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez un environnement de développement local pour un agent d'IA qui doit travailler avec la table dbo.Product d'une base de données Azure SQL. La chaîne de connexion est stockée dans la variable d'environnement SQL_CONNECTION_STRING.

    La solution doit satisfaire les exigences suivantes :

    - L'agent se connecte à SQL MCP Server en HTTP.
    - Tout appelant peut lire les produits, mais aucun appelant ne peut les créer, les mettre à jour ni les supprimer.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    dab init --database-type [[db]] --connection-string "@env('SQL_CONNECTION_STRING')" --host-mode development

    dab add Product --source dbo.Product --source.type table --permissions "[[perm]]" --description "Products sold online"

    dab start

    # MCP endpoint for the agent: http://localhost:5000[[path]]
  slots:
    - id: db
      options:
        - { id: pg, text: postgresql }
        - { id: mssql, text: mssql }
        - { id: cosmos, text: cosmosdb_nosql }
    - id: perm
      options:
        - { id: all, text: "anonymous:*" }
        - { id: create, text: "anonymous:create" }
        - { id: read, text: "anonymous:read" }
    - id: path
      options:
        - { id: mcp, text: /mcp }
        - { id: api, text: /api }
        - { id: graphql, text: /graphql }
answer:
  values: { db: mssql, perm: read, path: mcp }
explanation:
  correct:
    en: |
      Azure SQL Database uses the mssql database type. The permission anonymous:read lets any caller read the entity; SQL MCP Server applies entity permissions to every tool, so create_record, update_record and delete_record aren't available for it. dab start serves the MCP endpoint over streamable HTTP at /mcp, next to the REST and GraphQL endpoints.
    fr: |
      Azure SQL Database utilise le type de base de données mssql. L'autorisation anonymous:read permet à tout appelant de lire l'entité ; SQL MCP Server applique les autorisations des entités à chaque outil, donc create_record, update_record et delete_record ne sont pas disponibles pour elle. dab start sert le point de terminaison MCP en streamable HTTP sur /mcp, à côté des points de terminaison REST et GraphQL.
  options:
    pg: { en: "postgresql is the database type of Azure Database for PostgreSQL.", fr: "postgresql est le type de base de données d'Azure Database for PostgreSQL." }
    cosmos: { en: "cosmosdb_nosql targets Azure Cosmos DB for NoSQL.", fr: "cosmosdb_nosql cible Azure Cosmos DB for NoSQL." }
    all: { en: "* grants every action, including create, update and delete.", fr: "* accorde toutes les actions, y compris create, update et delete." }
    create: { en: "create allows inserts and doesn't allow reads.", fr: "create autorise les insertions et n'autorise pas les lectures." }
    api: { en: "/api is the default path of the REST endpoint.", fr: "/api est le chemin par défaut du point de terminaison REST." }
    graphql: { en: "/graphql is the default path of the GraphQL endpoint.", fr: "/graphql est le chemin par défaut du point de terminaison GraphQL." }
references:
  - title: What is SQL MCP Server?
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/overview
  - title: Data manipulation language (DML) tools in SQL MCP Server
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/data-manipulation-language-tools
