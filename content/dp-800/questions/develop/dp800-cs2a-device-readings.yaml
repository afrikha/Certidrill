id: dp800-cs2a-device-readings
objective: "1.1.3"
type: dropdown
caseStudy: dp800-cs2a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to create dbo.DeviceReadings. The solution must meet the device readings requirements.

    How should you complete the Transact-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer dbo.DeviceReadings. La solution doit satisfaire les exigences relatives aux relevés des appareils.

    Comment devez-vous compléter les instructions Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE dbo.DeviceReadings
    (
        ReadingId bigint IDENTITY(1, 1) NOT NULL,
        PatientId int NOT NULL,
        ReceivedAt datetime2(0) NOT NULL,
        Payload [[type]] NOT NULL,
        CONSTRAINT PK_DeviceReadings PRIMARY KEY [[pk]] (ReadingId)
    );

    CREATE [[idx]] IX_DeviceReadings_Payload
        ON dbo.DeviceReadings (Payload)
        FOR ('$.deviceType', '$.serial');
  slots:
    - id: type
      options:
        - { id: json, text: json }
        - { id: nvmax, text: nvarchar(max) }
        - { id: vc8000, text: varchar(8000) }
        - { id: xml, text: xml }
    - id: pk
      options:
        - { id: cl, text: CLUSTERED }
        - { id: ncl, text: NONCLUSTERED }
        - { id: hash, text: NONCLUSTERED HASH }
    - id: idx
      options:
        - { id: jsonidx, text: JSON INDEX }
        - { id: ncidx, text: NONCLUSTERED INDEX }
        - { id: ftidx, text: FULLTEXT INDEX }
        - { id: vecidx, text: VECTOR INDEX }
answer:
  values: { type: json, pk: cl, idx: jsonidx }
explanation:
  correct:
    en: |
      The native json data type stores the documents in a binary format and rejects text that is not valid JSON. CREATE JSON INDEX indexes the listed SQL/JSON paths of a json column, so equality filters with JSON_VALUE on $.deviceType and $.serial can use it without computed columns. A JSON index requires a clustered primary key on the table.
    fr: |
      Le type de données natif json stocke les documents dans un format binaire et rejette le texte qui n'est pas du JSON valide. CREATE JSON INDEX indexe les chemins SQL/JSON indiqués d'une colonne json : les filtres d'égalité avec JSON_VALUE sur $.deviceType et $.serial peuvent l'utiliser sans colonnes calculées. Un index JSON exige une clé primaire cluster sur la table.
  options:
    nvmax: { en: "nvarchar(max) accepts any text, including invalid JSON, and a JSON index can only be created on a json column.", fr: "nvarchar(max) accepte n'importe quel texte, y compris du JSON non valide, et un index JSON ne peut être créé que sur une colonne json." }
    vc8000: { en: "varchar(8000) is not a JSON type and does not validate the documents.", fr: "varchar(8000) n'est pas un type JSON et ne valide pas les documents." }
    xml: { en: "xml stores XML documents, not JSON.", fr: "xml stocke des documents XML, pas du JSON." }
    ncl: { en: "Without a clustered primary key, CREATE JSON INDEX raises an error.", fr: "Sans clé primaire cluster, CREATE JSON INDEX génère une erreur." }
    hash: { en: "Hash indexes are for memory-optimized tables, and a JSON index cannot be created on a memory-optimized table.", fr: "Les index de hachage concernent les tables optimisées en mémoire, et un index JSON ne peut pas être créé sur une table optimisée en mémoire." }
    ncidx: { en: "A nonclustered index cannot use a FOR clause with JSON paths; it would require computed columns.", fr: "Un index non cluster ne peut pas utiliser de clause FOR avec des chemins JSON ; il faudrait des colonnes calculées." }
    ftidx: { en: "A full-text index supports word searches, not equality on JSON paths.", fr: "Un index de recherche en texte intégral prend en charge la recherche de mots, pas l'égalité sur des chemins JSON." }
    vecidx: { en: "A vector index applies to a vector column for similarity search.", fr: "Un index vectoriel s'applique à une colonne vector pour la recherche de similarité." }
references:
  - title: CREATE JSON INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-json-index-transact-sql
