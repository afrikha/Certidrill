id: dp800-1a-truncate-partitions
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a SQL Server 2025 database that contains a table named **Ops.EventLog**. The table is partitioned by month, and all its indexes are aligned. No foreign key references the table.

    You need to remove all the rows of partitions 2 and 3 and keep the rows of the other partitions. The solution must minimize transaction logging.

    Which statement should you run?
  fr: |
    Adatum dispose d'une base de données SQL Server 2025 qui contient une table nommée **Ops.EventLog**. La table est partitionnée par mois, et tous ses index sont alignés. Aucune clé étrangère ne référence la table.

    Vous devez supprimer toutes les lignes des partitions 2 et 3 et conserver les lignes des autres partitions. La solution doit réduire au minimum la journalisation des transactions.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "DELETE FROM Ops.EventLog WHERE $PARTITION.PF_Month(LoggedOn) IN (2, 3);" }
    - { id: b, text: "TRUNCATE TABLE Ops.EventLog WITH (PARTITIONS (2 TO 3));" }
    - { id: c, text: "ALTER PARTITION FUNCTION PF_Month() MERGE RANGE ('2026-02-01');" }
    - { id: d, text: "ALTER INDEX ALL ON Ops.EventLog REBUILD PARTITION = 2;" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      TRUNCATE TABLE ... WITH (PARTITIONS (...)) empties only the listed partitions, and a range such as 2 TO 3 is allowed. TRUNCATE deallocates data pages and logs only the page deallocations, so it uses far less log than DELETE. The table and its indexes must be aligned, which is the case here.
    fr: |
      TRUNCATE TABLE ... WITH (PARTITIONS (...)) ne vide que les partitions indiquées, et une plage comme 2 TO 3 est autorisée. TRUNCATE libère les pages de données et ne journalise que ces libérations : il utilise beaucoup moins de journal que DELETE. La table et ses index doivent être alignés, ce qui est le cas ici.
  options:
    a: { en: "DELETE removes the right rows but logs each deleted row.", fr: "DELETE supprime les bonnes lignes mais journalise chaque ligne supprimée." }
    c: { en: "MERGE RANGE combines two partitions and keeps their rows.", fr: "MERGE RANGE fusionne deux partitions et conserve leurs lignes." }
    d: { en: "Rebuilding an index partition reorganizes its data; it removes no rows.", fr: "La reconstruction d'une partition d'index réorganise ses données ; elle ne supprime aucune ligne." }
references:
  - title: TRUNCATE TABLE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/truncate-table-transact-sql
