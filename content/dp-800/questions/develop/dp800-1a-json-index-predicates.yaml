id: dp800-1a-json-index-predicates
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a table named **Sales.Orders** in SQL Server 2025. The table has a clustered primary key and a json column named **OrderDoc**. You create the following index.

    ```sql
    CREATE JSON INDEX JX_Orders_OrderDoc
        ON Sales.Orders (OrderDoc)
        FOR ('$.status', '$.giftWrap');
    ```

    Which two WHERE clauses can use JX_Orders_OrderDoc?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une table nommée **Sales.Orders** dans SQL Server 2025. La table a une clé primaire cluster et une colonne json nommée **OrderDoc**. Vous créez l'index suivant.

    ```sql
    CREATE JSON INDEX JX_Orders_OrderDoc
        ON Sales.Orders (OrderDoc)
        FOR ('$.status', '$.giftWrap');
    ```

    Quelles sont les deux clauses WHERE qui peuvent utiliser JX_Orders_OrderDoc ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "WHERE JSON_VALUE(OrderDoc, '$.status') LIKE 'ship%'" }
    - { id: b, text: "WHERE JSON_VALUE(OrderDoc, '$.status') = 'shipped'" }
    - { id: c, text: "WHERE JSON_VALUE(OrderDoc, '$.status') IS NULL" }
    - { id: d, text: "WHERE JSON_PATH_EXISTS(OrderDoc, '$.giftWrap') = 1" }
    - { id: e, text: "WHERE JSON_VALUE(OrderDoc, '$.customer.id') = '42'" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A JSON index serves equality predicates on JSON_VALUE and JSON_PATH_EXISTS(...) = 1 (and JSON_CONTAINS) for the indexed paths. Both clauses use an indexed path with an equality comparison.
    fr: |
      Un index JSON sert les prédicats d'égalité sur JSON_VALUE et JSON_PATH_EXISTS(...) = 1 (ainsi que JSON_CONTAINS) pour les chemins indexés. Les deux clauses utilisent un chemin indexé avec une comparaison d'égalité.
  options:
    a: { en: "LIKE on JSON_VALUE isn't currently supported by JSON indexes.", fr: "LIKE sur JSON_VALUE n'est actuellement pas pris en charge par les index JSON." }
    c: { en: "IS [NOT] NULL on JSON_VALUE isn't currently supported by JSON indexes.", fr: "IS [NOT] NULL sur JSON_VALUE n'est actuellement pas pris en charge par les index JSON." }
    e: { en: "$.customer.id isn't one of the indexed paths.", fr: "$.customer.id ne fait pas partie des chemins indexés." }
references:
  - title: CREATE JSON INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-json-index-transact-sql
