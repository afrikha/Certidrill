stem:
  en: You rank the orders by date with RANK in a CTE and keep rank 1.
  fr: Vous classez les commandes par date avec RANK dans une CTE et conservez le rang 1.
body:
  solution:
    en: |
      You run the following query:

      ```sql
      WITH Ranked AS
      (
          SELECT OrderID, CustomerID, OrderDate, Amount,
                 RANK() OVER (PARTITION BY CustomerID
                              ORDER BY OrderDate DESC) AS rk
          FROM Sales.Orders
      )
      SELECT OrderID, CustomerID, OrderDate, Amount
      FROM Ranked
      WHERE rk = 1;
      ```
    fr: |
      Vous exécutez la requête suivante :

      ```sql
      WITH Ranked AS
      (
          SELECT OrderID, CustomerID, OrderDate, Amount,
                 RANK() OVER (PARTITION BY CustomerID
                              ORDER BY OrderDate DESC) AS rk
          FROM Sales.Orders
      )
      SELECT OrderID, CustomerID, OrderDate, Amount
      FROM Ranked
      WHERE rk = 1;
      ```
answer: { value: false }
explanation:
  correct:
    en: RANK gives the same value to rows that tie on the ORDER BY expression. When a customer placed two orders on the latest date, both orders get rank 1 and the query returns two rows for that customer. The window also ignores OrderID, so it cannot select the order with the highest OrderID.
    fr: "RANK attribue la même valeur aux lignes à égalité sur l'expression ORDER BY. Lorsqu'un client a passé deux commandes à la dernière date, les deux commandes obtiennent le rang 1 et la requête renvoie deux lignes pour ce client. La fenêtre ignore aussi OrderID : elle ne peut pas sélectionner la commande dont la valeur d'OrderID est la plus élevée."
references:
