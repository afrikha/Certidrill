id: dp800-1b-view-updatable
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains the following view. No trigger is defined on the view or on the tables.

    ```sql
    CREATE VIEW Sales.vOrderCustomer
    AS
    SELECT o.OrderID, o.OrderDate, o.Status,
           c.CustomerID, c.FullName,
           o.Quantity * o.UnitPrice AS LineAmount
    FROM Sales.Orders AS o
    JOIN Sales.Customer AS c ON c.CustomerID = o.CustomerID;
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient la vue suivante. Aucun déclencheur n'est défini sur la vue ni sur les tables.

    ```sql
    CREATE VIEW Sales.vOrderCustomer
    AS
    SELECT o.OrderID, o.OrderDate, o.Status,
           c.CustomerID, c.FullName,
           o.Quantity * o.UnitPrice AS LineAmount
    FROM Sales.Orders AS o
    JOIN Sales.Customer AS c ON c.CustomerID = o.CustomerID;
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "`UPDATE Sales.vOrderCustomer SET Status = 'Shipped' WHERE OrderID = 1001;` succeeds."
        fr: "`UPDATE Sales.vOrderCustomer SET Status = 'Shipped' WHERE OrderID = 1001;` réussit."
    - id: s2
      text:
        en: "`UPDATE Sales.vOrderCustomer SET Status = 'Shipped', FullName = N'Ana Silva' WHERE OrderID = 1001;` succeeds."
        fr: "`UPDATE Sales.vOrderCustomer SET Status = 'Shipped', FullName = N'Ana Silva' WHERE OrderID = 1001;` réussit."
    - id: s3
      text:
        en: "`UPDATE Sales.vOrderCustomer SET LineAmount = 250 WHERE OrderID = 1001;` succeeds."
        fr: "`UPDATE Sales.vOrderCustomer SET LineAmount = 250 WHERE OrderID = 1001;` réussit."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A modification through a view must reference columns from only one base table, and the modified columns must directly reference table columns. Setting Status changes only Sales.Orders, so it succeeds. Setting Status and FullName in one statement touches two base tables and fails. LineAmount is a computed expression, so it cannot be updated; an INSTEAD OF trigger would be needed for such modifications.
    fr: |
      Une modification par une vue ne doit référencer que des colonnes d'une seule table de base, et les colonnes modifiées doivent référencer directement des colonnes de table. Modifier Status ne touche que Sales.Orders : l'instruction réussit. Modifier Status et FullName dans la même instruction touche deux tables de base et échoue. LineAmount est une expression calculée : elle ne peut pas être modifiée ; un déclencheur INSTEAD OF serait nécessaire pour ce type de modification.
references:
  - title: CREATE VIEW (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-view-transact-sql
