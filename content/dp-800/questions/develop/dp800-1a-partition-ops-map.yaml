id: dp800-1a-partition-ops-map
objective: "1.1.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware manages a table named **Sales.Shipment** that is partitioned by month by the partition function **PF_Month** and the partition scheme **PS_Month**.

    Which Transact-SQL element should you use for each task? To answer, drag the appropriate elements to the correct tasks. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware gère une table nommée **Sales.Shipment** partitionnée par mois par la fonction de partition **PF_Month** et le schéma de partition **PS_Month**.

    Quel élément Transact-SQL devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les éléments appropriés vers les tâches correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pfn, text: "$PARTITION.PF_Month(ShippedOn)" }
    - { id: split, text: "ALTER PARTITION FUNCTION ... SPLIT RANGE" }
    - { id: merge, text: "ALTER PARTITION FUNCTION ... MERGE RANGE" }
    - { id: switch, text: "ALTER TABLE ... SWITCH PARTITION" }
    - { id: nextused, text: "ALTER PARTITION SCHEME ... NEXT USED" }
    - { id: lock, text: "ALTER TABLE ... SET (LOCK_ESCALATION = AUTO)" }
  targets:
    - id: count
      text: { en: "Count the rows stored in each partition", fr: "Compter les lignes stockées dans chaque partition" }
    - id: add
      text: { en: "Add a boundary for next month", fr: "Ajouter une limite pour le mois prochain" }
    - id: remove
      text: { en: "Remove the boundary between two empty partitions", fr: "Supprimer la limite entre deux partitions vides" }
    - id: move
      text: { en: "Move the rows of one partition to an empty table that has the same structure", fr: "Déplacer les lignes d'une partition vers une table vide de même structure" }
answer:
  mapping: { count: pfn, add: split, remove: merge, move: switch }
explanation:
  correct:
    en: |
      $PARTITION returns the partition number of a value, so grouping by it counts the rows per partition. SPLIT RANGE adds a boundary and MERGE RANGE removes one. SWITCH PARTITION reassigns a partition's data to an existing empty table.
    fr: |
      $PARTITION renvoie le numéro de partition d'une valeur : un regroupement sur cette expression compte les lignes par partition. SPLIT RANGE ajoute une limite et MERGE RANGE en supprime une. SWITCH PARTITION réaffecte les données d'une partition à une table vide existante.
  options:
    nextused: { en: "NEXT USED designates the filegroup for the next split; it doesn't add the boundary itself.", fr: "NEXT USED désigne le groupe de fichiers du prochain fractionnement ; il n'ajoute pas la limite lui-même." }
    lock: { en: "LOCK_ESCALATION = AUTO allows partition-level lock escalation; it changes no partition.", fr: "LOCK_ESCALATION = AUTO autorise l'escalade de verrous au niveau de la partition ; il ne modifie aucune partition." }
references:
  - title: $PARTITION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/partition-transact-sql
  - title: ALTER PARTITION FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-partition-function-transact-sql
