id: dp800-1d-copilot-enable-location
objective: "1.4.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is rolling out AI-assisted tools for its SQL developers and analysts. You must enable or restrict each tool where it is configured.

    Where should you configure each requirement? To answer, drag the appropriate locations to the correct requirements. Each location may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam déploie des outils assistés par IA pour ses développeurs SQL et ses analystes. Vous devez activer ou restreindre chaque outil là où il est configuré.

    Où devez-vous configurer chaque exigence ? Pour répondre, faites glisser les emplacements appropriés vers les exigences correspondantes. Chaque emplacement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: installer, text: { en: "Visual Studio Installer: AI Assistance workload", fr: "Visual Studio Installer : charge de travail AI Assistance" } }
    - { id: vscode, text: { en: "Visual Studio Code Extensions view: GitHub Copilot Chat and SQL Server (mssql)", fr: "Vue Extensions de Visual Studio Code : GitHub Copilot Chat et SQL Server (mssql)" } }
    - { id: fabric, text: { en: "Fabric admin portal: tenant settings", fr: "Portail d'administration Fabric : paramètres du locataire" } }
    - { id: gpo, text: { en: "Group Policy: Disable Agent Mode under Copilot Settings", fr: "Stratégie de groupe : Disable Agent Mode sous Copilot Settings" } }
    - { id: entra, text: { en: "Azure portal: Microsoft Entra admin of the logical server", fr: "Portail Azure : administrateur Microsoft Entra du serveur logique" } }
    - { id: repo, text: { en: "Repository: .github/copilot-instructions.md", fr: "Dépôt : .github/copilot-instructions.md" } }
  targets:
    - { id: ssms, text: { en: "Developers use GitHub Copilot in SSMS 22", fr: "Les développeurs utilisent GitHub Copilot dans SSMS 22" } }
    - { id: code, text: { en: "Developers chat with an Azure SQL database in Visual Studio Code", fr: "Les développeurs conversent avec une base de données Azure SQL dans Visual Studio Code" } }
    - { id: analysts, text: { en: "Analysts use Copilot in the query editor of a SQL database in Fabric", fr: "Les analystes utilisent Copilot dans l'éditeur de requête d'une base de données SQL dans Fabric" } }
    - { id: block, text: { en: "Agent mode must be blocked in SSMS on company computers", fr: "Le mode Agent doit être bloqué dans SSMS sur les ordinateurs de l'entreprise" } }
answer:
  mapping: { ssms: installer, code: vscode, analysts: fabric, block: gpo }
explanation:
  correct:
    en: |
      GitHub Copilot in SSMS 22 is installed with the AI Assistance workload of the Visual Studio Installer. In Visual Studio Code, database chat needs the GitHub Copilot Chat and SQL Server (mssql) extensions. Copilot in Fabric is turned on by a Fabric administrator in the tenant settings. On managed computers, the Disable Agent Mode policy of the SSMS administrative templates (SSMS 22.7 and later) turns Agent mode off.
    fr: |
      GitHub Copilot dans SSMS 22 s'installe avec la charge de travail AI Assistance de Visual Studio Installer. Dans Visual Studio Code, la conversation avec la base de données nécessite les extensions GitHub Copilot Chat et SQL Server (mssql). Copilot dans Fabric est activé par un administrateur Fabric dans les paramètres du locataire. Sur les ordinateurs gérés, la stratégie Disable Agent Mode des modèles d'administration de SSMS (SSMS 22.7 et versions ultérieures) désactive le mode Agent.
  options:
    entra: { en: "The Microsoft Entra admin controls database authentication, not AI tools.", fr: "L'administrateur Microsoft Entra contrôle l'authentification à la base de données, pas les outils d'IA." }
    repo: { en: "An instruction file guides Copilot's answers; it doesn't enable or block a tool.", fr: "Un fichier d'instructions guide les réponses de Copilot ; il n'active ni ne bloque un outil." }
references:
  - title: Admin controls for GitHub Copilot in SQL Server Management Studio
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/admin-controls
  - title: Enable GitHub Copilot and Fabric Copilot
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/4-enable-github-copilot-fabric-copilot
