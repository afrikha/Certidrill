id: dp800-1d-applyto-database-folder
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A repository opened as the workspace in Visual Studio Code has the following structure.

    ```text
    .github/
      copilot-instructions.md
      instructions/
    database/
      tables/Customer.sql
      procedures/usp_GetCustomer.sql
    tests/
      unit/test_usp_GetCustomer.sql
    ```

    You create `.github/instructions/database.instructions.md`. Its rules must apply to every .sql file under database, including the files in its subfolders, and to no other file.

    Which applyTo value should you use in the frontmatter of the file?
  fr: |
    Un dépôt ouvert comme espace de travail dans Visual Studio Code présente la structure suivante.

    ```text
    .github/
      copilot-instructions.md
      instructions/
    database/
      tables/Customer.sql
      procedures/usp_GetCustomer.sql
    tests/
      unit/test_usp_GetCustomer.sql
    ```

    Vous créez `.github/instructions/database.instructions.md`. Ses règles doivent s'appliquer à chaque fichier .sql situé sous database, y compris les fichiers de ses sous-dossiers, et à aucun autre fichier.

    Quelle valeur applyTo devez-vous utiliser dans l'en-tête (frontmatter) du fichier ?
body:
  options:
    - { id: a, text: "`'**/*.sql'`" }
    - { id: b, text: "`'database/*.sql'`" }
    - { id: c, text: "`'../../database/**/*.sql'`" }
    - { id: d, text: "`'database/**/*.sql'`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      applyTo patterns are relative to the root of the workspace, not to the .github/instructions folder. In `database/**/*.sql`, `**` matches any number of subfolders, so the pattern covers database/tables and database/procedures and nothing outside database.
    fr: |
      Les modèles applyTo sont relatifs à la racine de l'espace de travail, pas au dossier .github/instructions. Dans `database/**/*.sql`, `**` correspond à un nombre quelconque de sous-dossiers : le modèle couvre database/tables et database/procedures, et rien en dehors de database.
  options:
    a: { en: "This pattern also matches the test scripts under tests, which must not receive the rules.", fr: "Ce modèle correspond aussi aux scripts de test sous tests, qui ne doivent pas recevoir les règles." }
    b: { en: "A single * doesn't cross folders: the pattern matches only .sql files directly in database, and there are none.", fr: "Un seul * ne traverse pas les dossiers : le modèle ne correspond qu'aux fichiers .sql placés directement dans database, et il n'y en a aucun." }
    c: { en: "The pattern isn't relative to the instructions file; it is evaluated from the workspace root.", fr: "Le modèle n'est pas relatif au fichier d'instructions : il est évalué depuis la racine de l'espace de travail." }
references:
  - title: "Quickstart: Use custom instructions to align GitHub Copilot with your T-SQL conventions"
    url: https://learn.microsoft.com/en-us/sql/tools/visual-studio-code-extensions/github-copilot/custom-instructions
