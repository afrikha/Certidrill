stem:
  en: You filter on ROW_NUMBER in the WHERE clause of the query.
  fr: Vous filtrez sur ROW_NUMBER dans la clause WHERE de la requête.
body:
  solution:
    en: |
      You run the following query:

      ```sql
      SELECT OrderID, CustomerID, OrderDate, Amount
      FROM Sales.Orders
      WHERE ROW_NUMBER() OVER (PARTITION BY CustomerID
                               ORDER BY OrderDate DESC, OrderID DESC) = 1;
      ```
    fr: |
      Vous exécutez la requête suivante :

      ```sql
      SELECT OrderID, CustomerID, OrderDate, Amount
      FROM Sales.Orders
      WHERE ROW_NUMBER() OVER (PARTITION BY CustomerID
                               ORDER BY OrderDate DESC, OrderID DESC) = 1;
      ```
answer: { value: false }
explanation:
  correct:
    en: The window specification is right, but a window function can appear only in the SELECT list or the ORDER BY clause, so this query fails with an error. To filter on the row number, compute it in a common table expression or a derived table, and then filter on its alias in the outer query.
    fr: "La spécification de fenêtre est correcte, mais une fonction de fenêtre ne peut apparaître que dans la liste SELECT ou dans la clause ORDER BY : cette requête échoue avec une erreur. Pour filtrer sur le numéro de ligne, calculez-le dans une expression de table commune ou une table dérivée, puis filtrez sur son alias dans la requête externe."
references:
