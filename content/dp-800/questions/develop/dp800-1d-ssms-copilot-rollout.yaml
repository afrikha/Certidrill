id: dp800-1d-ssms-copilot-rollout
objective: "1.4.2"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Northwind plans to roll out GitHub Copilot in SQL Server Management Studio (SSMS) 22 to its database team. Developers need inline autocompletions in the query editor. Database administrators need Agent mode with MCP servers.

    How should you complete the rollout plan? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind prévoit de déployer GitHub Copilot dans SQL Server Management Studio (SSMS) 22 pour son équipe de bases de données. Les développeurs ont besoin des saisies semi-automatiques en ligne dans l'éditeur de requête. Les administrateurs de bases de données ont besoin du mode Agent avec des serveurs MCP.

    Comment devez-vous compléter le plan de déploiement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Developers must run SSMS [[v1]] or later.

      Database administrators must run SSMS [[v2]] or later.

      Each user signs in to GitHub Copilot with [[acct]].
    fr: |
      Les développeurs doivent exécuter SSMS [[v1]] ou une version ultérieure.

      Les administrateurs de bases de données doivent exécuter SSMS [[v2]] ou une version ultérieure.

      Chaque utilisateur se connecte à GitHub Copilot avec [[acct]].
  slots:
    - id: v1
      options:
        - { id: v220, text: "22.0" }
        - { id: v222, text: "22.2" }
        - { id: v227, text: "22.7" }
    - id: v2
      options:
        - { id: v220, text: "22.0" }
        - { id: v222, text: "22.2" }
        - { id: v227, text: "22.7" }
    - id: acct
      options:
        - { id: m365, text: { en: "a work account that has a Microsoft 365 Copilot license", fr: "un compte professionnel qui dispose d'une licence Microsoft 365 Copilot" } }
        - { id: github, text: { en: "a GitHub account that has Copilot access", fr: "un compte GitHub qui a accès à Copilot" } }
        - { id: fabric, text: { en: "a Microsoft Entra account that has access to a Fabric F2 capacity", fr: "un compte Microsoft Entra qui a accès à une capacité Fabric F2" } }
answer:
  values: { v1: v222, v2: v227, acct: github }
explanation:
  correct:
    en: |
      Autocompletions in the SSMS query editor are available from SSMS 22.2, and Agent mode, which MCP servers require, from SSMS 22.7. GitHub Copilot in SSMS requires a GitHub account with Copilot access (a paid plan or Copilot Free).
    fr: |
      Les saisies semi-automatiques dans l'éditeur de requête de SSMS sont disponibles à partir de SSMS 22.2, et le mode Agent, nécessaire aux serveurs MCP, à partir de SSMS 22.7. GitHub Copilot dans SSMS exige un compte GitHub avec un accès à Copilot (un forfait payant ou Copilot Free).
  options:
    m365: { en: "Microsoft 365 Copilot is a different product; it doesn't give access to GitHub Copilot.", fr: "Microsoft 365 Copilot est un produit différent : il ne donne pas accès à GitHub Copilot." }
    fabric: { en: "A Fabric capacity is a prerequisite of Copilot in Fabric, not of GitHub Copilot in SSMS.", fr: "Une capacité Fabric est un prérequis de Copilot dans Fabric, pas de GitHub Copilot dans SSMS." }
references:
  - title: What is GitHub Copilot in SQL Server Management Studio?
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/overview
  - title: Use MCP servers with GitHub Copilot in SQL Server Management Studio
    url: https://learn.microsoft.com/en-us/ssms/github-copilot/mcp-servers
