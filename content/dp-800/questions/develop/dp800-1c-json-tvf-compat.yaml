id: dp800-1c-json-tvf-compat
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **sqldb-orders** that has a compatibility level of 120. A third-party application that uses the database is certified only at compatibility levels 120 and 130. Company policy forbids preview features in production databases.

    A new stored procedure must shred a JSON payload into one row per order line by using the following query.

    ```sql
    SELECT l.Sku, l.Qty
    FROM OPENJSON(@payload, '$.order.lines')
         WITH (Sku varchar(20) '$.sku', Qty int '$.qty') AS l;
    ```

    The query fails because OPENJSON isn't recognized.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **sqldb-orders** dont le niveau de compatibilité est 120. Une application tierce qui utilise la base de données n'est certifiée qu'aux niveaux de compatibilité 120 et 130. La politique de l'entreprise interdit les fonctionnalités en préversion dans les bases de données de production.

    Une nouvelle procédure stockée doit décomposer une charge utile JSON en une ligne par ligne de commande à l'aide de la requête suivante.

    ```sql
    SELECT l.Sku, l.Qty
    FROM OPENJSON(@payload, '$.order.lines')
         WITH (Sku varchar(20) '$.sku', Qty int '$.qty') AS l;
    ```

    La requête échoue, car OPENJSON n'est pas reconnu.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: "`ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 130;`"
    - id: b
      text: "`ALTER DATABASE SCOPED CONFIGURATION SET ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS = ON;`"
    - id: c
      text: "`ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 170;`"
    - id: d
      text: { en: "Replace OPENJSON with `JSON_VALUE(@payload, '$.order.lines')`.", fr: "Remplacer OPENJSON par `JSON_VALUE(@payload, '$.order.lines')`." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      OPENJSON requires compatibility level 130 or higher. Level 130 is the lowest level that makes OPENJSON available, and the application is certified at it. No preview feature is involved.
    fr: |
      OPENJSON exige le niveau de compatibilité 130 ou supérieur. Le niveau 130 est le plus bas qui rend OPENJSON disponible, et l'application est certifiée à ce niveau. Aucune fonctionnalité en préversion n'est utilisée.
  options:
    b: { en: "ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS lets OPENJSON run at level 120, but this database scoped configuration is in preview, which the policy forbids.", fr: "ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS permet d'exécuter OPENJSON au niveau 120, mais cette configuration délimitée à la base de données est en préversion, ce que la politique interdit." }
    c: { en: "Level 170 also makes OPENJSON available, but the application isn't certified at that level.", fr: "Le niveau 170 rend aussi OPENJSON disponible, mais l'application n'est pas certifiée à ce niveau." }
    d: { en: "JSON_VALUE returns one scalar; for an array it returns NULL and it never produces one row per element.", fr: "JSON_VALUE renvoie une seule valeur scalaire ; pour un tableau, il renvoie NULL et il ne produit jamais une ligne par élément." }
references:
  - title: OPENJSON (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/openjson-transact-sql
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
