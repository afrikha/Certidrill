id: dp800-1c-json-tvf-compat
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **sqldb-orders** that has a compatibility level of 120. A third-party application that uses the database is certified only at this compatibility level, so the level must not change.

    A new stored procedure must shred a JSON payload into one row per order line by using the following query.

    ```sql
    SELECT l.Sku, l.Qty
    FROM OPENJSON(@payload, '$.order.lines')
         WITH (Sku varchar(20) '$.sku', Qty int '$.qty') AS l;
    ```

    The query fails because OPENJSON isn't recognized.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **sqldb-orders** dont le niveau de compatibilité est 120. Une application tierce qui utilise la base de données n'est certifiée qu'à ce niveau de compatibilité : le niveau ne doit donc pas changer.

    Une nouvelle procédure stockée doit décomposer une charge utile JSON en une ligne par ligne de commande à l'aide de la requête suivante.

    ```sql
    SELECT l.Sku, l.Qty
    FROM OPENJSON(@payload, '$.order.lines')
         WITH (Sku varchar(20) '$.sku', Qty int '$.qty') AS l;
    ```

    La requête échoue, car OPENJSON n'est pas reconnu.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: "`ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 130;`"
    - id: b
      text: "`ALTER DATABASE SCOPED CONFIGURATION SET ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS = ON;`"
    - id: c
      text: "`ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;`"
    - id: d
      text: { en: "Replace OPENJSON with `JSON_VALUE(@payload, '$.order.lines')`.", fr: "Remplacer OPENJSON par `JSON_VALUE(@payload, '$.order.lines')`." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      OPENJSON requires compatibility level 130 or higher. In Azure SQL Database, the ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS database scoped configuration (in preview) lets built-in table-valued functions such as OPENJSON, STRING_SPLIT and GENERATE_SERIES run at any compatibility level, so the level stays at 120.
    fr: |
      OPENJSON exige le niveau de compatibilité 130 ou supérieur. Dans Azure SQL Database, la configuration délimitée à la base de données ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS (en préversion) permet aux fonctions table intégrées comme OPENJSON, STRING_SPLIT et GENERATE_SERIES de s'exécuter à n'importe quel niveau de compatibilité : le niveau reste donc à 120.
  options:
    a: { en: "Raising the compatibility level would make OPENJSON available, but the level must stay at 120.", fr: "Relever le niveau de compatibilité rendrait OPENJSON disponible, mais le niveau doit rester à 120." }
    c: { en: "PREVIEW_FEATURES enables preview features; it doesn't remove the compatibility level requirement of OPENJSON.", fr: "PREVIEW_FEATURES active les fonctionnalités en préversion ; il ne lève pas l'exigence de niveau de compatibilité d'OPENJSON." }
    d: { en: "JSON_VALUE returns one scalar; for an array it returns NULL and it never produces one row per element.", fr: "JSON_VALUE renvoie une seule valeur scalaire ; pour un tableau, il renvoie NULL et il ne produit jamais une ligne par élément." }
references:
  - title: OPENJSON (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/openjson-transact-sql
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
