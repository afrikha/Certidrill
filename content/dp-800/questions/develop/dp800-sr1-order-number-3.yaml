id: dp800-sr1-order-number-3
objective: "1.1.5"
type: series_yesno
series: dp800-sr1-order-number
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You create a sequence and use it in a DEFAULT constraint of each table.
  fr: Vous créez une séquence et l'utilisez dans une contrainte DEFAULT de chaque table.
body:
  solution:
    en: |
      You create the following sequence:

      ```sql
      CREATE SEQUENCE Sales.OrderNumber AS int START WITH 500000 INCREMENT BY 1;
      ```

      In the `CREATE TABLE` statement of each table, you define the column as follows:

      ```sql
      OrderNo int NOT NULL DEFAULT (NEXT VALUE FOR Sales.OrderNumber) PRIMARY KEY
      ```
    fr: |
      Vous créez la séquence suivante :

      ```sql
      CREATE SEQUENCE Sales.OrderNumber AS int START WITH 500000 INCREMENT BY 1;
      ```

      Dans l'instruction `CREATE TABLE` de chaque table, vous définissez la colonne comme suit :

      ```sql
      OrderNo int NOT NULL DEFAULT (NEXT VALUE FOR Sales.OrderNumber) PRIMARY KEY
      ```
answer: { value: true }
explanation:
  correct:
    en: A sequence is not tied to a table, and one sequence can be referenced by the DEFAULT constraints of several tables in the same database. Each INSERT that omits OrderNo receives the next value of Sales.OrderNumber, starting at 500000, so a number is never issued to both tables. Values consumed by rolled-back transactions leave gaps, which the requirements accept.
    fr: "Une séquence n'est pas liée à une table, et une même séquence peut être référencée par les contraintes DEFAULT de plusieurs tables de la même base de données. Chaque INSERT qui omet OrderNo reçoit la valeur suivante de Sales.OrderNumber, à partir de 500000 : un numéro n'est jamais attribué aux deux tables. Les valeurs consommées par des transactions annulées laissent des écarts, que les exigences acceptent."
references:
  - title: NEXT VALUE FOR (Transact-SQL)
