id: dp800-1d-fabric-agent-token
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has published a Fabric data agent that uses a warehouse as its data source. A nightly Python job must send questions to the agent through its MCP server URL by using the MCP Python SDK.

    The job runs without any user interaction. Its MCP client doesn't support dynamic client registration.

    What should the job send with each connection to the MCP server?
  fr: |
    Tailspin a publié un agent de données Fabric qui utilise un entrepôt comme source de données. Un travail Python nocturne doit envoyer des questions à l'agent par l'URL de son serveur MCP au moyen du SDK Python MCP.

    Le travail s'exécute sans aucune interaction utilisateur. Son client MCP ne prend pas en charge l'inscription dynamique de clients.

    Que doit envoyer le travail à chaque connexion au serveur MCP ?
body:
  options:
    - { id: a, text: { en: "A bearer token for the scope https://database.windows.net/.default, issued to a service principal that has access to the warehouse", fr: "Un jeton du porteur pour l'étendue https://database.windows.net/.default, émis pour un principal de service qui a accès à l'entrepôt" } }
    - { id: b, text: { en: "A bearer token for the scope https://api.fabric.microsoft.com/.default, issued to a service principal that has access to the workspace and the data agent", fr: "Un jeton du porteur pour l'étendue https://api.fabric.microsoft.com/.default, émis pour un principal de service qui a accès à l'espace de travail et à l'agent de données" } }
    - { id: c, text: { en: "A bearer token for the scope https://api.fabric.microsoft.com/.default, obtained when the job owner signs in interactively in a browser", fr: "Un jeton du porteur pour l'étendue https://api.fabric.microsoft.com/.default, obtenu quand le propriétaire du travail se connecte de manière interactive dans un navigateur" } }
    - { id: d, text: { en: "A SQL authentication user name and password for the warehouse SQL endpoint, in the Authorization header", fr: "Un nom d'utilisateur et un mot de passe d'authentification SQL pour le point de terminaison SQL de l'entrepôt, dans l'en-tête Authorization" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The data agent MCP server expects a bearer token in the Authorization header, requested for the scope https://api.fabric.microsoft.com/.default. The token can represent a user or a service principal that has access to the workspace and the data agent; for unattended runs, use a service principal credential. Because dynamic client registration isn't supported, the client must obtain and attach the token itself.
    fr: |
      Le serveur MCP de l'agent de données attend un jeton du porteur dans l'en-tête Authorization, demandé pour l'étendue https://api.fabric.microsoft.com/.default. Le jeton peut représenter un utilisateur ou un principal de service qui a accès à l'espace de travail et à l'agent de données ; pour les exécutions sans surveillance, utilisez des informations d'identification de principal de service. Comme l'inscription dynamique de clients n'est pas prise en charge, le client doit obtenir et joindre lui-même le jeton.
  options:
    a: { en: "https://database.windows.net/.default is the scope of Azure SQL, not of the Fabric MCP endpoint.", fr: "https://database.windows.net/.default est l'étendue d'Azure SQL, pas du point de terminaison MCP de Fabric." }
    c: { en: "The scope is right, but an interactive sign-in can't happen in a job that runs without user interaction.", fr: "L'étendue est correcte, mais une connexion interactive est impossible dans un travail qui s'exécute sans interaction utilisateur." }
    d: { en: "The endpoint authenticates with a Microsoft Entra bearer token for Fabric, not with SQL credentials.", fr: "Le point de terminaison s'authentifie avec un jeton du porteur Microsoft Entra pour Fabric, pas avec des informations d'identification SQL." }
references:
  - title: Data agent as Model Context Protocol server
    url: https://learn.microsoft.com/en-us/fabric/data-science/data-agent-mcp-server
