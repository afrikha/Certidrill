id: dp800-1a-json-modify-check
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure SQL database. You are creating a table that stores customer profiles in a json column. You need to meet the following requirements:

    - Every profile must contain an email property.
    - The application must change the loyalty tier of a profile by using the method that the json data type provides for in-place updates.

    How should you complete the Transact-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une base de données Azure SQL. Vous créez une table qui stocke des profils client dans une colonne json. Vous devez satisfaire les exigences suivantes :

    - Chaque profil doit contenir une propriété email.
    - L'application doit modifier le niveau de fidélité d'un profil à l'aide de la méthode que le type de données json fournit pour les mises à jour sur place.

    Comment devez-vous compléter les instructions Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE Sales.CustomerProfile
    (
        CustomerID int NOT NULL PRIMARY KEY CLUSTERED,
        Profile    json NOT NULL
            CONSTRAINT CK_Profile_Email CHECK ([[chk]](Profile, '$.email') = 1)
    );

    UPDATE Sales.CustomerProfile
    SET [[set]]
    WHERE CustomerID = 42;
  slots:
    - id: chk
      options:
        - { id: jpe, text: JSON_PATH_EXISTS }
        - { id: isj, text: ISJSON }
        - { id: jv, text: JSON_VALUE }
        - { id: jc, text: JSON_CONTAINS }
    - id: set
      options:
        - { id: modify, text: "Profile.modify('$.tier', 'gold')" }
        - { id: value, text: "Profile.value('$.tier', 'gold')" }
        - { id: jvset, text: "Profile = JSON_VALUE(Profile, '$.tier')" }
        - { id: jqset, text: "Profile = JSON_QUERY(Profile, '$.tier')" }
answer:
  values: { chk: jpe, set: modify }
explanation:
  correct:
    en: |
      JSON_PATH_EXISTS returns 1 when the path exists in the document, so the CHECK constraint rejects profiles without an email property. The modify method of the json type is the preferred way to change a value in a json column; it updates the document in place when the new value fits.
    fr: |
      JSON_PATH_EXISTS renvoie 1 lorsque le chemin existe dans le document : la contrainte CHECK rejette les profils sans propriété email. La méthode modify du type json est la méthode recommandée pour modifier une valeur dans une colonne json ; elle met à jour le document sur place lorsque la nouvelle valeur le permet.
  options:
    isj: { en: "ISJSON tests whether text is valid JSON; its second argument is a type constraint (VALUE, ARRAY, OBJECT, SCALAR), not a path.", fr: "ISJSON vérifie qu'un texte est du JSON valide ; son second argument est une contrainte de type (VALUE, ARRAY, OBJECT, SCALAR), pas un chemin." }
    jv: { en: "JSON_VALUE returns the email text, which isn't a test that the property exists.", fr: "JSON_VALUE renvoie le texte de l'e-mail, ce qui ne vérifie pas l'existence de la propriété." }
    jc: { en: "JSON_CONTAINS tests whether a given search value is present in the document; it doesn't test that a path exists.", fr: "JSON_CONTAINS vérifie si une valeur recherchée donnée est présente dans le document ; il ne vérifie pas l'existence d'un chemin." }
    value: { en: "value() is a method of the xml data type, not of json.", fr: "value() est une méthode du type de données xml, pas du type json." }
    jvset: { en: "This replaces the whole document with a string, which isn't a valid json object.", fr: "Cette instruction remplace tout le document par une chaîne, qui n'est pas un objet json valide." }
    jqset: { en: "This replaces the whole document with the fragment at $.tier instead of changing one property.", fr: "Cette instruction remplace tout le document par le fragment situé dans $.tier au lieu de modifier une propriété." }
references:
  - title: JSON data type
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/json-data-type
