id: dp800-1c-corr-not-in-null
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have the tables **Sales.Customer** (CustomerID) and **Sales.Blocklist**. The CustomerID column of Sales.Blocklist allows NULL values, and one of its rows contains NULL.

    You need to return the customers that aren't in the block list. You write the following query, but it returns no rows.

    ```sql
    SELECT c.CustomerID
    FROM Sales.Customer AS c
    WHERE c.CustomerID NOT IN (SELECT b.CustomerID FROM Sales.Blocklist AS b);
    ```

    You can't change the data of Sales.Blocklist.

    What should you do?
  fr: |
    Vous disposez des tables **Sales.Customer** (CustomerID) et **Sales.Blocklist**. La colonne CustomerID de Sales.Blocklist accepte les valeurs NULL, et l'une de ses lignes contient NULL.

    Vous devez renvoyer les clients qui ne figurent pas dans la liste de blocage. Vous écrivez la requête suivante, mais elle ne renvoie aucune ligne.

    ```sql
    SELECT c.CustomerID
    FROM Sales.Customer AS c
    WHERE c.CustomerID NOT IN (SELECT b.CustomerID FROM Sales.Blocklist AS b);
    ```

    Vous ne pouvez pas modifier les données de Sales.Blocklist.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Replace `NOT IN` with `<> ALL` and keep the same subquery.", fr: "Remplacer `NOT IN` par `<> ALL` et conserver la même sous-requête." }
    - id: b
      text: { en: "Add DISTINCT to the subquery so that the NULL value appears only once.", fr: "Ajouter DISTINCT à la sous-requête pour que la valeur NULL n'apparaisse qu'une fois." }
    - id: c
      text: { en: "Add `OR c.CustomerID IS NULL` after the NOT IN predicate.", fr: "Ajouter `OR c.CustomerID IS NULL` après le prédicat NOT IN." }
    - id: d
      text: { en: "Replace the predicate with `NOT EXISTS (SELECT 1 FROM Sales.Blocklist AS b WHERE b.CustomerID = c.CustomerID)`.", fr: "Remplacer le prédicat par `NOT EXISTS (SELECT 1 FROM Sales.Blocklist AS b WHERE b.CustomerID = c.CustomerID)`." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A NULL returned by the subquery makes every NOT IN comparison UNKNOWN, so no row qualifies. NOT EXISTS with a correlated predicate only checks whether a matching row exists; the NULL row never equals a customer ID and doesn't affect the result.
    fr: |
      Un NULL renvoyé par la sous-requête rend chaque comparaison NOT IN UNKNOWN : aucune ligne n'est retenue. NOT EXISTS avec un prédicat corrélé vérifie seulement qu'une ligne correspondante existe ; la ligne NULL n'est jamais égale à un ID client et n'influence pas le résultat.
  options:
    a: { en: "<> ALL has the same meaning as NOT IN, including the NULL problem.", fr: "<> ALL a le même sens que NOT IN, y compris le problème des NULL." }
    b: { en: "DISTINCT keeps one NULL in the list, so the comparisons are still UNKNOWN.", fr: "DISTINCT conserve un NULL dans la liste : les comparaisons restent UNKNOWN." }
    c: { en: "CustomerID in Sales.Customer isn't NULL, so this adds no rows.", fr: "CustomerID dans Sales.Customer n'est pas NULL : cela n'ajoute aucune ligne." }
references:
  - title: IN (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/in-transact-sql
  - title: Subqueries (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/subqueries
