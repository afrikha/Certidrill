id: dp800-1c-corr-previous-average
objective: "1.3.7"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    A table named **Sales.Orders** contains the rows shown in the answer area. You run the following query.

    ```sql
    SELECT o.OrderID
    FROM Sales.Orders AS o
    WHERE o.Amount > (SELECT AVG(o2.Amount)
                      FROM Sales.Orders AS o2
                      WHERE o2.CustomerID = o.CustomerID
                        AND o2.OrderDate < o.OrderDate);
    ```

    Answer each prompt by selecting the OrderID that the query returns.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une table nommée **Sales.Orders** contient les lignes figurant dans la zone de réponse. Vous exécutez la requête suivante.

    ```sql
    SELECT o.OrderID
    FROM Sales.Orders AS o
    WHERE o.Amount > (SELECT AVG(o2.Amount)
                      FROM Sales.Orders AS o2
                      WHERE o2.CustomerID = o.CustomerID
                        AND o2.OrderDate < o.OrderDate);
    ```

    Répondez à chaque consigne en sélectionnant l'OrderID que la requête renvoie.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The order returned for customer 1", fr: "La commande renvoyée pour le client 1" }
    - id: p2
      text: { en: "The order returned for customer 2", fr: "La commande renvoyée pour le client 2" }
  grid:
    header: [OrderID, CustomerID, OrderDate, Amount]
    rows:
      - [{ text: "101", area: o101 }, { text: "1" }, { text: "2026-01-05" }, { text: "200" }]
      - [{ text: "102", area: o102 }, { text: "1" }, { text: "2026-02-10" }, { text: "150" }]
      - [{ text: "103", area: o103 }, { text: "1" }, { text: "2026-03-15" }, { text: "400" }]
      - [{ text: "201", area: o201 }, { text: "2" }, { text: "2026-01-20" }, { text: "500" }]
      - [{ text: "202", area: o202 }, { text: "2" }, { text: "2026-02-25" }, { text: "600" }]
      - [{ text: "203", area: o203 }, { text: "2" }, { text: "2026-04-02" }, { text: "300" }]
answer:
  values: { p1: o103, p2: o202 }
explanation:
  correct:
    en: |
      For each order, the correlated subquery averages the earlier orders of the same customer. The first order of a customer has no earlier order, so AVG returns NULL and the comparison is UNKNOWN; orders 101 and 201 are excluded. Order 102 (150) isn't above 200, order 103 (400) is above 175, order 202 (600) is above 500 and order 203 (300) isn't above 550.
    fr: |
      Pour chaque commande, la sous-requête corrélée fait la moyenne des commandes antérieures du même client. La première commande d'un client n'a pas de commande antérieure : AVG renvoie NULL et la comparaison est UNKNOWN ; les commandes 101 et 201 sont exclues. La commande 102 (150) n'est pas supérieure à 200, la commande 103 (400) est supérieure à 175, la commande 202 (600) est supérieure à 500 et la commande 203 (300) n'est pas supérieure à 550.
references:
  - title: Subqueries (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/subqueries
