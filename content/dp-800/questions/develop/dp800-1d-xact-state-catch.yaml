id: dp800-1d-xact-state-catch
objective: "1.3.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You run the following batch in an Azure SQL database. Customer 42 has orders in Sales.Orders, and a FOREIGN KEY constraint of Sales.Orders references Sales.Customer, so the DELETE statement fails.

    ```sql
    SET XACT_ABORT ON;
    BEGIN TRY
        BEGIN TRANSACTION;
            DELETE FROM Sales.Customer WHERE CustomerID = 42;
        COMMIT TRANSACTION;
    END TRY
    BEGIN CATCH
        -- error handling code
    END CATCH;
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous exécutez le lot suivant dans une base de données Azure SQL. Le client 42 a des commandes dans Sales.Orders, et une contrainte FOREIGN KEY de Sales.Orders référence Sales.Customer : l'instruction DELETE échoue.

    ```sql
    SET XACT_ABORT ON;
    BEGIN TRY
        BEGIN TRANSACTION;
            DELETE FROM Sales.Customer WHERE CustomerID = 42;
        COMMIT TRANSACTION;
    END TRY
    BEGIN CATCH
        -- error handling code
    END CATCH;
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In the CATCH block, XACT_STATE() returns -1.
        fr: Dans le bloc CATCH, XACT_STATE() renvoie -1.
    - id: s2
      text:
        en: The CATCH block can insert a row into dbo.ErrorLog before it runs ROLLBACK TRANSACTION.
        fr: Le bloc CATCH peut insérer une ligne dans dbo.ErrorLog avant d'exécuter ROLLBACK TRANSACTION.
    - id: s3
      text:
        en: If the CATCH block doesn't roll back the transaction, the Database Engine rolls it back when the batch ends.
        fr: Si le bloc CATCH n'annule pas la transaction, le moteur de base de données l'annule à la fin du lot.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With SET XACT_ABORT ON, the foreign key violation makes the transaction uncommittable, so XACT_STATE() returns -1 in the CATCH block. An uncommittable transaction can only read data or be fully rolled back: any write, such as the INSERT into dbo.ErrorLog, fails until ROLLBACK TRANSACTION runs. When the batch ends, the Database Engine rolls back an uncommittable transaction that is still active.
    fr: |
      Avec SET XACT_ABORT ON, la violation de clé étrangère rend la transaction non validable : XACT_STATE() renvoie -1 dans le bloc CATCH. Une transaction non validable peut seulement lire des données ou être entièrement annulée : toute écriture, comme l'INSERT dans dbo.ErrorLog, échoue tant que ROLLBACK TRANSACTION n'a pas été exécuté. À la fin du lot, le moteur de base de données annule une transaction non validable encore active.
  options:
    s2: { en: "The session can't write until the uncommittable transaction is rolled back.", fr: "La session ne peut pas écrire tant que la transaction non validable n'est pas annulée." }
references:
  - title: XACT_STATE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/xact-state-transact-sql
