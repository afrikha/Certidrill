id: dp800-3a-model-criteria
objective: "3.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware is designing four AI features for its SQL database workloads and is evaluating models in the Microsoft Foundry model catalog.

    Which model capability should Litware prioritize for each feature? To answer, drag the appropriate capabilities to the correct features. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit quatre fonctionnalités d'IA pour ses charges de travail de base de données SQL et évalue des modèles dans le catalogue de modèles Microsoft Foundry.

    Quelle capacité de modèle Litware doit-elle privilégier pour chaque fonctionnalité ? Pour répondre, faites glisser les capacités appropriées vers les fonctionnalités correspondantes. Chaque capacité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: multilang, text: { en: "Multilingual support", fr: "Prise en charge multilingue" } }
    - { id: multimodal, text: { en: "Multimodal input", fr: "Entrées multimodales" } }
    - { id: structured, text: { en: "Structured output (JSON schema)", fr: "Sortie structurée (schéma JSON)" } }
    - { id: small, text: { en: "Smaller model size", fr: "Taille de modèle réduite" } }
    - { id: large, text: { en: "Larger model size", fr: "Taille de modèle accrue" } }
    - { id: dims, text: { en: "More output dimensions", fr: "Davantage de dimensions de sortie" } }
  targets:
    - { id: t1, text: { en: "Users query in Japanese a knowledge base written in English", fr: "Des utilisateurs interrogent en japonais une base de connaissances rédigée en anglais" } }
    - { id: t2, text: { en: "Index photos of damaged parts together with the repair notes", fr: "Indexer des photos de pièces endommagées avec les notes de réparation" } }
    - { id: t3, text: { en: "Load the model's reply into table columns with OPENJSON without parsing errors", fr: "Charger la réponse du modèle dans des colonnes avec OPENJSON sans erreur d'analyse" } }
    - { id: t4, text: { en: "Embed two million short titles every night at the lowest cost", fr: "Incorporer deux millions de titres courts chaque nuit au coût le plus bas" } }
answer:
  mapping: { t1: multilang, t2: multimodal, t3: structured, t4: small }
explanation:
  correct:
    en: |
      Content and queries in different languages need a model with multilingual support. Photos plus text need a model that accepts multimodal input. A reply that must load into columns calls for structured output that follows a JSON schema. Embedding generation is a focused task, so a smaller model reduces token cost and latency.
    fr: |
      Des contenus et des requêtes dans des langues différentes exigent un modèle multilingue. Des photos accompagnées de texte exigent un modèle qui accepte des entrées multimodales. Une réponse à charger dans des colonnes demande une sortie structurée conforme à un schéma JSON. La génération d'incorporations est une tâche ciblée : un modèle plus petit réduit le coût en jetons et la latence.
  options:
    large: { en: "A larger model reasons better but uses more tokens and adds latency and cost, the opposite of the nightly requirement.", fr: "Un modèle plus grand raisonne mieux, mais consomme plus de jetons et ajoute latence et coût, l'inverse de l'exigence nocturne." }
    dims: { en: "More dimensions increase storage; they don't add languages, image input or a reply format.", fr: "Davantage de dimensions augmente le stockage ; cela n'ajoute ni langues, ni entrée d'images, ni format de réponse." }
references:
  - title: Understand and evaluate models for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/02-understand-evaluate-models-sql-database-workloads
