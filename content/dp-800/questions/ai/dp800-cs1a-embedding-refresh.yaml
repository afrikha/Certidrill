id: dp800-cs1a-embedding-refresh
objective: "3.1.3"
type: single
caseStudy: dp800-cs1a-adventure-works
difficulty: 2
status: draft
stem:
  en: |
    The external model EmbedSmall exists in sqldb-catalog. You need to keep DescriptionVector up to date when the merchandising application changes product descriptions. The solution must meet the embedding requirements.

    What should you implement?
  fr: |
    Le modèle externe EmbedSmall existe dans sqldb-catalog. Vous devez maintenir DescriptionVector à jour quand l'application de merchandising modifie les descriptions de produits. La solution doit respecter les exigences relatives aux incorporations.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Change tracking on sqldb-catalog and dbo.Products, and an Azure Functions app with an Azure SQL trigger binding that regenerates the embeddings of the changed rows", fr: "Le suivi des modifications sur sqldb-catalog et dbo.Products, et une application Azure Functions avec une liaison de déclencheur Azure SQL qui régénère les incorporations des lignes modifiées" } }
    - { id: b, text: { en: "Change event streaming of dbo.Products to an event hub, and an Azure Functions app with an Event Hubs trigger that regenerates the embeddings of the changed rows", fr: "Le streaming d'événements de modification de dbo.Products vers un hub d'événements, et une application Azure Functions avec un déclencheur Event Hubs qui régénère les incorporations des lignes modifiées" } }
    - { id: c, text: { en: "An AFTER UPDATE trigger on dbo.Products that calls AI_GENERATE_EMBEDDINGS for the rows whose Description changed and updates their DescriptionVector values", fr: "Un déclencheur AFTER UPDATE sur dbo.Products qui appelle AI_GENERATE_EMBEDDINGS pour les lignes dont Description a changé et met à jour leurs valeurs DescriptionVector" } }
    - { id: d, text: { en: "An Azure Logic Apps workflow with a recurrence trigger that runs every five minutes and regenerates the embeddings of the products modified since its last run", fr: "Un flux de travail Azure Logic Apps avec un déclencheur de périodicité qui s'exécute toutes les cinq minutes et régénère les incorporations des produits modifiés depuis sa dernière exécution" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A table trigger runs inside the transaction of the UPDATE statement, without any change to the application. If AI_GENERATE_EMBEDDINGS fails, the error rolls back the whole transaction, so a description is never saved with a stale embedding. With about 300 single-row updates per day, the extra latency of the REST call in each transaction is acceptable.
    fr: |
      Un déclencheur de table s'exécute dans la transaction de l'instruction UPDATE, sans aucune modification de l'application. Si AI_GENERATE_EMBEDDINGS échoue, l'erreur annule toute la transaction : une description n'est jamais enregistrée avec une incorporation obsolète. Avec environ 300 mises à jour d'une ligne par jour, la latence supplémentaire de l'appel REST dans chaque transaction est acceptable.
  options:
    a: { en: "The function runs after the transaction has committed, so the description is saved even if its embedding cannot be generated.", fr: "La fonction s'exécute après la validation de la transaction : la description est enregistrée même si son incorporation ne peut pas être générée." }
    b: { en: "Change event streaming publishes the change after it is committed; the embedding is generated later and can fail without undoing the update.", fr: "Le streaming d'événements de modification publie la modification une fois validée ; l'incorporation est générée plus tard et peut échouer sans annuler la mise à jour." }
    d: { en: "A scheduled workflow leaves descriptions with stale embeddings for up to five minutes and cannot make the update fail.", fr: "Un flux de travail planifié laisse des descriptions avec des incorporations obsolètes pendant jusqu'à cinq minutes et ne peut pas faire échouer la mise à jour." }
references:
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
