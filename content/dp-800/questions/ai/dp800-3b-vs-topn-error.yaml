id: dp800-3b-vs-topn-error
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Tickets. You dropped and recreated the vector index on the Embedding column, and the index now uses the latest version.

    The following query now fails with Msg 42274: "Vector search with version 3 index does not support explicit TOP_N parameter."

    ```sql
    SELECT t.TicketID, s.distance
    FROM VECTOR_SEARCH(
            TABLE = dbo.Tickets AS t,
            COLUMN = Embedding,
            SIMILAR_TO = @qv,
            METRIC = 'cosine',
            TOP_N = 10
        ) AS s
    ORDER BY s.distance;
    ```

    You need the query to return the 10 approximate nearest tickets by using the vector index.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Tickets. Vous avez supprimé puis recréé l'index vectoriel sur la colonne Embedding, et l'index utilise maintenant la dernière version.

    La requête suivante échoue désormais avec le message Msg 42274 : « Vector search with version 3 index does not support explicit TOP_N parameter. »

    ```sql
    SELECT t.TicketID, s.distance
    FROM VECTOR_SEARCH(
            TABLE = dbo.Tickets AS t,
            COLUMN = Embedding,
            SIMILAR_TO = @qv,
            METRIC = 'cosine',
            TOP_N = 10
        ) AS s
    ORDER BY s.distance;
    ```

    Vous devez faire en sorte que la requête renvoie les 10 tickets les plus proches de manière approximative à l'aide de l'index vectoriel.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep TOP_N = 10, and set the ALLOW_STALE_VECTOR_INDEX database scoped configuration to ON.", fr: "Conserver TOP_N = 10, et définir la configuration étendue à la base de données ALLOW_STALE_VECTOR_INDEX sur ON." } }
    - { id: b, text: { en: "Keep TOP_N = 10, and add the WITH (FORCE_ANN_ONLY) table hint after the alias s.", fr: "Conserver TOP_N = 10, et ajouter l'indicateur de table WITH (FORCE_ANN_ONLY) après l'alias s." } }
    - { id: c, text: { en: "Remove TOP_N = 10, and change the SELECT clause to SELECT TOP (10) WITH APPROXIMATE.", fr: "Supprimer TOP_N = 10, et remplacer la clause SELECT par SELECT TOP (10) WITH APPROXIMATE." } }
    - { id: d, text: { en: "Replace VECTOR_SEARCH with a SELECT TOP (10) query that orders by VECTOR_DISTANCE.", fr: "Remplacer VECTOR_SEARCH par une requête SELECT TOP (10) triée par VECTOR_DISTANCE." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      TOP_N is deprecated and is not supported with latest-version vector indexes. Approximate search on these indexes uses SELECT TOP (N) WITH APPROXIMATE together with ORDER BY distance, which the query already has.
    fr: |-
      TOP_N est déconseillé et n'est pas pris en charge avec les index vectoriels de dernière version. La recherche approximative sur ces index utilise SELECT TOP (N) WITH APPROXIMATE avec ORDER BY distance, que la requête contient déjà.
  options:
    a: { en: "ALLOW_STALE_VECTOR_INDEX applies to earlier index versions; it does not make TOP_N valid with a version 3 index.", fr: "ALLOW_STALE_VECTOR_INDEX s'applique aux versions d'index antérieures ; il ne rend pas TOP_N valide avec un index de version 3." }
    b: { en: "FORCE_ANN_ONLY requires SELECT TOP (N) WITH APPROXIMATE, and TOP_N still raises error 42274.", fr: "FORCE_ANN_ONLY exige SELECT TOP (N) WITH APPROXIMATE, et TOP_N provoque toujours l'erreur 42274." }
    d: { en: "VECTOR_DISTANCE computes exact distances and never uses the vector index.", fr: "VECTOR_DISTANCE calcule des distances exactes et n'utilise jamais l'index vectoriel." }
references:
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
