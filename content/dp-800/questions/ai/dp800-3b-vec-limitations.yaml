id: dp800-3b-vec-limitations
objective: "3.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Tickets. The table has a column defined as `Embedding VECTOR(768) NOT NULL`.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Tickets. La table possède une colonne définie comme `Embedding VECTOR(768) NOT NULL`.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You can add a DEFAULT constraint that sets Embedding to a vector of zeros.", fr: "Vous pouvez ajouter une contrainte DEFAULT qui affecte à Embedding un vecteur de zéros." } }
    - { id: b, text: { en: "You can create a nonclustered index that uses Embedding as its key column.", fr: "Vous pouvez créer un index non cluster qui utilise Embedding comme colonne clé." } }
    - { id: c, text: { en: "You can add Embedding as an included column of a nonclustered index.", fr: "Vous pouvez ajouter Embedding comme colonne incluse d'un index non cluster." } }
    - { id: d, text: { en: "You can encrypt Embedding by using Always Encrypted.", fr: "Vous pouvez chiffrer Embedding à l'aide d'Always Encrypted." } }
    - { id: e, text: { en: "You can insert a value by passing a string that contains a JSON array of 768 numbers.", fr: "Vous pouvez insérer une valeur en passant une chaîne qui contient un tableau JSON de 768 nombres." } }
    - { id: f, text: { en: "You can compare two embeddings by using the = operator.", fr: "Vous pouvez comparer deux incorporations à l'aide de l'opérateur =." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      A vector column cannot be the key of a B-tree or columnstore index, but it can be an included column. Strings and json values convert implicitly to vector when they contain a JSON array of numbers with exactly the declared number of elements.
    fr: |-
      Une colonne vectorielle ne peut pas être la clé d'un index B-tree ou columnstore, mais elle peut être une colonne incluse. Les chaînes et les valeurs json se convertissent implicitement en vector lorsqu'elles contiennent un tableau JSON de nombres comptant exactement le nombre d'éléments déclaré.
  options:
    a: { en: "Only NULL and NOT NULL are supported on a vector column; DEFAULT and CHECK constraints are not.", fr: "Seuls NULL et NOT NULL sont pris en charge sur une colonne vectorielle ; les contraintes DEFAULT et CHECK ne le sont pas." }
    b: { en: "B-tree indexes are not supported on vector columns; similarity search uses a vector index instead.", fr: "Les index B-tree ne sont pas pris en charge sur les colonnes vectorielles ; la recherche de similarité utilise un index vectoriel." }
    d: { en: "Always Encrypted is not supported with the vector type.", fr: "Always Encrypted n'est pas pris en charge avec le type vector." }
    f: { en: "Vectors support no comparison or arithmetic operators; you compare them with VECTOR_DISTANCE.", fr: "Les vecteurs ne prennent en charge aucun opérateur de comparaison ni d'arithmétique ; vous les comparez avec VECTOR_DISTANCE." }
references:
  - title: Vector data type
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type
