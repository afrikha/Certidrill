id: dp800-3a-multilingual-model
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure SQL database named CatalogDb. The dbo.ProductEmbeddings table has an Embedding column of type VECTOR(1536). The vectors are generated by an external model that calls a text-embedding-ada-002 (version 2) deployment in Azure OpenAI.

    Product descriptions are written in English, French and German, and customers search in their own language. Relevance is poor for queries that are not in English.

    You plan to deploy a different Azure OpenAI embedding model. The model must meet the following requirements:

    - Improve multi-language retrieval compared to text-embedding-ada-002.
    - Return 1,536 dimensions without a dimensions value in the request.
    - Be the smallest model that meets the other requirements.

    Which model should you deploy?
  fr: |
    Contoso dispose d'une base de données Azure SQL nommée CatalogDb. La table dbo.ProductEmbeddings contient une colonne Embedding de type VECTOR(1536). Les vecteurs sont générés par un modèle externe qui appelle un déploiement text-embedding-ada-002 (version 2) dans Azure OpenAI.

    Les descriptions de produits sont rédigées en anglais, en français et en allemand, et les clients effectuent leurs recherches dans leur propre langue. La pertinence est faible pour les requêtes qui ne sont pas en anglais.

    Vous prévoyez de déployer un autre modèle d'incorporation Azure OpenAI. Le modèle doit satisfaire les exigences suivantes :

    - Améliorer la recherche multilingue par rapport à text-embedding-ada-002.
    - Retourner 1 536 dimensions sans valeur dimensions dans la requête.
    - Être le plus petit modèle qui satisfait les autres exigences.

    Quel modèle devez-vous déployer ?
body:
  options:
    - { id: a, text: text-embedding-3-large }
    - { id: b, text: text-embedding-3-small }
    - { id: c, text: "text-embedding-ada-002 (version 1)" }
    - { id: d, text: gpt-4.1-mini }
answer: { optionId: b }
explanation:
  correct:
    en: |
      text-embedding-3-small returns 1,536 dimensions by default, so it fits the existing VECTOR(1536) column without a dimensions parameter. Microsoft reports a clearly better average multi-language retrieval score (MIRACL) for the third-generation models than for text-embedding-ada-002, and text-embedding-3-small is the smaller of the two. All stored vectors must still be regenerated with the new model.
    fr: |
      text-embedding-3-small retourne 1 536 dimensions par défaut : il convient à la colonne VECTOR(1536) existante sans paramètre dimensions. Microsoft indique un score moyen de recherche multilingue (MIRACL) nettement meilleur pour les modèles de troisième génération que pour text-embedding-ada-002, et text-embedding-3-small est le plus petit des deux. Tous les vecteurs stockés doivent néanmoins être régénérés avec le nouveau modèle.
  options:
    a: { en: "text-embedding-3-large is the larger model and returns 3,072 dimensions unless the request sets a lower dimensions value.", fr: "text-embedding-3-large est le plus grand modèle et retourne 3 072 dimensions, sauf si la requête définit une valeur dimensions inférieure." }
    c: { en: "Version 1 of text-embedding-ada-002 belongs to the same generation as the current model and accepts only 2,046 input tokens.", fr: "La version 1 de text-embedding-ada-002 appartient à la même génération que le modèle actuel et n'accepte que 2 046 jetons en entrée." }
    d: { en: "gpt-4.1-mini is a chat model, not an embedding model: an external model of type EMBEDDINGS can't use it to return vectors.", fr: "gpt-4.1-mini est un modèle de conversation, pas un modèle d'incorporation : un modèle externe de type EMBEDDINGS ne peut pas l'utiliser pour retourner des vecteurs." }
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
  - title: Understand and evaluate models for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/02-understand-evaluate-models-sql-database-workloads
