id: dp800-3a-generate-embeddings-facts
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to generate embeddings in an Azure SQL database by using AI_GENERATE_EMBEDDINGS and an external model named CatalogEmbedder.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de générer des incorporations dans une base de données Azure SQL à l'aide d'AI_GENERATE_EMBEDDINGS et d'un modèle externe nommé CatalogEmbedder.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The value that the function returns can be stored in a vector column.", fr: "La valeur retournée par la fonction peut être stockée dans une colonne vector." } }
    - { id: b, text: { en: "The source argument must be of the json data type.", fr: "L'argument source doit être de type de données json." } }
    - { id: c, text: { en: "Values in the PARAMETERS clause override the matching values of the model definition.", fr: "Les valeurs de la clause PARAMETERS remplacent les valeurs correspondantes de la définition du modèle." } }
    - { id: d, text: { en: "The function can return the reply of a chat completions deployment if the model definition points to it.", fr: "La fonction peut retourner la réponse d'un déploiement chat completions si la définition du modèle pointe vers lui." } }
    - { id: e, text: { en: "The function accepts the endpoint URL in place of the external model name.", fr: "La fonction accepte l'URL du point de terminaison à la place du nom du modèle externe." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      AI_GENERATE_EMBEDDINGS returns the embedding as a JSON array of numbers, which converts to the vector type, so it can be used in SELECT, UPDATE or INSERT ... SELECT statements that write a vector column. Its optional PARAMETERS clause adds JSON to the request body and overrides matching values of the model definition, such as dimensions.
    fr: |
      AI_GENERATE_EMBEDDINGS retourne l'incorporation sous forme de tableau JSON de nombres, qui se convertit vers le type vector : elle s'utilise dans des instructions SELECT, UPDATE ou INSERT ... SELECT qui écrivent une colonne vector. Sa clause facultative PARAMETERS ajoute du JSON au corps de la requête et remplace les valeurs correspondantes de la définition du modèle, comme dimensions.
  options:
    b: { en: "The source is an expression of any character type, such as nvarchar or varchar.", fr: "La source est une expression de n'importe quel type caractère, comme nvarchar ou varchar." }
    d: { en: "The function requires an external model of type EMBEDDINGS, the only model type, which calls an embeddings endpoint.", fr: "La fonction exige un modèle externe de type EMBEDDINGS, le seul type de modèle, qui appelle un point de terminaison d'incorporations." }
    e: { en: "USE MODEL takes the name of an external model; the URL is stored in the model's LOCATION.", fr: "USE MODEL prend le nom d'un modèle externe ; l'URL est stockée dans le LOCATION du modèle." }
references:
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
