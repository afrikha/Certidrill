id: dp800-3a-ces-multi-consumer
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure SQL database that contains a table named dbo.Articles. Three downstream systems must receive every insert, update and delete on dbo.Articles in near real time: a service that regenerates the article embeddings, a search cache and an analytics pipeline.

    The solution must decouple embedding generation from the write transactions and must not require each system to poll the database.

    Which method should you use?
  fr: |
    Woodgrove Bank dispose d'une base de données Azure SQL qui contient une table nommée dbo.Articles. Trois systèmes en aval doivent recevoir chaque insertion, mise à jour et suppression sur dbo.Articles en quasi temps réel : un service qui régénère les incorporations des articles, un cache de recherche et un pipeline d'analytique.

    La solution doit découpler la génération des incorporations des transactions d'écriture et ne doit pas obliger chaque système à interroger la base de données.

    Quelle méthode devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An AFTER INSERT, UPDATE, DELETE trigger on dbo.Articles", fr: "Un déclencheur AFTER INSERT, UPDATE, DELETE sur dbo.Articles" } }
    - { id: b, text: { en: "Change Tracking on dbo.Articles, read by a job in each system", fr: "Le suivi des modifications sur dbo.Articles, lu par un travail dans chaque système" } }
    - { id: c, text: { en: "Change event streaming (CES) to Azure Event Hubs", fr: "Le streaming d'événements de modification (CES) vers Azure Event Hubs" } }
    - { id: d, text: { en: "An Azure Logic Apps workflow with a recurrence schedule", fr: "Un flux de travail Azure Logic Apps avec une planification périodique" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Change event streaming sends each insert, update and delete to Azure Event Hubs (or Fabric Eventstream) in near real time as a CloudEvent. Several consumers can read the same stream independently, and embedding generation runs in a consumer, decoupled from the transactions that change the rows.
    fr: |
      Le streaming d'événements de modification envoie chaque insertion, mise à jour et suppression vers Azure Event Hubs (ou Fabric Eventstream) en quasi temps réel, sous forme de CloudEvent. Plusieurs consommateurs peuvent lire le même flux indépendamment, et la génération des incorporations s'exécute dans un consommateur, découplée des transactions qui modifient les lignes.
  options:
    a: { en: "A trigger runs inside every write transaction, which couples the work to the writes, and it doesn't deliver changes to external systems.", fr: "Un déclencheur s'exécute dans chaque transaction d'écriture, ce qui couple le travail aux écritures, et il ne transmet pas les modifications aux systèmes externes." }
    b: { en: "Each system would have to poll CHANGETABLE on its own schedule, which the requirements exclude.", fr: "Chaque système devrait interroger CHANGETABLE selon sa propre planification, ce que les exigences excluent." }
    d: { en: "A recurrence-based workflow checks the database periodically, which is polling with a delay.", fr: "Un flux de travail périodique vérifie la base de données à intervalles réguliers, ce qui revient à l'interroger avec un délai." }
references:
  - title: Change event streaming overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/change-event-streaming/overview
  - title: Generate and maintain embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/05-generate-maintain-embeddings-sql-database-workloads
