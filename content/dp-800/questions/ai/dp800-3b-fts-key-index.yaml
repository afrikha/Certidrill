id: dp800-3b-fts-key-index
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains the following table.

    ```sql
    CREATE TABLE dbo.OrderNotes
    (
        OrderID  int           NOT NULL,
        LineNo   smallint      NOT NULL,
        NoteText nvarchar(max) NULL,
        CONSTRAINT PK_OrderNotes PRIMARY KEY (OrderID, LineNo)
    );
    ```

    A full-text catalog named NotesCatalog exists. You run the following statement, and it fails.

    ```sql
    CREATE FULLTEXT INDEX ON dbo.OrderNotes (NoteText)
    KEY INDEX PK_OrderNotes
    ON NotesCatalog;
    ```

    You need to create a full-text index on NoteText.

    What should you do first?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient la table suivante.

    ```sql
    CREATE TABLE dbo.OrderNotes
    (
        OrderID  int           NOT NULL,
        LineNo   smallint      NOT NULL,
        NoteText nvarchar(max) NULL,
        CONSTRAINT PK_OrderNotes PRIMARY KEY (OrderID, LineNo)
    );
    ```

    Un catalogue de texte intégral nommé NotesCatalog existe. Vous exécutez l'instruction suivante, qui échoue.

    ```sql
    CREATE FULLTEXT INDEX ON dbo.OrderNotes (NoteText)
    KEY INDEX PK_OrderNotes
    ON NotesCatalog;
    ```

    Vous devez créer un index de recherche en texte intégral sur NoteText.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Add an int IDENTITY column that has a unique index, and use that index as the KEY INDEX.", fr: "Ajouter une colonne int IDENTITY dotée d'un index unique, et utiliser cet index comme KEY INDEX." }
    - id: b
      text: { en: "Create a unique nonclustered index on (OrderID, LineNo), and use that index as the KEY INDEX.", fr: "Créer un index non cluster unique sur (OrderID, LineNo), et utiliser cet index comme KEY INDEX." }
    - id: c
      text: { en: "Recreate NotesCatalog with the AS DEFAULT option, and remove the ON clause.", fr: "Recréer NotesCatalog avec l'option AS DEFAULT, et supprimer la clause ON." }
    - id: d
      text: { en: "Add the WITH CHANGE_TRACKING = MANUAL option to the statement.", fr: "Ajouter l'option WITH CHANGE_TRACKING = MANUAL à l'instruction." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The KEY INDEX of a full-text index must be a unique, single-key, non-nullable column, and Microsoft recommends an integer key for performance. PK_OrderNotes has two key columns, so it cannot be used. A new int IDENTITY column with a unique index provides a valid full-text key.
    fr: |-
      Le KEY INDEX d'un index de recherche en texte intégral doit porter sur une colonne unique, à clé unique et non nullable, et Microsoft recommande une clé entière pour les performances. PK_OrderNotes compte deux colonnes clés : il ne peut donc pas être utilisé. Une nouvelle colonne int IDENTITY dotée d'un index unique fournit une clé de texte intégral valide.
  options:
    b:
      en: |-
        A unique index on two columns is still a multi-column key; the full-text key must be a single column.
      fr: |-
        Un index unique sur deux colonnes reste une clé multicolonne ; la clé de texte intégral doit porter sur une seule colonne.
    c:
      en: |-
        The catalog exists and is named in the statement; the failure comes from the key index, not from the catalog.
      fr: |-
        Le catalogue existe et il est nommé dans l'instruction ; l'échec vient de l'index de clé, pas du catalogue.
    d:
      en: |-
        CHANGE_TRACKING controls how changes are propagated to the index; it does not remove the requirement for a single-column unique key.
      fr: |-
        CHANGE_TRACKING contrôle la propagation des modifications vers l'index ; il ne supprime pas l'exigence d'une clé unique sur une seule colonne.
references:
  - title: CREATE FULLTEXT INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-fulltext-index-transact-sql
