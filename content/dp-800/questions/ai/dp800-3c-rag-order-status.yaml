id: dp800-3c-rag-order-status
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has an Azure SQL database that contains a table named dbo.Orders. The status of each order is updated every few minutes. Fabrikam wants a support assistant, based on an Azure OpenAI chat deployment, that answers questions such as "Where is my order?".

    The solution must meet the following requirements:

    - Answers must reflect the current status of the orders.
    - For each answer, Fabrikam must be able to prove which orders were used.
    - Order data must never be used to train a model.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose d'une base de données Azure SQL qui contient une table nommée dbo.Orders. Le statut de chaque commande est mis à jour toutes les quelques minutes. Fabrikam souhaite un assistant de support, basé sur un déploiement de conversation Azure OpenAI, qui réponde à des questions comme « Où en est ma commande ? ».

    La solution doit satisfaire les exigences suivantes :

    - Les réponses doivent refléter le statut actuel des commandes.
    - Pour chaque réponse, Fabrikam doit pouvoir prouver quelles commandes ont été utilisées.
    - Les données des commandes ne doivent jamais servir à entraîner un modèle.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the deployment every night on dbo.Orders and log the training job ID with each answer.", fr: "Effectuer chaque nuit un réglage précis du déploiement sur dbo.Orders et journaliser l'ID du travail d'entraînement avec chaque réponse." } }
    - { id: b, text: { en: "Create a read-only database user for the deployment so that the model can query dbo.Orders.", fr: "Créer un utilisateur de base de données en lecture seule pour le déploiement afin que le modèle puisse interroger dbo.Orders." } }
    - { id: c, text: { en: "Export dbo.Orders every hour and upload the file to the deployment as additional training data.", fr: "Exporter dbo.Orders toutes les heures et charger le fichier dans le déploiement comme données d'entraînement supplémentaires." } }
    - { id: d, text: { en: "Retrieve the customer's orders in a procedure, send them as JSON in the prompt and log the IDs sent.", fr: "Récupérer les commandes du client dans une procédure, les envoyer en JSON dans l'invite et journaliser les ID envoyés." } }
answer: { optionId: d }
explanation:
  correct:
    en: "RAG reads the orders when the question arrives, so the status is current. The procedure decides which rows go into the prompt, so logging their IDs proves which orders were used. Only the per-request context is sent to the model, and nothing is used for training."
    fr: "RAG lit les commandes à l'arrivée de la question : le statut est à jour. La procédure décide quelles lignes vont dans l'invite, donc journaliser leurs ID prouve quelles commandes ont été utilisées. Seul le contexte de chaque requête est envoyé au modèle, et rien ne sert à l'entraînement."
  options:
    a: { en: "Fine-tuning uses the order data for training, which is forbidden, and a nightly model misses the updates of the day.", fr: "Le fine-tuning utilise les données des commandes pour l'entraînement, ce qui est interdit, et un modèle mis à jour chaque nuit ignore les mises à jour de la journée." }
    b: { en: "A chat deployment doesn't connect to databases: in RAG the database retrieves the data and sends it to the model.", fr: "Un déploiement de conversation ne se connecte pas aux bases de données : avec RAG, c'est la base de données qui récupère les données et les envoie au modèle." }
    c: { en: "Uploading the data as training data violates the no-training requirement and is at least an hour out of date.", fr: "Charger les données comme données d'entraînement viole l'exigence d'absence d'entraînement et a au moins une heure de retard." }
references:
  - title: Identify RAG use cases and architecture
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/2-identify-rag-use-cases-architecture
