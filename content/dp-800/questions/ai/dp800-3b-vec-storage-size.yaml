id: dp800-3b-vec-storage-size
objective: "3.2.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.CatalogItems. You plan to add the following column and to fill it for the 2,000,000 rows of the table.

    ```sql
    ALTER TABLE dbo.CatalogItems ADD Embedding VECTOR(1024) NULL;
    ```

    You need to estimate the storage that the vector values will use, excluding row overhead and indexes.

    What should you estimate?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.CatalogItems. Vous prévoyez d'ajouter la colonne suivante et de la remplir pour les 2 000 000 de lignes de la table.

    ```sql
    ALTER TABLE dbo.CatalogItems ADD Embedding VECTOR(1024) NULL;
    ```

    Vous devez estimer le stockage qu'occuperont les valeurs vectorielles, sans compter la surcharge des lignes ni les index.

    Quelle estimation devez-vous retenir ?
body:
  options:
    - { id: a, text: { en: "About 2 GB", fr: "Environ 2 Go" } }
    - { id: b, text: { en: "About 4 GB", fr: "Environ 4 Go" } }
    - { id: c, text: { en: "About 8 GB", fr: "Environ 8 Go" } }
    - { id: d, text: { en: "About 16 GB", fr: "Environ 16 Go" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Without a base type, the column uses float32, and each element is stored as a 4-byte single-precision value. One embedding uses 1,024 × 4 = 4,096 bytes, so 2,000,000 rows use about 8.2 billion bytes, about 8 GB.
    fr: |-
      Sans type de base, la colonne utilise float32, et chaque élément est stocké sous forme de valeur simple précision de 4 octets. Une incorporation occupe 1 024 × 4 = 4 096 octets : 2 000 000 de lignes occupent donc environ 8,2 milliards d'octets, soit environ 8 Go.
  options:
    a: { en: "This assumes 1 byte per element; float32 elements use 4 bytes.", fr: "Cette valeur suppose 1 octet par élément ; les éléments float32 occupent 4 octets." }
    b: { en: "This assumes 2 bytes per element, which is the half-precision float16 format, not the default float32.", fr: "Cette valeur suppose 2 octets par élément, soit le format demi-précision float16, pas le float32 par défaut." }
    d: { en: "This assumes 8 bytes per element; vector elements are single-precision, not double-precision, values.", fr: "Cette valeur suppose 8 octets par élément ; les éléments vectoriels sont en simple précision, pas en double précision." }
references:
  - title: Vector data type
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type
