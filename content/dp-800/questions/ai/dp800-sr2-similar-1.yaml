stem:
  en: You sort the VECTOR_DISTANCE result in descending order.
  fr: Vous triez le résultat de VECTOR_DISTANCE par ordre décroissant.
body:
  solution:
    en: |
      You run the following query.

      ```sql
      SELECT TOP (5) ArticleID, Title,
             VECTOR_DISTANCE('cosine', @qv, ContentVector) AS distance
      FROM dbo.Articles
      ORDER BY distance DESC;
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```sql
      SELECT TOP (5) ArticleID, Title,
             VECTOR_DISTANCE('cosine', @qv, ContentVector) AS distance
      FROM dbo.Articles
      ORDER BY distance DESC;
      ```
answer: { value: false }
explanation:
  correct:
    en: VECTOR_DISTANCE returns a distance, not a similarity score. For cosine, the value ranges from 0 (identical) to 2 (opposite), and a smaller value means a more similar vector. Sorting in descending order returns the five least similar articles.
    fr: "VECTOR_DISTANCE retourne une distance, pas un score de similarité. Pour cosine, la valeur va de 0 (identiques) à 2 (opposés), et une valeur plus petite signifie un vecteur plus similaire. Le tri décroissant retourne les cinq articles les moins similaires."
references:
  - title: VECTOR_DISTANCE (Transact-SQL)
