stem:
  en: You use FOR JSON PATH with the WITHOUT_ARRAY_WRAPPER option.
  fr: Vous utilisez FOR JSON PATH avec l'option WITHOUT_ARRAY_WRAPPER.
body:
  solution:
    en: |
      You add the following statement to the procedure:

      ```sql
      SET @context = (
          SELECT TOP (5)
              p.Name        AS name,
              p.ListPrice   AS price,
              p.Description AS description
          FROM dbo.Product AS p
          ORDER BY VECTOR_DISTANCE('cosine', p.DescriptionVector, @qv)
          FOR JSON PATH, WITHOUT_ARRAY_WRAPPER
      );
      ```
    fr: |
      Vous ajoutez l'instruction suivante à la procédure :

      ```sql
      SET @context = (
          SELECT TOP (5)
              p.Name        AS name,
              p.ListPrice   AS price,
              p.Description AS description
          FROM dbo.Product AS p
          ORDER BY VECTOR_DISTANCE('cosine', p.DescriptionVector, @qv)
          FOR JSON PATH, WITHOUT_ARRAY_WRAPPER
      );
      ```
answer: { value: false }
explanation:
  correct:
    en: WITHOUT_ARRAY_WRAPPER removes the square brackets that FOR JSON places around its output. The option is meant to return a single object from a single-row result; with five rows, @context contains five objects separated by commas, which is not a valid JSON array. Removing the option meets the goal.
    fr: "WITHOUT_ARRAY_WRAPPER supprime les crochets que FOR JSON place autour de sa sortie. L'option sert à renvoyer un seul objet à partir d'un résultat d'une seule ligne ; avec cinq lignes, @context contient cinq objets séparés par des virgules, ce qui n'est pas un tableau JSON valide. Supprimer l'option permet d'atteindre l'objectif."
references:
  - title: Format query results as JSON with FOR JSON
    url: https://learn.microsoft.com/en-us/sql/relational-databases/json/format-query-results-as-json-with-for-json-sql-server
