id: dp800-3b-fts-change-tracking
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a SQL Server 2025 database that contains a table named dbo.KnowledgeArticles. The table has a full-text index on the Body column and about 200,000 rows. About 2,000 rows are updated each day during business hours. The table has no rowversion (timestamp) column, and you cannot change its schema.

    You need to update the full-text index. The solution must meet the following requirements:

    - No full-text indexing work runs during business hours.
    - A nightly SQL Server Agent job processes only the rows that changed since the previous run.

    What should you configure?
  fr: |
    Vous disposez d'une base de données SQL Server 2025 qui contient une table nommée dbo.KnowledgeArticles. La table possède un index de recherche en texte intégral sur la colonne Body et environ 200 000 lignes. Environ 2 000 lignes sont mises à jour chaque jour pendant les heures ouvrées. La table n'a pas de colonne rowversion (timestamp), et vous ne pouvez pas modifier son schéma.

    Vous devez mettre à jour l'index de recherche en texte intégral. La solution doit satisfaire les exigences suivantes :

    - Aucun travail d'indexation en texte intégral ne s'exécute pendant les heures ouvrées.
    - Un travail SQL Server Agent nocturne traite uniquement les lignes modifiées depuis l'exécution précédente.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "CHANGE_TRACKING = MANUAL, and a nightly job that runs ALTER FULLTEXT INDEX ... START UPDATE POPULATION", fr: "CHANGE_TRACKING = MANUAL, et un travail nocturne qui exécute ALTER FULLTEXT INDEX ... START UPDATE POPULATION" }
    - id: b
      text: { en: "CHANGE_TRACKING = AUTO, and a nightly job that runs ALTER FULLTEXT INDEX ... START UPDATE POPULATION", fr: "CHANGE_TRACKING = AUTO, et un travail nocturne qui exécute ALTER FULLTEXT INDEX ... START UPDATE POPULATION" }
    - id: c
      text: { en: "CHANGE_TRACKING = OFF, and a nightly job that runs ALTER FULLTEXT INDEX ... START INCREMENTAL POPULATION", fr: "CHANGE_TRACKING = OFF, et un travail nocturne qui exécute ALTER FULLTEXT INDEX ... START INCREMENTAL POPULATION" }
    - id: d
      text: { en: "CHANGE_TRACKING = OFF, and a nightly job that runs ALTER FULLTEXT INDEX ... START FULL POPULATION", fr: "CHANGE_TRACKING = OFF, et un travail nocturne qui exécute ALTER FULLTEXT INDEX ... START FULL POPULATION" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With CHANGE_TRACKING = MANUAL, SQL Server keeps the list of changed rows but propagates them to the index only when you run START UPDATE POPULATION, which a SQL Server Agent job can schedule at night. Only the tracked changes are processed, so the nightly work is limited to the rows modified during the day.
    fr: |-
      Avec CHANGE_TRACKING = MANUAL, SQL Server conserve la liste des lignes modifiées mais ne les propage vers l'index que lorsque vous exécutez START UPDATE POPULATION, ce qu'un travail SQL Server Agent peut planifier la nuit. Seules les modifications suivies sont traitées : le travail nocturne se limite aux lignes modifiées pendant la journée.
  options:
    b:
      en: |-
        AUTO propagates changes as soon as the base table is modified, so indexing work runs during business hours; an update population is not meant to be combined with automatic tracking.
      fr: |-
        AUTO propage les modifications dès que la table de base est modifiée : du travail d'indexation s'exécute pendant les heures ouvrées, et un remplissage de mise à jour n'est pas prévu pour être combiné au suivi automatique.
    c:
      en: |-
        An incremental population requires a timestamp (rowversion) column; without one, the table undergoes a full population.
      fr: |-
        Un remplissage incrémentiel exige une colonne timestamp (rowversion) ; sans elle, la table subit un remplissage complet.
    d:
      en: |-
        A full population reprocesses every row of the table each night instead of only the changed rows.
      fr: |-
        Un remplissage complet retraite chaque nuit toutes les lignes de la table au lieu des seules lignes modifiées.
references:
  - title: ALTER FULLTEXT INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-fulltext-index-transact-sql
  - title: CREATE FULLTEXT INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-fulltext-index-transact-sql
