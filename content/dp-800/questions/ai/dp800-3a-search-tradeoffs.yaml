id: dp800-3a-search-tradeoffs
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum is comparing the search approaches available in its Azure SQL database before redesigning the search of its document library.

    Which approach matches each description? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum compare les approches de recherche disponibles dans sa base de données Azure SQL avant de repenser la recherche de sa bibliothèque de documents.

    Quelle approche correspond à chaque description ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Returns fewer results, which closely match the terms that the user typed: [[precise]]

      Returns more results, including conceptually related documents that lack the user's terms: [[recall]]

      Usually takes longer than either of the other approaches, because it runs both of them: [[slower]]
    fr: |
      Renvoie moins de résultats, très proches des termes saisis par l'utilisateur : [[precise]]

      Renvoie plus de résultats, y compris des documents conceptuellement liés qui ne contiennent pas les termes de l'utilisateur : [[recall]]

      Prend généralement plus de temps que chacune des deux autres approches, car elle les exécute toutes les deux : [[slower]]
  slots:
    - id: precise
      options:
        - { id: ft, text: { en: "Full-text search", fr: "Recherche en texte intégral" } }
        - { id: vec, text: { en: "Semantic vector search", fr: "Recherche vectorielle sémantique" } }
        - { id: hyb, text: { en: "Hybrid search", fr: "Recherche hybride" } }
    - id: recall
      options:
        - { id: ft, text: { en: "Full-text search", fr: "Recherche en texte intégral" } }
        - { id: vec, text: { en: "Semantic vector search", fr: "Recherche vectorielle sémantique" } }
        - { id: hyb, text: { en: "Hybrid search", fr: "Recherche hybride" } }
    - id: slower
      options:
        - { id: ft, text: { en: "Full-text search", fr: "Recherche en texte intégral" } }
        - { id: vec, text: { en: "Semantic vector search", fr: "Recherche vectorielle sémantique" } }
        - { id: hyb, text: { en: "Hybrid search", fr: "Recherche hybride" } }
answer:
  values: { precise: ft, recall: vec, slower: hyb }
explanation:
  correct:
    en: |
      Full-text search favors precision: it returns fewer results that closely match the user's terms, which suits exact matches. Vector search favors recall: it compares meaning and also returns conceptually related documents, which suits discovery. Hybrid search runs both searches and merges the results, so it usually takes longer than either one alone.
    fr: |
      La recherche en texte intégral privilégie la précision : elle renvoie moins de résultats, très proches des termes de l'utilisateur, ce qui convient aux correspondances exactes. La recherche vectorielle privilégie le rappel : elle compare le sens et renvoie aussi des documents conceptuellement liés, ce qui convient à la découverte. La recherche hybride exécute les deux recherches et fusionne les résultats : elle prend généralement plus de temps que chacune seule.
references:
  - title: Choose an intelligent search approach
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach
