id: dp800-3c-send-timeout
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database. A stored procedure sends a long document summary request to an Azure OpenAI deployment by using sp_invoke_external_rest_endpoint. The call doesn't specify @timeout or @retry_count.

    The deployment takes between 60 and 100 seconds to answer. Every call fails before the answer arrives.

    You need the procedure to receive the answers.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL. Une procédure stockée envoie une longue demande de synthèse de document à un déploiement Azure OpenAI avec sp_invoke_external_rest_endpoint. L'appel ne spécifie ni @timeout ni @retry_count.

    Le déploiement met entre 60 et 100 secondes pour répondre. Chaque appel échoue avant l'arrivée de la réponse.

    Vous devez faire en sorte que la procédure reçoive les réponses.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add @retry_count = 5 to the call.", fr: "Ajouter @retry_count = 5 à l'appel." } }
    - { id: b, text: { en: "Add @timeout = 120 to the call.", fr: "Ajouter @timeout = 120 à l'appel." } }
    - { id: c, text: { en: "Add @timeout = 300 to the call.", fr: "Ajouter @timeout = 300 à l'appel." } }
    - { id: d, text: { en: "Add WAITFOR DELAY '00:02:00' before the call.", fr: "Ajouter WAITFOR DELAY '00:02:00' avant l'appel." } }
answer: { optionId: b }
explanation:
  correct:
    en: "@timeout defaults to 30 seconds and covers the whole HTTP exchange, so a 60 to 100 second answer always times out. Valid values range from 1 to 230 seconds, and 120 seconds covers the expected response time."
    fr: "@timeout vaut 30 secondes par défaut et couvre tout l'échange HTTP : une réponse de 60 à 100 secondes expire toujours. Les valeurs valides vont de 1 à 230 secondes, et 120 secondes couvrent le temps de réponse attendu."
  options:
    a: { en: "With @retry_count, @timeout becomes the cumulative timeout of all attempts, so the 30-second default still stops every answer.", fr: "Avec @retry_count, @timeout devient le délai cumulé de toutes les tentatives : la valeur par défaut de 30 secondes interrompt toujours chaque réponse." }
    c: { en: "300 is outside the allowed range of 1 to 230 seconds.", fr: "300 est en dehors de la plage autorisée de 1 à 230 secondes." }
    d: { en: "Waiting before the call doesn't change how long the call itself waits for the answer.", fr: "Attendre avant l'appel ne change pas la durée pendant laquelle l'appel lui-même attend la réponse." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
