id: dp800-3c-json-single-object
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Customers. A RAG procedure retrieves one customer by CustomerId and adds the result to a prompt.

    The customer must be sent as a single JSON object, without square brackets around it, for example {"Name":"Alex","Tier":"Gold","City":"Lyon"}.

    Which clause should you add to the query?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Customers. Une procédure RAG récupère un client par son CustomerId et ajoute le résultat à une invite.

    Le client doit être envoyé sous la forme d'un seul objet JSON, sans crochets autour, par exemple {"Name":"Alex","Tier":"Gold","City":"Lyon"}.

    Quelle clause devez-vous ajouter à la requête ?
body:
  options:
    - { id: a, text: "FOR JSON PATH, ROOT('customer')" }
    - { id: b, text: "FOR JSON AUTO, INCLUDE_NULL_VALUES" }
    - { id: c, text: "FOR JSON PATH, ROOT('customer'), INCLUDE_NULL_VALUES" }
    - { id: d, text: "FOR JSON PATH, WITHOUT_ARRAY_WRAPPER" }
answer: { optionId: d }
explanation:
  correct:
    en: "By default, FOR JSON returns an array of objects, one per row. WITHOUT_ARRAY_WRAPPER removes the square brackets, so a single-row result is returned as one JSON object, which is common in RAG when you retrieve one customer, product or order."
    fr: "Par défaut, FOR JSON renvoie un tableau d'objets, un par ligne. WITHOUT_ARRAY_WRAPPER supprime les crochets : un résultat d'une seule ligne est renvoyé sous la forme d'un objet JSON, ce qui est courant en RAG quand vous récupérez un client, un produit ou une commande."
  options:
    a: { en: "ROOT wraps the output in a named property, but the rows stay in an array: {\"customer\":[{...}]}.", fr: "ROOT enveloppe la sortie dans une propriété nommée, mais les lignes restent dans un tableau : {\"customer\":[{...}]}." }
    b: { en: "INCLUDE_NULL_VALUES keeps NULL properties; the output is still an array.", fr: "INCLUDE_NULL_VALUES conserve les propriétés NULL ; la sortie reste un tableau." }
    c: { en: "This adds a root property and NULL values, but the customer is still inside an array.", fr: "Cette clause ajoute une propriété racine et les valeurs NULL, mais le client reste dans un tableau." }
references:
  - title: Prepare retrieval context for augmentation
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/3-prepare-retrieval-context-augmentation
