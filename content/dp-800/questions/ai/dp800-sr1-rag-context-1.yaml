stem:
  en: You build the JSON text by concatenating strings with STRING_AGG.
  fr: Vous construisez le texte JSON en concaténant des chaînes avec STRING_AGG.
body:
  solution:
    en: |
      You add the following statement to the procedure:

      ```sql
      SELECT @context = N'[' + STRING_AGG(
                 N'{"name":"' + t.Name
                 + N'","price":' + CAST(t.ListPrice AS nvarchar(20))
                 + N',"description":"' + t.Description + N'"}', N',')
                 WITHIN GROUP (ORDER BY t.distance) + N']'
      FROM (
          SELECT TOP (5) p.Name, p.ListPrice, p.Description,
                 VECTOR_DISTANCE('cosine', p.DescriptionVector, @qv) AS distance
          FROM dbo.Product AS p
          ORDER BY distance
      ) AS t;
      ```
    fr: |
      Vous ajoutez l'instruction suivante à la procédure :

      ```sql
      SELECT @context = N'[' + STRING_AGG(
                 N'{"name":"' + t.Name
                 + N'","price":' + CAST(t.ListPrice AS nvarchar(20))
                 + N',"description":"' + t.Description + N'"}', N',')
                 WITHIN GROUP (ORDER BY t.distance) + N']'
      FROM (
          SELECT TOP (5) p.Name, p.ListPrice, p.Description,
                 VECTOR_DISTANCE('cosine', p.DescriptionVector, @qv) AS distance
          FROM dbo.Product AS p
          ORDER BY distance
      ) AS t;
      ```
answer: { value: false }
explanation:
  correct:
    en: String concatenation copies the values as they are. A double quotation mark or a line break inside a description ends the JSON string early or inserts a control character, so @context is not valid JSON for many products. FOR JSON and the JSON functions escape special and control characters in the values.
    fr: "La concaténation de chaînes copie les valeurs telles quelles. Un guillemet double ou un saut de ligne dans une description termine prématurément la chaîne JSON ou insère un caractère de contrôle : @context n'est pas un JSON valide pour de nombreux produits. FOR JSON et les fonctions JSON échappent les caractères spéciaux et les caractères de contrôle des valeurs."
references:
  - title: Format query results as JSON with FOR JSON
    url: https://learn.microsoft.com/en-us/sql/relational-databases/json/format-query-results-as-json-with-for-json-sql-server
