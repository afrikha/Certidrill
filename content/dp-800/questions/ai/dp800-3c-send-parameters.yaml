id: dp800-3c-send-parameters
objective: "3.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Managed Instance database. You are writing a stored procedure that sends a prompt to an Azure OpenAI deployment by using sp_invoke_external_rest_endpoint.

    Which parameter should you set for each requirement? To answer, drag the appropriate parameters to the correct requirements. Each parameter may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Managed Instance. Vous écrivez une procédure stockée qui envoie une invite à un déploiement Azure OpenAI avec sp_invoke_external_rest_endpoint.

    Quel paramètre devez-vous définir pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: retry, text: "@retry_count" }
    - { id: timeout, text: "@timeout" }
    - { id: cred, text: "@credential" }
    - { id: resp, text: "@response" }
    - { id: headers, text: "@headers" }
    - { id: method, text: "@method" }
  targets:
    - id: t1
      text: { en: "Repeat the call automatically when the deployment returns HTTP 429 or 503", fr: "Répéter l'appel automatiquement quand le déploiement renvoie HTTP 429 ou 503" }
    - id: t2
      text: { en: "Wait up to 120 seconds for the reply", fr: "Attendre la réponse jusqu'à 120 secondes" }
    - id: t3
      text: { en: "Authenticate with the managed identity of the instance", fr: "S'authentifier avec l'identité managée de l'instance" }
    - id: t4
      text: { en: "Receive the reply of the model in a variable", fr: "Recevoir la réponse du modèle dans une variable" }
answer:
  mapping: { t1: retry, t2: timeout, t3: cred, t4: resp }
explanation:
  correct:
    en: "@retry_count (0 to 10) retries on 408, 429, 500, 502, 503 and 504 and honors Retry-After. @timeout sets the wait from 1 to 230 seconds. @credential names a database scoped credential, such as one with IDENTITY = 'Managed Identity'. @response is the OUTPUT parameter that receives the response envelope."
    fr: "@retry_count (0 à 10) relance l'appel sur 408, 429, 500, 502, 503 et 504 et respecte Retry-After. @timeout fixe l'attente de 1 à 230 secondes. @credential désigne des informations d'identification délimitées à la base de données, par exemple avec IDENTITY = 'Managed Identity'. @response est le paramètre OUTPUT qui reçoit l'enveloppe de réponse."
  options:
    headers: { en: "@headers adds flat JSON request headers; authentication with a managed identity is injected by the credential.", fr: "@headers ajoute des en-têtes de requête en JSON plat ; l'authentification par identité managée est injectée par les informations d'identification." }
    method: { en: "@method selects the HTTP verb, POST by default.", fr: "@method choisit le verbe HTTP, POST par défaut." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
