id: dp800-cs2c-search-approach
objective: "3.2.1"
type: dragdrop
caseStudy: dp800-cs2c-fabrikam-residences
difficulty: 1
status: draft
stem:
  en: |
    You need to choose a search approach for each search scenario. The solution must meet the search requirements.

    Which approach should you use for each scenario? To answer, drag the appropriate approaches to the correct scenarios. Each approach may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir une approche de recherche pour chaque scénario de recherche. La solution doit satisfaire les exigences de recherche.

    Quelle approche devez-vous utiliser pour chaque scénario ? Pour répondre, faites glisser les approches appropriées vers les scénarios correspondants. Chaque approche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fulltext, text: { en: "Full-text search", fr: "Recherche en texte intégral" } }
    - { id: vector, text: { en: "Vector search", fr: "Recherche vectorielle" } }
    - { id: hybrid, text: { en: "Hybrid search", fr: "Recherche hybride" } }
    - { id: like, text: { en: "LIKE pattern matching", fr: "Correspondance de modèle LIKE" } }
    - { id: fuzzy, text: { en: "Fuzzy matching with EDIT_DISTANCE_SIMILARITY", fr: "Correspondance approximative avec EDIT_DISTANCE_SIMILARITY" } }
  targets:
    - { id: backoffice, text: { en: "Back-office search of specific terms and their word forms", fr: "Recherche administrative de termes précis et de leurs formes fléchies" } }
    - { id: renters, text: { en: "Renters describing the home they want in their own words", fr: "Locataires qui décrivent le logement souhaité avec leurs propres mots" } }
    - { id: public, text: { en: "Public search box that accepts keywords or descriptive sentences", fr: "Zone de recherche publique qui accepte des mots-clés ou des phrases descriptives" } }
answer:
  mapping: { backoffice: fulltext, renters: vector, public: hybrid }
explanation:
  correct:
    en: |
      Full-text search fits users who know the words they want, and its linguistic rules find word forms with FORMSOF(INFLECTIONAL, ...). Vector search compares meaning, so it fits users who describe a need rather than name it. When you cannot predict whether users type keywords or descriptions, hybrid search runs both and merges the ranked results, for example with RRF.
    fr: |
      La recherche en texte intégral convient aux utilisateurs qui connaissent les mots recherchés, et ses règles linguistiques trouvent les formes fléchies avec FORMSOF(INFLECTIONAL, ...). La recherche vectorielle compare le sens : elle convient aux utilisateurs qui décrivent un besoin plutôt que de le nommer. Quand vous ne pouvez pas prévoir si les utilisateurs saisissent des mots-clés ou des descriptions, la recherche hybride exécute les deux et fusionne les résultats classés, par exemple avec RRF.
  options:
    like: { en: "LIKE matches character patterns only; it neither handles word forms nor understands meaning, and leading wildcards scan the table.", fr: "LIKE ne recherche que des modèles de caractères ; il ne gère ni les formes fléchies ni le sens, et les caractères génériques en tête analysent toute la table." }
    fuzzy: { en: "Fuzzy matching scores the spelling distance between two strings; it suits typos in short values, not searches in descriptions.", fr: "La correspondance approximative mesure la distance d'orthographe entre deux chaînes ; elle convient aux fautes de frappe dans des valeurs courtes, pas à la recherche dans des descriptions." }
references:
  - title: Choose an intelligent search approach
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach
