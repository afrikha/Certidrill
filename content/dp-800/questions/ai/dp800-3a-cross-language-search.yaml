id: dp800-3a-cross-language-search
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure SQL database that stores 20,000 help articles written in English. A full-text index on the Body column uses LANGUAGE 1033. Customers now type their questions in Spanish, German or Italian, and they never search for codes or exact terms.

    You need to return the most relevant English articles for these questions. The solution must minimize query latency, and the content team won't maintain any word lists.

    What should you implement?
  fr: |
    Woodgrove Bank dispose d'une base de données Azure SQL qui stocke 20 000 articles d'aide rédigés en anglais. Un index de recherche en texte intégral sur la colonne Body utilise LANGUAGE 1033. Les clients saisissent désormais leurs questions en espagnol, en allemand ou en italien, et ne recherchent jamais de codes ni de termes exacts.

    Vous devez renvoyer les articles anglais les plus pertinents pour ces questions. La solution doit réduire au minimum la latence des requêtes, et l'équipe de contenu ne gérera aucune liste de mots.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Hybrid search that merges the full-text results with multilingual vector results", fr: "Une recherche hybride qui fusionne les résultats en texte intégral et des résultats vectoriels multilingues" } }
    - { id: b, text: { en: "Vector search over embeddings generated by a multilingual embedding model", fr: "Une recherche vectorielle sur des incorporations générées par un modèle d'incorporation multilingue" } }
    - { id: c, text: { en: "A full-text index rebuilt with LANGUAGE 3082 on the Body column", fr: "Un index de recherche en texte intégral reconstruit avec LANGUAGE 3082 sur la colonne Body" } }
    - { id: d, text: { en: "Full-text search that uses FREETEXTTABLE in place of CONTAINSTABLE", fr: "Une recherche en texte intégral qui utilise FREETEXTTABLE à la place de CONTAINSTABLE" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Full-text search matches words, so a Spanish or German question shares almost no word with an English article. A multilingual embedding model places texts with the same meaning close together across languages, so vector search finds the English articles that answer the question. With no exact terms to match, adding full-text search wouldn't improve relevance, and hybrid search takes longer than either search alone.
    fr: |
      La recherche en texte intégral fait correspondre des mots : une question en espagnol ou en allemand n'a presque aucun mot commun avec un article anglais. Un modèle d'incorporation multilingue place près les uns des autres des textes de même sens, quelle que soit leur langue : la recherche vectorielle trouve les articles anglais qui répondent à la question. Sans terme exact à rechercher, ajouter le texte intégral n'améliorerait pas la pertinence, et la recherche hybride prend plus de temps que chaque recherche seule.
  options:
    a: { en: "Hybrid search adds a full-text search that can't match questions in other languages, and it increases latency.", fr: "La recherche hybride ajoute une recherche en texte intégral qui ne peut pas faire correspondre des questions dans d'autres langues, et elle augmente la latence." }
    c: { en: "The articles are in English; a Spanish word breaker would index English text badly and still match no German or Italian words.", fr: "Les articles sont en anglais ; un analyseur lexical espagnol indexerait mal un texte anglais et ne trouverait toujours aucun mot allemand ou italien." }
    d: { en: "FREETEXTTABLE still matches words of the query with words of the articles, which are in different languages.", fr: "FREETEXTTABLE fait toujours correspondre les mots de la requête avec ceux des articles, qui sont dans des langues différentes." }
references:
