id: dp800-3a-ct-self-loop
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure SQL database. The dbo.Articles table has the columns ArticleID (primary key), Body and Embedding. Change Tracking is enabled on dbo.Articles without column tracking.

    Every 15 minutes, a job reads CHANGETABLE(CHANGES dbo.Articles, @last), regenerates Embedding for every changed row and then stores the new version. You discover that each run also regenerates the embeddings of all the rows that the previous run updated, even when their Body didn't change.

    Which two actions each prevent the job from reprocessing its own updates? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une base de données Azure SQL. La table dbo.Articles contient les colonnes ArticleID (clé primaire), Body et Embedding. Le suivi des modifications est activé sur dbo.Articles sans suivi des colonnes.

    Toutes les 15 minutes, un travail lit CHANGETABLE(CHANGES dbo.Articles, @last), régénère Embedding pour chaque ligne modifiée, puis stocke la nouvelle version. Vous constatez que chaque exécution régénère aussi les incorporations de toutes les lignes mises à jour par l'exécution précédente, même quand leur Body n'a pas changé.

    Quelles sont les deux actions qui empêchent chacune le travail de retraiter ses propres mises à jour ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Move the vectors to a separate dbo.ArticleEmbeddings table keyed by ArticleID that isn't tracked.", fr: "Déplacer les vecteurs vers une table dbo.ArticleEmbeddings distincte, indexée par ArticleID et non suivie." } }
    - { id: b, text: { en: "Track the table with TRACK_COLUMNS_UPDATED = ON and process only rows whose Body column is in the change mask.", fr: "Suivre la table avec TRACK_COLUMNS_UPDATED = ON et ne traiter que les lignes dont la colonne Body figure dans le masque de modifications." } }
    - { id: c, text: { en: "Increase CHANGE_RETENTION on the database from 2 days to 7 days.", fr: "Augmenter CHANGE_RETENTION sur la base de données de 2 jours à 7 jours." } }
    - { id: d, text: { en: "Set AUTO_CLEANUP to OFF for change tracking on the database.", fr: "Définir AUTO_CLEANUP à OFF pour le suivi des modifications sur la base de données." } }
    - { id: e, text: { en: "Run the job under the SNAPSHOT transaction isolation level.", fr: "Exécuter le travail sous le niveau d'isolation de transaction SNAPSHOT." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Change Tracking records every update of a tracked table, including the job's own update of Embedding. Storing the vectors in an untracked embeddings table removes those writes from dbo.Articles, which also makes vector storage easy to measure and rebuild. Alternatively, with TRACK_COLUMNS_UPDATED = ON, CHANGE_TRACKING_IS_COLUMN_IN_MASK on SYS_CHANGE_COLUMNS shows whether Body was part of the update, so rows where only Embedding changed are skipped.
    fr: |
      Le suivi des modifications enregistre chaque mise à jour d'une table suivie, y compris la mise à jour d'Embedding par le travail lui-même. Stocker les vecteurs dans une table d'incorporations non suivie retire ces écritures de dbo.Articles, ce qui permet aussi de mesurer et de reconstruire facilement le stockage des vecteurs. Sinon, avec TRACK_COLUMNS_UPDATED = ON, CHANGE_TRACKING_IS_COLUMN_IN_MASK sur SYS_CHANGE_COLUMNS indique si Body faisait partie de la mise à jour : les lignes dont seule la colonne Embedding a changé sont ignorées.
  options:
    c: { en: "Retention controls how long change information is kept; the job's own updates are still recorded as changes.", fr: "La rétention détermine combien de temps les informations de modification sont conservées ; les mises à jour du travail restent enregistrées comme des modifications." }
    d: { en: "Disabling cleanup only keeps old change information longer; it doesn't filter any change.", fr: "Désactiver le nettoyage ne fait que conserver plus longtemps les anciennes informations ; cela ne filtre aucune modification." }
    e: { en: "Snapshot isolation helps read consistent change information, but the job's updates remain tracked changes.", fr: "L'isolation d'instantané aide à lire des informations de modification cohérentes, mais les mises à jour du travail restent des modifications suivies." }
references:
  - title: About Change Tracking (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-tracking-sql-server
  - title: Design embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads
