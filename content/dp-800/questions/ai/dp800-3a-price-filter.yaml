id: dp800-3a-price-filter
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has an Azure SQL database. The embedding of each product is generated from the following expression.

    ```sql
    CONCAT(p.Name, N'. ', p.Description, N'. Price: ', p.ListPrice, N' USD')
    ```

    For the query "waterproof tent under 200 dollars", the vector search returns tents that cost more than 200 dollars among the first results. The search must return only tents that cost less than 200 dollars, ranked by semantic relevance, and the solution must minimize embedding cost.

    What should you do?
  fr: |
    Northwind Traders dispose d'une base de données Azure SQL. L'incorporation de chaque produit est générée à partir de l'expression suivante.

    ```sql
    CONCAT(p.Name, N'. ', p.Description, N'. Price: ', p.ListPrice, N' USD')
    ```

    Pour la requête « tente imperméable à moins de 200 dollars », la recherche vectorielle renvoie parmi les premiers résultats des tentes qui coûtent plus de 200 dollars. La recherche doit renvoyer uniquement les tentes qui coûtent moins de 200 dollars, classées par pertinence sémantique, et la solution doit réduire au minimum le coût des incorporations.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Write the price in words in the embedded text, and then regenerate the embeddings.", fr: "Écrire le prix en toutes lettres dans le texte incorporé, puis régénérer les incorporations." } }
    - { id: b, text: { en: "Keep the price in the embedded text, and switch to the text-embedding-3-large model.", fr: "Conserver le prix dans le texte incorporé et passer au modèle text-embedding-3-large." } }
    - { id: c, text: { en: "Remove the price from the embedded text, and filter on ListPrice in the WHERE clause.", fr: "Retirer le prix du texte incorporé et filtrer sur ListPrice dans la clause WHERE." } }
    - { id: d, text: { en: "Embed ListPrice in a second vector column, and add its distance to the score.", fr: "Incorporer ListPrice dans une seconde colonne vectorielle et ajouter sa distance au score." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Vectors capture meaning, not numeric comparisons, so a price inside the embedded text can't guarantee "less than 200". Numeric values belong in ordinary SQL predicates combined with the vector search, for example WHERE p.ListPrice < 200, which returns only matching rows. Removing the price also shortens the embedded text, which reduces tokens and cost.
    fr: |
      Les vecteurs capturent un sens, pas des comparaisons numériques : un prix dans le texte incorporé ne peut pas garantir « moins de 200 ». Les valeurs numériques relèvent de prédicats SQL ordinaires combinés à la recherche vectorielle, par exemple WHERE p.ListPrice < 200, qui ne renvoie que les lignes correspondantes. Retirer le prix raccourcit aussi le texte incorporé, ce qui réduit les jetons et le coût.
  options:
    a: { en: "A price in words is still not a numeric comparison: similarity can't exclude the tents above 200 dollars, and the text gets longer.", fr: "Un prix en toutes lettres n'est toujours pas une comparaison numérique : la similarité ne peut pas exclure les tentes à plus de 200 dollars, et le texte s'allonge." }
    b: { en: "A larger model costs more and still doesn't turn similarity into an exact price filter.", fr: "Un modèle plus grand coûte plus cher et ne transforme toujours pas la similarité en filtre exact sur le prix." }
    d: { en: "A vector of a number doesn't enforce a price limit, and it doubles the embedding calls.", fr: "Le vecteur d'un nombre n'impose pas de limite de prix, et il double les appels d'incorporation." }
