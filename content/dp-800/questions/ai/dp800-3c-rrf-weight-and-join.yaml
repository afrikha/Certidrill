id: dp800-3c-rrf-weight-and-join
objective: "3.2.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Manuals. The final step of the hybrid search query of the support portal is shown below.

    ```sql
    DECLARE @k int = 60;

    SELECT TOP (10)
           ks.ManualId,
           1.0 / (@k + ks.keyword_rank)
         + 1.0 / (@k + vs.vector_rank) AS rrf_score
    FROM keyword_search AS ks
    INNER JOIN vector_search AS vs
        ON vs.ManualId = ks.ManualId
    ORDER BY rrf_score DESC;
    ```

    You need to modify the query to meet the following requirements:

    - Manuals that are found only by the full-text search or only by the vector search must be returned.
    - The vector search must contribute twice as much as the full-text search to the score.

    Which two changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Manuals. L'étape finale de la requête de recherche hybride du portail de support est présentée ci-dessous.

    ```sql
    DECLARE @k int = 60;

    SELECT TOP (10)
           ks.ManualId,
           1.0 / (@k + ks.keyword_rank)
         + 1.0 / (@k + vs.vector_rank) AS rrf_score
    FROM keyword_search AS ks
    INNER JOIN vector_search AS vs
        ON vs.ManualId = ks.ManualId
    ORDER BY rrf_score DESC;
    ```

    Vous devez modifier la requête pour satisfaire les exigences suivantes :

    - Les manuels trouvés uniquement par la recherche en texte intégral ou uniquement par la recherche vectorielle doivent être renvoyés.
    - La recherche vectorielle doit compter deux fois plus que la recherche en texte intégral dans le score.

    Quelles sont les deux modifications à apporter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Use a FULL OUTER JOIN, COALESCE on the key, and wrap each term in COALESCE(..., 0.0).", fr: "Utiliser un FULL OUTER JOIN, COALESCE sur la clé, et encadrer chaque terme par COALESCE(..., 0.0)." } }
    - { id: b, text: { en: "Use a LEFT OUTER JOIN, COALESCE on the key, and wrap each term in COALESCE(..., 0.0).", fr: "Utiliser un LEFT OUTER JOIN, COALESCE sur la clé, et encadrer chaque terme par COALESCE(..., 0.0)." } }
    - { id: c, text: { en: "Replace the vector term with 2.0 / (@k + vs.vector_rank).", fr: "Remplacer le terme vectoriel par 2.0 / (@k + vs.vector_rank)." } }
    - { id: d, text: { en: "Lower @k from 60 to 30.", fr: "Abaisser @k de 60 à 30." } }
    - { id: e, text: { en: "Multiply the cosine distance by 2 in vector_search before ranking.", fr: "Multiplier la distance cosinus par 2 dans vector_search avant le classement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A FULL OUTER JOIN keeps the rows of both lists, COALESCE on the key returns the ID whichever side found the row, and COALESCE(..., 0.0) gives 0 for the missing list instead of a NULL score. Multiplying the numerator of the vector term by 2.0 weights that source twice as much."
    fr: "Un FULL OUTER JOIN conserve les lignes des deux listes, COALESCE sur la clé renvoie l'ID quel que soit le côté qui a trouvé la ligne, et COALESCE(..., 0.0) donne 0 pour la liste manquante au lieu d'un score NULL. Multiplier par 2.0 le numérateur du terme vectoriel donne deux fois plus de poids à cette source."
  options:
    b: { en: "A LEFT OUTER JOIN from keyword_search drops the manuals found only by the vector search.", fr: "Un LEFT OUTER JOIN depuis keyword_search supprime les manuels trouvés uniquement par la recherche vectorielle." }
    d: { en: "k changes how much the top positions are favored in both lists; it doesn't weight one source against the other.", fr: "k modifie l'avantage des premières positions dans les deux listes ; il ne pondère pas une source par rapport à l'autre." }
    e: { en: "Multiplying every distance by the same factor keeps the same order, so the ranks and the RRF score don't change.", fr: "Multiplier toutes les distances par le même facteur conserve le même ordre : les rangs et le score RRF ne changent pas." }
references:
  - title: Implement hybrid search and ranking
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
