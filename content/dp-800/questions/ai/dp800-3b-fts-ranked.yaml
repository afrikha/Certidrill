id: dp800-3b-fts-ranked
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.SupportArticles. The table has an int primary key named ArticleID, a Title column and a Body column. A full-text index covers Body.

    Users type sentences such as "printer stops after paper jam". You need a query that returns the 20 most relevant articles, the most relevant first. The search must match any of the words of the sentence and their inflectional forms, without the application having to build a search condition.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.SupportArticles. La table possède une clé primaire int nommée ArticleID, une colonne Title et une colonne Body. Un index de recherche en texte intégral couvre Body.

    Les utilisateurs saisissent des phrases comme « printer stops after paper jam ». Vous avez besoin d'une requête qui renvoie les 20 articles les plus pertinents, le plus pertinent en premier. La recherche doit trouver n'importe quel mot de la phrase et ses formes fléchies, sans que l'application ait à construire une condition de recherche.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    DECLARE @input nvarchar(400) = N'printer stops after paper jam';

    SELECT a.ArticleID, a.Title, ft.[RANK]
    FROM dbo.SupportArticles AS a
    INNER JOIN [[fn]](dbo.SupportArticles, Body, @input, 20) AS ft
        ON a.ArticleID = [[key]]
    ORDER BY [[ord]];
  slots:
    - id: fn
      options:
        - { id: freetexttable, text: FREETEXTTABLE }
        - { id: containstable, text: CONTAINSTABLE }
        - { id: freetext, text: FREETEXT }
    - id: key
      options:
        - { id: key, text: "ft.[KEY]" }
        - { id: rank, text: "ft.[RANK]" }
        - { id: articleid, text: ft.ArticleID }
    - id: ord
      options:
        - { id: rankdesc, text: "ft.[RANK] DESC" }
        - { id: rankasc, text: "ft.[RANK] ASC" }
        - { id: keydesc, text: "ft.[KEY] DESC" }
answer:
  values: { fn: freetexttable, key: key, ord: rankdesc }
explanation:
  correct:
    en: |-
      FREETEXTTABLE word-breaks the free text, stems each word and matches any of the terms, and returns a table with the KEY and RANK columns; its last argument (top_n_by_rank) keeps the 20 highest-ranked matches. KEY holds the full-text key value, so you join it to ArticleID. A higher RANK means a better match, so you sort on RANK descending.
    fr: |-
      FREETEXTTABLE découpe le texte libre en mots, génère les formes dérivées de chaque mot et trouve n'importe quel terme, puis renvoie une table avec les colonnes KEY et RANK ; son dernier argument (top_n_by_rank) conserve les 20 correspondances les mieux classées. KEY contient la valeur de la clé de texte intégral, que vous joignez à ArticleID. Un RANK plus élevé signifie une meilleure correspondance, d'où le tri sur RANK décroissant.
  options:
    containstable: { en: "CONTAINSTABLE expects a CONTAINS search condition built with terms, phrases and operators, which the application would have to build.", fr: "CONTAINSTABLE attend une condition de recherche CONTAINS construite avec des termes, des expressions et des opérateurs, que l'application devrait construire." }
    freetext: { en: "FREETEXT is a predicate for the WHERE clause; it cannot be used in FROM and returns no RANK.", fr: "FREETEXT est un prédicat de clause WHERE ; il ne peut pas être utilisé dans FROM et ne renvoie pas de RANK." }
    rank: { en: "RANK is the relevance value, not the key of the matched row.", fr: "RANK est la valeur de pertinence, pas la clé de la ligne trouvée." }
    articleid: { en: "The table returned by the function has only the KEY and RANK columns.", fr: "La table renvoyée par la fonction ne contient que les colonnes KEY et RANK." }
    rankasc: { en: "Ascending order returns the least relevant articles first.", fr: "L'ordre croissant renvoie d'abord les articles les moins pertinents." }
    keydesc: { en: "Sorting on KEY orders the articles by ID, not by relevance.", fr: "Le tri sur KEY classe les articles par ID, pas par pertinence." }
references:
  - title: FREETEXTTABLE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-functions/freetexttable-transact-sql
