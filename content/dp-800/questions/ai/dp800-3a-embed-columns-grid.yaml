id: dp800-3a-embed-columns-grid
objective: "3.1.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Residences has an Azure SQL database that contains the dbo.Listings table shown in the answer area. Renters will type requests such as "quiet two-bedroom flat near a park, under 1,500 per month", and the application will combine a vector search with SQL predicates.

    Answer each prompt by selecting the appropriate column.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam Residences dispose d'une base de données Azure SQL qui contient la table dbo.Listings présentée dans la zone de réponse. Les locataires saisiront des demandes telles que « appartement calme de deux chambres près d'un parc, moins de 1 500 par mois », et l'application combinera une recherche vectorielle et des prédicats SQL.

    Répondez à chaque consigne en sélectionnant la colonne appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The column that carries the most semantic content and should be embedded", fr: "La colonne qui porte le plus de contenu sémantique et doit être incorporée" }
    - id: p2
      text: { en: "The column that should handle the \"under 1,500 per month\" constraint as a WHERE predicate", fr: "La colonne qui doit traiter la contrainte « moins de 1 500 par mois » sous forme de prédicat WHERE" }
  grid:
    header: [{ en: "Column", fr: "Colonne" }, { en: "Data type", fr: "Type de données" }, { en: "Example", fr: "Exemple" }]
    rows:
      - [{ text: ListingID, area: c1 }, { text: int }, { text: "50213" }]
      - [{ text: Reference, area: c2 }, { text: varchar(12) }, { text: FR-LYO-0815 }]
      - [{ text: Description, area: c3 }, { text: nvarchar(max) }, { text: { en: "Bright flat on a calm street, five minutes from the park...", fr: "Appartement lumineux dans une rue calme, à cinq minutes du parc..." } }]
      - [{ text: MonthlyRent, area: c4 }, { text: "decimal(9,2)" }, { text: "1420.00" }]
      - [{ text: Bedrooms, area: c5 }, { text: tinyint }, { text: "2" }]
      - [{ text: AvailableFrom, area: c6 }, { text: date }, { text: "2026-12-01" }]
answer:
  values: { p1: c3, p2: c4 }
explanation:
  correct:
    en: |
      Description is free-form text that expresses what renters describe (quiet, bright, near a park), so it is the column to embed. A numeric limit such as a maximum rent can't be compared by vectors: it stays an exact predicate, WHERE MonthlyRent < 1500, applied together with the vector search. Bedrooms is also numeric, but it doesn't answer the rent constraint.
    fr: |
      Description est un texte libre qui exprime ce que décrivent les locataires (calme, lumineux, près d'un parc) : c'est la colonne à incorporer. Une limite numérique comme un loyer maximal ne peut pas être comparée par des vecteurs : elle reste un prédicat exact, WHERE MonthlyRent < 1500, appliqué avec la recherche vectorielle. Bedrooms est aussi numérique, mais ne répond pas à la contrainte de loyer.
references:
  - title: Design embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads
  - title: Understand and evaluate models for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/02-understand-evaluate-models-sql-database-workloads
