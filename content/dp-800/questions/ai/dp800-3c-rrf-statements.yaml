id: dp800-3c-rrf-statements
objective: "3.2.9"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are implementing a hybrid search in an Azure SQL database. The query merges a FREETEXTTABLE list ranked by RANK and a VECTOR_SEARCH list ranked by cosine distance, by using reciprocal rank fusion (RRF) with k = 60.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous implémentez une recherche hybride dans une base de données Azure SQL. La requête fusionne une liste FREETEXTTABLE classée par RANK et une liste VECTOR_SEARCH classée par distance cosinus, par fusion de classement réciproque (RRF) avec k = 60.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You must normalize the full-text RANK values and the cosine distances to the same scale before you compute the RRF score.
        fr: Vous devez normaliser les valeurs RANK du texte intégral et les distances cosinus sur la même échelle avant de calculer le score RRF.
    - id: s2
      text:
        en: A row ranked second in both lists gets a higher RRF score than a row ranked first in only one list.
        fr: Une ligne classée deuxième dans les deux listes obtient un score RRF plus élevé qu'une ligne classée première dans une seule liste.
    - id: s3
      text:
        en: Increasing k from 60 to 200 reduces the advantage of the top positions over the lower positions.
        fr: Faire passer k de 60 à 200 réduit l'avantage des premières positions sur les positions suivantes.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "RRF uses only the positions of the rows in each list, so the different scales of RANK (higher is better) and distance (lower is better) need no normalization. Second in both lists gives 2/62 ≈ 0.0323, more than 1/61 ≈ 0.0164 for first in one list. A larger k flattens the differences between ranks, while a smaller k favors the top positions."
    fr: "RRF n'utilise que la position des lignes dans chaque liste : les échelles différentes de RANK (plus élevé = meilleur) et de la distance (plus faible = meilleur) ne demandent aucune normalisation. Deuxième dans les deux listes donne 2/62 ≈ 0,0323, plus que 1/61 ≈ 0,0164 pour premier dans une seule liste. Un k plus grand aplanit les écarts entre rangs, alors qu'un k plus petit favorise les premières positions."
references:
  - title: Implement hybrid search and ranking
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
