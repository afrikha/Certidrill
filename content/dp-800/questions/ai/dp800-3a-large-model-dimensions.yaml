id: dp800-3a-large-model-dimensions
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank runs SQL Server 2025 on-premises. The database will store embeddings of policy documents written in eight languages. After an evaluation, the team selects text-embedding-3-large because it gives the best multi-language retrieval.

    The database must not enable preview features. The vectors must be stored in a single vector column, and the external model and the column must be designed together so that every generated embedding fits the column.

    What should you do?
  fr: |
    Woodgrove Bank exécute SQL Server 2025 en local. La base de données stockera les incorporations de documents de politique rédigés en huit langues. Après une évaluation, l'équipe choisit text-embedding-3-large, car il offre la meilleure recherche multilingue.

    La base de données ne doit pas activer de fonctionnalités en préversion. Les vecteurs doivent être stockés dans une seule colonne vectorielle, et le modèle externe et la colonne doivent être conçus ensemble pour que chaque incorporation générée tienne dans la colonne.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Declare the column as VECTOR(3072) and keep the model's default dimensions.", fr: "Déclarer la colonne VECTOR(3072) et conserver les dimensions par défaut du modèle." } }
    - { id: b, text: { en: "Declare the column as VECTOR(3072, float16) and keep the model's default dimensions.", fr: "Déclarer la colonne VECTOR(3072, float16) et conserver les dimensions par défaut du modèle." } }
    - { id: c, text: { en: "Declare the column as VECTOR(1536) and apply VECTOR_NORMALIZE to the model output.", fr: "Déclarer la colonne VECTOR(1536) et appliquer VECTOR_NORMALIZE à la sortie du modèle." } }
    - { id: d, text: { en: "Declare the column as VECTOR(1536) and set dimensions to 1536 in the model PARAMETERS.", fr: "Déclarer la colonne VECTOR(1536) et définir dimensions à 1536 dans les PARAMETERS du modèle." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      text-embedding-3-large returns 3,072 dimensions by default, but a float32 vector column accepts at most 1,998 dimensions. The third-generation models accept a dimensions parameter, so PARAMETERS = '{"dimensions": 1536}' in the external model makes every call return 1,536 values that fit a VECTOR(1536) column. float16 vectors accept up to 3,996 dimensions, but float16 is a preview feature in SQL Server 2025.
    fr: |
      text-embedding-3-large retourne 3 072 dimensions par défaut, mais une colonne vectorielle en float32 accepte au plus 1 998 dimensions. Les modèles de troisième génération acceptent un paramètre dimensions : PARAMETERS = '{"dimensions": 1536}' dans le modèle externe fait retourner 1 536 valeurs à chaque appel, qui tiennent dans une colonne VECTOR(1536). Les vecteurs float16 acceptent jusqu'à 3 996 dimensions, mais float16 est une fonctionnalité en préversion dans SQL Server 2025.
  options:
    a: { en: "A float32 vector can't have more than 1,998 dimensions, so VECTOR(3072) can't be declared.", fr: "Un vecteur float32 ne peut pas dépasser 1 998 dimensions : VECTOR(3072) ne peut pas être déclaré." }
    b: { en: "float16 vectors require the PREVIEW_FEATURES database scoped configuration in SQL Server 2025.", fr: "Les vecteurs float16 exigent la configuration délimitée à la base de données PREVIEW_FEATURES dans SQL Server 2025." }
    c: { en: "VECTOR_NORMALIZE scales a vector to length 1 but keeps its 3,072 dimensions, so the value still doesn't fit VECTOR(1536).", fr: "VECTOR_NORMALIZE ramène un vecteur à une longueur de 1 mais conserve ses 3 072 dimensions : la valeur ne tient toujours pas dans VECTOR(1536)." }
