id: dp800-3b-fn-distance-no-index
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Articles with 3 million rows. You created a vector index that uses the cosine metric on the Embedding column. The search query is the following.

    ```sql
    SELECT TOP (10) ArticleID, Title,
           VECTOR_DISTANCE('cosine', @qv, Embedding) AS distance
    FROM dbo.Articles
    ORDER BY distance;
    ```

    The execution plan shows a scan of the whole table, and the latency is too high. A small loss of accuracy is acceptable.

    You need the search to use the vector index.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Articles de 3 millions de lignes. Vous avez créé un index vectoriel qui utilise la métrique cosinus sur la colonne Embedding. La requête de recherche est la suivante.

    ```sql
    SELECT TOP (10) ArticleID, Title,
           VECTOR_DISTANCE('cosine', @qv, Embedding) AS distance
    FROM dbo.Articles
    ORDER BY distance;
    ```

    Le plan d'exécution montre une analyse de toute la table, et la latence est trop élevée. Une petite perte de précision est acceptable.

    Vous devez faire en sorte que la recherche utilise l'index vectoriel.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the table hint WITH (INDEX (vix_Articles_Embedding)) to the query.", fr: "Ajouter l'indicateur de table WITH (INDEX (vix_Articles_Embedding)) à la requête." } }
    - { id: b, text: { en: "Recreate the vector index with METRIC = 'dot' and MAXDOP = 0.", fr: "Recréer l'index vectoriel avec METRIC = 'dot' et MAXDOP = 0." } }
    - { id: c, text: { en: "Rewrite the query with VECTOR_SEARCH and SELECT TOP (10) WITH APPROXIMATE.", fr: "Réécrire la requête avec VECTOR_SEARCH et SELECT TOP (10) WITH APPROXIMATE." } }
    - { id: d, text: { en: "Normalize @qv with VECTOR_NORMALIZE before you run the query.", fr: "Normaliser @qv avec VECTOR_NORMALIZE avant d'exécuter la requête." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      VECTOR_DISTANCE is always exact and never uses a vector index, even when one exists. To perform an approximate search through the index, you must use VECTOR_SEARCH, with SELECT TOP (N) WITH APPROXIMATE and ORDER BY distance for latest-version indexes.
    fr: |-
      VECTOR_DISTANCE est toujours exacte et n'utilise jamais d'index vectoriel, même s'il en existe un. Pour effectuer une recherche approximative au moyen de l'index, vous devez utiliser VECTOR_SEARCH, avec SELECT TOP (N) WITH APPROXIMATE et ORDER BY distance pour les index de dernière version.
  options:
    a: { en: "A table hint does not change the way VECTOR_DISTANCE works: it computes the distance for every row.", fr: "Un indicateur de table ne change pas le fonctionnement de VECTOR_DISTANCE : elle calcule la distance pour chaque ligne." }
    b: { en: "Changing the metric of the index does not make VECTOR_DISTANCE use it, and the index would no longer match the cosine searches.", fr: "Changer la métrique de l'index ne pousse pas VECTOR_DISTANCE à l'utiliser, et l'index ne correspondrait plus aux recherches cosinus." }
    d: { en: "Normalizing the query vector does not change the exact computation over every row.", fr: "Normaliser le vecteur de requête ne change pas le calcul exact sur chaque ligne." }
references:
  - title: VECTOR_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
