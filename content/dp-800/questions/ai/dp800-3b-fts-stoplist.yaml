id: dp800-3b-fts-stoplist
objective: "3.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2025 database that contains a table named dbo.Contracts. A full-text index on the Body column uses the system stoplist.

    Every contract contains the company name Litware many times. The word appears in all the search results and makes the index larger.

    You need full-text queries in English to ignore the word Litware. All the stopwords of the system stoplist must remain in effect.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données SQL Server 2025 qui contient une table nommée dbo.Contracts. Un index de recherche en texte intégral sur la colonne Body utilise la liste de mots vides système.

    Chaque contrat contient de nombreuses fois le nom de société Litware. Ce mot apparaît dans tous les résultats de recherche et augmente la taille de l'index.

    Les requêtes de texte intégral en anglais doivent ignorer le mot Litware. Tous les mots vides de la liste de mots vides système doivent rester en vigueur.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Run CREATE FULLTEXT STOPLIST LitwareStoplist FROM SYSTEM STOPLIST.", fr: "Exécuter CREATE FULLTEXT STOPLIST LitwareStoplist FROM SYSTEM STOPLIST." } }
    - { id: add, text: { en: "Run ALTER FULLTEXT STOPLIST LitwareStoplist ADD 'litware' LANGUAGE 'English'.", fr: "Exécuter ALTER FULLTEXT STOPLIST LitwareStoplist ADD 'litware' LANGUAGE 'English'." } }
    - { id: set, text: { en: "Run ALTER FULLTEXT INDEX ON dbo.Contracts SET STOPLIST LitwareStoplist.", fr: "Exécuter ALTER FULLTEXT INDEX ON dbo.Contracts SET STOPLIST LitwareStoplist." } }
    - { id: empty, text: { en: "Run CREATE FULLTEXT STOPLIST LitwareStoplist without a FROM clause.", fr: "Exécuter CREATE FULLTEXT STOPLIST LitwareStoplist sans clause FROM." } }
    - { id: thesaurus, text: { en: "Add Litware to an expansion set in the English thesaurus file.", fr: "Ajouter Litware à un ensemble d'extension du fichier de dictionnaire des synonymes anglais." } }
    - { id: disable, text: { en: "Run ALTER FULLTEXT INDEX ON dbo.Contracts DISABLE.", fr: "Exécuter ALTER FULLTEXT INDEX ON dbo.Contracts DISABLE." } }
answer:
  sequence: [ create, add, set ]
explanation:
  correct:
    en: |
      You cannot edit the system stoplist, but CREATE FULLTEXT STOPLIST ... FROM SYSTEM STOPLIST copies it, so all its stopwords stay in effect. ALTER FULLTEXT STOPLIST ... ADD adds the word for the English language. You then associate the stoplist with the index; without WITH NO POPULATION, SET STOPLIST repopulates the index so that the word is removed from it.
    fr: |
      Vous ne pouvez pas modifier la liste de mots vides système, mais CREATE FULLTEXT STOPLIST ... FROM SYSTEM STOPLIST la copie : tous ses mots vides restent en vigueur. ALTER FULLTEXT STOPLIST ... ADD ajoute le mot pour la langue anglaise. Vous associez ensuite la liste à l'index ; sans WITH NO POPULATION, SET STOPLIST remplit de nouveau l'index, ce qui en retire le mot.
  options:
    empty: { en: "An empty stoplist would drop all the system stopwords, which violates the requirement.", fr: "Une liste de mots vides vide supprimerait tous les mots vides système, ce qui enfreint l'exigence." }
    thesaurus: { en: "The thesaurus defines expansions and replacements of query terms; it does not remove a word from the index.", fr: "Le dictionnaire des synonymes définit des extensions et des remplacements de termes de requête ; il ne retire pas un mot de l'index." }
    disable: { en: "A disabled full-text index cannot answer full-text queries at all.", fr: "Un index de recherche en texte intégral désactivé ne peut plus répondre à aucune requête de texte intégral." }
references:
  - title: CREATE FULLTEXT STOPLIST (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-fulltext-stoplist-transact-sql
  - title: ALTER FULLTEXT STOPLIST (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-fulltext-stoplist-transact-sql
