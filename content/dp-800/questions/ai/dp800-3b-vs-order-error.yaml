id: dp800-3b-vs-order-error
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Products. A latest-version vector index exists on the DescriptionVector column. You run the following query.

    ```sql
    SELECT TOP (10) WITH APPROXIMATE
           p.ProductID, p.Name, p.ListPrice, r.distance
    FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                       SIMILAR_TO = @qv, METRIC = 'cosine') AS r
    ORDER BY r.distance, p.ListPrice;
    ```

    The query fails with Msg 42271.

    You need to return the 10 approximate nearest products sorted by ListPrice.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Products. Un index vectoriel de dernière version existe sur la colonne DescriptionVector. Vous exécutez la requête suivante.

    ```sql
    SELECT TOP (10) WITH APPROXIMATE
           p.ProductID, p.Name, p.ListPrice, r.distance
    FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                       SIMILAR_TO = @qv, METRIC = 'cosine') AS r
    ORDER BY r.distance, p.ListPrice;
    ```

    La requête échoue avec le message Msg 42271.

    Vous devez renvoyer les 10 produits les plus proches de manière approximative, triés par ListPrice.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove the ORDER BY clause from the query, and sort the 10 rows by ListPrice in the application.", fr: "Supprimer la clause ORDER BY de la requête, et trier les 10 lignes par ListPrice dans l'application." } }
    - { id: b, text: { en: "Swap the sort keys to ORDER BY p.ListPrice, r.distance in the same query.", fr: "Inverser les clés de tri en ORDER BY p.ListPrice, r.distance dans la même requête." } }
    - { id: c, text: { en: "Order the query only by r.distance, use it as a subquery, and sort by ListPrice in the outer query.", fr: "Trier la requête uniquement par r.distance, l'utiliser comme sous-requête, et trier par ListPrice dans la requête externe." } }
    - { id: d, text: { en: "Change the sort to ORDER BY r.distance DESC, p.ListPrice in the same query.", fr: "Remplacer le tri par ORDER BY r.distance DESC, p.ListPrice dans la même requête." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With TOP (N) WITH APPROXIMATE, the distance column is the only valid ordering key, in ascending order. Additional sort columns require the subquery pattern; the vector search runs in the inner query, and the outer query sorts its 10 rows by price.
    fr: |-
      Avec TOP (N) WITH APPROXIMATE, la colonne distance est la seule clé de tri valide, dans l'ordre croissant. Des colonnes de tri supplémentaires exigent le modèle de sous-requête ; la recherche vectorielle s'exécute dans la requête interne, et la requête externe trie ses 10 lignes par prix.
  options:
    a: { en: "APPROXIMATE cannot be used in a query without ORDER BY (Msg 42248).", fr: "APPROXIMATE ne peut pas être utilisé dans une requête sans ORDER BY (Msg 42248)." }
    b: { en: "Any column other than distance in the ORDER BY of the approximate query raises Msg 42271.", fr: "Toute colonne autre que distance dans le ORDER BY de la requête approximative provoque l'erreur Msg 42271." }
    d: { en: "Descending order on distance and an additional column both raise Msg 42271.", fr: "Un tri décroissant sur distance et une colonne supplémentaire provoquent tous deux l'erreur Msg 42271." }
references:
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
