id: dp800-cs1a-recall-check
objective: "3.2.10"
type: single
caseStudy: dp800-cs1a-adventure-works
difficulty: 2
status: draft
stem:
  en: |
    The "similar products" panel runs a SELECT TOP (10) WITH APPROXIMATE query over VECTOR_SEARCH. A vector index that uses the cosine metric exists on DescriptionVector.

    You need to measure the recall of the panel. The solution must meet the search requirements.

    What should you do?
  fr: |
    Le panneau « produits similaires » exécute une requête SELECT TOP (10) WITH APPROXIMATE sur VECTOR_SEARCH. Un index vectoriel qui utilise la métrique cosinus existe sur DescriptionVector.

    Vous devez mesurer le rappel du panneau. La solution doit respecter les exigences de recherche.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "For a sample of products, compare the duration of the panel query with the duration of a TOP (10) query ordered by VECTOR_DISTANCE in Query Store.", fr: "Pour un échantillon de produits, comparer dans le Magasin des requêtes la durée de la requête du panneau avec celle d'une requête TOP (10) triée par VECTOR_DISTANCE." } }
    - { id: b, text: { en: "For a sample of products, compute the average of the distance column that the panel query returns and compare it with the cosine distance of identical vectors.", fr: "Pour un échantillon de produits, calculer la moyenne de la colonne distance renvoyée par la requête du panneau et la comparer à la distance cosinus de vecteurs identiques." } }
    - { id: c, text: { en: "For a sample of products, compare the logical reads of the panel query with the logical reads of a full scan of dbo.Products by using SET STATISTICS IO ON.", fr: "Pour un échantillon de produits, comparer les lectures logiques de la requête du panneau avec celles d'une analyse complète de dbo.Products à l'aide de SET STATISTICS IO ON." } }
    - { id: d, text: { en: "For a sample of products, compare the IDs that the panel query returns with the IDs of a TOP (10) query that has the same filter and is ordered by VECTOR_DISTANCE.", fr: "Pour un échantillon de produits, comparer les ID renvoyés par la requête du panneau avec les ID d'une requête TOP (10) qui a le même filtre et qui est triée par VECTOR_DISTANCE." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Recall measures how many of the true nearest neighbors an approximate (ANN) search returns. A TOP (10) query ordered by VECTOR_DISTANCE computes the exact (ENN) result for the same filter, so the share of IDs that both result sets have in common, averaged over a sample of query vectors, is the recall of the vector index for the panel.
    fr: |
      Le rappel mesure combien des véritables plus proches voisins une recherche approximative (ANN) renvoie. Une requête TOP (10) triée par VECTOR_DISTANCE calcule le résultat exact (ENN) pour le même filtre : la part des ID communs aux deux jeux de résultats, en moyenne sur un échantillon de vecteurs de requête, est le rappel de l'index vectoriel pour le panneau.
  options:
    a: { en: "Duration measures latency, which is a separate requirement; it says nothing about which products the approximate search misses.", fr: "La durée mesure la latence, qui est une exigence distincte ; elle n'indique pas quels produits la recherche approximative manque." }
    b: { en: "Distances of the returned rows do not show whether closer products were missed; the comparison needs the exact result set.", fr: "Les distances des lignes renvoyées ne montrent pas si des produits plus proches ont été manqués ; la comparaison exige le jeu de résultats exact." }
    c: { en: "Logical reads measure the I/O cost of the query, not the quality of its results.", fr: "Les lectures logiques mesurent le coût d'E/S de la requête, pas la qualité de ses résultats." }
references:
  - title: Implement hybrid search and ranking
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
