id: dp800-3b-vs-same-model
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an Azure SQL database that contains a table named dbo.Recipes. The Embedding column was filled by using an external model named RecipeEmbedA that returns 1,536 dimensions. A vector index that uses the cosine metric exists on Embedding.

    A new search procedure generates the query vector by using another external model, RecipeEmbedB, which also returns 1,536 dimensions. The searches run without errors, but the returned recipes are unrelated to the user's question.

    You need to fix the search.

    What should you do?
  fr: |
    Northwind Traders dispose d'une base de données Azure SQL qui contient une table nommée dbo.Recipes. La colonne Embedding a été remplie avec un modèle externe nommé RecipeEmbedA qui renvoie 1 536 dimensions. Un index vectoriel qui utilise la métrique cosinus existe sur Embedding.

    Une nouvelle procédure de recherche génère le vecteur de requête avec un autre modèle externe, RecipeEmbedB, qui renvoie lui aussi 1 536 dimensions. Les recherches s'exécutent sans erreur, mais les recettes renvoyées n'ont aucun rapport avec la question de l'utilisateur.

    Vous devez corriger la recherche.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Generate the query vector by using RecipeEmbedA.", fr: "Générer le vecteur de requête avec RecipeEmbedA." } }
    - { id: b, text: { en: "Normalize the query vector by using VECTOR_NORMALIZE.", fr: "Normaliser le vecteur de requête avec VECTOR_NORMALIZE." } }
    - { id: c, text: { en: "Change the metric of the index and the query to euclidean.", fr: "Remplacer la métrique de l'index et de la requête par euclidean." } }
    - { id: d, text: { en: "Recreate the vector index with a higher MAXDOP value.", fr: "Recréer l'index vectoriel avec une valeur MAXDOP plus élevée." } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Distances are meaningful only between vectors produced by the same model. Two models with the same number of dimensions place concepts at different positions, so the query vector must be generated with the model that produced the stored embeddings.
    fr: |-
      Les distances n'ont de sens qu'entre des vecteurs produits par le même modèle. Deux modèles ayant le même nombre de dimensions placent les concepts à des positions différentes : le vecteur de requête doit donc être généré avec le modèle qui a produit les incorporations stockées.
  options:
    b: { en: "Normalizing changes the length of the vector, not the fact that it comes from a different vector space.", fr: "La normalisation change la longueur du vecteur, pas le fait qu'il provienne d'un autre espace vectoriel." }
    c: { en: "No metric can compare vectors from two different models in a meaningful way.", fr: "Aucune métrique ne peut comparer de manière pertinente des vecteurs issus de deux modèles différents." }
    d: { en: "MAXDOP affects the parallelism of the index build, not the relevance of the results.", fr: "MAXDOP agit sur le parallélisme de la création de l'index, pas sur la pertinence des résultats." }
references:
  - title: Implement vector search query patterns
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/05-implement-vector-search-query-patterns
