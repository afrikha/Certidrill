stem:
  en: You use VECTOR_SEARCH with TOP (5) and no APPROXIMATE keyword.
  fr: Vous utilisez VECTOR_SEARCH avec TOP (5) sans le mot clé APPROXIMATE.
body:
  solution:
    en: |
      You run the following query.

      ```sql
      SELECT TOP (5) a.ArticleID, a.Title, r.distance
      FROM VECTOR_SEARCH(
          TABLE = dbo.Articles AS a,
          COLUMN = ContentVector,
          SIMILAR_TO = @qv,
          METRIC = 'cosine'
      ) AS r
      ORDER BY r.distance;
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```sql
      SELECT TOP (5) a.ArticleID, a.Title, r.distance
      FROM VECTOR_SEARCH(
          TABLE = dbo.Articles AS a,
          COLUMN = ContentVector,
          SIMILAR_TO = @qv,
          METRIC = 'cosine'
      ) AS r
      ORDER BY r.distance;
      ```
answer: { value: true }
explanation:
  correct:
    en: VECTOR_SEARCH runs even when the column has no vector index; it then scans the table and computes the distance for every row. With TOP (N) and ORDER BY distance but without WITH APPROXIMATE, the query is an exact k-nearest neighbor (kNN) search. The ascending order on distance returns the five most similar articles first.
    fr: "VECTOR_SEARCH s'exécute même quand la colonne n'a aucun index vectoriel ; il analyse alors la table et calcule la distance pour chaque ligne. Avec TOP (N) et ORDER BY distance mais sans WITH APPROXIMATE, la requête est une recherche exacte des k plus proches voisins (kNN). Le tri croissant sur distance retourne d'abord les cinq articles les plus similaires."
references:
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
