id: dp800-3b-ann-exact-queries
objective: "3.2.5"
type: multi
shuffle: false
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Products. A latest-version vector index that uses the cosine metric exists on the DescriptionVector column. The variable @qv contains a query vector.

    You are evaluating the following queries.

    ```sql
    -- Query A
    SELECT TOP (5) WITH APPROXIMATE p.ProductID, r.distance
    FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                       SIMILAR_TO = @qv, METRIC = 'cosine') AS r
    ORDER BY r.distance;

    -- Query B
    SELECT TOP (5) ProductID, VECTOR_DISTANCE('cosine', @qv, DescriptionVector) AS d
    FROM dbo.Products
    ORDER BY d;

    -- Query C
    SELECT TOP (5) WITH APPROXIMATE p.ProductID, r.distance
    FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                       SIMILAR_TO = @qv, METRIC = 'cosine') AS r WITH (FORCE_ANN_ONLY)
    ORDER BY r.distance;

    -- Query D
    SELECT TOP (5) p.ProductID, r.distance
    FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                       SIMILAR_TO = @qv, METRIC = 'cosine') AS r
    ORDER BY r.distance;

    -- Query E
    SELECT TOP (5) ProductID, VECTOR_DISTANCE('cosine', @qv, DescriptionVector) AS d
    FROM dbo.Products
    ORDER BY d DESC;
    ```

    You need to return the exact five nearest products to @qv.

    Which two queries should you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Products. Un index vectoriel de dernière version qui utilise la métrique cosinus existe sur la colonne DescriptionVector. La variable @qv contient un vecteur de requête.

    Vous évaluez les requêtes suivantes.

    ```sql
    -- Query A
    SELECT TOP (5) WITH APPROXIMATE p.ProductID, r.distance
    FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                       SIMILAR_TO = @qv, METRIC = 'cosine') AS r
    ORDER BY r.distance;

    -- Query B
    SELECT TOP (5) ProductID, VECTOR_DISTANCE('cosine', @qv, DescriptionVector) AS d
    FROM dbo.Products
    ORDER BY d;

    -- Query C
    SELECT TOP (5) WITH APPROXIMATE p.ProductID, r.distance
    FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                       SIMILAR_TO = @qv, METRIC = 'cosine') AS r WITH (FORCE_ANN_ONLY)
    ORDER BY r.distance;

    -- Query D
    SELECT TOP (5) p.ProductID, r.distance
    FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                       SIMILAR_TO = @qv, METRIC = 'cosine') AS r
    ORDER BY r.distance;

    -- Query E
    SELECT TOP (5) ProductID, VECTOR_DISTANCE('cosine', @qv, DescriptionVector) AS d
    FROM dbo.Products
    ORDER BY d DESC;
    ```

    Vous devez renvoyer exactement les cinq produits les plus proches de @qv.

    Quelles sont les deux requêtes à utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Query A }
    - { id: b, text: Query B }
    - { id: c, text: Query C }
    - { id: d, text: Query D }
    - { id: e, text: Query E }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      VECTOR_DISTANCE always computes exact distances, so TOP (5) ordered by ascending distance returns the exact nearest neighbors. VECTOR_SEARCH also runs an exact k-nearest neighbor (kNN) search when the query uses TOP (N) with ORDER BY distance but without APPROXIMATE.
    fr: |-
      VECTOR_DISTANCE calcule toujours des distances exactes : TOP (5) trié par distance croissante renvoie les plus proches voisins exacts. VECTOR_SEARCH effectue aussi une recherche exacte des k plus proches voisins (kNN) lorsque la requête utilise TOP (N) avec ORDER BY distance mais sans APPROXIMATE.
  options:
    a: { en: "WITH APPROXIMATE allows the engine to use the DiskANN index, which returns an approximate result.", fr: "WITH APPROXIMATE permet au moteur d'utiliser l'index DiskANN, qui renvoie un résultat approximatif." }
    c: { en: "FORCE_ANN_ONLY forces the approximate index, so the result is not guaranteed to be exact.", fr: "FORCE_ANN_ONLY force l'index approximatif : le résultat n'est pas garanti exact." }
    e: { en: "Descending order returns the five farthest products.", fr: "L'ordre décroissant renvoie les cinq produits les plus éloignés." }
references:
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
  - title: VECTOR_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
