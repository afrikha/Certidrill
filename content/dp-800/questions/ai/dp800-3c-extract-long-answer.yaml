id: dp800-3c-extract-long-answer
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database. A stored procedure asks a chat deployment to summarize contracts and extracts the answer as follows. @response is an nvarchar(max) variable.

    ```sql
    IF @rc = 0
        SET @summary = JSON_VALUE(@response, '$.result.choices[0].message.content');
    ```

    For short contracts, @summary contains the expected text. For long contracts, @summary is NULL, although @rc is 0 and finish_reason is stop.

    You need to return the full summary in every case.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL. Une procédure stockée demande à un déploiement de conversation de résumer des contrats et extrait la réponse comme suit. @response est une variable nvarchar(max).

    ```sql
    IF @rc = 0
        SET @summary = JSON_VALUE(@response, '$.result.choices[0].message.content');
    ```

    Pour les contrats courts, @summary contient le texte attendu. Pour les contrats longs, @summary vaut NULL, alors que @rc vaut 0 et que finish_reason vaut stop.

    Vous devez renvoyer le résumé complet dans tous les cas.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace JSON_VALUE with JSON_QUERY and keep the same path.", fr: "Remplacer JSON_VALUE par JSON_QUERY en gardant le même chemin." } }
    - { id: b, text: { en: "Read the content with OPENJSON and a WITH column of type nvarchar(max).", fr: "Lire le contenu avec OPENJSON et une colonne WITH de type nvarchar(max)." } }
    - { id: c, text: { en: "Add the strict keyword at the start of the JSON path.", fr: "Ajouter le mot clé strict au début du chemin JSON." } }
    - { id: d, text: { en: "Increase the max_tokens value of the payload.", fr: "Augmenter la valeur max_tokens de la charge utile." } }
answer: { optionId: b }
explanation:
  correct:
    en: "JSON_VALUE returns nvarchar(4000) and, in the default lax mode, returns NULL when the value is longer. OPENJSON(@response, '$.result.choices') WITH (content NVARCHAR(MAX) '$.message.content') returns the whole text, whatever its length."
    fr: "JSON_VALUE renvoie un nvarchar(4000) et, dans le mode lax par défaut, renvoie NULL quand la valeur est plus longue. OPENJSON(@response, '$.result.choices') WITH (content NVARCHAR(MAX) '$.message.content') renvoie tout le texte, quelle que soit sa longueur."
  options:
    a: { en: "JSON_QUERY extracts objects and arrays; for a string value it returns NULL.", fr: "JSON_QUERY extrait des objets et des tableaux ; pour une valeur de type chaîne, il renvoie NULL." }
    c: { en: "In strict mode, a value over 4,000 characters raises an error instead of returning NULL.", fr: "En mode strict, une valeur de plus de 4 000 caractères lève une erreur au lieu de renvoyer NULL." }
    d: { en: "finish_reason is stop, so the answer is complete; the problem is the length that JSON_VALUE can return.", fr: "finish_reason vaut stop : la réponse est complète ; le problème est la longueur que JSON_VALUE peut renvoyer." }
references:
  - title: JSON_VALUE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-value-transact-sql
  - title: OPENJSON (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/openjson-transact-sql
