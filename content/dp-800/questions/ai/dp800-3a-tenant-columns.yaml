id: dp800-3a-tenant-columns
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso hosts a multitenant knowledge base in an Azure SQL database. The dbo.Articles table has the columns TenantID, ArticleID, Title, Body, IsPublished and UpdatedAt. You are designing the embeddings that will support semantic search for each tenant's support agents.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso héberge une base de connaissances multilocataire dans une base de données Azure SQL. La table dbo.Articles contient les colonnes TenantID, ArticleID, Title, Body, IsPublished et UpdatedAt. Vous concevez les incorporations qui prendront en charge la recherche sémantique pour les agents de support de chaque locataire.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "TenantID should be applied as a WHERE predicate with the vector search, not embedded.", fr: "TenantID doit être appliqué comme prédicat WHERE avec la recherche vectorielle, pas incorporé." } }
    - { id: b, text: { en: "Embedding UpdatedAt with the text makes vector search return the newest articles first.", fr: "Incorporer UpdatedAt avec le texte fait renvoyer d'abord les articles les plus récents par la recherche vectorielle." } }
    - { id: c, text: { en: "Leaving ArticleID and IsPublished out of the embedded text reduces tokens without lowering relevance.", fr: "Exclure ArticleID et IsPublished du texte incorporé réduit les jetons sans diminuer la pertinence." } }
    - { id: d, text: { en: "Embedding TenantID in the text prevents agents from retrieving another tenant's articles.", fr: "Incorporer TenantID dans le texte empêche les agents de récupérer les articles d'un autre locataire." } }
    - { id: e, text: { en: "Embedding IsPublished in the text excludes draft articles from the results.", fr: "Incorporer IsPublished dans le texte exclut les articles en brouillon des résultats." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Identifiers, flags and dates carry little semantic value: excluding them from the embedded text reduces token usage and keeps the vector focused on Title and Body. Conditions such as the tenant, the publication status or a date range are exact rules, so they are enforced with WHERE predicates combined with the vector search.
    fr: |
      Les identifiants, les indicateurs et les dates ont peu de valeur sémantique : les exclure du texte incorporé réduit l'utilisation de jetons et concentre le vecteur sur Title et Body. Des conditions comme le locataire, l'état de publication ou une plage de dates sont des règles exactes : elles s'appliquent avec des prédicats WHERE combinés à la recherche vectorielle.
  options:
    b: { en: "Vectors measure similarity of meaning; a date in the text doesn't order results by recency.", fr: "Les vecteurs mesurent une similarité de sens ; une date dans le texte ne trie pas les résultats par ancienneté." }
    d: { en: "Similarity never acts as a security boundary: tenant isolation requires a predicate (or Row-Level Security).", fr: "La similarité ne constitue jamais une frontière de sécurité : l'isolation des locataires exige un prédicat (ou Row-Level Security)." }
    e: { en: "A flag in the text only shifts the vector slightly; it can't exclude rows, which a WHERE predicate does.", fr: "Un indicateur dans le texte ne fait que décaler légèrement le vecteur ; il ne peut pas exclure des lignes, contrairement à un prédicat WHERE." }
references:
  - title: Design embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads
