stem:
  en: You call VECTOR_SEARCH with the TOP_N argument set to 10.
  fr: Vous appelez VECTOR_SEARCH avec l'argument TOP_N défini sur 10.
body:
  solution:
    en: |
      You write the following query:

      ```sql
      SELECT e.ProductID, r.distance
      FROM VECTOR_SEARCH(
              TABLE = dbo.ProductEmbeddings AS e,
              COLUMN = Embedding,
              SIMILAR_TO = @q,
              METRIC = 'cosine',
              TOP_N = 10
          ) AS r
      ORDER BY r.distance;
      ```
    fr: |
      Vous écrivez la requête suivante :

      ```sql
      SELECT e.ProductID, r.distance
      FROM VECTOR_SEARCH(
              TABLE = dbo.ProductEmbeddings AS e,
              COLUMN = Embedding,
              SIMILAR_TO = @q,
              METRIC = 'cosine',
              TOP_N = 10
          ) AS r
      ORDER BY r.distance;
      ```
answer: { value: false }
explanation:
  correct:
    en: TOP_N is the deprecated syntax kept only for earlier-version vector indexes, and it is not supported with a latest-version index such as vix_ProductEmbeddings_Embedding, so the query fails. With the latest version, the number of rows is set by SELECT TOP (10) WITH APPROXIMATE, and the query orders by distance.
    fr: "TOP_N est la syntaxe dépréciée conservée uniquement pour les index vectoriels de version antérieure, et elle n'est pas prise en charge avec un index de dernière version tel que vix_ProductEmbeddings_Embedding : la requête échoue. Avec la dernière version, le nombre de lignes est défini par SELECT TOP (10) WITH APPROXIMATE, et la requête trie par distance."
references:
