id: dp800-3b-fn-threshold
objective: "3.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Articles. The Embedding column contains VECTOR(1536) embeddings generated by an external model named ArticleEmbeddings. The table has no vector index.

    You need a query that returns every article whose exact cosine distance to the user's question is lower than 0.3, the closest articles first.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Articles. La colonne Embedding contient des incorporations VECTOR(1536) générées par un modèle externe nommé ArticleEmbeddings. La table ne possède pas d'index vectoriel.

    Vous avez besoin d'une requête qui renvoie chaque article dont la distance cosinus exacte à la question de l'utilisateur est inférieure à 0,3, les articles les plus proches en premier.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    DECLARE @question nvarchar(400) = N'How do I reset a forgotten PIN?';
    DECLARE @qv VECTOR(1536) = [[gen]];

    SELECT ArticleID, Title,
           VECTOR_DISTANCE('cosine', @qv, Embedding) AS distance
    FROM dbo.Articles
    WHERE VECTOR_DISTANCE('cosine', @qv, Embedding) [[cmp]]
    ORDER BY [[ord]];
  slots:
    - id: gen
      options:
        - { id: embed, text: "AI_GENERATE_EMBEDDINGS(@question USE MODEL ArticleEmbeddings)" }
        - { id: cast, text: "CAST(@question AS VECTOR(1536))" }
        - { id: normalize, text: "VECTOR_NORMALIZE(@question, 'norm2')" }
    - id: cmp
      options:
        - { id: lt, text: "< 0.3" }
        - { id: gt, text: "> 0.3" }
        - { id: gt7, text: "> 0.7" }
    - id: ord
      options:
        - { id: asc, text: distance ASC }
        - { id: desc, text: distance DESC }
        - { id: id, text: ArticleID }
answer:
  values: { gen: embed, cmp: lt, ord: asc }
explanation:
  correct:
    en: |-
      The question must be turned into a vector with the same model that generated the stored embeddings, which AI_GENERATE_EMBEDDINGS does through the external model. With every metric of VECTOR_DISTANCE, a smaller value means more similar vectors, so the threshold filter is lower than 0.3 and the closest rows come first in ascending order.
    fr: |-
      La question doit être transformée en vecteur avec le modèle qui a généré les incorporations stockées, ce que fait AI_GENERATE_EMBEDDINGS au moyen du modèle externe. Avec toutes les métriques de VECTOR_DISTANCE, une valeur plus petite signifie des vecteurs plus similaires : le filtre de seuil est donc inférieur à 0,3 et les lignes les plus proches viennent en premier dans l'ordre croissant.
  options:
    cast: { en: "A string converts to vector only when it contains a JSON array of numbers; casting a question does not compute an embedding.", fr: "Une chaîne ne se convertit en vector que si elle contient un tableau JSON de nombres ; convertir une question ne calcule pas d'incorporation." }
    normalize: { en: "VECTOR_NORMALIZE expects a vector, not text, and calls no model.", fr: "VECTOR_NORMALIZE attend un vecteur, pas du texte, et n'appelle aucun modèle." }
    gt: { en: "A cosine distance above the threshold selects the least similar articles.", fr: "Une distance cosinus supérieure au seuil sélectionne les articles les moins similaires." }
    gt7: { en: "Distance is not similarity: a cosine distance above 0.7 selects dissimilar articles.", fr: "La distance n'est pas la similarité : une distance cosinus supérieure à 0,7 sélectionne des articles peu similaires." }
    desc: { en: "Descending order returns the farthest of the selected articles first.", fr: "L'ordre décroissant renvoie d'abord les plus éloignés des articles sélectionnés." }
    id: { en: "Sorting on ArticleID ignores the similarity of the articles.", fr: "Le tri sur ArticleID ignore la similarité des articles." }
references:
  - title: VECTOR_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
