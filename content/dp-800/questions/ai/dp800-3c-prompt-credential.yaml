id: dp800-3c-prompt-credential
objective: "3.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database. The system-assigned managed identity of the logical server has the Cognitive Services OpenAI User role on an Azure OpenAI resource named contoso-ai. Stored procedures call the following two deployments of contoso-ai by using sp_invoke_external_rest_endpoint:

    - https://contoso-ai.openai.azure.com/openai/deployments/chat-model/chat/completions?api-version=2024-10-21
    - https://contoso-ai.openai.azure.com/openai/deployments/embed-model/embeddings?api-version=2024-10-21

    You need to create one database scoped credential that both calls can use. No key or other secret may be stored in the database.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL. L'identité managée affectée par le système du serveur logique possède le rôle Cognitive Services OpenAI User sur une ressource Azure OpenAI nommée contoso-ai. Des procédures stockées appellent les deux déploiements suivants de contoso-ai avec sp_invoke_external_rest_endpoint :

    - https://contoso-ai.openai.azure.com/openai/deployments/chat-model/chat/completions?api-version=2024-10-21
    - https://contoso-ai.openai.azure.com/openai/deployments/embed-model/embeddings?api-version=2024-10-21

    Vous devez créer des informations d'identification délimitées à la base de données que les deux appels peuvent utiliser. Aucune clé ni aucun autre secret ne doit être stocké dans la base de données.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE DATABASE SCOPED CREDENTIAL [[name]]
        WITH IDENTITY = [[identity]],
        SECRET = [[secret]];
  slots:
    - id: name
      options:
        - { id: host, text: "[https://contoso-ai.openai.azure.com]" }
        - { id: chat, text: "[https://contoso-ai.openai.azure.com/openai/deployments/chat-model]" }
        - { id: query, text: "[https://contoso-ai.openai.azure.com/openai/deployments/chat-model/chat/completions?api-version=2024-10-21]" }
        - { id: label, text: "[contoso-ai]" }
    - id: identity
      options:
        - { id: mi, text: "'Managed Identity'" }
        - { id: headers, text: "'HTTPEndpointHeaders'" }
        - { id: qs, text: "'HTTPEndpointQueryString'" }
        - { id: sas, text: "'Shared Access Signature'" }
    - id: secret
      options:
        - { id: cogs, text: '''{"resourceid":"https://cognitiveservices.azure.com"}''' }
        - { id: res, text: '''{"resourceid":"https://contoso-ai.openai.azure.com"}''' }
        - { id: key, text: '''{"api-key":"<key>"}''' }
answer:
  values: { name: host, identity: mi, secret: cogs }
explanation:
  correct:
    en: "The credential name must be a URL with the same scheme and host as the called URL, without a query string, and its path must be equal to or more generic than the called path: the host alone covers both deployments. IDENTITY = 'Managed Identity' sends a token of the server's system-assigned managed identity, so no secret is stored. For Azure OpenAI, the SECRET holds the resourceid https://cognitiveservices.azure.com."
    fr: "Le nom des informations d'identification doit être une URL de même schéma et de même hôte que l'URL appelée, sans chaîne de requête, et son chemin doit être égal au chemin appelé ou plus générique : l'hôte seul couvre les deux déploiements. IDENTITY = 'Managed Identity' envoie un jeton de l'identité managée affectée par le système du serveur : aucun secret n'est stocké. Pour Azure OpenAI, SECRET contient le resourceid https://cognitiveservices.azure.com."
  options:
    chat: { en: "A path that names the chat deployment is more specific than the embeddings URL, so the embeddings call can't use it.", fr: "Un chemin qui nomme le déploiement de conversation est plus spécifique que l'URL des incorporations : l'appel d'incorporations ne peut pas l'utiliser." }
    query: { en: "A credential name must not contain a query string.", fr: "Le nom des informations d'identification ne doit pas contenir de chaîne de requête." }
    label: { en: "The credential name must be a valid URL of an allowed domain.", fr: "Le nom des informations d'identification doit être une URL valide d'un domaine autorisé." }
    headers: { en: "HTTPEndpointHeaders sends the secret as request headers, which means storing the API key in the database.", fr: "HTTPEndpointHeaders envoie le secret dans les en-têtes de la requête, ce qui revient à stocker la clé API dans la base de données." }
    key: { en: "An API key is a secret stored in the database, which the requirements forbid.", fr: "Une clé API est un secret stocké dans la base de données, ce que les exigences interdisent." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
