id: dp800-3a-search-requirements
objective: "3.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware is estimating what each search approach requires in its Azure SQL database.

    What does each approach require? To answer, drag the appropriate requirements to the correct approaches. Each requirement may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware évalue ce que chaque approche de recherche exige dans sa base de données Azure SQL.

    Qu'exige chaque approche ? Pour répondre, faites glisser les exigences appropriées vers les approches correspondantes. Chaque exigence peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ftonly, text: { en: "A full-text index on the text columns", fr: "Un index de recherche en texte intégral sur les colonnes de texte" } }
    - { id: veconly, text: { en: "Embeddings stored in a vector column, and an embedding of each query", fr: "Des incorporations stockées dans une colonne vectorielle, et une incorporation de chaque requête" } }
    - { id: both, text: { en: "A full-text index and stored embeddings, with a step that merges two ranked lists", fr: "Un index de recherche en texte intégral et des incorporations stockées, avec une étape qui fusionne deux listes classées" } }
    - { id: json, text: { en: "A JSON index on the text columns", fr: "Un index JSON sur les colonnes de texte" } }
    - { id: idxonly, text: { en: "A vector index on the text columns, without embeddings", fr: "Un index vectoriel sur les colonnes de texte, sans incorporations" } }
  targets:
    - { id: ft, text: { en: "Full-text search", fr: "Recherche en texte intégral" } }
    - { id: vec, text: { en: "Semantic vector search", fr: "Recherche vectorielle sémantique" } }
    - { id: hyb, text: { en: "Hybrid search", fr: "Recherche hybride" } }
answer:
  mapping: { ft: ftonly, vec: veconly, hyb: both }
explanation:
  correct:
    en: |
      Full-text search needs a full-text index on the text columns. Vector search needs embeddings stored in vector columns, and the query text must be embedded with the same model at search time. Hybrid search runs both searches, so it needs both, and it merges the two ranked lists, for example with reciprocal rank fusion.
    fr: |
      La recherche en texte intégral exige un index de recherche en texte intégral sur les colonnes de texte. La recherche vectorielle exige des incorporations stockées dans des colonnes vectorielles, et le texte de la requête doit être incorporé avec le même modèle au moment de la recherche. La recherche hybride exécute les deux recherches : elle exige les deux, et fusionne les deux listes classées, par exemple par fusion de classement réciproque.
  options:
    json: { en: "A JSON index speeds up queries on JSON paths; it doesn't support word or meaning search.", fr: "Un index JSON accélère les requêtes sur des chemins JSON ; il ne prend en charge ni la recherche de mots ni celle du sens." }
    idxonly: { en: "A vector index is built on a vector column, so it requires stored embeddings.", fr: "Un index vectoriel se crée sur une colonne vectorielle : il exige des incorporations stockées." }
references:
  - title: Choose an intelligent search approach
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach
