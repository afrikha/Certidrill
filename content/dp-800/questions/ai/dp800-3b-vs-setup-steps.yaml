id: dp800-3b-vs-setup-steps
objective: "3.2.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that has a database master key. A table named dbo.Articles has 80,000 rows and an empty column named Embedding of type VECTOR(1536) NULL.

    You plan to generate the embeddings by calling an Azure OpenAI embedding deployment that authenticates with an API key. You need to implement approximate nearest neighbor search on the articles.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL qui possède une clé principale de base de données. Une table nommée dbo.Articles compte 80 000 lignes et une colonne vide nommée Embedding de type VECTOR(1536) NULL.

    Vous prévoyez de générer les incorporations en appelant un déploiement d'incorporation Azure OpenAI qui s'authentifie avec une clé API. Vous devez implémenter la recherche de plus proches voisins approximatifs sur les articles.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: cred, text: { en: "Create a database scoped credential that holds the API key.", fr: "Créer des informations d'identification délimitées à la base de données qui contiennent la clé API." } }
    - { id: model, text: { en: "Create an external model of type EMBEDDINGS that uses the credential.", fr: "Créer un modèle externe de type EMBEDDINGS qui utilise les informations d'identification." } }
    - { id: fill, text: { en: "Update dbo.Articles to set Embedding by using AI_GENERATE_EMBEDDINGS.", fr: "Mettre à jour dbo.Articles pour définir Embedding à l'aide d'AI_GENERATE_EMBEDDINGS." } }
    - { id: index, text: { en: "Create a vector index on Embedding.", fr: "Créer un index vectoriel sur Embedding." } }
    - { id: query, text: { en: "Run a query that uses VECTOR_SEARCH with SELECT TOP (10) WITH APPROXIMATE.", fr: "Exécuter une requête qui utilise VECTOR_SEARCH avec SELECT TOP (10) WITH APPROXIMATE." } }
    - { id: preview, text: { en: "Set the PREVIEW_FEATURES database scoped configuration to ON.", fr: "Définir la configuration étendue à la base de données PREVIEW_FEATURES sur ON." } }
    - { id: catalog, text: { en: "Create a full-text catalog for dbo.Articles.", fr: "Créer un catalogue de texte intégral pour dbo.Articles." } }
answer:
  sequence: [ cred, model, fill, index, query ]
explanation:
  correct:
    en: |
      The external model references the credential that authenticates to the endpoint, so the credential comes first. AI_GENERATE_EMBEDDINGS needs the external model of type EMBEDDINGS to fill the column. A vector index requires at least 100 rows with non-NULL vectors, so you create it after loading the embeddings, and then the approximate query can use it.
    fr: |
      Le modèle externe référence les informations d'identification qui s'authentifient auprès du point de terminaison : elles viennent donc en premier. AI_GENERATE_EMBEDDINGS a besoin du modèle externe de type EMBEDDINGS pour remplir la colonne. Un index vectoriel exige au moins 100 lignes avec des vecteurs non NULL : vous le créez après avoir chargé les incorporations, puis la requête approximative peut l'utiliser.
  options:
    preview: { en: "Vector indexes and VECTOR_SEARCH are generally available in Azure SQL Database; PREVIEW_FEATURES is required on SQL Server 2025.", fr: "Les index vectoriels et VECTOR_SEARCH sont en disponibilité générale dans Azure SQL Database ; PREVIEW_FEATURES est requis sur SQL Server 2025." }
    catalog: { en: "A full-text catalog is used for full-text search, not for vector search.", fr: "Un catalogue de texte intégral sert à la recherche en texte intégral, pas à la recherche vectorielle." }
references:
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
