id: dp800-3c-extract-answer-path
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database. A stored procedure calls an Azure OpenAI chat completions deployment as follows.

    ```sql
    EXECUTE @rc = sp_invoke_external_rest_endpoint
        @url = @url, @method = 'POST', @payload = @payload,
        @credential = [https://woodgrove-ai.openai.azure.com],
        @response = @response OUTPUT;
    ```

    @rc returns 0. You need to assign the text of the model's answer to the variable @answer.

    Which JSON path should you use in JSON_VALUE(@response, path)?
  fr: |
    Vous disposez d'une base de données Azure SQL. Une procédure stockée appelle un déploiement de complétions de conversation Azure OpenAI comme suit.

    ```sql
    EXECUTE @rc = sp_invoke_external_rest_endpoint
        @url = @url, @method = 'POST', @payload = @payload,
        @credential = [https://woodgrove-ai.openai.azure.com],
        @response = @response OUTPUT;
    ```

    @rc renvoie 0. Vous devez affecter le texte de la réponse du modèle à la variable @answer.

    Quel chemin JSON devez-vous utiliser dans JSON_VALUE(@response, chemin) ?
body:
  options:
    - { id: a, text: "'$.choices[0].message.content'" }
    - { id: b, text: "'$.response.choices[0].message.content'" }
    - { id: c, text: "'$.result.choices[0].content'" }
    - { id: d, text: "'$.result.choices[0].message.content'" }
answer: { optionId: d }
explanation:
  correct:
    en: "sp_invoke_external_rest_endpoint wraps the endpoint's reply in an envelope: HTTP metadata under response and the returned body under result. In a chat completions body, the answer is in choices[0].message.content, so the full path is $.result.choices[0].message.content."
    fr: "sp_invoke_external_rest_endpoint enveloppe la réponse du point de terminaison : les métadonnées HTTP sous response et le corps renvoyé sous result. Dans le corps d'une complétion de conversation, la réponse se trouve dans choices[0].message.content : le chemin complet est donc $.result.choices[0].message.content."
  options:
    a: { en: "This path ignores the result envelope added by the procedure, so JSON_VALUE returns NULL.", fr: "Ce chemin ignore l'enveloppe result ajoutée par la procédure : JSON_VALUE renvoie NULL." }
    b: { en: "The response property holds the HTTP status and headers, not the body of the reply.", fr: "La propriété response contient le statut et les en-têtes HTTP, pas le corps de la réponse." }
    c: { en: "content is a property of the message object inside each choice, not of the choice itself.", fr: "content est une propriété de l'objet message de chaque choix, pas du choix lui-même." }
references:
  - title: Generate and process RAG responses
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/5-generate-process-rag-responses
