id: dp800-3c-eval-tools
objective: "3.2.10"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a vector index on a table named dbo.Products. You are evaluating the performance of the vector search queries of an application.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient un index vectoriel sur une table nommée dbo.Products. Vous évaluez les performances des requêtes de recherche vectorielle d'une application.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: plan, text: { en: "The actual execution plan", fr: "Le plan d'exécution réel" } }
    - { id: time, text: SET STATISTICS TIME ON }
    - { id: io, text: SET STATISTICS IO ON }
    - { id: qs, text: { en: "Query Store", fr: "Le Magasin des requêtes (Query Store)" } }
    - { id: vi, text: sys.vector_indexes }
  targets:
    - id: t1
      text: { en: "Check whether a query uses the vector index or scans the table", fr: "Vérifier si une requête utilise l'index vectoriel ou analyse la table" }
    - id: t2
      text: { en: "Compare the CPU time and elapsed time of two versions of a query", fr: "Comparer le temps processeur et le temps écoulé de deux versions d'une requête" }
    - id: t3
      text: { en: "Find out whether the duration of a query has regressed over the last 30 days", fr: "Déterminer si la durée d'une requête s'est dégradée au cours des 30 derniers jours" }
    - id: t4
      text: { en: "Check the version of the vector index", fr: "Vérifier la version de l'index vectoriel" }
answer:
  mapping: { t1: plan, t2: time, t3: qs, t4: vi }
explanation:
  correct:
    en: "The actual execution plan shows the operators used, including a full scan when the index isn't used. SET STATISTICS TIME ON reports CPU and elapsed time for each statement. Query Store keeps runtime statistics over time, which reveals regressions. sys.vector_indexes exposes build_parameters, whose $.Version value is 3 for the latest index version."
    fr: "Le plan d'exécution réel montre les opérateurs utilisés, dont une analyse complète quand l'index n'est pas utilisé. SET STATISTICS TIME ON indique le temps processeur et le temps écoulé de chaque instruction. Le Magasin des requêtes conserve les statistiques d'exécution dans le temps, ce qui révèle les régressions. sys.vector_indexes expose build_parameters, dont la valeur $.Version vaut 3 pour la dernière version de l'index."
  options:
    io: { en: "SET STATISTICS IO ON reports logical and physical reads, not CPU or elapsed time.", fr: "SET STATISTICS IO ON indique les lectures logiques et physiques, pas le temps processeur ni le temps écoulé." }
references:
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
