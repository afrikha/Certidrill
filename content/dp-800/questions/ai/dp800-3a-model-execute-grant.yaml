id: dp800-3a-model-execute-grant
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL database that contains an external model named TicketEmbedder. A database role named app_support is used by a web application that runs queries calling AI_GENERATE_EMBEDDINGS with TicketEmbedder.

    You need to grant app_support the permission it requires. The solution must follow the principle of least privilege.

    Which statement should you run?
  fr: |
    Fabrikam dispose d'une base de données Azure SQL qui contient un modèle externe nommé TicketEmbedder. Un rôle de base de données nommé app_support est utilisé par une application web qui exécute des requêtes appelant AI_GENERATE_EMBEDDINGS avec TicketEmbedder.

    Vous devez accorder à app_support l'autorisation nécessaire. La solution doit respecter le principe du privilège minimum.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "GRANT CREATE EXTERNAL MODEL TO app_support;" }
    - { id: b, text: "GRANT ALTER ANY EXTERNAL MODEL TO app_support;" }
    - { id: c, text: "GRANT EXECUTE ON EXTERNAL MODEL::TicketEmbedder TO app_support;" }
    - { id: d, text: "GRANT ALTER ANY DATABASE SCOPED CREDENTIAL TO app_support;" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Using an external model in an AI function such as AI_GENERATE_EMBEDDINGS requires the EXECUTE permission on that model. Granting it on TicketEmbedder only gives the role exactly what the application needs.
    fr: |
      Utiliser un modèle externe dans une fonction d'IA comme AI_GENERATE_EMBEDDINGS exige l'autorisation EXECUTE sur ce modèle. L'accorder sur TicketEmbedder seulement donne au rôle exactement ce dont l'application a besoin.
  options:
    a: { en: "CREATE EXTERNAL MODEL lets the role create new models; it isn't needed to use an existing one.", fr: "CREATE EXTERNAL MODEL permet au rôle de créer des modèles ; il n'est pas nécessaire pour en utiliser un existant." }
    b: { en: "ALTER ANY EXTERNAL MODEL lets the role change or drop every model, far more than needed.", fr: "ALTER ANY EXTERNAL MODEL permet au rôle de modifier ou de supprimer tous les modèles, bien plus que nécessaire." }
    d: { en: "Managing credentials isn't required to call the model and would let the role change how every endpoint is authenticated.", fr: "Gérer les informations d'identification n'est pas nécessaire pour appeler le modèle et permettrait au rôle de modifier l'authentification de tous les points de terminaison." }
references:
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
