id: dp800-3a-multimodal-model
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure SQL database that stores a photo and a short description for each toy. Many descriptions don't mention the color, shape or material that the photo shows.

    An ingestion application will generate one embedding per photo and store it in the database. Customers will type text queries such as "red wooden train", and the query embedding must be comparable with the photo embeddings. The current model is text-embedding-3-small.

    Which type of model should you recommend for the photo and query embeddings?
  fr: |
    Tailspin Toys dispose d'une base de données Azure SQL qui stocke une photo et une courte description pour chaque jouet. De nombreuses descriptions ne mentionnent pas la couleur, la forme ou la matière visibles sur la photo.

    Une application d'ingestion générera une incorporation par photo et la stockera dans la base de données. Les clients saisiront des requêtes texte telles que « train en bois rouge », et l'incorporation de la requête doit être comparable aux incorporations des photos. Le modèle actuel est text-embedding-3-small.

    Quel type de modèle devez-vous recommander pour les incorporations des photos et des requêtes ?
body:
  options:
    - { id: a, text: { en: "The text-embedding-3-large model with its full 3,072 dimensions", fr: "Le modèle text-embedding-3-large avec ses 3 072 dimensions complètes" } }
    - { id: b, text: { en: "The gpt-4o chat model, which accepts image input", fr: "Le modèle de conversation gpt-4o, qui accepte des images en entrée" } }
    - { id: c, text: { en: "A multimodal embedding model that maps images and text to one vector space", fr: "Un modèle d'incorporation multimodal qui place images et texte dans un même espace vectoriel" } }
    - { id: d, text: { en: "The text-embedding-3-small model applied to the photo file names", fr: "Le modèle text-embedding-3-small appliqué aux noms de fichiers des photos" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Modality is an evaluation criterion: some models process only text, others also accept images. To compare a text query with photos, both must be embedded by the same multimodal embedding model, which places images and text in one vector space. The Microsoft Foundry model catalog lists models by capability, including multimodal input, so you can evaluate one before connecting it to the database workflow.
    fr: |
      La modalité est un critère d'évaluation : certains modèles ne traitent que du texte, d'autres acceptent aussi des images. Pour comparer une requête texte à des photos, les deux doivent être incorporées par le même modèle d'incorporation multimodal, qui place images et texte dans un même espace vectoriel. Le catalogue de modèles Microsoft Foundry répertorie les modèles par capacité, y compris les entrées multimodales, ce qui permet d'en évaluer un avant de le relier au flux de travail de la base de données.
  options:
    a: { en: "text-embedding-3-large is a text-only model: more dimensions don't let it read images.", fr: "text-embedding-3-large ne traite que du texte : plus de dimensions ne lui permettent pas de lire des images." }
    b: { en: "gpt-4o accepts images to generate text, but it is not an embedding model and returns no vectors.", fr: "gpt-4o accepte des images pour générer du texte, mais ce n'est pas un modèle d'incorporation et il ne retourne pas de vecteurs." }
    d: { en: "File names carry no information about what the photo shows, so the color, shape and material are still missing.", fr: "Les noms de fichiers ne disent rien du contenu de la photo : la couleur, la forme et la matière restent absentes." }
references:
  - title: Understand and evaluate models for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/02-understand-evaluate-models-sql-database-workloads
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
