id: dp800-3c-rag-no-generation
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Realty stores property listings in an Azure SQL database. The Listings table has a DescriptionVector column with a vector index. The application already generates the embedding of the text that a user types by using AI_GENERATE_EMBEDDINGS.

    You need to display the 20 listings whose descriptions are closest in meaning to the text, as rows with the ID, title and price. No generated text is required. The solution must minimize cost and latency.

    What should you recommend?
  fr: |
    Wingtip Realty stocke des annonces immobilières dans une base de données Azure SQL. La table Listings possède une colonne DescriptionVector dotée d'un index vectoriel. L'application génère déjà l'incorporation du texte saisi par un utilisateur avec AI_GENERATE_EMBEDDINGS.

    Vous devez afficher les 20 annonces dont la description est la plus proche du texte par le sens, sous forme de lignes avec l'ID, le titre et le prix. Aucun texte généré n'est nécessaire. La solution doit réduire au minimum le coût et la latence.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A VECTOR_SEARCH query that returns the 20 closest listings", fr: "Une requête VECTOR_SEARCH qui renvoie les 20 annonces les plus proches" } }
    - { id: b, text: { en: "A RAG procedure that asks a chat model to list 20 listings", fr: "Une procédure RAG qui demande à un modèle de conversation de lister 20 annonces" } }
    - { id: c, text: { en: "A chat model fine-tuned on the descriptions of the listings", fr: "Un modèle de conversation ajusté par réglage précis sur les descriptions des annonces" } }
    - { id: d, text: { en: "A chat completion call that receives the whole table as JSON", fr: "Un appel de complétion de conversation qui reçoit toute la table en JSON" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The requirement is a list of matching rows, not a generated answer, so a vector search is enough. VECTOR_SEARCH with SELECT TOP (20) WITH APPROXIMATE uses the vector index and returns the rows directly, with no call to a chat model."
    fr: "L'exigence est une liste de lignes correspondantes, pas une réponse générée : une recherche vectorielle suffit. VECTOR_SEARCH avec SELECT TOP (20) WITH APPROXIMATE utilise l'index vectoriel et renvoie directement les lignes, sans appel à un modèle de conversation."
  options:
    b: { en: "RAG adds a chat model call, with its cost and latency, to produce text that isn't needed.", fr: "RAG ajoute un appel à un modèle de conversation, avec son coût et sa latence, pour produire un texte inutile." }
    c: { en: "Fine-tuning changes a model's behavior; it doesn't return rows from the database and adds training cost.", fr: "Le fine-tuning modifie le comportement d'un modèle ; il ne renvoie pas de lignes de la base de données et ajoute un coût d'entraînement." }
    d: { en: "Sending the whole table costs many tokens, can exceed the context window and is slower than a database search.", fr: "Envoyer toute la table coûte beaucoup de jetons, peut dépasser la fenêtre de contexte et est plus lent qu'une recherche dans la base de données." }
references:
  - title: Vector search and vector indexes in the SQL Database Engine
    url: https://learn.microsoft.com/en-us/sql/sql-server/ai/vectors
  - title: Identify RAG use cases and architecture
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/2-identify-rag-use-cases-architecture
