id: dp800-3a-maintenance-methods
objective: "3.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys stores embeddings in several Azure SQL databases. Four teams describe how the embeddings of their tables must be kept up to date.

    Which method should each team use? To answer, drag the appropriate methods to the correct requirements. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys stocke des incorporations dans plusieurs bases de données Azure SQL. Quatre équipes décrivent comment les incorporations de leurs tables doivent être maintenues à jour.

    Quelle méthode chaque équipe doit-elle utiliser ? Pour répondre, faites glisser les méthodes appropriées vers les exigences correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: trigger, text: { en: "Table trigger", fr: "Déclencheur sur la table" } }
    - { id: ct, text: { en: "Change Tracking with a scheduled job", fr: "Suivi des modifications avec un travail planifié" } }
    - { id: func, text: { en: "Azure Functions with the SQL trigger binding", fr: "Azure Functions avec la liaison de déclencheur SQL" } }
    - { id: logic, text: { en: "Azure Logic Apps", fr: "Azure Logic Apps" } }
    - { id: foundry, text: { en: "Microsoft Foundry", fr: "Microsoft Foundry" } }
    - { id: cdc, text: { en: "Change data capture (CDC)", fr: "Capture des données modifiées (CDC)" } }
  targets:
    - { id: t1, text: { en: "A low-code workflow re-embeds the changed rows and then posts a message to a Microsoft Teams channel", fr: "Un flux de travail low-code réincorpore les lignes modifiées, puis publie un message dans un canal Microsoft Teams" } }
    - { id: t2, text: { en: "C# code outside the database engine generates the embeddings and scales independently of the database", fr: "Du code C# hors du moteur de base de données génère les incorporations et se met à l'échelle indépendamment de la base" } }
    - { id: t3, text: { en: "The embedding is refreshed as part of the same transaction as the write; writes are rare", fr: "L'incorporation est actualisée dans la même transaction que l'écriture ; les écritures sont rares" } }
    - { id: t4, text: { en: "One central place to select, evaluate and host the embedding model used by all the databases", fr: "Un emplacement central pour sélectionner, évaluer et héberger le modèle d'incorporation utilisé par toutes les bases" } }
answer:
  mapping: { t1: logic, t2: func, t3: trigger, t4: foundry }
explanation:
  correct:
    en: |
      Logic Apps orchestrates low-code workflows that integrate other services such as Teams. Azure Functions with the SQL trigger binding offloads generation from the database engine and scales independently. A table trigger reflects changes immediately inside the write, which is acceptable when writes are rare. Microsoft Foundry centralizes model selection, evaluation and hosting, but it doesn't detect changes: another method must still do that.
    fr: |
      Logic Apps orchestre des flux de travail low-code intégrés à d'autres services comme Teams. Azure Functions avec la liaison de déclencheur SQL décharge la génération du moteur de base de données et se met à l'échelle indépendamment. Un déclencheur sur la table reflète les modifications immédiatement dans l'écriture, ce qui est acceptable quand les écritures sont rares. Microsoft Foundry centralise la sélection, l'évaluation et l'hébergement des modèles, mais ne détecte pas les modifications : une autre méthode doit s'en charger.
  options:
    ct: { en: "A Change Tracking job processes changes in batches after the commit, not inside the write transaction.", fr: "Un travail de suivi des modifications traite les modifications par lots après la validation, pas dans la transaction d'écriture." }
    cdc: { en: "CDC captures changes asynchronously from the log; it isn't a low-code workflow or a model catalog.", fr: "CDC capture les modifications de façon asynchrone à partir du journal ; ce n'est ni un flux de travail low-code ni un catalogue de modèles." }
references:
  - title: Generate and maintain embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/05-generate-maintain-embeddings-sql-database-workloads
