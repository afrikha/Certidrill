id: dp800-cs3b-transcript-chunks
objective: "3.1.5"
type: single
caseStudy: dp800-cs3b-proseware
difficulty: 3
status: draft
stem:
  en: |
    You need to load dbo.LessonChunks. You start writing the following statement.

    ```sql
    INSERT INTO dbo.LessonChunks (LessonId, ChunkNo, ChunkText)
    SELECT l.LessonId, ..., c.chunk
    FROM dbo.Lessons AS l
    CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, ...) AS c;
    ```

    The solution must meet the course assistant requirements. Which column and arguments should you use?
  fr: |
    Vous devez charger dbo.LessonChunks. Vous commencez à écrire l'instruction suivante.

    ```sql
    INSERT INTO dbo.LessonChunks (LessonId, ChunkNo, ChunkText)
    SELECT l.LessonId, ..., c.chunk
    FROM dbo.Lessons AS l
    CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, ...) AS c;
    ```

    La solution doit satisfaire les exigences de l'assistant de cours. Quelle colonne et quels arguments devez-vous utiliser ?
body:
  options:
    - id: a
      text: "c.chunk_order, with CHUNK_SIZE = 1000, OVERLAP = 150"
    - id: b
      text: "c.chunk_offset, with CHUNK_SIZE = 1000, OVERLAP = 15"
    - id: c
      text: "c.chunk_order, with CHUNK_SIZE = 1000, OVERLAP = 15"
    - id: d
      text: "c.chunk_set_id, with CHUNK_SIZE = 1000, OVERLAP = 15, ENABLE_CHUNK_SET_ID = 1"
answer: { optionId: c }
explanation:
  correct:
    en: CHUNK_SIZE is a number of characters, and OVERLAP is a percentage of CHUNK_SIZE from 0 to 50, so 15 percent of 1,000 characters gives the required overlap of 150 characters. The chunk_order column numbers the chunks of each source value 1, 2, 3 and so on, which matches ChunkNo. CROSS APPLY calls the function once for each lesson, so the numbering starts again at 1 for every lesson.
    fr: |
      CHUNK_SIZE est un nombre de caractères, et OVERLAP est un pourcentage de CHUNK_SIZE compris entre 0 et 50 : 15 % de 1 000 caractères donnent le chevauchement exigé de 150 caractères. La colonne chunk_order numérote les blocs de chaque valeur source 1, 2, 3, et ainsi de suite, ce qui correspond à ChunkNo. CROSS APPLY appelle la fonction une fois par leçon : la numérotation repart donc de 1 pour chaque leçon.
  options:
    a: { en: "OVERLAP is a percentage that must be a whole number from 0 to 50, so a value of 150 is rejected.", fr: "OVERLAP est un pourcentage qui doit être un nombre entier compris entre 0 et 50 : la valeur 150 est rejetée." }
    b: { en: "chunk_offset is the position of the chunk in the source text, not its sequence number.", fr: "chunk_offset est la position du bloc dans le texte source, pas son numéro d'ordre." }
    d: { en: "chunk_set_id has one value for all the chunks of a source row, so it doesn't number the chunks of a lesson.", fr: "chunk_set_id a une seule valeur pour tous les blocs d'une ligne source : il ne numérote pas les blocs d'une leçon." }
references:
  - title: AI_GENERATE_CHUNKS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
