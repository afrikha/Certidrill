id: dp800-3b-fn-match
objective: "3.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are building a semantic search feature in an Azure SQL database. Embeddings are stored in a VECTOR(1536) column that has a vector index.

    Which function should you use for each requirement? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une fonctionnalité de recherche sémantique dans une base de données Azure SQL. Les incorporations sont stockées dans une colonne VECTOR(1536) qui possède un index vectoriel.

    Quelle fonction devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: search, text: VECTOR_SEARCH }
    - { id: distance, text: VECTOR_DISTANCE }
    - { id: normalize, text: VECTOR_NORMALIZE }
    - { id: property, text: VECTORPROPERTY }
    - { id: norm, text: VECTOR_NORM }
    - { id: embed, text: AI_GENERATE_EMBEDDINGS }
  targets:
    - { id: t1, text: { en: "Return the 10 nearest rows by using the vector index", fr: "Renvoyer les 10 lignes les plus proches à l'aide de l'index vectoriel" } }
    - { id: t2, text: { en: "Compute the exact cosine distance between a query vector and each row", fr: "Calculer la distance cosinus exacte entre un vecteur de requête et chaque ligne" } }
    - { id: t3, text: { en: "Rescale the vectors of a model that doesn't return unit-length vectors", fr: "Remettre à l'échelle les vecteurs d'un modèle qui ne renvoie pas de vecteurs de longueur unitaire" } }
    - { id: t4, text: { en: "Check how many dimensions a stored vector has", fr: "Vérifier combien de dimensions possède un vecteur stocké" } }
answer:
  mapping: { t1: search, t2: distance, t3: normalize, t4: property }
explanation:
  correct:
    en: |-
      VECTOR_SEARCH performs an approximate nearest neighbor search and uses a vector index with the same metric. VECTOR_DISTANCE always computes an exact distance and never uses an index. VECTOR_NORMALIZE returns a vector with the same direction and a length of 1. VECTORPROPERTY with 'Dimensions' returns the number of dimensions of a vector.
    fr: |-
      VECTOR_SEARCH effectue une recherche de plus proches voisins approximatifs et utilise un index vectoriel de même métrique. VECTOR_DISTANCE calcule toujours une distance exacte et n'utilise jamais d'index. VECTOR_NORMALIZE renvoie un vecteur de même direction et de longueur 1. VECTORPROPERTY avec 'Dimensions' renvoie le nombre de dimensions d'un vecteur.
  options:
    norm: { en: "VECTOR_NORM returns the length of a vector as a float; it does not rescale the vector.", fr: "VECTOR_NORM renvoie la longueur d'un vecteur sous forme de float ; elle ne remet pas le vecteur à l'échelle." }
    embed: { en: "AI_GENERATE_EMBEDDINGS turns text into an embedding by calling an external model; it does not search or inspect vectors.", fr: "AI_GENERATE_EMBEDDINGS transforme un texte en incorporation en appelant un modèle externe ; elle ne recherche ni n'inspecte de vecteurs." }
references:
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
  - title: VECTOR_NORMALIZE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-normalize-transact-sql
