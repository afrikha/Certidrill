id: dp800-3b-vec-chunk-table
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Products. The table has 35 columns and serves OLTP queries that read entire rows.

    You plan to split the Description of each product into up to eight chunks and to store a VECTOR(1536) embedding for each chunk. When you change the embedding model, you must be able to regenerate all the embeddings without rewriting the rows of dbo.Products.

    You need to design the storage of the embeddings.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Products. La table comporte 35 colonnes et sert des requêtes OLTP qui lisent des lignes entières.

    Vous prévoyez de découper la description de chaque produit en huit blocs au plus et de stocker une incorporation VECTOR(1536) pour chaque bloc. Lorsque vous changez de modèle d'incorporation, vous devez pouvoir régénérer toutes les incorporations sans réécrire les lignes de dbo.Products.

    Vous devez concevoir le stockage des incorporations.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add eight VECTOR(1536) columns, named Embedding1 to Embedding8, to dbo.Products.", fr: "Ajouter à dbo.Products huit colonnes VECTOR(1536), nommées Embedding1 à Embedding8." } }
    - { id: b, text: { en: "Add a json column to dbo.Products that stores an array of the eight chunk embeddings.", fr: "Ajouter à dbo.Products une colonne json qui stocke un tableau des huit incorporations de blocs." } }
    - { id: c, text: { en: "Create a table that has ProductID, ChunkNo, ChunkText and a VECTOR(1536) column, with one row per chunk.", fr: "Créer une table qui contient ProductID, ChunkNo, ChunkText et une colonne VECTOR(1536), avec une ligne par bloc." } }
    - { id: d, text: { en: "Add a VECTOR(12288) column to dbo.Products that concatenates the eight chunk embeddings.", fr: "Ajouter à dbo.Products une colonne VECTOR(12288) qui concatène les huit incorporations de blocs." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A dedicated embeddings table with one row per chunk keeps the large vectors out of the rows that OLTP queries read, and it lets you delete and regenerate embeddings without touching dbo.Products. A single vector column also lets one vector index and one VECTOR_SEARCH call cover every chunk.
    fr: |-
      Une table d'incorporations dédiée, avec une ligne par bloc, tient les grands vecteurs à l'écart des lignes lues par les requêtes OLTP, et permet de supprimer et de régénérer les incorporations sans toucher à dbo.Products. Une seule colonne vectorielle permet aussi à un seul index vectoriel et à un seul appel VECTOR_SEARCH de couvrir tous les blocs.
  options:
    a: { en: "Eight columns widen every product row, force eight separate searches, and regenerating them rewrites dbo.Products.", fr: "Huit colonnes élargissent chaque ligne de produit, imposent huit recherches distinctes, et leur régénération réécrit dbo.Products." }
    b: { en: "A json column cannot be indexed with CREATE VECTOR INDEX, and regenerating it still rewrites the product rows.", fr: "Une colonne json ne peut pas être indexée avec CREATE VECTOR INDEX, et sa régénération réécrit toujours les lignes de produits." }
    d: { en: "The float32 vector type is limited to 1,998 dimensions, and a concatenated vector has no meaning for similarity search.", fr: "Le type vector float32 est limité à 1 998 dimensions, et un vecteur concaténé n'a aucun sens pour une recherche de similarité." }
references:
