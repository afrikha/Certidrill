id: dp800-3c-prompt-enable-proc
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an on-premises SQL Server 2025 instance that hosts a database named SalesDb. A stored procedure in SalesDb must call an Azure OpenAI deployment by using sp_invoke_external_rest_endpoint. When you test the procedure, the call fails because the feature is disabled.

    You need to enable the feature.

    Which statement should you run?
  fr: |
    Vous disposez d'une instance SQL Server 2025 locale qui héberge une base de données nommée SalesDb. Une procédure stockée de SalesDb doit appeler un déploiement Azure OpenAI avec sp_invoke_external_rest_endpoint. Lorsque vous testez la procédure, l'appel échoue, car la fonctionnalité est désactivée.

    Vous devez activer la fonctionnalité.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;" }
    - { id: b, text: "EXECUTE sp_configure 'external scripts enabled', 1; RECONFIGURE;" }
    - { id: c, text: "EXECUTE sp_configure 'clr enabled', 1; RECONFIGURE;" }
    - { id: d, text: "EXECUTE sp_configure 'external rest endpoint enabled', 1; RECONFIGURE WITH OVERRIDE;" }
answer: { optionId: d }
explanation:
  correct:
    en: "sp_invoke_external_rest_endpoint is disabled by default in SQL Server 2025 and in Azure SQL Managed Instance. You enable it with the server configuration option external rest endpoint enabled, which requires the ALTER SETTINGS permission. It is enabled by default in Azure SQL Database and in SQL database in Microsoft Fabric."
    fr: "sp_invoke_external_rest_endpoint est désactivée par défaut dans SQL Server 2025 et dans Azure SQL Managed Instance. Vous l'activez avec l'option de configuration de serveur external rest endpoint enabled, qui requiert l'autorisation ALTER SETTINGS. Elle est activée par défaut dans Azure SQL Database et dans SQL Database dans Microsoft Fabric."
  options:
    a: { en: "PREVIEW_FEATURES enables preview features of a database, such as vector indexes in SQL Server 2025; it doesn't enable outbound REST calls.", fr: "PREVIEW_FEATURES active les fonctionnalités en préversion d'une base de données, comme les index vectoriels dans SQL Server 2025 ; elle n'active pas les appels REST sortants." }
    b: { en: "external scripts enabled allows Machine Learning Services scripts (sp_execute_external_script), not REST endpoint calls.", fr: "external scripts enabled autorise les scripts Machine Learning Services (sp_execute_external_script), pas les appels de points de terminaison REST." }
    c: { en: "clr enabled allows CLR assemblies, which isn't how sp_invoke_external_rest_endpoint is enabled.", fr: "clr enabled autorise les assemblys CLR, ce qui n'est pas la façon d'activer sp_invoke_external_rest_endpoint." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
