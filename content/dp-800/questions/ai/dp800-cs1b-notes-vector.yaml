id: dp800-cs1b-notes-vector
objective: "3.2.3"
type: yesno_statements
caseStudy: dp800-cs1b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You are designing the vector column of dbo.CustomsNoteChunks. The solution must meet the customs notes requirements.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez la colonne vector de dbo.CustomsNoteChunks. La solution doit respecter les exigences relatives aux notes douanières.

    Pour chacune des affirmations suivantes, sélectionnez Oui si elle est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "You can store the embeddings at their default size in a column defined as vector(3072).", fr: "Vous pouvez stocker les incorporations à leur taille par défaut dans une colonne définie comme vector(3072)." } }
    - { id: s2, text: { en: "You can store the embeddings at their default size in a column defined as vector(3072, float16).", fr: "Vous pouvez stocker les incorporations à leur taille par défaut dans une colonne définie comme vector(3072, float16)." } }
    - { id: s3, text: { en: "If the external model sets PARAMETERS = '{\"dimensions\": 1536}', you can store the embeddings in a column defined as vector(1536).", fr: "Si le modèle externe définit PARAMETERS = '{\"dimensions\": 1536}', vous pouvez stocker les incorporations dans une colonne définie comme vector(1536)." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The default base type of vector is float32, which allows up to 1,998 dimensions, so vector(3072) cannot be created. The half-precision float16 base type, generally available in Azure SQL Database, allows up to 3,996 dimensions, with reduced storage and precision. The PARAMETERS JSON of an external model is appended to each request, so {"dimensions": 1536} asks the model for 1,536-dimension embeddings, which fit a float32 vector(1536) column.
    fr: |
      Le type de base par défaut de vector est float32, qui autorise jusqu'à 1 998 dimensions : vector(3072) ne peut donc pas être créé. Le type de base demi-précision float16, en disponibilité générale dans Azure SQL Database, autorise jusqu'à 3 996 dimensions, avec un stockage et une précision réduits. Le JSON PARAMETERS d'un modèle externe est ajouté à chaque requête : {"dimensions": 1536} demande au modèle des incorporations de 1 536 dimensions, qui tiennent dans une colonne float32 vector(1536).
  options:
    s1: { en: "With the default float32 base type, a vector column has at most 1,998 dimensions.", fr: "Avec le type de base float32 par défaut, une colonne vector a au plus 1 998 dimensions." }
references:
  - title: Vector data type
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
