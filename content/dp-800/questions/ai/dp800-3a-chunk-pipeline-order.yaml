id: dp800-3a-chunk-pipeline-order
objective: "3.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL database at compatibility level 170 that contains 40,000 contracts in dbo.Contracts. Each contract has a Body column of up to 300,000 characters. An external model named EmbedModel returns 1,536 dimensions.

    You need to implement approximate vector search over chunks of the contracts. Each chunk must keep the key of its contract.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'une base de données Azure SQL au niveau de compatibilité 170 qui contient 40 000 contrats dans dbo.Contracts. Chaque contrat a une colonne Body pouvant atteindre 300 000 caractères. Un modèle externe nommé EmbedModel retourne 1 536 dimensions.

    Vous devez implémenter une recherche vectorielle approximative sur des blocs des contrats. Chaque bloc doit conserver la clé de son contrat.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: table, text: { en: "Create dbo.ContractChunks with ContractID, ChunkOrder, ChunkText and a VECTOR(1536) column.", fr: "Créer dbo.ContractChunks avec ContractID, ChunkOrder, ChunkText et une colonne VECTOR(1536)." } }
    - { id: insert, text: { en: "Insert the rows returned by AI_GENERATE_CHUNKS, with AI_GENERATE_EMBEDDINGS for each chunk.", fr: "Insérer les lignes retournées par AI_GENERATE_CHUNKS, avec AI_GENERATE_EMBEDDINGS pour chaque bloc." } }
    - { id: index, text: { en: "Create a vector index on the vector column of dbo.ContractChunks.", fr: "Créer un index vectoriel sur la colonne vectorielle de dbo.ContractChunks." } }
    - { id: whole, text: { en: "Generate one embedding from the full Body of each contract.", fr: "Générer une incorporation à partir du Body complet de chaque contrat." } }
    - { id: ftidx, text: { en: "Create a full-text index on dbo.Contracts.Body.", fr: "Créer un index de recherche en texte intégral sur dbo.Contracts.Body." } }
    - { id: viewidx, text: { en: "Create a view over the chunks, and then create a vector index on the view.", fr: "Créer une vue sur les blocs, puis créer un index vectoriel sur la vue." } }
answer:
  sequence: [ table, insert, index ]
explanation:
  correct:
    en: |
      Contracts of up to 300,000 characters must be chunked before embedding, and the chunk table keeps the parent key and the order of each chunk. You fill it with the rows of AI_GENERATE_CHUNKS and their embeddings, and only then create the vector index: CREATE VECTOR INDEX fails (Msg 42266) unless the table has at least 100 rows with a non-NULL vector.
    fr: |
      Des contrats pouvant atteindre 300 000 caractères doivent être découpés avant l'incorporation, et la table de blocs conserve la clé parente et l'ordre de chaque bloc. Vous la remplissez avec les lignes d'AI_GENERATE_CHUNKS et leurs incorporations, puis seulement ensuite vous créez l'index vectoriel : CREATE VECTOR INDEX échoue (Msg 42266) si la table n'a pas au moins 100 lignes avec un vecteur non NULL.
  options:
    whole: { en: "A full contract exceeds the model's input token limit, and one vector for 300,000 characters loses semantic focus.", fr: "Un contrat complet dépasse la limite de jetons d'entrée du modèle, et un seul vecteur pour 300 000 caractères perd sa focalisation sémantique." }
    ftidx: { en: "A full-text index supports keyword search, not approximate vector search.", fr: "Un index de recherche en texte intégral prend en charge la recherche par mots-clés, pas la recherche vectorielle approximative." }
    viewidx: { en: "A vector index can only be created on a base table, not on a view.", fr: "Un index vectoriel ne peut être créé que sur une table de base, pas sur une vue." }
references:
  - title: AI_GENERATE_CHUNKS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
