id: dp800-3c-prompt-permissions
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named SalesDb. The database scoped credential [https://fabrikam-ai.openai.azure.com] uses the managed identity of the server.

    A database user named app_rag runs batches that call sp_invoke_external_rest_endpoint directly with @credential = [https://fabrikam-ai.openai.azure.com]. The calls fail with a permission error.

    You need to grant app_rag the required permissions. The solution must follow the principle of least privilege.

    Which two statements should you run? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée SalesDb. Les informations d'identification délimitées à la base de données [https://fabrikam-ai.openai.azure.com] utilisent l'identité managée du serveur.

    Un utilisateur de base de données nommé app_rag exécute des lots qui appellent directement sp_invoke_external_rest_endpoint avec @credential = [https://fabrikam-ai.openai.azure.com]. Les appels échouent avec une erreur d'autorisation.

    Vous devez accorder à app_rag les autorisations nécessaires. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux instructions à exécuter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "GRANT ALTER ANY DATABASE SCOPED CREDENTIAL TO app_rag;" }
    - { id: b, text: "GRANT EXECUTE ANY EXTERNAL ENDPOINT TO app_rag;" }
    - { id: c, text: "GRANT CONTROL ON DATABASE::SalesDb TO app_rag;" }
    - { id: d, text: "GRANT REFERENCES ON DATABASE SCOPED CREDENTIAL::[https://fabrikam-ai.openai.azure.com] TO app_rag;" }
    - { id: e, text: "ALTER ROLE db_owner ADD MEMBER app_rag;" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Running sp_invoke_external_rest_endpoint requires the EXECUTE ANY EXTERNAL ENDPOINT database permission. Using a database scoped credential in the call also requires the REFERENCES permission on that credential."
    fr: "Exécuter sp_invoke_external_rest_endpoint requiert l'autorisation de base de données EXECUTE ANY EXTERNAL ENDPOINT. Utiliser des informations d'identification délimitées à la base de données dans l'appel requiert en plus l'autorisation REFERENCES sur ces informations d'identification."
  options:
    a: { en: "ALTER ANY DATABASE SCOPED CREDENTIAL lets the user create and change credentials, which is more than using one and doesn't allow the call.", fr: "ALTER ANY DATABASE SCOPED CREDENTIAL permet de créer et modifier des informations d'identification, ce qui dépasse leur utilisation et n'autorise pas l'appel." }
    c: { en: "CONTROL on the database grants every permission in the database, far beyond least privilege.", fr: "CONTROL sur la base de données accorde toutes les autorisations de la base de données, bien au-delà du moindre privilège." }
    e: { en: "db_owner can do anything in the database, which violates least privilege.", fr: "db_owner peut tout faire dans la base de données, ce qui viole le moindre privilège." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
