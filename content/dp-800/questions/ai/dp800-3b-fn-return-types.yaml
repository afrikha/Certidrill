id: dp800-3b-fn-return-types
objective: "3.2.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database. The variables @a and @b are of type VECTOR(768). The following table lists expressions that you can use in your semantic search code.

    Answer each prompt by selecting the expression that meets the requirement.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL. Les variables @a et @b sont de type VECTOR(768). Le tableau suivant répertorie des expressions que vous pouvez utiliser dans votre code de recherche sémantique.

    Répondez à chaque consigne en sélectionnant l'expression qui satisfait l'exigence.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The result can be stored directly in a VECTOR(768) column.", fr: "Le résultat peut être stocké directement dans une colonne VECTOR(768)." }
    - id: p2
      text: { en: "The result shows whether @a already has a Euclidean length of 1.", fr: "Le résultat indique si @a a déjà une longueur euclidienne de 1." }
  grid:
    header: ["#", { en: "Expression", fr: "Expression" }]
    rows:
      - [{ text: "1" }, { text: "VECTOR_DISTANCE('cosine', @a, @b)", area: e1 }]
      - [{ text: "2" }, { text: "VECTOR_NORM(@a, 'norm2')", area: e2 }]
      - [{ text: "3" }, { text: "VECTOR_NORMALIZE(@a, 'norm2')", area: e3 }]
      - [{ text: "4" }, { text: "VECTORPROPERTY(@a, 'Dimensions')", area: e4 }]
      - [{ text: "5" }, { text: "VECTORPROPERTY(@a, 'BaseType')", area: e5 }]
answer:
  values: { p1: e3, p2: e2 }
explanation:
  correct:
    en: |-
      VECTOR_NORMALIZE is the only expression in the list that returns a vector, with the same direction as @a and a length of 1, so its result can be stored in a VECTOR(768) column. VECTOR_NORM with norm2 returns the Euclidean length of @a as a float; a result of 1 means the vector is already normalized. VECTOR_DISTANCE returns a float distance, and VECTORPROPERTY returns an integer (Dimensions) or a sysname (BaseType).
    fr: |-
      VECTOR_NORMALIZE est la seule expression de la liste qui renvoie un vecteur, de même direction que @a et de longueur 1 : son résultat peut donc être stocké dans une colonne VECTOR(768). VECTOR_NORM avec norm2 renvoie la longueur euclidienne de @a sous forme de float ; un résultat de 1 signifie que le vecteur est déjà normalisé. VECTOR_DISTANCE renvoie une distance float, et VECTORPROPERTY renvoie un entier (Dimensions) ou un sysname (BaseType).
references:
  - title: VECTOR_NORM (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-norm-transact-sql
  - title: VECTOR_NORMALIZE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-normalize-transact-sql
