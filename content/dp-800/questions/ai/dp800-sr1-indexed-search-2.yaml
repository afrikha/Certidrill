stem:
  en: You sort the rows by VECTOR_DISTANCE and keep the first 10.
  fr: Vous triez les lignes par VECTOR_DISTANCE et conservez les 10 premières.
body:
  solution:
    en: |
      You write the following query:

      ```sql
      SELECT TOP (10)
          e.ProductID,
          VECTOR_DISTANCE('cosine', @q, e.Embedding) AS distance
      FROM dbo.ProductEmbeddings AS e
      ORDER BY distance;
      ```
    fr: |
      Vous écrivez la requête suivante :

      ```sql
      SELECT TOP (10)
          e.ProductID,
          VECTOR_DISTANCE('cosine', @q, e.Embedding) AS distance
      FROM dbo.ProductEmbeddings AS e
      ORDER BY distance;
      ```
answer: { value: false }
explanation:
  correct:
    en: VECTOR_DISTANCE always computes exact distances and never uses a vector index, even when one exists on the column. This query compares @q with all 8 million vectors before sorting them. To search through the vector index, the query must use VECTOR_SEARCH.
    fr: "VECTOR_DISTANCE calcule toujours des distances exactes et n'utilise jamais d'index vectoriel, même lorsqu'il en existe un sur la colonne. Cette requête compare @q aux 8 millions de vecteurs avant de les trier. Pour effectuer la recherche au moyen de l'index vectoriel, la requête doit utiliser VECTOR_SEARCH."
references:
  - title: VECTOR_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
