id: dp800-3b-idx-diskann
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are evaluating approximate nearest neighbor search for an Azure SQL database that will store 40 million embeddings. Before you write the CREATE VECTOR INDEX statements, you review the index types that the SQL Database Engine supports.

    Which statement describes the vector index type that you can create?
  fr: |
    Vous évaluez la recherche de plus proches voisins approximatifs pour une base de données Azure SQL qui stockera 40 millions d'incorporations. Avant d'écrire les instructions CREATE VECTOR INDEX, vous examinez les types d'index que prend en charge le moteur de base de données SQL.

    Quelle affirmation décrit le type d'index vectoriel que vous pouvez créer ?
body:
  options:
    - { id: a, text: { en: "HNSW, a graph-based index that must fit in memory; it is the default TYPE value.", fr: "HNSW, un index fondé sur un graphe qui doit tenir en mémoire ; c'est la valeur TYPE par défaut." } }
    - { id: b, text: { en: "IVF, a clustering index that you must train on a sample of vectors before you create it.", fr: "IVF, un index de partitionnement en clusters que vous devez entraîner sur un échantillon de vecteurs avant de le créer." } }
    - { id: c, text: { en: "A B-tree index on the vector elements that you create with CREATE NONCLUSTERED INDEX.", fr: "Un index B-tree sur les éléments du vecteur que vous créez avec CREATE NONCLUSTERED INDEX." } }
    - { id: d, text: { en: "DiskANN, a graph-based index that works from SSD with little memory; it is the only supported TYPE value.", fr: "DiskANN, un index fondé sur un graphe qui fonctionne depuis un SSD avec peu de mémoire ; c'est la seule valeur TYPE prise en charge." } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Vector indexes in the SQL Database Engine are based on the DiskANN algorithm, which builds a graph to navigate quickly to the closest vectors. DiskANN uses SSDs and little memory to handle more data than in-memory indexes while keeping high throughput and low latency. DiskANN is the default and currently the only TYPE value.
    fr: |-
      Les index vectoriels du moteur de base de données SQL reposent sur l'algorithme DiskANN, qui construit un graphe pour atteindre rapidement les vecteurs les plus proches. DiskANN utilise des SSD et peu de mémoire pour gérer plus de données que des index en mémoire, tout en conservant un débit élevé et une faible latence. DiskANN est la valeur TYPE par défaut et actuellement la seule.
  options:
    a: { en: "HNSW is not a TYPE value of CREATE VECTOR INDEX; only DiskANN is supported.", fr: "HNSW n'est pas une valeur TYPE de CREATE VECTOR INDEX ; seul DiskANN est pris en charge." }
    b: { en: "IVF is not a TYPE value of CREATE VECTOR INDEX, and the statement has no training step.", fr: "IVF n'est pas une valeur TYPE de CREATE VECTOR INDEX, et l'instruction ne comporte aucune étape d'entraînement." }
    c: { en: "B-tree indexes are not supported on vector columns.", fr: "Les index B-tree ne sont pas pris en charge sur les colonnes vectorielles." }
references:
  - title: Vector search and vector indexes in the SQL Database Engine
    url: https://learn.microsoft.com/en-us/sql/sql-server/ai/vectors
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
