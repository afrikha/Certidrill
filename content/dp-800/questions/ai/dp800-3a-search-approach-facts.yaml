id: dp800-3a-search-approach-facts
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure SQL database that stores cycling products. The Description column has a full-text index, and the dbo.ProductEmbeddings table stores an embedding of each description.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une base de données Azure SQL qui stocke des produits de cyclisme. La colonne Description possède un index de recherche en texte intégral, et la table dbo.ProductEmbeddings stocke une incorporation de chaque description.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A vector search can return a product whose description shares no word with the query.
        fr: Une recherche vectorielle peut renvoyer un produit dont la description n'a aucun mot commun avec la requête.
    - id: s2
      text:
        en: A full-text search with FORMSOF(INFLECTIONAL, ride) can match a description that contains "riding".
        fr: Une recherche en texte intégral avec FORMSOF(INFLECTIONAL, ride) peut correspondre à une description qui contient « riding ».
    - id: s3
      text:
        en: A vector search returns only products whose description contains every term of the query.
        fr: Une recherche vectorielle ne renvoie que les produits dont la description contient tous les termes de la requête.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Vector search compares the meaning of the query and of each description, so "comfortable saddle" can find "ergonomic touring seat" without a shared word. Full-text search applies linguistic rules, and inflectional forms of ride include riding and rode. Because vector search works on meaning, it can return related items that lack key terms the user specified; that is why exact terms call for full-text or hybrid search.
    fr: |
      La recherche vectorielle compare le sens de la requête et de chaque description : « selle confortable » peut trouver « siège ergonomique de randonnée » sans mot commun. La recherche en texte intégral applique des règles linguistiques, et les formes fléchies de ride incluent riding et rode. Comme la recherche vectorielle travaille sur le sens, elle peut renvoyer des éléments apparentés sans les termes clés indiqués par l'utilisateur : les termes exacts demandent donc une recherche en texte intégral ou hybride.
references:
  - title: Choose an intelligent search approach
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach
