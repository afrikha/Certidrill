id: dp800-3a-sql2025-identity-config
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs SQL Server 2025 on-premises. The instance is connected to Azure Arc, its primary managed identity is enabled, and the identity has the required role on an Azure OpenAI resource.

    In a database named HRDb, you create a database scoped credential WITH IDENTITY = 'Managed Identity' and an external model that references it. You need AI_GENERATE_EMBEDDINGS to call the Azure OpenAI deployment by using the managed identity. No server configuration option has been changed from its default.

    Which two server configuration options should you set to 1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute SQL Server 2025 en local. L'instance est connectée à Azure Arc, son identité managée principale est activée, et l'identité dispose du rôle requis sur une ressource Azure OpenAI.

    Dans une base de données nommée HRDb, vous créez des informations d'identification délimitées à la base de données WITH IDENTITY = 'Managed Identity' et un modèle externe qui les référence. AI_GENERATE_EMBEDDINGS doit appeler le déploiement Azure OpenAI à l'aide de l'identité managée. Aucune option de configuration de serveur n'a été modifiée par rapport à sa valeur par défaut.

    Quelles sont les deux options de configuration de serveur à définir à 1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: external rest endpoint enabled }
    - { id: b, text: external AI runtimes enabled }
    - { id: c, text: allow server scoped db credentials }
    - { id: d, text: external scripts enabled }
    - { id: e, text: clr enabled }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      On SQL Server 2025, AI_GENERATE_EMBEDDINGS calls the model through the REST endpoint feature, which requires external rest endpoint enabled (it's on by default only in Azure SQL Database and SQL database in Fabric). To authenticate with the instance's Arc-enabled managed identity, you must also enable allow server scoped db credentials, which requires the ALTER SETTINGS permission.
    fr: |
      Dans SQL Server 2025, AI_GENERATE_EMBEDDINGS appelle le modèle via la fonctionnalité de point de terminaison REST, qui exige external rest endpoint enabled (activée par défaut uniquement dans Azure SQL Database et SQL Database dans Fabric). Pour s'authentifier avec l'identité managée de l'instance activée par Azure Arc, vous devez aussi activer allow server scoped db credentials, ce qui exige l'autorisation ALTER SETTINGS.
  options:
    b: { en: "external AI runtimes enabled is for local ONNX Runtime models, not for a remote Azure OpenAI endpoint.", fr: "external AI runtimes enabled concerne les modèles ONNX Runtime locaux, pas un point de terminaison Azure OpenAI distant." }
    d: { en: "external scripts enabled runs R or Python scripts with Machine Learning Services; AI_GENERATE_EMBEDDINGS doesn't use it.", fr: "external scripts enabled exécute des scripts R ou Python avec Machine Learning Services ; AI_GENERATE_EMBEDDINGS ne l'utilise pas." }
    e: { en: "clr enabled allows .NET assemblies; it plays no part in calling an external model.", fr: "clr enabled autorise les assemblys .NET ; il ne joue aucun rôle dans l'appel d'un modèle externe." }
references:
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
