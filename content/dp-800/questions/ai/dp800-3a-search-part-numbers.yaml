id: dp800-3a-search-part-numbers
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wide World Importers has an Azure SQL database that stores a spare parts catalog. Technicians search the Name and Description columns by typing exact part numbers and model names, such as "XR-500 gasket", and they expect only the parts that contain those terms.

    Which search approach should you implement?
  fr: |
    Wide World Importers dispose d'une base de données Azure SQL qui stocke un catalogue de pièces détachées. Les techniciens effectuent des recherches dans les colonnes Name et Description en saisissant des références et des noms de modèles exacts, comme « joint XR-500 », et ils attendent uniquement les pièces qui contiennent ces termes.

    Quelle approche de recherche devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Full-text search", fr: "Recherche en texte intégral" } }
    - { id: b, text: { en: "Semantic vector search", fr: "Recherche vectorielle sémantique" } }
    - { id: c, text: { en: "Hybrid search", fr: "Recherche hybride" } }
    - { id: d, text: { en: "Approximate vector search with a vector index", fr: "Recherche vectorielle approximative avec un index vectoriel" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Full-text search matches the words and phrases that users type, with linguistic rules for word forms, so it fits users who know the exact terms, such as model numbers. It returns fewer, closely matching results and needs only a full-text index, with no embedding model.
    fr: |
      La recherche en texte intégral fait correspondre les mots et les expressions saisis par les utilisateurs, avec des règles linguistiques pour les formes des mots : elle convient aux utilisateurs qui connaissent les termes exacts, comme des numéros de modèle. Elle renvoie moins de résultats, très proches de la requête, et ne nécessite qu'un index de recherche en texte intégral, sans modèle d'incorporation.
  options:
    b: { en: "Vector search compares meaning and can return related parts that don't contain the part number the technician typed.", fr: "La recherche vectorielle compare le sens et peut renvoyer des pièces apparentées qui ne contiennent pas la référence saisie par le technicien." }
    c: { en: "Hybrid search fits users whose queries can't be predicted; here every query uses exact terms, and hybrid search takes longer.", fr: "La recherche hybride convient quand on ne peut pas prévoir les requêtes ; ici, chaque requête utilise des termes exacts, et la recherche hybride est plus lente." }
    d: { en: "A vector index speeds up vector search but doesn't make it match exact terms.", fr: "Un index vectoriel accélère la recherche vectorielle mais ne lui fait pas trouver des termes exacts." }
references:
  - title: Choose an intelligent search approach
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach
