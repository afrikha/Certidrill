stem:
  en: You use FOR JSON PATH with column aliases.
  fr: Vous utilisez FOR JSON PATH avec des alias de colonnes.
body:
  solution:
    en: |
      You add the following statement to the procedure:

      ```sql
      SET @context = (
          SELECT TOP (5)
              p.Name        AS name,
              p.ListPrice   AS price,
              p.Description AS description
          FROM dbo.Product AS p
          ORDER BY VECTOR_DISTANCE('cosine', p.DescriptionVector, @qv)
          FOR JSON PATH
      );
      ```
    fr: |
      Vous ajoutez l'instruction suivante à la procédure :

      ```sql
      SET @context = (
          SELECT TOP (5)
              p.Name        AS name,
              p.ListPrice   AS price,
              p.Description AS description
          FROM dbo.Product AS p
          ORDER BY VECTOR_DISTANCE('cosine', p.DescriptionVector, @qv)
          FOR JSON PATH
      );
      ```
answer: { value: true }
explanation:
  correct:
    en: FOR JSON PATH returns an array with one object per row, in the order set by ORDER BY, and uses the column aliases as property names. The names and the values are escaped according to JSON syntax, so quotation marks and line breaks in the descriptions keep the text valid. The subquery returns the whole JSON text, which SET assigns to @context.
    fr: "FOR JSON PATH renvoie un tableau avec un objet par ligne, dans l'ordre défini par ORDER BY, et utilise les alias de colonnes comme noms de propriétés. Les noms et les valeurs sont échappés selon la syntaxe JSON : les guillemets et les sauts de ligne des descriptions laissent le texte valide. La sous-requête renvoie l'intégralité du texte JSON, que SET affecte à @context."
references:
  - title: Format query results as JSON with FOR JSON
    url: https://learn.microsoft.com/en-us/sql/relational-databases/json/format-query-results-as-json-with-for-json-sql-server
