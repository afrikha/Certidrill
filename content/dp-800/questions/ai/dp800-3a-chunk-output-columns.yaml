id: dp800-3a-chunk-output-columns
objective: "3.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys chunks the text of many product guides in a single query by using AI_GENERATE_CHUNKS with ENABLE_CHUNK_SET_ID = 1. You must use the columns that the function returns.

    Which column should you use for each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys découpe le texte de nombreux guides de produits dans une seule requête à l'aide d'AI_GENERATE_CHUNKS avec ENABLE_CHUNK_SET_ID = 1. Vous devez utiliser les colonnes retournées par la fonction.

    Quelle colonne devez-vous utiliser pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Group together the chunks that come from the same source row: [[group]]

      Sort the chunks of a guide in reading order (1, 2, 3...): [[order]]

      Find the number of characters in each chunk: [[length]]
    fr: |
      Regrouper les blocs issus d'une même ligne source : [[group]]

      Trier les blocs d'un guide dans l'ordre de lecture (1, 2, 3...) : [[order]]

      Connaître le nombre de caractères de chaque bloc : [[length]]
  slots:
    - id: group
      options:
        - { id: set, text: chunk_set_id }
        - { id: ord, text: chunk_order }
        - { id: off, text: chunk_offset }
        - { id: len, text: chunk_length }
    - id: order
      options:
        - { id: set, text: chunk_set_id }
        - { id: ord, text: chunk_order }
        - { id: len, text: chunk_length }
    - id: length
      options:
        - { id: set, text: chunk_set_id }
        - { id: off, text: chunk_offset }
        - { id: len, text: chunk_length }
answer:
  values: { group: set, order: ord, length: len }
explanation:
  correct:
    en: |
      With ENABLE_CHUNK_SET_ID = 1, chunk_set_id gives the same value to all the chunks of one source row and a different value to each source. chunk_order is the sequence number of a chunk, starting at 1 for each source, and chunk_length is its length in characters. chunk_offset is the position of the chunk, starting at 1.
    fr: |
      Avec ENABLE_CHUNK_SET_ID = 1, chunk_set_id donne la même valeur à tous les blocs d'une ligne source et une valeur différente à chaque source. chunk_order est le numéro de séquence d'un bloc, à partir de 1 pour chaque source, et chunk_length sa longueur en caractères. chunk_offset est la position du bloc, à partir de 1.
references:
  - title: AI_GENERATE_CHUNKS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
