id: dp800-cs4b-feedback-vectors
objective: "3.2.4"
type: yesno_statements
caseStudy: dp800-cs4b-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You are writing the feedback search. The variable @q (vector(768)) contains the embedding of the search phrase, produced by the same model as the stored embeddings. The analysts want the ranking to reflect cosine similarity.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la recherche dans les avis. La variable @q (vector(768)) contient l'incorporation de la phrase de recherche, produite par le même modèle que les incorporations stockées. Les analystes veulent que le classement reflète la similarité cosinus.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If you store `VECTOR_NORMALIZE(Embedding, 'norm2')` and use `VECTOR_NORMALIZE(@q, 'norm2')` as the query vector, ordering by `VECTOR_DISTANCE('dot', ...)` ascending returns the rows in the same order as ordering by `VECTOR_DISTANCE('cosine', @q, Embedding)` on the original vectors.
        fr: |
          Si vous stockez `VECTOR_NORMALIZE(Embedding, 'norm2')` et utilisez `VECTOR_NORMALIZE(@q, 'norm2')` comme vecteur de requête, le tri croissant par `VECTOR_DISTANCE('dot', ...)` renvoie les lignes dans le même ordre que le tri par `VECTOR_DISTANCE('cosine', @q, Embedding)` sur les vecteurs d'origine.
    - id: s2
      text:
        en: |
          Rows of dbo.FeedbackVectors can contain vectors with fewer than 768 dimensions, so the search must exclude them with a filter on `VECTORPROPERTY(Embedding, 'Dimensions') = 768`.
        fr: |
          Des lignes de dbo.FeedbackVectors peuvent contenir des vecteurs de moins de 768 dimensions : la recherche doit donc les exclure avec un filtre sur `VECTORPROPERTY(Embedding, 'Dimensions') = 768`.
    - id: s3
      text:
        en: |
          With the vectors as the model returns them, ordering by `VECTOR_DISTANCE('dot', @q, Embedding)` ascending returns the rows in the same order as ordering by `VECTOR_DISTANCE('cosine', @q, Embedding)`.
        fr: |
          Avec les vecteurs tels que le modèle les renvoie, le tri croissant par `VECTOR_DISTANCE('dot', @q, Embedding)` renvoie les lignes dans le même ordre que le tri par `VECTOR_DISTANCE('cosine', @q, Embedding)`.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      VECTOR_DISTANCE with dot returns the negative dot product, so a smaller value means more similar. After norm2 normalization, every vector has a Euclidean length of 1, the dot product equals the cosine similarity, and the dot ranking matches the cosine ranking. A vector(768) column only accepts values with exactly 768 dimensions (a conversion with another number of elements fails), so no row needs a VECTORPROPERTY filter. Without normalization, the dot product also grows with the length of the vectors, so long vectors rank higher than cosine would place them.
    fr: |
      VECTOR_DISTANCE avec dot renvoie le produit scalaire négatif : une valeur plus petite signifie une plus grande similarité. Après une normalisation norm2, chaque vecteur a une longueur euclidienne de 1, le produit scalaire est égal à la similarité cosinus et le classement dot correspond au classement cosine. Une colonne vector(768) n'accepte que des valeurs d'exactement 768 dimensions (une conversion avec un autre nombre d'éléments échoue) : aucune ligne n'a besoin d'un filtre VECTORPROPERTY. Sans normalisation, le produit scalaire augmente aussi avec la longueur des vecteurs : les vecteurs longs sont mieux classés que ne les placerait cosine.
  options:
    s2: { en: "The column type enforces 768 dimensions; VECTORPROPERTY is useful to check the shape of a vector, for example when you troubleshoot a dimension mismatch between two vectors.", fr: "Le type de la colonne impose 768 dimensions ; VECTORPROPERTY sert à vérifier la forme d'un vecteur, par exemple pour diagnostiquer une différence de dimensions entre deux vecteurs." }
    s3: { en: "Cosine depends only on the angle between the vectors; the dot product also depends on their lengths, which vary because the model doesn't normalize them.", fr: "Cosine ne dépend que de l'angle entre les vecteurs ; le produit scalaire dépend aussi de leur longueur, qui varie car le modèle ne les normalise pas." }
references:
  - title: VECTOR_NORMALIZE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-normalize-transact-sql
  - title: VECTOR_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
