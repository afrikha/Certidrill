id: dp800-cs2c-ann-enn
objective: "3.2.5"
type: yesno_statements
caseStudy: dp800-cs2c-fabrikam-residences
difficulty: 3
status: draft
stem:
  en: |
    DescriptionVector is populated, and a vector index that uses the cosine metric is created on it with the latest vector index version.

    You are reviewing the vector queries of the search API.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    DescriptionVector est renseignée, et un index vectoriel qui utilise la métrique cosine y est créé avec la dernière version d'index vectoriel.

    Vous examinez les requêtes vectorielles de l'API de recherche.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          For the property manager console, `TOP (10) WITH APPROXIMATE` over VECTOR_SEARCH with `WHERE t.PropertyManagerId = @pm` guarantees the exact nearest neighbors, because the predicate leaves at most 4,000 candidates.
        fr: |
          Pour la console des gestionnaires immobiliers, `TOP (10) WITH APPROXIMATE` sur VECTOR_SEARCH avec `WHERE t.PropertyManagerId = @pm` garantit les voisins les plus proches exacts, car le prédicat laisse au plus 4 000 candidats.
    - id: s2
      text:
        en: |
          If you remove `WITH APPROXIMATE` from a VECTOR_SEARCH query and keep `TOP (10)` and `ORDER BY r.distance`, the query returns the exact nearest neighbors.
        fr: |
          Si vous supprimez `WITH APPROXIMATE` d'une requête VECTOR_SEARCH en conservant `TOP (10)` et `ORDER BY r.distance`, la requête renvoie les voisins les plus proches exacts.
    - id: s3
      text:
        en: |
          In the public site query, the predicate `t.City = @city` is applied during the approximate search, so the query does not need a value larger than 10 in `TOP` to return 10 listings of the city.
        fr: |
          Dans la requête du site public, le prédicat `t.City = @city` est appliqué pendant la recherche approximative : la requête n'a pas besoin d'une valeur supérieure à 10 dans `TOP` pour renvoyer 10 annonces de la ville.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      WITH APPROXIMATE requests approximate (ANN) results from the vector index, whose recall can be lower than 1 whatever the number of candidates; exact search is recommended when the predicates leave about 50,000 vectors or fewer, and the console requires exact neighbors. Without WITH APPROXIMATE, TOP (N) with ORDER BY distance over VECTOR_SEARCH runs an exact k-nearest-neighbor search, like TOP (N) ordered by VECTOR_DISTANCE. With the latest index version, WHERE predicates are applied iteratively during the search until N qualifying rows are found, so you don't oversample TOP (N).
    fr: |
      WITH APPROXIMATE demande des résultats approximatifs (ANN) à l'index vectoriel, dont le rappel peut être inférieur à 1 quel que soit le nombre de candidats ; la recherche exacte est recommandée quand les prédicats laissent environ 50 000 vecteurs ou moins, et la console exige les voisins exacts. Sans WITH APPROXIMATE, TOP (N) avec ORDER BY distance sur VECTOR_SEARCH exécute une recherche exacte des k plus proches voisins, comme TOP (N) trié par VECTOR_DISTANCE. Avec la dernière version d'index, les prédicats WHERE sont appliqués de façon itérative pendant la recherche jusqu'à obtenir N lignes qualifiées : vous n'avez pas besoin de suréchantillonner TOP (N).
references:
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
  - title: Vector search and vector indexes in the SQL Database Engine
