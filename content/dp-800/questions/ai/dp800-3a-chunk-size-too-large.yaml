id: dp800-3a-chunk-size-too-large
objective: "3.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware stores 200-page product manuals in an Azure SQL database. To limit the number of embedding calls, a developer chunks each manual with AI_GENERATE_CHUNKS and CHUNK_SIZE = 60000, and then embeds each chunk with text-embedding-3-small.

    Which two issues can this design cause?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware stocke des manuels de produits de 200 pages dans une base de données Azure SQL. Pour limiter le nombre d'appels d'incorporation, un développeur découpe chaque manuel avec AI_GENERATE_CHUNKS et CHUNK_SIZE = 60000, puis incorpore chaque bloc avec text-embedding-3-small.

    Quels sont les deux problèmes que cette conception peut provoquer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A chunk can exceed the input token limit of the embedding model.", fr: "Un bloc peut dépasser la limite de jetons d'entrée du modèle d'incorporation." } }
    - { id: b, text: { en: "Each vector mixes many topics, so focused questions match it less well.", fr: "Chaque vecteur mélange de nombreux sujets : les questions ciblées lui correspondent moins bien." } }
    - { id: c, text: { en: "Each chunk loses the context of the sentences around it.", fr: "Chaque bloc perd le contexte des phrases qui l'entourent." } }
    - { id: d, text: { en: "The number of embedding calls per manual increases.", fr: "Le nombre d'appels d'incorporation par manuel augmente." } }
    - { id: e, text: { en: "The vectors get more dimensions than the VECTOR column accepts.", fr: "Les vecteurs obtiennent plus de dimensions que la colonne VECTOR n'en accepte." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Embedding models limit the tokens they accept per request (8,192 for text-embedding-3-small), and 60,000 characters of text can exceed it. Chunks that are too large also lose semantic focus: one vector summarizes many unrelated ideas, which lowers similarity for specific questions.
    fr: |
      Les modèles d'incorporation limitent le nombre de jetons acceptés par requête (8 192 pour text-embedding-3-small), et 60 000 caractères de texte peuvent dépasser cette limite. Des blocs trop grands perdent aussi leur focalisation sémantique : un seul vecteur résume de nombreuses idées sans rapport, ce qui diminue la similarité pour des questions précises.
  options:
    c: { en: "Losing context is the risk of chunks that are too small, not too large.", fr: "Perdre le contexte est le risque des blocs trop petits, pas trop grands." }
    d: { en: "Larger chunks mean fewer chunks, so fewer embedding calls.", fr: "Des blocs plus grands signifient moins de blocs, donc moins d'appels d'incorporation." }
    e: { en: "The number of dimensions is fixed by the model, whatever the length of the input.", fr: "Le nombre de dimensions est fixé par le modèle, quelle que soit la longueur de l'entrée." }
references:
  - title: Design embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
