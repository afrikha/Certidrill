id: dp800-3b-idx-normalized
objective: "3.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database. You store embeddings returned by an Azure OpenAI embedding model in a VECTOR(1536) column, without changing them. You plan to create a vector index on the column.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL. Vous stockez dans une colonne VECTOR(1536), sans les modifier, les incorporations renvoyées par un modèle d'incorporation Azure OpenAI. Vous prévoyez de créer un index vectoriel sur la colonne.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Because the model returns normalized vectors, an index created with METRIC = 'dot' ranks the nearest neighbors in the same order as an index created with METRIC = 'cosine'.
        fr: |-
          Comme le modèle renvoie des vecteurs normalisés, un index créé avec METRIC = 'dot' classe les plus proches voisins dans le même ordre qu'un index créé avec METRIC = 'cosine'.
    - id: s2
      text:
        en: |-
          With METRIC = 'dot', a larger distance value indicates a more similar vector.
        fr: |-
          Avec METRIC = 'dot', une valeur de distance plus grande indique un vecteur plus similaire.
    - id: s3
      text:
        en: |-
          If you omit the TYPE option of CREATE VECTOR INDEX, the index uses DiskANN.
        fr: |-
          Si vous omettez l'option TYPE de CREATE VECTOR INDEX, l'index utilise DiskANN.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Azure OpenAI models return normalized vectors, and for vectors of length 1 the dot product equals the cosine similarity, so both metrics give the same ordering. The dot metric is the negative dot product, so smaller values still mean more similar vectors. DiskANN is the default, and currently the only, index type.
    fr: |-
      Les modèles Azure OpenAI renvoient des vecteurs normalisés, et pour des vecteurs de longueur 1, le produit scalaire est égal à la similarité cosinus : les deux métriques donnent le même classement. La métrique dot est le produit scalaire négatif : une valeur plus petite signifie donc toujours des vecteurs plus similaires. DiskANN est le type d'index par défaut, et actuellement le seul.
references:
  - title: VECTOR_NORMALIZE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-normalize-transact-sql
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
