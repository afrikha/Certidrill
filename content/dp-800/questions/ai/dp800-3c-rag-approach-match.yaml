id: dp800-3c-rag-approach-match
objective: "3.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure SQL database that contains customers, orders, support tickets and product descriptions with embeddings. Proseware also has a fixed corpus of 20,000 past contracts. Several teams submit requirements.

    Which approach should you recommend for each requirement? To answer, drag the appropriate approaches to the correct requirements. Each approach may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une base de données Azure SQL qui contient des clients, des commandes, des tickets de support et des descriptions de produits avec leurs incorporations. Proseware dispose aussi d'un corpus fixe de 20 000 contrats passés. Plusieurs équipes soumettent des exigences.

    Quelle approche devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les approches appropriées vers les exigences correspondantes. Chaque approche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rag, text: { en: "Retrieval-augmented generation (RAG)", fr: "Génération augmentée par récupération (RAG)" } }
    - { id: ft, text: { en: "Fine-tuning a language model", fr: "Réglage précis (fine-tuning) d'un modèle de langage" } }
    - { id: agg, text: { en: "An aggregate T-SQL query", fr: "Une requête T-SQL d'agrégation" } }
    - { id: vec, text: { en: "A vector search query", fr: "Une requête de recherche vectorielle" } }
    - { id: bare, text: { en: "A prompt without retrieved data", fr: "Une invite sans données récupérées" } }
  targets:
    - id: t1
      text: { en: "Draft a follow-up email for a customer from the customer's recent orders and open tickets", fr: "Rédiger un e-mail de suivi pour un client à partir de ses commandes récentes et de ses tickets ouverts" }
    - id: t2
      text: { en: "Make a model write every answer in the drafting style learned from the past contracts", fr: "Faire écrire au modèle chaque réponse dans le style rédactionnel appris des contrats passés" }
    - id: t3
      text: { en: "Return the exact revenue per region for the last quarter", fr: "Renvoyer le chiffre d'affaires exact par région pour le dernier trimestre" }
    - id: t4
      text: { en: "List the ten products whose descriptions are closest in meaning to a search phrase", fr: "Lister les dix produits dont la description est la plus proche d'une expression de recherche par le sens" }
answer:
  mapping: { t1: rag, t2: ft, t3: agg, t4: vec }
explanation:
  correct:
    en: "A personalized email needs generated text grounded in the customer's current rows, which is RAG. Permanently changing a model's style from a fixed corpus is what fine-tuning does. Exact figures are computed in SQL, not by a model. A list of semantically similar rows is a vector search, with no generation step."
    fr: "Un e-mail personnalisé demande un texte généré fondé sur les lignes actuelles du client : c'est RAG. Modifier durablement le style d'un modèle à partir d'un corpus fixe est le rôle du fine-tuning. Les chiffres exacts se calculent en SQL, pas avec un modèle. Une liste de lignes sémantiquement proches relève de la recherche vectorielle, sans étape de génération."
  options:
    bare: { en: "Without retrieved data, the model doesn't know Proseware's customers, orders or products and can only guess.", fr: "Sans données récupérées, le modèle ne connaît ni les clients, ni les commandes, ni les produits de Proseware et ne peut que deviner." }
references:
  - title: Identify RAG use cases and architecture
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/2-identify-rag-use-cases-architecture
