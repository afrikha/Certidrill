id: dp800-3c-eval-relevance-steps
objective: "3.2.10"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that stores support articles. The support portal uses a vector search. A developer proposes to replace it with a hybrid search that combines full-text and vector search with reciprocal rank fusion (RRF).

    You need to determine whether the hybrid search returns more relevant articles than the vector search.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL qui stocke des articles de support. Le portail de support utilise une recherche vectorielle. Un développeur propose de la remplacer par une recherche hybride qui combine recherche en texte intégral et recherche vectorielle avec la fusion de classement réciproque (RRF).

    Vous devez déterminer si la recherche hybride renvoie des articles plus pertinents que la recherche vectorielle.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: set, text: { en: "Build a test set of queries and the articles known to be relevant to each query.", fr: "Constituer un jeu de test de requêtes et des articles connus comme pertinents pour chaque requête." } }
    - { id: run, text: { en: "Run every test query with the vector search and with the hybrid search.", fr: "Exécuter chaque requête de test avec la recherche vectorielle et avec la recherche hybride." } }
    - { id: calc, text: { en: "Compute the precision, recall and mean reciprocal rank (MRR) of each approach.", fr: "Calculer la précision, le rappel et le rang réciproque moyen (MRR) de chaque approche." } }
    - { id: cmp, text: { en: "Compare the metrics of the two approaches and choose the search to deploy.", fr: "Comparer les métriques des deux approches et choisir la recherche à déployer." } }
    - { id: qs, text: { en: "Enable Query Store to record the relevance of each production query.", fr: "Activer le Magasin des requêtes (Query Store) pour enregistrer la pertinence de chaque requête de production." } }
    - { id: dot, text: { en: "Drop and recreate the vector index with METRIC = 'dot'.", fr: "Supprimer puis recréer l'index vectoriel avec METRIC = 'dot'." } }
answer:
  sequence: [ set, run, calc, cmp ]
explanation:
  correct:
    en: "Relevance is measured on a test set whose relevant rows are known. You run the same queries with each approach, compute precision, recall and MRR, and compare the results. Hybrid search typically improves recall over a single approach, but the test set is what proves it for your data."
    fr: "La pertinence se mesure sur un jeu de test dont les lignes pertinentes sont connues. Vous exécutez les mêmes requêtes avec chaque approche, calculez la précision, le rappel et le MRR, puis comparez les résultats. La recherche hybride améliore généralement le rappel par rapport à une approche seule, mais c'est le jeu de test qui le prouve pour vos données."
  options:
    qs: { en: "Query Store records runtime statistics such as duration and plans; it knows nothing about the relevance of the results.", fr: "Le Magasin des requêtes enregistre des statistiques d'exécution comme la durée et les plans ; il ignore tout de la pertinence des résultats." }
    dot: { en: "Changing the index metric doesn't measure relevance, and a query that still uses cosine would no longer use the index.", fr: "Changer la métrique de l'index ne mesure pas la pertinence, et une requête qui utilise encore cosine n'utiliserait plus l'index." }
references:
  - title: Implement hybrid search and ranking
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
