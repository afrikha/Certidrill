id: dp800-3a-model-management-facts
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware manages external models in a SQL Server 2025 database. Some models call Azure OpenAI by using database scoped credentials, and one model calls a local Ollama server.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware gère des modèles externes dans une base de données SQL Server 2025. Certains modèles appellent Azure OpenAI à l'aide d'informations d'identification délimitées à la base de données, et un modèle appelle un serveur Ollama local.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: DROP EXTERNAL MODEL also drops the database scoped credential that the model used.
        fr: DROP EXTERNAL MODEL supprime aussi les informations d'identification délimitées à la base de données utilisées par le modèle.
    - id: s2
      text:
        en: The external model for the local Ollama server can be created without the CREDENTIAL argument.
        fr: Le modèle externe du serveur Ollama local peut être créé sans l'argument CREDENTIAL.
    - id: s3
      text:
        en: A user who queries sys.external_models sees the metadata of every external model in the database, including models the user has no access to.
        fr: Un utilisateur qui interroge sys.external_models voit les métadonnées de tous les modèles externes de la base de données, y compris ceux auxquels il n'a pas accès.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Dropping an external model leaves its credential in the database; drop the credential separately if nothing else uses it. CREDENTIAL is optional and isn't needed for an unauthenticated endpoint such as a local Ollama server. sys.external_models shows a model's metadata only to users who have access to that model.
    fr: |
      Supprimer un modèle externe laisse ses informations d'identification dans la base de données ; supprimez-les séparément si rien d'autre ne les utilise. CREDENTIAL est facultatif et n'est pas nécessaire pour un point de terminaison sans authentification comme un serveur Ollama local. sys.external_models n'affiche les métadonnées d'un modèle qu'aux utilisateurs qui ont accès à ce modèle.
references:
  - title: DROP EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-external-model-transact-sql
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
