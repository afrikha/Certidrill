id: dp800-cs1a-external-model
objective: "3.1.2"
type: single
caseStudy: dp800-cs1a-adventure-works
difficulty: 1
status: draft
stem:
  en: |
    A database scoped credential named [https://fdy-aw.cognitiveservices.azure.com/] exists in sqldb-catalog. It uses the managed identity of sql-aw-catalog.

    You need to create the external model that AI_GENERATE_EMBEDDINGS will use to generate the values of DescriptionVector. You are evaluating the statements shown in the Statements exhibit. The solution must meet the embedding requirements.

    Which statement should you run?
  fr: |
    Des informations d'identification délimitées à la base de données nommées [https://fdy-aw.cognitiveservices.azure.com/] existent dans sqldb-catalog. Elles utilisent l'identité managée de sql-aw-catalog.

    Vous devez créer le modèle externe qu'AI_GENERATE_EMBEDDINGS utilisera pour générer les valeurs de DescriptionVector. Vous évaluez les instructions présentées dans la pièce Instructions. La solution doit respecter les exigences relatives aux incorporations.

    Quelle instruction devez-vous exécuter ?
exhibits:
  - id: statements
    title: { en: "Statements", fr: "Instructions" }
    body: |
      ```sql
      -- Statement 1
      CREATE EXTERNAL MODEL EmbedSmall
      WITH (LOCATION = 'https://fdy-aw.cognitiveservices.azure.com/openai/deployments/embed-small/chat/completions?api-version=2024-10-21',
            API_FORMAT = 'Azure OpenAI', MODEL_TYPE = EMBEDDINGS, MODEL = 'text-embedding-3-small',
            CREDENTIAL = [https://fdy-aw.cognitiveservices.azure.com/]);

      -- Statement 2
      CREATE EXTERNAL MODEL EmbedSmall
      WITH (LOCATION = 'http://fdy-aw.cognitiveservices.azure.com/openai/deployments/embed-small/embeddings?api-version=2024-02-01',
            API_FORMAT = 'Azure OpenAI', MODEL_TYPE = EMBEDDINGS, MODEL = 'text-embedding-3-small',
            CREDENTIAL = [https://fdy-aw.cognitiveservices.azure.com/]);

      -- Statement 3
      CREATE EXTERNAL MODEL EmbedSmall
      WITH (LOCATION = 'https://fdy-aw.cognitiveservices.azure.com/openai/deployments/embed-small/embeddings?api-version=2024-02-01',
            API_FORMAT = 'Azure OpenAI', MODEL_TYPE = EMBEDDINGS, MODEL = 'text-embedding-3-small',
            CREDENTIAL = [https://fdy-aw.cognitiveservices.azure.com/]);

      -- Statement 4
      CREATE EXTERNAL MODEL EmbedSmall
      WITH (LOCATION = 'https://fdy-aw.cognitiveservices.azure.com/openai/deployments/embed-small/embeddings?api-version=2024-02-01',
            API_FORMAT = 'ONNX Runtime', MODEL_TYPE = EMBEDDINGS, MODEL = 'text-embedding-3-small',
            CREDENTIAL = [https://fdy-aw.cognitiveservices.azure.com/]);
      ```
body:
  options:
    - { id: a, text: { en: "Statement 1", fr: "Instruction 1" } }
    - { id: b, text: { en: "Statement 2", fr: "Instruction 2" } }
    - { id: c, text: { en: "Statement 3", fr: "Instruction 3" } }
    - { id: d, text: { en: "Statement 4", fr: "Instruction 4" } }
shuffle: false
answer: { optionId: c }
explanation:
  correct:
    en: |
      For an Azure OpenAI embeddings deployment, LOCATION is the HTTPS URL https://{endpoint}/openai/deployments/{deployment}/embeddings?api-version={date}, API_FORMAT is 'Azure OpenAI' and MODEL_TYPE is EMBEDDINGS, the only accepted value. CREDENTIAL references the existing managed identity credential, whose name matches the protocol and host of LOCATION, so no key is stored.
    fr: |
      Pour un déploiement d'incorporations Azure OpenAI, LOCATION est l'URL HTTPS https://{endpoint}/openai/deployments/{deployment}/embeddings?api-version={date}, API_FORMAT vaut 'Azure OpenAI' et MODEL_TYPE vaut EMBEDDINGS, la seule valeur acceptée. CREDENTIAL référence les informations d'identification existantes de l'identité managée, dont le nom correspond au protocole et à l'hôte de LOCATION : aucune clé n'est stockée.
  options:
    a: { en: "An EMBEDDINGS model must point to the embeddings path of the deployment, not to the chat completions path.", fr: "Un modèle EMBEDDINGS doit pointer vers le chemin embeddings du déploiement, pas vers le chemin chat completions." }
    b: { en: "LOCATION supports only HTTPS with TLS, and the protocol of the credential name no longer matches the endpoint.", fr: "LOCATION ne prend en charge que HTTPS avec TLS, et le protocole du nom des informations d'identification ne correspond plus au point de terminaison." }
    d: { en: "ONNX Runtime is the format of a model that runs locally on SQL Server from a directory path, not of an Azure OpenAI endpoint.", fr: "ONNX Runtime est le format d'un modèle exécuté localement sur SQL Server à partir d'un chemin de répertoire, pas d'un point de terminaison Azure OpenAI." }
references:
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
