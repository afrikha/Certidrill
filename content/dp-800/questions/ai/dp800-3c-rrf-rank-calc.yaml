id: dp800-3c-rrf-rank-calc
objective: "3.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.KnowledgeArticles. A hybrid search query runs a full-text search and a vector search, and then merges the two lists by using reciprocal rank fusion (RRF) with k = 60. Each list returns its 50 best candidates.

    For a test query, four articles have the following ranks. A dash means that the article is not in the list.

    | Article | Full-text rank | Vector rank |
    | --- | --- | --- |
    | A1 | 1 | - |
    | A2 | 4 | 3 |
    | A3 | 2 | 6 |
    | A4 | - | 1 |

    Which article will the hybrid query return first?
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.KnowledgeArticles. Une requête de recherche hybride exécute une recherche en texte intégral et une recherche vectorielle, puis fusionne les deux listes par fusion de classement réciproque (RRF) avec k = 60. Chaque liste renvoie ses 50 meilleurs candidats.

    Pour une requête de test, quatre articles ont les rangs suivants. Un tiret signifie que l'article n'est pas dans la liste.

    | Article | Rang texte intégral | Rang vectoriel |
    | --- | --- | --- |
    | A1 | 1 | - |
    | A2 | 4 | 3 |
    | A3 | 2 | 6 |
    | A4 | - | 1 |

    Quel article la requête hybride renverra-t-elle en premier ?
body:
  options:
    - { id: a, text: A1 }
    - { id: b, text: A2 }
    - { id: c, text: A3 }
    - { id: d, text: A4 }
answer: { optionId: b }
explanation:
  correct:
    en: "RRF adds 1 / (k + rank) for each list in which the row appears. A2 scores 1/64 + 1/63 ≈ 0.03150 and A3 scores 1/62 + 1/66 ≈ 0.03128, so A2 comes first. Appearing in both lists matters more than being first in one list."
    fr: "RRF additionne 1 / (k + rang) pour chaque liste dans laquelle la ligne apparaît. A2 obtient 1/64 + 1/63 ≈ 0,03150 et A3 obtient 1/62 + 1/66 ≈ 0,03128 : A2 arrive donc en premier. Apparaître dans les deux listes compte davantage qu'être premier dans une seule."
  options:
    a: { en: "A1 is first in one list only, so its score is 1/61 ≈ 0.01639, about half the score of A2.", fr: "A1 n'est premier que dans une seule liste : son score vaut 1/61 ≈ 0,01639, environ la moitié de celui d'A2." }
    c: { en: "A3 scores 1/62 + 1/66 ≈ 0.03128, slightly less than A2: its 6th vector rank costs more than its better full-text rank gains.", fr: "A3 obtient 1/62 + 1/66 ≈ 0,03128, un peu moins qu'A2 : son 6e rang vectoriel lui coûte plus que ce que lui apporte son meilleur rang en texte intégral." }
    d: { en: "A4 is in the vector list only, so it receives 1/61 ≈ 0.01639 and 0 for the full-text list.", fr: "A4 ne figure que dans la liste vectorielle : il reçoit 1/61 ≈ 0,01639 et 0 pour la liste en texte intégral." }
references:
  - title: Implement hybrid search and ranking
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
