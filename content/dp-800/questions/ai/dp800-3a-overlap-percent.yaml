id: dp800-3a-overlap-percent
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank chunks call-center transcripts with the following expression.

    ```sql
    CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = t.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 500) AS c
    ```

    Answers that span two chunks are often missed. You need each chunk to repeat at least the last 200 characters of the preceding chunk. The chunk size must remain 500 characters, and the amount of repeated text must be minimized.

    Which argument should you add?
  fr: |
    Woodgrove Bank découpe des transcriptions du centre d'appels avec l'expression suivante.

    ```sql
    CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = t.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 500) AS c
    ```

    Les réponses réparties sur deux blocs sont souvent manquées. Chaque bloc doit répéter au moins les 200 derniers caractères du bloc précédent. La taille des blocs doit rester de 500 caractères, et la quantité de texte répété doit être réduite au minimum.

    Quel argument devez-vous ajouter ?
body:
  options:
    - { id: a, text: "OVERLAP = 0.4" }
    - { id: b, text: "OVERLAP = 40" }
    - { id: c, text: "OVERLAP = 50" }
    - { id: d, text: "OVERLAP = 200" }
shuffle: false
answer: { optionId: b }
explanation:
  correct:
    en: |
      OVERLAP is a percentage of CHUNK_SIZE that carries over from the preceding chunk, as a whole number from 0 to 50. With a chunk size of 500 characters, 40 % repeats exactly 200 characters, the smallest value that meets the requirement.
    fr: |
      OVERLAP est un pourcentage de CHUNK_SIZE repris du bloc précédent, exprimé par un nombre entier de 0 à 50. Avec une taille de bloc de 500 caractères, 40 % répète exactement 200 caractères, la plus petite valeur qui satisfait l'exigence.
  options:
    a: { en: "OVERLAP must be a whole number that expresses a percentage, not a fraction.", fr: "OVERLAP doit être un nombre entier qui exprime un pourcentage, pas une fraction." }
    c: { en: "50 % repeats 250 characters, more than required.", fr: "50 % répète 250 caractères, plus que nécessaire." }
    d: { en: "OVERLAP isn't a number of characters, and values above 50 aren't accepted.", fr: "OVERLAP n'est pas un nombre de caractères, et les valeurs supérieures à 50 ne sont pas acceptées." }
references:
  - title: AI_GENERATE_CHUNKS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
