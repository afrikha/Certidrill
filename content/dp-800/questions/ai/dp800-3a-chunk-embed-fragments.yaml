id: dp800-3a-chunk-embed-fragments
objective: "3.1.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has an Azure SQL database at compatibility level 170. You need to split the Body of each guide in dbo.Guides into chunks of 700 characters and store each chunk with its embedding in dbo.GuideChunks. An external model named GuideEmbedder exists.

    ```sql
    INSERT INTO dbo.GuideChunks (GuideID, ChunkOrder, ChunkText, Embedding)
    SELECT g.GuideID, c.chunk_order, c.chunk,
           [Target 2](c.chunk USE MODEL GuideEmbedder)
    FROM dbo.Guides AS g
    [Target 3] [Target 1](SOURCE = g.Body, CHUNK_TYPE = FIXED, CHUNK_SIZE = 700) AS c;
    ```

    Which code fragment should you use for each target? To answer, drag the appropriate fragments to the correct targets. Each fragment may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'une base de données Azure SQL au niveau de compatibilité 170. Vous devez découper le Body de chaque guide de dbo.Guides en blocs de 700 caractères et stocker chaque bloc avec son incorporation dans dbo.GuideChunks. Un modèle externe nommé GuideEmbedder existe.

    ```sql
    INSERT INTO dbo.GuideChunks (GuideID, ChunkOrder, ChunkText, Embedding)
    SELECT g.GuideID, c.chunk_order, c.chunk,
           [Target 2](c.chunk USE MODEL GuideEmbedder)
    FROM dbo.Guides AS g
    [Target 3] [Target 1](SOURCE = g.Body, CHUNK_TYPE = FIXED, CHUNK_SIZE = 700) AS c;
    ```

    Quel fragment de code devez-vous utiliser pour chaque cible ? Pour répondre, faites glisser les fragments appropriés vers les cibles correspondantes. Chaque fragment peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: chunks, text: AI_GENERATE_CHUNKS }
    - { id: embed, text: AI_GENERATE_EMBEDDINGS }
    - { id: cross, text: CROSS APPLY }
    - { id: join, text: INNER JOIN }
    - { id: norm, text: VECTOR_NORMALIZE }
    - { id: split, text: STRING_SPLIT }
  targets:
    - { id: t1, text: "Target 1" }
    - { id: t2, text: "Target 2" }
    - { id: t3, text: "Target 3" }
answer:
  mapping: { t1: chunks, t2: embed, t3: cross }
explanation:
  correct:
    en: |
      AI_GENERATE_CHUNKS is a table-valued function that splits the source into fixed-size chunks; CROSS APPLY evaluates it for each guide. AI_GENERATE_EMBEDDINGS then sends the text of each chunk to the external model and returns its vector, so chunking, embedding and insertion happen in one statement.
    fr: |
      AI_GENERATE_CHUNKS est une fonction table qui découpe la source en blocs de taille fixe ; CROSS APPLY l'évalue pour chaque guide. AI_GENERATE_EMBEDDINGS envoie ensuite le texte de chaque bloc au modèle externe et retourne son vecteur : découpage, incorporation et insertion se font en une seule instruction.
  options:
    join: { en: "A join can't pass g.Body of each outer row to a table-valued function.", fr: "Une jointure ne peut pas transmettre g.Body de chaque ligne externe à une fonction table." }
    norm: { en: "VECTOR_NORMALIZE scales an existing vector; it doesn't generate one from text.", fr: "VECTOR_NORMALIZE met à l'échelle un vecteur existant ; il n'en génère pas à partir de texte." }
    split: { en: "STRING_SPLIT splits on a separator character and has no CHUNK_SIZE argument.", fr: "STRING_SPLIT découpe selon un caractère séparateur et n'a pas d'argument CHUNK_SIZE." }
references:
  - title: AI_GENERATE_CHUNKS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
