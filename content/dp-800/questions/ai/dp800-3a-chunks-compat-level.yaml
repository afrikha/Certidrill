id: dp800-3a-chunks-compat-level
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure SQL database named KnowledgeDb that was migrated from SQL Server 2022 and still runs at compatibility level 160. An external model named EmbedModel works correctly with AI_GENERATE_EMBEDDINGS.

    You run a query that uses CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = a.Body, CHUNK_TYPE = FIXED, CHUNK_SIZE = 600). The query fails because the database engine can't find the function.

    What should you do?
  fr: |
    Contoso dispose d'une base de données Azure SQL nommée KnowledgeDb, migrée depuis SQL Server 2022, qui s'exécute toujours au niveau de compatibilité 160. Un modèle externe nommé EmbedModel fonctionne correctement avec AI_GENERATE_EMBEDDINGS.

    Vous exécutez une requête qui utilise CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = a.Body, CHUNK_TYPE = FIXED, CHUNK_SIZE = 600). La requête échoue, car le moteur de base de données ne trouve pas la fonction.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: "ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON;" }
    - { id: b, text: "EXECUTE sp_configure 'external rest endpoint enabled', 1; RECONFIGURE;" }
    - { id: c, text: "GRANT EXECUTE ON EXTERNAL MODEL::EmbedModel TO [app_user];" }
    - { id: d, text: "ALTER DATABASE KnowledgeDb SET COMPATIBILITY_LEVEL = 170;" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AI_GENERATE_CHUNKS requires database compatibility level 170 or higher. At a lower level, the database engine can't find the function, even on a platform that supports it. Raising the compatibility level makes the function available.
    fr: |
      AI_GENERATE_CHUNKS exige le niveau de compatibilité de base de données 170 ou supérieur. À un niveau inférieur, le moteur de base de données ne trouve pas la fonction, même sur une plateforme qui la prend en charge. Relever le niveau de compatibilité rend la fonction disponible.
  options:
    a: { en: "PREVIEW_FEATURES doesn't change the compatibility level, which is the requirement the database doesn't meet.", fr: "PREVIEW_FEATURES ne modifie pas le niveau de compatibilité, qui est l'exigence que la base de données ne respecte pas." }
    b: { en: "Chunking runs in the database engine and calls no REST endpoint; calls already work for AI_GENERATE_EMBEDDINGS.", fr: "Le découpage s'exécute dans le moteur de base de données et n'appelle aucun point de terminaison REST ; les appels fonctionnent déjà pour AI_GENERATE_EMBEDDINGS." }
    c: { en: "AI_GENERATE_CHUNKS doesn't use an external model, so a permission on EmbedModel doesn't make it available.", fr: "AI_GENERATE_CHUNKS n'utilise pas de modèle externe : une autorisation sur EmbedModel ne la rend pas disponible." }
references:
  - title: AI_GENERATE_CHUNKS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
