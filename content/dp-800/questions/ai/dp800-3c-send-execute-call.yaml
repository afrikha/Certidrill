id: dp800-3c-send-execute-call
objective: "3.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database. The variable @payload contains a chat completions request built with JSON_OBJECT. A database scoped credential named [https://fabrikam-ai.openai.azure.com] uses the managed identity of the server.

    You need to send the payload to the chat deployment and capture the HTTP result and the model's reply.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL. La variable @payload contient une requête de complétions de conversation construite avec JSON_OBJECT. Des informations d'identification délimitées à la base de données nommées [https://fabrikam-ai.openai.azure.com] utilisent l'identité managée du serveur.

    Vous devez envoyer la charge utile au déploiement de conversation et récupérer le résultat HTTP et la réponse du modèle.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    DECLARE @response NVARCHAR(MAX), @rc INT;

    EXECUTE @rc = sp_invoke_external_rest_endpoint
        @url = N'https://fabrikam-ai.openai.azure.com/openai/deployments/chat-model/chat/completions?api-version=2024-10-21',
        @method = [[method]],
        @payload = @payload,
        @credential = [[cred]],
        @response = @response [[out]];
  slots:
    - id: method
      options:
        - { id: post, text: "'POST'" }
        - { id: get, text: "'GET'" }
        - { id: put, text: "'PUT'" }
        - { id: patch, text: "'PATCH'" }
    - id: cred
      options:
        - { id: url, text: "[https://fabrikam-ai.openai.azure.com]" }
        - { id: key, text: "N'{\"api-key\":\"<key>\"}'" }
        - { id: name, text: "[fabrikam-ai-key]" }
    - id: out
      options:
        - { id: output, text: OUTPUT }
        - { id: readonly, text: READONLY }
        - { id: varying, text: VARYING }
answer:
  values: { method: post, cred: url, out: output }
explanation:
  correct:
    en: "A chat completions request is sent with POST, which is also the default of @method. @credential takes the name of the database scoped credential, which is the URL of the resource. @response is an OUTPUT parameter that receives the response envelope, and the return value in @rc is 0 for a 2xx status."
    fr: "Une requête de complétions de conversation s'envoie avec POST, qui est aussi la valeur par défaut de @method. @credential prend le nom des informations d'identification délimitées à la base de données, c'est-à-dire l'URL de la ressource. @response est un paramètre OUTPUT qui reçoit l'enveloppe de réponse, et la valeur de retour dans @rc vaut 0 pour un statut 2xx."
  options:
    get: { en: "The chat completions operation expects a POST request that carries the prompt in its body, not a GET.", fr: "L'opération de complétions de conversation attend une requête POST qui porte l'invite dans son corps, pas un GET." }
    key: { en: "@credential expects the name of a credential, not a JSON string; an API key in the code is also a secret to avoid.", fr: "@credential attend le nom d'informations d'identification, pas une chaîne JSON ; une clé API dans le code est en outre un secret à éviter." }
    name: { en: "No credential has this name, and a credential name must be a URL of the called endpoint.", fr: "Aucune information d'identification ne porte ce nom, et ce nom doit être une URL du point de terminaison appelé." }
    readonly: { en: "READONLY applies to table-valued parameters; without OUTPUT, @response stays NULL.", fr: "READONLY s'applique aux paramètres table ; sans OUTPUT, @response reste NULL." }
    varying: { en: "VARYING applies to cursor output parameters, not to an nvarchar(max) response.", fr: "VARYING s'applique aux paramètres de sortie de type curseur, pas à une réponse nvarchar(max)." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
