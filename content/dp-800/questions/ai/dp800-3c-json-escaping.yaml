id: dp800-3c-json-escaping
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database. A stored procedure builds the description of a product for a prompt by using the following statement.

    ```sql
    SET @context = N'{"name":"' + @name + N'","notes":"' + @notes + N'"}';
    ```

    The product data must reach the model as valid JSON. For some products, ISJSON(@context) returns 0. The notes of these products contain double quotation marks or line breaks.

    You need to fix the statement. The notes must be sent unchanged.

    Which statement should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL. Une procédure stockée construit la description d'un produit pour une invite avec l'instruction suivante.

    ```sql
    SET @context = N'{"name":"' + @name + N'","notes":"' + @notes + N'"}';
    ```

    Les données du produit doivent parvenir au modèle sous forme de JSON valide. Pour certains produits, ISJSON(@context) renvoie 0. Les notes de ces produits contiennent des guillemets doubles ou des sauts de ligne.

    Vous devez corriger l'instruction. Les notes doivent être envoyées sans modification.

    Quelle instruction devez-vous utiliser ?
body:
  options:
    - { id: a, text: "SET @context = CONCAT(N'{\"name\":\"', @name, N'\",\"notes\":\"', @notes, N'\"}');" }
    - { id: b, text: "SET @context = N'{\"name\":\"' + @name + N'\",\"notes\":\"' + REPLACE(@notes, CHAR(10), N' ') + N'\"}';" }
    - { id: c, text: "SET @context = JSON_OBJECT('name': @name, 'notes': @notes);" }
    - { id: d, text: "SET @context = N'{\"name\":\"' + @name + N'\",\"notes\":' + QUOTENAME(@notes, '\"') + N'}';" }
answer: { optionId: c }
explanation:
  correct:
    en: "JSON_OBJECT builds the object and escapes special characters, such as double quotation marks and line breaks, according to the JSON rules, so the output is always valid JSON and the notes keep their content."
    fr: "JSON_OBJECT construit l'objet et échappe les caractères spéciaux, comme les guillemets doubles et les sauts de ligne, selon les règles JSON : la sortie est toujours un JSON valide et les notes conservent leur contenu."
  options:
    a: { en: "CONCAT handles NULL values, but it doesn't escape anything: a quotation mark in the notes still breaks the JSON.", fr: "CONCAT gère les valeurs NULL, mais n'échappe rien : un guillemet dans les notes casse toujours le JSON." }
    b: { en: "REPLACE changes the notes and only removes line feeds; quotation marks still break the JSON.", fr: "REPLACE modifie les notes et ne supprime que les sauts de ligne ; les guillemets cassent toujours le JSON." }
    d: { en: "QUOTENAME doubles the delimiter instead of escaping it as JSON requires, and it returns NULL for input over 128 characters.", fr: "QUOTENAME double le délimiteur au lieu de l'échapper comme l'exige JSON, et renvoie NULL pour une entrée de plus de 128 caractères." }
references:
  - title: JSON_OBJECT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-object-transact-sql
