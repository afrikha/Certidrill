stem:
  en: You sort the VECTOR_DISTANCE result in ascending order.
  fr: Vous triez le résultat de VECTOR_DISTANCE par ordre croissant.
body:
  solution:
    en: |
      You run the following query.

      ```sql
      SELECT TOP (5) ArticleID, Title,
             VECTOR_DISTANCE('cosine', @qv, ContentVector) AS distance
      FROM dbo.Articles
      ORDER BY distance;
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```sql
      SELECT TOP (5) ArticleID, Title,
             VECTOR_DISTANCE('cosine', @qv, ContentVector) AS distance
      FROM dbo.Articles
      ORDER BY distance;
      ```
answer: { value: true }
explanation:
  correct:
    en: VECTOR_DISTANCE always computes the exact distance for each row and never uses a vector index, which is what the requirement asks for. Sorting the cosine distance in ascending order puts the most similar articles first, and TOP (5) keeps the five closest ones.
    fr: "VECTOR_DISTANCE calcule toujours la distance exacte pour chaque ligne et n'utilise jamais d'index vectoriel, ce que demande l'exigence. Trier la distance cosinus par ordre croissant place les articles les plus similaires en premier, et TOP (5) conserve les cinq plus proches."
references:
  - title: VECTOR_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
