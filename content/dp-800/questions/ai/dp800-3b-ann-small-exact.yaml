id: dp800-3b-ann-small-exact
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure SQL database that contains a table named dbo.PolicyClauses. The table has 12,000 rows, and each row has an embedding in a VECTOR(1536) column.

    Compliance officers search the clauses by meaning. The search must always return exactly the five closest clauses. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Woodgrove Bank dispose d'une base de données Azure SQL qui contient une table nommée dbo.PolicyClauses. La table compte 12 000 lignes, et chaque ligne possède une incorporation dans une colonne VECTOR(1536).

    Les responsables de la conformité recherchent les clauses par leur sens. La recherche doit toujours renvoyer exactement les cinq clauses les plus proches. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A vector index, and VECTOR_SEARCH with SELECT TOP (5) WITH APPROXIMATE", fr: "Un index vectoriel, et VECTOR_SEARCH avec SELECT TOP (5) WITH APPROXIMATE" } }
    - { id: b, text: { en: "VECTOR_DISTANCE with TOP (5) and ORDER BY distance, without a vector index", fr: "VECTOR_DISTANCE avec TOP (5) et ORDER BY distance, sans index vectoriel" } }
    - { id: c, text: { en: "A vector index, and VECTOR_SEARCH with the FORCE_ANN_ONLY table hint", fr: "Un index vectoriel, et VECTOR_SEARCH avec l'indicateur de table FORCE_ANN_ONLY" } }
    - { id: d, text: { en: "A full-text index, and CONTAINSTABLE sorted by RANK", fr: "Un index de recherche en texte intégral, et CONTAINSTABLE trié par RANK" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An exact nearest neighbor (ENN) search computes the distance to every vector and guarantees the true nearest neighbors. Microsoft recommends exact search when fewer than about 50,000 vectors are compared, which is the case here, and it needs no index to create or maintain.
    fr: |-
      Une recherche de plus proches voisins exacts (ENN) calcule la distance à chaque vecteur et garantit les vrais plus proches voisins. Microsoft recommande la recherche exacte quand moins d'environ 50 000 vecteurs sont comparés, ce qui est le cas ici, et elle ne demande aucun index à créer ni à maintenir.
  options:
    a: { en: "An approximate search does not guarantee exactly the closest clauses, and the index adds an object to maintain.", fr: "Une recherche approximative ne garantit pas exactement les clauses les plus proches, et l'index ajoute un objet à maintenir." }
    c: { en: "FORCE_ANN_ONLY forces the approximate index, which is the opposite of the exactness requirement.", fr: "FORCE_ANN_ONLY force l'index approximatif, ce qui est l'inverse de l'exigence d'exactitude." }
    d: { en: "Full-text search matches words, not meaning, so it does not use the embeddings at all.", fr: "La recherche en texte intégral trouve des mots, pas un sens : elle n'utilise pas du tout les incorporations." }
references:
  - title: Vector search and vector indexes in the SQL Database Engine
    url: https://learn.microsoft.com/en-us/sql/sql-server/ai/vectors
