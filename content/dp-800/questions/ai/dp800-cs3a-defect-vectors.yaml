id: dp800-cs3a-defect-vectors
objective: "3.2.4"
type: yesno_statements
caseStudy: dp800-cs3a-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the search for similar defects. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la recherche de défauts similaires. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Since vix_DefectVector was created, the current query for similar defects reads the vector index instead of computing a distance for every row.
        fr: Depuis la création de vix_DefectVector, la requête actuelle de défauts similaires lit l'index vectoriel au lieu de calculer une distance pour chaque ligne.
    - id: s2
      text:
        en: VECTORPROPERTY(d.DefectVector, 'Dimensions') returns 1536 for every row of Maint.DefectReports whose DefectVector value isn't NULL.
        fr: VECTORPROPERTY(d.DefectVector, 'Dimensions') renvoie 1536 pour chaque ligne de Maint.DefectReports dont la valeur DefectVector n'est pas NULL.
    - id: s3
      text:
        en: If the current query used the dot metric instead of cosine, it would return the same 20 defects in the same order.
        fr: Si la requête actuelle utilisait la métrique dot au lieu de cosine, elle renverrait les 20 mêmes défauts dans le même ordre.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      VECTOR_DISTANCE always computes exact distances and never uses a vector index, even when one exists; only VECTOR_SEARCH uses vix_DefectVector. VECTORPROPERTY with Dimensions returns the dimension count of a vector, and every value of a vector(1536) column has 1,536 dimensions. Azure OpenAI embedding models return normalized vectors, and for vectors of length 1 the negative dot product and the cosine distance rank the rows in the same order.
    fr: |
      VECTOR_DISTANCE calcule toujours des distances exactes et n'utilise jamais d'index vectoriel, même s'il en existe un ; seule VECTOR_SEARCH utilise vix_DefectVector. VECTORPROPERTY avec Dimensions renvoie le nombre de dimensions d'un vecteur, et chaque valeur d'une colonne vector(1536) a 1 536 dimensions. Les modèles d'incorporation Azure OpenAI renvoient des vecteurs normalisés, et pour des vecteurs de longueur 1, le produit scalaire négatif et la distance cosinus classent les lignes dans le même ordre.
references:
  - title: VECTOR_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
  - title: VECTORPROPERTY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vectorproperty-transact-sql
