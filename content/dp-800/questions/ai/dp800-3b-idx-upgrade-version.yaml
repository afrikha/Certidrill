id: dp800-3b-idx-upgrade-version
objective: "3.2.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Docs. A vector index named vix_Docs on the Embedding column was created in 2025. Filtered searches on dbo.Docs return fewer rows than requested, and you suspect that vix_Docs uses an earlier index version that only post-filters results.

    You need to make sure that vix_Docs uses the latest index version, with the same column and metric. The queries will be updated separately.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Docs. Un index vectoriel nommé vix_Docs sur la colonne Embedding a été créé en 2025. Les recherches filtrées sur dbo.Docs renvoient moins de lignes que demandé, et vous soupçonnez que vix_Docs utilise une version d'index antérieure qui ne filtre les résultats qu'après la recherche.

    Vous devez vous assurer que vix_Docs utilise la dernière version d'index, avec la même colonne et la même métrique. Les requêtes seront mises à jour séparément.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: find, text: { en: "Query sys.vector_indexes to read the distance metric and the $.Version value of build_parameters.", fr: "Interroger sys.vector_indexes pour lire la métrique de distance et la valeur $.Version de build_parameters." } }
    - { id: drop, text: { en: "Run DROP INDEX vix_Docs ON dbo.Docs.", fr: "Exécuter DROP INDEX vix_Docs ON dbo.Docs." } }
    - { id: create, text: { en: "Run CREATE VECTOR INDEX vix_Docs on Embedding with the same metric.", fr: "Exécuter CREATE VECTOR INDEX vix_Docs sur Embedding avec la même métrique." } }
    - { id: verify, text: { en: "Query sys.vector_indexes again and confirm that the index version is 3.", fr: "Interroger de nouveau sys.vector_indexes et vérifier que la version de l'index est 3." } }
    - { id: rebuild, text: { en: "Run ALTER INDEX vix_Docs ON dbo.Docs REBUILD.", fr: "Exécuter ALTER INDEX vix_Docs ON dbo.Docs REBUILD." } }
    - { id: stale, text: { en: "Set the ALLOW_STALE_VECTOR_INDEX database scoped configuration to ON.", fr: "Définir la configuration étendue à la base de données ALLOW_STALE_VECTOR_INDEX sur ON." } }
answer:
  sequence: [ find, drop, create, verify ]
explanation:
  correct:
    en: |
      sys.vector_indexes exposes the metric and the build parameters of each vector index, and JSON_VALUE(build_parameters, '$.Version') returns the version. An index that uses an earlier format cannot be upgraded in place: you drop it and create it again, which produces a latest-version index. A final check of sys.vector_indexes must show version 3.
    fr: |
      sys.vector_indexes expose la métrique et les paramètres de création de chaque index vectoriel, et JSON_VALUE(build_parameters, '$.Version') renvoie la version. Un index qui utilise un format antérieur ne peut pas être mis à niveau sur place : vous le supprimez puis le recréez, ce qui produit un index de dernière version. Une dernière vérification de sys.vector_indexes doit indiquer la version 3.
  options:
    rebuild: { en: "Vector indexes that use an earlier format cannot be upgraded in place; they must be dropped and recreated.", fr: "Les index vectoriels qui utilisent un format antérieur ne peuvent pas être mis à niveau sur place ; ils doivent être supprimés puis recréés." }
    stale: { en: "ALLOW_STALE_VECTOR_INDEX lets earlier-version indexes accept writes with stale results; it does not change the index version or its post-filtering.", fr: "ALLOW_STALE_VECTOR_INDEX permet aux index de version antérieure d'accepter des écritures avec des résultats obsolètes ; il ne change ni la version de l'index ni son filtrage après recherche." }
references:
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
  - title: sys.vector_indexes (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-catalog-views/sys-vector-indexes-transact-sql
