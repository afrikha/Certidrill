id: dp800-3c-rag-requirements
objective: "3.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation plans an assistant that answers employee questions about internal policies stored in an Azure SQL database. Adatum is choosing between retrieval-augmented generation (RAG) and fine-tuning a language model.

    Which two requirements indicate that Adatum should choose RAG?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation prévoit un assistant qui répond aux questions des employés sur des stratégies internes stockées dans une base de données Azure SQL. Adatum hésite entre la génération augmentée par récupération (RAG) et le réglage précis (fine-tuning) d'un modèle de langage.

    Quelles sont les deux exigences qui indiquent qu'Adatum doit choisir RAG ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each answer must identify the policy records it was based on.", fr: "Chaque réponse doit identifier les enregistrements de stratégie sur lesquels elle s'appuie." } }
    - { id: b, text: { en: "The model must permanently adopt Adatum's tone in all answers.", fr: "Le modèle doit adopter durablement le ton d'Adatum dans toutes ses réponses." } }
    - { id: c, text: { en: "Policy data must not be sent to the model provider for training.", fr: "Les données des stratégies ne doivent pas être envoyées au fournisseur du modèle pour l'entraînement." } }
    - { id: d, text: { en: "The model must answer without any data retrieval at question time.", fr: "Le modèle doit répondre sans aucune récupération de données au moment de la question." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "With RAG you control retrieval, so you know which records informed each answer. Only the per-request context is sent to the model, while fine-tuning sends the data to the model provider for training."
    fr: "Avec RAG, vous contrôlez la récupération : vous savez quels enregistrements ont servi à chaque réponse. Seul le contexte de chaque requête est envoyé au modèle, alors que le fine-tuning envoie les données au fournisseur du modèle pour l'entraînement."
  options:
    b: { en: "A permanent change of style or behavior is the purpose of fine-tuning.", fr: "Un changement durable de style ou de comportement est l'objectif du fine-tuning." }
    d: { en: "RAG retrieves data at question time by design; answering without retrieval means the knowledge is baked into the model.", fr: "RAG récupère les données au moment de la question par principe ; répondre sans récupération suppose que les connaissances sont intégrées au modèle." }
references:
  - title: Identify RAG use cases and architecture
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/2-identify-rag-use-cases-architecture
