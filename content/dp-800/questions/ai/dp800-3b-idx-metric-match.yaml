id: dp800-3b-idx-metric-match
objective: "3.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to create vector indexes on four columns of an Azure SQL database. Each column is described in the answer area.

    Which metric should you specify for each index? To answer, drag the appropriate values to the correct columns. Each value may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de créer des index vectoriels sur quatre colonnes d'une base de données Azure SQL. Chaque colonne est décrite dans la zone de réponse.

    Quelle métrique devez-vous indiquer pour chaque index ? Pour répondre, faites glisser les valeurs appropriées vers les colonnes correspondantes. Chaque valeur peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: cosine, text: "'cosine'" }
    - { id: dot, text: "'dot'" }
    - { id: euclidean, text: "'euclidean'" }
    - { id: norm2, text: "'norm2'" }
    - { id: norminf, text: "'norminf'" }
  targets:
    - { id: t1, text: { en: "Text embeddings from a model whose documentation recommends cosine similarity; the vectors are not normalized", fr: "Incorporations de texte d'un modèle dont la documentation recommande la similarité cosinus ; les vecteurs ne sont pas normalisés" } }
    - { id: t2, text: { en: "Embeddings from a model whose documentation recommends the dot product as similarity measure", fr: "Incorporations d'un modèle dont la documentation recommande le produit scalaire comme mesure de similarité" } }
    - { id: t3, text: { en: "Sensor feature vectors whose magnitude carries meaning, compared by straight-line distance", fr: "Vecteurs de caractéristiques de capteurs dont la magnitude a un sens, comparés par distance en ligne droite" } }
    - { id: t4, text: { en: "Normalized vectors searched by existing queries that specify METRIC = 'cosine'", fr: "Vecteurs normalisés recherchés par des requêtes existantes qui indiquent METRIC = 'cosine'" } }
answer:
  mapping: { t1: cosine, t2: dot, t3: euclidean, t4: cosine }
explanation:
  correct:
    en: |-
      Cosine distance measures the angle between vectors and ignores magnitude, which suits text embeddings, and the best metric is the one the model was trained for. Euclidean distance considers both direction and magnitude. For existing queries, the index metric must equal the query metric, or the index is not used.
    fr: |-
      La distance cosinus mesure l'angle entre les vecteurs et ignore la magnitude, ce qui convient aux incorporations de texte, et la meilleure métrique est celle pour laquelle le modèle a été entraîné. La distance euclidienne tient compte à la fois de la direction et de la magnitude. Pour des requêtes existantes, la métrique de l'index doit être égale à celle de la requête, sinon l'index n'est pas utilisé.
  options:
    norm2: { en: "norm2 is a norm type of VECTOR_NORMALIZE and VECTOR_NORM, not a metric of CREATE VECTOR INDEX.", fr: "norm2 est un type de norme de VECTOR_NORMALIZE et VECTOR_NORM, pas une métrique de CREATE VECTOR INDEX." }
    norminf: { en: "norminf is a norm type of VECTOR_NORMALIZE and VECTOR_NORM, not a metric of CREATE VECTOR INDEX.", fr: "norminf est un type de norme de VECTOR_NORMALIZE et VECTOR_NORM, pas une métrique de CREATE VECTOR INDEX." }
references:
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
  - title: Prepare SQL for vector search
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/04-prepare-sql-vector-search
