id: dp800-3b-vec-index-rules
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Docs. The table has a column named Embedding of type VECTOR(1536) and 250,000 rows. You created a vector index on Embedding by using the latest index version.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Docs. La table possède une colonne nommée Embedding de type VECTOR(1536) et 250 000 lignes. Vous avez créé un index vectoriel sur Embedding avec la dernière version d'index.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          You can create a vector index on a view that exposes the Embedding column of dbo.Docs.
        fr: |-
          Vous pouvez créer un index vectoriel sur une vue qui expose la colonne Embedding de dbo.Docs.
    - id: s2
      text:
        en: |-
          You can run INSERT and UPDATE statements on dbo.Docs without dropping the vector index.
        fr: |-
          Vous pouvez exécuter des instructions INSERT et UPDATE sur dbo.Docs sans supprimer l'index vectoriel.
    - id: s3
      text:
        en: |-
          You can run TRUNCATE TABLE dbo.Docs without dropping the vector index.
        fr: |-
          Vous pouvez exécuter TRUNCATE TABLE dbo.Docs sans supprimer l'index vectoriel.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      A vector index must be created on a base table; views and temporary tables are not supported. With the latest index version, the table is no longer read-only, and INSERT, UPDATE, DELETE and MERGE are supported without rebuilding the index. TRUNCATE TABLE is not allowed on a table that has a vector index: you drop the index, truncate, reload at least 100 rows and recreate the index.
    fr: |-
      Un index vectoriel doit être créé sur une table de base ; les vues et les tables temporaires ne sont pas prises en charge. Avec la dernière version d'index, la table n'est plus en lecture seule, et INSERT, UPDATE, DELETE et MERGE sont pris en charge sans reconstruire l'index. TRUNCATE TABLE n'est pas autorisé sur une table qui possède un index vectoriel : vous supprimez l'index, tronquez la table, rechargez au moins 100 lignes et recréez l'index.
references:
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
