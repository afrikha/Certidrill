id: dp800-3a-credential-name-match
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL database that contains a database scoped credential named [https://aoai-fabrikam.cognitiveservices.azure.com/openai/deployments/embed-small/]. The credential uses a managed identity.

    You run the following statement.

    ```sql
    CREATE EXTERNAL MODEL DocEmbedder
    WITH (
        LOCATION = 'https://aoai-fabrikam.cognitiveservices.azure.com/openai/deployments/embed-large/embeddings?api-version=2024-02-01',
        API_FORMAT = 'Azure OpenAI',
        MODEL_TYPE = EMBEDDINGS,
        MODEL = 'text-embedding-3-large',
        CREDENTIAL = [https://aoai-fabrikam.cognitiveservices.azure.com/openai/deployments/embed-small/]
    );
    ```

    Calls to DocEmbedder fail because the credential doesn't match the called URL. You need to create one credential that DocEmbedder and future models that call other deployments of the same Azure OpenAI resource can use.

    Which name should you give the new credential?
  fr: |
    Fabrikam dispose d'une base de données Azure SQL qui contient des informations d'identification délimitées à la base de données nommées [https://aoai-fabrikam.cognitiveservices.azure.com/openai/deployments/embed-small/]. Elles utilisent une identité managée.

    Vous exécutez l'instruction suivante.

    ```sql
    CREATE EXTERNAL MODEL DocEmbedder
    WITH (
        LOCATION = 'https://aoai-fabrikam.cognitiveservices.azure.com/openai/deployments/embed-large/embeddings?api-version=2024-02-01',
        API_FORMAT = 'Azure OpenAI',
        MODEL_TYPE = EMBEDDINGS,
        MODEL = 'text-embedding-3-large',
        CREDENTIAL = [https://aoai-fabrikam.cognitiveservices.azure.com/openai/deployments/embed-small/]
    );
    ```

    Les appels à DocEmbedder échouent, car les informations d'identification ne correspondent pas à l'URL appelée. Vous devez créer des informations d'identification que DocEmbedder et les futurs modèles qui appellent d'autres déploiements de la même ressource Azure OpenAI pourront utiliser.

    Quel nom devez-vous donner aux nouvelles informations d'identification ?
body:
  options:
    - { id: a, text: "[http://aoai-fabrikam.cognitiveservices.azure.com/]" }
    - { id: b, text: "[https://aoai-fabrikam.cognitiveservices.azure.com/]" }
    - { id: c, text: "[https://cognitiveservices.azure.com/]" }
    - { id: d, text: "[https://aoai-fabrikam.cognitiveservices.azure.com/openai/deployments/embed-large/embeddings?api-version=2024-02-01]" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The credential name must be a URL that matches the protocol and the fully qualified domain name of the called URL, matches each path segment it contains, and is the same as or more generic than the request path. The root URL of the resource matches the embed-large path and the path of any other deployment of aoai-fabrikam. The existing credential fails because its embed-small segment doesn't match embed-large.
    fr: |
      Le nom des informations d'identification doit être une URL qui correspond au protocole et au nom de domaine complet de l'URL appelée, qui correspond à chaque segment de chemin qu'elle contient, et qui est identique au chemin de la requête ou plus générique. L'URL racine de la ressource correspond au chemin embed-large et au chemin de tout autre déploiement d'aoai-fabrikam. Les informations d'identification existantes échouent, car leur segment embed-small ne correspond pas à embed-large.
  options:
    a: { en: "The protocol must match the called URL, which uses HTTPS; remote endpoints of external models only support HTTPS.", fr: "Le protocole doit correspondre à l'URL appelée, qui utilise HTTPS ; les points de terminaison distants des modèles externes ne prennent en charge que HTTPS." }
    c: { en: "The fully qualified domain name must match aoai-fabrikam.cognitiveservices.azure.com; a parent domain doesn't match.", fr: "Le nom de domaine complet doit correspondre à aoai-fabrikam.cognitiveservices.azure.com ; un domaine parent ne correspond pas." }
    d: { en: "A credential name can't contain a query string, and a path that ends with embed-large wouldn't serve other deployments.", fr: "Un nom d'informations d'identification ne peut pas contenir de chaîne de requête, et un chemin qui se termine par embed-large ne servirait pas les autres déploiements." }
references:
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
