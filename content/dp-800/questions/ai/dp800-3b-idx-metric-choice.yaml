id: dp800-3b-idx-metric-choice
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that stores text embeddings in a column named ReviewVector. The embeddings come from a model whose documentation recommends cosine similarity. The model does not return normalized vectors, and you store them unchanged.

    You need to create a vector index for the approximate searches that the application runs on ReviewVector.

    Which metric configuration should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL qui stocke des incorporations de texte dans une colonne nommée ReviewVector. Les incorporations proviennent d'un modèle dont la documentation recommande la similarité cosinus. Le modèle ne renvoie pas de vecteurs normalisés, et vous les stockez sans modification.

    Vous devez créer un index vectoriel pour les recherches approximatives que l'application exécute sur ReviewVector.

    Quelle configuration de métrique devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "METRIC = 'cosine' in the index and in the queries", fr: "METRIC = 'cosine' dans l'index et dans les requêtes" } }
    - { id: b, text: { en: "METRIC = 'dot' in the index and in the queries", fr: "METRIC = 'dot' dans l'index et dans les requêtes" } }
    - { id: c, text: { en: "METRIC = 'euclidean' in the index and in the queries", fr: "METRIC = 'euclidean' dans l'index et dans les requêtes" } }
    - { id: d, text: { en: "METRIC = 'cosine' in the index and METRIC = 'dot' in the queries", fr: "METRIC = 'cosine' dans l'index et METRIC = 'dot' dans les requêtes" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Most text embedding models are optimized for cosine similarity, and cosine distance ignores the magnitude of non-normalized vectors. VECTOR_SEARCH uses an index only when the index is on the same column with the same metric, so the index and the queries both use cosine.
    fr: |-
      La plupart des modèles d'incorporation de texte sont optimisés pour la similarité cosinus, et la distance cosinus ignore la magnitude des vecteurs non normalisés. VECTOR_SEARCH n'utilise un index que s'il porte sur la même colonne avec la même métrique : l'index et les requêtes utilisent donc tous deux cosine.
  options:
    b: { en: "On non-normalized vectors, the dot product depends on their magnitude and does not rank the rows like cosine similarity.", fr: "Sur des vecteurs non normalisés, le produit scalaire dépend de leur magnitude et ne classe pas les lignes comme la similarité cosinus." }
    c: { en: "Euclidean distance takes magnitude into account and does not follow the model's recommendation.", fr: "La distance euclidienne tient compte de la magnitude et ne suit pas la recommandation du modèle." }
    d: { en: "A query metric that differs from the index metric cannot use the index: the engine raises a warning and runs a kNN scan.", fr: "Une métrique de requête différente de celle de l'index ne peut pas utiliser l'index : le moteur émet un avertissement et exécute une analyse kNN." }
references:
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
