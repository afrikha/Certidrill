id: dp800-3a-alter-model-location
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure SQL database that contains an external model named EmbedModel. Fifteen stored procedures call AI_GENERATE_EMBEDDINGS with EmbedModel, and the app_search role has the EXECUTE permission on EmbedModel. The model's credential is named after the root URL of the Azure OpenAI resource.

    The AI team redeploys the same text-embedding-3-small model under a new deployment named embed-v2 on the same resource. You need the stored procedures to use embed-v2. The solution must meet the following requirements:

    - Don't modify the stored procedures.
    - Keep the existing permissions on EmbedModel.

    What should you do?
  fr: |
    Litware dispose d'une base de données Azure SQL qui contient un modèle externe nommé EmbedModel. Quinze procédures stockées appellent AI_GENERATE_EMBEDDINGS avec EmbedModel, et le rôle app_search dispose de l'autorisation EXECUTE sur EmbedModel. Les informations d'identification du modèle portent le nom de l'URL racine de la ressource Azure OpenAI.

    L'équipe IA redéploie le même modèle text-embedding-3-small sous un nouveau déploiement nommé embed-v2 sur la même ressource. Les procédures stockées doivent utiliser embed-v2. La solution doit satisfaire les exigences suivantes :

    - Ne pas modifier les procédures stockées.
    - Conserver les autorisations existantes sur EmbedModel.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Drop EmbedModel, and then create EmbedModel again with the LOCATION of embed-v2.", fr: "Supprimer EmbedModel, puis recréer EmbedModel avec le LOCATION d'embed-v2." } }
    - { id: b, text: { en: "Create a database scoped credential named after the URL of embed-v2.", fr: "Créer des informations d'identification délimitées à la base de données portant le nom de l'URL d'embed-v2." } }
    - { id: c, text: { en: "Pass the LOCATION of embed-v2 in the PARAMETERS argument of each call.", fr: "Passer le LOCATION d'embed-v2 dans l'argument PARAMETERS de chaque appel." } }
    - { id: d, text: { en: "Run ALTER EXTERNAL MODEL on EmbedModel to set the LOCATION of embed-v2.", fr: "Exécuter ALTER EXTERNAL MODEL sur EmbedModel pour définir le LOCATION d'embed-v2." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      ALTER EXTERNAL MODEL ... SET changes the endpoint, credential or settings of an existing model, so every query that references EmbedModel by name uses the new deployment without being rewritten. The object isn't recreated, so the EXECUTE permission granted to app_search remains, and the credential named after the resource root URL still matches the new path. Because the model itself is the same, the stored vectors stay comparable.
    fr: |
      ALTER EXTERNAL MODEL ... SET modifie le point de terminaison, les informations d'identification ou les paramètres d'un modèle existant : chaque requête qui référence EmbedModel par son nom utilise le nouveau déploiement sans être réécrite. L'objet n'est pas recréé, donc l'autorisation EXECUTE accordée à app_search est conservée, et les informations d'identification nommées d'après l'URL racine de la ressource correspondent toujours au nouveau chemin. Le modèle étant le même, les vecteurs stockés restent comparables.
  options:
    a: { en: "Dropping the model also removes the permissions granted on it, so app_search would lose EXECUTE.", fr: "Supprimer le modèle supprime aussi les autorisations accordées sur lui : app_search perdrait EXECUTE." }
    b: { en: "A credential only authenticates calls; the endpoint that is called comes from the model's LOCATION.", fr: "Des informations d'identification ne font qu'authentifier les appels ; le point de terminaison appelé provient du LOCATION du modèle." }
    c: { en: "PARAMETERS adds JSON to the request body; it can't change the URL, and changing each call means modifying the procedures.", fr: "PARAMETERS ajoute du JSON au corps de la requête ; il ne peut pas changer l'URL, et modifier chaque appel revient à modifier les procédures." }
references:
  - title: ALTER EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-external-model-transact-sql
  - title: Create and manage external models in SQL
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/03-create-manage-external-model-sql
