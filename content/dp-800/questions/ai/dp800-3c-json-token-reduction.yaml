id: dp800-3c-json-token-reduction
objective: "3.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database. A RAG procedure builds its context with the following query.

    ```sql
    SET @context = (SELECT TOP (50) p.*
                    FROM dbo.Products AS p
                    ORDER BY VECTOR_DISTANCE('cosine', p.DescriptionVector, @qv)
                    FOR JSON PATH);
    ```

    dbo.Products contains the columns ProductId, Name, Description, ListPrice, Size, rowguid, ModifiedDate and DescriptionVector. Tests show that the five closest products are enough to answer the questions. The prompts are expensive and sometimes exceed the context window of the model.

    You need to reduce the number of tokens sent to the model without reducing the quality of the answers.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL. Une procédure RAG construit son contexte avec la requête suivante.

    ```sql
    SET @context = (SELECT TOP (50) p.*
                    FROM dbo.Products AS p
                    ORDER BY VECTOR_DISTANCE('cosine', p.DescriptionVector, @qv)
                    FOR JSON PATH);
    ```

    dbo.Products contient les colonnes ProductId, Name, Description, ListPrice, Size, rowguid, ModifiedDate et DescriptionVector. Les tests montrent que les cinq produits les plus proches suffisent pour répondre aux questions. Les invites coûtent cher et dépassent parfois la fenêtre de contexte du modèle.

    Vous devez réduire le nombre de jetons envoyés au modèle sans réduire la qualité des réponses.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add INCLUDE_NULL_VALUES to the FOR JSON clause.", fr: "Ajouter INCLUDE_NULL_VALUES à la clause FOR JSON." } }
    - { id: b, text: { en: "Replace TOP (50) with TOP (5).", fr: "Remplacer TOP (50) par TOP (5)." } }
    - { id: c, text: { en: "Replace FOR JSON PATH with FOR JSON AUTO.", fr: "Remplacer FOR JSON PATH par FOR JSON AUTO." } }
    - { id: d, text: { en: "Select only Name, Description, ListPrice and Size.", fr: "Sélectionner uniquement Name, Description, ListPrice et Size." } }
    - { id: e, text: { en: "Increase max_tokens in the payload.", fr: "Augmenter max_tokens dans la charge utile." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Every token costs money and counts against the context window. Sending only the columns that help answer removes the embedding vector, the internal ID, rowguid and the audit date, and limiting the rows to the five most relevant products removes context that the tests show isn't needed."
    fr: "Chaque jeton coûte de l'argent et compte dans la fenêtre de contexte. N'envoyer que les colonnes utiles à la réponse supprime le vecteur d'incorporation, l'ID interne, rowguid et la date d'audit, et limiter les lignes aux cinq produits les plus pertinents supprime un contexte dont les tests montrent qu'il n'est pas nécessaire."
  options:
    a: { en: "INCLUDE_NULL_VALUES adds properties for NULL columns, which increases the number of tokens.", fr: "INCLUDE_NULL_VALUES ajoute des propriétés pour les colonnes NULL, ce qui augmente le nombre de jetons." }
    c: { en: "With one table and no aliases, AUTO and PATH produce the same properties, so the size doesn't change.", fr: "Avec une seule table et sans alias, AUTO et PATH produisent les mêmes propriétés : la taille ne change pas." }
    e: { en: "max_tokens limits the length of the answer, not the size of the prompt, and a higher value can increase cost.", fr: "max_tokens limite la longueur de la réponse, pas la taille de l'invite, et une valeur plus élevée peut augmenter le coût." }
references:
  - title: Prepare retrieval context for augmentation
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/3-prepare-retrieval-context-augmentation
