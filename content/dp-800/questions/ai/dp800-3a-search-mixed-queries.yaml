id: dp800-3a-search-mixed-queries
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a support portal backed by an Azure SQL database that stores product articles. Some users type only a model number, some describe a problem in their own words, and many combine both, as in "XR-500 portable cooler leaking water".

    You can't predict how users will search. The portal must return one ranked list that contains articles matching the exact model number and articles matching the described problem.

    Which search approach should you implement?
  fr: |
    Contoso dispose d'un portail de support qui s'appuie sur une base de données Azure SQL stockant des articles sur les produits. Certains utilisateurs saisissent uniquement un numéro de modèle, d'autres décrivent un problème avec leurs propres mots, et beaucoup combinent les deux, comme dans « glacière portable XR-500 qui fuit ».

    Vous ne pouvez pas prévoir la façon dont les utilisateurs effectueront leurs recherches. Le portail doit renvoyer une seule liste classée qui contient les articles correspondant au numéro de modèle exact et ceux correspondant au problème décrit.

    Quelle approche de recherche devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Hybrid search ranked with reciprocal rank fusion", fr: "Une recherche hybride classée par fusion de classement réciproque" } }
    - { id: b, text: { en: "Vector search ranked by VECTOR_DISTANCE", fr: "Une recherche vectorielle classée par VECTOR_DISTANCE" } }
    - { id: c, text: { en: "Fuzzy matching ranked by EDIT_DISTANCE_SIMILARITY", fr: "Une correspondance approximative classée par EDIT_DISTANCE_SIMILARITY" } }
    - { id: d, text: { en: "Full-text search ranked with FREETEXTTABLE", fr: "Une recherche en texte intégral classée avec FREETEXTTABLE" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Hybrid search runs a full-text search and a vector search and merges the two ranked lists, for example with reciprocal rank fusion (RRF), which scores each article by its position in each list. Full-text search matches the exact model number and vector search matches the described problem, so it fits users whose search style can't be predicted.
    fr: |
      La recherche hybride exécute une recherche en texte intégral et une recherche vectorielle, puis fusionne les deux listes classées, par exemple avec la fusion de classement réciproque (RRF), qui note chaque article selon sa position dans chaque liste. Le texte intégral trouve le numéro de modèle exact et la recherche vectorielle trouve le problème décrit : elle convient quand on ne peut pas prévoir la façon de rechercher.
  options:
    d: { en: "Full-text search misses articles that describe the same problem with different words.", fr: "La recherche en texte intégral manque les articles qui décrivent le même problème avec d'autres mots." }
    b: { en: "Vector search can return related articles that lack the exact model number the user typed.", fr: "La recherche vectorielle peut renvoyer des articles apparentés sans le numéro de modèle exact saisi par l'utilisateur." }
    c: { en: "Fuzzy matching measures spelling distance between strings; it neither understands the described problem nor ranks long articles well.", fr: "La correspondance approximative mesure la distance d'orthographe entre des chaînes ; elle ne comprend pas le problème décrit et classe mal des articles longs." }
references:
  - title: Choose an intelligent search approach
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach
