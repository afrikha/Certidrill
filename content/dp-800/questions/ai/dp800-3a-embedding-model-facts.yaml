id: dp800-3a-embedding-model-facts
objective: "3.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is evaluating Azure OpenAI embedding models for an Azure SQL database that stores product data. The embeddings will be generated with AI_GENERATE_EMBEDDINGS.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam évalue des modèles d'incorporation Azure OpenAI pour une base de données Azure SQL qui stocke des données de produits. Les incorporations seront générées avec AI_GENERATE_EMBEDDINGS.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: text-embedding-3-large returns vectors of 3,072 dimensions unless the request sets a lower dimensions value.
        fr: text-embedding-3-large retourne des vecteurs de 3 072 dimensions, sauf si la requête définit une valeur dimensions inférieure.
    - id: s2
      text:
        en: text-embedding-3-small can generate an embedding directly from a product photo.
        fr: text-embedding-3-small peut générer une incorporation directement à partir d'une photo de produit.
    - id: s3
      text:
        en: text-embedding-3-small accepts more input tokens per request than text-embedding-ada-002 (version 2).
        fr: text-embedding-3-small accepte plus de jetons d'entrée par requête que text-embedding-ada-002 (version 2).
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      text-embedding-3-large has 3,072 output dimensions, and the third-generation models accept a dimensions parameter to return shorter vectors. The Azure OpenAI embedding models are text-only models: a photo requires a multimodal embedding model. text-embedding-3-small and text-embedding-ada-002 (version 2) share the same limit of 8,192 input tokens.
    fr: |
      text-embedding-3-large a 3 072 dimensions de sortie, et les modèles de troisième génération acceptent un paramètre dimensions pour retourner des vecteurs plus courts. Les modèles d'incorporation Azure OpenAI ne traitent que du texte : une photo exige un modèle d'incorporation multimodal. text-embedding-3-small et text-embedding-ada-002 (version 2) partagent la même limite de 8 192 jetons d'entrée.
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
