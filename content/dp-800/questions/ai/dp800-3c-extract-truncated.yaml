id: dp800-3c-extract-truncated
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database. A RAG procedure sends the following payload to a chat deployment by using sp_invoke_external_rest_endpoint and extracts the answer with OPENJSON into an nvarchar(max) variable.

    ```sql
    SET @payload = JSON_OBJECT(
        'messages': JSON_ARRAY(
            JSON_OBJECT('role': 'system', 'content': @rules),
            JSON_OBJECT('role': 'user', 'content': @user)),
        'max_tokens': 80,
        'temperature': 0.3);
    ```

    Users report that many answers end in the middle of a sentence. For these calls, the return value is 0 and $.result.choices[0].finish_reason is length.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL. Une procédure RAG envoie la charge utile suivante à un déploiement de conversation avec sp_invoke_external_rest_endpoint et extrait la réponse avec OPENJSON dans une variable nvarchar(max).

    ```sql
    SET @payload = JSON_OBJECT(
        'messages': JSON_ARRAY(
            JSON_OBJECT('role': 'system', 'content': @rules),
            JSON_OBJECT('role': 'user', 'content': @user)),
        'max_tokens': 80,
        'temperature': 0.3);
    ```

    Des utilisateurs signalent que de nombreuses réponses s'arrêtent au milieu d'une phrase. Pour ces appels, la valeur de retour vaut 0 et $.result.choices[0].finish_reason vaut length.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the value of max_tokens.", fr: "Augmenter la valeur de max_tokens." } }
    - { id: b, text: { en: "Increase the value of @timeout.", fr: "Augmenter la valeur de @timeout." } }
    - { id: c, text: { en: "Lower the value of temperature.", fr: "Réduire la valeur de temperature." } }
    - { id: d, text: { en: "Add @retry_count = 3 to the call.", fr: "Ajouter @retry_count = 3 à l'appel." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A finish_reason of length means that the output stopped because it reached the token limit set by max_tokens (max_completion_tokens for reasoning models). A limit of 80 tokens is too low for full answers; raising it lets the model finish, and finish_reason then becomes stop."
    fr: "Un finish_reason égal à length signifie que la sortie s'est arrêtée en atteignant la limite de jetons fixée par max_tokens (max_completion_tokens pour les modèles de raisonnement). Une limite de 80 jetons est trop basse pour des réponses complètes ; l'augmenter permet au modèle de terminer, et finish_reason devient alors stop."
  options:
    b: { en: "The call succeeded with a 2xx status; a timeout would fail the call instead of returning a cut answer.", fr: "L'appel a réussi avec un statut 2xx ; un dépassement de délai ferait échouer l'appel au lieu de renvoyer une réponse coupée." }
    c: { en: "Temperature changes how varied the text is, not how long it can be.", fr: "La température modifie la variété du texte, pas sa longueur possible." }
    d: { en: "Retries only apply to failed HTTP statuses such as 429 or 503; these calls succeeded.", fr: "Les nouvelles tentatives ne s'appliquent qu'aux statuts HTTP en échec comme 429 ou 503 ; ces appels ont réussi." }
references:
  - title: Work with chat completion models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/chatgpt
