id: dp800-3a-separate-embedding-table
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure SQL database that contains a table named dbo.Articles with the columns ArticleID, Title and Body. You will embed Title and Body for semantic search.

    The design must meet the following requirements:

    - The storage used by the vectors must be easy to measure separately.
    - All the embeddings can be rebuilt with another model without writing to dbo.Articles.

    Where should you store the vectors?
  fr: |
    Adatum dispose d'une base de données Azure SQL qui contient une table nommée dbo.Articles avec les colonnes ArticleID, Title et Body. Vous incorporerez Title et Body pour la recherche sémantique.

    La conception doit satisfaire les exigences suivantes :

    - Le stockage utilisé par les vecteurs doit être facile à mesurer séparément.
    - Toutes les incorporations peuvent être reconstruites avec un autre modèle sans écrire dans dbo.Articles.

    Où devez-vous stocker les vecteurs ?
body:
  options:
    - { id: a, text: { en: "In a vector column added to dbo.Articles", fr: "Dans une colonne vector ajoutée à dbo.Articles" } }
    - { id: b, text: { en: "In an nvarchar(max) column of dbo.Articles, as a JSON array", fr: "Dans une colonne nvarchar(max) de dbo.Articles, sous forme de tableau JSON" } }
    - { id: c, text: { en: "In a separate embeddings table keyed by ArticleID", fr: "Dans une table d'incorporations distincte, indexée par ArticleID" } }
    - { id: d, text: { en: "In the history table of a system-versioned dbo.Articles", fr: "Dans la table d'historique d'une table dbo.Articles avec version système" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Storing vectors in a dedicated embeddings table, keyed by the source row, isolates the space they consume and lets you rebuild or replace all the embeddings without touching the source data.
    fr: |
      Stocker les vecteurs dans une table d'incorporations dédiée, indexée par la ligne source, isole l'espace qu'ils consomment et permet de reconstruire ou de remplacer toutes les incorporations sans toucher aux données sources.
  options:
    a: { en: "A column in dbo.Articles mixes vector storage with the source rows, and rebuilding the embeddings writes to dbo.Articles.", fr: "Une colonne dans dbo.Articles mêle le stockage des vecteurs aux lignes sources, et reconstruire les incorporations écrit dans dbo.Articles." }
    b: { en: "A JSON string is larger than the native vector format and also requires writing to dbo.Articles.", fr: "Une chaîne JSON est plus volumineuse que le format vector natif et exige aussi d'écrire dans dbo.Articles." }
    d: { en: "A history table stores previous versions of rows; the system writes to it only when dbo.Articles changes.", fr: "Une table d'historique stocke les versions précédentes des lignes ; le système n'y écrit que lorsque dbo.Articles change." }
references:
  - title: Design embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads
