id: dp800-3b-hy-filter-placement
objective: "3.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a property rental site on an Azure SQL database. A hybrid search over dbo.Listings retrieves 50 candidates from a full-text search and 50 candidates from a vector search, fuses the two lists with RRF, and returns the top 10 listings.

    The search must return only the available listings in the city that the user selects. The results must keep as many relevant listings as possible.

    You need to apply the city and availability filters.

    Where should you apply the filters?
  fr: |
    Contoso exploite un site de location de logements sur une base de données Azure SQL. Une recherche hybride sur dbo.Listings récupère 50 candidats d'une recherche en texte intégral et 50 candidats d'une recherche vectorielle, fusionne les deux listes avec RRF et renvoie les 10 meilleures annonces.

    La recherche doit renvoyer uniquement les annonces disponibles dans la ville que l'utilisateur sélectionne. Les résultats doivent conserver le plus d'annonces pertinentes possible.

    Vous devez appliquer les filtres de ville et de disponibilité.

    Où devez-vous appliquer les filtres ?
body:
  options:
    - { id: a, text: { en: "In the final query, after the RRF score of each listing is computed", fr: "Dans la requête finale, après le calcul du score RRF de chaque annonce" } }
    - { id: b, text: { en: "In both the full-text query and the vector query, before the two lists are fused", fr: "Dans la requête en texte intégral et dans la requête vectorielle, avant la fusion des deux listes" } }
    - { id: c, text: { en: "Only in the vector query, because it returns the semantically closest listings", fr: "Uniquement dans la requête vectorielle, car elle renvoie les annonces les plus proches par le sens" } }
    - { id: d, text: { en: "Only in the final join to dbo.Listings that returns the listing details", fr: "Uniquement dans la jointure finale avec dbo.Listings qui renvoie le détail des annonces" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Filters should be applied before the hybrid fusion when possible. When each search keeps only qualifying listings, its 50 candidates are all usable, whereas filtering after RRF can remove highly ranked results and leave too few listings.
    fr: |-
      Les filtres doivent être appliqués avant la fusion hybride lorsque c'est possible. Quand chaque recherche ne conserve que les annonces qui remplissent les conditions, ses 50 candidats sont tous utilisables, alors qu'un filtrage après RRF peut supprimer des résultats bien classés et laisser trop peu d'annonces.
  options:
    a: { en: "Filtering after the fusion can eliminate many of the 100 candidates and return fewer than 10 listings.", fr: "Filtrer après la fusion peut éliminer une grande partie des 100 candidats et renvoyer moins de 10 annonces." }
    c: { en: "The full-text candidates would still include listings from other cities or unavailable listings.", fr: "Les candidats en texte intégral incluraient toujours des annonces d'autres villes ou indisponibles." }
    d: { en: "Filtering in the final join removes candidates after the fusion, with the same loss of results as a filter on the RRF output.", fr: "Filtrer dans la jointure finale supprime des candidats après la fusion, avec la même perte de résultats qu'un filtre sur la sortie de RRF." }
references:
  - title: Implement hybrid search and ranking
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
