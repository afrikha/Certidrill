id: dp800-3c-send-rag-steps
objective: "3.3.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Products with a DescriptionVector column. An external model named ProductEmbeddings and a database scoped credential for an Azure OpenAI resource exist.

    You are writing a stored procedure that answers a customer question from the product data by using a chat deployment.

    Which five actions should the procedure perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Products avec une colonne DescriptionVector. Un modèle externe nommé ProductEmbeddings et des informations d'identification délimitées à la base de données pour une ressource Azure OpenAI existent.

    Vous écrivez une procédure stockée qui répond à la question d'un client à partir des données des produits en utilisant un déploiement de conversation.

    Quelles sont les cinq actions que la procédure doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: emb, text: { en: "Generate the embedding of the question with AI_GENERATE_EMBEDDINGS.", fr: "Générer l'incorporation de la question avec AI_GENERATE_EMBEDDINGS." } }
    - { id: ret, text: { en: "Retrieve the closest products and format them with FOR JSON PATH.", fr: "Récupérer les produits les plus proches et les mettre en forme avec FOR JSON PATH." } }
    - { id: pay, text: { en: "Build the messages payload with JSON_OBJECT and JSON_ARRAY.", fr: "Construire la charge utile messages avec JSON_OBJECT et JSON_ARRAY." } }
    - { id: call, text: { en: "Run sp_invoke_external_rest_endpoint with the payload.", fr: "Exécuter sp_invoke_external_rest_endpoint avec la charge utile." } }
    - { id: ext, text: { en: "Read $.result.choices[0].message.content from @response.", fr: "Lire $.result.choices[0].message.content dans @response." } }
    - { id: idx, text: { en: "Create a vector index on the embedding of the question.", fr: "Créer un index vectoriel sur l'incorporation de la question." } }
    - { id: ft, text: { en: "Send the retrieved products to the model as fine-tuning data.", fr: "Envoyer les produits récupérés au modèle comme données de fine-tuning." } }
answer:
  sequence: [ emb, ret, pay, call, ext ]
explanation:
  correct:
    en: "The question is embedded first because the retrieval compares that vector with DescriptionVector. The retrieved rows are formatted as JSON, placed with the instructions and the question in the messages payload, and sent with sp_invoke_external_rest_endpoint. The answer is then read from the result part of the response envelope."
    fr: "La question est d'abord transformée en incorporation, car la récupération compare ce vecteur avec DescriptionVector. Les lignes récupérées sont mises au format JSON, placées avec les instructions et la question dans la charge utile messages, puis envoyées avec sp_invoke_external_rest_endpoint. La réponse est ensuite lue dans la partie result de l'enveloppe de réponse."
  options:
    idx: { en: "A vector index is created once on a table column, not on a single question vector at each call.", fr: "Un index vectoriel se crée une fois sur une colonne de table, pas sur le vecteur d'une question à chaque appel." }
    ft: { en: "RAG adds the rows to the prompt of each request; it doesn't train the model.", fr: "RAG ajoute les lignes à l'invite de chaque requête ; il n'entraîne pas le modèle." }
references:
  - title: Generate and process RAG responses
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/5-generate-process-rag-responses
