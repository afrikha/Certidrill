id: dp800-3a-model-setup-order
objective: "3.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a SQL Server 2025 database named SalesDb. The external rest endpoint enabled server configuration option is already set to 1. SalesDb has no database master key.

    An Azure OpenAI resource accepts API key authentication only. A database role named app_writer must be able to generate embeddings with AI_GENERATE_EMBEDDINGS. The solution must follow the principle of least privilege.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'une base de données SQL Server 2025 nommée SalesDb. L'option de configuration de serveur external rest endpoint enabled est déjà définie à 1. SalesDb n'a pas de clé principale de base de données.

    Une ressource Azure OpenAI n'accepte que l'authentification par clé API. Un rôle de base de données nommé app_writer doit pouvoir générer des incorporations avec AI_GENERATE_EMBEDDINGS. La solution doit respecter le principe du privilège minimum.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: mk, text: { en: "Create a database master key in SalesDb.", fr: "Créer une clé principale de base de données dans SalesDb." } }
    - { id: cred, text: { en: "Create a database scoped credential with IDENTITY = 'HTTPEndpointHeaders' that stores the API key.", fr: "Créer des informations d'identification délimitées à la base de données avec IDENTITY = 'HTTPEndpointHeaders' qui stockent la clé API." } }
    - { id: model, text: { en: "Create an external model of type EMBEDDINGS that references the credential.", fr: "Créer un modèle externe de type EMBEDDINGS qui référence les informations d'identification." } }
    - { id: grant, text: { en: "Grant EXECUTE on the external model to app_writer.", fr: "Accorder EXECUTE sur le modèle externe à app_writer." } }
    - { id: scoped, text: { en: "Set the allow server scoped db credentials option to 1.", fr: "Définir l'option allow server scoped db credentials à 1." } }
    - { id: alter, text: { en: "Grant ALTER ANY EXTERNAL MODEL to app_writer.", fr: "Accorder ALTER ANY EXTERNAL MODEL à app_writer." } }
    - { id: eds, text: { en: "Create an external data source for the Azure OpenAI endpoint.", fr: "Créer une source de données externe pour le point de terminaison Azure OpenAI." } }
answer:
  sequence: [ mk, cred, model, grant ]
explanation:
  correct:
    en: |
      A database must have a master key before you can create a database scoped credential, which protects the API key in its secret. The external model references the credential by name, so the credential must exist first. Finally, EXECUTE on the model is the only permission app_writer needs to use it in AI_GENERATE_EMBEDDINGS.
    fr: |
      Une base de données doit avoir une clé principale avant que vous puissiez créer des informations d'identification délimitées à la base de données, qui protègent la clé API dans leur secret. Le modèle externe référence les informations d'identification par leur nom : elles doivent donc exister avant. Enfin, EXECUTE sur le modèle est la seule autorisation dont app_writer a besoin pour l'utiliser dans AI_GENERATE_EMBEDDINGS.
  options:
    scoped: { en: "allow server scoped db credentials is required for managed identity authentication through Azure Arc, not for an API key.", fr: "allow server scoped db credentials est nécessaire pour l'authentification par identité managée via Azure Arc, pas pour une clé API." }
    alter: { en: "ALTER ANY EXTERNAL MODEL lets the role change or drop models, which exceeds least privilege.", fr: "ALTER ANY EXTERNAL MODEL permet au rôle de modifier ou de supprimer des modèles, ce qui dépasse le privilège minimum." }
    eds: { en: "External data sources serve data virtualization; an external model stores its own LOCATION.", fr: "Les sources de données externes servent à la virtualisation des données ; un modèle externe stocke son propre LOCATION." }
references:
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
  - title: CREATE DATABASE SCOPED CREDENTIAL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-database-scoped-credential-transact-sql
