id: dp800-3b-fts-predicates
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are implementing full-text search on an Azure SQL database table named dbo.Recipes. The Instructions column is covered by a full-text index.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous implémentez la recherche en texte intégral sur une table de base de données Azure SQL nommée dbo.Recipes. La colonne Instructions est couverte par un index de recherche en texte intégral.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In a FREETEXT search text, the word AND requires both surrounding words to be present.", fr: "Dans un texte recherché par FREETEXT, le mot AND exige la présence des deux mots qui l'entourent." } }
    - { id: b, text: { en: "FREETEXT automatically matches the inflectional forms of the words in the search text.", fr: "FREETEXT trouve automatiquement les formes fléchies des mots du texte recherché." } }
    - { id: c, text: { en: "CONTAINS returns a relevance value that you can reference in the ORDER BY clause.", fr: "CONTAINS renvoie une valeur de pertinence que vous pouvez référencer dans la clause ORDER BY." } }
    - { id: d, text: { en: "You can create a second full-text index on dbo.Recipes if it uses another catalog.", fr: "Vous pouvez créer un second index de recherche en texte intégral sur dbo.Recipes s'il utilise un autre catalogue." } }
    - { id: e, text: { en: "CONTAINSTABLE returns a RANK value from 0 through 1000 that you can use to sort the rows.", fr: "CONTAINSTABLE renvoie une valeur RANK comprise entre 0 et 1 000 que vous pouvez utiliser pour trier les lignes." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      FREETEXT word-breaks the search text, generates the inflectional forms of each word and applies the thesaurus before matching. CONTAINSTABLE returns a KEY column and a RANK column whose value, from 0 through 1000, shows how well each row matched, so you can order by it.
    fr: |-
      FREETEXT découpe le texte recherché en mots, génère les formes fléchies de chaque mot et applique le dictionnaire des synonymes avant la recherche. CONTAINSTABLE renvoie une colonne KEY et une colonne RANK dont la valeur, de 0 à 1 000, indique la qualité de la correspondance de chaque ligne : vous pouvez trier sur cette valeur.
  options:
    a: { en: "In a FREETEXT search text, and is treated as a stopword and discarded; AND is a Boolean keyword only in CONTAINS conditions.", fr: "Dans un texte recherché par FREETEXT, and est traité comme un mot vide et ignoré ; AND n'est un mot clé booléen que dans les conditions CONTAINS." }
    c: { en: "CONTAINS is a predicate that only filters rows; a relevance value requires CONTAINSTABLE or FREETEXTTABLE.", fr: "CONTAINS est un prédicat qui filtre seulement les lignes ; une valeur de pertinence exige CONTAINSTABLE ou FREETEXTTABLE." }
    d: { en: "Only one full-text index is allowed per table, whatever the catalog.", fr: "Un seul index de recherche en texte intégral est autorisé par table, quel que soit le catalogue." }
references:
  - title: FREETEXT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/freetext-transact-sql
  - title: CONTAINSTABLE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-functions/containstable-transact-sql
