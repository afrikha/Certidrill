id: dp800-3a-embed-columns-products
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure SQL database that contains the dbo.Products table shown in the following table.

    | Column | Data type | Example |
    | --- | --- | --- |
    | ProductID | int | 1842 |
    | SKU | varchar(20) | TS-48211 |
    | Name | nvarchar(100) | Trail Runner 2 |
    | Description | nvarchar(max) | Lightweight shoe with a grippy sole for muddy mountain trails... |
    | ListPrice | money | 129.00 |
    | StockQty | int | 37 |
    | ModifiedDate | datetime2 | 2026-10-04 08:12 |

    You plan to generate one embedding per product so that customers can describe what they need in their own words. The solution must maximize relevance and minimize token usage.

    Which columns should you include in the text that you embed?
  fr: |
    Proseware dispose d'une base de données Azure SQL qui contient la table dbo.Products présentée dans le tableau suivant.

    | Colonne | Type de données | Exemple |
    | --- | --- | --- |
    | ProductID | int | 1842 |
    | SKU | varchar(20) | TS-48211 |
    | Name | nvarchar(100) | Trail Runner 2 |
    | Description | nvarchar(max) | Chaussure légère à semelle adhérente pour sentiers de montagne boueux... |
    | ListPrice | money | 129.00 |
    | StockQty | int | 37 |
    | ModifiedDate | datetime2 | 2026-10-04 08:12 |

    Vous prévoyez de générer une incorporation par produit pour que les clients puissent décrire leur besoin avec leurs propres mots. La solution doit maximiser la pertinence et réduire au minimum l'utilisation de jetons.

    Quelles colonnes devez-vous inclure dans le texte à incorporer ?
body:
  options:
    - { id: a, text: { en: "Name and Description", fr: "Name et Description" } }
    - { id: b, text: { en: "ProductID, Name and ListPrice", fr: "ProductID, Name et ListPrice" } }
    - { id: c, text: { en: "All seven columns, concatenated", fr: "Les sept colonnes, concaténées" } }
    - { id: d, text: { en: "SKU and Name", fr: "SKU et Name" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Embeddings should contain the free-form text that carries meaning, such as names, titles and descriptions. Identifiers, numeric values and operational metadata add tokens without improving similarity; they are handled with ordinary predicates or full-text search next to the vector search.
    fr: |
      Les incorporations doivent contenir le texte libre porteur de sens, comme les noms, les titres et les descriptions. Les identifiants, les valeurs numériques et les métadonnées opérationnelles ajoutent des jetons sans améliorer la similarité ; ils sont traités avec des prédicats ordinaires ou la recherche en texte intégral à côté de la recherche vectorielle.
  options:
    d: { en: "A SKU is an exact identifier: it adds tokens but no meaning, and the Description, which carries the semantics, is missing.", fr: "Un SKU est un identifiant exact : il ajoute des jetons mais aucun sens, et la Description, qui porte la sémantique, manque." }
    b: { en: "ProductID and ListPrice are an identifier and a number; vectors don't compare them, and the Description is missing.", fr: "ProductID et ListPrice sont un identifiant et un nombre ; les vecteurs ne les comparent pas, et la Description manque." }
    c: { en: "Embedding every column wastes tokens on identifiers, numbers and dates and dilutes the meaning of the vector.", fr: "Incorporer toutes les colonnes gaspille des jetons pour des identifiants, des nombres et des dates, et dilue le sens du vecteur." }
references:
  - title: Design embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads
