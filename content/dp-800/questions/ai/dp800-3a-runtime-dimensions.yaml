id: dp800-3a-runtime-dimensions
objective: "3.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure SQL database. An external model named EmbedModel calls a text-embedding-3-small deployment and is defined with PARAMETERS = '{"dimensions":1536}'. It fills dbo.DocEmbeddings, which has a VECTOR(1536) column.

    You create a table named dbo.DocEmbeddingsCompact that has an Embedding column of type VECTOR(512). You need to fill it by using EmbedModel without changing the definition of EmbedModel.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une base de données Azure SQL. Un modèle externe nommé EmbedModel appelle un déploiement text-embedding-3-small et est défini avec PARAMETERS = '{"dimensions":1536}'. Il remplit dbo.DocEmbeddings, qui contient une colonne VECTOR(1536).

    Vous créez une table nommée dbo.DocEmbeddingsCompact qui contient une colonne Embedding de type VECTOR(512). Vous devez la remplir à l'aide d'EmbedModel sans modifier la définition d'EmbedModel.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    DECLARE @p JSON = N'{"[[key]]": 512}';

    INSERT INTO dbo.DocEmbeddingsCompact (DocID, Embedding)
    SELECT d.DocID,
           AI_GENERATE_EMBEDDINGS(d.Summary USE MODEL EmbedModel [[kw]] @p)
    FROM dbo.Docs AS d;
  slots:
    - id: key
      options:
        - { id: dims, text: dimensions }
        - { id: tokens, text: max_tokens }
        - { id: retry, text: retry_count }
    - id: kw
      options:
        - { id: params, text: PARAMETERS }
        - { id: with, text: WITH }
        - { id: option, text: OPTION }
answer:
  values: { key: dims, kw: params }
explanation:
  correct:
    en: |
      The optional PARAMETERS clause of AI_GENERATE_EMBEDDINGS takes JSON that is added to the request body and overrides the matching values of the model definition. Passing {"dimensions": 512} makes text-embedding-3-small return 512 values for this statement only, which fit the VECTOR(512) column, while other queries keep 1,536 dimensions.
    fr: |
      La clause facultative PARAMETERS d'AI_GENERATE_EMBEDDINGS prend un JSON ajouté au corps de la requête, qui remplace les valeurs correspondantes de la définition du modèle. Passer {"dimensions": 512} fait retourner 512 valeurs par text-embedding-3-small pour cette instruction seulement, ce qui tient dans la colonne VECTOR(512), tandis que les autres requêtes conservent 1 536 dimensions.
  options:
    tokens: { en: "max_tokens limits the output of a generation model; an embedding's size is set by dimensions.", fr: "max_tokens limite la sortie d'un modèle de génération ; la taille d'une incorporation est définie par dimensions." }
    retry: { en: "retry_count, under sql_rest_options, sets the number of retries on transient HTTP errors.", fr: "retry_count, sous sql_rest_options, définit le nombre de nouvelles tentatives sur des erreurs HTTP temporaires." }
    with: { en: "WITH isn't the keyword of the function; runtime options follow PARAMETERS.", fr: "WITH n'est pas le mot clé de la fonction ; les options d'exécution suivent PARAMETERS." }
    option: { en: "OPTION sets query hints for a whole statement; it doesn't pass JSON to the model.", fr: "OPTION définit des indicateurs de requête pour toute une instruction ; il ne transmet pas de JSON au modèle." }
references:
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
