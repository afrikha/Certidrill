id: dp800-3a-smaller-model-switch
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure SQL database that contains 12 million short product titles. Each night, a job generates their embeddings by using an external model that calls a text-embedding-3-large deployment, and stores them in a VECTOR(3072, float16) column. Searches compare a query embedding with the stored vectors.

    A test shows that text-embedding-3-small gives acceptable relevance for these titles, and a VECTOR(1536) column has been added for its vectors. You need to reduce the cost and latency of embedding generation. Search results must stay correct.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une base de données Azure SQL qui contient 12 millions de titres de produits courts. Chaque nuit, un travail génère leurs incorporations à l'aide d'un modèle externe qui appelle un déploiement text-embedding-3-large, et les stocke dans une colonne VECTOR(3072, float16). Les recherches comparent une incorporation de requête aux vecteurs stockés.

    Un test montre que text-embedding-3-small offre une pertinence acceptable pour ces titres, et une colonne VECTOR(1536) a été ajoutée pour ses vecteurs. Vous devez réduire le coût et la latence de la génération des incorporations. Les résultats de recherche doivent rester corrects.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Point the external model to a text-embedding-3-small deployment.", fr: "Faire pointer le modèle externe vers un déploiement text-embedding-3-small." } }
    - { id: b, text: { en: "Regenerate the embeddings of all the stored titles with the new model.", fr: "Régénérer les incorporations de tous les titres stockés avec le nouveau modèle." } }
    - { id: c, text: { en: "Generate embeddings with the new model only for the titles added after the switch.", fr: "Générer des incorporations avec le nouveau modèle uniquement pour les titres ajoutés après le changement." } }
    - { id: d, text: { en: "Apply VECTOR_NORMALIZE to the stored vectors so that they match the new model.", fr: "Appliquer VECTOR_NORMALIZE aux vecteurs stockés pour qu'ils correspondent au nouveau modèle." } }
    - { id: e, text: { en: "Point the external model to a gpt-4.1-nano deployment.", fr: "Faire pointer le modèle externe vers un déploiement gpt-4.1-nano." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Larger models consume more resources and add latency and cost, while a smaller model often suffices for a focused task such as embedding generation. Vectors produced by different models aren't comparable, even after dimension changes, so switching models means regenerating every stored embedding into the new VECTOR(1536) column. Queries must then be embedded with the same new model.
    fr: |
      Les grands modèles consomment plus de ressources et ajoutent latence et coût, alors qu'un modèle plus petit suffit souvent pour une tâche ciblée comme la génération d'incorporations. Les vecteurs produits par des modèles différents ne sont pas comparables : changer de modèle oblige à régénérer toutes les incorporations stockées dans la nouvelle colonne VECTOR(1536). Les requêtes doivent ensuite être incorporées avec ce même nouveau modèle.
  options:
    c: { en: "Old vectors from text-embedding-3-large and new ones from text-embedding-3-small would be mixed, and they can't be compared with each other.", fr: "Les anciens vecteurs de text-embedding-3-large et les nouveaux de text-embedding-3-small seraient mélangés, et ils ne sont pas comparables entre eux." }
    d: { en: "Normalization scales a vector to length 1; it neither changes its dimensions nor converts it to another model's vector space.", fr: "La normalisation ramène un vecteur à une longueur de 1 ; elle ne change ni ses dimensions ni son espace vectoriel." }
    e: { en: "gpt-4.1-nano is a chat model; it doesn't return embeddings.", fr: "gpt-4.1-nano est un modèle de conversation ; il ne retourne pas d'incorporations." }
references:
  - title: Understand and evaluate models for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/02-understand-evaluate-models-sql-database-workloads
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
