id: dp800-3b-ann-large-table
objective: "3.2.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.CatalogItems. The table has 25 million rows, and the Embedding column of type VECTOR(1024) is filled for every row. The current search query uses VECTOR_DISTANCE with TOP (10) and takes several seconds.

    You need to minimize the latency of the search. A small loss of accuracy is acceptable.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.CatalogItems. La table compte 25 millions de lignes, et la colonne Embedding de type VECTOR(1024) est remplie pour chaque ligne. La requête de recherche actuelle utilise VECTOR_DISTANCE avec TOP (10) et prend plusieurs secondes.

    Vous devez réduire au minimum la latence de la recherche. Une petite perte de précision est acceptable.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a nonclustered index on the key column that includes Embedding.", fr: "Créer un index non cluster sur la colonne clé qui inclut Embedding." } }
    - { id: b, text: { en: "Create a vector index on Embedding that uses the same metric as the query.", fr: "Créer sur Embedding un index vectoriel qui utilise la même métrique que la requête." } }
    - { id: c, text: { en: "Partition the table and create a partitioned vector index on Embedding.", fr: "Partitionner la table et créer un index vectoriel partitionné sur Embedding." } }
    - { id: d, text: { en: "Rewrite the query to use VECTOR_SEARCH with SELECT TOP (10) WITH APPROXIMATE.", fr: "Réécrire la requête pour utiliser VECTOR_SEARCH avec SELECT TOP (10) WITH APPROXIMATE." } }
    - { id: e, text: { en: "Apply VECTOR_NORMALIZE to Embedding inside the VECTOR_DISTANCE call.", fr: "Appliquer VECTOR_NORMALIZE à Embedding dans l'appel à VECTOR_DISTANCE." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      For tens of millions of vectors, an approximate nearest neighbor (ANN) search trades a little recall for a large gain in speed. ANN requires a DiskANN vector index on the column with the same metric, and a query written with VECTOR_SEARCH and SELECT TOP (N) WITH APPROXIMATE; VECTOR_DISTANCE never uses the index.
    fr: |-
      Pour des dizaines de millions de vecteurs, une recherche de plus proches voisins approximatifs (ANN) échange un peu de rappel contre un gain de vitesse important. ANN exige un index vectoriel DiskANN sur la colonne, de même métrique, et une requête écrite avec VECTOR_SEARCH et SELECT TOP (N) WITH APPROXIMATE ; VECTOR_DISTANCE n'utilise jamais l'index.
  options:
    a: { en: "Including the vector in a B-tree index does not avoid computing the distance for every row.", fr: "Inclure le vecteur dans un index B-tree n'évite pas de calculer la distance pour chaque ligne." }
    c: { en: "Vector indexes cannot be partitioned.", fr: "Les index vectoriels ne peuvent pas être partitionnés." }
    e: { en: "Normalizing every row at query time adds work and still computes an exact distance for every row.", fr: "Normaliser chaque ligne au moment de la requête ajoute du travail et calcule toujours une distance exacte pour chaque ligne." }
references:
  - title: Vector search and vector indexes in the SQL Database Engine
    url: https://learn.microsoft.com/en-us/sql/sql-server/ai/vectors
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
