id: dp800-3a-search-described-needs
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure SQL database that stores outdoor products. A full-text index exists on the Description column, and the search page uses CONTAINS.

    Customers type requests such as "something to keep drinks cold on a hike". The matching products are described with words such as "insulated bottle" and "portable cooler", so the current search returns no results. You need the search to return these products.

    What should you implement?
  fr: |
    Tailspin Toys dispose d'une base de données Azure SQL qui stocke des produits de plein air. Un index de recherche en texte intégral existe sur la colonne Description, et la page de recherche utilise CONTAINS.

    Les clients saisissent des demandes telles que « quelque chose pour garder les boissons fraîches en randonnée ». Les produits correspondants sont décrits avec des mots comme « bouteille isotherme » et « glacière portable » : la recherche actuelle ne renvoie aucun résultat. La recherche doit renvoyer ces produits.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "FORMSOF(INFLECTIONAL, ...) conditions in the CONTAINS predicate", fr: "Des conditions FORMSOF(INFLECTIONAL, ...) dans le prédicat CONTAINS" } }
    - { id: b, text: { en: "The FREETEXT predicate in place of the CONTAINS predicate", fr: "Le prédicat FREETEXT à la place du prédicat CONTAINS" } }
    - { id: c, text: { en: "A custom full-text stoplist on the Description column", fr: "Une liste de mots vides personnalisée sur la colonne Description" } }
    - { id: d, text: { en: "Semantic vector search over embeddings of the descriptions", fr: "Une recherche vectorielle sémantique sur les incorporations des descriptions" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The customers describe a need instead of naming the product, and the descriptions share no words with the query. Vector search compares embeddings that represent meaning, so it can map "keep drinks cold on a hike" to insulated bottles and portable coolers.
    fr: |
      Les clients décrivent un besoin au lieu de nommer le produit, et les descriptions n'ont aucun mot commun avec la requête. La recherche vectorielle compare des incorporations qui représentent le sens : elle peut associer « garder les boissons fraîches en randonnée » aux bouteilles isothermes et aux glacières portables.
  options:
    a: { en: "Inflectional forms find ride, rides or riding, but not different words that express the same idea.", fr: "Les formes fléchies trouvent ride, rides ou riding, mais pas des mots différents qui expriment la même idée." }
    b: { en: "FREETEXT is more flexible on word forms, but it still matches words, and the descriptions don't contain them.", fr: "FREETEXT est plus souple sur les formes des mots, mais il fait toujours correspondre des mots, que les descriptions ne contiennent pas." }
    c: { en: "A stoplist removes words from the index; it can't add matches based on meaning.", fr: "Une liste de mots vides retire des mots de l'index ; elle ne peut pas ajouter de correspondances fondées sur le sens." }
references:
  - title: Choose an intelligent search approach
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach
