id: dp800-3c-rag-statements
objective: "3.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure SQL database that contains the tables dbo.Products and dbo.Orders. A stored procedure named dbo.AskSupport implements retrieval-augmented generation (RAG): it retrieves the rows that are relevant to a customer question, formats them as JSON, adds them to a prompt and calls an Azure OpenAI chat deployment by using sp_invoke_external_rest_endpoint.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une base de données Azure SQL qui contient les tables dbo.Products et dbo.Orders. Une procédure stockée nommée dbo.AskSupport implémente la génération augmentée par récupération (RAG) : elle récupère les lignes pertinentes pour la question d'un client, les met au format JSON, les ajoute à une invite et appelle un déploiement de conversation Azure OpenAI avec sp_invoke_external_rest_endpoint.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When the context in the prompt isn't sufficient, the chat model can query dbo.Orders to find the missing information.
        fr: Quand le contexte de l'invite ne suffit pas, le modèle de conversation peut interroger dbo.Orders pour trouver l'information manquante.
    - id: s2
      text:
        en: dbo.AskSupport can log the OrderID values that it sends in each prompt to show which records an answer was based on.
        fr: dbo.AskSupport peut journaliser les valeurs OrderID qu'elle envoie dans chaque invite pour montrer sur quels enregistrements une réponse s'est appuyée.
    - id: s3
      text:
        en: A product inserted into dbo.Products today can appear in answers only after the chat model is retrained.
        fr: Un produit inséré aujourd'hui dans dbo.Products ne peut apparaître dans les réponses qu'après le réentraînement du modèle de conversation.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "In RAG, the database runs the retrieval and the model only sees the rows that the T-SQL code puts in the payload; it never queries the database. Because you control retrieval, you know which records informed each answer and can log them. Retrieval happens for each request, so a new product can appear in answers as soon as it is in the table, without retraining."
    fr: "Avec RAG, la base de données effectue la récupération et le modèle ne voit que les lignes que le code T-SQL place dans la charge utile ; il n'interroge jamais la base de données. Comme vous contrôlez la récupération, vous savez quels enregistrements ont servi à chaque réponse et pouvez les journaliser. La récupération a lieu à chaque requête : un nouveau produit peut apparaître dans les réponses dès qu'il est dans la table, sans réentraînement."
references:
  - title: Identify RAG use cases and architecture
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/2-identify-rag-use-cases-architecture
