id: dp800-3b-fts-conditions
objective: "3.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Products. A full-text index covers the Name and Description columns.

    You need a query that returns the products that meet at least one of the following conditions:

    - Name contains a word that starts with "carb", such as carbon or carburetor.
    - Description contains any inflectional form of "ride", such as rides, riding or ridden.
    - Description contains "carbon" and "frame" within three terms of each other, in any order.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Products. Un index de recherche en texte intégral couvre les colonnes Name et Description.

    Vous avez besoin d'une requête qui renvoie les produits qui remplissent au moins une des conditions suivantes :

    - Name contient un mot qui commence par « carb », comme carbon ou carburetor.
    - Description contient une forme fléchie de « ride », comme rides, riding ou ridden.
    - Description contient « carbon » et « frame » à trois termes au plus l'un de l'autre, dans n'importe quel ordre.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT ProductID, Name
    FROM dbo.Products
    WHERE CONTAINS(Name, [[pre]])
       OR CONTAINS(Description, [[inf]])
       OR CONTAINS(Description, [[near]]);
  slots:
    - id: pre
      options:
        - id: quoted
          text: |-
            '"carb*"'
        - id: bare
          text: |-
            'carb*'
        - id: like
          text: |-
            'carb%'
    - id: inf
      options:
        - id: inflectional
          text: |-
            'FORMSOF(INFLECTIONAL, ride)'
        - id: thesaurus
          text: |-
            'FORMSOF(THESAURUS, ride)'
        - id: prefix
          text: |-
            '"ride*"'
    - id: near
      options:
        - id: near3
          text: |-
            'NEAR((carbon, frame), 3)'
        - id: near3order
          text: |-
            'NEAR((carbon, frame), 3, TRUE)'
        - id: phrase
          text: |-
            '"carbon frame"'
answer:
  values: { pre: quoted, inf: inflectional, near: near3 }
explanation:
  correct:
    en: |
      A prefix term must be enclosed in double quotation marks with the asterisk inside them ("carb*"). FORMSOF(INFLECTIONAL, ...) uses the language stemmer to match the forms of a word. NEAR((term, term), 3) matches terms within the maximum distance; match_order defaults to FALSE, so the terms can appear in any order.
    fr: |
      Un terme préfixe doit être placé entre guillemets doubles, avec l'astérisque à l'intérieur ("carb*"). FORMSOF(INFLECTIONAL, ...) utilise le générateur de formes dérivées de la langue pour trouver les formes d'un mot. NEAR((terme, terme), 3) trouve les termes situés à la distance maximale indiquée ; match_order vaut FALSE par défaut, donc les termes peuvent apparaître dans n'importe quel ordre.
  options:
    bare: { en: "Without double quotation marks, the asterisk is treated as a character and the engine searches for the exact text carb*.", fr: "Sans guillemets doubles, l'astérisque est traité comme un caractère et le moteur recherche le texte exact carb*." }
    like: { en: "The percent sign is a LIKE wildcard; it has no prefix meaning in a full-text search condition.", fr: "Le signe pourcentage est un caractère générique de LIKE ; il n'a pas de sens de préfixe dans une condition de recherche en texte intégral." }
    thesaurus: { en: "THESAURUS expands the term with the synonyms defined in the thesaurus file, not with its inflectional forms.", fr: "THESAURUS étend le terme avec les synonymes définis dans le fichier de dictionnaire des synonymes, pas avec ses formes fléchies." }
    prefix: { en: "A prefix search matches words that start with ride, such as rider, but misses forms such as ridden.", fr: "Une recherche de préfixe trouve les mots qui commencent par ride, comme rider, mais manque des formes comme ridden." }
    near3order: { en: "match_order TRUE requires the terms to appear in the specified order.", fr: "match_order TRUE exige que les termes apparaissent dans l'ordre indiqué." }
    phrase: { en: "A phrase requires the two words to be adjacent and in that order.", fr: "Une expression exige que les deux mots soient adjacents et dans cet ordre." }
references:
  - title: CONTAINS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/contains-transact-sql
