id: dp800-3c-json-nested-sql2022
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an on-premises SQL Server 2022 database that contains the tables dbo.ProductModels (ModelId, Name) and dbo.Products (ProductId, ModelId, Name, ListPrice). An application sends the context of a prompt to a language model.

    The context must be a JSON array in which each product model is an object with its name and a nested array named products. Each element of products must be an object with the name and the price of a product. The nested array must be embedded as JSON, not as an escaped string.

    What should you use in the SELECT list of a FOR JSON PATH query on dbo.ProductModels?
  fr: |
    Vous disposez d'une base de données SQL Server 2022 locale qui contient les tables dbo.ProductModels (ModelId, Name) et dbo.Products (ProductId, ModelId, Name, ListPrice). Une application envoie le contexte d'une invite à un modèle de langage.

    Le contexte doit être un tableau JSON dans lequel chaque modèle de produit est un objet avec son nom et un tableau imbriqué nommé products. Chaque élément de products doit être un objet avec le nom et le prix d'un produit. Le tableau imbriqué doit être incorporé en tant que JSON, pas sous la forme d'une chaîne échappée.

    Que devez-vous utiliser dans la liste SELECT d'une requête FOR JSON PATH sur dbo.ProductModels ?
body:
  options:
    - { id: a, text: "JSON_ARRAYAGG(JSON_OBJECT('name': p.Name, 'price': p.ListPrice)) AS products, with a join to dbo.Products and GROUP BY m.Name" }
    - { id: b, text: "JSON_QUERY((SELECT p.Name AS name, p.ListPrice AS price FROM dbo.Products AS p WHERE p.ModelId = m.ModelId FOR JSON PATH)) AS products" }
    - { id: c, text: "STRING_AGG(p.Name + ':' + CAST(p.ListPrice AS varchar(20)), ',') AS products, with a join to dbo.Products and GROUP BY m.Name" }
    - { id: d, text: "JSON_ARRAY(p.Name, p.ListPrice) AS products, with a join to dbo.Products and GROUP BY m.Name" }
answer: { optionId: b }
explanation:
  correct:
    en: "A correlated subquery with FOR JSON PATH returns the products of each model as an array of objects, and JSON_QUERY marks the result as JSON so that the outer FOR JSON embeds it instead of escaping it as a string. FOR JSON and JSON_QUERY are available since SQL Server 2016."
    fr: "Une sous-requête corrélée avec FOR JSON PATH renvoie les produits de chaque modèle sous la forme d'un tableau d'objets, et JSON_QUERY marque le résultat comme du JSON pour que le FOR JSON externe l'incorpore au lieu de l'échapper comme une chaîne. FOR JSON et JSON_QUERY existent depuis SQL Server 2016."
  options:
    a: { en: "JSON_ARRAYAGG would build the array, but it's available only in SQL Server 2025, Azure SQL Database, Azure SQL Managed Instance and Microsoft Fabric, not in SQL Server 2022.", fr: "JSON_ARRAYAGG construirait le tableau, mais il n'est disponible que dans SQL Server 2025, Azure SQL Database, Azure SQL Managed Instance et Microsoft Fabric, pas dans SQL Server 2022." }
    c: { en: "STRING_AGG returns a plain delimited string: no JSON objects, no escaping, and FOR JSON would output it as a string.", fr: "STRING_AGG renvoie une simple chaîne délimitée : pas d'objets JSON, pas d'échappement, et FOR JSON la produirait comme une chaîne." }
    d: { en: "JSON_ARRAY isn't an aggregate: it builds one array per row from its arguments, and the ungrouped columns make the GROUP BY query fail.", fr: "JSON_ARRAY n'est pas un agrégat : il construit un tableau par ligne à partir de ses arguments, et les colonnes non groupées font échouer la requête GROUP BY." }
references:
  - title: JSON_ARRAYAGG (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-arrayagg-transact-sql
  - title: Format query results as JSON with FOR JSON
    url: https://learn.microsoft.com/en-us/sql/relational-databases/json/format-query-results-as-json-with-for-json-sql-server
