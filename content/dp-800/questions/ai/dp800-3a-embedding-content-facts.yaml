id: dp800-3a-embedding-content-facts
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is choosing the columns to embed for a community forum stored in an Azure SQL database. The dbo.Posts table contains the post text, the product SKU that the post discusses, the category name of the product and the creation date.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys choisit les colonnes à incorporer pour un forum communautaire stocké dans une base de données Azure SQL. La table dbo.Posts contient le texte du message, le SKU du produit dont parle le message, le nom de la catégorie du produit et la date de création.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Concatenating the category name with the post text can give the vector of a short post useful context.
        fr: Concaténer le nom de la catégorie avec le texte du message peut donner un contexte utile au vecteur d'un message court.
    - id: s2
      text:
        en: Embedding the SKU column is the most reliable way to find the posts about an exact SKU.
        fr: Incorporer la colonne SKU est le moyen le plus fiable de trouver les messages qui portent sur un SKU exact.
    - id: s3
      text:
        en: Including the creation date in the embedded text lets vector search return only the posts from last week.
        fr: Inclure la date de création dans le texte incorporé permet à la recherche vectorielle de ne renvoyer que les messages de la semaine dernière.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Combining a meaningful column such as the category name with the text adds context to the vector. Exact values such as a SKU are best matched with an equality predicate or full-text search, because similarity doesn't guarantee exact matches. Dates are operational metadata: a date range is a WHERE predicate, not something a vector can enforce.
    fr: |
      Combiner une colonne porteuse de sens comme le nom de la catégorie avec le texte ajoute du contexte au vecteur. Les valeurs exactes comme un SKU se recherchent mieux avec un prédicat d'égalité ou la recherche en texte intégral, car la similarité ne garantit pas de correspondance exacte. Les dates sont des métadonnées opérationnelles : une plage de dates est un prédicat WHERE, pas une condition qu'un vecteur peut imposer.
references:
  - title: Design embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads
  - title: Choose an intelligent search approach
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach
