id: dp800-3c-rag-daily-inventory
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys stores its catalog in an Azure SQL database. Stock levels and prices change several times a day. Tailspin wants a chat assistant, based on an Azure OpenAI chat model, that answers customer questions about product availability and prices.

    The answers must reflect the current data. The solution must not require retraining a model.

    What should you recommend?
  fr: |
    Tailspin Toys stocke son catalogue dans une base de données Azure SQL. Les niveaux de stock et les prix changent plusieurs fois par jour. Tailspin souhaite un assistant de conversation, basé sur un modèle de conversation Azure OpenAI, qui réponde aux questions des clients sur la disponibilité et le prix des produits.

    Les réponses doivent refléter les données actuelles. La solution ne doit pas nécessiter de réentraîner un modèle.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the chat model every night on an export of the catalog.", fr: "Effectuer chaque nuit un réglage précis (fine-tuning) du modèle de conversation sur un export du catalogue." } }
    - { id: b, text: { en: "Copy the full catalog into the system message once a month.", fr: "Copier le catalogue complet dans le message système une fois par mois." } }
    - { id: c, text: { en: "Retrieve the relevant products with T-SQL and add them to each prompt.", fr: "Récupérer les produits pertinents avec T-SQL et les ajouter à chaque invite." } }
    - { id: d, text: { en: "Deploy a larger chat model and send only the customer's question.", fr: "Déployer un modèle de conversation plus grand et n'envoyer que la question du client." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Retrieval-augmented generation (RAG) reads the relevant rows at question time and adds them to the prompt, so answers reflect the latest stock and prices. Knowledge stays in the database, so nothing is retrained."
    fr: "La génération augmentée par récupération (RAG) lit les lignes pertinentes au moment de la question et les ajoute à l'invite : les réponses reflètent les derniers stocks et prix. Les connaissances restent dans la base de données, rien n'est réentraîné."
  options:
    a: { en: "Fine-tuning retrains the model, which the requirements exclude, and a nightly model can't follow changes made during the day.", fr: "Le fine-tuning réentraîne le modèle, ce que les exigences excluent, et un modèle mis à jour chaque nuit ne peut pas suivre les changements de la journée." }
    b: { en: "A monthly copy is stale within hours, and a full catalog wastes tokens and can exceed the context window.", fr: "Une copie mensuelle est obsolète en quelques heures, et un catalogue complet gaspille des jetons et peut dépasser la fenêtre de contexte." }
    d: { en: "A general model doesn't know Tailspin's stock or prices, whatever its size.", fr: "Un modèle généraliste ne connaît pas les stocks ni les prix de Tailspin, quelle que soit sa taille." }
references:
  - title: Identify RAG use cases and architecture
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/2-identify-rag-use-cases-architecture
