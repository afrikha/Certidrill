id: dp800-3a-mi-update-policy
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL Managed Instance that uses the SQL Server 2025 update policy. A database named ClaimsDb is at compatibility level 170, and the external rest endpoint enabled option is set to 1. You are a member of the db_owner role in ClaimsDb.

    You need to generate embeddings of claim descriptions inside ClaimsDb by calling an Azure OpenAI deployment. CREATE EXTERNAL MODEL fails.

    What should you do?
  fr: |
    Fabrikam dispose d'une instance Azure SQL Managed Instance qui utilise la stratégie de mise à jour SQL Server 2025. Une base de données nommée ClaimsDb est au niveau de compatibilité 170, et l'option external rest endpoint enabled est définie à 1. Vous êtes membre du rôle db_owner dans ClaimsDb.

    Vous devez générer les incorporations des descriptions de sinistres dans ClaimsDb en appelant un déploiement Azure OpenAI. CREATE EXTERNAL MODEL échoue.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the PREVIEW_FEATURES database scoped configuration in ClaimsDb.", fr: "Activer la configuration délimitée à la base de données PREVIEW_FEATURES dans ClaimsDb." } }
    - { id: b, text: { en: "Set the allow server scoped db credentials option to 1 on the instance.", fr: "Définir l'option allow server scoped db credentials à 1 sur l'instance." } }
    - { id: c, text: { en: "Change the update policy of the instance to Always-up-to-date.", fr: "Changer la stratégie de mise à jour de l'instance en Always-up-to-date." } }
    - { id: d, text: { en: "Create the external model in the master database of the instance.", fr: "Créer le modèle externe dans la base de données master de l'instance." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      On Azure SQL Managed Instance, CREATE EXTERNAL MODEL and AI_GENERATE_EMBEDDINGS require the Always-up-to-date update policy. The SQL Server 2025 update policy isn't enough, even though some related features, such as AI_GENERATE_CHUNKS, already work with it.
    fr: |
      Dans Azure SQL Managed Instance, CREATE EXTERNAL MODEL et AI_GENERATE_EMBEDDINGS exigent la stratégie de mise à jour Always-up-to-date. La stratégie de mise à jour SQL Server 2025 ne suffit pas, même si certaines fonctionnalités voisines, comme AI_GENERATE_CHUNKS, fonctionnent déjà avec elle.
  options:
    a: { en: "PREVIEW_FEATURES enables preview features of a database, but it doesn't change the engine version that the update policy provides.", fr: "PREVIEW_FEATURES active les fonctionnalités en préversion d'une base de données, mais ne change pas la version du moteur fournie par la stratégie de mise à jour." }
    b: { en: "That option lets SQL Server 2025 use an Arc-enabled managed identity; it doesn't make the statement available on Managed Instance.", fr: "Cette option permet à SQL Server 2025 d'utiliser une identité managée activée par Arc ; elle ne rend pas l'instruction disponible dans Managed Instance." }
    d: { en: "External models are database objects used where the embeddings are generated; master doesn't remove the update policy requirement.", fr: "Les modèles externes sont des objets de base de données utilisés là où les incorporations sont générées ; master ne lève pas l'exigence de stratégie de mise à jour." }
references:
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
