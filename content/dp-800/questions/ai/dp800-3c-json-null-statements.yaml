id: dp800-3c-json-null-statements
objective: "3.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Products. The Discount column allows NULL values. You are building the context of a prompt from this table.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Products. La colonne Discount accepte les valeurs NULL. Vous construisez le contexte d'une invite à partir de cette table.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "For a row whose Discount is NULL, SELECT JSON_OBJECT('name': Name, 'discount': Discount) returns an object that contains \"discount\":null."
        fr: "Pour une ligne dont Discount vaut NULL, SELECT JSON_OBJECT('name': Name, 'discount': Discount) renvoie un objet qui contient \"discount\":null."
    - id: s2
      text:
        en: For a row whose Discount is NULL, SELECT Name, Discount FROM dbo.Products FOR JSON PATH includes a Discount property in the object of that row.
        fr: Pour une ligne dont Discount vaut NULL, SELECT Name, Discount FROM dbo.Products FOR JSON PATH inclut une propriété Discount dans l'objet de cette ligne.
    - id: s3
      text:
        en: For a row whose Discount is NULL, SELECT JSON_ARRAY(Name, Discount) returns an array of two elements.
        fr: Pour une ligne dont Discount vaut NULL, SELECT JSON_ARRAY(Name, Discount) renvoie un tableau de deux éléments.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "JSON_OBJECT defaults to NULL ON NULL, so the key is kept with a JSON null. FOR JSON omits the properties of NULL columns unless you add INCLUDE_NULL_VALUES. JSON_ARRAY defaults to ABSENT ON NULL, so the NULL element is dropped and the array has one element; add NULL ON NULL to keep it."
    fr: "JSON_OBJECT applique NULL ON NULL par défaut : la clé est conservée avec un null JSON. FOR JSON omet les propriétés des colonnes NULL sauf si vous ajoutez INCLUDE_NULL_VALUES. JSON_ARRAY applique ABSENT ON NULL par défaut : l'élément NULL est supprimé et le tableau ne contient qu'un élément ; ajoutez NULL ON NULL pour le conserver."
references:
  - title: JSON_OBJECT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-object-transact-sql
  - title: JSON_ARRAY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-array-transact-sql
