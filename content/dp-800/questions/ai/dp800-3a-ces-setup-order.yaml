id: dp800-3a-ces-setup-order
objective: "3.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL database named ListingsDb. The database has a master key and a database scoped credential that uses its managed identity. An Azure Event Hubs namespace and an event hub are ready, and the identity has permission to send events.

    You need to stream the inserts, updates and deletes of dbo.Listings to the event hub so that a consumer can regenerate the listing embeddings.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'une base de données Azure SQL nommée ListingsDb. La base de données possède une clé principale et des informations d'identification délimitées à la base de données qui utilisent son identité managée. Un espace de noms Azure Event Hubs et un hub d'événements sont prêts, et l'identité est autorisée à envoyer des événements.

    Vous devez transmettre en continu les insertions, mises à jour et suppressions de dbo.Listings au hub d'événements pour qu'un consommateur puisse régénérer les incorporations des annonces.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: enable, text: { en: "Run sys.sp_enable_event_stream.", fr: "Exécuter sys.sp_enable_event_stream." } }
    - { id: group, text: { en: "Run sys.sp_create_event_stream_group with the AzureEventHubs destination type and the credential.", fr: "Exécuter sys.sp_create_event_stream_group avec le type de destination AzureEventHubs et les informations d'identification." } }
    - { id: add, text: { en: "Run sys.sp_add_object_to_event_stream_group for dbo.Listings.", fr: "Exécuter sys.sp_add_object_to_event_stream_group pour dbo.Listings." } }
    - { id: cdcdb, text: { en: "Run sys.sp_cdc_enable_db.", fr: "Exécuter sys.sp_cdc_enable_db." } }
    - { id: cdctab, text: { en: "Run sys.sp_cdc_enable_table for dbo.Listings.", fr: "Exécuter sys.sp_cdc_enable_table pour dbo.Listings." } }
    - { id: ct, text: { en: "Run ALTER TABLE dbo.Listings ENABLE CHANGE_TRACKING.", fr: "Exécuter ALTER TABLE dbo.Listings ENABLE CHANGE_TRACKING." } }
answer:
  sequence: [ enable, group, add ]
explanation:
  correct:
    en: |
      Change event streaming is first enabled on the database. You then create a stream group, which holds the destination, its credential and the partitioning scheme, and finally add the tables to stream to that group. CES doesn't depend on CDC or Change Tracking; CES doesn't support a database that is configured with CDC.
    fr: |
      Le streaming d'événements de modification est d'abord activé sur la base de données. Vous créez ensuite un groupe de flux, qui contient la destination, ses informations d'identification et le schéma de partitionnement, puis vous ajoutez à ce groupe les tables à diffuser. CES ne dépend ni de CDC ni du suivi des modifications ; CES ne prend pas en charge une base de données configurée avec CDC.
  options:
    cdcdb: { en: "CDC is a separate feature and isn't supported together with CES.", fr: "CDC est une fonctionnalité distincte et n'est pas prise en charge avec CES." }
    cdctab: { en: "Enabling CDC on the table isn't part of the CES configuration.", fr: "Activer CDC sur la table ne fait pas partie de la configuration de CES." }
    ct: { en: "CES reads the changes itself; Change Tracking isn't required.", fr: "CES lit lui-même les modifications ; le suivi des modifications n'est pas requis." }
references:
  - title: Configure Change Event Streaming to Azure Event Hubs
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/change-event-streaming/configure
  - title: Change event streaming overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/change-event-streaming/overview
