id: dp800-3a-chunk-overlap-purpose
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware splits long maintenance manuals into chunks with AI_GENERATE_CHUNKS before generating their embeddings. A colleague proposes to set the OVERLAP argument to 15 instead of leaving it at its default value.

    What is the purpose of OVERLAP?
  fr: |
    Litware découpe de longs manuels de maintenance en blocs avec AI_GENERATE_CHUNKS avant de générer leurs incorporations. Un collègue propose de définir l'argument OVERLAP à 15 au lieu de le laisser à sa valeur par défaut.

    À quoi sert OVERLAP ?
body:
  options:
    - { id: a, text: { en: "It repeats the end of each chunk at the start of the next one, so an idea cut at a boundary stays whole in one chunk.", fr: "Il répète la fin de chaque bloc au début du suivant, pour qu'une idée coupée à une limite reste entière dans un bloc." } }
    - { id: b, text: { en: "It reduces the number of chunks generated for each document, so fewer embedding calls are made.", fr: "Il réduit le nombre de blocs générés pour chaque document, ce qui diminue le nombre d'appels d'incorporation." } }
    - { id: c, text: { en: "It expresses the chunk size in tokens instead of characters, so chunks match the model's input limit.", fr: "Il exprime la taille des blocs en jetons plutôt qu'en caractères, pour que les blocs respectent la limite d'entrée du modèle." } }
    - { id: d, text: { en: "It returns an extra column that groups the chunks of the same source row under one identifier.", fr: "Il retourne une colonne supplémentaire qui regroupe les blocs d'une même ligne source sous un identifiant." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      OVERLAP is a percentage of CHUNK_SIZE (0 to 50, default 0) that carries over from the preceding chunk. The repeated text keeps the context of sentences that would otherwise be split between two chunks.
    fr: |
      OVERLAP est un pourcentage de CHUNK_SIZE (de 0 à 50, 0 par défaut) repris du bloc précédent. Le texte répété conserve le contexte des phrases qui seraient sinon coupées entre deux blocs.
  options:
    b: { en: "Overlap repeats text, so it produces as many chunks or more, and therefore at least as many embedding calls.", fr: "Le chevauchement répète du texte : il produit autant de blocs ou davantage, donc au moins autant d'appels d'incorporation." }
    c: { en: "CHUNK_SIZE is always a number of characters; OVERLAP doesn't change the unit.", fr: "CHUNK_SIZE est toujours un nombre de caractères ; OVERLAP ne change pas l'unité." }
    d: { en: "That is ENABLE_CHUNK_SET_ID, which adds the chunk_set_id column.", fr: "C'est le rôle d'ENABLE_CHUNK_SET_ID, qui ajoute la colonne chunk_set_id." }
references:
  - title: AI_GENERATE_CHUNKS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
