id: dp800-3a-query-embedding-syntax
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure SQL database that contains an external model named SearchEmbedder. The stored vectors of dbo.ProductEmbeddings were generated with SearchEmbedder and have 1,536 dimensions.

    A stored procedure receives the search text in a parameter named @q of type nvarchar(400). You need to convert @q to a vector that can be compared with the stored vectors.

    Which statement should you use?
  fr: |
    Contoso dispose d'une base de données Azure SQL qui contient un modèle externe nommé SearchEmbedder. Les vecteurs stockés de dbo.ProductEmbeddings ont été générés avec SearchEmbedder et ont 1 536 dimensions.

    Une procédure stockée reçoit le texte recherché dans un paramètre nommé @q de type nvarchar(400). Vous devez convertir @q en un vecteur comparable aux vecteurs stockés.

    Quelle instruction devez-vous utiliser ?
body:
  options:
    - { id: a, text: "DECLARE @v VECTOR(1536) = AI_GENERATE_EMBEDDINGS(@q, 'SearchEmbedder');" }
    - { id: b, text: "DECLARE @v VECTOR(1536) = AI_GENERATE_EMBEDDINGS(@q USE MODEL SearchEmbedder);" }
    - { id: c, text: "DECLARE @v VECTOR(1536) = CAST(@q AS VECTOR(1536));" }
    - { id: d, text: "DECLARE @v VECTOR(1536) = VECTOR_NORMALIZE(@q, 'norm2');" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The syntax is AI_GENERATE_EMBEDDINGS(source USE MODEL model_identifier), where source is any character expression and the model is an EMBEDDINGS external model. The function returns the vector as a JSON array, which converts to the vector variable. Using the same model as the stored vectors keeps them comparable.
    fr: |
      La syntaxe est AI_GENERATE_EMBEDDINGS(source USE MODEL model_identifier), où source est une expression de type caractère et le modèle un modèle externe EMBEDDINGS. La fonction retourne le vecteur sous forme de tableau JSON, qui se convertit dans la variable vector. Utiliser le même modèle que pour les vecteurs stockés les garde comparables.
  options:
    a: { en: "The model is named after USE MODEL, not passed as a second string argument.", fr: "Le modèle se nomme après USE MODEL ; il ne se passe pas comme second argument de type chaîne." }
    d: { en: "VECTOR_NORMALIZE scales an existing vector; it can't turn text into an embedding.", fr: "VECTOR_NORMALIZE met à l'échelle un vecteur existant ; il ne peut pas transformer du texte en incorporation." }
    c: { en: "A string converts to a vector only if it is a JSON array of numbers; search text isn't one.", fr: "Une chaîne ne se convertit en vecteur que si c'est un tableau JSON de nombres ; un texte de recherche n'en est pas un." }
references:
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
