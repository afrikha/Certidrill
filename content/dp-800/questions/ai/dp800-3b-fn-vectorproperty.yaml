id: dp800-3b-fn-vectorproperty
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam stores embeddings in two Azure SQL Database tables, dbo.DocVectorsA and dbo.DocVectorsB. Each table has a vector column named Embedding, and the two tables were filled by different teams with different embedding models.

    A query that compares vectors from the two tables fails. You suspect that the two columns hold vectors with different numbers of dimensions.

    You need to check the number of dimensions of the vectors in each table.

    Which expression should you use?
  fr: |
    Fabrikam stocke des incorporations dans deux tables Azure SQL Database, dbo.DocVectorsA et dbo.DocVectorsB. Chaque table possède une colonne vectorielle nommée Embedding, et les deux tables ont été remplies par des équipes différentes avec des modèles d'incorporation différents.

    Une requête qui compare des vecteurs des deux tables échoue. Vous soupçonnez que les deux colonnes contiennent des vecteurs de nombres de dimensions différents.

    Vous devez vérifier le nombre de dimensions des vecteurs de chaque table.

    Quelle expression devez-vous utiliser ?
body:
  options:
    - { id: a, text: "VECTORPROPERTY(Embedding, 'BaseType')" }
    - { id: b, text: "VECTOR_NORM(Embedding, 'norm1')" }
    - { id: c, text: "VECTOR_NORMALIZE(Embedding, 'norm2')" }
    - { id: d, text: "VECTORPROPERTY(Embedding, 'Dimensions')" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      VECTORPROPERTY returns a property of a vector; the Dimensions property returns the number of dimensions as an integer. It is the function to use when you troubleshoot vectors produced by different models.
    fr: |-
      VECTORPROPERTY renvoie une propriété d'un vecteur ; la propriété Dimensions renvoie le nombre de dimensions sous forme d'entier. C'est la fonction à utiliser pour diagnostiquer des vecteurs produits par des modèles différents.
  options:
    a: { en: "BaseType returns the base type of the vector elements, such as float32, not the number of dimensions.", fr: "BaseType renvoie le type de base des éléments du vecteur, comme float32, pas le nombre de dimensions." }
    b: { en: "VECTOR_NORM returns the 1-norm, the sum of the absolute values of the components, not their count.", fr: "VECTOR_NORM renvoie la norme 1, la somme des valeurs absolues des composantes, pas leur nombre." }
    c: { en: "VECTOR_NORMALIZE returns a rescaled vector; it does not report the number of dimensions.", fr: "VECTOR_NORMALIZE renvoie un vecteur remis à l'échelle ; elle n'indique pas le nombre de dimensions." }
references:
  - title: VECTORPROPERTY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vectorproperty-transact-sql
