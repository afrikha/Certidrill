id: dp800-3c-prompt-setup-order
objective: "3.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named SalesDb on a logical server whose system-assigned managed identity has the Cognitive Services OpenAI User role on an Azure OpenAI resource named contoso-ai.

    A database user named app_rag must send prompts to a chat deployment of contoso-ai by using sp_invoke_external_rest_endpoint. No key or other secret may be stored in the database.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée SalesDb sur un serveur logique dont l'identité managée affectée par le système possède le rôle Cognitive Services OpenAI User sur une ressource Azure OpenAI nommée contoso-ai.

    Un utilisateur de base de données nommé app_rag doit envoyer des invites à un déploiement de conversation de contoso-ai avec sp_invoke_external_rest_endpoint. Aucune clé ni aucun autre secret ne doit être stocké dans la base de données.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: cred, text: { en: "Create the database scoped credential [https://contoso-ai.openai.azure.com] with IDENTITY = 'Managed Identity'.", fr: "Créer les informations d'identification délimitées à la base de données [https://contoso-ai.openai.azure.com] avec IDENTITY = 'Managed Identity'." } }
    - { id: grant, text: { en: "Grant EXECUTE ANY EXTERNAL ENDPOINT, and REFERENCES on the credential, to app_rag.", fr: "Accorder à app_rag EXECUTE ANY EXTERNAL ENDPOINT, ainsi que REFERENCES sur les informations d'identification." } }
    - { id: call, text: { en: "As app_rag, run sp_invoke_external_rest_endpoint with @credential set to the credential.", fr: "En tant qu'app_rag, exécuter sp_invoke_external_rest_endpoint avec @credential défini sur les informations d'identification." } }
    - { id: cfg, text: { en: "Run sp_configure 'external rest endpoint enabled', 1 and RECONFIGURE WITH OVERRIDE.", fr: "Exécuter sp_configure 'external rest endpoint enabled', 1 puis RECONFIGURE WITH OVERRIDE." } }
    - { id: key, text: { en: "Create a database scoped credential with IDENTITY = 'HTTPEndpointHeaders' that holds the API key.", fr: "Créer des informations d'identification délimitées à la base de données avec IDENTITY = 'HTTPEndpointHeaders' qui contiennent la clé API." } }
    - { id: hdr, text: { en: "Add the api-key header to the @headers parameter of the call.", fr: "Ajouter l'en-tête api-key au paramètre @headers de l'appel." } }
answer:
  sequence: [ cred, grant, call ]
explanation:
  correct:
    en: "The credential must exist before you can grant REFERENCES on it. The caller then needs EXECUTE ANY EXTERNAL ENDPOINT and REFERENCES on the credential, after which app_rag can run the procedure with @credential. A Managed Identity credential sends a token of the server's identity, so no secret is stored."
    fr: "Les informations d'identification doivent exister avant que vous puissiez accorder REFERENCES dessus. L'appelant a ensuite besoin d'EXECUTE ANY EXTERNAL ENDPOINT et de REFERENCES sur les informations d'identification ; app_rag peut alors exécuter la procédure avec @credential. Des informations d'identification Managed Identity envoient un jeton de l'identité du serveur : aucun secret n'est stocké."
  options:
    cfg: { en: "sp_invoke_external_rest_endpoint is enabled by default in Azure SQL Database; sp_configure is needed in SQL Server 2025 and Azure SQL Managed Instance.", fr: "sp_invoke_external_rest_endpoint est activée par défaut dans Azure SQL Database ; sp_configure est nécessaire dans SQL Server 2025 et Azure SQL Managed Instance." }
    key: { en: "An HTTPEndpointHeaders credential stores the API key in the database, which the requirements forbid.", fr: "Des informations d'identification HTTPEndpointHeaders stockent la clé API dans la base de données, ce que les exigences interdisent." }
    hdr: { en: "A key in @headers is a secret written in the code, and it isn't needed with a managed identity.", fr: "Une clé dans @headers est un secret écrit dans le code, et elle est inutile avec une identité managée." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
