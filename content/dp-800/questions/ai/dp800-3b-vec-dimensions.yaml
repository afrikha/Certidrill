id: dp800-3b-vec-dimensions
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database. You plan to store embeddings generated by a model that returns 3,072 dimensions.

    You need to add a column that stores the full embeddings without reducing their number of dimensions. The solution must minimize storage.

    Which column definition should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL. Vous prévoyez de stocker des incorporations générées par un modèle qui renvoie 3 072 dimensions.

    Vous devez ajouter une colonne qui stocke les incorporations complètes sans réduire leur nombre de dimensions. La solution doit réduire au minimum le stockage.

    Quelle définition de colonne devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Embedding VECTOR(3072) NOT NULL" }
    - { id: b, text: "Embedding VECTOR(1998) NOT NULL" }
    - { id: c, text: "Embedding nvarchar(max) NOT NULL" }
    - { id: d, text: "Embedding VECTOR(3072, float16) NOT NULL" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The default float32 base type supports up to 1,998 dimensions, while float16 supports up to 3,996 dimensions with half-precision elements. In Azure SQL Database, float16 is generally available, so VECTOR(3072, float16) stores the full embeddings in the smallest format.
    fr: |-
      Le type de base par défaut float32 prend en charge jusqu'à 1 998 dimensions, alors que float16 en prend en charge jusqu'à 3 996 avec des éléments en demi-précision. Dans Azure SQL Database, float16 est en disponibilité générale : VECTOR(3072, float16) stocke donc les incorporations complètes dans le format le plus compact.
  options:
    a: { en: "Without a base type, the column uses float32, which is limited to 1,998 dimensions.", fr: "Sans type de base, la colonne utilise float32, limité à 1 998 dimensions." }
    b: { en: "Every vector must have exactly the declared number of dimensions; a 3,072-element embedding does not fit a VECTOR(1998) column.", fr: "Chaque vecteur doit avoir exactement le nombre de dimensions déclaré ; une incorporation de 3 072 éléments ne tient pas dans une colonne VECTOR(1998)." }
    c: { en: "A JSON array stored as text takes much more space than the binary vector format and cannot be used directly by the vector functions.", fr: "Un tableau JSON stocké sous forme de texte occupe beaucoup plus d'espace que le format vectoriel binaire et ne peut pas être utilisé directement par les fonctions vectorielles." }
references:
  - title: Vector data type
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type
