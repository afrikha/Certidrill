id: dp800-3b-vec-float16-platforms
objective: "3.2.3"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    You plan to deploy a table that contains a column defined as `Embedding VECTOR(2048, float16) NOT NULL` to four platforms. The Azure SQL Managed Instance currently uses the SQL Server 2025 update policy.

    You need to identify what must be configured on each platform before you can create the table.

    What should you identify for each platform? To answer, drag the appropriate configurations to the correct platforms. Each configuration may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de déployer sur quatre plateformes une table qui contient une colonne définie comme `Embedding VECTOR(2048, float16) NOT NULL`. L'instance Azure SQL Managed Instance utilise actuellement la stratégie de mise à jour SQL Server 2025.

    Vous devez identifier ce qui doit être configuré sur chaque plateforme avant de pouvoir créer la table.

    Que devez-vous identifier pour chaque plateforme ? Pour répondre, faites glisser les configurations appropriées vers les plateformes correspondantes. Chaque configuration peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: preview, text: "ALTER DATABASE SCOPED CONFIGURATION SET PREVIEW_FEATURES = ON" }
    - { id: none, text: { en: "No additional configuration", fr: "Aucune configuration supplémentaire" } }
    - { id: policy, text: { en: "The Always-up-to-date update policy", fr: "La stratégie de mise à jour Always-up-to-date" } }
    - { id: rest, text: { en: "The external rest endpoint enabled server option", fr: "L'option de serveur external rest endpoint enabled" } }
    - { id: compat, text: { en: "Database compatibility level 170", fr: "Le niveau de compatibilité de base de données 170" } }
  targets:
    - { id: sqlserver, text: "SQL Server 2025" }
    - { id: sqldb, text: "Azure SQL Database" }
    - { id: mi, text: "Azure SQL Managed Instance" }
    - { id: fabric, text: { en: "SQL database in Microsoft Fabric", fr: "Base de données SQL dans Microsoft Fabric" } }
answer:
  mapping: { sqlserver: preview, sqldb: none, mi: policy, fabric: none }
explanation:
  correct:
    en: |-
      The float16 base type is in preview in SQL Server 2025 and requires the PREVIEW_FEATURES database scoped configuration. It is generally available in Azure SQL Database and SQL database in Microsoft Fabric, with no preview configuration. On Azure SQL Managed Instance, the vector features require the Always-up-to-date update policy.
    fr: |-
      Le type de base float16 est en préversion dans SQL Server 2025 et nécessite la configuration étendue à la base de données PREVIEW_FEATURES. Il est en disponibilité générale dans Azure SQL Database et dans la base de données SQL de Microsoft Fabric, sans configuration de préversion. Sur Azure SQL Managed Instance, les fonctionnalités vectorielles nécessitent la stratégie de mise à jour Always-up-to-date.
  options:
    rest: { en: "This option allows calls to external REST endpoints, such as embedding models; it does not enable a data type.", fr: "Cette option autorise les appels à des points de terminaison REST externes, comme des modèles d'incorporation ; elle n'active aucun type de données." }
    compat: { en: "The vector data type is available under all database compatibility levels.", fr: "Le type de données vector est disponible à tous les niveaux de compatibilité de base de données." }
references:
  - title: Vector data type
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type
