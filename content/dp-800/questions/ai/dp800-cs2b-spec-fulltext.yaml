id: dp800-cs2b-spec-fulltext
objective: "3.2.2"
type: ordering
caseStudy: dp800-cs2b-munsons-pickles
difficulty: 2
status: draft
stem:
  en: |
    You need to implement the search of the specification sheets in dbo.ProductSpecs. The solution must meet the search requirements.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez implémenter la recherche dans les fiches de spécifications de dbo.ProductSpecs. La solution doit satisfaire les exigences de recherche.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: uix
      text:
        en: Create a unique index on the SpecId column.
        fr: Créer un index unique sur la colonne SpecId.
    - id: ftpk
      text:
        en: Create a full-text index on SpecText with KEY INDEX PK_ProductSpecs.
        fr: Créer un index de recherche en texte intégral sur SpecText avec KEY INDEX PK_ProductSpecs.
    - id: ftuix
      text:
        en: Create a full-text index on SpecText with KEY INDEX set to the unique index on SpecId.
        fr: Créer un index de recherche en texte intégral sur SpecText avec KEY INDEX défini sur l'index unique de SpecId.
    - id: contains
      text:
        en: |
          Query dbo.ProductSpecs by using `CONTAINS(SpecText, 'FORMSOF(INFLECTIONAL, "seal")')`.
        fr: |
          Interroger dbo.ProductSpecs à l'aide de `CONTAINS(SpecText, 'FORMSOF(INFLECTIONAL, "seal")')`.
    - id: like
      text:
        en: |
          Query dbo.ProductSpecs by using `SpecText LIKE '%seal%'`.
        fr: |
          Interroger dbo.ProductSpecs à l'aide de `SpecText LIKE '%seal%'`.
    - id: vector
      text:
        en: Create an external model that points to an Azure OpenAI embedding deployment, and then create a vector index on the embeddings of SpecText.
        fr: Créer un modèle externe qui pointe vers un déploiement d'incorporation Azure OpenAI, puis créer un index vectoriel sur les incorporations de SpecText.
answer:
  sequence: [uix, ftuix, contains]
explanation:
  correct:
    en: |
      A full-text index needs a KEY INDEX that is a unique, single-key, non-nullable index, so you first create a unique index on SpecId; the full-text index can then use it and the existing default catalog ftSupply. CONTAINS with FORMSOF(INFLECTIONAL, ...) matches the inflected forms of a word, such as sealed and sealing, and everything runs inside SQL-ERP1.
    fr: |
      Un index de recherche en texte intégral exige un KEY INDEX unique, à clé unique et non nullable : vous créez donc d'abord un index unique sur SpecId ; l'index de recherche en texte intégral peut ensuite l'utiliser, ainsi que le catalogue par défaut existant ftSupply. CONTAINS avec FORMSOF(INFLECTIONAL, ...) trouve les formes fléchies d'un mot, comme sealed et sealing, et tout s'exécute dans SQL-ERP1.
  options:
    ftpk: { en: "PK_ProductSpecs has two key columns, and the full-text KEY INDEX must be a single-key index.", fr: "PK_ProductSpecs comporte deux colonnes clés, alors que le KEY INDEX du texte intégral doit être un index à clé unique." }
    like: { en: "LIKE matches a character pattern; it does not find inflected forms and cannot use the full-text index.", fr: "LIKE recherche un modèle de caractères ; il ne trouve pas les formes fléchies et ne peut pas utiliser l'index de recherche en texte intégral." }
    vector: { en: "Calling Azure OpenAI sends the specification text outside the datacenter, which the requirements forbid.", fr: "L'appel d'Azure OpenAI envoie le texte des spécifications hors du centre de données, ce que les exigences interdisent." }
references:
  - title: CREATE FULLTEXT INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-fulltext-index-transact-sql
  - title: Implement full-text search
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/03-implement-full-text-search
