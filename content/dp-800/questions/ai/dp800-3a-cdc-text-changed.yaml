id: dp800-3a-cdc-text-changed
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure SQL database in the General Purpose service tier. The dbo.Products table contains two million rows, and the embeddings of the Description column are stored in dbo.ProductEmbeddings.

    Each day, a price synchronization job updates about 500,000 rows of dbo.Products. Its UPDATE statement sets every column, including Description, even when the description is unchanged.

    You need to regenerate an embedding only when the text of Description actually changed. The detection must be asynchronous and must not add work to the synchronization transactions.

    What should you use?
  fr: |
    Contoso dispose d'une base de données Azure SQL dans le niveau de service Usage général. La table dbo.Products contient deux millions de lignes, et les incorporations de la colonne Description sont stockées dans dbo.ProductEmbeddings.

    Chaque jour, un travail de synchronisation des prix met à jour environ 500 000 lignes de dbo.Products. Son instruction UPDATE définit toutes les colonnes, y compris Description, même quand la description n'a pas changé.

    Vous devez régénérer une incorporation uniquement quand le texte de Description a réellement changé. La détection doit être asynchrone et ne doit pas ajouter de travail aux transactions de synchronisation.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Change data capture (CDC) and a comparison of the before and after values", fr: "La capture des données modifiées (CDC) et une comparaison des valeurs avant et après" } }
    - { id: b, text: { en: "An AFTER UPDATE trigger that tests IF UPDATE(Description)", fr: "Un déclencheur AFTER UPDATE qui teste IF UPDATE(Description)" } }
    - { id: c, text: { en: "An Azure function that uses the Azure SQL trigger binding on dbo.Products", fr: "Une fonction Azure qui utilise la liaison de déclencheur Azure SQL sur dbo.Products" } }
    - { id: d, text: { en: "Change Tracking with TRACK_COLUMNS_UPDATED = ON and CHANGE_TRACKING_IS_COLUMN_IN_MASK", fr: "Le suivi des modifications avec TRACK_COLUMNS_UPDATED = ON et CHANGE_TRACKING_IS_COLUMN_IN_MASK" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CDC reads the transaction log asynchronously and writes each update to the change table as two rows, the values before (__$operation = 3) and after (__$operation = 4) the update. A job can compare the two Description values and call the model only for the rows whose text changed, which suits a high-volume workload.
    fr: |
      CDC lit le journal des transactions de façon asynchrone et écrit chaque mise à jour dans la table de modifications sous forme de deux lignes, les valeurs avant (__$operation = 3) et après (__$operation = 4) la mise à jour. Un travail peut comparer les deux valeurs de Description et n'appeler le modèle que pour les lignes dont le texte a changé, ce qui convient à une charge de travail à volume élevé.
  options:
    d: { en: "Change Tracking records the change in the same transaction and keeps no old values; a column set to its current value still counts as changed.", fr: "Le suivi des modifications enregistre la modification dans la même transaction et ne conserve aucune ancienne valeur ; une colonne redéfinie à sa valeur actuelle compte quand même comme modifiée." }
    b: { en: "A trigger runs inside each synchronization transaction, and UPDATE(Description) is true whenever the column appears in the SET list.", fr: "Un déclencheur s'exécute dans chaque transaction de synchronisation, et UPDATE(Description) est vrai dès que la colonne figure dans la liste SET." }
    c: { en: "The SQL trigger binding relies on Change Tracking, so it reports every updated row with its current values only.", fr: "La liaison de déclencheur SQL repose sur le suivi des modifications : elle signale chaque ligne mise à jour avec ses seules valeurs actuelles." }
references:
  - title: What is change data capture (CDC)?
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-data-capture-sql-server
  - title: About Change Tracking (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-tracking-sql-server
