id: dp800-3c-send-outbound-throttle
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a single Azure SQL database. Many sessions run a RAG stored procedure at the same time. The procedure calls an Azure OpenAI deployment by using sp_invoke_external_rest_endpoint and uses a database scoped credential.

    During peak hours, some executions fail with error 10928 and the procedure never receives a response. The other executions succeed. The metrics of the Azure OpenAI resource show no throttled requests.

    What is the most likely cause of the failures?
  fr: |
    Vous disposez d'une base de données Azure SQL unique. De nombreuses sessions exécutent en même temps une procédure stockée RAG. La procédure appelle un déploiement Azure OpenAI avec sp_invoke_external_rest_endpoint et utilise des informations d'identification délimitées à la base de données.

    Aux heures de pointe, certaines exécutions échouent avec l'erreur 10928 et la procédure ne reçoit jamais de réponse. Les autres exécutions réussissent. Les métriques de la ressource Azure OpenAI ne montrent aucune requête limitée.

    Quelle est la cause la plus probable des échecs ?
body:
  options:
    - { id: a, text: { en: "The deployment returns HTTP 429 because it throttles the requests.", fr: "Le déploiement renvoie HTTP 429, car il limite les requêtes." } }
    - { id: b, text: { en: "The payload exceeds the maximum size that the procedure accepts.", fr: "La charge utile dépasse la taille maximale acceptée par la procédure." } }
    - { id: c, text: { en: "The concurrent outbound connections exceed the limit of the database.", fr: "Les connexions sortantes simultanées dépassent la limite de la base de données." } }
    - { id: d, text: { en: "The caller lacks the REFERENCES permission on the credential.", fr: "L'appelant n'a pas l'autorisation REFERENCES sur les informations d'identification." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure SQL Database throttles the concurrent outbound connections of sp_invoke_external_rest_endpoint to about 15 % of the worker threads, with a maximum of 175. Beyond that limit, the call raises error 10928 for a single database (10936 for an elastic pool), and the request never reaches the endpoint."
    fr: "Azure SQL Database limite les connexions sortantes simultanées de sp_invoke_external_rest_endpoint à environ 15 % des threads de travail, avec un maximum de 175. Au-delà, l'appel lève l'erreur 10928 pour une base de données unique (10936 pour un pool élastique), et la requête n'atteint jamais le point de terminaison."
  options:
    a: { en: "A 429 would be returned as the procedure's return value, and the Azure OpenAI metrics show no throttling.", fr: "Un 429 serait renvoyé comme valeur de retour de la procédure, et les métriques Azure OpenAI ne montrent aucune limitation." }
    b: { en: "The payload limit is 100 MB, and an oversized payload would fail at any hour, not only at peak load.", fr: "La limite de la charge utile est de 100 Mo, et une charge utile trop grande échouerait à toute heure, pas seulement en pic de charge." }
    d: { en: "A missing permission would make every execution fail, not only some executions at peak hours.", fr: "Une autorisation manquante ferait échouer toutes les exécutions, pas seulement certaines aux heures de pointe." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
