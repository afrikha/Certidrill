id: dp800-3a-embedding-xe-trace
objective: "3.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure SQL database. A nightly UPDATE statement that calls AI_GENERATE_EMBEDDINGS fails for some batches. You need to see the HTTP status codes and the error messages that the model endpoint returns.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'une base de données Azure SQL. Une instruction UPDATE nocturne qui appelle AI_GENERATE_EMBEDDINGS échoue pour certains lots. Vous devez voir les codes d'état HTTP et les messages d'erreur retournés par le point de terminaison du modèle.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create an Extended Events session that captures the ai_generate_embeddings_summary event.", fr: "Créer une session d'événements étendus qui capture l'événement ai_generate_embeddings_summary." } }
    - { id: start, text: { en: "Start the event session.", fr: "Démarrer la session d'événements." } }
    - { id: run, text: { en: "Run the UPDATE statement that calls AI_GENERATE_EMBEDDINGS.", fr: "Exécuter l'instruction UPDATE qui appelle AI_GENERATE_EMBEDDINGS." } }
    - { id: read, text: { en: "Read the session target to review the status codes and errors.", fr: "Lire la cible de la session pour examiner les codes d'état et les erreurs." } }
    - { id: qs, text: { en: "Enable Query Store on the database.", fr: "Activer le Magasin des requêtes sur la base de données." } }
    - { id: catalog, text: { en: "Query sys.external_models to read the last error of the model.", fr: "Interroger sys.external_models pour lire la dernière erreur du modèle." } }
answer:
  sequence: [ create, start, run, read ]
explanation:
  correct:
    en: |
      The ai_generate_embeddings_summary extended event records the REST request and response of AI_GENERATE_EMBEDDINGS, including the status code, the errors and the model name. The session must exist and be started before the failing statement runs, and you then read its target. The external_rest_endpoint_summary event adds more detail if needed.
    fr: |
      L'événement étendu ai_generate_embeddings_summary enregistre la requête et la réponse REST d'AI_GENERATE_EMBEDDINGS, notamment le code d'état, les erreurs et le nom du modèle. La session doit exister et être démarrée avant l'exécution de l'instruction qui échoue ; vous lisez ensuite sa cible. L'événement external_rest_endpoint_summary ajoute des détails si nécessaire.
  options:
    qs: { en: "Query Store records plans and runtime statistics, not the HTTP responses of the model endpoint.", fr: "Le Magasin des requêtes enregistre les plans et les statistiques d'exécution, pas les réponses HTTP du point de terminaison du modèle." }
    catalog: { en: "sys.external_models returns the metadata of the models, not the results of their calls.", fr: "sys.external_models retourne les métadonnées des modèles, pas les résultats de leurs appels." }
references:
  - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
