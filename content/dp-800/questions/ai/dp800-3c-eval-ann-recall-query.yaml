id: dp800-3c-eval-ann-recall-query
objective: "3.2.10"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Articles with 3 million rows. A vector index that uses the cosine metric exists on the BodyVector column. The variable @q contains the embedding of a test query.

    You need to measure the recall at 20 of the approximate search for that query, as a decimal value between 0 and 1.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Articles de 3 millions de lignes. Un index vectoriel qui utilise la métrique cosinus existe sur la colonne BodyVector. La variable @q contient l'incorporation d'une requête de test.

    Vous devez mesurer le rappel à 20 de la recherche approximative pour cette requête, sous la forme d'une valeur décimale comprise entre 0 et 1.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    WITH ann AS (
        SELECT TOP (20) [[top]] a.ArticleId
        FROM VECTOR_SEARCH(TABLE = dbo.Articles AS a, COLUMN = BodyVector,
                           SIMILAR_TO = @q, METRIC = 'cosine') AS r
        ORDER BY r.distance
    ),
    exact AS (
        SELECT TOP (20) ArticleId
        FROM dbo.Articles
        ORDER BY [[exact]]
    )
    SELECT COUNT(*) / [[div]] AS recall_at_20
    FROM ann
    [[join]] exact ON exact.ArticleId = ann.ArticleId;
  slots:
    - id: top
      options:
        - { id: approx, text: WITH APPROXIMATE }
        - { id: ties, text: WITH TIES }
        - { id: pct, text: PERCENT }
    - id: exact
      options:
        - { id: cos, text: "VECTOR_DISTANCE('cosine', @q, BodyVector)" }
        - { id: cosdesc, text: "VECTOR_DISTANCE('cosine', @q, BodyVector) DESC" }
        - { id: euc, text: "VECTOR_DISTANCE('euclidean', @q, BodyVector)" }
        - { id: id, text: ArticleId }
    - id: div
      options:
        - { id: dec, text: "20.0" }
        - { id: int, text: "20" }
        - { id: all, text: "(SELECT COUNT(*) FROM dbo.Articles)" }
    - id: join
      options:
        - { id: inner, text: INNER JOIN }
        - { id: left, text: LEFT OUTER JOIN }
        - { id: full, text: FULL OUTER JOIN }
answer:
  values: { top: approx, exact: cos, div: dec, join: inner }
explanation:
  correct:
    en: "Recall of an ANN index is the share of the exact nearest neighbors that the approximate search also returns. The ann CTE uses TOP (20) WITH APPROXIMATE over VECTOR_SEARCH, the exact CTE computes VECTOR_DISTANCE with the same metric sorted ascending, the INNER JOIN counts the rows found by both, and dividing by 20.0 returns a decimal value."
    fr: "Le rappel d'un index ANN est la part des plus proches voisins exacts que la recherche approximative renvoie aussi. La CTE ann utilise TOP (20) WITH APPROXIMATE sur VECTOR_SEARCH, la CTE exact calcule VECTOR_DISTANCE avec la même métrique en ordre croissant, l'INNER JOIN compte les lignes trouvées par les deux, et diviser par 20.0 renvoie une valeur décimale."
  options:
    ties: { en: "Without WITH APPROXIMATE, the query runs an exact kNN search, so the measured recall would always be 1.", fr: "Sans WITH APPROXIMATE, la requête exécute une recherche kNN exacte : le rappel mesuré vaudrait toujours 1." }
    pct: { en: "TOP (20) PERCENT runs an exact search and returns 20 percent of the table, not the 20 approximate neighbors.", fr: "TOP (20) PERCENT exécute une recherche exacte et renvoie 20 pour cent de la table, pas les 20 voisins approximatifs." }
    cosdesc: { en: "A lower distance means a closer vector: DESC returns the farthest rows.", fr: "Une distance plus faible signifie un vecteur plus proche : DESC renvoie les lignes les plus éloignées." }
    euc: { en: "The reference must use the same metric as the approximate search.", fr: "La référence doit utiliser la même métrique que la recherche approximative." }
    int: { en: "COUNT(*) / 20 is an integer division that returns 0 or 1.", fr: "COUNT(*) / 20 est une division entière qui renvoie 0 ou 1." }
    left: { en: "A LEFT OUTER JOIN from ann counts all 20 approximate rows, so the result would always be 1.", fr: "Un LEFT OUTER JOIN depuis ann compte les 20 lignes approximatives : le résultat vaudrait toujours 1." }
    full: { en: "A FULL OUTER JOIN counts the rows of either list, not only the rows found by both.", fr: "Un FULL OUTER JOIN compte les lignes de l'une ou l'autre liste, pas seulement celles trouvées par les deux." }
references:
  - title: Vector search and vector indexes in the SQL Database Engine
    url: https://learn.microsoft.com/en-us/sql/sql-server/ai/vectors
  - title: VECTOR_SEARCH (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
