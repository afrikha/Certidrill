id: dp800-3b-hy-outer-join
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are implementing a hybrid search in an Azure SQL database. A CTE named keyword returns the top 50 products found by FREETEXTTABLE with their rank (kw_rank). A CTE named semantic returns the top 50 products found by VECTOR_SEARCH with their rank (vec_rank). The two lists are combined as follows.

    ```sql
    SELECT k.ProductID, k.kw_rank, s.vec_rank
    FROM keyword AS k
    LEFT OUTER JOIN semantic AS s ON s.ProductID = k.ProductID;
    ```

    Users report that products that match their search only by meaning never appear in the results.

    You need to fix the query.

    What should you do?
  fr: |
    Vous implémentez une recherche hybride dans une base de données Azure SQL. Une CTE nommée keyword renvoie les 50 premiers produits trouvés par FREETEXTTABLE avec leur rang (kw_rank). Une CTE nommée semantic renvoie les 50 premiers produits trouvés par VECTOR_SEARCH avec leur rang (vec_rank). Les deux listes sont combinées comme suit.

    ```sql
    SELECT k.ProductID, k.kw_rank, s.vec_rank
    FROM keyword AS k
    LEFT OUTER JOIN semantic AS s ON s.ProductID = k.ProductID;
    ```

    Des utilisateurs signalent que les produits qui correspondent à leur recherche uniquement par le sens n'apparaissent jamais dans les résultats.

    Vous devez corriger la requête.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Use an INNER JOIN, and select k.ProductID as the product ID.", fr: "Utiliser une jointure INNER JOIN, et sélectionner k.ProductID comme ID de produit." } }
    - { id: b, text: { en: "Keep the LEFT OUTER JOIN, and increase the keyword CTE to TOP (500).", fr: "Conserver la jointure LEFT OUTER JOIN, et porter la CTE keyword à TOP (500)." } }
    - { id: c, text: { en: "Keep the LEFT OUTER JOIN, and replace FREETEXTTABLE with CONTAINSTABLE.", fr: "Conserver la jointure LEFT OUTER JOIN, et remplacer FREETEXTTABLE par CONTAINSTABLE." } }
    - { id: d, text: { en: "Use a FULL OUTER JOIN, and select COALESCE(k.ProductID, s.ProductID) as the product ID.", fr: "Utiliser une jointure FULL OUTER JOIN, et sélectionner COALESCE(k.ProductID, s.ProductID) comme ID de produit." } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A hybrid search must keep every row found by either search. A FULL OUTER JOIN keeps the products found only by keywords and the products found only by meaning, and COALESCE returns the product ID from whichever side is present.
    fr: |-
      Une recherche hybride doit conserver chaque ligne trouvée par l'une ou l'autre recherche. Une jointure FULL OUTER JOIN conserve les produits trouvés uniquement par mots clés et ceux trouvés uniquement par le sens, et COALESCE renvoie l'ID de produit du côté présent.
  options:
    a: { en: "An INNER JOIN keeps only the products found by both searches, which drops even more results.", fr: "Une jointure INNER JOIN ne conserve que les produits trouvés par les deux recherches, ce qui supprime encore plus de résultats." }
    b: { en: "A LEFT OUTER JOIN from the keyword list always drops the products that no keyword search returns.", fr: "Une jointure LEFT OUTER JOIN depuis la liste par mots clés supprime toujours les produits qu'aucune recherche par mots clés ne renvoie." }
    c: { en: "Changing the full-text function does not change the join, which still drops the vector-only products.", fr: "Changer de fonction de texte intégral ne change pas la jointure, qui supprime toujours les produits trouvés uniquement par vecteur." }
references:
  - title: Implement hybrid search and ranking
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
