id: dp800-cs4a-transcript-chunks
objective: "3.1.5"
type: single
caseStudy: dp800-cs4a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to populate dbo.LessonChunks from dbo.Lessons. Embeddings will be generated in a later step. The solution must meet the Tutor requirements.

    Which statement should you run?
  fr: |
    Vous devez remplir dbo.LessonChunks à partir de dbo.Lessons. Les incorporations seront générées lors d'une étape ultérieure. La solution doit satisfaire les exigences de Tutor.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - id: a
      text:
        en: "`INSERT INTO dbo.LessonChunks (LessonId, ChunkOrder, ChunkText) SELECT l.LessonId, c.chunk_order, c.chunk FROM dbo.Lessons AS l CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 2000, OVERLAP = 200) AS c;`"
        fr: "`INSERT INTO dbo.LessonChunks (LessonId, ChunkOrder, ChunkText) SELECT l.LessonId, c.chunk_order, c.chunk FROM dbo.Lessons AS l CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 2000, OVERLAP = 200) AS c;`"
    - id: b
      text:
        en: "`INSERT INTO dbo.LessonChunks (LessonId, ChunkOrder, ChunkText) SELECT l.LessonId, c.chunk_order, c.chunk FROM dbo.Lessons AS l CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 2000, OVERLAP = 10) AS c;`"
        fr: "`INSERT INTO dbo.LessonChunks (LessonId, ChunkOrder, ChunkText) SELECT l.LessonId, c.chunk_order, c.chunk FROM dbo.Lessons AS l CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 2000, OVERLAP = 10) AS c;`"
    - id: c
      text:
        en: "`INSERT INTO dbo.LessonChunks (LessonId, ChunkOrder, ChunkText) SELECT l.LessonId, c.chunk_order, c.chunk FROM dbo.Lessons AS l CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 1800, OVERLAP = 10) AS c;`"
        fr: "`INSERT INTO dbo.LessonChunks (LessonId, ChunkOrder, ChunkText) SELECT l.LessonId, c.chunk_order, c.chunk FROM dbo.Lessons AS l CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 1800, OVERLAP = 10) AS c;`"
    - id: d
      text:
        en: "`INSERT INTO dbo.LessonChunks (LessonId, ChunkOrder, ChunkText) SELECT l.LessonId, c.chunk_set_id, c.chunk FROM dbo.Lessons AS l CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 2000, OVERLAP = 10, ENABLE_CHUNK_SET_ID = 1) AS c;`"
        fr: "`INSERT INTO dbo.LessonChunks (LessonId, ChunkOrder, ChunkText) SELECT l.LessonId, c.chunk_set_id, c.chunk FROM dbo.Lessons AS l CROSS APPLY AI_GENERATE_CHUNKS(SOURCE = l.Transcript, CHUNK_TYPE = FIXED, CHUNK_SIZE = 2000, OVERLAP = 10, ENABLE_CHUNK_SET_ID = 1) AS c;`"
answer: { optionId: b }
explanation:
  correct:
    en: |
      AI_GENERATE_CHUNKS takes CHUNK_SIZE as a number of characters and OVERLAP as a percentage of CHUNK_SIZE, from 0 to 50, so 2,000 characters with OVERLAP = 10 gives the required 200 shared characters. The chunk_order column numbers the chunks of each source row from 1, which keeps the position of each chunk next to its LessonId. The function requires compatibility level 170, which LearningDb uses.
    fr: |
      AI_GENERATE_CHUNKS reçoit CHUNK_SIZE sous forme de nombre de caractères et OVERLAP sous forme de pourcentage de CHUNK_SIZE, de 0 à 50 : 2 000 caractères avec OVERLAP = 10 donnent les 200 caractères partagés exigés. La colonne chunk_order numérote les blocs de chaque ligne source à partir de 1, ce qui conserve la position de chaque bloc à côté de son LessonId. La fonction exige le niveau de compatibilité 170, celui de LearningDb.
  options:
    a: { en: "OVERLAP is a percentage, not a number of characters, and it must be between 0 and 50, so 200 is rejected.", fr: "OVERLAP est un pourcentage, pas un nombre de caractères, et doit être compris entre 0 et 50 : la valeur 200 est rejetée." }
    c: { en: "The overlap is taken from the previous text and is not added to CHUNK_SIZE: chunks of 1,800 characters break requirement 1, and 10 % of 1,800 is 180 characters.", fr: "Le chevauchement est pris dans le texte précédent et ne s'ajoute pas à CHUNK_SIZE : des blocs de 1 800 caractères ne respectent pas l'exigence 1, et 10 % de 1 800 font 180 caractères." }
    d: { en: "chunk_set_id identifies all the chunks of one source row; it has the same value for every chunk of a lesson and does not give the position of a chunk.", fr: "chunk_set_id identifie tous les blocs d'une même ligne source ; il a la même valeur pour chaque bloc d'une leçon et ne donne pas la position d'un bloc." }
references:
  - title: AI_GENERATE_CHUNKS (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
