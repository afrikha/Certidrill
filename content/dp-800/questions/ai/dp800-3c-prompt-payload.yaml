id: dp800-3c-prompt-payload
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database. A stored procedure calls an Azure OpenAI chat completions deployment by using sp_invoke_external_rest_endpoint. The URL of the deployment contains the deployment name. The variable @rules contains grounding instructions, @context contains the retrieved rows as JSON, and @question contains the user's question.

    You need to build the payload. The grounding instructions must apply to the whole conversation, and the answers must be consistent and factual.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL. Une procédure stockée appelle un déploiement de complétions de conversation Azure OpenAI avec sp_invoke_external_rest_endpoint. L'URL du déploiement contient le nom du déploiement. La variable @rules contient des instructions d'ancrage, @context contient les lignes récupérées au format JSON et @question contient la question de l'utilisateur.

    Vous devez construire la charge utile. Les instructions d'ancrage doivent s'appliquer à toute la conversation, et les réponses doivent être cohérentes et factuelles.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    DECLARE @payload NVARCHAR(MAX) = JSON_OBJECT(
        [[key]]: JSON_ARRAY(
            JSON_OBJECT('role': [[role]], 'content': @rules),
            JSON_OBJECT('role': 'user',
                        'content': CONCAT(N'Context: ', @context, N' Question: ', @question))
        ),
        'max_tokens': 400,
        'temperature': [[temp]]
    );
  slots:
    - id: key
      options:
        - { id: messages, text: "'messages'" }
        - { id: prompt, text: "'prompt'" }
        - { id: input, text: "'input'" }
        - { id: context, text: "'context'" }
    - id: role
      options:
        - { id: system, text: "'system'" }
        - { id: assistant, text: "'assistant'" }
        - { id: user, text: "'user'" }
    - id: temp
      options:
        - { id: low, text: "0.3" }
        - { id: mid, text: "1.2" }
        - { id: high, text: "2.0" }
answer:
  values: { key: messages, role: system, temp: low }
explanation:
  correct:
    en: "A chat completions request takes a messages array in which each message has a role and a content. The system message sets the rules for the whole conversation, such as answering only from the supplied data. A low temperature, around 0.3 to 0.5, favors consistent and factual answers in RAG."
    fr: "Une requête de complétions de conversation prend un tableau messages dans lequel chaque message a un rôle (role) et un contenu (content). Le message system fixe les règles de toute la conversation, comme répondre uniquement à partir des données fournies. Une température basse, autour de 0,3 à 0,5, favorise des réponses cohérentes et factuelles en RAG."
  options:
    prompt: { en: "A chat completions request carries the conversation in a messages array, not in a prompt property.", fr: "Une requête de complétions de conversation transporte la conversation dans un tableau messages, pas dans une propriété prompt." }
    context: { en: "context isn't a property of a chat completions request; the retrieved data goes into the content of a message.", fr: "context n'est pas une propriété d'une requête de complétions de conversation ; les données récupérées vont dans le contenu d'un message." }
    input: { en: "input is the property of an embeddings request, not of a chat completions request.", fr: "input est la propriété d'une requête d'incorporations, pas d'une requête de complétions de conversation." }
    assistant: { en: "The assistant role holds earlier answers of the model in a multi-turn conversation.", fr: "Le rôle assistant contient les réponses précédentes du modèle dans une conversation à plusieurs tours." }
    user: { en: "The user role carries the question and the context; rules for the whole conversation go in the system message.", fr: "Le rôle user porte la question et le contexte ; les règles de toute la conversation vont dans le message system." }
    mid: { en: "A temperature above 1 makes answers more varied; values around 0.3 to 0.5 suit factual RAG answers.", fr: "Une température supérieure à 1 rend les réponses plus variées ; des valeurs autour de 0,3 à 0,5 conviennent aux réponses factuelles en RAG." }
    high: { en: "Temperature ranges from 0 to 2; high values make answers more varied, which is undesirable for RAG.", fr: "La température va de 0 à 2 ; les valeurs élevées rendent les réponses plus variées, ce qui n'est pas souhaitable en RAG." }
references:
  - title: Augment prompts with database context
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-rag-with-sql/4-augment-prompts-database-context
  - title: Work with chat completion models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/chatgpt
