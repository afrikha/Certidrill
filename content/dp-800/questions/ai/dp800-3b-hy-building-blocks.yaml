id: dp800-3b-hy-building-blocks
objective: "3.2.8"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has an Azure SQL database that contains a table named dbo.Products with 5 million rows. A full-text index covers the Description column, and a vector index covers the DescriptionVector column. You are writing a hybrid search query that fuses the two result lists with reciprocal rank fusion (RRF).

    Which fragment should you use for each part of the query? To answer, drag the appropriate fragments to the correct parts. Each fragment may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'une base de données Azure SQL qui contient une table nommée dbo.Products de 5 millions de lignes. Un index de recherche en texte intégral couvre la colonne Description, et un index vectoriel couvre la colonne DescriptionVector. Vous écrivez une requête de recherche hybride qui fusionne les deux listes de résultats avec la fusion de classement réciproque (RRF).

    Quel fragment devez-vous utiliser pour chaque partie de la requête ? Pour répondre, faites glisser les fragments appropriés vers les parties correspondantes. Chaque fragment peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ftt, text: "FREETEXTTABLE(dbo.Products, Description, @text)" }
    - { id: contains, text: "CONTAINS(Description, @text)" }
    - { id: vs, text: "VECTOR_SEARCH(...) with SELECT TOP (50) WITH APPROXIMATE" }
    - { id: vd, text: "VECTOR_DISTANCE('cosine', @qv, DescriptionVector) on every row" }
    - { id: full, text: FULL OUTER JOIN }
    - { id: inner, text: INNER JOIN }
    - { id: desc, text: ORDER BY rrf_score DESC }
    - { id: asc, text: ORDER BY rrf_score ASC }
  targets:
    - { id: t1, text: { en: "Keyword candidates ranked by relevance", fr: "Candidats par mots clés classés par pertinence" } }
    - { id: t2, text: { en: "Semantic candidates retrieved through the vector index", fr: "Candidats sémantiques récupérés au moyen de l'index vectoriel" } }
    - { id: t3, text: { en: "Combination of the two candidate lists", fr: "Combinaison des deux listes de candidats" } }
    - { id: t4, text: { en: "Order of the fused results", fr: "Ordre des résultats fusionnés" } }
answer:
  mapping: { t1: ftt, t2: vs, t3: full, t4: desc }
explanation:
  correct:
    en: |-
      FREETEXTTABLE returns the matching keys with a RANK value used to rank the keyword list. On a large table, VECTOR_SEARCH with TOP (N) WITH APPROXIMATE retrieves the semantic candidates through the DiskANN index. A FULL OUTER JOIN keeps the rows found by either search, and a higher RRF score means a more relevant row, so the results are sorted in descending order.
    fr: |-
      FREETEXTTABLE renvoie les clés trouvées avec une valeur RANK qui sert à classer la liste par mots clés. Sur une grande table, VECTOR_SEARCH avec TOP (N) WITH APPROXIMATE récupère les candidats sémantiques au moyen de l'index DiskANN. Une jointure FULL OUTER JOIN conserve les lignes trouvées par l'une ou l'autre recherche, et un score RRF plus élevé signifie une ligne plus pertinente : les résultats sont donc triés par ordre décroissant.
  options:
    contains: { en: "CONTAINS only filters rows in a WHERE clause; it returns no rank.", fr: "CONTAINS filtre seulement les lignes dans une clause WHERE ; il ne renvoie aucun rang." }
    vd: { en: "VECTOR_DISTANCE is exact and never uses the vector index.", fr: "VECTOR_DISTANCE est exacte et n'utilise jamais l'index vectoriel." }
    inner: { en: "An INNER JOIN keeps only the rows found by both searches.", fr: "Une jointure INNER JOIN ne conserve que les lignes trouvées par les deux recherches." }
    asc: { en: "Ascending order returns the least relevant rows first.", fr: "L'ordre croissant renvoie d'abord les lignes les moins pertinentes." }
references:
  - title: Implement hybrid search and ranking
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
