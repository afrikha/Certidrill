id: dp800-3b-ann-tenant-filter
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs a multitenant application on an Azure SQL database. The dbo.TenantDocs table contains 9 million rows for 800 tenants, and each row has an embedding in a VECTOR(1536) column. Every search filters on TenantID, and the largest tenant has 18,000 rows.

    You need to implement the semantic search. The solution must meet the following requirements:

    - Return the exact nearest neighbors.
    - Minimize the number of objects to maintain.

    What should you do?
  fr: |
    Proseware exécute une application multilocataire sur une base de données Azure SQL. La table dbo.TenantDocs contient 9 millions de lignes pour 800 locataires, et chaque ligne possède une incorporation dans une colonne VECTOR(1536). Chaque recherche filtre sur TenantID, et le plus grand locataire compte 18 000 lignes.

    Vous devez implémenter la recherche sémantique. La solution doit satisfaire les exigences suivantes :

    - Renvoyer les plus proches voisins exacts.
    - Réduire au minimum le nombre d'objets à maintenir.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a vector index on the embedding column, and use VECTOR_SEARCH with TOP (N) WITH APPROXIMATE.", fr: "Créer un index vectoriel sur la colonne d'incorporation, et utiliser VECTOR_SEARCH avec TOP (N) WITH APPROXIMATE." } }
    - { id: b, text: { en: "Create one table per tenant with its own vector index, and use VECTOR_SEARCH on that table.", fr: "Créer une table par locataire avec son propre index vectoriel, et utiliser VECTOR_SEARCH sur cette table." } }
    - { id: c, text: { en: "Create a nonclustered index on TenantID, and use VECTOR_DISTANCE with WHERE TenantID = @tenant.", fr: "Créer un index non cluster sur TenantID, et utiliser VECTOR_DISTANCE avec WHERE TenantID = @tenant." } }
    - { id: d, text: { en: "Create a vector index partitioned on TenantID, and use VECTOR_SEARCH with WHERE TenantID = @tenant.", fr: "Créer un index vectoriel partitionné sur TenantID, et utiliser VECTOR_SEARCH avec WHERE TenantID = @tenant." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The 50,000-vector guideline for exact search applies to the vectors left after the search predicates, not to the size of the table. Filtering on TenantID leaves at most 18,000 vectors, so an exact search with VECTOR_DISTANCE is efficient, returns the true nearest neighbors, and needs only an ordinary index to seek the tenant's rows.
    fr: |-
      Le repère de 50 000 vecteurs pour la recherche exacte s'applique aux vecteurs qui restent après les prédicats de recherche, pas à la taille de la table. Le filtre sur TenantID laisse au plus 18 000 vecteurs : une recherche exacte avec VECTOR_DISTANCE est efficace, renvoie les vrais plus proches voisins et n'a besoin que d'un index ordinaire pour rechercher les lignes du locataire.
  options:
    a: { en: "An approximate search does not guarantee the exact nearest neighbors.", fr: "Une recherche approximative ne garantit pas les plus proches voisins exacts." }
    b: { en: "800 tables and 800 indexes maximize the objects to maintain, and the searches would still be approximate.", fr: "800 tables et 800 index maximisent les objets à maintenir, et les recherches resteraient approximatives." }
    d: { en: "Vector indexes cannot be partitioned, and the search would still be approximate.", fr: "Les index vectoriels ne peuvent pas être partitionnés, et la recherche resterait approximative." }
references:
  - title: Vector search and vector indexes in the SQL Database Engine
    url: https://learn.microsoft.com/en-us/sql/sql-server/ai/vectors
