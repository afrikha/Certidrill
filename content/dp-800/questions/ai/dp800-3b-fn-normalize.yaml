id: dp800-3b-fn-normalize
objective: "3.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Images. The Features column of type VECTOR(512) contains vectors generated by an open-source model that does not return normalized vectors.

    You plan to search the vectors by using METRIC = 'dot'. The searches must rank the images in the same order as a search that uses cosine distance.

    You need to update the stored vectors.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Images. La colonne Features, de type VECTOR(512), contient des vecteurs générés par un modèle open source qui ne renvoie pas de vecteurs normalisés.

    Vous prévoyez de rechercher les vecteurs avec METRIC = 'dot'. Les recherches doivent classer les images dans le même ordre qu'une recherche qui utilise la distance cosinus.

    Vous devez mettre à jour les vecteurs stockés.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    UPDATE dbo.Images
    SET Features = [[fn]](Features, [[norm]]);
  slots:
    - id: fn
      options:
        - { id: normalize, text: VECTOR_NORMALIZE }
        - { id: norm, text: VECTOR_NORM }
        - { id: property, text: VECTORPROPERTY }
    - id: norm
      options:
        - { id: norm2, text: "'norm2'" }
        - { id: norm1, text: "'norm1'" }
        - { id: norminf, text: "'norminf'" }
answer:
  values: { fn: normalize, norm: norm2 }
explanation:
  correct:
    en: |-
      VECTOR_NORMALIZE returns a vector with the same direction and a length of 1 according to the given norm. With the Euclidean norm (norm2), the dot product of unit-length vectors equals their cosine similarity, so a dot product search ranks the rows in the same order as a cosine search.
    fr: |-
      VECTOR_NORMALIZE renvoie un vecteur de même direction et de longueur 1 selon la norme indiquée. Avec la norme euclidienne (norm2), le produit scalaire de vecteurs de longueur unitaire est égal à leur similarité cosinus : une recherche par produit scalaire classe donc les lignes dans le même ordre qu'une recherche cosinus.
  options:
    norm: { en: "VECTOR_NORM returns a float, the length of the vector, which cannot be assigned to a vector column.", fr: "VECTOR_NORM renvoie un float, la longueur du vecteur, qui ne peut pas être affecté à une colonne vectorielle." }
    property: { en: "VECTORPROPERTY returns the dimensions or the base type of a vector, not a vector.", fr: "VECTORPROPERTY renvoie les dimensions ou le type de base d'un vecteur, pas un vecteur." }
    norm1: { en: "Scaling by the sum of the absolute values does not give vectors of Euclidean length 1, so dot products do not match cosine similarity.", fr: "Une mise à l'échelle par la somme des valeurs absolues ne donne pas des vecteurs de longueur euclidienne 1 : les produits scalaires ne correspondent pas à la similarité cosinus." }
    norminf: { en: "Scaling by the largest absolute value does not give vectors of Euclidean length 1, so dot products do not match cosine similarity.", fr: "Une mise à l'échelle par la plus grande valeur absolue ne donne pas des vecteurs de longueur euclidienne 1 : les produits scalaires ne correspondent pas à la similarité cosinus." }
references:
  - title: VECTOR_NORMALIZE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-normalize-transact-sql
