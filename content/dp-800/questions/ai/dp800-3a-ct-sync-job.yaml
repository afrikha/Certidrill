id: dp800-3a-ct-sync-job
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure SQL database. Change Tracking is enabled on the database and on dbo.Products. The embeddings of the product descriptions are stored in dbo.ProductEmbeddings, which has one row per product and isn't tracked. Another process creates the rows of new products.

    A job runs every 10 minutes to regenerate the embeddings of the products updated since its previous run. dbo.EmbeddingSync stores the version reached by the previous run.

    How should you complete the job? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une base de données Azure SQL. Le suivi des modifications est activé sur la base de données et sur dbo.Products. Les incorporations des descriptions de produits sont stockées dans dbo.ProductEmbeddings, qui contient une ligne par produit et n'est pas suivie. Un autre processus crée les lignes des nouveaux produits.

    Un travail s'exécute toutes les 10 minutes pour régénérer les incorporations des produits mis à jour depuis son exécution précédente. dbo.EmbeddingSync stocke la version atteinte par l'exécution précédente.

    Comment devez-vous compléter le travail ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    DECLARE @last BIGINT = (SELECT LastVersion FROM dbo.EmbeddingSync);
    DECLARE @now  BIGINT = [[cur]];

    UPDATE e
    SET e.Embedding = AI_GENERATE_EMBEDDINGS(p.Description USE MODEL EmbedModel)
    FROM dbo.ProductEmbeddings AS e
    INNER JOIN [[src]] AS ct ON ct.ProductID = e.ProductID
    INNER JOIN dbo.Products AS p ON p.ProductID = ct.ProductID
    WHERE ct.SYS_CHANGE_OPERATION = [[op]];

    UPDATE dbo.EmbeddingSync SET LastVersion = @now;
  slots:
    - id: cur
      options:
        - { id: current, text: CHANGE_TRACKING_CURRENT_VERSION() }
        - { id: minvalid, text: "CHANGE_TRACKING_MIN_VALID_VERSION(OBJECT_ID('dbo.Products'))" }
        - { id: dbts, text: "@@DBTS" }
    - id: src
      options:
        - { id: products, text: "CHANGETABLE(CHANGES dbo.Products, @last)" }
        - { id: embeddings, text: "CHANGETABLE(CHANGES dbo.ProductEmbeddings, @last)" }
        - { id: cdc, text: "cdc.fn_cdc_get_net_changes_dbo_Products(@last, @now, N'all')" }
    - id: op
      options:
        - { id: u, text: "'U'" }
        - { id: i, text: "'I'" }
        - { id: d, text: "'D'" }
answer:
  values: { cur: current, src: products, op: u }
explanation:
  correct:
    en: |
      CHANGE_TRACKING_CURRENT_VERSION() returns the version to store for the next run. CHANGETABLE(CHANGES dbo.Products, @last) returns the primary key of each row of the tracked table changed since @last, with SYS_CHANGE_OPERATION set to I, U or D; the job joins back to dbo.Products to read the current description. Updated products have the operation 'U'.
    fr: |
      CHANGE_TRACKING_CURRENT_VERSION() retourne la version à stocker pour l'exécution suivante. CHANGETABLE(CHANGES dbo.Products, @last) retourne la clé primaire de chaque ligne de la table suivie modifiée depuis @last, avec SYS_CHANGE_OPERATION à I, U ou D ; le travail rejoint dbo.Products pour lire la description actuelle. Les produits mis à jour ont l'opération 'U'.
  options:
    minvalid: { en: "CHANGE_TRACKING_MIN_VALID_VERSION returns the oldest version still retained, used to detect that a resynchronization is needed.", fr: "CHANGE_TRACKING_MIN_VALID_VERSION retourne la plus ancienne version encore conservée, utilisée pour détecter qu'une resynchronisation est nécessaire." }
    dbts: { en: "@@DBTS returns the last rowversion value of the database, not a change tracking version.", fr: "@@DBTS retourne la dernière valeur rowversion de la base de données, pas une version du suivi des modifications." }
    embeddings: { en: "dbo.ProductEmbeddings isn't tracked, and the changes to detect are those of dbo.Products.", fr: "dbo.ProductEmbeddings n'est pas suivie, et les modifications à détecter sont celles de dbo.Products." }
    cdc: { en: "CDC functions take log sequence numbers and require CDC on the table, which isn't enabled.", fr: "Les fonctions CDC prennent des numéros séquentiels dans le journal et exigent CDC sur la table, qui n'est pas activé." }
    i: { en: "'I' identifies inserted rows, which another process handles.", fr: "'I' identifie les lignes insérées, gérées par un autre processus." }
    d: { en: "'D' identifies deleted rows, which no longer have a description to embed.", fr: "'D' identifie les lignes supprimées, qui n'ont plus de description à incorporer." }
references:
  - title: About Change Tracking (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-tracking-sql-server
  - title: Generate and maintain embeddings for SQL database workloads
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/05-generate-maintain-embeddings-sql-database-workloads
