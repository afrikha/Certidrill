stem:
  en: You query VECTOR_SEARCH with TOP (10) WITH APPROXIMATE.
  fr: Vous interrogez VECTOR_SEARCH avec TOP (10) WITH APPROXIMATE.
body:
  solution:
    en: |
      You write the following query:

      ```sql
      SELECT TOP (10) WITH APPROXIMATE
          e.ProductID, r.distance
      FROM VECTOR_SEARCH(
              TABLE = dbo.ProductEmbeddings AS e,
              COLUMN = Embedding,
              SIMILAR_TO = @q,
              METRIC = 'cosine'
          ) AS r
      ORDER BY r.distance;
      ```
    fr: |
      Vous écrivez la requête suivante :

      ```sql
      SELECT TOP (10) WITH APPROXIMATE
          e.ProductID, r.distance
      FROM VECTOR_SEARCH(
              TABLE = dbo.ProductEmbeddings AS e,
              COLUMN = Embedding,
              SIMILAR_TO = @q,
              METRIC = 'cosine'
          ) AS r
      ORDER BY r.distance;
      ```
answer: { value: true }
explanation:
  correct:
    en: VECTOR_SEARCH is the function that performs an approximate nearest neighbor search through a vector index. With a latest-version index, the query uses SELECT TOP (N) WITH APPROXIMATE and orders only by the generated distance column, in ascending order. The METRIC argument matches the cosine metric of the index on the Embedding column, so the index can be used.
    fr: "VECTOR_SEARCH est la fonction qui effectue une recherche approximative des plus proches voisins au moyen d'un index vectoriel. Avec un index de dernière version, la requête utilise SELECT TOP (N) WITH APPROXIMATE et trie uniquement sur la colonne générée distance, dans l'ordre croissant. L'argument METRIC correspond à la métrique cosine de l'index sur la colonne Embedding : l'index peut être utilisé."
references:
