id: dp800-3b-ann-statements
objective: "3.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database that contains a table named dbo.Listings with 4 million rows. A latest-version vector index that uses the cosine metric exists on the DescriptionVector column.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Listings de 4 millions de lignes. Un index vectoriel de dernière version qui utilise la métrique cosinus existe sur la colonne DescriptionVector.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The 50,000-vector guideline for exact search applies to the number of vectors left after the WHERE predicates, not to the number of rows in dbo.Listings.
        fr: |-
          Le repère de 50 000 vecteurs pour la recherche exacte s'applique au nombre de vecteurs qui restent après les prédicats WHERE, pas au nombre de lignes de dbo.Listings.
    - id: s2
      text:
        en: |-
          A query that orders the rows by VECTOR_DISTANCE('cosine', @qv, DescriptionVector) uses the vector index.
        fr: |-
          Une requête qui trie les lignes par VECTOR_DISTANCE('cosine', @qv, DescriptionVector) utilise l'index vectoriel.
    - id: s3
      text:
        en: |-
          A query that uses SELECT TOP (10) WITH APPROXIMATE with VECTOR_SEARCH always uses the vector index.
        fr: |-
          Une requête qui utilise SELECT TOP (10) WITH APPROXIMATE avec VECTOR_SEARCH utilise toujours l'index vectoriel.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      Exact search is recommended for fewer than about 50,000 vectors, and the table can be much larger as long as the predicates reduce the vectors to search to that number. VECTOR_DISTANCE is always exact and never uses a vector index. With a latest-version index, the optimizer chooses between the DiskANN index and a kNN scan; only the FORCE_ANN_ONLY hint forces the index.
    fr: |-
      La recherche exacte est recommandée pour moins d'environ 50 000 vecteurs, et la table peut être beaucoup plus grande tant que les prédicats réduisent les vecteurs à rechercher à ce nombre. VECTOR_DISTANCE est toujours exacte et n'utilise jamais d'index vectoriel. Avec un index de dernière version, l'optimiseur choisit entre l'index DiskANN et une analyse kNN ; seul l'indicateur FORCE_ANN_ONLY force l'index.
references:
  - title: Vector search and vector indexes in the SQL Database Engine
    url: https://learn.microsoft.com/en-us/sql/sql-server/ai/vectors
  - title: CREATE VECTOR INDEX (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql
