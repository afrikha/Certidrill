id: dp800-3b-fn-facts
objective: "3.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are writing semantic search queries for an Azure SQL database that stores product embeddings in a VECTOR(1536) column.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez des requêtes de recherche sémantique pour une base de données Azure SQL qui stocke des incorporations de produits dans une colonne VECTOR(1536).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          VECTOR_DISTANCE with the dot metric returns the negative dot product, so a smaller value means more similar vectors.
        fr: |-
          VECTOR_DISTANCE avec la métrique dot renvoie le produit scalaire négatif ; une valeur plus petite signifie donc des vecteurs plus similaires.
    - id: s2
      text:
        en: |-
          A cosine distance of 2 between two vectors means that they point in the same direction.
        fr: |-
          Une distance cosinus de 2 entre deux vecteurs signifie qu'ils pointent dans la même direction.
    - id: s3
      text:
        en: |-
          VECTOR_NORMALIZE returns a float value that is the length of the input vector.
        fr: |-
          VECTOR_NORMALIZE renvoie une valeur float qui est la longueur du vecteur d'entrée.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      The dot metric of VECTOR_DISTANCE returns the negative dot product, from minus infinity to plus infinity, so that smaller values still indicate more similar vectors. Cosine distance ranges from 0, identical direction, to 2, opposite vectors. VECTOR_NORMALIZE returns a vector of length 1; the length itself, as a float, is returned by VECTOR_NORM.
    fr: |-
      La métrique dot de VECTOR_DISTANCE renvoie le produit scalaire négatif, de moins l'infini à plus l'infini, afin qu'une valeur plus petite indique toujours des vecteurs plus similaires. La distance cosinus va de 0, même direction, à 2, vecteurs opposés. VECTOR_NORMALIZE renvoie un vecteur de longueur 1 ; la longueur elle-même, sous forme de float, est renvoyée par VECTOR_NORM.
references:
  - title: VECTOR_DISTANCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
  - title: VECTOR_NORMALIZE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-normalize-transact-sql
