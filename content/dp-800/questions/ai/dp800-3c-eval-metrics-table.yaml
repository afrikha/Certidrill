id: dp800-3c-eval-metrics-table
objective: "3.2.10"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL database in Microsoft Fabric that contains product reviews. You ran a test set of 200 queries with known relevant reviews against four search configurations. The results are shown in the following table.

    Answer each prompt by selecting the configuration in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données SQL dans Microsoft Fabric qui contient des avis sur des produits. Vous avez exécuté un jeu de test de 200 requêtes, dont les avis pertinents sont connus, sur quatre configurations de recherche. Les résultats figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la configuration dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The configuration that returns the largest share of all the relevant reviews", fr: "La configuration qui renvoie la plus grande part de tous les avis pertinents" }
    - id: p2
      text: { en: "The configuration whose first relevant review appears highest in the results, on average", fr: "La configuration dont le premier avis pertinent apparaît le plus haut dans les résultats, en moyenne" }
  grid:
    header: [{ en: "Configuration", fr: "Configuration" }, { en: "Precision at 10", fr: "Précision à 10" }, { en: "Recall at 10", fr: "Rappel à 10" }, MRR]
    rows:
      - [{ text: { en: "Full-text only", fr: "Texte intégral seul" }, area: ft }, { text: "0.62" }, { text: "0.41" }, { text: "0.71" }]
      - [{ text: { en: "Vector only", fr: "Vectoriel seul" }, area: vec }, { text: "0.58" }, { text: "0.55" }, { text: "0.64" }]
      - [{ text: { en: "Hybrid, RRF k = 60", fr: "Hybride, RRF k = 60" }, area: hyb }, { text: "0.60" }, { text: "0.68" }, { text: "0.69" }]
      - [{ text: { en: "Hybrid, RRF k = 60, vector weight 2.0", fr: "Hybride, RRF k = 60, poids vectoriel 2.0" }, area: hybw }, { text: "0.57" }, { text: "0.72" }, { text: "0.61" }]
answer:
  values: { p1: hybw, p2: ft }
explanation:
  correct:
    en: "Recall is the share of all relevant rows that the search returns: the weighted hybrid configuration has the highest recall at 10 (0.72). Mean reciprocal rank (MRR) measures how high the first relevant row appears on average: the full-text configuration has the highest MRR (0.71). Precision is the share of returned rows that are relevant and answers neither prompt."
    fr: "Le rappel est la part de toutes les lignes pertinentes que la recherche renvoie : la configuration hybride pondérée a le meilleur rappel à 10 (0,72). Le rang réciproque moyen (MRR) mesure à quelle hauteur apparaît en moyenne la première ligne pertinente : la configuration en texte intégral a le meilleur MRR (0,71). La précision est la part des lignes renvoyées qui sont pertinentes et ne répond à aucune des deux consignes."
references:
  - title: Implement hybrid search and ranking
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
