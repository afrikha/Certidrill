id: dp800-2a-audit-ms-support
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL logical server named **sql-contoso** that hosts several databases.

    A compliance rule requires you to record the operations that Microsoft support engineers perform on sql-contoso when they access it during a support request.

    What should you configure?
  fr: |
    Vous disposez d'un serveur logique Azure SQL nommé **sql-contoso** qui héberge plusieurs bases de données.

    Une règle de conformité vous impose d'enregistrer les opérations que les ingénieurs du support Microsoft effectuent sur sql-contoso lorsqu'ils y accèdent pendant une demande de support.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A database-level audit with BATCH_COMPLETED_GROUP on each database", fr: "Un audit au niveau de chaque base de données avec BATCH_COMPLETED_GROUP" }
    - id: b
      text: { en: "A diagnostic setting that sends the Azure activity log to Log Analytics", fr: "Un paramètre de diagnostic qui envoie le journal d'activité Azure à Log Analytics" }
    - id: c
      text: { en: "An export of the Microsoft Entra sign-in logs to a storage account", fr: "Une exportation des journaux de connexion Microsoft Entra vers un compte de stockage" }
    - id: d
      text: { en: "Auditing of Microsoft support operations on sql-contoso", fr: "L'audit des opérations du support Microsoft sur sql-contoso" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure SQL Database has a dedicated auditing policy for Microsoft support operations, configured at the server level (portal, Set-AzSqlServerMSSupportAudit or az sql server ms-support audit-policy). In Log Analytics, these events use the DevOpsOperationsAudit category, separate from the SQLSecurityAuditEvents category of regular auditing.
    fr: |
      Azure SQL Database dispose d'une stratégie d'audit dédiée aux opérations du support Microsoft, configurée au niveau du serveur (portail, Set-AzSqlServerMSSupportAudit ou az sql server ms-support audit-policy). Dans Log Analytics, ces événements utilisent la catégorie DevOpsOperationsAudit, distincte de la catégorie SQLSecurityAuditEvents de l'audit standard.
  options:
    a: { en: "Regular database auditing records the activity of database principals, not the operations of Microsoft support engineers.", fr: "L'audit standard des bases de données enregistre l'activité des principaux de base de données, pas les opérations des ingénieurs du support Microsoft." }
    b: { en: "The activity log records control-plane operations on Azure resources, not support engineers' access to the databases.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle sur les ressources Azure, pas l'accès des ingénieurs du support aux bases de données." }
    c: { en: "Sign-in logs record authentications of your tenant's identities, not Microsoft support operations on the server.", fr: "Les journaux de connexion enregistrent les authentifications des identités de votre locataire, pas les opérations du support Microsoft sur le serveur." }
references:
  - title: Manage Azure SQL Database Auditing using APIs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-manage-using-api
  - title: SQL Database audit log format
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/audit-log-format
