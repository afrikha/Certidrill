id: dp800-2c-sdk-linux-build
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is starting a new SQL database project for an Azure SQL database named **OrdersDb**. The CI pipeline runs on Ubuntu Linux build agents that have the .NET 8 SDK installed and no Visual Studio.

    You need to create the project so that the pipeline can build it into a `.dacpac` file with `dotnet build`.

    Which project format should you use?
  fr: |
    Contoso démarre un nouveau projet de base de données SQL pour une base de données Azure SQL nommée **OrdersDb**. Le pipeline CI s'exécute sur des agents de build Ubuntu Linux sur lesquels le SDK .NET 8 est installé, sans Visual Studio.

    Vous devez créer le projet de sorte que le pipeline puisse le générer en fichier `.dacpac` avec `dotnet build`.

    Quel format de projet devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "An SDK-style project based on the Microsoft.Build.Sql project SDK", fr: "Un projet de style SDK basé sur le SDK de projet Microsoft.Build.Sql" }
    - id: b
      text: { en: "An original SQL project that imports the SQL Server Data Tools build targets", fr: "Un projet SQL d'origine qui importe les cibles de build de SQL Server Data Tools" }
    - id: c
      text: { en: "A SQL project created in Visual Studio 2026 with its default project format", fr: "Un projet SQL créé dans Visual Studio 2026 avec son format de projet par défaut" }
    - id: d
      text: { en: "A .dacpac file extracted from OrdersDb with SqlPackage and committed to the repository", fr: "Un fichier .dacpac extrait d'OrdersDb avec SqlPackage et validé dans le dépôt" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SDK-style projects use the Microsoft.Build.Sql project SDK, which runs on .NET 8 and later and builds on Windows, Linux and macOS with `dotnet build`. Microsoft recommends this format for new development; the build output is a `.dacpac` file in `bin/Debug` by default.
    fr: |
      Les projets de style SDK utilisent le SDK de projet Microsoft.Build.Sql, qui fonctionne avec .NET 8 et versions ultérieures et se génère sous Windows, Linux et macOS avec `dotnet build`. Microsoft recommande ce format pour les nouveaux développements ; la sortie de la génération est un fichier `.dacpac`, par défaut dans `bin/Debug`.
  options:
    b:
      en: |
        The original format is based on MSBuild for .NET Framework and the SSDT targets installed with Visual Studio, which the Linux agents do not have.
      fr: |
        Le format d'origine repose sur MSBuild pour .NET Framework et sur les cibles SSDT installées avec Visual Studio, dont les agents Linux ne disposent pas.
    c:
      en: |
        Visual Studio 2026 supports only the original SQL project format, so its project is not an SDK-style project.
      fr: |
        Visual Studio 2026 ne prend en charge que le format de projet SQL d'origine : son projet n'est pas un projet de style SDK.
    d:
      en: |
        A committed .dacpac is a build artifact, not a project; it gives no object files to change, review or build.
      fr: |
        Un .dacpac validé dans le dépôt est un artefact de génération, pas un projet ; il ne fournit aucun fichier d'objet à modifier, réviser ou générer.
references:
  - title: What are SQL database projects?
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/sql-database-projects
