id: dp800-2c-dep-add-column
objective: "2.3.8"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip stores an SDK-style SQL database project named **TicketsDb** in Git. After each merge into **main**, a pipeline builds the project once and publishes the resulting .dacpac file to test and then to production.

    You need to add the nullable column **LoyaltyNumber** to the dbo.Customer table in production by following the team's process.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip stocke un projet de base de données SQL de style SDK nommé **TicketsDb** dans Git. Après chaque fusion dans **main**, un pipeline génère une seule fois le projet et publie le fichier .dacpac obtenu en test, puis en production.

    Vous devez ajouter la colonne acceptant les valeurs NULL **LoyaltyNumber** à la table dbo.Customer en production en suivant le processus de l'équipe.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: branch, text: { en: "Create a feature branch from main.", fr: "Créer une branche de fonctionnalité à partir de main." } }
    - { id: edit, text: { en: "Add the LoyaltyNumber column to the CREATE TABLE statement in Tables/Customer.sql.", fr: "Ajouter la colonne LoyaltyNumber à l'instruction CREATE TABLE de Tables/Customer.sql." } }
    - { id: build, text: { en: "Run dotnet build to validate the project locally.", fr: "Exécuter dotnet build pour valider le projet localement." } }
    - { id: pr, text: { en: "Push the branch and complete a pull request into main.", fr: "Pousser la branche et terminer une pull request vers main." } }
    - { id: release, text: { en: "Let the pipeline publish the new .dacpac file to test and then to production.", fr: "Laisser le pipeline publier le nouveau fichier .dacpac en test, puis en production." } }
    - { id: alter, text: { en: "Run ALTER TABLE dbo.Customer ADD LoyaltyNumber on the production database.", fr: "Exécuter ALTER TABLE dbo.Customer ADD LoyaltyNumber sur la base de données de production." } }
    - { id: postdeploy, text: { en: "Add an ALTER TABLE statement for the column to the post-deployment script.", fr: "Ajouter une instruction ALTER TABLE pour la colonne au script de post-déploiement." } }
answer:
  sequence: [ branch, edit, build, pr, release ]
explanation:
  correct:
    en: |
      A SQL project is declarative: you change the CREATE TABLE statement in the object file, and SqlPackage generates the ALTER TABLE that each target needs at publish time. The change is built locally, reviewed and merged through a pull request, and then the pipeline publishes the same .dacpac to each environment in turn.
    fr: |
      Un projet SQL est déclaratif : vous modifiez l'instruction CREATE TABLE du fichier d'objet, et SqlPackage génère à la publication l'instruction ALTER TABLE nécessaire à chaque cible. La modification est générée localement, révisée et fusionnée par une pull request, puis le pipeline publie le même .dacpac dans chaque environnement à tour de rôle.
  options:
    alter: { en: "A manual change in production creates drift and bypasses review and testing.", fr: "Une modification manuelle en production crée une dérive et contourne la révision et les tests." }
    postdeploy: { en: "Schema changes belong in the object files; an ALTER TABLE in the post-deployment script would also fail on the next deployment, when the column exists.", fr: "Les modifications de schéma se font dans les fichiers d'objets ; un ALTER TABLE dans le script de post-déploiement échouerait aussi au déploiement suivant, une fois la colonne créée." }
references:
  - title: What are SQL database projects?
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/sql-database-projects
  - title: Implement CI/CD pipelines
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/06-implement-cicd-pipelines
