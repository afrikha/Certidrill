id: dp800-2d-health-roles
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove runs Data API builder (DAB) in production mode with the EntraId authentication provider. The runtime section contains the following setting:

    ```json
    "health": { "enabled": true }
    ```

    A monitoring service authenticates with a token that contains the app role monitoring and sends the X-MS-API-ROLE header set to monitoring. Its requests for the DAB health report return 403 Forbidden.

    You need the monitoring service, and only callers in the monitoring role, to read the health report. The API must stay in production mode.

    What should you do?
  fr: |
    Woodgrove exécute Data API builder (DAB) en mode production avec le fournisseur d'authentification EntraId. La section runtime contient le paramètre suivant :

    ```json
    "health": { "enabled": true }
    ```

    Un service de supervision s'authentifie avec un jeton qui contient le rôle d'application monitoring et envoie l'en-tête X-MS-API-ROLE défini sur monitoring. Ses requêtes vers le rapport d'intégrité DAB renvoient 403 Forbidden.

    Vous devez permettre au service de supervision, et uniquement aux appelants du rôle monitoring, de lire le rapport d'intégrité. L'API doit rester en mode production.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add \"roles\": [ \"anonymous\" ] to the health setting.", fr: "Ajouter \"roles\": [ \"anonymous\" ] au paramètre health." } }
    - { id: b, text: { en: "Add \"cache-ttl-seconds\": 0 to the health setting.", fr: "Ajouter \"cache-ttl-seconds\": 0 au paramètre health." } }
    - { id: c, text: { en: "Add \"roles\": [ \"monitoring\" ] to the health setting.", fr: "Ajouter \"roles\": [ \"monitoring\" ] au paramètre health." } }
    - { id: d, text: { en: "Set runtime.host.mode to development.", fr: "Définir runtime.host.mode sur development." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      runtime.health.roles lists the roles allowed to view the health report, and it's required in production: when it's null, production returns 403 to everyone. Listing monitoring lets the service, which selects that role with X-MS-API-ROLE, read the report while other callers still get 403.
    fr: |
      runtime.health.roles liste les rôles autorisés à consulter le rapport d'intégrité, et il est obligatoire en production : quand il vaut null, la production renvoie 403 à tout le monde. Lister monitoring permet au service, qui sélectionne ce rôle avec X-MS-API-ROLE, de lire le rapport, tandis que les autres appelants reçoivent toujours 403.
  options:
    a: { en: "anonymous would let every caller read the health report, not only the monitoring role.", fr: "anonymous permettrait à tout appelant de lire le rapport d'intégrité, pas seulement au rôle monitoring." }
    b: { en: "cache-ttl-seconds controls how long health results are cached; it doesn't grant access.", fr: "cache-ttl-seconds contrôle la durée de mise en cache des résultats d'intégrité ; il n'accorde aucun accès." }
    d: { en: "In development mode, a null roles list shows health to everyone, and the API must stay in production mode.", fr: "En mode development, une liste roles null affiche l'intégrité à tout le monde, et l'API doit rester en mode production." }
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
