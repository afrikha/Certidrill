id: dp800-2b-deadlock-order-retry
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind has two stored procedures in Azure SQL Database:

    - `dbo.CloseOrder` updates a row in `dbo.Orders` and then updates the related rows in `dbo.OrderLines`.
    - `dbo.RepriceLines` updates rows in `dbo.OrderLines` and then updates the related row in `dbo.Orders`.

    Deadlock graphs show these two procedures deadlocking on the same order. You need to prevent this deadlock from recurring and make sure the work completes when a deadlock occurs anyway.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose de deux procédures stockées dans Azure SQL Database :

    - `dbo.CloseOrder` met à jour une ligne de `dbo.Orders`, puis les lignes associées de `dbo.OrderLines`.
    - `dbo.RepriceLines` met à jour des lignes de `dbo.OrderLines`, puis la ligne associée de `dbo.Orders`.

    Les graphes d'interblocage montrent ces deux procédures en interblocage sur la même commande. Vous devez empêcher cet interblocage de se reproduire et vous assurer que le travail aboutit si un interblocage se produit malgré tout.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |
          Set LOCK_TIMEOUT to 5000 in both procedures.
        fr: |
          Définir LOCK_TIMEOUT sur 5000 dans les deux procédures.
    - id: b
      text:
        en: |
          Modify dbo.RepriceLines to update dbo.Orders before dbo.OrderLines.
        fr: |
          Modifier dbo.RepriceLines pour qu'elle mette à jour dbo.Orders avant dbo.OrderLines.
    - id: c
      text:
        en: |
          Set DEADLOCK_PRIORITY HIGH in both procedures.
        fr: |
          Définir DEADLOCK_PRIORITY HIGH dans les deux procédures.
    - id: d
      text:
        en: |
          Retry the transaction in the application when it receives error 1205.
        fr: |
          Relancer la transaction dans l'application lorsqu'elle reçoit l'erreur 1205.
    - id: e
      text:
        en: |
          Run both procedures under the SERIALIZABLE isolation level.
        fr: |
          Exécuter les deux procédures avec le niveau d'isolation SERIALIZABLE.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The deadlock comes from the two procedures locking the same tables in opposite orders; accessing Orders then OrderLines in both removes the cycle. Deadlocks can still happen for other reasons, and the victim's transaction is rolled back with error 1205, so the application must retry it, ideally after a short random pause.
    fr: |
      L'interblocage vient du verrouillage des mêmes tables dans des ordres opposés par les deux procédures ; accéder à Orders puis à OrderLines dans les deux supprime le cycle. Des interblocages peuvent encore survenir pour d'autres raisons, et la transaction de la victime est annulée avec l'erreur 1205 : l'application doit donc la relancer, idéalement après une courte pause aléatoire.
  options:
    a: { en: "A lock timeout turns waits into error 1222 and doesn't remove the cycle.", fr: "Un délai de verrou transforme les attentes en erreur 1222 et ne supprime pas le cycle." }
    c: { en: "With equal priorities, the engine picks the cheaper transaction as before; priority never prevents a deadlock.", fr: "Avec des priorités égales, le moteur choisit comme avant la transaction la moins coûteuse ; la priorité n'empêche jamais un interblocage." }
    e: { en: "SERIALIZABLE holds more locks for longer and makes deadlocks more likely.", fr: "SERIALIZABLE conserve plus de verrous plus longtemps et rend les interblocages plus probables." }
references:
  - title: Analyze and prevent deadlocks in Azure SQL Database and SQL database in Fabric
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/analyze-prevent-deadlocks
  - title: Deadlocks guide
    url: https://learn.microsoft.com/en-us/sql/relational-databases/sql-server-deadlocks-guide
