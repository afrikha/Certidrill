id: dp800-2a-ddm-select-into
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL Database. The **Email** column of **Sales.Customer** is masked with the `email()` function.

    An analyst named **Rafael** has `SELECT` on Sales.Customer and `CREATE TABLE` permission, but no `UNMASK` permission. Rafael runs the following statement:

    ```text
    SELECT CustomerID, Email INTO dbo.EmailExport FROM Sales.Customer;
    ```

    Later, a compliance officer who has `UNMASK` at the database level runs `SELECT * FROM dbo.EmailExport;`.

    What does the compliance officer see in the Email column?
  fr: |
    Vous disposez d'une base de données Azure SQL Database. La colonne **Email** de **Sales.Customer** est masquée avec la fonction `email()`.

    Un analyste nommé **Rafael** dispose de `SELECT` sur Sales.Customer et de l'autorisation `CREATE TABLE`, mais pas de l'autorisation `UNMASK`. Rafael exécute l'instruction suivante :

    ```text
    SELECT CustomerID, Email INTO dbo.EmailExport FROM Sales.Customer;
    ```

    Plus tard, un responsable de la conformité qui dispose de `UNMASK` au niveau de la base de données exécute `SELECT * FROM dbo.EmailExport;`.

    Que voit le responsable de la conformité dans la colonne Email ?
body:
  options:
    - id: a
      text: { en: "The real email addresses, because UNMASK applies to every column of the database", fr: "Les vraies adresses e-mail, car UNMASK s'applique à toutes les colonnes de la base de données" }
    - id: b
      text: { en: "Values such as aXXX@XXXX.com, because the masked values were copied into the new table", fr: "Des valeurs comme aXXX@XXXX.com, car les valeurs masquées ont été copiées dans la nouvelle table" }
    - id: c
      text: { en: "NULL values, because masked values are not copied by SELECT INTO", fr: "Des valeurs NULL, car SELECT INTO ne copie pas les valeurs masquées" }
    - id: d
      text: { en: "No rows, because SELECT INTO from a masked column fails for users without UNMASK", fr: "Aucune ligne, car SELECT INTO depuis une colonne masquée échoue pour les utilisateurs sans UNMASK" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a user without UNMASK copies a masked column with SELECT INTO or INSERT INTO, the target table receives the masked values, not the original data. dbo.EmailExport therefore stores the masked strings themselves, and no permission can restore the real addresses from it. This is why masking must be combined with least privilege on ad hoc queries.
    fr: |
      Lorsqu'un utilisateur sans UNMASK copie une colonne masquée avec SELECT INTO ou INSERT INTO, la table cible reçoit les valeurs masquées, pas les données d'origine. dbo.EmailExport stocke donc les chaînes masquées elles-mêmes, et aucune autorisation ne permet d'en retrouver les vraies adresses. C'est pourquoi le masquage doit être combiné au moindre privilège sur les requêtes ad hoc.
  options:
    a: { en: "UNMASK only removes masks defined on columns; dbo.EmailExport has no mask and already contains masked strings.", fr: "UNMASK ne retire que les masques définis sur des colonnes ; dbo.EmailExport n'a pas de masque et contient déjà des chaînes masquées." }
    c: { en: "SELECT INTO copies the values the user sees, which are the masked values, not NULL.", fr: "SELECT INTO copie les valeurs que voit l'utilisateur, c'est-à-dire les valeurs masquées, pas NULL." }
    d: { en: "The statement succeeds; masking never blocks a query, it only changes the values returned.", fr: "L'instruction réussit ; le masquage ne bloque jamais une requête, il modifie seulement les valeurs renvoyées." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking
