id: dp800-2d-proc-query-call
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware exposes a stored procedure through Data API builder (DAB) with the following entity definition:

    ```json
    "GetTopCustomers": {
      "source": {
        "object": "dbo.usp_GetTopCustomers",
        "type": "stored-procedure",
        "parameters": [ { "name": "Top", "required": true } ]
      },
      "graphql": { "enabled": true, "operation": "query" },
      "permissions": [ { "role": "authenticated", "actions": [ "execute" ] } ]
    }
    ```

    A dashboard must call the procedure through GraphQL to get the 10 best customers.

    Which request should the dashboard send?
  fr: |
    Litware expose une procédure stockée avec Data API builder (DAB) avec la définition d'entité suivante :

    ```json
    "GetTopCustomers": {
      "source": {
        "object": "dbo.usp_GetTopCustomers",
        "type": "stored-procedure",
        "parameters": [ { "name": "Top", "required": true } ]
      },
      "graphql": { "enabled": true, "operation": "query" },
      "permissions": [ { "role": "authenticated", "actions": [ "execute" ] } ]
    }
    ```

    Un tableau de bord doit appeler la procédure par GraphQL pour obtenir les 10 meilleurs clients.

    Quelle requête le tableau de bord doit-il envoyer ?
body:
  options:
    - { id: a, text: "mutation { executeGetTopCustomers(Top: 10) { CustomerID Name } }" }
    - { id: b, text: "query { executeGetTopCustomers(Top: 10) { CustomerID Name } }" }
    - { id: c, text: "query { getTopCustomers(Top: 10) { CustomerID Name } }" }
    - { id: d, text: "query { GetTopCustomers_by_pk(Top: 10) { CustomerID Name } }" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      DAB prefixes the GraphQL field of a stored procedure entity with execute, so the entity GetTopCustomers becomes executeGetTopCustomers, and the procedure parameters become its arguments. graphql.operation decides where the field appears in the schema; with "query", the dashboard calls it in a query, not a mutation.
    fr: |
      DAB préfixe le champ GraphQL d'une entité de procédure stockée par execute : l'entité GetTopCustomers devient executeGetTopCustomers, et les paramètres de la procédure deviennent ses arguments. graphql.operation détermine où le champ apparaît dans le schéma ; avec "query", le tableau de bord l'appelle dans une requête (query), pas dans une mutation.
  options:
    a: { en: "With graphql.operation set to query, the field is in the query type, not in the mutation type.", fr: "Avec graphql.operation défini sur query, le champ se trouve dans le type query, pas dans le type mutation." }
    c: { en: "Stored procedure fields keep the execute prefix; no getTopCustomers field is generated.", fr: "Les champs des procédures stockées gardent le préfixe execute ; aucun champ getTopCustomers n'est généré." }
    d: { en: "_by_pk queries exist for tables and views, which have a primary key, not for stored procedures.", fr: "Les requêtes _by_pk existent pour les tables et les vues, qui ont une clé primaire, pas pour les procédures stockées." }
references:
  - title: How to call GraphQL endpoints - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/api/graphql
  - title: Configuration schema - Entities section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities
