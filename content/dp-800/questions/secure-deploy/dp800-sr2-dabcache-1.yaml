id: dp800-sr2-dabcache-1
objective: "2.4.2"
type: series_yesno
series: dp800-sr2-dab-product-cache
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You add a cache section to the Product entity only.
  fr: Vous ajoutez une section cache à l'entité Product uniquement.
body:
  solution:
    en: |
      You add the following property to the **Product** entity and leave the `runtime` section and the **Order** entity unchanged.

      ```json
      "cache": { "enabled": true, "ttl-seconds": 30, "level": "L1" }
      ```
    fr: |
      Vous ajoutez la propriété suivante à l'entité **Product** et laissez inchangées la section `runtime` et l'entité **Order**.

      ```json
      "cache": { "enabled": true, "ttl-seconds": 30, "level": "L1" }
      ```
answer: { value: false }
explanation:
  correct:
    en: DAB caching needs two opt-ins, one global and one per entity. runtime.cache.enabled defaults to false, and while it is false the entity-level cache settings have no effect. Product requests would still be sent to the database every time.
    fr: "La mise en cache DAB exige deux activations, une globale et une par entité. runtime.cache.enabled vaut false par défaut, et tant qu'il vaut false, les paramètres de cache au niveau de l'entité n'ont aucun effet. Les requêtes sur Product seraient toujours envoyées à la base de données."
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
