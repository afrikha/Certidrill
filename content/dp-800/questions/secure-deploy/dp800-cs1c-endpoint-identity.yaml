id: dp800-cs1c-endpoint-identity
objective: "2.1.7"
type: multi
caseStudy: dp800-cs1c-woodgrove-bank
difficulty: 3
status: draft
stem:
  en: |
    You need to prepare SQL-CORE1 and WoodgroveCore so that dbo.usp_AskTerms can call fdy-woodgrove by using sp_invoke_external_rest_endpoint. The solution must meet the advisor assistant requirements.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez préparer SQL-CORE1 et WoodgroveCore pour que dbo.usp_AskTerms puisse appeler fdy-woodgrove à l'aide de sp_invoke_external_rest_endpoint. La solution doit respecter les exigences relatives à l'assistant des conseillers.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Run sp_configure 'external rest endpoint enabled', 1, followed by RECONFIGURE WITH OVERRIDE.", fr: "Exécuter sp_configure 'external rest endpoint enabled', 1, puis RECONFIGURE WITH OVERRIDE." } }
    - { id: b, text: { en: "Run sp_configure 'clr enabled', 1, followed by RECONFIGURE WITH OVERRIDE.", fr: "Exécuter sp_configure 'clr enabled', 1, puis RECONFIGURE WITH OVERRIDE." } }
    - { id: c, text: { en: "Run sp_configure 'allow server scoped db credentials', 1, followed by RECONFIGURE WITH OVERRIDE.", fr: "Exécuter sp_configure 'allow server scoped db credentials', 1, puis RECONFIGURE WITH OVERRIDE." } }
    - { id: d, text: { en: "In the master database, create a server credential by using CREATE CREDENTIAL [https://fdy-woodgrove.openai.azure.com] WITH IDENTITY = 'Managed Identity'.", fr: "Dans la base de données master, créer des informations d'identification de serveur à l'aide de CREATE CREDENTIAL [https://fdy-woodgrove.openai.azure.com] WITH IDENTITY = 'Managed Identity'." } }
    - { id: e, text: { en: "In WoodgroveCore, create a database scoped credential named [https://fdy-woodgrove.openai.azure.com] with IDENTITY = 'Managed Identity' and a resourceid of https://cognitiveservices.azure.com in SECRET.", fr: "Dans WoodgroveCore, créer des informations d'identification délimitées à la base de données nommées [https://fdy-woodgrove.openai.azure.com] avec IDENTITY = 'Managed Identity' et un resourceid https://cognitiveservices.azure.com dans SECRET." } }
answer: { optionIds: [a, c, e] }
explanation:
  correct:
    en: |
      On SQL Server 2025, sp_invoke_external_rest_endpoint is disabled by default and is enabled with the 'external rest endpoint enabled' option. To authenticate with the managed identity of an Azure Arc-enabled instance, you also enable 'allow server scoped db credentials' and create a database scoped credential with IDENTITY = 'Managed Identity' and the Cognitive Services resource ID, named after the endpoint URL. The procedure then passes this credential in its @credential parameter.
    fr: |
      Sur SQL Server 2025, sp_invoke_external_rest_endpoint est désactivée par défaut et s'active avec l'option 'external rest endpoint enabled'. Pour s'authentifier avec l'identité managée d'une instance activée par Azure Arc, vous activez aussi 'allow server scoped db credentials' et vous créez des informations d'identification délimitées à la base de données avec IDENTITY = 'Managed Identity' et l'ID de ressource Cognitive Services, nommées d'après l'URL du point de terminaison. La procédure passe ensuite ces informations d'identification dans son paramètre @credential.
  options:
    b: { en: "CLR integration runs .NET assemblies inside SQL Server; sp_invoke_external_rest_endpoint does not need it.", fr: "L'intégration du CLR exécute des assemblys .NET dans SQL Server ; sp_invoke_external_rest_endpoint n'en a pas besoin." }
    d: { en: "The @credential parameter of sp_invoke_external_rest_endpoint references a database scoped credential of the current database, not a server credential.", fr: "Le paramètre @credential de sp_invoke_external_rest_endpoint référence des informations d'identification délimitées à la base de données actuelle, pas des informations d'identification de serveur." }
references:
  - title: sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
