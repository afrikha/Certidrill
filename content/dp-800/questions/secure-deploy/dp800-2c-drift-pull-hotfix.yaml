id: dp800-2c-drift-pull-hotfix
objective: "2.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso deploys an SDK-style SQL database project named **OrdersDb** to production. During an incident, a DBA created the index **IX_Order_ShipDate** directly in the production database. The index must be kept.

    You need to find the differences between the production database and the project in Visual Studio Code, and add the index to the project files.

    What should you do?
  fr: |
    Contoso déploie un projet de base de données SQL de style SDK nommé **OrdersDb** en production. Lors d'un incident, un DBA a créé l'index **IX_Order_ShipDate** directement dans la base de données de production. L'index doit être conservé.

    Vous devez identifier dans Visual Studio Code les différences entre la base de données de production et le projet, et ajouter l'index aux fichiers du projet.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run a schema comparison with the project as the source and the database as the target, and then apply the changes.", fr: "Exécuter une comparaison de schémas avec le projet comme source et la base de données comme cible, puis appliquer les modifications." } }
    - { id: b, text: { en: "Run a schema comparison with the database as the source and the project as the target, and then apply the index.", fr: "Exécuter une comparaison de schémas avec la base de données comme source et le projet comme cible, puis appliquer l'index." } }
    - { id: c, text: { en: "Run SqlPackage /Action:DriftReport against the production database, and then build the project.", fr: "Exécuter SqlPackage /Action:DriftReport sur la base de données de production, puis générer le projet." } }
    - { id: d, text: { en: "Publish the project to production with /p:DropObjectsNotInSource=true, and then build the project.", fr: "Publier le projet en production avec /p:DropObjectsNotInSource=true, puis générer le projet." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Schema comparison shows the actions that make the target match the source. With the production database as the source and the project as the target, the index appears as an object to add, and applying it writes its definition into the project files, which you then commit through a pull request.
    fr: |
      La comparaison de schémas montre les actions qui alignent la cible sur la source. Avec la base de données de production comme source et le projet comme cible, l'index apparaît comme un objet à ajouter, et l'appliquer écrit sa définition dans les fichiers du projet, que vous validez ensuite par une pull request.
  options:
    a:
      en: |
        With the project as the source, applying the changes updates the database to match the project, which would drop the index.
      fr: |
        Avec le projet comme source, appliquer les modifications aligne la base de données sur le projet, ce qui supprimerait l'index.
    c:
      en: |
        DriftReport reports changes to a database registered as a data-tier application; it does not change the project files.
      fr: |
        DriftReport signale les modifications d'une base de données inscrite comme application de la couche Données ; il ne modifie pas les fichiers du projet.
    d:
      en: |
        DropObjectsNotInSource drops the objects of the target that are not in the project, so the index would be deleted.
      fr: |
        DropObjectsNotInSource supprime les objets de la cible absents du projet : l'index serait supprimé.
references:
  - title: Schema comparison overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/schema-comparison
  - title: Compare a database and a project
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/howto/compare-database-project
