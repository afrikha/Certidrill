id: dp800-cs1b-partner-events
objective: "2.4.7"
type: single
caseStudy: dp800-cs1b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You need to publish the changes of dbo.Shipments to the partners. The solution must meet the partner events requirements.

    What should you implement?
  fr: |
    Vous devez publier les modifications de dbo.Shipments à destination des partenaires. La solution doit respecter les exigences relatives aux événements partenaires.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Change data capture on dbo.Shipments, and an Azure Functions app with a timer trigger that reads the change tables every 10 seconds and sends the changes to evh-shipment-events", fr: "La capture des données modifiées sur dbo.Shipments, et une application Azure Functions avec un déclencheur de minuteur qui lit les tables de modifications toutes les 10 secondes et envoie les modifications à evh-shipment-events" } }
    - { id: b, text: { en: "Change tracking on dbo.Shipments, and an Azure Functions app with an Azure SQL trigger binding that sends the changed rows to evh-shipment-events", fr: "Le suivi des modifications sur dbo.Shipments, et une application Azure Functions avec une liaison de déclencheur Azure SQL qui envoie les lignes modifiées à evh-shipment-events" } }
    - { id: c, text: { en: "An AFTER INSERT, UPDATE, DELETE trigger on dbo.Shipments that calls sp_invoke_external_rest_endpoint to send the inserted and deleted rows to evh-shipment-events", fr: "Un déclencheur AFTER INSERT, UPDATE, DELETE sur dbo.Shipments qui appelle sp_invoke_external_rest_endpoint pour envoyer les lignes inserted et deleted à evh-shipment-events" } }
    - { id: d, text: { en: "Change event streaming on sqldb-shipping, with a stream group that targets evh-shipment-events and contains dbo.Shipments", fr: "Le streaming d'événements de modification sur sqldb-shipping, avec un groupe de flux qui cible evh-shipment-events et contient dbo.Shipments" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Change event streaming (CES), currently in preview, publishes inserts, updates and deletes from the transaction log directly to Azure Event Hubs in near real time, as CloudEvents that contain the previous and the new values. A stream group defines the destination, its credential and the tracked tables; no process polls the database and the application's transactions do no extra work.
    fr: |
      Le streaming d'événements de modification (CES), actuellement en préversion, publie les insertions, mises à jour et suppressions du journal des transactions directement dans Azure Event Hubs en quasi-temps réel, sous forme de CloudEvents qui contiennent les valeurs précédentes et les nouvelles valeurs. Un groupe de flux définit la destination, ses informations d'identification et les tables suivies ; aucun processus n'interroge la base de données et les transactions de l'application ne font aucun travail supplémentaire.
  options:
    a: { en: "A timer that reads the CDC change tables every 10 seconds is a polling solution, which the requirements forbid.", fr: "Un minuteur qui lit les tables de modifications CDC toutes les 10 secondes est une solution d'interrogation, ce que les exigences interdisent." }
    b: { en: "The SQL trigger binding polls change tracking, and change tracking records which rows changed, not their previous values.", fr: "La liaison de déclencheur SQL interroge le suivi des modifications, et le suivi des modifications enregistre les lignes modifiées, pas leurs valeurs précédentes." }
    c: { en: "A table trigger runs inside the transaction of each statement of the shipping application, so every change would wait for an HTTPS call.", fr: "Un déclencheur de table s'exécute dans la transaction de chaque instruction de l'application d'expédition : chaque modification attendrait un appel HTTPS." }
references:
  - title: Change event streaming overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/change-event-streaming/overview
  - title: Azure SQL trigger for Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-azure-sql-trigger
