id: dp800-cs2b-report-blocking
objective: "2.2.2"
type: single
caseStudy: dp800-cs2b-munsons-pickles
difficulty: 1
status: draft
stem:
  en: |
    You need to resolve the blocking of the inventory reports. The solution must meet the performance requirements.

    Which statement should you run?
  fr: |
    Vous devez résoudre le blocage des rapports de stock. La solution doit satisfaire les exigences de performances.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "`ALTER DATABASE SupplyDb SET ALLOW_SNAPSHOT_ISOLATION ON;`" }
    - { id: b, text: "`ALTER DATABASE SupplyDb SET READ_COMMITTED_SNAPSHOT ON;`" }
    - { id: c, text: "`ALTER INDEX ALL ON dbo.Inventory REBUILD WITH (ALLOW_ROW_LOCKS = OFF);`" }
    - { id: d, text: "`ALTER DATABASE SupplyDb SET COMPATIBILITY_LEVEL = 170;`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With READ_COMMITTED_SNAPSHOT ON, the default READ COMMITTED isolation level uses row versioning instead of shared locks: each statement reads a transactionally consistent snapshot of committed data as of its start, so the reports are no longer blocked by the scanner updates. The reports keep using READ COMMITTED, so no code or connection string changes. The ALTER DATABASE statement requires that no other connection is open in SupplyDb while it runs.
    fr: |
      Avec READ_COMMITTED_SNAPSHOT à ON, le niveau d'isolation par défaut READ COMMITTED utilise le contrôle de version de ligne au lieu des verrous partagés : chaque instruction lit un instantané cohérent des données validées au moment de son démarrage, et les rapports ne sont plus bloqués par les mises à jour des scanners. Les rapports continuent d'utiliser READ COMMITTED : aucun code ni aucune chaîne de connexion ne change. L'instruction ALTER DATABASE exige qu'aucune autre connexion ne soit ouverte dans SupplyDb pendant son exécution.
  options:
    a: { en: "ALLOW_SNAPSHOT_ISOLATION only allows sessions to request SNAPSHOT isolation; the reports would have to run SET TRANSACTION ISOLATION LEVEL SNAPSHOT, which is a code change.", fr: "ALLOW_SNAPSHOT_ISOLATION permet seulement aux sessions de demander l'isolation SNAPSHOT ; les rapports devraient exécuter SET TRANSACTION ISOLATION LEVEL SNAPSHOT, ce qui est une modification du code." }
    c: { en: "Disabling row locks forces coarser page or table locks, which increases blocking between readers and writers.", fr: "La désactivation des verrous de ligne impose des verrous de page ou de table plus larges, ce qui augmente le blocage entre lecteurs et rédacteurs." }
    d: { en: "SupplyDb is already at compatibility level 170, and the compatibility level does not change how READ COMMITTED takes locks.", fr: "SupplyDb est déjà au niveau de compatibilité 170, et le niveau de compatibilité ne change pas la façon dont READ COMMITTED prend des verrous." }
references:
  - title: SET TRANSACTION ISOLATION LEVEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-transaction-isolation-level-transact-sql
