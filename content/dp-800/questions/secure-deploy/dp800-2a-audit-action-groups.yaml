id: dp800-2a-audit-action-groups
objective: "2.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are defining the audit action groups of a database audit specification for a contained database named **HR**. Each requirement must be audited with the action group that records exactly that type of event.

    Which action group should you use for each requirement? To answer, drag the appropriate action groups to the correct requirements. Each action group may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez les groupes d'actions d'audit d'une spécification d'audit de base de données pour une base de données contenue nommée **HR**. Chaque exigence doit être auditée avec le groupe d'actions qui enregistre précisément ce type d'événement.

    Quel groupe d'actions devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les groupes d'actions appropriés vers les exigences correspondantes. Chaque groupe d'actions peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rolemember, text: DATABASE_ROLE_MEMBER_CHANGE_GROUP }
    - { id: objperm, text: SCHEMA_OBJECT_PERMISSION_CHANGE_GROUP }
    - { id: principal, text: DATABASE_PRINCIPAL_CHANGE_GROUP }
    - { id: failedauth, text: FAILED_DATABASE_AUTHENTICATION_GROUP }
    - { id: objaccess, text: SCHEMA_OBJECT_ACCESS_GROUP }
    - { id: batch, text: BATCH_COMPLETED_GROUP }
  targets:
    - id: t1
      text: { en: "A user is added to or removed from the db_datareader role", fr: "Un utilisateur est ajouté au rôle db_datareader ou en est retiré" }
    - id: t2
      text: { en: "A GRANT, DENY or REVOKE is issued on a table", fr: "Un GRANT, un DENY ou un REVOKE est émis sur une table" }
    - id: t3
      text: { en: "A database user is created, altered or dropped", fr: "Un utilisateur de base de données est créé, modifié ou supprimé" }
    - id: t4
      text: { en: "A contained database user fails to sign in", fr: "Un utilisateur de base de données contenue échoue à se connecter" }
answer:
  mapping: { t1: rolemember, t2: objperm, t3: principal, t4: failedauth }
explanation:
  correct:
    en: |
      DATABASE_ROLE_MEMBER_CHANGE_GROUP records members added to or removed from database roles. SCHEMA_OBJECT_PERMISSION_CHANGE_GROUP records GRANT, DENY and REVOKE on schema objects such as tables. DATABASE_PRINCIPAL_CHANGE_GROUP records the creation, change and deletion of database principals. FAILED_DATABASE_AUTHENTICATION_GROUP records failed sign-ins to a contained database.
    fr: |
      DATABASE_ROLE_MEMBER_CHANGE_GROUP enregistre les membres ajoutés aux rôles de base de données ou retirés de ceux-ci. SCHEMA_OBJECT_PERMISSION_CHANGE_GROUP enregistre les GRANT, DENY et REVOKE sur des objets de schéma comme les tables. DATABASE_PRINCIPAL_CHANGE_GROUP enregistre la création, la modification et la suppression des principaux de base de données. FAILED_DATABASE_AUTHENTICATION_GROUP enregistre les échecs de connexion à une base de données contenue.
  options:
    objaccess: { en: "SCHEMA_OBJECT_ACCESS_GROUP records every use of an object permission, such as SELECT on a table, not permission changes.", fr: "SCHEMA_OBJECT_ACCESS_GROUP enregistre chaque utilisation d'une autorisation d'objet, comme SELECT sur une table, pas les modifications d'autorisations." }
    batch: { en: "BATCH_COMPLETED_GROUP records the full text of every completed batch, which is far broader than any single requirement.", fr: "BATCH_COMPLETED_GROUP enregistre le texte complet de chaque lot terminé, bien au-delà de chaque exigence." }
references:
  - title: SQL Server Audit action groups and actions
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/auditing/sql-server-audit-action-groups-and-actions
