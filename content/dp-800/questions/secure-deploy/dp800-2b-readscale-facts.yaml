id: dp800-2b-readscale-facts
objective: "2.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin recommends the Business Critical service tier for a new database in Azure SQL Database, partly so that a reporting application can use the read-only replica.

    Which two statements about the read-only replica are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin recommande le niveau de service Business Critical pour une nouvelle base de données dans Azure SQL Database, notamment pour qu'une application de reporting puisse utiliser le réplica en lecture seule.

    Quelles sont les deux affirmations vraies concernant le réplica en lecture seule ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |
          A row committed on the primary replica is always visible on the read-only replica as soon as the commit completes.
        fr: |
          Une ligne validée sur le réplica principal est toujours visible sur le réplica en lecture seule dès la fin de la validation.
    - id: b
      text:
        en: |
          The reporting application reaches the replica by adding ApplicationIntent=ReadOnly to its connection string.
        fr: |
          L'application de reporting atteint le réplica en ajoutant ApplicationIntent=ReadOnly à sa chaîne de connexion.
    - id: c
      text:
        en: |
          Queries on the replica use the isolation level requested by the session, including locking READ COMMITTED.
        fr: |
          Les requêtes sur le réplica utilisent le niveau d'isolation demandé par la session, y compris READ COMMITTED avec verrous.
    - id: d
      text:
        en: |
          The replica is included in the price of the Business Critical database.
        fr: |
          Le réplica est inclus dans le prix de la base de données Business Critical.
    - id: e
      text:
        en: |
          The same replica would be available in General Purpose once zone redundancy is enabled.
        fr: |
          Le même réplica serait disponible en General Purpose une fois la redondance de zone activée.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Read scale-out is enabled by default on Business Critical, and connections with ApplicationIntent=ReadOnly are routed to the read-only replica. Microsoft states that this extra capacity comes at no extra cost in the Premium and Business Critical tiers.
    fr: |
      La montée en charge en lecture est activée par défaut en Business Critical, et les connexions avec ApplicationIntent=ReadOnly sont routées vers le réplica en lecture seule. Microsoft indique que cette capacité supplémentaire n'entraîne aucun coût supplémentaire dans les niveaux Premium et Business Critical.
  options:
    a: { en: "Replication to the read-only replica is asynchronous; latency is usually small but has no fixed upper bound.", fr: "La réplication vers le réplica en lecture seule est asynchrone ; la latence est généralement faible, mais sans limite supérieure fixe." }
    c: { en: "Transactions on read-only replicas always use snapshot isolation, whatever the session level or hints.", fr: "Les transactions sur les réplicas en lecture seule utilisent toujours l'isolation d'instantané, quels que soient le niveau de la session ou les indicateurs." }
    e: { en: "General Purpose has no read scale-out replica, even with zone redundancy.", fr: "General Purpose n'a pas de réplica de montée en charge en lecture, même avec la redondance de zone." }
references:
  - title: Use read-only replicas to offload read-only query workloads
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
