id: dp800-2a-auth-uami-connstring
objective: "2.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A function app named **func-orders** connects to an Azure SQL Database named **Orders** by using Microsoft.Data.SqlClient. Two user-assigned managed identities are assigned to func-orders: **id-orders**, which has a database user in Orders, and **id-monitor**, which is used for another service.

    The connection must authenticate as id-orders, and no secret must be stored.

    How should you complete the connection string? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application de fonction nommée **func-orders** se connecte à une base de données Azure SQL Database nommée **Orders** à l'aide de Microsoft.Data.SqlClient. Deux identités managées affectées par l'utilisateur sont attribuées à func-orders : **id-orders**, qui dispose d'un utilisateur de base de données dans Orders, et **id-monitor**, utilisée pour un autre service.

    La connexion doit s'authentifier en tant qu'id-orders, et aucun secret ne doit être stocké.

    Comment devez-vous compléter la chaîne de connexion ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Server=tcp:sql-fabrikam.database.windows.net,1433;Database=Orders;Authentication=[[auth]];User Id=[[uid]];Encrypt=True;
  slots:
    - id: auth
      options:
        - { id: mi, text: Active Directory Managed Identity }
        - { id: sp, text: Active Directory Service Principal }
        - { id: pwd, text: Active Directory Password }
        - { id: integrated, text: Active Directory Integrated }
    - id: uid
      options:
        - { id: clientid, text: { en: "<client ID of id-orders>", fr: "<ID client d'id-orders>" } }
        - { id: objectid, text: { en: "<object (principal) ID of id-orders>", fr: "<ID d'objet (principal) d'id-orders>" } }
        - { id: resourceid, text: { en: "<Azure resource ID of id-orders>", fr: "<ID de ressource Azure d'id-orders>" } }
        - { id: name, text: "id-orders" }
answer:
  values: { auth: mi, uid: clientid }
explanation:
  correct:
    en: |
      Active Directory Managed Identity gets a token for a managed identity of the host, with no secret. When several user-assigned identities are available, User Id selects one of them and must contain the client ID of that identity; current SqlClient versions use the client ID, not the object ID.
    fr: |
      Active Directory Managed Identity obtient un jeton pour une identité managée de l'hôte, sans secret. Lorsque plusieurs identités affectées par l'utilisateur sont disponibles, User Id en sélectionne une et doit contenir l'ID client de cette identité ; les versions actuelles de SqlClient utilisent l'ID client, pas l'ID d'objet.
  options:
    sp: { en: "Service principal authentication needs a client secret in the Password keyword.", fr: "L'authentification par principal de service exige un secret client dans le mot clé Password." }
    pwd: { en: "Active Directory Password requires a stored password and is deprecated.", fr: "Active Directory Password exige un mot de passe stocké et est déprécié." }
    objectid: { en: "SqlClient expects the client ID of the user-assigned identity; the object ID was used only by old versions.", fr: "SqlClient attend l'ID client de l'identité affectée par l'utilisateur ; l'ID d'objet n'était utilisé que par d'anciennes versions." }
references:
  - title: Microsoft Entra authentication with Microsoft.Data.SqlClient
    url: https://learn.microsoft.com/en-us/sql/connect/ado-net/sql/azure-active-directory-authentication
