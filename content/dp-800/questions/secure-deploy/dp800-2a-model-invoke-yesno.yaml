id: dp800-2a-model-invoke-yesno
objective: "2.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database. A stored procedure named **dbo.usp_Summarize** calls a chat completions deployment of Azure OpenAI by using `sp_invoke_external_rest_endpoint`. The procedure passes a database scoped credential created with `IDENTITY = 'Managed Identity'`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database. Une procédure stockée nommée **dbo.usp_Summarize** appelle un déploiement de complétions de conversation d'Azure OpenAI à l'aide de `sp_invoke_external_rest_endpoint`. La procédure passe des informations d'identification délimitées à la base de données créées avec `IDENTITY = 'Managed Identity'`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can set @timeout to 300 seconds so that long completions don't time out.
        fr: |
          Vous pouvez définir @timeout sur 300 secondes pour que les complétions longues n'expirent pas.
    - id: s2
      text:
        en: |
          If you set @retry_count, the call is retried when Azure OpenAI returns HTTP status 429.
        fr: |
          Si vous définissez @retry_count, l'appel est réessayé lorsqu'Azure OpenAI renvoie le code d'état HTTP 429.
    - id: s3
      text:
        en: |
          If Azure OpenAI rejects the call with HTTP status 401, sp_invoke_external_rest_endpoint raises an error and @response stays NULL.
        fr: |
          Si Azure OpenAI rejette l'appel avec le code d'état HTTP 401, sp_invoke_external_rest_endpoint lève une erreur et @response reste NULL.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The @timeout parameter ranges from 1 to 230 seconds, with a default of 30. With @retry_count (0 to 10), the call is retried on HTTP 408, 429, 500, 502, 503 and 504, and the Retry-After header of a 429 response is respected. When the endpoint answers with a non-2xx status, the procedure returns that HTTP status code and the @response JSON contains it in response.status.http.code; an exception is raised only when the call cannot be made at all.
    fr: |
      Le paramètre @timeout va de 1 à 230 secondes, avec une valeur par défaut de 30. Avec @retry_count (de 0 à 10), l'appel est réessayé sur les codes HTTP 408, 429, 500, 502, 503 et 504, et l'en-tête Retry-After d'une réponse 429 est respecté. Lorsque le point de terminaison répond avec un code autre que 2xx, la procédure renvoie ce code d'état HTTP et le JSON de @response le contient dans response.status.http.code ; une exception n'est levée que lorsque l'appel ne peut pas être effectué du tout.
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
