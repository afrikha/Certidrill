id: dp800-2a-ae-provision-order
objective: "2.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database named **ClinicDb**. The **NationalID** column of the existing **dbo.Patient** table contains data in plaintext.

    You need to encrypt NationalID by using Always Encrypted without secure enclaves. The column master key must be stored in an Azure key vault named **kv-clinic**.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **ClinicDb**. La colonne **NationalID** de la table existante **dbo.Patient** contient des données en clair.

    Vous devez chiffrer NationalID à l'aide d'Always Encrypted sans enclave sécurisée. La clé principale de colonne doit être stockée dans un coffre de clés Azure nommé **kv-clinic**.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: kv, text: { en: "Create an RSA key in kv-clinic.", fr: "Créer une clé RSA dans kv-clinic." } }
    - { id: cmk, text: { en: "Create the column master key metadata in ClinicDb with the path of the key in kv-clinic.", fr: "Créer les métadonnées de la clé principale de colonne dans ClinicDb avec le chemin de la clé dans kv-clinic." } }
    - { id: cek, text: { en: "Create a column encryption key in ClinicDb that is encrypted by the column master key.", fr: "Créer dans ClinicDb une clé de chiffrement de colonne chiffrée par la clé principale de colonne." } }
    - { id: enc, text: { en: "Encrypt NationalID by using the Always Encrypted wizard in SQL Server Management Studio.", fr: "Chiffrer NationalID à l'aide de l'Assistant Always Encrypted de SQL Server Management Studio." } }
    - { id: dmk, text: { en: "Create a database master key protected by a password in ClinicDb.", fr: "Créer dans ClinicDb une clé principale de base de données protégée par un mot de passe." } }
    - { id: cert, text: { en: "Create a certificate in ClinicDb and a symmetric key protected by the certificate.", fr: "Créer un certificat dans ClinicDb et une clé symétrique protégée par ce certificat." } }
    - { id: alter, text: { en: "Run ALTER TABLE dbo.Patient ALTER COLUMN NationalID ... ENCRYPTED WITH (...) in a query window.", fr: "Exécuter ALTER TABLE dbo.Patient ALTER COLUMN NationalID ... ENCRYPTED WITH (...) dans une fenêtre de requête." } }
answer:
  sequence: [kv, cmk, cek, enc]
explanation:
  correct:
    en: |
      The column master key is a key in an external key store, so it is created in Azure Key Vault first; the database then stores only metadata that points to it. The column encryption key is generated and encrypted with the column master key, and its encrypted value is stored in the database. Because the Database Engine never has the keys, existing data must be encrypted by a client-side tool such as the SSMS wizard, PowerShell or sqlpackage, which moves the data out, encrypts it and writes it back.
    fr: |
      La clé principale de colonne est une clé d'un magasin de clés externe : elle est d'abord créée dans Azure Key Vault, puis la base de données stocke seulement des métadonnées qui la référencent. La clé de chiffrement de colonne est générée et chiffrée avec la clé principale de colonne, et sa valeur chiffrée est stockée dans la base. Comme le moteur de base de données ne détient jamais les clés, les données existantes doivent être chiffrées par un outil côté client tel que l'Assistant de SSMS, PowerShell ou sqlpackage, qui extrait les données, les chiffre et les réécrit.
  options:
    dmk: { en: "A database master key belongs to the column-level encryption key hierarchy; Always Encrypted does not use it.", fr: "Une clé principale de base de données fait partie de la hiérarchie de clés du chiffrement au niveau des colonnes ; Always Encrypted ne l'utilise pas." }
    cert: { en: "Certificates and symmetric keys stored in the database are used by ENCRYPTBYKEY, not by Always Encrypted.", fr: "Les certificats et clés symétriques stockés dans la base servent à ENCRYPTBYKEY, pas à Always Encrypted." }
    alter: { en: "Without a secure enclave, Transact-SQL cannot encrypt existing data, because the engine has no access to the keys.", fr: "Sans enclave sécurisée, Transact-SQL ne peut pas chiffrer les données existantes, car le moteur n'a pas accès aux clés." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
  - title: Provision Always Encrypted keys using PowerShell
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/configure-always-encrypted-keys-using-powershell
