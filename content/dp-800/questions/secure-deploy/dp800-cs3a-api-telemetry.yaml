id: dp800-cs3a-api-telemetry
objective: "2.4.6"
type: single
caseStudy: dp800-cs3a-blue-yonder-airlines
difficulty: 1
status: draft
stem:
  en: You need to recommend a monitoring configuration for the maintenance API. The solution must meet the maintenance API requirements. What should you recommend?
  fr: Vous devez recommander une configuration de surveillance pour l'API de maintenance. La solution doit satisfaire les exigences de l'API de maintenance. Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: A runtime.telemetry.application-insights section in the DAB configuration that reads APPLICATIONINSIGHTS_CONNECTION_STRING
        fr: Une section runtime.telemetry.application-insights dans la configuration DAB qui lit APPLICATIONINSIGHTS_CONNECTION_STRING
    - id: b
      text:
        en: A Log Analytics workspace linked to the Container Apps environment of ca-maint-api to collect its console logs
        fr: Un espace de travail Log Analytics lié à l'environnement Container Apps de ca-maint-api pour collecter ses journaux de console
    - id: c
      text:
        en: A diagnostic setting on MaintDb that sends the QueryStoreRuntimeStatistics category to a Log Analytics workspace
        fr: Un paramètre de diagnostic sur MaintDb qui envoie la catégorie QueryStoreRuntimeStatistics vers un espace de travail Log Analytics
    - id: d
      text:
        en: A runtime.host.mode value of development in the DAB configuration to write detailed request logs
        fr: Une valeur development pour runtime.host.mode dans la configuration DAB pour écrire des journaux de requêtes détaillés
answer: { optionId: a }
explanation:
  correct:
    en: When Application Insights is enabled in runtime.telemetry, DAB sends each REST or GraphQL request with its duration and status code, and each SQL query it runs as a dependency with its duration. The operations team can then find the slow requests in appi-maint and see the SQL dependencies of each one. The connection string stays out of the file because the setting can reference the environment variable with @env().
    fr: Quand Application Insights est activé dans runtime.telemetry, DAB envoie chaque requête REST ou GraphQL avec sa durée et son code d'état, et chaque requête SQL qu'il exécute comme une dépendance avec sa durée. L'équipe d'exploitation peut alors trouver les requêtes lentes dans appi-maint et voir les dépendances SQL de chacune. La chaîne de connexion reste hors du fichier, car le paramètre peut référencer la variable d'environnement avec @env().
  options:
    c: { en: "Query Store statistics show the cost of SQL queries on the database side, but not which API request ran each query.", fr: "Les statistiques du Magasin des requêtes montrent le coût des requêtes SQL côté base de données, mais pas quelle requête d'API a exécuté chaque requête." }
    b: { en: "Console logs of the container don't provide request durations correlated with the SQL queries of each request.", fr: "Les journaux de console du conteneur ne fournissent pas les durées des requêtes corrélées aux requêtes SQL de chaque requête." }
    d: { en: "Development mode is meant for local work (Swagger UI, anonymous health checks); it doesn't send telemetry to a monitoring service.", fr: "Le mode development est destiné au travail local (Swagger UI, contrôles d'intégrité anonymes) ; il n'envoie pas de télémétrie vers un service de surveillance." }
references:
  - title: Use Azure Application Insights in Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights
