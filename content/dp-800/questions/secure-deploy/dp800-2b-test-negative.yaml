id: dp800-2b-test-negative
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a stored procedure named `dbo.CancelOrder`. When the order is already shipped, the procedure runs the following statement.

    ```sql
    THROW 50010, N'A shipped order cannot be cancelled.', 1;
    ```

    You are writing a SQL Server unit test that calls the procedure for a shipped order. The test must pass only if the procedure raises this error, and fail if the procedure succeeds or raises another error.

    What should you do?
  fr: |
    Litware dispose d'une procédure stockée nommée `dbo.CancelOrder`. Lorsque la commande est déjà expédiée, la procédure exécute l'instruction suivante.

    ```sql
    THROW 50010, N'A shipped order cannot be cancelled.', 1;
    ```

    Vous écrivez un test unitaire SQL Server qui appelle la procédure pour une commande expédiée. Le test doit réussir uniquement si la procédure lève cette erreur, et échouer si la procédure réussit ou lève une autre erreur.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |
          Add a Scalar Value test condition whose expected value is the error number 50010.
        fr: |
          Ajouter une condition de test Scalar Value dont la valeur attendue est le numéro d'erreur 50010.
    - id: b
      text:
        en: |
          Add an Empty ResultSet test condition that checks the result of the test script.
        fr: |
          Ajouter une condition de test Empty ResultSet qui vérifie le résultat du script de test.
    - id: c
      text:
        en: |
          Add ExpectedSqlException(MessageNumber = 50010, Severity = 16, State = 1) to the test method.
        fr: |
          Ajouter ExpectedSqlException(MessageNumber = 50010, Severity = 16, State = 1) à la méthode de test.
    - id: d
      text:
        en: |
          Keep only the Inconclusive test condition that Visual Studio added to the new test.
        fr: |
          Conserver uniquement la condition de test Inconclusive que Visual Studio a ajoutée au nouveau test.
answer: { optionId: c }
explanation:
  correct:
    en: |
      The ExpectedSqlException attribute marks an expected error so that it doesn't fail the test; its MessageNumber, Severity and State match the values raised by THROW, which always uses severity 16. If the procedure succeeds, the expected exception isn't raised and the test fails, which is what a negative test needs.
    fr: |
      L'attribut ExpectedSqlException signale une erreur attendue pour qu'elle ne fasse pas échouer le test ; ses valeurs MessageNumber, Severity et State correspondent à celles levées par THROW, qui utilise toujours la gravité 16. Si la procédure réussit, l'exception attendue n'est pas levée et le test échoue, ce qu'exige un test négatif.
  options:
    a:
      en: |
        A test condition evaluates a result set; an error raised by the procedure fails the test before any condition is evaluated.
      fr: |
        Une condition de test évalue un jeu de résultats ; une erreur levée par la procédure fait échouer le test avant l'évaluation de toute condition.
    b:
      en: |
        Empty ResultSet would also pass when the procedure succeeds without returning rows.
      fr: |
        Empty ResultSet réussirait aussi lorsque la procédure aboutit sans renvoyer de lignes.
    d:
      en: |
        Inconclusive is a placeholder that always returns Inconclusive; it verifies nothing.
      fr: |
        Inconclusive est un espace réservé qui renvoie toujours Inconclusive ; il ne vérifie rien.
references:
  - title: Use test conditions in SQL Server unit tests
    url: https://learn.microsoft.com/en-us/sql/ssdt/using-test-conditions-in-sql-server-unit-tests
