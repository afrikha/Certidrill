id: dp800-2c-ctl-deployment-job
objective: "2.3.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind uses Azure Pipelines to deploy an SDK-style SQL database project. An administrator configured an Approvals check that requires a DBA, and a Business hours check, on the Azure Pipelines environment **production**.

    You need to complete the production stage so that the pipeline pauses before the stage until both checks pass, and then publishes the .dacpac file once.

    How should you complete the YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind utilise Azure Pipelines pour déployer un projet de base de données SQL de style SDK. Un administrateur a configuré une vérification Approvals qui exige un DBA, ainsi qu'une vérification Business hours, sur l'environnement Azure Pipelines **production**.

    Vous devez compléter la phase de production pour que le pipeline se mette en pause avant la phase jusqu'à la réussite des deux vérifications, puis publie une seule fois le fichier .dacpac.

    Comment devez-vous compléter le YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    - stage: DeployProduction
      dependsOn: Build
      jobs:
        - [[job]]: PublishDacpac
          [[target]]: production
          strategy:
            [[strategy]]:
              deploy:
                steps:
                  - task: SqlAzureDacpacDeployment@1
                    inputs:
                      azureSubscription: sc-nw-prod
                      AuthenticationType: servicePrincipal
                      ServerName: sql-northwind.database.windows.net
                      DatabaseName: InventoryDb
                      DacpacFile: $(Pipeline.Workspace)/dacpac/InventoryDb.dacpac
  slots:
    - id: job
      options:
        - { id: deployment, text: "deployment" }
        - { id: job, text: "job" }
        - { id: template, text: "template" }
    - id: target
      options:
        - { id: environment, text: "environment" }
        - { id: pool, text: "pool" }
        - { id: variables, text: "variables" }
        - { id: condition, text: "condition" }
    - id: strategy
      options:
        - { id: runonce, text: "runOnce" }
        - { id: matrix, text: "matrix" }
        - { id: parallel, text: "parallel" }
answer:
  values: { job: deployment, target: environment, strategy: runonce }
explanation:
  correct:
    en: |
      A deployment job that targets an environment uses that resource, so the pipeline pauses before the stage and waits for every check defined on the environment, such as Approvals and Business hours. The runOnce strategy runs the deploy steps one time.
    fr: |
      Un travail de déploiement qui cible un environnement utilise cette ressource : le pipeline se met en pause avant la phase et attend chaque vérification définie sur l'environnement, comme Approvals et Business hours. La stratégie runOnce exécute les étapes deploy une seule fois.
  options:
    job: { en: "A regular job cannot target an environment or use a deploy lifecycle hook.", fr: "Un travail standard ne peut pas cibler un environnement ni utiliser un hook de cycle de vie deploy." }
    template: { en: "A template reference inserts YAML from another file; it does not create a job that targets an environment.", fr: "Une référence de modèle insère du YAML provenant d'un autre fichier ; elle ne crée pas de travail qui cible un environnement." }
    pool: { en: "pool selects the agents; the checks are attached to the production environment, not to an agent pool here.", fr: "pool sélectionne les agents ; les vérifications sont associées ici à l'environnement production, pas à un pool d'agents." }
    variables: { en: "variables defines values; it does not reference the environment resource.", fr: "variables définit des valeurs ; il ne référence pas la ressource d'environnement." }
    condition: { en: "condition is a YAML expression evaluated by the pipeline; it does not reference the environment.", fr: "condition est une expression YAML évaluée par le pipeline ; elle ne référence pas l'environnement." }
    matrix: { en: "matrix is a strategy of regular jobs that runs one copy per configuration.", fr: "matrix est une stratégie des travaux standard qui exécute une copie par configuration." }
    parallel: { en: "parallel is a strategy of regular jobs that slices work across agents.", fr: "parallel est une stratégie des travaux standard qui répartit le travail sur plusieurs agents." }
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
  - title: Implement CI/CD pipelines
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/06-implement-cicd-pipelines
