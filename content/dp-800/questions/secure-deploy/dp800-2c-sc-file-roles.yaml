id: dp800-2c-sc-file-roles
objective: "2.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is reviewing the files of an SDK-style SQL database project named **PayrollDb** before adding it to source control.

    Which file type matches each description? To answer, drag the appropriate file types to the correct descriptions. Each file type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum examine les fichiers d'un projet de base de données SQL de style SDK nommé **PayrollDb** avant de l'ajouter au contrôle de code source.

    Quel type de fichier correspond à chaque description ? Pour répondre, faites glisser les types de fichiers appropriés vers les descriptions correspondantes. Chaque type de fichier peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sqlproj, text: ".sqlproj" }
    - { id: refactorlog, text: ".refactorlog" }
    - { id: scmp, text: ".scmp" }
    - { id: publish, text: ".publish.xml" }
    - { id: dacpac, text: ".dacpac" }
    - { id: gitignore, text: ".gitignore" }
  targets:
    - id: renames
      text: { en: "Records rename operations so that a deployment renames objects instead of dropping and re-creating them", fr: "Enregistre les opérations de renommage pour qu'un déploiement renomme les objets au lieu de les supprimer et de les recréer" }
    - id: compare
      text: { en: "Saves the source, the target and the options of a schema comparison so that it can be run again", fr: "Enregistre la source, la cible et les options d'une comparaison de schémas pour pouvoir la relancer" }
    - id: profile
      text: { en: "Stores deployment properties and SQLCMD variable values for one target environment", fr: "Stocke les propriétés de déploiement et les valeurs des variables SQLCMD pour un environnement cible" }
    - id: output
      text: { en: "Build output that describes the desired state of the database and is re-created by every build", fr: "Sortie de génération qui décrit l'état souhaité de la base de données et qui est recréée à chaque génération" }
answer:
  mapping: { renames: refactorlog, compare: scmp, profile: publish, output: dacpac }
explanation:
  correct:
    en: |
      The .refactorlog file records renames and schema moves; the build packages it into the .dacpac and deployment applies each operation once. An .scmp file stores the source, target, options and excluded object types of a schema comparison. A .publish.xml publish profile holds deployment properties and SQLCMD variable values. The .dacpac is the build artifact, which is excluded from Git. The .sqlproj file defines the project and .gitignore lists untracked files; neither matches a description.
    fr: |
      Le fichier .refactorlog enregistre les renommages et les déplacements de schéma ; la génération l'inclut dans le .dacpac et le déploiement applique chaque opération une seule fois. Un fichier .scmp stocke la source, la cible, les options et les types d'objets exclus d'une comparaison de schémas. Un profil de publication .publish.xml contient des propriétés de déploiement et des valeurs de variables SQLCMD. Le .dacpac est l'artefact de génération, exclu de Git. Le fichier .sqlproj définit le projet et .gitignore liste les fichiers non suivis ; aucun ne correspond à une description.
references:
  - title: Refactor objects in SQL database projects
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/refactor-overview
  - title: Publish profiles overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/publish-profiles
