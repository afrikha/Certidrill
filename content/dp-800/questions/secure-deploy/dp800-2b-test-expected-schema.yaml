id: dp800-2b-test-expected-schema
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses SQL Server unit tests for a database project. A reporting application depends on the result set of the stored procedure `dbo.GetInvoiceSummary`.

    You need a test that fails if a change renames a column of the result set or changes its data type. The test must pass whatever data the test database contains.

    Which test condition should you use?
  fr: |
    Fabrikam utilise des tests unitaires SQL Server pour un projet de base de données. Une application de reporting dépend du jeu de résultats de la procédure stockée `dbo.GetInvoiceSummary`.

    Vous avez besoin d'un test qui échoue si une modification renomme une colonne du jeu de résultats ou change son type de données. Le test doit réussir quelles que soient les données de la base de test.

    Quelle condition de test devez-vous utiliser ?
body:
  options:
    - id: a
      text: Data Checksum
    - id: b
      text: Row Count
    - id: c
      text: Not Empty ResultSet
    - id: d
      text: Expected Schema
answer: { optionId: d }
explanation:
  correct:
    en: |
      Expected Schema fails when the column names or data types of the result set don't match the schema stored in the condition; it doesn't check the values, so it works with any data.
    fr: |
      Expected Schema échoue lorsque les noms de colonnes ou les types de données du jeu de résultats ne correspondent pas au schéma enregistré dans la condition ; elle ne vérifie pas les valeurs et fonctionne donc avec n'importe quelles données.
  options:
    a:
      en: |
        Data Checksum compares the values of the result set, so it fails when the data changes.
      fr: |
        Data Checksum compare les valeurs du jeu de résultats : elle échoue lorsque les données changent.
    b:
      en: |
        Row Count checks the number of rows, not the columns.
      fr: |
        Row Count vérifie le nombre de lignes, pas les colonnes.
    c:
      en: |
        Not Empty ResultSet only checks that at least one row is returned.
      fr: |
        Not Empty ResultSet vérifie seulement qu'au moins une ligne est renvoyée.
references:
  - title: Use test conditions in SQL Server unit tests
    url: https://learn.microsoft.com/en-us/sql/ssdt/using-test-conditions-in-sql-server-unit-tests
