id: dp800-2d-log-analytics-sink
objective: "2.4.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs Data API builder (DAB) in Azure Container Apps. You plan to send the DAB logs to a Log Analytics workspace by adding the following section to runtime.telemetry:

    ```json
    "azure-log-analytics": {
      "enabled": true,
      "dab-identifier": "dab-claims-prod",
      "auth": {
        "custom-table-name": "<table name>",
        "dcr-immutable-id": "dcr-<id>",
        "dce-endpoint": "https://<dce-name>.westeurope-1.ingest.monitor.azure.com"
      }
    }
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute Data API builder (DAB) dans Azure Container Apps. Vous prévoyez d'envoyer les journaux DAB vers un espace de travail Log Analytics en ajoutant la section suivante à runtime.telemetry :

    ```json
    "azure-log-analytics": {
      "enabled": true,
      "dab-identifier": "dab-claims-prod",
      "auth": {
        "custom-table-name": "<table name>",
        "dcr-immutable-id": "dcr-<id>",
        "dce-endpoint": "https://<dce-name>.westeurope-1.ingest.monitor.azure.com"
      }
    }
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The managed identity of the container app must have the Monitoring Metrics Publisher role on the data collection rule.
        fr: L'identité managée de l'application conteneur doit disposer du rôle Monitoring Metrics Publisher sur la règle de collecte de données.
    - id: s2
      text:
        en: You can set custom-table-name to DabLogs.
        fr: Vous pouvez définir custom-table-name sur DabLogs.
    - id: s3
      text:
        en: To query only the entries of this instance, you can filter the custom table on the Identifier_s column with the value dab-claims-prod.
        fr: Pour interroger uniquement les entrées de cette instance, vous pouvez filtrer la table personnalisée sur la colonne Identifier_s avec la valeur dab-claims-prod.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      DAB authenticates to the data collection endpoint with the managed identity of its host, and that identity needs the Monitoring Metrics Publisher role scoped to the data collection rule; no secret is stored in the configuration. The custom table name must end with _CL, such as DabLogs_CL. Each entry carries the dab-identifier value in the Identifier column, exposed with a type suffix as Identifier_s.
    fr: |
      DAB s'authentifie auprès du point de terminaison de collecte de données avec l'identité managée de son hôte, et cette identité a besoin du rôle Monitoring Metrics Publisher limité à la règle de collecte de données ; aucun secret n'est stocké dans la configuration. Le nom de la table personnalisée doit se terminer par _CL, comme DabLogs_CL. Chaque entrée porte la valeur dab-identifier dans la colonne Identifier, exposée avec un suffixe de type sous la forme Identifier_s.
references:
  - title: Use Azure Log Analytics in Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/log-analytics
