id: dp800-2c-sc-sdk-globbing
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has an SDK-style SQL database project named **TicketsDb** stored in an Azure Repos Git repository. The project file has not been customized.

    A developer creates the file **Tables/Venue.sql**, which contains a `CREATE TABLE` statement, and commits it in a feature branch.

    You need the Venue table to be part of the database model that the CI build produces.

    What should you do?
  fr: |
    Wingtip dispose d'un projet de base de données SQL de style SDK nommé **TicketsDb**, stocké dans un dépôt Git Azure Repos. Le fichier projet n'a pas été personnalisé.

    Un développeur crée le fichier **Tables/Venue.sql**, qui contient une instruction `CREATE TABLE`, et le valide dans une branche de fonctionnalité.

    Vous devez faire en sorte que la table Venue fasse partie du modèle de base de données produit par la génération CI.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a Build Include item for Tables\\Venue.sql to the project file.", fr: "Ajouter un élément Build Include pour Tables\\Venue.sql au fichier projet." } }
    - { id: b, text: { en: "Add a None Include item for Tables\\Venue.sql to the project file.", fr: "Ajouter un élément None Include pour Tables\\Venue.sql au fichier projet." } }
    - { id: c, text: { en: "Reference Tables\\Venue.sql with :r in the pre-deployment script.", fr: "Référencer Tables\\Venue.sql avec :r dans le script de prédéploiement." } }
    - { id: d, text: { en: "Nothing: the project already includes every .sql file in its folder tree.", fr: "Rien : le projet inclut déjà chaque fichier .sql de son arborescence." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SDK-style projects use a default globbing pattern (`**/*.sql`), so any .sql file added under the project folder is compiled into the model without editing the .sqlproj file. A pull request that adds a table therefore changes only the new object file.
    fr: |
      Les projets de style SDK utilisent un modèle de globbing par défaut (`**/*.sql`) : tout fichier .sql ajouté sous le dossier du projet est compilé dans le modèle sans modifier le fichier .sqlproj. Une pull request qui ajoute une table ne modifie donc que le nouveau fichier d'objet.
  options:
    a:
      en: |
        Listing each file with Build Include is the original project format; in an SDK-style project the file is already included.
      fr: |
        Lister chaque fichier avec Build Include correspond au format de projet d'origine ; dans un projet de style SDK, le fichier est déjà inclus.
    b:
      en: |
        None Include keeps a file visible without compiling it, which is the opposite of the requirement.
      fr: |
        None Include garde un fichier visible sans le compiler, soit l'inverse de l'exigence.
    c:
      en: |
        A file included in a deployment script is not part of the validated model and would run before every deployment.
      fr: |
        Un fichier inclus dans un script de déploiement ne fait pas partie du modèle validé et s'exécuterait avant chaque déploiement.
references:
  - title: What are SQL database projects?
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/sql-database-projects
