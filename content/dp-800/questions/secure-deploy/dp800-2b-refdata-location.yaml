id: dp800-2b-refdata-location
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso manages the schema of its order database in an SDK-style SQL database project in Git. The application needs the rows of the `dbo.OrderStatus` lookup table in every environment.

    You need to keep the lookup values in source control with the schema. Each deployment of the project must apply the values after the table has been created or changed.

    Where should you put the statements that populate `dbo.OrderStatus`?
  fr: |
    Contoso gère le schéma de sa base de commandes dans un projet de base de données SQL de style SDK sous Git. L'application a besoin des lignes de la table de recherche `dbo.OrderStatus` dans chaque environnement.

    Vous devez conserver les valeurs de recherche dans le contrôle de code source avec le schéma. Chaque déploiement du projet doit appliquer les valeurs après la création ou la modification de la table.

    Où devez-vous placer les instructions qui alimentent `dbo.OrderStatus` ?
body:
  options:
    - id: a
      text:
        en: |
          In the pre-deployment script of the project
        fr: |
          Dans le script de prédéploiement du projet
    - id: b
      text:
        en: |
          In the post-deployment script of the project
        fr: |
          Dans le script de post-déploiement du projet
    - id: c
      text:
        en: |
          In a .dacpac file committed to the repository
        fr: |
          Dans un fichier .dacpac validé dans le dépôt
    - id: d
      text:
        en: |
          In the default value of a SQLCMD variable of the project
        fr: |
          Dans la valeur par défaut d'une variable SQLCMD du projet
answer: { optionId: b }
explanation:
  correct:
    en: |
      The post-deployment script runs after the deployment plan completes, on every deployment, so the table already has its final schema when the lookup rows are applied. It is the place for reference data, seed rows and application defaults; a project has only one, which can include other files with SQLCMD :r.
    fr: |
      Le script de post-déploiement s'exécute après la fin du plan de déploiement, à chaque déploiement : la table a donc déjà son schéma final lorsque les lignes de recherche sont appliquées. C'est l'emplacement des données de référence, des lignes d'amorçage et des valeurs par défaut de l'application ; un projet n'en a qu'un, qui peut inclure d'autres fichiers avec la commande SQLCMD :r.
  options:
    a:
      en: |
        The pre-deployment script runs before the schema changes, when the table might not exist yet or might lack new columns.
      fr: |
        Le script de prédéploiement s'exécute avant les modifications de schéma, alors que la table n'existe peut-être pas encore ou n'a pas encore ses nouvelles colonnes.
    c:
      en: |
        The .dacpac is a build output recreated by every build; it is excluded from source control.
      fr: |
        Le fichier .dacpac est une sortie de build recréée à chaque build ; il est exclu du contrôle de code source.
    d:
      en: |
        A SQLCMD variable holds one value supplied at deployment, and its default value isn't even compiled into the .dacpac.
      fr: |
        Une variable SQLCMD contient une valeur fournie au déploiement, et sa valeur par défaut n'est même pas compilée dans le fichier .dacpac.
references:
  - title: Pre-deployment and post-deployment scripts
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts
