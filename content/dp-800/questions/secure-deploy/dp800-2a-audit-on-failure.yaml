id: dp800-2a-audit-on-failure
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance. You are creating a server audit named **Audit_Pay** that writes to files in `D:\Audit\`, and a database audit specification that records the statements run on the payroll tables.

    If the audit records cannot be written, the statements that would generate audited events must fail. All other activity on the instance must continue, and the instance must not stop.

    Which ON_FAILURE option should you specify in the CREATE SERVER AUDIT statement?
  fr: |
    Vous disposez d'une instance SQL Server 2022. Vous créez un audit de serveur nommé **Audit_Pay** qui écrit dans des fichiers de `D:\Audit\`, et une spécification d'audit de base de données qui enregistre les instructions exécutées sur les tables de paie.

    Si les enregistrements d'audit ne peuvent pas être écrits, les instructions qui généreraient des événements audités doivent échouer. Toute autre activité de l'instance doit se poursuivre, et l'instance ne doit pas s'arrêter.

    Quelle option ON_FAILURE devez-vous spécifier dans l'instruction CREATE SERVER AUDIT ?
body:
  options:
    - { id: a, text: CONTINUE }
    - { id: b, text: SHUTDOWN }
    - { id: c, text: FAIL_OPERATION }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With ON_FAILURE = FAIL_OPERATION, database actions that would generate audited events fail while the audit target is unavailable, and actions that generate no audited events continue. The audit resumes when the failure is resolved.
    fr: |
      Avec ON_FAILURE = FAIL_OPERATION, les actions de base de données qui généreraient des événements audités échouent tant que la cible d'audit n'est pas disponible, et les actions qui ne génèrent aucun événement audité se poursuivent. L'audit reprend lorsque la défaillance est résolue.
  options:
    a: { en: "CONTINUE lets the audited statements run without retaining audit records, which allows unaudited activity.", fr: "CONTINUE laisse les instructions auditées s'exécuter sans conserver d'enregistrements d'audit, ce qui permet une activité non auditée." }
    b: { en: "SHUTDOWN forces the whole instance to stop when the audit can't be written.", fr: "SHUTDOWN force l'arrêt de toute l'instance lorsque l'audit ne peut pas être écrit." }
references:
  - title: CREATE SERVER AUDIT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-server-audit-transact-sql
