id: dp800-2a-ddm-unmask-column
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database. The **Sales.Customer** table has dynamic data masks on the **Phone**, **Email** and **CreditLimit** columns. Other tables of the Sales schema also contain masked columns.

    Members of the database role **Telesales** have `SELECT` on Sales.Customer. They must see the real phone numbers. All the other masked columns must stay masked for them.

    The solution must follow the principle of least privilege. Which statement should you run?
  fr: |
    Vous disposez d'une base de données Azure SQL Database. La table **Sales.Customer** a des masques dynamiques sur les colonnes **Phone**, **Email** et **CreditLimit**. D'autres tables du schéma Sales contiennent aussi des colonnes masquées.

    Les membres du rôle de base de données **Telesales** disposent de `SELECT` sur Sales.Customer. Ils doivent voir les vrais numéros de téléphone. Toutes les autres colonnes masquées doivent rester masquées pour eux.

    La solution doit respecter le principe du moindre privilège. Quelle instruction devez-vous exécuter ?
body:
  options:
    - id: a
      text: "GRANT UNMASK TO Telesales;"
    - id: b
      text: "GRANT UNMASK ON Sales.Customer TO Telesales;"
    - id: c
      text: "GRANT UNMASK ON Sales.Customer (Phone) TO Telesales;"
    - id: d
      text: "GRANT UNMASK ON SCHEMA::Sales TO Telesales;"
answer: { optionId: c }
explanation:
  correct:
    en: |
      UNMASK can be granted at the database, schema, table or column level in Azure SQL and in SQL Server 2022 and later. A column-level grant on Sales.Customer (Phone) shows the real phone numbers to Telesales while Email, CreditLimit and the masked columns of the other tables stay masked.
    fr: |
      UNMASK peut être accordée au niveau de la base de données, du schéma, de la table ou de la colonne dans Azure SQL et dans SQL Server 2022 et versions ultérieures. Une autorisation au niveau de la colonne sur Sales.Customer (Phone) affiche les vrais numéros de téléphone à Telesales, tandis qu'Email, CreditLimit et les colonnes masquées des autres tables restent masqués.
  options:
    a: { en: "A database-level UNMASK removes the masks of every column in the database.", fr: "Une autorisation UNMASK au niveau de la base de données retire les masques de toutes les colonnes de la base." }
    b: { en: "A table-level UNMASK also unmasks Email and CreditLimit.", fr: "Une autorisation UNMASK au niveau de la table démasque aussi Email et CreditLimit." }
    d: { en: "A schema-level UNMASK unmasks every masked column of every table in the Sales schema.", fr: "Une autorisation UNMASK au niveau du schéma démasque toutes les colonnes masquées de toutes les tables du schéma Sales." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview
