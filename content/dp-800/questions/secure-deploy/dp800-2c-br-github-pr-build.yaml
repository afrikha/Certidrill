id: dp800-2c-br-github-pr-build
objective: "2.3.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin stores an SDK-style SQL database project in the **Database** folder of a GitHub repository. You are creating a workflow that checks pull requests.

    The workflow must meet the following requirements:

    - It runs for pull requests that target main and change files in the Database folder.
    - It validates the project's syntax and references without connecting to any database.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin stocke un projet de base de données SQL de style SDK dans le dossier **Database** d'un dépôt GitHub. Vous créez un workflow qui vérifie les pull requests.

    Le workflow doit respecter les exigences suivantes :

    - Il s'exécute pour les pull requests qui ciblent main et modifient des fichiers du dossier Database.
    - Il valide la syntaxe et les références du projet sans se connecter à une base de données.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    name: db-pr-check
    on:
      [[event]]:
        branches: [main]
        [[filter]]:
          - 'Database/**'
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - run: [[cmd]]
  slots:
    - id: event
      options:
        - { id: pr, text: "pull_request" }
        - { id: push, text: "push" }
        - { id: dispatch, text: "workflow_dispatch" }
        - { id: schedule, text: "schedule" }
    - id: filter
      options:
        - { id: paths, text: "paths" }
        - { id: ignore, text: "paths-ignore" }
        - { id: tags, text: "tags" }
        - { id: types, text: "types" }
    - id: cmd
      options:
        - { id: build, text: "dotnet build Database/SalesDb.sqlproj" }
        - { id: publish, text: 'sqlpackage /Action:Publish /SourceFile:Database/SalesDb.sqlproj /TargetConnectionString:"$TEST_CONN"' }
        - { id: report, text: 'sqlpackage /Action:DeployReport /SourceFile:Database/SalesDb.dacpac /TargetConnectionString:"$TEST_CONN"' }
answer:
  values: { event: pr, filter: paths, cmd: build }
explanation:
  correct:
    en: |
      The pull_request event with a branches filter runs the workflow for pull requests that target main, and the paths filter limits it to changes under Database. dotnet build compiles the project into a .dacpac and fails on syntax errors and unresolved references, without any database connection.
    fr: |
      L'événement pull_request avec un filtre branches exécute le workflow pour les pull requests qui ciblent main, et le filtre paths le limite aux modifications sous Database. dotnet build compile le projet en .dacpac et échoue sur les erreurs de syntaxe et les références non résolues, sans aucune connexion à une base de données.
  options:
    push: { en: "A push to main runs after the merge, not on the pull request.", fr: "Un push vers main s'exécute après la fusion, pas sur la pull request." }
    dispatch: { en: "workflow_dispatch runs only when someone starts the workflow manually.", fr: "workflow_dispatch ne s'exécute que lorsque quelqu'un lance le workflow manuellement." }
    schedule: { en: "schedule runs on a cron timetable and does not accept a branches filter.", fr: "schedule s'exécute selon une planification cron et n'accepte pas de filtre branches." }
    ignore: { en: "paths-ignore would skip the workflow when only Database files change.", fr: "paths-ignore ignorerait le workflow quand seuls des fichiers de Database changent." }
    tags: { en: "Pull request events are filtered by branches and paths, not tags.", fr: "Les événements de pull request se filtrent par branches et chemins, pas par tags." }
    types: { en: "types filters the activity type of the pull request (opened, synchronize...), not the changed files.", fr: "types filtre le type d'activité de la pull request (opened, synchronize...), pas les fichiers modifiés." }
    publish: { en: "Publish deploys to a database, which the requirements exclude.", fr: "Publish déploie sur une base de données, ce que les exigences excluent." }
    report: { en: "DeployReport compares a .dacpac with a live database, so it needs a connection.", fr: "DeployReport compare un .dacpac avec une base de données réelle : il nécessite une connexion." }
references:
  - title: Manage branching, pull requests, and conflict resolution
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/04-manage-branching-pull-requests-conflict-resolution
