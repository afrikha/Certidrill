id: dp800-cs2a-openai-identity
objective: "2.1.7"
type: multi
caseStudy: dp800-cs2a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to ensure that lamna-search can generate embeddings by running AI_GENERATE_EMBEDDINGS with NotesEmbedding. The solution must meet the security requirements.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez faire en sorte que lamna-search puisse générer des incorporations en exécutant AI_GENERATE_EMBEDDINGS avec NotesEmbedding. La solution doit satisfaire les exigences de sécurité.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: On aoai-lamna, assign the Cognitive Services OpenAI User role to the system-assigned managed identity of sql-lamna-prod.
        fr: Sur aoai-lamna, attribuer le rôle Cognitive Services OpenAI User à l'identité managée affectée par le système de sql-lamna-prod.
    - id: b
      text:
        en: On aoai-lamna, assign the Cognitive Services OpenAI User role to the managed identity of the clinician application.
        fr: Sur aoai-lamna, attribuer le rôle Cognitive Services OpenAI User à l'identité managée de l'application des cliniciens.
    - id: c
      text:
        en: In ClinicalDb, run GRANT EXECUTE ON EXTERNAL MODEL::NotesEmbedding TO [lamna-search].
        fr: Dans ClinicalDb, exécuter GRANT EXECUTE ON EXTERNAL MODEL::NotesEmbedding TO [lamna-search].
    - id: d
      text:
        en: In ClinicalDb, run GRANT ALTER ANY EXTERNAL MODEL TO [lamna-search].
        fr: Dans ClinicalDb, exécuter GRANT ALTER ANY EXTERNAL MODEL TO [lamna-search].
    - id: e
      text:
        en: In ClinicalDb, add lamna-search to the db_owner database role.
        fr: Dans ClinicalDb, ajouter lamna-search au rôle de base de données db_owner.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      The credential with IDENTITY = 'Managed Identity' makes the database engine authenticate to aoai-lamna with the managed identity of the logical server, so that identity needs the Cognitive Services OpenAI User role, which allows calls to the deployments without managing the resource. Inside the database, a principal can use an external model in the AI functions only if it is granted EXECUTE on that model, which is the least privilege for lamna-search.
    fr: |
      Les informations d'identification avec IDENTITY = 'Managed Identity' font que le moteur de base de données s'authentifie auprès d'aoai-lamna avec l'identité managée du serveur logique : cette identité a donc besoin du rôle Cognitive Services OpenAI User, qui permet d'appeler les déploiements sans gérer la ressource. Dans la base de données, un principal ne peut utiliser un modèle externe dans les fonctions IA que s'il dispose de l'autorisation EXECUTE sur ce modèle, ce qui constitue le moindre privilège pour lamna-search.
  options:
    b: { en: "The request to aoai-lamna is sent by sql-lamna-prod with its own managed identity, not by the clinician application, so this role assignment is not used.", fr: "La requête vers aoai-lamna est envoyée par sql-lamna-prod avec sa propre identité managée, pas par l'application des cliniciens : cette attribution de rôle n'est pas utilisée." }
    d: { en: "ALTER ANY EXTERNAL MODEL lets the user create and change external models, which is more than running the existing model.", fr: "ALTER ANY EXTERNAL MODEL permet à l'utilisateur de créer et de modifier des modèles externes, ce qui dépasse l'exécution du modèle existant." }
    e: { en: "db_owner grants full control of ClinicalDb, which violates the principle of least privilege.", fr: "db_owner accorde le contrôle total de ClinicalDb, ce qui enfreint le principe du moindre privilège." }
references:
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
  - title: sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
