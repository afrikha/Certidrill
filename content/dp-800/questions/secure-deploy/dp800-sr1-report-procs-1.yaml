stem:
  en: You grant EXECUTE on the Reports schema to ReportUsers.
  fr: Vous accordez EXECUTE sur le schéma Reports à ReportUsers.
body:
  solution:
    en: |
      In FinanceDb, you run the following statement:

      ```sql
      GRANT EXECUTE ON SCHEMA::Reports TO ReportUsers;
      ```
    fr: |
      Dans FinanceDb, vous exécutez l'instruction suivante :

      ```sql
      GRANT EXECUTE ON SCHEMA::Reports TO ReportUsers;
      ```
answer: { value: true }
explanation:
  correct:
    en: EXECUTE granted on a schema applies to every procedure that exists, or will exist, in that schema. The Reports procedures and the Sales tables have the same owner and use static Transact-SQL, so ownership chaining skips the permission check on the tables, and ReportUsers reads the data only through the procedures. ReportUsers receives no permission on the Sales tables or the Admin schema.
    fr: "EXECUTE accordée sur un schéma s'applique à toutes les procédures qui existent, ou qui existeront, dans ce schéma. Les procédures Reports et les tables Sales ont le même propriétaire et utilisent du Transact-SQL statique : le chaînage des propriétés évite la vérification des autorisations sur les tables, et ReportUsers lit les données uniquement par l'intermédiaire des procédures. ReportUsers ne reçoit aucune autorisation sur les tables Sales ni sur le schéma Admin."
