id: dp800-2a-ddm-who-sees
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database. The **Salary** column of **HR.Employee** is masked with the `default()` function. The **Bonus** column of the same table is also masked.

    The following database users exist:

    | User | Permissions and role memberships |
    | --- | --- |
    | Ana | Member of db_owner |
    | Ben | SELECT on HR.Employee and UNMASK ON SCHEMA::HR |
    | Carl | SELECT on HR.Employee and ALTER ANY MASK |
    | Dana | SELECT on HR.Employee and UNMASK ON HR.Employee (Bonus) |
    | Eli | SELECT on HR.Employee |

    Which two users see the real values of Salary when they query HR.Employee?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database. La colonne **Salary** de **HR.Employee** est masquée avec la fonction `default()`. La colonne **Bonus** de la même table est aussi masquée.

    Les utilisateurs de base de données suivants existent :

    | Utilisateur | Autorisations et appartenances aux rôles |
    | --- | --- |
    | Ana | Membre de db_owner |
    | Ben | SELECT sur HR.Employee et UNMASK ON SCHEMA::HR |
    | Carl | SELECT sur HR.Employee et ALTER ANY MASK |
    | Dana | SELECT sur HR.Employee et UNMASK ON HR.Employee (Bonus) |
    | Eli | SELECT sur HR.Employee |

    Quels sont les deux utilisateurs qui voient les vraies valeurs de Salary lorsqu'ils interrogent HR.Employee ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Carl }
    - { id: b, text: Ana }
    - { id: c, text: Dana }
    - { id: d, text: Eli }
    - { id: e, text: Ben }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      Members of db_owner hold CONTROL on the database, which includes UNMASK, so they always see the original data. A schema-level UNMASK on HR covers every masked column of the tables in that schema, including Salary.
    fr: |
      Les membres de db_owner détiennent CONTROL sur la base de données, qui inclut UNMASK : ils voient toujours les données d'origine. Une autorisation UNMASK au niveau du schéma HR couvre toutes les colonnes masquées des tables de ce schéma, y compris Salary.
  options:
    a: { en: "ALTER ANY MASK lets Carl add, replace or drop masks (with ALTER on the table), but it does not unmask query results.", fr: "ALTER ANY MASK permet à Carl d'ajouter, de remplacer ou de supprimer des masques (avec ALTER sur la table), mais ne démasque pas les résultats des requêtes." }
    c: { en: "Dana's column-level UNMASK applies only to Bonus; Salary stays masked.", fr: "L'autorisation UNMASK de Dana au niveau de la colonne ne s'applique qu'à Bonus ; Salary reste masquée." }
    d: { en: "SELECT alone returns masked values.", fr: "SELECT seule renvoie des valeurs masquées." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking
