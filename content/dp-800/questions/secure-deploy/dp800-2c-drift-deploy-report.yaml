id: dp800-2c-drift-deploy-report
objective: "2.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam deploys a .dacpac file built from an SDK-style SQL database project to an Azure SQL database named **ClaimsDb**. ClaimsDb is not registered as a data-tier application.

    Before each production deployment, the pipeline must produce a machine-readable list of the operations that a publish would perform, such as Create, Alter, Drop and TableDataMotion, so that a script can stop the release when an unexpected operation appears. The step must not change ClaimsDb.

    Which SqlPackage action should the step run?
  fr: |
    Fabrikam déploie un fichier .dacpac généré à partir d'un projet de base de données SQL de style SDK sur une base de données Azure SQL nommée **ClaimsDb**. ClaimsDb n'est pas inscrite comme application de la couche Données.

    Avant chaque déploiement en production, le pipeline doit produire une liste exploitable par une machine des opérations qu'une publication effectuerait, comme Create, Alter, Drop et TableDataMotion, pour qu'un script arrête la mise en production lorsqu'une opération inattendue apparaît. L'étape ne doit pas modifier ClaimsDb.

    Quelle action SqlPackage l'étape doit-elle exécuter ?
body:
  options:
    - { id: a, text: "DriftReport" }
    - { id: b, text: "Script" }
    - { id: c, text: "DeployReport" }
    - { id: d, text: "Extract" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DeployReport compares the .dacpac with the target database and writes an XML report of the changes that a publish would make, including alerts such as data motion, without modifying the database. The pipeline can parse the XML and fail when it finds an unexpected Drop or TableDataMotion.
    fr: |
      DeployReport compare le .dacpac à la base de données cible et écrit un rapport XML des modifications qu'une publication effectuerait, y compris des alertes comme le déplacement de données, sans modifier la base de données. Le pipeline peut analyser le XML et échouer lorsqu'il trouve un Drop ou un TableDataMotion inattendu.
  options:
    a:
      en: |
        DriftReport lists changes made since a database was registered as a data-tier application; ClaimsDb is not registered, and the report does not describe the planned publish.
      fr: |
        DriftReport liste les modifications apportées depuis l'inscription d'une base de données comme application de la couche Données ; ClaimsDb n'est pas inscrite, et le rapport ne décrit pas la publication prévue.
    b:
      en: |
        Script produces the T-SQL deployment script, which a reviewer can read but which is not a structured list of operations.
      fr: |
        Script produit le script T-SQL de déploiement, lisible par un réviseur, mais qui n'est pas une liste structurée d'opérations.
    d:
      en: |
        Extract captures the current schema of the database; it does not compare it with the .dacpac to be deployed.
      fr: |
        Extract capture le schéma actuel de la base de données ; il ne le compare pas au .dacpac à déployer.
references:
  - title: SqlPackage deploy report and drift report
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-deploy-drift-report
  - title: Detect and resolve schema drift
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/05-detect-resolve-schema-drift
