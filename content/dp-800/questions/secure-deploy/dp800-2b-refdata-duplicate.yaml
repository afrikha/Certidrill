id: dp800-2b-refdata-duplicate
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's SQL database project contains the following file, which is included in the post-deployment script.

    ```sql
    -- Scripts/PostDeployment/Country.data.sql
    INSERT INTO dbo.Country (CountryCode, CountryName)
    VALUES ('FR', N'France'), ('BE', N'Belgium'), ('AE', N'United Arab Emirates');
    ```

    The first deployment to the test database succeeds. The second deployment fails with a primary key violation on `dbo.Country`.

    You need the script to succeed on every deployment and to apply name changes made in Git. What should you do?
  fr: |
    Le projet de base de données SQL de Fabrikam contient le fichier suivant, inclus dans le script de post-déploiement.

    ```sql
    -- Scripts/PostDeployment/Country.data.sql
    INSERT INTO dbo.Country (CountryCode, CountryName)
    VALUES ('FR', N'France'), ('BE', N'Belgium'), ('AE', N'United Arab Emirates');
    ```

    Le premier déploiement sur la base de test réussit. Le deuxième échoue avec une violation de clé primaire sur `dbo.Country`.

    Vous devez faire en sorte que le script réussisse à chaque déploiement et applique les modifications de noms faites dans Git. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |
          Move the INSERT statement to the pre-deployment script.
        fr: |
          Déplacer l'instruction INSERT dans le script de prédéploiement.
    - id: b
      text:
        en: |
          Set BlockOnPossibleDataLoss to False in the publish profile.
        fr: |
          Définir BlockOnPossibleDataLoss sur False dans le profil de publication.
    - id: c
      text:
        en: |
          Rewrite the script as a MERGE on CountryCode that updates and inserts rows.
        fr: |
          Réécrire le script sous forme de MERGE sur CountryCode qui met à jour et insère les lignes.
    - id: d
      text:
        en: |
          Add a Build Remove item for Country.data.sql in the project file.
        fr: |
          Ajouter un élément Build Remove pour Country.data.sql dans le fichier projet.
answer: { optionId: c }
explanation:
  correct:
    en: |
      Post-deployment scripts run on every deployment, so plain INSERT statements fail with duplicate keys the second time. A MERGE whose source is a table value constructor is idempotent; it inserts new codes and updates names that changed in Git.
    fr: |
      Les scripts de post-déploiement s'exécutent à chaque déploiement : de simples instructions INSERT échouent donc sur des clés en double la deuxième fois. Une instruction MERGE dont la source est un constructeur de valeurs de table est idempotente ; elle insère les nouveaux codes et met à jour les noms modifiés dans Git.
  options:
    a:
      en: |
        The pre-deployment script also runs on every deployment, so the duplicate keys remain.
      fr: |
        Le script de prédéploiement s'exécute lui aussi à chaque déploiement : les clés en double subsistent.
    b:
      en: |
        BlockOnPossibleDataLoss controls schema changes that could lose data; it doesn't affect statements in the scripts.
      fr: |
        BlockOnPossibleDataLoss contrôle les modifications de schéma susceptibles de perdre des données ; il n'affecte pas les instructions des scripts.
    d:
      en: |
        Build Remove only keeps the included file out of the model build; the INSERT still runs through the post-deployment script.
      fr: |
        Build Remove exclut seulement le fichier inclus de la génération du modèle ; l'instruction INSERT s'exécute toujours via le script de post-déploiement.
references:
  - title: Configure source control and manage reference data
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/03-configure-source-control-manage-reference-data
