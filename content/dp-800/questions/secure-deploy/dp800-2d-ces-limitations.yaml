id: dp800-2d-ces-limitations
objective: "2.4.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans to stream the changes of the dbo.Patients table of an Azure SQL database to Azure Event Hubs by using change event streaming (CES). dbo.Patients has the following characteristics:

    - The table already contains 2 million rows.
    - The Profile column uses the json data type.
    - A row-level security policy limits each clinic's users to the patients of their clinic.
    - A dynamic data masking rule masks the NationalId column for nonprivileged users.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de diffuser les modifications de la table dbo.Patients d'une base de données Azure SQL vers Azure Event Hubs à l'aide du streaming d'événements de modification (CES). dbo.Patients présente les caractéristiques suivantes :

    - La table contient déjà 2 millions de lignes.
    - La colonne Profile utilise le type de données json.
    - Une stratégie de sécurité au niveau des lignes limite les utilisateurs de chaque clinique aux patients de leur clinique.
    - Une règle de masquage dynamique des données masque la colonne NationalId pour les utilisateurs non privilégiés.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The events of dbo.Patients don't contain the Profile column.", fr: "Les événements de dbo.Patients ne contiennent pas la colonne Profile." } }
    - { id: b, text: { en: "The events contain the masked value of NationalId.", fr: "Les événements contiennent la valeur masquée de NationalId." } }
    - { id: c, text: { en: "The existing 2 million rows are sent as an initial snapshot when the table is added to the stream group.", fr: "Les 2 millions de lignes existantes sont envoyées sous forme d'instantané initial quand la table est ajoutée au groupe de flux." } }
    - { id: d, text: { en: "Changes to the rows of every clinic are streamed, whatever the row-level security policy.", fr: "Les modifications des lignes de toutes les cliniques sont diffusées, quelle que soit la stratégie de sécurité au niveau des lignes." } }
    - { id: e, text: { en: "The stream group can reach the event hub through a private endpoint.", fr: "Le groupe de flux peut joindre le hub d'événements par un point de terminaison privé." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      CES skips columns of unsupported data types, and json is one of them (with vector, xml, geography, rowversion and others). Row-level security doesn't filter the stream: CES emits changes from all rows, regardless of user permissions. Plan the event hub's access control accordingly, because the stream contains every clinic's changes.
    fr: |
      CES ignore les colonnes de types de données non pris en charge, et json en fait partie (avec vector, xml, geography, rowversion et d'autres). La sécurité au niveau des lignes ne filtre pas le flux : CES émet les modifications de toutes les lignes, quelles que soient les autorisations des utilisateurs. Prévoyez le contrôle d'accès au hub d'événements en conséquence, car le flux contient les modifications de toutes les cliniques.
  options:
    b: { en: "Dynamic data masking doesn't apply to CES: the data is streamed unmasked.", fr: "Le masquage dynamique des données ne s'applique pas à CES : les données sont diffusées sans masque." }
    c: { en: "CES doesn't stream data that existed before it was enabled; there's no initial snapshot.", fr: "CES ne diffuse pas les données présentes avant son activation ; il n'y a pas d'instantané initial." }
    e: { en: "CES currently supports only public Event Hubs endpoints, not service endpoints or private endpoints.", fr: "CES ne prend actuellement en charge que les points de terminaison publics d'Event Hubs, pas les points de terminaison de service ni les points de terminaison privés." }
references:
