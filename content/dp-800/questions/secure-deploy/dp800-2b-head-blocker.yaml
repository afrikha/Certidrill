id: dp800-2b-head-blocker
objective: "2.2.4"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Users of a database in Azure SQL Database report that order updates hang. You join `sys.dm_exec_sessions` with `sys.dm_exec_requests` and get the following result.

    | session_id | status | blocking_session_id | open_transaction_count | wait_type |
    | --- | --- | --- | --- | --- |
    | 55 | running | 0 | 0 | NULL |
    | 58 | suspended | 72 | 1 | LCK_M_U |
    | 61 | suspended | 58 | 1 | LCK_M_U |
    | 64 | suspended | 58 | 0 | LCK_M_U |
    | 72 | sleeping | 0 | 1 | NULL |

    Which session is the head blocker?
  fr: |
    Les utilisateurs d'une base de données dans Azure SQL Database signalent que les mises à jour de commandes restent bloquées. Vous joignez `sys.dm_exec_sessions` et `sys.dm_exec_requests` et obtenez le résultat suivant.

    | session_id | status | blocking_session_id | open_transaction_count | wait_type |
    | --- | --- | --- | --- | --- |
    | 55 | running | 0 | 0 | NULL |
    | 58 | suspended | 72 | 1 | LCK_M_U |
    | 61 | suspended | 58 | 1 | LCK_M_U |
    | 64 | suspended | 58 | 0 | LCK_M_U |
    | 72 | sleeping | 0 | 1 | NULL |

    Quelle session est le bloqueur principal ?
body:
  options:
    - { id: a, text: "55" }
    - { id: b, text: "58" }
    - { id: c, text: "61" }
    - { id: d, text: "72" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The head blocker is at the root of the chain; it blocks others while it isn't blocked itself (blocking_session_id 0). Sessions 61 and 64 wait for 58, which waits for 72. Session 72 is sleeping with an open transaction, the classic sign of an application that didn't commit or roll back.
    fr: |
      Le bloqueur principal se trouve à la racine de la chaîne ; il bloque d'autres sessions sans être lui-même bloqué (blocking_session_id 0). Les sessions 61 et 64 attendent 58, qui attend 72. La session 72 est en veille avec une transaction ouverte, signe classique d'une application qui n'a ni validé ni annulé.
  options:
    a:
      en: |
        Session 55 isn't blocked, but no session waits for it.
      fr: |
        La session 55 n'est pas bloquée, mais aucune session ne l'attend.
    b:
      en: |
        Session 58 blocks 61 and 64, but it is itself waiting for 72.
      fr: |
        La session 58 bloque 61 et 64, mais elle attend elle-même 72.
    c:
      en: |
        Session 61 is a victim of the chain, waiting for 58.
      fr: |
        La session 61 subit la chaîne : elle attend 58.
references:
  - title: Understand and resolve blocking problems
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking
