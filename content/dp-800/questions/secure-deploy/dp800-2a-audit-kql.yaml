id: dp800-2a-audit-kql
objective: "2.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Server-level auditing for the Azure SQL logical server **sql-contoso** sends audit events to the Log Analytics workspace **law-sec**.

    You need a query that counts the audited events of the **SalesDb** database for each server principal over the last day, from the highest count to the lowest.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'audit au niveau du serveur du serveur logique Azure SQL **sql-contoso** envoie les événements d'audit à l'espace de travail Log Analytics **law-sec**.

    Vous avez besoin d'une requête qui compte les événements audités de la base de données **SalesDb** pour chaque principal de serveur au cours du dernier jour, du plus grand nombre au plus petit.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[tbl]]
    | where Category == "[[cat]]"
    | where database_name_s == "SalesDb"
    | where TimeGenerated > ago(1d)
    | summarize Events = count() by [[col]]
    | order by Events desc
  slots:
    - id: tbl
      options:
        - { id: diag, text: AzureDiagnostics }
        - { id: activity, text: AzureActivity }
        - { id: sqlaudit, text: SQLSecurityAuditEvents }
        - { id: auditlogs, text: AuditLogs }
    - id: cat
      options:
        - { id: security, text: SQLSecurityAuditEvents }
        - { id: devops, text: DevOpsOperationsAudit }
        - { id: admin, text: Administrative }
        - { id: insights, text: SQLInsights }
    - id: col
      options:
        - { id: principal_s, text: server_principal_name_s }
        - { id: principal, text: server_principal_name }
        - { id: caller, text: Caller }
        - { id: ip, text: client_ip_s }
answer:
  values: { tbl: diag, cat: security, col: principal_s }
explanation:
  correct:
    en: |
      Audit events sent to Log Analytics are stored in the AzureDiagnostics table with the SQLSecurityAuditEvents category. In Log Analytics and Event Hubs, each audit field gets a type suffix, so the principal is in the server_principal_name_s column.
    fr: |
      Les événements d'audit envoyés à Log Analytics sont stockés dans la table AzureDiagnostics avec la catégorie SQLSecurityAuditEvents. Dans Log Analytics et Event Hubs, chaque champ d'audit reçoit un suffixe de type : le principal se trouve donc dans la colonne server_principal_name_s.
  options:
    activity: { en: "AzureActivity holds the control-plane operations of the activity log.", fr: "AzureActivity contient les opérations du plan de contrôle du journal d'activité." }
    sqlaudit: { en: "SQLSecurityAuditEvents is the category value, not the table name.", fr: "SQLSecurityAuditEvents est la valeur de catégorie, pas le nom de la table." }
    devops: { en: "DevOpsOperationsAudit is the category of Microsoft support operations auditing.", fr: "DevOpsOperationsAudit est la catégorie de l'audit des opérations du support Microsoft." }
    principal: { en: "server_principal_name without a suffix is the field name in the .xel files written to storage.", fr: "server_principal_name sans suffixe est le nom du champ dans les fichiers .xel écrits dans le stockage." }
references:
  - title: SQL Database audit log format
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/audit-log-format
