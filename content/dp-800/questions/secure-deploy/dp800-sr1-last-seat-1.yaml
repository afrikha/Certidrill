stem:
  en: You enable READ_COMMITTED_SNAPSHOT on TicketDb.
  fr: Vous activez READ_COMMITTED_SNAPSHOT sur TicketDb.
body:
  solution:
    en: |
      You run the following statement and leave the procedure unchanged:

      ```sql
      ALTER DATABASE TicketDb SET READ_COMMITTED_SNAPSHOT ON;
      ```
    fr: |
      Vous exécutez l'instruction suivante et laissez la procédure inchangée :

      ```sql
      ALTER DATABASE TicketDb SET READ_COMMITTED_SNAPSHOT ON;
      ```
answer: { value: false }
explanation:
  correct:
    en: With READ_COMMITTED_SNAPSHOT ON, each SELECT reads the last committed version of the row without taking shared locks, so both sessions can still read one available seat. The isolation level does not change the locks taken by modifications, and each UPDATE writes the value computed from its own earlier read, so both reservations are still inserted. Row versioning changes what readers see; it does not prevent this lost update.
    fr: "Avec READ_COMMITTED_SNAPSHOT à ON, chaque SELECT lit la dernière version validée de la ligne sans prendre de verrous partagés : les deux sessions peuvent toujours lire une place disponible. Le niveau d'isolation ne modifie pas les verrous pris par les modifications, et chaque UPDATE écrit la valeur calculée à partir de sa propre lecture antérieure : les deux réservations sont toujours insérées. Le contrôle de version de ligne change ce que voient les lecteurs ; il n'empêche pas cette mise à jour perdue."
references:
  - title: SET TRANSACTION ISOLATION LEVEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-transaction-isolation-level-transact-sql
