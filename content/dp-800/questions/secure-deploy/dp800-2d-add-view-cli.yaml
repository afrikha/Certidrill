id: dp800-2d-add-view-cli
objective: "2.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind uses the Data API builder (DAB) CLI to maintain its configuration file. You need to expose the dbo.vOrderSummary view, whose rows are identified by the OrderID column, as an entity named OrderSummary. The solution must meet the following requirements:

    - The REST route of the entity is /api/order-summaries.
    - Authenticated users can read the entity.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind utilise l'interface CLI de Data API builder (DAB) pour maintenir son fichier de configuration. Vous devez exposer la vue dbo.vOrderSummary, dont les lignes sont identifiées par la colonne OrderID, sous la forme d'une entité nommée OrderSummary. La solution doit respecter les exigences suivantes :

    - La route REST de l'entité est /api/order-summaries.
    - Les utilisateurs authentifiés peuvent lire l'entité.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    dab add OrderSummary \
      --source dbo.vOrderSummary \
      --source.type [[stype]] \
      [[key]] \
      [[route]] \
      --permissions "authenticated:read"
  slots:
    - id: stype
      options:
        - { id: table, text: table }
        - { id: view, text: view }
        - { id: sproc, text: stored-procedure }
    - id: key
      options:
        - { id: params, text: "--source.params \"OrderID:0\"" }
        - { id: pk, text: "--fields.name OrderID --fields.primary-key true" }
        - { id: include, text: "--fields.include OrderID" }
    - id: route
      options:
        - { id: rest, text: "--rest order-summaries" }
        - { id: graphql, text: "--graphql order-summaries" }
        - { id: methods, text: "--rest.methods order-summaries" }
answer:
  values: { stype: view, key: pk, route: rest }
explanation:
  correct:
    en: |
      A view is added with --source.type view, and DAB can't read a primary key from a view, so the key must be declared: in DAB 2.0, --fields.name with --fields.primary-key true (the older --source.key-fields still exists). --rest accepts false, true or a custom route, so --rest order-summaries publishes the entity at /api/order-summaries.
    fr: |
      Une vue est ajoutée avec --source.type view, et DAB ne peut pas lire de clé primaire dans une vue : la clé doit être déclarée, dans DAB 2.0 avec --fields.name et --fields.primary-key true (l'ancienne option --source.key-fields existe toujours). --rest accepte false, true ou une route personnalisée : --rest order-summaries publie l'entité à l'adresse /api/order-summaries.
  options:
    table: { en: "dbo.vOrderSummary is a view; table is the default type but doesn't match the object.", fr: "dbo.vOrderSummary est une vue ; table est le type par défaut mais ne correspond pas à l'objet." }
    sproc: { en: "stored-procedure entities use the execute action, not read.", fr: "Les entités stored-procedure utilisent l'action execute, pas read." }
    params: { en: "--source.params passes stored procedure parameters; it doesn't declare a key.", fr: "--source.params transmet des paramètres de procédure stockée ; il ne déclare pas de clé." }
    include: { en: "--fields.include restricts the columns of the permission; it doesn't declare a key.", fr: "--fields.include restreint les colonnes de l'autorisation ; il ne déclare pas de clé." }
    graphql: { en: "--graphql sets the GraphQL type names, not the REST route.", fr: "--graphql définit les noms du type GraphQL, pas la route REST." }
    methods: { en: "--rest.methods lists HTTP verbs for stored procedures and is ignored for views.", fr: "--rest.methods liste des verbes HTTP pour les procédures stockées et est ignoré pour les vues." }
references:
  - title: Add entities with the DAB CLI - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/command-line/dab-add
