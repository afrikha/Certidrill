id: dp800-2a-rls-behaviors
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL Database. The **dbo.Claim** table is a system-versioned temporal table whose history table is **dbo.ClaimHistory**.

    You create the following security policy. No other security policy exists.

    ```text
    CREATE SECURITY POLICY Security.ClaimPolicy
        ADD FILTER PREDICATE Security.fn_AgentPredicate(AgentID) ON dbo.Claim
        WITH (STATE = ON);
    ```

    The predicate returns a row when AgentID equals `SESSION_CONTEXT(N'AgentID')`. Agents have SELECT, INSERT and UPDATE on dbo.Claim and SELECT on dbo.ClaimHistory.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database. La table **dbo.Claim** est une table temporelle versionnée par le système dont la table d'historique est **dbo.ClaimHistory**.

    Vous créez la stratégie de sécurité suivante. Aucune autre stratégie de sécurité n'existe.

    ```text
    CREATE SECURITY POLICY Security.ClaimPolicy
        ADD FILTER PREDICATE Security.fn_AgentPredicate(AgentID) ON dbo.Claim
        WITH (STATE = ON);
    ```

    Le prédicat renvoie une ligne lorsqu'AgentID est égal à `SESSION_CONTEXT(N'AgentID')`. Les agents disposent de SELECT, INSERT et UPDATE sur dbo.Claim et de SELECT sur dbo.ClaimHistory.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An UPDATE that targets claims of another agent raises an error.", fr: "Un UPDATE qui cible les réclamations d'un autre agent lève une erreur." } }
    - { id: b, text: { en: "An agent who queries dbo.ClaimHistory can read the history rows of every agent.", fr: "Un agent qui interroge dbo.ClaimHistory peut lire les lignes d'historique de tous les agents." } }
    - { id: c, text: { en: "Members of db_owner see every row of dbo.Claim without any change to the predicate.", fr: "Les membres de db_owner voient toutes les lignes de dbo.Claim sans aucune modification du prédicat." } }
    - { id: d, text: { en: "An agent can insert a claim that has the AgentID of another agent.", fr: "Un agent peut insérer une réclamation qui porte l'AgentID d'un autre agent." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Security policies are not copied to the history table of a temporal table, so dbo.ClaimHistory needs its own predicate. The policy contains only a filter predicate, which does not check inserted rows; an AFTER INSERT block predicate would be needed to stop inserts for another agent.
    fr: |
      Les stratégies de sécurité ne sont pas copiées sur la table d'historique d'une table temporelle : dbo.ClaimHistory a besoin de son propre prédicat. La stratégie ne contient qu'un prédicat de filtre, qui ne vérifie pas les lignes insérées ; un prédicat de blocage AFTER INSERT serait nécessaire pour empêcher les insertions pour un autre agent.
  options:
    a: { en: "A filter predicate silently excludes the rows; the UPDATE affects zero rows without an error.", fr: "Un prédicat de filtre exclut les lignes sans erreur : l'UPDATE n'affecte aucune ligne et ne lève pas d'erreur." }
    c: { en: "RLS applies to every user, including dbo and db_owner members, unless the predicate allows them.", fr: "RLS s'applique à tous les utilisateurs, y compris dbo et les membres de db_owner, sauf si le prédicat les autorise." }
references:
  - title: Row-level security
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
