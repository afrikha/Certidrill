id: dp800-2b-qs-reports-map
objective: "2.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Query Store on a database in Azure SQL Database. You use the built-in Query Store reports of SQL Server Management Studio (SSMS) to investigate several issues.

    Which report should you open for each investigation? To answer, drag the appropriate reports to the correct investigations. Each report may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise le Magasin des requêtes sur une base de données dans Azure SQL Database. Vous utilisez les rapports intégrés du Magasin des requêtes de SQL Server Management Studio (SSMS) pour examiner plusieurs problèmes.

    Quel rapport devez-vous ouvrir pour chaque examen ? Pour répondre, faites glisser les rapports appropriés vers les examens correspondants. Chaque rapport peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: regressed, text: Regressed Queries }
    - { id: variation, text: Queries With High Variation }
    - { id: waits, text: Query Wait Statistics }
    - { id: forced, text: Queries With Forced Plans }
    - { id: top, text: Top Resource Consuming Queries }
    - { id: overall, text: Overall Resource Consumption }
  targets:
    - id: t1
      text:
        en: |
          Find the queries whose duration got worse after yesterday's deployment.
        fr: |
          Trouver les requêtes dont la durée s'est dégradée après le déploiement d'hier.
    - id: t2
      text:
        en: |
          Find the queries whose CPU time changes widely from one execution to the next.
        fr: |
          Trouver les requêtes dont le temps processeur varie fortement d'une exécution à l'autre.
    - id: t3
      text:
        en: |
          Find which wait categories dominate and the queries that contribute to them.
        fr: |
          Trouver les catégories d'attente dominantes et les requêtes qui y contribuent.
    - id: t4
      text:
        en: |
          List the plans that a colleague forced last month.
        fr: |
          Lister les plans qu'un collègue a forcés le mois dernier.
answer:
  mapping: { t1: regressed, t2: variation, t3: waits, t4: forced }
explanation:
  correct:
    en: |
      Regressed Queries shows queries whose metrics recently got worse. Queries With High Variation shows queries with widely varying duration, CPU, I/O or memory, a common sign of parameter sensitivity. Query Wait Statistics shows the active wait categories and the queries behind them. Queries With Forced Plans lists the plans currently forced.
    fr: |
      Regressed Queries affiche les requêtes dont les métriques se sont récemment dégradées. Queries With High Variation affiche les requêtes dont la durée, le processeur, les E/S ou la mémoire varient fortement, signe fréquent de sensibilité aux paramètres. Query Wait Statistics affiche les catégories d'attente actives et les requêtes associées. Queries With Forced Plans liste les plans actuellement forcés.
  options:
    top:
      en: |
        Top Resource Consuming Queries ranks the biggest consumers in a period; it doesn't compare before and after or show variation.
      fr: |
        Top Resource Consuming Queries classe les plus gros consommateurs d'une période ; il ne compare pas avant et après et ne montre pas la variation.
    overall:
      en: |
        Overall Resource Consumption shows totals for the whole database, not individual queries.
      fr: |
        Overall Resource Consumption affiche des totaux pour toute la base, pas des requêtes individuelles.
references:
  - title: Best practices for monitoring workloads with Query Store
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/best-practice-with-the-query-store
