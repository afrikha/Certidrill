id: dp800-2d-ces-setup-order
objective: "2.4.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso wants to stream the inserts, updates and deletes of the dbo.Orders table of an Azure SQL database named SalesDb to an Azure Event Hubs instance by using change event streaming (CES). SalesDb uses the full recovery model, and sys.sp_enable_event_stream has already run in SalesDb. The managed identity of the logical server is allowed to send events to the event hub. SalesDb has no database master key.

    Which four actions should you perform in sequence in SalesDb? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso veut diffuser les insertions, mises à jour et suppressions de la table dbo.Orders d'une base de données Azure SQL nommée SalesDb vers une instance Azure Event Hubs à l'aide du streaming d'événements de modification (CES). SalesDb utilise le mode de récupération complet, et sys.sp_enable_event_stream a déjà été exécuté dans SalesDb. L'identité managée du serveur logique est autorisée à envoyer des événements au hub d'événements. SalesDb n'a pas de clé principale de base de données.

    Quelles sont les quatre actions à effectuer dans l'ordre dans SalesDb ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: mk, text: { en: "Run CREATE MASTER KEY ENCRYPTION BY PASSWORD.", fr: "Exécuter CREATE MASTER KEY ENCRYPTION BY PASSWORD." } }
    - { id: cred, text: { en: "Run CREATE DATABASE SCOPED CREDENTIAL with IDENTITY = 'Managed Identity'.", fr: "Exécuter CREATE DATABASE SCOPED CREDENTIAL avec IDENTITY = 'Managed Identity'." } }
    - { id: group, text: { en: "Run sys.sp_create_event_stream_group with the destination type AzureEventHubs, the event hub location and the credential.", fr: "Exécuter sys.sp_create_event_stream_group avec le type de destination AzureEventHubs, l'emplacement du hub d'événements et les informations d'identification." } }
    - { id: add, text: { en: "Run sys.sp_add_object_to_event_stream_group for dbo.Orders.", fr: "Exécuter sys.sp_add_object_to_event_stream_group pour dbo.Orders." } }
    - { id: cdc, text: { en: "Run sys.sp_cdc_enable_table for dbo.Orders.", fr: "Exécuter sys.sp_cdc_enable_table pour dbo.Orders." } }
    - { id: ct, text: { en: "Run ALTER TABLE dbo.Orders ENABLE CHANGE_TRACKING.", fr: "Exécuter ALTER TABLE dbo.Orders ENABLE CHANGE_TRACKING." } }
    - { id: pe, text: { en: "Create a private endpoint for the Event Hubs namespace and reference it in the stream group.", fr: "Créer un point de terminaison privé pour l'espace de noms Event Hubs et le référencer dans le groupe de flux." } }
answer:
  sequence: [ mk, cred, group, add ]
explanation:
  correct:
    en: |
      A database scoped credential needs a database master key, so the master key comes first, then the credential that uses the managed identity. sys.sp_create_event_stream_group defines the destination (AzureEventHubs is the only destination type for Azure SQL Database), its location and the credential. Tables are then added to the stream group with sys.sp_add_object_to_event_stream_group.
    fr: |
      Des informations d'identification délimitées à la base de données nécessitent une clé principale de base de données : la clé principale vient en premier, puis les informations d'identification qui utilisent l'identité managée. sys.sp_create_event_stream_group définit la destination (AzureEventHubs est le seul type de destination pour Azure SQL Database), son emplacement et les informations d'identification. Les tables sont ensuite ajoutées au groupe de flux avec sys.sp_add_object_to_event_stream_group.
  options:
    cdc: { en: "CES isn't supported on databases configured with change data capture, and it doesn't need it.", fr: "CES n'est pas pris en charge sur les bases de données configurées avec la capture des données modifiées, et il n'en a pas besoin." }
    ct: { en: "CES reads the transaction log; change tracking isn't required.", fr: "CES lit le journal des transactions ; le suivi des modifications n'est pas nécessaire." }
    pe: { en: "CES can currently stream only to public Event Hubs endpoints; private endpoints aren't supported.", fr: "CES ne peut actuellement diffuser que vers des points de terminaison publics d'Event Hubs ; les points de terminaison privés ne sont pas pris en charge." }
references:
  - title: Configure Change Event Streaming to Azure Event Hubs - SQL Server
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/change-event-streaming/configure
