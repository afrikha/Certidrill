id: dp800-cs2b-merge-controls
objective: "2.3.9"
type: dropdown
caseStudy: dp800-cs2b-munsons-pickles
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the GitHub repository. The solution must meet the source control requirements.

    What should you configure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer le dépôt GitHub. La solution doit satisfaire les exigences de contrôle de code source.

    Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Requirement 8: [[build]]

      Requirement 9: [[review]]
    fr: |
      Exigence 8 : [[build]]

      Exigence 9 : [[review]]
  slots:
    - id: build
      options:
        - id: prcheck
          text:
            en: A workflow triggered by pull_request events on main that runs dotnet build, required as a status check by a branch protection rule on main
            fr: Un workflow déclenché par les événements pull_request sur main qui exécute dotnet build, exigé comme vérification d'état par une règle de protection de branche sur main
        - id: pushbuild
          text:
            en: A workflow triggered by push events on main that runs dotnet build, with a notification to the DBA leads when the build fails
            fr: Un workflow déclenché par les événements push sur main qui exécute dotnet build, avec une notification aux responsables DBA en cas d'échec de la génération
        - id: concurrency
          text:
            en: A workflow triggered by pull_request events on main that runs dotnet build in a concurrency group, without a branch protection rule
            fr: Un workflow déclenché par les événements pull_request sur main qui exécute dotnet build dans un groupe concurrency, sans règle de protection de branche
    - id: review
      options:
        - id: codeowners
          text:
            en: The entry /SupplyDb/ @munsons/dba-leads in .github/CODEOWNERS, with Require review from Code Owners enabled in the branch protection rule on main
            fr: L'entrée /SupplyDb/ @munsons/dba-leads dans .github/CODEOWNERS, avec l'option Require review from Code Owners activée dans la règle de protection de branche sur main
        - id: codeownersonly
          text:
            en: The entry /SupplyDb/ @munsons/dba-leads in .github/CODEOWNERS, with a branch protection rule on main that requires one approving review
            fr: L'entrée /SupplyDb/ @munsons/dba-leads dans .github/CODEOWNERS, avec une règle de protection de branche sur main qui exige une approbation
        - id: envreviewers
          text:
            en: A GitHub environment whose required reviewers are munsons/dba-leads, referenced by the job that runs dotnet build on pull requests
            fr: Un environnement GitHub dont les réviseurs requis sont munsons/dba-leads, référencé par le travail qui exécute dotnet build sur les demandes de tirage
answer:
  values: { build: prcheck, review: codeowners }
explanation:
  correct:
    en: |
      A workflow that runs on pull_request events builds the proposed changes before the merge, and making it a required status check in a branch protection rule blocks the merge until the build succeeds. A CODEOWNERS entry automatically requests a review from the team that owns the files, but the review becomes mandatory only when the branch protection rule requires review from Code Owners.
    fr: |
      Un workflow exécuté sur les événements pull_request génère les modifications proposées avant la fusion, et en faire une vérification d'état obligatoire dans une règle de protection de branche bloque la fusion tant que la génération n'a pas réussi. Une entrée CODEOWNERS demande automatiquement la révision de l'équipe propriétaire des fichiers, mais cette révision ne devient obligatoire que si la règle de protection de branche exige la révision des propriétaires du code.
  options:
    pushbuild: { en: "A push build on main runs after the merge, so a broken change already reaches main.", fr: "Une génération sur push dans main s'exécute après la fusion : une modification défectueuse atteint déjà main." }
    concurrency: { en: "Without a branch protection rule that requires the status check, a failed build does not block the merge; concurrency only limits parallel runs.", fr: "Sans règle de protection de branche qui exige la vérification d'état, un échec de génération ne bloque pas la fusion ; concurrency limite seulement les exécutions parallèles." }
    codeownersonly: { en: "One approving review from any reviewer with write access is enough to merge; the code owners' review is requested but not required unless the rule requires review from Code Owners.", fr: "Une approbation de n'importe quel réviseur disposant d'un accès en écriture suffit pour fusionner ; la révision des propriétaires du code est demandée mais pas obligatoire, sauf si la règle exige la révision des propriétaires du code." }
    envreviewers: { en: "Environment required reviewers approve the start of jobs that reference the environment; approving the build job is not a review of the pull request and does not block its merge.", fr: "Les réviseurs requis d'un environnement approuvent le démarrage des travaux qui référencent l'environnement ; approuver le travail de génération n'est pas une révision de la demande de tirage et ne bloque pas sa fusion." }
references:
  - title: Implement CI/CD pipelines
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/06-implement-cicd-pipelines
  - title: Manage branching, pull requests, and conflict resolution
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/04-manage-branching-pull-requests-conflict-resolution
