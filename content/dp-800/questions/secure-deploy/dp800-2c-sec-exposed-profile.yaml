id: dp800-2c-sec-exposed-profile
objective: "2.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum deploys an SDK-style SQL database project to an Azure SQL database. During a review, you discover that the publish profile **Prod.publish.xml**, committed to the repository six months ago, contains a connection string with the user name and password of the SQL login **deploy_sql**. The pipeline passes this profile to SqlPackage.

    You need to remediate the exposure and ensure that future deployments do not depend on a password stored anywhere.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie un projet de base de données SQL de style SDK sur une base de données Azure SQL. Lors d'une révision, vous découvrez que le profil de publication **Prod.publish.xml**, validé dans le dépôt il y a six mois, contient une chaîne de connexion avec le nom d'utilisateur et le mot de passe de la connexion SQL **deploy_sql**. Le pipeline transmet ce profil à SqlPackage.

    Vous devez corriger cette exposition et faire en sorte que les déploiements futurs ne dépendent d'aucun mot de passe stocké où que ce soit.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the password of deploy_sql or disable the login.", fr: "Modifier le mot de passe de deploy_sql ou désactiver la connexion." } }
    - { id: b, text: { en: "Remove the connection string from the profile, and connect with the Microsoft Entra identity of the pipeline.", fr: "Supprimer la chaîne de connexion du profil, et se connecter avec l'identité Microsoft Entra du pipeline." } }
    - { id: c, text: { en: "Rename the profile Prod.publish.xml.user so that .gitignore excludes it from now on.", fr: "Renommer le profil Prod.publish.xml.user pour que .gitignore l'exclue désormais." } }
    - { id: d, text: { en: "Move the password to the DefaultValue of a SQLCMD variable in the .sqlproj file.", fr: "Déplacer le mot de passe dans la DefaultValue d'une variable SQLCMD du fichier .sqlproj." } }
    - { id: e, text: { en: "Store the full connection string in a pipeline secret variable.", fr: "Stocker la chaîne de connexion complète dans une variable secrète du pipeline." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The password stays in the Git history, so the exposed credential must be invalidated by changing it or disabling the login. Using the Microsoft Entra identity of the pipeline (a service connection or OpenID Connect sign-in) removes the need for any stored password in the profile or the pipeline.
    fr: |
      Le mot de passe reste dans l'historique Git : les informations d'identification exposées doivent être invalidées en modifiant le mot de passe ou en désactivant la connexion. Utiliser l'identité Microsoft Entra du pipeline (connexion de service ou connexion OpenID Connect) supprime tout besoin de mot de passe stocké dans le profil ou le pipeline.
  options:
    c:
      en: |
        The file and the password remain in the commit history, and the deployment would still rely on a password.
      fr: |
        Le fichier et le mot de passe restent dans l'historique des validations, et le déploiement dépendrait toujours d'un mot de passe.
    d:
      en: |
        The .sqlproj file is committed too, so the password would still be in the repository.
      fr: |
        Le fichier .sqlproj est lui aussi validé : le mot de passe resterait dans le dépôt.
    e:
      en: |
        A secret variable hides the value, but the deployment would still depend on a stored password.
      fr: |
        Une variable secrète masque la valeur, mais le déploiement dépendrait toujours d'un mot de passe stocké.
references:
