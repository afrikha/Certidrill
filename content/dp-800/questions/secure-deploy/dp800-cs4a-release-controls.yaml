id: dp800-cs4a-release-controls
objective: "2.3.9"
type: dragdrop
caseStudy: dp800-cs4a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to configure Azure Repos and Azure Pipelines to meet the release requirements.

    Which control should you configure for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all. You may need to drag the split bar between panes or scroll to view content.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer Azure Repos et Azure Pipelines pour satisfaire les exigences de mise en production.

    Quel contrôle devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout. Vous devrez peut-être faire glisser la barre de fractionnement entre les volets ou faire défiler l'affichage pour voir le contenu.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: reviewers
      text: { en: "Branch policy on main: Automatically included reviewers, required, path filter /LearningDb/*", fr: "Stratégie de branche sur main : Automatically included reviewers, obligatoire, filtre de chemin /LearningDb/*" }
    - id: minimum
      text: { en: "Branch policy on main: Require a minimum number of reviewers", fr: "Stratégie de branche sur main : Require a minimum number of reviewers" }
    - id: build
      text: { en: "Branch policy on main: Build validation", fr: "Stratégie de branche sur main : Build validation" }
    - id: approvals
      text: { en: "Approvals check on the production environment", fr: "Vérification Approvals sur l'environnement production" }
    - id: branchcontrol
      text: { en: "Branch control check on sc-learningdb-prod", fr: "Vérification Branch control sur sc-learningdb-prod" }
    - id: condition
      text: { en: "condition on the deployment stage in the pipeline YAML file", fr: "condition sur la phase de déploiement dans le fichier YAML du pipeline" }
  targets:
    - id: t9
      text: { en: "Requirement 9: DBA approval for /LearningDb/ changes", fr: "Exigence 9 : approbation d'un DBA pour les modifications de /LearningDb/" }
    - id: t10
      text: { en: "Requirement 10: successful build before completion", fr: "Exigence 10 : génération réussie avant la fin de la pull request" }
    - id: t11
      text: { en: "Requirement 11: release manager sign-off", fr: "Exigence 11 : validation du responsable des mises en production" }
    - id: t12
      text: { en: "Requirement 12: service connection limited to main", fr: "Exigence 12 : connexion de service limitée à main" }
answer:
  mapping: { t9: reviewers, t10: build, t11: approvals, t12: branchcontrol }
explanation:
  correct:
    en: |
      Automatically included reviewers set to Required with a path filter adds the DBA group to every pull request that touches the project folder and blocks completion until a member approves. Build validation requires a successful pipeline run before a pull request can complete. Approvals on the environment pause the deployment job until an approver signs off, and a Branch control check on the service connection rejects runs whose branch isn't refs/heads/main; checks are defined on the resource, so editing the YAML can't remove them.
    fr: |
      Automatically included reviewers défini sur Obligatoire avec un filtre de chemin ajoute le groupe DBA à chaque pull request qui touche le dossier du projet et bloque la fin de la pull request jusqu'à l'approbation d'un membre. Build validation exige une exécution de pipeline réussie avant qu'une pull request puisse être terminée. Les approbations sur l'environnement mettent en pause le travail de déploiement jusqu'à la validation d'un approbateur, et une vérification Branch control sur la connexion de service rejette les exécutions dont la branche n'est pas refs/heads/main ; les vérifications sont définies sur la ressource : modifier le YAML ne peut pas les supprimer.
  options:
    minimum: { en: "A minimum number of reviewers accepts approvals from anyone; it doesn't require a member of the DBA group or depend on the files changed.", fr: "Un nombre minimal de réviseurs accepte les approbations de n'importe qui ; il n'exige pas un membre du groupe DBA et ne dépend pas des fichiers modifiés." }
    condition: { en: "A condition is part of the YAML file, so anyone who edits the pipeline can change or remove it.", fr: "Une condition fait partie du fichier YAML : toute personne qui modifie le pipeline peut la changer ou la supprimer." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
