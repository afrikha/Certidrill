id: dp800-2b-test-levels-map
objective: "2.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove is designing a testing strategy for a SQL database project that is deployed by a CI/CD pipeline. You need to choose the test level for each verification.

    Which test level should you use for each verification? To answer, drag the appropriate test levels to the correct verifications. Each test level may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove conçoit une stratégie de test pour un projet de base de données SQL déployé par un pipeline CI/CD. Vous devez choisir le niveau de test de chaque vérification.

    Quel niveau de test devez-vous utiliser pour chaque vérification ? Pour répondre, faites glisser les niveaux de test appropriés vers les vérifications correspondantes. Chaque niveau de test peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: build, text: { en: "Build validation", fr: "Validation de build" } }
    - { id: unit, text: { en: "Unit test", fr: "Test unitaire" } }
    - { id: integ, text: { en: "Integration test", fr: "Test d'intégration" } }
    - { id: drift, text: { en: "Schema drift report", fr: "Rapport de dérive de schéma" } }
  targets:
    - id: t1
      text:
        en: |
          The function dbo.GetLoyaltyDiscount returns 15 for a Gold customer.
        fr: |
          La fonction dbo.GetLoyaltyDiscount renvoie 15 pour un client Gold.
    - id: t2
      text:
        en: |
          No stored procedure references a column that a pull request renames.
        fr: |
          Aucune procédure stockée ne référence une colonne renommée par une pull request.
    - id: t3
      text:
        en: |
          Placing an order through the order API updates Orders, Stock and AuditLog in the deployed database.
        fr: |
          Passer une commande via l'API de commande met à jour Orders, Stock et AuditLog dans la base déployée.
    - id: t4
      text:
        en: |
          dbo.AddOrderLine raises an error when the quantity is negative.
        fr: |
          dbo.AddOrderLine lève une erreur lorsque la quantité est négative.
answer:
  mapping: { t1: unit, t2: build, t3: integ, t4: unit }
explanation:
  correct:
    en: |
      A unit test checks that one procedure or function returns the right result for given inputs, and a negative unit test checks that it raises the expected error for invalid input. Build validation catches syntax errors and broken object references without a database. An integration test exercises an end-to-end scenario, here the application and several tables, against a deployed database.
    fr: |
      Un test unitaire vérifie qu'une procédure ou une fonction renvoie le bon résultat pour des entrées données, et un test unitaire négatif vérifie qu'elle lève l'erreur attendue pour une entrée non valide. La validation de build détecte les erreurs de syntaxe et les références d'objets rompues sans base de données. Un test d'intégration exerce un scénario de bout en bout, ici l'application et plusieurs tables, sur une base déployée.
  options:
    drift:
      en: |
        A drift report finds changes made directly in a target database; it doesn't test code behavior.
      fr: |
        Un rapport de dérive détecte les modifications faites directement dans une base cible ; il ne teste pas le comportement du code.
references:
  - title: Design and implement a testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/07-design-implement-testing-strategy
