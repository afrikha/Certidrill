id: dp800-2d-pool-diagnostics
objective: "2.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware hosts 20 tenant databases in an Azure SQL Database elastic pool named ep-tenants. Data API builder (DAB) serves each tenant database. You created a diagnostic setting on ep-tenants that sends Basic metrics to a Log Analytics workspace.

    The workspace shows the pool metrics, but no Errors, Timeouts or Deadlocks records for any tenant database.

    You need these log categories in the workspace for every tenant database.

    What should you do?
  fr: |
    Litware héberge 20 bases de données de locataires dans un pool élastique Azure SQL Database nommé ep-tenants. Data API builder (DAB) sert chaque base de données de locataire. Vous avez créé sur ep-tenants un paramètre de diagnostic qui envoie les métriques Basic vers un espace de travail Log Analytics.

    L'espace de travail affiche les métriques du pool, mais aucun enregistrement Errors, Timeouts ou Deadlocks pour aucune base de données de locataire.

    Vous avez besoin de ces catégories de journaux dans l'espace de travail pour chaque base de données de locataire.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the Errors, Timeouts and Deadlocks categories to the diagnostic setting of ep-tenants.", fr: "Ajouter les catégories Errors, Timeouts et Deadlocks au paramètre de diagnostic d'ep-tenants." } }
    - { id: b, text: { en: "Create a diagnostic setting with these categories on each of the 20 tenant databases.", fr: "Créer un paramètre de diagnostic avec ces catégories sur chacune des 20 bases de données de locataires." } }
    - { id: c, text: { en: "Enable auditing on the logical server and send the audit logs to the workspace.", fr: "Activer l'audit sur le serveur logique et envoyer les journaux d'audit vers l'espace de travail." } }
    - { id: d, text: { en: "Add Application Insights to the DAB configuration of each tenant.", fr: "Ajouter Application Insights à la configuration DAB de chaque locataire." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An elastic pool is a separate resource whose diagnostic setting offers Basic metrics only. Database log categories such as Errors, Timeouts and Deadlocks are configured on each database: besides the pool, every pooled database needs its own diagnostic setting.
    fr: |
      Un pool élastique est une ressource distincte dont le paramètre de diagnostic ne propose que les métriques Basic. Les catégories de journaux de base de données comme Errors, Timeouts et Deadlocks se configurent sur chaque base de données : en plus du pool, chaque base de données du pool a besoin de son propre paramètre de diagnostic.
  options:
    a: { en: "The pool's diagnostic setting has only Basic metrics; database log categories aren't available there.", fr: "Le paramètre de diagnostic du pool ne propose que les métriques Basic ; les catégories de journaux de base de données n'y sont pas disponibles." }
    c: { en: "Auditing records database events and queries for compliance; it doesn't produce the Errors, Timeouts and Deadlocks categories.", fr: "L'audit enregistre les événements et les requêtes de base de données à des fins de conformité ; il ne produit pas les catégories Errors, Timeouts et Deadlocks." }
    d: { en: "Application Insights collects API telemetry from DAB, not the diagnostic logs of the databases.", fr: "Application Insights collecte la télémétrie d'API de DAB, pas les journaux de diagnostic des bases de données." }
references:
  - title: Configure Streaming Export of Metrics and Resource Logs - Azure SQL Database & Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/metrics-diagnostic-telemetry-logging-streaming-export-configure
