id: dp800-2c-drift-scmp-contents
objective: "2.3.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum checks a SQL database project named **HRDb** for drift every week by running the same schema comparison in Visual Studio Code. You save the comparison as **HRDb-prod.scmp** and commit it to the repository so that other developers can run it again.

    Which two items does the .scmp file store?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum vérifie chaque semaine la dérive d'un projet de base de données SQL nommé **HRDb** en exécutant la même comparaison de schémas dans Visual Studio Code. Vous enregistrez la comparaison sous le nom **HRDb-prod.scmp** et la validez dans le dépôt pour que d'autres développeurs puissent la relancer.

    Quels sont les deux éléments stockés dans le fichier .scmp ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The connection information of the source and the target", fr: "Les informations de connexion de la source et de la cible" } }
    - { id: b, text: { en: "The comparison options, such as Ignore whitespace", fr: "Les options de comparaison, comme Ignore whitespace" } }
    - { id: c, text: { en: "The differences found by the last comparison", fr: "Les différences trouvées par la dernière comparaison" } }
    - { id: d, text: { en: "The update script generated for the target database", fr: "Le script de mise à jour généré pour la base de données cible" } }
    - { id: e, text: { en: "A .dacpac snapshot of the source schema", fr: "Une capture .dacpac du schéma source" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      An .scmp file is an XML definition of the comparison: source and target connection information, comparison options and excluded object types. Opening it reruns the comparison against the current schemas, so it doesn't keep results, scripts or schema snapshots.
    fr: |
      Un fichier .scmp est une définition XML de la comparaison : informations de connexion de la source et de la cible, options de comparaison et types d'objets exclus. L'ouvrir relance la comparaison sur les schémas actuels : il ne conserve ni résultats, ni scripts, ni captures de schéma.
  options:
    c: { en: "Results are computed each time the comparison runs; the file holds its definition only.", fr: "Les résultats sont calculés à chaque exécution de la comparaison ; le fichier n'en contient que la définition." }
    d: { en: "A generated script opens in the query editor; it is not saved in the .scmp file.", fr: "Un script généré s'ouvre dans l'éditeur de requêtes ; il n'est pas enregistré dans le fichier .scmp." }
    e: { en: "The file references the source; it does not contain a copy of its schema.", fr: "Le fichier référence la source ; il ne contient pas de copie de son schéma." }
references:
  - title: Schema comparison overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/schema-comparison
