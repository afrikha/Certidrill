id: dp800-sr2-pwdless-2
objective: "2.1.5"
type: series_yesno
series: dp800-sr2-passwordless-app
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You move the SQL authentication password to Azure Key Vault and use a Key Vault reference.
  fr: Vous déplacez le mot de passe de l'authentification SQL dans Azure Key Vault et utilisez une référence Key Vault.
body:
  solution:
    en: |
      You store the connection string of the SQL authentication login as a secret in an Azure key vault. You enable the system-assigned managed identity of adatum-orders, grant it the **Key Vault Secrets User** role on the vault, and replace the app setting value with a Key Vault reference to the secret.
    fr: |
      Vous stockez la chaîne de connexion de la connexion d'authentification SQL comme secret dans un coffre de clés Azure. Vous activez l'identité managée affectée par le système d'adatum-orders, lui attribuez le rôle **Key Vault Secrets User** sur le coffre et remplacez la valeur du paramètre d'application par une référence Key Vault au secret.
answer: { value: false }
explanation:
  correct:
    en: A Key Vault reference removes the password from the app settings, but the password still exists as a secret in Azure Key Vault, which the requirements forbid. The app still authenticates to OrdersDb with SQL authentication. A passwordless connection uses Microsoft Entra authentication with the managed identity of the app.
    fr: "Une référence Key Vault retire le mot de passe des paramètres de l'application, mais le mot de passe existe toujours comme secret dans Azure Key Vault, ce que les exigences interdisent. L'application s'authentifie toujours auprès d'OrdersDb avec l'authentification SQL. Une connexion sans mot de passe utilise l'authentification Microsoft Entra avec l'identité managée de l'application."
references:
  - title: "Tutorial: Use managed identity to connect an Azure web app to an Azure SQL database without secrets"
    url: https://learn.microsoft.com/en-us/azure/app-service/tutorial-connect-msi-sql-database
