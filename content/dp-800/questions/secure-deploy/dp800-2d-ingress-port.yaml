id: dp800-2d-ingress-port
objective: "2.4.5"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Adatum built a custom image from mcr.microsoft.com/azure-databases/data-api-builder that contains its Data API builder (DAB) configuration file. You are creating an Azure container app from this image, with HTTP ingress that accepts traffic from anywhere. The configuration doesn't change the default listening port of DAB.

    Which target port should you configure for the ingress?
  fr: |
    Adatum a créé une image personnalisée à partir de mcr.microsoft.com/azure-databases/data-api-builder qui contient son fichier de configuration Data API builder (DAB). Vous créez une application conteneur Azure à partir de cette image, avec une entrée HTTP qui accepte le trafic de partout. La configuration ne modifie pas le port d'écoute par défaut de DAB.

    Quel port cible devez-vous configurer pour l'entrée ?
body:
  options:
    - { id: p80, text: "80" }
    - { id: p443, text: "443" }
    - { id: p1433, text: "1433" }
    - { id: p5000, text: "5000" }
answer: { optionId: p5000 }
explanation:
  correct:
    en: |
      The DAB container listens on port 5000, so the Container Apps ingress uses HTTP with target port 5000. The ingress itself exposes the application URL over HTTPS to clients; opening that URL returns the DAB health status.
    fr: |
      Le conteneur DAB écoute sur le port 5000 : l'entrée Container Apps utilise HTTP avec le port cible 5000. L'entrée expose elle-même l'URL de l'application en HTTPS aux clients ; l'ouverture de cette URL renvoie l'état d'intégrité de DAB.
  options:
    p80: { en: "The container doesn't listen on port 80.", fr: "Le conteneur n'écoute pas sur le port 80." }
    p443: { en: "443 is the external HTTPS port of the ingress, not the port the container listens on.", fr: "443 est le port HTTPS externe de l'entrée, pas le port d'écoute du conteneur." }
    p1433: { en: "1433 is the SQL port DAB uses to reach the database, not the port of the API.", fr: "1433 est le port SQL que DAB utilise pour joindre la base de données, pas le port de l'API." }
references:
  - title: Deploy to Azure Container Apps - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/deployment/how-to-publish-container-apps
