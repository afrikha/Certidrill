id: dp800-2c-sc-fabric-update
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a SQL database in Microsoft Fabric named **LoyaltyDb**. Its workspace is connected to the **dev** branch of an Azure DevOps repository.

    A developer clones the repository, adds the file **LoyaltyDb.SQLDatabase/dbo/Tables/Reward.sql**, builds the project in Visual Studio Code without errors, and pushes the commit to the dev branch. The Reward table does not appear in LoyaltyDb.

    You need to create the Reward table in LoyaltyDb from the repository.

    What should you do?
  fr: |
    Fabrikam dispose d'une base de données SQL dans Microsoft Fabric nommée **LoyaltyDb**. Son espace de travail est connecté à la branche **dev** d'un dépôt Azure DevOps.

    Un développeur clone le dépôt, ajoute le fichier **LoyaltyDb.SQLDatabase/dbo/Tables/Reward.sql**, génère le projet dans Visual Studio Code sans erreur et pousse la validation vers la branche dev. La table Reward n'apparaît pas dans LoyaltyDb.

    Vous devez créer la table Reward dans LoyaltyDb à partir du dépôt.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the workspace, select Commit in the Source control pane.", fr: "Dans l'espace de travail, sélectionner Commit dans le volet Contrôle de code source." } }
    - { id: b, text: { en: "In the workspace, select Update in the Source control pane.", fr: "Dans l'espace de travail, sélectionner Update dans le volet Contrôle de code source." } }
    - { id: c, text: { en: "Add a Build Include item for Reward.sql to the SQL project file that Fabric generated.", fr: "Ajouter un élément Build Include pour Reward.sql au fichier de projet SQL généré par Fabric." } }
    - { id: d, text: { en: "Publish the .dacpac file with SqlPackage and /p:AllowIncompatiblePlatform=true.", fr: "Publier le fichier .dacpac avec SqlPackage et /p:AllowIncompatiblePlatform=true." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Pushing to the branch changes only the repository. Update in the Source control pane validates the code in the branch and applies a differential change to the database, which creates the Reward table in LoyaltyDb.
    fr: |
      Pousser vers la branche ne modifie que le dépôt. Update dans le volet Contrôle de code source valide le code de la branche et applique une modification différentielle à la base de données, ce qui crée la table Reward dans LoyaltyDb.
  options:
    a:
      en: |
        Commit works in the other direction: it reads the object definitions from the database and writes them to the repository.
      fr: |
        Commit fonctionne dans l'autre sens : il lit les définitions d'objets de la base de données et les écrit dans le dépôt.
    c:
      en: |
        Fabric maintains the SQL project file and overwrites manual edits; the .sql file is already part of the project.
      fr: |
        Fabric gère le fichier de projet SQL et écrase les modifications manuelles ; le fichier .sql fait déjà partie du projet.
    d:
      en: |
        The project already targets SQL database in Fabric, and a manual publish bypasses the workspace's Git integration.
      fr: |
        Le projet cible déjà la base de données SQL dans Fabric, et une publication manuelle contourne l'intégration Git de l'espace de travail.
references:
  - title: SQL database source control integration in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/sql/source-control
