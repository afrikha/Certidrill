id: dp800-2b-serializable-booking
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a room booking application. A stored procedure runs the following steps in one transaction:

    1. A `SELECT` checks that no row in `dbo.Booking` overlaps the requested room and time range.
    2. If no row is found, an `INSERT` adds the booking.

    Two users sometimes book the same room for overlapping times. You need to prevent another transaction from inserting an overlapping booking between the check and the insert. The table design can't be changed.

    Which isolation level should the procedure use?
  fr: |
    Adatum dispose d'une application de réservation de salles. Une procédure stockée exécute les étapes suivantes dans une seule transaction :

    1. Une instruction `SELECT` vérifie qu'aucune ligne de `dbo.Booking` ne chevauche la salle et la plage horaire demandées.
    2. Si aucune ligne n'est trouvée, une instruction `INSERT` ajoute la réservation.

    Deux utilisateurs réservent parfois la même salle sur des plages qui se chevauchent. Vous devez empêcher une autre transaction d'insérer une réservation qui se chevauche entre la vérification et l'insertion. La conception de la table ne peut pas être modifiée.

    Quel niveau d'isolation la procédure doit-elle utiliser ?
body:
  options:
    - id: a
      text: REPEATABLE READ
    - id: b
      text: SNAPSHOT
    - id: c
      text: SERIALIZABLE
    - id: d
      text: READ UNCOMMITTED
answer: { optionId: c }
explanation:
  correct:
    en: |
      The problem is a phantom, a new row that matches a predicate already evaluated. SERIALIZABLE holds range locks on the rows and key ranges read by the SELECT until the end of the transaction, so another transaction can't insert a row in that range before the booking is committed.
    fr: |
      Le problème est un fantôme, c'est-à-dire une nouvelle ligne qui satisfait un prédicat déjà évalué. SERIALIZABLE conserve des verrous de plage sur les lignes et plages de clés lues par l'instruction SELECT jusqu'à la fin de la transaction : une autre transaction ne peut pas insérer de ligne dans cette plage avant la validation de la réservation.
  options:
    a:
      en: |
        REPEATABLE READ locks only the rows that exist when they are read, so phantom inserts are still possible.
      fr: |
        REPEATABLE READ ne verrouille que les lignes existantes au moment de la lecture : les insertions fantômes restent possibles.
    b:
      en: |
        SNAPSHOT reads a version of the data and takes no range locks, so two transactions can both see no overlap and both insert.
      fr: |
        SNAPSHOT lit une version des données et ne prend aucun verrou de plage : deux transactions peuvent toutes deux ne voir aucun chevauchement et toutes deux insérer.
    d:
      en: |
        READ UNCOMMITTED takes no shared locks and allows dirty reads; it gives the weakest protection.
      fr: |
        READ UNCOMMITTED ne prend aucun verrou partagé et autorise les lectures incorrectes ; il offre la protection la plus faible.
references:
  - title: SET TRANSACTION ISOLATION LEVEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-transaction-isolation-level-transact-sql
