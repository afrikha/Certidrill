id: dp800-sr2-pwdless-1
objective: "2.1.5"
type: series_yesno
series: dp800-sr2-passwordless-app
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You use the system-assigned managed identity of the app with db_datareader and db_datawriter.
  fr: Vous utilisez l'identité managée affectée par le système de l'application avec db_datareader et db_datawriter.
body:
  solution:
    en: |
      You enable the system-assigned managed identity of adatum-orders. Connected to OrdersDb as the Microsoft Entra admin, you run the following statements.

      ```sql
      CREATE USER [adatum-orders] FROM EXTERNAL PROVIDER;
      ALTER ROLE db_datareader ADD MEMBER [adatum-orders];
      ALTER ROLE db_datawriter ADD MEMBER [adatum-orders];
      ```

      You replace the connection string with the following value.

      ```text
      Server=tcp:adatum-sql.database.windows.net;Database=OrdersDb;Authentication=Active Directory Default;
      ```
    fr: |
      Vous activez l'identité managée affectée par le système d'adatum-orders. Connecté à OrdersDb en tant qu'administrateur Microsoft Entra, vous exécutez les instructions suivantes.

      ```sql
      CREATE USER [adatum-orders] FROM EXTERNAL PROVIDER;
      ALTER ROLE db_datareader ADD MEMBER [adatum-orders];
      ALTER ROLE db_datawriter ADD MEMBER [adatum-orders];
      ```

      Vous remplacez la chaîne de connexion par la valeur suivante.

      ```text
      Server=tcp:adatum-sql.database.windows.net;Database=OrdersDb;Authentication=Active Directory Default;
      ```
answer: { value: true }
explanation:
  correct:
    en: CREATE USER ... FROM EXTERNAL PROVIDER creates a database user for the managed identity, whose name matches the app name. With Authentication=Active Directory Default, the driver gets a Microsoft Entra token from the managed identity at run time, so the connection string contains no user name or password. db_datareader and db_datawriter allow reading and writing the tables without any schema change permission.
    fr: "CREATE USER ... FROM EXTERNAL PROVIDER crée un utilisateur de base de données pour l'identité managée, dont le nom correspond à celui de l'application. Avec Authentication=Active Directory Default, le pilote obtient un jeton Microsoft Entra auprès de l'identité managée à l'exécution : la chaîne de connexion ne contient ni nom d'utilisateur ni mot de passe. db_datareader et db_datawriter permettent de lire et d'écrire dans les tables sans aucune autorisation de modification du schéma."
references:
  - title: "Tutorial: Use managed identity to connect an Azure web app to an Azure SQL database without secrets"
    url: https://learn.microsoft.com/en-us/azure/app-service/tutorial-connect-msi-sql-database
