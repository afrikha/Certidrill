id: dp800-2c-convert-to-sdk
objective: "2.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an original SQL database project named **FlightsDb** that is built in Visual Studio with SQL Server Data Tools. You plan to convert the project to the SDK-style format.

    You need to perform the conversion and prove that the database model produced by the converted project is identical to the model of the original project.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin dispose d'un projet de base de données SQL d'origine nommé **FlightsDb**, généré dans Visual Studio avec SQL Server Data Tools. Vous prévoyez de convertir le projet au format de style SDK.

    Vous devez effectuer la conversion et prouver que le modèle de base de données produit par le projet converti est identique à celui du projet d'origine.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: backup, text: { en: "Copy FlightsDb.sqlproj to FlightsDb.sqlproj.original.", fr: "Copier FlightsDb.sqlproj vers FlightsDb.sqlproj.original." } }
    - { id: baseline, text: { en: "Build the original project and copy the .dacpac file outside the project as original_project.dacpac.", fr: "Générer le projet d'origine et copier le fichier .dacpac hors du projet sous le nom original_project.dacpac." } }
    - { id: edit, text: { en: "Add the Microsoft.Build.Sql Sdk element, and remove the Import elements and the Build Include items of the .sql files.", fr: "Ajouter l'élément Sdk Microsoft.Build.Sql, puis supprimer les éléments Import et les éléments Build Include des fichiers .sql." } }
    - { id: rebuild, text: { en: "Run dotnet build on the modified project and copy the .dacpac file as modified_project.dacpac.", fr: "Exécuter dotnet build sur le projet modifié et copier le fichier .dacpac sous le nom modified_project.dacpac." } }
    - { id: verify, text: { en: "Compare original_project.dacpac and modified_project.dacpac with DacpacVerify.", fr: "Comparer original_project.dacpac et modified_project.dacpac avec DacpacVerify." } }
    - { id: postdeploy, text: { en: "Remove the PostDeploy item from the project file.", fr: "Supprimer l'élément PostDeploy du fichier projet." } }
    - { id: extract, text: { en: "Run SqlPackage /Action:Extract against the production database to create the new project files.", fr: "Exécuter SqlPackage /Action:Extract sur la base de données de production pour créer les nouveaux fichiers du projet." } }
answer:
  sequence: [ backup, baseline, edit, rebuild, verify ]
explanation:
  correct:
    en: |
      You back up the project file and build a baseline .dacpac before changing anything. The conversion adds the Microsoft.Build.Sql Sdk element and removes the SSDT Import lines and the Build Include items, because SDK-style projects include every .sql file by default. You then build the modified project and compare both .dacpac files with DacpacVerify, which also checks pre- and post-deployment scripts and the refactor log, unlike schema comparison.
    fr: |
      Vous sauvegardez le fichier projet et générez un .dacpac de référence avant toute modification. La conversion ajoute l'élément Sdk Microsoft.Build.Sql et supprime les lignes Import de SSDT et les éléments Build Include, car les projets de style SDK incluent par défaut tous les fichiers .sql. Vous générez ensuite le projet modifié et comparez les deux fichiers .dacpac avec DacpacVerify, qui vérifie aussi les scripts de prédéploiement et de post-déploiement et le journal de refactorisation, contrairement à la comparaison de schémas.
  options:
    postdeploy: { en: "The PreDeploy and PostDeploy items must be kept; only the Build Include items of the .sql files are removed.", fr: "Les éléments PreDeploy et PostDeploy doivent être conservés ; seuls les éléments Build Include des fichiers .sql sont supprimés." }
    extract: { en: "Extracting production creates a new project from the live schema, which can include drift; it does not convert the existing project.", fr: "Extraire la production crée un nouveau projet à partir du schéma réel, qui peut contenir une dérive ; cela ne convertit pas le projet existant." }
references:
  - title: Convert an original SQL project
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/howto/convert-original-sql-project
