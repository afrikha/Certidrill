id: dp800-2a-audit-server-db-policies
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Azure SQL logical server **sql-contoso** hosts two databases named **DB1** and **DB2**. DB1 has a database-level auditing policy that writes to the storage account **stauditdb1**. No other auditing is configured.

    You enable server-level auditing on sql-contoso with the Log Analytics workspace **law-sec** as the destination. Later, you create a database named **DB3** on sql-contoso.

    Which statement describes where the audit events are written?
  fr: |
    Le serveur logique Azure SQL **sql-contoso** héberge deux bases de données nommées **DB1** et **DB2**. DB1 dispose d'une stratégie d'audit au niveau de la base de données qui écrit dans le compte de stockage **stauditdb1**. Aucun autre audit n'est configuré.

    Vous activez l'audit au niveau du serveur sur sql-contoso avec l'espace de travail Log Analytics **law-sec** comme destination. Plus tard, vous créez une base de données nommée **DB3** sur sql-contoso.

    Quelle affirmation décrit l'emplacement où les événements d'audit sont écrits ?
body:
  options:
    - id: a
      text: { en: "DB1 writes to stauditdb1 only; DB2 and DB3 write to law-sec.", fr: "DB1 écrit uniquement dans stauditdb1 ; DB2 et DB3 écrivent dans law-sec." }
    - id: b
      text: { en: "DB1 writes to stauditdb1 and law-sec; DB2 and DB3 write to law-sec.", fr: "DB1 écrit dans stauditdb1 et law-sec ; DB2 et DB3 écrivent dans law-sec." }
    - id: c
      text: { en: "DB1 and DB2 write to law-sec; DB3 isn't audited until you enable auditing on it.", fr: "DB1 et DB2 écrivent dans law-sec ; DB3 n'est pas auditée tant que vous n'y activez pas l'audit." }
    - id: d
      text: { en: "All three databases write to law-sec only; the policy of DB1 is disabled.", fr: "Les trois bases de données écrivent uniquement dans law-sec ; la stratégie de DB1 est désactivée." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A server-level auditing policy applies to every existing and new database on the server. Database-level and server-level audits can coexist; enabling both does not override either policy, so DB1 is audited twice, once to each destination. DB3 inherits the server policy as soon as it is created.
    fr: |
      Une stratégie d'audit au niveau du serveur s'applique à toutes les bases de données existantes et nouvelles du serveur. Les audits au niveau de la base de données et du serveur peuvent coexister ; activer les deux ne remplace aucune des stratégies : DB1 est donc auditée deux fois, une fois vers chaque destination. DB3 hérite de la stratégie du serveur dès sa création.
  options:
    a: { en: "The database policy doesn't exclude DB1 from the server policy; both audits run.", fr: "La stratégie de base de données n'exclut pas DB1 de la stratégie du serveur ; les deux audits s'exécutent." }
    c: { en: "Server-level auditing also applies to databases created after the policy is enabled.", fr: "L'audit au niveau du serveur s'applique aussi aux bases de données créées après l'activation de la stratégie." }
    d: { en: "Enabling server auditing doesn't disable an existing database-level policy.", fr: "Activer l'audit du serveur ne désactive pas une stratégie existante au niveau de la base de données." }
references:
  - title: Set up Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-setup
