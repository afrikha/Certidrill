id: dp800-2a-model-credential-name
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database. Stored procedures call two deployments of the Azure OpenAI resource **aoai-fabrikam** by using `sp_invoke_external_rest_endpoint`:

    ```text
    https://aoai-fabrikam.openai.azure.com/openai/deployments/text-embedding-3-small/embeddings?api-version=2024-02-01
    https://aoai-fabrikam.openai.azure.com/openai/deployments/gpt-4o-mini/chat/completions?api-version=2024-10-21
    ```

    You need to create a single database scoped credential that uses the managed identity of the server and that both calls can pass in the @credential parameter.

    Which name should you give the credential?
  fr: |
    Vous disposez d'une base de données Azure SQL Database. Des procédures stockées appellent deux déploiements de la ressource Azure OpenAI **aoai-fabrikam** à l'aide de `sp_invoke_external_rest_endpoint` :

    ```text
    https://aoai-fabrikam.openai.azure.com/openai/deployments/text-embedding-3-small/embeddings?api-version=2024-02-01
    https://aoai-fabrikam.openai.azure.com/openai/deployments/gpt-4o-mini/chat/completions?api-version=2024-10-21
    ```

    Vous devez créer des informations d'identification délimitées à la base de données uniques, qui utilisent l'identité managée du serveur et que les deux appels peuvent passer dans le paramètre @credential.

    Quel nom devez-vous donner aux informations d'identification ?
body:
  options:
    - { id: a, text: "[aoai-fabrikam]" }
    - { id: b, text: "[https://aoai-fabrikam.openai.azure.com/openai/deployments/text-embedding-3-small]" }
    - { id: c, text: "[https://aoai-fabrikam.openai.azure.com/openai/deployments/gpt-4o-mini/chat/completions?api-version=2024-10-21]" }
    - { id: d, text: "[https://aoai-fabrikam.openai.azure.com]" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The credential name must be a valid URL without a query string, its protocol and FQDN must match the called URL, and its path must be equal to or more generic than the path of the request. A name that contains only https://aoai-fabrikam.openai.azure.com is more generic than both deployment paths, so both calls can use it.
    fr: |
      Le nom des informations d'identification doit être une URL valide sans chaîne de requête, son protocole et son FQDN doivent correspondre à l'URL appelée, et son chemin doit être égal ou plus générique que celui de la requête. Un nom qui ne contient que https://aoai-fabrikam.openai.azure.com est plus générique que les deux chemins de déploiement : les deux appels peuvent l'utiliser.
  options:
    a: { en: "The name must be a URL whose protocol and FQDN match the called endpoint.", fr: "Le nom doit être une URL dont le protocole et le FQDN correspondent au point de terminaison appelé." }
    b: { en: "Every path segment must match the called URL, so this credential can't be used for the gpt-4o-mini deployment.", fr: "Chaque segment de chemin doit correspondre à l'URL appelée : ces informations d'identification ne peuvent pas servir pour le déploiement gpt-4o-mini." }
    c: { en: "The name can't contain a query string, and its path matches only one deployment.", fr: "Le nom ne peut pas contenir de chaîne de requête, et son chemin ne correspond qu'à un seul déploiement." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
