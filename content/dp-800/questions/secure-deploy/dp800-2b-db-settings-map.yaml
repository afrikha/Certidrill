id: dp800-2b-db-settings-map
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Business Critical database in Azure SQL Database. The database was migrated from SQL Server 2019 and still uses compatibility level 150. You have tested the workload at the latest compatibility level by using a Query Store baseline.

    You need to recommend a configuration for each requirement.

    Which configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une base de données Business Critical dans Azure SQL Database. La base a été migrée depuis SQL Server 2019 et utilise toujours le niveau de compatibilité 150. Vous avez testé la charge de travail au dernier niveau de compatibilité à l'aide d'une ligne de base du Magasin des requêtes.

    Vous devez recommander une configuration pour chaque exigence.

    Quelle configuration devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: intent, text: "ApplicationIntent=ReadOnly" }
    - { id: adhoc, text: "ALTER DATABASE SCOPED CONFIGURATION SET OPTIMIZE_FOR_AD_HOC_WORKLOADS = ON;" }
    - { id: tuning, text: "ALTER DATABASE CURRENT SET AUTOMATIC_TUNING (CREATE_INDEX = ON);" }
    - { id: compat, text: "ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 170;" }
    - { id: rcsi, text: "ALTER DATABASE CURRENT SET READ_COMMITTED_SNAPSHOT ON;" }
    - { id: maxdop, text: "ALTER DATABASE SCOPED CONFIGURATION SET MAXDOP = 0;" }
  targets:
    - id: t1
      text:
        en: |
          Monthly reports must run on the built-in read-only replica.
        fr: |
          Les rapports mensuels doivent s'exécuter sur le réplica en lecture seule intégré.
    - id: t2
      text:
        en: |
          Thousands of single-use ad hoc queries must stop filling the plan cache with full plans.
        fr: |
          Des milliers de requêtes ad hoc à usage unique ne doivent plus remplir le cache de plans avec des plans complets.
    - id: t3
      text:
        en: |
          The service must create missing indexes, validate the gain and revert them if performance degrades.
        fr: |
          Le service doit créer les index manquants, valider le gain et les annuler si les performances se dégradent.
    - id: t4
      text:
        en: |
          Queries must benefit from the optimizer features of the latest database engine version.
        fr: |
          Les requêtes doivent bénéficier des fonctionnalités de l'optimiseur de la dernière version du moteur de base de données.
answer:
  mapping: { t1: intent, t2: adhoc, t3: tuning, t4: compat }
explanation:
  correct:
    en: |
      ApplicationIntent=ReadOnly routes a connection to the read-only replica that Business Critical includes. OPTIMIZE_FOR_AD_HOC_WORKLOADS stores a small plan stub at the first compilation and a full plan only if the batch runs again. CREATE_INDEX lets automatic tuning create and validate indexes, reverting changes that don't help. Existing databases are never upgraded automatically, so you raise the compatibility level to 170 yourself after testing.
    fr: |
      ApplicationIntent=ReadOnly route une connexion vers le réplica en lecture seule inclus dans Business Critical. OPTIMIZE_FOR_AD_HOC_WORKLOADS stocke un petit stub de plan à la première compilation et un plan complet seulement si le lot s'exécute de nouveau. CREATE_INDEX permet au réglage automatique de créer et valider des index, en annulant les modifications inutiles. Les bases existantes ne sont jamais mises à niveau automatiquement : vous montez vous-même le niveau de compatibilité à 170 après les tests.
  options:
    rcsi:
      en: |
        READ_COMMITTED_SNAPSHOT is already on by default in Azure SQL Database and addresses reader/writer blocking, none of the requirements.
      fr: |
        READ_COMMITTED_SNAPSHOT est déjà activé par défaut dans Azure SQL Database et traite le blocage entre lecteurs et rédacteurs, ce qui ne correspond à aucune exigence.
    maxdop:
      en: |
        MAXDOP 0 allows unlimited parallelism, which Microsoft recommends avoiding.
      fr: |
        MAXDOP 0 autorise un parallélisme illimité, ce que Microsoft recommande d'éviter.
references:
  - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql
  - title: Use read-only replicas to offload read-only query workloads
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
