id: dp800-2a-ddm-mask-admin
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database that uses dynamic data masking.

    You need to grant permissions that meet the following requirements:

    - A user named **SecOfficer** must be able to add, replace and drop the masks of **dbo.Member**, but must not see unmasked data.
    - Members of the **Auditors** role already have `SELECT` on the **HR** schema. They must see the real values of every masked column in the HR tables, and only in those tables.

    The solution must follow the principle of least privilege. How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database qui utilise le masquage dynamique des données.

    Vous devez accorder des autorisations qui satisfont les exigences suivantes :

    - Un utilisateur nommé **SecOfficer** doit pouvoir ajouter, remplacer et supprimer les masques de **dbo.Member**, mais ne doit pas voir les données non masquées.
    - Les membres du rôle **Auditors** disposent déjà de `SELECT` sur le schéma **HR**. Ils doivent voir les vraies valeurs de toutes les colonnes masquées des tables HR, et uniquement de ces tables.

    La solution doit respecter le principe du moindre privilège. Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template:
    en: |
      -- SecOfficer manages the masks of dbo.Member
      GRANT [[p1]] TO SecOfficer;
      GRANT [[p2]] ON dbo.Member TO SecOfficer;

      -- Auditors read the real values in the HR schema
      GRANT [[p3]] ON SCHEMA::HR TO Auditors;
    fr: |
      -- SecOfficer gère les masques de dbo.Member
      GRANT [[p1]] TO SecOfficer;
      GRANT [[p2]] ON dbo.Member TO SecOfficer;

      -- Auditors lit les vraies valeurs du schéma HR
      GRANT [[p3]] ON SCHEMA::HR TO Auditors;
  slots:
    - id: p1
      options:
        - { id: anymask, text: ALTER ANY MASK }
        - { id: unmask, text: UNMASK }
        - { id: control, text: CONTROL }
        - { id: anypolicy, text: ALTER ANY SECURITY POLICY }
    - id: p2
      options:
        - { id: alter, text: ALTER }
        - { id: select, text: SELECT }
        - { id: control, text: CONTROL }
        - { id: references, text: REFERENCES }
    - id: p3
      options:
        - { id: unmask, text: UNMASK }
        - { id: viewdef, text: VIEW DEFINITION }
        - { id: anymask, text: ALTER ANY MASK }
        - { id: control, text: CONTROL }
answer:
  values: { p1: anymask, p2: alter, p3: unmask }
explanation:
  correct:
    en: |
      Adding, replacing or dropping a mask requires the ALTER ANY MASK database permission plus ALTER on the table, and neither permission reveals masked data. UNMASK granted on the HR schema unmasks the columns of the tables in that schema only, and it takes effect together with the SELECT permission that Auditors already have.
    fr: |
      Ajouter, remplacer ou supprimer un masque exige l'autorisation de base de données ALTER ANY MASK et ALTER sur la table, et aucune de ces autorisations ne révèle les données masquées. UNMASK accordée sur le schéma HR démasque uniquement les colonnes des tables de ce schéma, et elle s'applique avec l'autorisation SELECT dont Auditors dispose déjà.
  options:
    unmask: { en: "For SecOfficer, UNMASK would reveal the data, which the requirements forbid.", fr: "Pour SecOfficer, UNMASK révélerait les données, ce que les exigences interdisent." }
    control: { en: "CONTROL implies every permission on its scope, including UNMASK, which is more than required.", fr: "CONTROL implique toutes les autorisations sur son étendue, y compris UNMASK, ce qui dépasse le besoin." }
    anypolicy: { en: "ALTER ANY SECURITY POLICY manages Row-Level Security policies, not masks.", fr: "ALTER ANY SECURITY POLICY gère les stratégies de Row-Level Security, pas les masques." }
    viewdef: { en: "VIEW DEFINITION exposes metadata, not unmasked values.", fr: "VIEW DEFINITION expose des métadonnées, pas des valeurs démasquées." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking
