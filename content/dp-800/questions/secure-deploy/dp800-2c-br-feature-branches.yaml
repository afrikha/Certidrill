id: dp800-2c-br-feature-branches
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has five developers who change an SDK-style SQL database project named **LoansDb**. The pipeline deploys **main** to a test database after each merge.

    You need to choose a branching strategy that meets the following requirements:

    - main is always deployable.
    - Each schema change can be reviewed and built on its own before it reaches main.
    - Branches are easy to merge.

    What should you recommend?
  fr: |
    Litware compte cinq développeurs qui modifient un projet de base de données SQL de style SDK nommé **LoansDb**. Le pipeline déploie **main** sur une base de données de test après chaque fusion.

    Vous devez choisir une stratégie de branchement qui respecte les exigences suivantes :

    - main est toujours déployable.
    - Chaque modification de schéma peut être révisée et générée séparément avant d'atteindre main.
    - Les branches sont faciles à fusionner.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One long-lived branch per developer, merged into main at the end of each month", fr: "Une branche durable par développeur, fusionnée dans main à la fin de chaque mois" } }
    - { id: b, text: { en: "One branch per environment, with changes copied from the test branch to the production branch", fr: "Une branche par environnement, avec des modifications copiées de la branche de test vers la branche de production" } }
    - { id: c, text: { en: "Direct commits to main, followed by a nightly build of the project", fr: "Des validations directes dans main, suivies d'une génération nocturne du projet" } }
    - { id: d, text: { en: "One short-lived feature branch per change, merged into main through a pull request", fr: "Une branche de fonctionnalité de courte durée par modification, fusionnée dans main par une pull request" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A feature branch per change isolates each schema change, and the pull request into main is where it is reviewed and built before the merge, so main stays deployable. Keeping the branches short-lived limits divergence from main and makes merges simpler.
    fr: |
      Une branche de fonctionnalité par modification isole chaque changement de schéma, et la pull request vers main permet de le réviser et de le générer avant la fusion : main reste déployable. Des branches de courte durée limitent la divergence avec main et simplifient les fusions.
  options:
    a: { en: "Long-lived branches diverge from main and are harder to merge, and a month of changes is reviewed at once.", fr: "Les branches durables divergent de main et sont plus difficiles à fusionner, et un mois de modifications est révisé d'un coup." }
    c: { en: "Direct commits skip review, and a nightly build finds broken changes only after they are in main.", fr: "Les validations directes contournent la révision, et un build nocturne ne détecte les modifications défectueuses qu'une fois dans main." }
    b: { en: "Environment branches copy changes between branches instead of promoting one reviewed artifact, and they drift apart.", fr: "Les branches par environnement copient des modifications entre branches au lieu de promouvoir un artefact révisé, et elles divergent." }
references:
  - title: Manage branching, pull requests, and conflict resolution
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/04-manage-branching-pull-requests-conflict-resolution
