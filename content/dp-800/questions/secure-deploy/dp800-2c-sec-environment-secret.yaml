id: dp800-2c-sec-environment-secret
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses a GitHub Actions workflow to build an SDK-style SQL database project and deploy it to test and production. The deploy-prod job references the GitHub environment **production**, which has required reviewers.

    You need to store the connection string of the production database so that only jobs that use the production environment can read it, and only after the reviewers approve the deployment.

    Where should you store the connection string?
  fr: |
    Fabrikam utilise un workflow GitHub Actions pour générer un projet de base de données SQL de style SDK et le déployer en test et en production. Le travail deploy-prod référence l'environnement GitHub **production**, qui a des réviseurs requis.

    Vous devez stocker la chaîne de connexion de la base de données de production de sorte que seuls les travaux qui utilisent l'environnement production puissent la lire, et seulement après l'approbation du déploiement par les réviseurs.

    Où devez-vous stocker la chaîne de connexion ?
body:
  options:
    - { id: a, text: { en: "In a repository secret", fr: "Dans un secret de dépôt" } }
    - { id: b, text: { en: "In an environment secret of production", fr: "Dans un secret d'environnement de production" } }
    - { id: c, text: { en: "In an environment variable of production", fr: "Dans une variable d'environnement de production" } }
    - { id: d, text: { en: "In the env section of the deploy-prod job", fr: "Dans la section env du travail deploy-prod" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Environment secrets are available only to jobs that reference the environment, and only after the environment's protection rules, such as required reviewers, pass. The workflow reads the value with the secrets context.
    fr: |
      Les secrets d'environnement ne sont accessibles qu'aux travaux qui référencent l'environnement, et seulement après le passage des règles de protection de l'environnement, comme les réviseurs requis. Le workflow lit la valeur avec le contexte secrets.
  options:
    a:
      en: |
        A repository secret is available to every job of the repository's workflows, including test jobs that need no approval.
      fr: |
        Un secret de dépôt est accessible à tous les travaux des workflows du dépôt, y compris les travaux de test qui ne nécessitent aucune approbation.
    c:
      en: |
        Environment variables are not encrypted secrets; a connection string with credentials must be stored as a secret.
      fr: |
        Les variables d'environnement ne sont pas des secrets chiffrés ; une chaîne de connexion contenant des informations d'identification doit être stockée comme secret.
    d:
      en: |
        Values written in the workflow file are visible to anyone who can read the repository.
      fr: |
        Les valeurs écrites dans le fichier de workflow sont visibles par toute personne qui peut lire le dépôt.
references:
  - title: Implement CI/CD pipelines
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/06-implement-cicd-pipelines
