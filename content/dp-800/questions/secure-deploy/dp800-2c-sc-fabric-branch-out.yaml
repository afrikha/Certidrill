id: dp800-2c-sc-fabric-branch-out
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Fabric workspace named **Sales-Main** that contains a SQL database named **SalesDb**. The workspace is connected to the **main** branch of a GitHub repository.

    A developer must build a new feature that changes several tables. The changes must be developed and tested in a separate database and a separate branch, and they must reach main only through a pull request. SalesDb in Sales-Main must not change until the pull request is completed.

    What should the developer do first?
  fr: |
    Contoso dispose d'un espace de travail Microsoft Fabric nommé **Sales-Main** qui contient une base de données SQL nommée **SalesDb**. L'espace de travail est connecté à la branche **main** d'un dépôt GitHub.

    Un développeur doit créer une nouvelle fonctionnalité qui modifie plusieurs tables. Les modifications doivent être développées et testées dans une base de données et une branche distinctes, et elles ne doivent atteindre main que par une pull request. SalesDb dans Sales-Main ne doit pas changer tant que la pull request n'est pas terminée.

    Que doit faire le développeur en premier ?
body:
  options:
    - { id: a, text: { en: "In the Source control pane of Sales-Main, select Branch out to new workspace.", fr: "Dans le volet Contrôle de code source de Sales-Main, sélectionner Branch out to new workspace." } }
    - { id: b, text: { en: "Change the tables of SalesDb in Sales-Main, and then select Commit in the Source control pane.", fr: "Modifier les tables de SalesDb dans Sales-Main, puis sélectionner Commit dans le volet Contrôle de code source." } }
    - { id: c, text: { en: "Create a deployment pipeline that copies Sales-Main to a test stage.", fr: "Créer un pipeline de déploiement qui copie Sales-Main vers une phase de test." } }
    - { id: d, text: { en: "Create a branch in GitHub, and select Update in the Source control pane of Sales-Main.", fr: "Créer une branche dans GitHub, puis sélectionner Update dans le volet Contrôle de code source de Sales-Main." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each Fabric workspace maps to one branch. Branch out to new workspace creates a branch and a new workspace populated with the committed objects, so the developer changes and commits a separate copy of the database. A pull request then merges the branch into main, and Update in Sales-Main applies the changes to SalesDb only when the team chooses.
    fr: |
      Chaque espace de travail Fabric correspond à une branche. Branch out to new workspace crée une branche et un nouvel espace de travail rempli avec les objets validés : le développeur modifie et valide une copie distincte de la base de données. Une pull request fusionne ensuite la branche dans main, et Update dans Sales-Main n'applique les modifications à SalesDb que lorsque l'équipe le décide.
  options:
    b:
      en: |
        Changing SalesDb in Sales-Main and committing writes directly to main, with no separate database and no pull request.
      fr: |
        Modifier SalesDb dans Sales-Main et valider écrit directement dans main, sans base distincte ni pull request.
    c:
      en: |
        A deployment pipeline promotes content between stages; it does not create a Git branch for feature development and review.
      fr: |
        Un pipeline de déploiement promeut du contenu entre des phases ; il ne crée pas de branche Git pour développer et réviser une fonctionnalité.
    d:
      en: |
        Sales-Main stays connected to main, so Update applies main to SalesDb; the new branch has no workspace or database of its own.
      fr: |
        Sales-Main reste connecté à main : Update applique main à SalesDb, et la nouvelle branche n'a ni espace de travail ni base de données propres.
references:
  - title: SQL database source control integration in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/sql/source-control
