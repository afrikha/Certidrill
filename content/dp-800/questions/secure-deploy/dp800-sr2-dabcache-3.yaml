id: dp800-sr2-dabcache-3
objective: "2.4.2"
type: series_yesno
series: dp800-sr2-dab-product-cache
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You enable the runtime cache with a 30-second time-to-live.
  fr: Vous activez le cache du runtime avec une durée de vie de 30 secondes.
body:
  solution:
    en: |
      You add the following property to the `runtime` section and leave both entities unchanged.

      ```json
      "cache": { "enabled": true, "ttl-seconds": 30 }
      ```
    fr: |
      Vous ajoutez la propriété suivante à la section `runtime` et laissez les deux entités inchangées.

      ```json
      "cache": { "enabled": true, "ttl-seconds": 30 }
      ```
answer: { value: false }
explanation:
  correct:
    en: The runtime cache section only makes caching available and sets the default time-to-live. Each entity must also opt in with its own cache property set to enabled. Because neither entity opts in, Product responses are never cached.
    fr: "La section cache du runtime rend seulement la mise en cache disponible et définit la durée de vie par défaut. Chaque entité doit aussi l'activer avec sa propre propriété cache définie sur enabled. Comme aucune entité ne l'active, les réponses de Product ne sont jamais mises en cache."
references:
  - title: Implement level 1 cache
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/cache/level-1
