id: dp800-2b-qs-hint-variation
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs a vendor application on Azure SQL Database. In the Queries With High Variation report of Query Store, query 812, which runs inside a vendor stored procedure, takes between 20 ms and 40 seconds depending on the value of its `@RegionID` parameter.

    You compare the plans that Query Store collected for query 812: each plan is fast for some regions and slow for others, so no single plan performs well for every value.

    You need to improve the performance of query 812. You can't modify the code of the vendor procedure, and the fix must persist after failovers.

    What should you do?
  fr: |
    Litware exécute une application d'éditeur sur Azure SQL Database. Dans le rapport Queries With High Variation du Magasin des requêtes, la requête 812, qui s'exécute dans une procédure stockée de l'éditeur, dure entre 20 ms et 40 secondes selon la valeur de son paramètre `@RegionID`.

    Vous comparez les plans que le Magasin des requêtes a collectés pour la requête 812 : chaque plan est rapide pour certaines régions et lent pour d'autres, si bien qu'aucun plan unique n'est performant pour toutes les valeurs.

    Vous devez améliorer les performances de la requête 812. Vous ne pouvez pas modifier le code de la procédure de l'éditeur, et la correction doit persister après les basculements.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |
          Run sp_query_store_force_plan for query 812 with the plan that has the lowest average duration.
        fr: |
          Exécuter sp_query_store_force_plan pour la requête 812 avec le plan dont la durée moyenne est la plus faible.
    - id: b
      text:
        en: |
          Run sp_query_store_set_hints for query 812 with the hint OPTION (RECOMPILE).
        fr: |
          Exécuter sp_query_store_set_hints pour la requête 812 avec l'indicateur OPTION (RECOMPILE).
    - id: c
      text:
        en: |
          Run ALTER PROCEDURE on the vendor procedure to add WITH RECOMPILE.
        fr: |
          Exécuter ALTER PROCEDURE sur la procédure de l'éditeur pour ajouter WITH RECOMPILE.
    - id: d
      text:
        en: |
          Schedule ALTER DATABASE SCOPED CONFIGURATION CLEAR PROCEDURE_CACHE to run every hour.
        fr: |
          Planifier l'exécution de ALTER DATABASE SCOPED CONFIGURATION CLEAR PROCEDURE_CACHE toutes les heures.
answer: { optionId: b }
explanation:
  correct:
    en: |
      Query Store hints add a query hint to a query identified by its query_id without changing its Transact-SQL text, and they persist across restarts and failovers. With RECOMPILE, the optimizer builds a plan for the actual parameter value at each execution, which fits a query for which no single plan is good for every value.
    fr: |
      Les indicateurs du Magasin des requêtes ajoutent un indicateur de requête à une requête identifiée par son query_id sans modifier son texte Transact-SQL, et ils persistent après les redémarrages et les basculements. Avec RECOMPILE, l'optimiseur crée un plan pour la valeur réelle du paramètre à chaque exécution, ce qui convient à une requête pour laquelle aucun plan unique n'est bon pour toutes les valeurs.
  options:
    a:
      en: |
        Forcing a plan helps when one plan is good for all executions; here every plan is slow for some regions.
      fr: |
        Forcer un plan aide lorsqu'un plan est bon pour toutes les exécutions ; ici, chaque plan est lent pour certaines régions.
    c:
      en: |
        Altering the procedure changes the vendor's code, which the constraints forbid.
      fr: |
        Modifier la procédure change le code de l'éditeur, ce que les contraintes interdisent.
    d:
      en: |
        Clearing the plan cache only gives the next caller a new plan until the next clear; it affects every query and isn't a persistent fix.
      fr: |
        Vider le cache de plans ne donne un nouveau plan qu'au prochain appelant jusqu'au vidage suivant ; cela affecte toutes les requêtes et ne constitue pas une correction persistante.
references:
  - title: Query Store hints
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/query-store-hints
