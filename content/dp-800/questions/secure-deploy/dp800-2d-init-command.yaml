id: dp800-2d-init-command
objective: "2.4.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is creating a Data API builder (DAB) configuration file for an API over an Azure SQL database named InventoryDb. The solution must meet the following requirements:

    - The connection string is stored in an environment variable named SQL_CONN on the container app, and it must not be written in the configuration file.
    - DAB must validate the Microsoft Entra ID access tokens sent by the client applications.
    - Swagger UI and the Nitro GraphQL client must not be available.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée un fichier de configuration Data API builder (DAB) pour une API sur une base de données Azure SQL nommée InventoryDb. La solution doit respecter les exigences suivantes :

    - La chaîne de connexion est stockée dans une variable d'environnement nommée SQL_CONN de l'application conteneur, et elle ne doit pas être écrite dans le fichier de configuration.
    - DAB doit valider les jetons d'accès Microsoft Entra ID envoyés par les applications clientes.
    - Swagger UI et le client GraphQL Nitro ne doivent pas être disponibles.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    dab init --database-type [[dbtype]] \
      --connection-string [[cs]] \
      --auth.provider [[prov]] \
      --auth.audience "api://fabrikam-inventory" \
      --auth.issuer "https://login.microsoftonline.com/<tenant-id>/v2.0" \
      --host-mode [[mode]]
  slots:
    - id: dbtype
      options:
        - { id: mssql, text: mssql }
        - { id: dwsql, text: dwsql }
        - { id: postgresql, text: postgresql }
        - { id: cosmos, text: cosmosdb_nosql }
    - id: cs
      options:
        - { id: dollar, text: "\"$SQL_CONN\"" }
        - { id: envfn, text: "\"@env('SQL_CONN')\"" }
        - { id: literal, text: "\"SQL_CONN\"" }
    - id: prov
      options:
        - { id: swa, text: StaticWebApps }
        - { id: sim, text: Simulator }
        - { id: entra, text: EntraID }
        - { id: unauth, text: Unauthenticated }
    - id: mode
      options:
        - { id: dev, text: Development }
        - { id: prod, text: Production }
answer:
  values: { dbtype: mssql, cs: envfn, prov: entra, mode: prod }
explanation:
  correct:
    en: |
      mssql is the database type for Azure SQL Database, Azure SQL Managed Instance, SQL Server and SQL database in Fabric. "@env('SQL_CONN')" writes a reference to the environment variable in the file, and DAB reads the value at startup. The EntraID provider validates Microsoft Entra tokens with the audience and issuer given, and Production mode doesn't expose Swagger UI or Nitro, which are development features.
    fr: |
      mssql est le type de base de données pour Azure SQL Database, Azure SQL Managed Instance, SQL Server et SQL database dans Fabric. "@env('SQL_CONN')" écrit dans le fichier une référence à la variable d'environnement, et DAB lit sa valeur au démarrage. Le fournisseur EntraID valide les jetons Microsoft Entra avec l'audience et l'émetteur indiqués, et le mode Production n'expose ni Swagger UI ni Nitro, qui sont des fonctionnalités de développement.
  options:
    dwsql: { en: "dwsql targets Azure Synapse Analytics and Fabric Warehouse, not Azure SQL Database.", fr: "dwsql cible Azure Synapse Analytics et Fabric Warehouse, pas Azure SQL Database." }
    dollar: { en: "The shell expands $SQL_CONN before DAB runs, so the secret itself is written in the file.", fr: "Le shell développe $SQL_CONN avant l'exécution de DAB : le secret lui-même est écrit dans le fichier." }
    literal: { en: "DAB would use the text SQL_CONN as the connection string.", fr: "DAB utiliserait le texte SQL_CONN comme chaîne de connexion." }
    swa: { en: "StaticWebApps relies on Azure Static Web Apps authentication, not on tokens validated by DAB.", fr: "StaticWebApps s'appuie sur l'authentification d'Azure Static Web Apps, pas sur des jetons validés par DAB." }
    sim: { en: "Simulator is for local tests and works only in development mode.", fr: "Simulator sert aux tests locaux et ne fonctionne qu'en mode development." }
    unauth: { en: "Unauthenticated validates no token: every request runs as anonymous.", fr: "Unauthenticated ne valide aucun jeton : chaque requête s'exécute en tant qu'anonymous." }
    dev: { en: "Development mode enables Swagger UI and Nitro.", fr: "Le mode Development active Swagger UI et Nitro." }
references:
  - title: Initialize a config with the DAB CLI - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/command-line/dab-init
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
