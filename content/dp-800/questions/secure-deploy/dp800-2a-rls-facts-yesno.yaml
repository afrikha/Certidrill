id: dp800-2a-rls-facts-yesno
objective: "2.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are designing Row-Level Security (RLS) for an Azure SQL Database. The predicate functions will be created in a dedicated schema named **Security**, and the security policies will use the default `SCHEMABINDING = ON` option.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez Row-Level Security (RLS) pour une base de données Azure SQL Database. Les fonctions de prédicat seront créées dans un schéma dédié nommé **Security**, et les stratégies de sécurité utiliseront l'option par défaut `SCHEMABINDING = ON`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A filter predicate silently excludes the rows that the user isn't allowed to access from SELECT, UPDATE and DELETE statements.
        fr: |
          Un prédicat de filtre exclut sans erreur des instructions SELECT, UPDATE et DELETE les lignes auxquelles l'utilisateur n'a pas accès.
    - id: s2
      text:
        en: |
          A security policy can contain two filter predicates on the same table, each based on a different column.
        fr: |
          Une stratégie de sécurité peut contenir deux prédicats de filtre sur la même table, chacun basé sur une colonne différente.
    - id: s3
      text:
        en: |
          Users who query a protected table don't need the SELECT permission on the predicate function.
        fr: |
          Les utilisateurs qui interrogent une table protégée n'ont pas besoin de l'autorisation SELECT sur la fonction de prédicat.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Filter predicates silently filter the rows available to read operations, and the application is not aware of the filtered rows. You cannot add a second predicate for the same table and the same operation, so two filter predicates on one table are rejected; combine the conditions in one function instead. With SCHEMABINDING = ON, permission checks on the predicate function and the objects it references are bypassed when users query the table.
    fr: |
      Les prédicats de filtre filtrent sans erreur les lignes disponibles pour les opérations de lecture, et l'application n'a pas connaissance des lignes filtrées. Vous ne pouvez pas ajouter un second prédicat pour la même table et la même opération : deux prédicats de filtre sur une table sont refusés, et vous combinez plutôt les conditions dans une seule fonction. Avec SCHEMABINDING = ON, les vérifications d'autorisations sur la fonction de prédicat et les objets qu'elle référence sont ignorées lorsque les utilisateurs interrogent la table.
references:
  - title: Row-level security
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
