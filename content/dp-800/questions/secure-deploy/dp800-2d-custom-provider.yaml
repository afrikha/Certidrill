id: dp800-2d-custom-provider
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin exposes a booking database through Data API builder (DAB) hosted in Azure Container Apps. The mobile application signs users in with Auth0 and sends the Auth0 JWT access token in the Authorization header of each request. Container Apps authentication isn't configured.

    You need DAB to validate the Auth0 tokens and apply the role permissions of the entities.

    Which value should you set for runtime.host.authentication.provider?
  fr: |
    Tailspin expose une base de données de réservations avec Data API builder (DAB) hébergé dans Azure Container Apps. L'application mobile connecte les utilisateurs avec Auth0 et envoie le jeton d'accès JWT Auth0 dans l'en-tête Authorization de chaque requête. L'authentification de Container Apps n'est pas configurée.

    Vous devez faire valider les jetons Auth0 par DAB et appliquer les autorisations par rôle des entités.

    Quelle valeur devez-vous définir pour runtime.host.authentication.provider ?
body:
  options:
    - { id: a, text: EntraId }
    - { id: b, text: AppService }
    - { id: c, text: Simulator }
    - { id: d, text: Custom }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Custom provider validates JWTs issued by a third-party identity provider such as Okta or Auth0. Like EntraId, it requires a jwt object with the audience and the issuer of the tokens. The role of each request is then taken from the token, and the X-MS-API-ROLE header can select one of the user's roles.
    fr: |
      Le fournisseur Custom valide les JWT émis par un fournisseur d'identité tiers comme Okta ou Auth0. Comme EntraId, il exige un objet jwt avec l'audience et l'émetteur des jetons. Le rôle de chaque requête est ensuite tiré du jeton, et l'en-tête X-MS-API-ROLE peut sélectionner l'un des rôles de l'utilisateur.
  options:
    a: { en: "EntraId validates tokens issued by Microsoft Entra ID, not by Auth0.", fr: "EntraId valide les jetons émis par Microsoft Entra ID, pas par Auth0." }
    b: { en: "AppService trusts the X-MS-CLIENT-PRINCIPAL headers added by built-in (Easy Auth) authentication, which isn't configured.", fr: "AppService approuve les en-têtes X-MS-CLIENT-PRINCIPAL ajoutés par l'authentification intégrée (Easy Auth), qui n'est pas configurée." }
    c: { en: "Simulator is for local tests only and doesn't validate any token.", fr: "Simulator sert uniquement aux tests locaux et ne valide aucun jeton." }
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
