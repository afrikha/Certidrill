id: dp800-2b-tier-hyperscale
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans a single database in Azure SQL Database for a telemetry application. The database will hold 6 TB of data at launch and is expected to reach 40 TB within three years. You must use the vCore purchasing model.

    Which service tier should you recommend?
  fr: |
    Proseware prévoit une base de données unique dans Azure SQL Database pour une application de télémétrie. La base contiendra 6 To de données au lancement et devrait atteindre 40 To d'ici trois ans. Vous devez utiliser le modèle d'achat vCore.

    Quel niveau de service devez-vous recommander ?
body:
  options:
    - id: a
      text: General Purpose
    - id: b
      text: Business Critical
    - id: c
      text: Hyperscale
    - id: d
      text:
        en: |
          General Purpose in an elastic pool
        fr: |
          General Purpose dans un pool élastique
answer: { optionId: c }
explanation:
  correct:
    en: |
      Hyperscale decouples storage from compute and supports databases up to 128 TB, so it is the only vCore tier that can hold 6 TB at launch and grow to 40 TB.
    fr: |
      Hyperscale découple le stockage du calcul et prend en charge des bases jusqu'à 128 To : c'est le seul niveau vCore capable d'héberger 6 To au lancement et de croître jusqu'à 40 To.
  options:
    a:
      en: |
        General Purpose supports up to 4 TB of storage.
      fr: |
        General Purpose prend en charge jusqu'à 4 To de stockage.
    b:
      en: |
        Business Critical also stops at 4 TB, even though it offers lower storage latency.
      fr: |
        Business Critical s'arrête aussi à 4 To, même s'il offre une latence de stockage plus faible.
    d:
      en: |
        An elastic pool shares resources between databases; it doesn't raise the 4 TB limit of General Purpose.
      fr: |
        Un pool élastique partage des ressources entre bases ; il ne relève pas la limite de 4 To de General Purpose.
references:
  - title: vCore purchasing model - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-sql-database-vcore
