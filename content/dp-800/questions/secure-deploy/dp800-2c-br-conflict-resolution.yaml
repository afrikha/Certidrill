id: dp800-2c-br-conflict-resolution
objective: "2.3.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores an SDK-style SQL database project named **CrmDb** in Git. You work in the branch **feature/customer-phone**, which adds a Phone column to **Tables/Customer.sql**. Meanwhile, a pull request that adds an Address column to the same `CREATE TABLE` statement was merged into **main**.

    You need to bring the changes of main into your branch, keep both columns, complete the merge commit, and confirm that the merged project still produces a valid model before you push the branch.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso stocke un projet de base de données SQL de style SDK nommé **CrmDb** dans Git. Vous travaillez dans la branche **feature/customer-phone**, qui ajoute une colonne Phone à **Tables/Customer.sql**. Entre-temps, une pull request qui ajoute une colonne Address à la même instruction `CREATE TABLE` a été fusionnée dans **main**.

    Vous devez intégrer les modifications de main dans votre branche, conserver les deux colonnes, terminer la validation de fusion et vérifier que le projet fusionné produit toujours un modèle valide avant de pousser la branche.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: checkout, text: { en: "Run git checkout feature/customer-phone.", fr: "Exécuter git checkout feature/customer-phone." } }
    - { id: pull, text: { en: "Run git pull origin main.", fr: "Exécuter git pull origin main." } }
    - { id: edit, text: { en: "Edit Tables/Customer.sql: remove the conflict markers and keep both columns in one valid CREATE TABLE statement.", fr: "Modifier Tables/Customer.sql : supprimer les marqueurs de conflit et conserver les deux colonnes dans une seule instruction CREATE TABLE valide." } }
    - { id: commit, text: { en: "Run git add Tables/Customer.sql, and then run git commit.", fr: "Exécuter git add Tables/Customer.sql, puis git commit." } }
    - { id: build, text: { en: "Run dotnet build CrmDb.sqlproj.", fr: "Exécuter dotnet build CrmDb.sqlproj." } }
    - { id: abort, text: { en: "Run git merge --abort.", fr: "Exécuter git merge --abort." } }
    - { id: extract, text: { en: "Run SqlPackage /Action:Extract against the production database to regenerate Tables/Customer.sql.", fr: "Exécuter SqlPackage /Action:Extract sur la base de données de production pour régénérer Tables/Customer.sql." } }
answer:
  sequence: [ checkout, pull, edit, commit, build ]
explanation:
  correct:
    en: |
      You pull main into the feature branch, which stops on the conflict in Tables/Customer.sql. You resolve it by keeping both columns in valid syntax, stage the file and commit to complete the merge. A clean text merge does not guarantee a valid schema, so you run dotnet build to validate references and syntax before pushing.
    fr: |
      Vous tirez main dans la branche de fonctionnalité, ce qui s'arrête sur le conflit dans Tables/Customer.sql. Vous le résolvez en conservant les deux colonnes dans une syntaxe valide, puis vous indexez le fichier et validez pour terminer la fusion. Une fusion de texte sans conflit ne garantit pas un schéma valide : vous exécutez dotnet build pour valider les références et la syntaxe avant de pousser.
  options:
    abort: { en: "Aborting the merge discards it; the changes of main would not be integrated.", fr: "Abandonner la fusion l'annule ; les modifications de main ne seraient pas intégrées." }
    extract: { en: "Production does not contain the new Phone column, so extracting it would lose your change.", fr: "La production ne contient pas la nouvelle colonne Phone : l'extraire ferait perdre votre modification." }
references:
  - title: Manage branching, pull requests, and conflict resolution
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/04-manage-branching-pull-requests-conflict-resolution
  - title: Resolve merge conflicts
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/merging
