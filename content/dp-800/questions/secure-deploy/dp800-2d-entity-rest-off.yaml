id: dp800-2d-entity-rest-off
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip exposes 15 entities through the REST and GraphQL endpoints of Data API builder (DAB). One of them, an entity named AuditEntry, is used only by an internal GraphQL dashboard.

    You need to remove AuditEntry from the REST endpoint. The other entities must stay available through REST, and AuditEntry must stay available through GraphQL.

    What should you do?
  fr: |
    Wingtip expose 15 entités par les points de terminaison REST et GraphQL de Data API builder (DAB). L'une d'elles, une entité nommée AuditEntry, n'est utilisée que par un tableau de bord GraphQL interne.

    Vous devez retirer AuditEntry du point de terminaison REST. Les autres entités doivent rester disponibles par REST, et AuditEntry doit rester disponible par GraphQL.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the AuditEntry entity, set \"rest\": { \"enabled\": false }.", fr: "Dans l'entité AuditEntry, définir \"rest\": { \"enabled\": false }." } }
    - { id: b, text: { en: "In the runtime section, set \"rest\": { \"enabled\": false }.", fr: "Dans la section runtime, définir \"rest\": { \"enabled\": false }." } }
    - { id: c, text: { en: "In the AuditEntry entity, set \"graphql\": { \"enabled\": true } and remove the read action.", fr: "Dans l'entité AuditEntry, définir \"graphql\": { \"enabled\": true } et supprimer l'action read." } }
    - { id: d, text: { en: "In the AuditEntry entity, set \"rest\": { \"path\": \"/internal\" }.", fr: "Dans l'entité AuditEntry, définir \"rest\": { \"path\": \"/internal\" }." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each entity has its own rest.enabled and graphql.enabled settings, both true by default. Setting rest.enabled to false on AuditEntry removes only that entity from the REST endpoint, while its GraphQL type stays in the schema.
    fr: |
      Chaque entité a ses propres paramètres rest.enabled et graphql.enabled, tous deux à true par défaut. Définir rest.enabled sur false pour AuditEntry retire seulement cette entité du point de terminaison REST, tandis que son type GraphQL reste dans le schéma.
  options:
    b: { en: "runtime.rest.enabled set to false disables REST for every entity, whatever the entity settings.", fr: "runtime.rest.enabled défini sur false désactive REST pour toutes les entités, quels que soient les paramètres des entités." }
    c: { en: "Permissions apply to both endpoints: without read, the dashboard couldn't query AuditEntry through GraphQL either.", fr: "Les autorisations s'appliquent aux deux points de terminaison : sans read, le tableau de bord ne pourrait plus interroger AuditEntry par GraphQL non plus." }
    d: { en: "Changing the path renames the route; the entity would still be available through REST.", fr: "Changer le chemin renomme la route ; l'entité resterait disponible par REST." }
references:
  - title: Configuration schema - Entities section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities
