id: dp800-2d-openapi-production
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove runs Data API builder (DAB) in production mode. The runtime section of the configuration contains the following setting:

    ```json
    "rest": { "enabled": true, "path": "/data" }
    ```

    A partner team must download the OpenAPI description of the REST endpoints to generate a client library. The API must stay in production mode.

    Which URL path should the partner team use?
  fr: |
    Woodgrove exécute Data API builder (DAB) en mode production. La section runtime de la configuration contient le paramètre suivant :

    ```json
    "rest": { "enabled": true, "path": "/data" }
    ```

    Une équipe partenaire doit télécharger la description OpenAPI des points de terminaison REST pour générer une bibliothèque cliente. L'API doit rester en mode production.

    Quel chemin d'URL l'équipe partenaire doit-elle utiliser ?
body:
  options:
    - { id: a, text: /api/openapi }
    - { id: b, text: /swagger }
    - { id: c, text: /data/openapi }
    - { id: d, text: /data/openapi/anonymous }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DAB serves the OpenAPI document at /{rest-path}/openapi, and the REST path here is /data. In production mode, only this base OpenAPI path is available; the document reflects the permissions configured on the entities.
    fr: |
      DAB sert le document OpenAPI à l'adresse /{rest-path}/openapi, et le chemin REST est ici /data. En mode production, seul ce chemin OpenAPI de base est disponible ; le document reflète les autorisations configurées sur les entités.
  options:
    a: { en: "/api is the default REST path, but this configuration changed it to /data.", fr: "/api est le chemin REST par défaut, mais cette configuration l'a remplacé par /data." }
    b: { en: "Swagger UI at /swagger is exposed only in development mode.", fr: "Swagger UI à l'adresse /swagger n'est exposé qu'en mode development." }
    d: { en: "Role-specific OpenAPI paths are available only in development mode.", fr: "Les chemins OpenAPI propres à un rôle ne sont disponibles qu'en mode development." }
references:
  - title: Swagger and OpenAPI metadata for REST endpoints - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/api/openapi
