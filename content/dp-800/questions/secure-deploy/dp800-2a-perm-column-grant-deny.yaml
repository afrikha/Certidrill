id: dp800-2a-perm-column-grant-deny
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance. The common criteria compliance enabled server configuration option is disabled. In a database named **HR**, you run the following statements:

    ```text
    DENY SELECT ON dbo.Employee TO Interns;
    GRANT SELECT ON dbo.Employee (EmployeeID, FullName) TO Interns;
    ```

    A user named **Tom** is a member of the **Interns** role and has no other permission on dbo.Employee. Tom runs the following query:

    ```text
    SELECT EmployeeID, FullName FROM dbo.Employee;
    ```

    What is the result?
  fr: |
    Vous disposez d'une instance SQL Server 2022. L'option de configuration de serveur common criteria compliance enabled est désactivée. Dans une base de données nommée **HR**, vous exécutez les instructions suivantes :

    ```text
    DENY SELECT ON dbo.Employee TO Interns;
    GRANT SELECT ON dbo.Employee (EmployeeID, FullName) TO Interns;
    ```

    Un utilisateur nommé **Tom** est membre du rôle **Interns** et n'a aucune autre autorisation sur dbo.Employee. Tom exécute la requête suivante :

    ```text
    SELECT EmployeeID, FullName FROM dbo.Employee;
    ```

    Quel est le résultat ?
body:
  options:
    - id: a
      text: { en: "The query fails, because a DENY always takes precedence over a GRANT.", fr: "La requête échoue, car un DENY l'emporte toujours sur un GRANT." }
    - id: b
      text: { en: "The query runs but returns no rows.", fr: "La requête s'exécute mais ne renvoie aucune ligne." }
    - id: c
      text: { en: "The query returns the two columns, because a table-level DENY doesn't take precedence over a column-level GRANT.", fr: "La requête renvoie les deux colonnes, car un DENY au niveau de la table ne l'emporte pas sur un GRANT au niveau des colonnes." }
    - id: d
      text: { en: "The query fails, because a column-level GRANT requires the OBJECT:: prefix.", fr: "La requête échoue, car un GRANT au niveau des colonnes exige le préfixe OBJECT::." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the SQL Server permission hierarchy, a table-level DENY does not take precedence over a column-level GRANT; this inconsistency is kept for backward compatibility. Tom can therefore read EmployeeID and FullName, while a SELECT that references any other column is still denied. The behavior differs only when Common Criteria compliance is enabled.
    fr: |
      Dans la hiérarchie des autorisations de SQL Server, un DENY au niveau de la table ne l'emporte pas sur un GRANT au niveau des colonnes ; cette incohérence est conservée pour la compatibilité descendante. Tom peut donc lire EmployeeID et FullName, alors qu'un SELECT qui référence une autre colonne reste refusé. Le comportement ne diffère que lorsque l'option common criteria compliance enabled est activée.
  options:
    a: { en: "DENY wins over GRANT at the same level, but the column-level GRANT is an exception to the table-level DENY.", fr: "DENY l'emporte sur GRANT au même niveau, mais le GRANT au niveau des colonnes fait exception au DENY au niveau de la table." }
    b: { en: "Permissions either allow or block the query; they never filter rows. Row filtering requires Row-Level Security.", fr: "Les autorisations autorisent ou bloquent la requête ; elles ne filtrent jamais les lignes. Le filtrage des lignes exige Row-Level Security." }
    d: { en: "The OBJECT:: prefix is optional in GRANT object permissions.", fr: "Le préfixe OBJECT:: est facultatif dans GRANT sur les autorisations d'objet." }
references:
  - title: GRANT object permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/grant-object-permissions-transact-sql
  - title: DENY Object Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-object-permissions-transact-sql
