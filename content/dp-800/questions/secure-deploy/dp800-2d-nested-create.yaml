id: dp800-2d-nested-create
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso exposes the dbo.Orders and dbo.OrderLines tables through Data API builder (DAB) as the entities Order and OrderLine. A relationship named lines is defined on Order, and the authenticated role has the create action on both entities.

    A checkout service must insert an order and all its lines with a single GraphQL mutation. You must not create new database objects.

    What should you configure?
  fr: |
    Contoso expose les tables dbo.Orders et dbo.OrderLines avec Data API builder (DAB) sous la forme des entités Order et OrderLine. Une relation nommée lines est définie sur Order, et le rôle authenticated dispose de l'action create sur les deux entités.

    Un service de paiement doit insérer une commande et toutes ses lignes avec une seule mutation GraphQL. Vous ne devez pas créer de nouveaux objets de base de données.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Set runtime.rest.request-body-strict to false.", fr: "Définir runtime.rest.request-body-strict sur false." } }
    - { id: b, text: { en: "Set runtime.graphql.depth-limit to null.", fr: "Définir runtime.graphql.depth-limit sur null." } }
    - { id: c, text: { en: "Set graphql.operation to mutation on the Order entity.", fr: "Définir graphql.operation sur mutation dans l'entité Order." } }
    - { id: d, text: { en: "Set runtime.graphql.multiple-mutations.create.enabled to true.", fr: "Définir runtime.graphql.multiple-mutations.create.enabled sur true." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      multiple-mutations.create.enabled, false by default, enables multi-entity create mutations: one GraphQL mutation can create an Order and its related OrderLine items through the relationship. The create permission is still checked on each entity, and the authenticated role already has it on both.
    fr: |
      multiple-mutations.create.enabled, à false par défaut, active les mutations de création multi-entités : une seule mutation GraphQL peut créer un élément Order et ses éléments OrderLine associés par la relation. L'autorisation create est toujours vérifiée sur chaque entité, et le rôle authenticated en dispose déjà sur les deux.
  options:
    a: { en: "request-body-strict applies to REST request bodies, not to GraphQL mutations.", fr: "request-body-strict s'applique aux corps des requêtes REST, pas aux mutations GraphQL." }
    b: { en: "null is already the default depth limit, and query depth doesn't enable nested creation.", fr: "null est déjà la limite de profondeur par défaut, et la profondeur des requêtes n'active pas la création imbriquée." }
    c: { en: "graphql.operation applies to stored procedure entities only.", fr: "graphql.operation ne s'applique qu'aux entités de procédure stockée." }
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
