id: dp800-2c-ctl-codeowners
objective: "2.3.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores SQL database projects in a GitHub repository. The branch protection rule of **main** requires a pull request with review from Code Owners. The file **.github/CODEOWNERS** on main contains the following lines:

    ```text
    *.sql                  @contoso/sql-devs
    /Database/             @contoso/dba
    /Database/Reference/   @contoso/data-stewards
    ```

    All three teams are visible and have write access to the repository.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso stocke des projets de base de données SQL dans un dépôt GitHub. La règle de protection de branche de **main** exige une pull request avec la révision des propriétaires du code. Le fichier **.github/CODEOWNERS** de main contient les lignes suivantes :

    ```text
    *.sql                  @contoso/sql-devs
    /Database/             @contoso/dba
    /Database/Reference/   @contoso/data-stewards
    ```

    Les trois équipes sont visibles et disposent d'un accès en écriture au dépôt.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A pull request into main that changes only /Database/Tables/Customer.sql requires an approval from a member of @contoso/dba.
        fr: Une pull request vers main qui modifie uniquement /Database/Tables/Customer.sql nécessite l'approbation d'un membre de @contoso/dba.
    - id: s2
      text:
        en: A pull request into main that changes only /Database/Reference/Country.sql requires an approval from a member of @contoso/dba.
        fr: Une pull request vers main qui modifie uniquement /Database/Reference/Country.sql nécessite l'approbation d'un membre de @contoso/dba.
    - id: s3
      text:
        en: A pull request into main that changes only /Scripts/cleanup.sql requires an approval from a member of @contoso/sql-devs.
        fr: Une pull request vers main qui modifie uniquement /Scripts/cleanup.sql nécessite l'approbation d'un membre de @contoso/sql-devs.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      In a CODEOWNERS file, the last matching pattern takes precedence. A file under /Database/Tables matches *.sql and /Database/, so @contoso/dba owns it. A file under /Database/Reference also matches the last line, so @contoso/data-stewards owns it instead of @contoso/dba. A .sql file outside /Database matches only *.sql. With review from Code Owners required, an approval from one owner of each changed file is needed.
    fr: |
      Dans un fichier CODEOWNERS, le dernier modèle correspondant est prioritaire. Un fichier sous /Database/Tables correspond à *.sql et à /Database/ : @contoso/dba en est propriétaire. Un fichier sous /Database/Reference correspond aussi à la dernière ligne : @contoso/data-stewards en est propriétaire à la place de @contoso/dba. Un fichier .sql hors de /Database ne correspond qu'à *.sql. Lorsque la révision des propriétaires du code est exigée, l'approbation d'un propriétaire de chaque fichier modifié est nécessaire.
references:
  - title: Implement CI/CD pipelines
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/06-implement-cicd-pipelines
