id: dp800-2a-ddm-function-match
objective: "2.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database that contains a table named **dbo.Contract**. You need to add dynamic data masks to four columns. Users without `UNMASK` must see the results described for each column.

    Which masking function should you use for each column? To answer, drag the appropriate functions to the correct columns. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database qui contient une table nommée **dbo.Contract**. Vous devez ajouter des masques dynamiques à quatre colonnes. Les utilisateurs sans `UNMASK` doivent voir les résultats décrits pour chaque colonne.

    Quelle fonction de masquage devez-vous utiliser pour chaque colonne ? Pour répondre, faites glisser les fonctions appropriées vers les colonnes correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: default, text: "default()" }
    - { id: email, text: "email()" }
    - { id: partial, text: "partial()" }
    - { id: random, text: "random()" }
    - { id: datetime, text: "datetime()" }
  targets:
    - id: terms
      text: { en: "ContractText (nvarchar(max)): the whole value is hidden", fr: "ContractText (nvarchar(max)) : toute la valeur est masquée" }
    - id: rate
      text: { en: "DiscountRate (decimal(5,2)): an arbitrary number between 1 and 50 is returned", fr: "DiscountRate (decimal(5,2)) : un nombre quelconque entre 1 et 50 est renvoyé" }
    - id: postal
      text: { en: "PostalCode (varchar(10)): only the first two characters are shown", fr: "PostalCode (varchar(10)) : seuls les deux premiers caractères sont affichés" }
    - id: signed
      text: { en: "SignedDate (date): the day of the month is hidden", fr: "SignedDate (date) : le jour du mois est masqué" }
answer:
  mapping: { terms: default, rate: random, postal: partial, signed: datetime }
explanation:
  correct:
    en: |
      default() fully masks a value according to its data type. random(start, end) replaces a numeric value with a random value in the range. partial(prefix, padding, suffix) exposes a chosen number of leading and trailing characters, here partial(2,"XXXX",0). datetime() masks one part of a date or time, here datetime("D") for the day. email() is designed for email addresses and is not needed.
    fr: |
      default() masque entièrement une valeur selon son type de données. random(start, end) remplace une valeur numérique par une valeur aléatoire de la plage. partial(prefix, padding, suffix) expose un nombre choisi de caractères au début et à la fin, ici partial(2,"XXXX",0). datetime() masque une partie d'une date ou d'une heure, ici datetime("D") pour le jour. email() est conçue pour les adresses e-mail et n'est pas nécessaire.
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking
