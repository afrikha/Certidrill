id: dp800-2a-audit-facts-yesno
objective: "2.1.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are configuring auditing for an Azure SQL logical server named **sql-fabrikam**. You plan to send the audit logs to a storage account and to a Log Analytics workspace.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez l'audit d'un serveur logique Azure SQL nommé **sql-fabrikam**. Vous prévoyez d'envoyer les journaux d'audit vers un compte de stockage et vers un espace de travail Log Analytics.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If the diagnostic setting that auditing created for the Log Analytics destination is deleted, audit records stop reaching the workspace.
        fr: |
          Si le paramètre de diagnostic créé par l'audit pour la destination Log Analytics est supprimé, les enregistrements d'audit n'arrivent plus dans l'espace de travail.
    - id: s2
      text:
        en: |
          The audit logs written to the storage account are .xel files that you can open in SQL Server Management Studio.
        fr: |
          Les journaux d'audit écrits dans le compte de stockage sont des fichiers .xel que vous pouvez ouvrir dans SQL Server Management Studio.
    - id: s3
      text:
        en: |
          A retention of 0 days for the storage account destination deletes the audit logs as soon as they are written.
        fr: |
          Une rétention de 0 jour pour la destination de compte de stockage supprime les journaux d'audit dès leur écriture.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Audit events sent to Log Analytics go through a diagnostic setting with the SQLSecurityAuditEvents category, named SQLSecurityAuditEvents_..., and if that diagnostic setting is deleted, auditing to the workspace fails silently. In the storage account, auditing writes append blobs in the .xel format, which SSMS can open. For a storage destination, the default retention of 0 means unlimited retention, not immediate deletion.
    fr: |
      Les événements d'audit envoyés à Log Analytics passent par un paramètre de diagnostic de catégorie SQLSecurityAuditEvents, nommé SQLSecurityAuditEvents_..., et si ce paramètre de diagnostic est supprimé, l'audit vers l'espace de travail échoue sans avertissement. Dans le compte de stockage, l'audit écrit des objets blob d'ajout au format .xel, que SSMS peut ouvrir. Pour une destination de stockage, la rétention par défaut de 0 signifie une rétention illimitée, pas une suppression immédiate.
references:
  - title: Set up Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-setup
  - title: Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
