id: dp800-2d-graphql-filter
objective: "2.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam exposes a table of sports products through the GraphQL endpoint of Data API builder (DAB). The GraphQL type of the Product entity has the singular name Product and the plural name Products.

    A search box must return the products whose name includes the text the user typed, such as helmet, with the highest list price first and 25 products per page. The client must know whether another page exists and how to request it.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam expose une table de produits de sport par le point de terminaison GraphQL de Data API builder (DAB). Le type GraphQL de l'entité Product a le nom singulier Product et le nom pluriel Products.

    Une zone de recherche doit renvoyer les produits dont le nom inclut le texte saisi par l'utilisateur, comme helmet, du prix catalogue le plus élevé au plus bas, 25 produits par page. Le client doit savoir si une autre page existe et comment la demander.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    {
      products(
        filter: { Name: { [[op]]: "helmet" } },
        orderBy: { ListPrice: [[dir]] },
        first: 25
      ) {
        items { ProductID Name ListPrice }
        [[more]]
        endCursor
      }
    }
  slots:
    - id: op
      options:
        - { id: eq, text: eq }
        - { id: contains, text: contains }
        - { id: neq, text: neq }
        - { id: isNull, text: isNull }
    - id: dir
      options:
        - { id: asc, text: ASC }
        - { id: desc, text: DESC }
    - id: more
      options:
        - { id: nextLink, text: nextLink }
        - { id: after, text: after }
        - { id: hasNextPage, text: hasNextPage }
answer:
  values: { op: contains, dir: desc, more: hasNextPage }
explanation:
  correct:
    en: |
      The GraphQL filter argument takes one operator object per field, and contains matches a value inside the text, which a search box needs. orderBy takes ASC or DESC for each field, so DESC returns the most expensive products first. When pagination applies, the response contains hasNextPage and endCursor; the client passes endCursor in the after argument of the next query.
    fr: |
      L'argument GraphQL filter prend un objet opérateur par champ, et contains recherche une valeur à l'intérieur du texte, ce dont une zone de recherche a besoin. orderBy prend ASC ou DESC pour chaque champ : DESC renvoie d'abord les produits les plus chers. Quand la pagination s'applique, la réponse contient hasNextPage et endCursor ; le client passe endCursor dans l'argument after de la requête suivante.
  options:
    eq: { en: "eq matches only names equal to helmet.", fr: "eq ne correspond qu'aux noms égaux à helmet." }
    neq: { en: "neq returns the products whose name is different from helmet.", fr: "neq renvoie les produits dont le nom est différent de helmet." }
    isNull: { en: "isNull tests whether the field is null; it doesn't search text.", fr: "isNull teste si le champ est null ; il ne recherche pas de texte." }
    asc: { en: "ASC returns the cheapest products first.", fr: "ASC renvoie d'abord les produits les moins chers." }
    nextLink: { en: "nextLink is returned by REST endpoints, not by GraphQL.", fr: "nextLink est renvoyé par les points de terminaison REST, pas par GraphQL." }
    after: { en: "after is an argument of the query, not a field of the response.", fr: "after est un argument de la requête, pas un champ de la réponse." }
references:
  - title: How to call GraphQL endpoints - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/api/graphql
