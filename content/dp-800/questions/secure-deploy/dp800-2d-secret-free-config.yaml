id: dp800-2d-secret-free-config
objective: "2.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum stores the dab-config.json file of its Data API builder (DAB) API in a Git repository. The data-source section currently contains a connection string with a SQL login name and its password. DAB runs in Azure Container Apps and connects to an Azure SQL database.

    You need to ensure that no database password is stored in the repository.

    What are two possible ways to achieve the goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke le fichier dab-config.json de son API Data API builder (DAB) dans un dépôt Git. La section data-source contient actuellement une chaîne de connexion avec un nom de connexion SQL et son mot de passe. DAB s'exécute dans Azure Container Apps et se connecte à une base de données Azure SQL.

    Vous devez vous assurer qu'aucun mot de passe de base de données n'est stocké dans le dépôt.

    Quelles sont les deux façons possibles d'atteindre cet objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set connection-string to \"@env('SQL_CONN')\" and define SQL_CONN as a secret environment variable of the container app.", fr: "Définir connection-string sur \"@env('SQL_CONN')\" et définir SQL_CONN comme variable d'environnement secrète de l'application conteneur." } }
    - { id: b, text: { en: "Set the data-source option set-session-context to true so that DAB sends the caller's claims instead of the password.", fr: "Définir l'option set-session-context de data-source sur true pour que DAB envoie les revendications de l'appelant à la place du mot de passe." } }
    - { id: c, text: { en: "Create a database user for the managed identity of the container app and use a connection string with Authentication=Active Directory Managed Identity.", fr: "Créer un utilisateur de base de données pour l'identité managée de l'application conteneur et utiliser une chaîne de connexion avec Authentication=Active Directory Managed Identity." } }
    - { id: d, text: { en: "Set runtime.host.mode to production so that DAB masks the connection string when it loads the file.", fr: "Définir runtime.host.mode sur production pour que DAB masque la chaîne de connexion au chargement du fichier." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The @env() function keeps the secret out of the file: the file contains only a reference, and the value comes from the container app at runtime. With a managed identity, the connection string contains no secret at all: Authentication=Active Directory Managed Identity is enough for a system-assigned identity (add User Id with the client ID for a user-assigned one), and the identity needs a database user.
    fr: |
      La fonction @env() garde le secret hors du fichier : le fichier ne contient qu'une référence, et la valeur vient de l'application conteneur à l'exécution. Avec une identité managée, la chaîne de connexion ne contient aucun secret : Authentication=Active Directory Managed Identity suffit pour une identité affectée par le système (ajoutez User Id avec l'ID client pour une identité affectée par l'utilisateur), et l'identité a besoin d'un utilisateur de base de données.
  options:
    b: { en: "set-session-context sends token claims to SESSION_CONTEXT; DAB still needs its own credentials to connect.", fr: "set-session-context envoie les revendications du jeton dans SESSION_CONTEXT ; DAB a toujours besoin de ses propres informations d'identification pour se connecter." }
    d: { en: "Host mode controls development features such as Swagger UI; the password would still be in the file in the repository.", fr: "Le mode d'hôte contrôle des fonctionnalités de développement comme Swagger UI ; le mot de passe resterait dans le fichier du dépôt." }
references:
  - title: Configuration schema - Data source section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/data-source
