id: dp800-2c-br-policy-statements
objective: "2.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores an SDK-style SQL database project in an Azure Repos Git repository. The **main** branch has two branch policies: a minimum number of reviewers (Required) and a build validation policy for the pipeline **sql-build** (Optional, trigger Automatic). No user has bypass permissions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso stocke un projet de base de données SQL de style SDK dans un dépôt Git Azure Repos. La branche **main** a deux stratégies de branche : un nombre minimal de réviseurs (Required) et une stratégie de validation de build pour le pipeline **sql-build** (Optional, déclencheur Automatic). Aucun utilisateur ne dispose d'autorisations de contournement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A direct push of a commit to main is rejected, so the change must go through a pull request.
        fr: |
          Un push direct d'une validation vers main est refusé : la modification doit passer par une pull request.
    - id: s2
      text:
        en: |
          A pull request whose sql-build run fails stays blocked, even after it gets the required approvals.
        fr: |
          Une pull request dont l'exécution de sql-build échoue reste bloquée, même après avoir obtenu les approbations requises.
    - id: s3
      text:
        en: |
          Creating a draft pull request into main queues sql-build.
        fr: |
          La création d'une pull request en mode brouillon vers main met sql-build en file d'attente.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A branch with at least one required policy rejects direct pushes from users without the Bypass policies when pushing permission. The build validation policy is Optional, so a failed build is reported but does not block completion. Draft pull requests don't trigger a pipeline, even when a build validation policy exists.
    fr: |
      Une branche dotée d'au moins une stratégie obligatoire refuse les push directs des utilisateurs qui n'ont pas l'autorisation de contourner les stratégies lors d'un push. La stratégie de validation de build est Optional : un échec est signalé mais ne bloque pas la fin de la pull request. Les pull requests en mode brouillon ne déclenchent pas de pipeline, même avec une stratégie de validation de build.
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
