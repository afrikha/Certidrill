id: dp800-2d-page-size
objective: "2.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove exposes a transactions table through Data API builder (DAB). The API is published behind a gateway that rewrites host names. The solution must meet the following requirements:

    - A request that doesn't specify a page size returns 500 items per page.
    - A client never receives more than 2,000 items in one response, even if it requests $first=-1.
    - The nextLink URL in REST responses doesn't contain the DAB host name.

    How should you complete the runtime section? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove expose une table de transactions avec Data API builder (DAB). L'API est publiée derrière une passerelle qui réécrit les noms d'hôte. La solution doit respecter les exigences suivantes :

    - Une requête qui ne précise pas de taille de page renvoie 500 éléments par page.
    - Un client ne reçoit jamais plus de 2 000 éléments dans une réponse, même s'il demande $first=-1.
    - L'URL nextLink des réponses REST ne contient pas le nom d'hôte de DAB.

    Comment devez-vous compléter la section runtime ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "runtime": {
      "pagination": {
        "default-page-size": [[dps]],
        "max-page-size": [[mps]],
        "next-link-relative": [[rel]]
      }
    }
  slots:
    - id: dps
      options:
        - { id: d100, text: "100" }
        - { id: d500, text: "500" }
        - { id: d2000, text: "2000" }
        - { id: dm1, text: "-1" }
    - id: mps
      options:
        - { id: m500, text: "500" }
        - { id: m2000, text: "2000" }
        - { id: mm1, text: "-1" }
        - { id: m100000, text: "100000" }
    - id: rel
      options:
        - { id: rtrue, text: "true" }
        - { id: rfalse, text: "false" }
answer:
  values: { dps: d500, mps: m2000, rel: rtrue }
explanation:
  correct:
    en: |
      default-page-size (100 by default) is the page size used when the request doesn't ask for one, so it's set to 500. max-page-size (100,000 by default) caps every request, and $first=-1 means "the maximum page size", so 2,000 is the limit. next-link-relative set to true returns nextLink as a relative URL such as /api/Transaction?$after=..., without the host name.
    fr: |
      default-page-size (100 par défaut) est la taille de page utilisée quand la requête n'en demande pas : elle vaut donc 500. max-page-size (100 000 par défaut) plafonne chaque requête, et $first=-1 signifie « la taille de page maximale » : la limite est 2 000. next-link-relative défini sur true renvoie nextLink sous forme d'URL relative, comme /api/Transaction?$after=..., sans le nom d'hôte.
  options:
    d100: { en: "100 is the default value, not the required 500.", fr: "100 est la valeur par défaut, pas les 500 exigés." }
    d2000: { en: "2,000 would be returned to every request without a page size; the default must be 500.", fr: "2 000 serait renvoyé à toute requête sans taille de page ; la valeur par défaut doit être 500." }
    dm1: { en: "-1 makes the default equal to the maximum page size.", fr: "-1 rend la valeur par défaut égale à la taille de page maximale." }
    m500: { en: "A maximum of 500 would cap requests that legitimately ask for up to 2,000 items.", fr: "Un maximum de 500 plafonnerait les requêtes qui demandent légitimement jusqu'à 2 000 éléments." }
    mm1: { en: "-1 means the maximum supported value, so clients could receive far more than 2,000 items.", fr: "-1 signifie la valeur maximale prise en charge : les clients pourraient recevoir bien plus de 2 000 éléments." }
    m100000: { en: "100,000 is the default maximum, above the required limit.", fr: "100 000 est le maximum par défaut, au-dessus de la limite exigée." }
    rfalse: { en: "false, the default, returns absolute nextLink URLs that contain the host name.", fr: "false, la valeur par défaut, renvoie des URL nextLink absolues qui contiennent le nom d'hôte." }
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
