id: dp800-2a-auth-entra-only-role
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL logical server named **sql-contoso**. A Microsoft Entra group named **sql-admins** is set as the Microsoft Entra admin of the server.

    You need to configure sql-contoso so that no SQL authentication login, including the server admin login, can connect to the server or its databases. Microsoft Entra principals must still be able to connect.

    An engineer named **Lee** will make the change. Lee currently has the SQL Server Contributor role on sql-contoso. The solution must follow the principle of least privilege.

    Which role should you assign to Lee on sql-contoso?
  fr: |
    Vous disposez d'un serveur logique Azure SQL nommé **sql-contoso**. Un groupe Microsoft Entra nommé **sql-admins** est défini comme administrateur Microsoft Entra du serveur.

    Vous devez configurer sql-contoso pour qu'aucune connexion d'authentification SQL, y compris la connexion d'administrateur du serveur, ne puisse se connecter au serveur ou à ses bases de données. Les principaux Microsoft Entra doivent toujours pouvoir se connecter.

    Un ingénieur nommé **Lee** effectuera la modification. Lee dispose actuellement du rôle SQL Server Contributor sur sql-contoso. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Lee sur sql-contoso ?
body:
  options:
    - { id: a, text: SQL DB Contributor }
    - { id: b, text: SQL Security Manager }
    - { id: c, text: Owner }
    - { id: d, text: User Access Administrator }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The requirement is met by enabling Microsoft Entra-only authentication, which disables SQL authentication for the server, its admin login included. Enabling or disabling this setting requires the azureADOnlyAuthentications actions, which SQL Security Manager has. SQL Server Contributor can set the Microsoft Entra admin but cannot change this setting, by design for separation of duties.
    fr: |
      L'exigence est satisfaite en activant l'authentification Microsoft Entra uniquement, qui désactive l'authentification SQL pour le serveur, connexion d'administrateur comprise. Activer ou désactiver ce paramètre exige les actions azureADOnlyAuthentications, dont dispose SQL Security Manager. SQL Server Contributor peut définir l'administrateur Microsoft Entra mais ne peut pas modifier ce paramètre, à dessein, pour la séparation des tâches.
  options:
    a: { en: "SQL DB Contributor manages databases and does not include the Microsoft Entra-only authentication actions.", fr: "SQL DB Contributor gère les bases de données et n'inclut pas les actions de l'authentification Microsoft Entra uniquement." }
    c: { en: "Owner can make the change but grants full control of the server and its access, which isn't least privilege.", fr: "Owner peut effectuer la modification mais accorde le contrôle total du serveur et de ses accès, ce qui n'est pas le moindre privilège." }
    d: { en: "User Access Administrator manages Azure role assignments, not the authentication settings of the server.", fr: "User Access Administrator gère les attributions de rôles Azure, pas les paramètres d'authentification du serveur." }
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
