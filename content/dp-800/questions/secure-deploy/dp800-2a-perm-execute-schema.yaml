id: dp800-2a-perm-execute-schema
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database. The **Reports** schema contains stored procedures that read tables in the **Sales** schema. All the objects are owned by dbo, and the procedures contain no dynamic SQL. New procedures are added to Reports every month.

    Members of the database role **ReportUsers** must be able to run every current and future procedure in Reports. They must not be able to query the Sales tables directly.

    Which statement should you run?
  fr: |
    Vous disposez d'une base de données Azure SQL Database. Le schéma **Reports** contient des procédures stockées qui lisent des tables du schéma **Sales**. Tous les objets appartiennent à dbo, et les procédures ne contiennent pas de SQL dynamique. De nouvelles procédures sont ajoutées à Reports chaque mois.

    Les membres du rôle de base de données **ReportUsers** doivent pouvoir exécuter toutes les procédures actuelles et futures de Reports. Ils ne doivent pas pouvoir interroger directement les tables de Sales.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - id: a
      text: "GRANT SELECT ON SCHEMA::Sales TO ReportUsers;"
    - id: b
      text: "GRANT EXECUTE ON SCHEMA::Reports TO ReportUsers;"
    - id: c
      text: "ALTER ROLE db_datareader ADD MEMBER ReportUsers;"
    - id: d
      text: "GRANT CONTROL ON SCHEMA::Reports TO ReportUsers;"
answer: { optionId: b }
explanation:
  correct:
    en: |
      EXECUTE granted on a schema applies to every procedure in it, including procedures created later. Because the procedures and the Sales tables have the same owner, the ownership chain is unbroken and SQL checks only the EXECUTE permission on the procedure, so ReportUsers need no permission on the tables.
    fr: |
      EXECUTE accordée sur un schéma s'applique à toutes ses procédures, y compris celles créées ensuite. Comme les procédures et les tables de Sales ont le même propriétaire, la chaîne de propriétés n'est pas rompue et SQL ne vérifie que l'autorisation EXECUTE sur la procédure : ReportUsers n'a besoin d'aucune autorisation sur les tables.
  options:
    a: { en: "This lets ReportUsers query the Sales tables directly, which the requirements forbid.", fr: "Cette instruction permet à ReportUsers d'interroger directement les tables de Sales, ce que les exigences interdisent." }
    c: { en: "db_datareader grants SELECT on every table of the database and no EXECUTE permission.", fr: "db_datareader accorde SELECT sur toutes les tables de la base et aucune autorisation EXECUTE." }
    d: { en: "CONTROL grants ownership-like rights on the schema, far more than running the procedures.", fr: "CONTROL accorde des droits équivalents à ceux du propriétaire sur le schéma, bien plus que l'exécution des procédures." }
references:
  - title: Managing Permissions with Stored Procedures in SQL Server
    url: https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/sql/managing-permissions-with-stored-procedures-in-sql-server
  - title: Permissions (Database Engine)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/permissions-database-engine
