id: dp800-2a-audit-sqlserver-order
objective: "2.1.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance named **SQL1** that hosts a database named **HR**.

    You need to record every SELECT and UPDATE statement that any user runs on **dbo.Salary**, and only those statements. The records must be written to files in `D:\Audit\`, and you must then review them.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une instance SQL Server 2022 nommée **SQL1** qui héberge une base de données nommée **HR**.

    Vous devez enregistrer chaque instruction SELECT et UPDATE qu'un utilisateur exécute sur **dbo.Salary**, et uniquement ces instructions. Les enregistrements doivent être écrits dans des fichiers de `D:\Audit\`, puis vous devez les consulter.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: audit, text: { en: "Create a server audit that targets files in D:\\Audit\\, and then enable it with ALTER SERVER AUDIT ... WITH (STATE = ON).", fr: "Créer un audit de serveur qui cible des fichiers dans D:\\Audit\\, puis l'activer avec ALTER SERVER AUDIT ... WITH (STATE = ON)." } }
    - { id: spec, text: { en: "In HR, create and enable a database audit specification for the server audit that contains SELECT and UPDATE ON dbo.Salary BY public.", fr: "Dans HR, créer et activer une spécification d'audit de base de données pour l'audit de serveur qui contient SELECT et UPDATE ON dbo.Salary BY public." } }
    - { id: read, text: { en: "Read the records by querying sys.fn_get_audit_file.", fr: "Lire les enregistrements en interrogeant sys.fn_get_audit_file." } }
    - { id: srvspec, text: { en: "Create a server audit specification that contains BATCH_COMPLETED_GROUP.", fr: "Créer une spécification d'audit de serveur qui contient BATCH_COMPLETED_GROUP." } }
    - { id: dmk, text: { en: "Create a database master key in HR.", fr: "Créer une clé principale de base de données dans HR." } }
    - { id: tde, text: { en: "Enable transparent data encryption on HR.", fr: "Activer le chiffrement transparent des données sur HR." } }
answer:
  sequence: [audit, spec, read]
explanation:
  correct:
    en: |
      The server audit defines the target and is created disabled, so it must be enabled. The database audit specification references the server audit in its FOR SERVER AUDIT clause, so the audit must exist first; it maps the SELECT and UPDATE actions on dbo.Salary to that audit, and BY public covers every user because all database users are members of public. You then read the .sqlaudit files with sys.fn_get_audit_file.
    fr: |
      L'audit de serveur définit la cible et est créé désactivé : il doit donc être activé. La spécification d'audit de base de données référence l'audit de serveur dans sa clause FOR SERVER AUDIT : l'audit doit donc exister d'abord ; elle associe les actions SELECT et UPDATE sur dbo.Salary à cet audit, et BY public couvre tous les utilisateurs, car tous les utilisateurs de base de données sont membres de public. Vous lisez ensuite les fichiers .sqlaudit avec sys.fn_get_audit_file.
  options:
    srvspec: { en: "BATCH_COMPLETED_GROUP records every batch on the instance, not only the statements on dbo.Salary.", fr: "BATCH_COMPLETED_GROUP enregistre chaque lot de l'instance, pas seulement les instructions sur dbo.Salary." }
    dmk: { en: "SQL Server Audit doesn't need a database master key.", fr: "SQL Server Audit n'a pas besoin de clé principale de base de données." }
    tde: { en: "TDE encrypts data at rest; it doesn't record any activity.", fr: "TDE chiffre les données au repos ; il n'enregistre aucune activité." }
references:
  - title: SQL Server Audit (Database Engine)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/auditing/sql-server-audit-database-engine
