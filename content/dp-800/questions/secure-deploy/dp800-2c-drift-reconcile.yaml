id: dp800-2c-drift-reconcile
objective: "2.3.7"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Tailspin stores an SDK-style SQL database project named **BookingDb** in Git. Changes reach **main** only through pull requests. A drift check found two objects in the production database that are not in the project:

    - The index **IX_Booking_Date**, a hotfix that must become part of the project.
    - The table **dbo.AgentHeartbeat**, created by a monitoring agent, which must not be added to the project.

    You need to bring the index into the project by using Visual Studio Code. The pull request must contain only the index, and the project must build before you push.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin stocke un projet de base de données SQL de style SDK nommé **BookingDb** dans Git. Les modifications n'atteignent **main** que par des pull requests. Une vérification de dérive a trouvé deux objets de la base de données de production qui ne font pas partie du projet :

    - L'index **IX_Booking_Date**, un correctif qui doit intégrer le projet.
    - La table **dbo.AgentHeartbeat**, créée par un agent de supervision, qui ne doit pas être ajoutée au projet.

    Vous devez intégrer l'index au projet avec Visual Studio Code. La pull request ne doit contenir que l'index, et le projet doit se générer avant que vous ne poussiez.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: branch, text: { en: "Create a branch from main.", fr: "Créer une branche à partir de main." } }
    - { id: compare, text: { en: "Run a schema comparison with the production database as the source and the project as the target.", fr: "Exécuter une comparaison de schémas avec la base de données de production comme source et le projet comme cible." } }
    - { id: exclude, text: { en: "Exclude dbo.AgentHeartbeat from the results, and apply the remaining change to the project.", fr: "Exclure dbo.AgentHeartbeat des résultats, puis appliquer la modification restante au projet." } }
    - { id: build, text: { en: "Run dotnet build on BookingDb.sqlproj.", fr: "Exécuter dotnet build sur BookingDb.sqlproj." } }
    - { id: pr, text: { en: "Commit and push the branch, and then open a pull request into main.", fr: "Valider et pousser la branche, puis ouvrir une pull request vers main." } }
    - { id: reverse, text: { en: "Run a schema comparison with the project as the source and the production database as the target, and then apply the changes.", fr: "Exécuter une comparaison de schémas avec le projet comme source et la base de données de production comme cible, puis appliquer les modifications." } }
    - { id: dropall, text: { en: "Publish the project to production with /p:DropObjectsNotInSource=true.", fr: "Publier le projet en production avec /p:DropObjectsNotInSource=true." } }
answer:
  sequence: [ branch, compare, exclude, build, pr ]
explanation:
  correct:
    en: |
      Work happens in a branch because main changes only through pull requests. Comparing the database (source) with the project (target) shows the drifted objects as additions to the project; excluding the monitoring table and applying the rest writes only the index file. Building validates the result, and the pull request brings the hotfix into main for review.
    fr: |
      Le travail se fait dans une branche, car main ne change que par des pull requests. Comparer la base de données (source) au projet (cible) présente les objets en dérive comme des ajouts au projet ; exclure la table de supervision et appliquer le reste n'écrit que le fichier de l'index. La génération valide le résultat, et la pull request intègre le correctif dans main pour révision.
  options:
    reverse: { en: "With the project as the source, applying the changes would delete the index and the table from production.", fr: "Avec le projet comme source, appliquer les modifications supprimerait l'index et la table de la production." }
    dropall: { en: "This drops both objects from production instead of adding the index to the project.", fr: "Cela supprime les deux objets de la production au lieu d'ajouter l'index au projet." }
references:
  - title: Schema comparison overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/schema-comparison
  - title: Detect and resolve schema drift
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/05-detect-resolve-schema-drift
