id: dp800-2d-function-trigger-grants
objective: "2.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam deploys an Azure Functions app that uses an Azure SQL trigger on the dbo.Shipments table. Change tracking is enabled on the database and on dbo.Shipments. The function connects with its managed identity, which has a database user that is a member of db_datareader and db_datawriter.

    The trigger fails to start because of missing permissions. You need to fix the issue. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Fabrikam déploie une application Azure Functions qui utilise un déclencheur Azure SQL sur la table dbo.Shipments. Le suivi des modifications est activé sur la base de données et sur dbo.Shipments. La fonction se connecte avec son identité managée, qui dispose d'un utilisateur de base de données membre de db_datareader et db_datawriter.

    Le déclencheur ne démarre pas en raison d'autorisations manquantes. Vous devez résoudre le problème. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the user to the db_owner role so that the trigger can create and read all the objects it needs.", fr: "Ajouter l'utilisateur au rôle db_owner pour que le déclencheur puisse créer et lire tous les objets dont il a besoin." } }
    - { id: b, text: { en: "Enable change data capture on dbo.Shipments and grant SELECT on the cdc schema.", fr: "Activer la capture des données modifiées sur dbo.Shipments et accorder SELECT sur le schéma cdc." } }
    - { id: c, text: { en: "Grant VIEW DATABASE STATE to the user so that the trigger can read the change tracking metadata.", fr: "Accorder VIEW DATABASE STATE à l'utilisateur pour que le déclencheur puisse lire les métadonnées du suivi des modifications." } }
    - { id: d, text: { en: "Grant VIEW CHANGE TRACKING on dbo.Shipments, and the rights to create and use the az_func schema and its tables.", fr: "Accorder VIEW CHANGE TRACKING sur dbo.Shipments, ainsi que les droits de créer et d'utiliser le schéma az_func et ses tables." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      db_datareader and db_datawriter aren't enough for the SQL trigger. Its identity needs SELECT and VIEW CHANGE TRACKING on the monitored table, plus CREATE TABLE and CREATE SCHEMA (or an existing az_func schema with ALTER and SELECT, INSERT, UPDATE, DELETE on it), because the trigger stores its leases and state in tables of the az_func schema.
    fr: |
      db_datareader et db_datawriter ne suffisent pas pour le déclencheur SQL. Son identité a besoin de SELECT et VIEW CHANGE TRACKING sur la table surveillée, ainsi que de CREATE TABLE et CREATE SCHEMA (ou d'un schéma az_func existant avec ALTER et SELECT, INSERT, UPDATE, DELETE sur celui-ci), car le déclencheur stocke ses baux et son état dans des tables du schéma az_func.
  options:
    a: { en: "db_owner would work but grants full control of the database, which breaks least privilege.", fr: "db_owner fonctionnerait, mais accorde le contrôle total de la base de données, ce qui enfreint le privilège minimum." }
    b: { en: "The SQL trigger is built on change tracking, not on change data capture.", fr: "Le déclencheur SQL repose sur le suivi des modifications, pas sur la capture des données modifiées." }
    c: { en: "VIEW DATABASE STATE exposes DMVs; it doesn't allow reading change tracking information or creating the az_func objects.", fr: "VIEW DATABASE STATE expose les DMV ; elle ne permet ni de lire les informations de suivi des modifications ni de créer les objets az_func." }
references:
  - title: Azure SQL trigger for Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-azure-sql-trigger
