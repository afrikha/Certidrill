id: dp800-2a-perm-dynamic-sql
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database. The stored procedure **Api.usp_SearchOrders** builds a parameterized query string and runs it with `sp_executesql` against **Sales.Orders**. The procedure and the table are owned by dbo.

    Members of the database role **WebApp** have `EXECUTE` on the Api schema. When they run the procedure, it fails with the error "The SELECT permission was denied on the object 'Orders'".

    WebApp members must be able to run the procedure. They must not receive any permission on the Sales tables, and the query logic of the procedure must not change.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL Database. La procédure stockée **Api.usp_SearchOrders** construit une chaîne de requête paramétrable et l'exécute avec `sp_executesql` sur **Sales.Orders**. La procédure et la table appartiennent à dbo.

    Les membres du rôle de base de données **WebApp** disposent de `EXECUTE` sur le schéma Api. Lorsqu'ils exécutent la procédure, elle échoue avec l'erreur « The SELECT permission was denied on the object 'Orders' ».

    Les membres de WebApp doivent pouvoir exécuter la procédure. Ils ne doivent recevoir aucune autorisation sur les tables de Sales, et la logique de requête de la procédure ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Grant SELECT on Sales.Orders to WebApp.", fr: "Accorder SELECT sur Sales.Orders à WebApp." }
    - id: b
      text: { en: "Enable the cross db ownership chaining server option.", fr: "Activer l'option de serveur cross db ownership chaining." }
    - id: c
      text: { en: "Replace sp_executesql with EXEC (@sql) in the procedure.", fr: "Remplacer sp_executesql par EXEC (@sql) dans la procédure." }
    - id: d
      text: { en: "Alter the procedure to add the WITH EXECUTE AS OWNER clause.", fr: "Modifier la procédure pour ajouter la clause WITH EXECUTE AS OWNER." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Ownership chaining doesn't apply to dynamic SQL run inside a module, so the caller's own permissions are checked on Sales.Orders. With EXECUTE AS OWNER, the procedure runs in the security context of its owner (dbo), which can read the table, while callers still need only EXECUTE on the procedure. Signing the procedure with a certificate is another option.
    fr: |
      Le chaînage des propriétés ne s'applique pas au SQL dynamique exécuté dans un module : ce sont les autorisations de l'appelant qui sont vérifiées sur Sales.Orders. Avec EXECUTE AS OWNER, la procédure s'exécute dans le contexte de sécurité de son propriétaire (dbo), qui peut lire la table, alors que les appelants n'ont toujours besoin que d'EXECUTE sur la procédure. Signer la procédure avec un certificat est une autre option.
  options:
    a: { en: "This gives WebApp a direct permission on a Sales table, which the requirements forbid.", fr: "Cette action donne à WebApp une autorisation directe sur une table de Sales, ce que les exigences interdisent." }
    b: { en: "Cross-database ownership chaining concerns objects in different databases; the chain is broken here by dynamic SQL.", fr: "Le chaînage des propriétés entre bases de données concerne des objets de bases différentes ; ici, la chaîne est rompue par le SQL dynamique." }
    c: { en: "EXEC (@sql) is dynamic SQL too, so the permission is still checked against the caller, and it loses parameterization.", fr: "EXEC (@sql) est aussi du SQL dynamique : l'autorisation est toujours vérifiée pour l'appelant, et la paramétrisation est perdue." }
references:
  - title: EXECUTE AS clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/execute-as-clause-transact-sql
  - title: Describe database and object permissions
    url: https://learn.microsoft.com/en-us/training/modules/configure-database-authentication-authorization/5-describe-database-object-permissions
