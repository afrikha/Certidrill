id: dp800-2c-drift-statements
objective: "2.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys an SDK-style SQL database project named **LedgerDb** with SqlPackage and the default publish properties. A DBA has created the table **dbo.MonitorSnapshot** directly in the production database; the table is not in the project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie un projet de base de données SQL de style SDK nommé **LedgerDb** avec SqlPackage et les propriétés de publication par défaut. Un DBA a créé la table **dbo.MonitorSnapshot** directement dans la base de données de production ; la table ne fait pas partie du projet.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A schema comparison with the project as the source and the production database as the target lists dbo.MonitorSnapshot as a difference whose action deletes it from the database.
        fr: Une comparaison de schémas avec le projet comme source et la base de données de production comme cible liste dbo.MonitorSnapshot comme une différence dont l'action la supprime de la base de données.
    - id: s2
      text:
        en: The next publish of the project to production drops dbo.MonitorSnapshot.
        fr: La prochaine publication du projet en production supprime dbo.MonitorSnapshot.
    - id: s3
      text:
        en: SqlPackage DriftReport lists the changes made to a database since it was last registered as a data-tier application.
        fr: SqlPackage DriftReport liste les modifications apportées à une base de données depuis sa dernière inscription comme application de la couche Données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Schema comparison lists the actions that make the target match the source, so an object that exists only in the target appears with a delete action. A publish drops objects that are not in the .dacpac only when DropObjectsNotInSource is True, and its default is False. DriftReport compares a registered database with its registration and reports the changes made since then.
    fr: |
      La comparaison de schémas liste les actions qui alignent la cible sur la source : un objet présent uniquement dans la cible apparaît avec une action de suppression. Une publication ne supprime les objets absents du .dacpac que si DropObjectsNotInSource vaut True, et sa valeur par défaut est False. DriftReport compare une base de données inscrite à son inscription et signale les modifications apportées depuis.
references:
  - title: Schema comparison overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/schema-comparison
  - title: SqlPackage Publish
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-publish
