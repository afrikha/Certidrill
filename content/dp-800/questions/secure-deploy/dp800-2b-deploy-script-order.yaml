id: dp800-2b-deploy-script-order
objective: "2.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin publishes a .dacpac file built from a SQL database project to an existing database by using SqlPackage. The project has a pre-deployment script that copies data out of a column that the new version drops, and a post-deployment script that applies lookup data with `MERGE` statements.

    Which four steps occur during the publish operation, in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Tailspin publie avec SqlPackage, sur une base existante, un fichier .dacpac généré à partir d'un projet de base de données SQL. Le projet comporte un script de prédéploiement qui copie les données d'une colonne supprimée par la nouvelle version, et un script de post-déploiement qui applique des données de recherche avec des instructions `MERGE`.

    Quelles sont les quatre étapes de l'opération de publication, dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: plan
      text:
        en: |
          SqlPackage compares the model in the .dacpac with the target database and calculates the deployment plan.
        fr: |
          Comparaison du modèle du fichier .dacpac avec la base cible et calcul du plan de déploiement par SqlPackage.
    - id: pre
      text:
        en: |
          The pre-deployment script runs and copies the data out of the column.
        fr: |
          Exécution du script de prédéploiement, qui copie les données de la colonne.
    - id: schema
      text:
        en: |
          The schema changes of the deployment plan run, including the column drop.
        fr: |
          Exécution des modifications de schéma du plan de déploiement, y compris la suppression de la colonne.
    - id: post
      text:
        en: |
          The post-deployment script runs and applies the lookup data.
        fr: |
          Exécution du script de post-déploiement, qui applique les données de recherche.
    - id: replan
      text:
        en: |
          SqlPackage recalculates the deployment plan to include the changes made by the pre-deployment script.
        fr: |
          Nouveau calcul du plan de déploiement par SqlPackage pour inclure les modifications du script de prédéploiement.
    - id: compile
      text:
        en: |
          SqlPackage compiles the lookup data scripts into the database model.
        fr: |
          Compilation des scripts de données de recherche dans le modèle de base de données par SqlPackage.
answer:
  sequence: [plan, pre, schema, post]
explanation:
  correct:
    en: |
      The deployment plan is calculated before the pre-deployment script runs, so that script doesn't affect the plan. The pre-deployment script then prepares the data, the plan applies the schema changes, and the post-deployment script runs after the plan completes, when the lookup tables have their final schema. Both scripts run on every deployment.
    fr: |
      Le plan de déploiement est calculé avant l'exécution du script de prédéploiement : ce script n'affecte donc pas le plan. Le script de prédéploiement prépare ensuite les données, le plan applique les modifications de schéma, et le script de post-déploiement s'exécute une fois le plan terminé, lorsque les tables de recherche ont leur schéma final. Les deux scripts s'exécutent à chaque déploiement.
  options:
    replan: { en: "The plan is calculated once, before the pre-deployment script; the script doesn't change it.", fr: "Le plan est calculé une seule fois, avant le script de prédéploiement ; le script ne le modifie pas." }
    compile: { en: "Pre- and post-deployment scripts are packaged in the .dacpac but never compiled into or validated against the model.", fr: "Les scripts de prédéploiement et de post-déploiement sont empaquetés dans le fichier .dacpac, mais jamais compilés dans le modèle ni validés par rapport à celui-ci." }
references:
  - title: Pre-deployment and post-deployment scripts
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts
