id: dp800-2b-refdata-env-vars
objective: "2.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum deploys one SQL database project to development, test and production databases from an Azure DevOps pipeline that runs SqlPackage in each stage. The post-deployment script contains a `MERGE` statement that loads demonstration customers.

    You need to ensure that the demonstration customers are loaded only in the development and test databases. The solution must use a single project and must not load the data in production, even if a stage is misconfigured.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie un projet de base de données SQL unique sur des bases de développement, de test et de production à partir d'un pipeline Azure DevOps qui exécute SqlPackage dans chaque phase. Le script de post-déploiement contient une instruction `MERGE` qui charge des clients de démonstration.

    Vous devez faire en sorte que les clients de démonstration ne soient chargés que dans les bases de développement et de test. La solution doit utiliser un projet unique et ne doit pas charger les données en production, même si une phase est mal configurée.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |
          Declare a SqlCmdVariable item named Environment in the .sqlproj file.
        fr: |
          Déclarer un élément SqlCmdVariable nommé Environment dans le fichier .sqlproj.
    - id: b
      text:
        en: |
          Set the DefaultValue of the Environment variable to prod so that the production stage doesn't need to pass a value.
        fr: |
          Définir la valeur DefaultValue de la variable Environment sur prod pour que la phase de production n'ait pas à transmettre de valeur.
    - id: c
      text:
        en: |
          Wrap the MERGE statement in IF '$(Environment)' IN ('dev', 'test').
        fr: |
          Encadrer l'instruction MERGE par IF '$(Environment)' IN ('dev', 'test').
    - id: d
      text:
        en: |
          Pass /v:Environment=dev, test or prod to SqlPackage in the matching stage.
        fr: |
          Transmettre /v:Environment=dev, test ou prod à SqlPackage dans la phase correspondante.
    - id: e
      text:
        en: |
          Wrap the MERGE statement in IF '$(Environment)' <> 'prod'.
        fr: |
          Encadrer l'instruction MERGE par IF '$(Environment)' <> 'prod'.
    - id: f
      text:
        en: |
          Move the MERGE statement to the pre-deployment script of the project.
        fr: |
          Déplacer l'instruction MERGE dans le script de prédéploiement du projet.
answer: { optionIds: [a, c, d] }
explanation:
  correct:
    en: |
      A SQLCMD variable declared in the project is referenced in scripts as $(Environment) and receives its value at deployment through SqlPackage /v:. If a stage doesn't supply a value, the variable resolves to an empty string, because the default value isn't compiled into the .dacpac. Testing for the allowed values dev and test therefore loads nothing when the value is missing or wrong.
    fr: |
      Une variable SQLCMD déclarée dans le projet est référencée dans les scripts sous la forme $(Environment) et reçoit sa valeur au déploiement via SqlPackage /v:. Si une phase ne fournit pas de valeur, la variable devient une chaîne vide, car la valeur par défaut n'est pas compilée dans le fichier .dacpac. Tester les valeurs autorisées dev et test ne charge donc rien lorsque la valeur est absente ou erronée.
  options:
    b: { en: "DefaultValue only pre-fills publish dialogs; at the command line a missing value becomes an empty string.", fr: "DefaultValue ne fait que préremplir les boîtes de dialogue de publication ; en ligne de commande, une valeur absente devient une chaîne vide." }
    e: { en: "An empty or misspelled value isn't 'prod', so a misconfigured production stage would load the demonstration customers.", fr: "Une valeur vide ou mal orthographiée n'est pas 'prod' : une phase de production mal configurée chargerait les clients de démonstration." }
    f: { en: "The pre-deployment script runs before the schema changes and still needs the same condition; it doesn't solve the environment problem.", fr: "Le script de prédéploiement s'exécute avant les modifications de schéma et nécessite la même condition ; il ne résout pas le problème d'environnement." }
references:
  - title: SQLCMD variables overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/sqlcmd-variables
