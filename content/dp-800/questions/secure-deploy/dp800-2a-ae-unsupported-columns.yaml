id: dp800-2a-ae-unsupported-columns
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database that contains the following table.

    ```text
    CREATE TABLE dbo.Customer (
        CustomerID  int IDENTITY(1,1) PRIMARY KEY,
        TaxNumber   char(11) COLLATE Latin1_General_BIN2 NOT NULL,
        BirthDate   date NULL,
        CreditLimit decimal(12,2) NULL,
        Preferences xml NULL);
    ```

    You plan to protect the columns by using Always Encrypted without secure enclaves.

    Which two columns must remain in plaintext?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database qui contient la table suivante.

    ```text
    CREATE TABLE dbo.Customer (
        CustomerID  int IDENTITY(1,1) PRIMARY KEY,
        TaxNumber   char(11) COLLATE Latin1_General_BIN2 NOT NULL,
        BirthDate   date NULL,
        CreditLimit decimal(12,2) NULL,
        Preferences xml NULL);
    ```

    Vous prévoyez de protéger les colonnes à l'aide d'Always Encrypted sans enclave sécurisée.

    Quelles sont les deux colonnes qui doivent rester en clair ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: TaxNumber }
    - { id: b, text: CustomerID }
    - { id: c, text: BirthDate }
    - { id: d, text: Preferences }
    - { id: e, text: CreditLimit }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Always Encrypted does not support IDENTITY columns or the xml data type, so CustomerID and Preferences cannot be encrypted. The other columns use supported types; TaxNumber already has the _BIN2 collation that encrypted string columns require.
    fr: |
      Always Encrypted ne prend pas en charge les colonnes IDENTITY ni le type de données xml : CustomerID et Preferences ne peuvent pas être chiffrées. Les autres colonnes utilisent des types pris en charge ; TaxNumber a déjà le classement _BIN2 exigé pour les colonnes de chaînes chiffrées.
  options:
    a: { en: "A char column with a _BIN2 collation can be encrypted, deterministically if it is used for lookups.", fr: "Une colonne char avec un classement _BIN2 peut être chiffrée, de façon déterministe si elle sert aux recherches." }
    c: { en: "The date type is supported by Always Encrypted.", fr: "Le type date est pris en charge par Always Encrypted." }
    e: { en: "The decimal type is supported by Always Encrypted.", fr: "Le type decimal est pris en charge par Always Encrypted." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
