id: dp800-2b-querystore-readonly
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a database in Azure SQL Database. Query Performance Insight has shown no new query data for three days. You run the following query.

    ```sql
    SELECT actual_state_desc, desired_state_desc, readonly_reason,
           current_storage_size_mb, max_storage_size_mb
    FROM sys.database_query_store_options;
    ```

    The query returns `READ_ONLY`, `READ_WRITE`, `65536`, `1024` and `1024`.

    You need Query Store to resume capturing data. The solution must keep the data already collected.

    What should you do?
  fr: |
    Fabrikam dispose d'une base de données dans Azure SQL Database. Query Performance Insight n'affiche plus aucune nouvelle donnée de requête depuis trois jours. Vous exécutez la requête suivante.

    ```sql
    SELECT actual_state_desc, desired_state_desc, readonly_reason,
           current_storage_size_mb, max_storage_size_mb
    FROM sys.database_query_store_options;
    ```

    La requête renvoie `READ_ONLY`, `READ_WRITE`, `65536`, `1024` et `1024`.

    Vous devez faire en sorte que le Magasin des requêtes recommence à capturer des données. La solution doit conserver les données déjà collectées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: "ALTER DATABASE CURRENT SET QUERY_STORE CLEAR;"
    - id: b
      text: "ALTER DATABASE CURRENT SET QUERY_STORE (QUERY_CAPTURE_MODE = ALL);"
    - id: c
      text: "ALTER DATABASE CURRENT SET QUERY_STORE (MAX_STORAGE_SIZE_MB = 4096);"
    - id: d
      text: "ALTER DATABASE CURRENT SET AUTOMATIC_TUNING (FORCE_LAST_GOOD_PLAN = ON);"
answer: { optionId: c }
explanation:
  correct:
    en: |
      When actual_state_desc differs from desired_state_desc, Query Store has changed mode by itself; readonly_reason 65536 means that the size quota was exceeded, as the equal current and maximum sizes confirm. Raising MAX_STORAGE_SIZE_MB gives Query Store room to capture again without deleting history; size-based cleanup set to AUTO helps prevent a recurrence.
    fr: |
      Lorsque actual_state_desc diffère de desired_state_desc, le Magasin des requêtes a changé de mode de lui-même ; readonly_reason 65536 signifie que le quota de taille a été dépassé, ce que confirment les tailles actuelle et maximale identiques. Augmenter MAX_STORAGE_SIZE_MB donne au Magasin des requêtes la place de capturer de nouveau sans supprimer l'historique ; le nettoyage basé sur la taille défini sur AUTO aide à éviter que cela se reproduise.
  options:
    a:
      en: |
        Clearing Query Store frees space but deletes all the collected telemetry.
      fr: |
        Vider le Magasin des requêtes libère de l'espace, mais supprime toute la télémétrie collectée.
    b:
      en: |
        Capturing all queries uses more space; the recommended capture mode is AUTO, and Query Store stays read-only while the quota is exceeded.
      fr: |
        Capturer toutes les requêtes consomme plus d'espace ; le mode de capture recommandé est AUTO, et le Magasin des requêtes reste en lecture seule tant que le quota est dépassé.
    d:
      en: |
        Automatic plan correction relies on Query Store data; it doesn't fix the storage quota.
      fr: |
        La correction automatique des plans s'appuie sur les données du Magasin des requêtes ; elle ne règle pas le quota de stockage.
references:
  - title: Best practices for monitoring workloads with Query Store
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/best-practice-with-the-query-store
  - title: Query Performance Insight for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/query-performance-insight-use
