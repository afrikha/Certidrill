id: dp800-2b-refdata-sqlproj
objective: "2.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has an SDK-style SQL database project. You add two files:

    - `Scripts\PostDeployment\PostDeploy.sql`, which must run after every deployment.
    - `Scripts\PostDeployment\Region.data.sql`, which contains a `MERGE` statement for the `dbo.Region` lookup table and must run from `PostDeploy.sql`.

    The build currently fails because it tries to compile `Region.data.sql` as a database object. `Region.data.sql` must stay visible in the project view.

    How should you complete the project file and the post-deployment script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un projet de base de données SQL de style SDK. Vous ajoutez deux fichiers :

    - `Scripts\PostDeployment\PostDeploy.sql`, qui doit s'exécuter après chaque déploiement.
    - `Scripts\PostDeployment\Region.data.sql`, qui contient une instruction `MERGE` pour la table de recherche `dbo.Region` et doit s'exécuter depuis `PostDeploy.sql`.

    Le build échoue actuellement, car il tente de compiler `Region.data.sql` comme un objet de base de données. `Region.data.sql` doit rester visible dans la vue du projet.

    Comment devez-vous compléter le fichier projet et le script de post-déploiement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    <!-- LitwareDb.sqlproj -->
    <ItemGroup>
      <[[s1]]="Scripts\PostDeployment\PostDeploy.sql" />
      <[[s2]]="Scripts\PostDeployment\Region.data.sql" />
      <None Include="Scripts\PostDeployment\Region.data.sql" />
    </ItemGroup>

    -- Scripts\PostDeployment\PostDeploy.sql
    [[s3]] .\Region.data.sql
  slots:
    - id: s1
      options:
        - { id: predeploy, text: PreDeploy Include }
        - { id: postdeploy, text: PostDeploy Include }
        - { id: buildinc, text: Build Include }
        - { id: noneinc, text: None Include }
    - id: s2
      options:
        - { id: buildrem, text: Build Remove }
        - { id: buildinc2, text: Build Include }
        - { id: postdeploy2, text: PostDeploy Include }
        - { id: noneremove, text: None Remove }
    - id: s3
      options:
        - { id: r, text: ":r" }
        - { id: setvar, text: ":setvar" }
        - { id: exec, text: EXEC }
        - { id: connect, text: ":connect" }
answer:
  values: { s1: postdeploy, s2: buildrem, s3: r }
explanation:
  correct:
    en: |
      A PostDeploy item declares the project's single post-deployment script. Files pulled in with :r must be excluded from the model build with Build Remove; in SDK-style projects, Build Remove also hides the file, so it is re-added as a None item to stay visible. The SQLCMD :r command includes the file's content in the post-deployment script, which is packaged in the .dacpac as one combined script.
    fr: |
      Un élément PostDeploy déclare l'unique script de post-déploiement du projet. Les fichiers inclus avec :r doivent être exclus de la génération du modèle avec Build Remove ; dans les projets de style SDK, Build Remove masque aussi le fichier, qui est donc rajouté comme élément None pour rester visible. La commande SQLCMD :r inclut le contenu du fichier dans le script de post-déploiement, empaqueté dans le fichier .dacpac sous la forme d'un script combiné.
  options:
    predeploy: { en: "PreDeploy declares the script that runs before the deployment plan.", fr: "PreDeploy déclare le script qui s'exécute avant le plan de déploiement." }
    buildinc: { en: "A Build item compiles the file into the model as object definitions, which fails for a script.", fr: "Un élément Build compile le fichier dans le modèle comme définitions d'objets, ce qui échoue pour un script." }
    noneinc: { en: "A None item is ignored by the deployment, so the script would never run.", fr: "Un élément None est ignoré par le déploiement : le script ne s'exécuterait jamais." }
    buildinc2: { en: "Build Include is the cause of the current build error.", fr: "Build Include est la cause de l'erreur de build actuelle." }
    postdeploy2: { en: "A project can have only one post-deployment script.", fr: "Un projet ne peut avoir qu'un seul script de post-déploiement." }
    noneremove: { en: "Removing the None item doesn't exclude the file from the model build.", fr: "Supprimer l'élément None n'exclut pas le fichier de la génération du modèle." }
    setvar: { en: ":setvar defines a SQLCMD variable; it doesn't include a file.", fr: ":setvar définit une variable SQLCMD ; il n'inclut pas de fichier." }
    exec: { en: "EXEC runs a stored procedure or a string, not a script file.", fr: "EXEC exécute une procédure stockée ou une chaîne, pas un fichier de script." }
    connect: { en: ":connect opens a connection to a server; it doesn't include a file.", fr: ":connect ouvre une connexion à un serveur ; il n'inclut pas de fichier." }
references:
  - title: Pre-deployment and post-deployment scripts
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts
