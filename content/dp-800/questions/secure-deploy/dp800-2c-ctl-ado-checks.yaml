id: dp800-2c-ctl-ado-checks
objective: "2.3.9"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum deploys SQL database projects from an Azure Repos Git repository with Azure Pipelines. The database projects are in the **/Database** folder.

    Which control should you configure for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie des projets de base de données SQL à partir d'un dépôt Git Azure Repos avec Azure Pipelines. Les projets de base de données se trouvent dans le dossier **/Database**.

    Quel contrôle devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reviewers, text: { en: "Automatically included reviewers branch policy (Required) with a path filter", fr: "Stratégie de branche Automatically included reviewers (Required) avec un filtre de chemin" } }
    - { id: buildval, text: { en: "Build validation branch policy", fr: "Stratégie de branche de validation de build" } }
    - { id: approvals, text: { en: "Approvals check on the production environment", fr: "Vérification Approvals sur l'environnement production" } }
    - { id: hours, text: { en: "Business hours check on the production environment", fr: "Vérification Business hours sur l'environnement production" } }
    - { id: lock, text: { en: "Exclusive lock check on the production environment", fr: "Vérification Exclusive lock sur l'environnement production" } }
    - { id: branch, text: { en: "Branch control check on the production environment", fr: "Vérification Branch control sur l'environnement production" } }
  targets:
    - id: dba-pr
      text: { en: "The DBA team must approve every pull request into main that changes a file under /Database.", fr: "L'équipe DBA doit approuver chaque pull request vers main qui modifie un fichier sous /Database." }
    - id: dba-stage
      text: { en: "A DBA must approve before the production stage of each run starts.", fr: "Un DBA doit approuver avant le démarrage de la phase de production de chaque exécution." }
    - id: window
      text: { en: "The production stage starts only between 20:00 and 23:00.", fr: "La phase de production ne démarre qu'entre 20:00 et 23:00." }
    - id: one
      text: { en: "Only one run at a time deploys to the production database.", fr: "Une seule exécution à la fois déploie sur la base de données de production." }
answer:
  mapping: { dba-pr: reviewers, dba-stage: approvals, window: hours, one: lock }
explanation:
  correct:
    en: |
      The automatically included reviewers policy adds the DBA team to pull requests that touch the path filter, and Required makes their approval mandatory. Checks on the environment run before a stage that uses it: Approvals waits for a DBA, Business hours lets the stage start only within the configured window, and Exclusive lock lets only one run use the environment at a time. Build validation and Branch control enforce other requirements.
    fr: |
      La stratégie Automatically included reviewers ajoute l'équipe DBA aux pull requests qui touchent le filtre de chemin, et Required rend son approbation obligatoire. Les vérifications sur l'environnement s'exécutent avant une phase qui l'utilise : Approvals attend un DBA, Business hours ne laisse démarrer la phase que dans la plage configurée, et Exclusive lock ne laisse qu'une exécution à la fois utiliser l'environnement. La validation de build et Branch control répondent à d'autres exigences.
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
