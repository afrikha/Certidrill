stem:
  en: You replace the SELECT and UPDATE statements with a conditional UPDATE.
  fr: Vous remplacez les instructions SELECT et UPDATE par un UPDATE conditionnel.
body:
  solution:
    en: |
      In dbo.usp_ReserveSeat, you replace the statements between BEGIN TRANSACTION and COMMIT TRANSACTION with the following code:

      ```sql
      UPDATE dbo.EventInventory
      SET SeatsAvailable = SeatsAvailable - 1
      WHERE EventID = @EventID AND SeatsAvailable > 0;

      IF @@ROWCOUNT = 1
          INSERT INTO dbo.Reservation (EventID, CustomerID)
          VALUES (@EventID, @CustomerID);
      ```
    fr: |
      Dans dbo.usp_ReserveSeat, vous remplacez les instructions situées entre BEGIN TRANSACTION et COMMIT TRANSACTION par le code suivant :

      ```sql
      UPDATE dbo.EventInventory
      SET SeatsAvailable = SeatsAvailable - 1
      WHERE EventID = @EventID AND SeatsAvailable > 0;

      IF @@ROWCOUNT = 1
          INSERT INTO dbo.Reservation (EventID, CustomerID)
          VALUES (@EventID, @CustomerID);
      ```
answer: { value: true }
explanation:
  correct:
    en: The check and the decrement now happen in one UPDATE statement, which locks the row it modifies until the transaction ends. The second call waits for that lock, finds SeatsAvailable = 0, updates no row, and @@ROWCOUNT = 0 skips the reservation. Only the call that actually took a seat inserts a row in dbo.Reservation.
    fr: "La vérification et la décrémentation ont désormais lieu dans une seule instruction UPDATE, qui verrouille la ligne qu'elle modifie jusqu'à la fin de la transaction. Le second appel attend ce verrou, trouve SeatsAvailable = 0, ne met à jour aucune ligne, et @@ROWCOUNT = 0 évite la réservation. Seul l'appel qui a réellement obtenu une place insère une ligne dans dbo.Reservation."
references:
  - title: SET TRANSACTION ISOLATION LEVEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-transaction-isolation-level-transact-sql
