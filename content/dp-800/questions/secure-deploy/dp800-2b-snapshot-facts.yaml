id: dp800-2b-snapshot-facts
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove plans to run a batch of balance corrections under SNAPSHOT isolation in Azure SQL Database. The `ALLOW_SNAPSHOT_ISOLATION` option is on, and other sessions update the same accounts while the batch runs.

    Which two statements describe the behavior of the batch transaction?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove prévoit d'exécuter un lot de corrections de soldes avec l'isolation SNAPSHOT dans Azure SQL Database. L'option `ALLOW_SNAPSHOT_ISOLATION` est activée, et d'autres sessions mettent à jour les mêmes comptes pendant l'exécution du lot.

    Quelles sont les deux affirmations qui décrivent le comportement de la transaction du lot ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |
          Each statement reads the data committed before that statement started, so later statements see new commits.
        fr: |
          Chaque instruction lit les données validées avant son début : les instructions suivantes voient les nouvelles validations.
    - id: b
      text:
        en: |
          Every statement reads the data as it was committed when the transaction started, even after other sessions commit changes.
        fr: |
          Chaque instruction lit les données telles qu'elles étaient validées au début de la transaction, même après la validation de modifications par d'autres sessions.
    - id: c
      text:
        en: |
          The transaction takes range locks on the rows it reads, so other sessions can't insert rows in those ranges.
        fr: |
          La transaction prend des verrous de plage sur les lignes lues : les autres sessions ne peuvent pas insérer de lignes dans ces plages.
    - id: d
      text:
        en: |
          Updating a row that another session changed and committed after the batch started aborts the batch with an update conflict.
        fr: |
          La mise à jour d'une ligne qu'une autre session a modifiée et validée après le début du lot annule le lot avec un conflit de mise à jour.
    - id: e
      text:
        en: |
          The batch can switch to SNAPSHOT in the middle of a transaction that started under READ COMMITTED.
        fr: |
          Le lot peut passer à SNAPSHOT au milieu d'une transaction démarrée en READ COMMITTED.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      SNAPSHOT gives transaction-level consistency, the version of the data that existed when the transaction started. Because it can't overwrite a change it couldn't see, an update of a row changed after the snapshot began fails with error 3960, "Snapshot isolation transaction aborted due to update conflict", and the batch must handle the error and retry.
    fr: |
      SNAPSHOT offre une cohérence au niveau de la transaction : la version des données qui existait au début de la transaction. Comme elle ne peut pas écraser une modification qu'elle ne voyait pas, la mise à jour d'une ligne modifiée après le début de l'instantané échoue avec l'erreur 3960 (« Snapshot isolation transaction aborted due to update conflict »), et le lot doit gérer l'erreur et réessayer.
  options:
    a: { en: "Statement-level snapshots describe READ COMMITTED with RCSI, not SNAPSHOT.", fr: "Les instantanés au niveau de l'instruction correspondent à READ COMMITTED avec RCSI, pas à SNAPSHOT." }
    c: { en: "Range locks belong to SERIALIZABLE; SNAPSHOT readers take no shared or range locks.", fr: "Les verrous de plage relèvent de SERIALIZABLE ; les lecteurs SNAPSHOT ne prennent ni verrou partagé ni verrou de plage." }
    e: { en: "A transaction that started under another isolation level can't be set to SNAPSHOT; doing so aborts it.", fr: "Une transaction démarrée avec un autre niveau d'isolation ne peut pas passer à SNAPSHOT ; cela l'annule." }
references:
  - title: SET TRANSACTION ISOLATION LEVEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-transaction-isolation-level-transact-sql
  - title: Transaction locking and row versioning guide
    url: https://learn.microsoft.com/en-us/sql/relational-databases/sql-server-transaction-locking-and-row-versioning-guide
