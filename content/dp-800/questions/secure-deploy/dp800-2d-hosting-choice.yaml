id: dp800-2d-hosting-choice
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind plans to host Data API builder (DAB) for a retail API. The solution must meet the following requirements:

    - Run the data-api-builder container image without managing virtual machines or a Kubernetes cluster.
    - Add and remove replicas automatically based on HTTP traffic.
    - Send full DAB telemetry to Application Insights.
    - Minimize administrative effort.

    Which hosting service should you recommend?
  fr: |
    Northwind prévoit d'héberger Data API builder (DAB) pour une API de vente au détail. La solution doit respecter les exigences suivantes :

    - Exécuter l'image conteneur data-api-builder sans gérer de machines virtuelles ni de cluster Kubernetes.
    - Ajouter et retirer automatiquement des réplicas en fonction du trafic HTTP.
    - Envoyer la télémétrie DAB complète à Application Insights.
    - Réduire au minimum l'effort d'administration.

    Quel service d'hébergement devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure App Service }
    - { id: b, text: Azure Container Instances }
    - { id: c, text: Azure Kubernetes Service (AKS) }
    - { id: d, text: Azure Container Apps }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Container Apps runs the DAB image as a managed container with HTTP ingress and scale rules that add or remove replicas with traffic, without a cluster to manage. Microsoft recommends hosting DAB in containers, Azure Container Apps or AKS when you use Application Insights, because the integration may be limited on App Service web apps by double instrumentation.
    fr: |
      Azure Container Apps exécute l'image DAB comme un conteneur managé avec une entrée HTTP et des règles de mise à l'échelle qui ajoutent ou retirent des réplicas selon le trafic, sans cluster à gérer. Microsoft recommande d'héberger DAB dans des conteneurs, Azure Container Apps ou AKS quand vous utilisez Application Insights, car l'intégration peut être limitée sur les applications web App Service par une double instrumentation.
  options:
    a: { en: "On App Service web apps, the Application Insights integration of DAB may be limited by double instrumentation.", fr: "Sur les applications web App Service, l'intégration Application Insights de DAB peut être limitée par une double instrumentation." }
    b: { en: "Container Instances runs a container group without HTTP-based scale rules, so replicas aren't added automatically.", fr: "Container Instances exécute un groupe de conteneurs sans règles de mise à l'échelle basées sur HTTP : aucun réplica n'est ajouté automatiquement." }
    c: { en: "AKS requires managing a Kubernetes cluster, which the requirements exclude.", fr: "AKS exige la gestion d'un cluster Kubernetes, ce que les exigences excluent." }
references:
  - title: Use Azure Application Insights in Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights
  - title: Deployment options for Data API builder - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/deployment/
