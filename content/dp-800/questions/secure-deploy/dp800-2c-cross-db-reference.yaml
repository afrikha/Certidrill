id: dp800-2c-cross-db-reference
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has two SDK-style SQL database projects, **SalesDb** and **WarehouseDb**, in the same repository. Both databases are deployed to the same server. The database created from WarehouseDb is named **WarehouseDev** in the development environment and **Warehouse** in production.

    A developer adds the following view to SalesDb, and `dotnet build` fails because the reference to the table cannot be resolved:

    ```sql
    CREATE VIEW dbo.vw_StockBySku AS
    SELECT Sku, BinNumber, Quantity
    FROM [Warehouse].[Production].[ProductInventory];
    ```

    You need the build to validate the view, and the same .dacpac file must work in both environments.

    What should you do?
  fr: |
    Woodgrove dispose de deux projets de base de données SQL de style SDK, **SalesDb** et **WarehouseDb**, dans le même dépôt. Les deux bases de données sont déployées sur le même serveur. La base de données créée à partir de WarehouseDb se nomme **WarehouseDev** dans l'environnement de développement et **Warehouse** en production.

    Un développeur ajoute la vue suivante à SalesDb, et `dotnet build` échoue, car la référence à la table ne peut pas être résolue :

    ```sql
    CREATE VIEW dbo.vw_StockBySku AS
    SELECT Sku, BinNumber, Quantity
    FROM [Warehouse].[Production].[ProductInventory];
    ```

    Vous devez faire en sorte que la génération valide la vue, et le même fichier .dacpac doit fonctionner dans les deux environnements.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a reference to WarehouseDb with a DatabaseVariableLiteralValue of Warehouse, and keep the view unchanged.", fr: "Ajouter une référence à WarehouseDb avec la valeur DatabaseVariableLiteralValue Warehouse, et conserver la vue telle quelle." }
    - id: b
      text: { en: "Add a reference to WarehouseDb with a DatabaseSqlCmdVariable named Warehouse, use `[$(Warehouse)]` in the view, and set /v:Warehouse at publish.", fr: "Ajouter une référence à WarehouseDb avec une DatabaseSqlCmdVariable nommée Warehouse, utiliser `[$(Warehouse)]` dans la vue et définir /v:Warehouse lors de la publication." }
    - id: c
      text: { en: "Move the CREATE VIEW statement to the post-deployment script, and use a SQLCMD variable for the database name.", fr: "Déplacer l'instruction CREATE VIEW dans le script de post-déploiement, et utiliser une variable SQLCMD pour le nom de la base de données." }
    - id: d
      text: { en: "Copy the CREATE TABLE script of Production.ProductInventory into SalesDb, and remove the database name from the view.", fr: "Copier le script CREATE TABLE de Production.ProductInventory dans SalesDb, et supprimer le nom de la base de données de la vue." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A database reference to another database on the same server uses a DatabaseSqlCmdVariable, so the build resolves `[$(Warehouse)].[Production].[ProductInventory]` against the referenced model. The actual database name is supplied at deployment with /v:Warehouse=WarehouseDev or /v:Warehouse=Warehouse, so one .dacpac serves both environments.
    fr: |
      Une référence de base de données vers une autre base du même serveur utilise une DatabaseSqlCmdVariable : la génération résout `[$(Warehouse)].[Production].[ProductInventory]` par rapport au modèle référencé. Le nom réel de la base de données est fourni au déploiement avec /v:Warehouse=WarehouseDev ou /v:Warehouse=Warehouse : un seul .dacpac sert les deux environnements.
  options:
    a: { en: "A literal value hard-codes the name Warehouse in the model, so the .dacpac would not work against WarehouseDev.", fr: "Une valeur littérale code en dur le nom Warehouse dans le modèle : le .dacpac ne fonctionnerait pas avec WarehouseDev." }
    c: { en: "Post-deployment scripts are not validated against the object model, so the view would no longer be checked by the build.", fr: "Les scripts de post-déploiement ne sont pas validés par rapport au modèle d'objets : la vue ne serait plus vérifiée par la génération." }
    d: { en: "The table would become part of SalesDb and be deployed into the sales database, and the view would read that copy instead of the warehouse data.", fr: "La table ferait partie de SalesDb et serait déployée dans la base de ventes, et la vue lirait cette copie au lieu des données de l'entrepôt." }
references:
  - title: Database references overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/database-references
