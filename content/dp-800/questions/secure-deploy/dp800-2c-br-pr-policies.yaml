id: dp800-2c-br-pr-policies
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum stores an SDK-style SQL database project in an Azure Repos Git repository. A YAML pipeline named **db-ci** runs `dotnet build` on the project.

    You need to configure **main** to meet the following requirements:

    - A pull request into main can be completed only after db-ci succeeds on the proposed changes.
    - A pull request needs at least one approval from someone other than the person who pushed its latest changes.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke un projet de base de données SQL de style SDK dans un dépôt Git Azure Repos. Un pipeline YAML nommé **db-ci** exécute `dotnet build` sur le projet.

    Vous devez configurer **main** pour respecter les exigences suivantes :

    - Une pull request vers main ne peut être terminée qu'après la réussite de db-ci sur les modifications proposées.
    - Une pull request nécessite au moins une approbation d'une personne autre que celle qui a poussé ses dernières modifications.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a build validation policy for db-ci with the policy requirement set to Required.", fr: "Ajouter une stratégie de validation de build pour db-ci avec l'exigence de stratégie définie sur Required." } }
    - { id: b, text: { en: "Add a build validation policy for db-ci with the policy requirement set to Optional.", fr: "Ajouter une stratégie de validation de build pour db-ci avec l'exigence de stratégie définie sur Optional." } }
    - { id: c, text: { en: "Add a pr section that includes main to the YAML file of db-ci.", fr: "Ajouter au fichier YAML de db-ci une section pr qui inclut main." } }
    - { id: d, text: { en: "Require a minimum of one reviewer, and select Prohibit the most recent pusher from approving their own changes.", fr: "Exiger au moins un réviseur, et sélectionner Prohibit the most recent pusher from approving their own changes." } }
    - { id: e, text: { en: "Require a minimum of one reviewer, and select Allow requestors to approve their own changes.", fr: "Exiger au moins un réviseur, et sélectionner Allow requestors to approve their own changes." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A build validation policy queues db-ci on each pull request, and the Required setting blocks completion until the build succeeds. The minimum number of reviewers policy with Prohibit the most recent pusher from approving their own changes enforces an approval by someone other than the last pusher.
    fr: |
      Une stratégie de validation de build met db-ci en file d'attente pour chaque pull request, et le paramètre Required bloque la fin tant que le build n'a pas réussi. La stratégie de nombre minimal de réviseurs avec Prohibit the most recent pusher from approving their own changes impose l'approbation d'une personne autre que le dernier auteur d'un push.
  options:
    b: { en: "An optional build validation only reports a failure; it does not block completion.", fr: "Une validation de build facultative signale seulement l'échec ; elle ne bloque pas la fin de la pull request." }
    c: { en: "For Azure Repos Git, pull request triggers are not configured in YAML; a build validation branch policy is used instead.", fr: "Pour Azure Repos Git, les déclencheurs de pull request ne se configurent pas en YAML ; on utilise une stratégie de branche de validation de build." }
    e: { en: "This lets the author's own vote count toward the minimum, the opposite of the requirement.", fr: "Cette option laisse compter le vote de l'auteur dans le minimum, soit l'inverse de l'exigence." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
