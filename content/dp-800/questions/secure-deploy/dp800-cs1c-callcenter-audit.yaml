id: dp800-cs1c-callcenter-audit
objective: "2.1.6"
type: single
caseStudy: dp800-cs1c-woodgrove-bank
difficulty: 1
status: draft
stem:
  en: |
    You create a server audit named Audit_CallCenter on SQL-CORE1 that writes to a file. You need to complete the audit configuration. The solution must meet the auditing requirements.

    What should you create?
  fr: |
    Vous créez sur SQL-CORE1 un audit de serveur nommé Audit_CallCenter qui écrit dans un fichier. Vous devez terminer la configuration de l'audit. La solution doit respecter les exigences d'audit.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A server audit specification for Audit_CallCenter that contains the SCHEMA_OBJECT_ACCESS_GROUP action group", fr: "Une spécification d'audit de serveur pour Audit_CallCenter qui contient le groupe d'actions SCHEMA_OBJECT_ACCESS_GROUP" } }
    - { id: b, text: { en: "A database audit specification in WoodgroveCore for Audit_CallCenter that contains the SELECT action on dbo.Customers by CallCenter", fr: "Une spécification d'audit de base de données dans WoodgroveCore pour Audit_CallCenter qui contient l'action SELECT sur dbo.Customers par CallCenter" } }
    - { id: c, text: { en: "A database audit specification in WoodgroveCore for Audit_CallCenter that contains the SELECT action on dbo.Customers by public", fr: "Une spécification d'audit de base de données dans WoodgroveCore pour Audit_CallCenter qui contient l'action SELECT sur dbo.Customers par public" } }
    - { id: d, text: { en: "A database audit specification in WoodgroveCore for Audit_CallCenter that contains the DATABASE_OBJECT_ACCESS_GROUP action group", fr: "Une spécification d'audit de base de données dans WoodgroveCore pour Audit_CallCenter qui contient le groupe d'actions DATABASE_OBJECT_ACCESS_GROUP" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A database audit specification binds database-level actions to a server audit. The action SELECT ON dbo.Customers BY CallCenter records only the SELECT statements that members of the CallCenter role run on that table. The specification is created disabled, so you enable it with WITH (STATE = ON), and the server audit must also be enabled.
    fr: |
      Une spécification d'audit de base de données associe des actions de niveau base de données à un audit de serveur. L'action SELECT ON dbo.Customers BY CallCenter n'enregistre que les instructions SELECT que les membres du rôle CallCenter exécutent sur cette table. La spécification est créée désactivée : vous l'activez avec WITH (STATE = ON), et l'audit de serveur doit aussi être activé.
  options:
    a: { en: "SCHEMA_OBJECT_ACCESS_GROUP records the use of object permissions on every object of every database by every principal, far more than the requirement.", fr: "SCHEMA_OBJECT_ACCESS_GROUP enregistre l'utilisation des autorisations d'objet sur tous les objets de toutes les bases de données par tous les principaux, bien plus que l'exigence." }
    c: { en: "Every database user is a member of public, so the advisor portal and the other applications would be recorded too.", fr: "Tous les utilisateurs de base de données sont membres de public : le portail des conseillers et les autres applications seraient aussi enregistrés." }
    d: { en: "DATABASE_OBJECT_ACCESS_GROUP records access to database objects such as certificates and asymmetric keys, not SELECT statements on a table.", fr: "DATABASE_OBJECT_ACCESS_GROUP enregistre l'accès à des objets de base de données comme les certificats et les clés asymétriques, pas les instructions SELECT sur une table." }
references:
  - title: Create a server audit and database audit specification
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/auditing/create-a-server-audit-and-database-audit-specification
