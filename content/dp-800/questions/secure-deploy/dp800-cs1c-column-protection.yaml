id: dp800-cs1c-column-protection
objective: "2.1.1"
type: dragdrop
caseStudy: dp800-cs1c-woodgrove-bank
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a protection feature for each customer data protection requirement.

    What should you recommend? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une fonctionnalité de protection pour chaque exigence de protection des données clients.

    Que devez-vous recommander ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ae-det, text: { en: "Always Encrypted with deterministic encryption", fr: "Always Encrypted avec chiffrement déterministe" } }
    - { id: ae-rand, text: { en: "Always Encrypted with randomized encryption", fr: "Always Encrypted avec chiffrement aléatoire" } }
    - { id: cle, text: { en: "Column-level encryption with ENCRYPTBYKEY", fr: "Chiffrement au niveau des colonnes avec ENCRYPTBYKEY" } }
    - { id: ddm, text: { en: "Dynamic Data Masking", fr: "Masquage dynamique des données" } }
    - { id: rls, text: { en: "Row-Level Security", fr: "Sécurité au niveau des lignes" } }
    - { id: tde, text: { en: "Transparent data encryption (TDE)", fr: "Chiffrement transparent des données (TDE)" } }
  targets:
    - { id: nid, text: { en: "NationalID", fr: "NationalID" } }
    - { id: phone, text: { en: "Phone", fr: "Phone" } }
    - { id: advisor, text: { en: "Customers of each advisor", fr: "Clients de chaque conseiller" } }
answer:
  mapping: { nid: ae-rand, phone: ddm, advisor: rls }
explanation:
  correct:
    en: |
      Always Encrypted encrypts NationalID in the client driver, and the Database Engine never sees the keys, so even sysadmins read only ciphertext; randomized encryption is the more secure type, and the portal only displays the column, so it needs no equality lookups. Dynamic Data Masking with a partial() function shows only the last four digits to CallCenter members, while the portal's user is granted UNMASK. Row-Level Security filters dbo.Customers on the AdvisorId stored in SESSION_CONTEXT.
    fr: |
      Always Encrypted chiffre NationalID dans le pilote client, et le moteur de base de données ne voit jamais les clés : même les sysadmins ne lisent que du texte chiffré ; le chiffrement aléatoire est le type le plus sûr, et le portail ne fait qu'afficher la colonne : il n'a besoin d'aucune recherche d'égalité. Le masquage dynamique des données avec une fonction partial() n'affiche que les quatre derniers chiffres aux membres de CallCenter, tandis que l'utilisateur du portail reçoit l'autorisation UNMASK. La sécurité au niveau des lignes filtre dbo.Customers sur la valeur AdvisorId stockée dans SESSION_CONTEXT.
  options:
    ae-det: { en: "Deterministic encryption always produces the same ciphertext for a value, which reveals equal values; it is needed only for equality lookups, joins or grouping, which the portal does not do.", fr: "Le chiffrement déterministe produit toujours le même texte chiffré pour une valeur, ce qui révèle les valeurs égales ; il n'est nécessaire que pour les recherches d'égalité, les jointures ou les regroupements, que le portail n'effectue pas." }
    cle: { en: "ENCRYPTBYKEY uses keys stored in the database, which a sysadmin can open to decrypt the data.", fr: "ENCRYPTBYKEY utilise des clés stockées dans la base de données, qu'un sysadmin peut ouvrir pour déchiffrer les données." }
    tde: { en: "TDE encrypts data files and backups at rest; every user who can query the table reads clear text.", fr: "TDE chiffre les fichiers de données et les sauvegardes au repos ; tout utilisateur qui peut interroger la table lit du texte en clair." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
  - title: Dynamic Data Masking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking
