id: dp800-2c-dep-republish
objective: "2.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware publishes the file **ClaimsDb.dacpac** to a test database by running `sqlpackage /Action:Publish`. The project has a post-deployment script that merges reference data. The publish succeeds.

    An operator then reruns the same pipeline, which publishes the same ClaimsDb.dacpac file to the same database. Nobody changed the database between the two runs.

    What happens during the second run?
  fr: |
    Proseware publie le fichier **ClaimsDb.dacpac** sur une base de données de test en exécutant `sqlpackage /Action:Publish`. Le projet comporte un script de post-déploiement qui fusionne des données de référence. La publication réussit.

    Un opérateur relance ensuite le même pipeline, qui publie le même fichier ClaimsDb.dacpac sur la même base de données. Personne n'a modifié la base de données entre les deux exécutions.

    Que se passe-t-il lors de la deuxième exécution ?
body:
  options:
    - { id: a, text: { en: "The publish fails because the objects of the .dacpac already exist in the database.", fr: "La publication échoue, car les objets du .dacpac existent déjà dans la base de données." } }
    - { id: b, text: { en: "SqlPackage drops and re-creates the database, and then deploys every object again.", fr: "SqlPackage supprime et recrée la base de données, puis déploie de nouveau chaque objet." } }
    - { id: c, text: { en: "No schema change is applied, and the post-deployment script runs again.", fr: "Aucune modification de schéma n'est appliquée, et le script de post-déploiement s'exécute de nouveau." } }
    - { id: d, text: { en: "No schema change is applied, and the post-deployment script is skipped.", fr: "Aucune modification de schéma n'est appliquée, et le script de post-déploiement est ignoré." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Publishing compares the .dacpac with the target and generates only the changes needed, so a second publish of the same model changes no schema object. The pre- and post-deployment scripts run on every deployment, which is why they must be idempotent.
    fr: |
      La publication compare le .dacpac à la cible et ne génère que les modifications nécessaires : une deuxième publication du même modèle ne modifie aucun objet de schéma. Les scripts de prédéploiement et de post-déploiement s'exécutent à chaque déploiement, c'est pourquoi ils doivent être idempotents.
  options:
    a:
      en: |
        Publish is incremental: existing objects that match the model are left as they are.
      fr: |
        La publication est incrémentielle : les objets existants conformes au modèle restent inchangés.
    b:
      en: |
        The database is re-created only when CreateNewDatabase is True, and its default is False.
      fr: |
        La base de données n'est recréée que si CreateNewDatabase vaut True, et sa valeur par défaut est False.
    d:
      en: |
        Pre- and post-deployment scripts run on every deployment, even when the schema is already up to date.
      fr: |
        Les scripts de prédéploiement et de post-déploiement s'exécutent à chaque déploiement, même lorsque le schéma est déjà à jour.
references:
  - title: What are SQL database projects?
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/sql-database-projects
  - title: Pre-deployment and post-deployment scripts overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts
