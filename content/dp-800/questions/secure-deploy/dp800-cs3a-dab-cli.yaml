id: dp800-cs3a-dab-cli
objective: "2.4.1"
type: dropdown
caseStudy: dp800-cs3a-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You need to create the DAB configuration file for ca-maint-api. The solution must meet the maintenance API requirements.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer le fichier de configuration DAB de ca-maint-api. La solution doit satisfaire les exigences de l'API de maintenance.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    dab [[create]] --database-type [[dbtype]] \
      --connection-string "[[conn]]" \
      --host-mode Production \
      --auth.provider EntraID \
      --auth.audience "api://byair-maint-api" \
      --auth.issuer "https://login.microsoftonline.com/<tenant-id>/v2.0"

    dab [[entity]] WorkOrder --source Maint.WorkOrder --source.type table \
      --permissions "technician:read,update"
  slots:
    - id: create
      options:
        - { id: init, text: init }
        - { id: configure, text: configure }
        - { id: add, text: add }
        - { id: start, text: start }
    - id: dbtype
      options:
        - { id: mssql, text: mssql }
        - { id: dwsql, text: dwsql }
        - { id: postgresql, text: postgresql }
        - { id: cosmos, text: cosmosdb_nosql }
    - id: conn
      options:
        - { id: env, text: "@env('MAINT_DB_CONN')" }
        - { id: akv, text: "@akv('MAINT_DB_CONN')" }
        - { id: shell, text: "${MAINT_DB_CONN}" }
    - id: entity
      options:
        - { id: add, text: add }
        - { id: update, text: update }
        - { id: configure, text: configure }
        - { id: init, text: init }
answer:
  values: { create: init, dbtype: mssql, conn: env, entity: add }
explanation:
  correct:
    en: |
      dab init creates the configuration file with the data source, host mode and authentication settings; mssql is the database type for Azure SQL Database. The value @env('MAINT_DB_CONN') is written literally in the file, and DAB replaces it with the environment variable of the container app when it starts, so the connection string never appears in the file. dab add then creates the WorkOrder entity with the permissions of the technician role.
    fr: |
      dab init crée le fichier de configuration avec la source de données, le mode d'hôte et les paramètres d'authentification ; mssql est le type de base de données pour Azure SQL Database. La valeur @env('MAINT_DB_CONN') est écrite telle quelle dans le fichier, et DAB la remplace par la variable d'environnement de l'application conteneur au démarrage : la chaîne de connexion n'apparaît donc jamais dans le fichier. dab add crée ensuite l'entité WorkOrder avec les autorisations du rôle technician.
  options:
    configure: { en: "dab configure changes the runtime or data source settings of an existing file; no configuration file exists yet, and it doesn't create entities.", fr: "dab configure modifie les paramètres d'exécution ou de source de données d'un fichier existant ; aucun fichier de configuration n'existe encore, et il ne crée pas d'entités." }
    start: { en: "dab start runs the engine from an existing configuration file; it doesn't create one.", fr: "dab start exécute le moteur à partir d'un fichier de configuration existant ; il n'en crée pas." }
    update: { en: "dab update changes an entity that already exists; WorkOrder isn't in the file yet.", fr: "dab update modifie une entité qui existe déjà ; WorkOrder n'est pas encore dans le fichier." }
    dwsql: { en: "dwsql is a separate database type of DAB; Azure SQL Database, like SQL Server, uses mssql.", fr: "dwsql est un autre type de base de données de DAB ; Azure SQL Database, comme SQL Server, utilise mssql." }
    akv: { en: "@akv() reads a secret from the Azure Key Vault configured in the file; the connection string is an environment variable of the container app.", fr: "@akv() lit un secret dans le coffre Azure Key Vault configuré dans le fichier ; la chaîne de connexion est une variable d'environnement de l'application conteneur." }
    shell: { en: "The shell expands ${MAINT_DB_CONN} before DAB runs, so the actual connection string is written to the configuration file.", fr: "L'interpréteur de commandes développe ${MAINT_DB_CONN} avant l'exécution de DAB : la chaîne de connexion réelle est donc écrite dans le fichier de configuration." }
references:
  - title: init command
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/command-line/dab-init
