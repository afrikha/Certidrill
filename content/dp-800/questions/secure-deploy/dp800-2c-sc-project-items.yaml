id: dp800-2c-sc-project-items
objective: "2.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind has an SDK-style SQL database project named **ShippingDb**. You are preparing the project file before the team starts working on it in Git. The project must meet the following requirements:

    - The rename operations recorded in **ShippingDb.refactorlog** are packaged into the .dacpac file and applied at deployment.
    - The ad hoc maintenance scripts in the **Scripts/Adhoc** folder are stored in the repository and stay visible in the project, but they are not compiled into the database model.

    How should you complete the project file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un projet de base de données SQL de style SDK nommé **ShippingDb**. Vous préparez le fichier projet avant que l'équipe ne commence à y travailler dans Git. Le projet doit respecter les exigences suivantes :

    - Les opérations de renommage enregistrées dans **ShippingDb.refactorlog** sont incluses dans le fichier .dacpac et appliquées au déploiement.
    - Les scripts de maintenance ponctuels du dossier **Scripts/Adhoc** sont stockés dans le dépôt et restent visibles dans le projet, mais ils ne sont pas compilés dans le modèle de base de données.

    Comment devez-vous compléter le fichier projet ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    <ItemGroup>
      [[log]]
      <PostDeploy Include="Scripts\PostDeployment\PostDeploy.sql" />
    </ItemGroup>
    <ItemGroup>
      [[remove]]
      [[visible]]
    </ItemGroup>
  slots:
    - id: log
      options:
        - { id: refactor, text: '<RefactorLog Include="ShippingDb.refactorlog" />' }
        - { id: none, text: '<None Include="ShippingDb.refactorlog" />' }
        - { id: predeploy, text: '<PreDeploy Include="ShippingDb.refactorlog" />' }
        - { id: build, text: '<Build Include="ShippingDb.refactorlog" />' }
    - id: remove
      options:
        - { id: buildremove, text: '<Build Remove="Scripts\Adhoc\**" />' }
        - { id: noneremove, text: '<None Remove="Scripts\Adhoc\**" />' }
        - { id: buildinclude, text: '<Build Include="Scripts\Adhoc\**" />' }
        - { id: postinclude, text: '<PostDeploy Include="Scripts\Adhoc\**" />' }
    - id: visible
      options:
        - { id: noneinclude, text: '<None Include="Scripts\Adhoc\**" />' }
        - { id: buildinc2, text: '<Build Include="Scripts\Adhoc\**" />' }
        - { id: preinclude, text: '<PreDeploy Include="Scripts\Adhoc\**" />' }
answer:
  values: { log: refactor, remove: buildremove, visible: noneinclude }
explanation:
  correct:
    en: |
      A RefactorLog item adds the refactor log to the project; the build packages it into the .dacpac as refactor.xml, and deployment applies each rename once and records it in `dbo.__RefactorLog`. Because SDK-style projects compile every .sql file by default, Build Remove excludes the ad hoc scripts from the model, and None Include adds them back to the project view without compiling them.
    fr: |
      Un élément RefactorLog ajoute le journal de refactorisation au projet ; la génération l'inclut dans le .dacpac sous le nom refactor.xml, et le déploiement applique chaque renommage une seule fois et l'enregistre dans `dbo.__RefactorLog`. Comme les projets de style SDK compilent par défaut chaque fichier .sql, Build Remove exclut les scripts ponctuels du modèle, et None Include les rajoute à la vue du projet sans les compiler.
  options:
    none: { en: "A None item only shows the file in the project; the refactor log is not packaged as refactor operations.", fr: "Un élément None affiche seulement le fichier dans le projet ; le journal n'est pas inclus comme opérations de refactorisation." }
    predeploy: { en: "The pre-deployment script must be T-SQL; the refactor log is an XML file.", fr: "Le script de prédéploiement doit être du T-SQL ; le journal de refactorisation est un fichier XML." }
    build: { en: "Build items are T-SQL object scripts compiled into the model, not XML refactor logs.", fr: "Les éléments Build sont des scripts T-SQL d'objets compilés dans le modèle, pas des journaux de refactorisation XML." }
    noneremove: { en: "The .sql files are Build items by default; removing None items leaves them compiled.", fr: "Les fichiers .sql sont des éléments Build par défaut ; retirer des éléments None les laisse compilés." }
    buildinclude: { en: "Build Include compiles the scripts into the model, which the requirement forbids.", fr: "Build Include compile les scripts dans le modèle, ce que l'exigence interdit." }
    postinclude: { en: "A project has a single post-deployment script, and the ad hoc scripts would run on every deployment.", fr: "Un projet n'a qu'un seul script de post-déploiement, et les scripts ponctuels s'exécuteraient à chaque déploiement." }
    buildinc2: { en: "Adding the files back as Build items would compile them again.", fr: "Rajouter les fichiers comme éléments Build les compilerait de nouveau." }
    preinclude: { en: "A project has a single pre-deployment script, and these scripts must not run at deployment.", fr: "Un projet n'a qu'un seul script de prédéploiement, et ces scripts ne doivent pas s'exécuter au déploiement." }
references:
  - title: Refactor objects in SQL database projects
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/refactor-overview
  - title: Pre-deployment and post-deployment scripts overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts
