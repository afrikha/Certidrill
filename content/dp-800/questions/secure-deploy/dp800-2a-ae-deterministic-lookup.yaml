id: dp800-2a-ae-deterministic-lookup
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You manage an Azure SQL Database named **HRDb**. The **dbo.Employee** table contains a column named **TaxNumber** of type `char(11)`.

    A payroll application finds employees by running the following parameterized query:

    ```text
    SELECT EmployeeID, FullName FROM dbo.Employee WHERE TaxNumber = @TaxNumber;
    ```

    You need to protect TaxNumber. The solution must meet the following requirements:

    - Database administrators and cloud operators must never be able to see the TaxNumber values in plaintext.
    - The payroll query must keep working.
    - Secure enclaves must not be used.

    What should you implement?
  fr: |
    Vous gérez une base de données Azure SQL Database nommée **HRDb**. La table **dbo.Employee** contient une colonne nommée **TaxNumber** de type `char(11)`.

    Une application de paie recherche les employés en exécutant la requête paramétrable suivante :

    ```text
    SELECT EmployeeID, FullName FROM dbo.Employee WHERE TaxNumber = @TaxNumber;
    ```

    Vous devez protéger TaxNumber. La solution doit satisfaire les exigences suivantes :

    - Les administrateurs de base de données et les opérateurs cloud ne doivent jamais pouvoir voir les valeurs de TaxNumber en texte clair.
    - La requête de paie doit continuer à fonctionner.
    - Les enclaves sécurisées ne doivent pas être utilisées.

    Que devez-vous implémenter ?
body:
  options:
    - id: c
      text: { en: "Always Encrypted with randomized encryption on TaxNumber", fr: "Always Encrypted avec chiffrement aléatoire sur TaxNumber" }
    - id: b
      text: { en: "Dynamic Data Masking with the default() function on TaxNumber", fr: "Le masquage dynamique des données avec la fonction default() sur TaxNumber" }
    - id: a
      text: { en: "Always Encrypted with deterministic encryption on TaxNumber", fr: "Always Encrypted avec chiffrement déterministe sur TaxNumber" }
    - id: d
      text: { en: "Transparent data encryption (TDE) with a customer-managed key in Azure Key Vault", fr: "Le chiffrement transparent des données (TDE) avec une clé gérée par le client dans Azure Key Vault" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Always Encrypted keeps the keys outside the Database Engine, so administrators and cloud operators who manage the database cannot see the plaintext. Deterministic encryption always produces the same ciphertext for the same value, which supports equality lookups such as `WHERE TaxNumber = @TaxNumber` without an enclave. The column needs a `_BIN2` collation and the application must pass the value as a parameter.
    fr: |
      Always Encrypted garde les clés hors du moteur de base de données, si bien que les administrateurs et les opérateurs cloud qui gèrent la base ne peuvent pas voir le texte en clair. Le chiffrement déterministe produit toujours le même texte chiffré pour une même valeur, ce qui prend en charge les recherches d'égalité comme `WHERE TaxNumber = @TaxNumber` sans enclave. La colonne doit utiliser un classement `_BIN2` et l'application doit transmettre la valeur sous forme de paramètre.
  options:
    c: { en: "Without a secure enclave, randomized encryption supports no equality search, so the payroll query would fail.", fr: "Sans enclave sécurisée, le chiffrement aléatoire ne prend en charge aucune recherche d'égalité : la requête de paie échouerait." }
    b: { en: "Masking only changes query results for users without UNMASK; administrators always see the real values and the data is not encrypted.", fr: "Le masquage ne modifie que les résultats pour les utilisateurs sans UNMASK ; les administrateurs voient toujours les vraies valeurs et les données ne sont pas chiffrées." }
    d: { en: "TDE encrypts data files, logs and backups at rest, but the engine decrypts pages in memory, so administrators can query the plaintext.", fr: "TDE chiffre au repos les fichiers de données, les journaux et les sauvegardes, mais le moteur déchiffre les pages en mémoire : les administrateurs peuvent interroger le texte en clair." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
