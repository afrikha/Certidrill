id: dp800-2c-dep-predeploy-archive
objective: "2.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an SDK-style SQL database project named **CrmDb**. The next release removes the column **Fax** from dbo.Customer. Before the column is dropped, the existing fax numbers must be copied into the table **dbo.CustomerFaxArchive**, which already exists in the project and in production.

    The release pipeline publishes with `/p:BlockOnPossibleDataLoss=false` for this release only. The copy and the column removal must happen in the same deployment.

    Where should you add the INSERT ... SELECT statement that copies the fax numbers?
  fr: |
    Contoso dispose d'un projet de base de données SQL de style SDK nommé **CrmDb**. La prochaine version supprime la colonne **Fax** de dbo.Customer. Avant la suppression de la colonne, les numéros de fax existants doivent être copiés dans la table **dbo.CustomerFaxArchive**, qui existe déjà dans le projet et en production.

    Le pipeline de mise en production publie avec `/p:BlockOnPossibleDataLoss=false` pour cette version uniquement. La copie et la suppression de la colonne doivent avoir lieu dans le même déploiement.

    Où devez-vous ajouter l'instruction INSERT ... SELECT qui copie les numéros de fax ?
body:
  options:
    - { id: a, text: { en: "In the pre-deployment script", fr: "Dans le script de prédéploiement" } }
    - { id: b, text: { en: "In the post-deployment script", fr: "Dans le script de post-déploiement" } }
    - { id: c, text: { en: "In a new stored procedure file in the project", fr: "Dans un nouveau fichier de procédure stockée du projet" } }
    - { id: d, text: { en: "In the Tables/Customer.sql file, after the CREATE TABLE statement", fr: "Dans le fichier Tables/Customer.sql, après l'instruction CREATE TABLE" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The pre-deployment script runs before the deployment plan executes, so it can copy the fax numbers while the Fax column still exists. The plan, which drops the column, runs afterward in the same deployment.
    fr: |
      Le script de prédéploiement s'exécute avant l'exécution du plan de déploiement : il peut copier les numéros de fax tant que la colonne Fax existe encore. Le plan, qui supprime la colonne, s'exécute ensuite dans le même déploiement.
  options:
    b:
      en: |
        The post-deployment script runs after the plan, when the Fax column has already been dropped.
      fr: |
        Le script de post-déploiement s'exécute après le plan, quand la colonne Fax a déjà été supprimée.
    c:
      en: |
        Deploying a procedure only creates it; nothing runs it during the deployment, and it would reference a column that the project no longer defines.
      fr: |
        Déployer une procédure ne fait que la créer ; rien ne l'exécute pendant le déploiement, et elle référencerait une colonne que le projet ne définit plus.
    d:
      en: |
        Object files hold declarative definitions that the build compiles into the model; they are not run as scripts during the deployment.
      fr: |
        Les fichiers d'objets contiennent des définitions déclaratives que la génération compile dans le modèle ; ils ne sont pas exécutés comme des scripts pendant le déploiement.
references:
  - title: Pre-deployment and post-deployment scripts overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts
