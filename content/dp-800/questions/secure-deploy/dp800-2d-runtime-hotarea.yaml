id: dp800-2d-runtime-hotarea
objective: "2.4.3"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Proseware runs Data API builder (DAB) with the runtime settings shown in the following table. The Product entity has "rest": { "enabled": true }, and the configured roles have all the actions on every entity.

    Users report two behaviors. Answer each prompt by selecting the setting that causes the behavior.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute Data API builder (DAB) avec les paramètres runtime présentés dans le tableau suivant. L'entité Product a "rest": { "enabled": true }, et les rôles configurés disposent de toutes les actions sur chaque entité.

    Les utilisateurs signalent deux comportements. Répondez à chaque consigne en sélectionnant le paramètre à l'origine du comportement.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "No entity, including Product, is available through REST.", fr: "Aucune entité, y compris Product, n'est disponible par REST." }
    - id: p2
      text: { en: "An AI agent connected to the MCP endpoint can read and update records but can't remove them.", fr: "Un agent IA connecté au point de terminaison MCP peut lire et mettre à jour des enregistrements, mais ne peut pas les supprimer." }
  grid:
    header: [{ en: Setting, fr: Paramètre }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: runtime.rest.enabled, area: restEnabled }, { text: "false" }]
      - [{ text: runtime.rest.path, area: restPath }, { text: /api }]
      - [{ text: runtime.graphql.allow-introspection, area: intro }, { text: "false" }]
      - [{ text: runtime.mcp.enabled, area: mcpEnabled }, { text: "true" }]
      - [{ text: runtime.mcp.dml-tools.delete-record, area: deleteTool }, { text: "false" }]
      - [{ text: runtime.host.mode, area: mode }, { text: production }]
answer:
  values: { p1: restEnabled, p2: deleteTool }
explanation:
  correct:
    en: |
      When runtime.rest.enabled is false, the entity-level rest.enabled setting has no effect, so no entity is exposed through REST. The dml-tools object of runtime.mcp enables the MCP tools one by one; a tool disabled at runtime, here delete-record, doesn't appear in the tool list and can't be invoked, whatever the entity permissions.
    fr: |
      Quand runtime.rest.enabled vaut false, le paramètre rest.enabled des entités n'a aucun effet : aucune entité n'est exposée par REST. L'objet dml-tools de runtime.mcp active les outils MCP un par un ; un outil désactivé au niveau du runtime, ici delete-record, n'apparaît pas dans la liste des outils et ne peut pas être appelé, quelles que soient les autorisations des entités.
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
