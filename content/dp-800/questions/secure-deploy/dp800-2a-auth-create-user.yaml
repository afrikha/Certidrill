id: dp800-2a-auth-create-user
objective: "2.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database named **InvoicesDb** on the logical server **sql-contoso**. A function app named **func-invoices** has a system-assigned managed identity.

    func-invoices must read every table of InvoicesDb without any write access. It must connect without a password through a contained database user. The solution must follow the principle of least privilege.

    You connect to sql-contoso as a Microsoft Entra principal that has the required permissions. How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **InvoicesDb** sur le serveur logique **sql-contoso**. Une application de fonction nommée **func-invoices** dispose d'une identité managée affectée par le système.

    func-invoices doit lire toutes les tables d'InvoicesDb sans aucun accès en écriture. Elle doit se connecter sans mot de passe via un utilisateur de base de données contenu. La solution doit respecter le principe du moindre privilège.

    Vous vous connectez à sql-contoso en tant que principal Microsoft Entra disposant des autorisations requises. Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template:
    en: |
      -- Run in the [[db]] database
      CREATE USER [func-invoices] [[from]];
      ALTER ROLE [[role]] ADD MEMBER [func-invoices];
    fr: |
      -- Exécuter dans la base de données [[db]]
      CREATE USER [func-invoices] [[from]];
      ALTER ROLE [[role]] ADD MEMBER [func-invoices];
  slots:
    - id: db
      options:
        - { id: invoices, text: InvoicesDb }
        - { id: master, text: master }
    - id: from
      options:
        - { id: external, text: FROM EXTERNAL PROVIDER }
        - { id: login, text: "FROM LOGIN [func-invoices]" }
        - { id: password, text: "WITH PASSWORD = '<strong password>'" }
        - { id: without, text: WITHOUT LOGIN }
    - id: role
      options:
        - { id: reader, text: db_datareader }
        - { id: writer, text: db_datawriter }
        - { id: owner, text: db_owner }
        - { id: secadmin, text: db_securityadmin }
answer:
  values: { db: invoices, from: external, role: reader }
explanation:
  correct:
    en: |
      A contained database user is created in the user database itself. CREATE USER ... FROM EXTERNAL PROVIDER maps the user to the Microsoft Entra identity with that name, here the managed identity of the function app, and no password exists. The db_datareader role grants SELECT on every table without write access.
    fr: |
      Un utilisateur de base de données contenu se crée dans la base de données utilisateur elle-même. CREATE USER ... FROM EXTERNAL PROVIDER associe l'utilisateur à l'identité Microsoft Entra de ce nom, ici l'identité managée de l'application de fonction, et aucun mot de passe n'existe. Le rôle db_datareader accorde SELECT sur toutes les tables sans accès en écriture.
  options:
    master: { en: "A user created in master gives no access to InvoicesDb; contained users are created in the user database.", fr: "Un utilisateur créé dans master ne donne aucun accès à InvoicesDb ; les utilisateurs contenus se créent dans la base de données utilisateur." }
    login: { en: "FROM LOGIN requires a server login in master; the requirement asks for a contained user.", fr: "FROM LOGIN exige une connexion de serveur dans master ; l'exigence demande un utilisateur contenu." }
    password: { en: "A contained user with a password is a SQL authentication user, which stores a secret.", fr: "Un utilisateur contenu avec mot de passe est un utilisateur d'authentification SQL, qui stocke un secret." }
    owner: { en: "db_owner grants full control of the database.", fr: "db_owner accorde le contrôle total de la base de données." }
references:
  - title: Configure and manage Microsoft Entra authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
