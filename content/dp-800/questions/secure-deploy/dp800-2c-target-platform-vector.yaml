id: dp800-2c-target-platform-vector
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an SDK-style SQL database project named **CatalogDb** that is deployed to a SQL Server 2025 instance. The project file contains the following property:

    `<DSP>Microsoft.Data.Tools.Schema.Sql.Sql150DatabaseSchemaProvider</DSP>`

    A developer adds a stored procedure that calls `VECTOR_DISTANCE`. Now `dotnet build` fails with a syntax error in the new procedure.

    You need the project to build and to keep validating the code against the platform that it is deployed to.

    What should you do?
  fr: |
    Fabrikam dispose d'un projet de base de données SQL de style SDK nommé **CatalogDb**, déployé sur une instance SQL Server 2025. Le fichier projet contient la propriété suivante :

    `<DSP>Microsoft.Data.Tools.Schema.Sql.Sql150DatabaseSchemaProvider</DSP>`

    Un développeur ajoute une procédure stockée qui appelle `VECTOR_DISTANCE`. Désormais, `dotnet build` échoue avec une erreur de syntaxe dans la nouvelle procédure.

    Vous devez faire en sorte que le projet se génère et continue de valider le code par rapport à la plateforme sur laquelle il est déployé.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add /p:AllowIncompatiblePlatform=true to the SqlPackage publish command.", fr: "Ajouter /p:AllowIncompatiblePlatform=true à la commande de publication SqlPackage." }
    - id: b
      text: { en: "Set RunSqlCodeAnalysis to False in the project file.", fr: "Définir RunSqlCodeAnalysis sur False dans le fichier projet." }
    - id: c
      text: { en: "Change the DSP value to Sql170DatabaseSchemaProvider.", fr: "Remplacer la valeur DSP par Sql170DatabaseSchemaProvider." }
    - id: d
      text: { en: "Add a package reference to Microsoft.SqlServer.Dacpacs.Master.", fr: "Ajouter une référence de package à Microsoft.SqlServer.Dacpacs.Master." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The target platform (DSP) decides which T-SQL syntax the build accepts. Sql150 is SQL Server 2019, which has no vector functions; Sql170DatabaseSchemaProvider is SQL Server 2025, the platform the project is deployed to, so the build accepts VECTOR_DISTANCE and keeps validating against the right platform.
    fr: |
      La plateforme cible (DSP) détermine la syntaxe T-SQL acceptée par la génération. Sql150 correspond à SQL Server 2019, qui n'a pas de fonctions vectorielles ; Sql170DatabaseSchemaProvider correspond à SQL Server 2025, la plateforme de déploiement : la génération accepte VECTOR_DISTANCE et continue de valider par rapport à la bonne plateforme.
  options:
    a:
      en: |
        AllowIncompatiblePlatform is a publish property; the failure happens earlier, during the build, and the platform would still be wrong.
      fr: |
        AllowIncompatiblePlatform est une propriété de publication ; l'échec se produit plus tôt, pendant la génération, et la plateforme resterait incorrecte.
    b:
      en: |
        Code analysis only produces best-practice warnings; turning it off does not change the syntax that the target platform accepts.
      fr: |
        L'analyse du code ne produit que des avertissements de bonnes pratiques ; la désactiver ne change pas la syntaxe acceptée par la plateforme cible.
    d:
      en: |
        A master database reference resolves system objects; it does not add the syntax of a newer SQL Server version.
      fr: |
        Une référence à la base de données master résout les objets système ; elle n'ajoute pas la syntaxe d'une version plus récente de SQL Server.
references:
  - title: SQL projects target platform
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/target-platform
