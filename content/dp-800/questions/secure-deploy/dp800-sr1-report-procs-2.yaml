stem:
  en: You grant EXECUTE on the Reports schema and add ReportUsers to db_datareader.
  fr: Vous accordez EXECUTE sur le schéma Reports et ajoutez ReportUsers à db_datareader.
body:
  solution:
    en: |
      In FinanceDb, you run the following statements:

      ```sql
      GRANT EXECUTE ON SCHEMA::Reports TO ReportUsers;
      ALTER ROLE db_datareader ADD MEMBER ReportUsers;
      ```
    fr: |
      Dans FinanceDb, vous exécutez les instructions suivantes :

      ```sql
      GRANT EXECUTE ON SCHEMA::Reports TO ReportUsers;
      ALTER ROLE db_datareader ADD MEMBER ReportUsers;
      ```
answer: { value: false }
explanation:
  correct:
    en: The members of db_datareader can read all the data of every user table and view, so the analysts could query the Sales tables directly. The procedures do not need this permission, because ownership chaining already lets them read the Sales tables on behalf of the caller.
    fr: "Les membres de db_datareader peuvent lire toutes les données de toutes les tables et vues utilisateur : les analystes pourraient interroger directement les tables Sales. Les procédures n'ont pas besoin de cette autorisation, car le chaînage des propriétés leur permet déjà de lire les tables Sales pour le compte de l'appelant."
references:
  - title: Database-Level Roles
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/database-level-roles
