id: dp800-sr2-pwdless-3
objective: "2.1.5"
type: series_yesno
series: dp800-sr2-passwordless-app
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You use the system-assigned managed identity of the app with db_owner.
  fr: Vous utilisez l'identité managée affectée par le système de l'application avec db_owner.
body:
  solution:
    en: |
      You enable the system-assigned managed identity of adatum-orders. Connected to OrdersDb as the Microsoft Entra admin, you run the following statements.

      ```sql
      CREATE USER [adatum-orders] FROM EXTERNAL PROVIDER;
      ALTER ROLE db_owner ADD MEMBER [adatum-orders];
      ```

      You replace the connection string with the following value.

      ```text
      Server=tcp:adatum-sql.database.windows.net;Database=OrdersDb;Authentication=Active Directory Default;
      ```
    fr: |
      Vous activez l'identité managée affectée par le système d'adatum-orders. Connecté à OrdersDb en tant qu'administrateur Microsoft Entra, vous exécutez les instructions suivantes.

      ```sql
      CREATE USER [adatum-orders] FROM EXTERNAL PROVIDER;
      ALTER ROLE db_owner ADD MEMBER [adatum-orders];
      ```

      Vous remplacez la chaîne de connexion par la valeur suivante.

      ```text
      Server=tcp:adatum-sql.database.windows.net;Database=OrdersDb;Authentication=Active Directory Default;
      ```
answer: { value: false }
explanation:
  correct:
    en: The connection is passwordless because the driver gets a token from the managed identity. However, db_owner can perform all configuration and maintenance activities in the database, including schema changes and permission management, which the app doesn't need. Membership in db_datareader and db_datawriter is enough to read and write the tables.
    fr: "La connexion est sans mot de passe, car le pilote obtient un jeton auprès de l'identité managée. Cependant, db_owner peut effectuer toutes les activités de configuration et de maintenance de la base de données, y compris les modifications de schéma et la gestion des autorisations, dont l'application n'a pas besoin. L'appartenance à db_datareader et db_datawriter suffit pour lire et écrire dans les tables."
references:
  - title: "Tutorial: Use managed identity to connect an Azure web app to an Azure SQL database without secrets"
    url: https://learn.microsoft.com/en-us/azure/app-service/tutorial-connect-msi-sql-database
