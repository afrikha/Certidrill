id: dp800-2d-nested-read
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin exposes the dbo.Orders and dbo.OrderLines tables through Data API builder (DAB) as the entities Order and OrderLine. dbo.OrderLines has a foreign key to dbo.Orders.

    A mobile application must retrieve an order together with its lines in one request, and choose which fields of the order and of the lines are returned. You must not create new database objects.

    What should you do?
  fr: |
    Tailspin expose les tables dbo.Orders et dbo.OrderLines avec Data API builder (DAB) sous la forme des entités Order et OrderLine. dbo.OrderLines a une clé étrangère vers dbo.Orders.

    Une application mobile doit récupérer une commande avec ses lignes en une seule requête, et choisir les champs de la commande et des lignes qui sont renvoyés. Vous ne devez pas créer de nouveaux objets de base de données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Define a relationship from Order to OrderLine, and have the application call the REST endpoint of Order with $select.", fr: "Définir une relation d'Order vers OrderLine, et faire appeler le point de terminaison REST d'Order avec $select par l'application." } }
    - { id: b, text: { en: "Define a relationship from Order to OrderLine, and have the application send a GraphQL query on Order.", fr: "Définir une relation d'Order vers OrderLine, et faire envoyer une requête GraphQL sur Order par l'application." } }
    - { id: c, text: { en: "Enable multiple-mutations create in the GraphQL runtime settings, and have the application send a GraphQL query on Order.", fr: "Activer multiple-mutations create dans les paramètres runtime GraphQL, et faire envoyer une requête GraphQL sur Order par l'application." } }
    - { id: d, text: { en: "Have the application call the REST endpoints of Order and OrderLine in parallel with $filter on the order ID.", fr: "Faire appeler en parallèle les points de terminaison REST d'Order et d'OrderLine avec $filter sur l'ID de commande par l'application." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Relationships let a GraphQL query navigate from one entity to related entities, and a GraphQL client lists exactly the fields it needs at each level. REST doesn't support relationships, so only GraphQL returns the order and its lines in one request.
    fr: |
      Les relations permettent à une requête GraphQL de naviguer d'une entité vers les entités associées, et un client GraphQL liste exactement les champs dont il a besoin à chaque niveau. REST ne prend pas en charge les relations : seul GraphQL renvoie la commande et ses lignes en une seule requête.
  options:
    a: { en: "REST doesn't support relationships; $select only chooses columns of the Order entity.", fr: "REST ne prend pas en charge les relations ; $select ne choisit que des colonnes de l'entité Order." }
    c: { en: "multiple-mutations create is for creating related rows in one mutation; reading nested data needs a relationship.", fr: "multiple-mutations create sert à créer des lignes associées en une seule mutation ; la lecture de données imbriquées exige une relation." }
    d: { en: "Two parallel calls are two requests, not one.", fr: "Deux appels parallèles constituent deux requêtes, pas une seule." }
references:
  - title: Entity relationships - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/database/relationships
