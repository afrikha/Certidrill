id: dp800-2d-rest-query
objective: "2.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso exposes the SalesLT.Product table through Data API builder (DAB) as an entity named Product, on the default REST path. The table has Color and ListPrice columns.

    A web page must show red products whose list price is at least 100, the most expensive first, 20 products per page.

    How should you complete the request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso expose la table SalesLT.Product avec Data API builder (DAB) sous la forme d'une entité nommée Product, sur le chemin REST par défaut. La table a des colonnes Color et ListPrice.

    Une page web doit afficher les produits rouges dont le prix catalogue est au moins égal à 100, du plus cher au moins cher, 20 produits par page.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    GET /api/Product?[[p1]]=Color eq 'Red' and ListPrice [[op]] 100&[[p2]]=ListPrice desc&[[p3]]=20
  slots:
    - id: p1
      options:
        - { id: filter, text: "$filter" }
        - { id: search, text: "$search" }
        - { id: where, text: "$where" }
    - id: op
      options:
        - { id: gte, text: gte }
        - { id: ge, text: ge }
        - { id: gt, text: gt }
        - { id: sym, text: ">=" }
    - id: p2
      options:
        - { id: sort, text: "$sort" }
        - { id: orderBy, text: orderBy }
        - { id: orderby, text: "$orderby" }
    - id: p3
      options:
        - { id: top, text: "$top" }
        - { id: first, text: "$first" }
        - { id: take, text: "$take" }
answer:
  values: { p1: filter, op: ge, p2: orderby, p3: first }
explanation:
  correct:
    en: |
      DAB REST endpoints use OData-style query parameters: $filter restricts rows with operators such as eq, ne, gt, ge, lt, le, and, or and not, so "at least 100" is ge 100. $orderby sets the sort order (ListPrice desc), and $first limits the number of items per page; the response then contains a nextLink with an $after token for the next page. Query parameters are case sensitive.
    fr: |
      Les points de terminaison REST de DAB utilisent des paramètres de requête de style OData : $filter restreint les lignes avec des opérateurs comme eq, ne, gt, ge, lt, le, and, or et not ; « au moins 100 » s'écrit donc ge 100. $orderby définit l'ordre de tri (ListPrice desc), et $first limite le nombre d'éléments par page ; la réponse contient alors un nextLink avec un jeton $after pour la page suivante. Les paramètres de requête respectent la casse.
  options:
    gte: { en: "gte isn't a REST $filter operator; \"greater than or equal\" is ge.", fr: "gte n'est pas un opérateur $filter REST ; « supérieur ou égal » s'écrit ge." }
    gt: { en: "gt excludes products whose price is exactly 100.", fr: "gt exclut les produits dont le prix est exactement 100." }
    sym: { en: "$filter uses OData operators, not comparison symbols.", fr: "$filter utilise des opérateurs OData, pas des symboles de comparaison." }
    orderBy: { en: "orderBy is the GraphQL argument; REST uses $orderby, and parameters are case sensitive.", fr: "orderBy est l'argument GraphQL ; REST utilise $orderby, et les paramètres respectent la casse." }
    top: { en: "DAB REST pages are sized with $first, not $top.", fr: "Les pages REST de DAB sont dimensionnées avec $first, pas $top." }
references:
  - title: How to call REST endpoints - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/api/rest
  - title: Use $filter (REST) - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/keywords/filter-rest
