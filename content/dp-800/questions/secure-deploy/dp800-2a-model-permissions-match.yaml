id: dp800-2a-model-permissions-match
objective: "2.1.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database that contains an external model named **EmbedSmall**. EmbedSmall uses a database scoped credential that authenticates with the managed identity of the logical server.

    You need to grant permissions to three database roles. The solution must follow the principle of least privilege.

    Which permission should you grant to each role? To answer, drag the appropriate permissions to the correct roles. Each permission may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database qui contient un modèle externe nommé **EmbedSmall**. EmbedSmall utilise des informations d'identification délimitées à la base de données qui s'authentifient avec l'identité managée du serveur logique.

    Vous devez accorder des autorisations à trois rôles de base de données. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous accorder à chaque rôle ? Pour répondre, faites glisser les autorisations appropriées vers les rôles correspondants. Chaque autorisation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: create, text: CREATE EXTERNAL MODEL }
    - { id: alterany, text: ALTER ANY EXTERNAL MODEL }
    - { id: execmodel, text: "EXECUTE ON EXTERNAL MODEL::EmbedSmall" }
    - { id: endpoint, text: EXECUTE ANY EXTERNAL ENDPOINT }
    - { id: control, text: CONTROL ON DATABASE }
  targets:
    - id: engineers
      text: { en: "MLEngineers: create new external models", fr: "MLEngineers : créer de nouveaux modèles externes" }
    - id: leads
      text: { en: "MLLeads: change the definition of any existing external model", fr: "MLLeads : modifier la définition de n'importe quel modèle externe existant" }
    - id: search
      text: { en: "SearchApp: generate embeddings by using AI_GENERATE_EMBEDDINGS with EmbedSmall", fr: "SearchApp : générer des embeddings à l'aide d'AI_GENERATE_EMBEDDINGS avec EmbedSmall" }
answer:
  mapping: { engineers: create, leads: alterany, search: execmodel }
explanation:
  correct:
    en: |
      CREATE EXTERNAL MODEL lets a principal create models, and ALTER ANY EXTERNAL MODEL lets it create or change any model of the database. Using a model in an AI function such as AI_GENERATE_EMBEDDINGS requires EXECUTE on that external model. EXECUTE ANY EXTERNAL ENDPOINT is the permission for direct calls to sp_invoke_external_rest_endpoint, and CONTROL on the database grants far more than required.
    fr: |
      CREATE EXTERNAL MODEL permet à un principal de créer des modèles, et ALTER ANY EXTERNAL MODEL lui permet de créer ou de modifier n'importe quel modèle de la base de données. Utiliser un modèle dans une fonction IA comme AI_GENERATE_EMBEDDINGS exige EXECUTE sur ce modèle externe. EXECUTE ANY EXTERNAL ENDPOINT est l'autorisation des appels directs à sp_invoke_external_rest_endpoint, et CONTROL sur la base de données accorde bien plus que nécessaire.
references:
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
