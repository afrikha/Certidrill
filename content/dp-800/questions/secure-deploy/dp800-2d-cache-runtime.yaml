id: dp800-2d-cache-runtime
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware exposes a product catalog through Data API builder (DAB) 2.0. The runtime section of the configuration file has no cache property. The Product entity contains the following setting:

    ```json
    "cache": { "enabled": true, "ttl-seconds": 120 }
    ```

    Database monitoring shows that every REST GET request on the Product entity still runs a query against the database.

    You need responses of the Product entity to be cached for 120 seconds.

    What should you do?
  fr: |
    Proseware expose un catalogue de produits avec Data API builder (DAB) 2.0. La section runtime du fichier de configuration n'a pas de propriété cache. L'entité Product contient le paramètre suivant :

    ```json
    "cache": { "enabled": true, "ttl-seconds": 120 }
    ```

    La supervision de la base de données montre que chaque requête REST GET sur l'entité Product exécute toujours une requête sur la base de données.

    Vous devez faire mettre en cache les réponses de l'entité Product pendant 120 secondes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add \"level\": \"L1\" to the cache setting of the Product entity.", fr: "Ajouter \"level\": \"L1\" au paramètre cache de l'entité Product." } }
    - { id: b, text: { en: "Add \"cache\": { \"enabled\": true } to the runtime section.", fr: "Ajouter \"cache\": { \"enabled\": true } à la section runtime." } }
    - { id: c, text: { en: "Add \"cache\": { \"ttl-seconds\": 120 } to the runtime section.", fr: "Ajouter \"cache\": { \"ttl-seconds\": 120 } à la section runtime." } }
    - { id: d, text: { en: "Add \"level-2\": { \"enabled\": true } to the cache setting of the Product entity.", fr: "Ajouter \"level-2\": { \"enabled\": true } au paramètre cache de l'entité Product." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Caching must be turned on globally: runtime.cache.enabled defaults to false, and while it's false the entity-level enabled setting has no effect. Once the runtime cache is enabled, the entity opts in with its own cache block, and its ttl-seconds (120) overrides the runtime default of 5 seconds.
    fr: |
      La mise en cache doit être activée globalement : runtime.cache.enabled vaut false par défaut, et tant qu'il vaut false, le paramètre enabled de l'entité n'a aucun effet. Une fois le cache du runtime activé, l'entité s'y inscrit avec son propre bloc cache, et son ttl-seconds (120) remplace la valeur par défaut du runtime, 5 secondes.
  options:
    a: { en: "The level only chooses in-memory or in-memory plus distributed cache; the cache stays off while runtime.cache.enabled is false.", fr: "Le niveau choisit seulement le cache en mémoire ou le cache en mémoire plus distribué ; le cache reste désactivé tant que runtime.cache.enabled vaut false." }
    c: { en: "Setting a runtime TTL doesn't turn caching on; enabled stays false by default.", fr: "Définir une durée de vie au niveau du runtime n'active pas la mise en cache ; enabled reste à false par défaut." }
    d: { en: "level-2 is configured under runtime.cache, and it adds a distributed cache only when caching is enabled.", fr: "level-2 se configure sous runtime.cache, et il n'ajoute un cache distribué que si la mise en cache est activée." }
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
  - title: Implement level 1 cache - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/cache/level-1
