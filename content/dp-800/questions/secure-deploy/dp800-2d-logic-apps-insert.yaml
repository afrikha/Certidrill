id: dp800-2d-logic-apps-insert
objective: "2.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip stores support tickets in the dbo.Tickets table of an Azure SQL database. When a new ticket is inserted, an email must be sent to the support manager through Office 365 Outlook.

    The operations team must build and maintain the solution in a visual designer, without writing or deploying code. A delay of a few minutes is acceptable.

    What should you use?
  fr: |
    Wingtip stocke les tickets de support dans la table dbo.Tickets d'une base de données Azure SQL. Lorsqu'un nouveau ticket est inséré, un e-mail doit être envoyé au responsable du support par Office 365 Outlook.

    L'équipe d'exploitation doit créer et maintenir la solution dans un concepteur visuel, sans écrire ni déployer de code. Un délai de quelques minutes est acceptable.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An Azure Functions app with an Azure SQL trigger on dbo.Tickets", fr: "Une application Azure Functions avec un déclencheur Azure SQL sur dbo.Tickets" } }
    - { id: b, text: { en: "Change event streaming of dbo.Tickets to an Azure Event Hubs namespace", fr: "Le streaming d'événements de modification de dbo.Tickets vers un espace de noms Azure Event Hubs" } }
    - { id: c, text: { en: "An Azure Logic Apps workflow with the SQL Server trigger When an item is created", fr: "Un flux de travail Azure Logic Apps avec le déclencheur SQL Server When an item is created" } }
    - { id: d, text: { en: "Change data capture on dbo.Tickets, read by a scheduled T-SQL script", fr: "La capture des données modifiées sur dbo.Tickets, lue par un script T-SQL planifié" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Logic Apps workflows are built in a designer from connectors. The SQL Server trigger When an item is created checks the table on the frequency and interval you set and starts the workflow for the new row, and an Office 365 Outlook action sends the email, with no code to write or deploy.
    fr: |
      Les flux de travail Logic Apps se créent dans un concepteur à partir de connecteurs. Le déclencheur SQL Server When an item is created vérifie la table selon la fréquence et l'intervalle définis et démarre le flux de travail pour la nouvelle ligne, et une action Office 365 Outlook envoie l'e-mail, sans code à écrire ni à déployer.
  options:
    a: { en: "The Azure SQL trigger of Azure Functions runs function code that must be written and deployed.", fr: "Le déclencheur Azure SQL d'Azure Functions exécute du code de fonction qu'il faut écrire et déployer." }
    b: { en: "Change event streaming publishes events to Event Hubs; another component would still have to consume them and send the email.", fr: "Le streaming d'événements de modification publie des événements dans Event Hubs ; un autre composant devrait encore les consommer et envoyer l'e-mail." }
    d: { en: "CDC stores changes in change tables; a script would still be code to write, and T-SQL doesn't send Outlook emails.", fr: "CDC stocke les modifications dans des tables de modifications ; un script resterait du code à écrire, et T-SQL n'envoie pas d'e-mails Outlook." }
references:
  - title: Connect to SQL Databases from Workflows - Azure Logic Apps
    url: https://learn.microsoft.com/en-us/azure/connectors/connectors-create-api-sqlazure
