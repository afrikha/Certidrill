id: dp800-2d-slow-sql-insights
objective: "2.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware runs Data API builder (DAB) in Azure Container Apps in front of an Azure SQL database. Users report that some REST and GraphQL calls are slow.

    You need to identify which API requests are slow and which SQL queries sent by DAB cause the delay, including the duration of each query.

    What should you configure?
  fr: |
    Proseware exécute Data API builder (DAB) dans Azure Container Apps devant une base de données Azure SQL. Des utilisateurs signalent que certains appels REST et GraphQL sont lents.

    Vous devez identifier les requêtes d'API lentes et les requêtes SQL envoyées par DAB qui causent le retard, y compris la durée de chaque requête.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "The application-insights section of runtime.telemetry, with an Application Insights connection string", fr: "La section application-insights de runtime.telemetry, avec une chaîne de connexion Application Insights" } }
    - { id: b, text: { en: "The azure-log-analytics section of runtime.telemetry, with a data collection rule and a custom table", fr: "La section azure-log-analytics de runtime.telemetry, avec une règle de collecte de données et une table personnalisée" } }
    - { id: c, text: { en: "A diagnostic setting on the database that archives the SQLInsights category to a storage account", fr: "Un paramètre de diagnostic sur la base de données qui archive la catégorie SQLInsights dans un compte de stockage" } }
    - { id: d, text: { en: "The file section of runtime.telemetry, with a daily rolling interval", fr: "La section file de runtime.telemetry, avec un intervalle de rotation quotidien" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With Application Insights, DAB sends requests (REST and GraphQL calls with their duration and status code) and dependencies (each SQL query with its duration), plus traces and exceptions. The requests and dependencies tables show which calls are slow and which queries they ran.
    fr: |
      Avec Application Insights, DAB envoie les requêtes (appels REST et GraphQL avec leur durée et leur code d'état) et les dépendances (chaque requête SQL avec sa durée), ainsi que les traces et les exceptions. Les tables requests et dependencies montrent les appels lents et les requêtes qu'ils ont exécutées.
  options:
    b: { en: "The Log Analytics sink sends DAB log entries (traces and errors) to a custom table, not request and dependency telemetry.", fr: "Le récepteur Log Analytics envoie les entrées de journal DAB (traces et erreurs) dans une table personnalisée, pas la télémétrie des requêtes et des dépendances." }
    c: { en: "Database diagnostics don't know which API request issued each query, and an archive in storage isn't meant for analysis.", fr: "Les diagnostics de la base de données ne savent pas quelle requête d'API a émis chaque requête SQL, et une archive dans un compte de stockage n'est pas destinée à l'analyse." }
    d: { en: "The file sink writes local log files; it doesn't record request and dependency durations.", fr: "Le récepteur file écrit des fichiers journaux locaux ; il n'enregistre pas la durée des requêtes et des dépendances." }
references:
  - title: Use Azure Application Insights in Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights
