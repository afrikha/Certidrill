id: dp800-2d-go-live-changes
objective: "2.4.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin is preparing the production deployment of its Data API builder (DAB) API. The runtime section of the configuration file currently contains the following settings:

    ```json
    "host": {
      "mode": "development",
      "cors": { "origins": [ "*" ], "allow-credentials": false },
      "authentication": {
        "provider": "EntraId",
        "jwt": {
          "audience": "api://tailspin-booking",
          "issuer": "https://login.microsoftonline.com/<tenant-id>/v2.0"
        }
      }
    }
    ```

    The solution must meet the following requirements:

    - Swagger UI and the Nitro GraphQL client must not be exposed.
    - Only the single-page application hosted at https://booking.tailspin.com can call the API from a browser.
    - REST and GraphQL must stay available.

    Which two changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin prépare le déploiement de production de son API Data API builder (DAB). La section runtime du fichier de configuration contient actuellement les paramètres suivants :

    ```json
    "host": {
      "mode": "development",
      "cors": { "origins": [ "*" ], "allow-credentials": false },
      "authentication": {
        "provider": "EntraId",
        "jwt": {
          "audience": "api://tailspin-booking",
          "issuer": "https://login.microsoftonline.com/<tenant-id>/v2.0"
        }
      }
    }
    ```

    La solution doit respecter les exigences suivantes :

    - Swagger UI et le client GraphQL Nitro ne doivent pas être exposés.
    - Seule l'application monopage hébergée à l'adresse https://booking.tailspin.com peut appeler l'API depuis un navigateur.
    - REST et GraphQL doivent rester disponibles.

    Quelles sont les deux modifications à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set mode to production.", fr: "Définir mode sur production." } }
    - { id: b, text: { en: "Set allow-credentials to true.", fr: "Définir allow-credentials sur true." } }
    - { id: c, text: { en: "Set origins to [ \"https://booking.tailspin.com\" ].", fr: "Définir origins sur [ \"https://booking.tailspin.com\" ]." } }
    - { id: d, text: { en: "Set the provider to Unauthenticated.", fr: "Définir le fournisseur sur Unauthenticated." } }
    - { id: e, text: { en: "Set runtime.graphql.enabled to false.", fr: "Définir runtime.graphql.enabled sur false." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Development mode enables Swagger UI, Nitro, anonymous health checks and debug logging, so production deployments use production mode. CORS origins list the browser origins allowed to call the API: the wildcard * allows every site, so it's replaced by the origin of the single-page application.
    fr: |
      Le mode development active Swagger UI, Nitro, les contrôles d'intégrité anonymes et la journalisation de débogage : les déploiements de production utilisent le mode production. Les origines CORS listent les origines de navigateur autorisées à appeler l'API : le caractère générique * autorise tous les sites, il est donc remplacé par l'origine de l'application monopage.
  options:
    b: { en: "allow-credentials sets the Access-Control-Allow-Credentials header; it doesn't restrict which origins can call the API.", fr: "allow-credentials définit l'en-tête Access-Control-Allow-Credentials ; il ne restreint pas les origines qui peuvent appeler l'API." }
    d: { en: "Unauthenticated stops validating tokens: every request would run as anonymous.", fr: "Unauthenticated cesse de valider les jetons : chaque requête s'exécuterait en tant qu'anonymous." }
    e: { en: "Disabling GraphQL removes the GraphQL endpoint, which must stay available; production mode is enough to hide Nitro.", fr: "Désactiver GraphQL supprime le point de terminaison GraphQL, qui doit rester disponible ; le mode production suffit à masquer Nitro." }
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
