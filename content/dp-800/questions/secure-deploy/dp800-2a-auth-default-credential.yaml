id: dp800-2a-auth-default-credential
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are developing a .NET application that uses Microsoft.Data.SqlClient to connect to an Azure SQL Database.

    Developers run the application on their workstations while signed in to Visual Studio with their Microsoft Entra accounts. In production, the application runs in Azure Container Apps with a system-assigned managed identity.

    The same connection string must work in both environments, and no password or secret must be stored. Which value should you use for the Authentication keyword?
  fr: |
    Vous développez une application .NET qui utilise Microsoft.Data.SqlClient pour se connecter à une base de données Azure SQL Database.

    Les développeurs exécutent l'application sur leurs postes de travail en étant connectés à Visual Studio avec leurs comptes Microsoft Entra. En production, l'application s'exécute dans Azure Container Apps avec une identité managée affectée par le système.

    La même chaîne de connexion doit fonctionner dans les deux environnements, et aucun mot de passe ni secret ne doit être stocké. Quelle valeur devez-vous utiliser pour le mot clé Authentication ?
body:
  options:
    - { id: a, text: "Active Directory Managed Identity" }
    - { id: b, text: "Active Directory Interactive" }
    - { id: c, text: "Active Directory Default" }
    - { id: d, text: "Active Directory Integrated" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Active Directory Default uses the DefaultAzureCredential chain of Azure Identity. On a workstation, it finds the developer's Microsoft Entra sign-in from tools such as Visual Studio or the Azure CLI; in Azure, it uses the managed identity of the host. One connection string therefore works in both places without any secret.
    fr: |
      Active Directory Default utilise la chaîne DefaultAzureCredential d'Azure Identity. Sur un poste de travail, elle trouve la connexion Microsoft Entra du développeur dans des outils comme Visual Studio ou Azure CLI ; dans Azure, elle utilise l'identité managée de l'hôte. Une seule chaîne de connexion fonctionne donc aux deux endroits sans aucun secret.
  options:
    a: { en: "This mode works only where a managed identity exists, so it fails on the developer workstations.", fr: "Ce mode ne fonctionne que là où une identité managée existe : il échoue sur les postes des développeurs." }
    b: { en: "Interactive authentication prompts a user to sign in, which cannot work for the unattended production application.", fr: "L'authentification interactive invite un utilisateur à se connecter, ce qui ne peut pas fonctionner pour l'application de production sans surveillance." }
    d: { en: "Integrated uses the Windows domain identity of the signed-in user and has no managed identity in Container Apps.", fr: "Integrated utilise l'identité de domaine Windows de l'utilisateur connecté et ne dispose d'aucune identité managée dans Container Apps." }
references:
  - title: Microsoft Entra authentication with Microsoft.Data.SqlClient
    url: https://learn.microsoft.com/en-us/sql/connect/ado-net/sql/azure-active-directory-authentication
