id: dp800-2d-date-filter
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind exposes the dbo.Orders table through Data API builder (DAB) as an entity named Order. OrderDate is a datetime2 column, and Status is an nvarchar column.

    A reporting client must retrieve, through REST, the orders placed since January 1, 2026 (UTC) that aren't cancelled.

    Which request should the client send?
  fr: |
    Northwind expose la table dbo.Orders avec Data API builder (DAB) sous la forme d'une entité nommée Order. OrderDate est une colonne datetime2, et Status est une colonne nvarchar.

    Un client de rapports doit récupérer, par REST, les commandes passées depuis le 1er janvier 2026 (UTC) qui ne sont pas annulées.

    Quelle requête le client doit-il envoyer ?
body:
  options:
    - { id: a, text: "GET /api/Order?$filter=OrderDate ge '2026-01-01' and Status ne 'Cancelled'" }
    - { id: b, text: "GET /api/Order?$filter=OrderDate ge datetime'2026-01-01' and Status ne 'Cancelled'" }
    - { id: c, text: "GET /api/Order?$filter=OrderDate ge 2026-01-01T00:00:00Z and Status ne 'Cancelled'" }
    - { id: d, text: "GET /api/Order?$filter=OrderDate ge 2026-01-01T00:00:00Z and not Status 'Cancelled'" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In a DAB $filter expression, date and datetime values are written unquoted in ISO 8601 UTC format (yyyy-MM-ddTHH:mm:ssZ). ne is the "not equal" operator, and and combines the two conditions; DAB compiles the expression to parameterized SQL.
    fr: |
      Dans une expression $filter de DAB, les valeurs de date et datetime s'écrivent sans guillemets au format ISO 8601 UTC (yyyy-MM-ddTHH:mm:ssZ). ne est l'opérateur « différent de », et and combine les deux conditions ; DAB compile l'expression en SQL paramétré.
  options:
    a: { en: "A quoted date is a string literal, which isn't the supported date format.", fr: "Une date entre guillemets est un littéral de chaîne, ce qui n'est pas le format de date pris en charge." }
    b: { en: "The datetime'...' prefix isn't supported; dates are written unquoted in ISO 8601 UTC format.", fr: "Le préfixe datetime'...' n'est pas pris en charge ; les dates s'écrivent sans guillemets au format ISO 8601 UTC." }
    d: { en: "not negates a whole condition; Status 'Cancelled' has no comparison operator.", fr: "not inverse une condition entière ; Status 'Cancelled' n'a pas d'opérateur de comparaison." }
references:
  - title: Use $filter (REST) - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/keywords/filter-rest
