id: dp800-cs2a-national-id
objective: "2.1.1"
type: single
caseStudy: dp800-cs2a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to protect the NationalId column of dbo.Patients. The solution must meet the security requirements.

    What should you implement?
  fr: |
    Vous devez protéger la colonne NationalId de dbo.Patients. La solution doit satisfaire les exigences de sécurité.

    Que devez-vous implémenter ?
body:
  options:
    - id: a
      text:
        en: Always Encrypted with deterministic encryption that uses a column encryption key protected by a column master key in Azure Key Vault
        fr: Always Encrypted avec un chiffrement déterministe qui utilise une clé de chiffrement de colonne protégée par une clé principale de colonne dans Azure Key Vault
    - id: b
      text:
        en: Always Encrypted with secure enclaves, with randomized encryption that uses an enclave-enabled column encryption key
        fr: Always Encrypted avec enclaves sécurisées, avec un chiffrement aléatoire qui utilise une clé de chiffrement de colonne compatible enclave
    - id: c
      text:
        en: Dynamic Data Masking with a partial() mask that exposes the first six digits, and UNMASK granted to the front-desk application
        fr: Le masquage dynamique des données avec un masque partial() qui expose les six premiers chiffres, et UNMASK accordé à l'application d'accueil
    - id: d
      text:
        en: Column-level encryption with ENCRYPTBYKEY and a symmetric key protected by a certificate in ClinicalDb
        fr: Le chiffrement au niveau des colonnes avec ENCRYPTBYKEY et une clé symétrique protégée par un certificat dans ClinicalDb
answer: { optionId: b }
explanation:
  correct:
    en: |
      With Always Encrypted, the data and the column encryption keys are never exposed in plaintext in the Database Engine outside the secure enclave, so DBAs who don't hold the keys cannot see the values. Pattern matching with LIKE on an encrypted column requires a secure enclave, randomized encryption and an enclave-enabled column encryption key; deterministic encryption without an enclave supports only equality. Azure SQL Database supports VBS enclaves, which don't require special hardware.
    fr: |
      Avec Always Encrypted, les données et les clés de chiffrement de colonne ne sont jamais exposées en clair dans le moteur de base de données en dehors de l'enclave sécurisée : les DBA qui ne détiennent pas les clés ne peuvent pas voir les valeurs. La recherche de modèle avec LIKE sur une colonne chiffrée exige une enclave sécurisée, un chiffrement aléatoire et une clé de chiffrement de colonne compatible enclave ; le chiffrement déterministe sans enclave ne prend en charge que l'égalité. Azure SQL Database prend en charge les enclaves VBS, qui n'exigent pas de matériel particulier.
  options:
    a: { en: "Deterministic encryption without an enclave supports equality lookups only, so LIKE @prefix would fail on the encrypted column.", fr: "Le chiffrement déterministe sans enclave ne prend en charge que les recherches d'égalité : LIKE @prefix échouerait sur la colonne chiffrée." }
    c: { en: "Dynamic Data Masking only hides values in query results, and members of db_owner always see the unmasked data.", fr: "Le masquage dynamique des données masque seulement les valeurs dans les résultats, et les membres de db_owner voient toujours les données non masquées." }
    d: { en: "The symmetric key and its certificate are stored in ClinicalDb, so a member of db_owner can open the key and decrypt the values.", fr: "La clé symétrique et son certificat sont stockés dans ClinicalDb : un membre de db_owner peut ouvrir la clé et déchiffrer les valeurs." }
references:
  - title: Always Encrypted with secure enclaves
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
