id: dp800-2b-blocking-deadlock-yesno
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a database in Azure SQL Database. The support team sees two kinds of incidents: sessions that wait a long time for locks, and transactions that fail with error 1205.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'une base de données dans Azure SQL Database. L'équipe de support constate deux types d'incidents : des sessions qui attendent longtemps des verrous, et des transactions qui échouent avec l'erreur 1205.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Increasing the application's command timeout eliminates error 1205, because the deadlocked sessions eventually obtain their locks.
        fr: |
          Augmenter le délai de commande de l'application élimine l'erreur 1205, car les sessions en interblocage finissent par obtenir leurs verrous.
    - id: s2
      text:
        en: |
          When the sessions in a deadlock have the same DEADLOCK_PRIORITY, the victim is the session whose transaction is the least expensive to roll back.
        fr: |
          Lorsque les sessions d'un interblocage ont la même valeur DEADLOCK_PRIORITY, la victime est la session dont la transaction est la moins coûteuse à annuler.
    - id: s3
      text:
        en: |
          A session in the rollback state keeps blocking the sessions that wait for its locks until the rollback completes.
        fr: |
          Une session à l'état rollback continue de bloquer les sessions qui attendent ses verrous jusqu'à la fin de l'annulation.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A deadlock is a cycle that never resolves by waiting; the deadlock monitor rolls back a victim and returns error 1205, so a longer timeout changes nothing. The session with the lower DEADLOCK_PRIORITY is chosen; with equal priorities, the engine picks the transaction that is less expensive to roll back. A session that is rolling back still holds its locks; the blocking resolves on its own when the rollback finishes, which accelerated database recovery makes fast.
    fr: |
      Un interblocage est un cycle qui ne se résout jamais par l'attente ; le moniteur d'interblocage annule une victime et renvoie l'erreur 1205 : un délai plus long ne change rien. La session dont la valeur DEADLOCK_PRIORITY est la plus basse est choisie ; à priorités égales, le moteur choisit la transaction la moins coûteuse à annuler. Une session en cours d'annulation conserve ses verrous ; le blocage se résout de lui-même à la fin de l'annulation, que la récupération de base de données accélérée rend rapide.
references:
  - title: Analyze and prevent deadlocks in Azure SQL Database and SQL database in Fabric
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/analyze-prevent-deadlocks
  - title: Understand and resolve blocking problems
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking
