id: dp800-2d-two-way-relationship
objective: "2.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip exposes the dbo.Categories and dbo.Products tables through Data API builder (DAB) as the entities Category and Product, in the same configuration file. Each product belongs to one category through the CategoryID foreign key of dbo.Products.

    GraphQL clients must be able to query each category with its products, and each product with its category.

    Which two relationships should you define? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip expose les tables dbo.Categories et dbo.Products avec Data API builder (DAB) sous la forme des entités Category et Product, dans le même fichier de configuration. Chaque produit appartient à une catégorie par la clé étrangère CategoryID de dbo.Products.

    Les clients GraphQL doivent pouvoir interroger chaque catégorie avec ses produits, et chaque produit avec sa catégorie.

    Quelles sont les deux relations à définir ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On Category, a relationship named products with cardinality one and target.entity Product", fr: "Sur Category, une relation nommée products avec la cardinalité one et target.entity Product" } }
    - { id: b, text: { en: "On Product, a relationship named category with cardinality one and target.entity Category", fr: "Sur Product, une relation nommée category avec la cardinalité one et target.entity Category" } }
    - { id: c, text: { en: "On Category, a relationship named products with cardinality many and target.entity Product", fr: "Sur Category, une relation nommée products avec la cardinalité many et target.entity Product" } }
    - { id: d, text: { en: "On Product, a relationship named category with cardinality many, target.entity Category and linking.object dbo.Products", fr: "Sur Product, une relation nommée category avec la cardinalité many, target.entity Category et linking.object dbo.Products" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      A relationship is defined on its source entity and navigates in one direction only, so each direction needs its own relationship. A category has many products (cardinality many on Category), and a product has one category (cardinality one on Product). Because a foreign key exists, DAB can infer source.fields and target.fields.
    fr: |
      Une relation est définie sur son entité source et ne navigue que dans un sens : chaque sens a besoin de sa propre relation. Une catégorie a plusieurs produits (cardinalité many sur Category), et un produit a une seule catégorie (cardinalité one sur Product). Comme une clé étrangère existe, DAB peut déduire source.fields et target.fields.
  options:
    a: { en: "cardinality one would return a single product per category.", fr: "La cardinalité one renverrait un seul produit par catégorie." }
    d: { en: "linking.object is for many-to-many relationships through a join table; a product has only one category.", fr: "linking.object sert aux relations plusieurs-à-plusieurs par une table de jointure ; un produit n'a qu'une seule catégorie." }
references:
  - title: Entity relationships - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/database/relationships
