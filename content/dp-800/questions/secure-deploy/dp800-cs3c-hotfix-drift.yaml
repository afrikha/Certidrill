id: dp800-cs3c-hotfix-drift
objective: "2.3.7"
type: ordering
caseStudy: dp800-cs3c-litware-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to resolve the differences between ClaimsProd and ClaimsDb. The solution must meet the development requirements.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez résoudre les différences entre ClaimsProd et ClaimsDb. La solution doit satisfaire les exigences de développement.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: branch, text: { en: "Create a feature branch of litware-claims and open the ClaimsDb project from it.", fr: "Créer une branche de fonctionnalité de litware-claims et y ouvrir le projet ClaimsDb." } }
    - { id: compare, text: { en: "Run a schema compare with ClaimsProd as the source and the ClaimsDb project as the target.", fr: "Exécuter une comparaison de schémas avec ClaimsProd comme source et le projet ClaimsDb comme cible." } }
    - { id: apply, text: { en: "Select only the IX_AutoClaim_LossDate difference and apply it to the project.", fr: "Sélectionner uniquement la différence IX_AutoClaim_LossDate et l'appliquer au projet." } }
    - { id: pr, text: { en: "Commit the change and open a pull request to main.", fr: "Valider la modification et ouvrir une pull request vers main." } }
    - { id: reverse, text: { en: "Run a schema compare with the ClaimsDb project as the source and ClaimsProd as the target, and apply all the differences.", fr: "Exécuter une comparaison de schémas avec le projet ClaimsDb comme source et ClaimsProd comme cible, et appliquer toutes les différences." } }
    - { id: extract, text: { en: "Run SqlPackage /Action:Extract with /p:ExtractTarget=SchemaObjectType on ClaimsProd into the project folder, and commit every changed file.", fr: "Exécuter SqlPackage /Action:Extract avec /p:ExtractTarget=SchemaObjectType sur ClaimsProd dans le dossier du projet, et valider chaque fichier modifié." } }
    - { id: hotfix, text: { en: "Script IX_AutoClaim_LossDate from ClaimsProd and run the script on ClaimsTest.", fr: "Générer le script de IX_AutoClaim_LossDate depuis ClaimsProd et exécuter ce script sur ClaimsTest." } }
answer:
  sequence: [ branch, compare, apply, pr ]
explanation:
  correct:
    en: |
      A schema compare with the live database as the source and the project as the target shows the drift in ClaimsProd. Selecting only the index difference imports the hotfix into the project files and leaves dbo.tmp_LoadAudit out. Working in a feature branch and opening a pull request makes the change reach main, and then the claims-cd pipeline, like every other change.
    fr: |
      Une comparaison de schémas avec la base de données active comme source et le projet comme cible montre la dérive de ClaimsProd. Sélectionner uniquement la différence de l'index importe le correctif dans les fichiers du projet et laisse dbo.tmp_LoadAudit de côté. Travailler dans une branche de fonctionnalité et ouvrir une pull request fait parvenir la modification à main, puis au pipeline claims-cd, comme toute autre modification.
  options:
    reverse: { en: "With the project as the source, the comparison previews a deployment; applying it changes ClaimsProd outside the pipeline and doesn't bring the index into the project.", fr: "Avec le projet comme source, la comparaison prévisualise un déploiement ; l'appliquer modifie ClaimsProd hors du pipeline et n'importe pas l'index dans le projet." }
    extract: { en: "Committing every file changed by the extraction would also add dbo.tmp_LoadAudit to the project.", fr: "Valider chaque fichier modifié par l'extraction ajouterait aussi dbo.tmp_LoadAudit au projet." }
    hotfix: { en: "Running a script on ClaimsTest bypasses the project, so the index would still be missing from ClaimsDb.", fr: "Exécuter un script sur ClaimsTest contourne le projet : l'index manquerait toujours dans ClaimsDb." }
references:
  - title: Detect and resolve schema drift
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/05-detect-resolve-schema-drift
  - title: Schema comparison overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/schema-comparison
