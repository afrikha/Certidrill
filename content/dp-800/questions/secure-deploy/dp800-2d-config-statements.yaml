id: dp800-2d-config-statements
objective: "2.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs Data API builder (DAB) in production mode with the following configuration excerpt:

    ```json
    {
      "data-source": {
        "database-type": "mssql",
        "connection-string": "@env('SQL_CONN')"
      },
      "runtime": {
        "host": {
          "mode": "production",
          "cors": { "origins": [ "https://orders.northwind.com" ] },
          "authentication": { "provider": "Unauthenticated" }
        }
      },
      "entities": {
        "Order": {
          "source": { "object": "dbo.Orders", "type": "table" },
          "permissions": [
            { "role": "anonymous", "actions": [ "read" ] },
            { "role": "authenticated", "actions": [ "create", "update" ] }
          ]
        }
      }
    }
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exécute Data API builder (DAB) en mode production avec l'extrait de configuration suivant :

    ```json
    {
      "data-source": {
        "database-type": "mssql",
        "connection-string": "@env('SQL_CONN')"
      },
      "runtime": {
        "host": {
          "mode": "production",
          "cors": { "origins": [ "https://orders.northwind.com" ] },
          "authentication": { "provider": "Unauthenticated" }
        }
      },
      "entities": {
        "Order": {
          "source": { "object": "dbo.Orders", "type": "table" },
          "permissions": [
            { "role": "anonymous", "actions": [ "read" ] },
            { "role": "authenticated", "actions": [ "create", "update" ] }
          ]
        }
      }
    }
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A request that carries a valid Microsoft Entra ID access token can create an order.
        fr: Une requête qui porte un jeton d'accès Microsoft Entra ID valide peut créer une commande.
    - id: s2
      text:
        en: The value of SQL_CONN can be supplied by an environment variable or by a .env file.
        fr: La valeur de SQL_CONN peut être fournie par une variable d'environnement ou par un fichier .env.
    - id: s3
      text:
        en: If you add a second origin to the CORS origins in the file, the running engine applies the change without a restart.
        fr: Si vous ajoutez une deuxième origine aux origines CORS dans le fichier, le moteur en cours d'exécution applique la modification sans redémarrage.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      With the Unauthenticated provider, DAB validates no token and every request runs as anonymous; the authenticated role and custom roles are never activated, so nobody can create an order. The @env() function reads an environment variable, and DAB also supports .env files. In production mode, the log level under runtime.telemetry is the only setting that supports hot reload, so a CORS change needs a restart.
    fr: |
      Avec le fournisseur Unauthenticated, DAB ne valide aucun jeton et chaque requête s'exécute en tant qu'anonymous ; le rôle authenticated et les rôles personnalisés ne sont jamais activés : personne ne peut créer de commande. La fonction @env() lit une variable d'environnement, et DAB prend aussi en charge les fichiers .env. En mode production, le niveau de journalisation de runtime.telemetry est le seul paramètre qui prend en charge le rechargement à chaud : une modification CORS exige un redémarrage.
references:
