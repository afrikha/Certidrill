id: dp800-2b-test-pipeline-order
objective: "2.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an SDK-style SQL database project and a C# test project that contains SQL Server unit tests. You are designing the Azure Pipelines run that starts when changes are pushed to `main`.

    The pipeline must meet the following requirements:

    - Unit tests run against a dedicated test database that matches the project.
    - A failing test must prevent the change from reaching the staging database.
    - No test runs against production.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin dispose d'un projet de base de données SQL de style SDK et d'un projet de test C# qui contient des tests unitaires SQL Server. Vous concevez l'exécution Azure Pipelines qui démarre lorsque des modifications sont envoyées sur `main`.

    Le pipeline doit satisfaire les exigences suivantes :

    - Les tests unitaires s'exécutent sur une base de test dédiée qui correspond au projet.
    - Un test en échec doit empêcher la modification d'atteindre la base de préproduction.
    - Aucun test ne s'exécute sur la production.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: build
      text:
        en: |
          Build the SQL project with dotnet build to produce the .dacpac file.
        fr: |
          Générer le projet SQL avec dotnet build pour produire le fichier .dacpac.
    - id: deploytest
      text:
        en: |
          Publish the .dacpac file to the test database with SqlPackage.
        fr: |
          Publier le fichier .dacpac sur la base de test avec SqlPackage.
    - id: vstest
      text:
        en: |
          Run the unit tests with the VSTest task against the test database.
        fr: |
          Exécuter les tests unitaires avec la tâche VSTest sur la base de test.
    - id: staging
      text:
        en: |
          Publish the .dacpac file to the staging database.
        fr: |
          Publier le fichier .dacpac sur la base de préproduction.
    - id: extract
      text:
        en: |
          Extract a .dacpac file from the production database with SqlPackage.
        fr: |
          Extraire un fichier .dacpac de la base de production avec SqlPackage.
    - id: prodtest
      text:
        en: |
          Run the unit tests against a copy of the production connection string.
        fr: |
          Exécuter les tests unitaires avec une copie de la chaîne de connexion de production.
answer:
  sequence: [build, deploytest, vstest, staging]
explanation:
  correct:
    en: |
      The build validates the project and produces the .dacpac. Deploying it to the dedicated test database brings that database in line with the project, then the VSTest task runs the unit tests. Because the staging deployment comes after the tests, a failing test stops the pipeline before the change reaches staging.
    fr: |
      Le build valide le projet et produit le fichier .dacpac. Son déploiement sur la base de test dédiée aligne cette base sur le projet, puis la tâche VSTest exécute les tests unitaires. Comme le déploiement en préproduction vient après les tests, un test en échec arrête le pipeline avant que la modification n'atteigne la préproduction.
  options:
    extract: { en: "Extracting from production creates a model of production; the tests must run against the project being changed.", fr: "L'extraction depuis la production crée un modèle de la production ; les tests doivent porter sur le projet modifié." }
    prodtest: { en: "Tests must never run against production.", fr: "Les tests ne doivent jamais s'exécuter sur la production." }
references:
  - title: Design and implement a testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/07-design-implement-testing-strategy
