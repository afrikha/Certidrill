id: dp800-2c-dep-dacpac-task-script
objective: "2.3.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum deploys an SDK-style SQL database project to the Azure SQL database **PayrollDb** with an Azure Pipelines YAML pipeline. A review stage runs on a **windows-latest** agent before the production stage. The Azure Resource Manager service connection **sc-payroll-prod** uses a service principal that has a database user in PayrollDb.

    The review stage must meet the following requirements:

    - It authenticates to PayrollDb as the service principal of sc-payroll-prod, without a SQL login.
    - It produces the T-SQL statements that a deployment would run, for a reviewer to read, without changing PayrollDb.

    How should you complete the task? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie un projet de base de données SQL de style SDK sur la base de données Azure SQL **PayrollDb** avec un pipeline YAML Azure Pipelines. Une phase de révision s'exécute sur un agent **windows-latest** avant la phase de production. La connexion de service Azure Resource Manager **sc-payroll-prod** utilise un principal de service qui dispose d'un utilisateur de base de données dans PayrollDb.

    La phase de révision doit respecter les exigences suivantes :

    - Elle s'authentifie auprès de PayrollDb avec le principal de service de sc-payroll-prod, sans connexion SQL.
    - Elle produit les instructions T-SQL qu'un déploiement exécuterait, pour qu'un réviseur les lise, sans modifier PayrollDb.

    Comment devez-vous compléter la tâche ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    - task: SqlAzureDacpacDeployment@1
      inputs:
        azureSubscription: sc-payroll-prod
        AuthenticationType: [[auth]]
        ServerName: sql-adatum.database.windows.net
        DatabaseName: PayrollDb
        deployType: DacpacTask
        DeploymentAction: [[action]]
        DacpacFile: $(Pipeline.Workspace)/dacpac/PayrollDb.dacpac
  slots:
    - id: auth
      options:
        - { id: sp, text: "servicePrincipal" }
        - { id: server, text: "server" }
        - { id: aadpwd, text: "aadAuthenticationPassword" }
        - { id: connstr, text: "connectionString" }
    - id: action
      options:
        - { id: script, text: "Script" }
        - { id: deployreport, text: "DeployReport" }
        - { id: publish, text: "Publish" }
        - { id: extract, text: "Extract" }
answer:
  values: { auth: sp, action: script }
explanation:
  correct:
    en: |
      The servicePrincipal authentication type uses the service principal of the Azure Resource Manager service connection, so no SQL login or password is needed. The Script deployment action generates the T-SQL script that a publish would run against PayrollDb, without applying it.
    fr: |
      Le type d'authentification servicePrincipal utilise le principal de service de la connexion de service Azure Resource Manager : aucune connexion SQL ni mot de passe n'est nécessaire. L'action de déploiement Script génère le script T-SQL qu'une publication exécuterait sur PayrollDb, sans l'appliquer.
  options:
    server: { en: "server is SQL Server authentication, which needs a SQL login and password.", fr: "server correspond à l'authentification SQL Server, qui nécessite une connexion SQL et un mot de passe." }
    aadpwd: { en: "Active Directory - Password needs a user name and password.", fr: "Active Directory - Password nécessite un nom d'utilisateur et un mot de passe." }
    connstr: { en: "A connection string would have to carry the credentials itself.", fr: "Une chaîne de connexion devrait contenir elle-même les informations d'identification." }
    deployreport: { en: "DeployReport produces an XML summary of the operations, not the T-SQL statements.", fr: "DeployReport produit un résumé XML des opérations, pas les instructions T-SQL." }
    publish: { en: "Publish applies the changes to PayrollDb.", fr: "Publish applique les modifications à PayrollDb." }
    extract: { en: "Extract creates a .dacpac from the database; it does not show the changes of the project.", fr: "Extract crée un .dacpac à partir de la base de données ; il ne montre pas les modifications du projet." }
references:
  - title: SqlAzureDacpacDeployment@1 - Azure SQL Database deployment v1 task
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/sql-azure-dacpac-deployment-v1
