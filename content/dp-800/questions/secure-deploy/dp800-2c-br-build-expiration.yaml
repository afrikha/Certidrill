id: dp800-2c-br-build-expiration
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam stores an SDK-style SQL database project in an Azure Repos Git repository. Two pull requests target **main**:

    - PR 101 renames the column CustName to FullName in **Tables/Customer.sql**.
    - PR 102 adds a stored procedure that selects CustName from dbo.Customer.

    Both pull requests built successfully when they were created. PR 101 was completed first, then PR 102 was completed without any Git conflict. The next build of main fails because the procedure references a column that does not exist.

    You need to prevent a pull request from being completed when its changes no longer build against the current version of main.

    What should you configure on main?
  fr: |
    Fabrikam stocke un projet de base de données SQL de style SDK dans un dépôt Git Azure Repos. Deux pull requests ciblent **main** :

    - La PR 101 renomme la colonne CustName en FullName dans **Tables/Customer.sql**.
    - La PR 102 ajoute une procédure stockée qui sélectionne CustName dans dbo.Customer.

    Les deux pull requests ont été générées avec succès lors de leur création. La PR 101 a été terminée en premier, puis la PR 102 a été terminée sans aucun conflit Git. La génération suivante de main échoue, car la procédure référence une colonne qui n'existe pas.

    Vous devez empêcher qu'une pull request soit terminée lorsque ses modifications ne se génèrent plus avec la version actuelle de main.

    Que devez-vous configurer sur main ?
body:
  options:
    - { id: a, text: { en: "A required build validation policy that runs dotnet build, with the build expiration set to Never", fr: "Une stratégie de validation de build obligatoire qui exécute dotnet build, avec l'expiration du build définie sur Never" } }
    - { id: b, text: { en: "A required build validation policy that runs dotnet build, with the build expiration set to Immediately when main is updated", fr: "Une stratégie de validation de build obligatoire qui exécute dotnet build, avec l'expiration du build définie sur Immediately when main is updated" } }
    - { id: c, text: { en: "A minimum number of reviewers policy that resets all approval votes when new changes are pushed", fr: "Une stratégie de nombre minimal de réviseurs qui réinitialise tous les votes d'approbation lorsque de nouvelles modifications sont poussées" } }
    - { id: d, text: { en: "A limit merge types policy that allows only squash merge for pull requests into main", fr: "Une stratégie de limitation des types de fusion qui autorise uniquement la fusion squash pour les pull requests vers main" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Build validation compiles the pull request merged with its target branch, and dotnet build fails on unresolved references such as a column that a rename removed. With the expiration set to Immediately when main is updated, completing PR 101 invalidates the earlier build result of PR 102, which must build again against the new main and then fails.
    fr: |
      La validation de build compile la pull request fusionnée avec sa branche cible, et dotnet build échoue sur des références non résolues, comme une colonne supprimée par un renommage. Avec l'expiration définie sur Immediately when main is updated, la fin de la PR 101 invalide le résultat de build antérieur de la PR 102, qui doit être regénérée avec le nouveau main et échoue alors.
  options:
    a: { en: "With Never, the successful build of PR 102 stays valid after main changes, which is exactly what happened.", fr: "Avec Never, le build réussi de la PR 102 reste valide après la modification de main, ce qui s'est justement produit." }
    c: { en: "Resetting votes applies when the pull request itself changes, not when main changes, and reviewers cannot be relied on to detect broken references.", fr: "La réinitialisation des votes s'applique lorsque la pull request elle-même change, pas lorsque main change, et les réviseurs ne détectent pas de façon fiable les références rompues." }
    d: { en: "The merge type changes the shape of the history, not whether the merged code builds.", fr: "Le type de fusion modifie la forme de l'historique, pas la capacité du code fusionné à se générer." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
