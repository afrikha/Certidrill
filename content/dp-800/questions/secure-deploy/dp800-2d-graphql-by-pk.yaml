id: dp800-2d-graphql-by-pk
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum exposes the dbo.Products table through Data API builder (DAB) as an entity named Product, with the GraphQL type singular name product and plural name products. ProductID is the primary key of the table.

    A client must retrieve the name and the price of the product whose ProductID is 680, through GraphQL, with a single query.

    Which query should the client send?
  fr: |
    Adatum expose la table dbo.Products avec Data API builder (DAB) sous la forme d'une entité nommée Product, avec le nom singulier product et le nom pluriel products pour le type GraphQL. ProductID est la clé primaire de la table.

    Un client doit récupérer le nom et le prix du produit dont le ProductID est 680, par GraphQL, avec une seule requête.

    Quelle requête le client doit-il envoyer ?
body:
  options:
    - { id: a, text: "{ product(ProductID: 680) { Name ListPrice } }" }
    - { id: b, text: "{ executeProduct(ProductID: 680) { Name ListPrice } }" }
    - { id: c, text: "{ products_by_key(ProductID: 680) { Name ListPrice } }" }
    - { id: d, text: "{ product_by_pk(ProductID: 680) { Name ListPrice } }" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For each table or view entity, DAB generates two GraphQL queries: one that returns a list (products, with its items) and one that returns a single record by primary key, named after the singular name with the _by_pk suffix. product_by_pk takes the key column as its argument.
    fr: |
      Pour chaque entité de table ou de vue, DAB génère deux requêtes GraphQL : une qui renvoie une liste (products, avec ses items) et une qui renvoie un seul enregistrement par clé primaire, nommée d'après le nom singulier avec le suffixe _by_pk. product_by_pk prend la colonne clé comme argument.
  options:
    a: { en: "DAB doesn't generate a query named after the singular name alone; single-record queries use the _by_pk suffix.", fr: "DAB ne génère pas de requête portant seulement le nom singulier ; les requêtes d'un seul enregistrement utilisent le suffixe _by_pk." }
    b: { en: "The execute prefix is used for stored procedure entities, not for tables.", fr: "Le préfixe execute est utilisé pour les entités de procédure stockée, pas pour les tables." }
    c: { en: "The suffix is _by_pk, and it's added to the singular name.", fr: "Le suffixe est _by_pk, et il est ajouté au nom singulier." }
references:
  - title: How to call GraphQL endpoints - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/api/graphql
