id: dp800-2b-drop-index-bc
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has an 8-vCore Business Critical database in Azure SQL Database. The database contains many nonclustered indexes that no query has used for several months, and several pairs of duplicate indexes. Some unused indexes are unique indexes that enforce UNIQUE constraints. The workload doesn't use index hints or partition switching.

    You run the following statement.

    ```sql
    ALTER DATABASE CURRENT SET AUTOMATIC_TUNING (DROP_INDEX = ON);
    ```

    Which indexes can automatic tuning drop?
  fr: |
    Woodgrove dispose d'une base de données Business Critical de 8 vCores dans Azure SQL Database. La base contient de nombreux index non cluster qu'aucune requête n'a utilisés depuis plusieurs mois, ainsi que plusieurs paires d'index en double. Certains index inutilisés sont des index uniques qui appliquent des contraintes UNIQUE. La charge de travail n'utilise ni indicateurs d'index ni basculement de partitions.

    Vous exécutez l'instruction suivante.

    ```sql
    ALTER DATABASE CURRENT SET AUTOMATIC_TUNING (DROP_INDEX = ON);
    ```

    Quels index le réglage automatique peut-il supprimer ?
body:
  options:
    - id: a
      text:
        en: |
          The duplicate indexes and the nonunique indexes that weren't used for 90 days
        fr: |
          Les index en double et les index non uniques inutilisés depuis 90 jours
    - id: b
      text:
        en: |
          The duplicate indexes, but none of the unused indexes
        fr: |
          Les index en double, mais aucun des index inutilisés
    - id: c
      text:
        en: |
          Every index that wasn't used for 90 days, including the unique indexes
        fr: |
          Tous les index inutilisés depuis 90 jours, y compris les index uniques
    - id: d
      text:
        en: |
          No index, until CREATE_INDEX is also set to ON
        fr: |
          Aucun index, tant que CREATE_INDEX n'est pas aussi défini sur ON
answer: { optionId: b }
explanation:
  correct:
    en: |
      DROP_INDEX normally drops duplicate indexes and indexes unused for more than 90 days, but on the Premium and Business Critical tiers it never drops unused indexes, only duplicates. Unique indexes, including those that support primary keys and UNIQUE constraints, are never dropped.
    fr: |
      DROP_INDEX supprime normalement les index en double et les index inutilisés depuis plus de 90 jours, mais dans les niveaux Premium et Business Critical, il ne supprime jamais les index inutilisés, seulement les doublons. Les index uniques, y compris ceux des clés primaires et des contraintes UNIQUE, ne sont jamais supprimés.
  options:
    a:
      en: |
        That is the behavior in other tiers; Business Critical keeps unused indexes.
      fr: |
        C'est le comportement des autres niveaux ; Business Critical conserve les index inutilisés.
    c:
      en: |
        Automatic tuning never drops unique indexes, and on Business Critical it doesn't drop unused indexes.
      fr: |
        Le réglage automatique ne supprime jamais les index uniques et, en Business Critical, il ne supprime pas les index inutilisés.
    d:
      en: |
        Each automatic tuning option is independent; DROP_INDEX doesn't require CREATE_INDEX.
      fr: |
        Chaque option de réglage automatique est indépendante ; DROP_INDEX n'exige pas CREATE_INDEX.
references:
  - title: Automatic database tuning
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automatic-tuning-overview
