id: dp800-2c-code-analysis-cli
objective: "2.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an SDK-style SQL database project named **InventoryDb**. Code analysis is not enabled in the project file.

    You need to update the CI pipeline command so that the build meets the following requirements without modifying the project file:

    - Code analysis runs on every CI build.
    - A procedure that uses `@@IDENTITY` (rule SR0008) fails the build.
    - Rule SR0007 is not reported.
    - All the other rules keep their default behavior.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un projet de base de données SQL de style SDK nommé **InventoryDb**. L'analyse du code n'est pas activée dans le fichier projet.

    Vous devez modifier la commande du pipeline CI pour que la génération respecte les exigences suivantes, sans modifier le fichier projet :

    - L'analyse du code s'exécute à chaque génération CI.
    - Une procédure qui utilise `@@IDENTITY` (règle SR0008) fait échouer la génération.
    - La règle SR0007 n'est pas signalée.
    - Toutes les autres règles conservent leur comportement par défaut.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    dotnet build InventoryDb/InventoryDb.sqlproj \
      /p:[[prop]]=True \
      /p:SqlCodeAnalysisRules="[[rules]]"
  slots:
    - id: prop
      options:
        - { id: run, text: "RunSqlCodeAnalysis" }
        - { id: twae, text: "TreatWarningsAsErrors" }
        - { id: aip, text: "AllowIncompatiblePlatform" }
        - { id: bopdl, text: "BlockOnPossibleDataLoss" }
    - id: rules
      options:
        - { id: ok, text: "-Microsoft.Rules.Data.SR0007;+!Microsoft.Rules.Data.SR0008" }
        - { id: swap, text: "+!Microsoft.Rules.Data.SR0007;-Microsoft.Rules.Data.SR0008" }
        - { id: noerr, text: "-Microsoft.Rules.Data.SR0007;+Microsoft.Rules.Data.SR0008" }
        - { id: all, text: "+!Microsoft.Rules.Data.SR0007;+!Microsoft.Rules.Data.SR0008" }
answer:
  values: { prop: run, rules: ok }
explanation:
  correct:
    en: "`/p:RunSqlCodeAnalysis=True` turns on code analysis for this build without editing the project file. In SqlCodeAnalysisRules, `-` disables a rule and `+!` makes its detections build errors, so `-...SR0007;+!...SR0008` hides SR0007 and fails the build on SR0008, while the rules that are not listed stay warnings."
    fr: "`/p:RunSqlCodeAnalysis=True` active l'analyse du code pour cette génération sans modifier le fichier projet. Dans SqlCodeAnalysisRules, `-` désactive une règle et `+!` transforme ses détections en erreurs de génération : `-...SR0007;+!...SR0008` masque SR0007 et fait échouer la génération sur SR0008, tandis que les règles non listées restent des avertissements."
  options:
    twae: { en: "TreatWarningsAsErrors does not turn on code analysis, so no rule would be evaluated.", fr: "TreatWarningsAsErrors n'active pas l'analyse du code : aucune règle ne serait évaluée." }
    aip: { en: "AllowIncompatiblePlatform is a SqlPackage publish property about target platforms, not about code analysis.", fr: "AllowIncompatiblePlatform est une propriété de publication SqlPackage liée aux plateformes cibles, pas à l'analyse du code." }
    bopdl: { en: "BlockOnPossibleDataLoss is a publish property that stops deployments that could lose data.", fr: "BlockOnPossibleDataLoss est une propriété de publication qui arrête les déploiements susceptibles de perdre des données." }
    swap: { en: "This makes SR0007 an error and disables SR0008, the opposite of the requirements.", fr: "Cette valeur fait de SR0007 une erreur et désactive SR0008, soit l'inverse des exigences." }
    noerr: { en: "Without `!`, SR0008 stays a warning and does not fail the build.", fr: "Sans `!`, SR0008 reste un avertissement et ne fait pas échouer la génération." }
    all: { en: "SR0007 must not be reported; this value makes it a build error.", fr: "SR0007 ne doit pas être signalée ; cette valeur en fait une erreur de génération." }
references:
  - title: SQL code analysis
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/sql-code-analysis/sql-code-analysis
