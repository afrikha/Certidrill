id: dp800-2b-deadlock-capture-order
objective: "2.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a database in Azure SQL Database. The application receives error 1205 a few times per day, and no deadlock information is being collected.

    You need to view the graph of the next deadlock in SQL Server Management Studio (SSMS).

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'une base de données dans Azure SQL Database. L'application reçoit l'erreur 1205 quelques fois par jour, et aucune information d'interblocage n'est collectée.

    Vous devez afficher le graphe du prochain interblocage dans SQL Server Management Studio (SSMS).

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: create
      text:
        en: |
          Create an event session ON DATABASE that captures sqlserver.database_xml_deadlock_report with a ring_buffer target.
        fr: |
          Créer une session d'événements ON DATABASE qui capture sqlserver.database_xml_deadlock_report avec une cible ring_buffer.
    - id: start
      text:
        en: |
          Run ALTER EVENT SESSION ... ON DATABASE STATE = START.
        fr: |
          Exécuter ALTER EVENT SESSION ... ON DATABASE STATE = START.
    - id: query
      text:
        en: |
          After the next deadlock, query the ring_buffer target and extract the deadlock XML.
        fr: |
          Après le prochain interblocage, interroger la cible ring_buffer et extraire le XML de l'interblocage.
    - id: xdl
      text:
        en: |
          Save the XML as a file with the .xdl extension and open it in SSMS.
        fr: |
          Enregistrer le XML dans un fichier avec l'extension .xdl et l'ouvrir dans SSMS.
    - id: server
      text:
        en: |
          Create an event session ON SERVER that captures xml_deadlock_report.
        fr: |
          Créer une session d'événements ON SERVER qui capture xml_deadlock_report.
    - id: qs
      text:
        en: |
          Open the Regressed Queries report of Query Store.
        fr: |
          Ouvrir le rapport Regressed Queries du Magasin des requêtes.
answer:
  sequence: [create, start, query, xdl]
explanation:
  correct:
    en: |
      In Azure SQL Database, you capture deadlock graphs with a database-scoped Extended Events session on the database_xml_deadlock_report event; a ring buffer target is fine for a quick capture, and an event file in Azure Storage keeps data longer. After starting the session and waiting for a deadlock, you read the XML from the target, save it as an .xdl file and open it in SSMS to see the victim, processes and resources.
    fr: |
      Dans Azure SQL Database, vous capturez les graphes d'interblocage avec une session Événements étendus délimitée à la base de données sur l'événement database_xml_deadlock_report ; une cible ring_buffer convient pour une capture rapide, et un fichier d'événements dans Stockage Azure conserve les données plus longtemps. Après avoir démarré la session et attendu un interblocage, vous lisez le XML depuis la cible, l'enregistrez dans un fichier .xdl et l'ouvrez dans SSMS pour voir la victime, les processus et les ressources.
  options:
    server: { en: "Azure SQL Database uses database-scoped event sessions; server-scoped sessions belong to SQL Server and SQL Managed Instance.", fr: "Azure SQL Database utilise des sessions d'événements délimitées à la base de données ; les sessions au niveau serveur relèvent de SQL Server et de SQL Managed Instance." }
    qs: { en: "Query Store can show the plans of the queries involved but doesn't record deadlock graphs.", fr: "Le Magasin des requêtes peut montrer les plans des requêtes impliquées, mais n'enregistre pas les graphes d'interblocage." }
references:
  - title: Analyze and prevent deadlocks in Azure SQL Database and SQL database in Fabric
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/analyze-prevent-deadlocks
