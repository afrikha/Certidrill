id: dp800-2d-diagnostic-destinations
objective: "2.4.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove configures diagnostic settings for an Azure SQL database that serves a Data API builder (DAB) API. Each requirement is met by a separate diagnostic setting.

    Which destination should you select for each requirement? To answer, drag the appropriate destinations to the correct requirements. Each destination may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove configure des paramètres de diagnostic pour une base de données Azure SQL qui sert une API Data API builder (DAB). Chaque exigence est satisfaite par un paramètre de diagnostic distinct.

    Quelle destination devez-vous sélectionner pour chaque exigence ? Pour répondre, faites glisser les destinations appropriées vers les exigences correspondantes. Chaque destination peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: law, text: { en: "Log Analytics workspace", fr: "Espace de travail Log Analytics" } }
    - { id: evh, text: { en: "Event hub in the region of the database", fr: "Hub d'événements dans la région de la base de données" } }
    - { id: sa, text: { en: "Storage account", fr: "Compte de stockage" } }
    - { id: appi, text: { en: "Application Insights resource", fr: "Ressource Application Insights" } }
  targets:
    - id: t1
      text: { en: "Stream the logs to a third-party SIEM that consumes events in near real time", fr: "Diffuser les journaux vers un SIEM tiers qui consomme des événements en quasi-temps réel" }
    - id: t2
      text: { en: "Keep the logs for five years at the lowest cost", fr: "Conserver les journaux pendant cinq ans au coût le plus bas" }
    - id: t3
      text: { en: "Query the logs with KQL and create alert rules", fr: "Interroger les journaux avec KQL et créer des règles d'alerte" }
answer:
  mapping: { t1: evh, t2: sa, t3: law }
explanation:
  correct:
    en: |
      An Azure SQL diagnostic setting can send telemetry to a Log Analytics workspace, stream it to an event hub, or archive it to a storage account. Event Hubs feeds third-party tools and must be in the same region as the database. A storage account, with its retention policy, is the low-cost archive. Log Analytics supports KQL queries, workbooks and log alerts.
    fr: |
      Un paramètre de diagnostic Azure SQL peut envoyer la télémétrie vers un espace de travail Log Analytics, la diffuser vers un hub d'événements ou l'archiver dans un compte de stockage. Event Hubs alimente les outils tiers et doit se trouver dans la même région que la base de données. Un compte de stockage, avec sa stratégie de rétention, est l'archive à faible coût. Log Analytics prend en charge les requêtes KQL, les classeurs et les alertes de journal.
  options:
    appi: { en: "Application Insights isn't a destination of a database diagnostic setting; it receives telemetry from applications such as DAB.", fr: "Application Insights n'est pas une destination d'un paramètre de diagnostic de base de données ; il reçoit la télémétrie d'applications comme DAB." }
references:
  - title: Configure Streaming Export of Metrics and Resource Logs - Azure SQL Database & Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/metrics-diagnostic-telemetry-logging-streaming-export-configure
