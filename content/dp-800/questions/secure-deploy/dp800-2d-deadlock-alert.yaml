id: dp800-2d-deadlock-alert
objective: "2.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL database named OrdersDb. Data API builder (DAB), a nightly batch and several reporting tools connect to OrdersDb. No diagnostic setting is configured on the database.

    You need the operations team to receive an alert within minutes whenever a deadlock occurs in OrdersDb, whichever application is involved.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une base de données Azure SQL nommée OrdersDb. Data API builder (DAB), un traitement par lots nocturne et plusieurs outils de rapports se connectent à OrdersDb. Aucun paramètre de diagnostic n'est configuré sur la base de données.

    Vous devez faire en sorte que l'équipe d'exploitation reçoive une alerte en quelques minutes chaque fois qu'un interblocage se produit dans OrdersDb, quelle que soit l'application impliquée.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add Application Insights to the DAB configuration and alert on exceptions.", fr: "Ajouter Application Insights à la configuration DAB et créer une alerte sur les exceptions." } }
    - { id: b, text: { en: "Create a diagnostic setting on OrdersDb that sends the Deadlocks category to a storage account.", fr: "Créer un paramètre de diagnostic sur OrdersDb qui envoie la catégorie Deadlocks vers un compte de stockage." } }
    - { id: c, text: { en: "Create a diagnostic setting on OrdersDb that sends the Deadlocks category to a Log Analytics workspace.", fr: "Créer un paramètre de diagnostic sur OrdersDb qui envoie la catégorie Deadlocks vers un espace de travail Log Analytics." } }
    - { id: d, text: { en: "Create a log search alert rule on the workspace that queries the deadlock records.", fr: "Créer une règle d'alerte de recherche dans les journaux sur l'espace de travail qui interroge les enregistrements d'interblocage." } }
    - { id: e, text: { en: "Review the top queries of OrdersDb in Query Performance Insight every morning.", fr: "Consulter chaque matin les principales requêtes d'OrdersDb dans Query Performance Insight." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Streaming export of diagnostic telemetry isn't enabled by default. A diagnostic setting that sends the Deadlocks log category to a Log Analytics workspace stores the deadlock records of every session in the AzureDiagnostics table. A log search alert rule on that workspace then runs a KQL query on a schedule and notifies the team.
    fr: |
      L'exportation en continu de la télémétrie de diagnostic n'est pas activée par défaut. Un paramètre de diagnostic qui envoie la catégorie de journal Deadlocks vers un espace de travail Log Analytics stocke les enregistrements d'interblocage de toutes les sessions dans la table AzureDiagnostics. Une règle d'alerte de recherche dans les journaux sur cet espace de travail exécute ensuite une requête KQL selon une planification et avertit l'équipe.
  options:
    a: { en: "Application Insights on DAB sees only the errors returned to DAB, not the deadlocks of the batch or the reporting tools.", fr: "Application Insights sur DAB ne voit que les erreurs renvoyées à DAB, pas les interblocages du traitement par lots ou des outils de rapports." }
    b: { en: "A storage account archives logs at low cost but can't run alert queries.", fr: "Un compte de stockage archive les journaux à faible coût, mais ne peut pas exécuter de requêtes d'alerte." }
    e: { en: "A daily manual review doesn't alert within minutes, and Query Performance Insight shows resource-consuming queries, not deadlock events.", fr: "Une revue manuelle quotidienne n'alerte pas en quelques minutes, et Query Performance Insight montre les requêtes consommatrices de ressources, pas les événements d'interblocage." }
references:
  - title: Configure Streaming Export of Metrics and Resource Logs - Azure SQL Database & Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/metrics-diagnostic-telemetry-logging-streaming-export-configure
