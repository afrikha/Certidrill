id: dp800-cs1b-release-pipeline
objective: "2.3.8"
type: ordering
caseStudy: dp800-cs1b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You need to update the GitHub Actions workflow that deploys WWI.Shipping to production. The solution must meet the deployment requirements.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez mettre à jour le flux de travail GitHub Actions qui déploie WWI.Shipping en production. La solution doit respecter les exigences de déploiement.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: build, text: { en: "In the build job, run dotnet build on the WWI.Shipping project and upload the .dacpac file as a workflow artifact.", fr: "Dans le travail de build, exécuter dotnet build sur le projet WWI.Shipping et charger le fichier .dacpac comme artefact du flux de travail." } }
    - { id: report, text: { en: "In a job that downloads the artifact, run SqlPackage /Action:DeployReport with the .dacpac file against the production database and publish the XML report.", fr: "Dans un travail qui télécharge l'artefact, exécuter SqlPackage /Action:DeployReport avec le fichier .dacpac sur la base de données de production et publier le rapport XML." } }
    - { id: approve, text: { en: "Start a job that references the production environment, so that the required reviewer approves it after reading the report.", fr: "Démarrer un travail qui référence l'environnement production, pour que le réviseur obligatoire l'approuve après avoir lu le rapport." } }
    - { id: publish, text: { en: "In the approved job, run SqlPackage /Action:Publish with the same .dacpac file against the production database.", fr: "Dans le travail approuvé, exécuter SqlPackage /Action:Publish avec le même fichier .dacpac sur la base de données de production." } }
    - { id: extract, text: { en: "Run SqlPackage /Action:Extract against the production database to create a .dacpac file of its current schema.", fr: "Exécuter SqlPackage /Action:Extract sur la base de données de production pour créer un fichier .dacpac de son schéma actuel." } }
    - { id: rebuild, text: { en: "In the production job, check out the main branch and run dotnet build again before the deployment.", fr: "Dans le travail de production, extraire la branche main et exécuter de nouveau dotnet build avant le déploiement." } }
answer:
  sequence: [ build, report, approve, publish ]
explanation:
  correct:
    en: |
      Building an SDK-style project with dotnet build produces the .dacpac file, which later jobs download as an artifact. SqlPackage DeployReport creates an XML report of the changes that a publish of this .dacpac would make to the target, without changing it. The job that references the production environment waits for the required reviewer, and only then does SqlPackage Publish apply the same .dacpac file.
    fr: |
      La génération d'un projet de style SDK avec dotnet build produit le fichier .dacpac, que les travaux suivants téléchargent comme artefact. SqlPackage DeployReport crée un rapport XML des modifications qu'une publication de ce .dacpac apporterait à la cible, sans la modifier. Le travail qui référence l'environnement production attend le réviseur obligatoire, et c'est seulement ensuite que SqlPackage Publish applique le même fichier .dacpac.
  options:
    extract: { en: "Extract captures the current production schema; it does not show the changes that the project would make.", fr: "Extract capture le schéma actuel de production ; il ne montre pas les modifications que le projet apporterait." }
    rebuild: { en: "The requirements forbid rebuilding the project in the production job; it must deploy the artifact of the build job.", fr: "Les exigences interdisent de régénérer le projet dans le travail de production ; il doit déployer l'artefact du travail de build." }
references:
  - title: SqlPackage deploy report and drift report
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-deploy-drift-report
