id: dp800-sr2-dabcache-2
objective: "2.4.2"
type: series_yesno
series: dp800-sr2-dab-product-cache
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You enable the runtime cache and add a cache section to the Product entity.
  fr: Vous activez le cache du runtime et ajoutez une section cache à l'entité Product.
body:
  solution:
    en: |
      You add the following property to the `runtime` section.

      ```json
      "cache": { "enabled": true }
      ```

      You add the following property to the **Product** entity and leave the **Order** entity unchanged.

      ```json
      "cache": { "enabled": true, "ttl-seconds": 30, "level": "L1" }
      ```
    fr: |
      Vous ajoutez la propriété suivante à la section `runtime`.

      ```json
      "cache": { "enabled": true }
      ```

      Vous ajoutez la propriété suivante à l'entité **Product** et laissez l'entité **Order** inchangée.

      ```json
      "cache": { "enabled": true, "ttl-seconds": 30, "level": "L1" }
      ```
answer: { value: true }
explanation:
  correct:
    en: The runtime setting turns caching on globally, and the Product entity opts in with its own 30-second time-to-live, which overrides the global default of 5 seconds. Level L1 uses the in-memory cache of the instance only, which fits a single instance without Redis. Order doesn't opt in, so its requests keep reading the database.
    fr: "Le paramètre du runtime active la mise en cache globalement, et l'entité Product l'active pour elle-même avec une durée de vie de 30 secondes, qui remplace la valeur globale par défaut de 5 secondes. Le niveau L1 utilise uniquement le cache en mémoire de l'instance, ce qui convient à une instance unique sans Redis. Order ne l'active pas : ses requêtes continuent de lire la base de données."
references:
  - title: Implement level 1 cache
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/cache/level-1
  - title: Configuration schema - Entities section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities
