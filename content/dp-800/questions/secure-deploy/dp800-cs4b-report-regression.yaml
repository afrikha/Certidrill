id: dp800-cs4b-report-regression
objective: "2.2.3"
type: single
caseStudy: dp800-cs4b-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You review the Regressed Queries report of Query Store for RailOps, and you confirm that the RailInsight query regressed because of a plan change.

    You need to meet the reporting requirements.

    Which statement should you run?
  fr: |
    Vous consultez le rapport Requêtes régressées du Magasin des requêtes pour RailOps, et vous confirmez que la requête de RailInsight a régressé à cause d'un changement de plan.

    Vous devez satisfaire les exigences de création de rapports.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - id: a
      text: "`EXEC sp_query_store_force_plan @query_id = 1182, @plan_id = 27;`"
    - id: b
      text: "`EXEC sp_query_store_force_plan @query_id = 1182, @plan_id = 14;`"
    - id: c
      text: "`EXEC sp_recompile N'dbo.Bookings';`"
    - id: d
      text: "`EXEC sp_query_store_remove_plan @plan_id = 14;`"
answer: { optionId: b }
explanation:
  correct:
    en: |
      sp_query_store_force_plan makes the optimizer use the plan stored in Query Store for that query each time it compiles it, without any change to the query text. Plan 14 is the plan that ran in 0.4 seconds before the regression. Query Store data, including forced plans, is stored in the database, so the fix persists across restarts and failovers.
    fr: |
      sp_query_store_force_plan oblige l'optimiseur à utiliser le plan stocké dans le Magasin des requêtes pour cette requête à chaque compilation, sans aucune modification du texte de la requête. Le plan 14 est celui qui s'exécutait en 0,4 seconde avant la régression. Les données du Magasin des requêtes, plans forcés compris, sont stockées dans la base de données : le correctif persiste après un redémarrage ou un basculement.
  options:
    a: { en: "Plan 27 is the slow plan chosen after the statistics update; forcing it keeps the regression.", fr: "Le plan 27 est le plan lent choisi après la mise à jour des statistiques ; le forcer maintient la régression." }
    c: { en: "sp_recompile only marks the plans that use the table for recompilation; the optimizer can choose plan 27 again, and nothing persists.", fr: "sp_recompile marque seulement pour recompilation les plans qui utilisent la table ; l'optimiseur peut choisir de nouveau le plan 27, et rien ne persiste." }
    d: { en: "Removing plan 14 from Query Store deletes the good plan and its statistics instead of making the query use it.", fr: "Supprimer le plan 14 du Magasin des requêtes efface le bon plan et ses statistiques au lieu d'obliger la requête à l'utiliser." }
references:
  - title: sp_query_store_force_plan (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-query-store-force-plan-transact-sql
