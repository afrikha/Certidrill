id: dp800-cs3c-pipeline-controls
objective: "2.3.9"
type: dragdrop
caseStudy: dp800-cs3c-litware-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to configure Azure DevOps for litware-claims and claims-cd. The solution must meet the development requirements.

    What should you configure for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer Azure DevOps pour litware-claims et claims-cd. La solution doit satisfaire les exigences de développement.

    Que devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: build, text: { en: "Build validation policy on main", fr: "Stratégie de validation de build sur main" } }
    - { id: reviewers, text: { en: "Automatically included reviewers policy on main with the path /Database/*", fr: "Stratégie de réviseurs inclus automatiquement sur main avec le chemin /Database/*" } }
    - { id: minimum, text: { en: "Minimum number of reviewers policy on main", fr: "Stratégie de nombre minimal de réviseurs sur main" } }
    - { id: approvals, text: { en: "Approvals check on the claims-prod environment", fr: "Vérification Approbations sur l'environnement claims-prod" } }
    - { id: branch, text: { en: "Branch control check on sc-claims-prod", fr: "Vérification Contrôle de branche sur sc-claims-prod" } }
    - { id: hours, text: { en: "Business hours check on the claims-prod environment", fr: "Vérification Heures d'ouverture sur l'environnement claims-prod" } }
    - { id: lock, text: { en: "Exclusive lock check on sc-claims-prod", fr: "Vérification Verrou exclusif sur sc-claims-prod" } }
  targets:
    - { id: r6, text: { en: "Requirement 6: a pull request completes only if ClaimsDb builds", fr: "Exigence 6 : une pull request ne se termine que si ClaimsDb est généré" } }
    - { id: r7, text: { en: "Requirement 7: the DBA group reviews changes to /Database", fr: "Exigence 7 : le groupe des DBA révise les modifications de /Database" } }
    - { id: r8, text: { en: "Requirement 8: the DBA lead approves deployments to ClaimsProd", fr: "Exigence 8 : le responsable DBA approuve les déploiements sur ClaimsProd" } }
    - { id: r9, text: { en: "Requirement 9: only runs from main use sc-claims-prod", fr: "Exigence 9 : seules les exécutions issues de main utilisent sc-claims-prod" } }
answer:
  mapping: { r6: build, r7: reviewers, r8: approvals, r9: branch }
explanation:
  correct:
    en: |
      A build validation policy requires a pipeline that builds ClaimsDb to succeed before a pull request to main can complete. An automatically included reviewers policy with the path filter /Database/* adds the DBA group as required reviewers to every pull request that changes those files. An Approvals check on claims-prod makes the deployment job wait for the DBA lead, and a Branch control check on sc-claims-prod fails any stage that uses the service connection from a branch other than refs/heads/main.
    fr: |
      Une stratégie de validation de build exige qu'un pipeline qui génère ClaimsDb réussisse avant qu'une pull request vers main puisse être terminée. Une stratégie de réviseurs inclus automatiquement avec le filtre de chemin /Database/* ajoute le groupe des DBA comme réviseurs obligatoires à chaque pull request qui modifie ces fichiers. Une vérification Approbations sur claims-prod fait attendre le responsable DBA au travail de déploiement, et une vérification Contrôle de branche sur sc-claims-prod fait échouer toute phase qui utilise la connexion de service depuis une autre branche que refs/heads/main.
  options:
    minimum: { en: "A minimum number of reviewers counts approvals from anyone; it doesn't require the DBA group for files in /Database.", fr: "Un nombre minimal de réviseurs compte les approbations de n'importe qui ; il n'exige pas le groupe des DBA pour les fichiers de /Database." }
    hours: { en: "A business hours check limits when a deployment can start; it doesn't require anyone's approval.", fr: "Une vérification Heures d'ouverture limite le moment où un déploiement peut démarrer ; elle n'exige l'approbation de personne." }
    lock: { en: "An exclusive lock lets only one run use the resource at a time, whatever its branch.", fr: "Un verrou exclusif ne permet qu'à une seule exécution à la fois d'utiliser la ressource, quelle que soit sa branche." }
references:
  - title: Set and manage branch policies
    url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
