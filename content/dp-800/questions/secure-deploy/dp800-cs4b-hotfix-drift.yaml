id: dp800-cs4b-hotfix-drift
objective: "2.3.7"
type: single
caseStudy: dp800-cs4b-relecloud
difficulty: 1
status: draft
stem:
  en: |
    The developers use Visual Studio Code with the SQL Database Projects extension.

    You need to meet the development requirements before the next run of the GitHub Actions workflow.

    What should you do?
  fr: |
    Les développeurs utilisent Visual Studio Code avec l'extension SQL Database Projects.

    Vous devez satisfaire les exigences de développement avant la prochaine exécution du workflow GitHub Actions.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run SqlPackage with /Action:DriftReport against RailOps, and add the objects listed in the report to the project."
        fr: "Exécuter SqlPackage avec /Action:DriftReport sur RailOps, puis ajouter au projet les objets listés dans le rapport."
    - id: b
      text:
        en: "Run a schema comparison with RailOps as the source and RailOps.sqlproj as the target, and apply the selected differences to the project."
        fr: "Exécuter une comparaison de schémas avec RailOps comme source et RailOps.sqlproj comme cible, puis appliquer les différences sélectionnées au projet."
    - id: c
      text:
        en: "Run a schema comparison with RailOps.sqlproj as the source and RailOps as the target, and apply the selected differences to the database."
        fr: "Exécuter une comparaison de schémas avec RailOps.sqlproj comme source et RailOps comme cible, puis appliquer les différences sélectionnées à la base de données."
    - id: d
      text:
        en: "Set the BlockWhenDriftDetected publish property to True in the workflow, and run the workflow to list the objects that differ."
        fr: "Définir la propriété de publication BlockWhenDriftDetected sur True dans le workflow, puis exécuter le workflow pour lister les objets qui diffèrent."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Schema compare shows every object definition that differs between a database and a project. With the database as the source and the project as the target, you review the differences and apply the ones to keep, such as IX_Bookings_TravelDate, to the project, which you then commit through a pull request. The next publish then keeps the index instead of dropping it.
    fr: |
      La comparaison de schémas affiche chaque définition d'objet qui diffère entre une base de données et un projet. Avec la base de données comme source et le projet comme cible, vous examinez les différences et appliquez au projet celles à conserver, comme IX_Bookings_TravelDate, puis vous les validez par une pull request. La publication suivante conserve alors l'index au lieu de le supprimer.
  options:
    a: { en: "DriftReport lists the changes made to a database since it was registered as a data-tier application, and RailOps isn't registered.", fr: "DriftReport liste les modifications apportées à une base de données depuis son inscription comme application de couche Données, et RailOps n'est pas inscrite." }
    c: { en: "This direction previews and applies the project to the database, which would drop the hotfix index instead of adding it to the project.", fr: "Ce sens prévisualise et applique le projet à la base de données, ce qui supprimerait l'index du correctif au lieu de l'ajouter au projet." }
    d: { en: "BlockWhenDriftDetected blocks the publish of a database whose schema no longer matches its registration or is unregistered; it doesn't list the differences or update the project.", fr: "BlockWhenDriftDetected bloque la publication sur une base de données dont le schéma ne correspond plus à son inscription ou qui n'est pas inscrite ; elle ne liste pas les différences et ne met pas à jour le projet." }
references:
  - title: Compare a database and a project
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/howto/compare-database-project
  - title: SqlPackage deploy report and drift report
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-deploy-drift-report
