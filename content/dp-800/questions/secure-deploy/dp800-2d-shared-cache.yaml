id: dp800-2d-shared-cache
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs Data API builder (DAB) 2.0 in Azure Container Apps with four replicas. Caching is enabled in the runtime section, and the Policy entity has the following setting:

    ```json
    "cache": { "enabled": true, "ttl-seconds": 60, "level": "L1" }
    ```

    The database load from REST GET requests on Policy grows with the number of replicas, because each replica builds its own cache. The company has a Redis cache that DAB can reach.

    You need the four replicas to share cached Policy results. The container app must keep four replicas.

    What should you do?
  fr: |
    Litware exécute Data API builder (DAB) 2.0 dans Azure Container Apps avec quatre réplicas. La mise en cache est activée dans la section runtime, et l'entité Policy a le paramètre suivant :

    ```json
    "cache": { "enabled": true, "ttl-seconds": 60, "level": "L1" }
    ```

    La charge de la base de données due aux requêtes REST GET sur Policy augmente avec le nombre de réplicas, car chaque réplica construit son propre cache. L'entreprise dispose d'un cache Redis que DAB peut joindre.

    Vous devez faire partager les résultats mis en cache de Policy par les quatre réplicas. L'application conteneur doit conserver quatre réplicas.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set ttl-seconds of the Policy entity to 600 and keep the L1 level.", fr: "Définir ttl-seconds de l'entité Policy sur 600 et conserver le niveau L1." } }
    - { id: b, text: { en: "Configure runtime.cache.level-2 with the redis provider and its connection string, and set the Policy cache level to L1L2.", fr: "Configurer runtime.cache.level-2 avec le fournisseur redis et sa chaîne de connexion, et définir le niveau de cache de Policy sur L1L2." } }
    - { id: c, text: { en: "Remove the cache setting of the Policy entity and set runtime.cache.ttl-seconds to 60.", fr: "Supprimer le paramètre cache de l'entité Policy et définir runtime.cache.ttl-seconds sur 60." } }
    - { id: d, text: { en: "Set runtime.compression.level to optimal so that replicas return compressed cached responses.", fr: "Définir runtime.compression.level sur optimal pour que les réplicas renvoient des réponses mises en cache compressées." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The L1 level is an in-memory cache that isn't shared across instances. L1L2 adds a distributed level-2 cache, configured in runtime.cache.level-2 (enabled, provider redis, connection-string), that all scaled-out instances share, while each replica keeps its fast in-memory level.
    fr: |
      Le niveau L1 est un cache en mémoire qui n'est pas partagé entre les instances. L1L2 ajoute un cache distribué de niveau 2, configuré dans runtime.cache.level-2 (enabled, provider redis, connection-string), que toutes les instances mises à l'échelle partagent, tandis que chaque réplica garde son niveau en mémoire rapide.
  options:
    a: { en: "A longer TTL reduces queries, but each replica still keeps its own copy, so the cache isn't shared.", fr: "Une durée de vie plus longue réduit les requêtes, mais chaque réplica garde sa propre copie : le cache n'est pas partagé." }
    c: { en: "Each entity must opt in to caching; without its cache setting, Policy results aren't cached at all.", fr: "Chaque entité doit s'inscrire à la mise en cache ; sans son paramètre cache, les résultats de Policy ne sont plus mis en cache du tout." }
    d: { en: "Compression reduces response size; it doesn't share cache entries between replicas.", fr: "La compression réduit la taille des réponses ; elle ne partage pas les entrées de cache entre les réplicas." }
references:
  - title: Configuration schema - Entities section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
