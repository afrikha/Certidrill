id: dp800-2a-model-credential-identity
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database named **ProductsDb**. A stored procedure calls the Azure OpenAI resource **aoai-products** by using `sp_invoke_external_rest_endpoint`.

    The system-assigned managed identity of the logical server is enabled and has the Cognitive Services OpenAI User role on aoai-products.

    You need to create the database scoped credential used by the procedure. No key or token must be stored in the database.

    Which value should you use for the IDENTITY argument of the credential?
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **ProductsDb**. Une procédure stockée appelle la ressource Azure OpenAI **aoai-products** à l'aide de `sp_invoke_external_rest_endpoint`.

    L'identité managée affectée par le système du serveur logique est activée et dispose du rôle Cognitive Services OpenAI User sur aoai-products.

    Vous devez créer les informations d'identification délimitées à la base de données utilisées par la procédure. Aucune clé ni aucun jeton ne doit être stocké dans la base de données.

    Quelle valeur devez-vous utiliser pour l'argument IDENTITY des informations d'identification ?
body:
  options:
    - { id: c, text: "'HTTPEndpointHeaders'" }
    - { id: b, text: "'HTTPEndpointQueryString'" }
    - { id: a, text: "'Managed Identity'" }
    - { id: d, text: "'Shared Access Signature'" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With IDENTITY = 'Managed Identity', the engine requests a token for the managed identity of the logical server and sends it with the request; the SECRET only holds the resource ID, for Azure OpenAI {"resourceid":"https://cognitiveservices.azure.com"}. No key or token is stored in the database.
    fr: |
      Avec IDENTITY = 'Managed Identity', le moteur demande un jeton pour l'identité managée du serveur logique et l'envoie avec la requête ; le SECRET ne contient que l'ID de ressource, pour Azure OpenAI {"resourceid":"https://cognitiveservices.azure.com"}. Aucune clé ni aucun jeton n'est stocké dans la base de données.
  options:
    c: { en: "HTTPEndpointHeaders stores a secret, such as an api-key header, in the credential.", fr: "HTTPEndpointHeaders stocke un secret, comme un en-tête api-key, dans les informations d'identification." }
    b: { en: "HTTPEndpointQueryString stores a key that is added to the query string of the URL.", fr: "HTTPEndpointQueryString stocke une clé ajoutée à la chaîne de requête de l'URL." }
    d: { en: "A shared access signature is a stored token, used for delegated access to services such as Azure Storage.", fr: "Une signature d'accès partagé est un jeton stocké, utilisé pour l'accès délégué à des services comme Stockage Azure." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
