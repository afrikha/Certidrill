id: dp800-2b-dab-entra-jwt
objective: "2.1.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam exposes an Azure SQL database through Data API builder (DAB). Client applications obtain access tokens from Microsoft Entra ID for an app registration that has the following settings:

    - Directory (tenant) ID: `aaaabbbb-0000-cccc-1111-dddd2222eeee`
    - Application ID URI: `api://orders-api`
    - `accessTokenAcceptedVersion` in the manifest: `2`

    You need to configure DAB to validate these tokens. Requests that present a token issued for another application must be rejected.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam expose une base de données Azure SQL avec Data API builder (DAB). Les applications clientes obtiennent des jetons d'accès auprès de Microsoft Entra ID pour une inscription d'application qui présente les paramètres suivants :

    - ID de l'annuaire (locataire) : `aaaabbbb-0000-cccc-1111-dddd2222eeee`
    - URI d'ID d'application : `api://orders-api`
    - `accessTokenAcceptedVersion` dans le manifeste : `2`

    Vous devez configurer DAB pour qu'il valide ces jetons. Les requêtes qui présentent un jeton émis pour une autre application doivent être rejetées.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "runtime": {
        "host": {
          "mode": "production",
          "authentication": {
            "provider": [[prov]],
            "jwt": {
              "audience": [[aud]],
              "issuer": [[iss]]
            }
          }
        }
      }
    }
  slots:
    - id: prov
      options:
        - { id: entra, text: '"EntraId"' }
        - { id: appsvc, text: '"AppService"' }
        - { id: sim, text: '"Simulator"' }
        - { id: unauth, text: '"Unauthenticated"' }
    - id: aud
      options:
        - { id: tenant, text: '"aaaabbbb-0000-cccc-1111-dddd2222eeee"' }
        - { id: uri, text: '"api://orders-api"' }
        - { id: graph, text: '"https://graph.microsoft.com"' }
        - { id: login, text: '"https://login.microsoftonline.com/aaaabbbb-0000-cccc-1111-dddd2222eeee/v2.0"' }
    - id: iss
      options:
        - { id: sts, text: '"https://sts.windows.net/aaaabbbb-0000-cccc-1111-dddd2222eeee/"' }
        - { id: api, text: '"api://orders-api"' }
        - { id: v2, text: '"https://login.microsoftonline.com/aaaabbbb-0000-cccc-1111-dddd2222eeee/v2.0"' }
        - { id: common, text: '"https://login.microsoftonline.com/common/oauth2/v2.0/token"' }
answer:
  values: { prov: entra, aud: uri, iss: v2 }
explanation:
  correct:
    en: |
      The EntraId provider validates JWTs issued by Microsoft Entra ID. The audience must match the token's aud claim, which is the Application ID URI of the API, so tokens issued for another application fail validation. Because the manifest accepts v2 tokens, the issuer is https://login.microsoftonline.com/<tenant-id>/v2.0.
    fr: |
      Le fournisseur EntraId valide les JWT émis par Microsoft Entra ID. L'audience doit correspondre à la revendication aud du jeton, c'est-à-dire l'URI d'ID d'application de l'API : les jetons émis pour une autre application échouent donc à la validation. Comme le manifeste accepte les jetons v2, l'émetteur est https://login.microsoftonline.com/<id-locataire>/v2.0.
  options:
    appsvc: { en: "AppService reads identity headers injected by App Service authentication; it doesn't validate the bearer token against an audience.", fr: "AppService lit les en-têtes d'identité injectés par l'authentification App Service ; il ne valide pas le jeton du porteur par rapport à une audience." }
    sim: { en: "Simulator is for local development only and fails to start in production mode.", fr: "Simulator est réservé au développement local et ne démarre pas en mode production." }
    unauth: { en: "Unauthenticated runs every request as anonymous and validates no token.", fr: "Unauthenticated exécute chaque requête comme anonymous et ne valide aucun jeton." }
    tenant: { en: "The tenant ID identifies the directory; it is part of the issuer, not the audience.", fr: "L'ID de locataire identifie l'annuaire ; il fait partie de l'émetteur, pas de l'audience." }
    sts: { en: "sts.windows.net is the issuer of v1 tokens; with accessTokenAcceptedVersion 2 every request would fail with 401.", fr: "sts.windows.net est l'émetteur des jetons v1 ; avec accessTokenAcceptedVersion 2, chaque requête échouerait avec 401." }
    common: { en: "This is the token endpoint used by clients, not the issuer value written in the token.", fr: "Il s'agit du point de terminaison de jeton utilisé par les clients, pas de la valeur d'émetteur inscrite dans le jeton." }
references:
  - title: Configure Microsoft Entra ID authentication
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/security/how-to-authenticate-entra
