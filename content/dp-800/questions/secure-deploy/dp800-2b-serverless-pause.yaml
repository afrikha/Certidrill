id: dp800-2b-serverless-pause
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a 150 GB development database in Azure SQL Database. Developers use it about three hours per day at unpredictable times, and no one uses it on weekends.

    You need to recommend a configuration that meets the following requirements:

    - Compute charges must stop after 30 minutes without activity.
    - The database must resume automatically when a developer connects.
    - Compute costs must be minimized.

    What should you recommend?
  fr: |
    Litware dispose d'une base de données de développement de 150 Go dans Azure SQL Database. Les développeurs l'utilisent environ trois heures par jour à des moments imprévisibles, et personne ne l'utilise le week-end.

    Vous devez recommander une configuration qui satisfait les exigences suivantes :

    - La facturation du calcul doit s'arrêter après 30 minutes d'inactivité.
    - La base de données doit reprendre automatiquement lorsqu'un développeur se connecte.
    - Les coûts de calcul doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: |
          Hyperscale, serverless compute tier, auto-pause delay of 30 minutes
        fr: |
          Hyperscale, niveau de calcul serverless, délai de mise en pause automatique de 30 minutes
    - id: b
      text:
        en: |
          General Purpose, provisioned compute tier, 2 vCores
        fr: |
          General Purpose, niveau de calcul provisionné, 2 vCores
    - id: c
      text:
        en: |
          Business Critical, provisioned compute tier, 2 vCores
        fr: |
          Business Critical, niveau de calcul provisionné, 2 vCores
    - id: d
      text:
        en: |
          General Purpose, serverless compute tier, auto-pause delay of 30 minutes
        fr: |
          General Purpose, niveau de calcul serverless, délai de mise en pause automatique de 30 minutes
answer: { optionId: d }
explanation:
  correct:
    en: |
      Serverless suits intermittent, unpredictable usage and is billed per second. In General Purpose, the auto-pause delay can be set from 15 minutes to 7 days, so 30 minutes is valid; while paused only storage is billed, and the database resumes on the next connection.
    fr: |
      Le niveau serverless convient à un usage intermittent et imprévisible et est facturé à la seconde. En General Purpose, le délai de mise en pause automatique peut aller de 15 minutes à 7 jours : 30 minutes est donc valide ; pendant la pause, seul le stockage est facturé, et la base reprend à la connexion suivante.
  options:
    a:
      en: |
        In Hyperscale serverless, the minimum auto-pause delay is 60 minutes, so a 30-minute delay can't be configured.
      fr: |
        En Hyperscale serverless, le délai minimal de mise en pause automatique est de 60 minutes : un délai de 30 minutes ne peut pas être configuré.
    b:
      en: |
        Provisioned compute is billed per hour whether or not the database is used; it never pauses.
      fr: |
        Le calcul provisionné est facturé à l'heure, que la base soit utilisée ou non ; il ne se met jamais en pause.
    c:
      en: |
        Business Critical doesn't support serverless and costs more than General Purpose for the same vCores.
      fr: |
        Business Critical ne prend pas en charge le niveau serverless et coûte plus cher que General Purpose pour le même nombre de vCores.
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
