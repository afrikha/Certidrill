id: dp800-2a-auth-shared-identity
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database named **CatalogDb**. Two applications need the same permissions in CatalogDb: a container app named **ca-catalog** and a function app named **func-catalog-sync**.

    The solution must meet the following requirements:

    - No password, key or client secret must be stored.
    - A single database user must hold the permissions of both applications.
    - Administrative effort must be minimized.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **CatalogDb**. Deux applications ont besoin des mêmes autorisations dans CatalogDb : une application conteneur nommée **ca-catalog** et une application de fonction nommée **func-catalog-sync**.

    La solution doit satisfaire les exigences suivantes :

    - Aucun mot de passe, aucune clé ni aucun secret client ne doit être stocké.
    - Un seul utilisateur de base de données doit détenir les autorisations des deux applications.
    - L'effort d'administration doit être réduit au minimum.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable a system-assigned managed identity on each application.", fr: "Activer une identité managée affectée par le système sur chaque application." } }
    - { id: b, text: { en: "Assign the SQL DB Contributor role on CatalogDb to the identity of the applications.", fr: "Attribuer le rôle SQL DB Contributor sur CatalogDb à l'identité des applications." } }
    - { id: c, text: { en: "Create a user-assigned managed identity and assign it to both applications.", fr: "Créer une identité managée affectée par l'utilisateur et l'attribuer aux deux applications." } }
    - { id: d, text: { en: "Register an application in Microsoft Entra ID and store its client secret in Azure Key Vault.", fr: "Inscrire une application dans Microsoft Entra ID et stocker son secret client dans Azure Key Vault." } }
    - { id: e, text: { en: "In CatalogDb, create a user for the user-assigned managed identity FROM EXTERNAL PROVIDER and grant it the required roles.", fr: "Dans CatalogDb, créer un utilisateur pour l'identité managée affectée par l'utilisateur FROM EXTERNAL PROVIDER et lui accorder les rôles requis." } }
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: |
      A user-assigned managed identity is a standalone Azure resource that can be assigned to several applications, so both apps authenticate as the same principal without any secret. You then create one contained database user for that identity and grant it the roles once.
    fr: |
      Une identité managée affectée par l'utilisateur est une ressource Azure autonome qui peut être attribuée à plusieurs applications : les deux applications s'authentifient donc comme le même principal, sans aucun secret. Vous créez ensuite un seul utilisateur de base de données contenu pour cette identité et lui accordez les rôles une seule fois.
  options:
    a: { en: "Each system-assigned identity is a separate principal, which requires two database users.", fr: "Chaque identité affectée par le système est un principal distinct, ce qui exige deux utilisateurs de base de données." }
    b: { en: "An Azure role on the database resource gives no access to the data.", fr: "Un rôle Azure sur la ressource de base de données ne donne aucun accès aux données." }
    d: { en: "A client secret is a stored secret that must be rotated, even when kept in Key Vault.", fr: "Un secret client est un secret stocké qu'il faut renouveler, même lorsqu'il est conservé dans Key Vault." }
references:
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
  - title: Configure and manage Microsoft Entra authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
