id: dp800-2a-model-setup-order
objective: "2.1.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database named **RetailDb**. The system-assigned managed identity of the logical server has the Cognitive Services OpenAI User role on the Azure OpenAI resource **aoai-retail**, which hosts a deployment named **text-embedding-3-small**.

    Members of the database role **SearchApp** must generate embeddings with `AI_GENERATE_EMBEDDINGS` and that deployment. The call must authenticate with the managed identity of the server.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **RetailDb**. L'identité managée affectée par le système du serveur logique dispose du rôle Cognitive Services OpenAI User sur la ressource Azure OpenAI **aoai-retail**, qui héberge un déploiement nommé **text-embedding-3-small**.

    Les membres du rôle de base de données **SearchApp** doivent générer des embeddings avec `AI_GENERATE_EMBEDDINGS` et ce déploiement. L'appel doit s'authentifier avec l'identité managée du serveur.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: cred, text: { en: "Create a database scoped credential named after the endpoint URL with IDENTITY = 'Managed Identity'.", fr: "Créer des informations d'identification délimitées à la base de données nommées d'après l'URL du point de terminaison avec IDENTITY = 'Managed Identity'." } }
    - { id: model, text: { en: "Create an external model that references the deployment URL and the credential.", fr: "Créer un modèle externe qui référence l'URL du déploiement et les informations d'identification." } }
    - { id: grant, text: { en: "Grant EXECUTE on the external model to SearchApp.", fr: "Accorder EXECUTE sur le modèle externe à SearchApp." } }
    - { id: rest, text: { en: "Run sp_configure 'external rest endpoint enabled', 1.", fr: "Exécuter sp_configure 'external rest endpoint enabled', 1." } }
    - { id: scoped, text: { en: "Run sp_configure 'allow server scoped db credentials', 1.", fr: "Exécuter sp_configure 'allow server scoped db credentials', 1." } }
    - { id: users, text: { en: "Assign the Cognitive Services OpenAI User role on aoai-retail to the members of SearchApp.", fr: "Attribuer le rôle Cognitive Services OpenAI User sur aoai-retail aux membres de SearchApp." } }
answer:
  sequence: [cred, model, grant]
explanation:
  correct:
    en: |
      The external model points to the deployment and names the database scoped credential to use, so the credential is created first, then the model. A principal can use the model in AI_GENERATE_EMBEDDINGS only after it receives EXECUTE on that model. In Azure SQL Database, the database master key that protects the credential is created automatically.
    fr: |
      Le modèle externe pointe vers le déploiement et désigne les informations d'identification délimitées à la base de données à utiliser : les informations d'identification sont donc créées d'abord, puis le modèle. Un principal ne peut utiliser le modèle dans AI_GENERATE_EMBEDDINGS qu'après avoir reçu EXECUTE sur ce modèle. Dans Azure SQL Database, la clé principale de base de données qui protège les informations d'identification est créée automatiquement.
  options:
    rest: { en: "External REST calls are enabled by default in Azure SQL Database; this option is needed on SQL Server 2025 and Azure SQL Managed Instance.", fr: "Les appels REST externes sont activés par défaut dans Azure SQL Database ; cette option est nécessaire sur SQL Server 2025 et Azure SQL Managed Instance." }
    scoped: { en: "This option is required on SQL Server 2025 to use the managed identity of the Azure Arc host, not in Azure SQL Database.", fr: "Cette option est exigée sur SQL Server 2025 pour utiliser l'identité managée de l'hôte Azure Arc, pas dans Azure SQL Database." }
    users: { en: "The request is sent with the managed identity of the server, so the users need no Azure role on aoai-retail.", fr: "La requête est envoyée avec l'identité managée du serveur : les utilisateurs n'ont besoin d'aucun rôle Azure sur aoai-retail." }
references:
  - title: CREATE EXTERNAL MODEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql
  - title: CREATE DATABASE SCOPED CREDENTIAL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-database-scoped-credential-transact-sql
