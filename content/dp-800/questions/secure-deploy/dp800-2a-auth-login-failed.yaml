id: dp800-2a-auth-login-failed
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An App Service app named **app-claims** has a system-assigned managed identity. The logical server **sql-contoso** has a Microsoft Entra admin. The app connects to the Azure SQL Database **ClaimsDb** with a connection string that contains `Authentication=Active Directory Managed Identity`.

    The app fails with the error "Login failed for user '<token-identified principal>'".

    The app must read and write the data in ClaimsDb. The solution must follow the principle of least privilege. What should you do?
  fr: |
    Une application App Service nommée **app-claims** dispose d'une identité managée affectée par le système. Le serveur logique **sql-contoso** a un administrateur Microsoft Entra. L'application se connecte à la base de données Azure SQL Database **ClaimsDb** avec une chaîne de connexion qui contient `Authentication=Active Directory Managed Identity`.

    L'application échoue avec l'erreur « Login failed for user '<token-identified principal>' ».

    L'application doit lire et écrire les données de ClaimsDb. La solution doit respecter le principe du moindre privilège. Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the SQL DB Contributor role on ClaimsDb to the managed identity of app-claims.", fr: "Attribuer le rôle SQL DB Contributor sur ClaimsDb à l'identité managée d'app-claims." }
    - id: b
      text: { en: "In ClaimsDb, create a user for app-claims FROM EXTERNAL PROVIDER and add it to db_datareader and db_datawriter.", fr: "Dans ClaimsDb, créer un utilisateur pour app-claims FROM EXTERNAL PROVIDER et l'ajouter à db_datareader et db_datawriter." }
    - id: c
      text: { en: "Set the managed identity of app-claims as the Microsoft Entra admin of sql-contoso.", fr: "Définir l'identité managée d'app-claims comme administrateur Microsoft Entra de sql-contoso." }
    - id: d
      text: { en: "Add a server-level firewall rule that allows the outbound IP addresses of app-claims.", fr: "Ajouter une règle de pare-feu au niveau du serveur qui autorise les adresses IP sortantes d'app-claims." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The token is valid, but the managed identity has no database user, so the sign-in is refused. A Microsoft Entra principal with ALTER ANY USER creates a contained user with CREATE USER [app-claims] FROM EXTERNAL PROVIDER, and the db_datareader and db_datawriter roles give read and write access without administrative rights.
    fr: |
      Le jeton est valide, mais l'identité managée n'a pas d'utilisateur de base de données : la connexion est refusée. Un principal Microsoft Entra qui dispose d'ALTER ANY USER crée un utilisateur contenu avec CREATE USER [app-claims] FROM EXTERNAL PROVIDER, et les rôles db_datareader et db_datawriter donnent l'accès en lecture et en écriture sans droits d'administration.
  options:
    a: { en: "SQL DB Contributor manages the database resource in Azure; it grants no access to the data.", fr: "SQL DB Contributor gère la ressource de base de données dans Azure ; il n'accorde aucun accès aux données." }
    c: { en: "The Microsoft Entra admin has full administrative rights on every database of the server, far more than required.", fr: "L'administrateur Microsoft Entra dispose de tous les droits d'administration sur toutes les bases du serveur, bien plus que nécessaire." }
    d: { en: "A blocked client IP address returns a firewall error, not a login failure for a token-identified principal.", fr: "Une adresse IP cliente bloquée renvoie une erreur de pare-feu, pas un échec de connexion pour un principal identifié par jeton." }
references:
  - title: Configure and manage Microsoft Entra authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
  - title: "Tutorial: Connect to Azure databases from App Service without secrets using a managed identity"
    url: https://learn.microsoft.com/en-us/azure/app-service/tutorial-connect-msi-azure-database
