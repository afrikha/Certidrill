id: dp800-2b-defaults-yesno
objective: "2.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum creates a new logical server and a new database in Azure SQL Database today. The company also has an older database, DB-Legacy, that was created at compatibility level 150 and has never been changed.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum crée aujourd'hui un nouveau serveur logique et une nouvelle base de données dans Azure SQL Database. L'entreprise possède aussi une base plus ancienne, DB-Legacy, créée au niveau de compatibilité 150 et jamais modifiée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The new database uses compatibility level 170.
        fr: |
          La nouvelle base de données utilise le niveau de compatibilité 170.
    - id: s2
      text:
        en: |
          Microsoft raises the compatibility level of DB-Legacy to the latest level during a maintenance window.
        fr: |
          Microsoft relève le niveau de compatibilité de DB-Legacy au dernier niveau pendant une fenêtre de maintenance.
    - id: s3
      text:
        en: |
          The FORCE_LAST_GOOD_PLAN automatic tuning option is enabled on the new server.
        fr: |
          L'option de réglage automatique FORCE_LAST_GOOD_PLAN est activée sur le nouveau serveur.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      New databases in Azure SQL Database default to compatibility level 170. Microsoft doesn't update the compatibility level of existing databases; upgrading is your decision, ideally after a Query Store baseline. New servers inherit the Azure defaults for automatic tuning, FORCE_LAST_GOOD_PLAN enabled and CREATE_INDEX and DROP_INDEX disabled.
    fr: |
      Les nouvelles bases dans Azure SQL Database utilisent par défaut le niveau de compatibilité 170. Microsoft ne met pas à jour le niveau de compatibilité des bases existantes ; la mise à niveau est votre décision, idéalement après une ligne de base du Magasin des requêtes. Les nouveaux serveurs héritent des valeurs Azure par défaut du réglage automatique : FORCE_LAST_GOOD_PLAN activé, CREATE_INDEX et DROP_INDEX désactivés.
references:
  - title: ALTER DATABASE compatibility level (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-transact-sql-compatibility-level
  - title: Automatic database tuning
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automatic-tuning-overview
