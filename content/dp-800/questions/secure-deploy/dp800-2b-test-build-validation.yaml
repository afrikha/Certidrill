id: dp800-2b-test-build-validation
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores the schema of its sales database in an SDK-style SQL database project in GitHub. Last week, a pull request dropped a column that a view still referenced, and the problem was found only after deployment.

    You need to detect this kind of error in every pull request before it is merged. The check must not require a database.

    What should you add to the pull request workflow?
  fr: |
    Contoso stocke le schéma de sa base de ventes dans un projet de base de données SQL de style SDK sur GitHub. La semaine dernière, une pull request a supprimé une colonne qu'une vue référençait encore, et le problème n'a été découvert qu'après le déploiement.

    Vous devez détecter ce type d'erreur dans chaque pull request avant sa fusion. La vérification ne doit pas nécessiter de base de données.

    Que devez-vous ajouter au workflow de pull request ?
body:
  options:
    - id: a
      text:
        en: |
          An integration test suite that runs against a staging database
        fr: |
          Une suite de tests d'intégration exécutée sur une base de préproduction
    - id: b
      text:
        en: |
          A step that runs dotnet build on the SQL project as a required check
        fr: |
          Une étape qui exécute dotnet build sur le projet SQL comme vérification obligatoire
    - id: c
      text:
        en: |
          A SqlPackage DriftReport action against the production database
        fr: |
          Une action SqlPackage DriftReport sur la base de production
    - id: d
      text:
        en: |
          A unit test that checks the row count returned by the view
        fr: |
          Un test unitaire qui vérifie le nombre de lignes renvoyées par la vue
answer: { optionId: b }
explanation:
  correct:
    en: |
      Building the project validates the model; a view that references a dropped column is a build error. Build validation runs in the pull request without any database, catching syntax errors and broken object references before merge, although it only proves that the schema is structurally valid.
    fr: |
      La génération du projet valide le modèle ; une vue qui référence une colonne supprimée provoque une erreur de build. La validation de build s'exécute dans la pull request sans aucune base de données et détecte les erreurs de syntaxe et les références d'objets rompues avant la fusion, même si elle prouve seulement que le schéma est structurellement valide.
  options:
    a:
      en: |
        Integration tests need a deployed database and run later; they are the slowest level.
      fr: |
        Les tests d'intégration exigent une base déployée et s'exécutent plus tard ; ce sont les plus lents.
    c:
      en: |
        A drift report compares a registered database with its last registered state; it doesn't validate the project.
      fr: |
        Un rapport de dérive compare une base inscrite à son dernier état inscrit ; il ne valide pas le projet.
    d:
      en: |
        A unit test needs a deployed test database, and the broken reference already fails the build.
      fr: |
        Un test unitaire exige une base de test déployée, et la référence rompue fait déjà échouer le build.
references:
  - title: Design and implement a testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/07-design-implement-testing-strategy
