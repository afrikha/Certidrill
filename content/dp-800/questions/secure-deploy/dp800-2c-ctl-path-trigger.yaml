id: dp800-2c-ctl-path-trigger
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores an application and an SDK-style SQL database project in the same Azure Repos Git repository. The database project is in the **Database** folder. The YAML pipeline **db-release** builds the project and deploys it.

    You need db-release to start automatically after every change merged into **main** that modifies a file in the Database folder, and not for other changes.

    Which trigger should you add to the YAML file of db-release?
  fr: |
    Contoso stocke une application et un projet de base de données SQL de style SDK dans le même dépôt Git Azure Repos. Le projet de base de données se trouve dans le dossier **Database**. Le pipeline YAML **db-release** génère le projet et le déploie.

    Vous devez faire en sorte que db-release démarre automatiquement après chaque modification fusionnée dans **main** qui change un fichier du dossier Database, et pas pour les autres modifications.

    Quel déclencheur devez-vous ajouter au fichier YAML de db-release ?
body:
  options:
    - { id: a, text: "`trigger: { branches: { include: [ main ] }, paths: { include: [ Database ] } }`" }
    - { id: b, text: "`pr: { branches: { include: [ main ] }, paths: { include: [ Database ] } }`" }
    - { id: c, text: "`trigger: { branches: { include: [ main ] }, batch: true }`" }
    - { id: d, text: "`trigger: { branches: { exclude: [ main ] }, paths: { include: [ Database ] } }`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A CI trigger runs the pipeline when commits are pushed to the included branches, and completing a pull request pushes the merge commit to main. The paths filter, relative to the repository root, limits the runs to changes under Database.
    fr: |
      Un déclencheur CI exécute le pipeline lorsque des validations sont poussées vers les branches incluses, et terminer une pull request pousse la validation de fusion vers main. Le filtre paths, relatif à la racine du dépôt, limite les exécutions aux modifications sous Database.
  options:
    b:
      en: |
        For Azure Repos Git, pull request triggers are not configured in YAML, and a pull request build runs before the merge, not after it.
      fr: |
        Pour Azure Repos Git, les déclencheurs de pull request ne se configurent pas en YAML, et un build de pull request s'exécute avant la fusion, pas après.
    c:
      en: |
        Without a paths filter, the pipeline also runs for changes outside the Database folder; batch only groups pushes made during a run.
      fr: |
        Sans filtre paths, le pipeline s'exécute aussi pour les modifications hors du dossier Database ; batch regroupe seulement les push effectués pendant une exécution.
    d:
      en: |
        Excluding main runs the pipeline for every other branch, which is the opposite of the requirement.
      fr: |
        Exclure main exécute le pipeline pour toutes les autres branches, soit l'inverse de l'exigence.
references:
  - title: Build Azure Repos Git or TFS Git repositories
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
