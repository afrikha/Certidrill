id: dp800-2a-perm-deny-user
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database. A database user named **Bob** is a member of the role **Analysts**. The following permissions exist, and no other permission applies to Bob:

    ```text
    GRANT SELECT ON SCHEMA::Sales TO Analysts;
    GRANT SELECT ON Sales.Orders TO Bob;
    ```

    You need to prevent Bob from reading Sales.Orders. The other members of Analysts must keep their current access.

    Which two statements should you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database. Un utilisateur de base de données nommé **Bob** est membre du rôle **Analysts**. Les autorisations suivantes existent, et aucune autre autorisation ne s'applique à Bob :

    ```text
    GRANT SELECT ON SCHEMA::Sales TO Analysts;
    GRANT SELECT ON Sales.Orders TO Bob;
    ```

    Vous devez empêcher Bob de lire Sales.Orders. Les autres membres d'Analysts doivent conserver leur accès actuel.

    Quelles sont les deux instructions à utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "REVOKE SELECT ON Sales.Orders FROM Bob;" }
    - { id: b, text: "DENY SELECT ON Sales.Orders TO Bob;" }
    - { id: c, text: "REVOKE SELECT ON SCHEMA::Sales FROM Analysts;" }
    - { id: d, text: "DENY SELECT ON SCHEMA::Sales TO Bob;" }
    - { id: e, text: "DENY SELECT ON Sales.Orders TO Analysts;" }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      A DENY blocks the permission even when it is granted directly or through a role membership. Denying SELECT on Sales.Orders, or on the whole Sales schema, to Bob overrides both grants for Bob only, and the other Analysts members keep the schema-level grant.
    fr: |
      Un DENY bloque l'autorisation même lorsqu'elle est accordée directement ou via l'appartenance à un rôle. Refuser SELECT sur Sales.Orders, ou sur tout le schéma Sales, à Bob l'emporte sur les deux autorisations pour Bob uniquement, et les autres membres d'Analysts conservent l'autorisation au niveau du schéma.
  options:
    a: { en: "REVOKE removes only the direct grant; Bob still reads the table through the schema-level grant of Analysts.", fr: "REVOKE ne retire que l'autorisation directe ; Bob lit toujours la table grâce à l'autorisation d'Analysts au niveau du schéma." }
    c: { en: "This removes access for every member of Analysts, and Bob keeps his direct grant.", fr: "Cette instruction retire l'accès à tous les membres d'Analysts, et Bob conserve son autorisation directe." }
    e: { en: "This blocks Sales.Orders for every member of Analysts, not only Bob.", fr: "Cette instruction bloque Sales.Orders pour tous les membres d'Analysts, pas seulement pour Bob." }
references:
  - title: Describe database and object permissions
    url: https://learn.microsoft.com/en-us/training/modules/configure-database-authentication-authorization/5-describe-database-object-permissions
  - title: DENY Object Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-object-permissions-transact-sql
