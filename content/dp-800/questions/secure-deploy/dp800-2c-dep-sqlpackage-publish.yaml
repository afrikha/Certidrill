id: dp800-2c-dep-sqlpackage-publish
objective: "2.3.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind deploys the file **InventoryDb.dacpac** to production from a pipeline script. The project declares the SQLCMD variable **Environment**, which the post-deployment script uses to choose the reference data to load.

    The deployment must meet the following requirements:

    - It applies the schema changes to the production database.
    - It never drops production objects that are not in the project.
    - It stops if a change could cause data loss.
    - The post-deployment script runs with Environment set to prod.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind déploie le fichier **InventoryDb.dacpac** en production à partir d'un script de pipeline. Le projet déclare la variable SQLCMD **Environment**, que le script de post-déploiement utilise pour choisir les données de référence à charger.

    Le déploiement doit respecter les exigences suivantes :

    - Il applique les modifications de schéma à la base de données de production.
    - Il ne supprime jamais les objets de production absents du projet.
    - Il s'arrête si une modification risque de provoquer une perte de données.
    - Le script de post-déploiement s'exécute avec Environment défini sur prod.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    sqlpackage /Action:[[action]] \
      /SourceFile:./out/InventoryDb.dacpac \
      /TargetConnectionString:"$PROD_CONN" \
      /p:[[prop]]=false \
      /v:[[var]]
  slots:
    - id: action
      options:
        - { id: publish, text: "Publish" }
        - { id: script, text: "Script" }
        - { id: deployreport, text: "DeployReport" }
        - { id: import, text: "Import" }
    - id: prop
      options:
        - { id: drop, text: "DropObjectsNotInSource" }
        - { id: block, text: "BlockOnPossibleDataLoss" }
        - { id: verify, text: "VerifyDeployment" }
        - { id: scriptdb, text: "ScriptDatabaseOptions" }
    - id: var
      options:
        - { id: ok, text: "Environment=prod" }
        - { id: macro, text: "$(Environment)=prod" }
        - { id: colon, text: "Environment:prod" }
        - { id: generic, text: "SqlCmdVar__1=prod" }
answer:
  values: { action: publish, prop: drop, var: ok }
explanation:
  correct:
    en: |
      Publish applies the changes needed to make the target match the .dacpac. Setting DropObjectsNotInSource to false explicitly keeps the objects that exist only in production, while BlockOnPossibleDataLoss keeps its default of True. The /v parameter sets a SQLCMD variable with the syntax Name=Value, and it overrides any value from a publish profile.
    fr: |
      Publish applique les modifications nécessaires pour aligner la cible sur le .dacpac. Définir explicitement DropObjectsNotInSource sur false conserve les objets présents uniquement en production, tandis que BlockOnPossibleDataLoss conserve sa valeur par défaut True. Le paramètre /v définit une variable SQLCMD avec la syntaxe Nom=Valeur, et remplace toute valeur d'un profil de publication.
  options:
    script: { en: "Script generates the T-SQL deployment script without applying it.", fr: "Script génère le script T-SQL de déploiement sans l'appliquer." }
    deployreport: { en: "DeployReport only writes an XML report of the planned changes.", fr: "DeployReport écrit seulement un rapport XML des modifications prévues." }
    import: { en: "Import creates a database from a .bacpac file; it does not deploy a .dacpac.", fr: "Import crée une base de données à partir d'un fichier .bacpac ; il ne déploie pas un .dacpac." }
    block: { en: "Setting BlockOnPossibleDataLoss to false lets the deployment continue when data could be lost.", fr: "Définir BlockOnPossibleDataLoss sur false laisse le déploiement continuer quand des données risquent d'être perdues." }
    verify: { en: "Setting VerifyDeployment to false skips the checks that stop a publish likely to fail.", fr: "Définir VerifyDeployment sur false ignore les vérifications qui arrêtent une publication susceptible d'échouer." }
    scriptdb: { en: "ScriptDatabaseOptions controls whether database properties are updated, not whether objects are dropped.", fr: "ScriptDatabaseOptions détermine si les propriétés de la base de données sont mises à jour, pas si des objets sont supprimés." }
    macro: { en: "$(Environment) is how scripts reference the variable; /v takes the variable name.", fr: "$(Environment) est la façon dont les scripts référencent la variable ; /v prend le nom de la variable." }
    colon: { en: "The /v parameter uses an equals sign between the name and the value.", fr: "Le paramètre /v utilise un signe égal entre le nom et la valeur." }
    generic: { en: "SqlCmdVar__1 appears in the project file as the placeholder of the value; it is not the name of the SQLCMD variable.", fr: "SqlCmdVar__1 apparaît dans le fichier projet comme espace réservé de la valeur ; ce n'est pas le nom de la variable SQLCMD." }
references:
  - title: SqlPackage Publish
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-publish
  - title: SQLCMD variables in SQL projects
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/sqlcmd-variables
