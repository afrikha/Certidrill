id: dp800-2c-ctl-tamper-proof
objective: "2.3.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove deploys a SQL database project with an Azure Pipelines YAML pipeline. The production stage uses the environment **production** and the Azure Resource Manager service connection **sc-sql-prod**. Every developer can push to feature branches and edit **azure-pipelines.yml** in those branches.

    You need controls that a developer can't remove or bypass by editing azure-pipelines.yml in a feature branch:

    - A DBA approves every production deployment.
    - Only runs of the main branch can use sc-sql-prod.

    Which two controls should you implement? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove déploie un projet de base de données SQL avec un pipeline YAML Azure Pipelines. La phase de production utilise l'environnement **production** et la connexion de service Azure Resource Manager **sc-sql-prod**. Chaque développeur peut pousser vers des branches de fonctionnalité et modifier **azure-pipelines.yml** dans ces branches.

    Vous avez besoin de contrôles qu'un développeur ne peut ni supprimer ni contourner en modifiant azure-pipelines.yml dans une branche de fonctionnalité :

    - Un DBA approuve chaque déploiement en production.
    - Seules les exécutions de la branche main peuvent utiliser sc-sql-prod.

    Quels sont les deux contrôles à mettre en place ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An Approvals check with the DBA group on the production environment", fr: "Une vérification Approvals avec le groupe DBA sur l'environnement production" } }
    - { id: b, text: { en: "A Branch control check that allows refs/heads/main on sc-sql-prod", fr: "Une vérification Branch control qui autorise refs/heads/main sur sc-sql-prod" } }
    - { id: c, text: { en: "A ManualValidation@0 task assigned to the DBA group in the production stage", fr: "Une tâche ManualValidation@0 attribuée au groupe DBA dans la phase de production" } }
    - { id: d, text: { en: "A stage condition that requires Build.SourceBranch to equal refs/heads/main", fr: "Une condition de phase qui exige que Build.SourceBranch soit égal à refs/heads/main" } }
    - { id: e, text: { en: "A CI trigger that includes only the main branch", fr: "Un déclencheur CI qui inclut uniquement la branche main" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Checks are defined on resources such as environments and service connections, outside the YAML file, and only resource administrators manage them. The pipeline pauses before a stage until all the checks of the resources that it uses pass, so an Approvals check on production and a Branch control check on sc-sql-prod apply whatever the YAML of the branch contains.
    fr: |
      Les vérifications sont définies sur des ressources comme les environnements et les connexions de service, en dehors du fichier YAML, et seuls les administrateurs des ressources les gèrent. Le pipeline se met en pause avant une phase jusqu'à la réussite de toutes les vérifications des ressources qu'elle utilise : une vérification Approvals sur production et une vérification Branch control sur sc-sql-prod s'appliquent quel que soit le YAML de la branche.
  options:
    c:
      en: |
        The task is part of the YAML, so a developer can delete it in a feature branch.
      fr: |
        La tâche fait partie du YAML : un développeur peut la supprimer dans une branche de fonctionnalité.
    d:
      en: |
        A condition is written in the YAML file, so anyone who edits the file can change or remove it.
      fr: |
        Une condition est écrite dans le fichier YAML : quiconque modifie le fichier peut la changer ou la supprimer.
    e:
      en: |
        Triggers only decide when runs start automatically; a developer can edit them or start a run manually from another branch.
      fr: |
        Les déclencheurs décident seulement quand les exécutions démarrent automatiquement ; un développeur peut les modifier ou lancer manuellement une exécution depuis une autre branche.
references:
  - title: Define approvals and checks
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
