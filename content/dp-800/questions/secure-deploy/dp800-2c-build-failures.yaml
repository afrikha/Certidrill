id: dp800-2c-build-failures
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an SDK-style SQL database project named **HRDb**. The project file contains the following properties:

    ```text
    <RunSqlCodeAnalysis>True</RunSqlCodeAnalysis>
    <SqlCodeAnalysisRules>+!Microsoft.Rules.Data.SR0001</SqlCodeAnalysisRules>
    ```

    Developers propose several changes in separate branches. Each branch runs `dotnet build` on the project.

    Which two changes cause the build to fail?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un projet de base de données SQL de style SDK nommé **HRDb**. Le fichier projet contient les propriétés suivantes :

    ```text
    <RunSqlCodeAnalysis>True</RunSqlCodeAnalysis>
    <SqlCodeAnalysisRules>+!Microsoft.Rules.Data.SR0001</SqlCodeAnalysisRules>
    ```

    Des développeurs proposent plusieurs modifications dans des branches distinctes. Chaque branche exécute `dotnet build` sur le projet.

    Quelles sont les deux modifications qui font échouer la génération ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A new view selects a column named TerminationDate that no table of the project defines.", fr: "Une nouvelle vue sélectionne une colonne nommée TerminationDate qu'aucune table du projet ne définit." } }
    - { id: b, text: { en: "A new view uses SELECT * to return all the columns of the Employee table.", fr: "Une nouvelle vue utilise SELECT * pour renvoyer toutes les colonnes de la table Employee." } }
    - { id: c, text: { en: "A new procedure refers to the Employee table as dbo.EMPLOYEE.", fr: "Une nouvelle procédure fait référence à la table Employee sous la forme dbo.EMPLOYEE." } }
    - { id: d, text: { en: "A new procedure uses @@IDENTITY to read the key of an inserted row.", fr: "Une nouvelle procédure utilise @@IDENTITY pour lire la clé d'une ligne insérée." } }
    - { id: e, text: { en: "The post-deployment script inserts rows into a table that the project does not define.", fr: "Le script de post-déploiement insère des lignes dans une table que le projet ne définit pas." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The build validates the object model, so a view that references a column that does not exist in the project is a build error. Code analysis reports every rule as a warning by default, but the `+!` prefix makes SR0001 (avoid SELECT * in views, procedures and table-valued functions) a build error.
    fr: |
      La génération valide le modèle d'objets : une vue qui référence une colonne absente du projet provoque une erreur de génération. L'analyse du code signale chaque règle comme un avertissement par défaut, mais le préfixe `+!` fait de SR0001 (éviter SELECT * dans les vues, procédures et fonctions table) une erreur de génération.
  options:
    c:
      en: |
        Inconsistent casing of object names produces a build warning, and warnings do not fail the build.
      fr: |
        Une casse incohérente des noms d'objets produit un avertissement de génération, et les avertissements ne font pas échouer la génération.
    d:
      en: '@@IDENTITY triggers rule SR0008, which stays a warning because only SR0001 is configured as an error.'
      fr: '@@IDENTITY déclenche la règle SR0008, qui reste un avertissement, car seule SR0001 est configurée comme erreur.'
    e:
      en: |
        Pre- and post-deployment scripts are packaged in the .dacpac but are not validated against the object model.
      fr: |
        Les scripts de prédéploiement et de post-déploiement sont inclus dans le .dacpac, mais ne sont pas validés par rapport au modèle d'objets.
references:
  - title: SQL code analysis
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/sql-code-analysis/sql-code-analysis
  - title: Pre-deployment and post-deployment scripts overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts
