id: dp800-2d-aca-deploy-order
objective: "2.4.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam wants to host Data API builder (DAB) in Azure Container Apps for an Azure SQL database. The configuration file must be part of the container image, and the connection string must be supplied by the container app. An Azure container registry named crfabrikam already exists.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam veut héberger Data API builder (DAB) dans Azure Container Apps pour une base de données Azure SQL. Le fichier de configuration doit faire partie de l'image conteneur, et la chaîne de connexion doit être fournie par l'application conteneur. Un registre de conteneurs Azure nommé crfabrikam existe déjà.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: config, text: { en: "Run dab init and dab add to create dab-config.json, with the connection string set to @env('DATABASE_CONNECTION_STRING').", fr: "Exécuter dab init et dab add pour créer dab-config.json, avec la chaîne de connexion définie sur @env('DATABASE_CONNECTION_STRING')." } }
    - { id: dockerfile, text: { en: "Write a Dockerfile that starts from the data-api-builder image and copies dab-config.json to /App/dab-config.json.", fr: "Écrire un Dockerfile qui part de l'image data-api-builder et copie dab-config.json vers /App/dab-config.json." } }
    - { id: build, text: { en: "Run az acr build to build the image and push it to crfabrikam.", fr: "Exécuter az acr build pour générer l'image et l'envoyer vers crfabrikam." } }
    - { id: app, text: { en: "Create the container app from the crfabrikam image, with the DATABASE_CONNECTION_STRING environment variable and HTTP ingress.", fr: "Créer l'application conteneur à partir de l'image de crfabrikam, avec la variable d'environnement DATABASE_CONNECTION_STRING et une entrée HTTP." } }
    - { id: export, text: { en: "Run dab export to package dab-config.json as a container image.", fr: "Exécuter dab export pour empaqueter dab-config.json sous forme d'image conteneur." } }
    - { id: start, text: { en: "Run dab start on the build agent to publish the configuration to crfabrikam.", fr: "Exécuter dab start sur l'agent de build pour publier la configuration dans crfabrikam." } }
answer:
  sequence: [ config, dockerfile, build, app ]
explanation:
  correct:
    en: |
      The configuration file comes first, and its @env() reference keeps the connection string out of the image. A Dockerfile based on mcr.microsoft.com/azure-databases/data-api-builder copies the file to /App/dab-config.json, az acr build builds and pushes the image, and the container app is then created from that image, with the connection string as an environment variable.
    fr: |
      Le fichier de configuration vient en premier, et sa référence @env() garde la chaîne de connexion hors de l'image. Un Dockerfile basé sur mcr.microsoft.com/azure-databases/data-api-builder copie le fichier vers /App/dab-config.json, az acr build génère et envoie l'image, puis l'application conteneur est créée à partir de cette image, avec la chaîne de connexion comme variable d'environnement.
  options:
    export: { en: "dab export doesn't build container images; the image is built from a Dockerfile.", fr: "dab export ne génère pas d'images conteneur ; l'image est générée à partir d'un Dockerfile." }
    start: { en: "dab start runs the engine locally; it doesn't publish anything to a registry.", fr: "dab start exécute le moteur localement ; il ne publie rien dans un registre." }
references:
  - title: Deploy to Azure Container Apps - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/deployment/how-to-publish-container-apps
