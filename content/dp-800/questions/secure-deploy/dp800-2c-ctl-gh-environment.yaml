id: dp800-2c-ctl-gh-environment
objective: "2.3.9"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin deploys an SDK-style SQL database project to production with a GitHub Actions workflow. The deploy job references the GitHub environment **production**.

    Which setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin déploie un projet de base de données SQL de style SDK en production avec un workflow GitHub Actions. Le travail de déploiement référence l'environnement GitHub **production**.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reviewers, text: { en: "Required reviewers on the production environment", fr: "Réviseurs requis sur l'environnement production" } }
    - { id: branches, text: { en: "Deployment branches and tags rule on the production environment", fr: "Règle de branches et de tags de déploiement sur l'environnement production" } }
    - { id: envsecret, text: { en: "Environment secret of production", fr: "Secret d'environnement de production" } }
    - { id: nobypass, text: { en: "Clear Allow administrators to bypass configured protection rules", fr: "Désactiver Allow administrators to bypass configured protection rules" } }
    - { id: reposecret, text: { en: "Repository secret", fr: "Secret de dépôt" } }
    - { id: statuscheck, text: { en: "Required status check in the branch protection rule of main", fr: "Vérification d'état requise dans la règle de protection de branche de main" } }
  targets:
    - id: approve
      text: { en: "A member of the DBA team must approve each job that deploys to production.", fr: "Un membre de l'équipe DBA doit approuver chaque travail qui déploie en production." }
    - id: onlymain
      text: { en: "Only workflow runs from main can deploy to production.", fr: "Seules les exécutions de workflow issues de main peuvent déployer en production." }
    - id: secret
      text: { en: "The production connection string is available only to the deploy job, after its protection rules pass.", fr: "La chaîne de connexion de production n'est accessible qu'au travail de déploiement, après le passage de ses règles de protection." }
    - id: admins
      text: { en: "Repository administrators must go through the same approval as everyone else.", fr: "Les administrateurs du dépôt doivent passer par la même approbation que tout le monde." }
answer:
  mapping: { approve: reviewers, onlymain: branches, secret: envsecret, admins: nobypass }
explanation:
  correct:
    en: |
      Required reviewers make a job that references the environment wait for an approval. A deployment branches and tags rule restricts which branches can deploy to the environment. Environment secrets are released only to jobs that use the environment, after its rules pass. Clearing the administrator bypass option keeps administrators from skipping the protection rules. A repository secret is available to every job, and a required status check protects merges into main, not deployments.
    fr: |
      Les réviseurs requis font attendre une approbation à un travail qui référence l'environnement. Une règle de branches et de tags de déploiement limite les branches qui peuvent déployer dans l'environnement. Les secrets d'environnement ne sont fournis qu'aux travaux qui utilisent l'environnement, après le passage de ses règles. Désactiver l'option de contournement par les administrateurs les empêche d'ignorer les règles de protection. Un secret de dépôt est accessible à tous les travaux, et une vérification d'état requise protège les fusions dans main, pas les déploiements.
references:
  - title: Implement CI/CD pipelines
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/06-implement-cicd-pipelines
