id: dp800-2c-sc-files-to-commit
objective: "2.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an SDK-style SQL database project named **ClaimsDb**. After a local build, the project folder contains the following items:

    ```text
    ClaimsDb/
    ├── ClaimsDb.sqlproj
    ├── ClaimsDb.sqlproj.user
    ├── ClaimsDb.refactorlog
    ├── Tables/
    ├── Scripts/PostDeployment/PostDeploy.sql
    ├── bin/Debug/ClaimsDb.dacpac
    └── obj/
    ```

    You are adding the project to a new Git repository. Every developer and the CI pipeline must be able to rebuild and deploy the same database model from the repository.

    Which three items should you commit? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un projet de base de données SQL de style SDK nommé **ClaimsDb**. Après une génération locale, le dossier du projet contient les éléments suivants :

    ```text
    ClaimsDb/
    ├── ClaimsDb.sqlproj
    ├── ClaimsDb.sqlproj.user
    ├── ClaimsDb.refactorlog
    ├── Tables/
    ├── Scripts/PostDeployment/PostDeploy.sql
    ├── bin/Debug/ClaimsDb.dacpac
    └── obj/
    ```

    Vous ajoutez le projet à un nouveau dépôt Git. Chaque développeur et le pipeline CI doivent pouvoir regénérer et déployer le même modèle de base de données à partir du dépôt.

    Quels sont les trois éléments à valider dans le dépôt ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: "ClaimsDb.sqlproj" }
    - { id: b, text: "ClaimsDb.sqlproj.user" }
    - { id: c, text: "ClaimsDb.refactorlog" }
    - { id: d, text: "Scripts/PostDeployment/PostDeploy.sql" }
    - { id: e, text: "bin/Debug/ClaimsDb.dacpac" }
    - { id: f, text: "obj/" }
answer: { optionIds: [ a, c, d ] }
explanation:
  correct:
    en: |
      The project file, the object scripts, the pre- and post-deployment scripts and the refactor log are the source of the database model: the build packages the refactor log into the .dacpac so that renames are deployed as renames. The bin and obj folders, the .dacpac and the user-specific .user file are excluded with .gitignore.
    fr: |
      Le fichier projet, les scripts d'objets, les scripts de prédéploiement et de post-déploiement et le journal de refactorisation constituent la source du modèle de base de données : la génération inclut le journal de refactorisation dans le .dacpac pour que les renommages soient déployés comme des renommages. Les dossiers bin et obj, le .dacpac et le fichier .user propre à l'utilisateur sont exclus avec .gitignore.
  options:
    b:
      en: |
        The .user file holds one developer's local settings; it is excluded from source control.
      fr: |
        Le fichier .user contient les paramètres locaux d'un développeur ; il est exclu du contrôle de code source.
    e:
      en: |
        The .dacpac is a build output that every CI build re-creates, so it is not tracked.
      fr: |
        Le .dacpac est une sortie de génération recréée par chaque build CI ; il n'est pas suivi.
    f:
      en: |
        The obj folder contains intermediate build files that are regenerated by every build.
      fr: |
        Le dossier obj contient des fichiers intermédiaires de génération recréés à chaque génération.
references:
  - title: Configure source control and manage reference data
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/03-configure-source-control-manage-reference-data
  - title: Refactor objects in SQL database projects
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/refactor-overview
