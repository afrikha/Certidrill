id: dp800-cs3c-search-regression
objective: "2.2.3"
type: single
caseStudy: dp800-cs3c-litware-insurance
difficulty: 1
status: draft
stem:
  en: You need to restore the performance of the claims search. The solution must meet the data requirements. Which statement should you run on ClaimsProd?
  fr: Vous devez rétablir les performances de la recherche des sinistres. La solution doit satisfaire les exigences relatives aux données. Quelle instruction devez-vous exécuter sur ClaimsProd ?
body:
  options:
    - { id: a, text: "EXEC sp_query_store_force_plan @query_id = 4817, @plan_id = 389;" }
    - { id: b, text: "EXEC sp_query_store_set_hints @query_id = 4817, @query_hints = N'OPTION (RECOMPILE)';" }
    - { id: c, text: "ALTER DATABASE SCOPED CONFIGURATION CLEAR PROCEDURE_CACHE;" }
    - { id: d, text: "EXEC sp_query_store_force_plan @query_id = 4817, @plan_id = 212;" }
answer: { optionId: d }
explanation:
  correct:
    en: Query Store kept the plan that the query used before the regression. sp_query_store_force_plan makes the optimizer use plan 212 each time it compiles query 4817, without any change to the text of the query sent by the vendor application.
    fr: Le Magasin des requêtes a conservé le plan que la requête utilisait avant la régression. sp_query_store_force_plan oblige l'optimiseur à utiliser le plan 212 chaque fois qu'il compile la requête 4817, sans aucune modification du texte de la requête envoyée par l'application de l'éditeur.
  options:
    a: { en: "Plan 389 is the plan that the query has used since the regression; forcing it keeps the slow plan.", fr: "Le plan 389 est celui que la requête utilise depuis la régression ; le forcer conserve le plan lent." }
    b: { en: "A RECOMPILE hint compiles a new plan at every execution, which adds compilation cost and doesn't guarantee the earlier plan.", fr: "Un indicateur RECOMPILE compile un nouveau plan à chaque exécution, ce qui ajoute un coût de compilation et ne garantit pas le plan antérieur." }
    c: { en: "Clearing the plan cache forces new compilations, which can produce the slow plan again.", fr: "Vider le cache des plans force de nouvelles compilations, qui peuvent reproduire le plan lent." }
references:
  - title: sp_query_store_force_plan (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-query-store-force-plan-transact-sql
