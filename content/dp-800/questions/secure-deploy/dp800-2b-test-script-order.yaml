id: dp800-2b-test-script-order
objective: "2.3.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a SQL Server unit test class that defines a TestInitialize script and a TestCleanup script. A test named `OrderTotal_Test` in this class has a pre-test script, a test script and a post-test script. Automatic deployment of the database project before the tests is disabled.

    You run `OrderTotal_Test` alone.

    In which order do the scripts run? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'une classe de tests unitaires SQL Server qui définit un script TestInitialize et un script TestCleanup. Un test nommé `OrderTotal_Test` de cette classe possède un script de prétest, un script de test et un script de post-test. Le déploiement automatique du projet de base de données avant les tests est désactivé.

    Vous exécutez `OrderTotal_Test` seul.

    Dans quel ordre les scripts s'exécutent-ils ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: init, text: { en: "Run the TestInitialize script.", fr: "Exécuter le script TestInitialize." } }
    - { id: pre, text: { en: "Run the pre-test script.", fr: "Exécuter le script de prétest." } }
    - { id: test, text: { en: "Run the test script.", fr: "Exécuter le script de test." } }
    - { id: post, text: { en: "Run the post-test script.", fr: "Exécuter le script de post-test." } }
    - { id: cleanup, text: { en: "Run the TestCleanup script.", fr: "Exécuter le script TestCleanup." } }
    - { id: deploy, text: { en: "Deploy the database project to the test database.", fr: "Déployer le projet de base de données sur la base de test." } }
answer:
  sequence: [init, pre, test, post, cleanup]
explanation:
  correct:
    en: |
      The order of SQL Server unit test scripts is fixed. The class-level TestInitialize runs first, then the test's own pre-test, test and post-test scripts, and finally the class-level TestCleanup. Only the test script is required; the others are optional and run with the privileged connection, while the test script uses the execution context.
    fr: |
      L'ordre des scripts d'un test unitaire SQL Server est fixe. Le script TestInitialize de la classe s'exécute d'abord, puis les scripts de prétest, de test et de post-test propres au test, et enfin le script TestCleanup de la classe. Seul le script de test est obligatoire ; les autres sont facultatifs et s'exécutent avec la connexion privilégiée, tandis que le script de test utilise le contexte d'exécution.
  options:
    deploy: { en: "Deployment would run once at the start of the test run, but it is disabled in this scenario.", fr: "Le déploiement s'exécuterait une fois au début de l'exécution des tests, mais il est désactivé dans ce scénario." }
references:
  - title: Scripts in SQL Server unit tests
    url: https://learn.microsoft.com/en-us/sql/ssdt/scripts-in-sql-server-unit-tests
