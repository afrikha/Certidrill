id: dp800-2a-ddm-partial-phone
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database that contains a table named **dbo.Customer**. The **Phone** column is `varchar(12)` and stores values such as `555-123-4567`.

    Support agents query the table directly and must see phone numbers in the format `XXX-XXX-4567`. Users who have the `UNMASK` permission must see the full values. The stored data and the applications must not change.

    You plan to run the following statement:

    ```text
    ALTER TABLE dbo.Customer ALTER COLUMN Phone
        ADD MASKED WITH (FUNCTION = '<function>');
    ```

    Which masking function should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL Database qui contient une table nommée **dbo.Customer**. La colonne **Phone** est de type `varchar(12)` et stocke des valeurs comme `555-123-4567`.

    Les agents du support interrogent directement la table et doivent voir les numéros de téléphone au format `XXX-XXX-4567`. Les utilisateurs qui disposent de l'autorisation `UNMASK` doivent voir les valeurs complètes. Les données stockées et les applications ne doivent pas changer.

    Vous prévoyez d'exécuter l'instruction suivante :

    ```text
    ALTER TABLE dbo.Customer ALTER COLUMN Phone
        ADD MASKED WITH (FUNCTION = '<function>');
    ```

    Quelle fonction de masquage devez-vous utiliser ?
body:
  options:
    - id: a
      text: 'default()'
    - id: b
      text: 'partial(4,"XXX-XXX-",0)'
    - id: c
      text: 'partial(0,"XXX-XXX-",8)'
    - id: d
      text: 'partial(0,"XXX-XXX-",4)'
answer: { optionId: d }
explanation:
  correct:
    en: |
      The partial(prefix, padding, suffix) function exposes the first prefix characters and the last suffix characters and puts the padding string between them. With a prefix of 0, the padding XXX-XXX- and a suffix of 4, the value 555-123-4567 is returned as XXX-XXX-4567 to users without UNMASK, while the stored value stays unchanged.
    fr: |
      La fonction partial(prefix, padding, suffix) expose les prefix premiers caractères et les suffix derniers caractères, et insère la chaîne de remplissage entre les deux. Avec un préfixe de 0, le remplissage XXX-XXX- et un suffixe de 4, la valeur 555-123-4567 est renvoyée sous la forme XXX-XXX-4567 aux utilisateurs sans UNMASK, alors que la valeur stockée ne change pas.
  options:
    a: { en: "default() replaces the whole string with xxxx, so the last four digits are not shown.", fr: "default() remplace toute la chaîne par xxxx : les quatre derniers chiffres ne sont pas affichés." }
    b: { en: "This exposes the first four characters (555-) and none of the last digits.", fr: "Cette fonction expose les quatre premiers caractères (555-) et aucun des derniers chiffres." }
    c: { en: "A suffix of 8 exposes 123-4567 after the padding, which reveals more than the last four digits.", fr: "Un suffixe de 8 expose 123-4567 après le remplissage, ce qui révèle plus que les quatre derniers chiffres." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking
