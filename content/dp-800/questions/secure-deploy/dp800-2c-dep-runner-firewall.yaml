id: dp800-2c-dep-runner-firewall
objective: "2.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam deploys an SDK-style SQL database project to the Azure SQL logical server **sql-fabrikam** from a GitHub Actions workflow that runs on GitHub-hosted runners. The server accepts public connections only from the IP addresses listed in its firewall rules. The workflow signs in with `azure/login` by using an identity that can manage the server's firewall rules.

    The deployment fails because the runner's IP address is not allowed, and that address changes with every run.

    You need the workflow to deploy the .dacpac file. The solution must not leave any firewall rule or network setting that allows other addresses after the run.

    What should you do?
  fr: |
    Fabrikam déploie un projet de base de données SQL de style SDK sur le serveur logique Azure SQL **sql-fabrikam** à partir d'un workflow GitHub Actions qui s'exécute sur des exécuteurs hébergés par GitHub. Le serveur n'accepte les connexions publiques que depuis les adresses IP listées dans ses règles de pare-feu. Le workflow se connecte avec `azure/login` en utilisant une identité capable de gérer les règles de pare-feu du serveur.

    Le déploiement échoue, car l'adresse IP de l'exécuteur n'est pas autorisée, et cette adresse change à chaque exécution.

    Vous devez permettre au workflow de déployer le fichier .dacpac. La solution ne doit laisser, après l'exécution, aucune règle de pare-feu ni aucun paramètre réseau qui autorise d'autres adresses.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on Allow Azure services and resources to access this server, and publish with sqlpackage.", fr: "Activer Allow Azure services and resources to access this server, et publier avec sqlpackage." } }
    - { id: b, text: { en: "Add firewall rules for the published IP ranges of GitHub-hosted runners, and publish with sqlpackage.", fr: "Ajouter des règles de pare-feu pour les plages IP publiées des exécuteurs hébergés par GitHub, et publier avec sqlpackage." } }
    - { id: c, text: { en: "Publish the .dacpac file with azure/sql-action after the azure/login step.", fr: "Publier le fichier .dacpac avec azure/sql-action après l'étape azure/login." } }
    - { id: d, text: { en: "Create a private endpoint for sql-fabrikam, and publish with sqlpackage.", fr: "Créer un point de terminaison privé pour sql-fabrikam, et publier avec sqlpackage." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When azure/sql-action runs after azure/login, it adds a temporary firewall rule for the runner's IP address during the deployment and removes it afterward. The .dacpac is published and no rule remains once the run ends.
    fr: |
      Lorsque azure/sql-action s'exécute après azure/login, il ajoute une règle de pare-feu temporaire pour l'adresse IP de l'exécuteur pendant le déploiement et la supprime ensuite. Le .dacpac est publié, et aucune règle ne subsiste à la fin de l'exécution.
  options:
    a:
      en: |
        This setting stays on and allows connections from any Azure IP address, including other customers' resources.
      fr: |
        Ce paramètre reste actif et autorise les connexions depuis n'importe quelle adresse IP Azure, y compris les ressources d'autres clients.
    b:
      en: |
        These rules are permanent and allow every runner in those ranges, not only Fabrikam's run.
      fr: |
        Ces règles sont permanentes et autorisent tous les exécuteurs de ces plages, pas seulement l'exécution de Fabrikam.
    d:
      en: |
        GitHub-hosted runners are not connected to Fabrikam's virtual network, so they cannot reach a private endpoint.
      fr: |
        Les exécuteurs hébergés par GitHub ne sont pas connectés au réseau virtuel de Fabrikam : ils ne peuvent pas joindre un point de terminaison privé.
references:
