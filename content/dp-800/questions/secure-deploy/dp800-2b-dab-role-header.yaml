id: dp800-2b-dab-role-header
objective: "2.1.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware uses Data API builder (DAB) to expose REST, GraphQL and MCP endpoints over an Azure SQL database. The runtime uses the `EntraId` authentication provider. The `Invoice` entity has the following permissions.

    ```json
    "permissions": [
      { "role": "authenticated", "actions": [ "read" ] },
      { "role": "finance-admin", "actions": [ "*" ] }
    ]
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Data API builder (DAB) pour exposer des points de terminaison REST, GraphQL et MCP sur une base de données Azure SQL. Le runtime utilise le fournisseur d'authentification `EntraId`. L'entité `Invoice` possède les autorisations suivantes.

    ```json
    "permissions": [
      { "role": "authenticated", "actions": [ "read" ] },
      { "role": "finance-admin", "actions": [ "*" ] }
    ]
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A request that has a valid token and no X-MS-API-ROLE header is evaluated with the authenticated role.
        fr: |
          Une requête qui a un jeton valide et aucun en-tête X-MS-API-ROLE est évaluée avec le rôle authenticated.
    - id: s2
      text:
        en: |
          A request that has a valid token and the header X-MS-API-ROLE set to finance-admin is evaluated with the authenticated role if finance-admin isn't in the token's roles claim.
        fr: |
          Une requête qui a un jeton valide et l'en-tête X-MS-API-ROLE défini sur finance-admin est évaluée avec le rôle authenticated si finance-admin ne figure pas dans la revendication roles du jeton.
    - id: s3
      text:
        en: |
          An MCP client whose requests are evaluated with the authenticated role can use the update_record tool on Invoice.
        fr: |
          Un client MCP dont les requêtes sont évaluées avec le rôle authenticated peut utiliser l'outil update_record sur Invoice.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Without the header, a request with a valid token gets the authenticated system role. When the header names a role that isn't in the roles claim, DAB doesn't fall back to authenticated; it rejects the request with 403 Forbidden. The MCP tools enforce the same entity permissions as REST and GraphQL, so a caller evaluated as authenticated can only read Invoice records.
    fr: |
      Sans l'en-tête, une requête avec un jeton valide obtient le rôle système authenticated. Lorsque l'en-tête nomme un rôle absent de la revendication roles, DAB ne se replie pas sur authenticated : il rejette la requête avec 403 Forbidden. Les outils MCP appliquent les mêmes autorisations d'entité que REST et GraphQL : un appelant évalué comme authenticated peut uniquement lire les enregistrements d'Invoice.
references:
  - title: Authorization overview
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/security/authorization
  - title: Data manipulation language (DML) tools in SQL MCP Server
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/data-manipulation-language-tools
