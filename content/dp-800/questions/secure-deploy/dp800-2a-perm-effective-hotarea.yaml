id: dp800-2a-perm-effective-hotarea
objective: "2.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL Database. A database user named **Mia** is a member of the roles **SalesTeam** and **Contractors**. The following table lists every permission that applies to Mia, directly or through her roles.

    All the objects of the Sales schema are owned by dbo. The procedure **Sales.usp_PayrollSummary** reads **Sales.Payroll** with a static SELECT statement.

    Answer each prompt by selecting the permission that determines the result.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database. Une utilisatrice de base de données nommée **Mia** est membre des rôles **SalesTeam** et **Contractors**. Le tableau suivant liste toutes les autorisations qui s'appliquent à Mia, directement ou par ses rôles.

    Tous les objets du schéma Sales appartiennent à dbo. La procédure **Sales.usp_PayrollSummary** lit **Sales.Payroll** avec une instruction SELECT statique.

    Répondez à chaque consigne en sélectionnant l'autorisation qui détermine le résultat.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Mia runs SELECT * FROM Sales.Payroll;", fr: "Mia exécute SELECT * FROM Sales.Payroll;" }
    - id: p2
      text: { en: "Mia runs SELECT * FROM Sales.Customer;", fr: "Mia exécute SELECT * FROM Sales.Customer;" }
    - id: p3
      text: { en: "Mia runs EXEC Sales.usp_PayrollSummary;", fr: "Mia exécute EXEC Sales.usp_PayrollSummary;" }
  grid:
    header: [{ en: "Principal", fr: "Principal" }, { en: "Permission", fr: "Autorisation" }]
    rows:
      - [{ text: SalesTeam }, { text: "GRANT SELECT ON SCHEMA::Sales", area: e1 }]
      - [{ text: Contractors }, { text: "DENY SELECT ON Sales.Payroll", area: e2 }]
      - [{ text: Mia }, { text: "GRANT SELECT ON Sales.Payroll", area: e3 }]
      - [{ text: Mia }, { text: "GRANT EXECUTE ON Sales.usp_PayrollSummary", area: e4 }]
answer:
  values: { p1: e2, p2: e1, p3: e4 }
explanation:
  correct:
    en: |
      A DENY overrides every GRANT, so the DENY given to Contractors blocks Mia's direct query on Sales.Payroll despite her two grants. Sales.Customer is covered only by the schema-level grant of SalesTeam. The procedure and Sales.Payroll have the same owner, so the ownership chain is unbroken and only the EXECUTE permission on the procedure is checked; the DENY on the table is not evaluated for the static query inside the procedure.
    fr: |
      Un DENY l'emporte sur tout GRANT : le DENY attribué à Contractors bloque la requête directe de Mia sur Sales.Payroll malgré ses deux autorisations. Sales.Customer n'est couverte que par l'autorisation de SalesTeam au niveau du schéma. La procédure et Sales.Payroll ont le même propriétaire : la chaîne de propriétés n'est pas rompue et seule l'autorisation EXECUTE sur la procédure est vérifiée ; le DENY sur la table n'est pas évalué pour la requête statique de la procédure.
references:
  - title: Describe database and object permissions
    url: https://learn.microsoft.com/en-us/training/modules/configure-database-authentication-authorization/5-describe-database-object-permissions
  - title: Managing Permissions with Stored Procedures in SQL Server
    url: https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/sql/managing-permissions-with-stored-procedures-in-sql-server
