id: dp800-2c-br-rename-review
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove uses pull requests to review changes to an SDK-style SQL database project named **CardsDb**. A pull request renames the column CustPhone to Phone in the dbo.Cardholder table. The developer changed the `CREATE TABLE` statement in **Tables/Cardholder.sql** directly.

    The deploy report attached to the pull request shows that the deployment would drop the CustPhone column and add a Phone column. The table contains data that must be kept.

    You need to request a change that makes the deployment keep the existing phone numbers.

    What should you ask the developer to do?
  fr: |
    Woodgrove utilise des pull requests pour réviser les modifications d'un projet de base de données SQL de style SDK nommé **CardsDb**. Une pull request renomme la colonne CustPhone en Phone dans la table dbo.Cardholder. Le développeur a modifié directement l'instruction `CREATE TABLE` dans **Tables/Cardholder.sql**.

    Le rapport de déploiement joint à la pull request montre que le déploiement supprimerait la colonne CustPhone et ajouterait une colonne Phone. La table contient des données à conserver.

    Vous devez demander une modification qui permet au déploiement de conserver les numéros de téléphone existants.

    Que devez-vous demander au développeur ?
body:
  options:
    - { id: a, text: { en: "Add an sp_rename call for the column to the pre-deployment script.", fr: "Ajouter un appel à sp_rename pour la colonne dans le script de prédéploiement." } }
    - { id: b, text: { en: "Add an sp_rename call for the column to the post-deployment script.", fr: "Ajouter un appel à sp_rename pour la colonne dans le script de post-déploiement." } }
    - { id: c, text: { en: "Redo the rename with the project's rename refactoring, and commit the .refactorlog file.", fr: "Refaire le renommage avec la refactorisation de renommage du projet, et valider le fichier .refactorlog." } }
    - { id: d, text: { en: "Publish the project with /p:BlockOnPossibleDataLoss=false.", fr: "Publier le projet avec /p:BlockOnPossibleDataLoss=false." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Without a refactor log, a rename is deployed as a drop of the old column and the creation of a new one. Renaming through the project's refactoring (Rename in Visual Studio Code or Visual Studio) records the operation in the .refactorlog file, so the deployment performs an in-place rename and records it in `dbo.__RefactorLog`.
    fr: |
      Sans journal de refactorisation, un renommage est déployé comme la suppression de l'ancienne colonne et la création d'une nouvelle. Renommer avec la refactorisation du projet (Renommer dans Visual Studio Code ou Visual Studio) enregistre l'opération dans le fichier .refactorlog : le déploiement effectue un renommage sur place et l'enregistre dans `dbo.__RefactorLog`.
  options:
    a: { en: "The deployment plan is calculated before the pre-deployment script runs, so it still contains the drop of CustPhone and the creation of Phone.", fr: "Le plan de déploiement est calculé avant l'exécution du script de prédéploiement : il contient toujours la suppression de CustPhone et la création de Phone." }
    b: { en: "The post-deployment script runs after the plan, when CustPhone has already been dropped.", fr: "Le script de post-déploiement s'exécute après le plan, quand CustPhone a déjà été supprimée." }
    d: { en: "This removes the safety check and lets the deployment drop the column and its data.", fr: "Cela supprime la protection et laisse le déploiement supprimer la colonne et ses données." }
references:
  - title: Refactor objects in SQL database projects
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/refactor-overview
  - title: Pre-deployment and post-deployment scripts overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts
