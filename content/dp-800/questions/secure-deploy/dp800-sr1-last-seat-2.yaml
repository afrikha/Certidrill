stem:
  en: You add the UPDLOCK table hint to the SELECT statement of the procedure.
  fr: Vous ajoutez l'indicateur de table UPDLOCK à l'instruction SELECT de la procédure.
body:
  solution:
    en: |
      In dbo.usp_ReserveSeat, you replace the SELECT statement with the following statement and keep the rest of the procedure unchanged:

      ```sql
      SELECT @Available = SeatsAvailable
      FROM dbo.EventInventory WITH (UPDLOCK)
      WHERE EventID = @EventID;
      ```
    fr: |
      Dans dbo.usp_ReserveSeat, vous remplacez l'instruction SELECT par l'instruction suivante et conservez le reste de la procédure inchangé :

      ```sql
      SELECT @Available = SeatsAvailable
      FROM dbo.EventInventory WITH (UPDLOCK)
      WHERE EventID = @EventID;
      ```
answer: { value: true }
explanation:
  correct:
    en: UPDLOCK takes an update lock on the row and holds it until the transaction completes. Update locks are not compatible with each other, so the second call waits at its SELECT until the first transaction commits, and then reads the new value of 0 and skips the reservation. The read, the check and the update now behave as one unit for each event.
    fr: "UPDLOCK prend un verrou de mise à jour sur la ligne et le conserve jusqu'à la fin de la transaction. Les verrous de mise à jour ne sont pas compatibles entre eux : le second appel attend sur son SELECT que la première transaction soit validée, puis lit la nouvelle valeur 0 et n'effectue pas la réservation. La lecture, la vérification et la mise à jour se comportent désormais comme une seule unité pour chaque événement."
references:
  - title: Table Hints (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/hints-transact-sql-table
