id: dp800-2d-simulator-startup
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware tested its Data API builder (DAB) configuration locally. The runtime section of dab-config.json contains the following settings:

    ```json
    "host": {
      "mode": "production",
      "authentication": { "provider": "Simulator" }
    }
    ```

    After you deploy the configuration to Azure Container Apps, the DAB container doesn't start. The API must run in production mode and must authorize the requests of client applications that send Microsoft Entra ID access tokens issued for the audience api://litware-claims. Container Apps authentication isn't configured.

    What should you do?
  fr: |
    Litware a testé localement sa configuration Data API builder (DAB). La section runtime de dab-config.json contient les paramètres suivants :

    ```json
    "host": {
      "mode": "production",
      "authentication": { "provider": "Simulator" }
    }
    ```

    Après le déploiement de la configuration dans Azure Container Apps, le conteneur DAB ne démarre pas. L'API doit s'exécuter en mode production et doit autoriser les requêtes des applications clientes qui envoient des jetons d'accès Microsoft Entra ID émis pour l'audience api://litware-claims. L'authentification de Container Apps n'est pas configurée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set mode to development and keep the Simulator provider.", fr: "Définir mode sur development et conserver le fournisseur Simulator." } }
    - { id: b, text: { en: "Set the provider to AppService and keep production mode.", fr: "Définir le fournisseur sur AppService et conserver le mode production." } }
    - { id: c, text: { en: "Set the provider to EntraId and add a jwt object with the audience and the issuer.", fr: "Définir le fournisseur sur EntraId et ajouter un objet jwt avec l'audience et l'émetteur." } }
    - { id: d, text: { en: "Set the provider to Unauthenticated and keep the authenticated role permissions.", fr: "Définir le fournisseur sur Unauthenticated et conserver les autorisations du rôle authenticated." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Simulator provider works only in development mode, and DAB fails to start when it's configured with production mode. EntraId validates Microsoft Entra ID tokens and requires a jwt object that contains both audience (api://litware-claims) and issuer (https://login.microsoftonline.com/<tenant-id>/v2.0). Production mode is kept, as required.
    fr: |
      Le fournisseur Simulator ne fonctionne qu'en mode development, et DAB ne démarre pas quand il est configuré avec le mode production. EntraId valide les jetons Microsoft Entra ID et exige un objet jwt qui contient à la fois audience (api://litware-claims) et issuer (https://login.microsoftonline.com/<tenant-id>/v2.0). Le mode production est conservé, comme exigé.
  options:
    a: { en: "Development mode would start, but the API must run in production mode and Simulator doesn't validate real tokens.", fr: "Le mode development démarrerait, mais l'API doit s'exécuter en mode production et Simulator ne valide pas de vrais jetons." }
    b: { en: "AppService trusts headers set by built-in authentication, which isn't configured, so no request would be authenticated.", fr: "AppService approuve des en-têtes définis par l'authentification intégrée, qui n'est pas configurée : aucune requête ne serait authentifiée." }
    d: { en: "With Unauthenticated, every request runs as anonymous and the authenticated role is never activated.", fr: "Avec Unauthenticated, chaque requête s'exécute en tant qu'anonymous et le rôle authenticated n'est jamais activé." }
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
