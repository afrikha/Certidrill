id: dp800-2c-sec-secret-stores
objective: "2.3.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip deploys SQL database projects from both Azure Pipelines and GitHub Actions. You are defining where the pipelines get their credentials.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip déploie des projets de base de données SQL à partir d'Azure Pipelines et de GitHub Actions. Vous définissez où les pipelines obtiennent leurs informations d'identification.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: wif, text: { en: "Azure Resource Manager service connection with workload identity federation", fr: "Connexion de service Azure Resource Manager avec fédération d'identité de charge de travail" } }
    - { id: kvgroup, text: { en: "Variable group linked to Azure Key Vault", fr: "Groupe de variables lié à Azure Key Vault" } }
    - { id: orgsecret, text: { en: "GitHub organization secret available to selected repositories", fr: "Secret d'organisation GitHub accessible aux dépôts sélectionnés" } }
    - { id: fic, text: { en: "Federated identity credential on a Microsoft Entra application", fr: "Informations d'identification fédérées sur une application Microsoft Entra" } }
    - { id: reposecret, text: { en: "GitHub repository secret", fr: "Secret de dépôt GitHub" } }
    - { id: profile, text: { en: "Publish profile with the connection string", fr: "Profil de publication avec la chaîne de connexion" } }
  targets:
    - id: ado-signin
      text: { en: "An Azure Pipelines stage signs in to Azure without any client secret to store or rotate.", fr: "Une phase Azure Pipelines se connecte à Azure sans secret client à stocker ou à renouveler." }
    - id: ado-latest
      text: { en: "Several Azure Pipelines read the latest value of a connection string kept in a key vault, without copying the value into Azure DevOps.", fr: "Plusieurs pipelines Azure Pipelines lisent la dernière valeur d'une chaîne de connexion conservée dans un coffre de clés, sans copier la valeur dans Azure DevOps." }
    - id: gh-shared
      text: { en: "The workflows of three repositories in the GitHub organization use the same package feed token, which is maintained in one place.", fr: "Les workflows de trois dépôts de l'organisation GitHub utilisent le même jeton de flux de packages, géré à un seul endroit." }
    - id: gh-signin
      text: { en: "A GitHub workflow signs in to Azure with azure/login without any client secret.", fr: "Un workflow GitHub se connecte à Azure avec azure/login sans aucun secret client." }
answer:
  mapping: { ado-signin: wif, ado-latest: kvgroup, gh-shared: orgsecret, gh-signin: fic }
explanation:
  correct:
    en: |
      Workload identity federation lets an Azure Resource Manager service connection sign in without a secret. A Key Vault-linked variable group stores only secret names and fetches the current values at run time. An organization secret is stored once and shared with the repositories that its access policy selects. GitHub OpenID Connect sign-in relies on a federated identity credential that trusts the repository's tokens. A repository secret would have to be copied into each repository, and a publish profile with a connection string puts the credential in the repository.
    fr: |
      La fédération d'identité de charge de travail permet à une connexion de service Azure Resource Manager de se connecter sans secret. Un groupe de variables lié à Key Vault ne stocke que les noms des secrets et récupère les valeurs actuelles à l'exécution. Un secret d'organisation est stocké une seule fois et partagé avec les dépôts que sa stratégie d'accès sélectionne. La connexion OpenID Connect de GitHub repose sur des informations d'identification fédérées qui approuvent les jetons du dépôt. Un secret de dépôt devrait être copié dans chaque dépôt, et un profil de publication avec une chaîne de connexion place les informations d'identification dans le dépôt.
references:
  - title: Use an Azure Resource Manager service connection
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/connect-to-azure
  - title: Link a variable group to secrets in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/link-variable-groups-to-key-vaults
