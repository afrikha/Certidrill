id: dp800-2d-config-sections
objective: "2.4.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing the configuration file of a Data API builder (DAB) instance for Wingtip. The instance exposes tables of a main Azure SQL database and of two other databases that have their own configuration files.

    In which top-level section of the main configuration file should you define each setting? To answer, drag the appropriate sections to the correct settings. Each section may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous rédigez le fichier de configuration d'une instance Data API builder (DAB) pour Wingtip. L'instance expose des tables d'une base de données Azure SQL principale et de deux autres bases de données qui ont leurs propres fichiers de configuration.

    Dans quelle section de premier niveau du fichier de configuration principal devez-vous définir chaque paramètre ? Pour répondre, faites glisser les sections appropriées vers les paramètres correspondants. Chaque section peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: schema, text: "$schema" }
    - { id: ds, text: data-source }
    - { id: dsf, text: data-source-files }
    - { id: rt, text: runtime }
    - { id: ent, text: entities }
  targets:
    - id: t1
      text: { en: "The database type and the connection string of the main database", fr: "Le type de base de données et la chaîne de connexion de la base principale" }
    - id: t2
      text: { en: "The authentication provider and the allowed CORS origins", fr: "Le fournisseur d'authentification et les origines CORS autorisées" }
    - id: t3
      text: { en: "The roles and actions allowed on dbo.Tickets", fr: "Les rôles et actions autorisés sur dbo.Tickets" }
    - id: t4
      text: { en: "The configuration files of the two other databases", fr: "Les fichiers de configuration des deux autres bases de données" }
answer:
  mapping: { t1: ds, t2: rt, t3: ent, t4: dsf }
explanation:
  correct:
    en: |
      data-source holds the database type, the connection string and its options. runtime holds the global settings: REST, GraphQL and MCP endpoints, and host settings such as CORS and authentication. entities lists each exposed object with its permissions. data-source-files lists child configuration files, which is how one DAB instance serves several databases. $schema only points to the JSON schema used to validate the file.
    fr: |
      data-source contient le type de base de données, la chaîne de connexion et ses options. runtime contient les paramètres globaux : points de terminaison REST, GraphQL et MCP, et paramètres d'hôte comme CORS et l'authentification. entities liste chaque objet exposé avec ses autorisations. data-source-files liste des fichiers de configuration enfants, ce qui permet à une instance DAB de servir plusieurs bases de données. $schema pointe seulement vers le schéma JSON utilisé pour valider le fichier.
references:
  - title: Configuration schema - Data source section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/data-source
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
