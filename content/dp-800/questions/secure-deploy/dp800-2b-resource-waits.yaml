id: dp800-2b-resource-waits
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Users of a database in Azure SQL Database reported slow responses 20 minutes ago. You need to determine:

    - whether the database reached the CPU or data I/O limit of its service objective during the last 30 minutes, at a granularity of less than one minute;
    - which wait types accumulated the most wait time in the database.

    Which two objects should you query? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les utilisateurs d'une base de données dans Azure SQL Database ont signalé des temps de réponse lents il y a 20 minutes. Vous devez déterminer :

    - si la base a atteint la limite de processeur ou d'E/S de données de son objectif de service au cours des 30 dernières minutes, avec une granularité inférieure à une minute ;
    - quels types d'attente ont accumulé le plus de temps d'attente dans la base.

    Quels sont les deux objets à interroger ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: sys.resource_stats
    - id: b
      text: sys.dm_db_wait_stats
    - id: c
      text: sys.dm_tran_locks
    - id: d
      text: sys.dm_db_resource_stats
    - id: e
      text: sys.dm_db_index_usage_stats
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      sys.dm_db_resource_stats returns a row every 15 seconds for about the last hour, with avg_cpu_percent and avg_data_io_percent as percentages of the service tier limit. sys.dm_db_wait_stats returns the waits encountered by threads in the database, so you can rank wait types by accumulated wait time.
    fr: |
      sys.dm_db_resource_stats renvoie une ligne toutes les 15 secondes pour environ la dernière heure, avec avg_cpu_percent et avg_data_io_percent exprimés en pourcentage de la limite du niveau de service. sys.dm_db_wait_stats renvoie les attentes rencontrées par les threads de la base : vous pouvez classer les types d'attente par temps d'attente cumulé.
  options:
    a: { en: "sys.resource_stats keeps 14 days of history, but at 5-minute granularity.", fr: "sys.resource_stats conserve 14 jours d'historique, mais avec une granularité de 5 minutes." }
    c: { en: "sys.dm_tran_locks shows locks held and requested now, not resource limits or accumulated waits.", fr: "sys.dm_tran_locks montre les verrous détenus et demandés à l'instant, pas les limites de ressources ni les attentes cumulées." }
    e: { en: "sys.dm_db_index_usage_stats counts seeks, scans and updates per index; it says nothing about resource limits or waits.", fr: "sys.dm_db_index_usage_stats compte les recherches, analyses et mises à jour par index ; il n'indique rien sur les limites de ressources ni sur les attentes." }
references:
  - title: sys.dm_db_resource_stats
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-db-resource-stats-azure-sql-database
