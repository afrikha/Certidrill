id: dp800-2d-many-to-many
objective: "2.4.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Contoso exposes the following tables through Data API builder (DAB):

    | Table | Columns | Exposed as |
    | --- | --- | --- |
    | dbo.Books | BookID (primary key), Title | Book entity |
    | dbo.Authors | AuthorID (primary key), Name | Author entity |
    | dbo.BookAuthors | BookRef, AuthorRef | Not exposed |

    dbo.BookAuthors links each book to its authors: BookRef references dbo.Books and AuthorRef references dbo.Authors.

    A GraphQL client must list each book with its authors in one query. You are adding the following relationship to the Book entity:

    ```json
    "relationships": {
      "authors": {
        "cardinality": "<value 1>",
        "target.entity": "Author",
        "source.fields": [ "BookID" ],
        "target.fields": [ "AuthorID" ],
        "linking.object": "<value 2>",
        "linking.source.fields": [ "<value 3>" ],
        "linking.target.fields": [ "<value 4>" ]
      }
    }
    ```

    Which value should you use for each placeholder? To answer, drag the appropriate values to the correct placeholders. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso expose les tables suivantes avec Data API builder (DAB) :

    | Table | Colonnes | Exposée en tant que |
    | --- | --- | --- |
    | dbo.Books | BookID (clé primaire), Title | Entité Book |
    | dbo.Authors | AuthorID (clé primaire), Name | Entité Author |
    | dbo.BookAuthors | BookRef, AuthorRef | Non exposée |

    dbo.BookAuthors relie chaque livre à ses auteurs : BookRef référence dbo.Books et AuthorRef référence dbo.Authors.

    Un client GraphQL doit lister chaque livre avec ses auteurs en une seule requête. Vous ajoutez la relation suivante à l'entité Book :

    ```json
    "relationships": {
      "authors": {
        "cardinality": "<value 1>",
        "target.entity": "Author",
        "source.fields": [ "BookID" ],
        "target.fields": [ "AuthorID" ],
        "linking.object": "<value 2>",
        "linking.source.fields": [ "<value 3>" ],
        "linking.target.fields": [ "<value 4>" ]
      }
    }
    ```

    Quelle valeur devez-vous utiliser pour chaque espace réservé ? Pour répondre, faites glisser les valeurs appropriées vers les espaces réservés correspondants. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: many, text: many }
    - { id: one, text: one }
    - { id: dboLink, text: dbo.BookAuthors }
    - { id: entityLink, text: BookAuthor }
    - { id: bookRef, text: BookRef }
    - { id: authorRef, text: AuthorRef }
    - { id: bookId, text: BookID }
  targets:
    - { id: v1, text: "<value 1>" }
    - { id: v2, text: "<value 2>" }
    - { id: v3, text: "<value 3>" }
    - { id: v4, text: "<value 4>" }
answer:
  mapping: { v1: many, v2: dboLink, v3: bookRef, v4: authorRef }
explanation:
  correct:
    en: |
      A book has many authors, so the cardinality is many. When the join table isn't exposed as an entity, linking.object names the database object (dbo.BookAuthors), linking.source.fields lists its columns that match source.fields of Book (BookRef), and linking.target.fields lists its columns that match target.fields of Author (AuthorRef). Relationships are a GraphQL feature, and to navigate from authors to books you would define a second relationship on Author.
    fr: |
      Un livre a plusieurs auteurs : la cardinalité est many. Quand la table de jointure n'est pas exposée comme entité, linking.object nomme l'objet de base de données (dbo.BookAuthors), linking.source.fields liste ses colonnes qui correspondent à source.fields de Book (BookRef), et linking.target.fields liste ses colonnes qui correspondent à target.fields d'Author (AuthorRef). Les relations sont une fonctionnalité GraphQL, et pour naviguer des auteurs vers les livres, il faudrait définir une deuxième relation sur Author.
  options:
    one: { en: "one would mean that each book has a single author.", fr: "one signifierait que chaque livre n'a qu'un seul auteur." }
    entityLink: { en: "linking.object is the database object of the join table; no BookAuthor entity exists.", fr: "linking.object est l'objet de base de données de la table de jointure ; aucune entité BookAuthor n'existe." }
    bookId: { en: "BookID is the column of dbo.Books, already listed in source.fields; the linking fields are columns of dbo.BookAuthors.", fr: "BookID est la colonne de dbo.Books, déjà listée dans source.fields ; les champs de liaison sont des colonnes de dbo.BookAuthors." }
references:
  - title: Entity relationships - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/database/relationships
  - title: Configuration schema - Entities section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities
