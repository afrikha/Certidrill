id: dp800-2c-dep-profile-hotarea
objective: "2.3.8"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware publishes an SDK-style SQL database project to production with SqlPackage and the publish profile **Prod.publish.xml**. The properties of the profile are shown in the following table. No property is overridden on the command line.

    Answer each prompt by selecting the property that causes the behavior.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware publie un projet de base de données SQL de style SDK en production avec SqlPackage et le profil de publication **Prod.publish.xml**. Les propriétés du profil figurent dans le tableau suivant. Aucune propriété n'est remplacée sur la ligne de commande.

    Répondez à chaque consigne en sélectionnant la propriété à l'origine du comportement.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The deployment deletes an index that a DBA created directly in production.", fr: "Le déploiement supprime un index qu'un DBA a créé directement en production." }
    - id: p2
      text: { en: "The deployment adds a NOT NULL column without a default constraint to a table that already contains rows, and it succeeds.", fr: "Le déploiement ajoute une colonne NOT NULL sans contrainte par défaut à une table qui contient déjà des lignes, et il réussit." }
  grid:
    header: [{ en: "Property", fr: "Propriété" }, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: BlockOnPossibleDataLoss, area: block }, { text: "True" }]
      - [{ text: DropObjectsNotInSource, area: drop }, { text: "True" }]
      - [{ text: GenerateSmartDefaults, area: smart }, { text: "True" }]
      - [{ text: IgnoreColumnOrder, area: order }, { text: "True" }]
      - [{ text: ScriptDatabaseOptions, area: dbopts }, { text: "False" }]
      - [{ text: AllowIncompatiblePlatform, area: platform }, { text: "False" }]
answer:
  values: { p1: drop, p2: smart }
explanation:
  correct:
    en: |
      DropObjectsNotInSource=True drops objects of the target that are not in the .dacpac, such as an index created directly in production. GenerateSmartDefaults=True automatically provides a default value when a deployment adds a NOT NULL column to a table that contains data, so the change succeeds. BlockOnPossibleDataLoss stops changes that could lose data, which does not apply to adding a column.
    fr: |
      DropObjectsNotInSource=True supprime les objets de la cible absents du .dacpac, comme un index créé directement en production. GenerateSmartDefaults=True fournit automatiquement une valeur par défaut lorsqu'un déploiement ajoute une colonne NOT NULL à une table qui contient des données : la modification réussit. BlockOnPossibleDataLoss arrête les modifications susceptibles de perdre des données, ce qui ne concerne pas l'ajout d'une colonne.
references:
  - title: SqlPackage Publish
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-publish
  - title: Publish profiles overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/publish-profiles
