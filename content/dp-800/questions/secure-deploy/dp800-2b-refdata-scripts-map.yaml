id: dp800-2b-refdata-scripts-map
objective: "2.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip is organizing an SDK-style SQL database project in Git. The next release drops the `Phone` column of `dbo.Customer` and moves phone numbers to a new `dbo.CustomerPhone` table. The project is deployed to several environments with SqlPackage.

    Where should you put each element? To answer, drag the appropriate locations to the correct elements. Each location may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip organise un projet de base de données SQL de style SDK sous Git. La prochaine version supprime la colonne `Phone` de `dbo.Customer` et déplace les numéros de téléphone vers une nouvelle table `dbo.CustomerPhone`. Le projet est déployé dans plusieurs environnements avec SqlPackage.

    Où devez-vous placer chaque élément ? Pour répondre, faites glisser les emplacements appropriés vers les éléments correspondants. Chaque emplacement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: post, text: { en: "Post-deployment script", fr: "Script de post-déploiement" } }
    - { id: pre, text: { en: "Pre-deployment script", fr: "Script de prédéploiement" } }
    - { id: sqlcmd, text: { en: "SQLCMD variable set at deployment", fr: "Variable SQLCMD définie au déploiement" } }
    - { id: table, text: { en: "Object script in the Tables folder", fr: "Script d'objet dans le dossier Tables" } }
    - { id: dacpac, text: { en: ".dacpac file committed to the repository", fr: "Fichier .dacpac validé dans le dépôt" } }
  targets:
    - id: t1
      text:
        en: |
          The rows of the dbo.CustomerType lookup table
        fr: |
          Les lignes de la table de recherche dbo.CustomerType
    - id: t2
      text:
        en: |
          The statements that save the existing phone numbers before the Phone column is dropped
        fr: |
          Les instructions qui sauvegardent les numéros de téléphone existants avant la suppression de la colonne Phone
    - id: t3
      text:
        en: |
          The name of the target environment, which differs for each deployment
        fr: |
          Le nom de l'environnement cible, qui diffère à chaque déploiement
    - id: t4
      text:
        en: |
          The CREATE TABLE statement of dbo.CustomerPhone
        fr: |
          L'instruction CREATE TABLE de dbo.CustomerPhone
answer:
  mapping: { t1: post, t2: pre, t3: sqlcmd, t4: table }
explanation:
  correct:
    en: |
      Reference data goes in the post-deployment script, which runs after the schema changes on every deployment. Work that must finish before the schema changes, such as preserving data from a column that will be dropped, goes in the pre-deployment script. A value that changes per environment is a SQLCMD variable supplied at deployment. Object definitions are declarative scripts in the project, one object per file, compiled into the model.
    fr: |
      Les données de référence vont dans le script de post-déploiement, qui s'exécute après les modifications de schéma à chaque déploiement. Le travail qui doit se terminer avant les modifications de schéma, comme la préservation des données d'une colonne qui sera supprimée, va dans le script de prédéploiement. Une valeur propre à chaque environnement est une variable SQLCMD fournie au déploiement. Les définitions d'objets sont des scripts déclaratifs du projet, un objet par fichier, compilés dans le modèle.
  options:
    dacpac:
      en: |
        The .dacpac is a build output recreated by every build and is excluded from source control.
      fr: |
        Le fichier .dacpac est une sortie de build recréée à chaque build et exclue du contrôle de code source.
references:
  - title: Configure source control and manage reference data
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/03-configure-source-control-manage-reference-data
  - title: SQLCMD variables overview
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/sqlcmd-variables
