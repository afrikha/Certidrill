id: dp800-cs1b-status-reference
objective: "2.3.2"
type: single
caseStudy: dp800-cs1b-wide-world-importers
difficulty: 1
status: draft
stem:
  en: |
    You need to manage the rows of dbo.ShipmentStatus in the WWI.Shipping project. The solution must meet the deployment requirements.

    What should you do?
  fr: |
    Vous devez gérer les lignes de dbo.ShipmentStatus dans le projet WWI.Shipping. La solution doit respecter les exigences de déploiement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add INSERT statements for the 12 rows to the project file that contains the CREATE TABLE statement of dbo.ShipmentStatus.", fr: "Ajouter des instructions INSERT pour les 12 lignes dans le fichier du projet qui contient l'instruction CREATE TABLE de dbo.ShipmentStatus." } }
    - { id: b, text: { en: "Add a post-deployment script to the project that runs a MERGE statement on dbo.ShipmentStatus with the 12 rows as its source.", fr: "Ajouter au projet un script post-déploiement qui exécute une instruction MERGE sur dbo.ShipmentStatus avec les 12 lignes comme source." } }
    - { id: c, text: { en: "Add a pre-deployment script to the project that runs an INSERT statement for each of the 12 rows of dbo.ShipmentStatus.", fr: "Ajouter au projet un script pré-déploiement qui exécute une instruction INSERT pour chacune des 12 lignes de dbo.ShipmentStatus." } }
    - { id: d, text: { en: "Store a .bacpac file that contains the 12 rows in the repository, and import it into sqldb-shipping at each deployment.", fr: "Stocker dans le dépôt un fichier .bacpac qui contient les 12 lignes, et l'importer dans sqldb-shipping à chaque déploiement." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A post-deployment script is stored in the project, included in the .dacpac file and run after the deployment plan every time the project is deployed, when the table already exists. A MERGE statement that uses the 12 rows as its source inserts the missing codes, updates changed labels and can delete extra rows, so running it again never creates duplicates.
    fr: |
      Un script post-déploiement est stocké dans le projet, inclus dans le fichier .dacpac et exécuté après le plan de déploiement à chaque déploiement du projet, quand la table existe déjà. Une instruction MERGE qui utilise les 12 lignes comme source insère les codes manquants, met à jour les libellés modifiés et peut supprimer les lignes en trop : l'exécuter de nouveau ne crée jamais de doublons.
  options:
    a: { en: "The object files of a SQL project define the schema model; data manipulation statements are not part of the model and the project does not build.", fr: "Les fichiers d'objets d'un projet SQL définissent le modèle de schéma ; les instructions de manipulation de données n'en font pas partie et le projet ne se génère pas." }
    c: { en: "A pre-deployment script runs before the schema changes, so the table might not exist yet, and plain INSERT statements add duplicate rows at every deployment.", fr: "Un script pré-déploiement s'exécute avant les modifications de schéma : la table pourrait ne pas encore exister, et de simples instructions INSERT ajoutent des lignes en double à chaque déploiement." }
    d: { en: "Importing a .bacpac file creates a new database; it cannot refresh one table of an existing database.", fr: "L'importation d'un fichier .bacpac crée une nouvelle base de données ; elle ne peut pas actualiser une table d'une base de données existante." }
references:
  - title: Pre-Deployment and Post-Deployment Scripts
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts
