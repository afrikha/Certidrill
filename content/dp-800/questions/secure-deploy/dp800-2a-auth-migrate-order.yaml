id: dp800-2a-auth-migrate-order
objective: "2.1.5"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    An App Service app named **app-hr** connects to the Azure SQL Database **HRDb** on the logical server **sql-hr** by using the SQL login **hr_app**. The password of hr_app is stored in an app setting. A Microsoft Entra admin is already configured on sql-hr. No other application uses SQL authentication on sql-hr.

    You need to make app-hr connect without a password, and then prevent any SQL authentication on sql-hr. app-hr must keep working after each action.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une application App Service nommée **app-hr** se connecte à la base de données Azure SQL Database **HRDb** du serveur logique **sql-hr** à l'aide de la connexion SQL **hr_app**. Le mot de passe de hr_app est stocké dans un paramètre d'application. Un administrateur Microsoft Entra est déjà configuré sur sql-hr. Aucune autre application n'utilise l'authentification SQL sur sql-hr.

    Vous devez faire en sorte qu'app-hr se connecte sans mot de passe, puis empêcher toute authentification SQL sur sql-hr. app-hr doit continuer à fonctionner après chaque action.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: mi, text: { en: "Enable the system-assigned managed identity of app-hr.", fr: "Activer l'identité managée affectée par le système d'app-hr." } }
    - { id: user, text: { en: "In HRDb, run CREATE USER [app-hr] FROM EXTERNAL PROVIDER.", fr: "Dans HRDb, exécuter CREATE USER [app-hr] FROM EXTERNAL PROVIDER." } }
    - { id: role, text: { en: "In HRDb, add [app-hr] to the database roles that the hr_app user belongs to.", fr: "Dans HRDb, ajouter [app-hr] aux rôles de base de données dont l'utilisateur hr_app est membre." } }
    - { id: conn, text: { en: "Change the connection string of app-hr to Authentication=Active Directory Managed Identity and remove the password.", fr: "Modifier la chaîne de connexion d'app-hr en Authentication=Active Directory Managed Identity et supprimer le mot de passe." } }
    - { id: only, text: { en: "Enable Microsoft Entra-only authentication on sql-hr.", fr: "Activer l'authentification Microsoft Entra uniquement sur sql-hr." } }
    - { id: rbac, text: { en: "Assign the SQL DB Contributor role on HRDb to the managed identity of app-hr.", fr: "Attribuer le rôle SQL DB Contributor sur HRDb à l'identité managée d'app-hr." } }
    - { id: rotate, text: { en: "Rotate the password of hr_app and store it in Azure Key Vault.", fr: "Renouveler le mot de passe de hr_app et le stocker dans Azure Key Vault." } }
answer:
  sequence: [mi, user, role, conn, only]
explanation:
  correct:
    en: |
      The managed identity must exist in Microsoft Entra ID before a database user can be created for it with FROM EXTERNAL PROVIDER, and the user needs the same role memberships as hr_app before the app switches to it. Only after the app uses the managed identity can you enable Microsoft Entra-only authentication, which blocks every SQL authentication login, including hr_app.
    fr: |
      L'identité managée doit exister dans Microsoft Entra ID avant qu'un utilisateur de base de données puisse être créé pour elle avec FROM EXTERNAL PROVIDER, et cet utilisateur a besoin des mêmes appartenances aux rôles que hr_app avant que l'application ne bascule. Ce n'est qu'une fois que l'application utilise l'identité managée que vous pouvez activer l'authentification Microsoft Entra uniquement, qui bloque toutes les connexions d'authentification SQL, y compris hr_app.
  options:
    rbac: { en: "An Azure RBAC role on the database resource gives no access to the data inside HRDb.", fr: "Un rôle Azure RBAC sur la ressource de base de données ne donne aucun accès aux données d'HRDb." }
    rotate: { en: "Rotating the password keeps a secret; the goal is to remove it.", fr: "Renouveler le mot de passe conserve un secret ; l'objectif est de le supprimer." }
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
  - title: Configure and manage Microsoft Entra authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
