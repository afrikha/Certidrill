id: dp800-2a-ae-access-yesno
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database named **SalesDb**. The **TaxNumber** column of **dbo.Customer** is encrypted with Always Encrypted. The column master key is a key in an Azure key vault that uses the Azure RBAC permission model.

    An application named **OrdersApp** connects to SalesDb with a managed identity and a connection string that contains `Column Encryption Setting=Enabled`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **SalesDb**. La colonne **TaxNumber** de **dbo.Customer** est chiffrée avec Always Encrypted. La clé principale de colonne est une clé d'un coffre de clés Azure qui utilise le modèle d'autorisation Azure RBAC.

    Une application nommée **OrdersApp** se connecte à SalesDb avec une identité managée et une chaîne de connexion qui contient `Column Encryption Setting=Enabled`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The database user of OrdersApp must be granted VIEW ANY COLUMN MASTER KEY DEFINITION and VIEW ANY COLUMN ENCRYPTION KEY DEFINITION to query TaxNumber.
        fr: |
          L'utilisateur de base de données d'OrdersApp doit recevoir VIEW ANY COLUMN MASTER KEY DEFINITION et VIEW ANY COLUMN ENCRYPTION KEY DEFINITION pour interroger TaxNumber.
    - id: s2
      text:
        en: |
          Assigning the Key Vault Crypto User role on the key vault to the managed identity of OrdersApp lets the driver decrypt the column encryption key.
        fr: |
          Attribuer le rôle Key Vault Crypto User sur le coffre de clés à l'identité managée d'OrdersApp permet au pilote de déchiffrer la clé de chiffrement de colonne.
    - id: s3
      text:
        en: |
          A member of db_owner who has no access to the key vault can read TaxNumber in plaintext by querying it in SQL Server Management Studio with Always Encrypted enabled.
        fr: |
          Un membre de db_owner qui n'a aucun accès au coffre de clés peut lire TaxNumber en clair en l'interrogeant dans SQL Server Management Studio avec Always Encrypted activé.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      In Azure SQL Database, the public role does not hold the two VIEW ANY ... DEFINITION permissions, so they must be granted explicitly to every principal that queries encrypted columns. The driver unwraps the column encryption key with the column master key in Key Vault, which requires the decrypt, read and verify key actions included in Key Vault Crypto User. Without access to the column master key, even a db_owner member only gets ciphertext, because the engine never holds the keys.
    fr: |
      Dans Azure SQL Database, le rôle public ne détient pas les deux autorisations VIEW ANY ... DEFINITION : elles doivent être accordées explicitement à chaque principal qui interroge des colonnes chiffrées. Le pilote déchiffre la clé de chiffrement de colonne avec la clé principale de colonne dans Key Vault, ce qui exige les actions de clé decrypt, read et verify incluses dans Key Vault Crypto User. Sans accès à la clé principale de colonne, même un membre de db_owner n'obtient que le texte chiffré, car le moteur ne détient jamais les clés.
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
  - title: Create and store column master keys for Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/create-and-store-column-master-keys-always-encrypted
