id: dp800-2a-perm-grant-complete
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database named **HRDb**. You need to grant the following permissions:

    - **WebAppRole** must run every current and future stored procedure of the **Api** schema.
    - **DirectoryReaders** must read only the EmployeeID, FullName and Email columns of **dbo.Employee**.
    - **SchemaDevelopers** already have ALTER on the tables of the **Sales** schema. They must be able to create FOREIGN KEY constraints in those tables that reference **dbo.Region**.

    The solution must follow the principle of least privilege. How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **HRDb**. Vous devez accorder les autorisations suivantes :

    - **WebAppRole** doit exécuter toutes les procédures stockées actuelles et futures du schéma **Api**.
    - **DirectoryReaders** doit lire uniquement les colonnes EmployeeID, FullName et Email de **dbo.Employee**.
    - **SchemaDevelopers** dispose déjà d'ALTER sur les tables du schéma **Sales**. Ses membres doivent pouvoir créer dans ces tables des contraintes FOREIGN KEY qui référencent **dbo.Region**.

    La solution doit respecter le principe du moindre privilège. Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    GRANT [[p1]] ON SCHEMA::Api TO WebAppRole;

    GRANT SELECT ON [[obj]] TO DirectoryReaders;

    GRANT [[p3]] ON dbo.Region TO SchemaDevelopers;
  slots:
    - id: p1
      options:
        - { id: execute, text: EXECUTE }
        - { id: select, text: SELECT }
        - { id: control, text: CONTROL }
        - { id: alter, text: ALTER }
    - id: obj
      options:
        - { id: cols, text: "dbo.Employee (EmployeeID, FullName, Email)" }
        - { id: object, text: "OBJECT::dbo.Employee" }
        - { id: schema, text: "SCHEMA::dbo" }
        - { id: database, text: "DATABASE::HRDb" }
    - id: p3
      options:
        - { id: references, text: REFERENCES }
        - { id: alter, text: ALTER }
        - { id: select, text: SELECT }
        - { id: control, text: CONTROL }
answer:
  values: { p1: execute, obj: cols, p3: references }
explanation:
  correct:
    en: |
      EXECUTE on a schema covers every procedure in it, including future ones. SELECT can be granted on a list of columns, which limits DirectoryReaders to those three columns. Creating a FOREIGN KEY that references a table requires the REFERENCES permission on the referenced table, in addition to ALTER on the referencing table.
    fr: |
      EXECUTE sur un schéma couvre toutes ses procédures, y compris les futures. SELECT peut être accordée sur une liste de colonnes, ce qui limite DirectoryReaders à ces trois colonnes. Créer une FOREIGN KEY qui référence une table exige l'autorisation REFERENCES sur la table référencée, en plus d'ALTER sur la table qui référence.
  options:
    control: { en: "CONTROL grants every permission on the securable, which exceeds the requirement.", fr: "CONTROL accorde toutes les autorisations sur l'élément sécurisable, ce qui dépasse le besoin." }
    object: { en: "SELECT on the whole object exposes every column of dbo.Employee.", fr: "SELECT sur l'objet entier expose toutes les colonnes de dbo.Employee." }
    alter: { en: "ALTER on dbo.Region would let the role change or drop the referenced table.", fr: "ALTER sur dbo.Region permettrait au rôle de modifier ou de supprimer la table référencée." }
references:
  - title: GRANT object permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/grant-object-permissions-transact-sql
  - title: Permissions (Database Engine)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/permissions-database-engine
