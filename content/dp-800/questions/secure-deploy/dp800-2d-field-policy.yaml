id: dp800-2d-field-policy
objective: "2.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum exposes the dbo.Listings table through Data API builder (DAB) as an entity named Listing. The table contains the columns ListingID, Title, Price, InternalCost and OwnerId. OwnerId stores the Microsoft Entra object ID of the agent who owns the listing.

    The solution must meet the following requirements:

    - Anonymous users can read every column except InternalCost.
    - Authenticated agents can update only the listings they own.

    Which two settings should you add to the permissions of the Listing entity? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum expose la table dbo.Listings avec Data API builder (DAB) sous la forme d'une entité nommée Listing. La table contient les colonnes ListingID, Title, Price, InternalCost et OwnerId. OwnerId stocke l'ID d'objet Microsoft Entra de l'agent propriétaire de l'annonce.

    La solution doit respecter les exigences suivantes :

    - Les utilisateurs anonymes peuvent lire toutes les colonnes sauf InternalCost.
    - Les agents authentifiés ne peuvent mettre à jour que les annonces dont ils sont propriétaires.

    Quels sont les deux paramètres à ajouter aux autorisations de l'entité Listing ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On the create action of the authenticated role: \"policy\": { \"database\": \"@item.OwnerId eq @claims.oid\" }", fr: "Sur l'action create du rôle authenticated : \"policy\": { \"database\": \"@item.OwnerId eq @claims.oid\" }" } }
    - { id: b, text: { en: "On the read action of the anonymous role: \"fields\": { \"include\": [ \"*\" ], \"exclude\": [ \"InternalCost\" ] }", fr: "Sur l'action read du rôle anonymous : \"fields\": { \"include\": [ \"*\" ], \"exclude\": [ \"InternalCost\" ] }" } }
    - { id: c, text: { en: "On the update action of the authenticated role: \"policy\": { \"database\": \"@item.OwnerId eq @claims.oid\" }", fr: "Sur l'action update du rôle authenticated : \"policy\": { \"database\": \"@item.OwnerId eq @claims.oid\" }" } }
    - { id: d, text: { en: "On the entity: \"fields\": [ { \"name\": \"InternalCost\", \"alias\": \"cost\" } ]", fr: "Sur l'entité : \"fields\": [ { \"name\": \"InternalCost\", \"alias\": \"cost\" } ]" } }
    - { id: e, text: { en: "On the read action of the anonymous role: \"policy\": { \"database\": \"@item.InternalCost eq null\" }", fr: "Sur l'action read du rôle anonymous : \"policy\": { \"database\": \"@item.InternalCost eq null\" }" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      fields.include and fields.exclude restrict the columns of one action for one role, so the anonymous read action returns every column except InternalCost. A database policy adds a predicate to the query: on the update action, @item.OwnerId eq @claims.oid limits updates to the rows whose OwnerId equals the oid claim of the caller's token.
    fr: |
      fields.include et fields.exclude restreignent les colonnes d'une action pour un rôle : l'action read du rôle anonymous renvoie toutes les colonnes sauf InternalCost. Une stratégie de base de données ajoute un prédicat à la requête : sur l'action update, @item.OwnerId eq @claims.oid limite les mises à jour aux lignes dont OwnerId est égal à la revendication oid du jeton de l'appelant.
  options:
    a: { en: "Database policies are supported for read, update and delete, not for create, and the requirement is about updates.", fr: "Les stratégies de base de données sont prises en charge pour read, update et delete, pas pour create, et l'exigence porte sur les mises à jour." }
    d: { en: "An alias only renames the column in the API; anonymous users could still read it.", fr: "Un alias renomme seulement la colonne dans l'API ; les utilisateurs anonymes pourraient toujours la lire." }
    e: { en: "A database policy filters rows, not columns: it would hide the listings that have a cost instead of hiding the column.", fr: "Une stratégie de base de données filtre des lignes, pas des colonnes : elle masquerait les annonces qui ont un coût au lieu de masquer la colonne." }
references:
  - title: Configuration schema - Entities section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities
