id: dp800-2c-sc-statements
objective: "2.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin stores several SQL database projects in Git. Some are SDK-style projects maintained in Visual Studio Code, one was converted from the original format, and one belongs to a SQL database in Microsoft Fabric whose workspace is connected to Git.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin stocke plusieurs projets de base de données SQL dans Git. Certains sont des projets de style SDK gérés dans Visual Studio Code, l'un a été converti à partir du format d'origine et un autre appartient à une base de données SQL dans Microsoft Fabric dont l'espace de travail est connecté à Git.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When you convert an original project to SDK-style, you remove the Build Include items of the .sql files in the project folder but keep the PostDeploy item.
        fr: |
          Lorsque vous convertissez un projet d'origine au style SDK, vous supprimez les éléments Build Include des fichiers .sql du dossier du projet, mais vous conservez l'élément PostDeploy.
    - id: s2
      text:
        en: |
          A file that the post-deployment script includes with :r must stay in the build of the model, or its statements are not deployed.
        fr: |
          Un fichier que le script de post-déploiement inclut avec :r doit rester dans la génération du modèle, sinon ses instructions ne sont pas déployées.
    - id: s3
      text:
        en: |
          Build properties that you add manually to the SQL project file generated by Fabric are kept the next time you commit from the workspace.
        fr: |
          Les propriétés de génération que vous ajoutez manuellement au fichier de projet SQL généré par Fabric sont conservées lors de la prochaine validation depuis l'espace de travail.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The conversion removes the Build Include items because SDK-style projects include `**/*.sql` by default, but it keeps PreDeploy and PostDeploy items. Files referenced with :r must be removed from the build (Build Remove), and the build combines them into the post-deployment script, which is how they are deployed. Fabric generates and maintains the SQL project file and overwrites manual edits on the next commit.
    fr: |
      La conversion supprime les éléments Build Include, car les projets de style SDK incluent `**/*.sql` par défaut, mais elle conserve les éléments PreDeploy et PostDeploy. Les fichiers référencés avec :r doivent être retirés de la génération (Build Remove), et la génération les combine dans le script de post-déploiement, ce qui permet leur déploiement. Fabric génère et gère le fichier de projet SQL et écrase les modifications manuelles lors de la validation suivante.
references:
  - title: Convert an original SQL project
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/howto/convert-original-sql-project
  - title: SQL database source control integration in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/sql/source-control
