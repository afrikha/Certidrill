id: dp800-2a-rls-block-insert
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database used by a multitenant application. The security policy **Security.TenantPolicy** contains a filter predicate on **dbo.Orders** that compares the TenantID column with `SESSION_CONTEXT(N'TenantID')`.

    During testing, a user of tenant 12 inserts an order with TenantID 17. The insert succeeds, and the user can no longer see the row.

    You need to prevent users from inserting rows for another tenant. What should you add to the security policy?
  fr: |
    Vous disposez d'une base de données Azure SQL Database utilisée par une application multilocataire. La stratégie de sécurité **Security.TenantPolicy** contient un prédicat de filtre sur **dbo.Orders** qui compare la colonne TenantID à `SESSION_CONTEXT(N'TenantID')`.

    Pendant les tests, un utilisateur du locataire 12 insère une commande avec TenantID 17. L'insertion réussit, et l'utilisateur ne voit plus la ligne.

    Vous devez empêcher les utilisateurs d'insérer des lignes pour un autre locataire. Que devez-vous ajouter à la stratégie de sécurité ?
body:
  options:
    - id: a
      text: { en: "A block predicate on dbo.Orders for BEFORE UPDATE", fr: "Un prédicat de blocage sur dbo.Orders pour BEFORE UPDATE" }
    - id: b
      text: { en: "A second filter predicate on dbo.Orders", fr: "Un second prédicat de filtre sur dbo.Orders" }
    - id: c
      text: { en: "A block predicate on dbo.Orders for BEFORE DELETE", fr: "Un prédicat de blocage sur dbo.Orders pour BEFORE DELETE" }
    - id: d
      text: { en: "A block predicate on dbo.Orders for AFTER INSERT", fr: "Un prédicat de blocage sur dbo.Orders pour AFTER INSERT" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A filter predicate only filters the rows read by SELECT, UPDATE and DELETE, so an application can still insert rows that it will not see afterward. An AFTER INSERT block predicate evaluates the new row and raises an error when it violates the predicate, which stops inserts for another tenant.
    fr: |
      Un prédicat de filtre filtre seulement les lignes lues par SELECT, UPDATE et DELETE : une application peut donc toujours insérer des lignes qu'elle ne verra plus ensuite. Un prédicat de blocage AFTER INSERT évalue la nouvelle ligne et lève une erreur lorsqu'elle viole le prédicat, ce qui empêche les insertions pour un autre locataire.
  options:
    a: { en: "BEFORE UPDATE stops updates of rows that currently violate the predicate; it does not check inserts.", fr: "BEFORE UPDATE empêche la mise à jour des lignes qui violent actuellement le prédicat ; il ne vérifie pas les insertions." }
    b: { en: "Filter predicates never apply to inserts, and a table cannot have two predicates of the same type for the same operation.", fr: "Les prédicats de filtre ne s'appliquent jamais aux insertions, et une table ne peut pas avoir deux prédicats de même type pour la même opération." }
    c: { en: "BEFORE DELETE blocks deletes; it does not check inserts.", fr: "BEFORE DELETE bloque les suppressions ; il ne vérifie pas les insertions." }
references:
  - title: Row-level security
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
