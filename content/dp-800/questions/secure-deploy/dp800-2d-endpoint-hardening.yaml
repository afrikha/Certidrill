id: dp800-2d-endpoint-hardening
objective: "2.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin is reviewing the runtime section of its Data API builder (DAB) configuration before a security audit. The solution must meet the following requirements:

    - A REST request whose JSON body contains a property that isn't a field of the entity is rejected with 400 Bad Request.
    - GraphQL clients can't discover the schema of the API.
    - GraphQL queries nested deeper than four levels are rejected.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin examine la section runtime de sa configuration Data API builder (DAB) avant un audit de sécurité. La solution doit respecter les exigences suivantes :

    - Une requête REST dont le corps JSON contient une propriété qui n'est pas un champ de l'entité est rejetée avec 400 Bad Request.
    - Les clients GraphQL ne peuvent pas découvrir le schéma de l'API.
    - Les requêtes GraphQL imbriquées sur plus de quatre niveaux sont rejetées.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "runtime": {
      "rest": {
        "enabled": true,
        "path": "/api",
        "request-body-strict": [[strict]]
      },
      "graphql": {
        "enabled": true,
        "path": "/graphql",
        "allow-introspection": [[intro]],
        "depth-limit": [[depth]]
      }
    }
  slots:
    - id: strict
      options:
        - { id: strue, text: "true" }
        - { id: sfalse, text: "false" }
    - id: intro
      options:
        - { id: itrue, text: "true" }
        - { id: ifalse, text: "false" }
    - id: depth
      options:
        - { id: dnull, text: "null" }
        - { id: d3, text: "3" }
        - { id: d4, text: "4" }
answer:
  values: { strict: strue, intro: ifalse, depth: d4 }
explanation:
  correct:
    en: |
      With request-body-strict set to true, extra fields in a request body cause a BadRequest response; with false, they're ignored. allow-introspection (true by default) set to false hides the GraphQL schema from clients. depth-limit constrains the nesting depth of GraphQL queries: 4 allows four levels and rejects deeper queries, while null (the default) means no limit.
    fr: |
      Avec request-body-strict défini sur true, les champs supplémentaires d'un corps de requête provoquent une réponse BadRequest ; avec false, ils sont ignorés. allow-introspection (true par défaut) défini sur false masque le schéma GraphQL aux clients. depth-limit limite la profondeur d'imbrication des requêtes GraphQL : 4 autorise quatre niveaux et rejette les requêtes plus profondes, tandis que null (la valeur par défaut) signifie aucune limite.
  options:
    sfalse: { en: "With false, extra properties in the body are silently ignored.", fr: "Avec false, les propriétés supplémentaires du corps sont ignorées sans erreur." }
    itrue: { en: "true lets any client run introspection queries and read the schema.", fr: "true permet à tout client d'exécuter des requêtes d'introspection et de lire le schéma." }
    dnull: { en: "null means unlimited depth.", fr: "null signifie une profondeur illimitée." }
    d3: { en: "3 would also reject queries of exactly four levels, which must be allowed.", fr: "3 rejetterait aussi les requêtes d'exactement quatre niveaux, qui doivent être autorisées." }
references:
  - title: Configuration schema - Runtime section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
