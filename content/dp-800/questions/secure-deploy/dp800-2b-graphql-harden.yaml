id: dp800-2b-graphql-harden
objective: "2.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum is moving a Data API builder (DAB) deployment to production. The GraphQL endpoint is enabled at `/graphql`, and the runtime uses the `EntraId` authentication provider.

    A security review requires the following for the GraphQL endpoint:

    - Clients must not be able to retrieve the GraphQL schema from the endpoint.
    - Queries that nest relationships more than six levels deep must be rejected.

    Which two settings should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum met en production un déploiement de Data API builder (DAB). Le point de terminaison GraphQL est activé sur `/graphql`, et le runtime utilise le fournisseur d'authentification `EntraId`.

    Un audit de sécurité exige les éléments suivants pour le point de terminaison GraphQL :

    - Les clients ne doivent pas pouvoir récupérer le schéma GraphQL depuis le point de terminaison.
    - Les requêtes qui imbriquent des relations sur plus de six niveaux doivent être rejetées.

    Quels sont les deux paramètres à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |
          Set runtime.graphql.depth-limit to 6.
        fr: |
          Définir runtime.graphql.depth-limit sur 6.
    - id: b
      text:
        en: |
          Set runtime.rest.request-body-strict to true.
        fr: |
          Définir runtime.rest.request-body-strict sur true.
    - id: c
      text:
        en: |
          Set runtime.graphql.path to a path that isn't published to clients.
        fr: |
          Définir runtime.graphql.path sur un chemin qui n'est pas communiqué aux clients.
    - id: d
      text:
        en: |
          Set runtime.graphql.allow-introspection to false.
        fr: |
          Définir runtime.graphql.allow-introspection sur false.
    - id: e
      text:
        en: |
          Set runtime.host.cors.allow-credentials to false.
        fr: |
          Définir runtime.host.cors.allow-credentials sur false.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      allow-introspection is true by default; setting it to false hides the schema from introspection queries. depth-limit is unlimited (null) by default; a value of 6 makes DAB reject queries nested deeper than six levels, which limits expensive relationship traversals.
    fr: |
      allow-introspection a la valeur true par défaut ; la définir sur false masque le schéma aux requêtes d'introspection. depth-limit est illimité (null) par défaut ; la valeur 6 fait rejeter par DAB les requêtes imbriquées sur plus de six niveaux, ce qui limite les parcours de relations coûteux.
  options:
    b: { en: "request-body-strict applies to REST request bodies (extra fields cause BadRequest), not to GraphQL schema or depth.", fr: "request-body-strict s'applique aux corps des requêtes REST (les champs supplémentaires provoquent BadRequest), pas au schéma ni à la profondeur GraphQL." }
    c: { en: "An unpublished path is obscurity, not a control: anyone who finds it can still introspect the schema.", fr: "Un chemin non communiqué relève de l'obscurité, pas d'un contrôle : quiconque le trouve peut toujours introspecter le schéma." }
    e: { en: "allow-credentials controls the CORS Access-Control-Allow-Credentials header, and false is already the default.", fr: "allow-credentials contrôle l'en-tête CORS Access-Control-Allow-Credentials, et false est déjà la valeur par défaut." }
references:
  - title: Runtime
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
