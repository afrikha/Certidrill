id: dp800-sr1-report-procs-3
objective: "2.1.4"
type: series_yesno
series: dp800-sr1-report-procs
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You grant the database-level EXECUTE permission to ReportUsers.
  fr: Vous accordez l'autorisation EXECUTE au niveau de la base de données à ReportUsers.
body:
  solution:
    en: |
      In FinanceDb, you run the following statement:

      ```sql
      GRANT EXECUTE TO ReportUsers;
      ```
    fr: |
      Dans FinanceDb, vous exécutez l'instruction suivante :

      ```sql
      GRANT EXECUTE TO ReportUsers;
      ```
answer: { value: false }
explanation:
  correct:
    en: Without an ON clause, EXECUTE is granted on the database, and the database-level permission implies EXECUTE on every schema. ReportUsers could then run the Admin maintenance procedures, which violates the requirements and least privilege. Grant EXECUTE on the Reports schema only.
    fr: "Sans clause ON, EXECUTE est accordée sur la base de données, et l'autorisation au niveau de la base de données implique EXECUTE sur tous les schémas. ReportUsers pourrait alors exécuter les procédures de maintenance Admin, ce qui enfreint les exigences et le moindre privilège. Accordez EXECUTE sur le schéma Reports uniquement."
references:
  - title: GRANT Schema Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/grant-schema-permissions-transact-sql
