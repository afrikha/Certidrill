id: dp800-2b-qpi-portal
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a database in Azure SQL Database with Query Store enabled. A product owner has the Reader role on the database in Azure. She has no database user and no client tools installed.

    She needs to see, from the Azure portal, a chart of the five queries that consumed the most CPU during the past week. She doesn't need to read the query text.

    What should she use?
  fr: |
    Contoso dispose d'une base de données dans Azure SQL Database dont le Magasin des requêtes est activé. Une responsable produit possède le rôle Reader sur la base dans Azure. Elle n'a pas d'utilisateur de base de données et aucun outil client installé.

    Elle doit voir, depuis le portail Azure, un graphique des cinq requêtes qui ont consommé le plus de processeur au cours de la semaine passée. Elle n'a pas besoin de lire le texte des requêtes.

    Que doit-elle utiliser ?
body:
  options:
    - id: a
      text:
        en: |
          The Top Resource Consuming Queries report of Query Store in SQL Server Management Studio
        fr: |
          Le rapport Top Resource Consuming Queries du Magasin des requêtes dans SQL Server Management Studio
    - id: b
      text:
        en: |
          Query Performance Insight
        fr: |
          Query Performance Insight
    - id: c
      text:
        en: |
          A query on sys.dm_exec_query_stats in the query editor of the Azure portal
        fr: |
          Une requête sur sys.dm_exec_query_stats dans l'éditeur de requête du portail Azure
    - id: d
      text:
        en: |
          The CPU percentage metric chart in the Metrics page of the database
        fr: |
          Le graphique de la métrique CPU percentage dans la page Metrics de la base
answer: { optionId: b }
explanation:
  correct:
    en: |
      Query Performance Insight, under Intelligent Performance in the Azure portal, charts Query Store data and opens on the top five CPU-consuming queries; the Custom tab sets a period of 24 hours, a week or a month. The Reader role is enough to view the top queries and charts, while viewing query text requires a role such as Contributor.
    fr: |
      Query Performance Insight, sous Intelligent Performance dans le portail Azure, présente sous forme de graphiques les données du Magasin des requêtes et s'ouvre sur les cinq requêtes les plus consommatrices de processeur ; l'onglet Custom permet de choisir une période de 24 heures, d'une semaine ou d'un mois. Le rôle Reader suffit pour voir les principales requêtes et les graphiques, tandis que l'affichage du texte des requêtes exige un rôle tel que Contributor.
  options:
    a:
      en: |
        The SSMS report needs a client tool and a database user, which she doesn't have.
      fr: |
        Le rapport SSMS exige un outil client et un utilisateur de base de données, dont elle ne dispose pas.
    c:
      en: |
        Querying a DMV requires a database user; the plan cache also loses history when plans are evicted.
      fr: |
        L'interrogation d'une DMV exige un utilisateur de base de données ; le cache de plans perd aussi l'historique lorsque des plans en sont évincés.
    d:
      en: |
        The metric shows CPU use of the whole database, not which queries consumed it.
      fr: |
        La métrique montre l'utilisation du processeur de toute la base, pas les requêtes qui l'ont consommé.
references:
  - title: Query Performance Insight for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/query-performance-insight-use
