id: dp800-2b-rcsi-optimized-yesno
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a database in Azure SQL Database that uses the default database options, including read committed snapshot isolation (RCSI) and optimized locking. Sessions use the default READ COMMITTED isolation level and no table hints.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une base de données dans Azure SQL Database qui utilise les options de base de données par défaut, notamment l'isolation read committed snapshot (RCSI) et le verrouillage optimisé. Les sessions utilisent le niveau d'isolation READ COMMITTED par défaut et aucun indicateur de table.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A SELECT that reads a row modified by another session's open transaction waits until that transaction commits.
        fr: |
          Une instruction SELECT qui lit une ligne modifiée par la transaction ouverte d'une autre session attend la validation de cette transaction.
    - id: s2
      text:
        en: |
          A transaction that updates 10,000 rows holds one lock on its transaction ID until it commits, instead of holding 10,000 row locks until commit.
        fr: |
          Une transaction qui met à jour 10 000 lignes conserve un seul verrou sur son ID de transaction jusqu'à sa validation, au lieu de conserver 10 000 verrous de ligne jusqu'à la validation.
    - id: s3
      text:
        en: |
          Two transactions that update the same row at the same time both proceed without waiting for each other.
        fr: |
          Deux transactions qui mettent à jour la même ligne au même moment progressent toutes deux sans s'attendre.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      With RCSI, readers get the last committed version of the row from the version store and don't wait for writers. Optimized locking uses transaction ID (TID) locking, so a modifying transaction keeps one exclusive lock on its TID and releases row locks as each row is updated, which makes lock escalation much less likely. Writers that modify the same row still conflict, so the second update waits for the first transaction to finish.
    fr: |
      Avec RCSI, les lecteurs obtiennent la dernière version validée de la ligne dans le magasin de versions et n'attendent pas les rédacteurs. Le verrouillage optimisé utilise le verrouillage par ID de transaction (TID) : une transaction de modification conserve un seul verrou exclusif sur son TID et libère les verrous de ligne au fur et à mesure des mises à jour, ce qui rend l'escalade de verrous beaucoup moins probable. Les rédacteurs qui modifient la même ligne restent en conflit : la seconde mise à jour attend la fin de la première transaction.
references:
  - title: Optimized locking
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/optimized-locking
