id: dp800-cs4a-learner-masking
objective: "2.1.2"
type: multi
caseStudy: dp800-cs4a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to configure dbo.Learners to meet the security requirements for sg-support and sg-billing. The solution must not change the stored data or the applications.

    Which two statements should you run? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer dbo.Learners pour satisfaire les exigences de sécurité concernant sg-support et sg-billing. La solution ne doit modifier ni les données stockées ni les applications.

    Quelles sont les deux instructions à exécuter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: "`ALTER TABLE dbo.Learners ALTER COLUMN Phone ADD MASKED WITH (FUNCTION = 'default()');`"
    - id: b
      text: "`ALTER TABLE dbo.Learners ALTER COLUMN Phone ADD MASKED WITH (FUNCTION = 'partial(0,\"XXX-XXX-\",4)');`"
    - id: c
      text: "`GRANT UNMASK ON dbo.Learners TO [sg-billing];`"
    - id: d
      text: "`GRANT UNMASK ON dbo.Learners (Email) TO [sg-billing];`"
    - id: e
      text: "`ALTER TABLE dbo.Learners ALTER COLUMN Email DROP MASKED;`"
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Dynamic Data Masking changes only query results: the partial function keeps the number of trailing characters you set (here 4) and replaces the rest with the padding string, so support agents see only the last four digits. UNMASK can be granted at the column level in Azure SQL Database, so sg-billing sees the real Email values while every other masked column, including Phone and any column masked later in the table, stays masked.
    fr: |
      Le masquage dynamique des données ne modifie que les résultats des requêtes : la fonction partial conserve le nombre de caractères finaux choisi (ici 4) et remplace le reste par la chaîne de remplissage, si bien que les agents du support ne voient que les quatre derniers chiffres. Dans Azure SQL Database, UNMASK peut être accordée au niveau de la colonne : sg-billing voit les vraies valeurs d'Email tandis que toutes les autres colonnes masquées, y compris Phone et toute colonne masquée plus tard dans la table, restent masquées.
  options:
    a: { en: "The default() function replaces the whole string with xxxx, so agents don't see the last four digits.", fr: "La fonction default() remplace toute la chaîne par xxxx : les agents ne voient pas les quatre derniers chiffres." }
    c: { en: "A table-level UNMASK also reveals Phone and every column masked later in dbo.Learners to sg-billing.", fr: "Une autorisation UNMASK au niveau de la table révèle aussi à sg-billing Phone et toute colonne masquée plus tard dans dbo.Learners." }
    e: { en: "Dropping the mask reveals the email addresses to every user, including sg-support.", fr: "La suppression du masque révèle les adresses e-mail à tous les utilisateurs, y compris sg-support." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview
