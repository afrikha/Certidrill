id: dp800-2c-ctl-gh-self-review
objective: "2.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam deploys a SQL database project with a GitHub Actions workflow. The deploy job references the environment **production**, whose only protection rule is the required reviewer team **db-leads**. The branches **main** and **release/*** are protected by branch protection rules.

    An audit finds two issues:

    - A member of db-leads started a deployment and approved it himself.
    - A workflow run from a release branch deployed to production.

    You need to ensure that the person who triggers a production deployment can't approve it, and that only main can deploy to production.

    What should you configure on the production environment?
  fr: |
    Fabrikam déploie un projet de base de données SQL avec un workflow GitHub Actions. Le travail de déploiement référence l'environnement **production**, dont la seule règle de protection est l'équipe de réviseurs requis **db-leads**. Les branches **main** et **release/*** sont protégées par des règles de protection de branche.

    Un audit relève deux problèmes :

    - Un membre de db-leads a lancé un déploiement et l'a approuvé lui-même.
    - Une exécution de workflow issue d'une branche release a déployé en production.

    Vous devez faire en sorte que la personne qui déclenche un déploiement en production ne puisse pas l'approuver, et que seule main puisse déployer en production.

    Que devez-vous configurer sur l'environnement production ?
body:
  options:
    - { id: a, text: { en: "Add a second required reviewer team, and set deployment branches to Selected branches and tags with main.", fr: "Ajouter une deuxième équipe de réviseurs requis, et définir les branches de déploiement sur Selected branches and tags avec main." } }
    - { id: b, text: { en: "Add a wait timer of 30 minutes, and set deployment branches to Protected branches only.", fr: "Ajouter un minuteur d'attente de 30 minutes, et définir les branches de déploiement sur Protected branches only." } }
    - { id: c, text: { en: "Enable Prevent self-review, and set deployment branches to Protected branches only.", fr: "Activer Prevent self-review, et définir les branches de déploiement sur Protected branches only." } }
    - { id: d, text: { en: "Enable Prevent self-review, and set deployment branches to Selected branches and tags with main.", fr: "Activer Prevent self-review, et définir les branches de déploiement sur Selected branches and tags avec main." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Prevent self-review stops users from approving the workflow runs that they triggered, so another db-leads member must approve. A deployment branch rule with Selected branches and tags limited to main rejects jobs from any other branch, including protected release branches.
    fr: |
      Prevent self-review empêche les utilisateurs d'approuver les exécutions de workflow qu'ils ont déclenchées : un autre membre de db-leads doit approuver. Une règle de branches de déploiement Selected branches and tags limitée à main refuse les travaux de toute autre branche, y compris les branches release protégées.
  options:
    a:
      en: |
        Only one of the required reviewers needs to approve, and the person who started the run can still be that reviewer.
      fr: |
        Un seul des réviseurs requis doit approuver, et la personne qui a lancé l'exécution peut encore être ce réviseur.
    c:
      en: |
        Protected branches only allows every protected branch, so release branches could still deploy.
      fr: |
        Protected branches only autorise toutes les branches protégées : les branches release pourraient toujours déployer.
    b:
      en: |
        A wait timer only delays the job, and release branches are protected, so neither issue is fixed.
      fr: |
        Un minuteur d'attente ne fait que retarder le travail, et les branches release sont protégées : aucun des deux problèmes n'est résolu.
references:
  - title: Implement CI/CD pipelines
    url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/06-implement-cicd-pipelines
