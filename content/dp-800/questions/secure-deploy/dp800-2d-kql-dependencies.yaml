id: dp800-2d-kql-dependencies
objective: "2.4.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso sends the telemetry of its Data API builder (DAB) API to Application Insights.

    You need a query that returns, for the last 24 hours, the 10 SQL statements sent by DAB that have the highest average duration.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso envoie la télémétrie de son API Data API builder (DAB) à Application Insights.

    Vous avez besoin d'une requête qui renvoie, pour les dernières 24 heures, les 10 instructions SQL envoyées par DAB qui ont la durée moyenne la plus élevée.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where timestamp > ago(24h) and [[filter]]
    | summarize calls = count(), avgDuration = avg(duration) by data
    | [[top]]
  slots:
    - id: table
      options:
        - { id: requests, text: requests }
        - { id: dependencies, text: dependencies }
        - { id: traces, text: traces }
        - { id: exceptions, text: exceptions }
    - id: filter
      options:
        - { id: sql, text: "type == \"SQL\"" }
        - { id: graphql, text: "name contains \"/graphql\"" }
        - { id: failed, text: "success == false" }
    - id: top
      options:
        - { id: take, text: take 10 }
        - { id: topCalls, text: top 10 by calls desc }
        - { id: topAvg, text: top 10 by avgDuration desc }
answer:
  values: { table: dependencies, filter: sql, top: topAvg }
explanation:
  correct:
    en: |
      DAB records each database call as a dependency, and the type column of the dependencies table is SQL for Azure SQL calls; the data column holds the statement. After summarize computes the average duration per statement, top 10 by avgDuration desc keeps the 10 slowest on average.
    fr: |
      DAB enregistre chaque appel à la base de données comme une dépendance, et la colonne type de la table dependencies vaut SQL pour les appels Azure SQL ; la colonne data contient l'instruction. Après le calcul de la durée moyenne par instruction avec summarize, top 10 by avgDuration desc conserve les 10 instructions les plus lentes en moyenne.
  options:
    requests: { en: "requests holds the incoming REST and GraphQL calls, not the SQL statements.", fr: "requests contient les appels REST et GraphQL entrants, pas les instructions SQL." }
    traces: { en: "traces holds log messages, not timed database calls.", fr: "traces contient des messages de journal, pas des appels de base de données chronométrés." }
    exceptions: { en: "exceptions holds errors, not every SQL call.", fr: "exceptions contient les erreurs, pas chaque appel SQL." }
    graphql: { en: "This filter selects GraphQL requests by name, not SQL dependencies.", fr: "Ce filtre sélectionne les requêtes GraphQL par nom, pas les dépendances SQL." }
    failed: { en: "The query must cover all SQL statements, not only the failed ones.", fr: "La requête doit couvrir toutes les instructions SQL, pas seulement celles en échec." }
    take: { en: "take returns 10 arbitrary rows, not the slowest ones.", fr: "take renvoie 10 lignes quelconques, pas les plus lentes." }
    topCalls: { en: "This sorts by the number of calls instead of the average duration.", fr: "Ce tri porte sur le nombre d'appels au lieu de la durée moyenne." }
references:
  - title: Use Azure Application Insights in Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/monitor/application-insights
