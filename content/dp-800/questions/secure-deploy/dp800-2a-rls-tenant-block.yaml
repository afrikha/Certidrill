id: dp800-2a-rls-tenant-block
objective: "2.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL Database. The security policy **Security.TenantPolicy** contains a filter predicate on **dbo.Invoice** that uses the function **Security.fn_TenantPredicate(TenantID)**.

    You need to add block predicates that meet the following requirements:

    - Users must not insert an invoice for another tenant.
    - Users must not change the TenantID of one of their invoices to the ID of another tenant.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database. La stratégie de sécurité **Security.TenantPolicy** contient un prédicat de filtre sur **dbo.Invoice** qui utilise la fonction **Security.fn_TenantPredicate(TenantID)**.

    Vous devez ajouter des prédicats de blocage qui satisfont les exigences suivantes :

    - Les utilisateurs ne doivent pas insérer de facture pour un autre locataire.
    - Les utilisateurs ne doivent pas remplacer le TenantID de l'une de leurs factures par l'ID d'un autre locataire.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template:
    en: |
      ALTER SECURITY POLICY Security.TenantPolicy
          -- no invoice inserted for another tenant
          ADD BLOCK PREDICATE Security.fn_TenantPredicate(TenantID)
              ON dbo.Invoice [[op1]],
          -- no invoice moved to another tenant
          ADD BLOCK PREDICATE Security.fn_TenantPredicate(TenantID)
              ON dbo.Invoice [[op2]];
    fr: |
      ALTER SECURITY POLICY Security.TenantPolicy
          -- aucune facture insérée pour un autre locataire
          ADD BLOCK PREDICATE Security.fn_TenantPredicate(TenantID)
              ON dbo.Invoice [[op1]],
          -- aucune facture déplacée vers un autre locataire
          ADD BLOCK PREDICATE Security.fn_TenantPredicate(TenantID)
              ON dbo.Invoice [[op2]];
  slots:
    - id: op1
      options:
        - { id: ai, text: AFTER INSERT }
        - { id: au, text: AFTER UPDATE }
        - { id: bu, text: BEFORE UPDATE }
        - { id: bd, text: BEFORE DELETE }
    - id: op2
      options:
        - { id: ai, text: AFTER INSERT }
        - { id: au, text: AFTER UPDATE }
        - { id: bu, text: BEFORE UPDATE }
        - { id: bd, text: BEFORE DELETE }
answer:
  values: { op1: ai, op2: au }
explanation:
  correct:
    en: |
      AFTER INSERT and AFTER UPDATE block predicates evaluate the new values of the row and raise an error when they violate the predicate. AFTER INSERT stops inserts for another tenant, and AFTER UPDATE stops an update that would give the row the TenantID of another tenant.
    fr: |
      Les prédicats de blocage AFTER INSERT et AFTER UPDATE évaluent les nouvelles valeurs de la ligne et lèvent une erreur lorsqu'elles violent le prédicat. AFTER INSERT empêche les insertions pour un autre locataire, et AFTER UPDATE empêche une mise à jour qui donnerait à la ligne le TenantID d'un autre locataire.
  options:
    bu: { en: "BEFORE UPDATE checks the current values of the row; the user's own invoice passes it, and the new TenantID is not checked.", fr: "BEFORE UPDATE vérifie les valeurs actuelles de la ligne ; la facture de l'utilisateur le passe, et le nouveau TenantID n'est pas vérifié." }
    bd: { en: "BEFORE DELETE only blocks deletes.", fr: "BEFORE DELETE bloque seulement les suppressions." }
references:
  - title: Row-level security
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
