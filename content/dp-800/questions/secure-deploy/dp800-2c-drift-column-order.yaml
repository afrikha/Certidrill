id: dp800-2c-drift-column-order
objective: "2.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove deploys an SDK-style SQL database project named **PaymentsDb**. In the project, dbo.Payment defines the columns PaymentID, Amount, Currency and CreatedAt, in that order. In production, a DBA re-created the large table with the same columns in the order PaymentID, Amount, CreatedAt, Currency.

    The deploy report for the next release shows a TableDataMotion operation for dbo.Payment, although the release does not change the table. The team accepts the column order used in production.

    You need to prevent deployments from rebuilding the table only because of its column order. The solution must not change the project files and must keep blocking deployments that could lose data.

    What should you do?
  fr: |
    Woodgrove déploie un projet de base de données SQL de style SDK nommé **PaymentsDb**. Dans le projet, dbo.Payment définit les colonnes PaymentID, Amount, Currency et CreatedAt, dans cet ordre. En production, un DBA a recréé cette grande table avec les mêmes colonnes dans l'ordre PaymentID, Amount, CreatedAt, Currency.

    Le rapport de déploiement de la prochaine version indique une opération TableDataMotion pour dbo.Payment, alors que la version ne modifie pas la table. L'équipe accepte l'ordre des colonnes utilisé en production.

    Vous devez empêcher les déploiements de reconstruire la table uniquement à cause de l'ordre de ses colonnes. La solution ne doit pas modifier les fichiers du projet et doit continuer à bloquer les déploiements susceptibles de perdre des données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add /p:BlockOnPossibleDataLoss=false to the publish command.", fr: "Ajouter /p:BlockOnPossibleDataLoss=false à la commande de publication." } }
    - { id: b, text: { en: "Add /p:DropObjectsNotInSource=true to the publish command.", fr: "Ajouter /p:DropObjectsNotInSource=true à la commande de publication." } }
    - { id: c, text: { en: "Add /p:GenerateSmartDefaults=true to the publish command.", fr: "Ajouter /p:GenerateSmartDefaults=true à la commande de publication." } }
    - { id: d, text: { en: "Add /p:IgnoreColumnOrder=true to the publish command.", fr: "Ajouter /p:IgnoreColumnOrder=true à la commande de publication." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, a publish updates differences in table column order, which requires rebuilding the table with a data motion. IgnoreColumnOrder=true tells SqlPackage to ignore those differences, so the table is left as is, while BlockOnPossibleDataLoss keeps its default of True.
    fr: |
      Par défaut, une publication met à jour les différences d'ordre des colonnes, ce qui impose de reconstruire la table avec un déplacement de données. IgnoreColumnOrder=true indique à SqlPackage d'ignorer ces différences : la table reste en l'état, tandis que BlockOnPossibleDataLoss conserve sa valeur par défaut True.
  options:
    a:
      en: |
        This removes the data loss protection that the solution must keep, and the table would still be rebuilt.
      fr: |
        Cela supprime la protection contre la perte de données que la solution doit conserver, et la table serait toujours reconstruite.
    c:
      en: |
        GenerateSmartDefaults supplies default values when a NOT NULL column is added to a table with data; it does not affect column order.
      fr: |
        GenerateSmartDefaults fournit des valeurs par défaut lors de l'ajout d'une colonne NOT NULL à une table contenant des données ; il n'a aucun effet sur l'ordre des colonnes.
    b:
      en: |
        DropObjectsNotInSource drops target objects that are not in the project; the column order would still be updated.
      fr: |
        DropObjectsNotInSource supprime les objets de la cible absents du projet ; l'ordre des colonnes serait toujours mis à jour.
references:
