id: dp800-2b-snapshot-report
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a database in Azure SQL Database that uses the default database options. A stored procedure named `dbo.DailyReconciliation` runs four `SELECT` statements on the `Orders`, `OrderLines` and `Payments` tables inside one transaction. Orders are inserted and updated continuously while the procedure runs.

    The totals returned by the four statements must reconcile: every statement must see the data as it existed at the same point in time. The procedure must not block the sessions that write orders, and it must not be blocked by them.

    Which isolation level should the procedure use?
  fr: |
    Contoso dispose d'une base de données dans Azure SQL Database qui utilise les options de base de données par défaut. Une procédure stockée nommée `dbo.DailyReconciliation` exécute quatre instructions `SELECT` sur les tables `Orders`, `OrderLines` et `Payments` dans une seule transaction. Des commandes sont insérées et mises à jour en continu pendant l'exécution de la procédure.

    Les totaux renvoyés par les quatre instructions doivent concorder : chaque instruction doit voir les données telles qu'elles existaient au même instant. La procédure ne doit pas bloquer les sessions qui écrivent des commandes, et elle ne doit pas être bloquée par elles.

    Quel niveau d'isolation la procédure doit-elle utiliser ?
body:
  options:
    - id: a
      text:
        en: |
          READ COMMITTED, with the database default READ_COMMITTED_SNAPSHOT setting
        fr: |
          READ COMMITTED, avec le paramètre READ_COMMITTED_SNAPSHOT par défaut de la base
    - id: b
      text: SERIALIZABLE
    - id: c
      text: SNAPSHOT
    - id: d
      text: REPEATABLE READ
answer: { optionId: c }
explanation:
  correct:
    en: |
      Under SNAPSHOT isolation, every statement of the transaction reads the committed version of the data that existed when the transaction started, so the four totals describe the same point in time. Readers use row versions instead of shared locks, so they neither block writers nor wait for them. Snapshot isolation is enabled by default in Azure SQL Database, but the procedure must request it with SET TRANSACTION ISOLATION LEVEL SNAPSHOT.
    fr: |
      Avec l'isolation SNAPSHOT, chaque instruction de la transaction lit la version validée des données qui existait au début de la transaction : les quatre totaux décrivent donc le même instant. Les lecteurs utilisent des versions de lignes au lieu de verrous partagés : ils ne bloquent pas les rédacteurs et ne les attendent pas. L'isolation d'instantané est activée par défaut dans Azure SQL Database, mais la procédure doit la demander avec SET TRANSACTION ISOLATION LEVEL SNAPSHOT.
  options:
    a:
      en: |
        RCSI gives each statement its own snapshot taken when the statement starts, so orders committed between two statements make the totals disagree.
      fr: |
        RCSI donne à chaque instruction son propre instantané pris au début de l'instruction : des commandes validées entre deux instructions rendent les totaux discordants.
    b:
      en: |
        SERIALIZABLE gives consistent results by holding range locks until the end of the transaction, which blocks the sessions that insert orders.
      fr: |
        SERIALIZABLE donne des résultats cohérents en conservant des verrous de plage jusqu'à la fin de la transaction, ce qui bloque les sessions qui insèrent des commandes.
    d:
      en: |
        REPEATABLE READ holds shared locks on rows read until the end of the transaction, which blocks writers, and still allows phantom rows.
      fr: |
        REPEATABLE READ conserve des verrous partagés sur les lignes lues jusqu'à la fin de la transaction, ce qui bloque les rédacteurs, et autorise toujours les lignes fantômes.
references:
  - title: SET TRANSACTION ISOLATION LEVEL (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-transaction-isolation-level-transact-sql
  - title: Understand and resolve blocking problems
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking
