id: dp800-cs2c-mcp-endpoint
objective: "2.1.8"
type: multi
caseStudy: dp800-cs2c-fabrikam-residences
difficulty: 3
status: draft
stem:
  en: |
    You need to update the configuration of dab-agent. The solution must meet the leasing assistant requirements.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez mettre à jour la configuration de dab-agent. La solution doit satisfaire les exigences de l'assistant de location.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: Set runtime.host.authentication.provider to EntraId, and set jwt.audience and jwt.issuer for dab-agent-api.
        fr: Définir runtime.host.authentication.provider sur EntraId, et définir jwt.audience et jwt.issuer pour dab-agent-api.
    - id: b
      text:
        en: Replace the permission of the Listings entity with the role authenticated and the actions ["read"].
        fr: Remplacer l'autorisation de l'entité Listings par le rôle authenticated et les actions ["read"].
    - id: c
      text:
        en: Add "mcp" with "dml-tools" set to false to the Tenants entity.
        fr: Ajouter "mcp" avec "dml-tools" défini sur false à l'entité Tenants.
    - id: d
      text:
        en: Set runtime.mcp.dml-tools to false.
        fr: Définir runtime.mcp.dml-tools sur false.
    - id: e
      text:
        en: Set runtime.graphql.allow-introspection to false.
        fr: Définir runtime.graphql.allow-introspection sur false.
    - id: f
      text:
        en: Change runtime.mcp.path from /mcp to a path that is known only by the agent.
        fr: Remplacer runtime.mcp.path /mcp par un chemin connu uniquement de l'agent.
answer: { optionIds: [a, b, c] }
explanation:
  correct:
    en: |
      With the EntraId provider, DAB validates the JWT against the audience and issuer of dab-agent-api. Requests without a token still run as anonymous, so the anonymous permission of Listings must be removed; authenticated with read only lets the agent read listings and blocks create, update and delete for every caller, because MCP tools enforce entity permissions. Setting dml-tools to false on Tenants hides the entity from the MCP tools, while its REST permission for the nightly job is unchanged.
    fr: |
      Avec le fournisseur EntraId, DAB valide le JWT par rapport à l'audience et à l'émetteur de dab-agent-api. Les requêtes sans jeton s'exécutent toujours comme anonymous : l'autorisation anonymous de Listings doit donc être supprimée ; authenticated avec read seul permet à l'agent de lire les annonces et bloque la création, la mise à jour et la suppression pour tous les appelants, car les outils MCP appliquent les autorisations des entités. La définition de dml-tools sur false pour Tenants masque l'entité aux outils MCP, tandis que son autorisation REST pour le travail nocturne reste inchangée.
  options:
    d: { en: "Disabling all DML tools at the runtime level would also remove read_records, so the agent could no longer read listings.", fr: "La désactivation de tous les outils DML au niveau du runtime supprimerait aussi read_records : l'agent ne pourrait plus lire les annonces." }
    e: { en: "GraphQL introspection does not control authentication or the MCP tools.", fr: "L'introspection GraphQL ne contrôle ni l'authentification ni les outils MCP." }
    f: { en: "An unpublished path is not authentication; any caller who learns it would still be treated as anonymous.", fr: "Un chemin non publié n'est pas une authentification : tout appelant qui le découvre serait toujours traité comme anonymous." }
references:
  - title: Configure authentication for SQL MCP Server
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/how-to-configure-authentication
  - title: Data manipulation language (DML) tools in SQL MCP Server
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/data-manipulation-language-tools
