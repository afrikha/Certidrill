id: dp800-2a-ddm-add-masks
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database that contains a table named **dbo.Member**. The table has no masked columns.

    You need to add dynamic data masks that meet the following requirements for users who don't have `UNMASK`:

    - **Email**: show the first letter of the address followed by a constant suffix in the form `aXXX@XXXX.com`.
    - **BirthDate** (`date`): hide the year of birth; the month and the day stay visible.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database qui contient une table nommée **dbo.Member**. La table n'a aucune colonne masquée.

    Vous devez ajouter des masques dynamiques qui satisfont les exigences suivantes pour les utilisateurs qui n'ont pas `UNMASK` :

    - **Email** : afficher la première lettre de l'adresse suivie d'un suffixe constant de la forme `aXXX@XXXX.com`.
    - **BirthDate** (`date`) : masquer l'année de naissance ; le mois et le jour restent visibles.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE dbo.Member
        ALTER COLUMN Email [[kw]] WITH (FUNCTION = '[[f1]]');

    ALTER TABLE dbo.Member
        ALTER COLUMN BirthDate ADD MASKED WITH (FUNCTION = '[[f2]]');
  slots:
    - id: kw
      options:
        - { id: addmasked, text: ADD MASKED }
        - { id: masked, text: MASKED }
        - { id: addmask, text: ADD MASK }
        - { id: setmasked, text: SET MASKED }
    - id: f1
      options:
        - { id: email, text: "email()" }
        - { id: default, text: "default()" }
        - { id: random, text: "random(1, 100)" }
        - { id: partial, text: 'partial(0,"XXXX",4)' }
    - id: f2
      options:
        - { id: dty, text: 'datetime("Y")' }
        - { id: dtd, text: 'datetime("D")' }
        - { id: default, text: "default()" }
        - { id: random, text: "random(1, 12)" }
answer:
  values: { kw: addmasked, f1: email, f2: dty }
explanation:
  correct:
    en: |
      A mask is added to an existing column with ALTER COLUMN ... ADD MASKED WITH (FUNCTION = '...'). The email() function exposes the first letter and returns the constant form aXXX@XXXX.com. The datetime() function masks one part of a date or time value; datetime("Y") hides the year and keeps the other parts.
    fr: |
      Un masque s'ajoute à une colonne existante avec ALTER COLUMN ... ADD MASKED WITH (FUNCTION = '...'). La fonction email() expose la première lettre et renvoie la forme constante aXXX@XXXX.com. La fonction datetime() masque une partie d'une valeur de date ou d'heure ; datetime("Y") masque l'année et conserve les autres parties.
  options:
    masked: { en: "MASKED WITH without ADD is the form that replaces a mask, and it requires the data type of the column.", fr: "MASKED WITH sans ADD est la forme qui remplace un masque, et elle exige le type de données de la colonne." }
    default: { en: "default() returns xxxx for strings and 1900-01-01 for dates, which hides the whole value.", fr: "default() renvoie xxxx pour les chaînes et 1900-01-01 pour les dates, ce qui masque toute la valeur." }
    dtd: { en: "datetime(\"D\") masks the day, not the year.", fr: "datetime(\"D\") masque le jour, pas l'année." }
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview
