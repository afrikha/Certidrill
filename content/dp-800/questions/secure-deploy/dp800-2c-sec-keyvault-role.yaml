id: dp800-2c-sec-keyvault-role
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind deploys an SDK-style SQL database project with Azure Pipelines. The connection string of the target database is a secret in an Azure key vault named **kv-nw-prod** that uses the Azure role-based access control permission model and a public endpoint.

    You create a variable group linked to kv-nw-prod by using an Azure Resource Manager service connection named **sc-nw-prod**. The pipeline must read the current value of the secret at run time.

    You need to grant sc-nw-prod access to the secret. The solution must follow the principle of least privilege.

    Which role should you assign to the identity of sc-nw-prod on kv-nw-prod?
  fr: |
    Northwind déploie un projet de base de données SQL de style SDK avec Azure Pipelines. La chaîne de connexion de la base de données cible est un secret d'un coffre de clés Azure nommé **kv-nw-prod**, qui utilise le modèle d'autorisation de contrôle d'accès en fonction du rôle Azure et un point de terminaison public.

    Vous créez un groupe de variables lié à kv-nw-prod au moyen d'une connexion de service Azure Resource Manager nommée **sc-nw-prod**. Le pipeline doit lire la valeur actuelle du secret au moment de l'exécution.

    Vous devez accorder à sc-nw-prod l'accès au secret. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'identité de sc-nw-prod sur kv-nw-prod ?
body:
  options:
    - { id: a, text: "Key Vault Secrets User" }
    - { id: b, text: "Key Vault Reader" }
    - { id: c, text: "Key Vault Secrets Officer" }
    - { id: d, text: "Key Vault Administrator" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Key Vault-linked variable group stores only the secret names and fetches their values when the pipeline runs, so the service connection needs Get and List on secrets. With the RBAC permission model, Key Vault Secrets User grants read access to secret contents and nothing more.
    fr: |
      Un groupe de variables lié à Key Vault ne stocke que les noms des secrets et récupère leurs valeurs à l'exécution du pipeline : la connexion de service a besoin des opérations Get et List sur les secrets. Avec le modèle d'autorisation RBAC, Key Vault Secrets User accorde la lecture du contenu des secrets, sans plus.
  options:
    b:
      en: |
        Key Vault Reader reads the metadata of the vault and its objects, not secret values.
      fr: |
        Key Vault Reader lit les métadonnées du coffre et de ses objets, pas les valeurs des secrets.
    c:
      en: |
        Key Vault Secrets Officer can also create, change and delete secrets, which is more than reading them.
      fr: |
        Key Vault Secrets Officer peut aussi créer, modifier et supprimer des secrets, ce qui dépasse la simple lecture.
    d:
      en: |
        Key Vault Administrator grants all data operations on keys, secrets and certificates.
      fr: |
        Key Vault Administrator accorde toutes les opérations de données sur les clés, les secrets et les certificats.
references:
  - title: Link a variable group to secrets in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/link-variable-groups-to-key-vaults
