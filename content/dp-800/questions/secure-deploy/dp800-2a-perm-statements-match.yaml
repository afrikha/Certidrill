id: dp800-2a-perm-statements-match
objective: "2.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing the permission scripts of an Azure SQL Database.

    Which statement or clause should you use for each requirement? To answer, drag the appropriate statements or clauses to the correct requirements. Each statement or clause may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez les scripts d'autorisations d'une base de données Azure SQL Database.

    Quelle instruction ou clause devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les instructions ou clauses appropriées vers les exigences correspondantes. Chaque instruction ou clause peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grant, text: GRANT }
    - { id: deny, text: DENY }
    - { id: revoke, text: REVOKE }
    - { id: wgo, text: WITH GRANT OPTION }
    - { id: cascade, text: CASCADE }
    - { id: as, text: AS }
  targets:
    - id: remove
      text: { en: "Remove a permission that was previously granted or denied to a principal", fr: "Retirer une autorisation précédemment accordée ou refusée à un principal" }
    - id: block
      text: { en: "Block a permission even when the principal receives it through a role", fr: "Bloquer une autorisation même lorsque le principal la reçoit par un rôle" }
    - id: delegate
      text: { en: "Let the grantee grant the same permission to other principals", fr: "Permettre au bénéficiaire d'accorder la même autorisation à d'autres principaux" }
    - id: chain
      text: { en: "When denying, also deny the permission to the principals to which this principal granted it", fr: "Lors d'un refus, refuser aussi l'autorisation aux principaux auxquels ce principal l'a accordée" }
answer:
  mapping: { remove: revoke, block: deny, delegate: wgo, chain: cascade }
explanation:
  correct:
    en: |
      REVOKE removes a GRANT or a DENY, after which access can still come from another grant. DENY blocks the permission and overrides grants received through roles. WITH GRANT OPTION lets the grantee grant the permission to others, and CASCADE on DENY also denies it to the principals that received it from this grantee. AS names the principal from which the grantor derives the right to grant.
    fr: |
      REVOKE retire un GRANT ou un DENY, après quoi l'accès peut encore provenir d'une autre autorisation. DENY bloque l'autorisation et l'emporte sur celles reçues par des rôles. WITH GRANT OPTION permet au bénéficiaire d'accorder l'autorisation à d'autres, et CASCADE sur DENY la refuse aussi aux principaux qui l'ont reçue de ce bénéficiaire. AS désigne le principal dont le concédant tire le droit d'accorder.
references:
  - title: GRANT object permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/grant-object-permissions-transact-sql
  - title: DENY Object Permissions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-object-permissions-transact-sql
