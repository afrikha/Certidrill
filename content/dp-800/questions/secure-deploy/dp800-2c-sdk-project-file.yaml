id: dp800-2c-sdk-project-file
objective: "2.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware is creating a SQL database project named **BillingDb** for an Azure SQL database. The project must meet the following requirements:

    - It builds with `dotnet build` on Windows and Linux agents.
    - The build validates the code against the Azure SQL Database platform.
    - It uses the objects of version 1.1.0 of **Litware.Common.Lookups**, a package that the platform team publishes to the internal NuGet feed. These objects are deployed in the same database as BillingDb, and their source code is not in the BillingDb repository.

    How should you complete the project file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware crée un projet de base de données SQL nommé **BillingDb** pour une base de données Azure SQL. Le projet doit respecter les exigences suivantes :

    - Il se génère avec `dotnet build` sur des agents Windows et Linux.
    - La génération valide le code par rapport à la plateforme Azure SQL Database.
    - Il utilise les objets de la version 1.1.0 de **Litware.Common.Lookups**, un package que l'équipe plateforme publie dans le flux NuGet interne. Ces objets sont déployés dans la même base de données que BillingDb, et leur code source ne se trouve pas dans le dépôt de BillingDb.

    Comment devez-vous compléter le fichier projet ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    <Project DefaultTargets="Build">
      [[sdk]]
      <PropertyGroup>
        <Name>BillingDb</Name>
        <DSP>Microsoft.Data.Tools.Schema.Sql.[[dsp]]</DSP>
      </PropertyGroup>
      <ItemGroup>
        [[ref]]
      </ItemGroup>
    </Project>
  slots:
    - id: sdk
      options:
        - { id: buildsql, text: '<Sdk Name="Microsoft.Build.Sql" Version="1.0.0" />' }
        - { id: netsdk, text: '<Sdk Name="Microsoft.NET.Sdk" Version="8.0.0" />' }
        - { id: ssdt, text: '<Import Project="$(SQLDBExtensionsRefPath)\Microsoft.Data.Tools.Schema.SqlTasks.targets" />' }
    - id: dsp
      options:
        - { id: azure, text: "SqlAzureV12DatabaseSchemaProvider" }
        - { id: sql170, text: "Sql170DatabaseSchemaProvider" }
        - { id: fabric, text: "SqlDbFabricDatabaseSchemaProvider" }
        - { id: dw, text: "SqlDwUnifiedDatabaseSchemaProvider" }
    - id: ref
      options:
        - { id: package, text: '<PackageReference Include="Litware.Common.Lookups" Version="1.1.0" />' }
        - { id: project, text: '<ProjectReference Include="..\Lookups\Litware.Common.Lookups.sqlproj" />' }
        - { id: artifact, text: '<ArtifactReference Include="..\Lookups\bin\Release\Litware.Common.Lookups.dacpac" />' }
        - { id: build, text: '<Build Include="Litware.Common.Lookups.dacpac" />' }
answer:
  values: { sdk: buildsql, dsp: azure, ref: package }
explanation:
  correct:
    en: |
      The Sdk element that references Microsoft.Build.Sql makes the project SDK-style, so it builds with dotnet build on any operating system. SqlAzureV12DatabaseSchemaProvider is the target platform of Azure SQL Database. SDK-style projects consume database references from NuGet with PackageReference; a reference to objects of the same database needs no SQLCMD variable.
    fr: |
      L'élément Sdk qui référence Microsoft.Build.Sql fait du projet un projet de style SDK, qui se génère avec dotnet build sur tout système d'exploitation. SqlAzureV12DatabaseSchemaProvider est la plateforme cible d'Azure SQL Database. Les projets de style SDK consomment des références de base de données depuis NuGet avec PackageReference ; une référence à des objets de la même base de données ne nécessite aucune variable SQLCMD.
  options:
    netsdk: { en: "Microsoft.NET.Sdk is the SDK of .NET application projects; it does not build T-SQL objects into a .dacpac.", fr: "Microsoft.NET.Sdk est le SDK des projets d'application .NET ; il ne génère pas d'objets T-SQL dans un .dacpac." }
    ssdt: { en: "Importing the SSDT targets is the original project format, which depends on the .NET Framework tooling of Visual Studio.", fr: "Importer les cibles SSDT correspond au format de projet d'origine, qui dépend des outils .NET Framework de Visual Studio." }
    sql170: { en: "Sql170 validates against SQL Server 2025, not Azure SQL Database.", fr: "Sql170 valide par rapport à SQL Server 2025, pas à Azure SQL Database." }
    fabric: { en: "This provider targets SQL database in Microsoft Fabric.", fr: "Ce fournisseur cible la base de données SQL dans Microsoft Fabric." }
    dw: { en: "This provider targets Fabric Data Warehouse.", fr: "Ce fournisseur cible Fabric Data Warehouse." }
    project: { en: "A project reference needs the source project, which is not in the repository.", fr: "Une référence de projet nécessite le projet source, absent du dépôt." }
    artifact: { en: "A direct .dacpac reference bypasses the NuGet feed and its versioning; Microsoft advises against it for new SDK-style development.", fr: "Une référence directe à un .dacpac contourne le flux NuGet et son versionnage ; Microsoft la déconseille pour les nouveaux développements de style SDK." }
    build: { en: "Build items add T-SQL files to the model; they do not reference another database model.", fr: "Les éléments Build ajoutent des fichiers T-SQL au modèle ; ils ne référencent pas un autre modèle de base de données." }
references:
  - title: SQL projects package references
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/package-references
  - title: SQL projects target platform
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/target-platform
