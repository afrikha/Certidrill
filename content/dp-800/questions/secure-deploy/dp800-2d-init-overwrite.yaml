id: dp800-2d-init-overwrite
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores the Data API builder (DAB) configuration of its inventory API in a Git repository. The file dab-config.json defines 12 entities and runs in development mode.

    A developer must switch the API to production mode. From the folder that contains dab-config.json, the developer runs the following command:

    ```bash
    dab init --database-type mssql --connection-string "@env('SQL_CONN')" --host-mode production
    ```

    What is the result of the command?
  fr: |
    Contoso stocke la configuration Data API builder (DAB) de son API d'inventaire dans un dépôt Git. Le fichier dab-config.json définit 12 entités et s'exécute en mode development.

    Un développeur doit faire passer l'API en mode production. Depuis le dossier qui contient dab-config.json, il exécute la commande suivante :

    ```bash
    dab init --database-type mssql --connection-string "@env('SQL_CONN')" --host-mode production
    ```

    Quel est le résultat de la commande ?
body:
  options:
    - { id: a, text: { en: "dab-config.json keeps its 12 entities, and only the host mode changes to production.", fr: "dab-config.json conserve ses 12 entités, et seul le mode d'hôte passe à production." } }
    - { id: b, text: { en: "The command fails because dab-config.json already exists in the folder.", fr: "La commande échoue, car dab-config.json existe déjà dans le dossier." } }
    - { id: c, text: { en: "dab-config.json is replaced by a new file in production mode that defines no entities.", fr: "dab-config.json est remplacé par un nouveau fichier en mode production qui ne définit aucune entité." } }
    - { id: d, text: { en: "The command merges the new runtime settings into dab-config.json and asks to confirm each entity.", fr: "La commande fusionne les nouveaux paramètres d'exécution dans dab-config.json et demande de confirmer chaque entité." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      dab init writes a new configuration file, dab-config.json by default. If the file already exists, the command overwrites it without merging anything, so the 12 entity definitions are lost and must be restored from Git. To change settings of an existing file, edit it or use the commands that update it instead of running dab init again.
    fr: |
      dab init écrit un nouveau fichier de configuration, dab-config.json par défaut. Si le fichier existe déjà, la commande l'écrase sans rien fusionner : les 12 définitions d'entités sont perdues et doivent être restaurées depuis Git. Pour modifier les paramètres d'un fichier existant, modifiez-le ou utilisez les commandes qui le mettent à jour au lieu de relancer dab init.
  options:
    a: { en: "dab init doesn't update an existing file; it writes a complete new one.", fr: "dab init ne met pas à jour un fichier existant ; il en écrit un nouveau complet." }
    b: { en: "dab init doesn't stop when the file exists; it overwrites it.", fr: "dab init ne s'arrête pas quand le fichier existe ; il l'écrase." }
    d: { en: "dab init has no merge behavior and no interactive confirmation.", fr: "dab init n'a ni comportement de fusion ni confirmation interactive." }
references:
  - title: Initialize a config with the DAB CLI - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/command-line/dab-init
