id: dp800-2a-model-invoke-permissions
objective: "2.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database. The database scoped credential **[https://aoai-adatum.openai.azure.com]** uses the managed identity of the logical server.

    Members of the database role **DataScience** must be able to call `sp_invoke_external_rest_endpoint` directly and pass this credential in the @credential parameter. The solution must follow the principle of least privilege.

    Which two permissions should you grant to DataScience? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database. Les informations d'identification délimitées à la base de données **[https://aoai-adatum.openai.azure.com]** utilisent l'identité managée du serveur logique.

    Les membres du rôle de base de données **DataScience** doivent pouvoir appeler directement `sp_invoke_external_rest_endpoint` et passer ces informations d'identification dans le paramètre @credential. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux autorisations à accorder à DataScience ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "ALTER ANY DATABASE SCOPED CREDENTIAL" }
    - { id: b, text: "EXECUTE ANY EXTERNAL ENDPOINT" }
    - { id: c, text: "CONTROL ON DATABASE SCOPED CREDENTIAL::[https://aoai-adatum.openai.azure.com]" }
    - { id: d, text: "REFERENCES ON DATABASE SCOPED CREDENTIAL::[https://aoai-adatum.openai.azure.com]" }
    - { id: e, text: "ALTER ANY EXTERNAL MODEL" }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Running sp_invoke_external_rest_endpoint requires the EXECUTE ANY EXTERNAL ENDPOINT database permission. Using a database scoped credential in the @credential parameter also requires the REFERENCES permission on that credential.
    fr: |
      Exécuter sp_invoke_external_rest_endpoint exige l'autorisation de base de données EXECUTE ANY EXTERNAL ENDPOINT. Utiliser des informations d'identification délimitées à la base de données dans le paramètre @credential exige aussi l'autorisation REFERENCES sur ces informations d'identification.
  options:
    a: { en: "This permission lets the role create, change and drop credentials, which is more than using one.", fr: "Cette autorisation permet au rôle de créer, modifier et supprimer des informations d'identification, ce qui dépasse leur utilisation." }
    c: { en: "CONTROL includes REFERENCES but also lets the role alter or drop the credential.", fr: "CONTROL inclut REFERENCES mais permet aussi au rôle de modifier ou de supprimer les informations d'identification." }
    e: { en: "External model permissions concern AI_GENERATE_EMBEDDINGS models, not direct REST calls.", fr: "Les autorisations sur les modèles externes concernent les modèles d'AI_GENERATE_EMBEDDINGS, pas les appels REST directs." }
references:
  - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql
