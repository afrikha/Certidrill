id: dp800-2c-sec-entra-auth
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware deploys an SDK-style SQL database project to an Azure SQL database named **PolicyDb** from a GitHub Actions workflow on a Linux runner. The workflow signs in with `azure/login` and OpenID Connect by using a Microsoft Entra application. The application already has a database user in PolicyDb with the permissions needed to deploy.

    A step then runs `sqlpackage /Action:Publish` with the following connection string:

    `Server=tcp:sql-proseware.database.windows.net;Database=PolicyDb;Authentication=<value>`

    You need SqlPackage to connect as the signed-in identity, without any password or secret.

    Which value should you use for Authentication?
  fr: |
    Proseware déploie un projet de base de données SQL de style SDK sur une base de données Azure SQL nommée **PolicyDb** à partir d'un workflow GitHub Actions sur un exécuteur Linux. Le workflow se connecte avec `azure/login` et OpenID Connect au moyen d'une application Microsoft Entra. L'application dispose déjà d'un utilisateur de base de données dans PolicyDb avec les autorisations nécessaires au déploiement.

    Une étape exécute ensuite `sqlpackage /Action:Publish` avec la chaîne de connexion suivante :

    `Server=tcp:sql-proseware.database.windows.net;Database=PolicyDb;Authentication=<value>`

    Vous devez faire en sorte que SqlPackage se connecte avec l'identité connectée, sans mot de passe ni secret.

    Quelle valeur devez-vous utiliser pour Authentication ?
body:
  options:
    - { id: a, text: "Active Directory Password" }
    - { id: b, text: "Active Directory Integrated" }
    - { id: c, text: "Active Directory Interactive" }
    - { id: d, text: "Active Directory Default" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Active Directory Default lets the driver obtain a Microsoft Entra token from the credentials available in the environment, including the Azure CLI session that azure/login created with OpenID Connect. No password or secret appears in the connection string or in the repository.
    fr: |
      Active Directory Default permet au pilote d'obtenir un jeton Microsoft Entra à partir des informations d'identification disponibles dans l'environnement, y compris la session Azure CLI créée par azure/login avec OpenID Connect. Aucun mot de passe ni secret n'apparaît dans la chaîne de connexion ou dans le dépôt.
  options:
    a:
      en: |
        Active Directory Password requires a user name and password in the connection string.
      fr: |
        Active Directory Password nécessite un nom d'utilisateur et un mot de passe dans la chaîne de connexion.
    b:
      en: |
        Integrated authentication relies on the Windows sign-in of a domain-joined computer, not on the workflow identity.
      fr: |
        L'authentification intégrée repose sur la session Windows d'un ordinateur joint à un domaine, pas sur l'identité du workflow.
    c:
      en: |
        Interactive authentication prompts a user to sign in, which a pipeline runner cannot do.
      fr: |
        L'authentification interactive invite un utilisateur à se connecter, ce qu'un exécuteur de pipeline ne peut pas faire.
references:
