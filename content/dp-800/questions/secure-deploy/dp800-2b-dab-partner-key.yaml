id: dp800-2b-dab-partner-key
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin exposes product data through the REST endpoint of Data API builder (DAB). DAB uses the `EntraId` authentication provider, and the `Product` entity grants `read` to the `authenticated` role only.

    A partner system must call the endpoint. The partner system can send only a static subscription key in an HTTP header and can't obtain Microsoft Entra tokens. All other callers must continue to present Microsoft Entra tokens, and anonymous requests must stay denied.

    What should you do?
  fr: |
    Tailspin expose des données de produits avec le point de terminaison REST de Data API builder (DAB). DAB utilise le fournisseur d'authentification `EntraId`, et l'entité `Product` n'accorde `read` qu'au rôle `authenticated`.

    Un système partenaire doit appeler le point de terminaison. Il ne peut envoyer qu'une clé d'abonnement statique dans un en-tête HTTP et ne peut pas obtenir de jetons Microsoft Entra. Tous les autres appelants doivent continuer à présenter des jetons Microsoft Entra, et les requêtes anonymes doivent rester refusées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |
          Change the authentication provider to Unauthenticated and grant read to the anonymous role.
        fr: |
          Remplacer le fournisseur d'authentification par Unauthenticated et accorder read au rôle anonymous.
    - id: b
      text:
        en: |
          Change the authentication provider to Simulator for the partner's requests.
        fr: |
          Remplacer le fournisseur d'authentification par Simulator pour les requêtes du partenaire.
    - id: c
      text:
        en: |
          Change the authentication provider to AppService and send the key in the X-MS-CLIENT-PRINCIPAL header.
        fr: |
          Remplacer le fournisseur d'authentification par AppService et envoyer la clé dans l'en-tête X-MS-CLIENT-PRINCIPAL.
    - id: d
      text:
        en: |
          Publish the DAB endpoint through Azure API Management and validate the partner's key there.
        fr: |
          Publier le point de terminaison DAB via Gestion des API Azure et y valider la clé du partenaire.
answer: { optionId: d }
explanation:
  correct:
    en: |
      DAB doesn't support key-based authentication directly; for API keys or other non-JWT schemes, Microsoft recommends placing DAB behind a gateway such as Azure API Management. The gateway checks the subscription key, while DAB keeps validating Microsoft Entra tokens for every other caller.
    fr: |
      DAB ne prend pas directement en charge l'authentification par clé ; pour les clés d'API ou d'autres schémas non JWT, Microsoft recommande de placer DAB derrière une passerelle telle que Gestion des API Azure. La passerelle vérifie la clé d'abonnement, tandis que DAB continue de valider les jetons Microsoft Entra de tous les autres appelants.
  options:
    a:
      en: |
        Unauthenticated runs every request as anonymous, so anyone could read the data and the Microsoft Entra requirement would be lost.
      fr: |
        Unauthenticated exécute chaque requête comme anonymous : n'importe qui pourrait lire les données et l'exigence Microsoft Entra serait perdue.
    b:
      en: |
        Simulator is for development only, treats every request as authenticated without checking anything, and doesn't start in production mode.
      fr: |
        Simulator est réservé au développement, traite chaque requête comme authenticated sans rien vérifier et ne démarre pas en mode production.
    c:
      en: |
        The AppService provider trusts identity headers injected by App Service authentication; a static key in that header isn't an identity and the provider applies to all callers.
      fr: |
        Le fournisseur AppService fait confiance aux en-têtes d'identité injectés par l'authentification App Service ; une clé statique dans cet en-tête n'est pas une identité, et le fournisseur s'applique à tous les appelants.
references:
  - title: Configure authentication for SQL MCP Server
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/how-to-configure-authentication
  - title: Runtime
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/runtime
