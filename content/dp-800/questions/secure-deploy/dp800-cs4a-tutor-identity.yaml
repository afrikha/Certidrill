id: dp800-cs4a-tutor-identity
objective: "2.1.5"
type: single
caseStudy: dp800-cs4a-proseware
difficulty: 1
status: draft
stem:
  en: |
    You are connected to LearningDb as a member of the Microsoft Entra admin group of sql-proseware. The Tutor API uses Microsoft.Data.SqlClient.

    You need to change how the Tutor API connects to LearningDb. The solution must meet the security requirements.

    What should you do?
  fr: |
    Vous êtes connecté à LearningDb en tant que membre du groupe administrateur Microsoft Entra de sql-proseware. L'API Tutor utilise Microsoft.Data.SqlClient.

    Vous devez modifier la façon dont l'API Tutor se connecte à LearningDb. La solution doit satisfaire les exigences de sécurité.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run `CREATE USER [app-proseware-tutor] FROM EXTERNAL PROVIDER;` and grant it EXECUTE on the Api schema. In the connection string, set `Authentication=Active Directory Managed Identity;User ID=<object ID of the managed identity>`."
        fr: "Exécuter `CREATE USER [app-proseware-tutor] FROM EXTERNAL PROVIDER;` et lui accorder EXECUTE sur le schéma Api. Dans la chaîne de connexion, définir `Authentication=Active Directory Managed Identity;User ID=<ID d'objet de l'identité managée>`."
    - id: b
      text:
        en: "Run `CREATE USER [app-proseware-tutor] FROM EXTERNAL PROVIDER;` and grant it EXECUTE on the Api schema. In the connection string, set `Authentication=Active Directory Integrated` and remove the User ID and Password keywords."
        fr: "Exécuter `CREATE USER [app-proseware-tutor] FROM EXTERNAL PROVIDER;` et lui accorder EXECUTE sur le schéma Api. Dans la chaîne de connexion, définir `Authentication=Active Directory Integrated` et supprimer les mots clés User ID et Password."
    - id: c
      text:
        en: "Run `CREATE USER [app-proseware-tutor] FROM EXTERNAL PROVIDER;` and grant it EXECUTE on the Api schema. In the connection string, set `Authentication=Active Directory Managed Identity` and remove the User ID and Password keywords."
        fr: "Exécuter `CREATE USER [app-proseware-tutor] FROM EXTERNAL PROVIDER;` et lui accorder EXECUTE sur le schéma Api. Dans la chaîne de connexion, définir `Authentication=Active Directory Managed Identity` et supprimer les mots clés User ID et Password."
    - id: d
      text:
        en: "Run `CREATE USER [tutor_svc] WITH PASSWORD = '<new password>';` and grant it EXECUTE on the Api schema. Store the connection string in Azure Key Vault and reference it from an app setting."
        fr: "Exécuter `CREATE USER [tutor_svc] WITH PASSWORD = '<nouveau mot de passe>';` et lui accorder EXECUTE sur le schéma Api. Stocker la chaîne de connexion dans Azure Key Vault et la référencer depuis un paramètre d'application."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A system-assigned managed identity has the name of the web app, and CREATE USER ... FROM EXTERNAL PROVIDER creates a database user for it; the statement must be run by a Microsoft Entra principal, such as a member of the Entra admin group. With Authentication=Active Directory Managed Identity and no User ID, Microsoft.Data.SqlClient gets a token for the system-assigned identity, so no secret exists. EXECUTE on the Api schema is enough for the stored procedures that the API runs.
    fr: |
      Une identité managée affectée par le système porte le nom de l'application web, et CREATE USER ... FROM EXTERNAL PROVIDER crée un utilisateur de base de données pour elle ; l'instruction doit être exécutée par un principal Microsoft Entra, comme un membre du groupe administrateur Entra. Avec Authentication=Active Directory Managed Identity et sans User ID, Microsoft.Data.SqlClient obtient un jeton pour l'identité affectée par le système : aucun secret n'existe. EXECUTE sur le schéma Api suffit pour les procédures stockées exécutées par l'API.
  options:
    a: { en: "User ID is set only for a user-assigned managed identity, and it must then be the client ID; for the system-assigned identity it must be omitted.", fr: "User ID n'est défini que pour une identité managée affectée par l'utilisateur, et doit alors être l'ID client ; pour l'identité affectée par le système, il doit être omis." }
    b: { en: "Active Directory Integrated uses the Windows identity of the signed-in user on a domain-joined or federated machine, not the managed identity of the web app.", fr: "Active Directory Integrated utilise l'identité Windows de l'utilisateur connecté sur une machine jointe à un domaine ou fédérée, pas l'identité managée de l'application web." }
    d: { en: "A contained user with a password still needs a secret, and the requirements forbid storing it in Azure Key Vault.", fr: "Un utilisateur autonome avec mot de passe nécessite toujours un secret, et les exigences interdisent de le stocker dans Azure Key Vault." }
references:
  - title: "Tutorial: Use managed identity to connect an Azure web app to an Azure SQL database without secrets"
    url: https://learn.microsoft.com/en-us/azure/app-service/tutorial-connect-msi-sql-database
  - title: Microsoft Entra authentication with Microsoft.Data.SqlClient
    url: https://learn.microsoft.com/en-us/sql/connect/ado-net/sql/azure-active-directory-authentication
