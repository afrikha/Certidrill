id: dp800-cs1a-dab-search
objective: "2.4.4"
type: dropdown
caseStudy: dp800-cs1a-adventure-works
difficulty: 2
status: draft
stem:
  en: |
    You need to add an entity for dbo.usp_SearchProducts to the configuration file of ca-aw-dab. The solution must meet the storefront API requirements.

    How should you complete the entity definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez ajouter une entité pour dbo.usp_SearchProducts au fichier de configuration de ca-aw-dab. La solution doit respecter les exigences relatives à l'API de la boutique en ligne.

    Comment devez-vous compléter la définition de l'entité ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "SearchProducts": {
      "source": {
        "object": "dbo.usp_SearchProducts",
        "type": [[type]],
        "parameters": [ { "name": "text", "required": true } ]
      },
      "rest": { "enabled": true, "methods": [ [[method]] ] },
      "graphql": { "enabled": true, "operation": [[operation]] },
      "permissions": [
        { "role": "anonymous", "actions": [ [[action]] ] }
      ]
    }
  slots:
    - id: type
      options:
        - { id: table, text: "\"table\"" }
        - { id: view, text: "\"view\"" }
        - { id: proc, text: "\"stored-procedure\"" }
    - id: method
      options:
        - { id: post, text: "\"POST\"" }
        - { id: get, text: "\"GET\"" }
        - { id: put, text: "\"PUT\"" }
        - { id: patch, text: "\"PATCH\"" }
    - id: operation
      options:
        - { id: mutation, text: "\"mutation\"" }
        - { id: subscription, text: "\"subscription\"" }
        - { id: query, text: "\"query\"" }
    - id: action
      options:
        - { id: read, text: "\"read\"" }
        - { id: execute, text: "\"execute\"" }
        - { id: create, text: "\"create\"" }
        - { id: update, text: "\"update\"" }
answer:
  values: { type: proc, method: get, operation: query, action: execute }
explanation:
  correct:
    en: |
      A stored procedure is exposed with "type": "stored-procedure" and its parameters. For a stored procedure entity, rest.methods lists the HTTP methods that can call it, so ["GET"] limits REST to GET, and graphql.operation set to "query" exposes it as a query instead of a mutation. The only action that applies to a stored procedure entity is execute, which the anonymous role needs.
    fr: |
      Une procédure stockée est exposée avec "type": "stored-procedure" et ses paramètres. Pour une entité de procédure stockée, rest.methods liste les méthodes HTTP qui peuvent l'appeler : ["GET"] limite REST à GET, et graphql.operation défini sur "query" l'expose comme une requête au lieu d'une mutation. La seule action qui s'applique à une entité de procédure stockée est execute, dont le rôle anonymous a besoin.
  options:
    table: { en: "dbo.usp_SearchProducts is a stored procedure; a table entity has no parameters to pass.", fr: "dbo.usp_SearchProducts est une procédure stockée ; une entité de table n'a pas de paramètres à transmettre." }
    view: { en: "A view entity exposes a view, not a stored procedure that takes parameters.", fr: "Une entité de vue expose une vue, pas une procédure stockée qui prend des paramètres." }
    post: { en: "The requirements allow only GET for REST calls of the search.", fr: "Les exigences n'autorisent que GET pour les appels REST de la recherche." }
    put: { en: "PUT is meant for writes, and the requirements allow only GET.", fr: "PUT est destiné aux écritures, et les exigences n'autorisent que GET." }
    patch: { en: "PATCH is meant for partial updates, and the requirements allow only GET.", fr: "PATCH est destiné aux mises à jour partielles, et les exigences n'autorisent que GET." }
    mutation: { en: "The requirements forbid exposing the search as a GraphQL mutation.", fr: "Les exigences interdisent d'exposer la recherche comme une mutation GraphQL." }
    subscription: { en: "subscription is not a value of graphql.operation; a stored procedure is a query or a mutation.", fr: "subscription n'est pas une valeur de graphql.operation ; une procédure stockée est une requête (query) ou une mutation." }
    read: { en: "read applies to tables and views; stored procedure entities use execute.", fr: "read s'applique aux tables et aux vues ; les entités de procédure stockée utilisent execute." }
    create: { en: "create applies to tables and views; stored procedure entities use execute.", fr: "create s'applique aux tables et aux vues ; les entités de procédure stockée utilisent execute." }
    update: { en: "update applies to tables and views; stored procedure entities use execute.", fr: "update s'applique aux tables et aux vues ; les entités de procédure stockée utilisent execute." }
references:
  - title: Configuration schema - Entities section - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/configuration/entities
