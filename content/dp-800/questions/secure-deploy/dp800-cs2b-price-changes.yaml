id: dp800-cs2b-price-changes
objective: "2.4.7"
type: single
caseStudy: dp800-cs2b-munsons-pickles
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that provides the changes of dbo.PriceList to the nightly ETL. The solution must meet the integration requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui fournit les modifications de dbo.PriceList à l'ETL nocturne. La solution doit satisfaire les exigences d'intégration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: Enable change tracking on SupplyDb and dbo.PriceList, and have the ETL read CHANGETABLE(CHANGES dbo.PriceList, @last_version).
        fr: Activer le suivi des modifications sur SupplyDb et dbo.PriceList, et faire lire CHANGETABLE(CHANGES dbo.PriceList, @last_version) par l'ETL.
    - id: b
      text:
        en: Convert dbo.PriceList to a system-versioned temporal table, and have the ETL query it with FOR SYSTEM_TIME BETWEEN.
        fr: Convertir dbo.PriceList en table temporelle versionnée par le système, et faire interroger la table par l'ETL avec FOR SYSTEM_TIME BETWEEN.
    - id: c
      text:
        en: Enable change data capture on SupplyDb and dbo.PriceList, and have the ETL read cdc.fn_cdc_get_all_changes_dbo_PriceList.
        fr: Activer la capture des données modifiées sur SupplyDb et dbo.PriceList, et faire lire cdc.fn_cdc_get_all_changes_dbo_PriceList par l'ETL.
    - id: d
      text:
        en: Configure change event streaming for dbo.PriceList to an Azure Event Hubs namespace, and have the ETL read the events.
        fr: Configurer le streaming d'événements de modification pour dbo.PriceList vers un espace de noms Azure Event Hubs, et faire lire les événements par l'ETL.
answer: { optionId: c }
explanation:
  correct:
    en: |
      Change data capture reads the transaction log asynchronously with SQL Server Agent jobs, so it adds no synchronous processing to the buyers' transactions, and it stores every change in a separate change table without altering dbo.PriceList. The all-changes function returns each intermediate change, with a before image and an after image for every update.
    fr: |
      La capture des données modifiées lit le journal des transactions de façon asynchrone à l'aide de travaux SQL Server Agent : elle n'ajoute aucun traitement synchrone aux transactions des acheteurs, et elle stocke chaque modification dans une table de modifications distincte sans modifier dbo.PriceList. La fonction de toutes les modifications renvoie chaque modification intermédiaire, avec une image avant et une image après pour chaque mise à jour.
  options:
    a: { en: "Change tracking records only that a row changed and its primary key; the ETL would read the current values and lose the intermediate prices.", fr: "Le suivi des modifications enregistre seulement qu'une ligne a changé et sa clé primaire ; l'ETL lirait les valeurs actuelles et perdrait les prix intermédiaires." }
    b: { en: "A system-versioned temporal table requires adding period columns and a history table, which changes the schema of dbo.PriceList.", fr: "Une table temporelle versionnée par le système impose l'ajout de colonnes de période et d'une table d'historique, ce qui modifie le schéma de dbo.PriceList." }
    d: { en: "Change event streaming sends the changes to Azure Event Hubs or Fabric Eventstream, an additional service outside the datacenter.", fr: "Le streaming d'événements de modification envoie les modifications vers Azure Event Hubs ou Fabric Eventstream, un service supplémentaire hors du centre de données." }
references:
  - title: What is change data capture (CDC)?
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-data-capture-sql-server
  - title: About Change Tracking (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-tracking-sql-server
