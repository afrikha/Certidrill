id: dp800-2d-rest-behavior
objective: "2.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam exposes the dbo.Customers table through the REST endpoint of Data API builder (DAB) as an entity named Customer, on the default path. CustomerID is the primary key and an IDENTITY column. No customer has the CustomerID 9999.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam expose la table dbo.Customers par le point de terminaison REST de Data API builder (DAB) sous la forme d'une entité nommée Customer, sur le chemin par défaut. CustomerID est la clé primaire et une colonne IDENTITY. Aucun client n'a le CustomerID 9999.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A PUT request to /api/Customer/CustomerID/9999 with a JSON body returns 404 Not Found.
        fr: Une requête PUT vers /api/Customer/CustomerID/9999 avec un corps JSON renvoie 404 Not Found.
    - id: s2
      text:
        en: A GET request to /api/Customer/CustomerID/9999 returns 404 Not Found.
        fr: Une requête GET vers /api/Customer/CustomerID/9999 renvoie 404 Not Found.
    - id: s3
      text:
        en: A GET request to /api/customer returns the same result as a GET request to /api/Customer.
        fr: Une requête GET vers /api/customer renvoie le même résultat qu'une requête GET vers /api/Customer.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      PUT and PATCH insert a missing row only when the database accepts an explicit key value; with an IDENTITY key, a PUT or PATCH to a key that doesn't exist returns 404 Not Found, and POST must be used to create the row. A GET on a key that doesn't exist returns 200 OK with an empty value array. REST path components and query parameters are case sensitive, so /api/customer doesn't match the Customer entity.
    fr: |
      PUT et PATCH n'insèrent une ligne manquante que si la base de données accepte une valeur de clé explicite ; avec une clé IDENTITY, un PUT ou un PATCH vers une clé inexistante renvoie 404 Not Found, et il faut utiliser POST pour créer la ligne. Un GET sur une clé inexistante renvoie 200 OK avec un tableau value vide. Les composants du chemin REST et les paramètres de requête respectent la casse : /api/customer ne correspond pas à l'entité Customer.
references:
  - title: How to call REST endpoints - Data API builder
    url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/api/rest
