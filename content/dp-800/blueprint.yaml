# DP-800 — Developing AI-Enabled Database Solutions (Microsoft Certified: SQL AI Developer Associate)
# Source: official study guide, "Skills measured as of March 12, 2026" (en-us and fr-fr pages checked on 2026-11-16).
# Real exam: 120 minutes (certification page on Microsoft Learn), passing score 700/1000; the page only says
# the exam "may have interactive components": case studies and labs are not announced, and Microsoft does not
# publish the number of questions. One case study and one Yes/No series per simulated exam is the factory
# convention for associate exams. typeMix: more `dropdown` than AZ-104 (SQL/Python code completion).
# Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
# WARNING (2026-11-16): the en-us, en-gb and de-de pages show "Skills measured as of March 12, 2026"
# without a change log, while the fr-fr and es-es pages show "October 19, 2026" with a change log
# (minor changes in 4 groups; visible differences: "ANN and KNN" instead of "ANN and ENN", CES
# dropped from the embedding maintenance bullet, "Copilot in Fabric" instead of "Microsoft Copilot
# in Fabric"). The English page is the reference here; re-check before generating the bank.
