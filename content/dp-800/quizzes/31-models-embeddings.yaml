chapter: 31-models-embeddings
questions:
  # ------------------------------------------------------------------ 1
  - id: dp800-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso is comparing embedding models for an Azure SQL database. For each model, the documentation gives a price per 1,000 tokens and a maximum number of input tokens per request.

        What is a token?
      fr: |
        Contoso compare des modèles d'incorporation pour une base de données Azure SQL. Pour chaque modèle, la documentation indique un prix pour 1 000 jetons et un nombre maximal de jetons d'entrée par requête.

        Qu'est-ce qu'un jeton ?
    body:
      options:
        - { id: a, text: { en: "One number of the vector that the model returns for a text", fr: "Un nombre du vecteur que le modèle retourne pour un texte" } }
        - { id: b, text: { en: "One row of the table that the database sends to the model", fr: "Une ligne de la table que la base de données envoie au modèle" } }
        - { id: c, text: { en: "A piece of text: a word, part of a word or a punctuation sign", fr: "Un morceau de texte : un mot, une partie de mot ou un signe de ponctuation" } }
        - { id: d, text: { en: "One fixed-size chunk of characters returned by AI_GENERATE_CHUNKS", fr: "Un bloc de caractères de taille fixe retourné par AI_GENERATE_CHUNKS" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Models split the input text into tokens: a short word can be one token, a longer word several, and punctuation counts too. Models charge per token processed and limit the tokens of each request, which is why what you embed and how you chunk it drive cost and feasibility.
        fr: |
          Les modèles découpent le texte d'entrée en jetons : un mot court peut être un jeton, un mot plus long plusieurs, et la ponctuation compte aussi. Les modèles facturent chaque jeton traité et limitent les jetons de chaque requête : c'est pourquoi ce que l'on incorpore et la façon de le découper déterminent le coût et la faisabilité.
      options:
        a: { en: "The numbers of the returned vector are its dimensions, not tokens.", fr: "Les nombres du vecteur retourné sont ses dimensions, pas des jetons." }
        b: { en: "A request carries one input text; its size is measured in tokens, whatever its origin.", fr: "Une requête transporte un texte d'entrée ; sa taille se mesure en jetons, quelle que soit son origine." }
        d: { en: "A chunk is a piece of a long text, measured in characters by AI_GENERATE_CHUNKS; it usually contains many tokens.", fr: "Un bloc est un morceau d'un texte long, mesuré en caractères par AI_GENERATE_CHUNKS ; il contient en général de nombreux jetons." }
    references:
      - title: Understand and evaluate models for SQL database workloads
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/02-understand-evaluate-models-sql-database-workloads

  # ------------------------------------------------------------------ 2
  - id: dp800-qz-31-02
    objective: "3.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam splits long support articles into chunks with AI_GENERATE_CHUNKS before it generates their embeddings. A developer proposes CHUNK_SIZE = 40 so that each vector is as focused as possible.

        What is the main risk of this design?
      fr: |
        Fabrikam découpe de longs articles de support en blocs avec AI_GENERATE_CHUNKS avant de générer leurs incorporations. Un développeur propose CHUNK_SIZE = 40 pour que chaque vecteur soit le plus ciblé possible.

        Quel est le principal risque de cette conception ?
    body:
      options:
        - { id: a, text: { en: "Each chunk exceeds the input token limit of the model, so the requests fail.", fr: "Chaque bloc dépasse la limite de jetons d'entrée du modèle, si bien que les requêtes échouent." } }
        - { id: b, text: { en: "Each chunk is too short to keep its context, so its vector matches questions poorly.", fr: "Chaque bloc est trop court pour garder son contexte, si bien que son vecteur correspond mal aux questions." } }
        - { id: c, text: { en: "Each vector gets fewer dimensions, so it no longer fits the VECTOR column.", fr: "Chaque vecteur reçoit moins de dimensions, si bien qu'il ne tient plus dans la colonne VECTOR." } }
        - { id: d, text: { en: "The function rejects the value, because CHUNK_SIZE must be at least 100.", fr: "La fonction rejette la valeur, car CHUNK_SIZE doit valoir au moins 100." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          CHUNK_SIZE is a number of characters: 40 characters are a few words, often cut in the middle of a sentence. Chunks that are too small lose the context that gives an idea its meaning, so their vectors match questions poorly; chunks that are too large have the opposite problem and dilute the meaning.
        fr: |
          CHUNK_SIZE est un nombre de caractères : 40 caractères ne font que quelques mots, souvent coupés au milieu d'une phrase. Des blocs trop petits perdent le contexte qui donne son sens à une idée, et leurs vecteurs correspondent donc mal aux questions ; des blocs trop grands ont le problème inverse et diluent le sens.
      options:
        a: { en: "The token limit is a risk of chunks that are too large; 40 characters are far below it.", fr: "La limite de jetons est un risque des blocs trop grands ; 40 caractères en sont très loin." }
        c: { en: "The number of dimensions is fixed by the model and its dimensions parameter, not by the length of the input.", fr: "Le nombre de dimensions est fixé par le modèle et son paramètre dimensions, pas par la longueur de l'entrée." }
        d: { en: "CHUNK_SIZE only has to be greater than 0; there is no minimum of 100.", fr: "CHUNK_SIZE doit seulement être supérieur à 0 ; il n'existe aucun minimum de 100." }
    references:
      - title: AI_GENERATE_CHUNKS (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
      - title: Design embeddings for SQL database workloads
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads

  # ------------------------------------------------------------------ 3
  - id: dp800-qz-31-03
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum runs SQL Server 2025 in a development lab. An Ollama server on the same computer serves the all-minilm model at http://localhost:11434, and the external rest endpoint enabled option is set to 1. You wrote the following definition.

        ```sql
        CREATE EXTERNAL MODEL LabEmbedder
        WITH (
            LOCATION = 'http://localhost:11434/api/embed',
            API_FORMAT = 'Ollama',
            MODEL_TYPE = EMBEDDINGS,
            MODEL = 'all-minilm'
        );
        ```

        You need AI_GENERATE_EMBEDDINGS to generate embeddings with the Ollama model through LabEmbedder.

        What should you do?
      fr: |
        Adatum exécute SQL Server 2025 dans un laboratoire de développement. Un serveur Ollama sur le même ordinateur sert le modèle all-minilm à l'adresse http://localhost:11434, et l'option external rest endpoint enabled est définie sur 1. Vous avez écrit la définition suivante.

        ```sql
        CREATE EXTERNAL MODEL LabEmbedder
        WITH (
            LOCATION = 'http://localhost:11434/api/embed',
            API_FORMAT = 'Ollama',
            MODEL_TYPE = EMBEDDINGS,
            MODEL = 'all-minilm'
        );
        ```

        Vous devez faire en sorte qu'AI_GENERATE_EMBEDDINGS génère des incorporations avec le modèle Ollama par l'intermédiaire de LabEmbedder.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a database scoped credential named [http://localhost:11434/] and reference it in CREDENTIAL.", fr: "Créer des informations d'identification délimitées à la base de données nommées [http://localhost:11434/] et les référencer dans CREDENTIAL." } }
        - { id: b, text: { en: "Set API_FORMAT to 'OpenAI' and change the path of LOCATION to /v1/embeddings.", fr: "Définir API_FORMAT sur 'OpenAI' et remplacer le chemin de LOCATION par /v1/embeddings." } }
        - { id: c, text: { en: "Set the allow server scoped db credentials option to 1, and then run RECONFIGURE.", fr: "Définir l'option allow server scoped db credentials sur 1, puis exécuter RECONFIGURE." } }
        - { id: d, text: { en: "Expose the Ollama endpoint over HTTPS with a TLS certificate, and use its https:// address in LOCATION.", fr: "Exposer le point de terminaison Ollama en HTTPS avec un certificat TLS, et utiliser son adresse https:// dans LOCATION." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The LOCATION of an external model must be an endpoint that uses HTTPS with TLS; a plain http:// address isn't supported, even on localhost. The Ollama format and the /api/embed path are right, and a local Ollama model needs no credential, so serving the endpoint over HTTPS is the only change.
        fr: |
          Le LOCATION d'un modèle externe doit être un point de terminaison qui utilise HTTPS avec TLS ; une adresse http:// simple n'est pas prise en charge, même sur localhost. Le format Ollama et le chemin /api/embed sont corrects, et un modèle Ollama local n'a besoin d'aucune information d'identification : servir le point de terminaison en HTTPS est donc la seule modification.
      options:
        a: { en: "A local Ollama model needs no credential, and a credential doesn't make an HTTP endpoint acceptable.", fr: "Un modèle Ollama local n'a besoin d'aucune information d'identification, et des informations d'identification ne rendent pas un point de terminaison HTTP acceptable." }
        b: { en: "Ollama is a supported API format with the /api/embed path; changing the format doesn't solve the HTTP problem.", fr: "Ollama est un format d'API pris en charge avec le chemin /api/embed ; changer de format ne règle pas le problème du HTTP." }
        c: { en: "This option allows managed identity credentials on SQL Server 2025; the model uses no credential.", fr: "Cette option autorise les informations d'identification par identité managée sur SQL Server 2025 ; le modèle n'en utilise aucune." }
    references:
      - title: CREATE EXTERNAL MODEL (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql

  # ------------------------------------------------------------------ 4
  - id: dp800-qz-31-04
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders runs SQL Server 2025. The dbo.Products table receives about 20,000 updates a day, and the embeddings of its Description column are stored in dbo.ProductEmbeddings. SQL Server Agent is available.

        You need to keep the embeddings current. The solution must meet the following requirements:

        - An embedding can lag behind its description by up to 30 minutes.
        - Write transactions must not call the embedding model.
        - The refresh process doesn't need the previous values of the changed rows.
        - Minimize the overhead of change detection, and don't depend on any service outside the database engine.

        What should you implement?
      fr: |
        Northwind Traders exécute SQL Server 2025. La table dbo.Products reçoit environ 20 000 mises à jour par jour, et les incorporations de sa colonne Description sont stockées dans dbo.ProductEmbeddings. SQL Server Agent est disponible.

        Vous devez maintenir les incorporations à jour. La solution doit satisfaire les exigences suivantes :

        - Une incorporation peut avoir jusqu'à 30 minutes de retard sur sa description.
        - Les transactions d'écriture ne doivent pas appeler le modèle d'incorporation.
        - Le processus d'actualisation n'a pas besoin des valeurs précédentes des lignes modifiées.
        - Réduire au minimum la charge de la détection des modifications, et ne dépendre d'aucun service hors du moteur de base de données.

        Que devez-vous implémenter ?
    body:
      options:
        - { id: a, text: { en: "An AFTER UPDATE trigger on dbo.Products that calls AI_GENERATE_EMBEDDINGS for the changed rows", fr: "Un déclencheur AFTER UPDATE sur dbo.Products qui appelle AI_GENERATE_EMBEDDINGS pour les lignes modifiées" } }
        - { id: b, text: { en: "Change data capture on dbo.Products, read by a SQL Server Agent job every 15 minutes", fr: "La capture de données modifiées sur dbo.Products, lue par un travail SQL Server Agent toutes les 15 minutes" } }
        - { id: c, text: { en: "Change Tracking on dbo.Products, read by a SQL Server Agent job every 15 minutes", fr: "Le suivi des modifications sur dbo.Products, lu par un travail SQL Server Agent toutes les 15 minutes" } }
        - { id: d, text: { en: "An Azure function that uses the Azure SQL trigger binding on dbo.Products", fr: "Une fonction Azure qui utilise la liaison de déclencheur Azure SQL sur dbo.Products" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Change Tracking is the lightweight option: it records which rows changed since a given version, and a background job processes those keys in batches. A 15-minute job stays within the allowed lag, keeps model calls out of the write transactions and runs entirely in the database engine.
        fr: |
          Le suivi des modifications est l'option légère : il enregistre quelles lignes ont changé depuis une version donnée, et un travail en arrière-plan traite ces clés par lots. Un travail toutes les 15 minutes respecte le retard autorisé, garde les appels au modèle hors des transactions d'écriture et s'exécute entièrement dans le moteur de base de données.
      options:
        a: { en: "The trigger calls the model inside each write transaction, which the requirements forbid.", fr: "Le déclencheur appelle le modèle dans chaque transaction d'écriture, ce que les exigences interdisent." }
        b: { en: "CDC also stores the before and after values in change tables fed by a capture process: more overhead for values the job doesn't need.", fr: "CDC stocke aussi les valeurs avant et après dans des tables de modifications alimentées par un processus de capture : plus de charge pour des valeurs dont le travail n'a pas besoin." }
        d: { en: "Azure Functions runs the generation outside the database engine, as an extra service to deploy.", fr: "Azure Functions exécute la génération hors du moteur de base de données, comme un service supplémentaire à déployer." }
    references:
      - title: About Change Tracking (SQL Server)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-tracking-sql-server
      - title: Generate and maintain embeddings for SQL database workloads
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/05-generate-maintain-embeddings-sql-database-workloads

  # ------------------------------------------------------------------ 5
  - id: dp800-qz-31-05
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware stores product embeddings in a VECTOR(1536) column. The vectors were generated by an external model named CatalogEmbedder, which calls a text-embedding-3-small deployment.

        To improve quality, a developer created a second external model named QueryEmbedder that calls a text-embedding-3-large deployment with PARAMETERS = '{"dimensions": 1536}'. The search procedure now converts the user's question with QueryEmbedder. The procedure runs without error, but the results are no longer relevant.

        You need to restore relevant results without regenerating the stored vectors.

        What should you do?
      fr: |
        Litware stocke des incorporations de produits dans une colonne VECTOR(1536). Les vecteurs ont été générés par un modèle externe nommé CatalogEmbedder, qui appelle un déploiement text-embedding-3-small.

        Pour améliorer la qualité, un développeur a créé un second modèle externe nommé QueryEmbedder qui appelle un déploiement text-embedding-3-large avec PARAMETERS = '{"dimensions": 1536}'. La procédure de recherche convertit désormais la question de l'utilisateur avec QueryEmbedder. La procédure s'exécute sans erreur, mais les résultats ne sont plus pertinents.

        Vous devez rétablir des résultats pertinents sans régénérer les vecteurs stockés.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Normalize the question vector with VECTOR_NORMALIZE and norm2 before the comparison.", fr: "Normaliser le vecteur de la question avec VECTOR_NORMALIZE et norm2 avant la comparaison." } }
        - { id: b, text: { en: "Compare the vectors with the dot metric instead of the cosine metric.", fr: "Comparer les vecteurs avec la métrique dot au lieu de la métrique cosine." } }
        - { id: c, text: { en: "Set dimensions to 3072 in QueryEmbedder so that the question keeps all its precision.", fr: "Définir dimensions sur 3072 dans QueryEmbedder pour que la question garde toute sa précision." } }
        - { id: d, text: { en: "Convert the question with CatalogEmbedder instead of QueryEmbedder.", fr: "Convertir la question avec CatalogEmbedder au lieu de QueryEmbedder." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A query vector can only be compared with vectors produced by the same model with the same dimensions. Vectors from text-embedding-3-large and text-embedding-3-small live in different spaces, even with the same length, so the distances are meaningless. Without regenerating the stored vectors, the question must be embedded with CatalogEmbedder.
        fr: |
          Un vecteur de requête ne peut être comparé qu'à des vecteurs produits par le même modèle avec les mêmes dimensions. Les vecteurs de text-embedding-3-large et de text-embedding-3-small appartiennent à des espaces différents, même à longueur égale : les distances n'ont donc aucun sens. Sans régénérer les vecteurs stockés, la question doit être incorporée avec CatalogEmbedder.
      options:
        a: { en: "Normalization only rescales a vector; it doesn't make vectors of two models comparable, and Azure OpenAI vectors are already normalized.", fr: "La normalisation ne fait que remettre un vecteur à l'échelle ; elle ne rend pas comparables les vecteurs de deux modèles, et les vecteurs Azure OpenAI sont déjà normalisés." }
        b: { en: "Changing the metric changes how distances are computed, not the fact that the two vectors come from different models.", fr: "Changer de métrique change le calcul des distances, pas le fait que les deux vecteurs viennent de modèles différents." }
        c: { en: "A 3,072-dimension vector can't be compared with the VECTOR(1536) column, and it still comes from another model.", fr: "Un vecteur de 3 072 dimensions ne peut pas être comparé à la colonne VECTOR(1536), et il vient toujours d'un autre modèle." }
    references:
      - title: Foundry Models sold by Azure
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models

  # ------------------------------------------------------------------ 6
  - id: dp800-qz-31-06
    objective: "3.1.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has an Azure SQL database. An external model named PolicyEmbedder is defined with the following parameters.

        ```sql
        PARAMETERS = '{"dimensions": 768, "sql_rest_options": {"retry_count": 1}}'
        ```

        The dbo.PolicyChunks table stores the embeddings of policy documents, generated by PolicyEmbedder, in an Embedding column of type VECTOR(768).

        You are writing a stored procedure that embeds the question of a user and returns the closest chunks. The solution must meet the following requirements:

        - The procedure retries each failed request to the endpoint up to 4 times. Other code that uses PolicyEmbedder keeps a single retry.
        - The definition of PolicyEmbedder isn't changed.
        - The question vector can be compared with the stored vectors.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'une base de données Azure SQL. Un modèle externe nommé PolicyEmbedder est défini avec les paramètres suivants.

        ```sql
        PARAMETERS = '{"dimensions": 768, "sql_rest_options": {"retry_count": 1}}'
        ```

        La table dbo.PolicyChunks stocke les incorporations de documents de politique, générées par PolicyEmbedder, dans une colonne Embedding de type VECTOR(768).

        Vous écrivez une procédure stockée qui incorpore la question d'un utilisateur et retourne les blocs les plus proches. La solution doit satisfaire les exigences suivantes :

        - La procédure réessaie jusqu'à 4 fois chaque requête au point de terminaison qui échoue. Le reste du code qui utilise PolicyEmbedder conserve une seule nouvelle tentative.
        - La définition de PolicyEmbedder n'est pas modifiée.
        - Le vecteur de la question peut être comparé aux vecteurs stockés.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        DECLARE @p JSON = N'[[params]]';
        DECLARE @qv [[vtype]] =
            AI_GENERATE_EMBEDDINGS(@question USE MODEL PolicyEmbedder PARAMETERS @p);

        SELECT TOP (5) c.ChunkID, c.ChunkText,
               VECTOR_DISTANCE('cosine', @qv, c.Embedding) AS distance
        FROM dbo.PolicyChunks AS c
        ORDER BY distance;
      slots:
        - id: params
          options:
            - { id: flat, text: '{"retry_count": 4}' }
            - { id: nested, text: '{"sql_rest_options": {"retry_count": 4}}' }
            - { id: dims, text: '{"dimensions": 1536, "sql_rest_options": {"retry_count": 4}}' }
        - id: vtype
          options:
            - { id: v768, text: VECTOR(768) }
            - { id: v1536, text: VECTOR(1536) }
            - { id: v1998, text: VECTOR(1998) }
    answer:
      values: { params: nested, vtype: v768 }
    explanation:
      correct:
        en: |
          The PARAMETERS clause of AI_GENERATE_EMBEDDINGS overrides, for this call only, the matching keys of the model definition; the retry count is read from sql_rest_options.retry_count (0 to 10), and the dimensions of the definition stay at 768. The question vector therefore has 768 dimensions and must be declared VECTOR(768) to be compared with the stored vectors.
        fr: |
          La clause PARAMETERS d'AI_GENERATE_EMBEDDINGS remplace, pour cet appel uniquement, les clés correspondantes de la définition du modèle ; le nombre de nouvelles tentatives se lit dans sql_rest_options.retry_count (0 à 10), et les dimensions de la définition restent à 768. Le vecteur de la question a donc 768 dimensions et doit être déclaré VECTOR(768) pour être comparé aux vecteurs stockés.
      options:
        flat: { en: "A top-level retry_count is appended to the request body sent to the endpoint; SQL reads the retry count only inside sql_rest_options.", fr: "Un retry_count au premier niveau est ajouté au corps de la requête envoyée au point de terminaison ; SQL ne lit le nombre de nouvelles tentatives que dans sql_rest_options." }
        dims: { en: "Overriding dimensions to 1536 produces vectors that can't be compared with the 768-dimension stored vectors.", fr: "Remplacer dimensions par 1536 produit des vecteurs qui ne peuvent pas être comparés aux vecteurs stockés de 768 dimensions." }
        v1536: { en: "A 768-element array can't be assigned to a VECTOR(1536) variable: the number of elements must equal the dimensions (error 42204).", fr: "Un tableau de 768 éléments ne peut pas être affecté à une variable VECTOR(1536) : le nombre d'éléments doit être égal aux dimensions (erreur 42204)." }
    references:
      - title: AI_GENERATE_EMBEDDINGS (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
      - title: Vector data type
        url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type

  # ------------------------------------------------------------------ 7
  - id: dp800-qz-31-07
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys has an Azure SQL database at compatibility level 170. The dbo.Manuals table has the columns ManualID, Body (nvarchar(max)) and ChunkMethod (varchar(10)), which contains 'FIXED' in every row. You run the following statement, and it fails.

        ```sql
        INSERT INTO dbo.ManualChunks (ManualID, ChunkOrder, ChunkText)
        SELECT m.ManualID, c.chunk_order, c.chunk
        FROM dbo.Manuals AS m
        CROSS APPLY AI_GENERATE_CHUNKS(
            SOURCE = m.Body,
            CHUNK_TYPE = m.ChunkMethod,
            CHUNK_SIZE = 900,
            OVERLAP = 60
        ) AS c;
        ```

        Each chunk must contain 900 characters, and consecutive chunks must share as much text as the function allows.

        Which two changes should you make? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'une base de données Azure SQL au niveau de compatibilité 170. La table dbo.Manuals contient les colonnes ManualID, Body (nvarchar(max)) et ChunkMethod (varchar(10)), qui contient 'FIXED' dans chaque ligne. Vous exécutez l'instruction suivante, et elle échoue.

        ```sql
        INSERT INTO dbo.ManualChunks (ManualID, ChunkOrder, ChunkText)
        SELECT m.ManualID, c.chunk_order, c.chunk
        FROM dbo.Manuals AS m
        CROSS APPLY AI_GENERATE_CHUNKS(
            SOURCE = m.Body,
            CHUNK_TYPE = m.ChunkMethod,
            CHUNK_SIZE = 900,
            OVERLAP = 60
        ) AS c;
        ```

        Chaque bloc doit contenir 900 caractères, et des blocs consécutifs doivent partager autant de texte que la fonction le permet.

        Quelles sont les deux modifications que vous devez apporter ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Replace m.ChunkMethod with FIXED.", fr: "Remplacer m.ChunkMethod par FIXED." } }
        - { id: b, text: { en: "Set CHUNK_SIZE to 225, because the size is a number of tokens.", fr: "Définir CHUNK_SIZE sur 225, car la taille est un nombre de jetons." } }
        - { id: c, text: { en: "Replace CROSS APPLY with OUTER APPLY.", fr: "Remplacer CROSS APPLY par OUTER APPLY." } }
        - { id: d, text: { en: "Set OVERLAP to 50.", fr: "Définir OVERLAP sur 50." } }
        - { id: e, text: { en: "Add ENABLE_CHUNK_SET_ID = 1 so that chunk_order restarts for each manual.", fr: "Ajouter ENABLE_CHUNK_SET_ID = 1 pour que chunk_order recommence pour chaque manuel." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          CHUNK_TYPE must be the literal FIXED: it can't be NULL or a value read from a column, even if the column contains 'FIXED'. OVERLAP is a percentage of CHUNK_SIZE that must be a whole number from 0 to 50, so 60 is rejected and 50 (450 characters here) is the largest overlap allowed.
        fr: |
          CHUNK_TYPE doit être le littéral FIXED : il ne peut être ni NULL ni une valeur lue dans une colonne, même si la colonne contient 'FIXED'. OVERLAP est un pourcentage de CHUNK_SIZE qui doit être un nombre entier de 0 à 50 : 60 est donc rejeté et 50 (ici 450 caractères) est le plus grand chevauchement autorisé.
      options:
        b: { en: "CHUNK_SIZE is a number of characters, so 900 already matches the requirement.", fr: "CHUNK_SIZE est un nombre de caractères : 900 correspond donc déjà à l'exigence." }
        c: { en: "CROSS APPLY is the documented way to call this table-valued function per row; OUTER APPLY doesn't fix either argument.", fr: "CROSS APPLY est la façon documentée d'appeler cette fonction table pour chaque ligne ; OUTER APPLY ne corrige aucun des deux arguments." }
        e: { en: "chunk_order already restarts at 1 for each source row; chunk_set_id only adds a grouping column.", fr: "chunk_order recommence déjà à 1 pour chaque ligne source ; chunk_set_id ajoute seulement une colonne de regroupement." }
    references:
      - title: AI_GENERATE_CHUNKS (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql

  # ------------------------------------------------------------------ 8
  - id: dp800-qz-31-08
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware has an Azure SQL database. The embedding of each product is generated from the following expression and stored in dbo.ProductEmbeddings, which has one row per product and isn't tracked.

        ```sql
        CONCAT(p.Name, N'. ', c.CategoryName, N'. ', p.Description)
        ```

        dbo.Products holds the CategoryID of each product, dbo.Categories has a primary key on CategoryID, and the ListPrice and StockQty columns of dbo.Products are updated many times a day. Change Tracking is enabled on dbo.Products without column tracking. Every 10 minutes, a job reads CHANGETABLE(CHANGES dbo.Products, @last) and regenerates the embeddings of all the inserted and updated products.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'une base de données Azure SQL. L'incorporation de chaque produit est générée à partir de l'expression suivante et stockée dans dbo.ProductEmbeddings, qui contient une ligne par produit et n'est pas suivie.

        ```sql
        CONCAT(p.Name, N'. ', c.CategoryName, N'. ', p.Description)
        ```

        dbo.Products contient le CategoryID de chaque produit, dbo.Categories possède une clé primaire sur CategoryID, et les colonnes ListPrice et StockQty de dbo.Products sont mises à jour de nombreuses fois par jour. Le suivi des modifications est activé sur dbo.Products sans suivi des colonnes. Toutes les 10 minutes, un travail lit CHANGETABLE(CHANGES dbo.Products, @last) et régénère les incorporations de tous les produits insérés et mis à jour.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When a category is renamed in dbo.Categories, the next run of the job regenerates the embeddings of the products of that category.", fr: "Quand une catégorie est renommée dans dbo.Categories, la prochaine exécution du travail régénère les incorporations des produits de cette catégorie." }
        - id: s2
          text: { en: "Each update of StockQty makes the job regenerate the embedding of the product, even though the embedded text is unchanged.", fr: "Chaque mise à jour de StockQty conduit le travail à régénérer l'incorporation du produit, même si le texte incorporé n'a pas changé." }
        - id: s3
          text: { en: "If Change Tracking is also enabled on dbo.Categories, the job can find the products to re-embed by joining the changed CategoryID values to dbo.Products.", fr: "Si le suivi des modifications est aussi activé sur dbo.Categories, le travail peut trouver les produits à réincorporer en joignant les valeurs CategoryID modifiées à dbo.Products." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          The embedded text depends on two tables, but only dbo.Products is tracked: renaming a category changes no product row, so the job never sees it. Tracking dbo.Categories too gives the changed CategoryID values, and a join to dbo.Products lists the products whose text changed. Without column tracking, every update of a row, including StockQty, appears as a change, so the job pays for embeddings whose text didn't change.
        fr: |
          Le texte incorporé dépend de deux tables, mais seule dbo.Products est suivie : renommer une catégorie ne modifie aucune ligne de produit, et le travail ne le voit donc jamais. Suivre aussi dbo.Categories fournit les valeurs CategoryID modifiées, et une jointure à dbo.Products liste les produits dont le texte a changé. Sans suivi des colonnes, chaque mise à jour d'une ligne, y compris de StockQty, apparaît comme une modification : le travail paie donc des incorporations dont le texte n'a pas changé.
      options:
        s1: { en: "The rename only updates dbo.Categories, which isn't tracked, so CHANGETABLE on dbo.Products returns no row for it.", fr: "Le renommage ne met à jour que dbo.Categories, qui n'est pas suivie : CHANGETABLE sur dbo.Products ne retourne donc aucune ligne pour lui." }
    references:
      - title: About Change Tracking (SQL Server)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/about-change-tracking-sql-server
      - title: Design embeddings for SQL database workloads
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/04-design-embeddings-sql-database-workloads

  # ------------------------------------------------------------------ 9
  - id: dp800-qz-31-09
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure SQL Managed Instance that uses the Always-up-to-date update policy. In a database named CatalogDb, a merchandising application edits the descriptions of dbo.Products a few hundred times a day. The embeddings are stored in dbo.ProductEmbeddings, and the search query only reads the rows WHERE Embedding IS NOT NULL.

        You need to maintain the embeddings. The solution must meet the following requirements:

        - A search must never rank a product by a vector computed from an earlier version of its description.
        - A failure or a slowdown of the embedding endpoint must not slow down or fail the writes of the application.
        - A new or changed description must be searchable again within five minutes.

        What should you implement?
      fr: |
        Fabrikam dispose d'une instance Azure SQL Managed Instance qui utilise la stratégie de mise à jour Always-up-to-date. Dans une base de données nommée CatalogDb, une application de merchandising modifie les descriptions de dbo.Products quelques centaines de fois par jour. Les incorporations sont stockées dans dbo.ProductEmbeddings, et la requête de recherche ne lit que les lignes WHERE Embedding IS NOT NULL.

        Vous devez maintenir les incorporations. La solution doit satisfaire les exigences suivantes :

        - Une recherche ne doit jamais classer un produit selon un vecteur calculé à partir d'une version antérieure de sa description.
        - Une défaillance ou un ralentissement du point de terminaison d'incorporation ne doit ni ralentir ni faire échouer les écritures de l'application.
        - Une description nouvelle ou modifiée doit redevenir accessible à la recherche en moins de cinq minutes.

        Que devez-vous implémenter ?
    body:
      options:
        - { id: a, text: { en: "A trigger on dbo.Products that regenerates the changed embeddings with AI_GENERATE_EMBEDDINGS", fr: "Un déclencheur sur dbo.Products qui régénère les incorporations modifiées avec AI_GENERATE_EMBEDDINGS" } }
        - { id: b, text: { en: "Change Tracking on dbo.Products, and an Agent job that regenerates the changed embeddings every minute", fr: "Le suivi des modifications sur dbo.Products, et un travail Agent qui régénère les incorporations modifiées chaque minute" } }
        - { id: c, text: { en: "Change data capture on dbo.Products, and an Agent job that regenerates the changed embeddings every minute", fr: "La capture de données modifiées sur dbo.Products, et un travail Agent qui régénère les incorporations modifiées chaque minute" } }
        - { id: d, text: { en: "A trigger on dbo.Products that sets the changed embeddings to NULL, and an Agent job that fills them every minute", fr: "Un déclencheur sur dbo.Products qui met à NULL les incorporations modifiées, et un travail Agent qui les remplit chaque minute" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Invalidating the vector inside the write transaction is a cheap local update, so the search stops using the old vector at the moment the description changes, and no model call slows down or fails the write. The Agent job then regenerates the NULL embeddings in batches, outside the user's transaction, well within five minutes. The trigger also queues a row without a vector for each new product.
        fr: |
          Invalider le vecteur dans la transaction d'écriture est une mise à jour locale peu coûteuse : la recherche cesse d'utiliser l'ancien vecteur au moment où la description change, et aucun appel au modèle ne ralentit ni ne fait échouer l'écriture. Le travail Agent régénère ensuite par lots les incorporations NULL, hors de la transaction de l'utilisateur, bien en moins de cinq minutes. Le déclencheur ajoute aussi une ligne sans vecteur pour chaque nouveau produit.
      options:
        a: { en: "The trigger calls the model inside the write transaction: a slow or failing endpoint slows down or fails the write.", fr: "Le déclencheur appelle le modèle dans la transaction d'écriture : un point de terminaison lent ou défaillant ralentit ou fait échouer l'écriture." }
        b: { en: "Until the job runs, the old vector stays in place and the search still ranks the product by the earlier description.", fr: "Tant que le travail ne s'est pas exécuté, l'ancien vecteur reste en place et la recherche classe toujours le produit selon l'ancienne description." }
        c: { en: "CDC is asynchronous too: between the change and the job, the search keeps using the vector of the earlier description.", fr: "CDC est aussi asynchrone : entre la modification et le travail, la recherche continue d'utiliser le vecteur de l'ancienne description." }
    references:
      - title: Generate and maintain embeddings for SQL database workloads
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-models-embeddings-with-sql/05-generate-maintain-embeddings-sql-database-workloads

  # ------------------------------------------------------------------ 10
  - id: dp800-qz-31-10
    objective: "3.1.1"
    difficulty: 3
    status: draft
    shuffle: false
    type: dropdown
    stem:
      en: |
        Contoso runs SQL Server 2025 on-premises. A knowledge base will store 20 million chunks of documents written in nine languages. After an evaluation, the team selected text-embedding-3-large, deployed as embed-large in Azure OpenAI.

        You need to create the external model and the table that stores the chunks. The solution must meet the following requirements:

        - Preview features must stay disabled.
        - The vector values must use at most 90 GB, excluding row overhead and indexes.
        - Every generated embedding must fit the column.
        - Keep the largest number of dimensions that meets the other requirements.

        How should you complete the statements? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exécute SQL Server 2025 en local. Une base de connaissances stockera 20 millions de blocs de documents rédigés en neuf langues. Après une évaluation, l'équipe a retenu text-embedding-3-large, déployé sous le nom embed-large dans Azure OpenAI.

        Vous devez créer le modèle externe et la table qui stocke les blocs. La solution doit satisfaire les exigences suivantes :

        - Les fonctionnalités en préversion doivent rester désactivées.
        - Les valeurs des vecteurs doivent occuper au plus 90 Go, hors surcharge des lignes et index.
        - Chaque incorporation générée doit tenir dans la colonne.
        - Conserver le plus grand nombre de dimensions qui satisfait les autres exigences.

        Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        CREATE EXTERNAL MODEL KbEmbedder
        WITH (
            LOCATION = 'https://contoso-ai.openai.azure.com/openai/deployments/embed-large/embeddings?api-version=2024-02-01',
            API_FORMAT = 'Azure OpenAI',
            MODEL_TYPE = EMBEDDINGS,
            MODEL = 'text-embedding-3-large',
            CREDENTIAL = [https://contoso-ai.openai.azure.com/],
            PARAMETERS = '{"dimensions": [[dims]]}'
        );
        GO
        CREATE TABLE dbo.KbChunks
        (
            ChunkID   bigint IDENTITY NOT NULL PRIMARY KEY,
            DocID     int NOT NULL,
            ChunkText nvarchar(max) NOT NULL,
            Embedding [[col]] NULL
        );
      slots:
        - id: dims
          options:
            - { id: d768, text: "768" }
            - { id: d1024, text: "1024" }
            - { id: d1536, text: "1536" }
            - { id: d3072, text: "3072" }
        - id: col
          options:
            - { id: c1024, text: VECTOR(1024) }
            - { id: c1024h, text: "VECTOR(1024, float16)" }
            - { id: c1536h, text: "VECTOR(1536, float16)" }
            - { id: c3072h, text: "VECTOR(3072, float16)" }
    answer:
      values: { dims: d1024, col: c1024 }
    explanation:
      correct:
        en: |
          On SQL Server 2025, float16 vectors are a preview feature, so the column must use the default float32 base type, which accepts at most 1,998 dimensions and stores 4 bytes per dimension. 1,536 dimensions would need 20 million × 1,536 × 4 bytes, about 123 GB; 1,024 dimensions need about 82 GB, within the limit. text-embedding-3-large accepts the dimensions parameter, so the model returns exactly the 1,024 dimensions of the VECTOR(1024) column.
        fr: |
          Sur SQL Server 2025, les vecteurs float16 sont une fonctionnalité en préversion : la colonne doit donc utiliser le type de base float32 par défaut, qui accepte au plus 1 998 dimensions et stocke 4 octets par dimension. 1 536 dimensions demanderaient 20 millions × 1 536 × 4 octets, soit environ 123 Go ; 1 024 dimensions demandent environ 82 Go, dans la limite. text-embedding-3-large accepte le paramètre dimensions : le modèle retourne donc exactement les 1 024 dimensions de la colonne VECTOR(1024).
      options:
        d768: { en: "768 dimensions fit, but 1,024 also fit within 90 GB and keep more dimensions.", fr: "768 dimensions tiennent, mais 1 024 tiennent aussi dans 90 Go et conservent davantage de dimensions." }
        d1536: { en: "In float32, 1,536 dimensions need about 123 GB for 20 million vectors.", fr: "En float32, 1 536 dimensions demandent environ 123 Go pour 20 millions de vecteurs." }
        d3072: { en: "3,072 dimensions exceed the 1,998 of float32 and would need float16, a preview feature on SQL Server 2025.", fr: "3 072 dimensions dépassent les 1 998 de float32 et exigeraient float16, une fonctionnalité en préversion sur SQL Server 2025." }
        c1024h: { en: "float16 requires PREVIEW_FEATURES = ON on SQL Server 2025.", fr: "float16 exige PREVIEW_FEATURES = ON sur SQL Server 2025." }
    references:
      - title: Vector data type
        url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type
      - title: Foundry Models sold by Azure
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
