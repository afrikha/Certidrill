chapter: 23-cicd-database-projects
questions:
  # ------------------------------------------------------------------ 1
  - id: dp800-qz-23-01
    objective: "2.3.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso is adding an SDK-style SQL database project named **CrmDb** to a new Git repository. Six developers will change tables, views and stored procedures in parallel feature branches.

        You need to organize the object scripts so that a change to one object touches only one file and merge conflicts stay rare.

        How should you organize the scripts?
      fr: |
        Contoso ajoute un projet de base de données SQL de style SDK nommé **CrmDb** à un nouveau dépôt Git. Six développeurs vont modifier des tables, des vues et des procédures stockées dans des branches de fonctionnalité parallèles.

        Vous devez organiser les scripts d'objets pour qu'une modification d'un objet ne touche qu'un seul fichier et que les conflits de fusion restent rares.

        Comment devez-vous organiser les scripts ?
    body:
      options:
        - { id: a, text: { en: "One .sql file per schema, which contains the CREATE statements of every object of that schema", fr: "Un fichier .sql par schéma, qui contient les instructions CREATE de tous les objets de ce schéma" } }
        - { id: b, text: { en: "One .sql file per object type, such as Tables.sql and Views.sql, which contains every object of that type", fr: "Un fichier .sql par type d'objet, comme Tables.sql et Views.sql, qui contient tous les objets de ce type" } }
        - { id: c, text: { en: "One .sql file per object, in folders by schema and object type, such as Tables/Customer.sql", fr: "Un fichier .sql par objet, dans des dossiers par schéma et type d'objet, comme Tables/Customer.sql" } }
        - { id: d, text: { en: "One CreateDatabase.sql file, which contains every object in dependency order", fr: "Un fichier CreateDatabase.sql, qui contient tous les objets dans l'ordre des dépendances" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A SQL database project keeps one object per file, organized in folders by schema and object type. A change to the Customer table then modifies only Tables/Customer.sql, so two developers who change different objects never edit the same file, and the history of each object stays readable.
        fr: |
          Un projet de base de données SQL conserve un objet par fichier, organisé dans des dossiers par schéma et type d'objet. Une modification de la table Customer ne touche alors que Tables/Customer.sql : deux développeurs qui modifient des objets différents ne modifient jamais le même fichier, et l'historique de chaque objet reste lisible.
      options:
        a: { en: "A file per schema groups many objects: two developers who change different tables of dbo edit the same file and conflict.", fr: "Un fichier par schéma regroupe de nombreux objets : deux développeurs qui modifient des tables différentes de dbo modifient le même fichier et entrent en conflit." }
        b: { en: "A file per object type puts every table in one file, so any two table changes in parallel branches touch the same file.", fr: "Un fichier par type d'objet place toutes les tables dans un seul fichier : deux modifications de tables dans des branches parallèles touchent le même fichier." }
        d: { en: "A single creation script is the opposite of the project model: every change edits the same file, and the build already resolves the dependency order.", fr: "Un script de création unique est l'inverse du modèle de projet : chaque modification touche le même fichier, et le build résout déjà l'ordre des dépendances." }
    references:
      - title: Configure Source Control and Manage Reference Data - Training
        url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/03-configure-source-control-manage-reference-data

  # ------------------------------------------------------------------ 2
  - id: dp800-qz-23-02
    objective: "2.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer at Fabrikam works on a Linux computer that has the .NET 8 SDK and no other SQL tool. The developer runs `dotnet new sqlproj -n OrdersDb` to create an SDK-style SQL database project, and the command fails because no installed template matches `sqlproj`.

        Which command should the developer run first?
      fr: |
        Un développeur de Fabrikam travaille sur un ordinateur Linux qui dispose du SDK .NET 8 et d'aucun autre outil SQL. Le développeur exécute `dotnet new sqlproj -n OrdersDb` pour créer un projet de base de données SQL de style SDK, et la commande échoue, car aucun modèle installé ne correspond à `sqlproj`.

        Quelle commande le développeur doit-il exécuter d'abord ?
    body:
      options:
        - { id: a, text: "`dotnet tool install -g Microsoft.SqlPackage`" }
        - { id: b, text: "`dotnet add package Microsoft.Build.Sql`" }
        - { id: c, text: "`dotnet new update`" }
        - { id: d, text: "`dotnet new install Microsoft.Build.Sql.Templates`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The sqlproj template comes from the Microsoft.Build.Sql.Templates package, which `dotnet new install` adds to the .NET SDK. `dotnet new sqlproj` then creates a project file based on the Microsoft.Build.Sql SDK, which `dotnet build` turns into a .dacpac file on Windows, Linux or macOS.
        fr: |
          Le modèle sqlproj vient du package Microsoft.Build.Sql.Templates, que `dotnet new install` ajoute au SDK .NET. `dotnet new sqlproj` crée alors un fichier projet basé sur le SDK Microsoft.Build.Sql, que `dotnet build` transforme en fichier .dacpac sous Windows, Linux ou macOS.
      options:
        a: { en: "This installs SqlPackage, which deploys and extracts .dacpac files; it adds no project template.", fr: "Cette commande installe SqlPackage, qui déploie et extrait des fichiers .dacpac ; elle n'ajoute aucun modèle de projet." }
        b: { en: "dotnet add package adds a NuGet reference to an existing project; there is no project yet, and it installs no template.", fr: "dotnet add package ajoute une référence NuGet à un projet existant ; il n'y a pas encore de projet, et la commande n'installe aucun modèle." }
        c: { en: "dotnet new update updates the templates already installed; it doesn't install a template that is missing.", fr: "dotnet new update met à jour les modèles déjà installés ; elle n'installe pas un modèle absent." }
    references:
      - title: Get Started with SQL Database Projects - SQL Server
        url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/get-started

  # ------------------------------------------------------------------ 3
  - id: dp800-qz-23-03
    objective: "2.3.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware deploys an SDK-style SQL database project named **LedgerDb** to production after each merge into main, by publishing the .dacpac file with SqlPackage and the default publish properties.

        A weekly drift check shows that someone altered the stored procedure **dbo.usp_PostEntry** directly in the production database. The change wasn't approved and must be discarded: the procedure must match its definition in main again.

        You need to resolve the drift with the least effort. What should you do?
      fr: |
        Litware déploie un projet de base de données SQL de style SDK nommé **LedgerDb** en production après chaque fusion dans main, en publiant le fichier .dacpac avec SqlPackage et les propriétés de publication par défaut.

        Une vérification hebdomadaire de la dérive montre que quelqu'un a modifié la procédure stockée **dbo.usp_PostEntry** directement dans la base de production. Cette modification n'a pas été approuvée et doit être abandonnée : la procédure doit de nouveau correspondre à sa définition dans main.

        Vous devez résoudre la dérive avec un minimum d'effort. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run a schema comparison from the production database to the project, and apply the differences to the project", fr: "Exécuter une comparaison de schémas de la base de production vers le projet, et appliquer les différences au projet" } }
        - { id: b, text: { en: "Publish the current .dacpac file built from main to the production database again", fr: "Publier de nouveau en production le fichier .dacpac actuel généré à partir de main" } }
        - { id: c, text: { en: "Publish the current .dacpac file with /p:DropObjectsNotInSource=true to drop and re-create the procedure", fr: "Publier le fichier .dacpac actuel avec /p:DropObjectsNotInSource=true pour supprimer et recréer la procédure" } }
        - { id: d, text: { en: "Extract the production schema into the project folder with SqlPackage, and commit the extracted files to main", fr: "Extraire le schéma de production dans le dossier du projet avec SqlPackage, et valider les fichiers extraits dans main" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A publish compares the .dacpac file with the target and generates the statements that bring the target to the state of the project, so it alters dbo.usp_PostEntry back to the definition in main. An unauthorized change is resolved by overwriting it with the next deployment; no project file has to change.
        fr: |
          Une publication compare le fichier .dacpac à la cible et génère les instructions qui ramènent la cible à l'état du projet : elle modifie donc dbo.usp_PostEntry pour revenir à la définition de main. Une modification non autorisée se résout en l'écrasant par le déploiement suivant ; aucun fichier du projet n'a à changer.
      options:
        a: { en: "Applying the database-to-project comparison copies the unauthorized change into the project: it keeps the change instead of discarding it.", fr: "Appliquer la comparaison base vers projet copie la modification non autorisée dans le projet : elle la conserve au lieu de l'abandonner." }
        c: { en: "DropObjectsNotInSource drops target objects that aren't in the project; the procedure is in the project, and the option could drop other objects.", fr: "DropObjectsNotInSource supprime les objets de la cible absents du projet ; la procédure est dans le projet, et l'option pourrait supprimer d'autres objets." }
        d: { en: "Extracting production into the project and committing it makes the unauthorized definition the new source of truth.", fr: "Extraire la production dans le projet et la valider fait de la définition non autorisée la nouvelle source de vérité." }
    references:
      - title: SqlPackage - SQL Server
        url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage
      - title: Detect and Resolve Schema Drift - Training
        url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/05-detect-resolve-schema-drift

  # ------------------------------------------------------------------ 4
  - id: dp800-qz-23-04
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has a SQL Server unit test for the scalar function **dbo.fn_LoyaltyDiscount**. The pre-test script inserts a Gold customer with the CustomerID 42, and the test script runs the following statement.

        ```sql
        SELECT dbo.fn_LoyaltyDiscount(42) AS Discount;
        ```

        The test must pass only if the function returns 15.00 for this customer.

        Which test condition should you add to the test?
      fr: |
        Woodgrove dispose d'un test unitaire SQL Server pour la fonction scalaire **dbo.fn_LoyaltyDiscount**. Le script de prétest insère un client Gold avec le CustomerID 42, et le script de test exécute l'instruction suivante.

        ```sql
        SELECT dbo.fn_LoyaltyDiscount(42) AS Discount;
        ```

        Le test doit réussir uniquement si la fonction renvoie 15.00 pour ce client.

        Quelle condition de test devez-vous ajouter au test ?
    body:
      options:
        - { id: a, text: Row Count }
        - { id: b, text: Expected Schema }
        - { id: c, text: Not Empty ResultSet }
        - { id: d, text: Scalar Value }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Scalar Value compares one value of the result set, identified by its row and column, with an expected value. Set to 15.00 on row 1, column 1, it makes the test fail for any other discount, which is exactly the result of the function that must be verified.
        fr: |
          Scalar Value compare une valeur du jeu de résultats, désignée par sa ligne et sa colonne, à une valeur attendue. Définie à 15.00 sur la ligne 1, colonne 1, elle fait échouer le test pour toute autre remise : c'est exactement le résultat de la fonction à vérifier.
      options:
        a: { en: "Row Count checks the number of rows; the statement always returns one row, whatever the discount.", fr: "Row Count vérifie le nombre de lignes ; l'instruction renvoie toujours une ligne, quelle que soit la remise." }
        b: { en: "Expected Schema checks the column names and data types of the result set, not the values.", fr: "Expected Schema vérifie les noms et les types de données des colonnes du jeu de résultats, pas les valeurs." }
        c: { en: "Not Empty ResultSet only checks that at least one row is returned; a wrong discount would pass.", fr: "Not Empty ResultSet vérifie seulement qu'au moins une ligne est renvoyée ; une remise fausse réussirait le test." }
    references:
      - title: Using Test Conditions in SQL Server Unit Tests - SQL Server Data Tools (SSDT)
        url: https://learn.microsoft.com/en-us/sql/ssdt/using-test-conditions-in-sql-server-unit-tests

  # ------------------------------------------------------------------ 5
  - id: dp800-qz-23-05
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind keeps the rows of the **dbo.ShipMethod** lookup table in a `MERGE` statement that the post-deployment script of a SQL database project includes. ShipMethodID is the primary key. The statement ends with the following clause.

        ```sql
        WHEN NOT MATCHED BY SOURCE THEN
            DELETE;
        ```

        Operators now add their own shipping methods directly in production. These rows always have a ShipMethodID of 1000 or more, and they must survive every deployment. Rows with a ShipMethodID lower than 1000 that are removed from Git must still be deleted.

        What should you do?
      fr: |
        Northwind conserve les lignes de la table de recherche **dbo.ShipMethod** dans une instruction `MERGE` que le script de post-déploiement d'un projet de base de données SQL inclut. ShipMethodID est la clé primaire. L'instruction se termine par la clause suivante.

        ```sql
        WHEN NOT MATCHED BY SOURCE THEN
            DELETE;
        ```

        Les opérateurs ajoutent désormais leurs propres modes d'expédition directement en production. Ces lignes ont toujours un ShipMethodID de 1000 ou plus, et elles doivent survivre à chaque déploiement. Les lignes dont le ShipMethodID est inférieur à 1000 et qui sont retirées de Git doivent toujours être supprimées.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Remove the WHEN NOT MATCHED BY SOURCE clause from the MERGE statement", fr: "Supprimer la clause WHEN NOT MATCHED BY SOURCE de l'instruction MERGE" } }
        - { id: b, text: { en: "Add the condition AND target.ShipMethodID < 1000 to the WHEN NOT MATCHED BY SOURCE clause", fr: "Ajouter la condition AND target.ShipMethodID < 1000 à la clause WHEN NOT MATCHED BY SOURCE" } }
        - { id: c, text: { en: "Replace the MERGE statement with INSERT statements for the rows defined in Git", fr: "Remplacer l'instruction MERGE par des instructions INSERT pour les lignes définies dans Git" } }
        - { id: d, text: { en: "Add /p:DropObjectsNotInSource=false to the SqlPackage publish command", fr: "Ajouter /p:DropObjectsNotInSource=false à la commande de publication SqlPackage" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A `WHEN NOT MATCHED BY SOURCE` clause accepts an additional search condition on the target rows. With `AND target.ShipMethodID < 1000`, the statement deletes only the Git-managed rows that disappeared from the source, and the operator rows, which are never in the source, are left untouched on every deployment.
        fr: |
          Une clause `WHEN NOT MATCHED BY SOURCE` accepte une condition de recherche supplémentaire sur les lignes de la cible. Avec `AND target.ShipMethodID < 1000`, l'instruction ne supprime que les lignes gérées dans Git qui ont disparu de la source, et les lignes des opérateurs, qui ne sont jamais dans la source, restent intactes à chaque déploiement.
      options:
        a: { en: "Without the clause, the operator rows survive, but rows removed from Git are no longer deleted, which breaks the second requirement.", fr: "Sans la clause, les lignes des opérateurs survivent, mais les lignes retirées de Git ne sont plus supprimées, ce qui enfreint la seconde exigence." }
        c: { en: "Plain INSERT statements fail with a duplicate key on the next deployment, and they never update or delete rows.", fr: "De simples instructions INSERT échouent sur une clé en double au déploiement suivant, et elles ne mettent jamais à jour ni ne suppriment de lignes." }
        d: { en: "DropObjectsNotInSource concerns schema objects, not table rows; false is already the default, and the MERGE still deletes the operator rows.", fr: "DropObjectsNotInSource concerne les objets du schéma, pas les lignes des tables ; false est déjà la valeur par défaut, et le MERGE supprime toujours les lignes des opérateurs." }
    references:
      - title: MERGE (Transact-SQL) - SQL Server
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/merge-transact-sql

  # ------------------------------------------------------------------ 6
  - id: dp800-qz-23-06
    objective: "2.3.8"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware deploys an SDK-style SQL database project named **ClaimsDb** with a GitHub Actions workflow. The GitHub environments **test** and **production** each define an environment secret named SQL_CONNECTION_STRING. The workflow must meet the following requirements:

        - The project is built once per run.
        - The production database receives exactly the .dacpac file that was published to the test database.
        - The production deployment starts only after the test deployment succeeds.

        How should you complete the workflow? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware déploie un projet de base de données SQL de style SDK nommé **ClaimsDb** avec un workflow GitHub Actions. Les environnements GitHub **test** et **production** définissent chacun un secret d'environnement nommé SQL_CONNECTION_STRING. Le workflow doit satisfaire les exigences suivantes :

        - Le projet est généré une seule fois par exécution.
        - La base de production reçoit exactement le fichier .dacpac qui a été publié dans la base de test.
        - Le déploiement en production ne démarre qu'après la réussite du déploiement de test.

        Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - run: dotnet build ./ClaimsDb/ClaimsDb.sqlproj -o ./out
              - uses: [[keep]]
                with: { name: dacpac, path: ./out/ClaimsDb.dacpac }
          deploy-test:
            needs: build
            runs-on: ubuntu-latest
            environment: test
            steps:
              - uses: [[get]]
                with: { name: dacpac }
              - uses: azure/login@v2
                with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              - uses: azure/sql-action@v2.3
                with:
                  connection-string: ${{ secrets.SQL_CONNECTION_STRING }}
                  path: ./ClaimsDb.dacpac
                  action: publish
          deploy-prod:
            needs: [[after]]
            runs-on: ubuntu-latest
            environment: production
            steps:
              # the same three steps as deploy-test
      slots:
        - id: keep
          options:
            - { id: kupload, text: actions/upload-artifact@v4 }
            - { id: kcache, text: actions/cache@v4 }
            - { id: kdownload, text: actions/download-artifact@v4 }
            - { id: kcheckout, text: actions/checkout@v4 }
        - id: get
          options:
            - { id: gupload, text: actions/upload-artifact@v4 }
            - { id: gcache, text: actions/cache@v4 }
            - { id: gdownload, text: actions/download-artifact@v4 }
            - { id: gcheckout, text: actions/checkout@v4 }
        - id: after
          options:
            - { id: build, text: build }
            - { id: deploytest, text: deploy-test }
            - { id: envtest, text: test }
    answer:
      values: { keep: kupload, get: gdownload, after: deploytest }
    explanation:
      correct:
        en: |
          The build job uploads the .dacpac file as an artifact of the run, and each deployment job downloads that same artifact: the project is built once, and production receives the file that was tested. `needs: deploy-test` makes deploy-prod wait for the test deployment and skips it if that job fails, while each job reads the SQL_CONNECTION_STRING secret of its own environment.
        fr: |
          Le job build charge le fichier .dacpac comme artefact de l'exécution, et chaque job de déploiement télécharge ce même artefact : le projet est généré une seule fois, et la production reçoit le fichier testé. `needs: deploy-test` fait attendre deploy-prod jusqu'au déploiement de test et l'ignore si ce job échoue, tandis que chaque job lit le secret SQL_CONNECTION_STRING de son propre environnement.
      options:
        kcache: { en: "actions/cache stores dependencies to speed up later runs; it isn't the way to hand a build output to the other jobs of the run.", fr: "actions/cache stocke des dépendances pour accélérer les exécutions suivantes ; ce n'est pas le moyen de transmettre un produit de build aux autres jobs de l'exécution." }
        kdownload: { en: "The build job produces the file: it must upload it, not download it.", fr: "Le job build produit le fichier : il doit le charger, pas le télécharger." }
        gcheckout: { en: "A checkout gets the source files of the repository, not the .dacpac file built by the build job; publishing would need a second build.", fr: "Une extraction récupère les fichiers sources du dépôt, pas le fichier .dacpac généré par le job build ; la publication exigerait un second build." }
        gcache: { en: "actions/cache restores cached dependencies by key; the artifact uploaded by the build job is retrieved with download-artifact.", fr: "actions/cache restaure des dépendances mises en cache par clé ; l'artefact chargé par le job build se récupère avec download-artifact." }
        build: { en: "With needs: build, deploy-prod starts as soon as the build succeeds, in parallel with deploy-test and even if the test deployment fails.", fr: "Avec needs: build, deploy-prod démarre dès la réussite du build, en parallèle de deploy-test et même si le déploiement de test échoue." }
        envtest: { en: "needs takes job ids; test is the name of an environment, not of a job.", fr: "needs prend des ID de jobs ; test est le nom d'un environnement, pas d'un job." }
    references:
      - title: Implement CI/CD Pipelines - Training
        url: https://learn.microsoft.com/en-us/training/modules/implement-cicd-sql-database-projects/06-implement-cicd-pipelines

  # ------------------------------------------------------------------ 7
  - id: dp800-qz-23-07
    objective: "2.3.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum stores an SDK-style SQL database project named **HRDb** in an Azure Repos Git repository. The **main** branch has two required branch policies: a minimum of one reviewer, and a build validation policy for the pipeline **hrdb-ci**, which runs `dotnet build` with automatic trigger.

        Dana's pull request from **feature/badge-number** adds a BadgeNumber column to **Tables/Employee.sql**. hrdb-ci succeeded on it yesterday. This morning, another pull request was completed: it renamed the column EmpName to FullName by using the rename refactoring of the SQL Database Projects extension. Dana's pull request now shows a merge conflict in Tables/Employee.sql.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum stocke un projet de base de données SQL de style SDK nommé **HRDb** dans un dépôt Git Azure Repos. La branche **main** a deux stratégies de branche obligatoires : un minimum d'un relecteur, et une stratégie de validation du build pour le pipeline **hrdb-ci**, qui exécute `dotnet build` avec un déclenchement automatique.

        La pull request de Dana depuis **feature/badge-number** ajoute une colonne BadgeNumber à **Tables/Employee.sql**. hrdb-ci a réussi sur cette pull request hier. Ce matin, une autre pull request a été terminée : elle a renommé la colonne EmpName en FullName à l'aide de la refactorisation de renommage de l'extension SQL Database Projects. La pull request de Dana affiche maintenant un conflit de fusion dans Tables/Employee.sql.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Dana can resolve the conflict by pulling main into feature/badge-number, keeping FullName and BadgeNumber in the CREATE TABLE statement, committing and pushing the branch; the pull request then contains the new commits.", fr: "Dana peut résoudre le conflit en tirant main dans feature/badge-number, en gardant FullName et BadgeNumber dans l'instruction CREATE TABLE, puis en validant et en envoyant la branche ; la pull request contient alors les nouveaux commits." }
        - id: s2
          text: { en: "After Dana pushes the merge commit, the pull request can be completed on the strength of yesterday's successful hrdb-ci run.", fr: "Après l'envoi du commit de fusion par Dana, la pull request peut être terminée sur la base de l'exécution réussie de hrdb-ci d'hier." }
        - id: s3
          text: { en: "After the merge, the .refactorlog file of Dana's branch contains the rename, so a deployment of her branch renames EmpName instead of dropping it and adding FullName.", fr: "Après la fusion, le fichier .refactorlog de la branche de Dana contient le renommage : un déploiement de sa branche renomme donc EmpName au lieu de la supprimer et d'ajouter FullName." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A conflict is resolved in the feature branch: pull main, keep both changes in one valid statement, commit and push; the pull request is updated with the new commits. Each push updates the pull request, so the build validation policy requires a new hrdb-ci run on the updated code, and the automatic trigger queues it. The rename refactoring recorded the rename in the .refactorlog file, which the merge of main brings into Dana's branch, so the deployment renames the column and keeps its data.
        fr: |
          Un conflit se résout dans la branche de fonctionnalité : tirer main, garder les deux modifications dans une seule instruction valide, valider et envoyer ; la pull request est mise à jour avec les nouveaux commits. Chaque envoi met à jour la pull request : la stratégie de validation du build exige alors une nouvelle exécution de hrdb-ci sur le code mis à jour, et le déclenchement automatique la met en file d'attente. La refactorisation de renommage a enregistré le renommage dans le fichier .refactorlog, que la fusion de main apporte dans la branche de Dana : le déploiement renomme donc la colonne et conserve ses données.
      options:
        s2: { en: "Yesterday's run built the previous version of the branch. The policy needs a successful build of the updated pull request, which also proves that the merged project still builds.", fr: "L'exécution d'hier a généré l'ancienne version de la branche. La stratégie exige un build réussi de la pull request mise à jour, qui prouve aussi que le projet fusionné se génère toujours." }
    references:
      - title: Set and manage branch policies - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies
      - title: SQL Database Projects Refactor Overview - SQL Server
        url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/refactor-overview

  # ------------------------------------------------------------------ 8
  - id: dp800-qz-23-08
    objective: "2.3.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin deploys an SDK-style SQL database project with an Azure Pipelines YAML pipeline that runs SqlPackage. The post-deployment script creates a database scoped credential for a partner REST API by using the SQLCMD variable **$(PartnerApiKey)**.

        In a pull request, a developer proposes to declare PartnerApiKey in the project file with the production key as its default value. The key has never been committed. It is stored as the secret **PartnerApiKey** in an Azure key vault named **kv-tailspin-prod**.

        You need to ensure that the key is never stored in the repository and that each deployment uses the current version of the secret in kv-tailspin-prod.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin déploie un projet de base de données SQL de style SDK avec un pipeline YAML Azure Pipelines qui exécute SqlPackage. Le script de post-déploiement crée des informations d'identification délimitées à la base de données (database scoped credential) pour l'API REST d'un partenaire à l'aide de la variable SQLCMD **$(PartnerApiKey)**.

        Dans une pull request, un développeur propose de déclarer PartnerApiKey dans le fichier projet avec la clé de production comme valeur par défaut. La clé n'a jamais été validée dans le dépôt. Elle est stockée comme secret **PartnerApiKey** dans un coffre de clés Azure Key Vault nommé **kv-tailspin-prod**.

        Vous devez faire en sorte que la clé ne soit jamais stockée dans le dépôt et que chaque déploiement utilise la version actuelle du secret de kv-tailspin-prod.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Declare PartnerApiKey in the project file without a default value, and pass /v:PartnerApiKey on the SqlPackage publish command.", fr: "Déclarer PartnerApiKey dans le fichier projet sans valeur par défaut, et passer /v:PartnerApiKey dans la commande de publication SqlPackage." } }
        - { id: b, text: { en: "Link a variable group to kv-tailspin-prod, select the PartnerApiKey secret, and reference the group in the pipeline.", fr: "Lier un groupe de variables à kv-tailspin-prod, sélectionner le secret PartnerApiKey, puis référencer le groupe dans le pipeline." } }
        - { id: c, text: { en: "Store the key as the value of PartnerApiKey in the Prod.publish.xml publish profile that the pipeline passes to SqlPackage.", fr: "Stocker la clé comme valeur de PartnerApiKey dans le profil de publication Prod.publish.xml que le pipeline passe à SqlPackage." } }
        - { id: d, text: { en: "Define PartnerApiKey as a variable in the variables section of azure-pipelines.yml, and map it to the publish step.", fr: "Définir PartnerApiKey comme variable dans la section variables d'azure-pipelines.yml, puis la mapper sur l'étape de publication." } }
        - { id: e, text: { en: "Replace $(PartnerApiKey) with the key in a script that the post-deployment script includes and that the build excludes.", fr: "Remplacer $(PartnerApiKey) par la clé dans un script que le script de post-déploiement inclut et que le build exclut." } }
      choose: 2
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          A SQLCMD variable declared without a default value carries no secret in the project file; a default value would be stored in the .sqlproj file, and command-line deployments don't even use it. The value is supplied at deployment with /v:PartnerApiKey=... . A variable group linked to the key vault maps the vault's secrets to secret pipeline variables, read from the vault at each run, so the publish step always passes the current version of the key.
        fr: |
          Une variable SQLCMD déclarée sans valeur par défaut ne porte aucun secret dans le fichier projet ; une valeur par défaut serait stockée dans le fichier .sqlproj, et les déploiements en ligne de commande ne l'utilisent même pas. La valeur est fournie au déploiement avec /v:PartnerApiKey=... . Un groupe de variables lié au coffre de clés associe les secrets du coffre à des variables secrètes du pipeline, lues dans le coffre à chaque exécution : l'étape de publication passe donc toujours la version actuelle de la clé.
      options:
        c: { en: "Publish profiles are committed with the project; a key in Prod.publish.xml is stored in the repository.", fr: "Les profils de publication sont validés avec le projet ; une clé dans Prod.publish.xml est stockée dans le dépôt." }
        d: { en: "A value written in azure-pipelines.yml is stored in the repository in clear text and doesn't follow the key vault.", fr: "Une valeur écrite dans azure-pipelines.yml est stockée dans le dépôt en clair et ne suit pas le coffre de clés." }
        e: { en: "Writing the key into an included script stores it in the repository, even if the build excludes the file from the model.", fr: "Écrire la clé dans un script inclus la stocke dans le dépôt, même si le build exclut le fichier du modèle." }
    references:
      - title: SQLCMD Variables in SQL Projects - SQL Server
        url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/sqlcmd-variables
      - title: Link a variable group to secrets in Azure Key Vault - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/link-variable-groups-to-key-vaults

  # ------------------------------------------------------------------ 9
  - id: dp800-qz-23-09
    objective: "2.3.9"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip stores an SDK-style SQL database project in an Azure Repos Git repository. The YAML pipeline **db-ci** builds the project and runs the code analysis rules. A developer added the following trigger to the YAML file of db-ci in main:

        ```yaml
        pr:
          branches:
            include: [ main ]
        ```

        Pull requests into main still don't run db-ci, and a pull request whose project doesn't build can be completed.

        You need every pull request into main to run db-ci on the proposed changes, and to block the completion of the pull request until db-ci succeeds. What should you do?
      fr: |
        Wingtip stocke un projet de base de données SQL de style SDK dans un dépôt Git Azure Repos. Le pipeline YAML **db-ci** génère le projet et exécute les règles d'analyse du code. Un développeur a ajouté le déclencheur suivant au fichier YAML de db-ci dans main :

        ```yaml
        pr:
          branches:
            include: [ main ]
        ```

        Les pull requests vers main n'exécutent toujours pas db-ci, et une pull request dont le projet ne se génère pas peut être terminée.

        Vous devez faire en sorte que chaque pull request vers main exécute db-ci sur les modifications proposées, et bloquer la fin de la pull request jusqu'à la réussite de db-ci. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace the pr trigger with a trigger section that includes the main branch", fr: "Remplacer le déclencheur pr par une section trigger qui inclut la branche main" } }
        - { id: b, text: { en: "Add a condition on Build.Reason equal to PullRequest to the job of db-ci", fr: "Ajouter au job de db-ci une condition sur Build.Reason égal à PullRequest" } }
        - { id: c, text: { en: "Add a build validation branch policy for db-ci on main, with the Required setting", fr: "Ajouter sur main une stratégie de branche de validation du build pour db-ci, avec le paramètre Required" } }
        - { id: d, text: { en: "Add an Approvals check on the environment that the db-ci pipeline targets", fr: "Ajouter une vérification Approvals sur l'environnement que cible le pipeline db-ci" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          YAML pr triggers apply to GitHub and Bitbucket Cloud repositories; for Azure Repos Git, pull request builds come from a build validation branch policy. A Required build validation policy on main queues db-ci on the merge result of each pull request and blocks completion until the build succeeds.
        fr: |
          Les déclencheurs pr YAML s'appliquent aux dépôts GitHub et Bitbucket Cloud ; pour Azure Repos Git, les builds de pull request viennent d'une stratégie de branche de validation du build. Une stratégie de validation du build Required sur main met db-ci en file d'attente sur le résultat de fusion de chaque pull request et bloque la fin jusqu'à la réussite du build.
      options:
        a: { en: "A trigger section starts a CI run after commits are pushed to main, that is after the pull request is completed: it neither validates nor blocks it.", fr: "Une section trigger démarre une exécution CI après l'envoi de commits dans main, c'est-à-dire après la fin de la pull request : elle ne la valide ni ne la bloque." }
        b: { en: "A condition only decides whether a job runs once the pipeline has started; it doesn't start the pipeline for pull requests and blocks nothing.", fr: "Une condition décide seulement si un job s'exécute une fois le pipeline démarré ; elle ne démarre pas le pipeline pour les pull requests et ne bloque rien." }
        d: { en: "An environment check pauses a deployment job that targets the environment; it doesn't run a build when a pull request is created.", fr: "Une vérification d'environnement met en pause un job de déploiement qui cible l'environnement ; elle n'exécute pas de build à la création d'une pull request." }
    references:
      - title: Build Azure Repos Git repositories - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git
      - title: Set and manage branch policies - Azure Repos
        url: https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies

  # ------------------------------------------------------------------ 10
  - id: dp800-qz-23-10
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has an SDK-style SQL database project named **PaymentsDb** with the following property:

        `<DSP>Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider</DSP>`

        The pipeline builds PaymentsDb once and publishes the same .dacpac file to every environment. Production is an Azure SQL database. For integration tests, a pipeline step starts a SQL Server 2022 container on the build agent and publishes the .dacpac file to it with SqlPackage. This step fails because the target platform isn't compatible with the platform of the project.

        The solution must meet the following requirements:

        - The build keeps validating the code against Azure SQL Database.
        - The integration tests run on the .dacpac file that reaches production.
        - The production publish keeps its current platform check.

        What should you do?
      fr: |
        Woodgrove dispose d'un projet de base de données SQL de style SDK nommé **PaymentsDb** avec la propriété suivante :

        `<DSP>Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider</DSP>`

        Le pipeline génère PaymentsDb une seule fois et publie le même fichier .dacpac dans chaque environnement. La production est une base de données Azure SQL. Pour les tests d'intégration, une étape du pipeline démarre un conteneur SQL Server 2022 sur l'agent de build et y publie le fichier .dacpac avec SqlPackage. Cette étape échoue, car la plateforme cible n'est pas compatible avec la plateforme du projet.

        La solution doit satisfaire les exigences suivantes :

        - Le build continue de valider le code par rapport à Azure SQL Database.
        - Les tests d'intégration s'exécutent sur le fichier .dacpac qui arrive en production.
        - La publication en production conserve sa vérification de plateforme actuelle.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the DSP property of the project to Sql160DatabaseSchemaProvider", fr: "Changer la propriété DSP du projet en Sql160DatabaseSchemaProvider" } }
        - { id: b, text: { en: "Add /p:AllowIncompatiblePlatform=true to the publish command of the container step", fr: "Ajouter /p:AllowIncompatiblePlatform=true à la commande de publication de l'étape du conteneur" } }
        - { id: c, text: { en: "Build a second .dacpac file with /p:DSP set to Sql160DatabaseSchemaProvider for the container step", fr: "Générer un second fichier .dacpac avec /p:DSP défini sur Sql160DatabaseSchemaProvider pour l'étape du conteneur" } }
        - { id: d, text: { en: "Add /p:BlockOnPossibleDataLoss=false to the publish command of the container step", fr: "Ajouter /p:BlockOnPossibleDataLoss=false à la commande de publication de l'étape du conteneur" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          SqlPackage refuses to publish a model to a platform that isn't compatible with the project's target platform, unless the AllowIncompatiblePlatform publish property is true. Setting it on the container step only lets the integration tests use the artifact built for Azure SQL Database, while the build still validates against Azure SQL Database and the production publish keeps the check.
        fr: |
          SqlPackage refuse de publier un modèle vers une plateforme incompatible avec la plateforme cible du projet, sauf si la propriété de publication AllowIncompatiblePlatform vaut true. La définir uniquement sur l'étape du conteneur permet aux tests d'intégration d'utiliser l'artefact généré pour Azure SQL Database, tandis que le build valide toujours par rapport à Azure SQL Database et que la publication en production conserve la vérification.
      options:
        a: { en: "Targeting SQL Server 2022 makes the build validate against SQL Server instead of Azure SQL Database, which breaks the first requirement.", fr: "Cibler SQL Server 2022 fait valider le build par rapport à SQL Server au lieu d'Azure SQL Database, ce qui enfreint la première exigence." }
        c: { en: "A second build produces another .dacpac file: the tests no longer run on the artifact that reaches production.", fr: "Un second build produit un autre fichier .dacpac : les tests ne s'exécutent plus sur l'artefact qui arrive en production." }
        d: { en: "BlockOnPossibleDataLoss stops deployments that could lose data; it has no effect on the platform compatibility check.", fr: "BlockOnPossibleDataLoss arrête les déploiements qui pourraient perdre des données ; il est sans effet sur la vérification de compatibilité de plateforme." }
    references:
      - title: SQL Projects Target Platform - SQL Server
        url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/target-platform
