chapter: 22-performance
questions:
  # ------------------------------------------------------------------ 1
  - id: dp800-qz-22-01
    objective: "2.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer adds the `NOLOCK` table hint to a SELECT statement that reads **dbo.Orders** in a database in Azure SQL Database.

        Which behavior can the query show because of the hint?
      fr: |
        Un développeur ajoute l'indicateur de table `NOLOCK` à une instruction SELECT qui lit **dbo.Orders** dans une base de données Azure SQL Database.

        Quel comportement la requête peut-elle présenter à cause de cet indicateur ?
    body:
      options:
        - { id: a, text: { en: "It can block the sessions that update the rows it reads.", fr: "Elle peut bloquer les sessions qui mettent à jour les lignes qu'elle lit." } }
        - { id: b, text: { en: "It can fail with update conflict error 3960.", fr: "Elle peut échouer avec l'erreur de conflit de mise à jour 3960." } }
        - { id: c, text: { en: "It can return changes that are later rolled back.", fr: "Elle peut renvoyer des modifications annulées par la suite." } }
        - { id: d, text: { en: "It can take range locks that stop other inserts.", fr: "Elle peut prendre des verrous de plage qui empêchent d'autres insertions." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `NOLOCK` has the same effect as the READ UNCOMMITTED isolation level: the statement can read rows that other transactions modified but haven't committed yet. These dirty reads can return values that are later rolled back, which is why NOLOCK is never the answer when results must be correct.
        fr: |
          `NOLOCK` a le même effet que le niveau d'isolation READ UNCOMMITTED : l'instruction peut lire des lignes que d'autres transactions ont modifiées sans les avoir encore validées. Ces lectures sales peuvent renvoyer des valeurs annulées par la suite ; c'est pourquoi NOLOCK n'est jamais la réponse quand les résultats doivent être exacts.
      options:
        a: { en: "A read under NOLOCK takes no shared locks, so it doesn't block writers.", fr: "Une lecture sous NOLOCK ne prend pas de verrous partagés : elle ne bloque donc pas les écrivains." }
        b: { en: "Error 3960 is an update conflict of the SNAPSHOT isolation level, raised when a transaction updates a row that changed after it started.", fr: "L'erreur 3960 est un conflit de mise à jour du niveau d'isolation SNAPSHOT, levé quand une transaction met à jour une ligne modifiée après son début." }
        d: { en: "Range locks belong to the SERIALIZABLE isolation level (or HOLDLOCK), the opposite of NOLOCK.", fr: "Les verrous de plage relèvent du niveau d'isolation SERIALIZABLE (ou de HOLDLOCK), l'inverse de NOLOCK." }
    references:
      - title: SET TRANSACTION ISOLATION LEVEL (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-transaction-isolation-level-transact-sql?view=sql-server-ver17

  # ------------------------------------------------------------------ 2
  - id: dp800-qz-22-02
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans a 900 GB OLTP database in Azure SQL Database. Every read and write, including those of rarely used data, must be served by local SSD storage with a latency of 1 to 2 milliseconds.

        Which service tier should you recommend?
      fr: |
        Fabrikam prévoit une base de données OLTP de 900 Go dans Azure SQL Database. Chaque lecture et chaque écriture, y compris celles des données rarement utilisées, doivent être servies par un stockage SSD local avec une latence de 1 à 2 millisecondes.

        Quel niveau de service devez-vous recommander ?
    body:
      options:
        - { id: a, text: General Purpose }
        - { id: b, text: Hyperscale }
        - { id: c, text: { en: "Standard (DTU purchasing model)", fr: "Standard (modèle d'achat DTU)" } }
        - { id: d, text: Business Critical }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Business Critical keeps the whole database on the local SSD storage of its replicas, with an average latency of 1 to 2 ms. A 900 GB database is well within its 4 TB limit.
        fr: |
          Business Critical conserve toute la base sur le stockage SSD local de ses réplicas, avec une latence moyenne de 1 à 2 ms. Une base de 900 Go reste largement sous sa limite de 4 To.
      options:
        a: { en: "General Purpose uses remote storage, with a latency of about 5 to 10 ms.", fr: "General Purpose utilise un stockage distant, avec une latence d'environ 5 à 10 ms." }
        b: { en: "Hyperscale reaches 1 to 2 ms only for the frequently accessed data held in its local SSD cache; other pages come from remote page servers.", fr: "Hyperscale n'atteint 1 à 2 ms que pour les données fréquemment consultées conservées dans son cache SSD local ; les autres pages viennent de serveurs de pages distants." }
        c: { en: "The Standard DTU tier uses remote storage like General Purpose, not local SSD.", fr: "Le niveau DTU Standard utilise un stockage distant comme General Purpose, pas un SSD local." }
    references:
      - title: vCore purchasing model - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-sql-database-vcore?view=azuresql

  # ------------------------------------------------------------------ 3
  - id: dp800-qz-22-03
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A reporting query on a database in Azure SQL Database runs for several minutes. You suspect that the optimizer misjudges how many rows some operators process.

        In SQL Server Management Studio (SSMS), you need to compare, for each operator of the plan, the estimated number of rows with the number of rows really processed.

        What should you use?
      fr: |
        Une requête de reporting sur une base de données Azure SQL Database s'exécute pendant plusieurs minutes. Vous soupçonnez l'optimiseur de mal évaluer le nombre de lignes que traitent certains opérateurs.

        Dans SQL Server Management Studio (SSMS), vous devez comparer, pour chaque opérateur du plan, le nombre estimé de lignes et le nombre de lignes réellement traitées.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Include Actual Execution Plan, then run the query", fr: "Include Actual Execution Plan, puis exécuter la requête" } }
        - { id: b, text: { en: "Display Estimated Execution Plan, without running the query", fr: "Display Estimated Execution Plan, sans exécuter la requête" } }
        - { id: c, text: { en: "SET STATISTICS IO ON, then run the query", fr: "SET STATISTICS IO ON, puis exécuter la requête" } }
        - { id: d, text: { en: "sys.dm_exec_query_plan for the plan_handle of the cached plan", fr: "sys.dm_exec_query_plan pour le plan_handle du plan en cache" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          An actual execution plan is captured when the query runs and contains runtime information, including the actual number of rows of each operator next to the estimate. A large gap between the two points to stale statistics or parameter sensitivity.
        fr: |
          Un plan d'exécution réel est capturé quand la requête s'exécute et contient les informations d'exécution, dont le nombre réel de lignes de chaque opérateur à côté de l'estimation. Un grand écart entre les deux signale des statistiques obsolètes ou une sensibilité aux paramètres.
      options:
        b: { en: "An estimated plan shows what the optimizer intends without running the query, so it has no actual row counts.", fr: "Un plan estimé montre ce que l'optimiseur prévoit sans exécuter la requête : il n'a donc aucun nombre réel de lignes." }
        c: { en: "STATISTICS IO reports logical and physical reads per table, not row counts per plan operator.", fr: "STATISTICS IO indique les lectures logiques et physiques par table, pas le nombre de lignes par opérateur du plan." }
        d: { en: "sys.dm_exec_query_plan returns the cached plan as compiled, without the runtime row counts of an execution.", fr: "sys.dm_exec_query_plan renvoie le plan en cache tel qu'il a été compilé, sans le nombre réel de lignes d'une exécution." }
    references:
      - title: Display an actual execution plan
        url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/display-an-actual-execution-plan?view=sql-server-ver17

  # ------------------------------------------------------------------ 4
  - id: dp800-qz-22-04
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a database in Azure SQL Database. To keep the locking behavior that a legacy application expects, `READ_COMMITTED_SNAPSHOT` is set to OFF, and the database options must not change.

        Updates to **dbo.Inventory** are often blocked. Each time, the head blocker is a session that runs a SELECT returning two million rows of dbo.Inventory. The client application reads the first 50 rows, displays them, and reads more rows only when the user scrolls.

        You need to prevent the blocking from recurring. What should you do?
      fr: |
        Contoso dispose d'une base de données dans Azure SQL Database. Pour conserver le comportement de verrouillage qu'attend une application héritée, `READ_COMMITTED_SNAPSHOT` est défini sur OFF, et les options de la base ne doivent pas changer.

        Les mises à jour de **dbo.Inventory** sont souvent bloquées. Chaque fois, le bloqueur principal est une session qui exécute un SELECT renvoyant deux millions de lignes de dbo.Inventory. L'application cliente lit les 50 premières lignes, les affiche, puis ne lit d'autres lignes que lorsque l'utilisateur fait défiler l'écran.

        Vous devez empêcher le blocage de se reproduire. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Increase the command timeout of the sessions that update dbo.Inventory.", fr: "Augmenter le délai d'expiration des commandes des sessions qui mettent à jour dbo.Inventory." } }
        - { id: b, text: { en: "Add the NOLOCK table hint to the UPDATE statements that target dbo.Inventory.", fr: "Ajouter l'indicateur de table NOLOCK aux instructions UPDATE qui ciblent dbo.Inventory." } }
        - { id: c, text: { en: "Change the application to fetch all the rows, and page on the server with OFFSET and FETCH.", fr: "Modifier l'application pour qu'elle lise toutes les lignes, et paginer côté serveur avec OFFSET et FETCH." } }
        - { id: d, text: { en: "Run KILL on the head blocker each time the monitoring detects the blocking.", fr: "Exécuter KILL sur le bloqueur principal chaque fois que la supervision détecte le blocage." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An application that doesn't fetch all the result rows to completion can leave locks on the table, which block other users. The fix is in the application: read the result to the end, and use OFFSET and FETCH so that each request returns only the page the user needs.
        fr: |
          Une application qui ne lit pas toutes les lignes du résultat jusqu'au bout peut laisser des verrous sur la table, qui bloquent les autres utilisateurs. La correction se fait dans l'application : lire le résultat jusqu'à la fin, et utiliser OFFSET et FETCH pour que chaque requête ne renvoie que la page dont l'utilisateur a besoin.
      options:
        a: { en: "A longer timeout makes the blocked updates wait longer; the SELECT keeps its locks as long as the user doesn't scroll.", fr: "Un délai plus long fait attendre plus longtemps les mises à jour bloquées ; le SELECT garde ses verrous tant que l'utilisateur ne fait pas défiler." }
        b: { en: "NOLOCK can't be specified for a table modified by an UPDATE (it is ignored on the target), and writers still need exclusive locks.", fr: "NOLOCK ne peut pas être spécifié pour une table modifiée par un UPDATE (il est ignoré sur la cible), et les écrivains ont toujours besoin de verrous exclusifs." }
        d: { en: "KILL ends one occurrence but doesn't change the application, so the blocking comes back with the next user.", fr: "KILL met fin à une occurrence mais ne change pas l'application : le blocage revient avec l'utilisateur suivant." }
    references:
      - title: Understand and resolve blocking problems
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/understand-resolve-blocking?view=azuresql
      - title: Table Hints (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/queries/hints-transact-sql-table?view=sql-server-ver17

  # ------------------------------------------------------------------ 5
  - id: dp800-qz-22-05
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a database in Azure SQL Database. A vendor requires the `AUTO_UPDATE_STATISTICS` option to stay OFF. Every night, a job adds about 30 percent new rows to **dbo.Sales**.

        After each load, a report query is slow. Its actual execution plan shows an Index Seek with 1,200 estimated rows and 3,400,000 actual rows, followed by a Sort operator that spills to tempdb.

        You need to correct the estimates without changing the database options or the query. What should you do?
      fr: |
        Fabrikam dispose d'une base de données dans Azure SQL Database. Un éditeur exige que l'option `AUTO_UPDATE_STATISTICS` reste sur OFF. Chaque nuit, un travail ajoute environ 30 % de nouvelles lignes à **dbo.Sales**.

        Après chaque chargement, une requête de rapport est lente. Son plan d'exécution réel montre un Index Seek avec 1 200 lignes estimées et 3 400 000 lignes réelles, suivi d'un opérateur Sort qui déborde dans tempdb.

        Vous devez corriger les estimations sans modifier les options de la base ni la requête. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run UPDATE STATISTICS on dbo.Sales at the end of each nightly load.", fr: "Exécuter UPDATE STATISTICS sur dbo.Sales à la fin de chaque chargement nocturne." } }
        - { id: b, text: { en: "Run ALTER INDEX ALL ON dbo.Sales REORGANIZE at the end of each nightly load.", fr: "Exécuter ALTER INDEX ALL ON dbo.Sales REORGANIZE à la fin de chaque chargement nocturne." } }
        - { id: c, text: { en: "Force the current plan of the query in Query Store with sp_query_store_force_plan.", fr: "Forcer le plan actuel de la requête dans le Magasin des requêtes avec sp_query_store_force_plan." } }
        - { id: d, text: { en: "Add a Query Store hint that sets MAXDOP 1 for the query.", fr: "Ajouter un indicateur du Magasin des requêtes qui définit MAXDOP 1 pour la requête." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The optimizer builds its cardinality estimates from statistics, which become out of date when a large share of rows is inserted. With automatic updates turned off, updating the statistics after each load gives the optimizer the new distribution, so the estimates and the memory grant of the Sort match the data again.
        fr: |
          L'optimiseur construit ses estimations de cardinalité à partir des statistiques, qui deviennent obsolètes quand une large part de lignes est insérée. Les mises à jour automatiques étant désactivées, mettre à jour les statistiques après chaque chargement donne à l'optimiseur la nouvelle distribution : les estimations et l'allocation de mémoire du Sort correspondent de nouveau aux données.
      options:
        b: { en: "Reorganizing an index doesn't update its statistics; only a rebuild updates them, as a byproduct.", fr: "Réorganiser un index ne met pas à jour ses statistiques ; seule une reconstruction les met à jour, comme effet secondaire." }
        c: { en: "Forcing the current plan keeps the plan that was built on the wrong estimates.", fr: "Forcer le plan actuel conserve le plan construit sur les mauvaises estimations." }
        d: { en: "MAXDOP limits parallelism; it doesn't change the cardinality estimates or the memory grant that causes the spill.", fr: "MAXDOP limite le parallélisme ; il ne change ni les estimations de cardinalité ni l'allocation de mémoire à l'origine du débordement." }
    references:
      - title: Statistics
        url: https://learn.microsoft.com/en-us/sql/relational-databases/statistics/statistics?view=sql-server-ver17

  # ------------------------------------------------------------------ 6
  - id: dp800-qz-22-06
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware plans a single database in Azure SQL Database for a SaaS analytics application. The database must meet the following requirements:

        - It holds 5 TB of data at launch and grows by about 1 TB per year.
        - Compute scales automatically with the workload, up to 24 vCores, and is billed per second of use.
        - The database never needs to pause.

        Which configuration should you recommend?
      fr: |
        Litware prévoit une base de données unique dans Azure SQL Database pour une application d'analytique SaaS. La base doit satisfaire les exigences suivantes :

        - Elle contient 5 To de données au lancement et croît d'environ 1 To par an.
        - Le calcul se met à l'échelle automatiquement selon la charge, jusqu'à 24 vCores, et est facturé à la seconde d'utilisation.
        - La base n'a jamais besoin d'être mise en pause.

        Quelle configuration devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "General Purpose service tier, serverless compute tier", fr: "Niveau de service General Purpose, niveau de calcul serverless" } }
        - { id: b, text: { en: "Business Critical service tier, provisioned compute tier", fr: "Niveau de service Business Critical, niveau de calcul provisionné" } }
        - { id: c, text: { en: "Hyperscale service tier, provisioned compute tier", fr: "Niveau de service Hyperscale, niveau de calcul provisionné" } }
        - { id: d, text: { en: "Hyperscale service tier, serverless compute tier", fr: "Niveau de service Hyperscale, niveau de calcul serverless" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          At 5 TB, the database exceeds the 4 TB limit of General Purpose and Business Critical, so only Hyperscale (up to 128 TB) fits. Serverless compute autoscales with the workload and is billed per second, and it is available in Hyperscale as well as General Purpose; auto-pause isn't needed here.
        fr: |
          Avec 5 To, la base dépasse la limite de 4 To de General Purpose et de Business Critical : seul Hyperscale (jusqu'à 128 To) convient. Le calcul serverless se met à l'échelle automatiquement selon la charge et est facturé à la seconde, et il est disponible dans Hyperscale comme dans General Purpose ; la mise en pause automatique n'est pas nécessaire ici.
      options:
        a: { en: "Serverless General Purpose autoscales and bills per second, but General Purpose stops at 4 TB.", fr: "General Purpose serverless se met à l'échelle et facture à la seconde, mais General Purpose s'arrête à 4 To." }
        b: { en: "Business Critical is limited to 4 TB and has no serverless option; provisioned compute keeps a fixed number of vCores.", fr: "Business Critical est limité à 4 To et n'a pas d'option serverless ; le calcul provisionné garde un nombre fixe de vCores." }
        c: { en: "Hyperscale meets the size requirement, but provisioned compute keeps fixed vCores billed per hour instead of autoscaling.", fr: "Hyperscale satisfait l'exigence de taille, mais le calcul provisionné garde des vCores fixes facturés à l'heure au lieu de se mettre à l'échelle automatiquement." }
    references:
      - title: Serverless compute tier for Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview?view=azuresql
      - title: vCore purchasing model - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-sql-database-vcore?view=azuresql

  # ------------------------------------------------------------------ 7
  - id: dp800-qz-22-07
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: ordering
    shuffle: true
    stem:
      en: |
        Adatum migrated a database to Azure SQL Database. The database still uses compatibility level 130. Query Store was turned on yesterday in `READ_WRITE` mode. Automatic tuning is turned off because the DBA team must review every plan that is forced.

        You need to move the database to compatibility level 170. Any plan regression must be fixed without modifying the application code.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Adatum a migré une base de données vers Azure SQL Database. La base utilise toujours le niveau de compatibilité 130. Le Magasin des requêtes a été activé hier en mode `READ_WRITE`. Le réglage automatique est désactivé, car l'équipe DBA doit examiner chaque plan forcé.

        Vous devez faire passer la base au niveau de compatibilité 170. Toute régression de plan doit être corrigée sans modifier le code de l'application.

        Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et placez-les dans l'ordre correct.
    body:
      actions:
        - { id: clear, text: { en: "Run ALTER DATABASE CURRENT SET QUERY_STORE CLEAR to start from an empty Query Store.", fr: "Exécuter ALTER DATABASE CURRENT SET QUERY_STORE CLEAR pour repartir d'un Magasin des requêtes vide." } }
        - { id: base, text: { en: "Keep level 130 while Query Store captures the workload for a full business cycle.", fr: "Conserver le niveau 130 pendant que le Magasin des requêtes capture la charge sur un cycle d'activité complet." } }
        - { id: raise, text: { en: "Run ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 170.", fr: "Exécuter ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 170." } }
        - { id: auto, text: { en: "Run ALTER DATABASE CURRENT SET AUTOMATIC_TUNING (FORCE_LAST_GOOD_PLAN = ON).", fr: "Exécuter ALTER DATABASE CURRENT SET AUTOMATIC_TUNING (FORCE_LAST_GOOD_PLAN = ON)." } }
        - { id: find, text: { en: "Open the Regressed Queries report to compare the plans of each query before and after the change.", fr: "Ouvrir le rapport Regressed Queries pour comparer les plans de chaque requête avant et après le changement." } }
        - { id: hint, text: { en: "Add OPTION (USE HINT ('QUERY_OPTIMIZER_COMPATIBILITY_LEVEL_130')) to the regressed queries in the application.", fr: "Ajouter OPTION (USE HINT ('QUERY_OPTIMIZER_COMPATIBILITY_LEVEL_130')) aux requêtes régressées dans l'application." } }
        - { id: force, text: { en: "Run sp_query_store_force_plan with the previous plan of each regressed query.", fr: "Exécuter sp_query_store_force_plan avec le plan précédent de chaque requête régressée." } }
      count: 4
    answer:
      sequence: [base, raise, find, force]
    explanation:
      correct:
        en: |
          Plans change only when the compatibility level changes, so Query Store must first capture a stable baseline at the old level, over a usual business cycle. You then raise the level, use Query Store to identify the queries whose plan choice regressed, and force their previously known good plan, which needs no change to the code.
        fr: |
          Les plans ne changent qu'au changement de niveau de compatibilité : le Magasin des requêtes doit donc d'abord capturer une base de référence stable à l'ancien niveau, sur un cycle d'activité habituel. Vous relevez ensuite le niveau, utilisez le Magasin des requêtes pour identifier les requêtes dont le choix de plan a régressé, puis forcez leur dernier bon plan connu, ce qui n'exige aucune modification du code.
      options:
        clear: { en: "Clearing Query Store would delete the baseline needed to compare plans and to force the previous ones.", fr: "Vider le Magasin des requêtes supprimerait la base de référence nécessaire pour comparer les plans et forcer les précédents." }
        auto: { en: "Automatic plan correction would force plans without the review that the DBA team requires.", fr: "La correction automatique des plans forcerait des plans sans l'examen qu'exige l'équipe DBA." }
        hint: { en: "Adding a hint to the queries in the application modifies the application code.", fr: "Ajouter un indicateur aux requêtes dans l'application modifie le code de l'application." }
    references:
      - title: Query Store Usage Scenarios
        url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/query-store-usage-scenarios?view=sql-server-ver17

  # ------------------------------------------------------------------ 8
  - id: dp800-qz-22-08
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind has a database in Azure SQL Database that uses the default settings. A failover to another replica occurred at 02:00 today during planned maintenance.

        You need to identify the five queries that consumed the most CPU over the last seven days, including the days before the failover.

        Which two tools can you use? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'une base de données dans Azure SQL Database qui utilise les paramètres par défaut. Un basculement vers un autre réplica a eu lieu aujourd'hui à 02:00 pendant une maintenance planifiée.

        Vous devez identifier les cinq requêtes qui ont consommé le plus de processeur au cours des sept derniers jours, y compris les jours précédant le basculement.

        Quels sont les deux outils que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "The sys.dm_exec_query_stats view, ordered by total_worker_time", fr: "La vue sys.dm_exec_query_stats, triée par total_worker_time" } }
        - { id: b, text: { en: "The Top Resource Consuming Queries report of Query Store in SSMS", fr: "Le rapport Top Resource Consuming Queries du Magasin des requêtes dans SSMS" } }
        - { id: c, text: { en: "The sys.dm_db_resource_stats view, ordered by avg_cpu_percent", fr: "La vue sys.dm_db_resource_stats, triée par avg_cpu_percent" } }
        - { id: d, text: { en: "The Query Performance Insight page of the database in the Azure portal", fr: "La page Query Performance Insight de la base de données dans le portail Azure" } }
        - { id: e, text: { en: "The sys.dm_exec_requests view, ordered by cpu_time", fr: "La vue sys.dm_exec_requests, triée par cpu_time" } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Query Store persists query texts, plans and runtime statistics inside the database, so its history survives a failover. The Top Resource Consuming Queries report shows the biggest consumers for a metric and period of your choice, and Query Performance Insight charts the same Query Store data in the portal, with the top CPU consumers over the past week.
        fr: |
          Le Magasin des requêtes conserve dans la base le texte des requêtes, les plans et les statistiques d'exécution : son historique survit donc à un basculement. Le rapport Top Resource Consuming Queries montre les plus gros consommateurs pour la métrique et la période choisies, et Query Performance Insight affiche les mêmes données du Magasin des requêtes dans le portail, avec les plus gros consommateurs de processeur de la semaine écoulée.
      options:
        a: { en: "sys.dm_exec_query_stats only covers the plans in the current cache; the plans cached before the failover are gone.", fr: "sys.dm_exec_query_stats ne couvre que les plans du cache actuel ; les plans mis en cache avant le basculement ont disparu." }
        c: { en: "sys.dm_db_resource_stats keeps about one hour of database-level usage and has no per-query data.", fr: "sys.dm_db_resource_stats conserve environ une heure de consommation au niveau de la base et ne contient aucune donnée par requête." }
        e: { en: "sys.dm_exec_requests lists only the requests that are running now.", fr: "sys.dm_exec_requests ne liste que les requêtes en cours d'exécution." }
    references:
      - title: Query Performance Insight for Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/query-performance-insight-use?view=azuresql
      - title: sys.dm_exec_query_stats (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-exec-query-stats-transact-sql?view=sql-server-ver17

  # ------------------------------------------------------------------ 9
  - id: dp800-qz-22-09
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin has a SQL Server 2022 database named **Ledger** that uses the default database options. You are writing a stored procedure that reads the balances of several accounts and then updates two of them.

        The procedure must meet the following requirements:

        - All the reads of the transaction return the data as committed when the transaction started, without taking shared locks.
        - If another session committed a change to one of the updated rows after the transaction started, the transaction must not overwrite it. The procedure must then run the transaction once more.
        - Any other error is returned to the caller.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'une base de données SQL Server 2022 nommée **Ledger** qui utilise les options de base de données par défaut. Vous écrivez une procédure stockée qui lit les soldes de plusieurs comptes, puis met à jour deux d'entre eux.

        La procédure doit satisfaire les exigences suivantes :

        - Toutes les lectures de la transaction renvoient les données telles qu'elles étaient validées au début de la transaction, sans prendre de verrous partagés.
        - Si une autre session a validé une modification de l'une des lignes mises à jour après le début de la transaction, la transaction ne doit pas l'écraser. La procédure doit alors exécuter la transaction une seconde fois.
        - Toute autre erreur est renvoyée à l'appelant.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template:
        en: |
          ALTER DATABASE Ledger SET [[opt]] ON;
          GO
          CREATE OR ALTER PROCEDURE dbo.usp_Rebalance @FromID int, @ToID int, @Amount money
          AS
          SET NOCOUNT ON;
          SET TRANSACTION ISOLATION LEVEL [[iso]];
          DECLARE @Attempt int = 1;
          WHILE @Attempt <= 2
          BEGIN
              BEGIN TRY
                  BEGIN TRANSACTION;
                  -- reads of several balances, then two UPDATE statements
                  COMMIT TRANSACTION;
                  RETURN;
              END TRY
              BEGIN CATCH
                  IF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;
                  IF ERROR_NUMBER() <> [[err]] OR @Attempt = 2 THROW;
                  SET @Attempt += 1;
              END CATCH;
          END;
        fr: |
          ALTER DATABASE Ledger SET [[opt]] ON;
          GO
          CREATE OR ALTER PROCEDURE dbo.usp_Rebalance @FromID int, @ToID int, @Amount money
          AS
          SET NOCOUNT ON;
          SET TRANSACTION ISOLATION LEVEL [[iso]];
          DECLARE @Attempt int = 1;
          WHILE @Attempt <= 2
          BEGIN
              BEGIN TRY
                  BEGIN TRANSACTION;
                  -- lectures de plusieurs soldes, puis deux instructions UPDATE
                  COMMIT TRANSACTION;
                  RETURN;
              END TRY
              BEGIN CATCH
                  IF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;
                  IF ERROR_NUMBER() <> [[err]] OR @Attempt = 2 THROW;
                  SET @Attempt += 1;
              END CATCH;
          END;
      slots:
        - id: opt
          options:
            - { id: asi, text: ALLOW_SNAPSHOT_ISOLATION }
            - { id: rcsi, text: READ_COMMITTED_SNAPSHOT }
            - { id: async, text: AUTO_UPDATE_STATISTICS_ASYNC }
        - id: iso
          options:
            - { id: rc, text: READ COMMITTED }
            - { id: rr, text: REPEATABLE READ }
            - { id: snap, text: SNAPSHOT }
            - { id: ser, text: SERIALIZABLE }
        - id: err
          options:
            - { id: e1205, text: "1205" }
            - { id: e2627, text: "2627" }
            - { id: e3960, text: "3960" }
            - { id: e50000, text: "50000" }
    answer:
      values: { opt: asi, iso: snap, err: e3960 }
    explanation:
      correct:
        en: |
          SNAPSHOT isolation makes every read of the transaction return the committed version as of the start of the transaction, from row versions, without shared locks. It requires `ALLOW_SNAPSHOT_ISOLATION` set to ON, which is OFF by default for user databases in SQL Server. When the transaction updates a row that another session changed and committed after it started, the engine aborts it with error 3960 (update conflict) instead of overwriting, so the CATCH block retries only on 3960.
        fr: |
          L'isolation SNAPSHOT fait que chaque lecture de la transaction renvoie la version validée au début de la transaction, à partir des versions de lignes, sans verrous partagés. Elle exige `ALLOW_SNAPSHOT_ISOLATION` défini sur ON, qui vaut OFF par défaut pour les bases utilisateur dans SQL Server. Quand la transaction met à jour une ligne qu'une autre session a modifiée et validée après son début, le moteur l'interrompt avec l'erreur 3960 (conflit de mise à jour) au lieu d'écraser : le bloc CATCH ne réessaie donc que sur 3960.
      options:
        rcsi: { en: "READ_COMMITTED_SNAPSHOT gives each statement, not the whole transaction, its own snapshot, and doesn't allow SET TRANSACTION ISOLATION LEVEL SNAPSHOT.", fr: "READ_COMMITTED_SNAPSHOT donne à chaque instruction, et non à toute la transaction, son propre instantané, et ne permet pas SET TRANSACTION ISOLATION LEVEL SNAPSHOT." }
        rr: { en: "REPEATABLE READ holds shared locks on the rows read until the end of the transaction.", fr: "REPEATABLE READ maintient des verrous partagés sur les lignes lues jusqu'à la fin de la transaction." }
        ser: { en: "SERIALIZABLE takes shared and range locks, which the first requirement forbids.", fr: "SERIALIZABLE prend des verrous partagés et des verrous de plage, ce que la première exigence interdit." }
        e1205: { en: "1205 is the deadlock victim error; it doesn't signal an update conflict.", fr: "1205 est l'erreur de victime d'interblocage ; elle ne signale pas un conflit de mise à jour." }
        e2627: { en: "2627 is a violation of a PRIMARY KEY or UNIQUE constraint.", fr: "2627 est une violation de contrainte PRIMARY KEY ou UNIQUE." }
    references:
      - title: SET TRANSACTION ISOLATION LEVEL (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-transaction-isolation-level-transact-sql?view=sql-server-ver17
      - title: Transaction locking and row versioning guide
        url: https://learn.microsoft.com/en-us/sql/relational-databases/sql-server-transaction-locking-and-row-versioning-guide?view=sql-server-ver17

  # ------------------------------------------------------------------ 10
  - id: dp800-qz-22-10
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip has a SQL Server 2022 database named **Sales** that uses the default database options. The procedures of the database use no table hints. The `system_health` session captured the following deadlock graph (excerpt).

        ```text
        <deadlock>
         <victim-list>
          <victimProcess id="process1f2a" />
         </victim-list>
         <process-list>
          <process id="process1f2a" spid="64" isolationlevel="serializable (4)">
           <inputbuf>EXEC dbo.usp_AuditOrder @OrderID = 1007</inputbuf>
          </process>
          <process id="process2b9c" spid="71" isolationlevel="read committed (2)">
           <inputbuf>EXEC dbo.usp_ShipOrder @OrderID = 1007</inputbuf>
          </process>
         </process-list>
         <resource-list>
          <keylock objectname="Sales.dbo.OrderLines" indexname="PK_OrderLines" mode="RangeS-S">
           <owner-list><owner id="process1f2a" mode="RangeS-S" /></owner-list>
           <waiter-list><waiter id="process2b9c" mode="X" requestType="wait" /></waiter-list>
          </keylock>
          <keylock objectname="Sales.dbo.Orders" indexname="PK_Orders" mode="X">
           <owner-list><owner id="process2b9c" mode="X" /></owner-list>
           <waiter-list><waiter id="process1f2a" mode="RangeS-S" requestType="wait" /></waiter-list>
          </keylock>
         </resource-list>
        </deadlock>
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip dispose d'une base de données SQL Server 2022 nommée **Sales** qui utilise les options de base de données par défaut. Les procédures de la base n'utilisent aucun indicateur de table. La session `system_health` a capturé le graphe d'interblocage suivant (extrait).

        ```text
        <deadlock>
         <victim-list>
          <victimProcess id="process1f2a" />
         </victim-list>
         <process-list>
          <process id="process1f2a" spid="64" isolationlevel="serializable (4)">
           <inputbuf>EXEC dbo.usp_AuditOrder @OrderID = 1007</inputbuf>
          </process>
          <process id="process2b9c" spid="71" isolationlevel="read committed (2)">
           <inputbuf>EXEC dbo.usp_ShipOrder @OrderID = 1007</inputbuf>
          </process>
         </process-list>
         <resource-list>
          <keylock objectname="Sales.dbo.OrderLines" indexname="PK_OrderLines" mode="RangeS-S">
           <owner-list><owner id="process1f2a" mode="RangeS-S" /></owner-list>
           <waiter-list><waiter id="process2b9c" mode="X" requestType="wait" /></waiter-list>
          </keylock>
          <keylock objectname="Sales.dbo.Orders" indexname="PK_Orders" mode="X">
           <owner-list><owner id="process2b9c" mode="X" /></owner-list>
           <waiter-list><waiter id="process1f2a" mode="RangeS-S" requestType="wait" /></waiter-list>
          </keylock>
         </resource-list>
        </deadlock>
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The session that ran dbo.usp_ShipOrder received error 1205, and its transaction was rolled back.", fr: "La session qui a exécuté dbo.usp_ShipOrder a reçu l'erreur 1205, et sa transaction a été annulée." }
        - id: s2
          text: { en: "If dbo.usp_AuditOrder ran under READ COMMITTED instead of SERIALIZABLE, it wouldn't request the RangeS-S locks shown in the graph.", fr: "Si dbo.usp_AuditOrder s'exécutait en READ COMMITTED au lieu de SERIALIZABLE, elle ne demanderait pas les verrous RangeS-S présents dans le graphe." }
        - id: s3
          text: { en: "Running SET DEADLOCK_PRIORITY HIGH in the sessions that call dbo.usp_AuditOrder prevents this deadlock from occurring again.", fr: "Exécuter SET DEADLOCK_PRIORITY HIGH dans les sessions qui appellent dbo.usp_AuditOrder empêche cet interblocage de se reproduire." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The victim-list names process1f2a, the process of dbo.usp_AuditOrder: that session received error 1205 and was rolled back, while dbo.usp_ShipOrder went on. Key-range locks such as RangeS-S protect ranges read under the SERIALIZABLE isolation level; without table hints, READ COMMITTED doesn't take them. DEADLOCK_PRIORITY only decides which session becomes the victim: the cycle still forms, and dbo.usp_ShipOrder would be rolled back instead.
        fr: |
          La victim-list désigne process1f2a, le processus de dbo.usp_AuditOrder : c'est cette session qui a reçu l'erreur 1205 et a été annulée, tandis que dbo.usp_ShipOrder a continué. Les verrous de plage de clés comme RangeS-S protègent les plages lues sous le niveau d'isolation SERIALIZABLE ; sans indicateur de table, READ COMMITTED n'en prend pas. DEADLOCK_PRIORITY décide seulement quelle session devient la victime : le cycle se forme toujours, et c'est dbo.usp_ShipOrder qui serait annulée.
      options:
        s1: { en: "The victim is process1f2a (spid 64), which runs dbo.usp_AuditOrder; process2b9c survived.", fr: "La victime est process1f2a (spid 64), qui exécute dbo.usp_AuditOrder ; process2b9c a survécu." }
        s3: { en: "A higher priority makes the other session the victim; it doesn't remove the lock cycle. Consistent access order, shorter transactions or a lower isolation level reduce such cycles.", fr: "Une priorité plus haute fait de l'autre session la victime ; elle ne supprime pas le cycle de verrous. Un ordre d'accès cohérent, des transactions plus courtes ou un niveau d'isolation plus faible réduisent ces cycles." }
    references:
      - title: Deadlocks guide
        url: https://learn.microsoft.com/en-us/sql/relational-databases/sql-server-deadlocks-guide?view=sql-server-ver17
      - title: Transaction locking and row versioning guide
        url: https://learn.microsoft.com/en-us/sql/relational-databases/sql-server-transaction-locking-and-row-versioning-guide?view=sql-server-ver17
