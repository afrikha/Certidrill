chapter: 21-security-compliance
questions:
  # ------------------------------------------------------------------ 1
  - id: dp800-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a database named **SalesDb** in Azure SQL Database. A compliance rule requires the data files, the transaction log and the backups of SalesDb to be encrypted at rest.

        The applications and the stored procedures that use SalesDb must not be modified.

        Which feature meets the requirement?
      fr: |
        Contoso dispose d'une base de données nommée **SalesDb** dans Azure SQL Database. Une règle de conformité exige que les fichiers de données, le journal des transactions et les sauvegardes de SalesDb soient chiffrés au repos.

        Les applications et les procédures stockées qui utilisent SalesDb ne doivent pas être modifiées.

        Quelle fonctionnalité répond à l'exigence ?
    body:
      options:
        - { id: a, text: { en: "Always Encrypted with deterministic encryption", fr: "Always Encrypted avec chiffrement déterministe" } }
        - { id: b, text: { en: "Column-level encryption with ENCRYPTBYKEY", fr: "Chiffrement au niveau des colonnes avec ENCRYPTBYKEY" } }
        - { id: c, text: { en: "Transparent data encryption (TDE)", fr: "Chiffrement transparent des données (TDE)" } }
        - { id: d, text: { en: "Dynamic Data Masking with the default() function", fr: "Masquage dynamique des données avec la fonction default()" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          TDE encrypts and decrypts the database, its transaction log and its backups in real time at the page level, transparently for the applications. It is enabled by default for new databases in Azure SQL Database, so no code changes.
        fr: |
          TDE chiffre et déchiffre en temps réel, au niveau des pages, la base de données, son journal des transactions et ses sauvegardes, de façon transparente pour les applications. Il est activé par défaut pour les nouvelles bases dans Azure SQL Database : aucun code ne change.
      options:
        a: { en: "Always Encrypted protects selected columns end to end and requires a client driver configured for it; it doesn't target data files, logs and backups as a whole.", fr: "Always Encrypted protège des colonnes choisies de bout en bout et exige un pilote client configuré pour lui ; il ne vise pas les fichiers de données, le journal et les sauvegardes dans leur ensemble." }
        b: { en: "Column-level encryption needs varbinary columns and ENCRYPTBYKEY / DECRYPTBYKEY calls in the code, which the rule forbids.", fr: "Le chiffrement au niveau des colonnes exige des colonnes varbinary et des appels à ENCRYPTBYKEY / DECRYPTBYKEY dans le code, ce que la règle interdit." }
        d: { en: "Dynamic Data Masking only hides values in query results; the stored data, the log and the backups stay in plaintext.", fr: "Le masquage dynamique des données ne fait que masquer les valeurs dans les résultats des requêtes ; les données stockées, le journal et les sauvegardes restent en clair." }
    references:
      - title: Transparent data encryption for SQL Database and SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-tde-overview?view=azuresql

  # ------------------------------------------------------------------ 2
  - id: dp800-qz-21-02
    objective: "2.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam enables server-level auditing on the Azure SQL logical server **sql-fabrikam**. The security operations team uses a third-party SIEM that must receive the audit events as a continuous stream, in near real time.

        Which audit log destination should you configure?
      fr: |
        Fabrikam active l'audit au niveau du serveur sur le serveur logique Azure SQL **sql-fabrikam**. L'équipe des opérations de sécurité utilise un SIEM tiers qui doit recevoir les événements d'audit sous forme de flux continu, en quasi-temps réel.

        Quelle destination des journaux d'audit devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "An Azure Storage account", fr: "Un compte Stockage Azure" } }
        - { id: b, text: { en: "Azure Event Hubs", fr: "Azure Event Hubs" } }
        - { id: c, text: { en: "A Log Analytics workspace", fr: "Un espace de travail Log Analytics" } }
        - { id: d, text: { en: "The Windows Security log", fr: "Le journal de sécurité Windows" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure SQL auditing can stream its events to Event Hubs, from which a SIEM or another consumer reads them as they arrive. Event Hubs is the destination meant for streaming to external systems.
        fr: |
          L'audit d'Azure SQL peut diffuser ses événements vers Event Hubs, d'où un SIEM ou un autre consommateur les lit au fil de l'eau. Event Hubs est la destination prévue pour la diffusion vers des systèmes externes.
      options:
        a: { en: "A storage account keeps audit files for retention and later review (sys.fn_get_audit_file); it doesn't push a stream to a SIEM.", fr: "Un compte de stockage conserve des fichiers d'audit pour la rétention et l'analyse ultérieure (sys.fn_get_audit_file) ; il ne pousse pas de flux vers un SIEM." }
        c: { en: "Log Analytics is the choice for KQL queries and alerts in Azure Monitor, not for streaming events to a third-party SIEM.", fr: "Log Analytics est le choix pour les requêtes KQL et les alertes dans Azure Monitor, pas pour diffuser des événements vers un SIEM tiers." }
        d: { en: "The Windows Security log is a target of SQL Server Audit on a Windows server; Azure SQL auditing doesn't offer it.", fr: "Le journal de sécurité Windows est une cible de SQL Server Audit sur un serveur Windows ; l'audit d'Azure SQL ne la propose pas." }
    references:
      - title: Auditing for Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview?view=azuresql
      - title: Diagnostic settings in Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings

  # ------------------------------------------------------------------ 3
  - id: dp800-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a database in Azure SQL Database. The **Salary** column (`int`) of **HR.Employee** is masked with the `default()` function. An analyst named **Lena** has `SELECT` on HR.Employee and no `UNMASK` permission.

        Lena runs the following query.

        ```text
        SELECT EmployeeID, Salary
        FROM HR.Employee
        WHERE Salary > 150000;
        ```

        Which result does Lena get?
      fr: |
        Vous disposez d'une base de données dans Azure SQL Database. La colonne **Salary** (`int`) de **HR.Employee** est masquée avec la fonction `default()`. Une analyste nommée **Lena** dispose de `SELECT` sur HR.Employee et n'a pas l'autorisation `UNMASK`.

        Lena exécute la requête suivante.

        ```text
        SELECT EmployeeID, Salary
        FROM HR.Employee
        WHERE Salary > 150000;
        ```

        Quel résultat Lena obtient-elle ?
    body:
      options:
        - { id: a, text: { en: "No rows, because the masked value 0 never satisfies the condition", fr: "Aucune ligne, car la valeur masquée 0 ne satisfait jamais la condition" } }
        - { id: b, text: { en: "Every employee of the table, with 0 in the Salary column", fr: "Tous les employés de la table, avec 0 dans la colonne Salary" } }
        - { id: c, text: { en: "An error, because a masked column can't appear in a WHERE clause", fr: "Une erreur, car une colonne masquée ne peut pas figurer dans une clause WHERE" } }
        - { id: d, text: { en: "The employees whose real salary exceeds 150000, with 0 in the Salary column", fr: "Les employés dont le salaire réel dépasse 150000, avec 0 dans la colonne Salary" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Dynamic Data Masking changes only the values returned in the result set: the WHERE clause is evaluated on the real data. Lena gets exactly the employees who earn more than 150000, each shown with the masked value 0. This is why masking alone doesn't stop a user who can run ad hoc queries from inferring values by filtering.
        fr: |
          Le masquage dynamique des données ne modifie que les valeurs renvoyées dans le jeu de résultats : la clause WHERE est évaluée sur les données réelles. Lena obtient exactement les employés qui gagnent plus de 150000, chacun affiché avec la valeur masquée 0. C'est pourquoi le masquage seul n'empêche pas un utilisateur qui peut exécuter des requêtes ad hoc de déduire des valeurs en filtrant.
      options:
        a: { en: "The filter doesn't compare the masked value: it compares the stored value, so the qualifying rows are returned.", fr: "Le filtre ne compare pas la valeur masquée : il compare la valeur stockée, si bien que les lignes qui remplissent la condition sont renvoyées." }
        b: { en: "The condition still applies to the real salaries, so the employees who earn 150000 or less are excluded.", fr: "La condition s'applique toujours aux salaires réels : les employés qui gagnent 150000 ou moins sont donc exclus." }
        c: { en: "A masked column can be filtered on: the predicate runs against the underlying data, and only the values returned to the user are masked.", fr: "Une colonne masquée peut servir de filtre : le prédicat s'exécute sur les données sous-jacentes, et seules les valeurs renvoyées à l'utilisateur sont masquées." }
    references:
      - title: Dynamic data masking
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking?view=sql-server-ver17

  # ------------------------------------------------------------------ 4
  - id: dp800-qz-21-04
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The Azure SQL logical server **sql-adatum** has a Microsoft Entra admin and still allows SQL authentication. A function app named **func-billing** has a system-assigned managed identity.

        You connect to the **BillingDb** database with the server admin SQL login **sqladmin** and run the following statement.

        ```text
        CREATE USER [func-billing] FROM EXTERNAL PROVIDER;
        ```

        The statement fails. You need to create the database user of func-billing.

        What should you do?
      fr: |
        Le serveur logique Azure SQL **sql-adatum** dispose d'un administrateur Microsoft Entra et autorise toujours l'authentification SQL. Une application de fonction nommée **func-billing** dispose d'une identité managée affectée par le système.

        Vous vous connectez à la base de données **BillingDb** avec la connexion SQL d'administrateur du serveur **sqladmin** et exécutez l'instruction suivante.

        ```text
        CREATE USER [func-billing] FROM EXTERNAL PROVIDER;
        ```

        L'instruction échoue. Vous devez créer l'utilisateur de base de données de func-billing.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run the statement in the master database, still connected as sqladmin.", fr: "Exécuter l'instruction dans la base master, toujours connecté en tant que sqladmin." } }
        - { id: b, text: { en: "Assign the SQL DB Contributor role on BillingDb to the identity of func-billing.", fr: "Attribuer le rôle SQL DB Contributor sur BillingDb à l'identité de func-billing." } }
        - { id: c, text: { en: "Connect as a Microsoft Entra principal with ALTER ANY USER, then rerun the statement.", fr: "Se connecter en tant que principal Microsoft Entra disposant d'ALTER ANY USER, puis la réexécuter." } }
        - { id: d, text: { en: "Replace FROM EXTERNAL PROVIDER with WITHOUT LOGIN, still connected as sqladmin.", fr: "Remplacer FROM EXTERNAL PROVIDER par WITHOUT LOGIN, toujours connecté en tant que sqladmin." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A database user mapped to a Microsoft Entra identity can be created only by a session authenticated with Microsoft Entra ID, such as the Microsoft Entra admin or a Microsoft Entra principal with the ALTER ANY USER permission. A SQL login, even the server admin, can't resolve the identity in Microsoft Entra ID.
        fr: |
          Un utilisateur de base de données mappé à une identité Microsoft Entra ne peut être créé que par une session authentifiée avec Microsoft Entra ID, comme l'administrateur Microsoft Entra ou un principal Microsoft Entra disposant de l'autorisation ALTER ANY USER. Une connexion SQL, même celle de l'administrateur du serveur, ne peut pas résoudre l'identité dans Microsoft Entra ID.
      options:
        a: { en: "Changing the database doesn't change the authentication of the session: a SQL login still can't create a Microsoft Entra user, and the app needs a user in BillingDb.", fr: "Changer de base ne change pas l'authentification de la session : une connexion SQL ne peut toujours pas créer un utilisateur Microsoft Entra, et l'application a besoin d'un utilisateur dans BillingDb." }
        b: { en: "SQL DB Contributor is an Azure RBAC role that manages the database resource; it creates no database user and gives no access to the data.", fr: "SQL DB Contributor est un rôle Azure RBAC qui gère la ressource de base de données ; il ne crée aucun utilisateur de base de données et ne donne aucun accès aux données." }
        d: { en: "A user WITHOUT LOGIN can't authenticate at all: it serves impersonation, not the managed identity of the app.", fr: "Un utilisateur WITHOUT LOGIN ne peut pas s'authentifier du tout : il sert à l'emprunt d'identité, pas à l'identité managée de l'application." }
    references:
      - title: Configure and manage Microsoft Entra authentication with Azure SQL
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure?view=azuresql

  # ------------------------------------------------------------------ 5
  - id: dp800-qz-21-05
    objective: "2.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin has a database in Azure SQL Database. A stored procedure must call a text classification model that a partner hosts at `https://models.partner-ai.example/v1/classify`. The partner can't host the model in Azure.

        The callers of the procedure already have the `EXECUTE ANY EXTERNAL ENDPOINT` permission. You need to ensure that the procedure can call the model by using `sp_invoke_external_rest_endpoint`.

        What should you do?
      fr: |
        Tailspin dispose d'une base de données dans Azure SQL Database. Une procédure stockée doit appeler un modèle de classification de texte qu'un partenaire héberge à l'adresse `https://models.partner-ai.example/v1/classify`. Le partenaire ne peut pas héberger le modèle dans Azure.

        Les appelants de la procédure disposent déjà de l'autorisation `EXECUTE ANY EXTERNAL ENDPOINT`. Vous devez faire en sorte que la procédure puisse appeler le modèle à l'aide de `sp_invoke_external_rest_endpoint`.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add an outbound firewall rule for models.partner-ai.example on the logical server.", fr: "Ajouter une règle de pare-feu sortant pour models.partner-ai.example sur le serveur logique." } }
        - { id: b, text: { en: "Publish the partner API through Azure API Management and call its gateway URL.", fr: "Publier l'API du partenaire via Azure API Management et appeler l'URL de sa passerelle." } }
        - { id: c, text: { en: "Run sp_configure to set the external rest endpoint enabled option to 1.", fr: "Exécuter sp_configure pour définir l'option external rest endpoint enabled sur 1." } }
        - { id: d, text: { en: "Create a database scoped credential named after the partner URL with HTTPEndpointHeaders.", fr: "Créer des informations d'identification délimitées à la base nommées d'après l'URL du partenaire avec HTTPEndpointHeaders." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In Azure SQL Database, `sp_invoke_external_rest_endpoint` only calls endpoints whose domain is on an allowlist of Azure services. To reach a service outside that list, expose it through Azure API Management: its `*.azure-api.net` gateway is on the list, and API Management can forward the call to the partner.
        fr: |
          Dans Azure SQL Database, `sp_invoke_external_rest_endpoint` n'appelle que les points de terminaison dont le domaine figure sur une liste verte de services Azure. Pour joindre un service absent de cette liste, exposez-le via Azure API Management : sa passerelle `*.azure-api.net` figure sur la liste, et API Management peut transmettre l'appel au partenaire.
      options:
        a: { en: "Outbound firewall rules can only restrict outbound access further; they don't add a domain to the allowlist of the procedure.", fr: "Les règles de pare-feu sortant ne peuvent que restreindre davantage l'accès sortant ; elles n'ajoutent pas de domaine à la liste verte de la procédure." }
        c: { en: "The procedure is already enabled by default in Azure SQL Database; this option has to be set only in SQL Server 2025 and Azure SQL Managed Instance.", fr: "La procédure est déjà activée par défaut dans Azure SQL Database ; cette option ne doit être définie que dans SQL Server 2025 et Azure SQL Managed Instance." }
        d: { en: "The name of a credential must itself be a URL whose domain is on the allowlist, so a credential for the partner domain doesn't lift the restriction.", fr: "Le nom des informations d'identification doit lui-même être une URL dont le domaine figure sur la liste verte : des informations d'identification pour le domaine du partenaire ne lèvent donc pas la restriction." }
    references:
      - title: sys.sp_invoke_external_rest_endpoint (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-invoke-external-rest-endpoint-transact-sql?view=azuresqldb-current

  # ------------------------------------------------------------------ 6
  - id: dp800-qz-21-06
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove has a database in Azure SQL Database. The **dbo.Account** table has a **BranchID** column. The **Security.UserBranch** table maps the database user name of each advisor to one or more branches. Advisors connect with their own Microsoft Entra accounts.

        You are writing a Row-Level Security solution that must meet the following requirements:

        - Advisors see only the accounts of the branches mapped to them in Security.UserBranch.
        - Members of the database role **Auditors** see every account.
        - Advisors and auditors must not need any permission on Security.UserBranch.
        - The policy must not filter any row until the test team turns it on.

        How should you complete the Transact-SQL statements? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose d'une base de données dans Azure SQL Database. La table **dbo.Account** comporte une colonne **BranchID**. La table **Security.UserBranch** associe le nom d'utilisateur de base de données de chaque conseiller à une ou plusieurs agences. Les conseillers se connectent avec leurs propres comptes Microsoft Entra.

        Vous écrivez une solution Row-Level Security qui doit satisfaire les exigences suivantes :

        - Les conseillers ne voient que les comptes des agences qui leur sont associées dans Security.UserBranch.
        - Les membres du rôle de base de données **Auditors** voient tous les comptes.
        - Les conseillers et les auditeurs ne doivent avoir besoin d'aucune autorisation sur Security.UserBranch.
        - La stratégie ne doit filtrer aucune ligne tant que l'équipe de test ne l'a pas activée.

        Comment devez-vous compléter les instructions Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template:
        en: |
          CREATE FUNCTION Security.fn_BranchPredicate (@BranchID int)
              RETURNS TABLE
              WITH SCHEMABINDING
          AS
              RETURN SELECT 1 AS fn_result
              WHERE [[exempt]]
                 OR EXISTS (SELECT 1 FROM Security.UserBranch AS ub
                            WHERE ub.BranchID = @BranchID
                              AND ub.UserName = USER_NAME());
          GO
          CREATE SECURITY POLICY Security.BranchPolicy
              ADD FILTER PREDICATE Security.fn_BranchPredicate(BranchID) ON dbo.Account
              WITH ([[opts]]);
        fr: |
          CREATE FUNCTION Security.fn_BranchPredicate (@BranchID int)
              RETURNS TABLE
              WITH SCHEMABINDING
          AS
              RETURN SELECT 1 AS fn_result
              WHERE [[exempt]]
                 OR EXISTS (SELECT 1 FROM Security.UserBranch AS ub
                            WHERE ub.BranchID = @BranchID
                              AND ub.UserName = USER_NAME());
          GO
          CREATE SECURITY POLICY Security.BranchPolicy
              ADD FILTER PREDICATE Security.fn_BranchPredicate(BranchID) ON dbo.Account
              WITH ([[opts]]);
      slots:
        - id: exempt
          options:
            - { id: ism, text: "IS_MEMBER(N'Auditors') = 1" }
            - { id: usr, text: "USER_NAME() = N'Auditors'" }
            - { id: srv, text: "IS_SRVROLEMEMBER(N'Auditors') = 1" }
            - { id: ctx, text: "SESSION_CONTEXT(N'Auditors') = 1" }
        - id: opts
          options:
            - { id: on-on, text: "STATE = ON, SCHEMABINDING = ON" }
            - { id: on-off, text: "STATE = ON, SCHEMABINDING = OFF" }
            - { id: off-on, text: "STATE = OFF, SCHEMABINDING = ON" }
            - { id: off-off, text: "STATE = OFF, SCHEMABINDING = OFF" }
    answer:
      values: { exempt: ism, opts: off-on }
    explanation:
      correct:
        en: |
          `IS_MEMBER(N'Auditors')` returns 1 when the current user belongs to the database role Auditors, so auditors pass the predicate for every row. With `SCHEMABINDING = ON`, the permission checks on the predicate function and on the tables it reads are bypassed when users query dbo.Account, so nobody needs SELECT on Security.UserBranch. `STATE = OFF` creates the policy disabled; the test team enables it later with `ALTER SECURITY POLICY ... WITH (STATE = ON)`.
        fr: |
          `IS_MEMBER(N'Auditors')` renvoie 1 quand l'utilisateur actuel appartient au rôle de base de données Auditors : les auditeurs passent donc le prédicat pour toutes les lignes. Avec `SCHEMABINDING = ON`, les vérifications d'autorisations sur la fonction de prédicat et sur les tables qu'elle lit sont ignorées quand les utilisateurs interrogent dbo.Account : personne n'a besoin de SELECT sur Security.UserBranch. `STATE = OFF` crée la stratégie désactivée ; l'équipe de test l'active ensuite avec `ALTER SECURITY POLICY ... WITH (STATE = ON)`.
      options:
        usr: { en: "USER_NAME() returns the name of the database user, not of its roles: no auditor is a user named Auditors.", fr: "USER_NAME() renvoie le nom de l'utilisateur de base de données, pas celui de ses rôles : aucun auditeur n'est un utilisateur nommé Auditors." }
        srv: { en: "IS_SRVROLEMEMBER checks server roles; Auditors is a database role.", fr: "IS_SRVROLEMEMBER vérifie les rôles de serveur ; Auditors est un rôle de base de données." }
        ctx: { en: "Advisors connect with their own accounts and no application sets a session context value named Auditors.", fr: "Les conseillers se connectent avec leurs propres comptes et aucune application ne définit de valeur de contexte de session nommée Auditors." }
        on-off: { en: "STATE = ON enforces the filter at once, and SCHEMABINDING = OFF makes users need SELECT on the function and on Security.UserBranch.", fr: "STATE = ON applique le filtre immédiatement, et SCHEMABINDING = OFF oblige les utilisateurs à disposer de SELECT sur la fonction et sur Security.UserBranch." }
        off-off: { en: "With SCHEMABINDING = OFF, users must have SELECT on the predicate function and on every table it reads.", fr: "Avec SCHEMABINDING = OFF, les utilisateurs doivent disposer de SELECT sur la fonction de prédicat et sur chaque table qu'elle lit." }
        on-on: { en: "STATE = ON starts filtering as soon as the policy is created, before the tests.", fr: "STATE = ON lance le filtrage dès la création de la stratégie, avant les tests." }
    references:
      - title: Row-level security
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security?view=sql-server-ver17
      - title: IS_MEMBER (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/is-member-transact-sql?view=sql-server-ver17

  # ------------------------------------------------------------------ 7
  - id: dp800-qz-21-07
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware has a database in Azure SQL Database with the following objects:

        - The schemas **Reports** and **Sales** are owned by dbo. The schema **HR** is owned by the database user **HRAdmin**. No object has an explicit owner.
        - The view **Reports.vw_Orders** reads **Sales.Orders**.
        - The procedure **Reports.usp_Payroll** reads **HR.Salary** with a static SELECT statement.

        The role **ReportUsers** has `GRANT EXECUTE ON SCHEMA::Reports` and `GRANT SELECT ON Reports.vw_Orders`, and no other permission. A user named **Bob** is a member of ReportUsers. Last week, you ran `DENY SELECT ON Reports.vw_Orders TO Bob`. Today, you run `REVOKE SELECT ON Reports.vw_Orders FROM Bob`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'une base de données dans Azure SQL Database qui contient les objets suivants :

        - Les schémas **Reports** et **Sales** appartiennent à dbo. Le schéma **HR** appartient à l'utilisateur de base de données **HRAdmin**. Aucun objet n'a de propriétaire explicite.
        - La vue **Reports.vw_Orders** lit **Sales.Orders**.
        - La procédure **Reports.usp_Payroll** lit **HR.Salary** avec une instruction SELECT statique.

        Le rôle **ReportUsers** dispose de `GRANT EXECUTE ON SCHEMA::Reports` et de `GRANT SELECT ON Reports.vw_Orders`, et d'aucune autre autorisation. Un utilisateur nommé **Bob** est membre de ReportUsers. La semaine dernière, vous avez exécuté `DENY SELECT ON Reports.vw_Orders TO Bob`. Aujourd'hui, vous exécutez `REVOKE SELECT ON Reports.vw_Orders FROM Bob`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Bob can now query Reports.vw_Orders and get the rows of Sales.Orders.", fr: "Bob peut maintenant interroger Reports.vw_Orders et obtenir les lignes de Sales.Orders." }
        - id: s2
          text: { en: "Members of ReportUsers can run Reports.usp_Payroll and get the rows of HR.Salary.", fr: "Les membres de ReportUsers peuvent exécuter Reports.usp_Payroll et obtenir les lignes de HR.Salary." }
        - id: s3
          text: { en: "Members of ReportUsers can run SELECT * FROM Sales.Orders directly.", fr: "Les membres de ReportUsers peuvent exécuter SELECT * FROM Sales.Orders directement." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          REVOKE removes the earlier DENY and doesn't block anything by itself, so Bob gets SELECT on the view again through ReportUsers; the view and Sales.Orders are both owned by dbo, so the unbroken ownership chain skips the check on the table. Objects without an explicit owner belong to their schema's owner: HR.Salary belongs to HRAdmin and Reports.usp_Payroll to dbo, so the chain is broken and SELECT on HR.Salary is checked, which ReportUsers doesn't have. Ownership chaining applies only inside the view or procedure: a direct query on Sales.Orders needs SELECT on the table.
        fr: |
          REVOKE supprime le DENY antérieur et ne bloque rien par lui-même : Bob retrouve donc SELECT sur la vue via ReportUsers ; la vue et Sales.Orders appartiennent toutes deux à dbo, si bien que la chaîne de propriétés ininterrompue évite la vérification sur la table. Les objets sans propriétaire explicite appartiennent au propriétaire de leur schéma : HR.Salary appartient à HRAdmin et Reports.usp_Payroll à dbo, la chaîne est donc rompue et SELECT est vérifié sur HR.Salary, ce que ReportUsers n'a pas. Le chaînage des propriétés ne s'applique qu'à l'intérieur de la vue ou de la procédure : une requête directe sur Sales.Orders exige SELECT sur la table.
      options:
        s2: { en: "The procedure and the table have different owners (dbo and HRAdmin), so the engine checks SELECT on HR.Salary for the caller.", fr: "La procédure et la table ont des propriétaires différents (dbo et HRAdmin) : le moteur vérifie donc SELECT sur HR.Salary pour l'appelant." }
        s3: { en: "ReportUsers has no permission on Sales.Orders; the ownership chain only helps when the table is reached through the view.", fr: "ReportUsers n'a aucune autorisation sur Sales.Orders ; la chaîne de propriétés n'aide que lorsque la table est atteinte par la vue." }
    references:
      - title: Describe database and object permissions
        url: https://learn.microsoft.com/en-us/training/modules/configure-database-authentication-authorization/5-describe-database-object-permissions
      - title: Ownership and user-schema separation in SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/ownership-and-user-schema-separation

  # ------------------------------------------------------------------ 8
  - id: dp800-qz-21-08
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has a SQL Server 2022 database named **Finance**. The `varbinary` column **CardEnc** of **dbo.Payment** is encrypted with `ENCRYPTBYKEY` by using the symmetric key **KeyCards**, which is encrypted by the certificate **CertCards**. The private key of CertCards is protected by the database master key, which is protected by the service master key.

        Members of the database role **Billing** already have `SELECT` on dbo.Payment. They must decrypt CardEnc in their own queries by running `OPEN SYMMETRIC KEY KeyCards DECRYPTION BY CERTIFICATE CertCards` and `DECRYPTBYKEY`. The solution must follow the principle of least privilege.

        Which two permissions should you grant to Billing? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'une base de données SQL Server 2022 nommée **Finance**. La colonne `varbinary` **CardEnc** de **dbo.Payment** est chiffrée avec `ENCRYPTBYKEY` à l'aide de la clé symétrique **KeyCards**, elle-même chiffrée par le certificat **CertCards**. La clé privée de CertCards est protégée par la clé principale de base de données, elle-même protégée par la clé principale du service.

        Les membres du rôle de base de données **Billing** disposent déjà de `SELECT` sur dbo.Payment. Ils doivent déchiffrer CardEnc dans leurs propres requêtes en exécutant `OPEN SYMMETRIC KEY KeyCards DECRYPTION BY CERTIFICATE CertCards` et `DECRYPTBYKEY`. La solution doit respecter le principe du moindre privilège.

        Quelles sont les deux autorisations que vous devez accorder à Billing ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: "CONTROL ON SYMMETRIC KEY::KeyCards" }
        - { id: b, text: "VIEW DEFINITION ON SYMMETRIC KEY::KeyCards" }
        - { id: c, text: "VIEW DEFINITION ON CERTIFICATE::CertCards" }
        - { id: d, text: "CONTROL ON CERTIFICATE::CertCards" }
        - { id: e, text: "ALTER ANY SYMMETRIC KEY" }
        - { id: f, text: "UNMASK ON dbo.Payment(CardEnc)" }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          OPEN SYMMETRIC KEY requires some permission on the key, without a DENY of VIEW DEFINITION on it; VIEW DEFINITION is the smallest such permission. Opening the key DECRYPTION BY CERTIFICATE also requires CONTROL on the certificate, because the engine uses its private key (here protected by the database master key, so no password is needed).
        fr: |
          OPEN SYMMETRIC KEY exige une autorisation quelconque sur la clé, sans DENY de VIEW DEFINITION sur celle-ci ; VIEW DEFINITION est la plus petite autorisation de ce type. Ouvrir la clé DECRYPTION BY CERTIFICATE exige aussi CONTROL sur le certificat, car le moteur utilise sa clé privée (ici protégée par la clé principale de base de données : aucun mot de passe n'est nécessaire).
      options:
        a: { en: "CONTROL on the key works but also lets Billing alter, drop or change the ownership of the key: it breaks least privilege.", fr: "CONTROL sur la clé fonctionne, mais permet aussi à Billing de modifier, supprimer ou changer le propriétaire de la clé : il enfreint le moindre privilège." }
        c: { en: "VIEW DEFINITION on the certificate only exposes its metadata; decrypting with the certificate requires CONTROL on it.", fr: "VIEW DEFINITION sur le certificat n'expose que ses métadonnées ; déchiffrer avec le certificat exige CONTROL sur celui-ci." }
        e: { en: "ALTER ANY SYMMETRIC KEY is a database-level permission to create, alter and drop every symmetric key; it is broader than needed and not what opening a key requires.", fr: "ALTER ANY SYMMETRIC KEY est une autorisation au niveau de la base qui permet de créer, modifier et supprimer toutes les clés symétriques ; elle est plus large que nécessaire et ce n'est pas ce qu'exige l'ouverture d'une clé." }
        f: { en: "UNMASK applies to Dynamic Data Masking; CardEnc isn't masked but encrypted.", fr: "UNMASK s'applique au masquage dynamique des données ; CardEnc n'est pas masquée mais chiffrée." }
    references:
      - title: OPEN SYMMETRIC KEY (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/open-symmetric-key-transact-sql
      - title: Encrypt a Column of Data
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/encrypt-a-column-of-data

  # ------------------------------------------------------------------ 9
  - id: dp800-qz-21-09
    objective: "2.1.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware has an Azure SQL logical server named **sql-proseware** that hosts 12 databases. New databases are added every month. A regulator sets the following requirements:

        - Every database on sql-proseware, including the databases created later, is audited.
        - Audit records are kept for seven years and can't be modified or deleted during that period by anyone, including subscription owners.
        - The security team queries the audit events of the last 30 days with KQL and creates alerts on them.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un serveur logique Azure SQL nommé **sql-proseware** qui héberge 12 bases de données. De nouvelles bases sont ajoutées chaque mois. Un régulateur fixe les exigences suivantes :

        - Toutes les bases de sql-proseware, y compris celles créées plus tard, sont auditées.
        - Les enregistrements d'audit sont conservés sept ans et ne peuvent être ni modifiés ni supprimés pendant cette période par qui que ce soit, propriétaires de l'abonnement compris.
        - L'équipe de sécurité interroge en KQL les événements d'audit des 30 derniers jours et crée des alertes sur ces événements.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Enable database-level auditing on each of the 12 databases, with a storage account as the destination.", fr: "Activer l'audit au niveau de la base sur chacune des 12 bases, avec un compte de stockage comme destination." } }
        - { id: b, text: { en: "Enable server-level auditing to a storage account protected by a locked time-based retention policy.", fr: "Activer l'audit au niveau du serveur vers un compte de stockage protégé par une stratégie de rétention limitée dans le temps verrouillée." } }
        - { id: c, text: { en: "Add an Event Hubs destination to the server-level audit, and run the KQL queries on the event hub.", fr: "Ajouter une destination Event Hubs à l'audit au niveau du serveur, puis exécuter les requêtes KQL sur l'Event Hub." } }
        - { id: d, text: { en: "Add a Log Analytics workspace as a second destination of the server-level audit.", fr: "Ajouter un espace de travail Log Analytics comme deuxième destination de l'audit au niveau du serveur." } }
        - { id: e, text: { en: "Set the retention of the storage account destination to 2,555 days, without an immutability policy.", fr: "Définir la rétention de la destination compte de stockage sur 2 555 jours, sans stratégie d'immuabilité." } }
        - { id: f, text: { en: "Enable auditing of Microsoft support operations on sql-proseware.", fr: "Activer l'audit des opérations du support Microsoft sur sql-proseware." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A server-level auditing policy applies to all the existing and newly created databases of the server, and one policy can write to a storage account and a Log Analytics workspace at the same time. A locked time-based retention policy on the container (with protected append writes allowed for the audit append blobs) keeps the logs in a WORM state that no user, even an account administrator, can modify or delete. Log Analytics provides the KQL queries and the log alerts. The auditing retention of the storage destination must then be longer than the immutability interval: a retention of 0 isn't supported with an immutability policy.
        fr: |
          Une stratégie d'audit au niveau du serveur s'applique à toutes les bases existantes et nouvellement créées du serveur, et une même stratégie peut écrire en même temps dans un compte de stockage et dans un espace de travail Log Analytics. Une stratégie de rétention limitée dans le temps verrouillée sur le conteneur (avec les écritures d'ajout protégées autorisées pour les objets blob d'ajout de l'audit) conserve les journaux dans un état WORM qu'aucun utilisateur, même un administrateur du compte, ne peut modifier ni supprimer. Log Analytics fournit les requêtes KQL et les alertes de journal. La rétention d'audit de la destination de stockage doit alors être plus longue que l'intervalle d'immuabilité : une rétention de 0 n'est pas prise en charge avec une stratégie d'immuabilité.
      options:
        a: { en: "Database-level policies cover only the databases on which you enable them: the databases created next month wouldn't be audited.", fr: "Les stratégies au niveau de la base ne couvrent que les bases sur lesquelles vous les activez : les bases créées le mois prochain ne seraient pas auditées." }
        c: { en: "Event Hubs streams the events to other systems; it doesn't store them for KQL queries and alerts.", fr: "Event Hubs diffuse les événements vers d'autres systèmes ; il ne les stocke pas pour des requêtes KQL et des alertes." }
        e: { en: "A retention setting deletes older logs but doesn't protect the logs from changes or deletion by account owners.", fr: "Un paramètre de rétention supprime les journaux plus anciens, mais ne protège pas les journaux contre la modification ou la suppression par les propriétaires du compte." }
        f: { en: "Microsoft support operations auditing records only what Microsoft support engineers do during a support request.", fr: "L'audit des opérations du support Microsoft n'enregistre que ce que font les ingénieurs du support Microsoft pendant une demande de support." }
    references:
      - title: Auditing for Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview?view=azuresql
      - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview

  # ------------------------------------------------------------------ 10
  - id: dp800-qz-21-10
    objective: "2.1.8"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip exposes **dbo.Orders** of an Azure SQL database through the REST endpoint of Data API builder (DAB) 2.0. The runtime uses the `EntraId` authentication provider. Customers' tokens contain the `oid` claim, which is stored in the **CustomerId** column of their orders. The tokens of the back-office staff also contain `order-admin` in their `roles` claim. No Row-Level Security policy exists in the database.

        The DAB entity **Orders** has the following permissions.

        ```json
        "permissions": [
          {
            "role": "authenticated",
            "actions": [
              "create",
              {
                "action": "read",
                "fields": { "include": [ "*" ], "exclude": [ "CostPrice" ] },
                "policy": { "database": "@item.CustomerId eq @claims.oid" }
              }
            ]
          },
          { "role": "order-admin", "actions": [ "*" ] }
        ]
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip expose **dbo.Orders** d'une base de données Azure SQL via le point de terminaison REST de Data API builder (DAB) 2.0. Le runtime utilise le fournisseur d'authentification `EntraId`. Les jetons des clients contiennent la revendication `oid`, stockée dans la colonne **CustomerId** de leurs commandes. Les jetons du personnel administratif contiennent aussi `order-admin` dans leur revendication `roles`. Aucune stratégie Row-Level Security n'existe dans la base de données.

        L'entité DAB **Orders** dispose des autorisations suivantes.

        ```json
        "permissions": [
          {
            "role": "authenticated",
            "actions": [
              "create",
              {
                "action": "read",
                "fields": { "include": [ "*" ], "exclude": [ "CostPrice" ] },
                "policy": { "database": "@item.CustomerId eq @claims.oid" }
              }
            ]
          },
          { "role": "order-admin", "actions": [ "*" ] }
        ]
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A customer who sends GET /api/Orders?$select=OrderId,CostPrice receives their own orders without the CostPrice field.", fr: "Un client qui envoie GET /api/Orders?$select=OrderId,CostPrice reçoit ses propres commandes sans le champ CostPrice." }
        - id: s2
          text: { en: "A customer can send a POST request that creates an order whose CustomerId is the oid of another customer.", fr: "Un client peut envoyer une requête POST qui crée une commande dont le CustomerId est l'oid d'un autre client." }
        - id: s3
          text: { en: "A staff member who sends a valid token without the X-MS-API-ROLE header can read the CostPrice of every order.", fr: "Un membre du personnel qui envoie un jeton valide sans l'en-tête X-MS-API-ROLE peut lire le CostPrice de toutes les commandes." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          DAB rejects a REST or GraphQL request that references an excluded field: it doesn't silently drop CostPrice from the response. Database policies aren't supported for the create action, because an INSERT has no WHERE clause, and the create permission here has no field restriction, so nothing stops a customer from setting another CustomerId; a block predicate in the database (Row-Level Security fed by the claims) would close that gap. A request with a valid token and no X-MS-API-ROLE header is evaluated under the authenticated role, even if the token contains order-admin.
        fr: |
          DAB rejette une requête REST ou GraphQL qui référence un champ exclu : il ne retire pas silencieusement CostPrice de la réponse. Les stratégies de base de données ne sont pas prises en charge pour l'action create, car un INSERT n'a pas de clause WHERE, et l'autorisation create n'a ici aucune restriction de champ : rien n'empêche donc un client de définir un autre CustomerId ; un prédicat de blocage dans la base (Row-Level Security alimentée par les revendications) comblerait cette faille. Une requête avec un jeton valide et sans en-tête X-MS-API-ROLE est évaluée sous le rôle authenticated, même si le jeton contient order-admin.
      options:
        s1: { en: "The request references the excluded CostPrice field, so DAB rejects it instead of returning partial results.", fr: "La requête référence le champ exclu CostPrice : DAB la rejette au lieu de renvoyer des résultats partiels." }
        s3: { en: "Without the header, the request runs under the authenticated role, which excludes CostPrice; the staff must send X-MS-API-ROLE: order-admin.", fr: "Sans l'en-tête, la requête s'exécute sous le rôle authenticated, qui exclut CostPrice ; le personnel doit envoyer X-MS-API-ROLE: order-admin." }
    references:
      - title: Configure database policies for row-level filtering
        url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/security/how-to-configure-database-policies
      - title: Authorization overview
        url: https://learn.microsoft.com/en-us/azure/data-api-builder/concept/security/authorization
