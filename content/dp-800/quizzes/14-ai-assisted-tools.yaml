chapter: 14-ai-assisted-tools
questions:
  # ------------------------------------------------------------------ 1
  - id: dp800-qz-14-01
    objective: "1.4.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Your team stores a file named `.github/prompts/review-procedure.prompt.md` in the repository of a SQL database project. The file contains a reusable prompt that reviews a stored procedure against the team's checklist.

        A developer wants to run this review on the procedure that is open in Visual Studio Code. What should the developer do?
      fr: |
        Votre équipe stocke un fichier nommé `.github/prompts/review-procedure.prompt.md` dans le dépôt d'un projet de base de données SQL. Le fichier contient un prompt réutilisable qui relit une procédure stockée au regard de la liste de contrôle de l'équipe.

        Un développeur veut lancer cette relecture sur la procédure ouverte dans Visual Studio Code. Que doit faire le développeur ?
    body:
      options:
        - { id: a, text: { en: "Nothing: Copilot adds every .prompt.md file of the repository to each chat request.", fr: "Rien : Copilot ajoute chaque fichier .prompt.md du dépôt à chaque requête de conversation." } }
        - { id: b, text: { en: "Add an applyTo glob to the frontmatter of the prompt file so that it runs for .sql files.", fr: "Ajouter un glob applyTo à l'en-tête du fichier de prompt pour qu'il s'exécute pour les fichiers .sql." } }
        - { id: c, text: { en: "Reference the prompt file in Copilot Chat with the # symbol or select it in the prompt picker.", fr: "Référencer le fichier de prompt dans Copilot Chat avec le symbole # ou le sélectionner dans le sélecteur de prompts." } }
        - { id: d, text: { en: "Copy the prompt into .github/copilot-instructions.md so that the review is available on demand.", fr: "Copier le prompt dans .github/copilot-instructions.md pour que la relecture soit disponible à la demande." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Prompt files are reusable prompts for specific tasks, stored in the .github/prompts folder. They aren't applied automatically: the developer references the file in the chat with the # symbol or picks it in the prompt picker when the task is needed.
        fr: |
          Les fichiers de prompt sont des prompts réutilisables pour des tâches précises, stockés dans le dossier .github/prompts. Ils ne s'appliquent pas automatiquement : le développeur référence le fichier dans la conversation avec le symbole # ou le choisit dans le sélecteur de prompts quand la tâche est nécessaire.
      options:
        a: { en: "Prompt files are used only when they are referenced; the files that Copilot adds automatically are instruction files.", fr: "Les fichiers de prompt ne servent que lorsqu'ils sont référencés ; les fichiers que Copilot ajoute automatiquement sont les fichiers d'instructions." }
        b: { en: "applyTo scopes .instructions.md files to file patterns; it doesn't turn a prompt file into something that runs by itself.", fr: "applyTo limite les fichiers .instructions.md à des modèles de fichiers ; il ne transforme pas un fichier de prompt en élément qui s'exécute seul." }
        d: { en: "Repository instructions are added to every chat request, so the review prompt would no longer be on demand.", fr: "Les instructions du dépôt sont ajoutées à chaque requête de conversation : le prompt de relecture ne serait plus à la demande." }
    references:
      - title: Create and Configure GitHub Copilot Instruction Files - Training
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/6-create-configure-copilot-instruction-files

  # ------------------------------------------------------------------ 2
  - id: dp800-qz-14-02
    objective: "1.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind's database developers use GitHub Copilot in SQL Server Management Studio (SSMS) and Visual Studio Code. The company manages its GitHub organization with GitHub Enterprise Cloud.

        The security team needs visibility into how GitHub Copilot is used across the organization. What should you use?
      fr: |
        Les développeurs de bases de données de Northwind utilisent GitHub Copilot dans SQL Server Management Studio (SSMS) et Visual Studio Code. L'entreprise gère son organisation GitHub avec GitHub Enterprise Cloud.

        L'équipe de sécurité a besoin de visibilité sur l'utilisation de GitHub Copilot dans toute l'organisation. Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "The auditing of the Azure SQL logical servers", fr: "L'audit des serveurs logiques Azure SQL" } }
        - { id: b, text: { en: "The GitHub Copilot Chat output log of each developer", fr: "Le journal de sortie GitHub Copilot Chat de chaque développeur" } }
        - { id: c, text: { en: "A copilot-instructions.md file in each repository", fr: "Un fichier copilot-instructions.md dans chaque dépôt" } }
        - { id: d, text: { en: "The audit logs of GitHub Enterprise Cloud", fr: "Les journaux d'audit de GitHub Enterprise Cloud" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Organizations that use GitHub Enterprise Cloud can track GitHub Copilot usage through audit logs. The logs give the security team one place to see how the tool is used across the organization, whatever the editor.
        fr: |
          Les organisations qui utilisent GitHub Enterprise Cloud peuvent suivre l'utilisation de GitHub Copilot par les journaux d'audit. Ces journaux donnent à l'équipe de sécurité un seul endroit pour voir comment l'outil est utilisé dans toute l'organisation, quel que soit l'éditeur.
      options:
        a: { en: "Database auditing records the events of the databases, not how developers use the AI assistant.", fr: "L'audit de base de données enregistre les événements des bases, pas l'utilisation de l'assistant IA par les développeurs." }
        b: { en: "The output log shows the requests of one developer on one computer, which a developer uses to check the instructions that were sent.", fr: "Le journal de sortie montre les requêtes d'un développeur sur un ordinateur ; il sert à vérifier les instructions envoyées." }
        c: { en: "Instruction files guide the code that Copilot generates; they record nothing.", fr: "Les fichiers d'instructions guident le code que Copilot génère ; ils n'enregistrent rien." }
    references:
      - title: Interpret Security Impact of Using AI-assisted Tools - Training
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/3-interpret-security-impact

  # ------------------------------------------------------------------ 3
  - id: dp800-qz-14-03
    objective: "1.4.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A developer at Litware uses GitHub Copilot in Agent mode in Visual Studio Code. In the same chat session, the agent must query the application's database, hosted in Azure SQL Database, and also inspect the storage accounts and the web app of the same application.

        The developer must sign in with their own account. Which MCP endpoint should the developer use?
      fr: |
        Un développeur de Litware utilise GitHub Copilot en mode Agent dans Visual Studio Code. Dans la même session de conversation, l'agent doit interroger la base de données de l'application, hébergée dans Azure SQL Database, et examiner aussi les comptes de stockage et l'application web de la même application.

        Le développeur doit se connecter avec son propre compte. Quel point de terminaison MCP le développeur doit-il utiliser ?
    body:
      options:
        - { id: a, text: { en: "SQL MCP Server, hosted by Data API builder", fr: "SQL MCP Server, hébergé par le générateur d'API de données" } }
        - { id: b, text: { en: "The Azure MCP Server extension", fr: "L'extension Azure MCP Server" } }
        - { id: c, text: { en: "Chat with this database, in the MSSQL extension", fr: "Chat with this database, dans l'extension MSSQL" } }
        - { id: d, text: { en: "A published Fabric data agent", fr: "Un agent de données Fabric publié" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure MCP Server provides integration across Azure services, including SQL databases. You install its extension in Visual Studio Code, authenticate with your Azure account and use it in Agent mode, so one session covers the database and the other Azure resources.
        fr: |
          Azure MCP Server fournit une intégration avec l'ensemble des services Azure, y compris les bases de données SQL. Vous installez son extension dans Visual Studio Code, vous vous authentifiez avec votre compte Azure et vous l'utilisez en mode Agent : une seule session couvre la base de données et les autres ressources Azure.
      options:
        a: { en: "SQL MCP Server exposes the entities of a database configured in Data API builder, not the other Azure resources.", fr: "SQL MCP Server expose les entités d'une base configurées dans le générateur d'API de données, pas les autres ressources Azure." }
        c: { en: "Chat with this database gives schema-aware chat about the connected database only.", fr: "Chat with this database offre une conversation qui connaît le schéma de la base connectée uniquement." }
        d: { en: "A Fabric data agent exposes lakehouse, warehouse or semantic model data from Fabric, not Azure SQL and Azure resources.", fr: "Un agent de données Fabric expose les données d'un lakehouse, d'un entrepôt ou d'un modèle sémantique de Fabric, pas Azure SQL ni les ressources Azure." }
    references:
      - title: Connect to MCP Server Endpoints for SQL Server and Fabric Lakehouse - Training
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/7-connect-mcp-server-endpoints

  # ------------------------------------------------------------------ 4
  - id: dp800-qz-14-04
    objective: "1.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A database administrator at Adatum uses GitHub Copilot in SQL Server Management Studio (SSMS) 22.7 in Agent mode. The administrator wants to declare three HTTP MCP servers in a configuration file instead of adding them one by one from the Tools panel.

        The servers must be available in SSMS for the administrator's user account. Which file should the administrator create or edit?
      fr: |
        Un administrateur de bases de données d'Adatum utilise GitHub Copilot dans SQL Server Management Studio (SSMS) 22.7 en mode Agent. L'administrateur veut déclarer trois serveurs MCP HTTP dans un fichier de configuration au lieu de les ajouter un par un depuis le volet Tools.

        Les serveurs doivent être disponibles dans SSMS pour le compte d'utilisateur de l'administrateur. Quel fichier l'administrateur doit-il créer ou modifier ?
    body:
      options:
        - { id: a, text: "`%USERPROFILE%\\.mcp.json`" }
        - { id: b, text: "`.vscode/mcp.json`" }
        - { id: c, text: "`.github/copilot-instructions.md`" }
        - { id: d, text: "`dab-config.json`" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          In SSMS, `%USERPROFILE%\.mcp.json` is a global configuration file that makes the MCP servers it lists available for your user account. After you save it, SSMS initializes the servers; their tools still have to be enabled in the Tools list.
        fr: |
          Dans SSMS, `%USERPROFILE%\.mcp.json` est un fichier de configuration global qui rend les serveurs MCP qu'il liste disponibles pour votre compte d'utilisateur. Une fois le fichier enregistré, SSMS initialise les serveurs ; leurs outils doivent encore être activés dans la liste Tools.
      options:
        b: { en: "`.vscode/mcp.json` is the workspace file of Visual Studio Code: it belongs to one folder, not to the user account in SSMS.", fr: "`.vscode/mcp.json` est le fichier d'espace de travail de Visual Studio Code : il appartient à un dossier, pas au compte d'utilisateur dans SSMS." }
        c: { en: "Instruction files carry coding standards; they don't declare MCP servers.", fr: "Les fichiers d'instructions portent des normes de code ; ils ne déclarent pas de serveurs MCP." }
        d: { en: "dab-config.json configures the entities that SQL MCP Server exposes, not the servers that an MCP client connects to.", fr: "dab-config.json configure les entités que SQL MCP Server expose, pas les serveurs auxquels un client MCP se connecte." }
    references:
      - title: MCP Servers - GitHub Copilot in SQL Server Management Studio
        url: https://learn.microsoft.com/en-us/ssms/github-copilot/mcp-servers

  # ------------------------------------------------------------------ 5
  - id: dp800-qz-14-05
    objective: "1.4.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        A repository is opened as the workspace in Visual Studio Code, with the default settings. It contains the following files:

        - `.github/copilot-instructions.md`: general Transact-SQL standards.
        - `.github/instructions/tsql.instructions.md`: frontmatter with applyTo set to `'**/*.sql'`.
        - `.github/prompts/new-table.prompt.md`: a prompt that creates a table with the standard audit columns.
        - `database/instructions/naming.instructions.md`: frontmatter with applyTo set to `'**/*.sql'`.

        A developer asks GitHub Copilot Chat to add a column to `database/tables/Customer.sql`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un dépôt est ouvert comme espace de travail dans Visual Studio Code, avec les paramètres par défaut. Il contient les fichiers suivants :

        - `.github/copilot-instructions.md` : normes Transact-SQL générales.
        - `.github/instructions/tsql.instructions.md` : en-tête avec applyTo défini sur `'**/*.sql'`.
        - `.github/prompts/new-table.prompt.md` : un prompt qui crée une table avec les colonnes d'audit standard.
        - `database/instructions/naming.instructions.md` : en-tête avec applyTo défini sur `'**/*.sql'`.

        Un développeur demande à GitHub Copilot Chat d'ajouter une colonne à `database/tables/Customer.sql`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The request includes the content of copilot-instructions.md and of tsql.instructions.md.", fr: "La requête inclut le contenu de copilot-instructions.md et de tsql.instructions.md." } }
        - { id: s2, text: { en: "The request includes the content of new-table.prompt.md.", fr: "La requête inclut le contenu de new-table.prompt.md." } }
        - { id: s3, text: { en: "The request includes the content of naming.instructions.md.", fr: "La requête inclut le contenu de naming.instructions.md." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Repository instructions apply to every chat request in the repository, and a scoped file in .github/instructions is added automatically when the file matches its applyTo glob, as Customer.sql does. A prompt file is used only when the developer references it. Scoped instruction files are read from the .github/instructions folder of the workspace, so a file stored in database/instructions isn't picked up.
        fr: |
          Les instructions du dépôt s'appliquent à chaque requête de conversation dans le dépôt, et un fichier ciblé de .github/instructions est ajouté automatiquement quand le fichier correspond à son glob applyTo, comme Customer.sql. Un fichier de prompt ne sert que lorsque le développeur le référence. Les fichiers d'instructions ciblés sont lus dans le dossier .github/instructions de l'espace de travail : un fichier stocké dans database/instructions n'est pas pris en compte.
      options:
        s2: { en: "Prompt files are referenced on demand with # or the prompt picker; they're never added automatically.", fr: "Les fichiers de prompt sont référencés à la demande avec # ou le sélecteur de prompts ; ils ne sont jamais ajoutés automatiquement." }
        s3: { en: "The .instructions.md suffix and the applyTo glob aren't enough: the file must be in .github/instructions.", fr: "Le suffixe .instructions.md et le glob applyTo ne suffisent pas : le fichier doit se trouver dans .github/instructions." }
    references:
      - title: "Quickstart: Custom Instructions for GitHub Copilot and T-SQL - MSSQL Extension for Visual Studio Code"
        url: https://learn.microsoft.com/en-us/sql/tools/visual-studio-code-extensions/github-copilot/custom-instructions
      - title: Create and Configure GitHub Copilot Instruction Files - Training
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/6-create-configure-copilot-instruction-files

  # ------------------------------------------------------------------ 6
  - id: dp800-qz-14-06
    objective: "1.4.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam plans to give a GitHub Copilot agent access to an Azure SQL database through SQL MCP Server, in Data API builder 2.0. The dab-config.json file defines entities for the Sales tables and grants the read action on them to a role named analyst only.

        A developer starts the server with the following command.

        ```bash
        dab start --mcp-stdio
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam prévoit de donner à un agent GitHub Copilot l'accès à une base de données Azure SQL par SQL MCP Server, dans le générateur d'API de données 2.0. Le fichier dab-config.json définit des entités pour les tables Sales et accorde l'action read sur ces entités à un rôle nommé analyst uniquement.

        Un développeur démarre le serveur avec la commande suivante.

        ```bash
        dab start --mcp-stdio
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "SQL MCP Server translates the agent's natural language questions into free-form Transact-SQL that it runs on the database.", fr: "SQL MCP Server traduit les questions en langage naturel de l'agent en Transact-SQL libre qu'il exécute sur la base." } }
        - { id: s2, text: { en: "The MCP tools run with the permissions of the anonymous role, so the agent can't read the Sales entities.", fr: "Les outils MCP s'exécutent avec les autorisations du rôle anonymous : l'agent ne peut donc pas lire les entités Sales." } }
        - { id: s3, text: { en: "If the anonymous role is granted the create action on the Sales entities, the agent can create an index on a Sales table through SQL MCP Server.", fr: "Si le rôle anonymous reçoit l'action create sur les entités Sales, l'agent peut créer un index sur une table Sales par SQL MCP Server." } }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          SQL MCP Server intentionally doesn't do NL2SQL: the agent works through the DAB entities, and the DAB query builder generates deterministic Transact-SQL. In stdio mode, the role is set with `role:<role-name>` and defaults to anonymous, which has no permission here. The server works with data, not schema: create is a DML action (create_record), and no tool runs DDL.
        fr: |
          SQL MCP Server ne fait volontairement pas de NL2SQL : l'agent passe par les entités DAB, et le générateur de requêtes de DAB produit un Transact-SQL déterministe. En mode stdio, le rôle se définit avec `role:<role-name>` et vaut anonymous par défaut, qui n'a ici aucune autorisation. Le serveur travaille sur les données, pas sur le schéma : create est une action DML (create_record), et aucun outil n'exécute de DDL.
      options:
        s1: { en: "The agent calls tools such as read_records on entities; it never sends its own SQL to the database.", fr: "L'agent appelle des outils comme read_records sur des entités ; il n'envoie jamais son propre SQL à la base." }
        s3: { en: "create inserts rows through create_record; SQL MCP Server doesn't run DDL such as CREATE INDEX.", fr: "create insère des lignes par create_record ; SQL MCP Server n'exécute pas de DDL comme CREATE INDEX." }
    references:
      - title: SQL MCP Server overview - SQL MCP Server
        url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/overview

  # ------------------------------------------------------------------ 7
  - id: dp800-qz-14-07
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank's database administrators use GitHub Copilot in SQL Server Management Studio (SSMS) 22.7. The company's GitHub Copilot subscription is managed in GitHub Enterprise Cloud. The administrators work in Agent mode with an approved MCP server named **sqlmcp-ro**, which connects to the production databases with a read-only identity.

        An audit finds that an administrator added a community MCP server by editing `%USERPROFILE%\.mcp.json`. You must meet the following requirements:

        - The administrators keep Agent mode and sqlmcp-ro.
        - SSMS blocks the connection to any other MCP server for every administrator, however the server was added.
        - The solution must minimize administrative effort.

        What should you do?
      fr: |
        Les administrateurs de bases de données de Woodgrove Bank utilisent GitHub Copilot dans SQL Server Management Studio (SSMS) 22.7. L'abonnement GitHub Copilot de l'entreprise est géré dans GitHub Enterprise Cloud. Les administrateurs travaillent en mode Agent avec un serveur MCP approuvé nommé **sqlmcp-ro**, qui se connecte aux bases de production avec une identité en lecture seule.

        Un audit constate qu'un administrateur a ajouté un serveur MCP communautaire en modifiant `%USERPROFILE%\.mcp.json`. Vous devez répondre aux exigences suivantes :

        - Les administrateurs conservent le mode Agent et sqlmcp-ro.
        - SSMS bloque la connexion à tout autre serveur MCP pour chaque administrateur, quelle que soit la façon dont le serveur a été ajouté.
        - La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Deploy the Disable Agent Mode policy to the computers by using the SSMS administrative templates.", fr: "Déployer la stratégie Disable Agent Mode sur les ordinateurs avec les modèles d'administration de SSMS." } }
        - { id: b, text: { en: "Configure an MCP server allow list that contains only sqlmcp-ro in the GitHub Copilot MCP policies.", fr: "Configurer une liste d'autorisation des serveurs MCP qui contient uniquement sqlmcp-ro dans les stratégies MCP de GitHub Copilot." } }
        - { id: c, text: { en: "Add a rule to the copilot-instructions.md file of each repository that forbids other MCP servers.", fr: "Ajouter au fichier copilot-instructions.md de chaque dépôt une règle qui interdit les autres serveurs MCP." } }
        - { id: d, text: { en: "Rely on SSMS keeping the tools of a newly added MCP server disabled until the user enables them.", fr: "S'appuyer sur le fait que SSMS garde désactivés les outils d'un serveur MCP nouvellement ajouté jusqu'à ce que l'utilisateur les active." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Administrators set the MCP server allow list in the GitHub Copilot enterprise or organization policies for MCP (AI Controls > MCP). SSMS checks the list whenever a user connects to an MCP server and blocks any server that isn't on it, whether it was added from the Tools panel or in .mcp.json. One central setting covers every administrator and keeps Agent mode.
        fr: |
          Les administrateurs définissent la liste d'autorisation des serveurs MCP dans les stratégies MCP de GitHub Copilot de l'entreprise ou de l'organisation (AI Controls > MCP). SSMS vérifie la liste chaque fois qu'un utilisateur se connecte à un serveur MCP et bloque tout serveur qui n'y figure pas, qu'il ait été ajouté depuis le volet Tools ou dans .mcp.json. Un seul paramètre central couvre tous les administrateurs et conserve le mode Agent.
      options:
        a: { en: "Disable Agent Mode removes Agent mode entirely, including the approved server that the administrators must keep.", fr: "Disable Agent Mode supprime entièrement le mode Agent, y compris le serveur approuvé que les administrateurs doivent conserver." }
        c: { en: "Instructions guide the model but enforce nothing; SSMS would still connect to the community server.", fr: "Les instructions guident le modèle mais n'imposent rien ; SSMS se connecterait toujours au serveur communautaire." }
        d: { en: "Tools are disabled by default, but any user can enable them in the Tools list, so nothing is blocked.", fr: "Les outils sont désactivés par défaut, mais tout utilisateur peut les activer dans la liste Tools : rien n'est bloqué." }
    references:
      - title: Admin Controls - GitHub Copilot in SQL Server Management Studio
        url: https://learn.microsoft.com/en-us/ssms/github-copilot/admin-controls
      - title: MCP Servers - GitHub Copilot in SQL Server Management Studio
        url: https://learn.microsoft.com/en-us/ssms/github-copilot/mcp-servers

  # ------------------------------------------------------------------ 8
  - id: dp800-qz-14-08
    objective: "1.4.5"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        You develop an inventory application against an Azure SQL database. Data API builder 2.0 is installed on your computer, the connection string is stored in an environment variable named INV_SQL, and no Data API builder configuration file exists yet. The configuration that `dab init` creates enables the REST, GraphQL and MCP endpoints.

        GitHub Copilot in Agent mode in Visual Studio Code must read the **Inventory.StockLevel** table through SQL MCP Server over the streamable HTTP transport.

        Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Vous développez une application de gestion des stocks sur une base de données Azure SQL. Le générateur d'API de données 2.0 est installé sur votre ordinateur, la chaîne de connexion est stockée dans une variable d'environnement nommée INV_SQL, et aucun fichier de configuration du générateur d'API de données n'existe encore. La configuration créée par `dab init` active les points de terminaison REST, GraphQL et MCP.

        GitHub Copilot en mode Agent dans Visual Studio Code doit lire la table **Inventory.StockLevel** par SQL MCP Server sur le transport HTTP diffusable (streamable HTTP).

        Quelles sont les cinq actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 5
      actions:
        - { id: init, text: { en: "Run `dab init --database-type mssql --connection-string \"@env('INV_SQL')\"`.", fr: "Exécuter `dab init --database-type mssql --connection-string \"@env('INV_SQL')\"`." } }
        - { id: add, text: { en: "Run `dab add StockLevel --source Inventory.StockLevel --permissions \"anonymous:read\"`.", fr: "Exécuter `dab add StockLevel --source Inventory.StockLevel --permissions \"anonymous:read\"`." } }
        - { id: start, text: { en: "Run `dab start`.", fr: "Exécuter `dab start`." } }
        - { id: stdio, text: { en: "Run `dab start --mcp-stdio role:anonymous`.", fr: "Exécuter `dab start --mcp-stdio role:anonymous`." } }
        - { id: addsrv, text: { en: "In Visual Studio Code, run **MCP: Add Server**, select HTTP, and enter the endpoint URL that ends with /mcp.", fr: "Dans Visual Studio Code, exécuter **MCP: Add Server**, sélectionner HTTP et saisir l'URL du point de terminaison qui se termine par /mcp." } }
        - { id: agent, text: { en: "In Copilot Chat, switch to Agent mode and enable the tools of the server in the tools list.", fr: "Dans Copilot Chat, passer en mode Agent et activer les outils du serveur dans la liste des outils." } }
        - { id: chat, text: { en: "In the Connections view, right-click the database and select **Chat with this database**.", fr: "Dans la vue Connections, cliquer avec le bouton droit sur la base et sélectionner **Chat with this database**." } }
    answer:
      sequence: [init, add, start, addsrv, agent]
    explanation:
      correct:
        en: |
          dab init creates the configuration file with the connection string read from the environment, and dab add publishes the table as an entity with its permissions. dab start then hosts the REST, GraphQL and MCP endpoints, and the MCP endpoint URL ends with /mcp. You add that URL as an HTTP server with MCP: Add Server, and the tools become usable only in Agent mode, once they are selected for the session.
        fr: |
          dab init crée le fichier de configuration avec la chaîne de connexion lue dans l'environnement, et dab add publie la table comme entité avec ses autorisations. dab start héberge ensuite les points de terminaison REST, GraphQL et MCP, et l'URL du point de terminaison MCP se termine par /mcp. Vous ajoutez cette URL comme serveur HTTP avec MCP: Add Server, et les outils ne sont utilisables qu'en mode Agent, une fois sélectionnés pour la session.
      options:
        stdio: { en: "`--mcp-stdio` starts the stdio transport, which the client launches as a process; the requirement is the streamable HTTP endpoint.", fr: "`--mcp-stdio` démarre le transport stdio, que le client lance comme processus ; l'exigence porte sur le point de terminaison HTTP diffusable." }
        chat: { en: "Chat with this database uses the MSSQL extension connection, not SQL MCP Server.", fr: "Chat with this database utilise la connexion de l'extension MSSQL, pas SQL MCP Server." }
    references:
      - title: Connect to MCP Server Endpoints for SQL Server and Fabric Lakehouse - Training
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/7-connect-mcp-server-endpoints
      - title: Configure Model and MCP Tool Options in Copilot Chat Sessions - Training
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-sql-solutions-ai-assisted-tools/5-configure-model-mcp-tool-options

  # ------------------------------------------------------------------ 9
  - id: dp800-qz-14-09
    objective: "1.4.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso exposes an Azure SQL database to GitHub Copilot agents through SQL MCP Server, in Data API builder 2.0. The dab-config.json file must meet the following requirements:

        - **Payroll**: the hr role keeps reading the entity through the REST endpoint, but the MCP tools must not expose it to agents.
        - **OrderStatus**: the entity is based on the stored procedure dbo.usp_GetOrderStatus, and agents must discover it as its own named MCP tool.

        How should you complete the configuration? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso expose une base de données Azure SQL aux agents GitHub Copilot par SQL MCP Server, dans le générateur d'API de données 2.0. Le fichier dab-config.json doit répondre aux exigences suivantes :

        - **Payroll** : le rôle hr continue de lire l'entité par le point de terminaison REST, mais les outils MCP ne doivent pas l'exposer aux agents.
        - **OrderStatus** : l'entité est fondée sur la procédure stockée dbo.usp_GetOrderStatus, et les agents doivent la découvrir comme un outil MCP nommé à part entière.

        Comment devez-vous compléter la configuration ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        {
          "entities": {
            "Payroll": {
              "source": "dbo.Payroll",
              "mcp": { [[hide]] },
              "permissions": [ { "role": "hr", "actions": [ "read" ] } ]
            },
            "OrderStatus": {
              "source": { "type": "[[stype]]", "object": "dbo.usp_GetOrderStatus" },
              "mcp": { [[tool]] },
              "permissions": [ { "role": "support", "actions": [ "execute" ] } ]
            }
          }
        }
      slots:
        - id: hide
          options:
            - { id: dmloff, text: "\"dml-tools\": false" }
            - { id: dmlon, text: "\"dml-tools\": true" }
            - { id: customoff, text: "\"custom-tool\": false" }
        - id: stype
          options:
            - { id: table, text: "table" }
            - { id: view, text: "view" }
            - { id: sp, text: "stored-procedure" }
        - id: tool
          options:
            - { id: custom, text: "\"custom-tool\": true" }
            - { id: dmloff2, text: "\"dml-tools\": false" }
            - { id: customoff2, text: "\"custom-tool\": false" }
    answer:
      values: { hide: dmloff, stype: sp, tool: custom }
    explanation:
      correct:
        en: |
          Entities take part in the MCP DML tools by default; `"dml-tools": false` excludes Payroll from them without changing its REST permissions. `"custom-tool": true` registers a stored procedure entity as a named MCP tool that agents discover through tools/list, and the property is valid only when the source type is stored-procedure.
        fr: |
          Les entités participent par défaut aux outils DML de MCP ; `"dml-tools": false` en exclut Payroll sans modifier ses autorisations REST. `"custom-tool": true` enregistre une entité de procédure stockée comme outil MCP nommé que les agents découvrent par tools/list, et la propriété n'est valide que si le type de source est stored-procedure.
      options:
        dmlon: { en: "true is the default behavior: Payroll would stay visible to the agents.", fr: "true correspond au comportement par défaut : Payroll resterait visible pour les agents." }
        customoff: { en: "custom-tool applies only to stored procedure entities; it doesn't remove a table from the DML tools.", fr: "custom-tool ne s'applique qu'aux entités de procédure stockée ; il ne retire pas une table des outils DML." }
        table: { en: "dbo.usp_GetOrderStatus is a stored procedure, and custom-tool requires a stored-procedure entity.", fr: "dbo.usp_GetOrderStatus est une procédure stockée, et custom-tool exige une entité stored-procedure." }
        view: { en: "dbo.usp_GetOrderStatus is a stored procedure, not a view.", fr: "dbo.usp_GetOrderStatus est une procédure stockée, pas une vue." }
        dmloff2: { en: "This setting hides the entity from the DML tools instead of publishing it as a named tool.", fr: "Ce paramètre masque l'entité des outils DML au lieu de la publier comme outil nommé." }
        customoff2: { en: "With false, the procedure isn't registered as its own named tool.", fr: "Avec false, la procédure n'est pas enregistrée comme outil nommé à part entière." }
    references:
      - title: SQL MCP Server overview - SQL MCP Server
        url: https://learn.microsoft.com/en-us/azure/data-api-builder/mcp/overview

  # ------------------------------------------------------------------ 10
  - id: dp800-qz-14-10
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin has a Microsoft Fabric tenant with an F64 capacity named **cap-main** in the East US region. The Copilot tenant settings aren't delegated to capacity administrators, and the tenant allows Fabric Copilot capacities. The setting **Users can use Copilot and other features powered by Azure OpenAI** is enabled for a security group named **SG-Copilot** only.

        A data engineer named User1 isn't a member of SG-Copilot. User1 is a Contributor of a workspace named **WS-Reports**, which uses the Pro license mode. User1 must be able to use Copilot in WS-Reports. The solution must enable only what is required.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'un locataire Microsoft Fabric avec une capacité F64 nommée **cap-main** dans la région USA Est. Les paramètres de locataire de Copilot ne sont pas délégués aux administrateurs de capacité, et le locataire autorise les capacités Fabric Copilot. Le paramètre **Users can use Copilot and other features powered by Azure OpenAI** est activé pour un groupe de sécurité nommé **SG-Copilot** uniquement.

        Un ingénieur de données nommé User1 n'est pas membre de SG-Copilot. User1 est Contributor d'un espace de travail nommé **WS-Reports**, qui utilise le mode de licence Pro. User1 doit pouvoir utiliser Copilot dans WS-Reports. La solution ne doit activer que ce qui est nécessaire.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add User1 to the SG-Copilot security group.", fr: "Ajouter User1 au groupe de sécurité SG-Copilot." } }
        - { id: b, text: { en: "Give User1 the Admin role on the WS-Reports workspace.", fr: "Attribuer à User1 le rôle Admin sur l'espace de travail WS-Reports." } }
        - { id: c, text: { en: "Enable a Fabric Copilot capacity on cap-main and assign WS-Reports to it.", fr: "Activer une capacité Fabric Copilot sur cap-main et y affecter WS-Reports." } }
        - { id: d, text: { en: "Assign a GitHub Copilot Business license to the account of User1.", fr: "Attribuer une licence GitHub Copilot Business au compte de User1." } }
        - { id: e, text: { en: "Enable the setting that lets Azure OpenAI process data outside the capacity's region.", fr: "Activer le paramètre qui permet à Azure OpenAI de traiter les données hors de la région de la capacité." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The main Copilot tenant setting is scoped to SG-Copilot, so User1 must join the group. Pro and Premium Per User workspaces don't support Copilot directly: you enable a Fabric Copilot capacity and assign the workspace to it, and cap-main, an F64 capacity, meets the F2 or higher requirement.
        fr: |
          Le paramètre de locataire principal de Copilot est limité à SG-Copilot : User1 doit rejoindre le groupe. Les espaces de travail Pro et Premium par utilisateur ne prennent pas directement en charge Copilot : vous activez une capacité Fabric Copilot et y affectez l'espace de travail, et cap-main, une capacité F64, répond à l'exigence F2 ou supérieure.
      options:
        b: { en: "A workspace role doesn't turn on Copilot; Contributor is already enough to work in WS-Reports.", fr: "Un rôle d'espace de travail n'active pas Copilot ; Contributor suffit déjà pour travailler dans WS-Reports." }
        d: { en: "GitHub Copilot and Copilot in Fabric are separate products: a GitHub license doesn't enable Copilot in Fabric.", fr: "GitHub Copilot et Copilot dans Fabric sont deux produits distincts : une licence GitHub n'active pas Copilot dans Fabric." }
        e: { en: "cap-main is in East US, where Copilot requests are processed, so the cross-region setting isn't required.", fr: "cap-main se trouve dans la région USA Est, où les requêtes Copilot sont traitées : le paramètre de traitement hors région n'est pas nécessaire." }
    references:
      - title: Enable and configure Copilot in Microsoft Fabric - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/copilot-enable-fabric
