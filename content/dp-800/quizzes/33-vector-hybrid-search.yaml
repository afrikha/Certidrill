chapter: 33-vector-hybrid-search
questions:
  # ------------------------------------------------------------------ 1
  - id: dp800-qz-33-01
    objective: "3.2.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are writing an approximate nearest neighbor query that uses the VECTOR_SEARCH function on a table named dbo.Articles in an Azure SQL database. The query must return the closest articles first.

        Which column, generated by VECTOR_SEARCH, should you use in the ORDER BY clause?
      fr: |
        Vous écrivez une requête de recherche des plus proches voisins approximatifs qui utilise la fonction VECTOR_SEARCH sur une table nommée dbo.Articles dans une base de données Azure SQL. La requête doit renvoyer les articles les plus proches en premier.

        Quelle colonne, générée par VECTOR_SEARCH, devez-vous utiliser dans la clause ORDER BY ?
    body:
      options:
        - { id: a, text: "`[RANK]`" }
        - { id: b, text: "`[KEY]`" }
        - { id: c, text: "`distance`" }
        - { id: d, text: "`build_parameters`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          VECTOR_SEARCH adds a `distance` column to the columns of the searched table; all the other columns come from the table named in the TABLE argument. With `TOP (N) WITH APPROXIMATE`, `distance` is the only valid ordering key, in ascending order, so the closest rows come first.
        fr: |
          VECTOR_SEARCH ajoute une colonne `distance` aux colonnes de la table interrogée ; toutes les autres colonnes proviennent de la table indiquée dans l'argument TABLE. Avec `TOP (N) WITH APPROXIMATE`, `distance` est la seule clé de tri valide, dans l'ordre croissant, si bien que les lignes les plus proches arrivent en premier.
      options:
        a: { en: "`[RANK]` is the relevance column returned by CONTAINSTABLE and FREETEXTTABLE, not by VECTOR_SEARCH.", fr: "`[RANK]` est la colonne de pertinence renvoyée par CONTAINSTABLE et FREETEXTTABLE, pas par VECTOR_SEARCH." }
        b: { en: "`[KEY]` is the full-text key column returned by CONTAINSTABLE and FREETEXTTABLE; VECTOR_SEARCH returns the table's own columns instead.", fr: "`[KEY]` est la colonne de clé de texte intégral renvoyée par CONTAINSTABLE et FREETEXTTABLE ; VECTOR_SEARCH renvoie plutôt les colonnes de la table elle-même." }
        d: { en: "`build_parameters` is a column of the sys.vector_indexes catalog view that describes how an index was built; it isn't part of a search result.", fr: "`build_parameters` est une colonne de l'affichage catalogue sys.vector_indexes qui décrit la construction d'un index ; elle ne fait pas partie d'un résultat de recherche." }
    references:
      - title: VECTOR_SEARCH (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql

  # ------------------------------------------------------------------ 2
  - id: dp800-qz-33-02
    objective: "3.2.9"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are implementing reciprocal rank fusion (RRF) in a hybrid search query. The int variable @k is set to 60, and kw_rank is the position of a row in the full-text list, starting at 1.

        Which expression computes the contribution of the full-text list to the RRF score of a row?
      fr: |
        Vous implémentez la fusion de classement réciproque (RRF) dans une requête de recherche hybride. La variable int @k vaut 60, et kw_rank est la position d'une ligne dans la liste en texte intégral, à partir de 1.

        Quelle expression calcule la contribution de la liste en texte intégral au score RRF d'une ligne ?
    body:
      options:
        - { id: a, text: "`kw_rank / (@k + 1.0)`" }
        - { id: b, text: "`1.0 / (@k * kw_rank)`" }
        - { id: c, text: "`1.0 / (@k + kw_rank)`" }
        - { id: d, text: "`(@k + kw_rank) / 1.0`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          RRF adds, for each list in which a row appears, the reciprocal of the constant k plus the position of the row in that list. The decimal numerator `1.0` avoids integer division, and the best position (1) gives the largest contribution.
        fr: |
          RRF additionne, pour chaque liste dans laquelle une ligne apparaît, l'inverse de la constante k augmentée de la position de la ligne dans cette liste. Le numérateur décimal `1.0` évite la division entière, et la meilleure position (1) donne la contribution la plus forte.
      options:
        a: { en: "This value grows with the position, so the worst-ranked rows would get the highest score.", fr: "Cette valeur augmente avec la position : les lignes les moins bien classées obtiendraient le score le plus élevé." }
        b: { en: "Multiplying k by the rank isn't the RRF formula: k is added to the rank to damp the gap between the top positions.", fr: "Multiplier k par le rang n'est pas la formule RRF : k s'ajoute au rang pour atténuer l'écart entre les premières positions." }
        d: { en: "This is k plus the rank itself, not its reciprocal: a lower-ranked row would score higher.", fr: "Il s'agit de k plus le rang lui-même, pas de son inverse : une ligne moins bien classée obtiendrait un score plus élevé." }
    references:
      - title: Implement hybrid search and ranking
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking

  # ------------------------------------------------------------------ 3
  - id: dp800-qz-33-03
    objective: "3.2.10"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso is evaluating the search of its support portal, which runs on an Azure SQL database. For one test query, 25 articles of the database are known to be relevant. The search returns 10 articles, and 6 of them are relevant.

        What are the precision at 10 and the recall at 10 of the search for this query?
      fr: |
        Contoso évalue la recherche de son portail de support, qui s'exécute sur une base de données Azure SQL. Pour une requête de test, 25 articles de la base de données sont connus comme pertinents. La recherche renvoie 10 articles, dont 6 sont pertinents.

        Quels sont la précision à 10 et le rappel à 10 de la recherche pour cette requête ?
    body:
      options:
        - { id: a, text: { en: "Precision 0.24, recall 0.6", fr: "Précision 0,24, rappel 0,6" } }
        - { id: b, text: { en: "Precision 0.6, recall 0.24", fr: "Précision 0,6, rappel 0,24" } }
        - { id: c, text: { en: "Precision 0.6, recall 0.4", fr: "Précision 0,6, rappel 0,4" } }
        - { id: d, text: { en: "Precision 0.4, recall 0.24", fr: "Précision 0,4, rappel 0,24" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Precision is the share of the returned rows that are relevant: 6 / 10 = 0.6. Recall is the share of all the relevant rows that the search returned: 6 / 25 = 0.24. Both are computed on a test set whose relevant rows are known.
        fr: |
          La précision est la part des lignes renvoyées qui sont pertinentes : 6 / 10 = 0,6. Le rappel est la part de toutes les lignes pertinentes que la recherche a renvoyées : 6 / 25 = 0,24. Les deux se calculent sur un jeu de test dont les lignes pertinentes sont connues.
      options:
        a: { en: "The two values are swapped: 6 / 25 is the recall, and 6 / 10 is the precision.", fr: "Les deux valeurs sont inversées : 6 / 25 est le rappel, et 6 / 10 est la précision." }
        c: { en: "0.4 is the share of returned rows that aren't relevant (4 / 10); recall divides the relevant rows found by all 25 relevant rows.", fr: "0,4 est la part des lignes renvoyées qui ne sont pas pertinentes (4 / 10) ; le rappel divise les lignes pertinentes trouvées par les 25 lignes pertinentes." }
        d: { en: "0.4 is the share of irrelevant rows among the 10 returned, not the precision, which counts the relevant ones.", fr: "0,4 est la part des lignes non pertinentes parmi les 10 renvoyées, pas la précision, qui compte les lignes pertinentes." }
    references:
      - title: Implement hybrid search and ranking
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking

  # ------------------------------------------------------------------ 4
  - id: dp800-qz-33-04
    objective: "3.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an Azure SQL database that contains a table named dbo.Documents with 20 million rows. The Embedding column of type VECTOR(1536) stores embeddings from a model whose documentation recommends cosine similarity. The model doesn't return normalized vectors.

        You must create a vector index on Embedding during business hours. The index build must use at most two processors, and the degree of parallelism of the other queries of the database must not change.

        How should you complete the CREATE VECTOR INDEX statement?
      fr: |
        Vous disposez d'une base de données Azure SQL qui contient une table nommée dbo.Documents de 20 millions de lignes. La colonne Embedding de type VECTOR(1536) stocke les incorporations d'un modèle dont la documentation recommande la similarité cosinus. Le modèle ne renvoie pas de vecteurs normalisés.

        Vous devez créer un index vectoriel sur Embedding pendant les heures ouvrées. La construction de l'index doit utiliser au plus deux processeurs, et le degré de parallélisme des autres requêtes de la base de données ne doit pas changer.

        Comment devez-vous compléter l'instruction CREATE VECTOR INDEX ?
    body:
      options:
        - { id: a, text: "`WITH (METRIC = 'cosine', TYPE = 'DiskANN', MAXDOP = 0)`" }
        - { id: b, text: "`WITH (METRIC = 'cosine', TYPE = 'DiskANN', MAXDOP = 2)`" }
        - { id: c, text: "`WITH (METRIC = 'dot', TYPE = 'DiskANN', MAXDOP = 2)`" }
        - { id: d, text: { en: "`WITH (METRIC = 'cosine', TYPE = 'DiskANN')`, after you set the MAXDOP database scoped configuration to 2", fr: "`WITH (METRIC = 'cosine', TYPE = 'DiskANN')`, après avoir défini la configuration délimitée à la base de données MAXDOP sur 2" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The MAXDOP option of CREATE VECTOR INDEX overrides the max degree of parallelism for this index operation only: `MAXDOP = 2` limits the build to two processors or fewer. The cosine metric follows the model's recommendation, and DiskANN is the only supported index type.
        fr: |
          L'option MAXDOP de CREATE VECTOR INDEX remplace le degré maximal de parallélisme pour cette seule opération d'index : `MAXDOP = 2` limite la construction à deux processeurs ou moins. La métrique cosinus suit la recommandation du modèle, et DiskANN est le seul type d'index pris en charge.
      options:
        a: { en: "`MAXDOP = 0` is the default: the build uses the degree of parallelism set at the server, database or workload group level, not a limit of two.", fr: "`MAXDOP = 0` est la valeur par défaut : la construction utilise le degré de parallélisme défini au niveau du serveur, de la base de données ou du groupe de charge de travail, pas une limite de deux." }
        c: { en: "The vectors aren't normalized, so the dot product doesn't rank the neighbors like cosine distance, which the model recommends.", fr: "Les vecteurs ne sont pas normalisés : le produit scalaire ne classe donc pas les voisins comme la distance cosinus, que le modèle recommande." }
        d: { en: "The database scoped MAXDOP setting also applies to every other query of the database, which the requirements forbid.", fr: "Le paramètre MAXDOP délimité à la base de données s'applique aussi à toutes les autres requêtes de la base de données, ce que les exigences interdisent." }
    references:
      - title: CREATE VECTOR INDEX (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql

  # ------------------------------------------------------------------ 5
  - id: dp800-qz-33-05
    objective: "3.2.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure SQL database that contains a table named dbo.Manuals. A full-text index covers the Body column, and a vector index covers the BodyVector column. You are writing the keyword list of a hybrid search.

        Technicians type error messages such as fan speed sensor failure. The keyword list must contain only the manuals that contain the whole message as an exact phrase, with a relevance value for each manual, so that the list can be fused with the vector list.

        What should you use in the keyword query?
      fr: |
        Fabrikam dispose d'une base de données Azure SQL qui contient une table nommée dbo.Manuals. Un index de recherche en texte intégral couvre la colonne Body, et un index vectoriel couvre la colonne BodyVector. Vous écrivez la liste par mots clés d'une recherche hybride.

        Les techniciens saisissent des messages d'erreur comme fan speed sensor failure. La liste par mots clés ne doit contenir que les manuels qui contiennent le message entier sous forme d'expression exacte, avec une valeur de pertinence pour chaque manuel, afin que la liste puisse être fusionnée avec la liste vectorielle.

        Que devez-vous utiliser dans la requête par mots clés ?
    body:
      options:
        - { id: a, text: { en: "`FREETEXTTABLE(dbo.Manuals, Body, @text)`, with @text set to the message as typed", fr: "`FREETEXTTABLE(dbo.Manuals, Body, @text)`, avec @text défini sur le message tel que saisi" } }
        - { id: b, text: { en: "A `CONTAINS(Body, @condition)` predicate, with @condition set to the message in double quotation marks", fr: "Un prédicat `CONTAINS(Body, @condition)`, avec @condition défini sur le message entre guillemets doubles" } }
        - { id: c, text: { en: "A `FREETEXT(Body, @text)` predicate, with @text set to the message as typed", fr: "Un prédicat `FREETEXT(Body, @text)`, avec @text défini sur le message tel que saisi" } }
        - { id: d, text: { en: "`CONTAINSTABLE(dbo.Manuals, Body, @condition)`, with @condition set to the message in double quotation marks", fr: "`CONTAINSTABLE(dbo.Manuals, Body, @condition)`, avec @condition défini sur le message entre guillemets doubles" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          CONTAINSTABLE accepts the search conditions of CONTAINS, including a phrase in double quotation marks, and returns a `[KEY]` and a `RANK` for each matching row. The rank gives the positions of the keyword list, and the key joins the list to the vector list.
        fr: |
          CONTAINSTABLE accepte les conditions de recherche de CONTAINS, dont une expression entre guillemets doubles, et renvoie une colonne `[KEY]` et une colonne `RANK` pour chaque ligne correspondante. Le rang fournit les positions de la liste par mots clés, et la clé relie cette liste à la liste vectorielle.
      options:
        a: { en: "FREETEXTTABLE returns a rank but matches the meaning of the words of the text, not the exact phrase, so manuals without the whole message would be returned.", fr: "FREETEXTTABLE renvoie un rang mais recherche le sens des mots du texte, pas l'expression exacte : des manuels sans le message entier seraient renvoyés." }
        b: { en: "CONTAINS matches the exact phrase but only filters rows: it returns no relevance value to rank the keyword list.", fr: "CONTAINS trouve l'expression exacte mais filtre seulement les lignes : il ne renvoie aucune valeur de pertinence pour classer la liste par mots clés." }
        c: { en: "FREETEXT neither matches the exact phrase nor returns a relevance value.", fr: "FREETEXT ne trouve pas l'expression exacte et ne renvoie pas de valeur de pertinence." }
    references:
      - title: CONTAINSTABLE (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-functions/containstable-transact-sql
      - title: Implement hybrid search and ranking
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking

  # ------------------------------------------------------------------ 6
  - id: dp800-qz-33-06
    objective: "3.2.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys has an Azure SQL database. A table named dbo.Products has 4 million rows and a latest-version vector index that uses the cosine metric on the DescriptionVector column. The variable @qv holds the embedding of a shopper's request, generated by the same model as the stored vectors. To return the ten camping products closest to that request, a developer writes the following query, and then reviews possible changes to it.

        ```sql
        SELECT TOP (10) WITH APPROXIMATE p.ProductID, p.Name, r.distance
        FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                           SIMILAR_TO = @qv, METRIC = 'cosine') AS r
        WHERE p.Category = 'Camping'
        ORDER BY r.distance;
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'une base de données Azure SQL. Une table nommée dbo.Products contient 4 millions de lignes et un index vectoriel de dernière version qui utilise la métrique cosinus sur la colonne DescriptionVector. La variable @qv contient l'incorporation de la demande d'un client, générée par le même modèle que les vecteurs stockés. Pour renvoyer les dix produits de camping les plus proches de cette demande, un développeur écrit la requête suivante, puis examine des modifications possibles.

        ```sql
        SELECT TOP (10) WITH APPROXIMATE p.ProductID, p.Name, r.distance
        FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                           SIMILAR_TO = @qv, METRIC = 'cosine') AS r
        WHERE p.Category = 'Camping'
        ORDER BY r.distance;
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "If a column named distance is later added to dbo.Products, this query keeps running without any change."
            fr: "Si une colonne nommée distance est ajoutée plus tard à dbo.Products, cette requête continue de s'exécuter sans aucune modification."
        - id: s2
          text:
            en: "If the developer removes the ORDER BY clause, the query returns the same 10 products in an arbitrary order."
            fr: "Si le développeur supprime la clause ORDER BY, la requête renvoie les mêmes 10 produits dans un ordre arbitraire."
        - id: s3
          text:
            en: "The developer can add a CROSS APPLY to another table in the FROM clause of this query and keep SELECT TOP (10) WITH APPROXIMATE."
            fr: "Le développeur peut ajouter un CROSS APPLY vers une autre table dans la clause FROM de cette requête et conserver SELECT TOP (10) WITH APPROXIMATE."
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Yes: when the table has its own distance column, the references must be qualified with aliases, and this query already uses `p.` for the table columns and `r.distance` for the generated column. No: `TOP (N) WITH APPROXIMATE` requires an ORDER BY on distance, otherwise the query fails with Msg 42248. No: CROSS APPLY and OUTER APPLY can't appear in the same FROM clause as `TOP (N) WITH APPROXIMATE`; the search has to be moved into a subquery.
        fr: |
          Oui : quand la table possède sa propre colonne distance, les références doivent être qualifiées par des alias, et cette requête utilise déjà `p.` pour les colonnes de la table et `r.distance` pour la colonne générée. Non : `TOP (N) WITH APPROXIMATE` exige un ORDER BY sur distance, sinon la requête échoue avec le message 42248. Non : CROSS APPLY et OUTER APPLY ne peuvent pas figurer dans la même clause FROM que `TOP (N) WITH APPROXIMATE` ; la recherche doit être déplacée dans une sous-requête.
      options:
        s2: { en: "APPROXIMATE can't be used in a query without ORDER BY: the query fails instead of returning unordered rows.", fr: "APPROXIMATE ne peut pas être utilisé dans une requête sans ORDER BY : la requête échoue au lieu de renvoyer des lignes non triées." }
        s3: { en: "The restriction applies even when VECTOR_SEARCH has no outer reference to the applied table.", fr: "La restriction s'applique même quand VECTOR_SEARCH ne contient aucune référence externe à la table appliquée." }
    references:
      - title: VECTOR_SEARCH (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql

  # ------------------------------------------------------------------ 7
  - id: dp800-qz-33-07
    objective: "3.2.9"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has an Azure SQL database that stores help articles. A hybrid search fuses a full-text list and a vector list by using reciprocal rank fusion (RRF). Both lists have the same weight, a row that is missing from a list contributes 0 for that list, and the results are sorted by rrf_score in descending order.

        For a test query, three articles have the following positions. A dash means that the article isn't in the list.

        | Article | Full-text position | Vector position |
        | --- | --- | --- |
        | H1 | 1 | - |
        | H2 | 6 | 6 |
        | H3 | 2 | 20 |

        You compare the order of the results for two values of the constant k.

        How should you complete the sentences? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'une base de données Azure SQL qui stocke des articles d'aide. Une recherche hybride fusionne une liste en texte intégral et une liste vectorielle par fusion de classement réciproque (RRF). Les deux listes ont le même poids, une ligne absente d'une liste contribue 0 pour cette liste, et les résultats sont triés par rrf_score dans l'ordre décroissant.

        Pour une requête de test, trois articles ont les positions suivantes. Un tiret signifie que l'article n'est pas dans la liste.

        | Article | Position texte intégral | Position vectorielle |
        | --- | --- | --- |
        | H1 | 1 | - |
        | H2 | 6 | 6 |
        | H3 | 2 | 20 |

        Vous comparez l'ordre des résultats pour deux valeurs de la constante k.

        Comment devez-vous compléter les phrases ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          With k = 60, the article returned first is [[first60]].
          With k = 60, the article returned last is [[last60]].
          With k = 1, the article returned first is [[first1]].
        fr: |
          Avec k = 60, l'article renvoyé en premier est [[first60]].
          Avec k = 60, l'article renvoyé en dernier est [[last60]].
          Avec k = 1, l'article renvoyé en premier est [[first1]].
      slots:
        - id: first60
          options:
            - { id: h1, text: H1 }
            - { id: h2, text: H2 }
            - { id: h3, text: H3 }
        - id: last60
          options:
            - { id: h1, text: H1 }
            - { id: h2, text: H2 }
            - { id: h3, text: H3 }
        - id: first1
          options:
            - { id: h1, text: H1 }
            - { id: h2, text: H2 }
            - { id: h3, text: H3 }
    answer:
      values: { first60: h2, last60: h1, first1: h1 }
    explanation:
      correct:
        en: |
          With k = 60: H1 = 1/61 ≈ 0.0164, H2 = 1/66 + 1/66 ≈ 0.0303, H3 = 1/62 + 1/80 ≈ 0.0286, so the order is H2, H3, H1. With k = 1: H1 = 1/2 = 0.5, H2 = 2/7 ≈ 0.286, H3 = 1/3 + 1/21 ≈ 0.381, so H1 comes first. A large k flattens the differences between positions and rewards appearing in both lists; a small k amplifies the advantage of the top positions.
        fr: |
          Avec k = 60 : H1 = 1/61 ≈ 0,0164, H2 = 1/66 + 1/66 ≈ 0,0303, H3 = 1/62 + 1/80 ≈ 0,0286 ; l'ordre est donc H2, H3, H1. Avec k = 1 : H1 = 1/2 = 0,5, H2 = 2/7 ≈ 0,286, H3 = 1/3 + 1/21 ≈ 0,381 ; H1 arrive donc en premier. Un k élevé lisse les écarts entre positions et récompense la présence dans les deux listes ; un k faible amplifie l'avantage des premières positions.
      options:
        first60: { en: "H3 (≈ 0.0286) is slightly behind H2 (≈ 0.0303): its 20th vector position costs more than its 2nd full-text position gains. H1 has a single term.", fr: "H3 (≈ 0,0286) est légèrement derrière H2 (≈ 0,0303) : sa 20e position vectorielle lui coûte plus que ne lui rapporte sa 2e position en texte intégral. H1 n'a qu'un seul terme." }
        first1: { en: "With k = 1, the first position alone is worth 0.5, more than the two terms of H2 (≈ 0.286) or H3 (≈ 0.381).", fr: "Avec k = 1, la première position vaut à elle seule 0,5, plus que les deux termes de H2 (≈ 0,286) ou de H3 (≈ 0,381)." }
    references:
      - title: Implement hybrid search and ranking
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking

  # ------------------------------------------------------------------ 8
  - id: dp800-qz-33-08
    objective: "3.2.8"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware hosts a multitenant product catalog in an Azure SQL database. A table named dbo.Products has 6 million rows and the columns ProductID (int, primary key), TenantID (int), Description (nvarchar(max)) and DescriptionVector (VECTOR(1536)). The full-text index on Description uses the primary key as its key index, and a latest-version vector index that uses the cosine metric exists on DescriptionVector.

        You are writing a hybrid search that the final query fuses with reciprocal rank fusion (RRF). Each candidate list must contain only the products of the tenant @tenant, and each list must return as many relevant products of that tenant as possible. The vector list must use the vector index.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware héberge un catalogue de produits multilocataire dans une base de données Azure SQL. Une table nommée dbo.Products contient 6 millions de lignes et les colonnes ProductID (int, clé primaire), TenantID (int), Description (nvarchar(max)) et DescriptionVector (VECTOR(1536)). L'index de recherche en texte intégral sur Description utilise la clé primaire comme index de clé, et un index vectoriel de dernière version qui utilise la métrique cosinus existe sur DescriptionVector.

        Vous écrivez une recherche hybride que la requête finale fusionne par fusion de classement réciproque (RRF). Chaque liste de candidats ne doit contenir que les produits du locataire @tenant, et chaque liste doit renvoyer le plus possible de produits pertinents de ce locataire. La liste vectorielle doit utiliser l'index vectoriel.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        WITH keyword AS (
            SELECT TOP (50) p.ProductID,
                   RANK() OVER (ORDER BY ft.[RANK] DESC) AS kw_rank
            FROM FREETEXTTABLE(dbo.Products, Description, @text) AS ft
            INNER JOIN dbo.Products AS p ON [[keyjoin]]
            [[kwfilter]]
            ORDER BY ft.[RANK] DESC
        ),
        semantic AS (
            SELECT v.ProductID,
                   RANK() OVER (ORDER BY v.distance) AS vec_rank
            FROM (
                SELECT TOP (50) WITH APPROXIMATE p.ProductID, r.distance
                FROM VECTOR_SEARCH(TABLE = dbo.Products AS p, COLUMN = DescriptionVector,
                                   SIMILAR_TO = @qv, METRIC = 'cosine') AS r
                [[vecfilter]]
                ORDER BY r.distance
            ) AS v
        )
        SELECT TOP (10) COALESCE(k.ProductID, s.ProductID) AS ProductID,
               COALESCE(1.0 / (60 + k.kw_rank), 0.0)
             + COALESCE(1.0 / (60 + s.vec_rank), 0.0) AS rrf_score
        FROM keyword AS k
        FULL OUTER JOIN semantic AS s ON s.ProductID = k.ProductID
        ORDER BY rrf_score DESC;
      slots:
        - id: keyjoin
          options:
            - { id: key, text: "ft.[KEY] = p.ProductID" }
            - { id: rank, text: "ft.[RANK] = p.ProductID" }
            - { id: tenant, text: "ft.[KEY] = p.TenantID" }
        - id: kwfilter
          options:
            - { id: ft, text: "WHERE ft.TenantID = @tenant" }
            - { id: p, text: "WHERE p.TenantID = @tenant" }
            - { id: key, text: "WHERE ft.[KEY] = @tenant" }
        - id: vecfilter
          options:
            - { id: r, text: "WHERE r.TenantID = @tenant" }
            - { id: v, text: "WHERE v.TenantID = @tenant" }
            - { id: p, text: "WHERE p.TenantID = @tenant" }
    answer:
      values: { keyjoin: key, kwfilter: p, vecfilter: p }
    explanation:
      correct:
        en: |
          FREETEXTTABLE returns only the full-text key (`[KEY]`, here the ProductID values) and `RANK`, so the list is joined to dbo.Products on `ft.[KEY] = p.ProductID` and the tenant is filtered through `p.TenantID` before `TOP (50)` keeps the best candidates. In VECTOR_SEARCH, the columns of the searched table are referenced through the alias given in the TABLE argument, and with a latest-version index the WHERE predicate is applied during the search, so the vector list still returns 50 products of the tenant.
        fr: |
          FREETEXTTABLE ne renvoie que la clé de texte intégral (`[KEY]`, ici les valeurs de ProductID) et `RANK` : la liste est donc jointe à dbo.Products sur `ft.[KEY] = p.ProductID` et le locataire est filtré par `p.TenantID` avant que `TOP (50)` ne garde les meilleurs candidats. Dans VECTOR_SEARCH, les colonnes de la table interrogée se référencent par l'alias donné dans l'argument TABLE, et avec un index de dernière version le prédicat WHERE est appliqué pendant la recherche : la liste vectorielle renvoie donc toujours 50 produits du locataire.
      options:
        keyjoin: { en: "`[RANK]` is a relevance value, not a key, and `[KEY]` holds product IDs, not tenant IDs.", fr: "`[RANK]` est une valeur de pertinence, pas une clé, et `[KEY]` contient des ID de produits, pas des ID de locataires." }
        kwfilter: { en: "FREETEXTTABLE has no TenantID column, and comparing the product key with a tenant ID returns at most one unrelated product.", fr: "FREETEXTTABLE n'a pas de colonne TenantID, et comparer la clé de produit à un ID de locataire renvoie au plus un produit sans rapport." }
        vecfilter: { en: "The alias of VECTOR_SEARCH can't reference the columns of the searched table, and v is the alias of the outer derived table, not visible inside it.", fr: "L'alias de VECTOR_SEARCH ne peut pas référencer les colonnes de la table interrogée, et v est l'alias de la table dérivée externe, invisible à l'intérieur de celle-ci." }
    references:
      - title: Implement hybrid search and ranking
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
      - title: VECTOR_SEARCH (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql

  # ------------------------------------------------------------------ 9
  - id: dp800-qz-33-09
    objective: "3.2.10"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has an Azure SQL database that contains a table named dbo.Articles with 3 million rows. A full-text index covers the Body column, and a latest-version vector index that uses the cosine metric covers the BodyVector column. The hybrid search of the support portal takes about 4 seconds. Its keyword list returns the TOP (1000) rows of FREETEXTTABLE, and its vector list is the following CTE.

        ```sql
        semantic AS (
            SELECT TOP (1000) ArticleID,
                   RANK() OVER (ORDER BY VECTOR_DISTANCE('cosine', @qv, BodyVector)) AS vec_rank
            FROM dbo.Articles
            ORDER BY VECTOR_DISTANCE('cosine', @qv, BodyVector)
        )
        ```

        The two lists are joined with a FULL OUTER JOIN and fused with RRF, and the portal displays the top 10 articles. On the relevance test set, precision, recall and MRR at 10 are identical with 50 candidates per list and with 1,000. A recall test of the vector index against an exact search returns 0.99.

        You need to reduce the duration of the query without reducing the relevance measured on the test set.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'une base de données Azure SQL qui contient une table nommée dbo.Articles de 3 millions de lignes. Un index de recherche en texte intégral couvre la colonne Body, et un index vectoriel de dernière version qui utilise la métrique cosinus couvre la colonne BodyVector. La recherche hybride du portail de support prend environ 4 secondes. Sa liste par mots clés renvoie les TOP (1000) lignes de FREETEXTTABLE, et sa liste vectorielle est la CTE suivante.

        ```sql
        semantic AS (
            SELECT TOP (1000) ArticleID,
                   RANK() OVER (ORDER BY VECTOR_DISTANCE('cosine', @qv, BodyVector)) AS vec_rank
            FROM dbo.Articles
            ORDER BY VECTOR_DISTANCE('cosine', @qv, BodyVector)
        )
        ```

        Les deux listes sont jointes par un FULL OUTER JOIN et fusionnées par RRF, et le portail affiche les 10 meilleurs articles. Sur le jeu de test de pertinence, la précision, le rappel et le MRR à 10 sont identiques avec 50 candidats par liste et avec 1 000. Un test de rappel de l'index vectoriel par rapport à une recherche exacte renvoie 0,99.

        Vous devez réduire la durée de la requête sans réduire la pertinence mesurée sur le jeu de test.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Reduce the keyword list and the vector list to TOP (50) candidates each.", fr: "Réduire la liste par mots clés et la liste vectorielle à TOP (50) candidats chacune." } }
        - { id: b, text: { en: "Increase the RRF constant k from 60 to 1,000 so that fewer candidates are scored.", fr: "Augmenter la constante RRF k de 60 à 1 000 afin que moins de candidats soient notés." } }
        - { id: c, text: { en: "Rewrite the vector list as VECTOR_SEARCH with TOP (N) WITH APPROXIMATE in a subquery, and rank it outside.", fr: "Réécrire la liste vectorielle avec VECTOR_SEARCH et TOP (N) WITH APPROXIMATE dans une sous-requête, et la classer à l'extérieur." } }
        - { id: d, text: { en: "Replace the FULL OUTER JOIN with an INNER JOIN so that fewer rows reach the RRF calculation.", fr: "Remplacer le FULL OUTER JOIN par un INNER JOIN afin que moins de lignes atteignent le calcul RRF." } }
        - { id: e, text: { en: "Drop and recreate the vector index with MAXDOP = 1 so that the searches run without parallelism.", fr: "Supprimer et recréer l'index vectoriel avec MAXDOP = 1 afin que les recherches s'exécutent sans parallélisme." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The vector list computes VECTOR_DISTANCE for all 3 million rows: it never uses the vector index. VECTOR_SEARCH with `TOP (N) WITH APPROXIMATE` uses the index, and a recall of 0.99 shows that the approximation doesn't change the results; RANK() goes in an outer query because window functions can't share the query block of `TOP (N) WITH APPROXIMATE`. Larger candidate lists only add work, and the test set shows that 50 per list gives the same relevance.
        fr: |
          La liste vectorielle calcule VECTOR_DISTANCE pour les 3 millions de lignes : elle n'utilise jamais l'index vectoriel. VECTOR_SEARCH avec `TOP (N) WITH APPROXIMATE` utilise l'index, et un rappel de 0,99 montre que l'approximation ne change pas les résultats ; RANK() se place dans une requête externe, car les fonctions de fenêtre ne peuvent pas partager le bloc de requête de `TOP (N) WITH APPROXIMATE`. Des listes de candidats plus longues ne font qu'ajouter du travail, et le jeu de test montre que 50 par liste donnent la même pertinence.
      options:
        b: { en: "k only changes the weight of each position in the score; every candidate is still retrieved and scored.", fr: "k ne change que le poids de chaque position dans le score ; chaque candidat est toujours récupéré et noté." }
        d: { en: "An INNER JOIN drops the articles found by only one search, which lowers recall on the test set.", fr: "Un INNER JOIN élimine les articles trouvés par une seule des deux recherches, ce qui réduit le rappel sur le jeu de test." }
        e: { en: "MAXDOP of CREATE VECTOR INDEX only controls the parallelism of the index build, and the current query doesn't use the index at all.", fr: "L'option MAXDOP de CREATE VECTOR INDEX ne contrôle que le parallélisme de la construction de l'index, et la requête actuelle n'utilise pas du tout l'index." }
    references:
      - title: Implement hybrid search and ranking
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
      - title: VECTOR_SEARCH (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql

  # ------------------------------------------------------------------ 10
  - id: dp800-qz-33-10
    objective: "3.2.10"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has an Azure SQL database that contains a table named dbo.KbArticles with 3 million rows. A latest-version vector index that uses the cosine metric covers the BodyVector column. The support portal runs a vector search only: SELECT TOP (10) WITH APPROXIMATE over VECTOR_SEARCH. You ran two evaluations:

        - For 500 sample query vectors, the IDs returned by the portal query match 98 percent of the IDs returned by an exact query with the same metric and the same number of rows.
        - On a test set of 200 user questions with known relevant articles, the recall at 10 of the portal query is 0.46. Most of the missed articles contain the exact product codes that the users typed, such as ERR-4071.

        You need to increase the recall at 10 on the test set. The query latency must stay low.

        What should you do?
      fr: |
        Adatum dispose d'une base de données Azure SQL qui contient une table nommée dbo.KbArticles de 3 millions de lignes. Un index vectoriel de dernière version qui utilise la métrique cosinus couvre la colonne BodyVector. Le portail de support exécute une recherche uniquement vectorielle : SELECT TOP (10) WITH APPROXIMATE sur VECTOR_SEARCH. Vous avez effectué deux évaluations :

        - Pour 500 vecteurs de requête d'échantillon, les ID renvoyés par la requête du portail correspondent à 98 % des ID renvoyés par une requête exacte avec la même métrique et le même nombre de lignes.
        - Sur un jeu de test de 200 questions d'utilisateurs dont les articles pertinents sont connus, le rappel à 10 de la requête du portail est de 0,46. La plupart des articles manqués contiennent les codes de produit exacts que les utilisateurs ont saisis, comme ERR-4071.

        Vous devez augmenter le rappel à 10 sur le jeu de test. La latence de la requête doit rester faible.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace VECTOR_SEARCH with an exact query ordered by VECTOR_DISTANCE so that no approximation remains.", fr: "Remplacer VECTOR_SEARCH par une requête exacte triée par VECTOR_DISTANCE afin qu'il ne reste aucune approximation." } }
        - { id: b, text: { en: "Recreate the vector index and the query with METRIC = 'euclidean' to separate the vectors of similar codes.", fr: "Recréer l'index vectoriel et la requête avec METRIC = 'euclidean' pour séparer les vecteurs de codes similaires." } }
        - { id: c, text: { en: "Add a full-text search list, and fuse it with the vector list by using reciprocal rank fusion (RRF).", fr: "Ajouter une liste de recherche en texte intégral, et la fusionner avec la liste vectorielle par fusion de classement réciproque (RRF)." } }
        - { id: d, text: { en: "Request TOP (100) WITH APPROXIMATE in a subquery, and keep the 10 rows that have the smallest distance.", fr: "Demander TOP (100) WITH APPROXIMATE dans une sous-requête, et garder les 10 lignes qui ont la plus petite distance." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The first evaluation measures the recall of the ANN index against an exact search (0.98, close to no approximation); the second measures relevance. The missed articles share exact terms with the questions, which full-text search finds and vector search can miss, so a hybrid search fused with RRF addresses the low relevance recall while the vector list keeps using the index.
        fr: |
          La première évaluation mesure le rappel de l'index ANN par rapport à une recherche exacte (0,98, presque sans approximation) ; la seconde mesure la pertinence. Les articles manqués partagent des termes exacts avec les questions, que la recherche en texte intégral trouve et que la recherche vectorielle peut manquer : une recherche hybride fusionnée par RRF corrige donc le faible rappel de pertinence, tandis que la liste vectorielle continue d'utiliser l'index.
      options:
        a: { en: "The index already returns 98 percent of the exact neighbors, so an exact search would return almost the same rows, and scanning 3 million vectors raises latency.", fr: "L'index renvoie déjà 98 % des voisins exacts : une recherche exacte renverrait presque les mêmes lignes, et l'analyse de 3 millions de vecteurs augmente la latence." }
        b: { en: "Changing the metric doesn't make the embeddings capture exact codes, and it departs from the cosine metric used with the model.", fr: "Changer de métrique ne fait pas capturer les codes exacts par les incorporations, et cela s'écarte de la métrique cosinus utilisée avec le modèle." }
        d: { en: "The 10 nearest rows among 100 candidates are essentially the rows that TOP (10) already returns: the index is already close to exact, and the codes are missed by the vector search itself.", fr: "Les 10 lignes les plus proches parmi 100 candidats sont pratiquement celles que TOP (10) renvoie déjà : l'index est déjà proche d'une recherche exacte, et c'est la recherche vectorielle elle-même qui manque les codes." }
    references:
      - title: Implement hybrid search and ranking
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/06-implement-hybrid-search-ranking
      - title: Vector search and vector indexes in the SQL Database Engine
        url: https://learn.microsoft.com/en-us/sql/sql-server/ai/vectors
