chapter: 12-programmability
questions:
  # ------------------------------------------------------------------ 1
  - id: dp800-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Proseware sells a packaged application that installs views in the Azure SQL databases of its customers. The text of the view definitions must not be readable in the catalog views of the customers' databases.

        Which option should you add to each CREATE VIEW statement?
      fr: |
        Proseware vend une application packagée qui installe des vues dans les bases de données Azure SQL de ses clients. Le texte des définitions de vues ne doit pas être lisible dans les affichages catalogue des bases de données des clients.

        Quelle option devez-vous ajouter à chaque instruction CREATE VIEW ?
    body:
      options:
        - { id: a, text: "WITH SCHEMABINDING" }
        - { id: b, text: "WITH VIEW_METADATA" }
        - { id: c, text: "WITH CHECK OPTION" }
        - { id: d, text: "WITH ENCRYPTION" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          WITH ENCRYPTION encrypts the stored text of the CREATE VIEW statement, so the catalog no longer returns the definition of the view. The view keeps working normally, but it can't be published as part of SQL Server replication.
        fr: |
          WITH ENCRYPTION chiffre le texte stocké de l'instruction CREATE VIEW : le catalogue ne retourne plus la définition de la vue. La vue continue de fonctionner normalement, mais elle ne peut pas être publiée dans le cadre de la réplication SQL Server.
      options:
        a: { en: "SCHEMABINDING prevents changes to the base tables that would affect the view; the definition stays readable.", fr: "SCHEMABINDING empêche les modifications des tables de base qui affecteraient la vue ; la définition reste lisible." }
        b: { en: "VIEW_METADATA makes client APIs receive the view's metadata instead of the base tables'; it doesn't hide the definition.", fr: "VIEW_METADATA fait recevoir aux API clientes les métadonnées de la vue au lieu de celles des tables de base ; il ne masque pas la définition." }
        c: { en: "CHECK OPTION makes modifications through the view keep the rows visible in the view; it doesn't hide the definition.", fr: "CHECK OPTION oblige les modifications faites par la vue à laisser les lignes visibles dans la vue ; il ne masque pas la définition." }
    references:
      - title: CREATE VIEW (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-view-transact-sql

  # ------------------------------------------------------------------ 2
  - id: dp800-qz-12-02
    objective: "1.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure SQL database. The Sales schema and all its objects are owned by dbo. A stored procedure named **Sales.usp_PlaceOrder** inserts rows into the Sales.Orders and Sales.OrderLine tables by using static Transact-SQL statements.

        Members of a database role named **OrderApp** must be able to run the procedure. They must not be able to read or modify the tables directly. Which permission should you grant to OrderApp?
      fr: |
        Contoso dispose d'une base de données Azure SQL. Le schéma Sales et tous ses objets appartiennent à dbo. Une procédure stockée nommée **Sales.usp_PlaceOrder** insère des lignes dans les tables Sales.Orders et Sales.OrderLine au moyen d'instructions Transact-SQL statiques.

        Les membres d'un rôle de base de données nommé **OrderApp** doivent pouvoir exécuter la procédure. Ils ne doivent pas pouvoir lire ni modifier les tables directement. Quelle autorisation devez-vous accorder à OrderApp ?
    body:
      options:
        - { id: a, text: { en: "EXECUTE on Sales.usp_PlaceOrder", fr: "EXECUTE sur Sales.usp_PlaceOrder" } }
        - { id: b, text: { en: "INSERT on Sales.Orders and Sales.OrderLine", fr: "INSERT sur Sales.Orders et Sales.OrderLine" } }
        - { id: c, text: { en: "ALTER on Sales.usp_PlaceOrder", fr: "ALTER sur Sales.usp_PlaceOrder" } }
        - { id: d, text: { en: "Membership of the db_datawriter role", fr: "L'appartenance au rôle db_datawriter" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The procedure and the tables have the same owner, so ownership chaining applies: when OrderApp members run the procedure, the permissions on the tables aren't checked. EXECUTE on the procedure is therefore enough, and the tables stay inaccessible to direct queries.
        fr: |
          La procédure et les tables ont le même propriétaire : le chaînage des propriétés s'applique, et les autorisations sur les tables ne sont pas vérifiées quand les membres d'OrderApp exécutent la procédure. EXECUTE sur la procédure suffit donc, et les tables restent inaccessibles aux requêtes directes.
      options:
        b: { en: "INSERT on the tables lets OrderApp modify them directly, outside the procedure, which the requirement forbids.", fr: "INSERT sur les tables permet à OrderApp de les modifier directement, hors de la procédure, ce que l'exigence interdit." }
        c: { en: "ALTER lets OrderApp change the definition of the procedure; it doesn't allow running it.", fr: "ALTER permet à OrderApp de modifier la définition de la procédure ; il ne permet pas de l'exécuter." }
        d: { en: "db_datawriter grants INSERT, UPDATE and DELETE on every user table of the database, far beyond the need.", fr: "db_datawriter accorde INSERT, UPDATE et DELETE sur toutes les tables utilisateur de la base de données, bien au-delà du besoin." }
    references:
      - title: Managing Permissions with Stored Procedures in SQL Server
        url: https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/sql/managing-permissions-with-stored-procedures-in-sql-server

  # ------------------------------------------------------------------ 3
  - id: dp800-qz-12-03
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer at Fabrikam creates the scalar function **Sales.ufn_NetPrice** in an Azure SQL database. The following query then fails with an error stating that ufn_NetPrice isn't a recognized built-in function name.

        ```sql
        SELECT OrderLineID, ufn_NetPrice(UnitPrice, 0.1) AS NetPrice
        FROM Sales.OrderLine;
        ```

        What should you do to fix the query?
      fr: |
        Un développeur de Fabrikam crée la fonction scalaire **Sales.ufn_NetPrice** dans une base de données Azure SQL. La requête suivante échoue alors avec une erreur indiquant que ufn_NetPrice n'est pas un nom de fonction intégrée reconnu.

        ```sql
        SELECT OrderLineID, ufn_NetPrice(UnitPrice, 0.1) AS NetPrice
        FROM Sales.OrderLine;
        ```

        Que devez-vous faire pour corriger la requête ?
    body:
      options:
        - { id: a, text: { en: "Call the function as Sales.ufn_NetPrice(UnitPrice, 0.1).", fr: "Appeler la fonction sous la forme Sales.ufn_NetPrice(UnitPrice, 0.1)." } }
        - { id: b, text: { en: "Call the function with EXECUTE Sales.ufn_NetPrice in the SELECT list.", fr: "Appeler la fonction avec EXECUTE Sales.ufn_NetPrice dans la liste SELECT." } }
        - { id: c, text: { en: "Move the call to the FROM clause with CROSS APPLY.", fr: "Déplacer l'appel dans la clause FROM avec CROSS APPLY." } }
        - { id: d, text: { en: "Re-create the function WITH SCHEMABINDING.", fr: "Recréer la fonction WITH SCHEMABINDING." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A scalar user-defined function must be invoked with at least its two-part name, schema.function. Without the schema, the name is looked up among the built-in functions, which raises the error.
        fr: |
          Une fonction scalaire définie par l'utilisateur doit être appelée au moins avec son nom en deux parties, schéma.fonction. Sans le schéma, le nom est recherché parmi les fonctions intégrées, ce qui provoque l'erreur.
      options:
        b: { en: "EXECUTE can't appear inside a SELECT list; a scalar function is called as an expression.", fr: "EXECUTE ne peut pas figurer dans une liste SELECT ; une fonction scalaire s'appelle comme une expression." }
        c: { en: "APPLY is used with table-valued functions; a scalar function stays in the SELECT list, with its schema name.", fr: "APPLY s'utilise avec les fonctions table ; une fonction scalaire reste dans la liste SELECT, avec son nom de schéma." }
        d: { en: "Schema binding protects the objects that the function references; it doesn't change how the function is named in a query.", fr: "La liaison au schéma protège les objets référencés par la fonction ; elle ne change pas la façon de nommer la fonction dans une requête." }
    references:
      - title: CREATE FUNCTION (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql

  # ------------------------------------------------------------------ 4
  - id: dp800-qz-12-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys has an Azure SQL database. The customer portal team wrote the following function to give its developers a parameterized way to read the orders of one customer. Sales.Orders holds 40 million rows and has a nonclustered index on (CustomerID, Amount).

        ```sql
        CREATE FUNCTION Sales.ufn_OrdersByCustomer (@CustomerID int)
        RETURNS TABLE
        AS
        RETURN
        (
            SELECT o.OrderID, o.OrderDate, o.Amount
            FROM Sales.Orders AS o
            WHERE o.CustomerID = @CustomerID
        );
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys dispose d'une base de données Azure SQL. L'équipe du portail client a écrit la fonction suivante pour offrir à ses développeurs un moyen paramétré de lire les commandes d'un client. Sales.Orders contient 40 millions de lignes et a un index non cluster sur (CustomerID, Amount).

        ```sql
        CREATE FUNCTION Sales.ufn_OrdersByCustomer (@CustomerID int)
        RETURNS TABLE
        AS
        RETURN
        (
            SELECT o.OrderID, o.OrderDate, o.Amount
            FROM Sales.Orders AS o
            WHERE o.CustomerID = @CustomerID
        );
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: In `SELECT * FROM Sales.ufn_OrdersByCustomer(42) WHERE Amount > 100;`, the optimizer can combine both predicates and seek the index on (CustomerID, Amount).
            fr: Dans `SELECT * FROM Sales.ufn_OrdersByCustomer(42) WHERE Amount > 100;`, l'optimiseur peut combiner les deux prédicats et effectuer une recherche dans l'index sur (CustomerID, Amount).
        - id: s2
          text:
            en: You can add a DECLARE statement and an IF...ELSE block before the RETURN statement of the function.
            fr: Vous pouvez ajouter une instruction DECLARE et un bloc IF...ELSE avant l'instruction RETURN de la fonction.
        - id: s3
          text:
            en: The function can be called in the SELECT list of a query to return the number of orders of each customer.
            fr: La fonction peut être appelée dans la liste SELECT d'une requête pour retourner le nombre de commandes de chaque client.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          An inline table-valued function is expanded into the calling query like a parameterized view, so the optimizer sees the outer filter together with the function's own predicate and can seek the composite index. Its body is a single RETURN (SELECT ...): variables and control-of-flow statements require a multi-statement table-valued function. A table-valued function returns a rowset and is used in the FROM clause, not as a scalar value in the SELECT list.
        fr: |
          Une fonction table inline est développée dans la requête appelante comme une vue paramétrée : l'optimiseur voit le filtre externe avec le prédicat de la fonction et peut effectuer une recherche dans l'index composite. Son corps se limite à un RETURN (SELECT ...) : les variables et les instructions de contrôle de flux exigent une fonction table à instructions multiples. Une fonction table retourne un ensemble de lignes et s'utilise dans la clause FROM, pas comme valeur scalaire dans la liste SELECT.
      options:
        s2: { en: "An inline function has no BEGIN...END body: only one RETURN with one SELECT statement is allowed.", fr: "Une fonction inline n'a pas de corps BEGIN...END : un seul RETURN avec une seule instruction SELECT est autorisé." }
        s3: { en: "A rowset can't be used as a scalar expression; count the rows with a subquery or with APPLY and an aggregate, or write a scalar function.", fr: "Un ensemble de lignes ne peut pas servir d'expression scalaire ; comptez les lignes avec une sous-requête ou avec APPLY et un agrégat, ou écrivez une fonction scalaire." }
    references:
      - title: CREATE FUNCTION (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql

  # ------------------------------------------------------------------ 5
  - id: dp800-qz-12-05
    objective: "1.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has an Azure SQL database that uses the default database options. You create the following trigger.

        ```sql
        CREATE TRIGGER Sales.trg_Orders_Modified
        ON Sales.Orders
        AFTER UPDATE
        AS
        BEGIN
            SET NOCOUNT ON;
            UPDATE o
            SET o.ModifiedAt = SYSUTCDATETIME()
            FROM Sales.Orders AS o
            JOIN inserted AS i ON i.OrderID = o.OrderID;
        END;
        ```

        An application runs an UPDATE statement that changes the status of 20 orders. What happens?
      fr: |
        Adatum dispose d'une base de données Azure SQL qui utilise les options de base de données par défaut. Vous créez le déclencheur suivant.

        ```sql
        CREATE TRIGGER Sales.trg_Orders_Modified
        ON Sales.Orders
        AFTER UPDATE
        AS
        BEGIN
            SET NOCOUNT ON;
            UPDATE o
            SET o.ModifiedAt = SYSUTCDATETIME()
            FROM Sales.Orders AS o
            JOIN inserted AS i ON i.OrderID = o.OrderID;
        END;
        ```

        Une application exécute une instruction UPDATE qui change le statut de 20 commandes. Que se passe-t-il ?
    body:
      options:
        - { id: a, text: { en: "The trigger fires once and sets ModifiedAt for the 20 orders; its own UPDATE doesn't fire it again.", fr: "Le déclencheur s'exécute une fois et définit ModifiedAt pour les 20 commandes ; sa propre instruction UPDATE ne le déclenche pas à nouveau." } }
        - { id: b, text: { en: "The trigger fires again for its own UPDATE until it reaches 32 nesting levels, and the statement is rolled back.", fr: "Le déclencheur se redéclenche pour sa propre instruction UPDATE jusqu'à atteindre 32 niveaux d'imbrication, et l'instruction est annulée." } }
        - { id: c, text: { en: "The trigger fires 20 times, once for each modified order, and sets ModifiedAt each time.", fr: "Le déclencheur s'exécute 20 fois, une fois par commande modifiée, et définit ModifiedAt à chaque fois." } }
        - { id: d, text: { en: "The UPDATE in the trigger fails, because a trigger can't modify the table on which it is defined.", fr: "L'instruction UPDATE du déclencheur échoue, car un déclencheur ne peut pas modifier la table sur laquelle il est défini." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A DML trigger fires once per statement, and the set-based join to inserted updates the 20 rows. An update made by a trigger to its own table would fire the trigger again only through direct recursion, which the RECURSIVE_TRIGGERS database option allows; that option is OFF by default.
        fr: |
          Un déclencheur DML s'exécute une fois par instruction, et la jointure ensembliste avec inserted met à jour les 20 lignes. Une mise à jour faite par un déclencheur sur sa propre table ne le relancerait que par récursivité directe, que l'option de base de données RECURSIVE_TRIGGERS autorise ; cette option est OFF par défaut.
      options:
        b: { en: "Direct recursion happens only when RECURSIVE_TRIGGERS is ON; with the default OFF, the trigger's UPDATE doesn't fire it again.", fr: "La récursivité directe n'a lieu que si RECURSIVE_TRIGGERS est ON ; avec la valeur OFF par défaut, l'instruction UPDATE du déclencheur ne le relance pas." }
        c: { en: "A trigger fires once per statement, whatever the number of rows; inserted contains the 20 rows.", fr: "Un déclencheur s'exécute une fois par instruction, quel que soit le nombre de lignes ; inserted contient les 20 lignes." }
        d: { en: "A trigger can modify its own table; this is a common pattern for audit columns such as ModifiedAt.", fr: "Un déclencheur peut modifier sa propre table ; c'est un modèle courant pour des colonnes d'audit comme ModifiedAt." }
    references:
      - title: CREATE TRIGGER (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-trigger-transact-sql

  # ------------------------------------------------------------------ 6
  - id: dp800-qz-12-06
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware has an Azure SQL database. A stored procedure named **Sales.usp_SearchOrders** is created WITH EXECUTE AS OWNER and has two optional parameters, **@Status varchar(10)** and **@MinAmount decimal(10, 2)**. It builds its WHERE clause from the parameters that aren't NULL.

        The procedure must meet the following requirements:

        - Values typed by users must never be executed as Transact-SQL code.
        - Executions with the same combination of filters must reuse the same cached plan, whatever the values.

        How should you complete the procedure body? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'une base de données Azure SQL. Une procédure stockée nommée **Sales.usp_SearchOrders** est créée WITH EXECUTE AS OWNER et a deux paramètres facultatifs, **@Status varchar(10)** et **@MinAmount decimal(10, 2)**. Elle construit sa clause WHERE à partir des paramètres qui ne sont pas NULL.

        La procédure doit répondre aux exigences suivantes :

        - Les valeurs saisies par les utilisateurs ne doivent jamais être exécutées comme du code Transact-SQL.
        - Les exécutions qui ont la même combinaison de filtres doivent réutiliser le même plan mis en cache, quelles que soient les valeurs.

        Comment devez-vous compléter le corps de la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        DECLARE @sql nvarchar(max) =
            N'SELECT OrderID, CustomerID, Amount FROM Sales.Orders WHERE 1 = 1';

        IF @Status IS NOT NULL
            SET @sql += [[filter]];
        IF @MinAmount IS NOT NULL
            SET @sql += N' AND Amount >= @MinAmount';

        EXECUTE [[proc]] @sql,
            [[def]],
            @Status = @Status,
            @MinAmount = @MinAmount;
      slots:
        - id: filter
          options:
            - { id: param, text: "N' AND Status = @Status'" }
            - { id: concat, text: "N' AND Status = ''' + @Status + N''''" }
            - { id: quotename, text: "N' AND Status = ' + QUOTENAME(@Status)" }
        - id: proc
          options:
            - { id: execsql, text: "sys.sp_executesql" }
            - { id: describe, text: "sys.sp_describe_first_result_set" }
            - { id: prepare, text: "sys.sp_prepare" }
        - id: def
          options:
            - { id: ndef, text: "N'@Status varchar(10), @MinAmount decimal(10, 2)'" }
            - { id: vdef, text: "'@Status varchar(10), @MinAmount decimal(10, 2)'" }
            - { id: notype, text: "N'@Status, @MinAmount'" }
    answer:
      values: { filter: param, proc: execsql, def: ndef }
    explanation:
      correct:
        en: |
          The dynamic statement must reference @Status as a parameter instead of embedding its value, so that user input is never parsed as code. sp_executesql runs the statement with a parameter definition string, which must be Unicode and declare each parameter with its data type; the values are passed after it. Because the text of the statement is the same for each combination of filters, its plan is reused.
        fr: |
          L'instruction dynamique doit référencer @Status comme paramètre au lieu d'y intégrer sa valeur : la saisie de l'utilisateur n'est alors jamais analysée comme du code. sp_executesql exécute l'instruction avec une chaîne de définition des paramètres, qui doit être Unicode et déclarer chaque paramètre avec son type de données ; les valeurs sont passées ensuite. Comme le texte de l'instruction est identique pour chaque combinaison de filtres, son plan est réutilisé.
      options:
        concat: { en: "Concatenating the value into the statement allows SQL injection and creates a different statement text, and plan, for each value.", fr: "Concaténer la valeur dans l'instruction permet l'injection SQL et crée un texte d'instruction, et un plan, différents pour chaque valeur." }
        quotename: { en: "QUOTENAME delimits an identifier with brackets: the status value would be read as a column name, and the text still changes with each value.", fr: "QUOTENAME délimite un identificateur avec des crochets : la valeur du statut serait lue comme un nom de colonne, et le texte change encore avec chaque valeur." }
        describe: { en: "sp_describe_first_result_set returns the metadata of the first result set; it doesn't run the query.", fr: "sp_describe_first_result_set retourne les métadonnées du premier jeu de résultats ; il n'exécute pas la requête." }
        prepare: { en: "sp_prepare only prepares a statement and returns a handle for a later sp_execute call; it doesn't run the query.", fr: "sp_prepare ne fait que préparer une instruction et retourne un handle pour un appel sp_execute ultérieur ; il n'exécute pas la requête." }
        vdef: { en: "The parameter definition string of sp_executesql must be a Unicode (nvarchar) value: a varchar literal is rejected.", fr: "La chaîne de définition des paramètres de sp_executesql doit être une valeur Unicode (nvarchar) : un littéral varchar est rejeté." }
        notype: { en: "Each parameter in the definition string needs a data type.", fr: "Chaque paramètre de la chaîne de définition doit avoir un type de données." }
    references:
      - title: sp_executesql (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-executesql-transact-sql

  # ------------------------------------------------------------------ 7
  - id: dp800-qz-12-07
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has an Azure SQL database that contains the following function. The function and the Sales.OrderLine table are owned by dbo.

        ```sql
        CREATE FUNCTION Sales.ufn_NetPrice
        (
            @UnitPrice decimal(10, 2),
            @Discount  decimal(4, 3)
        )
        RETURNS decimal(10, 2)
        AS
        BEGIN
            RETURN @UnitPrice * (1 - @Discount);
        END;
        ```

        A report filters order lines on their net price. You need to add the computed column `NetPrice AS Sales.ufn_NetPrice(UnitPrice, Discount)` to **Sales.OrderLine** and create a nonclustered index on NetPrice.

        What should you do before you add the column?
      fr: |
        Tailspin Toys dispose d'une base de données Azure SQL qui contient la fonction suivante. La fonction et la table Sales.OrderLine appartiennent à dbo.

        ```sql
        CREATE FUNCTION Sales.ufn_NetPrice
        (
            @UnitPrice decimal(10, 2),
            @Discount  decimal(4, 3)
        )
        RETURNS decimal(10, 2)
        AS
        BEGIN
            RETURN @UnitPrice * (1 - @Discount);
        END;
        ```

        Un rapport filtre les lignes de commande sur leur prix net. Vous devez ajouter la colonne calculée `NetPrice AS Sales.ufn_NetPrice(UnitPrice, Discount)` à **Sales.OrderLine** et créer un index non cluster sur NetPrice.

        Que devez-vous faire avant d'ajouter la colonne ?
    body:
      options:
        - { id: a, text: { en: "Keep the function as it is, and define NetPrice as a PERSISTED computed column.", fr: "Conserver la fonction telle quelle, et définir NetPrice comme colonne calculée PERSISTED." } }
        - { id: b, text: { en: "Alter the function to add the WITH SCHEMABINDING option.", fr: "Modifier la fonction pour ajouter l'option WITH SCHEMABINDING." } }
        - { id: c, text: { en: "Alter the function to add the WITH RETURNS NULL ON NULL INPUT option.", fr: "Modifier la fonction pour ajouter l'option WITH RETURNS NULL ON NULL INPUT." } }
        - { id: d, text: { en: "Alter the function to add the WITH INLINE = ON option.", fr: "Modifier la fonction pour ajouter l'option WITH INLINE = ON." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A computed column can be indexed only if its expression is deterministic and precise, and every function it references has the same owner as the table. The arithmetic on decimal values is deterministic and precise, but a Transact-SQL function is treated as deterministic only when it is created WITH SCHEMABINDING. Without that option, the index can't be created.
        fr: |
          Une colonne calculée ne peut être indexée que si son expression est déterministe et précise, et que chaque fonction référencée a le même propriétaire que la table. Le calcul sur des valeurs decimal est déterministe et précis, mais une fonction Transact-SQL n'est considérée comme déterministe que si elle est créée WITH SCHEMABINDING. Sans cette option, l'index ne peut pas être créé.
      options:
        a: { en: "PERSISTED lets a deterministic but imprecise expression (float or real) be indexed; it doesn't help a function that isn't treated as deterministic.", fr: "PERSISTED permet d'indexer une expression déterministe mais imprécise (float ou real) ; il n'aide pas une fonction qui n'est pas considérée comme déterministe." }
        c: { en: "RETURNS NULL ON NULL INPUT changes how NULL arguments are handled; it doesn't make the function deterministic.", fr: "RETURNS NULL ON NULL INPUT change le traitement des arguments NULL ; il ne rend pas la fonction déterministe." }
        d: { en: "Inlining is a query-processing optimization for the calling queries; it doesn't make a function deterministic for indexing.", fr: "L'incorporation (inlining) est une optimisation du traitement des requêtes appelantes ; elle ne rend pas une fonction déterministe pour l'indexation." }
    references:
      - title: Indexes on computed columns
        url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/indexes-on-computed-columns
      - title: CREATE FUNCTION (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql

  # ------------------------------------------------------------------ 8
  - id: dp800-qz-12-08
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind has an Azure SQL database. The **Sales.Customer** table has the columns CustomerID (primary key), IsDeleted (bit) and DeletedAt (datetime2). No foreign key with a cascading action references Sales.Customer.

        Several applications run DELETE statements against Sales.Customer, sometimes for hundreds of customers in one statement. You must not change the applications. The rows must stay in the table: each deleted customer must instead be marked with IsDeleted = 1 and the deletion time.

        How should you complete the trigger? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'une base de données Azure SQL. La table **Sales.Customer** a les colonnes CustomerID (clé primaire), IsDeleted (bit) et DeletedAt (datetime2). Aucune clé étrangère avec une action en cascade ne référence Sales.Customer.

        Plusieurs applications exécutent des instructions DELETE sur Sales.Customer, parfois pour des centaines de clients en une seule instruction. Vous ne devez pas modifier les applications. Les lignes doivent rester dans la table : chaque client supprimé doit être marqué avec IsDeleted = 1 et l'heure de la suppression.

        Comment devez-vous compléter le déclencheur ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        CREATE OR ALTER TRIGGER Sales.trg_Customer_SoftDelete
        ON Sales.Customer
        [[timing]] [[event]]
        AS
        BEGIN
            SET NOCOUNT ON;
            UPDATE c
            SET c.IsDeleted = 1,
                c.DeletedAt = SYSUTCDATETIME()
            FROM Sales.Customer AS c
            JOIN [[src]] AS x ON x.CustomerID = c.CustomerID;
        END;
      slots:
        - id: timing
          options:
            - { id: insteadof, text: "INSTEAD OF" }
            - { id: after, text: "AFTER" }
            - { id: for, text: "FOR" }
        - id: event
          options:
            - { id: delete, text: "DELETE" }
            - { id: update, text: "UPDATE" }
            - { id: insert, text: "INSERT" }
        - id: src
          options:
            - { id: deleted, text: "deleted" }
            - { id: inserted, text: "inserted" }
            - { id: customer, text: "Sales.Customer" }
    answer:
      values: { timing: insteadof, event: delete, src: deleted }
    explanation:
      correct:
        en: |
          An INSTEAD OF DELETE trigger runs in place of the DELETE statement, so the rows are never removed and the trigger decides what happens. The deleted pseudo-table holds every row that the statement targeted, so joining it marks all the customers of a multi-row DELETE. The trigger's own UPDATE doesn't fire the INSTEAD OF DELETE trigger.
        fr: |
          Un déclencheur INSTEAD OF DELETE s'exécute à la place de l'instruction DELETE : les lignes ne sont jamais supprimées et le déclencheur décide de ce qui se passe. La pseudo-table deleted contient toutes les lignes visées par l'instruction : la jointure marque donc tous les clients d'un DELETE multiligne. L'instruction UPDATE du déclencheur ne déclenche pas le déclencheur INSTEAD OF DELETE.
      options:
        after: { en: "An AFTER trigger runs once the rows are already deleted: the UPDATE would find no row to mark.", fr: "Un déclencheur AFTER s'exécute une fois les lignes déjà supprimées : l'instruction UPDATE ne trouverait aucune ligne à marquer." }
        for: { en: "FOR is a synonym of AFTER: the rows would already be deleted.", fr: "FOR est un synonyme d'AFTER : les lignes seraient déjà supprimées." }
        update: { en: "The applications run DELETE statements; a trigger on UPDATE doesn't fire for them.", fr: "Les applications exécutent des instructions DELETE ; un déclencheur sur UPDATE ne s'exécute pas pour elles." }
        insert: { en: "The applications run DELETE statements; a trigger on INSERT doesn't fire for them.", fr: "Les applications exécutent des instructions DELETE ; un déclencheur sur INSERT ne s'exécute pas pour elles." }
        inserted: { en: "For a DELETE, inserted is empty: the targeted rows are in deleted.", fr: "Pour un DELETE, inserted est vide : les lignes visées sont dans deleted." }
        customer: { en: "Joining Sales.Customer to itself would mark every customer, not only those targeted by the DELETE.", fr: "Joindre Sales.Customer à elle-même marquerait tous les clients, pas seulement ceux visés par le DELETE." }
    references:
      - title: CREATE TRIGGER (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-trigger-transact-sql

  # ------------------------------------------------------------------ 9
  - id: dp800-qz-12-09
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum has an Azure SQL database. The **Sales** schema and the **Sales.Orders** table are owned by dbo. The **Reporting** schema is owned by a database user named **ReportAdmin**, who created the view **Reporting.vOrderSummary** that selects from Sales.Orders. The view has no explicit owner.

        Members of the **Analysts** role have the SELECT permission on Reporting.vOrderSummary and no permission on Sales.Orders. When they query the view, they receive an error stating that the SELECT permission was denied on the object Orders.

        Analysts must be able to query the view, and they must not be able to query Sales.Orders directly. Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'une base de données Azure SQL. Le schéma **Sales** et la table **Sales.Orders** appartiennent à dbo. Le schéma **Reporting** appartient à un utilisateur de base de données nommé **ReportAdmin**, qui a créé la vue **Reporting.vOrderSummary** qui interroge Sales.Orders. La vue n'a pas de propriétaire explicite.

        Les membres du rôle **Analysts** ont l'autorisation SELECT sur Reporting.vOrderSummary et aucune autorisation sur Sales.Orders. Quand ils interrogent la vue, ils reçoivent une erreur indiquant que l'autorisation SELECT a été refusée sur l'objet Orders.

        Les membres d'Analysts doivent pouvoir interroger la vue, et ils ne doivent pas pouvoir interroger Sales.Orders directement. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Grant SELECT on Sales.Orders to ReportAdmin.", fr: "Accorder SELECT sur Sales.Orders à ReportAdmin." } }
        - { id: b, text: { en: "Run ALTER AUTHORIZATION ON SCHEMA::Reporting TO dbo.", fr: "Exécuter ALTER AUTHORIZATION ON SCHEMA::Reporting TO dbo." } }
        - { id: c, text: { en: "Alter the view to add the WITH EXECUTE AS OWNER option.", fr: "Modifier la vue pour ajouter l'option WITH EXECUTE AS OWNER." } }
        - { id: d, text: { en: "Grant SELECT on Reporting.vOrderSummary to Analysts.", fr: "Accorder SELECT sur Reporting.vOrderSummary à Analysts." } }
        - { id: e, text: { en: "Alter the view to add the WITH SCHEMABINDING option.", fr: "Modifier la vue pour ajouter l'option WITH SCHEMABINDING." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The view belongs to ReportAdmin and the table to dbo, so the ownership chain is broken and the engine checks the permissions of the Analysts members on Sales.Orders. Transferring the Reporting schema to dbo makes dbo the owner of the view, which has no explicit owner, and repairs the chain. The transfer drops the permissions on the objects of the schema that have no explicit owner, so SELECT on the view must then be granted to Analysts again.
        fr: |
          La vue appartient à ReportAdmin et la table à dbo : le chaînage des propriétés est rompu, et le moteur vérifie les autorisations des membres d'Analysts sur Sales.Orders. Transférer le schéma Reporting à dbo rend dbo propriétaire de la vue, qui n'a pas de propriétaire explicite, et répare le chaînage. Le transfert supprime les autorisations sur les objets du schéma sans propriétaire explicite : SELECT sur la vue doit donc être accordé de nouveau à Analysts.
      options:
        a: { en: "With a broken chain, the engine checks the permissions of the caller, not those of the view owner: the Analysts members would still be denied.", fr: "Avec un chaînage rompu, le moteur vérifie les autorisations de l'appelant, pas celles du propriétaire de la vue : les membres d'Analysts seraient toujours refusés." }
        c: { en: "CREATE VIEW and ALTER VIEW accept only ENCRYPTION, SCHEMABINDING and VIEW_METADATA: views don't support EXECUTE AS.", fr: "CREATE VIEW et ALTER VIEW n'acceptent que ENCRYPTION, SCHEMABINDING et VIEW_METADATA : les vues ne prennent pas en charge EXECUTE AS." }
        e: { en: "Schema binding protects the referenced table from changes; it doesn't change the owner of the view or repair the chain.", fr: "La liaison au schéma protège la table référencée contre les modifications ; elle ne change pas le propriétaire de la vue et ne répare pas le chaînage." }
    references:
      - title: ALTER AUTHORIZATION (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-authorization-transact-sql
      - title: Managing Permissions with Stored Procedures in SQL Server
        url: https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/sql/managing-permissions-with-stored-procedures-in-sql-server

  # ------------------------------------------------------------------ 10
  - id: dp800-qz-12-10
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has an Azure SQL database. The Quantity and UnitPrice columns of Sales.OrderLine are defined as NOT NULL, and all the tables are owned by dbo. You run the following statements to materialize a revenue report.

        ```sql
        CREATE VIEW Sales.vRecentRevenue
        WITH SCHEMABINDING
        AS
        SELECT o.SalesRegion, p.Campaign,
               SUM(ol.Quantity * ol.UnitPrice) AS Revenue,
               COUNT_BIG(*) AS LineCount
        FROM Sales.Orders AS o
        JOIN Sales.OrderLine AS ol ON ol.OrderID = o.OrderID
        LEFT OUTER JOIN Sales.Promotion AS p ON p.PromotionID = o.PromotionID
        WHERE o.OrderDate >= DATEADD(month, -12, GETDATE())
        GROUP BY o.SalesRegion, p.Campaign;
        GO
        CREATE UNIQUE CLUSTERED INDEX UCX_vRecentRevenue
            ON Sales.vRecentRevenue (SalesRegion, Campaign);
        ```

        The view is created, but the CREATE INDEX statement fails. Which two elements of the view prevent the index from being created?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'une base de données Azure SQL. Les colonnes Quantity et UnitPrice de Sales.OrderLine sont définies comme NOT NULL, et toutes les tables appartiennent à dbo. Vous exécutez les instructions suivantes pour matérialiser un rapport de chiffre d'affaires.

        ```sql
        CREATE VIEW Sales.vRecentRevenue
        WITH SCHEMABINDING
        AS
        SELECT o.SalesRegion, p.Campaign,
               SUM(ol.Quantity * ol.UnitPrice) AS Revenue,
               COUNT_BIG(*) AS LineCount
        FROM Sales.Orders AS o
        JOIN Sales.OrderLine AS ol ON ol.OrderID = o.OrderID
        LEFT OUTER JOIN Sales.Promotion AS p ON p.PromotionID = o.PromotionID
        WHERE o.OrderDate >= DATEADD(month, -12, GETDATE())
        GROUP BY o.SalesRegion, p.Campaign;
        GO
        CREATE UNIQUE CLUSTERED INDEX UCX_vRecentRevenue
            ON Sales.vRecentRevenue (SalesRegion, Campaign);
        ```

        La vue est créée, mais l'instruction CREATE INDEX échoue. Quels sont les deux éléments de la vue qui empêchent la création de l'index ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The LEFT OUTER JOIN to Sales.Promotion", fr: "La jointure LEFT OUTER JOIN avec Sales.Promotion" } }
        - { id: b, text: { en: "The COUNT_BIG(*) expression", fr: "L'expression COUNT_BIG(*)" } }
        - { id: c, text: { en: "The predicate on OrderDate that calls GETDATE()", fr: "Le prédicat sur OrderDate qui appelle GETDATE()" } }
        - { id: d, text: { en: "The SUM of the Quantity * UnitPrice expression", fr: "La somme (SUM) de l'expression Quantity * UnitPrice" } }
        - { id: e, text: { en: "The two-part names of the tables", fr: "Les noms en deux parties des tables" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          An indexed view can't contain outer joins, and every expression in it, including the WHERE clause, must be deterministic. GETDATE() returns a different value at each call, so a "last 12 months" filter can't be materialized; a fixed date or a filter in the queries that read the view is needed instead.
        fr: |
          Une vue indexée ne peut pas contenir de jointure externe, et toutes ses expressions, y compris la clause WHERE, doivent être déterministes. GETDATE() retourne une valeur différente à chaque appel : un filtre « 12 derniers mois » ne peut donc pas être matérialisé ; il faut une date fixe ou un filtre dans les requêtes qui lisent la vue.
      options:
        b: { en: "COUNT_BIG(*) is required in an indexed view that has a GROUP BY; it isn't a cause of the failure.", fr: "COUNT_BIG(*) est obligatoire dans une vue indexée qui contient un GROUP BY ; il n'est pas une cause de l'échec." }
        d: { en: "SUM is allowed in an indexed view when the expression can't be NULL, which is the case for two NOT NULL columns.", fr: "SUM est autorisé dans une vue indexée quand l'expression ne peut pas être NULL, ce qui est le cas pour deux colonnes NOT NULL." }
        e: { en: "Two-part names are required by schema binding; they are correct here.", fr: "Les noms en deux parties sont exigés par la liaison au schéma ; ils sont corrects ici." }
    references:
      - title: Create indexed views
        url: https://learn.microsoft.com/en-us/sql/relational-databases/views/create-indexed-views
