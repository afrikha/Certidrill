chapter: 32-search-design
questions:
  # ------------------------------------------------------------------ 1
  - id: dp800-qz-32-01
    objective: "3.2.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso tests an approximate nearest neighbor (ANN) search on a sample of questions. For one question, the exact search returns 10 rows, and the ANN search returns 9 of these 10 rows plus one other row.

        Which measure describes the quality of this ANN result, and what is its value?
      fr: |
        Contoso teste une recherche du plus proche voisin approximatif (ANN) sur un échantillon de questions. Pour une question, la recherche exacte retourne 10 lignes, et la recherche ANN retourne 9 de ces 10 lignes plus une autre ligne.

        Quelle mesure décrit la qualité de ce résultat ANN, et quelle est sa valeur ?
    body:
      options:
        - { id: a, text: { en: "The recall, the share of the exact nearest neighbors that the ANN search also returns: 0.9", fr: "Le rappel, la part des plus proches voisins exacts que la recherche ANN retourne aussi : 0,9" } }
        - { id: b, text: { en: "The recall, the share of the returned rows that the exact search doesn't return: 0.1", fr: "Le rappel, la part des lignes retournées que la recherche exacte ne retourne pas : 0,1" } }
        - { id: c, text: { en: "The cosine distance between the two result lists, where 0 means identical lists: 0.1", fr: "La distance cosinus entre les deux listes de résultats, où 0 signifie des listes identiques : 0,1" } }
        - { id: d, text: { en: "The share of the vectors of the table that the ANN search compared with the question: 0.9", fr: "La part des vecteurs de la table que la recherche ANN a comparés à la question : 0,9" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Recall is the proportion of the true nearest neighbors, those that an exact search returns, that the approximate search also finds. Here 9 of the 10 exact neighbors are found, so the recall is 0.9; a recall of 1 means no approximation.
        fr: |
          Le rappel est la proportion des vrais plus proches voisins, ceux que retourne une recherche exacte, que la recherche approximative trouve aussi. Ici, 9 des 10 voisins exacts sont trouvés : le rappel vaut donc 0,9 ; un rappel de 1 signifie qu'il n'y a aucune approximation.
      options:
        b: { en: "Recall counts the exact neighbors that are found, not the extra rows; 0.1 is the share that was missed.", fr: "Le rappel compte les voisins exacts trouvés, pas les lignes en trop ; 0,1 est la part manquée." }
        c: { en: "Cosine distance compares two vectors, not two lists of rows.", fr: "La distance cosinus compare deux vecteurs, pas deux listes de lignes." }
        d: { en: "The number of vectors compared measures the cost of the search, not the quality of its result.", fr: "Le nombre de vecteurs comparés mesure le coût de la recherche, pas la qualité de son résultat." }
    references:
      - title: Vector search and vector indexes in the SQL Database Engine
        url: https://learn.microsoft.com/en-us/sql/sql-server/ai/vectors

  # ------------------------------------------------------------------ 2
  - id: dp800-qz-32-02
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware is adding a search page to the product catalog of its Azure SQL database. Users type product names and words that appear in the descriptions, such as "aluminum frame". The search must not call any AI model when a user runs a query, and it must not add any cost per query outside the database.

        Which search approach should you implement?
      fr: |
        Litware ajoute une page de recherche au catalogue de produits de sa base de données Azure SQL. Les utilisateurs saisissent des noms de produits et des mots qui figurent dans les descriptions, comme « aluminum frame ». La recherche ne doit appeler aucun modèle d'IA quand un utilisateur exécute une requête, et elle ne doit ajouter aucun coût par requête en dehors de la base de données.

        Quelle approche de recherche devez-vous implémenter ?
    body:
      options:
        - { id: a, text: { en: "Hybrid search", fr: "Recherche hybride" } }
        - { id: b, text: { en: "Semantic vector search", fr: "Recherche vectorielle sémantique" } }
        - { id: c, text: { en: "Approximate vector search with a vector index", fr: "Recherche vectorielle approximative avec un index vectoriel" } }
        - { id: d, text: { en: "Full-text search", fr: "Recherche en texte intégral" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Full-text search matches words and their forms by using a full-text index inside the database; a query costs only the index lookup. The users type words that appear in the text, so word matching meets the need without any call to a model.
        fr: |
          La recherche en texte intégral fait correspondre les mots et leurs formes grâce à un index de recherche en texte intégral dans la base de données ; une requête ne coûte que la lecture de l'index. Les utilisateurs saisissent des mots présents dans le texte : la correspondance de mots répond donc au besoin sans aucun appel à un modèle.
      options:
        a: { en: "Hybrid search runs a vector search too, which needs an embedding of each query.", fr: "La recherche hybride exécute aussi une recherche vectorielle, qui a besoin d'une incorporation de chaque requête." }
        b: { en: "The query text must be converted into a vector by the embedding model at query time, which the requirements forbid.", fr: "Le texte de la requête doit être converti en vecteur par le modèle d'incorporation au moment de la requête, ce que les exigences interdisent." }
        c: { en: "A vector index speeds up the comparison, but the query still needs an embedding generated by the model.", fr: "Un index vectoriel accélère la comparaison, mais la requête a toujours besoin d'une incorporation générée par le modèle." }
    references:
      - title: Choose an intelligent search approach
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach

  # ------------------------------------------------------------------ 3
  - id: dp800-qz-32-03
    objective: "3.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam migrated a table named dbo.DocEmbeddings to an Azure SQL database. The Embedding column contains vectors of 1,536 dimensions. You need to check whether the migrated vectors are stored in half precision or in single precision.

        Which expression should you query?
      fr: |
        Fabrikam a migré une table nommée dbo.DocEmbeddings vers une base de données Azure SQL. La colonne Embedding contient des vecteurs de 1 536 dimensions. Vous devez vérifier si les vecteurs migrés sont stockés en demi-précision ou en simple précision.

        Quelle expression devez-vous interroger ?
    body:
      options:
        - { id: a, text: "VECTORPROPERTY(Embedding, 'Dimensions')" }
        - { id: b, text: "VECTORPROPERTY(Embedding, 'BaseType')" }
        - { id: c, text: "VECTOR_NORMALIZE(Embedding, 'norminf')" }
        - { id: d, text: "VECTOR_DISTANCE('euclidean', Embedding, Embedding)" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          VECTORPROPERTY returns a property of a vector: 'BaseType' returns the name of its base type (float16 for half precision, float32 for single precision) as a sysname, and 'Dimensions' returns its number of dimensions as an integer.
        fr: |
          VECTORPROPERTY retourne une propriété d'un vecteur : 'BaseType' retourne le nom de son type de base (float16 pour la demi-précision, float32 pour la simple précision) sous forme de sysname, et 'Dimensions' retourne son nombre de dimensions sous forme d'entier.
      options:
        a: { en: "'Dimensions' returns 1536 in both cases: half and single precision vectors have the same number of dimensions.", fr: "'Dimensions' retourne 1536 dans les deux cas : les vecteurs en demi et en simple précision ont le même nombre de dimensions." }
        c: { en: "VECTOR_NORMALIZE returns a rescaled vector; it doesn't report the base type.", fr: "VECTOR_NORMALIZE retourne un vecteur remis à l'échelle ; il n'indique pas le type de base." }
        d: { en: "The distance of a vector to itself is 0 whatever its precision.", fr: "La distance d'un vecteur à lui-même vaut 0 quelle que soit sa précision." }
    references:
      - title: VECTORPROPERTY (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vectorproperty-transact-sql

  # ------------------------------------------------------------------ 4
  - id: dp800-qz-32-04
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys has an Azure SQL database. The dbo.Toys table has a primary key named PK_Toys on an int column and two text columns: DescriptionEn, in English, and DescriptionFr, in French. A full-text catalog named ToyCatalog exists, and the default full-text language is English.

        Full-text queries must match the inflectional forms of the words of each column in its own language, such as "cheval" and "chevaux" in DescriptionFr.

        What should you do?
      fr: |
        Wingtip Toys dispose d'une base de données Azure SQL. La table dbo.Toys possède une clé primaire nommée PK_Toys sur une colonne int et deux colonnes de texte : DescriptionEn, en anglais, et DescriptionFr, en français. Un catalogue de texte intégral nommé ToyCatalog existe, et la langue par défaut du texte intégral est l'anglais.

        Les requêtes en texte intégral doivent faire correspondre les formes fléchies des mots de chaque colonne dans sa propre langue, comme « cheval » et « chevaux » dans DescriptionFr.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create two full-text indexes on dbo.Toys, one for each column, each with its own language.", fr: "Créer deux index de recherche en texte intégral sur dbo.Toys, un par colonne, chacun avec sa propre langue." } }
        - { id: b, text: { en: "Create one full-text index on dbo.Toys with both columns and without the LANGUAGE option.", fr: "Créer un seul index de recherche en texte intégral sur dbo.Toys avec les deux colonnes et sans l'option LANGUAGE." } }
        - { id: c, text: { en: "Create one full-text index on dbo.Toys with DescriptionEn LANGUAGE 1033 and DescriptionFr LANGUAGE 1036.", fr: "Créer un seul index de recherche en texte intégral sur dbo.Toys avec DescriptionEn LANGUAGE 1033 et DescriptionFr LANGUAGE 1036." } }
        - { id: d, text: { en: "Create one full-text index on dbo.Toys with both columns set to LANGUAGE 0 (neutral).", fr: "Créer un seul index de recherche en texte intégral sur dbo.Toys avec les deux colonnes définies sur LANGUAGE 0 (neutre)." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A table can have only one full-text index, and the LANGUAGE option is set per column: it selects the word breaker and stemmer used to index that column. LCID 1033 (English) for DescriptionEn and 1036 (French) for DescriptionFr let FORMSOF(INFLECTIONAL, ...) match the forms of each language.
        fr: |
          Une table ne peut avoir qu'un seul index de recherche en texte intégral, et l'option LANGUAGE se définit par colonne : elle choisit l'analyseur lexical et le générateur de formes dérivées utilisés pour indexer cette colonne. Le LCID 1033 (anglais) pour DescriptionEn et 1036 (français) pour DescriptionFr permettent à FORMSOF(INFLECTIONAL, ...) de faire correspondre les formes de chaque langue.
      options:
        a: { en: "Only one full-text index is allowed per table, whatever the catalog.", fr: "Un seul index de recherche en texte intégral est autorisé par table, quel que soit le catalogue." }
        b: { en: "Without LANGUAGE, both columns use the default language, English, so French forms such as « chevaux » aren't recognized.", fr: "Sans LANGUAGE, les deux colonnes utilisent la langue par défaut, l'anglais : les formes françaises comme « chevaux » ne sont donc pas reconnues." }
        d: { en: "The neutral language only splits words; it doesn't generate the inflectional forms of either language.", fr: "La langue neutre ne fait que séparer les mots ; elle ne génère les formes fléchies d'aucune des deux langues." }
    references:
      - title: CREATE FULLTEXT INDEX (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-fulltext-index-transact-sql
      - title: Choose a Language When Creating a Full-Text Index
        url: https://learn.microsoft.com/en-us/sql/relational-databases/search/choose-a-language-when-creating-a-full-text-index

  # ------------------------------------------------------------------ 5
  - id: dp800-qz-32-05
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum receives product embeddings from a partner in a staging table named dbo.StagingEmbeddings. Its VectorText column, of type nvarchar(max), contains JSON arrays of exactly 1,536 numbers. You need to copy the embeddings into the Embedding column, of type VECTOR(1536), of dbo.ProductEmbeddings.

        What should you do?
      fr: |
        Adatum reçoit d'un partenaire des incorporations de produits dans une table de préproduction nommée dbo.StagingEmbeddings. Sa colonne VectorText, de type nvarchar(max), contient des tableaux JSON d'exactement 1 536 nombres. Vous devez copier les incorporations dans la colonne Embedding, de type VECTOR(1536), de dbo.ProductEmbeddings.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Convert VectorText to varbinary(max), and then insert the binary value into Embedding.", fr: "Convertir VectorText en varbinary(max), puis insérer la valeur binaire dans Embedding." } }
        - { id: b, text: { en: "Parse VectorText with OPENJSON, and then insert one row per number into Embedding.", fr: "Analyser VectorText avec OPENJSON, puis insérer une ligne par nombre dans Embedding." } }
        - { id: c, text: { en: "Pass VectorText to AI_GENERATE_EMBEDDINGS, and then insert the result into Embedding.", fr: "Passer VectorText à AI_GENERATE_EMBEDDINGS, puis insérer le résultat dans Embedding." } }
        - { id: d, text: { en: "Insert VectorText into Embedding, converted with CAST(VectorText AS VECTOR(1536)).", fr: "Insérer VectorText dans Embedding, converti avec CAST(VectorText AS VECTOR(1536))." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The vector type converts implicitly or explicitly from char, nchar, varchar, nvarchar and json values that contain a JSON array. Each array has exactly 1,536 numbers, so it converts to VECTOR(1536); an array of another length would raise error 42204.
        fr: |
          Le type vector se convertit de façon implicite ou explicite à partir de valeurs char, nchar, varchar, nvarchar et json qui contiennent un tableau JSON. Chaque tableau compte exactement 1 536 nombres : il se convertit donc en VECTOR(1536) ; un tableau d'une autre longueur déclencherait l'erreur 42204.
      options:
        a: { en: "Conversion between vector and any type other than the character types and json isn't allowed.", fr: "La conversion entre vector et tout type autre que les types caractères et json n'est pas autorisée." }
        b: { en: "A vector value holds the whole array in one column of one row; it isn't split into one row per number.", fr: "Une valeur vector contient tout le tableau dans une colonne d'une seule ligne ; elle n'est pas répartie en une ligne par nombre." }
        c: { en: "The model would embed the text of the JSON array itself, producing a vector unrelated to the product.", fr: "Le modèle incorporerait le texte du tableau JSON lui-même, ce qui produirait un vecteur sans rapport avec le produit." }
    references:
      - title: Vector data type
        url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type

  # ------------------------------------------------------------------ 6
  - id: dp800-qz-32-06
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has an Azure SQL database that contains a full-text catalog named ProductCatalog. A deployment pipeline connects as a database user named deploy_ft, which currently has no permission in the database.

        The pipeline must create a full-text index on dbo.Products in ProductCatalog. It must not be able to change any other table or catalog. The solution must follow the principle of least privilege.

        Which two permissions should you grant to deploy_ft? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'une base de données Azure SQL qui contient un catalogue de texte intégral nommé ProductCatalog. Un pipeline de déploiement se connecte en tant qu'utilisateur de base de données nommé deploy_ft, qui n'a actuellement aucune autorisation dans la base de données.

        Le pipeline doit créer un index de recherche en texte intégral sur dbo.Products dans ProductCatalog. Il ne doit pouvoir modifier aucune autre table ni aucun autre catalogue. La solution doit respecter le principe du moindre privilège.

        Quelles sont les deux autorisations que vous devez accorder à deploy_ft ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Membership in the db_ddladmin fixed database role", fr: "L'appartenance au rôle de base de données fixe db_ddladmin" } }
        - { id: b, text: { en: "REFERENCES on FULLTEXT CATALOG::ProductCatalog", fr: "REFERENCES sur FULLTEXT CATALOG::ProductCatalog" } }
        - { id: c, text: { en: "CONTROL on SCHEMA::dbo", fr: "CONTROL sur SCHEMA::dbo" } }
        - { id: d, text: { en: "ALTER ANY FULLTEXT CATALOG on the database", fr: "ALTER ANY FULLTEXT CATALOG sur la base de données" } }
        - { id: e, text: { en: "ALTER on OBJECT::dbo.Products", fr: "ALTER sur OBJECT::dbo.Products" } }
        - { id: f, text: { en: "CREATE FULLTEXT CATALOG on the database", fr: "CREATE FULLTEXT CATALOG sur la base de données" } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Creating a full-text index requires REFERENCES on the full-text catalog that will hold it and ALTER on the table. Together they let deploy_ft create the index on dbo.Products in ProductCatalog, and nothing else.
        fr: |
          La création d'un index de recherche en texte intégral exige REFERENCES sur le catalogue de texte intégral qui le contiendra et ALTER sur la table. Ensemble, elles permettent à deploy_ft de créer l'index sur dbo.Products dans ProductCatalog, et rien d'autre.
      options:
        a: { en: "db_ddladmin also works, but it lets the user change any object of the database.", fr: "db_ddladmin fonctionne aussi, mais il permet à l'utilisateur de modifier n'importe quel objet de la base de données." }
        c: { en: "CONTROL on the schema covers every table of dbo, beyond dbo.Products.", fr: "CONTROL sur le schéma couvre toutes les tables de dbo, au-delà de dbo.Products." }
        d: { en: "ALTER ANY FULLTEXT CATALOG lets the user change every catalog, which the requirements forbid.", fr: "ALTER ANY FULLTEXT CATALOG permet à l'utilisateur de modifier tous les catalogues, ce que les exigences interdisent." }
        f: { en: "The catalog already exists; creating a catalog isn't needed to create an index in it.", fr: "Le catalogue existe déjà ; il n'est pas nécessaire de créer un catalogue pour y créer un index." }
    references:
      - title: CREATE FULLTEXT INDEX (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-fulltext-index-transact-sql
      - title: GRANT Full-Text Permissions (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/grant-full-text-permissions-transact-sql

  # ------------------------------------------------------------------ 7
  - id: dp800-qz-32-07
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Tailspin Toys has an Azure SQL database. The dbo.PartnerItems table contains 2 million rows with embeddings in a VECTOR(1536) column, and a latest-version vector index named vix_PartnerItems uses the cosine metric on that column. Each night, a job replaces all the rows with a new export from the partner. The export already contains the embeddings.

        The job must meet the following requirements:

        - Empty the table by using TRUNCATE TABLE.
        - Build the vector index once, on the complete data.
        - When the job ends, approximate searches use a vector index again.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Tailspin Toys dispose d'une base de données Azure SQL. La table dbo.PartnerItems contient 2 millions de lignes avec des incorporations dans une colonne VECTOR(1536), et un index vectoriel de dernière version nommé vix_PartnerItems utilise la métrique cosinus sur cette colonne. Chaque nuit, un travail remplace toutes les lignes par une nouvelle exportation du partenaire. L'exportation contient déjà les incorporations.

        Le travail doit satisfaire les exigences suivantes :

        - Vider la table à l'aide de TRUNCATE TABLE.
        - Construire l'index vectoriel une seule fois, sur les données complètes.
        - À la fin du travail, les recherches approximatives utilisent de nouveau un index vectoriel.

        Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans l'ordre correct.
    body:
      count: 4
      actions:
        - { id: create, text: { en: "Create a vector index on the embedding column with METRIC = 'cosine'.", fr: "Créer un index vectoriel sur la colonne d'incorporation avec METRIC = 'cosine'." } }
        - { id: trunc, text: { en: "Run TRUNCATE TABLE dbo.PartnerItems.", fr: "Exécuter TRUNCATE TABLE dbo.PartnerItems." } }
        - { id: preview, text: { en: "Set the PREVIEW_FEATURES database scoped configuration to ON.", fr: "Définir la configuration délimitée à la base de données PREVIEW_FEATURES sur ON." } }
        - { id: load, text: { en: "Load the rows of the new export, with their embeddings, into dbo.PartnerItems.", fr: "Charger dans dbo.PartnerItems les lignes de la nouvelle exportation, avec leurs incorporations." } }
        - { id: early, text: { en: "Create the vector index on the empty table, so that the rows are indexed as they're loaded.", fr: "Créer l'index vectoriel sur la table vide, pour que les lignes soient indexées au fil du chargement." } }
        - { id: drop, text: { en: "Drop vix_PartnerItems.", fr: "Supprimer vix_PartnerItems." } }
    answer:
      sequence: [drop, trunc, load, create]
    explanation:
      correct:
        en: |
          TRUNCATE TABLE isn't allowed on a table that has a vector index, so the index must be dropped first. After the truncation and the load, the index is created once on the complete data; its creation needs at least 100 rows with a non-NULL vector.
        fr: |
          TRUNCATE TABLE n'est pas autorisé sur une table qui possède un index vectoriel : l'index doit donc être supprimé d'abord. Après la troncation et le chargement, l'index est créé une seule fois sur les données complètes ; sa création exige au moins 100 lignes avec un vecteur non NULL.
      options:
        early: { en: "Creating the index on an empty table fails (at least 100 non-NULL vectors are required), and the index wouldn't be built once on the complete data.", fr: "Créer l'index sur une table vide échoue (au moins 100 vecteurs non NULL sont exigés), et l'index ne serait pas construit une seule fois sur les données complètes." }
        preview: { en: "Vector indexes are generally available in Azure SQL Database; no preview configuration is needed.", fr: "Les index vectoriels sont en disponibilité générale dans Azure SQL Database ; aucune configuration de préversion n'est nécessaire." }
    references:
      - title: CREATE VECTOR INDEX (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql

  # ------------------------------------------------------------------ 8
  - id: dp800-qz-32-08
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware has an Azure SQL database that stores an electronics catalog. A full-text index covers the Description column, and no thesaurus is configured. The dbo.ProductEmbeddings table stores an embedding of each description, generated by an external model. The team plans to replace the current full-text search page with a hybrid search that merges the ranked lists of a full-text search and of a vector search.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'une base de données Azure SQL qui stocke un catalogue d'électronique. Un index de recherche en texte intégral couvre la colonne Description, et aucun thésaurus n'est configuré. La table dbo.ProductEmbeddings stocke une incorporation de chaque description, générée par un modèle externe. L'équipe prévoit de remplacer la page actuelle de recherche en texte intégral par une recherche hybride qui fusionne les listes classées d'une recherche en texte intégral et d'une recherche vectorielle.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Compared with the current page, each query of the hybrid search adds a call to the embedding model.", fr: "Par rapport à la page actuelle, chaque requête de la recherche hybride ajoute un appel au modèle d'incorporation." }
        - id: s2
          text: { en: "For a query that contains only the product code PX-4471, the vector part of the hybrid search matches the code more reliably than the full-text part.", fr: "Pour une requête qui ne contient que le code produit PX-4471, la partie vectorielle de la recherche hybride fait correspondre le code de façon plus fiable que la partie en texte intégral." }
        - id: s3
          text: { en: "For the query \"RC car\", only the vector part of the hybrid search can return a product described only as \"remote-controlled vehicle\".", fr: "Pour la requête « RC car », seule la partie vectorielle de la recherche hybride peut retourner un produit décrit uniquement comme « remote-controlled vehicle »." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A vector search compares the stored vectors with a vector of the query, so each hybrid query needs one embedding call, which full-text search alone never makes. Exact codes and terms are the strength of full-text search; vectors compare meaning, not exact strings. "RC car" and "remote-controlled vehicle" share no word, and without a thesaurus full-text search can't relate them, while their meanings are close.
        fr: |
          Une recherche vectorielle compare les vecteurs stockés à un vecteur de la requête : chaque requête hybride a donc besoin d'un appel d'incorporation, que la recherche en texte intégral seule ne fait jamais. Les codes et termes exacts sont le point fort de la recherche en texte intégral ; les vecteurs comparent le sens, pas des chaînes exactes. « RC car » et « remote-controlled vehicle » n'ont aucun mot en commun, et sans thésaurus la recherche en texte intégral ne peut pas les relier, alors que leurs sens sont proches.
      options:
        s2: { en: "A code such as PX-4471 carries no meaning for the model; the full-text part matches the exact term.", fr: "Un code comme PX-4471 n'a pas de sens pour le modèle ; la partie en texte intégral fait correspondre le terme exact." }
    references:
      - title: Choose an intelligent search approach
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-intelligent-search-with-sql/02-choose-intelligent-search-approach

  # ------------------------------------------------------------------ 9
  - id: dp800-qz-32-09
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam is reviewing the design of a multitenant document store in an Azure SQL database. The store is the following table, which holds 3 million documents; a latest-version DiskANN index with the cosine metric is built on its Embedding column.

        ```sql
        CREATE TABLE dbo.Docs
        (
            DocID     int           NOT NULL PRIMARY KEY,
            TenantID  int           NOT NULL,
            Body      nvarchar(max) NOT NULL,
            Embedding VECTOR(1536)  NULL
        );
        ```

        A legacy reporting application reads dbo.Docs through an older driver that lacks native support for vector data. The architects also plan to copy the table to a reporting server and want to validate every stored embedding.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam examine la conception d'un magasin de documents multilocataire dans une base de données Azure SQL. Le magasin est la table suivante, qui contient 3 millions de documents ; un index DiskANN de dernière version avec la métrique cosinus est construit sur sa colonne Embedding.

        ```sql
        CREATE TABLE dbo.Docs
        (
            DocID     int           NOT NULL PRIMARY KEY,
            TenantID  int           NOT NULL,
            Body      nvarchar(max) NOT NULL,
            Embedding VECTOR(1536)  NULL
        );
        ```

        Une ancienne application de création de rapports lit dbo.Docs par l'intermédiaire d'un pilote plus ancien, sans prise en charge native des données vectorielles. Les architectes prévoient aussi de copier la table vers un serveur de rapports et veulent valider chaque incorporation stockée.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The reporting application receives each Embedding value as a JSON array in a string.", fr: "L'application de création de rapports reçoit chaque valeur Embedding sous forme de tableau JSON dans une chaîne." }
        - id: s2
          text: { en: "If dbo.Docs is published with transactional replication, the subscriber's copy of the table receives the vector index.", fr: "Si dbo.Docs est publiée par réplication transactionnelle, la copie de la table chez l'abonné reçoit l'index vectoriel." }
        - id: s3
          text: { en: "You can add a CHECK constraint that rejects the vectors whose VECTORPROPERTY(Embedding, 'Dimensions') value isn't 1536.", fr: "Vous pouvez ajouter une contrainte CHECK qui rejette les vecteurs dont la valeur VECTORPROPERTY(Embedding, 'Dimensions') n'est pas 1536." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Clients that don't support the updated TDS protocol receive vector data as varchar(max), in the form of a JSON array, which keeps them compatible. Vector indexes aren't replicated to subscribers. A vector column accepts only NULL and NOT NULL constraints: DEFAULT and CHECK constraints aren't supported, and the column type already guarantees 1,536 dimensions.
        fr: |
          Les clients qui ne prennent pas en charge le protocole TDS mis à jour reçoivent les données vectorielles en varchar(max), sous forme de tableau JSON, ce qui préserve leur compatibilité. Les index vectoriels ne sont pas répliqués vers les abonnés. Une colonne vector n'accepte que les contraintes NULL et NOT NULL : les contraintes DEFAULT et CHECK ne sont pas prises en charge, et le type de la colonne garantit déjà 1 536 dimensions.
      options:
        s2: { en: "Vector indexes aren't replicated to subscribers; create the index on the subscriber if it needs approximate searches.", fr: "Les index vectoriels ne sont pas répliqués vers les abonnés ; créez l'index chez l'abonné s'il a besoin de recherches approximatives." }
        s3: { en: "CHECK constraints aren't supported on vector columns; every value of a VECTOR(1536) column has 1,536 dimensions anyway.", fr: "Les contraintes CHECK ne sont pas prises en charge sur les colonnes vector ; toute valeur d'une colonne VECTOR(1536) a de toute façon 1 536 dimensions." }
    references:
      - title: Vector data type
        url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/vector-data-type
      - title: CREATE VECTOR INDEX (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-vector-index-transact-sql

  # ------------------------------------------------------------------ 10
  - id: dp800-qz-32-10
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has an Azure SQL database. The dbo.Clauses table contains 8 million rows. Its Embedding column, of type VECTOR(768), holds vectors produced by an open-source model that doesn't return normalized vectors. Last week, a developer created the following index.

        ```sql
        CREATE VECTOR INDEX vix_Clauses ON dbo.Clauses (Embedding)
        WITH (METRIC = 'euclidean', TYPE = 'DiskANN');
        ```

        The search query is the following.

        ```sql
        SELECT TOP (10) WITH APPROXIMATE c.ClauseID, r.distance
        FROM VECTOR_SEARCH(TABLE = dbo.Clauses AS c, COLUMN = Embedding,
                           SIMILAR_TO = @qv, METRIC = 'cosine') AS r
        ORDER BY r.distance;
        ```

        The query raises a warning and is as slow as before the index existed. The results must stay ranked by cosine distance, and a small loss of accuracy is acceptable.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'une base de données Azure SQL. La table dbo.Clauses contient 8 millions de lignes. Sa colonne Embedding, de type VECTOR(768), contient des vecteurs produits par un modèle open source qui ne retourne pas de vecteurs normalisés. La semaine dernière, un développeur a créé l'index suivant.

        ```sql
        CREATE VECTOR INDEX vix_Clauses ON dbo.Clauses (Embedding)
        WITH (METRIC = 'euclidean', TYPE = 'DiskANN');
        ```

        La requête de recherche est la suivante.

        ```sql
        SELECT TOP (10) WITH APPROXIMATE c.ClauseID, r.distance
        FROM VECTOR_SEARCH(TABLE = dbo.Clauses AS c, COLUMN = Embedding,
                           SIMILAR_TO = @qv, METRIC = 'cosine') AS r
        ORDER BY r.distance;
        ```

        La requête déclenche un avertissement et reste aussi lente qu'avant la création de l'index. Les résultats doivent rester classés par distance cosinus, et une légère perte de précision est acceptable.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change METRIC in the query to 'euclidean' so that it matches the metric of vix_Clauses.", fr: "Remplacer METRIC dans la requête par 'euclidean' pour qu'il corresponde à la métrique de vix_Clauses." } }
        - { id: b, text: { en: "Add the FORCE_ANN_ONLY table hint to VECTOR_SEARCH so that the query must read vix_Clauses.", fr: "Ajouter l'indicateur de table FORCE_ANN_ONLY à VECTOR_SEARCH pour que la requête doive lire vix_Clauses." } }
        - { id: c, text: { en: "Replace vix_Clauses with a vector index on Embedding that uses METRIC = 'cosine'.", fr: "Remplacer vix_Clauses par un index vectoriel sur Embedding qui utilise METRIC = 'cosine'." } }
        - { id: d, text: { en: "Rewrite the query with VECTOR_DISTANCE('cosine', @qv, c.Embedding), TOP (10) and ORDER BY.", fr: "Réécrire la requête avec VECTOR_DISTANCE('cosine', @qv, c.Embedding), TOP (10) et ORDER BY." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          VECTOR_SEARCH uses an ANN index only if an index on the same column has the same metric; otherwise it raises a warning and runs an exact kNN scan, which explains the latency. An index has one metric, so a cosine index is needed to run an approximate search ranked by cosine distance.
        fr: |
          VECTOR_SEARCH n'utilise un index ANN que si un index sur la même colonne a la même métrique ; sinon, il déclenche un avertissement et exécute une analyse kNN exacte, ce qui explique la latence. Un index n'a qu'une métrique : un index cosinus est donc nécessaire pour exécuter une recherche approximative classée par distance cosinus.
      options:
        a: { en: "The query would use the index, but for vectors that aren't normalized, euclidean distance can rank the rows differently from cosine distance.", fr: "La requête utiliserait l'index, mais pour des vecteurs non normalisés, la distance euclidienne peut classer les lignes différemment de la distance cosinus." }
        b: { en: "The hint only forbids the kNN fallback; it can't make a euclidean index serve a cosine search.", fr: "L'indicateur interdit seulement le repli sur kNN ; il ne peut pas faire servir un index euclidien à une recherche cosinus." }
        d: { en: "VECTOR_DISTANCE always computes exact distances and never uses a vector index, so the query stays slow.", fr: "VECTOR_DISTANCE calcule toujours des distances exactes et n'utilise jamais d'index vectoriel : la requête reste donc lente." }
    references:
      - title: VECTOR_SEARCH (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
      - title: VECTOR_DISTANCE (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
