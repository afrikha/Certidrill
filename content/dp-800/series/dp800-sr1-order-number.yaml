id: dp800-sr1-order-number
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has an Azure SQL Database named **SalesDb**. You are creating two new tables named **Sales.WebOrder** and **Sales.StoreOrder** for the orders taken on the website and in the stores.

    In both tables, the primary key is a column named **OrderNo** of type `int`. The existing application inserts orders by running `INSERT` statements that do not list the OrderNo column, and these statements must not be changed.

    You need to ensure that SalesDb assigns the order numbers. The solution must meet the following requirements:

    - The same order number must never be used in both tables.
    - The first order number must be 500000.
    - Gaps in the numbering are acceptable.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'une base de données Azure SQL Database nommée **SalesDb**. Vous créez deux nouvelles tables nommées **Sales.WebOrder** et **Sales.StoreOrder** pour les commandes passées sur le site web et en magasin.

    Dans les deux tables, la clé primaire est une colonne nommée **OrderNo** de type `int`. L'application existante insère les commandes en exécutant des instructions `INSERT` qui ne mentionnent pas la colonne OrderNo, et ces instructions ne doivent pas être modifiées.

    Vous devez faire en sorte que SalesDb attribue les numéros de commande. La solution doit répondre aux exigences suivantes :

    - Un même numéro de commande ne doit jamais être utilisé dans les deux tables.
    - Le premier numéro de commande doit être 500000.
    - Les écarts dans la numérotation sont acceptables.
