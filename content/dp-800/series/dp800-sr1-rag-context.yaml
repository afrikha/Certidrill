id: dp800-sr1-rag-context
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has an Azure SQL Database that contains the following table:

    ```sql
    CREATE TABLE dbo.Product
    (
        ProductID         int            NOT NULL PRIMARY KEY,
        Name              nvarchar(100)  NOT NULL,
        ListPrice         decimal(10,2)  NOT NULL,
        Description       nvarchar(max)  NOT NULL,
        DescriptionVector vector(1536)   NOT NULL
    );
    ```

    Many descriptions contain double quotation marks and line breaks.

    You are writing a stored procedure that sends product data to a language model. The procedure has a variable named **@qv** of type `vector(1536)` that contains the embedding of the user question, and a variable named **@context** of type `nvarchar(max)`.

    You need to set @context to a valid JSON array that contains one object for each of the five products closest to @qv by cosine distance, from the closest to the farthest. Each object must have exactly the properties **name**, **price** and **description**.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'une base de données Azure SQL Database qui contient la table suivante :

    ```sql
    CREATE TABLE dbo.Product
    (
        ProductID         int            NOT NULL PRIMARY KEY,
        Name              nvarchar(100)  NOT NULL,
        ListPrice         decimal(10,2)  NOT NULL,
        Description       nvarchar(max)  NOT NULL,
        DescriptionVector vector(1536)   NOT NULL
    );
    ```

    De nombreuses descriptions contiennent des guillemets doubles et des sauts de ligne.

    Vous écrivez une procédure stockée qui envoie des données de produits à un modèle de langage. La procédure dispose d'une variable nommée **@qv** de type `vector(1536)` qui contient l'embedding de la question de l'utilisateur, et d'une variable nommée **@context** de type `nvarchar(max)`.

    Vous devez affecter à @context un tableau JSON valide qui contient un objet pour chacun des cinq produits les plus proches de @qv selon la distance cosinus, du plus proche au plus éloigné. Chaque objet doit avoir exactement les propriétés **name**, **price** et **description**.
