id: dp800-sr2-place-order-errors
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has an Azure SQL database. You are writing a stored procedure named **Sales.usp_PlaceOrder** that inserts one row into the Sales.Orders table and several rows into the Sales.OrderLines table.

    The ordering application calls the procedure outside any transaction. When a call fails, the application reads the error number to decide what to show the user. For example, error 547 means that a product referenced by an order line doesn't exist.

    You need to implement error handling in the procedure. The solution must meet the following requirements:

    - If a statement of the procedure fails with a run-time error, such as a constraint violation, none of the inserted rows must remain in the database.
    - The application must receive the original error number and message of the failure.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'une base de données Azure SQL. Vous écrivez une procédure stockée nommée **Sales.usp_PlaceOrder** qui insère une ligne dans la table Sales.Orders et plusieurs lignes dans la table Sales.OrderLines.

    L'application de commande appelle la procédure en dehors de toute transaction. Quand un appel échoue, l'application lit le numéro d'erreur pour décider de ce qu'elle affiche à l'utilisateur. Par exemple, l'erreur 547 signifie qu'un produit référencé par une ligne de commande n'existe pas.

    Vous devez implémenter la gestion des erreurs dans la procédure. La solution doit satisfaire les exigences suivantes :

    - Si une instruction de la procédure échoue avec une erreur d'exécution, comme une violation de contrainte, aucune des lignes insérées ne doit rester dans la base de données.
    - L'application doit recevoir le numéro et le message d'erreur d'origine de l'échec.
