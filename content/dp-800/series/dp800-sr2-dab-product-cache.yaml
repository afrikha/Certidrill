id: dp800-sr2-dab-product-cache
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys runs a single instance of Data API builder (DAB) in front of an Azure SQL database. The configuration file exposes two entities on the REST endpoint: **Product**, mapped to the dbo.Products table, and **Order**, mapped to the dbo.Orders table. The file currently contains no `cache` property, and no distributed cache is available.

    The product catalog changes a few times a day, and the product page is the most requested page of the website.

    You need to ensure that REST read requests for Product are answered from the in-memory cache of DAB for 30 seconds. Requests for Order must always read current data from the database.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys exécute une seule instance du générateur d'API de données (DAB) devant une base de données Azure SQL. Le fichier de configuration expose deux entités sur le point de terminaison REST : **Product**, mappée à la table dbo.Products, et **Order**, mappée à la table dbo.Orders. Le fichier ne contient actuellement aucune propriété `cache`, et aucun cache distribué n'est disponible.

    Le catalogue de produits change quelques fois par jour, et la page produit est la page la plus demandée du site web.

    Vous devez vous assurer que les requêtes de lecture REST sur Product sont servies depuis le cache en mémoire de DAB pendant 30 secondes. Les requêtes sur Order doivent toujours lire les données actuelles de la base de données.
