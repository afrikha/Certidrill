id: dp800-sr2-article-similarity
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has an Azure SQL database that contains the following table. The table contains 30,000 rows. No vector index exists on the ContentVector column.

    ```sql
    CREATE TABLE dbo.Articles (
        ArticleID int NOT NULL PRIMARY KEY,
        Title nvarchar(200) NOT NULL,
        ContentVector vector(1536) NOT NULL
    );
    ```

    A variable named **@qv** of type `vector(1536)` contains the embedding of a user question, generated by the same model as ContentVector.

    You need to write a query that returns the five articles most similar to @qv by cosine distance, most similar first. The result must be exact: the distance must be computed for every row of the table.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'une base de données Azure SQL qui contient la table suivante. La table contient 30 000 lignes. Aucun index vectoriel n'existe sur la colonne ContentVector.

    ```sql
    CREATE TABLE dbo.Articles (
        ArticleID int NOT NULL PRIMARY KEY,
        Title nvarchar(200) NOT NULL,
        ContentVector vector(1536) NOT NULL
    );
    ```

    Une variable nommée **@qv** de type `vector(1536)` contient l'incorporation (embedding) d'une question d'utilisateur, générée par le même modèle que ContentVector.

    Vous devez écrire une requête qui retourne les cinq articles les plus similaires à @qv selon la distance cosinus, le plus similaire en premier. Le résultat doit être exact : la distance doit être calculée pour chaque ligne de la table.
