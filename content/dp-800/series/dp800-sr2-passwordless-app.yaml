id: dp800-sr2-passwordless-app
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation has an ASP.NET Core web app named **adatum-orders** that runs in Azure App Service. The app connects to an Azure SQL database named **OrdersDb** by using SQL authentication. The user name and the password are stored in the connection string of the app settings. A Microsoft Entra admin is configured on the logical server that hosts OrdersDb.

    The app reads and writes data in all the tables of OrdersDb. It never changes the schema.

    You need to change how the app connects to OrdersDb. The solution must meet the following requirements:

    - No password, key or other secret used to connect to OrdersDb must be stored in the app settings, in the code or in Azure Key Vault.
    - The identity of the app must have only the database permissions that it needs.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation dispose d'une application web ASP.NET Core nommée **adatum-orders** qui s'exécute dans Azure App Service. L'application se connecte à une base de données Azure SQL nommée **OrdersDb** à l'aide de l'authentification SQL. Le nom d'utilisateur et le mot de passe sont stockés dans la chaîne de connexion des paramètres de l'application. Un administrateur Microsoft Entra est configuré sur le serveur logique qui héberge OrdersDb.

    L'application lit et écrit des données dans toutes les tables d'OrdersDb. Elle ne modifie jamais le schéma.

    Vous devez modifier la façon dont l'application se connecte à OrdersDb. La solution doit satisfaire les exigences suivantes :

    - Aucun mot de passe, aucune clé ni aucun autre secret utilisé pour se connecter à OrdersDb ne doit être stocké dans les paramètres de l'application, dans le code ou dans Azure Key Vault.
    - L'identité de l'application ne doit disposer que des autorisations de base de données dont elle a besoin.
