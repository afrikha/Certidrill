id: dp800-sr2-salary-history
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have an Azure SQL database that contains the following tables.

    ```sql
    CREATE TABLE HR.Employees (
        EmployeeID int NOT NULL PRIMARY KEY,
        FullName nvarchar(100) NOT NULL,
        Salary decimal(10, 2) NOT NULL
    );

    CREATE TABLE HR.SalaryHistory (
        EmployeeID int NOT NULL,
        OldSalary decimal(10, 2) NOT NULL,
        NewSalary decimal(10, 2) NOT NULL,
        ChangedAt datetime2 NOT NULL DEFAULT SYSUTCDATETIME()
    );
    ```

    The HR application updates salaries one employee at a time. Once a year, a script runs a single `UPDATE` statement that raises the salary of several thousand employees.

    You need to ensure that every salary change in HR.Employees is stored in HR.SalaryHistory with the old and the new value, one row per employee whose salary changes. The updates must still be applied to HR.Employees, and the solution must not require any change to the application or to the script.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'une base de données Azure SQL qui contient les tables suivantes.

    ```sql
    CREATE TABLE HR.Employees (
        EmployeeID int NOT NULL PRIMARY KEY,
        FullName nvarchar(100) NOT NULL,
        Salary decimal(10, 2) NOT NULL
    );

    CREATE TABLE HR.SalaryHistory (
        EmployeeID int NOT NULL,
        OldSalary decimal(10, 2) NOT NULL,
        NewSalary decimal(10, 2) NOT NULL,
        ChangedAt datetime2 NOT NULL DEFAULT SYSUTCDATETIME()
    );
    ```

    L'application RH met à jour les salaires un employé à la fois. Une fois par an, un script exécute une seule instruction `UPDATE` qui augmente le salaire de plusieurs milliers d'employés.

    Vous devez vous assurer que chaque modification de salaire dans HR.Employees est enregistrée dans HR.SalaryHistory avec l'ancienne et la nouvelle valeur, une ligne par employé dont le salaire change. Les mises à jour doivent toujours être appliquées à HR.Employees, et la solution ne doit nécessiter aucune modification de l'application ni du script.
