id: dp800-sr1-indexed-search
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware has an Azure SQL Database that contains a table named **dbo.ProductEmbeddings**. The table has 8 million rows and the following columns: **ProductID** (`int`, primary key) and **Embedding** (`vector(1536)`).

    You create a vector index by running the following statement. The index uses the latest vector index version.

    ```sql
    CREATE VECTOR INDEX vix_ProductEmbeddings_Embedding
    ON dbo.ProductEmbeddings (Embedding)
    WITH (METRIC = 'cosine', TYPE = 'DiskANN');
    ```

    A stored procedure receives a variable named **@q** of type `vector(1536)` that contains the embedding of a search phrase, generated by the same model as the stored embeddings.

    You need to write the query that returns the ProductID and the distance of the 10 products most similar to @q. The solution must meet the following requirements:

    - The query must use the vector index.
    - Approximate results are acceptable.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware dispose d'une base de données Azure SQL Database qui contient une table nommée **dbo.ProductEmbeddings**. La table contient 8 millions de lignes et les colonnes suivantes : **ProductID** (`int`, clé primaire) et **Embedding** (`vector(1536)`).

    Vous créez un index vectoriel en exécutant l'instruction suivante. L'index utilise la dernière version d'index vectoriel.

    ```sql
    CREATE VECTOR INDEX vix_ProductEmbeddings_Embedding
    ON dbo.ProductEmbeddings (Embedding)
    WITH (METRIC = 'cosine', TYPE = 'DiskANN');
    ```

    Une procédure stockée reçoit une variable nommée **@q** de type `vector(1536)` qui contient l'embedding d'une expression de recherche, généré par le même modèle que les embeddings stockés.

    Vous devez écrire la requête qui renvoie la valeur de ProductID et la distance des 10 produits les plus similaires à @q. La solution doit répondre aux exigences suivantes :

    - La requête doit utiliser l'index vectoriel.
    - Des résultats approximatifs sont acceptables.
