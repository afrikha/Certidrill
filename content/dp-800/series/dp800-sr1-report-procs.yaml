id: dp800-sr1-report-procs
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has an Azure SQL Database named **FinanceDb** that contains the following schemas, all owned by **dbo**:

    | Schema | Contents |
    | --- | --- |
    | Sales | Tables of accounts and transactions |
    | Reports | Reporting stored procedures that read the Sales tables by using static Transact-SQL only. New procedures are added every month. |
    | Admin | Maintenance stored procedures |

    FinanceDb contains a database role named **ReportUsers** whose members are the Microsoft Entra users of the analysts.

    You need to configure permissions for ReportUsers. The solution must meet the following requirements:

    - ReportUsers must be able to run every procedure in the Reports schema, including procedures created later.
    - ReportUsers must not be able to query the Sales tables directly or run the Admin procedures.
    - The solution must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'une base de données Azure SQL Database nommée **FinanceDb** qui contient les schémas suivants, tous détenus par **dbo** :

    | Schéma | Contenu |
    | --- | --- |
    | Sales | Tables des comptes et des transactions |
    | Reports | Procédures stockées de rapport qui lisent les tables Sales uniquement au moyen de Transact-SQL statique. De nouvelles procédures sont ajoutées chaque mois. |
    | Admin | Procédures stockées de maintenance |

    FinanceDb contient un rôle de base de données nommé **ReportUsers** dont les membres sont les utilisateurs Microsoft Entra des analystes.

    Vous devez configurer les autorisations de ReportUsers. La solution doit répondre aux exigences suivantes :

    - ReportUsers doit pouvoir exécuter toutes les procédures du schéma Reports, y compris les procédures créées ultérieurement.
    - ReportUsers ne doit pas pouvoir interroger directement les tables Sales ni exécuter les procédures Admin.
    - La solution doit respecter le principe du moindre privilège.
