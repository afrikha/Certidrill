id: dp800-sr1-latest-order
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure SQL Database that contains the following table:

    ```sql
    CREATE TABLE Sales.Orders
    (
        OrderID    int           NOT NULL PRIMARY KEY,
        CustomerID int           NOT NULL,
        OrderDate  date          NOT NULL,
        Amount     decimal(10,2) NOT NULL
    );
    ```

    A customer can place several orders on the same day.

    You need to write a query that returns exactly one row for each customer: the most recent order of the customer. When several orders of a customer share the latest OrderDate, the query must return the order that has the highest OrderID.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'une base de données Azure SQL Database qui contient la table suivante :

    ```sql
    CREATE TABLE Sales.Orders
    (
        OrderID    int           NOT NULL PRIMARY KEY,
        CustomerID int           NOT NULL,
        OrderDate  date          NOT NULL,
        Amount     decimal(10,2) NOT NULL
    );
    ```

    Un client peut passer plusieurs commandes le même jour.

    Vous devez écrire une requête qui renvoie exactement une ligne par client : la commande la plus récente du client. Lorsque plusieurs commandes d'un client partagent la dernière valeur d'OrderDate, la requête doit renvoyer la commande dont la valeur d'OrderID est la plus élevée.
