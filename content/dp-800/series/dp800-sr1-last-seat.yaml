id: dp800-sr1-last-seat
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso Events has a SQL Server 2025 database named **TicketDb**. The READ_COMMITTED_SNAPSHOT and ALLOW_SNAPSHOT_ISOLATION database options are OFF, and the booking application uses the default READ COMMITTED isolation level. The application reserves seats by calling the following stored procedure:

    ```sql
    CREATE PROCEDURE dbo.usp_ReserveSeat @EventID int, @CustomerID int
    AS
    BEGIN
        SET NOCOUNT ON;
        DECLARE @Available int;
        BEGIN TRANSACTION;
            SELECT @Available = SeatsAvailable
            FROM dbo.EventInventory
            WHERE EventID = @EventID;

            IF @Available > 0
            BEGIN
                UPDATE dbo.EventInventory
                SET SeatsAvailable = @Available - 1
                WHERE EventID = @EventID;

                INSERT INTO dbo.Reservation (EventID, CustomerID)
                VALUES (@EventID, @CustomerID);
            END;
        COMMIT TRANSACTION;
    END;
    ```

    EventID is the primary key of dbo.EventInventory. When one seat remains and two customers book at the same time, both calls sometimes succeed, and the event is overbooked.

    You need to ensure that an event can never have more reservations than seats. You can modify the database and the procedure, but not the booking application.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso Events dispose d'une base de données SQL Server 2025 nommée **TicketDb**. Les options de base de données READ_COMMITTED_SNAPSHOT et ALLOW_SNAPSHOT_ISOLATION sont à OFF, et l'application de réservation utilise le niveau d'isolation par défaut READ COMMITTED. L'application réserve les places en appelant la procédure stockée suivante :

    ```sql
    CREATE PROCEDURE dbo.usp_ReserveSeat @EventID int, @CustomerID int
    AS
    BEGIN
        SET NOCOUNT ON;
        DECLARE @Available int;
        BEGIN TRANSACTION;
            SELECT @Available = SeatsAvailable
            FROM dbo.EventInventory
            WHERE EventID = @EventID;

            IF @Available > 0
            BEGIN
                UPDATE dbo.EventInventory
                SET SeatsAvailable = @Available - 1
                WHERE EventID = @EventID;

                INSERT INTO dbo.Reservation (EventID, CustomerID)
                VALUES (@EventID, @CustomerID);
            END;
        COMMIT TRANSACTION;
    END;
    ```

    EventID est la clé primaire de dbo.EventInventory. Lorsqu'il reste une place et que deux clients réservent en même temps, les deux appels réussissent parfois, et l'événement est surréservé.

    Vous devez faire en sorte qu'un événement ne puisse jamais avoir plus de réservations que de places. Vous pouvez modifier la base de données et la procédure, mais pas l'application de réservation.
