# DP-800 objectives — official study guide, skills measured as of 2026-03-12 (en-us and fr-fr pages, checked on 2026-11-16).
# `code` is the stable key referenced by question files and course sections.
# French is the wording of the fr-fr study guide (partly machine-translated by Microsoft), with straight apostrophes.
# The fr-fr page already shows an "October 19, 2026" version: French of 1.4.2, 3.1.3 and 3.2.5 was aligned
# on the English bullets of the en-us page (Microsoft Copilot in Fabric, CES, ENN).
develop:
- group:
    en: Design and implement database objects
    fr: Concevoir et implémenter des objets de base de données
  objectives:
  - code: 1.1.1
    en: Design and implement tables, including data types, size, columns, indexes, and column store indexes
    fr: Concevoir et implémenter des tables, notamment les types de données, la taille, les colonnes, les index et les index columnstore
  - code: 1.1.2
    en: Design and implement specialized tables, including in-memory, temporal, external, ledger, and graph
    fr: Concevoir et implémenter des tables spécialisées, notamment en mémoire, temporelle, externe, registre et graphique
  - code: 1.1.3
    en: Design and implement JSON columns and indexes
    fr: Concevoir et implémenter des colonnes et des index JSON
  - code: 1.1.4
    en: Design and implement database constraints, including PRIMARY KEY, FOREIGN KEY, UNIQUE, CHECK, and DEFAULT
    fr: Concevoir et implémenter des contraintes de base de données, notamment PRIMARY KEY, FOREIGN KEY, UNIQUE, CHECK et DEFAULT
  - code: 1.1.5
    en: Design and implement SEQUENCES
    fr: Concevoir et implémenter SEQUENCES
  - code: 1.1.6
    en: Design and implement partitioning for tables and indexes
    fr: Concevoir et implémenter le partitionnement pour les tables et les index
- group:
    en: Implement programmability objects
    fr: Implémenter des objets de programmabilité
  objectives:
  - code: 1.2.1
    en: Create views
    fr: Créer des vues
  - code: 1.2.2
    en: Create scalar functions
    fr: Créer des fonctions scalaires
  - code: 1.2.3
    en: Create table-valued functions
    fr: Créer des fonctions valorisées en table
  - code: 1.2.4
    en: Create stored procedures
    fr: Créer des procédures stockées
  - code: 1.2.5
    en: Create triggers
    fr: Créer des déclencheurs
- group:
    en: Write advanced T-SQL code
    fr: Écrire du code T-SQL avancé
  objectives:
  - code: 1.3.1
    en: Write common table expressions (CTEs)
    fr: Écrire des expressions de table courantes (CTEs)
  - code: 1.3.2
    en: Write queries that include window functions
    fr: Écrire des requêtes qui incluent des fonctions de fenêtre
  - code: 1.3.3
    en: Write queries that include JSON functions, such as JSON_OBJECT, JSON_ARRAY, JSON_ARRAYAGG, JSON_CONTAINS, OPENJSON, and JSON_VALUE
    fr: Écrire des requêtes qui incluent des fonctions JSON, telles que JSON_OBJECT, JSON_ARRAY, JSON_ARRAYAGG, JSON_CONTAINS, OPENJSON et JSON_VALUE
  - code: 1.3.4
    en: Write queries that include regular expressions, such as REGEXP_LIKE, REGEXP_REPLACE, REGEXP_SUBSTR, REGEXP_INSTR, REGEXP_COUNT, REGEXP_MATCHES, and REGEXP_SPLIT_TO_TABLE
    fr: Écrire des requêtes qui incluent des expressions régulières, telles que REGEXP_LIKE, REGEXP_REPLACE, REGEXP_SUBSTR, REGEXP_INSTR, REGEXP_COUNT, REGEXP_MATCHES et REGEXP_SPLIT_TO_TABLE
  - code: 1.3.5
    en: Write queries that include fuzzy string matching functions, such as EDIT_DISTANCE, EDIT_DISTANCE_SIMILARITY, and JARO_WINKLER_DISTANCE
    fr: Écrire des requêtes qui incluent des fonctions de correspondance de chaîne floues, telles que EDIT_DISTANCE, EDIT_DISTANCE_SIMILARITY et JARO_WINKLER_DISTANCE
  - code: 1.3.6
    en: Write graph queries that use the MATCH operator
    fr: Écrire des requêtes de graphe qui utilisent l'opérateur MATCH
  - code: 1.3.7
    en: Write correlated queries
    fr: Écrire des requêtes corrélées
  - code: 1.3.8
    en: Implement error handling
    fr: Implémenter la gestion des erreurs
- group:
    en: Design and implement SQL solutions by using AI-assisted tools
    fr: Concevoir et implémenter des solutions SQL à l'aide d'outils assistés par IA
  objectives:
  - code: 1.4.1
    en: Interpret security impact of using AI-assisted tools
    fr: Interpréter l'impact de la sécurité sur l'utilisation d'outils assistés par l'IA
  - code: 1.4.2
    en: Enable GitHub Copilot and Microsoft Copilot in Fabric
    fr: Activer GitHub Copilot et Microsoft Copilot dans Fabric
  - code: 1.4.3
    en: Configure model and Model Context Protocol (MCP) tool options in a GitHub Copilot or Copilot in Fabric chat session
    fr: Configurer les options du modèle et de l'outil Model Context Protocol (MCP) lors d'une session de discussion avec GitHub Copilot ou Copilot sur Fabric
  - code: 1.4.4
    en: Create and configure GitHub Copilot instruction files
    fr: Créer et configurer des fichiers d'instructions GitHub Copilot
  - code: 1.4.5
    en: Connect to MCP server endpoints, including Microsoft SQL Server and Fabric lakehouse
    fr: Se connecter aux points de terminaison de serveur MCP, notamment Microsoft SQL Server et Fabric lakehouse
secure-deploy:
- group:
    en: Implement data security and compliance
    fr: Implémenter la sécurité et la conformité des données
  objectives:
  - code: 2.1.1
    en: Design and implement data encryption, including Always Encrypted and column-level encryption
    fr: Concevoir et implémenter le chiffrement des données, y compris le chiffrement au niveau des colonnes et Always Encrypted
  - code: 2.1.2
    en: Design and implement Dynamic Data Masking
    fr: Concevoir et implémenter le masquage des données dynamiques
  - code: 2.1.3
    en: Design and implement Row-Level Security (RLS)
    fr: Concevoir et mettre en œuvre Row-Level Security (RLS)
  - code: 2.1.4
    en: Design and implement object-level permissions
    fr: Concevoir et implémenter des autorisations au niveau de l'objet
  - code: 2.1.5
    en: Implement secure database access, including passwordless
    fr: Implémenter l'accès sécurisé à la base de données, y compris sans mot de passe
  - code: 2.1.6
    en: Implement auditing
    fr: Implémenter l'audit
  - code: 2.1.7
    en: Secure model endpoints, including Managed Identity
    fr: Points de terminaison de modèle sécurisés, y compris l'identité managée
  - code: 2.1.8
    en: Secure GraphQL, REST, and MCP endpoints
    fr: Sécuriser les points de terminaison GraphQL, REST et MCP
- group:
    en: Optimize database performance
    fr: Optimiser les performances de la base de données
  objectives:
  - code: 2.2.1
    en: Recommend database configurations
    fr: Recommander des configurations de base de données
  - code: 2.2.2
    en: Preserve data integrity and consistency by using transaction isolation levels and concurrency controls
    fr: Préserver l'intégrité et la cohérence des données à l'aide des niveaux d'isolation des transactions et des contrôles d'accès concurrentiel
  - code: 2.2.3
    en: Evaluate query performance by using query execution plans, dynamic management views (DMVs), Query Store, and Query Performance Insight
    fr: Évaluer les performances des requêtes à l'aide de plans d'exécution de requête, de vues de gestion dynamique (DMV), du Magasin des requêtes et d'Insights sur les performances des requêtes
  - code: 2.2.4
    en: Identify and resolve query performance issues, including blocking and deadlocks
    fr: Identifier et résoudre les problèmes de performances des requêtes, notamment les verrouillages et les blocages
- group:
    en: Implement CI/CD by using SQL Database Projects
    fr: Implémenter CI/CD à l'aide de projets SQL Database
  objectives:
  - code: 2.3.1
    en: Design and implement a testing strategy, including unit tests and integration tests
    fr: Concevoir et implémenter une stratégie de test, y compris des tests unitaires et des tests d'intégration
  - code: 2.3.2
    en: Create and manage reference/static data in source control
    fr: Créer et gérer des données de référence/statiques dans le contrôle de code source
  - code: 2.3.3
    en: Create, build, and validate database models by using SQL Database Projects, including SDK-style models
    fr: Créer, générer et valider des modèles de base de données à l'aide de projets SQL Database, y compris des modèles de style SDK
  - code: 2.3.4
    en: Configure source control for SQL Database Projects
    fr: Configurer le contrôle de code source pour les projets SQL Database
  - code: 2.3.5
    en: Manage branching, pull requests, and conflict resolution
    fr: Gestion des branches, des pull requests et de la résolution des conflits
  - code: 2.3.6
    en: Implement secrets management
    fr: Implémenter la gestion des secrets
  - code: 2.3.7
    en: Detect schema drift by using SQL Database Projects
    fr: Détecter la dérive de schéma à l'aide de projets SQL Database
  - code: 2.3.8
    en: Update an SQL database project and deploy changes
    fr: Mettre à jour un projet de base de données SQL et déployer des modifications
  - code: 2.3.9
    en: Design and implement controls for deployment pipelines, including branching policies, triggers in approvals, authentication tables, and code owners
    fr: Concevoir et implémenter des contrôles pour les pipelines de déploiement, notamment les stratégies de branchement, les déclencheurs dans les approbations, les tables d'authentification et les propriétaires de code
- group:
    en: Integrate SQL solutions with Azure services
    fr: Intégrer des solutions SQL aux services Azure
  objectives:
  - code: 2.4.1
    en: Create configuration files for Data API builder (DAB)
    fr: Créer des fichiers de configuration pour le générateur d'API de données (DAB)
  - code: 2.4.2
    en: Configure entities for REST and GraphQL, including data caching, pagination, searching, and filtering
    fr: Configurer des entités pour REST et GraphQL, notamment la mise en cache des données, la pagination, la recherche et le filtrage
  - code: 2.4.3
    en: Configure REST or GraphQL endpoints
    fr: Configurer des points de terminaison REST ou GraphQL
  - code: 2.4.4
    en: Expose database objects, stored procedures, and views, including GraphQL relationships
    fr: Exposer des objets de base de données, des procédures stockées et des vues, y compris les relations GraphQL
  - code: 2.4.5
    en: Configure and implement DAB deployment
    fr: Configurer et implémenter le déploiement DAB
  - code: 2.4.6
    en: Recommend Azure Monitor configurations, including Application Insights and Log Analytics
    fr: Recommander des configurations Azure Monitor, notamment Application Insights et Log Analytics
  - code: 2.4.7
    en: Handle changes by using change event streaming (CES), change data capture (CDC), Change Tracking, Azure Functions with SQL trigger binding, or Azure Logic Apps
    fr: Gérer les modifications à l'aide du streaming d'événements de modification (CES), de la capture de données modifiées (CDC), du suivi des modifications, d'Azure Functions avec une liaison de déclencheur SQL ou d'Azure Logic Apps
ai:
- group:
    en: Design and implement models and embeddings
    fr: Concevoir et implémenter des modèles et des incorporations
  objectives:
  - code: 3.1.1
    en: Evaluate external models, including multimodal, multilanguage, sizes, and structured output
    fr: Évaluer des modèles externes, notamment multimodal, multilingue, les tailles et la sortie structurée
  - code: 3.1.2
    en: Create and manage external models
    fr: Créer et gérer des modèles externes
  - code: 3.1.3
    en: Choose an embedding maintenance method, including table triggers, Change Tracking, Azure Functions with SQL trigger binding, Azure Logic Apps, CDC, CES, and Microsoft Foundry
    fr: Choisissez une méthode de maintenance des embeddings, notamment les déclencheurs sur les tables, le suivi des modifications, Azure Functions avec liaison de déclencheur SQL, Azure Logic Apps, CDC, CES et Microsoft Foundry
  - code: 3.1.4
    en: Identify which columns to include in embeddings
    fr: Identifier les colonnes à inclure dans les incorporations
  - code: 3.1.5
    en: Design and implement chunks for embeddings
    fr: Concevoir et implémenter des blocs pour les incorporations
  - code: 3.1.6
    en: Generate embeddings
    fr: Générer des embeddings
- group:
    en: Design and implement intelligent search
    fr: Concevoir et implémenter une recherche intelligente
  objectives:
  - code: 3.2.1
    en: Choose from full-text, semantic vector, and hybrid search
    fr: Choisir parmi le texte intégral, le vecteur sémantique et la recherche hybride
  - code: 3.2.2
    en: Implement full-text search
    fr: Implémenter la recherche en texte intégral
  - code: 3.2.3
    en: Design for vector data, including vector data type, vector indexes, and size
    fr: Conception pour les données vectorielles, y compris le type de données vectorielles, les index vectoriels et la taille
  - code: 3.2.4
    en: Identify when to use vector-related types and functions for semantic searching, including VECTOR_NORMALIZE, VECTOR_DISTANCE, VECTORPROPERTY, and VECTOR_SEARCH
    fr: Identifiez quand utiliser des types et fonctions liés aux vecteurs pour la recherche sémantique, notamment VECTOR_NORMALIZE, VECTOR_DISTANCE, VECTORPROPERTY et VECTOR_SEARCH
  - code: 3.2.5
    en: Choose between using ANN and ENN for vector search
    fr: Choisir entre l'utilisation d'ANN et d'ENN pour la recherche vectorielle
  - code: 3.2.6
    en: Evaluate vector index types and metrics
    fr: Évaluer les types et métriques d'index vectoriels
  - code: 3.2.7
    en: Implement vector search
    fr: Implémenter la recherche vectorielle
  - code: 3.2.8
    en: Implement hybrid search
    fr: Implémenter la recherche hybride
  - code: 3.2.9
    en: Implement reciprocal rank fusion (RRF)
    fr: Implémenter la fusion de classement réciproque (RRF)
  - code: 3.2.10
    en: Evaluate performance of vector and hybrid search
    fr: Évaluer les performances de la recherche vectorielle et hybride
- group:
    en: Design and implement retrieval-augmented generation (RAG)
    fr: Concevoir et implémenter la génération augmentée par récupération (RAG)
  objectives:
  - code: 3.3.1
    en: Identify use cases for RAG
    fr: Identifier les cas d'usage pour RAG
  - code: 3.3.2
    en: Create a prompt by using the sp_invoke_external_rest_endpoint stored procedure
    fr: Créez une requête au moyen de la procédure stockée sp_invoke_external_rest_endpoint
  - code: 3.3.3
    en: Convert structured data to JSON for language model processing
    fr: Convertir des données structurées en JSON pour le traitement du modèle de langage
  - code: 3.3.4
    en: Send results to language model
    fr: Envoyer des résultats au modèle de langage
  - code: 3.3.5
    en: Extract language model responses
    fr: Extraire les réponses du modèle de langage
