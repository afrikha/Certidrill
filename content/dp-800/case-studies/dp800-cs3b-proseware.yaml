id: dp800-cs3b-proseware
status: draft
title:
  en: "Proseware, Inc."
  fr: "Proseware, Inc."
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Proseware, Inc. publishes online professional training courses for 900,000 learners in Europe. Its learning platform runs on Microsoft Fabric. The developers are adding a quiz leaderboard, protecting learners' contact details and preparing lesson transcripts for a course assistant that answers learners' questions.
      fr: |
        Proseware, Inc. publie des formations professionnelles en ligne pour 900 000 apprenants en Europe. Sa plateforme d'apprentissage s'exécute sur Microsoft Fabric. Les développeurs ajoutent un classement des quiz, protègent les coordonnées des apprenants et préparent les transcriptions des leçons pour un assistant de cours qui répond aux questions des apprenants.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Fabric tenant**

        | Capacity | SKU | Region | Workspace |
        | --- | --- | --- | --- |
        | cap-prod | F64 | Germany West Central | WS-Learning |
        | cap-trial | Fabric trial | Germany West Central | WS-Sandbox |

        In the admin portal, the tenant setting **Users can use Copilot and other features powered by Azure OpenAI** is enabled for a security group named **SG-Developers**. No other Copilot or Azure OpenAI tenant setting is enabled, and the settings aren't delegated to capacity administrators.

        **WS-Learning**

        - A SQL database in Fabric named **LearnDb** contains the following tables:
          - dbo.Learners: LearnerId, FullName, Email (nvarchar(256)), Phone (varchar(20)), Country
          - dbo.QuizAttempts: AttemptId, LearnerId, QuizId, Score (int), AttemptedAt (datetime2)
          - dbo.Lessons: LessonId, CourseId, Title, Transcript (nvarchar(max))
        - LearnDb contains the database roles **SupportAgents** and **CourseAuditors**, and an external model named **LessonEmbeddings**.
        - A lakehouse named **LH-Engagement** contains the clickstream data of the platform: video views, lesson completions and quiz starts.
        - A Fabric data agent named **DA-Engagement** uses LH-Engagement as its data source and has been published.

        **Development**

        The members of SG-Developers write T-SQL in the SQL query editor of the Fabric portal. The product analysts use GitHub Copilot Chat in Agent mode in Visual Studio Code.
      fr: |
        **Locataire Fabric**

        | Capacité | Référence SKU | Région | Espace de travail |
        | --- | --- | --- | --- |
        | cap-prod | F64 | Germany West Central | WS-Learning |
        | cap-trial | Version d'évaluation de Fabric | Germany West Central | WS-Sandbox |

        Dans le portail d'administration, le paramètre de locataire **Users can use Copilot and other features powered by Azure OpenAI** est activé pour un groupe de sécurité nommé **SG-Developers**. Aucun autre paramètre de locataire Copilot ou Azure OpenAI n'est activé, et les paramètres ne sont pas délégués aux administrateurs de capacité.

        **WS-Learning**

        - Une base de données SQL dans Fabric nommée **LearnDb** contient les tables suivantes :
          - dbo.Learners : LearnerId, FullName, Email (nvarchar(256)), Phone (varchar(20)), Country
          - dbo.QuizAttempts : AttemptId, LearnerId, QuizId, Score (int), AttemptedAt (datetime2)
          - dbo.Lessons : LessonId, CourseId, Title, Transcript (nvarchar(max))
        - LearnDb contient les rôles de base de données **SupportAgents** et **CourseAuditors**, et un modèle externe nommé **LessonEmbeddings**.
        - Un lakehouse nommé **LH-Engagement** contient les données de parcours de navigation de la plateforme : vues de vidéos, leçons terminées et quiz commencés.
        - Un agent de données Fabric nommé **DA-Engagement** utilise LH-Engagement comme source de données et a été publié.

        **Développement**

        Les membres de SG-Developers écrivent du T-SQL dans l'éditeur de requête SQL du portail Fabric. Les analystes produit utilisent GitHub Copilot Chat en mode Agent dans Visual Studio Code.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **AI-assisted development**

        1. The members of SG-Developers must be able to use Copilot in the SQL query editor for LearnDb.
        2. Before approving Copilot, the compliance team must know which information about LearnDb Copilot can use when it answers a developer.
        3. The product analysts must be able to ask questions about the data in LH-Engagement from GitHub Copilot Chat in Visual Studio Code, through DA-Engagement.

        **Data protection**

        4. Members of SupportAgents must see only the first letter of an email address, followed by XXX@XXXX.com, and only the last four digits of a phone number, preceded by XXX-XXX-.
        5. Members of CourseAuditors must see the real phone numbers, but masked email addresses.

        **Leaderboard**

        6. For each quiz, the leaderboard lists every learner's best score with:
           - Position: learners with the same best score share a position, and the next position follows without a gap (1, 1, 2).
           - GapToPrevious: the difference between the best score of the learner just above and the learner's best score; 0 for the first position.
           - LowestScore: the lowest best score of the quiz.

        **Course assistant**

        7. Transcripts must be split into chunks of 1,000 characters, and consecutive chunks must overlap by 150 characters.
        8. The chunks must be stored in dbo.LessonChunks (LessonId, ChunkNo, ChunkText, Embedding), where ChunkNo is 1 for the first chunk of each lesson, 2 for the next one, and so on.
      fr: |
        **Développement assisté par IA**

        1. Les membres de SG-Developers doivent pouvoir utiliser Copilot dans l'éditeur de requête SQL pour LearnDb.
        2. Avant d'approuver Copilot, l'équipe de conformité doit savoir quelles informations sur LearnDb Copilot peut utiliser quand il répond à un développeur.
        3. Les analystes produit doivent pouvoir poser des questions sur les données de LH-Engagement depuis GitHub Copilot Chat dans Visual Studio Code, par l'intermédiaire de DA-Engagement.

        **Protection des données**

        4. Les membres de SupportAgents ne doivent voir que la première lettre d'une adresse e-mail, suivie de XXX@XXXX.com, et que les quatre derniers chiffres d'un numéro de téléphone, précédés de XXX-XXX-.
        5. Les membres de CourseAuditors doivent voir les vrais numéros de téléphone, mais des adresses e-mail masquées.

        **Classement**

        6. Pour chaque quiz, le classement liste le meilleur score de chaque apprenant avec :
           - Position : les apprenants qui ont le même meilleur score partagent une position, et la position suivante suit sans trou (1, 1, 2).
           - GapToPrevious : la différence entre le meilleur score de l'apprenant situé juste au-dessus et le meilleur score de l'apprenant ; 0 pour la première position.
           - LowestScore : le plus bas des meilleurs scores du quiz.

        **Assistant de cours**

        7. Les transcriptions doivent être découpées en blocs de 1 000 caractères, et des blocs consécutifs doivent se chevaucher de 150 caractères.
        8. Les blocs doivent être stockés dans dbo.LessonChunks (LessonId, ChunkNo, ChunkText, Embedding), où ChunkNo vaut 1 pour le premier bloc de chaque leçon, 2 pour le suivant, et ainsi de suite.
