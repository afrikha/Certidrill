id: dp800-cs3a-blue-yonder-airlines
status: draft
title:
  en: "Blue Yonder Airlines"
  fr: "Blue Yonder Airlines"
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Blue Yonder Airlines is a regional airline that operates 62 aircraft. Its maintenance and engineering department tracks the components installed on each aircraft, the flight legs flown and the defects reported by crews. The developers are building a maintenance API for the technicians' tablets and a search for similar defects.
      fr: |
        Blue Yonder Airlines est une compagnie aérienne régionale qui exploite 62 appareils. Son service de maintenance et d'ingénierie suit les composants installés sur chaque appareil, les étapes de vol effectuées et les défauts signalés par les équipages. Les développeurs créent une API de maintenance pour les tablettes des techniciens et une recherche de défauts similaires.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Database**

        An Azure SQL database named **MaintDb** uses the default database settings and compatibility level 170. It contains the following objects.

        | Object | Description |
        | --- | --- |
        | Fleet.Aircraft | Node table: TailNumber, Model |
        | Fleet.Component | Node table: SerialNumber, PartName |
        | Fleet.InstalledIn | Edge table. Each edge goes from a component to the aircraft in which the component is or was installed. Columns: InstallDate, RemovalDate (NULL while the component is installed) |
        | dbo.FlightLegs | 180 million rows, partitioned by month on FlightDate by the partition function PF_FlightMonth (RANGE RIGHT) and the partition scheme PS_FlightMonth. Partition 1 contains the oldest month. The clustered index is aligned. The nonclustered index IX_FlightLegs_Tail was created ON [PRIMARY]. No foreign key references dbo.FlightLegs |
        | Maint.WorkOrder | Work orders that technicians update during their shift |
        | Maint.DefectReports | DefectId, TailNumber, DefectText (nvarchar(2000)), DefectVector (vector(1536)) |

        DefectVector is generated by an external model named **DefectEmbeddings** that points to an Azure OpenAI deployment of text-embedding-3-small. A vector index named **vix_DefectVector** was created on DefectVector with the cosine metric. The search for similar defects currently runs the following query.

        ```sql
        SELECT TOP (20) d.DefectId, d.DefectText,
               VECTOR_DISTANCE('cosine', @q, d.DefectVector) AS distance
        FROM Maint.DefectReports AS d
        ORDER BY distance;
        ```

        **Nightly import**

        A .NET job named **PartsImport** runs every night. It calls the stored procedure Maint.usp_ImportPartsUsage, which starts a transaction and updates many rows of Maint.WorkOrder. The job uses a command timeout of 30 seconds. When a call fails, its error handler logs the exception and returns the connection to the connection pool.

        On some mornings, technicians' updates to Maint.WorkOrder wait until they time out. When this happens, the head of the blocking chain is a PartsImport session whose status is **sleeping** and whose open_transaction_count is **1**.

        **Maintenance API**

        - The maintenance API will be a Data API builder (DAB) instance in an Azure container app named **ca-maint-api**. No DAB configuration file exists yet.
        - The container app has an environment variable named **MAINT_DB_CONN** that contains a connection string with `Authentication=Active Directory Managed Identity`, and an environment variable named **APPLICATIONINSIGHTS_CONNECTION_STRING** for an Application Insights resource named **appi-maint**.
        - A Microsoft Entra app registration named **byair-maint-api** has the application ID URI `api://byair-maint-api`.
      fr: |
        **Base de données**

        Une base de données Azure SQL nommée **MaintDb** utilise les paramètres de base de données par défaut et le niveau de compatibilité 170. Elle contient les objets suivants.

        | Objet | Description |
        | --- | --- |
        | Fleet.Aircraft | Table de nœuds : TailNumber, Model |
        | Fleet.Component | Table de nœuds : SerialNumber, PartName |
        | Fleet.InstalledIn | Table d'arêtes. Chaque arête va d'un composant vers l'appareil sur lequel le composant est ou a été installé. Colonnes : InstallDate, RemovalDate (NULL tant que le composant est installé) |
        | dbo.FlightLegs | 180 millions de lignes, partitionnée par mois sur FlightDate par la fonction de partition PF_FlightMonth (RANGE RIGHT) et le schéma de partition PS_FlightMonth. La partition 1 contient le mois le plus ancien. L'index cluster est aligné. L'index non cluster IX_FlightLegs_Tail a été créé ON [PRIMARY]. Aucune clé étrangère ne référence dbo.FlightLegs |
        | Maint.WorkOrder | Ordres de travail que les techniciens mettent à jour pendant leur service |
        | Maint.DefectReports | DefectId, TailNumber, DefectText (nvarchar(2000)), DefectVector (vector(1536)) |

        DefectVector est généré par un modèle externe nommé **DefectEmbeddings** qui pointe vers un déploiement Azure OpenAI de text-embedding-3-small. Un index vectoriel nommé **vix_DefectVector** a été créé sur DefectVector avec la métrique cosine. La recherche de défauts similaires exécute actuellement la requête suivante.

        ```sql
        SELECT TOP (20) d.DefectId, d.DefectText,
               VECTOR_DISTANCE('cosine', @q, d.DefectVector) AS distance
        FROM Maint.DefectReports AS d
        ORDER BY distance;
        ```

        **Importation nocturne**

        Un travail .NET nommé **PartsImport** s'exécute chaque nuit. Il appelle la procédure stockée Maint.usp_ImportPartsUsage, qui démarre une transaction et met à jour de nombreuses lignes de Maint.WorkOrder. Le travail utilise un délai d'expiration de commande de 30 secondes. Quand un appel échoue, son gestionnaire d'erreurs journalise l'exception et rend la connexion au pool de connexions.

        Certains matins, les mises à jour de Maint.WorkOrder par les techniciens attendent jusqu'à expiration. Dans ce cas, la session en tête de la chaîne de blocage est une session PartsImport dont l'état est **sleeping** et dont open_transaction_count vaut **1**.

        **API de maintenance**

        - L'API de maintenance sera une instance Data API builder (DAB) dans une application conteneur Azure nommée **ca-maint-api**. Aucun fichier de configuration DAB n'existe encore.
        - L'application conteneur dispose d'une variable d'environnement nommée **MAINT_DB_CONN** qui contient une chaîne de connexion avec `Authentication=Active Directory Managed Identity`, et d'une variable d'environnement nommée **APPLICATIONINSIGHTS_CONNECTION_STRING** pour une ressource Application Insights nommée **appi-maint**.
        - Une inscription d'application Microsoft Entra nommée **byair-maint-api** a l'URI d'ID d'application `api://byair-maint-api`.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Fleet requirements**

        1. The engineering application must list every component that is currently installed in the same aircraft as a given component. The list includes the given component itself.
        2. Every month, the flight legs of the oldest month must be deleted. The deletion must be a partition-level operation with minimal transaction logging, and no other table can be created for it.

        **Maintenance API requirements**

        3. The DAB configuration file must be created by using the DAB CLI. The connection string must be read from MAINT_DB_CONN at run time and must never be written to the configuration file.
        4. The API must validate Microsoft Entra access tokens issued for byair-maint-api.
        5. Maint.WorkOrder must be exposed as an entity named WorkOrder that the role technician can read and update.
        6. The operations team must be able to identify the API requests that are slow and, for each slow request, the SQL queries that it ran.

        **Operations requirements**

        7. The morning blocking of the technicians' updates must be prevented.
      fr: |
        **Exigences de la flotte**

        1. L'application d'ingénierie doit lister chaque composant actuellement installé sur le même appareil qu'un composant donné. La liste inclut le composant donné lui-même.
        2. Chaque mois, les étapes de vol du mois le plus ancien doivent être supprimées. La suppression doit être une opération au niveau de la partition avec une journalisation minimale, et aucune autre table ne peut être créée pour cela.

        **Exigences de l'API de maintenance**

        3. Le fichier de configuration DAB doit être créé à l'aide de l'interface CLI de DAB. La chaîne de connexion doit être lue dans MAINT_DB_CONN à l'exécution et ne doit jamais être écrite dans le fichier de configuration.
        4. L'API doit valider les jetons d'accès Microsoft Entra émis pour byair-maint-api.
        5. Maint.WorkOrder doit être exposée sous la forme d'une entité nommée WorkOrder que le rôle technician peut lire et mettre à jour.
        6. L'équipe d'exploitation doit pouvoir identifier les requêtes d'API lentes et, pour chaque requête lente, les requêtes SQL qu'elle a exécutées.

        **Exigences d'exploitation**

        7. Le blocage matinal des mises à jour des techniciens doit être évité.
