# AZ-140 objectives — official study guide, skills measured as of 2026-07-20 (en-us and fr-fr pages).
# `code` is the stable key referenced by question files and course sections.
# French titles are those of the fr-fr study guide (straight apostrophes, no final period).
infrastructure:
- group:
    en: Plan, implement, and manage networking for Azure Virtual Desktop
    fr: Planifier, implémenter et gérer le réseau pour Azure Virtual Desktop
  objectives:
  - code: 1.1.1
    en: Assess network capacity and speed requirements for Azure Virtual Desktop
    fr: Évaluer la capacité et la vitesse du réseau pour Azure Virtual Desktop
  - code: 1.1.2
    en: Design network configuration for session hosts to meet requirements for Azure Virtual Desktop
    fr: Concevoir une configuration réseau pour les hôtes de session afin de répondre aux conditions requises d'Azure Virtual Desktop
  - code: 1.1.3
    en: Plan and implement Remote Desktop Protocol (RDP) Shortpath, RDP Multipath, and quality of service (QoS) policies
    fr: Planifier et implémenter des stratégies RDP (Bureau à distance Protocol) Shortpath, RDP Multipath et qualité de service (QoS)
  - code: 1.1.4
    en: Plan and implement an Azure Private Link solution for Azure Virtual Desktop
    fr: Planifier et implémenter une solution Azure Private Link pour Azure Virtual Desktop
  - code: 1.1.5
    en: Monitor and troubleshoot network connectivity
    fr: Superviser et résoudre les problèmes de connectivité réseau
- group:
    en: Plan and implement storage for Azure Virtual Desktop user data
    fr: Planifier et implémenter le stockage pour les données utilisateur Azure Virtual Desktop
  objectives:
  - code: 1.2.1
    en: Plan storage for Azure Virtual Desktop user data
    fr: Planifier le stockage pour les données utilisateur Azure Virtual Desktop
  - code: 1.2.2
    en: Implement storage for FSLogix components
    fr: Implémenter le stockage pour les composants FSLogix
  - code: 1.2.3
    en: Implement storage accounts for Azure Virtual Desktop
    fr: Implémenter les comptes de stockage pour Azure Virtual Desktop
  - code: 1.2.4
    en: Implement file shares for Azure Virtual Desktop
    fr: Implémenter des partages de fichiers pour Azure Virtual Desktop
  - code: 1.2.5
    en: Implement Azure NetApp Files for Azure Virtual Desktop
    fr: Implémenter Azure NetApp Files pour Azure Virtual Desktop
- group:
    en: Plan host pools and session hosts
    fr: Planifier des pools d'hôtes et des hôtes de session
  objectives:
  - code: 1.3.1
    en: Recommend resource groups, subscriptions, and management groups for Azure Virtual Desktop resources
    fr: Recommander des groupes de ressources, des abonnements et des groupes d'administration pour des ressources Azure Virtual Desktop
  - code: 1.3.2
    en: Recommend an operating system (OS) for Azure Virtual Desktop session hosts
    fr: Recommander un système d'exploitation pour des hôtes de session Azure Virtual Desktop
  - code: 1.3.3
    en: Recommend an appropriate licensing model for Azure Virtual Desktop based on requirements
    fr: Recommander un modèle de licence approprié pour Azure Virtual Desktop en fonction des exigences
  - code: 1.3.4
    en: Plan a host pool architecture
    fr: Planifier une architecture du pool d'hôtes
  - code: 1.3.5
    en: Design an Azure Virtual Desktop configuration for performance requirements
    fr: Concevoir une configuration d'Azure Virtual Desktop pour les exigences de performances
  - code: 1.3.6
    en: Design an Azure Virtual Desktop configuration for Azure Virtual Machines capacity requirements
    fr: Concevoir une configuration Azure Virtual Desktop pour les exigences de capacité des machines virtuelles Azure
- group:
    en: Implement host pools and session hosts
    fr: Implémenter des pools d'hôtes et des hôtes de session
  objectives:
  - code: 1.4.1
    en: Create host pools and session hosts by using the Azure portal
    fr: Créer des pools d'hôtes et des hôtes de session à l'aide du portail Azure
  - code: 1.4.2
    en: Automate creation of Azure Virtual Desktop hosts and host pools by using PowerShell, Azure CLI, Azure Resource Manager templates (ARM templates), and Bicep files
    fr: Automatiser la création d'hôtes et de pools d'hôtes Azure Virtual Desktop à l'aide de PowerShell, d'Azure CLI, de modèles Azure Resource Manager (modèles ARM) et de fichiers Bicep
  - code: 1.4.3
    en: Configure host pool and session host settings
    fr: Configurer les paramètres de pool d'hôtes et d'hôte de session
  - code: 1.4.4
    en: Configure licensing for session hosts, including user eligibility for Windows client access and RDS Client Access License (CAL) requirements for Windows Server
    fr: Configurez la licence des hôtes de session, y compris l'éligibilité des utilisateurs pour l'accès client Windows et les exigences de licence d'accès client RDS (CAL) pour Windows Server
- group:
    en: Create and manage session host images
    fr: Créer et gérer des images d'hôte de session
  objectives:
  - code: 1.5.1
    en: Create an image manually
    fr: Créer une image manuellement
  - code: 1.5.2
    en: Create an image by using Azure VM Image Builder
    fr: Créer une image à l'aide du Générateur d'images de machine virtuelle Azure
  - code: 1.5.3
    en: Modify an image
    fr: Modifier une image
  - code: 1.5.4
    en: Plan and implement lifecycle management for images
    fr: Planifier et implémenter la gestion de cycle de vie pour des images
  - code: 1.5.5
    en: Apply OS and application updates to an image
    fr: Appliquer des mises à jour du système d'exploitation et des applications à une image
  - code: 1.5.6
    en: Create a session host by using a custom image
    fr: Créer un hôte de la session à l'aide d'une image personnalisée
  - code: 1.5.7
    en: Plan and implement image storage, including Azure Compute Gallery
    fr: Planifier et implémenter le stockage d'images, notamment Azure Compute Gallery
identity-security:
- group:
    en: Plan and implement identity integration
    fr: Planifier et implémenter l'intégration des identités
  objectives:
  - code: 2.1.1
    en: Select an identity scenario for Azure Virtual Desktop, including Active Directory Domain Services (AD DS), Microsoft Entra ID, and Microsoft Entra Domain Services
    fr: Sélectionner un scénario d'identité pour Azure Virtual Desktop, dont services de domaine Active Directory (AD DS), Microsoft Entra Domain Services et Microsoft Entra ID
  - code: 2.1.2
    en: Specify requirements to configure the Azure Virtual Desktop session host for an identity scenario
    fr: Spécifier les conditions requises pour configurer l'hôte de session Azure Virtual Desktop pour un scénario d'identité
  - code: 2.1.3
    en: Plan and implement Azure role-based access control (Azure RBAC) for Azure Virtual Desktop
    fr: Planifier et implémenter le contrôle d'accès en fonction du rôle Azure (Azure RBAC) pour Azure Virtual Desktop
  - code: 2.1.4
    en: Plan and implement Microsoft Entra Conditional Access policies for connections to Azure Virtual Desktop
    fr: Planifier et implémenter des stratégies d'accès conditionnel Microsoft Entra pour les connexions à Azure Virtual Desktop
  - code: 2.1.5
    en: Plan and implement authentication options in Azure Virtual Desktop, including passwordless, smart card, and multifactor authentication
    fr: Planifier et implémenter des options d'authentification dans Azure Virtual Desktop, notamment l'authentification sans mot de passe, à carte à puce et l'authentification multifacteur
  - code: 2.1.6
    en: Manage roles, groups, and rights assignments on Azure Virtual Desktop session hosts
    fr: Gérer les rôles, les groupes et l'attribution de droits sur les hôtes de session Azure Virtual Desktop
  - code: 2.1.7
    en: Configure Microsoft Entra single sign-on
    fr: Configurer l'authentification unique Microsoft Entra
- group:
    en: Plan and implement security
    fr: Planifier et implémenter la sécurité
  objectives:
  - code: 2.2.1
    en: Plan, implement, and manage security for Azure Virtual Desktop session hosts by using Microsoft Defender for Cloud
    fr: Planifier, implémenter et gérer la sécurité pour les hôtes de session Azure Virtual Desktop à l'aide de Microsoft Defender pour le cloud
  - code: 2.2.2
    en: Configure session host protection by using Microsoft Defender Antivirus
    fr: Configurer la protection de l'hôte de session à l'aide de Microsoft Defender Antivirus
  - code: 2.2.3
    en: Configure session host protection by using Microsoft Defender for Endpoint, including onboarding and scanning options
    fr: Configurer une protection de l'hôte de la session à l'aide de Microsoft Defender for Endpoint, notamment les options d'intégration et d'analyse
  - code: 2.2.4
    en: Implement and manage network security for connections to Azure Virtual Desktop, including user defined routes (UDRs), network security groups (NSGs), and Azure Firewall
    fr: Implémenter et gérer la sécurité réseau pour les connexions à Azure Virtual Desktop, notamment les itinéraires définis par l'utilisateur (UDR), les groupes de sécurité réseau (NSG) et le Pare-feu Azure
  - code: 2.2.5
    en: Configure Azure Bastion or just-in-time (JIT) VM access for administrative access to session hosts
    fr: Configurer Azure Bastion ou l'accès JIT (just-in-time) aux machines virtuelles pour l'accès administratif aux hôtes de session
  - code: 2.2.6
    en: Plan and implement Windows threat protection features on Azure Virtual Desktop session hosts, including App Control for Business and Controlled Folder Access
    fr: Planifier et mettre en œuvre les fonctionnalités de protection contre les menaces de Windows sur les hôtes de session Azure Virtual Desktop, notamment App Control for Business et l'accès contrôlé aux dossiers
  - code: 2.2.7
    en: Plan for and implement Azure confidential VMs and Trusted Launch security features for Azure Virtual Desktop session hosts
    fr: Planifier et mettre en œuvre des machines virtuelles confidentielles Azure et des fonctionnalités de sécurité de lancement sécurisé pour les hôtes de session Azure Virtual Desktop
user-apps:
- group:
    en: Plan and implement FSLogix
    fr: Planifier et implémenter FSLogix
  objectives:
  - code: 3.1.1
    en: Recommend FSLogix configuration
    fr: Recommander la configuration de FSLogix
  - code: 3.1.2
    en: Configure FSLogix Profile Containers
    fr: Configurer des conteneurs de profils FSLogix
  - code: 3.1.3
    en: Configure FSLogix ODFC containers
    fr: Configurer les conteneurs ODFC de FSLogix
  - code: 3.1.4
    en: Configure FSLogix Cloud Cache
    fr: Configurer FSLogix Cloud Cache
  - code: 3.1.5
    en: Implement FSLogix application masking
    fr: Implémenter le masquage d'application FSLogix
- group:
    en: Plan and implement user experience and client settings
    fr: Planifier et implémenter les paramètres d'expérience utilisateur et du client
  objectives:
  - code: 3.2.1
    en: Choose an Azure Virtual Desktop client
    fr: Choisir un client Azure Virtual Desktop
  - code: 3.2.2
    en: Choose a deployment method for the client
    fr: Choisir une méthode de déploiement pour le client
  - code: 3.2.3
    en: Deploy and troubleshoot Azure Virtual Desktop clients
    fr: Déployer et résoudre les problèmes liés aux clients Azure Virtual Desktop
  - code: 3.2.4
    en: Configure device redirection
    fr: Configurer la redirection des appareils
  - code: 3.2.5
    en: Configure multimedia redirection
    fr: Configurer la redirection multimédia
  - code: 3.2.6
    en: Configure printing and Universal Print
    fr: Configurer l'impression et l'impression universelle
  - code: 3.2.7
    en: Configure user settings through Microsoft Intune policies or Group Policy
    fr: Configurer les paramètres utilisateur au moyen de stratégies ou d'une stratégie de groupe Microsoft Intune
  - code: 3.2.8
    en: Configure Remote Desktop Protocol (RDP) properties on a host pool
    fr: Configurer les propriétés RDP (Bureau à distance Protocol) sur un pool d'hôtes
  - code: 3.2.9
    en: Configure session timeout properties
    fr: Configurer les propriétés du délai d'expiration de session
  - code: 3.2.10
    en: Implement the Start VM on Connect feature
    fr: Implémenter la fonctionnalité Démarrer la machine virtuelle sur Connect
  - code: 3.2.11
    en: Assign and unassign personal desktops to users
    fr: Attribuer et annuler l'attribution de bureaux personnels aux utilisateurs
- group:
    en: Install and configure apps on a session host
    fr: Installer et configurer les applications sur un hôte de session
  objectives:
  - code: 3.3.1
    en: Choose a method for deploying an app to Azure Virtual Desktop
    fr: Choisir une méthode pour déployer une application sur Azure Virtual Desktop
  - code: 3.3.2
    en: Create and configure an application group
    fr: Créer et configurer un groupe d'applications
  - code: 3.3.3
    en: Assign users to application groups
    fr: Affecter des utilisateurs à des groupes d'applications
  - code: 3.3.4
    en: Publish an application as a RemoteApp
    fr: Publier une application en tant que RemoteApp
  - code: 3.3.5
    en: Implement and manage Microsoft 365 Apps on Azure Virtual Desktop session hosts
    fr: Implémenter et gérer des Microsoft 365 Apps sur des hôtes de session Azure Virtual Desktop
  - code: 3.3.6
    en: Implement and manage OneDrive, including multisession environments
    fr: Implémenter et gérer OneDrive, y compris les environnements multisession
  - code: 3.3.7
    en: Implement and manage Microsoft Teams, including the Remote Desktop WebRTC Redirector Service
    fr: Implémenter et gérer Microsoft Teams, y compris le service redirecteur WebRTC Bureau à distance
  - code: 3.3.8
    en: Implement and manage browsers for Azure Virtual Desktop sessions
    fr: Implémenter et gérer les navigateurs pour Azure Virtual Desktop
  - code: 3.3.9
    en: Configure dynamic application delivery by using App attach
    fr: Configurer la distribution dynamique d'applications à l'aide d'App attach
  - code: 3.3.10
    en: Create an application package for App attach
    fr: Créer un package d'application pour App attach
monitoring:
- group:
    en: Monitor and manage Azure Virtual Desktop services
    fr: Superviser et gérer les services Azure Virtual Desktop
  objectives:
  - code: 4.1.1
    en: Configure log collection and analysis for Azure Virtual Desktop session hosts
    fr: Configurer la collecte et l'analyse des journaux pour les hôtes de session Azure Virtual Desktop
  - code: 4.1.2
    en: Monitor Azure Virtual Desktop by using Azure Monitor
    fr: Superviser Azure Virtual Desktop à l'aide d'Azure Monitor
  - code: 4.1.3
    en: Customize Azure Monitor workbooks for Azure Virtual Desktop Insights
    fr: Personnaliser les workbooks Azure Monitor pour Azure Virtual Desktop Insights
  - code: 4.1.4
    en: Optimize session host capacity and performance
    fr: Optimiser la capacité et les performances des hôtes de session
  - code: 4.1.5
    en: Implement autoscaling in host pools
    fr: Implémenter la mise à l'échelle automatique dans les pools d'hôtes
  - code: 4.1.6
    en: Monitor and manage active sessions and application groups
    fr: Superviser et gérer les sessions actives et les groupes d'applications
- group:
    en: Plan and implement updates, backups, and disaster recovery
    fr: Planifier et implémenter des mises à jour, des sauvegardes et une récupération d'urgence
  objectives:
  - code: 4.2.1
    en: Recommend an update strategy for session hosts
    fr: Recommander une stratégie de mise à jour pour les hôtes de session
  - code: 4.2.2
    en: Plan and implement a disaster recovery plan for Azure Virtual Desktop
    fr: Planifier et implémenter un plan de reprise d'activité après sinistre pour Azure Virtual Desktop
  - code: 4.2.3
    en: Plan for multi-region implementation
    fr: Planifier l'implémentation multirégion
  - code: 4.2.4
    en: Design and implement a backup strategy for Azure Virtual Desktop
    fr: Concevoir et implémenter une stratégie de sauvegarde pour Azure Virtual Desktop
  - code: 4.2.5
    en: Configure backup and restore for FSLogix user profiles, personal desktops, and images
    fr: Configurer la sauvegarde et la restauration pour les profils utilisateur FSLogix, les bureaux personnels et les images
