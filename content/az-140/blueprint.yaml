# Real exam: 100 minutes ("You will have 100 minutes to complete this assessment", certification page),
# passing score 700/1000, "may have interactive components". Microsoft does not publish the number of
# questions nor the formats; the simulator draws 45 to 58 questions, one case study and one Yes/No series.
