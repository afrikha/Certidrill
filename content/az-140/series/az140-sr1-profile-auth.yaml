id: az140-sr1-profile-auth
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has an on-premises Active Directory Domain Services (AD DS) domain that is synchronized to Microsoft Entra ID by using Microsoft Entra Connect Sync. All the users are hybrid identities.

    Litware has a pooled Azure Virtual Desktop host pool named **HP1**. The session hosts of HP1 run Windows 11 Enterprise multi-session, are **Microsoft Entra joined** and are connected to a virtual network named **VNet1**. VNet1 has no connectivity to the on-premises network.

    FSLogix profile containers will be stored in an Azure file share named **profiles** in a storage account named **litwareprof1**. No identity-based access is configured on litwareprof1 yet.

    You need to configure identity-based access to the profiles share so that FSLogix can mount the profile containers by using the identity of each user.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'un domaine local Active Directory Domain Services (AD DS) synchronisé avec Microsoft Entra ID au moyen de Microsoft Entra Connect Sync. Tous les utilisateurs sont des identités hybrides.

    Litware dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP1**. Les hôtes de session de HP1 exécutent Windows 11 Entreprise multisession, sont **joints à Microsoft Entra** et sont connectés à un réseau virtuel nommé **VNet1**. VNet1 n'a aucune connectivité avec le réseau local.

    Les conteneurs de profils FSLogix seront stockés dans un partage de fichiers Azure nommé **profiles**, dans un compte de stockage nommé **litwareprof1**. Aucun accès basé sur l'identité n'est encore configuré sur litwareprof1.

    Vous devez configurer l'accès basé sur l'identité au partage profiles afin que FSLogix puisse monter les conteneurs de profils avec l'identité de chaque utilisateur.
