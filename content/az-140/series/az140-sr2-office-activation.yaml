id: az140-sr2-office-activation
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has a pooled host pool named **Pool3** that has 12 session hosts. The session hosts run Windows 11 Enterprise multi-session, are joined to the Active Directory Domain Services (AD DS) domain fabrikam.com and are in an organizational unit (OU) named **AVD-Pool3**. Users connect to a different session host of Pool3 each day.

    The session hosts are created from a custom image. You install Microsoft 365 Apps on the image VM with the Office Deployment Tool (ODT) by running `setup.exe /configure configuration.xml`, then you generalize and capture the image. Nobody starts a Microsoft 365 app on the image VM before it's captured. Every user is assigned a Microsoft 365 E3 license, which includes Microsoft 365 Apps for enterprise.

    You need to deploy Microsoft 365 Apps to Pool3. The solution must meet the following requirements:

    - Users must be able to create and edit documents on every session host they connect to.
    - Microsoft 365 Apps must not update automatically on the session hosts; updates are delivered with new image versions.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'un pool d'hôtes regroupé nommé **Pool3** qui compte 12 hôtes de session. Les hôtes de session exécutent Windows 11 Entreprise multisession, sont joints au domaine Active Directory Domain Services (AD DS) fabrikam.com et se trouvent dans une unité d'organisation (UO) nommée **AVD-Pool3**. Chaque jour, les utilisateurs se connectent à un hôte de session différent de Pool3.

    Les hôtes de session sont créés à partir d'une image personnalisée. Vous installez Microsoft 365 Apps sur la machine virtuelle de l'image avec l'outil de déploiement d'Office (ODT) en exécutant `setup.exe /configure configuration.xml`, puis vous généralisez et capturez l'image. Personne ne lance d'application Microsoft 365 sur la machine virtuelle de l'image avant sa capture. Chaque utilisateur dispose d'une licence Microsoft 365 E3, qui inclut Microsoft 365 Apps for enterprise.

    Vous devez déployer Microsoft 365 Apps sur Pool3. La solution doit répondre aux exigences suivantes :

    - Les utilisateurs doivent pouvoir créer et modifier des documents sur chaque hôte de session auquel ils se connectent.
    - Microsoft 365 Apps ne doit pas se mettre à jour automatiquement sur les hôtes de session ; les mises à jour sont fournies avec de nouvelles versions de l'image.
