id: az140-sr2-idle-sessions
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a pooled host pool named **Pool2**. The session hosts of Pool2 run Windows 11 Enterprise multi-session, are joined to the Active Directory Domain Services (AD DS) domain tailspin.com and are in an organizational unit (OU) named **AVD-Pool2**. No scaling plan is assigned to Pool2.

    Users often leave their desktop idle for hours or close the Remote Desktop client without signing out, so their sessions keep using resources on the session hosts.

    You need to configure session time limits for Pool2. The solution must meet the following requirements:

    - A session that receives no user input for 30 minutes must be disconnected.
    - A disconnected session must be signed out one hour after it's disconnected.
    - Users who are working in their session must not be disconnected.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un pool d'hôtes regroupé nommé **Pool2**. Les hôtes de session de Pool2 exécutent Windows 11 Entreprise multisession, sont joints au domaine Active Directory Domain Services (AD DS) tailspin.com et se trouvent dans une unité d'organisation (UO) nommée **AVD-Pool2**. Aucun plan de mise à l'échelle n'est attribué à Pool2.

    Les utilisateurs laissent souvent leur bureau inactif pendant des heures ou ferment le client Bureau à distance sans fermer leur session : leurs sessions continuent d'utiliser des ressources sur les hôtes de session.

    Vous devez configurer les limites de temps de session pour Pool2. La solution doit répondre aux exigences suivantes :

    - Une session qui ne reçoit aucune action de l'utilisateur pendant 30 minutes doit être déconnectée.
    - Une session déconnectée doit être fermée une heure après sa déconnexion.
    - Les utilisateurs qui travaillent dans leur session ne doivent pas être déconnectés.
