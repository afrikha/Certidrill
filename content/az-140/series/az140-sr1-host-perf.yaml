id: az140-sr1-host-perf
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has a pooled Azure Virtual Desktop host pool named **HP-Ops** that contains 120 session hosts. The diagnostic settings of HP-Ops and of its workspace already send all the log categories to a Log Analytics workspace named **LAW-AVD**.

    The operations team uses Azure Virtual Desktop Insights. The Host Performance and Host Diagnostics reports show no data for the session hosts.

    You need to collect the processor, memory and User Input Delay per Session performance counters and the Windows event logs of the session hosts in LAW-AVD so that the reports display data.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Ops** qui contient 120 hôtes de session. Les paramètres de diagnostic de HP-Ops et de son espace de travail envoient déjà toutes les catégories de journaux à un espace de travail Log Analytics nommé **LAW-AVD**.

    L'équipe d'exploitation utilise Azure Virtual Desktop Insights. Les rapports Host Performance et Host Diagnostics n'affichent aucune donnée pour les hôtes de session.

    Vous devez collecter dans LAW-AVD les compteurs de performances du processeur, de la mémoire et User Input Delay per Session ainsi que les journaux d'événements Windows des hôtes de session, afin que les rapports affichent des données.
