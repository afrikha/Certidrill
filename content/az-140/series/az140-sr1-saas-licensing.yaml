id: az140-sr1-saas-licensing
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware sells access to its accounting application, Ledger, to small businesses. You plan to publish Ledger as a RemoteApp from a pooled host pool named **HP-Ledger**. The session hosts of HP-Ledger run Windows 11 Enterprise multi-session. HP-Ledger is in an Azure subscription named **Sub-Customers**.

    The employees of the customers will sign in with user accounts that Proseware creates in its own Microsoft Entra tenant. The Proseware employees who support Ledger have Microsoft 365 E3 licenses and connect to a separate host pool in another subscription.

    You need to license the access of the customers' employees to HP-Ledger in a compliant way. The customers must not have to purchase any license.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware vend à de petites entreprises l'accès à son application de comptabilité, Ledger. Vous prévoyez de publier Ledger en tant que RemoteApp à partir d'un pool d'hôtes regroupé nommé **HP-Ledger**. Les hôtes de session de HP-Ledger exécutent Windows 11 Entreprise multisession. HP-Ledger se trouve dans un abonnement Azure nommé **Sub-Customers**.

    Les employés des clients se connecteront avec des comptes d'utilisateur que Proseware crée dans son propre locataire Microsoft Entra. Les employés de Proseware qui assurent le support de Ledger disposent de licences Microsoft 365 E3 et se connectent à un autre pool d'hôtes, dans un autre abonnement.

    Vous devez fournir aux employés des clients des licences conformes pour l'accès à HP-Ledger. Les clients ne doivent acheter aucune licence.
