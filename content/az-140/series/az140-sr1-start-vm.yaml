id: az140-sr1-start-vm
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has a resource group named **RG-Dev** that contains a personal Azure Virtual Desktop host pool named **HP-Dev**, its desktop application group and its 60 session host VMs. HP-Dev uses automatic assignment. Every evening, a runbook deallocates all the session hosts of HP-Dev.

    You need to ensure that when a developer connects to HP-Dev and the assigned session host is deallocated, the session host starts automatically. The solution must follow the principle of least privilege. The developers must not be able to manage the VMs in the Azure portal.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'un groupe de ressources nommé **RG-Dev** qui contient un pool d'hôtes Azure Virtual Desktop personnel nommé **HP-Dev**, son groupe d'applications de bureau et ses 60 machines virtuelles d'hôte de session. HP-Dev utilise l'attribution automatique. Chaque soir, un runbook libère tous les hôtes de session de HP-Dev.

    Vous devez vous assurer que, lorsqu'un développeur se connecte à HP-Dev et que l'hôte de session qui lui est attribué est libéré, cet hôte de session démarre automatiquement. La solution doit respecter le principe du moindre privilège. Les développeurs ne doivent pas pouvoir gérer les machines virtuelles dans le portail Azure.
