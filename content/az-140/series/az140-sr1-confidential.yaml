id: az140-sr1-confidential
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank plans to create a personal Azure Virtual Desktop host pool named **HP-Traders** by using the Azure portal. The session hosts will run Windows 11 Enterprise.

    The security team has the following requirements for the session hosts:

    - The data in memory must be encrypted while it is in use, with keys that are generated by the hardware and can't be read by any software, including the hypervisor and the host operating system.
    - The content of the operating system disk must be accessible only to the session host itself.

    You need to configure the session hosts of HP-Traders to meet the requirements.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank prévoit de créer un pool d'hôtes Azure Virtual Desktop personnel nommé **HP-Traders** à l'aide du portail Azure. Les hôtes de session exécuteront Windows 11 Entreprise.

    L'équipe de sécurité a les exigences suivantes pour les hôtes de session :

    - Les données en mémoire doivent être chiffrées pendant leur utilisation, avec des clés générées par le matériel et qu'aucun logiciel ne peut lire, y compris l'hyperviseur et le système d'exploitation de l'hôte.
    - Le contenu du disque du système d'exploitation doit être accessible uniquement à l'hôte de session lui-même.

    Vous devez configurer les hôtes de session de HP-Traders pour répondre aux exigences.
