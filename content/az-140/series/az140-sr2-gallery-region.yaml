id: az140-sr2-gallery-region
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation has an Azure Compute Gallery named **galAvd** in the East US region. galAvd contains an image definition named **win11-m365** that has an image version named **1.4.0**. Version 1.4.0 has a single target region, East US, with three replicas.

    Adatum is deploying a production pooled host pool named **Pool-NE** in the North Europe region. During a scheduled deployment, 80 session hosts of Pool-NE will be created at the same time in North Europe.

    You need to prepare the deployment. The solution must meet the following requirements:

    - The session hosts must be created from image version 1.4.0 of galAvd.
    - The number of image replicas must follow Microsoft's recommendations for concurrent deployments.
    - Administrative effort must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation dispose d'une galerie Azure Compute Gallery nommée **galAvd** dans la région East US. galAvd contient une définition d'image nommée **win11-m365** qui comporte une version d'image nommée **1.4.0**. La version 1.4.0 a une seule région cible, East US, avec trois réplicas.

    Adatum déploie un pool d'hôtes regroupé de production nommé **Pool-NE** dans la région North Europe. Lors d'un déploiement planifié, 80 hôtes de session de Pool-NE seront créés en même temps dans North Europe.

    Vous devez préparer le déploiement. La solution doit répondre aux exigences suivantes :

    - Les hôtes de session doivent être créés à partir de la version d'image 1.4.0 de galAvd.
    - Le nombre de réplicas de l'image doit suivre les recommandations de Microsoft pour les déploiements simultanés.
    - L'effort d'administration doit être réduit au minimum.
