id: az140-sr2-host-maintenance
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has a pooled host pool named **Pool4** that contains six session hosts named **SH1** to **SH6**. A pooled scaling plan named **SP1** is assigned to Pool4, with autoscale enabled. The exclusion tag of SP1 is `excludeFromScaling`, and the ramp-down phase of SP1 starts at 17:00.

    At 16:45, you must prepare SH4 for the installation of an application update that requires every user to be signed out of SH4. The users of SH4 usually sign out around 18:00.

    You need to prepare SH4. The solution must meet the following requirements:

    - Users who already have a session on SH4 must be able to keep working until they sign out.
    - No new user session must be placed on SH4 until the update is installed.
    - SH4 must stay running so that you can install the update as soon as the last user signs out.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'un pool d'hôtes regroupé nommé **Pool4** qui contient six hôtes de session nommés **SH1** à **SH6**. Un plan de mise à l'échelle de type regroupé nommé **SP1** est attribué à Pool4, avec la mise à l'échelle automatique activée. L'étiquette d'exclusion de SP1 est `excludeFromScaling`, et la phase de baisse de charge de SP1 commence à 17 h.

    À 16 h 45, vous devez préparer SH4 pour l'installation d'une mise à jour d'application qui exige que tous les utilisateurs aient fermé leur session sur SH4. Les utilisateurs de SH4 ferment généralement leur session vers 18 h.

    Vous devez préparer SH4. La solution doit répondre aux exigences suivantes :

    - Les utilisateurs qui ont déjà une session sur SH4 doivent pouvoir continuer à travailler jusqu'à la fermeture de leur session.
    - Aucune nouvelle session utilisateur ne doit être placée sur SH4 tant que la mise à jour n'est pas installée.
    - SH4 doit rester en cours d'exécution pour que vous puissiez installer la mise à jour dès que le dernier utilisateur a fermé sa session.
