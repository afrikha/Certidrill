id: az140-sr2-bastion-native
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has a virtual network named **vnet-avd** in the West Europe region. A subnet of vnet-avd named **snet-hosts** contains the session hosts of a pooled host pool named **Pool1**. The session hosts have no public IP addresses. vnet-avd has no VPN gateway and no ExpressRoute connection, and its address space has a free range for a /26 subnet.

    Administrators work from Windows 11 workstations connected to the internet. Azure CLI 2.60 is installed on the workstations, and the administrators have the Reader role on the session hosts and their network interfaces.

    You need to provide administrative access to the session hosts. The solution must meet the following requirements:

    - Administrators must open RDP sessions to the session hosts with the Remote Desktop Connection client (mstsc) of their workstations, not in a browser.
    - No public IP address must be assigned to the session hosts.
    - Costs must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un réseau virtuel nommé **vnet-avd** dans la région West Europe. Un sous-réseau de vnet-avd nommé **snet-hosts** contient les hôtes de session d'un pool d'hôtes regroupé nommé **Pool1**. Les hôtes de session n'ont pas d'adresse IP publique. vnet-avd n'a ni passerelle VPN ni connexion ExpressRoute, et son espace d'adressage comporte une plage libre pour un sous-réseau /26.

    Les administrateurs travaillent depuis des stations de travail Windows 11 connectées à Internet. Azure CLI 2.60 est installé sur les stations de travail, et les administrateurs ont le rôle Reader sur les hôtes de session et sur leurs interfaces réseau.

    Vous devez fournir un accès administratif aux hôtes de session. La solution doit répondre aux exigences suivantes :

    - Les administrateurs doivent ouvrir des sessions RDP vers les hôtes de session avec le client Connexion Bureau à distance (mstsc) de leurs stations de travail, et non dans un navigateur.
    - Aucune adresse IP publique ne doit être attribuée aux hôtes de session.
    - Les coûts doivent être réduits au minimum.
