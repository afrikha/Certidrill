id: az140-sr1-mfa-offsite
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso has a Microsoft Entra tenant. All the users have Microsoft Entra ID P1 licenses. Security defaults and legacy per-user MFA are disabled.

    Contoso has a pooled Azure Virtual Desktop host pool named **HP-Sales**. The session hosts are joined to an AD DS domain. Single sign-on isn't configured for HP-Sales. Users connect by using Windows App from the head office and from home. A named location named **HQ-Network** contains the public IP addresses of the head office and is marked as trusted.

    You need to ensure that users must perform Microsoft Entra multifactor authentication (MFA) when they connect to Azure Virtual Desktop from outside HQ-Network. Users must not be prompted for MFA when they connect from HQ-Network.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso dispose d'un locataire Microsoft Entra. Tous les utilisateurs disposent de licences Microsoft Entra ID P1. Les paramètres de sécurité par défaut et l'authentification multifacteur par utilisateur héritée sont désactivés.

    Contoso dispose d'un pool d'hôtes Azure Virtual Desktop regroupé nommé **HP-Sales**. Les hôtes de session sont joints à un domaine AD DS. L'authentification unique n'est pas configurée pour HP-Sales. Les utilisateurs se connectent avec Windows App depuis le siège et depuis leur domicile. Un emplacement nommé **HQ-Network** contient les adresses IP publiques du siège et est marqué comme approuvé.

    Vous devez vous assurer que les utilisateurs doivent effectuer l'authentification multifacteur Microsoft Entra lorsqu'ils se connectent à Azure Virtual Desktop depuis l'extérieur de HQ-Network. Les utilisateurs ne doivent pas recevoir d'invite d'authentification multifacteur lorsqu'ils se connectent depuis HQ-Network.
