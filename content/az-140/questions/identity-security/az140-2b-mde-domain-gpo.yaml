id: az140-2b-mde-domain-gpo
objective: "2.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a pooled Azure Virtual Desktop host pool. The session hosts are joined to an Active Directory Domain Services (AD DS) domain and are created from an unmodified Windows 11 Enterprise multi-session image from Azure Marketplace.

    You extract the Microsoft Defender for Endpoint VDI onboarding package to a read-only share named `\\fs01\mdeonboard$`. The session hosts must be onboarded with a single entry per device.

    You edit a domain Group Policy object linked to the session hosts and go to **Computer Configuration > Preferences > Control Panel Settings > Scheduled Tasks**.

    How should you configure the task? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un pool d'hôtes regroupé Azure Virtual Desktop. Les hôtes de session sont joints à un domaine Active Directory Domain Services (AD DS) et sont créés à partir d'une image Windows 11 Entreprise multisession non modifiée de la Place de marché Azure.

    Vous extrayez le package d'intégration VDI de Microsoft Defender for Endpoint dans un partage en lecture seule nommé `\\fs01\mdeonboard$`. Les hôtes de session doivent être intégrés avec une seule entrée par appareil.

    Vous modifiez un objet de stratégie de groupe de domaine lié aux hôtes de session et accédez à **Computer Configuration > Preferences > Control Panel Settings > Scheduled Tasks**.

    Comment devez-vous configurer la tâche ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Task type: [[task]]

      Run as: [[acct]]

      Action (Start a program): [[prog]]
    fr: |
      Type de tâche : [[task]]

      Exécuter en tant que : [[acct]]

      Action (Démarrer un programme) : [[prog]]
  slots:
    - id: task
      options:
        - { id: immediate, text: "Immediate Task (At least Windows 7)" }
        - { id: daily, text: { en: "Scheduled Task (At least Windows 7) with a daily trigger", fr: "Scheduled Task (At least Windows 7) avec un déclencheur quotidien" } }
        - { id: logon, text: { en: "Scheduled Task (At least Windows 7) with an At log on trigger", fr: "Scheduled Task (At least Windows 7) avec un déclencheur At log on" } }
    - id: acct
      options:
        - { id: system, text: "NT AUTHORITY\\SYSTEM" }
        - { id: user, text: "%LogonDomain%\\%LogonUser%" }
        - { id: localsvc, text: "NT AUTHORITY\\LOCAL SERVICE" }
    - id: prog
      options:
        - { id: ps1, text: "powershell.exe -ExecutionPolicy Bypass -command \"& \\\\fs01\\mdeonboard$\\Onboard-NonPersistentMachine.ps1\"" }
        - { id: cmd, text: "cmd.exe /c \\\\fs01\\mdeonboard$\\WindowsDefenderATPOnboardingScript.cmd" }
        - { id: mpam, text: "\\\\fs01\\mdeonboard$\\mpam-fe.exe /x" }
answer:
  values: { task: immediate, acct: system, prog: ps1 }
explanation:
  correct:
    en: |
      For domain-joined hosts built from an unmodified gallery image, Microsoft's procedure creates an Immediate Task in Group Policy Preferences that runs as NT AUTHORITY\SYSTEM with the highest privileges, whether a user is signed in or not. The task starts PowerShell with an execution policy bypass to run Onboard-NonPersistentMachine.ps1 from the share, which gives a single entry per device.
    fr: |
      Pour des hôtes joints à un domaine créés à partir d'une image non modifiée de la galerie, la procédure de Microsoft crée une tâche immédiate (Immediate Task) dans les préférences de stratégie de groupe, exécutée en tant que NT AUTHORITY\SYSTEM avec les privilèges les plus élevés, qu'un utilisateur soit connecté ou non. La tâche démarre PowerShell en contournant la stratégie d'exécution pour lancer Onboard-NonPersistentMachine.ps1 depuis le partage, ce qui donne une seule entrée par appareil.
  options:
    daily: { en: "Onboarding must run once, as early as possible after the host starts, not on a daily schedule.", fr: "L'intégration doit s'exécuter une fois, le plus tôt possible après le démarrage de l'hôte, pas selon une planification quotidienne." }
    logon: { en: "A logon trigger waits for a user, so hosts would accept sessions before being onboarded.", fr: "Un déclencheur d'ouverture de session attend un utilisateur : les hôtes accepteraient des sessions avant d'être intégrés." }
    user: { en: "Onboarding needs SYSTEM rights; users don't have them.", fr: "L'intégration exige les droits SYSTEM, que les utilisateurs n'ont pas." }
    localsvc: { en: "LOCAL SERVICE has limited local rights and can't onboard the device.", fr: "LOCAL SERVICE dispose de droits locaux limités et ne peut pas intégrer l'appareil." }
    cmd: { en: "Running the .cmd file alone uses the multiple entries model.", fr: "Exécuter le fichier .cmd seul utilise le modèle à entrées multiples." }
    mpam: { en: "mpam-fe.exe is the antivirus security intelligence package, not the Defender for Endpoint onboarding script.", fr: "mpam-fe.exe est le package d'informations de sécurité de l'antivirus, pas le script d'intégration de Defender for Endpoint." }
references:
  - title: Onboard Windows devices in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/defender-endpoint/onboard-windows-multi-session-device
