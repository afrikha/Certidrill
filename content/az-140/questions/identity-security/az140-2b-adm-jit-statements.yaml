id: az140-2b-adm-jit-statements
objective: "2.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank enables just-in-time (JIT) VM access with the default settings on a Windows session host named HostVM2 from the Configuration page of the VM. Microsoft Defender for Servers Plan 2 is enabled, and a network security group is associated with the subnet of HostVM2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank active l'accès JIT (juste-à-temps) aux machines virtuelles avec les paramètres par défaut sur un hôte de session Windows nommé HostVM2, depuis la page Configuration de la machine virtuelle. Microsoft Defender pour serveurs Plan 2 est activé, et un groupe de sécurité réseau est associé au sous-réseau de HostVM2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An administrator can request access to TCP 3389 on HostVM2 for up to three hours.
        fr: |
          Un administrateur peut demander l'accès à TCP 3389 sur HostVM2 pour trois heures au maximum.
    - id: s2
      text:
        en: |
          When the approved time window expires, Defender for Cloud disconnects the RDP sessions that are already established.
        fr: |
          Quand la période approuvée expire, Defender pour le cloud déconnecte les sessions RDP déjà établies.
    - id: s3
      text:
        en: |
          You can export the JIT activity of HostVM2 from the activity log as a CSV file.
        fr: |
          Vous pouvez exporter l'activité JIT de HostVM2 depuis le journal d'activité sous forme de fichier CSV.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When JIT is enabled from the VM page, the default rule for Windows is port 3389 with a maximum allowed access of 3 hours. When the window expires, Defender for Cloud restores the NSG rules, but established connections aren't interrupted. JIT activity is audited in the activity log, which you can download as CSV.
    fr: |
      Quand JIT est activé depuis la page de la machine virtuelle, la règle par défaut pour Windows est le port 3389 avec un accès maximal autorisé de 3 heures. À l'expiration de la période, Defender pour le cloud restaure les règles du NSG, mais les connexions établies ne sont pas interrompues. L'activité JIT est auditée dans le journal d'activité, que vous pouvez télécharger au format CSV.
references:
  - title: Enable Just-in-Time Access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
  - title: Understand Just-in-time Virtual Machine Access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview
