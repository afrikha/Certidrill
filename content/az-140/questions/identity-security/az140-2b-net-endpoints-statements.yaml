id: az140-2b-net-endpoints-statements
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum routes all the outbound traffic of its Azure Virtual Desktop session hosts through Azure Firewall. Users connect from home over the internet, and RDP Shortpath for public networks is enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum fait passer tout le trafic sortant de ses hôtes de session Azure Virtual Desktop par le Pare-feu Azure. Les utilisateurs se connectent depuis leur domicile par Internet, et RDP Shortpath pour les réseaux publics est activé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Microsoft supports sending the session host traffic to 169.254.169.254 through Azure Firewall so that it can be inspected.
        fr: |
          Microsoft prend en charge l'envoi du trafic des hôtes de session vers 169.254.169.254 via le Pare-feu Azure pour qu'il soit inspecté.
    - id: s2
      text:
        en: |
          For relayed RDP Shortpath connections, the session hosts need outbound UDP 3478 to 51.5.0.0/16.
        fr: |
          Pour les connexions RDP Shortpath relayées, les hôtes de session ont besoin d'UDP 3478 en sortie vers 51.5.0.0/16.
    - id: s3
      text:
        en: |
          You can run the Azure Virtual Desktop Agent URL Tool on a session host to check that it reaches the required FQDNs and endpoints.
        fr: |
          Vous pouvez exécuter l'outil d'URL de l'agent Azure Virtual Desktop (Azure Virtual Desktop Agent URL Tool) sur un hôte de session pour vérifier qu'il joint les FQDN et points de terminaison requis.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Traffic to the Azure fabric addresses 169.254.169.254 (IMDS) and 168.63.129.16 must not be intercepted, proxied or redirected. Relayed RDP connectivity (TURN) uses UDP 3478 to 51.5.0.0/16, which belongs to the WindowsVirtualDesktop tag. The Agent URL Tool validates each required FQDN and endpoint from the session host.
    fr: |
      Le trafic vers les adresses de l'infrastructure Azure 169.254.169.254 (IMDS) et 168.63.129.16 ne doit pas être intercepté, passer par un proxy ni être redirigé. La connectivité RDP relayée (TURN) utilise UDP 3478 vers 51.5.0.0/16, qui fait partie de l'étiquette WindowsVirtualDesktop. L'outil d'URL de l'agent valide chaque FQDN et point de terminaison requis depuis l'hôte de session.
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
  - title: RDP Shortpath
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
