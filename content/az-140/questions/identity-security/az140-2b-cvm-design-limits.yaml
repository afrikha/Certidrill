id: az140-2b-cvm-design-limits
objective: "2.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank plans a new Azure Virtual Desktop host pool for its trading team. The session hosts must use the **Confidential virtual machines** security type with confidential OS disk encryption. The draft design contains the following elements:

    - Windows 11 Enterprise multi-session image
    - DCasv5-series VM size
    - Platform-managed keys for the confidential OS disk encryption
    - Accelerated Networking enabled on the network interfaces
    - Azure Site Recovery replication of the session hosts to a secondary region

    You need to change the design elements that confidential VMs don't support.

    Which two elements should you change?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank planifie un nouveau pool d'hôtes Azure Virtual Desktop pour son équipe de trading. Les hôtes de session doivent utiliser le type de sécurité **Machines virtuelles confidentielles** avec le chiffrement confidentiel du disque du système d'exploitation. Le projet de conception contient les éléments suivants :

    - Image Windows 11 Entreprise multisession
    - Taille de machine virtuelle de la série DCasv5
    - Clés gérées par la plateforme pour le chiffrement confidentiel du disque du système d'exploitation
    - Mise en réseau accélérée activée sur les interfaces réseau
    - Réplication des hôtes de session vers une région secondaire avec Azure Site Recovery

    Vous devez modifier les éléments de la conception que les machines virtuelles confidentielles ne prennent pas en charge.

    Quels sont les deux éléments à modifier ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Windows 11 Enterprise multi-session image", fr: "Image Windows 11 Entreprise multisession" } }
    - { id: b, text: { en: "DCasv5-series VM size", fr: "Taille de machine virtuelle de la série DCasv5" } }
    - { id: c, text: { en: "Accelerated Networking", fr: "Mise en réseau accélérée" } }
    - { id: d, text: { en: "Platform-managed keys", fr: "Clés gérées par la plateforme" } }
    - { id: e, text: { en: "Azure Site Recovery replication", fr: "Réplication avec Azure Site Recovery" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Azure confidential VMs don't support Azure Site Recovery or Accelerated Networking, so the disaster recovery and networking elements must change. Windows 11 Enterprise multi-session is a supported session host OS, DCasv5 is a confidential VM series, and confidential OS disk encryption works with platform-managed or customer-managed keys.
    fr: |
      Les machines virtuelles confidentielles Azure ne prennent en charge ni Azure Site Recovery ni la mise en réseau accélérée : les éléments de reprise d'activité et de réseau doivent changer. Windows 11 Entreprise multisession est un système d'exploitation d'hôte de session pris en charge, DCasv5 est une série de machines virtuelles confidentielles, et le chiffrement confidentiel du disque du système d'exploitation fonctionne avec des clés gérées par la plateforme ou par le client.
  options:
    a: { en: "Windows 11 Enterprise multi-session is supported for confidential session hosts.", fr: "Windows 11 Entreprise multisession est pris en charge pour les hôtes de session confidentiels." }
    b: { en: "DCasv5 is one of the confidential VM series (AMD SEV-SNP).", fr: "DCasv5 fait partie des séries de machines virtuelles confidentielles (AMD SEV-SNP)." }
    d: { en: "Confidential OS disk encryption supports platform-managed and customer-managed keys.", fr: "Le chiffrement confidentiel du disque du système d'exploitation prend en charge les clés gérées par la plateforme et par le client." }
references:
  - title: About Azure confidential VMs
    url: https://learn.microsoft.com/en-us/azure/confidential-computing/confidential-vm-overview
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
