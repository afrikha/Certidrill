id: az140-2a-scenario-federated-idp
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses a third-party identity provider that is federated with its Microsoft Entra tenant. Users sign in with the provider's passwordless method.

    Proseware has an Azure Virtual Desktop host pool named **HP1** whose session hosts are joined to a Microsoft Entra Domain Services managed domain. Users sign in to the feed with the third-party provider, but the session hosts then prompt them for a password.

    You need users to sign in to the HP1 session hosts by using the third-party provider, without a second credential prompt.

    What should you do?
  fr: |
    Proseware utilise un fournisseur d'identité tiers fédéré avec son locataire Microsoft Entra. Les utilisateurs se connectent avec la méthode sans mot de passe de ce fournisseur.

    Proseware dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** dont les hôtes de session sont joints à un domaine managé Microsoft Entra Domain Services. Les utilisateurs se connectent au flux avec le fournisseur tiers, mais les hôtes de session leur demandent ensuite un mot de passe.

    Vous devez permettre aux utilisateurs de se connecter aux hôtes de session de HP1 à l'aide du fournisseur tiers, sans seconde demande d'identifiants.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Deploy AD FS and federate it with the managed domain.", fr: "Déployer AD FS et le fédérer avec le domaine managé." } }
    - { id: b, text: { en: "Add the RDP property targetisaadjoined:i:1 to HP1.", fr: "Ajouter la propriété RDP targetisaadjoined:i:1 à HP1." } }
    - { id: c, text: { en: "Redeploy the session hosts as Microsoft Entra joined and enable single sign-on.", fr: "Redéployer les hôtes de session joints à Microsoft Entra et activer l'authentification unique." } }
    - { id: d, text: { en: "Configure a KDC proxy and add its name to the RDP properties of HP1.", fr: "Configurer un proxy KDC et ajouter son nom aux propriétés RDP de HP1." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A third-party identity provider is supported for the session host sign-in when it's federated with Microsoft Entra ID, the session hosts are Microsoft Entra joined or hybrid joined, and Microsoft Entra authentication (single sign-on) is enabled. Hosts joined to Microsoft Entra Domain Services don't support single sign-on, so they must be redeployed with a supported join type.
    fr: |
      Un fournisseur d'identité tiers est pris en charge pour la connexion à l'hôte de session s'il est fédéré avec Microsoft Entra ID, si les hôtes de session sont joints à Microsoft Entra ou joints hybrides, et si l'authentification Microsoft Entra (authentification unique) est activée. Les hôtes joints à Microsoft Entra Domain Services ne prennent pas en charge l'authentification unique : ils doivent être redéployés avec un type de jonction pris en charge.
  options:
    a: { en: "The provider is already federated with Microsoft Entra ID; AD FS doesn't make a managed domain accept Microsoft Entra tokens.", fr: "Le fournisseur est déjà fédéré avec Microsoft Entra ID ; AD FS ne fait pas accepter des jetons Microsoft Entra à un domaine managé." }
    b: { en: "targetisaadjoined applies to Microsoft Entra joined hosts and limits sign-in to a username and password.", fr: "targetisaadjoined s'applique aux hôtes joints à Microsoft Entra et limite la connexion à un nom d'utilisateur et un mot de passe." }
    d: { en: "A KDC proxy gives remote clients line of sight to a KDC for smart card Kerberos sign-in; it doesn't accept a third-party provider.", fr: "Un proxy KDC donne aux clients distants une visibilité directe sur un KDC pour la connexion Kerberos par carte à puce ; il n'accepte pas un fournisseur tiers." }
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
