id: az140-2a-rbac-assignments-grid
objective: "2.1.3"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a pooled host pool named **HP1** that has a desktop application group named **DAG1**. HP1 contains a session host named **SH1**. The following role assignments exist. Each group contains different users, and no other role assignment exists.

    Answer each prompt by selecting the group in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pool d'hôtes regroupé nommé **HP1** qui a un groupe d'applications de bureau nommé **DAG1**. HP1 contient un hôte de session nommé **SH1**. Les attributions de rôles suivantes existent. Chaque groupe contient des utilisateurs différents, et il n'existe aucune autre attribution de rôle.

    Répondez à chaque consigne en sélectionnant le groupe dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The members of this group see the HP1 desktop in their feed and can connect to it.", fr: "Les membres de ce groupe voient le bureau de HP1 dans leur flux et peuvent s'y connecter." }
    - id: p2
      text: { en: "The members of this group can turn on drain mode for SH1.", fr: "Les membres de ce groupe peuvent activer le mode drainage pour SH1." }
  grid:
    header: [{ en: "Group", fr: "Groupe" }, { en: "Role", fr: "Rôle" }, { en: "Scope", fr: "Étendue" }]
    rows:
      - [{ text: GroupA, area: ga }, { text: Desktop Virtualization User }, { text: HP1 }]
      - [{ text: GroupB, area: gb }, { text: Desktop Virtualization User }, { text: DAG1 }]
      - [{ text: GroupC, area: gc }, { text: Desktop Virtualization User Session Operator }, { text: HP1 }]
      - [{ text: GroupD, area: gd }, { text: Desktop Virtualization Session Host Operator }, { text: HP1 }]
      - [{ text: GroupE, area: ge }, { text: Desktop Virtualization Application Group Reader }, { text: DAG1 }]
answer:
  values: { p1: gb, p2: gd }
explanation:
  correct:
    en: |
      Desktop Virtualization User grants the data action that uses the applications of an application group, so it must be assigned on DAG1: on the host pool it grants nothing. Session Host Operator on HP1 allows changing drain mode and removing session hosts. User Session Operator only manages user sessions, and Application Group Reader only views the application group.
    fr: |
      Desktop Virtualization User accorde l'action de données qui utilise les applications d'un groupe d'applications : il doit donc être attribué sur DAG1, car sur le pool d'hôtes il n'accorde rien. Session Host Operator sur HP1 permet de changer le mode drainage et de supprimer des hôtes de session. User Session Operator ne gère que les sessions utilisateur, et Application Group Reader ne fait qu'afficher le groupe d'applications.
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
