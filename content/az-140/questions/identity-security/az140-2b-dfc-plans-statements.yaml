id: az140-2b-dfc-plans-statements
objective: "2.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans to protect its Azure Virtual Desktop session hosts by using Microsoft Defender for Cloud. No Defender plan has been enabled on the subscription yet.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de protéger ses hôtes de session Azure Virtual Desktop avec Microsoft Defender pour le cloud. Aucun plan Defender n'a encore été activé sur l'abonnement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The secure score and its security recommendations are available for the session hosts before any Defender plan is enabled.
        fr: |
          Le degré de sécurisation et ses recommandations de sécurité sont disponibles pour les hôtes de session avant l'activation de tout plan Defender.
    - id: s2
      text:
        en: |
          When you enable Defender for Servers Plan 1 on the subscription, Microsoft Defender for Endpoint is installed automatically on supported session hosts.
        fr: |
          Quand vous activez Defender pour serveurs Plan 1 sur l'abonnement, Microsoft Defender for Endpoint est installé automatiquement sur les hôtes de session pris en charge.
    - id: s3
      text:
        en: |
          After you enable Defender for Servers for the first time, you can pause the 30-day trial and resume it later.
        fr: |
          Après la première activation de Defender pour serveurs, vous pouvez suspendre l'essai de 30 jours et le reprendre plus tard.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The secure score and recommendations come with the free Foundational CSPM, so they're available without a paid plan. Both Defender for Servers plans onboard supported machines to Defender for Endpoint automatically. The 30-day trial starts when you enable the plan and can't be stopped, paused or extended.
    fr: |
      Le degré de sécurisation et les recommandations font partie du CSPM de base gratuit : ils sont disponibles sans plan payant. Les deux plans Defender pour serveurs intègrent automatiquement les machines prises en charge à Defender for Endpoint. L'essai de 30 jours commence à l'activation du plan et ne peut être ni arrêté, ni suspendu, ni prolongé.
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
