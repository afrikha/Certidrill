id: az140-2a-rights-domain-admins-sso
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a host pool named **HP-Ops** whose session hosts are Microsoft Entra hybrid joined to the woodgrove.com domain. Microsoft Entra single sign-on is enabled on HP-Ops, and a Microsoft Entra Kerberos server object exists. The domain uses the default Password Replication Policy on read-only domain controllers.

    Standard users connect without a credential prompt. Administrators who connect by using accounts that are members of Domain Admins are repeatedly prompted for credentials.

    Administrators must be able to make administrative changes on the session hosts. The solution must follow Microsoft's security recommendations.

    What should you recommend?
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes nommé **HP-Ops** dont les hôtes de session sont joints hybrides Microsoft Entra au domaine woodgrove.com. L'authentification unique Microsoft Entra est activée sur HP-Ops et un objet serveur Kerberos Microsoft Entra existe. Le domaine utilise la stratégie de réplication de mot de passe par défaut sur les contrôleurs de domaine en lecture seule.

    Les utilisateurs standard se connectent sans demande d'identifiants. Les administrateurs qui se connectent avec des comptes membres de Domain Admins reçoivent des demandes d'identifiants répétées.

    Les administrateurs doivent pouvoir effectuer des modifications d'administration sur les hôtes de session. La solution doit suivre les recommandations de sécurité de Microsoft.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Allow password replication for Domain Admins in the Password Replication Policy.", fr: "Autoriser la réplication des mots de passe de Domain Admins dans la stratégie de réplication de mot de passe." } }
    - { id: b, text: { en: "Sign in with a non-administrator account, then use Run as administrator or runas.", fr: "Se connecter avec un compte non administrateur, puis utiliser Exécuter en tant qu'administrateur ou runas." } }
    - { id: c, text: { en: "Assign the Virtual Machine Administrator Login role to Domain Admins on the session hosts.", fr: "Attribuer le rôle Virtual Machine Administrator Login à Domain Admins sur les hôtes de session." } }
    - { id: d, text: { en: "Remove the Microsoft Entra Kerberos server object and create it again.", fr: "Supprimer l'objet serveur Kerberos Microsoft Entra et le créer à nouveau." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The default Password Replication Policy denies password replication for Domain Admins and Administrators, which prevents these accounts from using single sign-on to hybrid joined hosts. Microsoft doesn't recommend connecting to remote sessions with domain administrator accounts: administrators sign in with a standard account and elevate with Run as administrator or runas.
    fr: |
      La stratégie de réplication de mot de passe par défaut refuse la réplication des mots de passe de Domain Admins et d'Administrators, ce qui empêche ces comptes d'utiliser l'authentification unique vers des hôtes joints hybrides. Microsoft ne recommande pas de se connecter aux sessions à distance avec des comptes d'administrateur de domaine : les administrateurs se connectent avec un compte standard et élèvent leurs droits avec Exécuter en tant qu'administrateur ou runas.
  options:
    a: { en: "Replicating Domain Admins passwords weakens a protection on purpose and keeps admins connecting with domain admin accounts, which Microsoft advises against.", fr: "Répliquer les mots de passe de Domain Admins affaiblit volontairement une protection et laisse les administrateurs se connecter avec des comptes d'administrateur de domaine, ce que Microsoft déconseille." }
    c: { en: "Virtual Machine Administrator Login is for Microsoft Entra joined VMs and doesn't change the Kerberos behavior for Domain Admins.", fr: "Virtual Machine Administrator Login concerne les machines virtuelles jointes à Microsoft Entra et ne change pas le comportement Kerberos pour Domain Admins." }
    d: { en: "The object works for standard users; the prompts come from the replication policy for privileged groups.", fr: "L'objet fonctionne pour les utilisateurs standard ; les demandes viennent de la stratégie de réplication pour les groupes privilégiés." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
