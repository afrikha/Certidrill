id: az140-cs2b-signin
objective: "2.1.6"
type: single
caseStudy: az140-cs2b-bellows
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the access requirement for the HP-Labs session hosts.

    What should you do?
  fr: |
    Vous devez respecter l'exigence d'accès pour les hôtes de session HP-Labs.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "On RG-LabHosts, assign Virtual Machine User Login to GRP-Students and Virtual Machine Administrator Login to GRP-LabAdmins."
        fr: "Sur RG-LabHosts, attribuer Virtual Machine User Login à GRP-Students et Virtual Machine Administrator Login à GRP-LabAdmins."
    - id: b
      text:
        en: "On HP-Labs, assign Desktop Virtualization User to GRP-Students and Desktop Virtualization Host Pool Contributor to GRP-LabAdmins."
        fr: "Sur HP-Labs, attribuer Desktop Virtualization User à GRP-Students et Desktop Virtualization Host Pool Contributor à GRP-LabAdmins."
    - id: c
      text:
        en: "On RG-LabHosts, assign Reader to GRP-Students and Virtual Machine Contributor to GRP-LabAdmins."
        fr: "Sur RG-LabHosts, attribuer Reader à GRP-Students et Virtual Machine Contributor à GRP-LabAdmins."
    - id: d
      text:
        en: "With an Intune policy, add GRP-Students to Remote Desktop Users and GRP-LabAdmins to Administrators on the session hosts."
        fr: "Avec une stratégie Intune, ajouter GRP-Students à Remote Desktop Users et GRP-LabAdmins à Administrators sur les hôtes de session."
answer: { optionId: a }
explanation:
  correct:
    en: |
      For Microsoft Entra joined session hosts in a host pool without a session host configuration, users need the Virtual Machine User Login role to sign in, and Virtual Machine Administrator Login gives local administrator privileges. Microsoft recommends assigning them at the resource group scope that contains the session hosts.
    fr: |
      Pour des hôtes de session joints à Microsoft Entra dans un pool d'hôtes sans configuration d'hôte de session, les utilisateurs ont besoin du rôle Virtual Machine User Login pour se connecter, et Virtual Machine Administrator Login donne les privilèges d'administrateur local. Microsoft recommande de les attribuer à l'étendue du groupe de ressources qui contient les hôtes de session.
  options:
    b: { en: "GRP-Students already has access to the application group; neither Desktop Virtualization role grants sign-in or local administrator rights inside the VMs.", fr: "GRP-Students a déjà accès au groupe d'applications ; aucun de ces rôles Desktop Virtualization ne donne le droit de connexion ni les droits d'administrateur local dans les machines virtuelles." }
    c: { en: "Reader and Virtual Machine Contributor are control plane roles; they do not allow signing in to a Microsoft Entra joined VM.", fr: "Reader et Virtual Machine Contributor sont des rôles du plan de contrôle ; ils ne permettent pas de se connecter à une machine virtuelle jointe à Microsoft Entra." }
    d: { en: "Sign-in to Microsoft Entra joined session hosts is authorized by the Virtual Machine User Login or Virtual Machine Administrator Login Azure role, not by local group membership.", fr: "La connexion aux hôtes de session joints à Microsoft Entra est autorisée par le rôle Azure Virtual Machine User Login ou Virtual Machine Administrator Login, pas par l'appartenance à un groupe local." }
references:
  - title: Microsoft Entra joined session hosts in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts
