id: az140-cs1c-identity
objective: "2.1.1"
type: single
caseStudy: az140-cs1c-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend an identity solution for the session hosts of HP-Front and HP-Partners. The solution must meet the identity requirement.

    What should you recommend?
  fr: |
    Vous devez recommander une solution d'identité pour les hôtes de session de HP-Front et de HP-Partners. La solution doit respecter l'exigence relative à l'identité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Join the session hosts to Microsoft Entra ID and enroll them in Microsoft Intune.", fr: "Joindre les hôtes de session à Microsoft Entra ID et les inscrire dans Microsoft Intune." } }
    - { id: b, text: { en: "Deploy two AD DS domain controllers on Azure VMs and join the session hosts to the new domain.", fr: "Déployer deux contrôleurs de domaine AD DS sur des machines virtuelles Azure et joindre les hôtes de session au nouveau domaine." } }
    - { id: c, text: { en: "Enable Microsoft Entra Domain Services and join the session hosts to the managed domain.", fr: "Activer Microsoft Entra Domain Services et joindre les hôtes de session au domaine managé." } }
    - { id: d, text: { en: "Configure Microsoft Entra hybrid join for the session hosts by using Microsoft Entra Connect.", fr: "Configurer la jonction hybride Microsoft Entra des hôtes de session à l'aide de Microsoft Entra Connect." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft Entra Domain Services provides a managed Active Directory domain with Kerberos authentication and Group Policy, and Microsoft operates its domain controllers. Users created in Microsoft Entra ID are synchronized to the managed domain, so the cloud-only employees and agents can sign in to session hosts joined to that domain.
    fr: |
      Microsoft Entra Domain Services fournit un domaine Active Directory managé avec l'authentification Kerberos et la stratégie de groupe, et Microsoft exploite ses contrôleurs de domaine. Les utilisateurs créés dans Microsoft Entra ID sont synchronisés avec le domaine managé : les employés et les agents cloud uniquement peuvent donc se connecter aux hôtes de session joints à ce domaine.
  options:
    a: { en: "Microsoft Entra joined session hosts are not members of an Active Directory domain, which SkiBook and the POS application require.", fr: "Les hôtes de session joints à Microsoft Entra ne sont pas membres d'un domaine Active Directory, ce qu'exigent SkiBook et l'application POS." }
    b: { en: "Domain controllers on Azure VMs must be deployed, updated and backed up by Alpine, which the requirement excludes.", fr: "Des contrôleurs de domaine sur des machines virtuelles Azure doivent être déployés, mis à jour et sauvegardés par Alpine, ce que l'exigence exclut." }
    d: { en: "Microsoft Entra hybrid join requires an AD DS domain with domain controllers; Alpine has none.", fr: "La jonction hybride Microsoft Entra nécessite un domaine AD DS avec des contrôleurs de domaine ; Alpine n'en a pas." }
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
