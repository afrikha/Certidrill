id: az140-2b-tl-security-profile
objective: "2.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso deploys Azure Virtual Desktop session hosts by using an ARM template. The template must explicitly create Trusted launch VMs with Secure Boot and vTPM enabled, whatever the API version and feature registrations.

    You need to complete the `securityProfile` property of the virtual machine resource.

    How should you complete the template? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie des hôtes de session Azure Virtual Desktop avec un modèle ARM. Le modèle doit créer explicitement des machines virtuelles Trusted launch avec Secure Boot et le vTPM activés, quels que soient la version d'API et les enregistrements de fonctionnalités.

    Vous devez compléter la propriété `securityProfile` de la ressource de machine virtuelle.

    Comment devez-vous compléter le modèle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "securityProfile": {
      "securityType": [[type]],
      [[uefi]]: {
        "secureBootEnabled": true,
        "vTpmEnabled": true
      }
    }
  slots:
    - id: type
      options:
        - { id: tl, text: "\"TrustedLaunch\"" }
        - { id: tls, text: "\"TrustedLaunchSupported\"" }
        - { id: cvm, text: "\"ConfidentialVM\"" }
        - { id: std, text: "\"Standard\"" }
    - id: uefi
      options:
        - { id: os, text: "\"osProfile\"" }
        - { id: uefi, text: "\"uefiSettings\"" }
        - { id: enc, text: "\"encryptionSettings\"" }
answer:
  values: { type: tl, uefi: uefi }
explanation:
  correct:
    en: |
      In the VM's `securityProfile`, `securityType` is set to `TrustedLaunch`, and the `uefiSettings` object holds `secureBootEnabled` and `vTpmEnabled`. Setting them explicitly avoids depending on Trusted launch as the default, which for templates depends on the API version or a feature registration.
    fr: |
      Dans la propriété `securityProfile` de la machine virtuelle, `securityType` est défini sur `TrustedLaunch`, et l'objet `uefiSettings` contient `secureBootEnabled` et `vTpmEnabled`. Les définir explicitement évite de dépendre de Trusted launch comme valeur par défaut, qui, pour les modèles, dépend de la version d'API ou d'un enregistrement de fonctionnalité.
  options:
    tls: { en: "TrustedLaunchSupported describes what an image definition supports in Azure Compute Gallery; it isn't a VM security type.", fr: "TrustedLaunchSupported décrit ce que prend en charge une définition d'image dans Azure Compute Gallery ; ce n'est pas un type de sécurité de machine virtuelle." }
    cvm: { en: "ConfidentialVM creates a confidential VM, which needs confidential sizes; the requirement is Trusted launch.", fr: "ConfidentialVM crée une machine virtuelle confidentielle, qui exige des tailles confidentielles ; l'exigence est Trusted launch." }
    std: { en: "Standard is the value that opts out of Trusted launch.", fr: "Standard est la valeur qui désactive Trusted launch." }
    os: { en: "osProfile holds the computer name and credentials, not the UEFI security settings.", fr: "osProfile contient le nom d'ordinateur et les informations d'identification, pas les paramètres de sécurité UEFI." }
    enc: { en: "Secure Boot and vTPM are UEFI settings, not encryption settings.", fr: "Secure Boot et le vTPM sont des paramètres UEFI, pas des paramètres de chiffrement." }
references:
  - title: Trusted Launch for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
