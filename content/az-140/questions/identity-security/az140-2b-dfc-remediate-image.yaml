id: az140-2b-dfc-remediate-image
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a pooled Azure Virtual Desktop host pool named HostPool1 that contains 20 session hosts. The session hosts are created from an image version stored in an Azure Compute Gallery and are replaced every month by redeploying them from the latest image version.

    Microsoft Defender for Servers Plan 2 is enabled. Microsoft Defender for Cloud reports that a third-party PDF reader installed on every session host has a critical vulnerability.

    You need to remediate the vulnerability so that the finding does not reappear after the next monthly redeployment. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam dispose d'un pool d'hôtes regroupé Azure Virtual Desktop nommé HostPool1 qui contient 20 hôtes de session. Les hôtes de session sont créés à partir d'une version d'image stockée dans une galerie Azure Compute Gallery et sont remplacés chaque mois par un redéploiement à partir de la dernière version d'image.

    Microsoft Defender pour serveurs Plan 2 est activé. Microsoft Defender pour le cloud signale qu'un lecteur PDF tiers installé sur chaque hôte de session présente une vulnérabilité critique.

    Vous devez corriger la vulnérabilité de sorte que le constat ne réapparaisse pas après le prochain redéploiement mensuel. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Update the PDF reader on each session host by using the recommendation's Quick fix.", fr: "Mettre à jour le lecteur PDF sur chaque hôte de session avec le correctif rapide (Quick fix) de la recommandation." } }
    - { id: b, text: { en: "Update the PDF reader in the golden image, publish a new image version, and redeploy the session hosts.", fr: "Mettre à jour le lecteur PDF dans l'image de référence, publier une nouvelle version d'image et redéployer les hôtes de session." } }
    - { id: c, text: { en: "Create an exemption for the recommendation on the resource group that contains the session hosts.", fr: "Créer une exemption pour la recommandation sur le groupe de ressources qui contient les hôtes de session." } }
    - { id: d, text: { en: "Disable vulnerability assessment for the session hosts in the Defender for Servers settings.", fr: "Désactiver l'évaluation des vulnérabilités pour les hôtes de session dans les paramètres de Defender pour serveurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Session hosts are rebuilt from the image, so a vulnerability that comes from the image must be fixed in the image itself. Microsoft recommends patching the operating system, the applications and the images used to create the hosts; after you redeploy from the new image version, the finding disappears and does not come back.
    fr: |
      Les hôtes de session sont recréés à partir de l'image : une vulnérabilité qui provient de l'image doit être corrigée dans l'image elle-même. Microsoft recommande de corriger le système d'exploitation, les applications et les images qui servent à créer les hôtes ; après le redéploiement à partir de la nouvelle version d'image, le constat disparaît et ne revient pas.
  options:
    a: { en: "Fixing each running host is lost at the next redeployment from the unchanged image, and Defender for Cloud does not patch third-party applications for you.", fr: "Une correction sur chaque hôte en cours d'exécution est perdue au prochain redéploiement à partir de l'image inchangée, et Defender pour le cloud ne corrige pas les applications tierces à votre place." }
    c: { en: "An exemption hides the finding from the secure score but leaves the vulnerability on every host.", fr: "Une exemption masque le constat dans le degré de sécurisation mais laisse la vulnérabilité sur chaque hôte." }
    d: { en: "Disabling the assessment only stops the reporting; the hosts remain vulnerable.", fr: "Désactiver l'évaluation ne fait qu'arrêter le signalement ; les hôtes restent vulnérables." }
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
