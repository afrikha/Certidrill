id: az140-2a-sso-graph-powershell
objective: "2.1.7"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are preparing Microsoft Entra single sign-on for Azure Virtual Desktop in the Woodgrove Bank tenant. You need to enable the Microsoft Entra ID authentication protocol for RDP by using the Microsoft Graph PowerShell SDK. The connection to Microsoft Graph must request only the permissions that the task needs.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez l'authentification unique Microsoft Entra pour Azure Virtual Desktop dans le locataire de Woodgrove Bank. Vous devez activer le protocole d'authentification Microsoft Entra ID pour RDP à l'aide du SDK Microsoft Graph PowerShell. La connexion à Microsoft Graph ne doit demander que les autorisations nécessaires à la tâche.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Import-Module Microsoft.Graph.Authentication
    Import-Module Microsoft.Graph.Applications

    Connect-MgGraph -Scopes "Application.Read.All","[[scope]]"

    $spId = (Get-MgServicePrincipal -Filter "AppId eq '[[appid]]'").Id

    [[cmd]] -ServicePrincipalId $spId -IsRemoteDesktopProtocolEnabled
  slots:
    - id: scope
      options:
        - { id: rdconfig, text: Application-RemoteDesktopConfig.ReadWrite.All }
        - { id: capolicy, text: Policy.ReadWrite.ConditionalAccess }
        - { id: device, text: Device.ReadWrite.All }
        - { id: directory, text: Directory.ReadWrite.All }
    - id: appid
      options:
        - { id: wcl, text: 270efc09-cd0d-444b-a71f-39af4910ec45 }
        - { id: avd, text: 9cdead84-a844-4324-93f2-b2e6bb768d07 }
        - { id: arm, text: 50e95039-b200-4007-bc97-8d5790743a63 }
        - { id: client, text: a85cf173-4192-42f8-81fa-777a763e6e2c }
    - id: cmd
      options:
        - { id: update, text: Update-MgServicePrincipalRemoteDesktopSecurityConfiguration }
        - { id: tdg, text: New-MgServicePrincipalRemoteDesktopSecurityConfigurationTargetDeviceGroup }
        - { id: sp, text: Update-MgServicePrincipal }
        - { id: hostpool, text: Update-AzWvdHostPool }
answer:
  values: { scope: rdconfig, appid: wcl, cmd: update }
explanation:
  correct:
    en: |
      Microsoft Entra authentication for RDP is enabled by setting isRemoteDesktopProtocolEnabled to true on the remoteDesktopSecurityConfiguration object of the Windows Cloud Login service principal (app ID 270efc09-cd0d-444b-a71f-39af4910ec45). The connection needs the Application.Read.All and Application-RemoteDesktopConfig.ReadWrite.All scopes, and Update-MgServicePrincipalRemoteDesktopSecurityConfiguration sets the property.
    fr: |
      L'authentification Microsoft Entra pour RDP s'active en définissant isRemoteDesktopProtocolEnabled sur true dans l'objet remoteDesktopSecurityConfiguration du principal de service Windows Cloud Login (ID d'application 270efc09-cd0d-444b-a71f-39af4910ec45). La connexion a besoin des étendues Application.Read.All et Application-RemoteDesktopConfig.ReadWrite.All, et Update-MgServicePrincipalRemoteDesktopSecurityConfiguration définit la propriété.
  options:
    capolicy: { en: "This scope manages Conditional Access policies, not the remote desktop configuration of a service principal.", fr: "Cette étendue gère les stratégies d'accès conditionnel, pas la configuration Bureau à distance d'un principal de service." }
    directory: { en: "This broad scope isn't the permission the task needs.", fr: "Cette étendue large n'est pas l'autorisation nécessaire à la tâche." }
    avd: { en: "9cdead84-... is the Azure Virtual Desktop app used for the feed and the gateway, not for the session host sign-in.", fr: "9cdead84-... est l'application Azure Virtual Desktop utilisée pour le flux et la passerelle, pas pour la connexion à l'hôte de session." }
    arm: { en: "50e95039-... is the Azure Virtual Desktop ARM Provider app, used to retrieve the feed.", fr: "50e95039-... est l'application Azure Virtual Desktop ARM Provider, utilisée pour récupérer le flux." }
    tdg: { en: "This cmdlet adds a target device group to hide the consent prompt; it doesn't enable the protocol.", fr: "Cette cmdlet ajoute un groupe d'appareils cible pour masquer l'invite de consentement ; elle n'active pas le protocole." }
    hostpool: { en: "Update-AzWvdHostPool sets host pool properties such as enablerdsaadauth; it doesn't change a Microsoft Entra service principal.", fr: "Update-AzWvdHostPool définit des propriétés du pool d'hôtes comme enablerdsaadauth ; il ne modifie pas un principal de service Microsoft Entra." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
  - title: Assign Azure RBAC roles or Microsoft Entra roles to a service principal
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/service-principal-assign-roles
