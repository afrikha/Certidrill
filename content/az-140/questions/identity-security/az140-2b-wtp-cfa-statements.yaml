id: az140-2b-wtp-cfa-statements
objective: "2.2.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum evaluates controlled folder access for its Azure Virtual Desktop session hosts. Some users' Documents folders are redirected to OneDrive by Known Folder Move.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum évalue l'accès contrôlé aux dossiers pour ses hôtes de session Azure Virtual Desktop. Les dossiers Documents de certains utilisateurs sont redirigés vers OneDrive par le déplacement des dossiers connus (Known Folder Move).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Controlled folder access protects files on session hosts where Microsoft Defender Antivirus runs in passive mode next to a third-party antivirus.
        fr: |
          L'accès contrôlé aux dossiers protège les fichiers sur les hôtes de session où Microsoft Defender Antivirus s'exécute en mode passif à côté d'un antivirus tiers.
    - id: s2
      text:
        en: |
          For a user whose Documents folder is redirected by Known Folder Move, controlled folder access protects the redirected location.
        fr: |
          Pour un utilisateur dont le dossier Documents est redirigé par le déplacement des dossiers connus, l'accès contrôlé aux dossiers protège l'emplacement redirigé.
    - id: s3
      text:
        en: |
          You can add a network share to the list of protected folders.
        fr: |
          Vous pouvez ajouter un partage réseau à la liste des dossiers protégés.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Controlled folder access requires Microsoft Defender Antivirus as the primary antivirus in active mode with real-time protection; it doesn't work in passive mode. When a default folder is redirected, for example by Known Folder Move, the redirected location is protected. Protected folders can include network shares and mapped drives, although access by untrusted processes can slow them down.
    fr: |
      L'accès contrôlé aux dossiers exige Microsoft Defender Antivirus comme antivirus principal en mode actif avec la protection en temps réel ; il ne fonctionne pas en mode passif. Quand un dossier par défaut est redirigé, par exemple par le déplacement des dossiers connus, l'emplacement redirigé est protégé. Les dossiers protégés peuvent inclure des partages réseau et des lecteurs mappés, même si l'accès par des processus non approuvés peut les ralentir.
references:
  - title: Protect folders from ransomware with controlled folder access
    url: https://learn.microsoft.com/en-us/defender-endpoint/controlled-folders
