id: az140-2a-sso-consent-prompt
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam enabled Microsoft Entra single sign-on for a pooled host pool named **HP-Pool** that contains 60 Microsoft Entra joined session hosts. Session hosts are added and removed every week.

    Users report that, when they connect to a session host for the first time, a dialog asks them to allow the Remote Desktop connection.

    You need to prevent the dialog from appearing for the HP-Pool session hosts. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam a activé l'authentification unique Microsoft Entra pour un pool d'hôtes regroupé nommé **HP-Pool** qui contient 60 hôtes de session joints à Microsoft Entra. Des hôtes de session sont ajoutés et supprimés chaque semaine.

    Les utilisateurs signalent que, lorsqu'ils se connectent à un hôte de session pour la première fois, une boîte de dialogue leur demande d'autoriser la connexion Bureau à distance.

    Vous devez empêcher l'affichage de cette boîte de dialogue pour les hôtes de session de HP-Pool. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant tenant-wide admin consent to the Azure Virtual Desktop enterprise application.", fr: "Accorder le consentement administrateur à l'échelle du locataire à l'application d'entreprise Azure Virtual Desktop." } }
    - { id: b, text: { en: "Add a static device group of the current session hosts to the target device groups of Windows Cloud Login.", fr: "Ajouter un groupe d'appareils statique des hôtes de session actuels aux groupes d'appareils cibles de Windows Cloud Login." } }
    - { id: c, text: { en: "Assign the Virtual Machine User Login role to the users on the resource group of the session hosts.", fr: "Attribuer le rôle Virtual Machine User Login aux utilisateurs sur le groupe de ressources des hôtes de session." } }
    - { id: d, text: { en: "Add a dynamic device group of the session hosts to the target device groups of Windows Cloud Login.", fr: "Ajouter un groupe d'appareils dynamique des hôtes de session aux groupes d'appareils cibles de Windows Cloud Login." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The consent dialog is hidden for the devices in the target device groups of the Windows Cloud Login service principal (up to 10 groups). Microsoft recommends a dynamic group whose membership rules include all session hosts, so that hosts added later are covered automatically.
    fr: |
      La boîte de dialogue de consentement est masquée pour les appareils des groupes d'appareils cibles du principal de service Windows Cloud Login (jusqu'à 10 groupes). Microsoft recommande un groupe dynamique dont les règles d'appartenance incluent tous les hôtes de session, pour que les hôtes ajoutés ensuite soient couverts automatiquement.
  options:
    a: { en: "The dialog isn't an application consent; it's controlled by the target device groups of Windows Cloud Login.", fr: "La boîte de dialogue n'est pas un consentement d'application ; elle est contrôlée par les groupes d'appareils cibles de Windows Cloud Login." }
    c: { en: "Virtual Machine User Login allows sign-in to Microsoft Entra joined VMs; it doesn't hide the dialog.", fr: "Virtual Machine User Login autorise la connexion aux machines virtuelles jointes à Microsoft Entra ; il ne masque pas la boîte de dialogue." }
    b: { en: "A static group would have to be updated every week as hosts change, which doesn't minimize effort.", fr: "Un groupe statique devrait être mis à jour chaque semaine au fil des changements d'hôtes, ce qui ne réduit pas l'effort." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
