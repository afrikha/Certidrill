id: az140-2a-req-entra-joined-facts
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to deploy Microsoft Entra joined session hosts for Azure Virtual Desktop from the Azure portal. Fabrikam has one Microsoft Entra tenant that contains the Azure subscription, and another Microsoft Entra tenant used by a subsidiary.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de déployer depuis le portail Azure des hôtes de session Azure Virtual Desktop joints à Microsoft Entra. Fabrikam dispose d'un locataire Microsoft Entra qui contient l'abonnement Azure, et d'un autre locataire Microsoft Entra utilisé par une filiale.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Microsoft Entra ID join option can join the session hosts to the tenant of the subsidiary.
        fr: L'option de jonction Microsoft Entra ID peut joindre les hôtes de session au locataire de la filiale.
    - id: s2
      text:
        en: Session hosts that run Windows Server 2022 can be Microsoft Entra joined.
        fr: Des hôtes de session qui exécutent Windows Server 2022 peuvent être joints à Microsoft Entra.
    - id: s3
      text:
        en: In a host pool that uses a session host configuration, users don't need the Virtual Machine User Login role to sign in to the Microsoft Entra joined session hosts.
        fr: Dans un pool d'hôtes qui utilise une configuration d'hôte de session, les utilisateurs n'ont pas besoin du rôle Virtual Machine User Login pour se connecter aux hôtes de session joints à Microsoft Entra.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The Microsoft Entra ID join option only joins VMs to the tenant that contains the subscription. Microsoft Entra joined session hosts are supported on Windows 11, Windows 10 version 2004 or later, Windows Server 2022 and Windows Server 2019. The Virtual Machine User Login assignment is required only for host pools without a session host configuration.
    fr: |
      L'option de jonction Microsoft Entra ID ne joint les machines virtuelles qu'au locataire qui contient l'abonnement. Les hôtes de session joints à Microsoft Entra sont pris en charge sur Windows 11, Windows 10 version 2004 ou ultérieure, Windows Server 2022 et Windows Server 2019. L'attribution de Virtual Machine User Login n'est requise que pour les pools d'hôtes sans configuration d'hôte de session.
references:
  - title: Microsoft Entra joined session hosts in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts
