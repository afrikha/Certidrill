id: az140-2b-wtp-appcontrol-rollout
objective: "2.2.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Litware plans to deploy App Control for Business to the session hosts of a pooled Azure Virtual Desktop host pool by using Microsoft Intune. The Azure Virtual Desktop components and several line-of-business apps must keep working, and users must not be blocked while the policy is being tuned.

    You need to deploy an enforced App Control for Business policy to the session hosts.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware prévoit de déployer App Control for Business sur les hôtes de session d'un pool d'hôtes regroupé Azure Virtual Desktop avec Microsoft Intune. Les composants d'Azure Virtual Desktop et plusieurs applications métier doivent continuer à fonctionner, et les utilisateurs ne doivent pas être bloqués pendant la mise au point de la stratégie.

    Vous devez déployer une stratégie App Control for Business appliquée sur les hôtes de session.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: base, text: { en: "Create a base policy from a Microsoft example policy with the audit mode option enabled.", fr: "Créer une stratégie de base à partir d'un exemple de stratégie Microsoft avec l'option de mode audit activée." } }
    - { id: deploy, text: { en: "Deploy the base policy to the session hosts.", fr: "Déployer la stratégie de base sur les hôtes de session." } }
    - { id: review, text: { en: "Review the code integrity events for files that would have been blocked.", fr: "Examiner les événements d'intégrité du code pour les fichiers qui auraient été bloqués." } }
    - { id: supp, text: { en: "Create and deploy a supplemental policy that allows the files that would have been blocked.", fr: "Créer et déployer une stratégie supplémentaire qui autorise les fichiers qui auraient été bloqués." } }
    - { id: enforce, text: { en: "Remove the audit mode option from the base policy and redeploy it.", fr: "Supprimer l'option de mode audit de la stratégie de base et la redéployer." } }
    - { id: remoteapp, text: { en: "Publish every line-of-business app as a RemoteApp.", fr: "Publier chaque application métier comme RemoteApp." } }
    - { id: cfa, text: { en: "Enable controlled folder access in audit mode.", fr: "Activer l'accès contrôlé aux dossiers en mode audit." } }
answer:
  sequence: [ base, deploy, review, supp, enforce ]
explanation:
  correct:
    en: |
      An App Control rollout starts in audit mode so nothing is blocked while you collect the code integrity events that show what would have been blocked. You then allow those files, such as the Azure Virtual Desktop components and the line-of-business apps, with a supplemental policy, and only then switch the base policy to enforced mode.
    fr: |
      Un déploiement d'App Control commence en mode audit : rien n'est bloqué pendant que vous collectez les événements d'intégrité du code qui montrent ce qui aurait été bloqué. Vous autorisez ensuite ces fichiers, comme les composants d'Azure Virtual Desktop et les applications métier, avec une stratégie supplémentaire, et vous passez seulement alors la stratégie de base en mode appliqué.
  options:
    remoteapp: { en: "RemoteApp isn't a security feature and doesn't control which code can run.", fr: "RemoteApp n'est pas une fonctionnalité de sécurité et ne contrôle pas le code qui peut s'exécuter." }
    cfa: { en: "Controlled folder access protects folders from untrusted writes; it isn't part of an App Control rollout.", fr: "L'accès contrôlé aux dossiers protège des dossiers contre les écritures non approuvées ; il ne fait pas partie d'un déploiement d'App Control." }
references:
  - title: Application Control for Windows
    url: https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/appcontrol
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
