id: az140-2b-net-scale-in-route
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a hub-and-spoke network. The Azure Virtual Desktop session hosts are in a spoke subnet named snet-hosts. A route table associated with snet-hosts contains a route for 0.0.0.0/0 with the next hop type Virtual appliance and the private IP address of an Azure Firewall in the hub. The firewall policy allows all the required Azure Virtual Desktop endpoints.

    Users report that their sessions sometimes disconnect. The disconnections match Azure Firewall scale-in events.

    You need to prevent the disconnections. All the other traffic from snet-hosts must keep going through the firewall.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un réseau hub-and-spoke. Les hôtes de session Azure Virtual Desktop se trouvent dans un sous-réseau spoke nommé snet-hosts. Une table de routage associée à snet-hosts contient un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant Appliance virtuelle et l'adresse IP privée d'un Pare-feu Azure du hub. La stratégie de pare-feu autorise tous les points de terminaison Azure Virtual Desktop requis.

    Les utilisateurs signalent que leurs sessions se déconnectent parfois. Les déconnexions coïncident avec des événements de réduction d'échelle du Pare-feu Azure.

    Vous devez empêcher les déconnexions. Tout le reste du trafic de snet-hosts doit continuer à passer par le pare-feu.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a route for the WindowsVirtualDesktop service tag with the next hop type Internet to the route table of snet-hosts.", fr: "Ajouter à la table de routage de snet-hosts un itinéraire pour l'étiquette de service WindowsVirtualDesktop avec le type de tronçon suivant Internet." } }
    - { id: b, text: { en: "Add a route for the WindowsVirtualDesktop service tag with the next hop type Internet to a route table on AzureFirewallSubnet.", fr: "Ajouter à une table de routage sur AzureFirewallSubnet un itinéraire pour l'étiquette de service WindowsVirtualDesktop avec le type de tronçon suivant Internet." } }
    - { id: c, text: { en: "Replace the application rule that uses the WindowsVirtualDesktop FQDN tag with a network rule for the WindowsVirtualDesktop service tag.", fr: "Remplacer la règle d'application qui utilise l'étiquette FQDN WindowsVirtualDesktop par une règle de réseau pour l'étiquette de service WindowsVirtualDesktop." } }
    - { id: d, text: { en: "Disable gateway route propagation on the route table of snet-hosts.", fr: "Désactiver la propagation des itinéraires de passerelle sur la table de routage de snet-hosts." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A default route through the firewall can cause Azure Virtual Desktop disconnections during Azure Firewall scale-in. Microsoft recommends adding, to the route table of the Azure Virtual Desktop subnet, a route whose destination is the WindowsVirtualDesktop service tag with the next hop Internet, so that gateway and broker traffic goes direct while everything else still uses the firewall.
    fr: |
      Un itinéraire par défaut via le pare-feu peut provoquer des déconnexions Azure Virtual Desktop pendant la réduction d'échelle du Pare-feu Azure. Microsoft recommande d'ajouter, dans la table de routage du sous-réseau Azure Virtual Desktop, un itinéraire dont la destination est l'étiquette de service WindowsVirtualDesktop avec Internet comme tronçon suivant : le trafic de la passerelle et du répartiteur passe en direct, et tout le reste continue de passer par le pare-feu.
  options:
    b: { en: "The routing decision is made in the session host subnet; a route on the firewall subnet doesn't stop the session host traffic from going to the firewall.", fr: "La décision de routage est prise dans le sous-réseau des hôtes de session ; un itinéraire sur le sous-réseau du pare-feu n'empêche pas le trafic des hôtes de session d'aller vers le pare-feu." }
    c: { en: "Changing the rule type still sends the traffic through the firewall, so scale-in events still affect it.", fr: "Changer le type de règle fait toujours passer le trafic par le pare-feu : les réductions d'échelle l'affectent toujours." }
    d: { en: "Gateway route propagation concerns routes learned from a virtual network gateway; it doesn't change the default route to the firewall.", fr: "La propagation des itinéraires de passerelle concerne les itinéraires appris d'une passerelle de réseau virtuel ; elle ne modifie pas l'itinéraire par défaut vers le pare-feu." }
references:
  - title: Use Azure Firewall to protect Azure Virtual Desktop deployments
    url: https://learn.microsoft.com/en-us/azure/firewall/protect-azure-virtual-desktop
