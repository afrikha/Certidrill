id: az140-2a-sso-behavior-statements
objective: "2.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum enabled Microsoft Entra single sign-on on a host pool named **HP-Hybrid**. The session hosts are Microsoft Entra hybrid joined to a resource domain named res.adatum.com, while the user accounts are in a separate domain named corp.adatum.com. The default session lock behavior is used, and no target device groups are configured.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a activé l'authentification unique Microsoft Entra sur un pool d'hôtes nommé **HP-Hybrid**. Les hôtes de session sont joints hybrides Microsoft Entra à un domaine de ressources nommé res.adatum.com, tandis que les comptes d'utilisateurs se trouvent dans un domaine distinct nommé corp.adatum.com. Le comportement de verrouillage de session par défaut est utilisé et aucun groupe d'appareils cible n'est configuré.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a user locks a remote session on HP-Hybrid, the session is disconnected.
        fr: Quand un utilisateur verrouille une session à distance sur HP-Hybrid, la session est déconnectée.
    - id: s2
      text:
        en: A one-way trust in which res.adatum.com trusts corp.adatum.com is enough for single sign-on to work without falling back to older authentication protocols.
        fr: Une approbation unidirectionnelle dans laquelle res.adatum.com approuve corp.adatum.com suffit pour que l'authentification unique fonctionne sans revenir à des protocoles d'authentification plus anciens.
    - id: s3
      text:
        en: After a user approves the Remote Desktop connection dialog for a session host, the user isn't asked again for that host for up to 30 days.
        fr: Après qu'un utilisateur a autorisé la boîte de dialogue de connexion Bureau à distance pour un hôte de session, cela ne lui est plus redemandé pour cet hôte pendant 30 jours au maximum.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With single sign-on, the default session lock behavior disconnects the session so that Conditional Access is evaluated again at reconnection. Hybrid joined session hosts in a different domain than the user accounts require a two-way trust; otherwise connections fall back to older authentication protocols. Without target device groups, Microsoft Entra remembers up to 15 hosts for 30 days before prompting again.
    fr: |
      Avec l'authentification unique, le comportement de verrouillage par défaut déconnecte la session afin que l'accès conditionnel soit réévalué à la reconnexion. Des hôtes de session joints hybrides dans un autre domaine que celui des comptes d'utilisateurs exigent une approbation bidirectionnelle ; sinon, les connexions reviennent à des protocoles d'authentification plus anciens. Sans groupes d'appareils cibles, Microsoft Entra mémorise jusqu'à 15 hôtes pendant 30 jours avant de redemander.
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
