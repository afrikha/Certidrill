id: az140-2a-req-join-account-mfa
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses an AD DS domain named woodgrove.com that is synchronized to Microsoft Entra ID. The synchronized account **svc-avdjoin** has delegated rights to create computer objects in the OU that contains the Azure Virtual Desktop session hosts.

    A security policy requires multifactor authentication (MFA) for every account, and MFA is enabled for svc-avdjoin. When you add session hosts to a host pool by using svc-avdjoin as the domain join account, the deployment fails.

    You need to ensure that the session hosts can be joined to the domain during deployment.

    What should you do?
  fr: |
    Woodgrove Bank utilise un domaine AD DS nommé woodgrove.com synchronisé vers Microsoft Entra ID. Le compte synchronisé **svc-avdjoin** dispose de droits délégués pour créer des objets ordinateur dans l'unité d'organisation qui contient les hôtes de session Azure Virtual Desktop.

    Une stratégie de sécurité exige l'authentification multifacteur (MFA) pour tous les comptes, et l'authentification multifacteur est activée pour svc-avdjoin. Quand vous ajoutez des hôtes de session à un pool d'hôtes en utilisant svc-avdjoin comme compte de jonction au domaine, le déploiement échoue.

    Vous devez faire en sorte que les hôtes de session puissent être joints au domaine pendant le déploiement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Use a domain join account that doesn't have MFA enabled.", fr: "Utiliser un compte de jonction au domaine pour lequel l'authentification multifacteur n'est pas activée." } }
    - { id: b, text: { en: "Assign the Desktop Virtualization Host Pool Contributor role to svc-avdjoin.", fr: "Attribuer le rôle Desktop Virtualization Host Pool Contributor à svc-avdjoin." } }
    - { id: c, text: { en: "Enable Microsoft Entra single sign-on on the host pool before the deployment.", fr: "Activer l'authentification unique Microsoft Entra sur le pool d'hôtes avant le déploiement." } }
    - { id: d, text: { en: "Add svc-avdjoin to the Remote Desktop Users group of the domain.", fr: "Ajouter svc-avdjoin au groupe Remote Desktop Users du domaine." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The account that joins session hosts to the domain during deployment can't have multifactor authentication enabled. Use a dedicated join account that is excluded from MFA and keep its rights limited to the session host OU.
    fr: |
      Le compte qui joint les hôtes de session au domaine pendant le déploiement ne peut pas avoir l'authentification multifacteur activée. Utilisez un compte de jonction dédié exclu de l'authentification multifacteur et limitez ses droits à l'unité d'organisation des hôtes de session.
  options:
    b: { en: "This Azure role manages host pool objects; it doesn't change how the domain join authenticates.", fr: "Ce rôle Azure gère les objets pool d'hôtes ; il ne change pas la façon dont la jonction au domaine s'authentifie." }
    c: { en: "Single sign-on applies to user connections after deployment, not to joining computers to the domain.", fr: "L'authentification unique s'applique aux connexions des utilisateurs après le déploiement, pas à la jonction des ordinateurs au domaine." }
    d: { en: "Remote Desktop Users controls interactive remote sign-in, not the right to join computers.", fr: "Remote Desktop Users contrôle la connexion interactive à distance, pas le droit de joindre des ordinateurs." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
