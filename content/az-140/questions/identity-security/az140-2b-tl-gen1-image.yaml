id: az140-2b-tl-gen1-image
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders creates its Azure Virtual Desktop session hosts from a managed image captured from a Generation 1 VM.

    You plan a new host pool whose session hosts must use the Trusted launch security type with Secure Boot and vTPM enabled. The session hosts must keep the applications installed in the current image.

    What should you do first?
  fr: |
    Northwind Traders crée ses hôtes de session Azure Virtual Desktop à partir d'une image managée capturée depuis une machine virtuelle de génération 1.

    Vous planifiez un nouveau pool d'hôtes dont les hôtes de session doivent utiliser le type de sécurité Trusted launch (lancement sécurisé) avec Secure Boot et le vTPM activés. Les hôtes de session doivent conserver les applications installées dans l'image actuelle.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Add the session hosts with the Trusted launch security type and select the existing managed image.", fr: "Ajouter les hôtes de session avec le type de sécurité Trusted launch et sélectionner l'image managée existante." } }
    - { id: b, text: { en: "Build a Generation 2 image VM and capture it to an Azure Compute Gallery image definition that supports Trusted launch.", fr: "Créer une machine virtuelle d'image de génération 2 et la capturer dans une définition d'image Azure Compute Gallery qui prend en charge Trusted launch." } }
    - { id: c, text: { en: "Enable Secure Boot and vTPM in the properties of the existing managed image.", fr: "Activer Secure Boot et le vTPM dans les propriétés de l'image managée existante." } }
    - { id: d, text: { en: "Import the managed image into a Generation 1 image definition in Azure Compute Gallery.", fr: "Importer l'image managée dans une définition d'image de génération 1 d'Azure Compute Gallery." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Trusted launch requires Generation 2 VMs and doesn't support managed images; Microsoft says to use Azure Compute Gallery instead. You therefore need a Gen2 image with the same applications, stored as a version of a gallery image definition whose security type supports Trusted launch.
    fr: |
      Trusted launch exige des machines virtuelles de génération 2 et ne prend pas en charge les images managées ; Microsoft indique d'utiliser Azure Compute Gallery à la place. Il faut donc une image Gen2 avec les mêmes applications, stockée comme version d'une définition d'image de galerie dont le type de sécurité prend en charge Trusted launch.
  options:
    a: { en: "Managed images aren't supported with Trusted launch, and this one is Generation 1.", fr: "Les images managées ne sont pas prises en charge avec Trusted launch, et celle-ci est de génération 1." }
    c: { en: "A managed image has no Secure Boot or vTPM setting; these are VM security settings that need a Gen2 VM.", fr: "Une image managée n'a pas de paramètre Secure Boot ou vTPM ; ce sont des paramètres de sécurité de machine virtuelle qui exigent une machine virtuelle Gen2." }
    d: { en: "A Generation 1 image definition still can't be used for Trusted launch VMs.", fr: "Une définition d'image de génération 1 reste inutilisable pour des machines virtuelles Trusted launch." }
references:
  - title: Trusted Launch for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
