id: az140-cs4b-webauthn
objective: "2.1.5"
type: single
caseStudy: az140-cs4b-proseware
difficulty: 1
status: draft
stem:
  en: |
    Contractors report that when a Proseware web app opened in their RemoteApp session asks for their FIDO2 security key, the authentication can't use the key connected to their local device.

    You need to meet the passwordless requirement for HP-Contractors. What should you do?
  fr: |
    Les prestataires signalent que, quand une application web de Proseware ouverte dans leur session RemoteApp demande leur clé de sécurité FIDO2, l'authentification ne peut pas utiliser la clé branchée sur leur appareil local.

    Vous devez satisfaire l'exigence « sans mot de passe dans la session » pour HP-Contractors. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace redirectwebauthn:i:0 with redirectwebauthn:i:1 in the custom RDP properties.", fr: "Remplacer redirectwebauthn:i:0 par redirectwebauthn:i:1 dans les propriétés RDP personnalisées." } }
    - { id: b, text: { en: "Add redirectsmartcards:i:1 to the custom RDP properties.", fr: "Ajouter redirectsmartcards:i:1 aux propriétés RDP personnalisées." } }
    - { id: c, text: { en: "Replace enablerdsaadauth:i:1 with enablerdsaadauth:i:0 in the custom RDP properties.", fr: "Remplacer enablerdsaadauth:i:1 par enablerdsaadauth:i:0 dans les propriétés RDP personnalisées." } }
    - { id: d, text: { en: "Add targetisaadjoined:i:1 to the custom RDP properties.", fr: "Ajouter targetisaadjoined:i:1 aux propriétés RDP personnalisées." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In-session passwordless authentication relies on WebAuthn redirection: with redirectwebauthn:i:1, the default value, WebAuthn requests made in the session are redirected to the local device, so the user can complete them with a locally connected security key or Windows Hello for Business. HP-Contractors sets the property to 0, which keeps the requests in the remote session. Changing only this value leaves the other RDP settings unchanged.
    fr: |
      L'authentification sans mot de passe dans la session repose sur la redirection WebAuthn : avec redirectwebauthn:i:1, la valeur par défaut, les requêtes WebAuthn de la session sont redirigées vers l'appareil local, et l'utilisateur peut les terminer avec une clé de sécurité branchée localement ou Windows Hello Entreprise. HP-Contractors définit cette propriété sur 0, ce qui garde les requêtes dans la session distante. Modifier uniquement cette valeur laisse les autres paramètres RDP inchangés.
  options:
    b: { en: "Smart card redirection makes local smart cards available in the session; FIDO2 security keys are used through WebAuthn redirection.", fr: "La redirection des cartes à puce rend les cartes à puce locales disponibles dans la session ; les clés de sécurité FIDO2 passent par la redirection WebAuthn." }
    c: { en: "enablerdsaadauth:i:1 enables Microsoft Entra single sign-on to the session hosts; disabling it changes another RDP setting and doesn't redirect WebAuthn requests.", fr: "enablerdsaadauth:i:1 active l'authentification unique Microsoft Entra vers les hôtes de session ; la désactiver modifie un autre paramètre RDP et ne redirige pas les requêtes WebAuthn." }
    d: { en: "targetisaadjoined:i:1 lets clients that can't use Microsoft Entra authentication connect with a user name and password; it has no effect on WebAuthn.", fr: "targetisaadjoined:i:1 permet aux clients qui ne peuvent pas utiliser l'authentification Microsoft Entra de se connecter avec un nom d'utilisateur et un mot de passe ; elle n'a aucun effet sur WebAuthn." }
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
