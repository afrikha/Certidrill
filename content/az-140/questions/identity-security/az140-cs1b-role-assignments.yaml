id: az140-cs1b-role-assignments
objective: "2.1.3"
type: dragdrop
caseStudy: az140-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to assign Azure roles to meet the access and cost requirements.

    Which role should you assign to each principal? To answer, drag the appropriate roles to the correct principals. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles Azure pour satisfaire les exigences d'accès et de coûts.

    Quel rôle devez-vous attribuer à chaque principal ? Pour répondre, faites glisser les rôles appropriés vers les principaux correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vmuser, text: Virtual Machine User Login }
    - { id: vmadmin, text: Virtual Machine Administrator Login }
    - { id: vmcontrib, text: Virtual Machine Contributor }
    - { id: dvuser, text: Desktop Virtualization User }
    - { id: poweron, text: Desktop Virtualization Power On Contributor }
    - { id: poweronoff, text: Desktop Virtualization Power On Off Contributor }
  targets:
    - id: designers
      text: { en: "Designers, on RG-AVD-Hosts", fr: "Designers, sur RG-AVD-Hosts" }
    - id: admins
      text: { en: "LP-Admins, on RG-AVD-Hosts", fr: "LP-Admins, sur RG-AVD-Hosts" }
    - id: avdsp
      text: { en: "Azure Virtual Desktop service principal, on the subscription", fr: "Principal de service Azure Virtual Desktop, sur l'abonnement" }
answer:
  mapping: { designers: vmuser, admins: vmadmin, avdsp: poweronoff }
explanation:
  correct:
    en: |
      For Microsoft Entra joined session hosts in a host pool without a session host configuration, users need Virtual Machine User Login to sign in, and administrators need Virtual Machine Administrator Login to get local administrator rights. The cost requirement needs desktops to be deallocated as well as started, which autoscale does with the Desktop Virtualization Power On Off Contributor role assigned to the service principal at the subscription scope.
    fr: |
      Pour des hôtes de session joints à Microsoft Entra dans un pool d'hôtes sans configuration d'hôte de session, les utilisateurs ont besoin de Virtual Machine User Login pour se connecter, et les administrateurs de Virtual Machine Administrator Login pour obtenir les droits d'administrateur local. L'exigence de coûts impose de libérer les bureaux en plus de les démarrer, ce que fait la mise à l'échelle automatique avec le rôle Desktop Virtualization Power On Off Contributor attribué au principal de service à l'étendue de l'abonnement.
  options:
    poweron: { en: "Desktop Virtualization Power On Contributor only lets the service start VMs (Start VM on Connect); it cannot deallocate them.", fr: "Desktop Virtualization Power On Contributor permet seulement au service de démarrer les machines virtuelles (Start VM on Connect) ; il ne peut pas les libérer." }
    dvuser: { en: "Desktop Virtualization User is granted through the application group assignment, which already exists; it does not allow sign-in to an Entra joined VM.", fr: "Desktop Virtualization User est accordé par l'attribution du groupe d'applications, qui existe déjà ; il ne permet pas de se connecter à une machine virtuelle jointe à Microsoft Entra." }
    vmcontrib: { en: "Virtual Machine Contributor manages VM resources in Azure but grants no sign-in or local administrator rights inside Windows.", fr: "Virtual Machine Contributor gère les ressources de machines virtuelles dans Azure, mais n'accorde ni connexion ni droits d'administrateur local dans Windows." }
references:
  - title: Microsoft Entra joined session hosts in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
