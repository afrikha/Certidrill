id: az140-2b-net-firewall-hostpool
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a hub-and-spoke network. An Azure Firewall named FW1 in the hub uses a firewall policy that has DNS proxy enabled. A spoke virtual network contains two subnets: one for the session hosts of HostPool1 and one for the session hosts of HostPool2. User-defined routes send all the traffic from both subnets to FW1.

    You need to create the firewall policy rules that allow the session hosts of HostPool1 to reach the Azure Virtual Desktop service. The rules must not apply to HostPool2 and must minimize administrative effort.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un réseau hub-and-spoke. Un Pare-feu Azure nommé FW1 dans le hub utilise une stratégie de pare-feu dans laquelle le proxy DNS est activé. Un réseau virtuel spoke contient deux sous-réseaux : un pour les hôtes de session de HostPool1 et un pour les hôtes de session de HostPool2. Des itinéraires définis par l'utilisateur envoient tout le trafic des deux sous-réseaux vers FW1.

    Vous devez créer les règles de la stratégie de pare-feu qui permettent aux hôtes de session de HostPool1 de joindre le service Azure Virtual Desktop. Les règles ne doivent pas s'appliquer à HostPool2 et doivent réduire au minimum l'effort d'administration.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an IP group that contains the session hosts of HostPool1 and use it as the source of the rules.", fr: "Créer un groupe IP qui contient les hôtes de session de HostPool1 et l'utiliser comme source des règles." } }
    - { id: b, text: { en: "Enable TLS inspection on the application rule collection that allows the Azure Virtual Desktop traffic.", fr: "Activer l'inspection TLS sur la collection de règles d'application qui autorise le trafic Azure Virtual Desktop." } }
    - { id: c, text: { en: "Create a DNAT rule that translates TCP 3389 on the public IP address of FW1 to the session hosts.", fr: "Créer une règle DNAT qui traduit TCP 3389 de l'adresse IP publique de FW1 vers les hôtes de session." } }
    - { id: d, text: { en: "Add an application rule that uses the WindowsVirtualDesktop FQDN tag as its destination.", fr: "Ajouter une règle d'application qui utilise l'étiquette FQDN WindowsVirtualDesktop comme destination." } }
    - { id: e, text: { en: "Use the VirtualNetwork service tag as the source of the rules.", fr: "Utiliser l'étiquette de service VirtualNetwork comme source des règles." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Microsoft recommends the WindowsVirtualDesktop FQDN tag to cover the required Azure Virtual Desktop FQDNs in one application rule, with network rules for the remaining endpoints. To scope the rules to one host pool, you create an IP group of its session hosts and use it as the source.
    fr: |
      Microsoft recommande l'étiquette FQDN WindowsVirtualDesktop pour couvrir les FQDN Azure Virtual Desktop requis dans une seule règle d'application, avec des règles de réseau pour les autres points de terminaison. Pour limiter les règles à un pool d'hôtes, vous créez un groupe IP de ses hôtes de session et l'utilisez comme source.
  options:
    b: { en: "Microsoft states that TLS inspection must not be used with Azure Virtual Desktop traffic.", fr: "Microsoft indique que l'inspection TLS ne doit pas être utilisée avec le trafic Azure Virtual Desktop." }
    c: { en: "Users connect through the Azure Virtual Desktop gateway; publishing RDP with DNAT isn't needed and exposes the hosts.", fr: "Les utilisateurs se connectent par la passerelle Azure Virtual Desktop ; publier RDP par DNAT n'est pas nécessaire et expose les hôtes." }
    e: { en: "VirtualNetwork includes both subnets and peered networks, so the rules would also apply to HostPool2.", fr: "VirtualNetwork inclut les deux sous-réseaux et les réseaux reliés par peering : les règles s'appliqueraient aussi à HostPool2." }
references:
  - title: Use Azure Firewall to protect Azure Virtual Desktop deployments
    url: https://learn.microsoft.com/en-us/azure/firewall/protect-azure-virtual-desktop
