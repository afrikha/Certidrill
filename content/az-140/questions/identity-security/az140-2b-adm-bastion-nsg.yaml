id: az140-2b-adm-bastion-nsg
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum deploys Azure Bastion Standard in a hub virtual network. AzureBastionSubnet uses the address range 10.0.0.0/26. The Azure Virtual Desktop session hosts are in a subnet named snet-hosts in a peered spoke virtual network.

    To block lateral movement, an administrator added an inbound rule with priority 4000 that denies all traffic to the network security group (NSG) of snet-hosts. Since then, Bastion connections to the session hosts fail.

    You need to restore Bastion connectivity. The solution must minimize the exposure of the session hosts.

    What should you do?
  fr: |
    Adatum déploie Azure Bastion Standard dans un réseau virtuel hub. AzureBastionSubnet utilise la plage d'adresses 10.0.0.0/26. Les hôtes de session Azure Virtual Desktop se trouvent dans un sous-réseau nommé snet-hosts d'un réseau virtuel spoke relié par peering.

    Pour bloquer les déplacements latéraux, un administrateur a ajouté au groupe de sécurité réseau (NSG) de snet-hosts une règle entrante de priorité 4000 qui refuse tout le trafic. Depuis, les connexions Bastion vers les hôtes de session échouent.

    Vous devez rétablir la connectivité Bastion. La solution doit réduire au minimum l'exposition des hôtes de session.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the NSG of snet-hosts, add an inbound rule with priority 3900 that allows TCP 443 from the Internet service tag.", fr: "Dans le NSG de snet-hosts, ajouter une règle entrante de priorité 3900 qui autorise TCP 443 depuis l'étiquette de service Internet." } }
    - { id: b, text: { en: "In the NSG of AzureBastionSubnet, add an inbound rule with priority 3900 that allows TCP 3389 from snet-hosts.", fr: "Dans le NSG d'AzureBastionSubnet, ajouter une règle entrante de priorité 3900 qui autorise TCP 3389 depuis snet-hosts." } }
    - { id: c, text: { en: "Assign a Standard SKU public IP address to each session host and connect through it from Bastion.", fr: "Attribuer une adresse IP publique de SKU Standard à chaque hôte de session et s'y connecter depuis Bastion." } }
    - { id: d, text: { en: "In the NSG of snet-hosts, add an inbound rule with priority 3900 that allows TCP 3389 from 10.0.0.0/26.", fr: "Dans le NSG de snet-hosts, ajouter une règle entrante de priorité 3900 qui autorise TCP 3389 depuis 10.0.0.0/26." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Bastion reaches target VMs on their private IP addresses over RDP (3389) or SSH (22), so the NSG of the target subnet must allow that port from AzureBastionSubnet. The rule must have a lower priority number than the deny rule, and scoping the source to the Bastion subnet range keeps the exposure minimal.
    fr: |
      Bastion joint les machines virtuelles cibles sur leurs adresses IP privées en RDP (3389) ou SSH (22) : le NSG du sous-réseau cible doit autoriser ce port depuis AzureBastionSubnet. La règle doit avoir un numéro de priorité inférieur à celui de la règle de refus, et limiter la source à la plage du sous-réseau Bastion réduit l'exposition au minimum.
  options:
    a: { en: "Port 443 from the internet is needed inbound on AzureBastionSubnet, not on the session host subnet.", fr: "Le port 443 depuis Internet est nécessaire en entrée sur AzureBastionSubnet, pas sur le sous-réseau des hôtes de session." }
    b: { en: "The traffic flows from Bastion to the session hosts; an inbound 3389 rule on the Bastion subnet doesn't open the target subnet.", fr: "Le trafic va de Bastion vers les hôtes de session ; une règle entrante 3389 sur le sous-réseau Bastion n'ouvre pas le sous-réseau cible." }
    c: { en: "Bastion doesn't need public IP addresses on target VMs; adding them increases exposure.", fr: "Bastion n'a pas besoin d'adresses IP publiques sur les machines virtuelles cibles ; en ajouter augmente l'exposition." }
references:
  - title: Configure NSG rules for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
