id: az140-cs2b-sso
objective: "2.1.7"
type: multi
caseStudy: az140-cs2b-bellows
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the sign-in requirement for HP-Labs.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence de connexion pour HP-Labs.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "On the Windows Cloud Login service principal, enable the Microsoft Entra ID authentication protocol for remote desktop connections."
        fr: "Sur le principal de service Windows Cloud Login, activer le protocole d'authentification Microsoft Entra ID pour les connexions Bureau à distance."
    - id: b
      text:
        en: "In the custom RDP properties of HP-Labs, add `enablerdsaadauth:i:1`."
        fr: "Dans les propriétés RDP personnalisées de HP-Labs, ajouter `enablerdsaadauth:i:1`."
    - id: c
      text:
        en: "In the custom RDP properties of HP-Labs, add `targetisaadjoined:i:1`."
        fr: "Dans les propriétés RDP personnalisées de HP-Labs, ajouter `targetisaadjoined:i:1`."
    - id: d
      text:
        en: "In the Microsoft Entra tenant, create a Kerberos Server object for the session hosts."
        fr: "Dans le locataire Microsoft Entra, créer un objet serveur Kerberos pour les hôtes de session."
    - id: e
      text:
        en: "In the custom RDP properties of HP-Labs, add `redirectwebauthn:i:1`."
        fr: "Dans les propriétés RDP personnalisées de HP-Labs, ajouter `redirectwebauthn:i:1`."
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Single sign-on with Microsoft Entra authentication works from every client platform. You enable the Microsoft Entra ID authentication protocol for RDP on the Windows Cloud Login service principal, and you set the host pool RDP property enablerdsaadauth to 1 (in the portal, Microsoft Entra single sign-on).
    fr: |
      L'authentification unique avec l'authentification Microsoft Entra fonctionne depuis toutes les plateformes clientes. Vous activez le protocole d'authentification Microsoft Entra ID pour RDP sur le principal de service Windows Cloud Login, et vous définissez la propriété RDP enablerdsaadauth du pool d'hôtes sur 1 (dans le portail, Microsoft Entra single sign-on).
  options:
    c: { en: "targetisaadjoined:i:1 lets other clients connect to Microsoft Entra joined hosts, but only with a user name and password entered at each connection.", fr: "targetisaadjoined:i:1 permet aux autres clients de se connecter aux hôtes joints à Microsoft Entra, mais uniquement avec un nom d'utilisateur et un mot de passe saisis à chaque connexion." }
    d: { en: "A Kerberos Server object is needed for hybrid joined hosts or when Active Directory domain controllers exist; Bellows has none.", fr: "Un objet serveur Kerberos est nécessaire pour les hôtes joints hybrides ou quand des contrôleurs de domaine Active Directory existent ; Bellows n'en a aucun." }
    e: { en: "WebAuthn redirection lets local authenticators answer authentication requests made inside the session; it does not provide single sign-on to the session host.", fr: "La redirection WebAuthn permet aux authentificateurs locaux de répondre aux demandes d'authentification faites dans la session ; elle ne fournit pas l'authentification unique vers l'hôte de session." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
