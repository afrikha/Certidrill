id: az140-2a-ca-behavior-statements
objective: "2.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a Conditional Access policy named **CA-AVD** that targets the Azure Virtual Desktop app, requires multifactor authentication, and sets the sign-in frequency to periodic reauthentication every 4 hours. Single sign-on isn't enabled. Users often keep a remote session connected for a full working day.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une stratégie d'accès conditionnel nommée **CA-AVD** qui cible l'application Azure Virtual Desktop, exige l'authentification multifacteur et définit la fréquence de connexion sur une réauthentification périodique toutes les 4 heures. L'authentification unique n'est pas activée. Les utilisateurs gardent souvent une session à distance connectée pendant toute une journée de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user whose connection has been open for five hours is prompted for MFA within the session, without disconnecting.
        fr: Un utilisateur dont la connexion est ouverte depuis cinq heures reçoit une demande d'authentification multifacteur dans la session, sans être déconnecté.
    - id: s2
      text:
        en: A location condition in CA-AVD is evaluated against the IP address of the user's client.
        fr: Une condition d'emplacement dans CA-AVD est évaluée par rapport à l'adresse IP du client de l'utilisateur.
    - id: s3
      text:
        en: To require MFA when users retrieve their feed, you should also target the Azure Virtual Desktop Azure Resource Manager Provider app.
        fr: Pour exiger l'authentification multifacteur quand les utilisateurs récupèrent leur flux, vous devez aussi cibler l'application Azure Virtual Desktop Azure Resource Manager Provider.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Reauthentication happens only when a new access token is needed: once a connection is established, users aren't prompted even if it lasts longer than the sign-in frequency. For the Azure Virtual Desktop app, location-based conditions are evaluated against the user's client IP address. The Azure Resource Manager Provider app is only used to retrieve the feed and must not be targeted with MFA.
    fr: |
      La réauthentification n'a lieu que lorsqu'un nouveau jeton d'accès est nécessaire : une fois la connexion établie, les utilisateurs ne reçoivent pas de demande même si elle dure plus longtemps que la fréquence de connexion. Pour l'application Azure Virtual Desktop, les conditions d'emplacement sont évaluées par rapport à l'adresse IP du client de l'utilisateur. L'application Azure Resource Manager Provider sert uniquement à récupérer le flux et ne doit pas être ciblée par l'authentification multifacteur.
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
