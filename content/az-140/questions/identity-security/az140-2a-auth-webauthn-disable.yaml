id: az140-2a-auth-webauthn-disable
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a host pool named **HP-Kiosk**. A new security requirement states that WebAuthn requests made by websites and apps in the remote sessions of HP-Kiosk must be completed in the remote session and must never be sent to the users' local devices.

    You need to meet the requirement by changing the RDP properties of HP-Kiosk.

    Which RDP property should you set?
  fr: |
    Fabrikam dispose d'un pool d'hôtes nommé **HP-Kiosk**. Une nouvelle exigence de sécurité impose que les requêtes WebAuthn effectuées par les sites web et les applications dans les sessions à distance de HP-Kiosk soient traitées dans la session à distance et ne soient jamais envoyées aux appareils locaux des utilisateurs.

    Vous devez répondre à l'exigence en modifiant les propriétés RDP de HP-Kiosk.

    Quelle propriété RDP devez-vous définir ?
body:
  options:
    - { id: a, text: "redirectsmartcards:i:0" }
    - { id: b, text: "enablerdsaadauth:i:0" }
    - { id: c, text: "enablecredsspsupport:i:0" }
    - { id: d, text: "redirectwebauthn:i:0" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      redirectwebauthn controls whether WebAuthn requests from the remote session are redirected to the local device. Its default value, 1, sends them to local authenticators such as Windows Hello for Business or security keys; 0 requires them to be completed in the remote session. In the portal, it's the WebAuthn redirection setting on the Device redirection tab.
    fr: |
      redirectwebauthn détermine si les requêtes WebAuthn de la session à distance sont redirigées vers l'appareil local. Sa valeur par défaut, 1, les envoie aux authentificateurs locaux comme Windows Hello Entreprise ou les clés de sécurité ; 0 impose qu'elles soient traitées dans la session à distance. Dans le portail, c'est le paramètre Redirection WebAuthn de l'onglet Redirection d'appareil.
  options:
    a: { en: "This stops redirecting smart cards, not WebAuthn requests.", fr: "Ce paramètre arrête la redirection des cartes à puce, pas celle des requêtes WebAuthn." }
    b: { en: "This disables Microsoft Entra authentication (single sign-on) to the session host; WebAuthn redirection stays enabled.", fr: "Ce paramètre désactive l'authentification Microsoft Entra (authentification unique) auprès de l'hôte de session ; la redirection WebAuthn reste activée." }
    c: { en: "This stops the client from using CredSSP for authentication; it doesn't affect WebAuthn.", fr: "Ce paramètre empêche le client d'utiliser CredSSP pour l'authentification ; il n'a pas d'effet sur WebAuthn." }
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
  - title: Configure WebAuthn redirection over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-webauthn
