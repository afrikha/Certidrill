id: az140-cs2c-defender
objective: "2.2.3"
type: single
caseStudy: az140-cs2c-humongous
difficulty: 2
status: draft
stem:
  en: |
    You download the Defender for Endpoint onboarding package by selecting the deployment method **VDI onboarding scripts for non-persistent endpoints**. You need to meet the endpoint protection requirement for the pooled session hosts.

    What should you do?
  fr: |
    Vous téléchargez le package d'intégration de Defender for Endpoint en sélectionnant la méthode de déploiement **VDI onboarding scripts for non-persistent endpoints**. Vous devez respecter l'exigence de protection des points de terminaison pour les hôtes de session des pools Pooled.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Copy Onboard-NonPersistentMachine.ps1 and WindowsDefenderATPOnboardingScript.cmd to the startup scripts folder of the golden image, and add Onboard-NonPersistentMachine.ps1 as a PowerShell startup script."
        fr: "Copier Onboard-NonPersistentMachine.ps1 et WindowsDefenderATPOnboardingScript.cmd dans le dossier des scripts de démarrage de l'image de référence, et ajouter Onboard-NonPersistentMachine.ps1 comme script de démarrage PowerShell."
    - id: b
      text:
        en: "Copy WindowsDefenderATPOnboardingScript.cmd to the startup scripts folder of the golden image, and add it as a startup script on the Scripts tab of the startup script settings."
        fr: "Copier WindowsDefenderATPOnboardingScript.cmd dans le dossier des scripts de démarrage de l'image de référence, et l'ajouter comme script de démarrage dans l'onglet Scripts des paramètres de script de démarrage."
    - id: c
      text:
        en: "Run WindowsDefenderATPOnboardingScript.cmd on the golden image VM, and then generalize and capture the image to Azure Compute Gallery."
        fr: "Exécuter WindowsDefenderATPOnboardingScript.cmd sur la machine virtuelle de l'image de référence, puis généraliser et capturer l'image dans Azure Compute Gallery."
    - id: d
      text:
        en: "Run Onboard-NonPersistentMachine.ps1 on the golden image VM, and then generalize and capture the image to Azure Compute Gallery."
        fr: "Exécuter Onboard-NonPersistentMachine.ps1 sur la machine virtuelle de l'image de référence, puis généraliser et capturer l'image dans Azure Compute Gallery."
answer: { optionId: a }
explanation:
  correct:
    en: |
      For non-persistent VDI with a single entry per device, you copy both files to C:\Windows\System32\GroupPolicy\Machine\Scripts\Startup in the image and add only Onboard-NonPersistentMachine.ps1 on the PowerShell Scripts tab; it calls the .cmd file. The script runs at startup after the VM has its final name, so a re-created session host with the same name reuses its device entry.
    fr: |
      Pour une VDI non persistante avec une seule entrée par appareil, vous copiez les deux fichiers dans C:\Windows\System32\GroupPolicy\Machine\Scripts\Startup dans l'image et n'ajoutez que Onboard-NonPersistentMachine.ps1 dans l'onglet PowerShell Scripts ; il appelle le fichier .cmd. Le script s'exécute au démarrage, une fois que la machine virtuelle a son nom définitif : un hôte de session recréé avec le même nom réutilise donc son entrée d'appareil.
  options:
    b: { en: "Running the .cmd file alone as a startup script is the multiple-entries model: each provisioned VM gets a new device entry.", fr: "Exécuter seul le fichier .cmd comme script de démarrage correspond au modèle à entrées multiples : chaque machine virtuelle provisionnée obtient une nouvelle entrée d'appareil." }
    c: { en: "The golden image must not be onboarded; cloning an onboarded image can duplicate its senseGuid.", fr: "L'image de référence ne doit pas être intégrée ; cloner une image intégrée peut dupliquer son senseGuid." }
    d: { en: "The golden image must not be onboarded, and the script must run only after the VM has its final name and final provisioning restart.", fr: "L'image de référence ne doit pas être intégrée, et le script ne doit s'exécuter qu'une fois que la machine virtuelle a son nom définitif et a effectué son dernier redémarrage de provisionnement." }
references:
  - title: Onboard non-persistent VDI devices to Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/configure-endpoints-vdi
