id: az140-cs4a-app-control
objective: "2.2.6"
type: yesno_statements
caseStudy: az140-cs4a-woodgrove-bank
difficulty: 2
status: draft
stem:
  en: |
    You are planning the Windows threat protection features that will meet the application control requirement on the session hosts of HP-Agents and HP-Analysts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez les fonctionnalités de protection contre les menaces de Windows qui satisferont l'exigence de contrôle des applications sur les hôtes de session de HP-Agents et HP-Analysts.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Because HP-Analysts publishes only CreditScore and Excel as RemoteApp programs, the analysts can't start other executables on its session hosts.
        fr: |
          Comme HP-Analysts ne publie que CreditScore et Excel en tant que programmes RemoteApp, les analystes ne peuvent pas lancer d'autres exécutables sur ses hôtes de session.
    - id: s2
      text:
        en: |
          An App Control for Business policy that targets the session hosts applies to every user who signs in to them.
        fr: |
          Une stratégie App Control for Business qui cible les hôtes de session s'applique à tous les utilisateurs qui s'y connectent.
    - id: s3
      text:
        en: |
          You can enable Controlled folder access in block mode on the pilot session hosts while their antivirus configuration stays unchanged.
        fr: |
          Vous pouvez activer l'accès contrôlé aux dossiers en mode blocage sur les hôtes de session du pilote sans modifier leur configuration antivirus.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      RemoteApp isn't a security feature: publishing a few applications doesn't stop a user from launching other code on the session host, so you need App Control for Business (or AppLocker) to allow only approved applications. App Control policies apply at the device level and affect every user of the session host equally, which matches the requirement for every user. Controlled folder access is a Microsoft Defender Antivirus feature that works only when Defender Antivirus is the primary antivirus in active mode with real-time protection; on the pilot hosts it runs in passive mode, so Controlled folder access must wait for the replacement of Fabrikam Endpoint Shield.
    fr: |
      RemoteApp n'est pas une fonctionnalité de sécurité : publier quelques applications n'empêche pas un utilisateur de lancer un autre code sur l'hôte de session ; il faut App Control for Business (ou AppLocker) pour n'autoriser que les applications approuvées. Les stratégies App Control s'appliquent au niveau de l'appareil et concernent de la même façon tous les utilisateurs de l'hôte de session, ce qui correspond à l'exigence « pour tous les utilisateurs ». L'accès contrôlé aux dossiers est une fonctionnalité de Microsoft Defender Antivirus qui ne fonctionne que si Defender Antivirus est l'antivirus principal en mode actif avec la protection en temps réel ; sur les hôtes du pilote il s'exécute en mode passif, donc l'accès contrôlé aux dossiers doit attendre le remplacement de Fabrikam Endpoint Shield.
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
  - title: Protect folders from ransomware with controlled folder access
    url: https://learn.microsoft.com/en-us/defender-endpoint/controlled-folders
