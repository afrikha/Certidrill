id: az140-2b-wtp-cfa-ransomware
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a pooled Azure Virtual Desktop host pool. The session hosts run Windows 11 Enterprise multi-session, and Microsoft Defender Antivirus is the active antivirus with real-time protection enabled.

    You need to protect the files in the users' Documents and Pictures folders against ransomware. Only trusted applications must be able to modify those files.

    Which feature should you enable?
  fr: |
    Wingtip Toys dispose d'un pool d'hôtes regroupé Azure Virtual Desktop. Les hôtes de session exécutent Windows 11 Entreprise multisession, et Microsoft Defender Antivirus est l'antivirus actif, avec la protection en temps réel activée.

    Vous devez protéger les fichiers des dossiers Documents et Images des utilisateurs contre les rançongiciels. Seules des applications approuvées doivent pouvoir modifier ces fichiers.

    Quelle fonctionnalité devez-vous activer ?
body:
  options:
    - { id: a, text: "App Control for Business" }
    - { id: b, text: { en: "Network protection", fr: "La protection du réseau" } }
    - { id: c, text: "Microsoft Defender SmartScreen" }
    - { id: d, text: { en: "Controlled folder access", fr: "L'accès contrôlé aux dossiers" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Controlled folder access lets only trusted apps change files in protected folders; Documents and Pictures are in its default list. It's designed against ransomware and requires Microsoft Defender Antivirus in active mode with real-time protection, which the session hosts have.
    fr: |
      L'accès contrôlé aux dossiers ne laisse que les applications approuvées modifier les fichiers des dossiers protégés ; Documents et Images font partie de sa liste par défaut. Il est conçu contre les rançongiciels et exige Microsoft Defender Antivirus en mode actif avec la protection en temps réel, ce dont disposent les hôtes de session.
  options:
    a: { en: "App Control for Business controls which code can run; it doesn't control which apps can write to user folders.", fr: "App Control for Business contrôle le code qui peut s'exécuter ; il ne contrôle pas les applications qui peuvent écrire dans les dossiers des utilisateurs." }
    b: { en: "Network protection blocks connections to malicious domains; it doesn't protect files from modification.", fr: "La protection du réseau bloque les connexions vers des domaines malveillants ; elle ne protège pas les fichiers contre les modifications." }
    c: { en: "SmartScreen warns about malicious sites and downloads; it doesn't protect folders.", fr: "SmartScreen avertit des sites et téléchargements malveillants ; il ne protège pas de dossiers." }
references:
  - title: Protect folders from ransomware with controlled folder access
    url: https://learn.microsoft.com/en-us/defender-endpoint/controlled-folders
