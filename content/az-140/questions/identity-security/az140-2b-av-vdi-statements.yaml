id: az140-2b-av-vdi-statements
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum configures Microsoft Defender Antivirus on its Azure Virtual Desktop session hosts by using a Group Policy object (GPO) that follows Microsoft's VDI recommendations. The GPO enables **Suppress all notifications**, enables **Turn on catch-up quick scan**, and sets **Configure local administrator merge behavior for lists** to **Disabled**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum configure Microsoft Defender Antivirus sur ses hôtes de session Azure Virtual Desktop avec un objet de stratégie de groupe (GPO) qui suit les recommandations de Microsoft pour la VDI. Le GPO active **Suppress all notifications**, active **Turn on catch-up quick scan** et définit **Configure local administrator merge behavior for lists** sur **Disabled**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Detections on the session hosts no longer appear as alerts for the security team in the Microsoft Defender portal.
        fr: |
          Les détections sur les hôtes de session n'apparaissent plus sous forme d'alertes pour l'équipe de sécurité dans le portail Microsoft Defender.
    - id: s2
      text:
        en: |
          A session host that misses two consecutive scheduled scans runs a quick scan.
        fr: |
          Un hôte de session qui manque deux analyses planifiées consécutives exécute une analyse rapide.
    - id: s3
      text:
        en: |
          Exclusions that a local administrator adds on a session host are applied in addition to the exclusions defined in the GPO.
        fr: |
          Les exclusions qu'un administrateur local ajoute sur un hôte de session s'appliquent en plus des exclusions définies dans le GPO.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Suppress all notifications only hides scan and remediation notifications from users; security teams still see detections and alerts in the Defender portal. Catch-up quick scan runs a quick scan after a VM misses two consecutive scheduled scans. With the local administrator merge behavior disabled, only centrally managed lists apply, so local exclusions are ignored.
    fr: |
      Suppress all notifications masque seulement aux utilisateurs les notifications d'analyse et de correction ; les équipes de sécurité voient toujours les détections et les alertes dans le portail Defender. L'analyse rapide de rattrapage exécute une analyse rapide quand une machine virtuelle manque deux analyses planifiées consécutives. Avec le comportement de fusion des administrateurs locaux désactivé, seules les listes gérées de manière centralisée s'appliquent : les exclusions locales sont ignorées.
references:
  - title: Configure Microsoft Defender Antivirus on a remote desktop or virtual desktop infrastructure environment
    url: https://learn.microsoft.com/en-us/defender-endpoint/deployment-vdi-microsoft-defender-antivirus
