id: az140-cs2a-roles
objective: "2.1.3"
type: dragdrop
caseStudy: az140-cs2a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You plan to enable Start VM on Connect for HP-Eng and to assign an autoscale scaling plan to HP-Office. You need to assign Azure roles to meet the requirements.

    Which role should you assign to each principal? To answer, drag the appropriate roles to the correct principals. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'activer Start VM on Connect pour HP-Eng et d'attribuer un plan de mise à l'échelle automatique à HP-Office. Vous devez attribuer des rôles Azure pour respecter les exigences.

    Quel rôle devez-vous attribuer à chaque principal ? Pour répondre, faites glisser les rôles appropriés vers les principaux correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: on, text: Desktop Virtualization Power On Contributor }
    - { id: onoff, text: Desktop Virtualization Power On Off Contributor }
    - { id: sho, text: Desktop Virtualization Session Host Operator }
    - { id: uso, text: Desktop Virtualization User Session Operator }
    - { id: user, text: Desktop Virtualization User }
    - { id: vmc, text: Desktop Virtualization Virtual Machine Contributor }
  targets:
    - id: spEng
      text: { en: "Azure Virtual Desktop service principal, so that HP-Eng VMs start when engineers connect", fr: "Principal de service Azure Virtual Desktop, pour que les machines virtuelles HP-Eng démarrent quand les ingénieurs se connectent" }
    - id: spOffice
      text: { en: "Azure Virtual Desktop service principal, for the scaling plan of HP-Office", fr: "Principal de service Azure Virtual Desktop, pour le plan de mise à l'échelle de HP-Office" }
    - id: sup
      text: { en: "GRP-Supervisors, on HP-Office", fr: "GRP-Supervisors, sur HP-Office" }
    - id: office
      text: { en: "GRP-Office, on the desktop application group of HP-Office", fr: "GRP-Office, sur le groupe d'applications de bureau de HP-Office" }
answer:
  mapping: { spEng: on, spOffice: onoff, sup: sho, office: user }
explanation:
  correct:
    en: |
      Start VM on Connect only needs to start VMs, so Desktop Virtualization Power On Contributor is enough. A power management scaling plan starts and stops session hosts, which requires Desktop Virtualization Power On Off Contributor. Desktop Virtualization Session Host Operator lets supervisors change drain mode, and Desktop Virtualization User lets users connect to the resources of an application group.
    fr: |
      Start VM on Connect doit seulement démarrer des machines virtuelles : Desktop Virtualization Power On Contributor suffit. Un plan de mise à l'échelle avec gestion de l'alimentation démarre et arrête les hôtes de session, ce qui exige Desktop Virtualization Power On Off Contributor. Desktop Virtualization Session Host Operator permet aux superviseurs de changer le mode drainage, et Desktop Virtualization User permet aux utilisateurs de se connecter aux ressources d'un groupe d'applications.
  options:
    uso: { en: "User Session Operator manages user sessions (messages, disconnect, sign-out) but cannot change drain mode.", fr: "User Session Operator gère les sessions utilisateur (messages, déconnexion, fermeture de session) mais ne peut pas changer le mode drainage." }
    vmc: { en: "This role also creates and deletes VMs; it is needed only for dynamic scaling, not for power management or Start VM on Connect.", fr: "Ce rôle crée et supprime aussi des machines virtuelles ; il n'est nécessaire que pour la mise à l'échelle dynamique, pas pour la gestion de l'alimentation ni pour Start VM on Connect." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
  - title: Configure Start VM on Connect
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
