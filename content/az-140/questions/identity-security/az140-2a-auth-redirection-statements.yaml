id: az140-2a-auth-redirection-statements
objective: "2.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has a host pool named **HP1** whose session hosts are Microsoft Entra hybrid joined and enrolled in Microsoft Intune. Single sign-on isn't enabled. The WebAuthn redirection and smart card redirection RDP properties of HP1 are set to redirect requests and devices to the local computer.

    An Intune configuration profile applied to the session hosts sets **Do not allow WebAuthn redirection** to **Enabled**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pool d'hôtes nommé **HP1** dont les hôtes de session sont joints hybrides Microsoft Entra et inscrits dans Microsoft Intune. L'authentification unique n'est pas activée. Les propriétés RDP Redirection WebAuthn et Redirection de carte à puce de HP1 sont définies pour rediriger les requêtes et les appareils vers l'ordinateur local.

    Un profil de configuration Intune appliqué aux hôtes de session définit **Do not allow WebAuthn redirection** sur **Activé**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user who signs in to HP1 with a smart card authenticates to the session host by using Kerberos.
        fr: Un utilisateur qui se connecte à HP1 avec une carte à puce s'authentifie auprès de l'hôte de session à l'aide de Kerberos.
    - id: s2
      text:
        en: In a remote session, a website that requests WebAuthn can use the Windows Hello for Business credential of the user's local PC.
        fr: Dans une session à distance, un site web qui demande WebAuthn peut utiliser les informations d'identification Windows Hello Entreprise du PC local de l'utilisateur.
    - id: s3
      text:
        en: For an application in the session to use the redirected smart card, the smart card drivers must be installed on the session hosts.
        fr: Pour qu'une application de la session utilise la carte à puce redirigée, les pilotes de la carte doivent être installés sur les hôtes de session.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Smart card and Windows Hello for Business sign-in to the session host can only use Kerberos. For redirection, the most restrictive setting wins: the Intune policy that disables WebAuthn redirection overrides the host pool RDP property, so WebAuthn requests stay in the remote session. In-session smart card use requires the smart card drivers on the session host in addition to smart card redirection.
    fr: |
      La connexion par carte à puce et par Windows Hello Entreprise à l'hôte de session ne peut utiliser que Kerberos. Pour la redirection, le paramètre le plus restrictif l'emporte : la stratégie Intune qui désactive la redirection WebAuthn prévaut sur la propriété RDP du pool d'hôtes, et les requêtes WebAuthn restent dans la session à distance. L'utilisation d'une carte à puce dans la session exige les pilotes de la carte sur l'hôte de session en plus de la redirection de carte à puce.
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
  - title: Configure WebAuthn redirection over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-webauthn
