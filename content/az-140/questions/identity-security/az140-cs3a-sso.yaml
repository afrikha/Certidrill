id: az140-cs3a-sso
objective: "2.1.7"
type: multi
caseStudy: az140-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the sign-in requirement for the three host pools.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de connexion pour les trois pools d'hôtes.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the RDP property targetisaadjoined:i:1 to each host pool.", fr: "Ajouter la propriété RDP targetisaadjoined:i:1 à chaque pool d'hôtes." } }
    - { id: b, text: { en: "Set the RDP property enablerdsaadauth:i:1 on each host pool.", fr: "Définir la propriété RDP enablerdsaadauth:i:1 sur chaque pool d'hôtes." } }
    - { id: c, text: { en: "Assign the Virtual Machine Administrator Login role to the users at the resource group scope.", fr: "Attribuer le rôle Virtual Machine Administrator Login aux utilisateurs à l'étendue du groupe de ressources." } }
    - { id: d, text: { en: "Enable Microsoft Entra authentication for RDP on the Windows Cloud Login service principal.", fr: "Activer l'authentification Microsoft Entra pour RDP sur le principal de service Windows Cloud Login." } }
    - { id: e, text: { en: "Join the session hosts to a Microsoft Entra Domain Services managed domain.", fr: "Joindre les hôtes de session à un domaine managé Microsoft Entra Domain Services." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Single sign-on with Microsoft Entra ID requires two changes. In the tenant, you set isRemoteDesktopProtocolEnabled to true on the Windows Cloud Login service principal (portal setting "Enable Microsoft Entra ID authentication protocol"). On each host pool, you set the RDP property enablerdsaadauth:i:1, which the portal shows as Microsoft Entra single sign-on. The session hosts are already Microsoft Entra joined, which is a supported join type.
    fr: |
      L'authentification unique avec Microsoft Entra ID demande deux modifications. Dans le locataire, vous définissez isRemoteDesktopProtocolEnabled sur true pour le principal de service Windows Cloud Login (paramètre du portail « Enable Microsoft Entra ID authentication protocol »). Sur chaque pool d'hôtes, vous définissez la propriété RDP enablerdsaadauth:i:1, que le portail présente comme l'authentification unique Microsoft Entra. Les hôtes de session sont déjà joints à Microsoft Entra, un type de jonction pris en charge.
  options:
    a: { en: "targetisaadjoined:i:1 lets clients connect to Microsoft Entra joined hosts but restricts sign-in to a user name and password; it doesn't provide SSO and is being replaced by enablerdsaadauth.", fr: "targetisaadjoined:i:1 permet aux clients de se connecter à des hôtes joints à Microsoft Entra mais limite la connexion au nom d'utilisateur et au mot de passe ; elle ne fournit pas de SSO et est remplacée par enablerdsaadauth." }
    c: { en: "This role grants local administrator rights on the VMs. It doesn't enable SSO and breaks least privilege for standard users.", fr: "Ce rôle accorde des droits d'administrateur local sur les machines virtuelles. Il n'active pas le SSO et ne respecte pas le moindre privilège pour des utilisateurs standard." }
    e: { en: "SSO is supported only on Microsoft Entra joined or Microsoft Entra hybrid joined session hosts, not on hosts joined to Microsoft Entra Domain Services.", fr: "Le SSO n'est pris en charge que sur des hôtes de session joints à Microsoft Entra ou joints à Microsoft Entra hybride, pas sur des hôtes joints à Microsoft Entra Domain Services." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
