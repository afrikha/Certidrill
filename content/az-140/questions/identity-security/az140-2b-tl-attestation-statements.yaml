id: az140-2b-tl-attestation-statements
objective: "2.2.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam replaces its Standard security type session hosts with Trusted launch session hosts in Azure Virtual Desktop. Microsoft Defender for Cloud monitors the subscription.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam remplace ses hôtes de session de type de sécurité Standard par des hôtes de session Trusted launch (lancement sécurisé) dans Azure Virtual Desktop. Microsoft Defender pour le cloud supervise l'abonnement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The Trusted launch session hosts cost more per hour than Standard security type VMs of the same size.
        fr: |
          Les hôtes de session Trusted launch coûtent plus cher à l'heure que des machines virtuelles de type de sécurité Standard de même taille.
    - id: s2
      text:
        en: |
          Boot integrity monitoring of a session host requires Secure Boot, vTPM and the Guest Attestation extension.
        fr: |
          La surveillance de l'intégrité du démarrage d'un hôte de session exige Secure Boot, le vTPM et l'extension Guest Attestation.
    - id: s3
      text:
        en: |
          Defender for Cloud raises an alert when a session host's boot log deviates from a trusted baseline.
        fr: |
          Defender pour le cloud déclenche une alerte quand le journal de démarrage d'un hôte de session s'écarte d'une base de référence approuvée.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Trusted launch doesn't increase the existing VM price. Attestation needs Secure Boot and vTPM enabled and the Guest Attestation extension installed; Defender for Cloud recommends installing the extension when it's missing. The VM attestation failure alert (medium severity) fires when the boot log deviates from the trusted baseline.
    fr: |
      Trusted launch n'augmente pas le prix existant des machines virtuelles. L'attestation exige Secure Boot et le vTPM activés et l'extension Guest Attestation installée ; Defender pour le cloud recommande d'installer l'extension quand elle manque. L'alerte d'échec d'attestation de machine virtuelle (gravité moyenne) se déclenche quand le journal de démarrage s'écarte de la base de référence approuvée.
references:
  - title: Trusted Launch for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
