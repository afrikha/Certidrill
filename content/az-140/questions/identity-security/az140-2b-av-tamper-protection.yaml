id: az140-2b-av-tamper-protection
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure Virtual Desktop host pool. Microsoft Defender Antivirus protects the session hosts, and its settings are managed centrally by Microsoft Intune.

    During an incident, an attacker who gained local administrator rights on a session host turned off real-time protection.

    You need to prevent Microsoft Defender Antivirus protection features from being turned off on the session hosts by local changes.

    What should you enable?
  fr: |
    Proseware dispose d'un pool d'hôtes Azure Virtual Desktop. Microsoft Defender Antivirus protège les hôtes de session, et ses paramètres sont gérés de manière centralisée par Microsoft Intune.

    Lors d'un incident, un attaquant qui avait obtenu des droits d'administrateur local sur un hôte de session a désactivé la protection en temps réel.

    Vous devez empêcher que les fonctionnalités de protection de Microsoft Defender Antivirus soient désactivées sur les hôtes de session par des modifications locales.

    Que devez-vous activer ?
body:
  options:
    - { id: a, text: { en: "Controlled folder access", fr: "L'accès contrôlé aux dossiers" } }
    - { id: b, text: { en: "Tamper protection", fr: "La protection contre les falsifications" } }
    - { id: c, text: { en: "Cloud-delivered protection", fr: "La protection fournie par le cloud" } }
    - { id: d, text: { en: "Network protection", fr: "La protection du réseau" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Tamper protection prevents Microsoft Defender Antivirus from being turned off or having its protection features changed outside central management, including by local administrators and malicious apps. Microsoft lists it among the settings to enable on VDI session hosts.
    fr: |
      La protection contre les falsifications empêche la désactivation de Microsoft Defender Antivirus ou la modification de ses fonctionnalités de protection en dehors de la gestion centralisée, y compris par des administrateurs locaux et des applications malveillantes. Microsoft la cite parmi les paramètres à activer sur les hôtes de session VDI.
  options:
    a: { en: "Controlled folder access protects folders against changes by untrusted apps; it doesn't protect the antivirus settings.", fr: "L'accès contrôlé aux dossiers protège des dossiers contre les modifications par des applications non approuvées ; il ne protège pas les paramètres de l'antivirus." }
    c: { en: "Cloud-delivered protection improves detection by querying the cloud; it doesn't stop an administrator from turning protection off.", fr: "La protection fournie par le cloud améliore la détection en interrogeant le cloud ; elle n'empêche pas un administrateur de désactiver la protection." }
    d: { en: "Network protection blocks connections to malicious domains; it doesn't protect the antivirus configuration.", fr: "La protection du réseau bloque les connexions vers des domaines malveillants ; elle ne protège pas la configuration de l'antivirus." }
references:
  - title: Configure Microsoft Defender Antivirus on a remote desktop or virtual desktop infrastructure environment
    url: https://learn.microsoft.com/en-us/defender-endpoint/deployment-vdi-microsoft-defender-antivirus
