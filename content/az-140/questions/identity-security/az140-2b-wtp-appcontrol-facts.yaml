id: az140-2b-wtp-appcontrol-facts
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to enforce App Control for Business on its Windows 11 Enterprise multi-session session hosts in Azure Virtual Desktop.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'appliquer App Control for Business sur ses hôtes de session Windows 11 Entreprise multisession dans Azure Virtual Desktop.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Publishing applications only as RemoteApp programs prevents users from starting any unpublished application.", fr: "Publier les applications uniquement comme programmes RemoteApp empêche les utilisateurs de lancer toute application non publiée." } }
    - { id: b, text: { en: "A policy applies to the whole session host and affects every user who signs in to it.", fr: "Une stratégie s'applique à l'ensemble de l'hôte de session et affecte chaque utilisateur qui s'y connecte." } }
    - { id: c, text: { en: "Once App Control for Business is enforced, the session hosts no longer need an antivirus.", fr: "Une fois App Control for Business appliqué, les hôtes de session n'ont plus besoin d'antivirus." } }
    - { id: d, text: { en: "Interactive Windows PowerShell sessions run in Constrained Language Mode.", fr: "Les sessions Windows PowerShell interactives s'exécutent en mode de langage contraint (Constrained Language Mode)." } }
    - { id: e, text: { en: "Microsoft recommends AppLocker over App Control for Business because AppLocker receives new features.", fr: "Microsoft recommande AppLocker plutôt qu'App Control for Business, car AppLocker reçoit de nouvelles fonctionnalités." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      App Control for Business policies apply to the managed computer as a whole, so on a multi-session host they affect all users equally. Besides apps and scripts, App Control covers interactive Windows PowerShell sessions, which run in Constrained Language Mode.
    fr: |
      Les stratégies App Control for Business s'appliquent à l'ordinateur géré dans son ensemble : sur un hôte multisession, elles affectent tous les utilisateurs de la même façon. Outre les applications et les scripts, App Control couvre les sessions Windows PowerShell interactives, qui s'exécutent en mode de langage contraint.
  options:
    a: { en: "Microsoft states that RemoteApp isn't a security feature; it doesn't prevent launching other applications.", fr: "Microsoft indique que RemoteApp n'est pas une fonctionnalité de sécurité ; il n'empêche pas le lancement d'autres applications." }
    c: { en: "Application control works alongside antivirus, not as a replacement; keep an active antivirus solution.", fr: "Le contrôle d'application fonctionne avec l'antivirus et ne le remplace pas ; conservez une solution antivirus active." }
    e: { en: "Microsoft recommends App Control wherever possible; AppLocker gets security fixes but no new features.", fr: "Microsoft recommande App Control partout où c'est possible ; AppLocker reçoit des correctifs de sécurité mais aucune nouvelle fonctionnalité." }
references:
  - title: App Control and AppLocker Overview
    url: https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/appcontrol-and-applocker-overview
  - title: Application Control for Windows
    url: https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/appcontrol
