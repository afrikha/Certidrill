id: az140-2a-scenario-match
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans four Azure Virtual Desktop host pools. Each host pool has its own identity requirement.

    Which identity scenario should you use for each host pool? To answer, drag the appropriate scenarios to the correct host pools. Each scenario may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit quatre pools d'hôtes Azure Virtual Desktop. Chaque pool d'hôtes a sa propre exigence d'identité.

    Quel scénario d'identité devez-vous utiliser pour chaque pool d'hôtes ? Pour répondre, faites glisser les scénarios appropriés vers les pools d'hôtes correspondants. Chaque scénario peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: adds, text: { en: "Hybrid identities, session hosts joined to AD DS", fr: "Identités hybrides, hôtes de session joints à AD DS" } }
    - { id: aadds, text: { en: "Session hosts joined to Microsoft Entra Domain Services", fr: "Hôtes de session joints à Microsoft Entra Domain Services" } }
    - { id: entra, text: { en: "Cloud-only identities, Microsoft Entra joined session hosts", fr: "Identités cloud uniquement, hôtes de session joints à Microsoft Entra" } }
    - { id: ext, text: { en: "External identities, Microsoft Entra joined session hosts", fr: "Identités externes, hôtes de session joints à Microsoft Entra" } }
    - { id: adonly, text: { en: "AD DS identities that aren't synchronized, session hosts joined to AD DS", fr: "Identités AD DS non synchronisées, hôtes de session joints à AD DS" } }
  targets:
    - id: t1
      text: { en: "Pool-Finance: existing on-premises domain controllers; apps use Kerberos to on-premises file servers; existing GPOs must apply", fr: "Pool-Finance : contrôleurs de domaine locaux existants ; des applications utilisent Kerberos vers des serveurs de fichiers locaux ; les GPO existants doivent s'appliquer" }
    - id: t2
      text: { en: "Pool-Legacy: cloud-only users; an app needs domain-joined hosts with NTLM; no domain controller to deploy or patch", fr: "Pool-Legacy : utilisateurs cloud uniquement ; une application exige des hôtes joints à un domaine avec NTLM ; aucun contrôleur de domaine à déployer ni à corriger" }
    - id: t3
      text: { en: "Pool-Sales: cloud-only users; no domain at all; hosts managed by Intune", fr: "Pool-Sales : utilisateurs cloud uniquement ; aucun domaine ; hôtes gérés par Intune" }
    - id: t4
      text: { en: "Pool-Audit: auditors from another company sign in with the accounts of their own tenant", fr: "Pool-Audit : des auditeurs d'une autre entreprise se connectent avec les comptes de leur propre locataire" }
answer:
  mapping: { t1: adds, t2: aadds, t3: entra, t4: ext }
explanation:
  correct:
    en: |
      Existing domain controllers, Kerberos to on-premises servers and GPOs call for hybrid identities on AD DS-joined hosts. Microsoft Entra Domain Services provides NTLM and Kerberos domain join as a managed service, with no domain controller to maintain. Cloud-only users with no domain use Microsoft Entra joined hosts, which can be enrolled in Intune. Users of another organization are invited as external identities, which require Microsoft Entra joined hosts. Identities that exist only in AD DS are never supported.
    fr: |
      Des contrôleurs de domaine existants, Kerberos vers des serveurs locaux et des GPO imposent des identités hybrides sur des hôtes joints à AD DS. Microsoft Entra Domain Services fournit la jonction à un domaine avec NTLM et Kerberos sous forme de service managé, sans contrôleur de domaine à maintenir. Des utilisateurs cloud uniquement sans domaine utilisent des hôtes joints à Microsoft Entra, qui peuvent être inscrits dans Intune. Les utilisateurs d'une autre organisation sont invités en tant qu'identités externes, qui exigent des hôtes joints à Microsoft Entra. Des identités qui n'existent que dans AD DS ne sont jamais prises en charge.
  options:
    adonly: { en: "Users must be discoverable in Microsoft Entra ID: AD DS-only identities aren't supported.", fr: "Les utilisateurs doivent être visibles dans Microsoft Entra ID : les identités AD DS seules ne sont pas prises en charge." }
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
  - title: Compare self-managed Active Directory Domain Services, Microsoft Entra ID, and managed Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/compare-identity-solutions
