id: az140-2a-sso-hybrid-settings
objective: "2.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has a host pool named **HP-Hybrid** whose session hosts are Microsoft Entra hybrid joined to the litware.com AD DS domain. You need to enable Microsoft Entra single sign-on for HP-Hybrid. Microsoft Entra authentication for RDP is already enabled on the Windows Cloud Login service principal.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pool d'hôtes nommé **HP-Hybrid** dont les hôtes de session sont joints hybrides Microsoft Entra au domaine AD DS litware.com. Vous devez activer l'authentification unique Microsoft Entra pour HP-Hybrid. L'authentification Microsoft Entra pour RDP est déjà activée sur le principal de service Windows Cloud Login.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In AD DS, create [[obj]].

      In the existing Conditional Access policies, also target [[app]].

      In the RDP properties of HP-Hybrid, set [[prop]] to 1.
    fr: |
      Dans AD DS, créer [[obj]].

      Dans les stratégies d'accès conditionnel existantes, cibler aussi [[app]].

      Dans les propriétés RDP de HP-Hybrid, définir [[prop]] sur 1.
  slots:
    - id: obj
      options:
        - { id: kerberos, text: { en: "a Microsoft Entra Kerberos server object", fr: "un objet serveur Kerberos Microsoft Entra" } }
        - { id: kdc, text: { en: "a KDC proxy server", fr: "un serveur proxy KDC" } }
        - { id: computer, text: { en: "a computer account for the host pool", fr: "un compte d'ordinateur pour le pool d'hôtes" } }
        - { id: trust, text: { en: "an AD FS relying party trust", fr: "une approbation de partie de confiance AD FS" } }
    - id: app
      options:
        - { id: wcl, text: Windows Cloud Login }
        - { id: arm, text: Azure Virtual Desktop Azure Resource Manager Provider }
        - { id: vmsignin, text: Azure Windows VM Sign-In }
    - id: prop
      options:
        - { id: aad, text: enablerdsaadauth }
        - { id: target, text: targetisaadjoined }
        - { id: credssp, text: enablecredsspsupport }
        - { id: prompt, text: promptcredentialonce }
answer:
  values: { obj: kerberos, app: wcl, prop: aad }
explanation:
  correct:
    en: |
      Hybrid joined session hosts need a Microsoft Entra Kerberos server object to complete authentication to a domain controller; without it, users get a "session doesn't exist" error or a standard credential prompt. Single sign-on introduces the Windows Cloud Login app for the session host sign-in, so Conditional Access policies should target it as well. enablerdsaadauth:i:1 turns on Microsoft Entra authentication for the host pool connections.
    fr: |
      Les hôtes de session joints hybrides ont besoin d'un objet serveur Kerberos Microsoft Entra pour terminer l'authentification auprès d'un contrôleur de domaine ; sans lui, les utilisateurs obtiennent une erreur indiquant que la session n'existe pas ou une demande d'identifiants standard. L'authentification unique introduit l'application Windows Cloud Login pour la connexion à l'hôte de session : les stratégies d'accès conditionnel doivent donc aussi la cibler. enablerdsaadauth:i:1 active l'authentification Microsoft Entra pour les connexions du pool d'hôtes.
  options:
    kdc: { en: "A KDC proxy relays Kerberos for smart card sign-in without SSO; it doesn't let Microsoft Entra ID issue Kerberos tickets for the domain.", fr: "Un proxy KDC relaie Kerberos pour la connexion par carte à puce sans authentification unique ; il ne permet pas à Microsoft Entra ID d'émettre des tickets Kerberos pour le domaine." }
    arm: { en: "The Azure Resource Manager Provider app only retrieves the feed and must not be targeted.", fr: "L'application Azure Resource Manager Provider ne fait que récupérer le flux et ne doit pas être ciblée." }
    target: { en: "targetisaadjoined allows password sign-in to Microsoft Entra joined hosts; enablerdsaadauth replaces it.", fr: "targetisaadjoined permet la connexion par mot de passe aux hôtes joints à Microsoft Entra ; enablerdsaadauth le remplace." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
