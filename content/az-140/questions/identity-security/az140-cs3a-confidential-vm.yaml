id: az140-cs3a-confidential-vm
objective: "2.2.7"
type: single
caseStudy: az140-cs3a-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the security requirement for the HP-Trials session hosts. Which security type should you select when you add the session hosts?
  fr: |
    Vous devez satisfaire l'exigence de sécurité des hôtes de session de HP-Trials. Quel type de sécurité devez-vous sélectionner quand vous ajoutez les hôtes de session ?
body:
  options:
    - { id: a, text: { en: "Trusted launch virtual machines with Secure Boot and vTPM enabled", fr: "Machines virtuelles de lancement sécurisé (Trusted launch) avec le démarrage sécurisé et le vTPM activés" } }
    - { id: b, text: { en: "Standard virtual machines with encryption at host enabled", fr: "Machines virtuelles standard avec le chiffrement sur l'hôte activé" } }
    - { id: c, text: { en: "Confidential virtual machines with confidential OS disk encryption", fr: "Machines virtuelles confidentielles avec le chiffrement confidentiel du disque du système d'exploitation" } }
    - { id: d, text: { en: "Trusted launch virtual machines with Azure Disk Encryption and a customer-managed key", fr: "Machines virtuelles de lancement sécurisé (Trusted launch) avec Azure Disk Encryption et une clé gérée par le client" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure confidential VMs encrypt the desktop in memory with keys generated and protected by a dedicated secure processor in the CPU, which isolates the VM from the hypervisor and the host operating system. Windows 11 Enterprise is a supported session host OS for confidential VMs, and you can select this security type when you create the host pool or add session hosts.
    fr: |
      Les machines virtuelles confidentielles Azure chiffrent le bureau en mémoire avec des clés générées et protégées par un processeur sécurisé dédié intégré au processeur de la machine, ce qui isole la machine virtuelle de l'hyperviseur et du système d'exploitation hôte. Windows 11 Enterprise est un système d'exploitation d'hôte de session pris en charge pour les machines virtuelles confidentielles, et ce type de sécurité se sélectionne à la création du pool d'hôtes ou à l'ajout d'hôtes de session.
  options:
    a: { en: "Trusted launch protects the boot chain against rootkits and boot kits, but it doesn't encrypt memory in use.", fr: "Le lancement sécurisé protège la chaîne de démarrage contre les rootkits et les bootkits, mais il ne chiffre pas la mémoire en cours d'utilisation." }
    b: { en: "Encryption at host encrypts data at rest on the disks and caches, not the VM memory.", fr: "Le chiffrement sur l'hôte chiffre les données au repos des disques et des caches, pas la mémoire de la machine virtuelle." }
    d: { en: "Azure Disk Encryption protects disks at rest; memory stays readable by the host. It is also scheduled for retirement.", fr: "Azure Disk Encryption protège les disques au repos ; la mémoire reste lisible par l'hôte. Ce service doit en outre être mis hors service." }
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
