id: az140-2b-wtp-cfa-powershell
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to enable controlled folder access on its Azure Virtual Desktop session hosts. A line-of-business application, `ledger.exe`, must write to the users' Documents folders, and a network share named `\\fs01.fabrikam.com\finance` must also be protected.

    You need to configure the session hosts by using PowerShell to meet the following requirements:

    - During the first month, untrusted apps must still be able to change protected files, but every attempt must be logged.
    - `ledger.exe` must be allowed to change files in protected folders.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit d'activer l'accès contrôlé aux dossiers sur ses hôtes de session Azure Virtual Desktop. Une application métier, `ledger.exe`, doit écrire dans les dossiers Documents des utilisateurs, et un partage réseau nommé `\\fs01.fabrikam.com\finance` doit aussi être protégé.

    Vous devez configurer les hôtes de session avec PowerShell pour répondre aux exigences suivantes :

    - Pendant le premier mois, les applications non approuvées doivent toujours pouvoir modifier les fichiers protégés, mais chaque tentative doit être journalisée.
    - `ledger.exe` doit être autorisé à modifier les fichiers des dossiers protégés.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-MpPreference -EnableControlledFolderAccess [[mode]]
    Add-MpPreference -[[list]] "C:\Program Files\Fabrikam\Ledger\ledger.exe"
    Add-MpPreference -ControlledFolderAccessProtectedFolders "\\fs01.fabrikam.com\finance"
  slots:
    - id: mode
      options:
        - { id: enabled, text: Enabled }
        - { id: audit, text: AuditMode }
        - { id: diskaudit, text: AuditDiskModificationOnly }
        - { id: disabled, text: Disabled }
    - id: list
      options:
        - { id: protected, text: ControlledFolderAccessProtectedFolders }
        - { id: exclusion, text: ExclusionProcess }
        - { id: allowed, text: ControlledFolderAccessAllowedApplications }
        - { id: asr, text: AttackSurfaceReductionOnlyExclusions }
answer:
  values: { mode: audit, list: allowed }
explanation:
  correct:
    en: |
      AuditMode lets untrusted apps change protected files but records each attempt, which Microsoft recommends before switching to Enabled (block). `-ControlledFolderAccessAllowedApplications` adds an app that may change files in protected folders; `Add-MpPreference` adds it without overwriting the existing list.
    fr: |
      AuditMode laisse les applications non approuvées modifier les fichiers protégés mais enregistre chaque tentative, ce que Microsoft recommande avant de passer à Enabled (blocage). `-ControlledFolderAccessAllowedApplications` ajoute une application autorisée à modifier les fichiers des dossiers protégés ; `Add-MpPreference` l'ajoute sans écraser la liste existante.
  options:
    enabled: { en: "Enabled blocks untrusted apps immediately, which the first-month requirement forbids.", fr: "Enabled bloque immédiatement les applications non approuvées, ce que l'exigence du premier mois interdit." }
    diskaudit: { en: "This mode audits only writes to disk sectors, not changes to files in protected folders.", fr: "Ce mode audite seulement les écritures sur les secteurs du disque, pas les modifications de fichiers dans les dossiers protégés." }
    disabled: { en: "Disabled turns the feature off, so nothing is logged.", fr: "Disabled désactive la fonctionnalité : rien n'est journalisé." }
    protected: { en: "This list adds folders to protect, not apps to allow.", fr: "Cette liste ajoute des dossiers à protéger, pas des applications à autoriser." }
    exclusion: { en: "An antivirus process exclusion doesn't allow an app through controlled folder access.", fr: "Une exclusion de processus de l'antivirus n'autorise pas une application dans l'accès contrôlé aux dossiers." }
    asr: { en: "This parameter excludes paths from attack surface reduction rules, not from controlled folder access.", fr: "Ce paramètre exclut des chemins des règles de réduction de la surface d'attaque, pas de l'accès contrôlé aux dossiers." }
references:
  - title: Configure controlled folder access
    url: https://learn.microsoft.com/en-us/defender-endpoint/enable-controlled-folders
