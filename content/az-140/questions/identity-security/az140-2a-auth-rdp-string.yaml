id: az140-2a-auth-rdp-string
objective: "2.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a host pool named **HP-Secure** in a resource group named **RG-AVD**. The session hosts are joined to an AD DS domain, and single sign-on isn't used. You need to configure the custom RDP properties of HP-Secure to meet the following requirements:

    - Users who work from home sign in to the session hosts with smart cards through the KDC proxy kdc.contoso.com.
    - The users' smart cards are available to applications in the remote session.
    - WebAuthn requests in the remote session are completed in the session and aren't sent to the local device.

    Each requirement must be set explicitly instead of relying on default values.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pool d'hôtes nommé **HP-Secure** dans un groupe de ressources nommé **RG-AVD**. Les hôtes de session sont joints à un domaine AD DS et l'authentification unique n'est pas utilisée. Vous devez configurer les propriétés RDP personnalisées de HP-Secure pour répondre aux exigences suivantes :

    - Les utilisateurs qui travaillent depuis leur domicile se connectent aux hôtes de session avec des cartes à puce via le proxy KDC kdc.contoso.com.
    - Les cartes à puce des utilisateurs sont disponibles pour les applications de la session à distance.
    - Les requêtes WebAuthn de la session à distance sont traitées dans la session et ne sont pas envoyées à l'appareil local.

    Chaque exigence doit être définie explicitement au lieu de reposer sur les valeurs par défaut.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $rdp = "[[p1]]:s:kdc.contoso.com;[[p2]]:i:1;[[p3]]:i:0"

    Update-AzWvdHostPool -ResourceGroupName "RG-AVD" `
        -Name "HP-Secure" `
        -CustomRdpProperty $rdp
  slots:
    - id: p1
      options:
        - { id: kdc, text: kdcproxyname }
        - { id: gateway, text: gatewayhostname }
        - { id: domain, text: domain }
    - id: p2
      options:
        - { id: sc, text: redirectsmartcards }
        - { id: wa, text: redirectwebauthn }
        - { id: aad, text: enablerdsaadauth }
        - { id: target, text: targetisaadjoined }
    - id: p3
      options:
        - { id: wa, text: redirectwebauthn }
        - { id: sc, text: redirectsmartcards }
        - { id: credssp, text: enablecredsspsupport }
        - { id: target, text: targetisaadjoined }
answer:
  values: { p1: kdc, p2: sc, p3: wa }
explanation:
  correct:
    en: |
      kdcproxyname takes the FQDN of the KDC proxy that relays Kerberos traffic for remote smart card sign-in. redirectsmartcards:i:1 makes the local smart cards available in the remote session. redirectwebauthn:i:0 requires WebAuthn requests to be completed in the remote session instead of being redirected to the local device.
    fr: |
      kdcproxyname reçoit le FQDN du proxy KDC qui relaie le trafic Kerberos pour la connexion à distance par carte à puce. redirectsmartcards:i:1 rend les cartes à puce locales disponibles dans la session à distance. redirectwebauthn:i:0 impose que les requêtes WebAuthn soient traitées dans la session à distance au lieu d'être redirigées vers l'appareil local.
  options:
    gateway: { en: "gatewayhostname names a Remote Desktop gateway, not the KDC proxy used by Azure Virtual Desktop.", fr: "gatewayhostname désigne une passerelle Bureau à distance, pas le proxy KDC utilisé par Azure Virtual Desktop." }
    domain: { en: "domain sets the Active Directory domain of the sign-in account; it doesn't relay Kerberos traffic.", fr: "domain définit le domaine Active Directory du compte de connexion ; il ne relaie pas le trafic Kerberos." }
    aad: { en: "enablerdsaadauth:i:1 would enable single sign-on, which isn't used.", fr: "enablerdsaadauth:i:1 activerait l'authentification unique, qui n'est pas utilisée." }
    target: { en: "targetisaadjoined applies to Microsoft Entra joined session hosts only.", fr: "targetisaadjoined ne s'applique qu'aux hôtes de session joints à Microsoft Entra." }
    credssp: { en: "enablecredsspsupport:i:0 disables CredSSP; it has no effect on WebAuthn.", fr: "enablecredsspsupport:i:0 désactive CredSSP ; il n'a pas d'effet sur WebAuthn." }
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
  - title: Update-AzWvdHostPool
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/update-azwvdhostpool
