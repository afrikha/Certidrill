id: az140-cs2c-confidential
objective: "2.2.7"
type: single
caseStudy: az140-cs2c-humongous
difficulty: 1
status: draft
stem:
  en: |
    You plan to redeploy the HP-Underwrite session hosts. You need to meet the underwriting data requirement.

    What should you configure when you add the session hosts?
  fr: |
    Vous prévoyez de redéployer les hôtes de session HP-Underwrite. Vous devez respecter l'exigence relative aux données de souscription.

    Que devez-vous configurer quand vous ajoutez les hôtes de session ?
body:
  options:
    - id: a
      text:
        en: "The Trusted launch security type, with Secure Boot and vTPM enabled."
        fr: "Le type de sécurité Trusted launch, avec le démarrage sécurisé et le vTPM activés."
    - id: b
      text:
        en: "The confidential VM security type, with confidential OS disk encryption enabled."
        fr: "Le type de sécurité machine virtuelle confidentielle, avec le chiffrement confidentiel du disque de système d'exploitation activé."
    - id: c
      text:
        en: "Encryption at host, with a disk encryption set that uses a customer-managed key."
        fr: "Le chiffrement sur l'hôte, avec un jeu de chiffrement de disque qui utilise une clé gérée par le client."
    - id: d
      text:
        en: "The Standard security type, with BitLocker enabled on the OS disk by a startup script."
        fr: "Le type de sécurité Standard, avec BitLocker activé sur le disque de système d'exploitation par un script de démarrage."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure confidential VMs use hardware-based isolation from other VMs, the hypervisor and the host OS, and they encrypt the memory with keys protected by a secure processor in the CPU. Confidential OS disk encryption binds the disk encryption keys to the VM's TPM. Windows 11 Enterprise multi-session is a supported session host OS for confidential VMs.
    fr: |
      Les machines virtuelles confidentielles Azure s'appuient sur une isolation matérielle vis-à-vis des autres machines virtuelles, de l'hyperviseur et du système d'exploitation hôte, et elles chiffrent la mémoire avec des clés protégées par un processeur sécurisé intégré au CPU. Le chiffrement confidentiel du disque de système d'exploitation lie les clés de chiffrement du disque au TPM de la machine virtuelle. Windows 11 Enterprise multi-session est un système d'exploitation d'hôte de session pris en charge pour les machines virtuelles confidentielles.
  options:
    a: { en: "Trusted launch protects the boot chain against rootkits and bootkits, but it does not encrypt the VM memory or isolate it from the hypervisor.", fr: "Le lancement fiable protège la chaîne de démarrage contre les rootkits et les bootkits, mais il ne chiffre pas la mémoire de la machine virtuelle et ne l'isole pas de l'hyperviseur." }
    c: { en: "Encryption at host protects data at rest on the host, not the memory of a running VM.", fr: "Le chiffrement sur l'hôte protège les données au repos sur l'hôte, pas la mémoire d'une machine virtuelle en cours d'exécution." }
    d: { en: "BitLocker only encrypts the disk at rest, and a Standard VM has no memory encryption or hardware isolation.", fr: "BitLocker chiffre uniquement le disque au repos, et une machine virtuelle Standard n'a ni chiffrement de la mémoire ni isolation matérielle." }
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
