id: az140-2b-mde-image-steps
objective: "2.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a pooled Azure Virtual Desktop host pool. Session hosts are deleted every night and re-created from a golden image with the same names. You build the golden image on a VM named ImageVM1.

    You need to onboard the session hosts to Microsoft Defender for Endpoint so that each session host name has a single device entry.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un pool d'hôtes regroupé Azure Virtual Desktop. Les hôtes de session sont supprimés chaque nuit et recréés à partir d'une image de référence avec les mêmes noms. Vous créez l'image de référence sur une machine virtuelle nommée ImageVM1.

    Vous devez intégrer les hôtes de session à Microsoft Defender for Endpoint pour que chaque nom d'hôte de session ait une seule entrée d'appareil.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: dl, text: { en: "In the Microsoft Defender portal, download the onboarding package for the deployment method VDI onboarding scripts for non-persistent endpoints.", fr: "Dans le portail Microsoft Defender, télécharger le package d'intégration pour la méthode de déploiement VDI onboarding scripts for non-persistent endpoints." } }
    - { id: copy, text: { en: "Copy the package files to C:\\Windows\\System32\\GroupPolicy\\Machine\\Scripts\\Startup on ImageVM1.", fr: "Copier les fichiers du package dans C:\\Windows\\System32\\GroupPolicy\\Machine\\Scripts\\Startup sur ImageVM1." } }
    - { id: gpo, text: { en: "On ImageVM1, add Onboard-NonPersistentMachine.ps1 on the PowerShell Scripts tab of the computer Startup scripts.", fr: "Sur ImageVM1, ajouter Onboard-NonPersistentMachine.ps1 dans l'onglet PowerShell Scripts des scripts de démarrage de l'ordinateur." } }
    - { id: seal, text: { en: "Generalize ImageVM1 and capture it to Azure Compute Gallery.", fr: "Généraliser ImageVM1 et le capturer dans Azure Compute Gallery." } }
    - { id: run, text: { en: "Run WindowsDefenderATPOnboardingScript.cmd on ImageVM1 to confirm that onboarding works.", fr: "Exécuter WindowsDefenderATPOnboardingScript.cmd sur ImageVM1 pour vérifier que l'intégration fonctionne." } }
    - { id: logon, text: { en: "Add WindowsDefenderATPOnboardingScript.cmd as a user logon script on ImageVM1.", fr: "Ajouter WindowsDefenderATPOnboardingScript.cmd comme script d'ouverture de session utilisateur sur ImageVM1." } }
answer:
  sequence: [ dl, copy, gpo, seal ]
explanation:
  correct:
    en: |
      You download the VDI package, copy its files to the computer startup scripts folder of the image, and add Onboard-NonPersistentMachine.ps1 as a PowerShell startup script (it calls the .cmd file). Then you seal and capture the image; each new host runs the script at startup, after it has its final name.
    fr: |
      Vous téléchargez le package VDI, copiez ses fichiers dans le dossier des scripts de démarrage de l'ordinateur de l'image et ajoutez Onboard-NonPersistentMachine.ps1 comme script de démarrage PowerShell (il appelle le fichier .cmd). Vous scellez et capturez ensuite l'image ; chaque nouvel hôte exécute le script au démarrage, une fois qu'il a son nom définitif.
  options:
    run: { en: "Running the script on the image onboards it; the clones would share its identity and not appear as separate devices.", fr: "Exécuter le script sur l'image l'intègre ; les clones partageraient son identité et n'apparaîtraient pas comme des appareils distincts." }
    logon: { en: "Onboarding runs as a computer startup script, not at user sign-in, and the .cmd alone creates multiple entries.", fr: "L'intégration s'exécute comme script de démarrage de l'ordinateur, pas à l'ouverture de session de l'utilisateur, et le .cmd seul crée plusieurs entrées." }
references:
  - title: Onboard non-persistent VDI devices to Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/configure-endpoints-vdi
