id: az140-2a-auth-kdc-proxy
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a host pool named **HP-Traders** whose session hosts are joined to the woodgrove.com AD DS domain. Single sign-on isn't enabled. Traders must sign in to the session hosts with smart cards.

    Traders who work at the office can sign in. Traders who work from home connect over the internet without a VPN, and the smart card sign-in to the session hosts fails.

    You need to allow smart card sign-in to the session hosts from home. The solution must not require a VPN.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes nommé **HP-Traders** dont les hôtes de session sont joints au domaine AD DS woodgrove.com. L'authentification unique n'est pas activée. Les traders doivent se connecter aux hôtes de session avec des cartes à puce.

    Les traders qui travaillent au bureau peuvent se connecter. Ceux qui travaillent depuis leur domicile se connectent par Internet sans VPN, et la connexion par carte à puce aux hôtes de session échoue.

    Vous devez permettre la connexion par carte à puce aux hôtes de session depuis le domicile. La solution ne doit pas exiger de VPN.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable smart card redirection in the RDP properties of HP-Traders.", fr: "Activer la redirection de carte à puce dans les propriétés RDP de HP-Traders." } }
    - { id: b, text: { en: "Deploy a KDC proxy server and add the kdcproxyname RDP property to HP-Traders.", fr: "Déployer un serveur proxy KDC et ajouter la propriété RDP kdcproxyname à HP-Traders." } }
    - { id: c, text: { en: "Configure Microsoft Entra certificate-based authentication for the traders.", fr: "Configurer l'authentification par certificat Microsoft Entra pour les traders." } }
    - { id: d, text: { en: "Add the targetisaadjoined RDP property to HP-Traders.", fr: "Ajouter la propriété RDP targetisaadjoined à HP-Traders." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Smart card sign-in to the session host uses Kerberos only, which needs line of sight to a domain controller's KDC. A KDC proxy (the KDC proxy service of a Windows Server 2016 or later server with the RD Gateway role) relays the Kerberos traffic for remote users; you declare it on the host pool with `kdcproxyname:s:<fqdn>` in the Advanced RDP properties.
    fr: |
      La connexion par carte à puce à l'hôte de session n'utilise que Kerberos, qui exige une visibilité directe sur le KDC d'un contrôleur de domaine. Un proxy KDC (le service proxy KDC d'un serveur Windows Server 2016 ou ultérieur doté du rôle RD Gateway) relaie le trafic Kerberos des utilisateurs distants ; vous le déclarez sur le pool d'hôtes avec `kdcproxyname:s:<fqdn>` dans les propriétés RDP avancées.
  options:
    a: { en: "Smart card redirection is already the default and makes the card available in the session; it doesn't give the session host line of sight to a KDC.", fr: "La redirection de carte à puce est déjà la valeur par défaut et rend la carte disponible dans la session ; elle ne donne pas de visibilité directe sur un KDC." }
    c: { en: "Certificate-based authentication applies to the sign-in to Microsoft Entra ID (the service), not to the Kerberos sign-in to a session host without SSO.", fr: "L'authentification par certificat s'applique à la connexion à Microsoft Entra ID (le service), pas à la connexion Kerberos à un hôte de session sans authentification unique." }
    d: { en: "targetisaadjoined applies to Microsoft Entra joined session hosts and restricts sign-in to a password.", fr: "targetisaadjoined s'applique aux hôtes de session joints à Microsoft Entra et limite la connexion à un mot de passe." }
references:
  - title: Configure a Kerberos Key Distribution Center proxy
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/key-distribution-center-proxy
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
