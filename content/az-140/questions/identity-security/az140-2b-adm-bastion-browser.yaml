id: az140-2b-adm-bastion-browser
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an Azure Virtual Desktop host pool. The session hosts have no public IP addresses, and there is no VPN or ExpressRoute connection between the administrators' network and Azure.

    Administrators sometimes need an RDP connection to a session host whose Azure Virtual Desktop agent stopped working. They must connect from the Azure portal in a web browser over TLS. The session hosts must keep having no public IP address.

    What should you deploy?
  fr: |
    Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop. Les hôtes de session n'ont pas d'adresse IP publique, et aucune connexion VPN ou ExpressRoute n'existe entre le réseau des administrateurs et Azure.

    Les administrateurs ont parfois besoin d'une connexion RDP vers un hôte de session dont l'agent Azure Virtual Desktop a cessé de fonctionner. Ils doivent se connecter depuis le portail Azure dans un navigateur web via TLS. Les hôtes de session doivent continuer à ne pas avoir d'adresse IP publique.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "Just-in-time VM access in Microsoft Defender for Cloud", fr: "L'accès JIT aux machines virtuelles dans Microsoft Defender pour le cloud" } }
    - { id: b, text: { en: "A Standard SKU public IP address and an NSG rule for the administrators' IP range", fr: "Une adresse IP publique de SKU Standard et une règle NSG pour la plage d'adresses IP des administrateurs" } }
    - { id: c, text: { en: "Azure Bastion in the virtual network of the session hosts", fr: "Azure Bastion dans le réseau virtuel des hôtes de session" } }
    - { id: d, text: { en: "RDP Shortpath for managed networks on the session hosts", fr: "RDP Shortpath pour les réseaux managés sur les hôtes de session" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Bastion provides RDP connections from the Azure portal over TLS on port 443 and reaches the VMs on their private IP addresses, so the session hosts need no public IP address and no VPN is required.
    fr: |
      Azure Bastion fournit des connexions RDP depuis le portail Azure via TLS sur le port 443 et joint les machines virtuelles sur leurs adresses IP privées : les hôtes de session n'ont besoin d'aucune adresse IP publique, et aucun VPN n'est nécessaire.
  options:
    a: { en: "JIT opens the management port for a limited time, but without a public IP address or a private connection the administrators still have no network path to the hosts.", fr: "JIT ouvre le port de gestion pour une durée limitée, mais sans adresse IP publique ni connexion privée, les administrateurs n'ont toujours aucun chemin réseau vers les hôtes." }
    b: { en: "This adds a public IP address to the hosts, which the requirement forbids, and exposes RDP to the internet.", fr: "Cette option ajoute une adresse IP publique aux hôtes, ce que l'exigence interdit, et expose RDP à Internet." }
    d: { en: "RDP Shortpath improves the transport of Azure Virtual Desktop sessions; it doesn't provide an administrative connection when the agent is broken.", fr: "RDP Shortpath améliore le transport des sessions Azure Virtual Desktop ; il ne fournit pas de connexion d'administration quand l'agent est défaillant." }
references:
  - title: Configure NSG rules for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
