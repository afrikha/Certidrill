id: az140-2b-av-seal-image
objective: "2.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin builds a golden image for a pooled Azure Virtual Desktop host pool on a VM named ImageVM1. Microsoft Defender Antivirus is enabled on ImageVM1.

    After the last deployment, every new session host showed high CPU usage for several minutes after its first start because of Defender Antivirus maintenance work.

    You need to prepare the next image version so that the new session hosts avoid this CPU usage.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin crée une image de référence pour un pool d'hôtes regroupé Azure Virtual Desktop sur une machine virtuelle nommée ImageVM1. Microsoft Defender Antivirus est activé sur ImageVM1.

    Après le dernier déploiement, chaque nouvel hôte de session a présenté une forte utilisation du processeur pendant plusieurs minutes après son premier démarrage, à cause de tâches de maintenance de Defender Antivirus.

    Vous devez préparer la prochaine version d'image pour que les nouveaux hôtes de session évitent cette utilisation du processeur.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: install, text: { en: "Install the applications and the latest Windows updates on ImageVM1.", fr: "Installer les applications et les dernières mises à jour Windows sur ImageVM1." } }
    - { id: cache, text: { en: "Run the Windows Defender Cache Maintenance scheduled task on ImageVM1 and wait for it to finish.", fr: "Exécuter la tâche planifiée Windows Defender Cache Maintenance sur ImageVM1 et attendre qu'elle se termine." } }
    - { id: sysprep, text: { en: "Generalize ImageVM1 by running Sysprep.", fr: "Généraliser ImageVM1 en exécutant Sysprep." } }
    - { id: capture, text: { en: "Capture ImageVM1 as a new image version in Azure Compute Gallery.", fr: "Capturer ImageVM1 comme nouvelle version d'image dans Azure Compute Gallery." } }
    - { id: onboard, text: { en: "Run the Microsoft Defender for Endpoint onboarding script on ImageVM1.", fr: "Exécuter le script d'intégration de Microsoft Defender for Endpoint sur ImageVM1." } }
    - { id: rtp, text: { en: "Turn off real-time protection on ImageVM1.", fr: "Désactiver la protection en temps réel sur ImageVM1." } }
answer:
  sequence: [ install, cache, sysprep, capture ]
explanation:
  correct:
    en: |
      Microsoft recommends running the Windows Defender Cache Maintenance task on the main image before sealing it; otherwise each VM runs it after deployment and uses extra CPU. You run it once the image content is final, then generalize the VM with Sysprep and capture it to the gallery.
    fr: |
      Microsoft recommande d'exécuter la tâche Windows Defender Cache Maintenance sur l'image principale avant de la sceller ; sinon, chaque machine virtuelle l'exécute après le déploiement et consomme du processeur supplémentaire. Vous l'exécutez une fois le contenu de l'image finalisé, puis vous généralisez la machine virtuelle avec Sysprep et la capturez dans la galerie.
  options:
    onboard: { en: "The golden image must never be onboarded to Defender for Endpoint: clones would share the same identity.", fr: "L'image de référence ne doit jamais être intégrée à Defender for Endpoint : les clones partageraient la même identité." }
    rtp: { en: "Turning off real-time protection reduces security and doesn't remove the post-deployment maintenance work.", fr: "Désactiver la protection en temps réel réduit la sécurité et ne supprime pas les tâches de maintenance après le déploiement." }
references:
  - title: Configure Microsoft Defender Antivirus on a remote desktop or virtual desktop infrastructure environment
    url: https://learn.microsoft.com/en-us/defender-endpoint/deployment-vdi-microsoft-defender-antivirus
