id: az140-2b-wtp-applocker-users
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a pooled Azure Virtual Desktop host pool whose session hosts run Windows 11 Enterprise multi-session. Users of all departments receive the full desktop from the same session hosts. An App Control for Business base policy is enforced on the session hosts and allows all the corporate applications, including Ledger.exe.

    You need to ensure that only the members of the Finance group can run Ledger.exe on the session hosts. The other users must keep their current applications.

    What should you do?
  fr: |
    Contoso dispose d'un pool d'hôtes regroupé Azure Virtual Desktop dont les hôtes de session exécutent Windows 11 Entreprise multisession. Les utilisateurs de tous les services reçoivent le bureau complet depuis les mêmes hôtes de session. Une stratégie de base App Control for Business est appliquée sur les hôtes de session et autorise toutes les applications de l'entreprise, y compris Ledger.exe.

    Vous devez faire en sorte que seuls les membres du groupe Finance puissent exécuter Ledger.exe sur les hôtes de session. Les autres utilisateurs doivent conserver leurs applications actuelles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an App Control supplemental policy that allows Ledger.exe for the Finance group only.", fr: "Créer une stratégie supplémentaire App Control qui autorise Ledger.exe pour le seul groupe Finance." } }
    - { id: b, text: { en: "Publish Ledger.exe as a RemoteApp in an application group assigned only to the Finance group.", fr: "Publier Ledger.exe comme RemoteApp dans un groupe d'applications attribué au seul groupe Finance." } }
    - { id: c, text: { en: "Add AppLocker rules that allow Ledger.exe only for the Finance group.", fr: "Ajouter des règles AppLocker qui autorisent Ledger.exe pour le seul groupe Finance." } }
    - { id: d, text: { en: "Create a second App Control base policy that targets the user accounts of the Finance group.", fr: "Créer une deuxième stratégie de base App Control qui cible les comptes d'utilisateur du groupe Finance." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      App Control for Business policies apply to the whole device and affect every user of a multi-session host. AppLocker rules can target specific users or groups, and Microsoft recommends using AppLocker to fine-tune per-user restrictions on shared devices on top of App Control.
    fr: |
      Les stratégies App Control for Business s'appliquent à tout l'appareil et affectent chaque utilisateur d'un hôte multisession. Les règles AppLocker peuvent cibler des utilisateurs ou des groupes précis, et Microsoft recommande d'utiliser AppLocker, en plus d'App Control, pour affiner les restrictions par utilisateur sur les appareils partagés.
  options:
    a: { en: "Supplemental policies extend a base policy for the whole device; App Control rules can't target users or groups.", fr: "Les stratégies supplémentaires étendent une stratégie de base pour tout l'appareil ; les règles App Control ne peuvent pas cibler des utilisateurs ou des groupes." }
    b: { en: "RemoteApp isn't a security feature: users who get the full desktop can still start Ledger.exe.", fr: "RemoteApp n'est pas une fonctionnalité de sécurité : les utilisateurs qui reçoivent le bureau complet peuvent toujours lancer Ledger.exe." }
    d: { en: "App Control policies are device-level; a policy aimed at users affects all users of the device equally.", fr: "Les stratégies App Control s'appliquent à l'appareil ; une stratégie destinée à des utilisateurs affecte de la même façon tous les utilisateurs de l'appareil." }
references:
  - title: App Control and AppLocker Overview
    url: https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/appcontrol-and-applocker-overview
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
