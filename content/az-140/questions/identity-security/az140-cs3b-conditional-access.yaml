id: az140-cs3b-conditional-access
objective: "2.1.4"
type: multi
caseStudy: az140-cs3b-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You are creating a Conditional Access policy that requires MFA for connections from outside the resort networks.

    Which two target resources should you include in the policy to meet the requirements? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une stratégie d'accès conditionnel qui exige la MFA pour les connexions depuis l'extérieur des réseaux des stations.

    Quelles sont les deux ressources cibles à inclure dans la stratégie pour respecter les exigences ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Azure Virtual Desktop (9cdead84-a844-4324-93f2-b2e6bb768d07)" }
    - { id: b, text: "Azure Virtual Desktop Azure Resource Manager Provider (50e95039-b200-4007-bc97-8d5790743a63)" }
    - { id: c, text: "Windows Cloud Login (270efc09-cd0d-444b-a71f-39af4910ec45)" }
    - { id: d, text: "Azure Windows VM Sign-In" }
    - { id: e, text: "Microsoft Intune Enrollment" }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      The Azure Virtual Desktop app covers subscribing to the feed and authenticating to the gateway during a connection. Because SSO is enabled on the host pools, authentication to the session host is done through the Windows Cloud Login app, so including it also enforces MFA when users sign in to the session hosts. Microsoft recommends matching the policies of these two apps, except for sign-in frequency.
    fr: |
      L'application Azure Virtual Desktop couvre l'abonnement au flux et l'authentification auprès de la passerelle pendant une connexion. Comme le SSO est activé sur les pools d'hôtes, l'authentification auprès de l'hôte de session passe par l'application Windows Cloud Login : l'inclure applique aussi la MFA quand les utilisateurs se connectent aux hôtes de session. Microsoft recommande d'aligner les stratégies de ces deux applications, sauf pour la fréquence de connexion.
  options:
    b: { en: "This app is only used to retrieve the user feed, and Microsoft Learn says it shouldn't have MFA.", fr: "Cette application sert uniquement à récupérer le flux de l'utilisateur, et Microsoft Learn indique qu'elle ne doit pas être soumise à la MFA." }
    d: { en: "Azure Windows VM Sign-In is the app that Microsoft Learn mentions excluding for Microsoft Entra joined session hosts; with SSO enabled, authentication to the session hosts goes through Windows Cloud Login.", fr: "Azure Windows VM Sign-In est l'application que Microsoft Learn propose d'exclure pour les hôtes de session joints à Microsoft Entra ; avec le SSO activé, l'authentification auprès des hôtes de session passe par Windows Cloud Login." }
    e: { en: "Intune Enrollment controls device enrollment, not Azure Virtual Desktop connections.", fr: "Microsoft Intune Enrollment contrôle l'inscription des appareils, pas les connexions Azure Virtual Desktop." }
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
