id: az140-2a-req-adds-dns
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an on-premises AD DS domain named contoso.com whose domain controllers are also its DNS servers. Users are synchronized to Microsoft Entra ID.

    You create a virtual network named **VNet-AVD** that is connected to the on-premises network by a site-to-site VPN. VNet-AVD uses the Azure-provided DNS servers.

    You add session hosts to a host pool named **Pool1** and select contoso.com as the domain to join. The deployment fails because the session hosts can't locate the domain.

    What should you do before you redeploy the session hosts?
  fr: |
    Contoso dispose d'un domaine AD DS local nommé contoso.com dont les contrôleurs de domaine sont aussi les serveurs DNS. Les utilisateurs sont synchronisés vers Microsoft Entra ID.

    Vous créez un réseau virtuel nommé **VNet-AVD** connecté au réseau local par un VPN site à site. VNet-AVD utilise les serveurs DNS fournis par Azure.

    Vous ajoutez des hôtes de session à un pool d'hôtes nommé **Pool1** et sélectionnez contoso.com comme domaine à joindre. Le déploiement échoue, car les hôtes de session ne trouvent pas le domaine.

    Que devez-vous faire avant de redéployer les hôtes de session ?
body:
  options:
    - { id: a, text: { en: "Create an Azure private DNS zone named contoso.com and link it to VNet-AVD.", fr: "Créer une zone DNS privée Azure nommée contoso.com et la lier à VNet-AVD." } }
    - { id: b, text: { en: "Set the DNS servers of VNet-AVD to the IP addresses of the domain controllers.", fr: "Définir les serveurs DNS de VNet-AVD sur les adresses IP des contrôleurs de domaine." } }
    - { id: c, text: { en: "Configure Microsoft Entra hybrid join in Microsoft Entra Connect.", fr: "Configurer la jonction hybride Microsoft Entra dans Microsoft Entra Connect." } }
    - { id: d, text: { en: "Assign the Virtual Machine Contributor role to the domain join account.", fr: "Attribuer le rôle Virtual Machine Contributor au compte de jonction au domaine." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AD DS-joined session hosts need line of sight to a domain controller and must resolve the domain's DNS records (including the SRV records used to locate domain controllers). Setting the virtual network DNS servers to the domain controllers, reachable through the VPN, lets the domain join extension find contoso.com.
    fr: |
      Les hôtes de session joints à AD DS ont besoin d'une visibilité directe sur un contrôleur de domaine et doivent résoudre les enregistrements DNS du domaine (dont les enregistrements SRV qui permettent de trouver les contrôleurs de domaine). Définir les serveurs DNS du réseau virtuel sur les contrôleurs de domaine, joignables par le VPN, permet à l'extension de jonction au domaine de trouver contoso.com.
  options:
    a: { en: "An empty private zone wouldn't contain the AD DS records that the domain controllers maintain dynamically.", fr: "Une zone privée vide ne contiendrait pas les enregistrements AD DS que les contrôleurs de domaine tiennent à jour dynamiquement." }
    c: { en: "Hybrid join registers domain-joined computers in Microsoft Entra ID; the hosts must first be able to join the domain.", fr: "La jonction hybride inscrit des ordinateurs joints au domaine dans Microsoft Entra ID ; les hôtes doivent d'abord pouvoir joindre le domaine." }
    d: { en: "The domain join account needs rights in AD DS, not an Azure role; the failure is name resolution.", fr: "Le compte de jonction a besoin de droits dans AD DS, pas d'un rôle Azure ; l'échec vient de la résolution de noms." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
