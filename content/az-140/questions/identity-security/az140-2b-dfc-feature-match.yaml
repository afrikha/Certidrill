id: az140-2b-dfc-feature-match
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has an Azure Virtual Desktop deployment. Microsoft Defender for Servers Plan 2 is enabled on the subscription that contains the session hosts.

    You need to identify which Microsoft Defender for Cloud feature meets each requirement.

    What should you use for each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un déploiement Azure Virtual Desktop. Microsoft Defender pour serveurs Plan 2 est activé sur l'abonnement qui contient les hôtes de session.

    Vous devez identifier la fonctionnalité de Microsoft Defender pour le cloud qui répond à chaque exigence.

    Que devez-vous utiliser pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Get a prioritized list of hardening actions for the session hosts, some with a Quick fix: [[n1]]

      Show how the session hosts comply with the PCI DSS standard: [[n2]]

      Detect changes to critical system files and registry keys on the session hosts: [[n3]]
    fr: |
      Obtenir une liste priorisée d'actions de renforcement pour les hôtes de session, certaines avec un correctif rapide (Quick fix) : [[n1]]

      Montrer la conformité des hôtes de session à la norme PCI DSS : [[n2]]

      Détecter les modifications des fichiers système critiques et des clés de registre sur les hôtes de session : [[n3]]
  slots:
    - id: n1
      options:
        - { id: score, text: { en: "Secure score recommendations", fr: "Recommandations du degré de sécurisation" } }
        - { id: compliance, text: { en: "Regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire" } }
        - { id: fim, text: { en: "File integrity monitoring", fr: "Surveillance de l'intégrité des fichiers" } }
        - { id: jit, text: { en: "Just-in-time VM access", fr: "Accès JIT aux machines virtuelles" } }
    - id: n2
      options:
        - { id: score, text: { en: "Secure score recommendations", fr: "Recommandations du degré de sécurisation" } }
        - { id: compliance, text: { en: "Regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire" } }
        - { id: fim, text: { en: "File integrity monitoring", fr: "Surveillance de l'intégrité des fichiers" } }
        - { id: jit, text: { en: "Just-in-time VM access", fr: "Accès JIT aux machines virtuelles" } }
    - id: n3
      options:
        - { id: score, text: { en: "Secure score recommendations", fr: "Recommandations du degré de sécurisation" } }
        - { id: compliance, text: { en: "Regulatory compliance dashboard", fr: "Tableau de bord de conformité réglementaire" } }
        - { id: fim, text: { en: "File integrity monitoring", fr: "Surveillance de l'intégrité des fichiers" } }
        - { id: jit, text: { en: "Just-in-time VM access", fr: "Accès JIT aux machines virtuelles" } }
answer:
  values: { n1: score, n2: compliance, n3: fim }
explanation:
  correct:
    en: |
      The secure score gives prioritized recommendations, and some of them offer a Quick fix. The regulatory compliance dashboard assesses resources against standards such as PCI DSS. File integrity monitoring, a Defender for Servers Plan 2 feature, detects changes to operating system files and registry keys.
    fr: |
      Le degré de sécurisation fournit des recommandations priorisées, dont certaines proposent un correctif rapide (Quick fix). Le tableau de bord de conformité réglementaire évalue les ressources par rapport à des normes comme PCI DSS. La surveillance de l'intégrité des fichiers, une fonctionnalité de Defender pour serveurs Plan 2, détecte les modifications des fichiers du système d'exploitation et des clés de registre.
  options:
    jit: { en: "Just-in-time VM access controls management ports; it meets none of the three requirements.", fr: "L'accès JIT aux machines virtuelles contrôle les ports de gestion ; il ne répond à aucune des trois exigences." }
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
