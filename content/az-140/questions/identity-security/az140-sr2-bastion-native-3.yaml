id: az140-sr2-bastion-native-3
objective: "2.2.5"
type: series_yesno
series: az140-sr2-bastion-native
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |
    You configure just-in-time VM access on the session hosts.
  fr: |
    Vous configurez l'accès JIT aux machines virtuelles sur les hôtes de session.
body:
  solution:
    en: |
      You enable **Defender for Servers Plan 2** on the subscription and configure **just-in-time VM access** on the session hosts for port 3389, by using the network security group of snet-hosts. Administrators request access in Microsoft Defender for Cloud for the public IP address of their workstation, then connect with mstsc to the private IP address of the session host.
    fr: |
      Vous activez **Defender pour serveurs Plan 2** sur l'abonnement et configurez l'**accès JIT aux machines virtuelles** sur les hôtes de session pour le port 3389, à l'aide du groupe de sécurité réseau de snet-hosts. Les administrateurs demandent l'accès dans Microsoft Defender pour le cloud pour l'adresse IP publique de leur station de travail, puis se connectent avec mstsc à l'adresse IP privée de l'hôte de session.
answer: { value: false }
explanation:
  correct:
    en: Just-in-time VM access only opens the requested port temporarily in the NSG for the chosen source IP addresses; it doesn't create a network path. Without a public IP address, a VPN gateway or ExpressRoute, a workstation on the internet can't reach the private IP address of a session host. Defender for Servers Plan 2 would also add cost.
    fr: "L'accès JIT aux machines virtuelles ouvre seulement le port demandé, temporairement, dans le NSG pour les adresses IP sources choisies ; il ne crée aucun chemin réseau. Sans adresse IP publique, passerelle VPN ni ExpressRoute, une station de travail sur Internet ne peut pas atteindre l'adresse IP privée d'un hôte de session. Defender pour serveurs Plan 2 ajouterait en outre des coûts."
references:
  - title: Enable just-in-time access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
