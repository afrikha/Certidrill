id: az140-2b-net-no-inbound
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso deploys a new Azure Virtual Desktop host pool. The session hosts have no public IP addresses. A network security group (NSG) that contains only the default security rules is associated with the session host subnet.

    Users will connect to the session hosts from home over the internet by using Windows App. RDP Shortpath for managed networks isn't used.

    You need to configure the NSG so that users can connect. The solution must minimize the attack surface.

    Which inbound rule should you add to the NSG?
  fr: |
    Contoso déploie un nouveau pool d'hôtes Azure Virtual Desktop. Les hôtes de session n'ont pas d'adresse IP publique. Un groupe de sécurité réseau (NSG) qui ne contient que les règles de sécurité par défaut est associé au sous-réseau des hôtes de session.

    Les utilisateurs se connecteront aux hôtes de session depuis leur domicile, par Internet, avec Windows App. RDP Shortpath pour les réseaux managés n'est pas utilisé.

    Vous devez configurer le NSG pour que les utilisateurs puissent se connecter. La solution doit réduire au minimum la surface d'attaque.

    Quelle règle de trafic entrant devez-vous ajouter au NSG ?
body:
  options:
    - { id: a, text: { en: "Allow TCP 3389 from the Internet service tag", fr: "Autoriser TCP 3389 depuis l'étiquette de service Internet" } }
    - { id: b, text: { en: "Allow TCP 443 from the WindowsVirtualDesktop service tag", fr: "Autoriser TCP 443 depuis l'étiquette de service WindowsVirtualDesktop" } }
    - { id: c, text: { en: "Allow UDP 3390 from the Internet service tag", fr: "Autoriser UDP 3390 depuis l'étiquette de service Internet" } }
    - { id: d, text: { en: "No inbound rule; the default rules are sufficient", fr: "Aucune règle de trafic entrant ; les règles par défaut suffisent" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Session hosts reach the Azure Virtual Desktop service through outbound connections, and user sessions arrive through the gateway over those reverse connections. All the required endpoints are outbound, so you don't open any inbound port; the default rules already allow outbound internet traffic.
    fr: |
      Les hôtes de session joignent le service Azure Virtual Desktop par des connexions sortantes, et les sessions des utilisateurs arrivent par la passerelle sur ces connexions inverses. Tous les points de terminaison requis sont sortants : vous n'ouvrez aucun port entrant ; les règles par défaut autorisent déjà le trafic sortant vers Internet.
  options:
    a: { en: "Users never connect directly with RDP to the session hosts; opening 3389 to the internet only adds exposure.", fr: "Les utilisateurs ne se connectent jamais directement en RDP aux hôtes de session ; ouvrir 3389 vers Internet ne fait qu'augmenter l'exposition." }
    b: { en: "The service traffic to *.wvd.microsoft.com is outbound from the session hosts; no inbound rule is needed.", fr: "Le trafic du service vers *.wvd.microsoft.com est sortant depuis les hôtes de session ; aucune règle entrante n'est nécessaire." }
    c: { en: "UDP 3390 is the default listener of RDP Shortpath for managed networks, which isn't used here.", fr: "UDP 3390 est l'écouteur par défaut de RDP Shortpath pour les réseaux managés, qui n'est pas utilisé ici." }
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
  - title: RDP Shortpath
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
