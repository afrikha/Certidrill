id: az140-2a-auth-phase-facts
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is planning authentication for an Azure Virtual Desktop deployment. The session hosts are joined to an AD DS domain, users are synchronized to Microsoft Entra ID, and Microsoft Entra single sign-on won't be enabled.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam planifie l'authentification d'un déploiement Azure Virtual Desktop. Les hôtes de session sont joints à un domaine AD DS, les utilisateurs sont synchronisés vers Microsoft Entra ID et l'authentification unique Microsoft Entra ne sera pas activée.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Signing in to the service with a smart card requires Microsoft Entra certificate-based authentication or AD FS.", fr: "Se connecter au service avec une carte à puce exige l'authentification par certificat Microsoft Entra ou AD FS." } }
    - { id: b, text: { en: "Users can sign in to Windows on the session hosts with a FIDO2 security key.", fr: "Les utilisateurs peuvent se connecter à Windows sur les hôtes de session avec une clé de sécurité FIDO2." } }
    - { id: c, text: { en: "Multifactor authentication for the connections is enforced by using Conditional Access.", fr: "L'authentification multifacteur des connexions est imposée à l'aide de l'accès conditionnel." } }
    - { id: d, text: { en: "Password sign-in to the session hosts can use Kerberos but not NTLM.", fr: "La connexion par mot de passe aux hôtes de session peut utiliser Kerberos mais pas NTLM." } }
    - { id: e, text: { en: "Users of the web client can sign in with a smart card through a KDC proxy.", fr: "Les utilisateurs du client web peuvent se connecter avec une carte à puce via un proxy KDC." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Smart card sign-in to Microsoft Entra ID requires Microsoft Entra certificate-based authentication or AD FS user certificate authentication, and Microsoft Entra MFA for Azure Virtual Desktop is enforced with Conditional Access during the cloud service authentication phase.
    fr: |
      La connexion par carte à puce à Microsoft Entra ID exige l'authentification par certificat Microsoft Entra ou l'authentification par certificat utilisateur AD FS, et l'authentification multifacteur Microsoft Entra pour Azure Virtual Desktop est imposée par l'accès conditionnel pendant la phase d'authentification au service cloud.
  options:
    b: { en: "Without single sign-on, the session host sign-in supports passwords, smart cards and Windows Hello for Business certificate trust, not FIDO2 keys.", fr: "Sans authentification unique, la connexion à l'hôte de session prend en charge le mot de passe, la carte à puce et l'approbation de certificat Windows Hello Entreprise, pas les clés FIDO2." }
    d: { en: "Azure Virtual Desktop supports both NTLM and Kerberos for password sign-in; only smart cards and Windows Hello for Business are limited to Kerberos.", fr: "Azure Virtual Desktop prend en charge NTLM et Kerberos pour la connexion par mot de passe ; seules la carte à puce et Windows Hello Entreprise sont limitées à Kerberos." }
    e: { en: "The KDC proxy configuration requires the Windows Desktop client; the web client isn't supported.", fr: "La configuration du proxy KDC exige le client Windows Desktop ; le client web n'est pas pris en charge." }
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
