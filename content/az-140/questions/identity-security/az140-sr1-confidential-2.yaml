seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You enable encryption at host on Standard session hosts.
  fr: Vous activez le chiffrement sur l'hôte sur des hôtes de session Standard.
body:
  solution:
    en: |
      On the **Virtual machines** tab, you set **Security type** to **Standard**. After the deployment, you enable **encryption at host** on each session host.
    fr: |
      Sous l'onglet **Machines virtuelles**, vous définissez **Type de sécurité** sur **Standard**. Après le déploiement, vous activez le **chiffrement sur l'hôte** sur chaque hôte de session.
answer: { value: false }
explanation:
  correct:
    en: |
      Encryption at host encrypts the disks and their caches at rest on the Azure host, with keys managed by the platform or by you. It doesn't encrypt the memory in use and doesn't bind the disk encryption keys to the VM, so neither requirement is met.
    fr: |
      Le chiffrement sur l'hôte chiffre au repos les disques et leurs caches sur l'hôte Azure, avec des clés gérées par la plateforme ou par vous. Il ne chiffre pas la mémoire en cours d'utilisation et ne lie pas les clés de chiffrement du disque à la machine virtuelle : aucune des deux exigences n'est donc respectée.
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
