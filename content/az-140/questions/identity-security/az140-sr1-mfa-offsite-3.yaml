id: az140-sr1-mfa-offsite-3
objective: "2.1.4"
type: series_yesno
series: az140-sr1-mfa-offsite
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You target the Windows Cloud Login app.
  fr: Vous ciblez l'application Windows Cloud Login.
body:
  solution:
    en: |
      You create a Conditional Access policy that targets the users of HP-Sales and the **Windows Cloud Login** app (app ID `270efc09-cd0d-444b-a71f-39af4910ec45`). The policy includes any location, excludes HQ-Network, applies to the **Browser** and **Mobile apps and desktop clients** client apps, and grants access only with **Require multifactor authentication**.
    fr: |
      Vous créez une stratégie d'accès conditionnel qui cible les utilisateurs de HP-Sales et l'application **Windows Cloud Login** (ID d'application `270efc09-cd0d-444b-a71f-39af4910ec45`). La stratégie inclut n'importe quel emplacement, exclut HQ-Network, s'applique aux applications clientes **Navigateur** et **Applications mobiles et clients de bureau**, et accorde l'accès uniquement avec **Exiger l'authentification multifacteur**.
answer: { value: false }
explanation:
  correct:
    en: |
      Windows Cloud Login is used for the sign-in to the session host only when single sign-on is enabled. HP-Sales doesn't use single sign-on, so users sign in to the AD DS joined session hosts without this app and the policy never prompts them for MFA.
    fr: |
      Windows Cloud Login n'est utilisée pour la connexion à l'hôte de session que lorsque l'authentification unique est activée. HP-Sales n'utilise pas l'authentification unique : les utilisateurs se connectent aux hôtes de session joints à AD DS sans cette application, et la stratégie ne leur demande jamais l'authentification multifacteur.
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
