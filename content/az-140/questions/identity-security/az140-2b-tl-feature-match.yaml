id: az140-2b-tl-feature-match
objective: "2.2.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is defining the security baseline for its Azure Virtual Desktop session hosts.

    You need to identify the feature that meets each requirement.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum définit la base de référence de sécurité de ses hôtes de session Azure Virtual Desktop.

    Vous devez identifier la fonctionnalité qui répond à chaque exigence.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: secureboot, text: Secure Boot }
    - { id: vtpm, text: vTPM }
    - { id: bim, text: { en: "Boot integrity monitoring", fr: "Surveillance de l'intégrité du démarrage" } }
    - { id: cvm, text: { en: "Confidential virtual machines security type", fr: "Type de sécurité Machines virtuelles confidentielles" } }
    - { id: credguard, text: Windows Defender Credential Guard }
    - { id: eah, text: { en: "Encryption at host", fr: "Chiffrement sur l'hôte" } }
  targets:
    - { id: t1, text: { en: "Keep keys and boot measurements in a dedicated TPM 2.0 instance outside the reach of the VM", fr: "Conserver les clés et les mesures de démarrage dans une instance TPM 2.0 dédiée, hors de portée de la machine virtuelle" } }
    - { id: t2, text: { en: "Check remotely that each session host booted in a healthy state", fr: "Vérifier à distance que chaque hôte de session a démarré dans un état sain" } }
    - { id: t3, text: { en: "Protect data in use in memory from the hypervisor and the host operating system", fr: "Protéger les données en cours d'utilisation en mémoire contre l'hyperviseur et le système d'exploitation hôte" } }
    - { id: t4, text: { en: "Isolate secrets with virtualization-based security to help prevent pass-the-hash attacks", fr: "Isoler les secrets avec la sécurité basée sur la virtualisation pour aider à empêcher les attaques pass-the-hash" } }
answer:
  mapping: { t1: vtpm, t2: bim, t3: cvm, t4: credguard }
explanation:
  correct:
    en: |
      The vTPM is a dedicated TPM 2.0 instance that stores keys and measurements. Boot integrity monitoring uses remote attestation so Defender for Cloud can verify a healthy boot. Confidential VMs add hardware-based memory encryption that isolates the VM from the hypervisor and host. Credential Guard, enabled through virtualization-based security, isolates secrets against attacks such as pass-the-hash.
    fr: |
      Le vTPM est une instance TPM 2.0 dédiée qui stocke clés et mesures. La surveillance de l'intégrité du démarrage utilise l'attestation à distance pour que Defender pour le cloud vérifie un démarrage sain. Les machines virtuelles confidentielles ajoutent un chiffrement matériel de la mémoire qui isole la machine virtuelle de l'hyperviseur et de l'hôte. Credential Guard, activé par la sécurité basée sur la virtualisation, isole les secrets contre des attaques comme pass-the-hash.
  options:
    secureboot: { en: "Secure Boot verifies signatures at boot; it doesn't store keys, attest remotely or encrypt memory.", fr: "Secure Boot vérifie les signatures au démarrage ; il ne stocke pas de clés, n'atteste pas à distance et ne chiffre pas la mémoire." }
    eah: { en: "Encryption at host encrypts disk data and caches at rest, not data in use in memory.", fr: "Le chiffrement sur l'hôte chiffre les données et les caches de disque au repos, pas les données en cours d'utilisation en mémoire." }
references:
  - title: Trusted Launch for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
