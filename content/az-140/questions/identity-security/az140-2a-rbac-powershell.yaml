id: az140-2a-rbac-powershell
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has a RemoteApp application group named **RAG-Finance** in a resource group named **RG-AVD**. You need to give the members of the security group **Finance-Users** access to the applications published in RAG-Finance. The solution must follow the principle of least privilege.

    How should you complete the PowerShell command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un groupe d'applications RemoteApp nommé **RAG-Finance** dans un groupe de ressources nommé **RG-AVD**. Vous devez donner aux membres du groupe de sécurité **Finance-Users** l'accès aux applications publiées dans RAG-Finance. La solution doit respecter le principe du privilège minimum.

    Comment devez-vous compléter la commande PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $group = Get-AzADGroup -DisplayName "Finance-Users"

    New-AzRoleAssignment -ObjectId $group.Id `
        -RoleDefinitionName [[role]] `
        -ResourceName "RAG-Finance" `
        -ResourceGroupName "RG-AVD" `
        -ResourceType [[type]]
  slots:
    - id: role
      options:
        - { id: user, text: "\"Desktop Virtualization User\"" }
        - { id: reader, text: "\"Desktop Virtualization Application Group Reader\"" }
        - { id: vmlogin, text: "\"Virtual Machine User Login\"" }
        - { id: contrib, text: "\"Desktop Virtualization Application Group Contributor\"" }
    - id: type
      options:
        - { id: hp, text: "'Microsoft.DesktopVirtualization/hostPools'" }
        - { id: ag, text: "'Microsoft.DesktopVirtualization/applicationGroups'" }
        - { id: ws, text: "'Microsoft.DesktopVirtualization/workspaces'" }
        - { id: vm, text: "'Microsoft.Compute/virtualMachines'" }
answer:
  values: { role: user, type: ag }
explanation:
  correct:
    en: |
      Access to published desktops and apps is granted by the Desktop Virtualization User role, whose data action uses the applications of an application group. The scope is therefore the application group resource, of type Microsoft.DesktopVirtualization/applicationGroups.
    fr: |
      L'accès aux bureaux et applications publiés est accordé par le rôle Desktop Virtualization User, dont l'action de données utilise les applications d'un groupe d'applications. L'étendue est donc la ressource groupe d'applications, de type Microsoft.DesktopVirtualization/applicationGroups.
  options:
    reader: { en: "Application Group Reader lets administrators view the group; it doesn't let users launch its apps.", fr: "Application Group Reader permet aux administrateurs de voir le groupe ; il ne permet pas aux utilisateurs de lancer ses applications." }
    vmlogin: { en: "Virtual Machine User Login applies to Microsoft Entra joined VMs, not to the application group, and it doesn't publish apps.", fr: "Virtual Machine User Login s'applique aux machines virtuelles jointes à Microsoft Entra, pas au groupe d'applications, et ne publie pas d'applications." }
    contrib: { en: "Application Group Contributor manages the application group; it is a management role, not user access.", fr: "Application Group Contributor gère le groupe d'applications ; c'est un rôle de gestion, pas un accès utilisateur." }
    hp: { en: "The user role must be scoped to the application group, not to the host pool.", fr: "Le rôle utilisateur doit être limité au groupe d'applications, pas au pool d'hôtes." }
    ws: { en: "A workspace only groups application groups for the feed; assignments are made on application groups.", fr: "Un espace de travail ne fait que regrouper des groupes d'applications pour le flux ; les attributions se font sur les groupes d'applications." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
  - title: New-AzRoleAssignment
    url: https://learn.microsoft.com/en-us/powershell/module/az.resources/new-azroleassignment
