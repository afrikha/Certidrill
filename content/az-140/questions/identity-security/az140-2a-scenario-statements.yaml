id: az140-2a-scenario-statements
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum synchronizes its AD DS forest, adatum.local, to a Microsoft Entra tenant whose users sign in with the UPN suffix adatum.com. Adatum has two Azure Virtual Desktop host pools:

    | Host pool | Session host join type |
    | --- | --- |
    | Pool1 | Joined to adatum.local |
    | Pool2 | Microsoft Entra joined |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum synchronise sa forêt AD DS, adatum.local, vers un locataire Microsoft Entra dont les utilisateurs se connectent avec le suffixe UPN adatum.com. Adatum dispose de deux pools d'hôtes Azure Virtual Desktop :

    | Pool d'hôtes | Type de jonction des hôtes de session |
    | --- | --- |
    | Pool1 | Joint à adatum.local |
    | Pool2 | Joint à Microsoft Entra |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user whose AD DS UPN is user1@adatum.local and whose Microsoft Entra UPN is user1@adatum.com is supported on Pool1 because the SIDs of the two accounts match.
        fr: Un utilisateur dont l'UPN AD DS est user1@adatum.local et l'UPN Microsoft Entra user1@adatum.com est pris en charge sur Pool1, car les SID des deux comptes correspondent.
    - id: s2
      text:
        en: A user can subscribe to the feed with a Microsoft Entra account and then sign in to a Pool1 session host with a local Windows account.
        fr: Un utilisateur peut s'abonner au flux avec un compte Microsoft Entra, puis se connecter à un hôte de session de Pool1 avec un compte Windows local.
    - id: s3
      text:
        en: The synchronized users can be assigned to an application group of Pool2.
        fr: Les utilisateurs synchronisés peuvent être attribués à un groupe d'applications de Pool2.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      For hybrid identities, either the UPN or the SID (ObjectSID in AD DS, OnPremisesSecurityIdentifier in Microsoft Entra ID) must match, so a UPN mismatch is supported when the SIDs match. Signing in to Microsoft Entra ID with one account and to Windows with another one, such as a local account, isn't supported. Hybrid identities can also be assigned to application groups whose session hosts are Microsoft Entra joined.
    fr: |
      Pour les identités hybrides, l'UPN ou le SID (ObjectSID dans AD DS, OnPremisesSecurityIdentifier dans Microsoft Entra ID) doit correspondre ; une différence d'UPN est donc prise en charge si les SID correspondent. Se connecter à Microsoft Entra ID avec un compte et à Windows avec un autre, par exemple un compte local, n'est pas pris en charge. Les identités hybrides peuvent aussi être attribuées à des groupes d'applications dont les hôtes de session sont joints à Microsoft Entra.
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
