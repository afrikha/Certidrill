id: az140-2a-rights-entra-role-statements
objective: "2.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has Microsoft Entra joined session hosts and Microsoft Entra joined laptops. You plan to assign the Microsoft Entra Joined Device Local Administrator role to a role-assignable group named **Desk-Admins**. Some users are already signed in to session hosts when you make the change. Fabrikam also invites consultants as Microsoft Entra B2B guest users.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'hôtes de session joints à Microsoft Entra et d'ordinateurs portables joints à Microsoft Entra. Vous prévoyez d'attribuer le rôle Microsoft Entra Joined Device Local Administrator à un groupe attribuable à un rôle nommé **Desk-Admins**. Certains utilisateurs sont déjà connectés à des hôtes de session au moment de la modification. Fabrikam invite aussi des consultants en tant qu'utilisateurs invités Microsoft Entra B2B.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The members of Desk-Admins will be local administrators of the laptops as well as of the session hosts.
        fr: Les membres de Desk-Admins seront administrateurs locaux des ordinateurs portables comme des hôtes de session.
    - id: s2
      text:
        en: A member of Desk-Admins who is already signed in to a session host gets local administrator rights as soon as they lock and unlock the session.
        fr: Un membre de Desk-Admins déjà connecté à un hôte de session obtient les droits d'administrateur local dès qu'il verrouille puis déverrouille la session.
    - id: s3
      text:
        en: A B2B guest user added to Desk-Admins gets local administrator rights on the session hosts.
        fr: Un utilisateur invité B2B ajouté à Desk-Admins obtient les droits d'administrateur local sur les hôtes de session.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The Microsoft Entra Joined Device Local Administrator role applies to all Microsoft Entra joined devices and can't be scoped to some of them. For a user already signed in, the elevation requires a new Primary Refresh Token (up to 4 hours) and a sign-out and sign-in, not a lock and unlock. Local administrator rights on Windows devices don't apply to B2B guest users.
    fr: |
      Le rôle Microsoft Entra Joined Device Local Administrator s'applique à tous les appareils joints à Microsoft Entra et ne peut pas être limité à certains d'entre eux. Pour un utilisateur déjà connecté, l'élévation exige un nouveau jeton d'actualisation principal (jusqu'à 4 heures) et une déconnexion puis une reconnexion, pas un verrouillage puis un déverrouillage. Les droits d'administrateur local sur les appareils Windows ne s'appliquent pas aux utilisateurs invités B2B.
references:
  - title: How to manage the local administrators group on Microsoft Entra joined devices
    url: https://learn.microsoft.com/en-us/entra/identity/devices/assign-local-admin
