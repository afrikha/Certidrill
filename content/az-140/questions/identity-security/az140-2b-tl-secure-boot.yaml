id: az140-2b-tl-secure-boot
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin deploys Azure Virtual Desktop session hosts that use the Trusted launch security type.

    The security team requires that only boot loaders, operating system kernels and drivers signed by trusted publishers can start on the session hosts.

    Which Trusted launch feature meets the requirement?
  fr: |
    Tailspin déploie des hôtes de session Azure Virtual Desktop qui utilisent le type de sécurité Trusted launch (lancement sécurisé).

    L'équipe de sécurité exige que seuls les chargeurs de démarrage, noyaux de système d'exploitation et pilotes signés par des éditeurs approuvés puissent démarrer sur les hôtes de session.

    Quelle fonctionnalité de Trusted launch répond à l'exigence ?
body:
  options:
    - { id: a, text: "Secure Boot" }
    - { id: b, text: { en: "Boot integrity monitoring", fr: "La surveillance de l'intégrité du démarrage" } }
    - { id: c, text: "vTPM" }
    - { id: d, text: { en: "Hypervisor-protected code integrity (HVCI)", fr: "L'intégrité du code protégée par l'hyperviseur (HVCI)" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Secure Boot is implemented in the platform firmware and allows only signed boot loaders, OS kernels and drivers to start; if a component can't be authenticated, the VM doesn't boot. It protects the session hosts against bootkits and rootkits.
    fr: |
      Secure Boot est implémenté dans le microprogramme de la plateforme et ne laisse démarrer que des chargeurs de démarrage, noyaux de système d'exploitation et pilotes signés ; si un composant ne peut pas être authentifié, la machine virtuelle ne démarre pas. Il protège les hôtes de session contre les bootkits et les rootkits.
  options:
    c: { en: "The vTPM stores keys and boot measurements for attestation; it doesn't block unsigned components from starting.", fr: "Le vTPM stocke des clés et des mesures de démarrage pour l'attestation ; il n'empêche pas le démarrage de composants non signés." }
    b: { en: "Boot integrity monitoring attests and reports the boot state after the fact; it doesn't enforce signatures.", fr: "La surveillance de l'intégrité du démarrage atteste et signale l'état du démarrage a posteriori ; elle n'impose pas de signatures." }
    d: { en: "HVCI protects kernel-mode code integrity in the running OS; signature checks of the boot chain are Secure Boot's role.", fr: "HVCI protège l'intégrité du code en mode noyau dans le système en cours d'exécution ; la vérification des signatures de la chaîne de démarrage est le rôle de Secure Boot." }
references:
  - title: Trusted Launch for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
