id: az140-2a-rights-entra-local-admin
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has two host pools whose session hosts are Microsoft Entra joined and don't use a session host configuration:

    | Host pool | Resource group of the session hosts |
    | --- | --- |
    | HP-Eng | RG-Eng |
    | HP-Sales | RG-Sales |

    The members of a group named **Eng-Support** must have local administrator rights when they sign in to the HP-Eng session hosts. They must not have local administrator rights on any other Microsoft Entra joined device.

    What should you do?
  fr: |
    Contoso dispose de deux pools d'hôtes dont les hôtes de session sont joints à Microsoft Entra et n'utilisent pas de configuration d'hôte de session :

    | Pool d'hôtes | Groupe de ressources des hôtes de session |
    | --- | --- |
    | HP-Eng | RG-Eng |
    | HP-Sales | RG-Sales |

    Les membres d'un groupe nommé **Eng-Support** doivent avoir les droits d'administrateur local quand ils se connectent aux hôtes de session de HP-Eng. Ils ne doivent avoir les droits d'administrateur local sur aucun autre appareil joint à Microsoft Entra.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Virtual Machine Administrator Login to Eng-Support on RG-Eng.", fr: "Attribuer Virtual Machine Administrator Login à Eng-Support sur RG-Eng." } }
    - { id: b, text: { en: "Assign Virtual Machine Contributor to Eng-Support on RG-Eng.", fr: "Attribuer Virtual Machine Contributor à Eng-Support sur RG-Eng." } }
    - { id: c, text: { en: "Assign Microsoft Entra Joined Device Local Administrator to Eng-Support.", fr: "Attribuer Microsoft Entra Joined Device Local Administrator à Eng-Support." } }
    - { id: d, text: { en: "Assign Desktop Virtualization Session Host Operator to Eng-Support on HP-Eng.", fr: "Attribuer Desktop Virtualization Session Host Operator à Eng-Support sur HP-Eng." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      On Microsoft Entra joined session hosts, the Virtual Machine Administrator Login role grants local administrator privileges at sign-in. It can be scoped to a VM, a resource group or a subscription, so assigning it on RG-Eng limits the rights to the HP-Eng session hosts.
    fr: |
      Sur des hôtes de session joints à Microsoft Entra, le rôle Virtual Machine Administrator Login accorde les privilèges d'administrateur local à la connexion. Il peut être limité à une machine virtuelle, un groupe de ressources ou un abonnement : l'attribuer sur RG-Eng limite les droits aux hôtes de session de HP-Eng.
  options:
    b: { en: "Virtual Machine Contributor manages the VM resources but gives no sign-in right to Windows.", fr: "Virtual Machine Contributor gère les ressources machine virtuelle mais ne donne aucun droit de connexion à Windows." }
    c: { en: "This Microsoft Entra role applies to all Microsoft Entra joined devices and can't be scoped to some devices.", fr: "Ce rôle Microsoft Entra s'applique à tous les appareils joints à Microsoft Entra et ne peut pas être limité à certains appareils." }
    d: { en: "Session Host Operator manages session host objects (drain mode, removal); it grants no rights inside Windows.", fr: "Session Host Operator gère les objets hôtes de session (mode drainage, suppression) ; il n'accorde aucun droit dans Windows." }
references:
  - title: Microsoft Entra joined session hosts in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts
  - title: How to manage the local administrators group on Microsoft Entra joined devices
    url: https://learn.microsoft.com/en-us/entra/identity/devices/assign-local-admin
