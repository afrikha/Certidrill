id: az140-sr2-bastion-native-2
objective: "2.2.5"
type: series_yesno
series: az140-sr2-bastion-native
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You deploy Azure Bastion with the Standard SKU and administrators use az network bastion rdp.
  fr: |
    Vous déployez Azure Bastion avec la référence SKU Standard et les administrateurs utilisent az network bastion rdp.
body:
  solution:
    en: |
      You create a /26 subnet named **AzureBastionSubnet** in vnet-avd and deploy an Azure Bastion host named **bas-avd** with the **Standard** SKU. On the **Advanced** tab, you select **Native Client Support**. You assign the administrators the Reader role on bas-avd. Administrators run `az network bastion rdp --name bas-avd --resource-group rg-net --target-resource-id <session host resource ID>` from their workstations.
    fr: |
      Vous créez un sous-réseau /26 nommé **AzureBastionSubnet** dans vnet-avd et déployez un hôte Azure Bastion nommé **bas-avd** avec la référence SKU **Standard**. Sous l'onglet **Advanced**, vous sélectionnez **Native Client Support**. Vous attribuez aux administrateurs le rôle Reader sur bas-avd. Les administrateurs exécutent `az network bastion rdp --name bas-avd --resource-group rg-net --target-resource-id <session host resource ID>` depuis leurs stations de travail.
answer: { value: true }
explanation:
  correct:
    en: Standard is the lowest Bastion SKU that supports connections from the native client through the Azure CLI. On a Windows workstation, `az network bastion rdp` opens an mstsc session that reaches the session host's private IP address through bas-avd, so the session hosts need no public IP address. Administrators need Reader on the VM, its network interface and the bastion, which they have. Premium would add cost for features that aren't required.
    fr: "Standard est la référence SKU Bastion la moins élevée qui prend en charge les connexions depuis le client natif via Azure CLI. Sur une station de travail Windows, `az network bastion rdp` ouvre une session mstsc qui atteint l'adresse IP privée de l'hôte de session via bas-avd : les hôtes de session n'ont besoin d'aucune adresse IP publique. Les administrateurs ont besoin du rôle Reader sur la machine virtuelle, son interface réseau et le bastion, ce qui est le cas. Premium ajouterait des coûts pour des fonctionnalités non requises."
references:
  - title: Connect to a VM using Bastion and the Windows native client
    url: https://learn.microsoft.com/en-us/azure/bastion/connect-vm-native-client-windows
  - title: Configure Bastion for native client connections
    url: https://learn.microsoft.com/en-us/azure/bastion/native-client
