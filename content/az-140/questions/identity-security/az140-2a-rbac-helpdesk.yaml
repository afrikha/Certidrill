id: az140-2a-rbac-helpdesk
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a resource group named **RG-AVD** that contains three host pools: **HP-Call**, **HP-Office** and **HP-Dev**.

    The members of a group named **Helpdesk-Call** must be able to send messages to users of HP-Call, disconnect their sessions and sign them out. The members must not be able to change drain mode or remove session hosts, and they must have no access to the user sessions of the other host pools.

    What should you do?
  fr: |
    Northwind Traders dispose d'un groupe de ressources nommé **RG-AVD** qui contient trois pools d'hôtes : **HP-Call**, **HP-Office** et **HP-Dev**.

    Les membres d'un groupe nommé **Helpdesk-Call** doivent pouvoir envoyer des messages aux utilisateurs de HP-Call, déconnecter leurs sessions et fermer leurs sessions Windows. Ils ne doivent pouvoir ni changer le mode drainage ni supprimer des hôtes de session, et ne doivent avoir aucun accès aux sessions utilisateur des autres pools d'hôtes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Desktop Virtualization User Session Operator to Helpdesk-Call on RG-AVD.", fr: "Attribuer Desktop Virtualization User Session Operator à Helpdesk-Call sur RG-AVD." } }
    - { id: b, text: { en: "Assign Desktop Virtualization Session Host Operator to Helpdesk-Call on HP-Call.", fr: "Attribuer Desktop Virtualization Session Host Operator à Helpdesk-Call sur HP-Call." } }
    - { id: c, text: { en: "Assign Desktop Virtualization Host Pool Contributor to Helpdesk-Call on HP-Call.", fr: "Attribuer Desktop Virtualization Host Pool Contributor à Helpdesk-Call sur HP-Call." } }
    - { id: d, text: { en: "Assign Desktop Virtualization User Session Operator to Helpdesk-Call on HP-Call.", fr: "Attribuer Desktop Virtualization User Session Operator à Helpdesk-Call sur HP-Call." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Desktop Virtualization User Session Operator allows sending messages, disconnecting sessions and signing users out, but not removing session hosts, changing drain mode or managing the host pool. Assigned on HP-Call only, it doesn't reach the sessions of the other host pools, as Microsoft recommends for this role.
    fr: |
      Desktop Virtualization User Session Operator permet d'envoyer des messages, de déconnecter des sessions et de fermer les sessions des utilisateurs, mais pas de supprimer des hôtes de session, de changer le mode drainage ni de gérer le pool d'hôtes. Attribué sur HP-Call uniquement, il n'atteint pas les sessions des autres pools d'hôtes, comme Microsoft le recommande pour ce rôle.
  options:
    a: { en: "At the resource group scope, the role applies to the user sessions of all three host pools.", fr: "À l'étendue du groupe de ressources, le rôle s'applique aux sessions utilisateur des trois pools d'hôtes." }
    b: { en: "Session Host Operator manages session hosts, including drain mode and removal, which is explicitly not allowed.", fr: "Session Host Operator gère les hôtes de session, y compris le mode drainage et la suppression, ce qui est explicitement interdit." }
    c: { en: "Host Pool Contributor manages every aspect of the host pool, far beyond the help desk tasks.", fr: "Host Pool Contributor gère tous les aspects du pool d'hôtes, bien au-delà des tâches du support." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
