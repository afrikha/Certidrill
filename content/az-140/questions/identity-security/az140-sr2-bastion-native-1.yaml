id: az140-sr2-bastion-native-1
objective: "2.2.5"
type: series_yesno
series: az140-sr2-bastion-native
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You deploy Azure Bastion with the Basic SKU and administrators use az network bastion rdp.
  fr: |
    Vous déployez Azure Bastion avec la référence SKU Basic et les administrateurs utilisent az network bastion rdp.
body:
  solution:
    en: |
      You create a /26 subnet named **AzureBastionSubnet** in vnet-avd and deploy an Azure Bastion host named **bas-avd** with the **Basic** SKU. You assign the administrators the Reader role on bas-avd. Administrators run `az network bastion rdp --name bas-avd --resource-group rg-net --target-resource-id <session host resource ID>` from their workstations.
    fr: |
      Vous créez un sous-réseau /26 nommé **AzureBastionSubnet** dans vnet-avd et déployez un hôte Azure Bastion nommé **bas-avd** avec la référence SKU **Basic**. Vous attribuez aux administrateurs le rôle Reader sur bas-avd. Les administrateurs exécutent `az network bastion rdp --name bas-avd --resource-group rg-net --target-resource-id <session host resource ID>` depuis leurs stations de travail.
answer: { value: false }
explanation:
  correct:
    en: The Basic SKU supports only connections from the Azure portal, in the browser. Connecting through the Azure CLI with the native client requires the Standard or Premium SKU with native client support enabled, so `az network bastion rdp` can't open an mstsc session through bas-avd.
    fr: "La référence SKU Basic ne prend en charge que les connexions depuis le portail Azure, dans le navigateur. La connexion via Azure CLI avec le client natif exige la référence SKU Standard ou Premium avec la prise en charge du client natif activée : `az network bastion rdp` ne peut pas ouvrir de session mstsc via bas-avd."
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
