id: az140-2a-ca-policy-settings
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure Virtual Desktop deployment without single sign-on. You are creating a Conditional Access policy for a group named **AVD-Users**. The policy must meet the following requirements:

    - Require users to perform multifactor authentication when they subscribe to their feed and connect through the Azure Virtual Desktop gateway.
    - Require users to authenticate again when they launch a new connection more than 8 hours after their last authentication.

    How should you complete the policy settings? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un déploiement Azure Virtual Desktop sans authentification unique. Vous créez une stratégie d'accès conditionnel pour un groupe nommé **AVD-Users**. La stratégie doit répondre aux exigences suivantes :

    - Exiger que les utilisateurs effectuent une authentification multifacteur quand ils s'abonnent à leur flux et se connectent via la passerelle Azure Virtual Desktop.
    - Exiger que les utilisateurs s'authentifient à nouveau quand ils lancent une nouvelle connexion plus de 8 heures après leur dernière authentification.

    Comment devez-vous compléter les paramètres de la stratégie ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Target resources > Include: [[app]]

      Grant: [[grant]]

      Session: [[session]]
    fr: |
      Ressources cibles > Inclure : [[app]]

      Accorder : [[grant]]

      Session : [[session]]
  slots:
    - id: app
      options:
        - { id: avd, text: Azure Virtual Desktop }
        - { id: arm, text: Azure Virtual Desktop Azure Resource Manager Provider }
        - { id: vmsignin, text: Azure Windows VM Sign-In }
        - { id: mgmt, text: Windows Azure Service Management API }
    - id: grant
      options:
        - { id: mfa, text: { en: "Require multifactor authentication", fr: "Exiger l'authentification multifacteur" } }
        - { id: compliant, text: { en: "Require device to be marked as compliant", fr: "Exiger que l'appareil soit marqué comme conforme" } }
        - { id: hybrid, text: { en: "Require Microsoft Entra hybrid joined device", fr: "Exiger un appareil joint hybride Microsoft Entra" } }
        - { id: block, text: { en: "Block access", fr: "Bloquer l'accès" } }
    - id: session
      options:
        - { id: periodic, text: { en: "Sign-in frequency: periodic reauthentication, 8 hours", fr: "Fréquence de connexion : réauthentification périodique, 8 heures" } }
        - { id: everytime, text: { en: "Sign-in frequency: every time", fr: "Fréquence de connexion : chaque fois" } }
        - { id: persistent, text: { en: "Persistent browser session: always persistent", fr: "Session de navigateur persistante : toujours persistante" } }
answer:
  values: { app: avd, grant: mfa, session: periodic }
explanation:
  correct:
    en: |
      The Azure Virtual Desktop app (9cdead84-a844-4324-93f2-b2e6bb768d07) applies when users subscribe to the feed, authenticate to the gateway and send diagnostics. The grant control Require multifactor authentication enforces MFA, and a periodic sign-in frequency of 8 hours forces a new authentication when a connection is launched more than 8 hours after the last one.
    fr: |
      L'application Azure Virtual Desktop (9cdead84-a844-4324-93f2-b2e6bb768d07) s'applique quand les utilisateurs s'abonnent au flux, s'authentifient auprès de la passerelle et envoient des diagnostics. Le contrôle d'octroi Exiger l'authentification multifacteur impose l'authentification multifacteur, et une fréquence de connexion périodique de 8 heures force une nouvelle authentification quand une connexion est lancée plus de 8 heures après la précédente.
  options:
    arm: { en: "This app only retrieves the feed and must not require MFA.", fr: "Cette application ne fait que récupérer le flux et ne doit pas exiger l'authentification multifacteur." }
    vmsignin: { en: "Azure Windows VM Sign-In covers sign-in to Microsoft Entra joined VMs, not the feed and gateway.", fr: "Azure Windows VM Sign-In couvre la connexion aux machines virtuelles jointes à Microsoft Entra, pas le flux ni la passerelle." }
    everytime: { en: "Every time is supported only on the Windows Cloud Login app with single sign-on; on the Azure Virtual Desktop app it causes constant prompts.", fr: "Chaque fois n'est pris en charge que sur l'application Windows Cloud Login avec l'authentification unique ; sur l'application Azure Virtual Desktop, il provoque des demandes constantes." }
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
