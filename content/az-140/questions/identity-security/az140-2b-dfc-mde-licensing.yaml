id: az140-2b-dfc-mde-licensing
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a pooled Azure Virtual Desktop host pool whose session hosts run Windows 11 Enterprise multi-session. The users are external contractors who have no Microsoft 365, Windows Enterprise or Microsoft Defender for Endpoint licenses.

    You need to license Microsoft Defender for Endpoint for the session hosts. The solution must follow Microsoft's security best practice for Windows Enterprise multi-session, must not require per-user licenses, and must minimize cost.

    What should you do?
  fr: |
    Northwind Traders dispose d'un pool d'hôtes regroupé Azure Virtual Desktop dont les hôtes de session exécutent Windows 11 Entreprise multisession. Les utilisateurs sont des prestataires externes qui n'ont aucune licence Microsoft 365, Windows Entreprise ou Microsoft Defender for Endpoint.

    Vous devez fournir les licences Microsoft Defender for Endpoint pour les hôtes de session. La solution doit suivre la bonne pratique de sécurité de Microsoft pour Windows Entreprise multisession, ne doit pas exiger de licences par utilisateur et doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign a Microsoft Defender for Endpoint Plan 2 license to each contractor.", fr: "Attribuer une licence Microsoft Defender for Endpoint Plan 2 à chaque prestataire." } }
    - { id: b, text: { en: "Enable the Defender CSPM plan on the subscription that contains the session hosts.", fr: "Activer le plan Defender CSPM sur l'abonnement qui contient les hôtes de session." } }
    - { id: c, text: { en: "Assign a Microsoft Entra ID P2 license to each contractor.", fr: "Attribuer une licence Microsoft Entra ID P2 à chaque prestataire." } }
    - { id: d, text: { en: "Enable Defender for Servers Plan 1 on the subscription that contains the session hosts.", fr: "Activer Defender pour serveurs Plan 1 sur l'abonnement qui contient les hôtes de session." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For Windows Enterprise multi-session, Microsoft's security best practice is to license the session host VMs through Microsoft Defender for Servers, which includes Defender for Endpoint. Plan 1 is the least expensive Defender for Servers plan that includes the Defender for Endpoint integration, and it is licensed per server rather than per user.
    fr: |
      Pour Windows Entreprise multisession, la bonne pratique de sécurité de Microsoft consiste à couvrir les machines virtuelles hôtes de session par Microsoft Defender pour serveurs, qui inclut Defender for Endpoint. Plan 1 est le plan Defender pour serveurs le moins coûteux qui inclut l'intégration de Defender for Endpoint, et il est facturé par serveur et non par utilisateur.
  options:
    a: { en: "Per-user Defender for Endpoint licenses are an alternative, but the requirement excludes per-user licenses.", fr: "Les licences Defender for Endpoint par utilisateur sont une alternative, mais l'exigence exclut les licences par utilisateur." }
    b: { en: "Defender CSPM adds posture management features; it doesn't license Defender for Endpoint on the servers.", fr: "Defender CSPM ajoute des fonctionnalités de gestion de la posture ; il ne fournit pas de licence Defender for Endpoint pour les serveurs." }
    c: { en: "Microsoft Entra ID P2 is an identity license; it includes no endpoint protection, and it is per user.", fr: "Microsoft Entra ID P2 est une licence d'identité ; elle n'inclut aucune protection des points de terminaison, et elle est attribuée par utilisateur." }
references:
  - title: Onboard Windows devices in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/defender-endpoint/onboard-windows-multi-session-device
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
