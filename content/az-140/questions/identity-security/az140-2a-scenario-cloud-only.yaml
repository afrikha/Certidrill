id: az140-2a-scenario-cloud-only
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is a new company. All its users are created directly in Microsoft Entra ID, and the company has no on-premises infrastructure.

    You plan to deploy an Azure Virtual Desktop host pool named **Pool1**. The session hosts must be enrolled automatically in Microsoft Intune when you deploy them from the Azure portal. To minimize costs, you must not deploy any additional directory service.

    How should you configure the identity of the Pool1 session hosts?
  fr: |
    Fabrikam est une nouvelle entreprise. Tous ses utilisateurs sont créés directement dans Microsoft Entra ID et l'entreprise ne dispose d'aucune infrastructure locale.

    Vous prévoyez de déployer un pool d'hôtes Azure Virtual Desktop nommé **Pool1**. Les hôtes de session doivent être inscrits automatiquement dans Microsoft Intune quand vous les déployez depuis le portail Azure. Pour réduire les coûts au minimum, vous ne devez déployer aucun service d'annuaire supplémentaire.

    Comment devez-vous configurer l'identité des hôtes de session de Pool1 ?
body:
  options:
    - { id: a, text: { en: "Join the session hosts to a Microsoft Entra Domain Services managed domain.", fr: "Joindre les hôtes de session à un domaine managé Microsoft Entra Domain Services." } }
    - { id: b, text: { en: "Configure the session hosts as Microsoft Entra hybrid joined devices.", fr: "Configurer les hôtes de session comme appareils joints hybrides Microsoft Entra." } }
    - { id: c, text: { en: "Join the session hosts to an AD DS domain hosted on Azure virtual machines.", fr: "Joindre les hôtes de session à un domaine AD DS hébergé sur des machines virtuelles Azure." } }
    - { id: d, text: { en: "Join the session hosts to Microsoft Entra ID.", fr: "Joindre les hôtes de session à Microsoft Entra ID." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Cloud-only identities are supported with Microsoft Entra joined session hosts, which need no domain controller and no managed domain. When you select Microsoft Entra ID as the join type on the Virtual Machines tab of the portal, you can also enroll the VMs in Intune automatically.
    fr: |
      Les identités cloud uniquement sont prises en charge avec des hôtes de session joints à Microsoft Entra, qui n'ont besoin ni de contrôleur de domaine ni de domaine managé. Quand vous choisissez Microsoft Entra ID comme type de jonction dans l'onglet Machines virtuelles du portail, vous pouvez aussi inscrire automatiquement les machines virtuelles dans Intune.
  options:
    a: { en: "A Microsoft Entra Domain Services managed domain is an additional paid directory service, and joined hosts are managed by Group Policy, not enrolled in Intune by the deployment.", fr: "Un domaine managé Microsoft Entra Domain Services est un service d'annuaire payant supplémentaire, et les hôtes joints sont gérés par stratégie de groupe, pas inscrits dans Intune par le déploiement." }
    c: { en: "Domain controllers on Azure VMs are an additional directory service that you must deploy, pay for and maintain.", fr: "Des contrôleurs de domaine sur des machines virtuelles Azure constituent un service d'annuaire supplémentaire à déployer, payer et maintenir." }
    b: { en: "Microsoft Entra hybrid join requires an AD DS domain, which Fabrikam does not have.", fr: "La jonction hybride Microsoft Entra exige un domaine AD DS, dont Fabrikam ne dispose pas." }
references:
  - title: Microsoft Entra joined session hosts in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
