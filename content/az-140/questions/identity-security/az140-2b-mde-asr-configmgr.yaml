id: az140-2b-mde-asr-configmgr
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank manages its Azure Virtual Desktop session hosts by using Microsoft Configuration Manager and onboards them to Microsoft Defender for Endpoint by using Configuration Manager.

    You plan to enable attack surface reduction (ASR) rules in block mode on the session hosts. The Configuration Manager client must keep working.

    Which ASR rule should you leave out of the policy?
  fr: |
    Woodgrove Bank gère ses hôtes de session Azure Virtual Desktop avec Microsoft Configuration Manager et les intègre à Microsoft Defender for Endpoint avec Configuration Manager.

    Vous prévoyez d'activer des règles de réduction de la surface d'attaque (ASR) en mode blocage sur les hôtes de session. Le client Configuration Manager doit continuer à fonctionner.

    Quelle règle ASR devez-vous exclure de la stratégie ?
body:
  options:
    - { id: a, text: "Block process creations originating from PSExec and WMI commands" }
    - { id: b, text: "Block executable content from email client and webmail" }
    - { id: c, text: "Block credential stealing from the Windows local security authority subsystem (lsass.exe)" }
    - { id: d, text: "Block all Office applications from creating child processes" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Configuration Manager client relies heavily on WMI. Microsoft's guidance for onboarding Azure Virtual Desktop hosts with Configuration Manager is not to enable the rule that blocks process creations originating from PSExec and WMI commands.
    fr: |
      Le client Configuration Manager s'appuie fortement sur WMI. Pour l'intégration d'hôtes Azure Virtual Desktop avec Configuration Manager, Microsoft recommande de ne pas activer la règle qui bloque les créations de processus provenant des commandes PSExec et WMI.
  options:
    c: { en: "Blocking credential theft from LSASS doesn't affect the Configuration Manager client.", fr: "Bloquer le vol d'informations d'identification depuis LSASS n'affecte pas le client Configuration Manager." }
    b: { en: "This rule acts on email attachments and webmail downloads, not on WMI-based management.", fr: "Cette règle agit sur les pièces jointes et les téléchargements de messagerie web, pas sur la gestion basée sur WMI." }
    d: { en: "This rule blocks child processes of Office apps; Configuration Manager doesn't depend on them.", fr: "Cette règle bloque les processus enfants des applications Office ; Configuration Manager n'en dépend pas." }
references:
  - title: Onboard Windows devices in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/defender-endpoint/onboard-windows-multi-session-device
