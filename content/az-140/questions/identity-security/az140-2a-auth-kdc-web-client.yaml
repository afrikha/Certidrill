id: az140-2a-auth-kdc-web-client
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a host pool named **HP-Gov** whose session hosts are joined to an AD DS domain. Users sign in to the session hosts with smart cards. You deploy a KDC proxy named kdc.contoso.com and add `kdcproxyname:s:kdc.contoso.com` to the RDP properties of HP-Gov.

    The following users connect from home without a VPN:

    | User | Device | Client |
    | --- | --- | --- |
    | User1 | Windows 11 PC | Windows Desktop client |
    | User2 | Windows 11 PC | Web client in Microsoft Edge |

    User1 can sign in with a smart card. User2 can't.

    What should you do to allow User2 to sign in with a smart card?
  fr: |
    Contoso dispose d'un pool d'hôtes nommé **HP-Gov** dont les hôtes de session sont joints à un domaine AD DS. Les utilisateurs se connectent aux hôtes de session avec des cartes à puce. Vous déployez un proxy KDC nommé kdc.contoso.com et ajoutez `kdcproxyname:s:kdc.contoso.com` aux propriétés RDP de HP-Gov.

    Les utilisateurs suivants se connectent depuis leur domicile sans VPN :

    | Utilisateur | Appareil | Client |
    | --- | --- | --- |
    | User1 | PC Windows 11 | Client Windows Desktop |
    | User2 | PC Windows 11 | Client web dans Microsoft Edge |

    User1 peut se connecter avec une carte à puce. User2 ne le peut pas.

    Que devez-vous faire pour permettre à User2 de se connecter avec une carte à puce ?
body:
  options:
    - { id: a, text: { en: "Have User2 connect by using the Windows Desktop client.", fr: "Faire en sorte que User2 se connecte avec le client Windows Desktop." } }
    - { id: b, text: { en: "Add redirectsmartcards:i:1 to the RDP properties of HP-Gov.", fr: "Ajouter redirectsmartcards:i:1 aux propriétés RDP de HP-Gov." } }
    - { id: c, text: { en: "Install the smart card drivers on the HP-Gov session hosts.", fr: "Installer les pilotes de la carte à puce sur les hôtes de session de HP-Gov." } }
    - { id: d, text: { en: "Add the KDC proxy URL to the trusted sites of Microsoft Edge.", fr: "Ajouter l'URL du proxy KDC aux sites approuvés de Microsoft Edge." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The KDC proxy configuration for Azure Virtual Desktop requires remote clients running Windows 10 or later with the Windows Desktop client; the web client isn't supported. User2 must use a supported client to sign in with a smart card through the KDC proxy.
    fr: |
      La configuration du proxy KDC pour Azure Virtual Desktop exige des clients distants sous Windows 10 ou ultérieur avec le client Windows Desktop ; le client web n'est pas pris en charge. User2 doit utiliser un client pris en charge pour se connecter avec une carte à puce via le proxy KDC.
  options:
    b: { en: "Smart card redirection is already the default, and User1 proves that the host pool settings work.", fr: "La redirection de carte à puce est déjà la valeur par défaut, et User1 prouve que les paramètres du pool d'hôtes fonctionnent." }
    c: { en: "Drivers on the session host are needed to use a card inside the session; User1 already signs in, so the hosts aren't the problem.", fr: "Des pilotes sur l'hôte de session sont nécessaires pour utiliser une carte dans la session ; User1 se connecte déjà, donc les hôtes ne sont pas en cause." }
    d: { en: "Browser trusted sites don't add KDC proxy support to the web client.", fr: "Les sites approuvés du navigateur n'ajoutent pas la prise en charge du proxy KDC au client web." }
references:
  - title: Configure a Kerberos Key Distribution Center proxy
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/key-distribution-center-proxy
