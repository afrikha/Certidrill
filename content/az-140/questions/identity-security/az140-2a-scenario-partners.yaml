id: az140-2a-scenario-partners
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant and an Azure Virtual Desktop host pool named **HP-Partners**. Consultants from Fabrikam must access a desktop in HP-Partners by using the accounts of their own Fabrikam Microsoft Entra tenant. Contoso must not create accounts for the consultants in its own directory.

    You invite the consultants as Microsoft Entra B2B guest users. The session hosts will run Windows 11 Enterprise multi-session, version 24H2, with the latest cumulative updates.

    Which two requirements must HP-Partners meet? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un locataire Microsoft Entra et d'un pool d'hôtes Azure Virtual Desktop nommé **HP-Partners**. Des consultants de Fabrikam doivent accéder à un bureau de HP-Partners avec les comptes de leur propre locataire Microsoft Entra Fabrikam. Contoso ne doit pas créer de comptes pour les consultants dans son propre annuaire.

    Vous invitez les consultants en tant qu'utilisateurs invités Microsoft Entra B2B. Les hôtes de session exécuteront Windows 11 Entreprise multisession, version 24H2, avec les dernières mises à jour cumulatives.

    Quelles sont les deux conditions que HP-Partners doit remplir ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The session hosts are Microsoft Entra hybrid joined to the Contoso AD DS domain.", fr: "Les hôtes de session sont joints hybrides Microsoft Entra au domaine AD DS de Contoso." } }
    - { id: b, text: { en: "The session hosts are Microsoft Entra joined to the Contoso tenant.", fr: "Les hôtes de session sont joints à Microsoft Entra dans le locataire Contoso." } }
    - { id: c, text: { en: "Microsoft Entra single sign-on is enabled for the host pool.", fr: "L'authentification unique Microsoft Entra est activée pour le pool d'hôtes." } }
    - { id: d, text: { en: "The session hosts are joined to a Microsoft Entra Domain Services managed domain.", fr: "Les hôtes de session sont joints à un domaine managé Microsoft Entra Domain Services." } }
    - { id: e, text: { en: "The RDP property targetisaadjoined:i:1 is added to the host pool.", fr: "La propriété RDP targetisaadjoined:i:1 est ajoutée au pool d'hôtes." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      External identities are supported only on Microsoft Entra joined session hosts, and single sign-on must be configured for the host pool. The other requirements are a recent Windows 11 Enterprise 24H2 (or Windows Server 2025) build and Windows App as the client.
    fr: |
      Les identités externes ne sont prises en charge que sur des hôtes de session joints à Microsoft Entra, et l'authentification unique doit être configurée pour le pool d'hôtes. Les autres conditions sont une build récente de Windows 11 Entreprise 24H2 (ou Windows Server 2025) et Windows App comme client.
  options:
    a: { en: "Hybrid join isn't a supported join type for external identities; guests also can't use Kerberos or NTLM to AD DS resources.", fr: "La jonction hybride n'est pas un type de jonction pris en charge pour les identités externes ; les invités ne peuvent pas non plus utiliser Kerberos ou NTLM vers les ressources AD DS." }
    d: { en: "Guest users can't sign in to a managed domain, and single sign-on isn't supported on Microsoft Entra Domain Services joined hosts.", fr: "Les utilisateurs invités ne peuvent pas se connecter à un domaine managé, et l'authentification unique n'est pas prise en charge sur les hôtes joints à Microsoft Entra Domain Services." }
    e: { en: "targetisaadjoined restricts sign-in to a username and password; external identities rely on single sign-on with Microsoft Entra authentication.", fr: "targetisaadjoined limite la connexion à un nom d'utilisateur et un mot de passe ; les identités externes reposent sur l'authentification unique avec l'authentification Microsoft Entra." }
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
