id: az140-2a-sso-supported-pools
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has the following Azure Virtual Desktop host pools. All session hosts have the latest cumulative updates.

    | Host pool | Session host OS | Session host join type |
    | --- | --- | --- |
    | HP1 | Windows 11 Enterprise multi-session | Microsoft Entra joined |
    | HP2 | Windows 11 Enterprise multi-session | Joined to Microsoft Entra Domain Services |
    | HP3 | Windows 10 Enterprise multi-session | Joined to AD DS only |
    | HP4 | Windows Server 2022 | Microsoft Entra hybrid joined |

    You plan to enable Microsoft Entra single sign-on.

    On which host pools can you enable single sign-on without changing the join type of the session hosts?
  fr: |
    Northwind Traders dispose des pools d'hôtes Azure Virtual Desktop suivants. Tous les hôtes de session ont les dernières mises à jour cumulatives.

    | Pool d'hôtes | Système d'exploitation des hôtes | Type de jonction des hôtes |
    | --- | --- | --- |
    | HP1 | Windows 11 Entreprise multisession | Joint à Microsoft Entra |
    | HP2 | Windows 11 Entreprise multisession | Joint à Microsoft Entra Domain Services |
    | HP3 | Windows 10 Entreprise multisession | Joint à AD DS uniquement |
    | HP4 | Windows Server 2022 | Joint hybride Microsoft Entra |

    Vous prévoyez d'activer l'authentification unique Microsoft Entra.

    Sur quels pools d'hôtes pouvez-vous activer l'authentification unique sans changer le type de jonction des hôtes de session ?
body:
  options:
    - { id: a, text: { en: "HP1 only", fr: "HP1 uniquement" } }
    - { id: b, text: { en: "HP1 and HP2 only", fr: "HP1 et HP2 uniquement" } }
    - { id: c, text: { en: "HP1 and HP4 only", fr: "HP1 et HP4 uniquement" } }
    - { id: d, text: { en: "HP1, HP2 and HP4 only", fr: "HP1, HP2 et HP4 uniquement" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Single sign-on requires Microsoft Entra joined or Microsoft Entra hybrid joined session hosts running Windows 11 or Windows 10 Enterprise (single or multi-session) or Windows Server 2022 with the October 2022 cumulative update or later. Session hosts joined only to AD DS or to Microsoft Entra Domain Services aren't supported.
    fr: |
      L'authentification unique exige des hôtes de session joints à Microsoft Entra ou joints hybrides Microsoft Entra, qui exécutent Windows 11 ou Windows 10 Entreprise (session unique ou multisession) ou Windows Server 2022 avec la mise à jour cumulative d'octobre 2022 ou ultérieure. Les hôtes de session joints uniquement à AD DS ou à Microsoft Entra Domain Services ne sont pas pris en charge.
  options:
    a: { en: "HP4 is also supported: hybrid joined Windows Server 2022 hosts with recent updates meet the requirements.", fr: "HP4 est aussi pris en charge : des hôtes Windows Server 2022 joints hybrides avec des mises à jour récentes remplissent les conditions." }
    b: { en: "Hosts joined to Microsoft Entra Domain Services don't support single sign-on, and HP4 is supported.", fr: "Les hôtes joints à Microsoft Entra Domain Services ne prennent pas en charge l'authentification unique, et HP4 est pris en charge." }
    d: { en: "HP2 isn't supported because its hosts are joined to Microsoft Entra Domain Services.", fr: "HP2 n'est pas pris en charge, car ses hôtes sont joints à Microsoft Entra Domain Services." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
