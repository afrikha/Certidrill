id: az140-2a-rights-adds-local-admin
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a pooled host pool named **HP-Office** whose session hosts are joined to the litware.com AD DS domain and are stored in an OU named **AVD-Hosts**. Session hosts are regularly replaced by new VMs created from a generalized image.

    The members of the domain group **AVD-Admins** must be members of the local Administrators group on every HP-Office session host, including future ones. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Litware dispose d'un pool d'hôtes regroupé nommé **HP-Office** dont les hôtes de session sont joints au domaine AD DS litware.com et placés dans une unité d'organisation nommée **AVD-Hosts**. Les hôtes de session sont régulièrement remplacés par de nouvelles machines virtuelles créées à partir d'une image généralisée.

    Les membres du groupe de domaine **AVD-Admins** doivent être membres du groupe Administrateurs local de chaque hôte de session de HP-Office, y compris les futurs hôtes. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Virtual Machine Administrator Login role to AVD-Admins on the resource group of the session hosts.", fr: "Attribuer le rôle Virtual Machine Administrator Login à AVD-Admins sur le groupe de ressources des hôtes de session." } }
    - { id: b, text: { en: "Link a GPO to AVD-Hosts that adds AVD-Admins to the local Administrators group.", fr: "Lier à AVD-Hosts un GPO qui ajoute AVD-Admins au groupe Administrateurs local." } }
    - { id: c, text: { en: "Run net localgroup on each session host after it is deployed.", fr: "Exécuter net localgroup sur chaque hôte de session après son déploiement." } }
    - { id: d, text: { en: "Assign the Owner role to AVD-Admins on the resource group of the session hosts.", fr: "Attribuer le rôle Owner à AVD-Admins sur le groupe de ressources des hôtes de session." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      On AD DS-joined session hosts, local group membership is managed with Group Policy, for example with Restricted Groups or Group Policy Preferences (Local Users and Groups). A GPO linked to the OU applies automatically to every session host added to it, including hosts re-created from the image.
    fr: |
      Sur des hôtes de session joints à AD DS, l'appartenance aux groupes locaux se gère par stratégie de groupe, par exemple avec les groupes restreints ou les préférences de stratégie de groupe (Utilisateurs et groupes locaux). Un GPO lié à l'unité d'organisation s'applique automatiquement à chaque hôte de session qui y est ajouté, y compris les hôtes recréés à partir de l'image.
  options:
    a: { en: "Virtual Machine Administrator Login applies to Microsoft Entra joined VMs, not to hosts that are joined only to AD DS.", fr: "Virtual Machine Administrator Login s'applique aux machines virtuelles jointes à Microsoft Entra, pas aux hôtes joints uniquement à AD DS." }
    c: { en: "A manual change on each host must be repeated for every new host, which doesn't minimize effort.", fr: "Une modification manuelle sur chaque hôte doit être répétée pour chaque nouvel hôte, ce qui ne réduit pas l'effort." }
    d: { en: "Owner controls the Azure resources; Azure RBAC roles don't grant rights inside Windows.", fr: "Owner contrôle les ressources Azure ; les rôles Azure RBAC n'accordent pas de droits dans Windows." }
references:
  - title: Compare self-managed Active Directory Domain Services, Microsoft Entra ID, and managed Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/compare-identity-solutions
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
