id: az140-2b-adm-bastion-sku-peered
objective: "2.2.5"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Contoso has a hub virtual network peered with three spoke virtual networks. Each spoke contains the session hosts of one Azure Virtual Desktop host pool.

    You plan to deploy Azure Bastion in the hub so that administrators can connect to any session host from the Azure portal. The administrators don't need the native client, shareable links or session recording.

    You need to choose the Bastion SKU. The solution must minimize cost.

    Which SKU should you choose?
  fr: |
    Contoso dispose d'un réseau virtuel hub relié par peering à trois réseaux virtuels spoke. Chaque spoke contient les hôtes de session d'un pool d'hôtes Azure Virtual Desktop.

    Vous prévoyez de déployer Azure Bastion dans le hub pour que les administrateurs puissent se connecter à n'importe quel hôte de session depuis le portail Azure. Les administrateurs n'ont besoin ni du client natif, ni des liens partageables, ni de l'enregistrement de session.

    Vous devez choisir la référence SKU de Bastion. La solution doit réduire les coûts au minimum.

    Quelle référence SKU devez-vous choisir ?
body:
  options:
    - { id: a, text: Developer }
    - { id: b, text: Basic }
    - { id: c, text: Standard }
    - { id: d, text: Premium }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Bastion Basic connects to VMs in the same virtual network and in peered virtual networks from the Azure portal. Native client support, shareable links and host scaling start with Standard, and session recording needs Premium, so Basic is the least expensive SKU that meets the requirements.
    fr: |
      Bastion Basic se connecte depuis le portail Azure aux machines virtuelles du même réseau virtuel et des réseaux virtuels reliés par peering. La prise en charge du client natif, les liens partageables et la mise à l'échelle de l'hôte commencent avec Standard, et l'enregistrement de session exige Premium : Basic est donc la SKU la moins coûteuse qui répond aux exigences.
  options:
    a: { en: "Bastion Developer connects only to VMs in the same virtual network, not to peered virtual networks.", fr: "Bastion Developer ne se connecte qu'aux machines virtuelles du même réseau virtuel, pas aux réseaux virtuels reliés par peering." }
    c: { en: "Standard works but adds features that aren't needed, at a higher cost.", fr: "Standard fonctionne mais ajoute des fonctionnalités inutiles, pour un coût plus élevé." }
    d: { en: "Premium adds session recording and private-only deployment, which aren't required, at the highest cost.", fr: "Premium ajoute l'enregistrement de session et le déploiement privé uniquement, qui ne sont pas requis, pour le coût le plus élevé." }
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
