id: az140-sr1-mfa-offsite-1
objective: "2.1.4"
type: series_yesno
series: az140-sr1-mfa-offsite
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You target the Azure Virtual Desktop Azure Resource Manager Provider app.
  fr: Vous ciblez l'application Azure Virtual Desktop Azure Resource Manager Provider.
body:
  solution:
    en: |
      You create a Conditional Access policy that targets the users of HP-Sales and the **Azure Virtual Desktop Azure Resource Manager Provider** app (app ID `50e95039-b200-4007-bc97-8d5790743a63`). The policy includes any location, excludes HQ-Network, applies to the **Browser** and **Mobile apps and desktop clients** client apps, and grants access only with **Require multifactor authentication**.
    fr: |
      Vous créez une stratégie d'accès conditionnel qui cible les utilisateurs de HP-Sales et l'application **Azure Virtual Desktop Azure Resource Manager Provider** (ID d'application `50e95039-b200-4007-bc97-8d5790743a63`). La stratégie inclut n'importe quel emplacement, exclut HQ-Network, s'applique aux applications clientes **Navigateur** et **Applications mobiles et clients de bureau**, et accorde l'accès uniquement avec **Exiger l'authentification multifacteur**.
answer: { value: false }
explanation:
  correct:
    en: |
      The Azure Virtual Desktop Azure Resource Manager Provider app only retrieves the user feed, and Microsoft states that it must not be targeted by an MFA policy. The connection itself is authenticated through the Azure Virtual Desktop app, so users wouldn't be reliably prompted for MFA when they connect from home.
    fr: |
      L'application Azure Virtual Desktop Azure Resource Manager Provider sert uniquement à récupérer le flux de l'utilisateur, et Microsoft indique qu'elle ne doit pas être ciblée par une stratégie d'authentification multifacteur. La connexion elle-même est authentifiée par l'application Azure Virtual Desktop : les utilisateurs ne recevraient donc pas de manière fiable une invite d'authentification multifacteur depuis leur domicile.
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
