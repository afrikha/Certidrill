id: az140-2a-rights-developers-admin
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a pooled host pool named **HP-Shared** that runs Windows 11 Enterprise multi-session. Twenty developers who use HP-Shared request local administrator rights to install and test their own tools.

    You need to meet the developers' request. The solution must prevent the developers from affecting the sessions and data of other users, and it must follow Microsoft's security recommendations for Azure Virtual Desktop.

    What should you do?
  fr: |
    Proseware dispose d'un pool d'hôtes regroupé nommé **HP-Shared** qui exécute Windows 11 Entreprise multisession. Vingt développeurs qui utilisent HP-Shared demandent les droits d'administrateur local pour installer et tester leurs propres outils.

    Vous devez répondre à la demande des développeurs. La solution doit empêcher les développeurs d'affecter les sessions et les données des autres utilisateurs, et elle doit suivre les recommandations de sécurité de Microsoft pour Azure Virtual Desktop.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the developers to the local Administrators group of the HP-Shared session hosts.", fr: "Ajouter les développeurs au groupe Administrateurs local des hôtes de session de HP-Shared." } }
    - { id: b, text: { en: "Create a second pooled host pool reserved for the developers with local administrator rights.", fr: "Créer un second pool d'hôtes regroupé réservé aux développeurs avec les droits d'administrateur local." } }
    - { id: c, text: { en: "Publish the developers' tools as RemoteApp programs from HP-Shared.", fr: "Publier les outils des développeurs comme programmes RemoteApp depuis HP-Shared." } }
    - { id: d, text: { en: "Create a personal host pool and assign each developer their own session host.", fr: "Créer un pool d'hôtes personnel et attribuer à chaque développeur son propre hôte de session." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft recommends giving a personal desktop to users who need local administrator privileges, and not granting those rights in multi-session pooled host pools. On a shared host, a local administrator can cross session or NTFS boundaries, shut down the VM or otherwise disrupt other users.
    fr: |
      Microsoft recommande de donner un bureau personnel aux utilisateurs qui ont besoin des privilèges d'administrateur local, et de ne pas accorder ces droits dans des pools d'hôtes regroupés multisessions. Sur un hôte partagé, un administrateur local peut franchir les limites des sessions ou des autorisations NTFS, arrêter la machine virtuelle ou perturber d'une autre manière les autres utilisateurs.
  options:
    a: { en: "Local administrators on a multi-session host can affect every other user of that host.", fr: "Des administrateurs locaux sur un hôte multisession peuvent affecter tous les autres utilisateurs de cet hôte." }
    c: { en: "Publishing apps doesn't give developers the right to install software, and RemoteApp isn't a security boundary.", fr: "Publier des applications ne donne pas aux développeurs le droit d'installer des logiciels, et RemoteApp n'est pas une limite de sécurité." }
    b: { en: "The developers would still share multi-session hosts, so each one could affect the others' sessions and data.", fr: "Les développeurs partageraient toujours des hôtes multisessions : chacun pourrait affecter les sessions et les données des autres." }
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
