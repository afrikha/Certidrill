id: az140-2b-adm-jit-steps
objective: "2.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure subscription named Sub1 that has Microsoft Defender for Servers Plan 1 enabled. Sub1 contains a session host named HostVM1. A network security group is associated with the subnet of HostVM1. Administrators reach the private IP addresses of the session hosts over a site-to-site VPN.

    You need to ensure that TCP 3389 on HostVM1 is closed by default and that an administrator can open it for a limited time from their own IP address, and then connect.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un abonnement Azure nommé Sub1 sur lequel Microsoft Defender pour serveurs Plan 1 est activé. Sub1 contient un hôte de session nommé HostVM1. Un groupe de sécurité réseau est associé au sous-réseau de HostVM1. Les administrateurs joignent les adresses IP privées des hôtes de session par un VPN de site à site.

    Vous devez faire en sorte que TCP 3389 sur HostVM1 soit fermé par défaut et qu'un administrateur puisse l'ouvrir pour une durée limitée depuis sa propre adresse IP, puis se connecter.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: plan, text: { en: "Enable Defender for Servers Plan 2 on Sub1.", fr: "Activer Defender pour serveurs Plan 2 sur Sub1." } }
    - { id: enable, text: { en: "On the Configuration page of HostVM1, enable just-in-time access.", fr: "Dans la page Configuration de HostVM1, activer l'accès juste-à-temps." } }
    - { id: request, text: { en: "On the Connect page of HostVM1, request access for TCP 3389 from your IP address.", fr: "Dans la page Connect de HostVM1, demander l'accès pour TCP 3389 depuis votre adresse IP." } }
    - { id: rdp, text: { en: "Start an RDP connection to the private IP address of HostVM1.", fr: "Démarrer une connexion RDP vers l'adresse IP privée de HostVM1." } }
    - { id: subnet, text: { en: "Create a subnet named AzureBastionSubnet in the virtual network of HostVM1.", fr: "Créer un sous-réseau nommé AzureBastionSubnet dans le réseau virtuel de HostVM1." } }
    - { id: nsg, text: { en: "Add an inbound NSG rule that allows TCP 3389 from any source with priority 100.", fr: "Ajouter une règle NSG entrante qui autorise TCP 3389 depuis toute source avec la priorité 100." } }
answer:
  sequence: [ plan, enable, request, rdp ]
explanation:
  correct:
    en: |
      Just-in-time VM access is a Defender for Servers Plan 2 feature, so you enable Plan 2 first. Enabling JIT on the VM adds deny rules for the port; a request then opens TCP 3389 for the requester's IP address for the approved time (3 hours at most by default), after which you can connect.
    fr: |
      L'accès JIT aux machines virtuelles est une fonctionnalité de Defender pour serveurs Plan 2 : vous activez d'abord Plan 2. L'activation de JIT sur la machine virtuelle ajoute des règles de refus pour le port ; une demande ouvre ensuite TCP 3389 pour l'adresse IP du demandeur pendant la durée approuvée (3 heures au maximum par défaut), puis vous pouvez vous connecter.
  options:
    subnet: { en: "AzureBastionSubnet is needed for Azure Bastion, not for just-in-time access.", fr: "AzureBastionSubnet est nécessaire pour Azure Bastion, pas pour l'accès juste-à-temps." }
    nsg: { en: "A permanent allow rule from any source defeats the requirement that the port stays closed by default.", fr: "Une règle d'autorisation permanente depuis toute source va à l'encontre de l'exigence d'un port fermé par défaut." }
references:
  - title: Enable Just-in-Time Access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
