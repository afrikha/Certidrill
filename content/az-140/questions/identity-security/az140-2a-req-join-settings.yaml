id: az140-2a-req-join-settings
objective: "2.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum is preparing three Azure Virtual Desktop host pools, each with a different session host join type. Microsoft Entra single sign-on won't be enabled on any host pool for now.

    How should you complete the requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prépare trois pools d'hôtes Azure Virtual Desktop, chacun avec un type de jonction des hôtes de session différent. L'authentification unique Microsoft Entra ne sera activée sur aucun pool d'hôtes pour l'instant.

    Comment devez-vous compléter les conditions requises ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Pool-A (joined to the on-premises AD DS domain): set the DNS servers of the virtual network to [[dns]].

      Pool-B (joined to Microsoft Entra Domain Services): the domain join account must be a member of [[grp]].

      Pool-C (Microsoft Entra joined, users connect from the web client): add the custom RDP property [[rdp]].
    fr: |
      Pool-A (joint au domaine AD DS local) : définir les serveurs DNS du réseau virtuel sur [[dns]].

      Pool-B (joint à Microsoft Entra Domain Services) : le compte de jonction au domaine doit être membre de [[grp]].

      Pool-C (joint à Microsoft Entra, les utilisateurs se connectent depuis le client web) : ajouter la propriété RDP personnalisée [[rdp]].
  slots:
    - id: dns
      options:
        - { id: dc, text: { en: "the IP addresses of the domain controllers", fr: "les adresses IP des contrôleurs de domaine" } }
        - { id: azure, text: { en: "the Azure-provided DNS servers", fr: "les serveurs DNS fournis par Azure" } }
        - { id: public, text: { en: "a public DNS resolver", fr: "un résolveur DNS public" } }
    - id: grp
      options:
        - { id: domadmins, text: Domain Admins }
        - { id: aaddc, text: AAD DC Administrators }
        - { id: enterprise, text: Enterprise Admins }
        - { id: rdusers, text: Remote Desktop Users }
    - id: rdp
      options:
        - { id: target, text: "targetisaadjoined:i:1" }
        - { id: kdc, text: "kdcproxyname:s:kdc.adatum.com" }
        - { id: credssp, text: "enablecredsspsupport:i:0" }
        - { id: prompt, text: "promptcredentialonce:i:1" }
answer:
  values: { dns: dc, grp: aaddc, rdp: target }
explanation:
  correct:
    en: |
      AD DS-joined hosts need line of sight to the domain controllers, which starts with DNS servers that resolve the domain. Joining a Microsoft Entra Domain Services managed domain requires an account in the AAD DC Administrators group. Without single sign-on, connections to Microsoft Entra joined hosts from the web client (and from non-Windows or unjoined devices) require targetisaadjoined:i:1, which limits sign-in to a username and password.
    fr: |
      Les hôtes joints à AD DS ont besoin d'une visibilité directe sur les contrôleurs de domaine, ce qui commence par des serveurs DNS capables de résoudre le domaine. Joindre un domaine managé Microsoft Entra Domain Services exige un compte du groupe AAD DC Administrators. Sans authentification unique, les connexions aux hôtes joints à Microsoft Entra depuis le client web (et depuis des appareils non Windows ou non joints) exigent targetisaadjoined:i:1, qui limite la connexion à un nom d'utilisateur et un mot de passe.
  options:
    azure: { en: "Azure-provided DNS can't resolve the records of the on-premises domain.", fr: "Le DNS fourni par Azure ne peut pas résoudre les enregistrements du domaine local." }
    domadmins: { en: "A managed domain gives no Domain Admins rights to customers.", fr: "Un domaine managé ne donne aucun droit Domain Admins aux clients." }
    kdc: { en: "A KDC proxy is for Kerberos sign-in (smart cards) from outside the network, and the web client doesn't support it.", fr: "Un proxy KDC sert à la connexion Kerberos (cartes à puce) depuis l'extérieur du réseau, et le client web ne le prend pas en charge." }
    credssp: { en: "Disabling CredSSP doesn't allow unjoined clients to connect to Microsoft Entra joined hosts.", fr: "Désactiver CredSSP ne permet pas aux clients non joints de se connecter aux hôtes joints à Microsoft Entra." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
  - title: Microsoft Entra joined session hosts in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts
