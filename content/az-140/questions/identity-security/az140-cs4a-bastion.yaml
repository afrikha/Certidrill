id: az140-cs4a-bastion
objective: "2.2.5"
type: single
caseStudy: az140-cs4a-woodgrove-bank
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the administrative access requirement. What should you do?
  fr: |
    Vous devez satisfaire l'exigence d'accès administratif. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable IP-based connection on bas-hub and keep the Basic SKU.", fr: "Activer la connexion basée sur IP sur bas-hub et conserver la référence SKU Basic." } }
    - { id: b, text: { en: "Upgrade bas-hub to the Premium SKU and enable session recording.", fr: "Mettre à niveau bas-hub vers la référence SKU Premium et activer l'enregistrement de session." } }
    - { id: c, text: { en: "Upgrade bas-hub to the Standard SKU and enable Native Client Support.", fr: "Mettre à niveau bas-hub vers la référence SKU Standard et activer la prise en charge du client natif (Native Client Support)." } }
    - { id: d, text: { en: "Deploy a Bastion host with the Developer SKU and connect it to VNet-AVD.", fr: "Déployer un hôte Bastion avec la référence SKU Developer et le connecter à VNet-AVD." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Connections from a native client such as mstsc.exe require the Native Client Support setting, which is available on the Standard and Premium SKUs only. Standard is the cheaper of the two, and you can upgrade the existing Basic host in place from the portal. Bastion keeps connecting to the private IP addresses of the session hosts in the peered VNet-AVD, so they don't need public IP addresses.
    fr: |
      Les connexions depuis un client natif comme mstsc.exe exigent le paramètre Native Client Support, disponible uniquement avec les références SKU Standard et Premium. Standard est la moins chère des deux, et vous pouvez mettre à niveau l'hôte Basic existant sur place depuis le portail. Bastion continue de se connecter aux adresses IP privées des hôtes de session dans le réseau virtuel VNet-AVD relié par peering : ils n'ont pas besoin d'adresse IP publique.
  options:
    a: { en: "IP-based connection isn't available on the Basic SKU, and it doesn't enable native client connections.", fr: "La connexion basée sur IP n'est pas disponible avec la référence SKU Basic, et elle n'active pas les connexions depuis un client natif." }
    b: { en: "Premium also supports native client connections, but it costs more than Standard and session recording isn't required.", fr: "Premium prend aussi en charge les connexions depuis un client natif, mais coûte plus cher que Standard, et l'enregistrement de session n'est pas exigé." }
    d: { en: "The Developer SKU supports only portal connections to one VM at a time, without native client support or virtual network peering.", fr: "La référence SKU Developer ne prend en charge que les connexions depuis le portail vers une seule machine virtuelle à la fois, sans client natif ni peering de réseaux virtuels." }
references:
  - title: Configure Bastion for native client connections
    url: https://learn.microsoft.com/en-us/azure/bastion/native-client
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
