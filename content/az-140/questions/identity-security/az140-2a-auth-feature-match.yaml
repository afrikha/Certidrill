id: az140-2a-auth-feature-match
objective: "2.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum has Azure Virtual Desktop host pools whose session hosts are Microsoft Entra hybrid joined. Adatum has no AD FS deployment. You need to meet four authentication requirements.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de pools d'hôtes Azure Virtual Desktop dont les hôtes de session sont joints hybrides Microsoft Entra. Adatum n'a pas de déploiement AD FS. Vous devez répondre à quatre exigences d'authentification.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sso, text: { en: "Microsoft Entra single sign-on", fr: "Authentification unique Microsoft Entra" } }
    - { id: kdc, text: { en: "KDC proxy", fr: "Proxy KDC" } }
    - { id: webauthn, text: { en: "WebAuthn redirection", fr: "Redirection WebAuthn" } }
    - { id: cba, text: { en: "Microsoft Entra certificate-based authentication", fr: "Authentification par certificat Microsoft Entra" } }
    - { id: scredir, text: { en: "Smart card redirection", fr: "Redirection de carte à puce" } }
    - { id: perusermfa, text: { en: "Per-user MFA", fr: "Authentification multifacteur par utilisateur" } }
  targets:
    - id: t1
      text: { en: "Users sign in to Windows on the session host with a FIDO2 security key.", fr: "Les utilisateurs se connectent à Windows sur l'hôte de session avec une clé de sécurité FIDO2." }
    - id: t2
      text: { en: "In a remote session, users sign in to a website with the Windows Hello for Business credential of their local PC.", fr: "Dans une session à distance, les utilisateurs se connectent à un site web avec les informations d'identification Windows Hello Entreprise de leur PC local." }
    - id: t3
      text: { en: "Users sign in to Microsoft Entra ID, and therefore to the feed, with a smart card.", fr: "Les utilisateurs se connectent à Microsoft Entra ID, et donc au flux, avec une carte à puce." }
    - id: t4
      text: { en: "Users without a VPN sign in to host pools that don't use single sign-on with a smart card.", fr: "Des utilisateurs sans VPN se connectent avec une carte à puce à des pools d'hôtes qui n'utilisent pas l'authentification unique." }
answer:
  mapping: { t1: sso, t2: webauthn, t3: cba, t4: kdc }
explanation:
  correct:
    en: |
      Passwordless methods such as FIDO2 keys work for the session host sign-in only with Microsoft Entra single sign-on. In-session passwordless authentication relies on WebAuthn redirection to the local device. Signing in to Microsoft Entra ID with a smart card requires Microsoft Entra certificate-based authentication (or AD FS, which Adatum doesn't have). Without SSO, smart card sign-in to the host uses Kerberos, which a KDC proxy relays for users outside the network.
    fr: |
      Les méthodes sans mot de passe comme les clés FIDO2 ne fonctionnent pour la connexion à l'hôte de session qu'avec l'authentification unique Microsoft Entra. L'authentification sans mot de passe dans la session repose sur la redirection WebAuthn vers l'appareil local. Se connecter à Microsoft Entra ID avec une carte à puce exige l'authentification par certificat Microsoft Entra (ou AD FS, dont Adatum ne dispose pas). Sans authentification unique, la connexion par carte à puce à l'hôte utilise Kerberos, qu'un proxy KDC relaie pour les utilisateurs hors du réseau.
  options:
    scredir: { en: "Smart card redirection makes the card available to apps inside the session; it doesn't provide the Kerberos path to a domain controller.", fr: "La redirection de carte à puce rend la carte disponible pour les applications de la session ; elle ne fournit pas le chemin Kerberos vers un contrôleur de domaine." }
    perusermfa: { en: "MFA for Azure Virtual Desktop is enforced with Conditional Access; legacy per-user MFA doesn't provide any of these sign-in methods.", fr: "L'authentification multifacteur pour Azure Virtual Desktop s'impose avec l'accès conditionnel ; l'authentification multifacteur par utilisateur héritée ne fournit aucune de ces méthodes de connexion." }
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
  - title: Configure a Kerberos Key Distribution Center proxy
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/key-distribution-center-proxy
