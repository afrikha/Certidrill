id: az140-2a-scenario-schema-app
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has no on-premises infrastructure. It plans to deploy an Azure Virtual Desktop host pool named **HP-Design** for 120 designers.

    A design application must run on the session hosts. The application requires:

    - Kerberos authentication to a domain;
    - an extension of the directory schema during its installation;
    - an installer that runs with Domain Admins rights.

    You need to recommend an identity solution for the HP-Design session hosts that supports the application.

    What should you recommend?
  fr: |
    Wingtip Toys ne dispose d'aucune infrastructure locale. L'entreprise prévoit de déployer un pool d'hôtes Azure Virtual Desktop nommé **HP-Design** pour 120 designers.

    Une application de conception doit s'exécuter sur les hôtes de session. Cette application exige :

    - l'authentification Kerberos auprès d'un domaine ;
    - une extension du schéma de l'annuaire lors de son installation ;
    - un programme d'installation exécuté avec les droits Domain Admins.

    Vous devez recommander une solution d'identité pour les hôtes de session de HP-Design qui prend en charge l'application.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable Microsoft Entra Domain Services and join the session hosts to the managed domain.", fr: "Activer Microsoft Entra Domain Services et joindre les hôtes de session au domaine managé." } }
    - { id: b, text: { en: "Join the session hosts to Microsoft Entra ID and enable Microsoft Entra Kerberos.", fr: "Joindre les hôtes de session à Microsoft Entra ID et activer Microsoft Entra Kerberos." } }
    - { id: c, text: { en: "Deploy AD DS domain controllers on Azure VMs and join the session hosts to the domain.", fr: "Déployer des contrôleurs de domaine AD DS sur des machines virtuelles Azure et y joindre les hôtes de session." } }
    - { id: d, text: { en: "Join the session hosts to Microsoft Entra ID and publish the application by using App attach.", fr: "Joindre les hôtes de session à Microsoft Entra ID et publier l'application à l'aide d'App attach." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Microsoft Entra Domain Services managed domain supports Kerberos and Group Policy, but it doesn't allow schema extensions and gives no Domain Admins or Enterprise Admins privileges. Only a self-managed AD DS domain meets the three requirements; its users are synchronized to Microsoft Entra ID with Microsoft Entra Connect so that they can use Azure Virtual Desktop.
    fr: |
      Un domaine managé Microsoft Entra Domain Services prend en charge Kerberos et la stratégie de groupe, mais il n'autorise pas les extensions de schéma et ne donne aucun privilège Domain Admins ni Enterprise Admins. Seul un domaine AD DS autogéré répond aux trois exigences ; ses utilisateurs sont synchronisés vers Microsoft Entra ID avec Microsoft Entra Connect pour pouvoir utiliser Azure Virtual Desktop.
  options:
    a: { en: "Schema extensions and Domain Admins rights aren't available in a managed domain.", fr: "Les extensions de schéma et les droits Domain Admins ne sont pas disponibles dans un domaine managé." }
    b: { en: "Microsoft Entra joined hosts aren't joined to any domain: there is no schema to extend and no Domain Admins group.", fr: "Les hôtes joints à Microsoft Entra ne sont joints à aucun domaine : il n'y a ni schéma à étendre ni groupe Domain Admins." }
    d: { en: "App attach changes how the application is delivered, not the directory it depends on.", fr: "App attach change la façon dont l'application est livrée, pas l'annuaire dont elle dépend." }
references:
  - title: Compare self-managed Active Directory Domain Services, Microsoft Entra ID, and managed Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/compare-identity-solutions
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
