id: az140-cs3c-hybrid-join
objective: "2.1.2"
type: single
caseStudy: az140-cs3c-relecloud
difficulty: 2
status: draft
stem:
  en: |
    Before you enable Microsoft Entra single sign-on on the host pools, you must change the configuration of the session hosts to meet the requirements. What should you do?
  fr: |
    Avant d'activer l'authentification unique Microsoft Entra sur les pools d'hôtes, vous devez modifier la configuration des hôtes de session pour respecter les exigences. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Redeploy the session hosts as Microsoft Entra joined VMs.", fr: "Redéployer les hôtes de session en tant que machines virtuelles jointes à Microsoft Entra." } }
    - { id: b, text: { en: "Configure the session hosts as Microsoft Entra hybrid joined devices.", fr: "Configurer les hôtes de session comme appareils joints à Microsoft Entra hybride." } }
    - { id: c, text: { en: "Join the session hosts to a Microsoft Entra Domain Services managed domain.", fr: "Joindre les hôtes de session à un domaine managé Microsoft Entra Domain Services." } }
    - { id: d, text: { en: "Add the RDP property targetisaadjoined:i:1 to the host pools.", fr: "Ajouter la propriété RDP targetisaadjoined:i:1 aux pools d'hôtes." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft Entra SSO requires session hosts that are Microsoft Entra joined or Microsoft Entra hybrid joined; hosts joined only to AD DS aren't supported. Hybrid join keeps the session hosts in the relecloud.com domain, as the BIM license server requires. For hybrid joined hosts, you also create a Kerberos Server object before you enable SSO.
    fr: |
      L'authentification unique Microsoft Entra exige des hôtes de session joints à Microsoft Entra ou joints à Microsoft Entra hybride ; les hôtes joints uniquement à AD DS ne sont pas pris en charge. La jonction hybride maintient les hôtes de session dans le domaine relecloud.com, comme l'exige le serveur de licences BIM. Pour des hôtes joints à Microsoft Entra hybride, vous créez aussi un objet serveur Kerberos avant d'activer le SSO.
  options:
    a: { en: "Microsoft Entra joined VMs are no longer members of relecloud.com, which the BIM license server requires.", fr: "Des machines virtuelles jointes à Microsoft Entra ne sont plus membres de relecloud.com, ce qu'exige le serveur de licences BIM." }
    c: { en: "SSO isn't supported on session hosts joined to Microsoft Entra Domain Services, and they would leave relecloud.com.", fr: "Le SSO n'est pas pris en charge sur des hôtes de session joints à Microsoft Entra Domain Services, et ils quitteraient relecloud.com." }
    d: { en: "targetisaadjoined is a host pool RDP property for Microsoft Entra joined hosts that restricts sign-in to a user name and password; it doesn't enable SSO.", fr: "targetisaadjoined est une propriété RDP de pool d'hôtes pour les hôtes joints à Microsoft Entra qui limite la connexion au nom d'utilisateur et au mot de passe ; elle n'active pas le SSO." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
