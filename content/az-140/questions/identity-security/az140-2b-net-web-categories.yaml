id: az140-2b-net-web-categories
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware routes all the outbound traffic of its Azure Virtual Desktop session hosts through an Azure Firewall named FW1. FW1 already allows the endpoints required by Azure Virtual Desktop. Proseware has no other proxy or web gateway.

    You need to prevent users from browsing gambling and social networking websites from their sessions. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Proseware fait passer tout le trafic sortant de ses hôtes de session Azure Virtual Desktop par un Pare-feu Azure nommé FW1. FW1 autorise déjà les points de terminaison requis par Azure Virtual Desktop. Proseware n'a aucun autre proxy ni passerelle web.

    Vous devez empêcher les utilisateurs de consulter des sites de jeux d'argent et de réseaux sociaux depuis leurs sessions. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An outbound NSG rule on the session host subnet that denies the Internet service tag", fr: "Une règle NSG sortante sur le sous-réseau des hôtes de session qui refuse l'étiquette de service Internet" } }
    - { id: b, text: { en: "Explicit proxy settings for Microsoft Edge on the session hosts", fr: "Des paramètres de proxy explicite pour Microsoft Edge sur les hôtes de session" } }
    - { id: c, text: { en: "An application rule in the FW1 policy that denies the matching web categories", fr: "Une règle d'application dans la stratégie de FW1 qui refuse les catégories web correspondantes" } }
    - { id: d, text: { en: "A route for 0.0.0.0/0 with the next hop type None on the session host subnet", fr: "Un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant None sur le sous-réseau des hôtes de session" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Firewall application rules can allow or deny website categories for given source addresses, so one rule blocks whole categories such as gambling or social networking without listing sites. Microsoft documents this to control the internet access of Azure Virtual Desktop users.
    fr: |
      Les règles d'application du Pare-feu Azure peuvent autoriser ou refuser des catégories de sites web pour des adresses sources données : une seule règle bloque des catégories entières, comme les jeux d'argent ou les réseaux sociaux, sans lister les sites. Microsoft documente cette méthode pour contrôler l'accès Internet des utilisateurs d'Azure Virtual Desktop.
  options:
    a: { en: "An NSG works on IP addresses and service tags; denying Internet blocks all websites and can break Azure Virtual Desktop endpoints.", fr: "Un NSG travaille sur des adresses IP et des étiquettes de service ; refuser Internet bloque tous les sites et peut casser les points de terminaison Azure Virtual Desktop." }
    b: { en: "An explicit proxy is used to send browsing to an existing web gateway, and Proseware has none.", fr: "Un proxy explicite sert à envoyer la navigation vers une passerelle web existante, et Proseware n'en a pas." }
    d: { en: "A next hop of None drops all internet traffic, including the traffic Azure Virtual Desktop needs.", fr: "Un tronçon suivant None supprime tout le trafic Internet, y compris celui dont Azure Virtual Desktop a besoin." }
references:
  - title: Use Azure Firewall to protect Azure Virtual Desktop deployments
    url: https://learn.microsoft.com/en-us/azure/firewall/protect-azure-virtual-desktop
