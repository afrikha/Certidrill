id: az140-2b-av-powershell-shared
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a pooled Azure Virtual Desktop host pool. The session hosts use FSLogix profile containers and Microsoft Defender Antivirus. A management server unpacks the latest security intelligence updates every day to `\\fs01.fabrikam.com\mdatp$\wdav-update`.

    You need to configure each session host by using PowerShell to meet the following requirements:

    - The session hosts must use the updates that are already unpacked on the share instead of downloading and unpacking them.
    - Microsoft Defender Antivirus must not scan the FSLogix service processes.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un pool d'hôtes regroupé Azure Virtual Desktop. Les hôtes de session utilisent des conteneurs de profil FSLogix et Microsoft Defender Antivirus. Un serveur de gestion décompresse chaque jour les dernières mises à jour des informations de sécurité dans `\\fs01.fabrikam.com\mdatp$\wdav-update`.

    Vous devez configurer chaque hôte de session avec PowerShell pour répondre aux exigences suivantes :

    - Les hôtes de session doivent utiliser les mises à jour déjà décompressées sur le partage au lieu de les télécharger et de les décompresser.
    - Microsoft Defender Antivirus ne doit pas analyser les processus des services FSLogix.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-MpPreference -[[p1]] "\\fs01.fabrikam.com\mdatp$\wdav-update"
    Add-MpPreference -[[p2]] "frxsvc.exe", "frxccds.exe"
  slots:
    - id: p1
      options:
        - { id: shared, text: SharedSignaturesPath }
        - { id: sources, text: SignatureDefinitionUpdateFileSharesSources }
        - { id: interval, text: SignatureUpdateInterval }
        - { id: fallback, text: SignatureFallbackOrder }
    - id: p2
      options:
        - { id: path, text: ExclusionPath }
        - { id: process, text: ExclusionProcess }
        - { id: ext, text: ExclusionExtension }
        - { id: cfa, text: ControlledFolderAccessAllowedApplications }
answer:
  values: { p1: shared, p2: process }
explanation:
  correct:
    en: "`-SharedSignaturesPath` sets the security intelligence location for VDI clients: the VMs load the updates already unpacked on the share, which saves CPU, disk and memory on each host. `-ExclusionProcess` excludes the files opened by the listed processes, which is how FSLogix guidance excludes `frxsvc.exe` and `frxccds.exe`."
    fr: "`-SharedSignaturesPath` définit l'emplacement des informations de sécurité pour les clients VDI : les machines virtuelles chargent les mises à jour déjà décompressées sur le partage, ce qui économise processeur, disque et mémoire sur chaque hôte. `-ExclusionProcess` exclut les fichiers ouverts par les processus listés, ce qui correspond à l'exclusion de `frxsvc.exe` et `frxccds.exe` recommandée pour FSLogix."
  options:
    sources: { en: "SignatureDefinitionUpdateFileSharesSources lists file shares from which each client downloads update packages and processes them itself.", fr: "SignatureDefinitionUpdateFileSharesSources liste des partages de fichiers à partir desquels chaque client télécharge les packages de mise à jour et les traite lui-même." }
    interval: { en: "SignatureUpdateInterval sets how often the client checks for updates, not where shared updates are.", fr: "SignatureUpdateInterval définit la fréquence de recherche des mises à jour, pas l'emplacement des mises à jour partagées." }
    fallback: { en: "SignatureFallbackOrder sets the order of update sources; it doesn't use pre-unpacked updates.", fr: "SignatureFallbackOrder définit l'ordre des sources de mise à jour ; il n'utilise pas de mises à jour décompressées à l'avance." }
    path: { en: "ExclusionPath excludes the executable files themselves, not the files the processes open.", fr: "ExclusionPath exclut les fichiers exécutables eux-mêmes, pas les fichiers que les processus ouvrent." }
    ext: { en: "ExclusionExtension excludes file types, such as VHDX, not processes.", fr: "ExclusionExtension exclut des types de fichiers, comme VHDX, pas des processus." }
    cfa: { en: "This parameter allows apps to write to folders protected by controlled folder access; it isn't an antivirus exclusion.", fr: "Ce paramètre autorise des applications à écrire dans les dossiers protégés par l'accès contrôlé aux dossiers ; ce n'est pas une exclusion antivirus." }
references:
  - title: Configure Microsoft Defender Antivirus on a remote desktop or virtual desktop infrastructure environment
    url: https://learn.microsoft.com/en-us/defender-endpoint/deployment-vdi-microsoft-defender-antivirus
  - title: Prerequisites for FSLogix
    url: https://learn.microsoft.com/en-us/fslogix/overview-prerequisites
