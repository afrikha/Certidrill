id: az140-2b-adm-access-match
objective: "2.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware is designing administrative access to its Azure Virtual Desktop session hosts. The session hosts have no public IP addresses. Each requirement must be met at the lowest cost.

    Which option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit l'accès administratif à ses hôtes de session Azure Virtual Desktop. Les hôtes de session n'ont pas d'adresse IP publique. Chaque exigence doit être satisfaite au coût le plus bas.

    Quelle option devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: basic, text: Azure Bastion Basic }
    - { id: standard, text: Azure Bastion Standard }
    - { id: premium, text: Azure Bastion Premium }
    - { id: jit, text: { en: "Just-in-time VM access", fr: "Accès JIT aux machines virtuelles" } }
  targets:
    - { id: t1, text: { en: "Record the RDP sessions that administrators open to the session hosts", fr: "Enregistrer les sessions RDP que les administrateurs ouvrent vers les hôtes de session" } }
    - { id: t2, text: { en: "Connect from the native Windows Remote Desktop client on an administrator workstation", fr: "Se connecter depuis le client Bureau à distance natif de Windows sur un poste d'administrateur" } }
    - { id: t3, text: { en: "Deploy the bastion host without any public IP address", fr: "Déployer l'hôte bastion sans aucune adresse IP publique" } }
    - { id: t4, text: { en: "Keep TCP 3389 closed in the NSG except during approved time windows requested over the site-to-site VPN", fr: "Garder TCP 3389 fermé dans le NSG sauf pendant des périodes approuvées demandées via le VPN de site à site" } }
answer:
  mapping: { t1: premium, t2: standard, t3: premium, t4: jit }
explanation:
  correct:
    en: |
      Session recording and private-only deployment (no public IP) are Bastion Premium features. Native client connections are available from Bastion Standard, the cheaper of the two SKUs that support them. Opening the management port only for approved, time-limited requests is just-in-time VM access.
    fr: |
      L'enregistrement de session et le déploiement privé uniquement (sans adresse IP publique) sont des fonctionnalités de Bastion Premium. Les connexions avec le client natif sont disponibles à partir de Bastion Standard, la moins chère des deux SKU qui les prennent en charge. N'ouvrir le port de gestion que pour des demandes approuvées et limitées dans le temps correspond à l'accès JIT aux machines virtuelles.
  options:
    basic: { en: "Bastion Basic supports only Azure portal connections, without native client, recording or private-only deployment.", fr: "Bastion Basic ne prend en charge que les connexions depuis le portail Azure, sans client natif, enregistrement ni déploiement privé uniquement." }
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
  - title: Understand Just-in-time Virtual Machine Access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview
