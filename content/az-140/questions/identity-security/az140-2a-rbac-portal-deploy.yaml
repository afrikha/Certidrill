id: az140-2a-rbac-portal-deploy
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An administrator named **Admin1** has the Desktop Virtualization Host Pool Contributor role on a resource group named **RG-Lab**.

    Admin1 must use the Azure portal to create, in RG-Lab, a new host pool with session host virtual machines, its desktop application group and a new workspace. Admin1 won't assign users. The solution must follow the principle of least privilege.

    Which three additional roles should you assign to Admin1 on RG-Lab? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur nommé **Admin1** a le rôle Desktop Virtualization Host Pool Contributor sur un groupe de ressources nommé **RG-Lab**.

    Admin1 doit utiliser le portail Azure pour créer dans RG-Lab un nouveau pool d'hôtes avec des machines virtuelles hôtes de session, son groupe d'applications de bureau et un nouvel espace de travail. Admin1 n'attribuera pas d'utilisateurs. La solution doit respecter le principe du privilège minimum.

    Quels sont les trois rôles supplémentaires à attribuer à Admin1 sur RG-Lab ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: Virtual Machine Contributor }
    - { id: b, text: Desktop Virtualization Application Group Contributor }
    - { id: c, text: Desktop Virtualization Workspace Contributor }
    - { id: d, text: Desktop Virtualization Session Host Operator }
    - { id: e, text: User Access Administrator }
    - { id: f, text: Desktop Virtualization Power On Contributor }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      Desktop Virtualization Host Pool Contributor manages host pools only. Creating the virtual machines also requires Virtual Machine Contributor, and a portal deployment that creates the application group and the workspace also requires Desktop Virtualization Application Group Contributor and Desktop Virtualization Workspace Contributor (or Desktop Virtualization Contributor, which isn't offered).
    fr: |
      Desktop Virtualization Host Pool Contributor gère uniquement les pools d'hôtes. Créer les machines virtuelles exige aussi Virtual Machine Contributor, et un déploiement depuis le portail qui crée le groupe d'applications et l'espace de travail exige aussi Desktop Virtualization Application Group Contributor et Desktop Virtualization Workspace Contributor (ou Desktop Virtualization Contributor, qui n'est pas proposé).
  options:
    d: { en: "Session Host Operator views and removes session hosts and changes drain mode; it adds nothing that the deployment needs.", fr: "Session Host Operator affiche et supprime des hôtes de session et change le mode drainage ; il n'apporte rien dont le déploiement a besoin." }
    e: { en: "User Access Administrator is needed only to assign users, which Admin1 won't do.", fr: "User Access Administrator n'est nécessaire que pour attribuer des utilisateurs, ce qu'Admin1 ne fera pas." }
    f: { en: "Power On Contributor lets the Azure Virtual Desktop service start VMs for Start VM on Connect; it doesn't create anything.", fr: "Power On Contributor permet au service Azure Virtual Desktop de démarrer des machines virtuelles pour Start VM on Connect ; il ne crée rien." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
