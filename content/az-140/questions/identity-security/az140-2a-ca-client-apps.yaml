id: az140-2a-ca-client-apps
objective: "2.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are creating a Conditional Access policy named **CA-AVD** that requires multifactor authentication for the Azure Virtual Desktop app. Users connect by using Windows App on Windows and macOS, and by using Windows App in a web browser.

    You set **Conditions** > **Client apps** > **Configure** to **Yes**. You need the policy to apply to all the Azure Virtual Desktop clients that the users use, but not to legacy authentication clients.

    Which two client apps should you select? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une stratégie d'accès conditionnel nommée **CA-AVD** qui exige l'authentification multifacteur pour l'application Azure Virtual Desktop. Les utilisateurs se connectent avec Windows App sur Windows et macOS, et avec Windows App dans un navigateur web.

    Vous définissez **Conditions** > **Applications clientes** > **Configurer** sur **Oui**. La stratégie doit s'appliquer à tous les clients Azure Virtual Desktop que les utilisateurs emploient, mais pas aux clients d'authentification hérités.

    Quelles sont les deux applications clientes à sélectionner ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Exchange ActiveSync clients", fr: "Clients Exchange ActiveSync" } }
    - { id: b, text: { en: "Browser", fr: "Navigateur" } }
    - { id: c, text: { en: "Other clients", fr: "Autres clients" } }
    - { id: d, text: { en: "Mobile apps and desktop clients", fr: "Applications mobiles et clients de bureau" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Browser covers the web client, and Mobile apps and desktop clients covers the other clients. Selecting both applies the policy to every Azure Virtual Desktop client; the legacy authentication clients are left unselected.
    fr: |
      Navigateur couvre le client web, et Applications mobiles et clients de bureau couvre les autres clients. Sélectionner les deux applique la stratégie à tous les clients Azure Virtual Desktop ; les clients d'authentification hérités restent non sélectionnés.
  options:
    a: { en: "Exchange ActiveSync is a legacy authentication client type used by mail apps.", fr: "Exchange ActiveSync est un type de client d'authentification hérité utilisé par les applications de messagerie." }
    c: { en: "Other clients are legacy authentication clients, which must not be selected.", fr: "Autres clients désigne des clients d'authentification hérités, qui ne doivent pas être sélectionnés." }
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
