id: az140-2a-scenario-adds-only
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has an on-premises Active Directory Domain Services (AD DS) forest named litware.com that contains 800 users. Users sign in to Microsoft 365 by using AD FS. No directory synchronization is configured, and the users don't exist in Microsoft Entra ID.

    You plan to deploy Azure Virtual Desktop session hosts joined to litware.com. A site-to-site VPN connects the session host virtual network to the domain controllers.

    What should you do first so that the users can access Azure Virtual Desktop?
  fr: |
    Litware dispose d'une forêt Active Directory Domain Services (AD DS) locale nommée litware.com qui contient 800 utilisateurs. Les utilisateurs se connectent à Microsoft 365 à l'aide d'AD FS. Aucune synchronisation d'annuaire n'est configurée et les utilisateurs n'existent pas dans Microsoft Entra ID.

    Vous prévoyez de déployer des hôtes de session Azure Virtual Desktop joints à litware.com. Un VPN site à site connecte le réseau virtuel des hôtes de session aux contrôleurs de domaine.

    Que devez-vous faire en premier pour que les utilisateurs puissent accéder à Azure Virtual Desktop ?
body:
  options:
    - { id: a, text: { en: "Configure the session hosts to authenticate users directly against AD FS.", fr: "Configurer les hôtes de session pour authentifier les utilisateurs directement auprès d'AD FS." } }
    - { id: b, text: { en: "Deploy Microsoft Entra Domain Services and join the session hosts to it.", fr: "Déployer Microsoft Entra Domain Services et y joindre les hôtes de session." } }
    - { id: c, text: { en: "Synchronize the users to Microsoft Entra ID by using Microsoft Entra Connect.", fr: "Synchroniser les utilisateurs vers Microsoft Entra ID à l'aide de Microsoft Entra Connect." } }
    - { id: d, text: { en: "Invite the users to the Microsoft Entra tenant as B2B guest users.", fr: "Inviter les utilisateurs dans le locataire Microsoft Entra en tant qu'invités B2B." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Virtual Desktop always authenticates users with Microsoft Entra ID, so identities that exist only in AD DS, even with AD FS, aren't supported. Synchronizing the users with Microsoft Entra Connect creates hybrid identities that can sign in to the service and then to the AD DS-joined session hosts.
    fr: |
      Azure Virtual Desktop authentifie toujours les utilisateurs avec Microsoft Entra ID ; les identités qui n'existent que dans AD DS, même avec AD FS, ne sont donc pas prises en charge. Synchroniser les utilisateurs avec Microsoft Entra Connect crée des identités hybrides qui peuvent se connecter au service, puis aux hôtes de session joints à AD DS.
  options:
    a: { en: "A standalone AD DS deployment with AD FS isn't supported: users must be discoverable in Microsoft Entra ID.", fr: "Un déploiement AD DS autonome avec AD FS n'est pas pris en charge : les utilisateurs doivent être visibles dans Microsoft Entra ID." }
    b: { en: "Microsoft Entra Domain Services synchronizes users from Microsoft Entra ID, where the Litware users don't exist yet.", fr: "Microsoft Entra Domain Services synchronise les utilisateurs depuis Microsoft Entra ID, où les utilisateurs de Litware n'existent pas encore." }
    d: { en: "Guest accounts would not match the users' AD DS accounts on the domain-joined session hosts, and the users belong to the organization itself.", fr: "Des comptes invités ne correspondraient pas aux comptes AD DS des utilisateurs sur les hôtes de session joints au domaine, et ces utilisateurs appartiennent à l'organisation elle-même." }
references:
  - title: Supported identities and authentication methods
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/authentication
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
