id: az140-2a-req-entra-joined-clients
objective: "2.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware has a pooled host pool named **HP-Field** whose session hosts are Microsoft Entra joined and are in a resource group named **RG-Field**. HP-Field doesn't use a session host configuration.

    The members of a group named **Field-Users** are assigned to the desktop application group of HP-Field. They connect from personal Mac computers and from Windows PCs that aren't joined or registered in the Litware tenant. The security team hasn't approved Microsoft Entra single sign-on yet, so it must not be enabled.

    You need the members of Field-Users to be able to sign in to the HP-Field session hosts.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pool d'hôtes regroupé nommé **HP-Field** dont les hôtes de session sont joints à Microsoft Entra et se trouvent dans un groupe de ressources nommé **RG-Field**. HP-Field n'utilise pas de configuration d'hôte de session.

    Les membres d'un groupe nommé **Field-Users** sont attribués au groupe d'applications de bureau de HP-Field. Ils se connectent depuis des Mac personnels et depuis des PC Windows qui ne sont ni joints ni inscrits dans le locataire Litware. L'équipe de sécurité n'a pas encore approuvé l'authentification unique Microsoft Entra : elle ne doit pas être activée.

    Vous devez permettre aux membres de Field-Users de se connecter aux hôtes de session de HP-Field.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Virtual Machine User Login role to Field-Users on RG-Field.", fr: "Attribuer le rôle Virtual Machine User Login à Field-Users sur RG-Field." } }
    - { id: b, text: { en: "Assign the Virtual Machine Contributor role to Field-Users on RG-Field.", fr: "Attribuer le rôle Virtual Machine Contributor à Field-Users sur RG-Field." } }
    - { id: c, text: { en: "Add the custom RDP property targetisaadjoined:i:1 to HP-Field.", fr: "Ajouter la propriété RDP personnalisée targetisaadjoined:i:1 à HP-Field." } }
    - { id: d, text: { en: "Add the custom RDP property kdcproxyname:s:kdc.litware.com to HP-Field.", fr: "Ajouter la propriété RDP personnalisée kdcproxyname:s:kdc.litware.com à HP-Field." } }
    - { id: e, text: { en: "Enroll the session hosts in Microsoft Intune.", fr: "Inscrire les hôtes de session dans Microsoft Intune." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      For a host pool without a session host configuration, users of Microsoft Entra joined hosts need the Virtual Machine User Login role, ideally on the resource group and assigned to the same group as the application group. Without single sign-on, only Windows PCs joined, hybrid joined or registered in the same tenant can connect by default; for other PCs and for macOS, add targetisaadjoined:i:1, which limits sign-in to a username and password.
    fr: |
      Pour un pool d'hôtes sans configuration d'hôte de session, les utilisateurs d'hôtes joints à Microsoft Entra ont besoin du rôle Virtual Machine User Login, idéalement sur le groupe de ressources et attribué au même groupe que le groupe d'applications. Sans authentification unique, seuls les PC Windows joints, joints hybrides ou inscrits dans le même locataire se connectent par défaut ; pour les autres PC et pour macOS, ajoutez targetisaadjoined:i:1, qui limite la connexion à un nom d'utilisateur et un mot de passe.
  options:
    b: { en: "Virtual Machine Contributor manages the VM resources but grants no sign-in right to the operating system.", fr: "Virtual Machine Contributor gère les ressources machine virtuelle mais n'accorde aucun droit de connexion au système d'exploitation." }
    d: { en: "A KDC proxy relays Kerberos traffic to domain controllers for smart card sign-in; it doesn't allow unjoined devices to reach Microsoft Entra joined hosts.", fr: "Un proxy KDC relaie le trafic Kerberos vers les contrôleurs de domaine pour la connexion par carte à puce ; il ne permet pas aux appareils non joints d'atteindre des hôtes joints à Microsoft Entra." }
    e: { en: "Intune enrollment is optional management; it doesn't grant sign-in rights or change the client requirements.", fr: "L'inscription dans Intune est une gestion facultative ; elle n'accorde pas de droit de connexion et ne change pas les exigences du client." }
references:
  - title: Microsoft Entra joined session hosts in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
