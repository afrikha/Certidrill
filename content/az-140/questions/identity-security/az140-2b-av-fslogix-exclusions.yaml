id: az140-2b-av-fslogix-exclusions
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a pooled Azure Virtual Desktop host pool. The session hosts use FSLogix profile containers in VHDX format stored in `\\stcontosoprof.file.core.windows.net\profiles`. Cloud Cache isn't used. Microsoft Defender Antivirus runs on the session hosts with no exclusions.

    Users report slow sign-ins, and some users receive temporary profiles.

    You need to configure the Microsoft Defender Antivirus file and folder exclusions recommended for FSLogix.

    Which two exclusions should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pool d'hôtes regroupé Azure Virtual Desktop. Les hôtes de session utilisent des conteneurs de profil FSLogix au format VHDX stockés dans `\\stcontosoprof.file.core.windows.net\profiles`. Cloud Cache n'est pas utilisé. Microsoft Defender Antivirus s'exécute sur les hôtes de session sans aucune exclusion.

    Les utilisateurs signalent des connexions lentes, et certains reçoivent des profils temporaires.

    Vous devez configurer les exclusions de fichiers et de dossiers de Microsoft Defender Antivirus recommandées pour FSLogix.

    Quelles sont les deux exclusions à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`%USERPROFILE%\\Documents\\*`" }
    - { id: b, text: "`\\\\stcontosoprof.file.core.windows.net\\profiles\\*\\*.VHDX`" }
    - { id: c, text: "`%ProgramFiles%\\Microsoft Office\\root\\*`" }
    - { id: d, text: "`%TEMP%\\*\\*.VHDX`" }
    - { id: e, text: "`%WINDIR%\\System32\\*.dll`" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      FSLogix guidance excludes the VHD(X) containers on the SMB share (with their .lock, .meta and .metadata files) and the temporary VHD(X) files such as difference disks under `%TEMP%` and `%WINDIR%\TEMP`. Scanning containers while they attach causes delays, sharing violations and temporary profiles.
    fr: |
      Les recommandations FSLogix excluent les conteneurs VHD(X) du partage SMB (avec leurs fichiers .lock, .meta et .metadata) et les fichiers VHD(X) temporaires, comme les disques de différenciation, sous `%TEMP%` et `%WINDIR%\TEMP`. L'analyse des conteneurs pendant leur attachement provoque des délais, des violations de partage et des profils temporaires.
  options:
    a: { en: "The Documents folder is user data inside the profile; excluding it only reduces protection.", fr: "Le dossier Documents contient des données utilisateur du profil ; l'exclure ne fait que réduire la protection." }
    c: { en: "Microsoft 365 Apps binaries aren't part of the FSLogix exclusion list.", fr: "Les fichiers binaires de Microsoft 365 Apps ne font pas partie de la liste d'exclusions FSLogix." }
    e: { en: "Excluding system DLLs opens a large security gap and isn't related to FSLogix.", fr: "Exclure les DLL système crée une importante faille de sécurité et n'a aucun rapport avec FSLogix." }
references:
  - title: Prerequisites for FSLogix
    url: https://learn.microsoft.com/en-us/fslogix/overview-prerequisites
