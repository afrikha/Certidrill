id: az140-2a-ca-windows365-block
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware uses Azure Virtual Desktop and doesn't use Windows 365. The tenant has the following Conditional Access policies:

    | Policy | Users | Target resources | Grant |
    | --- | --- | --- | --- |
    | CA-AVD-MFA | AVD-Users | Azure Virtual Desktop | Require multifactor authentication |
    | CA-Block-Unused | All users | Windows 365 | Block access |

    The members of AVD-Users can connect from Windows App on their Windows PCs. When they sign in to Windows App in a web browser, Conditional Access blocks them.

    You need the members of AVD-Users to connect from a web browser. The solution must keep MFA for the Azure Virtual Desktop connections.

    What should you do?
  fr: |
    Proseware utilise Azure Virtual Desktop et n'utilise pas Windows 365. Le locataire contient les stratégies d'accès conditionnel suivantes :

    | Stratégie | Utilisateurs | Ressources cibles | Accorder |
    | --- | --- | --- | --- |
    | CA-AVD-MFA | AVD-Users | Azure Virtual Desktop | Exiger l'authentification multifacteur |
    | CA-Block-Unused | Tous les utilisateurs | Windows 365 | Bloquer l'accès |

    Les membres d'AVD-Users peuvent se connecter depuis Windows App sur leurs PC Windows. Quand ils se connectent à Windows App dans un navigateur web, l'accès conditionnel les bloque.

    Vous devez permettre aux membres d'AVD-Users de se connecter depuis un navigateur web. La solution doit conserver l'authentification multifacteur pour les connexions à Azure Virtual Desktop.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Exclude AVD-Users from CA-Block-Unused.", fr: "Exclure AVD-Users de CA-Block-Unused." } }
    - { id: b, text: { en: "Add Browser to the client apps condition of CA-AVD-MFA.", fr: "Ajouter Navigateur à la condition Applications clientes de CA-AVD-MFA." } }
    - { id: c, text: { en: "Add Windows Cloud Login to the target resources of CA-AVD-MFA.", fr: "Ajouter Windows Cloud Login aux ressources cibles de CA-AVD-MFA." } }
    - { id: d, text: { en: "Add the Azure Virtual Desktop Azure Resource Manager Provider app to CA-AVD-MFA.", fr: "Ajouter l'application Azure Virtual Desktop Azure Resource Manager Provider à CA-AVD-MFA." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When users sign in through a web browser, Windows App tries to authenticate to both the Azure Virtual Desktop app and the Windows 365 app, even if the user has no Cloud PC. A policy that blocks the Windows 365 app therefore blocks the web sign-in; excluding the Azure Virtual Desktop users from that policy removes the conflict while CA-AVD-MFA still requires MFA.
    fr: |
      Quand les utilisateurs se connectent dans un navigateur web, Windows App tente de s'authentifier à la fois auprès de l'application Azure Virtual Desktop et de l'application Windows 365, même si l'utilisateur n'a pas de PC cloud. Une stratégie qui bloque l'application Windows 365 bloque donc la connexion web ; exclure les utilisateurs Azure Virtual Desktop de cette stratégie supprime le conflit, tandis que CA-AVD-MFA exige toujours l'authentification multifacteur.
  options:
    b: { en: "The client apps condition decides where CA-AVD-MFA applies; the block comes from the other policy.", fr: "La condition Applications clientes détermine où CA-AVD-MFA s'applique ; le blocage vient de l'autre stratégie." }
    c: { en: "Windows Cloud Login is used for single sign-on to session hosts; adding it doesn't lift the Windows 365 block.", fr: "Windows Cloud Login sert à l'authentification unique sur les hôtes de session ; l'ajouter ne lève pas le blocage de Windows 365." }
    d: { en: "The Azure Resource Manager Provider app only retrieves the feed and shouldn't require MFA; it isn't the cause of the block.", fr: "L'application Azure Resource Manager Provider ne fait que récupérer le flux et ne doit pas exiger l'authentification multifacteur ; elle n'est pas la cause du blocage." }
references:
  - title: Troubleshoot Azure Virtual Desktop service connections
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-desktop/troubleshoot-service-connection
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
