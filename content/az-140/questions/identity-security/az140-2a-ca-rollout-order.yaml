id: az140-2a-ca-rollout-order
objective: "2.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Virtual Desktop deployment. Users connect from the headquarters network, whose public IP range is 203.0.113.0/24, and from home.

    You need to require multifactor authentication for Azure Virtual Desktop connections from outside the headquarters network. You must evaluate the impact of the policy on sign-ins before it's enforced.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un déploiement Azure Virtual Desktop. Les utilisateurs se connectent depuis le réseau du siège, dont la plage d'adresses IP publiques est 203.0.113.0/24, et depuis leur domicile.

    Vous devez exiger l'authentification multifacteur pour les connexions à Azure Virtual Desktop depuis l'extérieur du réseau du siège. Vous devez évaluer l'impact de la stratégie sur les connexions avant de l'appliquer.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: location, text: { en: "Create a named location for 203.0.113.0/24 and mark it as trusted.", fr: "Créer un emplacement nommé pour 203.0.113.0/24 et le marquer comme approuvé." } }
    - { id: policy, text: { en: "Create a policy for the Azure Virtual Desktop app that requires MFA and excludes the named location.", fr: "Créer une stratégie pour l'application Azure Virtual Desktop qui exige l'authentification multifacteur et exclut l'emplacement nommé." } }
    - { id: report, text: { en: "Set the policy to Report-only and review the sign-in logs.", fr: "Définir la stratégie sur Rapport seul et examiner les journaux de connexion." } }
    - { id: on, text: { en: "Set the policy to On.", fr: "Définir la stratégie sur Activé." } }
    - { id: defaults, text: { en: "Enable security defaults.", fr: "Activer les paramètres de sécurité par défaut." } }
    - { id: peruser, text: { en: "Enable per-user MFA for the Azure Virtual Desktop users.", fr: "Activer l'authentification multifacteur par utilisateur pour les utilisateurs Azure Virtual Desktop." } }
    - { id: arm, text: { en: "Add the Azure Virtual Desktop Azure Resource Manager Provider app to the policy.", fr: "Ajouter l'application Azure Virtual Desktop Azure Resource Manager Provider à la stratégie." } }
answer:
  sequence: [ location, policy, report, on ]
explanation:
  correct:
    en: |
      The named location must exist before the policy can exclude it. The policy targets the Azure Virtual Desktop app, includes any location and excludes the headquarters location. Report-only mode evaluates the policy in the sign-in logs without enforcing it, and you turn the policy on after the review.
    fr: |
      L'emplacement nommé doit exister avant que la stratégie puisse l'exclure. La stratégie cible l'application Azure Virtual Desktop, inclut tous les emplacements et exclut celui du siège. Le mode Rapport seul évalue la stratégie dans les journaux de connexion sans l'appliquer, et vous activez la stratégie après l'examen.
  options:
    defaults: { en: "Conditional Access can't be used while security defaults are enabled.", fr: "L'accès conditionnel ne peut pas être utilisé tant que les paramètres de sécurité par défaut sont activés." }
    peruser: { en: "Per-user MFA would prompt users everywhere, including at headquarters, and conflicts with Microsoft Entra joined hosts.", fr: "L'authentification multifacteur par utilisateur solliciterait les utilisateurs partout, y compris au siège, et entre en conflit avec les hôtes joints à Microsoft Entra." }
    arm: { en: "The Azure Resource Manager Provider app retrieves the feed and must not require MFA.", fr: "L'application Azure Resource Manager Provider récupère le flux et ne doit pas exiger l'authentification multifacteur." }
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
