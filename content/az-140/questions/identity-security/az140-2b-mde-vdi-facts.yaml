id: az140-2b-mde-vdi-facts
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to onboard its non-persistent Azure Virtual Desktop session hosts to Microsoft Defender for Endpoint by using the VDI onboarding scripts with the single entry per device model.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit d'intégrer ses hôtes de session Azure Virtual Desktop non persistants à Microsoft Defender for Endpoint avec les scripts d'intégration VDI et le modèle d'une seule entrée par appareil.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The first onboarding of a session host can take about three to four hours to appear in the client reporting.", fr: "La première intégration d'un hôte de session peut prendre environ trois à quatre heures avant d'apparaître dans les rapports." } }
    - { id: b, text: { en: "The onboarding scripts also apply Microsoft's recommended Defender Antivirus settings for VDI.", fr: "Les scripts d'intégration appliquent aussi les paramètres de Defender Antivirus recommandés par Microsoft pour la VDI." } }
    - { id: c, text: { en: "Onboard-NonPersistentMachine.ps1 must run only after the VM has its final device name.", fr: "Onboard-NonPersistentMachine.ps1 ne doit s'exécuter qu'une fois que la machine virtuelle a son nom d'appareil définitif." } }
    - { id: d, text: { en: "WindowsDefenderATPOnboardingScript.cmd must also be added on the Scripts tab, next to the PowerShell script.", fr: "WindowsDefenderATPOnboardingScript.cmd doit aussi être ajouté dans l'onglet Scripts, à côté du script PowerShell." } }
    - { id: e, text: { en: "The VDI onboarding package requires Microsoft Defender for Endpoint Plan 2.", fr: "Le package d'intégration VDI exige Microsoft Defender for Endpoint Plan 2." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Microsoft notes that the first onboarding of a VDI device can take three to four hours before reporting appears. The single entry script must run after the VM has its final name and its last provisioning restart; otherwise it can create duplicate or inconsistent entries.
    fr: |
      Microsoft indique que la première intégration d'un appareil VDI peut prendre trois à quatre heures avant l'apparition des rapports. Le script à entrée unique doit s'exécuter une fois que la machine virtuelle a son nom définitif et a effectué son dernier redémarrage de provisionnement ; sinon il peut créer des entrées en double ou incohérentes.
  options:
    b: { en: "Onboarding doesn't configure Defender Antivirus protection or performance settings; you apply the VDI antivirus settings separately.", fr: "L'intégration ne configure pas les paramètres de protection ou de performances de Defender Antivirus ; vous appliquez séparément les paramètres antivirus VDI." }
    d: { en: "The PowerShell script calls the .cmd file itself, so you don't add the .cmd file separately.", fr: "Le script PowerShell appelle lui-même le fichier .cmd : vous n'ajoutez pas le fichier .cmd séparément." }
    e: { en: "The VDI onboarding procedure applies to Defender for Endpoint Plan 1 and Plan 2.", fr: "La procédure d'intégration VDI s'applique à Defender for Endpoint Plan 1 et Plan 2." }
references:
  - title: Onboard non-persistent VDI devices to Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/configure-endpoints-vdi
