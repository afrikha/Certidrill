id: az140-2a-rbac-team-roles
objective: "2.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure subscription dedicated to Azure Virtual Desktop. You need to grant permissions to four principals. Each principal must receive only the permissions it needs.

    Which built-in role should you assign to each principal? To answer, drag the appropriate roles to the correct principals. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un abonnement Azure dédié à Azure Virtual Desktop. Vous devez accorder des autorisations à quatre principaux. Chaque principal ne doit recevoir que les autorisations dont il a besoin.

    Quel rôle intégré devez-vous attribuer à chaque principal ? Pour répondre, faites glisser les rôles appropriés vers les principaux correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reader, text: Desktop Virtualization Reader }
    - { id: shop, text: Desktop Virtualization Session Host Operator }
    - { id: ws, text: Desktop Virtualization Workspace Contributor }
    - { id: poweronoff, text: Desktop Virtualization Power On Off Contributor }
    - { id: hpreader, text: Desktop Virtualization Host Pool Reader }
    - { id: user, text: Desktop Virtualization User }
  targets:
    - id: t1
      text: { en: "Auditors: view every Azure Virtual Desktop resource of the subscription without changing anything", fr: "Auditeurs : consulter toutes les ressources Azure Virtual Desktop de l'abonnement sans rien modifier" }
    - id: t2
      text: { en: "Patch team: turn on drain mode and remove failed session hosts", fr: "Équipe de correctifs : activer le mode drainage et supprimer les hôtes de session défaillants" }
    - id: t3
      text: { en: "Portal team: manage workspaces, including which application groups they publish", fr: "Équipe portail : gérer les espaces de travail, y compris les groupes d'applications qu'ils publient" }
    - id: t4
      text: { en: "Azure Virtual Desktop service principal: start and deallocate VMs for an autoscale scaling plan", fr: "Principal de service Azure Virtual Desktop : démarrer et libérer des machines virtuelles pour un plan de mise à l'échelle automatique" }
answer:
  mapping: { t1: reader, t2: shop, t3: ws, t4: poweronoff }
explanation:
  correct:
    en: |
      Desktop Virtualization Reader views all Azure Virtual Desktop resources without changes, while Host Pool Reader covers host pools only. Session Host Operator views and removes session hosts and changes drain mode. Workspace Contributor manages workspaces, including the application group references they publish. Power On Off Contributor lets the Azure Virtual Desktop service start, stop and deallocate VMs for autoscale. Desktop Virtualization User only lets users open published resources.
    fr: |
      Desktop Virtualization Reader affiche toutes les ressources Azure Virtual Desktop sans modification, tandis que Host Pool Reader ne couvre que les pools d'hôtes. Session Host Operator affiche et supprime des hôtes de session et change le mode drainage. Workspace Contributor gère les espaces de travail, y compris les références aux groupes d'applications qu'ils publient. Power On Off Contributor permet au service Azure Virtual Desktop de démarrer, d'arrêter et de libérer des machines virtuelles pour la mise à l'échelle automatique. Desktop Virtualization User permet seulement aux utilisateurs d'ouvrir les ressources publiées.
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
