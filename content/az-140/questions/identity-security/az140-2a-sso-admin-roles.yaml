id: az140-2a-sso-admin-roles
objective: "2.1.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to enable Microsoft Entra single sign-on for its Azure Virtual Desktop host pools. An administrator named **Admin1** must enable Microsoft Entra authentication for RDP on the Windows Cloud Login service principal and configure its target device groups.

    Which two Microsoft Entra roles can you assign to Admin1 so that Admin1 can perform the configuration? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit d'activer l'authentification unique Microsoft Entra pour ses pools d'hôtes Azure Virtual Desktop. Un administrateur nommé **Admin1** doit activer l'authentification Microsoft Entra pour RDP sur le principal de service Windows Cloud Login et configurer ses groupes d'appareils cibles.

    Quels sont les deux rôles Microsoft Entra que vous pouvez attribuer à Admin1 pour qu'il puisse effectuer la configuration ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Conditional Access Administrator }
    - { id: b, text: Application Administrator }
    - { id: c, text: Hybrid Identity Administrator }
    - { id: d, text: Cloud Application Administrator }
    - { id: e, text: Cloud Device Administrator }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      To configure the Microsoft Entra tenant for single sign-on, you need the Application Administrator or the Cloud Application Administrator role (or an equivalent role). The settings are properties of the Windows Cloud Login service principal, an enterprise application.
    fr: |
      Pour configurer le locataire Microsoft Entra pour l'authentification unique, il faut le rôle Application Administrator ou Cloud Application Administrator (ou un rôle équivalent). Les paramètres sont des propriétés du principal de service Windows Cloud Login, une application d'entreprise.
  options:
    a: { en: "Conditional Access Administrator manages Conditional Access policies, not the service principal's remote desktop configuration.", fr: "Conditional Access Administrator gère les stratégies d'accès conditionnel, pas la configuration Bureau à distance du principal de service." }
    c: { en: "Hybrid Identity Administrator manages Microsoft Entra Connect and federation, not enterprise applications.", fr: "Hybrid Identity Administrator gère Microsoft Entra Connect et la fédération, pas les applications d'entreprise." }
    e: { en: "Cloud Device Administrator manages device objects; the setting belongs to an application service principal.", fr: "Cloud Device Administrator gère les objets appareils ; le paramètre appartient au principal de service d'une application." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
