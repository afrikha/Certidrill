id: az140-2a-rights-admin-protection
objective: "2.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a host pool named **HP-Win11** whose Windows 11 Enterprise multi-session hosts are joined to the contoso.com AD DS domain. The session hosts are in an OU named **AVD-Hosts**, and a GPO named **GPO-Baseline** applies the Microsoft security baseline to that OU.

    After the October 2026 Windows security update, users see unexpected sign-in prompts, and support engineers who have local administrator rights get extra elevation prompts and elevation failures. You determine that Administrator protection was turned on.

    You need to resolve the issue for the session hosts. User Account Control must remain enabled.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un pool d'hôtes nommé **HP-Win11** dont les hôtes Windows 11 Entreprise multisession sont joints au domaine AD DS contoso.com. Les hôtes de session se trouvent dans une unité d'organisation nommée **AVD-Hosts**, et un GPO nommé **GPO-Baseline** applique la base de référence de sécurité Microsoft à cette unité d'organisation.

    Après la mise à jour de sécurité Windows d'octobre 2026, les utilisateurs voient des demandes de connexion inattendues, et les ingénieurs du support qui ont les droits d'administrateur local reçoivent des demandes d'élévation supplémentaires et subissent des échecs d'élévation. Vous déterminez que la protection administrateur (Administrator protection) a été activée.

    Vous devez résoudre le problème pour les hôtes de session. Le contrôle de compte d'utilisateur (UAC) doit rester activé.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: edit, text: { en: "Edit GPO-Baseline.", fr: "Modifier GPO-Baseline." } }
    - { id: legacy, text: { en: "Set User Account Control: Configure type of Admin Approval Mode to Legacy Admin Approval Mode.", fr: "Définir User Account Control: Configure type of Admin Approval Mode sur Legacy Admin Approval Mode." } }
    - { id: restart, text: { en: "Restart the session hosts.", fr: "Redémarrer les hôtes de session." } }
    - { id: disableuac, text: { en: "Set User Account Control: Run all administrators in Admin Approval Mode to Disabled.", fr: "Définir User Account Control: Run all administrators in Admin Approval Mode sur Disabled." } }
    - { id: vmadmin, text: { en: "Assign the Virtual Machine Administrator Login role to the support engineers.", fr: "Attribuer le rôle Virtual Machine Administrator Login aux ingénieurs du support." } }
    - { id: drain, text: { en: "Turn off drain mode on the session hosts.", fr: "Désactiver le mode drainage sur les hôtes de session." } }
answer:
  sequence: [ edit, legacy, restart ]
explanation:
  correct:
    en: |
      Administrator protection must not be enabled on Windows 11 session hosts. Microsoft security baselines applied through Group Policy turn it on starting with the October 2026 Windows security update. To turn it off, edit the GPO that applies the baseline, set User Account Control: Configure type of Admin Approval Mode to Legacy Admin Approval Mode, and then restart the session hosts.
    fr: |
      La protection administrateur ne doit pas être activée sur les hôtes de session Windows 11. Les bases de référence de sécurité Microsoft appliquées par stratégie de groupe l'activent à partir de la mise à jour de sécurité Windows d'octobre 2026. Pour la désactiver, modifiez le GPO qui applique la base de référence, définissez User Account Control: Configure type of Admin Approval Mode sur Legacy Admin Approval Mode, puis redémarrez les hôtes de session.
  options:
    disableuac: { en: "Disabling Admin Approval Mode turns off UAC for administrators instead of returning to the legacy behavior.", fr: "Désactiver le mode d'approbation administrateur supprime l'UAC pour les administrateurs au lieu de revenir au comportement hérité." }
    vmadmin: { en: "This Azure role applies to Microsoft Entra joined VMs; it doesn't change the elevation behavior.", fr: "Ce rôle Azure s'applique aux machines virtuelles jointes à Microsoft Entra ; il ne change pas le comportement d'élévation." }
    drain: { en: "Drain mode controls new sessions; it doesn't affect Administrator protection.", fr: "Le mode drainage contrôle les nouvelles sessions ; il n'a pas d'effet sur la protection administrateur." }
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
