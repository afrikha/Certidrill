id: az140-2a-rbac-assign-users
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a resource group named **RG-Apps** that contains Azure Virtual Desktop host pools and application groups.

    The members of a group named **App-Publishers** must be able to create RemoteApp application groups in RG-Apps, publish applications in them, and assign users and groups to them. They must not manage host pools, workspaces or virtual machines. The solution must follow the principle of least privilege.

    Which role assignments should you create on RG-Apps for App-Publishers?
  fr: |
    Fabrikam dispose d'un groupe de ressources nommé **RG-Apps** qui contient des pools d'hôtes et des groupes d'applications Azure Virtual Desktop.

    Les membres d'un groupe nommé **App-Publishers** doivent pouvoir créer des groupes d'applications RemoteApp dans RG-Apps, y publier des applications et leur attribuer des utilisateurs et des groupes. Ils ne doivent gérer ni les pools d'hôtes, ni les espaces de travail, ni les machines virtuelles. La solution doit respecter le principe du privilège minimum.

    Quelles attributions de rôles devez-vous créer sur RG-Apps pour App-Publishers ?
body:
  options:
    - { id: a, text: { en: "Desktop Virtualization Application Group Contributor only", fr: "Desktop Virtualization Application Group Contributor uniquement" } }
    - { id: b, text: { en: "Desktop Virtualization Contributor only", fr: "Desktop Virtualization Contributor uniquement" } }
    - { id: c, text: { en: "Desktop Virtualization Application Group Contributor and User Access Administrator", fr: "Desktop Virtualization Application Group Contributor et User Access Administrator" } }
    - { id: d, text: { en: "Desktop Virtualization Contributor and User Access Administrator", fr: "Desktop Virtualization Contributor et User Access Administrator" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Desktop Virtualization Application Group Contributor manages every aspect of application groups, but not the assignment of users or groups, which also requires User Access Administrator. Together, the two roles allow creating application groups, publishing apps and assigning users, without managing host pools or workspaces.
    fr: |
      Desktop Virtualization Application Group Contributor gère tous les aspects des groupes d'applications, sauf l'attribution d'utilisateurs ou de groupes, qui exige aussi User Access Administrator. Ensemble, les deux rôles permettent de créer des groupes d'applications, de publier des applications et d'attribuer des utilisateurs, sans gérer les pools d'hôtes ni les espaces de travail.
  options:
    a: { en: "Without User Access Administrator, the team can't create the role assignments that give users access.", fr: "Sans User Access Administrator, l'équipe ne peut pas créer les attributions de rôles qui donnent accès aux utilisateurs." }
    b: { en: "Desktop Virtualization Contributor also manages host pools and workspaces, and it still can't assign users.", fr: "Desktop Virtualization Contributor gère aussi les pools d'hôtes et les espaces de travail, et ne peut toujours pas attribuer d'utilisateurs." }
    d: { en: "This combination works but grants management of host pools and workspaces, which isn't least privilege.", fr: "Cette combinaison fonctionne mais accorde la gestion des pools d'hôtes et des espaces de travail, ce qui n'est pas le privilège minimum." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
