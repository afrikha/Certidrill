id: az140-2b-net-service-tags
objective: "2.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam must restrict outbound traffic from its Azure Virtual Desktop session host subnet. You plan to add outbound allow rules that use service tags to the network security group (NSG) of the subnet, followed by a rule that denies all other internet traffic.

    You need to choose the service tag for each required endpoint.

    Which service tag should you use for each endpoint? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam doit restreindre le trafic sortant du sous-réseau de ses hôtes de session Azure Virtual Desktop. Vous prévoyez d'ajouter au groupe de sécurité réseau (NSG) du sous-réseau des règles sortantes d'autorisation qui utilisent des étiquettes de service, suivies d'une règle qui refuse tout autre trafic vers Internet.

    Vous devez choisir l'étiquette de service de chaque point de terminaison requis.

    Quelle étiquette de service devez-vous utiliser pour chaque point de terminaison ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      login.microsoftonline.com (TCP 443), authentication: [[s1]]

      *.wvd.microsoft.com (TCP 443), service traffic: [[s2]]

      mrsglobalsteus2prod.blob.core.windows.net (TCP 443), agent and side-by-side stack updates: [[s3]]
    fr: |
      login.microsoftonline.com (TCP 443), authentification : [[s1]]

      *.wvd.microsoft.com (TCP 443), trafic du service : [[s2]]

      mrsglobalsteus2prod.blob.core.windows.net (TCP 443), mises à jour de l'agent et de la pile côte à côte : [[s3]]
  slots:
    - id: s1
      options:
        - { id: aad, text: AzureActiveDirectory }
        - { id: wvd, text: WindowsVirtualDesktop }
        - { id: storage, text: Storage }
        - { id: monitor, text: AzureMonitor }
    - id: s2
      options:
        - { id: aad, text: AzureActiveDirectory }
        - { id: wvd, text: WindowsVirtualDesktop }
        - { id: storage, text: Storage }
        - { id: monitor, text: AzureMonitor }
    - id: s3
      options:
        - { id: aad, text: AzureActiveDirectory }
        - { id: wvd, text: WindowsVirtualDesktop }
        - { id: storage, text: Storage }
        - { id: monitor, text: AzureMonitor }
answer:
  values: { s1: aad, s2: wvd, s3: storage }
explanation:
  correct:
    en: |
      Microsoft lists login.microsoftonline.com under the AzureActiveDirectory tag, *.wvd.microsoft.com (service traffic, including TCP-based RDP) under WindowsVirtualDesktop, and the blob endpoint that serves agent and side-by-side stack updates under Storage. AzureMonitor covers the agent telemetry endpoints, not these three.
    fr: |
      Microsoft classe login.microsoftonline.com sous l'étiquette AzureActiveDirectory, *.wvd.microsoft.com (trafic du service, y compris RDP sur TCP) sous WindowsVirtualDesktop, et le point de terminaison blob qui distribue les mises à jour de l'agent et de la pile côte à côte sous Storage. AzureMonitor couvre les points de terminaison de télémétrie de l'agent, pas ces trois-là.
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
