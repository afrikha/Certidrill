id: az140-2b-av-cloud-cache-exclusions
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has a pooled Azure Virtual Desktop host pool. The session hosts use FSLogix profile containers with Cloud Cache configured to replicate to two SMB locations.

    Microsoft Defender Antivirus on the session hosts has the following exclusions:

    - The VHD and VHDX containers and their .lock, .meta and .metadata files on both SMB locations
    - `%TEMP%\*\*.VHD`, `%TEMP%\*\*.VHDX`, `%WINDIR%\TEMP\*\*.VHD` and `%WINDIR%\TEMP\*\*.VHDX`
    - The `frxsvc.exe` process

    Users still report slow sign-ins. Defender Antivirus logs show scans of files that FSLogix writes on the local disk of the session hosts.

    You need to complete the exclusions recommended for FSLogix. What should you add?
  fr: |
    Wingtip Toys dispose d'un pool d'hôtes regroupé Azure Virtual Desktop. Les hôtes de session utilisent des conteneurs de profil FSLogix avec Cloud Cache configuré pour répliquer vers deux emplacements SMB.

    Microsoft Defender Antivirus sur les hôtes de session a les exclusions suivantes :

    - Les conteneurs VHD et VHDX et leurs fichiers .lock, .meta et .metadata sur les deux emplacements SMB
    - `%TEMP%\*\*.VHD`, `%TEMP%\*\*.VHDX`, `%WINDIR%\TEMP\*\*.VHD` et `%WINDIR%\TEMP\*\*.VHDX`
    - Le processus `frxsvc.exe`

    Les utilisateurs signalent toujours des connexions lentes. Les journaux de Defender Antivirus montrent l'analyse de fichiers que FSLogix écrit sur le disque local des hôtes de session.

    Vous devez compléter les exclusions recommandées pour FSLogix. Que devez-vous ajouter ?
body:
  options:
    - { id: a, text: "`%LOCALAPPDATA%\\Microsoft\\Windows\\INetCache\\*` and `msedge.exe`" }
    - { id: b, text: "`%USERPROFILE%\\AppData\\Roaming\\*` and `explorer.exe`" }
    - { id: c, text: "`%ProgramData%\\FSLogix\\Cache\\*`, `%ProgramData%\\FSLogix\\Proxy\\*` and `frxccds.exe`" }
    - { id: d, text: "`%WINDIR%\\System32\\spool\\*` and `svchost.exe`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With Cloud Cache, FSLogix keeps a local cache and proxy under `%ProgramData%\FSLogix\Cache` and `%ProgramData%\FSLogix\Proxy`, and the Cloud Cache service runs as `frxccds.exe`. FSLogix guidance excludes those two folders and both `frxsvc.exe` and `frxccds.exe`; the existing list misses them.
    fr: |
      Avec Cloud Cache, FSLogix conserve un cache local et un proxy sous `%ProgramData%\FSLogix\Cache` et `%ProgramData%\FSLogix\Proxy`, et le service Cloud Cache s'exécute sous le nom `frxccds.exe`. Les recommandations FSLogix excluent ces deux dossiers ainsi que `frxsvc.exe` et `frxccds.exe` ; la liste actuelle ne les contient pas.
  options:
    a: { en: "The browser cache and Microsoft Edge aren't part of the FSLogix exclusions; excluding them only reduces protection.", fr: "Le cache du navigateur et Microsoft Edge ne font pas partie des exclusions FSLogix ; les exclure ne fait que réduire la protection." }
    b: { en: "The roaming profile folder lives inside the container; excluding it and Explorer weakens protection without fixing Cloud Cache scanning.", fr: "Le dossier de profil itinérant se trouve dans le conteneur ; l'exclure avec l'Explorateur affaiblit la protection sans résoudre l'analyse de Cloud Cache." }
    d: { en: "The print spooler folder and svchost.exe have nothing to do with FSLogix and are common malware targets.", fr: "Le dossier du spouleur d'impression et svchost.exe n'ont aucun rapport avec FSLogix et sont des cibles fréquentes de logiciels malveillants." }
references:
  - title: Prerequisites for FSLogix
    url: https://learn.microsoft.com/en-us/fslogix/overview-prerequisites
