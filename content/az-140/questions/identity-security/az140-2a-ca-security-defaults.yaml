id: az140-2a-ca-security-defaults
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Entra tenant in which security defaults are enabled. All users have licenses that include Microsoft Entra ID P1. Users connect to an Azure Virtual Desktop host pool named **HP-Main**.

    You plan to create a Conditional Access policy that requires multifactor authentication only for the connections to Azure Virtual Desktop.

    What should you do first?
  fr: |
    Tailspin Toys dispose d'un locataire Microsoft Entra dans lequel les paramètres de sécurité par défaut sont activés. Tous les utilisateurs ont des licences qui incluent Microsoft Entra ID P1. Les utilisateurs se connectent à un pool d'hôtes Azure Virtual Desktop nommé **HP-Main**.

    Vous prévoyez de créer une stratégie d'accès conditionnel qui exige l'authentification multifacteur uniquement pour les connexions à Azure Virtual Desktop.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable per-user MFA for the Azure Virtual Desktop users.", fr: "Activer l'authentification multifacteur par utilisateur pour les utilisateurs Azure Virtual Desktop." } }
    - { id: b, text: { en: "Enable single sign-on on HP-Main.", fr: "Activer l'authentification unique sur HP-Main." } }
    - { id: c, text: { en: "Upgrade the users' licenses to Microsoft Entra ID P2.", fr: "Mettre à niveau les licences des utilisateurs vers Microsoft Entra ID P2." } }
    - { id: d, text: { en: "Disable security defaults in the tenant.", fr: "Désactiver les paramètres de sécurité par défaut dans le locataire." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Conditional Access policies require Microsoft Entra ID P1 or P2 and can't be used while security defaults are enabled. You must disable security defaults before you create the policy that targets Azure Virtual Desktop.
    fr: |
      Les stratégies d'accès conditionnel exigent Microsoft Entra ID P1 ou P2 et ne peuvent pas être utilisées tant que les paramètres de sécurité par défaut sont activés. Vous devez désactiver les paramètres de sécurité par défaut avant de créer la stratégie qui cible Azure Virtual Desktop.
  options:
    a: { en: "Per-user MFA is the legacy method; it isn't a prerequisite of Conditional Access and must even be disabled for Microsoft Entra joined session hosts.", fr: "L'authentification multifacteur par utilisateur est la méthode héritée ; elle n'est pas un prérequis de l'accès conditionnel et doit même être désactivée pour les hôtes de session joints à Microsoft Entra." }
    c: { en: "Microsoft Entra ID P1 is enough for Conditional Access.", fr: "Microsoft Entra ID P1 suffit pour l'accès conditionnel." }
    b: { en: "Single sign-on is optional; it adds the Windows Cloud Login app but doesn't enable Conditional Access.", fr: "L'authentification unique est facultative ; elle ajoute l'application Windows Cloud Login mais n'active pas l'accès conditionnel." }
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
