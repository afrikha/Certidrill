id: az140-2a-ca-per-user-mfa
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a host pool named **HP-Branch** whose session hosts are Microsoft Entra joined. A Conditional Access policy requires multifactor authentication for the Azure Virtual Desktop app. Several years ago, the legacy per-user MFA setting was enabled for all users.

    When users connect to HP-Branch, the connection fails with the following error: "The sign-in method you're trying to use isn't allowed."

    You need to resolve the issue. The solution must keep MFA for Azure Virtual Desktop.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes nommé **HP-Branch** dont les hôtes de session sont joints à Microsoft Entra. Une stratégie d'accès conditionnel exige l'authentification multifacteur pour l'application Azure Virtual Desktop. Il y a plusieurs années, le paramètre hérité d'authentification multifacteur par utilisateur a été activé pour tous les utilisateurs.

    Quand les utilisateurs se connectent à HP-Branch, la connexion échoue avec l'erreur suivante : « The sign-in method you're trying to use isn't allowed. »

    Vous devez résoudre le problème. La solution doit conserver l'authentification multifacteur pour Azure Virtual Desktop.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable per-user MFA for the Azure Virtual Desktop users.", fr: "Désactiver l'authentification multifacteur par utilisateur pour les utilisateurs Azure Virtual Desktop." } }
    - { id: b, text: { en: "Add the RDP property targetisaadjoined:i:1 to HP-Branch.", fr: "Ajouter la propriété RDP targetisaadjoined:i:1 à HP-Branch." } }
    - { id: c, text: { en: "Exclude the Azure Virtual Desktop app from the Conditional Access policy.", fr: "Exclure l'application Azure Virtual Desktop de la stratégie d'accès conditionnel." } }
    - { id: d, text: { en: "Enable security defaults in the tenant.", fr: "Activer les paramètres de sécurité par défaut dans le locataire." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For connections to Microsoft Entra joined session hosts to succeed, the legacy per-user MFA sign-in method must be disabled. When per-user MFA is enabled alongside Conditional Access, users see "The sign-in method you're trying to use isn't allowed". The Conditional Access policy keeps enforcing MFA.
    fr: |
      Pour que les connexions aux hôtes de session joints à Microsoft Entra réussissent, la méthode de connexion héritée d'authentification multifacteur par utilisateur doit être désactivée. Quand elle est activée en même temps que l'accès conditionnel, les utilisateurs voient « The sign-in method you're trying to use isn't allowed ». La stratégie d'accès conditionnel continue d'imposer l'authentification multifacteur.
  options:
    b: { en: "targetisaadjoined allows clients that don't meet the join requirements to connect with a password; it doesn't resolve the per-user MFA conflict.", fr: "targetisaadjoined permet aux clients qui ne remplissent pas les conditions de jonction de se connecter avec un mot de passe ; il ne résout pas le conflit avec l'authentification multifacteur par utilisateur." }
    c: { en: "Removing the app from the policy would drop MFA for Azure Virtual Desktop.", fr: "Retirer l'application de la stratégie supprimerait l'authentification multifacteur pour Azure Virtual Desktop." }
    d: { en: "Conditional Access can't be used while security defaults are enabled.", fr: "L'accès conditionnel ne peut pas être utilisé tant que les paramètres de sécurité par défaut sont activés." }
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
