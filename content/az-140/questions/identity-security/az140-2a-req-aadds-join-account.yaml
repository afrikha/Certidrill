id: az140-2a-req-aadds-join-account
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Entra Domain Services managed domain named aadds.tailspintoys.com. You plan to add session hosts joined to the managed domain to an Azure Virtual Desktop host pool named **HP-Ops**.

    You need to provide the credentials that the deployment uses to join the session hosts to the domain. The solution must follow the principle of least privilege.

    Which account should you use?
  fr: |
    Tailspin Toys dispose d'un domaine managé Microsoft Entra Domain Services nommé aadds.tailspintoys.com. Vous prévoyez d'ajouter à un pool d'hôtes Azure Virtual Desktop nommé **HP-Ops** des hôtes de session joints au domaine managé.

    Vous devez fournir les identifiants que le déploiement utilise pour joindre les hôtes de session au domaine. La solution doit respecter le principe du privilège minimum.

    Quel compte devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An account that has the Global Administrator role", fr: "Un compte qui a le rôle Global Administrator" } }
    - { id: b, text: { en: "An account that has the Hybrid Identity Administrator role", fr: "Un compte qui a le rôle Hybrid Identity Administrator" } }
    - { id: c, text: { en: "An account that is a member of the AAD DC Administrators group", fr: "Un compte membre du groupe AAD DC Administrators" } }
    - { id: d, text: { en: "An account that has the Desktop Virtualization Contributor role", fr: "Un compte qui a le rôle Desktop Virtualization Contributor" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      To join session hosts to a Microsoft Entra Domain Services managed domain, the deployment needs a domain account that can join computers, which means a member of the AAD DC Administrators group. The managed domain doesn't give Domain Admins or Enterprise Admins rights.
    fr: |
      Pour joindre des hôtes de session à un domaine managé Microsoft Entra Domain Services, le déploiement a besoin d'un compte de domaine capable de joindre des ordinateurs, c'est-à-dire un membre du groupe AAD DC Administrators. Le domaine managé ne donne pas les droits Domain Admins ni Enterprise Admins.
  options:
    a: { en: "Global Administrator is a Microsoft Entra directory role; it grants far more than needed and isn't what lets an account join computers to the managed domain.", fr: "Global Administrator est un rôle d'annuaire Microsoft Entra ; il accorde bien plus que nécessaire et n'est pas ce qui permet à un compte de joindre des ordinateurs au domaine managé." }
    b: { en: "Hybrid Identity Administrator manages Microsoft Entra Connect and federation settings, not computer accounts in the managed domain.", fr: "Hybrid Identity Administrator gère Microsoft Entra Connect et les paramètres de fédération, pas les comptes d'ordinateurs du domaine managé." }
    d: { en: "Desktop Virtualization Contributor is an Azure role on Azure Virtual Desktop objects; it gives no right in the domain.", fr: "Desktop Virtualization Contributor est un rôle Azure sur les objets Azure Virtual Desktop ; il ne donne aucun droit dans le domaine." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
