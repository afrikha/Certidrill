id: az140-2b-av-settings-match
objective: "2.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware has 150 pooled Azure Virtual Desktop session hosts that run Windows 11 Enterprise multi-session. You configure Microsoft Defender Antivirus by using Group Policy.

    You need to identify the Group Policy setting that meets each requirement.

    Which setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose de 150 hôtes de session Azure Virtual Desktop regroupés qui exécutent Windows 11 Entreprise multisession. Vous configurez Microsoft Defender Antivirus par stratégie de groupe.

    Vous devez identifier le paramètre de stratégie de groupe qui répond à chaque exigence.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: headless, text: Enable headless UI mode }
    - { id: suppress, text: Suppress all notifications }
    - { id: random, text: Randomize scheduled scans }
    - { id: catchup, text: Turn on catch-up quick scan }
    - { id: pua, text: Configure detection for potentially unwanted applications }
    - { id: cpu, text: Specify the maximum percentage of CPU utilization during a scan }
  targets:
    - { id: t1, text: { en: "Hide the Microsoft Defender Antivirus user interface from users", fr: "Masquer l'interface utilisateur de Microsoft Defender Antivirus aux utilisateurs" } }
    - { id: t2, text: { en: "Prevent all the session hosts from starting their scheduled scan at the same moment", fr: "Empêcher tous les hôtes de session de démarrer leur analyse planifiée au même moment" } }
    - { id: t3, text: { en: "Block adware and other potentially unwanted software", fr: "Bloquer les logiciels publicitaires et autres logiciels potentiellement indésirables" } }
    - { id: t4, text: { en: "Cap the processor usage of each scheduled scan", fr: "Limiter l'utilisation du processeur de chaque analyse planifiée" } }
answer:
  mapping: { t1: headless, t2: random, t3: pua, t4: cpu }
explanation:
  correct:
    en: |
      Headless UI mode hides the Defender Antivirus interface from end users. Randomize scheduled scans spreads scan start times so hosts don't compete for resources. Detection for potentially unwanted applications set to Block stops adware and similar software. The maximum CPU percentage setting (50 in Microsoft's VDI guidance) caps each scan's processor usage.
    fr: |
      Le mode headless UI masque l'interface de Defender Antivirus aux utilisateurs finaux. Randomize scheduled scans répartit les heures de démarrage des analyses pour que les hôtes ne se disputent pas les ressources. La détection des applications potentiellement indésirables définie sur Block arrête les logiciels publicitaires et similaires. Le paramètre de pourcentage maximal de processeur (50 dans les recommandations VDI de Microsoft) limite l'utilisation du processeur de chaque analyse.
  options:
    suppress: { en: "Suppress all notifications stops pop-up notifications but doesn't hide the interface itself.", fr: "Suppress all notifications arrête les notifications contextuelles mais ne masque pas l'interface elle-même." }
    catchup: { en: "Catch-up quick scan runs a scan after missed scheduled scans; it doesn't spread start times.", fr: "L'analyse rapide de rattrapage exécute une analyse après des analyses planifiées manquées ; elle ne répartit pas les heures de démarrage." }
references:
  - title: Configure Microsoft Defender Antivirus on a remote desktop or virtual desktop infrastructure environment
    url: https://learn.microsoft.com/en-us/defender-endpoint/deployment-vdi-microsoft-defender-antivirus
