id: az140-2a-rights-mechanism-match
objective: "2.1.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum has two host pools that don't use a session host configuration:

    - **HP-Cloud**: Microsoft Entra joined session hosts enrolled in Microsoft Intune, in the resource group RG-Cloud;
    - **HP-Domain**: session hosts joined to the adatum.com AD DS domain.

    You need to meet four requirements for rights on the session hosts.

    Which mechanism should you use for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de deux pools d'hôtes qui n'utilisent pas de configuration d'hôte de session :

    - **HP-Cloud** : hôtes de session joints à Microsoft Entra et inscrits dans Microsoft Intune, dans le groupe de ressources RG-Cloud ;
    - **HP-Domain** : hôtes de session joints au domaine AD DS adatum.com.

    Vous devez répondre à quatre exigences de droits sur les hôtes de session.

    Quel mécanisme devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les mécanismes appropriés vers les exigences correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: userlogin, text: { en: "Virtual Machine User Login role on RG-Cloud", fr: "Rôle Virtual Machine User Login sur RG-Cloud" } }
    - { id: adminlogin, text: { en: "Virtual Machine Administrator Login role on RG-Cloud", fr: "Rôle Virtual Machine Administrator Login sur RG-Cloud" } }
    - { id: intune, text: { en: "Intune account protection policy that manages local group membership", fr: "Stratégie Intune de protection de compte qui gère l'appartenance aux groupes locaux" } }
    - { id: gpo, text: { en: "Group Policy with Restricted Groups", fr: "Stratégie de groupe avec groupes restreints" } }
    - { id: vmcontrib, text: { en: "Virtual Machine Contributor role on RG-Cloud", fr: "Rôle Virtual Machine Contributor sur RG-Cloud" } }
    - { id: dvuser, text: { en: "Desktop Virtualization User role on RG-Cloud", fr: "Rôle Desktop Virtualization User sur RG-Cloud" } }
  targets:
    - id: t1
      text: { en: "Standard users who are assigned to the HP-Cloud application group can sign in to its session hosts.", fr: "Les utilisateurs standard attribués au groupe d'applications de HP-Cloud peuvent se connecter à ses hôtes de session." }
    - id: t2
      text: { en: "Support engineers get local administrator rights when they sign in to the HP-Cloud session hosts, managed from Access control (IAM).", fr: "Les ingénieurs du support obtiennent les droits d'administrateur local quand ils se connectent aux hôtes de session de HP-Cloud, gérés depuis Contrôle d'accès (IAM)." }
    - id: t3
      text: { en: "A Microsoft Entra group is added to the local Administrators group of the HP-Cloud session hosts by a device policy.", fr: "Un groupe Microsoft Entra est ajouté au groupe Administrateurs local des hôtes de session de HP-Cloud par une stratégie d'appareil." }
    - id: t4
      text: { en: "A domain group is added to the local Administrators group of the HP-Domain session hosts.", fr: "Un groupe de domaine est ajouté au groupe Administrateurs local des hôtes de session de HP-Domain." }
answer:
  mapping: { t1: userlogin, t2: adminlogin, t3: intune, t4: gpo }
explanation:
  correct:
    en: |
      Without a session host configuration, users of Microsoft Entra joined hosts need Virtual Machine User Login, and administrators need Virtual Machine Administrator Login, both Azure roles assigned in Access control (IAM). On Microsoft Entra joined devices, Intune can also manage local group membership with an account protection policy. On AD DS-joined hosts, local group membership is managed with Group Policy.
    fr: |
      Sans configuration d'hôte de session, les utilisateurs d'hôtes joints à Microsoft Entra ont besoin de Virtual Machine User Login, et les administrateurs de Virtual Machine Administrator Login, deux rôles Azure attribués dans Contrôle d'accès (IAM). Sur les appareils joints à Microsoft Entra, Intune peut aussi gérer l'appartenance aux groupes locaux avec une stratégie de protection de compte. Sur les hôtes joints à AD DS, l'appartenance aux groupes locaux se gère par stratégie de groupe.
  options:
    vmcontrib: { en: "Virtual Machine Contributor manages VM resources but gives no sign-in right to Windows.", fr: "Virtual Machine Contributor gère les ressources machine virtuelle mais ne donne aucun droit de connexion à Windows." }
    dvuser: { en: "Desktop Virtualization User is assigned on the application group to publish resources; on a resource group of VMs it grants no Windows sign-in.", fr: "Desktop Virtualization User s'attribue sur le groupe d'applications pour publier des ressources ; sur un groupe de ressources de machines virtuelles, il n'accorde aucune connexion à Windows." }
references:
  - title: Microsoft Entra joined session hosts in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/azure-ad-joined-session-hosts
  - title: How to manage the local administrators group on Microsoft Entra joined devices
    url: https://learn.microsoft.com/en-us/entra/identity/devices/assign-local-admin
