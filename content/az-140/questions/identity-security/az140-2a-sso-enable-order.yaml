id: az140-2a-sso-enable-order
objective: "2.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has cloud-only users and no AD DS. A host pool named **HP-Cloud** contains Microsoft Entra joined session hosts, and users already have the required role assignments. A dynamic device group named **SH-Devices** contains all the HP-Cloud session hosts.

    You need to enable Microsoft Entra single sign-on for HP-Cloud. Users must never see the dialog that asks them to allow the Remote Desktop connection.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'utilisateurs cloud uniquement et d'aucun AD DS. Un pool d'hôtes nommé **HP-Cloud** contient des hôtes de session joints à Microsoft Entra, et les utilisateurs ont déjà les attributions de rôles nécessaires. Un groupe d'appareils dynamique nommé **SH-Devices** contient tous les hôtes de session de HP-Cloud.

    Vous devez activer l'authentification unique Microsoft Entra pour HP-Cloud. Les utilisateurs ne doivent jamais voir la boîte de dialogue qui leur demande d'autoriser la connexion Bureau à distance.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: enable, text: { en: "On the Windows Cloud Login service principal, enable the Microsoft Entra ID authentication protocol for remote devices.", fr: "Sur le principal de service Windows Cloud Login, activer le protocole d'authentification Microsoft Entra ID pour les appareils distants." } }
    - { id: groups, text: { en: "Add SH-Devices to the target device groups of Windows Cloud Login.", fr: "Ajouter SH-Devices aux groupes d'appareils cibles de Windows Cloud Login." } }
    - { id: hostpool, text: { en: "Set Microsoft Entra single sign-on in the RDP properties of HP-Cloud to use Microsoft Entra authentication.", fr: "Définir l'authentification unique Microsoft Entra dans les propriétés RDP de HP-Cloud pour utiliser l'authentification Microsoft Entra." } }
    - { id: kerberos, text: { en: "Create a Microsoft Entra Kerberos server object.", fr: "Créer un objet serveur Kerberos Microsoft Entra." } }
    - { id: target, text: { en: "Add targetisaadjoined:i:1 to the RDP properties of HP-Cloud.", fr: "Ajouter targetisaadjoined:i:1 aux propriétés RDP de HP-Cloud." } }
    - { id: kdc, text: { en: "Deploy a KDC proxy and add kdcproxyname to the RDP properties of HP-Cloud.", fr: "Déployer un proxy KDC et ajouter kdcproxyname aux propriétés RDP de HP-Cloud." } }
answer:
  sequence: [ enable, groups, hostpool ]
explanation:
  correct:
    en: |
      You first enable Microsoft Entra authentication for RDP on Windows Cloud Login; this creates the remote desktop security configuration that holds the target device groups. Adding SH-Devices as a target device group hides the consent dialog for the session hosts. Enabling single sign-on on the host pool comes last, so that no user connects with SSO before the dialog is hidden.
    fr: |
      Vous activez d'abord l'authentification Microsoft Entra pour RDP sur Windows Cloud Login ; cela crée la configuration de sécurité Bureau à distance qui contient les groupes d'appareils cibles. Ajouter SH-Devices comme groupe d'appareils cible masque la boîte de dialogue de consentement pour les hôtes de session. L'activation de l'authentification unique sur le pool d'hôtes vient en dernier, afin qu'aucun utilisateur ne se connecte avec l'authentification unique avant que la boîte de dialogue soit masquée.
  options:
    kerberos: { en: "A Kerberos server object is needed only for hybrid joined hosts or when AD DS resources must be reached; Tailspin has no AD DS.", fr: "Un objet serveur Kerberos n'est nécessaire que pour des hôtes joints hybrides ou pour atteindre des ressources AD DS ; Tailspin n'a pas d'AD DS." }
    target: { en: "targetisaadjoined restricts sign-in to a username and password and is replaced by enablerdsaadauth.", fr: "targetisaadjoined limite la connexion à un nom d'utilisateur et un mot de passe et est remplacé par enablerdsaadauth." }
    kdc: { en: "A KDC proxy relays Kerberos to domain controllers, which don't exist here.", fr: "Un proxy KDC relaie Kerberos vers des contrôleurs de domaine, qui n'existent pas ici." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
