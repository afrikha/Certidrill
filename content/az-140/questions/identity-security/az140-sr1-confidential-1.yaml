id: az140-sr1-confidential-1
objective: "2.2.7"
type: series_yesno
series: az140-sr1-confidential
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You select the Trusted launch virtual machines security type.
  fr: Vous sélectionnez le type de sécurité Trusted launch virtual machines.
body:
  solution:
    en: |
      On the **Virtual machines** tab, you set **Security type** to **Trusted launch virtual machines** and keep **Secure boot** and **vTPM** enabled.
    fr: |
      Sous l'onglet **Machines virtuelles**, vous définissez **Type de sécurité** sur **Trusted launch virtual machines** et laissez **Démarrage sécurisé** et **vTPM** activés.
answer: { value: false }
explanation:
  correct:
    en: |
      Trusted launch protects the boot chain with Secure Boot and a vTPM against rootkits and boot kits, but it doesn't encrypt the memory of the VM while it is in use. Hardware-based memory encryption isolated from the hypervisor and the host requires Azure confidential VMs.
    fr: |
      Le lancement sécurisé (Trusted launch) protège la chaîne de démarrage contre les rootkits et les bootkits grâce au démarrage sécurisé et à un vTPM, mais il ne chiffre pas la mémoire de la machine virtuelle pendant son utilisation. Le chiffrement matériel de la mémoire isolé de l'hyperviseur et de l'hôte exige des machines virtuelles confidentielles Azure.
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
