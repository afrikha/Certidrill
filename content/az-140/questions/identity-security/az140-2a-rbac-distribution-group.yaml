id: az140-2a-rbac-distribution-group
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a host pool named **HP-Sales** and a desktop application group named **DAG-Sales**. The sales users are members of a Microsoft Entra distribution group named **Sales-DL**.

    You assign the Desktop Virtualization User role on DAG-Sales to Sales-DL. The sales users sign in to Windows App successfully, but no desktop appears in their feed.

    You need the sales users to see the desktop. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Contoso dispose d'un pool d'hôtes nommé **HP-Sales** et d'un groupe d'applications de bureau nommé **DAG-Sales**. Les utilisateurs du service commercial sont membres d'un groupe de distribution Microsoft Entra nommé **Sales-DL**.

    Vous attribuez le rôle Desktop Virtualization User sur DAG-Sales à Sales-DL. Les utilisateurs se connectent à Windows App sans erreur, mais aucun bureau n'apparaît dans leur flux.

    Vous devez faire en sorte que les utilisateurs du service commercial voient le bureau. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Desktop Virtualization User role to Sales-DL on HP-Sales.", fr: "Attribuer le rôle Desktop Virtualization User à Sales-DL sur HP-Sales." } }
    - { id: b, text: { en: "Create a security group with the sales users and assign it the role on DAG-Sales.", fr: "Créer un groupe de sécurité avec les utilisateurs commerciaux et lui attribuer le rôle sur DAG-Sales." } }
    - { id: c, text: { en: "Assign the Desktop Virtualization Reader role to Sales-DL on DAG-Sales.", fr: "Attribuer le rôle Desktop Virtualization Reader à Sales-DL sur DAG-Sales." } }
    - { id: d, text: { en: "Enable Start VM on Connect on HP-Sales.", fr: "Activer Start VM on Connect sur HP-Sales." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Virtual Desktop doesn't support Microsoft Entra distribution groups for assignments: a user who is assigned only through a distribution group gets no feed. Assigning the Desktop Virtualization User role on the application group to a security group that contains the users fixes the feed and remains a single group assignment.
    fr: |
      Azure Virtual Desktop ne prend pas en charge les groupes de distribution Microsoft Entra pour les attributions : un utilisateur attribué uniquement via un groupe de distribution n'obtient aucun flux. Attribuer le rôle Desktop Virtualization User sur le groupe d'applications à un groupe de sécurité qui contient les utilisateurs corrige le flux et reste une attribution de groupe unique.
  options:
    a: { en: "The role grants access through the application group; on the host pool it gives no desktop, and the distribution group problem remains.", fr: "Le rôle donne accès par le groupe d'applications ; sur le pool d'hôtes il ne donne aucun bureau, et le problème du groupe de distribution demeure." }
    c: { en: "Desktop Virtualization Reader lets administrators view resources; it doesn't publish the desktop to users.", fr: "Desktop Virtualization Reader permet aux administrateurs de voir les ressources ; il ne publie pas le bureau aux utilisateurs." }
    d: { en: "Start VM on Connect powers on deallocated hosts at connection time; it doesn't change what appears in the feed.", fr: "Start VM on Connect démarre les hôtes libérés au moment de la connexion ; il ne change pas ce qui apparaît dans le flux." }
references:
  - title: Troubleshoot Azure Virtual Desktop service connections
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-desktop/troubleshoot-service-connection
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
