id: az140-2b-adm-jit-plan-scope
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has an Azure subscription named Sub1 that contains 200 virtual machines, including 12 Azure Virtual Desktop session hosts in a resource group named rg-avd-prod. Microsoft Defender for Servers Plan 1 is enabled on Sub1. The session hosts are in a subnet that has a network security group.

    You need to use just-in-time VM access for administrative RDP connections to the 12 session hosts.

    What should you do first?
  fr: |
    Tailspin dispose d'un abonnement Azure nommé Sub1 qui contient 200 machines virtuelles, dont 12 hôtes de session Azure Virtual Desktop dans un groupe de ressources nommé rg-avd-prod. Microsoft Defender pour serveurs Plan 1 est activé sur Sub1. Les hôtes de session se trouvent dans un sous-réseau doté d'un groupe de sécurité réseau.

    Vous devez utiliser l'accès JIT aux machines virtuelles pour les connexions RDP d'administration vers les 12 hôtes de session.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable Defender for Servers Plan 2 on Sub1.", fr: "Activer Defender pour serveurs Plan 2 sur Sub1." } }
    - { id: b, text: { en: "Enable Defender for Servers Plan 2 on the 12 session host VMs only.", fr: "Activer Defender pour serveurs Plan 2 uniquement sur les 12 machines virtuelles hôtes de session." } }
    - { id: c, text: { en: "Deploy Azure Bastion Standard in the virtual network of the session hosts.", fr: "Déployer Azure Bastion Standard dans le réseau virtuel des hôtes de session." } }
    - { id: d, text: { en: "Install the Azure Monitor Agent on the 12 session host VMs.", fr: "Installer l'agent Azure Monitor sur les 12 machines virtuelles hôtes de session." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Just-in-time VM access requires Defender for Servers Plan 2. Plan 2 is enabled at the subscription level; unlike Plan 1, it can't be enabled for individual resources (it can only be disabled per resource afterward).
    fr: |
      L'accès JIT aux machines virtuelles exige Defender pour serveurs Plan 2. Plan 2 s'active au niveau de l'abonnement ; contrairement à Plan 1, il ne peut pas être activé pour des ressources individuelles (il peut seulement être désactivé par ressource ensuite).
  options:
    b: { en: "Plan 2 can't be enabled per resource; only Plan 1 supports enabling at the resource level.", fr: "Plan 2 ne peut pas être activé par ressource ; seul Plan 1 prend en charge l'activation au niveau de la ressource." }
    c: { en: "Azure Bastion is an alternative access method; it doesn't provide just-in-time VM access.", fr: "Azure Bastion est une autre méthode d'accès ; il ne fournit pas l'accès JIT aux machines virtuelles." }
    d: { en: "JIT works by managing NSG and Azure Firewall rules; it doesn't need the Azure Monitor Agent.", fr: "JIT fonctionne en gérant des règles de NSG et de Pare-feu Azure ; il n'a pas besoin de l'agent Azure Monitor." }
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
  - title: Enable Just-in-Time Access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
