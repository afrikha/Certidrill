stem:
  en: You select the Confidential virtual machines security type.
  fr: Vous sélectionnez le type de sécurité Confidential virtual machines.
body:
  solution:
    en: |
      On the **Virtual machines** tab, you set **Security type** to **Confidential virtual machines**, select a VM size that supports confidential computing, and select the **Confidential compute encryption** checkbox.
    fr: |
      Sous l'onglet **Machines virtuelles**, vous définissez **Type de sécurité** sur **Confidential virtual machines**, vous sélectionnez une taille de machine virtuelle qui prend en charge l'informatique confidentielle et vous cochez la case **Confidential compute encryption**.
answer: { value: true }
explanation:
  correct:
    en: |
      Azure confidential VMs encrypt the memory with keys generated and protected by a dedicated secure processor in the CPU, isolated from the hypervisor and the host operating system. Confidential compute encryption of the OS disk binds the disk encryption keys to the vTPM of the VM, so only that VM can read the disk. Windows 11 Enterprise is a supported session host OS.
    fr: |
      Les machines virtuelles confidentielles Azure chiffrent la mémoire avec des clés générées et protégées par un processeur sécurisé dédié intégré au CPU, isolé de l'hyperviseur et du système d'exploitation de l'hôte. Le chiffrement confidentiel du disque du système d'exploitation lie ses clés de chiffrement au vTPM de la machine virtuelle : seule cette machine virtuelle peut lire le disque. Windows 11 Entreprise est un système d'exploitation d'hôte de session pris en charge.
references:
  - title: Security recommendations for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/security-guide
