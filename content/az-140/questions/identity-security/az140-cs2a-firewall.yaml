id: az140-cs2a-firewall
objective: "2.2.4"
type: multi
caseStudy: az140-cs2a-munsons
difficulty: 3
status: draft
stem:
  en: |
    FW1 uses an Azure Firewall policy that has DNS proxy enabled. You need to meet the inspection requirement for the session hosts in snet-hosts.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    FW1 utilise une stratégie de Pare-feu Azure dans laquelle le proxy DNS est activé. Vous devez respecter l'exigence d'inspection pour les hôtes de session de snet-hosts.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "In the firewall policy, create an application rule that allows the **WindowsVirtualDesktop** FQDN tag from an IP group that contains the session hosts."
        fr: "Dans la stratégie de pare-feu, créer une règle d'application qui autorise l'étiquette FQDN **WindowsVirtualDesktop** depuis un groupe IP qui contient les hôtes de session."
    - id: b
      text:
        en: "In RT-Hosts, add a route whose destination is the **WindowsVirtualDesktop** service tag, with the next hop type **Internet**."
        fr: "Dans RT-Hosts, ajouter un itinéraire dont la destination est la étiquette de service **WindowsVirtualDesktop**, avec le type de tronçon suivant **Internet**."
    - id: c
      text:
        en: "In the firewall policy, enable TLS inspection for the traffic from the session hosts to the Azure Virtual Desktop endpoints."
        fr: "Dans la stratégie de pare-feu, activer l'inspection TLS pour le trafic des hôtes de session vers les points de terminaison Azure Virtual Desktop."
    - id: d
      text:
        en: "In RT-Hosts, add a route whose destination is the **WindowsVirtualDesktop** service tag, with the next hop type **Virtual appliance** and the address 10.20.1.4."
        fr: "Dans RT-Hosts, ajouter un itinéraire dont la destination est la étiquette de service **WindowsVirtualDesktop**, avec le type de tronçon suivant **Appliance virtuelle** et l'adresse 10.20.1.4."
    - id: e
      text:
        en: "Associate RT-Hosts with AzureFirewallSubnet in VNet-Hub so that FW1 sends the return traffic through itself."
        fr: "Associer RT-Hosts à AzureFirewallSubnet dans VNet-Hub pour que FW1 renvoie le trafic de retour par lui-même."
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The WindowsVirtualDesktop FQDN tag lets FW1 allow the required Azure Virtual Desktop endpoints while all other traffic stays inspected. Because a default route to the firewall can disconnect sessions when the firewall scales in, Microsoft recommends a route for the WindowsVirtualDesktop service tag with the next hop Internet on the session host subnet, so that the gateway and broker traffic bypasses the firewall.
    fr: |
      L'étiquette FQDN WindowsVirtualDesktop permet à FW1 d'autoriser les points de terminaison Azure Virtual Desktop requis, tout le reste du trafic restant inspecté. Comme un itinéraire par défaut vers le pare-feu peut déconnecter les sessions lors d'une réduction de capacité du pare-feu, Microsoft recommande un itinéraire pour la étiquette de service WindowsVirtualDesktop avec le tronçon suivant Internet sur le sous-réseau des hôtes de session, afin que le trafic de la passerelle et du répartiteur contourne le pare-feu.
  options:
    c: { en: "Microsoft states that TLS inspection must not be used with Azure Virtual Desktop traffic.", fr: "Microsoft indique de ne pas utiliser l'inspection TLS avec le trafic Azure Virtual Desktop." }
    d: { en: "This route keeps the session traffic on the firewall, which is what causes disconnections during scale-in.", fr: "Cet itinéraire laisse le trafic des sessions sur le pare-feu, ce qui provoque justement les déconnexions lors de la réduction de capacité." }
    e: { en: "The route table must apply to the session host subnet; the firewall subnet needs a direct route to the internet.", fr: "La table de routage doit s'appliquer au sous-réseau des hôtes de session ; le sous-réseau du pare-feu a besoin d'un itinéraire direct vers Internet." }
references:
  - title: Use Azure Firewall to protect Azure Virtual Desktop deployments
    url: https://learn.microsoft.com/en-us/azure/firewall/protect-azure-virtual-desktop
