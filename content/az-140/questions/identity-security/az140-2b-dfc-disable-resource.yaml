id: az140-2b-dfc-disable-resource
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure subscription named Sub1. Microsoft Defender for Servers Plan 2 is enabled at the subscription level.

    Sub1 contains a production host pool and a test host pool. The 10 session hosts of the test host pool are in a resource group named rg-avd-test.

    You need to stop the Defender for Servers charges for the 10 test session hosts. All the other virtual machines in Sub1 must keep Plan 2 protection.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un abonnement Azure nommé Sub1. Microsoft Defender pour serveurs Plan 2 est activé au niveau de l'abonnement.

    Sub1 contient un pool d'hôtes de production et un pool d'hôtes de test. Les 10 hôtes de session du pool d'hôtes de test se trouvent dans un groupe de ressources nommé rg-avd-test.

    Vous devez arrêter la facturation de Defender pour serveurs pour les 10 hôtes de session de test. Toutes les autres machines virtuelles de Sub1 doivent conserver la protection Plan 2.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable Defender for Servers on each of the 10 test session hosts at the resource level.", fr: "Désactiver Defender pour serveurs sur chacun des 10 hôtes de session de test au niveau de la ressource." } }
    - { id: b, text: { en: "Create an exemption for the Microsoft cloud security benchmark initiative on rg-avd-test.", fr: "Créer une exemption pour l'initiative Microsoft cloud security benchmark sur rg-avd-test." } }
    - { id: c, text: { en: "Remove the Microsoft Defender for Endpoint extension from the 10 test session hosts.", fr: "Supprimer l'extension Microsoft Defender for Endpoint des 10 hôtes de session de test." } }
    - { id: d, text: { en: "Move the 10 test session hosts to a new resource group in Sub1 that has no Defender plan.", fr: "Déplacer les 10 hôtes de session de test vers un nouveau groupe de ressources de Sub1 sans plan Defender." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Defender for Servers Plan 2 is enabled per subscription, but it can be disabled for individual resources. Disabling it on the 10 test VMs stops their charges while every other VM in Sub1 stays covered by the subscription-level Plan 2.
    fr: |
      Defender pour serveurs Plan 2 s'active par abonnement, mais il peut être désactivé pour des ressources individuelles. Le désactiver sur les 10 machines virtuelles de test arrête leur facturation, tandis que toutes les autres machines virtuelles de Sub1 restent couvertes par le Plan 2 de l'abonnement.
  options:
    b: { en: "A policy exemption changes how recommendations are evaluated; the plan still covers and bills the VMs.", fr: "Une exemption de stratégie modifie l'évaluation des recommandations ; le plan couvre et facture toujours les machines virtuelles." }
    c: { en: "Removing the extension reduces protection, but the VMs are still covered by the plan and billed.", fr: "Supprimer l'extension réduit la protection, mais les machines virtuelles restent couvertes par le plan et facturées." }
    d: { en: "Defender plans aren't set per resource group; VMs in any resource group of Sub1 inherit the subscription-level plan.", fr: "Les plans Defender ne se définissent pas par groupe de ressources ; les machines virtuelles de tout groupe de ressources de Sub1 héritent du plan défini sur l'abonnement." }
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
