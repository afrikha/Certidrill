id: az140-sr1-mfa-offsite-2
objective: "2.1.4"
type: series_yesno
series: az140-sr1-mfa-offsite
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You target the Azure Virtual Desktop app.
  fr: Vous ciblez l'application Azure Virtual Desktop.
body:
  solution:
    en: |
      You create a Conditional Access policy that targets the users of HP-Sales and the **Azure Virtual Desktop** app (app ID `9cdead84-a844-4324-93f2-b2e6bb768d07`). The policy includes any location, excludes HQ-Network, applies to the **Browser** and **Mobile apps and desktop clients** client apps, and grants access only with **Require multifactor authentication**.
    fr: |
      Vous créez une stratégie d'accès conditionnel qui cible les utilisateurs de HP-Sales et l'application **Azure Virtual Desktop** (ID d'application `9cdead84-a844-4324-93f2-b2e6bb768d07`). La stratégie inclut n'importe quel emplacement, exclut HQ-Network, s'applique aux applications clientes **Navigateur** et **Applications mobiles et clients de bureau**, et accorde l'accès uniquement avec **Exiger l'authentification multifacteur**.
answer: { value: true }
explanation:
  correct:
    en: |
      Windows App authenticates to the Azure Virtual Desktop app to subscribe to the feed and to connect through the gateway, so a policy on that app enforces MFA for the connections. Excluding the trusted HQ-Network location removes the prompt at the head office. Without single sign-on, no policy on Windows Cloud Login is needed.
    fr: |
      Windows App s'authentifie auprès de l'application Azure Virtual Desktop pour s'abonner au flux et se connecter via la passerelle : une stratégie sur cette application impose donc l'authentification multifacteur pour les connexions. L'exclusion de l'emplacement approuvé HQ-Network supprime l'invite au siège. Sans authentification unique, aucune stratégie sur Windows Cloud Login n'est nécessaire.
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
