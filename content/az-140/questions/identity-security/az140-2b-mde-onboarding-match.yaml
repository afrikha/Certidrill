id: az140-2b-mde-onboarding-match
objective: "2.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has three Azure Virtual Desktop host pools that must be onboarded to Microsoft Defender for Endpoint. The pooled session hosts are created from a golden image.

    You need to choose an onboarding method for each host pool.

    Which method should you use for each host pool? To answer, drag the appropriate methods to the correct host pools. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de trois pools d'hôtes Azure Virtual Desktop qui doivent être intégrés à Microsoft Defender for Endpoint. Les hôtes de session regroupés sont créés à partir d'une image de référence.

    Vous devez choisir une méthode d'intégration pour chaque pool d'hôtes.

    Quelle méthode devez-vous utiliser pour chaque pool d'hôtes ? Pour répondre, faites glisser les méthodes appropriées vers les pools d'hôtes correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: intune, text: { en: "An Intune endpoint detection and response policy, as for physical devices", fr: "Une stratégie de détection et de réponse des points de terminaison Intune, comme pour les appareils physiques" } }
    - { id: ps1, text: { en: "Onboard-NonPersistentMachine.ps1 as a computer startup script in the image", fr: "Onboard-NonPersistentMachine.ps1 comme script de démarrage de l'ordinateur dans l'image" } }
    - { id: cmd, text: { en: "WindowsDefenderATPOnboardingScript.cmd alone as a computer startup script in the image", fr: "WindowsDefenderATPOnboardingScript.cmd seul comme script de démarrage de l'ordinateur dans l'image" } }
    - { id: golden, text: { en: "The onboarding script run once on the golden image before capture", fr: "Le script d'intégration exécuté une fois sur l'image de référence avant la capture" } }
  targets:
    - { id: t1, text: { en: "HP-Personal: personal desktops that persist, enrolled in Microsoft Intune", fr: "HP-Personal : bureaux personnels persistants, inscrits dans Microsoft Intune" } }
    - { id: t2, text: { en: "HP-Pooled: hosts deleted and re-created with the same names; one device entry per name", fr: "HP-Pooled : hôtes supprimés et recréés avec les mêmes noms ; une entrée d'appareil par nom" } }
    - { id: t3, text: { en: "HP-Lab: pooled test hosts; each provisioned instance must be a separate device entry", fr: "HP-Lab : hôtes de test regroupés ; chaque instance provisionnée doit être une entrée d'appareil distincte" } }
answer:
  mapping: { t1: intune, t2: ps1, t3: cmd }
explanation:
  correct:
    en: |
      Persistent VDI devices are onboarded like physical Windows devices, for example with Intune. Non-persistent hosts use the VDI onboarding scripts at startup; Onboard-NonPersistentMachine.ps1 gives a single entry per device name, and WindowsDefenderATPOnboardingScript.cmd alone creates a new entry for each provisioned instance.
    fr: |
      Les appareils VDI persistants s'intègrent comme des appareils Windows physiques, par exemple avec Intune. Les hôtes non persistants utilisent les scripts d'intégration VDI au démarrage ; Onboard-NonPersistentMachine.ps1 donne une seule entrée par nom d'appareil, et WindowsDefenderATPOnboardingScript.cmd seul crée une nouvelle entrée pour chaque instance provisionnée.
  options:
    golden: { en: "Never onboard the golden image: the clones would share its senseGuid and wouldn't appear as new devices.", fr: "N'intégrez jamais l'image de référence : les clones partageraient son senseGuid et n'apparaîtraient pas comme de nouveaux appareils." }
references:
  - title: Onboard non-persistent VDI devices to Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/configure-endpoints-vdi
