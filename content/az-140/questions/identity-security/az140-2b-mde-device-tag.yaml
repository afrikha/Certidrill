id: az140-2b-mde-device-tag
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a pooled Azure Virtual Desktop host pool whose session hosts are created from a golden image and onboarded to Microsoft Defender for Endpoint by the VDI onboarding script at startup.

    Security analysts must be able to filter the Azure Virtual Desktop session hosts in the Microsoft Defender portal device inventory by a device tag. Every new session host must have the tag when it first reports, without any manual action.

    What should you do?
  fr: |
    Proseware dispose d'un pool d'hôtes regroupé Azure Virtual Desktop dont les hôtes de session sont créés à partir d'une image de référence et intégrés à Microsoft Defender for Endpoint par le script d'intégration VDI au démarrage.

    Les analystes de sécurité doivent pouvoir filtrer les hôtes de session Azure Virtual Desktop dans l'inventaire des appareils du portail Microsoft Defender par une étiquette d'appareil. Chaque nouvel hôte de session doit avoir l'étiquette dès son premier rapport, sans aucune action manuelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Microsoft Entra dynamic device group whose rule matches the session host name prefix.", fr: "Créer un groupe d'appareils dynamique Microsoft Entra dont la règle correspond au préfixe de nom des hôtes de session." } }
    - { id: b, text: { en: "Set the device tag in the Defender for Endpoint DeviceTagging registry key of the golden image.", fr: "Définir l'étiquette d'appareil dans la clé de registre DeviceTagging de Defender for Endpoint de l'image de référence." } }
    - { id: c, text: { en: "Add the session host network interfaces to an application security group.", fr: "Ajouter les interfaces réseau des hôtes de session à un groupe de sécurité d'application." } }
    - { id: d, text: { en: "Add an Azure tag to the host pool resource in the Azure portal.", fr: "Ajouter une étiquette Azure à la ressource du pool d'hôtes dans le portail Azure." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft recommends setting a machine tag while you build the golden image by using the registry method for Defender for Endpoint device tags. Every host created from the image carries the registry value, so it reports with the tag from its first onboarding.
    fr: |
      Microsoft recommande de définir une étiquette de machine pendant la création de l'image de référence, avec la méthode du registre pour les étiquettes d'appareil de Defender for Endpoint. Chaque hôte créé à partir de l'image porte la valeur de registre et se signale donc avec l'étiquette dès sa première intégration.
  options:
    a: { en: "A Microsoft Entra group doesn't add a device tag in the Defender for Endpoint inventory.", fr: "Un groupe Microsoft Entra n'ajoute pas d'étiquette d'appareil dans l'inventaire de Defender for Endpoint." }
    c: { en: "Application security groups group NICs for NSG rules; they have no effect in the Defender portal.", fr: "Les groupes de sécurité d'application regroupent des cartes réseau pour les règles NSG ; ils n'ont aucun effet dans le portail Defender." }
    d: { en: "An Azure tag on the host pool is Azure Resource Manager metadata; it isn't applied as a Defender for Endpoint device tag.", fr: "Une étiquette Azure sur le pool d'hôtes est une métadonnée Azure Resource Manager ; elle n'est pas appliquée comme étiquette d'appareil Defender for Endpoint." }
references:
  - title: Onboard Windows devices in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/defender-endpoint/onboard-windows-multi-session-device
