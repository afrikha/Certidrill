id: az140-2a-req-aadds-sequence
objective: "2.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has cloud-only users in Microsoft Entra ID and no domain. A line-of-business application requires domain-joined session hosts, and the company doesn't want to manage domain controllers.

    You create a virtual network named **VNet1** that has two subnets, **snet-aadds** and **snet-hosts**. You plan to add domain-joined session hosts in snet-hosts to a new host pool named **HP-LOB**.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'utilisateurs cloud uniquement dans Microsoft Entra ID et d'aucun domaine. Une application métier exige des hôtes de session joints à un domaine, et l'entreprise ne veut pas gérer de contrôleurs de domaine.

    Vous créez un réseau virtuel nommé **VNet1** qui contient deux sous-réseaux, **snet-aadds** et **snet-hosts**. Vous prévoyez d'ajouter à un nouveau pool d'hôtes nommé **HP-LOB** des hôtes de session joints au domaine dans snet-hosts.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a Microsoft Entra Domain Services managed domain in snet-aadds.", fr: "Créer un domaine managé Microsoft Entra Domain Services dans snet-aadds." } }
    - { id: dns, text: { en: "Set the DNS servers of VNet1 to the IP addresses of the managed domain.", fr: "Définir les serveurs DNS de VNet1 sur les adresses IP du domaine managé." } }
    - { id: hosts, text: { en: "Add session hosts to HP-LOB and join them to the managed domain with an AAD DC Administrators account.", fr: "Ajouter des hôtes de session à HP-LOB et les joindre au domaine managé avec un compte AAD DC Administrators." } }
    - { id: connect, text: { en: "Install Microsoft Entra Connect and enable password hash synchronization.", fr: "Installer Microsoft Entra Connect et activer la synchronisation de hachage de mot de passe." } }
    - { id: hybrid, text: { en: "Configure Microsoft Entra hybrid join for the session hosts.", fr: "Configurer la jonction hybride Microsoft Entra pour les hôtes de session." } }
    - { id: kerberos, text: { en: "Create a Microsoft Entra Kerberos server object in the managed domain.", fr: "Créer un objet serveur Kerberos Microsoft Entra dans le domaine managé." } }
answer:
  sequence: [ create, dns, hosts ]
explanation:
  correct:
    en: |
      The managed domain must exist before you know the IP addresses of its domain controllers. VNet1 must then use those addresses as DNS servers so that the session hosts can locate the domain. Only then can the deployment join the session hosts with an account that is a member of AAD DC Administrators. User accounts are synchronized automatically, one way, from Microsoft Entra ID to the managed domain.
    fr: |
      Le domaine managé doit exister avant que vous connaissiez les adresses IP de ses contrôleurs de domaine. VNet1 doit ensuite utiliser ces adresses comme serveurs DNS pour que les hôtes de session puissent trouver le domaine. Ce n'est qu'alors que le déploiement peut joindre les hôtes de session avec un compte membre d'AAD DC Administrators. Les comptes d'utilisateurs sont synchronisés automatiquement, à sens unique, de Microsoft Entra ID vers le domaine managé.
  options:
    connect: { en: "Microsoft Entra Connect synchronizes an AD DS forest; Tailspin has cloud-only users and no AD DS.", fr: "Microsoft Entra Connect synchronise une forêt AD DS ; Tailspin a des utilisateurs cloud uniquement et aucun AD DS." }
    hybrid: { en: "Hybrid join requires AD DS; computers joined to a managed domain aren't hybrid joined.", fr: "La jonction hybride exige AD DS ; les ordinateurs joints à un domaine managé ne sont pas joints hybrides." }
    kerberos: { en: "A Kerberos server object is needed for single sign-on with AD DS, which isn't supported on hosts joined to Microsoft Entra Domain Services.", fr: "Un objet serveur Kerberos est nécessaire pour l'authentification unique avec AD DS, qui n'est pas prise en charge sur les hôtes joints à Microsoft Entra Domain Services." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
  - title: Compare self-managed Active Directory Domain Services, Microsoft Entra ID, and managed Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/compare-identity-solutions
