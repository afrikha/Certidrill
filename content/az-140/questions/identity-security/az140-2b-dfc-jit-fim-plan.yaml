id: az140-2b-dfc-jit-fim-plan
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure subscription named Sub1 that contains an Azure Virtual Desktop host pool named HostPool1. HostPool1 contains 30 session hosts that run Windows Server 2022.

    The security team has the following requirements for the session hosts:

    - The RDP port must stay closed until an administrator requests access for a limited time.
    - Changes to critical operating system files and registry keys must be detected.

    You need to enable the Microsoft Defender for Cloud plan that provides both capabilities. The solution must minimize cost.

    Which plan should you enable on Sub1?
  fr: |
    Contoso dispose d'un abonnement Azure nommé Sub1 qui contient un pool d'hôtes Azure Virtual Desktop nommé HostPool1. HostPool1 contient 30 hôtes de session qui exécutent Windows Server 2022.

    L'équipe de sécurité a les exigences suivantes pour les hôtes de session :

    - Le port RDP doit rester fermé tant qu'un administrateur ne demande pas un accès limité dans le temps.
    - Les modifications des fichiers critiques du système d'exploitation et des clés de registre doivent être détectées.

    Vous devez activer le plan de Microsoft Defender pour le cloud qui fournit ces deux fonctionnalités. La solution doit réduire les coûts au minimum.

    Quel plan devez-vous activer sur Sub1 ?
body:
  options:
    - { id: a, text: { en: "Foundational CSPM", fr: "CSPM de base (Foundational CSPM)" } }
    - { id: b, text: { en: "Defender for Servers Plan 1", fr: "Defender pour serveurs Plan 1" } }
    - { id: c, text: { en: "Defender for Servers Plan 2", fr: "Defender pour serveurs Plan 2" } }
    - { id: d, text: { en: "Defender CSPM", fr: "Defender CSPM" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Just-in-time VM access and file integrity monitoring are both Defender for Servers Plan 2 features. Plan 2 is the only plan in the list that provides both, so it is the least expensive option that meets the requirements.
    fr: |
      L'accès JIT aux machines virtuelles et la surveillance de l'intégrité des fichiers sont deux fonctionnalités de Defender pour serveurs Plan 2. Plan 2 est le seul plan de la liste qui fournit les deux : c'est donc l'option la moins coûteuse qui répond aux exigences.
  options:
    a: { en: "Foundational CSPM is free and provides the secure score and recommendations, but no just-in-time VM access or file integrity monitoring.", fr: "Le CSPM de base est gratuit et fournit le degré de sécurisation et les recommandations, mais ni l'accès JIT aux machines virtuelles ni la surveillance de l'intégrité des fichiers." }
    b: { en: "Plan 1 includes the Defender for Endpoint integration, but not just-in-time VM access or file integrity monitoring.", fr: "Plan 1 inclut l'intégration de Defender for Endpoint, mais ni l'accès JIT aux machines virtuelles ni la surveillance de l'intégrité des fichiers." }
    d: { en: "Defender CSPM is a posture management plan; the two workload protection features belong to Defender for Servers Plan 2.", fr: "Defender CSPM est un plan de gestion de la posture ; les deux fonctionnalités de protection des charges de travail appartiennent à Defender pour serveurs Plan 2." }
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
