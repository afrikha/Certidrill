id: az140-2b-mde-image-cleanup
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware builds the golden image of a pooled Azure Virtual Desktop host pool on a VM named ImageVM1. An administrator onboarded ImageVM1 to Microsoft Defender for Endpoint by mistake, and the SENSE service is running.

    Session hosts are onboarded at startup by the VDI onboarding scripts. Session hosts created from the next image version must appear as separate devices in the Microsoft Defender portal.

    What should you do on ImageVM1 before you generalize and capture it?
  fr: |
    Litware crée l'image de référence d'un pool d'hôtes regroupé Azure Virtual Desktop sur une machine virtuelle nommée ImageVM1. Un administrateur a intégré ImageVM1 à Microsoft Defender for Endpoint par erreur, et le service SENSE s'exécute.

    Les hôtes de session sont intégrés au démarrage par les scripts d'intégration VDI. Les hôtes de session créés à partir de la prochaine version d'image doivent apparaître comme des appareils distincts dans le portail Microsoft Defender.

    Que devez-vous faire sur ImageVM1 avant de le généraliser et de le capturer ?
body:
  options:
    - { id: a, text: { en: "Stop the SENSE service and set its startup type to Disabled.", fr: "Arrêter le service SENSE et définir son type de démarrage sur Désactivé." } }
    - { id: b, text: { en: "Uninstall Microsoft Defender Antivirus, and then reinstall it.", fr: "Désinstaller Microsoft Defender Antivirus, puis le réinstaller." } }
    - { id: c, text: { en: "Set the VDI registry value to NonPersistent under the DeviceTagging key.", fr: "Définir la valeur de registre VDI sur NonPersistent sous la clé DeviceTagging." } }
    - { id: d, text: { en: "Offboard ImageVM1, and then delete the Cyber folder and the senseGuid and senseId registry values.", fr: "Désintégrer ImageVM1, puis supprimer le dossier Cyber et les valeurs de registre senseGuid et senseId." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Clones of an onboarded image share its senseGuid and don't appear as new devices. Microsoft's procedure is to offboard the image, then, from a SYSTEM shell, delete the content of the Cyber folder and the senseGuid, senseId and related registry values before sealing the image.
    fr: |
      Les clones d'une image intégrée partagent son senseGuid et n'apparaissent pas comme de nouveaux appareils. La procédure de Microsoft consiste à désintégrer l'image puis, depuis un interpréteur de commandes SYSTEM, à supprimer le contenu du dossier Cyber et les valeurs de registre senseGuid, senseId et associées avant de sceller l'image.
  options:
    a: { en: "Disabling the service leaves the registration data in the image, so the clones would still share the same identity, and it would also break onboarding on the hosts.", fr: "Désactiver le service laisse les données d'inscription dans l'image : les clones partageraient toujours la même identité, et l'intégration des hôtes serait en outre bloquée." }
    b: { en: "Defender for Endpoint registration data isn't removed by reinstalling the antivirus.", fr: "La réinstallation de l'antivirus ne supprime pas les données d'inscription de Defender for Endpoint." }
    c: { en: "The VDI device tag applies to legacy MMA-based onboarding; it doesn't remove the image's registration.", fr: "L'étiquette d'appareil VDI concerne l'ancienne intégration basée sur MMA ; elle ne supprime pas l'inscription de l'image." }
references:
  - title: Onboard non-persistent VDI devices to Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/defender-endpoint/configure-endpoints-vdi
