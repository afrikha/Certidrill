id: az140-2b-net-nsg-outbound
objective: "2.2.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has an Azure Virtual Desktop host pool whose session hosts run Windows 11 Enterprise multi-session in a subnet named snet-hosts. The virtual network of snet-hosts is peered with a virtual network that contains a private endpoint for the storage account that stores the FSLogix profiles.

    A network security group (NSG) named NSG1 is associated with snet-hosts. No other NSG applies to the session hosts. The outbound security rules of NSG1 are shown in the following table.

    Answer each prompt by selecting the rule that processes the traffic.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un pool d'hôtes Azure Virtual Desktop dont les hôtes de session exécutent Windows 11 Entreprise multisession dans un sous-réseau nommé snet-hosts. Un peering relie le réseau virtuel de snet-hosts à un réseau virtuel qui contient un point de terminaison privé pour le compte de stockage des profils FSLogix.

    Un groupe de sécurité réseau (NSG) nommé NSG1 est associé à snet-hosts. Aucun autre NSG ne s'applique aux hôtes de session. Les règles de sécurité sortantes de NSG1 figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la règle qui traite le trafic.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Windows activation from a session host to azkms.core.windows.net (TCP 1688)", fr: "Activation de Windows depuis un hôte de session vers azkms.core.windows.net (TCP 1688)" }
    - id: p2
      text: { en: "SMB (TCP 445) from a session host to the private endpoint of the profile storage account", fr: "SMB (TCP 445) depuis un hôte de session vers le point de terminaison privé du compte de stockage des profils" }
  grid:
    header: [{ en: "Priority", fr: "Priorité" }, { en: Name, fr: Nom }, Port, { en: Destination, fr: Destination }, Action]
    rows:
      - [{ text: "100" }, { text: Allow-AVD, area: r100 }, { text: "443" }, { text: WindowsVirtualDesktop }, { text: Allow }]
      - [{ text: "110" }, { text: Allow-Entra, area: r110 }, { text: "443" }, { text: AzureActiveDirectory }, { text: Allow }]
      - [{ text: "120" }, { text: Allow-Monitor, area: r120 }, { text: "443" }, { text: AzureMonitor }, { text: Allow }]
      - [{ text: "4000" }, { text: Deny-Internet, area: r4000 }, { text: Any }, { text: Internet }, { text: Deny }]
      - [{ text: "65000" }, { text: AllowVnetOutBound, area: r65000 }, { text: Any }, { text: VirtualNetwork }, { text: Allow }]
      - [{ text: "65001" }, { text: AllowInternetOutBound, area: r65001 }, { text: Any }, { text: Internet }, { text: Allow }]
      - [{ text: "65500" }, { text: DenyAllOutBound, area: r65500 }, { text: Any }, { text: Any }, { text: Deny }]
answer:
  values: { p1: r4000, p2: r65000 }
explanation:
  correct:
    en: |
      Windows activation uses azkms.core.windows.net on TCP 1688, whose service tag is Internet; rules 100 to 120 only allow TCP 443 to other tags, so Deny-Internet (4000) blocks it, and you would need an allow rule for it with a lower priority number. The private endpoint is in a peered virtual network, which belongs to the VirtualNetwork service tag, so the default AllowVnetOutBound rule (65000) allows the SMB traffic.
    fr: |
      L'activation de Windows utilise azkms.core.windows.net sur TCP 1688, dont l'étiquette de service est Internet ; les règles 100 à 120 n'autorisent que TCP 443 vers d'autres étiquettes : Deny-Internet (4000) bloque donc ce trafic, et il faudrait une règle d'autorisation avec un numéro de priorité inférieur. Le point de terminaison privé se trouve dans un réseau virtuel relié par peering, qui fait partie de l'étiquette de service VirtualNetwork : la règle par défaut AllowVnetOutBound (65000) autorise le trafic SMB.
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
