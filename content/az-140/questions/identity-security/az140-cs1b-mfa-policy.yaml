id: az140-cs1b-mfa-policy
objective: "2.1.4"
type: single
caseStudy: az140-cs1b-lucerne-publishing
difficulty: 3
status: draft
stem:
  en: |
    You enable single sign-on for HP-Design. You need to meet the MFA requirement.

    What should you do?
  fr: |
    Vous activez l'authentification unique pour HP-Design. Vous devez satisfaire l'exigence relative à la MFA.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the sign-in frequency of CA-AVD to Every time.", fr: "Modifier la fréquence de connexion de CA-AVD sur Every time." } }
    - { id: b, text: { en: "Add the Azure Virtual Desktop Azure Resource Manager Provider app to CA-AVD and set the sign-in frequency to Every time.", fr: "Ajouter l'application Azure Virtual Desktop Azure Resource Manager Provider à CA-AVD et définir la fréquence de connexion sur Every time." } }
    - { id: c, text: { en: "Create a second policy that targets the Windows Cloud Login app, requires MFA, and sets the sign-in frequency to Every time.", fr: "Créer une deuxième stratégie qui cible l'application Windows Cloud Login, exige la MFA et définit la fréquence de connexion sur Every time." } }
    - { id: d, text: { en: "Enable per-user MFA for the members of Designers and keep CA-AVD unchanged.", fr: "Activer l'authentification multifacteur par utilisateur pour les membres de Designers et conserver CA-AVD sans modification." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With single sign-on, authentication to the session host goes through the Windows Cloud Login app, so Microsoft recommends a second Conditional Access policy that targets it. The Every time sign-in frequency is supported only on Windows Cloud Login with single sign-on, and it prompts for MFA when a user launches a new connection 5 to 10 minutes or more after the last authentication. CA-AVD keeps its 8-hour frequency, so feed refreshes do not prompt more often.
    fr: |
      Avec l'authentification unique, l'authentification auprès de l'hôte de session passe par l'application Windows Cloud Login : Microsoft recommande donc une deuxième stratégie d'accès conditionnel qui la cible. La fréquence de connexion Every time n'est prise en charge que sur Windows Cloud Login avec l'authentification unique, et elle demande la MFA quand l'utilisateur lance une nouvelle connexion 5 à 10 minutes ou plus après sa dernière authentification. CA-AVD conserve sa fréquence de 8 heures : les actualisations du flux ne sollicitent pas les utilisateurs plus souvent.
  options:
    a: { en: "Every time on the Azure Virtual Desktop app causes repeated prompts when the feed refreshes and when diagnostics are sent.", fr: "Every time sur l'application Azure Virtual Desktop provoque des invites répétées lors de l'actualisation du flux et de l'envoi des diagnostics." }
    b: { en: "The Azure Resource Manager Provider app only retrieves the user feed and must not be targeted with MFA.", fr: "L'application Azure Resource Manager Provider sert uniquement à récupérer le flux de l'utilisateur et ne doit pas être ciblée par la MFA." }
    d: { en: "Per-user MFA must be disabled for Azure Virtual Desktop users; with Entra joined hosts it causes sign-in errors.", fr: "L'authentification multifacteur par utilisateur doit être désactivée pour les utilisateurs d'Azure Virtual Desktop ; avec des hôtes joints à Microsoft Entra, elle provoque des erreurs de connexion." }
references:
  - title: Enforce Microsoft Entra multifactor authentication for Azure Virtual Desktop using Conditional Access
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-mfa
