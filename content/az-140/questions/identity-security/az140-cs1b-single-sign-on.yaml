id: az140-cs1b-single-sign-on
objective: "2.1.7"
type: multi
caseStudy: az140-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the single sign-on requirement for HP-Design.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence d'authentification unique pour HP-Design.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a Kerberos server object for the lucernepublishing.com tenant.", fr: "Créer un objet serveur Kerberos pour le locataire lucernepublishing.com." } }
    - { id: b, text: { en: "Add the RDP property targetisaadjoined:i:1 to HP-Design.", fr: "Ajouter la propriété RDP targetisaadjoined:i:1 à HP-Design." } }
    - { id: c, text: { en: "Enable the Microsoft Entra authentication protocol for RDP on the Windows Cloud Login service principal.", fr: "Activer le protocole d'authentification Microsoft Entra pour RDP sur le principal de service Windows Cloud Login." } }
    - { id: d, text: { en: "Add the RDP property enablerdsaadauth:i:1 to HP-Design.", fr: "Ajouter la propriété RDP enablerdsaadauth:i:1 à HP-Design." } }
    - { id: e, text: { en: "Assign the Virtual Machine Administrator Login role to Designers on RG-AVD-Hosts.", fr: "Attribuer le rôle Virtual Machine Administrator Login à Designers sur RG-AVD-Hosts." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Microsoft Entra single sign-on needs two settings: the isRemoteDesktopProtocolEnabled property set to true on the Windows Cloud Login service principal (Remote connection configuration in the Microsoft Entra admin center), and the host pool RDP property enablerdsaadauth:i:1. Configuring target device groups only hides the consent prompt, which the requirement accepts.
    fr: |
      L'authentification unique Microsoft Entra nécessite deux paramètres : la propriété isRemoteDesktopProtocolEnabled définie sur true sur le principal de service Windows Cloud Login (configuration de la connexion à distance dans le centre d'administration Microsoft Entra), et la propriété RDP enablerdsaadauth:i:1 du pool d'hôtes. La configuration de groupes d'appareils cibles ne fait que masquer l'invite de consentement, que l'exigence accepte.
  options:
    a: { en: "A Kerberos server object is needed only for hybrid joined hosts or when AD DS domain controllers exist; Lucerne has no AD DS.", fr: "Un objet serveur Kerberos n'est nécessaire que pour des hôtes joints hybrides ou en présence de contrôleurs de domaine AD DS ; Lucerne n'a pas d'AD DS." }
    b: { en: "targetisaadjoined:i:1 restricts sign-in to user name and password credentials, so users are still prompted by the session host.", fr: "targetisaadjoined:i:1 limite la connexion aux informations d'identification nom d'utilisateur et mot de passe : l'hôte de session demande donc toujours les informations d'identification." }
    e: { en: "This role grants local administrator rights; it does not enable single sign-on and breaks least privilege.", fr: "Ce rôle accorde les droits d'administrateur local ; il n'active pas l'authentification unique et enfreint le moindre privilège." }
references:
  - title: Configure single sign-on for Azure Virtual Desktop using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-single-sign-on
