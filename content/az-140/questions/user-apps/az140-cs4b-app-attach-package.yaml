id: az140-cs4b-app-attach-package
objective: "3.3.10"
type: ordering
caseStudy: az140-cs4b-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to prepare DevTool so that you can add it to HP-Contractors as an App attach package and meet the DevTool requirement.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez préparer DevTool pour pouvoir l'ajouter à HP-Contractors en tant que package App attach et satisfaire l'exigence relative à DevTool.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: convert, text: { en: "Convert DevToolSetup.exe into an MSIX package by using the MSIX Packaging Tool.", fr: "Convertir DevToolSetup.exe en package MSIX avec MSIX Packaging Tool." } }
    - { id: sign, text: { en: "Sign the MSIX package with the Proseware code-signing certificate.", fr: "Signer le package MSIX avec le certificat de signature de code de Proseware." } }
    - { id: cim, text: { en: "Run msixmgr.exe -Unpack with -create -fileType CIM to expand the package into a disk image.", fr: "Exécuter msixmgr.exe -Unpack avec -create -fileType CIM pour développer le package dans une image disque." } }
    - { id: copy, text: { en: "Copy the folder that contains the .cim file and the other files of the image to the appattach share.", fr: "Copier le dossier qui contient le fichier .cim et les autres fichiers de l'image vers le partage appattach." } }
    - { id: vhdx, text: { en: "Run msixmgr.exe -Unpack with -create -fileType VHDX -vhdSize 500 to expand the package into a disk image.", fr: "Exécuter msixmgr.exe -Unpack avec -create -fileType VHDX -vhdSize 500 pour développer le package dans une image disque." } }
    - { id: mount, text: { en: "Run msixmgr.exe -MountImage on each session host of HP-Contractors.", fr: "Exécuter msixmgr.exe -MountImage sur chaque hôte de session de HP-Contractors." } }
    - { id: intune, text: { en: "Deploy DevToolSetup.exe to the session hosts as an Intune Win32 app.", fr: "Déployer DevToolSetup.exe sur les hôtes de session en tant qu'application Win32 Intune." } }
answer:
  sequence: [ convert, sign, cim, copy ]
explanation:
  correct:
    en: |
      App attach uses MSIX, Appx or App-V packages, so the Win32 installer is first converted with the MSIX Packaging Tool. Every MSIX package must be signed with a certificate that the session hosts trust; a public CA chain is trusted by default. MSIXMGR then expands the signed package into a CIM image, the format with the fastest mount and the lowest CPU and memory use, recommended for Windows 11. A CIM image consists of several files, so you copy its whole folder to the share before you add the package to the host pool.
    fr: |
      App attach utilise des packages MSIX, Appx ou App-V : le programme d'installation Win32 est d'abord converti avec MSIX Packaging Tool. Chaque package MSIX doit être signé avec un certificat approuvé par les hôtes de session ; une chaîne d'autorité de certification publique est approuvée par défaut. MSIXMGR développe ensuite le package signé dans une image CIM, le format qui se monte le plus vite et consomme le moins de processeur et de mémoire, recommandé pour Windows 11. Une image CIM se compose de plusieurs fichiers : vous copiez donc tout son dossier vers le partage avant d'ajouter le package au pool d'hôtes.
  options:
    vhdx: { en: "VHDX is supported, but CIM mounts faster and uses less CPU and memory, which the requirement asks for.", fr: "VHDX est pris en charge, mais CIM se monte plus vite et consomme moins de processeur et de mémoire, ce que demande l'exigence." }
    mount: { en: "Azure Virtual Desktop mounts App attach images itself when users sign in; you don't mount them manually on each session host.", fr: "Azure Virtual Desktop monte lui-même les images App attach à la connexion des utilisateurs ; vous ne les montez pas manuellement sur chaque hôte de session." }
    intune: { en: "An Intune Win32 app installs DevTool on the session hosts, whereas App attach delivers it without installing it.", fr: "Une application Win32 Intune installe DevTool sur les hôtes de session, alors qu'App attach le distribue sans l'installer." }
references:
  - title: Create an MSIX image to use with App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-create-msix-image
  - title: MSIXMGR tool parameters
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/msixmgr-tool-syntax-description
