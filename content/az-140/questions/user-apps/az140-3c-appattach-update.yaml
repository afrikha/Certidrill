id: az140-3c-appattach-update
objective: "3.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop App attach package named **Planner** that is assigned to two host pools and to a group named **Planners**. The package uses a CIM disk image of version 1.0 of the application.

    You need to deliver version 1.1 of the application to the same users. The solution must meet the following requirements:

    - Don't create a second App attach package.
    - Don't interrupt users who are working in version 1.0.

    What should you do?
  fr: |
    Vous disposez d'un package App attach Azure Virtual Desktop nommé **Planner**, affecté à deux pools d'hôtes et à un groupe nommé **Planners**. Le package utilise une image disque CIM de la version 1.0 de l'application.

    Vous devez fournir la version 1.1 de l'application aux mêmes utilisateurs. La solution doit respecter les exigences suivantes :

    - Ne pas créer de deuxième package App attach.
    - Ne pas interrompre les utilisateurs qui travaillent dans la version 1.0.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Overwrite the 1.0 image files on the share with a 1.1 image that has the same file names.", fr: "Remplacer les fichiers de l'image 1.0 sur le partage par une image 1.1 portant les mêmes noms de fichiers." } }
    - { id: b, text: { en: "Update Planner to use a new 1.1 image, then delete the 1.0 image so that the session hosts mount the new version.", fr: "Mettre à jour Planner pour utiliser une nouvelle image 1.1, puis supprimer l'image 1.0 pour que les hôtes de session montent la nouvelle version." } }
    - { id: c, text: { en: "Set the registration type of Planner to Log on blocking so that version 1.1 registers at the next sign-in.", fr: "Définir le type d'inscription de Planner sur Log on blocking pour que la version 1.1 s'inscrive à la prochaine connexion." } }
    - { id: d, text: { en: "Update Planner to use a new 1.1 image, and keep the 1.0 image until no user is running version 1.0.", fr: "Mettre à jour Planner pour utiliser une nouvelle image 1.1, et conserver l'image 1.0 tant qu'un utilisateur exécute la version 1.0." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An in-place update points the existing application to a new image whose application version differs from the current one. Users get the new version the next time they sign in, without stopping the version they are using. Microsoft Learn says not to delete the existing image until all users have finished using it.
    fr: |
      Une mise à jour sur place fait pointer l'application existante vers une nouvelle image dont la version de l'application diffère de la version actuelle. Les utilisateurs reçoivent la nouvelle version à leur prochaine connexion, sans arrêter la version qu'ils utilisent. Microsoft Learn indique de ne pas supprimer l'image existante tant que tous les utilisateurs ne l'ont pas quittée.
  options:
    a:
      en: |-
        Overwriting the image isn't the documented update method: an update points the application to a new image with a different version, and the 1.0 image files are in use by the sessions that mounted them.
      fr: |-
        Écraser l'image n'est pas la méthode de mise à jour documentée : une mise à jour fait pointer l'application vers une nouvelle image d'une autre version, et les fichiers de l'image 1.0 sont utilisés par les sessions qui les ont montés.
    b:
      en: Deleting the 1.0 image while users still run version 1.0 interrupts them.
      fr: Supprimer l'image 1.0 alors que des utilisateurs exécutent encore la version 1.0 les interrompt.
    c:
      en: The registration type doesn't change which image the package uses; the package still points to the 1.0 image.
      fr: Le type d'inscription ne change pas l'image utilisée par le package ; le package pointe toujours vers l'image 1.0.
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
  - title: Add and manage App Attach applications in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-setup
