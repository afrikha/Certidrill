id: az140-cs4b-onedrive
objective: "3.3.6"
type: yesno_statements
caseStudy: az140-cs4b-proseware
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the OneDrive configuration of the HP-Contractors image before you meet the OneDrive requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la configuration OneDrive de l'image de HP-Contractors avant de satisfaire l'exigence relative à OneDrive.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          With the current image, contractors are signed in to the OneDrive sync app with their Windows credentials, without entering their account.
        fr: |
          Avec l'image actuelle, les prestataires sont connectés à l'application de synchronisation OneDrive avec leurs informations d'identification Windows, sans saisir leur compte.
    - id: s2
      text:
        en: |
          Setting KFMOptInWithWizard to the Microsoft Entra tenant ID meets the OneDrive requirement.
        fr: |
          Définir KFMOptInWithWizard sur l'ID du locataire Microsoft Entra satisfait l'exigence relative à OneDrive.
    - id: s3
      text:
        en: |
          If you set KFMSilentOptIn to the Microsoft Entra tenant ID without any per-folder value, OneDrive redirects the Desktop, Documents and Pictures folders.
        fr: |
          Si vous définissez KFMSilentOptIn sur l'ID du locataire Microsoft Entra sans aucune valeur par dossier, OneDrive redirige les dossiers Bureau, Documents et Images.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      SilentAccountConfig silently signs users in to the sync app with their Windows credentials on computers joined to Microsoft Entra ID, which is the case of the HP-Contractors session hosts. KFMOptInWithWizard only prompts users to move their known folders, and the requirement forbids prompts. KFMSilentOptIn, a string that contains the tenant ID, silently redirects the Desktop, Documents and Pictures folders; when no per-folder value is set, all three folders move.
    fr: |
      SilentAccountConfig connecte en silence les utilisateurs à l'application de synchronisation avec leurs informations d'identification Windows sur les ordinateurs joints à Microsoft Entra ID, ce qui est le cas des hôtes de session de HP-Contractors. KFMOptInWithWizard ne fait qu'inviter les utilisateurs à déplacer leurs dossiers connus, alors que l'exigence interdit toute invite. KFMSilentOptIn, une chaîne qui contient l'ID du locataire, redirige en silence les dossiers Bureau, Documents et Images ; si aucune valeur par dossier n'est définie, les trois dossiers sont déplacés.
references:
  - title: IT Admins - Use OneDrive policies to control sync settings
    url: https://learn.microsoft.com/en-us/sharepoint/use-group-policy
  - title: Use the sync app on virtual desktops
    url: https://learn.microsoft.com/en-us/sharepoint/sync-vdi-support
