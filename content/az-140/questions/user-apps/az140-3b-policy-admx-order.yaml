id: az140-3b-policy-admx-order
objective: "3.2.7"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has an Active Directory Domain Services (AD DS) domain named **northwind.com** that uses a Group Policy Central Store. The Azure Virtual Desktop session hosts are domain-joined and are in an organizational unit (OU) named **AVD-Hosts**. Your account is a member of Domain Admins.

    You need to configure screen capture protection for the session hosts by using Group Policy. The domain doesn't have the Azure Virtual Desktop administrative template yet.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'un domaine Active Directory Domain Services (AD DS) nommé **northwind.com** qui utilise un magasin central de stratégies de groupe. Les hôtes de session Azure Virtual Desktop sont joints au domaine et se trouvent dans une unité d'organisation (UO) nommée **AVD-Hosts**. Votre compte est membre de Domain Admins.

    Vous devez configurer la protection contre la capture d'écran pour les hôtes de session au moyen d'une stratégie de groupe. Le domaine ne dispose pas encore du modèle d'administration Azure Virtual Desktop.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: download, text: { en: "Download the template files from https://aka.ms/avdgpo and extract the .cab file and the .zip archive.", fr: "Télécharger les fichiers du modèle depuis https://aka.ms/avdgpo et extraire le fichier .cab et l'archive .zip." } }
    - { id: copy, text: { en: "Copy `terminalserver-avd.admx` to `\\\\northwind.com\\SYSVOL\\northwind.com\\Policies\\PolicyDefinitions` and `terminalserver-avd.adml` to its `en-US` subfolder.", fr: "Copier `terminalserver-avd.admx` dans `\\\\northwind.com\\SYSVOL\\northwind.com\\Policies\\PolicyDefinitions` et `terminalserver-avd.adml` dans son sous-dossier `en-US`." } }
    - { id: gpo, text: { en: "In the Group Policy Management Console, create a GPO linked to AVD-Hosts.", fr: "Dans la console de gestion des stratégies de groupe, créer un GPO lié à AVD-Hosts." } }
    - { id: setting, text: { en: "Configure screen capture protection under **Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Azure Virtual Desktop**.", fr: "Configurer la protection contre la capture d'écran sous **Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Azure Virtual Desktop**." } }
    - { id: user, text: { en: "Configure screen capture protection under **User Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services**.", fr: "Configurer la protection contre la capture d'écran sous **User Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services**." } }
    - { id: hosts, text: { en: "Copy `terminalserver-avd.admx` to `C:\\Windows\\PolicyDefinitions` on each session host.", fr: "Copier `terminalserver-avd.admx` dans `C:\\Windows\\PolicyDefinitions` sur chaque hôte de session." } }
answer:
  sequence: [ download, copy, gpo, setting ]
explanation:
  correct:
    en: |
      The Azure Virtual Desktop settings (screen capture protection, watermarking, RDP Shortpath for managed networks, graphics data logging) come from the `terminalserver-avd` administrative template. You download and extract it, copy the ADMX and ADML files to the Central Store so every management console sees them, then create a GPO that targets the session hosts and configure the setting under the computer node **Remote Desktop Session Host > Azure Virtual Desktop**.
    fr: |
      Les paramètres Azure Virtual Desktop (protection contre la capture d'écran, filigrane, RDP Shortpath pour les réseaux managés, journalisation des données graphiques) viennent du modèle d'administration `terminalserver-avd`. Vous le téléchargez et l'extrayez, copiez les fichiers ADMX et ADML dans le magasin central pour que toutes les consoles de gestion les voient, puis créez un GPO qui cible les hôtes de session et configurez le paramètre sous le nœud ordinateur **Remote Desktop Session Host > Azure Virtual Desktop**.
  options:
    user: { en: "The Azure Virtual Desktop template settings are computer settings, not user settings.", fr: "Les paramètres du modèle Azure Virtual Desktop sont des paramètres ordinateur, pas des paramètres utilisateur." }
    hosts: { en: "Administrative templates are needed where GPOs are edited (the Central Store in this domain), not on the computers that receive the policy.", fr: "Les modèles d'administration sont nécessaires là où l'on modifie les GPO (le magasin central dans ce domaine), pas sur les ordinateurs qui reçoivent la stratégie." }
references:
  - title: Add the administrative template for Azure Virtual Desktop to Group Policy
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/administrative-template
