id: az140-3b-mmr-extension-policy
objective: "3.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam installed multimedia redirection on the session hosts of an Azure Virtual Desktop host pool named **hp-learn**. The session hosts are enrolled in Microsoft Intune.

    You create an Intune settings catalog profile and configure the Microsoft Edge setting **Configure extension management settings** with the following JSON. You need to meet the following requirements:

    - The Microsoft Multimedia Redirection extension for Microsoft Edge is installed for every user without a prompt, and users can't remove or disable it.
    - The extension icon is always visible on the Microsoft Edge toolbar.

    How should you complete the JSON? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a installé la redirection multimédia sur les hôtes de session d'un pool d'hôtes Azure Virtual Desktop nommé **hp-learn**. Les hôtes de session sont inscrits dans Microsoft Intune.

    Vous créez un profil de catalogue de paramètres Intune et configurez le paramètre Microsoft Edge **Configure extension management settings** avec le JSON suivant. Vous devez répondre aux exigences suivantes :

    - L'extension Microsoft Multimedia Redirection pour Microsoft Edge est installée pour chaque utilisateur sans invite, et les utilisateurs ne peuvent ni la supprimer ni la désactiver.
    - L'icône de l'extension est toujours visible dans la barre d'outils de Microsoft Edge.

    Comment devez-vous compléter le JSON ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "joeclbldhdmoijbaagobkhlpfjglcihd": {
        "installation_mode": "[[mode]]",
        "update_url": "[[url]]",
        "toolbar_state": "[[toolbar]]"
      }
    }
  slots:
    - id: mode
      options:
        - { id: force, text: force_installed }
        - { id: normal, text: normal_installed }
        - { id: allowed, text: allowed }
        - { id: blocked, text: blocked }
    - id: url
      options:
        - { id: msi, text: "https://aka.ms/avdmmr/msi" }
        - { id: chrome, text: "https://clients2.google.com/service/update2/crx" }
        - { id: edge, text: "https://edge.microsoft.com/extensionwebstorebase/v1/crx" }
    - id: toolbar
      options:
        - { id: defshown, text: default_shown }
        - { id: hidden, text: default_hidden }
        - { id: forceshown, text: force_shown }
answer:
  values: { mode: force, url: edge, toolbar: forceshown }
explanation:
  correct:
    en: "`force_installed` installs the extension silently and prevents users from removing or disabling it. The Microsoft Edge extension (ID `joeclbldhdmoijbaagobkhlpfjglcihd`) is served from the Edge Add-ons update URL. `toolbar_state` set to `force_shown` keeps the icon pinned on the toolbar; the default is hidden."
    fr: "`force_installed` installe l'extension sans intervention et empêche les utilisateurs de la supprimer ou de la désactiver. L'extension Microsoft Edge (ID `joeclbldhdmoijbaagobkhlpfjglcihd`) est fournie par l'URL de mise à jour des modules complémentaires Edge. `toolbar_state` défini sur `force_shown` garde l'icône épinglée dans la barre d'outils ; la valeur par défaut est masquée."
  options:
    normal: { en: "normal_installed installs the extension but lets users disable it.", fr: "normal_installed installe l'extension mais laisse les utilisateurs la désactiver." }
    allowed: { en: "allowed only lets users install the extension themselves.", fr: "allowed permet seulement aux utilisateurs d'installer eux-mêmes l'extension." }
    blocked: { en: "blocked prevents the extension from being installed.", fr: "blocked empêche l'installation de l'extension." }
    msi: { en: "This URL downloads the MSI installed on the session hosts, not the extension updates.", fr: "Cette URL télécharge le MSI installé sur les hôtes de session, pas les mises à jour de l'extension." }
    chrome: { en: "This is the update URL of the Google Chrome extension, which has a different ID.", fr: "C'est l'URL de mise à jour de l'extension Google Chrome, qui a un autre ID." }
    defshown: { en: "default_shown shows the icon but lets users hide it.", fr: "default_shown affiche l'icône mais laisse les utilisateurs la masquer." }
    hidden: { en: "default_hidden is the default and hides the icon.", fr: "default_hidden est la valeur par défaut et masque l'icône." }
references:
  - title: Multimedia redirection for video playback and calls in a remote session
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection
