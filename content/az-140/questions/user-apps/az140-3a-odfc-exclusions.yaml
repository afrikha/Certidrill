id: az140-3a-odfc-exclusions
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove uses Windows roaming user profiles on the session hosts of a pooled host pool named **HP-Branch**. You add FSLogix ODFC containers to the session hosts. Under `HKLM\SOFTWARE\Policies\FSLogix\ODFC`, only the `Enabled`, `VHDLocations` and `VolumeType` values are configured.

    You need to update the roaming profile configuration so that it doesn't roam data that the ODFC container manages.

    Which two folders in the following list should you exclude from the roaming profiles?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove utilise les profils utilisateur itinérants Windows sur les hôtes de session d'un pool d'hôtes partagé nommé **HP-Branch**. Vous ajoutez des conteneurs ODFC FSLogix aux hôtes de session. Sous `HKLM\SOFTWARE\Policies\FSLogix\ODFC`, seules les valeurs `Enabled`, `VHDLocations` et `VolumeType` sont configurées.

    Vous devez mettre à jour la configuration des profils itinérants pour qu'elle ne fasse pas suivre des données gérées par le conteneur ODFC.

    Quels sont les deux dossiers de la liste suivante à exclure des profils itinérants ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: '%userprofile%\AppData\Local\Microsoft\Teams'
    - id: b
      text: '%userprofile%\AppData\Local\Microsoft\Outlook'
    - id: c
      text: '%userprofile%\Documents\OneNote Notebooks'
    - id: d
      text: '%userprofile%\AppData\Local\Microsoft\OneDrive'
    - id: e
      text: '%userprofile%\AppData\Roaming\Microsoft\Windows\Start Menu'
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      The folders to exclude depend on the Include settings that are in effect. IncludeOutlook and IncludeOneDrive default to 1, so the ODFC container manages AppData\Local\Microsoft\Outlook and AppData\Local\Microsoft\OneDrive, and the roaming profile solution must not roam them.
    fr: |-
      Les dossiers à exclure dépendent des paramètres Include en vigueur. IncludeOutlook et IncludeOneDrive valent 1 par défaut ; le conteneur ODFC gère donc AppData\Local\Microsoft\Outlook et AppData\Local\Microsoft\OneDrive, et la solution de profils itinérants ne doit pas les faire suivre.
  options:
    a:
      en: |-
        IncludeTeams defaults to 0, so the Teams folders aren't in the ODFC container unless you enable it.
      fr: |-
        IncludeTeams vaut 0 par défaut ; les dossiers Teams ne sont pas dans le conteneur ODFC tant que vous ne l'activez pas.
    c:
      en: |-
        IncludeOneNote defaults to 0, so OneNote notebooks stay in the roaming profile.
      fr: |-
        IncludeOneNote vaut 0 par défaut ; les blocs-notes OneNote restent dans le profil itinérant.
    e:
      en: |-
        The Start menu isn't Microsoft 365 app data and is never managed by the ODFC container.
      fr: |-
        Le menu Démarrer ne fait pas partie des données des applications Microsoft 365 et n'est jamais géré par le conteneur ODFC.
references:
  - title: Configure ODFC containers
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-odfc-containers
  - title: Configuration Settings
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
