id: az140-3a-mask-deploy
objective: "3.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A reference virtual machine named **REF1** runs the same image as the session hosts of a pooled host pool named **HP-Design**. An application named **CADViewer** is installed in the image. FSLogix Apps is installed on REF1 and on the session hosts.

    You need to hide CADViewer from a group named **Interns** on all the session hosts by using FSLogix application masking.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une machine virtuelle de référence nommée **REF1** exécute la même image que les hôtes de session d'un pool d'hôtes partagé nommé **HP-Design**. Une application nommée **CADViewer** est installée dans l'image. FSLogix Apps est installé sur REF1 et sur les hôtes de session.

    Vous devez masquer CADViewer au groupe **Interns** sur tous les hôtes de session à l'aide du masquage d'application FSLogix.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: editor
      text:
        en: |-
          Install the FSLogix Apps RuleEditor on REF1.
        fr: |-
          Installer FSLogix Apps RuleEditor sur REF1.
    - id: scan
      text:
        en: |-
          Create a Rule Set, choose CADViewer from the installed programs and select Scan.
        fr: |-
          Créer un Rule Set, choisir CADViewer parmi les programmes installés et sélectionner Scan.
    - id: assign
      text:
        en: |-
          Select Manage Assignments and add Interns with Applies set to Yes.
        fr: |-
          Sélectionner Manage Assignments et ajouter Interns avec Applies défini sur Yes.
    - id: copy
      text:
        en: |-
          Copy the .fxr and .fxa files to C:\Program Files\FSLogix\Apps\Rules on each session host.
        fr: |-
          Copier les fichiers .fxr et .fxa dans C:\Program Files\FSLogix\Apps\Rules sur chaque hôte de session.
    - id: restart
      text:
        en: |-
          Restart each session host so that the FSLogix Apps Services loads the Rule Set.
        fr: |-
          Redémarrer chaque hôte de session pour que FSLogix Apps Services charge le Rule Set.
    - id: profile
      text:
        en: |-
          Copy the .fxr and .fxa files to the FSLogix profile share.
        fr: |-
          Copier les fichiers .fxr et .fxa vers le partage des profils FSLogix.
    - id: odfc
      text:
        en: |-
          Create a redirection rule that moves CADViewer to the ODFC container.
        fr: |-
          Créer une règle de redirection qui déplace CADViewer vers le conteneur ODFC.
answer:
  sequence: [ editor, scan, assign, copy ]
explanation:
  correct:
    en: |-
      You create Rule Sets with the RuleEditor on a machine where the application is installed; the scan of the installed program generates the hiding rules. Manage Assignments sets who the rules apply to (a new Rule Set starts with Everyone set to No). The Rule Set is saved as a .fxr rule file and a .fxa assignment file, which the FSLogix Apps Services uses immediately once they are copied to C:\Program Files\FSLogix\Apps\Rules.
    fr: |-
      Vous créez les Rule Sets avec RuleEditor sur une machine où l'application est installée ; l'analyse du programme installé génère les règles de masquage. Manage Assignments définit à qui les règles s'appliquent (un nouveau Rule Set commence avec Everyone défini sur No). Le Rule Set est enregistré sous la forme d'un fichier de règles .fxr et d'un fichier d'attributions .fxa, que FSLogix Apps Services utilise immédiatement une fois copiés dans C:\Program Files\FSLogix\Apps\Rules.
  options:
    restart:
      en: |-
        No restart is needed; the rules are used as soon as the files are in the Rules folder.
      fr: |-
        Aucun redémarrage n'est nécessaire ; les règles sont utilisées dès que les fichiers se trouvent dans le dossier Rules.
    profile:
      en: |-
        The Rule Set files must be in the Rules folder of the FSLogix installation on each session host, not on the profile share.
      fr: |-
        Les fichiers du Rule Set doivent se trouver dans le dossier Rules de l'installation FSLogix sur chaque hôte de session, pas sur le partage des profils.
    odfc:
      en: |-
        Redirection rules move data into the profile container; hiding an application requires hiding rules.
      fr: |-
        Les règles de redirection déplacent des données vers le conteneur de profil ; masquer une application exige des règles de masquage.
references:
  - title: Create and Implement Rule Sets (Application Masking)
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-application-rule-sets
