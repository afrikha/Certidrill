id: az140-sr1-start-vm-1
objective: "3.2.10"
type: series_yesno
series: az140-sr1-start-vm
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You assign Power On Contributor on HP-Dev and enable Start VM on Connect.
  fr: Vous attribuez Power On Contributor sur HP-Dev et activez Start VM on Connect.
body:
  solution:
    en: |
      You assign the **Desktop Virtualization Power On Contributor** role to the Azure Virtual Desktop service principal at the scope of the **HP-Dev** host pool resource. In the properties of HP-Dev, you set **Start VM on connect** to **Yes**.
    fr: |
      Vous attribuez le rôle **Desktop Virtualization Power On Contributor** au principal de service Azure Virtual Desktop à l'étendue de la ressource de pool d'hôtes **HP-Dev**. Dans les propriétés de HP-Dev, vous définissez **Start VM on connect** sur **Yes**.
answer: { value: false }
explanation:
  correct:
    en: |
      The role assignment must be at a scope that contains both the host pool and its session host VMs, such as the resource group or the subscription. The VMs aren't child resources of the host pool, so an assignment on HP-Dev doesn't let Azure Virtual Desktop start them.
    fr: |
      L'attribution de rôle doit se trouver à une étendue qui contient à la fois le pool d'hôtes et les machines virtuelles de ses hôtes de session, comme le groupe de ressources ou l'abonnement. Les machines virtuelles ne sont pas des ressources enfants du pool d'hôtes : une attribution sur HP-Dev ne permet donc pas à Azure Virtual Desktop de les démarrer.
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
