id: az140-3a-ccd-read-write
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The session hosts of a pooled host pool named **HP-Lab** are configured with the following FSLogix value:

    ```text
    CCDLocations = type=smb,name="PRIMARY",connectionString=\\stlabprof1.file.core.windows.net\profiles;type=smb,name="SECONDARY",connectionString=\\anf-lab.adatum.com\profiles
    ```

    Which two statements describe how Cloud Cache uses the storage providers?

    NOTE: Each correct selection is worth one point.
  fr: |
    Les hôtes de session d'un pool d'hôtes partagé nommé **HP-Lab** sont configurés avec la valeur FSLogix suivante :

    ```text
    CCDLocations = type=smb,name="PRIMARY",connectionString=\\stlabprof1.file.core.windows.net\profiles;type=smb,name="SECONDARY",connectionString=\\anf-lab.adatum.com\profiles
    ```

    Quelles sont les deux affirmations qui décrivent la façon dont Cloud Cache utilise les fournisseurs de stockage ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Data that isn't in the local cache is read only from PRIMARY while PRIMARY is healthy.
        fr: |-
          Les données absentes du cache local ne sont lues que depuis PRIMARY tant que PRIMARY est sain.
    - id: b
      text:
        en: |-
          Reads are balanced between PRIMARY and SECONDARY to reduce the sign-in time.
        fr: |-
          Les lectures sont réparties entre PRIMARY et SECONDARY pour réduire la durée de connexion.
    - id: c
      text:
        en: |-
          Changes are written to SECONDARY only when PRIMARY becomes unhealthy.
        fr: |-
          Les modifications ne sont écrites sur SECONDARY que lorsque PRIMARY n'est plus sain.
    - id: d
      text:
        en: |-
          Changes are written to both PRIMARY and SECONDARY.
        fr: |-
          Les modifications sont écrites à la fois sur PRIMARY et sur SECONDARY.
    - id: e
      text:
        en: |-
          If both providers become unhealthy during a session, the user is signed out immediately.
        fr: |-
          Si les deux fournisseurs ne sont plus sains pendant une session, l'utilisateur est déconnecté immédiatement.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The first location in CCDLocations is the primary provider and the only one used for reads (hydration) unless it becomes unhealthy. Writes are flushed to all the providers, each on its own thread, whichever provider is used for reads.
    fr: |-
      Le premier emplacement de CCDLocations est le fournisseur principal et le seul utilisé pour les lectures (hydratation), sauf s'il n'est plus sain. Les écritures sont vidées vers tous les fournisseurs, chacun sur son propre thread, quel que soit le fournisseur utilisé pour les lectures.
  options:
    b:
      en: |-
        Only one provider is used to hydrate data; reads aren't spread across providers.
      fr: |-
        Un seul fournisseur est utilisé pour hydrater les données ; les lectures ne sont pas réparties entre les fournisseurs.
    c:
      en: |-
        Data is written to all the providers at all times, not only after a failure.
      fr: |-
        Les données sont écrites en permanence sur tous les fournisseurs, pas seulement après une panne.
    e:
      en: |-
        The session keeps running from the local cache, which keeps growing (up to SizeInMBs) until a provider is healthy again; the changes are then flushed.
      fr: |-
        La session continue de fonctionner à partir du cache local, qui grossit (jusqu'à SizeInMBs) jusqu'à ce qu'un fournisseur redevienne sain ; les modifications sont alors vidées.
references:
