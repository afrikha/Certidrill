id: az140-3c-remoteapp-store-path
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** and a RemoteApp application group named **AG-Apps**. A Microsoft Store application named **Contoso Notes** is installed on every session host of HP1. Its package family name is `Contoso.Notes_8wekyb3d8bbwe` and its application ID is `App`.

    You need to publish Contoso Notes in AG-Apps by using the **File path** application source. The application must keep starting after the Microsoft Store updates it.

    Which application path should you use?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** et d'un groupe d'applications RemoteApp nommé **AG-Apps**. Une application du Microsoft Store nommée **Contoso Notes** est installée sur chaque hôte de session de HP1. Son nom de famille de package est `Contoso.Notes_8wekyb3d8bbwe` et son ID d'application est `App`.

    Vous devez publier Contoso Notes dans AG-Apps avec la source d'application **Chemin d'accès au fichier** (File path). L'application doit continuer à démarrer après ses mises à jour par le Microsoft Store.

    Quel chemin d'application devez-vous utiliser ?
body:
  options:
    - id: a
      text: '`C:\Program Files\WindowsApps\Contoso.Notes_2.4.1.0_x64__8wekyb3d8bbwe\ContosoNotes.exe`'
    - id: b
      text: '`shell:appsFolder\Contoso.Notes_8wekyb3d8bbwe!App`'
    - id: c
      text: '`\\fs01\packages\Contoso.Notes_2.4.1.0_x64.msix`'
    - id: d
      text: '`C:\Program Files\WindowsApps\Contoso.Notes_8wekyb3d8bbwe`'
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft Store applications are installed in a folder whose name contains the version number, so the path changes at every update. Microsoft Learn says to publish them with `shell:appsFolder\<PackageFamilyName>!<AppId>`, which doesn't depend on the .exe file or the versioned folder. Because the icon isn't picked up from this path, you also provide an icon file on a local path that doesn't change.
    fr: |
      Les applications du Microsoft Store sont installées dans un dossier dont le nom contient le numéro de version : le chemin change à chaque mise à jour. Microsoft Learn indique de les publier avec `shell:appsFolder\<PackageFamilyName>!<AppId>`, qui ne dépend ni du fichier .exe ni du dossier versionné. Comme l'icône n'est pas récupérée depuis ce chemin, vous fournissez aussi un fichier d'icône sur un chemin local qui ne change pas.
  options:
    a:
      en: The folder name contains the version 2.4.1.0, so the path breaks at the next update.
      fr: Le nom du dossier contient la version 2.4.1.0 ; le chemin ne fonctionne plus après la prochaine mise à jour.
    c:
      en: A RemoteApp path points to an executable on the session host, not to a package file on a share.
      fr: Le chemin d'une RemoteApp désigne un exécutable sur l'hôte de session, pas un fichier de package sur un partage.
    d:
      en: This folder doesn't exist (the real folder name includes the version) and a folder isn't an executable path.
      fr: Ce dossier n'existe pas (le vrai nom de dossier contient la version) et un dossier n'est pas un chemin d'exécutable.
references:
  - title: Publish applications with RemoteApp in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/manage-app-groups
