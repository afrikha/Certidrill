id: az140-cs3b-app-groups
objective: "3.3.2"
type: yesno_statements
caseStudy: az140-cs3b-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You plan the application groups of HP-Resorts to meet the requirement for the FrontDesk users.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez les groupes d'applications de HP-Resorts pour satisfaire l'exigence relative aux utilisateurs de FrontDesk.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can create a RemoteApp application group that publishes SnowBook in HP-Resorts while DAG-Resorts remains assigned to the Managers group.
        fr: |
          Vous pouvez créer dans HP-Resorts un groupe d'applications RemoteApp qui publie SnowBook tout en laissant DAG-Resorts attribué au groupe Managers.
    - id: s2
      text:
        en: |
          If a manager is assigned to both DAG-Resorts and the new RemoteApp application group, the manager's feed shows both the full desktop and the SnowBook RemoteApp from HP-Resorts.
        fr: |
          Si un manager est affecté à la fois à DAG-Resorts et au nouveau groupe d'applications RemoteApp, son flux affiche à la fois le bureau complet et la RemoteApp SnowBook de HP-Resorts.
    - id: s3
      text:
        en: |
          The FrontDesk users see SnowBook only after the new RemoteApp application group is associated with a workspace.
        fr: |
          Les utilisateurs de FrontDesk ne voient SnowBook qu'une fois le nouveau groupe d'applications RemoteApp associé à un espace de travail.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A pooled host pool can have one desktop application group and several RemoteApp application groups at the same time. When a user is assigned to both types on the same host pool, the user sees only the resources of the host pool's preferred application group type, which is Desktop for HP-Resorts, so the manager would see only the full desktop. An application group must be associated with a workspace before its resources appear in the users' feed.
    fr: |
      Un pool d'hôtes regroupé peut avoir en même temps un groupe d'applications de bureau et plusieurs groupes d'applications RemoteApp. Quand un utilisateur est affecté aux deux types sur le même pool d'hôtes, il ne voit que les ressources du type de groupe d'applications préféré du pool, Desktop pour HP-Resorts : le manager ne verrait donc que le bureau complet. Un groupe d'applications doit être associé à un espace de travail pour que ses ressources apparaissent dans le flux des utilisateurs.
references:
  - title: Azure Virtual Desktop terminology
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/terminology
