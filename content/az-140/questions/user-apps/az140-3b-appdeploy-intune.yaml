id: az140-3b-appdeploy-intune
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Virtual Desktop pooled host pool named **hp-finance**. The session hosts run Windows 11 Enterprise multi-session, are Microsoft Entra joined, are enrolled in Microsoft Intune and are members of a device group named **SG-Finance-Hosts**.

    You need to deploy a Win32 application named **App1** to all the hp-finance session hosts by using Intune.

    How should you configure the App1 assignment?
  fr: |
    Litware dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-finance**. Les hôtes de session exécutent Windows 11 Entreprise multisession, sont joints à Microsoft Entra, sont inscrits dans Microsoft Intune et sont membres d'un groupe d'appareils nommé **SG-Finance-Hosts**.

    Vous devez déployer une application Win32 nommée **App1** sur tous les hôtes de session de hp-finance avec Intune.

    Comment devez-vous configurer l'attribution de App1 ?
body:
  options:
    - { id: a, text: { en: "Available intent, assigned to the finance user group, installed in the user context", fr: "Intention Disponible, attribuée au groupe d'utilisateurs de la finance, installée dans le contexte utilisateur" } }
    - { id: b, text: { en: "Required intent, assigned to the finance user group, installed in the user context", fr: "Intention Obligatoire, attribuée au groupe d'utilisateurs de la finance, installée dans le contexte utilisateur" } }
    - { id: c, text: { en: "Available intent, assigned to SG-Finance-Hosts, installed in the system context", fr: "Intention Disponible, attribuée à SG-Finance-Hosts, installée dans le contexte système" } }
    - { id: d, text: { en: "Required intent, assigned to SG-Finance-Hosts, installed in the system context", fr: "Intention Obligatoire, attribuée à SG-Finance-Hosts, installée dans le contexte système" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On Windows Enterprise multi-session, apps must be installed in the system (device) context and targeted to devices, with the Required or Uninstall intent. A Required assignment to the device group that contains the session hosts installs App1 on every host.
    fr: |
      Sur Windows Entreprise multisession, les applications doivent s'installer dans le contexte système (appareil) et cibler des appareils, avec l'intention Obligatoire ou Désinstaller. Une attribution Obligatoire au groupe d'appareils qui contient les hôtes de session installe App1 sur chaque hôte.
  options:
    a: { en: "The Available intent and user-context installations aren't supported on multi-session devices.", fr: "L'intention Disponible et les installations dans le contexte utilisateur ne sont pas prises en charge sur les appareils multisession." }
    b: { en: "Apps must be installed in the system context and targeted to devices, not users.", fr: "Les applications doivent s'installer dans le contexte système et cibler des appareils, pas des utilisateurs." }
    c: { en: "The Available intent isn't supported on multi-session devices.", fr: "L'intention Disponible n'est pas prise en charge sur les appareils multisession." }
references:
  - title: Using Azure Virtual Desktop multi-session with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/fundamentals/azure-virtual-desktop-multi-session
