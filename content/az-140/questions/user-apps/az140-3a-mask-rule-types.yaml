id: az140-3a-mask-rule-types
objective: "3.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses FSLogix Rule Sets on the session hosts of a pooled host pool named **HP-Plant**. You need to meet the following requirements.

    Which type of rule should you use for each requirement? To answer, drag the appropriate rule types to the correct requirements. Each rule type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise des Rule Sets FSLogix sur les hôtes de session d'un pool d'hôtes partagé nommé **HP-Plant**. Vous devez satisfaire les exigences suivantes.

    Quel type de règle devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types de règles appropriés vers les exigences correspondantes. Chaque type de règle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: hide, text: { en: "Hiding rule", fr: "Règle de masquage (Hiding)" } }
    - { id: redirect, text: { en: "Redirection rule", fr: "Règle de redirection" } }
    - { id: value, text: { en: "Specify value rule", fr: "Règle de valeur spécifiée (Specify value)" } }
    - { id: container, text: { en: "App container (VHD) rule", fr: "Règle App container (VHD)" } }
  targets:
    - id: t1
      text:
        en: |-
          Prevent a group of contractors from seeing the plant's label printers and two licensed fonts.
        fr: |-
          Empêcher un groupe de prestataires de voir les imprimantes d'étiquettes de l'usine et deux polices sous licence.
    - id: t2
      text:
        en: |-
          Keep the data that a legacy app writes outside the user profile available at the next sign-in on any session host.
        fr: |-
          Conserver les données qu'une ancienne application écrit hors du profil utilisateur, pour les retrouver à la prochaine connexion sur n'importe quel hôte de session.
    - id: t3
      text:
        en: |-
          Set a value under an HKLM registry key at sign-in for the members of the Quality group only.
        fr: |-
          Définir une valeur sous une clé de Registre HKLM à la connexion, uniquement pour les membres du groupe Quality.
answer:
  mapping: { t1: hide, t2: redirect, t3: value }
explanation:
  correct:
    en: |-
      Hiding rules hide files, folders, registry keys or values, printers and fonts from the users they're assigned to. Redirection rules redirect non-profile data into the profile container so it's available at later sign-ins on any virtual machine. A specify value rule sets a registry value at sign-in for chosen users or groups, typically for HKLM values. App container rules were retired on February 11, 2025.
    fr: |-
      Les règles de masquage masquent des fichiers, des dossiers, des clés ou valeurs de Registre, des imprimantes et des polices aux utilisateurs auxquels elles sont attribuées. Les règles de redirection redirigent des données hors profil vers le conteneur de profil pour qu'elles soient disponibles aux connexions suivantes sur n'importe quelle machine virtuelle. Une règle de valeur spécifiée définit une valeur de Registre à la connexion pour des utilisateurs ou des groupes choisis, généralement pour des valeurs HKLM. Les règles App container ont été mises hors service le 11 février 2025.
references:
  - title: FSLogix Apps RuleEditor and Rule Sets
    url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-apps-rule-editor-rule-sets
