id: az140-3c-package-msixmgr
objective: "3.3.10"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a signed MSIX package named **FabrikamCRM.msix**. You plan to deliver it with App attach to Azure Virtual Desktop session hosts that run Windows 11 Enterprise multi-session.

    You need to create a new disk image of the package. The image format must provide the fastest mount and unmount times and the lowest CPU and memory use on the session hosts. The destination folder already exists.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un package MSIX signé nommé **FabrikamCRM.msix**. Vous prévoyez de le fournir avec App attach à des hôtes de session Azure Virtual Desktop qui exécutent Windows 11 Entreprise multisession.

    Vous devez créer une nouvelle image disque du package. Le format d'image doit offrir les temps de montage et de démontage les plus rapides et la plus faible consommation de processeur et de mémoire sur les hôtes de session. Le dossier de destination existe déjà.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    msixmgr.exe [[op]] -packagePath "C:\msix\FabrikamCRM.msix" [[img]] [[root]]
  slots:
    - id: op
      options:
        - { id: unpack, text: "-Unpack" }
        - { id: addpkg, text: "-AddPackage" }
        - { id: mount, text: "-MountImage" }
    - id: img
      options:
        - { id: cim, text: '-destination "C:\msix\FabrikamCRM\FabrikamCRM.cim" -applyACLs -create -fileType CIM' }
        - { id: vhdx, text: '-destination "C:\msix\FabrikamCRM\FabrikamCRM.vhdx" -applyACLs -create -fileType VHDX' }
        - { id: vhd, text: '-destination "C:\msix\FabrikamCRM\FabrikamCRM.vhd" -applyACLs -create -fileType VHD' }
    - id: root
      options:
        - { id: rootdir, text: "-rootDirectory apps" }
        - { id: size, text: "-vhdSize 500" }
        - { id: quiet, text: "-quietUX" }
answer:
  values: { op: unpack, img: cim, root: rootdir }
explanation:
  correct:
    en: |
      -Unpack extracts the package into a disk image, and -create with -fileType creates a new image of that type. CimFS mounts and unmounts faster than VHD and VHDX and uses less CPU and memory, and it is recommended with Windows 11 session hosts. -rootDirectory is required when unpacking to a CIM file.
    fr: |
      -Unpack extrait le package dans une image disque, et -create avec -fileType crée une nouvelle image de ce type. CimFS se monte et se démonte plus vite que VHD et VHDX et consomme moins de processeur et de mémoire ; il est recommandé avec des hôtes de session Windows 11. -rootDirectory est obligatoire quand vous décompressez vers un fichier CIM.
  options:
    addpkg: { en: "-AddPackage installs the package on the local computer; it doesn't create a disk image.", fr: "-AddPackage installe le package sur l'ordinateur local ; il ne crée pas d'image disque." }
    mount: { en: "-MountImage mounts an existing image; it doesn't create one.", fr: "-MountImage monte une image existante ; il n'en crée pas." }
    vhdx: { en: "VHDX works but mounts and unmounts more slowly and uses more resources than CIM.", fr: "VHDX fonctionne, mais se monte et se démonte plus lentement et consomme plus de ressources que CIM." }
    vhd: { en: "Microsoft doesn't recommend VHD for App attach images.", fr: "Microsoft ne recommande pas VHD pour les images App attach." }
    size: { en: "-vhdSize applies only to VHD and VHDX images, and CIM requires -rootDirectory.", fr: "-vhdSize s'applique uniquement aux images VHD et VHDX, et CIM exige -rootDirectory." }
    quiet: { en: "-quietUX only suppresses user interaction; CIM still requires -rootDirectory.", fr: "-quietUX supprime seulement l'interaction avec l'utilisateur ; CIM exige toujours -rootDirectory." }
references:
  - title: MSIXMGR tool parameters
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/msixmgr-tool-syntax-description
  - title: Create an MSIX image to use with App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-create-msix-image
