id: az140-3b-appdeploy-remoteapp
objective: "3.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has an Azure Virtual Desktop pooled host pool named **hp-sales** that is registered to a workspace named **ws-corp**. The session hosts use a generic image. A line-of-business application named **App1** is available as a signed MSIX disk image on an SMB share that the session hosts can access.

    You need to meet the following requirements:

    - Sales users see only App1 in Windows App, in its own window, without a full desktop.
    - App1 updates are delivered without rebuilding the image.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-sales**, inscrit dans un espace de travail nommé **ws-corp**. Les hôtes de session utilisent une image générique. Une application métier nommée **App1** est disponible sous forme d'image disque MSIX signée sur un partage SMB accessible aux hôtes de session.

    Vous devez répondre aux exigences suivantes :

    - Les commerciaux ne voient que App1 dans Windows App, dans sa propre fenêtre, sans bureau complet.
    - Les mises à jour de App1 sont distribuées sans reconstruire l'image.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install App1 in the generic image and redeploy the session hosts.", fr: "Installer App1 dans l'image générique et redéployer les hôtes de session." } }
    - { id: b, text: { en: "Add App1 as an App attach application, and assign it to hp-sales and to the Sales group.", fr: "Ajouter App1 comme application App attach, et l'attribuer à hp-sales et au groupe Sales." } }
    - { id: c, text: { en: "Create a RemoteApp application group registered to ws-corp, add App1 from the App attach source and assign the Sales group.", fr: "Créer un groupe d'applications RemoteApp inscrit dans ws-corp, y ajouter App1 depuis la source App attach et affecter le groupe Sales." } }
    - { id: d, text: { en: "Assign the Sales group to the desktop application group of hp-sales.", fr: "Affecter le groupe Sales au groupe d'applications de bureau de hp-sales." } }
    - { id: e, text: { en: "Configure FSLogix application masking to hide every application except App1 from the Sales group.", fr: "Configurer le masquage d'applications FSLogix pour cacher au groupe Sales toutes les applications sauf App1." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      App attach delivers App1 from its disk image, so updates only need a new image of the package, not of the session hosts; the application must be assigned to the host pool and to the users. To show App1 in its own window rather than a desktop, the users need a RemoteApp application group, and with a RemoteApp group you add the App attach application to the group.
    fr: |
      App attach distribue App1 à partir de son image disque : les mises à jour n'exigent qu'une nouvelle image du package, pas des hôtes de session ; l'application doit être attribuée au pool d'hôtes et aux utilisateurs. Pour afficher App1 dans sa propre fenêtre plutôt que dans un bureau, les utilisateurs ont besoin d'un groupe d'applications RemoteApp, et avec un groupe RemoteApp vous ajoutez l'application App attach au groupe.
  options:
    a: { en: "Installing App1 in the image means rebuilding the image and redeploying for every update.", fr: "Installer App1 dans l'image oblige à reconstruire l'image et à redéployer à chaque mise à jour." }
    d: { en: "The desktop application group publishes a full desktop, which the requirement excludes.", fr: "Le groupe d'applications de bureau publie un bureau complet, ce que l'exigence exclut." }
    e: { en: "Masking hides applications inside a desktop; it doesn't publish App1 as a RemoteApp and App1 would still need to be in the image.", fr: "Le masquage cache des applications dans un bureau ; il ne publie pas App1 en RemoteApp et App1 devrait encore être dans l'image." }
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
