id: az140-3b-rdp-hotarea
objective: "3.2.8"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Virtual Desktop host pool named **hp-claims**. The **Advanced** tab of the host pool RDP properties contains the properties shown in the following table. No policy on the session hosts or on the local devices restricts redirection.

    Users report the following issues:

    - The session plays their audio, but applications in the session don't receive the sound from their headset microphone.
    - Users who have two monitors see the remote desktop on only one of them.

    Answer each prompt by selecting the property that you must change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-claims**. L'onglet **Avancé** des propriétés RDP du pool d'hôtes contient les propriétés indiquées dans le tableau suivant. Aucune stratégie sur les hôtes de session ni sur les appareils locaux ne restreint la redirection.

    Les utilisateurs signalent les problèmes suivants :

    - La session diffuse bien leur audio, mais les applications de la session ne reçoivent pas le son du microphone de leur casque.
    - Les utilisateurs qui ont deux écrans ne voient le bureau distant que sur l'un d'eux.

    Répondez à chaque consigne en sélectionnant la propriété que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "Microphone issue", fr: "Problème de microphone" } }
    - { id: p2, text: { en: "Monitor issue", fr: "Problème d'écrans" } }
  grid:
    header: [{ en: "Property", fr: "Propriété" }, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: audiomode, area: audiomode }, { text: "0" }]
      - [{ text: audiocapturemode, area: audiocapture }, { text: "0" }]
      - [{ text: camerastoredirect, area: camera }, { text: "*" }]
      - [{ text: use multimon, area: multimon }, { text: "0" }]
      - [{ text: screen mode id, area: screenmode }, { text: "2" }]
      - [{ text: dynamic resolution, area: dynres }, { text: "1" }]
answer:
  values: { p1: audiocapture, p2: multimon }
explanation:
  correct:
    en: |
      `audiocapturemode:i:0` disables microphone redirection; set it to 1 so the local microphone is available in the session. `audiomode:i:0` plays the session audio on the local device, which is why users hear it. `use multimon:i:0` limits the session to a single display; set it to 1 to use all the local displays. `screen mode id:i:2` (full screen) and `dynamic resolution:i:1` don't limit the number of displays.
    fr: |
      `audiocapturemode:i:0` désactive la redirection du microphone ; définissez-la sur 1 pour rendre le microphone local disponible dans la session. `audiomode:i:0` diffuse l'audio de la session sur l'appareil local, c'est pourquoi les utilisateurs l'entendent. `use multimon:i:0` limite la session à un seul écran ; définissez-la sur 1 pour utiliser tous les écrans locaux. `screen mode id:i:2` (plein écran) et `dynamic resolution:i:1` ne limitent pas le nombre d'écrans.
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
