id: az140-cs1c-app-groups
objective: "3.3.2"
type: yesno_statements
caseStudy: az140-cs1c-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    The ticket office managers are assigned to both HP-Front-DAG and RAG-Front. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les responsables des caisses sont attribués à la fois à HP-Front-DAG et à RAG-Front. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the preferred application group type of HP-Front is RemoteApp, the managers see only SkiBook and POS in their feed for HP-Front.
        fr: Si le type de groupe d'applications préféré de HP-Front est RemoteApp, les responsables ne voient que SkiBook et POS dans leur flux pour HP-Front.
    - id: s2
      text:
        en: You can assign RAG-Front to HP-Partners as well, so that SkiBook is published to both host pools from one application group.
        fr: Vous pouvez aussi attribuer RAG-Front à HP-Partners, afin que SkiBook soit publié dans les deux pools d'hôtes à partir d'un seul groupe d'applications.
    - id: s3
      text:
        en: You can add a second desktop application group to HP-Front for the managers only.
        fr: Vous pouvez ajouter à HP-Front un deuxième groupe d'applications de bureau réservé aux responsables.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      When a user is assigned to both a desktop and a RemoteApp application group of the same pooled host pool, the preferred application group type decides what they see: with RemoteApp, only the RemoteApp programs appear. An application group belongs to exactly one host pool, so HP-Partners needs its own RemoteApp group (RAG-Partners). A host pool can have several RemoteApp application groups but only one desktop application group.
    fr: |
      Quand un utilisateur est attribué à la fois à un groupe d'applications de bureau et à un groupe RemoteApp du même pool d'hôtes regroupé, le type de groupe d'applications préféré détermine ce qu'il voit : avec RemoteApp, seules les applications RemoteApp apparaissent. Un groupe d'applications appartient à un seul pool d'hôtes : HP-Partners a donc besoin de son propre groupe RemoteApp (RAG-Partners). Un pool d'hôtes peut avoir plusieurs groupes d'applications RemoteApp, mais un seul groupe d'applications de bureau.
references:
  - title: Preferred application group type behavior for pooled host pools in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/preferred-application-group-type
