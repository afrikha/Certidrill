id: az140-3c-onedrive-allusers
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are preparing a custom image for an Azure Virtual Desktop pooled host pool of Windows 11 Enterprise multi-session session hosts. Microsoft 365 Apps is already installed without OneDrive, and you have set the `AllUsersInstall` registry value to 1.

    You need to install the OneDrive sync app in the mode that non-persistent environments require.

    Which command should you run from an elevated command prompt?
  fr: |
    Vous préparez une image personnalisée pour un pool d'hôtes regroupé Azure Virtual Desktop composé d'hôtes de session Windows 11 Entreprise multisession. Microsoft 365 Apps est déjà installé sans OneDrive, et vous avez défini la valeur de Registre `AllUsersInstall` sur 1.

    Vous devez installer l'application de synchronisation OneDrive dans le mode qu'exigent les environnements non persistants.

    Quelle commande devez-vous exécuter depuis une invite de commandes avec élévation de privilèges ?
body:
  options:
    - { id: a, text: "`OneDriveSetup.exe /silent`" }
    - { id: b, text: "`OneDrive.exe /background`" }
    - { id: c, text: "`OneDriveSetup.exe /allusers`" }
    - { id: d, text: "`OneDriveSetup.exe /uninstall`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      OneDrive normally installs per user under %localappdata%. Non-persistent virtual desktops require the per-machine installation, which you get by running `OneDriveSetup.exe /allusers`; the sync app is then installed under Program Files for every user of the session host.
    fr: |
      OneDrive s'installe normalement par utilisateur sous %localappdata%. Les bureaux virtuels non persistants exigent l'installation par ordinateur, obtenue en exécutant `OneDriveSetup.exe /allusers` ; l'application de synchronisation est alors installée sous Program Files pour tous les utilisateurs de l'hôte de session.
  options:
    a:
      en: The /silent switch only hides the installer user interface; the installation stays per user.
      fr: Le commutateur /silent masque seulement l'interface du programme d'installation ; l'installation reste par utilisateur.
    b:
      en: This command starts the already installed sync app in the background; Microsoft Learn uses it in the Run key so that OneDrive starts at sign-in.
      fr: Cette commande démarre en arrière-plan l'application de synchronisation déjà installée ; Microsoft Learn l'utilise dans la clé Run pour que OneDrive démarre à la connexion.
    d:
      en: The /uninstall switch removes a per-user installation; it doesn't install OneDrive.
      fr: Le commutateur /uninstall supprime une installation par utilisateur ; il n'installe pas OneDrive.
references:
  - title: Install the sync app per-machine
    url: https://learn.microsoft.com/en-us/sharepoint/per-machine-installation
  - title: Use the sync app on virtual desktops
    url: https://learn.microsoft.com/en-us/sharepoint/sync-vdi-support
