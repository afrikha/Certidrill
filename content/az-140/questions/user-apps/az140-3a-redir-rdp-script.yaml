id: az140-3a-redir-rdp-script
objective: "3.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a pooled host pool named **HP-Bank** in a resource group named **rg-avd**. The session hosts allow every type of redirection, and the host pool has no custom RDP properties.

    For data protection, the sessions must meet the following requirements:

    - The clipboard of the local device isn't available in the session.
    - No local drive is redirected.
    - No serial (COM) port is redirected.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un pool d'hôtes partagé nommé **HP-Bank** dans un groupe de ressources nommé **rg-avd**. Les hôtes de session autorisent tous les types de redirection, et le pool d'hôtes n'a aucune propriété RDP personnalisée.

    Pour la protection des données, les sessions doivent répondre aux exigences suivantes :

    - Le Presse-papiers de l'appareil local n'est pas disponible dans la session.
    - Aucun lecteur local n'est redirigé.
    - Aucun port série (COM) n'est redirigé.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Update-AzWvdHostPool -ResourceGroupName rg-avd -Name HP-Bank `
      -CustomRdpProperty "[[clip]];[[drv]];[[com]]"
  slots:
    - id: clip
      options:
        - { id: clip0, text: 'redirectclipboard:i:0' }
        - { id: clip1, text: 'redirectclipboard:i:1' }
        - { id: print0, text: 'redirectprinters:i:0' }
    - id: drv
      options:
        - { id: empty, text: 'drivestoredirect:s:' }
        - { id: all, text: 'drivestoredirect:s:*' }
        - { id: dyn, text: 'drivestoredirect:s:DynamicDrives' }
    - id: com
      options:
        - { id: com0, text: 'redirectcomports:i:0' }
        - { id: com1, text: 'redirectcomports:i:1' }
        - { id: usb, text: 'usbdevicestoredirect:s:*' }
answer:
  values: { clip: clip0, drv: empty, com: com0 }
explanation:
  correct:
    en: |-
      redirectclipboard:i:0 makes the local clipboard unavailable in the session. drivestoredirect:s: with an empty value redirects no drive. redirectcomports defaults to 1, so it must be set explicitly to 0 to stop redirecting serial ports.
    fr: |-
      redirectclipboard:i:0 rend le Presse-papiers local indisponible dans la session. drivestoredirect:s: avec une valeur vide ne redirige aucun lecteur. redirectcomports vaut 1 par défaut : il faut donc le définir explicitement sur 0 pour arrêter la redirection des ports série.
  options:
    clip:
      en: |-
        redirectclipboard:i:1 enables the clipboard, and redirectprinters controls printers, not the clipboard.
      fr: |-
        redirectclipboard:i:1 active le Presse-papiers, et redirectprinters contrôle les imprimantes, pas le Presse-papiers.
    drv:
      en: |-
        The value * redirects all drives, including drives connected later, and DynamicDrives redirects the drives connected later.
      fr: |-
        La valeur * redirige tous les lecteurs, y compris ceux connectés plus tard, et DynamicDrives redirige les lecteurs connectés plus tard.
    com:
      en: |-
        redirectcomports:i:1 redirects the COM ports, and usbdevicestoredirect:s:* enables opaque low-level USB redirection instead of blocking anything.
      fr: |-
        redirectcomports:i:1 redirige les ports COM, et usbdevicestoredirect:s:* active la redirection USB opaque de bas niveau au lieu de bloquer quoi que ce soit.
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
