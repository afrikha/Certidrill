id: az140-3c-browser-mmr-policy
objective: "3.3.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1**. The Remote Desktop Multimedia Redirection Service is installed on the session hosts, and users browse with Microsoft Edge.

    You are creating the Microsoft Edge `ExtensionSettings` policy value in the Intune settings catalog. The policy must meet the following requirements:

    - Install the multimedia redirection extension for Microsoft Edge automatically, without letting users remove or disable it.
    - Prevent the extension from interacting with the pages of all `contoso.com` subdomains.

    How should you complete the JSON value? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1**. Le service de redirection multimédia Bureau à distance est installé sur les hôtes de session, et les utilisateurs naviguent avec Microsoft Edge.

    Vous créez la valeur de la stratégie Microsoft Edge `ExtensionSettings` dans le catalogue de paramètres Intune. La stratégie doit respecter les exigences suivantes :

    - Installer automatiquement l'extension de redirection multimédia pour Microsoft Edge, sans que les utilisateurs puissent la supprimer ou la désactiver.
    - Empêcher l'extension d'interagir avec les pages de tous les sous-domaines de `contoso.com`.

    Comment devez-vous compléter la valeur JSON ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "[[ext]]": {
        "installation_mode": "[[mode]]",
        "[[hosts]]": [ "*://*.contoso.com" ],
        "update_url": "https://edge.microsoft.com/extensionwebstorebase/v1/crx",
        "toolbar_state": "default_shown"
      }
    }
  slots:
    - id: ext
      options:
        - { id: edge, text: joeclbldhdmoijbaagobkhlpfjglcihd }
        - { id: chrome, text: lfmemoeeciijgkjkgbgikoonlkabmlno }
        - { id: star, text: "*" }
    - id: mode
      options:
        - { id: force, text: force_installed }
        - { id: normal, text: normal_installed }
        - { id: allowed, text: allowed }
    - id: hosts
      options:
        - { id: blocked, text: runtime_blocked_hosts }
        - { id: allowedh, text: runtime_allowed_hosts }
        - { id: types, text: allowed_types }
answer:
  values: { ext: edge, mode: force, hosts: blocked }
explanation:
  correct:
    en: |
      The multimedia redirection extension for Microsoft Edge has the ID joeclbldhdmoijbaagobkhlpfjglcihd. The force_installed mode installs it automatically and users can't remove it. runtime_blocked_hosts prevents the extension from interacting with pages on the listed domains, here every subdomain of contoso.com. Restart the session hosts after the policy applies.
    fr: |
      L'extension de redirection multimédia pour Microsoft Edge a l'ID joeclbldhdmoijbaagobkhlpfjglcihd. Le mode force_installed l'installe automatiquement sans que les utilisateurs puissent la supprimer. runtime_blocked_hosts empêche l'extension d'interagir avec les pages des domaines listés, ici tous les sous-domaines de contoso.com. Redémarrez les hôtes de session une fois la stratégie appliquée.
  options:
    chrome: { en: "This is the ID of the Google Chrome extension, which uses a different update URL.", fr: "C'est l'ID de l'extension Google Chrome, qui utilise une autre URL de mise à jour." }
    star: { en: "The * key sets defaults for all extensions instead of configuring the multimedia redirection extension.", fr: "La clé * définit des valeurs par défaut pour toutes les extensions au lieu de configurer l'extension de redirection multimédia." }
    normal: { en: "normal_installed installs the extension, but users can disable it.", fr: "normal_installed installe l'extension, mais les utilisateurs peuvent la désactiver." }
    allowed: { en: "allowed only lets users install the extension themselves.", fr: "allowed permet seulement aux utilisateurs d'installer eux-mêmes l'extension." }
    allowedh: { en: "runtime_allowed_hosts only creates exceptions to a block list; it doesn't block anything.", fr: "runtime_allowed_hosts crée seulement des exceptions à une liste de blocage ; il ne bloque rien." }
    types: { en: "allowed_types restricts which kinds of extensions can be installed, not the sites an extension can access.", fr: "allowed_types limite les types d'extensions installables, pas les sites auxquels une extension peut accéder." }
references:
  - title: Multimedia redirection for video playback and calls in a remote session
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection
