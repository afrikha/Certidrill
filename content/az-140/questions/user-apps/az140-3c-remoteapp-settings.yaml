id: az140-3c-remoteapp-settings
objective: "3.3.4"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You publish Excel as a RemoteApp named **Budget** in an Azure Virtual Desktop RemoteApp application group named **AG-Finance**. The application properties are shown in the following table.

    You need to meet the following requirements:

    - Excel must open the template `\\fs01\templates\budget.xltx` every time users start Budget.
    - Users must see the application as **Finance Budget** in Windows App.

    Which setting should you change for each requirement? To answer, select the appropriate setting in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous publiez Excel en tant que RemoteApp nommée **Budget** dans un groupe d'applications RemoteApp Azure Virtual Desktop nommé **AG-Finance**. Les propriétés de l'application figurent dans le tableau suivant.

    Vous devez respecter les exigences suivantes :

    - Excel doit ouvrir le modèle `\\fs01\templates\budget.xltx` chaque fois que les utilisateurs démarrent Budget.
    - Les utilisateurs doivent voir l'application sous le nom **Finance Budget** dans Windows App.

    Quel paramètre devez-vous modifier pour chaque exigence ? Pour répondre, sélectionnez le paramètre approprié dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Open the budget template at every start", fr: "Ouvrir le modèle de budget à chaque démarrage" }
    - id: p2
      text: { en: "Show the application as Finance Budget", fr: "Afficher l'application sous le nom Finance Budget" }
  grid:
    header: [{ en: Setting, fr: Paramètre }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: { en: Application source, fr: "Source d'application" }, area: src }, { text: File path }]
      - [{ text: { en: Application path, fr: "Chemin d'accès de l'application" }, area: path }, { text: 'C:\Program Files\Microsoft Office\root\Office16\EXCEL.EXE' }]
      - [{ text: { en: Application identifier, fr: "Identificateur de l'application" }, area: appid }, { text: Budget }]
      - [{ text: { en: Display name, fr: "Nom d'affichage" }, area: name }, { text: EXCEL }]
      - [{ text: { en: Require command line, fr: Ligne de commande requise }, area: cmd }, { text: { en: "No", fr: "Non" } }]
      - [{ text: { en: Icon path, fr: "Chemin de l'icône" }, area: icon }, { text: 'C:\Program Files\Microsoft Office\root\Office16\EXCEL.EXE' }]
answer:
  values: { p1: cmd, p2: name }
explanation:
  correct:
    en: |
      To pass arguments when the application starts, set **Require command line** to Yes and enter the command line, here the /t switch and the template path. The display name is the name users see for the application in their feed, so change it to Finance Budget. The application identifier is an internal identifier that users don't see.
    fr: |
      Pour passer des arguments au démarrage de l'application, réglez **Ligne de commande requise** sur Oui et saisissez la ligne de commande, ici le commutateur /t et le chemin du modèle. Le nom d'affichage est le nom que les utilisateurs voient pour l'application dans leur flux : remplacez-le par Finance Budget. L'identificateur de l'application est un identificateur interne que les utilisateurs ne voient pas.
references:
  - title: Publish applications with RemoteApp in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/manage-app-groups
