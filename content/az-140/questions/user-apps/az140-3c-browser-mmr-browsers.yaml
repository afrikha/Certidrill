id: az140-3c-browser-mmr-browsers
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1**. Users watch training videos on websites from their remote sessions, and the video playback uses a lot of session host CPU.

    You plan to install the Remote Desktop Multimedia Redirection Service and its browser extension on the session hosts so that video playback is redirected to the local devices.

    Which browsers can the users run on the session hosts to use multimedia redirection?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1**. Les utilisateurs regardent des vidéos de formation sur des sites web depuis leurs sessions distantes, et la lecture vidéo consomme beaucoup de processeur sur les hôtes de session.

    Vous prévoyez d'installer le service de redirection multimédia Bureau à distance (Remote Desktop Multimedia Redirection Service) et son extension de navigateur sur les hôtes de session, pour que la lecture vidéo soit redirigée vers les appareils locaux.

    Quels navigateurs les utilisateurs peuvent-ils exécuter sur les hôtes de session pour utiliser la redirection multimédia ?
body:
  options:
    - { id: a, text: { en: "Microsoft Edge only", fr: "Microsoft Edge uniquement" } }
    - { id: b, text: { en: "Google Chrome only", fr: "Google Chrome uniquement" } }
    - { id: c, text: { en: "Microsoft Edge, Google Chrome and Mozilla Firefox", fr: "Microsoft Edge, Google Chrome et Mozilla Firefox" } }
    - { id: d, text: { en: "Microsoft Edge and Google Chrome", fr: "Microsoft Edge et Google Chrome" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Multimedia redirection works through a browser extension that is available for Microsoft Edge and Google Chrome, and the latest version of one of these browsers must be installed on the session hosts. The service and the extension are installed from a single MSI file.
    fr: |
      La redirection multimédia fonctionne avec une extension de navigateur disponible pour Microsoft Edge et Google Chrome, et la dernière version de l'un de ces navigateurs doit être installée sur les hôtes de session. Le service et l'extension s'installent à partir d'un seul fichier MSI.
  options:
    a:
      en: Google Chrome is also supported, with its own extension ID.
      fr: Google Chrome est aussi pris en charge, avec son propre ID d'extension.
    b:
      en: Microsoft Edge is also supported, with its own extension ID.
      fr: Microsoft Edge est aussi pris en charge, avec son propre ID d'extension.
    c:
      en: No multimedia redirection extension exists for Mozilla Firefox.
      fr: Il n'existe pas d'extension de redirection multimédia pour Mozilla Firefox.
references:
  - title: Multimedia redirection for video playback and calls in a remote session
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection
