id: az140-3a-trbl-browser
objective: "3.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Users of Linux thin clients at Adatum connect to Azure Virtual Desktop by using Windows App in a web browser. After an audit, some thin clients fail to connect, and you must document the browser requirements that apply since June 15, 2025.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les utilisateurs de clients légers Linux d'Adatum se connectent à Azure Virtual Desktop à l'aide de Windows App dans un navigateur web. Après un audit, certains clients légers ne parviennent pas à se connecter, et vous devez documenter les exigences relatives au navigateur qui s'appliquent depuis le 15 juin 2025.

    Comment devez-vous compléter l'affirmation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The browser must be no more than [[age]] old on a rolling basis, must support the [[codec]] codec and must have [[api]] enabled.
    fr: |
      Le navigateur ne doit pas avoir plus de [[age]], sur une base glissante, doit prendre en charge le codec [[codec]] et doit avoir [[api]] activé.
  slots:
    - id: age
      options:
        - { id: m6, text: { en: "6 months", fr: "6 mois" } }
        - { id: m12, text: { en: "12 months", fr: "12 mois" } }
        - { id: m24, text: { en: "24 months", fr: "24 mois" } }
    - id: codec
      options:
        - { id: avc, text: AVC }
        - { id: hevc, text: HEVC }
        - { id: av1, text: AV1 }
    - id: api
      options:
        - { id: webgl, text: WebGL }
        - { id: webauthn, text: WebAuthn }
        - { id: webrtc, text: WebRTC }
answer:
  values: { age: m12, codec: avc, api: webgl }
explanation:
  correct:
    en: |-
      Since June 15, 2025, Windows App in a web browser requires a browser that is no more than 12 months old on a rolling basis, supports the AVC codec and has WebGL enabled. Mobile browsers aren't supported.
    fr: |-
      Depuis le 15 juin 2025, Windows App dans un navigateur web exige un navigateur qui n'a pas plus de 12 mois sur une base glissante, qui prend en charge le codec AVC et dont WebGL est activé. Les navigateurs mobiles ne sont pas pris en charge.
references:
  - title: Get started with Windows App
    url: https://learn.microsoft.com/en-us/windows-app/get-started-connect-devices-desktops-apps
