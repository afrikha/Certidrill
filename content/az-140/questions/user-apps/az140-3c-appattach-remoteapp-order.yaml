id: az140-3c-appattach-remoteapp-order
objective: "3.3.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** with a RemoteApp application group named **AG1**. A group named **Group1** is assigned to AG1. The session hosts are running, and an Azure Files share named **apps** is configured with the permissions that App attach requires.

    You have a signed CIM disk image of an MSIX application named **App1**. The signing certificate is trusted by the session hosts.

    You need to publish App1 to the members of Group1 as a RemoteApp by using App attach.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** avec un groupe d'applications RemoteApp nommé **AG1**. Un groupe nommé **Group1** est affecté à AG1. Les hôtes de session sont démarrés, et un partage Azure Files nommé **apps** est configuré avec les autorisations qu'exige App attach.

    Vous disposez d'une image disque CIM signée d'une application MSIX nommée **App1**. Le certificat de signature est approuvé par les hôtes de session.

    Vous devez publier App1 pour les membres de Group1 en tant que RemoteApp avec App attach.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: copy, text: { en: "Copy the files of the App1 CIM disk image to a folder of the apps share.", fr: "Copier les fichiers de l'image disque CIM d'App1 dans un dossier du partage apps." } }
    - { id: add, text: { en: "Add App1 in App attach, and assign the package to HP1 and to Group1.", fr: "Ajouter App1 dans App attach, puis affecter le package à HP1 et à Group1." } }
    - { id: publish, text: { en: "Add App1 to AG1 by using the App attach application source.", fr: "Ajouter App1 à AG1 avec la source d'application App attach." } }
    - { id: dag, text: { en: "Add App1 to the desktop application group of HP1.", fr: "Ajouter App1 au groupe d'applications de bureau de HP1." } }
    - { id: logon, text: { en: "Set the registration type of the package to Log on blocking.", fr: "Définir le type d'inscription du package sur Log on blocking." } }
    - { id: mount, text: { en: "Mount the CIM image on each session host by running msixmgr.exe -MountImage.", fr: "Monter l'image CIM sur chaque hôte de session en exécutant msixmgr.exe -MountImage." } }
answer:
  sequence: [copy, add, publish]
explanation:
  correct:
    en: |
      The disk image must be on the SMB share before you can select it when you add the package. A RemoteApp from App attach can only be published from a package that is already added and assigned to the host pool, and the users must also be assigned to the package. You then add the application to the RemoteApp application group with the App attach source.
    fr: |
      L'image disque doit se trouver sur le partage SMB avant que vous puissiez la sélectionner en ajoutant le package. Une RemoteApp issue d'App attach ne peut être publiée qu'à partir d'un package déjà ajouté et affecté au pool d'hôtes, et les utilisateurs doivent aussi être affectés au package. Vous ajoutez ensuite l'application au groupe d'applications RemoteApp avec la source App attach.
  options:
    dag:
      en: MSIX and Appx applications can't be added to a desktop application group, and AG1 delivers RemoteApp.
      fr: Les applications MSIX et Appx ne peuvent pas être ajoutées à un groupe d'applications de bureau, et c'est AG1 qui fournit les RemoteApp.
    logon:
      en: The registration type only changes when the application registers; On-demand, the default, is recommended.
      fr: Le type d'inscription change seulement le moment de l'inscription de l'application ; On-demand, la valeur par défaut, est recommandé.
    mount:
      en: App attach mounts the image on the session hosts at sign-in; no manual mount is needed.
      fr: App attach monte l'image sur les hôtes de session à la connexion ; aucun montage manuel n'est nécessaire.
references:
  - title: Add and manage App Attach applications in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-setup
