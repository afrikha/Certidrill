id: az140-3b-print-controls
objective: "3.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Virtual Desktop host pool named **hp-branch**. You need to meet the printing requirements described in the following table.

    What should you configure for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-branch**. Vous devez répondre aux exigences d'impression décrites ci-dessous.

    Que devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: redirect, text: "redirectprinters:i:1" }
    - { id: raw, text: "SmartRawPrinters:s:*" }
    - { id: localreg, text: { en: "DisablePrinterRedirection = 1 on the local device", fr: "DisablePrinterRedirection = 1 sur l'appareil local" } }
    - { id: up, text: { en: "Universal Print", fr: "Impression universelle (Universal Print)" } }
    - { id: easy, text: { en: "Install the printer drivers on the session hosts", fr: "Installer les pilotes d'imprimante sur les hôtes de session" } }
  targets:
    - { id: t1, text: { en: "Branch staff print from the session to a printer installed on their Windows laptop.", fr: "Le personnel des agences imprime depuis la session sur une imprimante installée sur son portable Windows." } }
    - { id: t2, text: { en: "A redirected label printer receives jobs that aren't XPS-compatible and must print them in RAW format.", fr: "Une imprimante d'étiquettes redirigée reçoit des travaux non compatibles XPS et doit les imprimer au format RAW." } }
    - { id: t3, text: { en: "A shared reception PC must never redirect its printers, while the other devices keep redirection.", fr: "Un PC d'accueil partagé ne doit jamais rediriger ses imprimantes, tandis que les autres appareils conservent la redirection." } }
    - { id: t4, text: { en: "Users connect from Android tablets and must print to branch printers. There is no print server.", fr: "Les utilisateurs se connectent depuis des tablettes Android et doivent imprimer sur les imprimantes des agences. Il n'existe aucun serveur d'impression." } }
answer:
  mapping: { t1: redirect, t2: raw, t3: localreg, t4: up }
explanation:
  correct:
    en: "`redirectprinters:i:1` makes the local printers available in the session. `SmartRawPrinters:s:*` enables RAW printing for redirected printers and requires printer redirection to be on. `DisablePrinterRedirection` set to 1 under `HKLM\\Software\\Microsoft\\Terminal Server Client` blocks redirection from that device only. Windows App on Android doesn't redirect printers, so Universal Print, a cloud print service, serves the tablets without a print server."
    fr: "`redirectprinters:i:1` rend les imprimantes locales disponibles dans la session. `SmartRawPrinters:s:*` active l'impression RAW pour les imprimantes redirigées et exige que la redirection d'imprimante soit activée. `DisablePrinterRedirection` défini sur 1 sous `HKLM\\Software\\Microsoft\\Terminal Server Client` bloque la redirection depuis cet appareil seulement. Windows App sur Android ne redirige pas les imprimantes : l'impression universelle, un service d'impression cloud, dessert les tablettes sans serveur d'impression."
  options:
    easy: { en: "Redirected printers use the Remote Desktop Easy Print driver; the printer's own driver is needed only on the local device.", fr: "Les imprimantes redirigées utilisent le pilote Remote Desktop Easy Print ; le pilote propre à l'imprimante n'est nécessaire que sur l'appareil local." }
references:
  - title: Configure printer redirection over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-printers
  - title: Universal Print and Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/universal-print/fundamentals/universal-print-avd
