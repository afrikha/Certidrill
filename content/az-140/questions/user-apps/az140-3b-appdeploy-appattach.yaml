id: az140-3b-appdeploy-appattach
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure Virtual Desktop pooled host pool named **hp-shared** that is used by the HR, legal and marketing departments. Each department uses line-of-business applications that the other departments must not see. The applications are available as MSIX packages and are updated every month.

    You need a solution that uses a single generic image for all the session hosts and updates the applications without rebuilding the image or redeploying the session hosts.

    What should you use?
  fr: |
    Adatum dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-shared**, utilisé par les services RH, juridique et marketing. Chaque service utilise des applications métier que les autres services ne doivent pas voir. Les applications sont disponibles sous forme de packages MSIX et sont mises à jour chaque mois.

    Vous avez besoin d'une solution qui utilise une seule image générique pour tous les hôtes de session et met à jour les applications sans reconstruire l'image ni redéployer les hôtes de session.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Install all the applications in the image and hide them with FSLogix application masking", fr: "Installer toutes les applications dans l'image et les masquer avec le masquage d'applications FSLogix" } }
    - { id: b, text: { en: "App attach, with each application assigned to the host pool and to its department group", fr: "App attach, avec chaque application attribuée au pool d'hôtes et au groupe de son service" } }
    - { id: c, text: { en: "Intune Win32 apps with the Available intent assigned to each department group", fr: "Des applications Win32 Intune avec l'intention Disponible attribuées au groupe de chaque service" } }
    - { id: d, text: { en: "One RemoteApp application group per department, with the applications installed in the image", fr: "Un groupe d'applications RemoteApp par service, avec les applications installées dans l'image" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      App attach attaches applications from packages stored on an SMB share to user sessions, without installing them in the image. Each application is assigned to the host pool and to specific users or groups, so departments on the same session host see different applications, and a new package version is picked up at the next sign-in without touching the image.
    fr: |
      App attach attache aux sessions utilisateur des applications provenant de packages stockés sur un partage SMB, sans les installer dans l'image. Chaque application est attribuée au pool d'hôtes et à des utilisateurs ou groupes précis : des services différents sur le même hôte de session voient des applications différentes, et une nouvelle version du package est prise en compte à la connexion suivante sans toucher à l'image.
  options:
    a: { en: "Masking hides applications per user, but they are still in the image, so every update needs a new image.", fr: "Le masquage cache les applications par utilisateur, mais elles restent dans l'image : chaque mise à jour exige une nouvelle image." }
    c: { en: "On multi-session hosts, Intune apps must use the Required or Uninstall intent in the system context; Available isn't supported.", fr: "Sur les hôtes multisession, les applications Intune doivent utiliser l'intention Obligatoire ou Désinstaller dans le contexte système ; Disponible n'est pas pris en charge." }
    d: { en: "Installing the applications in the image means rebuilding it for each monthly update.", fr: "Installer les applications dans l'image oblige à la reconstruire à chaque mise à jour mensuelle." }
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
