id: az140-cs1c-rdp-properties
objective: "3.2.8"
type: single
caseStudy: az140-cs1c-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |
    You plan to run the following command for HP-Front:

    `Update-AzWvdHostPool -ResourceGroupName RG-Front -Name HP-Front -CustomRdpProperty <value>`

    You need to meet the front-desk requirement. Which value should you use?
  fr: |
    Vous prévoyez d'exécuter la commande suivante pour HP-Front :

    `Update-AzWvdHostPool -ResourceGroupName RG-Front -Name HP-Front -CustomRdpProperty <value>`

    Vous devez satisfaire l'exigence relative à l'accueil. Quelle valeur devez-vous utiliser ?
body:
  options:
    - { id: a, text: "\"drivestoredirect:s:DynamicDrives;redirectclipboard:i:0;redirectprinters:i:1\"" }
    - { id: b, text: "\"drivestoredirect:s:;redirectclipboard:i:1;redirectprinters:i:1\"" }
    - { id: c, text: "\"drivestoredirect:s:*;redirectclipboard:i:0;redirectprinters:i:0\"" }
    - { id: d, text: "\"drivestoredirect:s:;redirectclipboard:i:0;redirectprinters:i:1\"" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An empty drivestoredirect value redirects no drives, including drives connected during the session. redirectclipboard:i:0 makes the local clipboard unavailable in the remote session, and redirectprinters:i:1 redirects the local printers, such as the USB receipt printers, to the session.
    fr: |
      Une valeur drivestoredirect vide ne redirige aucun lecteur, y compris les lecteurs connectés pendant la session. redirectclipboard:i:0 rend le presse-papiers local indisponible dans la session distante, et redirectprinters:i:1 redirige les imprimantes locales, comme les imprimantes de tickets USB, vers la session.
  options:
    a: { en: "DynamicDrives redirects the drives connected after the session starts, such as USB drives plugged in during the session.", fr: "DynamicDrives redirige les lecteurs connectés après le début de la session, comme les lecteurs USB branchés pendant la session." }
    b: { en: "redirectclipboard:i:1 makes the local clipboard available in the session, which allows copying data.", fr: "redirectclipboard:i:1 rend le presse-papiers local disponible dans la session, ce qui permet de copier des données." }
    c: { en: "The asterisk redirects all drives, and redirectprinters:i:0 prevents the receipt printers from being redirected.", fr: "L'astérisque redirige tous les lecteurs, et redirectprinters:i:0 empêche la redirection des imprimantes de tickets." }
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
