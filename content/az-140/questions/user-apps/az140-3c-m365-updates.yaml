id: az140-3c-m365-updates
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP-Office**. The session hosts are created from a custom image in which Microsoft 365 Apps for enterprise was installed with automatic updates disabled, as Microsoft recommends for Azure Virtual Desktop.

    You need to deploy the monthly Microsoft 365 Apps updates. The solution must keep all the session hosts on the same version and must not interrupt users who are working in Office applications.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Office**. Les hôtes de session sont créés à partir d'une image personnalisée dans laquelle Microsoft 365 Apps for enterprise a été installé avec les mises à jour automatiques désactivées, comme Microsoft le recommande pour Azure Virtual Desktop.

    Vous devez déployer les mises à jour mensuelles de Microsoft 365 Apps. La solution doit maintenir tous les hôtes de session sur la même version et ne doit pas interrompre les utilisateurs qui travaillent dans des applications Office.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the updates to the custom image and redeploy the session hosts regularly.", fr: "Ajouter les mises à jour à l'image personnalisée et redéployer régulièrement les hôtes de session." } }
    - { id: b, text: { en: "Enable automatic updates in the Office Deployment Tool configuration so that each session host updates itself.", fr: "Activer les mises à jour automatiques dans la configuration de l'Outil de déploiement d'Office pour que chaque hôte de session se mette à jour lui-même." } }
    - { id: c, text: { en: "Let users run the updates from the Account page of each Office application.", fr: "Laisser les utilisateurs lancer les mises à jour depuis la page Compte de chaque application Office." } }
    - { id: d, text: { en: "Install the updates on each session host during business hours with FORCEAPPSHUTDOWN set to TRUE.", fr: "Installer les mises à jour sur chaque hôte de session pendant les heures de travail avec FORCEAPPSHUTDOWN défini sur TRUE." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For Azure Virtual Desktop, Microsoft recommends disabling automatic updates and adding the updates to the custom image, then redeploying the session hosts regularly, or installing them only when no user is signed in. Updating the image keeps every session host on the same build and doesn't touch running sessions.
    fr: |
      Pour Azure Virtual Desktop, Microsoft recommande de désactiver les mises à jour automatiques et d'ajouter les mises à jour à l'image personnalisée, puis de redéployer régulièrement les hôtes de session, ou de les installer seulement quand aucun utilisateur n'est connecté. Mettre à jour l'image garde tous les hôtes sur la même build sans toucher aux sessions en cours.
  options:
    b:
      en: Automatic updates would run on each host at different times, while Office apps are in use, and the hosts would drift apart.
      fr: Les mises à jour automatiques s'exécuteraient sur chaque hôte à des moments différents, pendant l'utilisation des applications Office, et les hôtes divergeraient.
    c:
      en: Users of a shared session host aren't administrators, and the documented configuration hides the update options from them.
      fr: Les utilisateurs d'un hôte de session partagé ne sont pas administrateurs, et la configuration documentée leur masque les options de mise à jour.
    d:
      en: FORCEAPPSHUTDOWN closes the Office applications of signed-in users, which interrupts their work.
      fr: FORCEAPPSHUTDOWN ferme les applications Office des utilisateurs connectés, ce qui interrompt leur travail.
references:
  - title: Install Office on a custom VHD image
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
