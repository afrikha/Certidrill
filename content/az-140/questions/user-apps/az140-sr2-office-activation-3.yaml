id: az140-sr2-office-activation-3
objective: "3.3.5"
type: series_yesno
series: az140-sr2-office-activation
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You install the apps without a licensing property and enable shared computer activation by Group Policy.
  fr: |
    Vous installez les applications sans propriété de licence et activez l'activation d'ordinateurs partagés par stratégie de groupe.
body:
  solution:
    en: |
      The configuration.xml file contains `<Add OfficeClientEdition="64" Channel="MonthlyEnterprise">` with the product `O365ProPlusRetail`, and `<Updates Enabled="FALSE"/>`. It contains no `Property` element. With the current Office administrative template files, you create a GPO linked to the AVD-Pool3 OU that enables **Use shared computer activation** under **Computer Configuration\Policies\Administrative Templates\Microsoft Office 2016 (Machine)\Licensing Settings**, then you restart the session hosts.
    fr: |
      Le fichier configuration.xml contient `<Add OfficeClientEdition="64" Channel="MonthlyEnterprise">` avec le produit `O365ProPlusRetail`, et `<Updates Enabled="FALSE"/>`. Il ne contient aucun élément `Property`. Avec les fichiers de modèles d'administration Office actuels, vous créez un GPO lié à l'UO AVD-Pool3 qui active **Use shared computer activation** sous **Computer Configuration\Policies\Administrative Templates\Microsoft Office 2016 (Machine)\Licensing Settings**, puis vous redémarrez les hôtes de session.
answer: { value: true }
explanation:
  correct:
    en: Shared computer activation can be enabled after installation by Group Policy, without reinstalling Microsoft 365 Apps, provided the device is restarted. Group Policy is supported for Microsoft 365 Apps for enterprise (it isn't for Microsoft 365 Apps for business), and since nobody activated Office on the image, no activation reset is needed. Automatic updates stay disabled by `<Updates Enabled="FALSE"/>`.
    fr: "L'activation d'ordinateurs partagés peut être activée après l'installation par stratégie de groupe, sans réinstaller Microsoft 365 Apps, à condition de redémarrer l'appareil. La stratégie de groupe est prise en charge pour Microsoft 365 Apps for enterprise (elle ne l'est pas pour Microsoft 365 Apps for business) et, puisque personne n'a activé Office sur l'image, aucune réinitialisation de l'activation n'est nécessaire. Les mises à jour automatiques restent désactivées par `<Updates Enabled=\"FALSE\"/>`."
references:
  - title: Overview of shared computer activation for Microsoft 365 Apps
    url: https://learn.microsoft.com/en-us/microsoft-365-apps/licensing-activation/overview-shared-computer-activation
