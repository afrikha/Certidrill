id: az140-cs2b-rdp
objective: "3.2.8"
type: dropdown
caseStudy: az140-cs2b-bellows
difficulty: 1
status: draft
stem:
  en: |
    HP-Labs is in a resource group named RG-AVD. You need to configure the custom RDP properties of HP-Labs to meet the proctored exam requirement.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    HP-Labs se trouve dans un groupe de ressources nommé RG-AVD. Vous devez configurer les propriétés RDP personnalisées de HP-Labs pour respecter l'exigence relative aux examens surveillés.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Update-AzWvdHostPool -ResourceGroupName RG-AVD -Name HP-Labs `
      -CustomRdpProperty "[[drv]];[[clip]];[[cam]];audiocapturemode:i:1"
  slots:
    - id: drv
      options:
        - { id: none, text: "drivestoredirect:s:" }
        - { id: all, text: "drivestoredirect:s:*" }
        - { id: dyn, text: "drivestoredirect:s:DynamicDrives" }
    - id: clip
      options:
        - { id: clip1, text: "redirectclipboard:i:1" }
        - { id: clip0, text: "redirectclipboard:i:0" }
        - { id: print0, text: "redirectprinters:i:0" }
    - id: cam
      options:
        - { id: mtp, text: "devicestoredirect:s:*" }
        - { id: usb, text: "usbdevicestoredirect:s:*" }
        - { id: cams, text: "camerastoredirect:s:*" }
        - { id: camnone, text: "camerastoredirect:s:" }
answer:
  values: { drv: none, clip: clip0, cam: cams }
explanation:
  correct:
    en: |
      An empty drivestoredirect value redirects no drive, and redirectclipboard:i:0 makes the local clipboard unavailable in the session. camerastoredirect:s:* redirects all cameras, and audiocapturemode:i:1, already in the command, redirects the microphones.
    fr: |
      Une valeur drivestoredirect vide ne redirige aucun lecteur, et redirectclipboard:i:0 rend le presse-papiers local indisponible dans la session. camerastoredirect:s:* redirige toutes les caméras, et audiocapturemode:i:1, déjà présent dans la commande, redirige les microphones.
  options:
    all: { en: "The asterisk redirects all local drives, including drives connected later.", fr: "L'astérisque redirige tous les lecteurs locaux, y compris ceux connectés plus tard." }
    dyn: { en: "DynamicDrives redirects the drives that are connected after the session starts.", fr: "DynamicDrives redirige les lecteurs connectés après le début de la session." }
    clip1: { en: "The value 1 makes the local clipboard available in the session.", fr: "La valeur 1 rend le presse-papiers local disponible dans la session." }
    print0: { en: "This property controls printer redirection, not the clipboard.", fr: "Cette propriété contrôle la redirection des imprimantes, pas le presse-papiers." }
    mtp: { en: "devicestoredirect redirects MTP and PTP devices such as digital cameras and phones, not webcams.", fr: "devicestoredirect redirige les appareils MTP et PTP comme les appareils photo numériques et les téléphones, pas les webcams." }
    usb: { en: "usbdevicestoredirect redirects USB devices that high-level redirection does not handle; the dedicated property for webcams is camerastoredirect.", fr: "usbdevicestoredirect redirige les périphériques USB que la redirection de haut niveau ne prend pas en charge ; la propriété dédiée aux webcams est camerastoredirect." }
    camnone: { en: "An empty value redirects no camera.", fr: "Une valeur vide ne redirige aucune caméra." }
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
  - title: Set custom Remote Desktop Protocol (RDP) properties on a host pool in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/customize-rdp-properties
