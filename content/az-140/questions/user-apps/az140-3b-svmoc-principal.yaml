id: az140-3b-svmoc-principal
objective: "3.2.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure Virtual Desktop personal host pool named **hp-dev**. The session hosts are deallocated every evening. You plan to enable Start VM on Connect for hp-dev, and you will assign the **Desktop Virtualization Power On Contributor** role at the subscription scope. The host pool has no managed identity.

    To which security principal should you assign the role?
  fr: |
    Adatum dispose d'un pool d'hôtes personnel Azure Virtual Desktop nommé **hp-dev**. Les hôtes de session sont libérés chaque soir. Vous prévoyez d'activer Start VM on Connect pour hp-dev, et vous attribuerez le rôle **Desktop Virtualization Power On Contributor** à l'étendue de l'abonnement. Le pool d'hôtes n'a pas d'identité managée.

    À quel principal de sécurité devez-vous attribuer le rôle ?
body:
  options:
    - { id: a, text: { en: "The Azure Virtual Desktop service principal", fr: "Le principal de service Azure Virtual Desktop" } }
    - { id: b, text: { en: "The system-assigned managed identity of each session host VM", fr: "L'identité managée affectée par le système de chaque machine virtuelle d'hôte de session" } }
    - { id: c, text: { en: "The group of developers assigned to the desktop application group", fr: "Le groupe des développeurs affectés au groupe d'applications de bureau" } }
    - { id: d, text: { en: "The administrator account that enables the feature", fr: "Le compte d'administrateur qui active la fonctionnalité" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure Virtual Desktop service starts the VMs, so the Desktop Virtualization Power On Contributor role goes to the Azure Virtual Desktop service principal (or to a managed identity assigned to the host pool), at a scope that contains the session host VMs.
    fr: |
      C'est le service Azure Virtual Desktop qui démarre les machines virtuelles : le rôle Desktop Virtualization Power On Contributor va au principal de service Azure Virtual Desktop (ou à une identité managée affectée au pool d'hôtes), à une étendue qui contient les machines virtuelles des hôtes de session.
  options:
    c: { en: "Users need only their application group assignment; they don't start the VMs themselves.", fr: "Les utilisateurs n'ont besoin que de leur affectation au groupe d'applications ; ce ne sont pas eux qui démarrent les machines virtuelles." }
    b: { en: "A deallocated VM can't start itself; the start request comes from the Azure Virtual Desktop service.", fr: "Une machine virtuelle libérée ne peut pas se démarrer elle-même ; la demande de démarrage vient du service Azure Virtual Desktop." }
    d: { en: "The administrator needs Desktop Virtualization Host Pool Contributor to enable the setting, but the start operations are performed by the service.", fr: "L'administrateur a besoin de Desktop Virtualization Host Pool Contributor pour activer le paramètre, mais les démarrages sont effectués par le service." }
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
