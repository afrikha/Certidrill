id: az140-3a-odfc-concurrent
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip has two host pools that use the same third-party roaming profile solution and the same FSLogix ODFC container share:

    | Host pool | Published resources |
    | --- | --- |
    | HP-Desk | Full desktops |
    | HP-Apps | RemoteApp applications, including Outlook |

    Users often have a session open in both host pools at the same time. Outlook runs in Cached Exchange Mode in both host pools, and OneDrive isn't installed on the session hosts.

    You need to ensure that each user can attach the ODFC container in both host pools at the same time.

    What should you configure on the session hosts of both host pools?
  fr: |
    Wingtip dispose de deux pools d'hôtes qui utilisent la même solution tierce de profils itinérants et le même partage de conteneurs ODFC FSLogix :

    | Pool d'hôtes | Ressources publiées |
    | --- | --- |
    | HP-Desk | Bureaux complets |
    | HP-Apps | Applications RemoteApp, dont Outlook |

    Les utilisateurs ont souvent une session ouverte dans les deux pools d'hôtes en même temps. Outlook s'exécute en mode Exchange mis en cache dans les deux pools d'hôtes, et OneDrive n'est pas installé sur les hôtes de session.

    Vous devez faire en sorte que chaque utilisateur puisse attacher le conteneur ODFC dans les deux pools d'hôtes en même temps.

    Que devez-vous configurer sur les hôtes de session des deux pools d'hôtes ?
body:
  options:
    - id: a
      text:
        en: |-
          Set VHDAccessMode to 1 in the ODFC settings
        fr: |-
          Définir VHDAccessMode sur 1 dans les paramètres ODFC
    - id: b
      text:
        en: |-
          Set VHDAccessMode to 2 in the ODFC settings
        fr: |-
          Définir VHDAccessMode sur 2 dans les paramètres ODFC
    - id: c
      text:
        en: |-
          Set VHDAccessMode to 3 in the ODFC settings
        fr: |-
          Définir VHDAccessMode sur 3 dans les paramètres ODFC
    - id: d
      text:
        en: |-
          Set ProfileType to 3 in the profile container settings
        fr: |-
          Définir ProfileType sur 3 dans les paramètres du conteneur de profil
answer: { optionId: c }
explanation:
  correct:
    en: |-
      VHDAccessMode 3 gives each concurrent session its own ODFC VHD(x), which can persist for later sessions (NumSessionVHDsToKeep controls how many). When the ODFC container is used with Outlook in cached mode, only VHDAccessMode 0 or 3 is supported, and 0 allows a single session. All the sessions that use the container must have the same VHDAccessMode value, so you set it in both host pools.
    fr: |-
      VHDAccessMode 3 donne à chaque session simultanée son propre VHD(x) ODFC, qui peut être conservé pour les sessions suivantes (NumSessionVHDsToKeep en contrôle le nombre). Lorsque le conteneur ODFC est utilisé avec Outlook en mode mis en cache, seules les valeurs 0 et 3 de VHDAccessMode sont prises en charge, et 0 n'autorise qu'une seule session. Toutes les sessions qui utilisent le conteneur doivent avoir la même valeur de VHDAccessMode : vous la définissez donc dans les deux pools d'hôtes.
  options:
    a:
      en: |-
        Mode 1 uses a difference disk on the network for simultaneous access, but it must not be used when the ODFC container serves Outlook in Cached Exchange Mode.
      fr: |-
        Le mode 1 utilise un disque de différenciation sur le réseau pour l'accès simultané, mais il ne doit pas être utilisé lorsque le conteneur ODFC sert Outlook en mode Exchange mis en cache.
    b:
      en: |-
        Mode 2 uses a local difference disk for simultaneous access and has the same restriction with Outlook in Cached Exchange Mode.
      fr: |-
        Le mode 2 utilise un disque de différenciation local pour l'accès simultané et présente la même restriction avec Outlook en mode Exchange mis en cache.
    d:
      en: |-
        ProfileType applies to profile containers, which aren't used here because the third-party solution manages the profile.
      fr: |-
        ProfileType s'applique aux conteneurs de profil, qui ne sont pas utilisés ici puisque la solution tierce gère le profil.
references:
  - title: Configuration Settings
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
