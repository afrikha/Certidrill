id: az140-3a-deploy-updates
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam installed Windows App from the Microsoft Store on some Windows devices and from the standalone MSIX package on others. No update setting has been configured yet.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a installé Windows App depuis le Microsoft Store sur certains appareils Windows et à partir du package MSIX autonome sur d'autres. Aucun paramètre de mise à jour n'a encore été configuré.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          On the devices where Windows App was installed from the Microsoft Store, setting DisableAutomaticUpdates to 1 stops all Windows App updates.
        fr: |-
          Sur les appareils où Windows App a été installé depuis le Microsoft Store, définir DisableAutomaticUpdates sur 1 arrête toutes les mises à jour de Windows App.
    - id: s2
      text:
        en: |-
          On the devices where Windows App was installed from the MSIX package, updates are delivered from a content delivery network (CDN) by default.
        fr: |-
          Sur les appareils où Windows App a été installé à partir du package MSIX, les mises à jour sont fournies par défaut depuis un réseau de distribution de contenu (CDN).
    - id: s3
      text:
        en: |-
          A background task checks for Windows App updates every 8 hours and installs an update only when Windows App is closed.
        fr: |-
          Une tâche en arrière-plan recherche les mises à jour de Windows App toutes les 8 heures et n'installe une mise à jour que lorsque Windows App est fermé.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      You can't disable automatic updates of a Windows App installed from the Microsoft Store; it follows the Microsoft Store update settings, and the DisableAutomaticUpdates registry value applies to MSIX installations. A standalone MSIX installation receives its updates from a CDN by default. In both cases, a background task checks for updates every 8 hours and installs them only when the app is closed.
    fr: |-
      Vous ne pouvez pas désactiver les mises à jour automatiques d'un Windows App installé depuis le Microsoft Store ; il suit les paramètres de mise à jour du Microsoft Store, et la valeur de Registre DisableAutomaticUpdates s'applique aux installations MSIX. Une installation MSIX autonome reçoit par défaut ses mises à jour depuis un CDN. Dans les deux cas, une tâche en arrière-plan recherche les mises à jour toutes les 8 heures et ne les installe que lorsque l'application est fermée.
references:
  - title: Configure Windows App Updates on Windows
    url: https://learn.microsoft.com/en-us/windows-app/configure-updates-windows
