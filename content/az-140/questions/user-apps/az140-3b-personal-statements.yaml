id: az140-3b-personal-statements
objective: "3.2.11"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has two Azure Virtual Desktop personal host pools: **hp-auto** uses the Automatic assignment type and **hp-direct** uses the Direct assignment type. Users are assigned to the desktop application group of each host pool. You manage the host pools with the Azure portal, Azure PowerShell and Azure CLI.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de deux pools d'hôtes personnels Azure Virtual Desktop : **hp-auto** utilise le type d'attribution Automatique et **hp-direct** le type Direct. Les utilisateurs sont affectés au groupe d'applications de bureau de chaque pool d'hôtes. Vous gérez les pools d'hôtes avec le portail Azure, Azure PowerShell et Azure CLI.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In hp-auto, you can assign a user to a specific session host before the user's first connection.
        fr: Dans hp-auto, vous pouvez attribuer un utilisateur à un hôte de session précis avant sa première connexion.
    - id: s2
      text:
        en: In hp-direct, a user who isn't assigned to a session host gets an available session host at first connection.
        fr: Dans hp-direct, un utilisateur qui n'est attribué à aucun hôte de session obtient un hôte de session disponible à sa première connexion.
    - id: s3
      text:
        en: You can reassign a session host of hp-direct to a different user by using Azure CLI.
        fr: Vous pouvez réattribuer un hôte de session de hp-direct à un autre utilisateur avec Azure CLI.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Even with the Automatic assignment type, you can directly assign a user to a session host before the user connects. With Direct, a user assigned only to the application group, not to a session host, gets **No resources available**. Azure CLI can't assign, unassign or reassign personal desktops; use the Azure portal (or PowerShell for direct assignment).
    fr: |
      Même avec le type d'attribution Automatique, vous pouvez attribuer directement un utilisateur à un hôte de session avant qu'il se connecte. Avec Direct, un utilisateur affecté seulement au groupe d'applications, et non à un hôte de session, reçoit **No resources available**. Azure CLI ne permet pas d'attribuer, de retirer ou de réattribuer des bureaux personnels ; utilisez le portail Azure (ou PowerShell pour l'attribution directe).
references:
  - title: Configure personal desktop assignment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
