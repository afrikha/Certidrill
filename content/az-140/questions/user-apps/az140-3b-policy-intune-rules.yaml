id: az140-3b-policy-intune-rules
objective: "3.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Virtual Desktop pooled host pool named **hp-ops**. The session hosts run Windows 11 Enterprise multi-session, are Microsoft Entra joined and are enrolled in Microsoft Intune. You plan the Intune configuration of the session hosts.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-ops**. Les hôtes de session exécutent Windows 11 Entreprise multisession, sont joints à Microsoft Entra et sont inscrits dans Microsoft Intune. Vous planifiez la configuration Intune des hôtes de session.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A settings catalog profile that contains user-scope settings must be assigned to a user group.", fr: "Un profil de catalogue de paramètres qui contient des paramètres d'étendue utilisateur doit être attribué à un groupe d'utilisateurs." } }
    - { id: b, text: { en: "A Win32 app can be assigned with the Available intent so that users install it from the Company Portal.", fr: "Une application Win32 peut être attribuée avec l'intention Disponible pour que les utilisateurs l'installent depuis le Portail d'entreprise." } }
    - { id: c, text: { en: "A compliance policy must be assigned to a device group that contains the session hosts.", fr: "Une stratégie de conformité doit être attribuée à un groupe d'appareils qui contient les hôtes de session." } }
    - { id: d, text: { en: "Quality updates can be managed with an Update rings for Windows policy.", fr: "Les mises à jour qualité peuvent être gérées avec une stratégie Anneaux de mise à jour pour Windows." } }
    - { id: e, text: { en: "A device-scope profile assigned to a user group applies to every session host that the users sign in to.", fr: "Un profil d'étendue appareil attribué à un groupe d'utilisateurs s'applique à chaque hôte de session auquel les utilisateurs se connectent." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      On Windows Enterprise multi-session, user-based configuration must be assigned to user groups and device-based configuration to device groups; a mismatch reports Error or Not applicable. Compliance policies are device-targeted only, and user-targeted compliance isn't supported.
    fr: |
      Sur Windows Entreprise multisession, la configuration utilisateur doit être attribuée à des groupes d'utilisateurs et la configuration d'appareil à des groupes d'appareils ; une incohérence est signalée en Erreur ou Non applicable. Les stratégies de conformité ciblent uniquement les appareils ; la conformité ciblée sur les utilisateurs n'est pas prise en charge.
  options:
    b: { en: "Apps must install in the system context with the Required or Uninstall intent; Available isn't supported.", fr: "Les applications doivent s'installer dans le contexte système avec l'intention Obligatoire ou Désinstaller ; Disponible n'est pas pris en charge." }
    d: { en: "Update rings for Windows aren't supported; quality update settings come from the settings catalog (Windows Update for Business).", fr: "Les anneaux de mise à jour pour Windows ne sont pas pris en charge ; les paramètres de mises à jour qualité viennent du catalogue de paramètres (Windows Update for Business)." }
    e: { en: "Device-based configuration can't be assigned to users; the setting reports Error or Not applicable.", fr: "La configuration d'appareil ne peut pas être attribuée à des utilisateurs ; le paramètre est signalé en Erreur ou Non applicable." }
references:
  - title: Using Azure Virtual Desktop multi-session with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/fundamentals/azure-virtual-desktop-multi-session
