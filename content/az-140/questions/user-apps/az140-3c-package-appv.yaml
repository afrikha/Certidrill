id: az140-3c-package-appv
objective: "3.3.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has an application packaged for Microsoft Application Virtualization as a file named **LitwareCAD.appv**. You need to deliver the application to Azure Virtual Desktop session hosts by using App attach. The solution must minimize administrative effort.

    What should you do with LitwareCAD.appv before you add it in App attach?
  fr: |
    Litware dispose d'une application empaquetée pour Microsoft Application Virtualization sous la forme d'un fichier nommé **LitwareCAD.appv**. Vous devez fournir l'application à des hôtes de session Azure Virtual Desktop avec App attach. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire de LitwareCAD.appv avant de l'ajouter dans App attach ?
body:
  options:
    - { id: a, text: { en: "Copy the .appv file to an SMB share that the session hosts can read.", fr: "Copier le fichier .appv sur un partage SMB que les hôtes de session peuvent lire." } }
    - { id: b, text: { en: "Expand it into a CIM disk image by using MSIXMGR, then copy the image to an SMB share.", fr: "Le développer dans une image disque CIM avec MSIXMGR, puis copier l'image sur un partage SMB." } }
    - { id: c, text: { en: "Copy the .appv file into a VHDX disk image that you create in Disk Management.", fr: "Copier le fichier .appv dans une image disque VHDX créée dans la Gestion des disques." } }
    - { id: d, text: { en: "Sign the .appv file with a code signing certificate, then expand it into a VHDX image.", fr: "Signer le fichier .appv avec un certificat de signature de code, puis le développer dans une image VHDX." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      App attach supports App-V packages (.appv) in addition to MSIX and Appx. Disk images (CIM, VHDX or VHD) are used for MSIX and Appx packages; an App-V package is stored on the SMB file share as is, and the session hosts read it with their computer accounts.
    fr: |
      App attach prend en charge les packages App-V (.appv) en plus des packages MSIX et Appx. Les images disque (CIM, VHDX ou VHD) servent aux packages MSIX et Appx ; un package App-V est stocké tel quel sur le partage de fichiers SMB, et les hôtes de session le lisent avec leur compte d'ordinateur.
  options:
    b:
      en: MSIXMGR unpacks .msix, .appx and bundle packages; it doesn't take .appv files.
      fr: MSIXMGR décompresse les packages .msix, .appx et les bundles ; il ne prend pas les fichiers .appv.
    c:
      en: Disk images are for MSIX and Appx packages; wrapping the App-V file in a VHDX adds work and isn't the documented format.
      fr: Les images disque servent aux packages MSIX et Appx ; placer le fichier App-V dans un VHDX ajoute du travail et n'est pas le format documenté.
    d:
      en: The code signing requirement applies to MSIX and Appx packages, and MSIXMGR can't expand an App-V file.
      fr: L'exigence de signature de code s'applique aux packages MSIX et Appx, et MSIXMGR ne peut pas développer un fichier App-V.
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
  - title: Add and manage App Attach applications in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-setup
