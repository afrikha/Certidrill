id: az140-3a-trbl-symptoms
objective: "3.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    The help desk at Wingtip receives the following Azure Virtual Desktop client issues.

    Which action should you take to resolve each issue? To answer, drag the appropriate actions to the correct issues. Each action may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le support technique de Wingtip reçoit les problèmes suivants concernant les clients Azure Virtual Desktop.

    Quelle action devez-vous effectuer pour résoudre chaque problème ? Pour répondre, faites glisser les actions appropriées vers les problèmes correspondants. Chaque action peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - id: install
      text:
        en: |-
          Install Windows App on the device
        fr: |-
          Installer Windows App sur l'appareil
    - id: fqdn
      text:
        en: |-
          Allow the required FQDNs and endpoints for end-user devices
        fr: |-
          Autoriser les noms de domaine complets (FQDN) et points de terminaison requis pour les appareils des utilisateurs finaux
    - id: cdn
      text:
        en: |-
          Set DisableAutomaticUpdates to 0
        fr: |-
          Définir DisableAutomaticUpdates sur 0
    - id: repair
      text:
        en: |-
          Repair Windows App from Windows Settings
        fr: |-
          Réparer Windows App depuis les Paramètres Windows
    - id: ring
      text:
        en: |-
          Set AdminReleaseRing to 3
        fr: |-
          Définir AdminReleaseRing sur 3
  targets:
    - id: mobile
      text:
        en: |-
          A user opens https://windows.cloud.microsoft in Safari on an iPhone and can't use the web client.
        fr: |-
          Un utilisateur ouvre https://windows.cloud.microsoft dans Safari sur un iPhone et ne peut pas utiliser le client web.
    - id: proxy
      text:
        en: |-
          On new corporate laptops, Windows App can't reach the service because the outbound proxy allows only approved destinations.
        fr: |-
          Sur de nouveaux ordinateurs portables d'entreprise, Windows App ne peut pas joindre le service, car le proxy sortant n'autorise que les destinations approuvées.
    - id: insider
      text:
        en: |-
          On a device with the MSIX package and DisableAutomaticUpdates set to 3, a tester doesn't receive the Insider release of Windows App.
        fr: |-
          Sur un appareil avec le package MSIX et DisableAutomaticUpdates défini sur 3, un testeur ne reçoit pas la version Insider de Windows App.
    - id: broken
      text:
        en: |-
          On a Windows 11 laptop that runs the latest version, Windows App stops opening correctly.
        fr: |-
          Sur un ordinateur portable Windows 11 qui exécute la dernière version, Windows App ne s'ouvre plus correctement.
answer:
  mapping: { mobile: install, proxy: fqdn, insider: cdn, broken: repair }
explanation:
  correct:
    en: |-
      Mobile browsers aren't supported by Windows App on the web, so the iPhone needs the installed Windows App. End-user devices must be able to reach the required Azure Virtual Desktop FQDNs and endpoints. The Insider release isn't available when CDN updates are blocked, which is what the value 3 does. When an up-to-date Windows App misbehaves on Windows, repair the app from Windows Settings.
    fr: |-
      Les navigateurs mobiles ne sont pas pris en charge par Windows App sur le web : l'iPhone a besoin de l'application Windows App installée. Les appareils des utilisateurs finaux doivent pouvoir joindre les FQDN et points de terminaison Azure Virtual Desktop requis. La version Insider n'est pas disponible lorsque les mises à jour depuis le CDN sont bloquées, ce que fait la valeur 3. Lorsqu'un Windows App à jour fonctionne mal sous Windows, réparez l'application depuis les Paramètres Windows.
  options:
    ring:
      en: |-
        AdminReleaseRing set to 3 enforces the Insider ring, but the Insider release still can't be delivered while CDN updates are blocked.
      fr: |-
        AdminReleaseRing défini sur 3 impose l'anneau Insider, mais la version Insider ne peut toujours pas être fournie tant que les mises à jour depuis le CDN sont bloquées.
references:
  - title: Basic troubleshooting for Windows App
    url: https://learn.microsoft.com/en-us/windows-app/troubleshoot-basic
  - title: Configure Windows App Updates on Windows
    url: https://learn.microsoft.com/en-us/windows-app/configure-updates-windows
