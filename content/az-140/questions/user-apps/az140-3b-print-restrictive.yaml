id: az140-3b-print-restrictive
objective: "3.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has two Azure Virtual Desktop host pools named **hp-acct** and **hp-lab**. All the session hosts are enrolled in Microsoft Intune and are members of a device group named **SG-All-Hosts**. The hp-acct session hosts are also members of a device group named **SG-Acct-Hosts**.

    An Intune settings catalog profile that sets **Do not allow client printer redirection** to **Enabled** is assigned to SG-All-Hosts. The RDP properties of hp-acct contain `redirectprinters:i:1`.

    Accounting users report that their local printers don't appear in their hp-acct sessions, even after they reconnect. You need to enable printer redirection for hp-acct. Printer redirection must remain blocked on hp-lab.

    What should you do?
  fr: |
    Contoso dispose de deux pools d'hôtes Azure Virtual Desktop nommés **hp-acct** et **hp-lab**. Tous les hôtes de session sont inscrits dans Microsoft Intune et membres d'un groupe d'appareils nommé **SG-All-Hosts**. Les hôtes de session de hp-acct sont aussi membres d'un groupe d'appareils nommé **SG-Acct-Hosts**.

    Un profil de catalogue de paramètres Intune qui définit **Do not allow client printer redirection** sur **Enabled** est attribué à SG-All-Hosts. Les propriétés RDP de hp-acct contiennent `redirectprinters:i:1`.

    Les utilisateurs de la comptabilité signalent que leurs imprimantes locales n'apparaissent pas dans leurs sessions hp-acct, même après une reconnexion. Vous devez activer la redirection d'imprimante pour hp-acct. La redirection d'imprimante doit rester bloquée sur hp-lab.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `SmartRawPrinters:s:*` to the RDP properties of hp-acct.", fr: "Ajouter `SmartRawPrinters:s:*` aux propriétés RDP de hp-acct." } }
    - { id: b, text: { en: "Install the drivers of the users' printers on the hp-acct session hosts.", fr: "Installer les pilotes des imprimantes des utilisateurs sur les hôtes de session de hp-acct." } }
    - { id: c, text: { en: "Exclude SG-Acct-Hosts from the assignment of the Intune profile.", fr: "Exclure SG-Acct-Hosts de l'attribution du profil Intune." } }
    - { id: d, text: { en: "Set the `DisablePrinterRedirection` registry value to 0 on the accounting users' devices.", fr: "Définir la valeur de Registre `DisablePrinterRedirection` sur 0 sur les appareils des utilisateurs de la comptabilité." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When printer redirection is configured in several places, the most restrictive setting wins, so the session host policy blocks redirection whatever the host pool RDP property says. Excluding the hp-acct device group from the profile assignment removes the block on those session hosts only, and the `redirectprinters:i:1` property then applies.
    fr: |
      Quand la redirection d'imprimante est configurée à plusieurs endroits, le paramètre le plus restrictif l'emporte : la stratégie de l'hôte de session bloque la redirection quelle que soit la propriété RDP du pool d'hôtes. Exclure le groupe d'appareils de hp-acct de l'attribution du profil supprime le blocage sur ces seuls hôtes de session, et la propriété `redirectprinters:i:1` s'applique alors.
  options:
    a: { en: "SmartRawPrinters enables RAW printing for printers that are already redirected; it can't override a policy that blocks redirection.", fr: "SmartRawPrinters active l'impression RAW pour des imprimantes déjà redirigées ; il ne peut pas outrepasser une stratégie qui bloque la redirection." }
    b: { en: "Redirected printers use the Remote Desktop Easy Print driver; drivers on the session hosts don't lift the policy.", fr: "Les imprimantes redirigées utilisent le pilote Remote Desktop Easy Print ; des pilotes sur les hôtes de session ne lèvent pas la stratégie." }
    d: { en: "The local registry value isn't the cause: the session host policy still blocks redirection.", fr: "La valeur de Registre locale n'est pas en cause : la stratégie de l'hôte de session bloque toujours la redirection." }
references:
  - title: Configure printer redirection over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-printers
