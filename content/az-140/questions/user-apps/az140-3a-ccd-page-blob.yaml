id: az140-3a-ccd-page-blob
objective: "3.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are configuring FSLogix Cloud Cache on the session hosts of a pooled host pool named **HP-Media**. The profiles must be written to two storage providers:

    - The Azure Files share `\\stmediaprof.file.core.windows.net\profiles`.
    - An Azure page blob storage account whose connection string you stored in the credential manager of each session host by using the frx utility, under the key name **mediablob**.

    The connection string of the page blob account must never be stored in plain text.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez FSLogix Cloud Cache sur les hôtes de session d'un pool d'hôtes partagé nommé **HP-Media**. Les profils doivent être écrits vers deux fournisseurs de stockage :

    - Le partage Azure Files `\\stmediaprof.file.core.windows.net\profiles`.
    - Un compte de stockage d'objets blob de pages Azure dont vous avez stocké la chaîne de connexion dans le gestionnaire d'informations d'identification de chaque hôte de session à l'aide de l'utilitaire frx, sous le nom de clé **mediablob**.

    La chaîne de connexion du compte d'objets blob de pages ne doit jamais être stockée en texte clair.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $ccd = 'type=[[t1]],name="AZURE FILES",connectionString=\\stmediaprof.file.core.windows.net\profiles;type=[[t2]],name="PAGE BLOB",connectionString=[[cs]]'
    New-ItemProperty -Path HKLM:\SOFTWARE\FSLogix\Profiles\ -Name CCDLocations -PropertyType string -Value $ccd -Force
  slots:
    - id: t1
      options:
        - { id: smb, text: smb }
        - { id: smbup, text: SMB }
        - { id: files, text: azurefiles }
    - id: t2
      options:
        - { id: azure, text: azure }
        - { id: blob, text: blob }
        - { id: pageblob, text: pageblob }
    - id: cs
      options:
        - id: key
          text: '"|fslogix/mediablob|"'
        - id: plain
          text: '"DefaultEndpointsProtocol=https;AccountName=stmediablob;AccountKey=<key>"'
        - id: url
          text: '"https://stmediablob.blob.core.windows.net/profiles"'
answer:
  values: { t1: smb, t2: azure, cs: key }
explanation:
  correct:
    en: |-
      CCDLocations accepts only the types smb and azure, and its parameters and values are case sensitive, so SMB in capitals is incorrect. For an azure provider, the connectionString must contain the name of the protected key in the form |fslogix/key-name|, so the connection string itself is never written in the registry.
    fr: |-
      CCDLocations n'accepte que les types smb et azure, et ses paramètres et valeurs respectent la casse ; SMB en majuscules est donc incorrect. Pour un fournisseur azure, connectionString doit contenir le nom de la clé protégée sous la forme |fslogix/nom-de-clé|, afin que la chaîne de connexion elle-même ne soit jamais écrite dans le Registre.
  options:
    t1:
      en: |-
        Values are case sensitive (smb, not SMB), and azurefiles isn't a provider type; Azure Files is reached as an smb provider.
      fr: |-
        Les valeurs respectent la casse (smb, pas SMB), et azurefiles n'est pas un type de fournisseur ; Azure Files est utilisé comme fournisseur smb.
    t2:
      en: |-
        Azure page blob providers use the type azure; blob and pageblob aren't valid types.
      fr: |-
        Les fournisseurs d'objets blob de pages Azure utilisent le type azure ; blob et pageblob ne sont pas des types valides.
    cs:
      en: |-
        A plain-text connection string must not be used for page blob providers, and a blob URL isn't a supported connection string.
      fr: |-
        Une chaîne de connexion en texte clair ne doit pas être utilisée pour les fournisseurs d'objets blob de pages, et une URL de blob n'est pas une chaîne de connexion prise en charge.
references:
  - title: Configuration Settings
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
  - title: "Tutorial: Configure profile containers with Cloud Cache"
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-cloud-cache-containers
