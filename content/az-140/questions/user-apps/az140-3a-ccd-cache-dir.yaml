id: az140-3a-ccd-cache-dir
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The session hosts of a pooled host pool named **HP-Eng** use FSLogix Cloud Cache with two SMB storage providers. The session hosts are non-persistent: a gold image is applied at every boot. Each session host has a Premium SSD data disk mounted as drive E.

    You need the Cloud Cache local cache to be stored on drive E instead of the operating system disk.

    What should you do?
  fr: |
    Les hôtes de session d'un pool d'hôtes partagé nommé **HP-Eng** utilisent FSLogix Cloud Cache avec deux fournisseurs de stockage SMB. Les hôtes de session ne sont pas persistants : une image de référence est appliquée à chaque démarrage. Chaque hôte de session dispose d'un disque de données SSD Premium monté comme lecteur E.

    Vous devez faire en sorte que le cache local de Cloud Cache soit stocké sur le lecteur E plutôt que sur le disque du système d'exploitation.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          In the gold image, set CacheDirectory and ProxyDirectory to E:\FSLogix\Cache under the frxccd and frxccds Parameters keys
        fr: |-
          Dans l'image de référence, définir CacheDirectory et ProxyDirectory sur E:\FSLogix\Cache sous les clés Parameters de frxccd et frxccds
    - id: b
      text:
        en: |-
          In the gold image, set CacheDirectory to E:\FSLogix\Cache under HKLM\SOFTWARE\FSLogix\Profiles
        fr: |-
          Dans l'image de référence, définir CacheDirectory sur E:\FSLogix\Cache sous HKLM\SOFTWARE\FSLogix\Profiles
    - id: c
      text:
        en: |-
          In the gold image, set CacheDirectory to E:\FSLogix\Cache under HKLM\SYSTEM\CurrentControlSet\Services\frxccd\Parameters
        fr: |-
          Dans l'image de référence, définir CacheDirectory sur E:\FSLogix\Cache sous HKLM\SYSTEM\CurrentControlSet\Services\frxccd\Parameters
    - id: d
      text:
        en: |-
          In a Group Policy object linked to the session hosts, set CacheDirectory to E:\FSLogix\Cache under the frxccd Parameters key
        fr: |-
          Dans un objet de stratégie de groupe lié aux hôtes de session, définir CacheDirectory sur E:\FSLogix\Cache sous la clé Parameters de frxccd
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CacheDirectory is a global Cloud Cache setting stored under HKLM\SYSTEM\CurrentControlSet\Services\frxccd\Parameters, with C:\ProgramData\FSLogix\Cache as the default. It is read before Group Policy is applied, so when a gold image is applied at boot it must be set in the image itself.
    fr: |-
      CacheDirectory est un paramètre global de Cloud Cache stocké sous HKLM\SYSTEM\CurrentControlSet\Services\frxccd\Parameters, avec C:\ProgramData\FSLogix\Cache comme valeur par défaut. Il est lu avant l'application de la stratégie de groupe : lorsqu'une image de référence est appliquée au démarrage, il doit donc être défini dans l'image elle-même.
  options:
    a:
      en: |-
        CacheDirectory and ProxyDirectory must never point to the same location, because the proxy file and the cache file have the same name.
      fr: |-
        CacheDirectory et ProxyDirectory ne doivent jamais pointer vers le même emplacement, car le fichier proxy et le fichier de cache portent le même nom.
    b:
      en: |-
        The container-specific key HKLM\SOFTWARE\FSLogix\Profiles holds settings such as CCDLocations, but CacheDirectory belongs to the frxccd service parameters.
      fr: |-
        La clé propre au conteneur HKLM\SOFTWARE\FSLogix\Profiles contient des paramètres comme CCDLocations, mais CacheDirectory appartient aux paramètres du service frxccd.
    d:
      en: |-
        CacheDirectory is set before Group Policy is applied, so you can't rely on Group Policy when a gold image is applied at boot.
      fr: |-
        CacheDirectory est défini avant l'application de la stratégie de groupe : vous ne pouvez pas vous appuyer sur elle lorsqu'une image de référence est appliquée au démarrage.
references:
  - title: Configuration Setting Reference
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
