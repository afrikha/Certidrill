id: az140-cs4a-time-limits
objective: "3.2.9"
type: dropdown
caseStudy: az140-cs4a-woodgrove-bank
difficulty: 2
status: draft
stem:
  en: |
    You create a Group Policy object (GPO) named GPO-AgentSessions. You configure the settings in the **Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits** folder of the GPO.

    You need to meet the session requirement for HP-Agents.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un objet de stratégie de groupe (GPO) nommé GPO-AgentSessions. Vous configurez les paramètres dans le dossier **Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits** du GPO.

    Vous devez satisfaire l'exigence relative aux sessions de HP-Agents.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Setting enabled with a value of 30 minutes: [[idle]]

      Setting enabled with a value of 2 hours: [[disconnected]]

      Link GPO-AgentSessions to: [[link]]
    fr: |
      Paramètre activé avec la valeur 30 minutes : [[idle]]

      Paramètre activé avec la valeur 2 heures : [[disconnected]]

      Lier GPO-AgentSessions à : [[link]]
  slots:
    - id: idle
      options:
        - { id: active, text: Set time limit for active Remote Desktop Services sessions }
        - { id: idle, text: Set time limit for active but idle Remote Desktop Services sessions }
        - { id: disc, text: Set time limit for disconnected sessions }
        - { id: end, text: End session when time limits are reached }
    - id: disconnected
      options:
        - { id: active, text: Set time limit for active Remote Desktop Services sessions }
        - { id: idle, text: Set time limit for active but idle Remote Desktop Services sessions }
        - { id: disc, text: Set time limit for disconnected sessions }
        - { id: end, text: End session when time limits are reached }
    - id: link
      options:
        - { id: staff, text: { en: "The Staff OU", fr: "L'unité d'organisation Staff" } }
        - { id: agents, text: { en: "The AVD-Agents OU", fr: "L'unité d'organisation AVD-Agents" } }
        - { id: analysts, text: { en: "The AVD-Analysts OU", fr: "L'unité d'organisation AVD-Analysts" } }
        - { id: dc, text: { en: "The Domain Controllers OU", fr: "L'unité d'organisation Domain Controllers" } }
answer:
  values: { idle: idle, disconnected: disc, link: agents }
explanation:
  correct:
    en: |
      Set time limit for active but idle Remote Desktop Services sessions disconnects a session that has had no user input for the configured time, after a two-minute warning. Set time limit for disconnected sessions signs out (deletes) disconnected sessions after the limit, which frees capacity on the pooled hosts. Computer Configuration settings apply to the computer objects that the GPO targets, so you link it to the AVD-Agents OU that contains the HP-Agents session hosts.
    fr: |
      Set time limit for active but idle Remote Desktop Services sessions déconnecte une session sans aucune action de l'utilisateur pendant la durée configurée ; l'utilisateur est averti deux minutes avant. Set time limit for disconnected sessions ferme (supprime) les sessions déconnectées une fois la limite atteinte, ce qui libère de la capacité sur les hôtes regroupés. Les paramètres de Computer Configuration s'appliquent aux objets ordinateur ciblés par le GPO : vous le liez donc à l'unité d'organisation AVD-Agents qui contient les hôtes de session de HP-Agents.
  options:
    active: { en: "This setting limits the total duration of an active session even when the user is working, which would interrupt agents during calls.", fr: "Ce paramètre limite la durée totale d'une session active même quand l'utilisateur travaille, ce qui interromprait les conseillers pendant leurs appels." }
    end: { en: "End session when time limits are reached has no duration: it makes the idle and active limits end sessions instead of disconnecting them, which the requirement doesn't want for idle sessions.", fr: "End session when time limits are reached n'a pas de durée : il fait fermer les sessions au lieu de les déconnecter quand les limites d'inactivité et de session active sont atteintes, ce que l'exigence ne veut pas pour les sessions inactives." }
    staff: { en: "The Staff OU contains user accounts; Computer Configuration settings aren't applied to user objects.", fr: "L'unité d'organisation Staff contient des comptes d'utilisateurs ; les paramètres de Computer Configuration ne s'appliquent pas aux objets utilisateur." }
    analysts: { en: "AVD-Analysts contains the HP-Analysts session hosts; the requirement applies to HP-Agents.", fr: "AVD-Analysts contient les hôtes de session de HP-Analysts ; l'exigence s'applique à HP-Agents." }
    dc: { en: "Linking to the Domain Controllers OU would apply the limits to the domain controllers, not to the session hosts.", fr: "Lier le GPO à l'unité d'organisation Domain Controllers appliquerait les limites aux contrôleurs de domaine, pas aux hôtes de session." }
references:
  - title: Policy CSP - ADMX_TerminalServer
    url: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-terminalserver
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
