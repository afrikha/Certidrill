id: az140-3a-fsl-rec-third-party
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses a third-party roaming profile solution for the users of a pooled host pool named **HP-Sales**. The solution must remain in place for all profile data.

    Users complain that Outlook rebuilds its OST file and that OneDrive resynchronizes every time they sign in to a different session host. You need to make the Microsoft 365 app data available on any session host. The solution must minimize changes to the existing profile solution.

    What should you recommend?
  fr: |
    Fabrikam utilise une solution tierce de profils itinérants pour les utilisateurs d'un pool d'hôtes partagé nommé **HP-Sales**. Cette solution doit rester en place pour toutes les données de profil.

    Les utilisateurs se plaignent qu'Outlook reconstruit son fichier OST et que OneDrive se resynchronise chaque fois qu'ils se connectent à un autre hôte de session. Vous devez rendre les données des applications Microsoft 365 disponibles sur n'importe quel hôte de session. La solution doit réduire au minimum les modifications de la solution de profils existante.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure FSLogix profile containers and remove the third-party solution from the session hosts
        fr: |-
          Configurer des conteneurs de profil FSLogix et retirer la solution tierce des hôtes de session
    - id: b
      text:
        en: |-
          Configure FSLogix Cloud Cache for profile containers alongside the third-party solution
        fr: |-
          Configurer FSLogix Cloud Cache pour des conteneurs de profil en parallèle de la solution tierce
    - id: c
      text:
        en: |-
          Configure an FSLogix ODFC container and exclude the folders it manages from the third-party solution
        fr: |-
          Configurer un conteneur ODFC FSLogix et exclure de la solution tierce les dossiers qu'il gère
    - id: d
      text:
        en: |-
          Configure an FSLogix redirection rule that moves the Outlook and OneDrive folders to a network share
        fr: |-
          Configurer une règle de redirection FSLogix qui déplace les dossiers Outlook et OneDrive vers un partage réseau
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The ODFC container stores only Microsoft 365 app data (Outlook, OneDrive, Office activation...) in a VHD(x) and is the recommended way to pair FSLogix with a third-party roaming profile solution. The folders that ODFC manages must be excluded from the third-party solution so that both don't roam the same data.
    fr: |-
      Le conteneur ODFC ne stocke que les données des applications Microsoft 365 (Outlook, OneDrive, activation d'Office...) dans un VHD(x) ; c'est la façon recommandée d'associer FSLogix à une solution tierce de profils itinérants. Les dossiers gérés par ODFC doivent être exclus de la solution tierce afin que les deux ne fassent pas suivre les mêmes données.
  options:
    a:
      en: |-
        Replacing the third-party solution contradicts the requirement to keep it for all profile data.
      fr: |-
        Remplacer la solution tierce contredit l'exigence de la conserver pour toutes les données de profil.
    b:
      en: |-
        Cloud Cache is a resiliency layer for profile or ODFC containers; a profile container would conflict with the third-party solution, which manages the whole profile.
      fr: |-
        Cloud Cache est une couche de résilience pour les conteneurs de profil ou ODFC ; un conteneur de profil entrerait en conflit avec la solution tierce, qui gère tout le profil.
    d:
      en: |-
        Redirection rules move non-profile data into the profile container; they don't provide a roaming disk for Outlook and OneDrive caches on their own.
      fr: |-
        Les règles de redirection déplacent des données hors profil vers le conteneur de profil ; elles ne fournissent pas à elles seules de disque itinérant pour les caches Outlook et OneDrive.
references:
  - title: Configure ODFC containers
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-odfc-containers
  - title: Types of containers
    url: https://learn.microsoft.com/en-us/fslogix/concepts-container-types
