id: az140-3b-policy-join-tool
objective: "3.2.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso has the following Azure Virtual Desktop host pools. All the session hosts run Windows 11 Enterprise multi-session.

    | Host pool | Session host identity | Intune enrollment |
    | --- | --- | --- |
    | HP1 | Microsoft Entra joined | Enrolled when the session hosts were created |
    | HP2 | Joined to a Microsoft Entra Domain Services managed domain | Not enrolled |
    | HP3 | Microsoft Entra hybrid joined (AD DS domain) | Enrolled by Group Policy with device credentials |

    You need to identify which tools you can use to configure the session host settings of each host pool.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose des pools d'hôtes Azure Virtual Desktop suivants. Tous les hôtes de session exécutent Windows 11 Entreprise multisession.

    | Pool d'hôtes | Identité des hôtes de session | Inscription Intune |
    | --- | --- | --- |
    | HP1 | Joints à Microsoft Entra | Inscrits lors de la création des hôtes de session |
    | HP2 | Joints à un domaine managé Microsoft Entra Domain Services | Non inscrits |
    | HP3 | Joints à Microsoft Entra hybride (domaine AD DS) | Inscrits par stratégie de groupe avec des informations d'identification d'appareil |

    Vous devez identifier les outils que vous pouvez utiliser pour configurer les paramètres des hôtes de session de chaque pool d'hôtes.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      HP1: [[hp1]]

      HP2: [[hp2]]

      HP3: [[hp3]]
    fr: |
      HP1 : [[hp1]]

      HP2 : [[hp2]]

      HP3 : [[hp3]]
  slots:
    - id: hp1
      options:
        - { id: intune, text: { en: "Intune only", fr: "Intune uniquement" } }
        - { id: gpo, text: { en: "Group Policy only", fr: "Stratégie de groupe uniquement" } }
        - { id: both, text: { en: "Intune or Group Policy", fr: "Intune ou stratégie de groupe" } }
    - id: hp2
      options:
        - { id: intune, text: { en: "Intune only", fr: "Intune uniquement" } }
        - { id: gpo, text: { en: "Group Policy only", fr: "Stratégie de groupe uniquement" } }
        - { id: both, text: { en: "Intune or Group Policy", fr: "Intune ou stratégie de groupe" } }
    - id: hp3
      options:
        - { id: intune, text: { en: "Intune only", fr: "Intune uniquement" } }
        - { id: gpo, text: { en: "Group Policy only", fr: "Stratégie de groupe uniquement" } }
        - { id: both, text: { en: "Intune or Group Policy", fr: "Intune ou stratégie de groupe" } }
answer:
  values: { hp1: intune, hp2: gpo, hp3: both }
explanation:
  correct:
    en: |
      Microsoft Entra joined session hosts aren't members of an Active Directory domain, so domain Group Policy doesn't reach them; they are managed with Intune. Session hosts joined to Microsoft Entra Domain Services can't be managed with Intune, so they use Group Policy from the managed domain. Hybrid joined session hosts receive Group Policy from AD DS and, once enrolled with device credentials, Intune policies too.
    fr: |
      Les hôtes de session joints à Microsoft Entra ne sont pas membres d'un domaine Active Directory : la stratégie de groupe du domaine ne les atteint pas, ils sont gérés avec Intune. Les hôtes de session joints à Microsoft Entra Domain Services ne peuvent pas être gérés avec Intune : ils utilisent la stratégie de groupe du domaine managé. Les hôtes joints hybrides reçoivent la stratégie de groupe d'AD DS et, une fois inscrits avec des informations d'identification d'appareil, les stratégies Intune aussi.
references:
  - title: Using Azure Virtual Desktop multi-session with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/fundamentals/azure-virtual-desktop-multi-session
