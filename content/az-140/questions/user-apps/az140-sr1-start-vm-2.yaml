id: az140-sr1-start-vm-2
objective: "3.2.10"
type: series_yesno
series: az140-sr1-start-vm
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You assign Power On Contributor on RG-Dev and enable Start VM on Connect.
  fr: Vous attribuez Power On Contributor sur RG-Dev et activez Start VM on Connect.
body:
  solution:
    en: |
      You assign the **Desktop Virtualization Power On Contributor** role to the Azure Virtual Desktop service principal at the scope of **RG-Dev**. In the properties of HP-Dev, you set **Start VM on connect** to **Yes**.
    fr: |
      Vous attribuez le rôle **Desktop Virtualization Power On Contributor** au principal de service Azure Virtual Desktop à l'étendue de **RG-Dev**. Dans les propriétés de HP-Dev, vous définissez **Start VM on connect** sur **Yes**.
answer: { value: true }
explanation:
  correct:
    en: |
      Start VM on Connect needs the Power On Contributor role for the Azure Virtual Desktop service principal or the host pool managed identity at a scope that contains the host pool and its VMs, and RG-Dev contains both. The role only lets the service start VMs and read their status. For a personal host pool, the feature starts the session host assigned, or assignable, to the user who connects.
    fr: |
      Start VM on Connect exige le rôle Power On Contributor pour le principal de service Azure Virtual Desktop ou l'identité managée du pool d'hôtes, à une étendue qui contient le pool d'hôtes et ses machines virtuelles ; RG-Dev contient les deux. Le rôle permet seulement au service de démarrer les machines virtuelles et de lire leur état. Pour un pool d'hôtes personnel, la fonctionnalité démarre l'hôte de session attribué, ou attribuable, à l'utilisateur qui se connecte.
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
