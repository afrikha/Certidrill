id: az140-3a-fsl-rec-dr-no-recovery
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs a pooled host pool named **HP-East** in the East US region. FSLogix profile containers are stored on an Azure Files share in East US and configured with `VHDLocations`.

    You need to plan disaster recovery to the West US region. The business accepts that users get new, empty profiles after a failover and will be trained for it. The solution must minimize complexity and storage costs during normal operations.

    What should you recommend?
  fr: |
    Litware exploite un pool d'hôtes partagé nommé **HP-East** dans la région East US. Les conteneurs de profil FSLogix sont stockés sur un partage Azure Files dans East US et configurés avec `VHDLocations`.

    Vous devez planifier la reprise d'activité vers la région West US. L'entreprise accepte que les utilisateurs obtiennent de nouveaux profils vides après un basculement et les formera en conséquence. La solution doit réduire au minimum la complexité et les coûts de stockage en fonctionnement normal.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure Cloud Cache on all session hosts with the East US share first and a West US share second in CCDLocations
        fr: |-
          Configurer Cloud Cache sur tous les hôtes de session avec le partage East US en premier et un partage West US en second dans CCDLocations
    - id: b
      text:
        en: |-
          Add a West US share as a second entry in VHDLocations on the East US session hosts
        fr: |-
          Ajouter un partage West US comme seconde entrée de VHDLocations sur les hôtes de session East US
    - id: c
      text:
        en: |-
          Configure object-specific settings that point each user group to a West US share
        fr: |-
          Configurer des paramètres propres aux objets qui orientent chaque groupe d'utilisateurs vers un partage West US
    - id: d
      text:
        en: |-
          Deploy duplicate session hosts and an empty share in West US, kept powered down, with VHDLocations pointing to the West US share
        fr: |-
          Déployer des hôtes de session en double et un partage vide dans West US, laissés arrêtés, avec VHDLocations pointant vers le partage West US
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When profile recovery isn't required, FSLogix documents the simplest disaster recovery design as duplicate infrastructure in the other region that stays powered down until needed. Its session hosts use a standard VHDLocations entry for a local share, and users create new profiles there after a failover, so no profile data is replicated during normal operations.
    fr: |-
      Lorsque la récupération des profils n'est pas requise, FSLogix documente comme conception de reprise d'activité la plus simple une infrastructure dupliquée dans l'autre région, arrêtée jusqu'à ce qu'elle soit nécessaire. Ses hôtes de session utilisent une entrée VHDLocations standard vers un partage local, et les utilisateurs y créent de nouveaux profils après un basculement : aucune donnée de profil n'est répliquée en fonctionnement normal.
  options:
    a:
      en: |-
        Cloud Cache across two regions keeps profile data in both regions, which the business doesn't need, and adds storage cost and local cache overhead on every session host.
      fr: |-
        Cloud Cache sur deux régions conserve les données de profil dans les deux régions, ce dont l'entreprise n'a pas besoin, et ajoute un coût de stockage et la charge du cache local sur chaque hôte de session.
    b:
      en: |-
        A second VHDLocations entry provides no resiliency; if the first share is unreachable, users would silently get new profiles on the remote share while the primary region is still in use.
      fr: |-
        Une seconde entrée VHDLocations n'apporte aucune résilience ; si le premier partage est inaccessible, les utilisateurs obtiendraient silencieusement de nouveaux profils sur le partage distant alors que la région principale est encore utilisée.
    c:
      en: |-
        Object-specific settings send users or groups to different locations during normal operations; they aren't a failover design.
      fr: |-
        Les paramètres propres aux objets envoient des utilisateurs ou des groupes vers des emplacements différents en fonctionnement normal ; ce n'est pas une conception de basculement.
references:
  - title: Configuration Examples
    url: https://learn.microsoft.com/en-us/fslogix/concepts-configuration-examples
