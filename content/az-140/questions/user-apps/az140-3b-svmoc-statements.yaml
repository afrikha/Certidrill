id: az140-3b-svmoc-statements
objective: "3.2.10"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop pooled host pool named **hp-ops** that contains four session hosts with a maximum session limit of 10. The Desktop Virtualization Power On Contributor role is assigned correctly, and Start VM on Connect is enabled. At 07:00, only SH1 is running and it hosts three sessions; the other session hosts are deallocated.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-ops** qui contient quatre hôtes de session avec une limite maximale de 10 sessions. Le rôle Desktop Virtualization Power On Contributor est attribué correctement, et Start VM on Connect est activé. À 07:00, seul SH1 est en cours d'exécution et héberge trois sessions ; les autres hôtes de session sont libérés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a fourth user connects through Windows App at 07:05, Start VM on Connect starts another session host.
        fr: Quand un quatrième utilisateur se connecte avec Windows App à 07:05, Start VM on Connect démarre un autre hôte de session.
    - id: s2
      text:
        en: When the running session hosts reach their session limit, Start VM on Connect starts another session host.
        fr: Quand les hôtes de session en cours d'exécution atteignent leur limite de sessions, Start VM on Connect démarre un autre hôte de session.
    - id: s3
      text:
        en: An administrator who opens a Remote Desktop Connection (mstsc) to the private IP address of a deallocated session host starts it.
        fr: Un administrateur qui ouvre une connexion Bureau à distance (mstsc) vers l'adresse IP privée d'un hôte de session libéré le démarre.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      In a pooled host pool, Start VM on Connect starts a VM only when none is running, and additional VMs only when the running VMs reach their session limit. SH1 still has capacity, so the fourth user lands on SH1. Connecting directly to a session host by name or IP address, outside Azure Virtual Desktop, doesn't start it.
    fr: |
      Dans un pool d'hôtes partagé, Start VM on Connect ne démarre une machine virtuelle que si aucune ne tourne, et d'autres machines virtuelles seulement quand celles qui tournent atteignent leur limite de sessions. SH1 a encore de la capacité : le quatrième utilisateur arrive sur SH1. Se connecter directement à un hôte de session par son nom ou son adresse IP, hors d'Azure Virtual Desktop, ne le démarre pas.
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
