id: az140-3c-appattach-share-access
objective: "3.3.9"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    You have the following Azure Virtual Desktop host pools. Each host pool uses App attach with disk images stored on the SMB share shown in the table.

    | Host pool | Session host join type | Disk image storage |
    | --- | --- | --- |
    | HP-A | Microsoft Entra joined | Azure Files share in a storage account named stappsa |
    | HP-B | Active Directory Domain Services (AD DS) joined | Azure Files share with AD DS authentication in a storage account named stappsb |
    | HP-C | AD DS joined | Azure NetApp Files SMB volume |

    You need to give the session hosts of each host pool read access to the disk images.

    What should you configure for each host pool? To answer, drag the appropriate configurations to the correct host pools. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des pools d'hôtes Azure Virtual Desktop suivants. Chaque pool d'hôtes utilise App attach avec des images disque stockées sur le partage SMB indiqué dans le tableau.

    | Pool d'hôtes | Type de jonction des hôtes de session | Stockage des images disque |
    | --- | --- | --- |
    | HP-A | Joints à Microsoft Entra | Partage Azure Files dans un compte de stockage nommé stappsa |
    | HP-B | Joints à Active Directory Domain Services (AD DS) | Partage Azure Files avec authentification AD DS dans un compte de stockage nommé stappsb |
    | HP-C | Joints à AD DS | Volume SMB Azure NetApp Files |

    Vous devez donner aux hôtes de session de chaque pool d'hôtes un accès en lecture aux images disque.

    Que devez-vous configurer pour chaque pool d'hôtes ? Pour répondre, faites glisser les configurations appropriées vers les pools d'hôtes correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rda, text: { en: "Assign Reader and Data Access on the storage account to the Azure Virtual Desktop and Azure Virtual Desktop ARM Provider service principals", fr: "Attribuer Reader and Data Access sur le compte de stockage aux principaux de service Azure Virtual Desktop et Azure Virtual Desktop ARM Provider" } }
    - { id: smbntfs, text: { en: "Set Storage File Data SMB Share Reader as the default share-level permission and grant NTFS read to the session hosts' computer objects", fr: "Définir Storage File Data SMB Share Reader comme autorisation par défaut au niveau du partage et accorder la lecture NTFS aux objets ordinateur des hôtes de session" } }
    - { id: ntfs, text: { en: "Grant NTFS read to the session hosts' computer objects only", fr: "Accorder uniquement la lecture NTFS aux objets ordinateur des hôtes de session" } }
    - { id: users, text: { en: "Assign Storage File Data SMB Share Contributor on the share to the users who are assigned the packages", fr: "Attribuer Storage File Data SMB Share Contributor sur le partage aux utilisateurs affectés aux packages" } }
    - { id: sac, text: { en: "Assign Storage Account Contributor on the storage account to the session hosts' managed identities", fr: "Attribuer Storage Account Contributor sur le compte de stockage aux identités managées des hôtes de session" } }
  targets:
    - { id: hpa, text: HP-A }
    - { id: hpb, text: HP-B }
    - { id: hpc, text: HP-C }
answer:
  mapping: { hpa: rda, hpb: smbntfs, hpc: ntfs }
explanation:
  correct:
    en: |
      Disk images are mounted by the session hosts, not by the users. For Microsoft Entra joined session hosts with Azure Files, Microsoft Learn says to assign Reader and Data Access to the Azure Virtual Desktop and Azure Virtual Desktop ARM Provider service principals. With AD DS on Azure Files, you set Storage File Data SMB Share Reader as the default share-level permission and give the computer objects NTFS read access. Azure NetApp Files has no Azure RBAC share-level role, so only the NTFS read permission for the computer objects is needed.
    fr: |
      Les images disque sont montées par les hôtes de session, pas par les utilisateurs. Pour des hôtes de session joints à Microsoft Entra avec Azure Files, Microsoft Learn indique d'attribuer Reader and Data Access aux principaux de service Azure Virtual Desktop et Azure Virtual Desktop ARM Provider. Avec AD DS sur Azure Files, vous définissez Storage File Data SMB Share Reader comme autorisation par défaut au niveau du partage et vous accordez aux objets ordinateur la lecture NTFS. Azure NetApp Files n'a pas de rôle Azure RBAC au niveau du partage : seule l'autorisation NTFS de lecture pour les objets ordinateur est nécessaire.
  options:
    users:
      en: Users don't mount the images, and write access isn't needed.
      fr: Les utilisateurs ne montent pas les images, et l'accès en écriture n'est pas nécessaire.
    sac:
      en: Storage Account Contributor is a management role that grants no file data access over SMB.
      fr: Storage Account Contributor est un rôle de gestion qui ne donne aucun accès aux données de fichiers en SMB.
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
