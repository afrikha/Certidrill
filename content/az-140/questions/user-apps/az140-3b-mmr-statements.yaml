id: az140-3b-mmr-statements
objective: "3.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum installs multimedia redirection on the session hosts of an Azure Virtual Desktop host pool named **hp-ops** by using the MSI from Microsoft. Users connect by using Windows App on Windows.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum installe la redirection multimédia sur les hôtes de session d'un pool d'hôtes Azure Virtual Desktop nommé **hp-ops** à l'aide du MSI fourni par Microsoft. Les utilisateurs se connectent avec Windows App sur Windows.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Remote Desktop Multimedia Redirection Service on the session hosts updates itself automatically when Microsoft releases a new version.
        fr: Le service Remote Desktop Multimedia Redirection des hôtes de session se met à jour automatiquement quand Microsoft publie une nouvelle version.
    - id: s2
      text:
        en: Video playback redirection also applies to protected content played in the browser.
        fr: La redirection de la lecture vidéo s'applique aussi au contenu protégé lu dans le navigateur.
    - id: s3
      text:
        en: To redirect video from the internal site training.adatum.com, you add the site to the AllowedVideoRedirectionSites registry value on the session hosts.
        fr: Pour rediriger la vidéo du site interne training.adatum.com, vous ajoutez le site à la valeur de Registre AllowedVideoRedirectionSites sur les hôtes de session.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      The browser extension updates automatically, but the Remote Desktop Multimedia Redirection Service doesn't; you download and install the latest MSI to update it. Protected content isn't supported by video playback redirection and plays with regular playback. Extra sites are added with the AllowedVideoRedirectionSites (or AllowedCallRedirectionSites) value under the extension policy key on the session hosts.
    fr: |
      L'extension de navigateur se met à jour automatiquement, mais pas le service Remote Desktop Multimedia Redirection ; pour le mettre à jour, vous téléchargez et installez le dernier MSI. Le contenu protégé n'est pas pris en charge par la redirection de la lecture vidéo et est lu normalement. Les sites supplémentaires s'ajoutent avec la valeur AllowedVideoRedirectionSites (ou AllowedCallRedirectionSites) sous la clé de stratégie de l'extension sur les hôtes de session.
references:
  - title: Multimedia redirection for video playback and calls in a remote session
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection
