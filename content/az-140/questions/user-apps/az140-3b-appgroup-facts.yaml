id: az140-3b-appgroup-facts
objective: "3.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders creates an Azure Virtual Desktop pooled host pool named **hp-ops** in the Azure portal. You plan the application groups of hp-ops.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders crée un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-ops** dans le portail Azure. Vous planifiez les groupes d'applications de hp-ops.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A RemoteApp application group of hp-ops can also publish applications from another host pool.", fr: "Un groupe d'applications RemoteApp de hp-ops peut aussi publier des applications d'un autre pool d'hôtes." } }
    - { id: b, text: { en: "You can add a second desktop application group to hp-ops for another department.", fr: "Vous pouvez ajouter à hp-ops un second groupe d'applications de bureau pour un autre service." } }
    - { id: c, text: { en: "hp-ops can have several RemoteApp application groups.", fr: "hp-ops peut avoir plusieurs groupes d'applications RemoteApp." } }
    - { id: d, text: { en: "The portal creates a desktop application group named hp-ops-DAG with the host pool.", fr: "Le portail crée un groupe d'applications de bureau nommé hp-ops-DAG avec le pool d'hôtes." } }
    - { id: e, text: { en: "Users connect only if they have the Desktop Virtualization Contributor role on the application group.", fr: "Les utilisateurs ne se connectent que s'ils ont le rôle Desktop Virtualization Contributor sur le groupe d'applications." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      The portal automatically creates a desktop application group named `<hostpoolname>-DAG` with each host pool, which you can delete if you only want RemoteApp. A host pool has only one desktop application group but can have several RemoteApp application groups, for example one per department.
    fr: |
      Le portail crée automatiquement avec chaque pool d'hôtes un groupe d'applications de bureau nommé `<hostpoolname>-DAG`, que vous pouvez supprimer si vous ne voulez que RemoteApp. Un pool d'hôtes n'a qu'un seul groupe d'applications de bureau mais peut avoir plusieurs groupes d'applications RemoteApp, par exemple un par service.
  options:
    b: { en: "A host pool can have only one desktop application group.", fr: "Un pool d'hôtes ne peut avoir qu'un seul groupe d'applications de bureau." }
    a: { en: "An application group belongs to one host pool and publishes applications from its session hosts only.", fr: "Un groupe d'applications appartient à un seul pool d'hôtes et ne publie que des applications de ses hôtes de session." }
    e: { en: "Users need the Desktop Virtualization User role; Desktop Virtualization Contributor is a management role.", fr: "Les utilisateurs ont besoin du rôle Desktop Virtualization User ; Desktop Virtualization Contributor est un rôle de gestion." }
references:
  - title: Preferred application group type behavior for pooled host pools in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/preferred-application-group-type
