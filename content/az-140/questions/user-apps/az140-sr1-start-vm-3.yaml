id: az140-sr1-start-vm-3
objective: "3.2.10"
type: series_yesno
series: az140-sr1-start-vm
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You assign Virtual Machine Contributor to the developers.
  fr: Vous attribuez Virtual Machine Contributor aux développeurs.
body:
  solution:
    en: |
      You assign the **Virtual Machine Contributor** role to the group of developers at the scope of **RG-Dev**. In the properties of HP-Dev, you set **Start VM on connect** to **Yes**.
    fr: |
      Vous attribuez le rôle **Virtual Machine Contributor** au groupe des développeurs à l'étendue de **RG-Dev**. Dans les propriétés de HP-Dev, vous définissez **Start VM on connect** sur **Yes**.
answer: { value: false }
explanation:
  correct:
    en: |
      Start VM on Connect starts VMs with the permissions of the Azure Virtual Desktop service principal or the host pool managed identity, not with those of the user. Without the Power On Contributor role for the service, the VMs don't start, and Virtual Machine Contributor lets the developers manage the VMs, which the requirements forbid.
    fr: |
      Start VM on Connect démarre les machines virtuelles avec les autorisations du principal de service Azure Virtual Desktop ou de l'identité managée du pool d'hôtes, et non avec celles de l'utilisateur. Sans le rôle Power On Contributor pour le service, les machines virtuelles ne démarrent pas, et Virtual Machine Contributor permet aux développeurs de gérer les machines virtuelles, ce que les exigences interdisent.
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
