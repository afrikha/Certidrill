id: az140-3b-print-universal-multisession
objective: "3.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Virtual Desktop pooled host pool named **hp-sales** that contains two session hosts named **SH1** and **SH2**. The session hosts run Windows 11 Enterprise multi-session 24H2, and user profiles are stored in FSLogix profile containers. Users print to office printers by using Universal Print.

    User1 and User2 are signed in to SH1. User1 installs a Universal Print printer named **Printer1**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-sales** qui contient deux hôtes de session nommés **SH1** et **SH2**. Les hôtes de session exécutent Windows 11 Entreprise multisession 24H2, et les profils utilisateur sont stockés dans des conteneurs de profils FSLogix. Les utilisateurs impriment sur les imprimantes du bureau avec l'impression universelle (Universal Print).

    User1 et User2 sont connectés à SH1. User1 installe une imprimante Universal Print nommée **Printer1**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Printer1 is available to User2 on SH1 without User2 installing it.
        fr: Printer1 est disponible pour User2 sur SH1 sans que User2 l'installe.
    - id: s2
      text:
        en: When User1 later signs in to SH2, Printer1 is installed automatically for User1.
        fr: Quand User1 se connecte ensuite à SH2, Printer1 est installée automatiquement pour User1.
    - id: s3
      text:
        en: For the printer search to use the location of the user's device, you enable Location services and Allow location override on the users' local devices.
        fr: Pour que la recherche d'imprimantes utilise l'emplacement de l'appareil de l'utilisateur, vous activez les services de localisation et l'autorisation de remplacement de l'emplacement (Allow location override) sur les appareils locaux des utilisateurs.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      On Windows 11 multi-session 22H2 and later, Universal Print installs printers per user profile, not machine-wide, so User2 doesn't see Printer1. Because the profile roams with FSLogix, printers a user installs on one VM are installed automatically on the other VMs they sign in to. Location-based search uses the connecting device, but Location services and Allow location override must be enabled on all the VMs, not on the local devices.
    fr: |
      Sur Windows 11 multisession 22H2 et versions ultérieures, l'impression universelle installe les imprimantes par profil utilisateur et non pour toute la machine : User2 ne voit donc pas Printer1. Comme le profil suit l'utilisateur avec FSLogix, les imprimantes installées sur une machine virtuelle sont installées automatiquement sur les autres machines virtuelles auxquelles il se connecte. La recherche par emplacement utilise l'appareil de connexion, mais les services de localisation et Allow location override doivent être activés sur toutes les machines virtuelles, pas sur les appareils locaux.
references:
  - title: Universal Print and Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/universal-print/fundamentals/universal-print-avd
