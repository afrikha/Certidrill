id: az140-3b-appdeploy-match
objective: "3.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop pooled host pool named **hp-corp**. The session hosts are created from a custom image. You need to choose how to deliver the applications described in the following table.

    Which method should you use for each application? To answer, drag the appropriate methods to the correct applications. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-corp**. Les hôtes de session sont créés à partir d'une image personnalisée. Vous devez choisir comment distribuer les applications décrites ci-dessous.

    Quelle méthode devez-vous utiliser pour chaque application ? Pour répondre, faites glisser les méthodes appropriées vers les applications correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: image, text: { en: "Install the application in the custom image", fr: "Installer l'application dans l'image personnalisée" } }
    - { id: appattach, text: { en: "App attach", fr: "App attach" } }
    - { id: masking, text: { en: "FSLogix application masking", fr: "Masquage d'applications FSLogix" } }
    - { id: available, text: { en: "Intune app with the Available intent", fr: "Application Intune avec l'intention Disponible" } }
  targets:
    - { id: t1, text: { en: "A security agent that installs a kernel-mode driver and must run for every user", fr: "Un agent de sécurité qui installe un pilote en mode noyau et doit fonctionner pour tous les utilisateurs" } }
    - { id: t2, text: { en: "A sales application packaged as MSIX that only sales users get and that is updated monthly without a new image", fr: "Une application commerciale empaquetée en MSIX que seuls les commerciaux obtiennent et qui est mise à jour chaque mois sans nouvelle image" } }
    - { id: t3, text: { en: "A licensed application already in the image that must be hidden from users who don't have a license", fr: "Une application sous licence déjà présente dans l'image qui doit être masquée pour les utilisateurs sans licence" } }
answer:
  mapping: { t1: image, t2: appattach, t3: masking }
explanation:
  correct:
    en: |
      Components that need drivers and must be present for everyone belong in the image. App attach delivers packaged applications to the users they're assigned to and picks up new versions at sign-in without changing the image. FSLogix application masking uses rule sets to hide installed applications from users or groups who must not see them.
    fr: |
      Les composants qui ont besoin de pilotes et doivent être présents pour tous ont leur place dans l'image. App attach distribue des applications empaquetées aux utilisateurs auxquels elles sont attribuées et prend en compte les nouvelles versions à la connexion sans modifier l'image. Le masquage d'applications FSLogix utilise des ensembles de règles pour cacher les applications installées aux utilisateurs ou groupes qui ne doivent pas les voir.
  options:
    available: { en: "Intune on Windows Enterprise multi-session supports only the Required and Uninstall intents.", fr: "Intune sur Windows Entreprise multisession ne prend en charge que les intentions Obligatoire et Désinstaller." }
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
  - title: "Tutorial: Create and Implement Rule Sets (Application Masking)"
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-application-rule-sets
