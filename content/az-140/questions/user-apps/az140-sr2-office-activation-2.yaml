id: az140-sr2-office-activation-2
objective: "3.3.5"
type: series_yesno
series: az140-sr2-office-activation
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You add the SharedComputerLicensing property to configuration.xml.
  fr: |
    Vous ajoutez la propriété SharedComputerLicensing à configuration.xml.
body:
  solution:
    en: |
      The configuration.xml file contains `<Add OfficeClientEdition="64" Channel="MonthlyEnterprise">` with the product `O365ProPlusRetail`, `<Updates Enabled="FALSE"/>` and `<Property Name="SharedComputerLicensing" Value="1"/>`.
    fr: |
      Le fichier configuration.xml contient `<Add OfficeClientEdition="64" Channel="MonthlyEnterprise">` avec le produit `O365ProPlusRetail`, `<Updates Enabled="FALSE"/>` et `<Property Name="SharedComputerLicensing" Value="1"/>`.
answer: { value: true }
explanation:
  correct:
    en: The `SharedComputerLicensing` property set to 1 enables shared computer activation, which Microsoft 365 E3 supports. Each user then gets a licensing token for each session host when they start an app, and this use doesn't count against the user's device limit. `<Updates Enabled="FALSE"/>` disables automatic updates, as the Azure Virtual Desktop documentation recommends for images that are updated and redeployed.
    fr: "La propriété `SharedComputerLicensing` définie sur 1 active l'activation d'ordinateurs partagés, que Microsoft 365 E3 prend en charge. Chaque utilisateur reçoit alors un jeton de licence pour chaque hôte de session quand il lance une application, et cette utilisation ne compte pas dans sa limite d'appareils. `<Updates Enabled=\"FALSE\"/>` désactive les mises à jour automatiques, comme le recommande la documentation d'Azure Virtual Desktop pour les images mises à jour puis redéployées."
references:
  - title: Install Office on a custom VHD image
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
  - title: Overview of shared computer activation for Microsoft 365 Apps
    url: https://learn.microsoft.com/en-us/microsoft-365-apps/licensing-activation/overview-shared-computer-activation
