id: az140-3a-redir-usb
objective: "3.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a pooled host pool named **HP-Clinic**. Doctors connect from domain-joined Windows 11 devices by using Windows App. A USB signature pad that has no high-level redirection must be usable in the remote sessions. The driver of the signature pad is available to the session hosts.

    The session hosts and the local devices still have the default Windows configuration, and the host pool RDP properties use the default USB setting.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un pool d'hôtes partagé nommé **HP-Clinic**. Les médecins se connectent depuis des appareils Windows 11 joints au domaine à l'aide de Windows App. Une tablette de signature USB qui ne dispose d'aucune redirection de haut niveau doit être utilisable dans les sessions distantes. Le pilote de la tablette de signature est disponible pour les hôtes de session.

    Les hôtes de session et les appareils locaux ont toujours la configuration Windows par défaut, et les propriétés RDP du pool d'hôtes utilisent le paramètre USB par défaut.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          On the session hosts, set **Do not allow supported Plug and Play device redirection** to **Disabled**.
        fr: |-
          Sur les hôtes de session, définir **Do not allow supported Plug and Play device redirection** sur **Disabled**.
    - id: b
      text:
        en: |-
          On the local devices, enable **Allow RDP redirection of other supported RemoteFX USB devices from this computer** by using Group Policy, then restart them.
        fr: |-
          Sur les appareils locaux, activer **Allow RDP redirection of other supported RemoteFX USB devices from this computer** par stratégie de groupe, puis les redémarrer.
    - id: c
      text:
        en: |-
          In the host pool RDP properties, set `usbdevicestoredirect:s:*`.
        fr: |-
          Dans les propriétés RDP du pool d'hôtes, définir `usbdevicestoredirect:s:*`.
    - id: d
      text:
        en: |-
          In the host pool RDP properties, set `devicestoredirect:s:*`.
        fr: |-
          Dans les propriétés RDP du pool d'hôtes, définir `devicestoredirect:s:*`.
    - id: e
      text:
        en: |-
          On the local devices, enable **Allow RDP redirection of other supported RemoteFX USB devices from this computer** by using an Intune settings catalog profile.
        fr: |-
          Sur les appareils locaux, activer **Allow RDP redirection of other supported RemoteFX USB devices from this computer** à l'aide d'un profil de catalogue de paramètres Intune.
    - id: f
      text:
        en: |-
          In the host pool RDP properties, set `redirectcomports:i:1`.
        fr: |-
          Dans les propriétés RDP du pool d'hôtes, définir `redirectcomports:i:1`.
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |-
      Opaque low-level USB redirection must be configured at three points. The session hosts must allow Plug and Play redirection (the Windows default doesn't allow USB redirection), the local Windows devices must allow RDP redirection of other supported RemoteFX USB devices through Group Policy and be restarted, and the host pool property usbdevicestoredirect, empty by default, must redirect the device, for example with *.
    fr: |-
      La redirection USB opaque de bas niveau doit être configurée à trois endroits. Les hôtes de session doivent autoriser la redirection Plug-and-Play (la configuration Windows par défaut n'autorise pas la redirection USB), les appareils Windows locaux doivent autoriser la redirection RDP des autres périphériques USB RemoteFX pris en charge par stratégie de groupe et être redémarrés, et la propriété de pool d'hôtes usbdevicestoredirect, vide par défaut, doit rediriger le périphérique, par exemple avec *.
  options:
    d:
      en: |-
        devicestoredirect controls MTP and PTP peripherals, such as digital cameras, through high-level redirection.
      fr: |-
        devicestoredirect contrôle les périphériques MTP et PTP, comme les appareils photo numériques, par redirection de haut niveau.
    e:
      en: |-
        The setting exists in Intune but doesn't currently work as expected; Microsoft requires Group Policy for it.
      fr: |-
        Le paramètre existe dans Intune mais ne fonctionne pas actuellement comme prévu ; Microsoft exige la stratégie de groupe pour ce paramètre.
    f:
      en: |-
        redirectcomports redirects serial (COM) ports, not USB devices, and it is already 1 by default.
      fr: |-
        redirectcomports redirige les ports série (COM), pas les périphériques USB, et il vaut déjà 1 par défaut.
references:
  - title: Configure USB redirection on Windows over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-usb
