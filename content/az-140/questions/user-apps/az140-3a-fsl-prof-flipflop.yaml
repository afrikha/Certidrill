id: az140-3a-fsl-prof-flipflop
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The session hosts of a pooled host pool named **HP-Legal** have used FSLogix profile containers for a year. The profile share contains one folder per user, named `%sid%_%username%`.

    Yesterday, an administrator added `FlipFlopProfileDirectoryName = 1` to the FSLogix configuration of all the session hosts so that the folders are easier to browse. Today, every user who signs in gets a new, empty profile.

    You need users to get their previous profiles back. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Les hôtes de session d'un pool d'hôtes partagé nommé **HP-Legal** utilisent des conteneurs de profil FSLogix depuis un an. Le partage des profils contient un dossier par utilisateur, nommé `%sid%_%username%`.

    Hier, un administrateur a ajouté `FlipFlopProfileDirectoryName = 1` à la configuration FSLogix de tous les hôtes de session pour que les dossiers soient plus faciles à parcourir. Aujourd'hui, chaque utilisateur qui se connecte obtient un nouveau profil vide.

    Vous devez permettre aux utilisateurs de retrouver leurs profils précédents. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Set SIDDirNamePattern to %sid%_%username% and keep FlipFlopProfileDirectoryName at 1
        fr: |-
          Définir SIDDirNamePattern sur %sid%_%username% et conserver FlipFlopProfileDirectoryName à 1
    - id: b
      text:
        en: |-
          Set DeleteLocalProfileWhenVHDShouldApply to 1 and ask users to sign out and sign in again
        fr: |-
          Définir DeleteLocalProfileWhenVHDShouldApply sur 1 et demander aux utilisateurs de se déconnecter puis de se reconnecter
    - id: c
      text:
        en: |-
          Set NoProfileContainingFolder to 1 so that FSLogix searches the root of the share
        fr: |-
          Définir NoProfileContainingFolder sur 1 pour que FSLogix recherche à la racine du partage
    - id: d
      text:
        en: |-
          Set FlipFlopProfileDirectoryName back to 0 or remove the value from the session hosts
        fr: |-
          Redéfinir FlipFlopProfileDirectoryName sur 0 ou supprimer la valeur sur les hôtes de session
answer: { optionId: d }
explanation:
  correct:
    en: |-
      FlipFlopProfileDirectoryName decides the folder name format that FSLogix uses both to create and to locate containers. After the change, FSLogix looked for `%username%_%sid%` folders, didn't find them and created new ones, but the original containers are untouched in the old folders. Reverting the setting is the documented recovery and makes FSLogix find the existing containers again.
    fr: |-
      FlipFlopProfileDirectoryName détermine le format de nom de dossier que FSLogix utilise à la fois pour créer et pour retrouver les conteneurs. Après la modification, FSLogix a cherché des dossiers `%username%_%sid%`, ne les a pas trouvés et en a créé de nouveaux, mais les conteneurs d'origine sont intacts dans les anciens dossiers. Rétablir le paramètre est la récupération documentée et permet à FSLogix de retrouver les conteneurs existants.
  options:
    a:
      en: |-
        FlipFlopProfileDirectoryName overrides SIDDirNameMatch and SIDDirNamePattern, so the pattern would have no effect while it is set to 1.
      fr: |-
        FlipFlopProfileDirectoryName remplace SIDDirNameMatch et SIDDirNamePattern ; le modèle n'aurait donc aucun effet tant qu'il est défini sur 1.
    b:
      en: |-
        The users don't have local profiles to remove; FSLogix is looking in the wrong folder on the share.
      fr: |-
        Les utilisateurs n'ont pas de profil local à supprimer ; FSLogix cherche dans le mauvais dossier du partage.
    c:
      en: |-
        NoProfileContainingFolder makes FSLogix look for containers at the root of the location without a per-user folder, so it wouldn't find the containers in the existing folders either.
      fr: |-
        NoProfileContainingFolder fait chercher les conteneurs à la racine de l'emplacement sans dossier par utilisateur ; FSLogix ne trouverait pas non plus les conteneurs des dossiers existants.
references:
  - title: Configuration Setting Reference
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
  - title: Configuration Examples
    url: https://learn.microsoft.com/en-us/fslogix/concepts-configuration-examples
