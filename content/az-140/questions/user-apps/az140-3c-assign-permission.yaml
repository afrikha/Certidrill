id: az140-3c-assign-permission
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription that contains a resource group named **RG-AVD**. RG-AVD contains Azure Virtual Desktop host pools, application groups and workspaces.

    An administrator named **Admin1** has the Desktop Virtualization Contributor role on RG-AVD. Admin1 can create application groups and publish applications, but receives an authorization error when adding users or groups on the **Assignments** page of an application group.

    You need to ensure that Admin1 can assign users and groups to the application groups in RG-AVD. The solution must follow the principle of least privilege.

    Which additional role should you assign to Admin1 on RG-AVD?
  fr: |
    Vous disposez d'un abonnement Azure qui contient un groupe de ressources nommé **RG-AVD**. RG-AVD contient des pools d'hôtes, des groupes d'applications et des espaces de travail Azure Virtual Desktop.

    Un administrateur nommé **Admin1** dispose du rôle Desktop Virtualization Contributor sur RG-AVD. Admin1 peut créer des groupes d'applications et publier des applications, mais il reçoit une erreur d'autorisation lorsqu'il ajoute des utilisateurs ou des groupes dans la page **Affectations** d'un groupe d'applications.

    Vous devez faire en sorte qu'Admin1 puisse affecter des utilisateurs et des groupes aux groupes d'applications de RG-AVD. La solution doit respecter le principe du moindre privilège.

    Quel rôle supplémentaire devez-vous attribuer à Admin1 sur RG-AVD ?
body:
  options:
    - { id: a, text: Desktop Virtualization Application Group Contributor }
    - { id: b, text: Desktop Virtualization Host Pool Contributor }
    - { id: c, text: User Access Administrator }
    - { id: d, text: Desktop Virtualization Workspace Contributor }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Assigning users to an application group is an Azure role assignment, which requires the Microsoft.Authorization/roleAssignments/write permission. None of the Desktop Virtualization roles include it, so Microsoft Learn says to add User Access Administrator to the administrator who must manage assignments; it grants access management without granting more rights on the resources.
    fr: |
      Affecter des utilisateurs à un groupe d'applications revient à créer une attribution de rôle Azure, ce qui exige l'autorisation Microsoft.Authorization/roleAssignments/write. Aucun rôle Desktop Virtualization ne la contient : Microsoft Learn indique d'ajouter User Access Administrator à l'administrateur qui doit gérer les affectations ; ce rôle donne la gestion des accès sans donner plus de droits sur les ressources.
  options:
    a: { en: "Application Group Contributor manages application groups but explicitly excludes user and group assignment.", fr: "Application Group Contributor gère les groupes d'applications mais exclut explicitement l'affectation d'utilisateurs et de groupes." }
    b: { en: "Host Pool Contributor manages host pools only and can't create role assignments.", fr: "Host Pool Contributor gère uniquement les pools d'hôtes et ne peut pas créer d'attributions de rôle." }
    d: { en: "Workspace Contributor manages workspaces only and can't create role assignments.", fr: "Workspace Contributor gère uniquement les espaces de travail et ne peut pas créer d'attributions de rôle." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
