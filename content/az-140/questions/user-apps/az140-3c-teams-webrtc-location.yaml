id: az140-3c-teams-webrtc-location
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** that runs new Microsoft Teams. Users connect from Windows devices by using Windows App.

    You plan to install the Remote Desktop WebRTC Redirector Service so that Teams can still use media optimization when a client device can't use SlimCore.

    Where should you install the service?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** qui exécute le nouveau Microsoft Teams. Les utilisateurs se connectent depuis des appareils Windows avec Windows App.

    Vous prévoyez d'installer le service redirecteur WebRTC Bureau à distance (Remote Desktop WebRTC Redirector Service) pour que Teams puisse toujours utiliser l'optimisation des médias quand un appareil client ne peut pas utiliser SlimCore.

    Où devez-vous installer le service ?
body:
  options:
    - { id: a, text: { en: "On each session host of HP1", fr: "Sur chaque hôte de session de HP1" } }
    - { id: b, text: { en: "On each user's Windows device", fr: "Sur l'appareil Windows de chaque utilisateur" } }
    - { id: c, text: { en: "On the file server that stores the FSLogix containers", fr: "Sur le serveur de fichiers qui stocke les conteneurs FSLogix" } }
    - { id: d, text: { en: "On a dedicated virtual machine in the virtual network of HP1", fr: "Sur une machine virtuelle dédiée dans le réseau virtuel de HP1" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Remote Desktop WebRTC Redirector Service is an MSI that you install on each session host, for example in the image or with a management tool. Classic Teams uses it, and Microsoft recommends installing it with new Teams as well, alongside SlimCore, whose components come with new Teams and the client.
    fr: |
      Le service redirecteur WebRTC Bureau à distance est un MSI que vous installez sur chaque hôte de session, par exemple dans l'image ou avec un outil de gestion. Le Teams classique l'utilise, et Microsoft recommande de l'installer aussi avec le nouveau Teams, à côté de SlimCore, dont les composants sont fournis avec le nouveau Teams et le client.
  options:
    b:
      en: The client side of media optimization comes with Windows App; the redirector service runs on the session hosts.
      fr: La partie cliente de l'optimisation des médias est fournie avec Windows App ; le service redirecteur s'exécute sur les hôtes de session.
    c:
      en: The FSLogix file server stores profiles; Teams media isn't processed there.
      fr: Le serveur de fichiers FSLogix stocke les profils ; les médias Teams n'y sont pas traités.
    d:
      en: The service must run on the session host where Teams runs; there is no separate media server for Azure Virtual Desktop.
      fr: Le service doit s'exécuter sur l'hôte de session où Teams s'exécute ; il n'existe pas de serveur multimédia distinct pour Azure Virtual Desktop.
references:
  - title: Use Microsoft Teams on Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/teams-on-avd
