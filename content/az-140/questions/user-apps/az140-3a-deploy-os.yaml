id: az140-3a-deploy-os
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to deploy Windows App to the following Windows devices so that their users can connect to Azure Virtual Desktop.

    | Device | Operating system |
    | --- | --- |
    | DEV1 | Windows 11 Enterprise, version 24H2 |
    | DEV2 | Windows Server 2016 |
    | DEV3 | Windows Server 2022 |
    | DEV4 | Windows 10 Enterprise LTSB 2016 (version 1607) |
    | DEV5 | Windows 8.1 Pro |

    On which two devices can you install Windows App to connect to Azure Virtual Desktop?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de déployer Windows App sur les appareils Windows suivants afin que leurs utilisateurs puissent se connecter à Azure Virtual Desktop.

    | Appareil | Système d'exploitation |
    | --- | --- |
    | DEV1 | Windows 11 Entreprise, version 24H2 |
    | DEV2 | Windows Server 2016 |
    | DEV3 | Windows Server 2022 |
    | DEV4 | Windows 10 Entreprise LTSB 2016 (version 1607) |
    | DEV5 | Windows 8.1 Professionnel |

    Sur quels deux appareils pouvez-vous installer Windows App pour vous connecter à Azure Virtual Desktop ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: DEV1 }
    - { id: b, text: DEV2 }
    - { id: c, text: DEV3 }
    - { id: d, text: DEV4 }
    - { id: e, text: DEV5 }
answer: { optionIds: [ a, c ] }
shuffle: false
explanation:
  correct:
    en: |-
      For Azure Virtual Desktop, Windows App on Windows requires Windows 11, Windows 10 version 1809 or later, or Windows Server 2019 or later, in a version that the manufacturer still supports. DEV1 (Windows 11) and DEV3 (Windows Server 2022) meet the requirement.
    fr: |-
      Pour Azure Virtual Desktop, Windows App sur Windows exige Windows 11, Windows 10 version 1809 ou ultérieure, ou Windows Server 2019 ou version ultérieure, dans une version encore prise en charge par le fabricant. DEV1 (Windows 11) et DEV3 (Windows Server 2022) remplissent la condition.
  options:
    b:
      en: |-
        Windows Server 2016 is earlier than the minimum server version, Windows Server 2019.
      fr: |-
        Windows Server 2016 est antérieur à la version serveur minimale, Windows Server 2019.
    d:
      en: |-
        Windows 10 version 1607 is earlier than the minimum version, 1809.
      fr: |-
        Windows 10 version 1607 est antérieur à la version minimale, 1809.
    e:
      en: |-
        Windows 8.1 isn't a supported operating system for Windows App.
      fr: |-
        Windows 8.1 n'est pas un système d'exploitation pris en charge par Windows App.
references:
  - title: Get started with Windows App
    url: https://learn.microsoft.com/en-us/windows-app/get-started-connect-devices-desktops-apps
