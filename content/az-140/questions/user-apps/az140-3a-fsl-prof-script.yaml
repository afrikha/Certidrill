id: az140-3a-fsl-prof-script
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are preparing a custom image for the session hosts of a pooled host pool named **HP-Finance**. FSLogix is installed in the image.

    You need to configure FSLogix profile containers with the following requirements:

    - Containers are stored on the share `\\stwoodprof.file.core.windows.net\profiles`.
    - New containers use the VHDX format.
    - A container can grow to a maximum of 50 GB.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez une image personnalisée pour les hôtes de session d'un pool d'hôtes partagé nommé **HP-Finance**. FSLogix est installé dans l'image.

    Vous devez configurer des conteneurs de profil FSLogix avec les exigences suivantes :

    - Les conteneurs sont stockés sur le partage `\\stwoodprof.file.core.windows.net\profiles`.
    - Les nouveaux conteneurs utilisent le format VHDX.
    - Un conteneur peut atteindre une taille maximale de 50 Go.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $p = "[[path]]"
    New-ItemProperty -Path $p -Name Enabled -PropertyType dword -Value 1 -Force
    New-ItemProperty -Path $p -Name VHDLocations -PropertyType string -Value "\\stwoodprof.file.core.windows.net\profiles" -Force
    New-ItemProperty -Path $p -Name VolumeType -PropertyType string -Value [[vol]] -Force
    New-ItemProperty -Path $p -Name [[size]] -PropertyType dword -Value 51200 -Force
  slots:
    - id: path
      options:
        - id: prof
          text: 'HKLM:\SOFTWARE\FSLogix\Profiles'
        - id: odfc
          text: 'HKLM:\SOFTWARE\Policies\FSLogix\ODFC'
        - id: hkcu
          text: 'HKCU:\SOFTWARE\FSLogix\Profiles'
        - id: ccd
          text: 'HKLM:\SYSTEM\CurrentControlSet\Services\frxccd\Parameters'
    - id: vol
      options:
        - { id: vhd, text: vhd }
        - { id: vhdx, text: vhdx }
        - { id: dyn, text: dynamic }
    - id: size
      options:
        - { id: dynamic, text: IsDynamic }
        - { id: wait, text: VolumeWaitTimeMS }
        - { id: sizemb, text: SizeInMBs }
answer:
  values: { path: prof, vol: vhdx, size: sizemb }
explanation:
  correct:
    en: |-
      Profile container settings are machine-wide values under HKLM\SOFTWARE\FSLogix\Profiles. VolumeType accepts vhd (the default) or vhdx, and SizeInMBs sets the maximum size of new containers in megabytes (51200 MB is 50 GB; the default is 30000).
    fr: |-
      Les paramètres du conteneur de profil sont des valeurs propres à l'ordinateur sous HKLM\SOFTWARE\FSLogix\Profiles. VolumeType accepte vhd (valeur par défaut) ou vhdx, et SizeInMBs définit la taille maximale des nouveaux conteneurs en mégaoctets (51200 Mo correspondent à 50 Go ; la valeur par défaut est 30000).
  options:
    path:
      en: |-
        HKLM\SOFTWARE\Policies\FSLogix\ODFC holds ODFC container settings, FSLogix settings aren't read from HKCU, and the frxccd Parameters key holds global Cloud Cache settings such as CacheDirectory.
      fr: |-
        HKLM\SOFTWARE\Policies\FSLogix\ODFC contient les paramètres du conteneur ODFC, FSLogix ne lit pas ses paramètres dans HKCU, et la clé Parameters de frxccd contient des paramètres Cloud Cache globaux comme CacheDirectory.
    vol:
      en: |-
        vhd is the default format; dynamic isn't a valid VolumeType value.
      fr: |-
        vhd est le format par défaut ; dynamic n'est pas une valeur valide de VolumeType.
    size:
      en: |-
        IsDynamic only decides whether the disk consumes just the space used (it never lets the disk exceed SizeInMBs), and VolumeWaitTimeMS is how long FSLogix waits for the volume after the attach.
      fr: |-
        IsDynamic décide seulement si le disque n'occupe que l'espace utilisé (il ne lui permet jamais de dépasser SizeInMBs), et VolumeWaitTimeMS est le délai pendant lequel FSLogix attend le volume après l'attachement.
references:
  - title: Configuration Settings
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
  - title: Configure profile containers
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-profile-containers
