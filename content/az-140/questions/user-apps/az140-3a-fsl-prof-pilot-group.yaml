id: az140-3a-fsl-prof-pilot-group
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are piloting FSLogix profile containers on the session hosts of a pooled host pool named **HP-Pilot**. FSLogix is installed and configured with `Enabled` and `VHDLocations`. The local groups created by FSLogix still have their default membership.

    You need FSLogix profile containers to apply only to the members of an Active Directory group named **FSL-Pilot**. Other users must keep their current profiles.

    What should you do on each session host?
  fr: |
    Vous menez un pilote des conteneurs de profil FSLogix sur les hôtes de session d'un pool d'hôtes partagé nommé **HP-Pilot**. FSLogix est installé et configuré avec `Enabled` et `VHDLocations`. Les groupes locaux créés par FSLogix ont toujours leurs membres par défaut.

    Vous devez faire en sorte que les conteneurs de profil FSLogix ne s'appliquent qu'aux membres d'un groupe Active Directory nommé **FSL-Pilot**. Les autres utilisateurs doivent conserver leurs profils actuels.

    Que devez-vous faire sur chaque hôte de session ?
body:
  options:
    - id: a
      text:
        en: |-
          Add FSL-Pilot to FSLogix Profile Include List, then add Everyone to FSLogix Profile Exclude List
        fr: |-
          Ajouter FSL-Pilot à FSLogix Profile Include List, puis ajouter Everyone à FSLogix Profile Exclude List
    - id: b
      text:
        en: |-
          Create an ObjectSpecific key for the SID of FSL-Pilot and set Enabled to 1 in that key
        fr: |-
          Créer une clé ObjectSpecific pour le SID de FSL-Pilot et y définir Enabled sur 1
    - id: c
      text:
        en: |-
          Remove Everyone from FSLogix Profile Include List, then add FSL-Pilot to that group
        fr: |-
          Retirer Everyone de FSLogix Profile Include List, puis ajouter FSL-Pilot à ce groupe
    - id: d
      text:
        en: |-
          Grant only FSL-Pilot the share-level and NTFS permissions on the profile share
        fr: |-
          Accorder les autorisations au niveau du partage et NTFS sur le partage des profils uniquement à FSL-Pilot
answer: { optionId: c }
explanation:
  correct:
    en: |-
      FSLogix creates include and exclude local groups for each container type. The include groups contain Everyone by default and the exclude groups are empty, so you remove Everyone from FSLogix Profile Include List and add the pilot group to limit containers to its members.
    fr: |-
      FSLogix crée des groupes locaux d'inclusion et d'exclusion pour chaque type de conteneur. Les groupes d'inclusion contiennent Everyone par défaut et les groupes d'exclusion sont vides ; vous retirez donc Everyone de FSLogix Profile Include List et y ajoutez le groupe pilote pour limiter les conteneurs à ses membres.
  options:
    a:
      en: |-
        Membership in an exclude group takes precedence over the include group, so excluding Everyone would also exclude the pilot users.
      fr: |-
        L'appartenance à un groupe d'exclusion l'emporte sur le groupe d'inclusion ; exclure Everyone exclurait donc aussi les utilisateurs du pilote.
    b:
      en: |-
        Object-specific settings give users or groups their own values, such as another VHDLocations path; they don't restrict which users receive a container.
      fr: |-
        Les paramètres propres aux objets donnent à des utilisateurs ou des groupes leurs propres valeurs, comme un autre chemin VHDLocations ; ils ne restreignent pas les utilisateurs qui reçoivent un conteneur.
    d:
      en: |-
        Other users would still be processed by FSLogix and fail to attach a container instead of keeping their current profiles.
      fr: |-
        Les autres utilisateurs seraient toujours traités par FSLogix et échoueraient à attacher un conteneur au lieu de conserver leurs profils actuels.
references:
  - title: Local include and exclude groups
    url: https://learn.microsoft.com/en-us/fslogix/concepts-include-exclude-groups
