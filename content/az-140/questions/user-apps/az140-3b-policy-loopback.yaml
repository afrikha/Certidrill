id: az140-3b-policy-loopback
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Active Directory Domain Services (AD DS) domain. The Azure Virtual Desktop session hosts are in an organizational unit (OU) named **AVD-Hosts**. User accounts are in an OU named **Staff**, and the users also sign in to physical Windows 11 PCs that are in an OU named **Workstations**.

    You need to configure a user setting that removes the **Shut down** command from the Start menu. The setting must apply when users sign in to the session hosts, and must not apply on the physical PCs.

    What should you do?
  fr: |
    Fabrikam dispose d'un domaine Active Directory Domain Services (AD DS). Les hôtes de session Azure Virtual Desktop se trouvent dans une unité d'organisation (UO) nommée **AVD-Hosts**. Les comptes d'utilisateur se trouvent dans une UO nommée **Staff**, et les utilisateurs se connectent aussi à des PC Windows 11 physiques situés dans une UO nommée **Workstations**.

    Vous devez configurer un paramètre utilisateur qui supprime la commande **Arrêter** du menu Démarrer. Le paramètre doit s'appliquer quand les utilisateurs se connectent aux hôtes de session, et ne doit pas s'appliquer sur les PC physiques.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure the setting in a GPO linked to Staff.", fr: "Configurer le paramètre dans un GPO lié à Staff." } }
    - { id: b, text: { en: "Configure the setting in a GPO linked to AVD-Hosts, and enable loopback processing in Merge mode in that GPO.", fr: "Configurer le paramètre dans un GPO lié à AVD-Hosts, et activer le traitement en boucle de rappel en mode Fusion dans ce GPO." } }
    - { id: c, text: { en: "Configure the setting in a GPO linked to AVD-Hosts, without loopback processing.", fr: "Configurer le paramètre dans un GPO lié à AVD-Hosts, sans traitement en boucle de rappel." } }
    - { id: d, text: { en: "Configure the setting in a GPO linked to Staff, and filter the GPO to the session host computer accounts.", fr: "Configurer le paramètre dans un GPO lié à Staff, et filtrer le GPO sur les comptes d'ordinateur des hôtes de session." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      User settings normally come from the GPOs linked to the user's OU. Loopback processing in a GPO linked to the session hosts' OU applies the user settings of the GPOs that apply to the computer, so users get the setting only when they sign in to a session host. Merge mode keeps the users' normal user settings and adds the computer-based ones.
    fr: |
      Les paramètres utilisateur viennent normalement des GPO liés à l'UO de l'utilisateur. Le traitement en boucle de rappel dans un GPO lié à l'UO des hôtes de session applique les paramètres utilisateur des GPO qui s'appliquent à l'ordinateur : les utilisateurs n'obtiennent le paramètre que lorsqu'ils se connectent à un hôte de session. Le mode Fusion conserve les paramètres utilisateur habituels et y ajoute ceux liés à l'ordinateur.
  options:
    a: { en: "A GPO linked to the users' OU applies wherever they sign in, including the physical PCs.", fr: "Un GPO lié à l'UO des utilisateurs s'applique partout où ils se connectent, y compris sur les PC physiques." }
    c: { en: "Without loopback processing, user settings in a GPO linked to a computer OU are ignored, because the user accounts aren't in that OU.", fr: "Sans traitement en boucle de rappel, les paramètres utilisateur d'un GPO lié à une UO d'ordinateurs sont ignorés, car les comptes d'utilisateur ne sont pas dans cette UO." }
    d: { en: "Security filtering on computer accounts doesn't make user settings conditional on the computer; users would no longer receive the GPO at all.", fr: "Un filtrage de sécurité sur des comptes d'ordinateur ne rend pas les paramètres utilisateur dépendants de l'ordinateur ; les utilisateurs ne recevraient plus du tout le GPO." }
references:
  - title: Loopback processing of Group Policy
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/loopback-processing-of-group-policy
