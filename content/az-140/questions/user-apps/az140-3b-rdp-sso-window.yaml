id: az140-3b-rdp-sso-window
objective: "3.2.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Virtual Desktop host pool named **hp-design** in a resource group named **rg-avd**. The session hosts are Microsoft Entra joined, and hp-design has no custom RDP properties.

    You need to configure hp-design to meet the following requirements:

    - Users sign in to the session hosts by using single sign-on with Microsoft Entra authentication.
    - The remote desktop opens in a window instead of full screen.
    - Users can use all their local monitors.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-design** dans un groupe de ressources nommé **rg-avd**. Les hôtes de session sont joints à Microsoft Entra, et hp-design n'a aucune propriété RDP personnalisée.

    Vous devez configurer hp-design pour répondre aux exigences suivantes :

    - Les utilisateurs se connectent aux hôtes de session par authentification unique avec l'authentification Microsoft Entra.
    - Le bureau distant s'ouvre dans une fenêtre plutôt qu'en plein écran.
    - Les utilisateurs peuvent utiliser tous leurs écrans locaux.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Update-AzWvdHostPool -Name hp-design -ResourceGroupName rg-avd `
      -[[param]] "[[auth]];[[mode]];use multimon:i:1;"
  slots:
    - id: param
      options:
        - { id: custom, text: CustomRdpProperty }
        - { id: vmtemplate, text: VMTemplate }
        - { id: description, text: Description }
        - { id: friendly, text: FriendlyName }
    - id: auth
      options:
        - { id: targetaad, text: "targetisaadjoined:i:1" }
        - { id: credssp, text: "enablecredsspsupport:i:1" }
        - { id: rdsaad, text: "enablerdsaadauth:i:1" }
        - { id: kdc, text: "kdcproxyname:s:kdc.tailspintoys.com" }
    - id: mode
      options:
        - { id: smart, text: "smart sizing:i:1" }
        - { id: window, text: "screen mode id:i:1" }
        - { id: full, text: "screen mode id:i:2" }
        - { id: dynres, text: "dynamic resolution:i:0" }
answer:
  values: { param: custom, auth: rdsaad, mode: window }
explanation:
  correct:
    en: |
      RDP properties are set with the `-CustomRdpProperty` parameter of `Update-AzWvdHostPool`. `enablerdsaadauth:i:1` uses Microsoft Entra authentication to the session host, which provides single sign-on. `screen mode id:i:1` opens the session in a window; the default value 2 is full screen.
    fr: |
      Les propriétés RDP se définissent avec le paramètre `-CustomRdpProperty` de `Update-AzWvdHostPool`. `enablerdsaadauth:i:1` utilise l'authentification Microsoft Entra vers l'hôte de session, ce qui fournit l'authentification unique. `screen mode id:i:1` ouvre la session dans une fenêtre ; la valeur par défaut 2 correspond au plein écran.
  options:
    vmtemplate: { en: "VMTemplate describes the session host configuration, not the connection properties.", fr: "VMTemplate décrit la configuration des hôtes de session, pas les propriétés de connexion." }
    targetaad: { en: "targetisaadjoined is the older property for Entra joined hosts, replaced by enablerdsaadauth, and doesn't provide single sign-on.", fr: "targetisaadjoined est l'ancienne propriété pour les hôtes joints à Entra, remplacée par enablerdsaadauth, et ne fournit pas l'authentification unique." }
    credssp: { en: "CredSSP is used by default and doesn't enable Microsoft Entra authentication.", fr: "CredSSP est utilisé par défaut et n'active pas l'authentification Microsoft Entra." }
    kdc: { en: "A KDC proxy relays Kerberos authentication; it isn't single sign-on with Microsoft Entra authentication.", fr: "Un proxy KDC relaie l'authentification Kerberos ; ce n'est pas l'authentification unique avec l'authentification Microsoft Entra." }
    smart: { en: "smart sizing scales the session content to the window but doesn't open the session in a window.", fr: "smart sizing met à l'échelle le contenu de la session selon la fenêtre mais n'ouvre pas la session dans une fenêtre." }
    dynres: { en: "dynamic resolution controls whether the resolution follows the window size, not the window mode.", fr: "dynamic resolution indique si la résolution suit la taille de la fenêtre, pas le mode fenêtré." }
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
