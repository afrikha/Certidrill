id: az140-3a-deploy-update-script
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys the standalone MSIX package of Windows App to its Windows devices. The network team blocks downloads from content delivery networks, so Windows App must receive its updates only from the Microsoft Store. Updates must not be disabled.

    You are writing a script that will run as an administrator on each device.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie le package MSIX autonome de Windows App sur ses appareils Windows. L'équipe réseau bloque les téléchargements depuis les réseaux de distribution de contenu : Windows App ne doit donc recevoir ses mises à jour que depuis le Microsoft Store. Les mises à jour ne doivent pas être désactivées.

    Vous écrivez un script qui s'exécutera en tant qu'administrateur sur chaque appareil.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $path = "[[path]]"
    If (!(Test-Path $path)) {
        New-Item -Path $path -Force
    }
    New-ItemProperty -Path $path -Name [[name]] -PropertyType DWORD -Value [[val]] -Force
  slots:
    - id: path
      options:
        - id: hklm
          text: 'HKLM:\SOFTWARE\Microsoft\WindowsApp'
        - id: hkcu
          text: 'HKCU:\SOFTWARE\Microsoft\WindowsApp'
        - id: tsc
          text: 'HKLM:\SOFTWARE\Microsoft\Terminal Server Client'
    - id: name
      options:
        - { id: disable, text: DisableAutomaticUpdates }
        - { id: ring, text: AdminReleaseRing }
        - { id: gov, text: EnableGovernmentNationalCloudSignInOption }
    - id: val
      options:
        - { id: v0, text: "0" }
        - { id: v1, text: "1" }
        - { id: v2, text: "2" }
        - { id: v3, text: "3" }
answer:
  values: { path: hklm, name: disable, val: v3 }
shuffle: false
explanation:
  correct:
    en: |-
      The update behavior of Windows App on Windows is set with the REG_DWORD value DisableAutomaticUpdates under HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\WindowsApp. The value 3 disables updates from the CDN location only, so updates still come from the Microsoft Store.
    fr: |-
      Le comportement de mise à jour de Windows App sur Windows se définit avec la valeur REG_DWORD DisableAutomaticUpdates sous HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\WindowsApp. La valeur 3 désactive uniquement les mises à jour depuis l'emplacement CDN : les mises à jour continuent d'arriver depuis le Microsoft Store.
  options:
    path:
      en: |-
        The setting is machine-wide under HKLM; the Terminal Server Client key holds local redirection settings such as DisableClipboardRedirection.
      fr: |-
        Le paramètre s'applique à l'ordinateur, sous HKLM ; la clé Terminal Server Client contient des paramètres de redirection locaux comme DisableClipboardRedirection.
    name:
      en: |-
        AdminReleaseRing chooses the Public or Insider ring, and EnableGovernmentNationalCloudSignInOption adds a US government sign-in option.
      fr: |-
        AdminReleaseRing choisit l'anneau Public ou Insider, et EnableGovernmentNationalCloudSignInOption ajoute une option de connexion pour le cloud du gouvernement des États-Unis.
    val:
      en: |-
        0 enables updates from all locations, 1 disables updates from all locations, and 2 disables updates from the Microsoft Store.
      fr: |-
        0 active les mises à jour depuis tous les emplacements, 1 les désactive depuis tous les emplacements, et 2 désactive les mises à jour depuis le Microsoft Store.
references:
  - title: Configure Windows App Updates on Windows
    url: https://learn.microsoft.com/en-us/windows-app/configure-updates-windows
