id: az140-3c-onedrive-registry
objective: "3.3.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1**. The session hosts are Microsoft Entra joined and run Windows 11 Enterprise multi-session.

    You plan to install the OneDrive sync app in the session host image and configure it by using registry values under HKEY_LOCAL_MACHINE (HKLM).

    Which registry value should you configure for each requirement? To answer, drag the appropriate values to the correct requirements. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1**. Les hôtes de session sont joints à Microsoft Entra et exécutent Windows 11 Entreprise multisession.

    Vous prévoyez d'installer l'application de synchronisation OneDrive dans l'image des hôtes de session et de la configurer avec des valeurs de Registre sous HKEY_LOCAL_MACHINE (HKLM).

    Quelle valeur de Registre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les valeurs appropriées vers les exigences correspondantes. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: alluser, text: "`AllUsersInstall` = 1 (Software\\Microsoft\\OneDrive)" }
    - { id: silent, text: "`SilentAccountConfig` = 1 (Policies\\Microsoft\\OneDrive)" }
    - { id: kfm, text: "`KFMSilentOptIn` = tenant ID (Policies\\Microsoft\\OneDrive)" }
    - { id: run, text: "`OneDrive` = OneDrive.exe /background (Windows\\CurrentVersion\\Run)" }
    - { id: personal, text: "`DisablePersonalSync` = 1 (Policies\\Microsoft\\OneDrive)" }
  targets:
    - { id: t1, text: { en: "Sign users in to OneDrive automatically with their Windows credentials", fr: "Connecter automatiquement les utilisateurs à OneDrive avec leurs informations d'identification Windows" } }
    - { id: t2, text: { en: "Start OneDrive in every user session", fr: "Démarrer OneDrive dans chaque session utilisateur" } }
    - { id: t3, text: { en: "Prepare the session host for a per-machine installation of the sync app", fr: "Préparer l'hôte de session à une installation par ordinateur de l'application de synchronisation" } }
answer:
  mapping: { t1: silent, t2: run, t3: alluser }
explanation:
  correct:
    en: |
      `SilentAccountConfig` = 1 silently configures the user account with the Windows credentials, which works because the session hosts are connected to Microsoft Entra ID. A `OneDrive` value in the HKLM Run key that starts OneDrive.exe with /background launches the sync app at every sign-in. `AllUsersInstall` = 1 is set before running `OneDriveSetup.exe /allusers` for the per-machine installation.
    fr: |
      `SilentAccountConfig` = 1 configure silencieusement le compte de l'utilisateur avec ses informations d'identification Windows, ce qui fonctionne parce que les hôtes de session sont connectés à Microsoft Entra ID. Une valeur `OneDrive` dans la clé Run de HKLM qui lance OneDrive.exe avec /background démarre l'application de synchronisation à chaque connexion. `AllUsersInstall` = 1 se définit avant d'exécuter `OneDriveSetup.exe /allusers` pour l'installation par ordinateur.
  options:
    kfm:
      en: KFMSilentOptIn moves the Windows known folders to OneDrive; it doesn't sign users in or start the app.
      fr: KFMSilentOptIn déplace les dossiers connus Windows vers OneDrive ; il ne connecte pas les utilisateurs et ne démarre pas l'application.
    personal:
      en: DisablePersonalSync blocks personal Microsoft accounts; it doesn't meet any of the requirements.
      fr: DisablePersonalSync bloque les comptes Microsoft personnels ; il ne répond à aucune des exigences.
references:
  - title: Install Office on a custom VHD image
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
  - title: Use the sync app on virtual desktops
    url: https://learn.microsoft.com/en-us/sharepoint/sync-vdi-support
