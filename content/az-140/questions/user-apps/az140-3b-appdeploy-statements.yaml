id: az140-3b-appdeploy-statements
objective: "3.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to deliver applications to an Azure Virtual Desktop pooled host pool named **hp-ops** by using App attach. The session hosts are joined to an Active Directory Domain Services (AD DS) domain.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de distribuer des applications à un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-ops** avec App attach. Les hôtes de session sont joints à un domaine Active Directory Domain Services (AD DS).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user receives an App attach application only if the user is also assigned to a desktop or RemoteApp application group of hp-ops.
        fr: Un utilisateur ne reçoit une application App attach que s'il est aussi affecté à un groupe d'applications de bureau ou RemoteApp de hp-ops.
    - id: s2
      text:
        en: Two versions of the same application can run concurrently on the same session host for different users.
        fr: Deux versions d'une même application peuvent s'exécuter simultanément sur le même hôte de session pour des utilisateurs différents.
    - id: s3
      text:
        en: When you update an App attach application in place, users who are signed in get the new version immediately in their current session.
        fr: Quand vous mettez à jour sur place une application App attach, les utilisateurs connectés obtiennent immédiatement la nouvelle version dans leur session en cours.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Three conditions apply at sign-in: the application is assigned to the host pool, the user is in a desktop or RemoteApp application group of the host pool, and the application is assigned to the user or a group. App attach lets users run several versions of the same application concurrently on the same session host. After an update, users get the new version at their next sign-in, not in their current session.
    fr: |
      Trois conditions s'appliquent à la connexion : l'application est attribuée au pool d'hôtes, l'utilisateur fait partie d'un groupe d'applications de bureau ou RemoteApp du pool d'hôtes, et l'application est attribuée à l'utilisateur ou à un groupe. App attach permet aux utilisateurs d'exécuter plusieurs versions d'une même application simultanément sur le même hôte de session. Après une mise à jour, les utilisateurs obtiennent la nouvelle version à leur connexion suivante, pas dans leur session en cours.
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
