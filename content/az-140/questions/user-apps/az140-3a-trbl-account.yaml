id: az140-3a-trbl-account
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Contoso employee installs Windows App on a home Windows 11 computer. The employee is assigned to a desktop application group under the work account `megan@contoso.com`.

    When the employee tries to subscribe in Windows App with the personal account `megan.b@outlook.com`, the sign-in fails.

    What should you instruct the employee to do?
  fr: |
    Une employée de Contoso installe Windows App sur un ordinateur Windows 11 personnel. Elle est attribuée à un groupe d'applications de bureau avec son compte professionnel `megan@contoso.com`.

    Lorsqu'elle essaie de s'abonner dans Windows App avec le compte personnel `megan.b@outlook.com`, la connexion échoue.

    Que devez-vous demander à l'employée de faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Sign in to Windows App with the work account megan@contoso.com
        fr: |-
          Se connecter à Windows App avec le compte professionnel megan@contoso.com
    - id: b
      text:
        en: |-
          Reinstall Windows App from the standalone MSIX package and sign in again
        fr: |-
          Réinstaller Windows App à partir du package MSIX autonome et se connecter de nouveau
    - id: c
      text:
        en: |-
          Sign in with the personal account in Windows App in a web browser instead
        fr: |-
          Se connecter plutôt avec le compte personnel dans Windows App dans un navigateur web
    - id: d
      text:
        en: |-
          Repair Windows App from Windows Settings and sign in again with the same account
        fr: |-
          Réparer Windows App depuis les Paramètres Windows et se reconnecter avec le même compte
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Signing in to Windows App to reach Azure Virtual Desktop requires a Microsoft work or school account provided by the administrator; a personal Microsoft account (MSA) isn't accepted. The resources are assigned to the work account, so the employee must sign in with it.
    fr: |-
      La connexion à Windows App pour accéder à Azure Virtual Desktop exige un compte professionnel ou scolaire Microsoft fourni par l'administrateur ; un compte Microsoft personnel (MSA) n'est pas accepté. Les ressources sont attribuées au compte professionnel : l'employée doit donc se connecter avec celui-ci.
  options:
    b:
      en: |-
        The installation method doesn't change which account types Windows App accepts.
      fr: |-
        La méthode d'installation ne modifie pas les types de comptes acceptés par Windows App.
    c:
      en: |-
        The web version of Windows App has the same requirement for a work or school account.
      fr: |-
        La version web de Windows App a la même exigence d'un compte professionnel ou scolaire.
    d:
      en: |-
        The app isn't damaged; the account type is the cause of the failure.
      fr: |-
        L'application n'est pas endommagée ; c'est le type de compte qui cause l'échec.
references:
  - title: What is Windows App?
    url: https://learn.microsoft.com/en-us/windows-app/overview
