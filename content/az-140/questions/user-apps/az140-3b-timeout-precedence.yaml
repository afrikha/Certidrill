id: az140-3b-timeout-precedence
objective: "3.2.9"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Virtual Desktop pooled host pool named **hp-retail**. The session hosts are domain-joined. Two GPOs apply, with the following **Session Time Limits** settings:

    | GPO | Linked to | Settings |
    | --- | --- | --- |
    | GPO-Hosts | OU of the session hosts | Computer Configuration: **Set time limit for active but idle Remote Desktop Services sessions** = 1 hour; **Set time limit for disconnected sessions** = 2 hours |
    | GPO-Sales | OU of the sales users | User Configuration: **Set time limit for active but idle Remote Desktop Services sessions** = 30 minutes |

    **End session when time limits are reached** isn't configured anywhere. A sales user named User1 stops using the session at 09:00, ignores the warning and doesn't come back.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-retail**. Les hôtes de session sont joints au domaine. Deux GPO s'appliquent, avec les paramètres **Session Time Limits** suivants :

    | GPO | Lié à | Paramètres |
    | --- | --- | --- |
    | GPO-Hosts | UO des hôtes de session | Configuration ordinateur : **Set time limit for active but idle Remote Desktop Services sessions** = 1 heure ; **Set time limit for disconnected sessions** = 2 heures |
    | GPO-Sales | UO des utilisateurs commerciaux | Configuration utilisateur : **Set time limit for active but idle Remote Desktop Services sessions** = 30 minutes |

    **End session when time limits are reached** n'est configuré nulle part. Un commercial nommé User1 cesse d'utiliser la session à 09:00, ignore l'avertissement et ne revient pas.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The session of User1 is disconnected at about [[t1]].

      The session of User1 is signed out at about [[t2]].
    fr: |
      La session de User1 est déconnectée vers [[t1]].

      La session de User1 est fermée vers [[t2]].
  slots:
    - id: t1
      options:
        - { id: d0930, text: "09:30" }
        - { id: d1000, text: "10:00" }
        - { id: d1100, text: "11:00" }
    - id: t2
      options:
        - { id: s1000, text: "10:00" }
        - { id: s1130, text: "11:30" }
        - { id: s1200, text: "12:00" }
        - { id: never, text: { en: "Never: the session stays disconnected", fr: "Jamais : la session reste déconnectée" } }
answer:
  values: { t1: d1000, t2: s1200 }
explanation:
  correct:
    en: |
      When the same Session Time Limits policy is configured in both Computer Configuration and User Configuration, the computer setting takes precedence, so the idle limit is 1 hour and the session is disconnected at about 10:00 (End session isn't configured, so the session is disconnected, not ended). The disconnected session limit then signs it out 2 hours later, at about 12:00.
    fr: |
      Quand la même stratégie Session Time Limits est configurée à la fois en configuration ordinateur et en configuration utilisateur, le paramètre ordinateur l'emporte : la limite d'inactivité est donc de 1 heure et la session est déconnectée vers 10:00 (End session n'étant pas configuré, la session est déconnectée, pas fermée). La limite de session déconnectée la ferme ensuite 2 heures plus tard, vers 12:00.
  options:
    d0930: { en: "The user setting of 30 minutes is overridden by the computer setting.", fr: "Le paramètre utilisateur de 30 minutes est supplanté par le paramètre ordinateur." }
    d1100: { en: "The disconnected limit starts only after the disconnection; it doesn't add to the idle limit before it.", fr: "La limite de déconnexion ne démarre qu'après la déconnexion ; elle ne s'ajoute pas à la limite d'inactivité avant celle-ci." }
    s1000: { en: "Without End session when time limits are reached, the idle limit disconnects the session instead of signing it out.", fr: "Sans End session when time limits are reached, la limite d'inactivité déconnecte la session au lieu de la fermer." }
    s1130: { en: "This would combine the 30-minute user setting, which doesn't apply, with the disconnected limit.", fr: "Ce résultat combinerait le paramètre utilisateur de 30 minutes, qui ne s'applique pas, avec la limite de déconnexion." }
    never: { en: "The disconnected session limit of 2 hours signs out the disconnected session.", fr: "La limite de session déconnectée de 2 heures ferme la session déconnectée." }
references:
  - title: ADMX_TerminalServer Policy CSP
    url: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-terminalserver
