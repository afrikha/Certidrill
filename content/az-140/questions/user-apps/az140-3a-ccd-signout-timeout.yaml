id: az140-3a-ccd-signout-timeout
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The session hosts of a pooled host pool named **HP-Trade** use FSLogix Cloud Cache with two storage providers. `HealthyProvidersRequiredForUnregister` has its default value, and no other registration setting is configured.

    During a storage maintenance window, both providers were unavailable and some users couldn't complete their sign-out for more than an hour.

    You need to ensure that a sign-out never waits more than 10 minutes for the providers. The local cache must be kept when the wait expires so that unflushed data can be recovered.

    What should you do?
  fr: |
    Les hôtes de session d'un pool d'hôtes partagé nommé **HP-Trade** utilisent FSLogix Cloud Cache avec deux fournisseurs de stockage. `HealthyProvidersRequiredForUnregister` a sa valeur par défaut, et aucun autre paramètre d'inscription n'est configuré.

    Pendant une fenêtre de maintenance du stockage, les deux fournisseurs étaient indisponibles et certains utilisateurs n'ont pas pu terminer leur déconnexion pendant plus d'une heure.

    Vous devez faire en sorte qu'une déconnexion n'attende jamais les fournisseurs plus de 10 minutes. Le cache local doit être conservé à l'expiration de l'attente afin que les données non vidées puissent être récupérées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Set CcdUnregisterTimeout to 600
        fr: |-
          Définir CcdUnregisterTimeout sur 600
    - id: b
      text:
        en: |-
          Set HealthyProvidersRequiredForUnregister to 0
        fr: |-
          Définir HealthyProvidersRequiredForUnregister sur 0
    - id: c
      text:
        en: |-
          Set ClearCacheOnForcedUnregister to 1
        fr: |-
          Définir ClearCacheOnForcedUnregister sur 1
    - id: d
      text:
        en: |-
          Set CcdUnregisterTimeout to 10
        fr: |-
          Définir CcdUnregisterTimeout sur 10
answer: { optionId: a }
explanation:
  correct:
    en: |-
      HealthyProvidersRequiredForUnregister defaults to 1, and CcdUnregisterTimeout defaults to 0, which holds the sign-out until a healthy provider is available, possibly indefinitely. CcdUnregisterTimeout is expressed in seconds, so 600 limits the wait to 10 minutes. With ClearCacheOnForcedUnregister left at 0, the local cache is retained when the timeout expires.
    fr: |-
      HealthyProvidersRequiredForUnregister vaut 1 par défaut, et CcdUnregisterTimeout vaut 0 par défaut, ce qui bloque la déconnexion jusqu'à ce qu'un fournisseur sain soit disponible, éventuellement indéfiniment. CcdUnregisterTimeout s'exprime en secondes : 600 limite donc l'attente à 10 minutes. Avec ClearCacheOnForcedUnregister laissé à 0, le cache local est conservé à l'expiration du délai.
  options:
    b:
      en: |-
        A value of 0 removes the protections of CcdUnregisterTimeout and ClearCacheOnForcedUnregister and can permanently delete unflushed session data; Microsoft doesn't recommend it.
      fr: |-
        La valeur 0 supprime les protections de CcdUnregisterTimeout et de ClearCacheOnForcedUnregister et peut supprimer définitivement les données de session non vidées ; Microsoft ne la recommande pas.
    c:
      en: |-
        This setting deletes the local cache when the timeout expires, which contradicts the recovery requirement, and it doesn't shorten the wait while CcdUnregisterTimeout is 0.
      fr: |-
        Ce paramètre supprime le cache local à l'expiration du délai, ce qui contredit l'exigence de récupération, et il ne raccourcit pas l'attente tant que CcdUnregisterTimeout vaut 0.
    d:
      en: |-
        CcdUnregisterTimeout is a number of seconds, not minutes; 10 would release the sign-out after 10 seconds.
      fr: |-
        CcdUnregisterTimeout est un nombre de secondes, pas de minutes ; 10 libérerait la déconnexion au bout de 10 secondes.
references:
  - title: Configuration Settings
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
