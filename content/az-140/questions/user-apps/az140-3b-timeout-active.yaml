id: az140-3b-timeout-active
objective: "3.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Virtual Desktop host pool named **hp-contractors**. Contractors must not keep a session open for more than 10 hours in a row, even when they are actively working. When the limit is reached, the session must be disconnected.

    Which Group Policy setting should you configure for the session hosts?
  fr: |
    Fabrikam dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-contractors**. Les prestataires ne doivent pas garder une session ouverte plus de 10 heures d'affilée, même quand ils travaillent activement. Quand la limite est atteinte, la session doit être déconnectée.

    Quel paramètre de stratégie de groupe devez-vous configurer pour les hôtes de session ?
body:
  options:
    - { id: a, text: "Set time limit for active Remote Desktop Services sessions" }
    - { id: b, text: "Set time limit for active but idle Remote Desktop Services sessions" }
    - { id: c, text: "Set time limit for disconnected sessions" }
    - { id: d, text: "End session when time limits are reached" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      **Set time limit for active Remote Desktop Services sessions** sets the maximum time a session can stay active; when it's reached, the session is disconnected after a two-minute warning. By default the session is disconnected rather than ended.
    fr: |
      **Set time limit for active Remote Desktop Services sessions** fixe la durée maximale pendant laquelle une session peut rester active ; une fois atteinte, la session est déconnectée après un avertissement de deux minutes. Par défaut, la session est déconnectée plutôt que fermée.
  options:
    b: { en: "The idle limit only counts time without user input, so it never applies to contractors who keep working.", fr: "La limite d'inactivité ne compte que le temps sans saisie : elle ne s'applique jamais aux prestataires qui continuent de travailler." }
    c: { en: "The disconnected limit applies only to sessions that are already disconnected.", fr: "La limite de déconnexion ne s'applique qu'aux sessions déjà déconnectées." }
    d: { en: "End session changes what happens when a limit is reached (end instead of disconnect); it sets no limit itself.", fr: "End session change ce qui se passe quand une limite est atteinte (fermeture au lieu de déconnexion) ; il ne définit lui-même aucune limite." }
references:
  - title: ADMX_TerminalServer Policy CSP
    url: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-terminalserver
