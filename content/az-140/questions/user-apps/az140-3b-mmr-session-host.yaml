id: az140-3b-mmr-session-host
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop pooled host pool named **hp-training** that runs Windows 11 Enterprise multi-session session hosts. Users connect by using Windows App on Windows 11 devices.

    Users watch training videos on YouTube and LinkedIn Learning in Microsoft Edge inside their sessions. The videos are choppy and the processor usage of the session hosts is high.

    You need to have the video decoded and rendered on the users' local devices.

    What should you install on the session hosts?
  fr: |
    Contoso dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-training** dont les hôtes de session exécutent Windows 11 Entreprise multisession. Les utilisateurs se connectent avec Windows App sur des appareils Windows 11.

    Les utilisateurs regardent des vidéos de formation sur YouTube et LinkedIn Learning dans Microsoft Edge au sein de leurs sessions. Les vidéos sont saccadées et l'utilisation du processeur des hôtes de session est élevée.

    Vous devez faire en sorte que la vidéo soit décodée et affichée sur les appareils locaux des utilisateurs.

    Que devez-vous installer sur les hôtes de session ?
body:
  options:
    - { id: a, text: { en: "The Remote Desktop WebRTC Redirector Service", fr: "Le service Remote Desktop WebRTC Redirector" } }
    - { id: b, text: { en: "The Remote Desktop Multimedia Redirection Service", fr: "Le service Remote Desktop Multimedia Redirection" } }
    - { id: c, text: { en: "The NVIDIA GPU Driver Extension", fr: "L'extension NVIDIA GPU Driver Extension" } }
    - { id: d, text: { en: "Windows App", fr: "Windows App" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Multimedia redirection offloads video playback from the browser in the remote session to the local device, which decodes and renders the video. It needs two components on the session hosts, the Remote Desktop Multimedia Redirection Service and the Microsoft Edge or Google Chrome extension, both installed by the same MSI.
    fr: |
      La redirection multimédia décharge la lecture vidéo du navigateur de la session distante vers l'appareil local, qui décode et affiche la vidéo. Elle nécessite deux composants sur les hôtes de session, le service Remote Desktop Multimedia Redirection et l'extension Microsoft Edge ou Google Chrome, installés tous deux par le même MSI.
  options:
    a: { en: "The WebRTC Redirector Service optimizes Microsoft Teams calls and meetings, not video played in a browser.", fr: "Le service WebRTC Redirector optimise les appels et réunions Microsoft Teams, pas la vidéo lue dans un navigateur." }
    c: { en: "A GPU driver accelerates rendering on the session host itself; it doesn't move decoding to the local device.", fr: "Un pilote GPU accélère le rendu sur l'hôte de session lui-même ; il ne déplace pas le décodage vers l'appareil local." }
    d: { en: "Windows App is the client installed on the local devices, not a session host component.", fr: "Windows App est le client installé sur les appareils locaux, pas un composant de l'hôte de session." }
references:
  - title: Multimedia redirection for video playback and calls in a remote session
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection
