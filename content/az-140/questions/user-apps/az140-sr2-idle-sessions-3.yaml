id: az140-sr2-idle-sessions-3
objective: "3.2.9"
type: series_yesno
series: az140-sr2-idle-sessions
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |
    You configure a time limit for idle sessions and a time limit for disconnected sessions.
  fr: |
    Vous configurez une limite de temps pour les sessions inactives et une limite de temps pour les sessions déconnectées.
body:
  solution:
    en: |
      You create a Group Policy Object (GPO) linked to the AVD-Pool2 OU. Under **Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits**, you enable **Set time limit for active but idle Remote Desktop Services sessions** with **30 minutes** and **Set time limit for disconnected sessions** with **1 hour**.
    fr: |
      Vous créez un objet de stratégie de groupe (GPO) lié à l'UO AVD-Pool2. Sous **Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits**, vous activez **Set time limit for active but idle Remote Desktop Services sessions** avec **30 minutes** et **Set time limit for disconnected sessions** avec **1 hour**.
answer: { value: true }
explanation:
  correct:
    en: The idle session limit disconnects a session that has received no user input for the configured time, after a warning two minutes before, and doesn't affect users who are working. The disconnected session limit deletes disconnected sessions from the session host after the configured time, which signs the users out. As computer settings, both apply to every session on the session hosts of the OU.
    fr: "La limite des sessions inactives déconnecte une session qui n'a reçu aucune action de l'utilisateur pendant la durée configurée, après un avertissement deux minutes avant, et n'affecte pas les utilisateurs qui travaillent. La limite des sessions déconnectées supprime les sessions déconnectées de l'hôte de session après la durée configurée, ce qui ferme la session des utilisateurs. En tant que paramètres ordinateur, les deux s'appliquent à toutes les sessions des hôtes de session de l'UO."
references:
  - title: Policy CSP - ADMX_TerminalServer
    url: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-terminalserver
