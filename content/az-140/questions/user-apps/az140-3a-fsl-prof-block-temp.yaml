id: az140-3a-fsl-prof-block-temp
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The session hosts of a pooled host pool named **HP-Claims** use FSLogix profile containers stored on an Azure Files share. During a recent storage incident, some users signed in with a temporary profile and lost the changes they made during their session.

    You need to ensure that if the container can't be attached or a temporary profile is created, users can't work in the session and are told to contact support instead.

    What should you configure?
  fr: |
    Les hôtes de session d'un pool d'hôtes partagé nommé **HP-Claims** utilisent des conteneurs de profil FSLogix stockés sur un partage Azure Files. Lors d'un récent incident de stockage, certains utilisateurs se sont connectés avec un profil temporaire et ont perdu les modifications faites pendant leur session.

    Vous devez faire en sorte que, si le conteneur ne peut pas être attaché ou qu'un profil temporaire est créé, les utilisateurs ne puissent pas travailler dans la session et soient invités à contacter le support.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text:
        en: |-
          Set PreventLoginWithFailure and PreventLoginWithTempProfile to 1
        fr: |-
          Définir PreventLoginWithFailure et PreventLoginWithTempProfile sur 1
    - id: b
      text:
        en: |-
          Set DeleteLocalProfileWhenVHDShouldApply and ProfileType to 1
        fr: |-
          Définir DeleteLocalProfileWhenVHDShouldApply et ProfileType sur 1
    - id: c
      text:
        en: |-
          Set HealthyProvidersRequiredForRegister and LockedRetryCount to 1
        fr: |-
          Définir HealthyProvidersRequiredForRegister et LockedRetryCount sur 1
    - id: d
      text:
        en: |-
          Set IgnoreNonWVD and AccessNetworkAsComputerObject to 1
        fr: |-
          Définir IgnoreNonWVD et AccessNetworkAsComputerObject sur 1
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With PreventLoginWithFailure set to 1, FSLogix loads the FRXShell when it fails to attach or use the profile container; with PreventLoginWithTempProfile set to 1, it does the same when a temporary profile is created. The user sees the prompt to call support and can only sign out, so no work is done in a profile that won't be saved.
    fr: |-
      Avec PreventLoginWithFailure défini sur 1, FSLogix charge FRXShell lorsqu'il ne parvient pas à attacher ou à utiliser le conteneur de profil ; avec PreventLoginWithTempProfile défini sur 1, il fait de même lorsqu'un profil temporaire est créé. L'utilisateur voit l'invite à contacter le support et ne peut que se déconnecter : aucun travail n'est fait dans un profil qui ne sera pas enregistré.
  options:
    b:
      en: |-
        DeleteLocalProfileWhenVHDShouldApply removes an existing local profile, and ProfileType 1 makes the host a read-write-only instance; neither blocks a session when the container fails.
      fr: |-
        DeleteLocalProfileWhenVHDShouldApply supprime un profil local existant, et ProfileType 1 fait de l'hôte une instance uniquement en lecture-écriture ; aucun ne bloque une session lorsque le conteneur échoue.
    c:
      en: |-
        HealthyProvidersRequiredForRegister applies only to Cloud Cache (CCDLocations), and LockedRetryCount only changes how many times FSLogix retries a locked container.
      fr: |-
        HealthyProvidersRequiredForRegister ne s'applique qu'à Cloud Cache (CCDLocations), et LockedRetryCount ne modifie que le nombre de nouvelles tentatives sur un conteneur verrouillé.
    d:
      en: |-
        IgnoreNonWVD limits FSLogix to Azure Virtual Desktop sessions, and AccessNetworkAsComputerObject attaches containers with the computer account; neither changes the behavior after a failure.
      fr: |-
        IgnoreNonWVD limite FSLogix aux sessions Azure Virtual Desktop, et AccessNetworkAsComputerObject attache les conteneurs avec le compte d'ordinateur ; aucun ne modifie le comportement après un échec.
references:
  - title: Configuration Settings
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
