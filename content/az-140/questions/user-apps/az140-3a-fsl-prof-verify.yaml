id: az140-3a-fsl-prof-verify
objective: "3.1.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You deploy a new session host named **SH-Test01** in a pooled host pool. The FSLogix profile share is ready and its share-level and NTFS permissions are configured.

    You need to configure FSLogix profile containers on SH-Test01 and confirm that the profile of a user is redirected to a container.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous déployez un nouvel hôte de session nommé **SH-Test01** dans un pool d'hôtes partagé. Le partage des profils FSLogix est prêt et ses autorisations au niveau du partage et NTFS sont configurées.

    Vous devez configurer les conteneurs de profil FSLogix sur SH-Test01 et confirmer que le profil d'un utilisateur est redirigé vers un conteneur.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: install
      text:
        en: |-
          Install FSLogix Apps on SH-Test01.
        fr: |-
          Installer FSLogix Apps sur SH-Test01.
    - id: reg
      text:
        en: |-
          Create the Enabled and VHDLocations values under HKLM\SOFTWARE\FSLogix\Profiles.
        fr: |-
          Créer les valeurs Enabled et VHDLocations sous HKLM\SOFTWARE\FSLogix\Profiles.
    - id: user
      text:
        en: |-
          Sign in to SH-Test01 as a standard user.
        fr: |-
          Se connecter à SH-Test01 en tant qu'utilisateur standard.
    - id: frx
      text:
        en: |-
          Run frx.exe list-redirects from C:\Program Files\FSLogix\Apps.
        fr: |-
          Exécuter frx.exe list-redirects depuis C:\Program Files\FSLogix\Apps.
    - id: rule
      text:
        en: |-
          Install the FSLogix Apps RuleEditor on SH-Test01.
        fr: |-
          Installer FSLogix Apps RuleEditor sur SH-Test01.
    - id: ccd
      text:
        en: |-
          Create the CCDLocations value under HKLM\SOFTWARE\FSLogix\Profiles.
        fr: |-
          Créer la valeur CCDLocations sous HKLM\SOFTWARE\FSLogix\Profiles.
    - id: exclude
      text:
        en: |-
          Add the test user to the FSLogix Profile Exclude List local group.
        fr: |-
          Ajouter l'utilisateur de test au groupe local FSLogix Profile Exclude List.
answer:
  sequence: [ install, reg, user, frx ]
explanation:
  correct:
    en: |-
      FSLogix must be installed before you add its configuration values, and a profile container needs only Enabled and VHDLocations under HKLM\SOFTWARE\FSLogix\Profiles. You then sign in as a standard user, as the documented verification procedure does, and run frx.exe list-redirects in the FSLogix Apps folder to list the active redirections to the container.
    fr: |-
      FSLogix doit être installé avant d'ajouter ses valeurs de configuration, et un conteneur de profil n'a besoin que d'Enabled et de VHDLocations sous HKLM\SOFTWARE\FSLogix\Profiles. Vous vous connectez ensuite en tant qu'utilisateur standard, comme dans la procédure de vérification documentée, puis vous exécutez frx.exe list-redirects dans le dossier FSLogix Apps pour lister les redirections actives vers le conteneur.
  options:
    rule:
      en: |-
        The RuleEditor creates application masking Rule Sets; it isn't needed for profile containers.
      fr: |-
        RuleEditor crée des Rule Sets de masquage d'application ; il n'est pas nécessaire pour les conteneurs de profil.
    ccd:
      en: |-
        CCDLocations is the Cloud Cache setting and must not be present together with VHDLocations.
      fr: |-
        CCDLocations est le paramètre de Cloud Cache et ne doit pas être présent en même temps que VHDLocations.
    exclude:
      en: |-
        Members of the exclude group are never processed by FSLogix, so the test user wouldn't get a container.
      fr: |-
        Les membres du groupe d'exclusion ne sont jamais traités par FSLogix : l'utilisateur de test n'obtiendrait pas de conteneur.
references:
  - title: Configure profile containers
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-profile-containers
