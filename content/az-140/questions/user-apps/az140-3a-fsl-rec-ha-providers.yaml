id: az140-3a-fsl-rec-ha-providers
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a pooled host pool named **HP-Ops** in the West Europe region. FSLogix profile containers are stored on a single Azure Files share in West Europe, configured with `VHDLocations`. An Azure NetApp Files capacity pool is also available in West Europe.

    You need to ensure that users can keep working with their profiles if one storage service in the region has an outage. The solution must minimize the risk that a single storage outage affects every copy of the profiles.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un pool d'hôtes partagé nommé **HP-Ops** dans la région West Europe. Les conteneurs de profil FSLogix sont stockés sur un seul partage Azure Files dans West Europe, configuré avec `VHDLocations`. Un pool de capacité Azure NetApp Files est également disponible dans West Europe.

    Vous devez faire en sorte que les utilisateurs puissent continuer à travailler avec leurs profils si un service de stockage de la région subit une panne. La solution doit réduire au minimum le risque qu'une seule panne de stockage affecte toutes les copies des profils.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Replace VHDLocations with CCDLocations on the session hosts.
        fr: |-
          Remplacer VHDLocations par CCDLocations sur les hôtes de session.
    - id: b
      text:
        en: |-
          Add a second Azure Files share in the same storage account as another entry in VHDLocations.
        fr: |-
          Ajouter un second partage Azure Files du même compte de stockage comme autre entrée de VHDLocations.
    - id: c
      text:
        en: |-
          Use the Azure Files share and an Azure NetApp Files volume as the two storage providers.
        fr: |-
          Utiliser le partage Azure Files et un volume Azure NetApp Files comme les deux fournisseurs de stockage.
    - id: d
      text:
        en: |-
          Set ProfileType to 3 on the session hosts.
        fr: |-
          Définir ProfileType sur 3 sur les hôtes de session.
    - id: e
      text:
        en: |-
          Use two Azure Files shares in two storage accounts of the same region as the storage providers.
        fr: |-
          Utiliser deux partages Azure Files de deux comptes de stockage de la même région comme fournisseurs de stockage.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      High availability for profile containers is provided by Cloud Cache, which uses CCDLocations instead of VHDLocations and keeps several storage providers up to date from the local cache. FSLogix recommends unique storage platforms, such as Azure Files and Azure NetApp Files, because two Azure Files shares or two volumes of the same service aren't isolated enough from a single outage.
    fr: |-
      La haute disponibilité des conteneurs de profil est assurée par Cloud Cache, qui utilise CCDLocations à la place de VHDLocations et maintient plusieurs fournisseurs de stockage à jour à partir du cache local. FSLogix recommande des plateformes de stockage distinctes, comme Azure Files et Azure NetApp Files, car deux partages Azure Files ou deux volumes du même service ne sont pas suffisamment isolés d'une même panne.
  options:
    b:
      en: |-
        Multiple VHDLocations entries don't provide resiliency, and two shares in the same storage account share the same failure domain.
      fr: |-
        Plusieurs entrées VHDLocations n'apportent pas de résilience, et deux partages du même compte de stockage partagent le même domaine d'erreur.
    d:
      en: |-
        ProfileType controls concurrent read-write or read-only access to a container, not storage redundancy.
      fr: |-
        ProfileType contrôle l'accès simultané en lecture-écriture ou en lecture seule à un conteneur, pas la redondance du stockage.
    e:
      en: |-
        Two Azure Files providers would work with Cloud Cache, but an issue with the Azure Files service could affect both, which doesn't minimize the risk.
      fr: |-
        Deux fournisseurs Azure Files fonctionneraient avec Cloud Cache, mais un problème du service Azure Files pourrait affecter les deux, ce qui ne réduit pas le risque au minimum.
references:
  - title: High Availability or Container Resiliency Options using Cloud Cache
    url: https://learn.microsoft.com/en-us/fslogix/concepts-container-high-availability
  - title: Cloud Cache Overview
    url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-cloud-cache
