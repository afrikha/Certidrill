id: az140-3b-appgroup-two-pools
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has two Azure Virtual Desktop pooled host pools: **hp-gpu**, whose session hosts run a 3D viewer named **App1**, and **hp-std**, whose session hosts run a reporting tool named **App2**. Both host pools are in the same region.

    You need the members of a group named **Engineers** to see App1 and App2 as RemoteApp applications in the same workspace named **ws-eng**.

    What should you do?
  fr: |
    Fabrikam dispose de deux pools d'hôtes partagés Azure Virtual Desktop : **hp-gpu**, dont les hôtes de session exécutent une visionneuse 3D nommée **App1**, et **hp-std**, dont les hôtes de session exécutent un outil de rapports nommé **App2**. Les deux pools d'hôtes sont dans la même région.

    Les membres d'un groupe nommé **Engineers** doivent voir App1 et App2 comme applications RemoteApp dans le même espace de travail nommé **ws-eng**.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a RemoteApp application group in each host pool, publish App1 and App2 in them, and register both to ws-eng.", fr: "Créer un groupe d'applications RemoteApp dans chaque pool d'hôtes, y publier App1 et App2, et les inscrire tous deux dans ws-eng." } }
    - { id: b, text: { en: "Create one RemoteApp application group associated with both host pools, publish App1 and App2, and register it to ws-eng.", fr: "Créer un groupe d'applications RemoteApp associé aux deux pools d'hôtes, y publier App1 et App2, et l'inscrire dans ws-eng." } }
    - { id: c, text: { en: "Create a RemoteApp application group in hp-gpu and add App2 to it by using its file path on the hp-std session hosts.", fr: "Créer un groupe d'applications RemoteApp dans hp-gpu et y ajouter App2 par son chemin d'accès sur les hôtes de session de hp-std." } }
    - { id: d, text: { en: "Create a desktop application group in each host pool and register both to ws-eng.", fr: "Créer un groupe d'applications de bureau dans chaque pool d'hôtes et les inscrire tous deux dans ws-eng." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An application group belongs to a single host pool and publishes applications installed on that host pool's session hosts. A workspace can contain application groups from several host pools, so one RemoteApp application group per host pool, both registered to ws-eng and assigned to Engineers, shows App1 and App2 together.
    fr: |
      Un groupe d'applications appartient à un seul pool d'hôtes et publie des applications installées sur les hôtes de session de ce pool. Un espace de travail peut contenir des groupes d'applications de plusieurs pools d'hôtes : un groupe d'applications RemoteApp par pool d'hôtes, tous deux inscrits dans ws-eng et affectés à Engineers, affiche App1 et App2 ensemble.
  options:
    b: { en: "An application group is associated with exactly one host pool.", fr: "Un groupe d'applications est associé à un seul pool d'hôtes." }
    c: { en: "A RemoteApp runs on the session hosts of its own host pool; App2 isn't installed on the hp-gpu session hosts.", fr: "Une RemoteApp s'exécute sur les hôtes de session de son propre pool d'hôtes ; App2 n'est pas installée sur les hôtes de session de hp-gpu." }
    d: { en: "Desktop application groups publish full desktops, not individual RemoteApp applications.", fr: "Les groupes d'applications de bureau publient des bureaux complets, pas des applications RemoteApp individuelles." }
references:
  - title: Preferred application group type behavior for pooled host pools in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/preferred-application-group-type
