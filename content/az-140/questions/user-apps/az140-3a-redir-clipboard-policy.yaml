id: az140-3a-redir-clipboard-policy
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Users of a pooled host pool named **HP-Support** must copy and paste text between their local devices and their remote sessions. You set **Clipboard redirection** to *Clipboard on local computer is available in remote session* in the RDP properties of HP-Support.

    Users still can't paste text in their sessions. On the session hosts, a Group Policy object configures **Do not allow Clipboard redirection** as **Enabled**. The local devices have no redirection setting configured.

    What should you do?
  fr: |
    Les utilisateurs d'un pool d'hôtes partagé nommé **HP-Support** doivent copier et coller du texte entre leurs appareils locaux et leurs sessions distantes. Vous définissez **Clipboard redirection** sur *Clipboard on local computer is available in remote session* dans les propriétés RDP de HP-Support.

    Les utilisateurs ne peuvent toujours pas coller de texte dans leurs sessions. Sur les hôtes de session, un objet de stratégie de groupe configure **Do not allow Clipboard redirection** sur **Enabled**. Aucun paramètre de redirection n'est configuré sur les appareils locaux.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Set DisableClipboardRedirection to 0 on the local devices
        fr: |-
          Définir DisableClipboardRedirection sur 0 sur les appareils locaux
    - id: b
      text:
        en: |-
          Add drivestoredirect:s:* to the RDP properties of HP-Support
        fr: |-
          Ajouter drivestoredirect:s:* aux propriétés RDP de HP-Support
    - id: c
      text:
        en: |-
          Set the policy to Disabled, then restart the session hosts
        fr: |-
          Définir la stratégie sur Disabled, puis redémarrer les hôtes de session
    - id: d
      text:
        en: |-
          Set the RDP property to Not configured so that the policy is ignored
        fr: |-
          Définir la propriété RDP sur Not configured pour que la stratégie soit ignorée
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Clipboard redirection is controlled on the session host, in the host pool RDP properties and on the local device, and the most restrictive setting wins. Because the session host policy blocks it, the RDP property has no effect; set **Do not allow Clipboard redirection** to Disabled (or Not configured) and restart the session hosts for the policy to take effect.
    fr: |-
      La redirection du Presse-papiers est contrôlée sur l'hôte de session, dans les propriétés RDP du pool d'hôtes et sur l'appareil local, et le paramètre le plus restrictif l'emporte. Comme la stratégie de l'hôte de session la bloque, la propriété RDP n'a aucun effet ; définissez **Do not allow Clipboard redirection** sur Disabled (ou Not configured) et redémarrez les hôtes de session pour que la stratégie prenne effet.
  options:
    a:
      en: |-
        The local devices don't block the clipboard; the session host policy does.
      fr: |-
        Les appareils locaux ne bloquent pas le Presse-papiers ; c'est la stratégie de l'hôte de session qui le fait.
    b:
      en: |-
        Drive redirection is needed to copy files through the clipboard, not text, and it doesn't override the clipboard policy.
      fr: |-
        La redirection des lecteurs est nécessaire pour copier des fichiers par le Presse-papiers, pas du texte, et elle ne remplace pas la stratégie du Presse-papiers.
    d:
      en: |-
        A session host policy is never overridden by the RDP properties; the most restrictive setting still applies.
      fr: |-
        Une stratégie d'hôte de session n'est jamais remplacée par les propriétés RDP ; le paramètre le plus restrictif s'applique toujours.
references:
  - title: Configure clipboard redirection over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-clipboard
