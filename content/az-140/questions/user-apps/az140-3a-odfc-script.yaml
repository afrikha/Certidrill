id: az140-3a-odfc-script
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind keeps a third-party roaming profile solution on the session hosts of a pooled host pool named **HP-Call**, and you are adding FSLogix ODFC containers stored on `\\stnwodfc.file.core.windows.net\odfc`.

    The ODFC containers must meet the following requirements:

    - The new Microsoft Teams data must be stored in the container.
    - OneDrive isn't used on the session hosts, and its cache must not be redirected.
    - All the other workloads keep their default behavior.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind conserve une solution tierce de profils itinérants sur les hôtes de session d'un pool d'hôtes partagé nommé **HP-Call**, et vous ajoutez des conteneurs ODFC FSLogix stockés sur `\\stnwodfc.file.core.windows.net\odfc`.

    Les conteneurs ODFC doivent répondre aux exigences suivantes :

    - Les données du nouveau Microsoft Teams doivent être stockées dans le conteneur.
    - OneDrive n'est pas utilisé sur les hôtes de session, et son cache ne doit pas être redirigé.
    - Toutes les autres charges de travail conservent leur comportement par défaut.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $p = "[[path]]"
    New-ItemProperty -Path $p -Name Enabled -PropertyType dword -Value 1 -Force
    New-ItemProperty -Path $p -Name VHDLocations -PropertyType string -Value "\\stnwodfc.file.core.windows.net\odfc" -Force
    New-ItemProperty -Path $p -Name VolumeType -PropertyType string -Value vhdx -Force
    New-ItemProperty -Path $p -Name [[teams]] -PropertyType dword -Value 1 -Force
    New-ItemProperty -Path $p -Name [[od]] -PropertyType dword -Value 0 -Force
  slots:
    - id: path
      options:
        - id: prof
          text: 'HKLM:\SOFTWARE\FSLogix\Profiles'
        - id: odfc
          text: 'HKLM:\SOFTWARE\Policies\FSLogix\ODFC'
        - id: hkcu
          text: 'HKCU:\SOFTWARE\Policies\FSLogix\ODFC'
    - id: teams
      options:
        - { id: skype, text: IncludeSkype }
        - { id: sp, text: IncludeSharepoint }
        - { id: teams, text: IncludeTeams }
    - id: od
      options:
        - { id: onenote, text: IncludeOneNote }
        - { id: onedrive, text: IncludeOneDrive }
        - { id: act, text: IncludeOfficeActivation }
answer:
  values: { path: odfc, teams: teams, od: onedrive }
explanation:
  correct:
    en: |-
      ODFC container settings are created under HKLM\SOFTWARE\Policies\FSLogix\ODFC. IncludeTeams defaults to 0, so it must be set to 1 to redirect classic and new Teams data (it also registers the new Teams package at sign-in). IncludeOneDrive defaults to 1, so it must be set to 0 to keep the OneDrive cache out of the container.
    fr: |-
      Les paramètres du conteneur ODFC se créent sous HKLM\SOFTWARE\Policies\FSLogix\ODFC. IncludeTeams vaut 0 par défaut et doit donc être défini sur 1 pour rediriger les données du Teams classique et du nouveau Teams (il enregistre aussi le package du nouveau Teams à la connexion). IncludeOneDrive vaut 1 par défaut et doit donc être défini sur 0 pour exclure le cache OneDrive du conteneur.
  options:
    path:
      en: |-
        HKLM\SOFTWARE\FSLogix\Profiles configures profile containers, and FSLogix doesn't read its settings from HKCU.
      fr: |-
        HKLM\SOFTWARE\FSLogix\Profiles configure les conteneurs de profil, et FSLogix ne lit pas ses paramètres dans HKCU.
    teams:
      en: |-
        IncludeSkype redirects the Skype for Business Global Address List and IncludeSharepoint the SharePoint data; both are already on by default.
      fr: |-
        IncludeSkype redirige la liste d'adresses globale de Skype Entreprise et IncludeSharepoint les données SharePoint ; les deux sont déjà activés par défaut.
    od:
      en: |-
        IncludeOneNote is already 0 by default, and setting IncludeOfficeActivation to 0 would change the default behavior of Office activation.
      fr: |-
        IncludeOneNote vaut déjà 0 par défaut, et définir IncludeOfficeActivation sur 0 modifierait le comportement par défaut de l'activation d'Office.
references:
  - title: Configuration Settings
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
