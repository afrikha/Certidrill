id: az140-cs1a-fslogix-registry
objective: "3.1.2"
type: dropdown
caseStudy: az140-cs1a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are writing a script that configures FSLogix on the session hosts of HP-Claims. The profile share is named **profiles** and is in a storage account named **sthiprofiles**.

    How should you complete the script to meet the profile and profile behavior requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un script qui configure FSLogix sur les hôtes de session de HP-Claims. Le partage des profils se nomme **profiles** et se trouve dans un compte de stockage nommé **sthiprofiles**.

    Comment devez-vous compléter le script pour satisfaire les exigences relatives aux profils et à leur comportement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $regPath = "HKLM:\SOFTWARE\FSLogix\Profiles"
    New-ItemProperty -Path $regPath -Name Enabled -PropertyType DWORD -Value 1 -Force
    New-ItemProperty -Path $regPath -Name [[loc]] -PropertyType MultiString -Value "\\sthiprofiles.file.core.windows.net\profiles" -Force
    New-ItemProperty -Path $regPath -Name [[local]] -PropertyType DWORD -Value 1 -Force
    New-ItemProperty -Path $regPath -Name [[folder]] -PropertyType DWORD -Value 1 -Force
  slots:
    - id: loc
      options:
        - { id: vhd, text: VHDLocations }
        - { id: ccd, text: CCDLocations }
        - { id: vol, text: VolumeType }
    - id: local
      options:
        - { id: clear, text: ClearCacheOnLogoff }
        - { id: healthy, text: HealthyProvidersRequiredForRegister }
        - { id: dellocal, text: DeleteLocalProfileWhenVHDShouldApply }
    - id: folder
      options:
        - { id: size, text: SizeInMBs }
        - { id: flip, text: FlipFlopProfileDirectoryName }
        - { id: retry, text: LockedRetryCount }
answer:
  values: { loc: vhd, local: dellocal, folder: flip }
explanation:
  correct:
    en: |
      VHDLocations holds the UNC path of the SMB share that stores standard profile containers. DeleteLocalProfileWhenVHDShouldApply set to 1 deletes an existing local profile when the FSLogix profile should apply, so the agent does not keep using the local copy. FlipFlopProfileDirectoryName set to 1 names each folder with the user name first (user name, then SID) instead of the default SID first.
    fr: |
      VHDLocations contient le chemin UNC du partage SMB qui stocke les conteneurs de profil standard. DeleteLocalProfileWhenVHDShouldApply défini sur 1 supprime un profil local existant quand le profil FSLogix doit s'appliquer, pour que le gestionnaire n'utilise plus la copie locale. FlipFlopProfileDirectoryName défini sur 1 nomme chaque dossier en commençant par le nom d'utilisateur (nom d'utilisateur, puis SID) au lieu du SID par défaut.
  options:
    loc: { en: "CCDLocations is used only with Cloud Cache, which the case does not require; VolumeType selects VHD or VHDX, not the location.", fr: "CCDLocations ne sert qu'avec Cloud Cache, que le cas n'exige pas ; VolumeType choisit VHD ou VHDX, pas l'emplacement." }
    local: { en: "ClearCacheOnLogoff and HealthyProvidersRequiredForRegister are Cloud Cache settings; they do not remove local profiles.", fr: "ClearCacheOnLogoff et HealthyProvidersRequiredForRegister sont des paramètres Cloud Cache ; ils ne suppriment pas les profils locaux." }
    folder: { en: "SizeInMBs sets the maximum container size and LockedRetryCount the attach retries; neither changes the folder name.", fr: "SizeInMBs définit la taille maximale du conteneur et LockedRetryCount les nouvelles tentatives d'attachement ; aucun ne modifie le nom du dossier." }
references:
  - title: "Tutorial: Configure profile containers with Cloud Cache"
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-cloud-cache-containers
  - title: Store FSLogix profile containers on Azure Files and Active Directory Domain Services or Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-profile-container-configure-azure-files-active-directory
