id: az140-sr2-idle-sessions-2
objective: "3.2.9"
type: series_yesno
series: az140-sr2-idle-sessions
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You assign a scaling plan that forces users to sign out during ramp-down.
  fr: |
    Vous attribuez un plan de mise à l'échelle qui force la fermeture des sessions pendant la baisse de charge.
body:
  solution:
    en: |
      You create a pooled scaling plan and assign it to Pool2. In the ramp-down phase of each weekday schedule, you set **Force logoff users** to **Yes** with a delay of **30 minutes** before users are signed out, and a notification message that asks users to save their work.
    fr: |
      Vous créez un plan de mise à l'échelle de type regroupé et l'attribuez à Pool2. Dans la phase de baisse de charge de chaque planification de jour ouvré, vous définissez **Force logoff users** sur **Yes** avec un délai de **30 minutes** avant la fermeture des sessions, et un message de notification qui invite les utilisateurs à enregistrer leur travail.
answer: { value: false }
explanation:
  correct:
    en: "Forced sign-out applies only during the ramp-down phase, when autoscale consolidates sessions: it drains the session host with the fewest sessions, notifies its users and signs them all out after the delay, including users who are working. It doesn't disconnect sessions after 30 minutes without input, and it doesn't sign out disconnected sessions one hour after their disconnection."
    fr: "La fermeture forcée ne s'applique que pendant la phase de baisse de charge, quand la mise à l'échelle automatique regroupe les sessions : elle draine l'hôte de session qui a le moins de sessions, avertit ses utilisateurs et ferme toutes leurs sessions après le délai, y compris celles des utilisateurs qui travaillent. Elle ne déconnecte pas les sessions après 30 minutes sans action et ne ferme pas les sessions déconnectées une heure après leur déconnexion."
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
