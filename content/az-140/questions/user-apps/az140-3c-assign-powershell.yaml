id: az140-3c-assign-powershell
objective: "3.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop deployment in a resource group named **RG-AVD**. RG-AVD contains several application groups, including a RemoteApp application group named **AG-Legal** that is registered to a workspace. The session hosts are joined to an Active Directory Domain Services (AD DS) domain.

    You need to give the members of the Microsoft Entra group **Legal-Users** access to the applications of AG-Legal only. The solution must follow the principle of least privilege.

    How should you complete the Azure PowerShell script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un déploiement Azure Virtual Desktop dans un groupe de ressources nommé **RG-AVD**. RG-AVD contient plusieurs groupes d'applications, dont un groupe d'applications RemoteApp nommé **AG-Legal**, inscrit dans un espace de travail. Les hôtes de session sont joints à un domaine Active Directory Domain Services (AD DS).

    Vous devez donner aux membres du groupe Microsoft Entra **Legal-Users** l'accès aux applications d'AG-Legal uniquement. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter le script Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $ag  = Get-AzWvdApplicationGroup -Name AG-Legal -ResourceGroupName RG-AVD
    $grp = Get-AzADGroup -DisplayName "Legal-Users"

    New-AzRoleAssignment [[param]] $grp.Id `
      -RoleDefinitionName [[role]] `
      -Scope [[scope]]
  slots:
    - id: param
      options:
        - { id: oid, text: "-ObjectId" }
        - { id: sign, text: "-SignInName" }
        - { id: app, text: "-ApplicationId" }
    - id: role
      options:
        - { id: dvu, text: "\"Desktop Virtualization User\"" }
        - { id: agr, text: "\"Desktop Virtualization Application Group Reader\"" }
        - { id: wsr, text: "\"Desktop Virtualization Workspace Reader\"" }
        - { id: vmul, text: "\"Virtual Machine User Login\"" }
    - id: scope
      options:
        - { id: ag, text: "$ag.Id" }
        - { id: hp, text: "$ag.HostPoolArmPath" }
        - { id: rg, text: "(Get-AzResourceGroup -Name RG-AVD).ResourceId" }
answer:
  values: { param: oid, role: dvu, scope: ag }
explanation:
  correct:
    en: A Microsoft Entra group is identified by its object ID, so the group's Id is passed to -ObjectId. Desktop Virtualization User is the role that lets users use the applications of an application group, and assigning it at the scope of AG-Legal limits access to that application group only.
    fr: Un groupe Microsoft Entra est identifié par son ID d'objet ; l'Id du groupe est donc passé à -ObjectId. Desktop Virtualization User est le rôle qui permet d'utiliser les applications d'un groupe d'applications, et l'attribuer à l'étendue d'AG-Legal limite l'accès à ce seul groupe d'applications.
  options:
    sign: { en: "-SignInName expects a user principal name, not the object ID of a group.", fr: "-SignInName attend un nom d'utilisateur principal, pas l'ID d'objet d'un groupe." }
    app: { en: "-ApplicationId identifies a service principal, not a group.", fr: "-ApplicationId identifie un principal de service, pas un groupe." }
    agr: { en: "This role only allows viewing the application group in Azure.", fr: "Ce rôle permet seulement de consulter le groupe d'applications dans Azure." }
    wsr: { en: "This role only allows viewing workspaces.", fr: "Ce rôle permet seulement de consulter les espaces de travail." }
    vmul: { en: "This role grants sign-in to virtual machines; it doesn't grant access to the application group, and AD DS joined session hosts don't use it.", fr: "Ce rôle permet de se connecter à des machines virtuelles ; il ne donne pas accès au groupe d'applications, et les hôtes de session joints à AD DS ne l'utilisent pas." }
    hp: { en: "Access is granted on the application group, not on the host pool.", fr: "L'accès est accordé sur le groupe d'applications, pas sur le pool d'hôtes." }
    rg: { en: "A resource group scope would give access to every application group in RG-AVD.", fr: "Une étendue de groupe de ressources donnerait accès à tous les groupes d'applications de RG-AVD." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
