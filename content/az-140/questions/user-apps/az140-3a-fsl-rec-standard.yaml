id: az140-3a-fsl-rec-standard
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a pooled host pool named **HP-Office** that contains 20 Windows 11 Enterprise multi-session session hosts. Users sign in to a different session host each day and must keep their desktop settings, Outlook data and OneDrive cache. Contoso doesn't use any other roaming profile solution.

    An Azure Files share in the same region as the session hosts is ready for user profiles. The solution must minimize configuration complexity.

    Which FSLogix configuration should you recommend?
  fr: |
    Contoso dispose d'un pool d'hôtes partagé (pooled) nommé **HP-Office** qui contient 20 hôtes de session Windows 11 Entreprise multisession. Les utilisateurs se connectent chaque jour à un hôte de session différent et doivent conserver leurs paramètres de bureau, leurs données Outlook et leur cache OneDrive. Contoso n'utilise aucune autre solution de profils itinérants.

    Un partage Azure Files situé dans la même région que les hôtes de session est prêt pour les profils utilisateur. La solution doit réduire au minimum la complexité de la configuration.

    Quelle configuration FSLogix devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: |-
          A profile container and an ODFC container, each with its own entry in VHDLocations
        fr: |-
          Un conteneur de profil et un conteneur ODFC, chacun avec sa propre entrée dans VHDLocations
    - id: b
      text:
        en: |-
          A profile container only, with the share as the single entry in VHDLocations
        fr: |-
          Un conteneur de profil uniquement, avec le partage comme seule entrée dans VHDLocations
    - id: c
      text:
        en: |-
          An ODFC container only, with the share as the single entry in VHDLocations
        fr: |-
          Un conteneur ODFC uniquement, avec le partage comme seule entrée dans VHDLocations
    - id: d
      text:
        en: |-
          A profile container with Cloud Cache, with the share as the single entry in CCDLocations
        fr: |-
          Un conteneur de profil avec Cloud Cache, avec le partage comme seule entrée dans CCDLocations
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A profile container redirects the entire user profile, including all Microsoft 365 app data such as Outlook and OneDrive, into one VHD(x). Microsoft recommends this single-container configuration with one SMB location as the standard, simplest design.
    fr: |-
      Un conteneur de profil redirige l'intégralité du profil utilisateur, y compris toutes les données des applications Microsoft 365 comme Outlook et OneDrive, dans un seul VHD(x). Microsoft recommande cette configuration à conteneur unique avec un seul emplacement SMB comme conception standard, la plus simple.
  options:
    a:
      en: |-
        A dual-container configuration adds a second disk for data that the profile container already holds; it is optional and adds complexity.
      fr: |-
        Une configuration à double conteneur ajoute un second disque pour des données que le conteneur de profil contient déjà ; elle est facultative et ajoute de la complexité.
    c:
      en: |-
        An ODFC container redirects only Microsoft 365 app data, so the desktop settings wouldn't roam without another profile solution.
      fr: |-
        Un conteneur ODFC ne redirige que les données des applications Microsoft 365 : les paramètres de bureau ne suivraient pas l'utilisateur sans autre solution de profils.
    d:
      en: |-
        Cloud Cache adds a local cache and extra disk and IOPS load on every session host; it brings value only with several storage providers and isn't needed here.
      fr: |-
        Cloud Cache ajoute un cache local et une charge disque et IOPS supplémentaire sur chaque hôte de session ; il n'apporte de valeur qu'avec plusieurs fournisseurs de stockage et n'est pas nécessaire ici.
