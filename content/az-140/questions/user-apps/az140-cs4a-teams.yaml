id: az140-cs4a-teams
objective: "3.3.7"
type: multi
caseStudy: az140-cs4a-woodgrove-bank
difficulty: 3
status: draft
stem:
  en: |
    You are adding Microsoft Teams to the image template of HP-Agents. The Microsoft Visual C++ Redistributable and a supported FSLogix version are already in the image.

    You need to meet the Teams requirement.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez Microsoft Teams au modèle d'image de HP-Agents. Microsoft Visual C++ Redistributable et une version prise en charge de FSLogix figurent déjà dans l'image.

    Vous devez satisfaire l'exigence relative à Teams.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Install the Remote Desktop WebRTC Redirector Service.", fr: "Installer le service Remote Desktop WebRTC Redirector." } }
    - { id: b, text: { en: "Install the multimedia redirection host component.", fr: "Installer le composant hôte de la redirection multimédia." } }
    - { id: c, text: { en: "Install the new Teams app per-machine.", fr: "Installer la nouvelle application Teams par ordinateur." } }
    - { id: d, text: { en: "Add the audiocapturemode:i:1 and camerastoredirect:s:* RDP properties to HP-Agents.", fr: "Ajouter les propriétés RDP audiocapturemode:i:1 et camerastoredirect:s:* à HP-Agents." } }
    - { id: e, text: { en: "Set the IsWVDEnvironment DWORD value to 1 under HKLM\\SOFTWARE\\Microsoft\\Teams.", fr: "Définir la valeur DWORD IsWVDEnvironment sur 1 sous HKLM\\SOFTWARE\\Microsoft\\Teams." } }
    - { id: f, text: { en: "Install the new Teams app per-user at each agent's first sign-in.", fr: "Installer la nouvelle application Teams par utilisateur à la première connexion de chaque conseiller." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      The IsWVDEnvironment registry value tells Teams that it runs on Azure Virtual Desktop so that it can load media optimization. On a pooled host pool, Teams is installed per-machine in the image. New Teams uses SlimCore when the client supports it; the WebRTC Redirector Service lets devices without SlimCore support, such as the Liège thin clients, fall back to WebRTC media optimization.
    fr: |
      La valeur de Registre IsWVDEnvironment indique à Teams qu'il s'exécute sur Azure Virtual Desktop pour qu'il puisse charger l'optimisation multimédia. Sur un pool d'hôtes regroupé, Teams est installé par ordinateur dans l'image. La nouvelle application Teams utilise SlimCore quand le client le prend en charge ; le service WebRTC Redirector permet aux appareils sans prise en charge de SlimCore, comme les clients légers de Liège, de revenir à l'optimisation multimédia WebRTC.
  options:
    b: { en: "Multimedia redirection redirects video playback and calls of web pages opened in a browser on the session host; it doesn't optimize calls in the Teams app.", fr: "La redirection multimédia redirige la lecture vidéo et les appels des pages web ouvertes dans un navigateur de l'hôte de session ; elle n'optimise pas les appels de l'application Teams." }
    d: { en: "These RDP properties redirect audio input and cameras for Teams without media optimization; they aren't needed for optimized calls.", fr: "Ces propriétés RDP redirigent l'entrée audio et les caméras pour Teams sans optimisation multimédia ; elles ne sont pas nécessaires pour les appels optimisés." }
    f: { en: "Pooled host pools need a per-machine installation in the image; a per-user installation at sign-in doesn't meet the requirement to install Teams in the image.", fr: "Les pools d'hôtes regroupés exigent une installation par ordinateur dans l'image ; une installation par utilisateur à la connexion ne satisfait pas l'exigence d'installer Teams dans l'image." }
references:
  - title: Use Microsoft Teams on Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/teams-on-avd
