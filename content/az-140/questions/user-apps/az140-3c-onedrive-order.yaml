id: az140-3c-onedrive-order
objective: "3.3.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You are preparing a custom image for an Azure Virtual Desktop pooled host pool. Microsoft 365 Apps was installed in the image with the Office Deployment Tool without excluding OneDrive, so a per-user installation of the OneDrive sync app is present.

    You need to replace it with the installation that Microsoft documents for Azure Virtual Desktop session hosts. You have downloaded OneDriveSetup.exe to C:\Staging.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous préparez une image personnalisée pour un pool d'hôtes regroupé Azure Virtual Desktop. Microsoft 365 Apps a été installé dans l'image avec l'Outil de déploiement d'Office sans exclure OneDrive : une installation par utilisateur de l'application de synchronisation OneDrive est donc présente.

    Vous devez la remplacer par l'installation que Microsoft documente pour les hôtes de session Azure Virtual Desktop. Vous avez téléchargé OneDriveSetup.exe dans C:\Staging.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: uninst
      text:
        en: Run `C:\Staging\OneDriveSetup.exe /uninstall` from an elevated command prompt.
        fr: Exécuter `C:\Staging\OneDriveSetup.exe /uninstall` depuis une invite de commandes avec élévation de privilèges.
    - id: reg
      text:
        en: Set the `AllUsersInstall` DWORD value to 1 under `HKLM\Software\Microsoft\OneDrive`.
        fr: Définir la valeur DWORD `AllUsersInstall` sur 1 sous `HKLM\Software\Microsoft\OneDrive`.
    - id: install
      text:
        en: Run `C:\Staging\OneDriveSetup.exe /allusers`.
        fr: Exécuter `C:\Staging\OneDriveSetup.exe /allusers`.
    - id: silent
      text:
        en: Run `C:\Staging\OneDriveSetup.exe /silent`.
        fr: Exécuter `C:\Staging\OneDriveSetup.exe /silent`.
    - id: kfm
      text:
        en: Set the `KFMSilentOptIn` DWORD value to 1 under `HKLM\SOFTWARE\Policies\Microsoft\OneDrive`.
        fr: Définir la valeur DWORD `KFMSilentOptIn` sur 1 sous `HKLM\SOFTWARE\Policies\Microsoft\OneDrive`.
    - id: odt
      text:
        en: Reinstall Microsoft 365 Apps with a configuration that excludes Groove.
        fr: Réinstaller Microsoft 365 Apps avec une configuration qui exclut Groove.
answer:
  sequence: [uninst, reg, install]
explanation:
  correct:
    en: |
      Microsoft Learn first removes the per-user installation with `/uninstall`, then sets `AllUsersInstall` = 1 under HKLM\Software\Microsoft\OneDrive, and finally installs the sync app in per-machine mode with `/allusers`. Non-persistent session hosts require this per-machine installation.
    fr: |
      Microsoft Learn supprime d'abord l'installation par utilisateur avec `/uninstall`, définit ensuite `AllUsersInstall` = 1 sous HKLM\Software\Microsoft\OneDrive, puis installe l'application de synchronisation en mode par ordinateur avec `/allusers`. Les hôtes de session non persistants exigent cette installation par ordinateur.
  options:
    silent:
      en: /silent hides the setup interface but still installs OneDrive per user.
      fr: /silent masque l'interface d'installation mais installe toujours OneDrive par utilisateur.
    kfm:
      en: KFMSilentOptIn redirects known folders and takes the tenant ID as a string; it isn't part of the installation.
      fr: KFMSilentOptIn redirige les dossiers connus et attend l'ID du locataire sous forme de chaîne ; il ne fait pas partie de l'installation.
    odt:
      en: Groove is the previous sync client; excluding it doesn't remove the per-user OneDrive installation already present.
      fr: Groove est l'ancien client de synchronisation ; l'exclure ne supprime pas l'installation par utilisateur de OneDrive déjà présente.
references:
  - title: Install Office on a custom VHD image
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
