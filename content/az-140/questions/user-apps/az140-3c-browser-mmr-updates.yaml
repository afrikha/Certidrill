id: az140-3c-browser-mmr-updates
objective: "3.3.8"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1**. You install the Remote Desktop Multimedia Redirection Service on the session hosts by running its MSI file, and you force-install the multimedia redirection extension in Microsoft Edge by using a policy.

    Users must be able to watch internal training videos on `videos.contoso.com`, which isn't in the list of sites that multimedia redirection supports by default.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1**. Vous installez le service de redirection multimédia Bureau à distance sur les hôtes de session en exécutant son fichier MSI, et vous imposez l'installation de l'extension de redirection multimédia dans Microsoft Edge par une stratégie.

    Les utilisateurs doivent pouvoir regarder des vidéos de formation internes sur `videos.contoso.com`, qui ne figure pas dans la liste des sites pris en charge par défaut par la redirection multimédia.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Remote Desktop Multimedia Redirection Service on the session hosts updates itself when a new version is released.
        fr: Le service de redirection multimédia Bureau à distance des hôtes de session se met à jour lui-même quand une nouvelle version sort.
    - id: s2
      text:
        en: The multimedia redirection browser extension updates itself when a new version is released.
        fr: L'extension de navigateur de redirection multimédia se met à jour elle-même quand une nouvelle version sort.
    - id: s3
      text:
        en: Adding `*://videos.contoso.com` to `runtime_allowed_hosts` in the extension policy enables video playback redirection for videos.contoso.com.
        fr: Ajouter `*://videos.contoso.com` à `runtime_allowed_hosts` dans la stratégie de l'extension active la redirection de la lecture vidéo pour videos.contoso.com.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The multimedia redirection service doesn't update automatically: you run the newer MSI, which replaces the previous version. The browser extension updates automatically. An entry in runtime_allowed_hosts only lets the extension interact with the domain; to redirect video on a site that isn't supported by default, you add it to the AllowedVideoRedirectionSites registry policy.
    fr: |
      Le service de redirection multimédia ne se met pas à jour automatiquement : vous exécutez le MSI plus récent, qui remplace la version précédente. L'extension de navigateur se met à jour automatiquement. Une entrée dans runtime_allowed_hosts permet seulement à l'extension d'interagir avec le domaine ; pour rediriger la vidéo d'un site non pris en charge par défaut, vous l'ajoutez à la stratégie de Registre AllowedVideoRedirectionSites.
references:
  - title: Multimedia redirection for video playback and calls in a remote session
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection
