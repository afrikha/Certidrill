id: az140-3b-timeout-idle-end
objective: "3.2.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Virtual Desktop pooled host pool named **hp-shift**. The session hosts are domain-joined and receive a GPO named **GPO-AVD**.

    Users often leave their session connected but unused at the end of their shift. You need to configure GPO-AVD so that a session that receives no keyboard or mouse input for two hours is signed out at that point. Sessions must never remain in a disconnected state because of the time limit.

    Which two settings should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-shift**. Les hôtes de session sont joints au domaine et reçoivent un GPO nommé **GPO-AVD**.

    Les utilisateurs laissent souvent leur session connectée mais inutilisée à la fin de leur poste. Vous devez configurer GPO-AVD pour qu'une session qui ne reçoit aucune saisie clavier ou souris pendant deux heures soit fermée à ce moment-là. Les sessions ne doivent jamais rester à l'état déconnecté à cause de la limite de temps.

    Quels sont les deux paramètres à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set time limit for active but idle Remote Desktop Services sessions = 2 hours", fr: "Set time limit for active but idle Remote Desktop Services sessions = 2 heures" } }
    - { id: b, text: { en: "Set time limit for disconnected sessions = 2 hours", fr: "Set time limit for disconnected sessions = 2 heures" } }
    - { id: c, text: { en: "Interactive logon: Machine inactivity limit = 7200 seconds", fr: "Interactive logon: Machine inactivity limit = 7 200 secondes" } }
    - { id: d, text: { en: "Set time limit for active Remote Desktop Services sessions = 2 hours", fr: "Set time limit for active Remote Desktop Services sessions = 2 heures" } }
    - { id: e, text: { en: "End session when time limits are reached = Enabled", fr: "End session when time limits are reached = Enabled" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      The idle limit acts on sessions that are connected but receive no input. By default, reaching the limit disconnects the session; **End session when time limits are reached** makes Remote Desktop Services end the session instead, so it never stays disconnected.
    fr: |
      La limite d'inactivité agit sur les sessions connectées qui ne reçoivent aucune saisie. Par défaut, atteindre la limite déconnecte la session ; **End session when time limits are reached** fait en sorte que les services Bureau à distance ferment la session à la place, si bien qu'elle ne reste jamais déconnectée.
  options:
    b: { en: "The disconnected session limit only starts after a disconnection, so the session would stay disconnected first.", fr: "La limite de session déconnectée ne démarre qu'après une déconnexion : la session resterait d'abord déconnectée." }
    d: { en: "The active session limit counts the total session time, including time when the user is working.", fr: "La limite de session active compte la durée totale de la session, y compris quand l'utilisateur travaille." }
    c: { en: "The machine inactivity limit locks the session; it doesn't sign the user out.", fr: "La limite d'inactivité de l'ordinateur verrouille la session ; elle ne ferme pas la session de l'utilisateur." }
references:
  - title: ADMX_TerminalServer Policy CSP
    url: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-terminalserver
