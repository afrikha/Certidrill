id: az140-3a-mask-statements
objective: "3.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin plans to use FSLogix application masking on the session hosts of a host pool named **HP-Cloud**. The session hosts are Microsoft Entra joined, and some users are cloud-only Microsoft Entra ID accounts that don't exist in Active Directory.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin prévoit d'utiliser le masquage d'application FSLogix sur les hôtes de session d'un pool d'hôtes nommé **HP-Cloud**. Les hôtes de session sont joints à Microsoft Entra, et certains utilisateurs sont des comptes Microsoft Entra ID cloud uniquement qui n'existent pas dans Active Directory.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          You can assign a Rule Set to the cloud-only users directly by their Microsoft Entra ID accounts.
        fr: |-
          Vous pouvez attribuer un Rule Set directement aux utilisateurs cloud uniquement par leurs comptes Microsoft Entra ID.
    - id: s2
      text:
        en: |-
          A Rule Set assignment can target a network location, such as an IP address, instead of a user or group.
        fr: |-
          Une attribution de Rule Set peut cibler un emplacement réseau, comme une adresse IP, plutôt qu'un utilisateur ou un groupe.
    - id: s3
      text:
        en: |-
          An updated Rule Set takes effect only after the session hosts restart.
        fr: |-
          Un Rule Set mis à jour ne prend effet qu'après le redémarrage des hôtes de session.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      Rule Set assignments don't support Microsoft Entra ID cloud-only accounts; users and groups must be synchronized from Active Directory and the virtual machines need line of sight to a domain controller to resolve SIDs. Besides users and groups, assignments can target a process, a network location (IP address), a computer, a directory container or an environment variable. The FSLogix Apps Services uses Rule Set files immediately once they are copied to the Rules folder.
    fr: |-
      Les attributions de Rule Set ne prennent pas en charge les comptes Microsoft Entra ID cloud uniquement ; les utilisateurs et les groupes doivent être synchronisés depuis Active Directory, et les machines virtuelles doivent pouvoir joindre un contrôleur de domaine pour résoudre les SID. En plus des utilisateurs et des groupes, les attributions peuvent cibler un processus, un emplacement réseau (adresse IP), un ordinateur, un conteneur d'annuaire ou une variable d'environnement. FSLogix Apps Services utilise les fichiers du Rule Set immédiatement après leur copie dans le dossier Rules.
references:
  - title: FSLogix Apps RuleEditor and Rule Sets
    url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-apps-rule-editor-rule-sets
  - title: Create and Implement Rule Sets (Application Masking)
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-application-rule-sets
