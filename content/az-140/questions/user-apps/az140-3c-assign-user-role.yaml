id: az140-3c-assign-user-role
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1**. HP1 has a RemoteApp application group named **AG-Finance** that is registered to a workspace named **WS1**. The session hosts are joined to an Active Directory Domain Services (AD DS) domain.

    You need to ensure that the members of a group named **Finance-Users** can see and start the applications published in AG-Finance. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1**. HP1 possède un groupe d'applications RemoteApp nommé **AG-Finance**, inscrit dans un espace de travail nommé **WS1**. Les hôtes de session sont joints à un domaine Active Directory Domain Services (AD DS).

    Vous devez faire en sorte que les membres d'un groupe nommé **Finance-Users** puissent voir et lancer les applications publiées dans AG-Finance. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Desktop Virtualization Application Group Reader role on AG-Finance to Finance-Users.", fr: "Attribuer le rôle Desktop Virtualization Application Group Reader sur AG-Finance à Finance-Users." } }
    - { id: b, text: { en: "Assign the Desktop Virtualization User role on AG-Finance to Finance-Users.", fr: "Attribuer le rôle Desktop Virtualization User sur AG-Finance à Finance-Users." } }
    - { id: c, text: { en: "Assign the Desktop Virtualization Reader role on WS1 to Finance-Users.", fr: "Attribuer le rôle Desktop Virtualization Reader sur WS1 à Finance-Users." } }
    - { id: d, text: { en: "Assign the Desktop Virtualization User Session Operator role on HP1 to Finance-Users.", fr: "Attribuer le rôle Desktop Virtualization User Session Operator sur HP1 à Finance-Users." } }
answer: { optionId: b }
explanation:
  correct:
    en: Users get access to published resources through an assignment to the application group. The Desktop Virtualization User role carries the data action that lets a non-administrator use the applications of an application group, so assigning it to the group on AG-Finance is all that is needed.
    fr: Les utilisateurs accèdent aux ressources publiées grâce à une affectation au groupe d'applications. Le rôle Desktop Virtualization User contient l'action de données qui permet à un non-administrateur d'utiliser les applications d'un groupe d'applications ; l'attribuer au groupe sur AG-Finance suffit.
  options:
    a: { en: "This role only lets its holders view the application group in Azure; it doesn't let them use the applications.", fr: "Ce rôle permet seulement de consulter le groupe d'applications dans Azure ; il ne permet pas d'utiliser les applications." }
    c: { en: "Reading the workspace resource doesn't grant the right to use the applications of an application group.", fr: "La lecture de la ressource d'espace de travail ne donne pas le droit d'utiliser les applications d'un groupe d'applications." }
    d: { en: "This role lets administrators send messages, disconnect and sign out user sessions; it doesn't grant access to published applications.", fr: "Ce rôle permet aux administrateurs d'envoyer des messages, de déconnecter et de fermer les sessions des utilisateurs ; il ne donne pas accès aux applications publiées." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
