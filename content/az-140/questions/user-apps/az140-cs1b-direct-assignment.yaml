id: az140-cs1b-direct-assignment
objective: "3.2.11"
type: dropdown
caseStudy: az140-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    HP-Design is in a resource group named **RG-AVD**. You need to meet the assignment requirement.

    How should you complete the PowerShell commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    HP-Design se trouve dans un groupe de ressources nommé **RG-AVD**. Vous devez satisfaire l'exigence d'attribution.

    Comment devez-vous compléter les commandes PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Update-AzWvdHostPool -ResourceGroupName RG-AVD -Name HP-Design `
        -[[param]] [[value]]

    Update-AzWvdSessionHost -ResourceGroupName RG-AVD -HostPoolName HP-Design `
        -Name vm-design-07 -[[user]] "designer1@lucernepublishing.com"
  slots:
    - id: param
      options:
        - { id: lbtype, text: LoadBalancerType }
        - { id: assigntype, text: PersonalDesktopAssignmentType }
        - { id: preferred, text: PreferredAppGroupType }
    - id: value
      options:
        - { id: automatic, text: Automatic }
        - { id: persistent, text: Persistent }
        - { id: direct, text: Direct }
    - id: user
      options:
        - { id: assigned, text: AssignedUser }
        - { id: friendly, text: FriendlyName }
        - { id: allow, text: AllowNewSession }
answer:
  values: { param: assigntype, value: direct, user: assigned }
explanation:
  correct:
    en: |
      With the Direct assignment type, a user can connect to a personal host pool only after an administrator assigns a specific session host to them; Automatic assigns a desktop at the first connection. You set it with the PersonalDesktopAssignmentType parameter of Update-AzWvdHostPool, then assign vm-design-07 with the AssignedUser parameter of Update-AzWvdSessionHost.
    fr: |
      Avec le type d'attribution Direct, un utilisateur ne peut se connecter à un pool d'hôtes personnel qu'après qu'un administrateur lui a attribué un hôte de session précis ; Automatic attribue un bureau à la première connexion. Vous le définissez avec le paramètre PersonalDesktopAssignmentType d'Update-AzWvdHostPool, puis vous attribuez vm-design-07 avec le paramètre AssignedUser d'Update-AzWvdSessionHost.
  options:
    param: { en: "LoadBalancerType sets how sessions are distributed (Persistent for personal pools), and PreferredAppGroupType applies to pooled host pools.", fr: "LoadBalancerType définit la répartition des sessions (Persistent pour les pools personnels), et PreferredAppGroupType s'applique aux pools d'hôtes regroupés." }
    user: { en: "FriendlyName sets the display name of the desktop, and AllowNewSession controls drain mode; neither assigns a user.", fr: "FriendlyName définit le nom affiché du bureau, et AllowNewSession contrôle le mode drainage ; aucun n'attribue d'utilisateur." }
references:
  - title: Configure personal desktop assignment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
  - title: Update-AzWvdSessionHost
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/update-azwvdsessionhost
