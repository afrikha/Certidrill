id: az140-3c-remoteapp-some-hosts
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP3** that contains six session hosts named SH1 to SH6. You publish an application named **Tailspin Planner** in a RemoteApp application group of HP3 by using the file path `C:\Apps\Planner\planner.exe`.

    Some users can start Tailspin Planner, but others receive an error that the file can't be found. You discover that the errors occur only in sessions on SH4, SH5 and SH6, which you added to HP3 last week.

    You need to ensure that all users can start Tailspin Planner.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP3** qui contient six hôtes de session nommés SH1 à SH6. Vous publiez une application nommée **Tailspin Planner** dans un groupe d'applications RemoteApp de HP3 avec le chemin d'accès `C:\Apps\Planner\planner.exe`.

    Certains utilisateurs peuvent démarrer Tailspin Planner, mais d'autres reçoivent une erreur indiquant que le fichier est introuvable. Vous découvrez que les erreurs se produisent uniquement dans les sessions sur SH4, SH5 et SH6, que vous avez ajoutés à HP3 la semaine dernière.

    Vous devez faire en sorte que tous les utilisateurs puissent démarrer Tailspin Planner.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the application source of Tailspin Planner to Start menu.", fr: "Remplacer la source d'application de Tailspin Planner par Menu Démarrer." } }
    - { id: b, text: { en: "Change the load-balancing algorithm of HP3 to depth-first.", fr: "Remplacer l'algorithme d'équilibrage de charge de HP3 par profondeur d'abord (depth-first)." } }
    - { id: c, text: { en: "Assign the Desktop Virtualization User role on HP3 to the users.", fr: "Attribuer aux utilisateurs le rôle Desktop Virtualization User sur HP3." } }
    - { id: d, text: { en: "Install Tailspin Planner on SH4, SH5 and SH6.", fr: "Installer Tailspin Planner sur SH4, SH5 et SH6." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A RemoteApp starts the application from the session host that the user is load-balanced to, so the application must be installed on every session host of the host pool. The new session hosts don't have it, so install it on them (and in the image used to create new session hosts).
    fr: |
      Une RemoteApp démarre l'application sur l'hôte de session vers lequel l'utilisateur est dirigé par l'équilibrage de charge : l'application doit donc être installée sur chaque hôte de session du pool d'hôtes. Les nouveaux hôtes ne l'ont pas : installez-la sur ces hôtes (et dans l'image qui sert à créer les nouveaux hôtes).
  options:
    a:
      en: The Start menu source still runs the executable on the session host, which is missing on SH4 to SH6.
      fr: La source Menu Démarrer exécute toujours l'exécutable sur l'hôte de session, absent de SH4 à SH6.
    b:
      en: Depth-first changes how sessions are distributed, but users are still sent to SH4 to SH6 once the other hosts are full.
      fr: Profondeur d'abord modifie la répartition des sessions, mais les utilisateurs sont quand même envoyés vers SH4 à SH6 quand les autres hôtes sont pleins.
    c:
      en: The users already have access, since they can start the application on SH1 to SH3; the role is assigned on application groups, not on host pools.
      fr: Les utilisateurs ont déjà l'accès, puisqu'ils démarrent l'application sur SH1 à SH3 ; le rôle s'attribue sur les groupes d'applications, pas sur les pools d'hôtes.
references:
  - title: Publish applications with RemoteApp in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/manage-app-groups
