id: az140-3b-personal-direct
objective: "3.2.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is deploying an Azure Virtual Desktop host pool for 30 engineers. Each engineer must always connect to the same session host, and an administrator must decide which session host each engineer gets before the engineer's first connection.

    What should you configure?
  fr: |
    Proseware déploie un pool d'hôtes Azure Virtual Desktop pour 30 ingénieurs. Chaque ingénieur doit toujours se connecter au même hôte de session, et un administrateur doit décider de l'hôte de session de chaque ingénieur avant sa première connexion.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A personal host pool with the Automatic assignment type", fr: "Un pool d'hôtes personnel avec le type d'attribution Automatique" } }
    - { id: b, text: { en: "A pooled host pool with depth-first load balancing and a maximum session limit of 1", fr: "Un pool d'hôtes partagé avec l'équilibrage de charge profondeur d'abord et une limite maximale de 1 session" } }
    - { id: c, text: { en: "A personal host pool with the Direct assignment type", fr: "Un pool d'hôtes personnel avec le type d'attribution Direct" } }
    - { id: d, text: { en: "A pooled host pool with breadth-first load balancing and Start VM on Connect", fr: "Un pool d'hôtes partagé avec l'équilibrage de charge en largeur d'abord et Start VM on Connect" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A personal host pool dedicates each session host to one user. With the Direct assignment type, you assign each user to a specific session host yourself; a user who isn't assigned to a session host gets **No resources available**.
    fr: |
      Un pool d'hôtes personnel dédie chaque hôte de session à un utilisateur. Avec le type d'attribution Direct, vous attribuez vous-même chaque utilisateur à un hôte de session précis ; un utilisateur qui n'est attribué à aucun hôte de session reçoit **No resources available**.
  options:
    a: { en: "With Automatic, each user gets any available session host at first connection, so the administrator doesn't choose it.", fr: "Avec Automatique, chaque utilisateur obtient un hôte de session disponible quelconque à sa première connexion : l'administrateur ne le choisit pas." }
    b: { en: "A pooled host pool doesn't assign a session host to a user, so users can land on a different host each time.", fr: "Un pool d'hôtes partagé n'attribue pas d'hôte de session à un utilisateur : les utilisateurs peuvent arriver sur un hôte différent à chaque fois." }
    d: { en: "Breadth-first spreads sessions across hosts; it gives no persistent user-to-host assignment.", fr: "La largeur d'abord répartit les sessions entre les hôtes ; elle ne donne aucune attribution permanente d'un utilisateur à un hôte." }
references:
  - title: Configure personal desktop assignment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
