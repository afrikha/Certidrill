id: az140-3c-teams-verify
objective: "3.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** that runs new Microsoft Teams. You configure media optimization for Teams on the session hosts. A user named **User1** connects to HP1 from a Windows 11 device by using Windows App, restarts Teams, and opens **Settings > About Teams**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** qui exécute le nouveau Microsoft Teams. Vous configurez l'optimisation des médias pour Teams sur les hôtes de session. Un utilisateur nommé **User1** se connecte à HP1 depuis un appareil Windows 11 avec Windows App, redémarre Teams et ouvre **Paramètres > À propos de Teams**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the banner shows **AVD SlimCore Media Optimized**, the calls and meetings of User1 are processed on the local device.
        fr: Si la bannière affiche **AVD SlimCore Media Optimized**, les appels et réunions de User1 sont traités sur l'appareil local.
    - id: s2
      text:
        en: For User1 to use the local microphone in optimized Teams calls, you must also set the `audiocapturemode:i:1` RDP property on HP1.
        fr: Pour que User1 utilise le microphone local dans les appels Teams optimisés, vous devez aussi définir la propriété RDP `audiocapturemode:i:1` sur HP1.
    - id: s3
      text:
        en: If the banner shows **AVD Media not connected**, quitting and restarting Teams is the first troubleshooting step that Microsoft documents.
        fr: Si la bannière affiche **AVD Media not connected**, quitter puis redémarrer Teams est la première étape de dépannage documentée par Microsoft.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      AVD SlimCore Media Optimized (or AVD Media Optimized with the WebRTC Redirector Service) means that media optimization loaded, so audio and video are handled by the local device. Device redirection through RDP properties isn't required with media optimization; you set properties such as audiocapturemode:i:1 only for Teams without optimization. When the banner shows AVD Media not connected, Microsoft says to quit Teams and try again.
    fr: |
      AVD SlimCore Media Optimized (ou AVD Media Optimized avec le service redirecteur WebRTC) signifie que l'optimisation des médias s'est chargée : l'audio et la vidéo sont gérés par l'appareil local. La redirection des périphériques par les propriétés RDP n'est pas nécessaire avec l'optimisation des médias ; vous définissez des propriétés comme audiocapturemode:i:1 uniquement pour Teams sans optimisation. Quand la bannière affiche AVD Media not connected, Microsoft indique de quitter Teams et de réessayer.
references:
  - title: Use Microsoft Teams on Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/teams-on-avd
