id: az140-3b-session-lock
objective: "3.2.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure Virtual Desktop host pool named **hp-hq**. The session hosts run Windows 11 Enterprise multi-session with the latest cumulative updates and are enrolled in Microsoft Intune. Users connect by using single sign-on with Microsoft Entra ID. No session lock setting is configured.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-hq**. Les hôtes de session exécutent Windows 11 Entreprise multisession avec les dernières mises à jour cumulatives et sont inscrits dans Microsoft Intune. Les utilisateurs se connectent par authentification unique avec Microsoft Entra ID. Aucun paramètre de verrouillage de session n'est configuré.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a user locks the remote session, the session shows the remote lock screen.
        fr: Quand un utilisateur verrouille la session distante, la session affiche l'écran de verrouillage distant.
    - id: s2
      text:
        en: To show the remote lock screen instead, you set Disconnect remote session on lock for Microsoft identity platform authentication to Disabled.
        fr: Pour afficher plutôt l'écran de verrouillage distant, vous définissez Disconnect remote session on lock for Microsoft identity platform authentication sur Disabled.
    - id: s3
      text:
        en: When a user reconnects after the session was disconnected on lock, Conditional Access policies such as sign-in frequency are skipped.
        fr: Quand un utilisateur se reconnecte après une déconnexion au verrouillage, les stratégies d'accès conditionnel comme la fréquence de connexion sont ignorées.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      With single sign-on through Microsoft Entra ID, the default is to disconnect the session when it locks; the remote lock screen is the default only for legacy authentication. The setting **Disconnect remote session on lock for Microsoft identity platform authentication** (Remote Desktop Session Host > Security) set to Disabled shows the remote lock screen. Disconnecting makes the user reconnect through Microsoft Entra ID, so Conditional Access, including MFA and sign-in frequency, is evaluated again.
    fr: |
      Avec l'authentification unique par Microsoft Entra ID, le comportement par défaut est de déconnecter la session quand elle se verrouille ; l'écran de verrouillage distant n'est le comportement par défaut que pour l'authentification héritée. Le paramètre **Disconnect remote session on lock for Microsoft identity platform authentication** (Remote Desktop Session Host > Security) défini sur Disabled affiche l'écran de verrouillage distant. La déconnexion oblige l'utilisateur à se reconnecter par Microsoft Entra ID : l'accès conditionnel, y compris la MFA et la fréquence de connexion, est donc réévalué.
references:
  - title: Configure the session lock behavior for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-session-lock-behavior
