id: az140-3c-assign-feed-missing
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You create an Azure Virtual Desktop pooled host pool named **HP2** in the Azure portal by using the default settings, and you assign a group named **Sales** to the desktop application group of HP2.

    Later, you use Azure PowerShell to create a RemoteApp application group named **HP2-Apps** for HP2. You publish three applications in HP2-Apps and assign the Desktop Virtualization User role on HP2-Apps to Sales.

    Sales users report that Windows App shows the HP2 desktop, but none of the three applications.

    Which two issues could cause this behavior?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP2** dans le portail Azure avec les paramètres par défaut, et vous affectez un groupe nommé **Sales** au groupe d'applications de bureau de HP2.

    Plus tard, vous utilisez Azure PowerShell pour créer un groupe d'applications RemoteApp nommé **HP2-Apps** pour HP2. Vous publiez trois applications dans HP2-Apps et vous attribuez le rôle Desktop Virtualization User sur HP2-Apps à Sales.

    Les utilisateurs de Sales signalent que Windows App affiche le bureau de HP2, mais aucune des trois applications.

    Quels sont les deux problèmes qui peuvent expliquer ce comportement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "HP2-Apps isn't registered to a workspace.", fr: "HP2-Apps n'est inscrit dans aucun espace de travail." } }
    - { id: b, text: { en: "The Desktop Virtualization User role is assigned to a group instead of to individual users.", fr: "Le rôle Desktop Virtualization User est attribué à un groupe et non à des utilisateurs individuels." } }
    - { id: c, text: { en: "The preferred application group type of HP2 is set to Desktop.", fr: "Le type de groupe d'applications préféré de HP2 est défini sur Desktop." } }
    - { id: d, text: { en: "All the session hosts of HP2 are in drain mode.", fr: "Tous les hôtes de session de HP2 sont en mode drainage." } }
    - { id: e, text: { en: "Start VM on Connect isn't enabled on HP2.", fr: "Start VM on Connect n'est pas activé sur HP2." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: An application group must be associated with a workspace for users to see its resources, and creating the group with PowerShell doesn't register it. The portal also sets the preferred application group type to Desktop by default; users assigned to both the desktop and a RemoteApp application group of the same host pool then see only the desktop.
    fr: "Un groupe d'applications doit être associé à un espace de travail pour que les utilisateurs voient ses ressources, et la création du groupe avec PowerShell ne l'inscrit pas. Par ailleurs, le portail définit par défaut le type de groupe d'applications préféré sur Desktop : les utilisateurs affectés à la fois au groupe de bureau et à un groupe RemoteApp du même pool d'hôtes ne voient alors que le bureau."
  options:
    b: { en: "Assigning application groups to Microsoft Entra groups is supported and recommended.", fr: "L'affectation de groupes d'applications à des groupes Microsoft Entra est prise en charge et recommandée." }
    d: { en: "Drain mode blocks new sessions on the session hosts; it doesn't remove published applications from the users' feed.", fr: "Le mode drainage bloque les nouvelles sessions sur les hôtes ; il ne retire pas les applications publiées du flux des utilisateurs." }
    e: { en: "Start VM on Connect powers on deallocated session hosts when a user connects; it has no effect on which resources the feed shows.", fr: "Start VM on Connect démarre les hôtes de session libérés quand un utilisateur se connecte ; il n'a aucun effet sur les ressources affichées dans le flux." }
references:
  - title: Preferred application group type behavior for pooled host pools in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/preferred-application-group-type
  - title: Azure Virtual Desktop terminology
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/environment-setup
