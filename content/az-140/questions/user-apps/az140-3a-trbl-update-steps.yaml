id: az140-3a-trbl-update-steps
objective: "3.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A Windows device named **DEV7** runs Windows App installed from the standalone MSIX package. After the latest update, a line-of-business accessory stopped working in remote sessions, and support asks you to stop all Windows App updates on DEV7 while the vendor investigates. Windows App is currently open on DEV7.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un appareil Windows nommé **DEV7** exécute Windows App installé à partir du package MSIX autonome. Après la dernière mise à jour, un accessoire métier a cessé de fonctionner dans les sessions distantes, et le support vous demande d'arrêter toutes les mises à jour de Windows App sur DEV7 pendant que le fournisseur enquête. Windows App est actuellement ouvert sur DEV7.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: close
      text:
        en: |-
          Close Windows App.
        fr: |-
          Fermer Windows App.
    - id: reg
      text:
        en: |-
          From an elevated PowerShell prompt, set DisableAutomaticUpdates to 1 under HKLM\SOFTWARE\Microsoft\WindowsApp.
        fr: |-
          Depuis une invite PowerShell avec élévation de privilèges, définir DisableAutomaticUpdates sur 1 sous HKLM\SOFTWARE\Microsoft\WindowsApp.
    - id: start
      text:
        en: |-
          Start Windows App.
        fr: |-
          Démarrer Windows App.
    - id: restart
      text:
        en: |-
          Restart DEV7 to apply the registry change.
        fr: |-
          Redémarrer DEV7 pour appliquer la modification du Registre.
    - id: hkcu
      text:
        en: |-
          From a standard PowerShell prompt, set DisableAutomaticUpdates to 1 under HKCU\SOFTWARE\Microsoft\WindowsApp.
        fr: |-
          Depuis une invite PowerShell standard, définir DisableAutomaticUpdates sur 1 sous HKCU\SOFTWARE\Microsoft\WindowsApp.
    - id: reset
      text:
        en: |-
          Reset Windows App from Windows Settings.
        fr: |-
          Réinitialiser Windows App depuis les Paramètres Windows.
answer:
  sequence: [ close, reg, start ]
explanation:
  correct:
    en: |-
      The documented procedure is to close Windows App, then set the REG_DWORD value DisableAutomaticUpdates under HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\WindowsApp from an administrator PowerShell prompt; the value 1 disables updates from all locations. No restart is needed, because Windows App uses the configured behavior the next time it starts.
    fr: |-
      La procédure documentée consiste à fermer Windows App, puis à définir la valeur REG_DWORD DisableAutomaticUpdates sous HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\WindowsApp depuis une invite PowerShell d'administrateur ; la valeur 1 désactive les mises à jour depuis tous les emplacements. Aucun redémarrage n'est nécessaire, car Windows App utilise le comportement configuré à son prochain démarrage.
  options:
    restart:
      en: |-
        The device doesn't need to restart for the change to take effect.
      fr: |-
        L'appareil n'a pas besoin de redémarrer pour que la modification prenne effet.
    hkcu:
      en: |-
        The value is read from HKEY_LOCAL_MACHINE, which requires administrative permissions to modify.
      fr: |-
        La valeur est lue dans HKEY_LOCAL_MACHINE, dont la modification exige des autorisations d'administrateur.
    reset:
      en: |-
        Resetting the app removes its data but doesn't change the update behavior.
      fr: |-
        La réinitialisation de l'application supprime ses données mais ne modifie pas le comportement de mise à jour.
references:
  - title: Configure Windows App Updates on Windows
    url: https://learn.microsoft.com/en-us/windows-app/configure-updates-windows
