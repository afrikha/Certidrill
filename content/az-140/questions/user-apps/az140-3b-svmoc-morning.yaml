id: az140-3b-svmoc-morning
objective: "3.2.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Virtual Desktop pooled host pool named **hp-call** that contains 12 session hosts. A runbook deallocates all the session hosts at 20:00. Start VM on Connect is enabled and works.

    At 08:00, about 60 agents connect within a few minutes. Many of them receive **No resources available** and must retry several times before they get a session.

    You need to ensure that agents get a session at 08:00 without retrying. The session hosts must remain deallocated at night. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-call** qui contient 12 hôtes de session. Un runbook libère tous les hôtes de session à 20:00. Start VM on Connect est activé et fonctionne.

    À 08:00, environ 60 agents se connectent en quelques minutes. Beaucoup d'entre eux reçoivent **No resources available** et doivent réessayer plusieurs fois avant d'obtenir une session.

    Vous devez faire en sorte que les agents obtiennent une session à 08:00 sans réessayer. Les hôtes de session doivent rester libérés la nuit. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Desktop Virtualization Power On Contributor role to the group of agents.", fr: "Attribuer le rôle Desktop Virtualization Power On Contributor au groupe des agents." } }
    - { id: b, text: { en: "Change the load-balancing algorithm of hp-call to depth-first.", fr: "Remplacer l'algorithme d'équilibrage de charge de hp-call par le mode profondeur d'abord (depth-first)." } }
    - { id: c, text: { en: "Assign a scaling plan to hp-call with a ramp-up phase that starts before 08:00.", fr: "Attribuer à hp-call un plan de mise à l'échelle avec une phase de montée en charge qui commence avant 08:00." } }
    - { id: d, text: { en: "Reassign the Desktop Virtualization Power On Contributor role at the subscription scope.", fr: "Réattribuer le rôle Desktop Virtualization Power On Contributor à l'étendue de l'abonnement." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For pooled host pools, Start VM on Connect starts at most one VM every five minutes, and users who connect meanwhile get **No resources available**. It suits occasional connections, not a morning rush. An autoscale scaling plan starts the session hosts on a schedule during ramp-up, so capacity is ready at 08:00, and it can also deallocate them in the evening.
    fr: |
      Pour les pools d'hôtes partagés, Start VM on Connect démarre au plus une machine virtuelle toutes les cinq minutes, et les utilisateurs qui se connectent entre-temps reçoivent **No resources available**. Il convient aux connexions occasionnelles, pas à l'afflux du matin. Un plan de mise à l'échelle automatique démarre les hôtes de session selon une planification pendant la montée en charge : la capacité est prête à 08:00, et le plan peut aussi les libérer le soir.
  options:
    a: { en: "The role is for the Azure Virtual Desktop service principal or the host pool managed identity; giving it to users doesn't speed up starts.", fr: "Le rôle est destiné au principal de service Azure Virtual Desktop ou à l'identité managée du pool d'hôtes ; le donner aux utilisateurs n'accélère pas les démarrages." }
    b: { en: "Depth-first fills each running host before using the next one, but Start VM on Connect still starts at most one VM every five minutes.", fr: "Le mode profondeur d'abord remplit chaque hôte en cours d'exécution avant le suivant, mais Start VM on Connect démarre toujours au plus une machine virtuelle toutes les cinq minutes." }
    d: { en: "Start VM on Connect already works, so the scope of the role isn't the problem.", fr: "Start VM on Connect fonctionne déjà : l'étendue du rôle n'est pas en cause." }
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
