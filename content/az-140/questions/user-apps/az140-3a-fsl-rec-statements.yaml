id: az140-3a-fsl-rec-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is designing FSLogix for several Azure Virtual Desktop host pools. Some users synchronize large OneDrive libraries.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit FSLogix pour plusieurs pools d'hôtes Azure Virtual Desktop. Certains utilisateurs synchronisent de grandes bibliothèques OneDrive.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          A profile container combined with an ODFC container lets you give the Microsoft 365 app data a larger maximum size than the rest of the profile, for example 50 GB and 10 GB.
        fr: |-
          Un conteneur de profil combiné à un conteneur ODFC permet de donner aux données des applications Microsoft 365 une taille maximale supérieure à celle du reste du profil, par exemple 50 Go et 10 Go.
    - id: s2
      text:
        en: |-
          Listing two Azure Files shares in VHDLocations keeps each user's existing profile available if the first share becomes unreachable.
        fr: |-
          Indiquer deux partages Azure Files dans VHDLocations permet de conserver le profil existant de chaque utilisateur disponible si le premier partage devient inaccessible.
    - id: s3
      text:
        en: |-
          Setting ProfileType to 3 is a supported way to let users open two concurrent sessions in the same Azure Virtual Desktop host pool with the same profile container.
        fr: |-
          Définir ProfileType sur 3 est une méthode prise en charge pour permettre aux utilisateurs d'ouvrir deux sessions simultanées dans le même pool d'hôtes Azure Virtual Desktop avec le même conteneur de profil.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      A dual-container design stores Office data separately and lets each container have its own size, such as a 10 GB profile container and a 50 GB ODFC container. Multiple VHDLocations entries provide no resiliency, because FSLogix uses the first location it can reach and creates a new profile there if the usual one is down. Azure Virtual Desktop doesn't support multiple connections to the same profile within the same host pool.
    fr: |-
      Une conception à double conteneur stocke les données Office séparément et permet de donner à chaque conteneur sa propre taille, par exemple un conteneur de profil de 10 Go et un conteneur ODFC de 50 Go. Plusieurs entrées VHDLocations n'apportent aucune résilience : FSLogix utilise le premier emplacement qu'il peut joindre et y crée un nouveau profil si l'emplacement habituel est indisponible. Azure Virtual Desktop ne prend pas en charge plusieurs connexions au même profil dans un même pool d'hôtes.
references:
  - title: Types of containers
    url: https://learn.microsoft.com/en-us/fslogix/concepts-container-types
  - title: Configuration Examples
    url: https://learn.microsoft.com/en-us/fslogix/concepts-configuration-examples
