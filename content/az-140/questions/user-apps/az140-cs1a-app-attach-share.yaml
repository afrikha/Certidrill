id: az140-cs1a-app-attach-share
objective: "3.3.9"
type: single
caseStudy: az140-cs1a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You add ClaimsDesk as an App attach application and assign it to HP-Claims and to AVD-Claims. You need to ensure that the session hosts can attach the disk image from the appattach share. The solution must meet the application requirement.

    What should you do?
  fr: |
    Vous ajoutez ClaimsDesk comme application App attach et vous l'attribuez à HP-Claims et à AVD-Claims. Vous devez faire en sorte que les hôtes de session puissent attacher l'image disque depuis le partage appattach. La solution doit respecter l'exigence relative aux applications.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set Storage File Data SMB Share Reader as the default share-level permission, and grant the session host computer accounts NTFS read access.", fr: "Définir Storage File Data SMB Share Reader comme autorisation par défaut au niveau du partage, et accorder aux comptes d'ordinateur des hôtes de session l'accès NTFS en lecture." } }
    - { id: b, text: { en: "Assign Storage File Data SMB Share Reader on the share to AVD-Claims, and grant AVD-Claims NTFS read access.", fr: "Attribuer Storage File Data SMB Share Reader sur le partage à AVD-Claims, et accorder à AVD-Claims l'accès NTFS en lecture." } }
    - { id: c, text: { en: "Assign Reader and Data Access on stappattach to the Azure Virtual Desktop and Azure Virtual Desktop ARM Provider service principals.", fr: "Attribuer Reader and Data Access sur stappattach aux principaux de service Azure Virtual Desktop et Azure Virtual Desktop ARM Provider." } }
    - { id: d, text: { en: "Set Storage File Data SMB Share Elevated Contributor as the default share-level permission, and grant the session host computer accounts NTFS full control.", fr: "Définir Storage File Data SMB Share Elevated Contributor comme autorisation par défaut au niveau du partage, et accorder aux comptes d'ordinateur des hôtes de session le contrôle total NTFS." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      App attach mounts disk images in the context of the session host computer account, so the computer accounts need read access through both share and NTFS permissions. With Azure Files and AD DS, computer accounts are not synchronized to Microsoft Entra ID, so you grant the share-level access with the Storage File Data SMB Share Reader default share-level permission and then grant NTFS read access to the computer objects.
    fr: |
      App attach monte les images disque dans le contexte du compte d'ordinateur de l'hôte de session : les comptes d'ordinateur ont donc besoin d'un accès en lecture par les autorisations de partage et NTFS. Avec Azure Files et AD DS, les comptes d'ordinateur ne sont pas synchronisés avec Microsoft Entra ID : vous accordez l'accès au niveau du partage avec l'autorisation par défaut Storage File Data SMB Share Reader, puis l'accès NTFS en lecture aux objets ordinateur.
  options:
    b: { en: "The images are mounted by the session hosts, not by the users, so permissions granted to AVD-Claims alone do not let the hosts attach the image.", fr: "Les images sont montées par les hôtes de session, pas par les utilisateurs : des autorisations accordées uniquement à AVD-Claims ne permettent pas aux hôtes d'attacher l'image." }
    c: { en: "These service principal assignments are the method for Microsoft Entra joined session hosts; the HP-Claims hosts are hybrid joined and the share uses AD DS authentication.", fr: "Ces attributions aux principaux de service correspondent à la méthode pour les hôtes de session joints à Microsoft Entra ; les hôtes de HP-Claims sont joints hybrides et le partage utilise l'authentification AD DS." }
    d: { en: "Mounting an image only needs read access; Elevated Contributor and full control grant far more than required.", fr: "Le montage d'une image ne demande qu'un accès en lecture ; Elevated Contributor et le contrôle total accordent bien plus que nécessaire." }
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
