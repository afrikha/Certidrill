id: az140-3a-client-ipad
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Field technicians at Adatum connect to a pooled host pool named **HP-Field** by using Windows App on their iPads. The host pool RDP properties allow every redirection that the client supports.

    Which two features can the technicians use in their remote sessions?

    NOTE: Each correct selection is worth one point.
  fr: |
    Les techniciens terrain d'Adatum se connectent à un pool d'hôtes partagé nommé **HP-Field** à l'aide de Windows App sur leurs iPad. Les propriétés RDP du pool d'hôtes autorisent toutes les redirections prises en charge par le client.

    Quelles sont les deux fonctionnalités que les techniciens peuvent utiliser dans leurs sessions distantes ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Redirection of the iPad camera
        fr: |-
          La redirection de la caméra de l'iPad
    - id: b
      text:
        en: |-
          Redirection of the printers configured on the iPad
        fr: |-
          La redirection des imprimantes configurées sur l'iPad
    - id: c
      text:
        en: |-
          Multimedia redirection of video playback in the browser
        fr: |-
          La redirection multimédia de la lecture vidéo dans le navigateur
    - id: d
      text:
        en: |-
          Microsoft Teams media optimizations (WebRTC)
        fr: |-
          Les optimisations multimédias de Microsoft Teams (WebRTC)
    - id: e
      text:
        en: |-
          A remote desktop spanning multiple monitors
        fr: |-
          Un bureau distant réparti sur plusieurs moniteurs
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Windows App on iOS/iPadOS supports camera redirection and the Microsoft Teams media optimizations based on WebRTC.
    fr: |-
      Windows App sur iOS/iPadOS prend en charge la redirection de caméra et les optimisations multimédias de Microsoft Teams basées sur WebRTC.
  options:
    b:
      en: |-
        Printer redirection isn't available on iOS/iPadOS; Universal Print is the usual alternative for these devices.
      fr: |-
        La redirection d'imprimantes n'est pas disponible sur iOS/iPadOS ; l'impression universelle est l'alternative habituelle pour ces appareils.
    c:
      en: |-
        Multimedia redirection for video playback and calls is available only in Windows App on Windows.
      fr: |-
        La redirection multimédia de la lecture vidéo et des appels n'est disponible que dans Windows App sur Windows.
    e:
      en: |-
        Multiple monitors are supported on Windows and macOS only; iOS/iPadOS supports an external monitor, not a session spanning several.
      fr: |-
        Plusieurs moniteurs ne sont pris en charge que sur Windows et macOS ; iOS/iPadOS prend en charge un moniteur externe, pas une session répartie sur plusieurs.
references:
  - title: Compare Windows App features across platforms and devices
    url: https://learn.microsoft.com/en-us/windows-app/compare-platforms-features
