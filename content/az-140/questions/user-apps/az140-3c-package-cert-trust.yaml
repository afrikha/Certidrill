id: az140-3c-package-cert-trust
objective: "3.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop test host pool named **HP-Test**. You package an application as MSIX, sign the package with a self-signed certificate, create a CIM disk image, and add the package in App attach for HP-Test.

    When users sign in, the package fails to stage on the session hosts because the certificate isn't trusted.

    You need to ensure that the package stages successfully on the session hosts of HP-Test. The self-signed certificate must be used only for this test.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes de test Azure Virtual Desktop nommé **HP-Test**. Vous empaquetez une application au format MSIX, vous signez le package avec un certificat auto-signé, vous créez une image disque CIM et vous ajoutez le package dans App attach pour HP-Test.

    Quand les utilisateurs se connectent, la préparation du package échoue sur les hôtes de session parce que le certificat n'est pas approuvé.

    Vous devez faire en sorte que la préparation du package réussisse sur les hôtes de session de HP-Test. Le certificat auto-signé doit être utilisé uniquement pour ce test.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Import the certificate into the Personal store of each user who is assigned the package.", fr: "Importer le certificat dans le magasin Personnel de chaque utilisateur affecté au package." } }
    - { id: b, text: { en: "Re-create the CIM image by running MSIXMGR with the -validateSignature parameter.", fr: "Recréer l'image CIM en exécutant MSIXMGR avec le paramètre -validateSignature." } }
    - { id: c, text: { en: "Set the registration type of the package to Log on blocking.", fr: "Définir le type d'inscription du package sur Log on blocking." } }
    - { id: d, text: { en: "Install the certificate in the Trusted Root Certification Authorities store on each session host of HP-Test.", fr: "Installer le certificat dans le magasin Autorités de certification racines de confiance de chaque hôte de session de HP-Test." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Every MSIX and Appx package is signed, and the session hosts must trust the certificate chain. For a self-signed certificate, Microsoft Learn says to install the trusted root in the Trusted Root Certification Authorities store on each session host, and not to distribute it broadly with Group Policy or Intune because it should be used only for testing.
    fr: |
      Chaque package MSIX et Appx est signé, et les hôtes de session doivent approuver la chaîne de certificats. Pour un certificat auto-signé, Microsoft Learn indique d'installer la racine de confiance dans le magasin Autorités de certification racines de confiance de chaque hôte de session, et de ne pas le distribuer largement par stratégie de groupe ou Intune, car il ne doit servir qu'aux tests.
  options:
    a:
      en: Staging is done by the session host, which needs the root in the computer's trusted root store, not in users' personal stores.
      fr: La préparation est effectuée par l'hôte de session, qui a besoin de la racine dans le magasin racine de confiance de l'ordinateur, pas dans le magasin personnel des utilisateurs.
    b:
      en: -validateSignature only checks the signature before unpacking, and it requires the certificate to be installed already; it doesn't make the session hosts trust it.
      fr: -validateSignature vérifie seulement la signature avant la décompression, et exige que le certificat soit déjà installé ; il ne le fait pas approuver par les hôtes de session.
    c:
      en: The registration type changes when the application registers, not whether its certificate is trusted.
      fr: Le type d'inscription change le moment de l'inscription de l'application, pas l'approbation de son certificat.
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
  - title: MSIXMGR tool parameters
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/msixmgr-tool-syntax-description
