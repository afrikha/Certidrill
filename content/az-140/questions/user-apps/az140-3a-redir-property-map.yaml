id: az140-3a-redir-property-map
objective: "3.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware needs to configure the RDP properties of a host pool named **HP-Media** to meet the following requirements. The session hosts allow all redirections.

    Which RDP property should you set for each requirement? To answer, drag the appropriate RDP properties to the correct requirements. Each RDP property may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware doit configurer les propriétés RDP d'un pool d'hôtes nommé **HP-Media** pour répondre aux exigences suivantes. Les hôtes de session autorisent toutes les redirections.

    Quelle propriété RDP devez-vous définir pour chaque exigence ? Pour répondre, faites glisser les propriétés RDP appropriées vers les exigences correspondantes. Chaque propriété RDP peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: cam, text: 'camerastoredirect:s:*' }
    - { id: mtp, text: 'devicestoredirect:s:*' }
    - { id: loc, text: 'redirectlocation:i:1' }
    - { id: mic, text: 'audiocapturemode:i:1' }
    - { id: audio, text: 'audiomode:i:1' }
    - { id: usb, text: 'usbdevicestoredirect:s:*' }
  targets:
    - id: t1
      text:
        en: |-
          Use the local webcam for video calls in the session.
        fr: |-
          Utiliser la webcam locale pour les appels vidéo dans la session.
    - id: t2
      text:
        en: |-
          Import photos from a digital camera that uses the Picture Transfer Protocol (PTP).
        fr: |-
          Importer des photos depuis un appareil photo numérique qui utilise le protocole PTP (Picture Transfer Protocol).
    - id: t3
      text:
        en: |-
          Let apps in the session use the location of the local device.
        fr: |-
          Permettre aux applications de la session d'utiliser l'emplacement de l'appareil local.
    - id: t4
      text:
        en: |-
          Capture audio from the local microphone in the session.
        fr: |-
          Capturer l'audio du microphone local dans la session.
answer:
  mapping: { t1: cam, t2: mtp, t3: loc, t4: mic }
explanation:
  correct:
    en: |-
      camerastoredirect selects the cameras to redirect (* for all). devicestoredirect controls MTP and PTP peripherals such as digital cameras (its default is already *). redirectlocation:i:1 makes the session use the location of the local device instead of the session host. audiocapturemode:i:1 enables audio capture from the local device, which is off by default.
    fr: |-
      camerastoredirect sélectionne les caméras à rediriger (* pour toutes). devicestoredirect contrôle les périphériques MTP et PTP comme les appareils photo numériques (sa valeur par défaut est déjà *). redirectlocation:i:1 fait utiliser à la session l'emplacement de l'appareil local plutôt que celui de l'hôte de session. audiocapturemode:i:1 active la capture audio depuis l'appareil local, désactivée par défaut.
  options:
    audio:
      en: |-
        audiomode:i:1 plays the sound in the remote session instead of on the local device; it doesn't capture the microphone.
      fr: |-
        audiomode:i:1 lit le son dans la session distante plutôt que sur l'appareil local ; il ne capture pas le microphone.
    usb:
      en: |-
        usbdevicestoredirect uses opaque low-level redirection, which is a fallback for devices without high-level redirection; cameras and microphones use high-level redirection.
      fr: |-
        usbdevicestoredirect utilise la redirection opaque de bas niveau, solution de repli pour les périphériques sans redirection de haut niveau ; les caméras et les microphones utilisent la redirection de haut niveau.
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
  - title: Peripheral and resource redirection over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-remote-desktop-protocol
