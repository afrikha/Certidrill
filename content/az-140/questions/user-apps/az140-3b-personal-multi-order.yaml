id: az140-3b-personal-multi-order
objective: "3.2.11"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop personal host pool named **hp-eng** that uses the Automatic assignment type. A user named User1 is assigned to the desktop application group of hp-eng.

    User1 needs two personal desktops in hp-eng: the unassigned session hosts **SH5** (standard) and **SH6** (GPU). You plan to use the Azure portal.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un pool d'hôtes personnel Azure Virtual Desktop nommé **hp-eng** qui utilise le type d'attribution Automatique. Un utilisateur nommé User1 est affecté au groupe d'applications de bureau de hp-eng.

    User1 a besoin de deux bureaux personnels dans hp-eng : les hôtes de session non attribués **SH5** (standard) et **SH6** (GPU). Vous prévoyez d'utiliser le portail Azure.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: direct, text: { en: "In the host pool **Properties**, set the assignment type to **Direct** and save.", fr: "Dans les **Propriétés** du pool d'hôtes, définir le type d'attribution sur **Direct** et enregistrer." } }
    - { id: multiple, text: { en: "In the host pool **Properties**, select **Assign multiple desktops to a single user** and save.", fr: "Dans les **Propriétés** du pool d'hôtes, sélectionner **Assign multiple desktops to a single user** et enregistrer." } }
    - { id: assign, text: { en: "In **Session hosts**, assign SH5 and SH6 to User1 by using **Assignment > Assign user**.", fr: "Dans **Session hosts**, attribuer SH5 et SH6 à User1 avec **Assignment > Assign user**." } }
    - { id: both, text: { en: "In the host pool **Properties**, set the assignment type to **Direct**, select **Assign multiple desktops to a single user**, and save once.", fr: "Dans les **Propriétés** du pool d'hôtes, définir le type d'attribution sur **Direct**, sélectionner **Assign multiple desktops to a single user** et enregistrer une seule fois." } }
    - { id: svmoc, text: { en: "In the host pool **Properties**, set **Start VM on connect** to **Yes**.", fr: "Dans les **Propriétés** du pool d'hôtes, définir **Start VM on connect** sur **Yes**." } }
    - { id: dag, text: { en: "Create a second desktop application group in hp-eng and assign User1 to it.", fr: "Créer un second groupe d'applications de bureau dans hp-eng et y affecter User1." } }
answer:
  sequence: [ direct, multiple, assign ]
explanation:
  correct:
    en: |
      Multiple personal desktops per user require the Direct assignment type. You must save the Direct assignment type first: changing the type and selecting **Assign multiple desktops to a single user** in the same save returns an error. Then you assign each session host to the user. The setting can't be disabled once enabled.
    fr: |
      Plusieurs bureaux personnels par utilisateur exigent le type d'attribution Direct. Vous devez d'abord enregistrer le type Direct : modifier le type et sélectionner **Assign multiple desktops to a single user** dans le même enregistrement renvoie une erreur. Ensuite, vous attribuez chaque hôte de session à l'utilisateur. Le paramètre ne peut plus être désactivé une fois activé.
  options:
    both: { en: "Changing the assignment type and enabling multiple desktops in one save returns an error.", fr: "Modifier le type d'attribution et activer plusieurs bureaux dans le même enregistrement renvoie une erreur." }
    svmoc: { en: "Start VM on Connect saves cost but isn't needed to assign several desktops.", fr: "Start VM on Connect réduit les coûts mais n'est pas nécessaire pour attribuer plusieurs bureaux." }
    dag: { en: "A host pool can have only one desktop application group.", fr: "Un pool d'hôtes ne peut avoir qu'un seul groupe d'applications de bureau." }
references:
  - title: Configure personal desktop assignment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
