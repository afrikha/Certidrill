id: az140-3b-print-block-intune
objective: "3.2.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Virtual Desktop host pool named **hp-kiosk**. The session hosts are Microsoft Entra joined and enrolled in Microsoft Intune, and they are members of a device group named **SG-Kiosk-Hosts**.

    You need to prevent printer redirection on the hp-kiosk session hosts even if an administrator later enables printer redirection in the RDP properties of hp-kiosk.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-kiosk**. Les hôtes de session sont joints à Microsoft Entra et inscrits dans Microsoft Intune, et ils sont membres d'un groupe d'appareils nommé **SG-Kiosk-Hosts**.

    Vous devez empêcher la redirection d'imprimante sur les hôtes de session de hp-kiosk, même si un administrateur active plus tard la redirection d'imprimante dans les propriétés RDP de hp-kiosk.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create a configuration profile for Windows 10 and later with the **Settings catalog** profile type.", fr: "Créer un profil de configuration pour Windows 10 et versions ultérieures avec le type de profil **Catalogue de paramètres**." } }
    - { id: setting, text: { en: "Add **Do not allow client printer redirection** from **Remote Desktop Session Host > Printer Redirection** and set it to **Enabled**.", fr: "Ajouter **Do not allow client printer redirection** depuis **Remote Desktop Session Host > Printer Redirection** et le définir sur **Enabled**." } }
    - { id: assign, text: { en: "Assign the profile to SG-Kiosk-Hosts and create it.", fr: "Attribuer le profil à SG-Kiosk-Hosts et le créer." } }
    - { id: restart, text: { en: "Restart the session hosts after the policy applies.", fr: "Redémarrer les hôtes de session une fois la stratégie appliquée." } }
    - { id: rdp, text: { en: "Set `redirectprinters:i:0` in the RDP properties of hp-kiosk.", fr: "Définir `redirectprinters:i:0` dans les propriétés RDP de hp-kiosk." } }
    - { id: local, text: { en: "Set the `DisablePrinterRedirection` registry value to 1 on the users' devices.", fr: "Définir la valeur de Registre `DisablePrinterRedirection` sur 1 sur les appareils des utilisateurs." } }
answer:
  sequence: [ create, setting, assign, restart ]
explanation:
  correct:
    en: |
      A session host policy is the control that an RDP property can't override, because the most restrictive setting wins. You create a settings catalog profile, add **Do not allow client printer redirection** set to **Enabled**, assign the profile to the device group of the session hosts, and restart the session hosts once the policy has applied.
    fr: |
      Une stratégie d'hôte de session est le contrôle qu'une propriété RDP ne peut pas outrepasser, car le paramètre le plus restrictif l'emporte. Vous créez un profil de catalogue de paramètres, ajoutez **Do not allow client printer redirection** défini sur **Enabled**, attribuez le profil au groupe d'appareils des hôtes de session, puis redémarrez les hôtes de session une fois la stratégie appliquée.
  options:
    rdp: { en: "The RDP property could be changed back by an administrator, which the requirement must withstand.", fr: "La propriété RDP pourrait être modifiée de nouveau par un administrateur, ce à quoi l'exigence doit résister." }
    local: { en: "The local device setting only affects the devices where it is set and doesn't control the session hosts.", fr: "Le paramètre de l'appareil local ne concerne que les appareils où il est défini et ne contrôle pas les hôtes de session." }
references:
  - title: Configure printer redirection over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-printers
