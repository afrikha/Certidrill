id: az140-3a-client-private-link
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove publishes desktops from a host pool named **HP-Secure**. Public network access is disabled on the host pool and on its workspace, and users connect through Azure Private Link from the corporate network.

    A new team works from managed Chromebooks connected to the corporate network. The team must connect to HP-Secure and must not use a public network path.

    What should the team use?
  fr: |
    Woodgrove publie des bureaux à partir d'un pool d'hôtes nommé **HP-Secure**. L'accès réseau public est désactivé sur le pool d'hôtes et sur son espace de travail, et les utilisateurs se connectent via Azure Private Link depuis le réseau d'entreprise.

    Une nouvelle équipe travaille sur des Chromebook managés connectés au réseau d'entreprise. L'équipe doit se connecter à HP-Secure sans emprunter de chemin réseau public.

    Que doit utiliser l'équipe ?
body:
  options:
    - id: a
      text:
        en: |-
          Windows App in Google Chrome on the Chromebooks
        fr: |-
          Windows App dans Google Chrome sur les Chromebook
    - id: b
      text:
        en: |-
          The Remote Desktop web client in Google Chrome on the Chromebooks
        fr: |-
          Le client web Bureau à distance dans Google Chrome sur les Chromebook
    - id: c
      text:
        en: |-
          Windows App in Microsoft Edge on the Chromebooks
        fr: |-
          Windows App dans Microsoft Edge sur les Chromebook
    - id: d
      text:
        en: |-
          Windows App for Android/Chrome OS installed on the Chromebooks
        fr: |-
          Windows App pour Android/Chrome OS installé sur les Chromebook
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Private Link connections are supported by Windows App on Windows, macOS, iOS/iPadOS and Android/Chrome OS, but not by Windows App in a web browser. On Chromebooks, the team must use the installed Windows App for Android/Chrome OS.
    fr: |-
      Les connexions Private Link sont prises en charge par Windows App sur Windows, macOS, iOS/iPadOS et Android/Chrome OS, mais pas par Windows App dans un navigateur web. Sur les Chromebook, l'équipe doit utiliser l'application Windows App pour Android/Chrome OS installée.
  options:
    a:
      en: |-
        Windows App in a web browser doesn't support Private Link, whatever the browser.
      fr: |-
        Windows App dans un navigateur web ne prend pas en charge Private Link, quel que soit le navigateur.
    b:
      en: |-
        The Remote Desktop web client is no longer supported for public cloud customers since March 27, 2026.
      fr: |-
        Le client web Bureau à distance n'est plus pris en charge pour les clients du cloud public depuis le 27 mars 2026.
    c:
      en: |-
        Changing the browser doesn't help; the web version of Windows App doesn't support Private Link.
      fr: |-
        Changer de navigateur n'y change rien ; la version web de Windows App ne prend pas en charge Private Link.
references:
  - title: Compare Windows App features across platforms and devices
    url: https://learn.microsoft.com/en-us/windows-app/compare-platforms-features
