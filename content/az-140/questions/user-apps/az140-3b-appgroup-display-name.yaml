id: az140-3b-appgroup-display-name
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Virtual Desktop pooled host pool named **hp-sales** with a desktop application group named **hp-sales-DAG** registered to a workspace named **ws-sales**. In Windows App, users see the published desktop under a generic name.

    You need the desktop to appear as **Sales Desktop** for all the users of hp-sales. The other resources in ws-sales must keep their names.

    What should you change?
  fr: |
    Proseware dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-sales** avec un groupe d'applications de bureau nommé **hp-sales-DAG**, inscrit dans un espace de travail nommé **ws-sales**. Dans Windows App, les utilisateurs voient le bureau publié sous un nom générique.

    Le bureau doit apparaître sous le nom **Sales Desktop** pour tous les utilisateurs de hp-sales. Les autres ressources de ws-sales doivent conserver leurs noms.

    Que devez-vous modifier ?
body:
  options:
    - { id: a, text: { en: "The friendly name of each session host of hp-sales", fr: "Le nom convivial de chaque hôte de session de hp-sales" } }
    - { id: b, text: { en: "The friendly name of the ws-sales workspace", fr: "Le nom convivial de l'espace de travail ws-sales" } }
    - { id: c, text: { en: "The friendly name of the hp-sales host pool", fr: "Le nom convivial du pool d'hôtes hp-sales" } }
    - { id: d, text: { en: "The display name of the desktop in the **Applications** of hp-sales-DAG", fr: "Le nom d'affichage du bureau dans les **Applications** de hp-sales-DAG" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The name of a published desktop or RemoteApp is set on the application in its application group: **Application groups > hp-sales-DAG > Applications**, select the desktop and enter a new **Display name**. Users see the new name after their client refreshes. This needs the Desktop Virtualization Application Group Contributor role.
    fr: |
      Le nom d'un bureau ou d'une RemoteApp publiés se définit sur l'application dans son groupe d'applications : **Application groups > hp-sales-DAG > Applications**, sélectionnez le bureau et saisissez un nouveau **Nom d'affichage**. Les utilisateurs voient le nouveau nom après l'actualisation de leur client. Il faut le rôle Desktop Virtualization Application Group Contributor.
  options:
    a: { en: "Session host friendly names apply to personal host pools, where each user has their own session host.", fr: "Les noms conviviaux des hôtes de session s'appliquent aux pools d'hôtes personnels, où chaque utilisateur a son propre hôte de session." }
    b: { en: "The workspace name labels the group of resources in the feed, not the desktop itself, and it would affect the other resources of ws-sales.", fr: "Le nom de l'espace de travail désigne le groupe de ressources dans le flux, pas le bureau lui-même, et il toucherait les autres ressources de ws-sales." }
    c: { en: "The host pool friendly name isn't the name shown for the published desktop.", fr: "Le nom convivial du pool d'hôtes n'est pas le nom affiché pour le bureau publié." }
references:
  - title: Customize the feed for Azure Virtual Desktop users
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/customize-feed-for-virtual-desktop-users
