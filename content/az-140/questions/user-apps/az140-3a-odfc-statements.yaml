id: az140-3a-odfc-statements
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware configures FSLogix ODFC containers on the session hosts of a pooled host pool. Only the `Enabled` and `VHDLocations` values exist under `HKLM\SOFTWARE\Policies\FSLogix\ODFC`. Users run both classic Outlook and the new Outlook for Windows.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware configure des conteneurs ODFC FSLogix sur les hôtes de session d'un pool d'hôtes partagé. Seules les valeurs `Enabled` et `VHDLocations` existent sous `HKLM\SOFTWARE\Policies\FSLogix\ODFC`. Les utilisateurs exécutent à la fois Outlook classique et le nouvel Outlook pour Windows.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          You must create IncludeOfficeActivation with a value of 1 for Office activation data to be redirected to the container.
        fr: |-
          Vous devez créer IncludeOfficeActivation avec la valeur 1 pour que les données d'activation d'Office soient redirigées vers le conteneur.
    - id: s2
      text:
        en: |-
          For the OutlookCachedMode setting to work, Outlook must be configured for online mode by policy on the session hosts.
        fr: |-
          Pour que le paramètre OutlookCachedMode fonctionne, Outlook doit être configuré en mode en ligne par stratégie sur les hôtes de session.
    - id: s3
      text:
        en: |-
          IncludeOutlookPersonalization redirects the personalization data of the new Outlook for Windows.
        fr: |-
          IncludeOutlookPersonalization redirige les données de personnalisation du nouvel Outlook pour Windows.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      FSLogix creates no setting values at installation and uses the documented default of every absent setting; IncludeOfficeActivation already defaults to 1. OutlookCachedMode (default 1) temporarily turns on cached mode only while the ODFC container is attached, which requires Outlook to be set to online mode, so large OST files aren't downloaded if FSLogix is disabled. IncludeOutlookPersonalization applies to classic Outlook only, not to the new Outlook for Windows.
    fr: |-
      FSLogix ne crée aucune valeur de paramètre à l'installation et utilise la valeur par défaut documentée de chaque paramètre absent ; IncludeOfficeActivation vaut déjà 1 par défaut. OutlookCachedMode (1 par défaut) n'active temporairement le mode mis en cache que lorsque le conteneur ODFC est attaché, ce qui exige qu'Outlook soit configuré en mode en ligne, afin que de gros fichiers OST ne soient pas téléchargés si FSLogix est désactivé. IncludeOutlookPersonalization ne s'applique qu'à Outlook classique, pas au nouvel Outlook pour Windows.
references:
  - title: Configuration Setting Reference
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
