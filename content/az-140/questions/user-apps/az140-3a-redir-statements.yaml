id: az140-3a-redir-statements
objective: "3.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You create a new pooled host pool named **HP-New** and don't change its RDP properties. The session hosts have no redirection policy configured.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un nouveau pool d'hôtes partagé nommé **HP-New** sans modifier ses propriétés RDP. Aucune stratégie de redirection n'est configurée sur les hôtes de session.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Users of HP-New can't use their local clipboard in their sessions until you change the clipboard redirection setting of the host pool.
        fr: |-
          Les utilisateurs de HP-New ne peuvent pas utiliser leur Presse-papiers local dans leurs sessions tant que vous ne modifiez pas le paramètre de redirection du Presse-papiers du pool d'hôtes.
    - id: s2
      text:
        en: |-
          If you set drivestoredirect:s:DynamicDrives, the drives already connected to the local device when the session starts are also redirected.
        fr: |-
          Si vous définissez drivestoredirect:s:DynamicDrives, les lecteurs déjà connectés à l'appareil local au démarrage de la session sont également redirigés.
    - id: s3
      text:
        en: |-
          If you later block drive redirection on the session hosts by policy, users can still copy text between the local device and the session, but not files.
        fr: |-
          Si vous bloquez plus tard la redirection des lecteurs sur les hôtes de session par stratégie, les utilisateurs peuvent toujours copier du texte entre l'appareil local et la session, mais pas des fichiers.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Clipboard redirection is disabled in the RDP properties of newly created host pools, so the resultant behavior is disabled in both directions until you change it. DynamicDrives redirects only the drives connected later; the value * redirects all drives, including later ones. Disabling drive redirection with Intune or Group Policy also prevents file transfers through the clipboard, while text and images aren't affected (as long as clipboard redirection is enabled).
    fr: |-
      La redirection du Presse-papiers est désactivée dans les propriétés RDP des pools d'hôtes nouvellement créés ; le comportement résultant est donc désactivé dans les deux sens tant que vous ne le modifiez pas. DynamicDrives ne redirige que les lecteurs connectés plus tard ; la valeur * redirige tous les lecteurs, y compris ceux connectés plus tard. La désactivation de la redirection des lecteurs avec Intune ou une stratégie de groupe empêche aussi le transfert de fichiers par le Presse-papiers, alors que le texte et les images ne sont pas concernés (tant que la redirection du Presse-papiers est activée).
references:
  - title: Configure clipboard redirection over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-clipboard
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
