id: az140-3c-appattach-conditions
objective: "3.3.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** that has a desktop application group named **HP1-DAG**. You add an App attach package named **App1**, set its state to **Active**, and keep the default registration type.

    A user named **User1** has a hybrid identity and must get App1 in a desktop session on HP1.

    Which three conditions must be met?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** qui possède un groupe d'applications de bureau nommé **HP1-DAG**. Vous ajoutez un package App attach nommé **App1**, vous définissez son état sur **Active** et vous conservez le type d'inscription par défaut.

    Un utilisateur nommé **User1** possède une identité hybride et doit obtenir App1 dans une session de bureau sur HP1.

    Quelles sont les trois conditions à respecter ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "App1 is assigned to HP1.", fr: "App1 est affecté à HP1." } }
    - { id: b, text: { en: "App1 is added as an application to HP1-DAG.", fr: "App1 est ajouté en tant qu'application à HP1-DAG." } }
    - { id: c, text: { en: "User1, or a group that contains User1, is assigned to App1.", fr: "User1, ou un groupe qui contient User1, est affecté à App1." } }
    - { id: d, text: { en: "The App1 image is stored on the share that holds the FSLogix profile containers.", fr: "L'image d'App1 est stockée sur le partage qui contient les conteneurs de profils FSLogix." } }
    - { id: e, text: { en: "User1 is assigned to HP1-DAG.", fr: "User1 est affecté à HP1-DAG." } }
    - { id: f, text: { en: "The registration type of App1 is set to Log on blocking.", fr: "Le type d'inscription d'App1 est défini sur Log on blocking." } }
answer: { optionIds: [a, c, e] }
explanation:
  correct:
    en: |
      At sign-in, a user gets an App attach application only if the package is assigned to the host pool, the user can sign in to the host pool through a desktop or RemoteApp application group, and the package is assigned to the user or to one of their groups. An active package that meets these conditions appears automatically in the desktop session.
    fr: |
      À la connexion, un utilisateur reçoit une application App attach seulement si le package est affecté au pool d'hôtes, si l'utilisateur peut se connecter au pool d'hôtes par un groupe d'applications de bureau ou RemoteApp, et si le package est affecté à l'utilisateur ou à l'un de ses groupes. Un package actif qui respecte ces conditions apparaît automatiquement dans la session de bureau.
  options:
    b:
      en: MSIX and Appx applications can't be added to a desktop application group; they appear in the desktop automatically.
      fr: Les applications MSIX et Appx ne peuvent pas être ajoutées à un groupe d'applications de bureau ; elles apparaissent automatiquement dans le bureau.
    d:
      en: Microsoft recommends not using the same file share for App attach images and FSLogix profile containers.
      fr: Microsoft recommande de ne pas utiliser le même partage pour les images App attach et les conteneurs de profils FSLogix.
    f:
      en: The default On-demand registration works and is recommended; Log on blocking only registers the application during sign-in.
      fr: L'inscription On-demand par défaut fonctionne et est recommandée ; Log on blocking inscrit seulement l'application pendant la connexion.
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
