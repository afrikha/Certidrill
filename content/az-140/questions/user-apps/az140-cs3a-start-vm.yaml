id: az140-cs3a-start-vm
objective: "3.2.10"
type: single
caseStudy: az140-cs3a-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You enable Start VM on Connect on HP-Lab. Which role should you assign to the Azure Virtual Desktop service principal on the resource group that contains the HP-Lab session hosts to meet the requirements?
  fr: |
    Vous activez Start VM on Connect sur HP-Lab. Quel rôle devez-vous attribuer au principal de service Azure Virtual Desktop sur le groupe de ressources qui contient les hôtes de session de HP-Lab pour respecter les exigences ?
body:
  options:
    - { id: a, text: Desktop Virtualization Power On Off Contributor }
    - { id: b, text: Desktop Virtualization Virtual Machine Contributor }
    - { id: c, text: Desktop Virtualization Session Host Operator }
    - { id: d, text: Desktop Virtualization Power On Contributor }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Start VM on Connect needs the Azure Virtual Desktop service principal (or a managed identity of the host pool) to start the deallocated VMs. Desktop Virtualization Power On Contributor only lets the resource provider start VMs, which is the least privilege. A scope lower than the subscription is allowed if it contains the session host VMs.
    fr: |
      Start VM on Connect exige que le principal de service Azure Virtual Desktop (ou une identité managée du pool d'hôtes) puisse démarrer les machines virtuelles désallouées. Desktop Virtualization Power On Contributor permet seulement au fournisseur de ressources de démarrer les machines virtuelles : c'est le moindre privilège. Une étendue inférieure à l'abonnement est admise si elle contient les machines virtuelles hôtes de session.
  options:
    a: { en: "This role also lets the service stop VMs; it is required by autoscale, not by Start VM on Connect, so it grants more than needed.", fr: "Ce rôle permet aussi d'arrêter les machines virtuelles ; il est requis par la mise à l'échelle automatique, pas par Start VM on Connect, et accorde donc plus que nécessaire." }
    b: { en: "This role lets the resource provider create, delete and update VMs; it is used for dynamic autoscaling and exceeds the need.", fr: "Ce rôle permet au fournisseur de ressources de créer, supprimer et mettre à jour des machines virtuelles ; il sert à la mise à l'échelle automatique dynamique et dépasse le besoin." }
    c: { en: "This role is for administrators who view and remove session hosts or change drain mode; it doesn't let the service start VMs.", fr: "Ce rôle est destiné aux administrateurs qui consultent et suppriment des hôtes de session ou changent le mode drainage ; il ne permet pas au service de démarrer des machines virtuelles." }
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
