id: az140-cs3b-rdp-properties
objective: "3.2.8"
type: dropdown
caseStudy: az140-cs3b-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |
    You need to configure HP-Resorts to meet the device redirection requirement.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer HP-Resorts pour satisfaire l'exigence de redirection des périphériques.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Update-AzWvdHostPool -ResourceGroupName rg-avd-resorts -Name HP-Resorts `
      -CustomRdpProperty "[[drives]];[[clip]];[[mic]];"
  slots:
    - id: drives
      options:
        - { id: star, text: "drivestoredirect:s:*" }
        - { id: empty, text: "drivestoredirect:s:" }
        - { id: dynamic, text: "drivestoredirect:s:DynamicDrives" }
    - id: clip
      options:
        - { id: clip1, text: "redirectclipboard:i:1" }
        - { id: printers0, text: "redirectprinters:i:0" }
        - { id: clip0, text: "redirectclipboard:i:0" }
    - id: mic
      options:
        - { id: audiomode1, text: "audiomode:i:1" }
        - { id: capture1, text: "audiocapturemode:i:1" }
        - { id: capture0, text: "audiocapturemode:i:0" }
answer:
  values: { drives: empty, clip: clip0, mic: capture1 }
explanation:
  correct:
    en: "An empty value for drivestoredirect redirects no drives, redirectclipboard:i:0 makes the clipboard unavailable in the remote session, and audiocapturemode:i:1 captures audio from the local device (the headset microphone) and redirects it to the session. The -CustomRdpProperty parameter of Update-AzWvdHostPool takes a semicolon-separated list."
    fr: "Une valeur vide pour drivestoredirect ne redirige aucun lecteur, redirectclipboard:i:0 rend le Presse-papiers indisponible dans la session à distance, et audiocapturemode:i:1 capture l'audio du périphérique local (le micro du casque) et le redirige vers la session. Le paramètre -CustomRdpProperty d'Update-AzWvdHostPool accepte une liste séparée par des points-virgules."
  options:
    star: { en: "The asterisk redirects all drives, including those connected later.", fr: "L'astérisque redirige tous les lecteurs, y compris ceux connectés ultérieurement." }
    dynamic: { en: "DynamicDrives redirects drives that are connected later, such as USB drives.", fr: "DynamicDrives redirige les lecteurs connectés ultérieurement, comme les clés USB." }
    clip1: { en: "The value 1 makes the clipboard available in the session.", fr: "La valeur 1 rend le Presse-papiers disponible dans la session." }
    printers0: { en: "redirectprinters controls printer redirection, not the clipboard.", fr: "redirectprinters contrôle la redirection des imprimantes, pas le Presse-papiers." }
    audiomode1: { en: "audiomode controls where sounds play, not microphone capture.", fr: "audiomode détermine où les sons sont joués, pas la capture du micro." }
    capture0: { en: "The value 0 disables audio capture, so the microphones wouldn't work.", fr: "La valeur 0 désactive la capture audio : les micros ne fonctionneraient pas." }
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
  - title: Update-AzWvdHostPool
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/update-azwvdhostpool
