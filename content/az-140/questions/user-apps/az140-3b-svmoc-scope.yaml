id: az140-3b-svmoc-scope
objective: "3.2.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has two Azure Virtual Desktop personal host pools. Start VM on Connect is enabled on both. The Desktop Virtualization Power On Contributor role is assigned to the Azure Virtual Desktop service principal as shown in the following table.

    | Host pool | Resource group of the host pool | Resource group of the session host VMs | Role assignment scope |
    | --- | --- | --- | --- |
    | hp-design | rg-avd | rg-avd | rg-avd |
    | hp-studio | rg-avd | rg-studio-vms | rg-avd |

    Users of hp-design connect to deallocated desktops without issue. Users of hp-studio receive an error when their desktop is deallocated.

    You need to fix Start VM on Connect for hp-studio. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Litware dispose de deux pools d'hôtes personnels Azure Virtual Desktop. Start VM on Connect est activé sur les deux. Le rôle Desktop Virtualization Power On Contributor est attribué au principal de service Azure Virtual Desktop comme indiqué dans le tableau suivant.

    | Pool d'hôtes | Groupe de ressources du pool d'hôtes | Groupe de ressources des machines virtuelles d'hôte de session | Étendue de l'attribution de rôle |
    | --- | --- | --- | --- |
    | hp-design | rg-avd | rg-avd | rg-avd |
    | hp-studio | rg-avd | rg-studio-vms | rg-avd |

    Les utilisateurs de hp-design se connectent sans problème à des bureaux libérés. Les utilisateurs de hp-studio reçoivent une erreur quand leur bureau est libéré.

    Vous devez corriger Start VM on Connect pour hp-studio. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Desktop Virtualization Power On Contributor role to the Azure Virtual Desktop service principal on rg-studio-vms.", fr: "Attribuer le rôle Desktop Virtualization Power On Contributor au principal de service Azure Virtual Desktop sur rg-studio-vms." } }
    - { id: b, text: { en: "Assign the Desktop Virtualization Power On Contributor role to the hp-studio users on rg-studio-vms.", fr: "Attribuer le rôle Desktop Virtualization Power On Contributor aux utilisateurs de hp-studio sur rg-studio-vms." } }
    - { id: c, text: { en: "Assign the Desktop Virtualization Power On Off Contributor role to the Azure Virtual Desktop service principal on the subscription.", fr: "Attribuer le rôle Desktop Virtualization Power On Off Contributor au principal de service Azure Virtual Desktop sur l'abonnement." } }
    - { id: d, text: { en: "Assign the Desktop Virtualization Host Pool Contributor role to the Azure Virtual Desktop service principal on rg-avd.", fr: "Attribuer le rôle Desktop Virtualization Host Pool Contributor au principal de service Azure Virtual Desktop sur rg-avd." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The role assignment scope must contain the session host VMs that the service starts. The hp-studio VMs are in rg-studio-vms, outside the current scope, so the service principal needs the Power On Contributor role on rg-studio-vms (a resource group, host pool or VM scope is allowed as long as it contains the VMs).
    fr: |
      L'étendue de l'attribution de rôle doit contenir les machines virtuelles d'hôte de session que le service démarre. Les machines virtuelles de hp-studio sont dans rg-studio-vms, hors de l'étendue actuelle : le principal de service a besoin du rôle Power On Contributor sur rg-studio-vms (une étendue de groupe de ressources, de pool d'hôtes ou de machine virtuelle est permise tant qu'elle contient les machines virtuelles).
  options:
    b: { en: "Users don't start the VMs; the Azure Virtual Desktop service does.", fr: "Ce ne sont pas les utilisateurs qui démarrent les machines virtuelles, mais le service Azure Virtual Desktop." }
    c: { en: "This would work but grants stop permissions on the whole subscription, which isn't least privilege.", fr: "Cela fonctionnerait, mais accorde des autorisations d'arrêt sur tout l'abonnement, ce qui ne respecte pas le moindre privilège." }
    d: { en: "Host Pool Contributor doesn't include permission to start VMs.", fr: "Host Pool Contributor n'inclut pas l'autorisation de démarrer des machines virtuelles." }
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
