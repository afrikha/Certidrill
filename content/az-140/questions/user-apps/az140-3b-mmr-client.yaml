id: az140-3b-mmr-client
objective: "3.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure Virtual Desktop host pool named **hp-media**. Multimedia redirection is installed on all the session hosts, and the Microsoft Edge extension is enabled for all users.

    Users connect from Windows 11 laptops that run a clean corporate image with no additional software. They open Windows App in Microsoft Edge on the laptops and connect to their desktop. In the session, the multimedia redirection extension icon stays grey on YouTube and video playback isn't redirected.

    You need to ensure that video playback is redirected for these users.

    Which two actions should you perform on the laptops? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-media**. La redirection multimédia est installée sur tous les hôtes de session, et l'extension Microsoft Edge est activée pour tous les utilisateurs.

    Les utilisateurs se connectent depuis des ordinateurs portables Windows 11 qui exécutent une image d'entreprise vierge, sans logiciel supplémentaire. Ils ouvrent Windows App dans Microsoft Edge sur les portables et se connectent à leur bureau. Dans la session, l'icône de l'extension de redirection multimédia reste grise sur YouTube et la lecture vidéo n'est pas redirigée.

    Vous devez faire en sorte que la lecture vidéo soit redirigée pour ces utilisateurs.

    Quelles sont les deux actions à effectuer sur les ordinateurs portables ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the multimedia redirection MSI from https://aka.ms/avdmmr/msi.", fr: "Installer le MSI de redirection multimédia depuis https://aka.ms/avdmmr/msi." } }
    - { id: b, text: { en: "Install Windows App for Windows and connect with it instead of the browser.", fr: "Installer Windows App pour Windows et se connecter avec elle plutôt qu'avec le navigateur." } }
    - { id: c, text: { en: "Install the Microsoft Multimedia Redirection extension in the local Microsoft Edge.", fr: "Installer l'extension Microsoft Multimedia Redirection dans le Microsoft Edge local." } }
    - { id: d, text: { en: "Install the Microsoft Visual C++ Redistributable 2015-2022.", fr: "Installer Microsoft Visual C++ Redistributable 2015-2022." } }
    - { id: e, text: { en: "Install the Remote Desktop WebRTC Redirector Service.", fr: "Installer le service Remote Desktop WebRTC Redirector." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Multimedia redirection works only with Windows App on Windows (version 2.0.297.0 or later); Windows App in a web browser doesn't support it. The Microsoft Visual C++ Redistributable 2015-2022 (14.32.31332.0 or later) is required on the session hosts and also on the local Windows devices.
    fr: |
      La redirection multimédia fonctionne uniquement avec Windows App sur Windows (version 2.0.297.0 ou ultérieure) ; Windows App dans un navigateur web ne la prend pas en charge. Microsoft Visual C++ Redistributable 2015-2022 (14.32.31332.0 ou ultérieure) est requis sur les hôtes de session et aussi sur les appareils Windows locaux.
  options:
    a: { en: "The MSI installs the service and the extension in the remote session, on the session hosts, not on the local devices.", fr: "Le MSI installe le service et l'extension dans la session distante, sur les hôtes de session, pas sur les appareils locaux." }
    c: { en: "The extension runs in the browser inside the session; the local browser plays no role.", fr: "L'extension s'exécute dans le navigateur de la session ; le navigateur local ne joue aucun rôle." }
    e: { en: "The WebRTC Redirector Service is a session host component for Microsoft Teams, not a prerequisite of multimedia redirection.", fr: "Le service WebRTC Redirector est un composant d'hôte de session pour Microsoft Teams, pas un prérequis de la redirection multimédia." }
references:
  - title: Multimedia redirection for video playback and calls in a remote session
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection
