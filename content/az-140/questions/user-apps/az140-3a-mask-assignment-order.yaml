id: az140-3a-mask-assignment-order
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You created an FSLogix Rule Set named **HideApp2** that contains hiding rules for an application named **App2**. The session hosts use Active Directory Domain Services accounts that are synchronized to Microsoft Entra ID.

    You need App2 to be hidden from all users except the members of the group **ADATUM\Engineering**.

    How should you configure the assignments of HideApp2? (Assignments are listed from top to bottom.)
  fr: |
    Vous avez créé un Rule Set FSLogix nommé **HideApp2** qui contient des règles de masquage pour une application nommée **App2**. Les hôtes de session utilisent des comptes Active Directory Domain Services synchronisés avec Microsoft Entra ID.

    Vous devez faire en sorte qu'App2 soit masquée à tous les utilisateurs sauf aux membres du groupe **ADATUM\Engineering**.

    Comment devez-vous configurer les attributions de HideApp2 ? (Les attributions sont listées de haut en bas.)
body:
  options:
    - id: a
      text:
        en: |-
          1. `Everyone` (`Applies: No`), 2. `ADATUM\Engineering` (`Applies: Yes`)
        fr: |-
          1. `Everyone` (`Applies: No`), 2. `ADATUM\Engineering` (`Applies: Yes`)
    - id: b
      text:
        en: |-
          1. `Everyone` (`Applies: Yes`), 2. `ADATUM\Engineering` (`Applies: No`)
        fr: |-
          1. `Everyone` (`Applies: Yes`), 2. `ADATUM\Engineering` (`Applies: No`)
    - id: c
      text:
        en: |-
          1. `ADATUM\Engineering` (`Applies: No`), 2. `Everyone` (`Applies: Yes`)
        fr: |-
          1. `ADATUM\Engineering` (`Applies: No`), 2. `Everyone` (`Applies: Yes`)
    - id: d
      text:
        en: |-
          1. `ADATUM\Engineering` (`Applies: Yes`), 2. `Everyone` (`Applies: No`)
        fr: |-
          1. `ADATUM\Engineering` (`Applies: Yes`), 2. `Everyone` (`Applies: No`)
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Assignments are processed from top to bottom, so a lower entry that matches the user overrides the entries above it. With Everyone set to `Applies: Yes` at the top and Engineering set to `Applies: No` below it, the hiding rules apply to every user except the Engineering members.
    fr: |-
      Les attributions sont traitées de haut en bas : une entrée inférieure qui correspond à l'utilisateur remplace les entrées situées au-dessus. Avec Everyone défini sur `Applies: Yes` en haut et Engineering défini sur `Applies: No` en dessous, les règles de masquage s'appliquent à tous les utilisateurs sauf aux membres d'Engineering.
  options:
    a:
      en: |-
        This order applies the hiding rules to Engineering only, which is the opposite of the requirement.
      fr: |-
        Cet ordre applique les règles de masquage uniquement à Engineering, soit l'inverse de l'exigence.
    c:
      en: |-
        Everyone is processed last and matches all users, so the rules would apply to everyone, including Engineering.
      fr: |-
        Everyone est traité en dernier et correspond à tous les utilisateurs : les règles s'appliqueraient à tous, y compris à Engineering.
    d:
      en: |-
        Everyone is processed last with Applies set to No, so the Rule Set wouldn't apply to any user.
      fr: |-
        Everyone est traité en dernier avec Applies défini sur No : le Rule Set ne s'appliquerait à aucun utilisateur.
references:
  - title: FSLogix Apps RuleEditor and Rule Sets
    url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-apps-rule-editor-rule-sets
