id: az140-3a-mask-choose
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a pooled host pool named **HP-Corp** that publishes full desktops. All session hosts are created from one custom image that includes an application named **App1**. Users and groups are synchronized from Active Directory Domain Services to Microsoft Entra ID, and the session hosts can reach a domain controller.

    Only the members of a group named **Finance** are licensed to use App1. Other users must not see App1 in their desktop sessions. You must keep a single image.

    What should you use?
  fr: |
    Contoso dispose d'un pool d'hôtes partagé nommé **HP-Corp** qui publie des bureaux complets. Tous les hôtes de session sont créés à partir d'une seule image personnalisée qui inclut une application nommée **App1**. Les utilisateurs et les groupes sont synchronisés depuis Active Directory Domain Services vers Microsoft Entra ID, et les hôtes de session peuvent joindre un contrôleur de domaine.

    Seuls les membres d'un groupe nommé **Finance** disposent d'une licence pour App1. Les autres utilisateurs ne doivent pas voir App1 dans leurs sessions de bureau. Vous devez conserver une seule image.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: |-
          A RemoteApp application group for App1 assigned to Finance
        fr: |-
          Un groupe d'applications RemoteApp pour App1 attribué à Finance
    - id: b
      text:
        en: |-
          An FSLogix ODFC container with an Include setting for App1
        fr: |-
          Un conteneur ODFC FSLogix avec un paramètre Include pour App1
    - id: c
      text:
        en: |-
          An FSLogix object-specific setting for the Finance group
        fr: |-
          Un paramètre FSLogix propre aux objets pour le groupe Finance
    - id: d
      text:
        en: |-
          An FSLogix Rule Set with hiding rules for App1
        fr: |-
          Un Rule Set FSLogix avec des règles de masquage pour App1
answer: { optionId: d }
explanation:
  correct:
    en: |-
      FSLogix application masking uses Rule Sets processed by the FSLogix Apps Services. Hiding rules hide the files, folders and registry keys of App1, and the Rule Set assignments apply them to every user except Finance, so one image can serve users with different entitlements.
    fr: |-
      Le masquage d'application FSLogix utilise des Rule Sets traités par FSLogix Apps Services. Les règles de masquage masquent les fichiers, dossiers et clés de Registre d'App1, et les attributions du Rule Set les appliquent à tous les utilisateurs sauf à Finance : une seule image peut ainsi servir des utilisateurs aux droits différents.
  options:
    a:
      en: |-
        A RemoteApp application group publishes App1 as a separate app, but App1 would stay visible in the full desktops of every user.
      fr: |-
        Un groupe d'applications RemoteApp publie App1 comme application distincte, mais App1 resterait visible dans les bureaux complets de tous les utilisateurs.
    b:
      en: |-
        ODFC Include settings choose which Microsoft 365 app data is redirected into the ODFC container; they don't hide applications.
      fr: |-
        Les paramètres Include d'ODFC choisissent quelles données des applications Microsoft 365 sont redirigées vers le conteneur ODFC ; ils ne masquent pas d'applications.
    c:
      en: |-
        Object-specific settings change profile container values, such as VHDLocations, for a user or group; they don't control application visibility.
      fr: |-
        Les paramètres propres aux objets modifient des valeurs du conteneur de profil, comme VHDLocations, pour un utilisateur ou un groupe ; ils ne contrôlent pas la visibilité des applications.
references:
  - title: FSLogix Apps RuleEditor and Rule Sets
    url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-apps-rule-editor-rule-sets
