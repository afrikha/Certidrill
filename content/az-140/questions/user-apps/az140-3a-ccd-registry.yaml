id: az140-3a-ccd-registry
objective: "3.1.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You are converting the session hosts of a pooled host pool named **HP-Retail** from standard profile containers to FSLogix Cloud Cache. The following table shows the current values under `HKLM\SOFTWARE\FSLogix\Profiles` on a test session host.

    Answer each prompt by selecting the value name in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous convertissez les hôtes de session d'un pool d'hôtes partagé nommé **HP-Retail** des conteneurs de profil standard vers FSLogix Cloud Cache. Le tableau suivant montre les valeurs actuelles sous `HKLM\SOFTWARE\FSLogix\Profiles` sur un hôte de session de test.

    Répondez à chaque consigne en sélectionnant le nom de valeur dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: |-
          The value you must delete for the Cloud Cache configuration to be supported
        fr: |-
          La valeur que vous devez supprimer pour que la configuration Cloud Cache soit prise en charge
    - id: p2
      text:
        en: |-
          The value you must change so that users can't sign in when no storage provider is healthy
        fr: |-
          La valeur que vous devez modifier pour que les utilisateurs ne puissent pas se connecter lorsqu'aucun fournisseur de stockage n'est sain
  grid:
    header:
      - { en: "Value name", fr: "Nom de la valeur" }
      - Type
      - { en: "Data", fr: "Données" }
    rows:
      - - { text: Enabled, area: enabled }
        - { text: DWORD }
        - { text: "1" }
      - - { text: VHDLocations, area: vhdloc }
        - { text: REG_SZ }
        - text: '\\stretailprof1.file.core.windows.net\profiles'
      - - { text: CCDLocations, area: ccdloc }
        - { text: REG_SZ }
        - text: 'type=smb,name="FILES 1",connectionString=\\stretailprof1.file.core.windows.net\profiles;type=smb,name="ANF 1",connectionString=\\anf-retail.contoso.com\profiles'
      - - { text: ClearCacheOnLogoff, area: clear }
        - { text: DWORD }
        - { text: "1" }
      - - { text: HealthyProvidersRequiredForRegister, area: healthy }
        - { text: DWORD }
        - { text: "0" }
      - - { text: PreventLoginWithFailure, area: prevent }
        - { text: DWORD }
        - { text: "1" }
answer:
  values: { p1: vhdloc, p2: healthy }
explanation:
  correct:
    en: |-
      CCDLocations and VHDLocations must never be present at the same time, so VHDLocations must be deleted once CCDLocations lists the providers. HealthyProvidersRequiredForRegister defaults to 0, which always allows sign-in even with no healthy provider; setting it to 1 blocks the sign-in, and PreventLoginWithFailure, already set to 1, gives users the FRXShell message instead of a working session.
    fr: |-
      CCDLocations et VHDLocations ne doivent jamais être présents en même temps ; VHDLocations doit donc être supprimé dès que CCDLocations liste les fournisseurs. HealthyProvidersRequiredForRegister vaut 0 par défaut, ce qui autorise toujours la connexion même sans fournisseur sain ; le définir sur 1 bloque la connexion, et PreventLoginWithFailure, déjà défini sur 1, affiche aux utilisateurs le message FRXShell au lieu d'une session utilisable.
references:
  - title: Configuration Settings
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
  - title: "Tutorial: Configure profile containers with Cloud Cache"
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-cloud-cache-containers
