id: az140-3c-m365-odt-config
objective: "3.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are building a custom image for an Azure Virtual Desktop pooled host pool. The image already contains an MSI-based installation of Office from an earlier build.

    You plan to install Microsoft 365 Apps for enterprise by running `setup.exe /configure configuration.xml` with the Office Deployment Tool. The configuration must meet the following requirements:

    - Remove the existing MSI-based Office installation.
    - Don't install the OneDrive sync app, because you install it separately in per-machine mode.
    - Let several users share each session host, each with their own licensing token.

    How should you complete the configuration file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une image personnalisée pour un pool d'hôtes regroupé Azure Virtual Desktop. L'image contient déjà une installation MSI d'Office issue d'une build précédente.

    Vous prévoyez d'installer Microsoft 365 Apps for enterprise en exécutant `setup.exe /configure configuration.xml` avec l'Outil de déploiement d'Office. La configuration doit respecter les exigences suivantes :

    - Supprimer l'installation MSI d'Office existante.
    - Ne pas installer l'application de synchronisation OneDrive, car vous l'installez à part en mode par ordinateur.
    - Permettre à plusieurs utilisateurs de partager chaque hôte de session, chacun avec son propre jeton de licence.

    Comment devez-vous compléter le fichier de configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    <Configuration>
      <Add OfficeClientEdition="64" Channel="MonthlyEnterprise">
        <Product ID="O365ProPlusRetail">
          <Language ID="en-US" />
          <ExcludeApp ID="Groove" />
          <ExcludeApp ID="Lync" />
          <ExcludeApp ID="[[exc]]" />
          <ExcludeApp ID="Teams" />
        </Product>
      </Add>
      [[remove]]
      <Updates Enabled="FALSE"/>
      <Display Level="None" AcceptEULA="TRUE" />
      [[lic]]
    </Configuration>
  slots:
    - id: exc
      options:
        - { id: od, text: OneDrive }
        - { id: onenote, text: OneNote }
        - { id: outlook, text: Outlook }
    - id: remove
      options:
        - { id: msi, text: '<RemoveMSI/>' }
        - { id: all, text: '<Remove All="TRUE"/>' }
        - { id: force, text: '<Property Name="FORCEAPPSHUTDOWN" Value="TRUE"/>' }
    - id: lic
      options:
        - { id: scl, text: '<Property Name="SharedComputerLicensing" Value="1"/>' }
        - { id: cache, text: '<Property Name="SCLCacheOverride" Value="1"/>' }
        - { id: auto, text: '<Property Name="AUTOACTIVATE" Value="1"/>' }
answer:
  values: { exc: od, remove: msi, lic: scl }
explanation:
  correct:
    en: |
      `ExcludeApp ID="OneDrive"` keeps the Office installation from installing OneDrive per user, so you can install it per machine afterwards. `RemoveMSI` removes existing MSI-based Office installations before installing Microsoft 365 Apps. `SharedComputerLicensing` set to 1 enables shared computer activation, which gives each user their own licensing token.
    fr: |
      `ExcludeApp ID="OneDrive"` empêche l'installation d'Office d'installer OneDrive par utilisateur, ce qui permet de l'installer ensuite par ordinateur. `RemoveMSI` supprime les installations MSI d'Office existantes avant d'installer Microsoft 365 Apps. `SharedComputerLicensing` défini sur 1 active l'activation d'ordinateurs partagés, qui donne à chaque utilisateur son propre jeton de licence.
  options:
    onenote: { en: "Excluding OneNote doesn't prevent the per-user OneDrive installation.", fr: "Exclure OneNote n'empêche pas l'installation de OneDrive par utilisateur." }
    outlook: { en: "Excluding Outlook doesn't prevent the per-user OneDrive installation.", fr: "Exclure Outlook n'empêche pas l'installation de OneDrive par utilisateur." }
    all: { en: "Remove All removes Click-to-Run Office products; it isn't the element that removes MSI-based installations during an install.", fr: "Remove All supprime des produits Office Démarrer en un clic ; ce n'est pas l'élément qui supprime les installations MSI pendant une installation." }
    force: { en: "FORCEAPPSHUTDOWN closes running Office applications; it doesn't remove an existing installation.", fr: "FORCEAPPSHUTDOWN ferme les applications Office en cours ; il ne supprime pas une installation existante." }
    cache: { en: "SCLCacheOverride only changes where the licensing token is stored; it doesn't enable shared computer activation.", fr: "SCLCacheOverride modifie seulement l'emplacement du jeton de licence ; il n'active pas l'activation d'ordinateurs partagés." }
    auto: { en: "AUTOACTIVATE only triggers activation after the installation; it doesn't enable shared computer activation.", fr: "AUTOACTIVATE déclenche seulement l'activation après l'installation ; il n'active pas l'activation d'ordinateurs partagés." }
references:
  - title: Install Office on a custom VHD image
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
  - title: Overview of shared computer activation for Microsoft 365 Apps
    url: https://learn.microsoft.com/en-us/microsoft-365-apps/licensing-activation/overview-shared-computer-activation
