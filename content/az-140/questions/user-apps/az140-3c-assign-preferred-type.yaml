id: az140-3c-assign-preferred-type
objective: "3.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have the following Azure Virtual Desktop pooled host pools. All the application groups are registered to a workspace named **WS1**.

    | Host pool | Preferred application group type | Application groups |
    | --- | --- | --- |
    | HP1 | Desktop | HP1-DAG (Desktop), HP1-Apps (RemoteApp) |
    | HP2 | RemoteApp | HP2-Apps (RemoteApp) |

    Users are assigned to the application groups as shown in the following table.

    | User | Assigned to |
    | --- | --- |
    | User1 | HP1-DAG, HP1-Apps |
    | User2 | HP1-Apps |
    | User3 | HP1-DAG, HP2-Apps |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des pools d'hôtes regroupés Azure Virtual Desktop suivants. Tous les groupes d'applications sont inscrits dans un espace de travail nommé **WS1**.

    | Pool d'hôtes | Type de groupe d'applications préféré | Groupes d'applications |
    | --- | --- | --- |
    | HP1 | Desktop | HP1-DAG (bureau), HP1-Apps (RemoteApp) |
    | HP2 | RemoteApp | HP2-Apps (RemoteApp) |

    Les utilisateurs sont affectés aux groupes d'applications comme l'indique le tableau suivant.

    | Utilisateur | Affecté à |
    | --- | --- |
    | User1 | HP1-DAG, HP1-Apps |
    | User2 | HP1-Apps |
    | User3 | HP1-DAG, HP2-Apps |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: User1 sees the RemoteApp applications of HP1-Apps in Windows App.
        fr: User1 voit les applications RemoteApp de HP1-Apps dans Windows App.
    - id: s2
      text:
        en: User2 sees the RemoteApp applications of HP1-Apps in Windows App.
        fr: User2 voit les applications RemoteApp de HP1-Apps dans Windows App.
    - id: s3
      text:
        en: User3 sees the HP1 desktop and the RemoteApp applications of HP2-Apps in Windows App.
        fr: User3 voit le bureau de HP1 et les applications RemoteApp de HP2-Apps dans Windows App.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: When a user is assigned to both a desktop and a RemoteApp application group of the same host pool, only the resources of the host pool's preferred application group type are shown, so User1 sees only the HP1 desktop. User2 is assigned only to the RemoteApp group, so the preference doesn't matter and the applications are shown. The preference applies per host pool, so User3 sees the HP1 desktop and the HP2 applications.
    fr: "Quand un utilisateur est affecté à la fois à un groupe d'applications de bureau et à un groupe RemoteApp du même pool d'hôtes, seules les ressources du type de groupe d'applications préféré du pool d'hôtes s'affichent : User1 ne voit donc que le bureau de HP1. User2 n'est affecté qu'au groupe RemoteApp : la préférence ne joue pas et les applications s'affichent. La préférence s'applique par pool d'hôtes : User3 voit le bureau de HP1 et les applications de HP2."
references:
  - title: Preferred application group type behavior for pooled host pools in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/preferred-application-group-type
