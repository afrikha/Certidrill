id: az140-3c-remoteapp-cmdline
objective: "3.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop RemoteApp application group named **AG-Finance** in a resource group named **RG-AVD**. Microsoft 365 Apps is installed on every session host of the host pool.

    You need to publish Excel in AG-Finance so that it always starts with the template `\\fs01\templates\budget.xltx`. Excel must be published from its executable path.

    How should you complete the Azure PowerShell command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un groupe d'applications RemoteApp Azure Virtual Desktop nommé **AG-Finance** dans un groupe de ressources nommé **RG-AVD**. Microsoft 365 Apps est installé sur chaque hôte de session du pool d'hôtes.

    Vous devez publier Excel dans AG-Finance pour qu'il démarre toujours avec le modèle `\\fs01\templates\budget.xltx`. Excel doit être publié à partir du chemin de son exécutable.

    Comment devez-vous compléter la commande Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-AzWvdApplication -ResourceGroupName RG-AVD -GroupName AG-Finance -Name FinanceBudget `
      [[src]] "C:\Program Files\Microsoft Office\root\Office16\EXCEL.EXE" `
      -IconPath "C:\Program Files\Microsoft Office\root\Office16\EXCEL.EXE" -IconIndex 0 `
      -CommandLineSetting [[cls]] `
      [[arg]] "/t \\fs01\templates\budget.xltx" `
      -ShowInPortal:$true
  slots:
    - id: src
      options:
        - { id: fp, text: "-FilePath" }
        - { id: alias, text: "-AppAlias" }
        - { id: pfn, text: "-MsixPackageFamilyName" }
    - id: cls
      options:
        - { id: req, text: Require }
        - { id: allow, text: Allow }
        - { id: dna, text: DoNotAllow }
    - id: arg
      options:
        - { id: cla, text: "-CommandLineArgument" }
        - { id: desc, text: "-Description" }
        - { id: msixapp, text: "-MsixPackageApplicationId" }
answer:
  values: { src: fp, cls: req, arg: cla }
explanation:
  correct:
    en: |
      -FilePath publishes an application from the path of its executable on the session hosts. -CommandLineSetting Require makes the application always start with the command line given in -CommandLineArgument, here the /t switch with the template path.
    fr: |
      -FilePath publie une application à partir du chemin de son exécutable sur les hôtes de session. -CommandLineSetting Require fait toujours démarrer l'application avec la ligne de commande fournie dans -CommandLineArgument, ici le commutateur /t suivi du chemin du modèle.
  options:
    alias: { en: "-AppAlias publishes an application found in the session hosts' Start menu, not from a file path.", fr: "-AppAlias publie une application trouvée dans le menu Démarrer des hôtes de session, pas à partir d'un chemin de fichier." }
    pfn: { en: "-MsixPackageFamilyName is for MSIX applications, not for an installed executable.", fr: "-MsixPackageFamilyName sert aux applications MSIX, pas à un exécutable installé." }
    allow: { en: "Allow lets the client pass any command line; it doesn't enforce the template.", fr: "Allow laisse le client passer n'importe quelle ligne de commande ; il n'impose pas le modèle." }
    dna: { en: "DoNotAllow starts the application without any command-line argument.", fr: "DoNotAllow démarre l'application sans aucun argument de ligne de commande." }
    desc: { en: "-Description only sets the text shown for the application.", fr: "-Description définit seulement le texte affiché pour l'application." }
    msixapp: { en: "-MsixPackageApplicationId identifies an application inside an MSIX package.", fr: "-MsixPackageApplicationId identifie une application dans un package MSIX." }
references:
  - title: Publish applications with RemoteApp in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/manage-app-groups
