id: az140-3c-onedrive-kfm
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP2**. The session hosts are Microsoft Entra joined and have a per-machine installation of the OneDrive sync app. You configure the following values under `HKLM\SOFTWARE\Policies\Microsoft\OneDrive`:

    | Name | Type | Data |
    | --- | --- | --- |
    | SilentAccountConfig | REG_DWORD | 1 |
    | KFMSilentOptIn | REG_SZ | 1 |

    Users are signed in to OneDrive automatically, but their Desktop, Documents and Pictures folders aren't moved to OneDrive.

    You need to move these folders to OneDrive without user interaction.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP2**. Les hôtes de session sont joints à Microsoft Entra et disposent d'une installation par ordinateur de l'application de synchronisation OneDrive. Vous configurez les valeurs suivantes sous `HKLM\SOFTWARE\Policies\Microsoft\OneDrive` :

    | Nom | Type | Données |
    | --- | --- | --- |
    | SilentAccountConfig | REG_DWORD | 1 |
    | KFMSilentOptIn | REG_SZ | 1 |

    Les utilisateurs sont connectés automatiquement à OneDrive, mais leurs dossiers Bureau, Documents et Images ne sont pas déplacés vers OneDrive.

    Vous devez déplacer ces dossiers vers OneDrive sans intervention de l'utilisateur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change KFMSilentOptIn to a REG_DWORD value of 1.", fr: "Remplacer KFMSilentOptIn par une valeur REG_DWORD de 1." } }
    - { id: b, text: { en: "Set the data of SilentAccountConfig to the Microsoft Entra tenant ID.", fr: "Définir les données de SilentAccountConfig sur l'ID du locataire Microsoft Entra." } }
    - { id: c, text: { en: "Set the data of KFMSilentOptIn to the Microsoft Entra tenant ID.", fr: "Définir les données de KFMSilentOptIn sur l'ID du locataire Microsoft Entra." } }
    - { id: d, text: { en: "Reinstall the OneDrive sync app in per-user mode.", fr: "Réinstaller l'application de synchronisation OneDrive en mode par utilisateur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      KFMSilentOptIn redirects and moves the Windows known folders to OneDrive silently, and its data is the Microsoft Entra tenant ID as a string value. A value of 1 doesn't identify a tenant, so no folder is moved. SilentAccountConfig = 1 is already correct, which is why sign-in works.
    fr: |
      KFMSilentOptIn redirige et déplace silencieusement les dossiers connus Windows vers OneDrive, et ses données sont l'ID du locataire Microsoft Entra sous forme de valeur de chaîne. La valeur 1 n'identifie aucun locataire : aucun dossier n'est déplacé. SilentAccountConfig = 1 est déjà correct, ce qui explique que la connexion fonctionne.
  options:
    a:
      en: The value is a string that contains the tenant ID; changing its type to DWORD doesn't identify the tenant.
      fr: La valeur est une chaîne qui contient l'ID du locataire ; passer son type en DWORD n'identifie pas le locataire.
    b:
      en: SilentAccountConfig is a DWORD set to 1 and already works; it doesn't move known folders.
      fr: SilentAccountConfig est un DWORD réglé sur 1 qui fonctionne déjà ; il ne déplace pas les dossiers connus.
    d:
      en: Non-persistent environments require the per-machine installation; a per-user installation isn't supported there.
      fr: Les environnements non persistants exigent l'installation par ordinateur ; une installation par utilisateur n'y est pas prise en charge.
references:
  - title: Install Office on a custom VHD image
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
