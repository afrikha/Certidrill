id: az140-3b-personal-reassign
objective: "3.2.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Virtual Desktop personal host pool named **hp-analysts** that uses the Direct assignment type. A session host named **SH4** is assigned to User1, who has moved to another team. User2 is already assigned to the desktop application group of hp-analysts but has no session host.

    You need User2 to use SH4. User1 must no longer be able to connect to SH4.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes personnel Azure Virtual Desktop nommé **hp-analysts** qui utilise le type d'attribution Direct. Un hôte de session nommé **SH4** est attribué à User1, qui a rejoint une autre équipe. User2 est déjà affecté au groupe d'applications de bureau de hp-analysts mais n'a aucun hôte de session.

    User2 doit utiliser SH4. User1 ne doit plus pouvoir se connecter à SH4.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove User1 from the desktop application group of hp-analysts.", fr: "Retirer User1 du groupe d'applications de bureau de hp-analysts." } }
    - { id: b, text: { en: "Change the assignment type of hp-analysts to Automatic.", fr: "Remplacer le type d'attribution de hp-analysts par Automatique." } }
    - { id: c, text: { en: "Turn on drain mode for SH4 and ask User2 to connect.", fr: "Activer le mode drainage sur SH4 et demander à User2 de se connecter." } }
    - { id: d, text: { en: "In **Session hosts**, select SH4 and use **Assignment > Assign to a different user** to select User2.", fr: "Dans **Session hosts**, sélectionner SH4 et utiliser **Assignment > Assign to a different user** pour choisir User2." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Reassigning a personal desktop moves the session host assignment from one user to another in a single step: User2 becomes the assigned user and User1 can no longer connect to SH4. Reassignment is done in the Azure portal (Session hosts > Assignment > Assign to a different user); Azure CLI doesn't support it.
    fr: |
      Réattribuer un bureau personnel fait passer l'attribution de l'hôte de session d'un utilisateur à un autre en une seule étape : User2 devient l'utilisateur attribué et User1 ne peut plus se connecter à SH4. La réattribution se fait dans le portail Azure (Session hosts > Assignment > Assign to a different user) ; Azure CLI ne la prend pas en charge.
  options:
    a: { en: "Removing User1 from the application group doesn't release SH4, which stays assigned to User1.", fr: "Retirer User1 du groupe d'applications ne libère pas SH4, qui reste attribué à User1." }
    b: { en: "Automatic assignment gives User2 any unassigned session host, and SH4 is still assigned to User1.", fr: "L'attribution automatique donnerait à User2 un hôte de session non attribué quelconque, et SH4 reste attribué à User1." }
    c: { en: "Drain mode blocks new sessions on SH4; it doesn't change who the session host is assigned to.", fr: "Le mode drainage bloque les nouvelles sessions sur SH4 ; il ne change pas l'utilisateur auquel l'hôte de session est attribué." }
references:
  - title: Configure personal desktop assignment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
