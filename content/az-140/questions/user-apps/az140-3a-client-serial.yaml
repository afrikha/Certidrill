id: az140-3a-client-serial
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Warehouse staff at Northwind use the following devices:

    | Device | Operating system |
    | --- | --- |
    | Laptops | Windows 11 Enterprise |
    | MacBooks | macOS |
    | Tablets | iPadOS |

    A shipping application published from an Azure Virtual Desktop host pool must communicate with a label printer that the staff connect to a serial (COM) port of their device.

    Which client should the staff use to connect?
  fr: |
    Le personnel d'entrepôt de Northwind utilise les appareils suivants :

    | Appareil | Système d'exploitation |
    | --- | --- |
    | Ordinateurs portables | Windows 11 Entreprise |
    | MacBook | macOS |
    | Tablettes | iPadOS |

    Une application d'expédition publiée par un pool d'hôtes Azure Virtual Desktop doit communiquer avec une imprimante d'étiquettes que le personnel connecte à un port série (COM) de son appareil.

    Quel client le personnel doit-il utiliser pour se connecter ?
body:
  options:
    - id: a
      text:
        en: |-
          Windows App on the MacBooks
        fr: |-
          Windows App sur les MacBook
    - id: b
      text:
        en: |-
          Windows App on the Windows 11 laptops
        fr: |-
          Windows App sur les ordinateurs portables Windows 11
    - id: c
      text:
        en: |-
          Windows App on the iPadOS tablets
        fr: |-
          Windows App sur les tablettes iPadOS
    - id: d
      text:
        en: |-
          Windows App in Microsoft Edge on any of the devices
        fr: |-
          Windows App dans Microsoft Edge sur n'importe lequel des appareils
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Serial (COM) port and USB port redirection are available only in Windows App on Windows. The other platforms and the web browser can't redirect serial ports to the remote session.
    fr: |-
      La redirection des ports série (COM) et des ports USB n'est disponible que dans Windows App sur Windows. Les autres plateformes et le navigateur web ne peuvent pas rediriger les ports série vers la session distante.
  options:
    a:
      en: |-
        Windows App on macOS doesn't support serial or USB port redirection.
      fr: |-
        Windows App sur macOS ne prend pas en charge la redirection des ports série ou USB.
    c:
      en: |-
        Windows App on iOS/iPadOS doesn't support serial or USB port redirection.
      fr: |-
        Windows App sur iOS/iPadOS ne prend pas en charge la redirection des ports série ou USB.
    d:
      en: |-
        Windows App in a web browser doesn't support port redirection on any operating system.
      fr: |-
        Windows App dans un navigateur web ne prend en charge la redirection de ports sur aucun système d'exploitation.
references:
  - title: Compare Windows App features across platforms and devices
    url: https://learn.microsoft.com/en-us/windows-app/compare-platforms-features
