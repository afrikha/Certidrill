id: az140-3c-package-order
objective: "3.3.10"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a line-of-business application that is delivered as an MSI installer. You need to deliver the application to the session hosts of an Azure Virtual Desktop pooled host pool named **HP1** by using App attach. The session hosts run Windows 11 Enterprise multi-session.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'une application métier fournie sous forme de programme d'installation MSI. Vous devez fournir l'application aux hôtes de session d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** avec App attach. Les hôtes de session exécutent Windows 11 Entreprise multisession.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: pack, text: { en: "Convert the MSI installer to an MSIX package by using the MSIX Packaging Tool.", fr: "Convertir le programme d'installation MSI en package MSIX avec MSIX Packaging Tool." } }
    - { id: sign, text: { en: "Sign the MSIX package with a code signing certificate and a timestamp.", fr: "Signer le package MSIX avec un certificat de signature de code et un horodatage." } }
    - { id: image, text: { en: "Expand the MSIX package into a CIM disk image by using MSIXMGR.", fr: "Développer le package MSIX dans une image disque CIM avec MSIXMGR." } }
    - { id: copy, text: { en: "Copy the disk image files to the SMB file share.", fr: "Copier les fichiers de l'image disque sur le partage de fichiers SMB." } }
    - { id: add, text: { en: "Add the application in App attach and assign it to HP1 and the users.", fr: "Ajouter l'application dans App attach et l'affecter à HP1 et aux utilisateurs." } }
    - { id: msi, text: { en: "Expand the MSI installer into a CIM disk image by using MSIXMGR.", fr: "Développer le programme d'installation MSI dans une image disque CIM avec MSIXMGR." } }
    - { id: usercert, text: { en: "Import the signing certificate into the Personal store of each user.", fr: "Importer le certificat de signature dans le magasin Personnel de chaque utilisateur." } }
answer:
  sequence: [pack, sign, image, copy, add]
explanation:
  correct:
    en: |
      App attach uses MSIX, Appx or App-V packages, so the MSI is first converted with the MSIX Packaging Tool. Every MSIX package must be signed with a trusted code signing certificate, and a timestamp keeps it valid after the certificate expires. MSIXMGR then expands the signed package into a disk image (CIM is recommended for Windows 11), which you store on the SMB share before adding it in App attach.
    fr: |
      App attach utilise des packages MSIX, Appx ou App-V : le MSI est d'abord converti avec MSIX Packaging Tool. Chaque package MSIX doit être signé avec un certificat de signature de code approuvé, et un horodatage le garde valide après l'expiration du certificat. MSIXMGR développe ensuite le package signé dans une image disque (CIM est recommandé pour Windows 11), que vous stockez sur le partage SMB avant de l'ajouter dans App attach.
  options:
    msi:
      en: MSIXMGR unpacks .msix, .appx and bundle packages only; it can't expand an MSI installer.
      fr: MSIXMGR ne décompresse que des packages .msix, .appx et des bundles ; il ne peut pas développer un programme d'installation MSI.
    usercert:
      en: The session hosts must trust the certificate chain; a self-signed root goes into the Trusted Root Certification Authorities store of each session host, not into users' personal stores.
      fr: Les hôtes de session doivent approuver la chaîne de certificats ; une racine auto-signée va dans le magasin Autorités de certification racines de confiance de chaque hôte de session, pas dans le magasin personnel des utilisateurs.
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
  - title: Create an MSIX image to use with App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-create-msix-image
