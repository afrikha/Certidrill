id: az140-3b-appgroup-roles
objective: "3.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum manages Azure Virtual Desktop in a resource group named **rg-avd**. You need to grant permissions on the application groups in rg-avd to the teams described in the following table. The solution must follow the principle of least privilege.

    Which built-in role should you assign to each team? To answer, drag the appropriate roles to the correct teams. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum gère Azure Virtual Desktop dans un groupe de ressources nommé **rg-avd**. Vous devez accorder des autorisations sur les groupes d'applications de rg-avd aux équipes décrites ci-dessous. La solution doit respecter le principe du moindre privilège.

    Quel rôle intégré devez-vous attribuer à chaque équipe ? Pour répondre, faites glisser les rôles appropriés vers les équipes correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: user, text: Desktop Virtualization User }
    - { id: agcontrib, text: Desktop Virtualization Application Group Contributor }
    - { id: agreader, text: Desktop Virtualization Application Group Reader }
    - { id: reader, text: Desktop Virtualization Reader }
    - { id: wscontrib, text: Desktop Virtualization Workspace Contributor }
  targets:
    - { id: t1, text: { en: "App team: creates application groups, publishes applications and changes their display names, without assigning users", fr: "Équipe applications : crée des groupes d'applications, publie des applications et modifie leurs noms d'affichage, sans affecter d'utilisateurs" } }
    - { id: t2, text: { en: "Audit team: views the configuration of the application groups only", fr: "Équipe d'audit : consulte uniquement la configuration des groupes d'applications" } }
    - { id: t3, text: { en: "Sales staff: use the applications published in the application groups", fr: "Personnel commercial : utilise les applications publiées dans les groupes d'applications" } }
answer:
  mapping: { t1: agcontrib, t2: agreader, t3: user }
explanation:
  correct:
    en: |
      Desktop Virtualization Application Group Contributor manages all aspects of application groups except user or group assignment. Desktop Virtualization Application Group Reader views application groups without making changes. Desktop Virtualization User lets non-administrative users use the applications of an application group on a session host.
    fr: |
      Desktop Virtualization Application Group Contributor gère tous les aspects des groupes d'applications, sauf l'affectation des utilisateurs ou des groupes. Desktop Virtualization Application Group Reader consulte les groupes d'applications sans rien modifier. Desktop Virtualization User permet à des utilisateurs non administrateurs d'utiliser les applications d'un groupe d'applications sur un hôte de session.
  options:
    reader: { en: "Desktop Virtualization Reader views every Azure Virtual Desktop resource, more than the application groups only.", fr: "Desktop Virtualization Reader consulte toutes les ressources Azure Virtual Desktop, au-delà des seuls groupes d'applications." }
    wscontrib: { en: "Workspace Contributor manages workspaces, not application groups.", fr: "Workspace Contributor gère les espaces de travail, pas les groupes d'applications." }
references:
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
