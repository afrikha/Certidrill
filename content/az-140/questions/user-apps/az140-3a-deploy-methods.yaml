id: az140-3a-deploy-methods
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin must provide an Azure Virtual Desktop client to the following groups of users. Each group must use the method that meets its constraints with the least administrative effort.

    Which deployment method should you use for each group? To answer, drag the appropriate methods to the correct groups. Each method may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin doit fournir un client Azure Virtual Desktop aux groupes d'utilisateurs suivants. Chaque groupe doit utiliser la méthode qui respecte ses contraintes avec le moins d'effort d'administration.

    Quelle méthode de déploiement devez-vous utiliser pour chaque groupe ? Pour répondre, faites glisser les méthodes appropriées vers les groupes correspondants. Chaque méthode peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - id: store
      text:
        en: |-
          Windows App from the Microsoft Store
        fr: |-
          Windows App depuis le Microsoft Store
    - id: msix
      text:
        en: |-
          Windows App standalone MSIX package
        fr: |-
          Package MSIX autonome de Windows App
    - id: web
      text:
        en: |-
          Windows App in a web browser
        fr: |-
          Windows App dans un navigateur web
    - id: appstore
      text:
        en: |-
          Windows App from the Apple App Store
        fr: |-
          Windows App depuis l'App Store d'Apple
    - id: msi
      text:
        en: |-
          Remote Desktop client for Windows (MSI)
        fr: |-
          Client Bureau à distance pour Windows (MSI)
  targets:
    - id: contractors
      text:
        en: |-
          Contractors who use their own unmanaged laptops and must not install any software
        fr: |-
          Prestataires qui utilisent leurs propres ordinateurs portables non managés et ne doivent installer aucun logiciel
    - id: managed
      text:
        en: |-
          Employees whose Windows 11 devices are managed by Configuration Manager and block all access to the Microsoft Store
        fr: |-
          Employés dont les appareils Windows 11 sont gérés par Configuration Manager et bloquent tout accès au Microsoft Store
    - id: ipad
      text:
        en: |-
          Sales staff who use iPads
        fr: |-
          Commerciaux qui utilisent des iPad
    - id: selfservice
      text:
        en: |-
          Developers who install their own apps on Windows 11 devices and want updates without any action from IT
        fr: |-
          Développeurs qui installent eux-mêmes leurs applications sur des appareils Windows 11 et veulent des mises à jour sans aucune action du service informatique
answer:
  mapping: { contractors: web, managed: msix, ipad: appstore, selfservice: store }
explanation:
  correct:
    en: |-
      Windows App in a web browser needs no installation, which suits unmanaged devices. When devices can't use the Microsoft Store, you deploy the standalone MSIX package with an enterprise tool such as Configuration Manager; it then updates from a CDN by default. iPads get Windows App from the App Store. A Microsoft Store installation is updated by the Store and its background task without IT involvement.
    fr: |-
      Windows App dans un navigateur web ne nécessite aucune installation, ce qui convient aux appareils non managés. Lorsque les appareils ne peuvent pas utiliser le Microsoft Store, vous déployez le package MSIX autonome avec un outil d'entreprise comme Configuration Manager ; il se met ensuite à jour par défaut depuis un CDN. Les iPad obtiennent Windows App depuis l'App Store. Une installation depuis le Microsoft Store est mise à jour par le Store et sa tâche en arrière-plan sans intervention du service informatique.
  options:
    msi:
      en: |-
        The Remote Desktop client for Windows (MSI) is no longer supported for public cloud customers since March 27, 2026.
      fr: |-
        Le client Bureau à distance pour Windows (MSI) n'est plus pris en charge pour les clients du cloud public depuis le 27 mars 2026.
references:
  - title: Get started with Windows App
    url: https://learn.microsoft.com/en-us/windows-app/get-started-connect-devices-desktops-apps
  - title: Configure Windows App Updates on Windows
    url: https://learn.microsoft.com/en-us/windows-app/configure-updates-windows
