id: az140-3a-deploy-msix
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso manages its Windows 11 Enterprise laptops with Configuration Manager. A policy disables the Microsoft Store app on all the laptops, and the policy can't be changed.

    Users must connect to Azure Virtual Desktop with a client that supports multiple monitors and multimedia redirection. You need to deploy the client to the laptops.

    What should you deploy?
  fr: |
    Contoso gère ses ordinateurs portables Windows 11 Entreprise avec Configuration Manager. Une stratégie désactive l'application Microsoft Store sur tous les ordinateurs portables, et cette stratégie ne peut pas être modifiée.

    Les utilisateurs doivent se connecter à Azure Virtual Desktop avec un client qui prend en charge plusieurs moniteurs et la redirection multimédia. Vous devez déployer le client sur les ordinateurs portables.

    Que devez-vous déployer ?
body:
  options:
    - id: a
      text:
        en: |-
          Windows App from the Microsoft Store
        fr: |-
          Windows App depuis le Microsoft Store
    - id: b
      text:
        en: |-
          A shortcut to Windows App in the web browser
        fr: |-
          Un raccourci vers Windows App dans le navigateur web
    - id: c
      text:
        en: |-
          The Remote Desktop client for Windows (MSI)
        fr: |-
          Le client Bureau à distance pour Windows (MSI)
    - id: d
      text:
        en: |-
          The standalone MSIX package of Windows App
        fr: |-
          Le package MSIX autonome de Windows App
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Windows App on Windows is available from the Microsoft Store or as a standalone MSIX package that you can deploy with an enterprise tool such as Configuration Manager or Intune. The installed Windows App on Windows supports multiple monitors and multimedia redirection.
    fr: |-
      Windows App sur Windows est disponible depuis le Microsoft Store ou sous la forme d'un package MSIX autonome que vous pouvez déployer avec un outil d'entreprise comme Configuration Manager ou Intune. Windows App installé sur Windows prend en charge plusieurs moniteurs et la redirection multimédia.
  options:
    a:
      en: |-
        The Microsoft Store app is disabled on the laptops, so users can't install or update Windows App from it.
      fr: |-
        L'application Microsoft Store est désactivée sur les ordinateurs portables : les utilisateurs ne peuvent pas y installer ni mettre à jour Windows App.
    b:
      en: |-
        Windows App in a web browser supports neither multiple monitors nor multimedia redirection.
      fr: |-
        Windows App dans un navigateur web ne prend en charge ni plusieurs moniteurs ni la redirection multimédia.
    c:
      en: |-
        The MSI client is no longer supported for public cloud customers since March 27, 2026.
      fr: |-
        Le client MSI n'est plus pris en charge pour les clients du cloud public depuis le 27 mars 2026.
references:
  - title: Configure Windows App Updates on Windows
    url: https://learn.microsoft.com/en-us/windows-app/configure-updates-windows
  - title: Compare Windows App features across platforms and devices
    url: https://learn.microsoft.com/en-us/windows-app/compare-platforms-features
