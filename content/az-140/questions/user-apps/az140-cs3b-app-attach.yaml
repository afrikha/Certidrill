id: az140-cs3b-app-attach
objective: "3.3.9"
type: multi
caseStudy: az140-cs3b-alpine-ski-house
difficulty: 3
status: draft
stem:
  en: |
    You add SkiRent to HP-Resorts by using App attach. The session hosts fail to mount the SkiRent disk image from the **apps** share.

    You need to configure access to the share to meet the requirements.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez SkiRent à HP-Resorts avec App attach. Les hôtes de session ne parviennent pas à monter l'image disque de SkiRent depuis le partage **apps**.

    Vous devez configurer l'accès au partage pour respecter les exigences.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Reader and Data Access role on stappsash to the Azure Virtual Desktop and Azure Virtual Desktop ARM Provider service principals.", fr: "Attribuer le rôle Reader and Data Access sur stappsash aux principaux de service Azure Virtual Desktop et Azure Virtual Desktop ARM Provider." } }
    - { id: b, text: { en: "Set Storage File Data SMB Share Reader as the default share-level permission on stappsash.", fr: "Définir Storage File Data SMB Share Reader comme autorisation par défaut au niveau du partage sur stappsash." } }
    - { id: c, text: { en: "Assign the Storage File Data SMB Share Contributor role on the apps share to the FrontDesk and Managers groups.", fr: "Attribuer le rôle Storage File Data SMB Share Contributor sur le partage apps aux groupes FrontDesk et Managers." } }
    - { id: d, text: { en: "Grant the computer account of each session host NTFS read permission on the folder that holds the disk images.", fr: "Accorder au compte d'ordinateur de chaque hôte de session l'autorisation NTFS de lecture sur le dossier qui contient les images disque." } }
    - { id: e, text: { en: "Move the SkiRent disk images to the share that stores the FSLogix profile containers.", fr: "Déplacer les images disque de SkiRent vers le partage qui stocke les conteneurs de profils FSLogix." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The session hosts, not the users, mount App attach images. With AD DS authentication on Azure Files, Microsoft Learn says to set Storage File Data SMB Share Reader as the default share-level permission and to give each session host's computer object NTFS read access. The hybrid joined session hosts then authenticate to the share with their AD DS computer accounts.
    fr: |
      Ce sont les hôtes de session, et non les utilisateurs, qui montent les images App attach. Avec l'authentification AD DS sur Azure Files, Microsoft Learn indique de définir Storage File Data SMB Share Reader comme autorisation par défaut au niveau du partage et d'accorder l'accès NTFS en lecture à l'objet ordinateur de chaque hôte de session. Les hôtes de session joints à Microsoft Entra hybride s'authentifient alors auprès du partage avec leur compte d'ordinateur AD DS.
  options:
    a: { en: "This role assignment is the method for Microsoft Entra joined session hosts; it also grants access to all data in the storage account.", fr: "Cette attribution de rôle est la méthode prévue pour les hôtes de session joints à Microsoft Entra ; elle donne en outre accès à toutes les données du compte de stockage." }
    c: { en: "Users don't mount the images, and write access to the application images isn't needed.", fr: "Les utilisateurs ne montent pas les images, et l'accès en écriture aux images d'application n'est pas nécessaire." }
    e: { en: "Microsoft recommends not using the same file share for App attach images and FSLogix profile containers.", fr: "Microsoft recommande de ne pas utiliser le même partage de fichiers pour les images App attach et les conteneurs de profils FSLogix." }
references:
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
