id: az140-3b-svmoc-commands
objective: "3.2.10"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has an Azure Virtual Desktop personal host pool named **hp-eng** in a resource group named **rg-avd**. The variable `$avdAppId` contains the application ID of the Azure Virtual Desktop service principal.

    You need to enable Start VM on Connect for hp-eng. The solution must follow the principle of least privilege.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un pool d'hôtes personnel Azure Virtual Desktop nommé **hp-eng** dans un groupe de ressources nommé **rg-avd**. La variable `$avdAppId` contient l'ID d'application du principal de service Azure Virtual Desktop.

    Vous devez activer Start VM on Connect pour hp-eng. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $sp = Get-AzADServicePrincipal -ApplicationId $avdAppId
    $subId = (Get-AzContext).Subscription.Id

    New-AzRoleAssignment -ObjectId $sp.Id -Scope "/subscriptions/$subId" `
      -RoleDefinitionName "[[role]]"

    Update-AzWvdHostPool -Name hp-eng -ResourceGroupName rg-avd [[switch]]
  slots:
    - id: role
      options:
        - { id: onoff, text: Desktop Virtualization Power On Off Contributor }
        - { id: vmc, text: Desktop Virtualization Virtual Machine Contributor }
        - { id: on, text: Desktop Virtualization Power On Contributor }
        - { id: hpc, text: Desktop Virtualization Host Pool Contributor }
    - id: switch
      options:
        - { id: validation, text: "-ValidationEnvironment:$true" }
        - { id: start, text: "-StartVMOnConnect:$true" }
        - { id: personal, text: "-PersonalDesktopAssignmentType Automatic" }
answer:
  values: { role: on, switch: start }
explanation:
  correct:
    en: |
      Start VM on Connect only needs to start VMs, so Desktop Virtualization Power On Contributor is the least-privileged role for the Azure Virtual Desktop service principal. The `-StartVMOnConnect` switch of `Update-AzWvdHostPool` turns the feature on for an existing host pool.
    fr: |
      Start VM on Connect n'a besoin que de démarrer des machines virtuelles : Desktop Virtualization Power On Contributor est le rôle de moindre privilège pour le principal de service Azure Virtual Desktop. Le commutateur `-StartVMOnConnect` de `Update-AzWvdHostPool` active la fonctionnalité sur un pool d'hôtes existant.
  options:
    onoff: { en: "Power On Off Contributor also stops VMs; it's meant for autoscale and grants more than needed.", fr: "Power On Off Contributor arrête aussi les machines virtuelles ; il est prévu pour la mise à l'échelle automatique et accorde plus que nécessaire." }
    vmc: { en: "Virtual Machine Contributor lets the service create, delete and update VMs, far more than starting them.", fr: "Virtual Machine Contributor permet au service de créer, supprimer et modifier des machines virtuelles, bien plus que les démarrer." }
    hpc: { en: "Host Pool Contributor manages the host pool object; it doesn't allow starting VMs.", fr: "Host Pool Contributor gère l'objet pool d'hôtes ; il ne permet pas de démarrer des machines virtuelles." }
    validation: { en: "ValidationEnvironment makes the host pool receive service updates first; it doesn't start VMs.", fr: "ValidationEnvironment fait recevoir les mises à jour du service en premier au pool d'hôtes ; il ne démarre pas de machines virtuelles." }
    personal: { en: "The assignment type controls how users get a personal desktop, not whether VMs start on connection.", fr: "Le type d'attribution contrôle la façon dont les utilisateurs obtiennent un bureau personnel, pas le démarrage des machines virtuelles à la connexion." }
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
