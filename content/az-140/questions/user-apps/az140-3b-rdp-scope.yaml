id: az140-3b-rdp-scope
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Virtual Desktop pooled host pool named **hp-ops**. The finance users are assigned to the desktop application group of hp-ops, and the engineering users are assigned to a RemoteApp application group of hp-ops.

    The finance users must be able to redirect their local drives. The engineering users must not be able to redirect drives. No policy on the session hosts restricts drive redirection.

    What should you do?
  fr: |
    Fabrikam dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-ops**. Les utilisateurs de la finance sont affectés au groupe d'applications de bureau de hp-ops, et les utilisateurs de l'ingénierie à un groupe d'applications RemoteApp de hp-ops.

    Les utilisateurs de la finance doivent pouvoir rediriger leurs lecteurs locaux. Les utilisateurs de l'ingénierie ne doivent pas pouvoir rediriger de lecteurs. Aucune stratégie sur les hôtes de session ne restreint la redirection de lecteurs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Publish the engineering applications from a second host pool whose RDP properties contain `drivestoredirect:s:`.", fr: "Publier les applications de l'ingénierie depuis un second pool d'hôtes dont les propriétés RDP contiennent `drivestoredirect:s:`." } }
    - { id: b, text: { en: "Register the engineering RemoteApp application group to a separate workspace that has `drivestoredirect:s:`.", fr: "Inscrire le groupe d'applications RemoteApp de l'ingénierie dans un espace de travail distinct qui a `drivestoredirect:s:`." } }
    - { id: c, text: { en: "Set `drivestoredirect:s:` in the properties of the engineering RemoteApp application group.", fr: "Définir `drivestoredirect:s:` dans les propriétés du groupe d'applications RemoteApp de l'ingénierie." } }
    - { id: d, text: { en: "Set `drivestoredirect:s:*` in the RDP properties of hp-ops and `drivestoredirect:s:` for the engineering user group.", fr: "Définir `drivestoredirect:s:*` dans les propriétés RDP de hp-ops et `drivestoredirect:s:` pour le groupe d'utilisateurs de l'ingénierie." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      RDP properties are defined on the host pool and apply to every connection to its session hosts, whatever the application group or user. Users who need different redirection settings must connect to a different host pool, here one with `drivestoredirect:s:` (no drives redirected).
    fr: |
      Les propriétés RDP se définissent sur le pool d'hôtes et s'appliquent à chaque connexion à ses hôtes de session, quels que soient le groupe d'applications ou l'utilisateur. Les utilisateurs qui ont besoin de paramètres de redirection différents doivent se connecter à un autre pool d'hôtes, ici un pool avec `drivestoredirect:s:` (aucun lecteur redirigé).
  options:
    c: { en: "Application groups have no RDP properties.", fr: "Les groupes d'applications n'ont pas de propriétés RDP." }
    b: { en: "Workspaces have no RDP properties; they only group application groups in the feed.", fr: "Les espaces de travail n'ont pas de propriétés RDP ; ils regroupent seulement des groupes d'applications dans le flux." }
    d: { en: "RDP properties can't be set per user or per group.", fr: "Les propriétés RDP ne peuvent pas être définies par utilisateur ni par groupe." }
references:
  - title: Set custom RDP properties on a host pool in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/customize-rdp-properties
