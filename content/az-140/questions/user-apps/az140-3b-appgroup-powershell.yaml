id: az140-3b-appgroup-powershell
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop pooled host pool named **hp-sales** and a workspace named **ws-sales** in a resource group named **rg-avd** in the West Europe region.

    You need to create an application group named **ag-sales-apps** that publishes individual applications from hp-sales, and make it visible in ws-sales.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-sales** et d'un espace de travail nommé **ws-sales** dans un groupe de ressources nommé **rg-avd**, dans la région West Europe.

    Vous devez créer un groupe d'applications nommé **ag-sales-apps** qui publie des applications individuelles de hp-sales, et le rendre visible dans ws-sales.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $hp = Get-AzWvdHostPool -Name hp-sales -ResourceGroupName rg-avd

    New-AzWvdApplicationGroup -Name ag-sales-apps -ResourceGroupName rg-avd `
      -Location westeurope -ApplicationGroupType [[type]] -HostPoolArmPath [[path]]

    $ag = Get-AzWvdApplicationGroup -Name ag-sales-apps -ResourceGroupName rg-avd

    [[cmd]] -WorkspaceName ws-sales -ResourceGroupName rg-avd `
      -ApplicationGroupPath $ag.Id
  slots:
    - id: type
      options:
        - { id: desktop, text: Desktop }
        - { id: remoteapp, text: RemoteApp }
        - { id: pooled, text: Pooled }
    - id: path
      options:
        - { id: name, text: $hp.Name }
        - { id: id, text: $hp.Id }
        - { id: ref, text: $hp.ApplicationGroupReference }
    - id: cmd
      options:
        - { id: newws, text: New-AzWvdWorkspace }
        - { id: register, text: Register-AzWvdApplicationGroup }
        - { id: role, text: New-AzRoleAssignment }
        - { id: updag, text: Update-AzWvdApplicationGroup }
answer:
  values: { type: remoteapp, path: id, cmd: register }
explanation:
  correct:
    en: |
      Individual applications are published in a RemoteApp application group, so `-ApplicationGroupType` is `RemoteApp`. `-HostPoolArmPath` expects the full Azure Resource Manager ID of the host pool, returned by `$hp.Id`. `Register-AzWvdApplicationGroup` associates the application group with the workspace, which is required for its resources to appear in users' feeds.
    fr: |
      Les applications individuelles se publient dans un groupe d'applications RemoteApp : `-ApplicationGroupType` vaut donc `RemoteApp`. `-HostPoolArmPath` attend l'ID Azure Resource Manager complet du pool d'hôtes, renvoyé par `$hp.Id`. `Register-AzWvdApplicationGroup` associe le groupe d'applications à l'espace de travail, ce qui est nécessaire pour que ses ressources apparaissent dans le flux des utilisateurs.
  options:
    desktop: { en: "A desktop application group publishes a full desktop, and a host pool can have only one.", fr: "Un groupe d'applications de bureau publie un bureau complet, et un pool d'hôtes ne peut en avoir qu'un." }
    pooled: { en: "Pooled is a host pool type, not an application group type.", fr: "Pooled est un type de pool d'hôtes, pas un type de groupe d'applications." }
    name: { en: "The parameter needs the resource ID path, not the name.", fr: "Le paramètre attend le chemin de l'ID de ressource, pas le nom." }
    ref: { en: "ApplicationGroupReference lists the application groups of the host pool, not its ID.", fr: "ApplicationGroupReference liste les groupes d'applications du pool d'hôtes, pas son ID." }
    newws: { en: "The workspace already exists; creating it again doesn't register the application group with -ApplicationGroupPath.", fr: "L'espace de travail existe déjà ; le recréer n'inscrit pas le groupe d'applications avec -ApplicationGroupPath." }
    role: { en: "A role assignment gives users access but doesn't register the group in the workspace.", fr: "Une attribution de rôle donne l'accès aux utilisateurs mais n'inscrit pas le groupe dans l'espace de travail." }
    updag: { en: "Update-AzWvdApplicationGroup changes the properties of the group; it has no -WorkspaceName parameter.", fr: "Update-AzWvdApplicationGroup modifie les propriétés du groupe ; il n'a pas de paramètre -WorkspaceName." }
references:
  - title: New-AzWvdApplicationGroup
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/new-azwvdapplicationgroup
  - title: Register-AzWvdApplicationGroup
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/register-azwvdapplicationgroup
