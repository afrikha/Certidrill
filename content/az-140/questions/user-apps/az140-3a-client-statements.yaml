id: az140-3a-client-statements
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware users connect to Azure Virtual Desktop from Windows, macOS and Linux devices. You are comparing Windows App on macOS with Windows App in a web browser.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les utilisateurs de Litware se connectent à Azure Virtual Desktop depuis des appareils Windows, macOS et Linux. Vous comparez Windows App sur macOS et Windows App dans un navigateur web.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Windows App in a web browser can use RDP Shortpath for public networks.
        fr: |-
          Windows App dans un navigateur web peut utiliser RDP Shortpath pour les réseaux publics.
    - id: s2
      text:
        en: |-
          Windows App on macOS can display a remote desktop across multiple monitors.
        fr: |-
          Windows App sur macOS peut afficher un bureau distant sur plusieurs moniteurs.
    - id: s3
      text:
        en: |-
          Windows App in a web browser makes the local drives of the device appear as redirected drives in the remote session.
        fr: |-
          Windows App dans un navigateur web fait apparaître les lecteurs locaux de l'appareil comme lecteurs redirigés dans la session distante.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      RDP Shortpath, for managed or public networks, isn't available in the web browser. Multiple monitors are supported on Windows, macOS and ChromeOS devices, but not on iOS/iPadOS or in a browser. In a browser, local storage access is limited to uploading and downloading files.
    fr: |-
      RDP Shortpath, pour les réseaux managés ou publics, n'est pas disponible dans le navigateur web. Plusieurs moniteurs sont pris en charge sur Windows, macOS et les appareils ChromeOS, mais pas sur iOS/iPadOS ni dans un navigateur. Dans un navigateur, l'accès au stockage local se limite au chargement et au téléchargement de fichiers.
references:
  - title: Compare Windows App features across platforms and devices
    url: https://learn.microsoft.com/en-us/windows-app/compare-platforms-features
