id: az140-sr2-idle-sessions-1
objective: "3.2.9"
type: series_yesno
series: az140-sr2-idle-sessions
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You configure a time limit for active sessions and a time limit for disconnected sessions.
  fr: |
    Vous configurez une limite de temps pour les sessions actives et une limite de temps pour les sessions déconnectées.
body:
  solution:
    en: |
      You create a Group Policy Object (GPO) linked to the AVD-Pool2 OU. Under **Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits**, you enable **Set time limit for active Remote Desktop Services sessions** with **30 minutes** and **Set time limit for disconnected sessions** with **1 hour**.
    fr: |
      Vous créez un objet de stratégie de groupe (GPO) lié à l'UO AVD-Pool2. Sous **Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits**, vous activez **Set time limit for active Remote Desktop Services sessions** avec **30 minutes** et **Set time limit for disconnected sessions** avec **1 hour**.
answer: { value: false }
explanation:
  correct:
    en: The active session limit caps the total duration of an active session, whatever the user's activity, so every user would be disconnected 30 minutes after connecting, even while working. The disconnected session limit is correct, but the policy that disconnects sessions without user input is **Set time limit for active but idle Remote Desktop Services sessions**.
    fr: "La limite des sessions actives plafonne la durée totale d'une session active, quelle que soit l'activité de l'utilisateur : chaque utilisateur serait déconnecté 30 minutes après sa connexion, même en plein travail. La limite des sessions déconnectées est correcte, mais la stratégie qui déconnecte les sessions sans action de l'utilisateur est **Set time limit for active but idle Remote Desktop Services sessions**."
references:
  - title: Policy CSP - ADMX_TerminalServer
    url: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-terminalserver
