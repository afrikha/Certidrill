id: az140-3b-mmr-feature-match
objective: "3.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure Virtual Desktop host pool named **hp-contact**. Users connect by using Windows App on Windows 11 devices. You need to optimize the media workloads described in the following table.

    Which feature should you use for each workload? To answer, drag the appropriate features to the correct workloads. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-contact**. Les utilisateurs se connectent avec Windows App sur des appareils Windows 11. Vous devez optimiser les charges de travail multimédias décrites ci-dessous.

    Quelle fonctionnalité devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les fonctionnalités appropriées vers les charges de travail correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mmrvideo, text: { en: "Multimedia redirection: video playback redirection", fr: "Redirection multimédia : redirection de la lecture vidéo" } }
    - { id: mmrcall, text: { en: "Multimedia redirection: call redirection", fr: "Redirection multimédia : redirection des appels" } }
    - { id: teams, text: { en: "Media optimization for Microsoft Teams", fr: "Optimisation multimédia pour Microsoft Teams" } }
    - { id: camera, text: { en: "Camera redirection (camerastoredirect:s:*)", fr: "Redirection de caméra (camerastoredirect:s:*)" } }
    - { id: shortpath, text: { en: "RDP Shortpath for public networks", fr: "RDP Shortpath pour les réseaux publics" } }
  targets:
    - { id: t1, text: { en: "Agents take calls in the Genesys web app in Microsoft Edge, and the WebRTC media must be processed on the local device.", fr: "Les agents prennent des appels dans l'application web Genesys sous Microsoft Edge, et le média WebRTC doit être traité sur l'appareil local." } }
    - { id: t2, text: { en: "Employees watch Microsoft Stream videos in Microsoft Edge in the session.", fr: "Les employés regardent des vidéos Microsoft Stream dans Microsoft Edge au sein de la session." } }
    - { id: t3, text: { en: "Employees join meetings from the Microsoft Teams app installed on the session hosts.", fr: "Les employés participent à des réunions depuis l'application Microsoft Teams installée sur les hôtes de session." } }
answer:
  mapping: { t1: mmrcall, t2: mmrvideo, t3: teams }
explanation:
  correct:
    en: |
      Call redirection, part of multimedia redirection, offloads WebRTC calls of browser-based calling apps such as Genesys to the local device. Video playback redirection sends the video bitstream of supported sites such as Microsoft Stream to the local device for decoding. The Teams app has its own media optimization and doesn't use multimedia redirection.
    fr: |
      La redirection des appels, qui fait partie de la redirection multimédia, décharge vers l'appareil local les appels WebRTC des applications d'appel web comme Genesys. La redirection de la lecture vidéo envoie le flux vidéo des sites pris en charge comme Microsoft Stream à l'appareil local pour décodage. L'application Teams a sa propre optimisation multimédia et n'utilise pas la redirection multimédia.
  options:
    camera: { en: "Camera redirection makes the local webcam available in the session, but the media is still processed on the session host.", fr: "La redirection de caméra rend la webcam locale disponible dans la session, mais le média reste traité sur l'hôte de session." }
    shortpath: { en: "RDP Shortpath changes the transport of the RDP connection; it doesn't offload media processing.", fr: "RDP Shortpath change le transport de la connexion RDP ; il ne décharge pas le traitement multimédia." }
references:
  - title: Multimedia redirection for video playback and calls in a remote session
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/multimedia-redirection
