id: az140-3b-personal-friendly-name
objective: "3.2.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Virtual Desktop personal host pool named **hp-cad** that allows multiple personal desktops per user. Each designer is assigned a standard session host and a GPU session host. In Windows App, both desktops appear with the same name, and designers can't tell which one is the GPU desktop.

    You need each desktop of a designer to appear with its own name in Windows App.

    What should you use?
  fr: |
    Fabrikam dispose d'un pool d'hôtes personnel Azure Virtual Desktop nommé **hp-cad** qui autorise plusieurs bureaux personnels par utilisateur. Chaque concepteur se voit attribuer un hôte de session standard et un hôte de session GPU. Dans Windows App, les deux bureaux apparaissent sous le même nom, et les concepteurs ne savent pas lequel est le bureau GPU.

    Vous devez faire en sorte que chaque bureau d'un concepteur apparaisse sous son propre nom dans Windows App.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The **Display name** of the desktop in the **Applications** of the desktop application group", fr: "Le **Nom d'affichage** du bureau dans les **Applications** du groupe d'applications de bureau" } }
    - { id: b, text: { en: "`Update-AzWvdSessionHost` with the `-FriendlyName` parameter", fr: "`Update-AzWvdSessionHost` avec le paramètre `-FriendlyName`" } }
    - { id: c, text: { en: "`Update-AzWvdHostPool` with the `-FriendlyName` parameter", fr: "`Update-AzWvdHostPool` avec le paramètre `-FriendlyName`" } }
    - { id: d, text: { en: "`Update-AzWvdApplicationGroup` with the `-FriendlyName` parameter", fr: "`Update-AzWvdApplicationGroup` avec le paramètre `-FriendlyName`" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In a personal host pool, each session host can have a friendly name, which is empty by default; all users then see the same desktop name. Setting it with `Update-AzWvdSessionHost -FriendlyName` gives each desktop its own name. The portal and Azure CLI can't set it.
    fr: |
      Dans un pool d'hôtes personnel, chaque hôte de session peut avoir un nom convivial, vide par défaut ; tous les utilisateurs voient alors le même nom de bureau. Le définir avec `Update-AzWvdSessionHost -FriendlyName` donne à chaque bureau son propre nom. Le portail et Azure CLI ne permettent pas de le définir.
  options:
    a: { en: "The display name of the desktop is the same for every session host of the host pool.", fr: "Le nom d'affichage du bureau est le même pour tous les hôtes de session du pool d'hôtes." }
    c: { en: "The host pool friendly name is one value for the whole host pool.", fr: "Le nom convivial du pool d'hôtes est une seule valeur pour tout le pool." }
    d: { en: "The application group friendly name is one value for the whole application group.", fr: "Le nom convivial du groupe d'applications est une seule valeur pour tout le groupe." }
references:
  - title: Customize the feed for Azure Virtual Desktop users
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/customize-feed-for-virtual-desktop-users
  - title: Configure personal desktop assignment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
