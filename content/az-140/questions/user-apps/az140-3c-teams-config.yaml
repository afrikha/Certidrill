id: az140-3c-teams-config
objective: "3.3.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are preparing a custom image for an Azure Virtual Desktop pooled host pool named **HP1**. User profiles are stored in FSLogix containers: a Profile Container and an ODFC container.

    You need to deploy new Microsoft Teams on the session hosts.

    What should you configure for each requirement? To answer, drag the appropriate items to the correct requirements. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez une image personnalisée pour un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1**. Les profils utilisateur sont stockés dans des conteneurs FSLogix : un conteneur de profil (Profile Container) et un conteneur ODFC.

    Vous devez déployer le nouveau Microsoft Teams sur les hôtes de session.

    Que devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: wvd, text: "`IsWVDEnvironment` = 1" }
    - { id: boot, text: "`teamsbootstrapper.exe -p`" }
    - { id: upd, text: "`disableAutoUpdate` = 1" }
    - { id: odfc, text: "`IncludeTeams` = 1" }
    - { id: remove, text: "`teamsbootstrapper.exe -x`" }
    - { id: fallback, text: "`DisableFallback` = 1" }
  targets:
    - { id: t1, text: { en: "Let Teams detect Azure Virtual Desktop so that media optimization loads", fr: "Permettre à Teams de détecter Azure Virtual Desktop pour que l'optimisation des médias se charge" } }
    - { id: t2, text: { en: "Provision Teams for all the users of the session host", fr: "Approvisionner Teams pour tous les utilisateurs de l'hôte de session" } }
    - { id: t3, text: { en: "Prevent Teams from updating itself on the session hosts", fr: "Empêcher Teams de se mettre à jour lui-même sur les hôtes de session" } }
    - { id: t4, text: { en: "Preserve the Teams user data and cache in the ODFC container", fr: "Conserver les données utilisateur et le cache de Teams dans le conteneur ODFC" } }
answer:
  mapping: { t1: wvd, t2: boot, t3: upd, t4: odfc }
explanation:
  correct:
    en: |
      `IsWVDEnvironment` (DWORD) = 1 under HKLM\SOFTWARE\Microsoft\Teams is required on the session hosts for Teams to be optimized. `teamsbootstrapper.exe -p` provisions Teams for all users of the computer. `disableAutoUpdate` = 1 under the same key stops automatic updates, so you update Teams through the image. With an ODFC container, `IncludeTeams` must be set to preserve the Teams data and cache.
    fr: |
      `IsWVDEnvironment` (DWORD) = 1 sous HKLM\SOFTWARE\Microsoft\Teams est requis sur les hôtes de session pour que Teams soit optimisé. `teamsbootstrapper.exe -p` approvisionne Teams pour tous les utilisateurs de l'ordinateur. `disableAutoUpdate` = 1 sous la même clé arrête les mises à jour automatiques : vous mettez Teams à jour par l'image. Avec un conteneur ODFC, `IncludeTeams` doit être défini pour conserver les données et le cache de Teams.
  options:
    remove:
      en: The -x switch deprovisions Teams for all users and deletes their Teams profile and cache.
      fr: Le commutateur -x retire Teams pour tous les utilisateurs et supprime leur profil et leur cache Teams.
    fallback:
      en: DisableFallback controls the fallback mode when optimization isn't available; it doesn't enable optimization or stop updates.
      fr: DisableFallback contrôle le mode de secours quand l'optimisation n'est pas disponible ; il n'active pas l'optimisation et n'arrête pas les mises à jour.
references:
  - title: Microsoft Teams for Virtualized Desktop Infrastructure (VDI)
    url: https://learn.microsoft.com/en-us/microsoftteams/new-teams-vdi-requirements-deploy
  - title: Use Microsoft Teams on Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/teams-on-avd
