id: az140-3b-rdp-monitors
objective: "3.2.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Azure Virtual Desktop host pool named **hp-trading**. The custom RDP properties of hp-trading currently contain `use multimon:i:0`.

    Traders connect from Windows devices that have three monitors. On every device, `mstsc.exe /l` reports the display IDs 0, 1 and 2. The session must use only displays 0 and 1, and display 2 must stay available to local applications.

    Which two RDP property values should the custom RDP properties of hp-trading contain? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-trading**. Les propriétés RDP personnalisées de hp-trading contiennent actuellement `use multimon:i:0`.

    Les traders se connectent depuis des appareils Windows qui ont trois écrans. Sur chaque appareil, `mstsc.exe /l` indique les ID d'affichage 0, 1 et 2. La session doit utiliser uniquement les écrans 0 et 1, et l'écran 2 doit rester disponible pour les applications locales.

    Quelles sont les deux valeurs de propriété RDP que les propriétés RDP personnalisées de hp-trading doivent contenir ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "use multimon:i:1" }
    - { id: b, text: "selectedmonitors:s:0,1" }
    - { id: c, text: "maximizetocurrentdisplays:i:1" }
    - { id: d, text: "singlemoninwindowedmode:i:1" }
    - { id: e, text: "use multimon:i:0" }
    - { id: f, text: "dynamic resolution:i:0" }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      `selectedmonitors:s:` takes a comma-separated list of the display IDs returned by `mstsc.exe /l`, here `0,1`. It works only when multiple displays are enabled, so `use multimon:i:0` must be replaced by `use multimon:i:1`.
    fr: |
      `selectedmonitors:s:` prend une liste d'ID d'affichage séparés par des virgules, tels que les renvoie `mstsc.exe /l`, ici `0,1`. Elle ne fonctionne que si plusieurs écrans sont activés : `use multimon:i:0` doit donc être remplacée par `use multimon:i:1`.
  options:
    c: { en: "maximizetocurrentdisplays decides which displays the session uses when it is maximized; it doesn't select a fixed set of displays.", fr: "maximizetocurrentdisplays détermine les écrans utilisés quand la session est agrandie ; elle ne sélectionne pas un ensemble fixe d'écrans." }
    d: { en: "singlemoninwindowedmode switches a multi-display session to one display in windowed mode.", fr: "singlemoninwindowedmode bascule une session multi-écran sur un seul écran en mode fenêtré." }
    e: { en: "use multimon:i:0 limits the session to one display, and selectedmonitors is ignored.", fr: "use multimon:i:0 limite la session à un seul écran, et selectedmonitors est ignorée." }
    f: { en: "dynamic resolution controls whether the resolution follows the window size; it doesn't choose displays.", fr: "dynamic resolution indique si la résolution suit la taille de la fenêtre ; elle ne choisit pas les écrans." }
references:
  - title: Supported RDP properties
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-properties
