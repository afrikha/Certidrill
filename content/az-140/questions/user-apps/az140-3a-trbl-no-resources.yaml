id: az140-3a-trbl-no-resources
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has the following Azure Virtual Desktop resources:

    | Resource | Type | Configuration |
    | --- | --- | --- |
    | HP-Sales | Pooled host pool | Two available session hosts |
    | HP-Sales-DAG | Desktop application group of HP-Sales | User1 is assigned |
    | HP-Sales-RAG | RemoteApp application group of HP-Sales | User2 is assigned |
    | WS-Sales | Workspace | Contains HP-Sales-RAG |

    User1 signs in to Windows App and receives a message saying that the system administrator hasn't configured any resources yet.

    You need User1 to be able to connect to the full desktop.

    What should you do?
  fr: |
    Fabrikam dispose des ressources Azure Virtual Desktop suivantes :

    | Ressource | Type | Configuration |
    | --- | --- | --- |
    | HP-Sales | Pool d'hôtes partagé | Deux hôtes de session disponibles |
    | HP-Sales-DAG | Groupe d'applications de bureau de HP-Sales | User1 est attribué |
    | HP-Sales-RAG | Groupe d'applications RemoteApp de HP-Sales | User2 est attribué |
    | WS-Sales | Espace de travail | Contient HP-Sales-RAG |

    User1 se connecte à Windows App et reçoit un message indiquant que l'administrateur système n'a encore configuré aucune ressource.

    Vous devez permettre à User1 de se connecter au bureau complet.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Assign User1 to HP-Sales-RAG
        fr: |-
          Attribuer User1 à HP-Sales-RAG
    - id: b
      text:
        en: |-
          Add HP-Sales-DAG to WS-Sales
        fr: |-
          Ajouter HP-Sales-DAG à WS-Sales
    - id: c
      text:
        en: |-
          Enable Start VM on Connect for HP-Sales
        fr: |-
          Activer Start VM on Connect pour HP-Sales
    - id: d
      text:
        en: |-
          Assign User1 the Reader role on WS-Sales
        fr: |-
          Attribuer à User1 le rôle Reader sur WS-Sales
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Each application group must be associated with a workspace for users to see the desktops and applications published to them. User1 is correctly assigned to HP-Sales-DAG, but that application group isn't in any workspace, so Windows App shows no resources until HP-Sales-DAG is added to WS-Sales.
    fr: |-
      Chaque groupe d'applications doit être associé à un espace de travail pour que les utilisateurs voient les bureaux et les applications qui leur sont publiés. User1 est correctement attribué à HP-Sales-DAG, mais ce groupe d'applications ne figure dans aucun espace de travail : Windows App n'affiche donc aucune ressource tant que HP-Sales-DAG n'est pas ajouté à WS-Sales.
  options:
    a:
      en: |-
        User1 would see the RemoteApp applications, not the full desktop, which is published by the desktop application group.
      fr: |-
        User1 verrait les applications RemoteApp, pas le bureau complet, qui est publié par le groupe d'applications de bureau.
    c:
      en: |-
        Start VM on Connect starts deallocated session hosts at connection time; the session hosts are already available, and the problem is the empty feed.
      fr: |-
        Start VM on Connect démarre les hôtes de session libérés au moment de la connexion ; les hôtes de session sont déjà disponibles, et le problème est le flux vide.
    d:
      en: |-
        Access to published resources comes from the application group assignment, not from an Azure role on the workspace.
      fr: |-
        L'accès aux ressources publiées provient de l'attribution au groupe d'applications, pas d'un rôle Azure sur l'espace de travail.
references:
  - title: Azure Virtual Desktop terminology
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/terminology
  - title: Basic troubleshooting for Windows App
    url: https://learn.microsoft.com/en-us/windows-app/troubleshoot-basic
