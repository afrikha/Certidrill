id: az140-3b-print-driver-location
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has an Azure Virtual Desktop host pool named **hp-office**. Printer redirection is enabled in the RDP properties of hp-office. Users connect from Windows 11 laptops by using Windows App and print to a printer attached to their laptop by USB.

    You need to ensure that the printer works in the remote session.

    Where must the printer driver be installed?
  fr: |
    Wingtip Toys dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-office**. La redirection d'imprimante est activée dans les propriétés RDP de hp-office. Les utilisateurs se connectent depuis des ordinateurs portables Windows 11 avec Windows App et impriment sur une imprimante reliée en USB à leur portable.

    Vous devez faire en sorte que l'imprimante fonctionne dans la session distante.

    Où le pilote de l'imprimante doit-il être installé ?
body:
  options:
    - { id: a, text: { en: "On every session host of hp-office only", fr: "Uniquement sur chaque hôte de session de hp-office" } }
    - { id: b, text: { en: "On a print server that the session hosts can reach", fr: "Sur un serveur d'impression accessible aux hôtes de session" } }
    - { id: c, text: { en: "On both the users' laptops and every session host", fr: "À la fois sur les portables des utilisateurs et sur chaque hôte de session" } }
    - { id: d, text: { en: "On the users' laptops only", fr: "Uniquement sur les ordinateurs portables des utilisateurs" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Printer redirection is a high-level redirection. The session hosts use the Remote Desktop Easy Print driver automatically, so the real printer driver is needed only on the local device.
    fr: |
      La redirection d'imprimante est une redirection de haut niveau. Les hôtes de session utilisent automatiquement le pilote Remote Desktop Easy Print : le vrai pilote de l'imprimante n'est nécessaire que sur l'appareil local.
  options:
    a: { en: "The session hosts print through the Remote Desktop Easy Print driver; the local device still needs the printer's driver.", fr: "Les hôtes de session impriment via le pilote Remote Desktop Easy Print ; l'appareil local a toujours besoin du pilote de l'imprimante." }
    c: { en: "No printer-specific driver is needed on the session hosts for redirected printers.", fr: "Aucun pilote propre à l'imprimante n'est nécessaire sur les hôtes de session pour les imprimantes redirigées." }
    b: { en: "A redirected printer is reached through the user's device, not through a print server.", fr: "Une imprimante redirigée est atteinte par l'appareil de l'utilisateur, pas par un serveur d'impression." }
references:
  - title: Configure printer redirection over the Remote Desktop Protocol
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/redirection-configure-printers
