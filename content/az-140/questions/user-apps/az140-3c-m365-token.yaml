id: az140-3c-m365-token
objective: "3.3.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** that contains 10 session hosts. Microsoft 365 Apps for enterprise is installed on the session hosts with shared computer activation enabled and the default licensing settings. User profiles are stored in FSLogix profile containers.

    A user named **User1** signs in to a different session host of HP1 almost every day.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** qui contient 10 hôtes de session. Microsoft 365 Apps for enterprise est installé sur les hôtes de session avec l'activation d'ordinateurs partagés activée et les paramètres de licence par défaut. Les profils utilisateur sont stockés dans des conteneurs de profils FSLogix.

    Un utilisateur nommé **User1** se connecte presque chaque jour à un hôte de session différent de HP1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The licensing token of User1 is stored in User1's profile, so it follows User1 to the other session hosts.
        fr: Le jeton de licence de User1 est stocké dans le profil de User1 ; il suit donc User1 sur les autres hôtes de session.
    - id: s2
      text:
        en: Once obtained, the licensing token of User1 stays valid for 90 days.
        fr: Une fois obtenu, le jeton de licence de User1 reste valide pendant 90 jours.
    - id: s3
      text:
        en: Each session host on which User1 starts Microsoft 365 Apps counts toward the number of devices on which User1 can activate Microsoft 365 Apps.
        fr: Chaque hôte de session sur lequel User1 démarre Microsoft 365 Apps est décompté du nombre d'appareils sur lesquels User1 peut activer Microsoft 365 Apps.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      By default, the licensing token is stored in the user's profile folder (%localappdata%\Microsoft\Office\16.0\Licensing), which is inside the FSLogix profile container, so it roams. The token stored on a shared computer is valid for 30 days and is renewed automatically while the user works. Activations with shared computer activation don't count against the usual limit of devices per user.
    fr: |
      Par défaut, le jeton de licence est stocké dans le dossier de profil de l'utilisateur (%localappdata%\Microsoft\Office\16.0\Licensing), qui se trouve dans le conteneur de profil FSLogix : il suit donc l'utilisateur. Le jeton stocké sur un ordinateur partagé est valide 30 jours et se renouvelle automatiquement pendant que l'utilisateur travaille. Les activations par activation d'ordinateurs partagés ne sont pas décomptées de la limite habituelle d'appareils par utilisateur.
references:
  - title: Overview of shared computer activation for Microsoft 365 Apps
    url: https://learn.microsoft.com/en-us/microsoft-365-apps/licensing-activation/overview-shared-computer-activation
