id: az140-3b-policy-profile-type
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure Virtual Desktop pooled host pool named **hp-sales**. The session hosts run Windows 11 Enterprise multi-session, are Microsoft Entra joined and are enrolled in Microsoft Intune.

    You need to configure Remote Desktop Session Host settings and Microsoft Edge settings for the hp-sales session hosts by using Intune.

    Which profile type should you create?
  fr: |
    Adatum dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-sales**. Les hôtes de session exécutent Windows 11 Entreprise multisession, sont joints à Microsoft Entra et sont inscrits dans Microsoft Intune.

    Vous devez configurer des paramètres Remote Desktop Session Host et des paramètres Microsoft Edge pour les hôtes de session de hp-sales avec Intune.

    Quel type de profil devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "Templates > Device restrictions", fr: "Modèles > Restrictions d'appareil" } }
    - { id: b, text: { en: "Templates > Endpoint protection", fr: "Modèles > Endpoint Protection" } }
    - { id: c, text: { en: "Templates > Identity protection", fr: "Modèles > Identity Protection" } }
    - { id: d, text: { en: "Settings catalog", fr: "Catalogue de paramètres" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Windows Enterprise multi-session is configured with the settings catalog, which includes the ADMX-backed Remote Desktop Services and Microsoft Edge settings. Use the OS edition filter (Enterprise multi-session) to find the settings that apply.
    fr: |
      Windows Entreprise multisession se configure avec le catalogue de paramètres, qui inclut les paramètres ADMX des services Bureau à distance et de Microsoft Edge. Utilisez le filtre d'édition du système d'exploitation (Enterprise multi-session) pour trouver les paramètres applicables.
  options:
    a: { en: "Templates aren't delivered to multi-session devices, except certificate and device-tunnel VPN profiles; they report Not applicable.", fr: "Les modèles ne sont pas délivrés aux appareils multisession, sauf les profils de certificat et de VPN en tunnel d'appareil ; ils sont signalés Non applicable." }
    b: { en: "Endpoint protection is a template, which multi-session devices don't receive.", fr: "Endpoint Protection est un modèle, que les appareils multisession ne reçoivent pas." }
    c: { en: "Identity protection is a template, which multi-session devices don't receive.", fr: "Identity Protection est un modèle, que les appareils multisession ne reçoivent pas." }
references:
  - title: Using Azure Virtual Desktop multi-session with Microsoft Intune
    url: https://learn.microsoft.com/en-us/intune/intune-service/fundamentals/azure-virtual-desktop-multi-session
