id: az140-3b-timeout-disconnected
objective: "3.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop pooled host pool named **hp-call**. Users often close the Windows App window without signing out. Their disconnected sessions keep using memory on the session hosts for days.

    You need to ensure that a session is signed out two hours after it's disconnected. Users who are working in their session must not be affected.

    Which Group Policy setting should you configure?
  fr: |
    Contoso dispose d'un pool d'hôtes partagé Azure Virtual Desktop nommé **hp-call**. Les utilisateurs ferment souvent la fenêtre Windows App sans se déconnecter de leur session. Leurs sessions déconnectées continuent d'utiliser de la mémoire sur les hôtes de session pendant des jours.

    Vous devez faire en sorte qu'une session soit fermée deux heures après sa déconnexion. Les utilisateurs qui travaillent dans leur session ne doivent pas être affectés.

    Quel paramètre de stratégie de groupe devez-vous configurer ?
body:
  options:
    - { id: a, text: "Set time limit for active but idle Remote Desktop Services sessions" }
    - { id: b, text: "Set time limit for active Remote Desktop Services sessions" }
    - { id: c, text: "Set time limit for disconnected sessions" }
    - { id: d, text: "Disconnect remote session on lock for Microsoft identity platform authentication" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      **Set time limit for disconnected sessions**, under **Remote Desktop Session Host > Session Time Limits**, ends a disconnected session after the configured time, which frees its resources on the session host. Connected sessions aren't affected.
    fr: |
      **Set time limit for disconnected sessions**, sous **Remote Desktop Session Host > Session Time Limits**, met fin à une session déconnectée après le délai configuré, ce qui libère ses ressources sur l'hôte de session. Les sessions connectées ne sont pas affectées.
  options:
    a: { en: "The idle limit acts on connected sessions without input; it doesn't sign out sessions that are already disconnected.", fr: "La limite d'inactivité agit sur les sessions connectées sans saisie ; elle ne ferme pas les sessions déjà déconnectées." }
    b: { en: "The active session limit disconnects sessions after a maximum duration, which affects users who are working.", fr: "La limite de session active déconnecte les sessions après une durée maximale, ce qui affecte les utilisateurs qui travaillent." }
    d: { en: "This setting controls what happens when a session is locked; it doesn't sign out disconnected sessions.", fr: "Ce paramètre contrôle ce qui se passe au verrouillage d'une session ; il ne ferme pas les sessions déconnectées." }
references:
  - title: ADMX_TerminalServer Policy CSP
    url: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-terminalserver
