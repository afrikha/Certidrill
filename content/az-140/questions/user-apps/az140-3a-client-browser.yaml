id: az140-3a-client-browser
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has 40 shared kiosk computers that run Linux with a current version of Google Chrome. Policy prevents installing any software on the kiosks.

    Users of the kiosks must connect to desktops published from an Azure Virtual Desktop host pool by using their Microsoft Entra work accounts.

    Which client should the users use?
  fr: |
    Proseware dispose de 40 ordinateurs kiosques partagés qui exécutent Linux avec une version récente de Google Chrome. Une stratégie empêche d'installer le moindre logiciel sur les kiosques.

    Les utilisateurs des kiosques doivent se connecter à des bureaux publiés par un pool d'hôtes Azure Virtual Desktop à l'aide de leurs comptes professionnels Microsoft Entra.

    Quel client les utilisateurs doivent-ils utiliser ?
body:
  options:
    - id: a
      text:
        en: |-
          The Remote Desktop web client
        fr: |-
          Le client web Bureau à distance
    - id: b
      text:
        en: |-
          The Remote Desktop client for Windows (MSI)
        fr: |-
          Le client Bureau à distance pour Windows (MSI)
    - id: c
      text:
        en: |-
          Windows App in the web browser
        fr: |-
          Windows App dans le navigateur web
    - id: d
      text:
        en: |-
          The Remote Desktop app from the Microsoft Store
        fr: |-
          L'application Bureau à distance du Microsoft Store
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Windows App runs in a web browser, at https://windows.cloud.microsoft, without downloading or installing any software. Google Chrome is a supported browser on Linux, and users sign in with a work or school account.
    fr: |-
      Windows App s'exécute dans un navigateur web, à l'adresse https://windows.cloud.microsoft, sans télécharger ni installer de logiciel. Google Chrome est un navigateur pris en charge sur Linux, et les utilisateurs se connectent avec un compte professionnel ou scolaire.
  options:
    a:
      en: |-
        The Remote Desktop web client is no longer supported for public cloud customers since March 27, 2026; it is replaced by Windows App in a browser.
      fr: |-
        Le client web Bureau à distance n'est plus pris en charge pour les clients du cloud public depuis le 27 mars 2026 ; il est remplacé par Windows App dans un navigateur.
    b:
      en: |-
        The MSI client must be installed, runs only on Windows and is no longer supported for public cloud customers since March 27, 2026.
      fr: |-
        Le client MSI doit être installé, ne s'exécute que sur Windows et n'est plus pris en charge pour les clients du cloud public depuis le 27 mars 2026.
    d:
      en: |-
        The Remote Desktop app from the Microsoft Store reached end of support in September 2025 and can no longer be installed.
      fr: |-
        L'application Bureau à distance du Microsoft Store a atteint sa fin de support en septembre 2025 et ne peut plus être installée.
references:
  - title: What is Windows App?
    url: https://learn.microsoft.com/en-us/windows-app/overview
  - title: Use the Remote Desktop client to connect to Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/users/connect-windows?pivots=remote-desktop-msi
