id: az140-3c-browser-edge-sync
objective: "3.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has two Azure Virtual Desktop pooled host pools named **HP-Ops** and **HP-Apps**. Users have hybrid identities and Microsoft 365 E3 licenses. Many users keep a session open on each host pool at the same time and use Microsoft Edge in both sessions.

    You need to ensure that the Microsoft Edge favorites and settings of each user are available in both host pools, including changes that users make while both sessions are open. Users must not be able to turn off this behavior.

    What should you do?
  fr: |
    Adatum dispose de deux pools d'hôtes regroupés Azure Virtual Desktop nommés **HP-Ops** et **HP-Apps**. Les utilisateurs ont des identités hybrides et des licences Microsoft 365 E3. De nombreux utilisateurs gardent une session ouverte sur chaque pool d'hôtes en même temps et utilisent Microsoft Edge dans les deux sessions.

    Vous devez faire en sorte que les favoris et les paramètres Microsoft Edge de chaque utilisateur soient disponibles dans les deux pools d'hôtes, y compris les modifications faites pendant que les deux sessions sont ouvertes. Les utilisateurs ne doivent pas pouvoir désactiver ce comportement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable on-premises sync with the RoamingProfileSupportEnabled and RoamingProfileLocation policies.", fr: "Activer la synchronisation locale avec les stratégies RoamingProfileSupportEnabled et RoamingProfileLocation." } }
    - { id: b, text: { en: "Redirect the %LocalAppData%\\Microsoft\\Edge folder to a file share by using folder redirection.", fr: "Rediriger le dossier %LocalAppData%\\Microsoft\\Edge vers un partage de fichiers avec la redirection de dossiers." } }
    - { id: c, text: { en: "Use Microsoft Edge sync with the users' Microsoft Entra accounts and enable the ForceSync policy.", fr: "Utiliser la synchronisation Microsoft Edge avec les comptes Microsoft Entra des utilisateurs et activer la stratégie ForceSync." } }
    - { id: d, text: { en: "Configure the SyncTypesListDisabled policy with the favorites and settings data types.", fr: "Configurer la stratégie SyncTypesListDisabled avec les types de données favoris et paramètres." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft Edge sync for Microsoft Entra accounts stores favorites and settings in the Microsoft cloud, so every browser instance signed in with the account receives the changes, including concurrent sessions. Microsoft 365 E3 includes a qualifying plan. ForceSync turns on sync without the consent prompt, and users can't disable it.
    fr: |
      La synchronisation Microsoft Edge des comptes Microsoft Entra stocke les favoris et les paramètres dans le cloud Microsoft : chaque instance du navigateur connectée avec le compte reçoit les modifications, y compris dans des sessions simultanées. Microsoft 365 E3 comprend un plan qui y donne droit. ForceSync active la synchronisation sans invite de consentement, et les utilisateurs ne peuvent pas la désactiver.
  options:
    a:
      en: On-premises sync doesn't sync changes between simultaneous sessions and locks the profile.pb file, so data can be overwritten.
      fr: La synchronisation locale ne synchronise pas les modifications entre des sessions simultanées et verrouille le fichier profile.pb ; des données peuvent être écrasées.
    b:
      en: Roaming Edge folders other than profile.pb is unsupported and can cause unexpected behavior.
      fr: L'itinérance de dossiers Edge autres que profile.pb n'est pas prise en charge et peut provoquer un comportement inattendu.
    d:
      en: SyncTypesListDisabled excludes the listed data types from sync, the opposite of the requirement.
      fr: SyncTypesListDisabled exclut de la synchronisation les types de données listés, soit le contraire de l'exigence.
references:
  - title: Configure Microsoft Edge enterprise sync
    url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-enterprise-sync
  - title: On-premises sync for Active Directory (AD) users
    url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-on-premises-sync
