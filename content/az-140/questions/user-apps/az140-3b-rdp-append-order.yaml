id: az140-3b-rdp-append-order
objective: "3.2.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Virtual Desktop host pool named **hp-legal** in a resource group named **rg-avd**. The custom RDP properties of hp-legal contain seven properties that must be kept.

    You need to add the property `smart sizing:i:1` to hp-legal by using Azure PowerShell. Users must receive the change without the session hosts being restarted.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un pool d'hôtes Azure Virtual Desktop nommé **hp-legal** dans un groupe de ressources nommé **rg-avd**. Les propriétés RDP personnalisées de hp-legal contiennent sept propriétés qui doivent être conservées.

    Vous devez ajouter la propriété `smart sizing:i:1` à hp-legal avec Azure PowerShell. Les utilisateurs doivent recevoir la modification sans redémarrage des hôtes de session.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: get, text: { en: "Run `$hp = Get-AzWvdHostPool -Name hp-legal -ResourceGroupName rg-avd`.", fr: "Exécuter `$hp = Get-AzWvdHostPool -Name hp-legal -ResourceGroupName rg-avd`." } }
    - { id: build, text: { en: "Run `$props = $hp.CustomRdpProperty + \"smart sizing:i:1;\"`.", fr: "Exécuter `$props = $hp.CustomRdpProperty + \"smart sizing:i:1;\"`." } }
    - { id: update, text: { en: "Run `Update-AzWvdHostPool -Name hp-legal -ResourceGroupName rg-avd -CustomRdpProperty $props`.", fr: "Exécuter `Update-AzWvdHostPool -Name hp-legal -ResourceGroupName rg-avd -CustomRdpProperty $props`." } }
    - { id: refresh, text: { en: "Ask the users to refresh their resources in Windows App.", fr: "Demander aux utilisateurs d'actualiser leurs ressources dans Windows App." } }
    - { id: only, text: { en: "Run `Update-AzWvdHostPool -Name hp-legal -ResourceGroupName rg-avd -CustomRdpProperty \"smart sizing:i:1;\"`.", fr: "Exécuter `Update-AzWvdHostPool -Name hp-legal -ResourceGroupName rg-avd -CustomRdpProperty \"smart sizing:i:1;\"`." } }
    - { id: drain, text: { en: "Turn on drain mode for every session host of hp-legal.", fr: "Activer le mode drainage sur chaque hôte de session de hp-legal." } }
answer:
  sequence: [ get, build, update, refresh ]
explanation:
  correct:
    en: |
      The custom RDP properties of a host pool are one semicolon-separated string, and `-CustomRdpProperty` sets the whole string. To keep the existing properties, you read the current value, append the new property and write the combined string back. RDP properties are delivered in the connection file, so users only need to refresh their resources (or reconnect) to get them.
    fr: |
      Les propriétés RDP personnalisées d'un pool d'hôtes forment une seule chaîne séparée par des points-virgules, et `-CustomRdpProperty` définit la chaîne entière. Pour conserver les propriétés existantes, vous lisez la valeur actuelle, y ajoutez la nouvelle propriété et réécrivez la chaîne combinée. Les propriétés RDP sont fournies dans le fichier de connexion : les utilisateurs n'ont qu'à actualiser leurs ressources (ou à se reconnecter) pour les obtenir.
  options:
    only: { en: "Passing only the new property replaces the string and removes the seven existing properties.", fr: "Passer uniquement la nouvelle propriété remplace la chaîne et supprime les sept propriétés existantes." }
    drain: { en: "Drain mode stops new sessions on a host; it isn't needed to change RDP properties.", fr: "Le mode drainage bloque les nouvelles sessions sur un hôte ; il n'est pas nécessaire pour modifier les propriétés RDP." }
references:
  - title: Set custom RDP properties on a host pool in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/customize-rdp-properties
  - title: Update-AzWvdHostPool
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/update-azwvdhostpool
