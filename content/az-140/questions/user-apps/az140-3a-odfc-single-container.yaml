id: az140-3a-odfc-single-container
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The session hosts of a pooled host pool named **HP-Dev** use FSLogix profile containers configured with `VHDLocations`. No other profile solution is used.

    A manager asks you to add an ODFC container so that the Outlook OST files and the Teams cache follow users from one session host to another. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Les hôtes de session d'un pool d'hôtes partagé nommé **HP-Dev** utilisent des conteneurs de profil FSLogix configurés avec `VHDLocations`. Aucune autre solution de profils n'est utilisée.

    Un responsable vous demande d'ajouter un conteneur ODFC pour que les fichiers OST d'Outlook et le cache Teams suivent les utilisateurs d'un hôte de session à l'autre. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable an ODFC container on the same share and set IncludeTeams to 1
        fr: |-
          Activer un conteneur ODFC sur le même partage et définir IncludeTeams sur 1
    - id: b
      text:
        en: |-
          Make no change, because the profile container already includes this data
        fr: |-
          Ne rien modifier, car le conteneur de profil contient déjà ces données
    - id: c
      text:
        en: |-
          Set IncludeOutlook and IncludeTeams to 1 under HKLM\SOFTWARE\FSLogix\Profiles
        fr: |-
          Définir IncludeOutlook et IncludeTeams sur 1 sous HKLM\SOFTWARE\FSLogix\Profiles
    - id: d
      text:
        en: |-
          Replace VHDLocations with CCDLocations so that Microsoft 365 data is cached locally
        fr: |-
          Remplacer VHDLocations par CCDLocations pour que les données Microsoft 365 soient mises en cache localement
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A profile container redirects the whole user profile and includes all the benefits of the ODFC container, so Outlook, OneDrive and Teams data already roam. Microsoft states that there is no need or benefit to adding an ODFC container when profile containers are the primary profile solution.
    fr: |-
      Un conteneur de profil redirige tout le profil utilisateur et inclut tous les avantages du conteneur ODFC ; les données d'Outlook, de OneDrive et de Teams suivent donc déjà l'utilisateur. Microsoft indique qu'ajouter un conteneur ODFC n'est ni nécessaire ni utile lorsque les conteneurs de profil sont la solution de profils principale.
  options:
    a:
      en: |-
        A dual-container configuration is optional, isn't recommended for this need and adds a second disk to manage.
      fr: |-
        Une configuration à double conteneur est facultative, n'est pas recommandée pour ce besoin et ajoute un second disque à gérer.
    c:
      en: |-
        The Include settings belong to the ODFC configuration (HKLM\SOFTWARE\Policies\FSLogix\ODFC) and only apply to ODFC containers.
      fr: |-
        Les paramètres Include appartiennent à la configuration ODFC (HKLM\SOFTWARE\Policies\FSLogix\ODFC) et ne s'appliquent qu'aux conteneurs ODFC.
    d:
      en: |-
        Cloud Cache adds resiliency with several storage providers; it isn't needed for data to roam.
      fr: |-
        Cloud Cache ajoute de la résilience avec plusieurs fournisseurs de stockage ; il n'est pas nécessaire pour que les données suivent l'utilisateur.
references:
