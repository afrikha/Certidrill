id: az140-3c-m365-editions
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to deploy an Azure Virtual Desktop pooled host pool of Windows 11 Enterprise multi-session session hosts. Microsoft 365 Apps will be installed in the session host image and activated by using shared computer activation.

    Which two license plans provide a version of Microsoft 365 Apps that is supported on these session hosts? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de déployer un pool d'hôtes regroupé Azure Virtual Desktop composé d'hôtes de session Windows 11 Entreprise multisession. Microsoft 365 Apps sera installé dans l'image des hôtes de session et activé avec l'activation d'ordinateurs partagés.

    Quels sont les deux plans de licence qui fournissent une version de Microsoft 365 Apps prise en charge sur ces hôtes de session ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Microsoft 365 Business Standard }
    - { id: b, text: Microsoft 365 E3 }
    - { id: c, text: Microsoft 365 Business Basic }
    - { id: d, text: Microsoft 365 Business Premium }
    - { id: e, text: Office LTSC Professional Plus 2024 }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Windows 11 and Windows 10 Enterprise multi-session support only Microsoft 365 Apps for enterprise and the Microsoft 365 Apps for business that comes with Microsoft 365 Business Premium. Microsoft 365 E3 includes Microsoft 365 Apps for enterprise, and both plans support shared computer activation.
    fr: |
      Windows 11 et Windows 10 Entreprise multisession ne prennent en charge que Microsoft 365 Apps for enterprise et la version Microsoft 365 Apps for business fournie avec Microsoft 365 Business Premium. Microsoft 365 E3 comprend Microsoft 365 Apps for enterprise, et les deux plans prennent en charge l'activation d'ordinateurs partagés.
  options:
    a:
      en: Business Standard includes Microsoft 365 Apps for business, but without support for shared computer activation, and it isn't a supported version on multi-session.
      fr: Business Standard comprend Microsoft 365 Apps for business, mais sans prise en charge de l'activation d'ordinateurs partagés, et ce n'est pas une version prise en charge en multisession.
    c:
      en: Business Basic doesn't include the desktop versions of the Office applications.
      fr: Business Basic ne comprend pas les versions de bureau des applications Office.
    e:
      en: Volume-licensed Office LTSC isn't one of the two versions supported on Enterprise multi-session.
      fr: Office LTSC en licence en volume ne fait pas partie des deux versions prises en charge en multisession Entreprise.
references:
  - title: Install Office on a custom VHD image
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
  - title: Overview of shared computer activation for Microsoft 365 Apps
    url: https://learn.microsoft.com/en-us/microsoft-365-apps/licensing-activation/overview-shared-computer-activation
