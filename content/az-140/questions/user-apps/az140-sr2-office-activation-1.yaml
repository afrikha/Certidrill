id: az140-sr2-office-activation-1
objective: "3.3.5"
type: series_yesno
series: az140-sr2-office-activation
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You install the apps without a licensing property, and users activate them on each session host.
  fr: |
    Vous installez les applications sans propriété de licence, et les utilisateurs les activent sur chaque hôte de session.
body:
  solution:
    en: |
      The configuration.xml file contains `<Add OfficeClientEdition="64" Channel="MonthlyEnterprise">` with the product `O365ProPlusRetail`, and `<Updates Enabled="FALSE"/>`. It contains no `Property` element. Users activate Microsoft 365 Apps with their work account the first time they start an app on each session host.
    fr: |
      Le fichier configuration.xml contient `<Add OfficeClientEdition="64" Channel="MonthlyEnterprise">` avec le produit `O365ProPlusRetail`, et `<Updates Enabled="FALSE"/>`. Il ne contient aucun élément `Property`. Les utilisateurs activent Microsoft 365 Apps avec leur compte professionnel la première fois qu'ils lancent une application sur chaque hôte de session.
answer: { value: false }
explanation:
  correct:
    en: Updates are disabled correctly, but without shared computer activation Microsoft 365 Apps uses standard activation, which allows each user a limited number of devices, and every session host a user signs in to counts against that limit. Shared computer activation is required when several users share the same computer with their own accounts, so users moving between 12 session hosts would end up in reduced functionality mode, unable to edit documents.
    fr: "Les mises à jour sont correctement désactivées, mais sans activation d'ordinateurs partagés Microsoft 365 Apps utilise l'activation standard, qui accorde à chaque utilisateur un nombre limité d'appareils, et chaque hôte de session auquel un utilisateur se connecte compte dans cette limite. L'activation d'ordinateurs partagés est obligatoire quand plusieurs utilisateurs partagent le même ordinateur avec leurs propres comptes : des utilisateurs qui changent d'hôte parmi 12 hôtes de session finiraient en mode de fonctionnalité réduite, sans pouvoir modifier de documents."
references:
  - title: Overview of shared computer activation for Microsoft 365 Apps
    url: https://learn.microsoft.com/en-us/microsoft-365-apps/licensing-activation/overview-shared-computer-activation
