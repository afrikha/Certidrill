id: az140-cs1c-cloud-cache
objective: "3.1.4"
type: dropdown
caseStudy: az140-cs1c-alpine-ski-house
difficulty: 3
status: draft
stem:
  en: |
    You are writing the script that configures FSLogix on the session hosts of HP-Front-DR.

    How should you complete the script to meet the profile requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le script qui configure FSLogix sur les hôtes de session de HP-Front-DR.

    Comment devez-vous compléter le script pour satisfaire les exigences relatives aux profils ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $regPath = "HKLM:\SOFTWARE\FSLogix\Profiles"
    New-ItemProperty -Path $regPath -Name Enabled -PropertyType DWORD -Value 1 -Force
    New-ItemProperty -Path $regPath -Name [[name]] -PropertyType MultiString `
        -Value [[value]] -Force
    New-ItemProperty -Path $regPath -Name ProfileType -PropertyType DWORD -Value [[ptype]] -Force
  slots:
    - id: name
      options:
        - { id: vhd, text: VHDLocations }
        - { id: ccd, text: CCDLocations }
        - { id: vol, text: VolumeType }
    - id: value
      options:
        - { id: chnfirst, text: "'type=smb,connectionString=\\\\stalpprofchn.file.core.windows.net\\profiles;type=smb,connectionString=\\\\stalpprofgwc.file.core.windows.net\\profiles'" }
        - { id: gwcfirst, text: "'type=smb,connectionString=\\\\stalpprofgwc.file.core.windows.net\\profiles;type=smb,connectionString=\\\\stalpprofchn.file.core.windows.net\\profiles'" }
        - { id: gwconly, text: "'\\\\stalpprofgwc.file.core.windows.net\\profiles'" }
    - id: ptype
      options:
        - { id: p0, text: "0" }
        - { id: p2, text: "2" }
        - { id: p3, text: "3" }
answer:
  values: { name: ccd, value: gwcfirst, ptype: p0 }
explanation:
  correct:
    en: |
      Cloud Cache uses the CCDLocations value instead of VHDLocations, and the two settings must not be used together. Cloud Cache writes to every provider and lists them by proximity, so the HP-Front-DR hosts in Germany West Central list stalpprofgwc first, and the Switzerland North hosts use the reverse order. ProfileType 0 is the normal profile type, which prevents concurrent sessions on the same profile; values 2 and 3 enable read-only sessions for concurrent access.
    fr: |
      Cloud Cache utilise la valeur CCDLocations au lieu de VHDLocations, et les deux paramètres ne doivent pas être utilisés ensemble. Cloud Cache écrit sur chaque fournisseur et les répertorie par proximité : les hôtes de HP-Front-DR de Germany West Central placent donc stalpprofgwc en premier, et les hôtes de Switzerland North utilisent l'ordre inverse. ProfileType 0 est le type de profil normal, qui empêche les sessions simultanées sur le même profil ; les valeurs 2 et 3 activent des sessions en lecture seule pour l'accès simultané.
  options:
    value: { en: "Listing stalpprofchn first makes the Germany West Central hosts depend first on the remote region; a single UNC path is VHDLocations syntax and gives no replication.", fr: "Placer stalpprofchn en premier rend les hôtes de Germany West Central dépendants d'abord de la région distante ; un chemin UNC unique est la syntaxe de VHDLocations et n'offre aucune réplication." }
references:
  - title: "Tutorial: Configure profile containers with Cloud Cache"
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-cloud-cache-containers
  - title: Multiregion BCDR for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/azure-virtual-desktop/azure-virtual-desktop-multi-region-bcdr
