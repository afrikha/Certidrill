id: az140-3c-teams-clients
objective: "3.3.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **Pool1** that runs new Microsoft Teams. Media optimization is configured on the session hosts. All clients run the latest version.

    Four users connect to Pool1 as shown in the following table.

    | User | Connection |
    | --- | --- |
    | User1 | Windows App on a Windows 11 laptop |
    | User2 | Windows App in a web browser on a Windows 11 laptop |
    | User3 | Windows App on a Mac |
    | User4 | Windows App inside a remote session of another host pool, from which the user connects to Pool1 |

    Which two users get media optimization when they use Teams in Pool1?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **Pool1** qui exécute le nouveau Microsoft Teams. L'optimisation des médias est configurée sur les hôtes de session. Tous les clients exécutent la dernière version.

    Quatre utilisateurs se connectent à Pool1 comme l'indique le tableau suivant.

    | Utilisateur | Connexion |
    | --- | --- |
    | User1 | Windows App sur un ordinateur portable Windows 11 |
    | User2 | Windows App dans un navigateur web sur un ordinateur portable Windows 11 |
    | User3 | Windows App sur un Mac |
    | User4 | Windows App dans une session distante d'un autre pool d'hôtes, depuis laquelle l'utilisateur se connecte à Pool1 |

    Quels sont les deux utilisateurs qui bénéficient de l'optimisation des médias quand ils utilisent Teams dans Pool1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: User1 }
    - { id: b, text: User2 }
    - { id: c, text: User3 }
    - { id: d, text: User4 }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Windows App on Windows and Windows App on macOS are supported clients for Teams media optimization in Azure Virtual Desktop, so User1 and User3 get optimized calls and meetings.
    fr: |
      Windows App sur Windows et Windows App sur macOS sont des clients pris en charge pour l'optimisation des médias de Teams dans Azure Virtual Desktop : User1 et User3 bénéficient d'appels et de réunions optimisés.
  options:
    b:
      en: Web browsers don't support Teams optimization, so the web client of Windows App isn't a supported client.
      fr: |-
        Les navigateurs web ne prennent pas en charge l'optimisation de Teams : le client web de Windows App n'est pas un client pris en charge.
    d:
      en: Teams optimization isn't supported in nested (double hop) scenarios, where the client runs inside another remote session.
      fr: L'optimisation de Teams n'est pas prise en charge dans les scénarios imbriqués (double saut), où le client s'exécute dans une autre session distante.
references:
  - title: Use Microsoft Teams on Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/teams-on-avd
  - title: Microsoft Teams for Virtualized Desktop Infrastructure (VDI)
    url: https://learn.microsoft.com/en-us/microsoftteams/new-teams-vdi-requirements-deploy
