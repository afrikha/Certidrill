id: az140-1b-share-two-layers
objective: "1.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are preparing an Azure file share for the FSLogix profile containers of an Azure Virtual Desktop host pool. The storage account uses identity-based access with AD DS.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez un partage de fichiers Azure pour les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop. Le compte de stockage utilise l'accès basé sur l'identité avec AD DS.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A user can open the share only if both the share-level permissions and the NTFS permissions allow it.", fr: "Un utilisateur ne peut ouvrir le partage que si les autorisations au niveau du partage et les autorisations NTFS l'autorisent toutes les deux." } }
    - { id: b, text: { en: "Share-level roles alone prevent users from opening the profile folders of other users.", fr: "Les rôles au niveau du partage suffisent à empêcher les utilisateurs d'ouvrir les dossiers de profil des autres utilisateurs." } }
    - { id: c, text: { en: "Users need the Storage File Data SMB Share Elevated Contributor role to create their profile folder.", fr: "Les utilisateurs ont besoin du rôle Storage File Data SMB Share Elevated Contributor pour créer leur dossier de profil." } }
    - { id: d, text: { en: "The users' group needs Modify on the share root, applied to this folder only, to create profile folders.", fr: "Le groupe des utilisateurs a besoin de Modification à la racine du partage, appliqué à ce dossier seulement, pour créer les dossiers de profil." } }
    - { id: e, text: { en: "The Contributor role on the storage account grants access to the share over SMB.", fr: "Le rôle Contributor sur le compte de stockage accorde l'accès au partage en SMB." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Azure Files checks two layers: share-level permissions (Azure RBAC roles or the default share-level permission) and Windows NTFS permissions on folders and files. The recommended ACLs grant the users' group Modify on the root for this folder only, so that users create their own folder, and CREATOR OWNER Modify on subfolders and files only.
    fr: |
      Azure Files vérifie deux couches : les autorisations au niveau du partage (rôles Azure RBAC ou autorisation par défaut au niveau du partage) et les autorisations NTFS Windows sur les dossiers et fichiers. Les listes ACL recommandées accordent au groupe des utilisateurs Modification à la racine pour ce dossier seulement, afin que les utilisateurs créent leur propre dossier, et à CREATOR OWNER Modification sur les sous-dossiers et fichiers seulement.
  options:
    b: { en: "Share-level roles apply to the whole share; isolating each user's folder is the job of the NTFS permissions.", fr: "Les rôles au niveau du partage s'appliquent à tout le partage ; isoler le dossier de chaque utilisateur est le rôle des autorisations NTFS." }
    c: { en: "Storage File Data SMB Share Contributor is enough for users; Elevated Contributor is for administrators who modify ACLs.", fr: "Storage File Data SMB Share Contributor suffit aux utilisateurs ; Elevated Contributor est destiné aux administrateurs qui modifient les listes ACL." }
    e: { en: "Contributor is a management-plane role and grants no SMB data access.", fr: "Contributor est un rôle du plan de gestion et n'accorde aucun accès SMB aux données." }
references:
  - title: Configure SMB Storage Permissions
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-storage-permissions
  - title: Assign share-level permissions for Azure file shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
