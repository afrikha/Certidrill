id: az140-1a-mon-avdnettest
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user of Wingtip Toys connects from home to an Azure Virtual Desktop host pool named **HP1**. **Connection Information** always shows the transport **TCP**, while other remote users get UDP.

    You need to check, from the user's device, whether the STUN and TURN servers can be reached and which type of NAT the home network uses.

    Which tool should you run on the user's device?
  fr: |
    Un utilisateur de Wingtip Toys se connecte depuis son domicile à un pool d'hôtes Azure Virtual Desktop nommé **HP1**. **Connection Information** affiche toujours le transport **TCP**, alors que d'autres utilisateurs distants obtiennent UDP.

    Vous devez vérifier, depuis l'appareil de l'utilisateur, si les serveurs STUN et TURN sont joignables et quel type de NAT utilise le réseau domestique.

    Quel outil devez-vous exécuter sur l'appareil de l'utilisateur ?
body:
  options:
    - id: a
      text: WVDAgentUrlTool.exe
    - id: b
      text: { en: "Network Watcher connection troubleshoot", fr: "Résolution des problèmes de connexion de Network Watcher" }
    - id: c
      text: avdnettest.exe
    - id: d
      text: "Test-NetConnection -Port 443"
answer: { optionId: c }
explanation:
  correct:
    en: |
      avdnettest.exe runs on the client and checks DNS, TURN support and the reachability of the STUN/TURN servers on port 3478, then reports the NAT type. A cone-shaped NAT means RDP Shortpath for public networks is very likely to work; a symmetric NAT means the connection must rely on the TURN relay.
    fr: |
      avdnettest.exe s'exécute sur le client et vérifie le DNS, la prise en charge de TURN et l'accessibilité des serveurs STUN/TURN sur le port 3478, puis indique le type de NAT. Un NAT de type cône signifie que RDP Shortpath pour les réseaux publics a de très bonnes chances de fonctionner ; un NAT symétrique signifie que la connexion doit s'appuyer sur le relais TURN.
  options:
    a: { en: "The Agent URL Tool runs on session hosts and checks the required endpoints; it doesn't test NAT.", fr: "L'outil Agent URL Tool s'exécute sur les hôtes de session et vérifie les points de terminaison requis ; il ne teste pas le NAT." }
    b: { en: "Network Watcher tests from Azure resources, not from a user's home device, and doesn't report the NAT type.", fr: "Network Watcher effectue ses tests depuis des ressources Azure, pas depuis l'appareil domestique d'un utilisateur, et n'indique pas le type de NAT." }
    d: { en: "Test-NetConnection tests a TCP port; STUN and TURN use UDP, and it doesn't detect the NAT type.", fr: "Test-NetConnection teste un port TCP ; STUN et TURN utilisent UDP, et il ne détecte pas le type de NAT." }
references:
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
