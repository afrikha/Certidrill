id: az140-1c-hp-requirements
objective: "1.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank plans Azure Virtual Desktop host pools for four teams. Each team has the requirement shown in the answer area.

    Which host pool configuration should you recommend for each team? To answer, drag the appropriate configurations to the correct teams. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit des pools d'hôtes Azure Virtual Desktop pour quatre équipes. Chaque équipe a l'exigence indiquée dans la zone de réponse.

    Quelle configuration de pool d'hôtes devez-vous recommander pour chaque équipe ? Pour répondre, faites glisser les configurations appropriées vers les équipes correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bf, text: { en: "Pooled, breadth-first load balancing", fr: "Regroupé, équilibrage de charge breadth-first" } }
    - { id: df, text: { en: "Pooled, depth-first load balancing", fr: "Regroupé, équilibrage de charge depth-first" } }
    - { id: pauto, text: { en: "Personal, automatic assignment", fr: "Personnel, attribution automatique" } }
    - { id: pdirect, text: { en: "Personal, direct assignment", fr: "Personnel, attribution directe" } }
    - { id: val, text: { en: "Pooled, validation environment", fr: "Regroupé, environnement de validation" } }
  targets:
    - id: t1
      text: { en: "Call center: agents share hosts, and as few hosts as possible must be busy so that idle hosts can be shut down", fr: "Centre d'appels : les agents partagent les hôtes, et le moins d'hôtes possible doivent être occupés pour que les hôtes inactifs puissent être arrêtés" }
    - id: t2
      text: { en: "Analysts: users share hosts, and new sessions must be spread across hosts for the best performance", fr: "Analystes : les utilisateurs partagent les hôtes, et les nouvelles sessions doivent être réparties entre les hôtes pour les meilleures performances" }
    - id: t3
      text: { en: "Developers: each user needs a dedicated VM, and an administrator decides which VM each user gets", fr: "Développeurs : chaque utilisateur a besoin d'une machine virtuelle dédiée, et un administrateur décide de la machine virtuelle de chacun" }
    - id: t4
      text: { en: "Testers: each user needs a dedicated VM, received at first sign-in without administrator action", fr: "Testeurs : chaque utilisateur a besoin d'une machine virtuelle dédiée, reçue à la première connexion sans intervention d'un administrateur" }
answer:
  mapping: { t1: df, t2: bf, t3: pdirect, t4: pauto }
explanation:
  correct:
    en: |
      Depth-first fills one session host up to the max session limit before using the next, so fewer hosts are busy and the others can be scaled down. Breadth-first spreads new sessions across the hosts that have the fewest sessions. Personal host pools give each user a dedicated host; with direct assignment an administrator assigns it, with automatic assignment the user gets the first available host at first connection.
    fr: |
      Depth-first remplit un hôte de session jusqu'à la limite maximale de sessions avant d'utiliser le suivant : moins d'hôtes sont occupés et les autres peuvent être réduits. Breadth-first répartit les nouvelles sessions entre les hôtes qui ont le moins de sessions. Les pools d'hôtes personnels donnent à chaque utilisateur un hôte dédié ; avec l'attribution directe, un administrateur l'attribue, avec l'attribution automatique, l'utilisateur reçoit le premier hôte disponible à sa première connexion.
  options:
    val: { en: "A validation environment receives service updates first; it doesn't meet any of the teams' requirements.", fr: "Un environnement de validation reçoit les mises à jour du service en premier ; il ne répond à aucune des exigences des équipes." }
references:
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-load-balancing
  - title: Configure personal desktop assignment in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
