id: az140-1b-share-group-role
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a storage account named **stavdprof11** that is joined to AD DS. It contains a file share named **profiles-hr** for the FSLogix profile containers of a host pool used by the HR department. The default share-level permission of stavdprof11 is **None**.

    Members of a synced group named **HR-Users** have the Contributor role on stavdprof11, but FSLogix fails to attach their containers because access to the share is denied. Other users of the domain must not get access to profiles-hr.

    You need to fix the share-level access for HR-Users. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un compte de stockage nommé **stavdprof11**, joint à AD DS. Il contient un partage de fichiers nommé **profiles-hr** pour les conteneurs de profils FSLogix d'un pool d'hôtes utilisé par le service RH. L'autorisation par défaut au niveau du partage de stavdprof11 est **None**.

    Les membres d'un groupe synchronisé nommé **HR-Users** disposent du rôle Contributor sur stavdprof11, mais FSLogix ne parvient pas à attacher leurs conteneurs, car l'accès au partage est refusé. Les autres utilisateurs du domaine ne doivent pas obtenir d'accès à profiles-hr.

    Vous devez corriger l'accès au niveau du partage pour HR-Users. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the default share-level permission of stavdprof11 to Storage File Data SMB Share Contributor.", fr: "Définir l'autorisation par défaut au niveau du partage de stavdprof11 sur Storage File Data SMB Share Contributor." }
    - id: b
      text: { en: "Assign the Storage File Data SMB Share Contributor role on profiles-hr to HR-Users.", fr: "Attribuer le rôle Storage File Data SMB Share Contributor sur profiles-hr à HR-Users." }
    - id: c
      text: { en: "Assign the Storage Account Contributor role on stavdprof11 to HR-Users.", fr: "Attribuer le rôle Storage Account Contributor sur stavdprof11 à HR-Users." }
    - id: d
      text: { en: "Assign the Storage File Data SMB Share Elevated Contributor role on profiles-hr to HR-Users.", fr: "Attribuer le rôle Storage File Data SMB Share Elevated Contributor sur profiles-hr à HR-Users." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Contributor is a management-plane role: it lets users manage the storage account but grants no data access over SMB. Share-level access comes from the Storage File Data SMB Share roles; assigning Storage File Data SMB Share Contributor on the share to the synced group grants read, write and delete to HR-Users only.
    fr: |
      Contributor est un rôle du plan de gestion : il permet de gérer le compte de stockage, mais n'accorde aucun accès aux données en SMB. L'accès au niveau du partage provient des rôles Storage File Data SMB Share ; attribuer Storage File Data SMB Share Contributor sur le partage au groupe synchronisé accorde la lecture, l'écriture et la suppression à HR-Users uniquement.
  options:
    a: { en: "The default permission applies to all authenticated identities, so other users of the domain would get access too.", fr: "L'autorisation par défaut s'applique à toutes les identités authentifiées : les autres utilisateurs du domaine obtiendraient aussi l'accès." }
    c: { en: "Storage Account Contributor is another management-plane role; it doesn't grant SMB data access either.", fr: "Storage Account Contributor est un autre rôle du plan de gestion ; il n'accorde pas non plus d'accès SMB aux données." }
    d: { en: "Elevated Contributor adds the right to modify ACLs, which users don't need.", fr: "Elevated Contributor ajoute le droit de modifier les listes ACL, dont les utilisateurs n'ont pas besoin." }
references:
  - title: Assign share-level permissions for Azure file shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
