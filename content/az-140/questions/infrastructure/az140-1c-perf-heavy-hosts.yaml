id: az140-1c-perf-heavy-hosts
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation plans a pooled Azure Virtual Desktop host pool for 40 engineers who run a heavy workload on Windows 11 Enterprise multi-session. All 40 engineers sign in within 10 minutes at the start of their shift.

    You need to recommend the session host design that follows Microsoft's sizing guidelines for multi-session hosts and supports the 40 users.

    What should you recommend?
  fr: |
    Adatum Corporation prévoit un pool d'hôtes Azure Virtual Desktop regroupé pour 40 ingénieurs qui exécutent une charge de travail lourde sur Windows 11 Entreprise multisession. Les 40 ingénieurs ouvrent tous leur session dans les 10 minutes qui suivent le début de leur poste.

    Vous devez recommander la conception des hôtes de session qui suit les recommandations de dimensionnement de Microsoft pour les hôtes multisession et qui prend en charge les 40 utilisateurs.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One D32s_v5 session host (32 vCPUs)", fr: "Un hôte de session D32s_v5 (32 vCPU)" } }
    - { id: b, text: { en: "One D16s_v5 session host (16 vCPUs)", fr: "Un hôte de session D16s_v5 (16 vCPU)" } }
    - { id: c, text: { en: "Ten D2s_v5 session hosts (2 vCPUs each)", fr: "Dix hôtes de session D2s_v5 (2 vCPU chacun)" } }
    - { id: d, text: { en: "Three D8s_v5 session hosts (8 vCPUs each)", fr: "Trois hôtes de session D8s_v5 (8 vCPU chacun)" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The heavy workload baseline is two users per vCPU on hosts of at least 8 vCPUs, so 40 users need 20 vCPUs. Three D8s_v5 hosts give 24 vCPUs (48 users). With 20 or more users, several smaller hosts perform better than one large host, especially when many users sign in at once.
    fr: |
      La base pour une charge lourde est de deux utilisateurs par vCPU sur des hôtes d'au moins 8 vCPU : 40 utilisateurs exigent 20 vCPU. Trois hôtes D8s_v5 offrent 24 vCPU (48 utilisateurs). À partir de 20 utilisateurs, plusieurs petits hôtes font mieux qu'un seul gros hôte, surtout quand beaucoup d'utilisateurs ouvrent leur session en même temps.
  options:
    a: { en: "One large host has the capacity, but Microsoft recommends several smaller hosts for 20 or more users.", fr: "Un gros hôte a la capacité, mais Microsoft recommande plusieurs petits hôtes à partir de 20 utilisateurs." }
    b: { en: "16 vCPUs support only 32 heavy users, fewer than 40.", fr: "16 vCPU ne prennent en charge que 32 utilisateurs lourds, moins que 40." }
    c: { en: "Two-core multi-session hosts are unstable; Microsoft recommends at least four cores, and eight for this workload.", fr: "Les hôtes multisession à deux cœurs sont instables ; Microsoft recommande au moins quatre cœurs, et huit pour cette charge." }
references:
  - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
