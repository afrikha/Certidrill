id: az140-1a-mon-udp-blocked
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Users of Fabrikam connect from home over the internet to an Azure Virtual Desktop host pool named **HP1**. All the RDP Shortpath options of HP1 have their default values. On the users' devices, avdnettest.exe reports that the NAT type appears to be cone shaped.

    **Connection Information** shows the transport **TCP** for every session. The session host subnet is associated with a network security group that contains the following custom outbound rules:

    | Priority | Protocol and port | Destination | Action |
    | --- | --- | --- | --- |
    | 100 | TCP 443 | WindowsVirtualDesktop | Allow |
    | 110 | TCP 443 | AzureActiveDirectory | Allow |
    | 120 | TCP 443 | AzureMonitor | Allow |
    | 130 | TCP 1688 | Internet | Allow |
    | 4000 | Any | Internet | Deny |

    You need the sessions to use RDP Shortpath.

    What should you do?
  fr: |
    Les utilisateurs de Fabrikam se connectent depuis leur domicile, par Internet, à un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Toutes les options RDP Shortpath de HP1 ont leur valeur par défaut. Sur les appareils des utilisateurs, avdnettest.exe indique que le type de NAT semble être en forme de cône.

    **Connection Information** affiche le transport **TCP** pour toutes les sessions. Le sous-réseau des hôtes de session est associé à un groupe de sécurité réseau qui contient les règles sortantes personnalisées suivantes :

    | Priorité | Protocole et port | Destination | Action |
    | --- | --- | --- | --- |
    | 100 | TCP 443 | WindowsVirtualDesktop | Allow |
    | 110 | TCP 443 | AzureActiveDirectory | Allow |
    | 120 | TCP 443 | AzureMonitor | Allow |
    | 130 | TCP 1688 | Internet | Allow |
    | 4000 | Any | Internet | Deny |

    Vous devez faire en sorte que les sessions utilisent RDP Shortpath.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add an outbound rule that allows UDP from the session hosts to the internet.", fr: "Ajouter une règle sortante qui autorise UDP des hôtes de session vers Internet." }
    - id: b
      text: { en: "Add an inbound rule that allows UDP 3390 from the internet to the session hosts.", fr: "Ajouter une règle entrante qui autorise UDP 3390 d'Internet vers les hôtes de session." }
    - id: c
      text: { en: "Enable the Enable RDP Shortpath for managed networks policy on the session hosts.", fr: "Activer la stratégie Enable RDP Shortpath for managed networks sur les hôtes de session." }
    - id: d
      text: { en: "Add an outbound rule that allows TCP 3389 from the session hosts to the internet.", fr: "Ajouter une règle sortante qui autorise TCP 3389 des hôtes de session vers Internet." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The clients can use STUN, but the session hosts can't send any UDP: rule 4000 denies all other internet traffic. RDP Shortpath for public networks needs outbound UDP from the session hosts, to the STUN/TURN servers (UDP 3478) and, for direct STUN connections, to any destination on UDP 1024–65535 (49152–65535 by default). When a firewall blocks all UDP, RDP Shortpath fails and the session falls back to TCP reverse connect.
    fr: |
      Les clients peuvent utiliser STUN, mais les hôtes de session ne peuvent envoyer aucun trafic UDP : la règle 4000 refuse tout le reste du trafic Internet. RDP Shortpath pour les réseaux publics exige de l'UDP sortant depuis les hôtes de session, vers les serveurs STUN/TURN (UDP 3478) et, pour les connexions STUN directes, vers n'importe quelle destination sur UDP 1024–65535 (49152–65535 par défaut). Quand un pare-feu bloque tout l'UDP, RDP Shortpath échoue et la session se rabat sur TCP reverse connect.
  options:
    b: { en: "Public-network Shortpath needs no inbound port; UDP 3390 is the managed-network listener.", fr: "Shortpath pour les réseaux publics n'exige aucun port entrant ; UDP 3390 est l'écouteur des réseaux managés." }
    c: { en: "The users connect over the internet, not over a managed network, so the listener isn't the path they would use.", fr: "Les utilisateurs se connectent par Internet, pas par un réseau managé : l'écouteur n'est pas le chemin qu'ils utiliseraient." }
    d: { en: "Azure Virtual Desktop doesn't use TCP 3389, and RDP Shortpath is a UDP transport.", fr: "Azure Virtual Desktop n'utilise pas TCP 3389, et RDP Shortpath est un transport UDP." }
references:
  - title: RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
