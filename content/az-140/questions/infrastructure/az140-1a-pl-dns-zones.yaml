id: az140-1a-pl-dns-zones
objective: "1.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are creating the private endpoints for Azure Virtual Desktop in the Azure portal and you select **Integrate with private DNS zone**.

    Which private DNS zone should each private endpoint use? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez les points de terminaison privés d'Azure Virtual Desktop dans le portail Azure et vous sélectionnez **Integrate with private DNS zone**.

    Quelle zone DNS privée chaque point de terminaison privé doit-il utiliser ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Private endpoint with the connection sub-resource of host pool HP1: [[conn]]

      Private endpoint with the feed sub-resource of workspace WS1: [[feed]]

      Private endpoint with the global sub-resource of workspace WS-Global: [[glob]]
    fr: |
      Point de terminaison privé avec la sous-ressource connection du pool d'hôtes HP1 : [[conn]]

      Point de terminaison privé avec la sous-ressource feed de l'espace de travail WS1 : [[feed]]

      Point de terminaison privé avec la sous-ressource global de l'espace de travail WS-Global : [[glob]]
  slots:
    - id: conn
      options:
        - { id: pl, text: privatelink.wvd.microsoft.com }
        - { id: plg, text: privatelink-global.wvd.microsoft.com }
        - { id: file, text: privatelink.file.core.windows.net }
    - id: feed
      options:
        - { id: pl, text: privatelink.wvd.microsoft.com }
        - { id: plg, text: privatelink-global.wvd.microsoft.com }
        - { id: file, text: privatelink.file.core.windows.net }
    - id: glob
      options:
        - { id: pl, text: privatelink.wvd.microsoft.com }
        - { id: plg, text: privatelink-global.wvd.microsoft.com }
        - { id: file, text: privatelink.file.core.windows.net }
answer:
  values: { conn: pl, feed: pl, glob: plg }
explanation:
  correct:
    en: |
      The `connection` and `feed` private endpoints use the `privatelink.wvd.microsoft.com` zone. Since September 1, 2023, the `global` endpoint can't share that zone: it must use `privatelink-global.wvd.microsoft.com`. `privatelink.file.core.windows.net` is the zone of Azure Files private endpoints.
    fr: |
      Les points de terminaison privés `connection` et `feed` utilisent la zone `privatelink.wvd.microsoft.com`. Depuis le 1er septembre 2023, le point de terminaison `global` ne peut plus partager cette zone : il doit utiliser `privatelink-global.wvd.microsoft.com`. `privatelink.file.core.windows.net` est la zone des points de terminaison privés d'Azure Files.
references:
  - title: Set up Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-setup
  - title: Azure Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview
