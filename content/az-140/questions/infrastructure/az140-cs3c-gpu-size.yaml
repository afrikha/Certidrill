id: az140-cs3c-gpu-size
objective: "1.3.5"
type: single
caseStudy: az140-cs3c-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You need to select a VM size series for the session hosts of HP-CAD-WEU and HP-CAD-NEU to meet the rendering requirement. Which series should you use?
  fr: |
    Vous devez choisir une série de tailles de machines virtuelles pour les hôtes de session de HP-CAD-WEU et HP-CAD-NEU afin de satisfaire l'exigence de rendu. Quelle série devez-vous utiliser ?
body:
  options:
    - { id: a, text: NCv3-series }
    - { id: b, text: NVv4-series }
    - { id: c, text: Dsv5-series }
    - { id: d, text: NVadsA10 v5-series }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The NVadsA10 v5-series is a GPU-optimized size that Azure Virtual Desktop supports for both GPU-accelerated rendering and HEVC/H.265 or AVC/H.264 frame encoding. It needs the NVIDIA GRID driver distributed by Azure, which the NVIDIA GPU Driver Extension can install.
    fr: |
      La série NVadsA10 v5 est une taille optimisée pour le GPU qu'Azure Virtual Desktop prend en charge à la fois pour le rendu accéléré par GPU et pour l'encodage des images en HEVC/H.265 ou AVC/H.264. Elle nécessite le pilote NVIDIA GRID distribué par Azure, que l'extension NVIDIA GPU Driver peut installer.
  options:
    a: { en: "NC, NCv2 and NCv3 sizes are built for CUDA compute and machine learning; they don't support GPU acceleration for most applications or the Windows UI on session hosts.", fr: "Les tailles NC, NCv2 et NCv3 sont conçues pour le calcul CUDA et le machine learning ; elles ne prennent pas en charge l'accélération GPU de la plupart des applications ni de l'interface Windows sur les hôtes de session." }
    b: { en: "NVv4 supports GPU-accelerated rendering but only AVC/H.264 frame encoding, not HEVC/H.265.", fr: "NVv4 prend en charge le rendu accéléré par GPU, mais seulement l'encodage AVC/H.264, pas HEVC/H.265." }
    c: { en: "Dsv5 is a general purpose series without a GPU, like the pilot VMs that render slowly.", fr: "Dsv5 est une série à usage général sans GPU, comme les machines virtuelles du pilote dont le rendu est lent." }
references:
  - title: Enable GPU acceleration for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/graphics-enable-gpu-acceleration
