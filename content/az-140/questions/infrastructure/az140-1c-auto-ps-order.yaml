id: az140-1c-auto-ps-order
objective: "1.4.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You are writing an Azure PowerShell script that deploys a new Azure Virtual Desktop host pool named hp-finance and its first session hosts. The session hosts must register with hp-finance during the deployment.

    Which three actions should the script perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous écrivez un script Azure PowerShell qui déploie un nouveau pool d'hôtes Azure Virtual Desktop nommé hp-finance et ses premiers hôtes de session. Les hôtes de session doivent s'inscrire auprès de hp-finance pendant le déploiement.

    Quelles sont les trois actions que le script doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: hp, text: { en: "Run `New-AzWvdHostPool` to create hp-finance.", fr: "Exécuter `New-AzWvdHostPool` pour créer hp-finance." } }
    - { id: token, text: { en: "Run `New-AzWvdRegistrationInfo` to generate a registration token for hp-finance.", fr: "Exécuter `New-AzWvdRegistrationInfo` pour générer un jeton d'inscription pour hp-finance." } }
    - { id: vms, text: { en: "Create the VMs and install the Azure Virtual Desktop Agent and Agent Bootloader with the token.", fr: "Créer les machines virtuelles et installer l'agent Azure Virtual Desktop et son chargeur de démarrage avec le jeton." } }
    - { id: scaling, text: { en: "Run `New-AzWvdScalingPlan` to create a scaling plan for hp-finance.", fr: "Exécuter `New-AzWvdScalingPlan` pour créer un plan de mise à l'échelle pour hp-finance." } }
    - { id: nsg, text: { en: "Add an NSG rule that allows inbound TCP 3389 to the VMs.", fr: "Ajouter une règle NSG qui autorise le trafic entrant TCP 3389 vers les machines virtuelles." } }
answer:
  sequence: [ hp, token, vms ]
explanation:
  correct:
    en: |
      The registration token belongs to a host pool, so the host pool must exist before you generate the token, and the agent installation needs the token to register each VM with the host pool. Scaling plans and inbound rules aren't part of registration.
    fr: |
      Le jeton d'inscription appartient à un pool d'hôtes : le pool doit exister avant que vous génériez le jeton, et l'installation de l'agent a besoin du jeton pour inscrire chaque machine virtuelle auprès du pool d'hôtes. Les plans de mise à l'échelle et les règles entrantes ne font pas partie de l'inscription.
  options:
    scaling: { en: "A scaling plan manages capacity after deployment; it isn't needed for session hosts to register.", fr: "Un plan de mise à l'échelle gère la capacité après le déploiement ; il n'est pas nécessaire à l'inscription des hôtes de session." }
    nsg: { en: "Session hosts need no inbound port; the agent connects outbound to the service.", fr: "Les hôtes de session n'ont besoin d'aucun port entrant ; l'agent se connecte en sortie au service." }
references:
  - title: New-AzWvdRegistrationInfo
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/new-azwvdregistrationinfo
  - title: Add session hosts to a host pool
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/add-session-hosts-host-pool
