id: az140-1e-specialized-names
objective: "1.5.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An administrator at Tailspin customized a build VM named **VM1**, then captured it to an Azure Compute Gallery without running Sysprep. The image definition **win10-ent** was created with the OS state **Specialized**. VM1 was deleted after the capture, but a snapshot of its OS disk taken before the capture is available.

    You add three session hosts to a personal host pool from the image and set the VM name prefix to **avd-p**. All three session hosts report the computer name **VM1** inside Windows.

    You need to deploy session hosts that each get a unique computer name and join the Active Directory domain.

    What should you do?
  fr: |
    Un administrateur de Tailspin a personnalisé une machine virtuelle de build nommée **VM1**, puis l'a capturée dans une galerie Azure Compute Gallery sans exécuter Sysprep. La définition d'image **win10-ent** a été créée avec l'état du système d'exploitation **Specialized**. VM1 a été supprimée après la capture, mais un instantané de son disque du système d'exploitation pris avant la capture est disponible.

    Vous ajoutez trois hôtes de session à un pool d'hôtes personnel à partir de l'image et définissez le préfixe de nom des machines virtuelles sur **avd-p**. Les trois hôtes de session indiquent le nom d'ordinateur **VM1** dans Windows.

    Vous devez déployer des hôtes de session qui obtiennent chacun un nom d'ordinateur unique et rejoignent le domaine Active Directory.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the OS state of win10-ent to Generalized, and then redeploy the session hosts.", fr: "Changer l'état du système d'exploitation de win10-ent en Generalized, puis redéployer les hôtes de session." }
    - id: b
      text: { en: "Create a VM from the snapshot, run Sysprep, and capture it to a new image definition whose OS state is Generalized.", fr: "Créer une machine virtuelle à partir de l'instantané, exécuter Sysprep et la capturer dans une nouvelle définition d'image dont l'état du système d'exploitation est Generalized." }
    - id: c
      text: { en: "Create a VM from the snapshot, run Sysprep, and capture it as a new image version of win10-ent.", fr: "Créer une machine virtuelle à partir de l'instantané, exécuter Sysprep et la capturer comme nouvelle version d'image de win10-ent." }
    - id: d
      text: { en: "Redeploy the session hosts with a different VM name prefix for each session host.", fr: "Redéployer les hôtes de session avec un préfixe de nom de machine virtuelle différent pour chaque hôte de session." }
answer: { optionId: b }
explanation:
  correct:
    en: A VM created from a specialized image keeps the computer name and accounts of the source VM, because it has no OS profile. Sysprep generalizes the image so that each session host gets its own name and can join the domain. The OS state is fixed per image definition, so the generalized capture needs a new definition with the OS state Generalized.
    fr: "Une machine virtuelle créée à partir d'une image spécialisée conserve le nom d'ordinateur et les comptes de la machine virtuelle source, car elle n'a pas de profil de système d'exploitation. Sysprep généralise l'image pour que chaque hôte de session reçoive son propre nom et puisse rejoindre le domaine. L'état du système d'exploitation est fixé par définition d'image : la capture généralisée exige une nouvelle définition dont l'état est Generalized."
  options:
    a: { en: "The OS state isn't an updatable property of an image definition, and the existing version would still be specialized.", fr: "L'état du système d'exploitation n'est pas une propriété modifiable d'une définition d'image, et la version existante resterait spécialisée." }
    c: { en: "The OS state of win10-ent determines which versions it can contain: a specialized definition can't hold a generalized image.", fr: "L'état du système d'exploitation de win10-ent détermine les versions qu'elle peut contenir : une définition spécialisée ne peut pas accueillir une image généralisée." }
    d: { en: "The prefix names the Azure VM resources, but a specialized image keeps the source computer name inside Windows.", fr: "Le préfixe nomme les ressources de machine virtuelle Azure, mais une image spécialisée conserve le nom d'ordinateur source dans Windows." }
references:
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
