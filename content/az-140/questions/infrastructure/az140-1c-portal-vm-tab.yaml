id: az140-1c-portal-vm-tab
objective: "1.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are creating production session hosts for an existing Azure Virtual Desktop host pool that uses the standard management approach. You open **Session hosts** > **+ Add** in the Azure portal and fill in the **Virtual machines** tab. The subscription has enough vCPU quota.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez des hôtes de session de production pour un pool d'hôtes Azure Virtual Desktop existant qui utilise l'approche de gestion standard. Vous ouvrez **Session hosts** > **+ Add** dans le portail Azure et remplissez l'onglet **Virtual machines**. L'abonnement dispose d'un quota de vCPU suffisant.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can add up to 400 session hosts in this single operation.
        fr: |
          Vous pouvez ajouter jusqu'à 400 hôtes de session en une seule opération.
    - id: s2
      text:
        en: |
          You can use an Ultra Disk as the OS disk of the session hosts.
        fr: |
          Vous pouvez utiliser un disque Ultra comme disque de système d'exploitation des hôtes de session.
    - id: s3
      text:
        en: |
          Microsoft recommends Premium SSD as the OS disk type for production session hosts.
        fr: |
          Microsoft recommande le type de disque SSD Premium pour le disque de système d'exploitation des hôtes de session de production.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The portal deploys up to 400 session hosts at a time, within the subscription quota. Ultra disks and ephemeral OS disks aren't supported as the OS disk of session hosts. For production, Microsoft recommends Premium SSD OS disks.
    fr: |
      Le portail déploie jusqu'à 400 hôtes de session à la fois, dans la limite du quota de l'abonnement. Les disques Ultra et les disques de système d'exploitation éphémères ne sont pas pris en charge comme disque de système d'exploitation des hôtes de session. Pour la production, Microsoft recommande des disques de système d'exploitation SSD Premium.
references:
  - title: Deploy Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
