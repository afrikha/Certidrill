id: az140-1d-hp-drain-before-patch
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP-Finance** that contains four session hosts named FIN-0 to FIN-3.

    You need to install a driver update on FIN-2 that requires a restart. Users who are currently signed in to FIN-2 must be able to keep working until they sign out, and no new user session must start on FIN-2.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Finance** qui contient quatre hôtes de session nommés FIN-0 à FIN-3.

    Vous devez installer sur FIN-2 une mise à jour de pilote qui nécessite un redémarrage. Les utilisateurs actuellement connectés à FIN-2 doivent pouvoir continuer à travailler jusqu'à leur déconnexion, et aucune nouvelle session utilisateur ne doit démarrer sur FIN-2.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the max session limit of HP-Finance to the number of sessions on FIN-2.", fr: "Définir la limite maximale de sessions de HP-Finance sur le nombre de sessions de FIN-2." } }
    - { id: b, text: { en: "Stop and deallocate FIN-2 from the Azure portal.", fr: "Arrêter et libérer FIN-2 depuis le portail Azure." } }
    - { id: c, text: { en: "Remove the users of FIN-2 from the desktop application group.", fr: "Retirer les utilisateurs de FIN-2 du groupe d'applications de bureau." } }
    - { id: d, text: { en: "Turn on drain mode for the FIN-2 session host.", fr: "Activer le mode drainage pour l'hôte de session FIN-2." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Drain mode stops a session host from accepting new user sessions, and new connections go to the other available hosts. Existing sessions stay active until users sign out or an administrator ends them, after which you can perform the maintenance.
    fr: |
      Le mode drainage empêche un hôte de session d'accepter de nouvelles sessions utilisateur, et les nouvelles connexions vont vers les autres hôtes disponibles. Les sessions existantes restent actives jusqu'à la déconnexion des utilisateurs ou jusqu'à ce qu'un administrateur les ferme ; vous pouvez ensuite effectuer la maintenance.
  options:
    a:
      en: The max session limit applies to every session host of the pool, so it would block new sessions on the other hosts too, and it doesn't isolate FIN-2.
      fr: |
        La limite maximale de sessions s'applique à tous les hôtes de session du pool : elle bloquerait aussi les nouvelles sessions sur les autres hôtes, sans isoler FIN-2.
    b:
      en: Deallocating the virtual machine ends the sessions of the signed-in users immediately.
      fr: Libérer la machine virtuelle met fin immédiatement aux sessions des utilisateurs connectés.
    c:
      en: Removing users from the application group removes their access to the whole host pool, not only to FIN-2.
      fr: Retirer des utilisateurs du groupe d'applications leur retire l'accès à tout le pool d'hôtes, pas seulement à FIN-2.
references:
  - title: Drain session hosts for maintenance in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/drain-mode
