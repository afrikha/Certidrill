id: az140-1e-share-methods
objective: "1.5.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum stores Azure Virtual Desktop session host images in Azure Compute Gallery. You need to share images in three scenarios.

    Which sharing method should you use for each scenario? To answer, drag the appropriate methods to the correct scenarios. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke les images des hôtes de session Azure Virtual Desktop dans Azure Compute Gallery. Vous devez partager des images dans trois scénarios.

    Quelle méthode de partage devez-vous utiliser pour chaque scénario ? Pour répondre, faites glisser les méthodes appropriées vers les scénarios correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rbac, text: { en: "Azure RBAC role assignment on the gallery", fr: "Attribution de rôle Azure RBAC sur la galerie" } }
    - { id: direct, text: { en: "Direct shared gallery", fr: "Galerie partagée directe" } }
    - { id: community, text: { en: "Community gallery", fr: "Galerie communautaire" } }
    - { id: managed, text: { en: "Managed image copied to each consumer", fr: "Image managée copiée chez chaque consommateur" } }
  targets:
    - id: team
      text: { en: "A Microsoft Entra group of Adatum administrators must deploy session hosts from the images.", fr: "Un groupe Microsoft Entra d'administrateurs d'Adatum doit déployer des hôtes de session à partir des images." }
    - id: partner
      text: { en: "All the users of one partner subscription must be able to use the images, without role assignments for individual users or groups.", fr: "Tous les utilisateurs d'un abonnement partenaire doivent pouvoir utiliser les images, sans attribution de rôle à des utilisateurs ou groupes individuels." }
    - id: public
      text: { en: "Any Azure user must be able to deploy a public base image published by Adatum.", fr: "N'importe quel utilisateur Azure doit pouvoir déployer une image de base publique publiée par Adatum." }
answer:
  mapping: { team: rbac, partner: direct, public: community }
explanation:
  correct:
    en: Role-based access control shares a gallery with specific users, groups or service principals. A direct shared gallery shares images with all the users of specific subscriptions or tenants, with read-only access. A community gallery makes the images available publicly to all Azure users while the original gallery stays private in your subscription.
    fr: "Le contrôle d'accès en fonction du rôle partage une galerie avec des utilisateurs, des groupes ou des principaux de service précis. Une galerie partagée directe partage les images avec tous les utilisateurs d'abonnements ou de locataires précis, en lecture seule. Une galerie communautaire rend les images publiques pour tous les utilisateurs Azure, tandis que la galerie d'origine reste privée dans votre abonnement."
  options:
    managed: { en: "Copying managed images gives no versioning, replication or central control; gallery sharing is the supported way to share images.", fr: "Copier des images managées n'offre ni gestion des versions, ni réplication, ni contrôle centralisé ; le partage de galerie est la méthode prévue pour partager des images." }
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
