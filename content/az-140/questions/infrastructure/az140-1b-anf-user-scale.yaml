id: az140-1b-anf-user-scale
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to store the FSLogix profile containers of 7,500 concurrently active Azure Virtual Desktop users in Azure NetApp Files regular volumes in the East US 2 region. The region has three availability zones.

    You need to recommend a volume layout that follows Microsoft guidance for FSLogix on Azure NetApp Files. The solution must minimize the number of volumes.

    What should you recommend?
  fr: |
    Woodgrove Bank prévoit de stocker les conteneurs de profils FSLogix de 7 500 utilisateurs Azure Virtual Desktop actifs simultanément dans des volumes Azure NetApp Files standard de la région East US 2. La région dispose de trois zones de disponibilité.

    Vous devez recommander une disposition des volumes conforme aux recommandations de Microsoft pour FSLogix sur Azure NetApp Files. La solution doit réduire au minimum le nombre de volumes.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "One volume in an Ultra capacity pool, with a quota sized for 7,500 users", fr: "Un volume dans un pool de capacité Ultra, avec un quota dimensionné pour 7 500 utilisateurs" }
    - id: b
      text: { en: "Two volumes in the same availability zone, with 3,750 users each", fr: "Deux volumes dans la même zone de disponibilité, avec 3 750 utilisateurs chacun" }
    - id: c
      text: { en: "Three volumes, each in a different availability zone, with 2,500 users each", fr: "Trois volumes, chacun dans une zone de disponibilité différente, avec 2 500 utilisateurs chacun" }
    - id: d
      text: { en: "Eight volumes in the same availability zone, with fewer than 1,000 users each", fr: "Huit volumes dans la même zone de disponibilité, avec moins de 1 000 utilisateurs chacun" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft recommends no more than 3,000 concurrent active profiles per regular volume, because more can significantly increase latency. Beyond that, users should be spread across volumes, each in a different availability zone. Three volumes of 2,500 users is the smallest layout that stays under the limit.
    fr: |
      Microsoft recommande au plus 3 000 profils actifs simultanés par volume standard, car davantage peut augmenter fortement la latence. Au-delà, les utilisateurs doivent être répartis sur plusieurs volumes, chacun dans une zone de disponibilité différente. Trois volumes de 2 500 utilisateurs constituent la plus petite disposition qui reste sous la limite.
  options:
    a: { en: "A larger quota or a higher service level adds throughput, but the 3,000 concurrent profiles guidance applies per volume.", fr: "Un quota plus grand ou un niveau de service supérieur ajoute du débit, mais la recommandation de 3 000 profils simultanés s'applique par volume." }
    b: { en: "3,750 active profiles per volume exceeds the 3,000 guidance, and both volumes share one zone.", fr: "3 750 profils actifs par volume dépassent la recommandation de 3 000, et les deux volumes partagent une même zone." }
    d: { en: "Eight volumes stay under the limit but don't minimize the number of volumes and don't use several zones.", fr: "Huit volumes restent sous la limite, mais ne réduisent pas le nombre de volumes et n'utilisent pas plusieurs zones." }
references:
  - title: Store FSLogix profile containers on Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-fslogix-profile-container
