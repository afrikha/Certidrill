id: az140-1d-lic-rds-gpo
objective: "1.4.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure Virtual Desktop pooled host pool named **HP-Legacy**. Its session hosts run Windows Server 2025 and are joined to the AD DS domain fabrikam.com, in an organizational unit (OU) named AVD-Hosts.

    A server named LIC1 runs Windows Server 2025 and has the Remote Desktop Licensing role service installed and activated. You must buy and install the RDS CALs for 200 named users. Each user connects to HP-Legacy from several devices: a laptop, a home computer and a phone.

    You need to license HP-Legacy at the lowest number of CALs.

    What should you configure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Legacy**. Ses hôtes de session exécutent Windows Server 2025 et sont joints au domaine AD DS fabrikam.com, dans une unité d'organisation (UO) nommée AVD-Hosts.

    Un serveur nommé LIC1 exécute Windows Server 2025 ; le service de rôle Gestionnaire de licences des services Bureau à distance y est installé et activé. Vous devez acheter et installer les CAL RDS de 200 utilisateurs nommés. Chaque utilisateur se connecte à HP-Legacy depuis plusieurs appareils : un ordinateur portable, un ordinateur personnel et un téléphone.

    Vous devez couvrir HP-Legacy par des licences avec le plus petit nombre de CAL.

    Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      CALs to install on LIC1: [[cal]]

      Value of the Group Policy setting **Set the Remote Desktop licensing mode**: [[mode]]

      Where to configure **Use the specified Remote Desktop license servers** and the licensing mode: [[scope]]
    fr: |
      CAL à installer sur LIC1 : [[cal]]

      Valeur du paramètre de stratégie de groupe **Set the Remote Desktop licensing mode** : [[mode]]

      Où configurer **Use the specified Remote Desktop license servers** et le mode de licence : [[scope]]
  slots:
    - id: cal
      options:
        - { id: u2022, text: { en: "200 Windows Server 2022 RDS Per User CALs", fr: "200 CAL RDS Par utilisateur Windows Server 2022" } }
        - { id: u2025, text: { en: "200 Windows Server 2025 RDS Per User CALs", fr: "200 CAL RDS Par utilisateur Windows Server 2025" } }
        - { id: d2025, text: { en: "600 Windows Server 2025 RDS Per Device CALs", fr: "600 CAL RDS Par appareil Windows Server 2025" } }
    - id: mode
      options:
        - { id: peruser, text: Per User }
        - { id: perdevice, text: Per Device }
        - { id: none, text: { en: "Not Configured, to use the grace period", fr: "Not Configured, pour utiliser la période de grâce" } }
    - id: scope
      options:
        - { id: gpo, text: { en: "A Group Policy object linked to the AVD-Hosts OU", fr: "Un objet de stratégie de groupe lié à l'UO AVD-Hosts" } }
        - { id: rdp, text: { en: "The custom RDP properties of HP-Legacy", fr: "Les propriétés RDP personnalisées de HP-Legacy" } }
        - { id: lic1, text: { en: "The local Group Policy of LIC1", fr: "La stratégie de groupe locale de LIC1" } }
answer:
  values: { cal: u2025, mode: peruser, scope: gpo }
explanation:
  correct:
    en: |
      A CAL can't be used with a session host that runs a newer Windows Server version, so Windows Server 2025 hosts need 2025 CALs. Per User CALs are assigned to users in AD DS, so 200 CALs cover users who connect from several devices, whereas Per Device would need one CAL per device. The licensing settings are under Computer Configuration > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Licensing and must apply to the session hosts, for example through a GPO linked to their OU.
    fr: |
      Une CAL ne peut pas être utilisée avec un hôte de session qui exécute une version plus récente de Windows Server : des hôtes Windows Server 2025 exigent des CAL 2025. Les CAL Par utilisateur sont attribuées aux utilisateurs dans AD DS : 200 CAL couvrent des utilisateurs qui se connectent depuis plusieurs appareils, alors que Par appareil exigerait une CAL par appareil. Les paramètres de licence se trouvent sous Configuration ordinateur > Modèles d'administration > Composants Windows > Services Bureau à distance > Hôte de session Bureau à distance > Gestion des licences et doivent s'appliquer aux hôtes de session, par exemple par un objet de stratégie de groupe lié à leur UO.
  options:
    cal:
      en: Windows Server 2022 CALs can't access Windows Server 2025 session hosts, and Per Device CALs would require one CAL for each of the 600 devices.
      fr: Les CAL Windows Server 2022 ne permettent pas d'accéder à des hôtes de session Windows Server 2025, et les CAL Par appareil exigeraient une CAL pour chacun des 600 appareils.
    mode:
      en: The licensing mode must match the CALs installed; the 120-day grace period only delays the requirement.
      fr: Le mode de licence doit correspondre aux CAL installées ; la période de grâce de 120 jours ne fait que retarder l'exigence.
    scope:
      en: The settings are Group Policy settings of the session hosts; RDP properties don't set them, and LIC1 isn't a session host.
      fr: Ces paramètres sont des paramètres de stratégie de groupe des hôtes de session ; les propriétés RDP ne les définissent pas, et LIC1 n'est pas un hôte de session.
references:
  - title: License Remote Desktop Services with Client Access Licenses (CALs)
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-client-access-license
  - title: License Remote Desktop session hosts
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-license-session-hosts
