id: az140-1a-pl-statements
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso is planning Azure Private Link for its Azure Virtual Desktop deployment, which contains several host pools and workspaces in the West Europe region. The network team wants to restrict the ports allowed to the private endpoints.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso planifie Azure Private Link pour son déploiement Azure Virtual Desktop, qui contient plusieurs pools d'hôtes et espaces de travail dans la région West Europe. L'équipe réseau veut restreindre les ports autorisés vers les points de terminaison privés.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You must create one private endpoint with the global sub-resource for each workspace.", fr: "Vous devez créer un point de terminaison privé avec la sous-ressource global pour chaque espace de travail." } }
    - { id: b, text: { en: "Clients and session hosts must be allowed TCP 1–65535 to the private endpoint of the connection sub-resource.", fr: "Les clients et les hôtes de session doivent être autorisés en TCP 1–65535 vers le point de terminaison privé de la sous-ressource connection." } }
    - { id: c, text: { en: "The private endpoints can be in a virtual network in another region than the session hosts.", fr: "Les points de terminaison privés peuvent se trouver dans un réseau virtuel d'une autre région que les hôtes de session." } }
    - { id: d, text: { en: "The private endpoint with the feed sub-resource is created on each host pool.", fr: "Le point de terminaison privé avec la sous-ressource feed est créé sur chaque pool d'hôtes." } }
    - { id: e, text: { en: "Deleting the workspace that holds the global private endpoint stops feed discovery for all users.", fr: "La suppression de l'espace de travail qui porte le point de terminaison privé global arrête la découverte du flux pour tous les utilisateurs." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Session traffic through the `connection` endpoint moves from TCP 443 to the dynamic range TCP 1–65535 on a single private IP address, so restricting ports can stop users from connecting. The workspace that holds the `global` sub-resource sets the shared global FQDN: Microsoft recommends a dedicated placeholder workspace, because deleting it stops all feed discovery.
    fr: |
      Le trafic des sessions par le point de terminaison `connection` passe de TCP 443 à la plage dynamique TCP 1–65535 sur une seule adresse IP privée : restreindre les ports peut empêcher les utilisateurs de se connecter. L'espace de travail qui porte la sous-ressource `global` définit le FQDN global partagé : Microsoft recommande un espace de travail réservé dédié, car sa suppression arrête toute découverte du flux.
  options:
    a: { en: "There is only one global private endpoint for all Azure Virtual Desktop deployments.", fr: "Il n'existe qu'un point de terminaison privé global pour tous les déploiements Azure Virtual Desktop." }
    c: { en: "The private endpoint subnet must be in the same region as the virtual network and the session hosts.", fr: "Le sous-réseau des points de terminaison privés doit se trouver dans la même région que le réseau virtuel et les hôtes de session." }
    d: { en: "feed is a workspace sub-resource; host pools use connection.", fr: "feed est une sous-ressource d'espace de travail ; les pools d'hôtes utilisent connection." }
references:
  - title: Azure Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview
  - title: Set up Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-setup
