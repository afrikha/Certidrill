id: az140-1e-gallery-order
objective: "1.5.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a generation 2 build VM named **VM-Build** that contains the applications for an Azure Virtual Desktop host pool named **HP1**. VM-Build has been generalized with Sysprep and marked as generalized in Azure. The subscription contains no Azure Compute Gallery.

    You need to store the image in a gallery and deploy session hosts in HP1 from it.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind dispose d'une machine virtuelle de build de génération 2 nommée **VM-Build** qui contient les applications d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. VM-Build a été généralisée avec Sysprep et marquée comme généralisée dans Azure. L'abonnement ne contient aucune galerie Azure Compute Gallery.

    Vous devez stocker l'image dans une galerie et déployer à partir d'elle des hôtes de session dans HP1.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: gallery, text: { en: "Create an Azure Compute Gallery.", fr: "Créer une galerie Azure Compute Gallery." } }
    - { id: defgen, text: { en: "Create an image definition with the OS state Generalized and the Hyper-V generation V2.", fr: "Créer une définition d'image avec l'état du système d'exploitation Generalized et la génération Hyper-V V2." } }
    - { id: version, text: { en: "Create image version 1.0.0 from VM-Build and replicate it to the region of HP1.", fr: "Créer la version d'image 1.0.0 à partir de VM-Build et la répliquer dans la région de HP1." } }
    - { id: add, text: { en: "Add session hosts to HP1 and select the image definition as the image.", fr: "Ajouter des hôtes de session à HP1 en sélectionnant la définition d'image comme image." } }
    - { id: defspec, text: { en: "Create an image definition with the OS state Specialized and the Hyper-V generation V2.", fr: "Créer une définition d'image avec l'état du système d'exploitation Specialized et la génération Hyper-V V2." } }
    - { id: agent, text: { en: "Install the Azure Virtual Desktop Agent on VM-Build.", fr: "Installer l'agent Azure Virtual Desktop sur VM-Build." } }
    - { id: managed, text: { en: "Create a managed image from VM-Build.", fr: "Créer une image managée à partir de VM-Build." } }
answer:
  sequence: [ gallery, defgen, version, add ]
explanation:
  correct:
    en: The gallery contains image definitions, which contain image versions, so you create them in that order. A Sysprep-generalized source needs a definition whose OS state is Generalized and whose generation matches the Gen2 source, and the version must be replicated to the region where the session hosts are deployed before you add them.
    fr: "La galerie contient des définitions d'image, qui contiennent des versions d'image : vous les créez dans cet ordre. Une source généralisée avec Sysprep exige une définition dont l'état du système d'exploitation est Generalized et dont la génération correspond à la source Gen2, et la version doit être répliquée dans la région de déploiement des hôtes de session avant de les ajouter."
  options:
    defspec: { en: "A specialized definition keeps machine-specific information and doesn't match a generalized source.", fr: "Une définition spécialisée conserve les informations propres à la machine et ne correspond pas à une source généralisée." }
    agent: { en: "The agent must never be in the image; the session host deployment installs it and registers each host.", fr: "L'agent ne doit jamais se trouver dans l'image ; le déploiement des hôtes de session l'installe et inscrit chaque hôte." }
    managed: { en: "A gallery image version can be created directly from the VM; a managed image isn't needed.", fr: "Une version d'image de galerie peut être créée directement à partir de la machine virtuelle ; une image managée n'est pas nécessaire." }
references:
  - title: Create an image definition and an image version
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/image-version
