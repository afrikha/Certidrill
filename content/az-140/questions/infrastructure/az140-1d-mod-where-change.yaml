id: az140-1d-mod-where-change
objective: "1.5.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Virtual Desktop pooled host pool whose session hosts are created from a golden image in an Azure Compute Gallery. The session hosts are replaced from a new image version when the image changes. Several changes are planned, as listed in the answer area.

    Adatum has the following rules:

    - Each change must survive the replacement of the session hosts.
    - App attach is used only for applications packaged as MSIX.
    - Microsoft Intune and Group Policy are used only for settings, not to install software or updates.

    How should you deliver each change? To answer, drag the appropriate methods to the correct changes. Each method may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un pool d'hôtes regroupé Azure Virtual Desktop dont les hôtes de session sont créés à partir d'une image de référence d'une galerie Azure Compute Gallery. Les hôtes de session sont remplacés à partir d'une nouvelle version d'image quand l'image change. Plusieurs modifications sont prévues ; elles figurent dans la zone de réponse.

    Adatum applique les règles suivantes :

    - Chaque modification doit survivre au remplacement des hôtes de session.
    - App attach n'est utilisé que pour des applications empaquetées en MSIX.
    - Microsoft Intune et les stratégies de groupe ne servent qu'aux paramètres, pas à installer des logiciels ou des mises à jour.

    Comment devez-vous déployer chaque modification ? Pour répondre, faites glisser les méthodes appropriées vers les modifications correspondantes. Chaque méthode peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: img, text: { en: "Add it to a new image version", fr: "L'ajouter à une nouvelle version d'image" } }
    - { id: aa, text: { en: "Deliver it with App attach", fr: "La déployer avec App attach" } }
    - { id: pol, text: { en: "Deploy it with Microsoft Intune or Group Policy", fr: "La déployer avec Microsoft Intune ou une stratégie de groupe" } }
    - { id: manual, text: { en: "Apply it manually on each session host", fr: "L'appliquer manuellement sur chaque hôte de session" } }
  targets:
    - id: t1
      text: { en: "The monthly Windows cumulative update", fr: "La mise à jour cumulative mensuelle de Windows" }
    - id: t2
      text: { en: "An MSIX-packaged finance app that is updated every week and used only by the finance group", fr: "Une application de finance empaquetée en MSIX, mise à jour chaque semaine et utilisée uniquement par le groupe finance" }
    - id: t3
      text: { en: "A large line-of-business app, installed from an MSI file, that every user needs and that changes twice a year", fr: "Une grosse application métier, installée à partir d'un fichier MSI, dont tous les utilisateurs ont besoin et qui change deux fois par an" }
    - id: t4
      text: { en: "A registry setting that must reach the existing session hosts without replacing them", fr: "Un paramètre de Registre qui doit atteindre les hôtes de session existants sans les remplacer" }
answer:
  mapping: { t1: img, t2: aa, t3: img, t4: pol }
explanation:
  correct:
    en: |
      OS cumulative updates and large, stable apps that every user needs belong in the image, refreshed with each new version. An app that changes often and is used by one group is delivered with App attach, so it's updated without building a new session host image. A setting that must reach running hosts is deployed with Intune or Group Policy, which also applies it again to hosts created later.
    fr: |
      Les mises à jour cumulatives du système d'exploitation et les grosses applications stables dont tous les utilisateurs ont besoin ont leur place dans l'image, rafraîchie à chaque nouvelle version. Une application qui change souvent et qu'utilise un seul groupe est déployée avec App attach, pour être mise à jour sans construire de nouvelle image d'hôte de session. Un paramètre qui doit atteindre les hôtes en service est déployé avec Intune ou une stratégie de groupe, qui l'applique aussi aux hôtes créés plus tard.
  options:
    manual:
      en: Files, registry keys and settings added manually to session hosts are lost when the hosts are re-created from the image.
      fr: Les fichiers, clés de Registre et paramètres ajoutés manuellement aux hôtes de session sont perdus quand les hôtes sont recréés à partir de l'image.
references:
  - title: Session host update for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
