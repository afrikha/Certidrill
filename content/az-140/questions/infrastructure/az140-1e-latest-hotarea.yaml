id: az140-1e-latest-hotarea
objective: "1.5.7"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has an Azure Compute Gallery image definition named **win11-multi**. Its image versions are shown in the following table. Every version is replicated to West Europe and North Europe. A dash (–) means that the regional setting isn't configured.

    Azure Virtual Desktop session hosts are deployed with an `imageReference` whose `id` is the resource ID of win11-multi, without a version.

    Answer each prompt by selecting the image version that is deployed.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une définition d'image Azure Compute Gallery nommée **win11-multi**. Ses versions d'image figurent dans le tableau suivant. Chaque version est répliquée dans West Europe et North Europe. Un tiret (–) signifie que le paramètre régional n'est pas configuré.

    Les hôtes de session Azure Virtual Desktop sont déployés avec un `imageReference` dont l'`id` est l'ID de ressource de win11-multi, sans version.

    Répondez à chaque consigne en sélectionnant la version d'image déployée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: weu
      text: { en: "A session host deployed in West Europe", fr: "Un hôte de session déployé dans West Europe" }
    - id: neu
      text: { en: "A session host deployed in North Europe", fr: "Un hôte de session déployé dans North Europe" }
  grid:
    header:
      - { en: "Image version", fr: "Version d'image" }
      - { en: "excludeFromLatest", fr: "excludeFromLatest" }
      - { en: "regionalExcludeFromLatest (West Europe)", fr: "regionalExcludeFromLatest (West Europe)" }
      - { en: "regionalExcludeFromLatest (North Europe)", fr: "regionalExcludeFromLatest (North Europe)" }
    rows:
      - [{ text: "1.9.0", area: v190 }, { text: "false" }, { text: "–" }, { text: "–" }]
      - [{ text: "1.10.0", area: v1100 }, { text: "false" }, { text: "–" }, { text: "–" }]
      - [{ text: "1.10.1", area: v1101 }, { text: "false" }, { text: "false" }, { text: "true" }]
      - [{ text: "2.0.0", area: v200 }, { text: "true" }, { text: "–" }, { text: "–" }]
answer:
  values: { weu: v1101, neu: v1100 }
explanation:
  correct:
    en: The latest version is the one with the highest MajorVersion, then MinorVersion, then Patch, compared as numbers, so 1.10.x is newer than 1.9.0. Version 2.0.0 is excluded from latest everywhere. In West Europe, 1.10.1 is included, so it's deployed. In North Europe, the regional setting of 1.10.1 takes precedence and excludes it, so 1.10.0 is deployed.
    fr: "La dernière version est celle dont MajorVersion, puis MinorVersion, puis Patch est le plus élevé, comparés comme des nombres : 1.10.x est plus récente que 1.9.0. La version 2.0.0 est exclue de la dernière version partout. Dans West Europe, 1.10.1 est incluse : c'est elle qui est déployée. Dans North Europe, le paramètre régional de 1.10.1 est prioritaire et l'exclut : c'est 1.10.0 qui est déployée."
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
