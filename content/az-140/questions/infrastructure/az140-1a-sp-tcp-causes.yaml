id: az140-1a-sp-tcp-causes
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Azure Virtual Desktop host pool named **HP1**. All the RDP Shortpath options of HP1 have their default values. On the session hosts:

    - the **Enable RDP Shortpath for managed networks** policy setting is enabled, and the session hosts were restarted;
    - Windows Firewall and the network security group allow inbound UDP 3390 from the address range of the branch office.

    Users in the branch office connect to HP1 over a site-to-site VPN. Their **Connection Information** dialog box shows the transport **TCP**.

    Which two issues could cause this?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Toutes les options RDP Shortpath de HP1 ont leur valeur par défaut. Sur les hôtes de session :

    - le paramètre de stratégie **Enable RDP Shortpath for managed networks** est activé et les hôtes de session ont été redémarrés ;
    - le Pare-feu Windows et le groupe de sécurité réseau autorisent UDP 3390 en entrée depuis la plage d'adresses de l'agence.

    Les utilisateurs de l'agence se connectent à HP1 par un VPN site à site. Leur boîte de dialogue **Connection Information** affiche le transport **TCP**.

    Quels sont les deux problèmes qui pourraient en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Select RDP transport protocols policy setting is enabled with Use only TCP on the session hosts.", fr: "Le paramètre de stratégie Select RDP transport protocols est activé avec Use only TCP sur les hôtes de session." } }
    - { id: b, text: { en: "RDP Shortpath for public networks via TURN is set to Disabled on HP1.", fr: "RDP Shortpath pour les réseaux publics via TURN est défini sur Désactivé dans HP1." } }
    - { id: c, text: { en: "The Use port range for RDP Shortpath for unmanaged networks policy setting is enabled on the session hosts.", fr: "Le paramètre de stratégie Use port range for RDP Shortpath for unmanaged networks est activé sur les hôtes de session." } }
    - { id: d, text: { en: "The Turn Off UDP On Client policy setting is enabled on the branch office devices.", fr: "Le paramètre de stratégie Turn Off UDP On Client est activé sur les appareils de l'agence." } }
    - { id: e, text: { en: "The network security group has no inbound rule that allows TCP 3389 from the branch office.", fr: "Le groupe de sécurité réseau n'a aucune règle entrante qui autorise TCP 3389 depuis l'agence." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      UDP must be allowed on both ends. On the session host, the **Select RDP transport protocols** policy set to **Use only TCP** writes `SelectTransport` = 1 and blocks UDP. On the client, **Turn Off UDP On Client** writes `fClientDisableUDP` = 1. Either setting keeps the session on TCP reverse connect even though the managed-network listener is ready.
    fr: |
      UDP doit être autorisé aux deux extrémités. Sur l'hôte de session, la stratégie **Select RDP transport protocols** définie sur **Use only TCP** écrit `SelectTransport` = 1 et bloque UDP. Sur le client, **Turn Off UDP On Client** écrit `fClientDisableUDP` = 1. L'un ou l'autre de ces paramètres maintient la session sur TCP reverse connect, même si l'écouteur des réseaux managés est prêt.
  options:
    b: { en: "TURN applies to public networks; the managed-network path over the VPN doesn't depend on it.", fr: "TURN concerne les réseaux publics ; le chemin des réseaux managés par le VPN n'en dépend pas." }
    c: { en: "This setting only limits the ports used by STUN and TURN; it doesn't disable UDP.", fr: "Ce paramètre ne fait que limiter les ports utilisés par STUN et TURN ; il ne désactive pas UDP." }
    e: { en: "Azure Virtual Desktop never needs inbound TCP 3389: TCP sessions use reverse connect.", fr: "Azure Virtual Desktop n'a jamais besoin de TCP 3389 en entrée : les sessions TCP utilisent reverse connect." }
references:
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
