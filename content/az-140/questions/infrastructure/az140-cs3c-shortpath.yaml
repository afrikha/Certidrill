id: az140-cs3c-shortpath
objective: "1.1.3"
type: yesno_statements
caseStudy: az140-cs3c-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You enable the RDP Shortpath for managed networks listener on the HP-CAD-WEU session hosts with its default port, and you keep the default RDP Shortpath settings of the host pool.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous activez l'écouteur RDP Shortpath pour les réseaux managés sur les hôtes de session de HP-CAD-WEU avec son port par défaut, et vous conservez les paramètres RDP Shortpath par défaut du pool d'hôtes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          To meet the requirement for the office users, the HP-CAD-WEU session hosts must accept inbound UDP traffic on port 3390 from the office address ranges.
        fr: |
          Pour satisfaire l'exigence relative aux utilisateurs des bureaux, les hôtes de session de HP-CAD-WEU doivent accepter le trafic UDP entrant sur le port 3390 depuis les plages d'adresses des bureaux.
    - id: s2
      text:
        en: |
          If a firewall blocks the direct STUN connection of a home worker, the session falls back to TCP without trying another UDP path.
        fr: |
          Si un pare-feu bloque la connexion STUN directe d'un employé à domicile, la session bascule vers TCP sans essayer d'autre chemin UDP.
    - id: s3
      text:
        en: |
          When an office user connects by using the direct managed network path, the Connection Information dialog shows the transport as UDP (Private Network).
        fr: |
          Quand un utilisateur d'un bureau se connecte par le chemin direct du réseau managé, la boîte de dialogue des informations de connexion indique le transport UDP (Private Network).
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      ExpressRoute private peering gives the offices the line of sight that RDP Shortpath for managed networks needs. With the direct listener, the client connects to the session host on UDP 3390 by default, so neither the NSG nor Windows Firewall must block that inbound port. On public networks, if STUN is blocked, RDP tries a relayed UDP connection through TURN before using TCP. A direct managed connection shows UDP (Private Network), STUN shows UDP and TURN shows UDP (Relay).
    fr: |
      Le peering privé ExpressRoute donne aux bureaux la visibilité directe dont RDP Shortpath pour les réseaux managés a besoin. Avec l'écouteur direct, le client se connecte à l'hôte de session sur le port UDP 3390 par défaut : ni le groupe de sécurité réseau ni le Pare-feu Windows ne doivent bloquer ce port entrant. Sur les réseaux publics, si STUN est bloqué, RDP tente une connexion UDP relayée par TURN avant d'utiliser TCP. Une connexion managée directe affiche UDP (Private Network), STUN affiche UDP et TURN affiche UDP (Relay).
references:
  - title: RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
