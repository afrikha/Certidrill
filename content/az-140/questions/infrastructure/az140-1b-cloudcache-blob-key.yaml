id: az140-1b-cloudcache-blob-key
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP2** that uses FSLogix Cloud Cache. The current CCDLocations value lists one SMB provider: an Azure file share.

    You plan to add a second provider that uses an Azure page blob storage account named **stprofblob02**. Security policy forbids storing the storage account connection string in the registry or in Group Policy in plain text.

    What should you do on each session host before you add the provider to CCDLocations?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP2** qui utilise FSLogix Cloud Cache. La valeur CCDLocations actuelle liste un fournisseur SMB : un partage de fichiers Azure.

    Vous prévoyez d'ajouter un second fournisseur qui utilise un compte de stockage d'objets blob de pages Azure nommé **stprofblob02**. La stratégie de sécurité interdit de stocker en clair la chaîne de connexion du compte de stockage dans le Registre ou dans une stratégie de groupe.

    Que devez-vous faire sur chaque hôte de session avant d'ajouter le fournisseur à CCDLocations ?
body:
  options:
    - id: a
      text: { en: "Map a network drive to the blob container by using the storage account key.", fr: "Mapper un lecteur réseau sur le conteneur d'objets blob à l'aide de la clé du compte de stockage." }
    - id: b
      text: { en: "Set the AccessNetworkAsComputerObject value to 1 so that FSLogix uses the computer account.", fr: "Définir la valeur AccessNetworkAsComputerObject sur 1 pour que FSLogix utilise le compte d'ordinateur." }
    - id: c
      text: { en: "Store the connection string in the credential manager by using the frx command-line utility.", fr: "Stocker la chaîne de connexion dans le gestionnaire d'informations d'identification à l'aide de l'utilitaire en ligne de commande frx." }
    - id: d
      text: { en: "Assign the Storage Blob Data Contributor role on stprofblob02 to the users of HP2.", fr: "Attribuer le rôle Storage Blob Data Contributor sur stprofblob02 aux utilisateurs de HP2." }
answer: { optionId: c }
explanation:
  correct:
    en: An Azure page blob provider in CCDLocations references its connection string by key name (`connectionString="|fslogix/<key-name>|"`). The connection string itself is stored securely on the session host with the frx command-line utility, so it never appears in the registry value.
    fr: "Un fournisseur d'objets blob de pages Azure dans CCDLocations référence sa chaîne de connexion par un nom de clé (`connectionString=\"|fslogix/<key-name>|\"`). La chaîne de connexion elle-même est stockée de façon sécurisée sur l'hôte de session avec l'utilitaire en ligne de commande frx : elle n'apparaît jamais dans la valeur de Registre."
  options:
    a: { en: "Blob storage isn't accessed over SMB, and FSLogix doesn't use mapped drives for its providers.", fr: "Le stockage d'objets blob n'est pas accessible en SMB, et FSLogix n'utilise pas de lecteurs mappés pour ses fournisseurs." }
    b: { en: "AccessNetworkAsComputerObject changes the identity used for SMB locations and is a security risk; it doesn't provide credentials for a blob provider.", fr: "AccessNetworkAsComputerObject change l'identité utilisée pour les emplacements SMB et constitue un risque de sécurité ; il ne fournit pas d'informations d'identification à un fournisseur d'objets blob." }
    d: { en: "The Azure page blob provider authenticates with the stored connection string, not with the users' Microsoft Entra identities.", fr: "Le fournisseur d'objets blob de pages Azure s'authentifie avec la chaîne de connexion stockée, pas avec les identités Microsoft Entra des utilisateurs." }
references:
  - title: "Tutorial: Configure profile containers with Cloud Cache"
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-cloud-cache-containers
