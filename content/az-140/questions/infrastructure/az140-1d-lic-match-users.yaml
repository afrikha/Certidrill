id: az140-1d-lic-match-users
objective: "1.4.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Azure Virtual Desktop for several groups of users, described in the answer area. Northwind must meet the licensing requirements at the lowest cost and must not buy licenses that include more than Windows when a Windows-only license is enough.

    Which license should you use for each group? To answer, drag the appropriate licenses to the correct groups. Each license may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Azure Virtual Desktop pour plusieurs groupes d'utilisateurs, décrits dans la zone de réponse. Northwind doit respecter les exigences de licence au coût le plus bas et ne doit pas acheter de licences qui incluent plus que Windows quand une licence Windows seule suffit.

    Quelle licence devez-vous utiliser pour chaque groupe ? Pour répondre, faites glisser les licences appropriées vers les groupes correspondants. Chaque licence peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: none, text: { en: "No additional license", fr: "Aucune licence supplémentaire" } }
    - { id: cal, text: { en: "RDS CAL with Software Assurance", fr: "CAL RDS avec Software Assurance" } }
    - { id: pupa, text: { en: "Per-user access pricing", fr: "Tarification de l'accès par utilisateur" } }
    - { id: vda, text: { en: "Windows VDA per user", fr: "Windows VDA par utilisateur" } }
    - { id: p1, text: { en: "Microsoft Entra ID P1", fr: "Microsoft Entra ID P1" } }
  targets:
    - id: t1
      text: { en: "Employees who have Microsoft 365 E3 and use Windows 11 Enterprise multi-session session hosts", fr: "Employés dotés de Microsoft 365 E3 qui utilisent des hôtes de session Windows 11 Entreprise multisession" }
    - id: t2
      text: { en: "Employees who have Microsoft 365 E3 and use Windows Server 2022 session hosts", fr: "Employés dotés de Microsoft 365 E3 qui utilisent des hôtes de session Windows Server 2022" }
    - id: t3
      text: { en: "Customers of a commercial app published as RemoteApp from Windows 11 Enterprise multi-session", fr: "Clients d'une application commerciale publiée en RemoteApp depuis Windows 11 Entreprise multisession" }
    - id: t4
      text: { en: "Warehouse employees who have no Microsoft license and use Windows 11 Enterprise desktops", fr: "Employés d'entrepôt sans aucune licence Microsoft qui utilisent des bureaux Windows 11 Entreprise" }
answer:
  mapping: { t1: none, t2: cal, t3: pupa, t4: vda }
explanation:
  correct:
    en: |
      Microsoft 365 E3 already includes the right to access Windows client session hosts. Windows Server session hosts always require an RDS CAL (or an RDS User Subscription License), whatever Microsoft 365 license the user has. External commercial users are covered by per-user access pricing. Windows VDA per user is an eligible Windows-only license for internal users who have no other eligible license.
    fr: |
      Microsoft 365 E3 inclut déjà le droit d'accéder à des hôtes de session Windows client. Les hôtes de session Windows Server exigent toujours une CAL RDS (ou une licence d'abonnement utilisateur RDS), quelle que soit la licence Microsoft 365 de l'utilisateur. Les utilisateurs commerciaux externes sont couverts par la tarification de l'accès par utilisateur. Windows VDA par utilisateur est une licence éligible limitée à Windows pour des utilisateurs internes qui n'ont aucune autre licence éligible.
  options:
    p1:
      en: Microsoft Entra ID P1 isn't in the list of licenses eligible for Azure Virtual Desktop access.
      fr: Microsoft Entra ID P1 ne figure pas dans la liste des licences éligibles pour accéder à Azure Virtual Desktop.
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
