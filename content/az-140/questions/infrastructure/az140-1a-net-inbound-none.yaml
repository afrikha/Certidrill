id: az140-1a-net-inbound-none
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are deploying an Azure Virtual Desktop host pool named **HP1**. The session hosts will be connected to a subnet named **snet-hosts** that is associated with a network security group named **NSG-Hosts**. The session hosts have no public IP address.

    Users will connect from the internet. RDP Shortpath for managed networks won't be used.

    You need to configure the inbound security rules of NSG-Hosts that users need to connect to their sessions. The solution must follow Microsoft's recommendations.

    What should you configure?
  fr: |
    Vous déployez un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Les hôtes de session seront connectés à un sous-réseau nommé **snet-hosts** associé à un groupe de sécurité réseau nommé **NSG-Hosts**. Les hôtes de session n'ont pas d'adresse IP publique.

    Les utilisateurs se connecteront depuis Internet. RDP Shortpath pour les réseaux managés ne sera pas utilisé.

    Vous devez configurer les règles de sécurité entrantes de NSG-Hosts dont les utilisateurs ont besoin pour se connecter à leurs sessions. La solution doit suivre les recommandations de Microsoft.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A rule that allows TCP 3389 from the Internet service tag", fr: "Une règle qui autorise TCP 3389 depuis l'étiquette de service Internet" }
    - id: b
      text: { en: "A rule that allows TCP 443 from the WindowsVirtualDesktop service tag", fr: "Une règle qui autorise TCP 443 depuis l'étiquette de service WindowsVirtualDesktop" }
    - id: c
      text: { en: "A rule that allows UDP 3390 from the Internet service tag", fr: "Une règle qui autorise UDP 3390 depuis l'étiquette de service Internet" }
    - id: d
      text: { en: "No custom inbound rule beyond the default rules of NSG-Hosts", fr: "Aucune règle entrante personnalisée en plus des règles par défaut de NSG-Hosts" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Session hosts don't use a TCP listener for incoming RDP connections: the Remote Desktop Agent Loader and the RDP stack open outbound TLS connections to the Azure Virtual Desktop infrastructure, and the gateway relays the session (reverse connect). RDP Shortpath for public networks also needs no inbound port. All required endpoints are outbound, so no inbound rule is needed.
    fr: |
      Les hôtes de session n'utilisent pas d'écouteur TCP pour les connexions RDP entrantes : le Remote Desktop Agent Loader et la pile RDP ouvrent des connexions TLS sortantes vers l'infrastructure Azure Virtual Desktop, et la passerelle relaie la session (reverse connect). RDP Shortpath pour les réseaux publics n'exige pas non plus de port entrant. Tous les points de terminaison requis sont sortants : aucune règle entrante n'est nécessaire.
  options:
    a: { en: "Opening TCP 3389 to the internet isn't needed for reverse connect and exposes the session hosts.", fr: "Ouvrir TCP 3389 vers Internet n'est pas nécessaire avec reverse connect et expose les hôtes de session." }
    b: { en: "TCP 443 to the WindowsVirtualDesktop service tag is an outbound requirement, not an inbound one.", fr: "TCP 443 vers l'étiquette de service WindowsVirtualDesktop est une exigence sortante, pas entrante." }
    c: { en: "Inbound UDP 3390 is used only by the RDP Shortpath for managed networks listener, which isn't used here.", fr: "Le port UDP 3390 entrant n'est utilisé que par l'écouteur RDP Shortpath pour les réseaux managés, qui n'est pas utilisé ici." }
references:
  - title: Understanding Azure Virtual Desktop network connectivity
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/network-connectivity
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
