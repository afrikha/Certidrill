id: az140-1a-st-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans a pooled Azure Virtual Desktop host pool in the North Europe region. User profiles will be stored in FSLogix profile containers on Azure Files premium (SSD) shares. Users use OneDrive.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware planifie un pool d'hôtes Azure Virtual Desktop partagé dans la région North Europe. Les profils des utilisateurs seront stockés dans des conteneurs de profils FSLogix sur des partages Azure Files Premium (SSD). Les utilisateurs utilisent OneDrive.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The storage account that holds the profile shares should be in North Europe.
        fr: Le compte de stockage qui contient les partages de profils doit se trouver dans North Europe.
    - id: s2
      text:
        en: You can protect the profile shares against a regional outage by configuring geo-redundant storage on the SSD shares.
        fr: Vous pouvez protéger les partages de profils contre une panne régionale en configurant un stockage géoredondant sur les partages SSD.
    - id: s3
      text:
        en: Without FSLogix profile containers, OneDrive isn't supported in a non-persistent VDI environment.
        fr: Sans les conteneurs de profils FSLogix, OneDrive n'est pas pris en charge dans un environnement VDI non persistant.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The storage account must be in the same region as the session host VMs: every profile read and write crosses the network, and distant shares add latency and cross-region costs. SSD file shares don't offer geo-redundancy; regional resilience for profiles comes from other designs such as FSLogix Cloud Cache with a provider in another region. Microsoft notes that OneDrive isn't supported in non-persistent VDI without FSLogix profile containers.
    fr: |
      Le compte de stockage doit se trouver dans la même région que les machines virtuelles hôtes de session : chaque lecture et écriture de profil traverse le réseau, et des partages éloignés ajoutent de la latence et des coûts interrégions. Les partages de fichiers SSD n'offrent pas de géoredondance ; la résilience régionale des profils passe par d'autres conceptions, comme FSLogix Cloud Cache avec un fournisseur dans une autre région. Microsoft précise que OneDrive n'est pas pris en charge en VDI non persistant sans conteneurs de profils FSLogix.
references:
  - title: User profile management for Azure Virtual Desktop with FSLogix profile containers
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-containers-azure-files
  - title: Azure Files guidance for virtual desktop workloads
    url: https://learn.microsoft.com/en-us/azure/storage/files/virtual-desktop-workloads
