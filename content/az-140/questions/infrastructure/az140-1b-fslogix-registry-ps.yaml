id: az140-1b-fslogix-registry-ps
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool. The session hosts are joined to an AD DS domain. You created an Azure file share named **profiles** in a storage account named **stavdprof01** and configured its permissions.

    You need to configure FSLogix profile containers on a session host so that the containers are stored in the share.

    How should you complete the PowerShell script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop. Les hôtes de session sont joints à un domaine AD DS. Vous avez créé un partage de fichiers Azure nommé **profiles** dans un compte de stockage nommé **stavdprof01** et configuré ses autorisations.

    Vous devez configurer les conteneurs de profils FSLogix sur un hôte de session pour que les conteneurs soient stockés dans le partage.

    Comment devez-vous compléter le script PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $regPath = "[[path]]"
    New-ItemProperty -Path $regPath -Name Enabled -PropertyType DWORD -Value 1 -Force
    New-ItemProperty -Path $regPath -Name [[name]] -PropertyType [[type]] `
        -Value "\\stavdprof01.file.core.windows.net\profiles" -Force
  slots:
    - id: path
      options:
        - { id: prof, text: "HKLM:\\SOFTWARE\\FSLogix\\Profiles" }
        - { id: odfc, text: "HKLM:\\SOFTWARE\\Policies\\FSLogix\\ODFC" }
        - { id: apps, text: "HKLM:\\SOFTWARE\\FSLogix\\Apps" }
        - { id: hkcu, text: "HKCU:\\SOFTWARE\\FSLogix\\Profiles" }
    - id: name
      options:
        - { id: vhd, text: VHDLocations }
        - { id: ccd, text: CCDLocations }
        - { id: redir, text: RedirXMLSourceFolder }
        - { id: size, text: SizeInMBs }
    - id: type
      options:
        - { id: multi, text: MultiString }
        - { id: dword, text: DWORD }
        - { id: qword, text: QWORD }
        - { id: binary, text: Binary }
answer:
  values: { path: prof, name: vhd, type: multi }
explanation:
  correct:
    en: Profile container settings are machine-wide values under HKLM\SOFTWARE\FSLogix\Profiles. Enabled = 1 turns profile containers on, and VHDLocations, a multi-string (or string) value, lists the SMB paths where FSLogix looks for or creates the containers.
    fr: Les paramètres des conteneurs de profils sont des valeurs propres à l'ordinateur sous HKLM\SOFTWARE\FSLogix\Profiles. Enabled = 1 active les conteneurs de profils, et VHDLocations, une valeur multichaîne (ou chaîne), liste les chemins SMB où FSLogix recherche ou crée les conteneurs.
  options:
    odfc: { en: "This key configures ODFC containers (Microsoft 365 Apps data only), not profile containers.", fr: "Cette clé configure les conteneurs ODFC (données des Microsoft 365 Apps seulement), pas les conteneurs de profils." }
    hkcu: { en: "FSLogix settings are computer settings read before the user profile loads; they aren't stored in the user hive.", fr: "Les paramètres FSLogix sont des paramètres d'ordinateur lus avant le chargement du profil utilisateur ; ils ne sont pas stockés dans la ruche de l'utilisateur." }
    ccd: { en: "CCDLocations configures Cloud Cache providers, which isn't required here.", fr: "CCDLocations configure les fournisseurs Cloud Cache, ce qui n'est pas demandé ici." }
    redir: { en: "RedirXMLSourceFolder points to a redirections.xml file used for folder exclusions, not to the container storage.", fr: "RedirXMLSourceFolder pointe vers un fichier redirections.xml utilisé pour les exclusions de dossiers, pas vers le stockage des conteneurs." }
    dword: { en: "A location list is a string value, not a number.", fr: "Une liste d'emplacements est une valeur de chaîne, pas un nombre." }
references:
  - title: Store FSLogix profile containers on Azure Files and Active Directory Domain Services or Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-profile-container-configure-azure-files-active-directory
  - title: Configuration Setting Reference
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
