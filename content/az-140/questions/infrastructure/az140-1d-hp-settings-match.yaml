id: az140-1d-hp-settings-match
objective: "1.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure Virtual Desktop host pools:

    | Name | Type |
    | --- | --- |
    | HP-Pool | Pooled |
    | HP-Pers | Personal |

    You need to configure the host pools to meet the requirements in the answer area.

    Which setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux pools d'hôtes Azure Virtual Desktop :

    | Nom | Type |
    | --- | --- |
    | HP-Pool | Regroupé |
    | HP-Pers | Personnel |

    Vous devez configurer les pools d'hôtes pour respecter les exigences de la zone de réponse.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sau, text: { en: "Scheduled agent updates", fr: "Mises à jour planifiées de l'agent" } }
    - { id: svm, text: Start VM on Connect }
    - { id: direct, text: { en: "Assignment type Direct", fr: "Type d'attribution Direct" } }
    - { id: auto, text: { en: "Assignment type Automatic", fr: "Type d'attribution Automatique" } }
    - { id: pag, text: { en: "Preferred app group type RemoteApp", fr: "Type de groupe d'applications préféré RemoteApp" } }
    - { id: val, text: { en: "Validation environment", fr: "Environnement de validation" } }
  targets:
    - id: t1
      text: { en: "HP-Pool: the agent and the side-by-side stack are updated only on Saturdays between 22:00 and 24:00", fr: "HP-Pool : l'agent et la pile côte à côte ne sont mis à jour que le samedi entre 22 h et 24 h" }
    - id: t2
      text: { en: "HP-Pers: a deallocated personal desktop is powered on when its user connects", fr: "HP-Pers : un bureau personnel libéré est démarré quand son utilisateur se connecte" }
    - id: t3
      text: { en: "HP-Pers: an administrator chooses which session host each user receives", fr: "HP-Pers : un administrateur choisit l'hôte de session que reçoit chaque utilisateur" }
    - id: t4
      text: { en: "HP-Pool: users assigned to both a desktop and a RemoteApp application group see only the published applications", fr: "HP-Pool : les utilisateurs affectés à la fois à un groupe d'applications de bureau et à un groupe d'applications RemoteApp ne voient que les applications publiées" }
answer:
  mapping: { t1: sau, t2: svm, t3: direct, t4: pag }
explanation:
  correct:
    en: |
      Scheduled agent updates define two-hour maintenance windows for the agent, the side-by-side stack and the Geneva Monitoring agent. Start VM on Connect powers on the deallocated session host assigned to the user. With the Direct assignment type, an administrator assigns each user to a specific session host. The preferred application group type decides whether users assigned to both group types on a pooled host pool see the desktop or the RemoteApp applications.
    fr: |
      Les mises à jour planifiées de l'agent définissent des fenêtres de maintenance de deux heures pour l'agent, la pile côte à côte et l'agent Geneva Monitoring. Start VM on Connect démarre l'hôte de session libéré attribué à l'utilisateur. Avec le type d'attribution Direct, un administrateur attribue chaque utilisateur à un hôte de session précis. Le type de groupe d'applications préféré détermine si les utilisateurs affectés aux deux types de groupes d'un pool d'hôtes regroupé voient le bureau ou les applications RemoteApp.
  options:
    auto:
      en: With Automatic assignment, the service picks an available session host at the user's first connection; no administrator chooses it.
      fr: Avec l'attribution Automatique, le service choisit un hôte de session disponible à la première connexion de l'utilisateur ; aucun administrateur ne le choisit.
    val:
      en: A validation environment receives Azure Virtual Desktop service updates early; it doesn't schedule agent updates.
      fr: Un environnement de validation reçoit en avance les mises à jour du service Azure Virtual Desktop ; il ne planifie pas les mises à jour de l'agent.
references:
  - title: Scheduled Agent Updates for Azure Virtual Desktop host pools
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/scheduled-agent-updates
  - title: Configure personal desktop assignment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
