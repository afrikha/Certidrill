id: az140-1a-bw-behavior
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware is sizing the network links of its offices for an Azure Virtual Desktop host pool named **HP1**. Users print documents to local printers by using printer redirection.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dimensionne les liaisons réseau de ses bureaux pour un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Les utilisateurs impriment des documents sur des imprimantes locales grâce à la redirection d'imprimante.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When other applications need the link, RDP lowers image quality, frame rate or compression to use less bandwidth.
        fr: Quand d'autres applications ont besoin de la liaison, RDP réduit la qualité d'image, la fréquence d'images ou la compression pour utiliser moins de bande passante.
    - id: s2
      text:
        en: Redirecting a 200-page print job to a local printer has a negligible effect on the bandwidth used by the session.
        fr: La redirection d'un travail d'impression de 200 pages vers une imprimante locale a un effet négligeable sur la bande passante utilisée par la session.
    - id: s3
      text:
        en: Heartbeat traffic between the client and the session host uses about 20 bytes every 5 seconds.
        fr: Le trafic de pulsation entre le client et l'hôte de session utilise environ 20 octets toutes les 5 secondes.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      RDP continuously measures the available bandwidth and round-trip time; it uses the whole link when it can and backs off by adjusting image quality, frame rate or compression when other applications need the network. Microsoft warns that a large print job, such as a 200-page document, can use significant bandwidth, while heartbeats are only about 20 bytes every 5 seconds.
    fr: |
      RDP mesure en continu la bande passante disponible et la durée aller-retour ; il utilise toute la liaison quand il le peut et se met en retrait en ajustant la qualité d'image, la fréquence d'images ou la compression quand d'autres applications ont besoin du réseau. Microsoft avertit qu'un gros travail d'impression, comme un document de 200 pages, peut consommer une bande passante importante, alors que les pulsations ne représentent qu'environ 20 octets toutes les 5 secondes.
references:
  - title: Direct Stream (DS) bandwidth requirements
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-bandwidth
