id: az140-1d-lic-peruser-facts
objective: "1.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank enrolled an Azure subscription named **Sub-Ext** in per-user access pricing. Sub-Ext contains an Azure Virtual Desktop host pool whose session hosts run Windows 11 Enterprise multi-session. The host pool publishes RemoteApp applications and a full desktop to the bank's corporate customers.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank a inscrit un abonnement Azure nommé **Sub-Ext** à la tarification de l'accès par utilisateur. Sub-Ext contient un pool d'hôtes Azure Virtual Desktop dont les hôtes de session exécutent Windows 11 Entreprise multisession. Le pool d'hôtes publie des applications RemoteApp et un bureau complet pour les entreprises clientes de la banque.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A customer user who accesses only RemoteApp applications during the month is billed at the Apps price.", fr: "Un utilisateur client qui n'accède qu'à des applications RemoteApp pendant le mois est facturé au prix Apps." } }
    - { id: b, text: { en: "The monthly charge includes the Microsoft 365 Apps license that the customer users need.", fr: "Le montant mensuel inclut la licence Microsoft 365 Apps dont les utilisateurs clients ont besoin." } }
    - { id: c, text: { en: "Bank employees who have Microsoft 365 E3 licenses aren't billed when they use the host pool in Sub-Ext.", fr: "Les employés de la banque qui disposent de licences Microsoft 365 E3 ne sont pas facturés quand ils utilisent le pool d'hôtes de Sub-Ext." } }
    - { id: d, text: { en: "A customer user who doesn't access any RemoteApp application or desktop during the month isn't billed.", fr: "Un utilisateur client qui n'accède à aucune application RemoteApp ni à aucun bureau pendant le mois n'est pas facturé." } }
    - { id: e, text: { en: "Per-user access pricing also covers a host pool in Sub-Ext whose session hosts run Windows Server 2022.", fr: "La tarification de l'accès par utilisateur couvre aussi un pool d'hôtes de Sub-Ext dont les hôtes de session exécutent Windows Server 2022." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The price tier is set automatically each month: Apps if the user accessed at least one RemoteApp application but no desktop, Desktops + apps if the user accessed at least one full desktop. A user who accesses no RemoteApp application or desktop incurs no charge, and each user is charged at most once per billing period.
    fr: |
      Le niveau de prix est déterminé automatiquement chaque mois : Apps si l'utilisateur a accédé à au moins une application RemoteApp mais à aucun bureau, Desktops + apps s'il a accédé à au moins un bureau complet. Un utilisateur qui n'accède à aucune application RemoteApp ni à aucun bureau n'est pas facturé, et chaque utilisateur est facturé au plus une fois par période de facturation.
  options:
    b:
      en: Per-user access pricing covers only Azure Virtual Desktop access rights and FSLogix; Microsoft 365 Apps must be licensed separately.
      fr: La tarification de l'accès par utilisateur ne couvre que les droits d'accès à Azure Virtual Desktop et FSLogix ; Microsoft 365 Apps doit faire l'objet d'une licence distincte.
    c:
      en: Every user who connects to resources in an enrolled subscription is billed, including users who already have an eligible license; give employees access through a subscription that isn't enrolled.
      fr: Chaque utilisateur qui se connecte aux ressources d'un abonnement inscrit est facturé, y compris s'il a déjà une licence éligible ; donnez accès aux employés par un abonnement non inscrit.
    e:
      en: Per-user access pricing isn't available for Windows Server session hosts, which require RDS CALs.
      fr: La tarification de l'accès par utilisateur n'est pas disponible pour les hôtes de session Windows Server, qui exigent des CAL RDS.
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
