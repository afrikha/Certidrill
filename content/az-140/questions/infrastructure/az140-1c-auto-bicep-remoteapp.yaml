id: az140-1c-auto-bicep-remoteapp
objective: "1.4.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are writing a Bicep file that deploys an Azure Virtual Desktop pooled host pool named hp-apps and an application group named hp-apps-rag.

    The file must meet the following requirements:

    - Users who are assigned both a desktop and a RemoteApp application group in hp-apps must see the RemoteApps.
    - hp-apps-rag must publish individual applications, not a full desktop, from the session hosts of hp-apps.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un fichier Bicep qui déploie un pool d'hôtes Azure Virtual Desktop regroupé nommé hp-apps et un groupe d'applications nommé hp-apps-rag.

    Le fichier doit répondre aux exigences suivantes :

    - Les utilisateurs attribués à la fois à un groupe d'applications de bureau et à un groupe RemoteApp de hp-apps doivent voir les RemoteApp.
    - hp-apps-rag doit publier des applications individuelles, et non un bureau complet, depuis les hôtes de session de hp-apps.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    param location string = resourceGroup().location

    resource hostPool 'Microsoft.DesktopVirtualization/hostPools@2024-04-03' = {
      name: 'hp-apps'
      location: location
      properties: {
        hostPoolType: 'Pooled'
        loadBalancerType: 'BreadthFirst'
        maxSessionLimit: 16
        preferredAppGroupType: [[pref]]
      }
    }

    resource rag 'Microsoft.DesktopVirtualization/applicationGroups@2024-04-03' = {
      name: 'hp-apps-rag'
      location: location
      properties: {
        applicationGroupType: [[agtype]]
        hostPoolArmPath: [[hpref]]
      }
    }
  slots:
    - id: pref
      options:
        - { id: rail, text: "'RailApplications'" }
        - { id: remoteapp, text: "'RemoteApp'" }
        - { id: desktop, text: "'Desktop'" }
    - id: agtype
      options:
        - { id: rail, text: "'RailApplications'" }
        - { id: remoteapp, text: "'RemoteApp'" }
        - { id: desktop, text: "'Desktop'" }
    - id: hpref
      options:
        - { id: id, text: hostPool.id }
        - { id: name, text: hostPool.name }
        - { id: type, text: hostPool.properties.hostPoolType }
answer:
  values: { pref: rail, agtype: remoteapp, hpref: id }
explanation:
  correct:
    en: |
      The two properties use different enum values. On the host pool, `preferredAppGroupType` accepts `Desktop`, `RailApplications` (RemoteApp) or `None`. On the application group, `applicationGroupType` accepts `Desktop` or `RemoteApp`. `hostPoolArmPath` expects the ARM path (resource ID) of the host pool, which the symbolic name exposes as `hostPool.id`.
    fr: |
      Les deux propriétés utilisent des valeurs d'énumération différentes. Sur le pool d'hôtes, `preferredAppGroupType` accepte `Desktop`, `RailApplications` (RemoteApp) ou `None`. Sur le groupe d'applications, `applicationGroupType` accepte `Desktop` ou `RemoteApp`. `hostPoolArmPath` attend le chemin ARM (ID de ressource) du pool d'hôtes, que le nom symbolique expose sous la forme `hostPool.id`.
  options:
    remoteapp: { en: "'RemoteApp' is valid for applicationGroupType only; preferredAppGroupType uses 'RailApplications'.", fr: "'RemoteApp' n'est valide que pour applicationGroupType ; preferredAppGroupType utilise 'RailApplications'." }
    rail: { en: "'RailApplications' is valid for preferredAppGroupType only; applicationGroupType uses 'RemoteApp'.", fr: "'RailApplications' n'est valide que pour preferredAppGroupType ; applicationGroupType utilise 'RemoteApp'." }
    desktop: { en: "'Desktop' would show the desktop as preferred, or publish a full desktop instead of applications.", fr: "'Desktop' rendrait le bureau préféré, ou publierait un bureau complet au lieu d'applications." }
    name: { en: "hostPoolArmPath needs the full resource ID, not the host pool name.", fr: "hostPoolArmPath exige l'ID de ressource complet, pas le nom du pool d'hôtes." }
    type: { en: "The host pool type isn't a reference to the host pool.", fr: "Le type de pool d'hôtes n'est pas une référence au pool d'hôtes." }
references:
  - title: Microsoft.DesktopVirtualization/hostPools
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.desktopvirtualization/hostpools
  - title: Microsoft.DesktopVirtualization/applicationGroups
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.desktopvirtualization/applicationgroups
