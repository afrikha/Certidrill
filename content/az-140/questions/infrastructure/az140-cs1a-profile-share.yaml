id: az140-cs1a-profile-share
objective: "1.2.4"
type: ordering
caseStudy: az140-cs1a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to prepare the Azure Files share for the FSLogix profile containers. The solution must meet the profile requirements.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez préparer le partage Azure Files destiné aux conteneurs de profil FSLogix. La solution doit respecter les exigences relatives aux profils.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create a premium storage account and a file share named profiles.", fr: "Créer un compte de stockage Premium et un partage de fichiers nommé profiles." } }
    - { id: join, text: { en: "Run Join-AzStorageAccount from a domain-joined computer to enable AD DS authentication.", fr: "Exécuter Join-AzStorageAccount depuis un ordinateur joint au domaine pour activer l'authentification AD DS." } }
    - { id: rbac, text: { en: "Assign the Storage File Data SMB Share Contributor role on the share to AVD-Claims.", fr: "Attribuer le rôle Storage File Data SMB Share Contributor sur le partage à AVD-Claims." } }
    - { id: ntfs, text: { en: "Mount the share with the storage account key and set the NTFS permissions with icacls.", fr: "Monter le partage avec la clé du compte de stockage et définir les autorisations NTFS avec icacls." } }
    - { id: kerb, text: { en: "Enable Microsoft Entra Kerberos authentication on the storage account.", fr: "Activer l'authentification Microsoft Entra Kerberos sur le compte de stockage." } }
    - { id: nokey, text: { en: "Disable storage account key access on the storage account.", fr: "Désactiver l'accès par clé du compte de stockage." } }
    - { id: elev, text: { en: "Assign the Storage File Data SMB Share Elevated Contributor role on the share to AVD-Claims.", fr: "Attribuer le rôle Storage File Data SMB Share Elevated Contributor sur le partage à AVD-Claims." } }
answer:
  sequence: [ create, join, rbac, ntfs ]
explanation:
  correct:
    en: |
      You first create the storage account and the share, then join the storage account to AD DS with the AzFilesHybrid module so that session hosts can authenticate with Kerberos. Next, you grant the agents the share-level role Storage File Data SMB Share Contributor, and finally you mount the share with the storage account key to set NTFS permissions (Modify for the users on the root folder only, Modify for CREATOR OWNER on subfolders and files), so that each agent can use only their own profile folder.
    fr: |
      Vous créez d'abord le compte de stockage et le partage, puis vous joignez le compte de stockage à AD DS avec le module AzFilesHybrid pour que les hôtes de session puissent s'authentifier avec Kerberos. Vous accordez ensuite aux gestionnaires le rôle de niveau partage Storage File Data SMB Share Contributor, et enfin vous montez le partage avec la clé du compte de stockage pour définir les autorisations NTFS (Modification pour les utilisateurs sur le dossier racine uniquement, Modification pour CREATOR OWNER sur les sous-dossiers et fichiers), afin que chaque gestionnaire ne puisse utiliser que son propre dossier de profil.
  options:
    kerb: { en: "Microsoft Entra Kerberos is another identity source, used for cloud or Microsoft Entra joined scenarios; the requirement is AD DS authentication.", fr: "Microsoft Entra Kerberos est une autre source d'identité, destinée aux scénarios cloud ou joints à Microsoft Entra ; l'exigence impose l'authentification AD DS." }
    nokey: { en: "Storage account key access must stay enabled: you need the key to mount the share and set the NTFS permissions.", fr: "L'accès par clé du compte de stockage doit rester activé : la clé est nécessaire pour monter le partage et définir les autorisations NTFS." }
    elev: { en: "The Elevated Contributor role lets users change NTFS permissions; agents only need the Contributor role.", fr: "Le rôle Elevated Contributor permet de modifier les autorisations NTFS ; les gestionnaires n'ont besoin que du rôle Contributor." }
references:
  - title: Store FSLogix profile containers on Azure Files and Active Directory Domain Services or Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-profile-container-configure-azure-files-active-directory
  - title: Configure SMB Storage Permissions
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-storage-permissions
