id: az140-1d-life-gallery-controls
objective: "1.5.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You manage the image versions used to deploy Azure Virtual Desktop session hosts in an Azure Compute Gallery. The versions are replicated to West Europe and East US.

    You need to meet the lifecycle requirements in the answer area.

    Which image version setting should you use for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez les versions d'image servant à déployer des hôtes de session Azure Virtual Desktop dans une galerie Azure Compute Gallery. Les versions sont répliquées dans West Europe et East US.

    Vous devez respecter les exigences de cycle de vie de la zone de réponse.

    Quel paramètre de version d'image devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: excl, text: excludeFromLatest }
    - { id: regex, text: regionalExcludeFromLatest }
    - { id: eol, text: { en: "End-of-life date", fr: "Date de fin de vie" } }
    - { id: block, text: BlockDeletionBeforeEndOfLife }
    - { id: replicas, text: { en: "Regional replica count", fr: "Nombre de réplicas par région" } }
    - { id: shallow, text: { en: "Shallow replication mode", fr: "Mode de réplication superficielle (Shallow)" } }
  targets:
    - id: t1
      text: { en: "An untested version must not be chosen as latest in any region", fr: "Une version non testée ne doit être choisie comme la plus récente dans aucune région" }
    - id: t2
      text: { en: "A version must not be chosen as latest in East US only", fr: "Une version ne doit pas être choisie comme la plus récente dans East US uniquement" }
    - id: t3
      text: { en: "Record the date after which a version should no longer be used, without blocking deployments", fr: "Enregistrer la date après laquelle une version ne devrait plus être utilisée, sans bloquer les déploiements" }
    - id: t4
      text: { en: "Prevent a version from being deleted before its planned retirement date", fr: "Empêcher la suppression d'une version avant sa date de retrait prévue" }
answer:
  mapping: { t1: excl, t2: regex, t3: eol, t4: block }
explanation:
  correct:
    en: |
      `excludeFromLatest` keeps a version out of latest globally, while `regionalExcludeFromLatest` does it for one target region and takes precedence there. The end-of-life date is informational: deployments past that date still succeed. `BlockDeletionBeforeEndOfLife` blocks deleting the image before its end-of-life date.
    fr: |
      `excludeFromLatest` exclut une version de la plus récente dans toutes les régions, tandis que `regionalExcludeFromLatest` le fait pour une région cible et y est prioritaire. La date de fin de vie est informative : les déploiements après cette date réussissent toujours. `BlockDeletionBeforeEndOfLife` bloque la suppression de l'image avant sa date de fin de vie.
  options:
    replicas:
      en: The replica count sets how many copies serve deployments in a region; it doesn't affect latest or deletion.
      fr: Le nombre de réplicas définit combien de copies servent les déploiements dans une région ; il n'affecte ni la plus récente ni la suppression.
    shallow:
      en: Shallow replication makes a version available faster for development and testing; it doesn't control latest or deletion.
      fr: La réplication superficielle rend une version disponible plus vite pour le développement et les tests ; elle ne contrôle ni la plus récente ni la suppression.
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
