id: az140-1d-hp-session-limit-reached
objective: "1.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** that uses the depth-first load balancing algorithm with a max session limit of 10.

    HP1 contains three session hosts named SH-0, SH-1 and SH-2. All three session hosts are running, none of them is in drain mode, and each of them currently hosts 10 user sessions.

    Users who don't have a session yet report that they can't connect to HP1.

    Which two actions would each allow the users to connect? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** qui utilise l'algorithme d'équilibrage de charge depth-first avec une limite maximale de sessions de 10.

    HP1 contient trois hôtes de session nommés SH-0, SH-1 et SH-2. Les trois hôtes de session sont démarrés, aucun n'est en mode drainage, et chacun héberge actuellement 10 sessions utilisateur.

    Des utilisateurs qui n'ont pas encore de session signalent qu'ils ne peuvent pas se connecter à HP1.

    Quelles sont les deux actions qui permettraient chacune aux utilisateurs de se connecter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Raise the max session limit of HP1 to 15.", fr: "Augmenter la limite maximale de sessions de HP1 à 15." } }
    - { id: b, text: { en: "Enable Start VM on Connect on HP1.", fr: "Activer Start VM on Connect sur HP1." } }
    - { id: c, text: { en: "Add a session host to HP1.", fr: "Ajouter un hôte de session à HP1." } }
    - { id: d, text: { en: "Set the preferred application group type of HP1 to RemoteApp.", fr: "Définir le type de groupe d'applications préféré de HP1 sur RemoteApp." } }
    - { id: e, text: { en: "Turn on drain mode on SH-0.", fr: "Activer le mode drainage sur SH-0." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Depth-first only considers session hosts that are below the max session limit. When every host has reached the limit, new connections fail until you increase the limit or add session hosts to the host pool. Lowering or raising the limit doesn't affect existing sessions.
    fr: |
      Depth-first ne prend en compte que les hôtes de session situés sous la limite maximale de sessions. Quand tous les hôtes ont atteint la limite, les nouvelles connexions échouent jusqu'à ce que vous augmentiez la limite ou ajoutiez des hôtes de session au pool d'hôtes. Abaisser ou relever la limite n'affecte pas les sessions existantes.
  options:
    b:
      en: All the session hosts are already running; Start VM on Connect starts deallocated hosts and doesn't raise the capacity of running ones.
      fr: Tous les hôtes de session sont déjà démarrés ; Start VM on Connect démarre des hôtes libérés et n'augmente pas la capacité des hôtes démarrés.
    d:
      en: The preferred application group type changes which resources users see, not how many sessions a host accepts.
      fr: Le type de groupe d'applications préféré change les ressources que voient les utilisateurs, pas le nombre de sessions qu'accepte un hôte.
    e:
      en: Drain mode stops new sessions on SH-0, which removes capacity instead of adding it.
      fr: Le mode drainage bloque les nouvelles sessions sur SH-0, ce qui retire de la capacité au lieu d'en ajouter.
references:
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-load-balancing
