id: az140-1a-net-nat-gateway
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You create a subnet named **snet-hosts** for the session hosts of an Azure Virtual Desktop host pool named **HP1**. The subnet is a private subnet: default outbound access is disabled. There is no firewall or network virtual appliance in the environment.

    The session hosts can't reach the required Azure Virtual Desktop endpoints, Windows activation or Windows Update.

    You need to provide outbound internet connectivity to the session hosts. The solution must meet the following requirements:

    - The session hosts must not have public IP addresses.
    - Administrative effort must be minimized.

    What should you do?
  fr: |
    Vous créez un sous-réseau nommé **snet-hosts** pour les hôtes de session d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Le sous-réseau est un sous-réseau privé : l'accès sortant par défaut est désactivé. L'environnement ne contient ni pare-feu ni appliance virtuelle réseau.

    Les hôtes de session ne peuvent joindre ni les points de terminaison Azure Virtual Desktop requis, ni l'activation de Windows, ni Windows Update.

    Vous devez fournir une connectivité Internet sortante aux hôtes de session. La solution doit répondre aux exigences suivantes :

    - Les hôtes de session ne doivent pas avoir d'adresse IP publique.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add an outbound NSG rule that allows the Internet service tag from snet-hosts.", fr: "Ajouter une règle NSG sortante qui autorise l'étiquette de service Internet depuis snet-hosts." }
    - id: b
      text: { en: "Create a NAT gateway with a public IP address and associate it with snet-hosts.", fr: "Créer une passerelle NAT avec une adresse IP publique et l'associer à snet-hosts." }
    - id: c
      text: { en: "Assign a Standard SKU public IP address to the network interface of each session host.", fr: "Attribuer une adresse IP publique de référence SKU Standard à l'interface réseau de chaque hôte de session." }
    - id: d
      text: { en: "Create a private endpoint with the connection sub-resource for HP1 in snet-hosts.", fr: "Créer un point de terminaison privé avec la sous-ressource connection pour HP1 dans snet-hosts." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A private subnet has no implicit outbound access, so the session hosts need an explicit outbound method. A NAT gateway associated with the subnet gives every VM in it outbound internet access through the gateway's public IP address, without a public IP on any VM and without appliances to manage.
    fr: |
      Un sous-réseau privé n'a pas d'accès sortant implicite : les hôtes de session ont besoin d'une méthode sortante explicite. Une passerelle NAT associée au sous-réseau donne à toutes ses machines virtuelles un accès Internet sortant par l'adresse IP publique de la passerelle, sans IP publique sur les machines virtuelles et sans appliance à gérer.
  options:
    a: { en: "An NSG rule only filters traffic; it doesn't create an outbound path for a private subnet.", fr: "Une règle NSG ne fait que filtrer le trafic ; elle ne crée pas de chemin sortant pour un sous-réseau privé." }
    c: { en: "Public IP addresses on the session hosts violate the requirement and Microsoft's recommendation, and they add per-VM administration.", fr: "Des adresses IP publiques sur les hôtes de session violent l'exigence et la recommandation de Microsoft, et ajoutent de l'administration par machine virtuelle." }
    d: { en: "A connection private endpoint carries host pool traffic only; Windows activation and Windows Update still need internet access.", fr: "Un point de terminaison privé connection ne transporte que le trafic du pool d'hôtes ; l'activation et Windows Update ont toujours besoin d'Internet." }
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
