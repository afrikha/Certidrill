id: az140-1c-hp-session-host-limit
objective: "1.3.4"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Litware, Inc. plans a pooled Azure Virtual Desktop workload for a call center that requires 14,000 identical session hosts in one Azure region. The subscriptions have enough vCPU quota.

    You need to recommend how many host pools to create. The solution must respect the Azure Virtual Desktop service limits and minimize the number of host pools.

    How many host pools should you recommend?
  fr: |
    Litware, Inc. prévoit une charge de travail Azure Virtual Desktop regroupée pour un centre d'appels qui exige 14 000 hôtes de session identiques dans une seule région Azure. Les abonnements disposent d'un quota de vCPU suffisant.

    Vous devez recommander le nombre de pools d'hôtes à créer. La solution doit respecter les limites du service Azure Virtual Desktop et réduire au minimum le nombre de pools d'hôtes.

    Combien de pools d'hôtes devez-vous recommander ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "4" }
    - { id: d, text: "35" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Virtual Desktop supports up to 10,000 session hosts per host pool, so 14,000 hosts need at least two host pools, each under the limit.
    fr: |
      Azure Virtual Desktop prend en charge jusqu'à 10 000 hôtes de session par pool d'hôtes : 14 000 hôtes exigent donc au moins deux pools d'hôtes, chacun sous la limite.
  options:
    a: { en: "One host pool would exceed the limit of 10,000 session hosts per host pool.", fr: "Un seul pool d'hôtes dépasserait la limite de 10 000 hôtes de session par pool." }
    c: { en: "Four host pools respect the limit but don't minimize the number of host pools.", fr: "Quatre pools d'hôtes respectent la limite mais ne réduisent pas au minimum leur nombre." }
    d: { en: "400 is the number of VMs the portal deploys in one operation, not the host pool limit.", fr: "400 est le nombre de machines virtuelles que le portail déploie en une opération, pas la limite d'un pool d'hôtes." }
references:
  - title: Azure subscription and service limits, quotas, and constraints
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits
