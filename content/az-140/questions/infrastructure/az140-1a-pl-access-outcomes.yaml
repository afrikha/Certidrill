id: az140-1a-pl-access-outcomes
objective: "1.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum has the following Azure Virtual Desktop resources. Each host pool has a private endpoint with the connection sub-resource, and the session hosts of both host pools use private routes.

    | Resource | Type | Public access setting |
    | --- | --- | --- |
    | HP1 | Host pool | Enable public access for end users, use private access for session hosts |
    | HP2 | Host pool | Disable public access and use private access |
    | WS-Global | Workspace with the global private endpoint, no application group | Disable public access and use private access |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose des ressources Azure Virtual Desktop suivantes. Chaque pool d'hôtes possède un point de terminaison privé avec la sous-ressource connection, et les hôtes de session des deux pools d'hôtes utilisent des itinéraires privés.

    | Ressource | Type | Paramètre d'accès public |
    | --- | --- | --- |
    | HP1 | Pool d'hôtes | Enable public access for end users, use private access for session hosts |
    | HP2 | Pool d'hôtes | Disable public access and use private access |
    | WS-Global | Espace de travail avec le point de terminaison privé global, sans groupe d'applications | Disable public access and use private access |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user on the internet whose client uses a public route can connect to a session in HP1.
        fr: Un utilisateur sur Internet dont le client utilise un itinéraire public peut se connecter à une session de HP1.
    - id: s2
      text:
        en: A user on the internet whose client uses a public route can connect to a session in HP2.
        fr: Un utilisateur sur Internet dont le client utilise un itinéraire public peut se connecter à une session de HP2.
    - id: s3
      text:
        en: A client on the internet without a VPN can complete initial feed discovery.
        fr: Un client sur Internet sans VPN peut effectuer la découverte initiale du flux.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With **Enable public access for end users, use private access for session hosts**, the connection is allowed whenever the session host uses a private route, whatever the client route. With **Disable public access and use private access**, a connection is denied if either side uses a public route. Public access settings don't apply to the workspace that holds the global sub-resource: it is always reachable over public routes.
    fr: |
      Avec **Enable public access for end users, use private access for session hosts**, la connexion est autorisée dès que l'hôte de session utilise un itinéraire privé, quel que soit l'itinéraire du client. Avec **Disable public access and use private access**, une connexion est refusée si l'un des deux côtés utilise un itinéraire public. Les paramètres d'accès public ne s'appliquent pas à l'espace de travail qui porte la sous-ressource global : il est toujours joignable par des itinéraires publics.
references:
  - title: Azure Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview
