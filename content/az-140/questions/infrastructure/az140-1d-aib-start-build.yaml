id: az140-1d-aib-start-build
objective: "1.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the Azure portal, you open **Azure Virtual Desktop > Custom image templates** and create a custom image template named **tpl-sales**. The template uses an Azure Marketplace source image and distributes to an existing Azure Compute Gallery image definition. The template is created successfully.

    The next day, the image definition still has no image version.

    What should you do?
  fr: |
    Dans le portail Azure, vous ouvrez **Azure Virtual Desktop > Custom image templates** et créez un modèle d'image personnalisée nommé **tpl-sales**. Le modèle utilise une image source de la Place de marché Azure et distribue vers une définition d'image Azure Compute Gallery existante. Le modèle est créé avec succès.

    Le lendemain, la définition d'image n'a toujours aucune version d'image.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select tpl-sales, then select Start build.", fr: "Sélectionner tpl-sales, puis sélectionner Start build." } }
    - { id: b, text: { en: "Increase the build timeout of tpl-sales.", fr: "Augmenter le délai d'expiration du build de tpl-sales." } }
    - { id: c, text: { en: "Create image version 1.0.0 in the image definition.", fr: "Créer la version d'image 1.0.0 dans la définition d'image." } }
    - { id: d, text: { en: "Delete the staging resource group of tpl-sales.", fr: "Supprimer le groupe de ressources intermédiaire de tpl-sales." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Creating a custom image template (or an Image Builder image template) doesn't build the image. You start the build with **Start build** in the portal, which invokes the `Run` action of the template; Image Builder then creates the build VM, runs the customizations, generalizes it and creates the image version.
    fr: |
      Créer un modèle d'image personnalisée (ou un modèle d'image Image Builder) ne construit pas l'image. Vous lancez le build avec **Start build** dans le portail, ce qui invoque l'action `Run` du modèle ; Image Builder crée alors la machine virtuelle de build, exécute les personnalisations, la généralise et crée la version d'image.
  options:
    c:
      en: Azure Virtual Desktop creates the image version during the build; you don't create it yourself.
      fr: Azure Virtual Desktop crée la version d'image pendant le build ; vous ne la créez pas vous-même.
    b:
      en: The build hasn't started, so it hasn't timed out; a longer timeout doesn't start it.
      fr: Le build n'a pas démarré, il n'a donc pas expiré ; un délai plus long ne le démarre pas.
    d:
      en: The staging resource group holds the build resources and logs; deleting it doesn't start a build.
      fr: Le groupe de ressources intermédiaire contient les ressources et journaux du build ; le supprimer ne démarre aucun build.
references:
  - title: Use custom image templates to create custom images in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-custom-image-templates
