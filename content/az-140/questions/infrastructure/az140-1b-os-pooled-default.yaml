id: az140-1b-os-pooled-default
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys plans to deploy an Azure Virtual Desktop pooled host pool for 400 office workers. Each session host must host several users at the same time. The users expect a Windows 11 desktop experience and are licensed with Microsoft 365 E3.

    You need to recommend an operating system for the session hosts. The solution must minimize the number of session hosts.

    What should you recommend?
  fr: |
    Wingtip Toys prévoit de déployer un pool d'hôtes regroupé Azure Virtual Desktop pour 400 employés de bureau. Chaque hôte de session doit héberger plusieurs utilisateurs en même temps. Les utilisateurs s'attendent à une expérience de bureau Windows 11 et disposent de licences Microsoft 365 E3.

    Vous devez recommander un système d'exploitation pour les hôtes de session. La solution doit réduire au minimum le nombre d'hôtes de session.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Windows 11 Enterprise
    - id: b
      text: Windows 11 Enterprise multi-session
    - id: c
      text: Windows 11 Pro
    - id: d
      text: Windows 11 Enterprise LTSC 2024
answer: { optionId: b }
explanation:
  correct:
    en: |
      Windows 11 Enterprise multi-session supports several concurrent interactive sessions on one VM with the Windows 11 experience, which is the usual choice for pooled host pools. Microsoft 365 E3 users are eligible to access it without RDS CALs.
    fr: |
      Windows 11 Entreprise multisession prend en charge plusieurs sessions interactives simultanées sur une machine virtuelle avec l'expérience Windows 11 : c'est le choix habituel pour les pools d'hôtes regroupés. Les utilisateurs Microsoft 365 E3 ont le droit d'y accéder sans CAL RDS.
  options:
    a: { en: "Windows 11 Enterprise allows one interactive session per VM, so 400 users would need about 400 session hosts.", fr: "Windows 11 Enterprise n'autorise qu'une session interactive par machine virtuelle : 400 utilisateurs nécessiteraient environ 400 hôtes de session." }
    c: { en: "Pro editions aren't supported operating systems for Azure Virtual Desktop session hosts.", fr: "Les éditions Pro ne sont pas des systèmes d'exploitation pris en charge pour les hôtes de session Azure Virtual Desktop." }
    d: { en: "LTSC editions aren't supported for Azure Virtual Desktop session hosts.", fr: "Les éditions LTSC ne sont pas prises en charge pour les hôtes de session Azure Virtual Desktop." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
