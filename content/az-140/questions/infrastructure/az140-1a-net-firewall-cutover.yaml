id: az140-1a-net-firewall-cutover
objective: "1.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    The session hosts of an Azure Virtual Desktop host pool named **HP1** are in a subnet named **snet-hosts** and use the default system routes to reach the internet. Users have active sessions.

    In a hub virtual network, you deployed an Azure Firewall named **FW1**. You also created a route table named **RT1** that contains a route for 0.0.0.0/0 with the next hop type **Virtual appliance** and the private IP address of FW1. RT1 isn't associated with any subnet. The policy of FW1 contains no rules.

    You need to send the internet-bound traffic of the session hosts through FW1. The session hosts must remain available during the change, and you must confirm afterwards that they reach every required endpoint.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Les hôtes de session d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** se trouvent dans un sous-réseau nommé **snet-hosts** et utilisent les itinéraires système par défaut pour joindre Internet. Des utilisateurs ont des sessions actives.

    Dans un réseau virtuel hub, vous avez déployé un Pare-feu Azure nommé **FW1**. Vous avez aussi créé une table de routage nommée **RT1** qui contient un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant **Appliance virtuelle** et l'adresse IP privée de FW1. RT1 n'est associée à aucun sous-réseau. La stratégie de FW1 ne contient aucune règle.

    Vous devez faire passer par FW1 le trafic à destination d'Internet des hôtes de session. Les hôtes de session doivent rester disponibles pendant la modification, et vous devez ensuite confirmer qu'ils joignent tous les points de terminaison requis.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rules, text: { en: "Add rules to the policy of FW1 that allow the required Azure Virtual Desktop FQDNs and endpoints.", fr: "Ajouter à la stratégie de FW1 des règles qui autorisent les FQDN et points de terminaison Azure Virtual Desktop requis." } }
    - { id: assoc, text: { en: "Associate RT1 with snet-hosts.", fr: "Associer RT1 à snet-hosts." } }
    - { id: tool, text: { en: "Run WVDAgentUrlTool.exe on a session host.", fr: "Exécuter WVDAgentUrlTool.exe sur un hôte de session." } }
    - { id: dnat, text: { en: "Add a DNAT rule to FW1 that forwards TCP 3389 to each session host.", fr: "Ajouter à FW1 une règle DNAT qui transfère TCP 3389 vers chaque hôte de session." } }
    - { id: fwsub, text: { en: "Associate RT1 with AzureFirewallSubnet.", fr: "Associer RT1 à AzureFirewallSubnet." } }
    - { id: nettest, text: { en: "Run avdnettest.exe on a session host.", fr: "Exécuter avdnettest.exe sur un hôte de session." } }
answer:
  sequence: [ rules, assoc, tool ]
explanation:
  correct:
    en: |
      If you associate RT1 first, the traffic of the session hosts reaches a firewall that allows nothing, and the hosts become unavailable. You therefore allow the required endpoints in FW1, then associate RT1 with snet-hosts, and finally run the Azure Virtual Desktop Agent URL Tool on a session host, which lists the required FQDNs and endpoints that are accessible and inaccessible.
    fr: |
      Si vous associez RT1 en premier, le trafic des hôtes de session atteint un pare-feu qui n'autorise rien, et les hôtes deviennent indisponibles. Vous autorisez donc d'abord les points de terminaison requis dans FW1, puis vous associez RT1 à snet-hosts, et enfin vous exécutez l'outil Azure Virtual Desktop Agent URL Tool sur un hôte de session : il liste les FQDN et points de terminaison requis accessibles et inaccessibles.
  options:
    dnat: { en: "Azure Virtual Desktop uses outbound reverse connect; no inbound RDP forwarding is needed.", fr: "Azure Virtual Desktop utilise reverse connect en sortie ; aucun transfert RDP entrant n'est nécessaire." }
    fwsub: { en: "A 0.0.0.0/0 route to the firewall on its own subnet would create a loop; the route belongs on snet-hosts.", fr: "Un itinéraire 0.0.0.0/0 vers le pare-feu sur son propre sous-réseau créerait une boucle ; l'itinéraire doit s'appliquer à snet-hosts." }
    nettest: { en: "avdnettest.exe tests STUN/TURN reachability and the NAT type, not the list of required endpoints.", fr: "avdnettest.exe teste l'accessibilité de STUN/TURN et le type de NAT, pas la liste des points de terminaison requis." }
references:
  - title: Check access to required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/check-access-validate-required-fqdn-endpoint
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
