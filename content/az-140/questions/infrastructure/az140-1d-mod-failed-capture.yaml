id: az140-1d-mod-failed-capture
objective: "1.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are modifying the Azure Virtual Desktop golden image of Wingtip Toys to add a new application. You created a build virtual machine named **vm-build-14** from the snapshot of the previous build, installed the application, took a snapshot named **snap-14** of the OS disk, and ran Sysprep.

    The capture of vm-build-14 to image version 1.4.0 in an Azure Compute Gallery fails.

    What should you do next?
  fr: |
    Vous modifiez l'image de référence Azure Virtual Desktop de Wingtip Toys pour y ajouter une nouvelle application. Vous avez créé une machine virtuelle de build nommée **vm-build-14** à partir de l'instantané du build précédent, installé l'application, pris un instantané nommé **snap-14** du disque du système d'exploitation, puis exécuté Sysprep.

    La capture de vm-build-14 vers la version d'image 1.4.0 d'une galerie Azure Compute Gallery échoue.

    Que devez-vous faire ensuite ?
body:
  options:
    - { id: a, text: { en: "Start vm-build-14, run Sysprep again, then capture it again.", fr: "Démarrer vm-build-14, exécuter de nouveau Sysprep, puis la capturer de nouveau." } }
    - { id: b, text: { en: "Create image version 1.4.0 directly from snap-14.", fr: "Créer directement la version d'image 1.4.0 à partir de snap-14." } }
    - { id: c, text: { en: "Create a new VM from snap-14, run Sysprep on it, then capture it.", fr: "Créer une nouvelle machine virtuelle à partir de snap-14, y exécuter Sysprep, puis la capturer." } }
    - { id: d, text: { en: "Capture vm-build-14 again, as a specialized image this time.", fr: "Capturer de nouveau vm-build-14, cette fois comme image spécialisée." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft says never to capture the same VM twice, even if the capture fails. Create a new VM from your latest snapshot, which already contains the application, run Sysprep on it and capture it. This is why you take a snapshot before generalizing.
    fr: |
      Microsoft recommande de ne jamais capturer deux fois la même machine virtuelle, même si la capture échoue. Créez une nouvelle machine virtuelle à partir de votre dernier instantané, qui contient déjà l'application, exécutez-y Sysprep et capturez-la. C'est la raison pour laquelle on prend un instantané avant de généraliser.
  options:
    a:
      en: A generalized VM can't be restarted, and a VM must not be captured twice.
      fr: Une machine virtuelle généralisée ne peut pas être redémarrée, et une machine virtuelle ne doit pas être capturée deux fois.
    b:
      en: snap-14 was taken before Sysprep, so a version created from it wouldn't be generalized and couldn't go in a generalized image definition.
      fr: |
        snap-14 a été pris avant Sysprep : une version créée à partir de lui ne serait pas généralisée et ne pourrait pas aller dans une définition d'image généralisée.
    d:
      en: A specialized image keeps the source computer name and accounts, so it doesn't suit a pool of session hosts, and the same VM still must not be captured twice.
      fr: Une image spécialisée conserve le nom d'ordinateur et les comptes de la source, ce qui ne convient pas à un pool d'hôtes de session, et la même machine virtuelle ne doit toujours pas être capturée deux fois.
references:
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
