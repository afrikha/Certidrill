id: az140-1c-perf-profile-storage
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans an Azure Virtual Desktop deployment for 900 users who run a medium workload (Microsoft 365 Apps and line-of-business applications). The users' FSLogix profile containers will be stored in Azure Files.

    You need to recommend a file share type that follows Microsoft's guidance for sign-in and session performance.

    What should you recommend?
  fr: |
    Tailspin Toys prévoit un déploiement Azure Virtual Desktop pour 900 utilisateurs qui exécutent une charge de travail moyenne (Microsoft 365 Apps et applications métier). Les conteneurs de profils FSLogix des utilisateurs seront stockés dans Azure Files.

    Vous devez recommander un type de partage de fichiers conforme aux recommandations de Microsoft pour les performances d'ouverture de session et de session.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A standard file share in the transaction optimized tier", fr: "Un partage de fichiers standard au niveau transaction optimisée" } }
    - { id: b, text: { en: "A standard file share in the hot tier", fr: "Un partage de fichiers standard au niveau chaud" } }
    - { id: c, text: { en: "A standard file share in the cool tier", fr: "Un partage de fichiers standard au niveau froid" } }
    - { id: d, text: { en: "A premium (SSD) file share", fr: "Un partage de fichiers premium (SSD)" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For FSLogix profile containers on Azure Files, Microsoft recommends premium file shares for medium, heavy and power workloads. Standard shares are recommended only for light workloads with fewer than 200 users.
    fr: |
      Pour les conteneurs de profils FSLogix sur Azure Files, Microsoft recommande des partages de fichiers premium pour les charges de travail moyennes, lourdes et intensives. Les partages standard ne sont recommandés que pour des charges légères de moins de 200 utilisateurs.
  options:
    a: { en: "Standard HDD-backed shares are recommended only for light workloads with fewer than 200 users.", fr: "Les partages standard sur HDD ne sont recommandés que pour des charges légères de moins de 200 utilisateurs." }
    b: { en: "The hot tier is still a standard, HDD-backed share, not recommended for a medium workload of 900 users.", fr: "Le niveau chaud reste un partage standard sur HDD, non recommandé pour une charge moyenne de 900 utilisateurs." }
    c: { en: "The cool tier is optimized for infrequently accessed data, the opposite of profiles read at every sign-in.", fr: "Le niveau froid est optimisé pour des données rarement consultées, à l'opposé de profils lus à chaque ouverture de session." }
references:
  - title: Storage options for FSLogix profile containers in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/store-fslogix-profile
