id: az140-1b-os-server-only-app
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. plans to publish a line-of-business application to 150 users from an Azure Virtual Desktop pooled host pool. The vendor supports the application only on Windows Server 2019 or later. Several users must share each session host. Litware has RDS CALs for all the users.

    You need to recommend the operating system for the session hosts. The solution must use the most recent operating system that meets the requirements.

    What should you recommend?
  fr: |
    Litware, Inc. prévoit de publier une application métier pour 150 utilisateurs à partir d'un pool d'hôtes regroupé Azure Virtual Desktop. L'éditeur ne prend en charge l'application que sur Windows Server 2019 ou version ultérieure. Plusieurs utilisateurs doivent partager chaque hôte de session. Litware dispose de CAL RDS pour tous les utilisateurs.

    Vous devez recommander le système d'exploitation des hôtes de session. La solution doit utiliser le système d'exploitation le plus récent qui répond aux exigences.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Windows 11 Enterprise multi-session
    - id: b
      text: Windows Server 2016
    - id: c
      text: Windows Server 2025
    - id: d
      text: Windows 11 Enterprise
answer: { optionId: c }
explanation:
  correct:
    en: |
      Windows Server 2016 through 2025 are supported session host operating systems and accept several concurrent sessions. Windows Server 2025 is the most recent and meets the vendor's Windows Server 2019 or later requirement. Windows Server session hosts require RDS CALs, which Litware already has.
    fr: |
      Windows Server 2016 à 2025 sont des systèmes d'exploitation pris en charge pour les hôtes de session et acceptent plusieurs sessions simultanées. Windows Server 2025 est le plus récent et répond à l'exigence de l'éditeur (Windows Server 2019 ou version ultérieure). Les hôtes de session Windows Server exigent des CAL RDS, dont Litware dispose déjà.
  options:
    a: { en: "Windows 11 Enterprise multi-session is a Windows client OS; the vendor supports only Windows Server.", fr: "Windows 11 Entreprise multisession est un système d'exploitation client Windows ; l'éditeur ne prend en charge que Windows Server." }
    b: { en: "Windows Server 2016 is older than the minimum version the vendor supports.", fr: "Windows Server 2016 est antérieur à la version minimale prise en charge par l'éditeur." }
    d: { en: "Windows 11 Enterprise is a single-session client OS, so users couldn't share session hosts.", fr: "Windows 11 Entreprise est un système d'exploitation client monosession : les utilisateurs ne pourraient pas partager les hôtes de session." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
