id: az140-1c-portal-name-prefix
objective: "1.4.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You are creating an Azure Virtual Desktop host pool that uses the standard management approach in the Azure portal. On the **Virtual machines** tab, you add session hosts and must enter a **Name prefix**.

    Azure appends a hyphen and a sequential number to the prefix to build each session host name.

    What is the maximum length of the name prefix?
  fr: |
    Vous créez dans le portail Azure un pool d'hôtes Azure Virtual Desktop qui utilise l'approche de gestion standard. Dans l'onglet **Virtual machines**, vous ajoutez des hôtes de session et devez saisir un **Name prefix**.

    Azure ajoute au préfixe un trait d'union et un numéro séquentiel pour construire le nom de chaque hôte de session.

    Quelle est la longueur maximale du préfixe de nom ?
body:
  options:
    - { id: a, text: { en: "8 characters", fr: "8 caractères" } }
    - { id: b, text: { en: "11 characters", fr: "11 caractères" } }
    - { id: c, text: { en: "15 characters", fr: "15 caractères" } }
    - { id: d, text: { en: "64 characters", fr: "64 caractères" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With standard management, the name prefix can have up to 11 characters (10 with a session host configuration). The prefix plus the hyphen and the number, for example `hp01-sh-0`, can't exceed 15 characters, the limit of a Windows computer name.
    fr: |
      Avec la gestion standard, le préfixe de nom peut compter jusqu'à 11 caractères (10 avec une configuration d'hôte de session). Le préfixe, le trait d'union et le numéro, par exemple `hp01-sh-0`, ne peuvent pas dépasser 15 caractères, la limite d'un nom d'ordinateur Windows.
  options:
    a: { en: "8 characters is shorter than the real limit of 11.", fr: "8 caractères est inférieur à la limite réelle de 11." }
    c: { en: "15 characters is the limit of the full name, prefix and suffix included.", fr: "15 caractères est la limite du nom complet, préfixe et suffixe compris." }
    d: { en: "64 characters is the limit of the host pool name, not of the session host prefix.", fr: "64 caractères est la limite du nom du pool d'hôtes, pas du préfixe des hôtes de session." }
references:
  - title: Deploy Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
