id: az140-1b-os-legacy-32bit
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank plans an Azure Virtual Desktop pooled host pool for a 32-bit line-of-business application that runs on Windows 10 and Windows 11. Several users must share each session host.

    A consultant proposes the following options to reduce cost and preserve compatibility. You need to recommend an option that Azure Virtual Desktop supports.

    What should you recommend?
  fr: |
    Woodgrove Bank prévoit un pool d'hôtes regroupé Azure Virtual Desktop pour une application métier 32 bits qui fonctionne sous Windows 10 et Windows 11. Plusieurs utilisateurs doivent partager chaque hôte de session.

    Un consultant propose les options suivantes pour réduire les coûts et préserver la compatibilité. Vous devez recommander une option prise en charge par Azure Virtual Desktop.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Windows 11 Enterprise multi-session on Arm64-based VM sizes", fr: "Windows 11 Entreprise multisession sur des tailles de machines virtuelles Arm64" }
    - id: b
      text: { en: "A 32-bit edition of Windows 10 Enterprise on x64-based VM sizes", fr: "Une édition 32 bits de Windows 10 Entreprise sur des tailles de machines virtuelles x64" }
    - id: c
      text: { en: "Windows 11 Enterprise multi-session on x64-based VM sizes", fr: "Windows 11 Entreprise multisession sur des tailles de machines virtuelles x64" }
    - id: d
      text: { en: "Windows 11 Enterprise LTSC 2024 on x64-based VM sizes", fr: "Windows 11 Entreprise LTSC 2024 sur des tailles de machines virtuelles x64" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Virtual Desktop supports only 64-bit session host operating systems on x64-based VMs. A 32-bit application runs on 64-bit Windows, so Windows 11 Enterprise multi-session on x64 sizes meets both the compatibility and the shared session host requirements.
    fr: |
      Azure Virtual Desktop ne prend en charge que des systèmes d'exploitation 64 bits pour les hôtes de session, sur des machines virtuelles x64. Une application 32 bits s'exécute sur Windows 64 bits : Windows 11 Entreprise multisession sur des tailles x64 répond donc aux exigences de compatibilité et de partage des hôtes de session.
  options:
    a: { en: "Arm64-based Azure VMs aren't supported for session hosts.", fr: "Les machines virtuelles Azure Arm64 ne sont pas prises en charge pour les hôtes de session." }
    b: { en: "32-bit operating systems aren't supported, and Windows 10 Enterprise allows only one session per VM.", fr: "Les systèmes d'exploitation 32 bits ne sont pas pris en charge, et Windows 10 Entreprise n'autorise qu'une session par machine virtuelle." }
    d: { en: "LTSC editions aren't supported for session hosts, and they're single-session.", fr: "Les éditions LTSC ne sont pas prises en charge pour les hôtes de session, et elles sont monosession." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
