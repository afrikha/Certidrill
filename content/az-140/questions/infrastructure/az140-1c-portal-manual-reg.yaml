id: az140-1c-portal-manual-reg
objective: "1.4.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool named HP1 that uses the standard management approach. A build pipeline created a VM named VM1 that runs Windows 11 Enterprise multi-session and is joined to the AD DS domain. VM1 can reach the required Azure Virtual Desktop URLs, and no registration key exists for HP1.

    You need to register VM1 as a session host of HP1.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop nommé HP1 qui utilise l'approche de gestion standard. Un pipeline de build a créé une machine virtuelle nommée VM1 qui exécute Windows 11 Entreprise multisession et qui est jointe au domaine AD DS. VM1 peut joindre les URL requises d'Azure Virtual Desktop, et il n'existe aucune clé d'inscription pour HP1.

    Vous devez inscrire VM1 comme hôte de session de HP1.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: key, text: { en: "In the Azure portal, open HP1 > **Registration key** and generate a new key.", fr: "Dans le portail Azure, ouvrir HP1 > **Registration key** et générer une nouvelle clé." } }
    - { id: agent, text: { en: "On VM1, run the Azure Virtual Desktop Agent installer and paste the registration key.", fr: "Sur VM1, exécuter le programme d'installation de l'agent Azure Virtual Desktop et coller la clé d'inscription." } }
    - { id: boot, text: { en: "On VM1, run the Azure Virtual Desktop Agent Bootloader installer.", fr: "Sur VM1, exécuter le programme d'installation du chargeur de démarrage de l'agent Azure Virtual Desktop." } }
    - { id: rdsh, text: { en: "On VM1, install the Remote Desktop Session Host role and restart.", fr: "Sur VM1, installer le rôle Hôte de session Bureau à distance et redémarrer." } }
    - { id: nsg, text: { en: "Allow inbound TCP 3389 to VM1 in its network security group.", fr: "Autoriser le trafic entrant TCP 3389 vers VM1 dans son groupe de sécurité réseau." } }
    - { id: add, text: { en: "In the Azure portal, open HP1 > **Session hosts** > **+ Add** and select VM1.", fr: "Dans le portail Azure, ouvrir HP1 > **Session hosts** > **+ Add** et sélectionner VM1." } }
answer:
  sequence: [ key, agent, boot ]
explanation:
  correct:
    en: |
      A VM created outside the service registers with a registration key generated for the host pool. You generate the key in the portal, install the Azure Virtual Desktop Agent and paste the key when prompted, then install the Agent Bootloader. The host appears in HP1, first as Unavailable, then as Available.
    fr: |
      Une machine virtuelle créée en dehors du service s'inscrit avec une clé d'inscription générée pour le pool d'hôtes. Vous générez la clé dans le portail, installez l'agent Azure Virtual Desktop en collant la clé quand elle est demandée, puis installez le chargeur de démarrage de l'agent. L'hôte apparaît dans HP1, d'abord Unavailable, puis Available.
  options:
    rdsh: { en: "The Remote Desktop Session Host role is required on Windows Server, not on Windows 11 Enterprise multi-session.", fr: "Le rôle Hôte de session Bureau à distance est exigé sur Windows Server, pas sur Windows 11 Entreprise multisession." }
    nsg: { en: "Session hosts need no inbound port: the agent connects outbound to the service.", fr: "Les hôtes de session n'ont besoin d'aucun port entrant : l'agent se connecte en sortie au service." }
    add: { en: "+ Add creates new VMs from the portal; it doesn't register an existing VM.", fr: "+ Add crée de nouvelles machines virtuelles depuis le portail ; il n'inscrit pas une machine virtuelle existante." }
references:
  - title: Add session hosts to a host pool
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/add-session-hosts-host-pool
