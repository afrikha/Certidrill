id: az140-1a-net-dns-dc
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Active Directory Domain Services (AD DS) domain named contoso.com. The domain controllers DC1 (10.0.0.4) and DC2 (10.0.0.5) run the DNS role and are in a virtual network named **VNet-Hub**.

    You create a virtual network named **VNet-AVD** that uses Azure-provided DNS, and you peer it with VNet-Hub. You deploy Azure Virtual Desktop session hosts in VNet-AVD and select to join them to contoso.com. The domain join fails because the domain can't be located.

    You need to ensure that new session hosts can join the domain.

    What should you do?
  fr: |
    Contoso dispose d'un domaine Active Directory Domain Services (AD DS) nommé contoso.com. Les contrôleurs de domaine DC1 (10.0.0.4) et DC2 (10.0.0.5) exécutent le rôle DNS et se trouvent dans un réseau virtuel nommé **VNet-Hub**.

    Vous créez un réseau virtuel nommé **VNet-AVD** qui utilise le DNS fourni par Azure, et vous établissez un peering avec VNet-Hub. Vous déployez des hôtes de session Azure Virtual Desktop dans VNet-AVD en choisissant de les joindre à contoso.com. La jonction au domaine échoue, car le domaine est introuvable.

    Vous devez faire en sorte que les nouveaux hôtes de session puissent joindre le domaine.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable gateway transit on the peering between VNet-AVD and VNet-Hub.", fr: "Activer le transit par passerelle sur le peering entre VNet-AVD et VNet-Hub." }
    - id: b
      text: { en: "Create a private DNS zone named contoso.com and link it to VNet-AVD.", fr: "Créer une zone DNS privée nommée contoso.com et la lier à VNet-AVD." }
    - id: c
      text: { en: "Set the DNS servers of VNet-AVD to 10.0.0.4 and 10.0.0.5.", fr: "Définir les serveurs DNS de VNet-AVD sur 10.0.0.4 et 10.0.0.5." }
    - id: d
      text: { en: "Add an inbound NSG rule that allows TCP 389 from VNet-Hub.", fr: "Ajouter une règle NSG entrante qui autorise TCP 389 depuis VNet-Hub." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      To join AD DS, session hosts must resolve the domain's DNS records (including the SRV records that locate domain controllers). Azure-provided DNS doesn't know contoso.com, so you set the custom DNS servers of VNet-AVD to the domain controllers, which the peering makes reachable. Session hosts deployed afterwards use these servers.
    fr: |
      Pour joindre AD DS, les hôtes de session doivent résoudre les enregistrements DNS du domaine (dont les enregistrements SRV qui localisent les contrôleurs de domaine). Le DNS fourni par Azure ne connaît pas contoso.com : vous définissez donc les serveurs DNS personnalisés de VNet-AVD sur les contrôleurs de domaine, joignables grâce au peering. Les hôtes de session déployés ensuite utilisent ces serveurs.
  options:
    a: { en: "Gateway transit shares a VPN or ExpressRoute gateway; it doesn't change name resolution.", fr: "Le transit par passerelle partage une passerelle VPN ou ExpressRoute ; il ne modifie pas la résolution de noms." }
    b: { en: "A private DNS zone wouldn't contain the AD DS records that domain controllers register in their own DNS.", fr: "Une zone DNS privée ne contiendrait pas les enregistrements AD DS que les contrôleurs de domaine inscrivent dans leur propre DNS." }
    d: { en: "The failure is name resolution, not a blocked port, and an inbound rule on the session hosts wouldn't help them reach the domain controllers.", fr: "L'échec vient de la résolution de noms, pas d'un port bloqué, et une règle entrante sur les hôtes de session ne les aiderait pas à joindre les contrôleurs de domaine." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
