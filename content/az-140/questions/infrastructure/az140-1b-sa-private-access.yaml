id: az140-1b-sa-private-access
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop host pool whose session hosts are connected to a virtual network named **VNet-AVD**. FSLogix profile containers will be stored in an Azure file share in a storage account named **stavdprof07**.

    You need to meet the following requirements:

    - Session hosts must reach the file share by using a private IP address from VNet-AVD.
    - The file share must not be reachable from the internet.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop dont les hôtes de session sont connectés à un réseau virtuel nommé **VNet-AVD**. Les conteneurs de profils FSLogix seront stockés dans un partage de fichiers Azure d'un compte de stockage nommé **stavdprof07**.

    Vous devez répondre aux exigences suivantes :

    - Les hôtes de session doivent joindre le partage de fichiers à l'aide d'une adresse IP privée de VNet-AVD.
    - Le partage de fichiers ne doit pas être accessible depuis Internet.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a private endpoint for stavdprof07 with the blob target subresource in VNet-AVD.", fr: "Créer un point de terminaison privé pour stavdprof07 avec la sous-ressource cible blob dans VNet-AVD." } }
    - { id: b, text: { en: "Enable a Microsoft.Storage service endpoint on the session host subnet.", fr: "Activer un point de terminaison de service Microsoft.Storage sur le sous-réseau des hôtes de session." } }
    - { id: c, text: { en: "Set Public network access to Disabled on stavdprof07.", fr: "Définir l'accès réseau public sur Désactivé pour stavdprof07." } }
    - { id: d, text: { en: "Create a private endpoint for stavdprof07 with the file target subresource in VNet-AVD.", fr: "Créer un point de terminaison privé pour stavdprof07 avec la sous-ressource cible file dans VNet-AVD." } }
    - { id: e, text: { en: "Enable SMB Multichannel on stavdprof07.", fr: "Activer SMB Multichannel sur stavdprof07." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      A private endpoint for the file subresource gives the storage account a private IP address in VNet-AVD; with the privatelink.file.core.windows.net private DNS zone, the share's name resolves to that address. Disabling public network access then blocks every connection that doesn't arrive through a private endpoint, including from the internet.
    fr: |
      Un point de terminaison privé pour la sous-ressource file donne au compte de stockage une adresse IP privée dans VNet-AVD ; avec la zone DNS privée privatelink.file.core.windows.net, le nom du partage est résolu vers cette adresse. La désactivation de l'accès réseau public bloque ensuite toute connexion qui n'arrive pas par un point de terminaison privé, y compris depuis Internet.
  options:
    a: { en: "The blob subresource serves Blob Storage; SMB traffic to file shares needs the file subresource.", fr: "La sous-ressource blob sert le Stockage Blob ; le trafic SMB vers les partages de fichiers exige la sous-ressource file." }
    b: { en: "A service endpoint keeps the traffic on the Azure backbone but still targets the storage account's public IP address.", fr: "Un point de terminaison de service maintient le trafic sur le réseau principal Azure, mais cible toujours l'adresse IP publique du compte de stockage." }
    e: { en: "SMB Multichannel improves throughput for SSD shares; it doesn't change network exposure.", fr: "SMB Multichannel améliore le débit des partages SSD ; il ne change pas l'exposition réseau." }
references:
  - title: Configure network endpoints for accessing Azure file shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-networking-endpoints
