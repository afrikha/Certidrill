id: az140-1d-lic-contractor-guests
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant named contoso.com and an Azure Virtual Desktop pooled host pool whose session hosts run Windows 11 Enterprise multi-session.

    Forty consultants from Fabrikam work on Contoso projects. They sign in to Azure Virtual Desktop with guest (B2B) accounts in contoso.com. Fabrikam assigns each consultant a Microsoft 365 E3 license in the fabrikam.com tenant.

    You need to ensure that the consultants are correctly licensed to use the host pool.

    What should you do?
  fr: |
    Contoso dispose d'un locataire Microsoft Entra nommé contoso.com et d'un pool d'hôtes regroupé Azure Virtual Desktop dont les hôtes de session exécutent Windows 11 Entreprise multisession.

    Quarante consultants de Fabrikam travaillent sur des projets de Contoso. Ils se connectent à Azure Virtual Desktop avec des comptes invités (B2B) de contoso.com. Fabrikam attribue à chaque consultant une licence Microsoft 365 E3 dans le locataire fabrikam.com.

    Vous devez vous assurer que les consultants disposent des licences requises pour utiliser le pool d'hôtes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enroll the Contoso subscription in per-user access pricing.", fr: "Inscrire l'abonnement de Contoso à la tarification de l'accès par utilisateur." } }
    - { id: b, text: { en: "Buy an RDS CAL with Software Assurance for each consultant.", fr: "Acheter une CAL RDS avec Software Assurance pour chaque consultant." } }
    - { id: c, text: { en: "Do nothing, because the licenses in fabrikam.com cover the consultants.", fr: "Ne rien faire, car les licences de fabrikam.com couvrent les consultants." } }
    - { id: d, text: { en: "Assign a Microsoft 365 E3 license to each guest account in contoso.com.", fr: "Attribuer une licence Microsoft 365 E3 à chaque compte invité dans contoso.com." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Consultants who work for Contoso's own purposes are internal users and need an eligible license. Licenses held in a collaborator's home tenant generally don't apply in your tenant, so Microsoft recommends buying the same license as for your employees and assigning it to the collaborator's identity in your Microsoft Entra tenant.
    fr: |
      Des consultants qui travaillent pour les besoins propres de Contoso sont des utilisateurs internes et ont besoin d'une licence éligible. Les licences détenues dans le locataire d'origine d'un collaborateur ne s'appliquent généralement pas dans votre locataire : Microsoft recommande d'acheter la même licence que pour vos employés et de l'attribuer à l'identité du collaborateur dans votre locataire Microsoft Entra.
  options:
    a:
      en: Per-user access pricing is only for external users such as customers of a commercial app; it can't be used for contractors or as a way to license guest accounts.
      fr: La tarification de l'accès par utilisateur est réservée aux utilisateurs externes, comme les clients d'une application commerciale ; elle ne peut pas servir pour des sous-traitants ni pour attribuer des licences à des comptes invités.
    c:
      en: Licenses in one tenant don't carry over to another tenant, so the fabrikam.com licenses don't cover access to Contoso resources.
      fr: |
        Les licences d'un locataire ne s'appliquent pas à un autre locataire : les licences de fabrikam.com ne couvrent pas l'accès aux ressources de Contoso.
    b:
      en: RDS CALs license Windows Server session hosts, not Windows 11 Enterprise multi-session.
      fr: Les CAL RDS concernent les hôtes de session Windows Server, pas Windows 11 Entreprise multisession.
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
