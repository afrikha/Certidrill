id: az140-cs2c-licensing
objective: "1.3.3"
type: yesno_statements
caseStudy: az140-cs2c-humongous
difficulty: 2
status: draft
stem:
  en: |
    You plan to publish QuoteNow to the brokers as a RemoteApp from a new host pool named **HP-Quote** that runs Windows 11 Enterprise multi-session. You need to recommend a licensing model that meets the broker billing and compliance requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de publier QuoteNow pour les courtiers en tant que RemoteApp à partir d'un nouveau pool d'hôtes nommé **HP-Quote** qui exécute Windows 11 Enterprise multi-session. Vous devez recommander un modèle de licence qui respecte les exigences de facturation des courtiers et de conformité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Microsoft 365 E3 licenses of the claims agents cover their access to the rating engine published from HP-Legacy.
        fr: Les licences Microsoft 365 E3 des gestionnaires de sinistres couvrent leur accès au moteur de tarification publié depuis HP-Legacy.
    - id: s2
      text:
        en: If Sub-Internal is enrolled in per-user access pricing, the claims agents who connect to HP-Claims generate per-user access charges even though they have Microsoft 365 E3 licenses.
        fr: Si Sub-Internal est inscrit à la tarification de l'accès par utilisateur, les gestionnaires de sinistres qui se connectent à HP-Claims génèrent des frais d'accès par utilisateur, même s'ils disposent de licences Microsoft 365 E3.
    - id: s3
      text:
        en: If HP-Quote is deployed in Sub-Brokers and Sub-Brokers is enrolled in per-user access pricing, a broker who connects only to the QuoteNow RemoteApp in a month is charged at the apps price tier.
        fr: Si HP-Quote est déployé dans Sub-Brokers et que Sub-Brokers est inscrit à la tarification de l'accès par utilisateur, un courtier qui se connecte uniquement à la RemoteApp QuoteNow au cours d'un mois est facturé au niveau tarifaire des applications.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Windows Server session hosts require RDS CALs with Software Assurance or RDS User Subscription Licenses; Microsoft 365 E3 only covers Windows client operating systems. Per-user access pricing applies to every user who connects through an enrolled subscription, including users who already have an eligible license, so internal host pools must stay in a subscription that is not enrolled. A user who accesses at least one RemoteApp but no full desktop is billed at the apps tier.
    fr: |
      Les hôtes de session Windows Server nécessitent des CAL RDS avec Software Assurance ou des licences d'abonnement utilisateur RDS ; Microsoft 365 E3 ne couvre que les systèmes d'exploitation clients Windows. La tarification de l'accès par utilisateur s'applique à chaque utilisateur qui se connecte par un abonnement inscrit, y compris ceux qui disposent déjà d'une licence éligible : les pools d'hôtes internes doivent donc rester dans un abonnement non inscrit. Un utilisateur qui accède à au moins une RemoteApp mais à aucun bureau complet est facturé au niveau des applications.
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
