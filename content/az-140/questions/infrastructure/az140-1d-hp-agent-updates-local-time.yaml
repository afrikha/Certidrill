id: az140-1d-hp-agent-updates-local-time
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP-Global**. The Windows time zone of each session host matches the office that it serves: some session hosts use W. Europe Standard Time and the others use Singapore Standard Time.

    You need to ensure that the Azure Virtual Desktop agent components are updated only at 02:00 on Sundays in the time zone of each session host. The solution must use a single configuration for the host pool.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Global**. Le fuseau horaire Windows de chaque hôte de session correspond au bureau qu'il dessert : certains hôtes de session utilisent W. Europe Standard Time et les autres Singapore Standard Time.

    Vous devez vous assurer que les composants de l'agent Azure Virtual Desktop ne sont mis à jour que le dimanche à 2 h dans le fuseau horaire de chaque hôte de session. La solution doit utiliser une configuration unique pour le pool d'hôtes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable scheduled agent updates with two maintenance windows in UTC, one for each region.", fr: "Activer les mises à jour planifiées de l'agent avec deux fenêtres de maintenance en UTC, une par région." } }
    - { id: b, text: { en: "Enable scheduled agent updates and select Use session host local time.", fr: "Activer les mises à jour planifiées de l'agent et sélectionner Use session host local time." } }
    - { id: c, text: { en: "Add the time zone redirection RDP property to the host pool.", fr: "Ajouter la propriété RDP de redirection du fuseau horaire au pool d'hôtes." } }
    - { id: d, text: { en: "Configure HP-Global as a validation environment.", fr: "Configurer HP-Global comme environnement de validation." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Scheduled agent updates apply one schedule to every session host of the host pool. With **Use session host local time**, each session host installs the update during the maintenance window in its own time zone, so a single 02:00 window covers both offices. The session hosts must be running during the window.
    fr: |
      Les mises à jour planifiées de l'agent appliquent une même planification à tous les hôtes de session du pool d'hôtes. Avec **Use session host local time**, chaque hôte de session installe la mise à jour pendant la fenêtre de maintenance dans son propre fuseau horaire : une seule fenêtre à 2 h couvre donc les deux bureaux. Les hôtes de session doivent être démarrés pendant la fenêtre.
  options:
    a:
      en: Both windows apply to every session host of the pool (the second one is a retry window), so all hosts would update at the same UTC time instead of at their local 02:00.
      fr: |
        Les deux fenêtres s'appliquent à tous les hôtes de session du pool (la seconde sert de nouvelle tentative) : tous les hôtes seraient mis à jour à la même heure UTC, et non à 2 h heure locale.
    c:
      en: Time zone redirection shows the client's time zone inside the user session; it has no effect on agent updates.
      fr: La redirection du fuseau horaire affiche le fuseau horaire du client dans la session utilisateur ; elle n'a aucun effet sur les mises à jour de l'agent.
    d:
      en: A validation environment receives service updates earlier; it doesn't control when they install.
      fr: Un environnement de validation reçoit les mises à jour du service plus tôt ; il ne contrôle pas le moment de leur installation.
references:
  - title: Scheduled Agent Updates for Azure Virtual Desktop host pools
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/scheduled-agent-updates
