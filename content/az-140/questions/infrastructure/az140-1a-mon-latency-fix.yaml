id: az140-1a-mon-latency-fix
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Users in the Singapore office of Litware connect to an Azure Virtual Desktop host pool named **HP1** whose session hosts are in the West Europe region. Users report input delays. You discover the following:

    - Connection Performance in Azure Virtual Desktop Insights shows a median round-trip time of 240 ms for these users.
    - The Singapore office sends all its internet traffic through a cloud packet-inspection service before it reaches the internet.
    - The average CPU usage of the session hosts is below 30 %.

    Which two actions would reduce the round-trip time of these users? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les utilisateurs du bureau de Singapour de Litware se connectent à un pool d'hôtes Azure Virtual Desktop nommé **HP1** dont les hôtes de session se trouvent dans la région West Europe. Les utilisateurs signalent des délais de saisie. Vous constatez ce qui suit :

    - Connection Performance dans Azure Virtual Desktop Insights affiche une durée aller-retour médiane de 240 ms pour ces utilisateurs.
    - Le bureau de Singapour fait passer tout son trafic Internet par un service cloud d'inspection des paquets avant qu'il atteigne Internet.
    - L'utilisation moyenne du processeur des hôtes de session est inférieure à 30 %.

    Quelles sont les deux actions qui réduiraient la durée aller-retour de ces utilisateurs ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy a host pool for these users with session hosts in the Southeast Asia region.", fr: "Déployer pour ces utilisateurs un pool d'hôtes dont les hôtes de session se trouvent dans la région Southeast Asia." } }
    - { id: b, text: { en: "Resize the session hosts of HP1 to a VM size with twice as many vCPUs.", fr: "Redimensionner les hôtes de session de HP1 vers une taille de machine virtuelle qui a deux fois plus de processeurs virtuels." } }
    - { id: c, text: { en: "Send the Azure Virtual Desktop traffic of the office directly to the internet, bypassing the inspection service.", fr: "Envoyer le trafic Azure Virtual Desktop du bureau directement vers Internet, sans passer par le service d'inspection." } }
    - { id: d, text: { en: "Enable the H.264/AVC 444 graphics mode for the sessions of HP1.", fr: "Activer le mode graphique H.264/AVC 444 pour les sessions de HP1." } }
    - { id: e, text: { en: "Create a Policy-based QoS policy on the session hosts that sets DSCP 46 on TCP port 443.", fr: "Créer sur les hôtes de session une stratégie Policy-based QoS qui applique DSCP 46 au port TCP 443." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Round-trip time grows with distance and with the number of hops between the client and the session host. Placing session hosts in a region close to the users shortens the path, and Microsoft recommends avoiding cloud packet-inspection services and other obstacles such as proxies on the path of RDP traffic.
    fr: |
      La durée aller-retour augmente avec la distance et avec le nombre de sauts entre le client et l'hôte de session. Placer les hôtes de session dans une région proche des utilisateurs raccourcit le chemin, et Microsoft recommande d'éviter les services cloud d'inspection des paquets et d'autres obstacles comme les proxys sur le chemin du trafic RDP.
  options:
    b: { en: "The session hosts aren't overloaded; more vCPUs don't shorten the network path.", fr: "Les hôtes de session ne sont pas surchargés ; plus de processeurs virtuels ne raccourcissent pas le chemin réseau." }
    d: { en: "The graphics mode changes the bandwidth used, not the network latency.", fr: "Le mode graphique modifie la bande passante utilisée, pas la latence réseau." }
    e: { en: "QoS policies aren't supported for the reverse connect transport, and they apply only on links you manage, not on the internet.", fr: "Les stratégies QoS ne sont pas prises en charge pour le transport reverse connect, et elles ne s'appliquent que sur les liaisons que vous gérez, pas sur Internet." }
references:
  - title: Use cases for Azure Virtual Desktop Insights
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-use-cases
  - title: RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
