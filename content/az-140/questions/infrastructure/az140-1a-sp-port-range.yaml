id: az140-1a-sp-port-range
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Users of Litware connect to an Azure Virtual Desktop host pool named **HP1** from branch offices over the internet. The branch office firewalls allow outbound UDP only to ports 40000 to 40999 for RDP traffic.

    You need RDP Shortpath for public networks to use only this port range. You configure the **Use port range for RDP Shortpath for unmanaged networks** policy setting.

    Which values should you set? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les utilisateurs de Litware se connectent à un pool d'hôtes Azure Virtual Desktop nommé **HP1** depuis des agences, par Internet. Les pare-feu des agences n'autorisent l'UDP sortant que vers les ports 40000 à 40999 pour le trafic RDP.

    Vous devez faire en sorte que RDP Shortpath pour les réseaux publics n'utilise que cette plage de ports. Vous configurez le paramètre de stratégie **Use port range for RDP Shortpath for unmanaged networks**.

    Quelles valeurs devez-vous définir ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      UDP base port: [[base]]

      Port pool size: [[pool]]
    fr: |
      Port UDP de base : [[base]]

      Taille du pool de ports : [[pool]]
  slots:
    - id: base
      options:
        - { id: p3390, text: "3390" }
        - { id: p38300, text: "38300" }
        - { id: p40000, text: "40000" }
        - { id: p49152, text: "49152" }
    - id: pool
      options:
        - { id: s999, text: "999" }
        - { id: s1000, text: "1000" }
        - { id: s16384, text: "16384" }
answer:
  values: { base: p40000, pool: s1000 }
explanation:
  correct:
    en: |
      The setting defines a base port and a pool size, which must stay inside 1024–49151; its defaults are 38300 and 1000 (ports 38300 to 39299). A base port of 40000 with a pool of 1000 ports gives exactly 40000 to 40999. Without the setting, RDP Shortpath for public networks uses the ephemeral range 49152–65535.
    fr: |
      Le paramètre définit un port de base et une taille de pool, qui doivent rester dans la plage 1024–49151 ; ses valeurs par défaut sont 38300 et 1000 (ports 38300 à 39299). Un port de base 40000 avec un pool de 1000 ports donne exactement 40000 à 40999. Sans ce paramètre, RDP Shortpath pour les réseaux publics utilise la plage éphémère 49152–65535.
  options:
    p38300: { en: "38300 is the default base port; with a pool of 1000 it gives 38300–39299.", fr: "38300 est le port de base par défaut ; avec un pool de 1000, il donne 38300–39299." }
    p49152: { en: "49152 is the start of the default ephemeral range and is outside the allowed 1024–49151 range for a custom range.", fr: "49152 est le début de la plage éphémère par défaut et se trouve hors de la plage 1024–49151 autorisée pour une plage personnalisée." }
    s999: { en: "A pool of 999 ports would stop at 40998.", fr: "Un pool de 999 ports s'arrêterait à 40998." }
references:
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
