id: az140-1c-hp-appgroup-rules
objective: "1.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named HP1 whose preferred app group type is **Desktop**. HP1 has the following application groups:

    | Name | Type | Registered in workspace |
    | --- | --- | --- |
    | HP1-DAG | Desktop | WS-EU |
    | HP1-Apps | RemoteApp | WS-EU |

    You also have a second workspace named WS-US.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop regroupé nommé HP1 dont le type de groupe d'applications préféré est **Desktop**. HP1 contient les groupes d'applications suivants :

    | Nom | Type | Inscrit dans l'espace de travail |
    | --- | --- | --- |
    | HP1-DAG | Desktop | WS-EU |
    | HP1-Apps | RemoteApp | WS-EU |

    Vous disposez aussi d'un second espace de travail nommé WS-US.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can add a second desktop application group to HP1 for another department.
        fr: |
          Vous pouvez ajouter à HP1 un second groupe d'applications de bureau pour un autre service.
    - id: s2
      text:
        en: |
          You can register HP1-Apps in WS-US while it stays registered in WS-EU.
        fr: |
          Vous pouvez inscrire HP1-Apps dans WS-US tout en le laissant inscrit dans WS-EU.
    - id: s3
      text:
        en: |
          A user who is assigned to both HP1-DAG and HP1-Apps sees only the desktop of HP1 in their feed.
        fr: |
          Un utilisateur attribué à la fois à HP1-DAG et à HP1-Apps ne voit que le bureau de HP1 dans son flux.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      A host pool can have only one desktop application group, but several RemoteApp application groups. An application group can be assigned to only one workspace. When a user is assigned both a desktop and a RemoteApp application group on the same host pool, they see only the resources of the preferred application group type, here Desktop.
    fr: |
      Un pool d'hôtes ne peut avoir qu'un seul groupe d'applications de bureau, mais plusieurs groupes d'applications RemoteApp. Un groupe d'applications ne peut être attribué qu'à un seul espace de travail. Quand un utilisateur reçoit à la fois un groupe d'applications de bureau et un groupe RemoteApp sur le même pool d'hôtes, il ne voit que les ressources du type de groupe d'applications préféré, ici Desktop.
references:
  - title: Azure Virtual Desktop terminology
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/terminology
