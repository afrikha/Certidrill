id: az140-sr1-profile-auth-2
objective: "1.2.3"
type: series_yesno
series: az140-sr1-profile-auth
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You deploy Microsoft Entra Domain Services and use it for litwareprof1.
  fr: Vous déployez Microsoft Entra Domain Services et l'utilisez pour litwareprof1.
body:
  solution:
    en: |
      You deploy a Microsoft Entra Domain Services managed domain connected to VNet1, enable Microsoft Entra Domain Services authentication on litwareprof1, and assign share-level permissions on the profiles share to the users.
    fr: |
      Vous déployez un domaine managé Microsoft Entra Domain Services connecté à VNet1, vous activez l'authentification Microsoft Entra Domain Services sur litwareprof1 et vous attribuez aux utilisateurs des autorisations au niveau du partage sur profiles.
answer: { value: false }
explanation:
  correct:
    en: |
      Kerberos authentication with Microsoft Entra Domain Services requires the clients to be joined to the managed domain. The session hosts of HP1 are Microsoft Entra joined, not joined to the managed domain, so FSLogix can't mount the containers with the users' identity.
    fr: |
      L'authentification Kerberos avec Microsoft Entra Domain Services exige que les clients soient joints au domaine managé. Les hôtes de session de HP1 sont joints à Microsoft Entra, et non au domaine managé : FSLogix ne peut donc pas monter les conteneurs avec l'identité des utilisateurs.
references:
  - title: Overview of Azure Files identity-based authentication for SMB access
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview
