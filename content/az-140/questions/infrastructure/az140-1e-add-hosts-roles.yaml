id: az140-1e-add-hosts-roles
objective: "1.5.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a resource group named **RG-AVD** that contains an Azure Virtual Desktop host pool named **HP1**, the virtual network used by its session hosts, and an Azure Compute Gallery named **galAvd**. A user named **Admin1** already has the Reader role on galAvd.

    Admin1 must use the Azure portal to generate a registration key and add session hosts to HP1 from an image in galAvd. The solution must follow the principle of least privilege.

    Which two roles should you assign to Admin1 on RG-AVD? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un groupe de ressources nommé **RG-AVD** qui contient un pool d'hôtes Azure Virtual Desktop nommé **HP1**, le réseau virtuel utilisé par ses hôtes de session et une galerie Azure Compute Gallery nommée **galAvd**. Un utilisateur nommé **Admin1** a déjà le rôle Reader sur galAvd.

    Admin1 doit utiliser le portail Azure pour générer une clé d'inscription et ajouter à HP1 des hôtes de session à partir d'une image de galAvd. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles à attribuer à Admin1 sur RG-AVD ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Desktop Virtualization Session Host Operator }
    - { id: b, text: Desktop Virtualization Host Pool Contributor }
    - { id: c, text: Desktop Virtualization Power On Off Contributor }
    - { id: d, text: Virtual Machine Contributor }
    - { id: e, text: Desktop Virtualization Workspace Contributor }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: To create and add session hosts in the Azure portal, Microsoft lists two roles on the resource group, Desktop Virtualization Host Pool Contributor and Virtual Machine Contributor. Desktop Virtualization Host Pool Contributor also covers generating the registration key, and Virtual Machine Contributor lets Admin1 create the VMs and connect them to the virtual network.
    fr: "Pour créer et ajouter des hôtes de session dans le portail Azure, Microsoft indique deux rôles sur le groupe de ressources : Desktop Virtualization Host Pool Contributor et Virtual Machine Contributor. Desktop Virtualization Host Pool Contributor couvre aussi la génération de la clé d'inscription, et Virtual Machine Contributor permet à Admin1 de créer les machines virtuelles et de les connecter au réseau virtuel."
  options:
    a: { en: "Desktop Virtualization Session Host Operator views and removes session hosts and changes drain mode; it can't add session hosts in the portal because it has no write permission on host pools.", fr: "Desktop Virtualization Session Host Operator affiche et supprime des hôtes de session et change le mode drainage ; il ne peut pas ajouter d'hôtes de session dans le portail, car il n'a pas l'autorisation d'écriture sur les pools d'hôtes." }
    c: { en: "Desktop Virtualization Power On Off Contributor lets the Azure Virtual Desktop resource provider start and stop VMs, for example for autoscale.", fr: "Desktop Virtualization Power On Off Contributor permet au fournisseur de ressources Azure Virtual Desktop de démarrer et d'arrêter les machines virtuelles, par exemple pour la mise à l'échelle automatique." }
    e: { en: "Desktop Virtualization Workspace Contributor manages workspaces, not host pools or VMs.", fr: "Desktop Virtualization Workspace Contributor gère les espaces de travail, pas les pools d'hôtes ni les machines virtuelles." }
references:
  - title: Add session hosts to a host pool
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/add-session-hosts-host-pool
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
