id: az140-1d-hp-properties-hotarea
objective: "1.4.3"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP-Pilot** that is used by a pilot group of 30 users. HP-Pilot contains six session hosts. The other host pools in the environment are used for production.

    The **Properties** page of HP-Pilot shows the settings in the following table.

    You need to meet the following requirements:

    - New user sessions must be concentrated on as few session hosts as possible so that idle session hosts can be shut down.
    - HP-Pilot must receive Azure Virtual Desktop service updates before the production host pools.

    Which setting should you change for each requirement? To answer, select the appropriate setting in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Pilot**, utilisé par un groupe pilote de 30 utilisateurs. HP-Pilot contient six hôtes de session. Les autres pools d'hôtes de l'environnement sont utilisés en production.

    La page **Properties** de HP-Pilot affiche les paramètres du tableau suivant.

    Vous devez respecter les exigences suivantes :

    - Les nouvelles sessions utilisateur doivent être concentrées sur le moins d'hôtes de session possible, afin de pouvoir arrêter les hôtes de session inactifs.
    - HP-Pilot doit recevoir les mises à jour du service Azure Virtual Desktop avant les pools d'hôtes de production.

    Quel paramètre devez-vous modifier pour chaque exigence ? Pour répondre, sélectionnez le paramètre approprié dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Concentrate new sessions on as few session hosts as possible", fr: "Concentrer les nouvelles sessions sur le moins d'hôtes de session possible" }
    - id: p2
      text: { en: "Receive service updates before the production host pools", fr: "Recevoir les mises à jour du service avant les pools d'hôtes de production" }
  grid:
    caption: { en: "HP-Pilot > Properties", fr: "HP-Pilot > Properties" }
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Current value", fr: "Valeur actuelle" }]
    rows:
      - [{ text: Load balancing algorithm, area: lb }, { text: Breadth-first }]
      - [{ text: Max session limit, area: max }, { text: "12" }]
      - [{ text: Validation environment, area: val }, { text: "No" }]
      - [{ text: Start VM on connect, area: svm }, { text: "No" }]
      - [{ text: Preferred app group type, area: pag }, { text: Desktop }]
answer:
  values: { p1: lb, p2: val }
explanation:
  correct:
    en: |
      Depth-first load balancing sends each new session to the available session host that has the most sessions under the max session limit, so hosts fill one at a time and idle hosts can be shut down; the limit (12) is already set, as depth-first requires. Setting Validation environment to Yes makes HP-Pilot a validation host pool, which receives service updates before standard host pools.
    fr: |
      L'équilibrage de charge depth-first envoie chaque nouvelle session vers l'hôte de session disponible qui a le plus de sessions sous la limite maximale de sessions : les hôtes se remplissent un par un et les hôtes inactifs peuvent être arrêtés ; la limite (12) est déjà définie, comme l'exige depth-first. Définir Validation environment sur Yes fait de HP-Pilot un pool d'hôtes de validation, qui reçoit les mises à jour du service avant les pools d'hôtes standard.
  options:
    max:
      en: The limit is already set; changing it alone keeps the breadth-first spread across hosts.
      fr: La limite est déjà définie ; la modifier seule conserve la répartition breadth-first entre les hôtes.
    svm:
      en: Start VM on Connect powers on a deallocated host when a user connects; it doesn't decide how sessions are distributed or when service updates arrive.
      fr: Start VM on Connect démarre un hôte libéré quand un utilisateur se connecte ; il ne décide ni de la répartition des sessions ni du moment où arrivent les mises à jour du service.
    pag:
      en: The preferred application group type only decides whether users assigned to both group types see the desktop or the RemoteApp applications.
      fr: Le type de groupe d'applications préféré décide seulement si les utilisateurs affectés aux deux types de groupes voient le bureau ou les applications RemoteApp.
references:
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-load-balancing
  - title: Configure a host pool as a validation environment
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-validation-environment
