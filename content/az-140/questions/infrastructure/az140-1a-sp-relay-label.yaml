id: az140-1a-sp-relay-label
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user of Tailspin Toys connects from a hotel network to a desktop in an Azure Virtual Desktop host pool named **HP1** by using Windows App. All the RDP Shortpath options of HP1 have their default values.

    In the connection bar, the user opens **Connection Information**, which shows the transport **UDP (Relay)**.

    Which path does the session use?
  fr: |
    Un utilisateur de Tailspin Toys se connecte depuis le réseau d'un hôtel à un bureau d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** avec Windows App. Toutes les options RDP Shortpath de HP1 ont leur valeur par défaut.

    Dans la barre de connexion, l'utilisateur ouvre **Connection Information**, qui affiche le transport **UDP (Relay)**.

    Quel chemin la session utilise-t-elle ?
body:
  options:
    - id: a
      text: { en: "Direct UDP to the RDP Shortpath listener of the session host", fr: "UDP direct vers l'écouteur RDP Shortpath de l'hôte de session" }
    - id: b
      text: { en: "Direct UDP between client and session host found by using STUN", fr: "UDP direct entre le client et l'hôte de session trouvé grâce à STUN" }
    - id: c
      text: { en: "TCP reverse connect relayed by an Azure Virtual Desktop gateway", fr: "TCP reverse connect relayé par une passerelle Azure Virtual Desktop" }
    - id: d
      text: { en: "UDP relayed between client and session host by a TURN server", fr: "UDP relayé entre le client et l'hôte de session par un serveur TURN" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Connection Information shows **UDP (Relay)** when RDP Shortpath for public networks uses a TURN relay, typically because a symmetric NAT prevents a direct path. **UDP** alone means a direct STUN path, and **UDP (Private Network)** means a direct connection to the managed-network listener.
    fr: |
      Connection Information affiche **UDP (Relay)** quand RDP Shortpath pour les réseaux publics utilise un relais TURN, généralement parce qu'un NAT symétrique empêche un chemin direct. **UDP** seul indique un chemin STUN direct, et **UDP (Private Network)** une connexion directe à l'écouteur des réseaux managés.
  options:
    a: { en: "A direct connection to the managed-network listener is shown as UDP (Private Network).", fr: "Une connexion directe à l'écouteur des réseaux managés s'affiche comme UDP (Private Network)." }
    b: { en: "A direct STUN path is shown as UDP, without Relay.", fr: "Un chemin STUN direct s'affiche comme UDP, sans Relay." }
    c: { en: "The transport is UDP, so the session isn't on the TCP reverse connect transport.", fr: "Le transport est UDP : la session n'est pas sur le transport TCP reverse connect." }
references:
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
