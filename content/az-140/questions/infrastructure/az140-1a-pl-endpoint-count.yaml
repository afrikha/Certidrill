id: az140-1a-pl-endpoint-count
objective: "1.1.4"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank has the following Azure Virtual Desktop resources in one subscription:

    - three host pools named **HP1**, **HP2** and **HP3**;
    - two workspaces named **WS-Sales** and **WS-Ops**, which contain the application groups.

    You need to make initial feed discovery, feed download and connections to the host pools private. You will create a new placeholder workspace that contains no application group for the initial feed discovery.

    How many private endpoints should you create in total?
  fr: |
    Woodgrove Bank dispose des ressources Azure Virtual Desktop suivantes dans un abonnement :

    - trois pools d'hôtes nommés **HP1**, **HP2** et **HP3** ;
    - deux espaces de travail nommés **WS-Sales** et **WS-Ops**, qui contiennent les groupes d'applications.

    Vous devez rendre privés la découverte initiale du flux, le téléchargement du flux et les connexions aux pools d'hôtes. Vous créerez pour la découverte initiale du flux un nouvel espace de travail réservé qui ne contient aucun groupe d'applications.

    Combien de points de terminaison privés devez-vous créer au total ?
body:
  options:
    - { id: a, text: "3" }
    - { id: b, text: "5" }
    - { id: c, text: "6" }
    - { id: d, text: "9" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      You need one `connection` endpoint per host pool (3), one `feed` endpoint per workspace that users get their feed from (2), and a single `global` endpoint for all Azure Virtual Desktop deployments, on the dedicated placeholder workspace (1): 6 private endpoints.
    fr: |
      Il faut un point de terminaison `connection` par pool d'hôtes (3), un point de terminaison `feed` par espace de travail dont les utilisateurs obtiennent leur flux (2), et un seul point de terminaison `global` pour tous les déploiements Azure Virtual Desktop, sur l'espace de travail réservé dédié (1) : 6 points de terminaison privés.
  options:
    a: { en: "3 covers only the connections to the host pools.", fr: "3 ne couvre que les connexions aux pools d'hôtes." }
    b: { en: "5 forgets the global endpoint required for private initial feed discovery.", fr: "5 oublie le point de terminaison global nécessaire à une découverte initiale du flux privée." }
    d: { en: "9 adds a global endpoint per workspace and per host pool; only one global endpoint exists for all deployments.", fr: "9 ajoute un point de terminaison global par espace de travail et par pool d'hôtes ; il n'existe qu'un point de terminaison global pour tous les déploiements." }
references:
  - title: Set up Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-setup
