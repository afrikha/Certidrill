id: az140-cs3b-licensing
objective: "1.3.3"
type: single
caseStudy: az140-cs3b-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the licensing requirement for the travel agency users. What should you do?
  fr: |
    Vous devez satisfaire l'exigence de licence pour les utilisateurs des agences de voyages. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enroll Sub-Resorts and Sub-Partners in per-user access pricing.", fr: "Inscrire Sub-Resorts et Sub-Partners à la tarification de l'accès par utilisateur." } }
    - { id: b, text: { en: "Purchase RDS CALs with Software Assurance for the travel agency users.", fr: "Acheter des licences d'accès client RDS (CAL) avec Software Assurance pour les utilisateurs des agences." } }
    - { id: c, text: { en: "Enroll only Sub-Partners in per-user access pricing.", fr: "Inscrire uniquement Sub-Partners à la tarification de l'accès par utilisateur." } }
    - { id: d, text: { en: "Enroll only Sub-Resorts in per-user access pricing.", fr: "Inscrire uniquement Sub-Resorts à la tarification de l'accès par utilisateur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Per-user access pricing covers Azure Virtual Desktop access for external commercial purposes and is billed through the enrolled subscription for each user who connects at least once in the month. Because the employees already have eligible Microsoft 365 licenses, Microsoft recommends keeping internal users in a subscription that isn't enrolled, so only Sub-Partners, which hosts HP-Partners, should be enrolled.
    fr: |
      La tarification de l'accès par utilisateur couvre l'accès à Azure Virtual Desktop à des fins commerciales externes ; elle est facturée par l'abonnement inscrit pour chaque utilisateur qui se connecte au moins une fois dans le mois. Comme les employés disposent déjà de licences Microsoft 365 éligibles, Microsoft recommande de garder les utilisateurs internes dans un abonnement non inscrit : seul Sub-Partners, qui héberge HP-Partners, doit être inscrit.
  options:
    a: { en: "Enrolling Sub-Resorts would charge an access fee for employees who are already licensed, which means paying twice.", fr: "Inscrire Sub-Resorts facturerait un accès pour des employés qui ont déjà une licence, donc un double paiement." }
    b: { en: "RDS CALs license access to Windows Server session hosts; HP-Partners runs Windows 11 Enterprise multi-session.", fr: "Les CAL RDS couvrent l'accès à des hôtes de session Windows Server ; HP-Partners exécute Windows 11 Enterprise multisession." }
    d: { en: "The travel agency users connect to HP-Partners in Sub-Partners, so enrolling Sub-Resorts doesn't license them and charges the employees instead.", fr: "Les utilisateurs des agences se connectent à HP-Partners dans Sub-Partners : inscrire Sub-Resorts ne leur donne pas de licence et facture plutôt les employés." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
