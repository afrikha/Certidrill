id: az140-sr2-gallery-region-2
objective: "1.5.7"
type: series_yesno
series: az140-sr2-gallery-region
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You select version 1.4.0 in the host pool wizard without changing its replication.
  fr: |
    Vous sélectionnez la version 1.4.0 dans l'assistant du pool d'hôtes sans modifier sa réplication.
body:
  solution:
    en: |
      You keep the replication of image version 1.4.0 unchanged. In the session host settings of the host pool creation wizard for Pool-NE, you select image version **1.4.0** of galAvd and set the number of VMs to **80** in North Europe.
    fr: |
      Vous ne modifiez pas la réplication de la version d'image 1.4.0. Dans les paramètres des hôtes de session de l'assistant de création du pool d'hôtes Pool-NE, vous sélectionnez la version d'image **1.4.0** de galAvd et définissez le nombre de machines virtuelles sur **80** dans North Europe.
answer: { value: false }
explanation:
  correct:
    en: A VM is created from a replica of the image version in its own region, and version 1.4.0 is replicated only to East US. Until North Europe is added as a target region and replication completes, the session hosts of Pool-NE can't be deployed from this version. The three East US replicas also don't follow the recommendation of one replica per 20 concurrent VMs.
    fr: "Une machine virtuelle est créée à partir d'un réplica de la version d'image situé dans sa propre région, et la version 1.4.0 n'est répliquée que dans East US. Tant que North Europe n'est pas ajoutée comme région cible et que la réplication n'est pas terminée, les hôtes de session de Pool-NE ne peuvent pas être déployés à partir de cette version. Les trois réplicas d'East US ne suivent pas non plus la recommandation d'un réplica pour 20 machines virtuelles simultanées."
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
