id: az140-1a-mon-insights-statements
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Azure Virtual Desktop Insights to monitor the connection quality of a host pool named **HP1**. HP1 belongs to an application group that is registered in a workspace named **WS1**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise Azure Virtual Desktop Insights pour superviser la qualité de connexion d'un pool d'hôtes nommé **HP1**. HP1 est associé à un groupe d'applications inscrit dans un espace de travail nommé **WS1**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: For ideal interaction times, the round-trip time should generally be below 100 ms.
        fr: Pour des temps d'interaction idéaux, la durée aller-retour doit généralement être inférieure à 100 ms.
    - id: s2
      text:
        en: To collect the WVDConnectionNetworkData table, you configure the diagnostic settings of WS1.
        fr: Pour collecter la table WVDConnectionNetworkData, vous configurez les paramètres de diagnostic de WS1.
    - id: s3
      text:
        en: The Transport pivot of Connection Reliability can separate ShortpathPrivate, ShortpathPublic and Relay connections.
        fr: L'axe Transport de Connection Reliability permet de distinguer les connexions ShortpathPrivate, ShortpathPublic et Relay.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Microsoft states that latency should generally be below 100 ms for ideal interaction, and that session quality becomes low above 200 ms. Network data logs are collected by the diagnostic settings of the host pool, not of the workspace. The Transport pivot groups events by UDP values (Multipath, Relay, ShortpathPublic, ShortpathPrivate) and TCP.
    fr: |
      Microsoft indique que la latence doit généralement être inférieure à 100 ms pour une interaction idéale, et que la qualité de session devient faible au-delà de 200 ms. Les journaux de données réseau sont collectés par les paramètres de diagnostic du pool d'hôtes, pas de l'espace de travail. L'axe Transport regroupe les événements par valeurs UDP (Multipath, Relay, ShortpathPublic, ShortpathPrivate) et TCP.
references:
  - title: Use cases for Azure Virtual Desktop Insights
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/insights-use-cases
  - title: Collect and query connection quality data
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/connection-quality-monitoring
