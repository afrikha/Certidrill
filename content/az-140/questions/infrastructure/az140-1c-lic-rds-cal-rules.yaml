id: az140-1c-lic-rds-cal-rules
objective: "1.3.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys plans an Azure Virtual Desktop host pool for internal users. The session hosts will run Windows Server 2025 because the line-of-business application supports only Windows Server.

    Tailspin already owns RDS 2022 per-user CALs with Software Assurance, installed on a license server that runs Windows Server 2022. Tailspin plans to deploy a new license server that runs Windows Server 2025.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit un pool d'hôtes Azure Virtual Desktop pour ses utilisateurs internes. Les hôtes de session exécuteront Windows Server 2025, car l'application métier ne prend en charge que Windows Server.

    Tailspin possède déjà des CAL RDS 2022 par utilisateur avec Software Assurance, installées sur un serveur de licences qui exécute Windows Server 2022. Tailspin prévoit de déployer un nouveau serveur de licences qui exécute Windows Server 2025.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The RDS 2022 per-user CALs can license user connections to the Windows Server 2025 session hosts.
        fr: |
          Les CAL RDS 2022 par utilisateur peuvent licencier les connexions des utilisateurs aux hôtes de session Windows Server 2025.
    - id: s2
      text:
        en: |
          A license server that runs Windows Server 2025 can host RDS 2022 CALs.
        fr: |
          Un serveur de licences qui exécute Windows Server 2025 peut héberger des CAL RDS 2022.
    - id: s3
      text:
        en: |
          Before a license server is configured, users can connect to the session hosts during a grace period of 120 days.
        fr: |
          Avant la configuration d'un serveur de licences, les utilisateurs peuvent se connecter aux hôtes de session pendant une période de grâce de 120 jours.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      An RDS CAL must be the same version as the session host or later, so Windows Server 2025 session hosts need RDS 2025 CALs. A license server can host CALs of its own version or earlier versions, so a Windows Server 2025 license server can host 2022 CALs. Remote Desktop Services allows a 120-day grace period without a license server; after it, clients need a valid CAL.
    fr: |
      Une CAL RDS doit être de la même version que l'hôte de session ou d'une version ultérieure : des hôtes de session Windows Server 2025 exigent des CAL RDS 2025. Un serveur de licences peut héberger des CAL de sa version ou de versions antérieures : un serveur de licences Windows Server 2025 peut donc héberger des CAL 2022. Les services Bureau à distance accordent une période de grâce de 120 jours sans serveur de licences ; ensuite, les clients ont besoin d'une CAL valide.
references:
  - title: License Remote Desktop Services with Client Access Licenses (CALs)
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-client-access-license
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
