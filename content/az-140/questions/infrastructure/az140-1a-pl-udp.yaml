id: az140-1a-pl-udp
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure Virtual Desktop host pool named **HP1** that has a private endpoint with the connection sub-resource. The public access of HP1 is set to **Disable public access and use private access**. Users connect over ExpressRoute.

    The session hosts have the RDP Shortpath for managed networks listener enabled, and UDP 3390 is allowed from the user networks. All the RDP Shortpath options of HP1 have their default values. **Connection Information** shows the transport **TCP**.

    You need the sessions to use RDP Shortpath for managed networks. Connections must keep using private routes only.

    What should you do?
  fr: |
    Fabrikam dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** qui possède un point de terminaison privé avec la sous-ressource connection. L'accès public de HP1 est défini sur **Disable public access and use private access**. Les utilisateurs se connectent par ExpressRoute.

    L'écouteur RDP Shortpath pour les réseaux managés est activé sur les hôtes de session, et UDP 3390 est autorisé depuis les réseaux des utilisateurs. Toutes les options RDP Shortpath de HP1 ont leur valeur par défaut. **Connection Information** affiche le transport **TCP**.

    Vous devez faire en sorte que les sessions utilisent RDP Shortpath pour les réseaux managés. Les connexions doivent continuer à n'utiliser que des itinéraires privés.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the public access of HP1 to Enable public access from all networks and keep all the RDP Shortpath options enabled.", fr: "Définir l'accès public de HP1 sur Enable public access from all networks et laisser toutes les options RDP Shortpath activées." }
    - id: b
      text: { en: "Create a second private endpoint for HP1 with the feed sub-resource and allow UDP 3390 to its private IP address.", fr: "Créer un second point de terminaison privé pour HP1 avec la sous-ressource feed et autoriser UDP 3390 vers son adresse IP privée." }
    - id: c
      text: { en: "Allow outbound UDP 3478 from the session host subnet to 51.5.0.0/16 and keep public access disabled.", fr: "Autoriser UDP 3478 sortant du sous-réseau des hôtes de session vers 51.5.0.0/16 et laisser l'accès public désactivé." }
    - id: d
      text: { en: "Select Allow Direct UDP network path over Private Link and set the public STUN and TURN options to Disabled.", fr: "Sélectionner Allow Direct UDP network path over Private Link et définir les options publiques STUN et TURN sur Désactivé." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      UDP is blocked over Private Link unless you opt in. On the **Public access** page of HP1, the private-access options display **Allow Direct UDP network path over Private Link**, which enables RDP Shortpath for managed networks. The portal refuses to save until RDP Shortpath for public networks via STUN and via TURN are disabled on the **RDP Shortpath** tab.
    fr: |
      UDP est bloqué sur Private Link, sauf si vous l'activez explicitement. Sur la page **Public access** de HP1, les options d'accès privé affichent **Allow Direct UDP network path over Private Link**, qui active RDP Shortpath pour les réseaux managés. Le portail refuse d'enregistrer tant que RDP Shortpath pour les réseaux publics via STUN et via TURN ne sont pas désactivés dans l'onglet **RDP Shortpath**.
  options:
    a: { en: "Enabling public access from all networks would allow public routes, which violates the requirement.", fr: "Activer l'accès public depuis tous les réseaux autoriserait les itinéraires publics, ce qui viole l'exigence." }
    b: { en: "The feed sub-resource belongs to workspaces, and an extra endpoint doesn't lift the UDP block over Private Link.", fr: "La sous-ressource feed appartient aux espaces de travail, et un point de terminaison supplémentaire ne lève pas le blocage d'UDP sur Private Link." }
    c: { en: "UDP 3478 to 51.5.0.0/16 reaches the public STUN and TURN servers, which are public routes, not the managed-network listener.", fr: "UDP 3478 vers 51.5.0.0/16 joint les serveurs STUN et TURN publics, qui sont des itinéraires publics, pas l'écouteur des réseaux managés." }
references:
  - title: Azure Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview
  - title: Set up Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-setup
