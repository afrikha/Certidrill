id: az140-1d-cit-prereqs
objective: "1.5.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to create your first custom image template in Azure Virtual Desktop in a subscription named **Sub1**. The template will distribute the image as a managed image in a resource group named **rg-images**. The template won't use an existing virtual network.

    The Microsoft.DesktopVirtualization, Microsoft.Compute, Microsoft.Network, Microsoft.Storage, Microsoft.KeyVault and Microsoft.ContainerInstance resource providers are registered in Sub1.

    Which two actions should you perform before you create the template? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer votre premier modèle d'image personnalisée dans Azure Virtual Desktop, dans un abonnement nommé **Sub1**. Le modèle distribuera l'image sous forme d'image managée dans un groupe de ressources nommé **rg-images**. Le modèle n'utilisera pas de réseau virtuel existant.

    Les fournisseurs de ressources Microsoft.DesktopVirtualization, Microsoft.Compute, Microsoft.Network, Microsoft.Storage, Microsoft.KeyVault et Microsoft.ContainerInstance sont inscrits dans Sub1.

    Quelles sont les deux actions à effectuer avant de créer le modèle ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Register the Microsoft.VirtualMachineImages resource provider in Sub1.", fr: "Inscrire le fournisseur de ressources Microsoft.VirtualMachineImages dans Sub1." } }
    - { id: b, text: { en: "Create image version 1.0.0 to receive the first build.", fr: "Créer la version d'image 1.0.0 qui recevra le premier build." } }
    - { id: c, text: { en: "Create a user-assigned managed identity and give it a custom role on rg-images.", fr: "Créer une identité managée affectée par l'utilisateur et lui attribuer un rôle personnalisé sur rg-images." } }
    - { id: d, text: { en: "Enable a system-assigned managed identity on the target host pool.", fr: "Activer une identité managée affectée par le système sur le pool d'hôtes cible." } }
    - { id: e, text: { en: "Deploy Azure Bastion so that the build VM can be reached.", fr: "Déployer Azure Bastion pour que la machine virtuelle de build soit joignable." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Custom image templates run on Azure VM Image Builder, so Microsoft.VirtualMachineImages must be registered along with the other providers. The template also needs a user-assigned managed identity that has a custom role with the image actions (for example `Microsoft.Compute/images/write`, `read` and `delete`), ideally scoped to the resource group that holds the images.
    fr: |
      Les modèles d'images personnalisées s'appuient sur Azure VM Image Builder : Microsoft.VirtualMachineImages doit donc être inscrit avec les autres fournisseurs. Le modèle a aussi besoin d'une identité managée affectée par l'utilisateur dotée d'un rôle personnalisé avec les actions sur les images (par exemple `Microsoft.Compute/images/write`, `read` et `delete`), idéalement à l'étendue du groupe de ressources qui contient les images.
  options:
    b:
      en: The target is a managed image, and even with a gallery you don't create the version yourself; the build creates it.
      fr: La cible est une image managée, et même avec une galerie vous ne créez pas la version vous-même ; le build la crée.
    d:
      en: The host pool identity isn't used by custom image templates; they need a user-assigned identity.
      fr: L'identité du pool d'hôtes n'est pas utilisée par les modèles d'images personnalisées ; ils ont besoin d'une identité affectée par l'utilisateur.
    e:
      en: Image Builder connects to the temporary build VM itself; without an existing virtual network it creates a temporary one with a public IP.
      fr: Image Builder se connecte lui-même à la machine virtuelle de build temporaire ; sans réseau virtuel existant, il en crée un temporaire avec une adresse IP publique.
references:
  - title: Use custom image templates to create custom images in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-custom-image-templates
