id: az140-1d-img-capture-target
objective: "1.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have generalized a Windows 11 Enterprise multi-session virtual machine that you customized as a golden image for Azure Virtual Desktop.

    The image will be used to deploy session hosts in host pools in West Europe and North Europe. You must be able to keep earlier versions of the image to roll back to them.

    Where should you capture the virtual machine?
  fr: |
    Vous avez généralisé une machine virtuelle Windows 11 Entreprise multisession que vous avez personnalisée comme image de référence pour Azure Virtual Desktop.

    L'image servira à déployer des hôtes de session dans des pools d'hôtes des régions West Europe et North Europe. Vous devez pouvoir conserver les versions antérieures de l'image pour y revenir.

    Où devez-vous capturer la machine virtuelle ?
body:
  options:
    - { id: a, text: { en: "To an image version in an Azure Compute Gallery", fr: "Vers une version d'image dans une galerie Azure Compute Gallery" } }
    - { id: b, text: { en: "To a managed image in West Europe", fr: "Vers une image managée dans West Europe" } }
    - { id: c, text: { en: "To a snapshot of the OS disk in each region", fr: "Vers un instantané du disque du système d'exploitation dans chaque région" } }
    - { id: d, text: { en: "To a VHD file in a storage account", fr: "Vers un fichier VHD dans un compte de stockage" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Microsoft recommends Azure Compute Gallery for production golden images: each capture becomes a new image version of an image definition, versions are kept so that you can redeploy an earlier one, and each version can be replicated to several regions.
    fr: |
      Microsoft recommande Azure Compute Gallery pour les images de référence de production : chaque capture devient une nouvelle version d'image d'une définition d'image, les versions sont conservées pour pouvoir redéployer une version antérieure, et chaque version peut être répliquée dans plusieurs régions.
  options:
    b:
      en: A managed image is a single standalone image with no versioning and no replication to other regions.
      fr: Une image managée est une image autonome unique, sans gestion des versions ni réplication vers d'autres régions.
    c:
      en: A snapshot isn't a generalized image that the host pool wizard can deploy session hosts from.
      fr: Un instantané n'est pas une image généralisée à partir de laquelle l'assistant du pool d'hôtes peut déployer des hôtes de session.
    d:
      en: A VHD in a storage account offers no versioning or regional replication, and session hosts aren't deployed from it in the host pool wizard.
      fr: Un VHD dans un compte de stockage n'offre ni gestion des versions ni réplication régionale, et l'assistant du pool d'hôtes ne déploie pas d'hôtes de session à partir de lui.
references:
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
