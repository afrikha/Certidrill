id: az140-1d-aib-windowsupdate-restart
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure VM Image Builder image template for Azure Virtual Desktop session hosts. Its `customize` section contains two customizers, in this order:

    1. A `PowerShell` customizer that installs a line-of-business application. The installer reports that a restart is required.
    2. A `WindowsUpdate` customizer with `"searchCriteria": "IsInstalled=0"`.

    Builds fail in the WindowsUpdate step with error 0x80240016.

    What should you do?
  fr: |
    Vous disposez d'un modèle d'image Azure VM Image Builder pour des hôtes de session Azure Virtual Desktop. Sa section `customize` contient deux personnalisateurs, dans cet ordre :

    1. Un personnalisateur `PowerShell` qui installe une application métier. Le programme d'installation indique qu'un redémarrage est requis.
    2. Un personnalisateur `WindowsUpdate` avec `"searchCriteria": "IsInstalled=0"`.

    Les builds échouent à l'étape WindowsUpdate avec l'erreur 0x80240016.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Raise the updateLimit value of the WindowsUpdate customizer.", fr: "Augmenter la valeur updateLimit du personnalisateur WindowsUpdate." } }
    - { id: b, text: { en: "Set runElevated to false on the PowerShell customizer.", fr: "Définir runElevated sur false dans le personnalisateur PowerShell." } }
    - { id: c, text: { en: "Change searchCriteria to IsInstalled=1.", fr: "Remplacer searchCriteria par IsInstalled=1." } }
    - { id: d, text: { en: "Add a WindowsRestart customizer between the two customizers.", fr: "Ajouter un personnalisateur WindowsRestart entre les deux personnalisateurs." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A pending restart or an installer that is still running can make the WindowsUpdate customizer fail with 0x80240016. A `WindowsRestart` customizer after the application installation restarts the build VM and waits for it (`restartTimeout`), so Windows Update starts from a clean state.
    fr: |
      Un redémarrage en attente ou un programme d'installation encore en cours peut faire échouer le personnalisateur WindowsUpdate avec l'erreur 0x80240016. Un personnalisateur `WindowsRestart` placé après l'installation de l'application redémarre la machine virtuelle de build et l'attend (`restartTimeout`) : Windows Update démarre ainsi dans un état propre.
  options:
    a:
      en: updateLimit only caps how many updates are installed; it doesn't clear the pending restart.
      fr: updateLimit plafonne seulement le nombre de mises à jour installées ; il ne lève pas le redémarrage en attente.
    b:
      en: Running the installer without elevation doesn't remove the restart that it leaves pending.
      fr: Exécuter le programme d'installation sans élévation ne supprime pas le redémarrage qu'il laisse en attente.
    c:
      en: IsInstalled=1 searches for updates that are already installed, so no pending update would be installed.
      fr: |
        IsInstalled=1 recherche les mises à jour déjà installées : aucune mise à jour en attente ne serait installée.
references:
  - title: Create an Azure Image Builder Bicep or ARM template JSON template
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json
