id: az140-1b-odfc-not-needed
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP-Finance**. FSLogix profile containers are stored in an Azure file share and work as expected. Users run Microsoft 365 Apps, including Outlook in cached mode and the new Teams.

    A colleague proposes adding ODFC containers so that the Outlook and Teams caches roam between session hosts. You need to ensure that the Outlook and Teams data follows users between session hosts. The solution must minimize storage and configuration complexity.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Finance**. Les conteneurs de profils FSLogix sont stockés dans un partage de fichiers Azure et fonctionnent comme prévu. Les utilisateurs exécutent les Microsoft 365 Apps, notamment Outlook en mode mis en cache et le nouveau Teams.

    Un collègue propose d'ajouter des conteneurs ODFC pour que les caches d'Outlook et de Teams suivent les utilisateurs entre les hôtes de session. Vous devez faire en sorte que les données d'Outlook et de Teams suivent les utilisateurs entre les hôtes de session. La solution doit réduire au minimum la complexité du stockage et de la configuration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add ODFC containers on a second file share and keep the profile containers.", fr: "Ajouter des conteneurs ODFC sur un second partage de fichiers et conserver les conteneurs de profils." }
    - id: b
      text: { en: "Add ODFC containers on the same file share and keep the profile containers.", fr: "Ajouter des conteneurs ODFC sur le même partage de fichiers et conserver les conteneurs de profils." }
    - id: c
      text: { en: "Replace the profile containers with ODFC containers on the same file share.", fr: "Remplacer les conteneurs de profils par des conteneurs ODFC sur le même partage de fichiers." }
    - id: d
      text: { en: "Keep the profile containers only, without adding ODFC containers.", fr: "Conserver uniquement les conteneurs de profils, sans ajouter de conteneurs ODFC." }
answer: { optionId: d }
explanation:
  correct:
    en: A profile container holds the whole user profile, including the Outlook, Teams and OneDrive data that ODFC would redirect. Microsoft states that ODFC containers aren't needed when profile containers are used, and that a dual configuration isn't necessary or recommended. ODFC is meant for environments that use another roaming profile solution.
    fr: Un conteneur de profil contient tout le profil utilisateur, y compris les données d'Outlook, de Teams et de OneDrive qu'ODFC redirigerait. Microsoft indique que les conteneurs ODFC ne sont pas nécessaires quand des conteneurs de profils sont utilisés, et qu'une configuration double n'est ni nécessaire ni recommandée. ODFC est destiné aux environnements qui utilisent une autre solution d'itinérance des profils.
  options:
    a: { en: "A second container per user adds storage, sign-in work and configuration without roaming any data the profile container doesn't already roam.", fr: "Un second conteneur par utilisateur ajoute du stockage, du travail à l'ouverture de session et de la configuration sans faire suivre de données que le conteneur de profil ne fait pas déjà suivre." }
    b: { en: "Same share or not, the dual configuration duplicates what the profile container already provides.", fr: "Même partage ou non, la configuration double reproduit ce que le conteneur de profil fournit déjà." }
    c: { en: "ODFC containers hold only Microsoft 365 Apps data; the rest of the profile would no longer roam.", fr: "Les conteneurs ODFC ne contiennent que les données des Microsoft 365 Apps ; le reste du profil ne suivrait plus les utilisateurs." }
references:
  - title: Configure ODFC containers
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-configure-odfc-containers
