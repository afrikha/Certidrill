id: az140-1c-hp-remoteapp-group
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named HP1. HP1 has a desktop application group named HP1-DAG that is assigned to the Sales group. The users of the Finance group aren't assigned to any application group.

    An application named FinApp is installed on all the session hosts of HP1. Finance users must be able to start FinApp from Windows App without getting a full desktop. Sales users must keep their desktop.

    You need to recommend a solution. The solution must minimize administrative effort.

    What should you recommend?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop regroupé nommé HP1. HP1 a un groupe d'applications de bureau nommé HP1-DAG attribué au groupe Sales. Les utilisateurs du groupe Finance ne sont attribués à aucun groupe d'applications.

    Une application nommée FinApp est installée sur tous les hôtes de session de HP1. Les utilisateurs de Finance doivent pouvoir démarrer FinApp depuis Windows App sans obtenir de bureau complet. Les utilisateurs de Sales doivent conserver leur bureau.

    Vous devez recommander une solution. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create a second desktop application group in HP1 for Finance", fr: "Créer un second groupe d'applications de bureau dans HP1 pour Finance" } }
    - { id: b, text: { en: "Create a personal host pool and publish FinApp from it", fr: "Créer un pool d'hôtes personnel et y publier FinApp" } }
    - { id: c, text: { en: "Create a RemoteApp application group in HP1 for Finance", fr: "Créer un groupe d'applications RemoteApp dans HP1 pour Finance" } }
    - { id: d, text: { en: "Set the preferred app group type of HP1 to RemoteApp", fr: "Définir le type de groupe d'applications préféré de HP1 sur RemoteApp" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A pooled host pool can have one desktop application group and several RemoteApp application groups at the same time. You create a RemoteApp application group in HP1, publish FinApp in it and assign it to Finance; Sales keeps HP1-DAG, and no new session hosts are needed.
    fr: |
      Un pool d'hôtes regroupé peut avoir en même temps un groupe d'applications de bureau et plusieurs groupes d'applications RemoteApp. Vous créez un groupe d'applications RemoteApp dans HP1, y publiez FinApp et l'attribuez à Finance ; Sales conserve HP1-DAG, et aucun nouvel hôte de session n'est nécessaire.
  options:
    a: { en: "A host pool can have only one desktop application group, and a desktop would give Finance a full desktop.", fr: "Un pool d'hôtes ne peut avoir qu'un seul groupe d'applications de bureau, et un bureau donnerait à Finance un bureau complet." }
    b: { en: "RemoteApp application groups are supported only on pooled host pools, and new hosts add effort.", fr: "Les groupes d'applications RemoteApp ne sont pris en charge que sur les pools d'hôtes regroupés, et de nouveaux hôtes ajoutent de l'effort." }
    d: { en: "The preferred type only matters for users assigned both types on the pool; Finance still has no application group.", fr: "Le type préféré ne compte que pour les utilisateurs qui ont les deux types sur le pool ; Finance n'a toujours aucun groupe d'applications." }
references:
  - title: Azure Virtual Desktop terminology
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/terminology
