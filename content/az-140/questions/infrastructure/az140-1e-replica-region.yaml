id: az140-1e-replica-region
objective: "1.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Compute Gallery named **galAvd** in West Europe. Image version **2.0.0** of the image definition **win11-multi** has a single target region: West Europe.

    You create an Azure Virtual Desktop host pool named **HP-NEU** in North Europe. Its session hosts must connect to a virtual network in North Europe and must be deployed from image version 2.0.0. The solution must minimize administrative effort.

    What should you do before you add the session hosts?
  fr: |
    Adatum dispose d'une galerie Azure Compute Gallery nommée **galAvd** dans la région West Europe. La version d'image **2.0.0** de la définition d'image **win11-multi** a une seule région cible : West Europe.

    Vous créez un pool d'hôtes Azure Virtual Desktop nommé **HP-NEU** dans la région North Europe. Ses hôtes de session doivent se connecter à un réseau virtuel de North Europe et doivent être déployés à partir de la version d'image 2.0.0. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire avant d'ajouter les hôtes de session ?
body:
  options:
    - id: a
      text: { en: "Create a second gallery in North Europe and rebuild the image into it.", fr: "Créer une deuxième galerie dans North Europe et y reconstruire l'image." }
    - id: b
      text: { en: "Change the storage account type of image version 2.0.0 to Standard_ZRS.", fr: "Changer le type de compte de stockage de la version d'image 2.0.0 en Standard_ZRS." }
    - id: c
      text: { en: "Deploy the session hosts in West Europe and connect them to the North Europe virtual network.", fr: "Déployer les hôtes de session dans West Europe et les connecter au réseau virtuel de North Europe." }
    - id: d
      text: { en: "Add North Europe as a target region of image version 2.0.0.", fr: "Ajouter North Europe comme région cible de la version d'image 2.0.0." }
answer: { optionId: d }
explanation:
  correct:
    en: To create a VM from a gallery image, the image version must be replicated to the region where the VM is created. Adding North Europe to the target regions of the existing version (for example with `az sig image-version update --target-regions`) creates a replica there without rebuilding anything.
    fr: "Pour créer une machine virtuelle à partir d'une image de galerie, la version d'image doit être répliquée dans la région où la machine virtuelle est créée. Ajouter North Europe aux régions cibles de la version existante (par exemple avec `az sig image-version update --target-regions`) y crée un réplica sans rien reconstruire."
  options:
    a: { en: "A second gallery helps disaster recovery, but rebuilding the image is more effort than replicating the existing version.", fr: "Une deuxième galerie aide à la reprise d'activité, mais reconstruire l'image demande plus d'effort que répliquer la version existante." }
    b: { en: "Zone-redundant storage protects replicas against a zone failure inside a region; it doesn't add a region.", fr: "Le stockage redondant interzone protège les réplicas contre la panne d'une zone dans une région ; il n'ajoute pas de région." }
    c: { en: "A session host VM must be in the same region as the virtual network it connects to.", fr: "Une machine virtuelle hôte de session doit se trouver dans la même région que le réseau virtuel auquel elle se connecte." }
references:
  - title: Create a VM from a generalized image version
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/vm-generalized-image-version
  - title: az sig image-version
    url: https://learn.microsoft.com/en-us/cli/azure/sig/image-version?view=azure-cli-latest
