id: az140-1c-cap-capacity-threshold
objective: "1.3.6"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named HP1 that has a max session limit of 16. A scaling plan is assigned to HP1. During the ramp-up phase, three session hosts are running and the capacity threshold is 75 percent.

    Above how many user sessions does autoscale start another session host?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop regroupé nommé HP1 dont la limite maximale de sessions est de 16. Un plan de mise à l'échelle est attribué à HP1. Pendant la phase de montée en charge, trois hôtes de session sont en marche et le seuil de capacité est de 75 %.

    Au-delà de combien de sessions utilisateur la mise à l'échelle automatique démarre-t-elle un autre hôte de session ?
body:
  options:
    - { id: a, text: "12" }
    - { id: b, text: "24" }
    - { id: c, text: "36" }
    - { id: d, text: "48" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Autoscale computes the available capacity from the running hosts and the max session limit, here 3 × 16 = 48 sessions. When usage goes above the capacity threshold, 75 percent of 48 = 36 sessions, autoscale turns on another session host. This is why pooled host pools that use autoscale need a custom max session limit.
    fr: |
      La mise à l'échelle automatique calcule la capacité disponible à partir des hôtes en marche et de la limite maximale de sessions, ici 3 × 16 = 48 sessions. Quand l'utilisation dépasse le seuil de capacité, 75 % de 48 = 36 sessions, elle démarre un autre hôte de session. C'est pourquoi les pools d'hôtes regroupés qui utilisent la mise à l'échelle automatique exigent une limite maximale de sessions personnalisée.
  options:
    a: { en: "12 is 75 percent of a single host's limit; capacity counts all running hosts.", fr: "12 représente 75 % de la limite d'un seul hôte ; la capacité compte tous les hôtes en marche." }
    b: { en: "24 is 50 percent of the capacity, not the 75 percent threshold.", fr: "24 représente 50 % de la capacité, pas le seuil de 75 %." }
    d: { en: "48 is the full capacity; autoscale acts before the running hosts are full.", fr: "48 est la capacité totale ; la mise à l'échelle agit avant que les hôtes en marche soient pleins." }
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
