id: az140-1b-anf-continuous-availability
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure NetApp Files account named **anf-weu** that has an Active Directory connection to contoso.com and a capacity pool named **pool1**. You are creating an SMB volume in pool1 to store the FSLogix profile containers of an Azure Virtual Desktop pooled host pool.

    You need to configure the volume as Microsoft recommends for FSLogix profile containers.

    Which volume setting should you enable?
  fr: |
    Vous disposez d'un compte Azure NetApp Files nommé **anf-weu** qui possède une connexion Active Directory vers contoso.com et un pool de capacité nommé **pool1**. Vous créez un volume SMB dans pool1 pour stocker les conteneurs de profils FSLogix d'un pool d'hôtes regroupé Azure Virtual Desktop.

    Vous devez configurer le volume comme Microsoft le recommande pour les conteneurs de profils FSLogix.

    Quel paramètre du volume devez-vous activer ?
body:
  options:
    - id: a
      text: { en: "Access-based enumeration", fr: "Énumération basée sur l'accès (Access-based enumeration)" }
    - id: b
      text: { en: "Non-browsable share", fr: "Partage non consultable (Non-browsable share)" }
    - id: c
      text: { en: "SMB3 protocol encryption", fr: "Chiffrement du protocole SMB3 (SMB3 protocol encryption)" }
    - id: d
      text: { en: "Continuous Availability", fr: "Disponibilité continue (Continuous Availability)" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft recommends enabling Continuous Availability on Azure NetApp Files SMB volumes that store FSLogix containers. It keeps the SMB sessions and open handles of the attached VHD(x) files during service maintenance or failover events, so the containers stay attached. You can also enable it later on an existing SMB volume.
    fr: |
      Microsoft recommande d'activer la disponibilité continue sur les volumes SMB Azure NetApp Files qui stockent les conteneurs FSLogix. Elle maintient les sessions SMB et les handles ouverts des fichiers VHD(x) attachés pendant les opérations de maintenance ou de basculement du service : les conteneurs restent attachés. Vous pouvez aussi l'activer plus tard sur un volume SMB existant.
  options:
    a: { en: "Access-based enumeration hides folders a user can't access; it doesn't protect attached containers during maintenance events.", fr: "L'énumération basée sur l'accès masque les dossiers auxquels un utilisateur n'a pas accès ; elle ne protège pas les conteneurs attachés pendant les opérations de maintenance." }
    b: { en: "A non-browsable share is hidden from network browsing; it doesn't affect container availability.", fr: "Un partage non consultable est masqué lors de la navigation réseau ; cela n'affecte pas la disponibilité des conteneurs." }
    c: { en: "SMB3 encryption protects data in transit; it isn't the setting Microsoft recommends for FSLogix availability.", fr: "Le chiffrement SMB3 protège les données en transit ; ce n'est pas le paramètre que Microsoft recommande pour la disponibilité de FSLogix." }
references:
  - title: Store FSLogix profile containers on Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-fslogix-profile-container
