id: az140-1e-shu-order
objective: "1.5.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** that uses a session host configuration. A scaling plan with autoscale is assigned to HP1 and enabled. The session hosts were deployed from image version **1.3.0** of an Azure Compute Gallery image definition.

    You built and replicated image version **1.4.0**, which contains this month's OS and application updates. You need to replace the session hosts of HP1 with hosts based on 1.4.0. The solution must keep 1.3.0 available for a rollback.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** qui utilise une configuration d'hôte de session. Un plan de mise à l'échelle avec mise à l'échelle automatique est affecté à HP1 et activé. Les hôtes de session ont été déployés à partir de la version d'image **1.3.0** d'une définition d'image Azure Compute Gallery.

    Vous avez construit et répliqué la version d'image **1.4.0**, qui contient les mises à jour du système d'exploitation et des applications de ce mois-ci. Vous devez remplacer les hôtes de session de HP1 par des hôtes basés sur 1.4.0. La solution doit conserver 1.3.0 disponible pour un retour arrière.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: disable, text: { en: "Disable the scaling plan on HP1.", fr: "Désactiver le plan de mise à l'échelle sur HP1." } }
    - { id: update, text: { en: "Schedule a session host update on HP1 that uses image version 1.4.0.", fr: "Planifier sur HP1 une mise à jour des hôtes de session qui utilise la version d'image 1.4.0." } }
    - { id: enable, text: { en: "Enable the scaling plan on HP1 after the update completes.", fr: "Activer le plan de mise à l'échelle sur HP1 une fois la mise à jour terminée." } }
    - { id: drain, text: { en: "Turn on drain mode on all the session hosts of HP1.", fr: "Activer le mode drainage sur tous les hôtes de session de HP1." } }
    - { id: remove, text: { en: "Remove the existing session hosts from HP1.", fr: "Retirer les hôtes de session existants de HP1." } }
    - { id: delete, text: { en: "Delete image version 1.3.0 from the gallery.", fr: "Supprimer la version d'image 1.3.0 de la galerie." } }
answer:
  sequence: [ disable, update, enable ]
explanation:
  correct:
    en: Microsoft recommends disabling autoscale before a session host update and keeping it disabled until the update finishes; an enabled scaling plan can make the update fail. The session host update then drains, re-creates and re-registers the hosts batch by batch from 1.4.0, after which you enable the scaling plan again.
    fr: "Microsoft recommande de désactiver la mise à l'échelle automatique avant une mise à jour des hôtes de session et jusqu'à la fin de celle-ci ; un plan de mise à l'échelle activé peut faire échouer la mise à jour. La mise à jour des hôtes de session met ensuite les hôtes en drainage, les recrée à partir de 1.4.0 et les réinscrit lot par lot, puis vous réactivez le plan de mise à l'échelle."
  options:
    drain: { en: "The update manages drain mode itself; you shouldn't change the drain mode of hosts while an update is ongoing.", fr: "La mise à jour gère elle-même le mode drainage ; il ne faut pas modifier le mode drainage des hôtes pendant une mise à jour." }
    remove: { en: "The update removes and replaces the hosts; removing VMs from the host pool yourself isn't supported during an update.", fr: "La mise à jour retire et remplace les hôtes ; retirer vous-même des machines virtuelles du pool d'hôtes n'est pas pris en charge pendant une mise à jour." }
    delete: { en: "Deleting 1.3.0 removes the rollback option that the requirement asks you to keep.", fr: "Supprimer 1.3.0 supprime la possibilité de retour arrière que l'exigence demande de conserver." }
references:
  - title: Session host update for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
  - title: Update session hosts using session host update in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update-configure
