id: az140-cs2b-profiles
objective: "1.2.3"
type: yesno_statements
caseStudy: az140-cs2b-bellows
difficulty: 3
status: draft
stem:
  en: |
    You plan to configure stbellowsprof for identity-based access by using Microsoft Entra Kerberos to meet the profile requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de configurer stbellowsprof pour l'accès basé sur l'identité avec Microsoft Entra Kerberos afin de respecter l'exigence relative aux profils.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You must exclude the application of stbellowsprof from CA-AllApps.
        fr: Vous devez exclure l'application de stbellowsprof de CA-AllApps.
    - id: s2
      text:
        en: The session hosts must be configured to retrieve the cloud Kerberos ticket during sign-in.
        fr: Les hôtes de session doivent être configurés pour récupérer le ticket Kerberos cloud lors de la connexion.
    - id: s3
      text:
        en: To grant share-level permissions to GRP-Students, you must first re-create the group in an Active Directory domain and synchronize it to Microsoft Entra ID.
        fr: Pour accorder des autorisations au niveau du partage à GRP-Students, vous devez d'abord recréer le groupe dans un domaine Active Directory et le synchroniser vers Microsoft Entra ID.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Microsoft Entra Kerberos does not support MFA for access to Azure file shares, so the storage account application must be excluded from Conditional Access policies that require MFA for all apps. The session hosts need the CloudKerberosTicketRetrievalEnabled setting (Intune settings catalog, Group Policy or registry). Cloud-only identities and cloud-only groups are supported: the requirement to create groups in AD DS applies only to hybrid identities (cloud-only groups also need the documented tag in the application manifest).
    fr: |
      Microsoft Entra Kerberos ne prend pas en charge la MFA pour l'accès aux partages de fichiers Azure : l'application du compte de stockage doit être exclue des stratégies d'accès conditionnel qui exigent la MFA pour toutes les applications. Les hôtes de session ont besoin du paramètre CloudKerberosTicketRetrievalEnabled (catalogue de paramètres Intune, stratégie de groupe ou Registre). Les identités et les groupes cloud uniquement sont pris en charge : l'obligation de créer les groupes dans AD DS ne concerne que les identités hybrides (les groupes cloud uniquement nécessitent aussi l'étiquette documentée dans le manifeste de l'application).
references:
  - title: Store FSLogix profile containers on Azure Files using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-profile-container-entra-id-hybrid
  - title: Enable Microsoft Entra Kerberos authentication for hybrid and cloud-only identities on Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-auth-hybrid-identities-enable
