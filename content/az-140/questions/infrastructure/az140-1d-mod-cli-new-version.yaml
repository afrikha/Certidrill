id: az140-1d-mod-cli-new-version
objective: "1.5.3"
type: dropdown
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    You modified the Azure Virtual Desktop golden image on a build virtual machine named **vm-build-14** in a resource group named **rg-images**. You ran Sysprep on vm-build-14 and it shut down.

    An Azure Compute Gallery named **galAvd** contains an image definition named **win11-multi** whose versions are 1.2.0, 1.2.1 and 1.3.0. Session hosts are deployed from win11-multi without a version number, so they use the latest version.

    You need to capture vm-build-14 as a new version that session hosts deployed after the capture will use.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez modifié l'image de référence Azure Virtual Desktop sur une machine virtuelle de build nommée **vm-build-14**, dans un groupe de ressources nommé **rg-images**. Vous avez exécuté Sysprep sur vm-build-14 et elle s'est arrêtée.

    Une galerie Azure Compute Gallery nommée **galAvd** contient une définition d'image nommée **win11-multi** dont les versions sont 1.2.0, 1.2.1 et 1.3.0. Les hôtes de session sont déployés à partir de win11-multi sans numéro de version : ils utilisent donc la version la plus récente.

    Vous devez capturer vm-build-14 comme nouvelle version qu'utiliseront les hôtes de session déployés après la capture.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm [[c1]] --resource-group rg-images --name vm-build-14
    az vm [[c2]] --resource-group rg-images --name vm-build-14

    az sig image-version create --resource-group rg-images \
      --gallery-name galAvd --gallery-image-definition win11-multi \
      --gallery-image-version [[ver]] \
      --virtual-machine /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-images/providers/Microsoft.Compute/virtualMachines/vm-build-14
  slots:
    - id: c1
      options:
        - { id: deallocate, text: deallocate }
        - { id: restart, text: restart }
        - { id: start, text: start }
    - id: c2
      options:
        - { id: capture, text: capture }
        - { id: generalize, text: generalize }
        - { id: redeploy, text: redeploy }
    - id: ver
      options:
        - { id: v121, text: 1.2.1 }
        - { id: v122, text: 1.2.2 }
        - { id: v140, text: 1.4.0 }
answer:
  values: { c1: deallocate, c2: generalize, ver: v140 }
explanation:
  correct:
    en: |
      After Sysprep, you deallocate the VM and mark it as generalized with `az vm generalize`, then create the gallery image version from it. When a session host references the image definition without a version, Azure picks the highest version (major, then minor, then patch) that isn't excluded from latest, so the new version must be higher than 1.3.0, such as 1.4.0.
    fr: |
      Après Sysprep, vous libérez la machine virtuelle et la marquez comme généralisée avec `az vm generalize`, puis vous créez la version d'image de la galerie à partir d'elle. Quand un hôte de session référence la définition d'image sans version, Azure choisit la version la plus élevée (majeure, puis mineure, puis correctif) qui n'est pas exclue de la plus récente : la nouvelle version doit donc être supérieure à 1.3.0, par exemple 1.4.0.
  options:
    restart: { en: "A generalized VM must not be restarted.", fr: "Une machine virtuelle généralisée ne doit pas être redémarrée." }
    start: { en: "Starting the VM would boot it after Sysprep; it must be deallocated instead.", fr: "Démarrer la machine virtuelle la relancerait après Sysprep ; elle doit être libérée." }
    capture: { en: "az vm capture creates a legacy managed image; the gallery version is created by az sig image-version create.", fr: "az vm capture crée une image managée héritée ; la version de galerie est créée par az sig image-version create." }
    redeploy: { en: "az vm redeploy moves the VM to another Azure host; it doesn't mark it as generalized.", fr: "az vm redeploy déplace la machine virtuelle vers un autre hôte Azure ; il ne la marque pas comme généralisée." }
    v121: { en: "Version 1.2.1 already exists.", fr: "La version 1.2.1 existe déjà." }
    v122: { en: "1.2.2 is lower than 1.3.0, so latest would still resolve to 1.3.0.", fr: "1.2.2 est inférieure à 1.3.0 : la plus récente resterait 1.3.0." }
references:
  - title: Remove machine specific information by deprovisioning or generalizing a VM before creating an image
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/generalize
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
