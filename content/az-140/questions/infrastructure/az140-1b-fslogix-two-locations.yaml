id: az140-1b-fslogix-two-locations
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** that uses FSLogix profile containers. The session hosts have the following registry value configured under `HKLM\SOFTWARE\FSLogix\Profiles`:

    `VHDLocations` = `\\stprofweu01.file.core.windows.net\profiles;\\stprofweu02.file.core.windows.net\profiles`

    Both storage accounts are available. You need to ensure that every change to a user's profile is written to both file shares, so that users can keep working if one storage account becomes unavailable.

    What should you do?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** qui utilise des conteneurs de profils FSLogix. La valeur de Registre suivante est configurée sur les hôtes de session sous `HKLM\SOFTWARE\FSLogix\Profiles` :

    `VHDLocations` = `\\stprofweu01.file.core.windows.net\profiles;\\stprofweu02.file.core.windows.net\profiles`

    Les deux comptes de stockage sont disponibles. Vous devez faire en sorte que chaque modification du profil d'un utilisateur soit écrite dans les deux partages de fichiers, afin que les utilisateurs puissent continuer à travailler si l'un des comptes de stockage devient indisponible.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the IsDynamic value to 0 so that each container is fully allocated in both locations.", fr: "Définir la valeur IsDynamic sur 0 pour que chaque conteneur soit entièrement alloué dans les deux emplacements." }
    - id: b
      text: { en: "Replace VHDLocations with CCDLocations and list both file shares as storage providers.", fr: "Remplacer VHDLocations par CCDLocations et indiquer les deux partages de fichiers comme fournisseurs de stockage." }
    - id: c
      text: { en: "Set the ProfileType value to 3 so that containers are opened in read-write or read-only mode.", fr: "Définir la valeur ProfileType sur 3 pour que les conteneurs soient ouverts en lecture-écriture ou en lecture seule." }
    - id: d
      text: { en: "Change the redundancy of the first storage account to replicate its data to the second one.", fr: "Modifier la redondance du premier compte de stockage pour répliquer ses données vers le second." }
answer: { optionId: b }
explanation:
  correct:
    en: Several paths in VHDLocations are alternatives, not copies. FSLogix looks for the container in the listed locations and creates it in the first one when none exists, so each profile lives in a single share. Cloud Cache, configured with CCDLocations, writes every change to all the listed providers and keeps working from its local cache when one provider is unavailable.
    fr: "Plusieurs chemins dans VHDLocations sont des alternatives, pas des copies. FSLogix recherche le conteneur dans les emplacements listés et le crée dans le premier quand il n'en existe aucun : chaque profil ne réside donc que dans un seul partage. Cloud Cache, configuré avec CCDLocations, écrit chaque modification dans tous les fournisseurs listés et continue de fonctionner à partir de son cache local quand un fournisseur est indisponible."
  options:
    a: { en: "IsDynamic only controls whether the VHD(x) file grows on demand or is fully allocated; it doesn't copy the container to a second location.", fr: "IsDynamic détermine seulement si le fichier VHD(x) croît à la demande ou est entièrement alloué ; il ne copie pas le conteneur vers un second emplacement." }
    c: { en: "ProfileType governs concurrent sessions on the same container (read-write or read-only); it has no effect on where data is written.", fr: "ProfileType régit les sessions simultanées sur un même conteneur (lecture-écriture ou lecture seule) ; il n'a aucun effet sur l'emplacement où les données sont écrites." }
    d: { en: "Storage redundancy replicates within a storage account (or to its paired region); it can't replicate to another storage account that FSLogix reads.", fr: "La redondance du stockage réplique au sein d'un compte de stockage (ou vers sa région jumelée) ; elle ne peut pas répliquer vers un autre compte de stockage lu par FSLogix." }
references:
  - title: Configuration Setting Reference
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
  - title: "Tutorial: Configure profile containers with Cloud Cache"
    url: https://learn.microsoft.com/en-us/fslogix/tutorial-cloud-cache-containers
