id: az140-1e-replica-zrs
objective: "1.5.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores the image of its Azure Virtual Desktop session hosts in an Azure Compute Gallery. Each month, a new image version is used to create **300** session hosts at the same time in West Europe, a region that has availability zones.

    You need to configure the West Europe target region of the next image version. The solution must meet the following requirements:

    - Follow Microsoft's recommendation for the number of replicas.
    - Keep the image available if one availability zone fails.
    - Minimize storage costs.

    Which two settings should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke l'image de ses hôtes de session Azure Virtual Desktop dans une galerie Azure Compute Gallery. Chaque mois, une nouvelle version d'image sert à créer **300** hôtes de session en même temps dans West Europe, une région qui dispose de zones de disponibilité.

    Vous devez configurer la région cible West Europe de la prochaine version d'image. La solution doit satisfaire les exigences suivantes :

    - Respecter la recommandation de Microsoft pour le nombre de réplicas.
    - Garder l'image disponible en cas de panne d'une zone de disponibilité.
    - Réduire au minimum les coûts de stockage.

    Quels sont les deux paramètres à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replica count: 3", fr: "Nombre de réplicas : 3" } }
    - { id: b, text: { en: "Replica count: 15", fr: "Nombre de réplicas : 15" } }
    - { id: c, text: { en: "Replica count: 100", fr: "Nombre de réplicas : 100" } }
    - { id: d, text: { en: "Storage account type: Premium_LRS", fr: "Type de compte de stockage : Premium_LRS" } }
    - { id: e, text: { en: "Storage account type: Standard_ZRS", fr: "Type de compte de stockage : Standard_ZRS" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Microsoft recommends one replica for every 20 VMs created concurrently, so 300 simultaneous session hosts need 15 replicas. Standard_ZRS stores the replicas across availability zones and provides resilience against a zonal failure, which locally redundant storage doesn't.
    fr: "Microsoft recommande un réplica pour 20 machines virtuelles créées simultanément : 300 hôtes de session simultanés exigent 15 réplicas. Standard_ZRS répartit les réplicas entre les zones de disponibilité et offre une résilience face à la panne d'une zone, ce que le stockage localement redondant n'offre pas."
  options:
    a: { en: "Three replicas is the minimum for production images, but it's far below one replica per 20 concurrent VMs for 300 VMs.", fr: "Trois réplicas est le minimum pour les images de production, mais c'est loin d'un réplica pour 20 machines virtuelles simultanées pour 300 machines virtuelles." }
    c: { en: "100 is the maximum per image version; it exceeds the recommendation and multiplies storage costs.", fr: "100 est le maximum par version d'image ; c'est au-delà de la recommandation et cela multiplie les coûts de stockage." }
    d: { en: "Premium_LRS is locally redundant, so it doesn't protect against a zone failure, and it costs more than standard storage.", fr: "Premium_LRS est localement redondant : il ne protège pas contre la panne d'une zone, et il coûte plus cher que le stockage standard." }
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
