id: az140-1b-org-mg-statements
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have the following management group hierarchy:

    - Tenant Root Group
      - **mg-landingzones**
        - **mg-avd**: contains the subscriptions Sub-AVD-Prod and Sub-AVD-Dev
      - **mg-sandbox**: contains no subscriptions

    An Azure Policy assignment that denies public IP addresses on network interfaces and an Azure RBAC assignment of the Desktop Virtualization Reader role to a group named **AVD-Auditors** are made at the scope of mg-avd.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de la hiérarchie de groupes d'administration suivante :

    - Tenant Root Group
      - **mg-landingzones**
        - **mg-avd** : contient les abonnements Sub-AVD-Prod et Sub-AVD-Dev
      - **mg-sandbox** : ne contient aucun abonnement

    Une attribution Azure Policy qui refuse les adresses IP publiques sur les interfaces réseau et une attribution Azure RBAC du rôle Desktop Virtualization Reader à un groupe nommé **AVD-Auditors** sont effectuées à l'étendue de mg-avd.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: AVD-Auditors can view the host pools in the resource groups of Sub-AVD-Prod.
        fr: AVD-Auditors peut consulter les pools d'hôtes des groupes de ressources de Sub-AVD-Prod.
    - id: s2
      text:
        en: Sub-AVD-Dev can be placed in both mg-avd and mg-sandbox at the same time.
        fr: Sub-AVD-Dev peut être placé en même temps dans mg-avd et dans mg-sandbox.
    - id: s3
      text:
        en: If you move Sub-AVD-Dev to mg-sandbox, the policy assignment made at mg-avd no longer applies to Sub-AVD-Dev.
        fr: Si vous déplacez Sub-AVD-Dev vers mg-sandbox, l'attribution de stratégie effectuée sur mg-avd ne s'applique plus à Sub-AVD-Dev.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Role and policy assignments made on a management group are inherited by its subscriptions, their resource groups and resources. A subscription has exactly one parent management group at a time. When a subscription moves to another management group, it stops inheriting the assignments of the old parent and inherits those of the new one.
    fr: |
      Les attributions de rôles et de stratégies effectuées sur un groupe d'administration sont héritées par ses abonnements, leurs groupes de ressources et leurs ressources. Un abonnement n'a qu'un seul groupe d'administration parent à la fois. Quand un abonnement est déplacé vers un autre groupe d'administration, il cesse d'hériter des attributions de l'ancien parent et hérite de celles du nouveau.
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
