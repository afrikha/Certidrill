id: az140-1a-st-data-placement
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware is planning the user data storage for a pooled Azure Virtual Desktop host pool. Some users already have a third-party profile solution that Litware must keep. Applications will be delivered with App attach.

    Where should you store each type of data? To answer, drag the appropriate storage options to the correct data types. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware planifie le stockage des données utilisateur d'un pool d'hôtes Azure Virtual Desktop partagé. Certains utilisateurs disposent déjà d'une solution de profils tierce que Litware doit conserver. Les applications seront distribuées avec App attach.

    Où devez-vous stocker chaque type de données ? Pour répondre, faites glisser les options de stockage appropriées vers les types de données correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: profile, text: { en: "An FSLogix profile container on an SMB share", fr: "Un conteneur de profil FSLogix sur un partage SMB" } }
    - { id: odfc, text: { en: "An FSLogix ODFC container on an SMB share", fr: "Un conteneur ODFC FSLogix sur un partage SMB" } }
    - { id: appshare, text: { en: "A dedicated SMB share read by the session hosts", fr: "Un partage SMB dédié lu par les hôtes de session" } }
    - { id: local, text: { en: "A local profile on the OS disk of each session host", fr: "Un profil local sur le disque du système d'exploitation de chaque hôte de session" } }
    - { id: blob, text: { en: "A blob container in a general-purpose v2 account", fr: "Un conteneur d'objets blob dans un compte v2 universel" } }
  targets:
    - { id: t1, text: { en: "Complete user profiles of users without another profile solution", fr: "Profils complets des utilisateurs qui n'ont pas d'autre solution de profils" } }
    - { id: t2, text: { en: "Microsoft 365 Apps data only (Outlook cache, Teams), for users who keep the third-party profile solution", fr: "Uniquement les données des Microsoft 365 Apps (cache Outlook, Teams), pour les utilisateurs qui conservent la solution de profils tierce" } }
    - { id: t3, text: { en: "App attach images", fr: "Images App attach" } }
answer:
  mapping: { t1: profile, t2: odfc, t3: appshare }
explanation:
  correct:
    en: |
      In a pooled host pool, users can land on a different session host at each sign-in, so complete profiles go into FSLogix profile containers on an SMB share. The ODFC container holds only Microsoft 365 Apps data and is designed to work alongside another profile solution. App attach images are mounted by the session hosts from an SMB share, such as an Azure Files share.
    fr: |
      Dans un pool d'hôtes partagé, les utilisateurs peuvent arriver sur un hôte de session différent à chaque connexion : les profils complets vont donc dans des conteneurs de profils FSLogix sur un partage SMB. Le conteneur ODFC ne contient que les données des Microsoft 365 Apps et est conçu pour fonctionner à côté d'une autre solution de profils. Les images App attach sont montées par les hôtes de session depuis un partage SMB, par exemple un partage Azure Files.
  options:
    local: { en: "A local profile stays on one VM, which breaks in a pooled host pool where users change session hosts.", fr: "Un profil local reste sur une seule machine virtuelle, ce qui ne fonctionne pas dans un pool d'hôtes partagé où les utilisateurs changent d'hôte de session." }
    blob: { en: "FSLogix containers and App attach images are accessed over SMB, not from blob containers.", fr: "Les conteneurs FSLogix et les images App attach sont accessibles en SMB, pas depuis des conteneurs d'objets blob." }
references:
  - title: User profile management for Azure Virtual Desktop with FSLogix profile containers
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-containers-azure-files
  - title: Azure Files guidance for virtual desktop workloads
    url: https://learn.microsoft.com/en-us/azure/storage/files/virtual-desktop-workloads
