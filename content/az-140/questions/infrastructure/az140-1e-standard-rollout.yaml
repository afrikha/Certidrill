id: az140-1e-standard-rollout
objective: "1.5.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **Pool2** that uses standard management (no session host configuration). Pool2 contains six session hosts deployed from image version **1.2.0** of an Azure Compute Gallery image definition.

    You created image version **1.3.0**, which contains the latest OS and application updates, and replicated it to the region of Pool2. You need to move all the users of Pool2 to session hosts based on 1.3.0 without disconnecting active sessions. After the old session hosts have no sessions, you'll remove them from Pool2 and delete them.

    Which two actions should you perform first? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **Pool2** qui utilise la gestion standard (sans configuration d'hôte de session). Pool2 contient six hôtes de session déployés à partir de la version d'image **1.2.0** d'une définition d'image Azure Compute Gallery.

    Vous avez créé la version d'image **1.3.0**, qui contient les dernières mises à jour du système d'exploitation et des applications, et l'avez répliquée dans la région de Pool2. Vous devez faire passer tous les utilisateurs de Pool2 sur des hôtes de session basés sur 1.3.0 sans déconnecter les sessions actives. Quand les anciens hôtes de session n'auront plus de session, vous les retirerez de Pool2 et les supprimerez.

    Quelles sont les deux actions à effectuer en premier ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add six session hosts to Pool2 from image version 1.3.0.", fr: "Ajouter six hôtes de session à Pool2 à partir de la version d'image 1.3.0." } }
    - { id: b, text: { en: "Schedule a session host update on Pool2 that uses image version 1.3.0.", fr: "Planifier sur Pool2 une mise à jour des hôtes de session qui utilise la version d'image 1.3.0." } }
    - { id: c, text: { en: "Turn on drain mode on the six existing session hosts.", fr: "Activer le mode drainage sur les six hôtes de session existants." } }
    - { id: d, text: { en: "Set Exclude from latest to true on image version 1.2.0.", fr: "Définir Exclure de la dernière version (Exclude from latest) sur true pour la version d'image 1.2.0." } }
    - { id: e, text: { en: "Send a message to all users, then sign them out of the six existing session hosts.", fr: "Envoyer un message à tous les utilisateurs, puis les déconnecter des six hôtes de session existants." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: On a host pool with standard management, you roll out a new image by deploying new session hosts from the new version and putting the old hosts in drain mode. Drain mode blocks new sessions on the old hosts without ending the existing ones, so users land on the new hosts at their next sign-in, and the old hosts can be removed once they're empty.
    fr: "Sur un pool d'hôtes en gestion standard, on déploie une nouvelle image en créant de nouveaux hôtes de session à partir de la nouvelle version et en mettant les anciens hôtes en mode drainage. Le mode drainage bloque les nouvelles sessions sur les anciens hôtes sans fermer les sessions existantes : les utilisateurs arrivent sur les nouveaux hôtes à leur prochaine connexion, et les anciens hôtes peuvent être retirés une fois vides."
  options:
    b: { en: "Session host update is available only for host pools that use a session host configuration.", fr: "La mise à jour des hôtes de session n'est disponible que pour les pools d'hôtes qui utilisent une configuration d'hôte de session." }
    d: { en: "Exclude from latest affects only new deployments that reference the definition; it changes nothing on the existing hosts.", fr: "L'exclusion de la dernière version ne concerne que les nouveaux déploiements qui référencent la définition ; elle ne change rien aux hôtes existants." }
    e: { en: "Signing users out ends their active sessions, which the requirement forbids.", fr: "Déconnecter les utilisateurs ferme leurs sessions actives, ce que l'exigence interdit." }
references:
  - title: Session host update for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
  - title: Add session hosts to a host pool
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/add-session-hosts-host-pool
