id: az140-1c-hp-shc-fixed
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named HP-Ops that was created with the standard management approach. HP-Ops contains 20 session hosts that an operations team deploys with scripts.

    You need a design in which Azure Virtual Desktop creates the session hosts from a defined image, VM size and domain join, updates them through session host update when the image changes, and lets autoscale create and delete hosts.

    What should you recommend?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop regroupé nommé HP-Ops, créé avec l'approche de gestion standard. HP-Ops contient 20 hôtes de session qu'une équipe d'exploitation déploie avec des scripts.

    Vous avez besoin d'une conception dans laquelle Azure Virtual Desktop crée les hôtes de session à partir d'une image, d'une taille de machine virtuelle et d'une jonction de domaine définies, les met à jour par la mise à jour des hôtes de session quand l'image change, et laisse la mise à l'échelle automatique créer et supprimer des hôtes.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create a new pooled host pool that uses a session host configuration, and move the users to it", fr: "Créer un nouveau pool d'hôtes regroupé qui utilise une configuration d'hôte de session, et y déplacer les utilisateurs" } }
    - { id: b, text: { en: "Add a session host configuration to HP-Ops from the host pool's Properties page", fr: "Ajouter une configuration d'hôte de session à HP-Ops depuis la page Properties du pool d'hôtes" } }
    - { id: c, text: { en: "Convert HP-Ops to a personal host pool, and then add a session host configuration", fr: "Convertir HP-Ops en pool d'hôtes personnel, puis ajouter une configuration d'hôte de session" } }
    - { id: d, text: { en: "Assign HP-Ops a scaling plan that uses dynamic autoscaling, and keep the scripts", fr: "Attribuer à HP-Ops un plan de mise à l'échelle avec mise à l'échelle dynamique, et conserver les scripts" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The management approach is chosen when the host pool is created and can't be changed; you can't add a session host configuration to a host pool created without one. The requirements describe the session host configuration approach (configuration, session host update and autoscale that creates and deletes hosts), so you need a new pooled host pool that uses it.
    fr: |
      L'approche de gestion est choisie à la création du pool d'hôtes et ne peut pas être modifiée ; vous ne pouvez pas ajouter de configuration d'hôte de session à un pool créé sans. Les exigences décrivent l'approche par configuration d'hôte de session (configuration, mise à jour des hôtes de session et mise à l'échelle automatique qui crée et supprime des hôtes) : il faut donc un nouveau pool d'hôtes regroupé qui l'utilise.
  options:
    b: { en: "A session host configuration can't be added to a host pool that was created with standard management.", fr: "Une configuration d'hôte de session ne peut pas être ajoutée à un pool d'hôtes créé avec la gestion standard." }
    c: { en: "The session host configuration approach supports pooled host pools only.", fr: "L'approche par configuration d'hôte de session ne prend en charge que les pools d'hôtes regroupés." }
    d: { en: "Dynamic autoscaling requires a pooled host pool with a session host configuration; standard host pools use power management only.", fr: "La mise à l'échelle dynamique exige un pool d'hôtes regroupé avec une configuration d'hôte de session ; les pools standard n'utilisent que la gestion de l'alimentation." }
references:
  - title: Host pool management approaches for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-management-approaches
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
