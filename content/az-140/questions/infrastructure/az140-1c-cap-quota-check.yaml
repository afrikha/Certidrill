id: az140-1c-cap-quota-check
objective: "1.3.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy 30 Azure Virtual Desktop session hosts of the D8s_v5 size in the West Europe region of a subscription named Sub1.

    You need to verify that Sub1 can deploy the session hosts, and fix any shortfall.

    How should you complete the procedure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de déployer 30 hôtes de session Azure Virtual Desktop de taille D8s_v5 dans la région West Europe d'un abonnement nommé Sub1.

    Vous devez vérifier que Sub1 peut déployer les hôtes de session, et corriger tout manque.

    Comment devez-vous compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To view the current usage and limits of the Total Regional vCPUs and Standard DSv5 Family vCPUs quotas, run [[cmd]].

      If the 240 planned vCPUs plus the current usage exceed a limit, [[act]].
    fr: |
      Pour afficher l'utilisation et les limites actuelles des quotas Total Regional vCPUs et Standard DSv5 Family vCPUs, exécutez [[cmd]].

      Si les 240 vCPU prévus, ajoutés à l'utilisation actuelle, dépassent une limite, [[act]].
  slots:
    - id: cmd
      options:
        - { id: usage, text: "`az vm list-usage --location westeurope -o table`" }
        - { id: sizes, text: "`az vm list-sizes --location westeurope -o table`" }
        - { id: skus, text: "`az vm list-skus --location westeurope -o table`" }
    - id: act
      options:
        - { id: increase, text: { en: "request a quota increase for Sub1", fr: "demandez une augmentation de quota pour Sub1" } }
        - { id: dealloc, text: { en: "deallocate the existing VMs in the region", fr: "libérez les machines virtuelles existantes de la région" } }
        - { id: reserve, text: { en: "create an on-demand capacity reservation", fr: "créez une réservation de capacité à la demande" } }
answer:
  values: { cmd: usage, act: increase }
explanation:
  correct:
    en: "`az vm list-usage` returns, for a region, the current value and the limit of each quota, including Total Regional vCPUs and each VM family. A deployment is blocked if it exceeds either the family or the regional quota; the fix is a quota increase request (or deleting VMs you no longer need)."
    fr: "`az vm list-usage` renvoie, pour une région, la valeur actuelle et la limite de chaque quota, dont Total Regional vCPUs et chaque famille de machines virtuelles. Un déploiement est bloqué s'il dépasse le quota de la famille ou le quota régional ; la correction est une demande d'augmentation de quota (ou la suppression de machines virtuelles devenues inutiles)."
  options:
    sizes: { en: "list-sizes lists the VM sizes available in a region, not the quota usage.", fr: "list-sizes liste les tailles de machines virtuelles disponibles dans une région, pas l'utilisation des quotas." }
    skus: { en: "list-skus shows SKUs and their restrictions, not the current quota usage and limits.", fr: "list-skus affiche les SKU et leurs restrictions, pas l'utilisation et les limites actuelles des quotas." }
    dealloc: { en: "Deallocated VMs still count toward vCPU quota.", fr: "Les machines virtuelles libérées comptent toujours dans le quota de vCPU." }
    reserve: { en: "A capacity reservation guarantees capacity; it doesn't raise the quota, which Azure checks separately.", fr: "Une réservation de capacité garantit de la capacité ; elle n'augmente pas le quota, qu'Azure vérifie séparément." }
references:
  - title: Check vCPU quotas
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/quotas
