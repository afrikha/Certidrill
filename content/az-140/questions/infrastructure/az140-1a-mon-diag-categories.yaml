id: az140-1a-mon-diag-categories
objective: "1.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are creating a diagnostic setting for an Azure Virtual Desktop host pool named **HP1**. The setting sends logs to a Log Analytics workspace that Azure Virtual Desktop Insights uses.

    You need the setting to populate the WVDConnectionNetworkData table, which holds the round-trip time and bandwidth of connections.

    Which two selections meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un paramètre de diagnostic pour un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Le paramètre envoie les journaux vers un espace de travail Log Analytics qu'utilise Azure Virtual Desktop Insights.

    Le paramètre doit alimenter la table WVDConnectionNetworkData, qui contient la durée aller-retour et la bande passante des connexions.

    Quelles sont les deux sélections qui répondent à l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Connection Logs }
    - { id: b, text: Connection Graphics Data Logs Preview }
    - { id: c, text: allLogs }
    - { id: d, text: Error Logs }
    - { id: e, text: Network Data Logs }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      The **Network Data Logs** category feeds WVDConnectionNetworkData. The **allLogs** category group collects every table, including tables added in the future, so it also meets the requirement.
    fr: |
      La catégorie **Network Data Logs** alimente WVDConnectionNetworkData. Le groupe de catégories **allLogs** collecte toutes les tables, y compris celles ajoutées à l'avenir : il répond donc aussi à l'exigence.
  options:
    a: { en: "Connection Logs hold the connection state records (WVDConnections), not the network samples.", fr: "Connection Logs contient les enregistrements d'état des connexions (WVDConnections), pas les échantillons réseau." }
    b: { en: "This preview category collects graphics data of connections, not the network data table.", fr: "Cette catégorie en préversion collecte les données graphiques des connexions, pas la table des données réseau." }
    d: { en: "Error Logs hold errors (WVDErrors), not round-trip time and bandwidth.", fr: "Error Logs contient les erreurs (WVDErrors), pas la durée aller-retour ni la bande passante." }
references:
  - title: Collect and query connection quality data
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/connection-quality-monitoring
