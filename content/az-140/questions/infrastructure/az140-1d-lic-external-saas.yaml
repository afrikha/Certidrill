id: az140-1d-lic-external-saas
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys sells a commercial inventory application to other companies. The application is published as RemoteApp from an Azure Virtual Desktop host pool whose session hosts run Windows 11 Enterprise multi-session. The customers' users sign in with accounts in the Tailspin Microsoft Entra tenant.

    You need to license the customers' access to Azure Virtual Desktop. Tailspin must not buy Microsoft 365 or Windows licenses for the customers.

    What should you use?
  fr: |
    Tailspin Toys vend une application commerciale de gestion des stocks à d'autres entreprises. L'application est publiée en RemoteApp depuis un pool d'hôtes Azure Virtual Desktop dont les hôtes de session exécutent Windows 11 Entreprise multisession. Les utilisateurs des clients se connectent avec des comptes du locataire Microsoft Entra de Tailspin.

    Vous devez couvrir par des licences l'accès des clients à Azure Virtual Desktop. Tailspin ne doit pas acheter de licences Microsoft 365 ou Windows pour les clients.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Per-user access pricing on an enrolled Azure subscription", fr: "La tarification de l'accès par utilisateur sur un abonnement Azure inscrit" } }
    - { id: b, text: { en: "RDS CALs with Software Assurance issued by a license server", fr: "Des CAL RDS avec Software Assurance délivrées par un serveur de licences" } }
    - { id: c, text: { en: "Microsoft Entra ID P1 licenses assigned to the customer accounts", fr: "Des licences Microsoft Entra ID P1 attribuées aux comptes des clients" } }
    - { id: d, text: { en: "Azure Hybrid Benefit on the session host virtual machines", fr: "Azure Hybrid Benefit sur les machines virtuelles hôtes de session" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Per-user access pricing licenses external commercial users, such as customers of a SaaS application. You enroll an Azure subscription, and each user who connects at least once in the month is billed on the Azure invoice of that subscription, at the Apps or Desktops + apps price.
    fr: |
      La tarification de l'accès par utilisateur couvre les utilisateurs commerciaux externes, comme les clients d'une application SaaS. Vous inscrivez un abonnement Azure, et chaque utilisateur qui se connecte au moins une fois dans le mois est facturé sur la facture Azure de cet abonnement, au prix Apps ou Desktops + apps.
  options:
    b:
      en: RDS CALs license access to Windows Server session hosts, not Windows 11 Enterprise multi-session.
      fr: Les CAL RDS couvrent l'accès aux hôtes de session Windows Server, pas à Windows 11 Entreprise multisession.
    c:
      en: Microsoft Entra ID P1 isn't an eligible license for Azure Virtual Desktop access rights.
      fr: Microsoft Entra ID P1 n'est pas une licence éligible donnant des droits d'accès à Azure Virtual Desktop.
    d:
      en: Azure Hybrid Benefit reduces the price of Windows Server virtual machines; it gives users no access rights.
      fr: Azure Hybrid Benefit réduit le prix des machines virtuelles Windows Server ; il ne donne aucun droit d'accès aux utilisateurs.
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
