id: az140-1a-pl-subresources
objective: "1.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys plans to make all its Azure Virtual Desktop traffic private by using Azure Private Link.

    Which sub-resource should you select when you create the private endpoint for each workflow? To answer, drag the appropriate sub-resources to the correct workflows. Each sub-resource may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de rendre privé tout son trafic Azure Virtual Desktop à l'aide d'Azure Private Link.

    Quelle sous-ressource devez-vous sélectionner lors de la création du point de terminaison privé de chaque flux de travail ? Pour répondre, faites glisser les sous-ressources appropriées vers les flux de travail correspondants. Chaque sous-ressource peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: connection, text: connection }
    - { id: feed, text: feed }
    - { id: global, text: global }
    - { id: file, text: file }
    - { id: blob, text: blob }
  targets:
    - { id: discovery, text: { en: "Initial feed discovery (one endpoint for all deployments)", fr: "Découverte initiale du flux (un point de terminaison pour tous les déploiements)" } }
    - { id: download, text: { en: "Feed download (one endpoint per workspace)", fr: "Téléchargement du flux (un point de terminaison par espace de travail)" } }
    - { id: sessions, text: { en: "Connections to a host pool (one endpoint per host pool)", fr: "Connexions à un pool d'hôtes (un point de terminaison par pool d'hôtes)" } }
answer:
  mapping: { discovery: global, download: feed, sessions: connection }
explanation:
  correct:
    en: |
      Azure Virtual Desktop has three Private Link sub-resources: `global` on a workspace for initial feed discovery (one for all deployments), `feed` on each workspace for the feed download, and `connection` on each host pool for the connections. `file` and `blob` are Azure Storage sub-resources, used for example to reach a profile share privately, not for Azure Virtual Desktop service traffic.
    fr: |
      Azure Virtual Desktop dispose de trois sous-ressources Private Link : `global` sur un espace de travail pour la découverte initiale du flux (une pour tous les déploiements), `feed` sur chaque espace de travail pour le téléchargement du flux, et `connection` sur chaque pool d'hôtes pour les connexions. `file` et `blob` sont des sous-ressources de Stockage Azure, utilisées par exemple pour joindre un partage de profils de façon privée, pas pour le trafic du service Azure Virtual Desktop.
references:
  - title: Azure Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-overview
