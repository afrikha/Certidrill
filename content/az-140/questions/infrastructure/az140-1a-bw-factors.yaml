id: az140-1a-bw-factors
objective: "1.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Users of an Azure Virtual Desktop host pool named **HP1** work with the default graphics mode on a single monitor. You are reviewing which changes in their usage would increase the bandwidth required by their RDP sessions.

    Which two changes increase the bandwidth required by an RDP session?

    NOTE: Each correct selection is worth one point.
  fr: |
    Les utilisateurs d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** travaillent avec le mode graphique par défaut sur un seul écran. Vous examinez les changements d'usage qui augmenteraient la bande passante nécessaire à leurs sessions RDP.

    Quels sont les deux changements qui augmentent la bande passante nécessaire à une session RDP ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A user moves the same light workload to a display with a higher resolution.", fr: "Un utilisateur déplace la même charge de travail légère vers un écran de résolution plus élevée." } }
    - { id: b, text: { en: "A user minimizes the client window while a long report is generated.", fr: "Un utilisateur réduit la fenêtre du client pendant la génération d'un long rapport." } }
    - { id: c, text: { en: "An application starts to display animated content at a higher frame rate.", fr: "Une application commence à afficher du contenu animé à une fréquence d'images plus élevée." } }
    - { id: d, text: { en: "A user switches from web browsing to typing text in Microsoft Word.", fr: "Un utilisateur passe de la navigation web à la saisie de texte dans Microsoft Word." } }
    - { id: e, text: { en: "A user leaves the session idle during a one-hour meeting.", fr: "Un utilisateur laisse la session inactive pendant une réunion d'une heure." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      RDP sends only the regions of the screen that change, so a higher output frame rate or a higher display resolution increases the bandwidth needed. Microsoft notes that even a light workload on a high-resolution display needs more bandwidth than on a regular display.
    fr: |
      RDP n'envoie que les zones de l'écran qui changent : une fréquence d'images plus élevée ou une résolution d'affichage plus élevée augmente donc la bande passante nécessaire. Microsoft précise que même une charge légère sur un écran haute résolution demande plus de bande passante que sur un écran ordinaire.
  options:
    b: { en: "A minimized client window receives no graphics updates, so bandwidth drops.", fr: "Une fenêtre de client réduite ne reçoit aucune mise à jour graphique : la bande passante diminue." }
    d: { en: "In default mode, Word uses about 100–150 Kbps, far less than web browsing (about 6–6.5 Mbps).", fr: "En mode par défaut, Word utilise environ 100–150 Kbit/s, bien moins que la navigation web (environ 6–6,5 Mbit/s)." }
    e: { en: "An idle session sends almost nothing (about 0.3 Kbps).", fr: "Une session inactive n'envoie presque rien (environ 0,3 Kbit/s)." }
references:
  - title: Direct Stream (DS) bandwidth requirements
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-bandwidth
