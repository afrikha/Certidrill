id: az140-1b-os-characteristics
objective: "1.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are preparing an operating system guide for the Azure Virtual Desktop architects of Contoso, Ltd. Users are licensed with Microsoft 365 E3, and Contoso also owns RDS CALs with Software Assurance.

    Which operating system matches each description? To answer, drag the appropriate operating systems to the correct descriptions. Each operating system may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez un guide des systèmes d'exploitation pour les architectes Azure Virtual Desktop de Contoso, Ltd. Les utilisateurs disposent de licences Microsoft 365 E3, et Contoso possède aussi des CAL RDS avec Software Assurance.

    Quel système d'exploitation correspond à chaque description ? Pour répondre, faites glisser les systèmes d'exploitation appropriés vers les descriptions correspondantes. Chaque système d'exploitation peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ws, text: Windows Server 2025 }
    - { id: w11ms, text: Windows 11 Enterprise multi-session }
    - { id: w11, text: Windows 11 Enterprise }
    - { id: ltsc, text: Windows 11 Enterprise LTSC 2024 }
    - { id: w10ms, text: Windows 10 Enterprise multi-session }
  targets:
    - { id: t1, text: { en: "Accepts several concurrent sessions and requires RDS CALs", fr: "Accepte plusieurs sessions simultanées et exige des CAL RDS" } }
    - { id: t2, text: { en: "Windows 11 experience with several concurrent sessions, covered by the users' Microsoft 365 E3 licenses", fr: "Expérience Windows 11 avec plusieurs sessions simultanées, couverte par les licences Microsoft 365 E3 des utilisateurs" } }
    - { id: t3, text: { en: "Windows 11 experience with one session per VM, for personal host pools", fr: "Expérience Windows 11 avec une session par machine virtuelle, pour les pools d'hôtes personnels" } }
    - { id: t4, text: { en: "Not supported as a session host operating system", fr: "Non pris en charge comme système d'exploitation d'hôte de session" } }
answer:
  mapping: { t1: ws, t2: w11ms, t3: w11, t4: ltsc }
explanation:
  correct:
    en: |
      Windows Server session hosts accept several sessions and require RDS CALs with Software Assurance (or RDS User Subscription Licenses). Windows 11 Enterprise multi-session and Windows 11 Enterprise are covered by eligible per-user licenses such as Microsoft 365 E3; the first accepts several sessions, the second one. LTSC editions aren't supported for session hosts.
    fr: |
      Les hôtes de session Windows Server acceptent plusieurs sessions et exigent des CAL RDS avec Software Assurance (ou des licences d'abonnement utilisateur RDS). Windows 11 Entreprise multisession et Windows 11 Entreprise sont couverts par des licences par utilisateur éligibles comme Microsoft 365 E3 ; le premier accepte plusieurs sessions, le second une seule. Les éditions LTSC ne sont pas prises en charge pour les hôtes de session.
  options:
    w10ms: { en: "Windows 10 Enterprise multi-session is supported and accepts several sessions, but it provides the Windows 10 experience, not Windows 11.", fr: "Windows 10 Entreprise multisession est pris en charge et accepte plusieurs sessions, mais il offre l'expérience Windows 10, pas Windows 11." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
