id: az140-1c-hp-hotarea-pools
objective: "1.3.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso has the Azure Virtual Desktop host pools shown in the following table. Each host pool contains session hosts.

    Answer each prompt by selecting the host pool in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose des pools d'hôtes Azure Virtual Desktop indiqués dans le tableau suivant. Chaque pool d'hôtes contient des hôtes de session.

    Répondez à chaque consigne en sélectionnant le pool d'hôtes dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The host pool to which you add session hosts by increasing the host pool size, without generating a registration key", fr: "Le pool d'hôtes auquel vous ajoutez des hôtes de session en augmentant la taille du pool, sans générer de clé d'inscription" }
    - id: p2
      text: { en: "The host pool in which you can enable Assign multiple desktops to a single user without changing any other property", fr: "Le pool d'hôtes dans lequel vous pouvez activer Assign multiple desktops to a single user sans modifier aucune autre propriété" }
  grid:
    header: [{ en: "Name", fr: "Nom" }, { en: "Host pool type", fr: "Type de pool d'hôtes" }, { en: "Load balancing or assignment", fr: "Équilibrage de charge ou attribution" }, { en: "Management approach", fr: "Approche de gestion" }]
    rows:
      - [{ text: HP1, area: hp1 }, { text: Pooled }, { text: Breadth-first }, { text: Standard }]
      - [{ text: HP2, area: hp2 }, { text: Pooled }, { text: Depth-first }, { text: { en: "Session host configuration", fr: "Configuration d'hôte de session" } }]
      - [{ text: HP3, area: hp3 }, { text: Personal }, { text: Automatic }, { text: Standard }]
      - [{ text: HP4, area: hp4 }, { text: Personal }, { text: Direct }, { text: Standard }]
answer:
  values: { p1: hp2, p2: hp4 }
explanation:
  correct:
    en: |
      In a host pool that uses a session host configuration, you add session hosts by increasing the host pool size, and the service creates them from the configuration; standard host pools use a registration key. Multiple desktops per user work only in personal host pools with the Direct assignment type, so HP4 can enable the setting directly, whereas HP3 would first need to switch to Direct.
    fr: |
      Dans un pool d'hôtes qui utilise une configuration d'hôte de session, vous ajoutez des hôtes de session en augmentant la taille du pool, et le service les crée à partir de la configuration ; les pools standard utilisent une clé d'inscription. Plusieurs bureaux par utilisateur ne fonctionnent que dans les pools d'hôtes personnels avec le type d'attribution Direct : HP4 peut activer le paramètre directement, alors que HP3 devrait d'abord passer en Direct.
  options:
    hp1: { en: "HP1 uses standard management: new hosts register with a registration key.", fr: "HP1 utilise la gestion standard : les nouveaux hôtes s'inscrivent avec une clé d'inscription." }
    hp3: { en: "HP3 uses automatic assignment; multiple desktops require Direct first.", fr: "HP3 utilise l'attribution automatique ; plusieurs bureaux exigent d'abord Direct." }
references:
  - title: Host pool management approaches for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-management-approaches
  - title: Configure personal desktop assignment in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
