id: az140-1a-net-firewall-rules
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The session hosts of an Azure Virtual Desktop host pool named **HP1** are in a spoke virtual network. A user-defined route sends all their internet-bound traffic to an Azure Firewall named **FW1** in the hub. FW1 currently allows only outbound TCP 443 to `login.microsoftonline.com`.

    The session hosts appear as **Unavailable** in HP1, and Windows on the session hosts isn't activated.

    You need to resolve both issues. The solution must allow only the required traffic.

    Which two rules should you add to FW1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les hôtes de session d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** se trouvent dans un réseau virtuel spoke. Un itinéraire défini par l'utilisateur envoie tout leur trafic à destination d'Internet vers un Pare-feu Azure nommé **FW1** dans le hub. FW1 n'autorise actuellement que TCP 443 sortant vers `login.microsoftonline.com`.

    Les hôtes de session apparaissent comme **Unavailable** dans HP1, et Windows n'est pas activé sur les hôtes de session.

    Vous devez résoudre les deux problèmes. La solution ne doit autoriser que le trafic requis.

    Quelles sont les deux règles à ajouter à FW1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A DNAT rule that forwards TCP 3389 from the internet to the session hosts", fr: "Une règle DNAT qui transfère TCP 3389 d'Internet vers les hôtes de session" } }
    - { id: b, text: { en: "A rule that allows outbound TCP 443 to *.wvd.microsoft.com", fr: "Une règle qui autorise TCP 443 sortant vers *.wvd.microsoft.com" } }
    - { id: c, text: { en: "A rule that allows outbound TCP 445 to *.wvd.microsoft.com", fr: "Une règle qui autorise TCP 445 sortant vers *.wvd.microsoft.com" } }
    - { id: d, text: { en: "A rule that allows outbound TCP 1688 to azkms.core.windows.net", fr: "Une règle qui autorise TCP 1688 sortant vers azkms.core.windows.net" } }
    - { id: e, text: { en: "A rule that allows outbound TCP 3390 to 51.5.0.0/16", fr: "Une règle qui autorise TCP 3390 sortant vers 51.5.0.0/16" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Session hosts need outbound TCP 443 to `*.wvd.microsoft.com` for the service traffic, including the agent's channel to the broker and TCP-based RDP; without it, they can't report as available. Windows activation uses `azkms.core.windows.net` on TCP 1688.
    fr: |
      Les hôtes de session ont besoin de TCP 443 sortant vers `*.wvd.microsoft.com` pour le trafic du service, y compris le canal de l'agent vers le broker et RDP sur TCP ; sans lui, ils ne peuvent pas se signaler comme disponibles. L'activation de Windows utilise `azkms.core.windows.net` sur TCP 1688.
  options:
    a: { en: "Users never connect inbound to session hosts; reverse connect uses outbound connections only.", fr: "Les utilisateurs ne se connectent jamais en entrée aux hôtes de session ; reverse connect n'utilise que des connexions sortantes." }
    c: { en: "TCP 445 is SMB; the Azure Virtual Desktop service endpoints use TCP 443.", fr: "TCP 445 correspond à SMB ; les points de terminaison du service Azure Virtual Desktop utilisent TCP 443." }
    e: { en: "51.5.0.0/16 is the relayed RDP (TURN) range, reached over UDP 3478, and it doesn't affect availability or activation.", fr: "51.5.0.0/16 est la plage RDP relayée (TURN), jointe en UDP 3478, et elle n'a aucun effet sur la disponibilité ni sur l'activation." }
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
