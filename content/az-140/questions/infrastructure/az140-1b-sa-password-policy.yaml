id: az140-1b-sa-password-policy
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a storage account named **stavdprof06** that is joined to the contoso.com AD DS domain as a computer account in an OU named **OU=Storage**. A Group Policy object linked to OU=Storage enforces a maximum password age of 60 days.

    Users of an Azure Virtual Desktop host pool recently lost access to their FSLogix profiles until an administrator updated the password of the storage account's AD DS object.

    You need to prevent this issue from recurring. The solution must not require a recurring administrative task.

    What should you do?
  fr: |
    Vous disposez d'un compte de stockage nommé **stavdprof06** joint au domaine AD DS contoso.com en tant que compte d'ordinateur dans une unité d'organisation nommée **OU=Storage**. Un objet de stratégie de groupe lié à OU=Storage impose une durée de vie maximale du mot de passe de 60 jours.

    Les utilisateurs d'un pool d'hôtes Azure Virtual Desktop ont récemment perdu l'accès à leurs profils FSLogix jusqu'à ce qu'un administrateur mette à jour le mot de passe de l'objet AD DS du compte de stockage.

    Vous devez empêcher ce problème de se reproduire. La solution ne doit pas nécessiter de tâche d'administration récurrente.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Move the AD DS object of stavdprof06 to an OU whose policy doesn't require password rotation.", fr: "Déplacer l'objet AD DS de stavdprof06 vers une unité d'organisation dont la stratégie n'exige pas de rotation du mot de passe." }
    - id: b
      text: { en: "Run Update-AzStorageAccountADObjectPassword with -RotateToKerbKey kerb2 before each expiry.", fr: "Exécuter Update-AzStorageAccountADObjectPassword avec -RotateToKerbKey kerb2 avant chaque expiration." }
    - id: c
      text: { en: "Regenerate key1 and key2 of stavdprof06 on the Access keys page.", fr: "Régénérer key1 et key2 de stavdprof06 dans la page Clés d'accès." }
    - id: d
      text: { en: "Rejoin stavdprof06 by running Join-AzStorageAccount with -DomainAccountType \"ServiceLogonAccount\".", fr: "Joindre de nouveau stavdprof06 en exécutant Join-AzStorageAccount avec -DomainAccountType \"ServiceLogonAccount\"." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The password of the AD DS object that represents the storage account is one of the account's Kerberos keys. If it expires, Kerberos authentication to the share fails. Microsoft documents two options: rotate the password before it expires, or move the object to an OU that doesn't require password rotation; only the second one removes the recurring task.
    fr: |
      Le mot de passe de l'objet AD DS qui représente le compte de stockage est l'une des clés Kerberos du compte. S'il expire, l'authentification Kerberos auprès du partage échoue. Microsoft documente deux options : effectuer la rotation du mot de passe avant son expiration, ou déplacer l'objet vers une unité d'organisation qui n'exige pas de rotation ; seule la seconde supprime la tâche récurrente.
  options:
    b: { en: "Rotation works, but it must be repeated before every expiry, which is a recurring task.", fr: "La rotation fonctionne, mais elle doit être répétée avant chaque expiration, ce qui est une tâche récurrente." }
    c: { en: "key1 and key2 are the storage account access keys, not the Kerberos keys used as the AD DS object's password.", fr: "key1 et key2 sont les clés d'accès du compte de stockage, pas les clés Kerberos utilisées comme mot de passe de l'objet AD DS." }
    d: { en: "A service logon account in the same OU is still subject to the password policy of that OU.", fr: "Un compte d'ouverture de session de service dans la même unité d'organisation reste soumis à la stratégie de mot de passe de cette unité." }
references:
  - title: Update the password for your storage account identity in AD DS
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-ad-ds-update-password
