id: az140-1d-img-sysprep-commands
objective: "1.5.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You customized a Windows 11 Enterprise multi-session virtual machine named **vm-golden** in a resource group named **rg-images**. You plan to capture it as a golden image for Azure Virtual Desktop session hosts.

    You need to:

    - remove the machine-specific information from vm-golden;
    - have vm-golden power off, not restart, when Sysprep finishes;
    - record in Azure that vm-golden is generalized.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez personnalisé une machine virtuelle Windows 11 Entreprise multisession nommée **vm-golden** dans un groupe de ressources nommé **rg-images**. Vous prévoyez de la capturer comme image de référence pour des hôtes de session Azure Virtual Desktop.

    Vous devez :

    - supprimer de vm-golden les informations propres à la machine ;
    - faire en sorte que vm-golden s'arrête, sans redémarrer, à la fin de Sysprep ;
    - enregistrer dans Azure que vm-golden est généralisée.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    REM On vm-golden, in an elevated Command Prompt
    cd %windir%\system32\sysprep
    sysprep.exe [[gen]] [[shut]]

    # In Azure PowerShell, after vm-golden has stopped
    Set-AzVm -ResourceGroupName rg-images -Name vm-golden -[[flag]]
  slots:
    - id: gen
      options:
        - { id: audit, text: /audit }
        - { id: generalize, text: /generalize }
        - { id: quiet, text: /quiet }
    - id: shut
      options:
        - { id: reboot, text: /reboot }
        - { id: quit, text: /quit }
        - { id: shutdown, text: /shutdown }
    - id: flag
      options:
        - { id: generalized, text: Generalized }
        - { id: redeploy, text: Redeploy }
        - { id: reapply, text: Reapply }
answer:
  values: { gen: generalize, shut: shutdown, flag: generalized }
explanation:
  correct:
    en: |
      `/generalize` removes the machine-specific information, and `/shutdown` powers the VM off when Sysprep finishes so that it isn't restarted. After the VM has stopped, `Set-AzVm -Generalized` marks it as generalized on the platform, which is required before you capture a generalized image. A generalized VM can't be restarted.
    fr: |
      `/generalize` supprime les informations propres à la machine, et `/shutdown` arrête la machine virtuelle à la fin de Sysprep pour qu'elle ne redémarre pas. Une fois la machine virtuelle arrêtée, `Set-AzVm -Generalized` la marque comme généralisée sur la plateforme, ce qui est requis avant de capturer une image généralisée. Une machine virtuelle généralisée ne peut pas être redémarrée.
  options:
    audit: { en: "/audit boots Windows into audit mode; it doesn't generalize the installation.", fr: "/audit démarre Windows en mode audit ; il ne généralise pas l'installation." }
    quiet: { en: "/quiet only hides confirmation messages; it doesn't generalize.", fr: "/quiet masque seulement les messages de confirmation ; il ne généralise pas." }
    reboot: { en: "/reboot restarts the VM, which the requirements exclude.", fr: "/reboot redémarre la machine virtuelle, ce que les exigences excluent." }
    quit: { en: "/quit closes Sysprep and leaves the VM running.", fr: "/quit ferme Sysprep et laisse la machine virtuelle démarrée." }
    redeploy: { en: "-Redeploy moves the VM to another Azure host; it doesn't mark it as generalized.", fr: "-Redeploy déplace la machine virtuelle vers un autre hôte Azure ; il ne la marque pas comme généralisée." }
    reapply: { en: "-Reapply reapplies the VM's state; it doesn't mark it as generalized.", fr: "-Reapply réapplique l'état de la machine virtuelle ; il ne la marque pas comme généralisée." }
references:
  - title: Remove machine specific information by deprovisioning or generalizing a VM before creating an image
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/generalize
