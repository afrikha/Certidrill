id: az140-cs3c-netapp-files
objective: "1.2.5"
type: ordering
caseStudy: az140-cs3c-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to provide the West Europe storage for the designers' FSLogix profile containers by using anf-relecloud-weu.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez fournir le stockage de West Europe des conteneurs de profils FSLogix des concepteurs à l'aide d'anf-relecloud-weu.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: ad, text: { en: "Create an Active Directory connection to relecloud.com on anf-relecloud-weu.", fr: "Créer une connexion Active Directory vers relecloud.com sur anf-relecloud-weu." } }
    - { id: vol, text: { en: "Create an SMB volume in the capacity pool, in snet-anf, with Continuous Availability enabled.", fr: "Créer un volume SMB dans le pool de capacité, dans snet-anf, avec la disponibilité continue (Continuous Availability) activée." } }
    - { id: fsl, text: { en: "Add the mount path of the volume to the FSLogix configuration of the HP-CAD-WEU session hosts.", fr: "Ajouter le chemin de montage du volume à la configuration FSLogix des hôtes de session de HP-CAD-WEU." } }
    - { id: nfs, text: { en: "Create an NFSv4.1 volume in the capacity pool, in snet-anf, with Kerberos enabled.", fr: "Créer un volume NFSv4.1 dans le pool de capacité, dans snet-anf, avec Kerberos activé." } }
    - { id: pe, text: { en: "Create a private endpoint for anf-relecloud-weu in snet-anf.", fr: "Créer un point de terminaison privé pour anf-relecloud-weu dans snet-anf." } }
    - { id: rbac, text: { en: "Assign the Storage File Data SMB Share Contributor role on anf-relecloud-weu to the designers.", fr: "Attribuer le rôle Storage File Data SMB Share Contributor sur anf-relecloud-weu aux concepteurs." } }
answer:
  sequence: [ ad, vol, fsl ]
explanation:
  correct:
    en: |
      FSLogix on Azure NetApp Files requires Kerberos authentication through AD DS, so you first join the NetApp account to relecloud.com with an Active Directory connection. You then create the SMB volume in the existing capacity pool and delegated subnet; Microsoft recommends enabling Continuous Availability for FSLogix. Finally, you point FSLogix on the session hosts to the volume's mount path.
    fr: |
      FSLogix sur Azure NetApp Files exige l'authentification Kerberos par AD DS : vous joignez d'abord le compte NetApp à relecloud.com avec une connexion Active Directory. Vous créez ensuite le volume SMB dans le pool de capacité et le sous-réseau délégué existants ; Microsoft recommande d'activer la disponibilité continue pour FSLogix. Enfin, vous faites pointer FSLogix sur les hôtes de session vers le chemin de montage du volume.
  options:
    nfs: { en: "FSLogix profile containers are accessed over SMB; an NFS volume isn't used for them.", fr: "Les conteneurs de profils FSLogix sont accessibles en SMB ; un volume NFS ne sert pas pour eux." }
    pe: { en: "Azure NetApp Files volumes are deployed directly into the delegated subnet; you don't create a private endpoint, and the delegated subnet can't host one.", fr: "Les volumes Azure NetApp Files sont déployés directement dans le sous-réseau délégué : vous ne créez pas de point de terminaison privé, et le sous-réseau délégué ne peut pas en héberger." }
    rbac: { en: "Storage File Data SMB roles grant share-level access to Azure Files, not to Azure NetApp Files volumes, whose access is controlled by NTFS permissions.", fr: "Les rôles Storage File Data SMB accordent l'accès au niveau du partage pour Azure Files, pas pour les volumes Azure NetApp Files, dont l'accès est contrôlé par les autorisations NTFS." }
references:
  - title: Store FSLogix profile containers on Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-fslogix-profile-container
  - title: Delegate a subnet to Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-delegate-subnet
