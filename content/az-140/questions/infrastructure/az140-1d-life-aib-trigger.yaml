id: az140-1d-life-aib-trigger
objective: "1.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure VM Image Builder image template named **tpl-win11** for Azure Virtual Desktop session hosts. The template uses an Azure Marketplace source image with the version `latest` and distributes to an Azure Compute Gallery image definition. You start each build manually.

    You need a new image version to be built automatically whenever Microsoft publishes a new version of the Marketplace source image. The solution must not use custom code.

    What should you do?
  fr: |
    Vous disposez d'un modèle d'image Azure VM Image Builder nommé **tpl-win11** pour des hôtes de session Azure Virtual Desktop. Le modèle utilise une image source de la Place de marché Azure avec la version `latest` et distribue vers une définition d'image Azure Compute Gallery. Vous démarrez chaque build manuellement.

    Vous devez faire en sorte qu'une nouvelle version d'image soit construite automatiquement chaque fois que Microsoft publie une nouvelle version de l'image source de la Place de marché. La solution ne doit pas utiliser de code personnalisé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the autoRun state of tpl-win11 to Enabled.", fr: "Définir l'état autoRun de tpl-win11 sur Enabled." } }
    - { id: b, text: { en: "Enable scheduled agent updates on the host pools.", fr: "Activer les mises à jour planifiées de l'agent sur les pools d'hôtes." } }
    - { id: c, text: { en: "Configure a host pool as a validation environment.", fr: "Configurer un pool d'hôtes comme environnement de validation." } }
    - { id: d, text: { en: "Create an Image Builder trigger of kind SourceImage for tpl-win11.", fr: "Créer un déclencheur Image Builder de type SourceImage pour tpl-win11." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An Image Builder trigger of kind `SourceImage` starts a build automatically when the source image is updated. The source must be a platform image or a gallery image with the version `latest`, the `Triggers` feature must be registered, and the gallery version is incremented automatically.
    fr: |
      Un déclencheur Image Builder de type `SourceImage` démarre automatiquement un build quand l'image source est mise à jour. La source doit être une image de plateforme ou une image de galerie en version `latest`, la fonctionnalité `Triggers` doit être inscrite, et la version de galerie est incrémentée automatiquement.
  options:
    a:
      en: autoRun runs a single build when the template is created; it doesn't react to new source images.
      fr: autoRun exécute un seul build lors de la création du modèle ; il ne réagit pas aux nouvelles images sources.
    b:
      en: Scheduled agent updates control when the Azure Virtual Desktop agent components update on session hosts, not image builds.
      fr: Les mises à jour planifiées de l'agent contrôlent le moment où les composants de l'agent Azure Virtual Desktop se mettent à jour sur les hôtes de session, pas les builds d'image.
    c:
      en: A validation environment receives Azure Virtual Desktop service updates early; it doesn't build images.
      fr: Un environnement de validation reçoit en avance les mises à jour du service Azure Virtual Desktop ; il ne construit pas d'images.
references:
  - title: How to enable automatic image creation with Azure Image Builder triggers
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/image-builder-triggers-how-to
