id: az140-1c-cap-autoscale-prereqs
objective: "1.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named HP1 that uses the standard management approach. HP1 was created with breadth-first load balancing and the default max session limit.

    You plan to assign HP1 a scaling plan that uses power management autoscaling, so that the number of running session hosts follows demand.

    Which two actions should you perform first? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop regroupé nommé HP1 qui utilise l'approche de gestion standard. HP1 a été créé avec l'équilibrage de charge breadth-first et la limite maximale de sessions par défaut.

    Vous prévoyez d'attribuer à HP1 un plan de mise à l'échelle avec gestion de l'alimentation, pour que le nombre d'hôtes de session en marche suive la demande.

    Quelles sont les deux actions à effectuer d'abord ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set a custom max session limit on HP1.", fr: "Définir une limite maximale de sessions personnalisée sur HP1." } }
    - { id: b, text: { en: "Enable Start VM on Connect on HP1.", fr: "Activer Start VM on Connect sur HP1." } }
    - { id: c, text: { en: "Assign the Desktop Virtualization Power On Off Contributor role to the Azure Virtual Desktop service principal at the subscription scope.", fr: "Attribuer le rôle Desktop Virtualization Power On Off Contributor au principal de service Azure Virtual Desktop dans l'étendue de l'abonnement." } }
    - { id: d, text: { en: "Assign the Desktop Virtualization Power On Off Contributor role to the Azure Virtual Desktop service principal at the scope of the session host resource group.", fr: "Attribuer le rôle Desktop Virtualization Power On Off Contributor au principal de service Azure Virtual Desktop dans l'étendue du groupe de ressources des hôtes de session." } }
    - { id: e, text: { en: "Add a session host configuration to HP1.", fr: "Ajouter une configuration d'hôte de session à HP1." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Autoscale calculates pooled capacity from the max session limit, so you must replace the default value (999999 with breadth-first) with a custom limit. For power management, the Azure Virtual Desktop service principal (or a managed identity of the host pool) needs Desktop Virtualization Power On Off Contributor with the subscription as the assignable scope; lower scopes prevent autoscale from working correctly.
    fr: |
      La mise à l'échelle automatique calcule la capacité d'un pool regroupé à partir de la limite maximale de sessions : vous devez remplacer la valeur par défaut (999999 en breadth-first) par une limite personnalisée. Pour la gestion de l'alimentation, le principal de service Azure Virtual Desktop (ou une identité managée du pool d'hôtes) a besoin de Desktop Virtualization Power On Off Contributor avec l'abonnement comme étendue attribuable ; des étendues inférieures empêchent la mise à l'échelle de fonctionner correctement.
  options:
    b: { en: "Start VM on Connect is recommended for personal host pools; it isn't a prerequisite for autoscale on a pooled host pool.", fr: "Start VM on Connect est recommandé pour les pools d'hôtes personnels ; ce n'est pas un prérequis de la mise à l'échelle d'un pool regroupé." }
    d: { en: "Assigning the role at a resource group, host pool or VM scope prevents autoscale from working correctly.", fr: "Attribuer le rôle dans l'étendue d'un groupe de ressources, d'un pool d'hôtes ou d'une machine virtuelle empêche la mise à l'échelle de fonctionner correctement." }
    e: { en: "A session host configuration can't be added to an existing standard host pool, and power management doesn't need one.", fr: "Une configuration d'hôte de session ne peut pas être ajoutée à un pool standard existant, et la gestion de l'alimentation n'en a pas besoin." }
references:
  - title: Create and assign an autoscale scaling plan for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/autoscale-scaling-plan
