id: az140-1c-portal-deploy-roles
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An administrator named Admin1 must use the Azure portal to create an Azure Virtual Desktop host pool, its desktop application group, a workspace and 20 session host VMs. All the resources, including the virtual network, are in a resource group named RG-AVD. The deployment doesn't use a key vault, and another team assigns users to application groups.

    You need to grant Admin1 the required permissions on RG-AVD. The solution must follow the principle of least privilege.

    Which two roles should you assign to Admin1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur nommé Admin1 doit utiliser le portail Azure pour créer un pool d'hôtes Azure Virtual Desktop, son groupe d'applications de bureau, un espace de travail et 20 machines virtuelles d'hôtes de session. Toutes les ressources, y compris le réseau virtuel, se trouvent dans un groupe de ressources nommé RG-AVD. Le déploiement n'utilise pas de coffre de clés, et une autre équipe attribue les utilisateurs aux groupes d'applications.

    Vous devez accorder à Admin1 les autorisations nécessaires sur RG-AVD. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles à attribuer à Admin1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Desktop Virtualization Contributor }
    - { id: b, text: Desktop Virtualization User }
    - { id: c, text: Virtual Machine Contributor }
    - { id: d, text: User Access Administrator }
    - { id: e, text: Contributor }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Creating the host pool, workspace and application group requires Desktop Virtualization Contributor on the resource group or subscription. Creating the session host VMs on Azure requires Virtual Machine Contributor. A role with role assignment write permission is needed only to assign users, which another team does.
    fr: |
      Créer le pool d'hôtes, l'espace de travail et le groupe d'applications exige Desktop Virtualization Contributor sur le groupe de ressources ou l'abonnement. Créer les machines virtuelles des hôtes de session sur Azure exige Virtual Machine Contributor. Un rôle avec l'autorisation d'écrire des attributions de rôles n'est nécessaire que pour attribuer des utilisateurs, ce que fait une autre équipe.
  options:
    b: { en: "Desktop Virtualization User lets users connect to an application group's resources; it creates nothing.", fr: "Desktop Virtualization User permet à des utilisateurs de se connecter aux ressources d'un groupe d'applications ; il ne crée rien." }
    d: { en: "User Access Administrator is needed only to assign users to application groups, which isn't Admin1's task.", fr: "User Access Administrator n'est nécessaire que pour attribuer des utilisateurs aux groupes d'applications, ce qui n'est pas la tâche d'Admin1." }
    e: { en: "Contributor would work but grants far more than required, which breaks least privilege.", fr: "Contributor fonctionnerait mais accorde bien plus que nécessaire, ce qui enfreint le moindre privilège." }
references:
  - title: Deploy Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
