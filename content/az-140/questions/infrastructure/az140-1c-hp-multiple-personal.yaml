id: az140-1c-hp-multiple-personal
objective: "1.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop personal host pool named HP-Dev that uses the **Automatic** assignment type. A developer named Dev1 is already assigned to the desktop application group of HP-Dev.

    Dev1 needs two personal desktops in HP-Dev: one for development and one for testing. You plan to use the session hosts SH-0 and SH-1, which aren't assigned to any user.

    Which three actions should you perform in sequence in the Azure portal? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop personnel nommé HP-Dev qui utilise le type d'attribution **Automatic**. Un développeur nommé Dev1 est déjà attribué au groupe d'applications de bureau de HP-Dev.

    Dev1 a besoin de deux bureaux personnels dans HP-Dev : un pour le développement et un pour les tests. Vous prévoyez d'utiliser les hôtes de session SH-0 et SH-1, qui ne sont attribués à aucun utilisateur.

    Quelles sont les trois actions à effectuer dans l'ordre dans le portail Azure ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: direct, text: { en: "In the Properties of HP-Dev, set the assignment type to **Direct**, and then save.", fr: "Dans les propriétés de HP-Dev, définir le type d'attribution sur **Direct**, puis enregistrer." } }
    - { id: multi, text: { en: "In the Properties of HP-Dev, select **Assign multiple desktops to a single user**, and then save.", fr: "Dans les propriétés de HP-Dev, sélectionner **Assign multiple desktops to a single user**, puis enregistrer." } }
    - { id: assign, text: { en: "Assign Dev1 to SH-0 and to SH-1 from the **Session hosts** page.", fr: "Attribuer Dev1 à SH-0 et à SH-1 depuis la page **Session hosts**." } }
    - { id: dag, text: { en: "Create a second desktop application group in HP-Dev and assign Dev1 to it.", fr: "Créer un second groupe d'applications de bureau dans HP-Dev et y attribuer Dev1." } }
    - { id: limit, text: { en: "Set the max session limit of HP-Dev to 2.", fr: "Définir la limite maximale de sessions de HP-Dev sur 2." } }
    - { id: svc, text: { en: "Enable Start VM on Connect on HP-Dev.", fr: "Activer Start VM on Connect sur HP-Dev." } }
answer:
  sequence: [ direct, multi, assign ]
explanation:
  correct:
    en: |
      Assigning multiple personal desktops to one user works only with the Direct assignment type. You must first set the assignment type to Direct and save, then enable Assign multiple desktops to a single user and save again (doing both at once returns an error). Finally, you assign Dev1 to each session host. Once enabled, the multiple desktop setting can't be turned off.
    fr: |
      L'attribution de plusieurs bureaux personnels à un même utilisateur ne fonctionne qu'avec le type d'attribution Direct. Vous devez d'abord définir le type d'attribution sur Direct et enregistrer, puis activer Assign multiple desktops to a single user et enregistrer de nouveau (faire les deux en une fois renvoie une erreur). Enfin, vous attribuez Dev1 à chaque hôte de session. Une fois activé, le paramètre de bureaux multiples ne peut plus être désactivé.
  options:
    dag: { en: "A host pool has only one desktop application group, and Dev1 is already assigned to it.", fr: "Un pool d'hôtes n'a qu'un seul groupe d'applications de bureau, et Dev1 y est déjà attribué." }
    limit: { en: "A personal session host always has one session; the max session limit applies to pooled host pools.", fr: "Un hôte de session personnel a toujours une session ; la limite maximale de sessions concerne les pools d'hôtes regroupés." }
    svc: { en: "Start VM on Connect powers on deallocated VMs; it doesn't assign desktops.", fr: "Start VM on Connect démarre les machines virtuelles libérées ; il n'attribue pas de bureaux." }
references:
  - title: Configure personal desktop assignment in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
