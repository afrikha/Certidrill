id: az140-1c-lic-separate-subscription
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure subscription named SubA. SubA contains an Azure Virtual Desktop host pool used by 500 employees, who are licensed with Microsoft 365 E5. SubA isn't enrolled in per-user access pricing.

    Northwind plans to publish an ordering application as a RemoteApp from Windows 11 Enterprise multi-session session hosts to the staff of its retail customers.

    You need to recommend a solution that licenses the customers' users compliantly. The solution must prevent Northwind from paying a second time for its employees.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un abonnement Azure nommé SubA. SubA contient un pool d'hôtes Azure Virtual Desktop utilisé par 500 employés, licenciés avec Microsoft 365 E5. SubA n'est pas inscrit à la tarification de l'accès par utilisateur.

    Northwind prévoit de publier une application de commande en tant que RemoteApp, depuis des hôtes de session Windows 11 Entreprise multisession, pour le personnel de ses clients détaillants.

    Vous devez recommander une solution qui licencie les utilisateurs des clients de manière conforme. La solution doit éviter que Northwind paie une seconde fois pour ses employés.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy the customer host pool in a new subscription named SubB.", fr: "Déployer le pool d'hôtes des clients dans un nouvel abonnement nommé SubB." } }
    - { id: b, text: { en: "Deploy the customer host pool in SubA as a second host pool.", fr: "Déployer le pool d'hôtes des clients dans SubA comme second pool d'hôtes." } }
    - { id: c, text: { en: "Enroll SubA in per-user access pricing.", fr: "Inscrire SubA à la tarification de l'accès par utilisateur." } }
    - { id: d, text: { en: "Enroll SubB in per-user access pricing.", fr: "Inscrire SubB à la tarification de l'accès par utilisateur." } }
    - { id: e, text: { en: "Assign a Microsoft 365 E5 license to each customer user.", fr: "Attribuer une licence Microsoft 365 E5 à chaque utilisateur client." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      External users require per-user access pricing, which applies to an enrolled subscription. An enrolled subscription also charges users who already hold eligible licenses, so Microsoft recommends keeping internal users in a subscription that isn't enrolled. The customer host pool therefore goes in a separate subscription, SubB, which you enroll.
    fr: |
      Les utilisateurs externes exigent la tarification de l'accès par utilisateur, qui s'applique à un abonnement inscrit. Un abonnement inscrit facture aussi les utilisateurs qui ont déjà une licence éligible : Microsoft recommande donc de garder les utilisateurs internes dans un abonnement non inscrit. Le pool d'hôtes des clients va par conséquent dans un abonnement distinct, SubB, que vous inscrivez.
  options:
    b: { en: "Customers would then use SubA, which would have to be enrolled and would charge the employees too.", fr: "Les clients utiliseraient alors SubA, qu'il faudrait inscrire et qui facturerait aussi les employés." }
    c: { en: "Enrolling SubA charges every user who connects to it, including the employees licensed with Microsoft 365 E5.", fr: "Inscrire SubA facture chaque utilisateur qui s'y connecte, y compris les employés licenciés avec Microsoft 365 E5." }
    e: { en: "Microsoft 365 licenses grant rights for internal use; external commercial use requires per-user access pricing.", fr: "Les licences Microsoft 365 donnent des droits pour l'usage interne ; l'usage commercial externe exige la tarification de l'accès par utilisateur." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
  - title: Enroll in per-user access pricing for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/enroll-per-user-access-pricing
