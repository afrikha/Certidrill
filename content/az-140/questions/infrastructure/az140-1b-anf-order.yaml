id: az140-1b-anf-order
objective: "1.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a NetApp account named **anf-contoso** in the West Europe region. anf-contoso has an Active Directory connection to the contoso.com AD DS domain. A virtual network named **VNet-AVD** contains a subnet delegated to `Microsoft.NetApp/volumes`.

    You need to provide an SMB share for the FSLogix profile containers of a host pool whose session hosts are joined to contoso.com. Users must not be able to open other users' profiles.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un compte NetApp nommé **anf-contoso** dans la région West Europe. anf-contoso possède une connexion Active Directory vers le domaine AD DS contoso.com. Un réseau virtuel nommé **VNet-AVD** contient un sous-réseau délégué à `Microsoft.NetApp/volumes`.

    Vous devez fournir un partage SMB pour les conteneurs de profils FSLogix d'un pool d'hôtes dont les hôtes de session sont joints à contoso.com. Les utilisateurs ne doivent pas pouvoir ouvrir les profils des autres utilisateurs.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pool, text: { en: "Create a capacity pool in anf-contoso.", fr: "Créer un pool de capacité dans anf-contoso." } }
    - { id: vol, text: { en: "Create an SMB volume with Continuous Availability enabled in the delegated subnet.", fr: "Créer un volume SMB avec la disponibilité continue activée dans le sous-réseau délégué." } }
    - { id: ntfs, text: { en: "Set the recommended NTFS permissions on the root of the volume's share.", fr: "Définir les autorisations NTFS recommandées à la racine du partage du volume." } }
    - { id: ad2, text: { en: "Create a second Active Directory connection in anf-contoso.", fr: "Créer une seconde connexion Active Directory dans anf-contoso." } }
    - { id: join, text: { en: "Run Join-AzStorageAccount for anf-contoso from a domain-joined computer.", fr: "Exécuter Join-AzStorageAccount pour anf-contoso depuis un ordinateur joint au domaine." } }
    - { id: elev, text: { en: "Assign the Storage File Data SMB Share Elevated Contributor role on the volume to the administrators.", fr: "Attribuer le rôle Storage File Data SMB Share Elevated Contributor sur le volume aux administrateurs." } }
answer:
  sequence: [ pool, vol, ntfs ]
explanation:
  correct:
    en: |
      Volumes are created inside a capacity pool, so the pool comes first. The SMB volume, placed in the delegated subnet, uses the account's existing Active Directory connection, and Microsoft recommends Continuous Availability for FSLogix. Without proper directory-level NTFS permissions on the share, a user could delete or read another user's profile.
    fr: |
      Les volumes sont créés dans un pool de capacité : le pool vient donc en premier. Le volume SMB, placé dans le sous-réseau délégué, utilise la connexion Active Directory existante du compte, et Microsoft recommande la disponibilité continue pour FSLogix. Sans autorisations NTFS appropriées au niveau des répertoires du partage, un utilisateur pourrait supprimer ou lire le profil d'un autre utilisateur.
  options:
    ad2: { en: "A NetApp account supports only one Active Directory connection, and the existing one already targets contoso.com.", fr: "Un compte NetApp ne prend en charge qu'une seule connexion Active Directory, et celle qui existe cible déjà contoso.com." }
    join: { en: "Join-AzStorageAccount joins an Azure Files storage account to AD DS; it doesn't apply to Azure NetApp Files.", fr: "Join-AzStorageAccount joint un compte de stockage Azure Files à AD DS ; il ne s'applique pas à Azure NetApp Files." }
    elev: { en: "Storage File Data SMB Share roles apply to Azure Files shares, not to Azure NetApp Files volumes.", fr: "Les rôles Storage File Data SMB Share s'appliquent aux partages Azure Files, pas aux volumes Azure NetApp Files." }
references:
  - title: Store FSLogix profile containers on Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-fslogix-profile-container
  - title: Create a capacity pool for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-set-up-capacity-pool
