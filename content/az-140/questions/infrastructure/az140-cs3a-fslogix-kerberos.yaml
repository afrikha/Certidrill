id: az140-cs3a-fslogix-kerberos
objective: "1.2.2"
type: yesno_statements
caseStudy: az140-cs3a-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You are configuring the storage of the FSLogix profile containers for HP-Office to meet the requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez le stockage des conteneurs de profils FSLogix de HP-Office pour respecter les exigences.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You must configure the HP-Office session hosts to retrieve a cloud Kerberos ticket during sign-in, for example with the Intune setting Kerberos/CloudKerberosTicketRetrievalEnabled.
        fr: |
          Vous devez configurer les hôtes de session de HP-Office pour qu'ils récupèrent un ticket Kerberos cloud lors de la connexion, par exemple avec le paramètre Intune Kerberos/CloudKerberosTicketRetrievalEnabled.
    - id: s2
      text:
        en: |
          The HP-Office session hosts need network line of sight to the Leiden domain controllers to mount the profile containers.
        fr: |
          Les hôtes de session de HP-Office ont besoin d'une visibilité réseau directe sur les contrôleurs de domaine de Leyde pour monter les conteneurs de profils.
    - id: s3
      text:
        en: |
          CA-MFA-All must exclude the application that represents stprofilestrey in Microsoft Entra ID.
        fr: |
          CA-MFA-All doit exclure l'application qui représente stprofilestrey dans Microsoft Entra ID.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With Microsoft Entra Kerberos, Microsoft Entra joined session hosts must be allowed to retrieve the cloud Kerberos ticket at sign-in; on Windows multi-session, Microsoft Learn says to use the Intune settings catalog for this policy. Session hosts don't need line of sight to a domain controller (only the machine you use to set the permissions does). The storage account's app registration must not require MFA, otherwise the Kerberos ticket can't be obtained silently at sign-in, so it must be excluded from a policy that targets all resources.
    fr: |
      Avec Microsoft Entra Kerberos, les hôtes de session joints à Microsoft Entra doivent être autorisés à récupérer le ticket Kerberos cloud lors de la connexion ; sur Windows multisession, Microsoft Learn indique d'utiliser le catalogue de paramètres Intune pour cette stratégie. Les hôtes de session n'ont pas besoin de visibilité directe sur un contrôleur de domaine (seule la machine qui sert à définir les autorisations en a besoin). L'inscription d'application du compte de stockage ne doit pas exiger la MFA, sinon le ticket Kerberos ne peut pas être obtenu sans interaction à la connexion : elle doit donc être exclue d'une stratégie qui cible toutes les ressources.
references:
  - title: Store FSLogix profile containers on Azure Files using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-profile-container-azure-ad
