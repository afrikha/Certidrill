id: az140-1b-org-tags-roles
objective: "1.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop deployment that uses two resource groups:

    | Resource group | Contents | Tag on the resource group |
    | --- | --- | --- |
    | RG-AVD-Service | Host pool HP1, its application groups and workspace | CostCenter=IT |
    | RG-AVD-Hosts | Session host VMs of HP1 | CostCenter=Finance |

    No Azure Policy definitions or tag inheritance settings are configured. A group named **AVD-Ops** has the Desktop Virtualization Contributor role on RG-AVD-Service.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un déploiement Azure Virtual Desktop qui utilise deux groupes de ressources :

    | Groupe de ressources | Contenu | Étiquette du groupe de ressources |
    | --- | --- | --- |
    | RG-AVD-Service | Pool d'hôtes HP1, ses groupes d'applications et son espace de travail | CostCenter=IT |
    | RG-AVD-Hosts | Machines virtuelles hôtes de session de HP1 | CostCenter=Finance |

    Aucune définition Azure Policy et aucun paramètre d'héritage des étiquettes ne sont configurés. Un groupe nommé **AVD-Ops** dispose du rôle Desktop Virtualization Contributor sur RG-AVD-Service.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The session host VMs automatically have the tag CostCenter=Finance.
        fr: Les machines virtuelles hôtes de session ont automatiquement l'étiquette CostCenter=Finance.
    - id: s2
      text:
        en: Members of AVD-Ops can create application groups in RG-AVD-Service.
        fr: Les membres d'AVD-Ops peuvent créer des groupes d'applications dans RG-AVD-Service.
    - id: s3
      text:
        en: The role assignment lets members of AVD-Ops delete the session host VMs in RG-AVD-Hosts.
        fr: L'attribution de rôle permet aux membres d'AVD-Ops de supprimer les machines virtuelles hôtes de session de RG-AVD-Hosts.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Resources don't inherit the tags of their resource group; you apply tags to each resource or use Azure Policy to add or inherit them. Desktop Virtualization Contributor manages all Azure Virtual Desktop objects (host pools, application groups, workspaces) at its scope. The assignment is scoped to RG-AVD-Service and the role doesn't grant VM management, so it gives no rights on the VMs in RG-AVD-Hosts.
    fr: |
      Les ressources n'héritent pas des étiquettes de leur groupe de ressources ; vous appliquez les étiquettes à chaque ressource ou utilisez Azure Policy pour les ajouter ou les hériter. Desktop Virtualization Contributor gère tous les objets Azure Virtual Desktop (pools d'hôtes, groupes d'applications, espaces de travail) dans son étendue. L'attribution porte sur RG-AVD-Service et le rôle n'accorde pas la gestion des machines virtuelles : il ne donne aucun droit sur les machines virtuelles de RG-AVD-Hosts.
references:
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
  - title: Built-in Azure RBAC roles for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rbac
