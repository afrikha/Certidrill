id: az140-1a-pl-restart-agent
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You add a private endpoint with the connection sub-resource to an Azure Virtual Desktop host pool named **HP1**, and you change the public access of HP1 to **Enable public access for end users, use private access for session hosts**.

    You need to ensure that the session hosts of HP1 apply the new network configuration.

    What should you do?
  fr: |
    Vous ajoutez un point de terminaison privé avec la sous-ressource connection à un pool d'hôtes Azure Virtual Desktop nommé **HP1**, et vous changez l'accès public de HP1 en **Enable public access for end users, use private access for session hosts**.

    Vous devez faire en sorte que les hôtes de session de HP1 appliquent la nouvelle configuration réseau.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run gpupdate /force on each session host.", fr: "Exécuter gpupdate /force sur chaque hôte de session." }
    - id: b
      text: { en: "Restart the RDAgentBootLoader service on each session host.", fr: "Redémarrer le service RDAgentBootLoader sur chaque hôte de session." }
    - id: c
      text: { en: "Run WVDAgentUrlTool.exe on each session host.", fr: "Exécuter WVDAgentUrlTool.exe sur chaque hôte de session." }
    - id: d
      text: { en: "Generate a new registration key for HP1.", fr: "Générer une nouvelle clé d'inscription pour HP1." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      After you add or change a private endpoint or the public access setting of a host pool, Microsoft asks you to restart the Remote Desktop Agent Loader (RDAgentBootLoader) service on each session host, or to restart the session hosts. Existing sessions aren't affected by the change.
    fr: |
      Après l'ajout ou la modification d'un point de terminaison privé ou du paramètre d'accès public d'un pool d'hôtes, Microsoft demande de redémarrer le service Remote Desktop Agent Loader (RDAgentBootLoader) sur chaque hôte de session, ou de redémarrer les hôtes de session. Les sessions existantes ne sont pas affectées par la modification.
  options:
    a: { en: "The change is a host pool setting, not a Group Policy setting, so a policy refresh doesn't apply it.", fr: "La modification est un paramètre du pool d'hôtes, pas un paramètre de stratégie de groupe : une actualisation des stratégies ne l'applique pas." }
    c: { en: "The Agent URL Tool only tests access to the required endpoints; it doesn't reload the agent's connection.", fr: "L'outil Agent URL Tool teste seulement l'accès aux points de terminaison requis ; il ne recharge pas la connexion de l'agent." }
    d: { en: "A registration key is needed to add new session hosts, not to apply network changes to registered ones.", fr: "Une clé d'inscription sert à ajouter de nouveaux hôtes de session, pas à appliquer des changements réseau aux hôtes déjà inscrits." }
references:
  - title: Set up Private Link with Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/private-link-setup
