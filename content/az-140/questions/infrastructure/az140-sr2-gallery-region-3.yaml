id: az140-sr2-gallery-region-3
objective: "1.5.7"
type: series_yesno
series: az140-sr2-gallery-region
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You add North Europe to the replication of version 1.4.0 with two replicas.
  fr: |
    Vous ajoutez North Europe à la réplication de la version 1.4.0 avec deux réplicas.
body:
  solution:
    en: |
      In galAvd, you open **win11-m365** > **1.4.0** > **Update replication** and add **North Europe** as a target region with a replica count of **2**. When the replication status of North Europe is completed, you deploy the 80 session hosts of Pool-NE from image version 1.4.0.
    fr: |
      Dans galAvd, vous ouvrez **win11-m365** > **1.4.0** > **Update replication** et ajoutez **North Europe** comme région cible avec un nombre de réplicas de **2**. Quand l'état de réplication de North Europe est terminé, vous déployez les 80 hôtes de session de Pool-NE à partir de la version d'image 1.4.0.
answer: { value: false }
explanation:
  correct:
    en: Adding North Europe as a target region makes the deployment possible, but two replicas don't follow Microsoft's recommendations. For 80 VMs created at the same time, one replica per 20 VMs gives four replicas, and production images should keep at least three. With too few replicas, a single replica serves more deployments and instance creation is more likely to be throttled.
    fr: "Ajouter North Europe comme région cible rend le déploiement possible, mais deux réplicas ne suivent pas les recommandations de Microsoft. Pour 80 machines virtuelles créées en même temps, un réplica pour 20 machines virtuelles donne quatre réplicas, et les images de production doivent en conserver au moins trois. Avec trop peu de réplicas, chaque réplica sert davantage de déploiements et la création des instances risque davantage d'être limitée (throttling)."
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
