id: az140-1e-agent-in-image
objective: "1.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To test a new golden image, a Northwind administrator registered the build VM with a test host pool by installing the Azure Virtual Desktop Agent and Boot Loader. After the tests, the administrator ran Sysprep and captured the VM as image version **3.1.0** in an Azure Compute Gallery.

    Session hosts that you add to the production host pool from image version 3.1.0 fail to join the host pool. Session hosts that you add from the previous version, 3.0.0, join successfully.

    You need to be able to add working session hosts that contain the content of 3.1.0.

    What should you do?
  fr: |
    Pour tester une nouvelle image de référence, un administrateur de Northwind a inscrit la machine virtuelle de build dans un pool d'hôtes de test en installant l'agent Azure Virtual Desktop et le chargeur de démarrage (Boot Loader). Après les tests, l'administrateur a exécuté Sysprep et capturé la machine virtuelle comme version d'image **3.1.0** dans une galerie Azure Compute Gallery.

    Les hôtes de session que vous ajoutez au pool d'hôtes de production à partir de la version d'image 3.1.0 ne parviennent pas à rejoindre le pool d'hôtes. Les hôtes de session que vous ajoutez à partir de la version précédente, 3.0.0, le rejoignent sans problème.

    Vous devez pouvoir ajouter des hôtes de session fonctionnels qui ont le contenu de 3.1.0.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Increase the replica count of image version 3.1.0 in the region of the host pool.", fr: "Augmenter le nombre de réplicas de la version d'image 3.1.0 dans la région du pool d'hôtes." }
    - id: b
      text: { en: "Deploy the session hosts from 3.1.0 with the Trusted launch security type.", fr: "Déployer les hôtes de session à partir de 3.1.0 avec le type de sécurité Trusted launch." }
    - id: c
      text: { en: "Rebuild the image from a build VM that never had the Azure Virtual Desktop Agent installed.", fr: "Reconstruire l'image à partir d'une machine virtuelle de build sur laquelle l'agent Azure Virtual Desktop n'a jamais été installé." }
    - id: d
      text: { en: "Set Exclude from latest to true on image version 3.0.0.", fr: "Définir Exclure de la dernière version (Exclude from latest) sur true pour la version d'image 3.0.0." }
answer: { optionId: c }
explanation:
  correct:
    en: Microsoft warns not to join the golden image VM to a host pool by deploying the Azure Virtual Desktop Agent. Session hosts later created from that image fail to join the host pool because the registration token captured in the image has expired. The agent must be installed by the session host deployment, so the image must be rebuilt from a clean VM.
    fr: "Microsoft déconseille de joindre la machine virtuelle de l'image de référence à un pool d'hôtes en déployant l'agent Azure Virtual Desktop. Les hôtes de session créés plus tard à partir de cette image ne parviennent pas à rejoindre le pool d'hôtes, car le jeton d'inscription capturé dans l'image a expiré. L'agent doit être installé par le déploiement des hôtes de session : l'image doit être reconstruite à partir d'une machine virtuelle propre."
  options:
    a: { en: "More replicas reduce throttling during large deployments; they don't change the content of the image.", fr: "Davantage de réplicas réduisent la limitation lors de gros déploiements ; ils ne changent pas le contenu de l'image." }
    b: { en: "The security type doesn't affect the agent registration captured in the image.", fr: "Le type de sécurité n'a aucun effet sur l'inscription de l'agent capturée dans l'image." }
    d: { en: "Excluding 3.0.0 from latest only changes which version new deployments pick; 3.1.0 would still fail.", fr: "Exclure 3.0.0 de la dernière version change seulement la version choisie par les nouveaux déploiements ; 3.1.0 échouerait toujours." }
references:
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
