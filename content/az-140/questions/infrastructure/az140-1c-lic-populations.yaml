id: az140-1c-lic-populations
objective: "1.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are designing Azure Virtual Desktop licensing for three user populations.

    Which license should you recommend for each population? To answer, drag the appropriate licenses to the correct populations. Each license may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les licences Azure Virtual Desktop de trois populations d'utilisateurs.

    Quelle licence devez-vous recommander pour chaque population ? Pour répondre, faites glisser les licences appropriées vers les populations correspondantes. Chaque licence peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rdscal, text: { en: "RDS CAL with Software Assurance", fr: "CAL RDS avec Software Assurance" } }
    - { id: peruser, text: { en: "Per-user access pricing", fr: "Tarification de l'accès par utilisateur" } }
    - { id: a3, text: Microsoft 365 A3 }
    - { id: entra, text: Microsoft Entra ID P1 }
    - { id: apps, text: Microsoft 365 Apps for business }
  targets:
    - id: t1
      text: { en: "Employees who connect to Windows Server 2022 session hosts", fr: "Des employés qui se connectent à des hôtes de session Windows Server 2022" }
    - id: t2
      text: { en: "Customers of a SaaS application published from Windows 11 Enterprise multi-session session hosts", fr: "Les clients d'une application SaaS publiée depuis des hôtes de session Windows 11 Entreprise multisession" }
    - id: t3
      text: { en: "University students who connect to Windows 11 Enterprise multi-session session hosts", fr: "Des étudiants d'université qui se connectent à des hôtes de session Windows 11 Entreprise multisession" }
answer:
  mapping: { t1: rdscal, t2: peruser, t3: a3 }
explanation:
  correct:
    en: |
      Internal users of Windows Server session hosts need an RDS CAL with Software Assurance or an RDS User Subscription License. External users of Windows client session hosts are licensed with per-user access pricing on an enrolled subscription. Students are internal users of Windows client session hosts, and Microsoft 365 A3 is one of the eligible licenses.
    fr: |
      Les utilisateurs internes d'hôtes de session Windows Server ont besoin d'une CAL RDS avec Software Assurance ou d'une licence d'abonnement utilisateur RDS. Les utilisateurs externes d'hôtes de session Windows client sont licenciés avec la tarification de l'accès par utilisateur sur un abonnement inscrit. Les étudiants sont des utilisateurs internes d'hôtes de session Windows client, et Microsoft 365 A3 fait partie des licences éligibles.
  options:
    entra: { en: "Microsoft Entra ID P1 is an identity license; it doesn't grant Windows access rights for Azure Virtual Desktop.", fr: "Microsoft Entra ID P1 est une licence d'identité ; elle ne donne pas de droits d'accès Windows pour Azure Virtual Desktop." }
    apps: { en: "Microsoft 365 Apps for business isn't in the list of eligible licenses for Windows client session hosts.", fr: "Microsoft 365 Apps for business ne figure pas dans la liste des licences éligibles pour les hôtes de session Windows client." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
