id: az140-1b-os-multi-session-options
objective: "1.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are planning an Azure Virtual Desktop pooled host pool in which each session host must accept several concurrent user sessions.

    Which two operating systems can you use for the session hosts? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez un pool d'hôtes regroupé Azure Virtual Desktop dans lequel chaque hôte de session doit accepter plusieurs sessions utilisateur simultanées.

    Quels sont les deux systèmes d'exploitation que vous pouvez utiliser pour les hôtes de session ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Windows 11 Enterprise }
    - { id: b, text: Windows Server 2022 }
    - { id: c, text: Windows 11 Enterprise LTSC 2024 }
    - { id: d, text: Windows 11 Enterprise multi-session }
    - { id: e, text: Windows 11 Pro }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Windows 11 Enterprise multi-session and Windows Server (2016, 2019, 2022 and 2025) are supported session host operating systems that accept several concurrent interactive sessions. Windows Server session hosts also require RDS CALs.
    fr: |
      Windows 11 Entreprise multisession et Windows Server (2016, 2019, 2022 et 2025) sont des systèmes d'exploitation pris en charge pour les hôtes de session qui acceptent plusieurs sessions interactives simultanées. Les hôtes de session Windows Server exigent en outre des CAL RDS.
  options:
    a: { en: "Windows 11 Enterprise is supported but allows a single interactive session, which fits personal host pools.", fr: "Windows 11 Entreprise est pris en charge, mais n'autorise qu'une session interactive, ce qui convient aux pools d'hôtes personnels." }
    c: { en: "LTSC editions aren't supported as session hosts.", fr: "Les éditions LTSC ne sont pas prises en charge comme hôtes de session." }
    e: { en: "Pro editions aren't supported as session hosts.", fr: "Les éditions Pro ne sont pas prises en charge comme hôtes de session." }
references:
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
