id: az140-1d-img-manual-rules
objective: "1.5.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You create Azure Virtual Desktop golden images manually from a build virtual machine named **vm-build**, which you customize, generalize with Sysprep and capture to an Azure Compute Gallery every month.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez manuellement des images de référence Azure Virtual Desktop à partir d'une machine virtuelle de build nommée **vm-build**, que vous personnalisez, généralisez avec Sysprep et capturez dans une galerie Azure Compute Gallery chaque mois.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After you capture vm-build, you can start it again to install the next month's updates and capture it again.
        fr: Après avoir capturé vm-build, vous pouvez la redémarrer pour installer les mises à jour du mois suivant et la capturer de nouveau.
    - id: s2
      text:
        en: A snapshot of the OS disk taken before Sysprep lets you create the next build VM without starting again from Azure Marketplace.
        fr: Un instantané du disque du système d'exploitation pris avant Sysprep permet de créer la machine virtuelle de build suivante sans repartir de la Place de marché Azure.
    - id: s3
      text:
        en: You should deploy vm-build with the Login with Microsoft Entra ID option so that the session hosts created from the image can join Microsoft Entra ID.
        fr: Vous devez déployer vm-build avec l'option Se connecter avec Microsoft Entra ID pour que les hôtes de session créés à partir de l'image puissent rejoindre Microsoft Entra ID.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A generalized VM can't be restarted, and Microsoft says not to reuse a captured VM: create a new build VM from your last snapshot instead. Snapshots taken after each important step let you roll back or start the next build from a known state. The build VM must be deployed without the Login with Microsoft Entra ID option; you choose Microsoft Entra join when you deploy the session hosts.
    fr: |
      Une machine virtuelle généralisée ne peut pas être redémarrée, et Microsoft recommande de ne pas réutiliser une machine virtuelle capturée : créez plutôt une nouvelle machine virtuelle de build à partir de votre dernier instantané. Les instantanés pris après chaque étape importante permettent de revenir en arrière ou de démarrer le build suivant depuis un état connu. La machine virtuelle de build doit être déployée sans l'option Se connecter avec Microsoft Entra ID ; vous choisissez la jonction à Microsoft Entra lors du déploiement des hôtes de session.
references:
  - title: Create a golden image in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/set-up-golden-image
