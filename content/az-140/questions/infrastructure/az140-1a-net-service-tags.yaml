id: az140-1a-net-service-tags
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are creating outbound security rules in a network security group associated with the session host subnet of an Azure Virtual Desktop host pool. Each rule must use the service tag that Microsoft lists for the endpoint.

    Which service tag should you use as the destination of each rule? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez des règles de sécurité sortantes dans un groupe de sécurité réseau associé au sous-réseau des hôtes de session d'un pool d'hôtes Azure Virtual Desktop. Chaque règle doit utiliser l'étiquette de service que Microsoft indique pour le point de terminaison.

    Quelle étiquette de service devez-vous utiliser comme destination de chaque règle ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      TCP 443 to `*.wvd.microsoft.com` (service traffic): [[wvd]]

      TCP 443 to `login.microsoftonline.com` (authentication): [[auth]]

      TCP 443 to `gcs.prod.monitoring.core.windows.net` (agent traffic): [[mon]]

      TCP 443 to `mrsglobalsteus2prod.blob.core.windows.net` (agent and SxS stack updates): [[upd]]
    fr: |
      TCP 443 vers `*.wvd.microsoft.com` (trafic du service) : [[wvd]]

      TCP 443 vers `login.microsoftonline.com` (authentification) : [[auth]]

      TCP 443 vers `gcs.prod.monitoring.core.windows.net` (trafic de l'agent) : [[mon]]

      TCP 443 vers `mrsglobalsteus2prod.blob.core.windows.net` (mises à jour de l'agent et de la pile SxS) : [[upd]]
  slots:
    - id: wvd
      options:
        - { id: avd, text: WindowsVirtualDesktop }
        - { id: aad, text: AzureActiveDirectory }
        - { id: mon, text: AzureMonitor }
        - { id: sto, text: Storage }
        - { id: cloud, text: AzureCloud }
    - id: auth
      options:
        - { id: avd, text: WindowsVirtualDesktop }
        - { id: aad, text: AzureActiveDirectory }
        - { id: mon, text: AzureMonitor }
        - { id: sto, text: Storage }
        - { id: cloud, text: AzureCloud }
    - id: mon
      options:
        - { id: avd, text: WindowsVirtualDesktop }
        - { id: aad, text: AzureActiveDirectory }
        - { id: mon, text: AzureMonitor }
        - { id: sto, text: Storage }
        - { id: cloud, text: AzureCloud }
    - id: upd
      options:
        - { id: avd, text: WindowsVirtualDesktop }
        - { id: aad, text: AzureActiveDirectory }
        - { id: mon, text: AzureMonitor }
        - { id: sto, text: Storage }
        - { id: cloud, text: AzureCloud }
answer:
  values: { wvd: avd, auth: aad, mon: mon, upd: sto }
explanation:
  correct:
    en: |
      Microsoft's list of required endpoints for session hosts maps `*.wvd.microsoft.com` to WindowsVirtualDesktop, `login.microsoftonline.com` to AzureActiveDirectory, the agent traffic endpoints to AzureMonitor, and the blob endpoint that delivers agent and side-by-side stack updates to Storage. Service tags simplify NSG, Azure Firewall and user-defined route configuration.
    fr: |
      La liste des points de terminaison requis des hôtes de session associe `*.wvd.microsoft.com` à WindowsVirtualDesktop, `login.microsoftonline.com` à AzureActiveDirectory, les points de terminaison du trafic de l'agent à AzureMonitor, et le point de terminaison blob qui fournit les mises à jour de l'agent et de la pile side-by-side à Storage. Les étiquettes de service simplifient la configuration des NSG, du Pare-feu Azure et des itinéraires définis par l'utilisateur.
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
