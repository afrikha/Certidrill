id: az140-1d-mod-builtin-scripts
objective: "1.5.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You maintain an Azure Virtual Desktop image with a custom image template named **tpl-support**. You need to modify the next image version so that:

    - the French language pack is installed;
    - Microsoft Teams uses media optimizations on the session hosts.

    You must use built-in scripts only.

    Which two built-in scripts should you add to the customizations of tpl-support? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous maintenez une image Azure Virtual Desktop avec un modèle d'image personnalisée nommé **tpl-support**. Vous devez modifier la prochaine version d'image pour que :

    - le module linguistique français soit installé ;
    - Microsoft Teams utilise les optimisations multimédias sur les hôtes de session.

    Vous devez utiliser uniquement des scripts intégrés.

    Quels sont les deux scripts intégrés à ajouter aux personnalisations de tpl-support ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The script that enables time zone redirection", fr: "Le script qui active la redirection du fuseau horaire" } }
    - { id: b, text: { en: "The script that installs language packs", fr: "Le script qui installe des modules linguistiques" } }
    - { id: c, text: { en: "The script that disables Storage Sense", fr: "Le script qui désactive l'Assistant Stockage" } }
    - { id: d, text: { en: "The script that configures Teams optimizations", fr: "Le script qui configure les optimisations de Teams" } }
    - { id: e, text: { en: "The script that enables screen capture protection", fr: "Le script qui active la protection contre la capture d'écran" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Custom image templates include built-in scripts for common session host settings. The language pack script installs the selected languages (another built-in script sets the default OS language), and the Teams optimizations script installs the components that Teams needs for optimized media, such as the WebRTC redirector and the Visual C++ Redistributable. Built-in scripts handle the restarts they need.
    fr: |
      Les modèles d'images personnalisées incluent des scripts intégrés pour les paramètres courants des hôtes de session. Le script des modules linguistiques installe les langues choisies (un autre script intégré définit la langue par défaut du système d'exploitation), et le script des optimisations de Teams installe les composants dont Teams a besoin pour le multimédia optimisé, comme le redirecteur WebRTC et Visual C++ Redistributable. Les scripts intégrés gèrent les redémarrages dont ils ont besoin.
  options:
    a:
      en: Time zone redirection shows the client's time zone in the session; it doesn't install a language.
      fr: La redirection du fuseau horaire affiche le fuseau horaire du client dans la session ; elle n'installe aucune langue.
    c:
      en: Disabling Storage Sense keeps Windows from cleaning up files automatically; it has no effect on Teams.
      fr: Désactiver l'Assistant Stockage empêche Windows de nettoyer automatiquement des fichiers ; cela n'a aucun effet sur Teams.
    e:
      en: Screen capture protection blocks screenshots of the session; it doesn't optimize Teams media.
      fr: La protection contre la capture d'écran bloque les captures d'écran de la session ; elle n'optimise pas le multimédia de Teams.
references:
  - title: Custom image templates in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/custom-image-templates
