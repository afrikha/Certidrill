id: az140-1c-cap-max-session-value
objective: "1.3.6"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named HP-Eng that uses depth-first load balancing. The session hosts are D8s_v5 VMs (8 vCPUs, 32 GB of RAM) that run Windows 11 Enterprise multi-session. The users are engineers who run a heavy workload.

    You need to set the max session limit of HP-Eng to the value that Microsoft's multi-session sizing guidelines give for this workload and VM size.

    Which value should you set?
  fr: |
    Vous disposez d'un pool d'hôtes Azure Virtual Desktop regroupé nommé HP-Eng qui utilise l'équilibrage de charge depth-first. Les hôtes de session sont des machines virtuelles D8s_v5 (8 vCPU, 32 Go de RAM) qui exécutent Windows 11 Entreprise multisession. Les utilisateurs sont des ingénieurs qui exécutent une charge de travail lourde.

    Vous devez définir la limite maximale de sessions de HP-Eng sur la valeur que donnent les recommandations de dimensionnement multisession de Microsoft pour cette charge et cette taille de machine virtuelle.

    Quelle valeur devez-vous définir ?
body:
  options:
    - { id: a, text: "4" }
    - { id: b, text: "8" }
    - { id: c, text: "16" }
    - { id: d, text: "32" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The heavy workload baseline is two users per vCPU, so an 8-vCPU host supports 8 × 2 = 16 sessions. Depth-first fills each host up to the max session limit before using the next one, so the limit must match what a host can really serve.
    fr: |
      La base pour une charge lourde est de deux utilisateurs par vCPU : un hôte de 8 vCPU prend en charge 8 × 2 = 16 sessions. Depth-first remplit chaque hôte jusqu'à la limite maximale de sessions avant d'utiliser le suivant : la limite doit correspondre à ce qu'un hôte peut réellement servir.
  options:
    a: { en: "4 would leave most of each host unused and start far more hosts than needed.", fr: "4 laisserait la majeure partie de chaque hôte inutilisée et démarrerait bien plus d'hôtes que nécessaire." }
    b: { en: "8 corresponds to one user per vCPU, the power workload baseline.", fr: "8 correspond à un utilisateur par vCPU, la base des charges intensives." }
    d: { en: "32 corresponds to four users per vCPU, the medium workload baseline.", fr: "32 correspond à quatre utilisateurs par vCPU, la base des charges moyennes." }
references:
  - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
  - title: Configure host pool load balancing in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-load-balancing
