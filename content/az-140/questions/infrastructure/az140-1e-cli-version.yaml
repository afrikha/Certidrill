id: az140-1e-cli-version
objective: "1.5.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a generalized build VM named **vm-build** in West Europe. You need to create image version **1.5.0** of the image definition **win11-multi** in the Azure Compute Gallery **galAvd** from vm-build. The image version must meet the following requirements:

    - Three replicas on zone-redundant storage in West Europe and two replicas in North Europe.
    - Session hosts deployed from the image definition without a version don't use 1.5.0 until it has been validated.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle de build généralisée nommée **vm-build** dans West Europe. Vous devez créer, à partir de vm-build, la version d'image **1.5.0** de la définition d'image **win11-multi** de la galerie Azure Compute Gallery **galAvd**. La version d'image doit satisfaire les exigences suivantes :

    - Trois réplicas sur un stockage redondant interzone dans West Europe et deux réplicas dans North Europe.
    - Les hôtes de session déployés à partir de la définition d'image sans version n'utilisent pas 1.5.0 tant qu'elle n'a pas été validée.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sig image-version create \
      --resource-group rg-images \
      --gallery-name galAvd \
      --gallery-image-definition win11-multi \
      --gallery-image-version 1.5.0 \
      [[src]] /subscriptions/<sub>/resourceGroups/rg-build/providers/Microsoft.Compute/virtualMachines/vm-build \
      --target-regions [[regions]] \
      [[latest]]
  slots:
    - id: src
      options:
        - { id: mi, text: "--managed-image" }
        - { id: vm, text: "--virtual-machine" }
        - { id: snap, text: "--os-snapshot" }
        - { id: iv, text: "--image-version" }
    - id: regions
      options:
        - { id: eq, text: "westeurope=3=Standard_ZRS northeurope=2" }
        - { id: colon, text: "westeurope:3:Standard_ZRS northeurope:2" }
        - { id: swap, text: "westeurope=Standard_ZRS=3 northeurope=2" }
    - id: latest
      options:
        - { id: eol, text: "--end-of-life-date 2027-06-30" }
        - { id: exfalse, text: "--exclude-from-latest false" }
        - { id: extrue, text: "--exclude-from-latest true" }
answer:
  values: { src: vm, regions: eq, latest: extrue }
explanation:
  correct:
    en: "`--virtual-machine` takes the resource ID of the VM source. `--target-regions` uses the format `<region>[=<replica count>][=<storage account type>]`, so `westeurope=3=Standard_ZRS` sets three ZRS replicas and `northeurope=2` sets two replicas with the default storage type. `--exclude-from-latest true` keeps the version from being picked by deployments that omit the version, until you set it back to false."
    fr: "`--virtual-machine` accepte l'ID de ressource de la machine virtuelle source. `--target-regions` utilise le format `<region>[=<replica count>][=<storage account type>]` : `westeurope=3=Standard_ZRS` définit trois réplicas ZRS et `northeurope=2` deux réplicas avec le type de stockage par défaut. `--exclude-from-latest true` empêche les déploiements qui omettent la version de choisir celle-ci, jusqu'à ce que vous la repassiez à false."
  options:
    mi: { en: "--managed-image expects a managed image, not a VM.", fr: "--managed-image attend une image managée, pas une machine virtuelle." }
    snap: { en: "--os-snapshot expects an OS disk snapshot, not a VM.", fr: "--os-snapshot attend un instantané de disque de système d'exploitation, pas une machine virtuelle." }
    iv: { en: "--image-version copies another gallery image version.", fr: "--image-version copie une autre version d'image de galerie." }
    colon: { en: "The separator between region, replica count and storage type is an equals sign, not a colon.", fr: "Le séparateur entre région, nombre de réplicas et type de stockage est le signe égal, pas les deux-points." }
    swap: { en: "The replica count comes before the storage account type.", fr: "Le nombre de réplicas précède le type de compte de stockage." }
    eol: { en: "The end-of-life date is informational and doesn't stop the version from being used as latest.", fr: "La date de fin de vie est informative et n'empêche pas la version d'être utilisée comme dernière version." }
    exfalse: { en: "With false, the version becomes the latest immediately, before validation.", fr: "Avec false, la version devient immédiatement la dernière version, avant validation." }
references:
  - title: az sig image-version
    url: https://learn.microsoft.com/en-us/cli/azure/sig/image-version?view=azure-cli-latest
