id: az140-1a-sp-statements
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Virtual Desktop host pool named **HP1**. Some users connect over ExpressRoute private peering, others from the internet. You are planning RDP Shortpath for HP1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. Certains utilisateurs se connectent par le peering privé ExpressRoute, d'autres depuis Internet. Vous planifiez RDP Shortpath pour HP1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the session hosts have the Enable RDP Shortpath for managed networks policy enabled but RDP Shortpath for managed networks is disabled on HP1, sessions use the managed-network listener.
        fr: Si la stratégie Enable RDP Shortpath for managed networks est activée sur les hôtes de session mais que RDP Shortpath pour les réseaux managés est désactivé sur HP1, les sessions utilisent l'écouteur des réseaux managés.
    - id: s2
      text:
        en: RDP Shortpath for public networks via STUN requires an inbound rule for UDP 3390 on the session hosts.
        fr: RDP Shortpath pour les réseaux publics via STUN exige une règle entrante pour UDP 3390 sur les hôtes de session.
    - id: s3
      text:
        en: When both a managed-network path and a public-network path can be established, the session uses the first connection that is established.
        fr: Quand un chemin de réseau managé et un chemin de réseau public peuvent tous deux être établis, la session utilise la première connexion établie.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      When the host pool and session host settings conflict, the most restrictive one applies, so a disabled host pool option blocks the managed-network listener. Only the managed-network listener option needs an inbound port; STUN and TURN need outbound UDP only. RDP Shortpath uses a first-found algorithm: the first UDP connection established wins, usually the managed one because public paths have more hops.
    fr: |
      Quand les paramètres du pool d'hôtes et de l'hôte de session se contredisent, le plus restrictif s'applique : une option désactivée sur le pool d'hôtes bloque l'écouteur des réseaux managés. Seule l'option d'écouteur des réseaux managés exige un port entrant ; STUN et TURN n'ont besoin que d'UDP sortant. RDP Shortpath utilise un algorithme du premier trouvé : la première connexion UDP établie l'emporte, généralement la connexion managée, car les chemins publics comptent plus de sauts.
references:
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
  - title: RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-shortpath
