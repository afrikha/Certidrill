id: az140-1c-auto-statements
objective: "1.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your team automates Azure Virtual Desktop deployments with the Azure CLI, Azure PowerShell and Bicep. Some host pools use the standard management approach, and others use a session host configuration.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe automatise les déploiements Azure Virtual Desktop avec Azure CLI, Azure PowerShell et Bicep. Certains pools d'hôtes utilisent l'approche de gestion standard, d'autres une configuration d'hôte de session.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You must install the desktopvirtualization extension manually before you can run an `az desktopvirtualization hostpool` command.
        fr: |
          Vous devez installer manuellement l'extension desktopvirtualization avant de pouvoir exécuter une commande `az desktopvirtualization hostpool`.
    - id: s2
      text:
        en: |
          A session host that registered with a registration token keeps working after that token expires.
        fr: |
          Un hôte de session inscrit avec un jeton d'inscription continue de fonctionner après l'expiration de ce jeton.
    - id: s3
      text:
        en: |
          In a host pool that uses a session host configuration, you can retrieve a registration token to register VMs built by your own pipeline.
        fr: |
          Dans un pool d'hôtes qui utilise une configuration d'hôte de session, vous pouvez récupérer un jeton d'inscription pour inscrire des machines virtuelles créées par votre propre pipeline.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The desktopvirtualization extension installs automatically the first time you run one of its commands. The registration token is needed only to register; a registered host uses a machine token that refreshes itself (as long as the VM isn't powered off for more than 90 days). With a session host configuration, the service creates the hosts, and you can't retrieve a registration token for hosts created outside Azure Virtual Desktop.
    fr: |
      L'extension desktopvirtualization s'installe automatiquement la première fois que vous exécutez l'une de ses commandes. Le jeton d'inscription ne sert qu'à l'inscription ; un hôte inscrit utilise un jeton machine qui se renouvelle de lui-même (tant que la machine virtuelle n'est pas éteinte plus de 90 jours). Avec une configuration d'hôte de session, le service crée les hôtes, et vous ne pouvez pas récupérer de jeton d'inscription pour des hôtes créés en dehors d'Azure Virtual Desktop.
references:
  - title: az desktopvirtualization hostpool
    url: https://learn.microsoft.com/en-us/cli/azure/desktopvirtualization/hostpool
  - title: Host pool management approaches for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/host-pool-management-approaches
