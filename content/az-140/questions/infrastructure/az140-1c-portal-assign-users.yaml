id: az140-1c-portal-assign-users
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You use the Azure portal to create an Azure Virtual Desktop pooled host pool named HP1 with 10 session hosts joined to an AD DS domain. All the session hosts show **Available**. During creation, you registered the desktop application group of HP1 with a new workspace named WS1.

    The users sign in to Windows App with their synchronized accounts, but no desktop appears.

    You need to ensure that the users can connect to the desktop of HP1.

    What should you do?
  fr: |
    Vous utilisez le portail Azure pour créer un pool d'hôtes Azure Virtual Desktop regroupé nommé HP1 avec 10 hôtes de session joints à un domaine AD DS. Tous les hôtes de session indiquent **Available**. Lors de la création, vous avez inscrit le groupe d'applications de bureau de HP1 dans un nouvel espace de travail nommé WS1.

    Les utilisateurs se connectent à Windows App avec leurs comptes synchronisés, mais aucun bureau n'apparaît.

    Vous devez vous assurer que les utilisateurs peuvent se connecter au bureau de HP1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the users the Desktop Virtualization User role on HP1", fr: "Attribuer aux utilisateurs le rôle Desktop Virtualization User sur HP1" } }
    - { id: b, text: { en: "Assign the users the Desktop Virtualization Reader role on WS1", fr: "Attribuer aux utilisateurs le rôle Desktop Virtualization Reader sur WS1" } }
    - { id: c, text: { en: "Enable Start VM on Connect in the properties of HP1", fr: "Activer Start VM on Connect dans les propriétés de HP1" } }
    - { id: d, text: { en: "Assign the users to the desktop application group of HP1", fr: "Attribuer les utilisateurs au groupe d'applications de bureau de HP1" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Users see resources only when they are assigned to an application group, which grants them the Desktop Virtualization User role on that application group. Creating the host pool, the session hosts and the workspace doesn't give anyone access.
    fr: |
      Les utilisateurs ne voient des ressources que lorsqu'ils sont attribués à un groupe d'applications, ce qui leur accorde le rôle Desktop Virtualization User sur ce groupe d'applications. Créer le pool d'hôtes, les hôtes de session et l'espace de travail ne donne accès à personne.
  options:
    a: { en: "Access is granted on the application group; a role assignment on the host pool doesn't publish any resource.", fr: "L'accès s'accorde sur le groupe d'applications ; une attribution de rôle sur le pool d'hôtes ne publie aucune ressource." }
    b: { en: "Desktop Virtualization Reader lets administrators view objects; it doesn't publish the desktop to users.", fr: "Desktop Virtualization Reader permet à des administrateurs de consulter les objets ; il ne publie pas le bureau aux utilisateurs." }
    c: { en: "The session hosts are already running; Start VM on Connect only powers on deallocated VMs.", fr: "Les hôtes de session sont déjà en marche ; Start VM on Connect ne démarre que des machines virtuelles libérées." }
references:
  - title: Deploy Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
