id: az140-1d-aib-customization-log
objective: "1.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You use Azure VM Image Builder to build Azure Virtual Desktop images. The image template **tpl-finance** is in a resource group named **rg-images**. Its last build failed while a PowerShell customizer was running.

    You need to review the detailed output of each customization step of the failed build.

    Where should you look?
  fr: |
    Vous utilisez Azure VM Image Builder pour construire des images Azure Virtual Desktop. Le modèle d'image **tpl-finance** se trouve dans un groupe de ressources nommé **rg-images**. Son dernier build a échoué pendant l'exécution d'un personnalisateur PowerShell.

    Vous devez examiner la sortie détaillée de chaque étape de personnalisation du build en échec.

    Où devez-vous regarder ?
body:
  options:
    - { id: a, text: { en: "In the activity log of the tpl-finance resource", fr: "Dans le journal d'activité de la ressource tpl-finance" } }
    - { id: b, text: { en: "In the Windows event logs of the build virtual machine", fr: "Dans les journaux d'événements Windows de la machine virtuelle de build" } }
    - { id: c, text: { en: "In the Azure Virtual Desktop Insights workbook of the host pool", fr: "Dans le classeur Azure Virtual Desktop Insights du pool d'hôtes" } }
    - { id: d, text: { en: "In a log file in the staging resource group's storage account", fr: "Dans un fichier journal du compte de stockage du groupe de ressources intermédiaire" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Image Builder creates a staging resource group named `IT_<resource group>_<template>_<GUID>`. Its storage account has a `packerlogs` container with one folder per build run, and `customization.log` in that folder records the progress, errors and status of each customization.
    fr: |
      Image Builder crée un groupe de ressources intermédiaire nommé `IT_<resource group>_<template>_<GUID>`. Son compte de stockage contient un conteneur `packerlogs` avec un dossier par exécution de build, et le fichier `customization.log` de ce dossier enregistre la progression, les erreurs et l'état de chaque personnalisation.
  options:
    a:
      en: The activity log shows control-plane operations such as the Run action, not the output of the scripts that ran in the build VM.
      fr: Le journal d'activité montre les opérations du plan de contrôle, comme l'action Run, pas la sortie des scripts exécutés dans la machine virtuelle de build.
    b:
      en: The temporary build VM is deleted when the build ends, so its event logs are no longer available.
      fr: |
        La machine virtuelle de build temporaire est supprimée à la fin du build : ses journaux d'événements ne sont plus disponibles.
    c:
      en: Azure Virtual Desktop Insights monitors host pools and session hosts, not image builds.
      fr: Azure Virtual Desktop Insights supervise les pools d'hôtes et les hôtes de session, pas les builds d'image.
references:
  - title: Troubleshoot Azure VM Image Builder
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-troubleshoot
  - title: Custom image templates in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/custom-image-templates
