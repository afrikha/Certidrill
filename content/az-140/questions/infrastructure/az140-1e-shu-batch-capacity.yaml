id: az140-1e-shu-batch-capacity
objective: "1.5.5"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    You have an Azure Virtual Desktop pooled host pool named **HP1** that uses a session host configuration. HP1 contains 12 session hosts. All the session hosts are running, none is in drain mode, and autoscale is disabled.

    You schedule a session host update that applies a new image version, with a VM batch size of **4**.

    After the initial session host has been updated, what is the minimum number of session hosts that remain available to accept connections while the remaining session hosts are updated?
  fr: |
    Vous disposez d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP1** qui utilise une configuration d'hôte de session. HP1 contient 12 hôtes de session. Tous les hôtes de session sont en cours d'exécution, aucun n'est en mode drainage et la mise à l'échelle automatique est désactivée.

    Vous planifiez une mise à jour des hôtes de session qui applique une nouvelle version d'image, avec une taille de lot de machines virtuelles (VM batch size) de **4**.

    Une fois l'hôte de session initial mis à jour, quel est le nombre minimal d'hôtes de session qui restent disponibles pour accepter des connexions pendant la mise à jour des hôtes de session restants ?
body:
  options:
    - { id: a, text: "3" }
    - { id: b, text: "4" }
    - { id: c, text: "8" }
    - { id: d, text: "11" }
answer: { optionId: c }
explanation:
  correct:
    en: The batch size is the maximum number of session hosts that are unavailable at the same time. The service updates one initial session host first to validate the process, then updates the other 11 in batches of at most 4, so at least 12 - 4 = 8 session hosts stay available.
    fr: "La taille de lot est le nombre maximal d'hôtes de session indisponibles en même temps. Le service met d'abord à jour un hôte de session initial pour valider le processus, puis met à jour les 11 autres par lots de 4 au plus : au moins 12 - 4 = 8 hôtes de session restent disponibles."
  options:
    a: { en: "3 is the size of the last batch (11 = 4 + 4 + 3), not the number of available hosts.", fr: "3 est la taille du dernier lot (11 = 4 + 4 + 3), pas le nombre d'hôtes disponibles." }
    b: { en: "4 is the number of hosts that can be unavailable at once, not the number that stay available.", fr: "4 est le nombre d'hôtes qui peuvent être indisponibles en même temps, pas le nombre d'hôtes qui restent disponibles." }
    d: { en: "11 would apply only to the initial phase, when a single session host is being updated.", fr: "11 ne s'appliquerait qu'à la phase initiale, pendant la mise à jour d'un seul hôte de session." }
references:
  - title: Session host update for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/session-host-update
