id: az140-1e-update-placement
objective: "1.5.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware has an Azure Virtual Desktop pooled host pool whose session hosts are deployed from a custom image stored in Azure Compute Gallery. All the session hosts must stay identical, and no change must be lost when session hosts are re-created.

    You need to choose how to deliver each type of update.

    Which method should you use for each update? To answer, drag the appropriate methods to the correct updates. Each method may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pool d'hôtes regroupé Azure Virtual Desktop dont les hôtes de session sont déployés à partir d'une image personnalisée stockée dans Azure Compute Gallery. Tous les hôtes de session doivent rester identiques, et aucune modification ne doit être perdue lorsque des hôtes de session sont recréés.

    Vous devez choisir comment livrer chaque type de mise à jour.

    Quelle méthode devez-vous utiliser pour chaque mise à jour ? Pour répondre, faites glisser les méthodes appropriées vers les mises à jour correspondantes. Chaque méthode peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: image, text: { en: "Build a new image version and redeploy the session hosts", fr: "Construire une nouvelle version d'image et redéployer les hôtes de session" } }
    - { id: appattach, text: { en: "Deliver a new application version with App attach", fr: "Livrer une nouvelle version de l'application avec App attach" } }
    - { id: autowu, text: { en: "Enable automatic updates on each session host", fr: "Activer les mises à jour automatiques sur chaque hôte de session" } }
    - { id: manual, text: { en: "Install the update manually on each session host", fr: "Installer la mise à jour manuellement sur chaque hôte de session" } }
  targets:
    - id: cu
      text: { en: "The monthly Windows cumulative update", fr: "La mise à jour cumulative Windows mensuelle" }
    - id: m365
      text: { en: "Microsoft 365 Apps updates from the Monthly Enterprise Channel", fr: "Les mises à jour de Microsoft 365 Apps du canal Entreprise mensuel (Monthly Enterprise Channel)" }
    - id: lob
      text: { en: "An expense app used only by the Finance group and updated every week", fr: "Une application de notes de frais utilisée uniquement par le groupe Finance et mise à jour chaque semaine" }
answer:
  mapping: { cu: image, m365: image, lob: appattach }
explanation:
  correct:
    en: OS cumulative updates and Microsoft 365 Apps updates belong in the image; Microsoft recommends disabling Office automatic updates and adding the updates to a new image version that you redeploy regularly. An app that changes often and serves one group fits App attach, which assigns apps per user or group and lets you add a new app version without rebuilding the image. Automatic or manual updates on each host make hosts drift apart and are lost when the hosts are re-created.
    fr: "Les mises à jour cumulatives du système d'exploitation et celles de Microsoft 365 Apps vont dans l'image ; Microsoft recommande de désactiver les mises à jour automatiques d'Office et d'ajouter les mises à jour à une nouvelle version d'image redéployée régulièrement. Une application qui change souvent et ne sert qu'un groupe convient à App attach, qui affecte les applications par utilisateur ou par groupe et permet d'ajouter une nouvelle version de l'application sans reconstruire l'image. Les mises à jour automatiques ou manuelles sur chaque hôte font diverger les hôtes et sont perdues quand les hôtes sont recréés."
references:
  - title: Install Office on a custom VHD image
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/install-office-on-wvd-master-image
  - title: App Attach in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/app-attach-overview
