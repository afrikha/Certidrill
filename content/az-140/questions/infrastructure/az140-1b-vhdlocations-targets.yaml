id: az140-1b-vhdlocations-targets
objective: "1.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure Virtual Desktop pooled host pool whose session hosts are joined to the contoso.com AD DS domain. Contoso plans to configure FSLogix profile containers without Cloud Cache.

    Which two storage locations can Contoso specify in the VHDLocations registry value?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un pool d'hôtes regroupé Azure Virtual Desktop dont les hôtes de session sont joints au domaine AD DS contoso.com. Contoso prévoit de configurer des conteneurs de profils FSLogix sans Cloud Cache.

    Quels sont les deux emplacements de stockage que Contoso peut indiquer dans la valeur de Registre VHDLocations ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An Azure page blob container in a general-purpose v2 storage account", fr: "Un conteneur d'objets blob de pages Azure dans un compte de stockage v2 universel" } }
    - { id: b, text: { en: "An SMB volume in Azure NetApp Files joined to contoso.com", fr: "Un volume SMB Azure NetApp Files joint à contoso.com" } }
    - { id: c, text: { en: "An Azure file share in a storage account joined to contoso.com", fr: "Un partage de fichiers Azure dans un compte de stockage joint à contoso.com" } }
    - { id: d, text: { en: "An NFSv4.1 volume in Azure NetApp Files", fr: "Un volume NFSv4.1 Azure NetApp Files" } }
    - { id: e, text: { en: "A Data Lake Storage container accessed over HTTPS", fr: "Un conteneur Data Lake Storage accessible en HTTPS" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: VHDLocations lists SMB locations where FSLogix looks for or creates the VHD(x) containers. Azure Files shares and Azure NetApp Files SMB volumes, both authenticated with Kerberos against the domain, are the usual Azure choices.
    fr: VHDLocations liste les emplacements SMB où FSLogix recherche ou crée les conteneurs VHD(x). Les partages Azure Files et les volumes SMB Azure NetApp Files, tous deux authentifiés par Kerberos auprès du domaine, sont les choix habituels dans Azure.
  options:
    a: { en: "Azure page blobs can be a Cloud Cache provider in CCDLocations, not a VHDLocations target.", fr: "Les objets blob de pages Azure peuvent être un fournisseur Cloud Cache dans CCDLocations, pas une cible de VHDLocations." }
    d: { en: "FSLogix containers are accessed over SMB on Windows; an NFS volume isn't a VHDLocations target.", fr: "Les conteneurs FSLogix sont accessibles en SMB sous Windows ; un volume NFS n'est pas une cible de VHDLocations." }
    e: { en: "VHDLocations takes SMB paths; HTTPS object storage isn't supported there.", fr: "VHDLocations prend des chemins SMB ; le stockage d'objets HTTPS n'y est pas pris en charge." }
references:
  - title: Configuration Setting Reference
    url: https://learn.microsoft.com/en-us/fslogix/reference-configuration-settings
  - title: Store FSLogix profile containers on Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-fslogix-profile-container
