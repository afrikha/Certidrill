id: az140-1e-aib-latest-trigger
objective: "1.5.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure VM Image Builder template named **tpl-win11** that builds the image of an Azure Virtual Desktop host pool. The template has the following configuration:

    - `source`: type `PlatformImage`, Windows 11 Enterprise multi-session, `version` set to `latest`
    - `distribute`: type `SharedImage`, `galleryImageId` set to the image definition **win11-multi** (without a version)
    - `autoRun`: not set

    The template was created successfully three months ago and has been built once.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle Azure VM Image Builder nommé **tpl-win11** qui construit l'image d'un pool d'hôtes Azure Virtual Desktop. Le modèle a la configuration suivante :

    - `source` : type `PlatformImage`, Windows 11 Entreprise multisession, `version` définie sur `latest`
    - `distribute` : type `SharedImage`, `galleryImageId` défini sur la définition d'image **win11-multi** (sans version)
    - `autoRun` : non défini

    Le modèle a été créé avec succès il y a trois mois et a été construit une fois.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you run a new build of tpl-win11 today without modifying the template, the build starts from the newest Marketplace image available today.
        fr: Si vous lancez aujourd'hui un nouveau build de tpl-win11 sans modifier le modèle, le build part de l'image de la Place de marché la plus récente disponible aujourd'hui.
    - id: s2
      text:
        en: If you set `autoRun` to `Enabled` on a new copy of the template, Image Builder rebuilds the image every time Microsoft publishes a new Marketplace image.
        fr: Si vous définissez `autoRun` sur `Enabled` dans une nouvelle copie du modèle, Image Builder reconstruit l'image chaque fois que Microsoft publie une nouvelle image de la Place de marché.
    - id: s3
      text:
        en: You can create a `SourceImage` trigger for tpl-win11 so that a new build starts automatically when the source image is updated.
        fr: Vous pouvez créer un déclencheur `SourceImage` pour tpl-win11 afin qu'un nouveau build démarre automatiquement quand l'image source est mise à jour.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The `latest` version of the source is evaluated when the build runs, not when the template is submitted, so rerunning the template picks up the newest Marketplace build. `autoRun` set to `Enabled` only runs the build once, when the template is created. For ongoing builds, an Image Builder trigger of kind `SourceImage` starts a build when the source changes; it's supported for platform images and Azure Compute Gallery images whose version is `latest`.
    fr: "La version `latest` de la source est évaluée au moment du build, pas lors de la soumission du modèle : relancer le modèle récupère la build la plus récente de la Place de marché. `autoRun` défini sur `Enabled` n'exécute le build qu'une fois, à la création du modèle. Pour des builds récurrents, un déclencheur Image Builder de type `SourceImage` lance un build quand la source change ; il est pris en charge pour les images de plateforme et les images Azure Compute Gallery dont la version est `latest`."
references:
  - title: Create an Azure Image Builder Bicep or ARM template JSON template
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json
  - title: How to enable automatic image creation with Azure Image Builder triggers
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/image-builder-triggers-how-to
