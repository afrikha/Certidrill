id: az140-1b-share-perm-statements
objective: "1.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a storage account named **stavdprof10** that is joined to AD DS and contains two file shares: **profiles** and **odfc**. You set the default share-level permission of stavdprof10 to Storage File Data SMB Share Elevated Contributor. A synced user named **User1** also has the Storage File Data SMB Share Reader role assigned on the profiles share.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un compte de stockage nommé **stavdprof10**, joint à AD DS, qui contient deux partages de fichiers : **profiles** et **odfc**. Vous avez défini l'autorisation par défaut au niveau du partage de stavdprof10 sur Storage File Data SMB Share Elevated Contributor. Un utilisateur synchronisé nommé **User1** dispose aussi du rôle Storage File Data SMB Share Reader attribué sur le partage profiles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The default share-level permission applies to both the profiles and odfc shares.
        fr: L'autorisation par défaut au niveau du partage s'applique aux deux partages profiles et odfc.
    - id: s2
      text:
        en: On the profiles share, User1 has only the share-level permissions of Storage File Data SMB Share Reader.
        fr: Sur le partage profiles, User1 ne dispose que des autorisations au niveau du partage de Storage File Data SMB Share Reader.
    - id: s3
      text:
        en: An AD DS user who isn't synced to Microsoft Entra ID gets share-level access to the profiles share.
        fr: Un utilisateur AD DS non synchronisé avec Microsoft Entra ID obtient un accès au niveau du partage sur le partage profiles.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The default share-level permission is set at the storage account level and covers all its file shares. When a user has both the default permission and a specific role, the higher of the two applies, so User1 gets Elevated Contributor. The default permission applies to all authenticated identities, which is why identities don't need to be synced to Microsoft Entra ID to receive it.
    fr: |
      L'autorisation par défaut au niveau du partage est définie au niveau du compte de stockage et couvre tous ses partages de fichiers. Quand un utilisateur dispose à la fois de l'autorisation par défaut et d'un rôle précis, la plus élevée des deux s'applique : User1 obtient donc Elevated Contributor. L'autorisation par défaut s'applique à toutes les identités authentifiées, c'est pourquoi les identités n'ont pas besoin d'être synchronisées avec Microsoft Entra ID pour en bénéficier.
references:
  - title: Assign share-level permissions for Azure file shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
