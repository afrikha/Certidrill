id: az140-1c-portal-inbound-ports
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are adding session hosts to an Azure Virtual Desktop host pool by using the **Virtual machines** tab in the Azure portal. Users will connect from the internet through Windows App.

    Your security policy prohibits any inbound connection from the internet to the session hosts.

    How should you configure the networking of the session hosts?
  fr: |
    Vous ajoutez des hôtes de session à un pool d'hôtes Azure Virtual Desktop à l'aide de l'onglet **Virtual machines** du portail Azure. Les utilisateurs se connecteront depuis Internet via Windows App.

    Votre stratégie de sécurité interdit toute connexion entrante depuis Internet vers les hôtes de session.

    Comment devez-vous configurer le réseau des hôtes de session ?
body:
  options:
    - { id: a, text: { en: "Set Public inbound ports to Allow selected ports and select RDP (3389)", fr: "Définir Public inbound ports sur Allow selected ports et sélectionner RDP (3389)" } }
    - { id: b, text: { en: "Set Public inbound ports to No", fr: "Définir Public inbound ports sur No" } }
    - { id: c, text: { en: "Set Public inbound ports to Allow selected ports and select HTTPS (443)", fr: "Définir Public inbound ports sur Allow selected ports et sélectionner HTTPS (443)" } }
    - { id: d, text: { en: "Assign a public IP address to each session host and allow only UDP 3390", fr: "Attribuer une adresse IP publique à chaque hôte de session et n'autoriser que UDP 3390" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Virtual Desktop doesn't need any inbound port on the session hosts. The agent connects outbound to the service, and clients use reverse connections through the service, so Microsoft recommends setting Public inbound ports to No and not assigning public IP addresses.
    fr: |
      Azure Virtual Desktop n'a besoin d'aucun port entrant sur les hôtes de session. L'agent se connecte en sortie au service et les clients utilisent des connexions inverses via le service : Microsoft recommande donc de définir Public inbound ports sur No et de ne pas attribuer d'adresses IP publiques.
  options:
    a: { en: "Opening 3389 from the internet is unnecessary and violates the policy.", fr: "Ouvrir 3389 depuis Internet est inutile et viole la stratégie." }
    c: { en: "Clients reach the service on TCP 443, not the session hosts; no inbound port is needed on the hosts.", fr: "Les clients joignent le service sur TCP 443, pas les hôtes de session ; aucun port entrant n'est nécessaire sur les hôtes." }
    d: { en: "Public IP addresses and inbound rules on session hosts are discouraged and violate the policy.", fr: "Les adresses IP publiques et les règles entrantes sur les hôtes de session sont déconseillées et violent la stratégie." }
references:
  - title: Deploy Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
  - title: Prerequisites for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites
