id: az140-1a-st-platform
objective: "1.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans to store the FSLogix profile containers of a pooled Azure Virtual Desktop host pool. The session hosts are joined to an AD DS domain.

    You need to recommend a storage service. The service must be an Azure-native platform service, so that Northwind doesn't manage any storage virtual machine.

    Which two services meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit de stocker les conteneurs de profils FSLogix d'un pool d'hôtes Azure Virtual Desktop partagé. Les hôtes de session sont joints à un domaine AD DS.

    Vous devez recommander un service de stockage. Le service doit être un service de plateforme natif d'Azure, afin que Northwind ne gère aucune machine virtuelle de stockage.

    Quels sont les deux services qui répondent à l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Storage Spaces Direct on Azure virtual machines", fr: "Storage Spaces Direct sur des machines virtuelles Azure" } }
    - { id: b, text: { en: "Azure Files", fr: "Azure Files" } }
    - { id: c, text: { en: "Azure NetApp Files", fr: "Azure NetApp Files" } }
    - { id: d, text: { en: "A file server VM with a Premium SSD data disk", fr: "Une machine virtuelle serveur de fichiers avec un disque de données SSD Premium" } }
    - { id: e, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Microsoft's comparison of FSLogix storage options lists Azure Files and Azure NetApp Files as Azure-native platform services that support AD DS. Microsoft recommends Azure Files for most customers, and Azure NetApp Files for general purpose to enterprise-scale needs.
    fr: |
      La comparaison des options de stockage FSLogix de Microsoft présente Azure Files et Azure NetApp Files comme des services de plateforme natifs d'Azure qui prennent en charge AD DS. Microsoft recommande Azure Files pour la plupart des clients, et Azure NetApp Files pour des besoins allant de l'usage général à l'échelle de l'entreprise.
  options:
    a: { en: "Storage Spaces Direct is self-managed: you run and maintain the cluster VMs.", fr: "Storage Spaces Direct est autogéré : vous exploitez et maintenez les machines virtuelles du cluster." }
    d: { en: "A file server VM is infrastructure you manage yourself, not a platform service.", fr: "Une machine virtuelle serveur de fichiers est une infrastructure que vous gérez vous-même, pas un service de plateforme." }
    e: { en: "FSLogix containers must be on an SMB share; Blob Storage isn't one of the documented options.", fr: "Les conteneurs FSLogix doivent se trouver sur un partage SMB ; le Stockage Blob ne fait pas partie des options documentées." }
references:
  - title: Storage options for FSLogix profile containers in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/store-fslogix-profile
