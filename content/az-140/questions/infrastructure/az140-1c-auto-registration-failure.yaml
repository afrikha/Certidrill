id: az140-1c-auto-registration-failure
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You deploy 50 Azure Virtual Desktop session hosts to a standard host pool named HP1 by using a Bicep file. The file creates the VMs without public IP addresses, joins them to the AD DS domain, and uses the PowerShell DSC extension to install the Azure Virtual Desktop agent with a registration token passed as a parameter. Outbound traffic from the session host subnet goes through Azure Firewall.

    The deployment succeeds, but the session hosts don't register with HP1.

    Which two issues could cause the problem?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez 50 hôtes de session Azure Virtual Desktop dans un pool d'hôtes standard nommé HP1 à l'aide d'un fichier Bicep. Le fichier crée les machines virtuelles sans adresse IP publique, les joint au domaine AD DS et utilise l'extension PowerShell DSC pour installer l'agent Azure Virtual Desktop avec un jeton d'inscription passé en paramètre. Le trafic sortant du sous-réseau des hôtes de session passe par le Pare-feu Azure.

    Le déploiement réussit, mais les hôtes de session ne s'inscrivent pas auprès de HP1.

    Quels sont les deux problèmes qui peuvent en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The registration token passed to the template had expired.", fr: "Le jeton d'inscription passé au modèle avait expiré." } }
    - { id: b, text: { en: "The session hosts have no public IP address.", fr: "Les hôtes de session n'ont pas d'adresse IP publique." } }
    - { id: c, text: { en: "A network security group blocks inbound TCP 3389 from the internet.", fr: "Un groupe de sécurité réseau bloque le trafic entrant TCP 3389 depuis Internet." } }
    - { id: d, text: { en: "Azure Firewall blocks outbound TCP 443 to the required Azure Virtual Desktop URLs.", fr: "Le Pare-feu Azure bloque le trafic sortant TCP 443 vers les URL requises d'Azure Virtual Desktop." } }
    - { id: e, text: { en: "HP1 uses depth-first load balancing.", fr: "HP1 utilise l'équilibrage de charge depth-first." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Session hosts register outbound over TCP 443 with the registration token. An expired token makes registration fail (EXPIRED_MACHINE_TOKEN), and blocked access to the required URLs is the most common cause of registration failures, which is why Microsoft recommends validating access before deploying.
    fr: |
      Les hôtes de session s'inscrivent en sortie sur TCP 443 avec le jeton d'inscription. Un jeton expiré fait échouer l'inscription (EXPIRED_MACHINE_TOKEN), et un accès bloqué aux URL requises est la cause la plus fréquente d'échec d'inscription : c'est pourquoi Microsoft recommande de valider l'accès avant le déploiement.
  options:
    b: { en: "Session hosts don't need public IP addresses; Microsoft recommends not assigning them.", fr: "Les hôtes de session n'ont pas besoin d'adresses IP publiques ; Microsoft recommande de ne pas en attribuer." }
    c: { en: "No inbound port is required; blocking 3389 from the internet is the recommended configuration.", fr: "Aucun port entrant n'est requis ; bloquer 3389 depuis Internet est la configuration recommandée." }
    e: { en: "The load balancing algorithm affects session distribution, not registration.", fr: "L'algorithme d'équilibrage de charge influe sur la répartition des sessions, pas sur l'inscription." }
references:
  - title: Deploy Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/deploy-azure-virtual-desktop
  - title: Add session hosts to a host pool
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/add-session-hosts-host-pool
