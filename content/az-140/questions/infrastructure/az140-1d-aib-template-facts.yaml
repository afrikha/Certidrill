id: az140-1d-aib-template-facts
objective: "1.5.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are writing an Azure VM Image Builder image template that builds a Windows 11 Enterprise multi-session image for Azure Virtual Desktop session hosts. The source is an Azure Marketplace image and the template distributes to an Azure Compute Gallery.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous rédigez un modèle d'image Azure VM Image Builder qui construit une image Windows 11 Entreprise multisession pour des hôtes de session Azure Virtual Desktop. La source est une image de la Place de marché Azure et le modèle distribue vers une galerie Azure Compute Gallery.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Image Builder runs Sysprep on the build VM after the customizations, without a Sysprep step in the template.
        fr: Image Builder exécute Sysprep sur la machine virtuelle de build après les personnalisations, sans étape Sysprep dans le modèle.
    - id: s2
      text:
        en: If you set buildTimeoutInMinutes to 0, the build runs without a time limit.
        fr: Si vous définissez buildTimeoutInMinutes sur 0, le build s'exécute sans limite de temps.
    - id: s3
      text:
        en: A File customizer is the recommended way to copy a 3 GB application installer to the build VM.
        fr: Un personnalisateur File est la méthode recommandée pour copier un programme d'installation de 3 Go sur la machine virtuelle de build.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      At the end of the customization phase, Image Builder generalizes Windows images with Sysprep; you only override the command (with `C:\DeprovisioningScript.ps1`) in special cases. A `buildTimeoutInMinutes` of 0 or no value means the default of 240 minutes, and the maximum is 960. The File customizer is meant for small files, under 20 MB; download large installers from a script instead.
    fr: |
      À la fin de la phase de personnalisation, Image Builder généralise les images Windows avec Sysprep ; vous ne remplacez la commande (avec `C:\DeprovisioningScript.ps1`) que dans des cas particuliers. Un `buildTimeoutInMinutes` à 0 ou absent signifie la valeur par défaut de 240 minutes, et le maximum est de 960. Le personnalisateur File est prévu pour de petits fichiers, de moins de 20 Mo ; téléchargez plutôt les gros programmes d'installation depuis un script.
references:
  - title: Create an Azure Image Builder Bicep or ARM template JSON template
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json
