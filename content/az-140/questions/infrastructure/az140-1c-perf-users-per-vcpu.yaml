id: az140-1c-perf-users-per-vcpu
objective: "1.3.5"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You are preparing the first sizing estimate for Azure Virtual Desktop multi-session session hosts. You use the maximum number of users per vCPU from Microsoft's sizing guidelines for each workload type.

    How many users per vCPU should you use for each workload? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez la première estimation de dimensionnement des hôtes de session Azure Virtual Desktop multisession. Vous utilisez le nombre maximal d'utilisateurs par vCPU des recommandations de dimensionnement de Microsoft pour chaque type de charge de travail.

    Combien d'utilisateurs par vCPU devez-vous retenir pour chaque charge de travail ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Light workload (basic data entry): [[light]] users per vCPU

      Medium workload (consultants, Word, static web pages): [[medium]] users per vCPU

      Heavy workload (engineers, Outlook, PowerPoint, dynamic web pages): [[heavy]] users per vCPU
    fr: |
      Charge légère (saisie de données simple) : [[light]] utilisateurs par vCPU

      Charge moyenne (consultants, Word, pages web statiques) : [[medium]] utilisateurs par vCPU

      Charge lourde (ingénieurs, Outlook, PowerPoint, pages web dynamiques) : [[heavy]] utilisateurs par vCPU
  slots:
    - id: light
      options:
        - { id: v1, text: "1" }
        - { id: v2, text: "2" }
        - { id: v4, text: "4" }
        - { id: v6, text: "6" }
    - id: medium
      options:
        - { id: v1, text: "1" }
        - { id: v2, text: "2" }
        - { id: v4, text: "4" }
        - { id: v6, text: "6" }
    - id: heavy
      options:
        - { id: v1, text: "1" }
        - { id: v2, text: "2" }
        - { id: v4, text: "4" }
        - { id: v6, text: "6" }
answer:
  values: { light: v6, medium: v4, heavy: v2 }
explanation:
  correct:
    en: |
      Microsoft's multi-session baseline allows up to six users per vCPU for light workloads, four for medium workloads, two for heavy workloads and one for power workloads, on hosts of at least 8 vCPUs and 16 GB of RAM (power workloads have their own baseline). Validate the estimate with a pilot.
    fr: |
      La base multisession de Microsoft autorise jusqu'à six utilisateurs par vCPU pour les charges légères, quatre pour les moyennes, deux pour les lourdes et un pour les intensives, sur des hôtes d'au moins 8 vCPU et 16 Go de RAM (les charges intensives ont leur propre base). Validez l'estimation par un pilote.
references:
  - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
