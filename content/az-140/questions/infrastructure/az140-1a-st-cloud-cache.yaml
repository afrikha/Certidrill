id: az140-1a-st-cloud-cache
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a pooled Azure Virtual Desktop host pool named **HP-WEU** in the West Europe region. FSLogix profile containers are stored on an Azure Files premium (SSD) share in a storage account named **stweu**. A disaster recovery host pool named **HP-NEU** is deployed in North Europe with a premium share in a storage account named **stneu**.

    You need to plan the profile storage to meet the following requirements:

    - The profiles in stweu and stneu must both stay up to date.
    - Users must keep working if stweu is temporarily unavailable.

    What should you include in the plan?
  fr: |
    Woodgrove Bank dispose d'un pool d'hôtes Azure Virtual Desktop partagé nommé **HP-WEU** dans la région West Europe. Les conteneurs de profils FSLogix sont stockés sur un partage Azure Files Premium (SSD) d'un compte de stockage nommé **stweu**. Un pool d'hôtes de reprise d'activité nommé **HP-NEU** est déployé dans North Europe avec un partage Premium dans un compte de stockage nommé **stneu**.

    Vous devez planifier le stockage des profils pour répondre aux exigences suivantes :

    - Les profils de stweu et de stneu doivent tous deux rester à jour.
    - Les utilisateurs doivent pouvoir continuer à travailler si stweu est temporairement indisponible.

    Que devez-vous inclure dans le plan ?
body:
  options:
    - id: a
      text: { en: "Set VHDLocations to the stweu share and then the stneu share on the session hosts.", fr: "Définir VHDLocations sur le partage de stweu puis sur celui de stneu sur les hôtes de session." }
    - id: b
      text: { en: "Configure geo-redundant storage on stweu and initiate a failover when needed.", fr: "Configurer le stockage géoredondant sur stweu et lancer un basculement en cas de besoin." }
    - id: c
      text: { en: "Set CCDLocations to the stweu share and then the stneu share on the session hosts.", fr: "Définir CCDLocations sur le partage de stweu puis sur celui de stneu sur les hôtes de session." }
    - id: d
      text: { en: "Back up stweu with Azure Backup and restore the share to stneu when needed.", fr: "Sauvegarder stweu avec Sauvegarde Azure et restaurer le partage vers stneu en cas de besoin." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CCDLocations enables FSLogix Cloud Cache: the container runs from a local cache on the session host, and changes are written to every provider listed, so both shares stay current. If a provider becomes unhealthy, changes are queued and flushed when it recovers, which shields users from short-term storage problems. List the providers in order of proximity, then preference.
    fr: |
      CCDLocations active FSLogix Cloud Cache : le conteneur fonctionne à partir d'un cache local sur l'hôte de session, et les modifications sont écrites dans chaque fournisseur listé, si bien que les deux partages restent à jour. Si un fournisseur devient défaillant, les modifications sont mises en file d'attente et vidées à son rétablissement, ce qui protège les utilisateurs des problèmes de stockage de courte durée. Listez les fournisseurs par ordre de proximité, puis de préférence.
  options:
    a: { en: "VHDLocations lists alternative locations: FSLogix uses the first one that works and doesn't replicate changes to the others.", fr: "VHDLocations liste des emplacements alternatifs : FSLogix utilise le premier qui fonctionne et ne réplique pas les modifications vers les autres." }
    b: { en: "SSD file shares don't offer geo-redundancy, and a failover isn't transparent to users.", fr: "Les partages de fichiers SSD n'offrent pas de géoredondance, et un basculement n'est pas transparent pour les utilisateurs." }
    d: { en: "Backups are point-in-time copies; the stneu share wouldn't stay up to date and users would be interrupted.", fr: "Les sauvegardes sont des copies à un instant donné : le partage de stneu ne resterait pas à jour et les utilisateurs seraient interrompus." }
references:
  - title: Cloud Cache Overview
    url: https://learn.microsoft.com/en-us/fslogix/concepts-fslogix-cloud-cache
  - title: Azure Files guidance for virtual desktop workloads
    url: https://learn.microsoft.com/en-us/azure/storage/files/virtual-desktop-workloads
