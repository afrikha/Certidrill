id: az140-1c-auto-ps-personal
objective: "1.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to create an Azure Virtual Desktop host pool named hp-dev by using Azure PowerShell. The host pool must meet the following requirements:

    - Each developer gets a dedicated session host that keeps their files between sessions.
    - A developer receives an available session host automatically at their first connection, without any administrator action.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer un pool d'hôtes Azure Virtual Desktop nommé hp-dev à l'aide d'Azure PowerShell. Le pool d'hôtes doit répondre aux exigences suivantes :

    - Chaque développeur obtient un hôte de session dédié qui conserve ses fichiers d'une session à l'autre.
    - Un développeur reçoit automatiquement un hôte de session disponible à sa première connexion, sans intervention d'un administrateur.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-AzWvdHostPool -ResourceGroupName rg-avd -Name hp-dev -Location westeurope `
        -HostPoolType [[type]] `
        -LoadBalancerType [[lb]] `
        -PersonalDesktopAssignmentType [[assign]] `
        -PreferredAppGroupType Desktop
  slots:
    - id: type
      options:
        - { id: pooled, text: Pooled }
        - { id: personal, text: Personal }
        - { id: byod, text: BYODesktop }
    - id: lb
      options:
        - { id: bf, text: BreadthFirst }
        - { id: df, text: DepthFirst }
        - { id: persistent, text: Persistent }
    - id: assign
      options:
        - { id: auto, text: Automatic }
        - { id: direct, text: Direct }
answer:
  values: { type: personal, lb: persistent, assign: auto }
explanation:
  correct:
    en: |
      A dedicated, persistent desktop per user is a personal host pool, whose load balancer type is `Persistent` because BreadthFirst and DepthFirst apply only to pooled host pools. With the `Automatic` assignment type, a user is assigned to an available session host at their first connection; `Direct` requires an administrator to assign each session host.
    fr: |
      Un bureau dédié et persistant par utilisateur correspond à un pool d'hôtes personnel, dont le type d'équilibreur est `Persistent`, car BreadthFirst et DepthFirst ne s'appliquent qu'aux pools regroupés. Avec le type d'attribution `Automatic`, un utilisateur reçoit un hôte de session disponible à sa première connexion ; `Direct` exige qu'un administrateur attribue chaque hôte de session.
  options:
    pooled: { en: "A pooled host pool shares hosts between users and doesn't keep a dedicated host per user.", fr: "Un pool regroupé partage les hôtes entre utilisateurs et ne conserve pas d'hôte dédié par utilisateur." }
    bf: { en: "Breadth-first load balancing applies to pooled host pools only.", fr: "L'équilibrage breadth-first ne s'applique qu'aux pools regroupés." }
    df: { en: "Depth-first load balancing applies to pooled host pools only.", fr: "L'équilibrage depth-first ne s'applique qu'aux pools regroupés." }
    direct: { en: "Direct assignment requires an administrator to assign a session host to each user.", fr: "L'attribution directe exige qu'un administrateur attribue un hôte de session à chaque utilisateur." }
references:
  - title: New-AzWvdHostPool
    url: https://learn.microsoft.com/en-us/powershell/module/az.desktopvirtualization/new-azwvdhostpool
  - title: Configure personal desktop assignment in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-host-pool-personal-desktop-assignment-type
