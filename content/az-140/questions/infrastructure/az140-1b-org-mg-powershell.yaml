id: az140-1b-org-mg-powershell
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a management group named **mg-landingzones** and a subscription named **Sub-AVD-Prod** that has the ID 11111111-2222-3333-4444-555555555555.

    You need to create a management group named **mg-avd** under mg-landingzones, place Sub-AVD-Prod in mg-avd, and assign a policy definition so that it applies to Sub-AVD-Prod and to any subscription added to mg-avd later, but not to other subscriptions.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un groupe d'administration nommé **mg-landingzones** et d'un abonnement nommé **Sub-AVD-Prod** dont l'ID est 11111111-2222-3333-4444-555555555555.

    Vous devez créer un groupe d'administration nommé **mg-avd** sous mg-landingzones, placer Sub-AVD-Prod dans mg-avd et attribuer une définition de stratégie qui s'applique à Sub-AVD-Prod et à tout abonnement ajouté plus tard à mg-avd, mais pas aux autres abonnements.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-AzManagementGroup -GroupName "mg-avd" -DisplayName "Azure Virtual Desktop" `
        -ParentId "/providers/Microsoft.Management/managementGroups/mg-landingzones"

    [[move]] -GroupName "mg-avd" `
        -SubscriptionId "11111111-2222-3333-4444-555555555555"

    $definition = Get-AzPolicyDefinition -Name "avd-require-costcenter"
    New-AzPolicyAssignment -Name "avd-costcenter" -PolicyDefinition $definition `
        -Scope [[scope]]
  slots:
    - id: move
      options:
        - { id: newsub, text: New-AzManagementGroupSubscription }
        - { id: update, text: Update-AzManagementGroup }
        - { id: alias, text: New-AzSubscriptionAlias }
        - { id: ctx, text: Set-AzContext }
    - id: scope
      options:
        - { id: mg, text: "\"/providers/Microsoft.Management/managementGroups/mg-avd\"" }
        - { id: sub, text: "\"/subscriptions/11111111-2222-3333-4444-555555555555\"" }
        - { id: parent, text: "\"/providers/Microsoft.Management/managementGroups/mg-landingzones\"" }
        - { id: tenant, text: "\"/\"" }
answer:
  values: { move: newsub, scope: mg }
explanation:
  correct:
    en: |
      New-AzManagementGroupSubscription adds a subscription to a management group, which removes it from its previous parent. Assigning the policy at the scope of mg-avd, expressed as its full management group ID, makes it apply to every subscription in mg-avd, present and future.
    fr: |
      New-AzManagementGroupSubscription ajoute un abonnement à un groupe d'administration, ce qui le retire de son parent précédent. Attribuer la stratégie à l'étendue de mg-avd, exprimée par son ID complet de groupe d'administration, la fait s'appliquer à chaque abonnement de mg-avd, actuel et futur.
  options:
    update: { en: "Update-AzManagementGroup changes a management group's display name or parent; it doesn't move subscriptions.", fr: "Update-AzManagementGroup change le nom d'affichage ou le parent d'un groupe d'administration ; il ne déplace pas d'abonnements." }
    alias: { en: "New-AzSubscriptionAlias creates a subscription alias (or a new subscription); it doesn't place an existing subscription in a management group.", fr: "New-AzSubscriptionAlias crée un alias d'abonnement (ou un nouvel abonnement) ; il ne place pas un abonnement existant dans un groupe d'administration." }
    ctx: { en: "Set-AzContext selects the subscription for later commands; it doesn't change the hierarchy.", fr: "Set-AzContext sélectionne l'abonnement des commandes suivantes ; il ne modifie pas la hiérarchie." }
    sub: { en: "A subscription-scope assignment wouldn't cover subscriptions added to mg-avd later.", fr: "Une attribution à l'étendue de l'abonnement ne couvrirait pas les abonnements ajoutés plus tard à mg-avd." }
    parent: { en: "Assigning at mg-landingzones would also apply the policy to every other subscription under that management group.", fr: "Une attribution sur mg-landingzones appliquerait aussi la stratégie à tous les autres abonnements de ce groupe d'administration." }
    tenant: { en: "The tenant scope would apply the policy far beyond mg-avd.", fr: "L'étendue du locataire appliquerait la stratégie bien au-delà de mg-avd." }
references:
  - title: Manage your Azure subscriptions at scale with management groups
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/manage
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
