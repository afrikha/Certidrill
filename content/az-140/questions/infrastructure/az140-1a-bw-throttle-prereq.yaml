id: az140-1a-bw-throttle-prereq
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A branch office of Contoso connects to Azure through a site-to-site VPN that is billed by traffic volume. Users of the branch office connect to session hosts of an Azure Virtual Desktop host pool named **HP1**. The **Connection Information** dialog box of their sessions shows the transport **TCP**.

    You plan to deploy a Policy-based QoS policy to the session hosts that sets an outbound throttle rate for `svchost.exe` on UDP source port 3390.

    You need to ensure that the throttle rate applies to the RDP sessions of the branch office users.

    What should you do first?
  fr: |
    Une agence de Contoso se connecte à Azure par un VPN site à site facturé au volume de trafic. Les utilisateurs de l'agence se connectent aux hôtes de session d'un pool d'hôtes Azure Virtual Desktop nommé **HP1**. La boîte de dialogue **Connection Information** de leurs sessions affiche le transport **TCP**.

    Vous prévoyez de déployer sur les hôtes de session une stratégie Policy-based QoS qui définit un débit sortant limité pour `svchost.exe` sur le port source UDP 3390.

    Vous devez faire en sorte que la limitation de débit s'applique aux sessions RDP des utilisateurs de l'agence.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Change the QoS policy so that it throttles TCP port 443 instead of UDP port 3390.", fr: "Modifier la stratégie QoS pour qu'elle limite le port TCP 443 au lieu du port UDP 3390." }
    - id: b
      text: { en: "Enable RDP Shortpath for managed networks on the session hosts and allow inbound UDP 3390.", fr: "Activer RDP Shortpath pour les réseaux managés sur les hôtes de session et autoriser le trafic UDP 3390 entrant." }
    - id: c
      text: { en: "Set RDP Shortpath for public networks via TURN to Enabled in the networking settings of HP1.", fr: "Définir RDP Shortpath pour les réseaux publics via TURN sur Activé dans les paramètres réseau de HP1." }
    - id: d
      text: { en: "Add the DSCP value 46 to the same Policy-based QoS policy before you deploy it.", fr: "Ajouter la valeur DSCP 46 à la même stratégie Policy-based QoS avant de la déployer." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Throttle rate limiting is supported only with RDP Shortpath for managed networks; it isn't supported for the reverse connect transport that the sessions use today. Once the managed-network listener is enabled on the session hosts (UDP 3390 by default) and the port is allowed, the sessions over the VPN move to UDP and the policy that matches UDP source port 3390 can throttle them.
    fr: |
      La limitation de débit n'est prise en charge qu'avec RDP Shortpath pour les réseaux managés ; elle ne l'est pas pour le transport reverse connect qu'utilisent actuellement les sessions. Une fois l'écouteur des réseaux managés activé sur les hôtes de session (UDP 3390 par défaut) et le port autorisé, les sessions passant par le VPN basculent sur UDP et la stratégie qui cible le port source UDP 3390 peut les limiter.
  options:
    a: { en: "TCP 443 carries the reverse connect transport, and throttling isn't supported for reverse connect.", fr: "TCP 443 transporte le reverse connect, et la limitation de débit n'est pas prise en charge pour reverse connect." }
    c: { en: "TURN is already enabled by default, and relayed traffic doesn't come from the UDP 3390 listener; throttling requires the managed-network option.", fr: "TURN est déjà activé par défaut, et le trafic relayé ne provient pas de l'écouteur UDP 3390 ; la limitation exige l'option des réseaux managés." }
    d: { en: "A DSCP mark prioritizes traffic; it doesn't move the sessions off reverse connect, so nothing would match UDP 3390.", fr: "Une marque DSCP donne la priorité au trafic ; elle ne fait pas quitter reverse connect aux sessions, et rien ne correspondrait au port UDP 3390." }
references:
  - title: Remote Desktop Protocol (RDP) bandwidth requirements
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-bandwidth
  - title: Configure RDP Shortpath for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/configure-rdp-shortpath
