id: az140-1b-sa-adds-join-order
objective: "1.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a storage account named **stavdprof03** that will host FSLogix profile containers for session hosts joined to the contoso.com AD DS domain. You downloaded and extracted the AzFilesHybrid module on a domain-joined computer and signed in to Azure by running `Connect-AzAccount` with an account that has the Owner role on stavdprof03.

    You need to enable AD DS authentication on stavdprof03 and confirm that it is enabled.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un compte de stockage nommé **stavdprof03** qui hébergera les conteneurs de profils FSLogix d'hôtes de session joints au domaine AD DS contoso.com. Vous avez téléchargé et extrait le module AzFilesHybrid sur un ordinateur joint au domaine et vous êtes connecté à Azure en exécutant `Connect-AzAccount` avec un compte qui dispose du rôle Owner sur stavdprof03.

    Vous devez activer l'authentification AD DS sur stavdprof03 et vérifier qu'elle est activée.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: copy, text: { en: "Run .\\CopyToPSPath.ps1 from the extracted folder.", fr: "Exécuter .\\CopyToPSPath.ps1 depuis le dossier extrait." } }
    - { id: import, text: { en: "Run Import-Module -Name AzFilesHybrid.", fr: "Exécuter Import-Module -Name AzFilesHybrid." } }
    - { id: join, text: { en: "Run Join-AzStorageAccount with -DomainAccountType \"ComputerAccount\".", fr: "Exécuter Join-AzStorageAccount avec -DomainAccountType \"ComputerAccount\"." } }
    - { id: check, text: { en: "Read AzureFilesIdentityBasedAuth.DirectoryServiceOptions from Get-AzStorageAccount.", fr: "Lire AzureFilesIdentityBasedAuth.DirectoryServiceOptions à partir de Get-AzStorageAccount." } }
    - { id: kerb, text: { en: "Run Set-AzStorageAccount with -EnableAzureActiveDirectoryKerberosForFile $true.", fr: "Exécuter Set-AzStorageAccount avec -EnableAzureActiveDirectoryKerberosForFile $true." } }
    - { id: rotate, text: { en: "Run Update-AzStorageAccountADObjectPassword with -RotateToKerbKey kerb2.", fr: "Exécuter Update-AzStorageAccountADObjectPassword avec -RotateToKerbKey kerb2." } }
answer:
  sequence: [ copy, import, join, check ]
explanation:
  correct:
    en: |
      CopyToPSPath.ps1 copies the extracted module to a PowerShell module path so that Import-Module can load it. Join-AzStorageAccount, a cmdlet of that module, creates the computer account that represents the storage account in AD DS and enables AD DS authentication. Reading AzureFilesIdentityBasedAuth.DirectoryServiceOptions (expected value AD) confirms the result.
    fr: |
      CopyToPSPath.ps1 copie le module extrait dans un chemin de modules PowerShell pour qu'Import-Module puisse le charger. Join-AzStorageAccount, une applet de commande de ce module, crée le compte d'ordinateur qui représente le compte de stockage dans AD DS et active l'authentification AD DS. La lecture de AzureFilesIdentityBasedAuth.DirectoryServiceOptions (valeur attendue AD) confirme le résultat.
  options:
    kerb: { en: "This enables Microsoft Entra Kerberos, a different identity source that can't be combined with AD DS on the same account.", fr: "Cette commande active Microsoft Entra Kerberos, une autre source d'identité qui ne peut pas être combinée à AD DS sur le même compte." }
    rotate: { en: "Password rotation applies after the join, when the domain's password policy requires it; it isn't part of enabling AD DS authentication.", fr: "La rotation du mot de passe intervient après la jonction, quand la stratégie de mot de passe du domaine l'exige ; elle ne fait pas partie de l'activation de l'authentification AD DS." }
references:
  - title: Store FSLogix profile containers on Azure Files and Active Directory Domain Services or Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/fslogix-profile-container-configure-azure-files-active-directory
