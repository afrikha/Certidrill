id: az140-1c-perf-cad-gpu
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has an Azure Virtual Desktop pooled host pool whose session hosts are D16s_v5 virtual machines. Engineers use the host pool to run a 3D CAD application. They report choppy graphics when they rotate models, while CPU usage on the session hosts stays moderate.

    You need to recommend a VM series for the engineers' session hosts that accelerates both application rendering and remote frame encoding.

    What should you recommend?
  fr: |
    Litware, Inc. dispose d'un pool d'hôtes Azure Virtual Desktop regroupé dont les hôtes de session sont des machines virtuelles D16s_v5. Des ingénieurs utilisent ce pool pour exécuter une application de CAO 3D. Ils signalent un affichage saccadé lorsqu'ils font pivoter des modèles, alors que l'utilisation du processeur des hôtes reste modérée.

    Vous devez recommander une série de machines virtuelles pour les hôtes de session des ingénieurs qui accélère à la fois le rendu des applications et l'encodage des images distantes.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "D32s_v5, to double the number of vCPUs", fr: "D32s_v5, pour doubler le nombre de vCPU" } }
    - { id: b, text: { en: "NCv3-series with the NVIDIA CUDA driver", fr: "Série NCv3 avec le pilote NVIDIA CUDA" } }
    - { id: c, text: { en: "NVadsA10 v5-series with the NVIDIA GRID driver", fr: "Série NVadsA10 v5 avec le pilote NVIDIA GRID" } }
    - { id: d, text: { en: "NDv2-series with the NVIDIA GRID driver", fr: "Série NDv2 avec le pilote NVIDIA GRID" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The NVadsA10 v5-series supports GPU rendering and frame encoding (HEVC/H.265 and AVC/H.264) for Azure Virtual Desktop. NVIDIA sizes need the GRID driver, which the NVIDIA GPU Driver Extension installs.
    fr: |
      La série NVadsA10 v5 prend en charge le rendu GPU et l'encodage des images (HEVC/H.265 et AVC/H.264) pour Azure Virtual Desktop. Les tailles NVIDIA exigent le pilote GRID, que l'extension NVIDIA GPU Driver installe.
  options:
    a: { en: "The bottleneck is graphics, not CPU: more vCPUs don't add GPU rendering or encoding.", fr: "Le goulot d'étranglement est graphique, pas processeur : davantage de vCPU n'ajoutent ni rendu ni encodage GPU." }
    b: { en: "NC-series sizes are built for compute, and CUDA drivers don't provide graphics acceleration for the Windows desktop.", fr: "Les tailles de la série NC sont conçues pour le calcul, et les pilotes CUDA n'accélèrent pas l'affichage du bureau Windows." }
    d: { en: "ND-series sizes target machine learning and are on the list of sizes to avoid for Azure Virtual Desktop graphics.", fr: "Les tailles de la série ND visent l'apprentissage automatique et figurent parmi les tailles à éviter pour le graphisme Azure Virtual Desktop." }
references:
  - title: Enable GPU acceleration for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/graphics-enable-gpu-acceleration
