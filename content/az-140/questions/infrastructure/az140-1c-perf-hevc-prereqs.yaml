id: az140-1c-perf-hevc-prereqs
objective: "1.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has an Azure Virtual Desktop host pool whose session hosts are NCasT4_v3-series VMs with GRID driver 16.2 installed. The users' Windows devices support HEVC decoding, have the Microsoft HEVC codec and run a recent version of Windows App.

    Fabrikam plans to enable the **Configure H.265/HEVC hardware encoding for Remote Desktop Connections** policy setting for video editors.

    Which two conditions must also be met for the sessions to use HEVC/H.265 GPU encoding?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'un pool d'hôtes Azure Virtual Desktop dont les hôtes de session sont des machines virtuelles de la série NCasT4_v3 avec le pilote GRID 16.2 installé. Les appareils Windows des utilisateurs prennent en charge le décodage HEVC, disposent du codec HEVC de Microsoft et exécutent une version récente de Windows App.

    Fabrikam prévoit d'activer le paramètre de stratégie **Configure H.265/HEVC hardware encoding for Remote Desktop Connections** pour des monteurs vidéo.

    Quelles sont les deux autres conditions à remplir pour que les sessions utilisent l'encodage GPU HEVC/H.265 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The users connect through a desktop application group.", fr: "Les utilisateurs se connectent via un groupe d'applications de bureau." } }
    - { id: b, text: { en: "The session hosts run Windows Server 2022.", fr: "Les hôtes de session exécutent Windows Server 2022." } }
    - { id: c, text: { en: "The NVIDIA CUDA toolkit is installed alongside the GRID driver.", fr: "Le kit NVIDIA CUDA est installé en plus du pilote GRID." } }
    - { id: d, text: { en: "The multimedia redirection host component isn't installed on the session hosts.", fr: "Le composant hôte de la redirection multimédia n'est pas installé sur les hôtes de session." } }
    - { id: e, text: { en: "The host pool uses depth-first load balancing.", fr: "Le pool d'hôtes utilise l'équilibrage de charge depth-first." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      HEVC/H.265 GPU encoding is supported only for desktop application groups, not RemoteApp, and requires multimedia redirection to be disabled by uninstalling its host component. The other prerequisites are Windows 10 or Windows 11 session hosts, a supported GPU size with GRID 16.2 or later, and clients that can decode HEVC.
    fr: |
      L'encodage GPU HEVC/H.265 n'est pris en charge que pour les groupes d'applications de bureau, pas RemoteApp, et il exige de désactiver la redirection multimédia en désinstallant son composant hôte. Les autres prérequis sont des hôtes de session Windows 10 ou Windows 11, une taille GPU prise en charge avec GRID 16.2 ou ultérieur et des clients capables de décoder HEVC.
  options:
    b: { en: "HEVC encoding requires Windows 10 or Windows 11 session hosts.", fr: "L'encodage HEVC exige des hôtes de session Windows 10 ou Windows 11." }
    c: { en: "CUDA isn't used for Azure Virtual Desktop graphics; the GRID driver is the requirement.", fr: "CUDA n'est pas utilisé pour le graphisme Azure Virtual Desktop ; c'est le pilote GRID qui est exigé." }
    e: { en: "The load balancing algorithm has no effect on the codec used by a session.", fr: "L'algorithme d'équilibrage de charge n'a aucun effet sur le codec utilisé par une session." }
references:
  - title: Enable GPU acceleration for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/graphics-enable-gpu-acceleration
