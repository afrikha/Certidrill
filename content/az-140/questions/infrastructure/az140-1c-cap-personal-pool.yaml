id: az140-1c-cap-personal-pool
objective: "1.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. plans an Azure Virtual Desktop personal host pool named HP-Dev for 180 developers. At peak, 60 developers are connected at the same time. Start VM on Connect will be enabled, and idle session hosts will be deallocated to reduce costs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. prévoit un pool d'hôtes Azure Virtual Desktop personnel nommé HP-Dev pour 180 développeurs. Au pic, 60 développeurs sont connectés en même temps. Start VM on Connect sera activé, et les hôtes de session inactifs seront libérés pour réduire les coûts.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          HP-Dev needs 180 session hosts.
        fr: |
          HP-Dev a besoin de 180 hôtes de session.
    - id: s2
      text:
        en: |
          When a developer connects through Azure Virtual Desktop and their assigned session host is deallocated, Start VM on Connect powers it on.
        fr: |
          Quand un développeur se connecte via Azure Virtual Desktop et que son hôte de session attribué est libéré, Start VM on Connect le démarre.
    - id: s3
      text:
        en: |
          When a developer connects directly to the IP address of their deallocated session host, Start VM on Connect powers it on.
        fr: |
          Quand un développeur se connecte directement à l'adresse IP de son hôte de session libéré, Start VM on Connect le démarre.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A personal host pool maps each user to one session host, so capacity follows the number of assigned users, not peak concurrency. Start VM on Connect powers on the session host assigned to the user when the connection goes through Azure Virtual Desktop. A direct connection by IP address or name, outside the service, doesn't start the VM.
    fr: |
      Un pool d'hôtes personnel associe chaque utilisateur à un hôte de session : la capacité suit le nombre d'utilisateurs attribués, pas la simultanéité de pointe. Start VM on Connect démarre l'hôte de session attribué à l'utilisateur quand la connexion passe par Azure Virtual Desktop. Une connexion directe par adresse IP ou par nom, en dehors du service, ne démarre pas la machine virtuelle.
references:
  - title: Configure Start VM on Connect for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/start-virtual-machine-connect
  - title: Azure Virtual Desktop terminology
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/terminology
