id: az140-sr1-profile-auth-1
objective: "1.2.3"
type: series_yesno
series: az140-sr1-profile-auth
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You enable AD DS authentication on litwareprof1.
  fr: Vous activez l'authentification AD DS sur litwareprof1.
body:
  solution:
    en: |
      You join litwareprof1 to the Litware AD DS domain by using the AzFilesHybrid PowerShell module, and you assign share-level permissions on the profiles share to the users.
    fr: |
      Vous joignez litwareprof1 au domaine AD DS de Litware à l'aide du module PowerShell AzFilesHybrid, et vous attribuez aux utilisateurs des autorisations au niveau du partage sur profiles.
answer: { value: false }
explanation:
  correct:
    en: |
      With AD DS authentication, the clients must have unimpeded network connectivity to the domain controllers to obtain Kerberos tickets. The session hosts of HP1 are Microsoft Entra joined and VNet1 can't reach the on-premises domain controllers, so the users can't authenticate to the share.
    fr: |
      Avec l'authentification AD DS, les clients doivent disposer d'une connectivité réseau directe avec les contrôleurs de domaine pour obtenir des tickets Kerberos. Les hôtes de session de HP1 sont joints à Microsoft Entra et VNet1 ne peut pas joindre les contrôleurs de domaine locaux : les utilisateurs ne peuvent donc pas s'authentifier auprès du partage.
references:
  - title: Overview of Azure Files identity-based authentication for SMB access
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview
