id: az140-1c-cap-host-count
objective: "1.3.6"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank has 2,000 employees. At peak, 45 percent of the employees are connected to Azure Virtual Desktop at the same time. All employees run a medium workload.

    You plan a pooled host pool of Windows 11 Enterprise multi-session session hosts that use the D16s_v5 size (16 vCPUs, 64 GB of RAM). You size the hosts by using the maximum users per vCPU from Microsoft's multi-session sizing guidelines.

    You need to determine the minimum number of session hosts required to support the peak, without additional headroom.

    How many session hosts should you plan?
  fr: |
    Woodgrove Bank compte 2 000 employés. Au pic, 45 % des employés sont connectés en même temps à Azure Virtual Desktop. Tous les employés exécutent une charge de travail moyenne.

    Vous prévoyez un pool d'hôtes regroupé d'hôtes de session Windows 11 Entreprise multisession de taille D16s_v5 (16 vCPU, 64 Go de RAM). Vous dimensionnez les hôtes avec le nombre maximal d'utilisateurs par vCPU des recommandations de dimensionnement multisession de Microsoft.

    Vous devez déterminer le nombre minimal d'hôtes de session nécessaires pour absorber le pic, sans marge supplémentaire.

    Combien d'hôtes de session devez-vous prévoir ?
body:
  options:
    - { id: a, text: "15" }
    - { id: b, text: "29" }
    - { id: c, text: "32" }
    - { id: d, text: "57" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Capacity is sized from concurrent users, not from the headcount: 45 percent of 2,000 is 900 sessions. A medium workload allows four users per vCPU, so a 16-vCPU host supports 64 users. 900 ÷ 64 = 14.06, rounded up to 15 session hosts.
    fr: |
      La capacité se dimensionne à partir des utilisateurs simultanés, pas de l'effectif : 45 % de 2 000 donne 900 sessions. Une charge moyenne autorise quatre utilisateurs par vCPU : un hôte de 16 vCPU prend en charge 64 utilisateurs. 900 ÷ 64 = 14,06, arrondi à 15 hôtes de session.
  options:
    b: { en: "29 uses two users per vCPU (heavy workload): 900 ÷ 32 = 28.1.", fr: "29 utilise deux utilisateurs par vCPU (charge lourde) : 900 ÷ 32 = 28,1." }
    c: { en: "32 sizes for the whole headcount instead of the peak concurrency: 2,000 ÷ 64 = 31.25.", fr: "32 dimensionne pour tout l'effectif au lieu de la simultanéité de pointe : 2 000 ÷ 64 = 31,25." }
    d: { en: "57 counts one user per vCPU (power workload): 900 ÷ 16 = 56.25.", fr: "57 compte un utilisateur par vCPU (charge intensive) : 900 ÷ 16 = 56,25." }
references:
  - title: Session host virtual machine sizing guidelines for Azure Virtual Desktop and Remote Desktop Services
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/virtual-machine-recs
