id: az140-1d-img-oobe-cdrom
objective: "1.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You created a golden image manually from a build virtual machine named **vm-build**. Before running Sysprep, you applied a hardening script to vm-build that disables SMBv1, the Print Spooler service and the removable storage drivers, including the CD/DVD-ROM driver. You captured vm-build as version 2.0.0 of a generalized image definition in an Azure Compute Gallery. You kept a snapshot of the OS disk taken before the hardening script ran.

    Session hosts that you deploy from version 2.0.0 never finish provisioning: they stay at the Windows out-of-box experience (OOBE) and don't join the domain.

    What should you do?
  fr: |
    Vous avez créé manuellement une image de référence à partir d'une machine virtuelle de build nommée **vm-build**. Avant d'exécuter Sysprep, vous avez appliqué à vm-build un script de durcissement qui désactive SMBv1, le service Spouleur d'impression et les pilotes de stockage amovible, dont le pilote du lecteur de CD/DVD. Vous avez capturé vm-build comme version 2.0.0 d'une définition d'image généralisée dans une galerie Azure Compute Gallery. Vous avez conservé un instantané du disque du système d'exploitation pris avant l'exécution du script de durcissement.

    Les hôtes de session que vous déployez à partir de la version 2.0.0 ne terminent jamais leur provisionnement : ils restent bloqués à l'expérience OOBE (out-of-box experience) de Windows et ne rejoignent pas le domaine.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the C:\\Windows\\Panther folder on each new session host, then restart it.", fr: "Supprimer le dossier C:\\Windows\\Panther sur chaque nouvel hôte de session, puis le redémarrer." } }
    - { id: b, text: { en: "Capture the next version from a VM in which the CD/DVD-ROM driver stays enabled.", fr: "Capturer la version suivante à partir d'une machine virtuelle dont le pilote de CD/DVD reste activé." } }
    - { id: c, text: { en: "Capture the next version from a VM in which the Print Spooler service stays enabled.", fr: "Capturer la version suivante à partir d'une machine virtuelle dont le service Spouleur d'impression reste activé." } }
    - { id: d, text: { en: "Capture the next version to a specialized image definition instead.", fr: "Capturer plutôt la version suivante dans une définition d'image spécialisée." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When Azure creates a VM from a generalized image, it mounts an ISO on the DVD-ROM drive to complete provisioning. If the CD/DVD-ROM driver is disabled, the VM stays at OOBE. Create a VM from the snapshot, apply the hardening without disabling the driver (or re-enable it), then run Sysprep and capture a new version.
    fr: |
      Quand Azure crée une machine virtuelle à partir d'une image généralisée, il monte une image ISO sur le lecteur de DVD pour terminer le provisionnement. Si le pilote du lecteur de CD/DVD est désactivé, la machine virtuelle reste bloquée à l'OOBE. Créez une machine virtuelle à partir de l'instantané, appliquez le durcissement sans désactiver le pilote (ou réactivez-le), puis exécutez Sysprep et capturez une nouvelle version.
  options:
    a:
      en: Deleting the Panther folder prevents Sysprep failures on the build VM; it doesn't help a VM stuck at OOBE.
      fr: Supprimer le dossier Panther évite des échecs de Sysprep sur la machine virtuelle de build ; cela n'aide pas une machine virtuelle bloquée à l'OOBE.
    c:
      en: The Print Spooler service isn't needed to provision a VM; a disabled spooler only affects printing.
      fr: Le service Spouleur d'impression n'est pas nécessaire au provisionnement d'une machine virtuelle ; un spouleur désactivé n'affecte que l'impression.
    d:
      en: A specialized image keeps the computer name and accounts of the source VM, so every session host would be a duplicate of vm-build.
      fr: |
        Une image spécialisée conserve le nom d'ordinateur et les comptes de la machine virtuelle source : chaque hôte de session serait un doublon de vm-build.
references:
  - title: Remove machine specific information by deprovisioning or generalizing a VM before creating an image
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/generalize
