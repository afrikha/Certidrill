id: az140-1d-lic-cal-rules
objective: "1.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to license Azure Virtual Desktop session hosts that run Windows Server by using RDS CALs. A Remote Desktop license server will issue the CALs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de couvrir par des licences des hôtes de session Azure Virtual Desktop qui exécutent Windows Server à l'aide de CAL RDS. Un serveur de licences Bureau à distance délivrera les CAL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Windows Server 2025 RDS CAL allows a user to connect to a session host that runs Windows Server 2022.
        fr: Une CAL RDS Windows Server 2025 permet à un utilisateur de se connecter à un hôte de session qui exécute Windows Server 2022.
    - id: s2
      text:
        en: Windows Server 2025 RDS CALs can be installed on a license server that runs Windows Server 2022.
        fr: Des CAL RDS Windows Server 2025 peuvent être installées sur un serveur de licences qui exécute Windows Server 2022.
    - id: s3
      text:
        en: Per User RDS CALs can be used with session hosts that are members of a workgroup.
        fr: Des CAL RDS Par utilisateur peuvent être utilisées avec des hôtes de session membres d'un groupe de travail.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A newer CAL can access older session hosts, so 2025 CALs work with Windows Server 2016 to 2025 hosts. CALs must be installed on a license server that runs the same Windows Server version or later, so 2025 CALs need a 2025 license server. Per User CALs are assigned to users in Active Directory and can't be tracked in a workgroup: workgroup session hosts must use Per Device CALs.
    fr: |
      Une CAL plus récente permet d'accéder à des hôtes de session plus anciens : les CAL 2025 fonctionnent avec des hôtes Windows Server 2016 à 2025. Les CAL doivent être installées sur un serveur de licences qui exécute la même version de Windows Server ou une version ultérieure : les CAL 2025 exigent un serveur de licences 2025. Les CAL Par utilisateur sont attribuées aux utilisateurs dans Active Directory et ne peuvent pas être suivies dans un groupe de travail : des hôtes de session en groupe de travail doivent utiliser des CAL Par appareil.
references:
  - title: License Remote Desktop Services with Client Access Licenses (CALs)
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-client-access-license
  - title: License Remote Desktop session hosts
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-license-session-hosts
