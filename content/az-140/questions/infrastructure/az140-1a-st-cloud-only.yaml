id: az140-1a-st-cloud-only
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Microsoft Entra tenant in the Azure public cloud. All the users are cloud-only identities. Adatum has no AD DS domain and no Microsoft Entra Domain Services managed domain.

    You plan a pooled Azure Virtual Desktop host pool whose session hosts are Microsoft Entra joined. User profiles will be stored in FSLogix profile containers.

    You need to recommend a storage solution for the profile containers. The solution must not require the deployment of an additional directory service.

    What should you recommend?
  fr: |
    Adatum dispose d'un locataire Microsoft Entra dans le cloud public Azure. Tous les utilisateurs sont des identités cloud uniquement. Adatum n'a ni domaine AD DS ni domaine managé Microsoft Entra Domain Services.

    Vous planifiez un pool d'hôtes Azure Virtual Desktop partagé dont les hôtes de session sont joints à Microsoft Entra. Les profils des utilisateurs seront stockés dans des conteneurs de profils FSLogix.

    Vous devez recommander une solution de stockage pour les conteneurs de profils. La solution ne doit pas exiger le déploiement d'un service d'annuaire supplémentaire.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "An Azure NetApp Files SMB volume with an Active Directory connection", fr: "Un volume SMB Azure NetApp Files avec une connexion Active Directory" }
    - id: b
      text: { en: "An Azure Files share that uses Microsoft Entra Kerberos authentication", fr: "Un partage Azure Files qui utilise l'authentification Microsoft Entra Kerberos" }
    - id: c
      text: { en: "An Azure Files share that uses Microsoft Entra Domain Services authentication", fr: "Un partage Azure Files qui utilise l'authentification Microsoft Entra Domain Services" }
    - id: d
      text: { en: "A Storage Spaces Direct cluster of Azure virtual machines with SMB shares", fr: "Un cluster Storage Spaces Direct de machines virtuelles Azure avec des partages SMB" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft Entra Kerberos lets Microsoft Entra ID issue the Kerberos tickets that give access to the Azure Files share over SMB, and it supports cloud-only identities with FSLogix in the Azure public cloud. Session hosts must be Microsoft Entra joined or hybrid joined, and they don't need line of sight to a domain controller.
    fr: |
      Microsoft Entra Kerberos permet à Microsoft Entra ID d'émettre les tickets Kerberos qui donnent accès au partage Azure Files en SMB, et il prend en charge les identités cloud uniquement avec FSLogix dans le cloud public Azure. Les hôtes de session doivent être joints ou joints hybrides à Microsoft Entra, et n'ont pas besoin d'une visibilité directe sur un contrôleur de domaine.
  options:
    a: { en: "Azure NetApp Files SMB volumes rely on AD DS or Microsoft Entra Domain Services, which Adatum doesn't have.", fr: "Les volumes SMB Azure NetApp Files s'appuient sur AD DS ou Microsoft Entra Domain Services, dont Adatum ne dispose pas." }
    c: { en: "This would require deploying a Microsoft Entra Domain Services managed domain, an additional directory service.", fr: "Cela exigerait de déployer un domaine managé Microsoft Entra Domain Services, un service d'annuaire supplémentaire." }
    d: { en: "Storage Spaces Direct supports only AD DS or Microsoft Entra Domain Services, and it is self-managed.", fr: "Storage Spaces Direct ne prend en charge qu'AD DS ou Microsoft Entra Domain Services, et il est autogéré." }
references:
  - title: Store FSLogix profile containers on Azure Files using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/create-profile-container-azure-ad
  - title: Storage options for FSLogix profile containers in Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/store-fslogix-profile
