id: az140-1d-lic-windows-client-type
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Desktop pooled host pool named **HP-Office**. The session hosts run Windows 11 Enterprise multi-session and were created by a custom script that uses `New-AzVM`, not by the Azure portal. All users who connect to HP-Office have Microsoft 365 E3 licenses.

    You need to ensure that Contoso doesn't pay for a Windows license in the price of the session host virtual machines.

    What should you do?
  fr: |
    Contoso dispose d'un pool d'hôtes regroupé Azure Virtual Desktop nommé **HP-Office**. Les hôtes de session exécutent Windows 11 Entreprise multisession et ont été créés par un script personnalisé qui utilise `New-AzVM`, et non par le portail Azure. Tous les utilisateurs qui se connectent à HP-Office disposent de licences Microsoft 365 E3.

    Vous devez vous assurer que Contoso ne paie pas de licence Windows dans le prix des machines virtuelles hôtes de session.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the LicenseType property of each session host to Windows_Server.", fr: "Définir la propriété LicenseType de chaque hôte de session sur Windows_Server." } }
    - { id: b, text: { en: "Enroll the subscription in per-user access pricing.", fr: "Inscrire l'abonnement à la tarification de l'accès par utilisateur." } }
    - { id: c, text: { en: "Set the LicenseType property of each session host to Windows_Client.", fr: "Définir la propriété LicenseType de chaque hôte de session sur Windows_Client." } }
    - { id: d, text: { en: "Point the session hosts at a Remote Desktop license server that has RDS CALs.", fr: "Faire pointer les hôtes de session vers un serveur de licences Bureau à distance qui dispose de CAL RDS." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft 365 E3 is an eligible license for Windows client session hosts, so the virtual machines can run without a separate Windows license. The portal and the Microsoft templates apply it automatically; for hosts created another way, set `LicenseType` to `Windows_Client` on each VM and run `Update-AzVM`. `Get-AzVM` then shows `LicenseType : Windows_Client`.
    fr: |
      Microsoft 365 E3 est une licence éligible pour les hôtes de session Windows client : les machines virtuelles peuvent fonctionner sans licence Windows distincte. Le portail et les modèles Microsoft l'appliquent automatiquement ; pour des hôtes créés autrement, définissez `LicenseType` sur `Windows_Client` sur chaque machine virtuelle et exécutez `Update-AzVM`. `Get-AzVM` affiche alors `LicenseType : Windows_Client`.
  options:
    a:
      en: Windows_Server is the Azure Hybrid Benefit value for Windows Server virtual machines, not for Windows 11 session hosts.
      fr: Windows_Server est la valeur Azure Hybrid Benefit des machines virtuelles Windows Server, pas des hôtes de session Windows 11.
    b:
      en: Per-user access pricing is for external users only; internal users with Microsoft 365 E3 already have access rights.
      fr: La tarification de l'accès par utilisateur est réservée aux utilisateurs externes ; les utilisateurs internes dotés de Microsoft 365 E3 ont déjà les droits d'accès.
    d:
      en: RDS CALs license Windows Server session hosts; they don't change the price of Windows 11 virtual machines.
      fr: Les CAL RDS concernent les hôtes de session Windows Server ; elles ne changent pas le prix des machines virtuelles Windows 11.
references:
  - title: Apply Windows license to session host virtual machines
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/apply-windows-license
