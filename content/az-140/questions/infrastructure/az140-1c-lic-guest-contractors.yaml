id: az140-1c-lic-guest-contractors
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has a Microsoft Entra tenant named adatum.com and an Azure Virtual Desktop pooled host pool whose session hosts run Windows 11 Enterprise multi-session.

    Adatum hires 30 contractors from Proseware, Inc. to work on an internal project. The contractors are invited to adatum.com as guest (B2B) users. Each contractor already has a Microsoft 365 E3 license in the proseware.com tenant.

    You need to ensure that the contractors are properly licensed to use the host pool.

    What should you do?
  fr: |
    Adatum Corporation dispose d'un locataire Microsoft Entra nommé adatum.com et d'un pool d'hôtes Azure Virtual Desktop regroupé dont les hôtes de session exécutent Windows 11 Entreprise multisession.

    Adatum engage 30 prestataires de Proseware, Inc. pour un projet interne. Les prestataires sont invités dans adatum.com en tant qu'utilisateurs invités (B2B). Chaque prestataire dispose déjà d'une licence Microsoft 365 E3 dans le locataire proseware.com.

    Vous devez vous assurer que les prestataires disposent des licences appropriées pour utiliser le pool d'hôtes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Rely on the Microsoft 365 E3 licenses in the proseware.com tenant", fr: "S'appuyer sur les licences Microsoft 365 E3 du locataire proseware.com" } }
    - { id: b, text: { en: "Enroll the Azure subscription in per-user access pricing", fr: "Inscrire l'abonnement Azure à la tarification de l'accès par utilisateur" } }
    - { id: c, text: { en: "Assign Microsoft 365 E3 licenses to the guest accounts in adatum.com", fr: "Attribuer des licences Microsoft 365 E3 aux comptes invités dans adatum.com" } }
    - { id: d, text: { en: "Buy an RDS per-user CAL with Software Assurance for each contractor", fr: "Acheter une CAL RDS par utilisateur avec Software Assurance pour chaque prestataire" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Contractors who work for Adatum are internal users, even with guest identities. A license assigned in their home tenant generally doesn't grant rights in another tenant, so Adatum assigns an eligible license, such as Microsoft 365 E3, to each guest account in adatum.com.
    fr: |
      Des prestataires qui travaillent pour Adatum sont des utilisateurs internes, même avec des identités invitées. Une licence attribuée dans leur locataire d'origine ne donne généralement aucun droit dans un autre locataire : Adatum attribue donc une licence éligible, telle que Microsoft 365 E3, à chaque compte invité dans adatum.com.
  options:
    a: { en: "Licenses assigned in the collaborator's home tenant generally confer no Azure Virtual Desktop rights in adatum.com.", fr: "Les licences attribuées dans le locataire d'origine du collaborateur ne donnent généralement aucun droit Azure Virtual Desktop dans adatum.com." }
    b: { en: "Per-user access pricing is for external commercial purposes and isn't a way to enable guest accounts.", fr: "La tarification de l'accès par utilisateur sert l'usage commercial externe et n'est pas un moyen d'activer des comptes invités." }
    d: { en: "RDS CALs license Windows Server session hosts, not Windows 11 Enterprise multi-session.", fr: "Les CAL RDS couvrent les hôtes de session Windows Server, pas Windows 11 Entreprise multisession." }
references:
  - title: Licensing Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/licensing
