id: az140-1d-mod-version-properties
objective: "1.5.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    An Azure Compute Gallery named **galAvd** contains an image definition named **win11-multi**. Version 1.5.0 of win11-multi is replicated to West Europe and is used to deploy Azure Virtual Desktop session hosts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une galerie Azure Compute Gallery nommée **galAvd** contient une définition d'image nommée **win11-multi**. La version 1.5.0 de win11-multi est répliquée dans West Europe et sert à déployer des hôtes de session Azure Virtual Desktop.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add a new application to version 1.5.0 by updating the image version.
        fr: Vous pouvez ajouter une nouvelle application à la version 1.5.0 en mettant à jour la version d'image.
    - id: s2
      text:
        en: You can change the end-of-life date of version 1.5.0.
        fr: Vous pouvez modifier la date de fin de vie de la version 1.5.0.
    - id: s3
      text:
        en: You can add North Europe as a target region of version 1.5.0.
        fr: Vous pouvez ajouter North Europe comme région cible de la version 1.5.0.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The only properties of an image version that you can update are its target regions, regional replica counts, exclude from latest and end-of-life date. Its content can't change: to add an application, you build and publish a new version, for example 1.6.0, and deploy session hosts from it.
    fr: |
      Les seules propriétés modifiables d'une version d'image sont ses régions cibles, le nombre de réplicas par région, l'exclusion de la plus récente (exclude from latest) et la date de fin de vie. Son contenu ne peut pas changer : pour ajouter une application, vous construisez et publiez une nouvelle version, par exemple 1.6.0, et déployez les hôtes de session à partir d'elle.
references:
  - title: Store and share images in an Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
