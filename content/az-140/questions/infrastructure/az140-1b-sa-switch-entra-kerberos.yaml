id: az140-1b-sa-switch-entra-kerberos
objective: "1.2.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a storage account named **stavdprof04** that is joined to the contoso.com AD DS domain and hosts FSLogix profile containers. Contoso is replacing its domain-joined session hosts with Microsoft Entra joined session hosts that have no line of sight to a domain controller. The users are hybrid identities synced by Microsoft Entra Connect.

    You need the new session hosts to use the profile share in stavdprof04. The solution must keep using stavdprof04.

    Which three actions should you perform in sequence on the storage side? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un compte de stockage nommé **stavdprof04** joint au domaine AD DS contoso.com, qui héberge des conteneurs de profils FSLogix. Contoso remplace ses hôtes de session joints au domaine par des hôtes de session joints à Microsoft Entra sans visibilité directe sur un contrôleur de domaine. Les utilisateurs sont des identités hybrides synchronisées par Microsoft Entra Connect.

    Vous devez permettre aux nouveaux hôtes de session d'utiliser le partage de profils de stavdprof04. La solution doit continuer à utiliser stavdprof04.

    Quelles sont les trois actions à effectuer dans l'ordre côté stockage ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: disable, text: { en: "Disable AD DS authentication on stavdprof04.", fr: "Désactiver l'authentification AD DS sur stavdprof04." } }
    - { id: enable, text: { en: "Enable Microsoft Entra Kerberos authentication on stavdprof04.", fr: "Activer l'authentification Microsoft Entra Kerberos sur stavdprof04." } }
    - { id: consent, text: { en: "Grant admin consent to the stavdprof04 application in Microsoft Entra ID.", fr: "Accorder le consentement administrateur à l'application de stavdprof04 dans Microsoft Entra ID." } }
    - { id: aadds, text: { en: "Enable Microsoft Entra Domain Services authentication on stavdprof04.", fr: "Activer l'authentification Microsoft Entra Domain Services sur stavdprof04." } }
    - { id: rejoin, text: { en: "Run Join-AzStorageAccount with -DomainAccountType \"ServiceLogonAccount\".", fr: "Exécuter Join-AzStorageAccount avec -DomainAccountType \"ServiceLogonAccount\"." } }
    - { id: nokey, text: { en: "Disable storage account key access on stavdprof04.", fr: "Désactiver l'accès par clé du compte de stockage sur stavdprof04." } }
answer:
  sequence: [ disable, enable, consent ]
explanation:
  correct:
    en: |
      A storage account supports only one identity source, so AD DS authentication must be disabled before Microsoft Entra Kerberos can be enabled. Enabling Microsoft Entra Kerberos creates an application registration for the storage account; an administrator must then grant admin consent to it so that users can get tickets for the share. Microsoft Entra Kerberos doesn't require line of sight to a domain controller from the session hosts.
    fr: |
      Un compte de stockage ne prend en charge qu'une seule source d'identité : l'authentification AD DS doit être désactivée avant de pouvoir activer Microsoft Entra Kerberos. L'activation de Microsoft Entra Kerberos crée une inscription d'application pour le compte de stockage ; un administrateur doit ensuite lui accorder le consentement administrateur pour que les utilisateurs puissent obtenir des tickets pour le partage. Microsoft Entra Kerberos n'exige pas de visibilité directe sur un contrôleur de domaine depuis les hôtes de session.
  options:
    aadds: { en: "Microsoft Entra Domain Services authentication requires session hosts joined to a Microsoft Entra Domain Services domain.", fr: "L'authentification Microsoft Entra Domain Services exige des hôtes de session joints à un domaine Microsoft Entra Domain Services." }
    rejoin: { en: "Changing the AD DS account type keeps AD DS authentication, which needs line of sight to a domain controller.", fr: "Changer le type de compte AD DS conserve l'authentification AD DS, qui exige une visibilité directe sur un contrôleur de domaine." }
    nokey: { en: "Disabling key access isn't part of the identity change, and the key is still useful to set permissions on the share.", fr: "Désactiver l'accès par clé ne fait pas partie du changement d'identité, et la clé reste utile pour définir les autorisations du partage." }
references:
  - title: Enable Microsoft Entra Kerberos authentication for hybrid and cloud-only identities on Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-auth-hybrid-identities-enable
