id: az140-1b-share-cloudonly-acl
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has no AD DS domain. Its Azure Virtual Desktop session hosts are Microsoft Entra joined, and all users are cloud-only Microsoft Entra identities. Microsoft Entra Kerberos is enabled on a storage account named **sttailprof01**, admin consent is granted, and the default share-level permission is Storage File Data SMB Share Contributor.

    You need to apply the recommended FSLogix NTFS permissions to the root of the **profiles** share. The solution must use the method that Microsoft recommends for cloud-only identities.

    What should you use?
  fr: |
    Tailspin Toys n'a pas de domaine AD DS. Ses hôtes de session Azure Virtual Desktop sont joints à Microsoft Entra, et tous les utilisateurs sont des identités Microsoft Entra cloud uniquement. Microsoft Entra Kerberos est activé sur un compte de stockage nommé **sttailprof01**, le consentement administrateur est accordé, et l'autorisation par défaut au niveau du partage est Storage File Data SMB Share Contributor.

    Vous devez appliquer les autorisations NTFS FSLogix recommandées à la racine du partage **profiles**. La solution doit utiliser la méthode recommandée par Microsoft pour les identités cloud uniquement.

    Qu'est-ce que vous devez utiliser ?
body:
  options:
    - id: a
      text: { en: "The Security tab of Windows File Explorer on a session host", fr: "L'onglet Sécurité de l'Explorateur de fichiers Windows sur un hôte de session" }
    - id: b
      text: { en: "The Manage access tab of the file share in the Azure portal", fr: "L'onglet Gérer l'accès du partage de fichiers dans le portail Azure" }
    - id: c
      text: { en: "The default share-level permission set to Storage File Data SMB Share Elevated Contributor", fr: "L'autorisation par défaut au niveau du partage définie sur Storage File Data SMB Share Elevated Contributor" }
    - id: d
      text: { en: "A Group Policy object linked to the session hosts' organizational unit", fr: "Un objet de stratégie de groupe lié à l'unité d'organisation des hôtes de session" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Once Microsoft Entra Kerberos is configured, the file share shows a Manage access tab in the Azure portal, which Microsoft recommends for setting the FSLogix permissions for cloud-only and external identities. Windows File Explorer doesn't support setting directory and file permissions for cloud-only identities.
    fr: |
      Une fois Microsoft Entra Kerberos configuré, le partage de fichiers affiche un onglet Gérer l'accès dans le portail Azure, que Microsoft recommande pour définir les autorisations FSLogix des identités cloud uniquement et externes. L'Explorateur de fichiers Windows ne prend pas en charge la définition des autorisations de répertoires et de fichiers pour les identités cloud uniquement.
  options:
    a: { en: "Configuring directory and file permissions in Windows File Explorer isn't supported for cloud-only identities.", fr: "La configuration des autorisations de répertoires et de fichiers dans l'Explorateur de fichiers Windows n'est pas prise en charge pour les identités cloud uniquement." }
    c: { en: "A share-level role controls access to the share, not the NTFS permissions on its folders.", fr: "Un rôle au niveau du partage contrôle l'accès au partage, pas les autorisations NTFS de ses dossiers." }
    d: { en: "Tailspin has no AD DS domain, so there are no Group Policy objects or OUs, and Group Policy doesn't set ACLs on an Azure file share.", fr: "Tailspin n'a pas de domaine AD DS : il n'y a ni objets de stratégie de groupe ni unités d'organisation, et une stratégie de groupe ne définit pas les listes ACL d'un partage de fichiers Azure." }
references:
  - title: Store FSLogix profile containers on Azure Files using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/fslogix/how-to-configure-profile-container-entra-id-hybrid
  - title: Enable Microsoft Entra Kerberos authentication for hybrid and cloud-only identities on Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-auth-hybrid-identities-enable
