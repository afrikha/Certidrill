id: az140-1a-bw-estimate-method
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to move the 120 users of a branch office to an Azure Virtual Desktop host pool named **HP1**. The branch office connects to the internet through a 200 Mbps link that is shared with other applications.

    You need to determine the bandwidth that the RDP sessions of the branch office users will require on the link. The estimate must be as accurate as possible.

    What should you do?
  fr: |
    Contoso prévoit de migrer les 120 utilisateurs d'une agence vers un pool d'hôtes Azure Virtual Desktop nommé **HP1**. L'agence se connecte à Internet par une liaison de 200 Mbit/s partagée avec d'autres applications.

    Vous devez déterminer la bande passante dont les sessions RDP des utilisateurs de l'agence auront besoin sur la liaison. L'estimation doit être la plus précise possible.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Multiply the number of users by the idle-session figure of Microsoft's RDP bandwidth reference table.", fr: "Multiplier le nombre d'utilisateurs par la valeur de session inactive du tableau de référence de bande passante RDP de Microsoft." }
    - id: b
      text: { en: "Run avdnettest.exe on a client device in the branch office and read the reported bandwidth.", fr: "Exécuter avdnettest.exe sur un appareil client de l'agence et lire la bande passante signalée." }
    - id: c
      text: { en: "Run a pilot and monitor real user connections with performance counters or network equipment.", fr: "Mener un pilote et surveiller les connexions réelles des utilisateurs avec les compteurs de performances ou l'équipement réseau." }
    - id: d
      text: { en: "Run the Azure Virtual Desktop Agent URL Tool on a session host of HP1 and review its output.", fr: "Exécuter l'outil Azure Virtual Desktop Agent URL Tool sur un hôte de session de HP1 et examiner sa sortie." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      RDP has no fixed bandwidth: it adapts to the content, the frame rate and the resolution of each session. Microsoft states that the best way to establish the real requirement is to monitor real user connections with the built-in performance counters or with network equipment; the reference table is only a fallback for estimates.
    fr: |
      RDP n'a pas de bande passante fixe : il s'adapte au contenu, à la fréquence d'images et à la résolution de chaque session. Microsoft indique que la meilleure façon d'établir le besoin réel est de surveiller des connexions réelles d'utilisateurs avec les compteurs de performances intégrés ou l'équipement réseau ; le tableau de référence n'est qu'une solution de repli pour une estimation.
  options:
    a: { en: "An idle session uses almost nothing (about 0.3 Kbps), so this figure would grossly underestimate active sessions.", fr: "Une session inactive n'utilise presque rien (environ 0,3 Kbit/s) : cette valeur sous-estimerait fortement les sessions actives." }
    b: { en: "avdnettest.exe checks STUN and TURN reachability and the NAT type; it doesn't measure the bandwidth that sessions consume.", fr: "avdnettest.exe vérifie l'accessibilité de STUN et de TURN et le type de NAT ; il ne mesure pas la bande passante consommée par les sessions." }
    d: { en: "The Agent URL Tool checks that a session host can reach the required endpoints; it says nothing about bandwidth.", fr: "L'outil Agent URL Tool vérifie qu'un hôte de session peut joindre les points de terminaison requis ; il n'indique rien sur la bande passante." }
references:
  - title: Remote Desktop Protocol (RDP) bandwidth requirements
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/rdp-bandwidth
