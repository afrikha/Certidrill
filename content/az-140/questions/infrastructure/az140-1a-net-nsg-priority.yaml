id: az140-1a-net-nsg-priority
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The session hosts of an Azure Virtual Desktop host pool named **HP1** are in a subnet associated with a network security group named **NSG-Hosts**. No other NSG applies. After a security team change, all the session hosts appear as **Unavailable**. NSG-Hosts contains the following outbound security rules.

    | Priority | Name | Port | Destination | Action |
    | --- | --- | --- | --- | --- |
    | 100 | Deny-Internet | Any | Internet | Deny |
    | 200 | Allow-AVD | TCP 443 | WindowsVirtualDesktop | Allow |
    | 210 | Allow-Entra | TCP 443 | AzureActiveDirectory | Allow |
    | 220 | Allow-Monitor | TCP 443 | AzureMonitor | Allow |
    | 65000 | AllowVnetOutBound | Any | VirtualNetwork | Allow |
    | 65001 | AllowInternetOutBound | Any | Internet | Allow |
    | 65500 | DenyAllOutBound | Any | Any | Deny |

    You need to make the session hosts available again. Internet traffic that isn't explicitly allowed must remain blocked.

    What should you do?
  fr: |
    Les hôtes de session d'un pool d'hôtes Azure Virtual Desktop nommé **HP1** se trouvent dans un sous-réseau associé à un groupe de sécurité réseau nommé **NSG-Hosts**. Aucun autre NSG ne s'applique. Après une modification de l'équipe de sécurité, tous les hôtes de session apparaissent comme **Unavailable**. NSG-Hosts contient les règles de sécurité sortantes suivantes.

    | Priorité | Nom | Port | Destination | Action |
    | --- | --- | --- | --- | --- |
    | 100 | Deny-Internet | Any | Internet | Deny |
    | 200 | Allow-AVD | TCP 443 | WindowsVirtualDesktop | Allow |
    | 210 | Allow-Entra | TCP 443 | AzureActiveDirectory | Allow |
    | 220 | Allow-Monitor | TCP 443 | AzureMonitor | Allow |
    | 65000 | AllowVnetOutBound | Any | VirtualNetwork | Allow |
    | 65001 | AllowInternetOutBound | Any | Internet | Allow |
    | 65500 | DenyAllOutBound | Any | Any | Deny |

    Vous devez rendre les hôtes de session à nouveau disponibles. Le trafic Internet qui n'est pas explicitement autorisé doit rester bloqué.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the priority of Deny-Internet to 4000.", fr: "Changer la priorité de Deny-Internet en 4000." }
    - id: b
      text: { en: "Add an inbound rule that allows TCP 443 from WindowsVirtualDesktop.", fr: "Ajouter une règle entrante qui autorise TCP 443 depuis WindowsVirtualDesktop." }
    - id: c
      text: { en: "Delete the AllowInternetOutBound default rule.", fr: "Supprimer la règle par défaut AllowInternetOutBound." }
    - id: d
      text: { en: "Change the destination of Allow-AVD to VirtualNetwork.", fr: "Changer la destination d'Allow-AVD en VirtualNetwork." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      NSG rules are processed by priority, lowest number first, and processing stops at the first match. The public addresses of the WindowsVirtualDesktop, AzureActiveDirectory and AzureMonitor service tags are part of the Internet service tag, so Deny-Internet at priority 100 blocks them before the allow rules are evaluated. With Deny-Internet at 4000, the allow rules match first and every other internet destination is still denied.
    fr: |
      Les règles NSG sont traitées par priorité, du plus petit numéro au plus grand, et le traitement s'arrête à la première correspondance. Les adresses publiques des étiquettes de service WindowsVirtualDesktop, AzureActiveDirectory et AzureMonitor font partie de l'étiquette de service Internet : Deny-Internet à la priorité 100 les bloque avant l'évaluation des règles d'autorisation. Avec Deny-Internet à 4000, les règles d'autorisation correspondent d'abord, et toutes les autres destinations Internet restent refusées.
  options:
    b: { en: "Session hosts connect outbound to the service; an inbound rule doesn't change the outbound evaluation.", fr: "Les hôtes de session se connectent en sortie au service ; une règle entrante ne modifie pas l'évaluation sortante." }
    c: { en: "Default rules can't be deleted, and AllowInternetOutBound is never reached because Deny-Internet matches first.", fr: "Les règles par défaut ne peuvent pas être supprimées, et AllowInternetOutBound n'est jamais atteinte puisque Deny-Internet correspond d'abord." }
    d: { en: "The Azure Virtual Desktop endpoints are public addresses, not addresses of the virtual network.", fr: "Les points de terminaison Azure Virtual Desktop sont des adresses publiques, pas des adresses du réseau virtuel." }
references:
  - title: Required FQDNs and endpoints for Azure Virtual Desktop
    url: https://learn.microsoft.com/en-us/azure/virtual-desktop/required-fqdn-endpoint
